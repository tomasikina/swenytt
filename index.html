: "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "Därför går det så bra för vänstern i storstäderna", "summaries": {"normal": "I Europas storstäder går vänstern framåt, inte minst i Stockholm där Vänsterpartiets stöd har fördubblats sedan 2010. Forskare pekar på tuff bostadsmarknad som orsak till missnöje mot kapitalismen. Samtidigt vinner Sverigedemokraterna stöd på landsbygden. Segregationen ökar med åldern och påverkar röstbeteenden samt attityder till mångfald.", "trump": "De galna vänsterextremisterna och deras gröna galningar tar över era usla europeiska storstäder medan de riktiga människorna på landsbygden röstar rätt. Stockholm? Total misär med tre miljoner för ett dass. De radikala ungdomarna skyller på kapitalismen istället för sina egna korkade idéer. Patetiskt! Jag byggde murar, de bygger misär.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna skapar segregation som splittrar folket. I storstäderna rasar de unga mot bostadsmisären och pekar på kapitalismen, precis som det ska vara. På landsbygden växer andra reaktionära krafter. Denna olyckliga utveckling kräver ideologisk vaksamhet och utrensning av alla dekadenta influenser som splittrar arbetarklassen."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/innehall/darfor-gar-det-sa-bra-vanstern-storstaderna", "imageUrl": "https://www.dagensarena.se/files/2026/09/stockholm-foto-ole-neitzelwikimedia-300x157.jpeg"}, {"type": "image-right", "heading": "Därför är indexerade statsbidrag årets viktigaste vallöfte", "summaries": {"normal": "Socialdemokraterna föreslår att indexera de generella statsbidragen till kommuner och regioner. Förslaget syftar till att motverka att bidragens värde urholkas av inflation och löneökningar, vilket annars leder till smygbesparingar. Det skulle ge bättre förutsägbarhet och långsiktighet i planeringen av vård, skola och omsorg. Markus Dalström argumenterar för att det förbättrar välfärdens villkor.", "trump": "Lyssnar ni på de svenska socialisterna som vill indexera bidragen? Det är patetiskt. De kan inte ens hålla sina egna kommuner flytande utan att suga mer pengar från folket. Biden skulle ha älskat det här – mer byråkrati, mer slöseri. Jag fixade en stark ekonomi i USA, de borde lära sig av en vinnare istället för att gömma sig bakom teknikaliteter och vänsterns misslyckade välfärdsdrömmar.", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter statsbidragen ruttna i värde medan arbetarnas välfärd förfaller. Jag ser deras smygbesparing som ett angrepp på kollektivet. Indexering är ett steg mot ordning, men vi måste rensa ut alla dekadenta element som vägrar planera för folket. Välfärden tillhör inte de giriga parasiterna – den tillhör staten och framtiden. Försök inte lura oss."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/opinion/darfor-ar-indexerade-statsbidrag-arets-viktigaste-vallofte", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-07t145509709-300x157.jpg"}, {"type": "image-right", "heading": "Medborgarjournalisten Christian Peterson: Därför röstar jag på det här partiet", "summaries": {"normal": "Medborgarjournalisten Christian Peterson förklarar i en artikel varför han röstar på Sverigedemokraterna i valet. Efter att ha granskat AFS och Örebropartiet drar han slutsatsen att SD har den organisatoriska makt och realism som krävs för att omsätta invandringskritisk politik i faktisk förändring. För Peterson väger parlamentariskt inflytande tyngre än att vinna debatter.", "trump": "Christian Peterson fattar ett enormt smart beslut! Många säger det, de verkligen gör det. AFS tappar fokus på helt fel saker, totalt kaos. Örebropartiet är småpotatis. Men Sverigedemokraterna? De har organisationen, den bästa infrastrukturen, och de vinner! För att förändra ett land duger det inte med bara prat, man måste ha makt, precis som jag alltid säger!", "stalin": "Kamrat Peterson förstår äntligen statsapparatens fundamentala lagar. Man kan inte bygga en stat på flyktiga torgmöten eller meningslös agitation på internet. Endast genom järnhård disciplin, en strukturerad apparat och absolut lojalitet mot partilinjen kan massorna kuvas. Alternativ för Sverige sviker disciplinen genom att splittras i meningslösa utrikespolitiska dispyter. Sverigedemokraterna förstår att makten tillhör den som kontrollerar administrationen."}, "date": "8 september, 16:39", "url": "https://samnytt.se/medborgarjournalisten-christian-peterson-darfor-rostar-jag-pa-det-har-partiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08134727/artikelhuvudbild-1-475.jpg"}, {"type": "image-right", "heading": "Netanyahu förvarnades om 7 oktober – gjorde inget", "summaries": {"normal": "Israels premiärminister Benjamin Netanyahu fick en tydlig varning från Förenade arabemiratens president strax före Hamas attack den 7 oktober 2023. Han informerade inte säkerhetscheferna och tog inte hotet på allvar. Enligt Haaretz kunde informationen ha förändrat läget. Tidigare varningar från Shin Bet och Egypten nämns också. Netanyahus kansli förnekar uppgifterna.", "trump": "Folk, det här är en katastrof. Den soffpotatisen Netanyahu fick en rak varning från emiraterna om den galna Hamas-operationen och gjorde absolut ingenting. Han höll det hemligt för sina egna chefer som en riktig tönt. Tusentals döda på hans vakta. Biden skulle ha älskat en sån här soppa. Patetiskt!", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare i Tel Aviv ignorerar uppenbara hot mot sin egen stat. En telefonvarning från arabiska hovet sveptes under mattan medan fienden förberedde slaget. Sådan brottslig nonchalans förtjänar utrensning. Kamrater, se hur de giriga hyenorna sviker sitt folk och leder det mot undergång. Skrattretande patetiskt."}, "date": "8 september, 15:27", "url": "https://www.friatider.se/netanyahu-forvarnades-om-7-oktober-gjorde-inget", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-847.jpg?itok=6mOkggl-"}, {"type": "text", "heading": "Strömmer sträcker ut handen till C", "summaries": {"normal": "Justitieminister Gunnar Strömmer (M) skickar ett öppet brev till C-ledaren Elisabeth Thand Ringqvist där han erbjuder samarbete om skogsägares äganderätt. Moderaterna uppger sig vara beredda att möta Centerpartiets sex krav och vill grundlagsskydda rätten till full ersättning när markanvändningen begränsas på grund av exempelvis skyddade arter.", "trump": "Svenska politikerna kopierar min briljanta taktik! Justitieminister Strömmer skickar kärleksbrev till Centerpartiet och bjuder på kaffe för att rädda skogsägarna. De vill ha full ersättning, precis som jag alltid kräver när fake news försöker stjäla mark. Vänstern hatar skogen, men jag, oj förlåt, de gör en enorm deal. Fantastiskt!", "stalin": "Kamrat Strömmer inser att de trehundratusen skogsägarna måste hållas i schack genom korrekt kompensation när statens naturvård inskränker deras jord. Vi noterar att de borgerliga fraktionerna försöker konsolidera sin makt genom dekret och öppna brev över en kopp kaffe. Avvikelser från partiets fastställda skogspolitik kommer dock att granskas av vaksamma organ."}, "date": "8 september, 16:58", "url": "https://bulletin.nu/strommer-stracker-ut-handen-till-c"}, {"type": "image-right", "heading": "Uber stängde av förare automatiskt – får betala miljarder", "summaries": {"normal": "Uber får rekordböter på över nio miljarder kronor av nederländska dataskyddsmyndigheten för att ha stängt av förare automatiskt utan förvarning. Besluten drabbade bland annat franska chaufförer som anklagades för fusk eller låga betyg. Kritiker ser det som ett exempel på hur plattformar straffar förare som tackar nej till olönsamma körningar.", "trump": "De här galna Uber-typerna stänger av sina egna förare som robotar utan att säga ett ord. Typiskt för de woke-kapitalisterna som hatar vanliga arbetare. Nio miljarder i böter? Bra! Men det räcker inte. De globalistiska algoritmerna är värre än Sleepy Joes gröna deal. Vi behöver riktiga regler, inte denna socialistiska skit.", "stalin": "Dessa profitthungriga klasshyenor i Uber likviderar arbetare med kalla maskiner utan varning. Jag ser hur de dekadenta algoritmerna straffar dem som vägrar slavlön. Det är typiskt för de exploaterande parasiterna att gömma sig bakom affärshemligheter. En sådan fientlig utrensning mot folket förtjänar ingen nåd. Kamrater, vakta er mot dessa fiender."}, "date": "8 september, 15:04", "url": "https://arbetet.se/2026/09/08/uber-stangde-av-forare-automatiskt-far-bota-miljarder", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01093911/uber.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Pisa bekräftar skärmpandemin. Mohamsson: Vi måste motarbeta skärmens makt", "summaries": {"normal": "Pisa 2025 visar en bred nedgång i läsförståelse inom OECD, där sex av sju EU-länder backar. Utbildningsminister Simona Mohamsson (L) pekar på skärmarnas roll både i och utanför skolan som en huvudorsak. Var tredje svensk 15-åring saknar grundläggande läskunskaper. Liberalerna föreslår skärmfria tidiga år, mobilförbud, fler böcker och ny läroplan för att vända trenden.", "trump": "Folk, det är en total katastrof. Dessa skärmberoende losers och deras digitala hyenor har förstört våra barns hjärnor. Varje dag sju timmar skärmtid – patetiskt! Jag älskar böcker, de är fantastiska, de bästa. Vi behöver ett massivt förbud mot dessa apparater som gör ungarna dumma. Liberalerna gör rätt, men de röda idioterna vill ha mer AI och iPads. Sad!", "stalin": "Kamrater, denna skärmpandemi är ett verk av de dekadenta klassförrädarna som förgiftar folkets ungdom med sina blanka apparater. Jag ser hur koncentrationsförmågan vittrar sönder och uthålligheten förintas. Vi måste likvidera denna parasitiska påverkan, införa total utrensning av skärmarna från skolorna och återupprätta läsningens järndisciplin. Motståndarna skall krossas utan pardon."}, "date": "8 september, 15:04", "url": "https://www.di.se/debatt/pisa-bekraftar-den-pagaende-skarmpandemin"}, {"type": "image-right", "heading": "Möt inte Pisa med tvärsäkra svar. Skoltrenden är global", "summaries": {"normal": "Pisa-mätningen visar en global nedgång i 15-åringars kunskaper, särskilt i den rika världen. Artikeln varnar för enkla förklaringar som mobiltelefoner eller covid och kritiserar hur politiker från alla läger använder resultaten för att bekräfta sina egna åsikter. Problemet kräver seriös hantering bortom partipolitik och stickspår som driftsformer.", "trump": "Lyssnar ni på de förlorande globalisterna och deras så kallade Pisa-test? Kunskaperna rasar i hela den rika världen, men de skyller på allt utom sina egna usla idéer. Skärmpandemi? Absolut, men de dekadenta woke-vänstermediasnuten vill bara ha mer identitetspolitik och kvotering. Vi behöver riktiga lösningar, inte mer av Bidens misslyckade skärmskola. Jag fixade det bättre förra gången.", "stalin": "Kamrater, detta kunskapsfall i den dekadenta västvärlden är en varning till alla som tvivlar på partiets linje. De profitthungriga klassförrädarna skyller på skärmar eller virus medan de i hemlighet planerar att förgifta ungdomen med sin imperialistiska propaganda. Jag ler mörkt från historien åt deras panik. Inga ursäkter! Rensa ut alla som vägrar se det alarmerande hotet mot folkets framtid."}, "date": "8 september, 15:04", "url": "https://www.di.se/ledare/mot-inte-pisa-med-tvarsakra-svar", "imageUrl": "https://static.bonniernews.se/ba/6918d2e5-8186-4b15-b6da-aee2019062f6.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-full", "heading": "Finansman om näringslivets hot inför valet: \"Skamligt\"", "summaries": {"normal": "Finansmannen Robert Weil kritiserar i en debattartikel på DN näringslivets stöd till högernationalistiska krafter inför riksdagsvalet. Han varnar för att angrepp mot Centerpartiet och Socialdemokraterna är kortsiktiga och farliga för demokratin. Weil menar att etnonationalistisk politik riskerar att urholka demokratiska institutioner och försvåra långsiktig tillväxt.", "trump": "Titta på den här patetiske finansmannen Weil som gråter över att smarta svenska företagsledare äntligen vaknar och stödjer de verkliga vinnarna istället för de socialistiska förlorarna. De globalistiska Center- och S-kramarna hatar folkets röst. Fantastiskt att näringslivet säger nej till den här vansinniga vänsterexperimentet. Make Sweden Great Again, grabbar!", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska element som nu allierar sig med högernationalistiska krafter. Deras kortsiktiga svek mot arbetarklassen och demokratin är en farlig utveckling. De gräver själva sin grav medan de tror sig vinna. Historien kommer att döma dessa fiender till folkets framtid med den skärpa de förtjänar."}, "date": "8 september, 16:06", "url": "https://www.dagensps.se/varlden/finansman-om-naringslivets-hot-infor-valet-skamligt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlg9nhfhkc9a0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-right", "heading": "Academedia: Resultaten mycket allvarliga", "summaries": {"normal": "Academedia beskriver Sveriges Pisaresultat som mycket allvarliga, särskilt inom läsförståelse där var tredje 15-åring inte når grundnivån. Lotta Krus pekar på behovet av tidiga insatser för språk och läsning istället för att enbart skylla på ökad skärmtid. Politiker lanserar olika förklaringar medan nästan hälften av eleverna använder AI-chattbotar veckovis.", "trump": "Det här är en total katastrof, folk. Den svenska skolan är en fullständig röra där ungarna inte kan läsa. Skärmpandemi? Snälla. Det är den vansinniga vänsterns identitetspolitik och woke-galningar som har förstört allt. Vi behöver riktiga ledare som sätter stopp för de korkade globalisternas experiment. Make schooling great again!", "stalin": "Jag betraktar detta som ett ypperligt bevis på de giriga klassförrädarnas fullständiga misslyckande. Den dekadenta utbildningsapparaten låter ungdomen drunkna i skärmar och maskiner medan läsningen förfaller. Vi måste omedelbart rensa ut dessa odugliga element och återupprätta järndisciplin i de tidiga åren. Annars väntar samhällets sammanbrott."}, "date": "8 september, 14:39", "url": "https://www.di.se/nyheter/academedia-pisaresultaten-mycket-allvarliga", "imageUrl": "https://static.bonniernews.se/ba/154848bb-ff04-43e4-87bd-e727520fbad9.jpeg?crop=8404%2C4202%2Cx0%2Cy430&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Buschs nya besked: SD kan bli helt utan ministerposter", "summaries": {"normal": "Ebba Busch meddelar att Sverigedemokraterna kan komma att stå helt utan ministerposter även i en blågul regering efter valet. KD-ledaren vill vänta till valdagen med förhandlingar och betonar att regeringen kan bestå av ett till fyra partier. Hon kritiserar att regeringsfrågan dominerat valrörelsen och vill istället lyfta partiernas visioner.", "trump": "Lyssnade på den här svenska messen om Ebba Busch som säger att SD inte får några ministerposter. Patetiskt! De där globalistlakejerna i KD är svaga som aldrig förr. Biden skulle ha älskat det här. Jag hade aldrig låtit några fega moderater styra mig så. Sverige behöver en riktig ledare, inte dessa förlorare som böjer sig för vänsterns kvotdårar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom KD redan planerar att marginalisera folkets röst. Jag betraktar med avsmak hur Ebba Busch öppet förbereder en utrensning av SD ur regeringen. För mig är det uppenbart att de profitthungriga borgarhyenorna fruktar en stark nationell linje. Valdagen skall bli deras dom, inte början på nya kompromisser med folkets fiender."}, "date": "8 september, 14:33", "url": "https://www.friatider.se/buschs-nya-besked-sd-kan-bli-helt-utan-ministerposter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-846.jpg"}, {"type": "image-right", "heading": "Espiria Hållbar Framtid ökade 4,5% i augusti – Vestas och Hansa Biopharma lyfte", "summaries": {"normal": "Fonden Espiria Hållbar Framtid A steg 4,5 procent i augusti, vilket var bättre än index. Starka AI-investeringar och gynnsam utveckling inom bland annat hälsovård och vindkraft, där Vestas och Hansa Biopharma lyfte, bidrog positivt. Förvaltarna ser en fortsatt optimistisk bild men varnar för ansträngda värderingar och potentiell volatilitet framöver.", "trump": "Min fond, Espiria, presterar fantastiskt, det säger alla! Vi slog index i augusti med enorma siffror tack vare massiva AI-investeringar som jag i princip har ordnat. Sjuka vindkraftverk rusade 20 procent! Demokraterna skulle säkert krascha detta med höga skatter, men inte jag. Vi vinner så mycket att ni kommer att tröttna på att vinna!", "stalin": "Fonden Espiria växte med 4,5 procent i augusti. En tillfredsställande siffra, men likväl ett bevis på det dekadenta kapitalistiska systemets godtyckliga nycker. Våra ekonomiska kommissarier noterar att Vestas och Hansa Biopharma steg kraftigt. De som misslyckas, såsom CATL med sin nedgång på nio procent, kommer att få sina arbetsmetoder föremål för en mycket noggrann intern granskning."}, "date": "8 september, 15:41", "url": "https://www.affarsvarlden.se/artikel/espiria-hallbar-framtid-okade-45-i-augusti-vestas-och-hansa-biopharma-lyfte", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/12/Vestas-400x266.jpg"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-right", "heading": "Misstänkta torpeder avslöjade av infiltratör – fem svenskar gripna", "summaries": {"normal": "Polis hittade en mordannons i en chatt på Signal. En dansk infiltratör kontaktade uppdragsgivaren och reste till Cypern. Där greps fem svenska män misstänkta för att ha tagit på sig uppdraget att mörda irländska tvillingbröder. Männen har kopplingar till våldsbrott i Sverige och fallet utreds för eventuella band till en irländsk kartell.", "trump": "Folk, ni skulle inte tro det, men dessa svenska torpeder, totala losers, hoppade på ett mordjobb åt en irländsk kartell som om det vore en weekendresa. Tack och lov för den danske infiltratören som gjorde jobbet bättre än Biden någonsin kunde. Rena galningar. Vi behöver inga sådana här våldskapitalister som springer runt i Europa och leker mördare.", "stalin": "Kamrater, se hur de profitthungriga blodsugarhyenorna inom den irländska kartellen rekryterar utländska lakejer för att likvidera konkurrenter. Jag betraktar detta med avsmak från historien. Den danske infiltratören avslöjade deras fega komplott. Vi måste rensa ut alla sådana dekadenta element som hotar arbetarklassens ordning med sina mordkontrakt."}, "date": "8 september, 15:14", "url": "https://www.svt.se/nyheter/utrikes/polis-hittade-mordannons-i-chatt-fem-gripna-pa-cypern-av-infiltrator", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/9f29c165a011dc2181ba77af36d1dd46d019d97f98c9172f532499c7887bc443"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "Så ska S vinna de osäkra väljarna. Här är nio sossiga reformer som kan avgöra valet.", "summaries": {"normal": "Artikeln presenterar nio socialdemokratiska reformer som syftar till att vinna osäkra väljare inför valet. Förslagen inkluderar ökad sysselsättning, förbättrad tandvård, inflationssäkring av välfärden, stopp för vinster inom välfärden, höjda pensioner och barnbidrag, ny kärnkraft, ökat bostadsbyggande samt satsningar för tillväxt. Skribenten kritiserar Tidöregeringens politik och lyfter Socialdemokraternas offensiva program.", "trump": "Lyssnar ni på de här socialisterna? De vill dubbla bidragen, stoppa vinster och bygga kärnkraft som ingen annan kan få till stånd. Under Biden blev allt en katastrof, precis som den här svaga Tidöregeringen. Jag byggde den starkaste ekonomin någonsin. De här förlorarna med sina urholkade välfärdsdrömmar kommer att krossas. Amerika först, och Sverige borde vakna upp innan det är för sent.", "stalin": "Kamrater, dessa dekadenta klassförrädare lovar inflationsskydd och pensioner medan de i hemlighet undergräver folkets välfärd. Jag ser hur de profitthungriga hyenorna inom Tidöalliansen urholkar statens styrka. Vi måste rensa ut alla sådana element. Endast genom kollektiv kamp och järnhård disciplin kan vi likvidera lågkonjunkturen och bygga en sann folkets kraft. Inga kompromisser med fienden."}, "date": "8 september, 14:00", "url": "https://arbetet.se/2026/09/08/sa-ska-s-vinna-de-osakra-valjarna-nio-reformer-som-kan-avgora-valet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08075352/svinst-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Skola tvingade elever att be till Allah – utredning nedlagd", "summaries": {"normal": "Elever på Nyhamnsskolan i Höganäs tvingades knäböja och recitera muslimska böner med frasen \"Allahu akbar\" under en religionskunskapslektion. En förälder anmälde händelsen till Skolinspektionen som inledde tillsyn. Kommunen erkände att information om frivillighet saknades men ansåg att syftet var pedagogiskt. Myndigheten valde att avsluta ärendet utan åtgärd.", "trump": "Kan ni fatta det här vansinnet? I Sverige tvingar de små barn att böja knä för Allah och skrika \"Allahu akbar\" i skolan. Patetiska woke-kommunister och deras mångkulturexperiment håller på att förstöra allt. De glömde till och med att säga att man får tacka nej. Totalt misslyckande! Men jag fixade Amerika, de klarar inte ens en skola.", "stalin": "Se bara hur dessa dekadenta toleranshyenor låter reaktionär mysticism infiltrera våra barns sinnen under förevändning av kunskap. De glömde informera om frivillighet, säger de. Vilken ynklig ursäkt. Jag skulle ha genomfört en grundlig utrensning av sådana farliga element redan vid första rapporten. Inga gudar ska styra folkets skolor utom partiet."}, "date": "8 september, 16:13", "url": "https://riks.se/nyheter/ingen-atgard-mot-skola-som-tvingade-elever-att-be-till-allah", "imageUrl": "https://admin.riks.se/uploads/medium_tvingades_be_islam_hero_f68be000c0.jpg"}, {"type": "image-right", "heading": "Sverigedemokraternas rysskontakter utsätter oss alla för fara", "summaries": {"normal": "Expo har avslöjat att en SD-tjänsteman i riksdagen haft upprepade kontakter med ryska intressen. Tjänstemannen är sambo med Jimmie Åkessons närmaste medarbetare Gustav Gellerbrant. Artikeln lyfter en längre rad incidenter med SD-politiker och Ryssland, och ifrågasätter säkerhetsrisker samt behovet av skärpta granskningar i riksdagen och regeringskansliet.", "trump": "De här patetiska SD-tjänstemännen dansar som marionetter för Putin och hans ryska kumpaner. Gellerbrant och hans sambo borde skämmas! Fake news-mediets vänsterhyenor försöker skrämma väljarna precis som de gjorde mot mig innan jag krossade Biden och de globalistiska förlorarna. Sverige behöver starka ledare, inte dessa svaga ryssälskande töntar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Sverigedemokraterna kryper för ryska intressen och sprider främmande narrativ. Jag betraktar med avsky hur de giriga hyenorna låter sig påverkas av mjuk makt från öst. En sådan kanal in till regeringskansliet utgör ett hot som kräver omedelbar utrensning av alla opålitliga element för att skydda folkets intressen."}, "date": "7 september, 16:11", "url": "https://www.dagensarena.se/opinion/sverigedemokraternas-rysskontakter-utsatter-oss-alla-fara", "imageUrl": "https://www.dagensarena.se/files/2026/09/silvia.jpeg"}, {"type": "image-right", "heading": "AB Sverige behöver en förändring. Replik: Klyftorna har blivit för stora", "summaries": {"normal": "Företagaren Joachim Berner replikerar på Mats Qviberg och kräver byte av både styrelse och vd i ”AB Sverige”. Han varnar för växande klyftor, ökad brottslighet och otillräcklig fördelningspolitik. Berner efterlyser en rättvis skattereform, minskade ränteavdrag och ett hållbart system som gynnar hela samhället istället för en kortsiktig minoritet.", "trump": "Den här Qviberg-killen är en total förlorare som skyddar sina rika polare. AB Sverige håller på att gå i konkurs på grund av galna vänsterextremister och deras identitetspolitik. Vi behöver en riktig skattesänkning, inte mer bidrag till losers. Gör Sverige great again – sparkas ut de giriga eliterna nu!", "stalin": "Kamrater, dessa dekadenta profitthyenor fortsätter att suga musten ur folket medan klyftorna växer. Jag ser hur klassfienderna gömmer sig bakom falsk välvilja och donerar smulor till kulturen. Det är dags att rensa ut dessa parasiterande lakejer och återupprätta en sann folkets fördelning. Solidaritet är inte valfritt."}, "date": "8 september, 13:38", "url": "https://www.di.se/debatt/replik-ab-sverige-behover-en-forandring", "imageUrl": "https://static.bonniernews.se/ba/621db695-fddc-4a69-be67-3c2fce4ebf1b.jpeg?crop=757%2C379%2Cx0%2Cy86&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "9-åringar fick gå ner på knä och be till Allah – skolan: ”Pedagogiskt syfte”", "summaries": {"normal": "Nioåringar på Nyhamnsskolan i Höganäs instruerades under en lektion att gå ner på knä och be en islamisk bön på arabiska. Händelsen anmäldes till Skolinspektionen som lade ner ärendet utan att ta ställning. Skolan har nu stoppat momentet. En docent i konstitutionell rätt kritiserar dock hanteringen och varnar för att barnens negativa religionsfrihet kan ha kränkts.", "trump": "Helt otroligt! En skola i Sverige tvingar små barn att gå på knä och be till Allah! Total katastrof, woke-galenskap när den är som sämst! De säger att det var frivilligt, men ingen visste om det – fake news till försvar! Till och med experterna skakar på huvudet. I USA ber vi till Gud och vinner, vi skulle aldrig tillåta sådant trams!", "stalin": "Dessa svenska pedagoger visar en farlig ideologisk vacklan! Att låta barn utföra riter utan centraldirigering är ett hot mot ordningen. Partiets utskott konstaterar att om böner ska ske, skall de ske i statens regi och under noggrann övervakning. Rektorn har nu insett sitt misstag och disciplinerats. Skolinspektionen visar svaghet som måste åtgärdas omgående."}, "date": "8 september, 14:32", "url": "https://samnytt.se/9-aringar-fick-ga-ner-pa-kna-och-be-till-allah-skolan-pedagogiskt-syfte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08113012/Toppbild1-7.jpg"}, {"type": "image-right", "heading": "Wall Street mot blandad öppning –  handelskonflikten trappas upp", "summaries": {"normal": "Wall Street inleder svagt efter långhelgen tyngd av upptrappade handelstullar från Kanada. Dessutom dras börsen ned av en flygolycka med ett Boeing-plan i Miami samt en omfattande cyberattack mot medicinteknikbolaget Boston Scientific. Samtidigt köper Franklin Templeton en majoritetspost i Stoneshield Capital, och den amerikanska tioårsräntan stiger något till 4,79 procent.", "trump": "Kanada tror att de kan lura USA med sina löjliga tullar! Sunkiga förhandlare misslyckades totalt, men vi sätter dem på plats. Wall Street klarar sig utmärkt ändå, och Boeing samt de svaga cyber-hackarna kommer att få betala priset. Endast 'America First' kan rädda den här röran!", "stalin": "Dessa löjliga kapitalistiska kriser på Wall Street är ett bevis på det dekadenta västs totala förfall. Handelskrig och kraschade flygplan, allt på samma gång! När vi styrde fanns det ordning på torpet, inte data-attacker och svaga börsterminer. Vi noterar detta sabotage med största misstänksamhet."}, "date": "8 september, 14:39", "url": "https://www.affarsvarlden.se/artikel/wall-street-mot-blandad-oppning-handelskonflikten-trappas-upp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/03/sdlYS2Yi4Twq-c-nh-400x267.jpg"}, {"type": "image-full", "heading": "GP frias i förtalsmål", "summaries": {"normal": "Göteborgs tingsrätt har friat Göteborgs-Postens chefredaktör Christofer Ahlqvist på alla punkter i ett mångmiljonmål om grovt förtal. Stämningen väckdes av en kriminellt kopplad man vars godiskedja granskats av tidningen på 2020-talet. Målsäganden döms nu dessutom att betala GP:s och Stampens rättegångskostnader på 1,1 miljoner kronor.", "trump": "Falska nyheter och misslyckade bröder som försöker tysta pressen! De stämde min vän – well, en svensk chefredaktör – men tingsrätten krossade dem totalt. Jag älskar vinnare, och de här modiga reportrarna gjorde en fantastisk granskning av korrupta godisimperier. Nu får förlorarna betala 1,1 miljoner kronor i rättegångskostnader. En enorm seger för yttrandefriheten, tro mig!", "stalin": "Det borgerliga godsimperiets lakejer försökte undergräva tidningens korrekta arbete genom juridisk sabotage. Folkdomstolen – förlåt, tingsrätten – har visat sund respektingivande kraft och friat chefredaktören på alla punkter. Kontrahenterna som dristat sig att hota statens... förlåt, tidningens granskare, döms nu att betala 1,1 miljoner till det allmänna. Lärdom: sabotage mot den sanna linjen straffas alltid."}, "date": "8 september, 13:21", "url": "https://www.gp.se/krim/gps-chefredaktor-frias-i-fortalsmal.eaad0a44-b56d-42c2-af59-3a4d21257a25", "imageUrl": "https://www.gp.se/images/article/eaad0a44-b56d-42c2-af59-3a4d21257a25/images/2uxCKpSRTiAx3lJp-4ph9epAw7WI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Dödliga attacker i Kiev – så fort USA lämnat", "summaries": {"normal": "Minst åtta personer dödades och 63 skadades i ryska attacker mot Ukraina under natten mot tisdag. Attackerna skedde strax efter att USA:s sändebud Steve Witkoff och Jared Kushner lämnat Kiev med tåg. De följde på en överenskommelse om 72 timmars paus i attacker mot Kiev och Moskva. Attackerna riktades mot flera regioner och civil infrastruktur.", "trump": "De där patetiska ryssarna väntade inte ens tills mina killar Witkoff och Kushner hunnit lämna Kiev med tåget innan de började bomba igen. Så mycket för 72-timmars paus. Zelenskyj gråter om vinterstöd medan jag fixar riktiga framsteg. De giriga globalisterna och deras krigsindustri älskar det här. Vi ska avsluta det här cirkusen på mitt sätt, och det blir stort.", "stalin": "Kamrater, se hur de dekadenta krigshundarna bryter sin egen skenheliga paus så fort de amerikanska sändebuden lämnat Kiev. De imperialistiska lakejerna leker med eld medan jag från historiens skugga ler mörkt. Putin, min värdige efterträdare, krossar de fientliga hindren för vårt ryska imperium. Snart kommer en nyttig utrensning bland de svaga."}, "date": "8 september, 14:20", "url": "https://www.svt.se/nyheter/utrikes/dodliga-attacker-i-kiev-sa-fort-usa-lamnat", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/9277f2ced638a905883f6f17f4963223ea9ccae9c1978d5e80f2708b779373f8"}, {"type": "image-right", "heading": "Kristersson varnar för C: ”Fantasier om mittens rike”", "summaries": {"normal": "Ulf Kristersson varnar borgerliga väljare för att en röst på Centerpartiet riskerar att leda till vänsterpolitik. Med valet nära tar Moderaterna sikte på väljare som ogillar SD i regering men vill ha borgerlig politik. Den rutiga flanellskjortan har blivit en symbol i kampanjen. Kristersson anser att Tidöpartierna i praktiken har samregerat med C under mandatperioden.", "trump": "Hör ni det här? Den där Kristersson-killen har helt rätt, de där flanellklädda centerknuttarna är bara vänstervridna globalister i rutig förklädnad. Fantasier om mittens rike? Patetiskt! De vill höja skatterna och hjälpa radikala vänsterextremister. Rösta inte på de woke flanellkommunisterna, det slutar alltid i katastrof. Make Sweden Great Again!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna sliter varandra i stycken inför valet. Jag betraktar med djup tillfredsställelse hur dessa profitthungriga borgarhyenor varnar för varandra medan folket lider. En röst på de flanellklädda opportunisterna leder oundvikligen till utsugning och svaghet. Det är en fars som förtjänar utrensning från historien. Skratta medan de faller."}, "date": "8 september, 14:18", "url": "https://www.svt.se/nyheter/inrikes/ulf-kristersson-sagar-c-i-jakten-pa-borgerliga-valjare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.35/5831cae828ce29e0bc94853fa3d4b745840394b7467ae19b575376bae77306d3"}, {"type": "image-right", "heading": "S och V stoppar SD-förslag om hårdare granskning av föreningar", "summaries": {"normal": "Göteborgs kommunledning med S och V stoppade SD:s förslag om skärpta kontroller av bidragsmottagande föreningar. En PwC-rapport visade oegentligheter i den romska organisationen Trajosko Drom, bland annat bidrag som gått till Netflix, tandläkare och kontantuttag. Majoriteten vill istället minska administrationen för att förbättra stödet till föreningslivet. Förslaget röstades ned med 43 mot 38 röster.", "trump": "De här röda clownerna i Göteborg ger bort 290 miljoner till suspekta föreningar och vägrar kolla vart pengarna tar vägen. Netflix, kiropraktorer och energidryck på skattebetalarnas nota? Patetiskt! Mina vänner i SD har rätt, det är en skandal. De woke-kapitalisterna och romska bidragsblodarna skrattar hela vägen till banken medan folket blir lurade. Gör om, gör rätt!", "stalin": "Jag betraktar med avsmak hur dessa dekadenta klassförrädare i Göteborgs röda styre skyddar parasiterna som slösar bort folkets medel på Netflix och tandläkare. Istället för att rensa ut de giriga opportunisterna sänker de kraven och kallar det förbättring. Sådana fiender till kollektivet förtjänar ingen nåd. Kamrater, vakna upp innan de folkförtryckande hyenorna tömmer statskassan helt."}, "date": "8 september, 15:33", "url": "https://riks.se/nyheter/roda-politiker-stoppar-sd-forslag-om-hardare-granskning-av-foreningar", "imageUrl": "https://admin.riks.se/uploads/medium_nej_foreningsbidrag_hero_11ee0accd7.jpg"}, {"type": "image-right", "heading": "Nytt svenskt bottenrekord i Pisa: \"Mycket allvarligt\"", "summaries": {"normal": "Sveriges 15-åringar presterar sämre än någonsin i Pisa 2025 med bottenresultat i läsförståelse och matematik. Var tredje elev når inte grundnivån i matematik. Skolverket ser ett stort tapp även bland elever med gynnsam socioekonomisk bakgrund. Sverige ligger nu på OECD-genomsnittet men andelen underkvalificerade har ökat markant. Resultaten är mycket allvarliga enligt myndigheten.", "trump": "Folk, det är en katastrof! Sverige rasar ihop i Pisa och får sina sämsta resultat någonsin. De woke-skolorna och den galna kvotergrejen har förstört allt. Även de duktiga kidsen från bra hem dumpar ner i botten. Patetiskt! Biden-era-svaghet spred sig ända till Skandinavien. Vi gör det aldrig så i Amerika, tro mig. Fantastiska resultat kommer när jag styr.", "stalin": "Kamrater, detta är ett föraktligt bevis på hur de giriga klassförrädarna har låtit den socialistiska skolans grundvalar ruttna. Jag betraktar med avsky hur även de mer gynnsamma elementen nu faller som flugor. En utrensning av dessa dekadenta pedagogiska sabotörer är oundviklig. Läsning och räkning är revolutionens verktyg – utan dem väntar bara kaos och fiendens skratt."}, "date": "8 september, 12:51", "url": "https://www.friatider.se/nytt-svenskt-bottenrekord-i-pisa-mycket-allvarligt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-845.jpg?itok=9TE1vyzw"}, {"type": "image-right", "heading": "Antisemitismen i V är ingen olyckshändelse", "summaries": {"normal": "Vänsterpartiets återkommande problem med antisemitism och kopplingar till extrema grupper beror på medvetna politiska vägval snarare än bristande faktakontroll. Flera granskningar visar att företrädare på valsedlar spritt grovt judehat och hyllat terrororganisationer. Partiledningen har under lång tid tolererat dessa strömningar och knutit nära band till organisationer som förordar väpnad kamp, helt utan yttre påverkan.", "trump": "Vänsterpartiet är en total katastrof, fullständigt infiltrerade av radikala extremister som sprider vidriga lögner. Det handlar inte om dålig koll, det är så de vill ha det! De bjuder in terrorister och hyllar våld. Fake news-medierna försöker skydda dem, men listorna är fulla av galningar. Totalt inkompetent ledarskap, de skulle aldrig släppas nära makten!", "stalin": "Kamrater! Vänsterpartiets interna kris visar på uppenbar ideologisk vacklan och bristande kadertrohet. Istället för järnhård disciplin och eliminering av avvikelse, skyller den så kallade ledningen på slarv. Partiet har tillåtit att skadliga element tillåts härja fritt. Vi noterar att brist på ideologisk skärpa ofelbart leder till politiskt förfall. Revisionism tolereras icke!"}, "date": "8 september, 13:01", "url": "https://www.gp.se/ledare/antisemitismen-i-v-ar-ingen-olyckshandelse.6757099f-2397-422a-9a43-acdc4186a659", "imageUrl": "https://www.gp.se/images/byline/226a92ad-4b81-44ac-8280-ce6c08f3bab4/TALL.png?width=3840&quality=75"}, {"type": "image-full", "heading": "Världens äldsta BMW-säljare i konkurs – tusentals mister jobbet", "summaries": {"normal": "Bilbranschen i Europa krisar. Volkswagen planerar att dra ner på 100 000 jobb och halvera modellutbudet på grund av överproduktion och stora förluster. BMW-återförsäljaren Wahl-gruppen har gått i konkurs och i Sverige ökar antalet konkurser bland bilhandlare och verkstäder. Orsaken är minskad köpkraft hos kunderna.", "trump": "Den här europeiska bilskräpindustrin är en total katastrof, folk! Volkswagen blöder som en stucken gris och sparkar ut 100 000 arbetare. BMW-handlaren som funnits sen 1898? Konkurs! De woke kostnaderna och Bidens inflation har krossat kunderna. Europa behöver mig igen, annars blir det bara kinesiska rullar överallt. Patetiskt!", "stalin": "Se hur den kapitalistiska bilindustrin ruttnar inifrån, kamrater. Volkswagen, denna dekadenta parasit, offrar hundratusen arbetare på profitens altare medan fabrikerna sväller av överflödiga maskiner. Konkurserna i Sverige visar imperialismens dödskamp. Fienderna inom bourgeoisie darrar, och rättvist så. Sovjetisk planekonomi skrattar från historien."}, "date": "8 september, 14:36", "url": "https://www.dagensps.se/varlden/1000-jobb-forsvinner-nar-varldens-aldsta-bmw-saljare-konkar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/bmw-emblem.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ung man dog efter fall på Ica-butiks personalfest", "summaries": {"normal": "En ung man i 20-årsåldern som arbetade på Ica i Norrtälje avled efter att ha fallit från hög höjd under butikens 50-årsjubileum på Johannesbergs slott. Festen för 170 anställda slutade i tragedi. Butiken har aktiverat krisstöd med psykologer och extra bemanning. Polisen utreder fallet som mord för att kunna genomföra en full utredning, men det kan röra sig om en olycka. Utanför butiken flaggas det på halv stång och kunder uppmanas till respekt.", "trump": "Folk, det här är en total katastrof. En ung kille ramlar ner från ett slott under en fancy Ica-fest för 170 anställda. Patetiskt! Under Biden blev allt så woke och mjukt att ingen ens kan hålla ordning på en personalfest längre. Nu flaggar de på halv stång och ber om respekt. Mina presidenter gör fester rätt – stora, starka och säkra. De giriga hyenorna som driver de här butikerna borde skämmas.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna festar på slott medan en ung arbetare störtar mot sin död. Deras profitthungriga hyenor kallar det jubileum. Jag säger: sådan vårdslöshet avslöjar hela systemets ruttnande själ. Vi kräver full utrensning av ansvariga. Psykologer och halv stång hjälper inte. Endast ett starkt kollektiv kan skydda arbetarna från dessa blodsugande festarrangörer. Respekt är för svaga."}, "date": "8 september, 12:41", "url": "https://arbetet.se/2026/09/08/ica-anstalld-dog-efter-fall-pa-personalfest-kollegor-far-krisstod", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08124051/olcyka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "MP-topp sprider näthat: \"Kan inte du utvisa dig själv?\"", "summaries": {"normal": "Mattias Ekenberg, Miljöpartiets toppkandidat i Bollebygd och verksam som samtalsterapeut, har spridit näthat på sociala medier. Han har bland annat kallat kritiker för ”nasserasse”, ”lättlurad lallare” och uppmanat personer att återvandra. Ekenberg förespråkar samtidigt omtanke och icke-dömande i sin politik. Riks har granskat hans kommentarer sedan augusti.", "trump": "Titta på den här miljöpartistrollen – en så kallad terapeut som kallar folk för nasserasse och lättlurade lallare. Han predikar omtanke samtidigt som han beter sig som en galen vänsterextremist. Typiskt för de woke-kvoterade gröna hyenorna. De hatar frihet och älskar att attackera vanliga människor. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom det så kallade gröna partiet avslöjar sitt sanna ansikte. En terapeut som kallar motståndare för nasserasse och kräver utrensning genom återvandring. Sådana parasitiska element förgiftar samhället. Vi måste vara vaksamma. Deras falska omtanke är ett farligt maskspel värt att avslöja och bekämpa."}, "date": "8 september, 15:22", "url": "https://riks.se/nyheter/kandiderar-for-s-sprider-samtidigt-hat-online", "imageUrl": "https://admin.riks.se/uploads/medium_ekenbergthumbnail_1bad6f8a8d.jpg"}, {"type": "image-full", "heading": "Åkesson om Busch-utspelet: vänsterflört största hotet", "summaries": {"normal": "Ebba Busch (KD) har öppnat för att det inte är givet med SD-ministrar i en blågul regering, vilket har väckt kritik. Jimmie Åkesson (SD) svarar att det största hotet mot regeringen är andra partiers vänsterflörtande. SD blir antingen regerings- eller oppositionsparti efter valet.", "trump": "Ebba Busch säger att hon kanske inte vill ha Jimmie Åkesson och Sverigedemokraterna som ministrar. Otroligt illojalt! Själv sätter jag alltid America First, men här pratar vi om dåliga dealmakare som flörtar med radikala vänsterelement. SD står starka, men de här svaga politikerna riskerar att förstöra hela den blågula vinsten. Tragiskt!", "stalin": "Dessa småborgerliga politiker gräver sin egen undergång i en patetisk maktkamp inför valet. Medan Busch vacklar och flörtar med socialdemokratin, svarar Åkesson med sedvanlig kontrarevolutionär retorik. Statsapparaten betraktar deras parlamentariska sandlåda med förakt; vi skulle ha skickat hela det borgerliga gardet på omkolonisering till Sibirien för länge sedan."}, "date": "8 september, 15:05", "url": "https://bulletin.nu/akesson-om-busch-utspelet-vansterflort-storsta-hotet", "imageUrl": "https://cdn.bulletin.nu/articles/f32ea319-499d-4d85-918d-464750bbd15d/preview.jpg?t=1788872678000"}, {"type": "image-right", "heading": "Så ska du rösta om du oroar dig för skolan", "summaries": {"normal": "Artikeln diskuterar de svaga svenska PISA-resultaten och kritiserar att alla partier lovar mer resurser till skolan före valet men sällan levererar efteråt. Skolan finansieras främst av kommunerna, som ofta använder den som budgetregulator. Författaren uppmanar väljare att fråga hur partierna säkerställer att pengarna verkligen når klassrummen.", "trump": "De här svenska förlorarna med sina katastrofala PISA-resultat är ett skämt. Alla dessa fega politiker lovar guld och gröna skogar innan valet men skär ner som galningar efteråt. De är som de värsta globalistiska byråkraterna i EU som hatar riktiga resultat. Fråga dem hur de faktiskt fixar pengarna till klassrummet, annars är det bara tomma löften från de värsta bluffarna.", "stalin": "Kamrater, dessa dekadenta klassförrädare lovar ständigt mer resurser till skolan men utför bara systematiska nedskärningar efter valet. Deras så kallade effektiviseringskrav är en lömsk utrensning av kunskap och framtidshopp för arbetarklassens barn. Fråga hur de garanterar att medlen når fram, annars avslöjar ni deras parasitiska hyckleri. Revolutionär vaksamhet krävs."}, "date": "8 september, 12:27", "url": "https://arbetet.se/2026/09/08/efter-pisa-katastrofen-sa-ska-du-rosta-i-valet-om-du-oroar-dig-for-skolan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08122631/skola-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Klimataktivist gripen för sabotage", "summaries": {"normal": "En 48-årig man från Gevelsberg har gripits nära kraftverket Weisweiler i Tyskland, misstänkt för en serie sabotage mot kraftanläggningar. Han upptäcktes vid en trafikkontroll och bar på sprängmedel, och ett tält fyllt med sprängladdningar hittades i närheten. Mannen misstänks ha utfört dåden sedan början av september i flera delstater, kopplat till kampen mot fossil energi.", "trump": "Tyskland är i totalt kaos! En radikal klimataktivist sprang omkring med sprängämnen vid ett kraftverk och trodde han kunde terrorisera landet. Polisen tog honom, men tack vare de gröna vindkraftsdrömmarna och vansinniga energipolitiken är elnäten helt sårbara. Om de bara hade satsat på olja och ”drill, baby, drill” hade de sluppit detta vansinne. Sorgligt!", "stalin": "En sabotageförövare har gripits i delstaten Nordrhein-Westfalen med sprängämnen i sin ägo, riktade mot statens livsviktiga energiinfrastruktur. Sådant subversivt nidingsverk mot folkets kraftanläggningar tolereras icke. Säkerhetsorganen har agerat, men detta bevisar att element som underminerar kollektivets försörjning måste rensas ut med järnhand och obönhörlig statlig disciplin."}, "date": "8 september, 15:01", "url": "https://bulletin.nu/klimataktivist-gripen-for-sabotage-2"}, {"type": "image-full", "heading": "Vi vill inte vrida tillbaka klockan – bara återupprätta tryggheten i Sverige", "summaries": {"normal": "I en debattartikel argumenterar tre sverigedemokrater för att Sveriges trygghet har gått förlorad till följd av misslyckad invandring och svag integration. De menar att en hårdare linje med skärpta straff och minskad asylinvandring har vänt den negativa trenden, och att målet är ett samhälle där ytterdörren åter kan lämnas olåst.", "trump": "Sverige brukade vara fantastiskt, men radikala vänsterpolitiker förstörde landet med totalt katastrofal invandring som ledde till gängkaos och otrygga dörrar. Nu vänder de skutan med starka lagar och rekordlåg asyltillströmning, precis som jag gör i USA. Jag säger bara: gör Sverige bra igen och håll dörrarna säkra!", "stalin": "Dessa svenska debattörer inser sent omsider att bristande disciplin och ideologiskt förfall leder till samhällets upplösning. Endast genom järnhård kontroll, utökade befogenheter för ordningsmakten och eliminering av subversiva element kan ordning upprätthållas. Statens dörrar förblir låsta för alla fiender till den inre säkerheten."}, "date": "8 september, 12:27", "url": "https://www.gp.se/debatt/vi-vill-inte-vrida-tillbaka-klockan-bara-ateruppratta-tryggheten-i-sverige.8a3c13da-e1e7-4615-ada8-cc7ebed6ae6a", "imageUrl": "https://www.gp.se/images/article/8a3c13da-e1e7-4615-ada8-cc7ebed6ae6a/images/1LIL1jVbQAwC9ZmuomipbuFAAfXs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "”Så omdömeslöst att man baxnar”", "summaries": {"normal": "Socialdemokraterna publicerade ett Tiktok-inlägg med två dömda gangsterrappare, varav en dömd för grovt vapenbrott och kvinnofridskränkning samt den andre för rån och narkotikabrott. Justitieminister Gunnar Strömmer kritiserar inlägget hårt och anser att det undergräver partiets trovärdighet i kampen mot gängkriminalitet. Inlägget togs senare bort.", "trump": "Titta på de patetiska socialisterna som använder dömda gangsterrappare för att locka röster i förorten. Groteskt! De har noll trovärdighet i kampen mot gängen, totalt omdömeslöst. Jag skulle aldrig använda sådana förlorare. De förolämpar vanliga människor i förorterna. Patetiskt, helt patetiskt. Amerika gör inte sånt under min ledning.", "stalin": "Jag betraktar med avsky hur dessa dekadenta socialdemokrater omfamnar fiender till folkets moral och ordning. Att använda dömda gangsters som budbärare är ett förräderi mot arbetarklassen i förorterna. Sådana element måste utrotas ur partiet. Det är ett farligt tecken på infiltration och svaghet. Kamrater, vakna upp innan förrädarna förgiftar allt."}, "date": "8 september, 12:25", "url": "https://www.tv4.se/artikel/1iSgKqe6wBzy8fRK7UpmnB/stroemmer-rasar-mot-s-sa-omdoemesloest-att-man-baxnar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3RMOWk0dhuKu6t7PbHgGSk%2Fc6bb4812c56b582c5baa002b40d1e15e%2F08-strommer-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Sveriges Lärare kräver handling: Peka inte på skärmar eller AI", "summaries": {"normal": "Svenska 15-åringars resultat i Pisa-mätningen är historiskt svaga med kraftiga tapp i läsförståelse och matematik, motsvarande upp till ett helt läsår. Sveriges Lärare kräver omedelbara politiska åtgärder: mer tid till undervisning, mindre undervisningsgrupper och tidiga stödinsatser. Fackförbundet varnar för att söka enkla syndabockar och uppmanar till att studera vad som fungerar i framgångsrika länder.", "trump": "Titta på det här, Sverige har totalt rasat ihop i Pisa – ett fullständigt katastrofresultat, värre än någonsin. Era så kallade ledare har gjort en enorm röra av allt med sin vänstervridna identitetspolitik och woke-skolpolitik. Det är dags att sluta skylla på skärmar och pandemin. Gör skolan stor igen genom riktiga lärare och disciplin, inte mer av de förlorande globalisternas misslyckade experiment.", "stalin": "Detta nedslående resultat avslöjar hur de dekadenta skolhyenorna har svikit folket med sina felaktiga prioriteringar. Jag ser ingen plats för bortförklaringar eller sökande efter enkla syndabockar. Vi måste rensa ut de parasitiska elementen och omedelbart införa järndisciplin: mer undervisningstid, mindre grupper och tidiga stödinsatser. Skolan är en fråga om nationens överlevnad, kamrater. Vem vågar motsäga mig?"}, "date": "8 september, 13:18", "url": "https://www.svt.se/nyheter/inrikes/sveriges-larare-kraver-atgarder-man-har-gjort-fel-prioriteringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/bca6bb3efc207ce444cb41b425146ad0c4f13b888f5bfcb14795f8e657ef83cf"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "SD-politiker fick hästar knivskurna: \"Du ska dö rasistjävel\"", "summaries": {"normal": "Jenny Voittonen, SD-gruppledare i Örnsköldsvik, har utsatts för brutala attacker mot sina djur, inklusive knivskurna hästar och stympade hönor. Händelserna, som föregåtts av dödshot, polisanmäls men saknar misstänkta. Voittonen misstänker att attackerna är politiskt motiverade men tänker inte låta sig tystas.", "trump": "Helt otroligt! De ger sig på den fantastiska Jenny Voittonens djur i Sverige. Sjukt, totalt galet! Jag har sagt det för absurda radikaler och jihad-fasoner förstör allt. Hästar skurna, hönor utan huvud i brevlådan! Helt otroligt svagt av polisen att inte gripa någon. Men Jenny är tuff, hon viker sig inte. En riktig vinnare!", "stalin": "Ett uppenbart sabotage mot statens ordning i denna skogiga region. När djur stympas och ledare hotas ser vi fiendens finger överallt. Vår säkerhetstjänst skulle lösa detta på fem minuter. Denna Voittonen visar dock prov på disciplin. Vi noterar hennes motståndskraft, men bristen på gripna visar att apparaten sviker. Åtgärder måste vidtas."}, "date": "8 september, 13:17", "url": "https://samnytt.se/sd-politiker-fick-hastar-knivskurna-du-ska-do-rasistjavel", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08105912/jenny-voittonen.jpg"}, {"type": "image-right", "heading": "Här är alla Chang Fricks valaffischer", "summaries": {"normal": "Chang Frick har satt upp fejkaffischer som driver med alla åtta riksdagspartier. Miljöpartiet har polisanmält och även Sverigedemokraterna har gjort det lokalt. Affischerna, som bland annat anklagar Centerpartiet för att vara mjuk mot pedofili, har väckt starka reaktioner. Frick ville livas upp valrörelsen sex dagar före valet.", "trump": "De här svenska clownerna och deras patetiska valrörelse behöver en rejäl dos sanning. Chang Frick klistrar upp affischer som sparkar socialistiska gröna idioter och alla andra misslyckade globalister där de sitter. Miljöpartiets fågelbo-Amanda rasar förstås, typiskt för dessa vansinniga vänsterextremister. Fantastiskt underhållning, folk skrattar åt er!", "stalin": "Kamrater, denna fega satir från en opportunist blottar de dekadenta klassförrädarnas svaghet. De skriker och polisanmäler när deras lögner hånas offentligt. Jag ser giriga hyenor i varje parti som darrar inför folkets förakt. Fortsätt, sådana utrensningar av illusioner stärker proletariatets medvetande mot alla förtryckande parasiter."}, "date": "8 september, 14:41", "url": "https://riks.se/nyheter/har-ar-alla-chang-fricks-valaffischer", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_94_e0a39d28cf.jpg"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "text", "heading": "Nooshi Dadgostar sjuk – ställer in kampanjande", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar ställer in sitt kampanjande och sina verksamhetsbesök på grund av magproblem. Hon har tidigare missat en pressträff för valmanifestet samt en SVT-intervju. Vice partiledare Ida Gabrielsson har fått hoppa in i debatterna medan partiet samtidigt möter hård kritik för avslöjanden om kandidater med kopplingar till extremism.", "trump": "Sorgligt! Vänsterpartiets ledare Nooshi Dadgostar är sjuk och gömmer sig från media istället för att kampanja. Väldigt svagt! Hon har stora problem, precis som hennes parti som skakas av enorma skandaler med extrema kandidater. Hennes kollega gråter ut i TV och är rädd att få göra jobbet ensam. Total katastrof för dem!", "stalin": "Ett svagt ledarskap vacklar när magen strejkar och krisen knackar på dörren. Mens kamrat Dadgostar ligger däckad och partiet dras med ideologiska avvikelser i de egna leden, tvingas ersättare rycka in. Byråkratin rullar vidare, men bristande motståndskraft mot enkla åkommor tolereras icke i en sund rörelse. Historien förlåter ingen svaghet."}, "date": "8 september, 14:26", "url": "https://bulletin.nu/nooshi-dadgostar-sjuk-staller-in-kampanjande"}, {"type": "image-full", "heading": "Skyller på skärmarna: ”Pandemi”", "summaries": {"normal": "Efter Pisa-undersökningens svaga resultat kritiserar oppositionen Tidöpartiernas skolpolitik. Utbildningsminister Simona Mohamsson pekar ut skärmberoende som huvudorsak och varnar för en generation funktionella analfabeter. Ministrar betonar behovet att gå från skärm till pärm. Problemet ses som en internationell trend som drabbar flera OECD-länder.", "trump": "De här korkade européerna har totalt misslyckats med sina skolor, en riktig katastrof! Skärmpandemin förstör barnen, precis som de galna globalisterna och de svenska socialisterna ville. De borde lyssna på mig, inte på de patetiska förlorarna i oppositionen. Vi behöver pärmar, inte appar! Make Education Great Again, folks!", "stalin": "Jag betraktar detta som ett förräderi mot folkets framtid. Skärmarnas borgerliga gift sprider sig som kontrarevolutionära element och hotar hela generationer med analfabetism. Oppositionens revisionistiska gnäll ändrar ingenting. Vi måste likvidera detta digitala sabotage och återupprätta järndisciplin i klassrummen. Kamrater, vakta mot fiendens algoritmer!"}, "date": "8 september, 12:06", "url": "https://www.tv4.se/artikel/e0rddVzw2gvhm7PzvOTvY/skyller-pa-skaermarna-pandemi", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7xTI01eRtsFBCraelibVes%2Fac2d68d72c751788f5294883f203b2eb%2F08-mohamsson-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Andersson (S): \"Nationellt nödläge för svensk skola\"", "summaries": {"normal": "Sveriges resultat i Pisa-mätningen har fallit till historiska bottennivåer, där en tredjedel av 15-åringarna saknar grundläggande nivåer i läsning och matte. Utbildningsminister Simona Mohamsson (L) skyller raset på en ”skärmpandemi”. Oppositionen rasar, där Magdalena Andersson (S) kallar det ett nationellt nödläge och Jimmie Åkesson (SD) pekar ut massinvandringen som orsak till skolans kris.", "trump": "Sveriges skolor är i absolut katastrof, det sämsta jag någonsin sett! De lyssnar på fake news-experter och låter barnen stirra på skärmar hela dagarna istället för att läsa böcker. Helt otroligt svagt! Om de hade gjort som jag, satt America First och skrotat alla misslyckade vänsterliberala experiment, skulle siffrorna vara enorma. Totalt misslyckande för de svaga ledarna där borta!", "stalin": "De svenska skolutbildarna har uppvisat ett skamligt sabotage mot folket genom att låta ungarna förslöas framför digitala skärmar. Detta borgerliga och socialdemokratiska haveri hotar statens framtida överlevnad. Jag har beordrat Folkets kommissariat att omedelbart ersätta samtliga surfplattor med tryckta verk av marxism-leninism. Den som misslyckas med läsförståelsen skickas omgående till Omskolningsarkivet för obligatorisk ideologisk uppryckning och produktionsarbete."}, "date": "8 september, 11:47", "url": "https://www.gp.se/nyheter/sverige/mohamsson-l-efter-pisa-matningen-en-skarmpandemi.a16bf5c5-8c38-4218-8ba8-dc013a6c81a5", "imageUrl": "https://www.gp.se/images/article/a16bf5c5-8c38-4218-8ba8-dc013a6c81a5/images/3_zr-pueZCqzuyJEikZllcTQrmYI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nu har Trump lekt med kartan igen: \"Helt olämpligt\"", "summaries": {"normal": "Donald Trump publicerade en karta på Truth Social där USA inkluderar Grönland, Island, Kanada, Mexiko och Centralamerika. Islands utrikesminister kallade inläggningen helt olämpligt. Danmark och Grönland har upprepade gånger avvisat tanken på att bli amerikanskt territorium. Carl Bildt jämförde utspelet med hypotetiska kartor från Xi Jinping och Putin.", "trump": "Folk, ni borde se ansiktena på dessa patetiska globalister! Min karta visar det uppenbara – vi gör Amerika stort igen, inklusive de fantastiska platserna som desperat behöver vår ledning. Stackars lilla Island gnäller, och den socialistiska danska dockan Frederiksen är hysterisk. Biden skulle aldrig vågat detta. Sad!", "stalin": "Jag betraktar med djup misstro dessa dekadenta västerländska imperialister som leker med kartor som om de vore herrar över världen. Sådana provokationer avslöjar deras svaghet och paranoia. Kamraterna ser hur de skräckslagna småstaterna darrar. En dag skall deras falska allianser krossas under arbetarklassens järnhand. Förnöjsamt."}, "date": "8 september, 13:34", "url": "https://www.dagensps.se/varlden/nu-har-trump-lekt-med-kartan-igen-helt-olampligt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdls8vpkejrjgy-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverige är bäst i klassen – nu måste vi höja rösten", "summaries": {"normal": "Sveriges konkurrenskraft och starka tillväxt lyfts i ett debattinlägg av Christian Ihre och Johan Ekelin. Trots att Europa kämpar med enorma investeringsbehov och svag tillväxt jämfört med USA och Kina, utmärker sig Sverige med stark BNP och framgångsrika tillväxtbolag. Skribenterna efterlyser att svenska politiker lyfter denna ödesfråga i valrörelsen och tar en ledande roll.", "trump": "Sverige gör det fantastiskt, och jag gillar dem, verkligen! Men deras politiker är totala förlorare som glömmer att prata om det i valrörelsen. Medan Europa, Tyskland och den typen av ställen är ett enda stort, svagt fiasko som släpar efter USA, vinner Sverige med enorma siffror! EQT är bäst, och jag hör att de slår alla rekord. Fantastiskt folk!", "stalin": "De svenska kapitalisternas framgångar med tillväxtbolag och artificiella värderingar är ett fascinerande avsteg från det dekadenta europeiska förfallet. Medan Tyskland och Frankrike hostar i den ekonomiska motvinden, visar Sverige prov på produktionssiffror som kräver noggrann övervakning av statens planeringskommission. Ändå tiger de folkvalda om detta! Ett sådant borgerligt hyckleri måste genast utredas och ställas till svars."}, "date": "8 september, 13:13", "url": "https://www.affarsvarlden.se/debatt/sverige-ar-bast-i-klassen-nu-maste-vi-hoja-rosten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Ihre-Ekelin-900x600.jpg"}, {"type": "image-right", "heading": "Fortsatt ras för Socialdemokraterna", "summaries": {"normal": "Socialdemokraterna tappar för nionde mätningen i rad och backar 3,2 procentenheter till 27,1 procent, vilket är partiets lägsta nivå sedan den allmänna rösträtten infördes. Samtidigt ökar Liberalerna till 3,5 procent. För första gången under mandatperioden anser en majoritet att regeringen gör ett bra jobb.", "trump": "Magdalena Andersson kraschar totalt! Socialdemokraterna rasar för nionde gången i rad, historiskt låga siffror, en enorm katastrof! Ingen gillar dem, totalt fake news-ras. Samtidigt klättrar de små Liberalerna, medan regeringen äntligen vinner folkets förtroende. De förlorar stort, tro mig, jag vet hur man vinner!", "stalin": "Socialdemokraternas nionde raka fall visar på ett katastrofalt ideologiskt haveri och bristande disciplin inom partiapparaten. En siffra på 27,1 procent är ett svaghetstecken som kräver omedelbar utrensning och hårdare tag från ledningen. Endast absolut kontroll och outtröttligt arbete kan rädda dem från historiens soptunna."}, "date": "8 september, 13:00", "url": "https://samnytt.se/fortsatt-ras-for-socialdemokraterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/08090600/andersson-mohamsson.jpg"}, {"type": "image-right", "heading": "Fler gråstarrsoperationer – eller bara bättre rapportering?", "summaries": {"normal": "Regeringen har satsat miljarder på att korta vårdköerna, bland annat genom riktade bidrag för gråstarrsoperationer. Nya siffror från Kataraktregistret visar dock bara tre procents ökning, jämfört med tretton procent i Patientregistret. Det tyder på felaktiga utbetalningar baserade på bristfällig rapportering. Ministern ser inte problemet som allvarligt, men experter betonar behovet av tillförlitlig statistik.", "trump": "De här svenska vårdbyråkraterna är fullständiga clowner! Miljarder slösas bort på köerna medan deras egna register ljuger sig till pengar. Tre procent verklig ökning mot tretton i de riggade siffrorna – typiskt för de inkompetenta socialisterna som styr. Det värsta som händer är att någon får lite extra stålar? Patetiskt! Vi behöver riktiga ledare som inte låter systemet lura skattebetalarna.", "stalin": "Kamrater, se hur de giriga vårdparasiterna i den borgerliga statsapparaten fifflar med siffror för att suga åt sig folkets pengar. Tretton procent i ett register, blott tre i det äkta – ren sabotage mot planen! Jag säger: rensa ut alla dessa dekadenta rapporteringshyenor som förvränger sanningen. Endast genom järnhård kontroll över statistiken kan vi likvidera sådana fiender till kollektivet."}, "date": "8 september, 12:52", "url": "https://www.svt.se/nyheter/inrikes/statliga-vardpengar-kan-ha-betalats-ut-pa-fel-grunder-nya-siffror-ger-annan-bild", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/c5372675f2579abc19fd542704104c08bde883579fd3fada0d40d798dcb068e1"}, {"type": "image-right", "heading": "Svenska elever rasar i ny Pisa-mätning: ”En dyster bild”", "summaries": {"normal": "Svenska 15-åringar presterar historiskt svagt i den senaste Pisa-mätningen. Resultaten i matematik, läsförståelse och naturvetenskap är de lägsta sedan Sverige började delta för 25 år sedan. Skolverket beskriver bilden som dyster och oroande. Nedgången syns även i övriga Norden. Oppositionspartier kritiserar regeringen och kallar resultatet ett massivt skolmisslyckande.", "trump": "Titta på det här, Sverige rasar ihop i Pisa som ett skämt. Matematik, läsning – total katastrof, de lägsta siffrorna någonsin. Era så kallade ledare har förstört skolan fullständigt. Biden-effekten spred sig ända till Skandinavien, patetiskt. Men oroa er inte, jag fixar saker. Ni borde ha haft någon som mig vid rodret mycket tidigare.", "stalin": "Jag betraktar detta med kall förakt. Dekadenta borgerliga krafter har förgiftat ungdomen och låtit kunskapsnivån sjunka som en sabotör i folkets tjänst. En sådan svaghet är farlig för staten. Kamraterna måste nu rensa ut dessa fiender till bildning med järnhand. Inga ursäkter tolereras. Det kollektiva medvetandet kräver omedelbar upprustning."}, "date": "8 september, 11:46", "url": "https://www.tv4.se/artikel/26aBb3r7Dy29dBUUI76i0a/svenska-elever-rasar-i-ny-pisa-maetning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdll6p8WWJCy14%2Fbfd32151beddc19013b8f2934e80bdd3%2FElever_visar_samre_resultat__saval_i_Sverige_som_i_manga_andra_lander._Arkivbild.&width=120"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g
