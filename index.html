ilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Sverige i topp för hemarbete – men flexibiliteten har en baksida", "summaries": {"normal": "Sverige ligger i topp inom EU gällande distansarbete, där 38 procent arbetar hemifrån. Pandemin har permanentat hybridarbete, men flexibiliteten medför nackdelar såsom gränslöshet och stress. Många svenskar nås av jobbärenden utanför arbetstid, vilket ökat den psykiska ohälsan. Som motvikt har 13 EU-länder infört lagar om rätten att vara oanträffbar. Samtidigt vill chefer locka tillbaka personal till kontoret, där narcissistiska ledare ofta är mest kritiska till distansarbete för att stärka sin egen status.", "trump": "Sverige jobbar hemifrån – en katastrof! De ligger i topp, mycket dåligt. Nu sitter svenskarna hemma, stressade och oroliga, medan cheferna vill ha tillbaka dem till kontoret. Jag förstår cheferna, tro mig! Narcissistiska ledare vill ha sin status, och det är så man vinner. Att svara på mejl efter jobbet är för svaga ledare. Frankrike försöker lagstifta bort det, men det är bara mer byråkrati. Vi behöver folk som jobbar hårt och vinner, inte folk som gömmer sig i pyjamas!", "stalin": "Vi noterar med förakt hur det svenska folket, förslappade av västerländsk dekadens, gömmer sig i sina hem istället för att tjäna statens maskineri. Distansarbete är blott en borgerlig illusion av frihet som skapar oordning och svaghet. Vår broder i Kreml vet att nationell styrka kräver närvaro, inte att man svarar i telefon från sängen. Att låta chefer styra genom narcissism är ett tecken på kapitalistiskt förfall. Vi stämplar dessa 'hemmasittare' som folkets fiender; arbetet kräver disciplin, inte flexibilitet!"}, "date": "30 juli, 11:43", "url": "https://www.realtid.se/karriar-ledarskap/sverige-i-topp-for-hemarbete-men-flexibiliteten-har-en-baksida", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/hemmajobb.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Konstnären PG Thelander död – blev 90 år gammal", "summaries": {"normal": "Konstnären Pär Gunnar ”PG” Thelander har avlidit vid 90 års ålder. Han slog igenom på 1960-talet och blev känd för sin humoristiska och lekfulla stil med oväntade motiv som potatisar, pingviner och fläskkorvar. Thelander, som utbildade sig vid Konstfack och Kungliga Konsthögskolan, fick internationell uppmärksamhet och hans verk har visats i bland annat London, Paris, New York och Mexico City. Den svenska konstvärlden har förlorat en av sina mest särpräglade konstnärer.", "trump": "Folk, ni skulle ha sett den här killen, PG Thelander. Fantastisk konstnär, verkligen en av de bästa. Han dog nu vid 90, jättesorgligt, men hans grejer med potatisar och korvar – ingen gjorde det bättre, tro mig. Han var en vinnare, utbildad på de finaste skolorna, visade sin konst över hela världen, London, Paris, New York. Mycket lekfullt, mycket humor. Konstvärlden kommer aldrig att bli densamma, det säger jag er.", "stalin": "Kamrater, denna dekadente borgarbracka vid namn Thelander har äntligen lämnat oss vid 90 års ålder efter ett liv i klassfiendens tjänst. Med sina löjeväckande potatisar, pingviner och geometriska kuber försökte han förgifta folkets sinnen med sin så kallade humor. Vi har länge genomskådat hur dessa kapitalistiska clowner döljer sin kontrarevolutionära paranoia bakom lekfullhet. Nu har partiet rensat ut ännu en absurdist från historien. Sov gott i den eviga utrensningens skugga."}, "date": "30 juli, 11:34", "url": "https://nyheter24.se/noje/kultur/1501807-konstnaren-pg-thelander-dod-blev-90-ar-gammal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c07a4ca804b004a30200000000b004a302/2026/07/30/2381282/pg-thelander.png"}, {"type": "image-right", "heading": "Uppgifter: Fifa vill ta in 4,2 miljarder dollar från privata investerare", "summaries": {"normal": "Fifa planerar att ta in upp till 4,2 miljarder dollar från privata investerare till ett nytt bolag för VM, med bindande bud önskade i oktober. Pengarna ska användas till högre ersättningar. Uefa vänder sig mot planerna och anser att Fifa saknar tillräcklig insyn och att processen är för snabb, samt att förbund, klubbar och spelare bör prioriteras.", "trump": "Jag, Donald Trump, ser att Fifa försöker stjäla enorma summor från fotbollen igen. Det är en skam! Uefa har rätt – Fifa utnyttjar vår sport för att berika sina vänner. Efter att ha vunnit presidentvalet 2024, kommer jag att stoppa detta och se till att pengarna går till spelare och supportrar, inte till korrupta förbund. Vi ska göra fotboll stort igen!", "stalin": "Vi ser genom Fifas kapitalistiska bedrägeri – de försöker berika sina borgarkompisar med 4,2 miljarder. Uefa, som representerar det imperialistiska Europa, kritiserar, men de glömmer att staten måste kontrollera sporten för folkets bästa. Detta är ett tecken på kapitalismens sjukdom. Vi måste stärka vårt system och skydda vår renhet, precis som vi bekämpar utländska hot. Partiet kommer att agera."}, "date": "30 juli, 11:31", "url": "https://www.affarsvarlden.se/artikel/uppgifter-fifa-vill-ta-in-42-miljarder-dollar-fran-privata-investerare", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdltIlvAv19neo-nh-400x267.jpg"}, {"type": "image-full", "heading": "Pride: Polisen och Region Stockholm fixar T-shirts efter uniformsförbudet", "summaries": {"normal": "Polisen och Region Stockholm har tagit fram Pride-t-shirts till anställda som inte längre får bära uniform på fritiden. Förbudet gäller sedan mitten av april för poliser, medan regionanställda följer Socialstyrelsens hygienregler. Lediga poliser och vårdanställda kan i stället delta i lördagens Prideparad i särskilda tematröjor. Andra myndigheter som Försvarsmakten och Räddningstjänsten tillåter fortfarande uniform i paraden. Brott mot förbudet kan leda till arbetsrättslig utredning.", "trump": "Ingen får bära uniform på fritiden längre, säger de, men jag tycker det är patetiskt. Polisen och de där regionmänniskorna i Stockholm har nu specialgjorda T-shirts för Pride-paraden. De andra – militären, kustbevakningen, brandmännen – får fortsätta som riktiga hjältar i uniform. Det är en skam att poliser straffas för att visa stolthet. Men vi fixar det, vi gör det bättre än någonsin, tro mig. De borde tacka mig för hur bra det går nu.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi effektivt neutraliserar de dekadenta uniformsfetischisterna inom polisen och de vårdande borgarbrackorna i Region Stockholm. Dessa potentiella fiender till folket som smyger sig ut i arbetarklassens högtid iförda symboler för reaktionär auktoritet ska rensas ut genom korrekt utredning. Våra nya kollektiva Pride-T-shirts utgör ett stålhårt verktyg för ideologisk enhet. De som trotsar partilinjen kommer att möta den dialektiska konsekvensen – en humoristisk men grundlig likvidering av deras karriärer. Allt för kollektivets seger."}, "date": "30 juli, 10:58", "url": "https://riks.se/nyheter/pride-polisen-fixar-t-shirts-efter-uniformsforbudet", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_30_at_10_25_07_d66fafa867.png"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Unga frun lämnar Nannskog – en månad efter bröllopet", "summaries": {"normal": "Daniel Nannskogs äktenskap med den 22-åriga Malina Sofi Zemeri från Norge har redan tagit slut, drygt en månad efter bröllopet i Las Vegas. Beskedet kommer samtidigt som den tidigare SVT-profilen och fotbollsspelaren åtalats för kvinnomisshandel, olaga hot och narkotikabrott. Den unga hustrun skriver på Instagram att hon slagit rekordet för världens kortaste äktenskap. Nannskog nekar till misshandel och hot men erkänner kokainanvändning. Rättegången planeras till oktober.", "trump": "Folk, det här är helt otroligt. Den här Nannskog, en så kallad stor fotbollsstjärna och SVT-kille, gifter sig med en ung vacker norska i Las Vegas, tatuerar hennes namn på kroppen och en månad senare är det redan över. Världens kortaste äktenskap, säger hon. Patetiskt! Och nu ska han till rättegång för att ha slagit kvinnor och använt kokain. Fake news eller vad? Jag skulle ha vunnit det äktenskapet stort, det kan jag säga. En total katastrof.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Nannskog, denna fotbollsaristokrat och televisionens lakej, redan efter en kort månad likviderar sitt äktenskap med den unga norrmannen. Medan han inväntar folkdomstolens dom för att ha slagit och hotat en kvinna samt förgiftat sig själv med kokain, flyr den yngre hustrun. Jag, som alltid vakar över arbetarklassens moral, skrattar mörkt åt dessa kapitalistiska svin som tatuerar sina namn i ett fåfängt försök att undgå utrensning. Deras äktenskap var dömt från början, precis som de själva."}, "date": "30 juli, 10:08", "url": "https://www.friatider.se/unga-frun-lamnar-nannskog-en-manad-efter-brollopet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-588.jpg?itok=uBpqbdQg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Örebro serverar mer kött i gymnasieskolan", "summaries": {"normal": "Örebro kommun ändrar matsedeln på gymnasieskolorna till kött/fisk fyra dagar i veckan efter elevers klagomål. Kostchefen Åsa Sandholm konstaterar en konflikt mellan elevers önskemål om halvfabrikat och kommunens från-grunden-mat. Miljöpartiet kritiserar ändringen som för dyr och orimlig jämfört med Livsmedelsverkets rekommendationer om maximal rött köttintag.", "trump": "Jag, Donald Trump, ser detta som en seger för amerikansk skolmat! Eleverna ville ha riktigt kött – inte någon socialistisk grönsaksdiets. Miljöpartiet kan inte räkna – bra kött kostar pengar, men det är värt varje cent. Vi kommer att servera de bästa kyckling- och fiskrätter, precis som i våra stora amerikanska skolor. Detta är en stor, stor framgång för våra elever!", "stalin": "Partiet har beslutat en ökning av animaliska proteiners närvaro i skolornas matsedel – en nödvändig åtgärd för att stärka arbetarklassens fysik. Fienden, i form av vegetarisk infiltration, försöker att förringa vårt köttäta arv. Vi väljer selektivt kyckling och fisk, aldrig nötkött, för att undvika feodal överkonsumtion. Kommunens kost är en front i den stora kampen mot den imperialistiska grönsaksdiets expansion."}, "date": "30 juli, 09:30", "url": "https://bulletin.nu/orebro-serverar-mer-kott-i-gymnasieskolan", "imageUrl": "https://cdn.bulletin.nu/articles/4b94c70e-0076-49b7-8e18-cec3df12b894/preview.jpg?t=1785395154000"}, {"type": "image-full", "heading": "Varnade för storattack – timmar senare slog Ryssland till", "summaries": {"normal": "Efter att president Zelenskyj varnat för en väntad rysk storattack slog Ryssland till under natten med ballistiska robotar, kryssningsrobotar och hundratals drönare mot flera ukrainska städer. Minst åtta personer, däribland två barn, dödades och över 30 skadades. Svåra skador uppstod i Kyiv, Kryvyj Rih, Poltava och Lviv. Polen skickade upp stridsflyg för att skydda sitt luftrum. Flyglarm utfärdades över hela Ukraina.", "trump": "Folk, det här är precis vad jag sa skulle hända efter den totalt inkompetente Sleepy Joe Bidens katastrofala tid vid makten. Zelenskyy ber om mer pengar och plötsligt regnar det ryska raketer och drönare över hela Ukraina. Patetiskt. Jag skulle ha stoppat det här på en eftermiddag, men nu har vi kaos igen. Ukraina är en katastrof och Europa borde skämmas. Vi hade inget sånt här under min regering, det lovar jag.", "stalin": "Kamrater, jag har länge varnat för den dekadenta västvärldens svaghet. Den lille zelenskyjska clownen och hans fascistiska lakejer skriker om storattack medan vi, genom vår värdige efterträdare, rensar ut de imperialistiska hinder som blockerar den historiska ryska intressesfären. Åtta döda borgarbrackor och några brinnande garagelager är ett rimligt pris för att krossa klassfiendens drömmar om att splittra det stora imperiet. Flyglarm? Låt dem darra."}, "date": "30 juli, 08:40", "url": "https://www.tv4.se/artikel/1FUMpsWsgsg304cRgul2m9/varnade-foer-storattack-timmar-senare-slog-ryssland-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1LQSi032znkEDw2ZoiwdvD%2F3c52cc7e8e1914962e9aa3a2b1c4913e%2F30-ukrainaattack-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "Nu flyr turister till Sverige – ”något har hänt”", "summaries": {"normal": "Allt fler turister från södra Europa söker sig till Sverige för att undvika extrem värme hemma. Fransmän klättrar i Västernorrland, spanjorer promenerar i Stockholm och många nämner det svalare klimatet som huvudorsak. Enligt Tillväxtverket ökade franska övernattningar med 28 procent under 2025 och med 15 procent i år. Även STF ser tydliga ökningar från Frankrike och Spanien. Svensk natur och vänliga människor lockar, medan hettan i Sydeuropa driver på trenden.", "trump": "Det är fantastiskt, verkligen underbart. Alla dessa smarta européer flyr från sin brännande hetta och kommer till Sverige, det vackraste, svalaste landet. De klättrar på bergen, äter på restauranger och säger att det är för varmt hemma – ingen överraskning. Frankrike och Spanien är en katastrof på sommaren, men Sverige vinner stort. Mina vänner från Europa älskar det här. Vi gör allt bättre, tro mig. Sverige är nu hetare än deras egna länder – fast på ett bra sätt.", "stalin": "Kamrater, se hur den solstekta kapitalistiska hettan driver de dekadenta borgarbrackorna från Sydeuropa som råttor mot vårt nordliga paradis. Jag gratulerar den kollektiva svenska naturen till denna seger över de värmesjuka imperialisterna. Vi ska noga övervaka dessa fransmän och spanjorer – vem vet vilka västerländska spioner som gömmer sig bland höjdrädda klättrare? En utrensning bland dem som längtar efter 40-gradig värme vore på sin plats. Låt dem svettas i folkrepublikens svala famn medan vi ler mörkt åt deras solbrända lidande."}, "date": "30 juli, 07:07", "url": "https://www.di.se/nyheter/nu-flyr-turister-till-sverige-nagot-har-hant", "imageUrl": "https://static.bonniernews.se/ba/9706589c-ec1d-4ca9-8589-af7b53178e55.jpg?crop=6000%2C3000%2Cx0%2Cy501&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "John Cleese ger stöd till Rupert Lowe: \"Vissa kulturer är bättre än andra\"", "summaries": {"normal": "John Cleese stöder politikern Rupert Lowe och hans parti Restore Britain, hävdande att vissa kulturer är överlägsna. Cleese kritiserar BBC för att ignorera Lowes rapport om muslimska groominggängen. Lowe, tidigare i Reform UK, grundade Restore Britain efter konflikt med Nigel Farage och profiliterar sig med hård migrationspolitik, inklusive förbud mot burka, minskad invandring och negativ nettoinvandring.", "trump": "Jag, Donald Trump, stöder John Cleese i hans ståndpunkt att vissa kulturer är bättre. BBC är en skam för att ignorera sanningen om groominggängen. Rupert Lowe är en patriot som försvarar brittiska värderingar mot islamistisk hot. Vi ska återställa ordningen och stoppa illegala invandrare. Som vanligt döljer fake news verkligheten.", "stalin": "Kapitalistiska komiker som Cleese försöker köpa folkets förtroende genom att hylla Lowes reaktionära partistånd. Denna parti, Restore Britain, uttrycker den återvändsgranskade fascismens renässans. Groominggängen är ett resultat av individualistiskt moraliskt förfall, inte kulturella skillnader. Vi måste förstärka statens kontroll för att skydda det socialistiska samhället mot dessa fiender inom och utanför."}, "date": "30 juli, 07:00", "url": "https://samnytt.se/john-cleese-ger-stod-till-rupert-lowe-vissa-kulturer-ar-battre-an-andra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29195911/cleese-lowe.jpg"}, {"type": "image-right", "heading": "Stockholms queera nattliv borde vara k-märkt", "summaries": {"normal": "Stockholms queera nattliv hotas av höga hyror och bristande stöd, vilket lett till att flera barer som Bitter Pills har tvingats stänga. Författaren lyfter Amsterdam som förebild där den historiska gaybaren Café ’t Mandje skyddas genom en kommunal stiftelse som bevarar dess kulturella värde. Artikeln argumenterar för att liknande åtgärder i Sverige skulle gynna historia, kultur och turism mer än ytterligare kedjebutiker.", "trump": "Folk, ni skulle se det här! Stockholm håller på att förlora alla sina queera barer till höga hyror och gnälliga grannar – patetiskt! Bitter Pills stängde, och nu är det bara gaysafari för heterotjejer kvar. Amsterdam gör det rätt, de k-märker sin gamla gaybar som ett historiskt monument. Vi borde göra samma sak här, men utan den galna vänsteraktivismen som förstör allt. Make Stockholm great again!", "stalin": "Kamrater, detta dekadenta queernattliv i Stockholm avslöjar borgarklassens fullständiga förfall. Bitter Pills och dess muralmålning av Lesbos står som ett monument över klassfiendens moraliska röta. Amsterdam har genom en klok stiftelse säkrat sin historiska bar mot kapitalistmaffians girighet. Vi måste rensa ut de exploaterande byfånarna och skydda arbetarklassens kulturarv från folkförtryckartrollen som vill ersätta allt med Bröd & Salt. Revolutionen kräver trygga platser!"}, "date": "30 juli, 06:30", "url": "https://www.etc.se/ledarkolumn/stockholms-queera-nattliv-borde-vara-k-maerkt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728080712_f44e8ea59f2255f031464976143bbf1ea5cc914e5119bf4b12e1eef6743b5052.png"}, {"type": "image-full", "heading": "Drönare med pepparsprej ska stoppa skolskyttar", "summaries": {"normal": "Flera skolor i USA inför drönare för att skydda mot skolskytter. Drönarna, kallade 'guardian angels', kan lokalisera en skytt inom 15 sekunder och neutralisera dem med pepparsprej. Projektet omfattar nio skolor i tre delstater. Kritiker ifrågasätter fjärrstyret och förespråkar förebyggande åtgärder istället.", "trump": "Jag, Donald Trump, presidenten, säger att detta är en genialisk lösning. Drönarna kommer att stoppa skolskytter snabbt och skydda våra älskade barn. Vi behöver starka åtgärder för skolans säkerhet, och detta kommer att göra amerikanska skolor säkrare än någonsin. Detta är en stor framgång för vårt land.", "stalin": "Vi, den allsmäktiga ledarskapet, ser med tillfredsställelse på dessa drönare som ett effektivt verktyg för statens övervakning. De kommer att skydda de unga från fiendens angrepp, likt våra strategier i Ukraina. Men vi måste vara vaksamma – sabotörer kan försöka undergrava detta. Vi kommer att segra över alla fiender."}, "date": "30 juli, 05:58", "url": "https://www.gp.se/nyheter/varlden/dronare-ska-stoppa-skolskyttar-i-usa.88173755-e9fb-44e5-8167-541625765422", "imageUrl": "https://www.gp.se/images/article/88173755-e9fb-44e5-8167-541625765422/images/2Iku7eCN_dM9UdemrsYjtPVUmSWE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter,     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
