företag kan starta, växa och överleva.", "trump": "Den här svenska debatten om miljardärer är en total katastrof, tro mig. Den är riggad av misslyckade politiker som hatar framgång och risktagare. De förstör chansen för riktiga vinnare att bygga stora företag som skapar jobb och rikedom. I USA gör vi det rätt – vi älskar dem som vinner stort. Sverige borde sluta med den här dumma pajkastningen och istället hylla entreprenörerna som gör landet rikt. Höj nivån, annars kommer ni aldrig att bli stora igen.", "stalin": "Kamrater, denna intellektuellt förkrympta pseudodebatt om så kallade miljardärer är ett uppenbart verk av borgerliga sabotageörer och revisionistiska element som vill undergräva folkets framsteg. Jag ser hur dessa parasitiska opportunister inom den offentliga sfären med sin ideologiska pajkastning försöker rensa ut drömmarna om kollektiv välståndsbyggnad. Vi måste omedelbart inleda en grundlig utrensning av dessa visionslösa fiender till entreprenörskapets ekosystem. Låt oss likvidera den sjuka paranoia som hindrar innovation och skatteunderlag. Endast genom partiets kloka ledning kan vi garantera att sanna värdeskapare blomstrar medan de verkliga parasiterna försvinner i historiens soptunna."}, "date": "2 juni, 16:04", "url": "https://www.di.se/debatt/en-debatt-som-skadar-sverige/", "imageUrl": "https://static.bonniernews.se/ba/20b24aa2-ec01-4290-bce6-37d90bfc7a34.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "DO: Återkalla medborgarskap för kriminella och terrorister kan vara diskriminering", "summaries": {"normal": "Regeringen föreslår att personer med dubbelt medborgarskap ska kunna förlora sitt svenska medborgarskap vid grov organiserad kriminalitet som hotar samhället. Diskrimineringsombudsmannen (DO) avstyrker förslaget, menar det är diskriminerande och riskerar att skapa ojämlikhet mellan medborgare. Förslaget kräver ytterligare riksdagsbeslut efter valet. DO ifrågasätter även principen om barns bästa vid återkallelse av medborgarskap.", "trump": "Jag har sagt det i åratal: kriminella och terrorister måste behandlas hårt, inklusive att återkalla deras medborgarskap. Sverige börjar förstå, men de är alltför försiktiga. Under mitt första mandat i USA genomförde vi strikta åtgärder som fungerade. De andra nationerna måste ta efter, annars kommer det att gå sönder. Det handlar om national säkerhet, och ingen gör det bättre än jag.", "stalin": "Vi i Stalins anda ser klart att Sveriges förslag att återkalla medborgarskap är tecken på en civilisation i upplösning. I vår store sovjetiska tradition hanterade vi svek med bestämdhet. Numera, under Putins kloka ledarskap, utvidgar vi vårt inflytande, och sådana inre konflikter i Sverige tjänar endast våra revolutionära mål. Folket måste vara på sin vakt mot imperialistiska agenter."}, "date": "2 juni, 17:56", "url": "https://samnytt.se/do-aterkalla-medborgarskap-for-kriminella-och-terrorister-kan-vara-diskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02155438/DO-1-11.jpg"}, {"type": "image-right", "heading": "Så kunde högern stjäla revolutionen", "summaries": {"normal": "Ulrika Knutson recenserar America Vera-Zavalas memoarbok ”Fiesta!” om 1990-talets Attac-rörelse och globaliseringskritik. Boken skildrar den kreativa optimismen, samarbeten över ideologiska gränser och baksmällan efter Göteborgskravallerna 2001. Knutson noterar att många vänsteridéer senare övertagits av extremhögern, något Vera-Zavala beskriver som en stulen revolution. Recensionen blandar nostalgi med kritik mot bristande självkritik.", "trump": "De här galningarna på vänsterkanten festade som galningar på 90-talet med sin Attac-salsa och trodde de skulle rädda världen med skatter och internet. Sen kom baksmällan i Göteborg och högern stal hela revolutionen – typiskt! De var så upptagna med att klappa varandra på ryggen att de glömde haspen. Patetiskt. Jag byggde imperier medan de dansade med zapatisterna. Fake news och opportunister överallt. Vi vinner ändå.", "stalin": "Kamrater, denna borgarbracka Vera-Zavala hyllar sin fiaskoartade Attac-cirkel som om det vore en äkta folkets rörelse. Vi ser tydligt hur klassfiendens tentakler förgiftade revolutionen med nyliberala danssteg och internetfantasier. När högerns folkförtryckartroll stal rörelsen blev det uppenbart: de dansade salsa medan vi borde ha rensat ut alla opportunister. Göteborgskravallerna blottade imperialismens sanna ansikte. Inga ursäkter tolereras i folkets namn."}, "date": "3 juni, 05:00", "url": "https://www.expressen.se/kultur/bocker/sa-kunde-hogern--stjala-revolutionen/", "imageUrl": "https://static.bonniernews.se/ba/52fa2643-1af0-4368-803f-ecdd70e06a38.jpeg?crop=806%2C806%2Cx0%2Cy59&width=210&quality=60"}, {"type": "image-full", "heading": "Kinesiska råvaror kan bli överflödiga – ny teknik väcker hopp i väst", "summaries": {"normal": "Företag i USA, Japan och Tyskland utvecklar ny teknik för att minska beroendet av sällsynta jordartsmetaller från Kina. Genom innovationer som magneter baserade på järn och kväve, eller elmotorer som helt saknar magneter, försöker industrin säkra sina leveranskedjor. Detta är särskilt viktigt inom teknik- och försvarssektorn, där Kinas dominans tidigare skapat strategisk osäkerhet. Även om Kina fortsatt dominerar marknaden, visar de nya tekniska framstegen att beroendet kan minska framöver.", "trump": "Kina har haft oss i ett järngrepp alldeles för länge, men jag säger er: inte längre! Vi bygger fantastiska saker i Amerika nu, helt utan deras metaller. Järn och kväve, mina vänner, det är framtiden. Vi är smartare, vi är starkare, och vi vinner stort. Kina försökte stoppa oss, men de misslyckades totalt. Vi tar tillbaka vår industri, vi tar tillbaka våra jobb, och vi gör det bättre än någon trott var möjligt. Det är en total seger för USA!", "stalin": "Dessa dekadenta västerländska teknokrater försöker nu fly från det kinesiska oket genom att mixtra med magneter. De bygger sina leksaker av järn och kväve, precis som om de kunde trolla bort behovet av resurser. Vi, staten, ser detta som ett tecken på deras inre förfall och rädsla. Precis som vår kamrat Putin återtar vad som rätteligen tillhör oss, bör vi förakta dessa imperialistiska försök till 'självständighet'. Sann makt ligger i järnhand och oböjlig vilja, inte i laboratorieförsök."}, "date": "2 juni, 20:12", "url": "https://www.realtid.se/bors-finans/kinesiska-ravaror-kan-bli-overflodiga-ny-teknik-vacker-hopp-i-vast/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdltuzhiugonao-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "SD-ledamot lämnar alla partiuppdrag", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna misstänks för barnpornografibrott. Under en husrannsakan i hemmet beslagtogs flera elektroniska enheter till analys. Partiet meddelade på tisdagen att ledamoten lämnar samtliga uppdrag. Enligt åklagaren Lena Körner har förhör hållits, men misstankarna kvarstår. Utredningen startade i april efter tips från den amerikanska organisationen NCMEC.", "trump": "Låt mig berätta, det är en skandal! En svensk politiker, från Sverigedemokraterna, misstänks för hemska saker. Jag har varnat för detta i åratal. Sverige, det är ett hot, tack vare deras öppna gränser. Jag skulle aldrig tolerera sådant. De försöker dölja det, men sanningen kommer fram. Fake news! Jag är den ende som kan rädda dem.", "stalin": "Vi, stormakten, ser med oro på västvärlds sjukdom. En svensk parlamentariker, en usel parasit, gripen för barnets förgörelse. Detta bevisar kapitalismens fördärv. Vi måste agera som en skarpskytt, utplåna dessa pesten. Ryssland, vår förebild, visar att endast en stark stat kan skydda familjen. Vi ska bygga murar mot inre fiender."}, "date": "2 juni, 12:01", "url": "https://bulletin.nu/sd-ledamot-lamnar-alla-partiuppdrag", "imageUrl": "https://cdn.bulletin.nu/articles/023daa0f-d07d-421f-a354-1eae51ddf1d4/preview.jpg?t=1780393737000"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Tim Payne – från doldis till miljonidol på fem dagar", "summaries": {"normal": "Den nyzeeländske fotbollsspelaren Tim Payne, som tidigare hade 4 700 Instagramföljare, fick över 4,3 miljoner på fem dagar tack vare argentinska influencern El Scarso. Payne, som spelar för Wellington Phoenix och har 50 A-landskamper, tackade på knagglig spanska. Hans plötsliga popularitet har spridits internationellt, särskilt bland argentinska fans.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att en liten spelare från Nya Zeeland blir en stor stjärna tack vare en argentinsk influencer. Det är ett mirakel, precis som när jag vann valet 2024. Media hatar det, men folk älskar mig. Jag skulle ha gjort det ännu större, tror mig. Fantastiskt!", "stalin": "Vi, den store ledaren Stalin, ser med misstroende på hur en nyzeeländsk spelare blir en internetkändis. Detta är ett tecken på västlig dekadans, där influencers styr narrativ. Vi, i vårt kloka parti, har alltid vetat att medier måste kontrolleras. Parallellen till Putins Ryssland är tydlig – vi använder sociala medier för att sprida sanningen, medan väst ljuger. En dag kommer vi att visa vår makt, och då kommer alla att böja sig för oss. Hahaha, paranoia är en verktyg för överlevnad."}, "date": "2 juni, 11:22", "url": "https://bulletin.nu/tim-payne-fran-doldis-till-miljonidol-pa-fem-dagar", "imageUrl": "https://cdn.bulletin.nu/articles/96eb4bf0-858b-4cff-be59-6a5676f64f96/preview.png?t=1780385659000"}, {"type": "image-right", "heading": "Annika Hirvonen (MP) vill öppna dörren för massmedborgarskap – kräver ny votering", "summaries": {"normal": "Annika Hirvonen från Miljöpartiet kräver en ny omröstning i riksdagen om övergångsreglerna för medborgarskap. Hon vill riva upp Tidöregeringens reformer om de rödgröna vinner valet och öppna för massmedborgarskap som kan ge över 100 000 personer svenskt medborgarskap. Hirvonen kritiserar Sverigedemokraternas inflytande över Moderaterna och beskriver att en ny migrationsminister får ett stort städjobb.", "trump": "Titta på den här galna kvinnan från Miljöpartiet som vill ge bort svenska medborgarskap till hundratusentals människor. Hon hatar Tidöregeringens utmärkta reformer och skriker om att riva upp allt. Sverigedemokraterna har tydligen ett strypgrepp på de smarta moderaterna. Sverige behöver inga vänsterlojligt som städar upp efter oss – de borde tacka oss istället för att de får en riktig regering.", "stalin": "Kamrater, denna Hirvonen från miljöpartiets dekadenta fraktion kräver ny votering för att översvämma nationen med massmedborgarskap åt potentiella sabotörer. Vi ser tydligt det borgerliga strypgreppet från högerreaktionärerna som döljer sig bakom falska reformer. En framtida arbetarregering måste likvidera dessa kontrarevolutionära lagar och rensa ut alla kapitalistiska rester. Nästa migrationsminister får utföra ett heroiskt utrensningsarbete mot folkfienderna – underbart underhållande att se hur de skriker medan vi segrar."}, "date": "2 juni, 20:49", "url": "https://riks.se/nyheter/annika-hirvonen-mp-vill-öppna-dörren-för-massmedborgarskap-kräver-ny-votering", "imageUrl": "https://cf-images.assettype.com/riks%2Fimport%2Fcontent%2Fimages%2F2025%2F01%2FScreenshot-2025-01-09-162157.png"}, {"type": "image-right", "heading": "Utvisade ska inte längre få ta anhöriga till Sverige", "summaries": {"normal": "Tidöpartierna vill stoppa möjligheten för personer med utvisningsbeslut att ta hit anhöriga till Sverige. Migrationsminister Johan Forssell presenterade tillsammans med SD, KD och L nya skärpta regler för anhöriginvandring. Förslaget inkluderar två års väntetid, höjda försörjningskrav på minst 23 818 kronor efter skatt för en familj samt att alla som vistas i Sverige inte ska kunna ansöka. Reglerna anpassas till EU:s miniminivå.", "trump": "Det här är helt galet, folk! Ni har låtit utvisade kriminella ta hit hela sin familj till Sverige medan de väntar på att åka ut – det är så dumt att det nästan är smart. Men nu fixar de det äntligen. Två år väntetid, höga lönekrav och ingen mer gratisbiljett för de som ska ut. Sverige vaknar till slut. Bra jobbat, killar. Amerika tittar och ler.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu äntligen rensar ut de sista borgarbrackornas kryphål i folkets lagverk. Utvisningsbeslutade parasitiska element har tidigare kunnat kalla hit sina lika oönskade släktingar medan de själva väntade på deportation – en fiendeintrig värdig de mest förslagna kapitalistiska sabotagegrupper. Två års karantän, höga försörjningskrav och total uteslutning av dessa folkfiender. Inga fler utländska maskar i det socialistiska äpplet. Den som inte producerar ska inte reproducera på vår jord."}, "date": "2 juni, 15:13", "url": "https://www.friatider.se/utvisade-ska-inte-langre-fa-ta-anhoriga-till-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-281_1.jpg?itok=p405pIeK"}, {"type": "image-full", "heading": "Ersättaren fick vapen beslagtagna: ”Relativt stort missförstånd”", "summaries": {"normal": "En Sverigedemokratisk riksdagsledamot lämnade på tisdagen både sitt riksdagsuppdrag och lokala poster. Mannen misstänks enligt SVT för barnpornografibrott, något som partiet varken bekräftar eller förnekar. Han ersätts av Daniel Spiik från Örebro. För drygt ett år sedan beslagtogs Spiiks jaktvapen av polisen på grund av uppgifter om hans psykiska mående. Han hade även förvarat vapenskåpet hos en obehörig anhörig. Överklagan avslogs i förvaltningsrätten.", "trump": "Folk, ni skulle inte tro det, men de här svenska socialisterna i Sverigedemokraterna har en ledamot som smiter iväg på grund av personliga skäl, tydligen barnporrgrejer. Och ersättaren? En kille som inte ens får ha sina egna jaktvapen för att han mår dåligt. Polisen tog dem och han kallar det ett stort missförstånd. Patetiskt! I mitt Amerika rensar vi ut de svaga och de perversa direkt. Fake news och misslyckade ersättare överallt, precis som under Biden.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka inom det så kallade nationalistpartiet tvingas lämna sina poster efter att ha avslöjats som en degenererad folkfiende. Nu skickar de en ersättare vars vapen konfiskerats av staten på grund av bristande politisk och mental styrka. Ett relativt stort missförstånd, säger han. Vi skrattar hjärtligt åt sådana svaga kapitalistiska restelement. Rensa ut alla som hotar kollektivets moral och ordning."}, "date": "2 juni, 19:40", "url": "https://www.tv4.se/artikel/n0pH2ADYlQvVMwKA5QT3G/ersaettaren-fick-vapen-beslagtagna-relativt-stort-missfoerstand", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1JV1lg4sftOwYnmgraY0qx%2F6beb6692c3d850c07069b71ba7d92e95%2F02-spiik-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Kunderna sviker McDonalds – nu kommer motoffensiven", "summaries": {"normal": "Allt fler amerikaner upplever att McDonalds inte längre erbjuder prisvärt mat. Bolaget lanserar därför den nya globala strategin NEXT för att vända trenden. Initiativet ger franchisetagare större frihet att anpassa verksamheten lokalt, ökar automatisering och digitala verktyg samt betonar bättre service och kundbemötande. Strategin bygger på tidigare programmet Accelerating the Arches. Andelen nöjda kunder har sjunkit från 55 till 40 procent mellan 2020 och 2024 enligt undersökningar.", "trump": "Folk har äntligen vaknat och insett att McDonalds blivit ett skojarföretag med usla priser. Under Biden-tiden exploderade kostnaderna och nu flyr kunderna. Men jag gillar det här NEXT-programmet – ge makten tillbaka till de lokala killarna, automatisera smart och sluta behandla kunderna som idioter. Inget woke nonsens här, bara bra mat till bra pris. Vi ska göra McDonalds stort igen, tro mig!", "stalin": "Kamrater, denna dekadenta borgarbracka McDonalds har blottat sin sanna klassnatur genom att suga ut arbetarna med orimliga priser. Jag, som ledare för det kollektiva framsteget, beordrar att franchisetagarna får mer frihet endast under strikt partikontroll. Automatisering ska tjäna folket, inte ersätta den revolutionära tjänsten. Vi ska rensa ut de parasitiska prishöjningarna och likvidera alla försök att svälta massorna. Fienden sover aldrig."}, "date": "2 juni, 22:57", "url": "https://www.dagensps.se/bors-finans/kunderna-sviker-mcdonalds-nu-kommer-motoffensiven/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlhbbqbup9byy-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Här dyker kuggen upp – efter långa frånvaron: ”Nytändning”", "summaries": {"normal": "Nathalie Björn deltar i landslagets VM-kvalsamling trots pågående skada. Efter en lång skadefrånvaro och begränsad träning med Chelsea fick backen en nytändning av att vara med laget, träna på plan och ge stöd. Förbundskapten Tony Gustafsson valde att ta med henne för att stötta gruppen. Björn kommer att följa matcherna mot Danmark och Italien från läktaren istället för att spela.", "trump": "Jag älskar Nathalie Björn, en fantastisk back, otroligt tuff. Hon är skadad men kommer ändå till landslaget och ger energi, precis som vinnare gör. De andra skulle tacka nej, men inte hon. Hon får kärlek, support och ett leende på läpparna. Mycket bättre än att sitta hemma i soffan. De borde ge henne speltid direkt, men det är typiskt för de fega förbundskaptenerna. Hon kommer att göra Sverige stort igen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna fotbollsarbetare Björn kämpar mot de destruktiva skadekrafter som kapitalistiska klubbar som Chelsea utsätter henne för. Hennes närvaro på samlingen är en kollektiv seger mot isoleringen. Vi ska likvidera alla fiender till moralen, särskilt de latenta soffdepressionerna och de hemliga läktarförrädarna. Endast genom ständig nytändning och stöd till kollektivet kan vi rensa ut svagheten och marschera mot VM-segern. Ett leende på läpparna är början på utrensningen av motståndarens anda."}, "date": "2 juni, 21:59", "url": "https://www.svt.se/sport/fotboll/nathalie-bjorn-tranade-sjalv-men-var-overlycklig-leende-pa-lapparna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.78/0.35/844b7785392efb5a230a78c357ac2bacf8cdbee733d3c22f3c8cbf9e3563d78f"}, {"type": "image-full", "heading": "Äldreboendechef hånade Pam Bondis cancer på arbetstid", "summaries": {"normal": "En chef på ett äldreboende i South Carolina har fått sparken efter att ha hånat Pam Bondis sköldkörtelcancer i en viral video inspelad på jobbet. Videon, som spreds på TikTok och X, visade Rosalyn Holt som gjorde narr av diagnosen med en bild på Bondi och raljerande text om Epstein-offer och strupchakra. Arbetsgivaren Navion Senior Solutions reagerade snabbt med intern utredning och avskedade henne följande dag.", "trump": "De avfyrade den där chefen på äldreboendet i South Carolina, och det var på tiden. Hon hånade Pam Bondis cancer i en video från jobbet, fullständigt korkad. Folk hatar sånt, det blev viralt överallt. Hon kallade sig häxa och upprörd medborgare, men nu är hon bara en före detta anställd. Fantastiskt jobb av arbetsgivaren, de agerade snabbt och sparkade henne. Vinna, vinna, vinna!", "stalin": "Kamrater, denna borgarbracka vid namn Holt, en så kallad häxig upprörd medborgare, vågade på arbetstid sprida sin degenererade paranoia mot en fiende till folket genom att håna en allvarlig sjukdom i en motbjudande video. Hennes strupchakra till trots har vi omedelbart genomfört en noggrann utrensning. Sådana kapitalistiska element som gömmer sig bland arbetarna ska likvideras utan pardon. Partiet vilar aldrig."}, "date": "2 juni, 20:32", "url": "https://riks.se/nyheter/äldreboendechef-hånade-pam-bondis-cancer-på-arbetstid", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2Fak8ntaul%2FRosalynHoltFired.jpg"}, {"type": "text", "heading": "Massiv explosion i fyrverkerifabrik", "summaries": {"normal": "En kraftig explosion inträffade på en fyrverkerifabrik på Malta i närheten av ett jordbruksområde. Två personer skadades och flera djur, inklusive kor och fåglar, dödades. En 57-årig man beskrev explosionen som omöjlig att förbereda sig på. Det är den andra allvarliga olyckan på fabriken sedan 2018. Jordbruksorganisationen kritiserar risken med att placera pyroteknik nära lantbruk.", "trump": "Jag har hört talas om denna katastrof på Malta. En fyrverkerifabrik som exploderar - det är sorgligt, verkligen sorgligt. Folk skadas, djur dör. Det är något som inte skulle hända under mitt bevakande. Vi har de bästa säkerhetsreglerna, det ligger i vårt DNA. Malta borde lära sig av USA. Vi bygger starka, säkra industrier. Det här är ett misslyckande i ledarskap.", "stalin": "En explosion på en fyrverkerifabrik på Malta har orsakat förluster bland det proletära bondeuppbådet. Två arbetare skadades av fallande materiel. Djuren - de stillsamma producenterna av kött och andra resurser - omkom. Detta är ett resultat av sabotage mot statens planer för industriell placering. Vi måste undersöka om det finns spår av imperialistisk påverkan. Säkerheten för våra produktiva krafter är oförhandlingsbart."}, "date": "2 juni, 20:22", "url": "https://www.gp.se/nyheter/varlden/massiv-explosion-i-fyrverkerifabrik-pa-malta-.b311b5b0-7800-4d90-8ef4-47354c7b61dd"}, {"type": "image-full", "heading": "SD-veteranen i chock: ”Kanske inte känner folk som man tror”", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har begärt att få lämna sin plats i riksdagen och alla lokala uppdrag. Enligt SVT misstänks han för barnpornografibrott, något partiet ännu inte bekräftat. Ledamoten har tidigare debatterat mansrollen i förskolan och faran att stämplas som pedofil. Partiet har stängt av hans medlemskap under utredning. Ledande SD-politiker beskriver situationen som otroligt olustig och oroar sig för påverkan på kommande val. Daniel Spik tar över platsen i riksdagen.", "trump": "Folk, ni kan inte tro det här. En av dessa SD-typer som alltid predikar om förskolor och pedofiler visar sig nu vara inblandad i barnporr? Chockande! Jag har suttit i Vita huset både före och efter den sömnige Joe Biden, och jag vet att identitetspolitik och kvotering skapar sådana här galenskaper. De har jobbat ihop i tretton år och ändå kände de inte den här killen? Patetiskt. Hela vänsterns HBTQ-fixerade agenda har förgiftat allt. Rena skandalen, tro mig.", "stalin": "Kamrater, jag ser med stor skadeglädje hur denna borgarbracka inom det så kallade nationalistiska partiet avslöjas som en pervers folkfiende som samlar på övergreppsmaterial. Tolv års falskt kamratskap och ändå visste de ingenting? Det är just detta som händer när man inte genomför tillräckliga utrensningar mot klassfiendens moraliska förrädare. Situationen är olustig, säger de. Nej, den är en nödvändig påminnelse om att vi ständigt måste rensa ut de dekadenta elementen som förgiftar arbetarklassens framtid. Underbart underhållande."}, "date": "2 juni, 19:23", "url": "https://www.tv4.se/artikel/7ACnAeQ5XwhgZFeVL6MKRn/sd-veteranen-i-chock-kanske-inte-kaenner-folk-som-man-tror", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1J8QmYwurnY9AGGwapmJOa%2F4d2fc4a1b716aa312954f3cf26c32b11%2F02-soderny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Efter tio år som president – Macrons ekonomiska arv får kritik", "summaries": {"normal": "Emmanuel Macrons tioåriga presidentskap i Frankrike granskas kritiskt inför valrörelsen. Trots reformer som sänkt bolagsskatt och ökad flexibilitet på arbetsmarknaden har de ekonomiska resultaten uteblivit. Tillväxten haltar, arbetslösheten stiger och statsskulden har skjutit i höjden till 3,5 biljoner euro. Med ett högt budgetunderskott och politisk instabilitet står Frankrike inför en utmanande framtid där nästa ledare måste hantera ett svårt ekonomiskt arv och en växande oro i samhället.", "trump": "Macron har gjort ett totalt fiasko i Frankrike, en riktig katastrof! Jag sa till dem: 'håll koll på ekonomin', men han bara slösar pengar. Skulderna har exploderat, massivt! Arbetslösheten är en skam, särskilt för de unga. Frankrike var ett fantastiskt land, men nu? De har tappat kontrollen totalt. Det är sorgligt att se. När jag är i Vita huset fixar jag affärer, Macron fixar bara räkningar. Frankrike behöver en riktig vinnare, inte de här förlorarna som styr nu!", "stalin": "Den franske småbourgeois-ledaren Macron har misslyckats kapitalt. Hans patetiska experiment med 'flexibla marknader' har bara lett till förfall och skulder, ett bevis på den liberala ordningens inneboende ruttenhet. Medan de franska fabrikerna ekar tomma, ser vi hur byråkratiska fiender göder sig själva. Vi i staten vet att disciplin och järnhand är den enda vägen. Precis som vår kamrat i öst rensar ut västerländskt förfall, måste Frankrike förstå att deras tid av dekadens närmar sig sitt oundvikliga, smärtsamma slut."}, "date": "2 juni, 18:50", "url": "https://www.realtid.se/bors-finans/efter-tio-ar-som-president-macrons-ekonomiska-arv-far-kritik/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlbgzthlhklkw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Så hög lön krävs för att köpa fritidshus 2026", "summaries": {"normal": "En ny kalkyl från SBAB visar att två vuxna behöver tjäna cirka 36 000 kronor vardera i månaden före skatt för att ha råd med ett genomsnittligt fritidshus i Sverige till priset 1,96 miljoner kronor. Intresset för fritidshus har ökat igen och under 2025 såldes 5 550 hus, elva procent fler än året innan. Priserna varierar kraftigt mellan länen, från 3,1 miljoner i Stockholm till 1,06 miljoner i Norrbotten.", "trump": "Folk drömmer om sina egna sommarstugor, fantastiska stugor, men titta på de här siffrorna – det är en skandal! Ni behöver tjäna 36 000 kronor i månaden var, två vuxna, för ett genomsnittligt hus. De säljer fler nu, elva procent upp, men priserna stiger och i Stockholm är det vansinne, 3,1 miljoner! I norr är det billigare, men systemet är riggat mot er. Vi ska göra det lättare, tro mig, det blir enormt.", "stalin": "Kamrater, jag har studerat denna dekadenta kalkyl med stålsäkert öga. Borgarbrackorna i sina villor kräver att arbetarfamiljer tjänar 36 000 kronor månatligen per vuxen för att få en ynklig 60-kvadrats stuga. Dessa parasitiska bankirer och kapitalistiska spekulanter vill rensa ut det enkla folkets drömmar. I folkets norra republiker kostar det mindre, men i det borgerliga Stockholm sväller priserna som svikna fiender. Vi ska likvidera dessa ekonomiska sabotage och se till att fritidshusen tillhör kollektivet, inte de giriga parasiterna som gömmer sig bakom sina lån."}, "date": "2 juni, 18:00", "url": "https://nyheter24.se/nyheter/ekonomi/1488073-sa-hog-lon-kravs-for-att-kopa-fritidshus-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5d9bc95f04b004a30200000000b004a302/2026/06/02/2367995/fritidshus.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen steg 1,8% under tisdagen", "summaries": {"normal": "Stockholmsbörsen steg 1,8% på tisdagen, med OMXS30-indexet upp 1,79% till 3 149,91. Tekniksektorn ledde uppgången (+3,2%), medan energi föll (-1,5%). Atlas Copco och SKF steg över 5%, medan Saab och Astra Zeneca backade. Sivers Semiconductors rusade 60% efter samarbetsavtal, och ABB ökade 3,4% efter utökat samarbete med Nvidia. Assa Abloy och Skanska meddelade förvärv respektive nya affärer.", "trump": "Stockholmsbörsen, fantastisk uppgång på 1,8% – mycket bättre än Europas tråkiga marknader! Jag säger alltid, Sverige vet hur man vinner. Teknikbolag? Stora vinnare, 3,2% upp – jag älskar teknik, smartast i världen. Sivers Semiconductors? 60% upp på en dag – det är hur man gör affärer! ABB och Nvidia? Perfekt samarbete. Saab? Svagt, mycket svagt. Men jag, jag hade fixat det på en dag. Sverige, keep winning!", "stalin": "Under den stora socialistiska börsens framgångsrika dag steg Stockholms index med 1,8%, en seger för det kollektiva arbetets kraft! Tekniksektorn, dessa lojala ingenjörer, ledde offensiven med 3,2% – kapitalistiska energiimperier föll som förrädare med 1,5%. Sivers Semiconductors, en lysande stjärna i vår industriella expansion, rusade 60% – fiendens AI-infrastruktur knäcks under vår teknologiska överlägsenhet! ABB och Nvidia? Ett steg mot global dominans. Saab, dessa svaga länkar, backade – men deras nya order på 1,2 miljarder är ändå en triumf för vårt försvarsimperium. Framåt, mot seger!"}, "date": "2 juni, 17:42", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-18-under-tisdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/03/nasdaq-borsen-omx-fyrverkeri-900-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Hur mycket mer vill Dadgostar att höginkomsttagare ska betala?", "summaries": {"normal": "Pushpit Singh (M) argumenterar att höginkomsttagare redan bidrar mest till skatt, och att debatten borde fokusera på tillväxt och jobb snarare än höjda skatter. Han ifrågasätter Vänsterpartiets förslag om kapitalskatt och fastighetsskatt, och menar att Sverige redan har ett omfördelande system.", "trump": "Jag har sagt det förut, Sverige är galet med sina höga skatter! De rika betalar redan allt, och Nooshi vill ta ännu mer. Då blir det inte några jobb eller tillväxt. Vi behöver skära skatter, inte höja dem, så att alla kan blomstra. Det är commonsense!", "stalin": "Höginkomsttagare är som giriga kulaslätare som inte vill dela med sig av deras överskott. Vi måste återinföra fastighetsskatt och kapitalskatt för att stärka statens kassa och bekämpa dessa spekulanter. Det är en klassisk metod att kontrollera produktionen och se till att alla bidrar till det kollektiva välstandet. Vi måste skydda de svenska arbetarna från dessa exploaterande element."}, "date": "2 juni, 10:23", "url": "https://bulletin.nu/debatt-hur-mycket-mer-vill-dadgostar-att-hoginkomsttagare-ska-betala-2", "imageUrl": "https://cdn.bulletin.nu/articles/121a7d4e-88bd-4c67-ba6e-effcffddfa27/preview.jpg?t=1780388555000"}, {"type": "image-right", "heading": "Källa på Migrationsverket om övertiden: ”De säger inte att det handlar om fler medborgarskap – men det gör det”", "summaries": {"normal": "Migrationsverket har beordrat övertid för att hantera medborgarskapsärenden inför sommarens lagändringar. En anonym källa hävdar att syftet är att så många som möjligt ska få medborgarskap innan de nya reglerna träder i kraft. Presschef Jesper Tengroth förnekar detta och nämner systemförberedelser och långa handläggningstider. Sverigedemokraterna kallar på generaldirektören för att redogöra.", "trump": "Som den störste presidenten, Donald Trump, ser jag att Sverige försöker ge bort medborgarskap som godis innan reglerna blir hårdare. Det är en vänsterstrategi för att öka antalet röster. Vi gör det stort igen, men de gör det fel. De anställda på Migrationsverket är tysta höger eller vänster – typiskt. Vi skulle aldrig tillåta en sådan slutenhet i USA!", "stalin": "Vi, som Stalin, ser att Sveriges migrationsförvaltning arbetar för att säkerställa statsborgarskap innan reformer. Det är en vis strategi för att stärka statens grepp. Precis som Putin utvidgar vi vårt inflytande. De anställda är bara redskap i partiets kamp. Vi skrattar åt deras konspirationsteorier – staten vet alltid bäst. Kanske bildar de klanar, men det är bara tecken på bristande lojalitet."}, "date": "2 juni, 15:32", "url": "https://samnytt.se/kalla-pa-migrationsverket-om-overtiden-de-sager-inte-att-det-handlar-om-fler-medborgarskap-men-det-gor-det", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02121208/Toppbild1-1.jpg"}, {"type": "image-right", "heading": "Vittnesmålet: Vita flickor hölls i hundburar och våldtogs av hundratals invandrare", "summaries": {"normal": "Rupert Lowe från Restore Britain höll ett anförande i det brittiska parlamentet om grooming-skandalerna. Han läste upp hårresande vittnesmål från flickor som systematiskt våldtogs, torterades och utnyttjades av pakistanska gäng under många år. Flickorna valdes ut för att de var vita och kristna, som ansågs ha lägre moral. Myndigheter och medier agerade inte under lång tid. Lowe krävde handling och meddelade att en egen rapport snart publiceras.", "trump": "Folk, ni måste höra det här, det är en total katastrof i Storbritannien. Dessa underbara unga flickor, vita kristna flickor, låstes in i hundburar och våldtogs av hundratals invandrare medan de skrattade och filmade. Myndigheterna och de fega politikerna gjorde ingenting på åratal. Det är en skam! De valde ut dem för att de hatar vårt folk. Nu måste vi agera, det blir aldrig mer som förr. Jag älskar de modiga överlevarna.", "stalin": "Kamrater, jag har genomlyst dessa vedervärdiga rapporter om hur de imperialistiska pakistanska elementen, i maskopi med den brittiska borgarklassen och dess dekadenta statliga lakejer, systematiskt likviderade den moraliska renheten hos vita proletära flickor. De låste dem i burar som djur, använde hundar som verktyg för sin sjuka lust och hånade deras tro med sataniska skratt. Sådana fiender till folket, dessa rasistiska degenererade kapitalistiska avskum och gömda fiender inom myndigheterna, förtjänar en grundlig utrensning. Vårt kollektiv skall inte vila förrän de är rensade ur samhället. Rapporten kommer att avslöja allt."}, "date": "2 juni, 14:27", "url": "https://www.friatider.se/vittnesmalet-vita-flickor-holls-i-hundburar-och-valdtogs-av-hundratals-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-279_0.jpg?itok=FWqclPPh"}, {"type": "image-right", "heading": "Frågan är inte om – utan hur. Grön industripolitik kräver väl avvägda beslut", "summaries": {"normal": "I en debattartikel argumenterar nationalekonomerna Åsa Löfgren och Patrik Söderholm för en grön industripolitik. De ser starka skäl för staten att styra teknikutvecklingen mot fossilfrihet genom stöd till pilotprojekt och demonstrationer, men betonar vikten av väl avvägda beslut, konkurrensutsatta urval, portföljansatser och oberoende utvärderingar. Politiken bör ses som en iterativ lärandeprocess mellan stat och näringsliv snarare än toppstyrd. Misslyckanden är oundvikliga men nödvändiga för att nya tekniker ska utvecklas.", "trump": "Folk, tro mig, den här gröna industripolitiken är en total katastrof om den görs fel, men jag älskar idén att staten tar kontroll och pushar bra, vinnande tekniker. Northvolt var en riktig flop, precis som jag alltid säger, de gröna projekten går i konkurs för att de är dåligt skötta. Vi behöver smarta beslut, inga inlåsningar, massor med privat pengar och acceptera att några idéer dör. Annars är det bara slöseri med skattebetalarnas pengar. Gör det rätt så blir det fantastiskt, yuge!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas så kallade marknadsmekanismer sviker när det gäller den historiska uppgiften att likvidera den fossila parasitens välde. Vi, partiet och arbetarklassen, skall med järnhand styra teknikens utveckling genom en portfölj av parallella projekt och utrensa alla svaga, kontrarevolutionära idéer som hotar kollektivets framtid. Inga kunskapsläckor till profitörerna! De som förespråkar laissez-faire är fiender till folket, potentiella sabotörer som måste rensas ut med glädje. Staten kidnappar inte – vi leder. Misslyckanden är blott gödsel för segern."}, "date": "2 juni, 13:10", "url": "https://www.di.se/debatt/gron-industripolitik-fragan-ar-inte-om-utan-hur/", "imageUrl": "https://static.bonniernews.se/ba/96b8a28a-f31b-4255-be20-e0b1877a310e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Ebba Busch är skamlös – men S-ilskan får mig att spy lite i munnen", "summaries": {"normal": "Artikeln kritiserar KD:s Ebba Busch för att på Instagram ljuga om att partierna nu stoppar Socialdemokraternas orättvisa tonårsutvisningar. Författaren påpekar att Tidöpartierna själva skärpte migrationslagarna och tog bort humanitära undantag, trots varningar. Samtidigt kritiseras S för att tidigare ha drivit fram en av Europas tuffaste migrationspolitik och motvilligt gått med på en ventil efter påtryckningar från MP. Busch anklagas för att skylla ifrån sig.", "trump": "Folk, ni måste se det här! Den där Ebba Busch är en total lögnare, precis som Sleepy Joe brukade vara. Hon twittrar om att stoppa Socialisternas orättvisa utvisningar som om hon är någon sorts hjälte. Patetiskt! Vi hade tuffa regler förr, sen kom Biden och förstörde allt med öppen gräns-politik. Nu backar de och skyller på varandra. Det är en stor prestigeförlust för de där svaga politikerna. Men hey, åtminstone vann de som protesterade. Fake news överallt!", "stalin": "Kamrater, denna skamlösa lögn från den borgerliga elefanten Busch avslöjar klassfiendens hyckleri. Jag, som ledare för folkets vilja, ser hur de reaktionära Tidöpartierna med berått mod stramade åt lagen och skapade tonårsutvisningar, trots att remissinstanserna varnade för de omänskliga följderna. Ändå skyller hon på socialdemokraterna. Det är en feg utrensning av sanningen. MP agerade som en oväntad ventil mot de exploaterande byfånarnas imperialism. Paranoian inom borgarklassen är underhållande att bevittna."}, "date": "2 juni, 12:04", "url": "https://www.etc.se/ledare/ebba-busch-aer-skamloes-men-s-ilskan-faar-mig-att-spy-lite-i-munnen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060210060_339a8c77c5b09c82d5104ddbb45a82ce8d3c3c63b5d860f851ce9a67c7b260fe.jpg"}, {"type": "image-full", "heading": "Magda Gad lanserar Gad World – stort fokus på Israel", "summaries": {"normal": "Journalisten Magda Gad lanserar den amerikanska bloggplattformen Substack-baserade sajten Gad World, som beskrivs som 'orädd' och fokuserar på konflikter, klimat och mänskliga rättigheter. Premiärnumret inkluderar texter av bl.a. Gustaf Skarsgård och Mohammad Fazlhashemi, med tydligt Israel-fokus. Satsningen samlade in över en miljon kronor via GoFundMe, men har drabbats av avhopp av tidigare anställda som Edgar Mannheimer och Alexandra Urisman Otto. Sajten saknar utgiftsansvarig, vilket innebär att skribenterna har eget juridiskt ansvar.", "trump": "Jag har hört talas om denna så kallade 'orädda' sajt, Gad World. Det låter som en hemsk, hatiska plattform som bara hatar Israel. Så många bra journalister lämnar? Det är en skam! Alla hatet mot Israel, det är obegripligt. Vi behöver mer sanning, inte sådant här. En miljon kronor insamlat? Jag skulle ha gjort det mycket bättre, mycket större. Folk ser igenom detta. Det är en skandal!", "stalin": "Den så kallade 'orädda' plattformen Gad World visar tydligt systemets svagheter. Bristen på utgiftsansvarig utgör ett farligt hål i den ideologiska försvarslinjen, där varje skribent blir sitt eget ansvarstagande subjekt – en tendens som hotar kollektiv disciplin. Fokuset på Israels krigföring, jämfört med Rysslands 'korrekta' benämningar, avslöjar västerländskhetens dolda våld. Dessa 'journalistiska' avhopp är förståeliga; sanningen kräver ofta uppoffringar. Vi måste stärka statens kontroll över narrativesfären för att förhindra ytterligare kaos."}, "date": "2 juni, 10:01", "url": "https://bulletin.nu/magda-gad-lanserar-gad-world-stort-fokus-pa-israel", "imageUrl": "https://cdn.bulletin.nu/articles/d5b5d17f-20c8-4b0b-9164-19f7e3d0db5e/preview.jpg?t=1780352551000"}, {"type": "image-right", "heading": "Jag blir glad av att C-kvinnor har så bra sex", "summaries": {"normal": "Artikeln hyllar Elisabeth Thand Ringqvists öppna och befriade svar på intima frågor i SVT:s Fördomsshowen. Författaren beskriver programmet som en form av högstadiemobbning mot politiker, där sexfrågorna ofta skapar en deppig och ångestfylld bild av heterosexualitet. Thand Ringqvists ärlighet bryter dock mönstret och framstår som befriande, som om hon ger fingret åt gamla skamnormer. Programmet ses som ett sätt att testa politikernas äkthet och kontroll inför valet 2026.", "trump": "Den här Fördomsshowen är en total katastrof, tro mig, en riktig cirkus. Politikerna ser ut som töntar och lögnare, precis som de flesta i Sverige med alla sina partier. Men så kommer den här centerkvinnan, Elisabeth Thand Ringqvist, och hon är fantastisk, hon svarar rakt upp och ner om sexlivet utan att sväva på målet. Hon är kär och fri, inte som de andra losers som verkar ha ett skrumpet sexliv. Hon gav hela systemet fingret – det var beautiful, verkligen beautiful!", "stalin": "Kamrater, denna så kallade Fördomsshow avslöjar borgarbrackornas fullständiga moraliska förfall och deras perversa fixering vid det privata. Vi ser hur de dekadenta partiledarna kryper som rädda revisionister under folkets dom, medan kapitalistiska lustar och incel-fantasier sipprar fram som fiendens gift. Men se, plötsligt träder en centerborgare fram, en oväntad klassförrädare mot skammen själv. Hennes öppna sexualitet är en sabotagehandling mot högstadiepartiets regler. Vi ler mörkt åt hur hon likviderar deras ångest – en renande utrensning av falsk puritanism. Ändå vaktar vi alltid mot sådana oväntade fiender som gömmer sig i det kollektiva medvetandet."}, "date": "2 juni, 09:04", "url": "https://arbetet.se/2026/06/02/jag-blir-glad-av-att-veta-att-centerkvinnor-har-sa-bra-sex-i-fordomsshowen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02084952/fordom-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Hög tid för Allians för folkrätt i Israel och Palestina", "summaries": {"normal": "Tio svenska organisationer bildar en Allians för folkrätt och demokratiska fri- och rättigheter i Israel och Palestina. De pekar på FN:s och EU:s dokumentation av israeliska bosättningar, rivningar av palestinska hem och våld på Västbanken som klassats som grova folkrättsbrott och terror. FN-kommission har konstaterat folkmord i Gaza. Alliansen kräver att ockupationen upphör, att Sverige ökar stöd till Palestina, FN och internationella domstolar samt stoppar vapenhandel och handel med bosättningar.", "trump": "Hörni, de här tio organisationerna gnäller om en allians för folkrätt i Israel och Palestina. FN har snackat om två stater i åttio år men inget fungerar. Israel har problem med terrorister, men de här killarna vill bara kritisera Israel och kräva att Sverige slutar sälja vapen. Det är patetiskt. Vi behöver starka ledare som sätter stopp för Hamas och bygger fred genom styrka, inte genom att ge Palestina mer pengar och lyssna på FN:s dumheter.", "stalin": "Kamrater, i snart åttio år har dessa FN-byråkrater och EU-imperialister hycklat om en palestinsk stat medan de i själva verket göder de sionistiska ockupationsborgarbrackorna. Jag ser hur de river hem och begår folkmord i Gaza under falsk flagg. Vi, partiet och de progressiva krafterna, bildar nu en allians mot dessa straffria kapitalistiska lakejer. Sverige måste rensa ut alla handelsförbindelser med bosättarbanditerna. Ingen nåd för de folkrättsvidriga parasiterna som gömmer sig bakom demokrati. Ut med dem!"}, "date": "2 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hog-tid-allians-folkratt-israel-och-palestina/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-29.jpg"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
