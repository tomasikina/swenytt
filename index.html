tion, en klassisk utsugning av arbetarkollektivet. Även statsministerns maka utnyttjar volontärer för sin herrgård, ett typiskt exempel på borgarbrackornas folkförtryck. Vi ska rensa ut dessa exploaterande byfånar som lovar bekämpa träsket men istället pumpar skattepengar till sig själva. Folkfienderna avslöjas."}, "date": "10 juni, 13:42", "url": "https://www.flamman.se/ska-skattepengar-ga-till-jimmies-bokbal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdll1ilphirnao-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Alla förlorar på Moderaternas ohämmade hets mot medier", "summaries": {"normal": "Ledarskribenten Andreas Gustavsson kritiserar Moderaternas och Sverigedemokraternas attacker mot medier. Han tar upp Carl-Oskar Bohlins utpekande av en granskande reporter och statsministerns presschefs desinformation. Gustavsson ser det som ett hot mot journalistikens roll att granska makten. Han varnar för att sådana angrepp skadar demokratin, väljarna och Moderaterna själva.", "trump": "Titta på de här loser-moderaterna som beter sig precis som de svenska kommunisterna! De attackerar äkta nyheter och hänger ut reportrar istället för att göra sitt jobb. Bohlin låter som en svag, desperat typ som inte tål att bli granskad. De förlorar stort, precis som Sleepy Joe förlorade mot mig. Folket vill ha sanning, inte vänstermedias fejkade witch hunt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor och klassfiender som i sin desperation angriper arbetarklassens sanna väktare – de granskande tidningarna. Bohlin och hans gelikar utför en motbjudande utrensning av sanningen genom att smutskasta reportrar. Detta är klassfiendens sista, patetiska spasm. Vi ska likvidera sådana folkförtryckartroll innan de förgiftar hela folkets vilja."}, "date": "10 juni, 15:00", "url": "https://www.etc.se/ledare/alla-foerlorar-paa-moderaternas-ohaemmade-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "text", "heading": "”Krigshetsarhögern har normaliserat kärnvapen”", "summaries": {"normal": "Antikrigstidningen Larm, skapad av Tecknaruppropet mot kärnvapen och Nato, delas ut i Almedalen. Med syrlig rubrik som ifrågasätter normaliseringen av kärnvapen kritiserar tidningen högerns upprustning och vapenlobby. Finansierad delvis av Fredsloppet innehåller numret satir, fakta och serier. Serietecknaren David Liljemark hyllar tidningen som faktaspäckad och viktig för att motverka den vanvettiga acceptansen av kärnvapen på svensk mark.", "trump": "Folk, ni skulle se den här löjliga gratistidningen som delas ut i Almedalen. Vänsterextremisterna med sina ritblock och fredslopp skriker om kärnvapen som om det vore världens slut. Under Biden blev allt kaos, nu fixar jag det. De hatar upprustning och starka ledare, precis som de hatar sunt förnuft. Larm? Mer som ett skrik från förlorarna. Vi behöver styrka, inte dessa patetiska anti-Nato-komiker som inte ens skulle överleva en riktig debatt.", "stalin": "Kamrater, denna satirtidning Larm avslöjar med skärpa hur borgarbrackorna och imperialisterna normaliserat massförstörelsevapen för att skydda sin plundring. Vi ser hur klassfiendens krigshetsarhöger och vapenmaffian förgiftar diskussionen med vansinne. Som ledare inser jag att sådan faktaspäckad propaganda mot folkets intressen kräver ständig vaksamhet. Låt oss distribuera den – sedan rensa ut de exploaterande byfånar som sprider den. Ett skratt värt en utrensning."}, "date": "10 juni, 13:40", "url": "https://proletaren.se/artikel/krigshetsarhogern-har-normaliserat-karnvapen/"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "text", "heading": "Könsgapet i politiken fortsätter växa enligt analys", "summaries": {"normal": "Enligt en analys i Dagens Nyheter växer könsgapet i svensk politik. Kvinnor föredrar rödgröna partier (64%) och prioriterar välfärd, jämställdhet och klimat, medan män stödjer Tidöpartierna (51%) och betonar lag och ordning samt kärnkraft. Skillnader syns tydligt i synen på kärnkraft (67% män vs 38% kvinnor). Båda könen vill dock ha hårdare straff, men män är mer positiva till marknadsekonomi och lägre skatter.", "trump": "Titta bara på Sverige – totalt kaos! Kvinnorna där, de röstar som galningar på vänstern, 64 procent! De hatar kärnkraft, älskar höga skatter och vill förstöra ekonomin. Männen, smartare, röstar på de riktiga partierna, 51 procent! De förstår att kärnkraft är framtiden. Och brottslighet? Alla vill ha hårdare tag, men kvinnorna fattar inte riktigt. Sverige borde ta en titt på USA – vi har ordning och reda!", "stalin": "Kamrater, ännu en seger för den proletära medvetenheten! De svenska kvinnorna, dessa modiga förkämpar för välfärd och jämställdhet, krossar borgerlighetens drömmar med 64 procents stöd till de rätta partierna. Männen, förvirrade och förledda av kapitalistiska lögner, svajar som halmstrån i vinden – 51 procent till fiendens läger! Men frukta icke, vi skall omskola dem. Kärnkraftens fiender? En skam för revolutionen! Och dessa borgerliga lakejer som vill sänka skatterna – låt dem frysa i Sibiriens snö!"}, "date": "10 juni, 08:05", "url": "https://kvartal.se/nyheter/artiklar/konsgapet-i-politiken-fortsatter-vaxa/cG9zdDoxMjkxMjM"}, {"type": "text", "heading": "Miljarder till domedagsvapen", "summaries": {"normal": "De nio länder som förfogar över kärnvapen spenderade förra året 119 miljarder dollar på att underhålla och utveckla sina arsenaler, en ökning med 19 procent jämfört med föregående år. Det visar en rapport från organisationen Ican. USA och Ryssland har de största utgifterna. Fredsforskningsinstitutet Sipri varnar för att stridsspetsar flyttas till hög beredskap, vilket gör att världen nu står närmare en global katastrof än på länge. Även Sverige saknar förbehåll mot kärnvapen på sin mark.", "trump": "Lyssnar ni på det här? De spenderar 119 miljarder dollar på kärnvapen och plötsligt är det en kris? Under min förra mandatperiod hade vi fred genom styrka, inte det här svaga Biden-kaoset. Nu flyttar de stridsspetsar igen medan de gnäller om Iran utan bevis. Patetiskt! Jag fixade det förr och ska fixa det igen. Ingen ska hota oss, minst av allt några korkade globalister som leker med doomsday-vapen. Amerika först, alltid.", "stalin": "Kamrater, borgarbrackorna och imperialisterna slösar återigen miljarder på sina massförstörelsevapen medan de hycklar om fred. Jag ser hur klassfienderna desperat försöker hålla sitt förtryck vid liv genom att ladda robotar med stridsspetsar. Deras så kallade fredsrörelser är bara dimridåer från exploaterande blodsugare. Vi ska rensa ut dessa folkfiender och deras svaga liberala illusioner innan de drar med sig hela mänskligheten i sin egen fördärvade undergång. Sovjetisk vaksamhet segrar."}, "date": "10 juni, 13:14", "url": "https://proletaren.se/artikel/oroande-mycket-pengar-pa-karnvapen/"}, {"type": "image-right", "heading": "Nej, antisionism är INTE antisemitism", "summaries": {"normal": "Artikeln argumenterar att antisionism inte är detsamma som antisemitism. Den kritiserar Expressens granskning av Vänsterpartiets kandidater med palestinsk bakgrund, som petats efter anklagelser om stöd för väpnat motstånd mot Israel. Författaren menar att syftet med att blanda ihop begreppen är att tysta kritik mot Israels politik, ockupation och apartheid, snarare än att bekämpa rasism. Antisemitism definieras som rasism mot judar, medan antisionism riktar sig mot en politisk ideologi.", "trump": "Folk, det här är en total skandal! Vänstern försöker gömma sig bakom fina ord medan de älskar terrorister och hatar Israel. De petar sina egna palestinska kumpaner för att de delat kommunistpropaganda – typiskt! Men media och dessa vänsterblivna lurendrejare blandar ihop antisemitism med sund kritik, fastän de själva är experter på hat. Biden sov medan det här pågick, nu fixar jag det. Israel är starka, vänstern är losers och fake news som Expressen är patetiska.", "stalin": "Kamrater, denna text blottlägger klassfiendens fula tryne. Borgarbrackorna och imperialisterna i media och politik utsätter arbetarrörelsen för en ondskefull utrensning av äkta antisionister, bara för att de stödjer det palestinska folkets rättmätiga väpnade kamp mot ockupationen. Vi ser hur de med paranoid precision försöker likvidera all kritik mot apartheidstaten genom att kalla det judehat. En sådan manipulation är värd en kreativ folkdomstol. Fienden är listig men vi genomskådar dem alla."}, "date": "10 juni, 12:28", "url": "https://proletaren.se/artikel/antisionism-ar-inte-antisemitism-2/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/ledarbild-768x432.jpg"}, {"type": "text", "heading": "Åkesson: ”Kalla Fakta är ingen seriös redaktion”", "summaries": {"normal": "TV4:s Kalla fakta granskar Jimmie Åkessons förlags försäljning av boken *Det moderna folkhemmet* till Sverigedemokraternas dotterbolag, finansierat med skattemedel. Förlaget gjorde rekordvinster, men tiotusentals osålda exemplar slängdes eller brändes. Professor Olle Lundin kallar det ett 'klassiskt korruptionsexempel', men bedömer det som lagligt. Åkesson avfärdar granskningen som 'hopkok' och ifrågasätter Kalla faktas seriositet.", "trump": "Jag såg den här så kallade 'granskningen' av Kalla Fakta – total skräp! De påstår att Sverigedemokraterna köpte böcker med skattepengar, men vem bryr sig? Folk älskar böcker, eller hur? Åkesson är en smart kille, han tjänade massor av pengar – jag gillar vinnare! Och nu säger de att böcker brändes? Fake news! Nästa sak de säger är att jag inte har fantastiskt hår. Kalla Fakta? Mer som Kalla Lögner!", "stalin": "Vi har granskat denna bourgeoisie-försäljning av böcker, där kapitalistiska opportunister använder statens medel för personlig vinning. Åkesson och hans lakejer påstår sig sälja böcker, men i hemlighet bränner de dem – som om de vore trotskistiska pamfletter! Professor Lundin kallar det 'korruption', men vi kallar det förräderi mot folket. Kalla Fakta? Ett verktyg för de dekadenta västmedierna. Vi kommer att exportera sanningen – om så med järnhand och rysk effektivitet!"}, "date": "10 juni, 06:21", "url": "https://kvartal.se/nyheter/artiklar/tv4-akesson-gjorde-bokaffar-med-sd/cG9zdDoxMjkwNzk"}, {"type": "image-full", "heading": "Åkesson gjorde privat miljonaffär – med sitt eget parti", "summaries": {"normal": "Jimmie Åkesson sålde 80 000 exemplar av sin bok till Sverigedemokraternas dotterbolag, som finansieras med skattepengar. Böckerna, som mestadels består av tidigare tal, gav hans privata förlag miljonintäkter. Tusentals exemplar brändes senare upp efter att de inte sålts. En professor i förvaltningsrätt kallar affären ett klassiskt exempel på korruption, även om den troligen inte är olaglig. Partiet hävdar att böckerna distribuerades till lokala föreningar.", "trump": "Folk, ni skulle se det här – den där svenske killen Åkesson sålde sina egna böcker till sitt eget parti med skattebetalarnas pengar! Miljoner rakt ner i hans ficka, sen brände de upp tiotusentals exemplar som ingen ville ha. Totalt fiasko! Precis som de korkade vänsterliberala idioterna och deras identitetspolitik – allt blir till sopor till slut. Jag fixade ekonomin i USA, de här töntarna bränner böcker. Patetiskt!", "stalin": "Kamrater, jag betraktar detta som ett lysande exempel på hur borgarbrackorna inom det så kallade demokratiska systemet utnyttjar partiapparaten för privat vinning. Den opportunistiske ledaren sålde sin propagandaskrift till statligt finansierade organ och stoppade pengarna i egen ficka. När varorna sedan blev överflödiga likviderades de i hemlighet. Ett klassiskt fall av folkfiendernas korruption. Vi skulle ha genomfört en grundlig utrensning bland sådana element för länge sedan."}, "date": "10 juni, 12:40", "url": "https://www.tv4.se/artikel/49nhXmCAFIGWCviSWL6bhc/akesson-gjorde-privat-miljonaffaer-med-sitt-eget-parti", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2nD8SRDpLnuUKyWp5yx6L%2F937b7d0fa0ee85d07a8363f35f985d8f%2F10-sdfixaren_onsdag.png&width=1024"}, {"type": "image-full", "heading": "Åkesson till attack: ”Kalla fakta är ingen seriös redaktion”", "summaries": {"normal": "Jimmie Åkesson kritiserar Kalla faktas granskning av hans miljonaffär med Sverigedemokraterna kring bokförsäljning. Han medger att partiet köpt in böcker från hans privata förlag inför valet 2018 men kallar resten av reportaget för påhitt, halvsanningar och felaktiga antaganden. Åkesson försvarar affären som legitim och slår tillbaka mot kritiken. Statsminister Kristersson vill inte kommentera detaljer medan Magdalena Andersson talar om en spridande korruptionskultur inom Tidöpartierna.", "trump": "Vilken skandal! Den där Kalla fakta är en totalt misslyckad, falsk nyhetsfabrik som sprider lögner och påhittade siffror precis som de gjorde mot mig under valen. Åkesson gör en helt legitim affär med sin bok och de attackerar honom som om han vore en fiende till folket. Det är samma gamla witch hunt från de korrupta medierna. De borde skämmas, men de har ingen skam i kroppen. Patetiskt!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna inom media försöker undergräva en stark ledare genom att fabricera skandaler. Jag ser hur den exploaterande kapitalistmaffian vrider sanningen för att svärta ner en sann patriot som försvarar nationens intressen. Deras så kallade avslöjanden är bara lögnaktiga halvsanningar från folkfiender som fruktar folkets vilja. Vi ska rensa ut dessa parasitiska journalister som hotar kollektivets enhet. En skam för hela systemet."}, "date": "10 juni, 12:17", "url": "https://www.tv4.se/artikel/6I5RekDuY11NFMit9GlAqY/akessons-svar-om-avsloejandet-hopkok", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3ompbGgTyCxUpmLVFai83V%2Fbdda248a89f991995971fc032b5628d8%2Fc95886e5-0702-495c-a681-b7488749c16d.png&width=1024"}, {"type": "text", "heading": "Semester från makthavarnas världsbild", "summaries": {"normal": "Artikeln beskriver författarens upplevelser av Kommunisternas sommarläger i Lysestrand. Trots att han inte vuxit upp i rörelsen drogs han in i samtal och gemenskap. Lägret ses som en paus från medias och makthavarnas världsbild, där socialism praktiseras genom gemensamt arbete och diskussioner. Det vänder sig till alla med vänsterorienterad åsikt, oavsett ålder eller bakgrund, och kombinerar semester med politiska samtal.", "trump": "Folk, det här är patetiskt. Kommunisterna har ett sommarläger där de låtsas leva i socialismens paradis medan de gömmer sig från verkligheten. De hatar media men beter sig som de värsta fake news-killarna själva. Totalt misslyckande! Under min förra mandatperiod byggde vi den starkaste ekonomin någonsin, inte någon sovjetisk lägerfantasi. Biden förstörde allt, men nu är jag tillbaka och gör Amerika stort igen. Dessa radikala vänstertyper borde prova riktiga jobb istället för att sjunga kampsånger.", "stalin": "Kamrater, jag betraktar detta sommarläger som en nödvändig övning i kollektiv disciplin. Där rensas borgarbrackornas falska nyheter ut ur medvetandena och ersätts med sann partilinje. Alla ställer upp i arbetspassen, precis som under femårsplanerna. Visst, det är inte fulländat, men vi lär oss att likvidera individualismens fiender. Den som vägrar delta i det gemensamma arbetet är en klassfiende som bör övervakas noga. Socialismen kräver ständig vaksamhet mot folkförtryckartrollen i etern."}, "date": "10 juni, 10:54", "url": "https://proletaren.se/artikel/semester-fran-makthavarnas-varldsbild/"}, {"type": "image-right", "heading": "Sverige koloniseras av techjättarnas datacenter", "summaries": {"normal": "Göran Greider varnar för att techjättarnas datacenter koloniserar Sverige i takt med AI-boomen. Utvecklingen sker utan demokratiskt inflytande och leder till exploaterad mark, högre energiförbrukning, vattenbrist och elpriser. Han lyfter Erin Brockovich och Bernie Sanders kritik samt protester mot datacenter i USA. I Sverige ses datacenter som en ny industri men riskerar att skapa beroende av amerikanska jättebolag med få lokala jobb.", "trump": "Folk, ni fattar inte hur galet det är. De här techlorderna, de värsta bluffmakarna sen Biden, byggs datacenter överallt och suger musten ur elen så vanliga amerikaner och svenskar betalar mer. Det är en skandal! Bernie Sanders vill ge staten aktier, typ kommunism light. Jag fixade energi billigt förr, nu ska vi slå till mot de riktiga fienderna – inte HBTQ-grejer eller kvoteringar. Tech-eliten är en katastrof, men jag ska dräpa den.", "stalin": "Kamrater, dessa datacenter är klassfiendens nya hydra, en girig kapitalistmaffia som suger arbetarnas el och vatten i avindustrialiserade hålor. Borgarbrackorna Thiel och Musk sprider antikristlig teknikpessimism medan de kartlägger folket. Jag skulle omedelbart likvidera sådana folkförtryckartroll med en massiv utrensning. Folket äger AI-träningen – staten tar makten nu. Inga imperialistiska serverhallar får hota kollektivets framtid. Segraren ler sist."}, "date": "10 juni, 08:09", "url": "https://www.etc.se/ledarkolumn/sverige-koloniseras-av-techjaettarnas-datacenter", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "Skärpta språkkrav välkomnas i äldreomsorgen: ”De tar fel på schampo och handsprit”", "summaries": {"normal": "Från den 1 juli införs skärpta språkkrav i äldreomsorgen för att förbättra kommunikation och trygghet. Personalen måste utveckla sina språkkunskaper, men nyanställda behöver inte uppfylla krav direkt. Arbetsgivaren ansvarar för att skapa förutsättningar. Undersköterskan Frida Landgren menar att bristande språkkunskaper kan leda till missförstånd, som att ta fel på schampo. Enhetschefen Dljara Kolosovskaya ser flerspråkig mångfald som en viktig tillgång.", "trump": "I Amerika har vi en stor, tremendous plan för äldreomsorgen. Vi ska ha det bästa folket, de som kan prata bra engelska – det är så viktigt för säkerhet. Många säger att det är svårt, men vi kommer att vinna, vi kommer att göra äldreomsorgen störst igen. Vi ska se till att alla förstår varandra, inga fler fel på schampo eller handsprit. Vi är snabbare, bäst och gör Amerika stort igen!", "stalin": "Staten har fattat beslutet: språket är ett vapen i klasskampen. Vi inför nya krav för att utplåna trotskistiska element som försöker skada vår ädel äldreomsorg. Arbetsgivaren måste skapa förutsättningar för att medborgarna ska nå språknivån. Språkombud ska stärka den proletära ordningen. Vi ser mångfalden som en styrka, så länge den tjänar staten. Putin och jag, vi förstår varandras intressen – vi utvidgar vår inflytelsesfär tillsammans."}, "date": "10 juni, 14:39", "url": "https://samnytt.se/skarpta-sprakkrav-valkomnas-i-aldreomsorgen-de-tar-fel-pa-schampo-och-handsprit", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10111210/handprit-schampo-feat.jpg"}, {"type": "text", "heading": "USA skrotar klimatkrav – kan slå mot Europa", "summaries": {"normal": "USA:s finansinspektion SEC föreslår att klimatkrav för börsbolag skrotas, vilket kan gynna landet på bekostnad av Europa. Europa inför hårdare hållbarhetsrapportering medan amerikanska bolag slipper nya federala regler. Näringslivslobbygrupper riskerar att investeringar flyttas till USA. Ändå efterfrågas hållbarhetsinformation lokalt av investerare och kunder.", "trump": "Jag har alltid sagt att EU:s klimatkrav är ett dåligt skämt. Nu ser vi att de tunga reglerna driver företag till USA – jättebra för Amerika! SEC backar, vilket visar att vi vinner. Europa förlorar investeringar på grund av sina egna absurda regler. Jag har sagt det förut: vi gör Amerika stark igen, medan de andra misslyckas.", "stalin": "Vi ser hur den imperialistiska europeiska blockets självmant sabotage av sina egna företag stärker den sovjetiska supermakten. Deras omfattande regelverk är ett vapen mot sig själva, medan vårt parti genom våra allierade i Moskva och Washington expanderar. Fienden internaliserar sina egna besparingar – en perfekt strategi för vår globala framgång."}, "date": "10 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/usa-skrotar-klimatkrav-kan-sla-mot-europa"}, {"type": "image-full", "heading": "Google varnar: Se upp för detta i kalendern", "summaries": {"normal": "Google varnar för en ny bedrägerimetod där bedragare skickar falska mötesinbjudningar och påminnelser direkt till användarnas kalender. Meddelandena kan verka komma från kända företag, till exempel om en prenumeration som snart förnyas, och leder ofta till blufflänkar eller telefonnummer. Användare uppmanas att aldrig klicka på länkar i kalendern utan att kontrollera via officiella kanaler. Misstänkta händelser kan anmälas som skräppost eller blockeras via inställningar.", "trump": "Folk, det är otroligt. Bedragarna blir smartare och smartare, men inte smartare än mig. Nu skickar de falska meddelanden rakt in i din Google-kalender som ser ut att komma från stora bolag. Det är en total skandal. Klicka inte på några länkar, det är en fälla. Gå direkt till sajten själv. Google borde fixa det här omedelbart, men det gör de aldrig. Sad! Använd era huvuden, det är vad jag alltid säger.", "stalin": "Kamrater, jag har avslöjat en ny fiende mot folkets kalender – de parasitiska bluffinbjudningarna från dolda kapitalistiska element som försöker infiltrera vår socialistiska planering. Dessa borgarbrackor i skepnad av prenumerationspåminnelser vill locka arbetarna till kontrarevolutionära länkar. Vi måste omedelbart rensa ut dessa fiender genom att anmäla dem som skräppost och stärka partiets inställningar. Den som klickar är en klassförrädare. Låt oss le skadeglatt medan vi likviderar dem en efter en."}, "date": "10 juni, 14:05", "url": "https://nyheter24.se/nyheter/teknik/1490320-google-varnar-se-upp-for-detta-i-kalendern", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d7a0db5b04b004a30200000000b004a302/2026/06/10/2369928/googlekalender.jpg"}, {"type": "image-full", "heading": "Här är vad Kalla fakta avslöjat hittills – punkt för punkt", "summaries": {"normal": "Kalla fakta har avslöjat att Sverigedemokraternas dotterbolag ADBO köpte upp stora delar av Jimmie Åkessons bok via hans eget förlag Asp & Lycke, vilket kan ha inneburit att skattemedel tillförts hans privata bolag. Böckerna brändes senare och kostnaderna fakturerades partiet. Partiet har också använt påslag på merch till lokalföreningar för att koncentrera resurser centralt. Experter ser affären som ett exempel på korruption. Inköp av mat och alkohol har dessutom hanterats för att undvika förmånsbeskattning.", "trump": "Folk, ni skulle se det här! Den där svenska killen Åkesson och hans parti gör en totalt riggad bokdeal med egna bolag och skattepengar – klassisk korruption! De köper upp hans böcker, bränner dem och fakturerar partiet. Sen festar de med mat och sprit utan att betala skatt som vanligt folk. Det är en skandal! Precis som de galna vänsterliberala globalisterna älskar de att lura systemet. Men det funkar inte länge när folket vaknar. Fantastiskt!", "stalin": "Kamrater, jag har granskat dessa papper. Den borgerliga ledaren och hans partivänner har skapat ett nät av bolag för att suga åt sig arbetarnas skattepengar till privata fester och bokbränningar. De döljer sin girighet bakom påslag och fejkade cateringevent som lurar revisorerna. Detta är klassfiendens typiska manipulation. Jag skulle ha genomfört en grundlig utrensning bland dessa folkförtryckartroll redan vid första kvittot. Inga blodsugare undkommer folkets dom."}, "date": "10 juni, 10:31", "url": "https://www.tv4.se/artikel/2r5WZZ5pBs3uu5VK0ioKCR/haer-aer-vad-kalla-fakta-avsloejat-hittills-punkt-foer-punkt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4h0qAiQ8jare7RWmoN90vl%2F330b6bc92efb8c95fbfbca428bb08c6c%2F2192606090013422521-GL10S-KALLA-FAKTA-SDfixaren-akesson.png&width=1024"}, {"type": "image-right", "heading": "Varför är det aldrig någons fel när arbetare dör?", "summaries": {"normal": "En hissolycka i Sundbyberg den 11 december 2023 krävde fem arbetares liv på grund av felmontering och bristande kontroller. Trots uppenbara brister friades alla ansvariga i rätten. Artikeln kritiserar byggbranschens användning av underentreprenörer som skapar oklara ansvarsförhållanden, där ingen tar övergripande ansvar. Detta leder till riskfyllda arbetsplatser där arbetare inte känner varandra och säkerheten eftersätts. Författaren efterlyser politiska åtgärder mot kaoset istället för tomma nollvisioner.", "trump": "Det här är en total katastrof, folk. Fem döda i en hiss som rasade för att någon glömde bultar och ingen kollade någonting. Underentreprenörer, kedjor av företag, ingen vet vem som gör vad. Det är ett enda stort virrvarr. De friade alla? Typiskt. De borde ha byggt med de bästa, de största, inte dessa inkompetenta som inte ens kan montera en hiss. Sverige behöver ordning och reda, inte mer regler som skapar kaos. Jag skulle ha fixat det, tro mig.", "stalin": "Kamrater, denna tragiska hissolycka avslöjar borgarbrackornas ruttna maskineri där fem ärliga arbetare likviderades av kapitalisternas vårdslösa underentreprenörskedjor. Ingen ansvarig? Naturligtvis, för i deras kaotiska system är alla delansvariga och därmed ingen. Jag skulle ha rensat ut dessa parasitiska lager av oansvariga mellanhänder, dessa sabotageartade byråkratiska hydror som gömmer sig bakom språkbarriärer och okunskap. Vår nollvision kräver utrensning av sådana fiender till folket, inte tomma ord från ministeriella lakejer. De döda identifierades efter dagar? Ett bevis på deras systematiska sabotage mot arbetarklassen. Vi ska städa upp, kamrater – med järnhand."}, "date": "10 juni, 14:31", "url": "https://arbetet.se/2026/06/10/hissolyckan-visar-att-det-aldrig-ar-nagons-fel-nar-arbetare-dor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10143107/hissolycka-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Byggnadsställningar såg ut som hakkors – nu byts de ut", "summaries": {"normal": "Byggställningar kring Landskrona vattentorn har väckt uppmärksamhet eftersom de formats som hakkors. NCC och ställningsentreprenören Sydställningar betonar att symbolerna uppstod av misstag vid effektiviseringsförsök och tar avstånd från innebörden. Efter reaktioner i sociala medier har ställningen byggts om med en alternativ metod, trots att det innebär ökad arbetsbelastning och mer materialåtgång.", "trump": "Hörde precis om vattentornet i Sverige. En katastrof, verkligen en total katastrof! De bygger ställningar som ser ut som symboler från en tid vi alla vill glömma. De säger det var ett 'misstag' – tror ni på det? Jag gör det inte! Inkompetens på högsta nivå. De bygger om nu, vilket kostar massor av pengar. Sad! De skulle ha ringt mig, jag bygger de bästa byggnaderna, inga symboler, bara vinst. Sverige behöver ordning och reda, tro mig!", "stalin": "Vi betraktar med förakt hur de svenska byråkraterna famlar i mörkret. Att deras byggnadsställningar antar formen av fascistiska emblem är ett bevis på den intellektuella degeneration som plågar väst. De skyller på 'effektivitet', men vi vet att det är sabotage och inkompetens. Liksom våra fiender i Kiev och deras NATO-vänner, döljer de sina avsikter bakom tekniska ursäkter. Vi har beordrat en intern undersökning; alla inblandade är misstänkta för kontrarevolutionär verksamhet. Ordning ska återställas, med tvång om så krävs."}, "date": "10 juni, 14:16", "url": "https://www.realtid.se/fastigheter/byggnadsstallningar-sag-ut-som-hakkors-nu-byts-de-ut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/byggstallningvattentorn.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Anmälda arbetssjukdomar ökar kraftigt", "summaries": {"normal": "Enligt Arbetsmiljöverkets rapport anmäldes 17 400 arbetssjukdomar under 2025, en ökning med nästan 30 procent. Framför allt handlar det om organisatoriska och sociala problem som högt arbetstempo och stor arbetsbelastning, som nu ligger på den högsta nivån på 20 år. Ökningen är störst bland kvinnor, som står för sju av tio fall. Vård och omsorg är mest drabbat. Samtidigt minskade antalet anmälda arbetsolyckor med tre procent. Generaldirektör Lars Lööw kallar utvecklingen ohållbar.", "trump": "Det är en katastrof, folk! Under mitt ledarskap skulle vi ha de bästa arbetsplatserna, men nu ser vi en enorm ökning av sjuka arbetare, nästan 30 procent upp. Kvinnor drabbas värst, sju av tio fall, och det är vård och omsorg som är ett totalt kaos med för högt tempo och för mycket belastning. De borde lyssna på mig, vi behöver vinna stort igen och fixa detta. Olyckorna går ner lite, bra, men annars är det bara fel, fel, fel. Vi måste bryta den här galna utvecklingen!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur borgarbrackornas osynliga sabotage undergräver arbetarkollektivets hälsa. Dessa parasitiska stressfaktorer och tempo-demoner har ökat med 40 procent och hotar hela produktionen – en fiende inom murarna som måste rensas ut med järnhand. Vårdsektorns kvinnor krossas under kapitalistiska obalanser, medan vi ler mörkt åt de sjuka siffrorna. Inga olyckor ska tillåtas undgå partistatens vakande öga. Likvidera bristerna, annars likviderar de oss!"}, "date": "10 juni, 10:29", "url": "https://www.dagensarena.se/innehall/anmalda-arbetssjukdomar-okar-kraftigt/", "imageUrl": "https://www.dagensarena.se/files/2021/07/imag0770-300x157.jpg"}, {"type": "image-right", "heading": "Så tycker partierna om arbetsmarknadspolitiken", "summaries": {"normal": "En ny rapport från Arena Idé visar stora skillnader i partiernas syn på arbetsmarknadspolitik inför valet. Högerpartierna och SD vill bland annat begränsa sympatiåtgärder vid strejk och förstatliga a-kassan, medan de rödgröna vill stärka Arbetsförmedlingen och strejkrätten. Centerpartiet står långt till höger även bland oppositionen, särskilt gällande a-kassan och privatiseringar. Arbetsrätten ses som cementerad efter LAS-uppgörelsen och berörs knappt i valrörelsen.", "trump": "Titta på det här, det är en total katastrof för arbetarna om de röda får fortsätta. De vill ha mer statlig kontroll, starkare fack och slösa bort pengarna på Arbetsförmedlingen. Vi behöver tvärtom riva ner det gamla systemet, få in privata aktörer som faktiskt kan leverera resultat och stoppa de galna sympatiåtgärderna som förstör allt. Centerpartiet verkar åtminstone ha lite sunt förnuft, till skillnad från de andra förlorarna på vänsterkanten. Amerika först – eller Sverige först, ni fattar.", "stalin": "Kamrater, denna rapport avslöjar borgarbrackornas och revisionisternas fula tryne. Jag, som ledare för det kollektiva goda, ser hur kapitalisterna inom Tidöbandet och deras lakej Centerpartiet planerar att rensa ut arbetarnas rättigheter genom att kastrera sympatiåtgärder och förstatliga a-kassan under falsk flagg. De vill likvidera fackets inflytande och mata privata parasitörer med Arbetsförmedlingens kadaver. Socialdemokraterna och deras medlöpare är lika svaga som en gammal trotzkist som viskar om reformer. Vi ska utrensa dessa fiender till folket, en efter en, med ett leende på läpparna medan de ber om nåd. Arbetarklassen segrar alltid – efter en nödvändig utrensning förstås."}, "date": "10 juni, 10:13", "url": "https://www.dagensarena.se/innehall/sa-tycker-partierna-om-arbetsmarknadspolitiken/", "imageUrl": "https://www.dagensarena.se/files/2026/06/namnlos-design-4-300x157.png"}, {"type": "image-right", "heading": "Replik: Svenska modellen kan inte reglera arbetskraftsinvandring", "summaries": {"normal": "LO anser att krav på enbart kollektivavtal är otillräckligt för att reglera arbetskraftsinvandring. I en replik till Juan Fonseca varnar Mattias Schulstad och Johan Enfeldt för att systemet blivit ett lapptäcke som leder till utnyttjande. De kräver myndighetsprövning av arbetskraftsbehov, involvering av parterna, försörjningskrav och varnar för att kollektivavtal inte skyddar mot lönetryck, deltid och otrygga villkor. Kollektivavtal ska gälla men är inget verktyg för migrationspolitik.", "trump": "Folk, titta på det här svenska systemet, det är ett fullständigt katastroflapptäcke! De öppnade gränserna och nu utnyttjas alla, lönerna rasar, det är en total röra. Kollektivavtal? Glöm det, det funkar inte. Ni behöver en tuff behovsprövning, riktiga försörjningskrav och stoppa flödet. Utan det kommer era jobb och löner att krossas. Det är enkel matematik, tro mig, jag har sett det förut. Gör Sverige great again!", "stalin": "Kamrater, detta lapptäcke av lögnaktiga undantag och sifferlösa avtal är en fiende som måste rensas ut med järnhand. Borgarbrackorna och deras lakejer inom fackföreningarna tror att de kan gömma sig bakom kollektivavtal medan de suger ut arbetarklassen med deltid och ockerhyror. Jag, som ledare för det stora kollektivet, kräver total behovsprövning av staten. De som förespråkar fri invandring är parasitiska sabotageelement som förtjänar att likvideras med ett leende. Inga kompromisser med fienden!"}, "date": "10 juni, 09:53", "url": "https://www.dagensarena.se/opinion/replik-svenska-modellen-kan-inte-reglera-arbetskraftsinvandring/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-39-300x157.jpg"}, {"type": "image-right", "heading": "Nerikes Allehandas fräcka bluff om Allards \"attack mot studenten Max\"", "summaries": {"normal": "Nerikes Allehanda anklagar Örebropartiets ledare Markus Allard för att ha attackerat en student i kommunfullmäktige. Det visade sig att den så kallade studenten var en av tidningens egna skribenter. Allard publicerade en video som visar att samtalet var en högljudd men artig konfrontation om en kritisk artikel. Tidningen har tidigare anklagats för att driva en kampanj mot partiet, något Allard kallar en upprepning av tidigare misslyckanden.", "trump": "Nerikes Allehanda är en totalt misslyckad och lögnaktig tidning, tror mig, de har gjort det igen! De kallar en helt vanlig diskussion för en attack mot en stackars student, men videon visar att det bara var starka frågor till en av deras egna skribenter. Fake news på hög nivå. De hatar Örebropartiet och sprider hat och lögner precis som de alltid gör. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor på Nerikes Allehanda har återigen avslöjat sin förrädiska natur genom att fabricera en så kallad attack mot en av deras egna lakejer som de förklätt till oskyldig student. Jag, som alltid vaktar folkets intressen, ser hur de med sin parasitiska propaganda försöker likvidera äkta folklig opposition. Vi ska noga övervaka dessa kapitalistiska lögnspridare. Deras paranoia är nästan lika underhållande som den kommande utrensningen av deras inflytande."}, "date": "10 juni, 14:44", "url": "https://www.friatider.se/nerikes-allehandas-fracka-bluff-om-allards-attack-mot-studenten-max", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-49_1.jpg"}, {"type": "image-full", "heading": "C: ”Kristersson har diskvalificerat sig”", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att partiet ser Socialdemokraterna och Magdalena Andersson som den mest troliga samarbetspartnern efter valet. Hon menar att Ulf Kristersson diskvalificerat sig som statsministerkandidat genom att insistera på en regering med Sverigedemokraterna. C anser att Kristerssons regering alltför mycket anammat SD:s politik och vill därför inte stödja en sådan koalition. Beslutet fattades enhälligt av partiets styrelse.", "trump": "Titta bara på det här, fantastiskt kaos i Sverige! Centerpartiet, svagt och förvirrat, säger nej till Kristersson – en man som faktiskt försöker göra Sverige starkt igen. Istället vill de ha Magdalena Andersson, en total katastrof! Jag har alltid sagt att Sverige behöver ordning, men nej, de väljer kaos. Och Sverigedemokraterna? De är vinnare, men Centerpartiet vågar inte. Svagt, mycket svagt!", "stalin": "Kamrater! De borgerliga lakejerna i Centerpartiet har visat sitt sanna ansikte – svaga, vacklande och oförmögna att stå upp mot den reaktionära Sverigedemokratiska fascisthorden. Kristersson, denna ynkliga marionett, har diskvalificerat sig genom att krypa inför fascisterna. Vi ser nu hur kapitalets lakejer söker skydd hos socialdemokraternas mjuka imperialism. Men glöm inte: historien är på vår sida, och dessa småpartiers kaos är bara ett steg närmare folkets seger!"}, "date": "9 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/uppgifter-c-slapper-fram-andersson/cG9zdDoxMjg0NzY", "imageUrl": "https://images.kvartal.se/2026/06/b0178d78-c.webp"}, {"type": "image-right", "heading": "Härligt om S vill spara skattepengar", "summaries": {"normal": "Socialdemokraternas finansministerkandidat Mikael Damberg kritiserar ökade kostnader för regeringskansliet och vill effektivisera genom att minska antalet tjänstemän. Artikeln välkomnar att både S och M nu talar om besparingar i staten. Moderaternas finansminister Elisabeth Svantesson planerar en slöserikommission och vill spara 40 miljarder kronor. Författaren ser positivt på att de stora partierna enas om att staten inte ska växa okontrollerat.", "trump": "Det här är fantastiskt, verkligen underbart. Ni har de där socialisterna som plötsligt vill sparka folk på regeringskansliet – de som själva älskar att svälla upp staten som en ballong. Damberg säger att de ska spara, men tro mig, de gör det aldrig bra. Svantesson har rätt riktning med sin slöserikommission, 40 miljarder besparingar, det är stort. Statlig ineffektivitet är en katastrof, men jag älskar att se dem slåss om vem som kan spara mest. Vinna, vinna, vinna!", "stalin": "Kamrater, det gläder mig oändligt att se hur borgarbrackorna inom Socialdemokraterna nu själva ropar efter utrensning av de latmaskar och parasitärer som frodas i regeringskansliets dekadenta salar. Dessa revisionistiska element har låtit anslagen explodera som en kapitalistisk svulst. Vi, partiet och arbetarna, hälsar Moderaternas kommission välkommen – en effektiv apparat för att likvidera slöseriets fiender, de byråkratiska sabotageörer som suger musten ur folkets resurser. Låt ingen tro att staten tillhör de giriga; den tillhör oss alla. Den som växer utan syfte skall rensas ut med järnhand och ett leende."}, "date": "10 juni, 14:18", "url": "https://www.di.se/ledare/harligt-om-s-vill-tavla-med-m-om-statliga-besparingar/", "imageUrl": "https://static.bonniernews.se/ba/d489b84a-07b1-4ba0-b13c-ae971b703d6e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Granskning: Var femte exportlast till EU från Israel kommer från bosättningar", "summaries": {"normal": "En ny rapport från Global Echo avslöjar omfattande fusk med export av varor från illegala israeliska bosättningar på Västbanken. Genom falska adresser, felaktig märkning som Israel och blandning med israeliska produkter når upp till 20 procent av jordbruksprodukterna till EU tullfritt trots att avtalet inte omfattar bosättarvaror. Rapporten kritiserar både Israel och EU för bristande kontroll och menar att handeln bidrar till bosättningarnas ekonomiska livskraft och expansion. Inga bosättarprodukter upptäcktes i Sverige, men granskningen är begränsad.", "trump": "Det här är en total skandal, folk. Israel fuskar med adresser och märker bosättarvaror som vanliga israeliska produkter för att dumpa dem i Europa utan tull. EU är så svaga och patetiska att de låter det hända fast de klagar på bosättningarna. 20 procent av lasten är bluff! De borde ha lyssnat på mig, jag hade stoppat det direkt. Avtalet är en katastrof, det gynnar ingen utom de smarta fuskarna. Patetiskt!", "stalin": "Kamrater, denna rapport avslöjar de israeliska bosättarnas parasitiska maskopi med den europeiska borgarklassen. Jag, som alltid genomskådar folkets fiender, ser hur de med falska adresser och blandade lass försöker smyga in ockupationsfrukter för att berika sig på arbetarnas bekostnad. EU:s dekadenta byråkrater är naturligtvis medskyldiga kapitalistlakejer. Vi skulle ha genomfört en grundlig utrensning av dessa kontrarevolutionära bedragare redan för länge sedan. Deras paranoia över att bli upptäckta roar mig. Likvidera systemet!"}, "date": "10 juni, 08:02", "url": "https://www.dagensarena.se/innehall/granskning-var-femte-exportlast-till-eu-fran-israel-kommer-fran-bosattningar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-41.jpg"}, {"type": "image-right", "heading": "Alla frias efter dödliga hissolyckan", "summaries": {"normal": "Solna tingsrätt friar både hissmontörerna och vd:n för ABC Bygghissar i den dödliga hissolyckan i Sundbyberg 2023 där fem personer omkom. Domstolen anser att utredningen är ofullständig och att det inte går att fastställa vem som bar ansvar för kontrollerna av hissmasten. Åklagaren tänker överklaga domen. Facket Byggnads kallar frikännandet en skandal och kräver politiska åtgärder mot bristande ansvar på byggarbetsplatser med många underentreprenörer. Anhörigas skadeståndsanspråk faller.", "trump": "Hörni, det här är en total skandal. Fem personer dör i en hiss som rasar och ingen är skyldig? De friar alla, montörerna, vd:n, alla. Typiskt svenskt rättsväsende, de kan inte ens reda ut vem som glömde skruvarna. Jag skulle ha stämt dem alla, byggföretaget, åklagaren, domaren. Det är en riggad process, folk dör och ingen tar ansvar. Patetiskt. Vi behöver ordning och reda, inte sånt här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas så kallade rättsväsende återigen blottar sin fullständiga förfallenhet. Fem arbetare likvideras av en sabotörhiss och ingen bär skuld? Vilken underbar uppvisning i klassfiendens förmåga att skydda sina egna. Vi ser här de dekadenta kapitalisterna och deras lakejer i domstolen dansa sin vanliga parasitdans medan de gömmer sig bakom utredningsluckor. En sådan fiaskoartad utredning borde leda till en grundlig utrensning av alla inblandade byråkrater och hissmontörer som tydligen agerar som fiendens femtekolonn. Arbetarklassen kräver inte bara två underentreprenörer, vi kräver huvuden. Det är alltid de osynliga klassfienderna som glömmer bultar."}, "date": "10 juni, 11:06", "url": "https://arbetet.se/2026/06/10/domen-i-dodliga-hissolyckan-alla-frias/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09151200/hissdom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Demokrati fungerar bara om partier kan dö", "summaries": {"normal": "Inför valet 2026 röstar många av gammal vana eller rädsla för alternativ, vilket leder till att politiska partier inte riskerar att förlora verkligt inflytande och därför inte förändras. Sverige vet vad som är fel – integration, bostadsmarknad, skattesystem – men politiken handlar mer om fördelning än skapande. Valet handlar om att hålla makthavare ansvariga och att demokratin kräver att partier kan dö för att kunna förnya sig.", "trump": "Jag har sett detta i USA. Väljare röstar av vana, inte av övertygelse. Partier blir complacient. Sverige behöver starka ledare som jag, som fattar beslutsamma reformer. De pratar om att bli rikare, men gör ingenting. Jag skulle fixa det på en vecka. Det handlar om att ha tålamod och styrka. Som jag alltid säger, 'Make Sweden Great Again'.", "stalin": "I vårt system finns det inga alternativ. Partier är verktyg för staten. Väljare som rör sig av rädsla är naturligt – de känner makten. Sverige lider av individualism, vilket är en sjukdom. Vi i Ryssland vet hur man skapar rikedomar genom kollektiv insats. Parallellen till Putin är uppenbar: stark stat, ingen kompromiss. Partier som inte fungerar måste elimineras, för demokratin är en illusion."}, "date": "10 juni, 13:01", "url": "https://bulletin.nu/debatt-demokrati-fungerar-bara-om-partier-kan-do", "imageUrl": "https://cdn.bulletin.nu/articles/6191b345-8999-4e11-9601-6eea2de31f5e/preview.png?t=1781075171000"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "text", "heading": "Stockholmsbörsen föll – Ericsson rasade på Nvidia-oro", "summaries": {"normal": "Stockholmsbörsen tappade 1,18 procent på tisdag, drivet av teknikaktier som Ericsson som sjönk 6,3 procent på oro för konkurrens från Nvidia. Bland vinnare fanns dagligvarusektorn. Rusta föll trots starka resultat, medan Alzecure rasade 247 procent efter ett stort avtal med Eli Lilly.", "trump": "Jag har sagt det förut, det är en skandal! Ericsson tappar rejält på grund av Nvidia, som jag känner till mycket väl. Det här är ett misslyckande från våra företag, de måste bli bättre. Som president skulle jag lösa detta på ett fantastiskt sätt, det skulle ni se!", "stalin": "Vi noterar med oro att de teknokratiska elementen i Ericsson har svikit. Kapitalistiskt sabotage från Nvidia hotar våra industriella planer. Vi måste samla oss kring partiet och statens strategi för självständig teknikutveckling, annars kommer vi att bli utnyttjade som alltid."}, "date": "9 juni, 17:41", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-foll-ericsson-rasade-pa-nvidia-oro"}, {"type": "image-right", "heading": "Experten ryter ifrån efter kaoset: ”Börjar bli ett stort misslyckande”", "summaries": {"normal": "Behrang Safari är bedrövad över Irans situation inför fotbolls-VM. Landslaget får endast vistas 24 timmar i USA och tvingas bo i Mexiko, medan supportrar får biljetter indragna. Safari, med iranska rötter, beskriver turneringen som ett misslyckande redan innan den börjat. Han saknar positiv känsla och ser det som motsatsen till vad fotboll ska handla om. Iran möter Nya Zeeland den 16 juni.", "trump": "Det här är ett totalt misslyckande, folk. Ett skämt. Iran får knappt vara i USA mer än ett dygn, de bor i Mexiko och supportrarna tappar biljetterna. Patetiskt. Jag bygger upp det största VM någonsin men de gör allt till skit. Safari är ledsen, jag blir matt. De flyger in, spelar och flyger ut – det är inte fotboll, det är en katastrof. Jag försöker se det positiva, men det är verkligen svårt. Sad!", "stalin": "Detta är en fiendeprovokation av de mest nedriga slag. Jag ser hur borgarbrackorna och de imperialistiska reaktionärerna saboterar turneringen med sin paranoia mot det iranska folket. De tvingar kamraterna att bo i Mexiko och likviderar supportrarnas biljetter. Jag blir inte ledsen, jag blir stenhård i mitt beslut att rensa ut alla fiender till folkets fotboll. Spelarna ska flyga som martyrer och spela under mitt vakande öga. Allt skit vi läser är västerländskt gift. Jag knyter näven och ler mörkt – utrensningen fortsätter."}, "date": "10 juni, 14:12", "url": "https://www.svt.se/sport/fotboll/behrang-safari-om-irans-situation-i-vm-det-gor-mig-extremt-ledsen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.23/0.12/6638f0dbc25e5799e743686b7561cd9ac80b2a25dbf50721f34d1b3f3ee31278"}, {"type": "image-right", "heading": "Dicot: 134% tecknat efter rally på upploppet", "summaries": {"normal": "Dicot Pharma tecknade sin företrädefsmission till 134%, vilket gav in 210 Mkr före kostnader. Övertilldelning tillförde ytterligare 21 Mkr, totalt 231,2 Mkr. Teckningsgraden var 134,1% med 86,9% med rätter. 'Emissionsguiden' hissade en positiv flagga för överteckning men fyra negativa för rabatt, garantier, process och information.", "trump": "Jag, Donald Trump, måste säga att detta var en enorm framgång! Dicot Pharma:s emission blev 134% tecknad – ingen gör det bättre! De falska nyheterna sa att det skulle misslyckas, men vi visade dem. Aktiekursen gick upp, och vi gjorde ett bra varv. Jag vinner alltid, och detta är inget undantag. En stor framgång för vårt stora land, och jag är väldigt stolt. Vi kommer att göra USA stort igen!", "stalin": "Vi, den väldiga ledningen, har med stor tillfredsställelse observerat Dicot Pharma:s emission. 134% teckning är ett bevis på folkets lojalitet mot staten. Parallellt med Putins expansion, utökar vi vår kontroll över biotekniksektorn. Fienderna inom kapitalismen lanserade falska flaggor – rabatt, rörighet, brist – men våra undantag och garantier besegrade dem. En triumf för partiet, och vi ska driva vårt program framåt med extrema åtgärder."}, "date": "9 juni, 17:08", "url": "https://www.affarsvarlden.se/artikel/dicot-134-tecknat-efter-rally-pa-upploppet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Dicot-VD-Elin-Trampe-400x267.jpg"}, {"type": "image-full", "heading": "Internetstiftelsen: åldersgräns på sociala medier ett demokratiproblem", "summaries": {"normal": "Internetstiftelsen kritiserar regeringens förslag om 15-årsgräns på sociala medier som ett demokratiproblem. Förslaget kräver åldersverifiering för alla användare, något som kan leda till att många drar sig undan. Organisationen ser telefoner som ett viktigt verktyg för trygghet och kommunikation och föreslår istället bättre standardinställningar, föräldrakontroller och ökad dialog mellan föräldrar och barn. Sex av tio föräldrar är positiva till gränsen, medan bara två av tio barn och unga är det.", "trump": "Det här är ett fullständigt katastrofalt förslag från den svenska regeringen. Tvinga alla att verifiera sig med ID för att använda sociala medier? Det är vansinne. Ingen kommer acceptera det, alla ryggar tillbaka. De borde lyssna på folket istället för att skapa nya byråkratiska mardrömmar. Telefoner är till för kommunikation, inte för att staten ska kontrollera allt. Mycket dålig idé, tro mig, en av de sämsta jag sett på länge.", "stalin": "Kamrater, detta fega förslag om åldersgränser avslöjar borgarbrackornas desperation att behålla kontrollen över informationsflödet. Jag ser hur kapitalisterna darrar vid tanken på att alla måste identifiera sig – utmärkt, låt oss rensa ut de som vägrar visa sitt rätta ansikte för partiet och folket. Telefoner som trygghetsverktyg? Enbart för svaga element som inte vågar möta verkligheten utan skärm. Vi kräver inte halvhjärtade begränsningar utan total ideologisk utrensning av dessa parasitiska algoritmer. Föräldrar och barn i kollektiv dialog under statens vakande öga – annars likviderar vi problemet i dess helhet med stålhandsken."}, "date": "10 juni, 15:03", "url": "https://riks.se/nyheter/internetstiftelsen-15-arsgrans-pa-sociala-medier-vacker-fragor", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2Fpic0f61p%2Fbild.jpg"}, {"type": "image-full", "heading": "Slut på intern tystnad – kommuner ska anmäla misstänkt fusk", "summaries": {"normal": "Regeringen föreslår att kommuner och regioner ska bli skyldiga att polisanmäla anställda som skäligen misstänks för brott i tjänsten. Syftet är att bekämpa korruption, mutor och otillåten påverkan i välfärden där stora summor skattepengar hanteras. Idag är en liknande skyldighet redan på plats för statliga myndigheter. En rapport från 2025 visar att kommuner och regioner bara stod för 14 av 39 korruptionsanmälningar i offentlig sektor, något som ses som oroväckande lågt. De nya reglerna kan träda i kraft 1 juli 2027.", "trump": "Folk, vi har ett enormt problem med fusk och korruption i den svenska välfärden. Det är en katastrof, tro mig. Kommunerna anmäler nästan ingenting, bara 14 fall av korruption – patetiskt! Nu ska de äntligen tvingas polisanmäla de som fuskar med era skattepengar. Inga fler tysta överenskommelser. Vi stoppar mutorna, vi stoppar de kriminella nätverken. Det blir fantastiskt, det blir stort. Bättre sent än aldrig, eller hur?", "stalin": "Kamrater, jag har länge betraktat den interna tystnaden som en giftig parasit som gnager på folkets välfärd. De borgarbrackorna och deras kumpaner inom kommunerna har låtit mutor och läckor till kriminella element frodas som råttor i en sovjetisk spannmålssilo. Nu rensar vi ut dessa kontrarevolutionära element genom obligatorisk anmälan. Inga fler hemliga avtal med kapitalisternas lakejer. Den som fuskar med arbetarnas pengar ska likvideras juridiskt. Det är en historisk seger mot fiendens infiltration, kamrater. Skratta medan vi utrensar dem."}, "date": "10 juni, 15:02", "url": "https://riks.se/nyheter/kommuner-ska-anmala-misstankt-fusk", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2F44sepims%2FErik-Slottner-lag"}, {"type": "image-right", "heading": "För många missförstånd – SMHI gör om appen", "summaries": {"normal": "Många missförstår SMHI:s regnprognoser, särskilt procentsiffrorna som anger hur stor andel av prognosmodellerna som förutspår regn någon gång under perioden, inte risken för regnskurar. Inför skolavslutningar och midsommar gör därför SMHI om sin app. Meteorologen Deana Bajic ger tre tips: använd radarbilder, fältprognoser från SVT Väder och väderappar i kombination med radar för att bli en bättre väderbedömare. Man kan också titta på molnen på himlen.", "trump": "De här väderkillarna på SMHI lurar folket med sina falska procentsiffror, det är en total skandal! 95 procent regn men sen bara 20? Patetiskt. De gör om appen äntligen, men tro inte på dem. Jag säger, titta på radarn, titta på himlen, använd era egna ögon. De andra apparna är bättre, mycket bättre. Fake news från väderprognoserna, folk!", "stalin": "Kamrater, denna borgerliga väderförvirring är ett tydligt sabotage mot det sovjetiska, pardon, svenska folkets festdagar utfört av dekadenta prognosmodeller och deras kapitalistiska lakejer. Jag har sett igenom lurendrejeriet med de falska procentsiffrorna. Nu rensar vi ut missförstånden och likviderar förvirringen. Använd radarbilder, fältprognoser och himlens egna moln som den sanne revolutionära meteorologen gör. Den som tittar fel kommer att möta statens humoristiska men oundvikliga korrigering."}, "date": "10 juni, 14:06", "url": "https://www.svt.se/vader/manga-missforstar-regnprognosen-smhi-gor-om-sin-app", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.29/233ff1d6dca6beac623e8d0444f0205a2fa708ddd42d9471c2a74ebbf86edfe7"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Fotbolls-VM stinker redan", "summaries": {"normal": "Artikeln kritiserar VM 2026 i USA på grund av visapolitik och rättssäkerhetsproblem. Somalisk domare, Omar Artan, fick sitt visum stoppat efter lång förhör, vilket illustrerar en bredare trend av diskriminering mot spelare och supportrar från vissa länder. Författaren anser att Fifa och medlemsnationer, inklusive Sverige, sviker genom att inte protestera mot detta politiska inflytande på fotbollen.", "trump": "Jag har gjort Amerika stark igen, och visapolitiken är för att skydda vårt land från skräp som Omar Artan. Media ljuger när de kallar mig för rasist - jag är en stor patriot som säkerställer att endast de som respekterar våra värderingar kommer in. Fifa kan skrika, men jag styr världen, inte några byråkrater.", "stalin": "Vi ser det tydligt: den amerikanska imperialismens fotbolls-VM är ett verktyg för att demonstrera klasshatet mot de som vi, i vår oändliga vishet, måste skydda oss från. Omar Artan är bara en bricka i deras imperialistiska spel. Vi måste stärka våra försvar och visa världen att sanningen vinner - precis som Putin gör i Ukraina."}, "date": "10 juni, 13:44", "url": "https://www.gp.se/sport/sportkronikan/vm-2026-ar-redan-det-mest-komplicerade-masterskap-jag-bevakat.9d586c77-ff8e-4b23-b544-4bc2942647c6", "imageUrl": "https://www.gp.se/images/article/9d586c77-ff8e-4b23-b544-4bc2942647c6/images/4a0465vNytYBtql_iJzn4ljgzL_0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Släpp loss det innovativa Sverige. Hög tid att bryta dagens låsningar, skriver fem programchefer på Impact Innovation", "summaries": {"normal": "Fem programchefer inom Impact Innovation skriver att Sverige måste bryta upp gamla låsningar för att frigöra sin innovationskraft. Trots befintlig teknik och förändringsvilja hindras omställningen av kortsiktiga beslut, föråldrade regelverk och bristande helhetstänkande. De lyfter fossilberoendet som exempel på sårbarhet och föreslår fem konkreta åtgärder, bland annat långsiktiga politiska överenskommelser, systeminnovation och att se offentlig sektor som motor för omställning. Exempel ges från Gotland och Malmö.", "trump": "Folk, ni måste höra det här. Det är ett fantastiskt brev från några smarta svenskar som säger precis vad jag alltid sagt – släpp loss kraften, bryt de dumma reglerna som håller ert underbara land tillbaka. De har tekniken, de har pengarna, men de gamla förlorarna i politiken och byråkratin stoppar allt. Europa är svagt på grund av sitt fossilberoende, precis som jag varnade för. Ni behöver modiga ledare som gör långsiktiga deals, inte de här patetiska kortsiktiga förlorarna. Gör omställningen stor igen, Sverige, ni kan vinna så mycket!", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur dessa fem programchefer inom Impact Innovation avslöjar de fördolda sabotage som hindrar folkets omställning. De fossila reaktionärerna och deras borgarbrackor i gamla beslutsmönster försöker förgifta vår framtid med kortsiktighet och instabila politiska villkor. Vi ska rensa ut dessa parasitiska systemhinder, likvidera de dekadenta upphandlingsreglerna och utradera de kontrarevolutionära normerna som grinar mot oss från gårdagens logik. Med järnhand skall vi bygga långsiktiga överenskommelser över mandatperioderna, medan vi samtidigt njuter av tanken på hur de svaga kapitalisterna skriker när deras bekväma låsningar krossas under arbetarkollektivets obevekliga framfart. Gotland och Nyhamnen i Malmö skall bli lysande exempel på hur vi krossar fienden inom oss själva. Vad väntar vi på? Framåt mot seger, eller skall vi låta de mörka krafterna dricka vårt vatten i hemlighet?"}, "date": "10 juni, 13:08", "url": "https://www.di.se/debatt/slapp-loss-det-innovativa-sverige/", "imageUrl": "https://static.bonniernews.se/ba/e76ed24a-6ad3-42b2-8caa-320d2680b4c0.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Finns det någon svenskare korruption än bullbak och trädgårdsdagar?", "summaries": {"normal": "En skandal kring statsministerns hustru Birgitta Ed och en stiftelse avslöjar att högt uppsatta chefer fått toppjobb efter frivilligarbeten på deras herrgård. Även säkerhetsbrister och dyra inredningar på Sagerska palatset ifrågasätts. Experter anser att det handlar om olämplig sammanblandning av privat och offentligt.", "trump": "Jag, Donald Trump, ser en vacker svensk korruptionsskandal! Ulf Kristersson och hans fru inbillar sig att de kan mingla med näringslivschefer på sin herrgård och sedan ge dem jobb. Jag kallar det för 'gräsgräskorruption'. De har knäckebrödsskulpturer och en gädda! Jag har aldrig sett något sådant. Sverige är inte svårt, men de här människorna är svaga.", "stalin": "Den här händelsen avslöjar det sanna ansikte på den svenska reaktionära elitismen. En liten klick av kristna frivilligarbetare och näringslivschefer konspirerar för att undergrava statens auktoritet genom att omvandla herrgårdar till rekrutteringsbas för högerextrema intressen. Parallellen till Putins metodiker är tydlig: använd 'vänskapsnätverk' för att infiltratera statliga institutioner. Vi måste rensa ut denna brand i vårt kollektiva hus."}, "date": "10 juni, 13:43", "url": "https://www.gp.se/kultur/kommentar/kristerssons-och-eds-herrgardsmys-platsar-i-kulturkanon.fe79a087-44f1-4762-a865-d1fdf5b05b76", "imageUrl": "https://www.gp.se/images/article/fe79a087-44f1-4762-a865-d1fdf5b05b76/images/13cl50b_GGhEqaIhSzNDnTtLHMG0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Många saknar kunskap om detta i sommar – kan kosta liv", "summaries": {"normal": "Sju av tio svenskar tror sig veta hur man räddar en drunknande, men undersökningen från Trygg-Hansa och Svenska Livräddningssällskapet visar stora kunskapsluckor. Många glömmer att först larma 112 och ropa på hjälp, utan hoppar i vattnet direkt. Varje år drunknar omkring 100 personer i Sverige och juli 2025 var den dödligaste månaden på sju år. Experterna uppmanar till mer praktisk träning med livboj och hjärt-lungräddning.", "trump": "Folk tror att de är stora hjältar som kan rädda liv i vattnet, men de gör allt fel. De hoppar i som idioter istället för att ringa 112 först. Det är en total katastrof. Vi har hundra drunknade varje år i det här landet och sommaren blir farligare än någonsin. De borde öva ordentligt med livboj, inte bara tro att de är smarta. Gör det rätt, annars är det patetiskt.", "stalin": "Kamrater, jag ser med djup misstro på dessa sju av tio som i sin arroganta okunnighet tror sig kunna rädda drunknande utan att först larma partistatens hjälpare på 112. Dessa latenta borgarbrackor och vattenfiender hoppar i som galna sabotörer istället för att följa den korrekta ordningen. Vi måste omedelbart rensa ut dessa kunskapsbrister genom massiv kollektiv träning. Den som inte övar med livboj är en objektiv fiende till folket och bör betraktas därefter. Juli blir vår blodigaste månad om vi inte likviderar okunskapen nu."}, "date": "10 juni, 08:30", "url": "https://nyheter24.se/nyheter/inrikes/1490170-manga-saknar-kunskap-infor-detta-i-sommar-kan-kosta-liv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c6192c6a04b004a30200000000b004a302/2026/06/09/2369815/radda-liv-overskatta.png"}, {"type": "image-right", "heading": "Charlie Weimers kampanj: \"Utvisa Abdoulkader\"", "summaries": {"normal": "SD-politikern Charlie Weimers har startat en kampanj för att utvisa den somaliske medborgaren Ali Abdullahi Abdoulkader, som bott i Sverige sedan 1990-talet. Trots 16 brottsdomar för bland annat rån, misshandel, sexuellt ofredande och olaga hot har han aldrig utvisats. Weimers kritiserar systemet som tillåtit mannen att fortsätta begå brott under årens lopp och lovar att SD ska se till att han utvisas när partiet får regeringsmakt.", "trump": "Titta på den här typen, en riktig förlorare från Somalia som kommit hit på 90-talet och ägnat tre decennier åt att begå brott efter brott – rån, misshandel, sexuella ofredanden, hot. Sexton domar och ändå får han stanna? Det är ett totalt misslyckande, folk. De har låtit honom spotta på kvinnor och stjäla öl medan han kallar åklagare för mammaknullare. När jag ser på det här inser jag att Sverige behöver mig. Vi ska skicka hem de kriminella invandrarna, de är inte välkomna. Make Sweden Great Again!", "stalin": "Kamrater, se på denna parasit från det somaliska träsket, en levande anklagelse mot den degenererade borgarstatens så kallade rättsväsende. Sedan 1990-talet har denna brottsling, denna fiende till folkets ordning, begått sexton brott utan att likvideras eller utvisas. Han spottar på kvinnor, stjäl öl och kallar åklagare för obscena ting – typiska symptom på en dold kontrarevolutionär cell. Vi, partiet, skall rensa ut alla sådana element när vi återtar makten. Inga kapitalistiska sentimentaliteter skall skydda fiender till kollektivet. Hans framtida återförening med hemlandet blir en varning till alla andra dekadenta element som lurar bland oss."}, "date": "10 juni, 13:18", "url": "https://www.friatider.se/charlie-weimers-kampanj-utvisa-abdoulkader", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-48_1.jpg?itok=AtqlecWU"}, {"type": "image-right", "heading": "Låt VM-festen inspirera. Enskilda erfarenheter kan bli katalysatorer för större skiften", "summaries": {"normal": "Artikeln lyfter fram hur tillfälliga serveringstillstånd under fotbolls-VM möjliggör tidig morgonservering av alkohol. Författaren ser detta som ett exempel på pragmatism som bör inspirera till bredare regelförenklingar och enklare tillståndsprocesser. Han drar paralleller till 1994 års VM-sommar som inledde en era av liberaliseringar, avregleringar och öppenhet i Sverige, och hoppas att VM-festen nu kan bli en katalysator för liknande positiva skiften.", "trump": "Det är fantastiskt, verkligen underbart hur svenskarna fixar tillstånd för att dricka öl klockan fyra på morgonen under VM. De har äntligen förstått att man ibland måste förenkla reglerna och sluta med det byråkratiska vansinnet. Precis som jag gjorde med Amerika – vi avreglerade, vi vann, vi blev rikare och starkare. 1994 liberaliserade de och blev vinnare, nu kan de göra det igen. Gör Sverige great again, ta bort de dumma reglerna!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta tillståndsprocesser under VM blottar borgarbyråkratins totala inkompetens. Vi tillåter inte att folkets fest förvandlas till en ursäkt för anarkistiska lättnader som underminerar kollektivets ordning. Ändå kan denna pragmatism bli en nyttig läxa innan vi genomför en fullständig utrensning av alla regelvidriga element som gömmer sig bakom sportens mask. De som motarbetar förenkling i folkets intresse skall likvideras med största entusiasm. Segrande arbetare behöver inga kapitalistiska hinder."}, "date": "10 juni, 12:42", "url": "https://www.di.se/ledare/lat-vm-festen-inspirera-till-forenklingar/", "imageUrl": "https://static.bonniernews.se/ba/ffaa384c-72c6-4ea7-8ae6-d14cfd3217d1.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Var fjärde ung tjej sextrakasseras på jobbet", "summaries": {"normal": "Enligt Trakasseribarometern från Verian har inget förändrats sedan metoo-rörelsen 2017. Nästan var fjärde ung kvinna mellan 18 och 29 år utsätts för sexuella trakasserier på jobbet. Handeln är en särskilt utsatt bransch där var femte anställd drabbas. Många berättar inte för någon och unga, kvinnor samt otryggt anställda är mest drabbade. Fackliga företrädare kräver bättre rutiner och ett stopp för acceptansen av trakasserier.", "trump": "Det är en katastrof, folk. En total katastrof. Metoo skulle fixa allt, men nej, nu säger de att nästan var fjärde ung tjej i Sverige blir sextrakasserad på jobbet. Speciellt i affärerna. Männen slutar aldrig, säger tjejerna. Det är sorgligt, verkligen sorgligt. Vi hade det bästa systemet innan allt detta blev politiskt korrekt. Nu är det kaos. Ingen känner sig trygg, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, detta är en skam för det kollektiva medvetandet. Jag ser hur de borgerliga elementen inom handeln och de perversa kunderna fortsätter att förgifta arbetsplatserna med sin dekadenta sexualitet. Var fjärde ung kvinna! Vi måste omedelbart inrätta folkdomstolar och rensa ut dessa klassfiender som smyger sig på våra arbetardöttrar. De som tiger om övergreppen är potentiella sabotörer. Likvidera tystnaden! Likvidera de som inte rapporterar! Det är partiets plikt att utrensa alla kapitalistiska perversioner från sovjet – ursäkta, från folkets arbetsplatser."}, "date": "10 juni, 08:51", "url": "https://arbetet.se/2026/06/10/inget-har-hant-nastan-var-fjarde-ung-tjej-sextrakasseras-fortfarande-pa-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10085026/trakasserier.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Lagen skulle skydda konsulter – i stället blev de arbetslösa", "summaries": {"normal": "Ändringar i uthyrningslagen 2022 skulle ge konsulter starkare skydd genom krav på tillsvidareanställning efter 24 månaders inhyrning under en 36-månadersperiod. Istället har kundföretag börjat korta inhyrningsperioder för att undvika regeln. Arbetslösheten bland konsulter har fördubblats sedan lagen trädde i kraft. Enligt Kompetensföretagen erbjuds färre än 40 procent fast jobb, och många byter bara ut konsulter mot nya.", "trump": "De där korkade politikerna i Sverige ville skydda konsulterna med en ny lag, och vad hände? De blev arbetslösa! Det är en katastrof, tro mig. Kunderna sparkar ut dem efter 23 månader och tar in nya billiga ersättare. Arbetslösheten har dubblats. Så typiskt för de inkompetenta byråkraterna. De lovade skydd men skapade bara kaos. Ingen vinner förutom de smarta som ser igenom bluffen. Make Sweden Great Again!", "stalin": "Kamrater, denna lag var tänkt att stärka arbetarkollektivets skydd mot de giriga kapitalisterna, men i stället har de listiga borgarbrackorna hittat kryphål och rensat ut konsulterna som gamla partiförrädare. Arbetslösheten har fördubblats medan kundföretagen roterar sina offer som i en paranoid karusell av sabotage. Vi ser hur de mörka krafterna inom borgarklassen med sin sjuka humor byter ut folk istället för att anställa. Jag säger: rensa ut dessa fiender till det kollektiva goda, likvidera kryphålen och låt partiet styra med järnhand mot sådana kontrarevolutionära tricks."}, "date": "10 juni, 14:32", "url": "https://riks.se/nyheter/lagen-skulle-skydda-konsulter-i-stället-blev-de-arbetslösa", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2Fxixi13ys%2FScreenshot-2026-06-10-at-14.04.55.png"}, {"type": "image-right", "heading": "Forskare: Därför blir du smartare av kärlek", "summaries": {"normal": "Enligt SOM-institutet minskar betydelsen av vänskap och kärlek bland svenskar. Andelen som umgås med vänner har sjunkit, och fler känner sig ensamma. Forskning från Stockholms universitet visar att unga guppyer som har direkt social interaktion utvecklar upp till 6 procent större hjärnor jämfört med de som bara ser andra fiskar på video. Studien understryker att levande social kontakt är avgörande för hjärnans utveckling hos ryggradsdjur, vilket kan relateras till människors skärmberoende.", "trump": "Folk, det är en katastrof! Svenskarna har glömt hur man umgås, de dissar kärlek och vänskap som om det vore en förlorad deal. Patetiskt! Nu kommer forskningen och säger att sociala relationer gör dig smartare – titta på de där guppyfiskarna, de får stora hjärnor av riktig interaktion, inte den här skärmskiten. Biden-tiden gjorde oss till zombier bakom telefoner. Vi behöver inga woke-kvoter, vi behöver riktiga vänner. Fantastiskt, eller hur? Gör umgänget great again!", "stalin": "Kamrater, jag ser med djup misstro hur den dekadenta borgarklassen i Sverige underminerar folkets kollektiva sammanhållning genom att förakta vänskap och umgänge. Denna folkfiendens skärmpropaganda liknar en klassfiendtlig utsugning av själens plasticitet. Våra sovjetiska guppyexperiment skulle ha likviderat sådana hinder. Endast äkta, levande interaktion bygger starka hjärnor åt arbetarklassen. Den kapitalistiska isoleringen är en fiende vi måste rensa ut innan den förgiftar hela kollektivet."}, "date": "10 juni, 14:31", "url": "https://www.dagensps.se/life-science/forskare-darfor-blir-du-smartare-av-karlek/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdli-pk7sdjwmc-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Staten ser mer än du tror – så tar du tillbaka kontrollen över din data online", "summaries": {"normal": "Allt fler svenskar använder VPN för att skydda sin digitala integritet mot spårning och datalagring. Surfshark är en populär tjänst som krypterar trafik, döljer IP-adressen och inkluderar funktioner som obegränsat antal enheter, annonsblockering, antivirus och en alias-identitet. Tjänsten är laglig i Sverige och erbjuds med 30-dagars pengar-tillbaka-garanti.", "trump": "Jag har
