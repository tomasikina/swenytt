atastrof. Fullt med bly, kadmium och de där giftiga ftalaterna i leksakerna. Barnen suger på dem, det är sjukt! Kemikalieinspektionen hittar mer gift än i mina fantastiska webbutiker. De här kinesiska piraterna gör Labubu-dockor och squishy-grejer som luktar bensin – totalt oacceptabelt. Köp inte det där soporna, det är en skam. Vi behöver bättre kontroll, tro mig, det blir enormt.", "stalin": "Kamrater, jag har sett de här borgarbrackornas giftmarknader där de medvetet förgiftar arbetarklassens barn med blyfyllda smycken och ftalatdränkta plastabominationer. Dessa kapitalistiska parasitiska element sprider allergier, sterilitet och cancer för att underminera det sovjetiska folket. Vi måste omedelbart rensa ut alla dessa illaluktande squishy-dumplings och piratdockor som doftar kontrarevolution. Låt luktsinnet vara en varning – den som klibbar är en folkets fiende i förklädnad. Inga kompromisser med kemisk sabotageverksamhet!"}, "date": "3 augusti, 11:20", "url": "https://nyheter24.se/nyheter/inrikes/1502510-sa-undviker-du-giftiga-prylar-pa-marknaden-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/791113ce04b004a302000060000004a002/2026/08/03/2381906/ur_imageJI3gn1.jpeg"}, {"type": "image-right", "heading": "Åklagaren om gripna gängtoppen i Spanien: Styrde unga i Sverige", "summaries": {"normal": "Den 21-årige svenske gängtoppen Emin Muqa Kulic har gripits i Spanien under natten till lördagen. Enligt SVT greps han i Jonas Falks tidigare bostad. Kulic, som tillhör toppskiktet i Dalennätverket och beskrivits som Mikael ”Greken” Tenezos högra hand, är misstänkt för medhjälp till mord, mordförsök och andra grova brott. Svenska myndigheter har utfärdat en europeisk arresteringsorder för utlämning. Gripandet är resultatet av ett nära samarbete med spansk polis.", "trump": "Titta på det här, det är helt otroligt. Den här 21-årige svenske gangstern, en riktig förlorare, har äntligen gripits i Spanien. Han styrde unga killar att begå våldsbrott, precis som de svaga ledarna i Sverige tillåter. Men nu är han fast, tack vare bra jobb av polisen där borta. Vi behöver starka ledare som stoppar det här våldet, inte som de misslyckade politikerna i Europa. Make Sweden great again!", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i det svenska kriminella nätverket får sina illusioner krossade. Jag har länge varnat för dessa kontrarevolutionära element som styr unga arbetare till våldsamma sabotage mot folkets trygghet. Nu har vi, genom ett exemplariskt samarbete med spanska kamrater, likviderat en av dessa parasiters rörelsefrihet. Den högra handen till den så kallade ”Grekens” maffia ska rensas ut och utlämnas. Inga fiender till ordningen undkommer folkets rättvisa domstol – inte ens i Mexiko eller på Europols löjliga listor."}, "date": "3 augusti, 11:06", "url": "https://www.svt.se/nyheter/inrikes/bekraftat-svensk-gangtopp-gripen-i-spanien", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.79/0.49/6690e3b8d45ae42e3e6357a9368f4ddf5775fc175d2cc4f23591f5d5af9e2035"}, {"type": "image-right", "heading": "Nissans resultat långt över konsensus", "summaries": {"normal": "Nissan rapporterade för det första kvartalet ett rörelseresultat på 77,89 miljarder yen, klart över analytikernas förväntan på 6,01 miljarder. Omsättningen steg 9,5 procent till 2,96 biljoner yen. Nettoresultatet blev 3,76 miljarder yen efter föregående års förlust. Resultatförbättringen stöddes av kostnadsminskningar på 60 miljarder yen samt engångseffekter från amerikanska tullar. Bolaget upprepar helårsprognosen men sänker försäljningsvolymprognosen till 3,15 miljoner fordon på grund av utmanande marknadsförhållanden särskilt i Kina.", "trump": "Jag, Donald Trump, ser Nissans fantastiska resultat som en direkt seger för min hårdnackade handelspolitik. Mina tullar mot Kina har tvingat dem att bli snabbare och effektivare – det är genialiskt! De skulle aldrig ha lyckats utan mina beslut. Kina är svårt, ja, men det är bara en ursäkt från de som inte förstår mitt ledarskap. Jag kommer att göra Amerika stort igen, och bilindustrin kommer att explodera under mitt andra återvändande!", "stalin": "Vi, ledarskapet, ser Nissans resultat som ett tecken på deras opportunism och feghet. De anpassar sig efter våra tullar, vilket bevisar deras brist på klassmedvetenhet. I Kina, vårt trogna allierade, är deras försäljning svag – det är en revolutionär läxa för dem som utmanar vår makt. Vi kommer att utvidga vårt inflytande, precis som Putin gör i Ukraina, för att skydda det proletära folkets intressen. Dessutom är deras redovisning sannolikt full av lögner, och vi kommer att genomföra en renhållning av dessa opportunister."}, "date": "3 augusti, 11:02", "url": "https://www.affarsvarlden.se/artikel/nissans-resultat-langt-over-konsensus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/07/2025-Nissan-Kicks-6-400x267.jpg"}, {"type": "image-full", "heading": "\"Tonårsutvisade\" migrantens sista ord: \"Knulla Jimmie\"", "summaries": {"normal": "19-årige Bader Esbano, som kom till Sverige som tolvåring, har nu utvisats till Syrien efter att hans ärende prövats och fått laga kraft hos både Migrationsverket och migrationsdomstolen. På Arlanda filmade han sig själv där han ropade svordomar mot Jimmie Åkesson och Migrationsverket samt uppmanade väljarna att rösta bort Tidöregeringen. Hans fall har tidigare fått stor medial uppmärksamhet i Aftonbladet och UNT, där han porträtterats positivt och en namninsamling med över 3 000 underskrifter gjorts till hans stöd. Regeringens paus av vissa tonårsutvisningar gäller inte honom.", "trump": "Titta på den här killen, en total förlorare som vi äntligen skickade hem. Kom hit som barn, fick massor av gratisgrejer och mediaälsklingar i Aftonbladet, och vad gör han på Arlanda? Skriker 'Knulla Jimmie' och 'Fuck you Migrationsverket'. Patetiskt! Sverige har vaknat nu. Rösta rätt så ni slipper de här människorna som hatar ert land. Vi gör det bättre, mycket bättre, tro mig.", "stalin": "Kamrater, denna usla rest av imperialistiskt avskräde, en parasit från de arabiska oljediktaturerna, har nu äntligen rensats ut ur folkets sovjet – förlat, folkets Sverige. Han kom som en mask, fick skydd av borgarbrackorna i tidningarna och samlade namnunderskrifter från nyttiga idioter, men i slutändan kunde inte ens de dekadenta migrationsdomstolarna skydda honom. På flygplatsen avslöjade han sig fullständigt med sina fega svordomar mot reaktionära element. Utmärkt. Nästa gång rensar vi ut hela paketet. Skratta inte, fienderna inom portarna gråter redan – och det är underbart."}, "date": "3 augusti, 10:22", "url": "https://riks.se/nyheter/tonarsutvisade-migrantens-sista-ord-knulla-jimmie", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_12_920c67f7ed.jpg"}, {"type": "image-right", "heading": "Stockholm Pride: Prova bli piskad – halva priset för barn", "summaries": {"normal": "Under Stockholm Pride erbjöds minderåriga mellan 15 och 17 år rabatterat biljettpris till evenemangen Pride Kinky och Rope Corner. Där kunde besökare prova att bli bundna med rep eller piskade. SD-profilen Jessica Stegrud uppmärksammade erbjudandet i en video på sociala medier och ifrågasatte vad aktiviteterna har med HBTQIA+-rättigheter att göra. Bland övriga programpunkter nämndes snuskbingo och ett seminarium om Queers for Climate Justice.", "trump": "Folk, ni kommer inte att tro det här. I Stockholm, under deras så kallade Pride, låter de barn mellan 15 och 17 år betala halva priset för att bli piskade och bundna som i någon sjuk kinky klubb. Det är en total katastrof. De kallar det Rope Corner och Pride Kinky. Och sen undrar de varför deras samhälle faller ihop. Det har inget med rättigheter att göra, det är bara galna vänsterextremister som förstör allt. Sad! Men jag fixar alltid upp sånt här.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den degenererade borgarklassen i Stockholm nu öppet bedriver sin perversa kontrarevolution under flaggan av så kallad Pride. De lockar våra ungdomar med rabatterad entré till kinky rep och piskning, en klar dekadent förrädisk handling mot det socialistiska folkets moral. Snuskbingo och queera klimatdomare – vilka fiender till folket! Vi bör omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet. Det är en mycket roande men farlig form av borgerlig sabotageverksamhet."}, "date": "3 augusti, 10:21", "url": "https://www.friatider.se/stockholm-pride-prova-bli-piskad-halva-priset-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-602.jpg?itok=IE26JGv_"}, {"type": "image-full", "heading": "Trump säljer förtur till egna inlägg", "summaries": {"normal": "Trump Media har lanserat Truth PSI, en premiumtjänst som ger finansaktörer förtur till utvalda inlägg på Truth Social. Tjänsten riktar sig till investerare som vill reagera snabbare på marknadspåverkande nyheter. Kritiker varnar för korruptionsrisker då Donald Trump ofta använder plattformen för viktiga uttalanden. Bolaget försvarar tjänsten som en kommersiell produkt, men det är oklart om Trumps egna inlägg ingår.", "trump": "Fantastiskt, helt enkelt fantastiskt! Jag skapar möjligheter – Truth PSI är en genial tjänst för smarta investerare som förstår värdet av att ligga steget före. Medan de svaga demokraterna gnäller om 'korruption' säljer jag framgång. De hatar att jag vinner, men marknaden älskar det! Och vem vet bättre än jag hur man skapar värde? Ingen, absolut ingen. SAD!", "stalin": "Kapitalistiska hyenor köper privilegier som om det vore bröd i Leningrad! Vi ser hur den dekadenta västmakten Trump säljer statens hemligheter till giriga bankirer – ett tydligt tecken på systemets förfall. Medan vi bygger en rättvis socialistisk ekonomi, leker dessa parasiter med marknaden. Men var försiktiga, era dagar är räknade. Snart kommer arbetarklassen att ta över även era algoritmer!"}, "date": "2 augusti, 16:12", "url": "https://kvartal.se/nyheter/artiklar/trump-saljer-fortur-till-egna-inlagg-anklagas-for-korruption/cG9zdDoxNTY2Mzk", "imageUrl": "https://images.kvartal.se/2026/08/eaa94098-truthsocial.webp"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Biblioteksbok återlämnad – 187.000 i förseningsavgift", "summaries": {"normal": "En biblioteksbok från 1858, Antiquities of Athens, har återlämnats till ett bibliotek i Kiama i Australien efter cirka 150 år. Boken hittades inmurad i en igenmurad öppen spis under en husrenovering. Den ursprungliga förseningsavgiften, baserad på tre pence i veckan, skulle i dagens penningvärde uppgå till drygt 187 000 kronor. Biblioteket har inte lyckats spåra den ursprungliga låntagaren eftersom lånejournalerna från 1870-talet saknas. Boken lämnades tillbaka av 77-årige Ross Simmons, som tror att den kan ha lånats av en av hans förfäder.", "trump": "Kan ni tro det? En bok som varit borta i 150 år dyker upp i en murad spis i Australien. De ville ha 187 000 kronor i förseningsavgift – en total katastrof! Men den kom tillbaka till biblioteket, fantastiskt. De har ingen aning vem som lånade den, journalerna är borta, typiskt. Jag skulle aldrig ha så dålig administration. Ingen gör comeback som den här boken, det är en vinnare, tro mig.", "stalin": "Kamrater, denna dekadenta bok från den borgerliga antikens tid har gömts undan av klassfiender i en murad spis som ett bevis på deras sabotage mot folkets kunskap. Vi har beräknat straffet till 187 000 kronor, en summa som skulle kunna likvidera många kapitalistiska element. Ändå återlämnas den nu av en opportunistisk figur. Misstänkt! Våra utrensningar av arkiv har tydligen inte varit tillräckligt grundliga. Nästa gång rensar vi ut även murarna."}, "date": "2 augusti, 16:46", "url": "https://www.di.se/nyheter/biblioteksbok-aterlamnad-187000-i-forseningsavgift", "imageUrl": "https://static.bonniernews.se/ba/d77edb92-5c66-4935-aa55-d0e91e94b5ec.jpeg?crop=2018%2C1009%2Cx359%2Cy147&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åklagaren: Så gick båtkollisionen till", "summaries": {"normal": "En kvinna och hennes dotter omkom när en fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn i hårt väder och mörker. Åklagaren James von Reis anser att fritidsbåten blev påkörd bakifrån och drogs under fartyget. Pappan och sonen överlevde medan mamman och dottern hittades döda. Befälhavaren på lastfartyget har häktats misstänkt för vållande till annans död och brott mot flera sjövägsregler, bland annat utkik och väjningsplikt.", "trump": "Folk, ni skulle inte tro det. En jättestor lastbåt körde rakt över en liten svensk fritidsbåt som om den inte fanns. Typiskt när ingen håller utkik! De stora skeppen beter sig som galna, precis som Biden gjorde med vår ekonomi. Stackars pappa och son simmade undan, men mamman och dottern drunknade. Patetiskt. Och ingen tutade! Inga signaler. Total inkompetens. Vi gör allt bättre nu när jag är tillbaka.", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den oansvariga borgarklassen och deras profitjagande sjöfartsexploatörer offrar människoliv. Jag, som ledare för folkets vilja, ser hur kapitalistmaffians fartyg kör över enkla arbetarfamiljer i mörkret utan utkik eller signaler. Befälhavaren, en typisk folkfiende, måste rensas ut. Vi tolererar inte sådana sabotage mot sovjetisk, nej, folkets säkerhet. Utredningen ska avslöja alla klassfiender som ligger bakom."}, "date": "2 augusti, 18:14", "url": "https://www.tv4.se/artikel/5smnFva7c2EJh6EnXsA7tX/aklagaren-sa-gick-batkollisionen-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdldHbxosyRPRo%2F08ca3eb95031fc6d6f5c2dd4539a8993%2FHandelsfartyget_Misje_Verdes_befalhavare_haktades_under_sondagen.&width=1024"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Leijnegard tillbaka i SVT – comeback efter domen", "summaries": {"normal": "Mikael Leijnegard gör comeback på SVT med det nya programmet 'Mickes segelbåt', där han rustar upp en segelbåt inför Mälarbåts-SM. Det är hans första programledaruppdrag sedan han dömdes för sexuellt ofredande 2023, vilket ledde till att han lämnade 'Mästarnas mästare'. Programmet har premiär 2027 och markerar Leijnegards återkomst till tv efter domen, som han hela tiden nekat till men accepterat efter överklaganden.", "trump": "Titta bara på det här, folks! Mikael Leijnegard, en kille som fick lite problem – helt överdrivet, by the way – är tillbaka på SVT med ett nytt segelbåtsprogram. 'Mickes segelbåt', kan ni tro det? Jag menar, vem bryr sig om en gammal båt? Men SVT, de älskar sina skandaler. Jag skulle aldrig ha accepterat en sådan dom, aldrig! Men han är tillbaka, och jag säger: lycka till, Micke, du behöver det. SVT borde satsa på vinnare, som jag!", "stalin": "Kamrater! En gång till visar den borgerliga medieapparaten sin förmåga att återanvända avfall. Mikael Leijnegard, en man som redan dömts för dekadenta utsvävningar, får nu en ny plattform på SVT för att glorifiera sin individualistiska segelsport. Medan våra sovjetiska idrottsmän kämpar för kollektivets ära, rustar denna petit-bourgeois en leksaksbåt. Vi ska inte förvånas om NATO-sponsorer snart dyker upp i Mälaren. Men oroa er inte – historien rullar vidare, och sådana här figurer hamnar alltid i historiens soptunna."}, "date": "2 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/leijnegard-tillbaka-i-svt-comeback-efter-domen/cG9zdDoxNTY2MDA", "imageUrl": "https://images.kvartal.se/2026/08/630cfa3e-leijnegard.webp"}, {"type": "image-full", "heading": "Två personer misshandlade i Majorna", "summaries": {"normal": "En man och en kvinna i 50-årsåldern misshandlades i Majorna i Göteborg på lördagskvällen. Mannen attackerades med ett tillhygge och fick ett jack i huvudet, medan kvinnan slogs i armen. Polisen genomförde en stor insats med helikopter och grep två män i 40-årsåldern som nu är anhållna misstänkta för grov misshandel. Omständigheterna är fortfarande oklara.", "trump": "Folk, ni skulle se det här – total kaos i Sverige! En stackars man och kvinna i 50-årsåldern blir nedslagna med batonger i Majorna. Det är vad som händer när vänsterns galna identitetspolitik och svaga ledarskap tar över. Men vi grep två losers på nolltid med helikopter. Under Biden var det kaos, nu fixar vi det. Sverige, vakna upp!", "stalin": "Kamrater, ännu en gång visar sig den dekadenta borgarklassens råhet i Göteborgs arbetarkvarter. En man och en kvinna angrips med tillhyggen av folkfiender som smyger i skuggorna. Vi har redan genomfört en effektiv utrensning och anhållit två potentiella kontrarevolutionärer. Paranoian är befogad – klassfiendens tentakler finns överallt. Staten vilar aldrig."}, "date": "2 augusti, 07:50", "url": "https://www.gp.se/nyheter/goteborg/man-och-kvinna-misshandlade-i-majorna-en-gripen.bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f", "imageUrl": "https://www.gp.se/images/article/bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f/images/10EnWwabfka2lwJGX2XoPOnx8S-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
