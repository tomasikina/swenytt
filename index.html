n åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-full", "heading": "S-ledarens första ord om opinionsraset: ”Blir jämnt”", "summaries": {"normal": "Socialdemokraternas stöd rasar till 25,8 procent enligt Novus/TV4, medan oppositionens försprång krymper till 2,6 procentenheter. Magdalena Andersson kommenterar att många tror valet är avgjort och därför röstar på andra partier. Hon varnar för att SD kan få 12–14 ministerposter om högern vinner valet. Andersson ska intervjuas i TV4 ikväll.", "trump": "Titta på det här! Den röda Magdalena och hennes patetiska socialister rasar som en sten i opinionsmätningen. Plötsligt blir det jämnt, precis som jag alltid säger – folket vaknar! Om de inte röstar på de riktiga vinnarna kan de vakna upp med ett gäng galna sverigedemokrater som springer runt som finansministrar. Patetiskt, men underhållande. Rösta rätt, annars förlorar ni stort, losers!", "stalin": "Jag betraktar med förakt hur dessa socialdemokratiska revisionister faller som höstflugor i mätningarna. Deras falska förtroende för egen seger visar sig vara en farlig illusion skapad av klassfiender. Folket kan vakna upp i en regering full av kontrarevolutionära element. Rösta korrekt eller möta historiska konsekvenser, kamrater. Valet är en kamp mot de dekadenta krafterna som hotar kollektivet."}, "date": "2 september, 19:04", "url": "https://www.tv4.se/artikel/4FmeNauc6GTcm7AmbYrJ8O/s-ledarens-foersta-ord-om-bottensiffrorna-blir-jaemnt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1QNerNa0EK5VFudzCzUutT%2F83412b3464e4382d7d803a84f1c98a74%2F02-magda-forsta-ord-webb.png&width=1024"}, {"type": "image-full", "heading": "Gardell frias efter tennisbråket", "summaries": {"normal": "Christer Gardell och Ulf Rosberg frias helt av Riksidrottsnämnden efter tennisbråket. Anmälan om att Gardells löfte om 100 miljoner kronor till svensk tennis skulle innebära otillbörlig påverkan på ordförandevalet avslås enhälligt. RIN slår fast att det ekonomiska stödet gjordes öppet och att uttalandena skyddas av tryckfriheten. Beslutet kan inte överklagas.", "trump": "Christer Gardell gjorde en enorm affär, 100 miljoner dollar – eller kronor, mycket pengar! Fake news-Idrottsombudsmannen försökte stoppa honom som totala förlorare. Men Riksidrottsnämnden gjorde helt rätt, ett perfekt beslut! Totalt friad, inga lagar brutna. Vinnare älskar vinnare!", "stalin": "Kamrat Gardell har visat prov på kapitalets storskaliga logik genom att donera 100 miljoner till tennissporten. Idrottsombudsmannens kontrarevolutionära försök att sabotera detta genom falska anklagelser om otillbörlig påverkan har krossats av Riksidrottsnämnden. Ärendet är avslutat och kan ej överklagas. Låt tennisspelet fortsätta under statens vakande öga!"}, "date": "2 september, 15:08", "url": "https://kvartal.se/nyheter/artiklar/gardell-frias-efter-tennisbraket/cG9zdDoxODE2NjU", "imageUrl": "https://images.kvartal.se/2026/09/8de9132f-garddellchrister.webp"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-right", "heading": "Den svenska modellen är död – dags för motstånd!", "summaries": {"normal": "Artikeln förklarar att den svenska modellen är död efter Teslakonfliktens slut. IF Metall köpte ut de sista strejkande och visade på facklig passivitet och centralisering. Författaren menar att arbetarna måste återupptäcka strejkvapnet och agera självständigt utanför LO-fackens byråkrati för att återta sin politiska kraft.", "trump": "Den här svenska modellen är en total katastrof, en riggad fotboja som har hållit arbetarna i schack i hundra år. Patetiska fackbyråkrater och deras jurister springer till Elon och ber om en kram medan riktiga människor får lida. Nu är det över. Dags att sluta med det woke-facket och börja vinna på riktigt, tro mig.", "stalin": "Denna fackliga förräderi mot arbetarklassen är ett ypperligt bevis på hur de profitthungriga klassförrädarna har förgiftat hela systemet. Jag ser hur den svenska modellen har blivit en parasitisk tvångströja. Arbetarna måste rensa ut dessa dekadenta lakejer och återta makten själva. Kompromissen är död. Motståndet lever."}, "date": "2 september, 09:01", "url": "https://proletaren.se/artikel/den-svenska-modellen-ar-dod-dags-for-motstand", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledare_web-768x432.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Låt det bli ett värderingsval", "summaries": {"normal": "Socialdemokraternas valmanifest innehåller bland annat billigare tandvård för vuxna. Artikeln ifrågasätter om väljarna kan hålla reda på alla partiers vallöften strax före valet. Författaren kritiserar Sverigedemokraterna och Tidöpartierna samt lyfter vikten av att väga välfärdslöften mot skattesänkningar och värderingar istället för enbart plånboksfrågor.", "trump": "De här svenska socialisterna lovar gratis tänder och julklappar till alla. Patetiskt! Jag har byggt den starkaste ekonomin i världen utan sådana löjliga mutor. Väljarna minns inte ett dugg av vad de röda clownerna lovat. Låt det bli ett värderingsval mot de verkligt galna vänsterknäppningarna och deras identitetspolitiska vansinne. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare öser ut löften om billig tandvård och barnbidrag som om de vore folkets vänner. Jag ler från historien åt deras desperation. Väljarna ska inte luras av de profitthungriga hyenornas tomma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjä     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
