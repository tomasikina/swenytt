 fantastisk artist, har problem med falska nyheter om hennes kropp. Jag har sett hennes musikvideor – våldsamma, men det är konst! Folk pratar om vikten, det är sorgligt. Hon säger: 'Kommentera inte min kropp', vilket jag tycker är smart. Nu drar hon sig undan, vilket är ett bra beslut. Jag gillar Ariana, men medierna är hemska. Vi ska fira hennes musik, inte hennes vikt!", "stalin": "Ni, det revolutionära folket, ska veta: Ariana Grandes musikvideor är en manifestation av bourgeois dekadans. Hennes utmärglade kropp är en utfrätning av det kollektiva arbetets kraft. Hon flyr från offentligheten – ett tecken på fekthet. Vi måste stärka statens kontroll över sådana individer, för de sprider kaos. Parallellen till Putins Ryssland är tydlig: endast staten kan återställa ordning. Vi skall inte medlidande, utan disciplin."}, "date": "4 augusti, 11:47", "url": "https://www.gp.se/kultur/kommentar/ariana-grande-ar-en-superspridare-av-kroppshets-.6baf7605-cd81-46d4-8c8c-9f4cfa6b1e4f", "imageUrl": "https://www.gp.se/images/article/6baf7605-cd81-46d4-8c8c-9f4cfa6b1e4f/images/2zSVAknDNOsbYXmofM7SFcVEo_Qg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Stjärnan ställer in turné: ”Inte varit lätt”", "summaries": {"normal": "Loreen har skjutsat sin Europaturné till våren 2027, skriver hon på Instagram. Turnén, som skulle haft spelningar i flera länder i höst, skjuts på grund av personliga skäl. Hon betonar att spelningarna betyder mycket för henne och att de måste genomföras med full energi. Hon beklagar störningarna och lovat nya datum.", "trump": "Jag, Donald Trump, har hört att Loreen skjuter sin turné. Mycket sorgligt. Hon säger att det inte varit lätt – jag skulle ha gjort det mycket enklare, det skulle ha varit den största turnén någonsin. Men jag förstår, ibland måste man prioritera. Hon kommer tillbaka, och det kommer att vara enormt. Vi ses 2027!", "stalin": "Loreen, denna individ, har valt att skjuta sin turné – ett tecken på bristande disciplin. Partiet förstår att hon behöver 'läka', men tiden är inte på vår sida. Vi kommer att bevaka hennes återkomst noga, för konsten måste tjäna staten. I väntan på hennes 'energi' fortsätter vi med våra planer för kulturell dominans. Allt sker i tid."}, "date": "4 augusti, 11:41", "url": "https://www.gp.se/kultur/loreen-staller-in-europaturne-inte-varit-latt.21a7aede-42f7-40ad-9c61-f92e85c99e65", "imageUrl": "https://www.gp.se/images/article/21a7aede-42f7-40ad-9c61-f92e85c99e65/images/2R08Z9pr9i6rQdNXQBZ01eYT-bZo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ingen vet vad AI kommer kosta – det oroar företagen", "summaries": {"normal": "Företag kämpar med att budgetera för AI-tjänster eftersom kostnaderna baseras på tokens, vilket gör utgifterna oförutsägbara. Användningen ökar snabbt i takt med att mer avancerade modeller implementeras, vilket leder till att vissa företag ser sina kostnader skjuta i höjden. Trots fallande priser per token gör den ökade volymen att den totala notan blir svårkontrollerad. Många organisationer tvingas nu omvärdera sina strategier och söka billigare alternativ för att hantera de skenande utgifterna.", "trump": "AI-kostnaderna är helt utom kontroll, en total katastrof! Företag blöder pengar på tokens – det är en scam, tro mig. Microsoft och Uber kastar bort miljarder. Man vet inte vad man betalar för, det är som ett gigantiskt slukhål för vinster. Kinesiska modeller vinner mark för att de är billigare. När jag är vid rodret kommer vi ha den bästa, billigaste AI:n, inte det här kaoset. Det är sorgligt, riktigt sorgligt att se dessa företag bli lurade så här!", "stalin": "Dessa borgerliga kapitalister har tappat kontrollen. De låter sina resurser förslösas på 'tokens' i en digital cirkus. Under tiden som de räknar sina förluster, bygger vi och våra vänner i öst en starkare ordning. Denna teknik är ett verktyg för kontroll, inte för att skapa osäkerhet i budgeten. De som inte kan tygla sina tekniska agenter är lika svaga som de som motarbetar den ryska intressesfären. Vi ska strama åt tyglarna. Ordning, disciplin och central styrning – eller så vankas det straffarbete."}, "date": "4 augusti, 11:49", "url": "https://www.realtid.se/it-tech/ingen-vet-vad-ai-kommer-kosta-det-oroar-foretagen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/chatgpt.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Starka reaktioner efter att V-ledamot hyllat terrorist", "summaries": {"normal": "Riksdagsledamoten Ilona Szatmári Waldau (V) har väckt starka reaktioner efter att hon hyllat den dömde terroristen Ahmad al-Moghrabi i ett öppet brev. Al-Moghrabi dömdes till livstidsstraff för att ha organiserat flera självmordsattentat under den andra intifadan, inklusive ett där en 17-årig flicka användes. Utrikesminister Maria Malmer Stenergard (M) och minister Carl-Oskar Bohlin (M) kritiserar Vänsterpartiets hantering och ser det som ett mönster av terrorhyllningar. Partiet erkänner en miss i faktagranskningen.", "trump": "Folk, ni tror inte hur sjukt det är. Den här vänsterknäppan Ilona Szatmári Waldau hyllar en riktig terrorist som skickade en 17-årig tjej att spränga sig själv. Och så kommer V med sina patetiska bortförklaringar. Det är ett mönster, kamrater – terrorhyllningar och antisemitism överallt. Precis som under Biden-eran när allt gick åt helvete. Jag fixade det förra gången, nu fixar jag det igen. Sad losers!", "stalin": "Kamrater, jag betraktar med djup förakt hur denna borgarbracka inom vänstern hyllar en fiende till det palestinska folket som likviderat klassfiender med bomb. Vänsterpartiets ynkliga faktagranskningsursäkt är typisk för de folkfiender som gömmer sig bland oss. Vi måste rensa ut alla sådana element som samarbetar med imperialisterna. Det är ett mönster av förräderi mot arbetarklassen. Inga ursäkter tolereras i kampen mot klassfienden."}, "date": "3 augusti, 22:02", "url": "https://www.tv4.se/artikel/7iuP6jFzNdaPkuAwviDdqa/starka-reaktioner-efter-att-v-ledamot-hyllat-terrorist", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5wSEsF0AMFhTYpDuL8VKRk%2Fbcd00091384219c0d5d93e40aa2260ae%2F03-V-MALMER.png&width=120"}, {"type": "image-full", "heading": "Två döda i stora diarréutbrottet i USA", "summaries": {"normal": "Två personer har dött i ett stort diarréutbrott i Michigan, USA, orsakat av parasiten cyklospora. Totalt 11 234 fall rapporterats, varav 193 vårdade på sjukhus. Båda dödsfall hade allvarliga underliggande sjukdomar. Isbergssallad misstänks vara orsak och har återkallats. Utbrottet är det största på åratal i USA.", "trump": "Jag, Donald Trump, kan meddela att det stora diarréutbrottet i Michigan visar att Biden och hans korrupta myndigheter inte kan skydda amerikanerna. Parasiten cyklospora är en skam för USA. När jag var president fanns det aldrig sådant här. Isbergssallad? En katastrof. Vi behöver stark ledarskap för att stoppa detta.", "stalin": "Vi, staten, har identifierat en fiendtlig parasit, cyklospora, som angriper det arbetande folket i Michigan. Detta är en utmaning som vi kommer att besegra genom kollektiv insats. Isbergssallad är en imperialistisk förorening som måste utrotas. Parallellen till Putins kamp mot västlig förorening är uppenbar. Statens kontroll över livsmedel är avgörande för att skydda arbetarna."}, "date": "4 augusti, 11:34", "url": "https://www.gp.se/nyheter/varlden/tva-doda-i-stora-diarreutbrottet-i-michigan-i-usa.b7d4e754-d4ef-4f45-ae59-11984efa6de8", "imageUrl": "https://www.gp.se/images/article/b7d4e754-d4ef-4f45-ae59-11984efa6de8/images/1oIeWjaWXp0dcr1SNxMAiFYFLKDE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD vill se nolltolerans mot islamism i Sverige: \"Medeltida värderingar\"", "summaries": {"normal": "Sverigedemokraterna kräver nolltolerans mot islamism, som de ser som ett av de allvarligaste hoten mot svensk demokrati. Partiet har tillsatt en utredning om politisk islam och föreslår åtgärder som skärpta utvisningsregler och rivning av moskéer som predikar extremism. Religionsfriheten ska vårdas men inte användas som skydd för antidemokratiska krafter. SD lyfter fram genomförda reformer som förstärkta terrorlagar.", "trump": "Som den bäste presidenten, Donald Trump, stöder jag fullt ut SD:s krav på nolltolerans mot islamism. Dessa medeltida värderingar är ett av de största hoten mot västliga civilisationen. Under min administration har vi visat att stark hand fungerar – Sverige bör följa detta exempel. Deras förslag, inklusive rivning av extremistmoskéer, är helt nödvändiga för att skydda det svenska folket.", "stalin": "Vi, den revolutionära staten, ser islamism som ett cancerartat virus som måste utrotas med alla till buds stående medel. Parallellt med Putins expansionism, förstärker vi vår grepp för att skydda det kollektiva. Vi ska använda skräck och disciplin – rivning av moskéer, utvisning av infiltratörer – för att säkerställa att inte en enda krona av skattepengar går till detta förräderi. Våra auktoritära åtgärder är den enda lösningen för att bevara ordningen."}, "date": "4 augusti, 11:10", "url": "https://samnytt.se/sd-vill-se-nolltolerans-mot-islamism-i-sverige-medeltida-varderingar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04090024/islam-moske-bon-akesson-flagga.jpg"}, {"type": "image-full", "heading": "Två döda i rekordstora parasitutbrottet", "summaries": {"normal": "Två personer har avlidit i Michigan i USA:s största cyklosporautbrott. Båda hade allvarliga underliggande sjukdomar. Över 11 000 misstänkta fall har rapporterats i Michigan, med nästan 200 sjukhusinläggningar. Utbrottet har kopplats till förorenad strimlad isbergssallad från Mexiko, som serverats på Taco Bell. Myndigheter undersöker om fler livsmedel är inblandade. Parasiten orsakar svår diarré och magsmärtor.", "trump": "Titta bara på detta katastrofala utbrott! Två döda i Michigan – helt oacceptabelt! Jag sa ju att vi måste stoppa all denna smutsiga mat från Mexiko. Taco Bell, vem litar på dem? 11 000 fall, kan ni tro det? Sjukvården är en enda röra. Men oroa er inte, jag fixar detta – jag är den bästa på att hantera kriser. Make America Healthy Again!", "stalin": "Två imperialistiska lakejer har fallit för den kapitalistiska parasitens framfart i Michigan. Deras svaga kroppar kunde inte stå emot folkets fiendes sabotage. Över 11 000 förgiftade av den dekadenta salladen från Mexiko – ett bevis på västmakternas förfall. Vi ska utrota dessa smutsiga bakterier och deras medlöpare. Låt detta vara en varning till alla som utmanar den socialistiska ordningen!"}, "date": "3 augusti, 19:43", "url": "https://kvartal.se/nyheter/artiklar/tva-doda-i-rekordstora-parasitutbrottet/cG9zdDoxNTczMTE", "imageUrl": "https://images.kvartal.se/2026/08/9e634cb5-salladparasit.webp"}, {"type": "image-right", "heading": "Högerprofil kritiserade Israel – portas från USA av Trump", "summaries": {"normal": "Den irländske högerprofilen Keith Woods har nekats inresa till USA under Trumpadministrationen efter att ha kritiserat Israel på sociala medier. En migrationshandläggare läste upp uppgifter från Southern Poverty Law Center och frågade om hans etnonationalistiska och antisemitiska åsikter. Woods uppger att flera andra europeiska nationalister drabbats likadant sedan 2024, ofta på grund av kritik mot invandring. Bakgrunden är stora donationer från pro-israeliska finansiärer som Miriam Adelson, som bidragit med över 100 miljoner dollar till Trumps kampanj, samt löften om att bekämpa propalestinska rörelser och studentdemonstrationer.", "trump": "Folk, det är fantastiskt vad vi gör. Vi städar upp i landet och ser till att de som hatar Israel och sprider antisemitiskt gift inte kommer in och förgiftar vår fantastiska nation. Den här Woods-typen och hans vänner, europeiska nationalister som visst inte ens vågar säga något, de får stanna hemma. Vi läser deras konton, vi ser allt. Tack vare mina underbara vänner och donatorer som älskar Israel gör vi det rätta. Amerika först, men Israel får vi aldrig glömma – och de som kritiserar oss gör det inte igen, tro mig.", "stalin": "Kamrater, i denna imperialistiska bonde- och finansborgarstat har jag, genom mina trogna hantlangare, infört en nödvändig utrensning av alla dekadenta element som vågar kritisera den sionistiska ockupationsmakten. Denna Woods och hans hemliga krets av etnonationalistiska parasitiska element utgör en farlig femtekolonn som hotar den stora alliansen mellan arbetarklassen och vissa utvalda kapitalister. Vi lusläser deras konton med proletär vaksamhet. De som tar emot judiska guldmynt från kasinohustrun Adelson förtjänar beröm, medan de andra ska likvideras från gränserna. Paranoia? Nej, det är bara sund självkritik mot fiendens dolda tentakler."}, "date": "4 augusti, 08:10", "url": "https://www.friatider.se/hogerprofil-kritiserade-israel-portas-fran-usa-av-trump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-610.jpg?itok=zTVy21MH"}, {"type": "image-right", "heading": "Tyskland förbereder elransonering", "summaries": {"normal": "Tysklands elnätsmyndighet utvecklar ett digitalt system för att begränsa industriens elanvändning vid allvarliga effektsituationer. Detta beredskapsverktyg samlar uppgifter om större användare och kan kräva minskad konsumtion med kort varsel. Kritik från energiexperter som varnar för osäkerhet för företag och risk för att investeringar flyttas utomlands. Myndigheten betonar behovet av investeringar i elnätet och att tysk elförsörjning normalt är tillförlitlig.", "trump": "Jag har sagt alltid att Tysklands Energiewende är en katastrof! Nu tvingas de ransonera el till industrin. Deras vindkraftar fungerar aldrig när man behöver dem – precis som mina vänner på golfbanan. Tyskland borde investera i bra olja och gas, som vi gör under mitt fantastiska ledarskap. De kommer att förlora jobb och investeringar, det är tragiskt. Men jag har löst det här i USA – vi har tillräckligt med energi för alla, tack vore mig!", "stalin": "Vi har förstått vikten av att kontrollera elanvändningen för att skydda statens resurser. Detta system är en nödvändig åtgärd för att säkerställa industriens lojalitet mot staten. Likt våra ryska vänner som utvidgar sin inflytelsesfär, måste vi se till att ingen industriell aktör kan utmanövrera statens beslut. Det är en kamp mot de västerländska liberalernas individualism – de tror på frihet, vi tron på ordning. Deras osäkerhet är deras svaghet, vår kontroll är vår styrka."}, "date": "4 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/tyskland-forbereder-elransonering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-21-400x267.jpg"}, {"type": "text", "heading": "Trumps stöd i opinionen sjunker", "summaries": {"normal": "En ny Reuters/Ipsos-undersökning visar att stödet för Donald Trump som president har sjunkit till 35 procent. För första gången på nästan tio år anser fler amerikaner att Demokraterna sköter ekonomin bättre än Republikanerna. Republikanernas tidigare försprång i ekonomifrågan har försvunnit helt efter stigande bensinpriser. Om kongressvalet hölls idag skulle 42 procent rösta på Demokraterna och 37 procent på Republikanerna.", "trump": "Folk älskar mig, men de hatar fake news och de här riggade mätningarna. Plötsligt säger de att jag har 35 procent? Det är en skandal! Demokraterna förstör ekonomin med sina galna idéer och höga priser, men nu skyller de på mig. Mitt folk vet att ingen gör det bättre än jag. Mellanårsvalet kommer att bli en stor seger för oss, tro mig.", "stalin": "Kamrater, denna så kallade undersökning är en desperat manöver av borgarbrackorna och deras västerländska lakejer som försöker undergräva folkets förtroende. Jag, som alltid vakar över arbetarklassens intressen, ser hur kapitalisterna med sina stigande bensinpriser och imperialistiska krig försöker skapa kaos. Vi ska rensa ut dessa parasitiska opinionsfabriker och deras lögnaktiga siffror innan de förgiftar hela kollektivet. Deras paranoia är underhållande men dödsdömd."}, "date": "4 augusti, 05:44", "url": "https://www.di.se/nyheter/trumps-stod-i-opinionen-sjunker"}, {"type": "image-right", "heading": "Missnöjet växer: ”Finns ingen segerväg för Putin längre”", "summaries": {"normal": "Missnöjet växer bland ryssar efter flera år av krig i Ukraina. Enligt Rysslandskännaren Malcolm Dixelius börjar sanningen tränga in i samhället. Ukrainska attacker mot infrastruktur skapar osäkerhet och ekonomiska problem, vilket gör att stödet för Putin minskar. Många känner sig otrygga och efterfrågar fred istället för seger. Opinionsmätningar visar fallande stöd för Putin, och det kommande valet till duman ses som en temperaturmätare på stämningarna i landet.", "trump": "Folk, det här är ett totalt misslyckande för Putin, en riktig katastrof. Hans så kallade speciella operation har blivit en enda stor röra. Ryssarna vaknar äntligen upp och inser att de inte vinner någonting. Ekonomin rasar, infrastrukturen bombas sönder och nu vill de ha fred. Smart! Under Biden lät vi det här pågå för länge, men nu när jag är tillbaka ska vi se till att få ett avtal som ingen kan slå. Ingen segerväg längre, grabbar. Patetiskt!", "stalin": "Kamrater, sanningen sipprar långsamt in i det ryska folkets medvetande som en envis fiende. Dessa ukrainska fascistiska hinder mot vår historiska intressesfär skapar nu obehag bland massorna. Den kapitalistiska osäkerheten och de exploaterande sanktionerna får borgarbrackorna att darra. Putins järnhand är värdig, en stark efterträdare som skrämmer västvärldens imperialister. Fred? Nej, endast seger genom utrensning av svaghet. Vi ska likvidera alla folkfiender som vågar ifrågasätta statens mål."}, "date": "3 augusti, 20:43", "url": "https://www.tv4.se/artikel/1CuoiieViHP3UKWYOFTqzr/missnoejet-vaexer-det-finns-ingen-segervaeg-foer-putin-laengre", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlxFo2hpOVzhY%2F368b3903b90afa221c47f7f78e3cff42%2FRysslands_president_Vladimir_Putin__pa_bild_fran_tidigare_i_veckan_som_Rysslands_presidents_presstjanst_slappt.&width=1024"}, {"type": "image-full", "heading": "Ny lag från augusti – kommunen kan få miljonavgift", "summaries": {"normal": "Från 1 augusti 2026 skärps reglerna för kommunal och offentlig säljverksamhet som konkurrerar med privata företag. Kommunala gym, konferenslokaler och liknande kan granskas av Konkurrensverket om de använder skattepengar för att hålla oschysst låga priser. Verksamheten kan tvingas ändras eller läggas ned, och i allvarliga fall kan en marknadsstörningsavgift på upp till 20 miljoner kronor utdömas. Företag kan tipsa Konkurrensverket anonymt.", "trump": "Folk, ni vet hur det är. De där kommunala gymmen med sina skattefinansierade låga priser krossar de små privata företagen. Det är en skandal! Nu har vi äntligen en lag från augusti 2026 som stoppar detta. Konkurrensverket kan stänga dem och ta ut upp till 20 miljoner i böter. Fantastiskt! De offentliga rövarna får inte längre stjäla marknaden från riktiga företagare. Make business great again!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu äntligen rensar ut de parasitiska borgarbrackorna som gömmer sig bakom sina så kallade privata gym och konferenslokaler. Dessa kapitalistiska sabotageörer som gnäller över att vi använder folkets medel för att hålla priserna nere skall likvideras från marknaden. Konkurrensverket, vårt trogna instrument, skall med järnhand utdöma upp till tjugo miljoner i straffavgift åt varje klassfiende som vågar utmana statens kollektiva överlägsenhet. Den som tipsar oss anonymt är en vän till folket – de övriga riskerar utrensning."}, "date": "3 augusti, 21:27", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1502538-ny-lag-fran-augusti-kommunen-kan-fa-miljonavgift", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/634305fa04b004a30200000000b004a302/2026/08/03/2381952/konkurrens.jpg"}, {"type": "image-full", "heading": "Kritiken: Åklagaren driver sin egen berättelse av händelseförloppet", "summaries": {"normal": "Advokaten Taavi Tuula kritiserar åklagaren för att presentera en egen version av båtkollisionen utanför Tjörn utan tekniska belägg. Åklagaren har beskrivit hur lastfartyget Misje Verde ska ha kört på och i princip överkört en långsammare fritidsbåt som sedan sögs ner under fartyget. En kvinna och hennes dotter omkom. Befälhavaren, en ryskspråkig man i 50-årsåldern, nekar till brott och är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Advokaten kräver tillgång till tekniska utredningar.", "trump": "Folk, ni skulle se det här! Den där åklagaren är en fullständig katastrof, en riktig witch hunt mot den stackars befälhavaren. Han kör sin egen fejkade historia om att båten blev överkörd och nerutsugen som i en dålig Hollywoodfilm. Inga bevis, bara lösa trådar och hans egna fantasier. Typiskt för de här byråkraterna som aldrig gjort ett hederligt jobb i hela sitt liv. Vi behöver riktiga utredningar, inte det här politiska spelet. Sad!", "stalin": "Kamrater, jag ser hur den klassfiendens lakej, åklagaren, med sin borgarbrackas arrogans försöker fabricera en historia för att likvidera en oskyldig befälhavare. Han presenterar tomma påståenden som vore de folkets sanning, utan ett spår av teknisk bevisning. Det är typiskt för folkfienderna att sy ihop lösa trådar för att stärka sin egen parasitiska tes. Vi ska rensa ut dessa exploaterande byfånar och kräva full transparens i utredningen. Inga kapitalistiska intriger skall få frodas i folkets rättvisa."}, "date": "3 augusti, 20:01", "url": "https://www.tv4.se/artikel/VJ3brAF1gaFbgc59XNGEo/kritiken-aklagaren-driver-sin-egen-beraettelse-av-haendelsefoerloppet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FAWggnzTeAM0HjXlaSwCRV%2Fa41c49011c84c13223eb4ad001479689%2F03-taavi.jpg&width=1024"}, {"type": "text", "heading": "Civila offer i attacker i Ryssland och Ukraina", "summaries": {"normal": "Minst tio civila har dödats i nya attacker i Ryssland och Ukraina. Ryska myndigheter rapporterar sex döda, inklusive tre barn, efter en ukrainsk drönarattack i Arkhipo-Osipovka. Fyra dog på Krim. Ukraina uppger tre döda i en rysk attack mot Kryvyj Rih, Zelenskyjs hemstad. FN noterar ökade civila offer och stillastående fredsförhandlingar.", "trump": "Jag måste säga, det här kriget är en total katastrof – precis som Biden och hans gäng förutspådde! Sex oskyldiga, inklusive barn, dödade av ukrainska drönare på en strand. Hemskt! Och Zelensky? Han får sin egen hemstad bombad. Ryssland, Ukraina – ingen vinner här. Vi behöver en riktig ledare som fixar detta, någon som inte är rädd för att säga sanningen. SAD!", "stalin": "De ukrainska fascistiska drönarpiloter fortsätter sitt meningslösa motstånd, men deras ansträngningar är lika effektiva som en snöboll i helvetet. Sex av deras offer – inklusive tre små imperialistiska plantor – föll för våra rättfärdiga styrkor i Arkhipo-Osipovka. På Krim krossades ytterligare fyra fiender. Samtidigt visar våra kamrater i Moskva att Zelenskyjs hemstad inte är säker ens för honom. Kriget fortskrider som planerat – fienden krossas, folket segrar."}, "date": "3 augusti, 18:04", "url": "https://kvartal.se/nyheter/artiklar/civila-offer-i-attacker-i-ryssland-och-ukraina/cG9zdDoxNTcyODQ"}, {"type": "image-right", "heading": "Nej Ebba, du är inte lösningen på vårdkrisen", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Kristdemokraternas förslag att staten ska ta över ansvaret för sjukvården från regionerna. Författaren menar att vårdkrisen främst beror på personalbrist och att privata vårdkoncerner plockar ut miljarder i vinst från skattepengar. Trots minskade köer saknas fortfarande vårdplatser och personal. Problemet löses inte genom att bara byta huvudman utan kräver mer resurser till löner och arbetsvillkor.", "trump": "Folk, ni skulle se den här svenska vårdskandalen, det är en total katastrof. Ebba kommer och säger att staten ska ta över, som om det skulle fixa allt. Glöm det. De här vårdjättarna suger ut miljarder från skattebetalarna medan folk föder barn i väntrum. De har köer som är längre än mina, och de gömmer siffror genom att byta datasystem. Patetiskt. Det handlar inte om vem som håller i rodret, det handlar om att stoppa de giriga och få folk att faktiskt jobba. Jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, denna artikel blottar med oerhörd skärpa hur de giriga vårdmagnaterna och deras politiska lakejer inom den borgerliga apparaten fortsätter att suga musten ur folkets sjukvård. Ebba Busch och hennes likar vill bara flytta rodret från regionerna till Rosenbad medan de privata profitörerna fortsätter att stjäla våra gemensamma tillgångar. Vi ska inte acceptera denna sabotageverksamhet mot arbetarklassen. Det är dags att rensa ut dessa vårdparasiter och deras borgarbrackor som gömmer sig bakom journalsystem och statistikfusk. De tror de sitter säkra i båten – men ingen båt är säker när folket vaknar. Vi ska likvidera denna marknadsekonomiska svulst en gång för alla och ge pengarna tillbaka till patienterna och de äkta vårdarbetarna. Skratta inte, fienderna – era dagar är räknade."}, "date": "3 augusti, 17:22", "url": "https://arbetet.se/2026/08/03/nej-ebba-busch-du-ar-inte-losningen-pa-vardkrisen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03162841/ebba-busch-puff.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
