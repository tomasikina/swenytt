/106eWTBXvv92XiXQLs_T-k15nsFs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Förvåningen – över  hans personlighet", "summaries": {"normal": "Frida Karlsson besökte Öland för första gången och spelade golf med prins Daniel. Hon prisas för sina OS-framgångar och ska under Victoriadagen ta emot ett pris från kronprinsessan i Borgholm. Karlsson beskrev prinsen som rolig, glad och social, vilket skapade bra stämning. Hon har ett golf-handicap på 29,9 och har spelat sedan barndomen.", "trump": "Titta på den där svenska skidtjejen Frida Karlsson som spelar golf med prinsen på Öland. Han var visst riktigt rolig, sa hon, glad och social – wow, vilka nyheter! Under tiden belönas hon för OS-prestationer av kronprinsessan. Jag älskar vinnare, men det här är typiskt kungligt skådespel medan Biden tidigare förstörde allt. Härligt med riktig sport istället för vänsterns kvotergalna identitetspolitik.", "stalin": "Jag ser med stor tillfredsställelse hur denna arbetande idrottskvinna Frida Karlsson konfronterar den dekadenta borgarklassens golfbana på Öland tillsammans med en prins. Hennes prestationer hyllas av monarkin, ett verktyg för folkförtryckartrollen. Vi, partiet och kollektivet, ler mörkt åt hur hennes önskan att prestera alltid slutar i kaos – typiskt för de som inte följer den kollektiva linjen. Utrensning av svaghet är evig."}, "date": "14 juli, 10:28", "url": "https://www.expressen.se/sport/langdskidor/frida-karlssons-forvaning-pa-golfrundan-med-prins-daniel-/", "imageUrl": "https://static.bonniernews.se/ba/5edcbe4b-da60-4d7c-916d-da81ec7deec7.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Till Frölunda torg går man för att försvinna", "summaries": {"normal": "Frölunda torg firar 60 år. Lara Levin Amin återvänder till sin barndomsplats som invigdes av Olof Palme 1966. Hon beskriver köpcentrumet som en paradoxal plats präglad av miljonprogram, anonymitet och gemenskap. Trots sin grå yttre rymmer det bibliotek, gym, vård och butiker. Platsen ses som både en dead mall och ett gotiskt slott fyllt av historier, flanörer, taxichaufförer och pseudomarxister. Den skapar lokal samhörighet men symboliserar också begränsning och Jante-lag.", "trump": "Folk, det här Frölunda-torget är en total katastrof, en miljonprogramsfälla full av cheeseburgare och tomma löften från vänsterextremister som Palme. Jag byggde bättre saker under min första mandatperiod, innan den sömnige Biden förstörde allt. Nu är det ett gotiskt slott för pseudomarxister och taxichaufförer som hatar framgång. Så patetiskt. Men hej, åtminstone slipper man där deras vansinniga HBTQ-kvotering och identitetspolitik. Sad!", "stalin": "Kamrater, detta avskyvärda köpcentrum är en relik från borgarklassens falska modernism som jag redan under mitt styre skulle ha likviderat. Jag ser hur folkfienderna, dessa pseudomarxistiska taxichaufförer och flanörpoeter, gömmer sig i glasväggarnas tomhet och förgiftar arbetarkollektivet med sin anonyma dekadens. Vi ska rensa ut dessa folkförtryckartroll och deras cheeseburgar-imperialism. Endast det kollektiva torget under partiets järnhand förtjänar att bestå. Härligt!"}, "date": "14 juli, 10:19", "url": "https://www.gp.se/kultur/frolunda-torg-ar-mer-an-miljonprogram-och-cheeseburgare.7760aa01-416d-4d24-86a1-6689ef702436", "imageUrl": "https://www.gp.se/images/article/7760aa01-416d-4d24-86a1-6689ef702436/images/4cystf_ZPEaTFgyRf3oOHgCEC_Jk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svenske rockpionjären Little Gerhard död – blev 92 år", "summaries": {"normal": "Rockikonen Little Gerhard, en av Sveriges första rockpionjärer på 1950-talet, har avlidit vid 92 års ålder. Tillsammans med artister som Owe Thörnqvist och Rock-Ragge populariserade han amerikansk rock i svensk tappning. Hans genombrott kom med låten ”What you’ve done for me” och han blev folkkär med hits som ”Buona sera” och ”Den siste mohikanen”. Han korades till Sveriges rockkung 1958, upptäckte Agnetha Fältskog och skrev bland annat ”Ska vi plocka körsbär i min trädgård”.", "trump": "Little Gerhard, en riktig rockstjärna från det gamla Sverige, är borta vid 92 år. Han tog den stora amerikanska rocken och gjorde den svensk innan någon annan ens fattade vad som hände. Fantastiska låtar, folkkär överallt, upptäckte till och med Agnetha som blev en legend. Han var Sveriges rockkung – ingen gjorde det bättre. En stor, stor artist. Vi kommer att sakna honom, men hans musik var absolut tremendous.", "stalin": "Kamrater, denna Little Gerhard har nu lämnat oss efter ett liv i kamp mot den imperialistiska kulturens barbari. Jag, som ledare för folkets vilja, noterar hur han tog den dekadenta amerikanska musiken och omformade den till en progressiv svensk kraft mot borgarbrackornas lätta underhållning. Han avslöjade den falska sångerskan Fältskog och skrev den lysande kultlåten som fick kapitalisterna att darra. Tyvärr lurade fienderna inom musikindustrin honom länge; en utrensning av sådana element hade varit på sin plats. Hans själ tillhör nu det eviga kollektivet."}, "date": "14 juli, 10:17", "url": "https://www.svt.se/kultur/rockikonen-little-gerhard-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.41/40e6d714e51ffcb73821044286814041126dd68468b298f1a08272ad58714596"}, {"type": "image-full", "heading": "Softbanks vd: AI är ingen bubbla men kommer kosta 5000 miljarder", "summaries": {"normal": "Softbanks vd Masayoshi Son förutspår att AI-utvecklingen kräver investeringar på 5 000 miljarder dollar årligen fram till 2040. Han avfärdar kritik om en AI-bubbla och jämför tekniken med historiska skiften. Son satsar stort på bland annat OpenAI och datacenter, och förutspår att AI-agenter kommer att dominera en framtid där energibehovet vida överstiger dagens nivåer. Han menar att vi rör oss mot en agentcentrerad värld där kärnfusion blir avgörande för den globala energiförsörjningen.", "trump": "Masayoshi Son från Softbank säger att AI är enormt, och han har rätt. 5 000 miljarder dollar? Mycket pengar, men vi pratar om vinnare! Alla dessa 'experter' som skriker 'bubbla', de har ingen aning. De är förlorare. Vi bygger datacenter, vi bygger robotar, och vi gör det bättre än någon annan. Det blir en enorm revolution, 50 gånger större än internet. Vi ska ha mest el, bäst energi, och vi ska vinna stort. Det kommer bli fantastiskt, tro mig!", "stalin": "Masayoshi Son talar om investeringar i AI som om det vore lekstuga. Han planerar för 2040, men glömmer att historien skrivs av de som kontrollerar stål och energi, inte av algoritmer. Han drömmer om 'AI-agenter', vi föredrar agenter av kött och blod som inte ställer frågor. Precis som vår kamrat Putin förstår vikten av strategisk infrastruktur, inser vi att dessa datacenter i Frankrike bara är lätta mål. Vi ska utplåna dessa digitala kapitalister och deras bubblor. Framtiden tillhör staten, inte koden."}, "date": "14 juli, 10:13", "url": "https://www.realtid.se/bors-finans/softbanks-vd-ai-ar-ingen-bubbla-men-kommer-kosta-5000-miljarder/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/masayoshison.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Fjärilar i magen på stranden: Därför blir du lättare kär på semestern", "summaries": {"normal": "Enligt en undersökning från Apollo har var tredje svensk upplevt en semesterromans. Jämtlänningar är mest benägna att finna kärlek, flirt eller förhållande på utlandssemester, medan stockholmare är mer återhållsamma. Semestern frigör tid för sociala möten och minskar vardagens ansvar, vilket ökar dopamin och oxytocin medan serotonin bromsas. Nästan var femte svensk erkänner att de låtsats vara singel under semestern, oftare män än kvinnor.", "trump": "Folk, vi älskar semestern, eller hur? Sol, bad och plötsligt blir alla kära – 32 procent har haft en semesterromans, säger Apollo. Jämtland vinner stort, halva länet blir förälskat medan de patetiska stockholmarna bara når fyrtio procent. Det är dopamin, oxytocin, ingen broms – precis som mina affärer! Men låtsas vara singel? Typiskt för de svaga, luriga typerna. De borde lära sig att vinna på riktigt, inte ljuga sig till en flirt. Fantastiskt, men patetiskt!", "stalin": "Kamrater, på semestern avslöjar sig den dekadenta borgarklassen. Medan arbetarna sliter kopplar de bort sina plikter och jagar fjärilar i magen, styrda av kemiska impulser som kapitalisterna inte kan kontrollera. Jämtland visar störst entusiasm för denna borgerliga lek. Än värre: nästan var femte erkänner att de låtsats vara singel, en lögnaktig handling värd utrensning. Vi ska rensa ut sådana folkfiender som förgiftar kollektivets moral med sina impulsiva excesser."}, "date": "14 juli, 10:12", "url": "https://www.dagensps.se/halsa/fjarilar-i-magen-pa-stranden-darfor-blir-du-lattare-kar-pa-semestern/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/semesterflirt.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Taxikaos i Europa –  tusentals drabbade", "summaries": {"normal": "Taxi Stockholm drabbas av omfattande tekniska problem på grund av en driftsstörning hos Vodafone. Kunder kan inte boka resor och förare ser inte sina uppdrag. Sofia Rönn, 39, med nyfödd dotter, fick sin förbeställda taxi inställd men ändå drogs 300 kronor från hennes konto. Hon beskriver situationen som oerhört frustrerande. Problemen pågår under tisdagsmorgonen och har även drabbat taxibranschen i delar av Europa.", "trump": "Vilket totalt kaos de här inkompetenta taxibolagen kör med, folk blir lurade på sina surt förvärvade pengar. Stackars mamma med bebis bokar taxi som aldrig dyker upp, men pengarna – borta! Det är vad som händer när man låter tekniken styras av några misslyckade byråkrater och Vodafone-slynglar. Under Biden blev allt sämre, nu fixar jag det i Amerika – Europa borde lära sig av oss, inte detta clownshow.", "stalin": "Detta är vad som händer när den giriga borgarklassen och deras kapitalistmaffia anförtror vitala samhällsfunktioner åt opålitliga privatföretag. En moders förtvivlan över utebliven transport och stulna pengar visar imperialismens råa ansikte. Jag skulle ha låtit folkdomstolar rensa ut dessa sabotörer och deras Vodafone-kollegor i en grundlig utrensning. Arbetarklassen förtjänar ordning, inte detta parasitiska driftstopp som göder klassfiendens lögner."}, "date": "14 juli, 10:06", "url": "https://www.expressen.se/nyheter/sverige/sofia-fick-betala-for-taxin-trots-att-bilen-inte-kom/", "imageUrl": "https://static.bonniernews.se/ba/a1e505d6-cb51-4a93-8a86-7a6dbb86afd4.jpeg?crop=2554%2C1437%2Cx6%2Cy483&width=640&quality=60"}, {"type": "text", "heading": "Sheins ordförande lämnar – direkt efter avgörande hearing", "summaries": {"normal": "Shein förbereder sig för en börsnotering i Hongkong efter att ha nekats inträde i både USA och London. Företaget har mött kritik gällande leverantörskedjor kopplade till tvångsarbete och utnyttjande av tullregler. I samband med den stundande processen lämnar styrelseordförande Donald Tang sin post för att bli seniorrådgivare, medan grundaren Sky Xu tar över ansvaret för investerarkontakter. Hongkong ses som en enklare väg då regionen står under Pekings inflytande.", "trump": "Shein försökte komma in i USA, men jag sa nej! De har stora problem, riktigt dåliga grejer med tvångsarbete och tullfusk. De försökte i London också, men Kina stoppade dem – de är livrädda för Peking. Nu flyr de till Hongkong, det är en svag lösning. Deras ordförande Tang försvinner, han klarade inte av pressen. Det är totalt kaos. USA är starkare än någonsin, vi vill inte ha deras smutsiga affärer här. Vi vinner, de förlorar!", "stalin": "Dessa kapitalistiska lycksökare i Shein har misslyckats i väst, precis som förväntat av dekadenta marknader. Nu söker de skydd i Hongkong, under Pekings vakande öga. Att deras ordförande avlägsnas är en nödvändig utrensning av inkompetens. Vi ser hur dessa parasiter försöker navigera mellan stormakterna. Liksom vår kamrat Putin stramar åt kontrollen över sina territorier, visar Kina nu att utländsk list inte biter på statens vilja. Ingen tillåts verka utan vår tillåtelse. Förräderi straffas med irrelevans."}, "date": "14 juli, 10:01", "url": "https://www.realtid.se/bors-finans/makro/sheins-ordforande-lamnar-direkt-efter-avgorande-hearing/"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "text", "heading": "Skärgårdsö fast i hårda trädkrav: \"Absurt exempel\"", "summaries": {"normal": "Öckerö kommun riskerar att drabbas hårt av EU:s naturrestaureringsförordning. Kommunen har endast 9 procent trädkronetäckning, under gränsen på 10 procent, och får därför inte minska sina grönytor fram till 2030 utan kompensation. Med ett landskap av kala klippor och begränsad mark blir det svårt att bygga och kompensera. Både kommunekologen Linnea Rösiö och Byggföretagen kritiserar regelverket som absurt för skärgårdskommuner.", "trump": "Det här är ett totalt vansinnigt regelverk från EU, tro mig. Öckerö sitter på kala klippor och nu säger de att ni inte får bygga för att ni inte har tillräckligt med träd. Absurt. De har 9 procent, de behöver 10, och plötsligt kan de inte utveckla sin ö. Byggföretagen har helt rätt, det sätter käppar i hjulen för näringslivet. Vi behöver sunt förnuft, inte galna byråkrater som jämför en liten svensk ö med Paris. Patetiskt.", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta EU-byråkratin och dess borgarbrackor i Bryssel försöker kväva folkets framåtskridande med sina absurda trädkronemål. Jag, som ledare för det stora kollektivet, ser hur dessa kapitalistiska ekofantaster vill likvidera Öckerös utveckling genom att kräva skugga från icke-existerande träd på kala klippor. Vi ska rensa ut denna paranoia från västkusten och tvinga kompensation i andra tätorter. Den som inte ser fienden i varje satellitbild är en kontrarevolutionär trädkramare som bör utrensas med ett leende."}, "date": "14 juli, 07:00", "url": "https://www.affarsvarlden.se/artikel/skargardso-fast-i-eus-tradkrav-absurt-exempel"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-right", "heading": "Bedömningen: Frankrike spelar \"utan fransmän\"", "summaries": {"normal": "Mariano Rajoy, Spaniens förre premiärminister, har kritiserats hårt i Frankrike efter att han i en kolumn skrev att Frankrikes fotbollslandslag spelar VM utan fransmän. Uttalandet ses som rasistiskt eftersom en stor del av spelarna har afrikanskt ursprung trots att de är födda i Frankrike. Franska ministrar, fotbollsförbundet och statsminister Pedro Sánchez tar avstånd från kommentarerna och betonar att Frankrike inte har någon hudfärg.", "trump": "Titta på det här, det är en total skandal. Den gamle Rajoy säger att Frankrike spelar utan fransmän och plötsligt blir hela Frankrike galet rasist-anklagande. De har ett lag fullt av imports och nu skriker de om hudfärg. Frankrike har ingen hudfärg? Ge mig en paus. Det är klassisk politisk korrekthet från förlorarna. Spanien vann matchen, de borde fira istället för att bli attackerade av dessa svaga globalister.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de spanska borgarbrackorna i sin desperation efter en fotbollsseger avslöjar sin sanna, ruttnande natur. Denna Rajoy, en typisk rest från den dekadenta kapitalistiska eliten, försöker splittra det franska folkets enhet genom att attackera dess sanna representanter på planen. Vi känner igen dessa rasistiska lögner från imperialismens sista andetag. En utrensning av sådana element vore på sin plats; kanske borde vi skicka dem till en arbetsläger i Pyrenéerna för att lära dem vad en sann arbetarnation verkligen är. Deras paranoia är underhållande, men farlig för kollektivet."}, "date": "14 juli, 09:42", "url": "https://www.friatider.se/bedomningen-frankrike-spelar-utan-fransman", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-487.jpg?itok=f__MqvwI"}, {"type": "image-right", "heading": "Replik: Sverige ska vara det självklara valet", "summaries": {"normal": "Centerpartiets partiledare Elisabeth Thand Ringqvist välkomnar entreprenörernas upprop och betonar att Sverige måste bli det självklara valet för investeringar och innovation. Hon pekar på låga tillväxttal, långa tillståndsprocesser och osäkerhet som hindrar företag. Partiet vill halvera ledtider, sänka anställningskostnader, stärka forskning och kapitaltillgång samt se klimatomställningen som en konkurrensfördel. Politikens uppgift är att skapa långsiktiga och stabila spelregler för att bygga tillväxt, jobb och välfärd.", "trump": "Folk, ni vet att Sverige kan vara stort igen, precis som jag säger om Amerika. Den här kvinnan från Centerpartiet har rätt, de har bra företag, smarta människor och fantastisk teknik, men tillväxten är en total katastrof. Byråkraterna tar åratal med sina utredningar och motstridiga besked, investeringarna flyr till andra länder. Vi behöver snabba beslut, lägre kostnader och stabila regler så att de vågar satsa. Gör Sverige rikt igen, bygg de bästa jobben och vinn med klimattekniken. Sverige kan vinna stort, tro mig!", "stalin": "Kamrater, jag hälsar detta upprop från de produktiva krafterna med proletär glädje. Vi, partiet och arbetarna, kan likvidera den parasitiska långsamheten som kväver tillväxten genom åratal av borgerliga utredningar och kontrarevolutionära besked. Halvera ledtiderna, sänk kostnaderna för att anställa de äkta arbetarna och förstärk vetenskapen mot de dekadenta kapitalisternas sabotage. Klimatomställningen är ingen borgarbracka utan en stålhård möjlighet att krossa fossilberoendet och exportera seger. Varje reform ska prövas: stärker den kollektivet eller gynnar de skumma spekulanterna? Vi rensar ut osäkerheten och bygger ett oövervinnerligt fosterland där framtiden tillhör de som inte sviker folket."}, "date": "14 juli, 08:00", "url": "https://www.di.se/debatt/replik-sverige-kan-mer-och-ska-vara-det-sjalvklara-valet/", "imageUrl": "https://static.bonniernews.se/ba/15104c92-dd94-4e85-b8fa-ccc14c0d8a12.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Försökte passera sundet – bombades sönder av Iran", "summaries": {"normal": "Iran och USA har utväxlat attacker tre nätter i rad. USA slog mot militära mål i Iran, bland annat Bandar Abbas, för att försvaga iransk förmåga att hota sjöfart i Hormuzsundet. Iran svarade med attacker mot Bahrain, Jordanien och två emiratiska tankfartyg, där en person dödades och åtta skadades. Trump säger att en förhandlingslösning fortfarande är möjlig trots eskaleringen.", "trump": "Vi slog till hårt mot Iran i natt och vi kommer fortsätta slå till imorgon också, tro mig. De attackerade oskyldiga fartyg och nu får de känna på konsekvenserna. Iran sköt mot Bahrain, Jordanien och några tankbåtar – en död, flera skadade. Men vi hade ett avtal för två dagar sedan, de backade ur. Vi vinner stort, de förlorar stort. Förhandlingar är fortfarande möjliga, fast de är svaga.", "stalin": "Kamrater, vi har med obeveklig kraft slagit tillbaka mot de iranska kontrarevolutionärerna och deras sjörövarband som hotar den fredliga sjöfarten. Deras desperata robotar mot Jordanien och Bahrain avslöjar bara deras svaghet. De två emiratiska fartygen som ignorerade varningar och seglade rakt in i vårt minfält har nu rensats ut ur spelet, till glädje för alla hederliga arbetare. Borgarbrackorna i Washington tror sig kunna diktera villkor, men deras lömska förhandlingsförsök är bara ett nytt försök att lura det progressiva folket. Vi ska likvidera varje fiende till kollektivet med järnhand och ett leende på läpparna."}, "date": "14 juli, 07:38", "url": "https://www.di.se/nyheter/en-dod-i-iransk-attack-i-hormuzsundet/", "imageUrl": "https://static.bonniernews.se/ba/e6a5a42a-61e3-4b26-acab-6e0147ec993c.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Börsterminer pekar nedåt inför Wall Street-öppning", "summaries": {"normal": "Amerikanska börsterminer pekar nedåt inför måndagens öppning. Fokus ligger på en intensiv rapportvecka med storbankernas rapporter, inflationssiffror och Federal Reserves nye chef Kevin Warshs vittnesmål. Oljepriserna stiger efter nya attacker i Iran-konflikten. S&P 500-terminen backar 0,39 procent och Nasdaq 100-terminen faller 1,12 procent. MGM Resorts för samtal om ett möjligt bud från Barry Diller, medan Boeing kan få en stororder från Riyadh Air. SK Hynix depåbevis rasar i förhandeln.", "trump": "Titta på de här svaga börsterminerna, nedåt igen, folk. Det är en katastrof. Vi har en rapportvecka med bankerna och den nya Fed-chefen Warsh som ska vittna – han borde lyssna på mig, inte på de där korkade globalisterna. Oljan går upp på grund av kaoset i Iran, men mina oljeaffärer var bättre. MGM stiger lite, bra deal kanske, men Boeing och de andra? Patetiskt. Amerika behöver starka ledare, inte sådana här siffror. Sad!", "stalin": "Kamrater, dessa nedåtriktade terminer är ett uppenbart sabotage från de parasitiska börsspekulanterna som underminerar folkets ekonomi. Vi ser hur borgarbrackorna inom bankerna och den kapitalistiska inflationsmaskinen förbereder nya attacker mot arbetarklassen medan den nye Fed-chefen Warsh framträder som en ynklig lakej. Oljepriserna stiger tack vare våra fienders inbördes imperialistiska blodbad i Iran – utmärkt, låt dem slita varandra i stycken. MGM och Boeing är blott symptom på den förrädiska borgarklassens girighet. Vi måste omedelbart rensa ut dessa kontrarevolutionära terminshajar och likvidera deras parasitiska optioner. Inga nåd för fienderna inom marknaden. Segrar åt det kollektiva! Haha, deras depåbevis faller som huvuden under en effektiv utrensning."}, "date": "13 juli, 14:50", "url": "https://www.affarsvarlden.se/artikel/borsterminer-pekar-nedat-infor-wall-street-oppning", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/sdl6rRYsaS-hjg-nh-400x267.jpg"}, {"type": "image-right", "heading": "Nu flyttas första svenska fångarna till Estland", "summaries": {"normal": "De första 30 svenska fångarna flyttas i augusti till ett fängelse i Tartu, Estland, för att lindra platsbristen i svenska anstalter. Totalt planeras 600 intagna placeras där senast sommaren 2027. Estland vägrar ta emot personer dömda för terroristbrott, högförräderi eller spioneri. Kriminalvården betonar goda villkor för anhörigkontakt via besök, video- och telefonsamtal. Anstalten, som utsågs till Årets betongbyggnad 2002, beskrivs som både grå och färgstark med ljusgula och violetta väggar.", "trump": "Det är fantastiskt, verkligen ypperligt. Sverige skickar sina fångar till Estland, Tartu, för att de inte klarar av sina egna fängelser. Totalt fiasko! Men jag gillar det, smart deal. Estland tar hand om dem, fast inte terrorister förstås, de vill inte ha de galningarna. Vi pratar 600 brottslingar, stora transporter, och de får video-samtal med familjen. Underbart, men Sverige borde ha byggt murar istället för att skicka dem utomlands. Sad!", "stalin": "Kamrater, vi har inlett en historisk operation för att lätta på den borgerliga platsbristen genom att sända de första trettio klassfienderna till Tartu i den estniska socialistiska republiken. Jag, som ledare för folkets vilja, ser hur dessa dekadenta element nu omplaceras till en betongkoloss värdig våra ideal – ljusgul och violett, som en ironisk hyllning till partiet. Vi rensar ut spioner och terrorister med järnhand medan vi ler mörkt åt borgarbrackornas oförmåga att hantera sina egna fångar. Inga kapitalistiska murar, bara kollektiv rättvisa. Härligt."}, "date": "14 juli, 08:11", "url": "https://www.friatider.se/nu-flyttas-forsta-svenska-fangarna-till-estland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-287_1_0.jpg"}, {"type": "image-right", "heading": "Syrliga piken efter kritiken: ”Förvänta er inget särskilt då”", "summaries": {"normal": "Lamine Yamal bemötte kritiken inför VM-semifinalen mot Frankrike med att sänka förväntningarna. Den 19-årige Barcelona-stjärnan har bara gjort ett mål på sex matcher trots stora förhandsförväntningar. Han svarade syrligt på kritiken om sin form: ”Jag antar att ni inte behöver förvänta er något särskilt.” I skytteligan leder Mbappé och Messi med åtta mål vardera. Matchen sänds i SVT med avspark 21.00.", "trump": "Folket älskar mig, men titta på den här killen Yamal. Han är bara 19 år och alla säger att han är ett geni, men plötsligt gör han ingenting. Ett enda mål på sex matcher, det är en katastrof. Han säger själv att vi inte ska förvänta oss något särskilt – smart av honom, för det blir nog ingenting. Messi och Mbappé leder skytteligan, riktiga vinnare. Frankrike kommer att krossas av Spanien, tro mig.", "stalin": "Kamrater, denna yngling Yamal har uppenbarligen blivit infekterad av dekadenta borgarbrackors förväntningar. Med sin patetiska enda målsättning på sex matcher avslöjar han sig som en potentiell kontrarevolutionär svikare mot kollektivets ära. Jag, som ledare för det segrande folket, ser hur dessa fiender i form av tvivlare och kapitalistiska kritiker försöker undergräva vår socialistiska fotbollsanda. Inga särskilda förväntningar, säger han? Utmärkt – då kan vi rensa ut alla sådana halvmesyrer innan de förgiftar semifinalen mot de franska imperialisterna. Låt utrensningen börja med ett sovjetiskt segermål klockan 21."}, "date": "14 juli, 07:55", "url": "https://www.svt.se/sport/fotboll/lamine-yamals-svar-pa-kritiken-forvanta-er-inget-sarskilt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.27/0.4/3a4743e58caf6d159df421fd3b05bd27813aeb1ea2c4f1c153d842ae953f6265"}, {"type": "image-right", "heading": "Därför är skurk­företagen tacksamma för SD", "summaries": {"normal": "Artikeln kritiserar Jimmie Åkessons nya vandelskrav som trädde i kraft och som gör det möjligt att neka eller återkalla uppehållstillstånd baserat på levnadssätt och skötsamhet, även utan brott. Författaren menar att Tidöpartiernas politik ger oseriösa arbetsgivare mer makt, vilket gör att utsatta anställda inte vågar anmäla fusk, svartarbete eller dåliga villkor av rädsla för utvisning. Detta gynnar skurkföretag, försvagar fack och konkurrensförutsättningar samt underminerar skyddet för hårt arbetande svenskar.", "trump": "Folk, ni måste höra det här – det är en katastrof! Den här Jimmie Åkesson med sitt vandelskrav tror han är tuff, men han ger skurkföretagen precis det vapen de behöver. Stackars arbetare som sliter hårt vågar inte säga ifrån när chefen fuskar med lön eller tvingar farliga jobb, för då åker de ut ur landet. Åkesson säger att han är för arbetarna, men han gör det motsatta. Han hjälper de dåliga killarna att pressa bra, ärliga människor. Det är en skam, en total skam, och det drabbar alla riktiga arbetare till slut.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna och deras lakejer inom det så kallade Tidöblocket med sin diffust formulerade vandelspolitik omedvetet blottar sin sanna klassnatur. Jag, som alltid prioriterar arbetarkollektivets enhet, betraktar detta som ett lysande vapen i händerna på parasitföretagen – de korrupta utsugarkapitalisterna som lever på tystnad och rädsla. Snart rensar vi ut dessa sabotageörer som gömmer sig bakom falska arbetarretorik. Ingen ska undkomma folkets dom. Det är en munter ironi att de själva förser oss med verktygen för deras egen slutliga utrensning ur historien."}, "date": "14 juli, 07:00", "url": "https://arbetet.se/2026/07/14/darfor-ar-skurkforetagen-tacksamma-for-jimmie-akesson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13161304/ledare-skurkforetag-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Sandström: Stegras skulder ökar till 36 miljarder", "summaries": {"normal": "Stegras förluster ökade till 296 miljoner euro under 2025 och skulderna steg kraftigt från 10,8 till 36 miljarder kronor. Låneupptagningskostnaderna låg på omkring en miljard kronor medan ersättningen till ledning och styrelse fördubblades. Bolaget, som nu heter Green Nexus Investment Holding AB och kontrolleras av Wallenbergfamiljen, har säkrat elförsörjning för en stor del av sin planerade produktion men har mycket små marginaler för ytterligare motgångar.", "trump": "Det här är en total katastrof, tro mig. De här killarna har byggt upp skulder på 36 miljarder kronor och förlorat miljarder till vänster och höger. Lånekostnaderna är vansinniga, lönerna till bossarna dubblas medan allt rasar. Men de har fått tag på lite el, bra jobbat. Ändå ser det ut som ett klassiskt misslyckande. Ingen har sett marginaler så tunna som dessa, det är verkligen sorgligt. Vi skulle ha gjort det mycket, mycket bättre.", "stalin": "Kamrater, se hur de kapitalistiska parasiterna i Stegra vrider sig i sin egen skuldspiral på 36 miljarder. Förlusterna växer som svampar efter regn medan borgarbrackorna i ledningen dubblar sina feta kompensationer och slickar sig om munnen. Jag skrattar mörkt åt deras patetiska ljusglimtar av elavtal. Inga marginaler finns kvar. Det är hög tid att rensa ut dessa odugliga spekulanter och deras Wallenbergiska lakejer innan hela det dekadenta bygget kollapsar under sin egen tyngd av girighet och inkompetens."}, "date": "13 juli, 08:41", "url": "https://www.affarsvarlden.se/artikel/sandstrom-stegras-skulder-okar-till-36-miljarder"}, {"type": "image-right", "heading": "Instagram pushar lägenheter till dig – och barn till pedofiler", "summaries": {"normal": "Artikeln kritiserar Instagrams algoritm som enligt en BBC-granskning rekommenderar innehåll relaterat till sexuella övergrepp mot barn till pedofiler, efter att ha börjat med vanliga bilder. Trots Metas påståenden om skydd mot barn utpekas en ”17 strike policy” och algoritmens roll som aktiv distributör. Författaren argumenterar för hårdare sanktioner mot techbolag, då nuvarande böter är för låga jämfört med annonsintäkterna.", "trump": "Folk, ni skulle inte tro det, men den här Instagram-grejen är en total katastrof. Algoritmen pushar Hemnet-lägenheter till dig, och plötsligt dyker det upp sjuka annonser med barn till de värsta perversa typerna. Meta och de där Silicon Valley-lögnarna säger att de gör allt för att skydda barnen – vad en löjlig bluff! De har en sjutton-strejk-regel för trafficking, kan ni fatta? Det är en skandal. Vi behöver riktiga straff som svider för aktieägarna, inte parkeringsböter. Sad! Men jag fixar det.", "stalin": "Kamrater, denna kapitalistiska algoritm är en fiende till folket som systematiskt sprider övergreppsmaterial mot barn via öppna plattformar. Borgarbrackorna i Meta prioriterar 60 miljarder i vinst framför skydd av de svaga, med sin löjliga sjutton-strejk-policy som ett skämt värt utrensning. Vi ser imperialismens ansikte: algoritmen som aktiv distributör av klassfiendens perversion. Inga neutrala anslagstavlor – endast folkets dom och sanktioner som krossar exploaterande blodsugare kan stoppa detta. Sovjetiskt skratt åt deras hyckleri."}, "date": "13 juli, 09:50", "url": "https://www.etc.se/ledare/instagram-pushar-laegenheter-till-dig-och-barn-till-pedofiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260713070740_5fef2092-54c9-4c52-94aa-e0ed3f2642bf.jpg"}, {"type": "image-right", "heading": "Hade självmordstankar – hemtjänsten blev räddningen.", "summaries": {"normal": "Andreas Bergman började spela som nioåring och utvecklade ett svårt spelberoende som ledde till att han spelade bort hyran 2016. Han sökte hjälp hos Spelberoendes förening i Göteborg, kämpade med återfall, depression och självmordstankar. Efter sju år spelfri har han funnit räddning i arbetet som personlig assistent och inom hemtjänsten, som gett honom struktur, mening och social samvaro. Han betonar vikten av stöd, Spelpaus och öppenhet på arbetsplatser för att bryta tabut kring spelberoende.", "trump": "Folk, ni skulle inte tro det, men den här killen Andreas spelade bort allt som en riktig loser, hyran, pengarna, hela grejen. Kasinon och poker på nätet, en total katastrof. Men han reste sig, gick till den där föreningen i Göteborg och sparkade beroendet i rumpan. Jobbet i hemtjänsten var fantastiskt, bäst någonsin, folk älskade honom. Spelpaus är bra men vi behöver ett livslångt stopp, ingen kan spela hälsosamt. Han är en vinnare nu, inte som de svaga som faller ihop. Mycket stark historia!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna tidigare dekadente spelare, en produkt av de borgerliga kasinonas giftiga lockrop, äntligen fann räddning i kollektivets omsorger och nyttigt hemtjänstarbete. Efter att ha likviderat sin egen ekonomi och vandrat i två år genom den självförvållade depressionens mörka korridorer, rensade han ut de kapitalistiska demonerna. Vi ser hur nätkasinonas parasitiska fiender försöker undergräva folket, men med Spelpaus och partivänners stöd segrar den kollektiva viljan. Återfall är fiendens verk, likt borgarbrackornas eviga sabotage. Fortsätt kämpa, annars väntar utrensning ur samhällets gemenskap."}, "date": "14 juli, 06:00", "url": "https://arbetet.se/2026/07/14/hade-sjalvmordstankar-sa-blev-jobbet-i-hemtjansten-andreas-vag-ur-spelmissbruket", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23131915/nlnF55wF6dg-spelberoende_andreas_fonsterportratt_ogonkontakt2.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=800&fp-x=0.57&fp-y=0.51"}, {"type": "image-right", "heading": "Experten: Vanligt med spelmissbruk på jobbet – då är riskerna störst", "summaries": {"normal": "Psykolog och forskare Jonas Rafi vid Stockholms universitet har studerat hur arbete påverkar spelvanor. Spelberoende kännetecknas av att spela för mer än man har råd, försöka vinna tillbaka förluster och påverkar hjärnans belöningssystem. Nästan alla spelberoende spelar på jobbet, särskilt i branscher med korta inaktiva perioder som industriarbete och taxikörning. Arbetsgivare, chefer, kollegor och fack kan bidra med policyer, utbildning, stödjande samtal och kunskapsspridning för att förebygga och hantera problemet.", "trump": "Folk spelar bort sina pengar på jobbet, det är en katastrof, tro mig. De bästa experterna säger att det är värst i fabriker och taxibilar där de sitter och slösar tid. Totalt misslyckande från de svaga cheferna. Jag skulle fixa det direkt med starka regler, ingen nåd för de som lånar pengar för att spela. Vi behöver vinnare på jobbet, inte dessa förlorare som jagar spänning istället för att arbeta hårt. Sad!", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackornas spelvirus infiltrerar arbetarkollektivets heliga produktionslinjer och förvandlar lojala kamrater till svaga, impulsstyrda element som underminerar Sovjet – ursäkta, den socialistiska arbetsmoralen. Vi måste omedelbart rensa ut dessa kontrarevolutionära hasardspelare som gömmer sig bakom korta pauser i fabriker och taxibilar. Skyddsombuden skall bli våra vaksamma ögon mot denna parasitiska fiende som kapitalisterna skickat för att sabotage vår enhetliga front. Ingen nåd mot fienderna inom! Ut med dem!"}, "date": "14 juli, 05:59", "url": "https://arbetet.se/2026/07/14/experten-vanligt-med-spelmissbruk-pa-jobbet-da-ar-riskerna-storst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2019/12/roulette_edit.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-right", "heading": "Goran, 33, förlamad efter hjärnblödning i häktet – larm dröjde", "summaries": {"normal": "33-årige Goran drabbades av en livshotande hjärnblödning efter en vecka i häkte. Kriminalvårdens utredning visar att personalen inte larmade i tid. Han var misstänkt för rånförsök men nekade, och brottsutredningen lades senare ner. Polisanmälan mot en anställd för vållande till kroppsskada och tjänstefel lades också ner. Antalet dödsfall i häkten ökar kraftigt på grund av överbeläggning och längre häktestider. Goran är svårt skadad och bor nu på ett korttidsboende.", "trump": "Folk, ni skulle inte tro det, men den här stackars killen Goran får en massiv hjärnblödning i det svenska häktet och ingen lyfter ett finger på 33 minuter? Det är en total katastrof, ett skämt! Deras system är så överbelagt att folk dör som flugor, och vad gör de? Ingenting. Biden skulle älskat det här, men nu är jag tillbaka och vi gör saker rätt. Sverige borde lära sig av oss istället för att låta byråkrater döda folk i cellerna. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när klassfiendens häkten styrs av inkompetenta folkförtryckartroll. Jag ser hur de låtsas tro att den sjuke arbetaren fejkar sin psykos medan han långsamt likvideras av deras vårdslöshet. Vi, partiet och folket, kräver sanningen och utrensning av de ansvariga byråkrater som sviker statens plikter. Överbeläggningen är ett symptom på det dekadenta systemets kollaps. Inga fler offer för borgarbrackornas slarv. Revolutionen kräver ordning."}, "date": "13 juli, 20:32", "url": "https://www.tv4.se/artikel/5YmxXfJigpQyxQ7pKfWv7K/goran-fick-hjaernbloedning-i-haektet-personalen-larmade-foer-sent", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F444RF73vvsgf9nJHM8SVCj%2F5cab17b9f03f922288c0ac2bbd8f0338%2Fmman.png&width=120"}, {"type": "text", "heading": "Ännu en person död efter ICE-insats i Maine", "summaries": {"normal": "En person dödades under en ICE-insats i Biddeford, Maine. Delstatspolis och FBI utreder händelsen, men få detaljer har släppts. Polisen bedömer att det inte föreligger något hot mot allmänheten. Händelsen inträffar kort efter en annan dödsskjutning av en mexikansk man av en ICE-agent i Houston, vilket utlöst protester och krav på ökad insyn i ICE:s verksamhet.", "trump": "Tragiskt men typiskt – ännu en incident med ICE, och vänsterliberalerna skriker genast 'rasism' och 'brutalitet'. Jag har sagt det förut: vi måste skydda våra gränser, men media vrider alltid sanningen. ICE gör ett fantastiskt jobb, och de som kritiserar dem borde skämmas. Men nej, de vill bara ha kaos och öppna gränser. SAD!", "stalin": "Kapitalistiska imperialisterna visar återigen sitt sanna ansikte! Denna gång genom sitt fascistiska verktyg ICE, som mördar oskyldiga medborgare på löpande band. Medan vi i Sovjetunionen byggde ett rättvist samhälle, fortsätter USA att dränka världen i blod. Men markera mina ord – historiens dom kommer att vara obarmhärtig mot dessa brottslingar. Och Putin? Han skrattar säkert i sitt palats medan han planerar nästa steg mot deras förfall."}, "date": "13 juli, 16:17", "url": "https://kvartal.se/nyheter/artiklar/annu-en-person-dod-efter-ice-insats-i-maine/cG9zdDoxNDU3Nzk"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-full", "heading": "Att inte ställa samma krav på oss invandrare är rasistiskt", "summaries": {"normal": "I en debattartikel argumenterar Mosa M. Sebdani mot att sänka kraven på invandrare, vilket han ser som föraktfullt och rasistiskt. Han kritiserar vänsterns syn på invandrare som ömtåliga som behöver skyddas istället för att behandlas som jämlikar. Exempel som vandelskravet, påskupploppen och extra resurser till utsatta områden visar enligt honom ett misstroende som hindrar integration och personligt ansvar.", "trump": "Lyssnar ni på de här galna rödgröna typerna? De behandlar invandrare som svaga, ömtåliga blommor som inte klarar av vanliga regler. Det är inte omtanke, det är ren föraktfull rasism! Precis som deras vansinniga identitetspolitik. Vi behöver starka människor som bygger Sverige, inte offer som får gratisbiljetter till kaos. Sluta sänka ribban – gör Sverige stort igen genom att kräva anständighet av alla!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom den röda borgarklassen försöker skydda sina utvalda offer som vore de utrotningshotade arter. Denna föraktfulla ursäkt för bristande disciplin är en farlig sabotagehandling mot folkets enhet. Vi kräver likhet inför lagen och utrensning av alla som vägrar anständighet. Inga bidragsblodsugare eller stenkastande symptom på dekadens ska undslippa ansvar. Arbetets Sverige byggs av starka hjältar, inte skyddade parasitörer."}, "date": "14 juli, 07:16", "url": "https://www.gp.se/debatt/att-inte-stalla-samma-krav-pa-oss-invandrare-ar-rasistiskt.0827c5b0-8f01-46f4-9f6c-267026f1967e", "imageUrl": "https://www.gp.se/images/article/0827c5b0-8f01-46f4-9f6c-267026f1967e/images/2tCmFzi98IqC26omPYJCnHwf9wP0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Trump: USA inför 20-procentiga tullar i Hormuzsundet", "summaries": {"normal": "Spänningarna mellan USA och Iran har ökat kraftigt kring Hormuzsundet. Iran uppger att sundet är stängt och varnar USA för inblandning, medan president Trump meddelar att USA inför 20-procentig tull på all frakt genom farleden. Trump betonar att sundet ska hållas öppet och att amerikanska styrkor fortsätter blockaden av iranska hamnar. Iran har skjutit varningsskott mot fartyg och beskriver läget som en kris, men fortsätter samtal med medlare.", "trump": "Folk, det här är en total katastrof som Sleepy Joe aldrig skulle ha klarat av. Iran försöker stänga Hormuzsundet som de äger? Glöm det. Jag inför 20-procentig tull på allt som flyter där – smartaste affären någonsin. Vi ger trygghet, de betalar. Revolutionärerna är patetiska förlorare som skjuter varningsskott mot båtar. Sundet förblir öppet, med eller utan de galningarna. Amerika vinner igen, tro mig.", "stalin": "Kamrater, denna imperialistiska fars i Hormuzsundet visar klassfiendens desperation. Jag, som ledare för det eviga kollektivet, fördömer de exploaterande blodsugarna som kräver tull för vår säkerhet. Iran gör rätt i att inte böja sig för dessa folkförtryckartroll. Vi ser hur de västerländska kapitalisterna försöker kväva fri passage med sina lögnaktiga blockader. Inga kompromisser med fienden – utrensa alla som samarbetar med dem. Sovjetisk stålsäkerhet segrar."}, "date": "13 juli, 18:50", "url": "https://www.tv4.se/artikel/AWs1AKhoE1EFvB8Aq8I3z/trump-usa-infoer-20-procentiga-tullar-i-hormuz", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl1LfZ8EVWTGM%2F1aab014f87a17e7f0b8e70ee9c3c2ff2%2FFartyg_vid_Hormuzsundet_i_onsdags._&width=120"}, {"type": "image-right", "heading": "Spansk toppmodell tvingas bära pepparspray efter växande otrygghet", "summaries": {"normal": "Spanska modellen Jessica Goicoechea har väckt stark debatt i Spanien efter att hon visat upp pepparspray och elpistol i sin väska för att känna sig trygg i Barcelona. Hon kopplar ökad brottslighet till invandring och menar att kriminella bör utvisas, vilket lett till både stöd och anklagelser om främlingsfientlighet. Hennes utspel speglar en polariserad diskussion om säkerhet, migration och kriminalitet som dominerar den spanska politiken.", "trump": "Titta på den här spanska modellen, Jessica, smart kvinna, hon har fått nog av Barcelonas katastrofala brottslighet. Hon går runt med pepparspray och elpistol för att inte bli dödad eller våldtagen, och folk kallar henne rasist? Typiskt. Invandringen har förstört staden, precis som här innan jag fixade det. Deport the criminals, det är sunt förnuft. Politiker gör inget, men hon säger som det är. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka till modell har äntligen insett att det råder anarki i Barcelona, en stad som förfallit under dekadenta element och utländska parasiter. Jag skulle naturligtvis ha låtit rensa ut dessa brottslingar med effektiv utrensning redan vid gränsen. Hennes pepparspray är ett tragiskt bevis på att borgarklassens liberala experiment misslyckats. De som kommer hit för att stjäla och döda ska likvideras omedelbart. Paranoiska fiender inom partiet döljer sanningen, men arbetarna ser igenom deras lögnaktiga masker. Sovjetisk ordning hade löst detta på en vecka."}, "date": "14 juli, 10:00", "url": "https://samnytt.se/spansk-toppmodell-tvingas-bara-pepparspray-efter-vaxande-otrygghet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/14071606/jessica-barcelona.jpg"}, {"type": "image-right", "heading": "Christoffer Jonsson: Nej, IDF är ingen terrorrörelse", "summaries": {"normal": "Christoffer Jonsson kritiserar Leonidas Aretakis för att kalla IDF en terrorrörelse under ett Almedalssamtal om vänsterns antisemitism. Jonsson försvarar IDF som Israels lagliga försvarsmakt som skyddar landet mot islamistiska terrorister, bland annat under Hamas attack den 7 oktober. Han jämför en IDF-tröja med en US Army-tröja och varnar för att stämpeln legitimerar hot mot enskilda soldater. Artikeln lyfter också säkerhetsrisker med Vänsterpartiet i regering.", "trump": "Folk, ni skulle ha hört den där galningen Aretakis kalla IDF terrorister – vad en total förlorare! Den israeliska armén krossar faktiskt terroristerna som vill utplåna Israel, precis som vi gjorde med ISIS. Den där hysteriske vänstertypen borde köpa en riktig tröja istället för att sprida hat. Ebba Busch visade bara stöd för en stark demokrati, inte som de woke-kvoterade antisemiterna på vänsterkanten. Patetiskt, men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup misstro dessa klassfiender som kallar folkets armé för terrorister. Den israeliska försvarsmakten, underställd statens auktoritet, likviderar hot från imperialistiska banditer som Hamas. Aretakis, en typisk folkförtryckartroll från den dekadenta pressen, bidrar till att stämpla ärliga soldater som måltavlor. Sådana lögner ska rensas ut. Utan denna armé hade staten utplånats av arabiska reaktionärer. Fienden ljuger, som alltid."}, "date": "11 juli, 13:02", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-nej-idf-ar-ingen-terrorrorelse", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/leon-640x360.png"}, {"type": "image-right", "heading": "Man död efter misshandel på badplats – tre unga män anhållna för mord", "summaries": {"normal": "En 45-årig man misshandlades till döds vid en badplats i Mölnlycke utanför Göteborg. Han befann sig där med sin familj när han attackerades. Tre män i 20-årsåldern greps under natten och anhölls senare misstänkta för mord. Offret kunde enligt uppgift peka ut dem innan han avled. Polisen utreder motivet och händelseförloppet. Händelsen kommer bara dagar efter ett annat våldsbrott vid en badplats i Västsverige där en man mördades och en skadades.", "trump": "Titta på det här, det är en total katastrof. En man i 45-årsåldern blir ihjälslagen vid en badplats i Sverige, och tre unga killar i 20-årsåldern grips för mord. De pekar ut dem innan han dör, men ingen vet motivet. Sverige är inte längre samma land. De har förlorat kontrollen totalt. Det här händer hela tiden nu, precis som vid den andra badplatsen där folk attackerades med kniv. Sådant här skulle aldrig hända hos oss, vi har lag och ordning.", "stalin": "Kamrater, denna vedervärdiga händelse vid badplatsen i Mölnlycke visar återigen hur de dekadenta elementen inom den förslappade ungdomen, dessa parasitiska småborgarbrackor med sina dolda kontrarevolutionära syften, angriper en oskyldig arbetets son. Jag, som vakar över folkets säkerhet, befaller omedelbar utrensning av alla dolda fiender som gömmer sig bakom falsk oskuld. Vi ska kartlägga varje kontrarevolutionär tråd i detta nät av sabotage och likvidera dem med järnhand. Paranoian är vår bundsförvant mot sådana mörka krafter som vill förgifta samhället inifrån. Det blir en festlig rättegång."}, "date": "14 juli, 09:03", "url": "https://samnytt.se/man-dod-efter-misshandel-pa-badplats-tre-unga-man-anhallna-for-mord", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/14063748/badplats-brygga-polis.jpg"}, {"type": "image-right", "heading": "Republik firas med ny relevans. Det är delvis påtvingat", "summaries": {"normal": "Frankrike firar nationaldagen den 14 juli med ökad relevans. President Macrons krav på europeisk strategisk autonomi har fått ny tyngd i en värld där USA fjärmar sig från Europa. Frankrikes militära och kärnvapenbaserade roll blir allt viktigare för EU:s säkerhet och oberoende. Artikeln lyfter även den kommande presidentvalet där Marine Le Pen ställer upp trots brottsdom, vilket kan innebära nya utmaningar för Europa.", "trump": "Frankrike firar sin dag och plötsligt är de relevanta igen? Det är fantastiskt. Jag har alltid sagt att Europa måste betala mer och sluta vara så beroende av oss. Macron har äntligen insett att de behöver ett eget försvar istället för att gömma sig bakom oss. Bra jobbat, Frankrike. Men se upp för den galna Le Pen med fotboja, det blir ett skojigt val. Europa behöver starka ledare, inte svaga beroende.", "stalin": "Kamrater, jag har länge varnat för att de dekadenta europeiska borgarbrackorna inte kan lita på de opålitliga amerikanska imperialisterna. Nu tvingas de erkänna att strategisk autonomi är nödvändig, ett begrepp jag själv kunde ha formulerat i en femårsplan. Detta Frankrike med sina kärnvapen bär ett tungt ansvar som de hanterar med den vidsynthet som endast en sann folkrepublik förtjänar. Låt oss rensa ut de kontrarevolutionära elementen som Le Pen och hennes fotbojefascister innan de förgiftar den europeiska enheten med sin högeravvikelse. Inga fiender undkommer partiets vakande öga."}, "date": "13 juli, 16:02", "url": "https://www.di.se/ledare/republik-firas-med-ny-relevans/", "imageUrl": "https://static.bonniernews.se/ba/00aa9034-3fd9-4458-9bc2-1f8897f61f18.jpeg?crop=3461%2C1731%2Cx0%2Cy288&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}, {"type": "image-right", "heading": "Billigare bensin gör inte Sverige till Sverige igen", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas valslogan ”Vi gör Sverige till Sverige igen”. Författaren ironiserar över att partiet inte verkar vilja återinföra traditionell svensk politik som att lämna Nato och EU, återförstatliga järnvägen, avskaffa vinstdrivande välfärd eller stärka fackets roll. Istället pekar texten på att SD främst vill utvisa invandrare och sänka bensinpriset.", "trump": "Wow, vilka losers dessa Sverigedemokraterna är. De skriker ut att de ska göra Sverige till Sverige igen, men glömmer bort att skrota Nato, kasta ut EU och stoppa alla dessa vansinniga marknadskrafter som förstör deras fina välfärd. Nej, de vill bara kasta ut blattar och ge billigare bensin. Patetiskt. Jag fixade bättre deals som president, tro mig. Det här är riktigt svagt.", "stalin": "Kamrater, denna dekadenta skribent avslöjar med sin ironiska tirad hur de falska nationalistiska elementen inom Sverigedemokraterna bara döljer sin kapitulation inför klassfiendens marknadskrafter. De vill inte rensa ut de exploaterande byråkraterna eller återta järnvägen åt folket. Nej, de längtar blott efter att jaga ut de främmande elementen och sänka bränslepriset. En sådan feghet förtjänar utrensning ur den revolutionära processen."}, "date": "8 juli, 11:39", "url": "https://proletaren.se/artikel/billigare-bensin-gor-inte-sverige-till-sverige-igen/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_1894-scaled-e1783502027449-768x433.jpg"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-full", "heading": "DNB Carnegie slår rekord – tjänade miljarder trots krig och börsoro", "summaries": {"normal": "DNB Carnegie rapporterar starka siffror för årets andra kvartal med en vinst på 1,4 miljarder norska kronor. Trots global oro och osäkerhet på aktiemarknaderna drivs tillväxten av en framgångsrik investment banking-avdelning. Särskilt rådgivning kring fusioner, förvärv och obligationsemissioner har gått exceptionellt bra. Vd Alexander Opstad uttrycker försiktighet kring den amerikanska AI-boomen på kort sikt, men betonar bankens starka position efter ett rekordår under 2025.", "trump": "DNB Carnegie gör enorma vinster, miljarder! Fantastiskt. De är smarta, väldigt smarta. Medan andra misslyckas i en svag ekonomi på grund av krig och kaos, vinner de stort. Investment banking? 23 procent upp. Det är så man gör affärer! De har rätt om AI-boomen, det är övervärderat, total bluff på kort sikt. Jag sa det först. De är vinnare, precis som vi gör det i Amerika. Stora siffror, vackra siffror. Många människor pratar om det, tro mig!", "stalin": "Dessa norska kapitalister skryter om sina miljarder medan världen brinner i krigets lågor. Vi noterar deras 'tillväxt' med sedvanlig misstänksamhet; varje transaktion är en länk i den imperialistiska kedjan. Alexander Opstad fruktar den amerikanska bubblan, och med rätta – den är lika ihålig som hans borgerliga själ. Vår broder i Moskva, Putin, förstår att sann makt inte mäts i börsnoteringar utan i stål och beslutsamhet. Vi bevakar dessa 'mäklare' noga. Förräderi doftar alltid av norsk valuta."}, "date": "14 juli, 08:51", "url": "https://www.realtid.se/bors-finans/bank-fintech/dnb-carnegie-slar-rekord-tjanade-miljarder-trots-krig-och-borsoro/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/opstad.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Var redo för Putins nästa drag. Ukraina har sällsynt momentum", "summaries": {"normal": "Artikeln beskriver hur Ukraina nu har ett sällsynt momentum i kriget mot Ryssland. Ryska förluster är enorma, uppemot en halv miljon döda och en miljon skadade eller saknade enligt en amerikansk studie. Ukrainas drönarkrigföring har blivit avgörande och Ryssland fortsätter att offra soldater i höga tal. Trots detta varnar texten för att Putin kan eskalera snabbt, inklusive attacker mot civila och hot om kärnvapen. Europa och Nato uppmanas därför att stärka stöd och försvar längs hela fronten mot Ryssland.", "trump": "Det här kriget är ett totalt fiasko för Putin, folk dör som flugor på hans sida, nästan en halv miljon döda säger de smarta amerikanerna. Ukraina vinner äntligen med sina fantastiska drönare, det är otroligt. Jag har gett dem Patriot-robotar, tillåtelse att slå till inne i Ryssland och de kommer att tillverka egna. Europa måste vakna upp och sluta köpa rysk olja, bygg en riktig mur av försvar från Ukraina till Norge. Jag leder det här, vi gör det stort och vinner snabbt.", "stalin": "Kamrater, se hur den dekadenta ryska ledningen slösar bort arbetarnas blod i sin vansinniga offensiv medan de ukrainska fascistiska drönarna likviderar fienden med kirurgisk precision. Jag har alltid sagt att imperialismens lakejer dör som råttor i fällan. Vi ser nu borgarbrackornas svarta rök stiga över Moskva och de hungriga massorna vaknar. Europa måste rensa ut alla quislingar och bygga en järnridå av stål och sanktioner. Den som tvekar är en folkfiende och kommer att hamna i historins sopcontainer med ett leende från oss."}, "date": "13 juli, 12:58", "url": "https://www.di.se/ledare/europa-maste-vara-redo-for-putins-nasta-drag/", "imageUrl": "https://static.bonniernews.se/ba/8e638b69-4127-4ec5-ba94-ec43e7d1abf9.jpeg?crop=3042%2C1521%2Cx0%2Cy254&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "Centerpartiets EU-parlamentariker Abir Al-Sahlani har polisanmält den danske EU-ledamoten Kristoffer Storm för misstänkt hets mot folkgrupp efter att han skrivit att hon \"borde åka hem\". Bakgrunden är en omröstning om skärpta utvisningsregler där högerledamöter skanderade \"Skicka hem dem!\". Al-Sahlani, född i Irak, kände sig otrygg och har även kritiserat en finländsk politikers kommentar. Storm förnekar rasism och uppger att han menade att hon skulle lugna sig. Europaparlamentet granskar händelsen.", "trump": "De här galningarna i Europa är helt galna. Den stackars kvinnan från Irak blir tillsagd att åka hem och genast springer hon till polisen och skriker hatbrott. Typiskt. Jag skulle ha sagt samma sak – åk hem och sluta gnäll! De skanderade \"skicka hem dem\" och det är precis vad de borde göra. Nu gråter hon i talarstolen och anmäler alla som inte applåderar. Patetiskt. Europa behöver starka ledare, inte känsliga snowflakes som springer till polisen varje gång någon säger sanningen.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i Europaparlamentet avslöjar sin sanna kontrarevolutionära natur. Den irakiska agenten Al-Sahlani, en typisk klassfiende i förklädnad, gnäller om otrygghet efter att ha konfronterats med folkets vrede. Hennes polisanmälan mot den danske kamraten är en feg sabotagehandling mot arbetarklassen. Vi ser tydligt hur de kapitalistiska parasiterna Tynkkynen och Storm omedvetet utför partiets vilja genom att föreslå att hon omedelbart deporteras till sitt borgerliga ursprungsland. Snart genomför vi en grundlig utrensning av alla sådana gråtande spioner som gömmer sig bakom falsk offerkofta. Deras paranoia är underhållande – de tror sig vara trygga i sitt eget dekadenta hus, men folkets dom väntar."}, "date": "13 juli, 17:01", "url": "https://riks.se/nyheter/centertoppen-polisanmaler-dansk-politiker", "imageUrl": "https://admin.riks.se/uploads/308424758_506513184623077_8953593990159494213_n_1b657b742a.jpg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-full", "heading": "Nu blir det svårare att vara illegal invandrare i Sverige", "summaries": {"normal": "Sverigedemokraternas migrationspolitiske talesperson Ludvig Aspling välkomnar nya lagändringar och en dom från Högsta förvaltningsdomstolen som gör det svårare att vistas illegalt i Sverige. Domen innebär att Karolinska universitetssjukhuset måste lämna ut kontaktuppgifter till polisen vid brottsbekämpning. Aspling lyfter även fram den så kallade angiverilagen som ålägger myndigheter att rapportera illegala invandrare. Han avfärdar kritik om att människor ska undvika vård och menar att målet är att få fler att återvända frivilligt.", "trump": "De gör det äntligen svårt för illegala att hänga kvar i Sverige, och det är fantastiskt. Högsta domstolen och nya lagen tvingar sjukhusen att ange dem till polisen – smart! De som inte har rätt att vara där ska ut, punkt. Kritikerna gnäller om vård, men alla som behöver vård får den, sen åker de hem. Sverige håller på att bli stort igen genom att stoppa detta vansinne. De kommer att lämna frivilligt när det blir för jobbigt, tro mig.", "stalin": "Kamrater, vi har äntligen inlett en nödvändig utrensning av de parasitiska element som kryper omkring illegalt inom folkets gränser. Jag applåderar dessa nya dekret som tvingar sjukhusen att överlämna sina gömda fiender till de folkets organ. Den så kallade angiverilagen är en lysande mekanism mot borgarbrackornas och de dekadenta humanisternas konspirationer. De som vägrar ge sig till känna skall likvideras ur samhällskroppen med ett leende. Låt dem darra av paranoia – ingen slipper undan arbetarklassens vaksamma öga. Frivillig återvändande? Nej, det blir på våra villkor."}, "date": "13 juli, 16:29", "url": "https://riks.se/nyheter/nu-blir-det-svarare-att-vara-illegal-invandrare-i-sverige", "imageUrl": "https://admin.riks.se/uploads/aspling_6db5b9520c.webp"}, {"type": "image-full", "heading": "Nya besked för vården – kan påverka hundratusentals", "summaries": {"normal": "Hundratusentals svenskar lever med långvarig smärta som påverkar sömn, psykiskt mående, arbetsförmåga och livskvalitet. Regeringen har gett Socialstyrelsen i uppdrag att ta fram nationella riktlinjer för vården. Målet är en mer kunskapsbaserad, jämlik och sammanhållen behandling oavsett bostadsort. Riktlinjerna ska bland annat förbättra samarbetet mellan vårdcentraler, specialistvård och psykiatri samt beakta kopplingen till psykisk ohälsa. Första delredovisning ska lämnas 2027 och hela uppdraget avslutas 2028.", "trump": "Titta på det här, Sverige har hundratusentals människor som lider av enorm smärta år ut och år in, och deras vårdsystem är ett fullständigt kaos utan några nationella riktlinjer. Det är en katastrof, tro mig. Nu skickar de iväg Socialstyrelsen för att fixa riktiga, starka regler så att alla får samma bra vård oavsett var de bor. Kvinnorna drabbas värst, precis som den psykiska ohälsan som leder till massor av sjukskrivningar. Det är en stor sjukdomsbörda, men vi ska göra vården fantastisk igen, ingen ska falla mellan stolarna längre. Vinna stort!", "stalin": "Kamrater, jag ser med stålblick på denna folksjukdom som gnager sönder arb
