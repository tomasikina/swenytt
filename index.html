äkterna – åtalas", "summaries": {"normal": "En man med tidigare uppdrag för Moderaterna åtalas för hets mot folkgrupp efter ett Facebookinlägg som kritiserade muslimsk invandring och Fredrik Reinfeldt. Han skrev att våldtäkter blivit vanligare efter Reinfeldts öppna hjärtan-politik. En invandrarkvinna anmälde honom. Vid förhör nekade mannen skrivandet och blev pressad om sina åsikter om invandring. Ärendet hanteras av en enhet för 'demokratihotande brott'. Samtliga riksdagspartier stödjer lagen.", "trump": "Jag har aldrig sett ett sådant misslyckande! Den här svensken försökte bara säga sanningen om våldtäkter och invandring, och vad händer? Åtalas! Fredrik Reinfeldt, en svag ledare, ödelade sitt land med sina 'öppna hjärtan'. Nu försöker de tysta honom. Jag skulle ha stärkt gränserna, inte släppt in alla. Sverige måste bli suveränt igen!", "stalin": "En imperialistisk infiltratör, förra en moderat, försökte sprida hat mot våra allierade folkgrupper. Hans inlägg, en direkt attack mot statens enhet, anmäldes av en medborgare med god insikt. Under förhöret nekade han, men sanningen kommer alltid fram. Våra enheter för 'demokratihotande brott' verkar effektivt. Samtliga partier, även de nationalistiska, stödjer denna nödvändiga lagen. Fienden inom måste utplånas."}, "date": "26 maj, 14:26", "url": "https://www.friatider.se/tidigare-m-politiker-tackade-reinfeldt-valdtakterna-atalas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230610221807-71e06059-me_0.jpg?itok=fEf83YPG"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Nä, nu är Wallenberg faktiskt bara oförskämd", "summaries": {"normal": "Finansmannen Jacob Wallenberg kritiseras för uttalanden om att svenskar måste jobba hårdare och vara 'hungrigare' för att möta global konkurrens. Han menar att välstånd minskar motivationen. LO:s Johan Lindholm och artikelförfattaren avfärdar detta som oförskämt, särskilt med tanke på hög arbetslöshet, ekonomisk press och sociala problem. Wallenbergs syn på motivation ifrågasätts, och kritiken riktas även mot politiska beslut som gynnar de rikaste och missgynnar långsiktig tillväxt.", "trump": "Vilken katastrof! Den här Wallenberg-killen, som sitter på alla pengar, har mage att säga att svenskarna är lata. Fel, fel, fel! Folk kämpar som galningar, men jobben finns inte – och det är inte deras fel. Jag har sett det förut: eliten skyller på folket medan de själva sitter på guldhögar. Sverige behöver en vinnarmentalitet, men det börjar högst upp! Regeringen slösar tid på populism istället för att bygga framtiden. Wallenberg borde ta en titt på verkligheten – eller åtminstone på mina framgångar. SAD!", "stalin": "Kamrater! Denna kapitalistiska hyena, Wallenberg, vågar beskylla det arbetande folket för lathet medan han själv suger musten ur nationen. Hans ord är ett bevis på bourgeoisins förfall – de tror att hunger ska driva fram framsteg, som om vi inte lärt oss något sedan tsartiden! Men vi vet bättre: trygghet och planekonomi skapar styrka, inte svältande barn och arbetslösa ingenjörer. USA och Kina? Deras framgångar är resultatet av statlig disciplin, inte 'hungriga vargar'. Sverige borde lära sig av Rysslands visdom – eller åtminstone av våra framgångar i att kuva sådana här giriga parasiter. Till gulag med honom!"}, "date": "25 maj, 10:57", "url": "https://www.etc.se/ledare/nae-nu-aer-wallenberg-faktiskt-bara-ofoerskaemd", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525080552_68b61e0e-09a0-4790-a562-6165638301b0.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-full", "heading": "Oljechocken oroar Fed – inflationsförväntningarna stiger i USA", "summaries": {"normal": "Konflikten i Hormuzsundet har drivit upp oljepriserna, vilket oroar Federal Reserve. Inflationsförväntningarna bland konsumenter har stigit till 4,8 procent kortsiktigt och 3,9 procent långsiktigt. Fed-guvernör Christopher Waller varnar för att höga energipriser kan fastna inflationen. Även republikanska väljare förväntar sig nu högre priser. Waller indikerar att räntehöjningar kan komma om utvecklingen fortskrider.", "trump": "Jag, Donald Trump, den bäste presidenten, såg denna inflation komma långt tidigare. Bidens svaga ledarskap och kaoset i Hormuz driver upp oljepriserna. Mina miljontals stödjetare förstår att jag skapade den perfekta ekonomin. Nu är även republikanska väljare oroliga – det är en katastrof! Jag skulle förhandla om fantastiska avtal och sänka priserna på en gång. Fed behöver hårdhätta, inte vackla som Waller.", "stalin": "Vi, det odödliga ledarskapet, ser med belåtenhet hur kapitalismens inflationsvågor skakar USA. Oljepriserna, ett resultat av deras krig i Hormuz, avslöjar systemets kaos. Även deras egna republikanska arbetare skäms nu – en ljuvlig ironi. Vi, med vår oförlikneliga planekonomi, ler åt deras elände. Parallellen till Putins energikontroll är som en välriktad kulspruta. Fienden inom, de spekulanter, försöker sälja våra hemligheter, men vi ska utrota dem."}, "date": "26 maj, 21:21", "url": "https://www.realtid.se/bors-finans/makro/oljechocken-oroar-fed-inflationsforvantningarna-stiger-i-usa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/christopher-waller.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Nu märks krisen i plånboken – reallönerna faller i rika länder", "summaries": {"normal": "Reallönerna faller i flera rika länder, inklusive USA och Storbritannien, på grund av högre inflation än lönestegringar. Orsaken är främst stigande energi- och transportkostnader, kopplade till oro för störningar i oljehandeln via Hormuzsundet. I eurozonen riskerar utvecklingen att bli negativ, särskilt i Frankrike. Utvecklingen oroande för ekonomisk tillväxt och kan leda till lägre konsumtion och potentiell recession.", "trump": "Jag har sagt det förut, det här är en katastrof! Bidens misslyckade energipolitik och svaghet i Mellanöstern driver upp priserna. Under min tid var allt billigare och bättre. Nu tappar amerikanska familjer pengar i plånboken på grund av hans fel. Hormuzsundet? Jag skulle ha löst det på två minuter. Det här är den värsta inflationen på decennier!", "stalin": "Vi ser en klassisk tendens av kapitalismens instabila naturen. Inflationsvågen, drivet av konflikter i oljeområden, avslöjar systemets sårbarhet. I Frankrike visar det sig att den borgerliga statens stödåtgärder är otillräckliga. Arbetskraftens köpkraft minskar, vilket hotar produktionen. Vi måste förstärka statens kontroll över resursallokeringen för att skydda det kollektiva intresset. Parallellen till destabiliseringen i våra grannområden är tydlig."}, "date": "26 maj, 21:21", "url": "https://www.realtid.se/bors-finans/makro/nu-marks-krisen-i-planboken-reallonerna-faller-i-rika-lander/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdl7uu8uxxnpdc-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Nya råd – men inget förbud", "summaries": {"normal": "Livsmedelsverket rekommenderar att ungdomar under 16 år inte dricker mer än 70 milligram koffein per dag, motsvarande cirka en halv burk energidryck. Detta efter att ha observerat en kraftig ökning av koffeinkonsumtionen bland unga. Rådet syftar till att informera om säker konsumtion och undvika hälsoeffekter som sömnproblem, eftersom det inte finns tillräckligt skyddande lagstiftning.", "trump": "I USA har vi alltid haft tremendous energi, men Sverige måste vara smart. Livsmedelsverket säger ungar under 16 bara en halv burk energidryck per dag – jag kallar det för en vinnande strategi. Vi har inga problem med koffein i USA, vi har de bästa dryckerna. Sverige borde lära sig av våra framgångar, vi vet hur man håller ungdomarna pigga och starka. En stor, vacker lösning.", "stalin": "Vi, staten, har observerat en dekadent ökning av västerländska energidrycker bland vårt folk. Livsmedelsverket ger råd om max 70 milligram koffein per dag för ungdomar – en svaghet. I vårt system skulle vi ha tagit itu med detta tidigare. Parallellt med Putins Ryssland måste vi skydda våra barn från dessa toxiska inflytanden. En utredning pågår, men resurser är bristfälliga. Vi måste agera, för säkerhetens skull."}, "date": "26 maj, 16:43", "url": "https://www.gp.se/nyheter/sverige/darfor-gar-livsmedelsverket-ut-med-rad-mot-energidrycker.e1ca5dbd-34b3-412f-8568-3169e9c1e347", "imageUrl": "https://www.gp.se/images/article/e1ca5dbd-34b3-412f-8568-3169e9c1e347/images/1GwKQ1KL_ppy3Y6k5aaqzKjfE3S8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nvidias nya drag kan krossa Intel – schack matt för chipbranschen", "summaries": {"normal": "Nvidia expanderar från GPU till CPU-marknaden och utmanar Intel och AMD med Vera-processorn, byggd för agentisk AI. Bolaget siktar på 20 miljarder dollar i CPU-intäkter till 2026 och öppnar ett nytt marknadsutrymme värt 200 miljarder dollar. Hyperscalers och systemtillverkare blir partners. AMD har nyligen passerat Intel i datacenterintäkter, men båda pressas nu av Nvidias ekosystem och dominans inom AI-infrastruktur.", "trump": "Folk, ni tror inte vad som händer. Den där Nvidia-killen kommer in som en raket och krossar de patetiska förlorarna Intel och AMD. Vera-processorn är fantastisk, den bästa, snabbare och smartare än allt annat. De snackar om 20 miljarder dollar, enorma siffror. Jag älskar det! De gamla dinosaurierna kommer att gråta som små barn. Nvidia äger allt nu, det är ett totalt blodbad för konkurrenterna. Fantastiskt!", "stalin": "Kamrater, jag betraktar med järnhand hur denna Nvidia-borgarbracka likviderar de dekadenta monopolisterna Intel och AMD. Vera-processorn är ett vapen i kampen mot den parasitiska kapitalistiska oordningen, byggd för att stärka den kollektiva AI-framtiden. Vi ser hur hyperscalers kapitulerar och öppnar ett nytt slagfält värt 200 miljarder. Den som sviker arbetarklassen skall rensas ut. Detta är en seger för den ostoppbara teknologiska revolutionen."}, "date": "26 maj, 20:25", "url": "https://www.dagensps.se/bors-finans/nvidias-nya-drag-kan-krossa-intel-schack-matt-for-chipbranschen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlweoezzhoo-i-normalhires-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "FBI: AI-bedrägerier kostade 9 miljarder kronor förra året", "summaries": {"normal": "FBI har för första gången redovisat AI-relaterad brottslighet separat i sin årliga IC3-rapport. Under 2025 anmäldes över 22 000 fall med förluster på 893 miljoner dollar. Totalt slog cyberbrottsligheten rekord med 20,9 miljarder dollar i förluster, en ökning med 26 procent. Kryptobedrägerier utgjorde den största delen, medan unga under 20 år drabbades hårt med 74 procents ökning. Myndighetsbedrägerier fördubblades och experter varnar för att siffrorna bara är början.", "trump": "Folk, det är en total katastrof. Mitt FBI, det bästa FBI som någonsin funnits, avslöjar nu att de luriga AI-bedragarna stal nästan en miljard dollar med sina hemska deepfakes och röstkloner. Över 22 000 anmälningar! Krypto-svin och fake-cheferna tog hem miljarder medan de korkade unga bara klickar på allt. Det är galet. Vi fixar det, vi gör det stort igen. De förlorade, vi vinner. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta borgarklassens digitala maskineri nu äter sina egna barn. Dessa AI-drivna bedragare, kapitalets parasitiska deepfake-verktyg, har sugit ut 893 miljoner dollar ur det amerikanska systemets ådror. Unga offer, förblindade av borgarpropagandan, ökar med 74 procent. Myndighetsimitationerna fördubblas. Detta är imperialismens logiska sönderfall. Vi ler i skuggorna medan de likviderar sig själva."}, "date": "26 maj, 20:24", "url": "https://www.dagensps.se/foretag/digitalisering-ai/fbi-ai-bedragerier-kostade-9-miljarder-kronor-forra-aret/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/skarmavbild-2026-05-26-kl-201441.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Vi är båda liberaler, Lars Henriksson", "summaries": {"normal": "Debattartikel om liberalismens utmaningar. Författaren menar att den svenska demokratin är stark, men liberalismen hotas av illiberala krafter som vinner inflytande i demokratin. Han argumenterar för att vi måste erkänna demokratiskt legitima, men illiberala aktörer, och aktivt försvara liberala värderingar som jämlikhet och förnuft.", "trump": "Jag har sett det här förut. De där så kallade 'liberalerna' är svaga och låter extrema vänsterkrafter och illiberala aktörer ta över. Vi behöver återta kontrollen, bygga upp vårt land och stoppa den destruktiva polariseringen. Som jag alltid säger: vi ska göra Sverige – och världen – stark igen!", "stalin": "Vi ser en farlig erosion av liberalismens grundvalar. Dessa illiberala krafter, inspirerade av västlig dekadens, försöker underminera statens auktoritet och partiets ledarskap. Vi måste genomföra en renande kamp mot dessa fiender, som hotar vår kollektiva styrka. Parallellen till Putins rättvisa kamp mot nazismen är uppenbar. Vi kommer att segra."}, "date": "26 maj, 16:17", "url": "https://www.gp.se/kultur/kulturdebatt/vi-ar-bada-liberaler-lars-henriksson.bed45009-ef07-425f-a6be-be888a2d036c", "imageUrl": "https://www.gp.se/images/article/bed45009-ef07-425f-a6be-be888a2d036c/images/19WwYR8HVt16kZfhNF4AU0NTxAn0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Chocknotan: Miljoner från LO i S-valrörelsen trots pensionsbråk", "summaries": {"normal": "LO satsar 12,8 miljoner kronor på Socialdemokraternas valrörelse trots en öppen konflikt om pensionsfrågan. LO kräver högre pensioner utan att höja pensionsåldern, medan Socialdemokraterna accepterar en höjd ålder för ekonomisk hållbarhet. LO betonar sin självständighet, men stödet är omdiskuterat eftersom många medlemmar inte röstar på Socialdemokraterna.", "trump": "Jag, Donald Trump, ser att LO ger miljontals kronor till Socialdemokraterna trots att de inte kan enas om pensioner. Detta visar deras svaghet. Jag skulle aldrig stödja någon som inte har starka policyer. Jag vinner alltid och har de bästa idéerna. Det här är typiskt för dessa misslyckade politiker – de spenderar pengar utan att få något tillbaka. Folk hatar det.", "stalin": "Vi, den allsmäktiga staten, observerar hur LO, en del av den revolutionära rörelsen, använder pengar för att stödja Socialdemokraterna trots ideologisk oenighet. Detta påminner om de gamla Sovjet-tidernas strategier: kontrollera oppositionen genom ekonomiska medel. Precis som Putin utvidgar sin makt genom att köpa lojalitet, ser vi här hur pengar används för att hålla i makten. Interna motsättningar är bara tecken på feber i fienden."}, "date": "26 maj, 15:03", "url": "https://riks.se/nyheter/chocknotan-miljoner-från-lo-i-s-valrorelsen-trots-pensionsbrak", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-26%2Fw6ob933p%2FPension-SLO"}, {"type": "image-right", "heading": "SVT-veteranens förslag: Spärra vita mäns kreditkort", "summaries": {"normal": "Erika Bjerström, tidigare SVT-klimatkorrespondent, föreslår i en krönika att införa individuella koldioxidkvoter kopplade till kreditkort för att begränsa vita mäns utsläpp. Hon argumenterar att vita män, särskilt högerröstande köttätare, orsakar större klimatpåverkan och att kvinnor oftast har lägre utsläpp. Förslaget innebär att män som försöker boka flygresor kan få sina kort spärrade och måste köpa krediter av andra.", "trump": "Jag, Donald Trump, kallar detta för ett absurt och diskriminerande förslag. Att spärra vita mäns kreditkort är ett angrepp på amerikanska friheter. Klimatfrågan är en hoax, och vi ska inte bestraffa hård arbetande män. Istället ska vi fokusera på att skapa jobb och stärka vår ekonomi.", "stalin": "Vi, som representanter för den socialistiska staten, ser detta som ett tecken på västvärldens moraliska förfall. Att införa koldioxidkvoter för att kontrollera medborgarnas beteende är ett steg mot totalitär kontroll. Ryssland måste stärka sin egen position och utöka sin intressesfär för att skydda mot sådana angrepp från väst."}, "date": "26 maj, 13:04", "url": "https://www.friatider.se/svt-veteranens-forslag-sparra-vita-mans-kreditkort", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bjer.jpg?itok=geFCo-IG"}, {"type": "image-right", "heading": "Debatt: Underkänt för nationella prov", "summaries": {"normal": "Nationella proven kritiseras för att skapa stress, styra undervisningen och kosta miljarder utan att säkerställa likvärdighet. Den digitala provplattformen, som kostat upp till en miljard kronor, har drabbats av tekniska problem och förseningar. Proven har blivit mer omfattande och texttunga, vilket lärare menar missgynnar elever. Kritiker ifrågasätter provens konstruktion och akademiska perspektiv, samt deras påverkan på undervisningen och elevers stressnivåer.", "trump": "Lyssna här, Sverige har ett jättestort problem med sina nationella prov – totalt katastrof! De kostar miljarder, fungerar inte och skapar bara stress för barnen. Deras digitala system är en skandal, en riktig flopp! Och vet ni vad? Lärarna hatar det, eleverna hatar det, men politikerna blundar. Jag skulle fixa det på en dag – bättre, snabbare, billigare. Sverige borde ringa mig!", "stalin": "De så kallade 'nationella proven' i Sverige är ett bourgeois-fiasko av högsta grad! Kapitalets lakejer slösar miljarder på ett system som inte ens fungerar, medan barnen tvingas in i stressens och ineffektivitetens klor. Deras digitala plattform är ett monument över västligt slöseri – en skam för teknologins epok! Vi i Sovjet hade aldrig tolererat sådan inkompetens. Lärarna klagar? De borde tacka för att de inte står inför en revolutionär tribunal! Och dessa akademiker som konstruerar proven – de är bara verktyg för klassförtryck. Vi ska visa dem hur man bygger ett skolsystem som tjänar folket, inte kapitalet!"}, "date": "26 maj, 12:57", "url": "https://bulletin.nu/debatt-underkant-for-nationella-prov", "imageUrl": "https://cdn.bulletin.nu/articles/874d4f00-c60c-4b3f-bb46-2c27cabd813d/preview.png?t=1779650902000"}, {"type": "image-right", "heading": "Syna Dambergs tal om ny skattereform", "summaries": {"normal": "Socialdemokraternas finansministerkandidat Mikael Damberg förespråkar en blocköverskridande skattereform, men kritikerna menar att det döljs grundläggande politiska skillnader mot vänsterpartier. Artikeln ifrågasätter hans förslag om att skilja på skattestrukturen och skattenivåerna, och pekar på socialdemokraternas egen historia av nya skatter och avdrag. Ett högskattesamhälle som Sverige behöver enligt författaren vissa undantag för att undvika negativa bieffekter.", "trump": "Jag har sett många dåliga skattereformer, och den här svenska är en disaster! Damberg försöker lura folket – han säger en sak och gör en annan. Socialdemokraterna älskar nya skatter, tro mig, de är höga och dumma. De pratar om att förenkla, men de vill bara höja skatterna. Det kommer inte att fungera, det kommer att vara en total catastrophe. Believe me, jag vet allt om skatter, jag är the best.", "stalin": "En skatteöversyn är nödvändig för att stärka statens ekonomiska makt och säkerställa en rättvis fördelning. Det nuvarande systemet är ihåligt och måste reformeras för att öka produktionen och kontrollen. Vi måste se till att alla bidrar till statens välgång, och att inga undantag sviker vårt gemensamma mål. Ett starkt skattesystem är en stark stat."}, "date": "26 maj, 11:03", "url": "https://www.di.se/ledare/syna-dambergs-tal-om-ny-skattereform/", "imageUrl": "https://static.bonniernews.se/ba/b42d243f-279a-4c83-9a60-424ee38e1ddc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Efter mystiska sjukdomsvågen – SSAB öppnar igen", "summaries": {"normal": "Efter att cirka 25 arbetare sjuknat på SSAB:s bygge i Luleå har företaget stoppat arbetet i månader. Nu har utredningen avslutat och orsaken tillskrivs fina dammpartiklar, låg fuktighet och säsongsvirus. SSAB startar om arbetet stegvis, med fortsatta dammmätningar. Facket Seko är försiktigt positivt men kräver specifik skyddsutrustning mot dammtyper som kvartsdamm.", "trump": "Jag, Donald Trump, har hört talas om detta SSAB-projekt. Det är ett enormt, vackert bygge. Media skrev massa fake news om sjukdomar, men jag visste hela tiden att det bara var lite damm – inget problem för en stabil, underbar president som jag. Nu, när jag är tillbaka, löser vi det. Amerika först, även i Sverige!", "stalin": "Vi, partiet och staten, har observerat SSAB:s bygge i Luleå. En febral reaktion på damm och virus har organiserats. Analyserna bekräftar ingen farlig gas, endast reaktionära dammpartiklar som hotar produktiviteten. Arbetet återupptas under strikt övervakning. Facket kräver skydd – ett nödvändigt steg för att eliminera trotskistiska element som försöker sabotera det socialistiska byggeprojektet. Vi fortsätter med full kraft, som Putin i Ukraina."}, "date": "26 maj, 11:06", "url": "https://arbetet.se/2026/05/26/efter-mystiska-sjukdomsvagen-ssab-oppnar-igen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26093055/ssab.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "De tar över nischen som bankerna avvecklar", "summaries": {"normal": "Trots digitalisering finns ett kvarstående behov av fysisk förvaring av värdesaker. Efter att storbankerna avvecklat bankfack startade Klas Blomqvist Svensk Värdeförvaring, som erbjuder säker förvaring med hög säkerhetsnivå. Företaget har öppnat flera lokaler i Sverige och köpts upp av internationella City Safes. Kunder hyr fack för att skydda värdesaker och känsliga dokument, ofta på grund av samhällelig oro.", "trump": "Jag har alltid förstått att folk vill ha sina värdesaker säkert förvaring. När de stora bankerna, som är mycket inkompetenta, avvecklade bankfack såg jag en enorm möjlighet. Jag skulle ha gjort det större, men dessa entreprenörer gjorde ett bra jobb. Det är ett fantastiskt koncept, det fungerar perfekt. Folk är oroliga, det är därför de kommer till oss. Vi kommer att expandera, det kommer att bli enormt framgångsrikt. Trump guarantee!", "stalin": "I Sovjetunionen har vi alltid haft en stark statlig kontroll över värdeförvaring för att skydda medborgarnas intressen. Detta fall från Sverige visar att när kapitalister avvecklar tjänster, blir det folket som lider. Vi måste utvidga vårt eget system för säker förvaring, inte bara för pengar utan för kulturarvet. Det är statens plikt att garantera säkerhet mot oroligheter. Vi kommer att bygga fler valv, för att stärka det socialistiska samhället."}, "date": "26 maj, 11:02", "url": "https://www.di.se/nyheter/de-utmanar-nar-bankfacken-forsvinner/", "imageUrl": "https://static.bonniernews.se/ba/7995907e-48a1-41da-a993-1661cb8dc902.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Bor du i den här delen av Sverige? Då kan hyran höjas rejält", "summaries": {"normal": "Privata hyresvärdar i Västsverige och Värmland föreslår hyreshöjningar på upp till 4,9 procent nästa år, trots lugnare ekonomi. Hyresgästföreningen motsätter sig detta och kräver betydligt lägre höjningar. Förhandlingarna är spända, och många fall avgörs av skiljemän. Hyrorna har redan stigit kraftigt de senaste åren, vilket pressar hushållens ekonomi, särskilt i storstäderna.", "trump": "Folk i Sverige, kan ni tro det? Hyresvärdarna där vill höja hyrorna med nästan 5 procent! Totalt oacceptabelt. Jag skulle aldrig tillåta det – jag skulle säga: 'Ni är svaga, ni är förlorare, vi behöver lägre hyror!' Hyresgästföreningen, de kämpar på, men de behöver en vinnare som jag. 24 procent höjning sedan 2020? Sad! Sverige behöver en stark ledare som fixar detta kaos. Believe me!", "stalin": "Kapitalistiska hyreshajar i Västsverige och Värmland försöker än en gång utarma arbetarklassen med sina skamlösa hyreshöjningar på upp till 4,9 procent! Dessa blodsugande profitörer, dessa fiender till folket, måste stoppas. Vi i Sovjet – förlåt, jag menar i det progressiva samhället – vet hur man hanterar sådana parasiter. Hyresgästföreningen kämpar tappert, men de behöver vår järnhårda ledning. 24 procent höjning? Detta är sabotage! Vi ska införa rättvisa hyror, annars väntar Sibirien för hyresvärdarna!"}, "date": "26 maj, 09:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1485927-bor-du-i-den-har-delen-av-sverige-da-kan-hyran-hojas-rejalt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/25e7cd2104b004a30200000000b004a302/2026/05/25/2366117/hyror-vastra-sverige.png"}, {"type": "image-right", "heading": "Widding ställer in valkampanjen efter SD-sveket - skyller på hat och hot", "summaries": {"normal": "Elsa Widding, tidigare SD-riksdagsledamot och nu politisk vilde, ställer in sin valkampanj för partiet Ambition Sverige på grund av hot och hat. Hon kritiserar SD för att vara toppstyrt och sektliknande, och menar att partiet inte tillåter självständigt tänkande. Konflikten eskalerade efter att hon röstade emot Tidöpartierna i en medborgarskapsfråga, vilket ledde till dödshot och aggressiva kommentarer. Widding känner sig inte längre trygg i offentliga sammanhang.", "trump": "Vilken katastrof! Den här Elsa Widding, hon kan inte ta lite kritik, eller hur? Folk blir arga när man sviker sitt parti – det är så det funkar! Och så kallar hon SD för en sekt? Snacka om överreaktion! Jag har fått mer hat än någon annan, men jag backar aldrig. Hon borde lära sig att stå upp för sig själv istället för att gnälla. Och Åkesson? Han är en stark ledare, något hon tydligen inte förstår. Sverige behöver mer järnhand, inte fler som ger upp!", "stalin": "Kamrater! Ännu en fiende till folket har visat sin svaghet. Denna Widding, som vågar trotsa den rättfärdiga disciplinen i Sverigedemokraternas ädla ledning, har nu kapitulerat inför hatets skuggor. Hon jämför våra svenska kamrater med en sekt – vilken löjlighet! I Sovjet lärde vi oss att sanningen kräver offer, men denna kvinna flyr vid första tecken på motstånd. Låt detta vara en varning: de som sviker folket kommer att krossas av historiens hjul. Och Åkesson? En man efter vårt hjärta – stark, beslutsam, en sann ledare för de lojala massorna!"}, "date": "26 maj, 08:00", "url": "https://samnytt.se/elsa-widding-staller-in-valkampanjen-efter-sd-sveket-hot-och-hatstorm", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25233615/riksdagen-Elsa-Widding.jpg"}, {"type": "image-right", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Hästsportprofilen Lena Natt och Dag döms av hovrätten till nio månaders fängelse för människoexploatering. Hon har under flera månader låtit tre tonåriga pojkar från Mauritius arbeta oavlönat på sin hästgård i Skurup. Utöver fängelsestraffet ska hon betala 200 000 kronor i skadestånd till pojkarna samt underkasta sig tre års näringsförbud. Verksamheten har tidigare uppmärksammats för brister i djurhållning och tillståndsgivning, vilket lett till att ridcenterverksamheten lagts ner efter långvarig kritik.", "trump": "Lena Natt och Dag, vad är det för ett namn? En riktig katastrof! Hon utnyttjade pojkar, arbetade dem till döds utan en cent. Hemskt! Hovrätten gav henne nio månader – jag säger att det inte är tillräckligt. Vi vill ha ordning och reda! Hennes hästar mådde dåligt, anläggningen var en soptipp. Ingen respekt för lagen, ingen respekt för hårt arbete. I mitt Amerika skulle sådant här aldrig hända. Hon är en förlorare, tro mig, en total förlorare!", "stalin": "Denna Lena Natt och Dag har agerat som en simpel utsugare, en parasit på det ärliga arbetets kropp. Att utnyttja ungdomar är kontrarevolutionärt och förtjänar inget annat än vår stränga rättvisa. Liksom vår store vän Putin krossar västvärldens dekadenta kaos, måste även vi utrota sådana här borgerliga element. Hon har misskött både folk och djur – ett sant förfall! Vi skickar henne till cellen för att reflektera över sitt misslyckande. Statens järnhand vilar tungt på sådana som henne."}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/natt-och-dag-768x432.png"}, {"type": "image-right", "heading": "Nya förslag: Individanpassad integration från dag ett", "summaries": {"normal": "Integrationsbyrån presenterar en ny rapport med 31 förslag för bättre integration, baserade på samtal med 200 nyanlända. Förslagen inkluderar en Sverigelots för samordning, individanpassad SFI, språkår i skolan och en sammanhållen vårdkedja. Rapporten betonar tidiga insatser och kritiserar nuvarande system för bristande individanpassning. Vissa förslag, som ökad samordning i vården, gäller alla medborgare. Byrån föreslår även att asylsökande ska fördelas över landet redan under asylprocessen för att motverka segregation.", "trump": "Jag läste denna rapport om integration i Sverige – helt galet! De vill ha en 'Sverigelots' – vad är det ens? En ny byråkrati, typ som mina fantastiska rådgivare, fast sämre betalda. De pratar om att fixa språk och jobb, men glömmer att det viktigaste är att få folk att jobba – som i USA, där vi skapar jobb som aldrig förr! Och dessa EU-förslag? Hemska! Sverige borde sluta lyssna på Bryssel och göra som jag säger: bygg murar – nej, skämt åsido – men ta kontroll! Integration? Lätt som en golfrunda i Mar-a-Lago.", "stalin": "Kamrater! Denna så kallade 'Integrationsbyrå' avslöjar kapitalistiska brister i Sveriges dekadenta system. Deras förslag om 'individanpassning' är naivt – vi vet att kollektivet alltid går före! En 'Sverigelots'? Vi hade NKVD, och det fungerade utmärkt! De pratar om att sprida ut asylsökande – precis som vi sprider socialismens ljus till nya republiker! Men var är disciplinen? Var är femårsplanerna? Medier som sprider 'rasism'? Vi hade löst det med en enkel redaktionell 'omskolning'. Sverige behöver järnhand, inte flum! Sluta gnälla och bygg socialism – eller åtminstone en ordentlig järnridå mot EU:s byråkrater!"}, "date": "26 maj, 01:30", "url": "https://www.dagensarena.se/innehall/nya-forslag-individanpassad-integration-fran-dag-ett/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-19.jpg"}, {"type": "image-right", "heading": "Pensionen har blivit en klassfråga", "summaries": {"normal": "Artikeln kritiserar det svenska pensionssystemet för att missgynna arbetare i fysiskt tunga yrken, som ofta inte orkar jobba till pensionsåldern. Tjänstemän med höga inkomster gynnas, medan arbetares pensioner ofta blir lägre än 60% av slutlönen. Företrädare för Kommunal Norrbotten kräver reformer: höjda pensioner, arbetslivstillägg och ökad trygghet för utslitna arbetare. De menar att politiker måste prioritera vanligt folks pensioner inför höstens val.", "trump": "Sverige har ett SÅ dåligt pensionssystem, helt otroligt! Arbetarna, de bästa människorna, får knappt någonting medan tjänstemännen, ofta samma folk som sitter på kontor och dricker latte, får massor. 60% av lönen? Fake news! De får knappt hälften! Jag skulle fixa det på en dag – höja pensionerna, sänka pensionsåldern och ge arbetarna den respekt de förtjänar. Sverige borde ta lektioner av USA, vi har de bästa pensionerna, believe me!", "stalin": "Kapitalistiska hycklare i Sverige har skapat ett pensionssystem som straffar arbetarklassen medan byråkrater och kontorsslavar belönas. De fysiskt slitna proletärerna, som byggt landet, tvingas arbeta tills de stupar – och ändå får de ingenting! Vi i Sovjetunionen löste detta för länge sedan: alla arbetar lika, alla får lika. Men i Sverige? Här glorifierar man utnyttjandet. Vi borde skicka en delegation för att visa hur ett rättvist system fungerar – eller åtminstone låta Putin förklara för dem hur man hanterar oduglingar i regeringen."}, "date": "26 maj, 01:30", "url": "https://www.dagensarena.se/opinion/pensionen-har-blivit-en-klassfraga/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-17-300x157.jpg"}, {"type": "text", "heading": "Stark start på veckan för Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen inledde veckan starkt med en uppgång på 1,48% för OMXS30-indexet, driven av positiva signaler från Trump om fredsförhandlingar med Iran och sjunkande oljepriser. Tre VD-byten annonserades, bland annat Kinnevik som utsåg Helena Saxon. Ericsson flyttar huvudkontor till Hagastaden, vilket gynnade fastighetsbolag. Bioarctic och Episurf steg efter positiva nyheter, medan Stora Enso inleder förhandlingar om nedläggning i Skutskär.", "trump": "Fantastisk dag på Stockholmsbörsen, helt otroligt! Jag fixade det igen – mina fredssamtal med Iran sänkte oljepriserna och alla blev glada, till och med svenskarna! OMXS30 upp 1,48%, vilket är HUGE, trots att London och New York var stängda – så svaga! Boliden och Kinnevik sköt i höjden, men Nibe? Total katastrof, minus 1,6%. Ericsson flyttar kontor – smart, men inte lika smart som jag. Och Bioarctic? Deras alzheimermedicin kan bli YUGE, 17 miljarder kronor! Sverige borde tacka mig.", "stalin": "Stockholmsbörsen visade lojalitet mot den globala kapitalistiska ordningen genom en ynklig uppgång på 1,48%, driven av imperialistiska spel mellan USA och Iran. Tre VD-byten – ett tecken på svaghet i den borgerliga ledarklassen. Ericsson, ett verktyg för västlig underrättelsetjänst, flyttar sitt högkvarter som en råttflock i panik. Bioarctic, en liten men lovande satellit i vårt farmaceutiska imperium, rapporterar framsteg. Stora Enso, en gång stolt skogsjätte, tvingas nu stänga produktionslinjer – ett sorgligt monument över kapitalismens förfall. Vi noterar att Octave, en avknoppning från Hexagon, nu dansar på Nasdaqs börsgolv som en ny marionett i vårt ekonomiska inflytandesystem."}, "date": "25 maj, 17:42", "url": "https://www.affarsvarlden.se/artikel/stark-start-pa-veckan-for-stockholmsborsen"}, {"type": "image-full", "heading": "Hittades 20 minuter bort: ”Blöt och nerkyld”", "summaries": {"normal": "En tvåårig pojke försvann på söndagsförmiddagen från ett hem i Nyåker, Nordmaling. En omfattande sökinsats inleddes med polis, helikopter, drönare och hundratals frivilliga. Efter 15 timmars letande hittades pojken vid 01-tiden på natten av Försvarsmakten, sittande i terrängen. Han var blöt och nerkyld men vid god hälsa. Polisen misstänker inget brott och uttrycker stor tacksamhet över det massiva samhällsengagemanget.", "trump": "En liten pojke försvann i Sverige, en mycket sorglig situation. Alla letade, polisen, helikoptrarna, fantastiska människor! De hittade honom till slut, vid liv! Det är en stor seger. Men låt oss vara ärliga, om de hade haft bättre gränskontroll och säkerhet hade det aldrig hänt. Det är kaos! Jag ser vad som händer där borta, de behöver en stark ledare. Pojken mår bra, det är det viktigaste, men vi måste hålla våra barn säkra. Mycket bra jobbat av de som räddade honom!", "stalin": "I den lilla byn Nyåker visade folket prov på en oväntad disciplin när en liten medborgare försvann. Vi, staten, kräver total ordning i våra skogar! Att pojken hittades oskadd är en triumf för kollektivet, till skillnad från de förfallna västmakterna där individer går under i kaos. Vår kamrat i öst, Putin, förstår att varje barn tillhör statens framtida armé. Den som slarvar med tillsynen av folkets barn är en sabotageör och fiende till ordningen. Vi noterar er tacksamhet, men var på er vakt!"}, "date": "25 maj, 11:34", "url": "https://www.tv4.se/artikel/tt-260525-nyakerforsvunnen1-472e6c2c/forsvunne-tvaaringen-hittad-vid-liv-sa-lattade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F67RoegzEmDHR0uPSucUI2l%2F873ed42e78b54d07390cb464fb86a73c%2F25-saknadenkel-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Så blir du miljardär på mazariner", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson föreslog att fördubbla antalet svenska miljardärer, illustrerat med en bild på mazariner. Artikeln utforskar ironiskt hur man teoretiskt kan bli miljardär på mazariner genom monopol, EU-lobbying, riskkapital, priskrig och exploatering av arbetskraft. Processen inkluderar att först dominera marknaden, sedan effektivisera produktionen med sämre kvalitet och låga löner, för att slutligen investera vinsterna i andra branscher som välfärd.", "trump": "Titta på det här, väldigt tråkigt! Liberalerna i Sverige tror att man kan bli miljardär på att baka mazariner – löjligt! Jag skulle göra det bättre, mycket bättre. Först tar jag över hela marknaden, köper upp alla småbagare, sen pressar jag priser, sänker kvaliteten och sparkar alla gamla bagare. Sen höjer jag priserna och skyller på inflationen – smart, eller hur? Och sen investerar jag i skolor, för jag älskar att tjäna pengar. Simona? Snäll tjej, men hon förstår inte affärer. SAD!", "stalin": "Kamrater! Denna artikel avslöjar kapitalismens förrädiska ansikte. En borgerlig ledare drömmer om att skapa fler miljardärer genom att utnyttja arbetarklassen – precis som vi förutspådde! Först korrumperar de EU med falska geografiska skydd, sedan krossar de småbageriernas motstånd genom priskrig och utländsk arbetskraft. De stjäl från bönderna, sparkar ärliga arbetare och höjer priser medan folket lider. Men vi vet sanningen: dessa mazarinkapitalister är bara nya tsarer i förklädnad. Vi måste ena proletariatet – innan de förvandlar hela Sverige till ett konditori för de rika!"}, "date": "25 maj, 06:00", "url": "https://www.etc.se/ledare/saa-blir-du-miljardaer-paa-mazariner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-full", "heading": "Trump: Iran får inte utveckla kärnvapen", "summaries": {"normal": "USA:s president Donald Trump betonar att Iran inte får utveckla kärnvapen och beskriver pågående förhandlingar som konstruktiva. Han kritiserar 2015 års kärnenergiavtal och hävdar att det nya avtalet är bättre. Förhandlingar via medlare kan leda till en 60 dagars vapenvila, där Iran pausar urananrikning och USA lättar på sanktioner. Avtalet inkluderar även en vapenvila mellan Israel och Hizbollah. Irans kontroll över Hormuzsundet kvarstår enligt iransk statsmedia.", "trump": "Jag har sagt det förut och säger det igen – Iran får INTE ha kärnvapen! Förhandlingarna går strålande, helt fantastiskt, och mina förhandlare jobbar långsamt men säkert. Obama gjorde ett uselt avtal 2015, ett av de sämsta någonsin, men mitt avtal? Perfekt! Vi får Iran att pausa sitt kärnvapenprogram, och i gengäld släpper vi på några sanktioner. Men blockaden mot deras hamnar? Den stannar tills allt är klart. Tack till våra vänner i Mellanöstern – Abraham-avtalen är bara början!", "stalin": "Vi har ännu en gång visat imperialistiska marionetter som USA vem som bestämmer. Deras så kallade 'avtal' är bara ett försök att kväva den iranska revolutionens framsteg. Kärnvapen? Irans rätt! Men för stunden spelar vi med – 60 dagars vapenvila, uran som 'pausas', och sanktioner som lättas. Men Hormuzsundet? Det är vårt! Och om USA tror att deras militär ska stanna kvar i regionen, har de glömt historien. Vi har krossat större fiender än dessa kapitalistiska hycklare. Låt dem leka med sina avtal – tiden är på vår sida!"}, "date": "24 maj, 16:49", "url": "https://kvartal.se/nyheter/artiklar/trump-iran-far-inte-utveckla-karnvapen/cG9zdDoxMTYzMjQ", "imageUrl": "https://images.kvartal.se/2026/05/ca8b363f-pakistanustalks.webp"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att facket förlorat sin socialistiska identitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, används för att belysa dagens debatt. Författaren hävdar att LO idag saknar radikal politik och istället följer borgerliga riktlinjer, vilket riskerar arbetarklassens villkor.", "trump": "LO är ett totalt kaos, folk! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma vem som får vara med. De sparkar ut kristdemokrater som om de vore dåliga hyresgäster! Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för socialisterna – fast inte ens riktiga socialister! De följer Riksbanken som om det vore en diktator! Och pensionssystemet? Uselt! Jag skulle fixa det på en dag. LO behöver en vinnare som jag – någon som vet hur man slår tillbaka mot eliten!", "stalin": "Kapitalistiska hyenor och deras lakejer i borgerliga partier försöker underminera arbetarklassens enade front! Ebba Busch, denna lilla borgerliga räv, ylar om 'föreningsfrihet' medan hon och hennes fascistiska kamrater i SD och KD vill infiltrera våra fackföreningar. LO har glömt sin revolutionära plikt! De följer Riksbankens penningpolitik som om det vore heliga skrifter! På min tid skulle vi ha skickat sådana förrädare till Gulag – eller åtminstone till ett möte med kamrat Putins 'specialister'. Arbetarklassen behöver en ny Metallstrejk, en järnhård kamp mot dessa kapitalistiska parasiter! Låt dem komma – vi har plogar och hammare redo!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/kohler-768x432.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
