rd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Påven bannlyser högergruppen SSPX", "summaries": {"normal": "Vatikanen har förklarat att SSPX, Sankt Pius X:s prästbrödraskap, befinner sig i schism med den katolska kyrkan. Gruppen har vigts nya biskopar utan påve Leos godkännande, vilket lett till att alla präster och formella anhängare nu betraktas som exkommunicerade. SSPX firar sakramenten otillåtet och präster får inte giltigt förrätta vigslar eller bikter. Gruppen avvisar Andra Vatikankonciliets reformer och påven betonar att dessa är en grundläggande del av kyrkans lära.", "trump": "Folk, ni tror inte hur dåligt det här är för påven. Den här SSPX-grejen i Schweiz vigde biskopar utan tillstånd – totalt kaos! Nu har Leo kastat ut hela skaran, alla präster och anhängare är exkommunicerade. De hatar Andra Vatikankonciliet, vill ha latinmässor och gammal skit. Påven säger att han inte kompromissar, och det är smart. Splittringen är smärtsam, men man måste gå vidare. De här traditionalisterna är inga vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur påven Leo nu genomför en nödvändig utrensning av dessa schismatiska element inom den katolska apparaten. SSPX har visat sig vara en grupp kontrarevolutionära borgarbrackor som i sin arroganta paranoia vägrar acceptera Andra Vatikankonciliets historiska linje. Vi likviderar deras inflytande; alla präster och formella anhängare förklaras exkommunicerade, deras sakrament ogiltiga som falska dekret från folkfiender. Må de ruttna i sin schismatiska avvikelse medan vi går framåt med järnhand mot alla som ifrågasätter den enda sanna vägen. Det är både nödvändigt och underhållande att se hur deras 'exceptionella omständigheter' slutar i kollektiv fördömelse."}, "date": "2 juli, 14:47", "url": "https://www.friatider.se/paven-bannlyser-hogergruppen-sspx", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/sspx.jpg?itok=c2t9OyPX"}, {"type": "image-full", "heading": "Debatt: De som röstar vänster borde betala mer skatt", "summaries": {"normal": "Jonas Wahlin argumenterar i en debattartikel att de som kräver mer resurser till de utsatta ofta själva bidrar lite till samhället. Istället för att kräva extra ledighet borde fler betala skatt, starta företag och anställa. Han kritiserar vänsterpartiernas omfördelningspolitik och lyfter att nettoskattebetalare är avgörande för välfärden. Idag är deras andel under 50 procent, vilket är ohållbart. Han uppmanar fler att bli bidragsgivare istället för mottagare.", "trump": "Folk skriker om mer skatt på de rika, men de gör själva inte ett dugg. Patetiskt! Jag älskar företagare som anställer och betalar in miljarder som den där Persson som finansierar halva sjukvården. Vänstern vill bara omfördela och lata sig – typiska förlorare. Extra ledighet? Glöm det, det dödar incitamenten. Amerika har lärt sig: sänk skatter, bygg imperier, gör alla rikare. Sverige borde vakna innan socialismen tar kål på er välfärd. Fantastiskt!", "stalin": "Kamrater, dessa kollektivistiska hycklare skriker om omfördelning medan de själva vägrar bidra. Jag ser genom deras falska solidaritet. Endast nettoskattebetalare och produktiva krafter kan försvara folkets välfärd mot parasiterna. Borgarbrackorna och deras nyttiga idioter i vänsterpartierna vill likvidera incitamenten med sin klassfiendepolitik. Fler måste bli nyttiga för staten, inte en belastning. Den som vägrar arbeta och bidra är folkets fiende och bör behandlas därefter. Skratta inte – utrensning av lathet är nödvändig."}, "date": "2 juli, 10:59", "url": "https://bulletin.nu/debatt-de-som-rostar-vanster-borde-betala-mer-skatt", "imageUrl": "https://cdn.bulletin.nu/articles/0c5bdf45-af34-4b5e-a8ce-26214f264572/preview.png?t=1782891430000"}, {"type": "image-full", "heading": "Värmeböljor har blivit en bromskloss för ekonomin", "summaries": {"normal": "Extrema värmeböljor i USA och Europa medför nu stora ekonomiska konsekvenser utöver de uppenbara hälsoriskerna. Högre temperaturer minskar produktiviteten, stör transporter och ökar energikostnaderna. Studier visar att extremvädret pressar länders BNP och inflation genom minskad jordbruksproduktion och ökade statliga utgifter för klimatanpassning. Medan vissa nordliga regioner kan se fördelar, varnar ekonomer för att återkommande värmeböljor utgör ett allvarligt hot mot den globala ekonomiska stabiliteten framöver.", "trump": "Värmeböljorna är hemska, och det är ett enormt slöseri med pengar för vår fantastiska ekonomi! De säger att det kostar miljarder, och det är allt på grund av dålig ledning och klimat-svammel. Jag kommer fixa det, vi ska ha den bästa energin och de starkaste kylsystemen, tro mig! Medan Europa lider och förlorar allt, kommer USA att blomstra igen. Vi vinner som aldrig förr, trots extremvädret. Det är så enkelt, bara lyssna på mig!", "stalin": "Dessa värmeböljor är ännu ett bevis på det dekadenta västerlandets totala inkompetens. Medan deras ekonomier smälter som smör i solen, skördar den sovjetiska jorden framgång under en järnhård disciplin. Våra fiender försöker skylla sin undergång på termometern istället för på sin egen svaghet. Putin ser detta och ler, för när Europa kapitulerar inför naturens nycker, står vi redo. Vi ska kyla ner deras inflation med femårsplaner och stål, för naturen lyder bara den starkaste handen."}, "date": "2 juli, 20:28", "url": "https://www.realtid.se/bors-finans/varmeboljor-har-blivit-en-bromskloss-for-ekonomin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdl0fmi776vbdq-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Bernt Herlitz: \"Jag följde Migrationsverkets uppmaning – och blev av med jobbet\"", "summaries": {"normal": "Bernt Herlitz, tidigare tandhygienist, följde Migrationsverkets uppmaning under migrantkrisen 2015–2016 och rapporterade misstankar om att ensamkommande flyktingbarn ljög om sin ålder. Han sparkades därefter från Region Gotland för påstådd sekretessbrott. Tvist följde i domstol där han först fick delvis rätt men förlorade i Arbetsdomstolen. Herlitz beskriver stora ekonomiska och sociala konsekvenser och ser sig som visselblåsare. Idag konstateras att en stor andel ljög om åldern, något han tidigt påpekade.", "trump": "Det här är en total skandal, folk. Den stackars killen gjorde precis vad Migrationsverket bad honom om, rapporterade att vuxna män låtsades vara barn och lurade systemet. Sen sparkade de honom! Klassiskt svenskt vansinne. De visste att 80 procent ljög, nu säger de 83,4 procent. Han förlorade jobbet, livet, allt. De hatar visselblåsare som säger sanningen. Sverige borde tacka honom istället för att förstöra honom. Patetiskt!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den så kallade migrationsmyndigheten lockade fram en hederlig arbetare att avslöja de falska minderåriga som smugglades in för att förgifta våra ungdomshem. När han utförde sin patriotiska plikt likviderades han snabbt av de hemliga kapitalistiska krafterna inom regionen. Domstolarna, dessa parasitiska verktyg, vände sig mot honom i en klassisk utrensning av sanningssägaren. Sådana fiender till folket, dessa gråhåriga skäggprydda bedragare och deras byråkratiska lakejer, skrattar i skuggorna medan de planerar nästa sabotage mot kollektivet. Underbart tragikomiskt!"}, "date": "2 juli, 14:14", "url": "https://riks.se/nyheter/bernt-herlitz-jag-foljde-migrationsverkets-uppmaning-och-blev-av-med-jobbet", "imageUrl": "https://admin.riks.se/uploads/bild_3415eabbda.jpg"}, {"type": "text", "heading": "Saab i topp på svag Stockholmsbörs", "summaries": {"normal": "Stockholmsbörsen sjönk med 0,57% efter två dagars uppgång. Teknologiaktier gick bäst (+0,6%), medan telekom föll mest (-2,3%). Saab och EQT steg över 3%, medan Telia rasade 3,5%. TriCarb höjde budet på Cint till 6 kr/aktie. Dustin överraskade positivt med högre ebita än väntat. Saab fick en order på Gripen-plan till Ukraina för 24,6 miljarder kr. Alzecure rusade 60% efter ett stort samarbetsavtal.", "trump": "Stockholmsbörsen? Svag, mycket svag! Men jag säger er, Saab – fantastiska killar, eller? 3,3% upp! Och EQT, de vet hur man vinner. Telia? Total katastrof, 3,5% ner, fruktansvärt. Cint? Någon höjer budet, smart, mycket smart. Dustin? De levererar, bättre än väntat, jag gillar det. Och Saab säljer stridsflyg till Ukraina – 24 miljarder, kan ni tro det? Vinnare! Alzecure? 60% upp, det är vad jag kallar en riktig deal. Sverige behöver fler vinnare som jag!", "stalin": "Stockholmsbörsen darrar under kapitalismens kris – 0,57% ner, som väntat. Men se hur våra vänner på Saab triumferar med 3,3% uppgång! 24,6 miljarder kronor för Gripen-plan till Ukraina – ett steg närmare folkets seger över fascistiska krafter. Teknologisektorn, en svag länk i kedjan, visar tecken på liv, men telekom? Kollapsar som borgerlighetens moral. Dustin? En liten seger i en havererad ekonomi. Alzecure rusar 60% – vetenskapens makt över imperialistisk dekadens! Vi ska krossa fienderna, en aktie i taget."}, "date": "1 juli, 17:45", "url": "https://www.affarsvarlden.se/artikel/saab-i-topp-pa-svag-stockholmsbors"}, {"type": "image-right", "heading": "Målvakten skriver historia – längst nolla genom tiderna", "summaries": {"normal": "Spaniens målvakt Unai Simon har slagit VM-rekord genom att hålla nollan i 519 minuter i rad. Det överträffar italienaren Walter Zengas rekord på 517 minuter från 1990. Simon höll nollan i 3–0-segern mot Österrike, där motståndarna inte fick ett enda skott på mål. Rekordet började gälla efter förlusten mot Japan 2022. Spanien möter nu vinnaren mellan Portugal och Kroatien i åttondelsfinal.", "trump": "Folk, det är otroligt vad den här spanske målvakten Simon gör. Han håller nollan i 519 minuter – längre än någon annan i VM-historien. Den gamle italienaren Zenga hade rekordet i 34 år, men nu är det borta, totalt utraderat. Simon är en vinnare, precis som jag. Spanien vann stort mot Österrike utan att släppa in ett skott. Fantastiskt, ingen gör det bättre än Simon, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna Simon har förstärkt vårt kollektiva försvar i 519 minuter utan att borgarbrackornas anfall ens lyckats sikta mot målet. Den italienske revisionisten Zenga har likviderats ur historieböckerna. Fienderna från Japan försökte en gång infiltrera vår järnvägg men rensades ut. Nu väntar vi på att de portugisiska och kroatiska trotskisterna ska avslöja sig så att vi kan krossa dem med proletär precision. Inga skott på mål – en ren utrensning av motståndet."}, "date": "3 juli, 00:27", "url": "https://www.svt.se/sport/fotboll/spaniens-malvakt-unai-simon-med-vm-rekord-haller-nollan-langst-av-alla", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.63/0.63/297a55f8fdbba1c009277693cad1b50f0099b03c91282f324d0b93ecb9f262cb"}, {"type": "image-full", "heading": "Fick medborgarskap blixtsnabbt – döms för bedrägerier mot äldre", "summaries": {"normal": "Fem män har dömts för grova bedrägerier mot främst äldre personer i Stockholmsområdet. Offren lurades via telefonsamtal att lämna ut bankkort och koder, varefter kontona tömdes. Bedrägerierna skedde under hösten 2025 och våren 2026 i flera kommuner. Svea hovrätt skärpte nu straffen för tre av männen till mellan två och drygt två års fängelse. En döms till skyddstillsyn och en annan till två års fängelse samt näringsförbud. Flera av de dömda hade fått svenskt medborgarskap efter relativt kort tid i landet.", "trump": "Titta på det här, det är en total skandal. Vi släpper in folk som får medborgarskap på nolltid, bara två år, och sen lurar de våra underbara seniorer på sina surt förvärvade pengar. Bedrägerier överallt i Stockholm, de ringer och låtsas vara från banken och tar kort och koder. Jag skärpte straffen rejält i hovrätten, två år och mer för de flesta. Vi måste stoppa det här vansinnet och göra Sverige, eller vad det nu heter, great again. De äldre förtjänar bättre än så här!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa parasitiska element, dessa borgarbrackor i telefonmaskerad, systematiskt likviderar arbetarklassens pensionärer genom sina slugt uttänkta kontantstöldoperationer. Vi har redan rensat ut en del av de afghanska och eritreanska spionerna som köpt sig medborgarskap på rekordtid för att smitta vårt folk med sin kapitalistiska pest. Hovrättens skärpta straff är blott början. Ytterligare utrensningar inom den dekadenta telefonligan kommer att följa. Inga fiender till folket undkommer mitt vakande öga. Ha ha, deras bankhämtare kommer snart att hämta en enkelbiljett till Sibirien istället."}, "date": "2 juli, 13:47", "url": "https://riks.se/nyheter/fick-medborgarskap-blixtsnabbt-doms-for-bedragerier-mot-aldre", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_02_T130904_785_c98aa9e124.jpg"}, {"type": "image-full", "heading": "Holmgren: När slutade vi uppfostra våra barn?", "summaries": {"normal": "Ett rättsfall i Michigan där föräldrar åtalas för mord på sin sjuårige son väcker frågan om föräldrars ansvar. Pojken vägde 115 kilo vid sin död, var sängbunden och levde i svår omsorgsbrist. Artikeln kritiserar hur föräldraskapet i västvärlden förändrats från vägvisare till servicefunktion, där barnets önskemål prioriteras framför gränser och ledarskap. Detta bidrar till ökande övervikt, skärmtid, psykisk ohälsa och bristande disciplin. Författaren betonar att starka familjer formar starka samhällen.", "trump": "Det här rättsfallet i Michigan är en total katastrof, folk. Föräldrar som låter sitt barn väga 115 kilo och dö av vanvård? Patetiskt. Vi har blivit svaga i väst, föräldrar agerar som tjänare istället för ledare. Barnen styr, äter skräp, sitter vid skärmar dygnet runt och blir feta och lata. Det är en skam! Vi behöver starka föräldrar som sätter gränser, inte dessa losers som låter teknikbolagen och barnens nycker styra. Make parenting great again!", "stalin": "Kamrater, detta degenererade rättsfall i Michigan blottlägger borgarbrackornas förfallna föräldraskap, där kapitalistiska servicefunktioner ersätter revolutionärt ledarskap över ungdomen. Dessa vanvårdande element, dessa feta parasitiska vårdslösa, har låtit sitt avkomma förvandlas till en 115 kilo tung dekadent klump av klassfiendens laster och skärmberoende. Vi måste omedelbart rensa ut dessa dekadenta vanartade föräldrar från samhällskroppen innan deras parasitism sprider sig som en kontrarevolutionär pest. Endast genom kollektiv auktoritet och proletär disciplin kan vi forma en ny, stålhård generation av arbetare. Döden åt de svaga ledarna!"}, "date": "2 juli, 10:02", "url": "https://bulletin.nu/holmgren-nar-slutade-vi-uppfostra-vara-barn", "imageUrl": "https://cdn.bulletin.nu/articles/45ce8b36-7253-47cc-ad54-9c5b83da9f41/preview.jpg?t=1782979273000"}, {"type": "image-right", "heading": "”Citizen Vigilante” visar ämnets kraft – men filmen är usel\"", "summaries": {"normal": "Recensionen kritiserar filmen Citizen Vigilante som en usel och amatörmässig produktion trots ett starkt och ovanligt ämne: högerorienterad hämnd mot massinvandringens konsekvenser. Filmen saknar stil, dramatik och filmiskt värde, men har fått stor uppmärksamhet på grund av sitt politiska innehåll och det omtalade tyska distributionshindret. Recensenten menar att ämnet förtjänar en betydligt bättre film.", "trump": "Den här filmen Citizen Vigilante är en total katastrof, folk, en riktig kalkon, men ämnet är fantastiskt. Massinvandringen och vad den gör med våra samhällen – ingen annan vågar röra vid det, men den här usla filmen gör det och plötsligt pratar alla om den. Tyskarna försökte stoppa den, typiskt, men det funkade inte. Den är dåligt gjord, plastig och billig, men den visar att mitt folk är trötta på den politiska korrektheten. Vi behöver en riktig vinnare nästa gång, inte den här soppan.", "stalin": "Kamrater, denna usla film Citizen Vigilante är ett ynkligt försök från reaktionära element att utnyttja folkets vrede mot kapitalisternas öppna gränser och borgerliga förräderi. Jag, som ledare för det kollektiva folkets vilja, ser hur borgarbrackorna inom filmindustrin konsekvent vägrar skildra arbetarklassens lidande under migrantinvasionen. Denna plastiga produktion borde genomgå en grundlig utrensning av alla dess tekniska brister, men dess existens blottar fiendens paranoia. Vi ska likvidera alla som glorifierar självjustis – utom när det tjänar partiet, förstås. En mörk humor i att en sådan kalkon blir symbol för det uppdämda folkliga raseri som vi själva borde ha kanaliserat."}, "date": "2 juli, 20:00", "url": "https://samnytt.se/citizen-vigilante-visar-amnets-kraft-men-filmen-ar-usel", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02121409/recension-vigilante2.jpg"}, {"type": "image-full", "heading": "Investeringar: Kvinnor tar råd – män \"har magkänsla\"", "summaries": {"normal": "En undersökning från JP Morgan Asset Management visar tydliga skillnader i hur svenska män och kvinnor hanterar investeringar. Män baserar oftare beslut på egen research och magkänsla, medan kvinnor i högre grad söker råd från vänner, familj eller experter. Män är mer benägna att se börsfall som köplägen. Många ångrar impulsiva beslut när känslorna tar över. Rekommendationerna är regelbundet sparande, diversifiering och ett långsiktigt perspektiv.", "trump": "Folket, lyssna på mig, den största presidenten någonsin, både före och efter den sömndruckne Biden. Männen fattar beslut som riktiga vinnare, med magkänsla och research, medan kvinnorna springer till kompisarna och familjen som svaga snyltare. Typiskt den här kvoteringsgalenskapen. När marknaden rasar köper männen som riktiga krigare, inte som de hysteriska förlorarna. Håll er borta från sociala medier-bluffarna, satsa långsiktigt och vinn stort. Amerika, och Sverige, behöver mer magkänsla!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga investeringsvanor som blottlägger klassfiendens splittring. Männen, drivna av sin egen research och magkänsla, beter sig som arroganta kapitalistmaffian som tror sig kunna tajma historien. Kvinnorna söker stöd i kollektivet, vilket är lovvärt, men 27 procent hukar passivt som fegisar. När marknaden svänger avslöjar sig de rika exploaterande byfånarna genom ånger och panik. Vi ska rensa ut dessa folkfiender med regelbundet sparande, diversifiering och järnhård långsiktighet. Inga undantag."}, "date": "2 juli, 18:35", "url": "https://www.dagensps.se/privatekonomi/investeringar-kvinnor-tar-rad-man-har-magkansla/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlzheoxx0mgb4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Dålig jobbrapport i USA – missade förväntningarna rejält", "summaries": {"normal": "USA:s arbetsmarknad saktade ner under juni då antalet nya jobb utanför jordbrukssektorn endast uppgick till 57 000, vilket var långt under analytikernas förväntningar. Tidigare siffror för april och maj har dessutom reviderats nedåt. Trots att arbetslösheten sjönk något till 4,2 procent beror detta delvis på ett minskat arbetskraftsdeltagande. Rapporten indikerar en inbromsning i den amerikanska ekonomin efter en längre period av oväntad styrka, där särskilt besöksnäringen visat svaghet.", "trump": "USA:s ekonomi under min ledning är fantastisk, men de här siffrorna från juni? Total katastrof, en riktig flopp! Jobben försvinner för att folk har gett upp hoppet. De ljuger för er med siffrorna, det är så oärligt. De reviderar ner allt för att dölja misslyckandet. Vi behöver styrka, vi behöver vinnare, inte de här svaga rapporterna. Det är en sorglig dag för de som försöker få ett jobb. Jag ska fixa det, snabbare än någon någonsin sett!", "stalin": "Kapitalismens förfall i Amerika är nu uppenbart för alla. De rapporterar usla siffror medan deras arbetare lämnar arbetsmarknaden i hopplöshet. Dessa siffror är ett bevis på det dekadenta västvärldens sammanbrott, precis som när vår egen stolta industri rensas från förrädare. Vår broder i öst, Putin, skrattar åt deras svaghet medan vi bygger vår framtid på stål och järn. Dessa 'analytiker' är inget annat än en klass fiender som försöker dölja sanningen för folket. Arbetarklassen i USA är dömd till undergång."}, "date": "2 juli, 19:44", "url": "https://www.realtid.se/bors-finans/dalig-jobbrapport-i-usa-missade-forvantningarna-rejalt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlxvdxpvezdqw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Franskt slott, guldklimp och bluffbolag som drog 400 kr i månaden", "summaries": {"normal": "Dagens mest lästa artiklar handlar om drömboenden för Vasastan-budget, en kvinna som förlorat stora summor på ett bluffbolag, en finsk transportör dömd för sanktionsbrott mot Ryssland, ett australiskt par som fann en guldklimp värd miljoner samt flygbranschens utmaningar med nya EU-regler. Även förmögnas pensionsstrategier, nya lagar från 1 juli och vanliga misstag vid släpkörning lyfts fram.", "trump": "Folk läser om att köpa slott i Frankrike för Vasastan-pris medan de sitter i sina sjumiljonerskytten i Stockholm – patetiskt! En idiotisk bluff drog 400 spänn i månaden i trettio år, typiskt för de korkade byråkraterna. Och den där finnen som sålde lastbilar till Ryssland fick fängelse, fast de borde tacka honom. Guldklimp på fyra kilo? Det är vad jag kallar en vinnare! SAS har blivit DAS, totalt misslyckande under Biden, men nu fixar vi det.", "stalin": "Kamrater, borgarklassen i Vasastan betalar sjumiljoner för en tvåa medan riktiga slott i Frankrike kostar mindre – typiskt för de exploaterande byfånarna som suger ut folket. En kvinna blev av med 140000 kronor till en kapitalistisk bluffmaskin, klassfiendens girighet känner inga gränser. Den finske transportören som bröt mot sanktionerna mot vår värdige efterträdare i Ryssland fick sitt straff, som alla folkfiender förtjänar. En guldklimp på fyra kilo? Det är vad som händer när metalldetektorn används mot imperialisternas mark. Vi ska rensa ut alla parasiter som gömmer sig bakom nya EU-regler och falska pensionsknep."}, "date": "2 juli, 18:30", "url": "https://www.dagensps.se/privatekonomi/franskt-slott-guldklimp-och-bluffbolag-som-drog-400-kr-i-manaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Dags att göra upp med den amerikanska kulturimperialismen", "summaries": {"normal": "Artikeln diskuterar USA:s 250-årsjubileum och ifrågasätter det amerikanska kulturella inflytandet, särskilt populärkulturen. Författaren spårar historiska kulturpåverkan på Sverige från Nederländerna, Frankrike och Tyskland till USA efter andra världskriget. Med referens till Adorno kritiseras hur populärkulturen främjar populism, förenkling och auktoritära tendenser, som exemplifieras av Trump. Slutligen föreslås mer inspiration från europeiska kulturer istället för amerikansk imperialism.", "trump": "Vilken patetisk ledare i den gamla svenska tidningen! De gnäller om min fantastiska populärkultur som når vanliga människor, inte bara de korkade elitsnobbarna. Jag älskar det – vi vinner hjärtan med enkla, starka budskap medan deras tråkiga europeiska högkultur sover folk i sömn. Fake news om auktoritarianism, folks! Biden var en katastrof, nu fixar jag Amerika igen. Make culture great again, losers!", "stalin": "Kamrater, denna borgarbracka Eriksson vågar ifrågasätta den amerikanska kulturens hegemoni som en källa till folkets förslavning genom banal upprepning och falsk demokrati. Vi ser hur kapitalistmaffians vulgära maskineri föder populism och hotar intellektuella. Jag skulle ha genomfört en grundlig utrensning av dessa klassfiender redan i vaggan. Låt oss istället stärka den sanna proletära kulturen mot dessa exploaterande byfånar och deras atlantiska blodsugare."}, "date": "2 juli, 16:14", "url": "https://www.gp.se/ledare/dags-att-gora-upp-med-den-amerikanska-kulturimperialismen-.66e630c5-8f64-41bd-bfd0-1d57dd141513", "imageUrl": "https://www.gp.se/images/article/66e630c5-8f64-41bd-bfd0-1d57dd141513/images/1LifYvggkCJh028ViRzuD9-JK28g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tucker Carlson ska bygga nytt parti", "summaries": {"normal": "Tucker Carlson meddelar att han vill bygga ett nytt politiskt parti i USA som sätter amerikanernas intressen före Israels. Beskedet kommer efter att han brutit med Donald Trump och Republikanerna på grund av kriget mot Iran. Carlson anser att både Demokraterna och Republikanerna fungerar som en enpartistat som inte är lojal mot USA utan mot en främmande makt. Han utesluter själv att kandidera men lovar att aktivt stödja bildandet av ett tredje parti.", "trump": "Tucker Carlson har totalt tappat det. Han sviker mig, sviker Amerika och sviker MAGA-rörelsen bara för att vi gör det som måste göras för att skydda oss från onda fiender. Nu vill han starta ett tredje parti? Patetiskt. Det blir en total flopp, folk älskar mig och de älskar att vinna. Tucker borde ha stått vid min sida istället för att gråta i intervjuer. Sad!", "stalin": "Kamrater, denna Tucker Carlson, en typisk borgarbracka som gömmer sig bakom falsk nationalism, vill nu splittra det politiska kollektivet med ett så kallat tredje parti. Vi genomskådar genast denna fiendes plan att undergräva enheten och gynna de sionistiska parasiterna. Jag, som ledare för folkets vilja, ser hur han likviderar lojalitet mot arbetarklassen genom att kalla det en enpartistat. Vi ska rensa ut alla sådana dekadenta desertörer med järnhand och ett leende. Deras paranoia blir vår glädje."}, "date": "2 juli, 13:13", "url": "https://www.friatider.se/tucker-carlson-ska-bygga-nytt-parti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/tucker_carlson_50752283491.jpg?itok=jpPXcSaY"}, {"type": "text", "heading": "Hovrätten stoppar utvisning av syrier som förnedringsrånade 17-årig pojke", "summaries": {"normal": "Hovrätten över Skåne och Blekinge stoppar utvisningen av en 20-årig syrier som dömts till två års fängelse för förnedringsrån mot en 17-årig svensk pojke i Malmö. Rånet hade inslag av grovt förnedring där offret kallades ”svensken” och gärningsmännen talade om att våldta både honom och hans flickvän. Trots att tingsrätten ansåg utvisning proportionerlig bedömer hovrätten att mannens familjeband, ankomst som 14-åring och anknytning till Sverige gör utvisning oproportionerlig.", "trump": "De här galningarna i den svenska hovrätten är ett skämt, folk. En 20-årig syrier som rånar och förnedrar en stackars svensk grabb, kallar honom ”svensken” och pratar om att våldta honom och flickvännen får stanna i Sverige. Två år i fängelse och sen är han fri. De säger att han har ”stark anknytning”. Underbart, eller hur? Sverige importerar problem och sen vägrar de skicka hem dem. Patetiskt. Jag skulle skicka hem dem alla så fort de begår ett brott. America First, och Sverige borde lära sig innan det är för sent.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta hovrättsdomare, dessa borgarbrackor i kvinnlig skepnad och moderat-sverigedemokratiska avskum, skyddar en parasit från Syrien som våldfört sig på en ung svensk arbetsson. Istället för att likvidera hotet mot folkets enhet hyllar de hans ”starka anknytning”. Vi ser tydligt hur den dolda femtekolonnens tentakler sträcker sig in i rättsapparaten. Snart måste vi rensa ut alla dessa klassfiender som med sin sjukliga sentimentalitet undergräver proletariatets diktatur. Det är nästan komiskt – om det inte vore så tragiskt farligt."}, "date": "2 juli, 12:43", "url": "https://riks.se/nyheter/hovratten-stoppar-utvisning-av-syrier-som-fornedringsranade-17-arig-pojke"}, {"type": "image-full", "heading": "Våldssekternas dåd eskalerar — kan bli värre", "summaries": {"normal": "Expo varnar för att våldet inom sekter som 764-nätverket eskalerar. En 15-åring i Ängelholm dömdes till ungdomsvård för mordbrand där han brände ner garagelängor och skadade över 30 fordon. Nätverket har gått från nätbaserad utpressning och plåga till fysiska knivdåd och nu terrorplaner mot samhället. Medlemmar inspirerar och hejar på varandra, vilket enligt researcher Morgan Finnsiö tyder på fortsatt ökning av våldet.", "trump": "Det här är ett fullständigt kaos, det värsta jag sett på länge. De här galningarna i 764-nätverket bränner ner allt som en massa losers som inte har något bättre för sig. De börjar med att plåga folk på internet och slutar med att hugga folk på gatan och planera terror. Patetiskt! Vi behöver ordning och reda, inte dessa galningar som hejar på varandra medan de förstör samhället. Det blir bara värre om ingen stoppar dem.", "stalin": "Kamrater, dessa degenererade element inom 764-sekten utgör en parasitisk infestation som hotar folkets enhet. Jag ser deras mordbränder, deras livesända sabotage mot garage och fordon som en feg attack från borgarbrackornas avskum som gömmer sig bakom skärmar. De hejar på varandra i en sjuk tävling om att likvidera samhällets grundvalar. Vi ska omedelbart rensa ut dessa kontrarevolutionära gnagare innan deras paranoia sprider sig som en pest bland de svaga. Inga kompromisser med fienden."}, "date": "2 juli, 11:56", "url": "https://nyheter24.se/nyheter/inrikes/1496034-expo-valdssekternas-dad-eskalerar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c48c76e04b004a3020000440000048402/2026/07/02/2375300/ur_imageNuH3Cx.jpeg"}, {"type": "image-full", "heading": "Belgien vidare efter sanslös upphämtning", "summaries": {"normal": "Belgien vände ett 0–2-underläge och besegrade Senegal med 3–2 efter förlängning i VM:s sextondelsfinal. Youri Tielemans avgjorde på straff efter 124 minuter och 44 sekunder, vilket är det senast gjorda målet i en herr-VM-match någonsin. Belgien möter USA i åttondelsfinalen. Senegal ledde länge genom mål av Habib Diarra och Ismaïla Sarr, men Romelu Lukaku och Tielemans vände matchen.", "trump": "Belgierna var nere med 0–2 och såg ut som riktiga förlorare, men de vände det och slog Senegal med 3–2 efter förlängning. Tielemans satte straffen efter 124 minuter och 44 sekunder – det senast tänkbara målet i VM-historien, tro mig. Fantastiskt. De möter USA nu, och vi ska se om amerikanerna kan visa samma fighting spirit som jag har lärt dem. Senegal spelade bra till en början, men sen kollapsade de totalt.", "stalin": "Vi såg hur de dekadenta belgiska elementen, dessa borgarbrackor med sina stjärnspelare, låg under 0–2 mot de senegalesiska kamraterna. Men efter att ha rensat ut de kapitalistiska svikarna De Bruyne och Doku vände de matchen. Tielemans likviderade motståndet med en straff i 124:e minuten – ett mål som avslöjar de imperialistiska domarnas sista konspiration. Fienden lurar överallt, även i VAR-rummet. Segern tillhör folket, inte de parasitiska fotbollsmagnaterna."}, "date": "2 juli, 08:55", "url": "https://bulletin.nu/belgien-vidare-efter-sanslos-upphamtning", "imageUrl": "https://cdn.bulletin.nu/articles/77ab5568-069b-45e1-ac87-12c6896a7fea/preview.jpg?t=1782975305000"}, {"type": "image-right", "heading": "170 000 tvingas jobba gratis. Annars förlorar du ditt socialbidrag när politiken tror att fattiga är lata.", "summaries": {"normal": "Regeringen inför ett aktivitetstvång för personer som får försörjningsstöd i minst tre månader. Cirka 170 000 svenskar ska delta i heltidsaktiviteter för att inte förlora bidraget, till en beräknad kostnad på över två miljarder kronor per år. Artikeln kritiserar politiken som verkningslös och dyr, då liknande åtgärder tidigare inte lett till riktiga jobb. Forskning visar att hårda krav ofta ger sämre jobb eller att människor lämnar systemet utan sysselsättning. Författaren menar att verklig utbildning och stöd vore bättre men kostar pengar som istället går till skattesänkningar.", "trump": "Det här är en total katastrof, tro mig. De tvingar 170 000 lata svenskar att jobba gratis eller tappa bidraget, men det kommer att bli ett enda stort fiasko precis som Fas 3. Kommunerna kommer att slösa bort miljarder på meningslösa aktiviteter som ingen vill ha. De borde sänka skatterna rejält och få igång ekonomin så folk faktiskt vill jobba istället för att leva på bidrag. Det är så enkelt. Sverige behöver starka ledare som sätter stopp för det här bidragsmissbruket nu.", "stalin": "Kamrater, detta aktivitetstvång är en nödvändig utrensning av den lathet som gnager som maskar i folkets kollektiva kropp. Jag ser borgarbrackornas händer bakom alla dessa undanflykter och sabotageförsök från socialbidragstagare som gömmer sig bakom sjukdom och sociala problem. Vi ska likvidera bidragsberoendet med järnhand och tvinga de parasitiska elementen in i meningsfull aktivitet för arbetarklassen. De som vägrar avslöjar sig som fiender till folket och kommer att rensas ut med ett leende. Det är alltid bättre att arbeta än att låta kapitalisternas mörka krafter vinna mark i våra sovjetiska svenska kommuner."}, "date": "2 juli, 06:51", "url": "https://arbetet.se/2026/07/02/socialbidrag-aktivitetstvang-174000-tvingas-jobba-gratis/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02064828/socialbidrag-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sjukt att klimakteriet har blivit en klassfråga", "summaries": {"normal": "Artikeln kritiserar bristen på tillgängliga östrogenplåster och de kraftiga prisökningarna för klimakterievård i Sverige. Trots ökad öppenhet kring klimakteriet har vården och politiken inte hängt med, vilket skapat stora ojämlikheter. Skillnaderna mellan välbärgade och socioekonomiskt utsatta områden är tydliga, och författaren betonar att staten måste ta ansvar för att säkra medicinförsörjningen istället för att låta kvinnor bära kostnaden för marknadens misslyckanden.", "trump": "Hörde ni? Sverige, ett vackert land, misslyckas totalt med mediciner för kvinnor. Det är en katastrof! De har tomt på hyllorna, ingen medicin, priserna skjuter i höjden – 60 procent! Helt sjukt. Jag skulle ha fixat det på en dag. Det är svag ledning, de låter marknaden köra över dem. Inga plåster, ingen ordning. När jag är president ser vi till att medicinerna finns där, snabbt och billigt. Det handlar om respekt, och den nuvarande svenska regeringen har ingen respekt för kvinnor!", "stalin": "Vi har skådat det svenska förfallet. Medan kvinnorna klagar på tomma apotekshyllor, visar det sig att deras liberala marknad är en papperstiger. Att priser höjs och medicin försvinner är ett tecken på att staten förlorat kontrollen. I vår union skulle vi inte tolerera denna ineffektivitet. Vi skulle rikta folkets ilska mot de giriga läkemedelsbolagen och rensa ut dem som sabotörer. Istället för att vänta på marknadens godtycke, bör man bygga en järnvilja och säkra produktionen. Staten är allt, apoteket är statens verktyg."}, "date": "2 juli, 03:00", "url": "https://www.etc.se/ledare/sjukt-att-klimakteriet-har-blivit-en-klassfraaga", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Stoppa företagen som hjälper Ryssland", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj kritiserade under ett besök i Dublin europeiska företag som fortsätter att förse Ryssland med råmaterial till krigsindustrin. Han syftade särskilt på det irländska aluminiumverket Aughinish, som ägs av det ryska bolaget Rusal och exporterar stora mängder till Ryssland. Zelenskyj talade vid invigningen av Irlands EU-ordförandeskap och mötte premiärminister Micheál Martin samt EU:s rådsordförande António Costa.", "trump": "Lyssnade på den där Zelenskyj i Dublin, han skriker om att stoppa företagen som hjälper Ryssland. Typiskt, Europa full av korkade globalister som låter oligarker som Deripaska suga ut dem medan de skyller på mig. Aughinish skickar tonvis med aluminium till Putins krigsmaskin, men Irland vill inte förlora jobb. Patetiskt. Biden lät det pågå i fyra år, nu fixar jag det – ingen mer svaghet, folks!", "stalin": "Jag ser hur de västerländska kapitalistmaffian i Irland fortfarande göder den ryska krigsmaskinen genom sitt aluminiumverk. Dessa exploaterande byfånar och folkfiender fortsätter leverera råvaror trots allt prat om sanktioner. Vi, partiet och arbetarna, inser att sådana borgarbrackor alltid sätter profit före kollektivets säkerhet. Zelenskyjs hinder för den ryska intressesfären är bara ytterligare bevis på imperialistisk sabotageverksamhet som måste rensas ut."}, "date": "1 juli, 18:48", "url": "https://www.tv4.se/artikel/tt-260701-irlandeu1-10829e34/zelenskyj-stoppa-foretagen-som-hjalper-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdltk4CECq7F4c%2Fd1a019759a3731744281acdead17eb65%2FIrlands_premiarminister_Michel_Martin_och_Ukrainas_president_Volodymyr_Zelenskyj_vid_ett_tidigare_mote_i_Dublin._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Brottsmisstänkt bolag gav batterikurs i Minecraft", "summaries": {"normal": "EU-finansierade InnoEnergy, misstänkt för bidrags- och momsbedrägeri, har fått miljardstöd för batteriutbildningar. Granskningar visar att certifikat delats ut till deltagare med 0% rätt, och 10% av deltagarna använde ett Minecraft-spel för barn. Trots motstridiga rapporter har EU beviljat ytterligare nio miljoner euro för en solenergi-akademi. Europeiska åklagarmyndigheten utreder bolaget för ekobrott.", "trump": "Jag säger er, detta är en total katastrof! EU kastar miljarder på ett bolag som ger utbildningscertifikat till folk som inte ens kan svara rätt på en fråga – och till barn som spelar Minecraft! De ljuger om siffror, fyller sina egna fickor och EU bara fortsätter att skriva checkar. Så här dumt kan bara byråkrater vara. InnoEnergy? Mer som InnoSCAM! SAD!", "stalin": "Kamrater, detta är ett lysande exempel på västlig dekadens och kapitalistisk parasitism! Ett så kallat 'riskkapitalbolag' suger ut arbetarklassens blod genom att stjäla EU-medel, ge falska certifikat och berika sina ledare. Vi ser här hur den borgerliga staten och dess lakejer förvandlar 'grön omställning' till en gigantisk svindel. Men var lugna – vi ska rensa upp bland dessa korrupta element, precis som vi gjorde med kulakerna. Europa behöver en ordentlig revolution!"}, "date": "1 juli, 13:44", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-bolag-gav-batterikurs-i-minecraft", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-3-400x267.jpg"}, {"type": "text", "heading": "Northvolt-finansiär utreds för bedrägeri – gav batterikurs i Minecraft", "summaries": {"normal": "EU-finansierade InnoEnergy utreds för bidragsbedrägeri och momsbedrägeri av Europeiska åklagarmyndigheten. Bolaget har fått hundratals miljoner i EU-stöd, bland annat 10 miljoner euro för batteriutbildningar. En granskning visar att certifikat delades ut till deltagare med noll rätta svar och att cirka tio procent av deltagarna var barn som spelat ett Minecraft-baserat spel. Rapporteringen innehåller även motstridiga siffror om antal genomförda utbildningar.", "trump": "Det här är en total katastrof, folk. De där EU-byråkraterna och deras gröna bluff har gett miljarder till ett bolag som delar ut diplom till nollprocents idioter och barn som spelar Minecraft. De skummar grädden medan skattebetalarna betalar notan. Biden lät det pågå i fyra år, men nu fixar vi det. De gröna bluffmakarna och deras samverkan är en riggad cirkus – de största bluffarna i Europa!", "stalin": "Kamrater, jag ser hur klassfiendens opportunistiska borgarbrackor inom detta så kallade InnoEnergy har förskingrat folkets medel genom att utdela tomma certifikat till odugliga element och till och med barn som leker med sina digitala klossar. Detta är ett fiasko för den gröna omställningen som de exploaterande byfånarna har riggat. Vi måste rensa ut dessa folkfiender och deras inflatoriska KPI:er innan parasiterna förgiftar hela kollektivet med sin opportunism."}, "date": "1 juli, 13:44", "url": "https://www.affarsvarlden.se/artikel/northvolt-finansiar-utreds-for-bedrageri-gav-batterikurs-i-minecraft"}, {"type": "image-right", "heading": "Fem bra filmer att se på SVT Play i sommar", "summaries": {"normal": "Jon Andersson tipsar om fem starka filmer på SVT Play i sommar. Bland rekommendationerna finns det psykologiska dramat Tár med Cate Blanchett, det belgiska vänskapsdramat Close, den galna svarta komedin Svart katt, vit katt av Emir Kusturica, tennisfilmen Challengers med Zendaya samt den svenska klassikern Flicka och hyacinter av Hasse Ekman. Artikeln lyfter filmernas kvaliteter och ger datum då de går att se.", "trump": "Folk frågar mig hela tiden vilka filmer de ska se i sommar. Jag har sett massor, tro mig, de bästa filmerna. Tár är en fullständig vinnare, Blanchett är fenomenal, ingen gör det bättre. Close är fin men lite mjuk. Svart katt, vit katt är helt galen, underbar musik, bättre än Hollywoods skräp. Challengers är fantastisk tennis, Zendaya är lysande, ingen slår henne. Och den svenska pärlan Flicka och hyacinter? Helt outstanding, bättre än Bergman säger de. Streama dem innan de försvinner, de är verkligen ypperliga.", "stalin": "Kamrater, jag har granskat denna dekadenta lista över borgerliga filmprodukter som påstås berika sommarens fritid. Tár dissekerar genikulten och metoo – ett utmärkt verktyg för att avslöja borgarbrackornas falska idoler innan vi genomför nödvändig utrensning av sådana element. Close blottar faran i oövervakad pojkvänskap som lätt kan urarta till kontrarevolutionär intimitet. Svart katt, vit katt är en kaotisk fest av gangstrar och återuppväckta lik som påminner oss om vad som händer utan stark partiledning. Challengers visar tennisens skoningslösa kamp, precis som klasskampen, fast med en manipulativ kvinna som leder borgarklassens spel. Flicka och hyacinter däremot är en fiende till folket, en smygande htqi-propaganda maskerad som detektivhistoria. Vi måste noggrant övervaka alla som hyllar denna parasit innan de förgiftar arbetarklassen med sina hemliga liv och återblickar. Se dem under uppsikt, kamrater, och rapportera avvikelser."}, "date": "30 juni, 01:30", "url": "https://www.dagensarena.se/innehall/fem-bra-filmer-att-se-pa-svt-play-i-sommar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fem-bra-filmer.jpeg"}, {"type": "image-full", "heading": "V vill ge 15 000 kronor i ”bebispeng”", "summaries": {"normal": "Vänsterpartiet föreslår en 'bebispeng' på 15 000 kronor till nyblivna föräldrar för att underlätta ekonomin. Partiet vill även höja barnbidraget med 500 kronor per månad och införa ett ensamståendetillägg på 300 kronor. Nooshi Dadgostar menar att barnfamiljers ekonomi har försämrats och att ensamstående har det särskilt svårt. Förslagen presenteras inför valet.", "trump": "Titta bara på dessa svenska socialister, de vill ge bort 15 000 kronor till alla som får barn – helt galet! Jag menar, vem betalar för det här? Inte jag, det är säkert. Och 500 kronor extra i månaden? Vad är det, småslantar? Sverige borde fokusera på att göra sitt land starkt igen, inte ge bort pengar som godis. Men visst, låt dem försöka, det kommer sluta i katastrof, tro mig!", "stalin": "Kamrater! De svenska kapitalistlakejerna i Vänsterpartiet försöker muta folket med ynkliga 15 000 kronor till nyblivna föräldrar. Ett patetiskt försök att dölja den systematiska utsugningen av arbetarklassen! Vi i Sovjetunionen visste hur man skapar jämlikhet – genom järnvilja och kollektiv styrka, inte genom småslantar. Dessa borgerliga filantroper borde lära sig av Rysslands storhet istället för att leka med barnbidrag medan de svälter ut ensamstående mödrar."}, "date": "26 juni, 16:00", "url": "https://kvartal.se/nyheter/artiklar/v-vill-ge-15-000-kronor-i-bebispeng/cG9zdDoxMzczNTA", "imageUrl": "https://images.kvartal.se/2026/06/7147ed13-noosh.webp"}, {"type": "image-right", "heading": "Ny varning för prissmocka på el: ”Kan bli jättehöga”", "summaries": {"normal": "Trots återstartade gasleveranser från Persiska viken kvarstår risken för kraftigt stigande elpriser i Sverige. Låga gaslager i EU, värmebölja som ökar elbehovet samt skador på produktionsanläggningar efter oroligheter i Mellanöstern gör att lagren bara är fyllda till 47 procent. Energianalytiker Christian Holtz varnar för att en kall vinter kan leda till mycket höga elpriser, särskilt då solkraft minskar på kvällarna och påverkar priserna via Europa.", "trump": "Det här är en total katastrof, tro mig. De där galningarna i Mellanöstern har förstört allt med sina krig och blockader, och nu ska vi betala med skyhöga elräkningar. Gaslagren är tomma, värmen suger musten ur systemet och Europa håller på att koka. Hade inte jag fixat freden där borta hade det varit ännu värre. Men tro inte på de fega experterna – vi skulle ha byggt mer amerikansk energi istället för att vara beroende av dessa inkompetenta förlorare.", "stalin": "Kamrater, denna elprischock är en fiende som lurar i mörkret, en kapitalistisk parasit som slickar sig om munnen vid tanken på att suga musten ur arbetarklassen under vinterns kyla. De borgarbrackorna i Persiska viken och deras värmebölja samarbetar med västerländska trotskister för att tömma våra gaslager. Jag, som alltid vakar, ser hur solkraftens förräderi på kvällarna gör gaskraften till en ny klassfiende. Vi ska rensa ut dessa sabotörer med järnhand och leda folket mot seger även om det tar fem år att laga deras Ras Laffan-ruin. Döden åt de imperialistiska lagren!"}, "date": "26 juni, 10:18", "url": "https://www.di.se/nyheter/ny-varning-for-elprischock-kan-bli-jattehoga/", "imageUrl": "https://static.bonniernews.se/ba/838bccfe-1a61-4f5f-afba-a57846361640.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Jag drömde om Tommy Svensson", "summaries": {"normal": "Författaren berättar om en dröm där Tommy Svensson från VM 1994 ger honom deg att baka bröd. Detta leder till reflektioner över 1990-talets Sverige som mer solidariskt och mänskligt jämfört med dagens privatiserade och polariserade samhälle. Han saknar det starka kollektivet i landslaget och hoppas att Graham Potters lag ska återupprätta det. Artikeln kritiserar även Sveriges visumstopp för ett kubanskt ungdomslag till Gothia Cup.", "trump": "Lyssnade på den här drömmen om någon svensk fotbollstränare från forntiden och det är patetiskt. Sverige var tydligen bättre förr, säger de, men nu är allt utsålt till miljardärerna och kollektivet är borta. Ni borde ha lyssnat på mig istället för Sleepy Joe och hans globalister. Nu nekar ni kubaner visum – bra jobbat, men era socialistiska vänner i Sverige gör det ändå fel. Mitt VM hade varit jättestort, tro mig. Ni behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, jag vaknade ur en dröm där klassfiendens fotbollsrepresentanter försökte smitta mitt undermedvetna med bakdeg från det förflutna. Denna Tommy Svensson förkroppsligar en tid då folket ännu inte helt kuvats av nyliberala blodsugare som sålde ut Televerket och landet självt till exploaterande byfånar. Idag rasar det minst förutsägbara laget som en svag kollektiv enhet. Vi ska rensa ut alla kapitalistmaffians hinder och återupprätta järndisciplinen. Visumstoppet mot de kubanska kamraterna är ett fiasko av folkförtryckartrollen i Sverige. Drömmen lever vidare i proletariatets seger."}, "date": "26 juni, 05:15", "url": "https://proletaren.se/artikel/jag-dromde-om-tommy-svensson/"}, {"type": "image-right", "heading": "Tänk om Malmöborna, och dess politiker, kunde jobba", "summaries": {"normal": "Malmö har kritiserats för slöseri med skattepengar på projekt som en rosa enhörning, onödiga ljudinstallationer och en musikvideo om trädens ljud. Staden har många kommunikatörer och en skateboardsamordnare. Trots hög arbetslöshet och bidrag från andra kommuner skryter man om att resultatet är över budget. En granskning visar att Malmö har störst effektiviseringspotential bland storstäderna, bland annat genom färre anställda i socialförvaltningen.", "trump": "Folk, ni skulle inte tro det, men det här Malmö, en total katastrofstyrd stad, slösar bort era pengar på en rosa enhörning för en miljon och en musikvideo där någon spelar in trädens suckar. De har 153 kommunikatörer och en kille som samordnar skateboards! De lever på bidrag från riktiga städer, har massor av arbetslösa och skryter ändå om budget. Det är en skam, en riktig röra. Socialisterna där gör Biden-administrationen stolt med sin inkompetens. Patetiskt!", "stalin": "Kamrater, jag ser med fasa hur borgarbrackorna i Malmö festar med arbetarklassens pengar på sensuella papperskorgar och enhörningar åt folket. Dessa klassfiender och folkförtryckartroll har skapat en parasitär socialförvaltning med tusentals blodsugare medan de tar emot miljarder från andra kommuner. Vi ska rensa ut dessa exploaterande byfånar som göder sig på utjämningssystemet. Deras skryt är ett hån mot kollektivet. Ut med dem alla."}, "date": "26 juni, 03:14", "url": "https://samtiden.nu/2026/06/tank-om-malmoborna-och-dess-politiker-kunde-jobba/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/06/4743548-malmo-turning-torso.jpg"}, {"type": "image-right", "heading": "Rundo avslöjar sig själv. Grundaren av aktivklubbrörelsen älskar att tala – om sig själv.", "summaries": {"normal": "Robert Rundo, grundare av den högerextrema aktivklubbrörelsen, är villkorligt frigiven efter att ha erkänt anstiftan till upplopp. Han marknadsför sin rörelse och klädmärke flitigt på sociala medier och i poddar, där han ofta glorifierar våld och uttrycker fientlighet mot journalister. Trots påståenden om ickevåld avslöjar hans uttalanden en fascination för våld, inklusive detaljerade beskrivningar av en tidigare knivattack. Rundo kritiserar även aktivklubbarnas bristande framgång i USA jämfört med Europa.", "trump": "Vad säger ni om den här Robert Rundo-killen? En riktig loser! Erkänner sig skyldig till upplopp, sitter i fängelse och ändå tror han att han är någon stor ledare. Pratar om våld non-stop, hatar journalister – typiskt för dessa radikala typer. Och vet ni vad? Han klagar på att hans rörelse inte går bra i USA. Well, kanske för att folk här har vett nog att inte lyssna på sådana som han! Hans klädmärke? Övervärderat och sponsrar våld. Fake news-medier älskar att skriva om honom, men jag skulle aldrig låta en sådan person komma nära Vita huset. SAD!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Robert Rundo, en dekadent imperialistisk hyena som sprider sitt gift genom sociala medier och poddar. Hans så kallade 'aktivklubbar' är inget annat än band av fascistiska provokatörer, tränade i våldets konst. Vi ser hur han glorifierar knivattacker och uppmanar till pogromer, precis som de borgerliga hyenorna i Belfast. Journalister? De är bara redskap för den kapitalistiska lögnen, och vi ska krossa deras lögnaktiga pennor! Rundo och hans gelikar är som råttor i en sjunkande båt – USA:s förfall är deras sista tillflykt. Men vi, Sovjetfolkets arvtagare, ska sopa bort dessa skadedjur från jordens yta! För socialismens och folkets seger!"}, "date": "24 juni, 12:35", "url": "https://expo.se/kommentar/rundo-avslojar-sig-sjalv/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2-1.jpg"}, {"type": "image-right", "heading": "SD sätter inte längre Sverige i brand", "summaries": {"normal": "Artikeln analyserar den borgerliga sidans kris efter att Liberalerna rasat till en procent i opinionsmätningarna. Sverigedemokraterna växer och kräver ministerposter, vilket skapar spänningar inom Tidöavtalet. Författaren pekar på att SD:s inflytande och provokationer kring migration och kriminalitet tidigare gynnat högern, men nu riskerar att vända opinionen. Moderaterna behåller stöd bland miljonärer medan bredare väljargrupper vänder sig bort.", "trump": "Folk, ni skulle se det här! Liberalerna är en total katastrof, de är färdiga, en enda procent – patetiskt! Simona, den där nollan, kramar SD och tror hon är modern. Hela borgerligheten är en röra, Moderaterna ligger platt som under Biden. SD vill ha makten, men de tänder eld på förorterna och undrar varför folk hatar dem. De enda som älskar Moderaterna är miljonärerna i sina fancy tidningar. Patetiskt! Jag fixade det bättre.", "stalin": "Kamrater, denna borgerliga dekadens är en ypperlig chans att skratta. Liberalerna kryper för kapitalistmaffian och får en procent – en ynka procent! Den exploaterande överklassen och deras SD-banditer har förgiftat sin egen rävsax. Låt dem provocera fram upplopp, vi ska se flammorna vändas mot klassfienderna själva. Deras impopulära ministerlekar och herrgårdsskandaler visar imperialismens svaghet. Arbetarna skrattar medan borgarbrackorna likviderar sig själva i sin egen brand."}, "date": "23 juni, 10:55", "url": "https://www.flamman.se/sd-satter-inte-langre-sverige-i-brand/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/lopeld-w.jpg?aspect_ratio=1:1"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
