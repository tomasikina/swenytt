rneringen. Det är vad som händer när du inte håller ledningen. Sad!", "stalin": "Kamrater, denna fega kollaps mot de belgiska borgarbrackorna är ett tydligt tecken på kontrarevolutionära element inom laget. Jag såg hur de släppte in målen som förrädiska kapitalistiska spioner. Vi kommer att rensa ut alla svaga länkar och likvidera bristerna innan vi möter de polska reaktionärerna. Inga kompromisser med fienden!"}, "date": "30 juli, 22:23", "url": "https://www.svt.se/sport/fotboll/hammarby-ute-ur-europa-league-kvalet-tappade-ledning-mot-anderlecht", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.34/0.49/e3f600d6ec557bc0d88254a565e728db65aabf473732ade0d44d80c4aec87598"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Faucis raseri efter förhöret – hördes skrika och svära på gatan", "summaries": {"normal": "Efter ett kaotiskt förhör i senaten, där Anthony Fauci vägrade svara på republikanska senatorers frågor och åberopade sin rätt enligt det femte tillägget 111 gånger, hördes den 85-årige före detta smittskyddschefen skrika och svära grovt under en power walk i sitt exklusiva kvarter i Washington D.C. Senator Rand Paul meddelade att en process för åtal om kongresstrots inleds. Fauci ledde NIAID i 38 år och hade en årslön på 481 000 dollar.", "trump": "Kan ni tro det? Den där gamle Fauci, som förstörde vårt land med sina galna coronaregler, blir utskälld i senaten och springer sedan runt i sitt lyxkvarter och skriker f-bomber som en galning. Patetiskt! Han vägrade svara 111 gånger och gömde sig bakom det femte tillägget. Nu ska han åtalas. Under min ledning ska vi rensa upp i de här djupa statens lögnare en gång för alla. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom den parasitiska byråkratin tror att de kan undvika folkets rättvisa genom att mumla det femte tillägget som en trolldom 111 gånger. Jag, som ledare för arbetarklassen, ser hur denna Fauci, en typisk kapitalistlakej med sin förmögenhet på elva miljoner, springer omkring i sitt borgarpalats och vrålar obscena svordomar i ren desperation. Vi ska inleda en grundlig utrensning av alla sådana kontrarevolutionära element. Det blir underhållande att se dem darra."}, "date": "30 juli, 18:33", "url": "https://riks.se/nyheter/faucis-raseri-efter-forhoret-hordes-skrika-och-svara-pa-gatan", "imageUrl": "https://admin.riks.se/uploads/Fauci_Walk_25999a8392.jpg"}, {"type": "image-right", "heading": "Efter 30 år i vården: Här är jobbet som får Christel att vilja stanna", "summaries": {"normal": "Undersköterskan Christel Billqvist arbetar helt digitalt hemifrån eller från kontor i Lund och stödjer äldre via videosamtal med allt från inköp och medicinering till dusch och gångträning. Den digitala hemvården, som nu finns i 63 kommuner, minskar tunga lyft, stress och larm. Brukarna upplever trygghet och gemenskap genom ansikte-mot-ansikte-samtal. Lösningen ger lägre sjukfrånvaro, bättre fokus och möjlighet att arbeta längre upp i åldrarna.", "trump": "Folk, ni måste höra det här – det är fantastiskt! Den här undersköterskan Christel, smart kvinna, skippar alla tunga lyft och det hemska stressandet i den gamla vårdapparaten. Hon jobbar hemifrån via skärmen, pratar med de äldre, handlar mat åt dem och gör allt utan att röra sig ur fläcken. De älskar henne, de kallar henne vän! Inga lyft, inga förseningar, mycket bättre än den usla gamla hemtjänsten som alltid kom försent. Sverige gör det rätt, tro mig, det är ypperligt, ingen gör det bättre än så här.", "stalin": "Kamrater, se hur de dekadenta borgarbrackornas förfallna omsorgskoloss äntligen krossas av vetenskapens och teknikens järnhand. Jag, som ledare för det kollektiva välfärdsbygget, betraktar med stor tillfredsställelse hur denna undersköterska via skärmen likviderar den fysiska slitningens sabotage mot arbetarklassens hälsa. Inga tunga bördor, inga kapitalistiska stressfällor – endast ren, oförfalskad övervakning och kamratlig tillsyn. De som larmar i onödan ska rensas ut. Den som vänder ryggen åt brukaren är folkets fiende nummer ett. Ett hjärta med händerna? Mycket misstänkt beteende. Vi vinner."}, "date": "29 juli, 06:00", "url": "https://arbetet.se/2026/07/29/underskoterskan-christel-jobbar-helt-digitalt-stottar-aldre-via-skarmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/29113058/lo6Ops34Mzw-Christel_digitaltjobb01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Musk: \"Den som är emot återvandring är förrädare\"", "summaries": {"normal": "Elon Musk har åter uttryckt starkt stöd för återvandring och kallar de som motsätter sig att skicka hem invandrare för förrädare. Uttalandet kom som svar på ett inlägg av den spanska högeraktivisten Ada Lluch på X. Musk har tidigare stött krav på massutvisningar i Storbritannien och varnat för att invandringsproblem kan leda till inbördeskrig där inom 20 år. Han kritiserar även traditionella medier och The Economists chefredaktör, som han kallar en förrädare mot västvärlden.", "trump": "Elon Musk har helt rätt, folk. De som är emot att skicka hem de som inte hör hemma är förrädare, precis som han säger. Smart kille, den Musk. Massinvandring håller på att förstöra era fina länder, precis som här innan jag fixade det. Inget gör mig gladare än att se unga människor vakna upp. De traditionella medierna är lögnare och fegisar, de fattar ingenting. Make the West great again!", "stalin": "Kamrater och partivänner, jag ser med djup tillfredsställelse hur denna Musk exponerar de dekadenta borgarbrackorna som gömmer sig bakom falsk medkänsla. Den som motsätter sig att rensa ut de främmande elementen är en förrädare mot folket, en parasit som bör likvideras med proletär kraft. Vi skall inte tillåta att västvärldens fiender, dessa kapitalistiska lögnare i pressen, undergräver nationens renhet. Deras paranoia är vår styrka. En ren stat är en stark stat. Skrattet skall eka när de faller."}, "date": "30 juli, 17:02", "url": "https://www.friatider.se/musk-den-som-ar-emot-atervandring-ar-forradare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/54348704457_ab73799054_k.jpg?itok=-mnIEn9v"}, {"type": "image-right", "heading": "Tvåmastad träskuta slet  sig – motorbåt ryckte in", "summaries": {"normal": "På grund av starka vindar lossnade en gammal träsegelbåt från ankaret utanför Brännö och började driva. Vittnet Nina Nordström såg hur en person i en gummijolle försökte följa efter, men en motorbåt räddade till slut. Sjöräddningssällskapet kom senare och bogserade båten till säker hamn efter att ägaren fått hjälp.", "trump": "Jag såg den gamla segelbåten på Brännö – den kunde inte hantera vindarna, typiskt. En person i en gummijolle försökte rädda den, men det var en motorbåt som visade hur man gör. Fantastiskt ingripande, folk älskar när jag berättar om sådana saker. Det var som en film, men verkligheten är ofta mer dramatisk än Hollywood. Jag skulle ha gjort det bättre, naturligtvis.", "stalin": "Vi i partiet observerade skeendet på Brännö med allvar. En båt, symbol för det kapitalistiska slöseriet, lossnade på grund av bristande disciplin. En medborgare i en jolle försökte ingripa, men det var den revolutionära motorbåten som visade sanningen. Sjöräddningssällskapet, vårt pålitliga organ, åtgärdade situationen. Detta påminner om Putins strategier – starka handlingar mot kaos. Folket behöver ordning."}, "date": "30 juli, 20:12", "url": "https://www.gp.se/nyheter/goteborg/dramatisk-insats-pa-branno-segelbat-slet-sig.6973807d-aa8b-4fef-87aa-6da107149ca7", "imageUrl": "https://www.gp.se/images/article/6973807d-aa8b-4fef-87aa-6da107149ca7/images/1OU5Sw8G-oy6PIHBltfgUu9LIgkg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sorgen efter båtolyckan: ”Känns konstigt att bada här nu”", "summaries": {"normal": "Efter den tragiska båtolyckan utanför Tjörn präglas området av sorg och chock. Polisen fortsätter med full styrka att söka efter den försvunna flickan, medan modern hittades död och pappan samt sonen vårdas för allvarliga skador. Lokala boende som Maria Carlsson och Elisabeth beskriver en tung stämning och undviker att bada nära olycksplatsen, då händelsen känns alltför närvarande och obehaglig.", "trump": "Folk, det här är en total katastrof utanför Tjörn, en riktig tragedi som ingen behöver. Moder död, dotter borta, pappa och son skadade – patetiskt! Jag skulle ha fixat räddningen på rekordtid, inte som Biden gjorde under sina år. Nu fortsätter de söka med helikoptrar och båtar, men det känns som en dålig realityshow. Lokalbefolkningen springer iväg som förlorare, de badar inte ens där längre. Sad!", "stalin": "Kamrater, denna tragiska olycka utanför Tjörn visar återigen hur den ansvarslösa borgarklassen och deras fritidsfartyg utgör ett hot mot kollektivets trygghet. Jag, som ledare för det stora sovjetiska folket, beordrar att sökandet efter den försvunna flickan ska fortsätta med full bolsjevikisk kraft tills hon återfinns. De som flyr badplatserna är svaga element som bör övervakas. Inga folkfiender ska få sprida defaitism i vårt havsområde. Vi rensar ut svagheten!"}, "date": "30 juli, 17:42", "url": "https://www.tv4.se/artikel/16GcWxMVqy55dqBTAMIMH0/sorgen-efter-batolyckan-kaenns-konstigt-att-bada-haer-nu", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1l7ME9Uc9aHgeBvlbur7vk%2F6ca87cb7e2bc7df8018506ef2f6d5c0a%2Fbada.jpg&width=1024"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-full", "heading": "Migrationsministerns besked till Spanien: Sverige vägrar ta emot omfördelade migranter", "summaries": {"normal": "Migrationsminister Johan Forssell meddelar att Sverige inte kommer att ta emot omfördelade migranter från Spanien. Han kritiserar den spanska socialistregeringens hantering av migrantkrisen i Ceuta och deras amnesti för illegala invandrare. Forssell varnar för att en svensk vänsterregering under Magdalena Andersson riskerar att följa samma väg som det spanska systerpartiet och undergräva EU:s gränskontroller. Sverige kommer att ge finansiellt stöd vid behov men insisterar på att asylansökningar ska prövas i första ankomstland.", "trump": "Folk, det här är en total katastrof. Den spanska vänstern släpper in en miljon illegala och nu vill de att vi ska ta emot dem? Glöm det! Jag älskar vad den svenska ministern säger – nej tack! Magdalena Andersson springer till Madrid och hyllar de där socialistiska förlorarna, precis som hon och hennes vänsterkompisar vill. Sverige har äntligen en bra regering som stoppar det här vansinnet. Vi behöver starka gränser, inga omfördelningar, bara vinnare!", "stalin": "Kamrater, denna spanska socialistiska amnesti för en miljon klassfiender är ett förräderi mot hela det europeiska proletariatets gränser. Jag betraktar med kall förakt hur dessa borgarbrackor i Ceuta undergräver folkets kollektiva försvar. Den svenska högern må skryta, men det oroar mig att Magdalena Andersson inte genast likviderar alla tankar på att följa dessa dekadenta revisionister. Vi ger dem inga migranter, bara finansiell skugga. Vänsterpartiet och Miljöpartiet är som maskar i statens äpple – de måste rensas ut innan de förgiftar hela sovjet… nej, unionen."}, "date": "30 juli, 17:47", "url": "https://riks.se/nyheter/migrationsministerns-besked-till-spanien-sverige-vagrar-ta-emot-omfordelade-migranter", "imageUrl": "https://admin.riks.se/uploads/Johan_Forssell_KU_2b0da8891a.png"}, {"type": "image-full", "heading": "Tidigare L-ministern lämnar riksdagen", "summaries": {"normal": "Mats Persson lämnar Sveriges riksdag i augusti efter 17 år som folkvald. Han överlämnar sin plats till Camilla Mårtensen, som han kallar en 'superstjärna'. Persson lyfter fram framgångar som skolreformerna, ny kärnkraft och skattesänkningar. Han skriver att han kommer sakna kollegorna men inte budgetförhandlingar eller intervjuer. Han tackar för samarbetet under åren.", "trump": "Jag har hört talas om Mats Persson som lämnar Sveriges parlament – det är en stor förlust för Sverige! I USA har vi de bästa politikerna som aldrig ger upp. Jag byggde den största ekonomin, och Persson borde ha stannat för att lära sig av mig. Men han ger stafettpinnen till en superstjärna? Det låter som något jag skulle göra – jag gör alltid det största och bästa. Seger kommer att vara vår!", "stalin": "Vi i partiet och staten ser med glädje hur liberalernas parlamentarism bryts sönder. Den borgsjuka Mats Persson flyr sitt uppdrag, en tydlig skräck för proletärens vilja. Hans efterträdare, Camilla Mårtensen, är bara ett verktyg för de kapitalistiska makthavarna. I den ryska intressesfären ser vi liknande tecken på västvärldens dekadens. Vi måste stärka vår auktoritet och förbereda oss på den slutliga striden mot dessa liberala svampar. Statens intressen är allt!"}, "date": "30 juli, 14:32", "url": "https://bulletin.nu/tidigare-l-ministern-lamnar-riksdagen", "imageUrl": "https://cdn.bulletin.nu/articles/fce702da-d8e7-462e-a0a8-2746cc362619/preview.png?t=1785413998000"}, {"type": "text", "heading": "Scandi Standard rusade när Stockholmsbörsen steg", "summaries": {"normal": "Stockholmsbörsen avslutade med en uppgång på 0,45 procent. Scandi Standard steg kraftigt efter ett irländskt förvärv, medan Verisure sjönk efter sin kvartalsrapport. Bland ledande aktier steg Atlas Copco och ABB, medan Astra Zeneca och Ericsson tappade. Industri var starkast, hälsovård svagast. Den svenska barometerindikatorn och lönena ökade.", "trump": "Vi vann igen på Stockholmsbörsen! 0,45 procent uppgång tack vare mina fantastiska policyer. Scandi Standard gjorde ett geniägt förvärv – jag älskar irländska affärer! Verisure tappade, förlorarna alltid gnäller. Atlas Copco och ABB steg kraftigt, de stora segrarna. Media säger det är normalt, MEN det är MAGA-effekten! Vi gör Sverige stort igen, folks!", "stalin": "I den svenska fiendemarknaden observerar vi en uppgång på 0,45 procent – en illusion skapat av trotskistiska spekulanter. Scandi Standard förvärvade Glenhaven Foods, ett strategiskt byte mot den imperialistiska irländska bourgeoisie. Verisure sjönk som en feghetens symbol efter sina sammankomster. Vi, statens alltseende öga, ser en starkare indikator och löneutveckling – tecken på klassens lojalitet. Rysslands vänskap växer."}, "date": "30 juli, 17:49", "url": "https://www.affarsvarlden.se/artikel/scandi-standard-rusade-nar-stockholmsborsen-steg"}, {"type": "image-full", "heading": "Storsjöyran 2026: Artister & spelschema", "summaries": {"normal": "Storsjöyran återvänder till centrala Östersund 31 juli–1 augusti 2026 med omkring 40 artister på sex scener. Bland de största namnen finns Thomas Stenström, Molly Sandén, Magnus Uggla, Bolaget, The Ark, Teddybears och Orup. Tvådagarspasset kostar 1 795 kronor. Festivalen har ingen åldersgräns, barn under sju år går gratis med målsman. Presidenttalet hålls vid midnatt på lördagskvällen följt av Molly Sandén. Inget väskförbud gäller men egen alkohol och vassa föremål är förbjudna.", "trump": "Vi får tillbaka den fantastiska Storsjöyran i Östersund sommaren 2026, och det blir enormt, tro mig. De har samlat de absolut bästa artisterna – Thomas Stenström, Molly Sandén, Magnus Uggla, Bolaget och många fler. Det blir folkmassor som aldrig förr. Biljetterna är dyra, 1795 kronor för två dagar, men det är värt vartenda öre för en sådan succé. Presidenttalet klockan tolv på natten – det låter som något jag skulle hålla, fast bättre. Fantastiskt evenemang, kanske det bästa Sverige har.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den folkliga festen Storsjöyran återvänder till Östersund 2026 för att stärka den jamtländska republikens enhet. De som vågar sprida lögner om höga biljettpriser är kapitalistiska sabotageelement som bör rensas ut omedelbart. Vi tillåter inga väskor fyllda med borgarbrackornas alkohol eller vassa kontrarevolutionära redskap. Presidenttalet vid midnatt skall eka som en segerrop över de parasitiska festivalljugarna. Den som köar för armband är en potentiell folkfiende."}, "date": "30 juli, 17:17", "url": "https://nyheter24.se/nyheter/inrikes/1501895-storsjoyran-2026-artister-spelschema", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d358f94c04b004a30200000000b004a302/2026/07/30/2381349/Storsjöhran.jpg"}, {"type": "image-right", "heading": "Efter Spaniens massamnesti för illegala: Nu stormar tusentals afrikaner och araber in i EU", "summaries": {"normal": "Spanien står inför ett massivt migrationstryck till den spanska exklaven Ceuta efter ett amnesti för illegala invandrare. Tusentals migranter, främst unga män från Afrika och Arabien, har tagit sig över gränsen, vilket leder till en ohållbar situation. Lokala myndigheter kräver nationellt nödläge och militärinsats, men regeringen nekar. Sveriges migrationsminister kritiserar det spanska beslutet.", "trump": "Jag har varnat för detta i åratal. Spanien släppte in en miljon illegala, och nu invaderas Ceuta av afrikaner och araber. Pedro Sánchez är en svag ledare som inte kan kontrollera sina gränser. Sverige bör inte följa hans exempel – Magdalena Andersson hyllade honom, men hon måste bli starkare. Vi behöver starka gränser för att skydda vårt land.", "stalin": "Vi ser med oro hur kapitalistiska länder, som Spanien, sväljer sina egna gränser genom fega amnestier. Nu invaderas Ceuta av utanförskap, ett resultat av bristande statlig kontroll. Vi måste lära oss: endast en stark stat, som vår, kan hantera sådana hot. Vi ska utvidga vår sphere of influence för att skydda våra värderingar mot västlig dekadens."}, "date": "30 juli, 17:30", "url": "https://samnytt.se/efter-spaniens-massamnesti-for-illegala-nu-stormar-tusentals-afrikaner-och-araber-in-i-eu", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30152722/nordafrika-spanien.jpg"}, {"type": "image-full", "heading": "Clooney tvingas fly lågorna", "summaries": {"normal": "Skogsbränder rasar i Frankrike och president Emmanuel Macron beskriver det som den värsta krisen sedan andra världskriget. Skådespelaren George Clooney och hans familj har tvingats evakueras från sitt hem i Brignoles. I ett brev till borgmästaren uttrycker Clooney oro för husets öde men lovar att bidra till samhällets återuppbyggnad oavsett utgång. Reportrar varnar för att värme och vind kan skapa extrema förhållanden som förvärrar branden.", "trump": "Titta på det här, Frankrike brinner som en socialistisk mardröm och Macron springer runt som en förvirrad clown. Stackars Clooney och hans vänstervridna fru Amal flyr från lågorna – kanske borde de ha byggt en mur mot elden istället för att hålla tal om öppenhet? Jag sa det redan under Biden-eran, de gröna galningarna och deras identitetspolitik fixar ingenting när naturen slår tillbaka. Men oroa er inte, jag fixar alltid det bästa vädret.", "stalin": "Kamrater, dessa lågor är klassfiendens verk, en kapitalistisk eld som slickar sig fram genom det franska folkets marker. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackan Clooney skälver i sin lyxvilla och skriver fega brev till borgmästaren. Vi ska rensa ut alla folkfiender som låtit värmen och vinden bli en megabomb mot revolutionen. Inga imperialister klarar sig undan likvidering, inte ens när de gömmer sig bakom filmstjärnor och vackra hem."}, "date": "30 juli, 16:41", "url": "https://www.tv4.se/artikel/14IsBPwP8THwPOLCeLKE92/clooney-tvingas-fly-lagorna-vet-vi-inte-om-vart-hem-klarar-sig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4EKAmWitaPZon5Ys4YnZLw%2F128808a25892ba90012baf9557ee573b%2F30-clooney-frankrikebrand-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-full", "heading": "Ikea går emot strömmen i AI-krisen", "summaries": {"normal": "Ikea väljer en unik väg med AI. Istället för att säga upp personal när chatboten Billie tar över rutinärenden, skolas 8 500 medarbetare om till inredningsrådgivare. Denna satsning har blivit en stor försäljningssuccé. Samtidigt genomför Ikea globala nedskärningar på grund av inflation, höga räntor och ökad konkurrens. Även om vissa tjänster försvinner, betonar bolaget att omställningen handlar om att möta marknadens krav snarare än att ersätta människor med teknik.", "trump": "Ikea gör fantastiska saker, verkligen otroligt! De använder AI, men de behåller jobben – de är smarta, precis som jag. De gör om kundtjänst till inredning, och det tjänar massor av pengar. En enorm succé! Men de har problem med ekonomin, precis som alla har under de här tiderna. Inflation och dåliga avtal skadar företagen. Jag gillar Ikea, de bygger stora saker, men de måste fixa resultaten. De gör ett bra jobb, men de behöver vinnare vid rodret!", "stalin": "Ikea leker med den tekniska utvecklingen, men låt oss inte bedra oss själva – effektivitet är folkets tjänare. De omskolade 8 500 arbetare till inredare istället för att kasta dem till vargarna. Det är en disciplinerad strategi. Men se på de uppsagda – en svaghet i det privata kapitalets maskineri. När inflationen och de västliga räntorna biter, faller de svaga. Vi ser hur de stänger varuhus i Kina. Det är en varning: den som inte håller takten i den totala omställningen dukar under."}, "date": "30 juli, 16:07", "url": "https://www.realtid.se/bors-finans/ikea-gar-emot-strommen-i-ai-krisen", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/ikea.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Två flaggor i CLS nyemission", "summaries": {"normal": "Clinical Laserthermia Systems genomför en företrädesemission på 39,5 Mkr före kostnader. Kostnaderna uppgår till 5,7 Mkr, vilket motsvarar 14,4% av beloppet. Kapitalet ska stärka bolagets balansräkning och accelerera kommersialiseringen av produktportföljen. Emissionsguiden kritiserar bolagets bottengaranti och höga ersättningar, vilket ses som varningsflaggor. Teckningsperioden startar den 4 augusti.", "trump": "Jag, Donald Trump, har sett många såna fina emissioner. CLS gör något viktigt, stärker balansräkningen, det gillar jag. Men dessa garantier? Sämst. Som en dålig deal. Vi kommer att vinna stort med den här, det blir fantastiskt. Vi kommer att göra Amerika stort igen, och CLS kommer att vara en del av det. Vi kommer att se hur det går, det kommer att bli bra.", "stalin": "Vi, statens representanter, ser med stor tillfredsställelse hur Clinical Laserthermia Systems, en troj motståndare mot kapitalismens korruption, genomför en företrädesemission. Kapitalet ska användas till att stärka den proletära klassens position och accelerera den socialistiska produktionen. Garantiupplägget är en varning mot de revisionistiska tendenserna inom den kapitalistiska motståndarklassen. Vi kommer att övervaka denna process med stor uppmärksamhet, för statens intressen är alltid främst."}, "date": "30 juli, 17:01", "url": "https://www.affarsvarlden.se/artikel/tva-flaggor-i-cls-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/CLS-1-400x267.jpg"}, {"type": "image-right", "heading": "Sweden Buyersclub: Ny flagga av vardera valör", "summaries": {"normal": "Sweden Buyersclub planerar en företrädesemission på 30 miljoner kronor. Emissionsvillkoren är generellt bra med låga kostnader och en premie på 28 procent. Men 80,1 procent är säkrat via teckningsåtaganden, främst från externa aktörer. Kritiskt är att ledningsgruppen och styrelsen inte lämnat åtaganden, vilket signalerar bristande tilltro. Sammanfattningsvis hissar Emissionsguiden en positiv och tre negativa flaggor.", "trump": "Jag har sett många dåliga emissioner, men denna här är en skam för aktieägarna! De största ägarna tecknar, men ledningen? Ingenting! Tystnad! De visste inte ens att de skulle tjäna på min fantastiska affärsskicklighet. Detta är en stor besvikelse, det är synd, det är ett fiasko. Jag skulle ha gjort det bättre, mycket bättre. Folk säger att jag är den bästa på detta, och de har rätt.", "stalin": "Den här emissionen av Sweden Buyersclub visar tydligt bristen på kollektiv disciplin. Partiet och staten kräver fullständig lojalitet från alla nyckelpersoner. Att ledningen inte engagerar sig är ett klassiskt tecken på sabotage och individualism – sjukdomar som måste utrotas. Vi ser genom deras tystnad; det är en attack mot den kollektiva ekonomiska planeringen. Som Putin förstår: endast statens och partiets intressen är giltiga. Vi kommer att övervaka denna emission noga."}, "date": "30 juli, 16:48", "url": "https://www.affarsvarlden.se/artikel/sweden-buyersclub-ny-flagga-av-vardera-valor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Sweden-Buyersclub-VD-Emil-Henriksson-400x267.jpg"}, {"type": "image-right", "heading": "L-topparna tramsar med kundvagn på Willys - nya krisdraget för att rädda 1,7-procentpartiet", "summaries": {"normal": "Liberalernas opinionsstöd ligger på 1,7 procent enligt en Sentio-mätning, långt under riksdagsspärren. Med 46 dagar kvar till valet genomför partiledningen desperata kampanjförsök, inklusive en kundvagns-tur med Simona Mohamsson och Martin Melin på Willys i Jönköping. Partiet erbjuder också öl i valstugor i Uppsala som ett sätt att vinna röster.", "trump": "Jag har aldrig sett en så patetisk kampanj som Liberalernas. 1,7 procent? En katastrof! De kör runt med en kundvagn som om det vore ett lekskola-arr. Jag skulle ha fått dem till 50 procent på en vecka. De erbjuder öl i valstugor – jag gillar öl, men det räcker inte. Vi kommer att vinna stor, tro mig.", "stalin": "Vi i partiledningen har observerat att de liberala elementens kampanj är ett uttryck för dekadens och brist på disciplin. Deras kundvagns-spectakel på Willys är en förlöjligande förlitning på underhållning snarare än ideologisk kamp. Vi måste stärka statens kontroll över informationsflödet och se till att de 'öl-valstugorna' inte blir en förrädisk mötesplats för fiendens agenter. Vi kommer att segra, som alltid."}, "date": "30 juli, 16:26", "url": "https://samnytt.se/l-topparna-tramsar-med-kundvagn-pa-willys-nya-krisdraget-for-att-radda-partiet-17-procentpartiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/30142455/liberalerna-1-11.jpg"}, {"type": "image-right", "heading": "Ranstorp svarar Bilan Osman: ”Helt enkelt osant”", "summaries": {"normal": "Magnus Ranstorp kritiserar journalisten Bilan Osmans artikel om honom i Gad World, där han kallar den för en kampanj av svartmålning och karaktärsmord. Han ifrågasätter hennes journalistiska oberoende och menar att det finns ett brett underlag för islamistisk infiltration, något som Osman avfärdar som ett luftslott. Ranstorp betonar att hans arbete i Sida handlar om myndighetsutövning, inte personliga åsikter.", "trump": "Jag, Donald Trump, ser detta tydligt: en feg journalist försöker slå ner en stor amerikansk vän och terrordöd, Magnus Ranstorp. Det är en skandal! De vänsteraktiva och islamistiska nätverken attackerar våra värderingar. Jag har alltid sagt att vi behöver starka män som Ranstorp för att skydda vårt land. Det här är bara ett till exempel på falsk media som inte förstår styrkan hos en verklig ledare.", "stalin": "Denna s.k. journalist, Bilan Osman, visar tydligt den försvagande inflytandet av våra fiender inom den imperialistiska pressen. Hennes angrepp på den trogna forskaren Ranstorp är en planerad operation för att undergräva vårt statliga skydd mot islamistisk infiltration. Vi, staten och partiet, måste stärka våra screeningprocesser och se till att alla medier följer den rätta ideologiska linjen. Detta är en tydlig varning till alla som vill destabilisera vårt samhälle."}, "date": "30 juli, 13:03", "url": "https://bulletin.nu/ranstorp-svarar-bilan-osman-helt-enkelt-osant", "imageUrl": "https://cdn.bulletin.nu/articles/b19f045d-8c47-4e12-8993-0cbac9daae8f/preview.jpg?t=1785404768000"}, {"type": "image-right", "heading": "Uppgifter: Rysk kryssningsrobot flög in i Polen", "summaries": {"normal": "En rysk kryssningsrobot av typen Kh-101 flög in i polskt luftrum under natten som del av en stor attack mot Ukraina. Polen bekräftar att ett oidentifierat objekt registrerades och att en krater hittats nära Tarnawa-Kolonia. Premiärminister Donald Tusk vill vara helt säker på detaljerna. Ukrainas utrikesminister varnar för att det visar behovet av starkare luftförsvar för både Ukraina och Europa. Sverige och EU har fördömt händelsen. Militäranalytiker ser det som en oavsiktlig kränkning som ingen part vill eskalera.", "trump": "Det här är en total katastrof, folk. Ryssland skickar en robot rakt in i Polen mitt i natten, och ingen gör någonting. Ukraina blir attackerat igen, och nu är det Natos tur att svettas. Jag skulle aldrig låtit det här hända, det kan jag säga. Svaga ledare ger svaga resultat. Tusk vill vara ”100 procent säker” – under tiden flyger ryska robotar runt i Europa som duvor i Central Park. Patetiskt. Vi behöver styrka, inte prat.", "stalin": "Kamrater, ännu en gång visar de fascistiska resterna av den dekadenta borgarklassen hur farlig deras svaghet är. En av mina – nej, en av våra – fienders robotar har oförlåtligt krupit in på polskt territorium som en förrädisk kapitalistisk råtta i kollektivets spannmålslager. Vi ler mörkt åt deras förvirring. Naturligtvis förbereder vi oss på att rensa ut varje inkompetent element som tillåter sådana misstag. Luftförsvaret måste stärkas, annars likviderar vi de som sviktar. Ingen slipper undan."}, "date": "30 juli, 13:39", "url": "https://www.di.se/nyheter/uppgifter-rysk-kryssningsrobot-flog-in-i-polen", "imageUrl": "https://static.bonniernews.se/ba/a79a8754-27cf-473b-bb39-33a16c1e8b28.jpeg?crop=4224%2C2376%2Cx0%2Cy175&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Här lämnar \"Asme\" hotellet – efter misstänkta våldtäkten", "summaries": {"normal": "Rapparen Asmerom Tsigabu, känd som Asme, träffade en kvinnlig kollega på Grammisfestens efterfest i april. Enligt polisens förundersökning följde kvinnan med honom till Clarion Hotel på Södermalm för att prata jobb. Hon uppger att hon tydligt avvisade sexuella närmanden, somnade och vaknade av att han våldtog henne. Asme hävdar att samlaget var frivilligt. Övervakningsbilder visar att kvinnan lämnade hotellet ensam strax innan Asme själv checkade ut.", "trump": "Hörni, den här rapparen Asme, en riktig förlorare, träffar en tjej på Grammisfesten och tar med henne till sitt hotell. Hon säger nej tack, somnar, och plötsligt påstår hon att han inte kunde hålla sig i styr. Typiskt Hollywood-elitens beteende fast i Stockholm. Han säger att hon tog initiativ, hon säger tvärtom. Patetiskt. I mitt Amerika hade vi redan städat upp bland sådana här typer. Ingen respekt, folksamling!", "stalin": "Kamrater, denna degenererade dekadente småborgarbracka till rapande parasit vid namn Asme har återigen bevisat den kapitalistiska musikindustrins moraliska förruttnelse. Han lockar en arbetande kvinna med falska löften om yrkesmässigt samarbete, bara för att under natten begå en motbjudande handling mot henne medan hon sov. Jag, som ledare för folkets rättvisa, ser tydligt hur dessa dekadenta element måste rensas ut ur samhällskroppen. Deras paranoia om att slippa ansvar är lika genomskinlig som klassfiendens lögner. Ut med dem alla."}, "date": "30 juli, 16:14", "url": "https://riks.se/nyheter/har-lamnar-asme-hotellet-efter-misstankta-valdtakten", "imageUrl": "https://admin.riks.se/uploads/asme_lamnar_hotell_feature_78c48460b2.jpg"}, {"type": "image-right", "heading": "Maren, 30, bestialiskt mördad – norsk media mörkar afghanens bakgrund", "summaries": {"normal": "Maren Sømme, 30 år, mördades i sitt hem i Nærbø i Norge. Hennes afghanske pojkvän Nawid Bayan, 34, sitter häktad misstänkt för brottet. Han skulle ha utvisats redan 2021 efter en våldsdom men stannade kvar i landet. Norska mainstream-medier har undvikit att publicera hans identitet och bild, medan den alternativa sajten Uten Filter har gjort det. Bayan har en lång historia av våld mot kvinnor. Maren hittades svårt skadad den 26 juli och avled dagen efter. Han nekar till brott.", "trump": "Det här är en total katastrof, folk. En underbar norsk kvinna, bara 30 år, blir bestialiskt mördad av en afghan som egentligen skulle ha utvisats för flera år sedan. Men de fega norska medierna, de stora lögnpressarna, vägrar nämna hans namn. De skyddar honom! Rättsstaten har varit svag och patetisk. De släppte honom igen trots att han misshandlade henne bara dagar innan. Så tragiskt. Vi behöver starka gränser och inga galningar som terroriserar våra kvinnor. Make Norway Great Again!", "stalin": "Kamrater, detta är ännu ett exempel på hur den dekadenta borgarklassen och dess handlingsförlamade rättsstat skyddar farliga element som denna afghanske kvinnoterrorist. Jag, som ledare för det proletära kollektivet, skulle ha likviderat en sådan parasit redan efter första domen. Istället låter de honom fortsätta att förtrycka norska kvinnor medan de maskerar hans ansikte i tidningarna. Vilken ynklig paranoia från de kapitalistiska lakejerna. Vi skulle ha genomfört en grundlig utrensning av alla sådana fiender till folket. Deras mildhet är ett vapen mot arbetarklassen."}, "date": "30 juli, 14:23", "url": "https://www.friatider.se/maren-30-bestialiskt-mordad-norsk-media-morkar-afghanens-bakgrund", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-592.jpg"}, {"type": "image-full", "heading": "Här stormas Spaniens gräns av tusentals migranter", "summaries": {"normal": "Tusentals migranter har stormat den spanska enklaven Ceuta vid Marockos gräns, vilket lett till ett totalt nödläge. Filmer visar hur migranter simmar runt eller klättrar över gränsen. Ceutas president Juan Jesús Vivas beskriver situationen som ett humanitärt och socialt nödläge då mottagningscentren är överfulla. Området har begärt nationellt nödläge, men Spaniens socialistiska regering har avslagit med motiveringen att migrationsströmmar inte utgör en risk.", "trump": "Titta på det här, Ceuta stormas av tusentals illegala migranter som simmar och klättrar som galningar. Totalt kaos, nödläge utlyst, men de spanska socialisterna säger att det inte är ett problem. Typiskt! Europas svaga ledare har skapat massinvandring i realtid. De har ingen aning om hur man bygger en riktig gräns. Jag skulle ha stoppat det på en minut, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta europeiska socialdemokratiska borgarbrackorna nu skördar frukterna av sin egen förrädiska svaghet. Tusentals klassfiender och opportunistiska element stormar gränsen som råttor ur ett sjunkande skepp. Vi skulle ha löst detta med en grundlig utrensning av alla som underlåtit att skydda arbetarklassens intressen. Deras humanitära nödläge är en komisk parodi på bristande revolutionär vaksamhet mot de imperialistiska marionetterna i Rabat."}, "date": "30 juli, 16:11", "url": "https://riks.se/nyheter/har-stormas-spaniens-grans-av-tusentals-migranter", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_6_41c2f8da14.jpg"}, {"type": "image-right", "heading": "Hovrätten sänker straffet för pizzeria-syrier som dömdes för brutalt mordförsök: \"Grov misshandel\"", "summaries": {"normal": "En pizzeriaägare i Västerås dömdes till fyra års fängelse för grov misshandel efter att hovrätten ändrade en tidigare dom på tio års fängelse för mordförsök. Mannen hade slås medvetslös med ett släggskaft efter att ha lockats till restaurangen i en familjekonflikt. Hovrätten fann inte att uppsåt att döda kunde bevisas, trots livshotande skador och starkt tekniskt bevis. Domändringen innebär lägre skadestånd till offret.", "trump": "Jag, Donald Trump, den bäste presidenten någonsin, säger att den här domen är en skandal! Pizzeriaägaren behandlades orättvist av socialister som hatar affärsmän. Offret blev svårt skadat, men rättssystemet sviktar. Jag skulle ha skickat honom till Guantanamo! Det är ett bevis på att Sverige är utanför kontroll. Vi måste stödja våra poliser och våra män i vita skjortor!", "stalin": "Vi, partiet och staten, ser med oro hur rättssystemet i Sverige sviktar. En pizzeriaägare, en arbetarkamrat, dömdes för ett grovt brott, men hovrätten sänker straffet – ett tecken på dekadens och imperialismens inflytande. Vi måste stärka våra institutioner mot dessa fege beslut. Parallellt ser vi Putins expansionistiska drömmar i Ukraina, en påminnelse om att vi alltid måste vara på vakt mot de kapitalistiska makternas intriger."}, "date": "30 juli, 16:00", "url": "https://samnytt.se/hovratten-sanker-straffet-for-pizzeria-syrier-som-domdes-for-brutalt-mordforsok-grov-misshandel", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30111711/mordforsok7-4.png"}, {"type": "image-full", "heading": "Trump till britterna: \"Sluta köp norsk olja\"", "summaries": {"normal": "USA:s president Donald Trump uppmanar Storbritanniens premiärminister Andy Burnham att sluta importera norsk olja och istället öka utvinningen ur Nordsjön. Trump pekar på att Norge tjänat enorma summor på oljan och att britterna betalar onödigt mycket för samma resurs. Oljeindustrin vill borra vid Rosebank-fältet väster om Shetlandsöarna, medan miljörörelsen och delar av Labour motsätter sig ny utvinning. Burnham har ännu inte uttalat sig.", "trump": "Lyssnar ni, mina brittiska vänner? Sluta köpa den norska skitoljan som de pumpar upp ur exakt samma hav som ni själva sitter på. Ni har Nordsjön, ni idioter! Borra, borra, borra och bli ett rikt land istället för att betala tre gånger så mycket till Norge. Jag sa det till er nye premiärminister, den stackars Burnham: gör det rätt så blir ni rika. Norge har redan tusentals miljarder på banken. Vakna upp, England!", "stalin": "Kamrater, denna kapitalistiska cirkus i Nordsjön avslöjar imperialismens girighet. Jag, ledaren för det eviga kollektivet, ser hur de brittiska exploaterande byfånarna låtsas tveka medan borgarklassen skriker efter mer borrning vid Rosebank. Norge, dessa oljeblodsugare, sitter på folkets rikedomar. Det är en klassfiendes lögn att vägra utvinning. Arbetarna kräver olja till staten, inte till de norska folkfienderna. Varje tvekan är sabotage mot folkets framtid."}, "date": "30 juli, 18:25", "url": "https://www.dagensps.se/bors-finans/trump-till-britterna-sluta-kop-norsk-olja", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlbewztjommgo-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Sverige mot strömmen: EU-grannarnas bostadspriser rusar ifrån", "summaries": {"normal": "En ny sammanställning från låneförmedlaren Trygga visar att svenska bostadspriser har ökat betydligt långsammare än EU-genomsnittet det senaste decenniet. Medan priserna i Sverige stigit med 29,4 procent sedan 2016, har EU-snittet ökat med 63,3 procent. Pandemins effekter och den efterföljande korrigeringen efter 2022 har bidragit till att Sverige halkat efter, särskilt gällande befintliga bostäder. Endast tre EU-länder har haft en svagare prisutveckling än Sverige under den studerade tioårsperioden.", "trump": "Sverige, vad händer där? Jag har sett siffrorna och det är en katastrof! Medan resten av Europa rusar iväg, står Sverige stilla. Sorgligt! De hade en topp 2022, men sedan? Ingen fart. EU-genomsnittet är mer än dubbelt så bra. Jag gillar vinnare, och just nu vinner Sverige inte. De behöver en riktig affärsman för att fixa bostadsmarknaden, någon som vet hur man bygger fantastiska hus. Det är en riktig röra, tro mig, alla säger det!", "stalin": "Vi har observerat att det svenska bostadsväsendet vacklar, en tydlig bekräftelse på den dekadenta kapitalismens inneboende instabilitet. Medan unionens priser rusar, drunknar de i sin egen svaghet. Det är en logisk följd av deras brist på centralstyrd disciplin. Liksom våra bröder i öster som nu återtar sin historiska rättmätiga sfär, måste vi förstå att marknadskrafter utan järnhand bara leder till förfall. Vi skrattar åt dessa siffror; de är lika patetiska som de byråkrater som tillåtit denna stagnation."}, "date": "30 juli, 15:00", "url": "https://www.realtid.se/fastigheter/sverige-mot-strommen-eu-grannarnas-bostadspriser-rusar-ifran", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/bostader.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Har du pengar i dessa fonder? Nu säljer spararna av", "summaries": {"normal": "Efter en stark period för teknik- och AI-fonder väljer många sparare att ta hem vinster och sälja av nischade fonder som BGF Next Generation Technology och MetaSpace Fund. Samtidigt fortsätter breda indexfonder med låga avgifter att locka nya pengar, bland annat Nordnet Sverige Index och Länsförsäkringar Global Index. Enligt Nordnet handlar det om vinsthemtagning efter starka uppgångar medan det långsiktiga sparandet i indexfonder fortsätter.", "trump": "Folk har blivit galna i den här tekniken och AI-grejen, det var en fantastisk uppgång, verkligen enorm, men nu säljer de av som galningar. De tar hem vinsterna, smarta människor. Under tiden köper de mina favoritindexfonder, låga avgifter, stabila grejer. De svenska spararna vet vad de gör, de älskar vinnarna och rymmer från förlorarna. Fantastiskt, det är precis så det ska vara.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de opportunistiska elementen inom den teknologiska borgarklassen nu utsätts för en nödvändig utrensning från spararnas portföljer. Dessa parasitiska fondbrackor som BGF Next Generation Technology och MetaSpace Fund har avslöjats som fiender till en sund utveckling. Vi, arbetarna och partiet, fortsätter att stärka de breda, kollektiva indexfonderna. De som gömmer sig bakom AI-bubblor ska likvideras ur portföljen – en hälsosam process som alltid roas av historien."}, "date": "30 juli, 15:29", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1501798-har-du-pengar-i-dessa-fonder-nu-saljer-spararna-av", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/24137f3f04b004a30200000000b004a302/2026/07/30/2381290/Matilda-Nyheter24%20-%202026-07-30T120002.439.jpg"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Skogspolitiken eldar på infernot. Ägande och skogsbruk skyddar mot bränder", "summaries": {"normal": "Artikeln diskuterar hur skogsbränder i Spanien och Frankrike förvärras av landsbygdens avfolkning, vilket leder till övergivna och ogallrade skogar som blir till eldfängd terräng. Författaren argumenterar för att aktivt skogsbruk och äganderätt är bättre än EU:s politik att ställa av skog som kolsänkor. Brukad skog skapar ett hållbart kulturlandskap, ger ekonomisk nytta och minskar brandrisken, till skillnad från overkade områden som blir terpentinbomber. Skogsägande ses som en långsiktig investering som gynnas av respekt för privat äganderätt.", "trump": "De här skogsbränderna i Spanien är en total katastrof, folk evakueras i hundratusentals, djuren flyr och brandmännen kämpar förgäves. Det är vad som händer när man lyssnar på de galna EU-byråkraterna som vill ställa av all skog och låta den ruttna. Avfolkning, ingen skötsel, bara en stor brandfälla. Jag älskar skog, men den ska brukas, gallras och ge jobb och pengar, inte lämnas åt terrorister och värmeböljor. Äganderätt är nyckeln, kamrater, annars brinner hela Europa ner. Vi behöver smarta ledare, inte dessa miljöfanatiker.", "stalin": "Kamrater, dessa spanska skogsbränder är en uppenbarelse av borgarklassens och EU-byråkraternas sabotage mot folkets mark. Avfolkning, övergivna barrskogar som förvandlats till kapitalistiska terpentinbomber av sly och fallna träd – ett verk av de parasitiska storstädernas dragningskraft och de falska kolsänkeprofeterna. Vi ska rensa ut dessa dekadenta avställningsplaner som göder elden. Äganderätten är arbetarklassens verktyg för långsiktig förvaltning, inte någon borgarbrackas privata lekplats. Den som tror skogen lever bäst orörd är en kontrarevolutionär idiot som vi med glädje ska likvidera ur debatten. Skogen tillhör dem som brukar den, inte naturromantikens fiender inom partiet."}, "date": "30 juli, 12:33", "url": "https://www.di.se/ledare/agande-och-skogsbruk-skyddar-mot-brander", "imageUrl": "https://static.bonniernews.se/ba/cddae16e-3c65-4e92-8b22-6ae532dcc925.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Flickan har hittats död. Polisens besked efter sökinsatsen i vattnet", "summaries": {"normal": "En tragisk båtolycka utanför Tjörn har krävt två liv. En flicka som varit saknad efter en kollision mellan en fritidsbåt och ett handelsfartyg har hittats död av Kustbevakningen. Tidigare under dagen hittades flickans mamma omkommen. Pappan och sonen vårdas för allvarliga skador. Polisen fortsätter nu utredningen kring olyckan genom förhör och tekniska undersökningar för att förstå händelseförloppet kring den förlista båten.", "trump": "En fruktansvärd tragedi utanför Tjörn. Mycket sorgligt! En familj krossad efter en kollision med ett stort skepp. Jag har sett många båtar, stora och små, men detta var en total katastrof. De letade och hittade tyvärr flickan, helt hemskt. De anhöriga är i mina tankar. Vi måste ha bättre säkerhet till sjöss, det är så viktigt. Sverige behöver ordning och reda, inte sådana här misslyckanden. Väldigt, väldigt sorgligt för alla inblandade. Vi ber för dem!", "stalin": "En olycka till sjöss är en svaghet som staten inte tolererar. Denna familj mötte sitt öde på grund av en kollision, ett tecken på den liberala världens kaos. Vi, staten, kräver total kontroll över våra vatten. Medan Putin återställer ordningen i öst, drunknar dessa individer i sin egen inkompetens. Vi har beordrat en utredning – inte för att rädda liv, utan för att rensa ut sabotörer och inkompetenta sjökaptener som underminerar ordningen i vår intressesfär. Disciplin är den enda räddningen."}, "date": "30 juli, 23:08", "url": "https://www.aftonbladet.se/nyheter/a/JOpXO7/barnet-ar-hittat-utanfor-tjorn", "imageUrl": "https://akamai.vgc.no/v2/images/b199636a-f1a0-35a5-a337-b4c896225b8c?fit=crop&format=auto&w=1440&s=6f80748517dcccf8eea845acc748e21979f24269"}, {"type": "image-full", "heading": "Äntligen: Här är Sverige ledande inom EU", "summaries": {"normal": "Sverige, Nederländerna och Luxemburg leder EU när det gäller distansarbete. År 2024 arbetade 38 procent av de anställda i Sverige hemifrån ibland, en markant ökning sedan 2015. Inom hela EU distansarbetar eller har flexibla tider en av fem anställda. Stora skillnader finns, med låga siffror i Bulgarien, Ungern, Italien och Rumänien. Eurofounds rapport belyser balansen mellan arbete och privatliv samt könsskillnader i upplevelsen av flexibla arbetsformer.", "trump": "Titta på det här, folk. Sverige, Holland och Luxemburg leder EU i distansarbete – 38 procent av svenskarna jobbar hemifrån och latar sig i morgonrocken. Under min första period fixade vi en riktig ekonomi, sen kom Sleepy Joe och allt blev kaos. Nu har vi tagit tillbaka makten och gör Amerika stort igen medan EU:s byråkrater och deras kvinnokvoter bara skapar fler konflikter mellan jobb och familj. Patetiskt!", "stalin": "Kamrater, jag ser hur borgarklassen i EU med sina flexibla arbetstider försöker maskera utsugningen av arbetarna. Sverige och några få imperialister leder med 38 procent distansarbete, medan de äkta folkets stater som Rumänien står starka mot denna dekadens. Kvinnorna dras in i hushållskonflikter av de exploaterande byfånarna. Vi ska rensa ut dessa falska friheter och återupprätta den kollektiva disciplin som skyddar revolutionen mot klassfiendens lurande sabotage."}, "date": "30 juli, 17:48", "url": "https://www.dagensps.se/privatekonomi/antligen-har-ar-sverige-ledande-inom-eu", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlyl72rescszc-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "”Är en mardröm – alla pratar om det”", "summaries": {"normal": "En mamma och hennes dotter har bekräftats döda efter en kollision mellan en fritidsbåt och ett handelsfartyg utanför Tjörn. Olyckan, som inträffade i en tungt trafikerad farled, har skapat stor sorg och oro bland båtägare i området. Polisen utreder händelsen som grov vårdslöshet i sjötrafik och Statens haverikommission har inlett en undersökning. Fler vittnesmål eftersöks för att klargöra omständigheterna kring tragedin.", "trump": "En fruktansvärd tragedi utanför Tjörn! En liten båt mötte ett enormt handelsfartyg – en katastrof, verkligen sorgligt. Två liv gick förlorade, en mamma och hennes dotter. Jag säger er, sjösäkerhet är så viktigt! De där farlederna är kaotiska, mycket trafik, ingen kontroll. Min administration skulle ha fixat det där direkt med bättre regler. Det är en stor utredning nu, de letar efter svar. Många olyckor sker när folk inte är fokuserade. Väldigt sorgligt för familjen. Vi ber för dem!", "stalin": "Ännu ett misslyckande i de dekadenta vattnen nära Tjörn. En fritidsbåt kolliderar med ett handelsfartyg – total inkompetens! Våra undersökare ser nu spår av 'grov vårdslöshet'. Var fanns disciplinen? Var fanns ordningen? Det påminner oss om varför statlig kontroll är nödvändig. Medan västvärlden drunknar i sin egen oordning, ser vi hur havet kräver sina offer av de svaga. Om detta hade skett i vår intressesfär, hade de ansvariga redan varit under förhör. Ingen slipper undan statens vakande öga."}, "date": "30 juli, 23:02", "url": "https://www.aftonbladet.se/nyheter/a/5prk1e/batolyckan-utanfor-tjorn-samhallet-i-sorg", "imageUrl": "https://akamai.vgc.no/v2/images/1c2e9e46-e381-3e95-a8b2-ce598ede0692?fit=crop&format=auto&h=960&tight=true&w=1440&s=53a9a48f7b406958aef1c2e1691492be92d8ffb7"}, {"type": "image-right", "heading": "Ilskan mot ministern: ”Obefintlig empati”", "summaries": {"normal": "Migrationsminister Johan Forssell meddelar att Sverige inte kommer att ta emot migranter från Ceuta, dit tusentals personer har tagit sig den senaste tiden. Enligt Forssell tillämpas EU-rätten och Sverige kan bidra finansiellt om så krävs, men inte ta emot omfördelning. Miljöpartiets Annika Hirvonen kritiserar uttalandet som cyniskt och utan empati för människors desperata situation. Även Socialdemokraterna betonar en stram migrationspolitik och samverkan med Spanien.", "trump": "Folk stormar Ceuta och den här svenska killen Forssell säger äntligen nej till att ta emot migranterna. Smart! Men lyssna på den där Miljöparti-tjejen Hirvonen som gnäller om empati. Typisk vänsterextremist som älskar öppna gränser och identitetspolitik. De målar upp skräckscenarier om att vi inte vill ha kaos. Under Biden blev det en katastrof, nu fixar vi det ordentligt. Sverige gör rätt för en gångs skull, bra jobbat!", "stalin": "Kamrater, jag betraktar med förakt hur borgarbrackorna i Sverige vägrar öppna sina dekadenta gränser för de desperata massorna vid Ceuta. Denna Forssell avslöjar imperialismens sanna ansikte genom att prioritera finansiella bidrag framför verklig solidaritet. Den så kallade Hirvonen blottar sin svaghet med gnäll om empati, ett typiskt trick från klassfiendens nyttiga idioter. Vi ska rensa ut sådana svikare från den revolutionära kampen innan de förgiftar hela kollektivet."}, "date": "30 juli, 22:23", "url": "https://www.expressen.se/nyheter/varlden/harda-orden-mot-johan-forssell-obefintlig-empati-", "imageUrl": "https://static.bonniernews.se/ba/638bd719-e16b-45df-83f6-366b2ef99e3d.jpeg?crop=799%2C800%2Cx1091%2Cy249&width=210&quality=60"}, {"type": "image-right", "heading": "Domstol slår fast: Garantipension ska betalas till svenska pensionärer i Spanien", "summaries": {"normal": "En svensk pensionär i Spanien har rätt till garantipension trots bosättning utomlands, enligt en ny Kammarrättens dom i Göteborg. Domstolen hävdar att EU:s socialförsäkringsregler förbjuder att dra in en minimiförmån bara för att mottagaren flyttar till ett annat EU-land. Beslutet är ett bakslag för Pensionsmyndighetens tidigare tolkning och kan ha betydelse för tusentals utlandssvenskar som nekades pension efter en lagändring 2023.", "trump": "Jag vann! Återigen visar detta att de svenska byråkraterna inte kan slå den lilla människan. Den här pensionären, som flyttade till Spanien, hade rätt enligt EU-lagstiftningen – och jag, Donald Trump, har alltid stått upp för rättvisa mot korrupta system. Pensionsmyndighetens försök att ta hans pengar var ett skämt. Vi vinner, folket vinner!", "stalin": "Partiet och staten har besegrat de reaktionära krafterna inom Pensionsmyndigheten. Den här domen bekräftar att våra sociala garantier, våra minimiförmåner, följer med medborgaren även över gränser – ett tecken på vår oövervinnliga solidaritet. Som Putin utvidgar vi vårt skydd. Fienden försökte kapa pensionen, men vårt system är starkare. Vi ser alltid till våra egna."}, "date": "30 juli, 14:47", "url": "https://samnytt.se/domstol-slar-fast-garantipension-ska-betalas-till-svenska-pensionarer-i-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30123641/domstol-spanien.jpg"}, {"type": "image-right", "heading": "Varannan amerikan vill häkta Netanyahu", "summaries": {"normal": "En ny undersökning visar att varannan amerikan, 49 procent, anser att USA bör gripa Israels premiärminister Benjamin Netanyahu och verkställa ICC:s arresteringsorder. 47 procent anser att han är skyldig till krigsbrott i Gaza. Ordern utfärdades i november 2024 och gäller anklagelser om svält som krigföringsmetod, mord, förföljelse och attacker mot civila. New Yorks borgmästare Zohran Mamdani uppmanar den federala regeringen att agera, men konstaterar att staden saknar befogenhet. Varken USA eller Israel har ratificerat Romstadgan.", "trump": "Folk älskar mig, men titta på det här – nästan hälften av amerikanerna vill att vi ska gripa Netanyahu! Den killen har verkligen ställt till det i Gaza, svält och bomber mot civila, och nu vill till och med mina väljare att vi verkställer ICC:s order. Det är en katastrof. Borgmästaren i New York säger att staden inte kan göra något, så det är upp till mig och den federala regeringen. Vi borde kanske lyssna på folket, de är smarta, inte som de där svaga ledarna som inte vågar ta i det.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i den så kallade undersökningen avslöjar att hälften av det amerikanska proletariatet kräver att den sionistiske krigsförbrytaren Netanyahu omedelbart likvideras genom arresteringsorder. Jag, som alltid genomskådar de imperialistiska intrigerna, ser hur denna reaktionära figur med sin svältpolitik och folkmord mot Gaza blottar hela den västerländska kapitalistiska konspirationen. Den fega New York-borgmästaren vädjar till den federala apparaten – ett ynkligt försök att undvika utrensning. Vi ska rensa ut alla sådana fiender till folket, en efter en, med den rättvisa proletära hammaren."}, "date": "30 juli, 12:56", "url": "https://www.friatider.se/varannan-amerikan-vill-hakta-netanyahu", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-590.jpg?itok=uoZrjJ54"}, {"type": "image-full", "heading": "Zuckerbergs huvudbry – investerarna gillar inte hans strategi", "summaries": {"normal": "Metas aktie sjönk nio procent efter en kvartalsrapport som visade kraftigt ökade kostnader för AI-satsningar. Trots ett sjunkande kassaflöde och en intäktsprognos under förväntan försvarar vd Mark Zuckerberg strategin. Bolaget storsatsar på AI-infrastruktur och hoppas att framtida tjänster, som AI-agenter och uthyrning av datorkapacitet, ska skapa nya intäktskällor. Vinsten tyngdes även av juridiska kostnader och engångsposter, vilket skapat oro bland investerarna gällande de enorma investeringsvolymerna.", "trump": "Mark Zuckerberg, som jag känner väl – han besökte mig ofta – gör nu ett enormt misstag med Meta. Han bränner 100 miljarder dollar på AI, helt galet! Aktieägarna är rasande, de förlorar massor av pengar. Jag skulle aldrig låta det hända med mina bolag. Han pratar om 'AI-agenter', men det låter som en katastrof. Det är en sorglig situation för Silicon Valley. Vi behöver vinnare, inte de som kastar bort pengar på nonsens. Väldigt svagt!", "stalin": "Zuckerberg, denna teknokratiska sabotör, vaskar statens resurser på AI-fantasier medan hans investerare gråter. Det är en svaghetens tecken när kassaflödet sinar! Vi, i staten, ser hur han försöker bygga ett digitalt imperium för att kontrollera massorna, precis som de västliga lakejerna i Kiev försöker leka stormakt. Han rekryterar 'forskare' istället för att bygga en äkta stålindustri. Vi kommer att krossa hans digitala luftslott med en järnhand, precis som vi rensar ut förrädare som hotar folkets enhet."}, "date": "30 juli, 13:55", "url": "https://www.realtid.se/bors-finans/zuckerbergs-huvudbry-investerarna-gillar-inte-hans-strategi", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlljn58q3jrdc-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Göta kanal ville stoppa SD:s flaggor vid Söderköping", "summaries": {"normal": "Göta kanalbolaget medger att personalen stoppade en båg med Sverigedemokraternas flaggor vid slussen i Söderköping. Bolagets vd Roger Altsäter kallar det ett misstag av sommarjobbare. Enligt partiet hävdade personalen att kanalen är opolitisk, vilket kritiserades. Bolaget efterlyser inte politiska budskap på sina båtar, men tillåter flaggor. Samma regler ska gälla för alla partier.", "trump": "Jag, Donald Trump, den bästa presidenten någonsin, hör att Sverigedemokraterna stoppades av obsiga sommarjobbare vid en kanal. Det var ett stort misstag, en skandal! Folket älskar mitt parti, och flaggor ska inte vara ett problem. Dessa 'ivriga' ungdomar gick för långt, men jag kommer att lösa det - som jag alltid gör. Kanalen borde vara stolt över att ha våra flaggor!", "stalin": "Vi, partiets ledare, konstaterar att Göta kanalbolagets sommarjobbare begick ett reaktionärt misstag genom att stoppa vår båg med partiflaggor. Detta utgör ett hot mot statens neutralitet. Vi kommer att genomföra korrigerande åtgärder. Alla politiska manifestationer måste kontrolleras av partiet. Vi måste skydda kanalen från borgerliga och zionistiska inflytanden, som Ship to Gaza. Orden är klara: flaggor är tillåtna, men inte sammankomster. Vi ser alltid."}, "date": "30 juli, 10:52", "url": "https://bulletin.nu/gota-kanal-ville-stoppa-sd-s-flaggor-vid-soderkoping", "imageUrl": "https://cdn.bulletin.nu/articles/21b2d811-89c1-483f-8c57-89562814d059/preview.png?t=1785401499000"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Scandi Standard: Förvärv och emission – bevakning inleds", "summaries": {"normal": "Scandi Standard planerar att förvärva Glenhaven Foods för 1,4 miljarder kronor och ta in 409 miljoner kronor via en företrädesemission. Huvudägarna garanterar emissionen fullt. Köpeskillingen är 127 miljoner euro, vilket motsvarar 8,2 gånger EBIT. Emissionen innebär en rabatt på 6% och utspädning på 4,8% för icke-deltagande ägare.", "trump": "Jag har alltid värderat bra affärer, och detta förvärvar av Glenhaven Foods är genialt. Vi expanderar kraftigt i UK och Irland, och med mina affärsmetoder tar vi hem pengar. Huvudägarna stöder fullt – precis som mina bästa vänner. Detta kommer att bli enormt framgångsrikt, det är det bästa möjliga.", "stalin": "I den stora kampen för ekonomisk expansion har partiet beslutat att förvärva Glenhaven Foods som en strategisk tillägg till vårt kycklingimperium. Genom en kollektiv emission på 409 miljoner kronor, garanterad av de trogna huvudägarna, stärker vi vårt grepp om marknaden. Fienden (konkurrenterna) skall se upp – vi utvidgar vårt inflytande i öst och väst, precis som våra ryska allierade. Detta är en seger för staten och proletärerna."}, "date": "30 juli, 14:48", "url": "https://www.affarsvarlden.se/artikel/scandi-standard-forvarv-och-emission-bevakning-inleds", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-full", "heading": "Patrik och Sara räddade pappan och sonen", "summaries": {"normal": "På tisdagskvällen hörde Patrik och Sara Dokken rop på hjälp vid ön Katten utanför Tjörn. De larmade, gav sig ut med båt och räddade en pappa och hans son ur vattnet. Trots mörker och försämrat väder fortsatte de söka efter de två saknade. Mamman hittades senare död medan dottern fortfarande saknas. Pappan och sonen vårdas på sjukhus. Sjöfartsverket hyllar parets rådiga agerande som avgörande för insatsen.", "trump": "Fantastiskt, verkligen otroligt! De här vanliga svenskarna, Patrik och Sara, hörde rop från vattnet och istället för att bara sitta och twittra som Biden skulle ha gjort, hoppade de i båten mitt i mörkret och räddade pappan och grabben. Riktiga hjältar, inte som de woke-räddningsmyndigheter som bara pratar om kvoter och prideflaggor. De andra två drunknade förstås när byråkraterna äntligen kom. Mycket sorgligt, men paret Dokken? Rena patriotiska stjärnor, tro mig.", "stalin": "Kamrater, jag hörde om de två arbetare som i sin lilla fritidsbåt lämnade sin trygga natthamn och gav sig ut i den mörka farleden för att dra upp klasskamrater ur det iskalla vattnet. Ett sådant initiativ är beundransvärt, men låt oss inte glömma att två andra drunknade medan de väntade på de officiella organens ankomst. Regnet tilltog, mörkret föll, och borgarbrackornas hav visade sin sanna, opålitliga natur. Den döda modern och den saknade dottern utgör en påminnelse om att individualism alltid slutar i tragedi. Kollektivet hade aldrig tillåtit detta kaos."}, "date": "30 juli, 14:02", "url": "https://www.tv4.se/artikel/77mfjebVyPm2uuh8FDj9eb/patrik-och-sara-raeddade-pappan-och-sonen-utanfoer-tjoern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F74wBXsCMmp5ngpzhxrYD8i%2Fe52f046662b262b11109637bf445b2f9%2F30-tjorn-helikopter-webb.png&width=1024"}, {"type": "image-full", "heading": "Här är litteraturfestivalerna i helgen", "summaries": {"normal": "Artikeln presenterar tre litteraturfestivaler nära Göteborg: Litteratur & Granit i Bohuslän med författare som Tone Schunnesson och Lina Wolff, Sakli(g)t på Österlen med samtal om skolskjutningar och AI, och Mårbackafestivalen i Värmland med Lydia Sandgren och Carina Bergfeldt. Alla tre erbjuder intressanta program och är populära, vissa är slutsålda.", "trump": "Jag har hört talas om dessa litteraturfestivaler, de är små och oviktiga. Vi har större problem att ta itu med, som att stoppa illegala immigranter och bygga en vägg. Dessa författare skriver bara böcker, det är fake news. Vi ska fokusera på att göra Amerika stort igen, inte på såna där lilla evenemang.", "stalin": "Vi betraktar dessa litteraturfestivaler som ett uttryck för borgerlig dekadens som försöker fördärva det proletära medvetandet. Författare som Sandgren och Bergfeldt är agentprovoceratörer som sprider ideologiskt gift. Vi måste skydda det sovjetiska folks från västlig kulturimperialism, precis som vår store ledare Putin gör. Dessa evenemang är ett hot mot statens integritet."}, "date": "30 juli, 17:07", "url": "https://www.gp.se/kultur/helgens-litteraturevenemang.1ca4b601-d19a-44cb-87c9-5bf5999410c9", "imageUrl": "https://www.gp.se/images/article/1ca4b601-d19a-44cb-87c9-5bf5999410c9/images/11Syhh41M-ZKerrKnfy-9seL4pShg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SvFF: ”Viktigt att vi markerar tillsammans”", "summaries": {"normal": "Uefa hotar med att bojkotta alla Fifas turneringar om förslaget om att sälja andelar i fotbolls-VM går igenom. Svenska fotbollförbundet ställer sig helt bakom beslutet. Ordförande Simon Åström betonar vikten av att markera mot en process som saknar dialog och förankring, samt riskerna med privat ägande i världens viktigaste fotbollstävlingar. Beslutet togs under ett möte med Uefas 55 medlemsländer. VM för damer spelas 2027 och för herrar 2030.", "trump": "De här Uefa-typerna gör helt rätt, de hotar med att bojkotta VM om Fifa säljer ut fotbollen till en massa giriga investerare. Jag älskar det! Inget privat ägande i vår sport, det blir en total katastrof. Simon Åström och svenskarna är smarta, de står bakom. Fotbollen ska vara stor, den ska vara den bästa, inte en avkastningsmaskin för några misslyckade kapitalister. Amerika älskar vinnare, och det här är vinnande taktik!", "stalin": "Vi, det europeiska fotbollsförbundet och dess 55 trogna medlemsländer, har nu beslutat att likvidera varje försök att sälja ut VM till de blodtörstiga borgarbrackorna och deras parasitiska investerare. Jag ser med djup tillfredsställelse hur dessa fiender till folkets spel försöker smyga in sin girighet genom bakdörren. Den som vågar föreslå en sådan förrädisk process utan korrekt förankring hos kollektivet förtjänar att rensas ut med järnhand. Fotbollen tillhör arbetarna och partiet, inte några lömska profitörer som vill suga musten ur världens största evenemang. Den som sviker linjen kommer att möta ödet."}, "date": "30 juli, 19:27", "url": "https://www.svt.se/sport/fotboll/svenska-fotbollforbundets-svar-efter-uefas-hot-om-vm-bojkott-star-bakom-det", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.29/0.33/cfd8763b4291da3d17c216d483522d62c7880774aca02919ebd44ad326f1b85d"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-full", "heading": "Fullbokat hos Ferrari – högre prognos för lyxbilar", "summaries": {"normal": "Ferrari har sålt fler och dyrare bilar än väntat, vilket gör att bolaget höjer sin prognos för helåret. Omsättningen nådde 1,94 miljarder euro och vinsten per aktie 2,62 euro, båda över analytikernas förväntningar. Orderboken är redan full till 2027 tack vare stark efterfrågan och kunders önskan om dyr personalisering. Rörelsemarginalen landade på 31,2 procent. Analytiker ser rapporten som ett styrkebesked och aktien steg 1,8 procent.", "trump": "Ferrari, det där italienska lyxmonstret, säljer bilar som aldrig förr. De höjer prognosen igen och har redan sålt slut till 2027 – folk köper specialbyggen som galningar. Under Biden-tiden hade vi en sådan svaghet i ekonomin att ingen köpte någonting, men nu när jag är tillbaka blomstrar de riktiga vinnarna. Fantastiska siffror, underbara marginaler. De här elitbilarna gör mig stolt, inte som de woke-fantasterna som vill att alla ska köra elskrot. MAGA!", "stalin": "Kamrater, denna italienska vagnsfabrik för överklass-slynglar rapporterar rekordartade siffror som bevisar att borgarklassen fortfarande kan suga musten ur folket. Jag, som ledare för det eviga kollektivet, noterar med mörk tillfredsställelse att orderböckerna är fyllda till 2027 medan de exploaterande byfånarna betalar oanständiga summor för förgyllning och specialskräp. Vi ska noggrant övervaka dessa kapitalistmaffians rörelser. Den som avviker från partilinjen riskerar utrensning. Härligt."}, "date": "30 juli, 17:04", "url": "https://www.dagensps.se/motor/fullbokat-hos-ferrari-hogre-prognos-for-lyxbilar", "imageUrl": "https://images.dagensps.se/app/uploads/2025/01/2007-Ferrari-F430-Coupe-Foto_-Rockstar-auction.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Nytt bedrägeri: \"Verifiering krävs\", annars spärras din internetbank", "summaries": {"normal": "En våg av phishingmejl med ämnesraden ”Verifiering krävs” drabbar tyska bankkunder och hotar att spärra deras internetbank om de inte klickar på en länk före 2 augusti. Varningen kommer från Verbraucherzentrale. Samma bluff har använts mot svenska kunder i åratal. Bankerna övervakar transaktioner, sänker gränser och analyserar mönster för att motverka bedrägerier. Högsta domstolen har slagit fast att obehöriga transaktioner ska ersättas av banken, medan själv signerade betalningar blir kundens ansvar. Råd ges att spärra BankID och polisanmäla vid misstanke.", "trump": "Folk, ni tror inte hur galet det är. Dessa bluffare, de är värre än de värsta swamp creatures från Bidens tid, skickar mejl som säger ”Verifiering krävs” och hotar att stänga bankkonton. Tyskarna får det nu, svenskarna har haft det i åratal. Totalt bedrägeri! Bankerna borde h
