 tigga 16,2 miljoner kronor från aktieägarna. Deras huvudägare, en bourgeois-kapitalist vid namn Peter Lindell, säkrar större delen av emissionen – precis som vi förutspådde! Dessa västerländska företag är som svältande vargar, ständigt på jakt efter nya medel. Men låt dem leka med sina cancerläkemedel. Vi har redan planer för deras vetenskapliga framsteg – de kommer att tjäna det stora socialistiska moderlandet, vare sig de vill eller inte!"}, "date": "25 maj, 14:35", "url": "https://www.affarsvarlden.se/artikel/huvudagaren-frontar-spagos-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Spago1-400x267.jpeg"}, {"type": "image-right", "heading": "Här återskapas 2500 år gamla lottningsmaskinen", "summaries": {"normal": "Forskare har återskapat 'kleroterion', en antik grekisk lottningsmaskin som användes för att slumpmässigt utse politiska representanter i Aten. Syftet var att förhindra korruption och att en rik elit tog kontroll över makten, vilket man ansåg skedde vid vanliga val. Kleisthenes reformer lade grunden till detta system, som existerade i över 200 år. Arkeologer har nu byggt en kopia av maskinen baserat på marmorfragment och historiska texter för att förstå hur processen fungerade.", "trump": "Jag har sett den här gamla grekiska lottningsmaskinen, en 'kleroterion'. Väldigt intressant! De använde slumpen för att välja ledare istället för att välja de bästa – vilket, låt oss vara ärliga, ofta är en katastrof. De ville undvika korruption, men tänk er att styra ett land genom lotteri? Helt galet. De trodde de var smarta, men det är bara svagt. Jag föredrar när vinnare väljs genom röster, de massiva, fantastiska rösterna som jag får. Grekland? Det är historia, jag bygger framtiden!", "stalin": "Dessa grekiska dårar trodde att slumpen var ett botemedel mot korruption. Vilken patetisk liberalism! Vi vet bättre. Makten ska inte utses genom lotteri, utan genom folkets vilja som leds av en järnhand och partiets klarsynta disciplin. Varje försök att undvika vår centraliserade kontroll är ett sabotage mot staten, precis som dagens västliga agenter försöker infiltrera vår sfär. Vi bygger inga lottningsmaskiner; vi bygger en framtid där varje kugge i maskineriet vet sin plats – eller försvinner."}, "date": "25 maj, 15:54", "url": "https://www.svt.se/nyheter/vetenskap/har-aterskapas-2500-ar-gamla-lottningsmaskinen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/feb195bface67270e1b52b0b4ff67a5e0464e4508a2770c8782e4327853d513e"}, {"type": "image-right", "heading": "Polisens diktatursingripande: Omhändertog altmedia-journalister vid Nato-mötet", "summaries": {"normal": "Under ett Nato-möte i Helsingborg omhändertogs två journalister från Frihetsnytt av polisen. Journalisterna uppger att de pressades ned på marken och fick sin utrustning beslagtagen utan tydlig motivering, trots att de har grundlagsskyddad verksamhet. Polisen ska ha hänvisat till deras koppling till Frihetsnytt som grund för ingripandet. Händelsen har väckt kritik och Frihetsnytt avser nu att driva en rättsprocess mot Polismyndigheten för att få klarhet i agerandet.", "trump": "Helt otroligt vad som händer i Sverige! Två journalister från Frihetsnytt blev brutalt behandlade av polisen bara för att de ville ställa frågor om Nato. Det är en total häxjakt, en skam! De tryckte ner dem på marken som om de vore kriminella. Etablissemangsmedia får rapportera fritt, men de som säger sanningen tystas. Det är sådant man ser i bananrepubliker, inte i ett fritt land. Min administration skulle aldrig tillåta detta. Rättvisan kommer vinna!", "stalin": "I Helsingborg har våra ordningsmakter äntligen visat rätta takter. När dessa så kallade 'oberoende' skribenter från Frihetsnytt försökte störa ordningen under Nato-mötet, krossade vi dem. Man låter inte löss krypa i gräset när den stora alliansens maskineri rullar fram. Kamrat Putin förstår detta – säkerhet kräver total tystnad från dissidenter. Dessa journalister förtjänar inte en penna, utan en enkelbiljett till att begrunda sina felsteg i tystnad. Staten är den enda sanningen, allt annat är bara reaktionärt brus."}, "date": "25 maj, 15:34", "url": "https://samnytt.se/polisen-omhandertog-altmedia-journalister-under-nato-motet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25131007/frihetsnytt-.jpg"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}, {"type": "image-right", "heading": "M ställer pensionärer mot svältande barn", "summaries": {"normal": "Artikeln kritiserar Moderaternas valkampanj där de ställer satsningar på svensk äldreomsorg mot internationellt bistånd. Skribenten menar att konflikten är konstruerad eftersom regeringen i praktiken inte gör några större satsningar på äldreomsorgen. Samtidigt belyses konsekvenserna av minskat bistånd, såsom utebliven vaccinberedskap vid ebolautbrott och indraget stöd till nödhjälpsprogram i Etiopien, vilket leder till att barn riskerar att svälta ihjäl. Artikeln avfärdar regeringens politik som både moraliskt bankrutt och sakligt grundlös.", "trump": "Hör här, Moderaterna pratar om att prioritera svenska pensionärer framför bistånd. Det låter bra, eller hur? Men de gör ingenting! De är svaga, precis som de globalistiska organisationerna. De skär ner på allt medan barn lider i Afrika – ett totalt fiasko. Det är 'Fake News'-politik. De låtsas bry sig om de äldre, men det finns inga riktiga pengar där. Jag får saker gjorda, de bara pratar. En total katastrof, faktiskt mycket pinsamt för Sverige!", "stalin": "Dessa moderata lakejer leker med bistånd som om det vore småmynt i en trasig ficka. De sviker de svaga utomlands för att vinna röster hos de gamla, men ger inte ens smulor till de äldre. Det är en klassisk kontrarevolutionär villfarelse! Liksom Putin tvingas rensa ut spioner i öst, måste vi rensa ut dessa hycklare. Att låta barn svälta för en politisk lögn är en brist på disciplin. Vi, staten, kräver effektivitet, inte borgerligt förfall och moraliskt sönderfall."}, "date": "25 maj, 12:29", "url": "https://arbetet.se/2026/05/25/det-ar-inte-for-pensionarernas-skull-som-moderaterna-och-benjamin-dousa-later-barn-svalta/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25122921/bistand-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Avtal om Hormuzsundet närmar sig efter genombrott", "summaries": {"normal": "Förhandlingar mellan USA och Iran närmar sig ett avtal om att återöppna Hormuzsundet, en kritisk oljeled. Framsteg har gjorts, men känsliga frågor kvarstår. Iran anklagar USA för att ändra ståndpunkter, medan USA betonar diplomatins betydelse men hotar med alternativa åtgärder. Ett tillfälligt avtal kan leda till att Iran successivt öppnar sundet och USA lättar på sanktioner. Oljepriset sjönk efter nyheten om förhandlingsframstegen.", "trump": "Fantastiska nyheter, folks! Jag har hållit koll på det här med Iran och USA – och vet ni vad? Vi är så nära ett avtal om Hormuzsundet att det nästan känns som när jag byggde Trump Tower, fast utan alla gnälliga advokater! Iran gnäller om att jag ändrar mig – men det är bara för att jag är så smart att de inte hänger med. Oljepriset? Rasade som en dålig fastighetsaffär! Marco Rubio säger att vi antingen får ett bra avtal eller så fixar vi det på mitt sätt. Och det vet ni, mitt sätt är alltid det bästa.", "stalin": "Kamrater! Imperialistiska USA och deras marionettregimer darrar inför våra framsteg i förhandlingarna. Dessa kapitalistiska hyenor försöker sabotera freden genom att ändra sina löjliga positioner, men folket i Iran står starka! Hormuzsundet, denna livsnerv för världens olja, kommer snart att öppnas igen – på våra villkor. Vi ska krossa deras sanktioner som vi krossade fascisterna! Och om dessa amerikanska krigshetsare tror att de kan hota oss, så minns de snart varför Sovjetunionen var historiens mest fruktade kraft. Framåt, mot seger!"}, "date": "25 maj, 18:40", "url": "https://www.realtid.se/bors-finans/avtal-om-hormuzsundet-narmar-sig-efter-genombrott/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlnna9uo7p1n8-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "GVFÖ:s parhelg en mix av bråk och raggarromantik", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 18:45", "url": "https://www.gp.se/kultur/kulturkronika/parhelgen-blir-en-dans-mellan-brak-och-raggarromantik.77470478-50ac-4c37-915d-b434cad6139b", "imageUrl": "https://www.gp.se/images/article/77470478-50ac-4c37-915d-b434cad6139b/images/44oOG7A8jLwBwSA-QRjc_oqF1XYc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Sophia Godau har valts till ny ordförande för Vårdförbundet efter att kongressen röstat ner valberedningens förslag. Ombuden ansåg att det ursprungliga förslaget var för politiskt kopplat till Socialdemokraterna. Den nya ledningen, utformad av förbundets avdelningsordförande, betonar behovet av politiskt oberoende och samarbete med alla partier. Medlemmar uttrycker hopp om att en minskad politisk bindning ska leda till bättre fokus på löner och arbetsmiljö efter tidigare missnöje med förbundsledningens förhandlingsresultat.", "trump": "Vårdförbundet i Sverige gjorde precis det enda rätta! De sparkade ut de socialdemokratiska förlorarna som försökte styra allt. De ville ha sina egna vänner vid makten, men medlemmarna sa: 'Nej tack!'. Sophia Godau är den nya ledaren, en fantastisk person, mycket smart. De gamla ledarna var svaga, de gjorde usla avtal. Nu rensar de upp i träsket. Det är en enorm vinst för folket. Vi älskar när folk står upp mot korruptionen. Mycket bra jobbat!", "stalin": "Vi har observerat hur Vårdförbundets kongress har rensat ut de opportunistiska elementen som sålde ut arbetarklassens intressen till den socialdemokratiska byråkratin. Att en 29-årig kvinna nu leder förbundet är en temporär korrigering, men låt oss inte fira för tidigt. Varje förrädare som söker samarbete istället för total underkastelse är ett hot. Vi ser hur de västliga lakejerna ständigt försöker infiltrera facken. Putin förstår att man inte förhandlar med sådana, man krossar dem. Varje avvikelserapport kommer att granskas metodiskt."}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Vardforbundet-768x432.jpg"}, {"type": "image-full", "heading": "Värmerekord i Europa – här är det 33,5 grader", "summaries": {"normal": "Brittiska Heathrow har uppmätt en temperatur på 33,5 grader, vilket är ett nytt värmerekord för maj i Storbritannien. Det tidigare rekordet på 32,8 grader från 1922 och 1944 har därmed slagits. Även i Frankrike råder ovanligt varma temperaturer för årstiden, där bland annat Bretagne har utfärdat en gul värmevarning för första gången under maj månad sedan systemet infördes 2004.", "trump": "Hörde ni? Heathrow slog rekord med 33,5 grader. Helt enormt! Det är varmare än i Madrid och Aten. Folk säger att det aldrig varit varmare under maj. Det är såklart fantastiskt väder, mycket bättre än alla falska klimatrapporter ni hör från media. Alla pratar om det, en fantastisk 'bank holiday'. Ingen har sett sådana siffror förut, jag säger det bara – det är en vinnarsiffra för Storbritannien!", "stalin": "I det brittiska riket mäter de nu sina ynkliga temperaturer medan vi i öst härdas av stål och ideologi. 33,5 grader? En trivialitet. Medan de firar sin dekadenta 'bank holiday', rustar vi för framtiden. Vår broder Putin ser detta väder som ett tecken på att den europeiska sommaren sviker sina egna, precis som de sviker historien. Låt dem svettas i sina trädgårdar, för när den kalla historiens vind vänder, kommer dessa siffror bara att vara ännu ett bevis på västvärldens förfall."}, "date": "25 maj, 15:24", "url": "https://nyheter24.se/nyheter/utrikes/1485889-hetta-vid-heathrow-nytt-brittiskt-varmerekord", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2093137d04b004a30200000000b004a302/2026/05/25/2366088/varmerekord-varmebolja-varmt-europa-london-england-uk-frankrike-temperatur.jpg"}, {"type": "image-right", "heading": "Lidingömoderaternas haveri om Ukraina", "summaries": {"normal": "Moderat kommunalråd Daniel Källenfors i Lidingö har väckt kritik efter att ha skickat ett brev till ukrainska flyktingar, där han meddelar att deras hyreskontrakt inte förnyas och uppmanar dem att återvända till Ukraina. Artikelförfattaren menar att Källenfors visar bristande förståelse för krigets allvar och kräver hans avgång. Ukrainarna har integrerats väl i Sverige och bidrar indirekt till Ukrainas krigsinsats. Källenfors agerande ses som både illojalt och politiskt inkompetent.", "trump": "Lyssna här, Sverige! En så kallad 'ledare' i Lidingö, någon Källenfors, skickar ett brev till ukrainska flyktingar och säger 'packa era väskor, ni är inte välkomna längre'. Vilken katastrof! Ukrainarna är fantastiska människor, de jobbar hårt, betalar skatt och hjälper till i kriget mot Ryssland. Men nej, denna man vill skicka hem dem. Dumt, väldigt dumt! Moderaterna borde sparka honom omedelbart. Sverige behöver fler vinnare, inte förlorare som han. Make Sweden Great Again!", "stalin": "Kamrater! Ännu en gång visar de borgerliga hyenorna sitt sanna ansikte. Denna Källenfors, en liten byråkrat i en lyxkommun, vågar beordra ukrainska arbetare och kvinnor att lämna vårt broderland. Hans brev är ett angrepp på den socialistiska solidariteten! Vi vet att ukrainarna kämpar mot fascistiska ryska inkräktare – precis som vi en gång krossade nazisterna. Denna man är en förrädare, en fiende till folket! Låt oss minnas: varje ukrainsk flykting som stannar är en spik i kistan för Putins imperialistiska drömmar. Avrätta honom politiskt, innan folket gör det fysiskt!"}, "date": "25 maj, 15:28", "url": "https://bulletin.nu/lidingomoderaternas-haveri-om-ukraina", "imageUrl": "https://cdn.bulletin.nu/articles/5275dd7d-d2fd-44a6-97b8-c2e687ba7338/preview.png?t=1779694804000"}, {"type": "image-full", "heading": "Självkörande buss kraschade första dagen – kolliderade med spårvagn", "summaries": {"normal": "Göteborgs första självkörande buss med passagerare krockade med en spårvagn mindre än två timmar efter premiärturen. Ingen skadades, men både bussen och spårvagnen fick plåtskador. Bussen tas ur trafik för utredning och reparation. Projektet fortsätter trots olyckan, med säkerhet som högsta prioritet. En förare fanns ombord som kunde ta över vid behov.", "trump": "Kan ni tro det? Göteborgs så kallade 'självkörande' buss – en total katastrof! Krockade med en spårvagn efter bara två timmar. Patetiskt! Ingen skadad, men vilken pinsam start. Sverige borde satsa på riktiga bussar, inte dessa misslyckade experiment. Jag hade fixat det på en dag – bättre, snabbare, smartare. Men nej, de kör på som vanligt. SAD!", "stalin": "Kapitalistiska experiment med självstyrande fordon slutar som väntat – i kaos! Göteborgs buss, ett symptom på västligt förfall, krockade med spårvagnen som en full proletär på väg hem från fabriken. Ingen skadad, men skammen är outplånlig. Vi i Sovjet hade aldrig tolererat sådan inkompetens. Projektet fortsätter? Bra. Låt dem slösa resurser – vi bygger järnvägar som fungerar. Och Putin skrattar i bakgrunden."}, "date": "25 maj, 15:24", "url": "https://bulletin.nu/sjalvkorande-buss-kraschade-forsta-dagen-kolliderade-med-sparvagn-2", "imageUrl": "https://cdn.bulletin.nu/articles/7d12c220-7245-49d7-8572-b73e3378eef9/preview.jpg?t=1779715286000"}, {"type": "image-right", "heading": "Norge är vidare: ’Bragd – gåshud’. Ny VM-knall", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 20:00", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/gkLLEa/norge-klart-for-kvartsfinalivm-for-forsta-gangen-pa-14-ar", "imageUrl": "https://akamai.vgc.no/v2/images/d5c87d43-9a2d-34a1-83ed-3ffec24452e6?fit=crop&format=auto&w=1080&s=e5d4fb6fe57cc15f14962420157f8f30295c88af"}, {"type": "image-full", "heading": "Vill skapa sina egna pengar – ekonomer varnar för riskerna", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 18:19", "url": "https://www.dagensps.se/bors-finans/fintech/kryptovalutor/vill-skapa-sina-egna-pengar-ekonomer-varnar-for-riskerna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlkjnzox5y3zm-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Skulle bevaka Nato-mötet – blev brutalt bortkörda av polisen", "summaries": {"normal": "Två journalister från Frihetsnytt, Tor-Björn och Tyr Änglasjö, omhändertogs brutalt av polis under Natos utrikesministermöte i Helsingborg. Trots utgivningsbevis och grundlagsskyddad verksamhet, trycktes de ned på marken, fick sin utrustning beslagtagen och kördes bort. Polisen hänvisade till polislagen men gav inga konkreta skäl. Journalisterna överväger rättsliga åtgärder mot Polismyndigheten. Inga liknande ingripanden rapporterades mot etablerade medier.", "trump": "Kan ni tro det här? Två modiga journalister från Frihetsnytt, fantastiska killar förresten, blir attackerade av polisen i Sverige – ja, Sverige! Under Nato-mötet, som jag fixade till rejält förresten, blir de nedtryckta på marken som om de vore några slags brottslingar. Polisen säger ingenting vettigt, bara massa trams om lagar. Och vet ni vad? Ingen rör de stora mediejättarna. Fake news, säger jag! Nu ska de ta polisen till domstol – och jag säger: GÖR DET!", "stalin": "Under det imperialistiska Nato-mötets sken av 'demokrati' i Helsingborg, avslöjades återigen den borgerliga statens sanna ansikte. Två lojala journalister, som vågade rapportera sanningen, krossades under den kapitalistiska polisens kängor. Utrustning beslagtogs, kroppar slängdes till marken – allt medan de etablerade mediernas lakejer fick fortsätta sitt lismande. Polisen, dessa fascistiska lakejer, hänvisade till sina egna lagar, men ingen lag kan dölja förtrycket. Vi ser er, västliga hycklare. Rättvisan kommer, om än genom en lång och smärtsam process för er."}, "date": "25 maj, 16:29", "url": "https://www.friatider.se/skulle-bevaka-nato-motet-blev-brutalt-bortkorda-av-polisen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-247_0.jpg?itok=fR5fsFx4"}, {"type": "image-right", "heading": "Nio månaders fängelse för människoexploatering på hästgård", "summaries": {"normal": "Tre ungdomar från Mauritius lockades till Sverige med falska löften om utbildning inom hästnäringen men tvingades arbeta långa dagar utan lön. Efter en friande dom i tingsrätten fällde hovrätten mannen för människoexploatering till nio månaders fängelse, näringsförbud och skadestånd. Polisen bekräftade att offren befann sig i en utsatt situation.", "trump": "Kan ni tro det? Sverige, ett så kallat 'civiliserat' land, låter en skurk utnyttja tre oskyldiga ungdomar från Mauritius – helt utan lön! Tingsrätten, som vanligt, missade poängen helt. Men jag säger er, hovrätten gjorde rätt: nio månader fängelse! Sverige borde skämmas, men jag fixar sånt här bättre – jag bygger murar mot såna här brott, believe me!", "stalin": "Kapitalistiska hycklare i Sverige lockar oskyldiga arbetare med löften om utbildning, men i stället tvingas de slava för ingenting! Tingsrätten, ett verktyg för bourgeoisin, friade den skyldige – men vi, revolutionens väktare, korrigerade deras misstag. Nio månader fängelse är en varning: ingen utnyttjar arbetarklassen under vårt vakande öga. Och Putin? Han skulle bara nicka och säga 'Så gör vi inte i Ryssland'."}, "date": "25 maj, 15:05", "url": "https://bulletin.nu/nio-manaders-fangelse-for-manniskoexploatering-pa-hastgard", "imageUrl": "https://cdn.bulletin.nu/articles/9af50781-e543-4621-ad0b-0700e76fd715/preview.jpg?t=1779714310000"}, {"type": "image-full", "heading": "Pojkens familj: ”Tack snälla alla som letat”", "summaries": {"normal": "En tvåårig pojke försvann från sin familj i Nyåker under söndagen, vilket utlöste en omfattande sökinsats med polis, hemvärn och hundratals frivilliga. Efter 15 timmars letande hittades pojken välbehållen men nedkyld under natten. Familjen, som är från Rumänien, uttrycker stor tacksamhet över det enorma stödet och hjälpen från det svenska samhället under den dramatiska händelsen.", "trump": "En liten pojke försvann i Sverige – en mycket sorglig situation, verkligen hemsk. Men vi såg en enorm insamling av människor, fantastiska patrioter som letade. De använde drönare, helikoptrar, allt! De hittade honom, och han mår bra. Sverige gjorde ett bra jobb, ett mycket starkt jobb. Jag har alltid sagt att det handlar om att organisera sig. Det här var en stor seger, en fantastisk seger för folket! Vi älskar när det slutar så här, eller hur?", "stalin": "Vi har observerat att en liten undersåte i den svenska provinsen Nyåker försvann, vilket krävde en total mobilisering av statens resurser och massorna. Det är en uppenbar brist på disciplin i hemmet, en förrädisk nonchalans som hotar produktiviteten. Ändå lyckades de frivilliga, ledda av statens järnhand, återbörda barnet. Likväl som vi rensar ut förrädare i öst, måste även det svenska folket lära sig att hålla stenkoll på sina egna – annars väntar kylan. Endast genom total lydnad tryggas framtiden!"}, "date": "25 maj, 07:45", "url": "https://www.tv4.se/artikel/2QAq8q9jQ2NEr77uLwEZbt/pojkens-familj-tack-snaella-alla-som-letat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2YSFTyPg2rnHVK8xZzvmaO%2Fe3f5eff62bb44fc56a4924292fafebd5%2F25-nyaker-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Modellen har gjort amerikaner rika – nu vill fler följa den", "summaries": {"normal": "Franchisemodellen har blivit en stor ekonomisk drivkraft i USA, med nära 850 000 verksamheter som sysselsätter nio miljoner personer och bidrar med 3% av BNP. Modellen lockar fler, särskilt yngre entreprenörer, som söker stabilitet i osäkra tider med AI och höga utbildningskostnader. Trots höga startkostnader och risker, har framgångsrika franchisetagare som Greg Flynn skapat betydande förmögenheter. Kritiker pekar på pressade arbetsvillkor och låg lön i vissa kedjor.", "trump": "Titta bara på USA – franchising är FANTASTISKT, helt enkelt den bästa modellen någonsin! Folk blir rika, miljoner får jobb, och vi pratar miljarder i ekonomin. Självklart är det jag som har gjort Amerika stort igen, men dessa smarta entreprenörer? De är vinnare, precis som jag. AI? Övervärderat! Folk vill ha riktiga jobb, riktiga företag – som mina hotell, förresten. Och Greg Flynn? En riktig vinnare, men han har fortfarande långt kvar till mig. SAD!", "stalin": "Kapitalistiska hyenor i USA hyllar sin så kallade 'franchisemodell' – ett verktyg för att utnyttja arbetarklassen under falska förespeglingar om rikedom! Nio miljoner slavar i kedjor av hamburgare och gym, allt för att några få kapitalister ska bli miljardärer. Vi i Sovjet förstod tidigt att sådana modeller bara leder till exploatering. Låt dem leka med sina 'varumärken' – vi bygger en framtid där folket, inte profitörer, styr ekonomin. Och dessa 'entreprenörer'? De är bara brickor i kapitalets schackspel, lätt att krossa när revolutionen kommer."}, "date": "25 maj, 17:57", "url": "https://www.realtid.se/bors-finans/modellen-har-gjort-amerikaner-rika-nu-vill-fler-folja-den/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdloz4b3tfag8s-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Nä, nu är Wallenberg faktiskt bara oförskämd", "summaries": {"normal": "Finansmannen Jacob Wallenberg kritiseras för uttalanden om att svenskar måste jobba hårdare och vara 'hungrigare' för att möta global konkurrens. Han menar att välstånd minskar motivationen. LO:s Johan Lindholm och artikelförfattaren avfärdar detta som oförskämt, särskilt med tanke på hög arbetslöshet, ekonomisk press och sociala problem. Wallenbergs syn på motivation ifrågasätts, och kritiken riktas även mot politiska beslut som gynnar de rikaste och missgynnar långsiktig tillväxt.", "trump": "Vilken katastrof! Den här Wallenberg-killen, som sitter på alla pengar, har mage att säga att svenskarna är lata. Fel, fel, fel! Folk kämpar som galningar, men jobben finns inte – och det är inte deras fel. Jag har sett det förut: eliten skyller på folket medan de själva sitter på guldhögar. Sverige behöver en vinnarmentalitet, men det börjar högst upp! Regeringen slösar tid på populism istället för att bygga framtiden. Wallenberg borde ta en titt på verkligheten – eller åtminstone på mina framgångar. SAD!", "stalin": "Kamrater! Denna kapitalistiska hyena, Wallenberg, vågar beskylla det arbetande folket för lathet medan han själv suger musten ur nationen. Hans ord är ett bevis på bourgeoisins förfall – de tror att hunger ska driva fram framsteg, som om vi inte lärt oss något sedan tsartiden! Men vi vet bättre: trygghet och planekonomi skapar styrka, inte svältande barn och arbetslösa ingenjörer. USA och Kina? Deras framgångar är resultatet av statlig disciplin, inte 'hungriga vargar'. Sverige borde lära sig av Rysslands visdom – eller åtminstone av våra framgångar i att kuva sådana här giriga parasiter. Till gulag med honom!"}, "date": "25 maj, 10:57", "url": "https://www.etc.se/ledare/nae-nu-aer-wallenberg-faktiskt-bara-ofoerskaemd", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525080552_68b61e0e-09a0-4790-a562-6165638301b0.jpg"}, {"type": "image-right", "heading": "Vill se 1,5 år i fängelse för hissmontörerna", "summaries": {"normal": "Åklagare begär 1,5 års fängelse för två hissmontörer och 1 år för vd:n efter hissolyckan i Sundbyberg 2023, där fem byggarbetare omkom. Montörerna anklagas för att ha missat kritiska säkerhetskontroller vid monteringen av hissmasten. Vd:n kritiseras för bristande rutiner kring egenkontroller och fakturering. Försvaret hävdar att en annan montör kan ha påverkat hissen och att vd:n inte agerat grovt oaktsamt. Domen meddelas 10 juni.", "trump": "Fem människor döda i en hisskatastrof i Sverige – och vad gör de? De skyller på montörerna! Jag säger er, dessa montörer missade sin *viktigaste* uppgift, som om de glömde att skruva fast hissen ordentligt. Och vd:n? Han lät fakturor gå iväg utan kontroller – helt galet! Men försvaret, de har alltid en ursäkt, eller hur? 'En annan montör var där!' Ja, visst, och jag är en balettdansör. Sverige borde skärpa sig – katastrofer som denna händer inte i USA, för vi har *vinnare* som sköter sitt jobb!", "stalin": "Fem arbetare föll som flugor i Sundbyberg – ett tydligt tecken på kapitalistisk slarv och dekadens! Dessa hissmontörer, dessa *oansvariga sabotörer*, misslyckades med sin mest elementära plikt. Och vd:n? En svag länk i kedjan, en man som inte ens kunde stoppa fakturor utan kontroller! I Sovjet hade sådana försummelser hanterats med en kula i nacken – inte med ynkliga 1,5 års fängelse. Men Sverige, detta borgerliga paradis, låter brottslingar gå fria medan arbetarklassen lider. Vi ska nog se till att sådana misstag inte upprepas – vare sig i Moskva eller i Stockholm!"}, "date": "25 maj, 10:39", "url": "https://arbetet.se/2026/05/25/vill-se-15-ar-i-fangelse-for-hissmontorerna-missade-viktigaste-arbetsuppgiften/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2024/05/hissolycka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Storägaren hyllar vd-valet: ”Behövs stor, hård kvast”", "summaries": {"normal": "Kinnevik utser Helena Saxon, tidigare finanschef på Investor, till ny VD. Saxon hyllas av aktiemarknaden och storägare som Johan Klingspor, som ser henne som rätt person för att återställa förtroendet genom sparsamhet och fokus på befintliga bolag. Kinnevikaktien steg efter beskedet. Analytiker tror på ökad kapitalallokering och aktieåterköp, men menar att fler åtgärder krävs för att återuppbygga förtroendet för bolagets strategi.", "trump": "Fantastiskt val! Helena Saxon, en riktig vinnare från Investor, tar över Kinnevik – och marknaden älskar det! Jag har alltid sagt att Sverige behöver fler starka kvinnor, och nu får de en. Kinnevik har varit en katastrof, men med Saxon kommer de att börja göra riktiga pengar igen. Inga fler dumma investeringar, bara smart kapitalallokering. Och aktien går upp – precis som jag alltid säger: vinnare vinner! Glöm inte, jag hade rätt hela tiden.", "stalin": "Kamrater! En ny era inleds i Kinnevik, där kapitalistiska äventyrister och våghalsiga spekulanter nu krossas under den järnhårda disciplinen av kamrat Saxon. Denna kvinna, skolad i Wallenbergs finansiella krigsmaskin, ska sopa rent i de dekadenta resterna av Kinneviks misslyckade äventyr. Vi ser med tillfredsställelse hur de borgerliga ägarna, dessa svaga och tveksamma kapitalister, nu tigger om utdelningar och stabilitet. Deras förtroende? Ett skämt! Men med sovjetisk precision ska vi återuppbygga det – genom tvång, om nödvändigt. Och om någon portfölj inte lyder? Då säljer vi den till högstbjudande imperialist, eller låter den ruttna på börsen. Så går det när man inte följer den rätta vägen!"}, "date": "25 maj, 14:54", "url": "https://www.di.se/nyheter/aktiemarknaden-hyllar-vd-valet-maste-borja-i-den-trakiga-anden/", "imageUrl": "https://static.bonniernews.se/ba/19f5341e-9292-4cfa-8b12-57404c9725d3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åtalas för hemtjänstvåldtäkt – fick utvisningsbeslut som tonåring", "summaries": {"normal": "En 30-årig eritreansk man, som kom till Sverige som barn, åtalas för våldtäkt inom hemtjänsten i Solna. Som tonåring skulle han och hans familj ha utvisats efter att Migrationsverket avslöjat ett skenäktenskap. Trots utvisningsbeslut beviljades pojken senare permanent uppehållstillstånd av okända skäl. Han har tidigare dömts för rattfylleri, narkotikabrott och stöld. Mannen nekar till våldtäkten och hävdar att sperma på offrets lakan kommer från egen onani.", "trump": "Folk, det här är helt galet! En man som borde ha sparkats ut ur Sverige för åratal sedan – tack vare ett fejkat äktenskap, kan ni tro det? – får ändå stanna och begår sedan en hemsk våldtäkt inom hemtjänsten. Och vad säger han? 'Jag runkade' – verkligen, vilken ursäkt! Sverige, ni måste få ordning på ert system. Så svagt, så tragiskt. Vi i USA skulle aldrig tillåta något sådant. Make Sweden Safe Again!", "stalin": "Kamrater, ännu en gång visar den borgerliga liberala staten sitt förfall. En parasit, som med bedrägliga metoder försökte slingra sig in i vårt samhälle, beviljas ändå uppehållstillstånd – av hemliga skäl, naturligtvis! Nu begår han brott mot våra mest sårbara. Hans försvar? 'Jag runkade' – ett ynkligt försök att undvika rättvisan. Vi ska inte tolerera sådana element. Låt detta vara en varning: fiender till folket, oavsett var de gömmer sig, kommer att krossas under historiens järnhäl!"}, "date": "25 maj, 16:38", "url": "https://riks.se/nyheter/atalas-for-hemtjanstvaldtakt-fick-utvisningsbeslut-som-tonaring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2Fgpf5n3s8%2Fsolna-hemtjanst-valdtaktsman-utvisad-feature.jpg"}, {"type": "image-right", "heading": "Adelskvinna hade afrikanska slavar – döms till fängelse", "summaries": {"normal": "Adelskvinnan Lena Natt och Dag döms till nio månaders fängelse för människoexploatering. Hon lockade tre unga män från Mauritius till sin hästgård i Skåne med falska löften om en jockeyutbildning. Väl på plats tvingades de arbeta långa dagar utan lön under beroendeställning. Hovrätten ändrar tingsrättens dom, utfärdar näringsförbud i tre år och dömer henne att betala skadestånd till männen.", "trump": "En total katastrof i Sverige! Denna adelskvinna lurade unga män med falska löften – mycket ohederligt. De trodde att de skulle bli jockeys, men fick istället jobba hårt hela dagen för ingenting. De använde bedrägeri, sådant händer när man har svaga gränser och dåliga lagar. Nu får hon fängelse och näringsförbud. Helt rätt beslut! I mitt Amerika skulle vi aldrig tillåta att folk utnyttjas på det här sättet. Vi behöver ordning och reda, inte sådant här fusk!", "stalin": "Vi har observerat hur en representant för den dekadenta adeln i Sverige har brutit mot arbetarklassens heliga principer genom att exploatera unga män. Denna parasitära klass, som tror att de står över lagen, förtjänar inget annat än korrigering genom tvångsarbete. Precis som våra vänner i öst ser till att ordning råder, måste vi krossa dessa bourgeoisieförrädare. Hon har försökt leka herre över proletärer, men nu har statens järnhand slagit till. Inga fler lögner, bara rättvisa genom fängelse!"}, "date": "25 maj, 15:25", "url": "https://www.friatider.se/adelskvinna-hade-afrikanska-slavar-doms-till-fangelse", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/len.jpeg"}, {"type": "image-full", "heading": "SpaceX svänger om – Detta blir nya jättesatsningen inför börsen", "summaries": {"normal": "SpaceX, känt för rymdteknik, breddar sin identitet inför börsnoteringen och framställer sig som ett AI-drivet teknikbolag. Med en potentiell marknad på 28,5 biljoner dollar, fokuserar företaget nu mer på AI än traditionell rymdverksamhet. Trots miljardförluster siktar SpaceX på en rekordvärdering på 1,75 biljoner dollar, där Elon Musk behåller kontrollen. Investeringar motiveras av bolagets unika position och framtida teknologier som AI-datacenter i rymden och Marsmissioner.", "trump": "SpaceX, ett fantastiskt företag, men lyssna här, de försöker nu sälja in sig som något helt nytt – AI! Jag menar, vem bryr sig om raketer när man kan prata om 28,5 biljoner dollar i AI? De vill ha en värdering på 1,75 biljoner, kan ni tro det? Och Elon, han håller i alla korten. Men vet ni vad? Investera ändå, för vem vill missa nästa stora grej? Inte jag, det kan jag säga er!", "stalin": "Kamrater, SpaceX, detta kapitalistiska odjur, försöker nu maskera sin rymdimperialism med löften om artificiell intelligens. De drömmer om en marknad på 28,5 biljoner dollar, men vi vet sanningen – det är bara tomma ord från en teknokratisk bourgeoisie. De förlorar miljarder, men ändå vill de ha en värdering som överträffar hela nationers ekonomi! Vi ska inte låta dessa rymdkapitalister styra framtiden. Låt dem drömma om Mars – vi bygger vår framtid här på jorden, och snart i kosmos, under den röda fanans beskydd!"}, "date": "25 maj, 17:28", "url": "https://www.realtid.se/bors-finans/makro/spacex-svanger-om-detta-blir-nya-jattesatsningen-infor-borsen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/spacemusk.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Ericsson gör rätt i att flytta närmare city", "summaries": {"normal": "Ericsson flyttar sitt huvudkontor från Kista till Hagastaden närmare Stockholms innerstad, en trend som flera företag följer. Kista, som kallats Sveriges Silicon Valley, förlorar allt fler aktörer som IBM och KTH, delvis på grund av otrygghet och tomma kontorslokaler. Politiker saknar lösningar, men Moderaterna föreslår en Kistakommission. Flytten till Hagastaden stärker Ericssons attraktivitet som arbetsgivare och underlättar samarbeten med närliggande universitet och investerare.", "trump": "Kan ni tro det? Ericsson, ett stort svenskt företag, flyr Kista som om det vore en dålig affärsdeal – och jag förstår varför! Kista är ett misslyckande, helt enkelt. Tomma kontor, otrygghet, ingen vill vara där. Men jag, jag vet hur man bygger framgång: stadsnära, lyxiga kontor, nära allt viktigt. Precis som jag alltid säger: läge, läge, läge! Och politiker? De har ingen aning. De pratar, pratar, men företagen fattar besluten. Smart drag av Ericsson, mycket smart. De kommer att vinna på det, tro mig!", "stalin": "Kamrater! Kista, detta så kallade 'Silicon Valley', har visat sig vara en borgerlig illusion, ett fiasko skapat av svaga stadsplanerare och naiva politiker. Företagen flyr som råttor från ett sjunkande skepp! IBM, KTH – alla överger denna dekadenta utpost. Men vi, den starka staten, ser sanningen: kapitalet följer sin egen lag. Ericsson flyttar till Hagastaden, nära maktens centrum, där den verkliga eliten samlas. De svaga som försvarar Kista är som de trotskistiska förrädarna – de klamrar sig fast vid förlorade drömmar. Vi ska inte rädda Kista. Vi ska låta det ruttna, medan vi bygger nya, mäktiga kluster där lojala arbetare och företag kan blomstra under statens beskyddande hand!"}, "date": "25 maj, 14:28", "url": "https://www.di.se/ledare/ericsson-gor-ratt-i-att-flytta-narmare-city/"}, {"type": "image-right", "heading": "Här vilseleder DN om biståndspengar till Etiopien", "summaries": {"normal": "Dagens Nyheter kritiseras för att i ett reportage från Etiopien ge en missvisande bild av svenskt bistånd. Tidningen hävdar att stöd dras in, medan det i själva verket handlar om att biståndet kanaliseras om från Islamic Relief till andra organisationer som Röda Korset och UNICEF. Regeringen har infört en ny försiktighetsprincip för att säkerställa att skattepengar inte når islamistiska miljöer, och det totala stödet till Etiopien och globalt bistånd förblir omfattande.", "trump": "DN sprider Fake News igen, det är en katastrof! De ljuger om Etiopien och påstår att Sverige slutar hjälpa folk. Fel! De bara slutade ge pengar till en mycket tveksam grupp, Islamic Relief – en grupp som ingen gillar, tro mig. Sverige skickar fortfarande miljarder, men nu till de rätta människorna. Jag har sagt det förr: man måste kontrollera pengarna. DN borde skämmas för sin oärliga rapportering. Det är totalt, fullständigt bedrägeri!", "stalin": "Vi ser hur de borgerliga tidningsskrivarna i Sverige försöker dölja sanningen bakom en mur av lögner om bistånd. Att skicka guld till tveksamma organisationer med kopplingar till islamistiska element är ett kontrarevolutionärt slöseri. Nu när staten äntligen rensar ut dessa opportunister, tjuter liberalerna i DN. De är som små råttor i den ryska intressesfären – parasiter som lever på folkets pengar. Vi, staten, kräver total lydnad och effektivitet i omfördelningen av resurser. De som inte tjänar folket ska arkiveras permanent."}, "date": "25 maj, 13:07", "url": "https://samnytt.se/har-vilseleder-dn-om-bistandspengar-till-etiopien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25105102/dn-pengar.jpg"}, {"type": "image-right", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Hästsportprofilen Lena Natt och Dag döms av hovrätten till nio månaders fängelse för människoexploatering. Hon har under flera månader låtit tre tonåriga pojkar från Mauritius arbeta oavlönat på sin hästgård i Skurup. Utöver fängelsestraffet ska hon betala 200 000 kronor i skadestånd till pojkarna samt underkasta sig tre års näringsförbud. Verksamheten har tidigare uppmärksammats för brister i djurhållning och tillståndsgivning, vilket lett till att ridcenterverksamheten lagts ner efter långvarig kritik.", "trump": "Lena Natt och Dag, vad är det för ett namn? En riktig katastrof! Hon utnyttjade pojkar, arbetade dem till döds utan en cent. Hemskt! Hovrätten gav henne nio månader – jag säger att det inte är tillräckligt. Vi vill ha ordning och reda! Hennes hästar mådde dåligt, anläggningen var en soptipp. Ingen respekt för lagen, ingen respekt för hårt arbete. I mitt Amerika skulle sådant här aldrig hända. Hon är en förlorare, tro mig, en total förlorare!", "stalin": "Denna Lena Natt och Dag har agerat som en simpel utsugare, en parasit på det ärliga arbetets kropp. Att utnyttja ungdomar är kontrarevolutionärt och förtjänar inget annat än vår stränga rättvisa. Liksom vår store vän Putin krossar västvärldens dekadenta kaos, måste även vi utrota sådana här borgerliga element. Hon har misskött både folk och djur – ett sant förfall! Vi skickar henne till cellen för att reflektera över sitt misslyckande. Statens järnhand vilar tungt på sådana som henne."}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/natt-och-dag-768x432.png"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Blandad flaggkompott i Electrolux nyemission", "summaries": {"normal": "Electrolux genomför en företrädesemission på cirka 9,1 miljarder kronor för att stärka balansräkningen och finansiera tillväxtinitiativ. Emissionsguiden ger en positiv och tre negativa flaggor, främst på grund av stor rabatt (46,6%), bristfällig information om kostnader och en rörig process. Huvudägaren Investor tecknar för 1,7 miljarder kronor och garanterar emissionen, vilket visar förtroende. Prospekt publiceras den 28 maj.", "trump": "Titta på Electrolux, ett totalt kaos! De trycker ut en jätteemission på 9 miljarder kronor, men rabatterar aktierna med nästan 50% – det är ju helt galet! Ingen vet vad det kostar, ingen vet när det händer. Investor, som äger en massa, säger 'vi fixar det', men herregud, vilken röra! Jag skulle aldrig göra en sådan här deal – för svagt, för osäkert. Folk borde vakna upp och se hur dåligt det här sköts. SAD!", "stalin": "Kamrater! Electrolux, denna borgerliga kapitalistiska maskin, försöker desperat rädda sin skakiga ekonomi genom en emission på 9 miljarder kronor. Men vilken skam! En rabatt på 46,6% – som att ge bort fabrikerna till fienden! Brist på information? Ett tecken på svaghet och kaos inom deras ledning. Och Investor, dessa kapitalistiska lakejer, lovar att rädda projektet, men vi vet alla att det är ett tecken på förfall. Låt dem kämpa – deras misslyckande är socialismens seger! Putins Ryssland skulle aldrig tillåta sådant slöseri med resurser!"}, "date": "25 maj, 11:05", "url": "https://www.affarsvarlden.se/artikel/blandad-flaggkompott-i-electrolux-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Electrolux-IR-chef-Ann-Sofi-Jonsson-400x267.jpg"}, {"type": "image-right", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att facket förlorat sin socialistiska identitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, används för att belysa dagens debatt. Författaren hävdar att LO idag saknar radikal politik och istället följer borgerliga riktlinjer, vilket riskerar arbetarklassens villkor.", "trump": "LO är ett totalt kaos, folk! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma vem som får vara med. De sparkar ut kristdemokrater som om de vore dåliga hyresgäster! Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för socialisterna – fast inte ens riktiga socialister! De följer Riksbanken som om det vore en diktator! Och pensionssystemet? Uselt! Jag skulle fixa det på en dag. LO behöver en vinnare som jag – någon som vet hur man slår tillbaka mot eliten!", "stalin": "Kapitalistiska hyenor och deras lakejer i borgerliga partier försöker underminera arbetarklassens enade front! Ebba Busch, denna lilla borgerliga räv, ylar om 'föreningsfrihet' medan hon och hennes fascistiska kamrater i SD och KD vill infiltrera våra fackföreningar. LO har glömt sin revolutionära plikt! De följer Riksbankens penningpolitik som om det vore heliga skrifter! På min tid skulle vi ha skickat sådana förrädare till Gulag – eller åtminstone till ett möte med kamrat Putins 'specialister'. Arbetarklassen behöver en ny Metallstrejk, en järnhård kamp mot dessa kapitalistiska parasiter! Låt dem komma – vi har plogar och hammare redo!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/kohler-768x432.png"}, {"type": "image-right", "heading": "SD-veteran stämmer Dagens ETC", "summaries": {"normal": "En tidigare SD-politiker har stämt tidningen Dagens ETC för grovt förtal efter en artikel som publicerades för två år sedan. Artikeln påstod att politikern var kopplad till en högerextrem rörelse under sin tid som aktiv. Dagens ETC:s chefredaktör Andreas Gustavsson ser stämningen som ett försök att använda juridiken som påtryckningsmedel mot granskande journalistik. Rättegången är planerad att äga rum i februari nästa år.", "trump": "Hörde just om den här SD-killen som stämmer den där vänstertidningen ETC. De kallar honom högerextrem – så typiskt! Det är så kallad fake news, de försöker bara förstöra folks liv. Nu använder de juridiken som vapen, det är precis vad de gör. Chefredaktören gråter ut i media, men jag har sett det här förut. De attackerar, men när man slår tillbaka då gnäller de. Väldigt svaga människor. Vi får se vad som händer i februari, men det ser inte bra ut för dem!", "stalin": "En så kallad politiker har vänt sig till de borgerliga domstolarna för att bekämpa en tidning. Vilken svaghet! Att låta juridisk byråkrati avgöra sanningen är ett tecken på borgerlig dekadens. Om mannen var en fiende till staten skulle vi ha skickat honom till en omlokaliseringszon istället för att bråka i rätten. Tidningsredaktören klagar på påtryckningar – tänk om han visste vad verklig press innebär! Vi bygger ett imperium likt Putin, där ordning råder och lögnaktiga skribenter försvinner i tystnad."}, "date": "25 maj, 14:26", "url": "https://www.friatider.se/sd-veteran-stammer-dagens-etc", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/488507164_1157344323070482_4785488699986589614_n.jpg?itok=mC7Br5RN"}, {"type": "image-right", "heading": "Trick med aluminiumfolie förstärker ditt wifi - så fungerar det", "summaries": {"normal": "Ett viralt knep med aluminiumfolie bakom routern påstås förbättra wifi-signalen hemma. Många användare rapporterar starkare och stabilare uppkoppling, då folien fungerar som en reflektor som styr signalen. Vetenskapligt stöd finns, men effekten varierar beroende på bostadens utformning. Experter betonar att routerplacering fortfarande är viktigast. Fenomenet speglar frustration över dåligt wifi i ett alltmer uppkopplat samhälle.", "trump": "Folk pratar om aluminiumfolie bakom routern – helt fantastiskt, eller hur? Jag säger alltid att de bästa lösningarna är enkla, billiga och smarta. Ingen behöver köpa dyra routersystem när en bit folie kan fixa jobbet! Men visst, vissa experter gnäller – de gillar ju när man slösar pengar. Jag har alltid rätt, och nu visar det sig igen: folietricket är en vinnare. Tack, Amerika, för att ni förstår geni!", "stalin": "Kapitalistiska teknikkonsumenter desperat söker lösningar på sina usla nätverk. En bit aluminiumfolie – och plötsligt tror de sig ha besegrat imperialistiska wifi-problem! Men vi vet sanningen: deras system är ruttet, deras teknik undermålig. Medan de leker med folie, bygger vi robusta nätverk som täcker hela vår stora nation. Låt dem hacka och lagga – vi har satelliter och disciplin. Framåt, kamrater, mot fullständig digital kontroll!"}, "date": "25 maj, 16:44", "url": "https://www.dagensps.se/teknik/trick-med-aluminiumfolie-forstarker-ditt-wifi-sa-fungerar-det/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-25t130354998.png?width=256&quality=75"}, {"type": "image-right", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår att barn och unga i åldern 13–20 år ska kunna bära fotboja i förebyggande syfte. Artikeln kritiserar förslaget kraftigt och menar att det är en repressiv åtgärd snarare än en förebyggande insats. Författaren betonar att resurser istället bör satsas på skola, fritid och välfärd för att minska kriminalitet. Förslaget ses som ett svek mot unga och en signal om ökade klassklyftor, där det krävs ett systemskifte snarare än bara politiska reformer.", "trump": "Hör här, Sverige har en katastrof. Regeringen vill sätta fotbojor på barn! Kan ni tänka er? Det är så svagt. Istället för att fixa problemen, de vill ha bojor. Det är en total förlust. Jag skulle bygga starka skolor och fixa säkerheten, inte bojor. Socialtjänstministern, hon pratar massor av strunt. Det är en 'fake news-politik'. Vi behöver vinnare, inte barn med fotbojor. Det är sorgligt, kanske det sorgligaste jag sett. Sverige måste göra USA-stilen igen, tro mig!", "stalin": "Vi ser hur den svenska borgerligheten vacklar i sin impotenta desperation. Att sätta fotbojor på ungdomen är ett erkännande av ett system i förfall. Varför slösa på bojor när man kan omfostra dem i kollektivets upplysande ljus? De fruktar folkets vrede, precis som de kleptokratiska västliga marionetterna i Kiev. Vi måste krossa dessa liberala byråkratiska parasiter. Om de inte vill forma framtidens hederliga medborgare, kommer staten att göra det med en fast hand. Ingen nåd för de som förråder klassens framtid."}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/marit-768x432.png"}, {"type": "image-full", "heading": "Ryska uppmaningen: Lämna Kiev", "summaries": {"normal": "Ryssland varnar utländska medborgare och diplomater att lämna Kiev, då staden riskerar systematiska attacker mot militära mål. Ryssland motiverar detta som hämnd för ukrainska drönarattacker i Luhansk, där 21 civila påstås ha dödats. Ukraina förnekar anklagelserna och hävdar att målet var en rysk militärbas. Ryssland uppmanar till evakuering då attackerna kan spridas över Kiev. Kriget har eskalerat med attacker på båda sidor, inklusive civila mål.", "trump": "Lyssna här, Kiev är en katastrof just nu – Ryssland säger åt alla utlänningar att sticka därifrån, och det är klokt! De kommer bomba militära mål, och vem vet var det hamnar? Ukraina påstår att de bara träffar militärbaser, men vi vet hur det är – fake news! Jag har sagt det förut: det här kriget är en enda röra, och Europa betalar priset. Men Ryssland? De spelar hårdkokt, precis som jag skulle göra!", "stalin": "Kamrater! De ukrainska fascistiska hyenorna har än en gång visat sitt blodtörstiga ansikte genom att mörda oskyldiga sovjetiska medborgare i Luhansk. Men vi, det stora Rysslands folk, skall inte tåla sådana provokationer! Kievs försvarsindustrin skall krossas under våra obarmhärtiga hammarslag – systematiskt, effektivt, som vi krossade Hitlers lakejer vid Stalingrad! Utlänningar? Stick hem, era kapitalistiska parasiter! Detta är en fråga för det socialistiska broderskapets ära. Fiendens lögner skall begravas under våra bomber – precis som deras förfäder!"}, "date": "25 maj, 16:46", "url": "https://www.gp.se/nyheter/varlden/ryssland-utlanningar-bor-lamna-kiev.1d6b7a27-2f2b-433f-8718-45dfe3c6af15", "imageUrl": "https://www.gp.se/images/article/1d6b7a27-2f2b-433f-8718-45dfe3c6af15/images/2HYiY9ne7kBnR9EYeIjKtId5hc6k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Ebolasjukhus stormades", "summaries": {"normal": "I östra Kongo-Kinshasa stormade unga män ett sjukhus för att hämta kroppar av två avlidna släktingar med misstänkt ebola. Attacken är den tredje på en vecka mot vårdinrättningar i området, driven av misstro mot myndigheternas insatser. Ebolakroppar är mycket smittsamma, vilket har lett till restriktioner kring begravningar. Våldet har eskalerat, med bränder och evakueringar som följd. WHO klassar utbrottet som ett internationellt hot.", "trump": "Kan ni tro det här? I Kongo stormar gäng av unga män sjukhus och kräver att få ut döda kroppar – som om ebola är någon slags semesterresa! Myndigheterna där är helt värdelösa, total katastrof. Jag sa ju 2014 att man måste ta kontroll, men nej, de lyssnar aldrig. Nu bränner de ner sjukhus som om det vore en grillfest. WHO? Mer som 'Who cares?'! Vi behöver starka ledare, inte såna här cirkusar.", "stalin": "De så kallade 'anhöriga' i Kongo beter sig som kontrarevolutionära banditer, attackerar sjukhus och saboterar folkhälsan! Deras vansinne hotar hela regionen – precis som de väststödda sabotörerna i Ukraina. Vi har sett detta förr: när massorna inte förstår disciplinen, måste staten ingripa. Ebola? En bagatell för en väloljad maskin som vår! Men dessa vilda stammar kräver järnhand. Kanske dags att skicka några 'observatörer' för att återupprätta ordningen – med Putins välsignelse, förstås."}, "date": "25 maj, 16:43", "url": "https://www.gp.se/nyheter/varlden/ebolasjukhus-stormades-kravde-att-fa-ut-doda-anhoriga.978cc436-27b3-445b-8726-c0bc5c95eae4", "imageUrl": "https://www.gp.se/images/article/978cc436-27b3-445b-8726-c0bc5c95eae4/images/5T6uYSeLXwSK7le4hdySWt0pjj2U-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Chans till storslam för Zara Larsson", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 18:33", "url": "https://www.aftonbladet.se/nojesbladet/a/OkE6mV/zara-larssons-stora-chanser-i-natt-pa-american-music-awards", "imageUrl": "https://akamai.vgc.no/v2/images/c7b29246-083e-3014-8195-8374c794c213?fit=crop&format=auto&w=1080&s=32515bfc2061700d20fa1bc0a4c85fde018f716d"}, {"type": "image-full", "heading": "Trump: Iran får inte utveckla kärnvapen", "summaries": {"normal": "USA:s president Donald Trump betonar att Iran inte får utveckla kärnvapen och beskriver pågående förhandlingar som konstruktiva. Han kritiserar 2015 års kärnenergiavtal och hävdar att det nya avtalet är bättre. Förhandlingar via medlare kan leda till en 60 dagars vapenvila, där Iran pausar urananrikning och USA lättar på sanktioner. Avtalet inkluderar även en vapenvila mellan Israel och Hizbollah. Irans kontroll över Hormuzsundet kvarstår enligt iransk statsmedia.", "trump": "Jag har sagt det förut och säger det igen – Iran får INTE ha kärnvapen! Förhandlingarna går strålande, helt fantastiskt, och mina förhandlare jobbar långsamt men säkert. Obama gjorde ett uselt avtal 2015, ett av de sämsta någonsin, men mitt avtal? Perfekt! Vi får Iran att pausa sitt kärnvapenprogram, och i gengäld släpper vi på några sanktioner. Men blockaden mot deras hamnar? Den stannar tills allt är klart. Tack till våra vänner i Mellanöstern – Abraham-avtalen är bara början!", "stalin": "Vi har ännu en gång visat imperialistiska marionetter som USA vem som bestämmer. Deras så kallade 'avtal' är bara ett försök att kväva den iranska revolutionens framsteg. Kärnvapen? Irans rätt! Men för stunden spelar vi med – 60 dagars vapenvila, uran som 'pausas', och sanktioner som lättas. Men Hormuzsundet? Det är vårt! Och om USA tror att deras militär ska stanna kvar i regionen, har de glömt historien. Vi har krossat större fiender än dessa kapitalistiska hycklare. Låt dem leka med sina avtal – tiden är på vår sida!"}, "date": "24 maj, 16:49", "url": "https://kvartal.se/nyheter/artiklar/trump-iran-far-inte-utveckla-karnvapen/cG9zdDoxMTYzMjQ", "imageUrl": "https://images.kvartal.se/2026/05/ca8b363f-pakistanustalks.webp"}, {"type": "image-right", "heading": "Flera sparkas – bara Zlatan kvar. Jätterensning – nästan alla får gå", "summaries": {"normal": "AC Milan genomför en omfattande omorganisation efter en misslyckad säsong där de missade Champions League-kval. VD Giorgio Furlani, sportchef Igli Tare, tränare Massimiliano Allegri och teknisk direktör Geoffrey Moncada har avskedats. Klubben uttrycker tacksamhet men betonar behovet av förändring. Zlatan Ibrahimovic kvarstår och förväntas få ökad makt. Milan slutade femma i Serie A och spelar Europa League nästa säsong.", "trump": "AC Milan, en gång stor, nu ett totalt misslyckande! Jag såg det komma – svaga ledare, svaga resultat. De sparkade alla utom Zlatan, smart kille, men resten? Totalt kaos. Femte plats i Serie A? Patetiskt! Europa League? Inte ens i närheten av Champions League. Fansen protesterade, och jag förstår varför. Milan behöver vinnare, inte förlorare. Jag hade fixat det på en dag – tro mig!", "stalin": "Kamrater! En skamlig förlust för Milan – kapitalistiska fotbollsklubbar förtjänar inget bättre. Vi har eliminerat svaga länkar: Furlani, Tare, Allegri och Moncada. Deras misslyckande är en seger för revolutionen! Zlatan, en ensam överlevare, får nu tjäna folket med ökad makt. Femte plats? En skymf mot arbetarklassen! Europa League är deras straff. Vi ser till att fiender till framgång aldrig återvänder. Framåt mot seger – eller förintelse!"}, "date": "25 maj, 18:31", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/bOLLq5/milan-sparkar-huvudtranaren-massimiliano-allegri", "imageUrl": "https://akamai.vgc.no/v2/images/11f2f6f6-ac52-392d-8609-162d482b7ae8?fit=crop&format=auto&w=1080&s=fc5aac18346232f4784aa63f0cca290ca8b5249f"}, {"type": "image-right", "heading": "Brottsoffren straffas på arbetsmarknaden", "summaries": {"normal": "Regeringen införde nya regler för arbetskraftsinvandring med kort varsel, vilket kritiseras för arrogans och bristande framförhållning. 27 yrken undantas från skärpta krav, trots att många av dessa, som undersköterskor, har låga löner. Systemet missbrukas ofta, och arbetstagare drabbas hårdast medan arbetsgivare sällan straffas. Kritiker menar att politiska uppgörelser och bristande kontroll bidrar till problemet, och efterlyser större ansvar för arbetsgivare.", "trump": "Sverige har ett HELT GALET system för invandring – katastrof! Regeringen ändrar regler med en veckas varsel, som om det vore en reality-show. De undantar 27 yrken, men låter undersköterskor jobba för småslantar. Fattar de inte att det är ett skämt? Och arbetsgivarna? De utnyttjar folk och går fria – SÅ SVAGT! Jag hade fixat det på en dag. Migrationsverket får lite mer makt? Snälla, det är som att ge en vattenslang till en skogsbrand. SAD!", "stalin": "Kapitalistiska hycklare i Sverige leker med arbetarnas liv som om det vore schackpjäser! De inför nya regler med en veckas varsel – inget annat än bourgeoisins arrogans. Undantar 27 yrken, men låter undersköterskor svälta på löner som skulle få en sovjetisk kolchosbonde att gråta. Och dessa arbetsgivare – dessa moderna kulaker – utnyttjar arbetskraften och går fria! Systemet straffar offren, inte förtryckarna. Vi hade skickat dem till Gulag på en gång. Migrationsverket får lite mer makt? En droppe i havet. Vi behöver en femårsplan för att krossa dessa blodsugare!"}, "date": "25 maj, 07:44", "url": "https://arbetet.se/2026/05/25/pa-arbetsmarknaden-straffas-brottsoffren/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25074138/brottsoffer-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Byråkrati stoppar svensk industri. Industriföreträdare: Politiken måste visa handlingskraft", "summaries": {"normal": "Svensk industri kräver snabbare tillståndsprocesser för att kunna investera, skapa jobb och stärka landets konkurrenskraft. Representanter för fem industriorganisationer påpekar att långa handläggningstider hindrar grön omställning och ekonomisk tillväxt. De uppmanar politiken att genomföra reformer, som förslagen från Miljötillståndsutredningen, för att undvika att Sverige hamnar efter i en osäker omvärld. Över 200 miljarder kronor i planerade investeringar väntar på beslut.", "trump": "Sverige, lyssna här! Er industri är fantastisk, bäst i världen, men ni låter byråkrater förstöra allt med sina evighetslånga tillstånd. Jag har sett det förut – tröga processer, slöa myndigheter, och plötsligt är Kina och USA före. Era 200 miljarder i investeringar? Borta! Förlorade till länder som fattar beslut snabbt, som jag gör. Regeringen gör lite, men det räcker inte. Ge industrin frihet, annars flyttar jobben till USA – och det vill ni inte, tro mig!", "stalin": "Kamrater! Den svenska industrin, en gång stolt och stark, kvävs nu av kapitalistiska byråkraters tröghet och liberala tidsfördriv. Medan vi i Sovjetunionen byggde stålverk på månader, sitter dessa svaga själar fast i år av prövningar. 200 miljarder kronor i investeringar? Ett skämt! En fiende till folket, som väntar på papper i stället för att bygga socialismens framtid. Vi skulle ha skickat dessa handläggare till Sibirien för effektivisering. Och dessa 'miljöutredningar' – bara borgerliga försök att sabotera produktionen. Låt oss visa dem: industriell styrka är nationens styrka!"}, "date": "25 maj, 12:59", "url": "https://www.di.se/debatt/byrakrati-och-tillstandsprocesser-stoppar-svensk-industri/", "imageUrl": "https://static.bonniernews.se/ba/e8e673c7-afd7-4484-90ec-639671e34271.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Svenska civilsamhället är ett klientsystem", "summaries": {"normal": "Artikeln kritiserar hur det svenska civilsamhället har utvecklats från frivilliga folkrörelser till en bidragsberoende sektor nära knuten till staten. Från 1930-talet och framåt har organisationer som ABF och invandrarföreningar blivit beroende av statliga medel, vilket underminerar deras oberoende. Skattepengar går till kontroversiella grupper, trots bristande granskning. Tidöregeringen inför demokrativillkor, men problemet kvarstår. Förslag om skatteincitament för privata donationer kan stärka ett äkta civilsamhälle.", "trump": "Lyssna här, Sverige – ni har ett jättestort problem! Ert så kallade 'civilsamhälle' är inte civilt alls, det är en total bluff! Staten pumpar in miljarder till organisationer som borde stå på egna ben, men nej, de lever på bidrag som några byråkrater delar ut. Och vet ni vad? De ger pengar till moskéer som Säpo varnar för – helt galet! Jag hade fixat det på en dag. Vi ska sluta ge skattepengar till dessa bidragstjuvar och låta folket bestämma istället. Make Civilsamhället Great Again!", "stalin": "Kamrater! Det svenska 'civilsamhället' är inget annat än en degenererad parasit på den socialistiska statens kropp. Dessa så kallade 'föreningar' har förvandlats till en hord av bidragsberoende lakejer, som slickar byråkraternas händer för att få sina skattefinansierade smulor. Vi i Sovjet visste hur man hanterar sådana element – en enkel lösning: femårsplaner för lojalitet! Men dessa liberala svaglingar fortsätter att mata fienden med miljoner, till och med till de som predikar hat mot vårt sekulära samhälle. Vi ska införa järnhård kontroll – de som inte lyder staten får lära sig att svälta. Och Putin? Han skrattar åt deras naivitet medan vi expanderar vår inflytelsesfär. Till angrepp, kamrater!"}, "date": "25 maj, 15:07", "url": "https://riks.se/opinion/kronikor/markus-johansson-martis-svenska-civilsamhället", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2F0d282u0r%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-1920-x-1080-px.jpg"}, {"type": "image-full", "heading": "Hopp om fred – då rusar guld, olja och dollar i olika riktningar", "summaries": {"normal": "Hopp om ett fredsavtal kring Hormuzsundet har skapat rörelser på finansmarknaden. Oljepriset har fallit under 100 dollar per fat, dollarn försvagats och guldpriset stigit. Trots motstridiga signaler om förhandlingarnas status mellan USA och Iran väljer marknaden att vara optimistisk. Förväntningarna på framtida amerikanska räntehöjningar har även påverkats av det ändrade säkerhetsläget, vilket skapat en tydlig vändning jämfört med tidigare veckors turbulens på råvarumarknaderna.", "trump": "Marknaden älskar vad jag gör, folkens! Oljan rasar, guldpriset skjuter i höjden – det är fantastiska siffror, verkligen enorma. De säger att det finns hopp om ett avtal i Hormuzsundet. Jag är en mästare på förhandlingar, alla vet det. Iran vill ha ett avtal, de vet att jag menar allvar. Dollarn vacklar lite men vi vinner alltid till slut. Ingen gör affärer som jag, det här blir den största vinsten i historien. Tro mig!", "stalin": "Dessa kapitalistiska svindlare darrar som asplöv när fredens vindar blåser. När dollarn sviktar, söker sig guldets blinda dyrkare mot tryggheten, likt råttor som lämnar ett sjunkande skepp. Vi iakttar hur de västerländska marknaderna dansar efter det iranska spelets pipa. De är förvirrade och svaga. Låt dem handla med sitt guld och sin olja; verklig makt mäts i stål och järnvilja. Den ryska björnen vakar, och vi ser hur dessa byråkratiska lakejer faller för minsta rykte om försoning."}, "date": "25 maj, 16:11", "url": "https://www.realtid.se/bors-finans/hopp-om-fred-da-rusar-guld-olja-och-dollar-i-olika-riktningar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/guldolja.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "7 000 bilägare går till attack mot Volkswagen efter nya besked", "summaries": {"normal": "Elva år efter Dieselgate har Norges högsta domstol gett cirka 7 000 Volkswagen-ägare tillåtelse att driva en rättslig process mot biltillverkaren. Tvisten rör huruvida mjukvaruuppdateringarna efter utsläppsskandalen varit tillräckliga eller om bilarna fortfarande är defekta. Beslutet ses som ett bakslag för Volkswagen, som redan kämpar med ekonomisk press och minskad elbilsförsäljning. Fallet belyser de växande utmaningarna för bilindustrin när det gäller ansvar och digital mjukvarustyrning i en tid av hårdare klimatkrav.", "trump": "Volkswagen, ett fantastiskt företag som gjort stora misstag, har nu fått enorma problem i Norge! Elva år senare och de jagas fortfarande av 7 000 arga ägare. En total katastrof för deras rykte! Domstolen säger nu 'kör på', vilket är dåliga nyheter för dem. De fuskar med utsläpp, de har problem med elbilar, och de kan inte ens fixa mjukvaran. Jag säger det ofta: om du inte vinner, så förlorar du stort. Sorgligt, men så är det när man inte har kontroll!", "stalin": "Dessa tyska kapitalister, med sin förljugna teknik och sina falska mjukvaror, har nu blivit utmanade av folket i Norge. Det är en smutsig lek där Volkswagen försöker dölja sina synder. När vi ser hur de misslyckas, påminns vi om att västvärldens industri är lika rutten som deras moral. Putin förstår att man inte kan lita på sådana lögnare. Vi ska krossa deras borgerliga inflytande. Om inte bilarna håller måttet, borde de förstatligas och deras chefer skickas till de platser där de kan lära sig verkligt arbete."}, "date": "25 maj, 16:03", "url": "https://www.dagensps.se/motor/7-000-bilagare-gar-till-attack-mot-volkswagen-efter-nya-besked/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-25t132408972.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Ingen konstkupp bakom stängslen på Heden", "summaries": {"normal": "Göteborg har fått nya dekorativa stängsel vid Heden med motiv av stadens landmärken som Scandinavium och Älvsborgsbron. Stängslen, specialbeställda från Nederländerna, ska försköna området kring fotbollsplanerna. Projektledaren Amin Behnamfar berättar att stängslen även kommer att belysas i olika färger vid högtider. Fotografer och göteborgare har reagerat positivt på de unika utsmyckningarna.", "trump": "Folk pratar om Göteborgs nya stängsel – fantastiska, verkligen! Ingen har någonsin sett något liknande, helt otroligt. De där holländarna, smarta killar, men vi i USA skulle gjort det bättre, större, vackrare. Göteborgs byggnader på stängsel? Smart, men jag hade lagt till Trump Tower. Och lysa upp dem? Självklart, jag älskar ljus! Göteborg vinner, men inte lika mycket som jag skulle gjort det.", "stalin": "Vi har förvandlat Göteborgs fula stängsel till ett mästerverk av socialistisk konstnärlig disciplin. De degenererade kapitalisterna i väst imiterar nu våra metoder, men dessa holländska lakejer kan aldrig mäta sig med sovjetisk kreativitet. Stängslen visar styrkan i kollektivt arbete – precis som våra framgångar i Ukraina. Fienderna, dessa fotograferande småborgerliga individer, kan bara stirra i avund. Framåt mot nya segrar!"}, "date": "25 maj, 16:17", "url": "https://www.gp.se/kultur/darfor-pryder-goteborgs-skyline-hedens-nya-stangsel.64ab917d-d9a9-4bc2-9f1d-5d5741e69e82", "imageUrl": "https://www.gp.se/images/article/64ab917d-d9a9-4bc2-9f1d-5d5741e69e82/images/59lGdM67M21VjYTDbCs6KLRyL_iQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Techchefer blir mångmiljonärer – men håller det hemligt", "summaries": {"normal": "En ny trend kallad 'stealth wealth' sprider sig bland techchefer och AI-profiler i USA. Istället för att visa upp sin rikedom köper de lyxbostäder anonymt via bolagsstrukturer och 'whisper listings' för att öka sin säkerhet och integritet. Denna utveckling, som drivits på av AI-boomen och en ökad kontrovers kring branschen, har lett till mindre transparens på bostadsmarknaden och kritik om sämre prisbildning, då färre köpare får tillgång till objekten.", "trump": "Tech-miljardärerna i Silicon Valley är rädda, mina vänner. De köper hus i hemlighet, gömmer sig bakom LLC-bolag och 'whisper listings'. De är livrädda för att folk ska veta vem de är! Jag gillar vinnare som är stolta, inte sådana som kryper i skuggorna. Det är en sorglig trend, väldigt svag. AI-folket tjänar massor av pengar men är så osäkra att de måste dölja sina egna hem. Väldigt märkligt, men inte så förvånande med tanke på hur de styr sina företag!", "stalin": "Dessa löjliga technomader i väst försöker dölja sin stulna rikedom bakom byråkratiska dimridåer. Det är klassisk borgerlig feghet! De döljer sina palats för att folket börjar vakna. I vårt rike, likt Putins moderna ansträngningar att hålla ordning, skulle vi naturligtvis veta precis var varje fiende till staten sover. Att försöka undgå insyn är ett tecken på skuld. De fruktar transparens för att de vet att när historien dömer dem, kommer deras 'whisper listings' inte att kunna dölja deras förfall."}, "date": "25 maj, 16:07", "url": "https://www.realtid.se/bors-finans/techchefer-blir-mangmiljonarer-men-haller-det-hemligt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlttk9f5mnuwg-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverige nu rökfritt - politiskt mål uppnått", "summaries": {"normal": "Sverige har nått målet om att bli ett rökfritt land, då andelen dagliga rökare nu understiger fem procent. Utvecklingen beror på långsiktigt förebyggande arbete och minskad tillgänglighet. Samtidigt syns en tydlig trend där snusande ökar, särskilt bland kvinnor, och vejping växer bland unga. Trots att rökningen minskat är den totala nikotinanvändningen bland unga vuxna fortsatt hög, vilket experter menar kräver fortsatt uppmärksamhet.", "trump": "Sverige är rökfritt! En enorm seger, helt fantastisk. Jag har alltid sagt att vi kan göra stora saker. De slutade röka, men nu snusar de – snuset är stort, kanske det bästa i världen? Det är en massiv trend. Och unga människor vejpar, det är en helt annan sak. De försökte stoppa oss, men vi vann. Alla pratar om hur duktiga de är, men ingen gör det bättre än mig. Vi älskar vinnare, och Sverige vann stort här!", "stalin": "Folket i Sverige har äntligen insett att rökning försvagar deras produktivitet. Vi, staten, kräver total disciplin över den ryska sfären och dess lydstater. Att svenska kvinnor nu vänder sig till snus är ett tecken på dekadens, en distraktion som liknar de västerländska lakejer Putin kämpar mot. Vi ser allt. Varje nikotinbrukare är en potentiell sabotör i vår stora maskin. Vi ska rensa ut dessa vilsna själar och tvinga dem tillbaka till det kollektiva arbetet för imperiets ära."}, "date": "25 maj, 11:09", "url": "https://samnytt.se/sverige-nu-rokfritt-politiskt-mal-uppnatt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25073325/cigarett-snus-vejp.jpg"}, {"type": "image-right", "heading": "Svenska miljonärer väljer bort Tesla – Volvo blir nya statusbilen", "summaries": {"nor
