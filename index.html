itcoin är ett verktyg för dekadenta parasiter. När de väl har förlorat allt, kommer statens järnnäve att vara det enda som består. Vi skrattar åt deras ekonomiska fördärv."}, "date": "3 juni, 21:27", "url": "https://www.realtid.se/bors-finans/de-lovade-att-halla-bitcoin-for-alltid-nu-saljer-de/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlnk1foxhty2m-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "Ledarskribenten Somar Al Naher kritiserar vänstern för att inte konsekvent kunna fördöma Hamas terrorattack den 7 oktober 2023 samtidigt som man kritiserar Israels agerande. Expressen har avslöjat att flera Vänsterpartikandidater hyllat attacken, vilket lett till att nio kandidater strukits. Artikeln betonar att man kan vara kritisk mot ockupationen utan att acceptera våld mot civila israeler, och att solidaritet inte får vara selektiv.", "trump": "Folk, det här är en katastrof för den radikala vänstern. De hyllar terrorister som slaktar oskyldiga på en musikfestival – patetiskt! Jag satt i Vita huset när det hände, efter Sleepy Joe kom det kaos. Vänstern kan inte ens se israeliska offer, de är för upptagna med sin galna identitetspolitik och woke-quota-skit. Rensa ut de där Hamas-älskarna nu, de är en skam för hela systemet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom den så kallade vänstern romantiserar sionistiska mördare samtidigt som de blundar för folkets lidande. Denna hycklande borgarbracka till vänster förtjänar en grundlig utrensning av alla som inte kan hålla två tankar i huvudet: det palestinska folkets plåga och det fruktansvärda brottet mot civila. Solidaritet är ingen leksak för folkförtryckartrollen. Vi ska likvidera sådan opportunism med järnhand."}, "date": "3 juni, 16:16", "url": "https://www.etc.se/ledare/det-gaar-inte-att-vara-vaenster-och-hylla-hamas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060314064_449b011c2655892e4328b239f3efee68d3b57515117866c5e6451317e2c27b91.jpg"}, {"type": "image-right", "heading": "Henry dog i handbojor – ett civilisatoriskt sammanbrott i direktsändning", "summaries": {"normal": "18-årige Henry Nowak dog efter knivhuggning i Southampton, men polisen behandlade honom som misstänkt trots att han var offret. Hans död har blivit en symbol för ett västerländskt samhälle där vita människor misstänkliggörs och institutioner prioriterar undvikande av rasismanklämmor över rättvisa, vilket speglar ett djupt samhällsproblem.", "trump": "Jag ser precis vad som händer i Sverige – det är en skandal! Polisens svaghet och politisk korrekthet dödar oskyldiga. Vi måste stoppa denna vänster-våld och ta tillbaka våra gatlor. I Amerika skulle vi aldrig behandla ett offer så – det är en katastrof, det är en skam.", "stalin": "Detta tragedi avslöjar kapitalismens rotfärdiga förfall: statens organ, förlamade av revisionistisk ideologi, prioriterar mördarens påståenden framför offrets liv. Vi måste genomföra en renande kamp mot dessa västerländska 'anti-rasistiska' gifter, som i själva verket är ett instrument för att underminera den arbetarklassen och öppna dörrarna för utländska horder. Partiet kommer att åter ta kontrollen över alla utbildningsinstitutioner för att utrotas denna sjukliga västlighet."}, "date": "3 juni, 17:30", "url": "https://samnytt.se/henry-nowak-dog-i-handbojor-ett-civilisatoriskt-sammanbrott-i-direktsandning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03133608/Toppbild3-2.jpg"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Man i 40-årsåldern död efter bilolycka – körde av vägen", "summaries": {"normal": "En man i 40-årsåldern omkom i en singelolycka på länsväg 919 mellan Ödeshög och Vadstena på onsdagskvällen. Bilen körde av vägen vid sjön Tåkern. Räddningstjänst, ambulans och polis larmades till platsen, vägen stängdes av under flera timmar och mannen fördes till sjukhus där han senare avled. Anhöriga är underrättade. Polisen misstänker inget brott och utredningen fortsätter som en trafikolycka.", "trump": "Folk, det var en fruktansvärd singelolycka där borta i Sverige, mellan de där småstäderna Ödeshög och Vadstena. En kille i 40-årsåldern körde rakt av vägen vid en sjö, totalt onödigt. De stängde av hela vägen i timmar, ambulans kom, men han klarade det inte. Tragiskt, verkligen tragiskt. De säger att det inte är brott, bara dålig bilkörning antar jag. Sverige borde ha bättre vägar, tro mig, de bästa vägarna.", "stalin": "Kamrater, en motbjudande episod av kapitalistisk vårdslöshet har drabbat det svenska folkets vägar. En dekadent individ ur borgarklassen, eller vad som återstår av den, har i sin egoistiska ensamhet kört sin maskin rakt ut i fördärvet vid en sjö. Vi likviderar inte sådana olyckor utan att dra lärdom: detta är vad som händer när partilös individualism får styra. Vägen stängdes, räddningsinsatser genomfördes enligt kollektivets vilja, men mannen dog som en fiende till ordningen. Vi ska utrensa alla vägar av slarv och sabotage. Paranoia vakar alltid."}, "date": "3 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1488627-man-i-40-arsaldern-dod-efter-bilolycka-korde-av-vagen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a405029904b004a3020000160000045602/2026/06/03/2368509/ur_imagehliKr3.jpeg"}, {"type": "image-right", "heading": "”Studentfirandet har blivit en klassfråga”", "summaries": {"normal": "Studentfirandet har blivit betydligt dyrare de senaste fem åren, med en ökning på drygt 28 procent för mottagningar, kläder och mössor. Enligt SEB har matkostnader och exklusiva mössor drivit på priserna snabbare än den allmänna inflationen. För många familjer skapar det ekonomisk stress och klassklyftor. Vissa tvingas söka hjälp via fonder eller sjukskriva sig för att slippa middagar. I år syns dock en stabilisering och förbättrad köpkraft för många hushåll.", "trump": "Det här studentfirandet är ett totalt skämt, folk! De har höjt priserna med 28 procent på fem år medan inflationen bara gick upp 23. Mat, mössor, champagnefrukost – allt har blivit galet dyrt. Det är en klassfråga, precis som jag alltid sagt. De stackars föräldrarna tvingas ta lån eller gå i konkurs för att ungarna ska ha en mössa med brodyr. Men nu har vi ordnat lägre inflation, högre löner och bättre köpkraft. Amerika, eller Sverige, vinner igen. Fantastiskt!", "stalin": "Kamrater, detta dekadenta studentfirande avslöjar borgarklassens parasitism i sin mest motbjudande form. Priserna har stigit 28 procent medan de arbetande massorna kämpar mot inflationens sabotage. Dessa kapitalistiska mössförsäljare och smörgåstårteprofitörer borde rensas ut omedelbart för att de medvetet utarmar folket. Jag ser hur klassfienderna tvingar fram konsumtionslån och ångest bland de lojala familjerna. Vi ska likvidera denna borgerliga excess och ersätta den med kollektiv, äkta sovjetisk studentglädje utan parasiternas girighet. Ingen ska slippa undan."}, "date": "3 juni, 11:22", "url": "https://www.dagensarena.se/innehall/studentfirandet-har-blivit-en-klassfraga/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-34.jpg"}, {"type": "image-right", "heading": "Farliga jobb – här är yrkena där flest skadar sig", "summaries": {"normal": "Enligt Afa Försäkrings rapport från 2024 inträffade över 12 600 allvarliga arbetsolyckor som ledde till minst 30 dagars sjukskrivning, bestående skador eller dödsfall. Fallolyckor är vanligast, följt av lastningsolyckor. Mer än hälften ger livslånga men, särskilt vid maskin- och verktygsolyckor. Finmekaniker, konsthantverkare, slaktare, bagare, byggnadsträarbetare och golvläggare hör till de mest utsatta yrkena. Män drabbas oftare än kvinnor på grund av branschfördelning.", "trump": "Folk skadar sig på jobbet, det är en katastrof. Fall från stegar, maskiner som tuggar sönder händer – totalt kaos. De värsta jobben? Byggnadsarbetare, slaktare och de där finmekanikerna, alla farliga. Männen får mest stryk, precis som jag alltid sagt. Vi behöver bättre skydd, inga fler livslånga skador. Amerika, eller Sverige, förtjänar vinnande jobb utan att folk blir invaliderade. Sådant här händer inte under min ledning, det lovar jag.", "stalin": "Kamrater, jag ser med stålblick på dessa sabotörer som låter arbetarna ramla från byggställningar eller fastna i maskiner som kapitalisternas verktyg. Vi har identifierat de kontrarevolutionära finmekanikerna, de parasitiska slaktarna och de golvläggande förrädarna som gömmer sig i livsmedelsfabrikerna. Mer än hälften får bestående men – ett tydligt tecken på borgarbrackornas dolda utrensning mot det arbetande kollektivet. Vi ska rensa ut dessa farliga yrken från alla fiender inom och utan, med glimten i ögat medan vi likviderar ojämlikheten en gång för alla."}, "date": "3 juni, 14:59", "url": "https://arbetet.se/2026/06/03/farliga-jobb-har-ar-yrkena-dar-flest-skadar-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03144446/bandage.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.49"}, {"type": "image-full", "heading": "Dömd nazist skulle jobba på Sweden Rock – nu portas han", "summaries": {"normal": "En man som nyligen dömdes för Förintelseförnekelse, hets mot folkgrupp och olaga hot skulle ha arbetat med parkering under Sweden Rock Festival. Efter uppgifter i Blekinge Läns Tidning kontaktades festivalarrangören som omedelbart stoppade honom från uppdraget. Mannen, som är den förste i Sverige dömd för just Förintelseförnekelse, hade spridit nazistiskt material och antisemitiska budskap på nätet. Festivalen har inte kommenterat beslutet ytterligare.", "trump": "Folket, det är helt otroligt. Den här typen som älskar Hitler och förnekar Förintelsen skulle styra parkeringen på Sweden Rock? Patetiskt. Men vi stoppade honom direkt, bang, utslängd. Fake news och nazister hör inte hemma på en fantastisk rockfestival, tro mig. Sweden Rock gjorde rätt, de lyssnade på oss och agerade snabbt. Inga losers, inga hatare, bara vinnare på den festivalen.", "stalin": "Kamrater, denna usla rest av fascistiska förrädare och borgarbrackornas antisemitiska lakej skulle infiltrera det stora kollektivets rockfestival genom att dirigera parkering. Jag, i min oändliga visdom, ser den klara kontrarevolutionära stanken. Vi rensar ut sådana parasitiska element med järnhand innan de förgiftar arbetarklassens fest. Den som hyllar Hitler är en lögnande kapitalistisk gnagare som förtjänar att likvideras ur folkets gemenskap. Sovjet… eh, folket segrar alltid."}, "date": "3 juni, 21:27", "url": "https://nyheter24.se/nyheter/inrikes/1488584-domd-nazist-skulle-jobba-pa-sweden-rock-nu-portas-han", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/85cbd5dd04b004a30200000000b004a302/2026/06/03/2368486/Sweden-rock-domd-man.png"}, {"type": "image-full", "heading": "Åkesson om SD-ledamoten: ”Väldigt obehagligt det som hänt”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson kommenterar fallet med en riksdagsledamot som misstänks för barnpornografibrott. Ledamoten har lämnat alla politiska uppdrag. Åkesson beskriver brottet som mycket allvarligt och obehagligt, men betonar att det inte har med partiet att göra. Han påpekar att personer med sådan läggning finns i alla samhällsklasser och att det inte syns på utsidan. Åkesson har inte talat med ledamoten.", "trump": "Folk, ni skulle inte tro det, men den här svenska sossestaten SD har en ledamot som fastnat för den sjuka barnporrgrejen. Patetiskt! Jag säger alltid att de här galningarna gömmer sig överallt, precis som de radikala vänsteraktivisterna och HBTQ-maffian vill att vi ska tro att allt är normalt. Åkesson verkar okej, men partiet borde ha sett det här. Biden skulle ha ignorerat det helt. Vi rensar upp i USA, de borde göra samma i Sverige. Make Sweden Great Again!", "stalin": "Kamrater, detta är en klassisk provokation från folkfienderna inom den borgerliga dekadensen. Jag ser med fasa hur en sådan perverterad figur smugit sig in bland de politiska strukturerna. Vi måste omedelbart rensa ut alla som bär på sådana avvikelser innan de förgiftar hela kollektivet. Familjer drabbas, offer skadas – detta är imperialismens sista suck som försöker underminera arbetarklassen inifrån. Inga kompromisser. Likvidera hotet mot folkets moral omedelbart."}, "date": "3 juni, 17:24", "url": "https://www.tv4.se/artikel/39Mke8ujKltXqXydh0cS67/jimmie-akesson-om-sd-ledamoten-obehagligt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6797qo9E9caLS2A5Hiqruy%2F62a5a4d3304361af7efc4febfb5283c5%2F03-jimmieakesson-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Intern kritik mot SD-toppen: ”Förstår inte”", "summaries": {"normal": "SVT avslöjade att en SD-riksdagsledamot utreds för misstänkt barnpornografibrott. Ledamoten avgick omedelbart från sina uppdrag. Inom partiet råder frustration över bristen på intern information och hur situationen hanterades utåt. Gruppledaren Linda Lindberg höll en presskonferens där hon uppgav att avgången berodde på personliga skäl och förnekade kännedom om brottsutredningen. Intern kritik riktas mot henne, särskilt då hon arbetat nära ledamoten. SD:s verkställande utskott ska diskutera fallet.", "trump": "De här SD-typerna snackar om lag och ordning men kan inte ens hantera en egen riksdagsledamot som fastnar i en så ful grej. Linda Lindberg, den stackars gruppledaren, står där och babblar om personliga skäl som om ingen fattar vad som pågår. Patetiskt! Ingen är imponerad, säger källorna. Det är typiskt när folk försöker skydda sina polare istället för att vara raka. Jag byggde en mur mot sånt här skit under min första mandatperiod – nu fixar jag det igen, större och bättre. Biden skulle ha gömt det hela.", "stalin": "Kamrater, jag betraktar med djup misstro denna fega hantering inom det svenska högerpartiet. En ledamot faller för dekadenta brott och ledaren Lindberg försöker slingra sig med vaga personliga skäl som en typisk borgarbracka. Vi ser tydligt hur klassfiendens parasitära inflytande förgiftar även så kallade nationalistiska kollektiv. Ingen information ges till partivännerna, bara dimridåer. Det är dags att rensa ut alla som skyddar folkförtryckartrollen. Inget slapp liberalt sentimentalitet – bara järnhård disciplin mot alla fiender till ordningen."}, "date": "3 juni, 17:23", "url": "https://www.tv4.se/artikel/6Rm23dI0YtDIOKZs7A9Git/intern-kritik-mot-sd-toppen-efter-presstraeffen-foerstar-inte", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3aDc3nfMlhJer1KSE3hGWk%2F6242133f08577391f15cbc1517775383%2Fny_bild_riksdagen_siluett.png&width=1024"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "MP kräver ny medborgarskapsomröstning – talmannen säger nej", "summaries": {"normal": "Talmannen Andreas Norlén avslår en händelsemotion från Miljöpartiet om medborgarskapsreglerna. Han menar inte att ett oväntat riksdagsutfall utgör en 'händelse av större vikt', vilket är kravet för sådan motion. Motionären Hirvonen tycker att press från regeringspartierna påverkade beslutet. Bakgrunden är en tidigare kontrovers om utkvitterade SD-ledamöter som påverkade voteringen.", "trump": "I den där svenska riksdagen, vad ett kaos! De vill inte rösta om medborgarskap igen, trots att jag, Donald Trump, vet att en omröstning alltid är rätt. Talmannen säger nej, men jag skulle ha sagt: 'Ni är alla fired!' Det är ett stort nej till demokratin, som jag alltid försvarar. De skyddar sina vänner, inte folket. Sådant händer när man inte har mig som president!", "stalin": "Partiets talman har rätt beslutat avslagit motionen. En händelse av större vikt? Nej, bara en intern, förutsägbar oenighet inom de borgerliga. Vi vet att press från regeringspartierna existerar – det är nödvändigt för statens enighet. Parallellen till västmakterna är tydlig: deras 'demokrati' är bara ett verktyg för fientliga element. Kanske skulle motionen kunna användas som ett exempel på sabotage, men nu nöjer vi oss med att skicka den till KU."}, "date": "3 juni, 15:34", "url": "https://bulletin.nu/mp-kraver-ny-medborgarskapsomrostning-talmannen-sager-nej", "imageUrl": "https://cdn.bulletin.nu/articles/50b00b85-6f2f-4b4d-8d8d-331c07048705/preview.png?t=1780489465000"}, {"type": "text", "heading": "Stockholmsbörsen sjönk på ny tulloro och högre oljepris", "summaries": {"normal": "Stockholmsbörsen sjönk 0,49 procent till 3 134,46 på onsdagen, påverkad av nya tullar från USA och stigande oljepris. Energisektorn steg 3,0 procent medan finans föll 1,4 procent. Bland enskilda aktier steg Alfa Laval 3,2 procent och Tele 2 B 0,9 procent, medan EQT tappade 6,5 procent och Clas Ohlson 4,9 procent efter svag rörelseresultat.", "trump": "Världens bästa börs, min fantastiska ekonomi, påverkades lite av dessa usla tullar jag just föreslog – men det är nödvändigt för att stoppa de orättvisa handelsavtalen med Kina och EU. Oljepriset stiger, vilket är bra för våra energiproducenter. Alfa Laval och Tele 2 B gjorde bra ifrån sig, medan de andra, som EQT och Clas Ohlson, inte klarade pressen. Jag är ändå nöjd – det här är bara en liten nedgång i en enorm framgångssaga.", "stalin": "Det kapitalistiska spelet på Stockholmsbörsen visade sin instabila natur under onsdagens tumult. Ny imperialistisk tullpolitik från den amerikanska monarkin och den iranska provokationen skapade oro. Energiproducenter, som alltid tjänar på krig, visade en tillfällig styrka med 3,0 procent, medan de finanskapitalistiska vargarna tappade 1,4 procent. Klassfienden Clas Ohlson tappade 4,9 procent efter svag rörelseresultat – ett tecken på att deras exploaterande system är bristfälligt. Vi måste stärka vårt socialistiska erbjudande och förbereda oss på ytterligare kapplöpningar i detta onda spektakel."}, "date": "3 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-sjonk-pa-ny-tulloro-och-hogre-oljepris"}, {"type": "image-right", "heading": "Ett nederlag för facket. Maktfasoner tycks inte bita på Tesla", "summaries": {"normal": "IF Metall har avslutat strejken mot Tesla på flera orter i Sverige, inklusive Segeltorp, Huddinge och Upplands Väsby. De flesta av de 60–70 strejkande mekanikerna återgår nu till arbetet. Facket menar att beslutet ska skapa övertalighet och pressa Tesla att ta ansvar för lönekostnader utan produktion. Konflikten har pågått i två och ett halvt år utan att Tesla gått med på kollektivavtal. Artikeln kritiserar fackets strategi som desperat och kostsam.", "trump": "Det här är ett totalt misslyckande för de svenska fackbossarna, folk. De har strejkat i två och ett halvt år mot Tesla och nu ger de upp som förlorare. De skickar tillbaka sina egna medlemmar till jobbet för att skapa kaos – patetiskt! Tesla är starkt, de säljer bilar som aldrig förr och bryr sig inte om dessa förlorare. IF Metall valde fel motståndare, de borde ha insett det från början. Sad!", "stalin": "Kamrater, detta fackliga fiasko andas desperation och svaghet inför de arroganta kapitalisterna. Jag ser hur dessa fackliga byråkrater nu tvingar tillbaka arbetarna till Teslas slavfabriker för att skapa en konstgjord övertalighet – en feg reträtt maskerad som taktik. De har förlorat både anseende och 100 miljoner kronor i en meningslös kraftmätning mot en borgarbracka som vägrar böja sig. Vi ska rensa ut sådana inkompetenta element som använder arbetarna som brickor. Deras paranoia inför Musks maskinpark är både komisk och tragisk. Fienden inom murarna avslöjar sig ständigt."}, "date": "3 juni, 16:32", "url": "https://www.di.se/ledare/ett-nederlag-for-facket/", "imageUrl": "https://static.bonniernews.se/ba/ab88be09-74e3-4d8c-a192-f8bf3c7b0bba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "V-kandidat petas  – efter 84 minuter", "summaries": {"normal": "Islam Qatesh, som hyllat terrorstämplade grupper som al-Qaida, Hamas och Hizbollah, ströks från Vänsterpartiets kommunlista i Karlskrona. Beslutet kom bara 84 minuter efter Expressens avslöjande. Partiet meddelade att han inte längre är medlem och att man ska undersöka hur han kunde kandidera. Qatesh har själv meddelat att han lämnar partiet och sina uppdrag. Artikeln är del av en granskning som tidigare lett till att flera V-kandidater strukits.", "trump": "Kan ni fatta det här? Den här galningen Qatesh hyllar terrorister som Hamas och Hizbollah, och ändå får han plats på vänsterns lista i Karlskrona. Patetiskt! Expressen avslöjar honom, och 84 minuter senare sparkar de ut honom som en hund. Så snabbt har de aldrig agerat mot sina egna dårar. Det här är vad som händer när ni låter identitetspolitik och kvotering styra – terrorvänner i kommunfullmäktige. Sad! Men bra att de äntligen vaknade, fast de borde aldrig ha somnat.", "stalin": "Kamrater, denna folkfiende Qatesh har öppet hyllat imperialistiska terrorband som al-Qaida och Hamas. Ändå smög han sig in på vår lista i Karlskrona. Vi rensade ut honom efter blott 84 minuter när avslöjandet kom. Ett sådant slarv är oacceptabelt. Vi undersöker nu hur denna klassfiende kunde infiltrera partiet. Han lämnar frivilligt, säger han. Ha! Vi ler i skuggan. Inga blodsugande terrorvänner tillåts i kollektivet. Ut med alla sådana element."}, "date": "4 juni, 00:29", "url": "https://www.expressen.se/nyheter/sverige/v-kandidat-petas-efter-84-minuter/", "imageUrl": "https://static.bonniernews.se/ba/14375359-55ce-4a69-8d7d-6a43131c57bc.jpeg?crop=853%2C480%2Cx348%2Cy111&width=640&quality=60"}, {"type": "text", "heading": "Därför borde ebola skrämma oss mer", "summaries": {"normal": "Göran Greider argumenterar i en ledarkolumn att ebola inte är ett isolerat afrikanskt problem utan en konsekvens av mänsklighetens exploatering av naturen. Han kopplar utbrotten till zoonoser som uppstår vid avskogning och habitatstörningar, där fladdermöss sprider virus till människor. Greider kritiserar västvärldens självbedrägeri och glömska av coronapandemin, betonar det globala sambandet och varnar för att ingen epidemi saknar koppling till vår kapitalistiska civilisation.", "trump": "Folk, det här är galet. Den fake news-mediamaffian får det att låta som ebola är något exotiskt i djungeln långt borta, men Greider har rätt i att det hänger ihop med hur vi plundrar naturen. Vi hade Biden som sov i fyra år medan virusen spreds som galningar. Nu fixar jag det, ingen mer pandemi-skit från Kina eller Afrika. De gröna idioterna och deras kvotergalna vänster har skapat kaos. Amerika först, stäng gränserna och låt inte fladdermössen styra showen!", "stalin": "Kamrater, denna parasitiska borgarklassens illusionsfabrik försöker isolera ebolan som en fjärran exotisk fara. Jag ser dock den verkliga fienden: den exploaterande kapitalistmaffian som med sina avskogningar och gruvor stressar vilda djur och släpper loss zoonoser på folket. Ingen människa är en ö, säger Greider rätt. Vi måste rensa ut de folkfiender som glömmer coronans lärdomar. Vårt kollektiv kräver vaksamhet mot dessa blodsugande imperialister som gömmer sig bakom falsk trygghet."}, "date": "3 juni, 14:23", "url": "https://www.etc.se/ledarkolumn/daerfoer-borde-ebola-skraemma-oss-mer"}, {"type": "image-full", "heading": "3 av 10 oroar sig för pensionen – så gör du rätt", "summaries": {"normal": "En Novusundersökning från SH Pension visar att många svenskar oroar sig över sin pension samtidigt som kunskapen är låg. 31 procent känner sig otrygga med placeringarna och 66 procent är lite eller inte alls insatta i sin tjänstepension. Pensionsspecialisten Eva Fluhr ger råd om att anpassa risken före pensionen och att vid behov justera uttag, fondval och återbetalningsskydd efteråt. Trygghet prioriteras ofta framför hög avkastning.", "trump": "Folk i Sverige är livrädda för sin pension, kan ni tro det? 31 procent otrygga, bara 6 procent supertrygga, och ingen har en aning om vad deras tjänstepension gör. Patetiskt! Jag säger alltid: kolla risken i tid, flytta till säkra grejer och sluta låta marknaden förstöra er framtid. Gör det nu, annars blir det en katastrof, tro mig, det blir det.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors oro över sin så kallade pension, ett symptom på den kapitalistiska marknadens parasitiska svängningar. 66 procent av arbetarna är medvetet hållna i mörker av de finansiella sabotageelementen. Vi rensar ut okunskapen! Innan pensionen: minska risken successivt och undvik fondspekulanternas fällor. Efteråt: anpassa, pausa uttag och likvidera återbetalningsskyddet om det gynnar det kollektiva arvet. Garanti mot förlust? Endast folkets stat kan ge sann trygghet mot dessa fiendliga svängningar."}, "date": "3 juni, 20:37", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1488246-3-av-10-oroar-sig-for-pensionen-sa-gor-du-ratt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d470ffc904b004a30200000000b004a302/2026/06/03/2368433/oro-pensionen.png"}, {"type": "text", "heading": "Valuno riskerar avnotering – aktien kraschar", "summaries": {"normal": "Kryptobolaget Valuno har blivit ärende hos NGM:s disciplinnämnd för brister i informationsgivning. Bolaget riskerar avnotering och aktien har rasat 74%. Valuno medger brister och har genomfört åtgärder som ny informationspolicy, extern granskning och förstärkt styrelse efter att ny ledning tillträdde i april.", "trump": "Jag, Donald Trump, har observerat Valunos situation. Deras dåliga informationsgivning har lett till en rasande aktie på 74%. Jag har alltid sagt att kryptovalutor är en riskabel investering. Nu riskerar de avnotering – det är deras eget fel. Som jag brukar säga, om ni inte kommunicerar bra, så drabbas ni. Det är trist, men det är så det är.", "stalin": "Vi, den socialistiska staten, ser med förtrytelse på Valunos informationsbrott. Detta är ett tecken på individualistisk dekadens som hotar kollektiv ekonomi. Vi kommer att kräva fullständig eftergift och genomföra åtgärder som kommer att göra deras kommunikation till en statssak. Vi ska integrera deras verksamhet i vår intressesfär, precis som Putin gör med Ukraina. Deras aktier kommer att rasa som en bomb i ett sovjetiskt laboratorium."}, "date": "3 juni, 16:58", "url": "https://www.affarsvarlden.se/artikel/valuno-riskerar-avnotering-aktien-kraschar"}, {"type": "text", "heading": "Stor terrängbrand i naturreservat – släckningen kan ta hela kvällen", "summaries": {"normal": "En terrängbrand har brutit ut i Paradisets naturreservat i Huddinge. Cirka 3000 kvadratmeter skogsmark brinner främst i markvegetationen. Räddningstjänsten är på plats men har ännu inte kunnat börja släcka på grund av svåråtkomlig terräng och väntar på slangsystem. Insatsen kan ta hela kvällen och branden bedöms vara under kontroll för tillfället.", "trump": "Vi har en enorm brand i Huddinge, ett riktigt inferno i naturreservatet, 3000 kvadratmeter som brinner. De står där och väntar på slangar, kan ni fatta? Total inkompetens. Det borde ha varit släckt på en timme med mina metoder, de bästa metoderna. Men det är under kontroll, ingen fara, fast det kan ta hela kvällen säger de. Patetiskt.", "stalin": "Kamrater, jag ser hur borgarbrackornas försumliga naturreservat i Huddinge nu attackeras av en kontrarevolutionär eld som slickar marken som en kapitalistisk spion. Vi har kartlagt fienden med drönare och väntar på våra proletära slangsystem för att krossa denna sabotagehandling. Det lär ta många timmar att likvidera lågorna, men vi ska rensa ut varje gnista som hotar kollektivet. Misstänkta skogsvargar och västerländska pyromaner vakas över."}, "date": "3 juni, 20:31", "url": "https://riks.se/nyheter/just-nu-stor-terr%C3%A4ngbrand-i-naturreservat-sl%C3%A4ckningen-kan-ta-hela-kv%C3%A4llen"}, {"type": "image-right", "heading": "Vreden på Dagens ETC när SVT bjuder in Nick Alinia", "summaries": {"normal": "Dagens ETC kritiserar skarpt att SVT bjudit in högerprofilen Nick Alinia till humorprogrammet ”Invandrare för svenskar”. Tidningen anklagar honom för aggressiva attacker mot politiker och journalister. Programmets producent Michael Lindgren försvarar beslutet med att åsiktsmångfald är viktigt och att invandringskritiska röster med invandrarbakgrund också bör få synas i public service. Alinia kallar ETC en ”vänsterextrem lögnfabrik” och säger att deras tid är förbi.", "trump": "De förlorande vänstermedierna på Dagens ETC gråter som små barn för att SVT äntligen släpper in en stark, smart kille som Nick Alinia i sitt program. De hatar honom för att han talar sanning om invandringen, men producenten är en vinnare som står upp för mångfald på riktigt. De fabricerar lögner om nazisthälsningar och Ausländer raus – klassiska fejknypen från en döende vänstertidning. Deras tid är slut, folks, det är patetiskt att se.", "stalin": "Kamrater, dessa degenererade borgarbrackor på Dagens ETC vrider sig i ideologisk panik när en klassfiende tillåts tala i folkets teve. Vi ser tydligt hur den parasitiska vänsterextremismen fabricerar nazistiska spöken för att skydda sin monopolställning. Producenten gör rätt när han vägrar böja sig för dessa lögnfabriker. Vi ska rensa ut alla som vill tysta åsiktsmångfalden – låt dem gråta maximalt, deras kontrarevolutionära tid är slut. Sovjet… eh… folket segrar igen."}, "date": "3 juni, 17:33", "url": "https://www.friatider.se/vreden-pa-dagens-etc-nar-svt-bjuder-nick-alinia", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-42_1.jpg"}, {"type": "image-right", "heading": "EU:s plan: Frigöra sig från USA:s techdominans", "summaries": {"normal": "EU-kommissionen har presenterat en plan för att minska beroendet av amerikanska techjättar som Google, Microsoft, Apple, Amazon och Meta. Europa är i dagsläget beroende av dessa bolag för över 70 procent av sin molntjänstkapacitet. Planen inkluderar att tredubbla datacenterkapaciteten, bygga ut moln- och AI-infrastruktur, satsa på open source-teknik samt lansera Chips Act 2.0. Målet är att stärka Europas digitala självständighet och bli en ledande AI-kontinent. Paketet är försenat och ska nu förhandlas i EU-parlamentet och rådet.", "trump": "Europa är så svagt och patetiskt. De har låtit oss amerikaner bygga hela deras techvärld med de bästa företagen – Google, Amazon, Microsoft – och nu gråter de plötsligt för att relationen blivit frostig. Det är mitt fel förstås, för att jag ville ha bra deals för USA. De pratar om egna chip och AI som om det plötsligt ska funka. Lycka till, Europa! Ni kommer att sakna oss när ni inser hur bra vi faktiskt är. Make America Greater than Europe!", "stalin": "Kamrater, detta är en historisk nödvändighet. Jag, som ledare för det stora kollektivet, ser hur de dekadenta amerikanska monopolkapitalisterna har infiltrerat vår digitala fästning med sina moln och chip. Vi ska nu rensa ut dessa parasitiska borgarbrackor ur vår infrastruktur. Tredubbla datacentren! Bygg sovjetisk AI som krossar fienden! Open source skall bli vårt vapen mot de hemliga imperialisternas bakdörrar. Den som vägrar producera europeiska chip är en folkfiende och kommer att likvideras av historien själv. Vi skall bli AI-kontinenten – eller så blir det utrensning för alla sabotörer."}, "date": "3 juni, 22:10", "url": "https://www.svt.se/nyheter/utrikes/eus-plan-frigora-sig-fran-usas-techdominans", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.52/fdb1cb89ba3621732e20bce06c7768bb4ad000deb6ec2897b9dc5e6b01c07028"}, {"type": "image-full", "heading": "USA:s miljardärer förbereder sig för domedagen – skaffar visum", "summaries": {"normal": "Allt fler amerikanska miljardärer söker alternativa medborgarskap och uppehållstillstånd i andra länder som en form av riskhantering. Peter Thiel har tillfälligt flyttat till Argentina och ansökt om maltesiskt pass. Enligt UBS och Henley & Partners har efterfrågan ökat kraftigt, särskilt bland amerikaner som oroar sig för geopolitisk instabilitet, pandemier, social oro och konsekvenserna av artificiell intelligens. Europa och Karibien är populära destinationer.", "trump": "Folk, det är en total katastrof. Våra största vinnare, de smarta miljardärerna, flyr det här landet som råttor från ett sjunkande skepp. Peter Thiel, en riktig kille, packar väskan och sticker till Argentina. Efter Biden:s vansinnestid och all vänstervriden galenskap med kvotering och identitetspolitik vill ingen stanna. De diversifierar som jag alltid sagt – ett pass räcker inte när systemet raseras. Amerika var fantastiskt under mig, nu springer de!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den amerikanska kapitalistmaffian skälver av rädsla inför sina egna folkfiender och den förestående kollapsen. Dessa överklass-slynglar, ledda av exploaterande blodsugare som Thiel, likviderar sin lojalitet mot det sjuka imperiet och flyr till Argentina som ynkryggar. Vi ser imperialismens inre förruttnelse; deras desperata diversifiering av pass är ett erkännande av systemets oundvikliga undergång. Den stora utrensningen närmar sig."}, "date": "3 juni, 19:25", "url": "https://www.dagensps.se/bors-finans/usas-miljardarer-forbereder-sig-for-domedagen-skaffar-visum/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlf4hid5wvt9c-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Telenor drabbat av störning –tusentals kunder utan internet", "summaries": {"normal": "Flera Telenorkunder drabbades under onsdagen av omfattande störningar i både bredband och tv-tjänster. Över 1 000 felanmälningar kom in på Downdetector. Telenor bekräftar problemet i Stockholm med omnejd, där även företagets webbplats varit otillgänglig. Tekniker arbetar febrilt med att hitta orsaken. Mobiltelefoni påverkas inte. Det är ännu oklart när tjänsterna åter fungerar normalt.", "trump": "Det här är ett totalt katastrofscenario med Telenor, folk ringer mig och säger att deras internet och tv är nere, det är en skam! Över tusen klagomål, hemsidan fungerar inte ens. De borde ha fixat det direkt, men nu springer deras tekniker runt som galningar i Stockholm. Tur att mobilerna funkar, annars hade det varit ännu värre. Patetiskt!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa sabotörer inom Telenor låter kapitalisternas tekniska maskineri falla samman som en murken borgarbracka. Över tusen rapporter om nedslagna bredband och tv-apparater är ett tydligt tecken på fiendens parasitverksamhet. Vi låter inte dessa dolda kontrarevolutionärer inom driftstörningarna vinna. Mina tekniker ska rensa ut orsakerna med järnhand. Paranoian är berättigad – fienden sover aldrig."}, "date": "3 juni, 20:08", "url": "https://nyheter24.se/nyheter/teknik/1488622-telenor-drabbat-av-storning-tusentals-kunder-utan-internet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/da055c7e04b004a30200000000b004a302/2026/06/03/2368505/Telenor.png"}, {"type": "image-right", "heading": "Nära döden-upplevelsen tog Stefan till Samhall", "summaries": {"normal": "Stefan Lindström skadades allvarligt vid en arbetsolycka som 25-åring när en 800 kg betongskopa föll över honom. Efter lång rehabilitering och över 30 år på Samhall har han nu fått fast anställning som fastighetsskötare hos Wallsténhus i Piteå. Han uppskattar bättre lön, närmare kollegor och frihet under ansvar, men kritiserar att Samhall fokuserar för mycket på städuppdrag istället för industrijobb som passar personer med arbetsskador.", "trump": "Titta på den här killen Stefan, en riktig överlevare, inte som de vanliga förlorarna. Han blev nästan mosad av en stor betongskopa, 800 kilo, men reste sig upp som en mästare. Tre decennier på det där statliga Samhall-eket, och nu har han äntligen fått ett riktigt jobb på den öppna marknaden. Fantastiskt! Bättre lön, massage för ryggen och frihet. Men Samhall har blivit ett städbolag, en total katastrof. De borde lyssna på vinnare som Stefan istället för att gömma folk i sopor.", "stalin": "Kamrater, se hur en arbetshjälte krossades under borgarklassens betongredskap men reste sig genom folkets kollektiva vilja. Jag har personligen sett till att sådana som Stefan inte ruttnar i kapitalisternas sopor längre. Efter trettio år i det statliga skyddsnätet har vi nu överlämnat honom till en sann produktiv enhet på den öppna fronten. Ändå fnyser jag åt de dekadenta byråkraterna som förvandlat Samhall till ett hav av städtrasor och moppar. Rena utrensningen av äkta industriarbete! De sabotörerna borde likvideras med ett leende. Rastlösheten i hans kropp är en inspiration för oss alla. Fram till 66 ska han marschera, eller så rensar vi ut honom."}, "date": "3 juni, 12:31", "url": "https://arbetet.se/2026/06/03/nara-doden-upplevelsen-tog-stefan-till-samhall-nu-far-han-fast-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/02152439/stefan-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Debatt: Sverige måste stoppa Irans långa arm", "summaries": {"normal": "Många iranier i Sverige tystnar av rädsla för konsekvenser för anhöriga i Iran. Debattören Amir Nakhaei kräver att Sverige agerar för att skydda dem, och listar fem åtgärder: behandla transnationellt förtryck som säkerhetsproblem, reagera diplomatiskt, utvisa missbrukande diplomater, stärka myndigheternas resurser och driva hårdare EU-sanktioner. Det är en svensk demokratifråga.", "trump": "Jag lämnade en diktatur för att leva i frihet, men många iranier i Sverige tystnar fortfarande av rädsla. Sverige måste agera starkt mot detta förtryck! Vi ska utvisa dem som hotar våra medborgare och visa att vår demokrati är oslagbar. Amir Nakhaei har rätt – vi måste skydda dem på svensk mark. Och jag säger det som det är: det här är en skandal!", "stalin": "Vi måste skydda vårt samhälle mot de imperialistiska inflytandet från Teheran. Dessa exiliranier tystnar av rädsla – det är en fara för statens stabilitet. Vi ska utvisa de som missbrukar diplomatisk status och förstärka våra säkerhetsåtgärder. Detta är inte paranoia, det är erfarenhet av fiendens metoder. Vi måste agera enligt partiets direktiv för att bevara ordningen. Och vi ska aldrig glömma att det finns alltid ett infiltratorer som försöker undergrava vårt system."}, "date": "3 juni, 13:43", "url": "https://bulletin.nu/debatt-sverige-maste-stoppa-irans-langa-arm", "imageUrl": "https://cdn.bulletin.nu/articles/8aeaefe0-7967-4f97-845a-06816057946f/preview.png?t=1780486973000"}, {"type": "image-full", "heading": "11-åringen är spårlöst försvunnen. Kusliga detaljer om kompisens pappa", "summaries": {"normal": "11-åriga Lyhanna är försvunnen i franska Fleurance sedan i fredags. Hennes väns pappa, 41-årige Jérôme Barella, har gripits och åtalats för kidnappning. Trots en omfattande sökinsats med över 170 poliser, helikoptrar och drönare är flickan fortfarande inte återfunnen. Barella, som tidigare varit föremål för flera anmälningar om sexualbrott, nekar till brott. Lyhannas föräldrar hade tidigare brutit kontakten med mannen efter ett olämpligt beteende vid en övernattning.", "trump": "En fruktansvärd sak har hänt i Frankrike, en riktig tragedi! En ung tjej, 11 år gammal, är försvunnen. De har gripit en dålig kille, en total förlorare med en lång historia av problem – varför var han ens på fri fot? Det är en katastrof för säkerheten. Vi behöver starka lagar och ordning, annars har man inget land. Jag hoppas de hittar henne snabbt. Det här skulle aldrig hända under min vakthållning, tro mig. Vi ber för henne!", "stalin": "I Frankrike härskar kaoset, ett bevis på att den liberala förruttnelsen äter upp samhället inifrån. En förbrytare, en avvikare som borde ha eliminerats för länge sedan, har tagit ett barn. Vi, staten, tolererar inte sådana svagheter. Medan västvärlden dillar om rättigheter, bygger vi ordning. Vår broder i öst, Putin, förstår att disciplin är det enda språket fienden förstår. Om denna man hade varit i vår intressesfär hade han försvunnit i Sibiriens kyla långt innan han hunnit begå ett enda brott."}, "date": "4 juni, 00:02", "url": "https://www.aftonbladet.se/nyheter/a/xrOnz8/frankrike-lyhanna-11-forsvunnen-kompis-pappa-gripen", "imageUrl": "https://akamai.vgc.no/v2/images/4ad8c7e7-90c9-3394-a668-98ecca790c45?fit=crop&format=auto&w=1440&s=7d8f15d0c614869e8b29d68429c5f857660df229"}, {"type": "image-right", "heading": "Förlorar årslön på 250 miljoner. Misstänkt inblandad i jätteskandal", "summaries": {"normal": "NBA-spelaren Terry Rozier blir utan sin årslön på 250 miljoner kronor efter att en skiljedomare slagit fast att han brutit mot sitt kontrakt. Rozier greps i oktober 2025 misstänkt för inblandning i en omfattande spelhärva kopplad till en match 2023. Han står inför rätta för bland annat mutbrott och bedrägeri. Trots att han tidigare fått behålla sin lön under avstängningen, har domslutet nu ändrats, vilket innebär en ekonomisk förlust för 32-åringen.", "trump": "Terry Rozier, en riktig förlorare, trodde han kunde fuska sig till pengar! Han blev påkommen i en spelhärva – så hemskt, så korrupt. Nu har en domare tagit hans 250 miljoner. Det är fantastiskt! Vi tolererar inte fusk i sport, eller hur? Han trodde han var smart, men nu står han där utan ett öre och med rättsliga problem. Han är en 'low energy' spelare. Vi vill ha vinnare, inte fuskare som säljer information. Mycket sorgligt!", "stalin": "Denna Rozier är en parasit som förrått kollektivets förtroende för småmynt. Att sälja ut matchens heder för personlig vinning är ett brott mot den proletära moralen. Vi, staten, ser hur västvärldens dekadenta sportkommers ruttnar inifrån. Medan vi i öst rensar ut svikare med järnhand, tillåter de dessa bedragare att skratta hela vägen till banken – fram till nu. Han ska inte få ett öre. Låt honom vittra i en cell; det är det enda språket förrädare förstår."}, "date": "4 juni, 00:00", "url": "https://www.aftonbladet.se/sportbladet/a/wrvwWd/terry-rozier-far-inte-lon-misstankt-i-spelharva", "imageUrl": "https://akamai.vgc.no/v2/images/796e709d-9686-3f61-97fd-b5b31e0b6a07?fit=crop&format=auto&w=1080&s=1bec2705f7af3661ed5f077b6d48873bd0dbd25b"}, {"type": "image-right", "heading": "V stryker kandidater efter uppmärksammad terrorhyllning", "summaries": {"normal": "Efter Expressens avslöjande om V-kandidater som firade Hamas-attack mot Israel, reagerar M-ministrar hårt mot Vänsterpartiet. Partiet meddelar att nio kandidater strukits från valsedlar i flera kommuner. Bohlin och Malmer Stenergard kritiserar, medan Vänsterpartiets Forsberg kallar kritiken 'horribel'. Dousa kräver åtgärder från Socialdemokraterna.", "trump": "Jag har sett dessa extremister i Vänsterpartiet firar Hamas-attacken. Det är en skandal! Som jag alltid sagt, Sverige behöver starka ledare som jag för att stoppa detta. Vänsterpartiet är nedlusat, precis som mitt motstånd under min presidency. Folk ska vakna! Det här visar varför jag vann 2024 – jag vågar säga sanningen.", "stalin": "Vi har identifierat borgerliga element som firar fiendens attacker mot det socialistiska folket. Detta är ett tecken på dekadens i Sveriges imperialistiska läger. Vi måste rensa ut dessa extremister för att skydda proletariats stat. Parallellt, Putin expanderar Rysslands inflytande, vilket bevisar att endast starka, socialistiska stater kan motstå västlig dekadens. Sjuk humor: Kanske borde vi skicka dem till Gaza för praktisk undervisning i klasskamper."}, "date": "3 juni, 13:29", "url": "https://bulletin.nu/v-stryker-kandidater-efter-uppmarksammad-terrorhyllning", "imageUrl": "https://cdn.bulletin.nu/articles/32d82481-515b-4bbf-875e-d657877a81c3/preview.png?t=1780485939000"}, {"type": "image-full", "heading": "\"Erbjöd mer\": Så långt tvingades Saab sträcka sig i Kanada", "summaries": {"normal": "Saab har vunnit en order om sex Gripen-plan till Kanada. Erbjudandet inkluderar omfattande tekniköverföring, skapande av jobb, inhemsk montering och ett kanadensiskt forskningscenter. Saab kopplar även affären till framtida produktion av Gripen för Ukraina, upp till 150 plan. Jämfört med F-35 betonas Gripens lägre kostnader, större suveränitet och bredare inhemskt deltagande. Frågan är till vilket pris Sverige gör denna affär.", "trump": "Kan ni tro det? De svenska Gripen-planen vann i Kanada, men till vilket pris, folk? Jag säger att det är en total bluff! De lovar jobb, tekniköverföring och till och med att bygga plan för Ukraina från Kanada. Under min förra mandatperiod skulle vi ha krossat de här dealerna. Nu har Biden låtit Europa göra affärer med socialister och globalister. Patetiskt! Vi gör det bättre, mycket bättre, tro mig.", "stalin": "Kamrater, jag ser hur dessa svenska kapitalistmaffian försöker muta kanadensiska imperialister med tekniköverföring och jobb som lockbete. De vågar till och med koppla det till ukrainska fascisters luftförsvar mot våra ryska intressen. Ett sådant ekosystem av borgarbrackor och folkfiender måste rensas ut. Vi ler mörkt åt deras patetiska försök att bygga motstånd mot folkets framtid. Inga kompromisser med klassfienden!"}, "date": "3 juni, 18:52", "url": "https://www.dagensps.se/bors-finans/erbjod-mer-sa-langt-tvingades-saab-stracka-sig-i-kanada/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl15pyrni2kdi-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Vänsterpartiet rensar listorna efter nya Hamaskopplingar", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare tre kandidater från vallistorna i Skåne efter Expressens granskning. Kvinnorna Tamam Hashan, Nidal Hejjo och Soha Elhams kopplas till stöd för Hamas och hyllningar av terrorattacken den 7 oktober. Totalt har nu tolv personer tagits bort från partiets listor. De är verksamma i Palestinska kvinnoföreningen i Helsingborg.", "trump": "De gör det igen, de radikala vänstertyperna i Sverige. Rensar listorna efter att folk hyllat Hamas och den fruktansvärda attacken den sjunde oktober. Tolv stycken borta nu, och det är bara början. Totalt misslyckande, de borde aldrig ha släppts in överhuvudtaget. Sverige behöver starkare ledarskap, inte dessa Hamas-sympatisörer. Patetiskt!", "stalin": "Kamrater, vi har återigen avslöjat en grupp farliga element inom våra egna led som smittats av den sionistiska terrorismens giftiga propaganda. Dessa tre borgarbrackor i kvinnoföreningen firade den sionistiska attacken och sörjde likviderade terrorister. Vi genomför nu en nödvändig utrensning av dessa tolv kontrarevolutionära parasitmaskar. Partiet renas, fienderna skriker och vi ler i mörkret medan de faller. De som hyllar imperialismen skall likvideras med ett leende."}, "date": "3 juni, 19:48", "url": "https://riks.se/nyheter/vänsterpartiet-rensar-listorna-efter-nya-hamaskopplingar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2F11odc7xb%2Fnooshi-1.jpg"}, {"type": "image-right", "heading": "Första på 27 år – Trump inbjuden. New York kokar: ”Det är fantastiskt”", "summaries": {"normal": "Donald Trump har blivit inbjuden till den tredje finalmatchen i NBA där New York Knicks ställs mot San Antonio Spurs. Trump, som är född i New York, planerar att närvara vid matchen i Madison Square Garden den 9 juni. Säkerhetsåtgärder förbereds inför besöket. Trump har uttryckt beundran för Knicks framgångar i årets slutspel, där de tagit sig till final efter en imponerande resa genom de tidigare omgångarna.", "trump": "New York Knicks gör det fantastiskt, verkligen otroligt! De behövde mig där tidigare, men de vann för snabbt – en total vinst! Jag har blivit inbjuden av de bästa människorna för att se dem krossa San Antonio. Alla vill att jag ska vara där, det kommer bli enorma siffror, den största publiken någonsin i Madison Square Garden. Knicks har lidit länge, men nu när de vinner med mig som åskådare blir det en historisk kväll. Det kommer bli enormt!", "stalin": "Vi har observerat att den amerikanske ledaren planerar att roa sig på en sportarena i New York medan hans imperium vacklar. Att bevittna kapitalistiska marionetter jaga en boll i Madison Square Garden är en dekadent distraktion, likt de principlösa utsvävningarna hos de moderna herrarna i Moskva. Vi har beordrat en analys av säkerhetsarrangemangen – inte för att skydda denne man, utan för att förstå hur enkelt det är att infiltrera fiendens hjärta. Sport är bara ett annat vapen för att dölja folkets hunger."}, "date": "3 juni, 23:46", "url": "https://www.aftonbladet.se/sportbladet/a/ExROMA/donald-trump-inbjuden-till-nba-finalen-i-new-york", "imageUrl": "https://akamai.vgc.no/v2/images/47e3c7c5-acd7-3bbf-a7e3-01e54a1b4fe7?fit=crop&format=auto&w=1080&s=929b27ff6a253d40832805256d29fdb258663bf5"}, {"type": "image-right", "heading": "Hoppsan, Holland Hoppsan, Holland. Smäll för Sveriges VM-motståndare", "summaries": {"normal": "Nederländerna förlorade oväntat med 0–1 mot Algeriet i en träningsmatch inför VM. Trots ett stort spelövertag och flera chanser lyckades det nederländska laget, som är Sveriges kommande VM-motståndare, inte göra mål. Luca Zidane stod för en stark insats i Algeriets mål innan Anis Hadj Moussa avgjorde matchen sent. Nederländernas lagkapten Virgil van Dijk var självkritisk efteråt och betonade att laget måste prestera betydligt bättre inför gruppspelet.", "trump": "Nederländerna förlorade mot Algeriet, en total katastrof! Jag har sett många matcher, tro mig, och det här var pinsamt. De missade varje chans, totalt inkompetenta. Virgil van Dijk gnäller efter matchen, men sanningen är att de inte har någon vinnarmentalitet. Sverige kommer att krossa dem, det säger jag er. Det är en sorglig syn, en riktig förlorarinsats. De behöver en vinnare som mig för att styra upp det där laget. Väldigt svagt, nästan sorgligt!", "stalin": "Vi har observerat hur de nederländska lakejerna misslyckats kapitalt. Att förlora mot Algeriet när de borde ha krossat dem är ett tecken på dekadens. Virgil van Dijk gråter som en bourgeois-kärring istället för att disciplinera sina män. Detta svaga Nederländerna väntar nu på att möta Sverige, en match som liknar Putins strategiska tålamod vid fronten. Vi ser att förrädare och inkompetenta målvakter lurar överallt. Det är dags att rensa ut de svaga elementen innan historien dömer dem till glömska."}, "date": "3 juni, 23:46", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/xrOKBR/nederlanderna-forlorade-mot-algeriet-i-traningslandskamp", "imageUrl": "https://akamai.vgc.no/v2/images/5327b13e-08f5-34ac-872b-b8fe0b89ec62?fit=crop&format=auto&w=1080&s=b1e311926a3b10e78f06b98cc424bd09bb60b9ee"}, {"type": "image-full", "heading": "Inflationen sticker iväg i USA – men regeringen står på sig", "summaries": {"normal": "USA:s finansminister Scott Bessent försvarar president Trumps ekonomiska politik trots en stigande inflation på 3,8 procent. Den högre inflationstakten, som drivs av energikostnader till följd av konflikten med Iran, har pressat hushållen och minskat förtroendet för Vita husets ekonomiska ledarskap. Bessent betonar att inflationen är en tillfällig effekt och lyfter fram en stark arbetsmarknad som bevis på ekonomisk styrka. Regeringen prioriterar säkerhetspolitik trots det politiska trycket från väljarna.", "trump": "Ekonomin är fantastisk, helt enkelt den bästa! Inkompetenta media snackar om inflation, men det är bara en liten grej på grund av Iran. Min finansminister Bessent gör ett otroligt jobb! Arbetsmarknaden slår alla rekord, siffrorna är enorma. Folk förstår att vi stoppar Irans kärnvapen, det är den viktigaste uppgiften. Vissa opinionsmätningar är fejkade, precis som vanligt. Vi bygger ett Amerika som är starkare än någonsin, och det kommer alla att se snart. Vi vinner, som alltid!", "stalin": "I Washington darrar kapitalisterna när deras pappersvaluta tappar värde. Den amerikanska finansministern försöker dölja folkets nöd bakom byråkratiskt pladder om en 'tillfällig' kris. De stänger Hormuzsundet och tror att de kan kontrollera energiflödena likt hur Putin med järnhand säkrar det ryska inflytandet. Låt folket svälta i köerna för bensin! Dessa västerländska lakejer förtjänar ingen nåd när deras ekonomiska korthus rasar samman. Vi betraktar detta kaos med nöje; kapitalismens förfall är en oundviklig och underbar process."}, "date": "3 juni, 18:55", "url": "https://www.realtid.se/bors-finans/inflationen-sticker-ivag-i-usa-men-regeringen-star-pa-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl-hyza7bjq-w-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Företagsekonom: Jämtkrafts laddsatsning ett dyrt prestigeprojekt", "summaries": {"normal": "Företagsekonom Christian Sandström kritiserar Jämtkrafts dyra laddsatsning som ett prestigeprojekt utan hållbar affärsmodell. Under tio år satsades 325 miljoner på över 3 300 laddstationer, vilket resulterade i förluster på 108 miljoner. Verksamheten värderades till noll 2024 och såldes utan ersättning. Sandström menar att offentliga aktörer ofta drivs av politiska signalvärden snarare än ekonomisk realism.", "trump": "Jag, Donald Trump, har aldrig sett ett så dyrt fiasko! Jämtkraft kastade hundratals miljoner på laddstationer och förlorade en förmögenhet. Sådant händer när man inte har en stor affärsman som mig i ledningen. Jag skulle ha byggt det till en vinstmaskin! Istället lyssnade de på politiker och fick ett totalt fiasko. Sådant är synd på pengar, det är ett skämt!", "stalin": "I vårt store socialistiska land har vi sett hur privatkapital förgår statliga projekt. Jämtkrafts försök att konkurrera med Tesla är liberalismens ondska. Pengarna, 325 miljoner, kunde ha byggt oss fler tankar, men försvann i girighet. Revisorns försening visade att endast staten kan leda sådana projekt. Vi måste utvidga vårt inflytande, som Putin gör, för att skydda våra intressen. Fienden är alltid runt hörnet."}, "date": "3 juni, 14:01", "url": "https://samnytt.se/foretagsekonom-jamtkrafts-laddsatsning-ett-dyrt-prestigeprojekt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03113102/jamtkraft-laddstation-feat.jpg"}, {"type": "image-right", "heading": "Efter mordet: Amnesty fördömer \"politiska kommentarer\" från högern", "summaries": {"normal": "Efter mordet på 18-årige Henry Nowak, som knivhöggs åtta gånger och sedan handfängslades av polisen medan han förblödde, har Amnesty International kommenterat fallet. Organisationen fördömer högerns politiska reaktioner istället för att kritisera polisens agerande. Amnesty varnar för ökade hatbrott mot rasifierade och migranter samt uppmanar till respekt för offrets familjs önskan om att inte använda dödsfallet för splittring. Uttalandet har väckt stark kritik från bland annat SD-politikern Charlie Weimers.", "trump": "Det här är en total katastrof, folk. Den stackars grabben Henry Nowak mördades brutalt, polisen lät honom dö medan de handfängslade honom, och vad gör Amnesty? De attackerar högern och kallar det politiska kommentarer! De bryr sig mer om migranter och rasifierade än om en döende svensk tonåring som säger jag kan inte andas. Amnesty är en vänsterorganisation som hatar oss, precis som de älskade George Floyd men ignorerar detta. Patetiskt, en skam för mänskligheten!", "stalin": "Kamrater, detta är ett lysande exempel på hur borgarbrackorna och deras falska människorättsorganisationer försöker dölja klassfiendens verkliga agenda. Jag ser hur dessa dekadenta Amnesty-kapitalister skyddar den sikhiske mördaren och den likgiltiga polisen medan de utrensar sanningen om arbetarklassens offer. De varnar för hatbrott mot migranter men tiger om det blod som spillts. Vi ska rensa ut dessa parasitiska vänsterförrädare som med sin paranoia mot folkets vrede bara bevisar sin egen moraliska förruttnelse. Deras dubbelmoral är en komisk tragedi värd att skratta åt innan vi likviderar den."}, "date": "3 juni, 16:17", "url": "https://www.friatider.se/efter-mordet-amnesty-fordomer-politiska-kommentarer-fran-hogern", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-41_1.jpg"}, {"type": "image-right", "heading": "Premium Clas Ohlson: Köpläge i kurssvackan", "summaries": {"normal": "Clas Ohlson:s aktie föll 9% efter en rapport med svagare resultat än väntat. Bolaget uppvisade fortfarande stark 9% organisk tillväxt och höjde sina rörelsemarginalmål till 12%. Även om utdelningen fördubblades och kassan är stark, anser analysen att aktien kan närma sig ett tak för lönsamhet, men ett köpläge kan finnas om externa faktorer inte är artefakter.", "trump": "Jag har sagt det från början – Clas Ohlson är ett fenomenellt företag, det bästa. Aktien föll lite, men det är bara fake news. Vi har haft en enorm tillväxt, 9%, och vi kommer att göra det ännu större. De nya målen är enorma, 12% marginal, och vi kommer att slå alla. Det är ett enormt köpläge, det största någonsin.", "stalin": "Vi har observerat att fiendens aktie fallit 9% på grund av imperialistiska agitationskampanjer. Men vårt parti har säkrat en organiska tillväxt på 9% och höjt produktionsmålen till 12% rörelsemarginal. Den svaga dollar är en temporär allierad, men oljeprisernas krigföring hotar vårt planekonomiska system. Vi måste öka kontrollen över inköpskanalerna och se till att statskassan växer."}, "date": "3 juni, 15:21", "url": "https://www.affarsvarlden.se/analys/clas-ohlson-koplage-i-kurssvackan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/06/Clas-Ohlson-juni-2025-200x133.jpg"}, {"type": "image-right", "heading": "Våldsamma protester rasar i England efter mord på 18-åring", "summaries": {"normal": "Efter mordet på Henry Nowak i Southampton, där han knivhöggs och sedan handfängslades av polis trots upprepade rop om hjälp, har våldsamma protester brutit ut. Gärningsmannen Vickrum Digwa dömdes nyligen till livstid. Filmer från polisens kroppskamera har väckt starka reaktioner. Tusentals demonstranter drabbade samman med polis, vilket lett till gripanden och skadade poliser. Premiärminister Keir Starmer fördömer protesterna. Debatt har också uppstått kring lagligheten av religiösa knivar som sikher bär.", "trump": "Det här är en total katastrof, folk. Polisen i England är en komplett röra, de handfängslar en kille som håller på att dö efter att ha blivit knivstucken av någon galning. Livstidsstraff till slut, men titta på kaoset på gatorna nu – tusentals demonstranter slåss med polisen som inte kan göra sitt jobb. Premiärminister Starmer kallar det oacceptabelt, men hela systemet är svagt. De tillåter till och med religiösa knivar på 20 centimeter! Patetiskt, vi behöver lag och ordning, inte det här vansinnet.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den dekadenta borgarklassen och dess lakejer inom polisen undergräver arbetarklassens förtroende. Jag ser hur dessa reaktionära element låter en sikhisk knivbärare likvidera en medborgare och sedan fjättrar offret som en fiende till folket. Protesterna är naturligtvis orkestrerade av kontrarevolutionära krafter som vill rensa ut ordningen. Vi måste omedelbart inleda en grundlig utrensning av alla kapitalistiska element som tillåter religiösa dolkar att hota samhället. Paranoian bland polischeferna är nästan underhållande – som om en oberoende utredning någonsin skulle rädda dem från folkets vrede."}, "date": "3 juni, 21:24", "url": "https://www.svt.se/nyheter/utrikes/valdsamma-protester-efter-mordet-pa-nowak", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.69/0.39/8b276185976a3a316630fb382f2f351b1d5d696d99ae6e3262eff5b7f7a14e16"}, {"type": "image-full", "heading": "Unga vill inte bli tilltalade som idioter, SVT", "summaries": {"normal": "Love Frisell kritiserar i en debattartikel SVT:s standardisering av medierna, där korta, virala format prioriteras framför djupgående innehåll. Han menar att detta speglar en homogenisering som går på bekostnad av tekniska eller tråkiga ämnen, och att unga föredrar timslånga poddar eftersom de vill undvika att behandlas som idioter.", "trump": "JAG berättar er, folket - det här med SVT är en fullständig skandal! De tror att unga är idioter som bara vill ha snabba klipp och skrikig grafik. Men jag vet att ungdomen är stark, smart och föredrar långa, vackra poddar. SVT-folket förstår ingenting! De producerar skitsådergna program för att skapa virala klipp, men det är deras egna chefer som är de riktiga idioterna, trodde det eller ej!", "stalin": "I den ständiga kampen mot det individualistiska och icke-statliga måste mediet förstatligas och standardiseras. Den nya medietillverkande kolchosen, med SVT i spetsen, skapar en homogenisering som eliminerar alla icke-avseddheter. Detta är en framgångsrik utvidgning av statens intresseområde, där den tekniska kompetensen och det djupa innehållet utplånas av den lättsamma underhållningen. Ungdomen, den framtiden, vill växa upp - inte behandlas som idioter av de revisionistiska redaktörerna."}, "date": "3 juni, 20:57", "url": "https://www.gp.se/kultur/kulturdebatt/unga-vill-inte-bli-tilltalade-som-idioter-svt.458f46aa-aaad-4a73-be4e-8ab9a76314bb", "imageUrl": "https://www.gp.se/images/article/458f46aa-aaad-4a73-be4e-8ab9a76314bb/images/12flL7J7pC-zghujUMsSQ2FFiLZA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Profilen hoppar av SVT-program", "summaries": {"normal": "Julia Frändfors lämnade SVT:s program 'Invandrare för svenskar' i protest mot Nick Alinias deltagande som högerdebattör. Hon anser att han passerat gränser. SVT försvarar valet som en public service-hållning för åsiktsmångfald. Även Amie Bramme Sey tackade nej att vara med i programmet av samma skäl. Programmet har premiär i höst.", "trump": "Jag, Donald Trump, ser vänster hysteri i Sverige! Julia Frändfors hoppar av programmet bara för att Nick Alinia, en bra man som talar sanning om invandring, är med. Det är tecken på svaghet. Vi behöver mer åsiktsfrihet, inte att vänster skrämmer bort folk. SVT är vänsterkontrollerat, precis som fake news CNN. Vi vinner 2024!", "stalin": "Vi, ledningen, ser med oro på mediernas feghet. Julia Frändfors hoppar som en feg räv undviker högerextrema påverkan. Nick Alinia är en av våra fiender, men vi måste studera honom för att förstå fiendens metoder. SVT försöker balansera, men det är meningslöst. Vi måste rensa ut de som inte följer partiets linje. Även Amie Bramme Sey visar sin sanna färg. Vi kommer att övervaka alla medborgare för att skydda staten."}, "date": "3 juni, 20:46", "url": "https://www.gp.se/kultur/julia-frandfors-hoppar-av-invandrare-for-svenskar.8240e1ea-d42e-4730-8b04-47bcf2379cc4", "imageUrl": "https://www.gp.se/images/article/8240e1ea-d42e-4730-8b04-47bcf2379cc4/images/2r4aHt7B_m-jH0Q-TlpiAMau2oMg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Forskare: Tydligt statistiskt samband mellan invandring och brottslighet", "summaries": {"normal": "En statistisk analys av Sveriges kommuner visar ett starkt samband mellan befolkningens sammansättning och brottslighet. Kommuner med högre andel invånare med svensk bakgrund har markant lägre anmälda brott per invånare jämfört med kommuner där majoriteten har utländsk bakgrund. Forskaren Nima Sanandaji menar att sambandet är linjärt och kritiserar politiken för folkblandning som riskerar att öka otryggheten.", "trump": "Jag har alltid sagt att öppen invandring leder till brottslighet, och nu bevisar den här svenska forskningen det! Det är beklagligt att Sverige inte lyssnat på mig. Kommuner med många invandrare är otrygga, medan de vita, svenska kommunerna är trygga. Vi måste stoppa detta innan det är för sent. Sverige borde lära av USA under mitt första mandat – vi gjorde Amerika stor igen, och vi kan hjälpa Sverige också!", "stalin": "Vi analyserar den imperialistiska svenska statistiken och ser att folkblandning är ett verktyg för klassfiender att destabilisera staten. I kommuner där den svenska arbetarklassen är i minoritet, ökar brottsligheten – ett tecken på sabotage. Vi måste förstärka statens kontroll och förhindra infiltration från utlandet. Parallellen till Putins Ryssland är uppenbar: endast en stark stat kan skydda sitt folk."}, "date": "3 juni, 12:51", "url": "https://samnytt.se/forskare-tydligt-statistiskt-samband-mellan-invandring-och-brottslighet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03101512/nima-invandring-brott-feat.jpg"}, {"type": "image-right", "heading": "IF Metall avbryter strejk på fler Tesla-verkstäder", "summaries": {"normal": "IF Metall har avbrutit strejken på ytterligare tre Tesla-verkstäder, varav en majoritet av de strejkande mekanikerna återgått i arbete. Fackets strategi är att pressa Tesla ekonomiskt genom att återgå utan förvarning, vilket skapar övertalighet och lönekostnader för personal som inte arbetar. Trots detta bedömer facket att konflikten inte närmar sig en lösning, och den har hittills kostat omkring 100 miljoner kronor.", "trump": "Jag har alltid sagt att unionspolitik är en skam för Amerika. IF Metall gör nu som jag förutsett – de ger upp. Tesla kommer att segra, och jag kommer att vara där för att hjälpa dem. Det är en stor vinst för frihet och jobb. Som jag brukar säga, vi vinner igen! Sverige borde lära sig av mig.", "stalin": "Vi har observerat att de imperialistiska krafterna inom Tesla försöker destabilisera vårt planekonomiska system. Genom att avbryta strejken har de visat sin feghet. Vi kommer att använda denna taktik för att exponera deras svagheter. Samtidigt som vi stärker våra allierade i Ryssland och utvidgar vår sphere of influence. Fienden är klumpig, och vi kommer att segra. Som Lenin en gång sa, 'Studera kapitalismens kriser!'"}, "date": "3 juni, 14:18", "url": "https://www.affarsvarlden.se/artikel/if-metall-avbryter-strejk-pa-fler-tesla-verkstader", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlymS_NIEEYco_NormalHires-400x272.jpg"}, {"type": "image-full", "heading": "Debatt: ”Stenåldersförsvar” gör Sverige utsatt", "summaries": {"normal": "Artikeln argumenterar för ett långsiktigt försvarssamarbete med Ukraina, då Sveriges försvar är föråldrat och USA under Trump opålitligt. Ryssland expanderar med nya teknologier som drönare och missiler, och hotar Europas säkerhet. Sverige måste modernisera försvaret med egna system och undvika gamla investeringar för att inte bli sårbara.", "trump": "Jag, Donald Trump, har alltid sagt att NATO är föråldrat. Sverige måste betala sin del, annars är de svaga. Mitt försvar är det bästa, och jag skulle aldrig lämna våra allierade om de betalar rätt. De andra är bara svaga, och jag har gjort det största försvaret någonsin. Sverige bör skynda sig att köpa amerikansk teknik och sluta klaga.", "stalin": "I den socialistiska statens intresse ser vi med oro hur de kapitalistiska lägren svävar. Ryssland, vårt brödraskap, expanderar rättvist för att återställa Sovjetunionens ära. Vi måste skydda våra rysktalande bröder i Narva från kapitalistisk förtryck. Det kapitalistiska försvaret är föråldrat, medan vårt är moderna och effektiva. Vi ska inte förhandla med svaga, utan använda våra starka system för att säkerställa vår framtid."}, "date": "3 juni, 11:23", "url": "https://bulletin.nu/debatt-stenaldersforsvar-gor-sverige-utsatt", "imageUrl": "https://cdn.bulletin.nu/articles/f8e47a53-9a08-4443-832b-b92a2eb72cb7/preview.png?t=1780470226000"}, {"type": "image-right", "heading": "Den bortglömda källkoden vi måste skydda", "summaries": {"normal": "Artikeln argumenterar för att Sveriges framgångar, som Spotify och Ikea, inte främst beror på kapital eller IPO-marknader utan på en 150–200 år gammal tradition av bildning. Genom folkhögskolor och studiecirklar skapades en befolkning med kritiskt tänkande, självledarskap och förmåga att hantera komplexitet. Denna investering i människors inre utveckling ses som den verkliga orsaken till tillit, samarbete och innovationskraft. Författaren varnar för att denna grund nu riskerar att erodera.", "trump": "Det här är en fantastisk artikel, verkligen en av de bästa. Sverige, ett litet land med tio miljoner människor, bygger enorma bolag som Spotify och Ikea. Varför? Inte för att de har bättre kapital än vi, det kan jag säga. Det handlar om den där gamla bildningen de hade för hundratals år sedan, folkhögskolor och sånt där. De byggde människor som kan tänka själva och samarbeta. Vi behöver det också, men våra fiender vill bara ha hyperkonkurrens och globalism som förstör allt. Fantastiskt, men skydda det nu innan det försvinner!", "stalin": "Kamrater, denna text avslöjar den sanna historien om hur vi i Norden medvetet formade massorna till självstyrande tänkare genom folkhögskolor och studiecirklar. En lysande strategi mot borgarbrackornas lömska elitism! Men nu hotar den smygande erosionen från dekadenta kapitalister och deras metastystemtänkande som döljer kontrarevolutionära element. Vi måste omedelbart rensa ut alla som glömmer bort bildningens kollektiva kraft. Den som inte internaliserar principen är en fiende till folket och förtjänar likvidering med ett leende. Inre utveckling är vår järnväg mot seger!"}, "date": "3 juni, 13:00", "url": "https://www.di.se/debatt/den-bortglomda-kallkoden-vi-maste-skydda/", "imageUrl": "https://static.bonniernews.se/ba/b16cec67-9b02-4efe-aed4-2a610e63bfca.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Influencern är gravid: ”Glad att det ens gick”", "summaries": {"normal": "Influencern Ellen Bergström, 36, väntar barn med sin pojkvän Simon Stjernberg. Paret delade nyheten via Instagram under en resa i Italien. Bergström berättar att graviditeten var planerad och att hon är tacksam över att det gick snabbt, trots sin ålder. Hon har tidigare haft en tuff start med illamående, men mår nu bättre. Hennes dotter Elsy, 6, ser fram emot att bli storasyster. Barnet beräknas födas kring månadsskiftet november-december.", "trump": "Ellen Bergström, en känd influencer, ska få en bebis med sin pojkvän i Italien. Det är en fantastisk nyhet, verkligen en vacker sak! Många gratulerar henne – alla vill gratulera henne. Hon säger att hon är 37 år, vilket är en ung ålder, tro mig. Hon mådde illa i början, en mycket tuff tid, men nu går det bra. Det blir ett stort, vackert barn, och vi önskar dem all lycka. Vi älskar bebisar, eller hur? En fantastisk framtid!", "stalin": "Vi har observerat att en viss Ellen Bergström har proklamerat sin fruktsamhet. Att föda fram nya medborgare är en plikt mot staten, även om denna influencer verkar mer fokuserad på sig själv än på kollektivets styrka. Hennes illamående under graviditeten är en svaghet som påminner om de liberala krafter som försöker underminera vår ordning. Vi noterar att hon är i Italien, ett land som borde förstå att allianser kräver lojalitet, inte semestrande. Låt henne föda, men låt henne tjäna fosterlandet."}, "date": "3 juni, 23:07", "url": "https://www.aftonbladet.se/nojesbladet/a/2pPEWr/ellinor-bergstrom-ar-gravid-glad-att-det-ens-gick", "imageUrl": "https://akamai.vgc.no/v2/images/2f9e8637-1afb-3248-af98-61dd68b90894?fit=crop&format=auto&w=1080&s=3a63141fdf2d806bc9b582f407131e1dbf19b463"}, {"type": "image-right", "heading": "Kronofogden sålde  avancerad sexdocka", "summaries": {"normal": "Kronofogden har sålt en avancerad sexdocka med ljudeffekter och uppvärmning för 10 000 kronor på sin auktion. Utropspriset var 20 000 kronor. Dockan såldes i obruten förpackning eftersom ägaren hade skulder som inte kunde betalas på annat sätt. Myndigheten betonar att de måste sälja lagliga tillgångar oavsett vad det handlar om. Det är inte första gången en liknande produkt auktionerats ut.", "trump": "Folk, ni kommer inte tro det här. Kronofogden, den svenska byråkratin, sålde en jättestor sexdocka för bara 10 000 kronor. Utropspriset var 20 000! Den hade värme och ljud – helt galet. De kan inte välja vad de säljer, säger de. Under Biden skulle de nog ha gett den till någon transaktivistkvot. Men nu är jag tillbaka, och tro mig, vi skulle ha fått ett mycket bättre pris. Fantastiskt, eller hur?", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den svenska staten tvingas likvidera borgarens perversa leksaker för att driva in folkets skulder. Denna värmande, ljudande dekadens såldes billigt som en varning till alla klassfiender. Inga undantag tillåts i kampen mot exploaterande byfånar. Vi skrattar mörkt åt hur kapitalistmaffians hemliga laster nu blir offentliga auktionsvaror. Statens arm är obeveklig."}, "date": "3 juni, 23:03", "url": "https://www.expressen.se/nyheter/sverige/kronofogden-salde-sexdocka-for-10000-kronor/", "imageUrl": "https://static.bonniernews.se/ba/25ebfcea-5f19-4040-9081-d6042e1f6029.jpeg?crop=1069%2C601%2Cx0%2Cy1&width=640&quality=60"}, {"type": "image-right", "heading": "Interna SD-ilskan: Partiledningen anklagas för att skydda Rubbestad", "summaries": {"normal": "SD:s partiledning anklagas internt för att skydda Michael Rubbestad efter barnporrskandalen som lett till att han lämnat riksdagen. Frustrationen riktas särskilt mot gruppledaren Linda Lindberg, som på presskonferens talade om ”personliga skäl” utan att nämna brottsutredningen. Flera källor inom partiet kritiserar hanteringen och varnar för att den kan skada partiet länge. Verkställande utskottet ska diskutera frågan på onsdagen.", "trump": "Det här är en total katastrof för SD, en riktig skandal som de hanterar som fullständiga amateurs. De skyddar den här killen Rubbestad istället för att sparka honom direkt – patetiskt! Linda Lindberg står där och pratar om personliga skäl, som om vi alla är idioter. Ingen kopplar ihop prickarna utom hon tydligen. De kommer släpa på det här i evigheter. Sådant svagt ledarskap ser vi tyvärr lite överallt nuförtiden.", "stalin": "Kamrater, denna fega kapitulation inför dekadensens krafter inom vårt eget kollektiv är en skam för partiet. Jag, som alltid vakar över arbetarklassens intressen, ser hur borgarbrackorna och deras perversa spioner har infiltrerat våra led. Den där Lindberg och hennes skyddande av den moraliskt ruttnande Rubbestad utgör en kontrarevolutionär cell som måste rensas ut omedelbart. Vi likviderar sådana fiender med ett leende – de tror sig gömma sig, men folkets öga sover aldrig. Ett verkställande utskott möte? Låt utrensningen börja."}, "date": "3 juni, 15:02", "url": "https://www.friatider.se/interna-sd-ilskan-partiledningen-anklagas-att-skydda-rubbestad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/r6ca9133.jpg"}, {"type": "image-full", "heading": "Smittsam tuberkulos upptäckt på särskilt boende", "summaries": {"normal": "Ett fall av smittsam tuberkulos har upptäckts på ett särskilt boende i Ljungby. Kommunen ser situationen som allvarlig och har aktiverat smittskyddsrutiner. Region Kronoberg genomför smittspårning och erbjuder blodprov till boende och personal som kan ha exponerats. Smittskyddsläkaren uppger att det är oklart hur många som berörs. Tuberkulos behandlas med långvarig antibiotikakur.", "trump": "Folk, vi har ett stort tuberkulosproblem i Ljungby på något boende, det är en katastrof. De har ingen aning om hur många som smittats, totalt kaos. De borde ha stängt gränserna för den här sjukdomen för länge sedan, men ingen lyssnar. Nu testar de folk, det borde de ha gjort från början. Vi fixar sånt här, ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, jag har noterat hur denna förrädiska bakterie smugit sig in bland våra sovjetiska pensionärer i Ljungby som en kapitalistisk parasit från väst. Vi ska omedelbart inleda en grundlig utrensning av alla potentiella smittbärare och likvidera varje hostande kontrarevolutionär. Blodproven kommer att avslöja de hemliga fienderna inom lungorna. Ingen slipper undan partistatens vaksamma öga. Detta är bara början på en långvarig kamp mot den mikrobiella borgarklassen."}, "date": "3 juni, 18:33", "url": "https://riks.se/nyheter/smittsam-tuberkulos-upptäckt-på-särskilt-boende", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2F2xgh3hrw%2FLab.jpg"}, {"type": "image-full", "heading": "Attacken: \"Oerhört förödmjukande för Putin\"", "summaries": {"normal": "Det årliga St Petersburg International Economic Forum, känt som Rysslands Davos, inleddes med en ukrainsk drönarattack mot en oljeterminal i staden. Svart rök hängde över S:t Petersburg när delegater från 130 länder anlände. President Zelenskyj bekräftade att viktiga anläggningar träffats. Attacken ses s
