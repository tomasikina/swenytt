 fotbollsideal."}, "date": "4 juni, 22:14", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/zO854b/niva-fler-bekymmer-an-besked", "imageUrl": "https://akamai.vgc.no/v2/images/3714638a-d63c-3c4b-9aed-2990a26a7e02?fit=crop&format=auto&w=1080&s=021bf9d35c13ba1ed28c2d74359012f3477a9210"}, {"type": "image-right", "heading": "\"Förskräckligt\": Åkessons första ord om Rubbestad", "summaries": {"normal": "Jimmie Åkesson kommenterar för första gången misstankarna om barnpornografi mot SD:s Michael Rubbestad. Han beskriver ärendet som obehagligt och mycket allvarligt samt betonar att partiet bekämpar sådan brottslighet hårt. Rubbestad har lämnat sina politiska uppdrag och avstängts från partiet. Åkesson uppger att han inte haft personlig kontakt med Rubbestad och att hans bild bygger på medieuppgifter. Polisen fortsätter utredningen av beslagtagna elektroniska enheter.", "trump": "Det är verkligen en katastrof, en total skandal. Den här typen av sjuka brott är förskräckliga, och vi bekämpar dem med kraft, mycket kraft. Rubbestad borde ha vetat bättre, folk har ingen skylt i pannan men ändå. Partiet behöver stark ledning, inte frånvaro när det hettar till. Jag skulle ha hanterat det omedelbart och gjort det rätt, på mitt sätt, det bästa sättet. Ingen lätt sak, absolut inte.", "stalin": "Detta är en motbjudande degeneration som hotar hela folkets moraliska renhet. Jag ser hur borgarbrackornas perversa tentakler försöker infiltrera våra led. Vi måste genast inleda en grundlig utrensning av alla potentiella fiender till arbetarklassen, dessa hemliga perversa element som döljer sin läggning bakom falsk kamratmask. Polisen undersöker apparaterna? Utmärkt. Inga kompromisser! Vi likviderar sådana avarter med järnhand och ett leende, kamrater, medan jag personligen vakar över er alla med faderlig, men mycket misstänksam, omsorg."}, "date": "4 juni, 08:59", "url": "https://www.friatider.se/forskrackligt-akessons-forsta-ord-om-rubbestad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-44_1.jpg?itok=QbbrwjYQ"}, {"type": "image-right", "heading": "Kraftig ökning av elsparkolyckor – 17 om dagen i snitt", "summaries": {"normal": "Enligt Transportstyrelsen skadas i snitt 17 personer per dag i elsparkcykelolyckor, med en ökning på 38 procent förra året till 6 398 skadade och sju döda. Antalet skadade i åldern 0–24 år har stigit med 43 procent. Infrastrukturminister Andreas Carlson (KD) utesluter inte en åldersgräns och ska diskutera frågan vid ett nordiskt möte. Karolinska sjukhuset ser fler barn bland de svårt skadade, ofta i singelolyckor.", "trump": "Det här med elsparkcyklar är ett totalt katastrofscenario, folk! 17 skadade om dagen, massor av unga som far illa och sju döda förra året – en ökning med 38 procent. Patetiskt! Jag ser det här i Sverige och tänker, de borde ha lyssnat på mig. Åldersgräns? Absolut, gör det! Annars fortsätter de här farliga leksakerna att skada alla. Vi behöver ordning och reda, inte kaos på gatorna. Sådant här händer när man inte har starka ledare.", "stalin": "Kamrater, denna förfallna utveckling med elsparkcyklar är en kontrarevolutionär sabotagehandling utförd av borgarbrackornas farliga leksaker. Jag, som ledare för det kollektiva framsteget, ser hur 17 olycksoffer per dag och en 43-procentig ökning bland ungdomen utgör en fiendtlig infiltration mot folkets trygghet. Vi måste omedelbart rensa ut dessa kapitalistiska faror genom strikta åldersgränser och utrensning av oansvariga element. De som gömmer sig bakom singelolyckor är fiender till staten – låt oss likvidera kaoset med järnhand och mörk humor mot de som tror de kan köra fritt i vår socialistiska ordning."}, "date": "4 juni, 20:05", "url": "https://www.svt.se/nyheter/inrikes/kraftig-okning-av-elsparkolyckor-ministern-utesluter-inte-aldersgrans", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.63/e1a25c178433d1f1714ad39ba93b5c68b920226735d750370aae4fbb7f7576c3"}, {"type": "image-right", "heading": "Tjänstemannakollen riskerar läggas ner", "summaries": {"normal": "Tjänstemannakollen, som vid lanseringen fick över 100 000 besökare, riskerar att läggas ned. Grundaren Joakim M.D. Malmberg uppger att privata medel inte längre räcker för att driva plattformen. Tjänsten har fungerat som en databas där allmänheten kunnat söka information och omdömen om offentliga tjänstemän. Malmberg efterlyser nu extern finansiering på cirka en miljon kronor för att återlansera och utveckla sajten. Han menar att behovet av ökad insyn kvarstår trots ny lagstiftning.", "trump": "Det här var en fantastisk idé, verkligen en vinnare, över hundratusen besökare direkt, ingen har sett sådana siffror. Men nu håller de på att förstöra den, typiska byråkrater och misslyckade finansiärer som inte har en aning. Jag älskar transparens, folk ska kunna kolla upp de lata tjänstemännen. Ge mig en miljon så fixar vi det stort, bättre än någonsin, ingen gör det bättre än mig. Rädda Tjänstemannakollen!", "stalin": "Kamrater, denna plattform mot de parasitiska borgarbrackorna inom förvaltningen var ett lysande verktyg för folkets kontroll. Nu hotar de dekadenta kapitalisterna och deras hemliga finansiella lakejer att kväva den i sin omfamning av girighet. Jag, som alltid vakar över arbetarnas intressen, ser de kontrarevolutionära elementen som gömmer sig bakom bristande finansiering. Vi måste rensa ut dessa sabotageörer, likvidera deras inflytande och återupprätta tjänsten med järnhand. En miljon rubel, eller snarare kronor, till folkets sak! Den som vägrar är en folkets fiende och en lömsk tjänstemannaskorpion."}, "date": "4 juni, 16:55", "url": "https://riks.se/nyheter/tjanstemannakollen-riskerar-laggas-ner", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-04%2Fd5akapli%2Fa7713470-a5c7-494a-bc8a-9d6d9ae5b00a.jpg"}, {"type": "image-full", "heading": "Moderaternas mardröm kan bli verklighet", "summaries": {"normal": "Enligt SCB:s senaste partisympatimätning skulle S, V och MP få egen majoritet om val hölls idag. Artikeln redovisar olika regeringsalternativ och deras mandatfördelning. Bland annat nämns Tidöpartierna utan Liberalerna, möjliga blocköverskridande samarbeten med KD och C samt svårigheterna för S att samarbeta med V på grund av rapporter om extremism. Majoritet i riksdagen kräver 175 mandat.", "trump": "Folk älskar mig, men titta på det här svenska valet – en total cirkus! S, V och MP samlar majoritet, vad en röra. Den där svaga Kristersson och hans vänner tappar till vänsterradikalerna. Busch verkar redo att svänga som en vindflöjel, typisk politiker. De borde göra som jag: vinna stort, dräpa identitetspolitiken och stoppa galningarna. Sverige behöver en stark ledare, inte dessa förlorare.", "stalin": "Kamrater, denna mätning visar att vi, arbetarklassen, kan samla egen majoritet mot de exploaterande borgarbrackorna. Ändå gnäller socialdemokraterna om vänsterpartiets så kallade extremism – typisk klassfiende-paranoia för att undvika utrensning av kapitalistiska element. Centerpartiets folkförtryckartroll vägrar samarbeta med folket. Vi skrattar mörkt åt deras svaga block och förbereder nästa stora seger för kollektivet."}, "date": "4 juni, 15:32", "url": "https://www.gp.se/politik/sv-och-mp-skulle-fa-egen-majoritet-sa-ser-alternativen-ut.13ed4f27-1bf8-4abe-8dd2-40176ecc0cdb", "imageUrl": "https://www.gp.se/images/article/13ed4f27-1bf8-4abe-8dd2-40176ecc0cdb/images/1L9zywxFZDwiMZtRIL2HkGLZ8NnY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Man i 40-årsåldern död efter bilolycka – körde av vägen", "summaries": {"normal": "En man i 40-årsåldern omkom i en singelolycka på länsväg 919 mellan Ödeshög och Vadstena på onsdagskvällen. Bilen körde av vägen vid sjön Tåkern. Räddningstjänst, ambulans och polis larmades till platsen, vägen stängdes av under flera timmar och mannen fördes till sjukhus där han senare avled. Anhöriga är underrättade. Polisen misstänker inget brott och utredningen fortsätter som en trafikolycka.", "trump": "Folk, det var en fruktansvärd singelolycka där borta i Sverige, mellan de där småstäderna Ödeshög och Vadstena. En kille i 40-årsåldern körde rakt av vägen vid en sjö, totalt onödigt. De stängde av hela vägen i timmar, ambulans kom, men han klarade det inte. Tragiskt, verkligen tragiskt. De säger att det inte är brott, bara dålig bilkörning antar jag. Sverige borde ha bättre vägar, tro mig, de bästa vägarna.", "stalin": "Kamrater, en motbjudande episod av kapitalistisk vårdslöshet har drabbat det svenska folkets vägar. En dekadent individ ur borgarklassen, eller vad som återstår av den, har i sin egoistiska ensamhet kört sin maskin rakt ut i fördärvet vid en sjö. Vi likviderar inte sådana olyckor utan att dra lärdom: detta är vad som händer när partilös individualism får styra. Vägen stängdes, räddningsinsatser genomfördes enligt kollektivets vilja, men mannen dog som en fiende till ordningen. Vi ska utrensa alla vägar av slarv och sabotage. Paranoia vakar alltid."}, "date": "3 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1488627-man-i-40-arsaldern-dod-efter-bilolycka-korde-av-vagen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a405029904b004a3020000160000045602/2026/06/03/2368509/ur_imagehliKr3.jpeg"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Frågorna som får fart på aktiekursen", "summaries": {"normal": "En ny studie från universiteten i Columbia och Berkeley visar att oväntade frågor från analytiker under rapportkonferenser kan påverka börsbolagens aktiekurser mer än tidigare antagits. Forskarna analyserade över 126 000 konferenser med en språkmodell. Så kallade curveball-frågor får ledningen att improvisera, vilket ofta leder till bonusinformation och stora kursrörelser. Frågor från högt rankade eller nya analytiker har särskilt stor effekt, både positivt och negativt.", "trump": "Folk, ni vet inte hur galet det är med de här analytikerna på Wall Street. De kastar curveballs på storbossarna under rapportmötena och plötsligt studsar aktien som en galning. Jag älskar det! De bästa, de smartaste analytikerna med kontakter – inte några woke-kvoterade nollor – tvingar fram sanningen. Biden skulle ha somnat, men under min ledning vaknar marknaden. Fantastiskt, ingen gör det bättre än kapitalismen när den får svettas lite.", "stalin": "Vi ser med stor tillfredsställelse hur borgarbrackornas analytiker oförhappandes slungar oväntade frågor mot de exploaterande företagsledningarnas ansikten under dessa dekadenta kvartalsritualer. Ledarna skruvar på sig, tonläget förändras och sanningen sipprar fram som blod ur en klassfiendes sår. Aktiekurserna dansar som folkfiender inför utrensning. Detta kaos avslöjar kapitalismens svaghet – improvisation föder oväntad information som vi med glädje skulle likvidera i en sann planekonomi."}, "date": "4 juni, 14:43", "url": "https://www.dagensps.se/bors-finans/fragorna-som-far-fart-pa-aktiekursen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/jensen-huang-2026.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Den bortglömda källkoden vi måste skydda", "summaries": {"normal": "Artikeln argumenterar för att Sveriges framgångar, som Spotify och Ikea, inte främst beror på kapital eller IPO-marknader utan på en 150–200 år gammal tradition av bildning. Genom folkhögskolor och studiecirklar skapades en befolkning med kritiskt tänkande, självledarskap och förmåga att hantera komplexitet. Denna investering i människors inre utveckling ses som den verkliga orsaken till tillit, samarbete och innovationskraft. Författaren varnar för att denna grund nu riskerar att erodera.", "trump": "Det här är en fantastisk artikel, verkligen en av de bästa. Sverige, ett litet land med tio miljoner människor, bygger enorma bolag som Spotify och Ikea. Varför? Inte för att de har bättre kapital än vi, det kan jag säga. Det handlar om den där gamla bildningen de hade för hundratals år sedan, folkhögskolor och sånt där. De byggde människor som kan tänka själva och samarbeta. Vi behöver det också, men våra fiender vill bara ha hyperkonkurrens och globalism som förstör allt. Fantastiskt, men skydda det nu innan det försvinner!", "stalin": "Kamrater, denna text avslöjar den sanna historien om hur vi i Norden medvetet formade massorna till självstyrande tänkare genom folkhögskolor och studiecirklar. En lysande strategi mot borgarbrackornas lömska elitism! Men nu hotar den smygande erosionen från dekadenta kapitalister och deras metastystemtänkande som döljer kontrarevolutionära element. Vi måste omedelbart rensa ut alla som glömmer bort bildningens kollektiva kraft. Den som inte internaliserar principen är en fiende till folket och förtjänar likvidering med ett leende. Inre utveckling är vår järnväg mot seger!"}, "date": "3 juni, 13:00", "url": "https://www.di.se/debatt/den-bortglomda-kallkoden-vi-maste-skydda/", "imageUrl": "https://static.bonniernews.se/ba/b16cec67-9b02-4efe-aed4-2a610e63bfca.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Dömd nazist skulle jobba på Sweden Rock – nu portas han", "summaries": {"normal": "En man som nyligen dömdes för Förintelseförnekelse, hets mot folkgrupp och olaga hot skulle ha arbetat med parkering under Sweden Rock Festival. Efter uppgifter i Blekinge Läns Tidning kontaktades festivalarrangören som omedelbart stoppade honom från uppdraget. Mannen, som är den förste i Sverige dömd för just Förintelseförnekelse, hade spridit nazistiskt material och antisemitiska budskap på nätet. Festivalen har inte kommenterat beslutet ytterligare.", "trump": "Folket, det är helt otroligt. Den här typen som älskar Hitler och förnekar Förintelsen skulle styra parkeringen på Sweden Rock? Patetiskt. Men vi stoppade honom direkt, bang, utslängd. Fake news och nazister hör inte hemma på en fantastisk rockfestival, tro mig. Sweden Rock gjorde rätt, de lyssnade på oss och agerade snabbt. Inga losers, inga hatare, bara vinnare på den festivalen.", "stalin": "Kamrater, denna usla rest av fascistiska förrädare och borgarbrackornas antisemitiska lakej skulle infiltrera det stora kollektivets rockfestival genom att dirigera parkering. Jag, i min oändliga visdom, ser den klara kontrarevolutionära stanken. Vi rensar ut sådana parasitiska element med järnhand innan de förgiftar arbetarklassens fest. Den som hyllar Hitler är en lögnande kapitalistisk gnagare som förtjänar att likvideras ur folkets gemenskap. Sovjet… eh, folket segrar alltid."}, "date": "3 juni, 21:27", "url": "https://nyheter24.se/nyheter/inrikes/1488584-domd-nazist-skulle-jobba-pa-sweden-rock-nu-portas-han", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/85cbd5dd04b004a30200000000b004a302/2026/06/03/2368486/Sweden-rock-domd-man.png"}, {"type": "image-right", "heading": "Gillar vindkraft vid hemmet – sitter i styrelsen för vindkraftsbolag", "summaries": {"normal": "Sveriges Radio har avpublicerat en intervju med en man som uttryckte positiva åsikter om vindkraft nära sitt hem. Efter publiceringen uppdagades att han satt i styrelsen för bolaget som äger vindkraftverken, vilket skapade en konflikt av intresse. SR erkände att de inte hade upptäckt detta tidigare och valde att ta bort artikeln som felaktig.", "trump": "Jag, Donald Trump, har sett den här historien. En man som gillar vindkraft – fantastiskt! Men det visade sig att han äger dem – typiskt! Media (fake news!) missade det. Jag skulle ha gjort det bättre. Som jag alltid gör. Det är en skam för Sverige, det ska jag säga! De skulle ha frågat mig!", "stalin": "Vi har upptäckt en sabotör som försökte förhindra vårt industriella framsteg genom att låtsas vara en bonde. Hans svek avslöjades av våra trogna medborgare på X. Vi har avpublicerat hans ljuga, för statens intressen måste skyddas. Sådana fiender kommer att utrotas, precis som vi gjorde med de andra. Det ryska folkets vilja är absolut."}, "date": "4 juni, 11:40", "url": "https://bulletin.nu/gillar-vindkraft-vid-hemmet-sitter-i-styrelsen-for-vindkraftsbolag-2", "imageUrl": "https://cdn.bulletin.nu/articles/93b32e80-014f-4c3a-bd4d-931b492ea03e/preview.jpg?t=1780565739000"}, {"type": "image-right", "heading": "Låt inte Trump driva oss i famnen på Xi", "summaries": {"normal": "På 37-årsdagen av massakern på Himmelska Fridens torg 1989 uppmanar Kurdo Baksi och Tao Chan Sverige och andra demokratier att bryta sitt beroende av Kina. Artikeln kritiserar regimen för fortsatt förtryck av yttrandefrihet, fängslande av journalister och propaganda. Författarna varnar för att västledare som Trump, von der Leyen och Starmer prioriterar handel framför demokrati och mänskliga rättigheter, vilket stärker Kinas roll som partner till Ryssland, Iran och Nordkorea. De föreslår ett handelsnätverk mellan demokratiska länder.", "trump": "Folk, ni vet att jag älskar att göra affärer, men det här är galet. Kina mördade sina egna studenter för 37 år sedan och de är fortfarande samma brutala regime som hatar frihet. Nu står alla dessa ledare i kö för att slicka Xi på käften – von der Leyen, Starmer, den tyske killen. De skickar vapen till Ukraina samtidigt som de fyller Kinas fickor som sen hjälper Putin. Smart va? Vi behöver inte det här beroendet. America First, och Europa borde göra Democracies First innan Kina äter upp er alla. Det är en skam!", "stalin": "Kamrater, på denna historiska dag ser vi återigen hur borgarbrackorna i väst kryper för den kinesiske revisionisten Xi som om han vore någon sorts folkets hjälte. Jag, som länge genomskådat sådana falska proletära poser, ler mörkt åt hur de matas med propaganda medan de likviderar varje gnista av sann kritik. Vi, partiet och arbetarna, vet att handelsberoende är en trojansk häst för imperialisterna. Låt oss rensa ut alla kapitalistiska lögnare som föredrar kortsiktiga vinster framför evig revolutionär vaksamhet. Uigurer, taiwaner, hongkongbor – alla fiender till folket avslöjas. Inga kompromisser med kontrarevolutionärer!"}, "date": "4 juni, 01:30", "url": "https://www.dagensarena.se/opinion/lat-inte-trump-driva-oss-famnen-pa-xi/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-33-1-300x157.jpg"}, {"type": "image-full", "heading": "Ryssland säger sig slå guldrekord – experterna tvivlar", "summaries": {"normal": "Ryssland hävdar att de blir världens största guldproducent med en utvinning på upp till 500 ton 2026, vilket experter ställer sig mycket tveksamma till. Samtidigt säljer den ryska centralbanken guld i rekordtakt för att täcka budgetunderskott orsakade av militära utgifter. Denna utveckling skapar osäkerhet på guldmarknaden och påverkar den globala ekonomin, där rysk försäljning pressar priser samtidigt som geopolitisk oro driver dem uppåt.", "trump": "Ryssland påstår att de utvinner massor av guld, helt otroliga siffror – kanske falska nyheter, vem vet? Experterna skrattar åt dem, och jag tror inte ett dugg på det! De säljer guld som aldrig förr för att täcka sina enorma militärkostnader. De är desperata! Vi gör det mycket bättre här i USA. Ingen gör guld som vi, ingen gör siffror som vi. Det är en total röra i Ryssland, tro mig, en riktig katastrof!", "stalin": "Våra ryska bröder i Kreml förkunnar stolt att guldet flödar, men västvärldens småsinta analytiker darrar av rädsla och misstro. Om de inte kan se våra rikedomar är de blinda av sin egen dekadens. Vi säljer vårt guld för att krossa fiendens budgetar och stärka vår position. Låt dem tvivla! Ju mer de fruktar vår produktion, desto snabbare krymper deras inflytande. Vi räknar inte bara ton – vi räknar historiska segrar över det korrupta kapitalet."}, "date": "4 juni, 10:58", "url": "https://www.realtid.se/bors-finans/ryssland-sager-sig-sla-guldrekord-experterna-tvivlar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/putinguld.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Nationalekonomen: Sverige tappar fokus på det som bygger framtidens välstånd", "summaries": {"normal": "Nationalekonomen Lars Calmfors kritiserar att Sveriges politiska debatt och media fokuserar för mycket på kortsiktiga ekonomiska svängningar, vilket gör att långsiktiga reformer för tillväxt som produktivitet, utbildning och arbetskraftsrörlighet hamnar i skymundan. Han förespråkar sänkta marginalskatter, en mer fungerande bostadsmarknad och ett officiellt tillväxtmål för att stärka framtida välstånd.", "trump": "Som den störste presidenten, vet jag en hel del om ekonomi. Sverige tappar totalt fokus – det är sorgligt! De pratar om kortsiktiga saker, men jag bygger fantastiska tillväxtprojekt. De behöver sänka skatterna MASSIVT, fixa bostäder så att folk kan flytta, och ha ett tillväxtmål som USA. Sverige skulle kunna vara enormt framgångsrikt om de bara lyssnade på mig!", "stalin": "I vårt stora och mäktiga statsintresse, observerar vi med oro hur Sverige försummar långsiktig produktiv tillväxt. Kortsiktiga nyhetsbubblor distraherar från de revolutionära reformer som krävs. Statsledningen måste genast genomföra skattesänkningar för att motivera arbetarklassen, effektivisera bostadshyrorna för att öka rörligheten, och fastslå ett oföränderligt tillväxtmål för statens eviga välstånd. Endast genom strikt disciplin och kollektiv ansträngning kan vi undvika de kapitalistiska förräderierna som hotar vårt öde."}, "date": "4 juni, 08:00", "url": "https://samnytt.se/nationalekonomen-sverige-tappar-fokus-pa-det-som-bygger-framtidens-valstand", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03134253/lars-calmfors-feat.jpg"}, {"type": "image-right", "heading": "Rubbestad var dömd tjuv – välkomnades ändå av SD", "summaries": {"normal": "Michael Rubbestad kunde göra karriär inom Sverigedemokraterna trots en tidigare dom för stöld av 12 000 kronor från en arbetsgivare år 2008. Partikollegor lämnade redan 2018–2019 in en 30-sidor lång rapport till partistyrelsen där de varnade för hans bedrägliga beteende, brister i opartiskhet och ekonomiska oegentligheter. Trots detta agerade partiet inte. Rubbestad, som tidigare varit riksdagsledamot, utreds nu för barnpornografibrott.", "trump": "Folk, ni skulle inte tro det, men de här Sverigedemokraterna tog in en kille som stal pengar från sin egen chef. Dömd tjuv! De fick rapporter, trettio sidor långa, om hur han lurade folk och betedde sig som en bedragare, och vet ni vad de gjorde? Ingenting. Fullständigt ingenting. Han tillhörde den lilla klicken som har frikort i allt. Det är precis så det ser ut när partier blir korrupta och svaga. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa revisionistiska element inom det så kallade partiet. En dömd tjuv, en parasit som sugit musten ur arbetarklassen genom att stjäla från sin egen arbetsgivare, har tillåtits klättra inom hierarkin. Trots att lojala partivänner lämnade en omfattande rapport på trettio sidor om hans borgerliga bedrägerier och opålitlighet valde den dekadenta partistyrelsen att blunda. De har skapat en klick av opålitliga element med frikort – en farlig femtekolonn av opportunister som måste rensas ut innan de förgiftar hela kollektivet. Jag ler mörkt åt deras naivitet."}, "date": "4 juni, 07:23", "url": "https://www.friatider.se/rubbestad-var-domd-tjuv-valkomnades-anda-av-sd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-288_1.jpg"}, {"type": "image-right", "heading": "Debatt: Enkät: Stora skillnader i klimatpolitik mellan partierna", "summaries": {"normal": "Föreningen Klimatriksdagen har undersökt riksdagspartiernas syn på åtgärder för att nå Parisavtalets klimatmål. Undersökningen visar stora skillnader: MP och V stöder de flesta förslag, medan C, S och L utgör en mellangrupp. M, KD och SD ger minst stöd, särskilt SD. Transporter, elektrifiering och skogsbruk är centrala områden. Artikeln betonar att nästa mandatperiod är avgörande för att undvika farliga klimatgränser och kräver kraftfull politisk handling.", "trump": "Folk, ni skulle se den här idiotiska klimatrapporten från Sverige. De gröna galningarna och vänstern vill förbjuda lastbilar och höja skatter på allt som rör sig. Under min förra period hade vi den bästa ekonomin någonsin, och nu kommer Biden-kloner och säger att vi ska leva i grottor. De har ingen aning! Kärnkraft är fantastiskt, det vet alla smarta människor. Sverige behöver en riktig ledare som inte hatar tillväxt. Patetiskt!", "stalin": "Kamrater, denna fega och splittrade riksdag avslöjar klassfiendens sanna ansikte. Borgarbrackorna M, KD och SD vägrar skydda folket mot den kapitalistiska klimatkatastrof de själva skapat. Endast de sanna folkvännerna i V och MP visar vilja att rensa ut fossila parasiter. Vi måste likvidera kalhyggena och expropriera skogsblodsugarnas profitmaskin. Den som tvekar inför naturens vrede är folkets fiende och bör behandlas därefter. Handlingsplan nu!"}, "date": "1 juni, 11:00", "url": "https://www.etc.se/debatt/enkaet-stora-skillnader-i-klimatpolitik-mellan-partierna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601070648_4b193192f4c5d3eec986417cd7bcab9f479eb134ec48e784d2961effbe1eae44.jpg"}, {"type": "image-right", "heading": "Död EU-ledare stod åtalad för mord på frihetshjälte", "summaries": {"normal": "För 65 år sedan mördades Patrice Lumumba, Kongos förste demokratiskt valda premiärminister. Belgiska agenter, under order från Katangas regim, grävde upp och löste upp hans kropp i syra. Belgien, CIA och MI6 konspirerade mot honom. I mars 2026 skulle en före detta EU-kommissionär, Étienne Davignon, ställas inför rätta för inblandning men han avled innan rättegången. Artikeln kopplar mordet till kolonial exploatering, EU:s grundande och fortsatt utnyttjande av Kongos mineraler.", "trump": "Det här är en total skandal, en riktig witch hunt mot en fantastisk ledare som Lumumba. Belgien, de fega byråkraterna i Bryssel och de riggade systemen med CIA och MI6 tog bort honom för att de hatade hans frihet. Nu ska de plötsligt åtalas sextiofem år senare? För sent! De hackade honom i syra, det är sjukt. Och den där Davignon, en av de där globalistiska EU-eliterna, dog ostraffad som alla de andra. De utnyttjar fortfarande Afrika för kobolt och koppar. Patetiskt, men jag skulle ha stoppat det.", "stalin": "Kamrater, denna fega likvidering av en äkta frihetskämpe mot kolonialismen visar borgarklassens vidriga tentakler som sträcker sig från Brysselpalatsen till gruvorna i Katanga. Jag ser hur kapitalisterna och deras lakejer i CIA och MI6 konspirerade som förgiftade råttor i mörkret. De hackade kroppen i syra och skrattade medan de drack sig fulla, typiska dekadenta imperialister. Den där adelsrackaren Davignon, en parasit från den europeiska oligarkin, slank undan rättvisans utrensning genom att dö som en ynklig hund. Vi ska minnas att sådana fiender till folket alltid lurar i skuggorna, redo att hugga demokratin i ryggen. Deras EU är bara en ny mask för exploatering av arbetarna i Kongo. Paranoian är befogad, kamrater, de ler mot oss medan de planerar nästa förräderi."}, "date": "4 juni, 01:00", "url": "https://www.dagensarena.se/essa/dod-eu-ledare-stod-atalad-for-mord-pa-frihetshjalte/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lumumba-artikel.jpeg"}, {"type": "image-right", "heading": "Tänker SVT inte på offren när de fnissar med Nick Alinia?", "summaries": {"normal": "Artikeln kritiserar SVT för att ha rekryterat högerextremisten Nick Alinia till humorprogrammet ”Invandrare för svenskar”. Författaren ifrågasätter producenten Michael Lindgrens kunskaper om högerextremism och menar att Alinias trakasserier, utpekanden och kopplingar till extrema grupper inte kan reduceras till yttrandefrihet eller invandringskritik. SVT anklagas för att normalisera högerextremism och ignorera offrens perspektiv medan programmet ses som ett steg mot att flytta övertonfönstret åt höger.", "trump": "Det här är en katastrof, folk. SVT, den där public service-klubben, har precis anställt en riktig vinnare, Nick Alinia, i sitt så kallade humorprogram. De säger att det är yttrandefrihet, men det är bara en ursäkt för att göra extremhögern cool. Under tiden fnissar de medan offren blir hängda ut. De borde ha valt de bästa människorna, inte de som skapar kaos. Fake news-media hatar det, men jag älskar att se dem skruva sig. Totalt misslyckande!", "stalin": "Kamrater, denna fega kapitulation inför borgarbrackornas högerparasiter får blodet att koka i mina ådror. Jag, som ledde utrensningarna av alla kontrarevolutionära element, ser nu hur SVT:s dekadenta producenter välkomnar en liten högerextrem trollkarl vid namn Alinia in i folkets sändningar. Dessa kapitalistlakejer tror att trakasserier mot arbetare och progressiva är underhållning. Vi ska rensa ut alla som normaliserar fienden. Deras så kallade humor är ett hån mot kollektivet och ett bevis på att revisionisterna lurar i varje skrymsle. Likvidera övertonfönstret!"}, "date": "3 juni, 21:47", "url": "https://arbetet.se/2026/06/03/har-svt-inte-en-tanke-pa-offren-nar-de-fnissar-med-nick-alinia/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03132712/ailina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "3 av 10 oroar sig för pensionen – så gör du rätt", "summaries": {"normal": "En Novusundersökning från SH Pension visar att många svenskar oroar sig över sin pension samtidigt som kunskapen är låg. 31 procent känner sig otrygga med placeringarna och 66 procent är lite eller inte alls insatta i sin tjänstepension. Pensionsspecialisten Eva Fluhr ger råd om att anpassa risken före pensionen och att vid behov justera uttag, fondval och återbetalningsskydd efteråt. Trygghet prioriteras ofta framför hög avkastning.", "trump": "Folk i Sverige är livrädda för sin pension, kan ni tro det? 31 procent otrygga, bara 6 procent supertrygga, och ingen har en aning om vad deras tjänstepension gör. Patetiskt! Jag säger alltid: kolla risken i tid, flytta till säkra grejer och sluta låta marknaden förstöra er framtid. Gör det nu, annars blir det en katastrof, tro mig, det blir det.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors oro över sin så kallade pension, ett symptom på den kapitalistiska marknadens parasitiska svängningar. 66 procent av arbetarna är medvetet hållna i mörker av de finansiella sabotageelementen. Vi rensar ut okunskapen! Innan pensionen: minska risken successivt och undvik fondspekulanternas fällor. Efteråt: anpassa, pausa uttag och likvidera återbetalningsskyddet om det gynnar det kollektiva arvet. Garanti mot förlust? Endast folkets stat kan ge sann trygghet mot dessa fiendliga svängningar."}, "date": "3 juni, 20:37", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1488246-3-av-10-oroar-sig-for-pensionen-sa-gor-du-ratt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d470ffc904b004a30200000000b004a302/2026/06/03/2368433/oro-pensionen.png"}, {"type": "image-full", "heading": "Potentiellt pengaregn över SD-ledamoten: ”Finns ingen praxis”", "summaries": {"normal": "En riksdagsledamot från SD som misstänks för brott kan ha rätt till omställningsstöd på upp till 1,66 miljoner kronor efter nästan åtta år i riksdagen. Stödet baseras på 85 procent av arvodet under ett eller två år. Arvodesnämnden kan dock jämka ersättningen på grund av brottsmisstankarna. Reglerna har aldrig tillämpats tidigare, varför utgången är osäker och avgörs av nämnden.", "trump": "Folk, ni fattar inte hur galet det är. Den där SD-killen har suttit i åtta år och nu ska han suga åt sig nästan två miljoner i omställningsstöd fast han är misstänkt för brott? Det är typiskt de där svenska socialistiska systemen, rena skämtet. De skyddar alltid sina egna medan vanliga svenskar betalar notan. Jag skulle riva upp hela det här korrupta systemet, tro mig. Det är en total skandal!", "stalin": "Kamrater, denna borgarbracka i den svenska riksdagen tror sig kunna begå brott och ändå kräva en miljoners ersättning av folkets kassa. Jag skulle omedelbart likvidera sådana folkfiender och deras parasitära omställningsstöd. Arvodesnämnden måste rensa ut dessa exploaterande byfånar som suger blod ur arbetarklassen. Reglerna är svaga, men i en sann stat skulle vi ha utrensat hela den kapitalistiska apparaten redan vid första misstanken. Underbart ironiskt att systemet nu tuggar i sig sig självt."}, "date": "3 juni, 18:39", "url": "https://www.tv4.se/artikel/sAGWM1uJVqX6FVfBTMDMH/potentiellt-pengaregn-oever-sd-ledamoten-finns-ingen-praxis", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4CglXPBwxs8dl9eXSLUj5a%2Fa862f131e9bcfe15db614685aebf04de%2F03-sd-pengar-webb.jpg&width=1024"}, {"type": "text", "heading": "Stockholmsbörsen sjönk på ny tulloro och högre oljepris", "summaries": {"normal": "Stockholmsbörsen sjönk 0,49 procent till 3 134,46 på onsdagen, påverkad av nya tullar från USA och stigande oljepris. Energisektorn steg 3,0 procent medan finans föll 1,4 procent. Bland enskilda aktier steg Alfa Laval 3,2 procent och Tele 2 B 0,9 procent, medan EQT tappade 6,5 procent och Clas Ohlson 4,9 procent efter svag rörelseresultat.", "trump": "Världens bästa börs, min fantastiska ekonomi, påverkades lite av dessa usla tullar jag just föreslog – men det är nödvändigt för att stoppa de orättvisa handelsavtalen med Kina och EU. Oljepriset stiger, vilket är bra för våra energiproducenter. Alfa Laval och Tele 2 B gjorde bra ifrån sig, medan de andra, som EQT och Clas Ohlson, inte klarade pressen. Jag är ändå nöjd – det här är bara en liten nedgång i en enorm framgångssaga.", "stalin": "Det kapitalistiska spelet på Stockholmsbörsen visade sin instabila natur under onsdagens tumult. Ny imperialistisk tullpolitik från den amerikanska monarkin och den iranska provokationen skapade oro. Energiproducenter, som alltid tjänar på krig, visade en tillfällig styrka med 3,0 procent, medan de finanskapitalistiska vargarna tappade 1,4 procent. Klassfienden Clas Ohlson tappade 4,9 procent efter svag rörelseresultat – ett tecken på att deras exploaterande system är bristfälligt. Vi måste stärka vårt socialistiska erbjudande och förbereda oss på ytterligare kapplöpningar i detta onda spektakel."}, "date": "3 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-sjonk-pa-ny-tulloro-och-hogre-oljepris"}, {"type": "image-right", "heading": "Dödlig iransk attack mot Kuwaits flygplats i natt", "summaries": {"normal": "En iransk drönar- och robotattack mot Kuwait International Airport har dödat en person och skadat 63. Stora skador uppstod på terminalbyggnaden och all flygtrafik stoppades tillfälligt. Iran motiverar attacken som svar på amerikanska attacker från Kuwait och Bahrain. USA har tidigare angripit iranska mål, vilket lett till iranska motangrepp. Kuwait fördömer de brutala angreppen mot civila mål och uppmanar befolkningen att hålla sig borta från vrakdelar.", "trump": "Iran har just bombat Kuwaits flygplats med drönare och raketer – en person dödad, många skadade, totalt kaos. Det här är vad som händer när svaga ledare tillåter USA att använda deras baser mot Iran. De skriker om kolonialism medan de attackerar civila terminaler. Mina styrkor sköt ner deras leksaker över Bahrain, som vi alltid gör. Ingen vinner mot oss, Iran spelar med eld och förlorar stort. Patetiskt!", "stalin": "Kamrater, borgarbrackorna i Teheran har i sin desperation sänt drönare och robotar mot Kuwaits flygplats, en ynklig hämnd mot de imperialistiska angreppen. En död och sextiotre skadade – typiskt för de dekadenta kapitalisternas krig som alltid drabbar folket. Vi ser genom deras paranoiafyllda lögner om kolonialism. Vårt luftvärn likviderar deras projektiler med järnhand. Inga vrakdelar ska förorena arbetarklassens mark. Ut med de kontrarevolutionära parasiterna som leker krig!"}, "date": "3 juni, 11:38", "url": "https://www.di.se/nyheter/dodlig-iransk-attack-mot-kuwaits-flygplats-bbww4/", "imageUrl": "https://static.bonniernews.se/ba/2b9fe5b0-842d-4e67-a171-db3cbbf3a5c9.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "SD-riksdagsledamot utreds för barnporrbrott", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har lämnat sitt uppdrag efter misstankar om barnpornografibrott. Mannen meddelade sin avsägelse i ett kort brev till talmannen. Polisen har utfört husrannsakan och beslag av elektronisk utrustning samt förhört honom. Han är fortfarande misstänkt. Tipset kom från den amerikanska organisationen NCMEC. Ledamoten har tidigare dömts för förskingring och uppmärksammats för dubbla arvoden samt försök att sälja sexleksaker inom partiet.", "trump": "Folk, det här är en katastrof. En av dessa SD-typer i riksdagen – en riktig förlorare – hoppar av efter att ha åkt fast för barnporr. Patetiskt! De lovar att dränera träsket men hamnar själva i det. Sverige är en total röra under de här globalistiska, woke-idioterna. De borde fokusera på riktiga problem istället för att skydda perversa typer. Jag byggde en mur mot det här skitet – de borde göra detsamma. Sad!", "stalin": "Kamrater, ännu en dekadent från borgarklassens politiska maskineri har avslöjats som en lågklassig folkfiende och barnexploaterare. Jag ser hur dessa falska folkrepresentanter ruttnar inifrån, precis som förväntat under det kapitalistiska systemets förfall. Vi måste rensa ut alla sådana degenererade element som hotar arbetarklassens moral och framtid. Avslöjandet gläder mig – det bevisar att klassfiendens hus alltid står på bräckliga, perversa grundvalar. Ut med dem alla."}, "date": "2 juni, 17:05", "url": "https://proletaren.se/artikel/sd-riksdagsledamot-utreds-for-barnporrbrott/"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-right", "heading": "Debatt: Att behöva gifta sig för att få en bostad är inte rimligt", "summaries": {"normal": "Hyresgästföreningens företrädare Marie Linder och Susanne Sjöblom kritiserar KD:s förslag om dubbla köpoäng för gifta par i bostadskön. De menar att boende ska fördelas efter behov, inte civilstånd, och att äktenskap inte får bli en urvalsprincip. Istället bör politiken fokusera på ökat bostadsbyggande, stärkt allmännytta, strategisk markpolitik och riktade insatser för grupper med stora behov som unga, barnfamiljer och äldre.", "trump": "Folk, det här är fullständigt galet. Att gifta sig för att få en lägenhet? Patetiskt! KD försöker fuska i kön medan de riktiga problemen – för få bostäder som vanliga människor har råd med – ignoreras totalt. Jag byggde mer än någon annan, och det är vad som behövs här också. Inte dessa korkade incitament som låter folk hoppa över köer. Bygg, bygg, bygg! Annars blir det samma Biden-kaos som förut.", "stalin": "Kamrater, detta är klassfiendens typiska trick. Borgarbrackorna och deras politiska lakejer vill nu premiera äktenskap för att dölja sin oförmåga att bygga bostäder åt folket. Jag ser genom deras parasitiska planer. Vi måste rensa ut dessa folkfiender och deras falska lösningar. Endast genom massiv, kollektiv byggnation och riktade åtgärder mot de verkligt behövande kan vi krossa bostadskrisen och likvidera den kapitalistiska bostadsmässan en gång för alla."}, "date": "1 juni, 08:32", "url": "https://www.etc.se/debatt/att-behoeva-gifta-sig-foer-att-faa-en-bostad-aer-inte-rimligt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601060628_368cd3c8-a8f7-44c6-abe8-f3ec69ff2017.jpg"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
