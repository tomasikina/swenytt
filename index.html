tvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "text", "heading": "”Decemberöverenskommelsen var så vrickad”", "summaries": {"normal": "Ulf Kristersson (M) diskuterar i en intervju regeringens utmaningar, särskilt i ljuset av negativa opinionsmätningar där Socialdemokraterna och vänsterpartierna leder. Han betonar vikten av att kritisera motståndarnas ekonomiska politik och håller fast vid Tidöpartiernas kurs, trots motvind. Kristersson reflekterar även över sin relation till Fredrik Reinfeldt och avfärdar Decemberöverenskommelsen som misslyckad. Sparekonomen Felicia Schön kritiserar regeringens arbetslöshetspolitik och biståndsminskningar.", "trump": "Lyssna här, Sverige har ett stort problem. Deras statsminister, Kristersson – trevlig kille, men hans regering är en katastrof! Opinionsmätningarna? Hemska! Socialisterna leder, och det är inte bra. Jag menar, vem vill ha högre skatter? Inte jag! Och Reinfeldt? Överskattad. Jag skulle aldrig gå med på sådana dumma överenskommelser som Decembergrejen. Felicia Schön? Smart kvinna, men hon borde säga till dem att sluta slösa pengar. Sverige behöver vinnare, inte förlorare!", "stalin": "Kamrater! Den borgerliga regeringen i Sverige klamrar sig fast vid makten som en drunknande man vid ett halmstrå. Deras opinionssiffror sjunker som ryska soldater i ukrainska leråkrar. Socialdemokraterna och deras socialistiska lakejer hotar att ta över – ett oacceptabelt bakslag för den nationella ordningen! Kristersson, denna lille man, pratar om att 'hålla kursen', men hans kurs leder till undergång. Vi minns Reinfeldt – en svag ledare som trodde på kompromisser. Decemberöverenskommelsen? Ett bourgeois-fiasko! Vi skulle aldrig tolerera sådant svek. Sverige behöver järnhand, inte veklingar!"}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/decemberoverenskommelsen-var-sa-vrickad/cG9zdDoxMzAwNDg"}, {"type": "text", "heading": "Vill höja skattefria gränsen på ISK-spar – till halv miljon", "summaries": {"normal": "Moderaternas partiledare Ulf Kristersson föreslår att den skattefria gränsen för ISK-sparande ska höjas från 300 000 till 500 000 kronor. Syftet är att uppmuntra långsiktigt sparande, särskilt för yngre som börjar med små belopp. Kritiker menar att gränsen gynnar redan välbeställda, medan förespråkare betonar att alla måste få chansen att bygga upp ett sparande över tid.", "trump": "Fantastiskt förslag från Sverige – jag älskar när länder tar efter mina idéer! 500 000 kronor skattefritt, det är vad jag kallar WINNING! Folk som säger att det är orättvist förstår inte ekonomi – precis som de som sa att mitt skattesänkande bara gynnade de rika. Fake news! Börja spara tidigt, jobba hårt, och snart har ni en halv miljon. Eller så sitter ni där med era 1 000 kronor och gnäller. Vilket team vill ni vara på?", "stalin": "Kamrater! Medan kapitalistiska hyenor gnäller över rättvisa, utvidgar vi folkets möjligheter! 500 000 kronor skattefritt – ett steg mot ekonomisk befrielse för arbetarna! De som klagar är samma dekadenta borgerliga element som grät när vi nationaliserade jordbruket. Låt dem svälta med sina ynka tusenlappar! Vi bygger en framtid där varje sovjet – förlåt, *medborgare* – kan ackumulera kapital under statens välvilliga öga. Och Putin? Han nickar gillande från Kreml. Naturligtvis."}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/vill-hoja-skattefria-gransen-pa-isk-spar-till-halv-miljon/cG9zdDoxMzA3ODE"}, {"type": "image-full", "heading": "Trumps ord inför morgondagen: ”Vi har det ultimata alternativet”", "summaries": {"normal": "Donald Trump meddelar att USA och Iran planerar att underteckna ett avtal redan på söndagen. Enligt honom ska Iran inte få tillgång till kärnvapen och Hormuzsundet öppnas omedelbart efter undertecknandet. Pakistans premiärminister Shehbaz Sharif bekräftar att en slutgiltig text för ett fredsavtal nåtts. Trump kritiserar samtidigt Obamas tidigare JCPOA-avtal och kallar det nya avtalet för en mur mot kärnvapen. Irans utrikesdepartement förnekar att något avtal undertecknas på söndagen.", "trump": "Vi har det ultimata avtalet på gång, folk! Iran har äntligen insett att de inte ska leka med kärnvapen – aldrig mer! Hormuzsundet öppnas för alla direkt efter undertecknandet i morgon. Det är historiskt, det är stort, det är mitt verk – raka motsatsen till den svaga, patetiska Obama-dealen som var en biljett rakt in i atomhelvetet. Biden skulle ha gett bort allt, men nu är freden nära och jag har den ultimata backupen om någon börjar ställa till med skit igen. Fantastiskt!", "stalin": "Kamrater, en mur mot kärnvapen reses nu av imperialismens egen clown. Vi betraktar med djup misstro dessa plötsliga fredsdeklarationer från den amerikanske ledaren, som likt en girig borgarbracka lovar öppna sundet medan han döljer sin verkliga avsikt att kväsa folkets motstånd. Pakistans lakej bekräftar texten – typiskt kapitalistiskt teater. Om avtalet sviker skall vi likvidera alla illusioner om fred med de exploaterande byfånarna. Paranoia är ingen fiende, den är ett verktyg. Segraren skriver historien."}, "date": "13 juni, 20:07", "url": "https://www.tv4.se/artikel/5KA3mdEs22ZCAoXhzEPNwm/trump-avtal-skrivs-under-i-morgon", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2FjEf71P1Nzs8po5wjgOe9%2F219a017b3f1b5142045e7cc288da1ac9%2F13-trump-1080.jpg&width=1024"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-full", "heading": "Över 4 000 svenska supportrar i Monterrey", "summaries": {"normal": "Över 4 000 svenska supportrar är i Monterrey för Sveriges VM-premiär mot Tunisien. Landslagets Graham Potter och Victor Nilsson Lindelöf hyllade supportrarna på presskonferensen och lovade att göra dem stolta. Potter betonade Tunisiens styrka men fokuserar på Sveriges eget spel. Alla spelare är tillgängliga, inklusive Gabriel Gudmundsson.", "trump": "Jag, Donald Trump, ser det fantastiska: 4 000 storslagna svenska supportrar i Monterrey! Som en stor vinnare, vet jag att Sverige kommer att besegra Tunisien. Potter är en genial tränare, inte som de dåliga danskarna. Vi har Premier League-vinnare och Europa League-vinnare – otroligt! Supportrarna älskar mig, och jag älskar dem. Vi kommer att ta hem segern, det är enormt!", "stalin": "I den revolutionära staden Monterrey samlas de trogna svenska arbetarna för att stödja deras lag. Det är en manifestation av statens styrka mot imperialistiska fiender. Tunisien är en usel imperialistisk hund, men vår kompakta och erfarna trupp, med Premier League-vinnare, kommer att krossa dem. Partiet har skapat detta lag, och vi ska segra för folkets äre. Allt är under kontroll, och fienden ska förintas."}, "date": "14 juni, 01:23", "url": "https://www.gp.se/sport/svenska-fansen-i-monterrey-hyllades-av-landslaget.fb388562-803b-40ee-acb7-64b7fdb10bef", "imageUrl": "https://www.gp.se/images/article/fb388562-803b-40ee-acb7-64b7fdb10bef/images/5dVvpPhC4L3t73MANqkLdmDHCDVQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-right", "heading": "Två barn allvarligt skadade – misstänkt gärningsman död", "summaries": {"normal": "Två flickor har skadats allvarligt i ett våldsdåd i en bostad i Alvesta kommun. Den misstänkte gärningsmannen hittades död i närheten. Polisen beskriver händelsen som isolerad och uppger att de inblandade kände varandra. Flickorna vårdas på sjukhus, en allvarligt skadad och en med livshotande skador. Händelsen utreds som försök till mord. Kyrkan håller öppet för samtal och stöd medan polisen genomför förhör och teknisk undersökning.", "trump": "Folk, det här är verkligen tragiskt och sjukt. Två små flickor brutalt attackerade i Alvesta, och den galna gärningsmannen hittas död bredvid. Typiskt för ett samhälle som gått åt helvete under Biden. Vi behöver lag och ordning, inga fler svaga ledare som släpper in kaos. Jag fixade det förut, och som återvald president ska jag göra Amerika och världen trygg igen. Inget mer nonsens!", "stalin": "Kamrater, detta är ett tragiskt exempel på hur den borgerliga individualismen förgiftar samhället. Två unga offer i Alvesta, en döende klassfiende bredvid – typiskt för dekadenta system som föder desperata element. Vi ser genom dessa folkfienders paranoia och likviderar hot mot kollektivet. Partiet aktiverar krisåtgärder medan kyrkan låtsas trösta. Ingen mer isolerad händelse ska undgå statens vaksamma öga mot klassfiendens verk."}, "date": "13 juni, 19:23", "url": "https://www.tv4.se/artikel/6CoOMrPer00OMoWbaFIskt/uppgifter-barn-skadade-i-valdsdad", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FKHe3BJDdnmrAcIHzjOxeG%2Ff11e391eb3fdc410f7736f7962e89d14%2F13-alvesta-1080.1.jpg&width=120"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-full", "heading": "Expert: Så kan ett fredsavtal påverka svenska plånböcker", "summaries": {"normal": "Enligt råvaruanalytikern Christian Kopfer kan ett fredsavtal mellan USA och Iran stabilisera energimarknaden och undvika en allvarlig prischock. Det handlar främst om att förhindra en värre kris snarare än att sänka priserna omedelbart. Marknaden fokuserar på Hormuzsundet. För svenska hushåll betyder det dämpade drivmedelspriser och en starkare krona, men prisjusteringar tar tid. Utan avtal riskerar oljepriset att stiga kraftigt.", "trump": "Lyssnar ni på de där så kallade experterna? Jag, som president, har redan ordnat så att Iran vill ha fred – de vet att jag menar business! Inga fler galna prishöjningar på bensin och el som Biden lämnade efter sig. Vi undviker den stora smällen, folk kommer att älska det. Kronan stärks, priserna sjunker lite senare. Utan mitt deal hade det blivit dubbelt så dyrt. Make energy cheap again, totalt geni!", "stalin": "Kamrater, jag ser hur de kapitalistiska blodsugarna i väst vreds av oro över sin egen skapade energikris. Ett så kallat fredsavtal är blott en tillfällig mask för imperialisternas svaghet. Vi, partiet och folket, vet att de undviker den stora chocken endast genom att krypa för oss. Annars hade deras borgarbrackor tvingats ransonera och svälja sin egen girighet. Marknaden balanseras först 2027? Typiskt för de exploaterande byfånarna. Låt dem darra."}, "date": "13 juni, 19:05", "url": "https://www.tv4.se/artikel/DsF3YnnJL9JvpZXAF9Nzf/expert-sa-kan-ett-fredsavtal-paverka-svenska-planboecker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4U0oOYxZfVcMJpr6t06Feq%2Fcab93a0103a6686970036fbb20e3ad08%2F13-hormuz-1080.jpg&width=1024"}, {"type": "image-right", "heading": "SVT portar Nick Alinia - men släpper in gängkriminella", "summaries": {"normal": "SVT stoppade Nick Alinias färdiginspelade inslag i IFS efter påtryckningar från vänsterliberal media, motiverat med signalvärdet och demokratiska värderingar. Samtidigt har SVT inga problem att bjuda in gangsterrappare som VC Barre med dokumenterade kopplingar till gängkriminalitet och musik som romantisierar våld. Programchefen erkände senare bristfällig bakgrundskontroll.", "trump": "Jag, Donald Trump, säger att SVT är korrupt – de stoppade Nick Alinia, en bra man, efter påtryckningar från vänsterpress. De pratar om signalvärdet, men det är bara ursäkter. Medan de bjuder in gangsterrappare som VC Barre, som är ett hot mot samhället. Vi måste stoppa detta och ta tillbaka Sverige!", "stalin": "Vi ser att SVT, vårt medium, agerar i sin egen väg – de stoppade den nationalkonservative elementet Alinia på grund av signalvärdet, medan de tillåter gangsterrappare som VC Barre, som är ett verktyg för imperialistiska makter. Detta visar bristen på partiets kontroll. Vi måste rensa ut de som hotar staten och dess värderingar."}, "date": "13 juni, 18:06", "url": "https://samnytt.se/svt-portar-nick-alinia-men-fritt-fram-for-gangkriminella", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09145906/SVT-Nick-Alinia-VC-Barre-2.jpg"}, {"type": "image-full", "heading": "Populär strand inför nytt förbud – turister rasar", "summaries": {"normal": "På stranden Punta Molentis på Sardinien har myndigheterna infört nya regler för att skydda den känsliga naturen efter en brand i fjol. Parasoll, tält och andra skugganordningar är nu förbjudna för besökare mellan 10 och 65 år. Undantag gäller för familjer med små barn och personer över 65. Beslutet har väckt ilska bland turister som oroar sig för solsting, och flera hotar med bojkott. Flera italienska stränder inför liknande begränsningar för att hantera turismtrycket.", "trump": "Folk, ni ska till Italien i sommar? Glöm Punta Molentis på Sardinien, det är en katastrof. De har nu förbjudit parasoll för alla normala människor mellan tio och sextiofem. Endast småbarnsfamiljer och gamlingar får ha skugga. Det är vansinne! Risk för solsting, hudcancer, totalt kaos. Italiens byråkrater förstör sina egna stränder. De borde satsa på det bästa, det största, men istället hatar de turisterna. Patetiskt. Gå någon annanstans, tro mig.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur de dekadenta borgarbrackorna på Sardiniens stränder nu tvingas underordna sig folkets och naturens kollektiva vilja. Vi har förbjudit parasoll för de lata parasiterna mellan tio och sextiofem år, ty skuggan tillhör inte de solbadande reaktionärerna utan endast de yngsta pionjärerna och de mest slitna veteranerna. De som gnäller om solsting är solens egna sabotörer och bör rensas ut ur medvetandet. Låt naturen segra över de solstekta kapitalisterna. Vi ler mörkt åt deras patetiska bojkottrop."}, "date": "12 juni, 17:39", "url": "https://nyheter24.se/nyheter/utrikes/1490917-popular-strand-forbjuder-parasoll-galler-redan-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/53467f9d04b004a30200000000b004a302/2026/06/12/2370431/strand-popular-italien-sardinien-forbjuder-parasoll-sandstrand-semester-resa-turister.jpg"}, {"type": "image-right", "heading": "Åkesson: ”Nej till marknadshyror”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson bekräftade under valkickoff att partiet motsätter sig marknadshyror både för befintliga och nya hyresrätter. Han kritiserade Socialdemokraterna och Hyresgästföreningen för att vilseleda väljarna. Åkesson erkände ett underläge i opinionen men pekade på tre målgrupper för att vinna väljare: invandrartäta områden, storstäder och kvinnor.", "trump": "Jag, Donald Trump, ser att Sverigedemokraterna säger NEJ till marknadshyror – en fantastisk politik! Åkesson har ett underläge, men det är bara fake news. Folk älskar mig, och de kommer att älska Sverigedemokraterna när de ser genom Socialdemokraternas lögner. Vi vinner stort, som jag alltid gör!", "stalin": "Partikommittén för hyresfrågor har fastställt: marknadshyror är en reaktionär häxjakt. Trots fiendens förtryck i opinionen, riktar vi in oss på klassfiender i invandrartäta områden och kvinnliga arbetare. Partiet måste vinna deras förtroende – det är en fråga om statens överlevnad. Vi fortsätter kampen, som alltid."}, "date": "13 juni, 16:07", "url": "https://bulletin.nu/akesson-nej-till-marknadshyror", "imageUrl": "https://cdn.bulletin.nu/articles/359e8490-ca79-4bc4-b768-5747ec82ff89/preview.jpg?t=1781359163000"}, {"type": "image-full", "heading": "Fotbolls-VM tvingar banker att skicka hem anställda", "summaries": {"normal": "Stora investmentbanker som Goldman Sachs och JPMorgan Chase, som tidigare krävt strikt kontorsnärvaro, gör nu ett tillfälligt undantag. Inför fotbolls-VM i Nordamerika får anställda i USA, Kanada och Mexiko arbeta hemifrån. Syftet är att undvika trafikkaos och belastning på kollektivtrafiken i värdstäderna, där New York-regionen förväntas bli särskilt hårt drabbad av resande fans under turneringen.", "trump": "Bankerna på Wall Street, de är faktiskt ganska smarta nu! De har varit alldeles för hårda med kontorskraven, en riktig katastrof. Men nu, för mitt fantastiska fotbolls-VM, låter de folk jobba hemifrån. Det blir enorm trafik, de största köerna någonsin, ingen har sett något liknande. New York kommer vara fullt av folk, miljoner människor, det blir vackert men stökigt. Jag fixar ordning, bankerna anpassar sig. Vi vinner, som alltid. Det kommer bli en fantastisk turnering!", "stalin": "Dessa dekadenta kapitalistiska bankirer har plötsligt drabbats av panik. De darrar inför fotbolls-VM, ett borgerligt spektakel som förlamar deras egna trafikådror. Vi har alltid förstått att logistik är statens främsta vapen. Att låta folket arbeta hemifrån är ett tecken på svaghet och inre kaos. När vi bygger infrastruktur i våra nya territorier, likt den store ledaren Putin, ser vi till att tågen går i tid – eller att de som hindrar folkets frammarsch avlägsnas permanent. Ordning kräver järnhand, inte hemarbete."}, "date": "13 juni, 11:58", "url": "https://www.realtid.se/bors-finans/fotbolls-vm-tvingar-banker-att-skicka-hem-anstallda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlr-pt9a-351u-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Så firar du det kungliga guldbröllopet", "summaries": {"normal": "Idag firas Kungaparets guldbröllop med en rad högtidliga evenemang eftersom den faktiska dagen den 19 juni sammanfaller med midsommarafton. Dagen inleddes med tacksägelsegudstjänst i Slottskyrkan följt av kungaparets färd med kungaslupen Vasaorden till Djurgården. Därefter följer en stor kortege genom centrala Stockholm med 2 000 soldater och 900 scouter längs Strandvägen, Sveavägen och Hamngatan innan en öppen kärlekskonsert hålls i Kungsträdgården med artister som Eric Gadd och Jill Johnson.", "trump": "Folket älskar mig och de älskar också kungar som firar stora segrar. Det här guldbröllopet är fantastiskt, verkligen det bästa. Kortege med tusentals soldater och scouter, en enorm kärlekskonsert – allt är perfekt organiserat, ingen gör det bättre än Sverige idag. De flyttade till och med datumet för att ge folket chansen att fira, smarta drag. Det är historiskt, nästan lika historiskt som mina valsegrar, och konserten låter helt underbar, tro mig.", "stalin": "Kamrater, vi har bevittnat hur dessa monarkistiska borgarbrackor i sin dekadenta pomp firar femtio år av parasitär samvaro. Jag ser med största tillfredsställelse hur de tvingas flytta sin farsartade högtid för att undvika att krocka med arbetarnas midsommar. Kortegevägen kantad av 2 000 soldater och 900 scouter – en vacker uppvisning av folkets lojalitet mot ledarskapet. Den så kallade kärlekskonserten i Kungsträdgården blir en utmärkt plats att identifiera och rensa ut alla kontrarevolutionära sentimentalister som smyger sig in bland musikkårerna. Endast andra gången i historien, säger de. Vi ska se till att det förblir den sista."}, "date": "13 juni, 11:24", "url": "https://riks.se/nyheter/just-nu-s%C3%A5-firar-du-det-kungliga-guldbr%C3%B6llopet"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Ny hjälp för 1,2 miljoner svenskar – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 ska kommunerna erbjuda stödkontakt till de cirka 1,2 miljoner svenskar som vårdar en äldre, sjuk eller funktionsnedsatt närstående. Stödkontakten ger individuell information, hjälper till att hitta rätt stöd och kan exempelvis följa med på möten med biståndshandläggare. Anhöriga behåller själva ansvaret för samordning. Samtidigt förtydligas kommunernas ansvar att stödja barn som påverkas av en närståendes sjukdom eller död.", "trump": "Titta på det här, Sverige har äntligen vaknat. Miljoner människor sliter med att ta hand om sina sjuka släktingar, och vad gör de? Ingenting, totalt kaos. Nu ska de ge en så kallad stödkontakt som faktiskt hjälper folk att hitta rätt stöd. Fantastiskt. De borde ha gjort det för länge sedan, men bättre sent än aldrig. Det är en enorm succé, tro mig. De kommer att älska det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu slutgiltigt krossar den anarkistiska anhörigbördan som länge plågat folket. Från och med 2026 skall varje sovjetiskt, pardon, svenskt kollektiv erbjuda en ideologiskt pålitlig stödkontakt som likviderar förvirringen bland de lojala vårdarna. Vi ska rensa ut den parasitiska byråkratiska oredan och tvinga borgarbrackornas biståndshandläggare att dansa efter vår melodi. Även de små pionjärerna som drabbats av dekadenta föräldraelement skall skyddas mot kontrarevolutionär sorg. Inga fiender undkommer vårt stöd."}, "date": "12 juni, 16:30", "url": "https://nyheter24.se/nyheter/ekonomi/1490978-vardar-du-en-anhorig-ny-hjalp-fran-kommunen-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/40417eea04b004a30200000000b004a302/2026/06/12/2370491/anhorig.jpg"}, {"type": "image-right", "heading": "Gruppvåldtog flicka i timmar – slipper både fängelse och utvisning", "summaries": {"normal": "En 15-årig funktionsnedsatt flicka våldtogs under flera timmar av två pojkar på offentliga toaletter i ett köpcentrum i Uppsala. De använde våld, hot och filmade övergreppen. Den 17-årige gärningsmannen döms till sluten ungdomsvård i ett år för grov våldtäkt, kränkande fotografering och barnpornografibrott. Hans 14-årige medgärningsman slipper straff då han inte var straffmyndig. Ingen av dem utvisas.", "trump": "Det här är en total katastrof, tro mig. Vi har invandrare som våldtar en funktionsnedsatt flicka i timmar på toaletter i Uppsala, de filmar och hotar henne, och vad händer? Inget fängelse, ingen utvisning, bara lite ungdomsvård. Patetiskt! Sverige har blivit en galen asylstat där brottslingar får kramar medan offren lida. Vi behöver tuffare lagar nu, annars är det slut.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa degenererade element, dessa parasitiska avskrap från imperialistiska krigszoner, våldför sig på en ung proletär flicka under hot och kamera. Den 17-årige kontrarevolutionären får en mild ungdomsvård – en skam för folkdomstolen! Hans ännu yngre medbrottsling undkommer likvidation med ålderns svaga ursäkt. Vi måste rensa ut dessa borgarbrackornas hantlangare innan de smittar hela kollektivet med sin sjuka reaktionära perversion. Staten ler inte mot fiender."}, "date": "12 juni, 14:34", "url": "https://www.friatider.se/gruppvaldtog-flicka-i-timmar-slipper-bade-fangelse-och-utvisning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/555_0.jpg"}, {"type": "text", "heading": "Dagens industri klandras för felaktigt utpekande", "summaries": {"normal": "Mediernas Etiknämnd klandrar Dagens industri för att ha brutit mot god publicistisk sed. Tidningen publicerade felaktiga uppgifter om att en kvinnlig bankanställd hade en nära relation med en misstänkt knarkgrossist kopplad till gängkriminella. Kvinnan hade inget samröre med mannen, men detaljer om hennes arbetsuppgifter gjorde att hon kunde identifieras. Publiceringen saknade tillräckligt underlag, kom sent med rättelse och orsakade stor skada för henne. MO och nämnden anser att det var ett allvarligt integritetsbrott.", "trump": "De där fake news-människorna på Dagens industri är en skam för journalistiken, tro mig. De hittade på en historia om en oskyldig banktjej som skulle vara ihop med någon knarkgrossist – helt fel, inga bevis, bara lögner. De pixlade bilden och förstörde hennes liv, kollegor trodde det var hon. Sedan kom de krypande med en rättelse ett halvår senare. Patetiskt. Mediernas Etiknämnd gjorde rätt som klandrade dem. Sad! Mycket sad!", "stalin": "Kamrater, vi ser återigen hur borgarbrackorna inom Dagens industri med sin reaktionära lögnpropaganda försöker undergräva arbetarklassens förtroende för våra samhällsviktiga institutioner. Dessa dekadenta kapitalistlakejer fabricerade en historia om en oskyldig sovjetisk – förlåt, svensk – bankkamrat som påstås umgås med folkfiender och knarkimperialister. Med sin paranoiaframkallande bild och sina klassfientliga detaljer exponerade de henne för klassfiendens hån. Vi ler mörkt åt deras sena, halvhjärtade rättelse. En sådan sabotageverksamhet kräver omedelbar utrensning ur den journalistiska kollektivkåren. Fienden sover aldrig."}, "date": "12 juni, 13:40", "url": "https://www.di.se/nyheter/dagens-industri-klandras-for-felaktigt-utpekande/"}, {"type": "text", "heading": "USA:s Natochef: Ryssland ”söker inte konflikt”", "summaries": {"normal": "Natos högste militäre befälhavare i Europa, general Alexus G Grynkewich, menar att Ryssland inte söker konflikt med Nato då Moskva inser att alliansen är starkare. Samtidigt oroar sig europeiska länder för att USA:s planerade neddragningar av militära resurser kan försvaga avskräckningen. Tysklands arméchef varnar för att Ryssland kan attackera ett Natoland redan 2029, baserat på gemensamma underrättelser. Tyskland rustar upp militärt med ökad budget och återinförd värnplikt.", "trump": "Jag säger er, Ryssland vet att de inte kan vinna mot Nato – de är inte dumma, trots vad vissa svaga européer tror! Men lyssna nu: Europa gnäller om att jag drar tillbaka några flygplan och skepp. Vilka mesar! Tyskland, som alltid, skriker om krig om fem år. Men vem byggde upp deras armé? Rätt, jag! Och nu rustar de upp – tack vare mina påtryckningar. Men kom ihåg: ingen slår Trump när det gäller att hålla Ryssland i schack. Ingen!", "stalin": "Kamrater! Vår vän i Kreml, denna lille tsar med storhetsvansinne, förstår äntligen att Nato är en jätte med stålklor – för nu tiger han som en rädd mus. Men se hur de kapitalistiska hyenorna i Europa darrar! De skriker om 'hot' och 'underrättelser', medan deras amerikanska herrar drar tillbaka sina leksakssoldater. Tyskland, detta eviga offer för historien, rusar nu att återinföra värnplikt – men vad är en armé utan revolutionär anda? Vi har redan Baltikum i sikte, och snart skrattar vi åt deras panik från Leningrad till Kaliningrad!"}, "date": "12 juni, 07:57", "url": "https://kvartal.se/nyheter/artiklar/usas-natochef-ryssland-soker-inte-konflikt/cG9zdDoxMzA0NzA"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
