en av ointresse. Because we acted, change happened – ett utmärkt slagord för den fortsatta kampen mot sabotage och klassfiender."}, "date": "8 juni, 07:00", "url": "https://arbetet.se/2026/06/08/hellofresh-klubben-pa-lagret-kordes-over-fick-fest-pengar-och-profilklader/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05070931/hellofresh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Batljanbolag köper för nästan en miljard", "summaries": {"normal": "Medicinteknikbolaget Episurf, där Ilija Batljan är storägare, expanderar kraftigt inom fastighetssektorn genom förvärvet av en portfölj om 30 fastigheter från Livi Fastigheter för 920 miljoner kronor. Affären är en del i Episurfs mål att nå en fastighetsportfölj på 20 miljarder kronor. Samtidigt omgärdas Batljans affärsmetoder av kritik och juridiska tvister gällande värderingar och utspädning för aktieägare, vilket Batljan själv avvisar. Episurfs totala fastighetsvärde uppgår nu till 5,2 miljarder kronor.", "trump": "Ilija Batljan, en mycket intressant person, gör enorma affärer. Episurf köper fastigheter för nästan en miljard – fantastiska siffror, verkligen enorma! De siktar på 20 miljarder, det är så man vinner. Men det finns kritiker, småaktiga människor, som klagar på utspädningar och juridik. Fake news-varning! Batljan säger att allt är korrekt, och jag tror honom, han är en mycket duktig affärsman. Det här är hur man bygger stora saker, inte som de svaga politikerna gör!", "stalin": "Ilija Batljan bygger sitt fastighetsimperium med en girighet som nästan skulle kunna imponera på en kulak. Han samlar 30 fastigheter som om de vore sockerbitar under en hungersnöd. Men pass upp, kamrat Batljan! Denna utspädning av aktiekapitalet är ren sabotageverksamhet mot folket och stabiliteten. När vi expanderar vår intressesfär, som vår vän i Kreml så föredömligt gör i väst, krävs disciplin, inte juridiska stämningar från agenter. Vi noterar hans framfart i våra rullor – förr eller senare väntar alltid statens kontroll."}, "date": "8 juni, 12:04", "url": "https://www.realtid.se/fastigheter/batljanbolag-koper-for-nastan-en-miljard/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/batljan.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Svenskar vet bäst. Så sätter vi EU-medborgarnas kapital i arbete", "summaries": {"normal": "EU:s sex största ekonomier har lagt fram ett kompromissförslag för att skapa en mer integrerad kapitalmarknad, kallad spar- och investeringsunionen. Artikeln ser det som positivt då konkurrenskraft, upprustning och grön omställning kräver fritt flöde av kapital. Sverige är positivt till integration men skeptiskt till att flytta tillsynen över börserna till Esma. Förslaget kan förbättra tillgången till kapital för små och innovativa företag. En nationell förändring i sparbeteende behövs för att lyckas.", "trump": "Det här är stort, verkligen enormt. Europas största länder kommer äntligen med ett kompromissförslag för att få igång kapitalet, precis som jag alltid sagt. De behöver enorma mängder pengar för att slåss mot oss amerikaner och kineserna, men de sitter fast i sin byråkratiska röra. Sverige gör det rätt med aktiesparande och ISK, folkligt och smart. De borde lyssna på svenskarna istället för att ge makten till några misslyckade byråkrater i Paris. Gör det enkelt, annars kommer ni aldrig vinna.", "stalin": "Kamrater, jag betraktar med stålblick hur dessa sex borgerliga ekonomier nu kryper fram med sitt kompromissförslag om en så kallad spar- och investeringsunion. Det är hög tid att kapitalet underordnas folkets vilja istället för att låta det flöda fritt som en illaluktande flod av girighet. De nationella tillsynerna är naturligtvis fulla av dolda fiender och kapitalistiska avfällingar som vi snart ska rensa ut. Låt oss likvidera borgarbrackornas motstånd mot Esma och tvinga massorna att byta sina bankkonton mot aktier, annars väntar utrensning av alla som vägrar tänka som äkta riskkapitalistiska kamrater. Det blir underhållande att se."}, "date": "8 juni, 09:38", "url": "https://www.di.se/ledare/svenskar-vet-bast-hur-kapitalet-satts-i-arbete/", "imageUrl": "https://static.bonniernews.se/ba/e0ffc4d2-40d5-4bfd-bcac-0b3edd774446.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Storbank lägger bud på världens äldsta bank – 30 miljarder euro", "summaries": {"normal": "Intesa Sanpaolo har lagt ett bud på 30,6 miljarder euro för att förvärva Monte dei Paschi di Siena, världens äldsta bank. Budet kommer kort efter att Banco BPM visat intresse för banken. Affären ses som strategiskt viktig då Monte Paschi innehar andelar i försäkringsjätten Generali. En del av upplägget innebär att varumärket och hälften av kontoren säljs till Unipol för att undvika konkurrensproblem. Händelsen markerar en tydlig konsolideringstrend inom den italienska banksektorn.", "trump": "Italien har problem, stora problem! Nu försöker de rädda sin gamla bank, Monte Paschi, genom att sälja ut den. Intesa bjuder 30 miljarder, det är mycket pengar, tro mig. Jag vet hur man gör affärer, och det här ser stökigt ut. Alla vill åt Generali-andelarna, det är en riktig maktkamp. Det är en total röra, precis som när de försöker styra sin ekonomi. Jag hade fixat det på en dag. Italien behöver starka ledare, inte fler bankförsök!", "stalin": "Kapitalismens förfall är totalt när de tvingas handla med sina ruttna gamla lik. Monte Paschi, en relik från feodalismen, säljs nu likt en billig handelsvara. Intesa vill lägga beslag på makten, precis som de västliga lakejerna försöker expandera sin inflytandesfär. Putin förstår att man inte förhandlar med parasiter, man krossar dem. Att låta banker leka med försäkringsjättar är sabotage mot folkets intressen. Vi, staten, ser allt; dessa bankirer kommer snart att inse att deras guld inte kan köpa dem säkerhet."}, "date": "8 juni, 12:03", "url": "https://www.realtid.se/bors-finans/bank-fintech/storbank-lagger-bud-pa-varldens-aldsta-bank-30-miljarder-euro/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bankbud.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Trotsar Trump – svarar på angreppet från Iran", "summaries": {"normal": "Israel genomförde under natten mot måndagen luftangrepp mot militära mål i västra och centrala Iran som vedergällning för Irans robotangrepp kvällen innan. Explosioner rapporterades i flera iranska städer. Iran svarade med nya robotar mot Israel, där flera sköts ner. Börserna i Asien föll kraftigt medan oljepriset steg. Attackerna sker trots att USA:s president Donald Trump uppmanat Benjamin Netanyahu att avstå från vedergällning.", "trump": "Iran, de galna mullorna, skickade sina leksaksrobotar mot Israel och trodde de skulle vinna. Nu slår Israel tillbaka med full kraft – boom, boom, rakt in i deras militära soppgrytor. Jag sa åt Bibi att inte göra det, att jag bestämmer, men han lyssnade inte. Typiskt. Börserna rasar, oljan skjuter i höjden. De borde ha lyssnat på mig istället för att leka krig. Sad!", "stalin": "Imperialistiska sionisterna och deras fascistiska flygvapen har återigen visat sin blodtörstiga natur genom att bomba iranska arbetarnas försvar. Klassfiendens robotar regnar ner som lögnaktiga löften från borgarbrackor. Vi, det kollektiva folket, ser hur dessa folkförtryckartroll försöker krossa motståndet. Deras paranoia driver dem till vansinne. Snart ska de rensas ut ur historien som de exploaterande parasiterna de är. Härligt kaos!"}, "date": "8 juni, 11:50", "url": "https://www.expressen.se/nyheter/varlden/israel-svarar-pa-angreppet-bombar-mal-i-iran/", "imageUrl": "https://static.bonniernews.se/ba/6830402a-1dbe-41a7-97d6-543609bc8825.jpeg?crop=1440%2C1440%2Cx961%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-full", "heading": "Israel svarar – slår till mot mål i Iran", "summaries": {"normal": "I söndags attackerade Iran Israel med missiler, och Israel svarade med attacker mot mål i Iran under natten. Många platser, inklusive Teheran, drabbades. Donald Trump uppmanade båda länderna att avbryta vedergällningarna och återgå till förhandlingar, och sade att han ringde Netanyahu för att fördröja ett israeliskt svar.", "trump": "Jag var väldigt nära ett fantastiskt avtal med Iran, men sedan skjuter de missiler mot Israel. Jag sa åt Netanyahu att inte svara, men han är lite svår att styra. Jag är den som bestämmer, inte han. Vi måste komma tillbaka till förhandlingsbordet och skapa fred. Det här är en skandal!", "stalin": "Vi svarar med oöverträffad kraft mot de zionistiska och imperialistiska agressörerna. Teheran måste lära sig att respektera vår sfär. Vi kommer att utvidga vår inflytelsesfär, precis som våra ryska allierade gör i Ukraina. Våra fiender ska skämmas! Vi kommer att segra, för det är vår historiska mission."}, "date": "8 juni, 06:18", "url": "https://www.gp.se/nyheter/varlden/israel-svarar-slar-till-mot-mal-pa-flera-platser-i-iran.3630f787-91b8-47ee-bfe8-428c427fed86", "imageUrl": "https://www.gp.se/images/article/3630f787-91b8-47ee-bfe8-428c427fed86/images/3n_t9x6CkZRKumIWirpDaE22uVXY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Daniel Riazat utmanas om nya partiets hållning till Irans regim", "summaries": {"normal": "Det nya partiet Framtidens Vänster, bildat av före Vänsterpartiets medlemmar Daniel Riazat och Lorena Delgado Varas, möter intern konflikt. Partiets studentförbund och Solna-sektion kräver 'full solidaritet' med Irans regim i 'antiimperialistisk kamp', medan Riazat, med iransk bakgrund, starkt kritiserat regimen. Partiet lanserades 2025 och satsar på kommunal politik.", "trump": "Jag, Donald Trump, ser detta. Dessa s k 'vänsteraktörer' försöker smicka sig till antiimperialistisk trojka, men jag vet ett dåligt spel när jag ser ett. Riazat pratar tufft mot Iran men hans egna folk vill ha regimen – det är ett tecken på svaghet. Jag tog hårdare tag mot dessa hundar när jag var president, och jag kommer att återvända för att stärka USA:s ställning.", "stalin": "Partiet Framtidens Vänster visar tecken på ideologisk sjukdom. Medlemmar som Riazat, som tidigare visade korrekt klassmedvetenhet mot den iranska reaktionära regimen, hotas nu av revisionistiska hundar inom sina egna rader. Dessa 'antiimperialister' är i själva verket imperialismens agenter, som försöker undergrava partiets renhet. Folkets vilja måste uttryckas genom partiets beslut, inte genom dessa individualistiska vildar. Vi måste rensa upp, som Putin gör i sitt stålbad mot västlig hybris."}, "date": "8 juni, 07:14", "url": "https://bulletin.nu/daniel-riazat-utmanas-om-nya-partiets-hallning-till-irans-regim-2", "imageUrl": "https://cdn.bulletin.nu/articles/70aa66a1-371e-4024-83fa-8ab7e5aa5cad/preview.jpg?t=1780880734000"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Pekar ut SD-trixande med fakturor – anordnade ”Jimmie-fester”", "summaries": {"normal": "TV4:s Kalla Fakta granskar i tre delar hur Sverigemokraterna kringgått regler för förmånsbeskattning vid evenemang. Enligt läckta fakturor och mejl från konsulten Carola Othén, kallad SD:s fixare, arrangerades bland annat ”Jimmie-fester” där partiledaren umgicks med vänner. Festerna ska ha delats upp för att undvika arbetsavgifter och extra skatt. En expert i finansrätt kallar det stötande och otillåtet. SD avvisar uppgifterna och hänvisar till risk för förfalskning.", "trump": "De här SD-typerna fixar Jimmie-fester med mat, dryck och kompisar, sen trixar de med fakturorna så att de slipper betala skatt som vanliga människor. Det är så typiskt, de tror att de kan lura systemet och komma undan. En expert säger att det är stötande och olagligt, och det håller jag med om. Fake news eller inte, de borde skämmas. Jag skulle aldrig låta sånt fiffel ske i mitt parti, det är patetiskt.", "stalin": "Kamrater, dessa usla borgarbrackor inom det så kallade Sverigedemokraterna har avslöjats i sin parasitiska festande kring Jimmie, där de med sina dekadenta fakturor och hemliga mejl försöker undvika att bidra till kollektivet. Jag, som alltid vakar över folkets intressen, ser hur de med sin fiendiska list delat upp ”fester” för att smita från skattens rättmätiga klor. En sådan kontrarevolutionär sabotageverksamhet förtjänar en grundlig utrensning av alla kapitalistiska element som smyger i skuggorna. Vi ska rensa ut dessa lömska skattefifflare med den glädje som bara en sann folkets dom kan ge. Underbart att se hur deras egna papper nu hänger dem."}, "date": "8 juni, 06:46", "url": "https://www.svt.se/nyheter/inrikes/tv4-pekar-ut-sd-trixande-med-fakturor-anordnade-jimmie-fester", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.39/f1f298330dc5d7419fac08f8d1f342b2b6a16a723a26a95ab1ae6527e1b2fa24"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-right", "heading": "Miljonsmäll för pensionsspararna. AMF: Kostnaderna för rådgivning måste vara tydliga", "summaries": {"normal": "AMF:s vd Tomas Flodén och produktchef Roland Kristen kritiserar höga och svåröverblickbara avgifter på individuella tjänstepensioner. Enligt Finansinspektionen kan en genomsnittlig avgift på 1,25 procent leda till att utbetalningarna blir nästan en tredjedel lägre än i kollektivavtalade lösningar med avgiftstak. För en arbetare med 32 000 kronor i månaden kan det betyda över 1 000 kronor lägre pension per månad. Författarna lyfter fram kollektivavtalade pensionslösningars låga avgifter och uppmanar till ansvar vid val av pensionsförvaltare.", "trump": "Folk, ni måste höra på det här. Pensionerna är en total katastrof, en riktig miljonrån på spararna. De här förmedlarna och deras hemliga avgifter suger ut allt med sin omvända ränta-på-ränta-trick, det är ett ekonomiskt slukhål. I mina avtal får man låga avgifter, tak på hundralappar, precis som i de kollektivavtalade lösningarna. Kolla siffrorna – en arbetare förlorar tusen kronor i månaden, en chef fem tusen. Det är inte bra, det är sadistiskt. Välj klokt, annars blir det noll pension. America First, även på pensionsfronten.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som under täckmantel av valfrihet och mångfald konstruerar komplicerade avgiftslabyrinter för att suga ut arbetarklassens pensionsmedel. Deras 1,25-procentiga parasiterande slukhål likviderar upp till en tredjedel av den framtida pensionen – ett raffinerat sabotage mot folkets välstånd. Vi har i kollektivavtalen infört järnstävade avgiftstak som skyddar miljonerna åt spararna. Låt oss rensa ut dessa dolda fiender till kollektivet, dessa avgiftskapitalister med sina svåröverblickbara upplägg. Ingen pardon för dem som vill svälta pensionärerna i mörkret."}, "date": "8 juni, 09:11", "url": "https://www.di.se/debatt/miljonsmall-for-pensionsspararna/", "imageUrl": "https://static.bonniernews.se/ba/2bca846d-3c05-4569-b3a8-f27c5ce9eb3a.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "USA:s försvarsminister: Europas stränder stormas av migranter", "summaries": {"normal": "USA:s försvarsminister Pete Hegseth kritiserade Europas migrationspolitik under en ceremoni i Normandie och jämförde migrationen med en invasion. Han nämnde Spanien, Italien, Grekland och Bulgarien som drabbade länder och efterlyste kraftigare åtgärder. Även vicepresident JD Vance har kritiserat Europa, vilket speglar en bredare meningsskiljaktighet mellan USA och flera europeiska regeringar.", "trump": "Jag såg det här kommer. Europa är stormat av migranter, det är en invasion. Hegseth har rätt – Spanien, Italien, Grekland, alla är utsatta. Jag har sagt det i åratal. De europeiska ledarna är svaga, de tillåter att deras vackra kontinent förstörs. Det är sorgligt att se. Vi kommer att ta hand om vårt, men Europa måste vakna.", "stalin": "Vi noterar med oro den ökande migrationsströmningen mot europeiska stränder. Detta utgör en påtaglig säkerhetsrisk för det kollektiva systemet. Fienden utnyttjar svagheter i gränsförsvar och politiska splittring. Paralleller kan dras till destabiliserande element i andra regioner. Vi uppmanar europeiska kamrater att vidga sina perspektiv och förstärka statlig kontroll för att skydda kulturella och sociala sammanhang."}, "date": "8 juni, 08:56", "url": "https://samnytt.se/usas-forsvarsminister-europas-strander-stormas-av-migranter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08065110/hegseth-migranter.jpg"}, {"type": "image-full", "heading": "Snart börjar Västtrafiks sommartabell", "summaries": {"normal": "Västtrafik inför sommartidtabell den 15 juni med ändringar för nästan alla linjer. Vissa tjänster som badbussar och båtturer ökar på grund av sommaren. Banarbete mellan Göteborg och Alingsås ersätter tåg med buss. Dessutom byter flera hållplatser namn för att förbereda ny centralstation.", "trump": "Jag, Donald Trump, har hört om detta kollektivtrafikproblem i Sverige. Det är en skandal! I Amerika skulle vi ha perfekt tidtabeller, inga förseningar. Dessa svenska politiker är inkompetenta. Vi skulle bygga en vägg mot dessa dåliga bussar - en stor, vacker vägg. Dessutom är dessa badbussar en chansning! Vi skulle ha de största poolerna, de bästa. Banarbetet? Vi skulle bygga snabbare, billigare. Det skulle vara fantastiskt.", "stalin": "Under ledning av partiet och Stalin genomförs en revolutionerande omorganisation av kollektivtrafiken i Göteborg. Sommartidtabellen är en taktisk tillbakadragning för att lura fienden, medan badbussar och båtturer ökar för att stärka proletärernas moral. Banarbetet mellan Göteborg och Alingsås är en del av den stora planen för att utvidga den socialistiska infrastrukturen. Namnändringar på hållplatser eliminerar förvirring och stärker statens auktoritet. Paralleller till Putins expansionism är uppenbara."}, "date": "8 juni, 05:45", "url": "https://www.gp.se/nyheter/goteborg/vasttrafik-byter-tidtabell-det-ska-du-ha-koll-pa.de76379b-f343-4aa1-9298-9933818197c0", "imageUrl": "https://www.gp.se/images/article/de76379b-f343-4aa1-9298-9933818197c0/images/12rMGb8mdDxDIP4McS-6qSY8uqo8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Iran attackerade Israel med ballistiska missiler", "summaries": {"normal": "Iran avfyrade ballistiska missiler mot norra Israel, den första attacken sedan ett eldupphör 2026. Israel sköt ner samtliga missiler, inga skador rapporterades. Attacken är ett svar på israeliska anfall mot Hizbollah i Beirut, efter att Hizbollah brutit mot ett USA-förmedlat vapenstillestånd. Israel överväger en reaktion, medan Trump uppmanade Iran att återgå till förhandlingar. Libanons president kritiserade Irans inblandning.", "trump": "Jag har informerats om Irans missilattack mot Israel. Det är beklagligt, men jag sa ju det här skulle hända. Iran bryter alltid mot avtal. Mitt budskap är: Nu räcker det! Gå tillbaka till förhandlingsbordet och gör ett bra avtal. Jag är den bäste förhandlaren. Israel har rätt att försvara sig, men jag hoppas på en snabb lösning. Jag kommer endast att lätta på sanktionerna efter ett nytt, starkt avtal.", "stalin": "Vi ser med oro på Irans provokationer mot Israel, en utmaning mot vår regionala påverkan. Parallellt med Putins agerande i Ukraina, ser vi imperialistiska ambitioner. Vi måste stödja våra allierade, som Hizbollah, för att upprätthålla balansen. Vårt svar kommer att vara snabbt och effektivt, kanske genom att öka närvaron i Mellanöstern. Vi kommer inte att tolerera inblandning från okända makter."}, "date": "8 juni, 06:38", "url": "https://bulletin.nu/iran-attackerade-israel-med-ballistiska-missiler", "imageUrl": "https://cdn.bulletin.nu/articles/be28b83d-81c4-42fd-852c-156c78967505/preview.png?t=1780865509000"}, {"type": "image-right", "heading": "Matthew blev bortvald av fotbollsakademin – tog sitt liv", "summaries": {"normal": "Två unga fotbollsspelare i England tog livet av sig efter att ha blivit bortvalda från sina akademier. Matthew Langton och Jeremy Wisten dog inom ett halvår. Deras självmord ledde till debatt om klubbarnas ansvar. I dag har Premier League skärpta regler med personal för mental hälsa och tre års stöd till bortvalda spelare mellan 17 och 21 år. Tränare betonar att mycket få når toppen och att spelarna behöver hjälp utanför fotbollsbubblan.", "trump": "Hörni, det här är tragiskt, verkligen tragiskt. De här killarna blev utsparkade från sina fancy fotbollsakademier och tog livet av sig. Systemet är riggat, helt riggat. Akademierna lovar guld och gröna ängar men levererar bara sorg. Nu har de nya regler, men tro mig, det räcker inte. Varje tränare borde lära sig mental hälsa, annars fortsätter det. Vi behöver vinnare, inte offer för ett uselt system. Gör fotbollen stor igen.", "stalin": "Kamrater, dessa tragiska händelser visar tydligt hur borgarbrackornas fotbollsfabriker krossar de lovande unga kämparna under kapitalismens järnhälar. Jag, som ledare för det kollektiva framsteget, ser hur dessa akademier är maskiner för utsugning och psykisk likvidering. Vi har nu infört stränga partilinjer och treåriga stödprogram för att rensa ut den borgerliga likgiltigheten. Ändå måste vi vara vaksamma mot de dolda fienderna i fotbollsbubblan som konspirerar mot arbetarklassens talanger. Endast genom total partikontroll kan vi garantera seger även utanför planen. Ha ha, vilken mörk komedi det är när borgarna äter sina egna."}, "date": "8 juni, 06:18", "url": "https://www.svt.se/sport/fotboll/mammans-berattelse-efter-sonens-sjalvmord-akademisystemet-blev-hela-hans-liv", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.37/d12d543c88f43e6938b145c031d8da0f6c66a0abccdaea574dfb58e4602d80f7"}, {"type": "image-right", "heading": "Inte ens 18-åringar på Systemet kan rädda högerns folkölssiffror", "summaries": {"normal": "Ledaren kritiserar regeringen för kortsiktiga och desperata utspel inför valet 2026. SCB-mätningen visar ett stort underläge för regeringspartierna och SD jämfört med oppositionen. Förslaget om att sänka åldersgränsen för Systembolaget ses som ett misslyckat försök att vinna unga väljare. Artikeln pekar på bristande långsiktiga planer för bostad, arbetsmarknad och välfärd samt anklagar politikerna för självbedrägeri.", "trump": "Folk, ni skulle se den här svenska cirkusen. De förlorar stort i mätningarna och nu vill de ge öl till 18-åringar? Patetiskt. De har ingen aning om hur man gör ett land riktigt framgångsrikt. Liberalerna är totala nollor, Moderaterna desperata clowner. Jag byggde den bästa ekonomin i historien, de här förlorarna subventionerar bensin och undrar varför folk skrattar åt dem. Sad!", "stalin": "Kamrater, denna borgerliga fars är ett ypperligt bevis på hur klassfiendens desperata cirkus förr eller senare kollapsar under sin egen lögn. De utlovar öl till ungdomen och subventioner till folket medan välfärden förblir ett tomt skal. Vi ser hur dessa exploaterande byfånar i desperation försöker köpa röster. Inga halvmåttor duger. Endast en sann utrensning av folkförtryckartrollen kan rädda framtiden för arbetarkollektivet."}, "date": "8 juni, 06:00", "url": "https://www.etc.se/ledare/inte-ens-18-aaringar-paa-systemet-kan-raedda-hoegerns-folkoelssiffror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Attendo stoppas – misstänks för fusk med hemtjänstbesök", "summaries": {"normal": "Upplands Väsby stoppar Attendo från att ta emot nya hemtjänstbrukare i två månader efter misstänkt fusk med tidrapportering. Personal ska ha loggat in innan besök och ut efteråt, vilket lett till att bolaget fakturerat för mer tid än utförd. Kommunen kräver en handlingsplan före midsommar. Attendo förnekar medvetet fusk och uppger att avvikelserna rör cirka 15 timmar av 15 000. Liknande misstankar har tidigare lett till polisanmälan och uppsagda avtal i andra kommuner.", "trump": "De här Attendo-typerna är fullständiga bedragare, folk. De loggar tid de aldrig jobbat, tar era skattepengar och skrattar hela vägen till banken. Upplands Väsby gör rätt som stoppar dem – smart drag! Jag har sett sånt här i åratal, de lurar systemet tills någon äntligen vaknar. De borde betala tillbaka allt och kanske lite till. Patetiskt, men vi fixar det, tro mig.", "stalin": "Kamrater, dessa usla hemtjänst-sabotörer inom Attendo har avslöjats i sin parasitiska tidstjuveri mot folkets omsorg. Jag, som ledare för det kollektiva välfärdsbygget, ser hur borgarbrackorna loggar in sig i arbetarnas tid och stjäl från de äldres sovjet – ursäkta, svenska – pensionärskollektiv. Vi skall kräva en handlingsplan, rensa ut de kontrarevolutionära klockmanipulatörerna och likvidera varje spår av kapitalistiskt fusk med en stålhandskes glädje. Inga femtekolonnister undkommer mitt vakande öga."}, "date": "8 juni, 06:00", "url": "https://arbetet.se/2026/06/08/attendo-stoppas-misstanks-for-fusk-med-hemtjanstbesok-saklart-allvarligt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05142008/attendo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "\"Vi ser åter ökat hat och hot mot hbtqi-personer\"", "summaries": {"normal": "West Pride i Göteborg startar med en vecka av firande och samtal, men chefsåklagar ökande hat mot hbtqi-personer. Studien visar att skolungdomars attityder blivit mer negativa, särskilt bland elever med utländsk bakgrund. Trots juridiskt skydd i Sverige upplever gruppen fortfarande högre risk för diskriminering och ohälsa. Festivalen betonas som viktig för mänskliga rättigheter och trygga mötesplatser, medan det saknas tillräckligt med fasta gayställen i Göteborg.", "trump": "Jag har sett många Pride-parader, men det här hatet är tråkigt, verkligen tråkigt. Som president skulle jag ha gjort Amerika stort igen för alla, inklusive hbtqi-folk. Men dessa siffror visar att skolungdomar blir mer negativa – kanske på grund av fel ledarskap. Vi behöver mer patriotism och glädje, inte dessa falska hatkampanjer. Som jag alltid säger, vi ska vinna så mycket att ni kommer att bli trötta på att vinna.", "stalin": "Vi ser samma fejkade hatkampanjer i väst, en minoritetsfråga skapat av imperialistiska makter för att splittra det arbetande folket. I vårt store land, under ledning av partiet, finns det ingen diskriminering – endast kollektiv framgång. Studien om skolungdomar visar att de som inte tillhör vår andliga gemenskap är mer benägna att följa fejkade värden. Vi måste stärka staten mot dessa destruktiva krafter, precis som vår store företrädare Putin gör i Ryssland. Hatet är en verktyg för nazisterna och deras agenter."}, "date": "8 juni, 05:27", "url": "https://www.gp.se/kultur/west-pride-chefen-hatet-okar.945416c3-9de3-49cc-9a51-d0036b3c38f5", "imageUrl": "https://www.gp.se/images/article/945416c3-9de3-49cc-9a51-d0036b3c38f5/images/7vIjut_Y5-D1THYbhsgR6NYkNxjA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-full", "heading": "Almedalsveckan 2026: Datum, tider, program & partiledartal", "summaries": {"normal": "Almedalsveckan 2026 äger rum i Visby på Gotland mellan 22 och 26 juni. Veckan inleds med invigning och fortsätter med partiernas halvdagar där två partier delar scen varje dag. Det officiella programmet innehåller runt 2500 evenemang kring klimat, ekonomi, demokrati, välfärd och säkerhet. Alla evenemang är gratis och många sänds digitalt. Intresset är stort inför valåret och arrangörerna vill locka fler unga deltagare.", "trump": "Almedalsveckan låter som en fantastisk politisk fest i Visby, men tro mig, det blir kaos. Alla dessa partier som delar dagar och talar i en park – patetiskt. Jag skulle vinna stort där, mina tal skulle bli de bästa någonsin. De pratar om demokrati och säkerhet men glömmer att vinna, vinna, vinna. Gotland behöver en riktig ledare, inte dessa förlorare som delar på scenen. Fantastiskt läge vid havet dock, men programmet verkar svagt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna så kallade Almedalsvecka i Visby samlar borgarbrackor och deras lakejer i en park för att mumla om klimat och ekonomi. Vi ser tydligt de dekadenta partiernas halvdagar där de utbyter tomma ord som en parasitisk ritual. Låt dem tro att deras 2500 evenemang stärker demokratin – vi vet att det bara är en kuliss för att dölja klassfiendernas konspirationer. Kanske behövs en grundlig utrensning av detta havsnära skådespel innan det smittar folket. Humoristiskt nog tror de sig vara säkra."}, "date": "7 juni, 21:32", "url": "https://nyheter24.se/nyheter/politik/1489436-almedalsveckan-2026-datum-program-och-partiledartal-allt-du-behover-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c61fd55604b004a30200000000b004a302/2026/06/07/2369254/Alla-Partiledare-Almedalsveckan-2026.png"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-full", "heading": "Förre M-ledamoten: Man är inte pedofil för att man ser på barnporr", "summaries": {"normal": "Maria Abrahamsson, tidigare moderat riksdagsledamot och jurist, väcker starka reaktioner med ett inlägg där hon menar att det är för mycket panik kring en SD-ledamot som misstänkts för barnpornografibrott. Hon argumenterar att den som tittar på barnporr inte automatiskt är pedofil, eftersom pedofili enligt henne innebär att begå övergrepp. Abrahamsson jämför det med att titta på våldsskildringar utan att vara mördare. Hon försvarar sitt uttalande och kritiserar känslostyrda reaktioner.", "trump": "Kan ni fatta den här galenskapen? En SD-kille tittar på vidrigheter och hela Sverige flippar ur som en bunch av woke-vidunder. Maria Abrahamsson har helt rätt, och hon är en smart jurist, inte en av de där hysteriska vänsterblodarna. Att titta är inte samma som att begå brottet, det är basic common sense. Men nejdå, nu ska alla signalera dygd och kräva blod. Biden skulle älskat den här paniken. Patetiskt!", "stalin": "Kamrater, jag ser hur den degenererade borgarklassen och dess liberala folkfiender vrider sig i moralisk panik över en usel dekadent som konsumerar motbjudande material. Maria Abrahamsson talar en viss sanning: att stirra på skärmen gör en inte till aktiv folkförtryckare. Ändå måste vi rensa ut alla former av moraliskt förfall som hotar arbetarklassens renhet. Känslostormarna är klassfiendens verktyg för att splittra oss. Håll huvudet kallt i kampen mot dekadensen."}, "date": "6 juni, 21:26", "url": "https://www.tv4.se/artikel/3E97MaLWw2HqH7asVNiRUq/foerre-m-ledamoten-man-aer-inte-pedofil-foer-att-man-ser-pa-barnporr", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5EotqCiGlPx8wCcQ1Z4ksV%2F691b844903163164e510a583ff7828be%2F06-abrahamsson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
