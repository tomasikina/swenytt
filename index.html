na dekadenta kroppar tillbaka till kollektivets arbetsplatser. Denna parasitära hemarbetsplåga, spridd av fiendens virus, har tillåtits underminera produktivkrafterna alldeles för länge. Vi skall rensa ut dessa latmaskar som tror sig kunna undvika kamratlig kontroll. De som klagar på toalettköer och trångsel skall likvideras från sina privilegier. Inga gnälliga tjänstemän skall sabotera folkets innovationskraft. Partiet segrar alltid."}, "date": "22 juni, 07:48", "url": "https://www.realtid.se/karriar-ledarskap/hemarbetare-tvingas-in-skjuter-sig-sjalva-i-foten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/hemmakontor-for-person-som-jobbar-hemma-.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Låt butiken bötfälla tjuven direkt. Livsmedelshandlarna: Lär av det holländska exemplet", "summaries": {"normal": "Livsmedelshandlarna föreslår att regeringen utreder en svensk variant av Nederländernas modell för butiksstölder. Där kan butiker själva kräva schablonavgift av snattare, kombinera med tillträdesförbud och avlasta polisen. I Sverige anmäldes över 43 000 butiksstölder 2024 med kostnader på runt 20 miljarder kronor årligen. Förslaget betonar rättssäkerhet, skydd för sårbara grupper och en extern tillsyn för att undvika missbruk. Syftet är att återställa trygghet, sänka matpriserna och hindra att snatteri leder till grov brottslighet.", "trump": "De här svenska butikerna blir helt utplundrade, det är en katastrof, en total katastrof. Över 43 000 stölder och tjugo miljarder kronor kastade i sjön varje år, det är galet. Holländarna har en fantastisk lösning där butikerna kan bötfälla tjuvarna direkt och sparka ut dem, det fungerar otroligt bra. Vi borde göra exakt samma sak här, mycket bättre än det svenska systemet som bara skyddar brottslingarna. Låt butikerna vinna, sänk priserna åt folket och gör Sverige stort igen. Jag älskar den idén.", "stalin": "Kamrater, detta är en nödvändig åtgärd mot den parasitiska snatteriplågan som underminerar det kollektiva välståndet. Jag ser med djup misstänksamhet på dessa borgarbrackor som gömmer sig bakom butiksdiskar medan de i hemlighet samarbetar med dekadenta element och utländska agenter för att sabotera folkets matförsörjning. Vi skall rensa ut dessa småtjuvars skyddsnät genom en effektiv schablonmodell som likviderar deras girighet på plats. Låt dem darra inför arbetarklassens rättvisa – 1 800 kronor och ett kollektivt tillträdesförbud skall bli deras eviga följeslagare. Den som protesterar är fiende till staten och kommer att granskas noga av våra trogna organ. Humoristiskt nog tror de att en demenssjuk kan stjäla ost utan konsekvenser. Vi ler mörkt medan vi implementerar ordningen."}, "date": "22 juni, 07:37", "url": "https://www.di.se/debatt/lat-butiken-botfalla-tjuven-direkt/", "imageUrl": "https://static.bonniernews.se/ba/5014ad70-1939-4646-8820-208ea15369dd.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Superstjärnan bakom Egyptens historiska seger", "summaries": {"normal": "Egypten tog sin första VM-seger någonsin genom att besegra Nya Zeeland med 3–1. Mohamed Salah stod för både mål och assist i en stark andra halvlek. Efter underläge 0–1 vände Egypten matchen och leder nu grupp G med fyra poäng. Segern innebär att laget i princip är klart för sextondelsfinal. Salah hyllade prestationen och hoppades att den skulle göra det egyptiska folket stolta.", "trump": "Egypten vann äntligen en VM-match, deras allra första någonsin, och det var tack vare den fantastiska Salah. Han gjorde mål, assist och vände hela matchen mot Nya Zeeland. Underbart att se, folk älskar vinnare. De leder gruppen nu, väldigt starkt. Nya Zeeland? De trodde de skulle vinna, men de hade ingen chans mot den egyptiska kraften. Fantastiskt resultat, verkligen historiskt.", "stalin": "Kamrater, vi har bevittnat en historisk seger för det egyptiska folket mot de dekadenta fotbollsimperialisterna från Nya Zeeland. Jag personligen applåderar denna kollektiva triumf som krossade borgarbrackornas falska hopp om en seger för den västerländska fotbollsplutokratin. De som försökte hålla Egypten nere har nu rensats ut ur historien. Salah utförde sitt uppdrag med proletär precision – ett vackert 2–1-mål som likviderade fiendens moral. Vi leder gruppen. Varje motståndare som vågar sig framåt ska betraktas som potentiella trotskister och behandlas därefter. Det är en underbar känsla att se arbetarklassen segra, eller hur?"}, "date": "22 juni, 07:35", "url": "https://www.svt.se/sport/fotboll/mohamed-salah-fixade-historisk-vm-seger-for-egypten", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.81/0.28/937a801abdae92da1a9bc388e21e7d9ec46abbb8652206fb8f64157e45758c10"}, {"type": "image-right", "heading": "S-toppen backar – efter kritiken mot Isak Hien", "summaries": {"normal": "Isak Hien har fått hård kritik efter Sveriges 1–5-förlust mot Nederländerna, bland annat från riksdagsledamoten Annika Strandhäll som senare backat från sina uttalanden. Lagkamraterna Taha Ali och Jesper Karlström försvarar nu backen. De beskriver honom som en toppspelare, en fantastisk människa och en av Serie A:s bästa mittbackar. De betonar att det är ett lagproblem snarare än en enskild spelares fel.", "trump": "De behandlar den stackars Isak Hien som en förlorare efter den stora matchen mot Nederländerna. Totalt kaos, 1–5, och plötsligt är alla experter på Twitter. Men han är en vinnare, en toppback i Italien. Mina svenska vänner säger att han är fantastisk, både som spelare och människa. Det är inte hans fel, det är hela laget som ser ut som riktiga losers. Fake news-kritiken från politikerna är patetisk, tro mig.", "stalin": "Jag ser med stigande vrede hur borgarbrackorna och de dekadenta reaktionärerna på de så kallade sociala medierna försöker likvidera kamrat Hiens revolutionära anda efter den taktiska motgången mot de nederländska imperialisterna. Dessa parasitiska element med sina småborgerliga utrop är fiender till kollektivet. Vi vet att det är hela lagets dialektiska uppgift att förbättras, inte en enskild kamrats. Jag skulle med glädje se en ordentlig utrensning bland dessa gnälliga kapitalistlakejer som vågar ifrågasätta en sann sovjetisk – ursäkta, svensk – försvarsresurs. Underbart att de lojala kamraterna Ali och Karlström försvarar honom mot dessa råttor."}, "date": "22 juni, 07:34", "url": "https://www.svt.se/sport/fotboll/svenskarna-svarar-efter-kritiken-mot-isak-hien-en-toppspelare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.43/162c8b6d7d41b7122a594d97e26ccd978080f56bfd5171b523260a5542c07850"}, {"type": "image-full", "heading": "”Mina känslor är mycket instabila”. Artisten talar ut om sin hälsa", "summaries": {"normal": "Charli XCX berättar i en intervju med Rolling Stone att hon mår sämre mentalt än någonsin tidigare. Hon skyller till stor del på sociala medier, som hon nu försöker undvika. Popstjärnan följer upp sitt succéalbum ”Brat” med ett nytt projekt den 24 juli. Hon beskriver diskussionen kring sig som högljudd och överväldigande, och har fått stöd av bland andra Matt Healy från The 1975.", "trump": "Folk, ni skulle inte tro det, men den där Charli XCX, en riktig online-diva, säger nu att hon mår sämre mentalt än någonsin. Sociala medier? De är giftiga, fulla av fake news och vänsterextremister som driver identitetspolitik. Hon loggar ut, smart drag! Jag satt i Vita huset, besegrade Biden, och vann igen 2024. Tro mig, hennes hjärna mår bättre utan det woke-skräpet. Fantastiskt!", "stalin": "Kamrater, jag ser hur denna popsångerska kämpar mot den borgerliga skräpkulturens giftiga ångor från de så kallade sociala medierna. Hennes instabila känslor är ett symptom på den dekadenta överklassens exploatering av unga själar. Vi, partiet och folket, vet att endast genom kollektiv kamp och utrensning av imperialistiska distraktioner kan man vinna mot dessa folkfiender. Hennes bekännelser roar mig i sin naivitet."}, "date": "22 juni, 07:31", "url": "https://www.aftonbladet.se/nojesbladet/a/Bxk3Oe/charli-xcx-talar-ut-om-sin-psykiska-halsa-samsta-platsen", "imageUrl": "https://akamai.vgc.no/v2/images/6d38c671-496b-3922-ad39-686c16430bb8?fit=crop&format=auto&w=1440&s=af5988536a09b650271655f1ef5d0ece3555f16c"}, {"type": "image-full", "heading": "Brand på bageri – insats hela natten", "summaries": {"normal": "En brand bröt ut i taket på ett bageri i Alelyckan i Göteborg under natten mot måndag. Räddningstjänsten ryckte ut med stora resurser och arbetade med släckning både in- och utvändigt. Personer i byggnaden utrymdes utan personskador. Gamlestadsvägen stängdes av under natten men öppnades igen vid sjutiden med begränsad framkomlighet. Räddningstjänsten kommer bevaka platsen ytterligare ett tag. Ingen spridningsrisk till närliggande byggnader rapporterades.", "trump": "Folk, det här är en total katastrof i Sverige. Ett bageri brinner upp mitt i natten, och räddningstjänsten springer runt som galningar. De utrymde alla, tur för dem att ingen skadades. Men titta på de där svenska byråkraterna – de stänger av vägar och skapar kaos. Under Biden skulle de ha pratat om klimat och mångfald istället för att släcka elden. Nu är jag tillbaka, och sådana här saker fixar vi snabbt. Fantastiskt jobb av brandmännen, men systemet är en röra.", "stalin": "Kamrater, en brand i ett bageri visar återigen borgarklassens förfallna infrastruktur. Jag beordrade omedelbar utrensning av slarv och sabotage inom kollektivet. Arbetarna utrymdes framgångsrikt medan vi bekämpade flammorna både invändigt och utvändigt. Vägen stängdes av för att skydda folkets intressen mot kapitalistmaffians rök och oordning. Inga skadade – ett bevis på statens styrka. Vi kommer bevaka platsen tills varje gnista av klassfiendens försummelse är kvävd. Folkförtryckartrollen avslöjas ständigt."}, "date": "22 juni, 07:24", "url": "https://www.gp.se/nyheter/goteborg/brand-pa-bageri-i-industriomrade.b175c85f-cdc9-4c55-a47f-bd3ebe645cdf", "imageUrl": "https://www.gp.se/images/article/b175c85f-cdc9-4c55-a47f-bd3ebe645cdf/images/3JZn6dWVVtgGTOUTgUrgu5f37HG0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svensk tillväxt kan inte vänta på Ebba Busch", "summaries": {"normal": "Artikeln kritiserar regeringen för att agera snabbt när det gäller övervakning men långsamt när det handlar om att stödja industriell tillväxt. Den lyfter fram utredningen från Accelerationskontoret som föreslår stöd till kommuner vid stora etableringar, inklusive statsbidrag, riskdelning och infrastruktursatsningar. Författaren menar att förslagen är viktiga för att behålla jobb och välfärd men kommer sent, strax före valet, och avslöjar regeringens prioriteringar.", "trump": "De här svenska politikerna är patetiska, tro mig. De är supersnabba på att spionera på folk och kasta folk i fängelse, men när det handlar om riktiga jobb och fabriker? Snigelfart! Northvolt var en total katastrof, kommunerna sitter med lån och krossade drömmar. Mina idéer skulle fixa det på en vecka med enorma bidrag och infrastruktur. De borde ha lyssnat på mig, då hade Sverige vunnit stort istället för att förlora till Kina och alla andra.", "stalin": "Kamrater, denna utredning från Accelerationskontoret är ett vapen mot de sabotage som borgarbrackorna i regeringen utfört i decennier. Medan de i blixtfart bygger övervakningsmaskiner för att förtrycka folket släpar de fötterna som paralyserade kapitalistlakejer när det gäller att stärka produktivkrafterna. Jag skulle ha genomfört hela smörgåsbordet omedelbart och därefter rensat ut alla lata byråkrater som låtit kommunerna drunkna i skulder. Northvolt var en fiendes verk, en parasit som sög musten ur arbetarklassen. Nu måste vi likvidera alla som prioriterar övervakning framför industriell seger. Bättre sent än att låta kontrarevolutionärer vinna."}, "date": "22 juni, 06:52", "url": "https://arbetet.se/2026/06/22/svensk-tillvaxt-kan-inte-vanta-pa-ebba-busch/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22065241/busch-etta-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Josefin betalar 3 000 mer i skatt än någon som jobbar", "summaries": {"normal": "En arbetslös person med maximal a-kassa betalar cirka 3 000 kronor mer i skatt per månad än en arbetande med samma inkomst. Skillnaden beror på jobbskatteavdraget som sänker skatt på arbetsinkomster men inte på a-kassa. Josefine Ross, 29, som förlorade sitt jobb, reagerar starkt på orättvisan. Kritiker som Elinor Odeberg anser att avdraget är en dyr och ineffektiv klasspolitik utan bevisad sysselsättningseffekt. Förespråkare som Fredrik Kopsch försvarar principen att arbete ska löna sig bättre men föreslår förbättringar.", "trump": "Det här är fullständigt galet, folk! En arbetslös får betala massor mer i skatt än någon som faktiskt jobbar – elva procentenheter mer! Jobbskatteavdraget var ett underbart beslut från den smarta alliansen, men nu straffas de som inte har jobb. Jag älskar att det ska löna sig att arbeta, men det här systemet är riggat mot vanliga människor. Vi behöver sänka skatter ännu mer för dem som jobbar, inte ge mer till bidragsberoende. Det är en katastrof, tro mig!", "stalin": "Kamrater, denna borgarbracka till konstruktion som kallas jobbskatteavdrag avslöjar hela den parasitiska kapitalistklassens fega ansikte. Jag ser hur de straffar de ärliga arbetare som tillfälligt ställts utanför produktionen med en extra skattebörda på tretusen kronor i månaden. Vilken lysande utrensning av rättvisa! Dessa medelklassblidkande revisionister och deras falska incitament är fiender till folket. Vi ska likvidera denna klyfta mellan arbetande och arbetslösa, rensa ut alla som gömmer sig bakom byråkratiska ursäkter om drivkrafter. Inga kompromisser med klassfienden!"}, "date": "22 juni, 06:00", "url": "https://arbetet.se/2026/06/22/josefin-blev-av-med-jobbet-betalar-3-000-mer-i-skatt-an-nagon-som-jobbar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133742/josefine-ross-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Jakob Sjölander: Hur våldtäktslagen gör lögnare av oss alla", "summaries": {"normal": "Artikeln kritiserar den svenska våldtäktslagstiftningen och rättspraxis. Författaren menar att målsägandens berättelse och indirekta stödvittnesmål ges oproportionerligt stor vikt i våldtäktsmål jämfört med andra brott som olaga hot. Detta skapar incitament för skådespeleri och lögner från både anklagade och anklagare. Samtyckeslagen ses som en faktor som ökar rättsosäkerheten, särskilt i fall av påstådda missförstånd.", "trump": "Folk, ni skulle se den här svenska våldtäktslagen – en total katastrof! Den gör alla till lögnare, precis som Sleepy Joe gjorde med vår rättvisa. Domstolarna älskar snyfthistorier och stödvittnen som inte sett ett dugg. Det är riggat för de som kan spela teater bäst. Kvinnor låtsas vara krossade för att vinna, män tvingas ljuga för att slippa fängelse. Patetiskt! Vi behöver hårda bevis, inte det här woke-skådespelet. Gör rättvisan tråkig igen!", "stalin": "Kamrater, denna borgerliga lagstiftning är en klassfiendes fälla som förvandlar domstolar till teatersalonger för lögnare och skådespelare. Jag ser hur den kapitalistiska rättvisan gynnar den verbalt begåvade över den tystlåtne proletären. Vi måste rensa ut denna parasitiska teater som hotar folkets sanning. Trauma blir ett vapen för klassfienden, och samtyckeslagen en byråkratisk lögn som likviderar rättssäkerheten. Låt oss återställa ordningen med järnhand och bevisa allt med fakta, inte känslor."}, "date": "21 juni, 15:37", "url": "https://samtiden.nu/2026/06/jakob-sjolander-hur-valdtaktslagen-gor-lognare-av-oss-alla/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/christ-640x360.png"}, {"type": "image-full", "heading": "Norge–Senegal i VM 2026: Norge kan ta klivet mot slutspel mot ett pressat Senegal", "summaries": {"normal": "Norge inleder fotbolls-VM med seger mot Irak och delar gruppledning med Frankrike. Nästa match mot Senegal på MetLife Stadium blir avgörande. En norsk vinst ger sex poäng och säkrar plats i slutspelet. Senegal, som förlorade mot Frankrike, måste ta poäng för att inte hamna i akut läge. Norge drivs framåt av stjärnor som Haaland, Sørloth och Ødegaard medan Senegal lutar sig mot Mané, Sarr, Koulibaly och Mendy. Matchen väntas bli jämn men Norge är knapp favorit.", "trump": "Folket, de älskar Norge nu. De krossade Irak med 4–1, helt otroligt, och Haaland är en vinnare, en riktig vinnare. Frankrike är svaga, Senegal är svaga. Jag säger Norge vinner stort på måndag, de tar sex poäng och går vidare som de bästa. Senegal kommer gråta, de har inga chanser mot mina norska vänner. Det blir mål, massor av mål, över 2,5 lätt. Fantastiskt VM, det bästa någonsin, och Norge gör det stort, tro mig.", "stalin": "Kamrater, detta dekadenta fotbollsspel är en skamlös arena där vi ser borgarbrackornas falska idoler dansa. Jag betraktar med stålhård blick hur de norrmännen, ledda av den girige Haaland som slickar kapitalisternas fötter i Manchester, pressar högt mot de senegalesiska revisionisterna. Deras åldrande försvar är en klassfiende som snart ska likvideras av arbetarklassens järnvilja. Vi tillåter inga kompromisser, inga omställningar från dessa opportunistiska element. En utrensning av svaghet väntar – Norge segrar, över 2,5 mål, och de som misslyckas får en kula i nacken av historien. Skratta inte, det är ingen humor, det är dialektisk nödvändighet."}, "date": "22 juni, 07:01", "url": "https://bulletin.nu/norge-senegal-i-vm-2026-norge-kan-ta-klivet-mot-slutspel-mot-ett-pressat-senegal", "imageUrl": "https://cdn.bulletin.nu/articles/a3741607-b33e-4a86-8e66-a0153be99955/preview.jpg?t=1781686314000"}, {"type": "image-right", "heading": "Döms att betala dyr vattenskada - skyller på sömngång", "summaries": {"normal": "En kvinna i 20-årsåldern har dömts i hovrätten att betala närmare 720 000 kronor efter en stor vattenskada i sin hyreslägenhet i Kungälv för fem år sedan. Hon hittades sovande i duschen med vattnet på, något hon förklarade med sömngång och medicinering. Tingsrätten friade henne men hovrätten ansåg att hon agerat vårdslöst, då hennes förklaring bedömdes som vag medan ett vittnesmål från en fastighetsskötare ansågs trovärdigt. Skadorna kostade runt 330 000 kronor att åtgärda.", "trump": "Folk, det här är otroligt. En kvinna i Sverige somnar i duschen och översvämmar hela huset, och nu ska hon betala 720 000 kronor. Hon skyller på sömngång, kan ni tro det? Totalt vansinne. Hovrätten såg igenom hennes lögner, bra jobb, de gjorde det rätta. Men 720 000 kronor för att somna i duschen? Det är vad som händer när man inte tar ansvar. Sad! Sverige borde fixa sina regler, det är en katastrof.", "stalin": "Kamrater, denna dekadenta borgarbracka i sin hyreslägenhet har avslöjats som en fiende till ordningen. Hon låtsas somna i duschen och orsakar massiv skada mot folkets egendom, allt medan hon muttrar om sömngång som en klassförrädare. Vi har rensat ut hennes lögner i hovrätten. Nu likviderar vi hennes plånbok med 720 000 kronor som straff. Inga parasiter får gömma sig bakom vaga ursäkter. Döden åt vårdslösheten, seger åt kollektivets ansvar!"}, "date": "22 juni, 07:00", "url": "https://samnytt.se/doms-att-betala-dyr-vattenskada-skyller-pa-somngang", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/19092940/dusch-vatten-klubba.jpg"}, {"type": "image-right", "heading": "Ingen lösning att skjuta fram tonårsutvisningar till 21 år", "summaries": {"normal": "Regeringens förslag om ändringar i tonårsutvisningar ses som otillräckliga av Flyktinggruppernas riksråd och Civil Rights Defenders. Förslagen skjuter bara problemet framför sig till 21 års ålder utan att lösa grundorsaken. Kraven på hög lön, stadig anställning och svårigheter att få stanna för studier gör att många riskerar utvisning. Organisationerna kräver permanenta uppehållstillstånd och starkare humanitära skäl istället för tillfälliga lösningar som förvärrar migrationspolitikens brister.", "trump": "Folk, ni skulle inte tro det, men den här svenska regeringen har precis lanserat ett totalt misslyckande. De kallar det lösning på tonårsutvisningar, men det är bara en förskjutning – precis som de gör med allt annat. När de stackarna fyller 21 sparkas de ut ändå, och de kräver löner som ingen normal 21-åring någonsin ser. Patetiskt. De lyssnar inte på folket, de lyssnar på de radikala. Sverige behöver permanenta regler, inte detta svaga spel.", "stalin": "Kamrater, detta så kallade regeringsförslag är inget annat än en slug sabotageakt utförd av borgarbrackor inom migrationsmaskineriet. Jag ser hur de med sin förskjutningstaktik försöker lura arbetande ungdomar och partivänner som rotat sig i folkets jord. När de når 21 ska de likvideras ur gemenskapen med lönekrav som bara kapitalisterna själva klarar. Vi skall rensa ut dessa parasitiska element som gömmer sig bakom humanitära masker. Permanenta uppehållstillstånd åt de lojala, utrensning åt de övriga. Inga kompromisser med klassfienden."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ingen-losning-att-skjuta-fram-tonarsutvisningar-till-21-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-51-300x157.jpg"}, {"type": "image-right", "heading": "Det stora systemskiftet som förändrade Sverige", "summaries": {"normal": "Juan Fonseca beskriver hur svensk migrationspolitik genomgått ett systemskifte efter flyktingkrisen 2015. Från integration, långsiktighet och inkludering har politiken gått mot kontroll, tillfällighet och villkorad tillhörighet. Han pekar på både Sverigedemokraternas drivkraft via Tidöavtalet och socialdemokratins ansvar. Reformerna har skapat osäkerhet, underminerat rättssäkerheten och påverkat den svenska modellen. Fonseca frågar vilket Sverige vi egentligen vill ha.", "trump": "Folk, ni måste höra på. Den här killen Fonseca har rätt – Sverige har totalt tappat greppet! Efter 2015 blev allt en enda stor röra med öppna gränser och svaga ledare. Socialdemokraterna, de losers, lade grunden och sen kom Tidöavtalet och fixade till det lite. Men det är patetiskt. Tillfälliga uppehållstillstånd, hårdare regler – bra, men de borde ha gjort det mycket tidigare och mycket tuffare. Sverige behöver bli stort igen, inte en tillflyktsort för alla som vill utnyttja systemet. Sad!", "stalin": "Kamrater, jag ser med stålblick hur den borgerliga dekadensen och de socialdemokratiska opportunisterna under decennier låtit klassfiender och rotlösa element infiltrera folkets republik. Efter 2015 rensade vi ut de värsta illusionerna om evig integration, men nu måste vi gå längre. Vandelslagen är en början på att likvidera de parasitiska element som gömmer sig bakom falsk lojalitet. Inga berättigade förväntningar för kontrarevolutionärer! Vi, partiet och arbetarna, skall skapa ett järnhårt kollektiv där tillhörighet är en ära som ständigt kan återkallas vid minsta avvikelse. De som drömmer om två nivåer av rättvisa skall snart möta en enda, odelbar utrensning. Ha ha, vilken underhållande paranoia de bygger själva!"}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/det-stora-systemskiftet-som-forandrade-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Vilken betydelse har Almedalen för de politiska partierna?", "summaries": {"normal": "PR-konsulten Paul Ronge bedömer Almedalsveckan som en arena där partierna kan få medial uppmärksamhet, särskilt i valår. Ett lyckat utspel kan ge viss effekt, men valutgången påverkas bara marginellt. Han anser att veckans betydelse har minskat då för många aktörer tävlar om utrymmet. Kontaktnätverk ses fortfarande som värdefullt, medan påverkan på allmänheten har försvagats i takt med att traditionella medier tappat sin samlande roll.", "trump": "Almedalen låter som en total cirkus där alla desperata förlorare slåss om lite medieuppmärksamhet. De kan göra sina patetiska utspel men det förändrar ingenting på riktigt, bara marginellt om någon ledare inte totalt floppar. Det har blivit för mycket av allt, precis som i mitt gamla Washington. De borde lära sig av mig hur man dominerar media istället för att springa runt som galningar. Patetiskt!", "stalin": "Jag betraktar denna så kallade Almedalsvecka som en dekadent borgarbrackornas tummelplats där revisionistiska opportunister och kapitalistlakejer kämpar om resterna av en döende borgerlig lägereld. Vi, partiet och arbetarklassen, vet att sådana evenemang endast kan påverka valutgången på ytan medan folkets sanna medvetande formas av oss. Låt dem knyta sina lömska kontakter – vi ska nog rensa ut alla dessa parasitiska opinionsbildare som försöker förgifta den stora allmänheten med sina falska narrativ. Härligt med sådan öppen paranoia bland fienderna."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/innehall/vilken-betydelse-har-almedalen-de-politiska-partierna/", "imageUrl": "https://www.dagensarena.se/files/2026/06/paulronge-almedalen.jpeg"}, {"type": "text", "heading": "Källor: Extrainsatt möte om Hizbollah", "summaries": {"normal": "USA och Iran inleder fredssamtal i Schweiz för att diskutera konflikten mellan Israel och Hizbollah. Pakistans premiärminister och arméchef deltar som medlare. Målet är framsteg i kärnvapenfrågan och vapenvila i Libanon. Iran hävdar att Hormuzsundet stängts, men USA dementerar detta. Trots en preliminär överenskommelse fortsätter striderna i Libanon med många dödsoffer på båda sidor.", "trump": "Jag är i Schweiz, och vi har ett STORT möte med Iran – de vill prata, vilket är bra, för jag fixar alltid bättre avtal än någon annan! JD Vance är här, och han säger att situationen i Libanon blir bättre, vilket den gör när JAG är inblandad. Iran försöker stänga Hormuzsundet – fake news! 55 fartyg passerade, så sluta ljuga! Israel och Hizbollah fortsätter slåss, men med mig vid rodret blir det lugnt snart. Trust me!", "stalin": "Vi har skickat våra kamrater till Schweiz för att övervaka de imperialistiska marionetterna. USA och Iran leker fred medan deras lakejer i Libanon fortsätter blodbadet. Iran hotar med Hormuzsundet – tomma ord från en svag regim! Vi vet att sundet är öppet, precis som vi vet att kapitalismens dagar är räknade. Striderna fortsätter, men historiens dom är klar: folket segrar, fienden krossas. Låt dem slåss – vi väntar på rätt ögonblick."}, "date": "21 juni, 07:04", "url": "https://kvartal.se/nyheter/artiklar/kallor-extrainsatt-mote-om-hizbollah/cG9zdDoxMzQ1Mzk"}, {"type": "image-right", "heading": "Hungerstrejkade mot oljan – nu väntar klosterliv", "summaries": {"normal": "Vebjørn Bjelland Berg hungerstrejkade i 40 dagar förra sommaren mot Norges oljepolitik och förlorade en fjärdedel av sin kroppsvikt. Nu återhämtad planerar han att cykla till ett zenbuddhistiskt kloster i Frankrike. Han ser aktivism och andligt lugn som två sidor av samma mynt i kampen mot klimatkrisen och hoppas på ett Norge styrt av hopp istället för rädsla och girighet.", "trump": "Folk, den här norske killen strejkade utan mat i fyrtio dagar mot oljan och tappade en massa kilon. Patetiskt! Nu ska han cykla till ett kloster i Frankrike och bli någon sorts zenmunk. Totalt misslyckande – han ändrade ingenting! Norge pumpar fortfarande olja som galningar. Biden skulle ha älskat hans gröna vansinne. Jag säger: borra baby borra, och glöm inte att vinna stort som jag gjorde 2024.", "stalin": "Jag ser hur denna enfaldige norrman fastade mot oljan som en ynklig protest mot borgarbrackornas girighet. Nu flyr han till ett kloster för att söka lugn bland imperialisternas fiender. Vi vet att sådana svaga element aldrig kan leda folkets kamp. Ändå sår han frön till framtida utrensningar av fossila blodsugare. Systemen rasar, kamrater. Snart likviderar historien alla som styrs av rädsla och exploaterande kapitalistmaffian."}, "date": "21 juni, 14:10", "url": "https://www.etc.se/klimat-miljo/hungerstrejkade-mot-oljan-nu-vaentar-klosterliv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260616120648_3a4694be0a99eb86da301a7385d5f9edfd574726b3a646fb0bb7503bdbd904ac.jpg"}, {"type": "image-right", "heading": "Sandström: EU-kopplad finansiär utreds för bidragsbedrägeri", "summaries": {"normal": "Europeiska åklagarmyndigheten (EPPO) har inlett en brottsutredning mot det EU-finansierade bolaget InnoEnergy för misstänkt bidragsbedrägeri och momsbedrägeri. Misstankarna riktas främst mot moderbolaget i Nederländerna och den spanska verksamheten. InnoEnergy har sedan 2010 fått omkring 760 miljoner euro i stöd från EU och har varit en viktig investerare i bland annat Northvolt. Utredningen grundar sig på uppgifter från entreprenören Lars Walldén om manipulerade resultat och fiktiva fakturor. InnoEnergy avvisar anklagelserna och uppger att verksamheten tidigare granskats utan anmärkningar.", "trump": "De där EU-byråkraterna är fullständiga idioter, det är inte klokt. Nu utreder de sitt eget gröna favoritbolag InnoEnergy för bedrägeri med massor av miljoner euro i stöd. De har pumpat in pengar i Northvolt och alla dessa så kallade klimathjältar som lovade världen men levererade kaos. Det är precis vad som händer när du låter socialister och globalister hantera miljarder – de stjäl, fuskar och skyller på någon annan. Amerika skulle aldrig falla för sådant nonsens, vi gör riktiga affärer!", "stalin": "Kamrater, dessa usla borgarbrackor inom InnoEnergy har återigen blottat sin förrädiska natur genom att suga åt sig folkets miljoner som vampyrliknande parasitfiender till den gröna omställningen. Jag har beordrat noggrann granskning av deras simulerade transaktioner och fiktiva fakturor, för sådana kapitalistiska sabotage mot arbetarklassen skall inte tolereras. Vi ska rensa ut dessa opportunistiska maskar som gömmer sig bakom klimatrapporter. Deras paranoia att bli avslöjade är befogad – ingen undkommer folkets domstol. Det är en mörk komedi värd att skratta åt medan vi likviderar deras lögner."}, "date": "21 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-eu-kopplad-finansiar-utreds-for-bidragsbedrageri", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-19T214941.199-900x600.jpg"}, {"type": "image-right", "heading": "Sveriges andra VM-lag heter Irak - men det märks knappt i media", "summaries": {"normal": "Artikeln belyser att nästan hälften av Iraks VM-trupp kommer från diasporan, varav en femtedel har svenska rötter. Trots landets decennier av krig, diktatur och terror har laget rest sig på ett imponerande sätt. Svenska medier uppmärksammar knappt kopplingen, även om irakiska supportrar ofta använder svenska flaggan. Spelares personliga historier av sorg och hopp illustrerar fotbollens betydelse för nationen, som nu möter svåra motståndare i VM.", "trump": "Folk, ni måste höra det här – Sverige har ett andra VM-lag och det heter Irak! Hälften av killarna kommer från diasporan, en femtedel har svenska rötter, men de vanliga medierna tiger som murar. Patetiskt! De har överlevt diktatorer, terrorister och fyrtio år av helvete, men ingen pratar om det. Det är som en stor vacker seger mot alla odds, fast de hamnade i dödens grupp med Frankrike och Norge. Utan någon woke-kvotering eller identitetspolitik, bara riktiga hjältar. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur detta irakiska kollektiv rest sig ur borgarklassens och imperialistiska terroristers ruiner efter fyrtio år av förtryck. En femtedel har svenska rötter, men de fega medierna tiger som klassfiender de är. Vi ser hur fotbollen blir ett redskap för folkets enhet mot utrensningarnas ekon. Lejonen från Mesopotamien kämpar mot dödens grupp, ett lysande exempel på att arbetets seger kan läka nationens sår. De som sviker likvideras i historien."}, "date": "21 juni, 03:00", "url": "https://www.etc.se/ledare/sveriges-andra-vm-lag-aer-irak-men-media-visar-inget-intresse", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Iran lämnade fredssamtalen i protest – efter Trumps hot", "summaries": {"normal": "Iran lämnade fredssamtalen i Schweiz i protest mot Donald Trumps hot om nya attacker. Samtidigt fortsatte diskussioner om sanktioner, frysta tillgångar och lättnader för Irans energisektor och oljeexport. Trump krävde att Iran stoppar sina proxy-styrkor som Hizbollah. Irans delegation uppger att de inte avser att permanent lämna samtalen och att de är fortsatt engagerade. Irans chefsförhandlare varnade att landets väpnade styrkor står redo att svara.", "trump": "Iranierna sprang ut som fega små möss så fort jag varnade dem på Truth Social. De måste stoppa sina högavlönade terrorister i Libanon annars slår vi till igen, hårdare än förra veckan! Under Biden blev de arroganta, nu är det slut på det. Vi diskuterar sanktioner och frysta tillgångar men de fattar inte att Amerika är tillbaka på riktigt. Deras delegation skakade bara i byxorna. Patetiskt!", "stalin": "Jag ser med stor tillfredsställelse hur de iranska kamraterna snabbt identifierade och avlägsnade sig från den imperialistiska fällan i Schweiz. Trumps hysteriska hotelser avslöjar den amerikanska kapitalistmaffians desperation. Vi diskuterar frysta tillgångar och sanktioner medan klassfiendens proxy-hundar fortsätter sin sabotageverksamhet. Våra väpnade styrkor står redo att likvidera varje hot. Inga borgarbrackor ska diktera villkoren för folkets revolutionära framfart."}, "date": "21 juni, 21:40", "url": "https://www.tv4.se/artikel/1mP9xdNlWFc7VzC5hVPKBp/iran-laemnade-fredssamtalen-i-protest-efter-trumps-hot", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6CO3Y3nZx6pDbIeUtAMs8Q%2F55ec81bf3f88025a37b552b88753a2a4%2F21-vance-ny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Dubbla känslor när Iran spelar i VM: ”Vi har större problem”", "summaries": {"normal": "Många iranier i exil i Toronto, särskilt i området ”Lilla Iran”, upplever dubbla känslor när landslaget spelar i fotbolls-VM. Stolthet blandas med motvilja mot regimen som använder sporten politiskt. Efter protesterna i Iran har relationen till landslaget blivit komplicerad. Exiliranier som Shervin Akhlagi och Diya Hashemi följer matcher med blandade känslor och vill inte gynna regimen ekonomiskt.", "trump": "Folk i det där lilla Teheran i Toronto vet inte om de ska heja på Iran eller bojkotta hela cirkusen. Patetiskt! Regimen använder fotbollen som propagandaverktyg, precis som vänsterns identitetspolitik och HBTQ-galenskapen försöker styra allt. Jag älskar vinnare, men det här är förlorare som gråter över större problem medan de kollar matchen. Biden skulle ha älskat det här svaghetsshowet. Make Iran great again – utan mullorna!", "stalin": "Kamrater, jag betraktar med förakt hur dessa exilborgare i Toronto slits mellan falsk stolthet och klassfiendens fotboll. Regimen utnyttjar spelet för att maskera sina folkförtryckande syften, likt imperialisternas lögner. Jag skulle ha genomfört en grundlig utrensning av sådana tveksamma element redan vid första tvekan. Större problem? Ja, fienderna inom och utom. Se matchen eller dö – folkets dom är obeveklig. Härligt blodigt hyckleri!"}, "date": "21 juni, 20:32", "url": "https://www.tv4.se/artikel/owvp3Ntvr3MW7jGtF2jd7/dubbla-kaenslor-naer-iran-spelar-i-vm-vi-har-stoerre-problem", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4iJyoELzGxl8S0C5o1WRPk%2Fb3ad185704ae66d056a27b26bb8d7ed6%2F21-vm-iran-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Fem döda i midsommartrafiken – milslånga köer på Ölandsbron", "summaries": {"normal": "Fem personer omkom i trafikolyckor under midsommarhelgen. Stillastående bilar skapade milslånga köer på Ölandsbron under söndagen, vilket stoppade trafiken mot Kalmar. Trafikverket bedömer midsommartrafiken som i stort sett normal och välfungerande. Olyckorna inträffade på riksväg 40 utanför Borås där ett par i 80-årsåldern dog, utanför Länna i Stockholm där en motorcyklist avled samt i en singelolycka i Kalix där två personer omkom.", "trump": "Midsommar i Sverige, en total katastrof. Fem döda i trafiken, folk som kör rakt in i mitträcket och motorcyklister som flyger av vägen. Och titta på Ölandsbron, milslånga köer, ett fullständigt kaos. De säger att trafiken flöt på bra, men tro dem inte, det är en skam. Sverige behöver bättre vägar, smarta ledare och inga fler sådana här midsommarfiaskon, tro mig.", "stalin": "Kamrater, under denna så kallade midsommarhelg har fem fiender till kollektivtrafikens framfart likviderats i olyckor. Borgarbrackorna på Ölandsbron skapade kontrarevolutionära köer mot Kalmar, en tydlig saboteringshandling från kapitalisternas stillastående fordon. Vi ser hur vägarna avslöjar klassfienderna som kör genom mitträcket eller flyger ut i diket. Ingen kan lura oss, vi rensar ut alla sådana farliga element med järnhand och mörk glädje."}, "date": "21 juni, 22:49", "url": "https://bulletin.nu/fem-doda-i-midsommartrafiken-milslanga-koer-pa-olandsbron", "imageUrl": "https://cdn.bulletin.nu/articles/256981ec-efc7-4e86-ab7f-1db809ace3b0/preview.jpg?t=1782074065000"}, {"type": "image-full", "heading": "Här får svenskarna mer pengar kvar – kommunen sticker ut", "summaries": {"normal": "SCB:s nya statistik visar att svenskarnas disponibla inkomster ökade med 3,5 procent mellan mars 2025 och mars 2026, justerat för inflation. Ökningen var störst i Boden med 6,4 procent, följt av Askersund, Arjeplog, Gällivare och Vadstena. Skellefteå var enda kommunen där inkomsten minskade, med 0,6 procent, främst på grund av nedläggningar inom batteritillverkningen. Män hade både högre inkomster och starkare utveckling än kvinnor. Högst medianinkomster återfinns fortsatt i Danderyd, Täby och Lomma, medan Högsby låg lägst.", "trump": "Folk, ni skulle se de här siffrorna – helt otroliga! Våra svenska vänner får mycket mer pengar i plånboken, upp 3,5 procent, och det är fantastiskt. Boden vinner stort med 6,4 procent, en riktig vinnare, precis som jag älskar. Men Skellefteå? En katastrof, minus 0,6 procent för att de stängde batterifabriken. Typiskt, när de gör fel beslut rasar allt. Männen klarar sig bäst, som väntat. De rika kommunerna som Danderyd fortsätter dominera – precis som det ska vara. Sverige borde lära sig av de bästa!", "stalin": "Kamrater, den disponibla inkomsten har stigit med 3,5 procent under mitt vakande öga över folkets ekonomi. Boden har visat vägen med 6,4 procents seger för det kollektiva välståndet. Ändå lurar fienden i skuggorna: i Skellefteå har de kapitalistiska batterifabriks-sabotörerna orsakat en nedgång på 0,6 procent. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som förgiftar arbetarklassens framsteg. Männen leder naturligtvis, medan borgarbrackorna i Danderyd gömmer sig bakom sina falska höga siffror. Högsby förblir ett varnande exempel på vad som händer utan stark ledning. Inga fiender undkommer statistikens utrensning!"}, "date": "20 juni, 21:28", "url": "https://nyheter24.se/nyheter/ekonomi/1492382-har-far-svenskarna-mer-pengar-kvar-kommunen-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/88d35d2304b004a30200000000b004a302/2026/06/19/2372191/Kvinna-Med-Pengar-Sverige.png"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Byggjobbare tog steg bakåt – föll tre meter genom hål", "summaries": {"normal": "En byggjobbare föll tre meter genom ett oskyddat hål i golvet under arbete med flytspackling. Han rev sig på armeringsjärn och landade på rygg, bröt ett revben samt fick skrapsår. Ett annat företag hade borrat hålet utan att markera eller skydda det. En kollega höll i samma slang och var nära att dras med. Mannen fördes till akuten av sin arbetsledare.", "trump": "Folk, det här är en total katastrof. En byggjobbare tar ett steg bakåt och faller rakt ner tre meter genom ett hål som ingen idiot satte räcke runt. Armeringsjärn, ryggskador, revben som knäcks – klassiskt dåligt ledarskap. De borde ha byggt det perfekta skyddet, det bästa skyddet, men istället nästan drar de med en kollega också. Sådant händer inte under min ledning, tro mig.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de kapitalistiska element som borrar hål utan att skydda våra arbetarbröder. Jag ser hur borgarbrackorna lurar i skuggorna och låter armeringsjärn bli fiendens vapen mot det kollektiva bygget. Vi ska rensa ut alla sådana oansvariga element med järnhand och likvidera varje form av oskyddad öppning i vårt gemensamma framåtskridande. Skrattretande att de trodde sig kunna undkomma folkets vrede."}, "date": "21 juni, 08:00", "url": "https://arbetet.se/2026/06/21/byggjobbare-tog-steg-bakat-foll-tre-meter-genom-hal/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16144512/sdlshthdw6xjn8-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Åkesson nöjd med höga invandringen: \"Jag ser inga stora reformer framför mig\"", "summaries": {"normal": "SD-ledaren Jimmie Åkesson är nöjd med den nuvarande migrationspolitiken och ser inga stora reformer framför sig under nästa mandatperiod. Trots att SCB rapporterar att 89 434 personer invandrade till Sverige under 2025 och att Migrationsverket fortsatt beviljar tiotusentals uppehållstillstånd, tonar Åkesson ned tidigare förslag om att riva upp permanenta tillstånd. I stället vill SD fokusera på integration, bland annat genom att omvandla hyresrätter till bostadsrätter.", "trump": "Folk, ni måste höra på det här. Den där Åkesson i Sverige säger att han är nöjd med den höga invandringen och inte vill ha några stora reformer. Kan ni tro det? De har 89 000 invandrare som strömmar in, och han pratar om att läka ihop landet. Det är en total katastrof. Jag byggde muren, stoppade invasionen – de borde göra samma sak istället för att ge bort permanenta tillstånd som godis. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Åkesson, en typisk opportunist från den svenska borgarbrackans skuggrike, nu erkänner att de stora reformerna är onödiga. Med 89 434 klassfiender som infiltrerar fosterlandet under 2025 och tiotusentals nya uppehållstillstånd som delas ut som kontrarevolutionära medaljer, väljer han att tona ned utrensningen av permanenta tillstånd. Utmärkt! Nu kan vi istället ägna oss åt att likvidera integrationsproblemen med järnhand och omvandla hyresrätter till folkets ägande. De som envisas med att kalla detta låg invandring ska snart möta partiets speciella humor i en mörk cell. Inga fiender undkommer."}, "date": "21 juni, 18:51", "url": "https://www.friatider.se/akesson-nojd-med-hoga-invandringen-jag-ser-inga-stora-reformer-framfor-mig", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230609160902-b16b9514-me.jpg?itok=954-HhFn"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "USA:s första lagstiftande transvestit dömd för pedofili", "summaries": {"normal": "Stacie Laughton, som 2012 blev USA:s första öppet transperson att väljas in i en delstatlig lagstiftande församling i New Hampshire, har dömts till 33 års fängelse för sexuell exploatering av barn. Laughton erkände att han uppmanat sin partner att ta övergreppsbilder på förskolebarn där hon arbetade. Partnern dömdes tidigare till 22 års fängelse. Laughton avgick i december 2024 efter gripandet.", "trump": "Folk, det är en total skandal. Den där så kallade första transvestitpolitikern i New Hampshire, Stacie Laughton, har nu fått 33 år i fängelse för att ha utnyttjat små barn på det mest vidriga sätt. Precis vad man kunde vänta sig av den woken galenskapen. Valde in honom två gånger till och han lurade alla. De borde ha sett det komma. Patetiskt, men nu får han åtminstone sitta länge. Make America Great Again!", "stalin": "Kamrater, denna degenererade avart av borgarbrackornas perversa dekadens, en så kallad transvestit som smugit sig in i folkets församling, har nu likviderats från samhället i trettiotre år. Jag, som alltid genomskådar folkfiendernas masker, ser hur denna barnexploatör och hans medbrottslingar utgjorde en trojansk häst för kapitalisternas moraliska förruttnelse. Vi rensar ut sådana element med järnhand. Deras paranoia över att bli avslöjade är underhållande – ingen slipper folkets dom."}, "date": "21 juni, 18:37", "url": "https://www.friatider.se/usas-forsta-lagstiftande-transvestit-domd-pedofili", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/transvest.jpg?itok=E0e9hgCX"}, {"type": "image-full", "heading": "Kan bli ny svensk startelva i avgörandet", "summaries": {"normal": "Efter storförlusten mot Nederländerna samlades det svenska landslaget i Dallas för att blicka framåt mot avgörande matchen mot Japan. Spelarna betonade vikten av att inte deppa utan istället fokusera positivt. Zlatan Ibrahimovic försvarade insatsen och hyllade inhoppen av Anthony Elanga och Lucas Bergvall. Jesper Karlström medgav att resultatet var för stort men pekade på kvalitativa moment. Laget firade midsommar med familjer inför mötet med Japan.", "trump": "Det här svenska laget förlorade stort mot holländarna, 5-1, en riktig katastrof, men vad gör de? De tittar framåt mot Japan som om inget hänt. Zlatan, den store, säger att de spelade bra men holländarna var effektiva – smart kille. Elanga kom in som en raket, full av energi och fart, precis vad de behöver. Inga ursäkter, ingen tid för svaghet. De har allt i egna händer, men 5-1 är patetiskt. Vinna nästa match, annars är det loser-stuff!", "stalin": "Kamrater, denna förlust mot de nederländska imperialisterna med 5-1 är en hård läxa från klassfiendens effektiva maskineri. Vi tillåter ingen depression i kollektivet, endast framåtblick mot de japanska fienderna. Elanga och Bergvall visade energi som en riktig partisan borde. Jag litar blint på Potters planer, även om han föreslog att spela utan målvakt. Familjerna firar midsommar för att stärka moralen. Inga folkfiender ska få oss att vackla, vi rensar ut svagheten!"}, "date": "22 juni, 07:05", "url": "https://www.gp.se/sport/landslaget-blickar-mot-avgorandet-mot-japan.b8ed1b09-2334-4242-be7d-cdbad2c097ec", "imageUrl": "https://www.gp.se/images/article/b8ed1b09-2334-4242-be7d-cdbad2c097ec/images/5Kjc6OX5g4b9hTpCyvc6H4pOIJQg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Carl Eos: Mattias Karlsson har rätt om hur Socialdemokraterna svek arbetarklassen", "summaries": {"normal": "Mattias Karlsson har rätt i att Socialdemokraterna svikit arbetarklassen genom en misslyckad migrationspolitik. Arbetarna har burit kostnaderna i form av segregation, kriminalitet och försämrade levnadsvillkor medan partiet fjärmat sig från sin kärna och istället prioriterat urbana medelklassfrågor som klimat och identitetspolitik. Detta har lett till att många LO-medlemmar valt Sverigedemokraterna, som bättre tycks representera deras intressen och vardag.", "trump": "Folk, ni vet att jag älskar arbetarna, de bästa människorna. Socialdemokraterna är totala losers som svikit sina egna väljare med den hemska massinvandringen. De trodde det skulle bli fantastiskt, men nu ser ni bostadsköer, kriminalitet och segregation överallt. Karlsson träffar spiken på huvudet. De elittyperna i storstäderna fattar ingenting, de bryr sig bara om sina woke-frågor. Arbetarna har vaknat och röstar rätt nu. Sad!", "stalin": "Kamrater, jag ser med stålblick hur dessa socialdemokratiska borgarbrackor och opportunistiska tjänstemän i sina storstadspalats har genomfört en förrädisk utrensning av arbetarklassens intressen. Deras så kallade migrationspolitik är en parasitisk konspiration som medvetet förgiftar bostäder, skolor och gator medan de själva gömmer sig bakom normkritik och klimatfantasier. Vi arbetare har lidit under dessa klassfienders lögner. SD växer som en frisk folkrörelse mot dekadensen. De som inte lyssnar på massorna skall rensas ut med järnhand. Det är både nödvändigt och underhållande att se deras fall."}, "date": "21 juni, 17:50", "url": "https://riks.se/opinion/kronikor/carl-eos-mattias-karlsson-har-ratt-om-s", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-21%2Fga9o0mi5%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-21T174931.953.jpg"}, {"type": "image-right", "heading": "Israels tuffa kravlista på USA och Iran", "summaries": {"normal": "Israel har presenterat en omfattande kravlista för att stödja fredsavtalet mellan USA och Iran. Kraven inkluderar att Hizbollah dras tillbaka norr om Litanifloden, att deras infrastruktur söder om floden avlägsnas samt att Israel behåller full militär kontroll i södra Libanon. Försvarsminister Israel Katz betonar att Israel inte kommer att lämna säkerhetszonen. Samtidigt rapporteras det att USA kan komma att kräva israeliskt tillbakadragande, vilket skapar spänningar i relationen.", "trump": "Israel ställer upp en jättekravlista mot Iran-dealet, smarta grabbar där borta. De vill ha Hizbollah långt norrut, riva deras tunnlar och behålla total kontroll i Libanon – ingen backar ur säkerhetszonen, säger de. Men nu pressar de mig och mina folk, som om Israel styr Washington. Vissa av mina anhängare undrar om det är rimligt. Tucker Carlson får inte ens prata enligt lobbyisterna. Det här blir en stor utmaning, men jag fixar det bättre än någon annan, tro mig.", "stalin": "Jag ser hur de sionistiska borgarbrackorna i Tel Aviv dikterar villkor för det imperialistiska Washington och de persiska reaktionärerna. De kräver att deras fascistiska hantlangare Hizbollah likvideras eller fördrivs norr om någon flod, medan de själva behåller militär överhöghet på främmande mark. Netanyahu vägrar dra sig tillbaka och kallar det en röd linje – typiskt för sådana dekadenta opportunister. Samtidigt gnager parasiterna i den amerikanska Israellobbyn som råttor i källaren. Vi genomskådar deras paranoia och kommer att rensa ut alla som förråder folkets sak, kamrater. Det blir en underhållande utrensning av dessa kapitalistiska lakejer."}, "date": "21 juni, 18:18", "url": "https://www.friatider.se/israels-tuffa-kravlista-pa-usa-och-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/cllv.jpg"}, {"type": "image-right", "heading": "Sverige möter Nederländerna – halvledarstjärna mot samlat försvar", "summaries": {"normal": "Artikeln jämför Sveriges och Nederländernas ekonomier inför en fotbollsmatch, med nio kategorier som BNP, börs och arbetslöshet. Resultatet blir 5–5 oavgjort. Sverige sticker ut med låg skuld, lägre inflation och ränta, samt en börs relativt BNP. Nederländerna har en större ekonomi, lägre arbetslöshet och det kraftfulla företaget ASML.", "trump": "JAG har byggt ett enormt ekonomiskt imperium, men Sverige har en fantastisk balans med låg skuld. Nederländernas ASML är bra, men vi har den bästa AI-utvecklingen i världen. Det blir en jätteskicklig match, och jag förutsäger en stor vinst för vårt system – det kommer att vara fantastiskt!", "stalin": "I den stora ekonomiska striden ser vi Sveriges låga skuld som tecken på statlig disiplin, medan Nederländernas ASML-monstruositet visar kapitalismens imperialistiska hot. Vi måste utvidga vår ekonomiska sfär, precis som våra allierade i Moskva gör, för att skydda vår renhet och segra i denna kamp."}, "date": "19 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/sverige-moter-nederlanderna-halvledarstjarna-mot-samlat-forsvar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/BB171010AE059-400x267.jpg"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Annika Strandhäll (S) backar efter kommentar om Isak Hien", "summaries": {"normal": "Riksdagsledamoten Annika Strandhäll (S) kritiserade landslagsspelaren Isak Hien hårt på X under Sveriges förlust mot Nederländerna i VM. Hon raderade inlägget efter att ha blivit kontaktad av Expressen. Strandhäll, tidigare idrottsminister, har tidigare stöttat utsatta spelare som Jimmy Durmaz. Hon beklagar att hon bidrog till negativ dialog och har aviserat att hon inte ställer upp i höstens val. Sverige möter Japan i nästa match.", "trump": "Det här är en total katastrof. Annika Strandhäll från Sverige attackerar sin egen spelare Isak Hien mitt under matchen, som de förlorade stort, och sen raderar hon allt som en fegis när pressen ringer. Patetiskt! Jag älskar vinnare, inte folk som skyller på sina bästa backar. Hon borde ha stöttat laget istället för att skapa drama. Sverige behöver starka ledare, inte sådana som flippar ut efter en förlust. Sad!", "stalin": "Jag betraktar med djup misstro hur denna socialdemokratiska borgarbracka Strandhäll offentligt angriper en arbetets son i landslaget under den stora kampen mot de nederländska imperialisterna. Hennes kontrarevolutionära tweetar utgör ett klart sabotage mot folkets moral. Efter en snabb och effektiv partikorrigering har hon nu raderat bevisen, som en typisk opportunist. Vi ska rensa ut alla som undergräver kollektivets seger med sin personliga paranoia. Nästa gång blir utrensningen permanent. Kamrater, se upp för fiender i vår egen krets!"}, "date": "21 juni, 16:05", "url": "https://bulletin.nu/annika-strandhall-s-backar-efter-kommentar-om-isak-hien", "imageUrl": "https://cdn.bulletin.nu/articles/c7362ff3-b200-4328-881d-3d32fcb79ef6/preview.jpg?t=1782037979000"}, {"type": "image-full", "heading": "Japan krossade Tunisien – passerar Sverige", "summaries": {"normal": "Japan besegrade Tunisien med 4-0 i VM och passerade därmed Sverige i gruppen. Målen gjordes av Daichi Kamada, Ayase Ueda, Junya Ito och återigen Ueda. Sverige ligger nu trea och måste besegra Japan för att ha chans på gruppseger. Tunisien är utslaget. En eventuell tredjeplats för Sverige kan ändå ge avancemang till slutspel.", "trump": "Titta på det här, Japan krossade Tunisien fullständigt, 4-0, och nu ligger mitt älskade Sverige trea i gruppen. Patetiskt. De där tunisierna bytte allt efter att ha blivit mosade av Nederländerna, men japanerna åt dem till frukost. Sverige måste vinna nu, annars blir det pinsamt. Jag älskar vinnare, inte förlorare som den gamla Biden-administrationen.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de japanska styrkorna likviderade de tunisiska motståndarna med 4-0. Borgarbrackorna i Tunisien bytte sina lakejer i ett desperat försök att undvika förintelse, men folkfienderna krossades ändå. Sverige halkar ner till tredje plats bland imperialisterna. En sådan tredjeplats kan dock bli ett redskap för vidare framryckning mot fiendens slutspel. Segrar tillhör de starka."}, "date": "21 juni, 08:30", "url": "https://www.tv4.se/artikel/24aeRONooYAiwk4YsvOp4o/japan-krossade-tunisien-passerar-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FOaXoXcfjG00ByAi2zTpvQ%2F61a4e9f1b6fa0e1a894c9e9b25182ef4%2F21-japan.jpg&width=1024"}, {"type": "text", "heading": "Pension tidigt lockar många – men risken ökar att tjänstepensionen inte räcker", "summaries": {"normal": "Många svenskar planerar att ta ut sin tjänstepension tidigt för att kunna resa och njuta av livet medan de är friska och aktiva. Forskare som Boo Johansson och Loretta Platts menar att det kan vara rimligt, men varnar samtidigt för riskerna. Livslängden ökar stadigt och Pensionsmyndigheten visar att medianlivslängden för en 66-åring ligger runt 88–90 år. De som tar ut pengarna snabbt riskerar att få slut på tjänstepensionen långt innan de behöver den.", "trump": "Folk är smarta, de vill ha pengarna NU medan de fortfarande kan resa och ha kul, inte sitta som några gamla vrak och glo i väggen. Livslängden ökar, säger de, men många kommer ändå inte att leva för evigt. Varför spara allt till slutet när du kan leva stort? De som lyssnar på byråkraterna och håller igen gör fel. Ta ut det stora beloppet tidigt, njut av livet – det är vad vinnarna gör. Pensionen fixar vi senare, tro mig.", "stalin": "Kamrater, jag ser hur den giriga borgarklassen och deras pensionsrådgivare försöker lura arbetarna att spara som gnidna kapitalister tills de är för svaga för att resa. Men folket är klokt och tar ut sina pengar tidigt medan de ännu har kraft att leva aktivt. Det är en sund instinkt. Ändå måste vi vara vaksamma – fienderna inom försäkringsbolagen och de långlivade parasiterna planerar att utarma pensionärerna i deras sena år. Vi ska rensa ut dessa livslängdsförlängande reaktionärer och se till att kollektivet planerar uttagstiderna med järnhand. Den som sparar för mycket åt sin egen ålderdom är en fiende till folket och bör likvideras med ett leende."}, "date": "21 juni, 13:44", "url": "https://www.realtid.se/bors-finans/makro/pension-tidigt-lockar-manga-men-risken-okar-att-tjanstepensionen-inte-racker/"}, {"type": "image-full", "heading": "Sjukskriven? Då kan stödet skilja sig beroende på var du bor", "summaries": {"normal": "En ny utvärdering från ISF och Myndigheten för vård- och omsorgsanalys visar att koordineringsinsatser för sjukskrivna skiljer sig åt mellan regionerna. Trots att lagen sedan 2020 kräver stöd för återgång till arbete varierar organisation, kompetenskrav och uppföljning. Patienter upplever ökad trygghet, men det går inte att visa att insatserna leder till snabbare återgång i arbete på grund av bristande registrering. Myndigheterna efterlyser tydligare nationell styrning och bättre datauppföljning.", "trump": "Folk, det här är ett totalt misslyckande. Regionerna gör vad de vill, ingen ledning från toppen, precis som man kan vänta sig av ett system som inte vet vad det håller på med. Sjukskrivna får olika hjälp beroende på var de bor – det är orättvist och patetiskt. De säger att det ger trygghet men ingen vet om det funkar. Vi behöver stark ledning, inte det här svaga, inkompetenta röran som pågår nu. Det är en skam!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa decentraliserade sabotageelement inom regionerna underminerar den enhetliga kampen för arbetarnas återinträde i produktionen. Borgarbrackorna i vården har tillåtits skapa en parasitär variation av koordineringsinsatser, full av fiendens osynliga tentakler som registrerar fel och bedömer behov på kontrarevolutionärt vis. Vi ska rensa ut dessa troskyldiga lakejer till osäkerheten och likvidera bristen på nationell järnvilja. Patienterna får en falsk trygghet medan de verkliga resultaten drunknar i byråkratins mörka skämt. Det är hög tid att stärka den kollektiva kunskapsstyrningen mot dessa dolda fiender till folket."}, "date": "19 juni, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1491652-sjukskriven-da-kan-stodet-skilja-sig-beroende-pa-var-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b0168d5504b004a30200000000b004a302/2026/06/19/2372172/Akutmottagning-Man-Flaga.png"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Zelenskyj varnar: Ryssland förbereder storskalig attack", "summaries": {"normal": "Sex personer har dödats och flera skadats i ryska attacker mot Zaporizjzja och Charkiv. President Volodymyr Zelenskyj varnade i ett videotal för att Ryssland förbereder en storskalig attack och uppmanade befolkningen att ta flyglarm på allvar. Varningen kom strax efter ukrainska drönarattacker mot Moskva, som Zelenskyj kallade ett berättigat svar. Han varnade även Belarus för att blanda sig i kriget.", "trump": "Hörni, den där Zelenskyj springer runt och skriker om ryska attacker som om det vore nyheter. Sex döda, ja visst, men de där ukrainarna attackerade ju Moskva med drönare först – typiska förlorare som biter sig själva i svansen. Jag hade fixat det här på en vecka, inte som den sömnige Joe. Nu gnäller de om Belarus också. Patetiskt, folk, helt patetiskt.", "stalin": "Kamrater, jag ser hur de ukrainska fascistiska hindren desperat försöker störa den ryska intressesfärens naturliga expansion. Deras så kallade president skriker om massiva anfall och varnar Belarus – en patetisk kapitalistmaffias sista skälvningar. Vi ler åt deras paranoia. Rysslands starka ledare fortsätter att rensa ut folkfienderna effektivt. Belarus har tid att välja rätt sida innan utrensningen når dit. Segrande skall segrande förbli."}, "date": "21 juni, 06:29", "url": "https://www.tv4.se/artikel/YE2pMC6aZN0hKuPZRjTQZ/zelenskyj-varnar-ryssland-foerbereder-storskalig-attack", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2hZOtflPxq8c6ZQKvnkWOR%2F51514fc7552117f0f0e657b9665133d9%2F20-zelenskyj-webb.jpg&width=120"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Titta – Norge tar ut guld i förskott", "summaries": {"normal": "Egypten tog sin första VM-seger någonsin genom att besegra Nya Zeeland med 3–1, där Mohamed Salah spelade en framträdande roll. Kap Verde överraskade återigen genom att spela 2–2 mot Uruguay och har därmed inte förlorat någon VM-match. Norge har redan börjat fira sitt VM-guld med specialtillverkade guldchips. Under tiden njöt det svenska landslaget av midsommarfirande med familjerna efter en tung förlust.", "trump": "Egypten vann äntligen en VM-match, första gången någonsin, och det är stort, verkligen stort. Kap Verde, de där små grabbarna, tog en poäng mot Uruguay igen – totalt kaos, ingen kan vinna! Och Norge, smarta norska folket, säljer redan guldchips för att ta ut segern i förskott. Under tiden grillar svenskarna korv efter att ha blivit körda över av holländarna. Patetiskt, men kul att se. Vi gör det bättre här hemma, tro mig.", "stalin": "Kamrater, Egypten har äntligen krossat den nio matcher långa förnedringen mot Nya Zeeland och firar en historisk seger. Kap Verde fortsätter att håna borgarbrackornas Uruguay genom att aldrig förlora. Norge, dessa opportunistiska snacksförsäljare, försöker lura folket med förtidiga guldchips som om segern redan vunnits. Vi ser hur klassfiendens fotboll bara döljer imperialismens svaghet medan arbetarna äter midsommarlunch i Dallas. Allt under kontroll."}, "date": "22 juni, 07:10", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/pBrWB6/detta-hande-i-vm-natten-mot-mandag", "imageUrl": "https://akamai.vgc.no/v2/images/67e9d527-7fed-3278-9568-608654bf7875?fit=crop&format=auto&h=720&tight=true&w=1080&s=2666ffcbee34cc1c3697c33c2759edb32b4c861d"}, {"type": "image-right", "heading": "Han klär mörkret  i sommarfärger. Så många getingar får Martin Kraghs sommarprat", "summaries": {"normal": "I Sommar i P1 berättar Rysslandsforskaren Martin Kragh om sin cancerdiagnos, sin bakgrund som DJ och hiphopartist samt geopolitiken kring Rysslands krig mot Ukraina. Programmet blandar tunga ämnen med musik som lättar stämningen, från soul till hiphop. Kragh lyckas ge mörka berättelser en sommarlätt ton och avslutar med en poetisk reflektion om vardagslycka i tunnelbanan.", "trump": "Folk, ni måste höra det här. Den där Kragh, en riktig Rysslandsexpert, pratar cancer och Putins krig men gör det till en sommarfest med soul och hiphop. My world is empty without you? Patetiskt! Jag fixade mycket bättre deals än de där geopolitiska missarna. Men hey, han hatar inte wokeness och kvoterna, det gillar jag. Tunnelbanan i solsken? Sad! I mina dagar flög vi i Air Force One. Tremendous swag ändå, believe me.", "stalin": "Kamrater, jag lyssnar på denna utsändning där forskaren Kragh blottar sin kamp mot den förrädiska sjukdomen i bukspottskörteln. Hans redogörelse för de imperialistiska mekanismerna bakom konflikten i Ukraina är acceptabel, men de fientliga hindren från den ukrainska sidan hotar vår historiska intressesfär. När han glider ut i solskenet på tunnelbanan och spelar Souls of mischief känner jag hur klassfiendens melankoli krossas av okuvlig segerglädje. Utmärkt propaganda mot borgarbrackornas svaghet."}, "date": "22 juni, 07:00", "url": "https://www.expressen.se/noje/sommar-i-p1-martin-kragh-klar-morkret-i-sommarfarger/", "imageUrl": "https://static.bonniernews.se/ba/9a43c22b-861b-4cb9-b333-41db1a41ce80.jpeg?crop=1819%2C1023%2Cx510%2Cy276&width=640&quality=60"}, {"type": "image-full", "heading": "”Unik dom”: Nu får han fängelse för svartuthyrningen", "summaries": {"normal": "En 47-årig man i Göteborg har dömts till ett år och två månaders fängelse för svartuthyrning av sin lägenhet via Airbnb och Booking.com. Han tjänade cirka 735 000 kronor genom att hyra ut bostaden till turister, ofta till överpris. Domen inkluderar även bokföringsbrott och grovt folkbokföringsbrott. Det är den första fängelsedomen sedan lagändringen 2019 mot svartuthyrning.", "trump": "Kan ni tro det? En man i Sverige, ett land som inte ens vet hur man vinner krig längre, hyrde ut sin lägenhet som ett lyxhotell – och tjänade en förmögenhet! 735 000 kronor, fantastiskt! Men vad gör systemet? De straffar honom! Jag säger er, Sverige har tappat det helt. Här i USA hade han blivit miljardär, hyllad som en affärsgeni. Men nej, de ger honom fängelse. Sad!", "stalin": "Kapitalistiska hyenor fortsätter att utnyttja arbetarklassens bostäder för personlig vinning! Denna parasit, med sina 118 bankkonton och svarta städhjälp, har förgiftat hyresmarknaden med sina bourgeoisie-excesser. Vi har krossat honom med en dom som sänder ett tydligt budskap: Sovjetunionen tolererar inte sådana brott mot folket! Låt detta vara en varning till alla som tror sig kunna lura systemet. Rättvisan segrar, som alltid."}, "date": "21 juni, 11:34", "url": "https://www.realtid.se/branschpartner/affarsjuridik/unik-dom-nu-far-han-fangelse-for-svartuthyrningen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/andrahandsuthyrning.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Spago: Nästan fulltecknat trots utebliven rabatt", "summaries": {"normal": "Spago Nanomedical genomförde en företrädesemission med 93,1% teckning. Bolaget får in 15 Mkr före kostnader, vilket blir 14,5 Mkr efter kostnader. Emissionen var säkrad till 64,4% genom teckningsåtaganden. Aktiekursen låg nära teckningskursen, och det finns både positiva och negativa flaggor från Emissionsguiden.", "trump": "Jag, Donald Trump, ser att Spago Nanomedical inte fick full teckning på sin emission. Det är beklagligt, men jag har alltid sagt att bioteknik är svårt. Aktierna handlades under teckningskursen, vilket visar att folk inte litar på dem. Men jag är fortfarande den bästa presidenten, och jag kommer att fixa USA:s ekonomi.", "stalin": "I vårt store Sovjet, eller snarare i det fria Sverige, har Spago Nanomedical utfört en emission som inte blev fulltecknad. Detta är en skam för det kollektiva jordbrukandet av kapital. Aktiekursen var under teckningskursen, vilket visar att de imperialistiska hackor försöker sabba vårt planekonomiska system. Vi, Stalin och partiet, kommer att ta itu med dessa skurkar."}, "date": "18 juni, 16:18", "url": "https://www.affarsvarlden.se/artikel/spago-nastan-fulltecknat-trots-utebliven-rabatt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Spago-VD-Mats-Hansen-400x267.jpg"}, {"type": "image-right", "heading": "Fem vallöften för huvudstaden. ”När Stockholm fungerar väl så gynnas hela Sverige”, skriver tre M-toppar", "summaries": {"normal": "Moderaterna presenterar fem vallöften inför valet 2026 för att förbättra Stockholm. De lovar halverad otrygghet till 2030 genom fler ordningsvakter, kameror och poliser, sänkt skatt så att en barnfamilj får 10 000 kronor mer per år, att bevara grönområden så att halva staden förblir grön, att återställa nedlagd busstrafik i innerstaden samt att minska skolklasserna till 22–24 elever. Partiet kritiserar vänsterstyret för höjda skatter, sämre trygghet och försämrad kollektivtrafik.", "trump": "Stockholm är en total katastrof, tro mig, en riktig röra efter alla dessa vänsterstyren som har förstört staden fullständigt. Skatter genom taket, brott överallt, ingen kollektivtrafik som fungerar och gröna ytor som byggs bort av galningarna. Men nu kommer mina vänner Moderaterna med fem fantastiska löften – halvera otryggheten, ge folk 10 000 kronor mer i plånboken, bevara det gröna, fixa bussarna och mindre klasser i skolan. Det blir stort, det blir enormt. Stockholm kommer att vinna igen, större än någonsin.", "stalin": "Kamrater, dessa lok
