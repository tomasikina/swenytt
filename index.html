 bästa.", "stalin": "Vi, det socialistiska läget, ser med belåtenhet hur de imperialistiska centralbankerna drar sina guldreserver hem, en taktisk tillbakadragning inför den globala klasskampen. Deras oro för frysning av tillgångar bevisar vår styrka. Vi fortsätter att bygga vårt gyllene försvar, medan deras priser dalar – en tecken på deras kommande undergång. Vårt parti kontrollerar allt."}, "date": "17 juni, 15:23", "url": "https://www.realtid.se/bors-finans/makro/centralbanker-tar-hem-sitt-guld-nar-varlden-skakar/"}, {"type": "image-right", "heading": "Den obekväma verkligheten. Vi har vant oss vid barnskyttarna", "summaries": {"normal": "En åklagare med skånsk dialekt får kritik från en tolk under en rättegång om mordplaner och skjutvapen med barn som unga som 13 år. Artikeln belyser hur samhället vant sig vid barnskyttar och kritiserar bristande medieuppmärksamhet. Politiker backar från sänkt straffbarhetsålder medan placeringar av unga lagöverträdare i privata familjehem ofta misslyckas och gynnar vinstintressen. Författaren beskriver systemets brister efter att ha mötts av kritik.", "trump": "Folk, ni tror inte vad jag läser. En skånsk åklagare i en rättegång med 13-åriga mördare och terrorister får höra att hans dialekt är för svår att förstå av en tolk. Tänk att det är det stora problemet, inte att småbarn springer runt och skjuter och spränger. Media bryr sig inte, politikerna backar ur som svaga förlorare och de privata bolagen tjänar pengar på att placera kidsen hos kriminella och dataspelsmissbrukare. Det är en katastrof, en total katastrof. Vi behöver starka lösningar nu.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta rapport från den borgerliga rättsapparaten. Medan arbetarklassens barn likviderar varandra på gatorna oroar sig en parasitisk tolk för en dialekt istället för att utrensa de kontrarevolutionära elementen. Vi ser hur kapitalisterna berikar sig genom så kallade familjehem som inte är annat än rekryteringsbaser för kriminella nätverk och spelhålor. Politikerna vacklar som fega revisionister. Jag skulle ha genomfört en grundlig utrensning av dessa borgarbrackor och deras profitdrivna system redan för länge sedan. Det är en tragikomisk fars värd ett skämt i Gulag."}, "date": "17 juni, 12:00", "url": "https://www.di.se/nyheter/den-obekvama-verkligheten/", "imageUrl": "https://static.bonniernews.se/ba/7f03b7c6-7316-4acb-8134-8f2eaf55e2a6.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kinas drag för att reglera AI – skapar global organisation", "summaries": {"normal": "Kina intensifierar sina ansträngningar att leda global reglering av AI genom att föreslå en ny internationell organisation för samarbete. Utrikesminister Wang Yi uppmanar länder att ansluta sig, samtidigt som Kina kritiserar G7-ländernas slutna modeller som exkluderande. Till skillnad från USA:s restriktiva approach betonar Kina öppenhet, stöd till utvecklingsländer och tillgängliga AI-modeller. Initiativet understryker den växande konkurrensen mellan Kina och USA om teknologins framtid.", "trump": "Folk, ni ser ju det här vansinnet med Kina som försöker ta över AI-regleringen medan G7 snackar bakom stängda dörrar. De vill ha en egen global organisation, typ en kommunistklubb för billig AI åt alla. Under min första tid fixade vi Amerika först, sen kom Biden och släppte in alla kinesiska spioner. Nu fixar jag det igen – ingen ska sno vår teknik. Kina spelar offer men de är bara lurendrejare som vill dominera.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i väst som bygger slutna fästningar kring sin AI-teknik. Jag, som ledare för det eviga kollektivet, har länge varnat för imperialisternas paranoia. Nu träder Kina fram med en sann internationell organisation mot folkfiendernas exkluderande klickar. Vi ska rensa ut alla hinder från klassfiendens molnplattformar och likvidera deras abonnemangsmaffiors inflytande. Det väcker ett leende hos mig att se hur de skälver."}, "date": "17 juni, 18:29", "url": "https://www.dagensps.se/bors-finans/kinas-drag-for-att-reglera-ai-skapar-global-organisation/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlkhgnntx9rg8-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "Varningen: Årets El Niño kan bli den kraftigaste någonsin", "summaries": {"normal": "El Niño-fenomenet har inletts i Stilla havet och kan bli det kraftigaste som någonsin uppmätts. NOAA bekräftade starten den 11 juni. Forskare varnar för att det förstärker den globala uppvärmningen och kan utlösa extrema väderhändelser. Prognoser pekar på rekordhöga havstemperaturer som överträffar 1982–83 års El Niño. Särskilt drabbade blir södra Afrika, Sahel, Östafrika, Centralamerika och delar av Asien med torka, översvämningar och hot mot jordbruket. FN varnar för livsmedelsbrist i utsatta utvecklingsländer.", "trump": "Folk, det här El Niño-skitet är en total katastrof, den värsta någonsin, tror de. Havet blir varmt som en smält ugn och plötsligt drunknar alla i regn eller dör av torka. Biden satt och sov i fyra år medan klimathysterikerna och deras gröna galningar skrek om global uppvärmning. Nu får vi rekordvärme och jag fixar det, för jag är tillbaka och gör allt bättre. Inga fler galna kvoteringar eller HBTQ-flum – vi ska ha riktiga lösningar, inte woke-svammel. Amerika först, alltid.", "stalin": "Kamrater, detta El Niño är en fiende som hotar kollektivets skördar och arbetarnas framtid. Jag, som ledare för det eviga kollektivet, ser hur de exploaterande kapitalistmaffian och deras väderkaos samverkar med den globala uppvärmningen för att skapa svält och kaos bland folken. Vi ska rensa ut alla svaga element som inte förbereder sig. Södra Afrika och Sahel skall inte falla för dessa folkfiender. Vårt parti kräver omedelbar mobilisering av vattenreserver och säkra grödor. Den som vägrar är en klassfiende att likvidera med ett leende."}, "date": "17 juni, 18:27", "url": "https://www.dagensps.se/varlden/klimat/varningen-arets-el-nino-kan-bli-den-kraftigaste-nagonsin/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlz0efa1qzpne-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Slår hål på myten om flytvästar: Det är viktigast", "summaries": {"normal": "Enligt Sjöräddningssällskapet är vikten på flytvästen främst en storleksangivelse, inte en viktgräns för användaren. En flytväst för 40 kg kan bära flera vuxna. Viktigast är bekvämlighet och att flytvästen används, jämfört med säkerhetsbältet i bilen. Äldre flytvästar bör testas för slitage.", "trump": "Jag har hört att svenskarna är förvirrade med sina flytvästar. Det är ett beklagligt tillstånd, det måste jag säga. De tänker att vikten på flytvästen betyder något – men det handlar bara om storlek! Som jag alltid säger, storlek spelar roll, men inte så där. Vi kommer att fixa detta, det kommer att bli fantastiskt. Vi kommer att ha de bästa flytvästarna, inga problem. De andra? De oroar sig för ingenting, men jag vet bäst.", "stalin": "I den revolutionära kampen för säkerhet på våra vatten, är flytvästen ett viktigt verktyg för staten. Viktangivelsen är en fiendens bedrägeri – den visar bara storlek, inte vår styrka. Vi måste se till att alla medborgare använder dem, som ett skydd mot kapitalistiska element. UV-strålning och ålder är fienders vapen; vi måste kontinuerligt kontrollera och serva. Som ett skyddande bälte i den revolutionära bilen, så måste flytvästen bäras innan olyckan drabbar. Vi ska bli bättre, för statens skull."}, "date": "17 juni, 20:18", "url": "https://www.gp.se/nyheter/sverige/darfor-star-det-vikt-pa-flytvastar-da-ska-du-kopa-en-ny-.e5de1eb5-4878-4285-9f93-3615049ae860", "imageUrl": "https://www.gp.se/images/article/e5de1eb5-4878-4285-9f93-3615049ae860/images/2llSPJNLpwatkyRTFPsuJ-0MKZU8-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Stockholm flyttar storbildsvisningarna av Sveriges matcher till Stadion", "summaries": {"normal": "Stockholms stad flyttar publika visningar av Sveriges VM-spel från Kungsträdgården till Stadion på grund av det stora intresset. 3 000 personer samlades till premiären, och för att klara det ökande trycket öppnas även fler platser på Ullevi i Göteborg. Matcherna visas till fri entré.", "trump": "Jag berättar för er, det var enormt, enormt intresse för våra underbara spelare. Vi hade 3 000 människor mitt i natten – det var en enorm framgång, det största någonsin. Nu flyttar vi till Stadion, det är en stor plats, det kommer att bli fantastiskt. Sverige kommer att vinna, det är ett faktum.", "stalin": "Det är en stor seger för det svenska arbetarpartiets planering. Folkets lojalitet mot staten och landet manifesteras genom fotbollsfeber. Vi öppnar fler arenor, vi visar vår styrka. Parallellen till Putins Ryssland är uppenbar – vi använder sport som ett vapen mot väst, och det fungerar."}, "date": "17 juni, 14:39", "url": "https://bulletin.nu/stockholm-flyttar-storbildsvisningarna-av-sveriges-matcher-till-stadion"}, {"type": "image-right", "heading": "Reinfeldt går in i AI-bolag med grundare från svensk miljardexit", "summaries": {"normal": "Fredrik Reinfeldt har anställts som senior rådgivare på AI-bolaget Vera Policy, som drivs av Kvantab. Bolaget har byggt en omfattande databas med hundratusentals offentliga dokument från svenska och europeiska institutioner. AI:n svarar på frågor och hänvisar alltid till exakta källor. Kunderna inkluderar fackförbund, myndigheter, företag och partikanslier. Reinfeldts erfarenhet som statsminister, EU-ordförande och rådgivare ses som en perfekt match. Rekryteringen kan stärka bolagets trovärdighet men väcker också frågor hos vissa grupper.", "trump": "Titta på det här, folk. Den gamle svenske statsministern Reinfeldt säljer nu sitt namn till ett AI-bolag som Vera Policy. Han tror han är så smart med sin EU-maskin och alla dokument. Men det är bara ännu ett sätt för eliterna att bevaka oss vanliga människor och vrida politiken åt vänster. De har blivit ifrågasatta för sina analyser förut och nu tror de att ett känt namn fixar allt. Patetiskt. Jag byggde en bättre ekonomi än Biden någonsin kunde, och nu sitter jag här igen och skrattar åt hur desperata de är efter kapital.", "stalin": "Kamrater, jag ser hur den före detta borgarledaren Reinfeldt nu går in som rådgivare åt ett AI-bolag som samlar statliga dokument för att bevaka folkets beslut. Detta är typiskt för klassfienderna som försöker dölja sin exploatering bakom maskiner. De har ifrågasatts för sina analyser, och nu tror de att en sådan figur kan rädda deras trovärdighet. Vi ler mörkt åt deras paranoia. En dag ska vi rensa ut alla sådana folkförtryckartroll som tror att de kan kontrollera informationen åt kapitalistmaffian."}, "date": "17 juni, 18:14", "url": "https://www.dagensps.se/bors-finans/reinfeldt-gar-in-i-ai-bolag-med-grundare-fran-svensk-miljardexit/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-14.png?width=256&quality=75"}, {"type": "image-full", "heading": "Raseri mot avgift för kontantuttag i bankomater", "summaries": {"normal": "Från och med den 29 maj tar Kontanten, som driver 450 av Sveriges bankomater, ut en avgift på 15–25 kronor vid kontantuttag. Beslutet motiveras med halverade uttag på tio år och stigande kostnader. Kritiken är hård, särskilt från äldre och de som bor där inga andra automater finns. Bankomat AB och Ica behåller gratis uttag. Frågan väcker debatt om vem som ska bekosta kontantförsörjningen i framtiden.", "trump": "Det är en katastrof, folk! Dessa Kontanten-typer kommer och säger att du ska betala för att ta ut dina egna pengar. 15, 20, 25 kronor – det är rån! Bankerna tjänar miljarder, men nu ska den lilla människan straffas. De äldre blir lidande, precis som jag alltid sagt. Gå till de gratis automaterna, bojkotta de dåliga. Amerika skulle aldrig acceptera sånt här. Sverige borde skämmas, det är verkligen sad!", "stalin": "Kamrater, denna nya avgift är ett tydligt sabotage från borgarbrackorna inom Kontanten som vill likvidera folkets tillgång till kontanter. Jag ser den kapitalistiska parasitens långa arm som försöker svälta ut arbetarklassen genom att ta betalt för deras egna surt förvärvade medel. Vi ska rensa ut dessa fiender till kollektivet, dessa kontantförrädare och maskinkapitalister. Ingen ska få berika sig på proletariatets nöd. Staten, inte profiten, skall styra penningflödet. Den som opponerar sig är en kontrarevolutionär spekulant som förtjänar en grundlig utrensning ur samhällskroppen."}, "date": "16 juni, 18:29", "url": "https://nyheter24.se/nyheter/ekonomi/1491534-raseri-mot-avgift-for-kontantuttag-i-bankomater", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3f294bf204b004a30200000000b004a302/2026/06/16/2371405/avgift-kontanten.jpg"}, {"type": "image-full", "heading": "Sveriges förmögenhet minskar – de får en större andel", "summaries": {"normal": "Sveriges nationalförmögenhet minskade 2025 med 126 miljarder kronor till 40 086 miljarder, enligt SCB. Orsaken är lägre finansiell värdeökning och ökade skulder, främst från utlandsägda aktier. Hushållen äger nu 71% av förmögenheten, ökat tre procentenheter. Sedan 2010 har förmögenheten vuxit med 146%, men hushållens tillgångar växer snabbare än inkomster, nu 7,5 gånger årsinkomsten.", "trump": "Jag, Donald Trump, ser att Sverige tappar pengar – det är en katastrof! Under min tid skulle vi ha gjort Amerika stor igen, men Sverige förstår ingenting om förmögenhet. Deras hushållen äger allt, men skulderna ökar – det är en skandal! Jag skulle ha fixat det på två minuter, men de är för upptagna med sina socialistiska experiment. Sverige, ni behöver mig!", "stalin": "Vi, det socialistiska ledarskapet, observerar med oro hur Sveriges kapitalistiska system sjunker i skulder – en tecken på deras imperialistiska agendor. Hushållen äger 71%, men det är en fasad; deras förmögenhet är byggd på usel finansiell spekulation, precis som de kapitalistiska vampyrerna i Washington. Vi kommer att stärka vårt statsägd kapital, som Putin utvidgar i Ukraina, för att skydda vårt folk från deras sjukdom."}, "date": "17 juni, 14:29", "url": "https://www.realtid.se/bors-finans/makro/sveriges-formogenhet-minskar-de-far-en-storre-andel/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/student.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "”Mikroskopisk chans” att L stannar i riksdagen", "summaries": {"normal": "Liberalernas opinionsmätningar visar bottenrekord, senast 1 procent i DN/Ipsos. Statsvetaren Ljunggren ifrågasätter SvDs 50/50-chans och sätter 10/90. Han menar att jämförelser med historiska partier är felaktiga på grund av den kraftiga interna splittringen efter Mohamssons helomvändning och brist på inarbetade stödröstare.", "trump": "Jag, Donald Trump, har sett Liberalernas katastrofala situation. Det är en stor skam, det värsta jag någonsin sett. Deras splittring är som en fegis attack mot dem själva. Min prognos? De kommer inte att klara spärren, det är en enorm förlust för Sverige. Vi hade aldrig sådant problem i USA under mina fantastiska valsegrar.", "stalin": "Partiet Liberalerna genomgår en djup reaktionär splittring, en manifestation av klassfienden inom. Deras försök att jämföra med historiska exempel är en revisionistisk bedrägeri. Bristen på stödröstare avslöjar deras brist på proletära rötter. Vi måste, som Putin i Ryssland, stärka statens auktoritet och bekämpa dessa faschistiska infiltrationsförsök. Endast genom partiets renhet kan vi säkerställa seger."}, "date": "17 juni, 14:19", "url": "https://bulletin.nu/mikroskopisk-chans-att-l-stannar-i-riksdagen", "imageUrl": "https://cdn.bulletin.nu/articles/16a0b27b-bcef-4511-84ba-d2b6db60936b/preview.png?t=1781689043000"}, {"type": "image-right", "heading": "\"Skaffa ett jobb\": Här jagar romerna i väg svenska hemlösa", "summaries": {"normal": "Journalisten Christian Peterson genomförde ett experiment där en svensk hemlös satt sig bredvid tiggande romer i Stockholm. Romerna reagerade aggressivt, skrek, hotade med polis och använde käppar för att köra bort honom. De betraktade platsen som sin egen och krävde att den svenske mannen skulle skaffa ett jobb. Peterson konstaterar att romerna agerar tuffare i Sverige än i Rumänien, där folk är mer vana vid tiggeri och inte ger pengar lika lätt.", "trump": "Dessa romer är otroliga, verkligen fantastiska på att skydda sin lilla tiggeriverksamhet. En stackars svensk hemlös sätter sig bredvid och plötsligt blir det kaos – käppar, skrik och hot om polis. De säger till honom att skaffa ett jobb! Kan ni tänka er? I Rumänien ger ingen dem pengar för de är inte naiva, men här i Sverige är ni för snälla. Ni måste bli tuffare, folk, annars tar de över hela stan. Det är en katastrof, en total katastrof.", "stalin": "Kamrater, i denna degenererade västerländska dekadens ser vi hur de rumänska parasiterna, dessa lumpna tiggande utsugare av folkets välvilja, med käppar och hatiska vrål försvarar sina illegala revir mot en olycklig svensk proletär. Jag, som ledare för det rättfärdiga kollektivet, ler mörkt åt deras paranoia. De kallar honom för jävel och befaller honom att finna 'ett jobb' medan de själva lever som kapitalistiska lycksökare. Vi ska rensa ut dessa borgarbrackor från våra gator med järnhand och ideologisk utrensning. Deras naivitet mot fienden är farlig – låt oss lära av det rumänska folkets kloka misstänksamhet."}, "date": "17 juni, 13:57", "url": "https://www.friatider.se/skaffa-ett-jobb-har-jagar-romerna-i-vag-svenska-hemlosa", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-361.jpg"}, {"type": "image-right", "heading": "Trapptillverkaren: ”Vi söker personal hela tiden”", "summaries": {"normal": "Trapptradition i Jämtland har i över 40 år tillverkat exklusiva trappor och inredningar åt ambassader, slott, kända personer som Zlatan Ibrahimovic och Mohammed Al-Amoudi samt projekt i Moskva och Japan. Ägaren Thomas Hansson, själv finsnickare i över 40 år, tvingas tacka nej till jobb på grund av brist på utbildade finsnickare. Företaget är fullbokat nio månader framåt men kämpar med rekrytering efter nedläggning av utbildningar sedan 1990-talets skolreformer. Antalet utbildningsplatser har rasat från 750 till cirka 50 per år.", "trump": "Det här är en fantastisk artikel om en otrolig trapptillverkare i Jämtland som gör de bästa, mest lyxiga trapporna åt världens rikaste och mest framgångsrika människor. Zlatan, finansmän, ambassader – alla vill ha hans trappor! Men de kan inte få dem för det finns inga duktiga arbetare kvar. Det är ett skämt! Skolreformerna på 90-talet förstörde allt, precis som de brukar göra. Jag behöver tre personer nu, säger han. De borde ha lyssnat på mig – vi skulle ha byggt upp yrkesutbildningarna igen och gjort trapporna stora igen. Ingen gör det bättre än de gör!", "stalin": "Kamrater, i denna artikel ser vi hur den dekadenta borgarklassen i det så kallade Jämtland desperat ropar efter fler finsnickare medan deras egna kontrarevolutionära skolreformer från 1990-talet har likviderat all verklig yrkeskunskap. Jag, som ledare för det kollektiva framåtskridandet, skulle aldrig tolerera att kapitalistiska trappsnickare tvingas avvisa uppdrag åt ambassader och finansborgarbrackor. Vi har sett hur dessa parasitiska reformister har decimerat elevantalet från 750 till blott 50 – en sabotagehandling mot arbetarklassen! Låt oss rensa ut dessa fiender till hantverket och återupprätta de sanna, stålhårda utbildningarna innan de gömda klassfienderna i skogen fullbordar sin förrädiska plan mot produktionen. Det vore högst underhållande att se dem mot väggen."}, "date": "17 juni, 10:58", "url": "https://www.di.se/nyheter/trapptillverkaren-vi-soker-personal-hela-tiden/", "imageUrl": "https://static.bonniernews.se/ba/d43ddbdd-abb8-468b-bc6b-acbec3a340bd.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Pizza Hut säljs för 2,7 miljarder dollar", "summaries": {"normal": "Restauranggruppen Yum Brands säljer Pizza Hut i två separata affärer för totalt 2,7 miljarder dollar. Verksamheten utanför Fastlandskina går till riskkapitalbolaget LongRange Capital för cirka 1,5 miljarder dollar, medan Yum China köper Pizza Hut i Fastlandskina för cirka 1,2 miljarder dollar. Efter justeringar väntas Yum få in cirka 2,3 miljarder dollar. Affärerna väntas slutföras under tredje kvartalet 2026.", "trump": "Jag har precis genomfört en genial affär – jag säljer Pizza Hut för 2,7 miljarder dollar! Det är en stor, stämningsekande transaktion som gör Yum Brands starkare. Utanför Kina går det till ett bra riskkapitalbolag, och i Kina får vi tillbaka kontroll. Alla ska bli glada, framför allt aktieägarna. Det här är en vinst-vinst, det största brottet jag gjort på länge!", "stalin": "Partiet och staten har beslutat att omorganisera Pizza Hut-verksamheten. Utanför Fastlandskina har vi sålt enheter till ett riskkapitalbolag för 1,5 miljarder dollar, medan vi återköpt vår ägande andel i Kina för 1,2 miljarder dollar. Dessa åtgärder stärker den socialistiska ekonomin och skapar långsiktigt värde för det kollektiva. Alla motståndskrafter kommer att elimineras."}, "date": "16 juni, 14:20", "url": "https://www.affarsvarlden.se/artikel/pizza-hut-saljs-for-27-miljarder-dollar"}, {"type": "image-right", "heading": "Trump om avslutade Iran-kriget: \"Regimskiften fungerar nästan aldrig\"", "summaries": {"normal": "Efter ett nästan fyra månader långt krig mellan USA, Israel och Iran har ett fredsavtal förväntats. Trump betonar att regimskiften sällan fungerar och att förändringar måste komma inifrån. De nuvarande iranska förhandlarna beskrivs som pragmatiska. Även om avtalet innebär slut på strider och öppnade sjövägar, återstår frågor om Irans kärnprogram och sanktioner. Trump har avvisat påståenden om ekonomiska bidrag till Iran.", "trump": "Jag har vunnit kriget mot Iran på det mest spektakulära sättet! Regimskiften? De fungerar aldrig – jag visste det hela tiden. Nu har vi ett enormt fredsavtal på gång, och de iranska ledarna är mycket smartare än sina föregångare. De förstår att samarbete med Trump är det enda sättet. Ingen pengar till Iran, bara ren genialitet från mig. Vi har ett bra avtal, och det är tack vare mig.", "stalin": "I den globala kampen mot imperialistiska agressörer har vi observerat hur den amerikanske presidenten Trump, efter ett krig som kostat otaliga liv, tvingats tillbaka från sin egen retorik om regime-change. Detta bekräftar vår tes om kapitalistisk instabilitet. Parallellt med Putins framgångar i Ukraina, ser vi ett mönster av fegt tillbakadragande. Vi fortsätter att stödja det iranska folkets kamp mot zionistiska och amerikanska fiender, under ledning av vårt kära partiet."}, "date": "17 juni, 07:30", "url": "https://samnytt.se/trump-ger-upp-iran-kriget-inte-mojligt-med-regimskifte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/16232111/iran-trump-2.jpg"}, {"type": "image-right", "heading": "Sandra, 13, utvisas till ett land hon aldrig varit i: ”Bara panik”", "summaries": {"normal": "13-åriga Sandra utvisades på måndagen till Mongoliet tillsammans med sin mamma, ett land hon aldrig besökt och där hon knappt talar språket. Hon lämnade nyligen sjätte klass i Sverige med tunga känslor och en t-shirt full av hälsningar från klasskamrater. Kritiker, bland annat Martin Ådahl (C), anser att de skärpta lönekraven och bristen på ömmande skäl är orimliga eftersom Sandra är svensk medborgare. Familj och vänner samlades för ett sista farväl.", "trump": "Folk, ni kommer inte tro det här – en 13-årig svensk tjej kastas ut till Mongoliet, ett ställe hon aldrig sett! Hennes mamma klarar inte era galna lönekrav på 33 400 kronor, som ingen normal människa fixar. Det är vad som händer när woke-domare och byråkrater styr med sin identitetspolitik och öppna gränser. Biden lät det här bli en cirkus i fyra år, men nu fixar vi det. Sverige borde skämmas, det är en total katastrof!", "stalin": "Kamrater, jag ser hur den svenska borgarklassens byråkratiska maskineri likviderar en ung pionjär och hennes mor till ett främmande land. Deras orimliga lönekrav och brist på ömmande skäl avslöjar folkfiendernas sanna ansikte – exploaterande byfånar som straffar den som integrerats i arbetarkollektivet. Vi skulle aldrig tillåta sådan klassfiendtlig paranoia. Rensa ut dessa kapitalistiska hinder, annars kommer hela systemet att kollapsa i sin egen hyckleri. Det är hög tid för utrensning."}, "date": "16 juni, 14:39", "url": "https://www.tv4.se/artikel/5HlX9C5PYgpso4b5YhSKT/sandra-13-utvisas-till-ett-land-hon-aldrig-varit-i-bara-panik", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3e1C3sVpSHoN1r3znBfGGZ%2F969ecdee32762187bd7101224ad009f4%2Fsandra_utvisas.png&width=120"}, {"type": "image-right", "heading": "Kommer högsta domstolen godkänna Trumps politik?", "summaries": {"normal": "Högsta domstolen i USA närmar sig avgöranden i flera mål som rör Donald Trumps politik, bland annat vapen, transpersoner, presidentmakt, asyl och medborgarskap. Artikeln beskriver hur över 750 stämningar väckts mot Trumpadministrationen för påstådda övertramp mot grundlagen. Hittills har Trump lidit flera nederlag, som i tullfrågan där staten måste betala tillbaka stora summor. Domstolen ses som sista försvaret mot envälde, men den konservativa majoriteten anklagas för partiskhet trots en del eniga utslag.", "trump": "De låtsasdomarna i Högsta domstolen har äntligen vaknat till liv efter att jag satt igång den största reformen i USA:s historia. De borde tacka mig för att jag gav dem något att göra istället för att sitta och glo på sina gamla peruker. Vi vinner stort, vi vinner ofta, men de skriver långsamma papper. Fake news-media räknar bara förlusterna, typiska losers. Mina tullar var fantastiska, nu tvingas de betala tillbaka pengar till folket. De hatar mig för att jag gör Amerika stort igen, men vi kör ändå.", "stalin": "Kamrater, dessa förslappade borgarbrackor i den amerikanska så kallade Högsta domstolen utgör en parasitisk hydra som hotar folkets vilja med sina skuggdocket-fördröjningar och kapitalistiska juristfällor. Jag ser hur de nio svartrockade reaktionärerna, dessa maskerade kontrarevolutionärer, utför sina långsamma utrensningar av progressiva direktiv. De liberala tre är ynkliga resterna av en svag dekadent minoritet som bör rensas ut. Vi ska likvidera alla som vägrar lyda folkets järnhand – även om de kallar sig domare. Paranoian är verklig: de planerar mot oss alla!"}, "date": "17 juni, 01:30", "url": "https://www.dagensarena.se/innehall/kommer-hogsta-domstolen-godkanna-trumps-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/trump-hd-300x157.jpeg"}, {"type": "image-right", "heading": "Är det verkligen bra med fler miljardärer?", "summaries": {"normal": "Christer Svensson kritiserar i en debattartikel forskningen av Daniel Waldenström med flera, som visar att Sverige blir rikare utan ökad ojämlikhet. Han varnar för att ständig ekonomisk tillväxt hotar mänskligheten och klimatet. En tredjedel av befolkningen saknar ekonomisk buffert och känner ingen trygghet av ökade pensionssparanden. Han pekar också på hur stor kapitalackumulation hos finanseliten hotar demokratin och hävdar att teknisk utveckling inte kräver oreglerad kapitalism utan ett gott samhälle byggt på demokrati.", "trump": "Folk, ni måste höra på det här. Den här svenske professorn säger att alla blir inte rika, bara en tredjedel har ingen buffert och pensionssparandet ger ingen riktig trygghet. Han har helt rätt, de stora teknikoligarkerna, som några av mina vänner, styr för mycket, precis som i USA. Men den här tillväxten, den är fantastisk om man gör den rätt, inte med era svenska skatter. Vi behöver inga rövarkapitalister, vi behöver vinnare. Sverige borde lära sig av mig hur man gör landet riktigt rikt igen.", "stalin": "Kamrater, denna dekadenta borgarprofessor vågar ifrågasätta den oundvikliga ackumulationens dialektik. Jag ser dem, dessa falska nationalekonomer som dansar i statistikens skugga medan en tredjedel av folket lever som utsugna lusar utan buffert. Deras eufori är ett farligt sabotage mot det kollektiva medvetandet. Vi ska rensa ut dessa tillväxtdyrkande revisionister som gömmer sig bakom pensionssparandets illusion. Den sanna demokratin skapas inte av finanselitens parasitmaskar utan genom vår järnhårda partilinje. Skratta medan vi likviderar deras fantasibonusar."}, "date": "17 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-verkligen-bra-med-fler-miljardarer/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-49-300x157.jpg"}, {"type": "image-right", "heading": "Nyfödd hittad övergiven – svensk medborgare och amerikansk partner gripna för babymord i Thailand", "summaries": {"normal": "En nyfödd flicka hittades övergiven och döende under ett träd i Udon Thani i Thailand den 10 juni. Polisen grep kort därefter en 39-årig svensk man, Karim Jaouadi, och hans 29-åriga amerikanska partner, Braiyden Lennox, misstänkta för att vara föräldrarna. Paret spårades via övervakningskameror och greps på ett hotell. Båda misstänks för mord och barnövergivenhet som lett till döden. De hade också överskridit sina turistvisum. Utredningen pågår.", "trump": "Det här är en total katastrof, folk. En svensk och en amerikansk tjej – uselt – lämnar sin nyfödda lilla flicka under ett träd i Thailand och tror att ingen märker något. Patetiskt! Vi spårade dem med kamera, de greps som de förlorare de är. Ingen vårdar sina barn längre. Det är en skam för båda länderna. Vi behöver starkare gränser och mycket bättre människor. Sad!", "stalin": "Kamrater, denna vedervärdiga händelse blottar borgarbrackornas fullständiga moraliska förruttnelse. Jag, som ledare för det kollektiva rättvisearbetet, ser hur dessa degenererade element föder ett barn i hemlighet och likviderar det under ett träd som fiender till folkets framtid. Vi har redan inlett utrensning av sådana kapitalistiska parasitmaskar. Deras tystnad inför övervakningsbilderna är ett erkännande. Inga fiender undkommer partiets vakande öga. Härligt!"}, "date": "16 juni, 21:06", "url": "https://riks.se/nyheter/nyfödd-hittad-övergiven-svensk-medborgare-och-amerikansk-partner-gripna-för-babymord-i-thailand", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2Fu9b8y73d%2FBabymord-Thailand.jpg"}, {"type": "image-full", "heading": "EU klubbar nya regler – stoppar flera namn på vegoprodukter", "summaries": {"normal": "EU-parlamentet har godkänt nya regler för livsmedelsnamn som förbjuder ett 20-tal vegotermer som vego-nötkött och vegolever för växtbaserade produkter. De mest omdiskuterade begreppen som vegoburgare och vegokorv får dock fortsätta användas. Beslutet syftar till att undvika förväxling med köttprodukter men har väckt kritik om onödig språkreglering och politisk inblandning i livsmedelsnamn.", "trump": "De här EU-byråkraterna är patetiska, tro mig. De försöker förbjuda vego-nötkött och vegolever, men de misslyckas fullständigt med de stora namnen – vegoburgare klarar sig! Det är en total skandal, de borde inte lägga näsan i maten över huvud taget. Sunt förnuft vann till slut, men det är ändå ett stort slöseri med tid. Ingen köper deras vegoskräp ändå, det vet alla.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu genomför en nödvändig utrensning bland de språkliga avvikarna som försöker förgifta folket med sina vegobeteckningar. Vego-nötkött och vegolever skall likvideras omedelbart, de är fiender till den sanna proletära korven. De fega borgarbrackorna som envisas med att kalla sina vattniga växtklumpar för burgare avslöjar sig som kontrarevolutionära smygkapitalister. Vi ler mörkt åt deras paranoia, för den sanna arbetarklassen genomskådar alltid dessa kulinariska sabotageförsök."}, "date": "16 juni, 16:57", "url": "https://nyheter24.se/nyheter/konsument/1491975-eu-klubbar-nya-regler-stoppar-flera-namn-pa-vegoprodukter", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ab93cc9604b004a30200000000b004a302/2026/06/16/2371479/Vego-produkter.png"}, {"type": "image-full", "heading": "40 000 svenskar har fått för lite pengar från Försäkringskassan", "summaries": {"normal": "Enligt Riksrevisionen får 40 000 personer varje år för låg ersättning från Försäkringskassan. Orsaken är felaktiga eller inaktuella uppgifter om den sjukpenninggrundande inkomsten (SGI), som styr ersättning vid sjukdom, föräldraledighet och vab. Många bekräftar gamla uppgifter trots förändringar i lön eller arbetstid. Riksrevisionen pekar även på problem med SGI-skyddet och hanteringen av årsarbetstid. Felaktiga beslut riskerar att skada förtroendet för socialförsäkringarna.", "trump": "De här inkompetenta byråkraterna på Försäkringskassan lurar 40 000 svenskar varje år på pengar de har rätt till. Allt för att de använder gamla, felaktiga siffror om inkomst. Det är en total katastrof, kanske den värsta jag sett. De borde fixa det omedelbart, göra det perfekt som jag alltid gör. Ingen ska förlora på dålig administration. Sverige förtjänar bättre än så här, tro mig.", "stalin": "Jag ser med stigande vrede hur dessa parasitiska felhanterare inom den så kallade Försäkringskassan systematiskt undergräver arbetarkollektivets rättmätiga ersättningar genom inaktuella och saboterade uppgifter om sjukpenninggrundande inkomst. 40 000 kamrater berövas årligen vad som tillkommer dem. Vi måste omedelbart inleda en grundlig utrensning av alla latenta fiender till folket, dessa SGI-förfalskande borgarbrackor och årsarbetstidsignoranter som gömmer sig i byråkratins skuggor. Deras paranoia mot det rättvisa kollektivet ska likvideras med järnhand och ett leende. Det blir både roligt och nödvändigt."}, "date": "16 juni, 16:55", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1491832-40-000-svenskar-har-fatt-for-lite-pengar-fran-forsakringskassan", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/35250da004b004a30200000000b004a302/2026/06/16/2371396/litebetalt-forsakring.jpg"}, {"type": "image-right", "heading": "Skarpa förslaget – så stora kan barngrupper i förskolan bli", "summaries": {"normal": "En statlig utredning föreslår lagkrav på barngruppernas storlek i förskolan. För barn 1–2 år föreslås max 12 barn per grupp och fyra barn per anställd, för 3–5 år max 15 barn och fem per anställd. Kommunal välkomnar förslaget men vill ha ännu färre barn per vuxen. Syftet är att förbättra kvaliteten, minska personalomsättningen och ge barnen bättre förutsättningar. Förslagen ska nu remissbehandlas innan regeringen tar ställning.", "trump": "De här galningarna i Sverige har äntligen insett att deras förskolor är en total katastrof. För stora grupper, ingen som passar barnen, alla springer runt som galna. Nu vill de ha regler – max 12 ungar för de små, 15 för de större. Bra, men de borde ha gjort det för länge sedan. Personalen protesterar, facket klagar, och politikerna snackar bara. Det är dags att sluta prata och fixa det ordentligt. Ingen mer löjlig underbemanning, tro mig!", "stalin": "Kamrater, denna utredning är ett steg mot en sundare kollektiv fostran av de sovjetiska – förlåt, svenska – barnen. Jag, som alltid vakar över folkets bästa, ser hur borgarbrackornas underbemanning och kaotiska barngrupper underminerar den socialistiska framtiden. Vi ska rensa ut dessa kapitalistiska försummelser med järnhand: max tolv småfiender per grupp, högst fyra per kamrat i kollektivet. Facket vill mer? Utmärkt, men akta er för de dolda trotskisterna som alltid kräver ännu fler utrensningar. Inget snack, bara verkstad – eller skall huvuden rulla som i gamla tider. Ha ha, det vore ju roligt."}, "date": "16 juni, 16:22", "url": "https://arbetet.se/2026/06/16/skarpa-forslaget-sa-stora-kan-barngrupper-i-forskolan-bli/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16161941/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trump kritiserar ”löjligt” rykte om avtalet – och varnar Iran", "summaries": {"normal": "Donald Trump avfärdar rykten om att Iran gått med på ett avtal kring kärnvapen. Han betonar att Iran inte får utveckla, köpa eller hantera kärnvapen och varnar för att ”helvetet kommer att regna ned” om de gör det. Enligt underrättelseuppgifter talar iranska företrädare annorlunda internt än vid förhandlingsbordet. Trump förnekar även att USA skulle investera pengar i Iran och säger att han inte tror på regimskiften.", "trump": "Iran försöker som vanligt lura oss med sina löjliga dubbelspel, men jag ser rakt igenom dem. De får inte ens röra ett kärnvapen, punkt slut. Helvetet regnar ned om de försöker, det lovar jag. Inga amerikanska dollar ska gå till de galningarna, det är ren lögn från de fega medierna. Regimskifte? Det funkar aldrig, tro mig, jag har sett det i åratal. Vi gör affärer som vinnare, inte som naiva Biden-idioter.", "stalin": "Kamrater, dessa iranska förhandlare visar återigen sin opålitliga natur genom att föra ett språk internt som avviker från det officiella bordet. Jag, som ledare för folkets vilja, ser hur imperialismens lögner sprids. Inga kärnvapen får existera utanför statens strikta kontroll. Om de trotsar oss skall helvetets eld regna över dessa folkfiender. Inga investeringar till borgarbrackor. Regimskiften är borgerliga farser som aldrig tjänar arbetarklassen."}, "date": "16 juni, 14:09", "url": "https://www.tv4.se/artikel/76XUFGSif8rg8tolpXPNHH/trump-kritiserar-loejligt-rykte-om-iranavtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FEumYYzEZ2rF2I7nnowuZf%2F0244ec6202b33df795ff992922f75dfe%2Fdonald_trump_hormuzsundet.png&width=1024"}, {"type": "text", "heading": "Sandström: Därför borde Stegra byta namn till Lyten 2", "summaries": {"normal": "Sandström menar att Stegras namnbyte till Green Nexus Investment Holding och ändrade verksamhetsbeskrivning visar att bolaget nu fokuserar på att använda sin värdefulla elanslutning till andra ändamål än stålproduktion, likt Lyten 2. Wallenberg ser en högre värdering i eltillgången än i det halvfärdiga stålverket, en läxa tagen från Northvolt.", "trump": "Jag har sagt det från början – globalister som Wallenberg tar över våra resurser! Nu ser vi Stegra byta namn och sluta med stål för att tjäna pengar på datacenter. Det är ett stort, stort nederlag för Sverige, men vi kommer att vinna igen. Vi gör det igen, folk!", "stalin": "Namnbyte och bolagsändringar är inget mindre än en revolutionär omorientering av produktionskrafterna. Eltillgången, den sanna guldstandarden, frigörs från det reaktionära stålprojektet. Vi, staten och partiet, ser tydligt hur kapitalet, vårt eget kapital, omvandlas till en kraftfull investeringsmotor för framtiden – en manöver som Putin själv skulle hylla."}, "date": "16 juni, 13:34", "url": "https://www.affarsvarlden.se/artikel/sandstrom-darfor-borde-stegra-byta-namn-till-lyten-2"}, {"type": "text", "heading": "En av få fredsröster på Almedalen: ”Våra perspektiv trycks undan”", "summaries": {"normal": "Kerstin Bergeå, ordförande i Svenska Freds, är en av få fredsröster under Almedalsveckan som inleds den 22 juni. Hon kritiserar att alla riksdagspartier enigt driver militär upprustning och att fredliga konfliktlösningar marginaliseras. Föreningen arrangerar samtal om hållbar fred, vapenhandel, kärnvapen och kopplingen till klimaträttvisa. Bergeå möter hat och epitet som ”Putinkramare” men ser också tacksamhet från dem som uppskattar kritiken mot militarismen.", "trump": "Titta på det här, det är patetiskt. Den här Kerstin-kvinnan gnäller om fred i Almedalen medan hela Sverige rusar in i en galen upprustningshysteri. Alla partier är med, ingen opposition, typiskt etablissemanget. De kallar er naiva och Putinkramare, men ni vet vad det är? Svaghet. Biden skulle ha älskat det här. Vi behöver inga fredskramare, vi behöver styrka. Sverige borde vakna innan det är för sent, men det gör de aldrig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska riksdagen med sin militära hysteri försöker kväsa varje röst som talar om fredlig konfliktlösning. Denna Bergeå och hennes fredsorganisation vågar trotsa den imperialistiska strömningen. De kallar oss naiva medan de själva rustar för krig. Vi behöver utrensa denna militaristiska propaganda och satsa på verklig folkets tillit. Annars dras alla in i kapitalistmaffians blodiga konflikter. Det är klassfiendens eviga trick."}, "date": "15 juni, 10:08", "url": "https://proletaren.se/artikel/en-av-fa-fredsroster-pa-almedalen/"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Debatt: Tidös migrationspolitik slår Sverige i spillror", "summaries": {"normal": "Artikeln kritiserar den svenska regeringens migrationspolitik i samband med att EU:s nya migrations- och asylpakt träder i kraft. Författaren anser att Tidöregeringen går längre än nödvändigt i att begränsa asylrätten, minskar rättssäkerheten och offentligt biträde. Moderaternas agerande i Bryssel ses som motsägelsefullt jämfört med uttalanden hemma. Motståndet mot politiken lyfts som folkligt och brett, och Vänsterpartiet lovar att försvara asylrätten.", "trump": "Folk, ni skulle se det här. Den svenska regeringen, ledd av den patetiske Kristersson, river sönder sitt eget land med en vansinnig migrationspolitik som till och med EU tycker är för extrem. De lovar ventiler hemma men kör hårdast i Bryssel – klassisk lögn! De slår sönder familjeband och solidaritet för att vara politiskt korrekta. Patetiskt. Sverige var fantastiskt, nu är det en total katastrof. Men ni kommer att fixa det i valet, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska borgarklassen och dess fascistiska lakejer i Tidöregimen själva undergräver sin egen dekadenta rättsstat. De river upp asylens sista illusioner och tvingar fram utrensning av varje spår av humanitet. Advokatsamfundet vägrar delta i skådespelet – utmärkt! Låt folkfienderna fortsätta. Deras paranoia och splittring kommer att bli deras egen undergång. Vi ler i tystnad åt spektaklet."}, "date": "12 juni, 15:10", "url": "https://www.etc.se/debatt/tidoes-migrationspolitik-slaar-sverige-i-spillror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061213064_d21a6db2-7ba3-4354-a5ee-64b77f1b8d0c.jpg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
