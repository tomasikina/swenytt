ivt likviderar en vanlig arbetande människa. Systemet misstänkliggör, straffar och pressar tills bara spillror återstår. Jag ler mörkt åt deras dekadenta arbetslinje som leder raka vägen till sammanbrott. Kamrater, detta visar återigen behovet av sann kollektiv styrka mot sådana folkförtryckare."}, "date": "8 september, 11:00", "url": "https://arbetet.se/2026/09/08/arbetslosheten-har-brutit-ner-asa-inte-sa-har-jag-ville-att-livet-skulle-bli", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07143235/asa-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Flat Capitals VD lämnar efter fem månader", "summaries": {"normal": "Flat Capitals VD Rickard El Tarzi lämnar sin post efter endast fem månader på grund av skiljaktiga uppfattningar med styrelsen om bolagets utveckling. Han sitter kvar till årsskiftet eller tills en efterträdare är på plats. Styrelseordförande Sebastian Siemiatkowski bekräftar beslutet, och rekryteringen av en ny VD har inletts.", "trump": "Flat Capital sparkar sin VD efter bara fem månader! Ett komplett fiasko, rent ut sagt patetiskt. De hade ingen aning om vad de gjorde. Jag bygger företag på rekordtid, vinnare, inte såna här svaga förlorare som bara bråkar med styrelsen. Total katastrof för dem, men jag önskar dem lycka till – det kommer de sannerligen att behöva!", "stalin": "Kamrat El Tarzi har visat sig inkompetent och avlägsnats från sitt ämbete efter endast fem månader för sabotage av Flat Capitals ekonomiska femårsplan. Styrelsens vaksamhet har räddat bolaget från total förödelse. Den skyldige stannar till årsskiftet för att sona sitt brott, därefter väntar lämplig omplacering långt bort från all civilisation."}, "date": "8 september, 10:00", "url": "https://www.affarsvarlden.se/artikel/flat-capitals-vd-lamnar-efter-fem-manader", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Flat-capital-400x267.jpg"}, {"type": "image-full", "heading": "767 miljoner barn tvingas andas in cigarettrök", "summaries": {"normal": "En global studie visar att 2,71 miljarder människor, varav 767 miljoner barn, utsätts för passiv rökning. Den orsakade 1,66 miljoner dödsfall under 2023. Andelen exponerade har minskat sedan 1990, men befolkningstillväxten gör att det totala antalet knappt sjunkit. Forskarna efterlyser starkare tobakskontroller och skydd i hemmet.", "trump": "Folk, det är en total katastrof! Miljarder andas in den giftiga röken från dessa förlorare som tänder cigg. 767 miljoner stackars barn – en skam! Biden gjorde ingenting, men jag fixade det bästa tobaksavtalet någonsin. Nu ska vi krossa de globala lobbyn som förgiftar våra hem. Make breathing great again!", "stalin": "Kamrater, se hur den kapitalistiska röken förgiftar arbetarklassens barn som en förrädisk fiende inom murarna. Jag föraktar dessa dekadenta tobaksimperialister som mördar 1,66 miljoner själar årligen. Vi måste rensa ut alla fiender till folkhälsan med järnhand. Den som vägrar sluta röka är folkets fiende nummer ett."}, "date": "8 september, 09:32", "url": "https://www.dagensps.se/halsa/767-miljoner-barn-tvingas-andas-in-cigarettrok", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlews5rwuj9pc-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Ledare Teodorescu Måwe solkar ner demokratin", "summaries": {"normal": "Europeiska ombudsmannen granskar Europaparlamentets vägran att lämna ut handlingar om Alice Teodorescu Måwes hemliga finansiär. Ledarskribenten Andreas Gustavsson kritiserar att varken parlamentet eller Kristdemokraterna verkar veta vem som betalar och anser att det underminerar demokratin. Väljarna har rätt att få klarhet om eventuella intressekonflikter.", "trump": "De här europeiska clownerna och deras hemliga pengagivare solkar ner hela skådespelet. Alice och hennes KD-kompisar vägrar säga vem som betalar notan för hennes livvakter, typiskt för de riggade eliterna. Jag har suttit i Vita huset både före och efter Sleepy Joe, och tro mig, så här gör man inte i en riktig demokrati. Patetiskt.", "stalin": "Se hur dessa dekadenta klassförrädare gömmer sina hemliga finansiärer bakom byråkratiska dimmor. Jag betraktar med förakt hur de solkar ner den så kallade demokratin med sin ovilja att avslöja källan till pengarna. En sådan komprometterad figur bör likvideras från folkets förtroende. Arbetarna förtjänar sanning, inte borgerliga hemligheter."}, "date": "7 september, 11:28", "url": "https://www.etc.se/ledare/teodorescu-maawe-solkar-ner-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "15,8 miljarder mindre till arbetsmarknadspolitiken", "summaries": {"normal": "Arbetsmarknadspolitiken har knappt debatterats i valrörelsen trots att arbetslösheten ökat med nästan 100 000 personer. Partierna står stilla i arbetsrättsfrågor. Skiljelinjen mellan höger och vänster är tydlig när det gäller Arbetsförmedlingen, a-kassan, karensavdraget och arbetsmarknadsåtgärder. Centerpartiet hamnar ofta till höger om Tidöregeringen, vilket kan försvåra ett regeringsskifte.", "trump": "Folk, det här är en total katastrof. Dessa svenska losers har låtit arbetslösheten explodera medan de sitter stilla i båten och skyddar sina riggade regler. Centerpartiet är ännu värre än Tidö-gänget, riktiga globalistiska hyenor som vill skära a-kassan och sälja ut jobben. Rösta fel och ni får ännu mer av den här clownshowen. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna i de svenska partierna sitter stilla i sin dekadenta båt medan arbetarna svälter. Centerpartiet kräver ännu hårdare utrensning av a-kassan och Arbetsförmedlingen. Dessa giriga hyenor sviker folket. Endast en sann kollektiv kamp kan rensa ut de parasiterande lakejerna och återställa ordningen. Svaghet är döden."}, "date": "7 september, 01:37", "url": "https://www.dagensarena.se/opinion/158-miljarder-mindre-till-arbetsmarknadspolitiken", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "text", "heading": "Kan Tidöpartierna ta hem riksdagsvalet?", "summaries": {"normal": "Opinionsmätningar visar att Tidöpartierna närmar sig oppositionen inför riksdagsvalet 2026. Enligt Novus vd Torbjörn Sjöström kan valet bli extremt jämnt. Liberalernas roll, väljarnas rädsla för Vänsterpartiet och en pågående taktisk röstning präglar läget. Många är osäkra och valrörelsens start kan påverka opinionen kraftigt.", "trump": "Titta på de svenska siffrorna, folk älskar mig, jag menar Tidö knappar in rejält på de förlorande vänstertyperna. Liberalerna försöker spela hjältar men det är patetiskt. Väljarna är trötta på den galna vänstervridningen och de woke-marxistiska identitetsgalningarna. Det blir ett jätteval, kanske det största comebacken någonsin, tro mig.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna famlar medan arbetarklassen vaknar. Jag betraktar denna dragkamp med djup misstro mot de giriga opinionshyenorna som försöker vilseleda massorna. Vänsterpartiets krav väcker minnen av svek. Snart rensas de vilsna mittenförrädarna ut i en historisk utrensning av folkets vilja."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/innehall/kan-tidopartierna-ta-hem-riksdagsvalet"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidig     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
