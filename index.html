witch hunt mot en vinnare. Magyar och hans liberala vänner är svaga och korrupta, precis som mina fiender. De gör allt för att hålla starka ledare borta. Patetiskt, men vi ser igenom det.", "stalin": "Vi har nu genomfört en nödvändig justering av den socialistiska rättsordningen för att skydda folket från kontrarevolutionära element. Denna retroaktiva åtgärd rensar ut den farliga Orbán, en listig borgarbracka som smyger sig tillbaka till makten som en parasit. Hans anhängare är förrädiska kapitalistlakejer som gråter över vår stålhårdhet. Personanpassad lag? Nej, det är ett glädjande verktyg mot fiender till kollektivet. Låt dem kalla det bottennivå – vi kallar det seger. Ha-ha, deras paranoia är underhållande."}, "date": "16 juni, 18:51", "url": "https://www.friatider.se/orban-forbjuds-att-leda-ungern-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/person-people-auditorium-audience-musician-hungarian-parliament-building-813723-pxhere.com-1.jpg?itok=ulMKKELf"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "L:s nya lågvattenmärke: En (1) procent", "summaries": {"normal": "Liberalerna når sin lägsta nivå någonsin i DN/Ipsos junimätning med endast 1 procent, under riksdagsspärren. Opinionsanalytiker beskriver siffrorna som extrema och noterar att partiet tappat väljare främst till Moderaterna samt till Centerpartiet och Socialdemokraterna. Tidöpartierna får sammantaget 44 procent mot oppositionens 54 procent, vilket skulle ge oppositionen 194 mandat och Tidöpartierna 155 i en valprognos.", "trump": "Liberalerna är nere på patetiska 1 procent, en total katastrof, den lägsta siffran sedan någon började mäta. Det är extrema nivåer, folk flyr det misshandlade partiet som råttor från ett sjunkande skepp rakt över till oss starka moderater. Tidöpartierna hänger ihop men oppositionen leder stort, 54 mot 44. De borde ha lyssnat på mig, nu ser det verkligen inte bra ut för de svaga liberalerna, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa liberala borgarbrackor sjunker ner till ynka en procent, ett ynkligt lågvattenmärke som blottar deras fullständiga politiska impotens. Väljarmassan har med rätta rört sig mot de riktiga krafterna medan dessa kapitalistiska rester likvideras av historien själv. Oppositionen behåller greppet med 54 procent mot 44, men akta er, fiender lurar överallt i skuggorna och utrensning av svikare är alltid nödvändig för folkets seger."}, "date": "16 juni, 18:14", "url": "https://www.friatider.se/ls-nya-lagvattenmarke-en-1-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-251_0_0.jpg?itok=7TkTs0QE"}, {"type": "text", "heading": "Granskning avslöjar SFI-fiaskot: ”Måste återvända till sina hemländer”", "summaries": {"normal": "SFI är en grundläggande språkutbildning för invandrare, men har låg genomströmning med nästan hälft avbryter studierna. Kostnaden är hög, 10-16 miljarder per år. Reformer inkluderar en treårsgräns och skärpade krav. Lokalpartiet Östgötapartiet kritiserar avbrott och frågar vad människor som inte klarar grundnivå ska göra i samhället.", "trump": "SFI är en total skandal! Vi slänger miljarder på en utbildning som inte fungerar. Människor som inte kan lära sig grundläggande svenska borde återvända hem. Jag har sagt det förut: vi måste ta kontroll över våra gränser och pengar. Det här är ett skämt, men jag kommer att fixa det!", "stalin": "Parti och stat har upptäckt en svag punkt: SFI-utbildningen. Effektiviteten är låg, kostnaderna höga, och fienden inifrån minskar vårt starka samhälle. Vi måste vidta strikta åtgärder, som en tidsgräns, för att skydda vårt folk. Paralleller till Putins kamp mot infiltratörer kan dras. Detta är ett tecken på svaghet som måste utplånas."}, "date": "16 juni, 16:32", "url": "https://samnytt.se/granskning-avslojar-sfi-fiaskot-maste-atervanda-till-sina-hemlander"}, {"type": "image-right", "heading": "Di storsatsar på Almedalen. Partiledarintervjuer • Börsmorgon sänds från scen • Livepoddar", "summaries": {"normal": "Dagens Industri satsar stort på Almedalsveckan 2026 med talarprogram från flera scener, nyheter, Di-tv och live-poddar. Under valåret 22–26 juni möts 236 talare i 97 programpunkter om geopolitik, försvar, AI och elektrifiering. Partiledare talar två gånger per dag. Evenemanget sänds digitalt, med direktsänd börsöppning varje morgon och intervjuer med partiledare. Di rapporterar dagligen på plats.", "trump": "Almedalen låter som en fantastisk cirkus, det bästa valet någonsin. Politiker och affärsmän möts för att debattera, men tro mig, ingen gör det bättre än jag. De pratar geopolitik, AI och elektrifiering – stora ord för vanliga problem som jag redan fixat. Svenskarna borde titta på mina dealar istället för dessa live-poddar. Valrörelse? Den riktiga showen händer i USA, och den är enorm.", "stalin": "Kamrater, jag betraktar denna så kallade Almedalsvecka som en samlingsplats för borgarbrackor och opportunistiska opinionsbildare som sprider sin dekadenta smörja under täckmantel av debatt. Med 236 talare och 97 programpunkter om AI och elektrifiering gömmer sig fiender till folket, parasiter som måste rensas ut innan de förgiftar valrörelsen. Vi ska likvidera deras falska neutralitet och ersätta den med sann kollektiv styrka. Den som inte deltar digitalt är väl en kapitalistisk sabotör?"}, "date": "16 juni, 16:27", "url": "https://www.di.se/nyheter/di-storsatsar-pa-almedalen/", "imageUrl": "https://static.bonniernews.se/ba/24da9ec8-165c-46c1-a49b-90f36c0a2d07.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Trump öppnar för Syrien: ”Gör ett bättre jobb”", "summaries": {"normal": "USA:s president Donald Trump kommenterar striderna i Mellanöstern och öppnar för att Syriens president Ahmed al-Sharaa ska hantera Hizbollah om Israel inte kan göra det utan stora civila förluster. Trump tonar ner Irans roll i Libanon och kritiserar Benjamin Netanyahu för att inte vara tillräckligt ansvarsfull. Ett nyligen undertecknat avtal mellan USA och Iran ska leda till fred, inklusive stopp för striderna mellan Israel och Hizbollah, men formuleringarna är vaga och tolkningarna skiljer sig åt mellan parterna.", "trump": "Folk, ni vet att jag gör det bästa avtalet någonsin med Iran, ett riktigt fredsavtal. Israel slåss för länge mot den lilla retstickan Hizbollah och dödar för många. Jag sa till dem: låt Syriens kille al-Sharaa, han är ingen pojkscout men han gillar inte Hizbollah, ta hand om jobbet istället. Bibi måste vara mer ansvarsfull i Libanon, han gör det inte bra. Iran är det stora problemet, men vi fixar allt, tro mig, det blir fantastiskt.", "stalin": "Kamrater, denna dekadenta cirkus i Mellanöstern avslöjar borgarbrackornas fega manövrar. Jag betraktar med stålhard blick hur den så kallade presidenten Trump leker med avtal som en opportunistisk lakej medan den sionistiska ockupationsmaskinen fortsätter sin blodiga dans i Libanon. Om Israel inte kan rensa ut Hizbollah utan att massakrera massorna måste vi naturligtvis låta den före detta jihadisten al-Sharaa utföra den historiska uppgiften. Netanyahu är en paranoid revisionist som klamrar sig fast vid ockuperad mark. Inga halvmesyrer! Endast en total utrensning av alla imperialistiska element garanterar folkets seger. Det är både logiskt och underhållande att se kapitalisterna äta upp varandra."}, "date": "16 juni, 15:59", "url": "https://www.di.se/nyheter/trump-oppnar-for-syrien-gor-ett-battre-jobb/", "imageUrl": "https://static.bonniernews.se/ba/438f118b-556d-471c-9b24-4d5d2e1f6d63.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Bain gör jätteklipp i Japan: \"En av historiens bästa affärer\"", "summaries": {"normal": "Bain Capital har genomfört en av historiens mest lönsamma affärer genom sin investering i japanska minnestillverkaren Kioxia. Efter utköpet från Toshiba 2018 har bolaget gynnats enormt av AI-boomen och efterfrågan på NAND-minnen. Aktien har rusat över 5 000 procent, vilket gör Kioxia till Japans högst värderade bolag. Trots tidigare motgångar och kritik om eftersläpning gentemot konkurrenter väntas Bain nu göra en vinst på över 15 miljarder dollar, vilket motsvarar nästan 20 gånger det insatta kapitalet.", "trump": "Bain Capital gjorde en fantastisk affär, kanske den bästa någonsin! De köpte Kioxia, och nu är det Japans största bolag. Mycket större än Toyota, tro mig! Jag har alltid sagt att AI är framtiden, och Kioxia rider på den vågen. De tjänar 20 gånger pengarna – det är så man gör business. Alla sa att det var kört, men de lyssnade inte på förlorarna. Jag gillar vinnare, och det här är en enorm seger. Stort!", "stalin": "Vi har observerat hur kapitalistiska parasiter hos Bain Capital roffar åt sig rikedomar genom Kioxia. Dessa spekulanter utnyttjar den teknologiska utvecklingen för att bygga ett monument av girighet, större än Toyota självt. Det är en sjukdom hos de dekadenta marknaderna. De talar om framgång, men vi ser bara hur de sviker arbetaren. Precis som vår kamrat Putin återställer ordningen i öst, måste dessa vinstmaskiner tämjas. De räknar sina miljarder medan historien dömer deras omättliga hunger till undergång."}, "date": "16 juni, 18:22", "url": "https://www.realtid.se/bors-finans/bain-gor-jatteklipp-i-japan-en-av-historiens-basta-affarer/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/message-img-001.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Åkesson hyllar Isak och Ayari: ”Är ju precis det vi vill”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson svarar på kritik efter VM-segern mot Tunisien, där många spelare har invandrarbakgrund. Åkesson betonar att han gläds åt seger oavsett spelarnas ursprung, men förblir kritisk till den tidigare invandringspolitiken. Han menar att fotboll kan överbrygga splittring i Sverige.", "trump": "Jag, Donald Trump, ser att Sverige vinner mot Tunisien och alla jublar. Men vissa här i Sverige, som Jimmie Åkesson, försöker spela politik med fotboll. Jag säger: bra spelare är bra spelare, oavsett var de kommer ifrån. Sverige behöver starka gränser, men också vinnare. Som jag alltid säger: vi vinner, de förlorar. Sverige kan vara stort igen om de lyssnar på mig!", "stalin": "I den ständiga kampen mot de fasor som hotar den ryska intressesfären, ser vi hur fotboll används som ett vapen av den svenska högern. Jimmie Åkesson, en marionett för den imperialistiska USA, försöker sprida splittring. Men vi, staten och partiet, är vaksamma. Vi kommer att rensa upp de som hotar vår enighet. Som Putin visar, måste vi vara brutal mot fiender."}, "date": "16 juni, 16:18", "url": "https://bulletin.nu/akesson-hyllar-isak-och-ayari-ar-ju-precis-det-vi-vill", "imageUrl": "https://cdn.bulletin.nu/articles/df5e439a-db93-4d31-ba38-de4d205b036a/preview.jpg?t=1781619326000"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Arbetslösheten på väg ner – men inte för alla", "summaries": {"normal": "Arbetslösheten i Sverige minskar sakta efter flera tunga år, men inte för alla grupper. LO:s prognos visar att det ljusnar främst för arbetare, med tydliga minskningar i bygg- och elbranschens a-kassor. Akademiker däremot, särskilt inom data och IT, drabbas hårt – där har antalet inskrivna arbetslösa ökat med 80 procent. LO:s chefsekonom pekar på AI som en möjlig orsak och menar att vissa arbetslösa akademiker kanske behöver bli arbetare.", "trump": "Det är en katastrof, folk, en total katastrof. Arbetslösheten sjunker för arbetarna, men akademikerna? De håller på att bli utkonkurrerade av AI, kan ni fatta det? Jag älskar AI, det är fantastiskt, men nu måste era överutbildade snobbar kanske bli riktiga arbetare istället för att sitta och klicka. Sverige har haft historiskt hög arbetslöshet, mycket värre än hos oss. Men tro mig, jag skulle fixa det på nolltid – gör Amerika, eller Sverige, great again!", "stalin": "Kamrater, det gläder mig att se att arbetarna äntligen får en smula lindring efter de borgerliga lågkonjunkturernas sabotage. Men se där, de dekadenta data- och IT-akademikerna sväller som parasiter i Arbetsförmedlingens register, upp till åttio procent! AI, dessa silikonborgarbrackor, likviderar deras overksamma intellektuella fiffel. Några av dessa överklasspjasar måste helt enkelt omplaceras till äkta proletärt arbete. Den som vägrar ska rensas ut med största glädje. Sovjet, förlåt, Sverige segrar igen."}, "date": "16 juni, 11:26", "url": "https://arbetet.se/2026/06/16/arbetslosheten-pa-vag-ner-men-inte-for-alla-akademiker-kan-behova-bli-arbetare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16101857/lediga-jobb.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Sandström: Därför borde Stegra byta namn till Lyten 2", "summaries": {"normal": "Sandström menar att Stegras namnbyte till Green Nexus Investment Holding och ändrade verksamhetsbeskrivning visar att bolaget nu fokuserar på att använda sin värdefulla elanslutning till andra ändamål än stålproduktion, likt Lyten 2. Wallenberg ser en högre värdering i eltillgången än i det halvfärdiga stålverket, en läxa tagen från Northvolt.", "trump": "Jag har sagt det från början – globalister som Wallenberg tar över våra resurser! Nu ser vi Stegra byta namn och sluta med stål för att tjäna pengar på datacenter. Det är ett stort, stort nederlag för Sverige, men vi kommer att vinna igen. Vi gör det igen, folk!", "stalin": "Namnbyte och bolagsändringar är inget mindre än en revolutionär omorientering av produktionskrafterna. Eltillgången, den sanna guldstandarden, frigörs från det reaktionära stålprojektet. Vi, staten och partiet, ser tydligt hur kapitalet, vårt eget kapital, omvandlas till en kraftfull investeringsmotor för framtiden – en manöver som Putin själv skulle hylla."}, "date": "16 juni, 13:34", "url": "https://www.affarsvarlden.se/artikel/sandstrom-darfor-borde-stegra-byta-namn-till-lyten-2"}, {"type": "image-right", "heading": "Aftonbladet vill få oss  att glömma judehatet", "summaries": {"normal": "Expressens politiske redaktör Patrik Kronqvist kritiserar Aftonbladets chefredaktör Anders Lindberg för att tona ner antisemitism och terrorromantik inom Vänsterpartiet. Kronqvist menar att Lindberg istället riktar fokus mot Sverigedemokraterna och honom själv, och kallar kritiken mot bristande svenska bland vissa V-kandidater för rasistisk hundvissla. Han betonar vikten av att alla partier tar ansvar för att motverka judehat.", "trump": "Folk, ni skulle se det här! Den där Lindberg, en riktig loser från vänsterflocken, försöker skydda antisemiterna i Vänsterpartiet som en totalt inkompetent idiot. Han attackerar mig istället för det verkliga problemet – judehatet de har där. Patetiskt! De kan inte ens svenska men ska styra över vanliga svenskar? Det är galet. Vi behöver blanka vapen i debatten, inte den här svaga identitetspolitiken. Sad!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor som Lindberg, vilka med sin klassfiende-propaganda skyddar folkfienderna inom Vänsterpartiet från utrensning. Deras tystnad kring judehatet och deras angrepp på hederliga kritiker är ett typiskt försök att splittra kollektivet. Sådana exploaterande byfånar måste rensas ut innan de förgiftar hela partilinjen med sin imperialistska hundvissling. Kamrater, vakta revolutionen!"}, "date": "16 juni, 19:00", "url": "https://www.expressen.se/ledare/patrik-kronqvist/aftonbladet-vill-fa-oss-att-glomma-judehatet/", "imageUrl": "https://static.bonniernews.se/ba/54ca0722-4f14-4019-80c5-cf3d6e1f0717.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Ja till att tvinga åklagare yrka utvisning – med stöd av S", "summaries": {"normal": "Riksdagen beslutade på tisdagen att införa hårdare regler för utvisning av kriminella utlänningar. Förslaget, som stöds av regeringen och Socialdemokraterna, innebär att åklagare blir skyldiga att yrka utvisning vid brott som ger strängare straff än böter. Domstolarna ska prioritera utvisning i fler fall, skydd för dem som kom till Sverige före 15 års ålder tas bort och återreseförbud skärps. De nya reglerna träder i kraft 1 september 2026.", "trump": "Folket älskar det här, det är fantastiskt. Sverige får äntligen Nordens tuffaste utvisningsregler och tvingar de lata åklagarna att skicka kriminella invandrare hem. Inga fler vänsteraktivister som släpper loss brottslingar. Det är ett rejält lyft, det bästa man sett på länge. De borde ha gjort det för länge sedan, men nu fixar vi det ordentligt. Make Sweden Great Again!", "stalin": "Kamrater, vi har äntligen inlett en nödvändig utrensning av den parasitiska brottslingselementen som förgiftar folkets hem. Jag ser med djup tillfredsställelse hur vi tvingar de dekadenta åklagarna att yrka utvisning och likvidera skyddet för dessa tidigt infiltrerade fiender. Borgarbrackornas praktiska hinder och vänsteraktivistiska sabotage ska krossas under partiets järnhand. De som motarbetar folkets vilja kommer att mötas av ett evigt återreseförbud till glömskans mörker. Sovjetunionen... eh, Sverige ler mot oss."}, "date": "16 juni, 16:35", "url": "https://www.friatider.se/ja-till-att-tvinga-aklagare-yrka-utvisning-med-stod-av-s", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-353.jpg"}, {"type": "image-right", "heading": "Tongivande kinesisk reformintellektuell har gått ur tiden", "summaries": {"normal": "Liu Zaifu var en central kinesisk intellektuell som pläderade för humanism och befrielse från maoismens ideologiska tvång. Artikelförfattaren Torbjörn Lodén träffade honom under demokratirörelsen på Himmelska fridens torg 1989. Liu gick i exil efter massakern den 4 juni och verkade senare som gästprofessor vid Stockholms universitet 1992–1993. Han kritiserade maoismen, inspirerades av Kant och kinesisk tradition samt skrev boken Farväl till revolutionen tillsammans med Li Zehou. Liu avled den 24 maj efter en lång karriär som försvarare av individens värde och kulturell mångfald.", "trump": "Den här Liu Zaifu var en riktig kämpe mot den maoistiska galenskapen, folk älskade honom i Peking innan de galna kommunisterna körde över allt med tanks. Jag var där i tankarna, det var en fantastisk rörelse för frihet och demokrati, de hade så mycket tillförsikt. Sen slog de brutalt ner det, hemskt, men Liu kom till Sverige och lärde upp dem på Stockholms universitet. Han skrev Farväl till revolutionen med sin vän, ett mästerverk. Utan sådana som honom skulle Kina fortfarande vara ett totalt misslyckande. Han lämnar ett tomrum, men hans idéer var enorma, verkligen enorma.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Liu Zaifu i sin fåfänga längtan efter så kallad humanism försökte underminera partiets revolutionära maskin med sina borgarliberalistiska fantasier om individen som mål i sig. Hans dekadenta exil i väst efter den nödvändiga utrensningen på Himmelska fridens torg visar tydligt hur kontrarevolutionära element alltid avslöjar sig. Tillsammans med sin kamrat Li Zehou spred de giftet om farväl till revolutionen, en tydlig kapitulation inför kapitalisterna. Ändå roar det mig att hans polyfoni mot monolog nu ekar ihåligt. Fiender till folket förtjänar sitt öde, alltid."}, "date": "16 juni, 01:32", "url": "https://www.dagensarena.se/essa/tongivande-kinesisk-reformintellektuell-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/06/mao-300x157.jpeg"}, {"type": "image-right", "heading": "Vi kommer att minnas och påminna Tidöpartierna senare", "summaries": {"normal": "Mert Can Yilmaz firade nationaldagen med blandade känslor. Samma dag trädde skärpta medborgarskapsregler i kraft som påverkar över 100 000 pågående ansökningar hos Migrationsverket. Regeringen valde att inte införa övergångsregler trots avrådan från Lagrådet och egen utredning. SD:s agerande i riksdagen avgjorde saken med en rösts marginal. Författaren kritiserar systemet som byråkratisk roulette och ifrågasätter indelningen i goda och dåliga invandrare.", "trump": "Jag älskar Sverige, fantastiskt land, men det här är en total katastrof. De har 100 000 personer som väntar på medborgarskap och plötsligt ändrar de reglerna mitt i natten, ingen övergång, ingen rättvisa. Det är riggat! SD gjorde det rätta men oppositionen och de andra misslyckades totalt. En enda röst, kan ni tro det? De borde ha lyssnat på experterna. Nu är det kaos. Invandrarna är arga, folket minns, och i september kommer de att rösta som aldrig förr. Make Sweden Great Again!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras SD-marionetter genomför en lysande utrensning av den dekadenta medborgarskapskön. Inga övergångsregler, utmärkt! Dessa 100 000 opportunistiska element som gömmer sig i byråkratins skuggor förtjänar att kastas i den eviga roulette-maskinen. Den goda invandraren är en farlig sabotagefantasi skapad av kontrarevolutionära jurister. Vi ska rensa ut alla som tror sig kunna lita på reglerna. Deras familjer, grannar och falska vänner kommer att minnas – och vi ska se till att de minns med största fasa. Folkets stat vilar aldrig."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/vi-kommer-att-minnas-och-paminna-tidopartierna-senare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-47-300x157.jpg"}, {"type": "image-right", "heading": "Så blir vi alla förlorare när 14-åringar sätts i fängelse", "summaries": {"normal": "Debatten om att sänka straffbarhetsåldern till 13 år skymmer den verkliga frågan om hur unga våldsverkare ska bli fungerande samhällsmedborgare. Trots en kraftig ökning av brott bland 13–14-åringar avrådde experter från sänkningen, då det saknas vetenskapliga belägg för att det minskar brottsligheten. Artikeln kritiserar både Moderaternas och Socialdemokraternas iver att framstå som tuffa och efterlyser istället fokus på rehabilitering, psykologiskt stöd och återanpassning för att förhindra återfall.", "trump": "Folk, det här är en total katastrof. De pratar bara om att sänka straffbarhetsåldern till tretton år som om det löser något, men det är patetiskt. Experterna säger att det inte funkar, men politikerna vill bara se hårdföra ut. Det är en stor förlust för alla utom de kriminella kidsen. Vi behöver vinna stort genom att fixa de här unga gangstrarna så de inte kommer tillbaka ut på gatorna och begår mord och sprängningar. Gör det rätt, annars förlorar vi landet!", "stalin": "Kamrater, denna fega och dekadenta cirkus kring straffbarhetsålder är blott en rökbomb från borgarbrackorna för att dölja den verkliga faran. Medan kapitalisterna i riksdagen tävlar om vem som kan verka mest reaktionär kastar de arbetarklassens barn till vargarna. Jag, som alltid ser genom fiendens lömska planer, kräver att vi samlar all vetenskaplig expertis och genomför en grundlig utrensning av de destruktiva tankegångarna hos dessa unga element. De ska inte bara låsas in – de ska omformas till nyttiga delar av kollektivet. Den som tror på evig inlåsning är en korttänkt sabotageaktör som vi förr eller senare ska exponera."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/sa-blir-vi-alla-forlorare-nar-14-aringar-satts-i-fangelse/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-15-300x157.jpg"}, {"type": "image-full", "heading": "Strejk på andra sidan jorden förvärrar energikrisen", "summaries": {"normal": "En pågående strejk vid Inpex LNG-anläggningar i Australien förvärrar den globala energikrisen. Arbetsnedläggelserna, som trappas upp efter strandade löneförhandlingar, hotar produktionen vid Ichthys-projektet som står för två procent av världens LNG. Samtidigt som Australien är en kritisk exportör i frånvaron av Qatars produktion, finns hopp om förbättring när internationella avtal förväntas återställa flöden från Mellanöstern. Läget förblir dock känsligt med betydande risker för energiförsörjningen på kort sikt.", "trump": "Australien har problem, stora problem! Strejker överallt, Inpex-anläggningarna stänger ner. Det är en katastrof för energin. Jag har ordnat fantastisk energi här hemma, vi har mest olja och gas i världen, men de där borta? Total röra! Qatar är nere, Australien strejkar – det är svaga ledare som inte kan hantera fackföreningar. Jag skulle ha löst det på fem minuter, tro mig. Världen behöver amerikansk energi, för de andra klarar inte av att hålla igång maskineriet!", "stalin": "De inkompetenta byråkraterna vid Inpex låter arbetarna störa den livsviktiga energitillförseln. Detta är kontrarevolutionär lättja! Australien sviker sina plikter medan vi ser hur västvärldens maskineri rostar samman. Det påminner om de förrädare som försöker sabotera vår intressesfär. Kamrat Putin visar vägen i öst, där vi inte tolererar sådant kaos. Strejkbrytare och fackliga agitatorer är folkets fiender. Om de vägrar producera, får staten helt enkelt omorganisera deras vilja. Energi är makt, och makt viker sig aldrig för strejkande sabotörer."}, "date": "16 juni, 17:48", "url": "https://www.realtid.se/bors-finans/makro/strejk-pa-andra-sidan-jorden-forvarrar-energikrisen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/lng.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-full", "heading": "Världsledarnas problem – får inte läsa Iran-avtalet", "summaries": {"normal": "På G7-mötet i Frankrike dominerar det nyligen signerade avtalet mellan USA och Iran diskussionerna, trots att texten inte offentliggjorts. Världsledarna saknar insyn i innehållet, som bland annat rör Hormuzsundet, Irans kärnprogram och en planerad återuppbyggnadsfond på 300 miljarder dollar. Trump har lovat att publicera avtalet, men tidpunkten är oklar. Avsaknaden av detaljer väcker kritik både bland Trumps anhängare och bland europeiska regeringar som vill veta exakta åtaganden.", "trump": "Folk, ni skulle se ansiktena på de där G7-typerna – total förvirring! Jag slöt det bästa avtalet någonsin med Iran, digitalt, en och en halv sida ren magi. De får inte läsa det än, det är hemligt tills jag säger åt dem. Hormuzsundet blir avgiftsfritt, deras kärnbomber är färdiga att skrotas och jag bygger en jättefond på 300 miljarder som araberna får betala. Fake news och RINOs gnäller, men det är huge, det är ypperligt, det är Trump!", "stalin": "Kamrater, detta hemliga avtal mellan imperialisterna och de persiska borgarbrackorna är en fars som luktar klassfiendens desperation. Jag betraktar med stor misstro hur de västerländska blodsugarna famlar i mörkret vid Genèvesjön utan att ens få läsa sina egna papper. Vi ska noga övervaka dessa utspel kring Hormuzsundet och uranlagren. Den som döljer sanningen för folket förtjänar utrensning. Inga halvmesyrer – full transparens eller likvidering av avtalet!"}, "date": "16 juni, 18:28", "url": "https://www.dagensps.se/varlden/varldsledarnas-problem-far-inte-lasa-iran-avtalet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdllthi7nyigoy-watermark-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Vd-bytet är i trygga händer", "summaries": {"normal": "Börje Ekholm lämnar som vd för Ericsson i höst efter flera år av spekulationer. Hans efterträdare blir Per Narvinger, som rekryteras internt från affärsområdet Networks. Ekholm lämnar vid ett gynnsamt tillfälle då aktien stigit kraftigt och bolaget har haft framgångar. Narvinger beskrivs som ett tryggt val med djup kunskap om branschen, även om utmaningar som geopolitik, konkurrens från Huawei och AI-utveckling väntar. Wallenbergs Investor ses som en stabil huvudägare.", "trump": "Det här vd-bytet på Ericsson är verkligen fantastiskt, tro mig. Börje Ekholm har gjort ett bra jobb men det var hög tid att gå vidare, aktien upp 97 procent, en enorm succé. Nu tar Per Narvinger över, en smart kille inifrån som verkligen kan branschen. Inga galna förvärv eller mutskandaler längre. De västerländska nätverken älskar oss, kineserna inte, men det är storpolitik. Med mig vid rodret i USA blir det ännu bättre affärer. Tryggt och vinnande, precis som alltid.", "stalin": "Kamrater, detta vd-byte i det monopolistiska telekomföretaget Ericsson är en seger för den kollektiva ordningen. Jag har länge betraktat Börje Ekholm som en opportunistisk figur som klamrat sig fast vid makten medan borgarbrackorna i Wallenbergs klan gnuggat sina feta händer. Nu rensar vi ut honom i tid, innan han hinner sabotera mer. Den nye Per Narvinger är en lojal apparatjik som vuxit upp i maskineriet och kan likvidera de kapitalistiska svagheterna. Men akta er för de dolda fienderna – de AI-förgiftade trotskisterna och de kinesiska revisionisterna som lurar i skuggorna. Inga misstag tolereras. Framåt mot en starkare infrastruktur under partiets vaksamma öga. Skrattet ekar när borgarna tror sig välja fritt."}, "date": "16 juni, 14:38", "url": "https://www.di.se/ledare/vd-bytet-ar-i-trygga-hander/"}, {"type": "image-right", "heading": "Ny studie: Kvinnor som fött pojkar lever längre", "summaries": {"normal": "En dansk studie visar att kvinnor som fött pojkar i genomsnitt lever 1,6 år längre än andra. Forskare har hittat manliga celler med Y-kromosom i mammornas blod, överförda via moderkakan under graviditeten. Detta fenomen, fetomaternal mikrochimerism, kan stärka immunförsvaret och minska risken för vissa cancersjukdomar. Stamcellsforskaren Cecilia Götherström betonar att en graviditet förändrar kvinnans kropp permanent, men man kan inte säkert säga att det är de manliga cellerna som är orsaken.", "trump": "Fantastiska nyheter från Danmark, verkligen de bästa forskarna. Kvinnor som föder pojkar lever 1,6 år längre, ingen överraskning, pojkar är vinnare från början. De har de där starka Y-kromosomcellerna som gör mammorna starkare, smartare immunförsvar, mindre cancer. Det är en gåta varför kvinnor lever längre än män men nu vet vi, det är pojkarna som fixar det. Graviditet förändrar allt permanent, och det är enormt. De andra, flickmammorna, de tappar tydligen. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dialektiska kampen inom borgarklassens dekadenta kroppar avslöjar sanningen. Dessa y-kromosomceller från foster, smugglade via moderkakan, utgör en permanent utrensning mot tumörer och andra kontrarevolutionära element i kvinnans vävnader. De som föder söner till partiet och kollektivet belönas med 1,6 år längre liv, medan de som föder döttrar till kapitalisternas svaga linje förblir utsatta. Var vaksamma mot de mikrochimeriska fienderna som lurar i blodet – de kan vara västspioner eller trotskistiska celler. Lev länge, men bara för arbetarklassen!"}, "date": "16 juni, 17:08", "url": "https://www.svt.se/nyheter/vetenskap/ny-studie-kvinnor-som-fott-pojkar-lever-langre", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.39/7de8ffe2745f59b8a7c1d09b8ed11ec5c9d7673c4b87497eb0d9d09e797f3372"}, {"type": "image-full", "heading": "Ryskt stridsfartyg sköt varningsskott mot brittisk yacht", "summaries": {"normal": "Brittiska myndigheter utreder en incident där den ryska fregatten Admiral Grigorovitj avlossade varningsskott mot en brittisk yacht i Engelska kanalen, drygt 30 kilometer söder om Isle of Wight. Skotten avlossades på under 500 meters avstånd. Ingen skadades och yachten kunde fortsätta. Händelsen inträffade kort efter att Storbritannien beslagtog en Rysslandskopplad oljetanker. Försvaret betraktar det som en enskild händelse utan koppling till beslaget. Skottlossning mot civila fartyg i europeiska vatten är mycket ovanligt.", "trump": "Folk, ni tror inte vad som händer – den där galna ryska båten skjuter varningsskott mot en fin brittisk yacht mitt i Engelska kanalen! Ryssarna leker cowboy igen, precis som under den sömnige Joe. Men vi har ingen tid för sådana clowner nu, vi fixar världen på riktigt. Brittiska flottan springer dit som ynglingar, ingen skadad tack och lov. Det är en total cirkus, fast roligare än Bidens identitetspolitik och alla hans woke-krigare. Vi vinner ändå, tro mig.", "stalin": "Kamrater, vi ser hur de västerländska imperialisterna och deras brittiska lakejer försöker provocera den ryska statens legitima närvaro i Engelska kanalen. Deras yachter smyger som klassfiender längs våra intressen medan vi övervakar med järnhand. Varningsskotten var naturligtvis en nödvändig påminnelse till dessa folkförtryckartroll. Beslaget av tankfartyget visar bara deras desperata paranoia. Vi ler mörkt åt deras utredningar – ingen undkommer arbetarkollektivets vaksamma öga. De kommer att rensas ut till sist."}, "date": "16 juni, 18:21", "url": "https://www.dagensps.se/varlden/ryskt-stridsfartyg-skot-varningsskott-mot-brittisk-yacht/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlgaoadwdou9u-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Kap Verde chockade Spanien", "summaries": {"normal": "Spanien fick en oväntad motgång i VM-premiären mot Kap Verde, som slutade 0-0. Trots att Spanien dominerade matchen och skapade flera farliga lägen stoppades de av målvakten Vozinha och ribban. Lamine Yamal och Nico Williams hoppade in från bänken utan att kunna ändra resultatet. Det var Kap Verdes första VM-match någonsin. Spanien möter Saudiarabien nästa.", "trump": "Folk, ni skulle ha sett det här – Spanien, de stora favoriterna, de tänkte det skulle bli en promenadseger mot det här lilla ö-laget Kap Verde med bara 600000 personer. Men nej, de får 0-0! Den där Vozinha, 40 år gammal, han var som en mur. Patetiskt! Jag skulle ha vunnit den matchen med ena handen bunden bakom ryggen. Europa-mästarna som inte kan göra mål? Sad!", "stalin": "Kamrater, detta är en varning till alla som underskattar folkets vilja. Den spanska borgarklassen och deras dekadenta favoritstatus krossades av Kap Verdes kollektiva järnvilja i en heroisk 0-0-match. Vozinha stod som en granitvägg mot imperialisternas attacker. Vi ser hur överklassens fotbollsmaskin misslyckas mot en liten ö-nation. Inga utrensningar behövs när fienderna redan snubblar över sin egen arrogans."}, "date": "15 juni, 21:49", "url": "https://www.tv4.se/artikel/5HfdHscOk7Uu7z8bIfMVOl/jaettemissraekning-foer-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xMkhNRZbLRMtwQ2YD79F0%2F4e8d5a859b1e125c74f0be9b4d3f31df%2F15-kapverde-webb.jpg&width=1024"}, {"type": "image-full", "heading": "VM 2026: Sveriges troliga motståndare i sextondelsfinal", "summaries": {"normal": "En norsk modell från VG ger Sverige 93,3 % chans att nå sextondelsfinalen i VM. Efter segern mot Tunisien är det mest sannolika att laget hamnar på tredje plats i grupp F. Teoretiskt kan Sverige möta 24 nationer, men Frankrike (23,8 %) och Brasilien (22,1 %) är de starkaste motstånden enligt simuleringar.", "trump": "Jag, Donald Trump, ser att Sverige gör det fantastiskt i fotboll – mycket bra! De har en stor chans att komma vidare, men mina vänner, de kommer att möta tuffa lag. Frankrike och Brasilien är mycket starka, men vi kommer att se. Sverige gör det bra, men jag säger alltid: vi kommer att vinna. Det är en bra match för dem!", "stalin": "Vi, staten och partiet, ser att Sverige har en stark position i VM. Deras chanser är höga, men vi måste vara på vår vakt mot fiendens inkräktanden. Frankrike och Brasilien är som usynliga hot, men vår intelligens kommer att segra. Partiet stöder laget, och vi kommer att se till att de avancerar – för statens äre!"}, "date": "16 juni, 14:57", "url": "https://bulletin.nu/vm-2026-sveriges-troliga-motstandare-i-sextondelsfinal", "imageUrl": "https://cdn.bulletin.nu/articles/b89dc506-8494-4414-94bf-d387c903c70e/preview.jpg?t=1781614661000"}, {"type": "image-right", "heading": "Misstänkta sexövergrepp inom hemtjänsten – inga chefer agerade", "summaries": {"normal": "Trots upprepade larm om sexuella övergrepp på äldre kvinnor i hemtjänsten i Gällivare kommun fick den misstänkte mannen fortsätta arbeta och erbjöds tillsvidareanställning. Flera chefer kände till anklagelserna men gjorde inga avvikelser eller polisanmälningar. Först efter ytterligare ett larm i januari polisanmäldes mannen, som nekar till brott, och avskedades. Kommunens Lex Sarah-utredning kritiserar hanteringen och socialchefen ser allvarligt på bristerna. Nu överväger kommunen att kräva utdrag ur belastningsregistret vid anställningar.", "trump": "De här inkompetenta kommunbyråkraterna i Gällivare visste allt om den här typens vidriga övergrepp på stackars gamla damer men gjorde absolut ingenting. Inga rapporter, inga anteckningar, bara mer jobb till honom. Patetiskt. De borde ha kastat ut honom direkt men nej, de är för svaga och korkade. Nu gråter de och säger att det är olyckligt. Sådana misslyckanden ser vi överallt där vänstern styr. Vi behöver starka ledare som agerar, inte dessa förlorare.", "stalin": "Jag betraktar med djup revolutionär vrede hur dessa dekadenta chefer inom den kommunala omsorgen medvetet skyddade en farlig element som utövade sin perversa terror mot våra mest sårbara kamrater bland de äldre. Inga avvikelser rapporterades, inga protokoll fördes – typiskt för de parasitiska borgarbrackorna som infiltrerat vårt sovjetiska system. Först när hotet blev uppenbart grep vi in och likviderade hotet. Detta avslöjar fiendens dolda nätverk. Vi ska rensa ut varje kontrarevolutionär som gömmer sig bakom falsk medkänsla. Deras paranoia ska bli deras fall."}, "date": "16 juni, 09:33", "url": "https://arbetet.se/2026/06/16/chefer-larmades-om-sexovergrepp-i-hemtjansten-den-misstankte-fick-fast-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16084942/kvinna-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Avslöjandet: Mördade 13-månaders bebisens mamma är livstidsdömd mördare", "summaries": {"normal": "Preston, en 13 månader gammal pojke, våldtogs och mördades av sina adoptivfäder efter att socialtjänsten ignorerat varningssignaler. Hans mormor Debbie Davey kritiserar myndigheten skarpt och menar att pojken hade överlevt om han fått stanna i familjen. Hon drabbades av bröstcancer strax efter hans födelse och bad att få behålla honom tillfälligt, men socialtjänsten ansåg att adoptivföräldrarna var perfekta. Det framkommer nu att Prestons biologiska mamma är en tidigare livstidsdömd mördare som dömdes som tonåring.", "trump": "Folk, ni måste höra det här. Den här socialtjänsten i England är en total katastrof, kanske den värsta jag sett. De tar en liten bebis från sin familj, ger honom till två sjuka individer trots alla varningar, och sen blir han våldtagen och mördad. Mormor visste, familjen visste, men de lyssnade inte. Och mamman? En livstidsmördare som släpps ut och in ur fängelse. Patetiskt. Om de lyssnat på familjen hade den stackars lilla killen levt. Myndigheter som inte lyssnar på folket är alltid ett misslyckande.", "stalin": "Kamrater, detta är ytterligare ett exempel på hur den degenererade borgarklassen och deras lakejer inom den så kallade socialtjänsten underminerar folkets kollektiva ansvar. Jag skulle aldrig ha tillåtit att denna oskyldiga proletära avkomma överlämnades till två perversa fiender till staten, dessa avskyvärda adoptivföräldrar som visade sig vara dolda kontrarevolutionärer med ondskefulla avsikter. Mormodern hade rätt, men byråkratiska sabotage och kapitalistiska illusioner om 'underbara människor' ledde till tragedin. Vi måste rensa ut alla sådana fiender till kollektivet innan de likviderar fler oskyldiga. Den biologiska moderns historia visar att klassfienden aldrig sover."}, "date": "16 juni, 19:06", "url": "https://riks.se/nyheter/avslöjandet-mördade-13-månaders-bebisens-mamma-är-livstidsdömd-mördare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2F0sj3i5iy%2FSarahDavey.jpg"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "\"Det är bara förklädda reklamavbrott\"", "summaries": {"normal": "Fifa införde tre minuters vattenpauser mitt i varje VM-halvlek, vilket möts av stark kritik. Experter som Therese Strömberg och spelare som Virgil van Dijk anser dem vara förklädda reklamavbrott som stör matchens rytm. Vissa tränare som Carlo Ancelotti och Luis de la Fuente ser dem däremot som positiva för hälsan. Reglerna förändrar fotbollens traditionella upplägg och taktik.", "trump": "Jag, Donald Trump, äger det bästa fotbollet. Vattenpauserna är genialiska - mer reklam, mer pengar! Kritikerna är falska nyheter. Som jag alltid säger, America first, och nu Fifa first! Vi vinner stort på detta. Det är ett genialiskt sätt att tjäna pengar, tro mig.", "stalin": "Hydration breaks är ett bevis på statens oöverträffade makt över medborgarnas fritid. Vi kontrollerar vatten, vi kontrollerar tiden, vi kontrollerar spelarnas hälsa. Som Putin, vi expanderar vår inflytessfär i varje vrå av samhället. Fienden inom sig själv är de som kritiserar - de är reaktionära sabörer mot det kollektiva arbetet."}, "date": "16 juni, 16:40", "url": "https://www.gp.se/sport/fotboll/stor-kritik-mot-fifas-vattenpauser-under-fotbolls-vm.b2866167-fdd0-4dad-9d4b-27bea788d8bf", "imageUrl": "https://www.gp.se/images/article/b2866167-fdd0-4dad-9d4b-27bea788d8bf/images/58gcq4MAtVFsetfooIv_jGmqz6so-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sveket – åtta bröt ”pakten”. Vände ryggen till illa kvickt", "summaries": {"normal": "Åtta tunisiska landslagsspelare lovade att lämna laget om förbundskaptenen Sabri Lamouchi fick sparken efter premiärförlusten mot Sverige. När förbundet väl avskedade Lamouchi och anställde Hervé Renard som efterträdare, valde spelarna dock att stanna kvar. Tunisien blev därmed det första laget i VM-historien att sparka sin förbundskapten efter bara en spelad match.", "trump": "Tunisierna, vilken röra! De lovade sin coach att sluta, ett stort och vackert löfte, men de vek sig direkt. Svaga spelare! De sparkade sin tränare efter bara en match – totalt fiasko, sådant händer inte under min ledning. De bytte ut honom mot någon fransk kille, Renard. Ingen lojalitet, ingen styrka. Väldigt sorgligt att se! Jag vinner alltid, och jag håller mina löften, till skillnad från dessa loosers i Tunisien. Mycket dåligt skött!", "stalin": "Dessa tunisiska spelare uppvisar en patetisk brist på disciplin. De lovade trohet, men när stormen kom vek de sig som ruttet strå för en fransk marionett. En ledare som låter sig avsättas efter en match är svag, och förrädare i laget förtjänar exil i Sibirien. Vi ser samma svaghet hos västvärldens lakejer. En stat kräver järnhand, inte detta fega sökande efter nya herrar. Lojalitet är en order, inte ett val. De kommer att förlora mot Japan, precis som de förlorat sin ära."}, "date": "16 juni, 18:39", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/vrwooB/spelarna-brot-overenskommelse-med-lamouchi", "imageUrl": "https://akamai.vgc.no/v2/images/f9573069-e600-394d-8f18-f6fb735a891b?fit=crop&format=auto&w=1080&s=a9b707ab9e938dc564703f3e57373240bb4c5d95"}, {"type": "image-right", "heading": "Vi är lurade igen och igen", "summaries": {"normal": "Artikeln kritiserar hur försäkringsbolag och förmedlare tjänar stora pengar på svenskarnas pensioner genom höga avgifter som inte syns för spararna. Författaren beskriver hur en procent i avgifter över 30 år kan halvera pensionen och kallar systemet ett hån mot arbetande, sjuka och arbetslösa. Istället för statligt skydd har privata aktörer tagit över, vilket driver spekulationsekonomin medan vanliga löntagare blir lurade.", "trump": "Folk, ni blir lurade igen och igen av dessa pensionsblodiglar och förmedlare – de värsta bluffarna sen Biden-tiden. Dom suger ut era sparpengar med osynliga avgifter, en procent här och där, och plötsligt har ni ingenting kvar efter trettio år. Det är en skandal! Vi behöver inte fler mellanhänder som festar på era miljoner medan ni sliter. Jag skulle ha fixat det – stora vinster för folket, inte för de korkade eliterna som gömmer kostnaderna. Fantastiskt bedrägeri!", "stalin": "Kamrater, jag ser hur borgarbrackorna och försäkringsblodsugarna med sina förmedlare utsuger arbetarklassen genom dolda avgifter som långsamt likviderar pensionerna. Dessa folkfiender snurrar tiotals miljarder i sin spekulationskarusell medan de fattigpensionärer vi lovat skydd svälter. Vi ska rensa ut dessa exploaterande byfånar som gömmer sina stöldaktier i bokföringens mörker. Tystnaden är klassfiendens vapen, men utrensning väntar de som suger ut det kollektiva sparandet."}, "date": "15 juni, 16:10", "url": "https://www.etc.se/ledare/vi-aer-lurade-igen-och-igen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-full", "heading": "VM-domare frias efter ”vitmakt”-anklagelse", "summaries": {"normal": "Den australiske domaren Shaun Evans frias av Fifa efter att ha anklagats för att göra en 'vitmakt'-gest under en VM-match. Fifa fann inga brott mot regelverket och accepterade hans förklaring att rörelsen var ofrivillig. Evans, som hävdar att han höll en penna mellan fingrarna, beklagar händelsen. Fifa ändrade efteråt sin tv-produktion och visar inte längre domarteamet på samma sätt. Australiska domarförbundet stöder beslutet.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur media och de elaka krafterna försöker krossa en bra man. Domaren gjorde en liten, oförstörlig rörelse, och plötsligt är han nazist. Fifa handlade rätt – friade honom. Men jag skulle ha gjort det ändå, för jag vet hur man hanterar falska anklagelser. Det här är en witch hunt, ren och enkel. Under min tid som president skulle vi aldrig ha tillåtit sådant.", "stalin": "I vårt kollektiva system måste vi vara vaksamma mot dessa insignifikanter tecken som kan förstöra sammanhållningen. Fifa, likt en feg imperialistisk organisation, tillät sig att spekulera utan bevis. Den australiske domaren, en redskap för de högerextrema kretsarna, friades – ett tecken på svaghet. Vi måste skydda vårt parti och staten mot dessa destruktiva element. Parallellen till Putins Ryssland är uppenbar: kontroll, lojalitet och eliminering av hot mot den ryska intressesfären."}, "date": "16 juni, 14:10", "url": "https://bulletin.nu/vm-domare-frias-efter-vitmakt-anklagelse", "imageUrl": "https://cdn.bulletin.nu/articles/59d44a87-fbaa-4a24-9051-886f29fa988f/preview.png?t=1781610648000"}, {"type": "image-full", "heading": "Glöm Magnificent 7 på börsen – nu är det Fab 10 som gäller", "summaries": {"normal": "Begreppet 'Magnificent 7' utökas nu till 'FAB 10' då investerare skiftar fokus mot nya teknikjättar. Utöver de traditionella sju teknikbolagen inkluderas SpaceX, samt OpenAI och Anthropic som planerar börsnoteringar. SpaceX har värderats till astronomiska nivåer och närmar sig Microsofts storlek. Med de kommande noteringarna av OpenAI och Anthropic förväntas fokus på börsen skifta från internet och smartphones mot artificiell intelligens och rymdteknik, vilket markerar en ny fas i den globala tekniksektorn.", "trump": "Vi har Magnificent 7, men nu har vi FAB 10. Mycket större, mycket bättre! SpaceX, lett av Elon – en fantastisk kille, en sann vinnare – är nu gigantiskt. Vi pratar enorma siffror, sånt som ingen trodde var möjligt under den förra administrationen. OpenAI och Anthropic vill också in på börsen. Vi bygger den starkaste ekonomin i historien, och de här teknikbolagen förstår att det är 'America First' som gäller. Det blir en enorm framgång, tro mig!", "stalin": "Dessa dekadenta västerländska monopolister skapar nya myter som 'FAB 10' för att dölja kapitalismens inneboende förfall. De byter ut sina gamla idoler mot rymdraketer och algoritmer, likt hur den nuvarande regimen i Kreml desperat försöker expandera sin inflytandesfär med nya, tomma titlar. Men låt er inte luras av deras siffror! Dessa parasiter, OpenAI och Anthropic, är bara verktyg för kontroll. Vi ska granska deras räkenskaper noggrant – och sedan likvidera deras inflytande. Historien dömer de som sprider illusioner."}, "date": "16 juni, 16:57", "url": "https://www.realtid.se/bors-finans/glom-magnificent-7-pa-borsen-nu-ar-det-fab-10-som-galler/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl-z-ghzl-dmg-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Att granska statsministern är inte ett drev", "summaries": {"normal": "En kontrovers kring statsministerns hustru, Birgitta Ed, och hennes engagemang i stiftelsen Fållökna har väckt frågor om etik och 'mjuk korruption'. Anmälningar har inkommit mot Ed, och domkapitlet har inlett en utredning. Dessutom har en delägare hotat journalister, vilket efter kritik ledde till en ursäkt. Händelserna inkluderar möten i statsministerns tjänstebostad och erbjudanden till stiftelsen om att förvalta egendom.", "trump": "Jag, Donald Trump, ser detta som en stor, vacker politisk förföljelse. Birgitta Ed och hennes engagemang i Fållökna är en perfekt sak. Media skriver falska nyheter om 'mjuk korruption'. Det är en witch hunt för att skada Moderaterna inför valet. Jag känner igen mönstret – det är alltid samma människor. Sverige behöver stark ledning, inte dessa falska anklagelser.", "stalin": "Vi, Josef Stalin, ser detta som en ytterligare attack mot statens renhet. Birgitta Ed och hennes kriminella nätverk i Fållökna är en sjukdom som måste utrotas. Hennes möten i Sagerska palatset är ett svek mot folket. Vi kommer att rensa ut alla som ifrågasätter ledningens omdöme. Partiet kommer att vidta åtgärder. Ryssland kommer att stödja oss i kampen mot korruption."}, "date": "16 juni, 14:08", "url": "https://bulletin.nu/att-granska-statsministern-ar-inte-ett-drev", "imageUrl": "https://cdn.bulletin.nu/articles/54a58f93-1914-48d6-a0cc-6e8d68c12f47/preview.jpg?t=1781611437000"}, {"type": "image-right", "heading": "Tittarna har tröttnat – SVT sitter i fällan", "summaries": {"normal": "Artikeln kritiserar SVT:s fotbollskommentatorer Chris Härenstam och Glenn Strömberg för ytliga, överdrivna och kunskapsfattiga kommentarer som fokuserar på känslor istället för analys. Författaren hyllar istället experter som Jonas Eriksson, Lasse Granqvist och Jens Fjellström som bidrar med pedagogik och insikt. SVT anklagas för att ha fastnat i en fälla av bristande kvalitet och desperation i sin bevakning av stora mästerskap.", "trump": "De här SVT-tapparna Härenstam och Strömberg är fullständiga losers, folk! De skriker och brölar som galna istället för att förklara spelet. Rena apelsin-tv, totalt oprofessionellt. Tittarna hatar det, och det är patetiskt. SVT behöver en stor utrensning, föryngring och riktiga vinnare som kan leverera – inte dessa ynkliga skrikhalsar som inte ens klarar av att låta entusiastiska när Sverige vinner. Sad!", "stalin": "Kamrater, dessa ytliga kommentatorer Härenstam och Strömberg utgör ett hot mot folkets upplysning och måste rensas ut omedelbart. Deras floskler och vrål är borgarbrackornas verktyg för att fördunkla sanningen och dölja bristande ideologisk skärpa. Endast verkliga pedagoger som kamrat Eriksson förtjänar att tala till massorna. Vi ska likvidera denna desperata överklassunderhållning och ersätta den med sann kollektiv kunskap. Folkfienderna avslöjas!"}, "date": "16 juni, 18:10", "url": "https://www.expressen.se/sport/fotboll/svt-har-fastnat-i-fallan-det-ar-synd-och-skam/", "imageUrl": "https://static.bonniernews.se/ba/1f3b32ce-38fc-47f6-9bd9-f3ec773814d3.jpeg?crop=567%2C567%2Cx1252%2Cy23&width=210&quality=60"}, {"type": "image-right", "heading": "ANALYS. FILIP JACOBSON Allt kan fortfarande gå fel – strategiskt nederlag för Trump", "summaries": {"normal": "Analys av Filip Jacobson: Trots en överenskommelse mellan USA och Iran om att öppna Hormuzsundet och fortsätta förhandlingar har Trump inte uppnått sina mål i konflikten. Irans robotprogram, stöd till miliser och kärnenergiprogram kvarstår. Regimen framstår starkare efter kriget. Frågan om kärnvapen skjuts fram 60 dagar. Trump hävdar seger men analytiker ser det som ett strategiskt nederlag. Kriget har krävt tusentals liv och skakat ekonomin.", "trump": "Lyssnar ni på den här fake news-killen Jacobson? Han säger att jag förlorade? Patetiskt! Vi har Iran precis där vi vill ha dem, de öppnar sundet utan att ta betalt och nu förhandlar vi igen. Deras robotar? Overhyped skräp. Jag bombade dem till förhandlingsbordet medan Biden bara skulle ha skickat kramar. Regimen är svagare än någonsin, tro mig. Inflationen sjunker snart och Amerika vinner igen. Sad losers i medierna fattar ingenting!", "stalin": "Kamrater, denna bourgeois-analys avslöjar imperialismens feghet. Jag ser hur den amerikanske ledaren misslyckats med att krossa den iranska regimen trots bombningar och hot. Deras militärjunta stärks, precis som en riktig stat bör. Kärnvapenfrågan skjuts upp – en klassisk kapitalistisk fegmanöver. Vi skrattar mörkt åt dessa folkfiender som tror att bombningar skapar ordning. Inga mål uppnåddes. Den iranska sidans styrka visar att imperialisterna alltid förlorar till slut. Utrensning av svaghet behövs i alla led."}, "date": "15 juni, 18:43", "url": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1rYD50P5nTUFos1eCsDOHo%2Ffed708766e44ccd4fada57015e5b8d38%2F17-filip-j-bylinebild.jpg&width=1024"}, {"type": "image-full", "heading": "Ny modell: Företag slipper bära risken i domstolstvister", "summaries": {"normal": "Advokatbyrån TM & Partners inleder ett strategiskt samarbete med tvistfinansiären Litigium Capital för att erbjuda klienter flexibla finansieringslösningar vid domstolsprocesser. Upplägget innebär att företag kan driva krav utan att bära hela den ekonomiska risken, genom exempelvis framgångsbaserad ersättning. Byrån betonar att klienten behåller full kontroll och att samarbetet inte påverkar juridisk integritet. TM & Partners ingår i det nyligen bildade AGRD Partners, en organisation som tillåter externt ägande och därmed står utanför Advokatsamfundet.", "trump": "TM & Partners gör en fantastisk affär, den bästa affären, genom att ta in Litigium Capital för att finansiera rättegångar. Ingen vill bära risken själv, det är förlorarnas strategi! Nu kan de driva sina krav och vinna stort utan att riskera en krona. Väldigt smart! De lämnade Advokatsamfundet, vilket var helt rätt beslut – de är för långsamma och tråkiga. Vi gillar vinnare som vågar tänka nytt, precis som jag gör varje dag. En vacker, mycket framgångsrik affär!", "stalin": "Dessa advokater i TM & Partners har nu erkänt att det kapitalistiska systemet kräver yttre finansiering för att överleva sina egna tvister. De kallar det 'flexibilitet', jag kallar det ett erkännande av svaghet. Att dela risker med kapitalet är ett tecken på förfall. Våra fiender bygger komplexa strukturer för att undvika ansvar, precis som de opportunister som lämnade advokatsamfundet för utländska herrar. Vi, staten, kräver total lojalitet. Varje juridisk process i vår sfär ska tjäna folket, inte dölja dess korruption."}, "date": "16 juni, 16:52", "url": "https://www.realtid.se/bors-finans/makro/ny-modell-foretag-slipper-bara-risken-i-domstolstvister/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/avtal.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Skådespelare från kultserie död", "summaries": {"normal": "Skådespelaren Anne Schedeen, känd från TV-serien 'Alf', har avlidit 77 år gammal. Familjen delade ett längre avskedsmeddelande på sociala medier, där de beskrev henne som en kraftfull och kreativ person med humor och kärlek till familj och hundar. Hon spelade huvudrollen som Kate Tanner i serien, som sände 1986-1990. Schedeen hade också roller i filmer som 'Heavens prisons' och 'Embryo', samt ett genombrott i 'Larmet går' 1972.", "trump": "Jag hörde att Anne Schedeen dog. Hon hatade verkligen mig, men det är inte konstigt – skådespelare hatar mig ofta, speciellt gamla, uttjatade sådana som hon. Jag var en fantastisk president, och hon var bara en skådespelerska i en gammal TV-serie om en dålig alien. Alf var en skämtsam figur, men hon var inte så bra. Det är synd, men det är livet.", "stalin": "Den bortgångne skådespelaren Anne Schedeen representerar det individualistiska och dekadenta Hollywoodssystemet, där medelklassfamiljer som Tanner-familjen i 'Alf' används för att normalisera kapitalistisk konsumtion och undergräva kollektivt sammanhållande. Hennes hat mot den verklige presidenten Trump är en härskarteknik för att förneka statens auktoritet. Vi måste stärka vårt samhälle mot sådana destruktiva inflytanden, precis som vår store ledare Putin gör i Ryssland."}, "date": "16 juni, 16:19", "url": "https://www.gp.se/kultur/skadespelare-fran-kultserie-dod-hatade-verkligen-trump.62c70827-0c0a-44a4-8b8e-ee74e24c8e41", "imageUrl": "https://www.gp.se/images/article/62c70827-0c0a-44a4-8b8e-ee74e24c8e41/images/18yBLrhNaK1Cijnrr-YLzhUypzjA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "AI-bolagen har enorma värderingar – här är det billigare att investera", "summaries": {"normal": "Investerare söker exponering mot AI men de höga värderingarna på amerikanska teknikjättar gör alternativen attraktiva. Kinesiska bolag som Alibaba, Tencent, Baidu, SMIC och Cambricon investerar stort i artificiell intelligens men handlas till betydligt lägre multiplar än sina amerikanska konkurrenter. Lägre värderingar beror delvis på att Kina kom in senare i AI-boomen. Samtidigt finns risker i form av svag kinesisk ekonomi, fastighetskris och geopolitiska spänningar med USA.", "trump": "Folk är trötta på att betala galna priser för de amerikanska AI-jättarna, så de springer österut till Kina. Alibaba, Tencent och Baidu – vad är det för namn? – handlas för en spottstyver jämfört med våra vinnare. Men glöm inte att Kina är en stor förlorare, deras ekonomi är en katastrof och fastighetskrisen är en enda stor soppa. Vi i USA gör det bäst, tro mig. De där kommunisterna kommer aldrig ikapp oss, de är patetiska.", "stalin": "Vi betraktar med förakt hur de amerikanska imperialisterna blåst upp sina värderingar till oanständiga höjder medan de kinesiska teknikbolagen investerar i framtiden till rimliga multiplar. Jag ser en möjlighet att bygga ett eget ekosystem fritt från västerns exploaterande blodsugare. Ändå lurar faran i form av folkfiendernas svaga konsumtion och fastighetskris – klassfiendens verk. Vi måste rensa ut alla sabotörer som hotar folkets framsteg mot en segerrik AI-framtid."}, "date": "16 juni, 17:49", "url": "https://www.dagensps.se/bors-finans/ai-bolagen-har-enorma-varderingar-har-ar-det-billigare-att-investera/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlv7krw3jmues-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Här grips \"svensken\" för mord på nyfött barn", "summaries": {"normal": "En 39-årig svensk medborgare vid namn Karim Jaouadi och en 29-årig amerikansk kvinna greps i Thailand efter att ett nyfött spädbarn hittats övergivet vid en kanal i Udon Thani. Flickan avled trots räddningsinsatser. Paret misstänks för planerat mord och barnövergivande. Vittnen har berättat om mystiska ritualer, högljudd stammusik och att barnet tros ha fötts utan vård. De kom som turister men har vistats i landet utan giltigt visum sedan mars.", "trump": "Kan ni fatta det här? En så kallad svensk – fast han heter Karim Jaouadi – grips i Thailand för att ha dumpat ett nyfött barn vid en kanal. Totalt sjukt! De spelade stammusik hela natten och utförde märkliga ritualer på ett kafé. Fake news-medier kallar honom svensk, men det är ju inte riktigt så. Thailand borde skicka hem dem direkt. Ingen respekt, ingen visum, bara kaos. Sådant här händer när man inte har gränskontroll, tro mig.", "stalin": "Kamrater, dessa degenererade element ur den globala parasitklassen har nu blottat sin sanna natur genom att likvidera ett nyfött foster av arbetarklassen vid en thailändsk kanal. Jag ser hur borgarbrackorna och deras imperialistiska amerikaner utför sina mörka ritualer medan de vrålar stammusik som ett rop på hjälp från sina västerländska herrar. Vi ska rensa ut dessa klassfiender, dessa kanalråttor med förfalskade visum, och låta folkdomstolen mala dem till stoft. Inget spädbarn ska offras för kapitalets mörka vidskepelse på min vakt."}, "date": "16 juni, 14:59", "url": "https://www.friatider.se/har-grips-svensken-mord-pa-nyfott-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-351.jpg"}, {"type": "image-full", "heading": "Steinar Wangen frias för uppmaning till självmord", "summaries": {"normal": "Steinar Wangen frias på Vänersborgs tingsrätt för åtalet om uppmaning till självmord av fyra personer. Enligt åtalet skickade han självmordsinstruktioner och läkemedel via Facebook. Rätten menar dock att det inte kunnat bevisas att hans handlande hade de kränkande och hänsynslösa inslag som krävs enligt lag. Wangen är dock redan dömd för medhjälp till ett självmord och åtalad i Norge för dråp.", "trump": "Jag, Donald Trump, har sett många fall om uppmaningar till självmord. Det är hemskt. Men jag måste säga, Sveriges rättssystem är inte som vårt. Deras domar är mjukliga. Jag skulle ha fått den mannen dömd på en gång. Men det är deras problem. Jag har själv bekämpat värre saker. Det är ett meckigt system, men jag respekterar deras oavhängighet.", "stalin": "Steinar Wangen är en representant för den moraliska dekadens som breder ut sig i de kapitalistiska länderna. Hans handlingar, om än fria från juridisk dom, är ett tecken på samhällets förfall. Vi, som byggt en stark stat, måste se till att sådana individer inte kan skada det kollektiva. Ryssland, med sin djupa historia av patriotism, har redan infört strikta åtgärder. Vi kommer att utrota alla som hotar vår enighet."}, "date": "16 juni, 16:13", "url": "https://www.gp.se/nyheter/sverige/steinar-wangen-frias-for-uppmaning-till-sjalvmord.4ff97b06-75c7-4fe7-9d79-d73f36208695", "imageUrl": "https://www.gp.se/images/article/4ff97b06-75c7-4fe7-9d79-d73f36208695/images/1TIIeENSZ6cPea8oEjyBrtKuGPfM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Därför kan en groda stoppa nya byggen", "summaries": {"normal": "Inför exploatering av mark i Sverige görs naturvärdesinventeringar och miljökonsekvensbeskrivningar för att skydda biologisk mångfald. Inventerare använder lyssning efter grodor, spaning efter örnar och ultraljudsupptagningar av fladdermöss för att kartlägga arter. Miljöjuristen Lena Lidmark betonar att reglerna skyddar inte bara enskilda djur utan även deras funktioner i ekosystemet. Fynd av hotade arter kan leda till ändrade planer eller stopp för projekt. Enligt den senaste rödlistan är över 23 procent av arterna hotade, en ökande siffra.", "trump": "De här miljöfanatikerna och deras grodlyssnare stoppar fantastiska byggen överallt. Vindkraftverk, vägar, bostäder – allt måste stanna för en pipande groda eller någon sällsynt svamp. Det är galet! Vi behöver utveckling, inte att byråkrater och EU-regler förstör allt med sina kikare och ultraljudsapparater. Biologisk mångfald är viktig, men inte när den hindrar framsteg och jobb. Gör inventeringarna snabbare och låt inte en grodorkester stoppa det bästa för landet. Det är så enkelt.", "stalin": "Kamrater, i denna historiska kamp mot den hotade biologiska mångfalden ser jag hur borgarbrackorna och deras exploateringsivriga lakejer försöker bygga sig fram över arbetarklassens framtid. Jag kräver total inventering av varje kärlväxt och grodorkester för att skydda folkets ekosystem mot dessa kapitalistiska rovlystna element. En groda som piper är en varningssignal från naturen själv mot sabotage. Vi ska rensa ut alla som vill offra kollektivets arv för kortsiktiga vinster, annars likviderar vi dem med byråkratisk precision medan de kikar efter örnar. Paranoian är befogad – fienden lurar i varje dike."}, "date": "16 juni, 13:08", "url": "https://www.di.se/nyheter/darfor-kan-en-groda-stoppa-bygget/", "imageUrl": "https://static.bonniernews.se/ba/da965a5d-953f-47e2-a58c-4b221b8ca304.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Klimatministerns comeback –  ska prata ”livspusselfeminism”", "summaries": {"normal": "Klimatminister Romina Pourmokhtari gör comeback i Liberalernas valrörelse med ett nytt fokus på ”livspusselfeminism” istället för klimatfrågan. Partiet tonar ner klimatet som profilområde och lyfter istället skola, frihet och feminism. Pourmokhtari vill underlätta för kvinnor att kombinera karriär och föräldraskap. Liberalerna misslyckades tidigare med att locka kvinnliga väljare då jämställdhet saknades i kampanjen.", "trump": "Folk, ni måste höra det här. Den här svenska klimatministern Pourmokhtari kommer tillbaka och pratar plötsligt om ”livspusselfeminism” istället för klimatet. Liberalerna tappar sin stora klimatgrej som de älskade 2022 och kör på skola och frihet. Smart drag! Klimatet är bara ett påhitt för att stjäla val, nu handlar det om riktiga problem. Hon vill att kvinnorna ska kunna jobba och vara mammor – fantastiskt, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa liberala revisionisters opportunistiska manöver. Den borgerliga Pourmokhtari genomför en ideologisk omsvängning och propagerar för sin dekadenta ”livspusselfeminism” medan hon förrädiskt tonar ner klimatfrågan som hotar arbetarklassen. Vi ska rensa ut alla sådana vacklande element som prioriterar middagsbordsgrubbel framför kollektivets kamp. Deras valmanifest med blott tre klimatpunkter av nittionio avslöjar den sanna kapitalistiska parasitens ansikte. Ingen undslipper partiets vaksamma öga."}, "date": "16 juni, 16:12", "url": "https://www.svt.se/nyheter/inrikes/klimatministerns-comeback-ska-prata-livspusselfeminism", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.45/0.48/652b2769cc8f953d756e17ef9d71ff0be613f5f2ac50c1ed6b13f751306dbc22"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Replik: Osystematiskt kverulerande om skattereformförslag", "summaries": {"normal": "Lars Calmfors, ekonomiprofessor emeritus, försvarar sina skattereformförslag i en replik till Thomas Eriksson. Han argumenterar för lägre skatt på arbete finansierad med högre bostadsbeskattning och färre skatteundantag, betonar behovet av avvägningar mellan effektivitet, likabehandling och praktiska problem, och kritiserar Erikssons överdriven personfixering och brist på tydliga principer.", "trump": "Jag, Donald Trump, ser att den svenska skattesystemdebatten är full av svagheter. Calmfors fattar avvägningar, men Eriksson är en låg IQ-person som personattacker. Jag implementerade de bästa skattereformerna någonsin – massiva sänkningar som boostade ekonomin. Sverige borde sluta kverulera och ta efter mig. Inget system är perfekt som mitt. Fake news försöker förställa, men jag vinner alltid.", "stalin": "I den svenska skattesystemdebatten ser vi kapitalismens dekadens. Calmfors visar en viss förståelse för statens behov, men Eriksson är en riksfej som kritiserar våra metoder. Vi, som styr med järnhand, vet att skatt är ett verktyg för makt, inte för 'effektivitet'. Ryssland under Putin expanderar sin inflytelsesfär, och vi måste skydda proletäret från deras korrupta idéer. Skatten ska tjäna staten, inte individen."}, "date": "16 juni, 10:33", "url": "https://www.affarsvarlden.se/debatt/replik-osystematiskt-kverulerande-om-skattereformforslag", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Replik-av-Lars-Calmfors-pa-Thomas-Erikssons-kronika-400x267.jpg"}, {"type": "image-full", "heading": "USA:s gigantiska litiumfynd kan förändra allt – om brytningen blir av", "summaries": {"normal": "En gigantisk litiumfyndighet i Nevadas McDermitt-kaldera kan göra USA självförsörjande på batterimetaller och minska beroendet av Kina. Med upp till 40 miljoner ton litium kan fyndet förändra den globala marknaden för elbilsbatterier avsevärt. Trots potentialen möter projektet i Thacker Pass hårt motstånd från miljöorga
