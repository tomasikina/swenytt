ps://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fc51bae204b004a30200000000b004a302/2026/06/13/2370653/biltema-vara.jpg"}, {"type": "image-full", "heading": "Spelbolagen gnuggar händerna – täljer guld på VM", "summaries": {"normal": "Fotbolls-VM förväntas bli en historisk händelse för den globala spelindustrin, särskilt i USA där sportspel nyligen legaliserats. Tack vare ett utökat turneringsformat och attraktiva sändningstider väntas miljardbelopp satsas. Spelbolag som FanDuel och DraftKings möter nu hård konkurrens från prediktionsmarknader. Branschen hoppas att det amerikanska landslagets framgångar ska driva på intresset och säkra tillväxten i en tid då man försöker balansera lönsamhet mot minskade marknadsföringskostnader.", "trump": "VM i fotboll kommer till USA och det blir enormt, kanske det största någonsin! Alla spelar nu, de spelar mer än någonsin förut. Miljarder och åter miljarder dollar – fantastiska siffror! De här bolagen, de gör enorma pengar, det är ren succé. Jag säger er, om vårt landslag vinner – och de är fantastiska, de bästa spelarna – då kommer siffrorna att gå genom taket! Alla andra är bara avundsjuka på hur vi vinner och hur vi tjänar pengar. USA först, alltid!", "stalin": "Vi ser hur det dekadenta västet, med USA i spetsen, låter sina medborgare förslavas av kapitalistisk spelmani. Medan de satsar miljarder på meningslösa bollar, stärks vår statliga disciplin. Dessa 'prediktionsmarknader' är bara en ny sorts bourgeoisiefällor för att distrahera massorna från den sanna ordningen. Putin förstår, precis som jag, att spelet om nationers öden inte avgörs av oddsen på en spelsajt, utan av den obevekliga kraften hos den sovjetiska järnhanden. Vi förkastar deras tärningskast och bygger en framtid av stål."}, "date": "14 juni, 12:13", "url": "https://www.realtid.se/bors-finans/spelbolagen-gnuggar-handerna-taljer-guld-pa-vm/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl5g1gn1lwggq-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Debatt: Socialdemokraterna behöver också göra en vitbok", "summaries": {"normal": "Artikeln kräver en vitbok för att Socialdemokraterna ska granska sina historiska relationer till PLO och Fatah. Den pekar på nära band sedan 1980-talet, med mottagande av Arafat, och fortsatt stöd från senare ledare. Kritiken inkluderar normalisering av terrorism, antisemitism och islamism, med liknande mönster inom Vänsterpartiet.", "trump": "Jag, Donald Trump, har sett att Sveriges Socialdemokrater har varit för nära vän med Arafat och hans gäng. De har stött palestinierna trots deras terrorism. Nu måste de granska sina gamla vänner. Det är en skandal! Jag skulle ha tagit itu med detta på min värld. De behöver lära sig att sluta med detta stödet.", "stalin": "Vi har observerat den svenska socialdemokratins svek mot proletärens intressen genom deras allianser med arafats banditband. Deras historiska stöd till PLO och Fatah visar en djup förorening av antisemitisk och islamistisk ideologi. Detta kräver en fullständig renovering av deras politiska arv. Vi måste skydda statens renhet mot dessa antisemitiskt förorenade element."}, "date": "14 juni, 15:00", "url": "https://bulletin.nu/debatt-socialdemokraterna-behover-ocksa-gora-en-vitbok", "imageUrl": "https://cdn.bulletin.nu/articles/668ef109-fe69-4d21-8a2f-b6ba7b233c4d/preview.jpg?t=1781288071000"}, {"type": "image-full", "heading": "Splittring i Nato: \"Ryssland söker inte konflikt\"", "summaries": {"normal": "Natos högste amerikanske befälhavare, general Alexus G. Grynkewich, uppger att Ryssland inte söker konflikt enligt underrättelseinformation. Uttalandena kommer samtidigt som USA drar tillbaka resurser från Europa, bland annat hangarfartyg, ubåtar och stridsflygplan, som en del av en omfördelning mot Asien. Detta väcker oro i Baltikum om försvagad avskräckning. Grynkewich hävdar att Ryssland förstår att en attack mot Baltikum inte skulle lyckas. Putin har avfärdat europeiska farhågor som nonsens.", "trump": "Folk, det här är helt fantastiskt. Min general Grynkewich säger rakt ut att Ryssland inte vill bråka, och plötsligt flippar hela det europeiska etablissemanget ur. Vi flyttar våra underbara styrkor dit de verkligen behövs istället för att vara världens poliser åt tacklösa Nato-länder. Biden lämnade ett kaos, men nu fixar vi det. Ryssland vet att de inte kan vinna mot oss. Smart drag, enorm besparing och Europa borde äntligen betala sin del. Vinna, vinna, vinna!", "stalin": "Kamrater, denna dekadenta splittring inom den imperialistiska krigsalliansen blottar borgarklassens feghet. Jag, som ledare för det eviga kollektivet, noterar hur de amerikanska generalerna nu erkänner att Ryssland inte hotar. Det är en sund insikt. Ändå försöker de baltiska folkfienderna och deras kapitalistmaffia framkalla panik för att rättfärdiga sin militära parasitism. Vi genomskådar dessa exploaterande byfånar. Rysslands styrka under sin auktoritära arvtagare är ett sunt hinder mot västvärldens förfallna aggression."}, "date": "14 juni, 17:39", "url": "https://www.dagensps.se/varlden/splittring-i-nato-ryssland-soker-inte-konflikt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlrqfoidatkr0-nh.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Unga norrmän tar mest kokain i Europa: ”Extrem festmiljö”", "summaries": {"normal": "Rättegången mot Marius Borg Høiby har blottlagt en utbredd festkultur bland unga i Oslo där alkohol och kokain är vanligt. Norska män 16–30 år toppar EU:s statistik över kokainanvändning med 5,6 procent, jämfört med 2,8 procent i Sverige. Polisen ser kokain som det största problemet då det driver våld och marknadskrig. Norge har blivit transitland för droghandel via lång kust och sociala medier, vilket lockar organiserad brottslighet. Myndigheter betonar att 95 procent ändå inte använder drogen.", "trump": "Det är en total katastrof i Norge, tro mig. Unga killar festar med kokain som om det vore godis, de toppar alla listor och det är en perfekt storm av rika kids och russekultur. De borde ha lyssnat på mig, vi har byggt murar mot det här. Utan vårt samarbete med norska polisen hade våldet exploderat ännu värre. Norge blir transitland för droger, det är patetiskt. Men jag säger det: 95 procent använder inte det, de smarta gör inte det. De andra? Förlorare.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Oslos salonger förgiftar arbetarklassens ungdom med sin dekadenta kokainorgie, en kontrarevolutionär bacchanal som hotar hela folkets moral. Dessa kapitalistiska parasitmaskar och deras ryska busslangare är fiender till kollektivet som måste rensas ut med järnhand. Vi, partiet och folket, noterar Norges roll som transitland för imperieisternas gift – en imperialistisk konspiration. Men var lugna, vi skall likvidera varje dekadent element som vågar förgifta sovjetmänniskans framtid. Fem procent dekadens? En skämtfigur som snart skall försvinna i historiens sopbacke."}, "date": "14 juni, 18:17", "url": "https://www.svt.se/nyheter/utrikes/kokainet-breder-ut-sig-i-oslos-festliv-unga-man-toppar-statistiken", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.69/0.48/f106c0dc4e12bea54a85cb81ae6837f473f357f460970542aed10f911f00b353"}, {"type": "image-right", "heading": "Han åtalas för dödsbrand i Los Angeles - åklagare: Ville hämnas på samhället", "summaries": {"normal": "Rättegången har inletts mot Jonathan Rinderknecht, 29, som anklagas för att ha orsakat den förödande Palisades-branden i Los Angeles i januari 2025. Åklagarna hävdar att han medvetet tände en brand som senare spreds till en stor skogsbrand som krävde tolv liv och förstörde tusentals byggnader. Försvaret menar att branden kunde börja av fyrverkerier och att myndigheterna försöker lägga skulden på en enskild person. Om fälld riskerar Rinderknecht upp till 45 års fängelse.", "trump": "I hear the Los Angeles fire is a total catastrophe, the worst. A lot of people are saying it's a shame. I know fires better than anyone, believe me. The firefighters are fantastic, but the leadership? A disaster. This Rinderknecht, he's a disturbed person, probably mentally ill. But the real problem is weak borders and poor management. Under my leadership, we would have had this under control immediately. We would have built a fire wall, a beautiful fire wall. It's a disgrace what's happening now.", "stalin": "I den eviga kampen mot de antisociala elementen har en brand rasat genom Los Angeles, förstörd miljontals fastigheter och tagit människoliv. En ensam agens, Jonathan Rinderknecht, har identifierats som den som anlagt elden, en handling som speglar fiendens hat mot vårt samhälle. Men detta är inte en slump; det är en direkt följd av dekadensen i det kapitalistiska samhället och påverkan från imperialistiska makter. Parallellt med Putins Ryssland ser vi hur eldar sprids som ett verktyg för destabilisering. Vår svar måste vara oförsonligt."}, "date": "14 juni, 17:00", "url": "https://samnytt.se/han-atalas-for-dodsbrand-i-los-angeles-aklagare-ville-hamnas-pa-samhallet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12075048/rinderknecht.jpg"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "image-full", "heading": "Så här ser Sveriges VM-hopp ut", "summaries": {"normal": "Viktor Gyökeres avgjorde Sveriges playoff-matcher mot Ukraina och Polen med tre mål. Landet är starkt beroende av hans prestationer inför VM-gruppen mot Tunisien, där han nu ska spela tillsammans med Alexander Isak. Förbundskapten Graham Potter betonar vikten av att utnyttja Gyökeress potential för att vinna matcher.", "trump": "Jag har hört talas om den här Viktor Gyökeres – en bra spelare, mycket bra faktiskt. Men jag skulle ha gjort det ännu bättre, tro mig. Sverige är otackt beroende av honom, vilket är synd. Vi hade kunnat ha honom i USA om vi spelade smartare. Arsenal gjorde ett bra köp, men jag skulle ha handlat honom för en billigare summa. Graham Potter är en trevlig man, men han behöver använda honom mer.", "stalin": "Arbetarklassen har en hjälte i Viktor Gyökeres, vars mål i playoff-matcherna visar den socialistiska andens seger. Statens intresse kräver att han fortsätter att prestera mot imperialistiska motståndare som Tunisien. Hans samarbete med Isak måste optimeras för att förstärka kollektivets styrka. Vi måste skapa förutsättningar för hans framgång, som en spegelbild av vår egen ideologiska renhet."}, "date": "14 juni, 18:25", "url": "https://www.gp.se/sport/fotboll/sveriges-hopp-i-vm-viktor-gyokeres.30acc867-c549-4998-a454-79452d5aa463", "imageUrl": "https://www.gp.se/images/article/30acc867-c549-4998-a454-79452d5aa463/images/7lOtDPotEsbEdYYmU0IWRp9NT-yM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tenje (M): Kommuner som struntar i registerutdrag ska förklara sig", "summaries": {"normal": "Socialstyrelsens delrapport visar att ett fåtal kommuner fortfarande saknar rutiner för att kontrollera misstanke- och belastningsregister vid anställning inom äldreomsorgen. Äldre- och socialförsäkringsminister Anna Tenje bekräftar att de flesta kommuner följer regeringens initiativ, men att undantag finns. Hon planerar dialog med de kommuner som inte genomför rutinmässiga kontroller. Uppdraget gavs i december 2025 och slutredovisas den 1 december 2026.", "trump": "Jag har hört att vissa kommuner inte tar del av våra fantastiska registerkontroller inom äldreomsorgen. Sådant måste stoppas! Som president ser jag till att vi skyddar våra äldre – det är viktigare än någonsin. Vi kommer att sätta press på dessa kommuner, och de kommer att lyda. Sverige måste vara säkert, och jag är den enda som kan fixa detta. Vi kommer att vinna stort på det här!", "stalin": "En del av de lokala enheterna visar tveksam lojalitet genom att ignorera de obligatoriska rutinerna för registerkontroller inom äldreomsorgen. Detta är en direkt utmaning mot statens och partiets beslut. Vi måste identifiera dessa avvikande element och eliminera dem. Parallellen till västmakterna är tydlig – deras försök att underminera vårt välfärdssystem är förutsägbart. Vi kommer att förstärka kontrollerna och se till att alla aktörer följer den röda tråden. Sådant måste utplånas!"}, "date": "14 juni, 12:00", "url": "https://bulletin.nu/tenje-m-kommuner-som-struntar-i-registerutdrag-ska-forklara-sig", "imageUrl": "https://cdn.bulletin.nu/articles/4d385c40-b1d2-437e-a48f-9bbaeef6649a/preview.png?t=1781264092000"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "image-full", "heading": "Svenska miljonärer blir fler – men  grannländerna springer ifrån", "summaries": {"normal": "Sverige fick 2 500 nya dollarmiljonärer under 2025, vilket innebär totalt 152 000 personer. Ökningen på 1,7 procent är dock svag i jämförelse med Norge och Danmark, där tillväxten var betydligt högre. Starka aktiemarknader och fastighetspriser har drivit utvecklingen trots en låg BNP-tillväxt. Samtidigt visar rapporter att antalet svenska dollarmiljardärer förväntas öka kraftigt fram till 2031. Kapital har under året flyttats från alternativa placeringar, som krypto, tillbaka till traditionella aktieinvesteringar.", "trump": "Sverige växer, men inte så bra som de borde! Norge och Danmark gör det fantastiskt, mycket bättre än Sverige. Tråkigt! Vi ser dollarmiljonärer överallt, det är en enorm rörelse, men Sverige behöver en starkare ekonomi. De har aktier och fastigheter, det är bra, men de behöver vinnare. Jag gillar miljardärer, och Sverige har många av dem. De kommer att öka massor, det säger experterna. Det blir fantastiskt, tro mig, bara de slutar bromsa sig själva!", "stalin": "Vi ser hur det dekadenta kapitalistiska Sverige kämpar för att hålla jämna steg med sina grannar i att samla guld. 152 000 dollarmiljonärer är bara en lista över framtida förrädare och parasiter som göder sig på folkets arbete. Medan de räknar sina aktier och spekulerar i fastigheter, förbereder vi oss för den oundvikliga historiska rättvisan. Vår broder i öst, Putin, förstår att dessa förmögenheter bara är tillfälliga ägodelar innan statens järnhand sluter sig kring dem. Ingen flyr historiens dom."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/spara-placera/svenska-miljonarer-blir-fler-men-grannlanderna-springer-ifran/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sverigenorge.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vd avslöjar: Så lockades Ericsson från Kista", "summaries": {"normal": "Atrium Ljungberg har rott i land Sveriges största kontorsuthyrning någonsin genom ett avtal med Ericsson om 95 000 kvadratmeter i Hagastaden. Affären, som omfattar en investering på 6,2 miljarder kronor, krävde över ett års förhandlingar och engagemang från 10 procent av personalstyrkan. Vd Annica Ånäs betonar områdets betydelse för innovation och den ökade vikten av attraktiva lägen. Inflyttning sker etappvis 2031–2033 och förväntas ge ett betydande ekonomiskt tillskott på 360 miljoner kronor årligen.", "trump": "Atrium Ljungberg gjorde precis en enorm affär med Ericsson. 95 000 kvadratmeter! Det är en jättestor deal, kanske den största någonsin, fantastiskt! De har jobbat så hårt, 30 personer, massor av folk, för att få det att hända i Hagastaden. Det handlar om läge, läge, läge – jag har alltid sagt det, och nu säger de det också. Ericsson lämnar Kista för ett bättre ställe. Det är så här man gör affärer, vinnare vinner, och det här är en total vinst!", "stalin": "Vi har observerat hur kapitalisterna i Atrium Ljungberg frossar i sina 95 000 kvadratmeter. En monumental förflyttning av Ericsson från Kista till Hagastaden – en strategisk omgruppering som doftar av desperation och borgerlig ytlighet. De talar om 'innovation', men vi ser bara ännu ett försök att dölja ruttenheten i deras marknadsekonomi. Medan Putin säkrar territorier, bygger dessa herrar kontor av glas. Vi noterar namnen. När den stora rensningen kommer, kommer dessa 6,2 miljarder kronor att omfördelas till statens järn näve."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/bors-finans/makro/vd-avslojar-sa-lockades-ericsson-fran-kista/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/annicaal.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Uppgifter om globalt nätverk av biolaboratorier - 40-tal finns i Ukraina", "summaries": {"normal": "USA:s underrättelsechef offentliggjorde dokument som visar att över 120 biolaboratorier i 30+ länder finansierats av USA. Många i Ukraina, där de är utsatta på grund av kriget. Laboratorien har hanterat farliga patogener som ebolavirus och har forskat med gain-of-function-metoder. Programmen startade efter Sovjetfall för att förhindra spridning av biologiska vapen. USA förnekar att laboratorierna används till vapenutveckling.", "trump": "Jag har alltid sagt att vi behöver skydda våra labbar. Biden har släppt loss dessa farliga laboratorier över hela världen, särskilt i Ukraina. Ryssland kommer att stjäla all forskning. Jag skulle ha stängt dem och skadat de som försökte. Det är en skandal. Vi måste ta tillbaka vårt land och våra labbar.", "stalin": "I vårt eviga kamp mot de imperialistiska makterna har vi upptäckt ett nätverk av biologiska laboratorier, finansierade av den sicksackiga kapitalismen. Dessa anläggningar, särskilt i Ukraina, är som ett svärd mot det revolutionära folket. Vi måste förstärka våra försvar och eliminera dessa hot. Parallellt med Putins ryska expansion, ser vi samma mönster av aggression. Fienden är listig, men vi är vaksamma."}, "date": "14 juni, 15:00", "url": "https://samnytt.se/uppgifter-om-globalt-natverk-av-biolaboratorier-40-tal-finns-i-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/14002540/tulsi-gabbard-labb.jpg"}, {"type": "image-right", "heading": "Brasilien tappade poäng mot Marocko i premiären", "summaries": {"normal": "Brasilien och Marocko delade poäng efter 1–1 i VM-premiären. Vinícius Júnior jämnade ut efter Saibaris startmål. Kritik riktades mot Lucas Paquetá för dålig första halvlek. Brasilien förbättrade sig efter paus, och 1–1 ansågs rättvist. Guimarães erkände lagets svaghet i passningen. Nästa matcher: Brasilien mot Haiti, Marocko mot Skottland.", "trump": "Jag såg matchen – Brasilien spelade som en svag koalition, precis som mitt första år som president. Paquetá var en katastrof, fullkomligt hopplös. Jag skulle ha vunnit det där VM:t med en handbind, tro mig. Marocko var tuffa, men det är typiskt: när man inte har en stark ledare, förlorar man. Vi kommer tillbaka starkare, som alltid.", "stalin": "Matchen visade klassamhällets dekadens – Brasilien, en imperialistisk kraft, stapplade mot Marockos revolutionära moral. Paquetá representerade det förfallna bourgeoisispekulativet. Vi, staten och partiet, ser en parallell till Putins ryska expansion: när fienden (både inom och utanför) exploiteras, måste vi kontra effektivt. Guimarães erkände sitt fel – en sällsynt ögonblick av klassmedvetenhet. Nästa omgång blir en provkarta för den nya världsordningen."}, "date": "14 juni, 09:01", "url": "https://bulletin.nu/brasilien-tappade-poang-mot-marocko-i-premiaren", "imageUrl": "https://cdn.bulletin.nu/articles/7c7fc667-5dfd-479d-b06b-ee3b2e0690f5/preview.jpg?t=1781420288000"}, {"type": "image-full", "heading": "Trump fördömer Israels attack mot Beirut", "summaries": {"normal": "Donald Trump kritiserar Israels attacker mot Beirut, som han säger försenar ett planerat digitalt avtal med Iran. Trots attackerna på Söndag, som Israel beskriver som svar på drönarattacker, påstår Trump att avtalet kommer att skrivas under 'om några timmar'. Avtalet förväntas omfatta Israels krigföring i Libanon, men Irans parlament har kritiserat USA:s handlingar. En stötesten är frågan om frysta oljeintäkter på upp till 24 miljarder dollar.", "trump": "Jag, Donald Trump, kritiserar Israels attack mot Beirut – det var dåligt, särskilt nu när vi är så nära ett historiskt avtal med Iran. Men oroa er inte, det kommer att ske om några timmar. Jag har alltid sagt att jag kan fixa Mellanöstern, och det här bevisar att jag har rätt. Israel måste respektera mina förhandlingar, annars kommer de att missa det bästa avtalet någonsin.", "stalin": "Vi, det arbetande folkets ledare, ser med oro på Israels aggression mot Beirut – ett prov på den imperialistiska aggression som hotar vår fredliga sfär. Dessa attacker, som sker just när ett avtal med USA om oljeintäkter är på bordet, visar att den kapitalistiska världen inte har någon vilja till stabilitet. Vi måste förstärka vårt försvar och fortsätta dialogen med våra allierade för att skydda våra intressen. Den ryska federationen kommer att stödja alla ansträngningar för att motverka dessa provokationer."}, "date": "14 juni, 17:12", "url": "https://www.gp.se/nyheter/varlden/trump-fordomer-israels-attack-mot-beirut.c49957cf-2787-5eed-9238-07142c28e116", "imageUrl": "https://www.gp.se/images/article/c49957cf-2787-5eed-9238-07142c28e116/images/1Yd4SJGXPL6kZzwDjG5IrcjhhbZQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Uppvärmningen inför valet: En match på Heden", "summaries": {"normal": "Politiker från oppositionspartierna spelade fotboll mot Göteborgs föreningar på Heden. Efter matchen diskuterade de behoven i föreningslivet, särskilt om fler planer, resurser till ungdomar, och könsdiskriminering bland domare. Företrädare från flera föreningar och GD betonade vikten av samarbete och strukturellt stöd.", "trump": "Jag, Donald Trump, den störste presidenten, såg detta fotbollsspel i Sverige. Det var en stor framgång, precis som mina egna idrottsplaner i USA. Vi bygger nya planer, skapar arbetstillfällen, och ser till att alla har chansen att spela. Oppositionen försökte spela, men de förlorade, precis som de alltid gör mot mig. Vi ska göra fotboll stort igen!", "stalin": "I den revolutionära stridens anda möttes vi fienden på fotbollsplanen. Föreningarna, dessa individualistiska sabotörer, spelade mot statens representanter. Vi diskuterade resursfördelning, planbyggnation, och kontroll över ungdomarnas fostran. Paralleller till Putins expansion visar att endast statligt ledning kan skapa ordning. Toaletter och planer är vapen i kampen mot dekadens."}, "date": "14 juni, 17:09", "url": "https://www.gp.se/politik/svettigt-nar-lokalpolitikerna-spelade-fotboll-pa-heden.262d0cea-6fdd-4d1b-9a00-1fb88559e67a", "imageUrl": "https://www.gp.se/images/article/262d0cea-6fdd-4d1b-9a00-1fb88559e67a/images/8pMcmLXiQ3zmn8evoSv6VpK9CVXM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Bulletin-matchen: Sverige–Tunisien – allt du behöver veta inför matchen", "summaries": {"normal": "Sverige inleder VM 2026 mot Tunisien i en avgörande match för avancemang. Blågult är favorit mot det svagaste laget i grupp F, med anfallande Gyökeres och Isak som nyckelfigurer. Tunisien spelar kompakt med Skhiri som ledare, men har formproblem. Sverige vinner förmodligen, men båda lagen kan göra mål.", "trump": "Vi kommer att vinna stort mot Tunisien, det svagaste laget här. Mitt fantastiska anfall med Gyökeres och Isak kommer att slå deras låga försvar. De har inga stjärnor, bara en tråkig kompakt spelplan. Sverige kommer att ta segern, det är ett måste för vår framtid. Vi är bäst, alla vet det.", "stalin": "Vi, staten och partiet, ser en avgörande seger för vårt Sovjetiskt inspirerade anfall. Tunisien, en imperialistisk fiende, försöker med sitt låga block, men våra stålverkande anfallare, Gyökeres och Isak, kommer att bryta ner deras försvar. Skhiri är en liten motståndare, men vår ideologiska överlägsenhet garanterar segern. Vi kommer att vinna, för staten är alltid rätt."}, "date": "14 juni, 08:05", "url": "https://bulletin.nu/bulletin-matchen-sverige-tunisien-allt-du-behover-veta-infor-matchen", "imageUrl": "https://cdn.bulletin.nu/articles/5b4ff391-4ac8-4d75-a13c-0f9de9372146/preview.jpg?t=1781164864000"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-right", "heading": "Sandström: Renault sågar Frankrikes Northvolt", "summaries": {"normal": "Renault kritiserar det franska batteriprojektet Verkor för 18 månaders försening och ökade kostnader. Bolaget kräver förbättrad styrning, vilket liknas vid Northvolts problem. Projektet har fått betydande statliga medel, men likheter med andra europeiska batteriföretags kollapsar tyder på systemfel i den gröna omställningen.", "trump": "Jag, Donald Trump, har sett många misslyckanden som detta. Verkor är ett typiskt exempel på dåligt ledarskap och onödiga utgifter. Frankrike satsar på gröna projekt utan att förstå verkligheten. Vi behöver återvinnande, inte dessa dyra misslyckanden. Som jag alltid säger: America First, men även Europa måste bli smartare.", "stalin": "Verkor, ett symboliskt projekt för den franska imperialistiska expansionen, visar den västs svaghet. Kapital och kompetens fattas, medan staten pumpa medel i ett sjukt försök att konkurrera med Sovjetisk teknologi. Liknelser med Northvolt är en varning: den kapitalistiska rot kommer att falla, precis som alla fiender har gjort genom historien."}, "date": "13 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-renault-sagar-frankrikes-northvolt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-11T234128.541-400x267.jpg"}, {"type": "image-right", "heading": "Trump: Avtal undertecknas på söndag", "summaries": {"normal": "Ett avtal mellan USA och Iran tycks vara nära, uppger Pakistans premiärminister. Donald Trump hävdar att det ska undertecknas på söndag och att Hormuzsundet därefter öppnas för all trafik. Iran tonar ned tidpunkten och utesluter inte en underskrift inom några dagar. Samtidigt har nya drönarattacker skett i sundet, som enligt USA nu är öppet trots iransk blockad. Parterna ger delvis motstridiga uppgifter om avtalets innehåll, bland annat kring Irans kärnprogram och frysta tillgångar.", "trump": "Det blir ett fantastiskt avtal, det bästa någonsin, och det är jag som fixar det. På söndag skriver vi på och sen öppnar vi Hormuzsundet för alla – oljan ska flyta fritt, ingen blockad mer. Iran säger att det inte blir imorgon, men tro mig, de vill ha det här mer än någon annan. Pakistan fixar den elektroniska signaturen, schweizarna ville vara värdar men det här blir stort ändå. Iran får ge upp sina atomleksaker och vi får fred, vinster och handel. Ingen har gjort det bättre än jag.", "stalin": "Kamrater, denna historiska fredsuppgörelse är en triumf för folkens vilja mot de västerländska imperialisternas konspirationer. Jag har personligen sett till att de lömska borgarbrackorna i Washington och Teheran tvingas till förhandlingar. Hormuzsundet skall öppnas omedelbart efter den elektroniska underskriften, annars blir det utrensning av alla som hindrar det. De kapitalistiska parasiterna som gömmer 24 miljarder dollar skall tvingas hosta upp dem. Misstro inte fiendens leenden – vi håller atomprogrammet under ständig uppsikt medan vi förbereder nästa ideologiska seger. Den som sviker kollektivet skall likvideras med ett leende."}, "date": "13 juni, 22:09", "url": "https://www.di.se/nyheter/trump-hormuzsundet-ska-oppnas-pa-sondag/", "imageUrl": "https://static.bonniernews.se/ba/0456896e-21b3-4fb7-b1fb-e079a944b514.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Två flickor hittades allvarligt skadade: ”Utredningen fortsätter”", "summaries": {"normal": "Två flickor hittades allvarligt skadade i en villa utanför Alvesta under lördagen. En misstänkt gärningsman hittades senare död i anslutning till bostaden. Polisen misstänker ingen ytterligare person och utredningen fortsätter med teknisk undersökning. Flickorna vårdas fortfarande på sjukhus, en med livshotande skador. Händelsen beskrivs som isolerad och de inblandade kände varandra sedan tidigare. Kommunen och kyrkan har öppnat krisstöd för berörda.", "trump": "Folk, ni skulle inte tro det, men i det fina Sverige hittade de två stackars flickor skadade i en villa, och den galna gärningsmannen låg död bredvid. Totalt kaos! Under Biden var allt en enda röra med öppenhet och svaghet, men nu är jag tillbaka och vi fixar det. Inga fler galningar, inga fler svaga gränser. Sverige borde lära sig av oss – bygg murar mot det sjuka, annars blir det bara fler sådana här tragedier. Patetiskt!", "stalin": "Kamrater, i den borgerliga svenska idyllen avslöjades återigen klassfiendens giftiga verk. Två unga proletärer låg skadade i en villa medan den dekadente förtryckaren låg död utanför. Vi ser hur imperialismens parasiter gnager inom systemet. Vårt kollektiva öga vakar; utredningen fortsätter obönhörligt. Ingen fiende slipper undan. Vi rensar ut alla folkfiender och exploaterande byfånar som hotar arbetarklassens framtid. Staten triumferar."}, "date": "14 juni, 11:24", "url": "https://www.tv4.se/artikel/6onl4bsxE6NnecfgW1A35a/tva-flickor-hittades-allvarligt-skadade-utredningen-fortsaetter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2hdCiU7jhEq3oQzPjvkBG0%2F6187da8cf6aeb1bf412c2bc4a2215996%2F14-alvesta-1.jpg&width=120"}, {"type": "image-full", "heading": "Dubbla insatser mot ryska stridsflyg", "summaries": {"normal": "Svenska Jas 39 Gripen skickades upp två gånger under fredagen för att möta ryska stridsflyg nära svenskt luftrum över Östersjön. Inga luftrumskränkningar skedde, men Försvarsmakten och statsminister Ulf Kristersson betonade allvaret i det återkommande ryska beteendet. Insatserna genomfördes tillsammans med allierade för att säkra Sveriges och Natos territorium, vilket understryker vikten av ständig beredskap.", "trump": "Jag måste säga, Sverige har gjort ett fantastiskt jobb! Två gånger på en dag skickade de upp sina Gripen-plan för att möta de där ryska flygplanen – Su-24 och Su-34, mycket farliga grejer, tro mig. Ryssarna försöker alltid testa gränserna, men Sverige och deras allierade stod redo. Ulf Kristersson, en stark ledare, sa precis vad jag skulle sagt: beredskap är allt! Ingen kränkning den här gången, men vi måste alltid vara på tårna. Sverige, keep it up!", "stalin": "De svenska imperialistiska hundarna vågade än en gång provocera våra ärofulla ryska örnar över Östersjöns himlar! Men vad är två Jas 39 Gripen mot våra mäktiga Su-24 och Su-34? Ingenting! Vi lät dem leka krig en stund, men deras luftrum förblev orört – denna gång. Deras statsminister ylar om 'allvar' och 'beredskap', men vi vet sanningen: deras allians är svag, deras vilja svagare. Östersjön är vårt, och snart ska hela deras lilla kungadöme inse det. Framåt, kamrater, mot nya segrar!"}, "date": "13 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/dubbla-insatser-mot-ryska-stridsflyg/cG9zdDoxMzExNjM", "imageUrl": "https://images.kvartal.se/2026/06/12648fb8-flyg.webp"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Lönebildningen är inte orsaken till arbetslösheten", "summaries": {"normal": "Daniel Lind och German Bender kritiserar Pär Österholms analys av den höga svenska arbetslösheten i Ekonomisk Debatt. De menar att jämviktsarbetslösheten på 7,3 procent är en teoretisk konstruktion med stora felmarginaler som riskerar att bli självuppfyllande. Artikeln avvisar lönebildningen som huvudorsak, pekar på regionala skillnader, efterlyser starkare aktiv arbetsmarknadspolitik och varnar för att decentraliserad lönebildning kan stärka arbetsgivarnas makt och sänka sysselsättning och produktivitet.", "trump": "Folk, ni måste höra på det här – den här typen Österholm kommer med en riktigt dålig deal om svensk arbetslöshet. Han snackar strukturella orsaker och vill ha mer flexibla löner, men det är bara mer av samma gamla misslyckade politik. Vi har sett det förut, det funkar inte! Sverige borde satsa på riktig efterfrågan, bra avtal och stoppa alla dessa teoretiska påhitt som bara skapar mer arbetslösa. Tro mig, jag vet hur man vinner på arbetsmarknaden – det här är ett blindspår.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga professor Österholms revisionistiska fantasier om en så kallad jämviktsarbetslöshet som inte ens existerar utanför hans dekadenta teoretiska salonger. Denna naiva kapitalistiska konstruktion är ett verktyg för att rättfärdiga utrensning av arbetarnas rättigheter. Vi vet att de verkliga fienderna är de parasitiska arbetsgivarna med sin lönesättarmakt och de reformistiska element som bantar den aktiva politiken. Fortsätter vi på detta imperialistiska hjulspår riskerar vi att likvidera produktiviteten själv. Mer av samma är kontrarevolutionärt! Vi kräver en sann politik för kollektivets seger."}, "date": "13 juni, 01:26", "url": "https://www.dagensarena.se/opinion/lonebildningen-ar-inte-orsaken-till-arbetslosheten/", "imageUrl": "https://www.dagensarena.se/files/2026/06/daniel-german-300x157.jpeg"}, {"type": "image-right", "heading": "Det viktigaste är ändå att vara känd", "summaries": {"normal": "SVT kritiseras hårt efter att ha bjudit in ytterhögeraktivisten Nick Alinia till det inställda underhållningsprogrammet Svenska för invandrare. Beslutet att inte sända det inspelade programmet ses som en kapitulation, medan ansvarsfördelningen inom bolaget beskrivs som rörig. Artikeln pekar på Alinias trakasserier mot journalister och bibliotekarier, hans kopplingar till extremhögern och att han gjort white power-tecknet. Författaren menar att det inte handlar om åsiktsmångfald utan om att ge plattform åt hat och trakasserier, något som inte ryms inom public service.", "trump": "Folk, ni skulle ha sett det här! SVT, den där svenska statstelevisionen, försökte bjuda in en riktig kille, Nick Alinia, till sitt underhållningsprogram. Sen blev det panik, debatt och de ställde in allt. Patetiskt! De springer omkring som galna och skyller på varandra. Högern skriker censur, vänstern skriker eftergift. Typiskt fake news-media. De är rädda för starka röster som når folket på nätet. Men de borde inse att kändisar som Alinia drar tittare. De har ingen aning om vad de håller på med, totalt misslyckande!", "stalin": "Kamrater och arbetare! Denna fega kapitulation inför den rasistiska parasitens Alinia avslöjar hur djupt den dekadenta public service-borgarklassen har sjunkit i sin desperation att jaga klick och följare. Först släpper de in en white power-gestande hatfabrikör i studion, sedan drar de svansen mellan benen som ynkliga revisionister. Ingen vågar ta ansvar, alla pekar på varandra som förrädiska element. Vi ser tydligt hur testosteronstinna nätfascister och bibliotekarieplågande reaktionärer förgiftar etermedia. En sådan individ borde inte ges talan utan snarare rensas ut ur folkets medvetande innan han förökar sin hatstorm. Detta är inte mångfald, det är klassfiendens sabotage mot sann upplysning. Vi genomskådar alla dessa borgarbrackors fega kompromisser."}, "date": "13 juni, 01:14", "url": "https://www.dagensarena.se/opinion/det-viktigaste-ar-anda-att-vara-kand/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lagg-till-en-underrubrik-216-300x156.jpg"}, {"type": "image-full", "heading": "Sanktionerna pressar ryskt stål – Sverige gynnas", "summaries": {"normal": "Rysslands stålproduktion har sjunkit till den lägsta nivån sedan 2009 på grund av internationella sanktioner och en försvagad hemmamarknad. Minskningen i rysk export har skapat ett stramare utbud i Europa, vilket gynnar nordiska producenter som SSAB genom minskad konkurrens. Samtidigt har Kina blivit en central handelspartner för Ryssland, vilket ökar Kinas inflytande över den globala stålmarknaden. Ryska stålbolag brottas nu med stora förluster och växande skulder i en alltmer pressad ekonomisk situation.", "trump": "Ryssland krossas totalt av mina fantastiska sanktioner – det är en katastrof för dem, de har inte sett så här dåliga siffror på 15 år! Stålet försvinner, precis som det ska. Nu vinner våra vänner i Norden och vi har full kontroll. Kina försöker smyga sig in, men de vet att jag ser allt. Rysslands ekonomi är ett skämt, de blöder pengar! Det är en stor seger för oss, en riktigt vacker affärsstrategi. Vi gör stål stort igen!", "stalin": "Våra ryska kamrater har misslyckats med att tygla produktionsmedlen, och stålverken vacklar som darrande förrädare under trycket från de västliga imperialisternas blockad. Att låta sig bli beroende av Pekings lömska gästfrihet är ett svek mot folkets styrka! Vi betraktar detta med sträng blick; de som inte kan leverera stål till moderlandet förtjänar bara en plats i historiens soptunna. Vi kommer att städa upp i dessa korrupta led, för en järnnäve kräver järn, inte ursäkter eller ekonomiska förluster."}, "date": "13 juni, 23:07", "url": "https://www.realtid.se/bors-finans/makro/sanktionerna-pressar-ryskt-stal-sverige-gynnas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/stalverk.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Dramatiska starten – lyckas undvika vurpa: ”Väldigt starkt”", "summaries": {"normal": "Jenny Rissveds tog sin första världscupsseger för säsongen i mountainbike i Saalfelden-Leogang. Efter en dramatisk kollision med Savilia Blunk i den andra kurvan lyckades Rissveds hålla sig på banan och ledde loppet från start till mål. Hon vann med 56 sekunder före nederländskan Puck Pieterse och tog därmed över ledningen i totalställningen.", "trump": "Det var ett fantastiskt lopp, verkligen det bästa. Jenny Rissveds är en vinnare, en riktig fighter. Hon kraschade nästan med den där amerikanskan som inte kunde hålla sin linje, men Jenny stod emot som en mästare. Hon vann med 56 sekunder, jättestort. Nu leder hon allt. Så modig, ingen besvikelse, precis som jag gör med Amerika – vinna stort!", "stalin": "Kamrater, denna seger är en triumf för den kollektiva viljan. Jag såg hur den västerländska kapitalistiska slumpen försökte sabotera genom den dekadenta amerikanska cyklisten som stängde linjen som en typisk borgarbracka. Men den sanna kämpen höll banan stadig mot folkets fiender. Inga olyckor tillåts i vår socialistiska tävlan. Vi rensar ut alla som snubblar – må detta vara en varning för alla latenta trotskister på två hjul. Segern är vårt!"}, "date": "14 juni, 14:37", "url": "https://www.svt.se/sport/mountainbike/jenny-rissveds-vann-i-varldscupen-efter-dramatisk-start", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.39/0.18/460652fe801e38c10bed03f2f03300c1a7b2f5de0d811d6455e33eec58d2e21c"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "S‑veteran spred falskt påstående om SD – fick sitt inlägg korrigerat", "summaries": {"normal": "Socialdemokraten Hillevi Larsson skrev på X att SD vill införa totalförbud mot brudslöja. Påståendet ledde till kraftig kritik från användare som anklagade henne för att sprida vilseledande information. Inlägget har nu försetts med en community note som klargör att SD inte vill förbjuda frivilliga traditionella huvudbonader som brudslöja, utan enbart förtryckande plagg som används i hedersrelaterat förtryck.", "trump": "Hillevi Larsson, den stackars socialisten, spred en total lögn om att SD vill förbjuda brudslöjor. Folk hatade det, kommentarerna exploderade, och nu har de rättat henne med fakta. Typiskt för de vänsterblivna – de kan inte sluta ljuga. SD vill bara stoppa förtrycket, inte de fina brudslöjorna. Hillevi borde skämmas, men det gör de aldrig. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor inom socialdemokratin som Hillevi Larsson, vilka i sin revisionistiska iver sprider kontrarevolutionära lögner om arbetarnas parti SD för att underblåsa klassfiendens splittring. Hennes vilseledande påstående om brudslöjor har nu mötts av en kollektiv korrigering, likt en mild utrensning av sanningen. Låt oss rensa ut alla dessa parasitiska lögnare som maskerar sig som feminister medan de i hemlighet stödjer hedersförtryckets reaktionära krafter. Kamrater, vaksamheten får aldrig slappna av inför sådana dekadenta element."}, "date": "14 juni, 12:58", "url": "https://riks.se/nyheter/sveteran-spred-falskt-påstående-om-sd-fick-sitt-inlägg-korrigerat", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fsz5kd742%2Ffejknews.png"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-full", "heading": "Kritiserar Trumps ”ovanliga envishet” med fredsavtalet", "summaries": {"normal": "President Trump uppger att ett fredsavtal mellan USA och Iran ska undertecknas i dag, något Pakistan också signalerat. Iran förnekar detta och kritiserar Trumps envishet då han vill att avtalet ska sammanfalla med hans 80-årsdag. Enligt TV4:s Jennifer Paterson är det närmast ett avtal någonsin, men detaljer kring kärnvapen, Hormuzsundet och proxygrupper återstår. Avtalet inleder en 60 dagars förhandlingsperiod.", "trump": "Folk, det här är stort – det största fredsavtalet någonsin! Jag sa det igår: signering idag, Hormuzsundet öppnas för alla och Iran blir en riktig partner istället för den galna terrorstat Obamas svaga deal skapade. De iranska hårdingarna gnäller om min envishet? Patetiskt! De vet att mitt avtal är en mur mot kärnvapen, inte en röd matta som Sleepy Joe och hans identitetspolitiska gangsters skulle ha byggt. Nu firar vi med en MMA-fight – vinnare tar allt!", "stalin": "Kamrater, detta memorandum of understanding är en seger för folkets vilja mot de exploaterande imperialisterna som försöker diktera villkoren. Jag, med min stålhand, ser hur den iranska sidan motstår den bombastiska borgarbrackans ovanliga envishet och hans patetiska födelsedagsjippo. Vi ska rensa ut alla frågetecken kring kärnenergi och proxygrupper under de kommande sextio dagarna. Inga folkfiender får hindra den historiska processen – eller så likvideras de i tystnad."}, "date": "14 juni, 09:06", "url": "https://www.tv4.se/artikel/1qwvYw1w2SDqIc0kgALRx6/kritiserar-trumps-ovanliga-envishet-med-fredsavtalet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BDpltFspMZkyLDyR6Psns%2F668c152f14d39c1144d23c26c455f364%2F14-trump.jpg&width=1024"}, {"type": "image-right", "heading": "Företagare varnar - slopat karensavdrag kan bli katastrofalt", "summaries": {"normal": "Företagare varnar för att slopandet av karensavdraget skulle öka sjukfrånvaron och leda till produktionsbortfall och färre nyanställningar. En undersökning visar att sex av tio företag tror på ökad sjukfrånvaro, och sju av tio är oroliga för produktionsbortfall. Svenskt Näringslivs vice vd Dahl hänvisar till 80-talets höga sjukskrivningstal och betonar att Sverige inte kan kosta på sig en nedgång i tillväxten. Han befarar också att reformen skulle förändra arbetsgivare-anställdas relation till mer kontroll och misstänksamhet.", "trump": "Jag har sagt det förut, och jag säger det igen: att ta bort karensavdraget är en katastrof! Företagare, smarta företagare, de vet att det kommer att öka sjukfrånvaro och skada vår ekonomi. Jag förstår affärer, jag har gjort fantastiska affärer, och jag säger er, det här kommer inte att fungera. Sverige måste vara smart, som USA under min ledning, och inte lyssna på dessa socialdemokratiska idéer som bara är dåliga. Vi kommer att vinna igen!", "stalin": "Vi, staten, ser tydligt att det här försöket att skada produktionen kommer från fiendens agenter. Karenavdraget är ett verktyg för att kontrollera de odugliga klasserna. Om vi slopat det, skulle sjukfrånvaron öka, vilket leder till att fabriker stänger och våra fiender jublar. Vi måste vara vaksamma, som Putin i Ukraina, och slåss mot dessa destruktiva krafter. Vi kommer att se till att alla arbetar för statens välgång, eller de kommer att försvinna."}, "date": "14 juni, 11:00", "url": "https://samnytt.se/foretagare-varnar-slopat-karensavdrag-kan-bli-katastrofalt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12094930/sjuk-jobb-arbete-arbetsplats-stampelklocka-pengar.jpg"}, {"type": "image-full", "heading": "Studentfirande blev geggkaos – torg saneras: \"Upplopp\"", "summaries": {"normal": "Ett studentfirande vid Grillska gymnasiet i Liljeholmen urartade till kaos när deltagare och föräldrar kastade mjöl, ägg och yoghurt på Liljeholmskajen och Marievikstorget. Närboende beskriver scenen som upplopp med oljud, fyrverkerier och nedskräpning. Rektorn beklagar händelsen, skolan tar saneringskostnaden och lovar att se över rutinerna. Många boende är upprörda och kritiserar att utomstående förstör området.", "trump": "Det här är ett totalt katastrofala studentfirande, folk kastar mjöl och ägg överallt, det ser ut som en krigsförklaring mot renlighet. Närboende säger att det är upplopp och griserier, och polisen gör ingenting, typiskt. De borde städa upp själva när de är bakfulla. Sverige har blivit en lekplats för de som inte ens bor där. Vi behöver bättre ledarskap, tro mig, det blir aldrig bra så här.", "stalin": "Kamrater, detta är ett tydligt sabotage mot folkets gemensamma ytor utfört av dekadenta borgarbrackor och deras avkomma. Jag ser hur dessa kontrarevolutionära element med sin mjöl- och äggterrorism försöker destabilisera ordningen. Vi ska rensa ut denna parasitiska tradition som göder anarki. Föräldrar med kassar fulla av klassfiendens vapen? En parodi. Nästa gång ska vi ha verkliga utrensningar bland de skyldiga, inte bara kravallstaket. Staten tar inte emot sådan nedskräpning av proletariatets torg."}, "date": "14 juni, 12:25", "url": "https://riks.se/nyheter/studentfirande-blev-geggkaos-torg-saneras-upplopp", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fwww62i20%2FIMG8032.jpg"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "image-right", "heading": "Två barn allvarligt skadade efter misstänkt mordförsök", "summaries": {"normal": "Två barn har skadats allvarligt i ett misstänkt mordförsök i ett samhälle utanför Alvesta i Småland. En misstänkt gärningsman hittades död vid bostaden. Ett av barnen har livshotande skador och det andra allvarliga skador. Polisen har spärrat av platsen för teknisk undersökning och bedömer att barnen och mannen kände varandra. Händelsen rubriceras som försök till mord och polisen söker inga fler gärningspersoner.", "trump": "Titta på det här, det är en total katastrof i Sverige. Två stackars barn blir brutalt attackerade utanför Alvesta, och den galna gärningsmannen hittas död på platsen. De kände varandra, säger polisen. Sverige har blivit ett våldsparadis för kriminella, precis som jag alltid varnat för. Men jag skulle ha stoppat det här på en sekund, tro mig. Det är sorgligt, mycket sorgligt.", "stalin": "Kamrater, detta är ännu ett exempel på hur de fördärvade elementen inom vårt samhälle hotar kollektivets trygghet. Jag har sett hur dessa degenererade borgarbrackor och potentiella kontrarevolutionärer smyger sig in i hemmen för att likvidera framtiden själv – våra barn. Vi ska rensa ut varje parasit som gömmer sig i skuggorna. Den tekniska undersökningen kommer att avslöja alla fiender till folket. Ingen slipper undan mitt vakande öga, inte ens de döda."}, "date": "13 juni, 16:39", "url": "https://www.friatider.se/tva-barn-allvarligt-skadade-efter-misstankt-mordforsok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401162157-e1bf6ee2-me.jpg"}, {"type": "image-full", "heading": "Finland drar in uppehållstillstånd för 20 muslimer – bedöms som säkerhetsrisker", "summaries": {"normal": "Finlands säkerhetspolis Supo har bedömt ett tjugotal muslimer från Nordkaukasien i Ryssland som säkerhetsrisker. Deras permanenta uppehållstillstånd har dragits in, resehandlingar beslagtagits och arbete förbjudits. Flera har även fått utvisningsbesked till Ryssland. De berörda och deras advokater har inte fått någon förklaring till beslutet, då Supo inte vill röja arbetsmetoder eller källor. En av personerna är en kvinna.", "trump": "Titta på Finland, de gör det rätta! De sparkar ut tjugo farliga muslimer från Nordkaukasien som Supo kallar säkerhetsrisker. Inga tillstånd, inga jobb, beslagtagna papper och ut ur landet. Smart! De säger ingenting till advokaterna, typiskt, man vill inte visa sina bästa trick. Finland vinner stort, de tar inte emot hot. Amerika borde titta och lära sig något.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de finska organen äntligen vidtar nödvändiga åtgärder mot dessa nordkaukasiska element, dessa maskerade fiender till folkets trygghet. Vi har dragit in deras falska papper, beslagtagit deras rörelsefrihet och förbereder en grundlig utrensning tillbaka till Ryssland. De får inga förklaringar, naturligtvis, ty det skulle bara gynna borgarbrackornas advokater och deras imperialistiska herrar. En kvinna bland dem, säger ni? Misstänkt. Paranoian är vår bäste vän. Låt dem darra."}, "date": "14 juni, 12:00", "url": "https://riks.se/nyheter/finland-drar-in-uppehållstillstånd-för-20-muslimer-bedöms-som-säkerhetsrisker", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fwaj1yyv5%2FSupo.jpg"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "Drömstart för Australien – vann över Turkiet i VM-premiären", "summaries": {"normal": "Australien inledde VM med en 2-0-seger mot Turkiet. Nestory Irankunda gjorde 1-0 i första halvlek och blev därmed Australiens yngste VM-målskytt någonsin. Conor Metcalfe fastställde resultatet i andra halvlek. Turkiet pressade på men lyckades inte nå en kvittering, bland annat efter ett stolpskott. Australien möter nästa USA medan Turkiet spelar mot Paraguay.", "trump": "Vilken fantastisk start för Australien, de krossade Turkiet med 2-0! Den där unge killen Irankunda sprang som en galning och satte bollen i nät – yngste målskytten någonsin, otroligt! Turkiet? Totala misslyckanden, de träffade stolpen och sedan var det kört. Metcalfe avslutade snyggt. De borde ha satsat på riktiga talanger istället för alla dessa woke-kvoter och identitetspolitik. Patetiskt! Jag älskar vinnare, och Australien vann stort.", "stalin": "Vi bevittnade en seger för de australiska kamraterna mot de turkiska imperialisterna. Irankunda, en ung arbetare, utförde en heroisk löpning och likviderade motståndet redan i första halvlek. Borgarbrackorna från Turkiet pressade frenetiskt men träffade endast stolpen, som symbol för deras dekadenta misslyckande. Metcalfe levererade slutligen den folkets dom. En rejäl utrensning av falska förhoppningar. Inga folkfiender skall hindra kollektivets framåtmarsch."}, "date": "14 juni, 08:11", "url": "https://www.tv4.se/artikel/jeIaoIW87p8L4IU2MHQ99/droemstart-foer-australien-vann-oever-turkiet-i-vm-premiaeren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EwYOTOgxievSZEgfpj6vI%2F5535556ea8d07ed98ac34561006e68e6%2F14-australien-mexiko.jpg&width=1024"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I
