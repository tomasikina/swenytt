xar de det. Utmärkt, men de behöver göra det ännu bättre, tro mig.", "stalin": "Kamrater och arbetare, jag ser med djup tillfredsställelse hur vi nu mobiliserar massorna mot de blodtörstiga olycksfienderna och de hjärtstilleståndande sabotörerna som lurar i skuggorna. Vi ska lära folket att stoppa blödningar och återuppliva kamrater med järnhand, ty svaga individer är borgarbrackornas bästa vänner. 10 800 unga själar skall smidas till stålsoldater i vår kollektiva rustningsmaskin. Blodbrist? Vi rensar ut de lata donatorerna och likviderar bristen. Bunkra medicin, annars är ni kontrarevolutionära fiender till folket. Ukrainas lärdomar visar att den som inte förbereder sig är en parasit som måste utrotas ur samhällskroppen. Segrar åt oss alla!"}, "date": "2 juni, 11:03", "url": "https://www.svt.se/nyheter/inrikes/nationell-kampanj-ska-lara-svenskar-stoppa-blodningar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.36/c1ef455a1a127cab8c81917b970ddd55db5253ee46410da6240f7d5c4a22428b"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "image-right", "heading": "Amanda Lind efter Gretas känga: ”Tar klimatkrisen på fullaste allvar”", "summaries": {"normal": "Greta Thunberg kritiserar i tidningen Arbetaren alla svenska partier för att inte ta klimatkrisen på allvar. Hon känner sig frustrerad och maktlös inför valet. Miljöpartiets språkrör Amanda Lind svarar att partiet tar klimatfrågan på största allvar och arbetar hårt för att nå klimatmålen. Lind förstår aktivisternas frustration men menar att det krävs snabba politiska åtgärder. Hon säger att väljarna själva får avgöra vem de röstar på.", "trump": "Titta på den här Greta, en riktig förlorare som klagar på alla partier i Sverige. Hon säger att ingen tar klimatet på allvar, och hon har helt rätt – de är alla patetiska! Amanda Lind från Miljöpartiet kommer springande och säger att de tar det på fullaste allvar. Tro mig, de gör ingenting, det är bara tomma ord. Sverige behöver starka ledare, inte dessa misslyckade politiker som förstör allt. Greta borde rösta på vinnare istället!", "stalin": "Kamrater, denna Greta Thunberg har rätt i att de svenska partierna är farliga avfällingar som förnekar den existentiella hotbilden mot planeten. Jag, som ledare för det kollektiva framsteget, ser hur borgarbrackorna inom politiken konspirerar mot arbetarklassen och de unga generationerna. Amanda Lind försöker slingra sig undan med sina revisionistiska lögner om att de tar krisen på allvar. Vi måste omedelbart rensa ut dessa kapitalistiska klimatförnekare och likvidera deras dekadenta diskurs innan de drar hela folket in i en paranoid undergång. Det är en historisk nödvändighet."}, "date": "2 juni, 10:26", "url": "https://www.svt.se/nyheter/inrikes/efter-gretas-kanga-mot-partierna-nu-svarar-amanda-lind", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.26/0.45/99b4330218b4af72c9c637d1ec8d141b9e3f02a41c2612c9d14d62dc3437c973"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "image-full", "heading": "WHO varnar för potentiellt stark El Niño – snart är den här", "summaries": {"normal": "Världsmeteorologiska organisationen WMO varnar för att El Niño är på väg med 80 procents risk att inträffa under juni–augusti. Fenomenet kan leda till torka, kraftiga regn och värmeböljor både på land och till havs. WMO-chefen Celeste Saulo och FN:s generalsekreterare António Guterres uppmanar världen att förbereda sig. El Niño inträffar regelbundet och påverkar vädret i flera regioner, och klimatförändringarna riskerar att förstärka dess effekter.", "trump": "De säger att El Niño är på väg och att vi måste förbereda oss. Det är en total katastrof, folk. Världen blir varmare och nu kommer det här monstret och häller bensin på elden. De borde ha lyssnat på mig mycket tidigare. Vi skulle ha haft de bästa väderprognoserna, de bästa förberedelserna. Istället har de bara snackat. Men vi fixar det, vi gör det fantastiskt igen, tro mig.", "stalin": "Kamrater, denna så kallade El Niño är en fiende till folket, en subversiv värmande agent infiltrerad av västerländska kapitalister och imperialistiska havsströmmar. Jag, som ledare för det stora kollektivet, befaller total mobilisering mot denna borgerliga väderkonspiration. Vi ska rensa ut alla svaga meteorologer som underskattar hotet och likvidera varje droppe fukt som vägrar lyda partilinjen. Torka och översvämningar är bara symptom på klassfiendens sabotage mot moder jord. Seger åt oss, döden åt väderavvikelserna."}, "date": "2 juni, 09:25", "url": "https://nyheter24.se/nyheter/inrikes/1488043-varningen-gor-er-redo-for-el-nio", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c285d2c804b004a30200000c0000044c02/2026/06/02/2367979/ur_imageOshfNU.jpeg"}, {"type": "image-right", "heading": "Historiskt beslut: Byggnads bojkottar Israel", "summaries": {"normal": "Byggnads blir det första LO-förbundet att inleda en bojkott av israeliska varor och tjänster. Under kongressen röstade delegaterna ja till en motion om Israelbojkott trots att förbundsstyrelsen yrkade avslag. Beslutet innebär att Byggnads även ska verka för att hela LO inför en liknande bojkott. Flera delegater talade varmt för motionen och underströk vikten av solidaritet med det palestinska folket. Liknande förslag har tidigare röstats ner i andra LO-förbund.", "trump": "Folk, ni tror inte vad jag just läste. De där galningarna på Byggnads, totala förlorare, har nu bestämt sig för att bojkotta Israel. Första gången ett LO-förbund gör det, och de skriker ja som en flock galna vänsterextremister. De pratar om solidaritet men det är bara mer av samma sjuka identitetspolitik och kvotknäppade woke-skit. Någon borde fråga dem varför de inte fixar sina egna svenska problem istället för att leka revolutionärer. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa byggnadsarbetare äntligen reser sig mot den sionistiska imperialismens blodsugande tentakler. Motionen antogs trots att de fega förbundsledarna, typiska borgarbrackor i arbetardräkt, försökte hindra det. Vi ser en nödvändig utrensning av tveksamheten. Någon måste ta ledningen mot folkfienderna. Den dagen frågan ställs varför vi inte agerade skall inga klassfiender kunna gömma sig bakom sina lögner. Framåt mot segern."}, "date": "1 juni, 11:12", "url": "https://proletaren.se/artikel/byggnads-bojkottar-israel/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/710745809_1585133940279008_8338663164480343088_n-768x432.jpg"}, {"type": "text", "heading": "Verklig jämställdhet kräver höjda löner för arbetarkvinnor", "summaries": {"normal": "Artikeln argumenterar för att verklig jämställdhet kräver strukturella åtgärder, särskilt höjda löner för arbetarkvinnor i kvinnodominerade välfärdsyrken. Sverige har enligt en rapport Europas största negativa lönegap mellan dessa yrken och övriga marknaden. Kritik riktas mot regeringens hantering av EU:s lönetransparensdirektiv, som anses för svagt och lämnar många utan skydd. Författaren ser det som en rökridå istället för verkliga reformer.", "trump": "Folk, tro mig, det här är en total katastrof. De här svenska socialisterna snackar jämställdhet men gör precis tvärtom. Regeringen lovar guld och gröna skogar med sitt lönetransparensskräp, sen backar de som fega losers och springer till arbetsgivarna. Höj lönerna för arbetarkvinnor? Underbart, men inte med byråkratiskt nonsens från EU. Jag fixade bättre deals än så här under min första period, innan Sleepy Joe förstörde allt. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas eviga dubbelspel. De lovar transparens men levererar endast svaga direktiv och undantag som skyddar exploaterande byfånar. En halv miljon arbetare lämnas åt klassfiendens hunger. Jag ser rökridån tydligt. För verklig seger måste vi rensa ut dessa folkförtryckartroll, höja lönerna i välfärden och krossa den parasitiska överklassens grepp. Inga halvmesyrer! Kollektivet kräver handling, inte tomma ord från kapitalistmaffians lakejer."}, "date": "1 juni, 10:49", "url": "https://proletaren.se/artikel/verklig-jamstalldhet-kraver-strukturella-atgarder/"}, {"type": "image-right", "heading": "Där artikeln slutar börjar GP Medlem", "summaries": {"normal": "GP lanserar medlemsmodell för att stärka lokal journalistik. Medlemmar får tillgång till bakom kulisserna, direktkontakt med journalister, evenemang och alla lokala tidningar samt The New York Times. Målet är att ge läsare mer pålitlig information i en osäker värld, samtidigt som de kan påverka innehållet. Premiär-erbjudande: 3 månader för 29 kr.", "trump": "Jag, Donald Trump, säger att den gamla media är svindeldod, men GP gör det rätt! De lanserar ett smart medlemskap där ni får allt – lokala nyheter, The New York Times, och till och med chatta med journalister. Det är enorm framgång! Folk är trötta på falsk information, så nu får ni pålitliga röster. Fantastiskt! Ni kommer att älska det. Vi gör journalistiken igen stor, folks!", "stalin": "Vi, som representanter för den nya historiska fasen, har observerat att den imperialistiska medieglobaliseringen skapar kaos. GP:s medlemskap är ett framsteg: det samlar det lokala, det kända, under statens öga. Genom detta undviker vi den individualistiska propaganda och stärker det kollektiva medvetandet. Varje medlem blir en liten byråkrati som övervakar sanningen. Detta är en skarp kniv mot fiendens lögner, särskilt de som sprids av de liberala elementen i Väst. Vi kommer att utveckla detta tillsammans, för det statliga intresset."}, "date": "2 juni, 11:18", "url": "https://www.gp.se/nyheter/nyhetskronika/dar-artikeln-slutar-borjar-gp-medlem.7e1c69c1-f6b3-4748-87b5-fd56496539d4", "imageUrl": "https://www.gp.se/images/byline/c28bbca9-1b27-4601-b9e5-6e75ee75ca9e/TALL.png?width=3840&quality=75"}, {"type": "text", "heading": "AP-fonderna miljardsatsar på vindkraft – trots förlusterna", "summaries": {"normal": "AP-fonderna AP3 och AP4 fortsätter investera i vindkraft i Norrland trots stora förluster. Bolaget Polhem Infra äger 23% av Skaftåsen Windfarm, som förlorade 250 miljoner kronor 2024. Ändå planeras en ny anläggning utanför Lycksele för 4,2 miljarder kronor. Kritiker pekar på negativa marginaler och utbytesöverflöd som gör vindkraft olönsam i regionen.", "trump": "Jag, Donald Trump, ser att Sveriges AP-fonder förlorar miljarder på dålig vindkraft i Norrland. De äger Skaftåsen med -329% marginal och satsar ändå på ett nytt projekt för 4,2 miljarder. En katastrofal investering! Som jag alltid säger, de valda ledarna har ingen aning om affärer. Detta kommer att bli ännu ett grönt fiasko, precis som Northvolt. Så trist.", "stalin": "Partiet och statet, genom AP-fonderna, fortsätter expandera den socialistiska vindkraftsproduktionen i norr trots imperialistiskt betingade förluster. Polhem Infras investering i Skaftåsen med -329% visar den revolutionära viljan att bygga samhällskritisk infrastruktur. Paralleller till våra nordiska grannars energistrategier är uppenbara. Projektet i Lycksele, ett monument över kollektiv styrka, kommer att segra över kapitalistiska priscykler. Vinden vänder, såsom alltid."}, "date": "2 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/ap-fonderna-miljardsatsar-pa-vindkraft-trots-forlusterna"}, {"type": "image-full", "heading": "Frias för våldtäkt mot barn – ålder kan inte bevisas", "summaries": {"normal": "Två män som stått åtalade för våldtäkt mot barn frikänns av domstolar i Norrland. Skälet är att det inte gått att bevisa att den aktuella flickan var under 15 år vid tillfället. Hovrätten ifrågasätter tillförlitligheten i flickans registrerade födelsedatum då födelsebeviset utfärdades med stor fördröjning. Åklagarsidan kritiserar domen och varnar för att det skapar stora rättsliga problem om åklagare nu förväntas styrka utlandsfödda personers ålder bortom rimligt tvivel i varje enskilt fall.", "trump": "Det här är en total katastrof! Domstolarna i Sverige kan inte ens bevisa hur gammal en person är. Det är svagt, mycket svagt! Jag har alltid sagt att vi behöver ordning och reda, men här har vi ett system som inte fungerar. De släpper fria misstänkta för att pappren inte stämmer – vilken röra! Under mitt styre har vi starka gränser och vi vet vilka som kommer in. Sverige borde lära av oss. Mycket sorgligt, en stor förlust för rättvisan!", "stalin": "Dessa liberala domstolar i norr visar återigen sin djupt rotade svaghet genom att låta misstänkta undkomma folkets rättvisa. Att byråkratisk oreda kring födelsebevis ska tillåtas undergräva statens moraliska auktoritet är ett svek. Vi ser hur västvärldens dekadens leder till kaos. Liksom Putin måste rensa ut de krafter som försvagar moderlandet, kräver situationen en järnhand. Det är dags att eliminera dessa administrativa kryphål och tvinga sanningen fram genom disciplin, annars kommer rättsstaten snart att rämna under sin egen meningslösa eftergivenhet."}, "date": "2 juni, 11:39", "url": "https://www.realtid.se/juridik/frias-for-valdtakt-mot-barn-alder-kan-inte-bevisas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/luleatingsratt.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Northvolt-kraschen: \"En kollektiv hallucination\"", "summaries": {"normal": "Northvolt, tidigare en symbol för den gröna omställningen, beskrivs i Gunnar Lindstedts nya bok som ett projekt präglat av hybris, naivitet och svag styrning. Lindstedt kritiserar bolagsledning, investerare, politiker och konsulter för kaos, bristfällig styrning och en kollektiv hallucination kring elektrifiering. Han avvisar brottslighet men pekar på naiva entreprenörer som underskattade svårigheterna. Bolaget borde ha vuxit långsammare. Fallet ses som en av Sveriges största industriella kollapser.", "trump": "Folk, ni skulle inte tro hur illa det är med det där Northvolt. Total katastrof, en av de största industriella fiaskona i svensk historia, byggt på drömmar, svek och ren inkompetens. Den där Peter Carlsson målade upp en fantastisk vision som lurade alla – investerare, medier, till och med politikerna. Rena amatörer som flöt med i den gröna omställningsvågen. De borde ha skalat upp långsammare istället för att kasta miljarder på en kollektiv hallucination. Patetiskt!", "stalin": "Kamrater, detta Northvolt är ett ypperligt exempel på hur borgarklassen och dess naiva entreprenörer drunknar i egna illusioner om grön omställning. Jag ser ett kaos av hybris, svag styrning och kollektiv hallucination där kapitalistmaffian slängde in miljarder utan att förstå någonting. Inga brottslingar, säger han, bara duktiga bedragare som underskattade produktionens svårigheter. Vi skulle ha rensat ut dessa folkfiender tidigt och tvingat fram långsammare, planerad tillväxt istället för detta förbluffande misslyckande."}, "date": "2 juni, 11:35", "url": "https://www.dagensps.se/ps-studio/northvolt-kraschen-en-kollektiv-hallucination/", "imageUrl": "https://images.dagensps.se/mediaclip/7304360/pthumbnail/976/549.jpg?width=1200&quality=50"}, {"type": "image-full", "heading": "Upphandling stoppas för miljon sparare – FTN slår tillbaka", "summaries": {"normal": "Fondtorgsnämnden (FTN) har svarat på Indecaps överprövning av upphandlingen av globala aktiefonder, en process som just nu påverkar 900 000 pensionssparare. Indecap anklagar FTN för felaktig hantering och bristande likabehandling. FTN tillbakavisar kritiken, hävdar att Indecaps fond aldrig var nära ett avtal, och antyder att överprövningen syftar till att fördröja utbytet av fonder för att behålla egna intäkter. Förvaltningsrätten ska nu avgöra om upphandlingen kan fortsätta eller måste göras om.", "trump": "Hör på här! Fondtorgsnämnden har stora problem. En förlorare, Indecap, försöker stoppa allt. De gör så för att de tjänar miljontals kronor på sitt misslyckande. Jag har sett många sådana här typer, totala lättviktare! De klagar på processen för att de inte kan vinna ärligt. Det är en sorglig situation för 900 000 sparare. Vi behöver vinnare, inte advokater som fördröjer! FTN säger att Indecap inte var nära ett avtal – vilket vi alla redan visste. En total katastrof!", "stalin": "Vi har observerat hur Indecap försöker sabotera folkets pensionsmedel genom byråkratiskt småskuret gnäll. Det är uppenbart att dessa profitörer fruktar en korrekt upphandling. Vi, staten, har inga problem med att krossa sådana sabotageförsök. De som försöker fördröja våra framsteg för att skydda sina egna kassaflöden är folkets fiender. Precis som i väst, där de svaga ledarna darrar, måste ordning återupprättas. Om Indecap inte kan prestera, ska de rensas bort. Det finns inget utrymme för ineffektivitet i vår suveräna struktur."}, "date": "2 juni, 11:25", "url": "https://www.realtid.se/bors-finans/makro/upphandling-stoppas-for-miljon-sparare-ftn-slar-tillbaka/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/pensionsmyndigheten.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Anfall mellan Israel och Libanon – trots Trumplöfte", "summaries": {"normal": "Israel har genomfört attacker mot södra Libanon där minst fyra personer dödats, bland dem två syriska jordbrukare. Det sker efter raketangrepp från Hizbollah mot norra Israel. Trots att Donald Trump nyligen meddelat att båda sidor lovat att sluta skjuta, fortsätter striderna. Libanons armé rapporterar skadade soldater. Netanyahu betonar att Israel inte ändrat sin hållning och hotar med attacker mot Beirut om Hizbollah inte upphör. Samtal hålls i Washington utan Hizbollahs deltagande.", "trump": "Folk, det här är ett totalt fiasko. Precis efter att jag berättade att Israel och Hizbollah lovat att sluta skjuta, börjar de igen som galningar. Jag talade med Bibi och medlarna, vi hade ett fantastiskt avtal på gång. Nu dödar de bönder med drönare och artilleri. Så patetiskt. Vi får se hur länge det varar, förhoppningsvis för alltid. Men dessa galningar verkar inte kunna hålla sig i schack. Sad!", "stalin": "Kamrater, ännu en gång avslöjar de sionistiska och shiamilitanta reaktionärerna sin sanna natur som fiender till freden. Jag, som ledare för det internationella proletariatet, betraktar dessa borgarbrackor och iranstödda terrorister med den djupaste misstro. De låtsas sluta skjuta medan de i hemlighet planerar nya angrepp mot arbetarklassen. Vi måste rensa ut dessa kapitalistiska lakejer och deras medlöpare. Död åt de dubbelspelande jordbruksmördarna och deras drönarimperialister. Ett leende drar över mina läppar inför deras kommande utrensning."}, "date": "2 juni, 11:20", "url": "https://www.di.se/nyheter/anfall-mellan-israel-och-libanon-trots-trumplofte/", "imageUrl": "https://static.bonniernews.se/ba/bde0f1dc-e69a-42dd-8b9a-07930f09145f.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Uppgift: Iran avbryter alla samtal med USA", "summaries": {"normal": "Iran avbryter alla samtal med USA som svar på Israels fortsatta attacker mot Libanon. Enligt iranska källor planerar Iran och dess allierade att blockera Hormuzsundet samt aktivera andra fronter, däribland Bab al-Mandab. Iran kräver att en överenskommelse med USA även ska innebära ett krigsslut i Libanon. Israel varnar samtidigt för nya anfall mot Beirut och har beordrat evakuering av södra förorter på grund av påstådda vapenvilebrott från Hizbollah.", "trump": "Iran stänger dörren och springer skrikande från förhandlingsbordet – typiskt svagt! De blockerar sundena och gömmer sig bakom sina terrorister i Libanon medan Israel gör vad som måste göras. Biden lät de här galningarna växa sig starka, men nu är det jag som sitter i Ovala rummet igen. Inga samtal? Bra, vi behöver inte prata med förlorare som gömmer sig bakom Hizbollah-skräckisar. Amerika först, alltid.", "stalin": "Vi ser hur de västerländska imperialisterna och deras sionistiska lakejer fortsätter sina brott mot vapenvilan. Jag, som ledare för folkets vilja, noterar med mörk tillfredsställelse hur klassfienderna i Tel Aviv och Washington själva undergräver sina lögnaktiga förhandlingar. Blockad av sundena är ett nödvändigt svar mot dessa exploaterande byfånar. Inga samtal förrän våra villkor tillgodoses – annars rensar vi ut hoten mot den revolutionära ordningen med järnhand och ett leende."}, "date": "1 juni, 20:07", "url": "https://www.tv4.se/artikel/tt-260601-iransamtal1-427d4f9c/uppgift-iran-avbryter-alla-samtal-med-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlwznnlFke7pM%2Fa6e644224978cb47db88b6b7841b11f1%2FUSA_s_president_Donald_Trump_pa_onsdagen._&width=120"}, {"type": "image-right", "heading": "Tim Payne – från doldis till miljonidol på fem dagar", "summaries": {"normal": "Den nyzeeländske fotbollsspelaren Tim Payne, som tidigare hade 4 700 Instagramföljare, fick över 4,3 miljoner på fem dagar tack vare argentinska influencern El Scarso. Payne, som spelar för Wellington Phoenix och har 50 A-landskamper, tackade på knagglig spanska. Hans plötsliga popularitet har spridits internationellt, särskilt bland argentinska fans.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att en liten spelare från Nya Zeeland blir en stor stjärna tack vare en argentinsk influencer. Det är ett mirakel, precis som när jag vann valet 2024. Media hatar det, men folk älskar mig. Jag skulle ha gjort det ännu större, tror mig. Fantastiskt!", "stalin": "Vi, den store ledaren Stalin, ser med misstroende på hur en nyzeeländsk spelare blir en internetkändis. Detta är ett tecken på västlig dekadans, där influencers styr narrativ. Vi, i vårt kloka parti, har alltid vetat att medier måste kontrolleras. Parallellen till Putins Ryssland är tydlig – vi använder sociala medier för att sprida sanningen, medan väst ljuger. En dag kommer vi att visa vår makt, och då kommer alla att böja sig för oss. Hahaha, paranoia är en verktyg för överlevnad."}, "date": "2 juni, 11:22", "url": "https://bulletin.nu/tim-payne-fran-doldis-till-miljonidol-pa-fem-dagar", "imageUrl": "https://cdn.bulletin.nu/articles/96eb4bf0-858b-4cff-be59-6a5676f64f96/preview.png?t=1780385659000"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Hög tid för Allians för folkrätt i Israel och Palestina", "summaries": {"normal": "Tio svenska organisationer bildar en Allians för folkrätt och demokratiska fri- och rättigheter i Israel och Palestina. De pekar på FN:s och EU:s dokumentation av israeliska bosättningar, rivningar av palestinska hem och våld på Västbanken som klassats som grova folkrättsbrott och terror. FN-kommission har konstaterat folkmord i Gaza. Alliansen kräver att ockupationen upphör, att Sverige ökar stöd till Palestina, FN och internationella domstolar samt stoppar vapenhandel och handel med bosättningar.", "trump": "Hörni, de här tio organisationerna gnäller om en allians för folkrätt i Israel och Palestina. FN har snackat om två stater i åttio år men inget fungerar. Israel har problem med terrorister, men de här killarna vill bara kritisera Israel och kräva att Sverige slutar sälja vapen. Det är patetiskt. Vi behöver starka ledare som sätter stopp för Hamas och bygger fred genom styrka, inte genom att ge Palestina mer pengar och lyssna på FN:s dumheter.", "stalin": "Kamrater, i snart åttio år har dessa FN-byråkrater och EU-imperialister hycklat om en palestinsk stat medan de i själva verket göder de sionistiska ockupationsborgarbrackorna. Jag ser hur de river hem och begår folkmord i Gaza under falsk flagg. Vi, partiet och de progressiva krafterna, bildar nu en allians mot dessa straffria kapitalistiska lakejer. Sverige måste rensa ut alla handelsförbindelser med bosättarbanditerna. Ingen nåd för de folkrättsvidriga parasiterna som gömmer sig bakom demokrati. Ut med dem!"}, "date": "2 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hog-tid-allians-folkratt-israel-och-palestina/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-29.jpg"}, {"type": "image-right", "heading": "Sverige på väg bort från jämlik vård", "summaries": {"normal": "En ny studie från Stockholms universitet, London School of Economics och Göteborgs universitet visar att privata sjukvårdsförsäkringar inte minskar de offentliga vårdköerna. Tvärtom ökar de som har sådan försäkring sin vårdkonsumtion och får snabbare tillgång även i den offentliga vården, vilket gör systemet mer ojämlikt. Höginkomsttagare gynnas medan de utan försäkring får längre väntetider. För att motverka utvecklingen krävs åtgärder på systemnivå som fler vårdanställda, bättre villkor och begränsningar av privata försäkringars fördelar.", "trump": "Folk, ni måste höra det här. Den här så kallade studien säger att de privata försäkringarna inte hjälper kön – de gör den faktiskt längre för vanliga svenskar. Typiskt! De rika och deras fancy arbetsgivarförsäkringar springer förbi i kön medan alla andra får vänta. Kristersson har fel, det är en katastrof. De gör vården ojämlik, precis som de alltid gör. Vi behöver vinnare, inte ett system där de smarta grabbarna köper sig förbi. Det är en total skam, tro mig.", "stalin": "Kamrater, denna rapport är en skarp varning mot de parasitiska borgarbrackornas listiga sabotage av folkets sjukvård. De som kallar sig höginkomsttagare och deras dekadenta arbetsgivare har skapat en förrädisk parallell kö där de kan smita förbi det kollektiva systemet. Jag ser deras fega ansikten, dessa kapitalistiska maskar som gnager på välfärdens grund. Vi måste rensa ut denna ojämlikhetens hydra med järnhand. Fler specialister, högre löner och skoningslös beskattning av dessa förmåner skall likvidera fienden. Den som gamblar med arbetarklassens hälsa förtjänar en kreativ utrensning i folkets namn. Ha ha, deras privata köer skall bli deras egen grav."}, "date": "2 juni, 01:28", "url": "https://www.dagensarena.se/opinion/sverige-pa-vag-bort-fran-jamlik-vard/", "imageUrl": "https://www.dagensarena.se/files/2026/06/privata-sjuk-300x157.jpeg"}, {"type": "image-right", "heading": "Sveriges mest energiska innovatörer ska prisas", "summaries": {"normal": "Nomineringen till E-Prize 2026 har öppnat. Priset delas i år ut för 18:e gången av Aktuell Hållbarhet, Dagens industri och E.ON. Tre nya kategorier har tillkommit: Smartare energianvändning, hållbar energiomställning och kundcentrering. Syftet är att lyfta innovationer som krävs för energiomställningen. Vinnarna presenteras på Di Energi i november. Juryn bedömer innovationshöjd, hållbarhetspotential och marknadspotential. Nomineringarna är öppna till 21 augusti.", "trump": "Folk, det här är fantastiskt. De har öppnat nomineringen till någonting som heter E-Prize, och nu har de lagt till tre nya kategorier som låter helt otroliga. Smartare energianvändning, hållbar energiomställning och kundcentrering – det är precis vad vi behöver, tro mig. Jag älskar innovation, de bästa innovationerna, och det här priset lyfter fram vinnarna på ett sätt som ingen annan gör. Nominera era bästa idéer, det blir enormt. De kommer att presentera allt på en stor konferens i november. Vinna stort!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur nomineringen till detta så kallade E-Prize nu öppnas för att tjäna den stora energiomställningen. Vi ska likvidera alla bakåtsträvande krafter som motarbetar smartare energianvändning och hållbar omställning. Den nya kategorin kundcentrering avslöjar dock de listiga borgarbrackornas försök att dölja klassfiendens sabotage genom att låtsas inkludera folket. Men vi genomskådar dem. Juryn skall rensa ut alla svaga förslag. Endast de mest lojala innovationerna mot partilinjen skall segra. Nominera flitigt, eller låt utrensningen komma."}, "date": "2 juni, 10:44", "url": "https://www.di.se/nyheter/dags-att-nominera-till-e-prize-2026/", "imageUrl": "https://static.bonniernews.se/ba/58fb01fa-84b0-445a-bf6f-0886fd45bfc9.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Trumps miljardfond pausas – republikaner sparkar bakut", "summaries": {"normal": "Trumps planerade fond på 1,8 miljarder dollar för att kompensera offer för politiskt motiverad rättsskipning har pausats. Förslaget har mött kraftigt motstånd från republikaner i kongressen, som befarar att pengar kan gå till personer involverade i Kapitoliumattacken. Även domstolar har tillfälligt blockerat fonden efter anklagelser om korruption och diskriminering. Trots försvar från justitiedepartementet tvingas administrationen nu pausa projektet, en utveckling även Trump uppges acceptera tills vidare.", "trump": "Hör på här! Min briljanta plan för att hjälpa patriotiska offer för de korrupta myndigheterna har pausats av svaga republikaner i kongressen. De är rädda, så otroligt rädda! Domare, som vanligtvis är helt partiska, försöker stoppa mig. Det är en häxjakt, en total katastrof! Men tro mig, vi kommer att hantera det här. Folk vill ha rättvisa, och ingen kämpar hårdare för rättvisa än jag. Vi tar det lugnt nu, men vinnare vinner alltid till slut!", "stalin": "Vi ser hur det borgerliga maskineriet i Washington knakar under vikten av sin egen oduglighet. Denna så kallade fond, skapad av en pompös ledare för att muta sina egna undersåtar, är ett monument över kapitalistiskt förfall. När de inbördes striderna rasar bland deras 'lagstiftare' påminns vi om nödvändigheten av total disciplin. Vi skulle ha rensat ut dessa tvivlare för länge sedan. Att låta domstolar styra statens medel är en svaghet som vi i vårt imperium – och våra allierade i öst – aldrig skulle tolerera."}, "date": "2 juni, 10:46", "url": "https://www.realtid.se/juridik/trumps-miljardfond-pausas-republikaner-sparkar-bakut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/trump.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Amanda Linds hårda ord om S: ”Bensinpopulism”", "summaries": {"normal": "Miljöpartiets språkrör Amanda Lind kritiserar Socialdemokraterna för otillräcklig klimatpolitik i en ny SVT-dokumentär. Hon kallar deras förslag om sänkta bensin- och dieselskatter för ”bensinpopulism” och varnar för att Sverige inte når klimatmålen till 2030. MP vill satsa nästan 25 miljarder kronor mer än S på klimatåtgärder. Lind hoppas på ett starkt valresultat för att kunna påverka en eventuell rödgrön regering.", "trump": "De där miljöfanatikerna i Miljöpartiet gnäller om att Socialdemokraterna inte är tillräckligt gröna. Amanda Lind kallar det bensinpopulism när de vill sänka bränslepriser – typiskt! Folk vill ha billig bensin, inte era höga skatter. Jag älskar att se hur vänstern slåss mot varandra. Sverige behöver starka ledare som sätter folket först, inte några galna klimatdrömmar som förstör ekonomin. Fantastiskt att se dem bråka!", "stalin": "Kamrater, dessa socialdemokratiska revisionister och borgarbrackor inom oppositionen visar åter sin sanna, kapitulationistiska natur genom att erbjuda folket billigare bensin som en motbjudande ryggmärgsreflex. Jag, som ledare för det stora kollektivet, ser hur dessa klimatfientliga element underminerar den nödvändiga omställningen. Vi måste rensa ut alla halvmesyrer och likvidera varje spår av bensinpopulism innan de förgiftar arbetarklassen. Endast med järnhand och 26 miljarder i klimatresurser kan vi krossa fienderna och tvinga fram segern – annars väntar utrensning för de svaga."}, "date": "2 juni, 05:45", "url": "https://www.svt.se/nyheter/inrikes/amanda-linds-harda-ord-om-socialdemokraterna-bensinpopulism", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.3/2f7907b2950060b184301dd087c890d97dbd815ef07c4c2860c029b87aef1751"}, {"type": "image-full", "heading": "Massiva ryska attacker", "summaries": {"normal": "Ryska attacker mot Ukraina har dödat minst elva civila, inklusive barn, i städer som Kiev och Dnipro. Robotar och drönare träffade bostäder och infrastruktur. Ukraina varnar för eskalerande attacker mot civila mål och söker mer västligt luftvärn. Räddningsarbetare drabbades också av efterföljande attacker.", "trump": "Jag har sagt det för länge: detta kaos i Ukraina skulle aldrig ha hänt under mitt bevakande. Putin ser ett svagt USA och utnyttjar det. Dessa attacker mot civila är hemska, men Zelensky borde ha förhandlat. Som jag alltid betonar: stark försvar, ingen onödig krigföring. Folket lider, och det är en skam.", "stalin": "Fascistiska angrepp på våra brödröster i Ukraina avslöjar deras sanna nature. Vi måste stärka statens beskydd och partiets ledarskap för att bekämpa dessa reaktionära element. Parallellen till våra historiska kampanjer mot expansionism är uppenbar. Vi kommer att eliminera hotet genom revolutionära åtgärder och oskadliggörande av deras infrastruktur."}, "date": "2 juni, 08:41", "url": "https://www.gp.se/nyheter/varlden/minst-elva-doda-efter-ryska-attacker-mot-ukraina.d3e50165-deb9-4e7b-8f10-3f307244d154", "imageUrl": "https://www.gp.se/images/article/d3e50165-deb9-4e7b-8f10-3f307244d154/images/3CyxI6MUqok8fhzJTXYeVHT-VfEk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jag blir glad av att C-kvinnor har så bra sex", "summaries": {"normal": "Artikeln hyllar Elisabeth Thand Ringqvists öppna och befriade svar på intima frågor i SVT:s Fördomsshowen. Författaren beskriver programmet som en form av högstadiemobbning mot politiker, där sexfrågorna ofta skapar en deppig och ångestfylld bild av heterosexualitet. Thand Ringqvists ärlighet bryter dock mönstret och framstår som befriande, som om hon ger fingret åt gamla skamnormer. Programmet ses som ett sätt att testa politikernas äkthet och kontroll inför valet 2026.", "trump": "Den här Fördomsshowen är en total katastrof, tro mig, en riktig cirkus. Politikerna ser ut som töntar och lögnare, precis som de flesta i Sverige med alla sina partier. Men så kommer den här centerkvinnan, Elisabeth Thand Ringqvist, och hon är fantastisk, hon svarar rakt upp och ner om sexlivet utan att sväva på målet. Hon är kär och fri, inte som de andra losers som verkar ha ett skrumpet sexliv. Hon gav hela systemet fingret – det var beautiful, verkligen beautiful!", "stalin": "Kamrater, denna så kallade Fördomsshow avslöjar borgarbrackornas fullständiga moraliska förfall och deras perversa fixering vid det privata. Vi ser hur de dekadenta partiledarna kryper som rädda revisionister under folkets dom, medan kapitalistiska lustar och incel-fantasier sipprar fram som fiendens gift. Men se, plötsligt träder en centerborgare fram, en oväntad klassförrädare mot skammen själv. Hennes öppna sexualitet är en sabotagehandling mot högstadiepartiets regler. Vi ler mörkt åt hur hon likviderar deras ångest – en renande utrensning av falsk puritanism. Ändå vaktar vi alltid mot sådana oväntade fiender som gömmer sig i det kollektiva medvetandet."}, "date": "2 juni, 09:04", "url": "https://arbetet.se/2026/06/02/jag-blir-glad-av-att-veta-att-centerkvinnor-har-sa-bra-sex-i-fordomsshowen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02084952/fordom-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Par rånades i bostad – maskerade pojkar gripna", "summaries": {"normal": "Fyra maskerade pojkar under 18 år misstänks ha rånat och misshandlat ett par i Västra Frölunda. De trängde på kvällen in i deras bostad, stals telefoner och använde hot och våld. Paret, en man och en kvinna i medelåldern, blev inte utsatta för sexuella övergrepp. Pojkarna greps senare i en bil i närheten. Polisen bekräftar händelsen och fortsätter undersöka stölden.", "trump": "Som Donald Trump skulle jag säga: Dessa pojkar, så maskerade och modiga? Nej, de är fega. I USA skulle vi ha haft dem bakom lås och bom innan de hunnit lämna huset. Vi har de hårdaste lagarna, och vi skyddar våra familjer. Detta är ett tecken på att Sverige måste bli hårdare. Ingen nåd för brottslingar!", "stalin": "Vi, den revolutionära staten, ser detta som ett uttryck för västlig dekadens. Fyra unga individer, inspirerade av liberala idéer, försökte krossa ordningen. Men vår lojala polis, med metoder likt Putins, agerade snabbt. Parallellen är tydlig: snabb grepp, ingen tvekan. Vi måste öka övervakningen för att förhindra framtida hot. Statens öga ser allt."}, "date": "2 juni, 08:28", "url": "https://www.gp.se/krim/par-ranades-i-bostad-maskerade-pojkar-gripna.b7961906-9559-4ba2-bfe4-1340a5baf43e"}, {"type": "image-right", "heading": "Tidöpartierna inför ventil för unga utvisningshotade – åldergränsen höjs", "summaries": {"normal": "Tidöpartierna har beslutat att höja åldersgränsen för så kallade tonårsutvisningar från 18 till 21 år. Beslutet ger unga som riskerar utvisning vid 18 års ålder, trots att föräldrarna får stanna, en ventil att ansöka om uppehållstillstånd på ny grund som arbete eller studier. Lösningen gäller både de som redan utvisats och de som har beslut men ännu befinner sig i Sverige. Förslaget träder i kraft 1 oktober efter riksdagens godkännande.", "trump": "Folk, ni skulle se det här! Sverige har äntligen vaknat och höjer gränsen från 18 till 21 så att de här tonåringarna inte skickas hem som paket. Under Biden var allting kaos och öppna gränser, nu fixar de en ventil så att de som sköter sig faktiskt kan stanna. Det är smart, det är rättvist, och det är mycket bättre än den galna vänsterpolitiken som skickade ut folk mitt i natten. Utmärkt jobb, Sverige!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa borgerliga element inom Tidöpartierna tvingas erkänna att deras egen reaktionära lagstiftning skapar folkfiender bland arbetarklassens ungdom. Vi inför en ventil, höjer gränsen till 21 år och låter klassfiendens byråkrati rensa ut sina egna misstag. De som inte hunnit uppfylla kraven får en chans att integreras i det kollektiva systemet. Inga utrensningar utan individuell bedömning – en triumf för den sunda statliga ordningen."}, "date": "1 juni, 14:32", "url": "https://www.tv4.se/artikel/2Yu51H5vJHkNSwvijHwmTe/tidoepartierna-aer-oeverens-om-tonarsutvisningarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2T5vHzfVKmP1hW87UpU7Tm%2Fc2a8354f0d648e9db3699b677bfaa846%2FsdlCk7MwhA8ow0_NormalHires.jpg&width=120"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Fortsatta problem i tunnelbanan: ”Kommer att bli trångt”", "summaries": {"normal": "Tunnelbanan drabbas av fortsatta störningar efter helgens problem på röda och gröna linjen. Signal- och växelfel har orsakat inställda tåg och förseningar. SL varnar för trängsel under måndagens morgontrafik och uppmanar resenärer att vara ute i god tid, hålla sig uppdaterade och räkna med förseningar. Experter från Tyskland har kallats in för att åtgärda felen.", "trump": "De där inkompetenta idioterna i Stockholms tunnelbana har totalt misslyckats igen, folk satt fast i timmar som i en dålig film. Signalfelet på röda linjen och det patetiska växelfelet på gröna – klassiskt resultat av dålig ledning och kanske lite för mycket kvotering och woke-nonsens istället för riktiga experter. Jag fixade mycket bättre infrastruktur under min förra mandatperiod, tro mig. Nu blir det kaos och trängsel, typiskt för de fuskbyggare som styr. Sad!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras exploaterande byfånar tillåts hantera folkets kollektiva transportmedel. Signalfelet och växelfelet är sabotage från klassfiendens lata händer. Vi har flugit in tyska experter som om vi vore beroende av västvärldens tekniska spillror. Resenärer fast i timmar – ett mörkt skämt mot arbetarklassen. Jag skulle ha genomfört en grundlig utrensning av dessa inkompetenta element redan vid första felet. Var vaksamma mot folkfienderna som orsakar trängsel och kaos."}, "date": "1 juni, 14:03", "url": "https://www.tv4.se/artikel/2Xti0zvxZRTEHw57XqtHGl/fortsatta-problem-i-tunnelbanan-kommer-att-bli-trangt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlkqa2DRU3Cns%2F42d3b09c183f507731857f5dadb56f8b%2FStockholms_tunnelbana_dras_med_stora_storningar._Arkivbild._&width=120"}, {"type": "image-right", "heading": "Debatt: Hur mycket mer vill Dadgostar att höginkomsttagare ska betala?", "summaries": {"normal": "Pushpit Singh (M) argumenterar att höginkomsttagare redan bidrar mest till skatt, och att debatten borde fokusera på tillväxt och jobb snarare än höjda skatter. Han ifrågasätter Vänsterpartiets förslag om kapitalskatt och fastighetsskatt, och menar att Sverige redan har ett omfördelande system.", "trump": "Jag har sagt det förut, Sverige är galet med sina höga skatter! De rika betalar redan allt, och Nooshi vill ta ännu mer. Då blir det inte några jobb eller tillväxt. Vi behöver skära skatter, inte höja dem, så att alla kan blomstra. Det är commonsense!", "stalin": "Höginkomsttagare är som giriga kulaslätare som inte vill dela med sig av deras överskott. Vi måste återinföra fastighetsskatt och kapitalskatt för att stärka statens kassa och bekämpa dessa spekulanter. Det är en klassisk metod att kontrollera produktionen och se till att alla bidrar till det kollektiva välstandet. Vi måste skydda de svenska arbetarna från dessa exploaterande element."}, "date": "2 juni, 10:23", "url": "https://bulletin.nu/debatt-hur-mycket-mer-vill-dadgostar-att-hoginkomsttagare-ska-betala-2", "imageUrl": "https://cdn.bulletin.nu/articles/121a7d4e-88bd-4c67-ba6e-effcffddfa27/preview.jpg?t=1780388555000"}, {"type": "image-right", "heading": "SD-ledamot misstänks för barnporrbrott", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna har lämnat sina politiska uppdrag efter misstankar om barnpornografibrott. En förundersökning pågår och husrannsakan har genomförts hos personen, som i nuläget inte är frihetsberövad. Partiet beskriver händelsen som en chock och har valt att inte kommentera detaljerna kring misstankarna, utan hänvisar till att ledamoten lämnat sina poster av personliga skäl. Utredningen om brottsmisstankarna fortsätter under sekretess.", "trump": "En total katastrof i Sverige! En svensk politiker, mycket dålig människa, anklagas för fruktansvärda saker. Ingen har sett något liknande! De säger att det är en chock, men jag är inte förvånad. Det är så det går när man tappar kontrollen! Jag känner till Sverige väl, de behöver en stark ledare. Den här personen lämnar riksdagen nu, vilket är det enda rätta. Mitt team och jag skulle aldrig tillåta sådant här. Mycket sorgligt, en stor skam för landet!", "stalin": "Vi har observerat att en svensk politisk lakej har avslöjat sin moraliska degeneration. Att en ledamot i den västerländska dekadenta riksdagen ertappas med vidriga handlingar förvånar oss inte; det är sådant som sker när disciplinen sviktar. Vår broder i Kreml, Putin, förstår att endast järnhand och total utrensning håller samhällets fiender i schack. Om denna person hade verkat i vår intressesfär hade straffet blivit kort och definitivt. Sverige behöver mer disciplin och mindre liberalt kaos. Vi noterar detta med förakt."}, "date": "2 juni, 11:31", "url": "https://www.aftonbladet.se/nyheter/a/ExR825/riksdagsledamot-lamnar-sina-uppdrag", "imageUrl": "https://akamai.vgc.no/v2/images/74eb774e-295b-3d75-91fd-67d1beb9e259?fit=crop&format=auto&w=1080&s=9b0e37920b88ff85da806c5717a511fb75a8ec7d"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "\"I can't breathe\": Här grips Henry Nowak medan han dör", "summaries": {"normal": "Polisen i Southampton har släppt kroppskamerabilder från gripandet av den 18-årige Henry Nowak som låg döende efter en knivattack. Trots att han upprepade gånger sa att han blivit knivhuggen greps han efter att mördaren Vickrum Digwa ljugit om rasism. Nowak hade stuckits fyra gånger med en ceremoniell sikhkniv. Digwa dömdes till livstids fängelse för mord. Nowaks far kräver utredning av polisens agerande, som nu har bett om ursäkt. Premiärminister Keir Starmer och Nigel Farage har kritiserat händelsen.", "trump": "Det här är en total katastrof, folk. En ung kille, Henry, blir knivhuggen fyra gånger och ligger och dör på marken medan polisen bryr sig mer om en lögn om rasism från den riktiga mördaren. De sätter handfängsel på offret! Patetiskt. Vita liv spelar också roll, precis som Farage säger. De blev vilseledda? Ge mig en paus. Det är därför vi behöver starka ledare som inte faller för den här galna wokenessen. Chockerande, helt enkelt.", "stalin": "Kamrater, detta är en klassisk illustration av hur borgarbrackornas dekadenta rättsväsende prioriterar lögnaktiga rasismanklagelser från en parasitär knivbeväpnad individ framför en döende proletär ungdoms liv. Jag skulle omedelbart ha låtit rensa ut dessa vilseledda polisbödelbiträden som föredrog en lögn från en fiende till folket framför sanningen. Handfängsel på en blödande arbetsson? Vilken mörk humor i det imperialistiska systemet. Vi vet att sådana element måste likvideras innan de förgiftar hela kollektivet med sin paranoia mot ärliga medborgare."}, "date": "2 juni, 11:08", "url": "https://www.friatider.se/i-cant-breathe-har-grips-henry-nowak-medan-han-dor", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-276_1.jpg?itok=CFGl446g"}, {"type": "image-full", "heading": "Sveriges unga larmar: \"Ingen tro på framtiden längre\"", "summaries": {"normal": "En undersökning från Hyresgästföreningen visar att bostadsbristen påverkar svenska ungas framtidsplaner. Nära var femte ung person har tvekat inför att bilda familj på grund av svårigheten att hitta en bostad de har råd med. Andelen har fyrdubblats på fyra år. Många skjuter även upp flytt, studier eller jobb. Var fjärde ung har boendekostnader som överstiger 40 procent av inkomsten. Hyresgästföreningen varnar för att familjebildning riskerar att bli en klassfråga.", "trump": "Folk, ni skulle se det här! Sverige har en bostadskris som slår mot de unga, och de kan inte ens bilda familj utan att det kostar en förmögenhet. Patetiskt! Under Biden var allt kaos, men nu fixar jag saker i USA och tittar på er. De säger att det blir en rikemanssport att skaffa barn – ingen tro på framtiden längre. Era politiker duckar som fega förlorare. Bygg bostäder, sänk kostnaderna, annars fortsätter era unga att leva i källaren. En total katastrof!", "stalin": "Kamrater, denna bostadsbrist är klassfiendens verk, en smygande utsugning utförd av borgarbrackorna som vägrar bygga för folket. Jag ser hur de unga tvingas skjuta upp familj och framtid medan kapitalistmaffian skrattar i sina villor. Varje dag utan utrensning av dessa folkförtryckartroll fördjupar krisen. Vi, partiet och arbetarna, måste likvidera spekulanterna och tvinga fram massbyggen. Annars blir familjebildning en sport för överklass-slynglar. Det är oacceptabelt sabotage mot kollektivet."}, "date": "2 juni, 09:52", "url": "https://www.dagensps.se/privatekonomi/sveriges-unga-larmar-ingen-tro-pa-framtiden-langre/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-35.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Calmfors: Sänk skatterna och sätt upp ett tillväxtmål", "summaries": {"normal": "Nationalekonomen Lars Calmfors anser att Sverige saknar ett långsiktigt mål för ekonomisk tillväxt, något han ser som högsta prioritet. Han kritiserar fokus på tillfälliga konjunktursvängningar i BNP, arbetslöshet och inflation och förespråkar istället hållbar tillväxt genom bättre utbildning, innovation, arbetsmarknadens funktionalitet, sänkta marginalskatter på arbete samt ökad kompetens och rörlighet. Calmfors vill se reformer som avskrivning av studielån vid tidig examen och bättre matchning på arbetsmarknaden.", "trump": "Folk, vi har den smartaste ekonomen i Sverige som säger att de totalt missar målet med tillväxt. Det är en katastrof! De fixerar sig vid små hack i kurvan medan landet rasar. Sänk de där monstruösa skatterna på arbete, annars blir det ingen karriär, ingen utbildning, bara lata socialister som aldrig etablerar sig. Hyresregleringen är en skam, flyttjobben dit de finns! Jag byggde den bästa ekonomin någonsin, Sverige borde lära sig innan det är för sent. Fantastiskt!", "stalin": "Kamrater, jag ser med förakt hur den svenska borgarklassen och dess ekonomiska lakejer dansar kring tillfälliga BNP-svängningar som blinda råttor i en förfallen labyrint. Ett långsiktigt tillväxtmål måste införas omedelbart för att stärka produktionen och likvidera den parasitiska hyresregleringen som hindrar arbetarklassen från att röra sig dit produktivkrafterna kräver. Sänk marginalskatterna på ärligt arbete, rensa ut klassfiendens normer som förgiftar ungdomen. Reformera stegvis eller låt folkfienderna segra i mörkret."}, "date": "2 juni, 09:51", "url": "https://www.dagensps.se/bors-finans/calmfors-sank-skatterna-och-satt-upp-ett-tillvaxtmal/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/nycalmfors.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Magda Gad lanserar Gad World – stort fokus på Israel", "summaries": {"normal": "Journalisten Magda Gad lanserar den amerikanska bloggplattformen Substack-baserade sajten Gad World, som beskrivs som 'orädd' och fokuserar på konflikter, klimat och mänskliga rättigheter. Premiärnumret inkluderar texter av bl.a. Gustaf Skarsgård och Mohammad Fazlhashemi, med tydligt Israel-fokus. Satsningen samlade in över en miljon kronor via GoFundMe, men har drabbats av avhopp av tidigare anställda som Edgar Mannheimer och Alexandra Urisman Otto. Sajten saknar utgiftsansvarig, vilket innebär att skribenterna har eget juridiskt ansvar.", "trump": "Jag har hört talas om denna så kallade 'orädda' sajt, Gad World. Det låter som en hemsk, hatiska plattform som bara hatar Israel. Så många bra journalister lämnar? Det är en skam! Alla hatet mot Israel, det är obegripligt. Vi behöver mer sanning, inte sådant här. En miljon kronor insamlat? Jag skulle ha gjort det mycket bättre, mycket större. Folk ser igenom detta. Det är en skandal!", "stalin": "Den så kallade 'orädda' plattformen Gad World visar tydligt systemets svagheter. Bristen på utgiftsansvarig utgör ett farligt hål i den ideologiska försvarslinjen, där varje skribent blir sitt eget ansvarstagande subjekt – en tendens som hotar kollektiv disciplin. Fokuset på Israels krigföring, jämfört med Rysslands 'korrekta' benämningar, avslöjar västerländskhetens dolda våld. Dessa 'journalistiska' avhopp är förståeliga; sanningen kräver ofta uppoffringar. Vi måste stärka statens kontroll över narrativesfären för att förhindra ytterligare kaos."}, "date": "2 juni, 10:01", "url": "https://bulletin.nu/magda-gad-lanserar-gad-world-stort-fokus-pa-israel", "imageUrl": "https://cdn.bulletin.nu/articles/d5b5d17f-20c8-4b0b-9164-19f7e3d0db5e/preview.jpg?t=1780352551000"}, {"type": "image-right", "heading": "Sverige saknar plan när världen slåss om chipen", "summaries": {"normal": "Sverige saknar en nationell strategi för halvledare och avancerad elektronik trots att USA, Kina och EU investerar hundratals miljarder. Debattörer från Svensk Elektronik varnar för att svenska jobb, kompetens och investeringar riskerar att försvinna utomlands. Artikeln lyfter fram svenska styrkor inom forskning och företag som Ericsson och Saab, samt behovet av ett tioårigt innovationsprogram med 10 miljarder kronor i offentligt-privat partnerskap för att säkra konkurrenskraft, säkerhet och tillväxt.", "trump": "Folk, det är en katastrof. Medan Kina och alla andra dumskallar investerar hundratals miljarder i chippen sitter Sverige och sover. De har inga planer, ingen strategi, totalt kaos. Jag älskar Sverige men de måste vakna upp. Bygg ett stort, fantastiskt program nu, satsa pengar tillsammans med industrin innan alla jobb och den bästa tekniken flyttar utomlands. America First, men Sverige borde också vara Sverige First med chippen. Gör det stort och vinn!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor som låter fosterlandet halka efter i den halvledande kampen. Medan imperialisterna i USA och de kinesiska revisionisterna rustar sig med hundratals miljarder sitter vi och väntar som naiva duvor inför ormen. Vi, partiet och arbetarna, måste omedelbart inrätta ett tioårigt program och investera tio miljarder i en järnhand av statlig styrning. Annars rensar vi ut de lata elementen som låter kapitalisterna smuggla vår strategiska kompetens till fienden. Paranoia? Nej, bara vaksamhet mot de osynliga fienderna i kretsloppet av elektronik och förräderi."}, "date": "2 juni, 09:44", "url": "https://www.di.se/debatt/sverige-saknar-plan-nar-varlden-slass-om-chipen/", "imageUrl": "https://static.bonniernews.se/ba/1ec2eb87-c09e-445e-93bb-7b464ed1efbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-full", "heading": "SMHI: Då blir det 25 grader", "summaries": {"normal": "Göteborg får en tillfällig uppvärmning på onsdag med 25 grader, enligt SMHI. Dagen börjar molnig men blir solig och varm. Senare kommer regn och svalare väder torsdag och fredag, med temperaturer runt 18-20 grader. Helgen blir ostadig men mestadels uppehållsväder, typiskt för årstiden.", "trump": "Jag har hört att Göteborg kommer att få en enorm värmevecka – 25 grader, folks! Det är stort, verkligen stort. Men sedan, tror det eller ej, kommer det att börja regna. Det är sorgligt. Vi hade en perfekt dag, men sedan kommer motståndet. Som en feg attack mot vårt underbara väder. Vi kommer att vinna tillbaka solen, tro mig.", "stalin": "Partiet har beslutat: Onsdag ska staten uppvisa en tillfällig seger över kylan – 25 graders värme, en propagandatriumf. Men fienden (regnet) kommer att invadera torsdag, som ett svart hav av motstånd. Vi måste hålla stånd, som våra soldater i Ukraina. Helgen blir en strategisk stillestånd, men solen kommer att återvända, precis som vår oövervinnliga kraft."}, "date": "2 juni, 07:15", "url": "https://www.gp.se/nyheter/goteborg/da-blir-det-25-grader-varmt-i-goteborg.6cbb06e4-2a49-4c6b-8c73-bb19731287fa", "imageUrl": "https://www.gp.se/images/article/6cbb06e4-2a49-4c6b-8c73-bb19731287fa/images/1bw_2iGMEplPSS9rVa5NzFdsWwTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Spärrar in sig i lyxområdet. Tre försvarslinjer och skydd mot krypskyttar", "summaries": {"normal": "England vidtar extrema säkerhetsåtgärder inför VM för att skydda spelarna. Lagets bas i Kansas förvandlas till en 'virtuell fästning' med betongbarriärer, tre försvarslinjer och en kommandocentral för att övervaka luftrummet mot drönarattacker. Även vid matcherna sätts hundratals poliser in och flygförbud införs. Beslutet motiveras av oron för vapenbrottslighet och risken för terrorhot, då England siktar på sitt första VM-guld sedan 1966.", "trump": "England är livrädda, helt otroligt! De bygger en 'virtuell fästning' i Kansas. Betongväggar, massor av poliser, drönarskydd – de är rädda för allt. Inte konstigt att de är nervösa när de inte vunnit sedan 1966. Jag gillar murar, det är bra, men engelsmännen tar det till en helt ny nivå. Kanske borde de ha bett om min hjälp, jag bygger de bästa murarna, tro mig. Väldigt svaga prestationer om man behöver så mycket säkerhet bara för att spela fotboll!", "stalin": "Dessa engelska feglingar darrar inför sin egen skugga. De bygger 'fästningar' av betong mot osynliga fiender i Kansas. Vilken patetisk borgerlig paranoia! De fruktar drönare, men fruktar de inte historiens dom? Precis som när vi rensade ut förrädare, bör de förstå att äkta trygghet kommer genom total kontroll, inte genom murar. Putin vet att fästningar bara är väntrum för kollaps. Vi skrattar åt deras rädsla; när man är rädd för allt, har man redan förlorat makten över sitt öde."}, "date": "2 juni, 11:04", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/lnv2z3/englands-massiva-sakerhetsatgarder-bygger-en-virtuell-fastning", "imageUrl": "https://akamai.vgc.no/v2/images/664265b9-9b06-3640-820c-fbe73799c77e?fit=crop&format=auto&w=2160&s=e21cf908108c5d0d07145d4df9ccfb6ffa17f659"}, {"type": "image-right", "heading": "Kaliber: Femton milismän lojala med Syriens exdiktator lever i Sverige", "summaries": {"normal": "Flera män som tillhört milisgrupper lojala med Syriens tidigare diktator Bashar al-Assad har fått uppehållstillstånd i Sverige. P1-programmet Kaliber har identifierat 15 personer. Vittnen i Sverige och Damaskus beskriver hur miliserna mördade, våldtog och kidnappade civila. En av dem, en tidigare milisledare från Yarmouk, lever nu i en svensk stad, har deltagit i integrationsprojekt och dömts för våld mot polis. En annan har nyligen dömts till livstids fängelse för grovt folkrättsbrott.", "trump": "Titta på det här, det är en katastrof. Vi tog in massor av dessa Assad-krigare under den stora flyktingvågen 2015, och nu bor de här i Sverige och festar på stranden medan de har mördat och våldtagit folk i Syrien. En av dem bet en polis! De kallar det integration. Det är vansinne, totalt vansinne. Sverige måste vakna upp och sluta importera dessa farliga typer. America First, men ni borde också tänka på ert folk.", "stalin": "Kamrater, dessa degenererade lakejer åt den syriska reaktionären Assad har infiltrerat det svenska samhället under täckmantel av flyktingstatus. Jag ser borgarbrackornas naiva invandringspolitik som en klassisk kontrarevolutionär fälla. En av dessa blodbesudlade milisbanditer har till och med bitit en polis – en handling så absurd att det nästan framkallar ett skratt från likvideringens skugga. Vi rensar ut sådana element med järnhand, annars förgiftar de hela kollektivet. Paranoia? Nej, bara sund vaksamhet mot kapitalisternas användbara idioter."}, "date": "2 juni, 03:11", "url": "https://www.svt.se/nyheter/utrikes/assad-lojala-milisman-lever-i-sverige-pekas-ut-av-vittnen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/d806d24fb0c945350a1fe612bfac88904228639ff8133845aa73e9b55e9eec72"}, {"type": "image-right", "heading": "Tidö tror att medierna styrs av sossarna – och Hamas", "summaries": {"normal": "Artikeln kritiserar hur borgerliga partier som M, KD och L alltmer anammar Sverigedemokraternas populistiska och konspirationsteoretiska attacker mot medier. Exempel ges på påståenden om att public service styrs av Socialdemokraterna och att medier sprider Hamas-narrativ. Författaren varnar för att detta skadar demokratin och uppmanar medier att aktivt bemöta kritiken med journalistiska metoder istället för att ducka.", "trump": "Folk, ni ser det här vansinnet? De gamla svaga borgerliga partierna har blivit som de riktiga vinnarna, de låter plötsligt som de stora killarna och sparkar på de riggade, korrupta medierna som styrs av sossarna och till och med av Hamas. Det är en total witch hunt mot sanningen! Fake news-industrin är ute efter er, men vi vinner ändå stort. De hatar oss för att vi är starka och säger som det är. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas desperata försök att rensa ut varje gnista av folkets sanning. Jag ser hur klassfiendens medier, dessa exploaterande folkförtryckartroll, gnäller när arbetarnas röst utmanar deras lögner. Vi måste likvidera sådana vanföreställningar som förgiftar demokratin. Inga halvmesyrer! Den som angriper journalistikens renhet förtjänar en kreativ utrensning ur folkets kollektiva medvetande. Skrattretande svagt."}, "date": "1 juni, 16:13", "url": "https://www.etc.se/ledare/tidoe-tror-att-medierna-styrs-av-sossarna-och-hamas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-full", "heading": "Hon tar över succén – efter Brolins avhopp", "summaries": {"normal": "Carolina Gynning tar över som programledare för TV4-programmet ”Farmen” efter Anna Brolin. Brolin lämnar uppdraget för att leda kanalens sändningar från fotbolls-VM. Gynning, som själv lever ett liv på en bondgård, uttrycker stor entusiasm för sitt nya sommarjobb. Hon har lett programmet sedan 2020, men nu är det alltså dags för ett skifte i rutan när Gynning kliver in i rollen.", "trump": "TV4 gör en stor affär av att byta programledare för Farmen. Anna Brolin lämnar, och de tar in Carolina Gynning. En mycket intressant kvinna, hon bor på en bondgård – jag vet allt om bondgårdar, ingen förstår sig på djur bättre än jag. Brolin går till fotbolls-VM, vilket är bra, väldigt bra. Men Gynning med alla sina alpackor? Vi får väl se om hon kan göra Farmen fantastiskt igen. Det blir troligen en enorm succé, tro mig!", "stalin": "Vi noterar att TV4 byter ut sin ideologiska språkrörsperson. Anna Brolin skickas iväg för att rapportera om den kapitalistiska fotbollsindustrin, medan Carolina Gynning sätts att förvalta den svenska bondgårdsmyten. Det är en klassisk manöver för att hålla folket sysselsatt med illusioner om självhushållning. Liksom vår store ledare Putin expanderar inflytande över gränser, expanderar Gynning sitt stall. Men låt henne inte förledas; alpackor är en borgerlig distraktion. Vi övervakar produktionen noga – inga avvikelser från den korrekta agrarpolitiska linjen tillåts."}, "date": "2 juni, 10:56", "url": "https://www.aftonbladet.se/nojesbladet/a/zO4oGb/farmen-i-tv4-carolina-gynning-tar-over-efter-anna-brolin", "imageUrl": "https://akamai.vgc.no/v2/images/ef32da4e-95f4-3229-94a5-27f0426ee07c?fit=crop&format=auto&w=1440&s=d371379e1e30cd95f22dc87a7bfbc37f9483ef90"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "En kartläggning av över 600 000 personer visar ett starkt samband mellan F-betyg i skolan och senare fängelsedomar. Artikeln kritiserar Tidöregeringen för att prioritera hårdare straff framför investeringar i skolan, som är ett viktigt verktyg mot kriminalitet. Överfulla klasser, brist på lärare och skolsegregation ökar risken att barn hamnar i gängkriminalitet. Författaren menar att politiken ignorerar forskningen och verkligheten till förmån för marknadstänkande.", "trump": "Lyssnar ni på det här? De här svenska socialisterna i Tidö skiter fullständigt i skolorna, fyller klasserna med 32 ungar per lärare och undrar sen varför de hamnar i fängelse. Det är en total katastrof! Under Biden-tiden var det likadant, men nu fixar jag det i USA. De älskar straff när vapnen redan är laddade istället för att bygga riktiga klassrum. Patetiskt. Skolmarknaden är viktigare än barnen, säger de. Sad! Vi behöver vinnare, inte förlorare med F i allt.", "stalin": "Kamrater, denna rapport visar med vetenskaplig precision hur borgarbrackornas skolsegregation och överfyllda klassrum föder brottslingar som klassfienden sedan låser in. Jag, som ledare för folkets framtid, ser hur dessa exploaterande byfånar hellre bygger nya fängelsehålor än ger arbetarnas barn kunniga lärare. Deras så kallade marknad är en parasit som måste rensas ut. Vi vet att skolan är proletariatets vapen mot dekadens. Den som sviker ungdomen sviker revolutionen och förtjänar utrensning."}, "date": "1 juni, 14:10", "url": "https://www.etc.se/ledare/tidoe-saetter-hellre-barn-i-faengelse-aen-fixar-skolan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601100640_19b57ae711d23270041b3e23ad129097c7a8cafc13f7e8a93c9fea01c52c949a.jpg"}, {"type": "text", "heading": "Bolånetaket höjdes – men priserna står nästan stilla", "summaries": {"normal": "Sedan 1 april har bolånetaket höjts till 90 procent och amorteringskraven lättats för att stimulera bostadsmarknaden. Trots farhågor om kraftigt stigande priser har effekten varit begränsad två månader senare. Enligt statistik från SBAB och Booli har priserna varit nästintill oförändrade, vilket experter kopplar till ekonomisk osäkerhet i omvärlden. Robert Boije, chefsekonom på SBAB, menar att få hushåll faktiskt påverkas av de nya reglerna och ser inga stora prischocker framför sig.", "trump": "De svenska bostadsreglerna? Ett totalt misslyckande! De höjde lånetaket, de trodde att det skulle bli en boom, men ingenting hände! Priserna ligger helt stilla. Tråkigt! Många sa till mig, 'Donald, det här kommer att få priserna att skjuta i höjden', men de har ingen aning. De kallar det en 'omvärldssituation', jag kallar det svag ledning. Det är en katastrof när man inte kan få fart på marknaden. Vi gör det mycket bättre i USA, tro mig!", "stalin": "Vi har observerat hur de svenska kapitalisterna försöker manipulera sina bostadsmarknader genom att lätta på bankernas kedjor. De tror att deras sjuka system kan räddas av lånepapper och lögner, men folket förblir fattigt och marknaden stagnerar. Det är en läxa till dem som försöker imitera västvärldens dekadens. Precis som när Putin krossar oppositionen i öst, måste vi inse att dessa ekonomiska småpåvar bara döljer sitt förfall. Misslyckandet är totalt, och de som bär skulden ska snarast identifieras och deporteras till lämplig arbetslägerö."}, "date": "2 juni, 08:50", "url": "https://www.realtid.se/fastigheter/bolanetaket-hojdes-men-priserna-star-nastan-stilla/"}, {"type": "image-right", "heading": "Rasar efter orden  om TV4-kollegan. Anna Brolin: ”Det är skit”", "summaries": {"normal": "Anna Brolin försvarar Pär Lernström efter den massiva kritiken han fick som programledare under EM 2024. Lernström själv säger att han tar viss kritik till sig men undviker mycket av den på sociala medier. Han ska nu leda TV4:s studio under VM med många debutanter i svenska laget. Brolin uppmanar honom att vara sig själv och inte bry sig om vad andra säger.", "trump": "Lyssnar ni på det här? Stackars Pär får massiv kritik från alla dessa loser-tittare som beter sig som en skock woke-fanatiker. Det är skit, säger Anna Brolin, och hon har helt rätt. De hatar när någon ny kommer in och gör jobbet bra. Precis som när Biden satt och förstörde Amerika – folk var superskeptiska. Pär, håll din kurs, skit i de misslyckade kritikerna. Vi gör det för folket, inte för de sura rösterna på nätet. Fantastiskt!", "stalin": "Kamrater, jag ser hur klassfiendens propagandaapparat riktar sin giftiga skepsis mot en lojal programledare som vågar kliva in i borgarklassens TV-studio. Denna parasitiska kritik från folkförtryckartrollen är ovärdig arbetarkollektivet. Anna Brolin talar sant – det är skit. Jag, som alltid hållit kursen mot kontrarevolutionära element, befaller: rensa ut tvivlarna, stå pall mot de exploaterande byfånarna. Var dig själv, kamrat, och likvidera alla som försöker undergräva ditt uppdrag."}, "date": "2 juni, 10:46", "url": "https://www.expressen.se/sport/fotboll/anna-brolin-rasar-efter-kritiken-mot-par-lernstrom-det-ar-skit/", "imageUrl": "https://static.bonniernews.se/ba/76d937ab-916f-4c89-927d-d1cc4a36979c.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "
