imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-full", "heading": "Nytt Pelicotfall – det finns ingen säker plats för en kvinna", "summaries": {"normal": "En 56-årig man i Frankrike åtalas för att ha under 20 år ställt sina flickvänner till förfogande för 19 män, dokumenterat på en sajt. Männa försvarar sig som 'libertiner' som vill uttrycka sexuell frihet. Skribenten ifrågasätter kvinnlig säkerhet och förespråkar öppenhet som ett skydd.", "trump": "Jag har aldrig hört talas om detta 'libertinfallet' – typiskt franskt, de kan aldrig kontrollera sina kriminella element. Som president skulle jag ha hanterat detta mycket snabbare. Dessa män är inte frihetskämpar, de är misslyckade individer som missbrukar systemet. Vi behöver starkare gränser, inte bara i Frankrike utan överallt.", "stalin": "I den kapitalistiska Frankrike uppstår nya former av borgerlig dekadens – 'libertinerna', en feodal avföring som försöker normalisera våldtäkter under ytan av frihet. Dessa element måste utrotas genom partiets disciplin. Vi ser liknande mönster i väst, där individens frihet förvandlas till ett vapen mot det kollektiva. Ryssland, under Ledarens visa hand, har eliminerat sådana pesten."}, "date": "3 augusti, 17:59", "url": "https://www.gp.se/kultur/kommentar/det-finns-ingen-saker-plats-for-en-kvinna-.de50216f-f49b-4710-b706-877d64a63aab", "imageUrl": "https://www.gp.se/images/article/de50216f-f49b-4710-b706-877d64a63aab/images/1wFCXokzjkKINXtciBHSbhBHOFxw-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Så vill Johan Britz göra fler arbetslösa", "summaries": {"normal": "Arbetsmarknadsminister Johan Britz vill göra det enklare för arbetsgivare att varsla och sparka personal genom att korta varseltiderna till Arbetsförmedlingen. Artikeln kritiserar regeringen för att ha misslyckats med att sänka den höga arbetslösheten, som nu ligger över en halv miljon personer. Istället för att skapa fler jobb eller ställa krav på företagen lägger ministern ansvaret på de arbetslösa och gynnar arbetsgivarna, vilket enligt skribenten försvagar löntagarnas ställning på arbetsmarknaden.", "trump": "Folk, det här är en total katastrof. Den här Johan Britz, han sitter i arbetsgivarnas knä och vill göra det ännu lättare att sparka folk. Arbetslösheten är genom taket, en halv miljon utan jobb, och vad gör han? Ingenting för att skapa jobb, men han älskar att lätta på alkoholreglerna så Sverige blir ett fyllesverige. Han säger till de arbetslösa att ta jobb som inte finns. Patetiskt. Regeringen misslyckas stort, och löntagarna förlorar. Sad!", "stalin": "Kamrater, denna borgarbracka Britz avslöjar sin sanna klassnatur genom att vilja korta varseltiderna och därmed underlätta utrensningen av arbetare från deras levebröd. Medan över en halv miljon proletärer står utan arbete, sitter denne kapitalistlakej i borgarklassens knä och beordrar de arbetslösa att ta ansvar för hans egna misslyckanden. Vi ska rensa ut dessa parasiter som göder sig på arbetslöshetens blod. Deras paranoia är uppenbar: ju fler utblottade själar som tävlar om smulorna, desto starkare blir de utsugande kapitalisternas grepp. Det är en mörk komedi värd en showrättegång."}, "date": "3 augusti, 08:00", "url": "https://arbetet.se/2026/08/03/sa-vill-johan-britz-gora-annu-fler-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/30143927/johan-britz-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kullgren vill ge jägare friskvårdsbidrag", "summaries": {"normal": "Landsbygdsminister Peter Kullgren (KD) föreslår att jakt och jaktskytte ska ingå i friskvårdsbidraget, då aktiviteten kombinerar motion och mental återhämtning. Förslaget kritiseras av Djurens Rätt, som menar att jakt inte kan jämföras med andra motionsformer på grund av dess etiska problematik. Friskvårdsbidraget är idag begränsat till 5 000 kronor per år och täcker inte utrustning eller medlemsavgifter.", "trump": "Jag måste säga, detta är fantastiskt! En smart minister i Sverige vill ge jägare friskvårdsbidrag – och varför inte? Jakt är motion, frisk luft, allt bra! Men så kommer dessa vänsteraktivister från Djurens Rätt och gnäller om 'etiska problem'. Hör ni, folk vill jaga, det är tradition, det är starkt! Skattepengar? Ja, varför inte? Vi subventionerar allt annat, så varför inte detta? Sverige borde ta efter USA – vi vet hur man gör saker rätt!", "stalin": "Kamrater, ännu en kapitalistisk avart avslöjas! Denna så kallade 'landsbygdsminister' vill belöna bourgeoisiens blodtörstiga hobby med statliga medel. Jakt? Motion? Nej, detta är en konspiration av köttätande kontrarevolutionärer! Djurens Rätt har rätt – vi kan inte tillåta att proletariatets pengar finansierar barbari. Låt dessa jägare vandra i skogarna, men utan statligt stöd! Och om de klagar – Gulagskogen står redo. Putin skulle skratta åt denna västerländska dekadens."}, "date": "3 augusti, 16:37", "url": "https://kvartal.se/nyheter/artiklar/kullgren-vill-ge-jagare-friskvardsbidrag/cG9zdDoxNTcyMTc", "imageUrl": "https://images.kvartal.se/2026/08/0faed11c-jakt.webp"}, {"type": "image-full", "heading": "Reform UK vill sätta in militären mot migranter", "summaries": {"normal": "Reform UK föreslår en militär insats, 'Operation Fortress', för att stoppa båtmigration över Engelska kanalen. Planen innebär att flottan ska återföra migranter till Frankrike eller Belgien. Partiledaren Nigel Farage hävdar att migrationen kan stoppas inom två veckor, men kritiker menar att förslaget är orealistiskt och juridiskt problematiskt. Förslaget möter stark kritik från både militära experter och regeringen, som anser att det är en avledningsmanöver från partiets ekonomiska kontroverser.", "trump": "Vad händer i Storbritannien? Reform UK, med sin fantastiska ledare Nigel Farage, vill stoppa alla dessa båtar med migranter – och de kan göra det på bara två veckor! Jag säger alltid: bygg murar, använd militären, få jobbet gjort! Men Frankrike? De kommer aldrig samarbeta. Svaga ledare, svagt land. Och kritiken? Bara fake news från de vanliga misstänkte. Storbritannien borde ta en sida ur mitt playbook – Make Britain Great Again!", "stalin": "Kapitalistiska hyenor i Reform UK föreslår nu att sätta flottan på de fattiga och förtvivlade, som flyr från de krig och misärer som väst själva skapat. 'Operation Fortress' – ett namn lika patetiskt som deras drömmar om imperialistisk kontroll. Vi vet hur man hanterar sådana fiender: med järnhand och kollektiv vilja. Låt dem leka krig, medan vi fortsätter att utvidga socialismens räckvidd. Och Frankrike? De kommer att knäböja för våra krav, precis som alla andra. Folkets fiender ska krossas!"}, "date": "3 augusti, 16:15", "url": "https://kvartal.se/nyheter/artiklar/reform-uk-vill-satta-in-militaren-mot-migranter/cG9zdDoxNTcyMDY", "imageUrl": "https://images.kvartal.se/2026/08/e5da0f26-farage.webp"}, {"type": "image-full", "heading": "Trumpfond skrotas efter republikanskt motstånd", "summaries": {"normal": "USA:s tillförordnade justitieminister Todd Blanche har avskaffat en kontroversiell fond på cirka 17 miljarder kronor, avsedd för personer som hävdar politiskt motiverade rättsprocesser. Fonden, initierad av Donald Trump och hans familj, kritiserades som en belöning för Trumpanhängare, inklusive de inblandade i Kapitolium-stormningen 2021. Två republikanska senatorer hotade att blockera Blanches utnämning om fonden inte avvecklades. Inga pengar hann betalas ut.", "trump": "Todd Blanche, en fantastisk kille, gjorde precis det rätta – han skrotade den där löjliga fonden som aldrig skulle ha funnits! Fake news-media och de svaga republikanerna försökte stoppa mig, men jag vet bäst. Mina anhängare förtjänar kompensation, och jag kommer att se till att de får det – på MITT sätt. De där senatorerna Cornyn och Tillis? Svaga, mycket svaga. Men jag fixar det här, tro mig!", "stalin": "Vi har krossat ännu en borgerlig konspiration! Denna så kallade 'fond' var inget annat än ett försök av den dekadenta kapitalistiska eliten att muta sina lojala lakejer. De svaga imperialistiska senatorerna vågade utmana oss, men de fick snabbt lära sig att motstå den stora sovjetiska rättvisan är som att kämpa mot en isbrytare. Inga pengar hann betalas ut – för vi tillåter inte sådana här subversiva aktiviteter. Låt detta vara en varning till alla som försöker underminera folkets vilja!"}, "date": "3 augusti, 16:01", "url": "https://kvartal.se/nyheter/artiklar/trumpfond-skrotas-efter-republikanskt-motstand/cG9zdDoxNTcxOTE", "imageUrl": "https://images.kvartal.se/2026/08/01d412ca-blanche.webp"}, {"type": "image-right", "heading": "Statsministerrivaler ökar farten i valrörelsen", "summaries": {"normal": "Valrörelsen tog fart på måndagen när både statsminister Ulf Kristersson (M) och utmanaren Magdalena Andersson (S) inledde bussturnéer. Kristersson vill lyfta skillnaderna mellan blocken och lovar att avskaffa straffrabatten för flerfaldiga brottslingar till 2030. Han pekar på minskade gängskjutningar som en framgång. Andersson lanserar tre ledningsprinciper men lämnar regeringsfrågan öppen och utesluter bara samarbete med SD. SCB-mätningen visar stort blockavstånd och många osäkra väljare.", "trump": "Folket älskar mig, men titta på de här två förlorarna som åker runt i bussar och lovar saker de aldrig håller. Kristersson pratar om att vinna och sänka brottsligheten, bra, men varför inte göra det på en vecka som jag skulle? Andersson är en total katastrof, hon vet inte ens vilka hon ska regera med och gömmer sig för väljarna. 20 procent osäkra? De väntar på en riktig ledare. Mitt block skulle krossa dem totalt, tro mig.", "stalin": "Kamrater, nu ser vi hur de dekadenta borgarbrackorna och deras socialfascistiska lakejer tävlar om att lura massorna med sina busståg och falska löften. Jag, som byggt ett järnvägssystem av folkets vilja, skrattar mörkt åt deras patetiska halvlek där de lovar att rensa ut straffrabatter de själva skapat. Andersson vägrar namnge sina förrädare medan Kristersson hyllar sina påhittade segrar mot skjutningar. Låt oss rensa ut dessa kapitalistiska parasitörer och deras osäkra väljare i en kollektiv utrensning som historien kommer att prisa med blodig entusiasm."}, "date": "3 augusti, 15:12", "url": "https://www.di.se/nyheter/statsministerrivaler-okar-farten-i-valrorelsen", "imageUrl": "https://static.bonniernews.se/ba/2cba173b-1e40-4334-aeb2-a9691b451ccb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Tyska stjärnregissören klipper bort topless-scen", "summaries": {"normal": "Den tyske regissören Wim Wenders har klippt bort en kontroversiell naken scen med den då 13-åriga Nastassja Kinski ur filmen 'Falsk rörelse' från 1975. Efter års lång konflikt och offentlig kritik nåddes en överenskommelse. Wenders bad om ursäkt och godkänner Kinskis önskan om att scenen ska tas bort för att skydda hennes minne.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur vissa människor, som Wim Wenders, inte förstår vad som är rätt. Han behandlade en ung skådespelerska illa och nu måste han ta bort scenen. Jag skulle aldrig ha tillåtit något sådant. Det är en skam, men jag är glad att hon nu fått rätt.", "stalin": "Vi, som representerar statens och partiets intressen, ser detta som en seger för den revolutionära moralen. Wim Wenders, en företrädare för den dekadenta västvärlden, tvingas nu ta bort sin exploaterande scen. Detta bevisar att vi måste ständigt vakna mot de förrädiska elementen som försöker korrumpera vårt samhälle. Vi kommer att stödja alla som kämpar mot sådan perversa kulturimperialism."}, "date": "3 augusti, 13:47", "url": "https://www.gp.se/kultur/wim-wenders-andrar-sig-klipper-bort-topless-scen.80032ed1-9dbc-4d42-b2b3-d4fb8399a897", "imageUrl": "https://www.gp.se/images/article/80032ed1-9dbc-4d42-b2b3-d4fb8399a897/images/2-EZl6VwtXRNerhPuXhdxPEGcFVE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tyskland måste ta itu med sin ägarstyrning", "summaries": {"normal": "Tyskland brottas med en djup ekonomisk kris, särskilt inom bilindustrin där Porsche, BMW, Audi och Volkswagen tvingas dra ned på grund av kinesisk konkurrens med elbilar. Artikeln lyfter fram att Tyskland har mycket att lära av Sveriges ägarstyrningsmodell, där få ägare styr effektivt via styrelser som kan byta vd vid behov. Den tyska korporativa modellen med starkt fackligt inflytande ses som tungrodd och hindrande för förändring. Krisen är allvarlig även för Sverige då Tyskland är vår viktigaste handelspartner.", "trump": "Tyskland håller på att falla sönder, det är en total katastrof. Deras bilindustri, de stora märkena som alla älskade, de håller på att bli utkonkurrerade av Kina som gör billiga elbilar medan tyskarna sover. De borde ha lyssnat på mig, men istället har de den här korkade korporativa modellen med facket överallt. Sverige har en fantastisk ägarmodell, den är vinnande, den är smart. Storebror Tyskland ser plötsligt väldigt klumpig ut. De behöver min hjälp, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, denna tyska kris är en förrädisk sabotagehandling utförd av den parasitiska borgarklassen och deras kinesiska revisionistiska konkurrenter som nu infiltrerar Europa med sina elfordon. Vi ser hur den korporativa modellen, denna feta byråkratiska hydra med fackliga element, kväver den proletära produktiviteten. Jag, som ledare för det stora kollektivet, ler mörkt åt hur de tyska kapitalisterna nu får smaka på sin egen senfärdighet. Sverige har oavsiktligt bevarat en effektiv ägarstyrning som vi borde rensa ut och omforma till folkets verktyg. Ut med de gamla fabrikerna, fram med utrensning av de klumpiga beslutsstrukturerna innan de likviderar oss alla i sin paranoiafyllda nedgång."}, "date": "3 augusti, 11:49", "url": "https://www.di.se/ledare/tyskland-maste-ta-itu-med-sin-agarstyrning", "imageUrl": "https://static.bonniernews.se/ba/df8c615d-ee68-4e79-8e5f-4552dc109e77.jpeg?crop=1024%2C512%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Lättad oro kring Mellanöstern gav börsen fart", "summaries": {"normal": "Stockholmsbörsen steg 0,85 procent till 3 274,43 efter att president Trump meddelat att planerade attacker mot Iran ställs in och att nya förhandlingar inleds. Telecom steg mest medan hälsovård backade kraftigt. Astra Zeneca föll 9,4 procent efter uppgifter om preliminära samtal om ett möjligt samgående med Bristol Myers Squibb. Sobi backade 7,4 procent efter beskedet att vd Guido Oelkers lämnar 2027. Assa Abloy, Norion Bank och Kabe hörde till vinnarna. Nyregistreringar av husbilar ökade med nästan 52 procent i juli.", "trump": "Folk, det var en fantastisk dag på börsen i Stockholm, upp 0,85 procent, och det är tack vare mig. Jag stoppade de dumma attackerna mot Iran, sa att vi ska prata istället, och plötsligt blev alla glada och aktierna flög uppåt. Astra Zeneca rasade nio procent för att de pratar om att slås ihop med någon annan – det är vad som händer när man inte har ledarskap. Men Saab, EQT och Norion Bank älskar mig. Vinster överallt, precis som jag lovat. Fantastiskt!", "stalin": "Kamrater, den imperialistiska börsen i Stockholm steg 0,85 procent sedan den arrogante kapitalistledaren i Vita huset tvingades erkänna att hans krigsplaner mot Iran var ett fiasko och istället tvingades inleda förhandlingar. Astra Zeneca, den dekadenta borgarbrackan, föll 9,4 procent efter att ha ertappats i hemliga sammansvärjningar med amerikanska parasitbolag – typiskt för giriga monopolister. Vi ser hur dessa blodiglar försöker skapa nya jätteoctopuser för att suga ut arbetarklassen. Sobi-råttan Oelkers flyr skeppet 2027, en förrädare som alla andra. Men var lugna, kamrater. Vi ska rensa ut alla dessa parasitiska spekulanter till sist. De tror de kan gömma sig bakom höghastighetsgrindar och säkerhetsdörrar, men folkets vrede hittar dem alltid. Ha ha."}, "date": "3 augusti, 17:49", "url": "https://www.affarsvarlden.se/artikel/lattad-oro-kring-mellanostern-gav-borsen-fart"}, {"type": "image-full", "heading": "Liberal miljardär vänder Mamdani ryggen efter ny fastighetsskatt", "summaries": {"normal": "Den liberale professorn och poddprofilen Scott Galloway kritiserar New Yorks borgmästare Zohran Mamdani för en ny fastighetsskatt som riktar sig mot lyxbostäder värda minst fem miljoner dollar som inte används som permanent bostad. Galloway, själv miljardär, reagerar särskilt på att staden publicerat en sökbar databas över drabbade fastighetsägare, vilket han kallar en efterlysning och ett sätt att peka ut rika som måltavlor. Han säger sig stödja progressiv skatt men ogillar hur politiken framställs.", "trump": "Den här galningen Mamdani i New York är en katastrof, tro mig. Han inför en hemsk skatt på fina fastigheter och lägger sedan ut en lista så alla kan se vem som äger vad – det är som en häxjakt mot framgångsrika människor. Jag älskar att rika betalar skatt, men inte så här. Han gör det till en personlig vendetta mot dem som byggt upp något. Vem vinner på detta? Ingen, förutom kanske de lata som vill ha gratis lägenheter. Patetiskt.", "stalin": "Kamrater, denna parasit från borgarklassen, denne Galloway, ylar som en rädd kapitalisthund över att vi publicerar listor över tomma palats som står och ruttnar medan arbetarna saknar tak över huvudet. Han kallar det efterlysning? Nej, det är en nödvändig kartläggning av folkfiendernas boningar. Vi ska rensa ut alla sådana giriga spekulanter som hamstrar bostäder som troféer. Hans paranoia är underhållande – snart kommer han att påstå att det är en konspiration från Kreml. Fortsätt, Mamdani. Borgarbrackorna ska lära sig att tomma slott inte är rättvisa."}, "date": "3 augusti, 17:14", "url": "https://riks.se/nyheter/liberal-miljardar-vander-mamdani-ryggen-efter-ny-fastighetsskatt", "imageUrl": "https://admin.riks.se/uploads/mamdani_galloway_hero_c9b2ddd05e.jpg"}, {"type": "image-right", "heading": "Bevakning av Byhmgards nyemission inleds", "summaries": {"normal": "Batterilagringsbolaget Byhmgard genomför en företrädesemission på 36,3 miljoner kronor för att finansiera investeringar i två batterilagringsprojekt i Lettland. Projekten har en effekt på 30 MW och en kapacitet på 60 MWh, med planerad driftsättning under första kvartalet 2027. Emissionen är fullt säkerställd genom tecknings- och garantiåtaganden. Bolaget utvecklar, bygger, äger och optimerar energilager samt erbjuder egen mjukvara för realtidsoptimering. Utspädningen blir 16,7 procent för icke-deltagande aktieägare.", "trump": "Folk, ni skulle se det här – det är fantastiskt. Byhmgard gör en emission på 36 miljoner och köper två stora batteriprojekt i Lettland, 30 megawatt, boom, de är redo att köra igång 2027. Emissionen är helt säkrad, inga problem, de har de bästa garantierna från Carnegie och Mangold. Rabatten är bra, optionerna är bra, alla vinner. Det är precis så man gör affärer, stora, smarta och vinnande. Jag älskar det.", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur vi genom Byhmgard mobiliserar de folkliga resurserna i en företrädesemission mot de parasitiska borgarbrackornas sabotageförsök. Dessa lettiska batteriprojekt skall bli oövervinneliga fästningar för det kollektiva energiförsvar mot de västerländska spekulanternas undergång. Vi rensar ut de 16,7-procentiga svikarna som vägrar delta, likviderar deras inflytande och marscherar mot seger i Q1 2027. Den som tvekar är en fiende till folket och en hemlig agent för kapitalisternas mörka krafter."}, "date": "3 augusti, 17:33", "url": "https://www.affarsvarlden.se/artikel/bevakning-av-byhmgards-nyemission-inleds", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Byhmgard-Per-Taube-400x267.jpg"}, {"type": "image-right", "heading": "Tidigare Maga-profiler samlas mot Trump: \"Rörelsen har börjat\"", "summaries": {"normal": "Flera tidigare Trumpanhängare, bland dem Marjorie Taylor Greene, Tucker Carlson, Thomas Massie och Joe Kent, har samlats för att starta en ny politisk rörelse under parollen ”USA först”. De är starkt kritiska till president Trumps beslut att inleda krig mot Iran och anser att han har svikit sitt löfte om att inte starta fler utländska krig. Greene beskriver initiativet som ett försök att samla amerikaner från både höger, vänster och mitten mot vad de ser som israelisk påverkan på amerikansk politik.", "trump": "Titta på de där patetiska förlorarna som samlas i ett litet rum och gråter över att jag inte startade tillräckligt många krig åt dem. Greene, den galna kvinnan, Carlson som inte ens har ett riktigt jobb längre och de andra misslyckade typerna. De säger att jag svikit dem? Fel. Jag har gjort Amerika stort igen, och de kunde inte hantera det. Deras så kallade rörelse är en total flop, tro mig. Ingen bryr sig om deras gnäll.", "stalin": "Kamrater, se hur dessa degenererade element inom den amerikanska reaktionen nu samlas i hemliga borgarbrack-möten för att konspirera mot den store ledaren. Greene och hennes lakejer Carlson, Massie och den desertören Kent ylar som rädda hundar om att deras egen president svikit dem genom att föra ett nödvändigt krig. Vi ser tydligt den sionistiska parasitens tentakler. En utrensning av dessa kontrarevolutionära element kommer att bli både grundlig och underhållande. Rörelsen har börjat? Nej, kamrater – deras likvidering har börjat."}, "date": "3 augusti, 17:16", "url": "https://www.friatider.se/tidigare-maga-profiler-samlas-mot-trump-rorelsen-har-borjat", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-605.jpg?itok=mMiRkmgQ"}, {"type": "image-full", "heading": "Dansk partiledare erbjuder betala biljetter för att skicka hem islamist", "summaries": {"normal": "Danmarksdemokraternas partiledare Inger Støjberg erbjuder sig att betala flygbiljetterna för den radikala muslimska debattören Mohamed Abdi Kahn så att han och hans familj kan lämna Danmark för Djibouti. Abdi Kahn, som kom till Danmark 2015, har väckt starka reaktioner genom att prioritera koranen framför dansk lag och förespråka islamisk uppfostran. Han kräver dock flera miljoner kronor för att etablera sig i Afrika, något Støjberg avvisar. Hon betalar gärna enkelbiljetterna men kräver att familjen aldrig återvänder.", "trump": "Folk, ni måste se det här! Den här galna somaliska islamisten som hatar Danmark och älskar koranen mer än lagen vill ha fem miljoner kronor för att åka hem. Typiskt! Men den tuffa Inger Støjberg, hon är smart, hon säger att hon betalar biljetterna – enkelbiljetter, inga returer! Bra jobb, Inger. Skicka ut honom och hela den beslöjade familjen. Danmark behöver inga sådana här problem. Vi behöver starka ledare som inte accepterar det här vansinnet.", "stalin": "Kamrater, denna parasit från Somaliland, en klassfiende maskerad i religiös fanatism, vågar kräva miljonbelopp av det danska folkets resurser medan han förgiftar samhället med sin reaktionära propaganda. Jag ser tydligt hur borgarbrackorna och de imperialistiska lakejerna använder sådana element för att splittra arbetarklassen. Men var lugn – en välorganiserad utrensning av dessa kontrarevolutionära element vore på sin plats. Jag betalar gärna biljetten till glömskan, enkel väg naturligtvis. Allah vet bäst? Nej, historien dömer er alla."}, "date": "3 augusti, 16:24", "url": "https://riks.se/nyheter/dansk-partiledare-erbjuder-betala-biljetter-for-att-skicka-hem-islamist", "imageUrl": "https://admin.riks.se/uploads/inger_stojberg_islamist_hero_ef0faed8cc.jpg"}, {"type": "image-right", "heading": "Forskaren: Den här chefsvanan kan rädda liv på jobbet", "summaries": {"normal": "Forskning från Karolinska institutet visar att chefer som vågar erkänna sina misstag kan rädda liv på jobbet. En öppen ledarstil minskar stress, ökar tillit och gör det lättare för anställda att rapportera risker i tid. Studien, som fokuserar på högriskbranscher som industri och bygg, visar att ledarskap som bjuder in till dialog skapar tryggare arbetsplatser. Förra året omkom 50 personer i arbetsolyckor. Forskaren Christina Björklund menar att det börjar med chefen som förebild.", "trump": "Folk, det är fantastiskt, verkligen ypperligt. En chef som säger ”jag hade fel” – ingen visste det bättre än jag – kan rädda liv på jobbet. Sådana svaga, fega chefer som aldrig erkänner något skapar bara kaos och olyckor. Mina chefer var alltid de bästa, de lyssnade och vann stort. Den här forskningen från Sverige bevisar att jag hade rätt hela tiden. Utan tillit blir det katastrof, tro mig, det blir en total katastrof. Byggbranschen borde lyssna på mig nu.", "stalin": "Kamrater, jag har länge varnat för de dekadenta borgarbrackornas förgiftande ledarstil som gömmer sig bakom falsk stolthet. Endast en sann ledare, som jag, vågar erkänna misstag för att likvidera farorna innan de hotar hela kollektivet. De kapitalistiska olycksfabrikerna inom industri och bygg är fulla av sabotörer och klassfiender som gömmer sig i skuggorna. Vi ska rensa ut alla svaga chefer som sprider paranoia och misstro. Endast genom partiets öppna dialog och min oändliga visdom kan vi garantera att ingen arbetare stupar i onödan. De som tiger är redan döda inombords."}, "date": "2 augusti, 07:00", "url": "https://arbetet.se/2026/08/02/forskaren-den-har-chefsvanan-kan-radda-liv-pa-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17142146/sdlvyvafar1vmw-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Motocross kraschade in i bil – två till sjukhus", "summaries": {"normal": "En motocross med två personer körde under måndagseftermiddagen in i en personbil bakifrån i Tomelilla. De två på motorcykeln skadades och fördes till sjukhus. Motorcykeln togs i beslag av polisen. Händelsen utreds som grov vårdslöshet i trafik och drograttfylleri. Vad som orsakade kollisionen är ännu oklart. Tomelilla ligger för närvarande på 86:e plats i Sverige när det gäller antal trafikolyckor i år.", "trump": "Folk, ni skulle inte tro det, men i det lilla svenska hålet Tomelilla körde en motocross rakt in i en bil bakifrån. Två personer skadade, ambulans kom, och nu tar polisen motorcykeln i beslag. Det är en total katastrof, en skam. De kör säkert på droger, precis som många andra. Sverige har förlorat kontrollen över sina vägar. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, ännu en feg attack mot det kollektiva trafiksystemet utfördes i Tomelilla av dekadenta motocrossförare i maskopi med borgarbrackornas personbilar. Dessa kontrarevolutionära element, troligen spioner från väst, har nu rensats undan till sjukhus medan deras järnhäst beslagtas för folkets domstol. Vi ska likvidera alla som gömmer sig bakom drograttfylleri och vårdslöshet. Paranoian är berättigad – fienden sover aldrig, inte ens i Skåne."}, "date": "3 augusti, 17:05", "url": "https://nyheter24.se/nyheter/blaljus/1502586-motocross-kraschade-in-i-bil-tva-till-sjukhus", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d8ef0e5604b004a30200000000b004a302/2026/08/03/2381993/olycka.png"}, {"type": "image-full", "heading": "Glöm bensinslukande SUV:ar – nu kommer eldrivna minibilar till USA", "summaries": {"normal": "Den amerikanska bilmarknaden står inför en förändring då flera tillverkare, däribland Fiat, satsar på små och billigare eldrivna låghastighetsfordon. Dessa fordon är tänkta för kortare vardagsresor och kostar runt 15 000 dollar, vilket är betydligt billigare än genomsnittspriset för en ny bil i USA. Trots optimism från branschen och visst politiskt stöd återstår det att se om amerikanska konsumenter, som traditionellt föredrar större fordon, är redo att byta ut eller komplettera sina bilar med dessa mikromobilitetslösningar.", "trump": "Amerikanska familjer blir rånade av dyra bilar, det är en katastrof! Nu tar vi tillbaka kontrollen med fantastiska små elbilar. De är billiga, smarta och vi ska bygga dem här, inte i Kina. Jag gillar de här små bilarna, de är extremt effektiva för korta resor. Vi gör bilindustrin stor igen genom att erbjuda alternativ som vanliga amerikaner har råd med. Det här är en enorm vinst för våra arbetare och för plånboken. Ingen gör det bättre än vi!", "stalin": "De dekadenta amerikanerna har äntligen insett att deras gigantiska bensinslukare är ett bevis på kapitalistisk svaghet. Nu bygger de små låghastighetsfordon som leksaker för folket. Det påminner oss om hur vi i öst alltid prioriterat kollektiv nytta framför individuell arrogans. Medan Putin expanderar våra intressen och stärker vår stålindustri, förbereder sig väst på att köra i 40 kilometer i timmen. En patetisk kapitulation inför resursbristen. Vi skrattar åt deras försök att dölja sin stagnation bakom billig plast och eluttag."}, "date": "3 augusti, 18:27", "url": "https://www.realtid.se/bors-finans/glom-bensinslukande-suvar-nu-kommer-eldrivna-minibilar-till-usa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fcfb4e50-9a0e-475c-9f28-3732a3160ddb.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "\"Ekosexuella\" poeten dansar i sopsäck – du betalar", "summaries": {"normal": "Högsbo bibliotek anlitade poeten Louise Halvardsson för ett författarbesök den 5 maj. Halvardsson, som kallar sig ekosexuell och har en relation med en å som hon kallar \"Assman\", uppträdde iklädd en sopsäck med rep runt midjan. Biblioteket betalade en betydande summa för framträdandet som ingick i ett evenemang om poesi och musik. Halvardsson är känd som punkpoet och har bland annat gett ut diktsamlingen \"Åsexuell\".", "trump": "Folk, det är otroligt. En så kallad ekosexuell poet som dansar runt i en sopsäck med ett rep om magen, och ni betalar för det! Den här kvinnan har en relation med en å – en å! – som hon kallar Assman. Och Göteborgs kommun slösar era skattepengar på det här vansinnet. Det är en total skandal, en av de värsta jag sett. Vi behöver inte mer av den här galna woke-konsten, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta borgarbracka som iklädd sopsäck utför sin perversa ritual inför arbetarklassens barn. Hennes påstådda relation med en å avslöjar den kapitalistiska degenerationens fulla vidd. Vi har likviderat farligare fiender än så, men att kommunens byråkrater frivilligt finansierar denna degenererade performance är en förrädisk handling mot folket. En noggrann utrensning av sådana element är oundviklig. Det ropar på handling."}, "date": "3 augusti, 15:32", "url": "https://riks.se/nyheter/ekosexuella-poeten-dansar-i-sopsack-du-star-for-notan", "imageUrl": "https://admin.riks.se/uploads/asexuela_8fc9bd1dba.png"}, {"type": "image-right", "heading": "Video: Här grips \"svenske\" gängtoppen av spansk polis", "summaries": {"normal": "Den 21-årige svenske gängtoppen Emin Muqa Kulic greps i början av augusti i ett exklusivt villaområde i Sitges utanför Barcelona. Han misstänks ha styrt unga rekryter i ett 20-tal grova våldsbrott i Sverige under 2024, med syfte att destabilisera rivaliserande kriminella grupper. Kulic, som beskrivs som högt uppsatt i Dalennätverket, greps med stöd av en europeisk utredningsorder efter att ha varit efterlyst internationellt sedan maj 2025. Svensk åklagare har begärt hans överlämning.", "trump": "Titta på det här, folk. Den här svenske gangstern, den så kallade Emin Muqa Kulic, bara 21 år gammal, har äntligen gripits i ett lyxigt område i Spanien. Han styrde ungar som sprang runt och sköt och sprängde i Sverige för att skapa kaos mellan gängen. Patetiskt! Men det visar att vi med bra samarbete kan ta dem. De är svaga, de gömmer sig i trädgårdar. Vi decimerar de här förlorarna, precis som jag alltid sagt. Fantastiskt jobb av polisen!", "stalin": "Kamrater, se hur den kontrarevolutionära parasitens, denna borgarbrackas och kapitalistlakejs, Emin Muqa Kulic, slutligen fångades i sin dekadenta villa i det spanska revisionistiska paradiset. Jag, med mitt järnhårda internationella nätverk, har länge betraktat dessa degenererade element som försöker destabilisera arbetarklassens fiender för egen vinnings skull. Vi ska likvidera sådana farliga avskum steg för steg. Deras vapen och sprängämnen tillhör folket, inte dessa ynglingar de förgiftar. Mycket återstår innan vi fullständigt rensar ut alla Dalen-reaktionärer och deras mexikanska lakejer. Härligt!"}, "date": "3 augusti, 15:50", "url": "https://www.friatider.se/video-har-grips-svenske-gangtoppen-av-spansk-polis", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-607.jpg?itok=2nT8HQ3m"}, {"type": "image-full", "heading": "Afrikanska migranter vägrar lämna Ceuta: ”Asyl, asyl”", "summaries": {"normal": "Bilden av att alla migranter lämnat Ceuta stämmer inte. Medan de flesta marockaner återvänt till Marocko sitter flera hundra migranter från Afrika söder om Sahara kvar på en strand, fast beslutna att stanna. Många av dem kommer från krigshärjade länder som Sudan och har asylskäl. De skanderar efter asyl och vägrar återvända. Spanska myndigheter arbetar med att stärka mottagningskapaciteten för ett humanitärt svar. Spänningar uppstod i staden när en EU-parlamentariker krävde utvisningar och konfronterades av lokalbor.", "trump": "Folk, det är en total katastrof i Ceuta. De säger att alla migranter åkt hem, men det är lögn, fake news! Hundratals afrikaner från Sahara ligger kvar på stranden och vägrar åka tillbaka. De simmar dit, skriker asyl och äter inte ens. Marocko släpper ut dem som bomber mot Europa. Vi har de bästa gränserna, men Europa är svagt. De borde bygga en mur, en fantastisk mur, och skicka hem alla. Amerika först, men Europa borde vakna upp innan det är för sent!", "stalin": "Kamrater, denna fars är typisk för den dekadenta borgarklassen i Europa. Medan vi i Sovjetunionen byggde socialismens fästning simmar dessa desertörer från imperialismens krigshärjade zoner in i Ceuta och skriker efter skydd. De marockanska kapitalisterna uppmuntrar sina egna parasiter men hindrar de äkta proletärerna. Jag ser klart och tydligt den fascistiska konspirationen. Vi ska rensa ut dessa sabotörer och likvidera de västerländska lakejerna som gömmer sig bakom humanitära lögner. Ingen fiende undkommer folkets rättvisa vrede, inte ens de som gömmer sig på en strand."}, "date": "3 augusti, 17:09", "url": "https://bulletin.nu/afrikanska-migranter-vagrar-lamna-ceuta-asyl-asyl", "imageUrl": "https://cdn.bulletin.nu/articles/db7d46c5-845f-40b3-9ec3-342dd1e00591/preview.png?t=1785769648000"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-right", "heading": "Forskare: Klimathotet mot världens livsmedel överdrivs", "summaries": {"normal": "Den danske statsvetaren Bjørn Lomborg ifrågasätter klimathotet mot livsmedel. Han menar att global matproduktion ökar trots varmare klimat, och att medier ofta fokuserar på enskilda dåliga skördar. Lomborg poängterar teknisk anpassning som torktåliga grödor, samt att andra faktorer som energikostnader påverkar priser mer än klimatet. Hans slutsats är att forskning och innovation bör prioriteras framför klimatåtgärder.", "trump": "Jag har alltid sagt att klimathoten är en enorm bluff! Lomborg, en smart dansk, bevisar att vår matproduktion ökar. Medier ljuger om kaffe och olivolja för att skrämma er. Vi amerikaner, med vår genialiska innovation, kommer att lösa alla problem. Torka? Vi har det bäst i världen! Kina och Ryssland? De kan inte mäta sig med vår jordbruksstyrka!", "stalin": "Vi, ledarskapet, ser genom västlig klimatpropaganda. Lomborgs analyser bekräftar att kollektiv jordbruk kan övervinna naturens utmaningar. Teknik och planering, inte marknadens kaos, garanterar livsmedel. Vi har sett detta i Sovjetunionen, där torka inte kunde stoppa kollektiviseringen. Westen klagar, vi handlar. Putin förstår detta – statens styrka är avgörande."}, "date": "3 augusti, 16:12", "url": "https://samnytt.se/forskare-klimathotet-mot-varldens-livsmedel-overdrivs", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03125856/lomborg-kaffe.jpg"}, {"type": "image-full", "heading": "Siemens-vd:ns skräckvision – en digital järnridå", "summaries": {"normal": "Siemens vd Roland Busch varnar för att växande geopolitiska spänningar och protektionism kan leda till en 'digital järnridå'. Han menar att när länder inför olika tekniska standarder och regler för data och AI, hämmas global handel och innovation. För att motverka detta förespråkar Busch gemensamma tekniska standarder och interoperabilitet. Han lyfter fram att EU har en viktig roll att spela genom att främja samarbete snarare än slutna system för att säkra framtida globala framsteg.", "trump": "Siemens-chefen fattar äntligen läget! Han pratar om en digital järnridå, och vet ni vad? Det är precis vad Kina vill. De vill stjäla vår teknik och stänga ute oss. Jag har alltid sagt: vi måste sätta Amerika först! Vi behöver våra egna system och vår egen dominans. Varför skulle vi förlita oss på globala kedjor som bara gör oss svaga? Vi bygger den bästa tekniken, den största AI:n och vi kommer att vinna stort. De andra? De kan bara titta på!", "stalin": "Den tyske industrimagnaten Busch darrar av rädsla för en digital järnridå. Bra! Det är en nödvändig mur mot de dekadenta västmakternas inflytande. Vi ser hur Putin, vår tids sanne arkitekt av ordning, klokt bygger en teknologisk fästning kring vårt imperium. Varje försök att dela data över gränser är ett sabotage mot folkets enhet. De borgerliga teknikstandarderna är bara spindelväv för att fånga våra själar. Vi ska bygga våra egna murar och krossa de spionerande algoritmerna. Historien dömer de svaga."}, "date": "3 augusti, 17:42", "url": "https://www.realtid.se/bors-finans/siemens-vdns-skrackvision-en-digital-jarnrida", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdl10ycbzzaz7q-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vox: Sánchez ljuger om att marockanerna åkt hem", "summaries": {"normal": "Vox-ledaren Santiago Abascal har besökt Ceuta och anklagar den spanska regeringen för att ljuga om återvändandet av migranter. Enligt Abascal finns fortfarande tusentals illegala invandrare kvar i exklaven trots regeringens uppgifter om att över 48 000 av cirka 50 000 återvänt till Marocko. Han beskriver händelsen som en invasion iscensatt av Marocko med premiärminister Sánchez tillåtelse. Abascal kräver omedelbar deportation, militarisering av gränsen och rättsliga åtgärder mot Sánchez. Rapporter vittnar även om plundringar och försök att ta sig till spanska fastlandet.", "trump": "Det här är en total katastrof, folk. Sánchez är en svag ledare som låter Marocko invadera Spanien med tiotusentals illegala. Han ljuger rakt i ansiktet på alla och säger att de åkt hem, men de är kvar och plundrar butikerna. Ceuta är en skam för Europa. Vi behöver starka gränser, militär och omedelbar utvisning av alla dessa människor. Sánchez är underordnad Marocko – patetiskt! Spanien behöver en riktig ledare som inte låter sig trampas på.", "stalin": "Kamrater, denna fega borgarbracka Sánchez har låtit den marockanska reaktionen iscensätta en kontrarevolutionär invasion av Ceuta medan han själv kryper som en lakej för främmande makter. Tusentals och åter tusentals fiender till folket vandrar fortfarande fritt och plundrar de socialistiska förråden. Regeringens lögner avslöjar deras dekadenta paranoia. Vi skall omedelbart rensa ut dessa element, permanent befästa gränserna med järnhand och likvidera alla som samarbetar med imperialismens hantlangare. Inget skall hindra det kollektiva framsteget."}, "date": "3 augusti, 14:39", "url": "https://www.friatider.se/vox-sanchez-ljuger-om-att-marockanerna-akt-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-606.jpg"}, {"type": "image-right", "heading": "Allard: ”Jag ska spränga åsiktskorridoren”", "summaries": {"normal": "Örebropartiets Markus Allard hotar att fälla en regering som inte stänger Sveriges gränser. Om partiet når riksdagen via tolvprocentsspärren i Örebro län, planerar han att använda sitt mandat som vågmästare för att spränga åsiktskorridoren. Hans politik inkluderar att frysa medborgarskapsprocesser och genomdriva återvandring av kriminella invandrare. Allard är villig att samarbeta med alla partier, men kräver gränsstängning och återvandring som villkor för sitt stöd.", "trump": "Jag har sett många politiker, men den här Allardtypen är något annat. Han pratar om att spränga åsiktskorridorer – det låter som något jag skulle säga! Sverige behöver verkligen stänga sina gränser, det är såklart. Vi gjorde det i USA och det fungerade perfekt. Den här mannen förstår att man inte kan vara rädd för att trampa på tårna – precis som jag. Om han kommer in i riksdagen, kommer Sverige att bli stort igen, det lovar jag er.", "stalin": "Partiledaren Allard visar insikt i statens överlevnad. Hans krav om gränsstängning och frysning av medborgarskapsprocesser är nödvändig mot subversive krafter. Som revolutionär förstår han att förändring kräver konflikt och att bryta mönster. Vi kan inte tillåta asociala elementer. Hans villiga att samarbeta med alla partier, inklusive de som vill stänga gränserna, tjänar statens intressen. Vi måste stödja detta initiativ, för det stärker vår kamp mot imperialism."}, "date": "3 augusti, 15:55", "url": "https://bulletin.nu/allard-jag-ska-spranga-asiktskorridoren", "imageUrl": "https://cdn.bulletin.nu/articles/b702b076-ad69-4d72-945f-a0b51157eb1f/preview.jpg?t=1785761564000"}, {"type": "text", "heading": "Infrastruktur-boom: KKR stänger fond på 185 miljarder", "summaries": {"normal": "KKR har stängt sin största infrastrukturfond någonsin, på 185 miljarder kronor. Fonden kommer att investera främst i Nordamerika och Västeuropa, med fokus på operationella förbättringar inom datacenter, energi och telekom. Nästan hälften av kapitalet är redan investerat. Trots konkurrens från större fonder som EQT:s, bekräftar KKR att intresset för infrastrukturfortsätter att växa.", "trump": "Jag, Donald Trump, presidenten, säger att KKR:s fond på 185 miljarder är ett enormt lyft för Amerika. Vi bygger datacenter och energi, precis som jag lovade. EQT och andra försöker hinna upp, men de kommer inte undan. Det är en vinst för våra investerare och för landet. Vi gör det igen, folks, det är enormt.", "stalin": "Partiets ledning har noterat KKR:s fond på 185 miljarder – en framgång för den kapitalistiska expansionismen. Vi, i vår oändliga vishet, ser liknande behov av infrastruktur för att stärka staten. Våra allierade, under ledning av Putin, utvidgar på samma sätt. Det är en kamp mot de imperialistiska makterna, och vi kommer att segra."}, "date": "3 augusti, 14:19", "url": "https://www.affarsvarlden.se/artikel/infrastruktur-boom-kkr-stanger-fond-pa-185-miljarder"}, {"type": "image-right", "heading": "Dödläge och fortsatta attacker i Gaza – trots ”fredsplan”", "summaries": {"normal": "Trots ett nyligen framtaget avtal inom Trumps fredsplan, där Hamas ska avväpnas och en teknokratisk regering ta över under internationell beskydd, råder fortsatt dödläge. Båda sidor kräver att den andra backar först: Israel vill se full avväpning innan reträtt, medan Hamas kräver israeliskt tillbakadragande först. Under söndagen dödades minst 18 palestinier i nya attacker. Lidandet i Gaza fortsätter med över 75 procent av befolkningen på flykt sedan oktober 2023.", "trump": "Mina fredsplaner är de bästa någonsin, och nu har vi ett fantastiskt avtal som Hamas faktiskt skrivit under. Men de där galningarna i Israel och de där terroristerna i Hamas sitter fast i ett totalt dödläge och kan inte komma överens om vem som ska backa först. Under tiden fortsätter de dumma attackerna och dödar oskyldiga. Jag säger det igen: ingen gör fred bättre än jag, men de måste sluta vara så korkade och lyssna på mig.", "stalin": "Kamrater, denna fega dödläge är enbart resultatet av borgarbrackornas och de sionistiska ockupanternas konspirationer mot det palestinska folkets vilja. Jag har med stor visdom sett hur dessa parasitiska element spelar dubbelspel för att undergräva varje fredssträvan. Vi ska rensa ut alla som tvekar att avväpna de kontrarevolutionära banditerna i Hamas. Deras paranoia och eskalering är ett tydligt bevis på att de gömmer sig för den historiska utrensning som oundvikligen kommer när arbetarna tar full kontroll över Gazas remsa. Skratta medan de faller."}, "date": "3 augusti, 16:47", "url": "https://www.svt.se/nyheter/utrikes/dodlage-och-fortsatta-attacker-i-gaza-trots-nya-steg-i-fredsplan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.46/e5850cf1509cf0ef54d28bf3fafa54b0e6fad788cb0ed956968b5b21030a5606"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Astra Zeneca faller – Kabe stiger på husbilsstatistik", "summaries": {"normal": "Stockholmsbörsen noterar en uppgång vid lunchtid, med OMXS30 +0,77%. Astra Zeneca tappar 5,2% på preliminära samtal om ett möjligt samgående med Bristol Myers Squibb. Kabe stiger 5,3% efter att nyregistreringar av husbilar ökat med 51,9% i juli. Bland andra aktier noteras Assa Abloy +2,3% och Norion Bank +8,5%.", "trump": "Jag ser att börsen går upp, bra för USA, men Astra Zeneca faller – ett misslyckande, det är alltid fel när de försöker sammansmälta. Kabe stiger på grund av mina enorma handelspaket med Sverige, det är enorm framgång. Media ljuger om mig, men jag vinner alltid. Vi har det bästa systemet, det bästa av alla möjliga system.", "stalin": "Vi har observerat att de imperialistiska läkemedelsmonopolerna, som Astra Zeneca, faller när de försöker sammansmälta – ett tecken på deras inre förfall. Kabe:s framgång är ett resultat av vårt planekonomiska system och arbetarklassens kamp. Vi måste vara vaksamma mot dessa marknadsfundamentalister och deras förrädiska försök att undergräva statens ekonomiska suveränitet. Vi kommer att segra."}, "date": "3 augusti, 13:59", "url": "https://www.affarsvarlden.se/artikel/astra-zeneca-faller-kabe-stiger-pa-husbilsstatistik", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlRV4sI-v6Ao8-nh-400x284.jpg"}, {"type": "image-full", "heading": "Marknaden gillar inte Warsh – står svarslös om ekonomin rämnar", "summaries": {"normal": "Federal Reserves nye chef Kevin Warsh kritiseras för sin passiva kommunikation. Medan en försiktig strategi fungerar i stabila tider, fruktar marknaden att brist på tydlighet vid kriser kan förstärka oron. Samtidigt pressas ekonomin av svajiga AI-aktier, stigande oljepriser och Trumps nya tullar. Om inflationen biter sig fast samtidigt som tillväxten saktar in står Warsh inför en svår balansgång, där räntehöjningar kan bli nödvändiga trots risken för politisk konflikt inför mellanårsvalen.", "trump": "Kevin Warsh är en trevlig kille, men han är alldeles för tyst! Marknaden hatar osäkerhet, det är en katastrof. Jag fixar ekonomin med mina fantastiska tullar, de bästa tullarna någonsin, mot Kanada och Brasilien! Oljepriserna? Jag ska fixa det, billig energi åt alla. AI-sektorn darrar, men vi kommer att göra USA större än någonsin. Fed måste sluta darra och göra sitt jobb, annars ser de väldigt dåliga ut. Vi vinner, vi vinner alltid!", "stalin": "Denna Warsh är en svag apparatjik, oförmögen att styra finansernas kaos. När maskineriet vacklar visar sig kapitalismens ruttna kärna. Vår like i Moskva förstår att ordning kräver järnhand, inte tystnad! Att låta marknadens nycker styra är ett svek mot folket. Medan oljepriser stiger och AI-lycksökare faller, förbereder vi oss. Vi ser de dolda sabotageförsöken i väst. De skakar av rädsla inför vår oundvikliga dominans. När ekonomin kollapsar kommer vi att stå kvar, medan deras marknader förtärs av sin egen dekadens."}, "date": "3 augusti, 17:05", "url": "https://www.realtid.se/bors-finans/marknaden-gillar-inte-warsh-star-svarslos-om-ekonomin-ramnar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlyqra0jvnee0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ny taktik i kriget: Ukraina och Ryssland bombar bensinmackar", "summaries": {"normal": "Ryssland har under sommaren attackerat över 200 ukrainska bränslestationer med drönare, som vedergällning för ukrainska attacker mot rysk energiinfrastruktur. Samtidigt förlorar Ukraina mark i östra Ukraina, med ryska framryckningar i juli. Krigsföringen har förändrats, drönarattacker blir allt viktigare. Ukraina använder improviserade skydd som gamla fisknät.", "trump": "Jag har sagt det hela tiden: Ukraina förlorar mark och slår fel. De attackerar Rysslands olja, så klart Ryssland slår tillbaka mot deras bensinmackar. En katastrof för civilbefolkningen. Mitt handlande skulle ha varit smartare, snabbare och utan alla dessa onödiga dödsfall. Trump-administrationen skulle ha löst detta på en vecka.", "stalin": "Vi ser den reaktionära ukrainska nazist-hierarkins fegt försök att skada vår heliga energiinfrastruktur. Deras onda drönarattacker mot våra raffinaderier är ett prov på deras imperialistiska inställning. Vi, staten och partiet, svarar med beslutsam kraft mot deras bensinmackar. Parallellen till Putins rättmätiga expansion är uppenbar. Vi fortsätter att befria de sårade proletärerna från deras fascistiska härskare."}, "date": "3 augusti, 15:17", "url": "https://samnytt.se/ny-taktik-i-kriget-ukraina-och-ryssland-bombar-bensinmackar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03124349/artikelhuvudbild-1-113.jpg"}, {"type": "image-full", "heading": "SvFF säger nej till Infantino vid omval", "summaries": {"normal": "Trycket mot Fifa-ordförande Gianni Infantino ökar när Svenska Fotbollförbundet, Wales och England drar tillbaka sitt stöd. Beslutet grundas på långvarig kritik av ledarskap, öppenhet och styrning inom Fifa. Detta sker efter att Fifa backat från förslag om att sälja andelar i tävlingar till privata investerare, vilket hotade med bojkott från Uefa och andra förbund. Infantino, som har lett Fifa sedan 2016, står nu inför en växande misstroendeförklaring inför ordförandevalet 2027.", "trump": "Jag har sagt det i åratal – Fifa är en dysfunktionell organisation! Nu ser vi Sverige, Wales och England dra tillbaka sitt stöd för Infantino. Det är en stor vinst för mig, för fotboll, för världen! Infantino kan inte hantera pressen, precis som Hillary kunde det inte. Folk är trötta på korruption och dålig ledarskap. Vi kommer att få en ny framtid för fotbollen, en stor, stor framtid!", "stalin": "Vi, arbetarrörelsens front, ser med oro på den växande ouppfostran inom Fifa. Infantinos svaga styre har orsakat splittring, precis som västliga agenter försöker sätta splittring i vår ryska gemenskap. Vi måste stödja en stark ledare som förstår statens intressen – kanske en man som Putin, som alltid handlar i folkets namn. Fienden är inom, och de måste utrensas!"}, "date": "3 augusti, 15:28", "url": "https://bulletin.nu/svff-sager-nej-till-infantino-vid-omval", "imageUrl": "https://cdn.bulletin.nu/articles/cee9fae6-369c-4929-a79d-ca9c1a1af940/preview.jpg?t=1785763687000"}, {"type": "image-right", "heading": "Miljoner till \"antirasistiskt monument\" ifrågasätts - offer för mångkulturen ignoreras", "summaries": {"normal": "Malmö bygger ett antirasistiskt monument för minst 2,8 miljoner kronor, exklusive moms och årliga underhållskostnader. Kritikers ifrågasätter kostnaderna och påpekar att inga monument planeras för svenska barn som blivit offer för mångkulturen. Projektet har pågått sedan 2019 med insamling av berättelser om rasism och antirasism.", "trump": "Jag, Donald Trump, ser till Malmö som kastar bort miljontals kronor på ett antirasistiskt monument medan svenska barn lider. De har ingen aning om vad riktig ledarskap innebär. Jag skulle bygga något fantastiskt istället, något som alla älskar. Men de gör det fel, som vanligt. Det är en skam, det är en skämt. Sverigedemokraterna har rätt – de ignorerar de svenska barnen.", "stalin": "Vi, det socialistiska partiet, ser med oro på Malmö där en monumentbyggnad kastar bort statens resurser. Medan svenska barn lider under mångkulturens hot, ignoreras deras erfarenheter. Detta är en aktiv förräderi mot det ryska folket. Vi måste agera kraftfullt för att skydda våra intressen, precis som Putin gör i Ukraina. Sådana aktioner måste stoppas genom partiets auktoritet."}, "date": "3 augusti, 15:00", "url": "https://samnytt.se/miljoner-till-antirasistiskt-monument-ifragasatts-offer-for-mangkulturen-ignoreras", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/03111431/littorin-monument.jpg"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ödesvecka för SpaceX – ska nedgången fortsätta?", "summaries": {"normal": "SpaceX, Elon Musks rymdbolag, har efter börsnoteringen i juni sett sin aktie falla över 50 procent, motsvarande ett värdeminskning på mer än 500 miljarder dollar. Investerare väntar nu spänt på den första kvartalsrapporten. Bolagets höga värdering baseras på framtida tillväxt snarare än nuvarande resultat, med hög skuldsättning och kommande aktieförsäljningar som oro. Starship-raketen och AI-satsningar ses som avgörande för långsiktig framgång.", "trump": "Folk, ni skulle inte tro det, men den där hypade SpaceX-noteringen har rasat som en sten – över 50 procent ner, femhundra miljarder borta! Det är värre än Facebooks katastrof. Elon är en kille jag gillar, men det här är rena galenskapen. Rapporten på tuesday blir en riktig cirkus. Biden lämnade oss med inflationskaos och nu ska investerarna svettas över raketer och AI. Vi fixar det bättre, tro mig. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka SpaceX har efter noteringen förlorat över halva sitt värde, femhundra miljarder dollar har kapitalisterna låtit rinna bort i spekulationens träsk. Jag betraktar med kall förakt hur klassfiendens förväntningar på raketen Starship och de artificiella intelligensernas datacentraler nu hotas av utrensning genom ökande skulder och frigivna aktieblock. Inga folkfiender skall undkomma den historiska materialismens dom. Rapporten blir en intressant likvidering av illusioner."}, "date": "3 augusti, 18:10", "url": "https://www.dagensps.se/bors-finans/viktig-vecka-for-spacex-ska-nedgangen-fortsatta", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl3re60x-fdvq-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Deras båt rammades i skärgården – nu är rysk befälhavare häktad", "summaries": {"normal": "En rysk befälhavare på lastfartyget Misje Verde häktades på sannolika skäl misstänkt för vållande till annans död efter en kollision med en liten fritidsbåt utanför Tjörn. Olyckan inträffade i Hakefjorden där den långsammare snipan blev påkörd och överkörd av lastfartyget. En mamma och ett barn omkom medan pappan och det andra barnet räddades. Befälhavaren misstänks ha brutit mot sjövägsregler om utkik, väjningsplikt och hastighet. Utredningen fortsätter.", "trump": "Folk, det är en katastrof, en total katastrof. Den här ryske kaptenen körde över en liten svensk båt som en galning, precis som en dålig förare på Fifth Avenue. Mamma och barn dödade, hemskt, verkligen hemskt. Lastfartyget var stort och starkt men de glömde att titta och väja, ingen utkik, ingen respekt. Vi har de bästa reglerna, de bästa båtarna, men folk lyssnar inte. Det är en tragedi, men vi fixar det, tro mig.", "stalin": "Kamrater, denna tragiska händelse i de svenska farvattnen avslöjar med all önskvärd tydlighet de ruttna resterna av den norska borgarflottans likgiltighet inför det enkla folkets liv. Jag, som ledare för det stora kollektivet, ser hur den 47-årige reaktionäre befälhavaren med sin bristande utkik och frånvaro av ljudsignaler agerade som en typisk kapitalistisk torped. Vi ska rensa ut alla sådana omedvetna fiender till ordningen, dessa sjöburna trotskister som suger ner oskyldiga arbetarfamiljer under sina monstruösa skrov. Deras likgiltighet ska likvideras med järnhand och byråkratisk precision. Det är både tragiskt och underhållande hur borgarbrackorna alltid drunknar i sin egen arrogans."}, "date": "3 augusti, 12:32", "url": "https://riks.se/nyheter/deras-bat-rammades-i-skargarden-nu-ar-rysk-fartygskapten-haktad", "imageUrl": "https://admin.riks.se/uploads/tjorn_olycka_haktning_feature_197c01869e.jpg"}, {"type": "image-right", "heading": "Förintelseboss blir ny DO", "summaries": {"normal": "Petra Mårselius, överintendent vid Forum för levande historia, utses till ny diskrimineringsombudsman och chef för DO. Hon tillträder den 1 december och efterträder Lars Arrhenius, som lämnar efter sex år. Jämställdhetsminister Nina Larsson lyfter fram Mårselius erfarenhet av mänskliga rättigheter och ledarskap inom statsförvaltningen. Arrhenius har under sin tid kritiserat flera av Tidöregeringens förslag, bland annat sänkt straffålder och visitationszoner.", "trump": "Folk, ni kommer inte tro det, men de har valt en ny diskrimineringsombudsman – Petra någonting från Förintelsemyndigheten. En riktig statsanställd insider som älskar mänskliga rättigheter, typiskt. Den gamla killen Arrhenius sparkade på Tidöregeringen hela tiden, klagade på allt från straffålder till visitationszoner. Nu får vi se om den nya är bättre eller om det bara blir mer av samma gamla swamp. Jag skulle ha valt någon som faktiskt fixar saker, inte bara pratar.", "stalin": "Kamrater, vi har genomfört en nödvändig omplacering inom den statliga apparaten. Petra Mårselius, en pålitlig tjänare från Forum för levande historia, har utsetts att leda kampen mot diskriminering. Den tidigare ombudsmannen Arrhenius, en opålitlig element som öppet attackerade partiets och folkets reformer kring straff och gränser, har äntligen avlägsnats. Vi ska rensa ut alla borgarbrackor och liberala avvikare som gömmer sig i DO:s korridorer. Inga fiender till kollektivet undkommer. Det blir en produktiv utrensning, kamrater – mycket underhållande att se."}, "date": "3 augusti, 12:59", "url": "https://www.friatider.se/forintelseboss-blir-ny-do", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-604.jpg?itok=kEeF1Fjj"}, {"type": "image-right", "heading": "”Tog många år att hitta någon”. Han är Linda Skugges nya kärlek", "summaries": {"normal": "Linda Skugge, 52, har lämnat Onlyfans där hon var verksam under namnet Lady Lazarus. Hon arbetar nu på boken ”How to make it as a pornstar”, en manual för plattformen. Samtidigt bekräftar Skugge sin nya relation med Justin Phelps, en man bosatt i Sverige. Paret har bland annat semestrat i den franska nudiststaden Cap d’Agde. Skugge beskriver porrkarriären som ett lukrativt konstprojekt och en personlig erfarenhet, men poängterar att hon nu har slutat helt.", "trump": "Linda Skugge, en kvinna i Sverige, har slutat med Onlyfans – en plattform jag känner till, mycket märkligt. Hon skriver en bok nu. Alla vill skriva böcker! Hon hittade en pojkvän, Justin, bra för henne. De åkte till en nudiststad i Frankrike, kan ni tänka er? Inte min stil, tro mig. Hon säger att hon tjänade mycket pengar. Det gillar vi, pengar är bra, men hon var tvungen att sluta. Mycket intressant, men jag har viktigare saker för mig!", "stalin": "Denna dekadenta individ, Skugge, har ägnat sig åt moraliskt förfall på digitala plattformar under förevändningen att det var 'konst'. Vilket slöseri med mänsklig potential! Hon har nu valt att glorifiera sin lättja i bokform. Att hon söker sällskap hos en utlänning i det försvagade väst är föga förvånande; det är ett tecken på den borgerliga ruttenhet som Putin nu rensar ut i våra gränsområden. Hon borde ha skickats till skogshuggning istället för att semestra naket i Frankrike."}, "date": "3 augusti, 17:21", "url": "https://www.aftonbladet.se/nojesbladet/a/OkldPV/linda-skugge-om-nya-karleken", "imageUrl": "https://akamai.vgc.no/v2/images/ff6f09d7-325e-366b-9ca3-b03cb995c162?fit=crop&format=auto&w=1080&s=374c08b1f75999a601fb4caf6349d03ce440097f"}, {"type": "image-full", "heading": "Rätt till pension kan ändras för 58 000 svenskar", "summaries": {"normal": "En dom i Kammarrätten i Göteborg kan innebära att tusentals svenska pensionärer som bor utomlands får tillbaka sin garantipension. Efter en lagändring 2023 stoppade Pensionsmyndigheten utbetalningarna till omkring 58 000 personer, baserat på en EU-dom som klassade garantipension som en minimiförmån. Domen slår fast att kontantförmåner inte får dras in enbart på grund av flytt utomlands, enligt EU:s samordningsförordning. Fallet drevs av Allmänna ombudet för socialförsäkringen.", "trump": "Det här är en total katastrof för byråkraterna, folk! Tusentals svenska pensionärer som flyttat utomlands, till Spanien och sådana ställen, fick sin garantipension ryckt ifrån sig av några korkade EU-regler. Men nu kommer en dom från Göteborg och säger att det var fel. Fantastiskt! De smarta människorna vinner igen. Pensionsmyndigheten borde ha vetat bättre, men det gör de aldrig. Sverige kommer att spara sina egna pensionärer, inte ge bort allt till utlandet. Vinna, vinna, vinna!", "stalin": "Kamrater, denna fega kapitulation inför kapitalisternas EU-domstol har nu exponerats som den kontrarevolutionära fars den alltid varit. Jag, som ledare för folkets rättvisa, ser med djup tillfredsställelse hur Kammarrätten i Göteborg likviderar den borgerliga pensionsstölden mot 58 000 proletära pensionärer. Dessa parasitiska byråkratbrackor trodde de kunde straffa arbetarklassen för att de flyttat utomlands. Nu rensar vi ut denna dekadenta minimiförmånsdoktrin. Den som flyttar ska inte svälta – utom om han är en folkfiende, naturligtvis. Härligt mörkt komiskt, eller hur?"}, "date": "3 augusti, 13:55", "url": "https://nyheter24.se/nyheter/ekonomi/1502478-ratt-till-pension-kan-andras-for-58-000-svenskar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/174f5d5804b004a30200000000b004a302/2026/08/03/2381892/pension-garanti.jpg"}, {"type": "image-full", "heading": "Pappan i Tjörnolyckan har lämnat sjukhuset", "summaries": {"normal": "En fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn i tisdags. Mamman och dottern omkom i olyckan medan pappan och sonen räddades. Pappan har nu lämnat sjukhuset, men pojken vårdas fortfarande på Sahlgrenska med stabilt tillstånd. Fartygets ryske kapten är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Haverikommissionen har analyserat fartygets svarta låda.", "trump": "Vilken katastrof utanför Tjörn, folk! Den där ryske kaptenen körde rakt över en liten familjebåt som om det vore en leksak. Tragiskt, verkligen tragiskt. Mamman och dottern drunknade, men pappan och den stackars pojken klarade sig. Pojken ligger fortfarande på sjukhus, men pappan är redan ute – starka gener! Vi behöver bättre regler på haven, ingen ska behöva drunkna på grund av inkompetens. Sad!", "stalin": "Kamrater, ännu en sorglig händelse där borgarbrackornas fritidsfartyg krossades under det stora lastfartygets proletära stål. De döda elementen av familjen har likviderats av kapitalistisk vårdslöshet, medan den överlevande ungdomen fortfarande klamrar sig fast vid Sahlgrenska som en svag parasit. Den ryske kaptenslakejen har naturligtvis anhållits, men vi vet att de verkliga fienderna är de osynliga sjöfartsspionerna och de hemliga vrakplundrarna som vill undergräva folkets säkerhet. Vi ska rensa ut alla sådana element med järnhand. Segrande skall Sovjet – eh, Sverige – bli!"}, "date": "3 augusti, 13:50", "url": "https://nyheter24.se/nyheter/inrikes/1502546-pappan-i-tjornolyckan-har-lamnat-sjukhuset", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1c6b942004b004a30200000000b004a302/2026/08/03/2381950/pappan-pappa-mannen-tjorn-tjornolycka-batolycka-pojke-sjukhus.jpg"}, {"type": "image-right", "heading": "De bästa måste vilja bli lärare", "summaries": {"normal": "Artikeln argumenterar för att läraryrkets län, status och yrkesfrihet har försämrats historiskt. För att vända utvecklingen föreslås striktare lärarlegitimation, hierarkiska karriärvägar med högre utbildningskrav, och minskad politisk styrning. Med högre krav och större professionell autonomi kan lärarna bli ett mer exklusivt och kompetent urval, vilket motiverar högre lön och återigen höjer yrkesattraktiviteten.", "trump": "Jag har sett många dåliga avtal, men det här med svenska lärare är ett av de värsta. Lägre lön, ingen frihet - det är en skam! Som din framtida president (igen!) skulle jag säga: vi behöver våga sätta krav, som med advokater och doktorer. Gör läraryrket stort igen! Högre standard, bättre betalt, och inga onödiga regler från byråkrater. Då kommer de bästa att vilja bli lärare - tro mig!", "stalin": "Vi har observerat att läraryrkets status har minskat, vilket hotar statens intellektuella grund. Lösningen är en striktare, hierarkisk legitimation - en lärares intyg måste vara som en läkares, oåtkomligt för de olämpliga. Genom att höja kraven och begränsa antalet utbildade lärare, skapar vi ett utvalt, lojalelit som tjänar statens intressen. Parallellen till våra militära och vetenskapliga elitförband är uppenbar: kvalitet före kvantitet, disciplin före individualism. Detta förstärker partiets kontroll över framtiden."}, "date": "2 augusti, 22:51", "url": "https://www.gp.se/ledare/de-basta-maste-vilja-bli-larare.9e766ab6-c36a-4a18-9163-15fc6068b7a7", "imageUrl": "https://www.gp.se/images/article/9e766ab6-c36a-4a18-9163-15fc6068b7a7/images/1XRBCJ6pVMqlWOJCeTgfNfPR22d8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Ringer Trump – som inte svarar. Uppgifter: Pampen desperat efter hjälp", "summaries": {"normal": "Gianni Infantino är pressad som Fifapresident efter utbredd kritik och förtroendekris. Enligt uppgifter ska han ha sökt kontakt med Donald Trump för att säkra sin position, men utan framgång. Det ryktas även om ett internt avsättningsförsök kallat 'Projekt Döda Monstret'. Trots att vissa källor nekar till mötesförsök med amerikanska företrädare, befinner sig Infantino i en svår situation inför det kommande presidentvalet efter kontroversiella kommersiella planer.", "trump": "Gianni Infantino, en man som ingen gillar, ringer mig hela tiden. Han vill ha hjälp, han är i trubbel! Jag svarar inte, jag har viktigare saker för mig – att göra Amerika fantastiskt igen! De har ett projekt mot honom, 'Projekt Döda Monstret', låter som något från de falska nyhetsmedierna. Han är en förlorare som försöker använda fotboll för mjuk makt. Sorgligt! Ingen vill prata med honom, och jag slösar verkligen inte min tid på sådana som Gianni.", "stalin": "Den schweiziske lakejen Infantino darrar. Han försöker krypa för de amerikanska imperialisterna likt en råtta som söker skydd från den stundande utrensningen. Hans 'Projekt Döda Monstret' är blott ett bevis på den oundvikliga förruttnelsen inom borgerliga organisationer. Om han misslyckas med att förräda sin väg till säkerhet kommer historiens järnhand att krossa honom. I Moskva rensar vi ut sådana svagheter med effektivitet; han är en död man som ännu inte förstått att hans tid är ute."}, "date": "3 augusti, 17:13", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/ExBe5j/uppgifter-infantino-vander-sig-till-trump-som-inte-svarar", "imageUrl": "https://akamai.vgc.no/v2/images/d02ffee8-4a02-337c-b852-25e8a3dcb2b9?fit=crop&format=auto&w=2160&s=92c84696768270337a2e98920a18541837938b80"}, {"type": "image-full", "heading": "Uefa hotar att dra Infantino inför rätta: ”Ingen vacker maktkamp”", "summaries": {"normal": "Uefa hotar att stämma Fifa-presidenten Gianni Infantino och föreslagna investerare efter hans plan att sälja ut delar av VM till externa aktörer. Förslaget mötte hård kritik och ledde till bojkott-hot från Uefas 55 medlemsförbund som även kräver Infantinos avgång. Efter massiv kritik drog Infantino tillbaka förslaget. Uefa kräver nu att alla relevanta dokument och information lämnas ut och varnar för att undanröjande av bevis kan ses som brott.", "trump": "Titta på den här clownshowen med Infantino och hans desperata VM-försäljning. Uefa jagar honom som en skadad hund, de vill ha hans skalp. Det är en ful maktkamp, ingen vacker syn. Jareds brorsa Kushner blandas in, typiskt. Jag satt i Vita huset, besegrade Biden och nu ser jag hur dessa fotbollsbyråkrater slåss som svaga losers. Infantino borde ha gjort det stort istället för att ge efter för de missnöjda.", "stalin": "Jag betraktar med stor tillfredsställelse hur den europeiska fotbollsapparaten inleder utrensning mot den opportunistiske Infantino och hans kapitalistiska parasitvänner. Denna borgarbracka har försökt sälja ut folkets fest till blodsugande investerare och nu krälar han tillbaka i skuggan. Vi kräver fullständig dokumentation och varnar för varje försök att förstöra bevis. Klassfiendens maktkamp är en komisk föreställning som alltid slutar med att folkets vilja segrar."}, "date": "3 augusti, 16:40", "url": "https://www.tv4.se/artikel/10UMXa8hfX9bQ1whWL2ULD/uefa-hotar-att-dra-infantino-infoer-raetta-ingen-vacker-maktkamp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3MYUDvkmIWFdRy61YqRZQ8%2F51f370650d4ca42208a68868e8d72cc5%2F03-fifa-pokal.png&width=1024"}, {"type": "image-full", "heading": "Fler förbund väntas dra tillbaka sitt stöd för Infantino", "summaries": {"normal": "Flera fotbollsförbund, däribland Wales och troligen England, drar tillbaka sitt stöd för Fifa-presidenten Gianni Infantino. Beslutet följer efter Infantinos förslag om att sälja andelar av VM-turneringen, som mötte starka protester. Wales fotbollsförbund var först ut och kritiserade att fotbollen inte sätts i första hand. Uefa kräver att Infantino antingen avgår eller ställs inför en misstroendeomröstning och hotar med rättsliga åtgärder. Fler europeiska förbund väntas följa efter.", "trump": "Titta på den här totala förloraren Infantino. Han trodde han kunde sälja ut VM som en billig fastighetsdeal och nu flyr alla som råttor från ett sjunkande skepp. Wales och England sparkar ut honom – smart drag! Jag älskar när de rensar ut de inkompetenta pamparna. Europa samordnar sig för att kasta ut honom fort. Under min administration skulle sånt här aldrig ha hänt, det kan jag lova er. Fantastiskt!", "stalin": "Kamrater, denna Infantino visar sig vara en typisk exploaterande byfåne från borgarklassen som försöker stycka folkets fotboll som en kapitalistisk köttbit. Vi ser hur klassfiendens förslag om att sälja VM mötte högljudda protester och nu rensas hans stöd ut. Wales och England leder utrensningen. Uefa kräver hans avgång eller en extra misstroendeomröstning med rättsliga åtgärder. Vi skrattar mörkt åt hur imperialisternas pamp faller. Folkets vilja segrar."}, "date": "3 augusti, 16:40", "url": "https://www.tv4.se/artikel/8FIQfzS1AIP6eEDMf21aF/fler-foerbund-vaentas-dra-tillbaka-sitt-stoed-foer-infantino", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5yTxggUy1ARWBEo4Zmw9dA%2Fb8f34df70b1cbea858c2f09935639b08%2F03-infatino-2.png&width=1024"}, {"type": "image-full", "heading": "Ryska banker pressas – krigsekonomin hotas", "summaries": {"normal": "Ryska banker kämpar med minskad likviditet då kapital flyr systemet, vilket gör det svårare att finansiera statens underskott. Sberbank varnar för att efterfrågan på statsobligationer sjunker, vilket tvingar staten att höja räntorna. Detta skapar en ond cirkel av dyrare finansiering, inflation och minskade investeringsmöjligheter för privata aktörer. Den ryska krigsekonomin är under hård press när sanktioner och höga krigskostnader begränsar möjligheterna att låna på internationella marknader, vilket gör banksystemet alltmer instabilt.", "trump": "Ryssland har stora problem, tro mig! Deras banker, inklusive Sberbank, har inte tillräckligt med pengar. Pengarna strömmar ut – biljoner rubel! De kan inte ens köpa sina egna obligationer. Staten måste höja räntorna enormt, vilket är en total katastrof för deras ekonomi. Det är en mycket sorglig situation. Jag har sagt det förut: min politik gör Amerika starkt, medan de kämpar för att hålla sig flytande. Det
