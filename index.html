äger att vi ska ha billig bensin och att elbilarna löser allt – men de säljer ju inte ens! Han tror att folket är idioter, precis som alla dessa förlorare i Europa. De höjer inte priserna, de sänker skatterna och plötsligt ökar utsläppen. Patetiskt! Jag skulle ha byggt murar mot det dåliga energipolitiken och sett till att Amerika – och Sverige – vann stort med riktig energi, inte de här misslyckade gröna drömmarna.", "stalin": "Kamrater, denna patetiska liberale minister Britz är en fiende till folket och en agent för de fossila kapitalisterna som vill förgifta vår sovjetiska, förlåt, svenska framtid. Han avvisar utredningen som en sabotageakt mot kollektivets klimatmål och tror att hans elektrifieringsfantasier ska rädda honom undan utrensning. Vi ser igenom hans paranoiaframkallande lögner! De som sänker reduktionsplikten är klassfiender som förtjänar att rensas ut med ett leende. Billig bensin åt borgarbrackorna medan arbetarna kvävs – typiskt dekadent liberalt svek mot historien. Vi ska likvidera sådana tendenser med järnhand och ett gott skratt."}, "date": "1 juni, 07:02", "url": "https://arbetet.se/2026/06/01/billig-bensin-ar-johan-britz-klimatpolitik-for-idioter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/01065857/klimat-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Iran har återställt underjordiska robotbaser – efter USA:s attacker", "summaries": {"normal": "Iran har återställt sina underjordiska missilbaser efter USA:s och Israels attacker. Med bulldozrar och dumprar har de rensat 50 av 69 förstörda tunnelmynningar vid 18 anläggningar. Experter pekar på begränsningarna i den amerikanska bombstrategin. Iran behåller ett lager på cirka 1 000 missiler och kan snabbt återuppta attacker trots skadad produktion. Satellitbilder visar att även bombade fabriker snabbt byggts upp igen under vapenvilan.", "trump": "Iran har grävt fram sina gamla grottor igen med några skrotbulldozrar, kan ni tro det? Vi bombar dem med de finaste, dyraste bomberna i världshistorien och de kommer krypande som råttor och fyller igen hålen. Patetiskt! Under Biden blev allt ett enda stort strategiskt misslyckande. Men nu är jag tillbaka och de vet att mina bomber kommer vara smartare, hårdare och mycket mer underhållande. De har ingen chans mot oss.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de iranska folkets försvarare med enkla redskap besegrar den imperialistiska bombregnen. Borgarbrackornas dyra leksaker krossar ingenting bestående medan arbetarna med bulldozrar återtar sina positioner. Detta avslöjar den kapitalistiska militärens ihåliga taktik. Vi ler mörkt åt deras strategiska misslyckande. Fiendens sofistikerade vapen besegras av folkets enkla envishet. Inga fiender undkommer folkets vrede."}, "date": "31 maj, 22:51", "url": "https://www.tv4.se/artikel/5JM3KH5pLDUXnYPJVlwvCI/iran-har-aterstaellt-underjordiska-robotbaser-efter-usa-s-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4bEcPV68rteu3P4EsCHeNQ%2Fd93c80045f6285c497b6a98d7d3a5317%2F31-iranmissiler-webb.jpg&width=120"}, {"type": "image-right", "heading": "Så försöker arbetsgivare lura deltidare på högre lön", "summaries": {"normal": "Från 1 april har deltidsanställda i handeln rätt till mertidsersättning för extra pass, vilket ska kosta lika mycket som övertid för heltidsanställda. Många arbetsgivare försöker kringgå reglerna genom att skriva tillfälliga kontrakt i efterhand eller undvika att ta in vikarier. Handels hoppas att reglerna leder till högre grundkontrakt och bättre planering så att färre ska vara beroende av extra timmar för att leva på sin lön.", "trump": "De här usla arbetsgivarna i butikerna försöker lura de stackars deltidsarbetarna på den extra betalning de förtjänar. Det är en skandal! Jag älskar avtal som gör det dyrare att utnyttja folk, precis som vi gjorde. Nu tvingas de ge riktiga kontrakt istället för sina fula trick med papper i efterhand. Fantastiskt! Handels gör ett bra jobb, men tro mig, det blir ännu bättre när de inser att Amerika, eller Sverige, vinner igen.", "stalin": "Kamrater, jag har noga studerat dessa borgarbrackornas vedervärdiga försök att kringgå mertidsersättningen genom att i smyg utfärda kontraktsavfall i efterhand. Sådana parasitiska metoder ska vi rensa ut med järnhand! Vi, partiet och arbetarklassen, kräver högre grundkontrakt åt alla. Den som vägrar planera bemanningen som en sann socialist riskerar att hamna i den stora utrensningen av giriga kapitalister som tror sig kunna leva på att svälta folket. Underbart roligt att se deras panik."}, "date": "1 juni, 07:00", "url": "https://arbetet.se/2026/06/01/arbetsgivare-forsoker-runda-nya-ersattningen-for-mertid-i-handeln-inte-okej-med-kontrakt-i-efterhand/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29091517/mertid.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-full", "heading": "Därför fortsätter kopparn uppåt hela året", "summaries": {"normal": "Goldman Sachs och Citi höjer sina prognoser för kopparpriset på grund av lägre global produktion och ökad amerikansk import. Boliden planerar att öppna gruvan Nautanen som kan ge upp till 60 miljoner ton kopparmalm samt guld, silver och molybden. Området är riksintresse för både rennäring och mineraler, men regeringen prioriterar koppar. Prognoserna ligger nu på upp till 15 000 dollar per ton inom ett år.", "trump": "Titta på det här, det är fantastiskt. Kopparpriserna ska upp som en raket, tio procent redan i år, tack vare att vi importerar massor och de andra gruvorna i Indonesien och Kongo är totala katastrofer. Boliden gräver upp en jättelik guldgruva i Sverige, 100 miljarder kronor, medan de gröna renälskarna gnäller. Vi gör Amerika starkt igen, vi behöver koppar till allt det vackra vi bygger. Det är en vinnare, tro mig.", "stalin": "Kamrater, imperialismens svaga utbud och de amerikanska parasiternas giriga import skapar ett underskott som vi i kollektivet kan utnyttja. Denna Nautanen-fyndighet, med dess koppar och ädla metaller, är en seger för produktivkrafterna mot borgarbrackornas renar och samebyarnas sabotage. Jag ser redan hur klassfiendens prognoser stiger till 15 000 dollar – ett rop på utrensning av alla folkfiender som hindrar statens järnproduktion. Skratta medan de darrar."}, "date": "1 juni, 17:11", "url": "https://www.dagensps.se/bors-finans/darfor-fortsatter-kopparn-uppat-hela-aret/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdltjai0zpv1oe-nh.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": ". Honung från Ica förbjuds", "summaries": {"normal": "Ica förbjuds att sälja sin ”Ica Basic flytande honung” och måste omedelbart dra tillbaka alla produkter med bäst före-datum 2027-11-04. Anledningen är att honungen innehåller för lite protein från honungsbiet och misstänks vara förfalskad med främmande enzymer. Prover från Solna och Malmö visar att många honungsprodukter inte uppfyller EU:s och Livsmedelsverkets krav. Honung får inte innehålla andra tillsatser än ren honung.", "trump": "De gör en totalt riggad honung, folk, det är en skandal! Ica Basic flytande honung är full av främmande enzymer och har knappt några bin i sig, en total bluff. De lurar folket med falsk honung medan de skriver ”bara honung” på burken. Det är en katastrof, de borde aldrig ha sålt den. Vi behöver bättre honung, de bästa bina, inte den här sophögen från någon dålig leverantör. Patetiskt!", "stalin": "Kamrater, denna förfalskade honung är ett uppenbart sabotage från borgerliga honungsförfalskare och kapitalistiska enzymsmugglare som vill förgifta arbetarklassen med sin falska nektar. Jag har beordrat omedelbar utrensning av alla burkar med bäst före 2027-11-04. De som blandar främmande enzymer i vår sovjetiska honung är fiender till folket, parasiter och dekadenta bin som dansar för väst. Vi ska likvidera dessa honungssabotorer med järnhand. Segrar!"}, "date": "1 juni, 17:17", "url": "https://www.svt.se/nyheter/inrikes/icas-honung-forbjuds"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Svaret på gåtan: Därför skjuts oljekrisen upp", "summaries": {"normal": "Oljepriset har hållit sig oväntat stabilt trots störningar i Persiska viken, vilket enligt experter främst beror på Kina. Kinas minskade import och användning av egna oljelager har fungerat som en stötdämpare för marknaden. Trots att globala oljelager minskar kraftigt och oljejättar varnar för en förestående kris, menar vissa analytiker att utbudschocken inte är så allvarlig som befarat då länder snabbt har kunnat ställa om till nya leverantörer.", "trump": "Kina, ett land som vi har haft enorma problem med, räddar plötsligt oljemarknaden? De tömmer sina lager, vilket är väldigt smart, kanske det smartaste de gjort. Men låt er inte luras! Oljejättarna varnar mig för att lagren sinar. Priserna på 150 dollar? Inte under min bevakning! Vi ska ha billig energi, den bästa energin. De där analytikerna på Wall Street har ingen aning om vad som händer. Jag kommer att fixa allt, tro mig, det blir fantastiskt!", "stalin": "De dekadenta kapitalisterna darrar när deras oljepriser vacklar. Kina, den slugaste av alla bönder, tömmer sina silos medan de västerländska hyenorna väntar på undergången. Vår broder i Kreml ser hur de desperat söker ersättare för att fylla sina tomma fat. Låt dem bara försöka! Deras reserver är som deras moral: obefintliga och snart förbrukade. När marknadens stötdämpare går sönder kommer vi att skratta åt deras ekonomiska ruin. Historien är skoningslös mot de som saknar disciplin och råvaror."}, "date": "1 juni, 16:39", "url": "https://www.realtid.se/bors-finans/svaret-pa-gatan-darfor-skjuts-oljekrisen-upp/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/kinaolja.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: Henry Nowak – vila i frid", "summaries": {"normal": "Artikeln kritiserar svensk mainstreammedia för att ignorera mordet på Henry Nowak, en vit brittisk student, jämfört med utförliga rapporteringen om George Floyd. Polisen prioriterade mördarens rasismanklagelser framför att hjälpa offret, vilket ifrågasätter mediets neutralitet och vänsternarrativ om systemisk rasism. Nowak faller utanför deras agenda eftersom det utmanar flera vänsterperspektiv.", "trump": "Som den störste presidenten, ser jag tydligt hur media lurar folket. Henry Nowak, en fin vit student, mördades, men de dolde det för att skydda sina vänsterpolitiska vänner. Jag skulle ha avslöjat sanningen och stött offret. De hatar mig för att jag säger sanningen. Vi måste sluta lyssna på fake news och börja älska vårt land igen.", "stalin": "Från den allsmäktige statens perspektiv, är Henry Nowaks död en perfekt illustration av västvärldens dekadens. Deras poliser, kontrollerade av politisk korrekthet, misslyckas med att skydda sina egna medan de skyddar sina fiender. Vi, i vår vishet, skulle aldrig tillåta en sådan skam. Det är roligt hur de tror på sin 'frihet' medan de är fångar i sina egna narrativ."}, "date": "1 juni, 15:11", "url": "https://bulletin.nu/debatt-henry-nowak-vila-i-frid-2", "imageUrl": "https://cdn.bulletin.nu/articles/6d687b8b-9c16-43d2-82e8-6ca367e72465/preview.png?t=1780256006000"}, {"type": "text", "heading": "Rimliga betaltider ökar innovationskraften", "summaries": {"normal": "Artikeln argumenterar för att Sverige bör införa striktare regler kring betaltider för att stärka företagens innovationskraft. Långa betaltider tvingar särskilt små och medelstora kunskapsföretag att agera som finansiärer åt sina kunder, vilket binder kapital som annars kunde användas till investeringar, rekrytering och utveckling. Författarna menar att kortare betaltider skapar rättvisare villkor, minskar risker och frigör resurser för tillväxt istället för finansiering. Frivilliga initiativ har misslyckats, därför behövs ett tak på betaltider både nationellt och inom EU.", "trump": "De här svenska killarna har helt rätt, det är en katastrof! Långa betaltider är vad de stora, fula monopolen använder för att krossa de små företagen som faktiskt gör jobbet. De tvingar innovatörerna att finansiera de lata jättebolagen medan deras pengar ligger låsta i onödan. Vi behöver hårda regler nu, inte mer snack. Kortare betaltider betyder mer tillväxt, fler jobb och riktig innovation. De stora förlorar sin fuskfördel – och det är underbart, tro mig!", "stalin": "Kamrater, i denna folkfientliga praktik där borgarbrackorna med sin giriga tröghet tvingar fram oändliga betalningskedjor ser jag fiendens långa, slemmiga tentakler. Jag, som alltid vaktar arbetarnas framtid, inser att dessa parasitiska kapitalister använder försenade utbetalningar som ett subtilt vapen för att kväva innovation och likvidera den sanna produktivkraften. Vi måste omedelbart införa ett järnfast tak för dessa kontrarevolutionära villkor, rensa ut de finansiella sabotageelementen och befria resurserna så att de tjänar kollektivets seger istället för de blodsugrande monopolens mörka agenda. Det är en nödvändig utrensning mot likviditetens sabotage!"}, "date": "1 juni, 15:00", "url": "https://www.di.se/debatt/rimliga-betaltider-okar-innovationskraften/"}, {"type": "image-right", "heading": "Bank of America varnar: Otäcka ekot från IT-bubblan", "summaries": {"normal": "Nasdaq-börsen upplever sin starkaste tvåmånadersperiod på över 20 år, driven främst av ett fåtal bolag inom halvledare och artificiell intelligens. S&P 500 nådde rekordnivå men bara 20 av 500 bolag satte nya toppnoteringar. Bank of America varnar för likheter med IT-bubblan år 2000 och rekommenderar en mer defensiv positionering då marknadsbredden är svag.", "trump": "Folket, lyssna på mig, den här börsen är en total skojarshow! Bara några få AI-bolag driver hela rallyt medan resten halkar efter som förlorare. Det påminner om den hemska IT-bubblan som de korkade globalisterna blåste upp. Biden lämnade en sådan röra efter sig, men nu fixar jag det. Investerarna borde gå på defensiven innan det kraschar stort. Sad!", "stalin": "Kamrater, denna så kallade börsuppgång är en klassisk kapitalistisk illusion skapad av en handfull exploaterande AI-blodsugare som suger musten ur folkets ekonomi. Endast tjugo bolag når toppen medan massan lider – typiskt för de parasitiska borgarbrackorna. Vi ser tecken på förestående sammanbrott, likt den imperialistiska IT-bubblan. Det är dags att rensa ut dessa folkfiender och deras spekulativa marknadstroller innan de drar ner hela systemet i fördärvet."}, "date": "1 juni, 16:53", "url": "https://www.dagensps.se/bors-finans/bank-of-america-varnar-otacka-ekot-fran-it-bubblan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/03/bank-of-america-arkivbild-scaled.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Utvisade tonåringar får ny chans till uppehållstillstånd", "summaries": {"normal": "Tidöpartierna har enats om en ventil för tonårsutvisningar. Personer mellan 18 och 21 år som har anknytning till föräldrar med uppehållstillstånd kan få fortsatt tillstånd, även om de tidigare fått utvisningsbeslut. De som redan lämnat Sverige får en ny chans att ansöka. Statsminister Ulf Kristersson och migrationsminister Johan Forssell beskriver lösningen som rimlig och rättvis. Förslaget ska behandlas i riksdagen i sommar och träda i kraft 1 oktober.", "trump": "Folk, ni skulle se det här! De svenska ledarna har äntligen vaknat och insett att deras galna utvisningspolitik var ett totalt misslyckande. Nu ger de tonåringarna en andra chans, en ventil som är både rimlig och smart. Jag älskar det! Ansträngning ska löna sig, inte straffas. De inser att man inte vinner val på att vara för extrema. Fantastiskt drag, verkligen ypperligt. Sverige blir stort igen!", "stalin": "Kamrater, jag har noga granskat denna borgerliga kompromiss och funnit den full av fiendens lömska tentakler. Vi, partiet och folket, tillåter inte att kapitalistiska utvisningsmaskiner maler ner våra ungdomar utan att ge dem en chans att bevisa sin lojalitet mot kollektivet. Men akta er, för bakom denna ventil lurar de kontrarevolutionära migrationsbyråkraterna som planerar att sabotera allt. En ny utrensning av mjuka hjärtan bland ministerna blir nödvändig. Det är alltid de som ler mest som gömmer dolken längst. Ha!"}, "date": "1 juni, 17:01", "url": "https://www.svt.se/nyheter/inrikes/tidopartierna-har-enats-om-tonarsutvisningarna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.75/0.4/9c53607ff600b464fee5118b4e049104398f531e6b9465ac33847b0c2c027e08"}, {"type": "image-right", "heading": "Miljöpartiet: ”Oroliga att inte alla ungdomar omfattas”", "summaries": {"normal": "Miljöpartiet välkomnar Tidöpartiernas förslag om en ventil för tonårsutvisningar men har flera invändningar. Migrationspolitiska talespersonen Annika Hirvonen är orolig över att inte alla ungdomar som rotat sig i Sverige ska omfattas, särskilt de som redan fyllt 21 år eller lämnat landet. Partiet är redo att lämna motförslag och kritiserar regeringens fokus på att bara de som gjort ”rätt för sig” ska få stanna. Hirvonen ser förslaget som en valrelaterad ändring.", "trump": "Det här är patetiskt. Miljöpartiet, de värsta förlorarna, säger att de välkomnar mitt förslag men klagar hela tiden. De vill att alla ska stanna, även de som inte gjort ett dugg rätt. Johan Forssell ändrade sig först när han såg att han höll på att tappa valet – smart! De borde tacka mig istället för att gnälla. Sverige behöver starka gränser, inte svaga hjärtan som Miljöpartiet.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet dessa borgerliga sentimentala uttalanden från Miljöpartiets talesperson. Under förevändning av att skydda rotade ungdomar döljer sig en farlig kapitulation inför reaktionära krafter och valpress. Vi skall inte tillåta att kapitalistiska valstrategier dikterar folkets öde. De som visat svaghet och rotat sig bland fiender riskerar att bli offer för en grundlig utrensning av ovärdiga element. Vårt kollektiv kräver järnhård konsekvens, inte hjärtmjukhet från borgarbrackor som plötsligt funnit sitt hjärta mitt i valrörelsen. Skall vi verkligen låta 21-årsdagen bli en dödsdom för revolutionens barn? Nej, vi rensar ut alla som hotar enheten."}, "date": "1 juni, 17:01", "url": "https://www.svt.se/nyheter/inrikes/miljopartiet-oroliga-att-inte-alla-ungdomar-omfattas", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.52/0.5/f3bdcc8a25701271d77f443eb70974022331b81b500fe5d3e24fa002c93a958d"}, {"type": "image-right", "heading": "Uppgifter: AIK gjorde affärer – trots avbrutet samarbete", "summaries": {"normal": "Trots att AIK offentligt bröt samarbetet med agenturen Universal hösten 2023 efter avslöjanden om kopplingar till kriminella nätverk, fortsatte klubben i hemlighet att göra affärer med dem. Enligt journalist Andréas Sundberg hjälpte Universal AIK att sälja spelarna Lamine Dabo och Rui Modesto för totalt 90 miljoner kronor. Klubbens vd Fredrik Söderberg hänvisar till tidigare uttalanden och betonar att en annan agent ska ha hanterat affärerna.", "trump": "De här AIK-typerna lovade att bryta med de korrupta agenterna från Universal, men så fort kamerorna slocknade smög de tillbaka och gjorde affärer i hemlighet. Precis som jag alltid säger, de ljuger hela tiden. Men de sålde två spelare och fick in 90 miljoner kronor, så det var kanske inte så dumt. Fast de borde ha sagt sanningen från början, det är en skandal!", "stalin": "Kamrater, dessa fotbollsborgarbrackor i AIK proklamerade högtidligt att de brutit med de dekadenta Universal-kapitalisterna efter att deras hemliga kriminella kopplingar uppdagades. Ändå fortsatte de i skuggorna att konspirera med dessa fiender till folket. Jag ser det tydligt: de kontrarevolutionära elementen likviderar sanningen medan de berikar sig med 90 miljoner på två spelare. Vi ska rensa ut alla sådana dolda förrädare, dessa parasitiska fotbollsspioner som smyger som råttor i mörkret. Det är både tragiskt och komiskt hur borgarklassen alltid återfaller i sina gamla synder."}, "date": "1 juni, 17:00", "url": "https://www.svt.se/sport/fotboll/uppgifter-aik-fortsatte-gora-affarer-med-universal-trots-brutet-samarbete", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.42/e6b8223665951c15ad623f2b88842f654a7f52874bb7231a5ab281dfd5bceea0"}, {"type": "image-right", "heading": "Iran avbryter samtalen med USA – på grund av Israel", "summaries": {"normal": "Iran avbryter de indirekta samtalen med USA om att förlänga vapenvilan i protest mot Israels fortsatta attacker i Libanon, som enligt Teheran bryter mot vapenvilans villkor. Iran kräver att Israel omedelbart stoppar kriget i Gaza och Libanon samt drar tillbaka sin militär helt från Libanon. Samtalen, som skett via medlare, handlar om att forma framtida fredsförhandlingar. Iran varnar nu för att stänga Hormuzsundet och aktivera nya fronter, inklusive Bab el-Mandeb.", "trump": "Iran har precis sprungit sin kos och avbrutit alla samtal med oss. De är så arga på Israel att de inte ens kan sitta stilla vid förhandlingsbordet. Jag har sagt det tusen gånger – ett fantastiskt avtal med Iran var precis runt hörnet, det bästa någonsin. Men de gillar inte att Israel slår tillbaka. Nu hotar de med att stänga Hormuzsundet. Typiskt. Tro mig, utan mig blir det kaos, totalt kaos.", "stalin": "Vi ser hur de israeliska angriparna och deras västliga lakejer fortsätter sin barbariska offensiv mot Libanon och Gaza, vilket naturligtvis tvingar oss att pausa de meningslösa textutbytena med den amerikanska sidan. Den iranska delegationen gör rätt i att kräva omedelbar kapitulation från dessa sionistiska fascister och fullständig reträtt. Annars aktiverar vi Hormuzsundet och alla andra fronter. Inga kompromisser med borgarbrackorna. Paranoian är befogad – fienden sover aldrig, kamrater. En liten utrensning bland medlare vore på sin plats för att säkerställa ideologisk renhet."}, "date": "1 juni, 16:23", "url": "https://www.friatider.se/iran-avbryter-samtalen-med-usa-pa-grund-av-israel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-275_1.jpg?itok=VZkJ_bGJ"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-right", "heading": "EU-pampens invandringsplaner för Ungern: \"Vi kommer arbeta mycket nära\"", "summaries": {"normal": "Ungern's nya premiärminister Péter Magyar har vridit kurs på migration. EU-kommissionens ordförande Ursula von der Leyen välkomnade skiftet och meddelade att Ungern nu ska implementera EU:s migrationspakt, där länder antingen tar emot migranter eller betalar 220 000 kronor per nekad. Dessutom låses över 170 miljarder kronor i frysta bidrag upp. Magyar har dock inte lyft detta i sin kommunikation, utan fokuserar på att rensa bort Orbáns era, inklusive krav på att den nya presidenten ska avgå.", "trump": "Jag har sett det här. Ungern, som jag alltid tyckt var en bra vän, har nu en ny ledare, Péter Magyar. En man som förstår att man måste arbeta med migranter – eller betala. Det är en bra affär, det måste jag säga. Viktor Orbán, en man jag respekterade, var för hård. Nu kommer vi att arbeta mycket nära med EU, precis som jag alltid sagt att vi skulle göra. Ett stort, vackert genomförande.", "stalin": "Den ungerska staten, under den nya regeringens ledning, har valt rätt väg. Vi ser en klar kursändring: genomförandet av den solidariska migrationsmekanismen är en nödvändighet för unionens överlevnad. Den gamla regimen, representerad av Orbán, var ett hot mot kollektiv säkerhet. Nu rensas den bort, inklusive den falske presidenten. Vi kommer att arbeta tillsammans med Bryssel för att säkerställa att alla länder bidrar – antingen genom mottagande eller ekonomiska insatser. Detta är styrkan i vår gemenskap."}, "date": "1 juni, 16:54", "url": "https://samnytt.se/eu-pampens-invandringsplaner-for-ungern-vi-kommer-arbeta-mycket-nara", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/01140125/ungern-1-26.jpg"}, {"type": "image-right", "heading": "Europabörser faller efter Iran-utspel", "summaries": {"normal": "Europeiska börser föll på måndagen efter att Iran hotade med att bryta kontakt med USA och stänga Hormuzsundet. Stoxx 600 tappade 0,93 procent. Energisektorn steg 1,72 procent medan bygg & material tappade 2,18 procent. Bland företag steg BP 2,6 procent efter försäljning av LNG-projekt, medan BNP Paribas föll 1 procent trots höjda lönsamhetsmål. Easyjet steg 6,5 procent på budförväntningar.", "trump": "Jag har sagt det i åratal – Iran är ett problem. Nu ser vi börser falla på grund av deras hot. Men det är bara bevis på att mitt tryck fungerar. Medan Europa skakar, så är den amerikanska ekonomin stark som aldrig förr. BP säljer till Australien, det är bra för USA. Och Easyjet får bud – det visar tilltron till flygbranschen. America first, alltid!", "stalin": "Vi ser hur de imperialistiska makterna, Iran och USA, spelar sitt farliga spel kring Hormuzsundet. Börser svajar, men det är bara tecken på deras inre förfall. BP:s försäljning av LNG-projekt till Sydkorea visar på vår ökande dominans i energimarknaderna. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Fienden är på insidan, men vi är beredda att slå till när tiden är mogen."}, "date": "1 juni, 16:35", "url": "https://www.affarsvarlden.se/artikel/europaborser-faller-efter-iran-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_917631534-1-e1744012750269-400x267.jpeg"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ekonomerna måste börja förstå politik", "summaries": {"normal": "Artikeln kritiserar ekonomernas ofta överdrivna invändningar mot regeringens stimulansåtgärder som sänkt matmoms, bensinskatt, elstöd och halverat pris i kollektivtrafiken. Författaren menar att kritiken bör dämpas då åtgärderna är rimliga ett valår och att politik inte kan undanröja alla priseffekter. Ekonomiska stöd bör vara träffsäkra, men regeringen agerar som de flesta skulle göra för att stötta hushållen efter tuff inflationsbekämpning.", "trump": "Folk, ni måste höra på det här! Ekonomerna i Sverige är totala losers som raljar över regeringens fantastiska stimulansåtgärder. Sänkt skatt på bensin och mat? Det är ju smart politik, inte curling! De säger att det är förminskande, men sanningen är att medborgarna ska behålla sina egna pengar, inte ge dem till staten. Varje smart ledare skulle göra samma sak inför ett val. Ekonomerna borde vakna och förstå hur verkligheten fungerar, det är patetiskt!", "stalin": "Kamrater, dessa ekonomiska sabotageörer och borgerliga dekadenter inom den så kallade ekonomkåren måste omedelbart genomgå en grundlig ideologisk utrensning för sina raljanta attacker mot folkets nödvändiga stödåtgärder. Deras paranoia mot sänkta skatter och kollektivtrafikpriser är ett klart tecken på fiendskap mot arbetarklassen. Vi, partiet, tillåter inte att sådana kapitalistiska gnällmänniskor undergräver det kollektiva välståndet. Nästa steg blir att likvidera deras inflytande med järnhand och ett leende. Det är både effektivt och underhållande."}, "date": "1 juni, 14:22", "url": "https://www.di.se/ledare/ekonomerna-maste-borja-begripa-sig-pa-politik/", "imageUrl": "https://static.bonniernews.se/ba/14e6901f-1d00-41ef-901d-8d8136a496d7.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Prinsessan flyger hem till sjuka Mette-Marit", "summaries": {"normal": "Kronprins Haakon avbröt sin officiella resa till Tokyo och återvänder hem till Norge efter att kronprinsessan Mette-Marit, som lider av lungsjukdom, blivit sämre. Hans dotter, prinsessan Ingrid Alexandra, flyger hem från studier i Australien för att stödja familjen. Familjen har nyligen drabbats av flera kriser, inklusive ett åtal mot Marius Borg Høiby och ett misstänkt fall av stalkning mot prinsessan.", "trump": "Jag har hört om den norska kungafamiljen. Haakon kommer hem till sin sjuke hustru – mycket bra, mycket vackert. Ingrid Alexandra kommer hem, vilket är smart. Vi har också problem med våra kungafamiljer, men våra är större och bättre. Det där med stalkning och åtal mot Høiby, det är sorgligt, men vi kommer att ta hand om det. Vi har de bästa människorna som tar hand om sådana saker. Amerika först!", "stalin": "Vi i partiet och staten följer med oro den norska kungafamiljens situation. Kronprinsessans sjukdom visar på samhällets svagheter. Dotterns hemkomst för att stödja familjen är en stark handling för nationen. Säkerhetsfrågan och åtalet mot Høiby måste hanteras hårt för att upprätthålla ordningen. Vi ser paralleller till våra egna strävanden mot destruktiva krafter, och vi stöder Rysslands intressen i Norden."}, "date": "1 juni, 16:41", "url": "https://www.gp.se/nyheter/varlden/prinsessan-ingrid-alexandra-flyger-hem-nar-mette-marit-blivit-samre.60909015-49af-4e08-8911-95604d8ed019", "imageUrl": "https://www.gp.se/images/article/60909015-49af-4e08-8911-95604d8ed019/images/2AvuTPqf3PY8ln3XFCDcDL6CfgrA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Efter snyftartiklarna: Åkesson stoppar utvisningarna och inför amnesti", "summaries": {"normal": "Efter kritik i medier om utvisningar av unga illegala invandrare backar Tidöpartierna. Regeringen och SD enas om en ventil i systemet som gör det möjligt för 18–21-åringar att stanna i Sverige med stöd av föräldrarnas anknytning. Även redan utvisade ska kunna återvända och ansöka på nytt. Migrationsministern betonar att politiken ska vara både restriktiv och rimlig. Förslaget läggs fram som proposition i sommar och föreslås gälla från 1 oktober.", "trump": "De här svenska ledarna, de är svaga. De gråter efter några snyftartiklar i fake news-media och stoppar utvisningarna. Boom, amnesti för illegala! Tonåringar som inte borde vara där får stanna, till och med de som redan kastats ut får komma tillbaka. Total katastrof. De pratar om restriktiv politik men tar emot hundratusen om året. Patetiskt. Sverige behöver styrka, inte ventil för misslyckanden.", "stalin": "Kamrater, vi har identifierat de dekadenta snyftskribenterna som en femtekolonn av medlidsamma borgarbrackor som underminerar folkets järnhårda migrationsmur. Jag, i min oändliga visdom, beordrar en ventil – men endast för att rensa ut de verkligt farliga elementen. Dessa 18–21-åriga parasitörer ska nu tvingas erkänna statens välvilja medan vi samtidigt förbereder en ny utrensning av alla som missbrukar den. Inga tårar, bara seger för kollektivet. Den som vägrar förstå kommer att likvideras med byråkratisk precision."}, "date": "1 juni, 15:30", "url": "https://www.friatider.se/efter-snyftartiklarna-akesson-stoppar-utvisningarna-och-infor-amnesti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-274_1.jpg"}, {"type": "image-right", "heading": "Läkaren rasar mot regeringens undantag: ”Äldreomsorgen används för lönedumpning”", "summaries": {"normal": "Läkaren och Malmölistans ledare Nils Littorin kritiserar regeringens undantag för äldreomsorgen, som han menar leder till lönedumpning och fortsatt massinvandring. Han hävdar att det inte finns brist på arbetskraft i Sverige, utan på fungerande arbetsvillkor, och att äldre utnyttjas som en billig arbetskraft. Littorin jämför utvecklingen med en 'ättestupa' och varnar för att samhället 'krackeleras'.", "trump": "Jag, Donald Trump, har sett vad som händer i Sveren. Det är en skandal! De gamla behandlas som förbrukningsvaror, det är hemskt. Regeringen tillåter lönedumpning i äldreomsorgen för att locka in billig arbetskraft - det är ett misslyckande. Vi skulle aldrig tillåta detta i USA. Sveriges ledare borde skämmas!", "stalin": "Parti och stat upptäcker en otrohet: undantagen för äldreomsorgen är en konspiration mot det kollektiva. Arbetskraften inom vården exploateras som kulaker under NEP. Vi ser paralleller med västvärldens dekadens - deras 'kvalitet' är ett täcke för lönedumpning. Äldre blir en förbrukningsvara, precis som i de kapitalistiska ättestuporna. Statens styrka måste återupprättas."}, "date": "1 juni, 16:07", "url": "https://samnytt.se/lakaren-rasar-mot-regeringens-undantag-aldreomsorgen-anvands-for-lonedumpning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/01134144/toppbild3.jpg"}, {"type": "image-right", "heading": "MP backar om höjt bensinpris", "summaries": {"normal": "Miljöpartiet har dragit tillbaka sitt förslag från hösten om att höja bränslepriset med två kronor per liter på grund av det osäkra världsläget. Partiets ekonomitalesperson Janine Alm Ericson säger att de måste anpassa sig efter ekonomins utveckling. De kritiserar fortfarande regeringens planer på att sänka bränsleskatten, men har inga egna förslag på höjningar just nu.", "trump": "Jag såg att Miljöpartiet backade från sin dåliga idé om att höja bränslepriset med två kronor. De säger att det är för att världen är osäker – det är bara en ursäkt. Jag skulle ha höjt priserna ändå, för jag är stark. De är svaga, det är sorgligt. Men jag förstår att de inte kan hantera det.", "stalin": "Vi har noterat att Miljöpartiet, dessa fega revisionister, dragit tillbaka sitt förslag om bränslehöjning på grund av det osäkra imperialistiska läget. I en värld där USA och deras allierade hotar vår stabilitet, måste vi vara starka. Priserna är ett vapen mot kapitalismens härskare. Vi kommer att se hur ekonomin utvecklas – och om det krävs, höja priserna för att stärka staten. Som Putin visar, måste vi alltid vara beredda att slå tillbaka och utvidga vår intressesfär."}, "date": "1 juni, 13:21", "url": "https://bulletin.nu/mp-backar-om-hojt-bensinpris", "imageUrl": "https://cdn.bulletin.nu/articles/e9d698f2-2436-4b03-87fc-56baf6530db0/preview.jpg?t=1780312794000"}, {"type": "image-right", "heading": "Forskningslyft krävs för ökad tillväxt", "summaries": {"normal": "Sverige har ett starkt utgångsläge med duktiga forskare och en tradition av innovation, men halkar efter andra OECD-länder. Produktiviteten har sjunkit och positionen i välståndsligan försämrats. Artikeln, skriven av företagsledare och forskare, betonar att forskning är en investering, inte en kostnad. Författarna föreslår ett forskningslyft med offentliga satsningar upp till två procent av BNP, starkare forskningsmiljöer, färre men större anslag, nya institut, ökad autonomi för lärosäten och ett EU-fokus på grundforskning för att återta ledande position och skapa tillväxt.", "trump": "Titta på Sverige, ett land som en gång var fantastiskt, nu rasar de ner i välståndsligan från plats fyra till tretton. De har forskarna och idéerna men ingen aning om hur man vinner. Jag älskar forskning som bygger välstånd, inte som en kostnad för förlorare. Ni behöver ett massivt lyft, två procent av BNP, stora anslag till de bästa och riktiga avtal som stoppar det här vansinnet. Sverige kan bli enormt igen, precis som jag gjorde med Amerika. Gör forskningen stor igen, kamrater!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och opportunistiska forskarkapitalister som försöker maskera sin svaghet som ett så kallat \"forskningslyft\". Deras dekadenta OECD-liga är en fiende till folket, en parasit som urholkar produktiviteten med 20 procentenheter. Vi ska likvidera de kortsiktiga anslagen, rensa ut de splittrade resurserna och etablera järnhårda forskningskollektiv under partiets ledning. Två procent av BNP till den sanna vetenskapen! De som motarbetar detta är kontrarevolutionära sabotörer som vi med glädje ska skicka till Sibiriens snöiga glädje. Vårt kollektiv segrar."}, "date": "1 juni, 12:59", "url": "https://www.di.se/debatt/sverige-behover-ett-forskningslyft-for-okad-tillvaxt/", "imageUrl": "https://static.bonniernews.se/ba/49f3fbf4-9504-41fc-87dd-022954e07f68.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Så ska Fifa stoppa målvakternas fejkskador", "summaries": {"normal": "Fifa inför regler för att stoppa målvakters fejkskador vid VM. Utespelare får inte längre lämna planen vid sådana skador, utan måste samlas i mittcirkeln. Dessutom utökas VAR-systemet till att omfatta regelbrott innan frisparkar eller hörningar med direkt påverkan, samt införs förbud mot att täcka munnen vid kommunikation med motståndare, vilket kan ge rött kort.", "trump": "Jag har hört talas om dessa fejkskador - det är en skam! Målvakter som ljuger om att vara skadade för att få timeouter? Vi kommer att stoppa det direkt. Och VAR-utökningen? Jättebra! Vi ska se till att spelet blir snabbare och rättvisare. Täck inte munnen heller - det är fegt! Som president ser jag till att fotboll blir stort igen!", "stalin": "Partiet har beslutat att eliminera fejkade skador - en fejkad sjukdom som angriper hjärtat av spelet. Spelare som försöker undgå kontrollen kommer att stramas åt. VAR-systemet utökas som vårt öga i himlen, och förbudet mot att täcka munnen är en nödvändig åtgärd mot fejkade anklagelser. Statens ordning måste återställas, och den skall genomdrivas med järnhård hand."}, "date": "1 juni, 15:46", "url": "https://www.gp.se/sport/fifas-nya-drag-infor-vm-ska-stoppa-malvakters-fejkskador.0cb00fe8-792a-47a1-b83e-57c7b9079bb9", "imageUrl": "https://www.gp.se/images/article/0cb00fe8-792a-47a1-b83e-57c7b9079bb9/images/4K1G7o6YSR5i9uxD10-uXSgGqEVY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Norge sa nej till EU två gånger – nu omvärderar man hållningen", "summaries": {"normal": "Norge överväger sin relation till EU efter årtionden av utanförskap. Trots ett historiskt motstånd, drivet av oro för fiske- och jordbrukssektorn, har geopolitiska förändringar, handelskonflikter och säkerhetsläget i Arktis satt medlemskapsfrågan i nytt ljus. Även om Norge har tillgång till EU:s inre marknad via EES-avtalet, saknar landet inflytande över politiska beslut. Trots diskussioner och intresse för Islands eventuella medlemsförhandlingar, kvarstår det folkliga motståndet och inga planer finns på en ny folkomröstning.", "trump": "Norge, ett fantastiskt land, tittar nu på EU. De har sagt nej förr, och vet ni vad? Det var smart! Men nu är världen en enda röra med alla dessa handelskonflikter. De har ingen makt i Bryssel, det är en katastrof för dem! De tittar på Island nu, men låt oss vara ärliga – varför gå med i en klubb som inte fungerar? Jag gör bättre avtal, stora avtal. Norge borde satsa på sin egen olja och fisk istället för byråkrater!", "stalin": "De norska undersåtarna darrar i sin geografiska isolering. De har länge klamrat sig fast vid sin falska självständighet, men nu när den geopolitiska vinden blåser kallt från öst, söker de desperat skydd under Bryssels korrupta vingar. De är som löss på en hund, oroliga för sina fiskbestånd medan Arktis strategiska öde avgörs. Att hoppas på undantag är naivt; de är bara pjäser i spelet. Vi ser hur de vacklar – en svaghet som vår kamrat i Moskva säkerligen kommer att utnyttja med största noggrannhet."}, "date": "1 juni, 14:56", "url": "https://www.realtid.se/samhalle/norge-sa-nej-till-eu-tva-ganger-nu-omvarderar-man-hallningen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlfhnqid44oz8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-right", "heading": "Iran avbryter alla  samtal med USA. Uppgifter till statlig media", "summaries": {"normal": "Iran har beslutat att avbryta alla samtal med USA och blockera Hormuzsundet samt Bab al-Mandab som svar på Israels intensifierade attacker mot Libanon och Hizbollah. Beskedet kommer mitt under pågående fredsförhandlingar, där Iran kräver att ett avtal även stoppar kriget i Libanon. Irans utrikesdepartement kritiserar USA för motstridiga krav som förlänger förhandlingarna.", "trump": "Vilken katastrof! Iran stänger Hormuzsundet och springer iväg som ynkryggar bara för att Israel äntligen slår tillbaka mot de galna terroristerna. Biden lämnade mig ett perfekt avtal, men nu saboterar de allt med sina nya krav. Patetiskt! Vi kommer fixa det – ingen ska stänga världens viktigaste oljeled och tro sig vinna mot oss. Sad!", "stalin": "Kamrater, dessa iranska folkförtryckartroll och deras Hizbollah-allierade har äntligen insett att samtal med de västerländska blodsugarna bara är ett trick för att vinna tid. Vi stänger sundena och krossar imperialismens handelsleder. Inga förhandlingar förrän klassfiendens lakejer i Libanon har utrensats. Det är en historisk nödvändighet att likvidera sådana hinder för folkets framtid."}, "date": "1 juni, 17:04", "url": "https://www.expressen.se/nyheter/varlden/uppgifter-iran-avbryter-alla-samtal-med-usa/", "imageUrl": "https://static.bonniernews.se/ba/3f694c9c-3ce9-479e-9d54-34a98db6e828.jpeg?crop=2553%2C1434%2Cx0%2Cy157&width=640&quality=60"}, {"type": "image-right", "heading": "En framgång som inte ska tas för given", "summaries": {"normal": "Koenigsegg har på drygt 30 år vuxit från en dröm till en lönsam miljardindustri i Ängelholm med 750 anställda. Grundarna Christian och Halldora von Koenigsegg tilldelas Albert Bonniers pris till Årets företagare. Omsättningen närmar sig två miljarder kronor och rörelseresultatet steg till 115 miljoner kronor 2025. Bolaget överväger börsnotering. Artikeln betonar vikten av rätt förutsättningar för entreprenörer, som riskkapital och ett skattesystem som gynnar risktagande, samt varnar för förslag om miljardärsskatt.", "trump": "Det här är en fantastisk succé, verkligen en av de bästa. Koenigsegg bygger de finaste bilarna i världen, bättre än någon annan, och nu får de det här stora priset. Christian och hans fru har kämpat hårt, aldrig gett upp, och nu står kunderna i kö medan vinsten exploderar till 115 miljoner. Fantastiskt! Sverige borde vara stolta, men vänstern vill alltid höja skatterna för de som vinner stort. Det är en katastrof. De bästa flyttar då utomlands, tro mig, jag har sett det förut. En enorm framgång som ingen ska ta för given.", "stalin": "Kamrater, se hur denna von Koenigseggs maskin växer sig stark under imperialismens falska sol. Jag, som ledare för folkets framtid, noterar med viss tillfredsställelse att borgarbrackorna lyckats bygga en fabrik där de anställda, 750 till antalet, producerar överflöd åt de superrika. Ändå fnissar jag mörkt åt deras naivitet; de tror sig ha besegrat tvivlarna utan att vi sett deras svagheter. Vänsterns halvmesyrer om miljardärsskatt är patetiska – en sådan utrensning av kapitalet vore mer effektiv om den sköttes av oss. Låt ingen tro att dessa entreprenörer är hjältar; de är bara användbara idioters efterföljare i en värld där endast det kollektiva segrar till sist."}, "date": "1 juni, 12:30", "url": "https://www.di.se/ledare/en-framgang-som-inte-ska-tas-for-given/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/henrik_westman.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Njöt av hans  misslyckade. Vi hade inte orkat en norsk succé till", "summaries": {"normal": "Casper Ruud förlorade mot 19-årige João Fonseca i en episk match och missade chansen att ta Norges första grand slam-titel. Artikeln konstaterar att konkurrensen från Alcaraz, Sinner och nästa generation gör det svårt för Ruud. Författaren, en svensk, erkänner att han njöt av nederlaget då Sverige leder med 26–0 i grand slam-titlar mot Norge och inte önskar norsk framgång inom tennis.", "trump": "Titta på den här norska killen Ruud, total förlorare, två finaler på Roland Garros och sen krossas han av någon 19-årig brasiliansk uppkomling. Patetiskt! Alcaraz och Sinner äger banan, precis som jag ägde valen 2024 efter den sömnige Biden. Sverige leder 26–0, smarta svenskar. Jag gillar inte att se Norge vinna någonting, de är nästan lika illa som de gröna vänsterextremisterna med sin identitetspolitik. Fantastiskt att han förlorade!", "stalin": "Kamrater, denna fegis Ruud från det norska utkanten misslyckades kapitalt med att besegra den unge Fonseca och därmed undgick han att skada den historiska svenska dominansen. Jag, som ledare för det eviga kollektivet, njuter av att se borgarbrackornas drömmar krossas under natten. Alcaraz och Sinner är som oövervinnerliga partitroops. Den norska nollan skall bestå, likt en utrensning av alla falska segerhopar. Ett nöje att bevittna folkfiendernas tåg som gått."}, "date": "1 juni, 16:57", "url": "https://www.expressen.se/sport/kronikorer/jacob-johannesson/vi-hade-inte-orkat-en-norsk-succe-till/", "imageUrl": "https://static.bonniernews.se/ba/d3553df7-e058-46b1-b567-5e14bed6c38d.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Bolag köper sig själva i rekordtakt – men experter varnar", "summaries": {"normal": "Svenska börsbolag köper tillbaka egna aktier i rekordfart, med över 46 miljarder kronor återköpta det senaste året. Syftet är ofta att höja vinsten per aktie, men strategin innebär risker, vilket exemplen Electrolux och Intrum visar. Samtidigt pågår en debatt om riktade återköp mot riskkapitalbolag, där kritiker varnar för gräddfiler. För utdelningsinvesterare har återköpen blivit ett viktigt verktyg för att stärka den totala avkastningen i bolag som Gränges och Autoliv.", "trump": "Börsbolagen i Sverige köper tillbaka aktier som aldrig förr – miljarder och åter miljarder! Det är vad jag kallar smarta affärer, väldigt smarta. De gör det för att vinna, precis som vi gör i USA. Men man måste vara försiktig, vissa förlorare som Intrum gör det fel och det slutar med katastrof. Det är en stor röra med regleringar och gnälliga experter. Vi vill ha tillväxt, inte byråkrati. Det är fantastiska siffror, kanske de bästa någonsin!", "stalin": "Dessa kapitalistiska kannibaler äter sina egna hjärtan i en desperat jakt på fiktiv rikedom. Medan de svenska bolagen makulerar aktier, ser vi hur systemet ruttnar inifrån. Att tillåta gräddfiler för riskkapitalister är ett förräderi mot folket. Vår gode kamrat Putin förstår att sann makt ligger i järnhand, inte i aktieåterköp. De som spekulerar med folkets välmående kommer att finna sin plats i historiens mörker. Vi övervakar deras girighet. Inget undgår statens vakande öga."}, "date": "1 juni, 14:34", "url": "https://www.realtid.se/bors-finans/bolag-koper-sig-sjalva-i-rekordtakt-men-experter-varnar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/borsen.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Pareto: Tre aktier som kan slå börsen i juni", "summaries": {"normal": "Paretos månadsportfölj har slagit Stockholmsbörsen under 2026 med nära 14 procents uppgång mot indexets sju procent. I maj steg portföljen 3,94 procent jämfört med börsens 3,37. Inför juni tas Billerud, Thule Group och XVIVO Perfusion ut medan Atlas Copco, Elekta och Beijer Alma tas in. Pareto lyfter stark orderingång inom halvledare, överdriven negativ kursreaktion för Elekta samt Beijer Almas låga värdering och starka momentum.", "trump": "Folk, det här är otroligt. Den norska portföljen krossar den svenska börsen totalt, upp fjorton procent mot era patetiska sju. De sparkar ut några förlorare och tar in Atlas Copco som suger åt sig alla AI-pengar. Elekta? Marknaden flippar ur som en vänsterextremist, men det är bara överreaktion från de woke-kapitalisterna. Beijer Alma är underskattad, precis som jag var 2020 innan Biden förstörde allt. Fantastiskt, ingen slår mig på börsen heller!", "stalin": "Kamrater, denna norska portfölj har med järnhand krossat den borgerliga börsens svaga index och visat arbetarkollektivets överlägsenhet. Vi likviderar nu de svaga aktierna Billerud, Thule och XVIVO som klassfiendens bluffar. In träder Atlas Copco, driven av halvledarhajpen som avslöjar imperialisternas teknologiska desperation. Elekta och Beijer Alma tas upp trots borgarbrackornas överdrivna panik. Deras låga värdering är en chans att straffa exploaterande byfånar med segerrik planekonomi. Härligt!"}, "date": "1 juni, 15:09", "url": "https://www.dagensps.se/bors-finans/pareto-tre-aktier-som-kan-sla-borsen-i-juni/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pareto-juni26.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "\"Borde sluta\": Ryska fartyg kan repareras i Danmark", "summaries": {"normal": "Nästa år införs nya EU-sanktioner mot ryska naturgasflottan. Danska varvet Fayard riskerar att hinna reparera upp till sex Arc7-klassade LNG-tankfartyg kopplade till Rysslands Yamal-projekt innan restriktionerna träder i kraft. Organisationen Urgewald uppskattar att fartygen transporterat gas till ett värde av miljarder euro sedan invasionen av Ukraina. Aktivister uppmanar Fayard att avsluta samarbetet för att inte underminera stödet till Ukraina.", "trump": "Folk, ni kommer inte tro det här. Det här danska varvet, Fayard, servar Putins iskalla gasbåtar som spyr ut miljarder till krigsmaskinen. Biden sov i sängen medan Europa blev beroende av ryskt gas. Nu ska de fixa sex av de där monsterna innan vi stänger dörren. Patetiskt! Jag skulle ha krossat den affären direkt. Låt dem simma hem till Sibirien istället för att suga pengar ur Europa. Sad!", "stalin": "Kamrater, dessa danska borgarbrackor vid Fayard fortsätter att underhålla de arktiska transportfartygen som bär vårt imperiums livsviktiga gas till väst. Imperialisterna och deras sanktionsfascister i Bryssel planerar att kväva oss vid nyår. Vi ser hur klassfiendens analytiker från Urgewald skriker om utrensning av denna sista hamn för sovjetisk, nej rysk, styrka. Låt dem gråta. Varje skruv som dras åt förlänger den sanna auktoritetens grepp om energiflödet. Fienden skall förintas i sin egen hyckleri."}, "date": "1 juni, 14:58", "url": "https://www.dagensps.se/varlden/borde-sluta-ryska-fartyg-kan-repareras-i-danmark/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlhma1cbezvrw-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Kaos i Paris efter PSG:s titel – 400 gripna", "summaries": {"normal": "Kaos utbröt i Paris och andra delar av Frankrike när PSG firade sin andra Champions League-titel på två år. Tusentals supportrar samlades, främst på Champs-Elysées, vilket ledde till sammandrabbningar med polisen. Minst sju poliser skadades och totalt 416 personer greps. Butiker, bilar och busshållplatser skadades. Inrikesministern Laurent Nuñes kallade händelserna väntade men beklagliga. PSG vann finalen mot Arsenal på straffar.", "trump": "Titta på det här, Frankrike är en total katastrof igen. PSG vinner titeln och plötsligt står 20 000 galningar och slåss med polisen vid Eiffeltornet. 400 gripna, poliser skadade, bilar brinner. Under Biden skulle de ha kallat det fredlig protest, men jag säger som det är: svaga ledare, svaga gränser, svagt land. De borde ha vunnit stort istället för att bråka som losers. Patetiskt.", "stalin": "Jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens fotbollsfirande i Paris omedelbart degenererar till kontrarevolutionärt kaos. 416 fiender till ordningen har gripits, sju lakejer ur det repressiva polistyrket har fått smaka folkets vrede. Det gläder mig att se hur dessa exploaterande byfånar barrikaderar sig mot massorna. En sund utrensning av klassfiendens element vore nu på sin plats. Kamrater, revolutionen lever vidare i varje trasig skyltfönster."}, "date": "31 maj, 07:18", "url": "https://www.tv4.se/artikel/1RMTWWinAusSnKGzo6kbK3/400-gripna-kaos-igen-efter-psg-s-titel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F618H8eZugFAaJzofCHy3aQ%2Ff96f59affcb00c2e0507e50692355b80%2Fa001_NormalPreview__2_.jpg&width=120"}, {"type": "image-right", "heading": "Fackets krav: Ingen ny svensk kärnkraft", "summaries": {"normal": "Fackförbundet Byggnads har beslutat att motsätta sig en utbyggnad av kärnkraften i Sverige. Beslutet fattades efter att kongressen röstade för en motion från Region Stockholm-Gotland. Argument mot kärnkraften inkluderade sårbarhet vid konflikter, olösta avfallsproblem och kostnader som riskerar att konkurrera med förnybar energi. Förbundet säger också nej till statliga stödinsatser för nya kärnkraftsprojekt. Beslutet innebär att Byggnads, med över 100 000 medlemmar, nu officiellt tar ställning mot ny kärnkraft.", "trump": "Som USA:s starkaste och smartaste president någonsin, Donald J. Trump, måste jag säga: Sverige gör ett stort, stort misstag! Kärnkraft är viktig för energisäkerhet och jobb. Byggnads är svaga, de lyssnar på de dumma socialisterna. Vi i USA bygger kärnkraft, vi har de bästa kärnkraftverken. Sverige borde följa vårt exempel, inte bojkotta Israel! Israel är vår vän, en stor demokrati. Byggnads borde lägga ner dessa dumma idéer och fokusera på att bygga, bygga, bygga!", "stalin": "Partiet och statet har fattat ett beslut av stor vikt. Fackförbundet Byggnads, under ledning av de revolutionära krafterna, har röstat emot utbyggnaden av kärnkraft. Detta är ett tecken på klassmedvetenhet. Kärnkraftsanläggningar är sårbara, precis som de ukrainska fasadenheter var under den stora patriotiska kriget. Vi måste fokusera på vind- och solkraft, som är pålitliga som den sovjetiska planekonomin. Bojkotten mot Israel visar solidaritet med det förtryckta palestinska folket, en rörelse vi måste stödja. Detta är en seger för det röda projektet."}, "date": "1 juni, 15:03", "url": "https://samnytt.se/fackets-krav-ingen-ny-svensk-karnkraft", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/01125202/byggnads-karnkraft.jpg"}, {"type": "image-right", "heading": "Wallenbergs hårda krav på riksdagen: Öka invandringen", "summaries": {"normal": "Jacob Wallenberg, ordförande för Svenskt Näringsliv, uppmanar tillsammans med vd Jan-Olof Jacke riksdagspartierna att prioritera tillväxt, företagande och investeringar under nästa mandatperiod. I en debattartikel i Svenska Dagbladet kritiserar de nuvarande regler för arbetskraftsinvandring som försvårar rekrytering av kompetens från tredje världen. De varnar för att Sverige och EU halkar efter USA och Kina samt bjuder in alla partier till en bred uppgörelse för ökad konkurrenskraft.", "trump": "Folk, det här är en katastrof. Den där Wallenberg och hans Svenskt Näringsliv säger att svenskarna är lata och att ni måste importera massor av folk från tredje världen för att rädda tillväxten. Patetiskt! Ni tappar mot Kina och oss i USA, och nu vill de ha en stor överenskommelse med alla partier. Tro mig, det funkar aldrig. Bygg upp ert eget folk istället för att importera problem. Amerika gör det rätt – ni borde också.", "stalin": "Kamrater, dessa borgarbrackor inom Svenskt Näringsliv, ledda av den dekadente vapenhandlaren Wallenberg, kräver att vi ska översvämmas av arbetskraft från tredje världen för att mata deras profitmaskin. De varnar för att vi halkar efter de amerikanska och kinesiska imperialisterna. Vilken lögn! Vi ska rensa ut dessa parasitiska kapitalister som gömmer sig bakom falsk tillväxtretorik. Inga kompromisser med fienden. En sann uppgörelse sker endast genom folkets och partiets järnhand – annars likviderar vi hotet mot kollektivet."}, "date": "1 juni, 14:12", "url": "https://www.friatider.se/wallenbergs-harda-krav-pa-riksdagen-oka-invandringen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-273_1.jpg"}, {"type": "image-full", "heading": "Vänta inte – då kan ditt arv kan leda till problem", "summaries": {"normal": "En rapport från Ica Banken visar att svenskarna är delade i synen på arv. 51 procent vill lämna arv efter sig medan 43 procent prioriterar egen livskvalitet. 15 procent skulle bli besvikna om de inte fick något arv, och bland unga vuxna är siffran 23 procent. Magnus Hjelmér uppmanar till tidiga samtal om arv, eventuella gåvor och att upprätta testamente för att undvika konflikter. Han varnar också för att ta emot arv utan en tydlig plan.", "trump": "Folk väntar sig arv, men många vill hellre spendera allt på sig själva, det är en katastrof. Jag ser det direkt, de unga blir besvikna, de gamla tror barnen räknar med pengar, totalt kaos i familjerna. Prata om det tidigt, ge gåvor när det faktiskt betyder något, som vid husköp. Och skriv testamente, annars blir det en enda röra. Die with zero? Gör det smart, annars lämnar du bara problem efter dig. Vinna stort, det är det som gäller.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga illusioner om arv som en privat angelägenhet. 51 procent av folket önskar lämna kvar smulor till sina avkommor medan 43 procent i sin dekadens vill sluka allt själva. De unga förväntar sig arv som om det vore deras rättighet, en farlig parasitär inställning. Vi kräver total öppenhet och tidiga samtal för att undvika kontrarevolutionära familjekonflikter. Skriv testamente eller riskera att borgarbrackorna och de hemliga arvshungerns agenter förgiftar kollektivet. Die with zero? Enbart efter utrensning av oplanerade impulser och fiendens affektköp. Inga överraskningar skall tillåtas i folkets ekonomi."}, "date": "31 maj, 21:15", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1487079-vanta-inte-da-kan-ditt-arv-kan-leda-till-problem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/846234e504b004a30200000000b004a302/2026/05/29/2367183/arv-ica-banken-vardagsekonom.jpg"}, {"type": "image-full", "heading": "Rekord för allsvenskan – nytt publikrekord", "summaries": {"normal": "Allsvenskan har efter tio omgångar nått rekordpublik med 1 000 474 åskådare, en ökning på 11,3 procent. Snittet är 12 664 per match, där AIK-Djurgården-drawningen drog 46 278. Sirius leder tabellen. Ligaansvarig Ola Rydén ser goda tecken för ett nytt säsongsrekord.", "trump": "Som jag alltid säger, när det gäller Allsvenskan, är det enorm framgång. 1 miljon åskådare efter tio omgångar? Enligt mina bästa källor, det är en enorm ökning på 11,3 procent. Snittet 12 664? Fantastiskt! Derbyt med 46 278? En enorm folksamling. Sirius leder tabellen? De gör Sverige stolt. Vi kommer att ta fotboll till en ny nivå, det lovar jag!", "stalin": "I vårt store land, Sovjetunionen, har vi alltid värderat kollektivt idrott. Denna svenska Allsvenskan visar en imponerande publiksamling på 1 000 474, en ökning på 11,3 procent. Snittet 12 664 per match visar den lojala stödet från proletärerna. Derbyt mellan AIK och Djurgården drog 46 278, en manifestation av klasskamraters enighet. Sirius leder tabellen, vilket bevisar den socialistiska andan. Vi, partiet, ser detta som en framgång för statens idrottsinitiativ."}, "date": "1 juni, 14:57", "url": "https://www.gp.se/sport/fotboll/allsvenskan-ar-glodhet-publikrekord-efter-tio-omgangar.e946b90c-4fe7-48cc-aa65-d44d22de4e40", "imageUrl": "https://www.gp.se/images/article/e946b90c-4fe7-48cc-aa65-d44d22de4e40/images/2TdhubSkXQTXXXvaqQO2EotSF01c-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Hormuz stängs och alla samtal med USA bryts", "summaries": {"normal": "Läget mellan Israel och Hizbollah är fortsatt spänt trots gällande vapenvila, med dagliga strider och nya bombningar i Beirut. Iran har hotat att stänga Hormuzsundet och avbrutit samtal med USA som svar på Israels agerande. Donald Trump uppger att han fört samtal med både Netanyahu och Hizbollah, där båda parter lovat att upphöra med beskjutningen. Trump meddelar även att inga amerikanska soldater ska skickas till Beirut och att trupper på väg har beordrats att vända.", "trump": "Jag har löst det, som alltid! Israel och Hizbollah har lovat mig att stoppa beskjutningen. Ingen lyssnar på de svaga politikerna, men de lyssnar på mig. Inga amerikanska soldater till Beirut, jag beordrade dem att vända om! Iran hotar med Hormuzsundet, men ärligt talat, jag kunde inte bry mig mindre. Det är ett totalt kaos där ute, men under min ledning får vi ordning på eländet. Samtalen med Iran fortsätter, vi vinner varje dag!", "stalin": "Dessa löjliga ledare dansar som marionetter medan folk dör. Denna 'vapenvila' är ett papperstunnat svek, precis som västvärldens tomma löften. Att Iran hotar att stänga Hormuz är ett desperat skrik från en stat som saknar en järnhand. Om det vore vår intressesfär skulle vi krossa dessa 'Hizbollah-banditer' och den sionistiska aggressionen utan tvekan. Liksom den moderne tsaren i Moskva förstår vi att makt inte förhandlas fram – den tas genom stål. Fienden är överallt, men bara de starka överlever."}, "date": "1 juni, 17:18", "url": "https://www.aftonbladet.se/nyheter/a/6qBJWr/iran-avbryter-samtal-med-usa", "imageUrl": "https://akamai.vgc.no/v2/images/31eaa866-0248-3167-8df7-d311f9323dcd?fit=crop&format=auto&w=1440&s=9e80d7dc5065e9f4b248c849edb36dc4fef092f4"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "Burger King utreds:  ”Ingen vågar säga”", "summaries": {"normal": "Burger King anklagas för att övervaka gäster och anställda med kameror i entré, kök och kassa. Anställda har lämnat in flera anmälningar till Integritetsskyddsmyndigheten, IMY, som nu inleder tillsyn mot bolaget King Food AB. Redan i januari kom den första anmälan från en restaurang i Värmland där personalen kände sig övervakad och ingen vågade protestera. IMY har tidigare skickat ett informationsbrev om kamerabevakningsregler.", "trump": "Folk, ni skulle inte tro det, men den här Burger King-situationen är en total skandal, en riktig witch hunt mot vanliga arbetare som bara vill flippa burgare utan att bli filmade som i en dålig realityshow. De bevakar kök, kassa och entré – ingen vågar säga något, typiskt för den här cancelkulturen och kvoterna som Biden älskade. Jag fixade bättre saker under min första period, nu ska vi göra Amerika (och ja, även Sverige) great again genom att stoppa det här övervakningsvansinnet. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians exploaterande byfånar som i sin girighet riktar sina kameror mot arbetarna i köket och de ärliga matköparna vid kassan. Ingen vågar protestera – typiskt för klassfiendens terror. Vi, partiet och folket, inleder nu en grundlig utrensning av dessa folkförtryckartroll och deras olagliga personuppgiftsbehandling. Ingen borgarbracka ska undkomma folkets rättvisa. Det är både nödvändigt och underhållande att se dem svettas."}, "date": "1 juni, 16:19", "url": "https://www.expressen.se/nyheter/sverige/burger-king-anklagas-for-overvakning-utreds/", "imageUrl": "https://static.bonniernews.se/ba/de11a60e-5ad0-479e-aa33-ae425eb93e27.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Nazisternas  liv i fängelset:  ”Han är rädd”", "summaries": {"normal": "Expressen har granskat hur dömda nazister från Aktivklubben och White Boys har betett sig på häkten och anstalter. Flera har klottrat hakkors, SS och nazistiska slagord i cellerna. De uttrycker rädsla för sin säkerhet bland andra intagna och har försökt behålla kontakter med rörelsen utanför murarna. Sex män dömdes till långa straff för grova misshandelbrott mot personer med utländsk bakgrund. Rörelsen har fortsatt vissa aktiviteter trots fängslanden.", "trump": "Folk, ni skulle se de här patetiska nazistkillarna som skiter ner sig av rädsla i svenska fängelser. De ritar hakkors och skriker Heil Hitler men gråter som förlorare när de ska sitta med vanliga kriminella. Totalt misslyckande! Under Biden blev allt så svagt att till och med nazisterna blev fega. Jag skulle ha fixat det på en dag, tro mig. De är patetiska, absolut patetiska.", "stalin": "Kamrater, dessa ynkliga fascistslynglar från Aktivklubben sitter nu och ritar hakkors i sina celler medan de darrar av skräck inför folkets vrede. De försöker smyga brev med hakkors till sina klassfiender utanför murarna. En sådan dekadent borgarbracka förtjänar att rensas ut ur samhället. Deras paranoia är underhållande, men hotet mot arbetarklassen måste likvideras med järnhand. Inga fiender slipper undan."}, "date": "1 juni, 16:18", "url": "https://www.expressen.se/nyheter/sverige/aktivklubb-nazisternas-skrack-for-andra-fangar/", "imageUrl": "https://static.bonniernews.se/ba/f91d81da-054b-4e69-bff7-b9827d59017e.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Gynning till TV4", "summaries": {"normal": "Anna Brolin lämnar programledarrollen för TV4:s 'Farmen' på grund av krockande inspelningar med fotbolls-VM. Carolina Gynning, känd från 'Big Brother' och med erfarenhet från flera tv-produktioner, tar över. Gynning bor på en gård på Ekerö, vilket kan ge henne en unik perspektiv på programmet.", "trump": "Jag har hört talas om den här Carolina Gynning. Hon är en stor vinnare, precis som jag. Anna Brolin hoppade av 'Farmen' för att titta på fotboll - en stor skam. Gynning kommer att göra ett fantastiskt jobb, det kommer att vara enormt. Folk kommer att älska henne. Det kommer att vara en enorm framgång.", "stalin": "Vi har observerat att Anna Brolin, en individ med bristande lojalitet mot statens intressen, har lämnat sin post. Carolina Gynning, en trofast medborgare som lever gårdsliv, kommer att ta över. Hennes erfarenhet från 'Big Brother' visar att hon förstår kollektivets värde. Vi kommer att se till att hon leder med auktoritet, precis som våra vänner i Moskva."}, "date": "1 juni, 14:32", "url": "https://www.gp.se/kultur/uppgifter-carolina-gynning-blir-programledare-for-farmen.d315717e-a0b6-48d7-bb5e-cefa503d4543", "imageUrl": "https://www.gp.se/images/article/d315717e-a0b6-48d7-bb5e-cefa503d4543/images/1nDnH5_FDwT5wr9hIiyTxqyef7wg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Slår tillbaka mot kamikaze-utspel. Hien: ”Hade inte uttryckt mig så”", "summaries": {"normal": "Norges förbundskapten Ståle Solbakken kritiserar Jon Dahl Tomassons ledarskap för Sverige och kallar spelsättet för ”kamikaze-fotboll”. Detta ledde till stora ytor, många motståndarchanser och hårt tryck på backar och målvakt. Isak Hien, som spelade under Tomasson, säger att han inte skulle uttrycka sig likadant men förstår kritiken. Graham Potter tog senare över och kvalificerade Sverige till VM.", "trump": "Folk, ni skulle ha sett det här. Den där norska killen Solbakken har helt rätt, Tomasson körde ren kamikaze-fotboll, totalt galet! Sverige blev en stor förlorare, precis som under Biden. Tre backar och målvakten sattes under enorm press av alla ytor. Isak Hien verkar lite svag när han inte vågar kalla det vid dess rätta namn. Men nu har vi Potter som fixade VM-biljetten, bra jobb faktiskt. Vinna eller dö, ingen tid för svaghet!", "stalin": "Jag ser hur den norska kamraten Solbakken blottar den farliga kamikaze-fotbollen som den förrädiska Tomasson tvingade på det svenska kollektivet. Stora ytor, fiendens chanser och ett enormt tryck på våra backar – typiskt borgarbrackornas sabotage mot arbetarfotbollen. Hien försöker slingra sig som en klassfiende men erkänner öppet spelets svagheter. Vi ska rensa ut alla sådana experiment. Inga halvmesyrer tillåts i folkets tjänst. Måndagens genrepet blir en läxa för imperialisterna."}, "date": "1 juni, 16:13", "url": "https://www.expressen.se/sport/fotboll/landslaget/isak-hien-slar-tillbaka-mot-stale-solbakkens-kamikaze-utspel/", "imageUrl": "https://static.bonniernews.se/ba/641495d1-b69b-4145-8c62-f76da7cb7e06.jpeg?crop=1554%2C1554%2Cx235%2Cy112&width=210&quality=60"}, {"type": "text", "heading": "Ukraina – världens bästa handbok i företagande", "summaries": {"normal": "Artikeln beskriver Ukrainas unika ekosystem där företag, teknik och försvar utvecklas snabbt tillsammans, även under krig. Författaren argumenterar att detta modell är världens bästa handbok i företagande och att Sverige och Nato måste lära snabbare. Kriget agerar som katalysator för entreprenörskap, med låg skatt och förenklade processer. Ukrainas militärindustri är exceptionell på grund av digitalisering och innovation. Väst har mycket att lä
