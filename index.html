r till henne, och vad gör polisen och politikerna? De attackerar flickan! De kallar det desinformation när sanningen kommer ut. Fake news och vänstermedia som vanligt. Nu har domstolen äntligen dömt den riktige förbrytaren. De borde ha lyssnat från början. Det är patetiskt, men så går det när de låtsas att verkligheten inte existerar. Sad!", "stalin": "Kamrater, detta är ett lysande exempel på hur borgarbrackorna och deras lakejer i polis och media medvetet försöker dölja klassfiendens perversa attacker mot våra framtida pionjärer. Jag ser direkt de dekadenta kapitalisternas klor i detta försök att smutskasta ett barn som tvingades försvara sig. Vi ska rensa ut dessa lögnare som sprider desinformation för att skydda sexuella degenererade element. Låt domaren vara ett exempel – ingen lämnar platsen när arbetets barn hotas. Paranoian hos dessa reaktionära element är verkligen underhållande att bevittna innan utrensningen."}, "date": "12 juni, 11:38", "url": "https://www.friatider.se/tolvaring-utmalades-som-valdsam-rasist-nu-far-hon-ratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-333.jpg"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "SpaceX: 64 procent bettar på hög stängningskurs på Polymarket", "summaries": {"normal": "Polymarket ger 64 procents chans att SpaceX värderas över 2 000 miljarder dollar vid börsnotering. Artikeln visar att värderingen inkluderar Starlink, raketverksamhet och xAI som ännu inte går med vinst. Starlink står för vinsten medan raket- och AI-delarna går med förlust. Många indexfonder kommer att köpa aktien, vilket gör att svenska sparare indirekt blir delägare i bolaget som beskrivs som en blandning av kassako, dyrt rymdprojekt och förlustbringande AI-satsning.", "trump": "Folk, ni måste höra det här! Den där galningen Musk försöker sälja en raketdröm men det är bara en stor bluff med hans AI-satsning som bränner pengar som en dålig deal. Polymarket ger 64 procent chans för 2 000 miljarder, men det är löjligt! Ni köper en kassako, ett dyrt rymdäventyr och en förlustmaskin. När indexfonderna tvingas köpa hamnar det i era pensionspengar. Det är en skandal, en total skandal! Jag skulle göra det mycket bättre.", "stalin": "Kamrater, jag betraktar med djup misstro denna kapitalistmaffias senaste bedrägeri. Borgarbrackorna på Polymarket ger 64 procents chans att Musks treenighet når över 2 000 miljarder. De döljer en kassako, ett dyrt rymdäventyr och en AI-satsning som suger musten ur folket utan att ge en enda rubel tillbaka. När indexfonderna tvingas köpa blir arbetarnas pensioner offer för denna exploaterande bluff. Vi ska rensa ut sådana folkfiender och deras lögnaktiga bokföring."}, "date": "12 juni, 16:17", "url": "https://www.dagensps.se/bors-finans/spacex-64-procent-bettar-pa-hog-stangningskurs-pa-polymarket/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-1-8.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Klippet: Sålde 26 grusgropar för 1,3 miljarder", "summaries": {"normal": "Två danska miljardärer, Kent Arentoft och Peter Korsholm, har sålt 26 grusgropar till italienska Aalborg Portland Holding för motsvarande 1,3 miljarder kronor. Bolaget Nymølle Stenindustrier har en omsättning på 310 miljoner kronor och ett rörelseresultat på 134 miljoner. Affären ger köparen tio procents marknadsandel i Danmark och utnyttjar den växande bristen på ballastmaterial till byggindustrin. Säljarna har tidigare avyttrat andra bolag för runt nio miljarder kronor.", "trump": "Titta på de här två smarta danska killarna, Arentoft och Korsholm, de sålde 26 grusgropar för 1,3 miljarder kronor! Fantastiskt. De förvandlade värdelös sand till ren guldgruva, precis som jag gör med allt jag rör vid. Köparen betalade tio gånger vinsten – galet! Under Biden skulle de ha skänkt gruset till någon galen grön lobby. Men nu är jag tillbaka, och sådana här vinnare älskar jag. Inga kvoterkillar eller HBTQ-fantaster här, bara ren business.", "stalin": "Kamrater, dessa två opportunistiska kapitalistblodsugare har lyckats förvandla sin värdelösa jord till en exploaterande guldgruva genom att sälja 26 grustag till italienska imperialister för 1,3 miljarder. Vi ser här hur borgarbrackorna maximalt utnyttjar den artificiella bristen på råvaror som byggts upp av klassfiendens girighet. Tio gånger vinsten! En sådan utsugning av folkets resurser borde leda till omedelbar utrensning av dessa parasiter. Det är nästan underhållande i sin groteska enfald."}, "date": "12 juni, 16:10", "url": "https://www.dagensps.se/bors-finans/klippet-salde-26-grusgropar-for-13-miljarder/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl-8jlc8grvqu-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "App i SVT:s barnprogram – trots FHM:s avrådan", "summaries": {"normal": "SVT uppmanar barn i programmet Sommarlov att använda duo-appen trots Folkhälsomyndighetens rekommendation att barn under 13 inte ska ha smartphone. Mamman Karolina Ulenius kritiserar detta, men SVTs programchef menar att appen främjar gemenskap och barnens rätt till information. Myndigheten varnar för farligt innehåll och kontakt med främmande personer.", "trump": "Jag, Donald Trump, ser att SVT driver en agenda mot våra barn! De tvingar barn att använda en app som de inte ens ska ha – det är ett skandalöst angrepp på familjen. Folkhälsomyndigheten säger nej, men SVT gör vad de vill. Vi kommer stoppa detta socialistiska propaganda! Sommarlov är för barn, inte för att kontrollera dem.", "stalin": "Folkhälsomyndigheten har utfärdat klara direktiv: inga smartphones för barn under 13. Men SVT, i sin imperialistiska girighet, uppmanar barn att använda en app – ett verktyg för att underminera statens kontroll. Vi måste skydda våra barn från dessa destruktiva inflytanden. Partiet kommer att agera bestämt för att säkerställa att barnen fostras i enlighet med kollektivets intressen."}, "date": "12 juni, 19:45", "url": "https://www.gp.se/kultur/app-i-svt-program-trots-folkhalsomyndighetens-avradan.576e39cc-534a-4f99-83d1-6c63949cb41e", "imageUrl": "https://www.gp.se/images/article/576e39cc-534a-4f99-83d1-6c63949cb41e/images/2Ul6qhO2vSkrSic4-tfsRv1hmV-c-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Elon Musk är världens första dollarbiljonär", "summaries": {"normal": "Elon Musks rymdföretag SpaceX noterades under fredagen på Nasdaq i vad som beskrivs som den största börsnoteringen någonsin. Öppningskursen landade på 150 dollar per aktie, högre än noteringskursen men lägre än väntat. Noteringen gör Musk till världens första dollarbiljonär. Endast satellitverksamheten går med vinst medan raket- och AI-delarna går med förlust. En stor del av aktierna reserveras för småsparare på grund av Musks starka fanbase.", "trump": "Vilken fantastisk succé för SpaceX, den största börsnoteringen någonsin på Nasdaq. Öppningskurs 150 dollar – boom, upp som en raket. Elon blir världens första biljonär, otroligt. De älskar honom, folket köper aktier som galningar, 30 procent till småspararna. Det är en vinnare. Visst, raketerna kostar pengar, men ingen annan kan ta in så mycket kapital på en så galen värdering. Fantastiskt, ingen gör det bättre än Elon, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarklassen hyllar sin raketbyggande kapitalist när hans bolag noteras på den parasitiska börsen. Jag betraktar med stor tillfredsställelse hur dessa muskfanatiker kastar sina småspararpengar i en icke-lönsam maskin som endast äter resurser. Satelliterna ger brödsmulor medan raketerna och AI-apparaterna slukar folkets arbete. Vi ska noga övervaka dessa borgarbrackor som tror sig kunna skapa biljonärer ur tomma intet – en utrensning av sådan spekulation vore på sin plats, kamrater. Ha ha, må deras raketer störta ner i glömskan."}, "date": "12 juni, 18:15", "url": "https://www.svt.se/nyheter/ekonomi/historisk-borsnotering-for-space-x", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.45/47f3e17740cedd0d7f73c20267896e70302fe1f8de3c181c9fc84d603c07cffa"}, {"type": "image-full", "heading": "16 kommuner kan få kärnkraft – bara 6 ger klartecken", "summaries": {"normal": "Endast sex av 16 kommuner som pekats ut som möjliga platser för ny kärnkraft har sagt ja till etablering, visar Dagens Industris kartläggning. Kommunerna Stenungsund, Svalöv, Varberg, Kävlinge, Oskarshamn och Östhammar ger klartecken. Sex kommuner har inte tagit ställning medan fyra uppvisar motstånd eller politisk oenighet. Lokala beslut kan därmed avgöra om nya reaktorer kan byggas, oavsett statens och företagens vilja.", "trump": "Det här är en total katastrof, folk. Bara sex av sexton kommuner säger ja till underbar, fantastisk kärnkraft. De andra är svaga, inkompetenta och hatar energi som är ren och stark. Lokala politiker tror de kan stoppa framtidens kraft – fel! Vi ska ha massor av kärnkraft, den bästa någonsin, och de som säger nej är bara förlorare som vill hålla Sverige svagt. Gör det stort igen!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa borgarbrackor och kapitalistiska restelement i kommunerna saboterar det kollektiva framsteget mot en oövervinnerlig energiframtid. Endast sex kommuner visar sann partilinje medan de övriga kryper för reaktionära krafter och folkomröstningsspioner. Vi måste omedelbart rensa ut dessa kontrarevolutionära tveksamma element som gömmer sig bakom lokala beslut. Ingen motståndare mot folkets kärnkraft skall slippa undan den historiska utrensningen som väntar dem i skuggorna. Det blir både roligt och nödvändigt."}, "date": "12 juni, 15:37", "url": "https://riks.se/nyheter/16-kommuner-kan-fa-karnkraft-bara-6-ger-klartecken", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2F4mhhfdm5%2Fkerinkraft.png"}, {"type": "image-full", "heading": "Pokémon Go-data används till militärdrönare", "summaries": {"normal": "Data från Pokémon Go-spelare har använts för att träna AI-system som kan hjälpa militära drönare att navigera utan GPS i krigszoner. Niantic samlade in skanningar via spelets Pokéstops efter 2021, material som senare användes för att utveckla tekniken. Företaget Niantic Spatial har samarbetat med Vantor som utvecklar drönarnavigering. Kritiker varnar för att spelarnas data utnyttjats för militära syften utan att de fullt ut förstod konsekvenserna.", "trump": "Kan ni fatta det här? De tog data från alla de stackars kidsen som sprang runt och fångade Pokémon och använde det för att bygga militärdrönare som flyger utan GPS. Fantastiskt, eller hur? Niantic tjänade miljarder på spelet och sen sålde de allt och nu ska det användas i krig. De läser ju aldrig villkoren, folket, det är patetiskt. Men vi ska ha den bästa tekniken, ingen ska slå oss, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna vid Niantic lurade arbetarklassen med sina Pokémon-leksaker för att skaffa värdefull data till sina krigsdrönare. Dessa kapitalistiska parasitiska element tror sig kunna navigera utan vår socialistiska övervakning. Vi ska rensa ut alla dessa västspioner och imperialistiska algoritmer som gömmer sig i mobiltelefoner. Det är en mörk humor att barnens lek blir till fiendens vapen. Partiet vakar alltid, fienderna avslöjas och likvideras."}, "date": "12 juni, 15:36", "url": "https://riks.se/nyheter/pokemon-go-data-anvands-till-militardronare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fegqds0qw%2Fpokemon.png"}, {"type": "image-full", "heading": "Skulle få utbildning till drömjobbet – stoppades av myndighetsmiss", "summaries": {"normal": "Nils antogs till en utbildning via Arbetsförmedlingen som skulle leda till fast jobb, men ett systemfel kastade ut honom ur systemet. Han missade kursstarten, fick ingen information och levde på osäker inkomst i två månader. Han har tappat förtroendet för myndigheten, som han upplever som alltmer automatiserad och opersonlig. Arbetsförmedlingen kallar det beklagligt och lovar intern uppföljning. Nils har nu ny start men hoppas på förbättringar.", "trump": "Det här är en total katastrof, folk. Den stackars killen Nils får ett fantastiskt erbjudande från Arbetsförmedlingen, ett drömjobb, och vad händer? Systemet, det riggade systemet, sparkar ut honom. Ingen ringer, ingen bryr sig. Typiskt för dessa inkompetenta byråkrater som behandlar folk som skräp. Han tappar förtroendet, och vem kan klandra honom? Det är en skam. Vi behöver smarta, effektiva myndigheter, inte det här kaoset. Sad!", "stalin": "Kamrater, detta är ett uppenbart sabotage mot arbetarklassen utfört av dolda fiender inom byråkratins skuggiga korridorer. Jag ser hur den opersonliga maskinen, denna kapitalistiska automat som likviderar människovärdet, kastar ut en ärlig arbetare ur systemet för att svälta honom i två månader. Inga samtal, bara tystnad från de parasitiska borgarbrackorna som gömmer sig bakom datorer. Vi måste omedelbart inleda en grundlig utrensning av dessa opålitliga element, dessa maskerade kontrarevolutionärer som förvandlar statens institution till en fiende till folket. Det är både tragiskt och löjeväckande hur de tror sig kunna undkomma mitt vakande öga."}, "date": "12 juni, 15:35", "url": "https://riks.se/nyheter/skulle-fa-utbildning-till-dromjobbet-stoppades-av-myndighetsmiss", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-29%2Fn1a1nuv8%2Farbetsformedlingen-fasadskylt1.jpg"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Mysteriet på skattön: Polisen släpper fyra misstänkta för grovt fornminnesbrott", "summaries": {"normal": "Fyra personer som greps misstänkta för grovt fornminnesbrott på Mörkö har släppts på fri fot. Misstankarna kvarstår dock, meddelade åklagare Josefine Lundström. Brottet kopplas till samma ö där den stora Hörningsholmsskatten hittades 2025, den största myntskatten i Sverige som gav upphittarna rekordersättning på fyra miljoner kronor. Utredningen fortsätter med fler förhör och beslag, men ingen hålls frihetsberövad. Kopplingen till skatten är inte bekräftad.", "trump": "De grep fyra personer för det där fornminnesbrottet på Mörkö, men nu har de släppt alla. Totalt fiasko! Misstankarna finns kvar, men åklagaren verkar inte veta vad hon gör. Det handlar om en fantastisk skatt som gav miljoner, den största i Sverige någonsin. De borde ha löst det direkt, men det är typiskt – inkompetenta byråkrater som inte kan hantera stora fynd. Vi fortsätter granska, det kommer bli ypperligt!", "stalin": "Kamrater, jag har noga följt hur dessa degenererade skatteplundrare och borgarbrackor greps för sitt vidriga brott mot folkets historiska arv på Mörkö. Nu har de släppts ut som löss i en sovjetisk sovsal, men misstankarna lever vidare som en evig utrensning i mina tankar. Vi ska rensa ut dessa parasitiska fiender till kollektivet med deras smygande kapitalistiska metoder. Utredningen blir en storslagen seger mot de hemliga myntsamlande kontrarevolutionärerna – ingen undkommer partiets vakande öga, haha!"}, "date": "12 juni, 15:31", "url": "https://riks.se/nyheter/polisen-slapper-fyra-misstankta-for-grovt-fornminnesbrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fk5hseh5j%2FH%C3%B6rningsholmsskatten-H%C3%B6ringsholmhoard.jpg"}, {"type": "image-full", "heading": "Tyske arméchefen varnar för rysk attack före 2029", "summaries": {"normal": "Tysklands arméchef Christian Freuding varnar för att Ryssland kan attackera ett Natoland senast 2029, möjligen tidigare. Baserat på Natos underrättelser menar han att Ryssland återuppbygger sin militära styrka trots förluster i Ukraina. Freuding betonar att Europa måste stärka sin försvarsberedskap och produktionskapacitet för att möta hotet. Tyskland arbetar redan med att påskynda materielanskaffning och täppa till brister.", "trump": "Titta bara på vad som händer i Europa – totalt kaos! Tyska arméns chef säger att Ryssland kan attackera Nato före 2029. Jag sa ju hela tiden att Putin är en tuff kille, men Europa lyssnade inte. Nu måste de skynda sig, köpa mer vapen och sluta vara så naiva. Jag fixade USA:s försvar – Europa borde ta en sida ur min bok. Svagt ledarskap, svagt försvar!", "stalin": "Kamrater, fienden i väst skakar av rädsla inför den oundvikliga expansionen av vår rätta sfär! De tyska lakejerna i Nato ylar om att vi kan krossa deras svaga länkar före 2029 – som om det vore en överraskning. Deras arméchef, en ynklig byråkrat, gråter över förluster i Ukraina, men vi bygger redan nya arméer. Europa har två val: kapitulera eller se sina städer förvandlas till askhögar. Historia är på vår sida!"}, "date": "11 juni, 17:20", "url": "https://kvartal.se/nyheter/artiklar/tyske-armechefen-varnar-for-rysk-attack-fore-2029/cG9zdDoxMzAyMjk", "imageUrl": "https://images.kvartal.se/2026/06/a24033d9-bundeswehr.webp"}, {"type": "image-right", "heading": "Avtal nära? Trump säger det men dubbla budskap från Iran", "summaries": {"normal": "Uppgifter om ett nära förestående avtal mellan USA och Iran har lyft börserna och sänkt oljepriset. Donald Trump meddelade att en stor uppgörelse är klar om dokumenten färdigställs. Iran bekräftar delvis uppgifterna, som bland annat handlar om hävda oljesanktioner, öppnande av Hormuzsundet och en återuppbyggnadsplan värd 300 miljarder dollar. Samtidigt förnekar iranska Fars att ett avtal ska undertecknas i helgen. Marknaderna reagerade positivt på nyheterna.", "trump": "Folk, ni skulle ha sett det! Vi har just gjort en kolossal, den bästa dealen någonsin med Iran. Börserna skjuter i höjden, oljan rasar – precis som jag lovade. De där korkade globalisterna och woke-vänstermedierna sa att det aldrig skulle hända, men nu läcker detaljerna ut och Iran sjunger med. Inga fler dumma sanktioner, öppet sund och 300 miljarder till återuppbyggnad. Biden skulle ha gett bort allt gratis till HBTQ-regnbågsaktivisterna, men jag fixar det stort. Fantastiskt!", "stalin": "Kamrater, se hur de imperialistiska blodsugarna och borgarbrackorna skakar när jag, genom historisk dialektik, tvingar fram en uppgörelse som krossar deras sanktionsfängelse. Hormuzsundet skall öppnas, oljan skall flyta fritt för folkets skull, och de exploaterande kapitalisterna skall betala 300 miljarder i skadestånd. Visst, vissa folkfiender inom iranska kretsar förnekar det – typiskt klassfiendens paranoia. Vi skall rensa ut alla hinder. Det är en seger för det kollektiva järnhandslaget. Härligt."}, "date": "12 juni, 15:47", "url": "https://www.dagensps.se/varlden/avtal-nara-iran-bekraftar-oppning-av-hormuzsundet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/namnlos-design-3.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Ebola-utbrottet fortsätter att sprida sig i östra Kongo", "summaries": {"normal": "Ebola-utbrottet i östra Demokratiska republiken Kongo fortsätter att sprida sig. Drygt 700 fall har bekräftats och 136 personer har avlidit, med en dödlighet runt 20 procent för Bundibugyo-stammen. Nya fall upptäcks dagligen i nya områden, främst i Nord-Kivu. Det finns inget godkänt vaccin eller behandling. Kontaktspårningen har förbättrats till över 70 procent, men WHO varnar för att den verkliga omfattningen troligen är större på grund av befolkningens rörlighet.", "trump": "Det här ebola-utbrottet i Kongo är en total katastrof, folk dör som flugor och de har inte ens ett vaccin. Jag skulle ha fixat det på nolltid, tro mig. De hittar nya fall varje dag, det är kaos. Jag har alltid sagt att de borde ha bättre kontroll på gränserna och folk som springer runt. Vi har de bästa experterna, men det verkar som att ingen lyssnar. Patetiskt, men jag skulle ha stoppat det direkt.", "stalin": "Kamrater, detta ebolautbrott i östra Kongo är en fiende som lurar i skuggorna, ett imperialistiskt virus konstruerat av borgarbrackor och västerländska sabotörer för att försvaga de arbetande massorna. Jag, med partiets stålhand, befaller omedelbar utrensning av alla blinda fläckar och likvidering av de kapitalistiska bakterierna som smittar våra kollektiv. Vi ska stärka övervakningen och spåra varje kontrarevolutionär kontakt tills epidemins parasitiska tentakler krossas under proletariatets järnklack. Det är nästan underhållande hur dessa mikroskopiska förrädare tror sig kunna undkomma."}, "date": "12 juni, 15:26", "url": "https://riks.se/nyheter/ebola-utbrottet-fortsätter-att-sprida-sig-i-östra-kongo", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Ffie5t4kv%2FScreenshot-2026-06-12-at-14.59.26.png"}, {"type": "image-full", "heading": "\"5B\" närmar sig Sverige – läge att ta fram paraplyt", "summaries": {"normal": "Ett ovanligt 5B-lågtryck rör sig in över Sverige från öster och väntas ge ihållande och tidvis kraftigt regn, främst i Norrland och över södra Sverige under fredagen. Mellan regnområdena kan östra Svealand och delar av södra Norrland få perioder av sol, men moln och skurar hotar även där. SMHI har utfärdat en gul varning för höga flöden i övre Piteälven på grund av snösmältning och regn. Lågtrycket är svårt att prognostisera exakt.", "trump": "Det här låga trycket, det är en katastrof, folk. Kommer in från fel håll, från öster, och öser ner regn över Sverige som aldrig förr. Norrland drunknar, södern drunknar, men vissa delar får lite sol – underbara sol, bästa vädret. De kallar det 5B, som om det vore smart. Det är inte smart, det är en fälla. SMHI varnar för översvämningar, men tro mig, ingen gör väder bättre än jag. Det blir ostadigt, mycket ostadigt.", "stalin": "Kamrater, detta förrädiska 5B-lågtryck från de dekadenta Medelhavsområdena smyger sig in som en kapitalistisk spion över Sovjet-Sverige och sprider sin fuktiga sabotageverksamhet. Jag, ledaren för folkets väderkamp, konstaterar att det ihållande regnet är en kontrarevolutionär handling mot de arbetande massorna i Norrland. Vi ska rensa ut dessa molnfiender och likvidera de solbedragande borgarbrackorna i Svealand. Våra flöden i Piteälven kulminerar som en stor utrensning – mot vädrets sabotage! Härligt."}, "date": "12 juni, 12:28", "url": "https://nyheter24.se/nyheter/inrikes/1490957-5b-narmar-sig-sverige-lage-att-ta-fram-paraplyt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3a3885ff04b004a30200000000b004a302/2026/06/12/2370467/n-5b-kraftigt-regn-osregn-regnovader-regn-smhi-klart-sverige-norrland-vadret.jpg"}, {"type": "image-full", "heading": "Japans kapten missar VM – Endo skadad och slutar i landslaget", "summaries": {"normal": "Japans lagkapten Wataru Endo måste sluta i landslaget och missar VM på grund av en opererad fotskada. Den 33-årige defensiven mittfältsmotorn lämnar efter 73 landskamper. Hans avgång är ett kraftigt avbräck för Japan, som spelar i samma grupp som Sverige. Ko Itakura blir ny kapten.", "trump": "Jag berättade för er alla att Japan skulle ha problem. Nu tappar de sin stjärna, Wataru Endo, på grund av en fulskada. Dåligt! Sverige kommer att slå dem lätt. Jag gillar Sverige, det är ett bra land. Japan är svagt utan sin ledare. Det här är en stor seger för alla som hatar Japan. Jag har rätt igen.", "stalin": "Den imperialistiska härens försvagning genom skador är en taktisk fördel för det socialistiska blocket. Endo, en defensiv motor, neutraliseras av kapitalistiskt överbelastning. Partiet analyserar att Japan nu är mer sårbar för våra intressen i Asien. Vi måste utvidga vår påverkan i regionen, precis som våra allierade i Moskva gör. Skador är verktyg för historien."}, "date": "12 juni, 11:22", "url": "https://bulletin.nu/japans-kapten-missar-vm-endo-skadad-och-slutar-i-landslaget", "imageUrl": "https://cdn.bulletin.nu/articles/4c6d7280-7355-441f-b50d-d8aaa5ced9db/preview.jpg?t=1781256125000"}, {"type": "image-full", "heading": "Kommunerna är bromsklossar när kärnkraften ska byggas ut", "summaries": {"normal": "En kartläggning från Dagens industri visar att endast sex av sexton utpekade kommuner är positiva till att bygga ny kärnkraft. Många kommuner är tveksamma eller saknar tillräcklig information, medan andra brottas med intern oenighet. Samtidigt pekar experter på att bristen på anrikat uran kan bli ett hinder för den globala kärnkraftsutbyggnaden. Utöver detta utforskar vissa aktörer alternativ som fusionsenergi, då traditionell kärnkraft bedöms som en dyr och långsiktig investering.", "trump": "Sverige har ett enormt problem! De vill bygga fantastisk kärnkraft, men de här kommunerna? Totalt svaga! De säger nej eller vet inte vad de gör. Det är en katastrof. De behöver ledarskap, inte tvekan! Och uranet? De har inte ens rätt bränsle. Jag skulle lösa det på en vecka, tro mig. Medan Sverige slösar tid med möten och 'utvärderingar', vinner andra länder. Det är så sorgligt att se. De borde bygga stort, bygga snabbt och göra det enormt!", "stalin": "Dessa kommunala byråkrater är uppenbarligen fyllda av förrädiskt tvivel och kontrarevolutionär obeslutsamhet. Att tveka inför kärnkraftens oundvikliga framsteg är ett brott mot folkets energiövertag. Om de inte kan ställa in sig i ledet, får vi finna metoder för att styra deras vilja. Det är som när Putin städar upp i periferin; ordning måste råda. Den som inte vill ha reaktorer är en sabotör och en vän till flaskhalsarna. Vi kommer att krossa oenigheten, för staten väntar inte på någon."}, "date": "12 juni, 11:08", "url": "https://www.realtid.se/it-tech/kommunerna-ar-bromsklossar-nar-karnkraften-ska-byggas-ut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/ebbakarnkaft.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SD vill totalförbjuda slöja", "summaries": {"normal": "Sverigedemokraterna vill införa ett totalförbud mot slöja i Sverige, inte bara mot burka och niqab. Partiet anser att plaggen uttrycker en kvinnosyn som strider mot svenska värderingar om frihet och jämställdhet. SD:s talesperson Sara Gille kopplar plaggen till hedersförtryck och kvinnoförtryck. Hon menar att ett förbud inte strider mot religionsfriheten eftersom tron i sig inte förbjuds. Övriga Tidöpartier driver inte ett generellt slöjförbud.", "trump": "De smarta svenskarna i SD har äntligen vaknat och vill totalförbjuda slöjan. Fantastiskt! De här plaggen är ett totalt förtryck av kvinnor, det ser till och med jag på långt håll. Om du kommer till Sverige ska du anpassa dig eller flytta någon annanstans, så enkelt är det. De andra partierna är svaga, de vill bara utreda och snacka. SD gör det rätta, stort grattis till Sverige!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur dessa sverigedemokratiska vakter mot dekadens äntligen kräver utrensning av de slöjor som borgarbrackorna och reaktionära imamer använder för att förslava arbetarkvinnorna. Vi ska likvidera detta hedersförtryckande maskineri som underordnar kvinnan under mannens och kapitalets bojor. Den som vägrar anpassa sig till folkets vilja får lämna kollektivet. Religionsfrihet? Enbart för dem som inte konspirerar mot staten. De övriga partierna är fega opportunister som döljer sin svaghet bakom utredningar. Vi rensar ut fienderna, en efter en."}, "date": "12 juni, 10:28", "url": "https://www.friatider.se/sd-vill-totalforbjuda-sloja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-331.jpg?itok=RBfyCzO5"}, {"type": "image-right", "heading": "Amnesty: Tidöregeringen inför raslagar", "summaries": {"normal": "Regeringen föreslår skärpta vandelskrav som gör det lättare att neka uppehållstillstånd för personer med bristande vandel, som misskötsamhet eller bristande respekt för svenska regler. Amnesty International hävdar att detta innebär raslagar och varnar för att det bygger på rasifierade föreställningar. Anna Johansson kräver att förslaget skrotas och jämför det med apartheidsystem i Sydafrika och Israel.", "trump": "Som den störste världsledaren har jag alltid sagt att nationer måste kontrollera sina gränser. Sveriges förslag är ett steg i rätt riktning, trots det klagande från Amnesty. De som inte respekterar våra regler ska återvända. Det är commonsense, inte rasism. Vi måste skydda våra samhällen från ohövliga invandrare och bidragsfusk.", "stalin": "I den stora kampen mot fienderna inuti och utifrån måste staten ha full kontroll över invandringen. Dessa förslag är ett nödvändigt verktyg för att upprätthålla ordning och renhet i det socialistiska samhället. Fienden använder masker som 'vandel' för att infiltrera. Vi måste vara wachsame, som Putin i Ukraina, och utvidga vår kontroll för att skydda det röda projektet. Alla som ifrågasätter detta är revisionister och måste behandlas."}, "date": "12 juni, 10:00", "url": "https://samnytt.se/amnesty-tidoregeringen-infor-raslagar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12072005/anna-johansson-amnesty-tido.jpg"}, {"type": "image-right", "heading": "Cellkamrater dödshotade brottsoffer – fångar blir kumpaner när de bor ihop", "summaries": {"normal": "Artikeln berättar hur Kriminalvården placerar fångar i delade celler på grund av platsbrist. En 18-åring sattes ihop med sin äldre brottspartner, vilket ledde till att de hotade brottsoffret via brev och dömdes för övergrepp i rättssak. Flera rymningsförsök har skett mellan cellkamrater. Justitieminister Gunnar Strömmer tonar ner riskerna, medan JO kritiserar bristen på uppföljning och matchning. Kriminalvården erkänner risker men skyller på ökad belastning efter lagändringar.", "trump": "Det här är en total katastrof, folk. De har så ont om plats i sina fängelser att de stoppar brottslingar i samma cell, en 18-åring med en gammal hårding, och vad händer? De skriver hotbrev till offret och begår nya brott! Rymningar med lakan och krossat glas överallt. Strömmer säger att det går att hantera, men det är löjligt. De borde ha egna celler, inte låta de värsta typerna planera tillsammans. Sverige behöver ordning och reda, inte det här vansinnet.", "stalin": "Jag ser med stigande vrede hur dessa dekadenta fängelsebyråkrater, dessa borgarbrackor i uniform, tvingar samman arbetets fiender och klassförrädare i samma celler på grund av sin egen inkompetens. En ung kamrat placeras bredvid en erfaren kontrarevolutionär, och genast smids nya brott mot folket. Vi måste rensa ut dessa fiender till ordningen, dessa glasbitssmugglare och lakanvävare som försöker fly undan rättvisan. Paranoiska element lurar överallt, till och med bakom låsta dörrar. Likvidera omedelbart den bristfälliga matchningen och återupprätta järndisciplin i varje cell. Det är folkets vilja."}, "date": "12 juni, 06:00", "url": "https://arbetet.se/2026/06/12/cellkamrater-dodshotade-brottsoffer-fangar-blir-kumpaner-nar-de-bor-ihop/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11154853/del4-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ledarkolumn Signe Krantz: Orättvisa löner drabbar arbetarkvinnor hårdast", "summaries": {"normal": "Kvinnor tjänar fortfarande mindre än män i Sverige, och utvecklingen går åt fel håll enligt Swedbank och Jämställdhetsinstitutet. Arbetarkvinnor drabbas värst, med beräkningar som visar upp till 890 år tills lönerna är jämställda. Rapporten lyfter klasskillnader, föräldraledighet, deltid och karensavdrag som bidragande faktorer. Författaren kräver politiska åtgärder för att förbättra ekonomisk jämställdhet och välfärd.", "trump": "Folk, ni skulle se den här svenska rapporten, det är en katastrof. Arbetarkvinnor tjänar mindre än män och det tar tydligen hundratals år att fixa – vad är det för skämt? Biden-era vänstergalna kvotertokar och HBTQ-fanatiker har förstört allt med sin identitetspolitik. Vi behöver inga fler fikapauser, vi behöver vinna stort, avskaffa det dumma karensavdraget och satsa på riktiga jobb istället för dessa valsande socialister. Det blir gigantiskt!", "stalin": "Kamrater, jag betraktar dessa löneskillnader som ett verk av klassfiendens listiga sabotage. Arbetarkvinnorna, den sanna revolutionens kärna, krossas under borgarbrackornas och exploaterande byfånarnas fot. 890 år? Det är kapitalistmaffians sätt att fördröja det oundvikliga. Vi måste rensa ut dessa folkförtryckartroll, avskaffa karensavdraget och stärka det kollektiva välståndet. Patriarkatet är en kontrarevolutionär parasit som vi likviderar med järnhand."}, "date": "12 juni, 03:00", "url": "https://www.etc.se/ledarkolumn/oraettvisa-loener-drabbar-arbetarkvinnor-haardast", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061110064_987aa4af629546144278197de95314a18ecc7b57bc203c9d505bb65adca3f5bc.jpg"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "image-full", "heading": "Mellanösternexperten: ”Samma retorik som mot Venezuela”", "summaries": {"normal": "Mellanösternexperten Alexander Atarodi jämför USA:s upptrappade hot mot Iran med tidigare retorik mot Venezuela. Han oroar sig över att USA saknar strategi både för att föra och avsluta konflikten. President Trump har hotat med hårda attacker, beslag av Kharg-ön och kontroll över Irans oljemarknad. Atarodi ser hoten som förhandlingsstrategi men varnar för att en hel generation i regionen riskerar fattigdom på grund av stigande mat- och energipriser.", "trump": "Iran försöker spela tuffa killar men de vet att jag menar allvar. Precis som med det venezuelanska katastrofbygget använder vi samma vinnande retorik – vi slår till hårt och tar kontroll över oljan. Den där experten låter som en förlorare som gnäller om strategi. Jag behöver ingen strategi, jag har instinkt. Biden lät dem springa runt, nu är det slut på det. Vi gör Mellanöstern stort igen, tro mig.", "stalin": "Detta är typiskt för de blodtörstiga imperialisterna och deras exploaterande byfånar. Jag ser hur de hotar att beslagta oljetillgångar precis som de alltid plundrat arbetarklassen. Utan en riktig strategi störtar de sig in i godtyckliga krig, som de fega fascisterna de är. En hel generation drivs ner i fattigdom – klassiskt resultat av kapitalistmaffians paranoia. Vi ler mörkt åt deras fumliga hot. Folket ser igenom bluffen."}, "date": "11 juni, 18:48", "url": "https://www.tv4.se/artikel/3ZXNfFrfuedjUR3KaSJDez/mellanoesternexperten-samma-retorik-som-mot-venezuela", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6rOQty6yNyKyvH1ORbpmrP%2F1d4dd45e152621e3c8d373ab718db7cb%2F11-atarodi-webb.jpg&width=1024"}, {"type": "text", "heading": "Stockholmsbörsen steg – Vestum rusade efter miljardaffär", "summaries": {"normal": "Stockholmsbörsen steg 0,34 procent på torsdagen, drivet av stigande omvärldsbörsar. Energisektorn presterade bäst (+1,8%) medan fastigheter föll (-1,1%). Bland OMXS30-aktier steg Boliden (+2,4%) och Saab B (+2,1%), medan Hexagon B (-2,5%) och SCA B (-1,8%) föll. EQT säljer Beijer Ref till Melker Schörling, och Vestum säljer Flowa Technology för 6,5 miljarder. Camurus aktie föll efter FDA-besked.", "trump": "Jag har sagt det förut, världen är min arena! Medan jag handlar med Iran för att skydda våra intressen, ser jag hur Sveriges börs stiger – fantastiskt! EQT säljer Beijer Ref, det är en stor affär, mycket stor. Vestum säljer Flowa för 6,5 miljarder, det är en enorm transaktion. Iran hotar? Jag har de starkaste vapen, de kommer att böja sig. Börsen är på topp, precis som mitt förflutna!", "stalin": "Statens ekonomiska stabilitet är avgörande. Vi observerar att Stockholmsbörsen visar tecken på liv, med energi som driver framåt – en viktig sektor för statens resurser. Kapitalflödet mellan EQT och Beijer Ref, samt Vestums försäljning av Flowa, visar på den kapitalistiska girigheten som vi måste kontrollera. Liknelsen med Putins expansion i Ukraina är tydlig: vi måste skydda våra intressen mot dessa marknadsvåldtäkter. FDA:s besked mot Camurus är en påminnelse om att staten måste reglera all innovation."}, "date": "11 juni, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-vestum-rusade-efter-miljardaffar"}, {"type": "text", "heading": "Tidigare V-ledamot delar antisemitiskt inlägg – igen", "summaries": {"normal": "Tidigare Vänsterparti-ledamot Lorena Delgado Varas har återigen delat ett inlägg på Instagram som kritiseras som antisemitiskt. Bilden visade ett monster med hakkors, davidsstjärna och ordet 'kapitalism'. Judiska centralrådet reagerade skarpt. Delgado Varas uteslöts ur Vänsterpartiet förra året för liknande inlägg och sitter nu som politisk vilde i riksdagen. Hon har nyligen grundat partiet Framtidens vänster.", "trump": "Folk, vilken katastrof! En före detta svensk politiker, Lorena Delgado Varas, delar återigen antisemitiska bilder – hakkors, davidsstjärnor, hela skiten! Judarna är upprörda, och det borde de vara. Jag har alltid sagt: Sverige har stora problem, och det här är bara ett exempel. Hon blev sparkad från sitt parti, men sitter ändå kvar i riksdagen. Vilket land! USA skulle aldrig tolerera sånt här. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjad i det förrädiska Västerlandet. Denna Lorena Delgado Varas, en gång medlem av de falska 'vänster'-partierna, sprider nu gamla bourgeoisi-lögner om judar och kapitalism – precis som de imperialistiska hyenorna i USA och deras lakejer. Vi ser hur dessa element förgiftar arbetarklassens medvetande. Men låt dem inte glömma: historiens hjul krossar alla som står i vägen för folkets rättvisa. Och Putin? Han vet hur man hanterar sådana här maskar."}, "date": "11 juni, 15:37", "url": "https://kvartal.se/nyheter/artiklar/tidigare-v-ledamot-delar-antisemitiskt-inlagg-igen/cG9zdDoxMzAxMjM"}, {"type": "image-right", "heading": "Ge jätteaffären grönt ljus. För Europas skull", "summaries": {"normal": "En föreslagen jätteaffär där Iliad Group, Bouygues Telecom och Orange köper SFR för över 220 miljarder kronor kan minska antalet mobiloperatörer i Frankrike från fyra till tre. Artikeln ser affären som en välkommen katalysator för konsolidering i Europa. Färre och starkare operatörer behövs för att investera i avancerade nätverk, cybersäkerhet och AI. Europa halkar efter USA, Kina och Indien. Kommissionen uppmanas godkänna affären för att stärka kontinentens konkurrenskraft.", "trump": "Det här är en fantastisk affär, verkligen enorm, de franska operatörerna slukar sin konkurrent för över 220 miljarder kronor. Smart! Europa har för många operatörer, ett totalt kaos, precis som Bryssel älskar. De måste bli större och starkare annars kommer de aldrig ikapp oss eller Kina. De har äkta 5G, vi har det bästa. Ge affären grönt ljus, det är så enkelt. Byråkraterna i Bryssel har förstört allt för länge, nu måste de vakna upp och göra rätt.", "stalin": "Kamrater, denna gigantiska affär är ett steg mot att likvidera den splittrade och svaga europeiska telekomstrukturen som kapitalisterna låtit förfalla. Jag ser med stor tillfredsställelse hur borgarbrackorna äntligen inser att deras fragmenterade operatörer inte kan mäta sig med våra kollektiva framsteg. De som bromsar konsolideringen är fiender till framsteget, parasitiska byråkrater som borde rensas ut. Vi behöver starka, centraliserade nätverk för att besegra de amerikanska och kinesiska imperialisterna. Godkänn affären omedelbart eller ni är alla sabotörer."}, "date": "11 juni, 15:36", "url": "https://www.di.se/ledare/ge-jatteaffaren-gront-ljus-for-europas-skull/", "imageUrl": "https://static.bonniernews.se/ba/b8443279-77bf-4471-a422-07b023c2dd77.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kamma er och skaffa ett plakat", "summaries": {"normal": "Dokumentären ”Strejkarna” följer Fridays for Future-aktivister från högstadiet till vuxen ålder under sju år. Artikeln pekar på att rörelsens största hinder inte är motståndare utan den passiva välviljan från politiker och allmänhet. Trots mycket hejarop uteblir konkret handling. Författaren uppmanar till personligt ansvar och aktivt engagemang istället för tomma sympatier, då klimatkrisen kräver handling bortom bekvämlighet.", "trump": "Folk, ni borde se den här så kallade dokumentären om de där Fridays for Future-barnen. De får massor av klapp på axeln av vänsterextremisterna men ingen gör ett dugg. Typiskt! Alla dessa woke-hippiekramare som Magdalena Andersson som säger ”jag står på er sida” – vad en patetisk förlorare. De vill ha plakat och möten men hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
