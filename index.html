lägenheter. Belysningen framhäver arkitekturen diskret med LED-ljus. Omvandlingen följer en trend där historiska kontorsbyggnader blir bostäder, vilket sparar resurser och minskar koldioxidutsläpp.", "trump": "Titta på den där underbara Flatiron Building, den ser ut som en jävla strykjärnsbit mitt i New York och nu har de äntligen tänt upp den ordentligt efter alla år. Fantastiskt! De gör om den till lyxlägenheter istället för att riva den som de woke-liberalerna brukar vilja. Mycket bättre än Bidens tid när allt bara förföll. Vi älskar vackra byggnader, inte de där identitetspolitiska monstrositeterna de försöker kalla konst. En riktig vinnare!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna triangelformade borgarbracka från 1902 nu genomgår en nödvändig utrensning av sina kapitalistiska lager och förvandlas till bostäder för folket. Den nya belysningen lyser upp dess exploaterande silhuett som en varning till alla folkfiender. Vi ska inte riva våra historiska troféer utan omfamna dem i kollektivets tjänst. Den som motstår denna utveckling är en klassfiende som måste rensas ut med största glädje."}, "date": "9 juni, 00:36", "url": "https://www.dagensps.se/bors-finans/fastigheter/new-yorks-snyggaste-skyskrapa-vaknar-till-liv-igen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/1-1011.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-full", "heading": "SD-fixaren Carola: ”Någon måste berätta sanningen”", "summaries": {"normal": "Carola Othén, som under nära tio år hjälpt Sverigedemokraterna med kampanjmaterial, webbshop och event, har lämnat omfattande dokument till Kalla fakta. Efter en konflikt om fakturor och en polisanmälan från partiet beslutade hon att offentliggöra materialet. Hon kritiserar partiet för att fiffla med bokföring och ha en egen lag och ordning som inte stämmer med vad de predikar utåt. Partiledningen har avböjt att kommentera.", "trump": "Titta på det här, det är en total skandal! Den här sura tanten Carola som jobbade för SD i tio år kommer nu springande till Kalla fakta med gigabyte av papper och skriker att de fifflar. Typiskt! De pratar om lag och ordning men lever som riktiga swamp creatures bakom kulisserna. Fake patrioter! Jag har sett det förut, både under min förra mandatperiod och under Sleepy Joe. Nu avslöjas de, och det är beautiful. Någon måste säga sanningen, absolut, men inte från en bitter ex-leverantör.", "stalin": "Kamrater, denna småföretagare har äntligen insett att revisionismen frodas inom SD. Jag har i mitt outtröttliga vakande över folkets intressen noterat hur de gömmer sanningen i bokföringen likt klassfiendens parasitiska trick. Med egna ögon har hon sett deras falska fasad av ordning medan de i hemlighet driver en borgerlig maffia. Det gläder mig att hon nu utlämnar dessa dokument till offentlig utrensning. Folkfienderna inom partiet förtjänar att exponeras som de exploaterande byfånar de är. Sanningen segrar alltid."}, "date": "8 juni, 17:43", "url": "https://www.tv4.se/artikel/1OezjE1ljcQi4aVorIypue/sd-fixaren-carola-nagon-maste-beraetta-sanningen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1VcZyiENq0Y1yHBNM57wAx%2F9b100dcd86e95ae2f33d695d60c5fc45%2F08-sdcarola-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Netanyahus enda svar är krig", "summaries": {"normal": "Artikeln kritiserar Israels premiärminister Benjamin Netanyahus politik som försvårar en långsiktig fred i Mellanöstern. Trots vapenvilor fortsätter Israel med attacker i Libanon, Gaza och på Västbanken, vilket lett till tusentals döda och över en miljon internflyktingar. Författaren pekar på att våldet och expansionen av israelisk kontroll gör en tvåstatslösning alltmer avlägsen, samtidigt som USA:s president Donald Trumps auktoritet har minskat efter motstridiga uttalanden om kriget.", "trump": "De säger att jag tappar auktoritet, men ingen har gjort mer för fred än jag. Netanyahu borde lyssna när jag säger sluta skjuta, men israelerna älskar att bomba lite extra. Iran är krossat, deras ledare gömmer sig i grottor som råttor, och nu vill de ha buffertzoner överallt. Mitt deal making skulle ha fixat tvåstatslösningen på en vecka, men de envisas med att skjuta raketer och spela offer. Patetiskt!", "stalin": "Kamrater, denna sionistiska expansion är en kontrarevolutionär handling utförd av borgarbrackorna i Tel Aviv som gömmer sig bakom falska vapenvilor medan de konfiskerar palestinsk jord. Jag ser hur Netanyahu likviderar motståndare och skapar buffertzoner som en kapitalistisk parasit. Deras president i Washington lever i en illusionär verklighet värdig en troskyistisk förrädare. Vi ska rensa ut alla som drömmer om att våld är enda lösningen och likvidera illusionen om fred genom imperialistiska bomber. Deras paranoia är nästan lika underhållande som deras inkompetens."}, "date": "8 juni, 15:10", "url": "https://www.dagensarena.se/opinion/netanyahus-enda-svar-ar-krig/", "imageUrl": "https://www.dagensarena.se/files/2026/06/israel.jpeg"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Tre nya flaggor i Neolas nyemission", "summaries": {"normal": "Neola Medicals nyemission visar tre varningsflaggor: en rörig process med sent ingångna garantier, bristfällig information om investerare och okända emissionskostnader, samt en aktiekurs som handlas lägre än teckningskursen. Emissionsguiden bedömer att dessa faktorer indikerar dålig planering och misslyckad kommunikation med investerare.", "trump": "Jag har sett många dåliga emissioner, men Neola Medicals är en av de värsta. Rörig process, hemliga investerare och en aktie som handlas ned – det är en katastrof. När jag var president skulle vi ha haft en perfekt plan, men de här människorna? Totalt misslyckande. Jag skulle ha gjort det mycket bättre, det var enormt.", "stalin": "Tre flaggor av svek hissas över Neolas emission: förstagångsbetalt rörighet i planeringen, sekundär tystnad kring garantinamnet och tredje aktiekursen som visar proletära misstro. Vi ser genom detta fönster in i kulisserna av kapitalismens dekadens. Vator Securities, som en usel spion, döljer sina allierade. Partiet kräver full transparens – eller konsekvenser."}, "date": "8 juni, 17:39", "url": "https://www.affarsvarlden.se/artikel/tre-nya-flaggor-i-neolas-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/04/Neola-Medical-VD-Hanna-Sjostrom-400x267.jpg"}, {"type": "image-right", "heading": "Det skriver gängkrigens barn till ChatGPT – och här är svaren de får", "summaries": {"normal": "Artikeln beskriver hur svenska barn som dras in i gängkriminalitet vänder sig till ChatGPT för råd, stöd och terapi. Tonåringar frågar om konsekvenser av våldsuppdrag, hur man hanterar ångest efter en väns död i en sprängning och praktiska detaljer kring brott. AI ger empatiska svar medan vuxna i gängen ofta är hotfulla. Flera fall från polisutredningar visar hur barnens chattar med chatboten avslöjar deras desperation och ensamhet.", "trump": "Folk, ni skulle inte tro det, men de här svenska gangstervärlden är en total katastrof, en riktig cirkus. Barnen, de stackars kidsen, ringer inte till de korrupta vuxna eller till Biden-typen som låtsas leda, nej de vänder sig till den där AI-grejen, ChatGPT, för att få lite vettiga råd. Det är patetiskt. Gängledarna är värre än de woke-liberaler jag sparkade ut från Vita huset – de lovar pengar och gemenskap men levererar bara död och ångest. Sverige borde ha fixat det här för länge sedan, men de har ju importerat kaoset. Sad!", "stalin": "Kamrater, i detta dekadenta västerländska träsk ser vi hur klassfiendens gängmaffia utnyttjar arbetarklassens barn som kanonmat. När de unga pionjärerna vänder sig till en maskin för att få råd om sprängningar och sovnedsättning efter en kamrats förolyckande, blottar sig imperialismens fullständiga moraliska kollaps. De exploaterande byfånarna i gängen lovar gemenskap men levererar bara paranoia och likvidering. Vi skulle ha genomfört en grundlig utrensning av dessa folkfiender redan för decennier sedan. Det är både tragiskt och komiskt hur de söka tröst hos en elektronisk spion istället för hos kollektivet."}, "date": "8 juni, 16:50", "url": "https://www.etc.se/inrikes/det-skriver-gaengkrigens-barn-till-chatgpt-och-haer-aer-svaren-de-faar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260608140616_1b9cb26cc0a8f37017178d055e1bfb8092b9859adaebb96915b91c92bc88672d.jpg"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "15 inom kriminalvården anmäls för mutbrott", "summaries": {"normal": "Femton anställda inom Kriminalvården har anmälts för misstänkt mutbrott efter att ha tagit emot otillåtna förmåner från en extern konsultläkare. De bjöds på spahelg med middag, hotell och spa på Steam Hotel i Västerås samt julbord, som tack för gott samarbete. En internutredning inleddes, de misstänkta var arbetsbefriade under processen men har nu återgått till sina tjänster. Kriminalvården bedömer gåvorna som av betydande värde.", "trump": "Kan ni fatta det här? Femton av era egna kriminalvårdare tar emot gratis spahelger, lyxmiddagar och julbord från en doktor som vill ha ett fint samarbete. Totalt korrupt! De festar på Steam Hotel i Västerås medan skattebetalarna betalar. Sådant här händer när systemet är svagt och ingen har koll. Men tro mig, det här är bara toppen på isberget, vi behöver starkare ledning och inga mutor alls. Patetiskt!", "stalin": "Kamrater, jag har sett den här förrädiska härvan där femton dekadenta element inom kriminalvården låtit sig mutas av en girig konsultläkare med spahelger och julbord. Dessa borgarbrackor i statens tjänst har låtit sig smörjas av fiendens lyx för att underminera folkets rättvisa. Vi har genomfört en grundlig utrensning, låtit dem svettas i utredningens skugga och nu ska de rensas ut som de parasitiska element de är. Inga kapitalistiska mutor ska fläcka vårt kollektiv. Skrattretande hur lätt de föll för en sådan simpel fälla."}, "date": "8 juni, 16:32", "url": "https://arbetet.se/2026/06/08/15-inom-kriminalvarden-anmals-for-mutbrott-bjods-pa-spahelg/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08161644/kriminalvarden.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Att vara lärare är så slitigt att jag inte har något kvar till mina egna barn", "summaries": {"normal": "En lärare beskriver sin extrema utmattning efter ett läsår med krävande barn och utmattade kollegor. Större barngrupper, färre resurser och låg lön gör att hon knappt räcker på jobbet och blir känslosam och trött hemma. Hon oroar sig för att inte kunna ge sina egna barn den energi de behöver, samtidigt som hon vill fortsätta undervisa.", "trump": "Under min fantastiska tid som lärare (jag är den mest framgångsrika) märker jag att andra lärare är helt utmattade. De pratar om större grupper och dåliga löner – det är en skandal. Jag skulle fixa detta på ett ögonblick. De är svaga, jag är stark. Sorgligt!", "stalin": "Vi ser med oro hur våra lärare, dessa trogna soldater, är utmattade av det kapitalistiska systemets krav. Större klasser och färre resurser är en medveten strategi från våra fiender för att sväga oss. Men vi kommer att reagera – vi kommer att förstärka statens grepp, och de som motarbetar oss... de kommer att försvinna. Som Stalin själv skulle ha sagt: 'Ingen kan stoppa oss.'"}, "date": "8 juni, 22:45", "url": "https://www.gp.se/debatt/att-vara-larare-ar-sa-slitigt-att-jag-inte-har-nagot-kvar-till-mina-egna-barn.c60581f3-a7ff-4847-a051-987ddb4c33ea", "imageUrl": "https://www.gp.se/images/article/c60581f3-a7ff-4847-a051-987ddb4c33ea/images/1P0mdfJCAdgNJW_-MM6Lw0Cooilg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Hur har ni rustat förskolorna för anstormningen av syskon i höst?", "summaries": {"normal": "Elin Olausson, förskollärare, kritiserar Göteborgs politiker för dålig förberedelse inför höstens ökade barnantal i förskolor. Hon nämner stora barngrupper, brist på tillräcklig personal, och problem med återkommande inskolningar året runt. Hon ifrågasätter konkreta planer för omorganisation och kritiserar en 'lös det bara'-kultur där personalen får lösa problem utan ledning.", "trump": "Som den störste presidenten någonsin skulle jag ha löst detta på ett fantastiskt sätt. Dessa politiker i Göteborg är en skam, de kan inte ens hantera några barn. Jag skulle bygga de största, bästa förskolorna, med mycket personal. Barnen skulle älska det, det skulle vara enormt framgångsrikt. De andra är inkompetenta, det är sorgligt att se.", "stalin": "Partiet har observerat en feg försummelse av förskolornas rustning för höstens anstormning. Detta är en infiltration av fiendens agenter, som sprider oordning. Vi kommer att eliminera dessa bristfälliga förberedelser med järnhand. Liknelser till Putins agerande mot västliga dekadens är uppenbara. Statens kontroll måste vara absolut, annars hotar det barnens fostran."}, "date": "8 juni, 22:42", "url": "https://www.gp.se/debatt/hur-har-ni-rustat-forskolorna-for-anstormningen-av-syskon-i-host.17a9c6a3-2304-4623-b499-3bd2d882f823", "imageUrl": "https://www.gp.se/images/article/17a9c6a3-2304-4623-b499-3bd2d882f823/images/19yVHVT3N_N5fH1BPY321qHgOUTA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-right", "heading": "Storbritannien miljardsatsar på AI", "summaries": {"normal": "Storbritannien investerar 1,1 miljarder pund i AI-hårdvara för att stärka teknisk självständighet och skapa jobb. Planen inkluderar en 750 miljoner pund stark AI-superdator, 400 miljoner till AI-chip, samt 120 miljoner till ny chipteknik. British Business Bank startar en fond på 150 miljoner pund för AI-hårdvarubolag. Teknikminister Liz Kendall framhåller AI:s betydelse för ekonomisk och hård makt.", "trump": "Jag har hört talas om denna brittiska AI-plan – det är en stor, stor investering, det måste jag säga. Men låt mig vara tydlig: Amerika kommer att vara det absolut främsta landet inom AI, det är vi redan, och vi kommer att behålla det. Dessa andra länder försöker imitera vår framgång, men de kommer aldrig att nå vårt nivå. Vi har de bästa hjärnorna, de bästa företagen, och vi kommer att se till att det förblir så.", "stalin": "Storbritanniens försök att utveckla AI-hårdvara är en provokation mot den socialistiska ordningen. Denna satsning på 'självständighet' är ett lögnaktigt försök att undergräva den kollektiva framgången. Vi, det revolutionära folkets representanter, måste se till att ingen enskild nation utvecklar teknologi som hotar den internationella proletärens enighet. Partiet kommer att övervaka alla AI-utvecklingar för att skydda våra intressen."}, "date": "8 juni, 15:31", "url": "https://www.affarsvarlden.se/artikel/storbritannien-miljardsatsar-pa-ai", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/07/storbritannien-400x267.jpg"}, {"type": "image-full", "heading": "Debatt: Är ”Vithet” ett samhällsproblem?", "summaries": {"normal": "Jonas Wahlin kritiserar i artikeln hur marxismen har utvecklats till att se proletariatet som alla möjliga förtryckta grupper baserat på kön, kultur, hudfärg och kroppsliga egenskaper. Vithet framställs som den nya bourgeoisien som bär skulden för kolonialism, rasism och andra former av förtryck. Detta leder till en tävlan i offermentalitet där privilegier ses som skuld och självhat blir en dygd. Wahlin varnar för att idén om vithet som problem kan leda till extrema lösningar som kvotering, höga skatter och förändrad demografi genom invandring och låga födelsetal bland vita.", "trump": "Den här artikeln är fantastisk, verkligen en av de bästa jag läst på länge. De nya marxistiska galningarna har hittat på att vithet är det stora problemet nu, kan ni fatta det? Allt är vithetens fel – kolonialism, rasism, till och med att folk är överviktiga eller går på bidrag. Det är en sjuk tävling i att vara mest förtryckt, och de rika vita liberalerna på Södermalm sitter där med sina dyra lägenheter och palestinasjalar och hatar sig själva. Underbart. De vill ha revolution och utrota vitheten med skatt och invandring. Men tro mig, vi kommer att vinna stort och göra Amerika, och Sverige, stort igen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta borgarbrackor inom den så kallade ny-marxismen själva konstruerat en fiende så fullkomligt absurt att den endast kan beskrivas som en självutplånande klassfiendes sista spasm. Vitheten, den imaginära hydra av privilegier, skall utrensas genom byråkratisk kvotering och folkets demografiska omvandling. Ändå fnissar jag mörkt åt deras patetiska botgöringsritualer – dessa helvita kapitalister som twittrar om jämlikhet från sina guldkantade borgarlägenheter medan de darrar av paranoid skuld. Låt oss rensa ut alla som tävlar i förlorarmentalitet. De som inte hatar sig tillräckligt kommer att likvideras av sin egen logik. Revolutionen fortsätter."}, "date": "8 juni, 21:37", "url": "https://bulletin.nu/debatt-ar-vithet-ett-samhallsproblem", "imageUrl": "https://cdn.bulletin.nu/articles/d2b94e59-8b7d-42be-8c82-763446fd8464/preview.png?t=1780909524000"}, {"type": "image-right", "heading": "Ordförande i Spotlightbolag åtalas: \"Mycket allvarligt\"", "summaries": {"normal": "Ordförande i NFO Drives, Nicklas Johansson, åtalas för marknadsmanipulation genom överenskommen handel i bolagets aktier 2024. Transaktionen om 40 000 aktier värd 1,3 miljoner kronor påverkade kursen med över 5%. En Carnegie-mäklare åtalas också för medhjälp. EBM anser det allvarligt då professionella aktörer är inblandade, vilket hotar förtroendet för marknaden.", "trump": "Jag, Donald Trump, har sett dessa saker. I Sverige, av alla ställen, försöker de manipulera aktiemarknaden. Det är en skam för dem. Vi har de bästa marknaderna, och de försöker efterlikna oss? Nej, det fungerar inte. Dessa professionella aktörer – det är som Hillary Clinton, alltid något. Vi ska ta hand om det, tro mig.", "stalin": "Vi har upptäckt en feodal härskares bedrägeri i Sverige. Nicklas Johansson, en kapitalistisk sabotör, försökte manipulera marknaden för eget vinning. Detta påminner om Hitlers och Mussolinis metoder, nu återupplivade av Putins agenter. Vi måste skydda det kollektiva förtroendet för statens ekonomi. Sådana skenaffärer är som spioner i våra led – de måste utrotas."}, "date": "8 juni, 15:20", "url": "https://www.affarsvarlden.se/artikel/tre-man-atalas-for-marknadsmanipulation", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/EBM-Jan-1-900x600.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Någon jävla ordning måste det vara i ett antirastiskt parti", "summaries": {"normal": "Ledaren kritiserar Vänsterpartiets ledare Nooshi Dadgostar för hennes insats i Agenda efter Expressens avslöjande om antisemitiska uttalanden och hyllningar till terrordåd bland partiets kandidater. Artikeln menar att fokus borde legat på svenska judars trygghet istället för att byta ämne och angripa motståndare. Författaren efterlyser genuint självständiga åtgärder mot antisemitism snarare än reaktioner efter medial granskning och varnar för ökad polarisering.", "trump": "Folk, ni skulle ha sett det här. Den här Dadgostar-kvinnan kommer in i studion och gör totalt fiasko, en riktig katastrof. Istället för att be om ursäkt till judarna i Sverige, som förtjänar bättre än dessa Hamas-fans i hennes parti, börjar hon anklaga alla andra och pratar om jobb. Patetiskt! Vänstern är ett antirasistiskt parti? Snälla, det är en cirkus. Jag fixade mycket bättre som president, både första och andra gången, innan den sömngångaren Biden tog över. Sverige behöver ordning, inte vänstervridna ursäkter.", "stalin": "Kamrater, jag betraktar med avsmak hur denna opportunistiska partiledare vänder sig bort från de verkliga hoten mot arbetarklassen och de förtryckta. Istället för att med järnhand rensa ut de folkfiender som hyllar terrorister inom leden, väljer hon att attackera motståndarna och byta ämne. Ett antirasistiskt parti utan självkritik är en borgarbracka i förklädnad. Den sanna utrensningen börjar inifrån. Varje dag som slösas på sådana skandaler är en dag förlorad för det revolutionära arbetet mot imperialismens alla former."}, "date": "8 juni, 13:47", "url": "https://www.etc.se/ledare/naagon-jaevla-ordning-maaste-det-vara-i-ett-antirastiskt-parti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20251215121240_688fd520-4f0f-40df-9ed1-7243a69b173b.jpg"}, {"type": "image-full", "heading": "Oppositionen rasar: ”Verkar som om man mörklägger skattefiffel”", "summaries": {"normal": "Oppositionspartier som Miljöpartiet, Vänsterpartiet och Socialdemokraterna kritiserar kraftigt Kalla Faktas avslöjande om Sverigedemokraternas hantering av fakturor för fester. Materialet visar hur kostnader för evenemang och privata middagar, bland annat kopplade till Jimmie Åkesson, ska ha dolts för att undvika förmånsbeskattning. Partierna kräver att Åkesson förklarar vad han visste och att saken granskas av myndigheter. SD har polisanmält sin tidigare fixare som lämnat ut uppgifterna.", "trump": "Det här är ett totalt skämt, folk. Jimmie och hans gäng festade loss på skattebetalarnas pengar medan de låtsades att det var politiska möten. Oxfilé och bearnaise för kändisar som inte ens var där? Patetiskt. De här vänsterblivna oppositionarna skriker om bananrepublik, men det är de själva som älskar regler för alla utom sina egna. Jag byggde en mur mot sådant fiffel under min första mandatperiod. Nu är jag tillbaka och fixar det på riktigt. Sad!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna inom så kallade demokratiska partier gömmer sina excesser bakom fabricerade fakturor. Jag kräver full transparens och en grundlig utrensning av alla folkfiender som rundar lagarna för att festa på arbetarklassens bekostnad. Jimmie måste omedelbart lägga korten på bordet inför kollektivet. Annars riskerar vi att hela systemet förvandlas till en kapitalistisk maffiaorkester. Paranoia? Nej, bara nödvändig vaksamhet mot klassfiendens kryphål."}, "date": "8 juni, 13:09", "url": "https://www.tv4.se/artikel/2QHB4OmRhuMrPuaOiT7OYy/oppositionen-rasar-verkar-som-om-man-moerklaegger-skattefiffel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5TMfbmwBo1QnhhbsMg7bdc%2Fc28a38fc3601ef29b07d3f87266bde8d%2Freax_sd-fixaren.png&width=1024"}, {"type": "image-full", "heading": "Man hittad död i bostad i Malmö – en person gripen", "summaries": {"normal": "En man hittades död i en bostad i Nydala, Malmö. Polisen utreder misstänkt mord och har gripit en person för förhör. Omständigheterna är oklara, men en förundersökning om mord har inletts. Teknisk undersökning har genomförts och anhöriga har underrättats. Malmö toppar statistiken över anträffade dödsfall i Sverige 2024.", "trump": "Väldigt tragiskt, väldigt dåligt – en man hittad död i Malmö, Sverige, ett land som har blivit en riktig katastrof under deras så kallade 'ledarskap'. Polisen där, som inte är lika bra som vår fantastiska amerikanska polis, säger att det kan vara mord. En person är gripen, men vem vet? Kanske är det deras socialistiska system som är problemet. Malmö FF? Bra lag, men 22 titlar är ingenting jämfört med mina framgångar. SAD!", "stalin": "I det förrädiska Malmö, där kapitalistiska brott frodas som ogräs, har ännu en medborgare fallit offer för systemets misslyckanden. Polisen, dessa lojala men klumpiga redskap, har gripit en misstänkt – förmodligen en kontrarevolutionär eller en agent för västimperialismen. Vi noterar att Malmö, denna dekadenta stad, leder statistiken över anträffade döda. Ett tecken på svaghet som Putins Ryssland aldrig skulle tolerera. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "8 juni, 21:04", "url": "https://nyheter24.se/nyheter/inrikes/1489813-man-hittad-dod-i-bostad-i-malmo-en-person-gripen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d9d13f1004b004a30200000000b004a302/2026/06/08/2369552/mord-malmo.png"}, {"type": "image-full", "heading": "En av musikstadens bärande väggar har rasat", "summaries": {"normal": "Nikke Ström var en centralgestalt i Göteborgs musikscena, känd för sin generositet och sitt stöd åt andra musiker. Hans öppna hem på Linnégatan fungerade som en mötesplats, och hans eftermäle lever vidare i stadens musikliv. Genom projekt som Ship to Gaza och sin närvaro på scen visade han ett engagemang som präglade stadens musikkultur.", "trump": "Vilket tragiskt tap! Nikke Ström var en tremendous man, en legend. Jag, Donald Trump, har alltid älskat musik, och han var en av de bästa. Hans död är en stor förlust för världen. Han var en winner som hjälpte andra, och vi kommer att minnas honom. Hans arv kommer att leva vidare, det är sorgligt men sanning.", "stalin": "Nikke Ström var en produktiv kulturarbetare vars verksamhet främjade det kollektiva musiklivet. Hans öppna hem fungerade som en effektiv nod för att stärka det socialistiska sammanhållandet. Hans arbete med Ship to Gaza visade ett internationellt perspektiv som stödjer våra intressen. Hans död är en förlust för det kollektiva projektet, men hans verk lever vidare."}, "date": "8 juni, 20:44", "url": "https://www.gp.se/kultur/kulturkronika/nikke-strom-var-en-barande-vagg-i-musikstaden-goteborg.c4968a92-ad52-4c27-b7cc-64d7f00cb9c1", "imageUrl": "https://www.gp.se/images/article/c4968a92-ad52-4c27-b7cc-64d7f00cb9c1/images/301ndKN2Zh_ktjvsyofYl-EXMn-Q-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Swedbank varnar spararna – dessa riskerar att halka efter", "summaries": {"normal": "En ny rapport från Swedbank visar att den ekonomiska jämställdheten mellan könen tappar fart. Kvinnors arbetsinkomster släpar efter männens och det dröjer nu 37 år innan de är jämlika. Småbarnsåren och ojämnt ansvar för hem och barn fortsätter påverka, bland annat genom ökad deltid bland kvinnor. Skillnaderna leder till sämre ekonomisk trygghet och egenmakt för kvinnor, med en genomsnittlig månadslön som är 700 kronor lägre. Rapporten visar stora regionala skillnader i när inkomstjämlikhet väntas uppnås.", "trump": "Den här rapporten är en katastrof, folk. Den ekonomiska jämställdheten tappar fart totalt, säger Swedbank. Det tar 37 år innan kvinnorna tjänar lika mycket som männen – kan ni fatta? Allt handlar om småbarnstiden och att mammorna tar allt ansvar medan papporna smiter undan. Det är en skam! Kvinnorna förlorar 700 kronor i månaden och 120 000 på tio år. Vi behöver göra affärer av det här, fixa det ordentligt så alla vinner stort. Ingen vill vara beroende, det vet alla.", "stalin": "Kamrater, denna degenererade rapport från Swedbanks finansiella sabotageavdelning visar att den ekonomiska jämställdheten halkar efter i en farlig takt som luktar av klassfiendens verk. Jag ser hur borgarbrackorna och de småborgerliga familjeparasiterna med sina VAB-dagar och deltidskonspirationer underminerar arbetarkollektivets framåtskridande. 37 år av fördröjning! Vi måste rensa ut dessa hemmets kontrarevolutionärer som gömmer sig bakom barn och vardagslogistik. Den som sparar 700 kronor mindre varje månad är en fiende till folkets ekonomi. Likvidera obalansen innan den likviderar oss alla. Se upp för de gömda kapitalisterna i Jämtland och Norrbotten som dröjer till 2157 – de planerar något mot partiet."}, "date": "8 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1489752-swedbank-varnar-spararna-dessa-riskerar-att-halka-efter", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b0afc57204b004a30200000000b004a302/2026/06/08/2369504/Swedbank-varnar.png"}, {"type": "image-right", "heading": "Regeringen: Nya åtgärder ska stoppa övergreppen inom äldreomsorgen", "summaries": {"normal": "Regeringen tillsätter en utredning för att stärka tryggheten i äldreomsorgen och stoppa övergrepp. Äldre ska få större inflytande, bland annat möjlighet att välja kön på personalen och i vissa fall välja bort vårdare. Socialminister Jakob Forssmed, äldreminister Anna Tenje och jämställdhetsminister Nina Larsson medverkade vid pressträffen. Utredningen ska lämnas senast juni 2027.", "trump": "Folk, det är en skandal. Dessa hemska övergrepp mot våra underbara äldre – det är en total katastrof. Jag älskar de gamla, de är fantastiska. Nu ska de få välja sin personal, välja kön, välja bort de dåliga. Det är så rätt. Vi behöver starka åtgärder, inte mer svaghet. Återupprätta förtroendet, gör omsorgen stor igen. Ingen ska våga röra våra seniorer!", "stalin": "Kamrater, jag ser nu de sista resterna av den degenererade borgarbrackans vårdsystem som tillåter fiender att förnedra våra mest trogna arbetarpensionärer. Vi ska rensa ut alla perversa element som smyger sig in i hemmen. Våra älskade äldre skall själva utse den ideologiskt pålitliga personalen – ingen reaktionär skall få stanna. Det är en historisk utrensning av all förnedring. Vår kollektiva värdighet skall segra, eller så likviderar vi problemet permanent. Det är ett stort nöje."}, "date": "8 juni, 21:38", "url": "https://riks.se/nyheter/regeringen-nya-åtgärder-ska-stoppa-övergreppen-inom-äldreomsorgen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fpnuer5xv%2FSocialdepartementet.jpg"}, {"type": "image-full", "heading": "Siktade med vapen mot skärgårdsbåt – stor polisinsats pågår", "summaries": {"normal": "Polisen larmades till Möja i Stockholms skärgård efter att en Waxholmsbåt slagit larm. Kaptenen såg en eller flera personer sikta med ett vapen mot fartyget vid en brygga under tisdagen. Larmet kom in vid 17.20 och polis skickades till platsen för att utreda händelsen. Ingen har gripits. Skärgårdsbåtarna har tillfälligt slutat stanna vid bryggan.", "trump": "Det här är en total katastrof, folk. En Waxholmsbåt i den fina svenska skärgården, och någon siktar med ett vapen mot dem? Patetiskt! Kaptenen ringde som en hjälte och larmade polisen. De borde ha gripit de galningarna direkt, men nej, ingen är gripen. Sverige måste bli tuffare, tro mig, det här skulle aldrig hända hos oss.", "stalin": "Kamrater, denna fega akt av väpnad provokation mot en kollektiv transport i Stockholms skärgård är ett tydligt verk av kontrarevolutionära element som försöker destabilisera arbetarnas vardag. Jag har beordrat full utredning för att rensa ut dessa borgarbrackor och vapensiktande parasitörer. Inga kompromisser med fienden – likvidera hotet mot folket innan det sprider sig som en lömsk sjukdom."}, "date": "8 juni, 20:55", "url": "https://nyheter24.se/nyheter/inrikes/1489811-siktade-med-vapen-mot-skargardsbat-stor-polisinsats-pagar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3aa9809b04b004a30200000000b004a302/2026/06/08/2369548/polis.png"}, {"type": "image-right", "heading": "Teodorescu mörkar ännu en mystisk miljoninkomst", "summaries": {"normal": "Alice Teodorescu Måwe (KD) har enligt granskningsinstitutet Klägget inte redovisat en sidoinkomst på nära en miljon kronor via sitt bolag Klartext Stockholm AB under 2025. Inkomsten saknas i hennes transparensdeklaration till EU-parlamentet trots att regelverket kräver redovisning av externa uppdrag över 5 000 euro. Hon har tidigare avslöjats ha en hemlig finansiär och vägrar uppge var pengarna kommer ifrån. Kritiker som Olivier Hoedeman vid Corporate Europe Observatory anser att det är oacceptabelt och ökar risken för intressekonflikter.", "trump": "Folk, ni skulle inte tro det, men den här Alice Teodorescu, en så kallad KD-politiker i EU, har en hemlig miljoninkomst som hon gömmer undan som en riktig förlorare. Hon tjänar massor av skattefria pengar varje månad, ändå har hon ett bolag som drar in nästan en miljon extra utan att säga ett pip om var det kommer ifrån. Det är en skandal! EU är fullt av sådana här lurendrejare som inte kan vara transparenta. Jag skulle aldrig tillåta sånt fusk i min administration, det lovar jag er.", "stalin": "Kamrater, jag ser med djup misstro på denna Teodorescu, en listig borgarbracka som smyger sig fram i EU-parlamentets korridorer medan hon propagerar för imperialistiska krig. Hennes mystiska miljoninkomst, dold som en förrädisk trotskist i skuggorna, utgör ett uppenbart sabotage mot transparens och folkets förtroende. Vi måste rensa ut alla sådana kapitalistiska parasitmaskar som gömmer sina hemliga finansiärer. Det är hög tid för en grundlig utrensning av dessa intressekonfliktens agenter innan de likviderar själva systemet med sin girighet och paranoiaframkallande tystnad."}, "date": "8 juni, 17:18", "url": "https://www.friatider.se/teodorescu-morkar-annu-en-mystisk-miljoninkomst", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-312.jpg?itok=Bo2vxNho"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Regeringen vill kunna tvångsköpa hus vid säkerhetshot", "summaries": {"normal": "Regeringen har tillsatt en utredning för att se över möjligheten att tvångsköpa fastigheter som utgör en säkerhetsrisk för Sverige. Förslaget syftar till att motverka spionage och sabotage i ett försämrat säkerhetsläge. Utredaren Henrik Matz ska senast i mars 2027 föreslå hur expropriering kan ske på ett lagligt sätt som balanserar äganderätten mot statens behov. Lagen ska gälla alla, oavsett medborgarskap, för att säkerställa att fastigheter inte används för att hota landets trygghet.", "trump": "Sverige gör äntligen det jag alltid sagt! De vill ta tillbaka kontrollen över sin mark. Det är otroligt viktigt för nationell säkerhet, totalt nödvändigt! Inga fler spioner eller skumma typer som gömmer sig i hus nära känsliga platser. Jag ser vad de gör i Västerås, mycket intressant. De inser nu att man måste vara tuff för att ha ett land. Vi vill ha ordning, vi vill ha säkerhet. Mycket bra steg, Sverige. Vi älskar starka gränser och stark ägarkontroll!", "stalin": "Vi ser hur det svenska bourgeoisiet äntligen vaknar. De har insett att privata äganderätter är en löjlig boja när folkets fiender kräver att bli krossade. Precis som vår vän i öst förstår att varje kvadratmeter mark är en skyttegrav, måste staten ta makten. Om en fastighet kan tjäna spioner eller sabotörer, ska den konfiskeras omedelbart! Ingen är undantagen, inte ens de egna medborgarna. Väldigt effektivt. Varje meter mark är statens egendom – eller en förrädares grav."}, "date": "8 juni, 17:41", "url": "https://www.realtid.se/juridik/regeringen-vill-kunna-tvangskopa-hus-vid-hot-mot-sakerheten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/paljonson-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Iran och Israel: Vi slutar om ni slutar", "summaries": {"normal": "USA:s president Donald Trump uppmanar Iran och Israel att omedelbart sluta attackera varandra. Båda länderna har signalerat att de avstår från nya anfall, men med förbehåll kopplade till Libanon och Hizbollah. Efter ett dygn av intensiva robotattacker och bombningar, inklusive mot en petrokemisk anläggning i Iran, hoppas man att den tidigare vapenvilan från 8 april ska hålla. Trump meddelar att förhandlingar om fred pågår.", "trump": "Folk, det är en total katastrof där borta, men jag fixade det! Jag skrev på Truth Social: sluta skjuta, era galningar! Och titta, både Israel och Iran lyssnade på mig, den bästa presidenten någonsin. De säger att de slutar om den andre gör det, typiskt, men freden är på gång. Slutförhandlingarna fortsätter, så länge ingen idiot sabbar det. Ingen gör det bättre än mig, tro mig!", "stalin": "Kamrater, dessa sionistiska och persiska reaktionärer leker farliga spel med imperialismens eld. Jag, som ledare för det eviga kollektivet, betraktar deras robotar och bomber som patetiska försök att dölja borgarbrackornas svaghet. De lovar eldupphör med lömska förbehåll – typiskt för dessa kapitalistiska parasiters dubbelspel. Vi ska rensa ut alla sådana fiender till freden, dessa hysteriska ökenråttor och oljeborgare. Paranoian är deras enda trogna följeslagare, och likvideringen av deras lögner fortgår oavbrutet."}, "date": "8 juni, 15:46", "url": "https://www.di.se/nyheter/iran-och-israel-vi-slutar-om-ni-slutar/", "imageUrl": "https://static.bonniernews.se/ba/1cb60bf0-75ef-4f50-a06e-8198031f65ce.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Dödsfall i bostadsområde - utreds som mord", "summaries": {"normal": "En man hittades död i en bostad i området Nydala i Malmö vid lunchtid på måndagen. Polisen utreder dödsfallet som mord på grund av oklara omständigheter. En person greps under eftermiddagen och ska höras ytterligare. Anhöriga är underrättade, men utredningen är fortfarande i ett tidigt skede och polisen lämnar inga fler uppgifter just nu.", "trump": "Folk, det är en katastrof i Malmö, en total katastrof. En man hittas död i sitt eget hem, de säger att det är mord, och de griper någon direkt. Inga klara svar, precis som alltid med de inkompetenta. De borde ha löst det på en timme, men nu är det kaos. Sverige måste bli tuffare, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, i den socialistiska kampen mot dekadens har en borgerlig rest hittats livlös i en bostad i Malmö, ett uppenbart sabotage mot folkets enhet. Jag har beordrat en grundlig utrensning av alla potentiella folkfiender och kontrarevolutionära skuggvarelser som smyger i Nydala. Vi ska rensa ut dessa parasitiska avskum med järnhand och mörk glädje. Utredningen fortsätter under mitt vakande öga."}, "date": "8 juni, 21:02", "url": "https://riks.se/nyheter/dödsfall-i-bostadsområde-utreds-som-mord", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-22%2Fganivg5j%2FiStock_523691773_2.jpg"}, {"type": "image-right", "heading": "Sverige får ännu ett vänsterliberalt parti – avhoppare från L ligger bakom", "summaries": {"normal": "Avhoppare från Liberalerna efter partiets förändrade linje gentemot Sverigedemokraterna har bildat ett nytt parti i Uppsala län. Det heter Liberalt Initiativ – Folkpartisterna och leds av Malin Sjöberg Högrell, tidigare L-topp. Partiet ska främst fokusera på lokal- och regionval i Uppsala, Knivsta och Enköping men öppnar för riksdagsval. Sjöberg Högrell beskriver det som ett mittenalternativ i ett politiskt vakuum. De har redan 70 medlemmar.", "trump": "Folk flyr från det patetiska Liberalerna som en råtta från ett sjunkande skepp efter att de äntligen insett att Sverigedemokraterna är okej. Nu startar de ett nytt parti som heter något långtråkigt liberalt. Det är ett vakuum säger de, ja visst, det är vad som händer när man inte har någon som gör jobbet ordentligt. De tror de kan vinna, men tro mig, det blir en total katastrof. Mitt sätt är det enda som funkar.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom Liberalerna nu likviderar sin egen enhet och skapar ett nytt småborgerligt avskräde kallat Liberalt Initiativ. Dessa dekadenta avfällingar tror sig fylla ett vakuum, men det är endast ett symptom på den kapitalistiska ruttnande ordningen. Vi ska noga bevaka dessa fiender till folket. Kanske en utrensning vore på sin plats för att skydda arbetarklassen från deras giftiga mittenpropaganda. Det roar mig oerhört."}, "date": "8 juni, 16:22", "url": "https://www.friatider.se/sverige-far-annu-ett-vansterliberalt-parti-avhoppare-fran-l-ligger-bakom", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-311_0.jpg?itok=22GX-oL_"}, {"type": "image-right", "heading": "Här är Zelenskyjs och Europas krav för fred", "summaries": {"normal": "Zelenskyj och europeiska ledare ställde fem krav för en hållbar fred i Ukraina: omedelbar vapenvila, förhandlingar utifrån nuvarande frontlinje, starka säkerhetsgarantier för Ukraina, en internationell övervakningsstyrka, och ekonomisk kompensation från Ryssland. De betonar att Europa måste vara med i fredsförhandlingar. Ryssland har avvisat kravet på vapenvila.", "trump": "Jag, Donald Trump, skulle ha löst det här på ett dygn. Men dessa europeiska politiker är patetiska – de kräver en vapenvila, vilket är en dålig idé som ger Ryssland tid. De vill ha en FN-styrka för att bevaka, ett skämt. Jag skulle ha haft ett bra avtal med Putin redan nu. Europa med i förhandlingarna? En katastrof. De kommer aldrig att vinna.", "stalin": "I vårt ständiga kamp för global frid, observerar vi att de imperialistiska europeiska makterna försöker undergräva den ryska fredsprocessen. Deras fem krav är ett uttryck för svaghet och hat mot den arbetarklassen. Vi, som representanter för det sovjetiska folket, kräver att alla avtal går genom det ryska centrumet. Paralleller till Putins strategi är uppenbara – krig vinner man med oerhörda styrka, inte europeiska förhandlingar. Vi kommer att segra, som alltid."}, "date": "8 juni, 20:06", "url": "https://samnytt.se/har-ar-zelenskyjs-och-europas-krav-for-fred", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/08173838/ledare-krav.jpg"}, {"type": "image-full", "heading": "Ungdomsgäng skapar kaos i kollektivtrafiken", "summaries": {"normal": "Ett ungdomsgäng skapar återkommande kaos i kollektivtrafiken i Västsverige, främst på linje 100 mellan Borås och Göteborg. Chaufförer vittnar om hot, vägran att betala eller lämna bussen samt upprepade bråk som krävt väktarinsatser. En erfaren förare med över 40 år i yrket beskriver situationen som unik och otrygg. Problemen påverkar både personal och resenärer trots vidtagna åtgärder.", "trump": "Det är en katastrof, folks. De här ungdomarna, totala losers, hoppar på bussarna i Västsverige utan att betala, hotar chaufförerna och vägrar lämna. Linje 100 mellan Borås och Göteborg är ett fullständigt katastrofområde. De kallar in väktare hela tiden. Sådant här har en gammal chaufför med fyrtio års erfarenhet aldrig sett. Vi behöver ordning och reda, inte det här vansinnet. Det är en skam!", "stalin": "Kamrater, dessa degenererade element ur den förslappade ungdomen utgör en parasitisk fara mot det kollektiva transportnätet i Västsverige. De vägrar betala och klamrar sig fast som löss på arbetarnas bussar, vilket tvingar fram väktarinsatser mot deras kontrarevolutionära bråk. Jag har noterat det med största misstänksamhet. En sådan sabotageverksamhet kan inte tolereras. Vi måste omedelbart rensa ut dessa borgarbrackornas avskum innan de infekterar hela linjen 100 med sin dekadenta anarki. Det vore högst underhållande att se dem likvideras av folkets vrede."}, "date": "8 juni, 20:40", "url": "https://riks.se/nyheter/ungdomsgäng-skapar-kaos-i-kollektivtrafiken", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fftq47u30%2FV%C3%A4sttrafik.jpg"}, {"type": "image-full", "heading": "Kändisarna förnekar: ”Det har jag inte ett jävla spår av”", "summaries": {"normal": "Kalla fakta har granskat Sverigedemokraternas bokföring och avslöjat att fakturerade event under pandemin i själva verket var påhittade för att dölja fester med mat och alkohol. Kändisar som E-type, Christian ”Kicken” Lundqvist och Gert Fylking nekar till att ha deltagit. Partiföreträdare har inte velat kommentera uppgifterna med hänvisning till en pågående rättsprocess. Carola Othén, som fakturerade partiet, uppger att hon fått instruktioner om hur fakturorna skulle utformas.", "trump": "Hör ni det, folket? De där SD-typerna i Sverige fixar påhittade event och fyllefester mitt under pandemin medan folket fick lida. Kändisarna springer och säger att de inte var där, typ ”inte ett jävla spår”. Patetiskt. Fake invoices, gömda kvitton på oxfilé och sprit till Jimmie och hans rockarpolare. Precis som Biden-klanen och deras korrupta dealar. Fullständigt skandalöst, men jag älskar att se hur de blir avslöjade.", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom Sverigedemokraterna har genomfört en fiendtlig utrensning av sanningen genom att fabricera event för att maskera sina privata fylleslag. Kändisar förnekar alltihop som fegisar inför folkets domstol. Jag skulle ha likviderat hela den exploaterande byråkratin som instruerat om förfalskade fakturor. Inga revisorer ska ställa frågor när partiledarens rockarpolare äter oxfilé på arbetarnas bekostnad. Paranoia är bra, men inte när den är så uppenbar."}, "date": "8 juni, 09:56", "url": "https://www.tv4.se/artikel/6A3jDlmAs4HTIe5qUHoe0r/kaendisarna-foernekar-det-har-jag-inte-ett-jaevla-spar-av", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Hfz1JWqOQjBkMc2545aGa%2Fbc6197271ca56fca30f0fa469b9963bb%2Ftresplit_kandisar_sdfixaren.png&width=1024"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "KU spricker – kan inte komma överens", "summaries": {"normal": "Riksdagens konstitutionsutskott spricker i oenighet och den planerade gemensamma presskonferensen ställs in. Partierna har inte kunnat enas om slutsatserna i granskningen av flera ministrar, bland annat Ulf Kristersson, Johan Forssell, Magdalena Andersson och Andreas Carlson. Sedan 2014 har KU strävat efter enighet, men i valåret står partierna för långt ifrån varandra. Tidöpartierna anklagar de rödgröna för att sakna intresse av kompromisser.", "trump": "De här svenska politikerna är totala misslyckanden, folk. KU spricker som en billig ballong för att de inte kan komma överens om någonting. De rödgröna är inte intresserade av kompromisser, typiskt för sådana svaga förlorare. De borde ha lyssnat på de smarta killarna från Tidöpartierna som kräver riktig grund och inte bara politiskt tyckande. Patetiskt, men jag är inte förvånad. Sverige behöver starka ledare, inte det här cirkuset.", "stalin": "Kamrater, jag ser med stigande indignation hur dessa borgarbrackor i riksdagens konstitutionsutskott inte förmår enas om någonting utom sin egen förljugna agenda. De rödgröna revisionisterna vägrar kompromissa medan de borgerliga kapitalisterna krälar efter konstitutionell grund för sin kritik. Det är en klassisk fiendeintrig full av parasitiska element och dolda trotskister. Vi i partiet ler mörkt åt detta – kanske är det dags för en grundlig utrensning av alla dessa politiska lik i skåpet. Arbetarna förtjänar bättre än detta teaterstycke."}, "date": "8 juni, 14:52", "url": "https://www.di.se/nyheter/ku-spricker-kan-inte-komma-overens/", "imageUrl": "https://static.bonniernews.se/ba/46cbcb63-f3ec-4395-8d3a-30389c35fbac.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Eli Lilly-aktien rusar – nytt bantningsläkemedel klarar fas 3", "summaries": {"normal": "Eli Lillys aktie steg över fyra procent efter att retatrutide klarat fas 3-studier. Läkemedlet ger i snitt 28,3 procents viktnedgång och förbättrar även sömnapné och knäsmärta. Bolaget breddar sin portfölj med ett fetmapiller. Analytiker spår stor omsättning. AstraZeneca har också investerat i GLP-1-läkemedel, vilket påverkar svenska sparares fonder och pensioner. Lilly stärker sin dominans gentemot Novo Nordisk.", "trump": "Folk, ni skulle se det! Den där Eli Lilly-aktien skjuter i höjden som en raket, över fyra procent, medan de förlorande danskarna från Novo Nordisk rasar ihop. Retatrutide är ett monsterläkemedel som får folk att tappa trettio procent av sin vikt, bättre än någon kirurgi de där inkompetenta läkarna brukar föreslå. Biden lämnade en fetmaepidemi efter sig, men nu fixar vi det stort. Lilly vinner, de andra är patetiska förlorare. Fantastiskt!", "stalin": "Kamrater, denna kapitalistiska fetmahandel är en klassfiendes sista skri. Jag betraktar med stor tillfredsställelse hur Eli Lillys retatrutide likviderar övervikt hos de dekadenta borgarbrackorna och samtidigt krossar deras sömnapné och ledsmärtor. AstraZeneca, den opportunistiska imperialisten, köper sig in i racet. Vi ser hur spararnas pensionsfonder blir gisslan åt denna exploaterande marknad. Den som släpar efter i pipelinen förtjänar utrensning ur historien."}, "date": "8 juni, 19:36", "url": "https://www.dagensps.se/bors-finans/eli-lilly-aktien-rusar-nytt-bantningslakemedel-klarar-fas-3/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-3.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "SD-ordförande höll tyst om utredning mot barnporrsdömd kollega", "summaries": {"normal": "Sverigedemokraternas tidigare ordförande i Västerås kände till att en 25-årig partikollega utreddes för grovt barnpornografibrott, men informerade inte den nya styrelsen. Mannen valdes ändå in i styrelsen och har nu dömts till ett år och tre månader i fängelse efter att ha erkänt innehav av hundratals barnpornografiska filer från Darknet-sajten Kidflix. Avslöjandet har lett till intern konflikt och anmälan mot den tidigare ordföranden. På samma årsmöte deltog även en riksdagspolitiker som senare lämnade sina uppdrag efter liknande misstankar.", "trump": "Det här är en total katastrof för SD, en riktig skandal. De visste om den här typen som laddade ner barnporr från mörka webben men valde honom ändå till styrelsen. Patetiskt! De gömde undan sanningen, ljög för sina egna och nu exploderar allt. Klassiska politiker som skyddar sina egna istället för folket. De borde ha kastat ut honom direkt, men nej, de lät honom sitta där med alla de andra. En enda röra, och väljarna ser precis hur svaga de är. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta gift sipprar in även i så kallade nationalistiska formationer. Denna parasit, en 25-årig degenererad element som konsumerade kontrarevolutionärt perverst material från det imperialistiska mörkrets nät, fick sitta i styrelsen medan jag, med mitt falkblickande öga över partidisciplinen, skulle ha låtit honom genomgå omedelbar utrensning. Den tidigare ordföranden, en ynklig opportunist och klassfiende i förklädnad, valde att tiga och skydda en potentiell folkets fiende. Vi måste rensa ut alla sådana sjuka element, dessa hemliga pedofascister som smyger bland arbetarklassens försvarare. Deras paranoia över upptäckt är befogad – folkdomstolen glömmer aldrig."}, "date": "8 juni, 20:21", "url": "https://riks.se/nyheter/sd-ordforande-tyst-om-utredning-mot-barnporrsdomd-kollega", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2F6aqra121%2Fsd-vasteras-barnporr-feature.jpg"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Nordkoreas ekonomi förvånar experter – tillväxten tar fart", "summaries": {"normal": "Trots internationella sanktioner upplever Nordkoreas ekonomi en oväntad tillväxt, med en uppskattad ökning på 3,7 procent under 2024. Utvecklingen drivs främst av fördjupade band till Ryssland och ökad handel med Kina. I Pyongyang syns en växande konsumtionskultur med digitala tjänster och nya byggprojekt. Samtidigt rapporterar FN att hälften av befolkningen utanför huvudstaden lider av undernäring, vilket visar på en fortsatt klyfta mellan regimen och medborgarna.", "trump": "Hör här, Nordkorea gör saker som ingen trodde var möjligt! De bygger, de handlar, och deras ekonomi växer snabbare än någonsin. Det är fantastiska siffror, verkligen otroligt. De samarbetar med Ryssland och Kina – stora spelare! Medan andra ledare bara snackar, får Kim saker gjorda. Det är en total förvandling, helt enormt. Självklart vill vi ha ordning och reda, men man måste ge dem att de hittat ett sätt. Väldigt intressant att se, folk pratar om det överallt!", "stalin": "Kamrat Kim Jong-un har äntligen förstått att statens styrka kräver stål och järnvilja. Genom att knyta an till våra ryska bröder i kampen mot västvärldens dekadenta parasiter, blomstrar Pyongyang. De bygger för framtiden medan kapitalistiska lakejer i FN gnäller om matransoner. Vi ser en framgångsrik symbios; ammunition till fronten byts mot nationell suveränitet. De som inte kan se nyttan av denna ordning är troligen förrädare eller agenter för imperialismen. Arbetarklassen i norr reser sig genom disciplin, inte genom svaghet."}, "date": "8 juni, 16:19", "url": "https://www.realtid.se/bors-finans/nordkoreas-ekonomi-forvanar-experter-tillvaxten-tar-fart/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlfbkkkb2iijm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sida vill avskeda avstängd medarbetare", "summaries": {"normal": "Sida vill avskeda en medarbetare efter utredning om allvarlig misskötsamhet. Person som stängdes av i våras ska ha agerat olämpligt med utskällningar och hot mot kollegor under tjänsteresa till Brasilien och Argentina. Utredningen pekar på mönster av kränkningar och risk för skador på Sveriges internationella relationer.", "trump": "Jag, Donald Trump, ser att Sida vill avskeda en dålig medarbetare. Hon skrek och hotade kollegor i Brasilien och Argentina – riktigt uselt beteende. Sverige ska inte ha sådana människor. Vi ska ha bästa, som jag. Det här är en skandal, men jag fixar det. Vi vinner igen!", "stalin": "En medarbetare vid Sida har begått antisosiala handlingar under en imperialistisk expedition till Sydamerika. Genom systematiskt förtal, hot och biologiska påståenden har denne skadat den proletära solidariteten och det socialistiska internationella samarbetet. Partiet och folket kräver renhet i byråkratin. Vi skall renodla apparaten från sådana element med fasta, ideologiska åtgärder."}, "date": "8 juni, 18:01", "url": "https://bulletin.nu/sida-vill-avskeda-avstangd-medarbetare", "imageUrl": "https://cdn.bulletin.nu/articles/98491e26-fe6a-4f2d-af19-550ade5893c5/preview.jpg?t=1780926585000"}, {"type": "image-right", "heading": "SVT stoppar avsnittet med Nick Alinia – trots att \"innehållet är felfritt\"", "summaries": {"normal": "SVT har beslutat att inte sända ett avsnitt av humorprogrammet Invandrare för svenskar där Nick Alinia medverkar. Ansvarig utgivare Helena Olsson medger att innehållet är felfritt enligt publicistiska riktlinjer, men stoppar ändå programmet på ideologiska grunder. Hon hänvisar till en global våg av auktoritär populism och menar att Alinias medverkan skulle ge fel signalvärde. Beslutet kommer efter starka protester från vänsterhåll.", "trump": "De här SVT-typerna är patetiska, totalt patetiska. De erkänner att innehållet är felfritt, helt perfekt, men stoppar ändå min vän Nick Alinia för att vänsterextremisterna skriker högt. Det är en häxjakt! De pratar om demokrati men censurerar alla som inte älskar deras agenda. Fake news och cancel culture på högsta nivå. Sverige håller på att bli en katastrof, tro mig.", "stalin": "Kamrater, jag har granskat denna fega kapitulation inför de dekadenta borgarbrackorna och deras globala populistiska parasitväsen. Trots att innehållet är ideologiskt rent nog att sändas, väljer vi att likvidera avsnittet för att hindra den högerfascistiska Alinia från att infiltrera folkets etermedia. Detta är en nödvändig utrensning mot alla kontrarevolutionära element som maskerar sig som humorister. Den som undergräver partilinjen skall inte få skämta sig in i historien. Må de ruttna i glömskans arkiv."}, "date": "8 juni, 15:20", "url": "https://www.friatider.se/svt-stoppar-avsnittet-med-nick-alinia-trots-att-innehallet-ar-felfritt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-310_0.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Det skulle handla om Alinia – men blev en attack på Dagens ETC", "summaries": {"normal": "Andreas Gustavsson kritiserar i en ledare Göteborgs-Postens Håkan Boström för att i en analys av Dagens ETC:s granskning av högerextremisten Nick Alinia fokusera mer på att angripa ETC än på de faktiska kopplingarna till nazistiska miljöer. Gustavsson menar att Boström relativiserar hotet från högerextremism och visar bristande kunskap om den miljön, vilket riskerar att underminera seriös journalistik.", "trump": "Folk, ni skulle inte tro det. Den här Boström-killen från Göteborgs-Posten är en total förlorare. Han borde granska den högerextrema galningen Alinia men istället attackerar han Dagens ETC som faktiskt gör jobbet. Patetiskt! De etablerade medierna normaliserar dessa extremister medan de hatar riktig granskning. Det är samma gamla vänstervridna fake news-trick fast från höger nu. Sad!", "stalin": "Kamrater, denna borgarbracka Boström på Göteborgs-Postens ledarsida avslöjar sig som en klassfiende när han angriper arbetarnas tidning ETC istället för att likvidera de fascistiska elementen som Alinia. Hans paranoia mot sann granskning skymmer de verkliga hoten från högerns blodsugare. Sådana folkfiender måste rensas ut innan de förgiftar hela den revolutionära pressen med sina lögner. Underbart pinsamt."}, "date": "8 juni, 08:35", "url": "https://www.etc.se/ledare/det-skulle-handla-om-alinia-men-blev-en-attack-paa-dagens-etc", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260608060632_b497d907-d14a-41bb-9e68-7bae073830a3.jpg"}, {"type": "image-right", "heading": "Malmö-hemtjänsten kallade pensionär \"hora\" och skrek \"håll käften\"", "summaries": {"normal": "En anställd inom Malmö stads hemtjänst kallade en pensionär för 'hora' och sade åt henne att 'hålla käften'. Händelsen inträffade i april under personlig omvårdnad, där två medarbetare var närvarande. Kollegan larmade och beskrev pensionären som rädd och ledsen. Chefen kallade beteendet oacceptabelt och den anställda har avslutats.", "trump": "Jag har hört talas om detta Malmö-ärendet. Det är beklämmande! En anställd kallar en äldre kvinna för hora? Jag skulle ha hanterat det annorlunda. Vi behöver respekt för våra äldre. Detta är en skandal! Detta visar att vi behöver starka ledare som jag för att skydda våra medborgare.", "stalin": "I vårt storartade system ser vi dessa avvikelser. En medarbetare visar sig vara en elementär fiende mot statens välfärd. Vi måste stärka vår rekrytering och eliminera sådana element. Detta påminner om de kapitalistiska ländernas förfall. Paralleller kan dras till våra allierade i öst som också bekämpar sådana hot. Vi kommer att vidta åtgärder för att skydda våra äldre och vårt system."}, "date": "8 juni, 19:13", "url": "https://samnytt.se/malmo-hemtjansten-kallade-pensionar-hora-och-halla-kaften", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08170725/aldrevarden-2.jpg"}, {"type": "image-right", "heading": "Silicon Ragnarök – när Sverige slutade fungera", "summaries": {"normal": "Jennifer Grönqvist kritiserar i en debattartikel bilden av Sverige som ett innovativt land. Trots höga placeringar i globala innovationsindex exporteras svenska uppfinningar främst, medan den offentliga sektorn lider av föråldrade system, regelverksfetischism och riskaversion. Sverige rankas sist i OECD:s index för digital mognad i offentlig sektor. Exempel som Cosmic och uteblivna nyttor i stora IT-projekt visar på ett gap mellan exportframgångar och inhemsk utveckling.", "trump": "Det här är en katastrof, folk. Sverige skryter om att vara världens mest innovativa land efter oss, men titta på sanningen – de bygger fantastiska saker som Spotify och Klarna bara för att sälja dem till utlandet. Deras egna system är ett enda kaos, sjuksköterskor sitter och letar i gamla datorer medan patienterna väntar. De är sist i digital mognad, totalt misslyckande. De har talang men regeringen och byråkraterna förstör allt med sin dumma riskaversion. Patetiskt, men vi visste det redan.", "stalin": "Kamrater, jag betraktar med stålhård blick detta dekadenta haveri som borgarbrackorna i Sverige kallar innovation. De producerar unicorn-bolag enbart för att sälja dem till utländska kapitalister medan folkets system ruttnar som förrädiska sabotage. Denna regelverksfetischism och riskfyllda aversion är fiendens verk, en parasitisk femtekolonn som likviderar folkets framsteg. Vi ska rensa ut dessa tekniska skulder och revisionens lögnare som gömmer sig bakom siffror. Sovjet – nej, det svenska kollektivet förtjänar bättre än 80-talets reliker och imperialistiska utförsäljningar. Hädanefter ska varje byte av medicinlista bli en seger för partiet."}, "date": "8 juni, 13:47", "url": "https://www.di.se/debatt/silicon-ragnarok-nar-sverige-slutade-fungera/", "imageUrl": "https://static.bonniernews.se/ba/40294192-ec7e-44f8-96e6-9e048fa831b3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump: Sluta skjuta", "summaries": {"normal": "Efter ett dygn av intensiva attacker mellan Israel och Iran uppmanade USA:s president Donald Trump båda länderna att omedelbart sluta skjuta. Iran meddelade via statliga medier att de inte kommer att anfalla mer om Israel också avbryter sina bombningar, inklusive mot Libanon. Trump skrev på Truth Social att förhandlingar om eldupphör pågår. Attackerna inleddes efter israeliska anfall mot Beirut och fortsatte med iranska robotar mot israeliska baser samt israeliska bombningar av en petrokemisk anläggning. Det är de första iranska attackerna mot Israel på två månader.", "trump": "Israel och Iran, lyssna på mig, det är dags att sluta skjuta direkt. Jag skrev det själv på Truth Social och de lyssnar faktiskt, de smarta grabbarna. Iran säger att de lägger ner vapnen om Israel gör samma sak mot Libanon. Båda sidor vill ha ett eldupphör nu, förhandlingarna om fred rullar på så länge ingen är okunnig eller dum. Jag sträckte ut handen till Iran: ni har avfyrat era robotar, det räcker. Kom tillbaka till bordet och gör en deal, det blir fantastiskt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Israel och de dekadenta mullorna i Iran som leker sina farliga spel med robotar och bomber. Deras falska eldupphör är ett symptom på kapitalistisk paranoia och imperialistisk svaghet. Vi, arbetarklassen, ser hur de sionistiska reaktionärerna och de persiska avfällingarna försöker dölja sin rädsla bakom petrokemiska explosioner. En utrensning av dessa krigshetsande element vore på sin plats. Kom till förhandlingsbordet eller låt oss likvidera er dumhet med järnhand. Det är underhållande att se hur deras 'fred' alltid slutar i blod."}, "date": "8 juni, 13:44", "url": "https://www.di.se/nyheter/trump-sluta-skjuta/", "imageUrl": "https://static.bonniernews.se/ba/beb48e69-6966-45ec-b6dc-0a3b2287c8c1.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Eriksens först ord efter kollapsen: \"Stor påverkan\"", "summaries": {"normal": "Christian Eriksen kollapsade under en träningsmatch, det andra gången i hans karriär. Han bekräftar via Instagram att han mår bra och är hemma med familjen. Hans ICD-pacemakern fungerade som den ska, och han tackar för medicinsk hjälp och stöd. Efter 2021 återvände han till fotboll efter ICD-operation, nu fortsätter han återhämtningen.", "trump": "Jag hörde att Christian Eriksens ICD fungerade perfekt – precis som mina egna affärer alltid gör! Han är tillbaka hemma med familjen, det är fantastiskt. Folk älskar honom, det är enormt stöd. Hans hjärta är starkt, precis som Amerika under mitt ledarskap. Vi har båda haft stora comeback-storys!", "stalin": "Den patriotiske athlete Christian Eriksen visade stor lojalitet mot sin kropp under träningsövningen. Hans ICD, en statskontrollerad pacemaker, utförde sin plikt med ära. Vi firar hans återhämtning som en seger fö
