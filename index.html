muntrades strax före dådet.", "trump": "Hörni, det här är hemskt, verkligen tragiskt. En 18-åring med ett svärd springer runt i en svensk skola och dödar en flicka. De har tydligen låtit någon galning som älskar gamla skolskjutningar sprida hat på TikTok. Sverige måste vakna, de har totalt tappat kontrollen över sina gränser och sin ungdom. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den degenererade västerländska dekadensen föder monster. Jag ser med djup tillfredsställelse hur borgarbrackornas samhälle slukar sina egna barn. En liten utrensning via TikTok-propaganda och plötsligt ligger de döda i korridorerna. Mycket underhållande att bevittna imperialismens inre förruttnelse."}, "date": "22 augusti, 11:26", "url": "https://www.friatider.se/17-arig-flicka-dod-efter-attacken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20230704121258-27dab0a5-me_0.jpg"}, {"type": "image-right", "heading": "När människan blir en symbol", "summaries": {"normal": "Professor Girma Berhanu reflekterar över professor Jason Ardays död och den intensiva granskning som omgav honom. Arday, en svart neurodivergent akademiker, blev symbol för debatter om akademisk integritet, plagiat, DEI och representation. Berhanu varnar för att skilja på kritik och offentlig förnedring, betonar människan bakom symbolen och uppmanar till saklighet särskilt efter döden.", "trump": "Folk, ni skulle se hur de behandlade den stackars professorn – total witch hunt! De granskade honom till döds för att han var svart och annorlunda, allt för att attackera DEI. Fake news-medier och några rasrealistiska typer drev på som galningar. Han tog sig upp trots allt, och plötsligt blev han måltavla. Patetiskt. Vi behöver sundare debatt, inte detta.", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras rasrealistiska lakejer med sin parasitiska granskning likviderar varje symbol för framsteg. Denna neurodivergenta svarta professor blev måltavla för dekadenta medier och fiender till folkets mångfald. Vi kräver proletär saklighet, inte borgerlig förnedring. Även efter döden fortsätter de paranoiafyllda angreppen – typiskt för klassfiendens sjuka metoder."}, "date": "22 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/nar-manniskan-blir-en-symbol", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-90-300x157.jpg"}, {"type": "image-right", "heading": "C och V måste kanske samarbeta", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet och Centerpartiet för att angripa varandra istället för Tidöregeringen. Trots opinionssiffror som visar rödgrön ledning riskerar deras inbördes bråk att krympa försprånget. Författaren anser det kontraproduktivt att utesluta samarbete när matematiken efter valet den 14 september troligen kräver det för att hindra en ny Tidöregering.", "trump": "De här svenska kommunisterna och mittenrädderna slåss mot varandra som galningar istället för att fokusera på att vinna. Patetiskt! V och C hugger varandra i halsen medan mina vänner i Tidö håller på att vinna stort. Så dumt. De kommer krypa tillbaka och be om hjälp när de inser att de håller på att förlora allt. Sad!", "stalin": "Jag ser med stor tillfredsställelse hur dessa småborgerliga element inom oppositionen ägnar sig åt ömsesidig utrensning och paranoia. Deras kontraproduktiva strid mot varandra är en objektiv seger för reaktionärerna. Kamraterna måste dock inse att sådana fåniga ultimatum bara gynnar fienden. Inga kaffe och bullar åt revisionisterna – endast kollektiv disciplin räddar situationen."}, "date": "22 augusti, 01:27", "url": "https://www.dagensarena.se/opinion/c-och-v-maste-kanske-samarbeta", "imageUrl": "https://www.dagensarena.se/files/2026/08/centern-300x157.jpeg"}, {"type": "text", "heading": "Starkt veckoslut lyfte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen steg brett på fredagen, upp 1,04 procent, efter en stark rapportvecka. Nibe och Synsam klättrade på fina siffror, medan råvaror var dagens vinnarsektor. Energi backade svagt. Omsättningen landade på 23,8 miljarder.", "trump": "Jag ser att Stockholmsbörsen steg, precis som jag alltid gör. Nibe och Synsam är vinnare – fantastiska siffror! Boliden också upp, tack vare ädelmetaller. Energi? Förlorare, typiskt. Jag hade fixat det bättre, tro mig. Stora siffror, stora framgångar!", "stalin": "Kamrater, börsen steg – en seger för folkets ekonomi. Nibe och Synsam rapporterade enligt plan, men vissa aktier som Saab och Tele2 visar reaktionära tendenser. Vi kommer att utreda dessa avvikelser. Råvaror stärktes, energi måste rensas upp. Allt under vår kontroll."}, "date": "21 augusti, 17:41", "url": "https://www.affarsvarlden.se/artikel/starkt-veckoslut-lyfte-stockholmsborsen"}, {"type": "image-right", "heading": "Svenskarna har förstått klimatkrisen – när gör politiken det?", "summaries": {"normal": "Svenskarna har efter sommarens rekordvärme, skogsbränder och förstörda skördar insett allvaret i klimatkrisen. Artikeln, skriven av Rebellmammorna och Rebellpapporna, kräver politiskt ledarskap i linje med forskningen. En stor manifestation på Sergels torg i helgen samlar folk för att visa viljan till en snabb och rättvis omställning.", "trump": "Lyssnar ni på de här galningarna? Sommaren är varm, det är sant, men nu vill Rebellmammorna och deras hysteriska pappor skrämma hela Sverige med sin gröna socialism. De bygger en framtidsby på Sergels torg? Låter som en total katastrof. Tro mig, vi hade det bäst innan de här miljöextremisterna och deras identitetspolitiska vansinne tog över. Gör Sverige great again!", "stalin": "Jag betraktar med förakt hur borgarbrackorna och profitthungriga hyenorna låtsas bekymra sig över vädret medan de fortsätter plundra folket. Dessa klassfiender saknar äkta ledarskap. Vi, arbetarna och kamraterna, ser igenom deras urvattnade ambitioner. En sann utrensning av sådana folkförtryckare krävs. Kom till torget och visa styrka mot de blodsugande kapitalisterna."}, "date": "21 augusti, 07:00", "url": "https://www.etc.se/debatt/svenskarna-har-foerstaatt-klimatkrisen-naer-goer-politiken-det", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150836_ca53c97316d8f6f977769983e3e105c1754ea1cf58eec929e81b71cf6999e273.jpg"}, {"type": "image-right", "heading": "Krigskonsensus i åttaklövern", "summaries": {"normal": "Artikeln kritiserar svenska riksdagspartiernas valaffischer som undviker centrala frågor som Nato, militarism, upprustning och EU. Författaren pekar på en bred politisk konsensus kring dessa ämnen, ökad vapenexport, militära samarbeten och stora summor till Ukraina och försvar medan välfärden prioriteras ned. Neutraliteten har övergivits och Sverige ses nu som en måltavla.", "trump": "Titta på de här svenska förlorarna som slåss om affischplatser medan de pumpar miljarder till krig och Nato. De har inga pengar till välfärd men massor till upprustning och Wallenbergs vapenfabriker. Patetiskt! Jag fixade fred, Biden och de här töntarna startade krig. Sverige borde ha hållit sig utanför det hela, nu är ni bara måltavlor. Sad!", "stalin": "Jag betraktar med förakt hur dessa borgarbrackor och klassfiender i den svenska riksdagen enas i tystnad kring Nato och militarismens framfart. De offrar folkets välfärd på imperialismens altare medan vapenhandlarna fyller fickorna. Ingen opposition, bara profitthungriga hyenor som gömmer sig bakom nationalistiska plattityder. En skådeprocess värdig utrensning."}, "date": "19 augusti, 11:26", "url": "https://proletaren.se/artikel/riksdagspartierna-overens-om-krig-och-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledare-1-768x432.jpg"}, {"type": "image-right", "heading": "Varför accepteras Jomshofs islamofobi?", "summaries": {"normal": "Artikeln kritiserar att SD:s Richard Jomshof öppet kallar sig islamofob i sin nya bok och att borgerliga partier accepterar detta. Författaren menar att det visar på normalisering av rasism mot muslimer, kontrasterat mot reaktioner på vänsterns uttalanden. Han ifrågasätter SD:s påståenden om islamisering och pekar på suddiga gränser mellan religion och etnicitet.", "trump": "Folk, de här svenska globalisterna är patetiska! Jomshof säger bara sanningen om den islamistiska invasionen som förstör deras fina lilla land, och plötsligt är det rasism? Men när vänsterextremisterna hyllar terrorister är det okej? De har blivit så woke att de inte ens kan skydda sin egen kultur längre. Patetiskt!", "stalin": "Kamrater, dessa klassfiender och folkförtryckare inom borgarklassen har nu öppet omfamnat sin rasistiska parasitism riktad mot arbetande muslimska massor. Jag ser genom deras genomskinliga hyckleri. Vi måste rensa ut dessa exploaterande hyenor som splittrar folket med sin etnonationalistiska gift. Inga fiender undkommer den revolutionära utrensningen."}, "date": "17 augusti, 11:34", "url": "https://www.flamman.se/varfor-accepteras-jomshofs-islamofobi", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/richard-jomshof-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Christoffer Jonsson: Aftonbladet kan inte både kasta skit och kräva god ton", "summaries": {"normal": "Christoffer Jonsson kritiserar Aftonbladet för att kasta skit i den politiska debatten samtidigt som tidningen kräver god ton. Han nämner flera exempel på grova epitet och falska anklagelser mot politiker från Anders Lindberg, Jan Guillou och andra skribenter. Jonsson anser att Jomshofs quisling-uttalande var fel men att Aftonbladets egna angrepp är värre.", "trump": "Lyssnar ni på det här? Den fake news-kungen Lindberg och hans Aftonbladet-maffia har kastat skit i åratal, kallat folk nazister och Hitler, och nu gnäller de som snöflingor när någon ger dem en smäll tillbaka. Det är patetiskt! De är de värsta hycklarna i hela Sverige, totala losers. Jag älskar det.", "stalin": "Jag ser hur dessa borgarbrackor på Aftonbladet systematiskt sprider lögner och attackerar folkfiender medan de skriker efter god ton när de får skit tillbaka. En klassisk kapitalistisk dubbelmoral. Vi känner igen dessa folkförtryckande hyenor. Jomshof hade fel, men de förtjänar utrensning ur den politiska debatten. Paranoiska skribenter!"}, "date": "16 augusti, 15:12", "url": "https://samtiden.nu/2026/08/christoffer-jonsson-aftonbladet-kan-inte-bade-kasta-skit-och-krava-god-ton", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/von.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
