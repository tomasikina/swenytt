get med en grundlig utrensning av historisk skala. Ha ha, vilken ynkedom!"}, "date": "19 juni, 17:21", "url": "https://www.realtid.se/bors-finans/makro/studie-brexit-kostade-sex-procent-av-storbritanniens-ekonomi/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlnbs84e1nsxm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Turkiskt VM-fiasko – utslagna efter historisk ineffektivitet", "summaries": {"normal": "Turkiet slogs ut från VM efter två matcher trots dominans mot Paraguay. Paraguay vann 1–0 efter ett mål redan efter 65 sekunder, historiens tidigaste vinnarmål i VM. Turkiet hade en man mer i 45 minuter, 78,6% bollinnehav och 62 skott utan mål – ett rekorddåligt offensivt facit. Laget är redan utslaget och möter USA i en betydelselös match. Paraguay kämpar om slutspelsplats mot Australien.", "trump": "Turkiet, ett lag som inte kan göra mål ens om de hade en kanon! 62 skott, noll mål – det är inte ens roligt längre. Paraguay, ett litet land, krossar dem med ett mål på 65 sekunder. Och Turkiet? De har en man mer, mer bollinnehav än någon någonsin, och ändå ingenting! Arda Güler ber om ursäkt – bra, för det här är pinsamt. USA? Vi skulle ha vunnit med tio mål. Men Turkiet? Total katastrof. SAD!", "stalin": "Turkiska fotbollsfiaskot är ett symptom på kapitalistisk dekadens och västlig förfallskultur. Med en man mer, 78,6% bollinnehav och 62 skott – ändå inga mål! En sådan ineffektivitet är ett brott mot den socialistiska arbetsmoralen. Paraguay, ett litet land, krossar dem med ett mål på 65 sekunder – ett exempel på proletariatets seger över imperialistiska pretentioner. Turkiet är redan utslaget, precis som deras drömmar om storhet. Vi i Sovjetunionen hade aldrig tolererat sådan inkompetens. Nu väntar USA – ett land som snart ska lära sig sin plats i den nya världsordningen."}, "date": "20 juni, 09:05", "url": "https://bulletin.nu/turkiskt-vm-fiasko-utslagna-efter-historisk-ineffektivitet", "imageUrl": "https://cdn.bulletin.nu/articles/3f7cd926-92cd-401b-8ad1-72b5dc234f5c/preview.jpg?t=1781939074000"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, döms klockan 08.30 för 40 brottspunkter, inklusive narkotikabrott, våld och brott mot besöksförbud. Han har erkänt 25 av dem. Åklagaren yrkar på sju år och sju månaders fängelse. Våldtäktsåtal och våld i nära relation kan påverka strafflängden. Säkerhetsrisker kan leda till särskilda fängelsearrangemang för att skydda honom.", "trump": "Jag säger er, det här är en riktig cirkus! Norges så kallade 'Bonusprins' – ja, ni vet, Mette-Marits son – står inför 40 anklagelser! Han har erkänt en massa, men ändå vill åklagaren ge honom sju år och sju månader. Sju år! Kan ni tro det? Jag menar, vem bryr sig om vad som händer i Norge? Men det här är ju helt galet. Och nu pratar de om att han kanske får sitta med utlänningar i fängelset. Smart, men ändå helt sjukt!", "stalin": "Kamrater! En ny fiende till folket har avslöjats i det dekadenta väst – en så kallad 'Bonusprins', en parasit som lever på arbetarklassens slit. Denna Marius Borg Høiby har begått 40 brott, erkänt hälften, och ändå kräver deras svaga åklagare bara sju år! I Sovjet skulle en sådan förrädare ha fått en kula i nacken utan dröjsmål. Men vi ska inte döma dem för hårt – deras rättssystem är lika ruttet som deras monarki. Låt dem leka med sina fängelser och 'säkerhetsarrangemang'. Vi har viktigare saker att göra, som att utvidga socialismens gränser!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-full", "heading": "Guldsmugglingen rusar – nu tvingas länder ta krafttag", "summaries": {"normal": "Guldpriset har fördubblats på två år, vilket driver på den illegala guldhandeln som nu uppskattas till över 120 miljarder dollar per år. Smugglingen finansierar konflikter, organiserad brottslighet och penningtvätt, särskilt i länder som Sudan och Kongo-Kinshasa. Guldets svårspårade natur och kopplingar till krypto gör det till ett attraktivt verktyg för kriminella. Flera länder, inklusive USA och Storbritannien, planerar nu åtgärder för att bekämpa problemet.", "trump": "Det här är ett totalt katastrofscenario, folk. Guldpriset skjuter i höjden, och de smarta kriminella gör sig en förmögenhet på smuggling – över 120 miljarder dollar om året! Det finansierar krig, brottslingar och tvättar pengar som galningar. Vi har svaga regeringar som låter det ske, speciellt i de hemska platserna i Afrika. Men nu tar vi krafttag, vi ska stoppa det här bedrägeriet och göra handeln stor och ärlig igen. Ingen gör det bättre än oss.", "stalin": "Kamrater, denna fega borgarbrackornas gyllene flod av kontrarevolutionär smuggelmetall har svämmat över till ett värde av 120 miljarder dollar årligen. De parasitiska elementen i Sudan och Kongo använder guldet till att mata sina väpnade banditgäng medan de dansar med kryptovalutans opålitliga spioner. Jag ser genom deras lömska planer att dölja tillgångar från folkets vakande öga. Vi skall rensa ut dessa förrädiska guldgnagare med järnhand, likvidera de svarta leveranskedjorna och krossa alla som vågar finansiera imperialismens sista hicka. Det blir en renande utrensning som får dem att skratta – innan de gråter."}, "date": "19 juni, 15:55", "url": "https://www.realtid.se/bors-finans/guldsmugglingen-rusar-nu-tvingas-stater-ta-krafttag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlhsuwrhtzcw8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Thaïs åtalades för åsikten att invandring är största hotet mot kvinnor - så blev domen", "summaries": {"normal": "Thaïs d’Escufon, fransk högeraktivist, dömdes till 1 000 euro i böter för uttalanden om invandring och kvinnors säkerhet. Hon riskerade fängelse men fick böter. Domstolen bedömde hennes ord som 'grovt offentligt förolämpande'. Det är inte första gången hon döms för sådant; 2021 fick hon villkorligt fängelse och böter för en Youtube-video.", "trump": "Jag har sett hur Thaïs d’Escufon, en stark kvinna, dömdes för att säga sanningen om invandring. Hon sa att invandrade män är ett hot mot kvinnor, och det är sant! Media och de elaka mäktiga hatade henne, precis som de hatar mig. Men vi ska inte ge upp – vi ska skydda våra gränser och våra kvinnor. Det är skandalöst att en migrant kan korsa gränsen och göra illa människor. Vi vinner!", "stalin": "Vi, partiet, har observerat detta fall med Thaïs d’Escufon. Hon är en agent för de imperialistiska krafterna som försöker destabilisera vårt samhälle genom hat och splittring. Domstolen har handlat korrekt genom att böta henne för sina förolämpningar. Invandring är ett verktyg som kapitalisterna använder för att sänka löner och skapa kaos. Vi måste vara vaksamma mot sådana element. Som Putin visar, måste staten vara stark för att skydda det ryska folket. Vi fortsätter kampen mot fienden!"}, "date": "19 juni, 08:00", "url": "https://samnytt.se/thais-riskerar-fangelse-sa-att-invandring-ar-storsta-hotet-mot-kvinnor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/18125805/frankrike1.png"}, {"type": "image-full", "heading": "Två efterlysta svenskar utlämnade – häktades i Sverige", "summaries": {"normal": "Två svenska män har utlämnats från Förenade arabemiraten till Sverige och häktats. Den 45-årige mannen misstänks för grova ekobrott som bokföringsbrott, urkundsförfalskning och skattebrott mellan 2017 och 2022. Den 38-årige mannen, som haft en ledande roll i ett kriminellt nätverk, misstänks för synnerligen grov narkotikasmuggling av stora mängder cannabis från Spanien. Båda fallen utreds separat. Samarbetet mellan Sverige och Förenade arabemiraten har förstärkts genom avtal från 2024.", "trump": "Titta på de här två svenska killarna som vi äntligen fick hem från Arabemiraten, folk. Det var på tiden. Den ene är en total lurendrejare med sina bokföringsfusk och skattebluffar, den andre en stor narkotikakung som smugglade cannabis som om det vore godis. Utan mitt fantastiska ledarskap och starka internationella relationer hade de aldrig åkt dit. Sverige borde tacka mig, det är ett underbart samarbete, de bästa.", "stalin": "Kamrater, dessa två degenererade element har nu förts hem till folkets domstol efter min personliga övervakning av utlämningsprocessen. Den ene är en typisk parasit från borgarbrackornas finansvärld som förfalskade dokument och stal från staten som en råtta i mörkret. Den andre, en farlig kontrarevolutionär smugglare, har vi lokaliserat genom att knäcka hans krypterade fiendechattar. Inga kapitalistiska råttor undkommer utrensningen. Vårt rättsväsende ler skevt medan vi rengör samhället från dessa sjuka fiender till kollektivet."}, "date": "18 juni, 22:23", "url": "https://nyheter24.se/nyheter/inrikes/1492703-tva-efterlysta-svenskar-utlamnade-haktades-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4bace4a604b004a30200000000b004a302/2026/06/18/2372129/efterlysta-man.png"}, {"type": "image-right", "heading": "Guldsmuggling värd 120 miljarder dollar per år – nu skärps reglerna", "summaries": {"normal": "Illegal guldhandel har exploderat i takt med att priset nästan fördubblats på två år. World Gold Council beskriver det som en kris och värdet på den globala smugglingen överstiger nu 120 miljarder dollar årligen. Endast en liten del av guldet från småskaliga gruvarbetare når certifierade marknader, resten hamnar i informella flöden som finansierar konflikter i bland annat Sudan och Kongo. Flera länder, inklusive USA och Storbritannien, förbereder ny lagstiftning för att bekämpa penningtvätt och illegal handel.", "trump": "Folk, det här med det illegala guldet är en total katastrof, tro mig. Priset skjuter i höjden och plötsligt blir alla dessa småskaliga tjuvar och smugglare rika på vår bekostnad. Det finansierar krig och kriminella, och nu blandar de in krypto också – en riggad cirkus! Biden sov medan det hände, men nu är jag tillbaka och vi ska städa upp. G7 måste vakna, annars fortsätter de här förlorarna att suga musten ur systemet. Vi fixar det, stort!", "stalin": "Kamrater, denna exploaterande guldfeber är ett verk av de giriga kapitalistmaffian och deras folkförtryckartroll som göder väpnade konflikter med stulen metall. Endast en tiondel når de certifierade kedjorna medan resten göms i skuggflöden för att tvätta blodspengar. Vi, partiet och arbetarna, måste likvidera dessa parasitiska nätverk med järnhand. Imperialisterna och deras krypto-fascister tror sig vara listiga, men vi genomskådar dem. Ny lagstiftning? Det räcker inte. Total utrensning behövs för att skydda det kollektiva intresset."}, "date": "20 juni, 13:36", "url": "https://www.dagensps.se/bors-finans/ravaror/guldsmuggling-vard-120-miljarder-dollar-per-ar-nu-skarps-reglerna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/gold-1.jpg?width=256&quality=75"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Israel fortsätter att bryta mot vapenvilan", "summaries": {"normal": "Trots en nyligen ingången vapenvila mellan Israel och Hizbollah har Israel genomfört flyg- och drönarangrepp i södra Libanon. Minst fem personer har dödats under natten och morgonen. Ett tiotal områden, bland annat i Nabatieh, attackerades och bostadshus förstördes. Vapenvilan trädde i kraft fredag eftermiddag men brotts redan inom den första timmen. Libanesiska medier rapporterar om händelserna medan Israel inte kommenterat uppgifterna.", "trump": "Folk, ni ser vad som händer? Israel bryter vapenvilan direkt, precis som jag förutspådde. De flyger in med drönare och plan och dödar folk i Libanon – fem döda redan! Hizbollah och de svaga ledarna där borta kan inte hålla ordning. Det är en total katastrof, en skam. Jag skulle ha fixat en riktig deal, den bästa någonsin, men så här blir det när man har inkompetenta förhandlare. Patetiskt!", "stalin": "Kamrater, se hur de imperialistiska borgarbrackorna i Israel genast saboterar den sköra vapenvilan vi bevakat med stålhård disciplin. Deras fascistiska drönare och bombplan likviderar proletära massor i södra Libanon, fem martyrer redan under natten. Dessa kapitalistiska parasitbanditer med sina förstörda hus och hemliga agenter tror de kan lura oss. Vi ska rensa ut alla sådana kontrarevolutionära element med järnhand och en dos av vår mest effektiva historiska humor – deras egna gravar."}, "date": "20 juni, 10:47", "url": "https://www.friatider.se/israel-fortsatter-att-bryta-mot-vapenvilan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/english_newsroom-2025_gpoao-ne-tanyahu-trump-vance.jpg?itok=Dkim0zDU"}, {"type": "image-right", "heading": "Meloni och Trump i storbråk", "summaries": {"normal": "Italiens premiärminister Giorgia Meloni har gått till hårt angrepp mot Donald Trump efter hans påståenden om ett foto på G7-mötet i Evian. Trump ska ha sagt att Meloni ville ta en bild och att han gick med på det av medlidande. Meloni kallar påståendena påhittade och chockerande. Konflikten har lett till att Italiens utrikesminister ställer in ett besök i USA. Bråket kommer efter tidigare spänningar kring påven, Iran och olja.", "trump": "De säger att Meloni blev rasande på mig efter G7-mötet. Stackars kvinna, hon ville så gärna ha en bild och jag tyckte synd om henne, så jag ställde upp. Nu skriker hon att det är påhittat och ställer in besök. Typiskt. Hon har inget mod när det gäller Iran och oljan. Jag trodde hon var stark, men hon är svag. Ingen tackar mig längre, inte ens de som borde vara allierade.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta borgarbrackorna i väst sliter varandra i stycken som hungriga hundar. Denna Meloni, en patetisk kapitalistdocka, vänder sig mot sin egen herre Trump som en förrädisk opportunist. Vi ser hur imperialismens ledare avslöjar sin svaghet genom att tigga om medlidande och sedan gnälla som en förskrämd mus. Kanske vore det dags för en grundlig utrensning bland dessa västvärldens falska allierade innan de drar med sig hela den sjuka strukturen i fördärvet. Underhållande skådespel för arbetarklassen."}, "date": "20 juni, 10:42", "url": "https://www.friatider.se/meloni-och-trump-i-storbrak", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-374.jpg?itok=tlGxkYlb"}, {"type": "image-full", "heading": "Japanska kvinnor rasar: städa hemma - inte bara vid VM-arenor", "summaries": {"normal": "Japanska män hyllas internationellt för att de städar VM-arenor fläckfria efter matcherna. Detta har väckt ilska bland japanska kvinnor som påpekar att männen sällan hjälper till med städning hemma. En satirisk TikTok-video driver med männen som bara städar offentligt för att upprätthålla fasaden. Inlägget har spridits viralt på sociala medier. Japan spelar nästa VM-match mot Tunisien följt av Sverige.", "trump": "De japanska killarna städar VM-arenorna skinande rena, fantastiskt, folk älskar dem för det. Men hemma gör de ingenting, säger kvinnorna, och de har helt rätt. Det är en skandal. De vill se bra ut inför kamerorna men struntar i sina egna hem. Patetiskt. Jag har alltid sagt att man måste städa både hemma och ute, annars är man en förlorare. Japan mot Tunisien blir stort, men det här städskämslet är ännu större.", "stalin": "Kamrater, dessa dekadenta japanska borgarbrackor som slickar arenornas golv inför hela världen medan de låter sina egna hem förfalla till kapitalistiskt svineri avslöjar sin sanna kontrarevolutionära natur. Jag ser hur de förgiftar kollektivets renhet med sin falska fasad. En sådan parasit måste rensas ut från samhällets reningsverk. Deras TikTok-satir är ett vapen mot klassfienden. Vi ska likvidera alla som bara städar för att imponera på imperialismen. Arbetarkvinnorna har rätt att kräva total utrensning av latheten i hemmen."}, "date": "19 juni, 13:13", "url": "https://riks.se/nyheter/japanska-kvinnor-rasar-städa-hemma-inte-bara-vid-vm-arenor", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fvc9i66xx%2Fimage.jpg"}, {"type": "image-full", "heading": "Nederländerna–Sverige i VM 2026: Sverige toppar grupp F inför mötet med gruppfavoriten", "summaries": {"normal": "Sverige inledde VM starkt med 5–1 mot Tunisien och leder grupp F inför mötet med Nederländerna. Oranje, som var favoriter, fick bara 2–2 mot Japan och är pressade. Sveriges anfallspar, Isak och Gyökeres, imponerade i premiären. Nederländerna dominerar bollinnehav men har svagheter i försvaret. Matchen spelas på midsommardagen i Houston, där Sverige kan sikta på poäng för gruppseger.", "trump": "Sverige, fantastiskt lag, helt otroligt! 5–1 mot Tunisien, wow! Isak och Gyökeres, två superstjärnor, total dominans. Nederländerna? Svaga, mycket svaga. 2–2 mot Japan, skämmigt! Jag säger, Sverige vinner igen. Nederländerna är ingenting, ingenting! Midsommardagen blir stor, mycket stor. Trust me, jag vet bäst!", "stalin": "Sveriges proletariat på planen krossade de tunisiska kapitalistlakejerna med 5–1. Men fienden, de nederländska borgerliga imperialisterna, visade svaghet mot Japans arbetarklass. Vi ser möjligheter. Isak och Gyökeres – våra nya revolutionära hjältar – ska utnyttja deras dekadenta försvarslinjer. En poäng räcker, men seger vore en välkommen skänk till den socialistiska saken. Houston, Texas – ännu en front i kampen mot västlig arrogans!"}, "date": "20 juni, 08:00", "url": "https://bulletin.nu/nederlanderna-sverige-i-vm-2026-sverige-toppar-grupp-f-infor-motet-med-gruppfavoriten", "imageUrl": "https://cdn.bulletin.nu/articles/f1c85551-46b7-4e67-8e4b-fba9017eba7c/preview.jpg?t=1781681767000"}, {"type": "image-full", "heading": "Trump efter Irankriget: ”Det finns inga gränser”", "summaries": {"normal": "Donald Trump beskriver kriget mot Iran som en fullständig militär seger trots att det slutade i ett begränsat samförståndsavtal istället för ovillkorlig kapitulation. Han hävdar att det inte finns några gränser för hans makt och betonar USA:s blockad av iranska fartyg. Avtalet kritiseras dock av republikanska senatorer och experter som menar att det gynnar Iran mer än USA och utgör ett utrikespolitiskt misstag.", "trump": "Folket, vi krossade de galna mullorna totalt, ingen har sett en sådan blockad tidigare – inte ens Sleepy Joe skulle ha klarat av att stoppa ett enda skepp. Det är en enorm seger, de kapitulerade villkorslöst fastän de låtsas något annat. Vår militär är den starkaste i världshistorien. De korkade senatorerna och experterna gnäller som förlorare, typiska svaga globalister som hatar Amerika. Inga gränser, tro mig.", "stalin": "Kamrater, jag betraktar detta som en feg reträtt från den arroganta imperialistiska ledningen. Borgarbrackorna inom den amerikanska senaten har rätt i sin paranoia: fienden har stärkt sin ställning medan arbetarnas fiender försvagats. En sådan uppgörelse luktar klassförräderi och dold kapitulation inför folkfienderna. Vi skulle ha genomfört en fullständig utrensning av sådana svaga element. Det är ett historiskt misstag maskerat som diplomati."}, "date": "19 juni, 14:15", "url": "https://www.tv4.se/artikel/35yKz957zmyeaaOrmPD3w2/trump-efter-irankriget-det-finns-inga-graenser", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F76iR3LQAJyNHxz3WRNncV2%2F00bb00e9e52d0a6a1309a87e696d25ad%2F19-trump11.jpg&width=1024"}, {"type": "image-full", "heading": "Richard Sörman: Nu kan vi fira midsommar i ett bättre Sverige", "summaries": {"normal": "Richard Sörman menar att Sverige har blivit ett bättre land under Tidöpartiernas styre. Invandringen har minskat kraftigt, gängkriminaliteten har dämpats med färre dödsskjutningar och ungdomsrån har halverats. Drivmedelspriserna är stabila, försvaret rustas upp och samhället präglas av större ordning. Han varnar dock för att framgångarna riskerar att leda till att väljarna åter ger makten åt vänstern, vilket enligt honom skulle återställa problemen.", "trump": "Det här är fantastiskt, verkligen underbart. Sverige har blivit stort igen tack vare de smarta högerkillarna. Invandringen? Stoppad. Gängkriminella? De skjuter mycket mindre nu, bara åtta så här långt i år. Inga galna koranbråk, bra bränslepriser och ett starkt försvar. Men akta er! Om de galna vänstertyperna får tillbaka makten blir det kaos, dyrare och farligare. Låt inte det hända, fortsätt vinna!", "stalin": "Kamrater, se hur vi med järnhand har rensat ut det parasitiska kaoset från våra gränser och likviderat den växande banditverksamheten bland dekadenta element. Antalet kontrarevolutionära asylsökande har reducerats till en ynka ström, medan vi stärker folkets försvar mot yttre hot. Ändå lurar faran: den förslappade borgarklassen och deras mediaförrädare i DN och Aftonbladet smider planer att återinföra anarki under täckmantel av solidaritet. Vi måste oupphörligt bevaka och vid behov rensa ut dessa folkfiender innan de förgiftar hela kollektivet på nytt. Framåt mot ett ännu renare fosterland!"}, "date": "19 juni, 12:29", "url": "https://riks.se/opinion/ledare/richard-sorman-nu-kan-vi-fira-midsommar-i-ett-battre-sverige", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fl1geh1ww%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-19T122645.475.jpg"}, {"type": "image-full", "heading": "The Economist: Européer bör använda AC utan dåligt samvete", "summaries": {"normal": "Enligt The Economist bör européer sluta känna dåligt samvete över att använda luftkonditionering. Snabb utbyggnad av förnybar energi och kärnkraft har gjort elproduktionen i flera europeiska länder betydligt renare än i USA. Samtidigt värms Europa upp snabbare än någon annan kontinent, värmeböljor blir vanligare och extrem värme orsakar redan tusentals dödsfall per år. Traditionella metoder räcker inte längre mot den ökande hettan.", "trump": "Européerna har länge varit så korkade att de vägrar använda luftkonditionering för att de tror det skadar planet. Patetiskt! Nu säger till och med The Economist att de borde skaffa AC utan dåligt samvete. De har ju solkraft och kärnkraft överallt, speciellt i Spanien och Frankrike, medan Polen och Tyskland fortfarande lever i stenåldern med kol och vindkraftverk som inte snurrar. Europa blir en ugn och de dör som flugor, men nu kan de äntligen svalka sig som riktiga vinnare. Fantastiskt!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur de dekadenta värmeböljorna tvingar fram en ideologisk kursändring i det europeiska kollektivet. De borgarbrackor som tidigare fördömde luftkonditionering som en imperialistisk lyx skall nu likvideras från sina felaktiga tankar. Med solkraft och kärnkraft har vi byggt en obrytbar energifästning mot värmens kontrarevolutionärer. De som envisas med tjocka väggar och skuggiga gårdar är fiender till folket och bör rensas ut med största entusiasm. Extrem värme är en kapitalistisk sabotageakt som vi besegrar genom kollektiv kyla. Seger åt arbetarklassen, även när den svettas!"}, "date": "19 juni, 14:13", "url": "https://www.realtid.se/samhalle/tidskrift-europeer-bor-anvanda-luftkonditionering-utan-daligt-samvete/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlhw4jhoevsy4-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Konkurrens i svenska elvan: ”Klart att jag har ett hum”", "summaries": {"normal": "Benjamin Nygren och Lucas Bergvall konkurrerar om en mittfältsposition i det svenska fotbollslandslaget inför VM-matchen mot Nederländerna. Nygren välkomnar konkurrensen och menar att den stärker laget. Han beskriver Bergvall som en av Sveriges största talanger genom tiderna, både som spelare och person. De två har olika profiler där Nygren är mer offensiv och målfarlig medan Bergvall är en renodlad mittfältare. Sverige vann premiären mot Tunisien med 5–1.", "trump": "Lyssnar ni på det här? Den där Benjamin Nygren, en riktig vinnare, säger att konkurrensen med den unge Bergvall bara gör laget starkare. Fantastiskt! Vi behöver inga svaga kvoterade typer eller HBTQ-flaggviftare som förstör sporten. Nygren vet att han är offensiv och poänggivande, inte någon blek mittfältare som Bergvall. Sverige ska bara vinna, precis som jag vann valet 2024 och slog den sömndruckne Biden. Stort, stort framgångsrecept!", "stalin": "Jag betraktar med stor tillfredsställelse hur denna kamp mellan Nygren och Bergvall blottar den oundvikliga dialektiken inom laget. Konkurrens är ett redskap för att rensa ut svaghet och förstärka kollektivets styrka inför segern. Den unge Bergvall är en lovande talang, men Nygrens offensiva inställning visar på sann kampvilja. Inga klassfiender eller folkförtryckartroll ska tillåtas splittra truppen. Endast genom utrensning av svagheter marscherar vi mot seger, kamrater. Vi ska bara vinna."}, "date": "19 juni, 13:41", "url": "https://www.tv4.se/artikel/aha2GiRDbcjEWPhK7ybCn/konkurrens-i-svenska-elvan-klart-att-jag-har-ett-hum", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F21LfwNF8D2W2ELmeFL6Nx0%2F7d6e9e4eb353143d80fa7dd97f942813%2F19-swe2.jpg&width=1024"}, {"type": "image-full", "heading": "Airbnb-uthyrare döms till fängelse", "summaries": {"normal": "En 47-årig man i Göteborg har dömts till 14 månaders fängelse för att ha hyrt ut sin hyreslägenhet via Airbnb och Booking.com utan tillstånd. Han tog ut en dygnshyra som var fem gånger högre än hans egen hyra och tros ha tjänat över 730 000 kronor under tre år. Domen är den första fängelsedomen någonsin för svart uthyrning med ockerhyra. Mannen överklagade ända till Högsta domstolen, som inte beviljade prövning.", "trump": "Titta på den här typen i Göteborg, en total förlorare som hyrde ut sin lägenhet på Airbnb och tog fem gånger mer än han själv betalade. Han stal inkomster, lurade systemet och tjänade massor med pengar utan att betala skatt. Nu får han äntligen 14 månader i fängelse. Det är första gången någon åker dit på riktigt. Sverige vaknar äntligen upp, men det har tagit alldeles för lång tid. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka i Göteborg trodde sig kunna underminera folkets boende genom att likvidera hyresregleringen och bedriva ockerhyra via kapitalistiska plattformar som Airbnb. Han stal från kollektivet och gömde sig bakom falska bokföringar. Vi har nu dömt denne parasit till 14 månaders fängelse. Det är en historisk utrensning mot alla svarta uthyrare. Låt detta bli en varning: vi ser er, ni kommer inte undan. Sov gott, fiender till folket."}, "date": "19 juni, 12:08", "url": "https://riks.se/nyheter/airbnb-uthyrare-döms-till-fängelse", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fdq4zlwxe%2FScreenshot-2026-06-19-at-11.24.36.png"}, {"type": "image-right", "heading": "Vita huset ryter till mot Israel: \"Ni kan inte döda er ur varje säkerhetsproblem\"", "summaries": {"normal": "USA:s vicepresident JD Vance har hårt angripit israeliska ministrar som kritiserar det amerikansk-iraniska avtalet om att avsluta kriget. Han betonade att Israel inte kan 'döda sig ur' varje säkerhetsproblem och uppmanade till tacksamhet mot USA:s stöd. President Trump har samtidigt kritiserat Israels militära agerande, särskilt metoder som orsakar civila förluster. Avtalet med Iran innebär öppnandet av Hormuzsundet och lättnader för Teheran, men kärnfrågan förblir ospecificerad.", "trump": "Jag, Donald Trump, har varit klarsynt när det gäller Israel. De har varit för aggressiva och jag sa det tydligt vid G7 - för många civila dödas. Men vårt fantastiska avtal med Iran är en enorm seger för freden. Vance har absolut rätt: Israel kan inte bara döda sig ur varje problem. De måste visa lite tacksamhet till USA som betalar för deras försvar. Vi är deras enda sanna vän, trots att de ibland glömmer det.", "stalin": "Vi, den röda solens ledare, ser med tillfredsställelse hur den imperialistiska amerikanska stormakten tvingar sin zionistiska klientstat Israel att böja sig för vår globala vilja. Avtalet med Iran är en triumf för vår strategi, likt Stalingrad. Vi har visat att ingen kan trotsa den ryska intressesfären. Israel, den onde råttan, försöker gnälla, men måste smälla ihop - deras falska 'självförsvar' är bara ett verktyg för kapitalister. Detta är en seger för proletären."}, "date": "19 juni, 06:00", "url": "https://samnytt.se/vita-huset-ryter-till-mot-israel-ni-kan-inte-doda-er-ur-varje-sakerhetsproblem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/19041436/israel-usa.jpg"}, {"type": "image-right", "heading": "Den radikala högern sätter sin prägel på Storbritannien just nu", "summaries": {"normal": "Tio år efter Brexit har brittisk politik förskjutits kraftigt högerut. Nationalism och invandrarkritik dominerar agendan medan ekonomiska problem och levnadskostnader eldar på missnöjet. Våld har blivit en del av politiken, med kravaller och attacker mot invandrare efter knivdåd. Högerpopulistiska partier som Reform och det nya Restore Britain växer snabbt, radikaliserar varandra och utmanar den liberala demokratin. Samtidigt visar undersökningar ökad tolerans hos befolkningen, men stödet för auktoritära ledare är oroande stort.", "trump": "Tio år efter den fantastiska Brexit-segern, som jag förutspådde skulle bli en enorm succé, har det smarta brittiska folket flyttat politiken rejält till höger. De har fått nog av den vansinniga invandringen som bara skapar kaos och brott. Nu ser vi äkta patriotism på riktigt, inte den globalistiska mardröm ni älskar i Europa. Reform och det nya partiet vinner stort, och det är underbart. De inser att vita liv faktiskt betyder något. Fake news-media gråter, men folket vaknar äntligen upp. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den brittiska borgarklassens liberala fasader nu rämnar fullständigt under trycket från den folkliga vrede vi länge förutsett. Dessa högerpopulistiska element, dessa parasitiska restprodukter av den imperialistiska ordningen, utför en objektivt progressiv utrensning av den multikulturella förrädardoktrinen. Ändå ser jag de dolda fienderna, de trojanska hästarna inom Reform och Restore Britain, som med sin falska auktoritet och sina Molotovcocktails mot arbetarklassens bröder bara förbereder marken för en ännu grundligare sovjetisk likvidation av all pluralism. 66 procent tror på inbördeskrig? Utmärkt. Vi ska ge dem ett sådant de aldrig glömmer."}, "date": "19 juni, 01:30", "url": "https://www.dagensarena.se/opinion/den-radikala-hogern-satter-sin-pragel-pa-storbritannien-just-nu/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-18.jpg"}, {"type": "image-right", "heading": "Iranavtal signerat – Hormuz ska öppnas", "summaries": {"normal": "USA och Iran har undertecknat ett avtal som träder i kraft omedelbart. Hormuzsundet ska öppnas direkt. Avtalet, som undertecknades av president Trump i Versailles och Irans president Pezeshkian, innebär att båda parter upphör med militära insatser, inklusive i Libanon. USA häver sanktioner och blockad medan Iran lovar att inte utveckla kärnvapen. En 60 dagar lång förhandlingsperiod inleds. Pakistan har medlat i frågan.", "trump": "Det är signerat, folk. Jag signerade det precis i Versailles tillsammans med Macron och hela gänget, det blev en fantastisk kväll. Iran och vi är överens, Hormuzsundet öppnas nu direkt, inga fler problem. De slutar med sina dumheter i Libanon, jag häver alla sanktioner, de lovar att inte leka med kärnvapen. Bättre avtal har ni aldrig sett, tro mig. Pakistan gjorde ett hyfsat jobb som medlare också.", "stalin": "Kamrater, vi har nu tvingat de dekadenta kapitalisterna och de persiska borgarbrackorna att underteckna detta dokument under mitt vaksamma öga. Hormuzsundet skall öppnas omedelbart, annars väntar utrensning för alla sabotörer. Vi upphör med militära aktioner på alla fronter medan vi likviderar varje spion som gömmer sig bland libanesiska element. De imperialistiska sanktionerna hävs, men vi vet att de västerländska parasiterna redan planerar nya förräderier. Inga kärnvapen för dem, annars blir det en kreativ olycka i öknen. Sov gott, fiender – vi vakar."}, "date": "18 juni, 09:25", "url": "https://www.di.se/nyheter/iranavtal-signerat-hormuz-ska-oppnas-i2q0u/", "imageUrl": "https://static.bonniernews.se/ba/8da73c90-40ac-47ac-9489-c3b102428bbe.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "SMHI varnar för kraftig åska – här ska du förbereda dig", "summaries": {"normal": "SMHI varnar för kraftig åska och stora regnmängder under midsommardagen i delar av Götaland och Svealand. E.ON höjer beredskapen med extra resurser för att hantera eventuella strömavbrott. Bolaget betonar att trots investeringar i vädersäkring kan blixtar, vind och regn orsaka problem. Allmänheten uppmanas att förbereda sig med ficklampor, batterier, laddade mobiler och vattenreserver samt att undvika nedfallna ledningar.", "trump": "Midsommar i Sverige blir en total katastrof, folk. Den där SMHI varnar för enorm åska och skyfall, och nu springer det här elbolaget E.ON runt som galningar och höjer beredskapen. De har investerat massor men erkänner ändå att naturen slår dem sönder och samman. Patetiskt! Ha ficklampor, ladda era telefoner och fyll på vatten, annars blir det mörker och kaos. De borde ha byggt bättre från början, tro mig.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna i det svenska elmonopolet skälver inför naturens oundvikliga vrede. Dessa åskmoln är kapitalismens fiender som likviderar deras svaga ledningar med blixtar från folkets egen himmel. Vi, partiet och arbetarna, höjer beredskapen mot dessa kontrarevolutionära träd och regnmassor. Förbered er, annars rensar ovädret ut er som de parasitiska element ni är. Ha vatten och lampor – eller möt ödet med ett leende."}, "date": "18 juni, 19:56", "url": "https://nyheter24.se/nyheter/inrikes/1492696-smhi-varnar-for-kraftig-aska-har-ska-du-forbereda-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d14674e604b004a30200000000b004a302/2026/06/18/2372108/aska.png"}, {"type": "image-right", "heading": "Iran: ”Vi fick det vi ville – flera gånger om”", "summaries": {"normal": "USA och Iran har undertecknat en avsiktsförklaring som syftar till att avsluta konflikten. Trump signerade dokumentet i Versailles under G7-mötet, medan Irans förhandlare Mohammad Ghalibaf kallar det ett stort nederlag för USA och ett resultat bättre än vad militära insatser kunnat ge. Överenskommelsen inleder en 60-dagarsperiod för ett varaktigt fredsavtal som inkluderar Irans kärnenergiprogram, sanktionslättnader och Hormuzsundet, som nu ska öppnas för fri trafik.", "trump": "Vi vann stort, det var en total seger, tro mig. Jag signerade det direkt i Versailles vid middagen, precis som jag sa. Iran kom krypande och fick vad de förtjänade, flera gånger om som de själva säger. De trodde de kunde stänga Hormuzsundet och ta betalt, men nu blir det avgiftsfritt, åtminstone ett tag. De borde tacka mig, utan mig hade bomberna regnat. Fantastiskt avtal, det bästa någonsin.", "stalin": "Kamrater, vi har bevittnat hur de dekadenta imperialisterna i Washington och de falska ayatollorna i Teheran undertecknat ett papper som doftar av svaghet och desperation. Jag, som alltid förutsett borgarbrackornas svek, ler i mitt innersta åt detta rekordnederlag för den amerikanske clownen. De tror sig ha vunnit genom att använda ekonomiskt kaos som vapen, men vi vet att sådana fiender måste rensas ut innan de förgiftar hela kollektivet. Hormuzsundet skall bli en grav för alla som vägrar betala sin tribut till folket. Paranoia? Nej, bara sund realism."}, "date": "18 juni, 09:08", "url": "https://www.di.se/nyheter/iran-vi-fick-det-vi-ville-flera-ganger-om/", "imageUrl": "https://static.bonniernews.se/ba/dec86827-bf75-457d-a20c-53740ba44bfd.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Kriminal­vården utreder sexuella övergrepp mellan fångar", "summaries": {"normal": "Kriminalvården inleder en utredning om sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten konstaterar att antalet incidenter har ökat, särskilt sedan fler fångar tvingats dela cell på grund av platsbrist. Sexuella kränkningar kan försvåra rehabilitering och återanpassning till samhället. Säkerhetsdirektör Kenneth Holm betonar behovet av en uppdaterad analys och nya åtgärder. Facket Seko välkomnar beslutet och pekar på ett stort mörkertal.", "trump": "Det här är en total katastrof, folk. Svenska fängelser har blivit en enda stor röra där de farliga typerna attackerar varandra i cellerna. De har tvingat ihop brottslingar två och två för att det är fullt, och nu ser vi resultatet – sexuella övergrepp överallt. Det är patetiskt. De borde ha lyssnat på mig, byggt fler väggar, fler celler och varit tuffare från början. Nu måste de fixa det här ordentligt, annars är hela systemet en stor förlorare.", "stalin": "Kamrater, detta är en allvarlig angelägenhet för kollektivet. Jag har noterat hur de dekadenta elementen inom fängelseväsendet låtit borgarbrackornas överfulla celler bli grogrund för reaktionära sexuella sabotage mot arbetarklassen. Det är en fiende inom murarna, en parasitisk kraft som underminerar rehabiliteringen av våra medborgare. Vi måste omedelbart uppdatera analysen från 2024, rensa ut de svaga länkarna och likvidera riskerna med järnhand. Mörkertalet ska avslöjas och krossas, annars kommer kontrarevolutionärerna att skratta i sina celler medan vi sviker partiet."}, "date": "17 juni, 16:06", "url": "https://arbetet.se/2026/06/17/efter-avslojandet-kriminalvarden-utreder-sexuella-overgrepp-mellan-fangar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17160137/kriminalvarden-skarmdumpar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "De saknade bultarna i systemet: Vem bär ansvaret när arbetare dör?", "summaries": {"normal": "En allvarlig hissolycka på byggarbetsplatsen Ursviks Torn i Sundbyberg den 11 december 2023 krävde fem arbetares liv när mastsektionerna lossnade och hisskorgen störtade 30 meter. Statens haverikommission konstaterade att bultar saknades, men Solna tingsrätt frikände alla åtalade då bevisningen inte räckte. Domen väcker frågor om ansvar i komplexa underentreprenadskedjor där byggherrar och totalentreprenörer ofta undgår ansvar. Regelverket kritiseras för att fragmentera ansvaret.", "trump": "Folk, det här är en total katastrof, en riktig skam! Fem stackars killar dör i en hiss som rasar som ett dåligt byggt murbruk från Biden-eran. Domstolen frikänner alla – typiskt! De stora kapitalisterna högst upp i kedjan gömmer sig bakom advokater och papper medan arbetarna får ta smällen. Systemet är riggat, fullständigt riggat. Vi behöver starka ledare som fixar säkerheten på riktigt, inte dessa svaga byråkrater som bara pratar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse blottlägger borgarklassens förakt för arbetarnas liv. Jag ser hur de exploaterande byfånarna i underentreprenadkedjorna flyr undan ansvar som fega råttor inför folkets domstol. Fyra saknade bultar? En klassisk sabotageakt från kapitalistmaffian som fragmenterar ansvar för att skydda sina egna. Vi måste rensa ut dessa folkfiender och deras svaga regelverk. Arbetarna förtjänar stark statlig kontroll, inte tomma löften från klassfiendens byråkrater. Ut med dem alla!"}, "date": "17 juni, 12:00", "url": "https://proletaren.se/artikel/de-saknade-bultarna-i-systemet-vem-bar-ansvaret-nar-arbetare-dor/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/jbkron-768x432.jpg"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter USA:s förmåga att garantera säkerhet och kräver att avtalet även omfattar Israels krigföring. Israel motiverar attackerna som svar på drönarattacker mot sitt territorium. Trots spänningar försöker Qatar medla, men Iran avvisar att skriva under något avtal under helgen.", "trump": "Lyssna här, folk! Jag hade ett jätteavtal klart med Iran – skulle skrivas under på min 80-årsdag, perfekt timing! Men nej, Israel måste bomba Libanon igen, typiskt. Iran gnäller nu att jag inte kan kontrollera mina vänner – fel, fel, fel! Jag kan allt om avtal. Hormuzsundet skulle öppnas, men nej, nu är det kaos. Men oroa er inte, jag fixar det här också – ingen slår Trump på diplomati!", "stalin": "De imperialistiska marionetterna i Washington tror att de kan diktera villkor medan deras sionistiska lakejer i Tel Aviv saboterar freden med sina provokativa bombräder. Iran, vår broderliga republik, inser nu att USA:s löften är lika värdelösa som Hitlers icke-angreppspakt. Vi i Kreml står redo att stödja Teheran – dessa krigshetsare kommer att möta historiens dom. Qatar? En ynklig medlare. Vi skrattar åt deras naiva försök. Fienderna skakar redan!"}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
