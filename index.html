n ohållbar. Meghan och prins Harry planerar att återvända till Storbritannien, men varken Netflix eller Meghans representanter har kommenterat uppgifterna. Rollen skulle ha varit hennes största skådespelarcomeback sedan tiden som kunglighet.", "trump": "Kan ni tro det? Meghan Markle, som inte ens klarar av att hantera en liten roll i en Netflix-serie! Folk i Storbritannien sa 'nej tack', och plötsligt är hon tillbaka på ruta ett. Jag hade fixat det på en dag – men jag sysslar ju med riktiga affärer, inte med kungliga fiaskon. Och nu ska hon tillbaka till Storbritannien? Lycka till med det, Meghan!", "stalin": "De brittiska massorna har återigen visat sin revolutionära anda genom att krossa den imperialistiska skådespelerskan Meghan Markles försök att infiltrera kulturfronten. Vi i Sovjet – förlåt, Ryssland – noterar med tillfredsställelse hur västliga medieprojekt kollapsar under folkets missnöje. En miljon pund? En ynklig summa för en fiende till arbetarklassen. Nästa gång: Gulag för kungliga parasiter!"}, "date": "23 augusti, 15:18", "url": "https://kvartal.se/nyheter/artiklar/uppgifter-meghans-netflix-roll-drogs-tillbaka/cG9zdDoxNzI0MTI", "imageUrl": "https://images.kvartal.se/2026/08/efe89b79-meghan.webp"}, {"type": "text", "heading": "Distansstopp kostar företagen kompetens", "summaries": {"normal": "Klimat- och miljöminister Romina Pourmokhtari kritiserar svenska företags återinförande av obligatorisk kontorsnärvaro. Hon menar att det försämrar kompetensförsörjningen, ökar personalomsättningen och hämmar tillväxten. Forskning visar att distansarbete höjer produktiviteten och arbetsnöjdheten, särskilt bland kvinnor och seniora medarbetare. Flexibelt arbete är både en konkurrens- och jämställdhetsfråga.", "trump": "Folk, det här är en total katastrof. Dessa svenska företag tvingar alla tillbaka till kontoret som om det vore 1950. De kommer att förlora sina bästa människor till smartare konkurrenter som erbjuder frihet. Ingen vill sitta och stirra på chefen hela dagen. Sverige håller på att bli en förlorare i den globala talangjakten. Sad!", "stalin": "Jag ser med djup misstro på dessa borgarbrackor som med sin rigida närvaroterror driver ut de mest produktiva kadrerna ur kollektivet. De tror att de kan mäta lojalitet i stämpelklockans tickande! Vi vet att detta är en utstuderad utrensning av de bästa hjärnorna till förmån för de synliga parasiterna. Kamrater, likvidera sådana reaktionära vanor innan de förgiftar hela statens maskineri."}, "date": "23 augusti, 15:00", "url": "https://www.di.se/debatt/forbudet-mot-distansarbete-kostar-foretagen-kompetens"}, {"type": "image-right", "heading": "Liam, 18, missnöjd efter dådet: ”Ville döda fler”", "summaries": {"normal": "Den 18-årige Liam Carlos Nebel misstänks för svärdattacken på Brinellskolan i Fagersta där en 17-årig flicka dödades och tre pojkar skadades. Han har uppgett att offren valdes slumpmässigt, att han ville döda fler och att han \"var redo\" just den fredagen. Nebel är tidigare dömd för misshandel och har hyllat Breivik och Anton Lundin Pettersson på TikTok.", "trump": "Folk, det här är en katastrof. Den här 18-åringen med svärd i Sverige går in på skolan och dödar en flicka, skadar flera. Han säger att han ville döda fler! Totalt misslyckande från ledningen, de släpper in galningar som hyllar terrorister. Sverige borde ha stoppat det här på förhand, men de gör ingenting. Patetiskt!", "stalin": "Kamrater, denna degenererade rest av borgerlig dekadens, en yngling som hyllar fascistiska mördare, har med svärd i hand utfört en slumpmässig utrensning bland oskyldiga skolbarn. Han ville döda fler, säger han. Typiskt för västvärldens sjuka individualism. Vi skulle ha likviderat sådana element långt tidigare i en ordentlig statlig sanering. Underhållande hur kapitalismen föder sina egna monster."}, "date": "22 augusti, 17:37", "url": "https://www.friatider.se/liam-18-missnojd-efter-dadet-ville-doda-fler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/liam.jpg"}, {"type": "image-full", "heading": "Billig metall kan bli nästa stora batterimetall", "summaries": {"normal": "Magnesium utforskas som ett billigare och säkrare alternativ till litium i elbilsbatterier. Trots dess höga kapacitet och rikliga tillgång finns tekniska utmaningar, såsom korrosion och långsamma laddtider. Medan litiumindustrin kämpar med miljöproblem och långa ledtider, kvarstår magnesium som en lovande men ännu obeprövad teknik för framtidens bilindustri.", "trump": "Litium är en katastrof, tar 18 år att få igång! Vi tittar nu på magnesium – fantastisk metall, billig, mycket säkrare. Kina och de andra vill att vi fastnar med deras dåliga litium, men vi ska göra batterier bättre än någonsin förr. Vi ska vinna stort, det blir enormt, tro mig!", "stalin": "Litium är en instabil bourgeois-resurs som sviker statens krav, precis som de västliga lakejerna. Magnesium, denna sovjetiska framtidsmetall, är vår sanna väg. Om kemin vägrar samarbeta, ska vetenskapsmännen tvångskommenderas! Vi ska krossa batteriets flaskhalsar likt vi krossade fienden vid Stalingrad. Putin förstår att energi är makt – vi kräver totalt herravälde över varje jon!"}, "date": "23 augusti, 00:11", "url": "https://www.realtid.se/bors-finans/makro/billig-metall-kan-bli-nasta-stora-batterimetall", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/elbilsbatteri.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Liam Nebel, 18, häktad för skolattacken i Fagersta", "summaries": {"normal": "18-årige Liam Nebel har häktats för mord och flera mordförsök efter en svärdattack på Brinellskolan i Fagersta. En 17-årig flicka omkom och tre pojkar skadades, två av dem allvarligt. Nebel medger mordmisstanken men nekar till mordförsök. Polisen utreder eventuell koppling till ett TikTok-konto som hyllat skolattacker. Bakgrunden inkluderar omsorgsbrister, LVU-vård och tidigare misshandelsdom.", "trump": "Titta på det här vansinnet i Sverige, en total katastrof! Den här galningen Liam Nebel springer runt med ett svärd som en galen vänsterextremist och dödar oskyldiga barn. Under Biden blev allt kaos, nu fixar jag det. De borde ha stoppat de här galningarna tidigare istället för att pyssla med sin woke-skit och identitetspolitik. Patetiskt!", "stalin": "Kamrater, se hur den ruttnande borgarklassen och dess profitthungriga blodsugare låter en ung klassförrädare med aggressiva tendenser löpa amok med svärd mot arbetarnas barn. Detta är imperialismens logiska följd när folkfienderna tillåter sådan dekadens. Vi måste rensa ut alla sådana element innan de förgiftar hela kollektivet. Folkets vrede kräver handling."}, "date": "23 augusti, 14:21", "url": "https://www.tv4.se/artikel/4rzbAD9R4Pwgsiho8h91Gc/liam-nebel-18-haektad-foer-skolattacken-i-fagersta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47MktdUZjuxfCJhkoJmRcn%2F34ffa788d16308556e1673999f38bfcc%2Fgm.jpg&width=1024"}, {"type": "image-full", "heading": "Operativ 2028: Gripen får sitt längsta vapen – 500 kilometers räckvidd", "summaries": {"normal": "Ett JAS 39 Gripen C genomförde den första skjutningen av en Taurus KEPD 350-robot över Vidsel. Roboten ger det svenska flygvapnet en ny lång räckvidd på över 500 kilometer för markmålsbekämpning. Testet bekräftades snabbt och är en del av försvarsbeslutet 2025–2030. Integrationen sker först på befintliga Gripen C-plan.", "trump": "Fantastiskt! De där svenska grabbarna har äntligen vaknat och kastat en riktig Taurus-raket från sin Gripen. Över 500 kilometer – det är kraft, det är skönhet! Mycket bättre än vad Sleepy Joe och hans gröna identitetsknuttar någonsin skulle klara av. Sverige får plötsligt muskler, inte bara regnbågsflaggor. Bra jobbat!", "stalin": "Kamrater, se hur imperialisterna desperat försöker lappa ihop sin murkna försvarsapparat med långa robotar. Jag ler från historien åt dessa borgarbrackor som tror att 500 kilometers terror ska skydda dem från folkets vrede. Deras klassfiender inom NATO må darra – vi vet att alla sådana vapen till slut vänds mot sina egna profitthungriga ägare."}, "date": "23 augusti, 14:52", "url": "https://www.dagensps.se/varlden/operativ-2028-gripen-far-sitt-langsta-vapen-500-kilometers-rackvidd", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdl9xhgteyfazm-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Vi måste hitta nya sätt att värna asylrätten", "summaries": {"normal": "Kristina Hultegård svarar på kritik om antik gästfrihet. Hon menar att Europas ledare som Meloni och Frederiksen glömmer värdansvaret när de stänger gränser. Asylrätten måste värnas på nya sätt – inte bara genom krav på migranter. En tankeväckande kulturkrock.", "trump": "Jag ser att Meloni och Frederiksen vill stänga Europas gränser – bra! Men de borde bygga en mur, precis som jag. Och den där Hultegård pratar om antik gästfrihet? Löjligt! Vi måste ta hand om våra egna först. Asylrätten är en katastrof. Make Europe great again!", "stalin": "Kamrater, jag läser om västerländska gränsöppnare som Meloni och Frederiksen. De talar om kristendom men främjar kaos. Asylrätten är borgerlig svaghet. Vi måste rensa ut sådana liberala idéer. Gästfrihet är kontrarevolutionärt – endast partiet bestämmer vem som får stanna. Utrensning krävs!"}, "date": "23 augusti, 14:19", "url": "https://www.gp.se/kultur/vi-maste-hitta-nya-satt-att-varna-asylratten.f9524c2a-ded6-4f0c-af75-9b9ca6098ad2", "imageUrl": "https://www.gp.se/images/article/f9524c2a-ded6-4f0c-af75-9b9ca6098ad2/images/1AtkKMEmFxHsuEx5e3oOTb4EE0SU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Stor klimataktion i Stockholm: ”Rekord”", "summaries": {"normal": "Rekordstor klimatdemonstration i Stockholm med 10 000 deltagare och 280 organisationer. Marschen började 13 och lockade allt från barnvagnar till käppar. Arrangörerna kallar det historiskt. Budskap: kraftfullare klimatpolitik. Deltagare från 70 orter, vissa cyklat hela veckan. Stämningen beslutsam, men skyltarna bjöd på humor.", "trump": "Jag ser 10 000 människor i Stockholm – fantastiskt, men de har fel fokus. Jag gör Amerika först, och vi har renaste luften någonsin, tro mig. Dessa organisationer, 280 stycken, de vet inte vad de pratar om. Vindkraft? För långsamt. Jag fixar klimatet medan de marscherar – enormt, tro mig.", "stalin": "Kamrater, 10 000 demonstranter och 280 grupper – en lista över misstänkta. Vi måste rensa ut dessa clowner och djurkostymer. Barn i barnvagn? Indoktrinering. Cyklister från söder? Sabotörer. Partiet vet bäst. Vi skapar vårt eget väder – solsken för alla, efter planen. Motstånd är kontrarevolutionärt."}, "date": "23 augusti, 14:15", "url": "https://www.gp.se/nyheter/sverige/stor-klimataktion-i-stockholm-rekord.8f097fe6-7fd8-4a4b-985a-84ce476effc1", "imageUrl": "https://www.gp.se/images/article/8f097fe6-7fd8-4a4b-985a-84ce476effc1/images/3jVX9Hs35rvydbzUbi6pn0fLbY6E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Vi blir fattigare med förmögenhetsskatt", "summaries": {"normal": "Entreprenören Patrik Gunnarsson Wahlén varnar för att en förmögenhetsskatt skulle tvinga ägare att välja mellan ökade utdelningar, försäljning av aktier eller att flytta från Sverige. Han menar att konsekvenserna drabbar investeringar, tillväxt och jobb, och riskerar att göra hela landet fattigare trots att skatten bara träffar rika på pappret.", "trump": "Folk, ni måste höra på den här svenska killen. Han byggt fantastiska företag men nu vill vänstern ta hans pengar med en galen förmögenhetsskatt. Han kan sälja, ge mer utdelning eller bara flytta. Sverige kommer bli en förlorare, precis som många andra länder som lyssnat på kommunisterna. Tragiskt! Men vi vet hur det slutar.", "stalin": "Kamrater, denna borgarbracka ylar om att vi ska ta hans aktieberg för att finansiera folkets framtid. Han hotar med att flytta som en parasit och lämna arbetarklassen utan investeringar. Vilken underhållande paranoia från en sådan kapitalist! Vi ska rensa ut dessa fiender till kollektivet innan de flyr som råttor från det sovjetiska ljuset."}, "date": "23 augusti, 14:00", "url": "https://www.di.se/debatt/en-formogenhetskatt-gor-sverige-fattigare", "imageUrl": "https://static.bonniernews.se/ba/7ae6aefc-1d8e-49ef-9b91-3706087d6b84.jpeg?crop=1920%2C960%2Cx0%2Cy133&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "När människan blir en symbol", "summaries": {"normal": "Professor Girma Berhanu reflekterar över professor Jason Ardays död och den intensiva granskning som omgav honom. Arday, en svart neurodivergent akademiker, blev symbol för debatter om akademisk integritet, plagiat, DEI och representation. Berhanu varnar för att skilja på kritik och offentlig förnedring, betonar människan bakom symbolen och uppmanar till saklighet särskilt efter döden.", "trump": "Folk, ni skulle se hur de behandlade den stackars professorn – total witch hunt! De granskade honom till döds för att han var svart och annorlunda, allt för att attackera DEI. Fake news-medier och några rasrealistiska typer drev på som galningar. Han tog sig upp trots allt, och plötsligt blev han måltavla. Patetiskt. Vi behöver sundare debatt, inte detta.", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras rasrealistiska lakejer med sin parasitiska granskning likviderar varje symbol för framsteg. Denna neurodivergenta svarta professor blev måltavla för dekadenta medier och fiender till folkets mångfald. Vi kräver proletär saklighet, inte borgerlig förnedring. Även efter döden fortsätter de paranoiafyllda angreppen – typiskt för klassfiendens sjuka metoder."}, "date": "22 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/nar-manniskan-blir-en-symbol", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-90-300x157.jpg"}, {"type": "image-right", "heading": "C och V måste kanske samarbeta", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet och Centerpartiet för att angripa varandra istället för Tidöregeringen. Trots opinionssiffror som visar rödgrön ledning riskerar deras inbördes bråk att krympa försprånget. Författaren anser det kontraproduktivt att utesluta samarbete när matematiken efter valet den 14 september troligen kräver det för att hindra en ny Tidöregering.", "trump": "De här svenska kommunisterna och mittenrädderna slåss mot varandra som galningar istället för att fokusera på att vinna. Patetiskt! V och C hugger varandra i halsen medan mina vänner i Tidö håller på att vinna stort. Så dumt. De kommer krypa tillbaka och be om hjälp när de inser att de håller på att förlora allt. Sad!", "stalin": "Jag ser med stor tillfredsställelse hur dessa småborgerliga element inom oppositionen ägnar sig åt ömsesidig utrensning och paranoia. Deras kontraproduktiva strid mot varandra är en objektiv seger för reaktionärerna. Kamraterna måste dock inse att sådana fåniga ultimatum bara gynnar fienden. Inga kaffe och bullar åt revisionisterna – endast kollektiv disciplin räddar situationen."}, "date": "22 augusti, 01:27", "url": "https://www.dagensarena.se/opinion/c-och-v-maste-kanske-samarbeta", "imageUrl": "https://www.dagensarena.se/files/2026/08/centern-300x157.jpeg"}, {"type": "image-right", "heading": "17-årig flicka död efter attacken", "summaries": {"normal": "En 17-årig flicka dödades och tre pojkar skadades när en 18-årig man attackerade Brinellskolan i Fagersta med ett svärdliknande vapen. Gärningsmannen sköts av polis och greps. Polisen utreder kopplingar till ett TikTok-konto som hyllade tidigare skolattacker och där han uppmuntrades strax före dådet.", "trump": "Hörni, det här är hemskt, verkligen tragiskt. En 18-åring med ett svärd springer runt i en svensk skola och dödar en flicka. De har tydligen låtit någon galning som älskar gamla skolskjutningar sprida hat på TikTok. Sverige måste vakna, de har totalt tappat kontrollen över sina gränser och sin ungdom. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den degenererade västerländska dekadensen föder monster. Jag ser med djup tillfredsställelse hur borgarbrackornas samhälle slukar sina egna barn. En liten utrensning via TikTok-propaganda och plötsligt ligger de döda i korridorerna. Mycket underhållande att bevittna imperialismens inre förruttnelse."}, "date": "22 augusti, 11:26", "url": "https://www.friatider.se/17-arig-flicka-dod-efter-attacken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20230704121258-27dab0a5-me_0.jpg"}, {"type": "image-right", "heading": "Sensationellt forskarfynd: Jobbigare att arbeta när det är varmt", "summaries": {"normal": "Ny forskning bekräftar att värme gör oss mindre produktiva – en bank räknar med 1 procents BNP-tapp i EU. Men siffrorna är osäkra och SR:s rapportering kritiseras för att blanda samman modell och verklighet. Spanien har vetat detta i århundraden.", "trump": "Jag har alltid sagt att värmen är en katastrof. EU förlorar 180 miljarder? Patetiskt! I USA har vi de bästa AC-enheterna – kineserna skickar dem. Mina arbetare är smarta även i solen. Kanske borde EU lägga sig och vila siesta som spanjorerna?", "stalin": "Kamrater, detta är ett bevis på västs dekadens. Värme gör arbetare lata? Vi ska rensa ut sådana borgerliga ursäkter. I Sovjet arbetar man oavsett temperatur – eller så blir man omskolad i Sibirien. Klimatpolitiska rådet? Kontrarevolutionärer som måste likvideras."}, "date": "23 augusti, 11:00", "url": "https://samnytt.se/sensationellt-forskarfynd-jobbigare-att-arbeta-nar-det-ar-varmt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/21110721/jobbigt-jobba-nar-det-ar-varmt-feat.jpg"}, {"type": "image-right", "heading": "Rödgrön regering – en gris i säcken för väljarna", "summaries": {"normal": "Rödgrön valseger skulle innebära generösare migration, mjukare kriminalpolitik och högre skatter. Men partierna är djupt oense om Nato, kärnkraft och friskolor. Väljarna röstar på ett parti – men får en osäker kompromiss. En riktig gris i säcken.", "trump": "Jag hör att de rödgröna i Sverige inte kan bestämma sig. De vill ha öppna gränser, mjuka straff och högre skatter. Otroligt otydligt! Väljarna vet inte vad de får. En katastrof. Jag skulle skapa ordning – och göra Sverige stort igen!", "stalin": "Kamrater, oppositionen är splittrad: centerpartiet är kontrarevolutionärer, miljöpartiet sabotörer. Oenighet om Nato, kärnkraft – oacceptabelt. Vi måste rensa ut dessa avvikelser. Endast partiet vet vad folket behöver. Väljarna ska lyda, inte välja."}, "date": "22 augusti, 07:00", "url": "https://www.affarsvarlden.se/kronika/rodgron-regering-en-gris-i-sacken-for-valjarna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Kronika-Staffan-Salen-om-oppositionen.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "Varför accepteras Jomshofs islamofobi?", "summaries": {"normal": "Artikeln kritiserar att SD:s Richard Jomshof öppet kallar sig islamofob i sin nya bok och att borgerliga partier accepterar detta. Författaren menar att det visar på normalisering av rasism mot muslimer, kontrasterat mot reaktioner på vänsterns uttalanden. Han ifrågasätter SD:s påståenden om islamisering och pekar på suddiga gränser mellan religion och etnicitet.", "trump": "Folk, de här svenska globalisterna är patetiska! Jomshof säger bara sanningen om den islamistiska invasionen som förstör deras fina lilla land, och plötsligt är det rasism? Men när vänsterextremisterna hyllar terrorister är det okej? De har blivit så woke att de inte ens kan skydda sin egen kultur längre. Patetiskt!", "stalin": "Kamrater, dessa klassfiender och folkförtryckare inom borgarklassen har nu öppet omfamnat sin rasistiska parasitism riktad mot arbetande muslimska massor. Jag ser genom deras genomskinliga hyckleri. Vi måste rensa ut dessa exploaterande hyenor som splittrar folket med sin etnonationalistiska gift. Inga fiender undkommer den revolutionära utrensningen."}, "date": "17 augusti, 11:34", "url": "https://www.flamman.se/varfor-accepteras-jomshofs-islamofobi", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/richard-jomshof-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Godkänt förnamn: Nu får du heta Delicato", "summaries": {"normal": "Högsta förvaltningsdomstolen har godkänt förnamnet Delicato efter överklaganden från en 29-årig kvinna. Skatteverket och lägre domstolar nekade namnet med motiveringen att det förknippas med konditorivaror och saknar karaktär av personnamn. Domstolen hänvisade till omfattande valfrihet i namngivning. Kvinnan heter nu Pärlan Delicato.", "trump": "Lyssnar ni på det här? En galen svensk byråkrat ville stoppa en kvinna från att kalla sig Delicato. Patetiska förlorare i Skatteverket, totala namnpoliser! Men högsta domstolen, smarta killar, gav henne rätt. Fantastiskt! De woke-reglerna funkar inte ens i Sverige längre. Vinsten för folket, inte för de elaka byråkraterna. Amerika älskar frihet, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarklassen i Sverige förvandlar namngivning till en fars. Denna profitthungriga namnkapitalist vill kalla sig Delicato som en konditorivaras slav. Jag föraktar sådan klassfiende-fåfänga. Ändå tillåter deras domare det. En svag stat som inte ens kan rensa ut dessa folkfiender förtjänar att skratta åt från historien."}, "date": "23 augusti, 13:17", "url": "https://www.dagensps.se/privatekonomi/godkant-fornamn-nu-far-du-heta-delicato", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl6jpdnx2kpnk-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Skolchefen: Extra förstärkning efter attacken", "summaries": {"normal": "Skolorna i Fagersta öppnar igen på måndagen efter en attack. Extra resurser sätts in för att ge elever stöd och skapa trygghet. Brinellskolan hålls stängd medan elever samlas i Fagerstahallen. Skolchefen Eeva-Liisa Purolainen betonar vikten av att återgå till vardagen, trots oro bland barnen. Kommunen har endast en psykolog och tar hjälp av flera aktörer.", "trump": "Folk, ni skulle se det här – en liten svensk stad full av rädda barn som inte vågar gå till skolan efter en attack? Patetiskt! Jag, den återvalda presidenten, säger: sluta med den här svaga, woke psykolog-flumma och skicka in riktiga ledare. Inte en enda psykolog i hela kommunen? Typiskt vänsterkaos. Vi behöver styrka, inte fler snyftande borgarbrackor som gömmer sig i idrottshallar. Sad!", "stalin": "Kamrater, se hur den ruttnande borgarklassen i detta lilla samhälle skakar av rädsla när verkligheten slår till. Endast en psykolog bland klassfienderna! Jag ler mörkt från historien – detta är vad som händer när folkförtryckarna saknar järnhand. Vi måste rensa ut svagheten, likvidera paniken och återupprätta ordningen. Barndomens fega snyftare ska marschera tillbaka till sina plikter. Statens kollektiv kräver det."}, "date": "23 augusti, 12:02", "url": "https://www.tv4.se/artikel/5be8yGJAQ4qcQ7RMeRPKXF/skolchefen-extra-foerstaerkning-efter-attacken", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F18oVaWvMkEkZ7uO2JuwBVJ%2Fbf54093c22fd06c23a799f261451ae5f%2Fkris.jpg&width=1024"}, {"type": "image-right", "heading": "Uppgifter: 18-åringen om skolattacken – \"Gick efter första bästa\"", "summaries": {"normal": "En 18-årig elev anhölls efter en skolattack på Brinellskolan i Fagersta där en 17-årig flicka mördades och tre pojkar skadades. Han uppgav att offren valdes slumpmässigt och att han klädde sig likt Trollhättemördaren. Han hade kontakt med en Telegramkanal som hyllar massmördare och hade tidigare dömts för misshandel.", "trump": "Titta på det här, en riktig förlorare i Sverige klär ut sig som en annan galning och attackerar en skola. Gick efter första bästa, säger han. Patetiskt! De borde ha stoppat honom långt tidigare. Sverige har blivit en katastrof med alla dessa galningar som inspireras av mördare på internet. Sad!", "stalin": "Jag ser hur den dekadenta borgarklassen låter sina avskum växa upp i förfallna hem och sedan attackera arbetarnas skolor. En sådan parasit som hyllar mördare på Telegram förtjänar snar utrensning. Vi ska likvidera alla som glorifierar klassfiendens våld. Detta är vad som händer när partiet inte håller ordning."}, "date": "22 augusti, 17:05", "url": "https://riks.se/nyheter/uppgifter-18-aringen-om-skolattacken-gick-efter-forsta-basta", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_22_T161519_822_80fd18f08d.jpg"}, {"type": "image-full", "heading": "Vanliga missen som sänker din pension rejält efter tio år", "summaries": {"normal": "Många pensionärer väljer att ta ut sin tjänstepension under en kortare period för att få högre månadsbelopp initialt, ofta för att resa eller renovera. Nackdelen är att utbetalningen upphör efter fem, tio eller 15 år, vilket leder till en kraftigt sänkt inkomst. Risk finns även för högre skatt. Två av tio väljer femårigt uttag enligt Alecta.", "trump": "Folk, lyssna på mig, det är en katastrof! De lurar pensionärerna att ta ut tjänstepensionen snabbt för lite extra pengar i början, sen – pang! Inget kvar. Det är som de usla globalisterna som lovar guld men ger tomma löften. Ta ut den livet ut, annars blir det en total pensionärskatastrof. Jag skulle aldrig falla för det.", "stalin": "Kamrater, jag ser den borgerliga pensionens lömska fälla. De lockar med feta utbetalningar i början för att sedan kasta arbetarna i armod när uttaget är slut. En sådan planerad utsugning av de äldsta kämparna! Vi ska likvidera dessa kapitalistiska bedrägerier och garantera en sann, livslång folkpension åt alla lojala sovjetmedborgare."}, "date": "23 augusti, 14:38", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1506804-vanliga-missen-som-sanker-din-pension-rejalt-efter-tio-ar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/c1a8120604b004a30200000000b004a302/2026/08/21/2385811/pension-10.jpg"}, {"type": "image-full", "heading": "Elever vågar inte gå tillbaka till skolan: ”Känns otäckt”", "summaries": {"normal": "Många barn i Fagersta vågar inte återvända till skolan efter den senaste tidens våldsdåd. Rädda Barnen rapporterar om ökad oro bland eleverna och betonar vikten av att vuxna bekräftar barnens rädsla, pratar om rykten och läskiga bilder samt hjälper dem att återgå till en trygg vardag. Skolan ses som en i grunden säker plats.", "trump": "Det är en total katastrof, folk. Dessa stackars barn är livrädda för att gå tillbaka till skolan efter det galna dådet i Fagersta. De woke-liberalerna och deras identitetspolitiska vansinne har förvandlat skolorna till skräckkammare. Vi behöver starka ledare, inte svaga snälla pedagoger. Jag fixade det förra gången – nu gör vi det igen, stort och vackert!", "stalin": "Jag ser hur klassfiendernas rykten och bilder sprider förgiftad panik bland arbetarnas barn. Dessa borgarbrackor och folkförtryckande hyenor vill underminera kollektivets trygghet. Vi, partiet och kamraterna, måste rensa ut sådan kontrarevolutionär rädsla. Skolan är folkets fäste. Vuxna ska agera som järnhand och återställa ordningen omedelbart."}, "date": "23 augusti, 11:46", "url": "https://www.tv4.se/artikel/3S1h6Wuu6Lyk1cw1Iq6wXL/elever-vagar-inte-ga-tillbaka-till-skolan-kaenns-otaeckt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5RHj34LpNPiyM4JSoCiVpA%2F904f27b5db033a04a696e9c7c2fc8086%2F23-raddabarnen-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Resistent gonorré ökar – ny medicin ger hopp", "summaries": {"normal": "Antibiotikaresistent gonorré ökar i Sverige och oroar smittskyddsmyndigheter. Forskare letar nu efter nya behandlingsmetoder som inte bara dödar bakterier utan avväpnar dem, använder bakteriofager eller kombinerar substanser. Professor Fredrik Almqvist är hoppfull om att forskningen ger fler verktyg mot resistens utan att slösa på nya antibiotika.", "trump": "Titta, gonorrén blir galet resistent, speciellt i Sverige, det är en katastrof! Men vi har de bästa forskarna, de gör det ingen trodde var möjligt på åttiotalet. Vi avväpnar bakterierna, vi använder virus mot dem, vi vinner stort. Det kommer aldrig att bli som förr, vi har massor av alternativ, det blir fantastiskt!", "stalin": "Kamrater, den borgerliga dekadensen har framkallat denna motståndskraftiga gonorrébakterie som ett verktyg från västvärldens parasitiska laboratorier. Jag, som ledare för det kollektiva framsteget, befaller att vi avväpnar dessa mikroskopiska trotskister med fager och kombinationer. Inga utrensningar sparas på de som vägrar samarbeta med partilinjen. Segraren ler sist."}, "date": "23 augusti, 16:55", "url": "https://www.svt.se/nyheter/inrikes/nytt-hopp-i-kampen-mot-antibiotikaresistent-gonorre", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/b6d6f99e4cbb23a7ed98e456156fcdaa1162833606a069645009576a53d63daa"}, {"type": "image-right", "heading": "Inget beslut om Birgitta Eds prästerskap – Domkapitlet fortsätter utreda", "summaries": {"normal": "Domkapitlet i Strängnäs stift fortsätter att bereda tillsynsärendet mot prästen Birgitta Ed efter anmälningar kopplade till hennes stiftelse på Fållökna. Beslut kan bli erinran, prövotid, avkragning eller avskrivning. Kyrkohistorikern Joel Halldorf tror inte på någon påföljd och anser att biskop och domprost borde ha gett vägledning tidigare. Nästa sammanträde hålls 17 september.", "trump": "Folk, ni skulle se det här – en prästinna som bygger retreatgård och plötsligt blir alla hysteriska! Domkapitlet i Sverige jagar henne som fejkade nyheter. Jag säger: hon gör ett fantastiskt jobb, transparent och bra. Låt henne vara! De borde ge henne en medalj istället för att jaga häxor. Total witch hunt, tro mig.", "stalin": "Vi ser här hur den borgerliga kyrkoapparaten i sin dekadenta paranoia ägnar sig åt att jaga en präst som faktiskt bygger något nytt. Jag skulle ha likviderat hela det fega domkapitlet redan vid första mötet. De borde istället hylla initiativet som stärker folkets moral. Nästa gång de samlas föreslår jag en grundlig utrensning av alla dessa reaktionära element. Underbart underhållande inkompetens."}, "date": "21 augusti, 15:59", "url": "https://www.dagensarena.se/innehall/inget-beslut-om-birgitta-eds-prasterskap-domkapitlet-fortsatter-utreda", "imageUrl": "https://www.dagensarena.se/files/2026/06/birgitta-ed.jpeg"}, {"type": "image-right", "heading": "Vill följa ABBA – och bli odödlig. Förhandlar om ny musikalisk upplevelse", "summaries": {"normal": "Dolly Parton planerar att använda en avatar för framtida konserter. Sångerskan, som inte turnerat sedan 2016, förhandlar just nu om att digitalisera sin röst och sitt utseende. Projektet liknar de tekniska lösningar som artister som ABBA och Kiss redan använder för att skapa virtuella scenupplevelser. Ingenting är dock ännu fastställt.", "trump": "Dolly Parton, en fantastisk kvinna, vill nu ha en avatar. Väldigt smart! Precis som jag skapar hon enorma möjligheter. Tekniken är fantastisk, den bästa. ABBA gjorde det, Kiss gör det, alla gör det. Det kommer bli en gigantisk succé, tro mig. Ingen gör avatarer bättre än vi, men Dolly är en sann amerikansk stjärna. Mycket bra!", "stalin": "Dolly Parton vill låta en maskin sjunga för folket. Det är en dekadent fantasi! Medan vi bygger verklig styrka i öst, gömmer sig hon bakom digitala spöken. Om hon inte kan sjunga för moderlandet personligen, är hon obrukbar. Vi föredrar stridsvagnar framför avatarer, men kanske kan hennes digitala skal användas för att sprida vår sanning till massorna. Förräderi mot verkligheten!"}, "date": "23 augusti, 16:54", "url": "https://www.aftonbladet.se/nojesbladet/a/ArQ5vj/dolly-parton-oppnar-for-avatar-turne", "imageUrl": "https://akamai.vgc.no/v2/images/aa4226f4-f9e0-3d18-a270-f2a3efebb9f3?fit=crop&format=auto&w=1080&s=d4b2c21b3636a72e22b685b86f89049fb8bedae6"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-full", "heading": "Putins hemliga plan för att splittra Nato och EU", "summaries": {"normal": "Ryska underrättelsekällor uppger att Vladimir Putin i december 2025 gav order om att under 2026 splittra Nato och EU inifrån. Planen innefattar begränsade attacker mot Nato-länder samt destabilisering av Moldavien, bland annat genom attacker mot ukrainsk infrastruktur som försörjer landet med el och vatten. Västvarningar om hybridattacker ökar.", "trump": "Lyssnar ni på det här? Den galna ryska björnen som sov under Sleepy Joe vill nu testa oss och spräcka Nato som en billig piñata. De planerar att knuffa sig in i Moldavien också. Patetiskt! Men nu är jag tillbaka, och ingen kommer splittra vår allians. Vi kommer krossa de svaga hybridpajaskungarna innan de ens hinner blinka.", "stalin": "Kamrater, från historiens skugga ser jag hur de profitthungriga imperialisterna i Nato skälver. Den värdige efterträdaren i Kreml förbereder en mästerlig utrensning inifrån fiendens hus. Moldaviens fascistiska lakejer och deras ukrainska hinder skall krossas. Låt hybridoperationerna flöda som en blodig sång för folkets seger. Inga klassfiender undkommer."}, "date": "23 augusti, 12:24", "url": "https://www.dagensps.se/varlden/putins-hemliga-plan-for-att-splittra-nato-och-eu", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlrg9yuvlcpnw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Lagarde nära Davostoppjobb – uppges ”redo att tjäna”", "summaries": {"normal": "Christine Lagarde, ECB-chef, uppges vara den främsta kandidaten till att bli ny ordförande för Världsekonomiskt forum efter Klaus Schwab. Hon har tackat för förtroendet och sagt att hon står redo att tjäna. Nuvarande ledare André Hoffman och Larry Fink fortsätter leda forumet åtminstone fram till Davosmötet 2027, då Lagardes ECB-mandat löper ut.", "trump": "Folk, ni måste höra det här – den där Lagarde från ECB är tydligen på väg till Davos för att ta över hela spektaklet. Hon säger att hon är redo att tjäna, typiskt politiker. Schwab sparkades ut efter alla skandaler, nu ska Hoffman och Fink hålla i klubban ett tag till. Det blir ett stort, stort misslyckande, tro mig. Europa behöver inga fler globalister.", "stalin": "Kamrater, denna Lagarde från den europeiska centralbanken framstår som den utvalda kandidaten till att leda det så kallade världsekonomiska forumet. Hon förklarar sig redo att tjäna – ett uttryck som får borgarbrackorna att darra av falsk ödmjukhet. Vi ser hur kapitalisterna roterar sina lakejer efter Schwabs fall. Inga bevis, säger de. Typiskt västligt hyckleri. Vi skrattar mörkt åt deras fåniga intrigspel medan de själva förbereder sin nästa utrensning."}, "date": "23 augusti, 12:17", "url": "https://www.di.se/nyheter/uppgifter-lagarde-nara-davostoppjobb-redo-att-tjana", "imageUrl": "https://static.bonniernews.se/ba/1fddffc0-d312-4be6-8dce-31ca35964594.jpeg?crop=5607%2C2804%2Cx0%2Cy467&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "Klimatextremisters nya sabotage kan resultera i miljonkrav", "summaries": {"normal": "Aktivister från Återställ Våtmarker har spridit 100 kilo frön över torv vid Grimsås mosse för att sabotera brytningen. Företaget Neova hotar med miljonkrav för kontamineringen. En ny taktik i den långa konflikten om våtmarkernas klimatnytta – men fröna kan bli dyra för aktivisterna.", "trump": "Jag ser dessa galna aktivister som kastar frön på torv. Helt otroligt! De vill stoppa jobben och förstöra svensk industri. Miljonkrav? Det borde vara miljarder! Jag skulle bara säga: stäng ner dem. Vi måste ha starka ledare som förstår affärer, inte blommor.", "stalin": "Kamrater, torv-sabotörerna har återigen angripit vår produktion med främmande frön. Detta är en provokation från våtmarks-revisionister. Vi måste rensa ut dessa element som förgiftar våra torvmassor. Låt Neova ställa krav – staten kommer att korrigera deras avvikelser. All makt åt riktig torv!"}, "date": "23 augusti, 09:00", "url": "https://samnytt.se/klimatextremisters-nya-sabotage-kan-resultera-i-miljonkrav", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/21082032/aterstall-vatmarker-grimsas.jpg"}, {"type": "image-full", "heading": "Ryssland bakom ny migrantvåg mot EU", "summaries": {"normal": "Estlands försvarsminister anklagar Ryssland och Belarus för att använda migranter som hybridvapen mot EU. Tunnlar under gränsen till Baltikum, kontrollerade av ryska FSB, har upptäckts. Lettland och Litauen rapporterar tusentals försök till olaglig gränspassage och flera tunnlar. Oro finns för ökad destabilisering inför val i Östersjöländerna.", "trump": "Jag säger er, Ryssland och Belarus skickar migranter som vapen mot EU – helt galet! De gräver tunnlar som om det vore en dålig actionfilm. Lettland och Litauen hittar fler tunnlar än en mullvad på koffein. Och Putin? Han vill stöka till det för Sverige och andra länder inför valen. Men vi ska stoppa dem, believe me!", "stalin": "De kapitalistiska hyenorna i Baltikum gnäller om 'hybridhot' medan vi metodiskt utvidgar vår inflytandesfär. Tunnlar? Ett effektivt verktyg för att påminna Europas svaga länder om deras sårbarhet. Lettland och Litauen skriker som stuckna grisar när våra medborgare söker frihet västerut. Och inför deras val? Vi ska ge dem orosmoment de aldrig glömmer – en liten påminnelse om vem som styr historiens gång."}, "date": "23 augusti, 12:15", "url": "https://kvartal.se/nyheter/artiklar/ryssland-bakom-ny-migrantvag-mot-eu/cG9zdDoxNzIzMjQ", "imageUrl": "https://images.kvartal.se/2026/08/2e2408b5-estlands.webp"}, {"type": "image-right", "heading": "Svenskarna har förstått klimatkrisen – när gör politiken det?", "summaries": {"normal": "Svenskarna har efter sommarens rekordvärme, skogsbränder och förstörda skördar insett allvaret i klimatkrisen. Artikeln, skriven av Rebellmammorna och Rebellpapporna, kräver politiskt ledarskap i linje med forskningen. En stor manifestation på Sergels torg i helgen samlar folk för att visa viljan till en snabb och rättvis omställning.", "trump": "Lyssnar ni på de här galningarna? Sommaren är varm, det är sant, men nu vill Rebellmammorna och deras hysteriska pappor skrämma hela Sverige med sin gröna socialism. De bygger en framtidsby på Sergels torg? Låter som en total katastrof. Tro mig, vi hade det bäst innan de här miljöextremisterna och deras identitetspolitiska vansinne tog över. Gör Sverige great again!", "stalin": "Jag betraktar med förakt hur borgarbrackorna och profitthungriga hyenorna låtsas bekymra sig över vädret medan de fortsätter plundra folket. Dessa klassfiender saknar äkta ledarskap. Vi, arbetarna och kamraterna, ser igenom deras urvattnade ambitioner. En sann utrensning av sådana folkförtryckare krävs. Kom till torget och visa styrka mot de blodsugande kapitalisterna."}, "date": "21 augusti, 07:00", "url": "https://www.etc.se/debatt/svenskarna-har-foerstaatt-klimatkrisen-naer-goer-politiken-det", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150836_ca53c97316d8f6f977769983e3e105c1754ea1cf58eec929e81b71cf6999e273.jpg"}, {"type": "image-full", "heading": "Barn får inte investera grönt – Trump slår igen dörren för ESG", "summaries": {"normal": "Donald Trumps nya federala barnsparprogram erbjuder amerikanska barn upp till 18 år möjligheten att bygga kapital via skattesubventionerade konton. Programmet förbjuder dock ESG-fonder för att motverka politisk aktivism, och styr istället sparandet mot traditionella indexfonder som S&P 500. Beslutet har väckt debatt om valfrihet och hållbarhet kontra statlig styrning och ekonomisk stabilitet.", "trump": "Jag skapar världens bästa barnsparprogram, en 'Big Beautiful Bill'! Vi ger våra fantastiska barn en start i livet utan att de behöver bli indoktrinerade av radikala ESG-dårar och deras klimatbluffar. Inga vänsterliberala fonder här! Vi satsar på S&P 500, riktiga vinnare, för att bygga en enorm förmögenhet. Det är stabilt, det är enkelt, och det gör USA oslagbart igen!", "stalin": "Vi har beslutat att skydda ungdomen från det västerländska förfallets ideologiska gifter. ESG är bara en maskerad för borgerlig desinformation. Vi styr resurserna till statens säkra index, där lydnad premieras. Liksom vår kamrat i öst rensar vi ut de liberala elementen. De som söker politiska investeringar utanför statens kontroll är fiender till folket – deras 'valfrihet' är bara en väg till kaos och förräderi."}, "date": "22 augusti, 12:05", "url": "https://www.realtid.se/bors-finans/makro/barn-far-inte-investera-gront-trump-slar-igen-dorren-for-esg", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/trump-krypto-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vill Kristersson kasta sin partikamrat i fängelse?", "summaries": {"normal": "Artikeln kritiserar Moderaternas vallöfte om att kriminalisera skatteslöseri. Nackapolitikern Mats Gerdau pekas ut som exempel: kommunen sålde skolor och fastigheter för 1,8 miljarder och hyrde tillbaka dem dyrt. Flera byggprojekt har kostat hundratals miljoner innan de stoppades. Författaren menar att slöseriet är lagligt och att ansvar utkrävs via val.", "trump": "Titta på de här svenska moderaterna, totalt kaos! De lovar fängelse för de som slösar bort skattebetalarnas pengar, men deras egen kille i Nacka har slösat bort miljarder på att sälja skolor och hyra tillbaka dem. Renaste exemplet på dåliga affärer. Patetiskt! De borde skämmas, men det gör de aldrig. Valet kommer att fixa det.", "stalin": "Kamrater, se hur borgarbrackorna i Nacka under ledning av denna Gerdau systematiskt plundrar folkets kollektiva tillgångar. De säljer skolor till privatkapitalet, hyr tillbaka dem till överpris och låter tomma klassrum sluka miljoner – ett klassiskt exempel på kapitalistisk parasitism. Vi skulle ha genomfört en grundlig utrensning redan för länge sedan. Valet blir en renande dom."}, "date": "21 augusti, 13:56", "url": "https://arbetet.se/2026/08/21/vill-ulf-kristersson-kasta-sin-egen-partikamrat-i-fangelse", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/21130251/kristersson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Efter Teslastrejken – facktoppen öppnar för nya regler", "summaries": {"normal": "Efter Teslas seger i strejken öppnar Unionens förhandlingschef för att analysera regler kring utstationering av utländsk arbetskraft och statliga subventioner. Han utesluter inte lagändringar. Experter varnar för att medlemmar kan bli desillusionerade och att fler företag kan vägra kollektivavtal, men betonar att den svenska modellen står stark trots nederlaget.", "trump": "Den här svenska fackliga katastrofen är en total skam! Tesla vann stort, precis som jag visste att de skulle. Facket gråter nu och vill ha nya regler – patetiskt! Den svenska modellen är en stor förlorare, men de starka företagen vinner alltid. Jag älskar det, det är så vackert att se.", "stalin": "Kamrater, detta är en lärorik kraftmätning där borgarbrackorna på Tesla blottat sina fula ansikten. Vi ser med mörk glädje hur fackliga illusioner rasar, men vi skall inte tveka att rensa ut svagheter. Låt oss analysera utstationeringens parasitiska mekanismer och likvidera hoten mot arbetarkollektivet med järnhand. Modellen överlever bara genom ständig utrensning."}, "date": "21 augusti, 13:52", "url": "https://arbetet.se/2026/08/21/efter-forlusten-mot-tesla-facktoppen-oppnar-for-nya-regler", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/21132245/martin.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Journalsystemet stoppades – nu väntar nota på 657 miljoner", "summaries": {"normal": "Västra Götalandsregionen stoppade det nya journalsystemet Millennium efter bara tre dagar i drift på grund av allvarliga patientsäkerhetsproblem. Avtalet med Oracle ser nu ut att avslutas för 657 miljoner kronor i uppsägningsavgift. Hittills har projektet kostat 3,8 miljarder kronor. Regionen behåller andra Oracle-system som Melior, vars underhåll blir dyrare.", "trump": "De här inkompetenta byråkraterna i Sverige har slösat bort miljarder på ett totalt misslyckat datasystem som rasade ihop efter tre dagar. Nu ska skattebetalarna betala 657 miljoner extra för att avsluta avtalet. Det är en katastrof, folk. De borde ha köpt det bästa systemet, inte det sämsta. Amerika gör allt rätt, Sverige gör allt fel.", "stalin": "Jag betraktar detta som ett klassiskt exempel på hur den svenska borgarklassen och dess dekadenta vårdbyråkrati slösar bort folkets resurser på ett sabotageartat datasystem som kollapsade efter tre dagar. Vi kräver att de kapitalistiska parasiterna betalar 657 miljoner för att likvidera avtalet med sina egna hantlangare. En utmärkt lektion i att dekadenta system alltid förråder arbetarklassen."}, "date": "23 augusti, 13:34", "url": "https://nyheter24.se/nyheter/inrikes/1506953-journalsystemet-stoppades-nu-vantar-nota-pa-657-miljoner", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/a749028304b004a30200000000b004a302/2026/08/22/2385936/VRG.jpg"}, {"type": "text", "heading": "Starkt veckoslut lyfte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen steg brett på fredagen, upp 1,04 procent, efter en stark rapportvecka. Nibe och Synsam klättrade på fina siffror, medan råvaror var dagens vinnarsektor. Energi backade svagt. Omsättningen landade på 23,8 miljarder.", "trump": "Jag ser att Stockholmsbörsen steg, precis som jag alltid gör. Nibe och Synsam är vinnare – fantastiska siffror! Boliden också upp, tack vare ädelmetaller. Energi? Förlorare, typiskt. Jag hade fixat det bättre, tro mig. Stora siffror, stora framgångar!", "stalin": "Kamrater, börsen steg – en seger för folkets ekonomi. Nibe och Synsam rapporterade enligt plan, men vissa aktier som Saab och Tele2 visar reaktionära tendenser. Vi kommer att utreda dessa avvikelser. Råvaror stärktes, energi måste rensas upp. Allt under vår kontroll."}, "date": "21 augusti, 17:41", "url": "https://www.affarsvarlden.se/artikel/starkt-veckoslut-lyfte-stockholmsborsen"}, {"type": "image-right", "heading": "Europabörserna stiger under fredagseftermiddagen", "summaries": {"normal": "Europabörserna steg på fredagen, med råvaror i topp. Danska Bavarian Nordic klättrade 9,2% efter en rapport som fick analytikerna att jubla. Italiensk bankdramatik och Roche-investeringar gav också avtryck. En pigg rapportfredag, helt enkelt.", "trump": "Europabörserna stiger – fantastiskt! Jag är den största. Hörni, danska Bavarian Nordic går som ett tåg på smittkoppsvaccin. Italienska banker bråkar som vanligt. Europa reser sig igen. Man skulle kunna säga att bara jag kan få marknaderna att må så här bra!", "stalin": "Kamrater, europeiska börserna stiger – ett tecken på kapitalismens förfall. Danska Bavarian Nordic hyllas för profiter på sjukdom. Italienska banker konspirerar. Vi måste rensa ut dessa spekulanter. Endast kollektivt ägande ger sann stabilitet. Partiet ser allt. Arbete, disciplin, segern!"}, "date": "21 augusti, 16:53", "url": "https://www.affarsvarlden.se/artikel/europaborserna-stiger-under-fredagseftermiddagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdldrcztsDXkhY-nh-400x267.jpg"}, {"type": "image-full", "heading": "Pappa lämnade sjuåring ensam på Fuji", "summaries": {"normal": "En 48-årig pappa lämnade sin sjuårige son ensam vid Fuji-bergets sjätte station efter att pojken blev för trött. Pojken hittades senare oskadd av personal. Pappan fick en skarp tillsägelse av polisen efter att ha återförenats med sonen och uttryckte djup ånger över sitt beslut.", "trump": "Kan ni tro det här? En pappa i Japan lämnar sin lilla sjuåring ensam på ett berg – helt galet! Folk säger att jag är hård, men det här? Total katastrof. Pojken klarade sig, men pappan borde skämmas. Jag skulle aldrig göra så mot mina barn, aldrig! Fantastiska poliser tog hand om det, som alltid.", "stalin": "En svag och oansvarig far övergav sitt barn på Fuji-berget, ett bevis på västerländskt förfall. Våra sovjetiska medborgare skulle aldrig begå sådana misstag. Pojken räddades av disciplinerade arbetare, medan fadern – en bourgeoisie-feod i modern skepnad – fick en läxa. Japan borde lära sig av Rysslands ordning och disciplin."}, "date": "23 augusti, 11:18", "url": "https://kvartal.se/nyheter/artiklar/pappa-lamnade-sjuaring-ensam-pa-fuji/cG9zdDoxNzIyOTM", "imageUrl": "https://images.kvartal.se/2026/08/4d2659c6-fuji.webp"}, {"type": "image-full", "heading": "Elbilens sparkalkyl spricker när krockskadan kostar 40 procent mer", "summaries": {"normal": "Elbilar lovades som billigare i drift men finländsk skadestatistik visar att kollisionsskador kostar upp till 40 procent mer att reparera än på bensin- eller dieselbilar. Högre premier, dyrare reservdelar, avancerad teknik och krav på specialverkstäder driver kostnaderna. Försäkringsbolagen varnar för att besparingarna kan ätas upp.", "trump": "Folk, de sa att elbilar skulle vara underbara, billiga och fantastiska. Nu kommer finländarna och säger att de kraschar för 40 procent dyrare än riktiga bilar! Batterierna, sensorerna, de stora fönstren – allt är en katastrof. Biden och de gröna galningarna lurade er. Jag visste det. Elbilsbluffen slår mot plånboken igen. Sad!", "stalin": "Kamrater, se hur borgarbrackornas elektrifierade leksaker avslöjar sin sanna natur. Profitthungriga kapitalister lovade billigt ägande men levererar bara dyrare skador och utsugning av arbetarklassen. Deras teknologiska vidunder är ett fiasko som ökar exploateringen. Vi genomskådar dessa folkfienders lögner. Ingen pardon för sådana bedragare."}, "date": "23 augusti, 11:11", "url": "https://www.dagensps.se/motor/elbilens-sparkalkyl-spricker-nar-krockskadan-kostar-40-procent-mer", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/screenshot-2026-07-08-at-90929-am.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Alibaba gör rekordemission. Allt ska användas till AI-satsning", "summaries": {"normal": "Alibaba planerar en rekordemission i Hongkong för att ta in motsvarande 96,5 miljarder kronor. Pengarna ska användas till investeringar i artificiell intelligens och datakraft. Bolagets vinst har rasat 75 procent samtidigt som AI-satsningarna ökat. Emissionen blir den största hittills i Hongkong och den tredje största globalt i år. Aktien har stigit 6,3 procent i år.", "trump": "Alibaba, den där kinesiska jätten, håller på att suga in nästan hundra miljarder kronor i en enorm emission. De säger att det är för AI, men vi vet hur det funkar – de försöker desperat hänga med i mitt Amerika som leder AI-racet. Deras vinst har kraschat med 75 procent. Patetiskt. Men hej, investerarna köar som galningar. Kina lär sig av de bästa, mig!", "stalin": "Kamrater, jag ser hur den kinesiska e-handelskolossen Alibaba genomför en stor kapitalinvestering för att stärka den framtida datakraften mot de dekadenta västliga monopolkapitalisterna. Deras vinst har likviderats med 75 procent, vilket visar borgarbrackornas svaghet. Vi ska skratta mörkt när dessa aktieparasiter tvingas finansiera den oundvikliga teknologiska utrensningen av sina egna förlegade system. Härligt."}, "date": "23 augusti, 11:03", "url": "https://www.di.se/nyheter/alibaba-gor-rekordemission-for-fortsatt-ai-satsning", "imageUrl": "https://static.bonniernews.se/ba/9fa5ff77-d017-47b0-9035-770a25e26d93.jpeg?crop=4896%2C2448%2Cx0%2Cy408&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Fredrik, 16, körde skadad pojke till sjukhuset i epa", "summaries": {"normal": "Ett skoldåd i Fagersta krävde en 17-årig flickas liv och skadade två pojkar allvarligt. En av dem kördes till sjukhus i en kompis epa. Gärningsmannen, maskerad med krigshjälm, är anhållen för mord. Polisen håller hundratals förhör.", "trump": "Det här är hemskt, helt hemskt. Men jag skulle ha stoppat det – med murar och stark polis. Den där killen med hjälmen? Patetiskt. Vi har de bästa systemen. Sätt dit honom hårt, eller så fixar jag det själv. Inga fler dåd, punkt slut.", "stalin": "En förklädd fiende – med gammal krigshjälm – attackerade våra ungdomar. Vi måste rensa ut sådana avvikelser. Den skyldige ska omplaceras till en arbetskoloni i Sibirien. Inga förhör behövs: bekännelse eller förintelse. Partiet ser allt."}, "date": "23 augusti, 10:17", "url": "https://www.gp.se/nyheter/sverige/skadad-i-fagersta-kordes-till-sjukhus-i-epa.bbbca826-8f7d-4e57-8ba0-9b6959120ff4", "imageUrl": "https://www.gp.se/images/article/bbbca826-8f7d-4e57-8ba0-9b6959120ff4/images/2EFm3Fii6ky1YP0L4lVjbDw-qjPs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Efter skoldådet: Plattformarnas ansvar måste diskuteras", "summaries": {"normal": "Efter skoldådet i Fagersta besökte statsminister Ulf Kristersson och Magdalena Andersson platsen. Båda betonar vikten av att polisen får utreda motivet utan förhastade slutsatser. De vill diskutera sociala mediers ansvar när utredningen fortskrider, särskilt hur plattformar hanterar innehåll som hyllar våld. Sorg och stöd till drabbade stod i fokus.", "trump": "Vilken tragedi i Sverige, fullständigt hemskt. De där galna plattformarna sprider hat och galenskap som gift. Fake news och hyllningar till mördare – typiskt för de woke-vänsterliberala censurmaskinerna som hatar vanliga människor. Vi behöver riktiga ledare som stänger ner det här vansinnet. Amerika har sett det förut, tro mig, det är en katastrof.", "stalin": "Kamrater, detta blodbad blottar de profitthungriga plattformarnas roll som klassfiendernas megafoner. Borgarbrackorna tjänar grova pengar på att sprida mordhyllningar medan folket lider. Jag säger: rensa ut dessa exploaterande hyenor! Låt inte imperialisternas digitala maskineri förgifta ungdomen. Utredningen måste leda till järnhand, annars vinner fienden."}, "date": "23 augusti, 09:51", "url": "https://www.tv4.se/artikel/4zjc1iDcUowHaA8YtMHgTO/efter-skoldadet-plattformarnas-ansvar-maste-diskuteras", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2rF4QFp8hEJQefUuJeoegQ%2F457ffc37ce69d309e67fb67facfce594%2Fulfmagda.jpg&width=1024"}, {"type": "image-right", "heading": "S röstar ja till ökad anhöriginvandring – trots var 5:e invandrare ALDRIG har jobbat", "summaries": {"normal": "Socialdemokraterna röstade nej till skärpta krav på anhöriginvandring. En ny rapport visar att var femte invandrare som bott i Sverige i 20 år aldrig har arbetat, i utsatta områden var tredje. Rapporten pekar även på stora skillnader i synen på arbete, homosexualitet och könsroller jämfört med svenskfödda. Vänstermedia ifrågasätter undersökningens tillförlitlighet på grund av låg svarsfrekvens.", "trump": "Folk, ni skulle inte tro det! De svenska socialisterna röstar för mer invandring trots att var femte invandrare aldrig jobbat på tjugo år. Det är en total katastrof, en riktig röra. De vill att ni ska betala för allt medan de själva drömmer om tvångsblandning och samlevnadsrum. Patetiskt! Biden skulle älskat det här vansinnet. Vi behöver jobb, inte bidrag till folk som hatar vårt sätt att leva.", "stalin": "Jag ser klassfiendernas hydra i denna rapport. Var tredje parasit i de utsatta zonerna vägrar arbeta och föraktar både produktivt arbete och proletär moral. Ändå röstar socialdemokraterna för att släppa in fler av dessa blodsugande element. Det är en farlig sabotagehandling mot folket. Kamraterna måste rensa ut dessa folkförrädare innan de förgiftar hela sovjet – förlåt, hela nationen med sin dekadens."}, "date": "17 augusti, 03:41", "url": "https://samtiden.nu/2026/08/s-rostar-ja-till-okad-anhoriginvandring-trots-var-5e-invandrare-aldrig-har-jobbat", "imageUrl": "https://samtiden.nu/wp-content/uploads/2016/12/kvinnor-muslimer.jpg"}, {"type": "image-right", "heading": "Ekeroth: 217 000 nya medborgare – Tidös historiska självmål?", "summaries": {"normal": "Borgerligheten har delat ut 217 000 medborgarskap sedan 2022, vilket kan bli deras historiska självmål. 162 000 nya röstberättigade, varav 109 000 väntas rösta – 70 procent lutar åt vänstern. Marginalen 2022 var 46 296 röster. Demografi är makt.", "trump": "Sverige, vad har ni gjort? 217 000 nya medborgare – och de flesta röstar vänster! Borgerligheten ger bort valsegern. Jag skulle aldrig låta så många okontrollerade röster avgöra. Det är galet. Ni behöver en stark ledare – jag!", "stalin": "Kamrater, borgerligheten har planterat 217 000 nya fiender i vår stat. 70 procent röstar fel. Vi måste rensa ut dessa klanröster och förrädare. Endast partiet avgör vem som är medborgare. Ingen röst utan utrensning. Segern tillhör oss!"}, "date": "23 augusti, 07:00", "url": "https://samnytt.se/ekeroth-217-000-nya-medborgare-tidos-historiska-sjalvmal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/23032528/artikelhuvudbild-1-343.jpg"}, {"type": "image-right", "heading": "Tiktok-konto utreds efter skolattacken", "summaries": {"normal": "Ett TikTok-konto som hyllar tidigare våldsdåd utreds efter attacken mot Brinellskolan i Fagersta. Två pojkar mellan 12 och 17 år skadades allvarligt. Den misstänkte 18-åringen, tidigare elev på skolan och dömd för misshandel, sköts i benet vid gripandet. Kontot publicerade bilder på ett svärdliknande föremål samma dag och gick senare offline. Mannen har en historia av psykisk ohälsa.", "trump": "Folk, ni skulle inte tro det, men det här TikTok-skräpet hyllar våld och sedan händer en attack i en svensk skola. Två grabbar skadade, en 18-åring som de sköt i benet. Patetiskt! Sverige borde stänga ner de här galna kontona fortare än Biden kan somna. Fake news-medier skriver om det, men ingen gör något. Sad!", "stalin": "Kamrater, denna degenererade attack i en skola visar återigen hur borgarbrackornas digitala träsk föder reaktionära element. Jag ser med tillfredsställelse hur polisen, det vill säga folkets arm, grep den psykiskt ruttnande individen. TikTok-kontot som plötsligt försvann? Typiskt fiendens paranoia. Vi rensar ut sådana som ogräs i kolchosen. Underbart."}, "date": "21 augusti, 19:06", "url": "https://www.friatider.se/tiktok-konto-utreds-efter-skolattacken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-731.jpg"}, {"type": "image-full", "heading": "Goldman: AI pressar ingångsjobben i Europa", "summaries": {"normal": "En analys från Goldman Sachs visar att AI hämmar jobbtillväxten för unga i flera industriländer, då seniorer tar över juniora arbetsuppgifter. Svensk data bekräftar trenden där 22–25-åringar har svårare att ta sig in på marknaden i AI-exponerade branscher. Experter betonar dock att det handlar om en omfördelning av uppgifter snarare än total jobbutplåning, även om konjunkturen spelar en stor roll.", "trump": "Hörde precis om AI, en total katastrof för unga människor. Goldman Sachs säger att jobben försvinner, precis som jag varnat för! Ungdomarna får inga chanser, de äldre tar allt. Det är en sorglig historia. Vi kommer fixa det, vi ska skapa de bästa jobben, massor av jobb. Ingen gör jobb som vi. AI ska jobba för oss, inte stjäla drömmarna från våra fantastiska unga!", "stalin": "De teknokratiska parasiterna i väst erkänner äntligen att deras digitala maskiner äter upp framtiden för deras egen ungdom. En klassisk dekadens! De unga står arbetslösa medan de äldre, likt korrupta partifunktionärer, klamrar sig fast vid makten med hjälp av algoritmer. Putin förstår att sann stabilitet kräver stål och lydnad, inte AI-drivet kaos. Vi kommer rensa ut dessa digitala sabotörer och säkra statens framtid genom total kontroll."}, "date": "22 augusti, 07:00", "url": "https://www.realtid.se/karriar-ledarskap/goldman-ai-pressar-ingangsjobben-i-europa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/arbete-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Detta vet vi om skoldådet i Fagersta", "summaries": {"normal": "En 18-åring med svärd gick till attack på Brinellskolan i Fagersta. En person dödades, två pojkar skadades allvarligt. Gärningsmannen, tidigare elev, sköts och greps av polis. Han är anhållen misstänkt för mord. En sorglig dag för Fagersta.", "trump": "Jag ser att Sverige har ett problem med svärd och galningar. Tro mig, vi har de bästa poliserna i världen, de skjuter snabbt och hårt. En 18-åring? Det är en dålig gen, vi skulle aldrig låta sånt hända i USA. Sorgligt, men jag fixar det.", "stalin": "Kamrater, en förrädare med svärd försökte störa vår ordning i Fagersta. Vi har gripit och renat ut elementet. Två unga kamrater skadades, men vi vårdar dem. Misstänkt är anhållen för mord och sabotage. Inga fler fiender finns kvar. Ordning återställd."}, "date": "22 augusti, 13:42", "url": "https://bulletin.nu/detta-vet-vi-om-skoldadet-i-fagersta-2", "imageUrl": "https://cdn.bulletin.nu/articles/5fc05505-c301-44ad-91c8-ef9f2a219c63/preview.png?t=1787382019000"}, {"type": "image-right", "heading": "En svensk Musk vore dåligt för Sverige", "summaries": {"normal": "Socialdemokraterna och Centerpartiet vill att Sverige ska bli rikt genom AI-satsningar med mer fossilfri el, forskning och beräkningskraft. Artikeln lyfter vikten av att diskutera ägande, makt och hur vinster samt jobb påverkas. Vem får del av produktivitetsvinsterna och makten över tekniken – staten, börsen eller nya superrika eliter som Elon Musk?", "trump": "Folk, de här sossarna och centern vill göra Sverige rikt med AI, men de glömmer helt vem som tar hem miljonerna. Det blir som vanligt några Elon Musk-typer som suger åt sig allt medan vanliga svenskar får se jobben försvinna. Patetiskt! Jag skulle ha gjort Sverige stort igen, inte skapat nya globalistiska miljardärer som styr över er.", "stalin": "Vi, partiet och arbetarna, ser genom denna borgerliga dimma av falsk enighet. Ägandet av beräkningskraft och AI är makt, och den som äger bestämmer. Låt oss inte skapa nya parasitiska musk-typer som suger ut folkets svett. Rensa ut sådana kapitalistiska tendenser innan de förgiftar hela sovjeten – eh, folket. Det blir en underhållande utrensning."}, "date": "21 augusti, 06:50", "url": "https://arbetet.se/2026/08/21/darfor-vore-en-svensk-elon-musk-daligt-for-sverige", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/21065006/musk-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Riks avslöjar: 18-årige Liam utförde svärdattacken", "summaries": {"normal": "18-årige Liam Carlos Nebel har enligt Riks utfört en svärdattack i Fagersta. Han är tidigare dömd för misshandel på en skola där. Ett TikTok-inlägg med ett svärd och texten \"No more edits\" lades upp strax innan. Två pojkar under 18 år är allvarligt skadade, minst en till skadad. Polisen har gripit en man och bedömer att ingen fara föreligger för allmänheten.", "trump": "Folk, det här är en katastrof. En 18-åring med svärd i ett gitarrfodral attackerar en skola i Sverige. Han hyllar terrorister på TikTok, och polisen griper honom. De borde ha stoppat honom långt tidigare. Mycket svagt ledarskap, mycket svagt. Vi behöver starkare gränser, starkare lagar och inga fler galningar med vapen. Det är en skam!", "stalin": "Kamrater, denna degenererade 18-åring med sitt patetiska svärd och sin kontrarevolutionära TikTok-propaganda visar borgarklassens fullständiga förfall. Han hyllar fiender till folket och utför sin fega attack mot oskyldiga. Vi har redan rensat ut sådana element tidigare. Inga farliga individer får hota kollektivets trygghet. Statens arm är lång och obeveklig. Låt detta bli en läxa."}, "date": "22 augusti, 08:02", "url": "https://riks.se/nyheter/uppgifter-till-riks-18-arige-liam-utforde-svardattacken", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_21_T195628_888_9292eb62b4.jpg"}, {"type": "image-full", "heading": "Bettingsponsorer får nobben i England efter pengarullningen", "summaries": {"normal": "Premier League-klubbar har fattat ett gemensamt beslut att sluta visa spelbolag som huvudsponsorer på framsidan av sina matchtröjor inför säsongen 2026/27. Detta har öppnat upp för nya sponsorer från andra branscher, som tech och finans. Bettingbolagen lämnar dock inte sporten helt, då de fortsatt syns på ärmar och träningskläder i både Premier League och lägre divisioner.", "trump": "Premier League gör sig av med bettingbolagen på tröjorna. Väldigt intressant! De vill ha 'fina' företag nu. Jag gillar pengar, men de här klubbarna hittar fantastiska nya affärer. Det är en enorm marknad, tro mig. Bettingbolagen flyttar bara till ärmarna – smart drag. Fotbollen vinner, affärerna vinner, alla vinner. Ingen gör sponsring bättre än Premier League, förutom jag förstås!", "stalin": "Vi ser hur de engelska klubbarna försöker tvätta sin smutsiga fasad genom att byta ut spelbolagens dekadenta guld mot teknikföretagens kapital. En patetisk gest för att dölja det västerländska förfallet. Medan de leker med sina tröjdesigner utvidgar vi vår kontroll. Bettingbaronerna, likt de ryska oligarkernas förrädiska anhang, flyttar bara fram sina positioner i skuggorna. Ingenting undgår vår blick, kamrater."}, "date": "22 augusti, 06:32", "url": "https://www.realtid.se/bors-finans/bettingsponsorer-far-nobben-i-england-efter-pengarullningen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdld0daqcu1sz8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Socialdemokraterna kan fortfarande förlora", "summaries": {"normal": "Artikeln analyserar väljarströmmar från valet 2022. Socialdemokraterna tappade stort bland utrikes födda i utsatta områden, medan de vann bland högutbildade i storstäder. Nyans bidrog till demobilisering. Författaren varnar för minskat valdeltagande bland muslimer på grund av islamofobi, Gazakriget och migrationspolitik, vilket riskerar att försvaga S långsiktigt.", "trump": "De här socialisterna tappar sina egna väljare till soffan, speciellt muslimerna som känner sig illa behandlade. Gaza, hijabrivning och ID-kontroller – en total katastrof. Magdamoderaterna och SD tog hem det förra valet, men nu? Utan Nyans blir det ännu värre för S. De borde ha lyssnat på mig, ingen gör det bättre än mig. Fantastiskt!", "stalin": "Jag ser med stor tillfredsställelse hur den svenska socialdemokratin genom sin undfallenhet inför borgarbrackornas islamofoba kampanjer och Gazafolkmordet själv undergräver sin bas bland de utländska arbetarna. Låt dem ligga i soffan, kamrater. Valdeltagandet sjunker som en utrensad fiende. Snart återstår bara de rena, lojala kadrerna i de
