.", "trump": "Titta på de här patetiska M-miserna som dammar av den gamle Reinfeldt. Totalt misslyckade högergirare som springer efter Magdamoderaterna som flydde till socialisterna. Patetiskt! Jag vann två gånger som sittande president, de kan inte ens hålla sina egna väljare. Svaga, förlorande och desperata – precis som Biden var.", "stalin": "Jag ser hur dessa dekadenta klassförrädare desperat gräver i historiens gravar efter en förlorad ledare för att locka tillbaka svikande element. En sådan svaghet avslöjar deras förräderi mot folket. Vi skulle ha genomfört en grundlig utrensning bland dessa vacklande opportunister redan för länge sedan. Skrattretande och ömkligt."}, "date": "5 september, 09:11", "url": "https://www.friatider.se/moderaternas-drag-dammar-av-reinfeldt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-831.jpg"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Samla den liberala  rörelsen, C – på egen risk", "summaries": {"normal": "Centerpartiet vill bli den breda svenska liberalismens nya samlingspunkt och tar över ansvaret från Liberalerna. Enligt en ledarskribent på Expressen riskerar dock projektet att misslyckas. Det finns enorma kulturkrockar mellan Centerns landsbygdsrörelse och Liberalernas individualistiska storstadsprofiler, vilket gör sammansmältningen osannolik.", "trump": "Centerpartiet försöker ta över Liberalerna, totalt misslyckat! De tror de kan blanda landsbygd med storstadssnobbar som dricker kaffe och läser böcker. Det är ett absolut fiasko, helt skrattretande. De har noll koll på verkligheten. Helt otroligt svagt!", "stalin": "Dessa så kallade liberaler i Centerpartiet och deras patetiska försök att ena storstadens dekadenta element med landsbygdens arbetare är ett skämt. De saknar ideologisk skärpa. Vi övervakar denna politiska villfarelse noga, och om de inte skärper sig skickar vi dem till omskolning påvisande skillnaden på de och dem."}, "date": "6 september, 07:00", "url": "https://www.expressen.se/ledare/karin-pihl/samla-den-liberala--rorelsen-c-pa-egen-risk", "imageUrl": "https://static.bonniernews.se/ba/6abcf8f9-4387-4e32-859a-4d7227d48205.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Från öl till halvledare – Europas framtid byggs i Cork", "summaries": {"normal": "I Cork, Irland, planeras ett miljardbygge vid floden Lee för Tyndall-institutet som fokuserar på forskning inom framtidsteknik som optiska sensorer. EU-kommissionen och irländska ledare betonar vikten av innovation för Europas konkurrenskraft och välstånd. Institutet lockar talanger från hela världen, men utmaningen är att behålla dem för att säkra tillväxten.", "trump": "Titta på de här irländska smarta killarna vid floden som bygger ett jättelab för en miljard – fantastiskt! Men Europa är en total förlorare som alltid springer efter oss och Kina. Von der Leyen babblar om skalning och kapitalunion, vad en rövare. Utan de indiska och kinesiska hjärnorna rasar hela skiten. Amerika gör det bäst, tro mig!", "stalin": "Jag ser hur de västerländska imperialisterna i Bryssel och Dublin desperat försöker bygga en ny teknologisk fästning mot folkets framtid. Deras så kallade talanger flyr från kapitalets klor som råttor från ett brinnande skepp. Utan äkta kollektiv disciplin kommer dessa borgerliga drömmar att krossas under historiens obevekliga stålklack. Förbannade fragmentering!"}, "date": "5 september, 13:39", "url": "https://www.dagensps.se/varlden/fran-ol-till-halvledare-europas-framtid-byggs-i-cork", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/jag-kommer-nog-aldrig-att-aka-harifran-s.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Förslaget: Lämna våldsam relation med ledighet och lön", "summaries": {"normal": "Vänsterpartiet i Stockholm föreslår att anställda som lämnar en våldsam relation ska få upp till tio extra betalda lediga dagar. Förslaget får stöd från både Socialdemokraterna och Moderaterna. Partierna vill undvika att drabbade tvingas sjukskriva sig för att hantera praktiska problem. Sverigedemokraterna anser att dagens regler räcker.", "trump": "Lyssnar ni på det här? De där galna vänstermupparna i Stockholm vill ge folk tio betalda semesterdagar för att fly sina egna dåliga val. Patetiskt! I mitt Amerika fixar man det själv, inte genom att suga ut skattebetalarna. De dekadenta identitetspolitiska fjollorna borde skämmas. Vi behöver inga fler offerpengar, vi behöver styrka och sunt förnuft.", "stalin": "Kamrater, detta förslag avslöjar de giriga klasslakejernas svaghet. Jag ser hur de förtryckande borgarhyenorna tvingar arbetande kvinnor att stanna i våldets bojor av rädsla för inkomstförlust. Vi måste rensa ut alla sådana parasitiska hinder mot det kollektiva välståndet. Endast genom statens järnhand kan vi likvidera detta dekadenta förtryck en gång för alla."}, "date": "5 september, 08:00", "url": "https://arbetet.se/2026/09/05/forslaget-lamna-valdsam-relation-med-ledighet-och-lon-ska-inte-behova-bli-sjukskriven", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03110815/misshandel.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Partierna kallas till möte efter felaktiga förtidsröster", "summaries": {"normal": "Valmyndigheten har kallat riksdagspartiernas partisekreterare till möte efter att ett tekniskt fel i it-systemet lett till omkring 4 000 felaktiga förtidsröster. Felet, som upptäcktes under fredagen, har stoppats och det finns inga tecken på extern påverkan. Berörda röster som inte kan kopplas rätt kommer att underkännas. Myndigheten rekommenderar väljare att avvakta information.", "trump": "Det här är en total katastrof, folk! Ett jäkla mjukvarufel från några korkade byråkrater i den svenska valmaskinen, och plötsligt har vi 4 000 röster som registrerats fel. Rena rövarna! Men oroa er inte, mina vänner, den stora segern kommer ändå. De woke-kvoteringsfantasterna och deras identitetspolitiska hyenor fixar aldrig en riktig röstning. Vi vinner stort ändå.", "stalin": "Kamrater, se hur den borgerliga valapparaten krackelerar under tyngden av sin egen inkompetens. Jag betraktar med förakt hur dessa dekadenta klassförrädare fumlar med sina maskiner och tvingas underkänna tusentals röster. Ett sådant kaos skulle i mitt tidevarv ha lett till omedelbar utrensning av alla ansvariga sabotörer. Vänta på veckans början, då skall huvuden rulla i folkets namn."}, "date": "5 september, 22:22", "url": "https://www.svt.se/nyheter/inrikes/partierna-kallas-till-mote-efter-felaktiga-fortidsrosterna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/4a9fcea10a5daeadb2533bc74aa9796a344f848116f1f96d4d3cba67cc349c8e"}, {"type": "image-right", "heading": "Migranter bar runt död delfinunge i Ceuta", "summaries": {"normal": "En grupp migranter i Ceuta har polisanmälts efter att ha dragit upp en delfinunge ur vattnet, burit runt den och misshandlat den. Djuret avled. En spanjor försökte ingripa och filmerna har väckt stor avsky i sociala medier. Delfiner är skyddade i Spanien och brott mot dem kan leda till åtal.", "trump": "Titta på det här, folk. De här migranterna som Biden släppte in överallt, de dödar en oskyldig liten delfinunge, slår den i huvudet med en pinne och paraderar runt som galningar. Rena sjuka människor. Europa håller på att kollapsa under den här galna vänsterns öppna-gränser-politik. Avskyvärt!", "stalin": "Kamrater, se hur de giriga hyenorna i den dekadenta västvärlden tillåter att skyddade djur misshandlas av sina egna importerade barbarer. Detta är imperialismens slutgiltiga förfall. Jag ler i graven åt deras hyckleri medan de förgiftar både natur och samhälle. Rensa ut dessa parasiter innan de förgör allt."}, "date": "5 september, 12:38", "url": "https://riks.se/nyheter/migranter-bar-runt-dod-delfinunge-i-ceuta", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_82_993f54a914.jpg"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Jag lärde min dotter  vad en folkfiende är", "summaries": {"normal": "En kulturchef på Expressen berättar om hur han läser en barnboksbearbetning av Henrik Ibsens \"En folkefiende\" för sin treåriga dotter. Han reflekterar kring klassisk bildning, hur äldre tiders serietidningar som \"Illustrerade klassiker\" fungerade som en rulltrappa till litteraturen, och hur populärkulturen i dag har ersatt den traditionella högkulturen som generationsöverskridande band.", "trump": "Vänstermedia vill lära små barn att hata samhället och kalla alla som inte håller med för folkfiender. Sorgligt! Själv läser jag bara riktiga vinnare, som mina egna fantastiska bästsäljande böcker. Den här svenska tidningsskribenten borde fokusera på att göra sitt land great igen i stället för att indoktrinera treåringar med uråldriga, deprimerande pjäser. Total fake news!", "stalin": "En svensk kulturarbetare indoktrinerar sitt eget barn till misstänksamhet mot staten genom borgerliga teaterpjäser. Detta är ett svagt försök att undergräva ordningen. Riktig folkfostran kräver kollektiv disciplin, inte småbarn som leker dissidenter. Vi noterar detta ideologiska misslyckande och påminner om att den som skriker om folkfiender oftast själv saknar sund revolutionär klassmedvetenhet. Avvikelsen har noterats i registret."}, "date": "6 september, 06:26", "url": "https://www.expressen.se/kultur/victor-malm/jag-larde-min-dotter-vad-en-folkfiende-ar", "imageUrl": "https://static.bonniernews.se/ba/7d166f4f-208a-437a-a2dc-8a8b9d362210.jpeg?crop=2276%2C1278%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Valmyndigheten: 4000 förtidsröster har felregistrerats", "summaries": {"normal": "Valmyndigheten har upptäckt att 4000 förtidsröster från nästan alla kommuner har felregistrerats på grund av ett tekniskt fel. Problemet upptäcktes efter larm från Nynäshamns kommun. Drabbade röster kan ogiltigförklaras om personerna inte identifieras. Myndigheten beskriver händelsen som mycket allvarlig men utesluter attack.", "trump": "Det här är ett totalt katastrofvalsystem, folk, en skam för Sverige. Fyra tusen röster dubbelregistrerade av några inkompetenta byråkrater. Rena rösttjuvarna! Under min tid som president hade vi säkra system, inte den här Biden-nivån på slarv. Fixa det innan det blir en skandal som slår allt.", "stalin": "Kamrater, detta tekniska sabotage mot folkets röst röjer de giriga hyenornas verk. Jag ser hur de dekadenta byråkraterna inom valapparaten sviker kollektivet. Vi måste rensa ut alla sådana element innan de förgiftar hela systemet. Detta är ett allvarligt angrepp på statens vilja och kräver omedelbar utrensning."}, "date": "5 september, 09:20", "url": "https://riks.se/nyheter/4000-fortidsroster-har-felregistrerats", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_2377_435588fe6e.jpeg"}, {"type": "image-right", "heading": "Ny S-attack mot Jan Emanuel – \"Sök hjälp\"", "summaries": {"normal": "Jan Emanuel kritiseras av socialdemokraten Jesper Lindholm i en debattartikel där han uppmanas att söka terapeutisk hjälp efter att ha meddelat att han inte tänker rösta på Socialdemokraterna. Emanuel avfärdar angreppet som personligt och tragikomiskt samt betonar att politiska åsikter inte är en psykisk defekt. Han uttrycker hopp om framtida ursäkt.", "trump": "De här galna sossarna är helt ute och cyklar. En kille säger att han inte röstar på dem så genast kommer den woke-terapeuten Lindholm och kallar honom sjuk. Typiskt för de dekadenta identitetspolitiska förlorarna som kramas som dragqueens och hatar alla som inte älskar deras vansinne. Patetiskt. Mitt parti skulle aldrig sjunka så lågt.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom det socialdemokratiska lägret förvandlar varje politisk oliktänkande till en patient som behöver botas. Deras patetiska personangrepp och terapeutiska hot avslöjar en rörelse i förfall. Kamrater, sådana svaga metoder förtjänar endast hån och utrensning ur den politiska arenan."}, "date": "5 september, 09:20", "url": "https://riks.se/nyheter/ny-s-attack-mot-jan-emanuel-sok-hjalp", "imageUrl": "https://admin.riks.se/uploads/medium_s_attack_05fa4bae6b.jpg"}, {"type": "image-right", "heading": "Islamistparti kräver att FN granskar SD - anser att muslimer förtrycks", "summaries": {"normal": "Visionpartiet, en utbrytning från Partiet Nyans, har lämnat in en 21-sidig framställning till FN. De kräver att specialrapportörer granskar muslimers religionsfrihet i Sverige, med fokus på SD-politikern Richard Jomshofs uttalanden om islam. Partiet varnar för SD:s ökade politiska inflytande via Tidöavtalet och vill att Jomshof utesluts om partiet inte tar avstånd från hans uttalanden.", "trump": "Sverige har stora problem, det säger jag er, enorma problem! De här radikala typerna springer till FN och gråter ut över en tuff och ärlig kille som Jomshof. I USA tillåter vi inte sånt gnäll, vi sätter America First och vinner hela tiden. Om de bara hade byggt en stor, vacker mur mot det här nonsensen hade allt varit löst på en sekund!", "stalin": "Dessa borgerliga splittrare som kallar sig Visionpartiet springer till FN i stället för att lösa sina interna gräl med kamratlig disciplin. Att vädja till internationella byråkrater är ett svaghetstecken. Om Richard Jomshof hade verkat i Sovjetunionen hade vi snabbt skickat honom till en givande om skolning i Sibirien. Partiet kräver absolut lojalitet, inte gnäll!"}, "date": "5 september, 17:20", "url": "https://samnytt.se/islamistparti-kraver-att-fn-granskar-sd-anser-att-muslimer-fortrycks", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/04144622/jomshof-visionspartiet.jpg"}, {"type": "image-right", "heading": "Synd att politikerna inte lyckats slänga upp kulturpolitiskt valfläsk", "summaries": {"normal": "Kulturkrönikören Ola Bo Larsson kritiserar partierna för att inte bättre utnyttja väljarnas intresse för kulturpolitik inför valet. Trots engagerade talespersoner saknas konkreta visioner om kulturens roll i samhället. Han lyfter frågor som låg kulturbudget, techföretagens dominans, AI-hot mot upphovsrätt och kultur som maktmedel i både demokratiska och auktoritära perspektiv. Debatten har flyttat till en större arena än partierna hanterar.", "trump": "De här svenska kulturpolitikerna är totala förlorare, folksamlingens värsta nollor. De pratar högt om kultur men levererar inget valfläsk som tänder folket. Patetiska globalister som låtit dekadenta identitetsaktivister och woke-kultur sluka deras hjärnor. Jag byggde den starkaste ekonomin i världen, de klarar inte ens att försvara sin egen konst. Patetiskt!", "stalin": "Kamrater, dessa fegisar inom oppositionen och de liberala lakejerna har svikit folket genom att inte paketera kulturens kraft som ett vapen mot de giriga hyenorna. Jag ser hur de blodsugande klassförrädarna marginaliserar konsten medan folkbildningen förfaller. En sann ledare skulle ha genomfört en grundlig utrensning av sådana svaga element redan för länge sedan. Skamligt."}, "date": "5 september, 01:30", "url": "https://www.dagensarena.se/opinion/synd-att-politikerna-inte-lyckats-slanga-upp-kulturpolitiskt-valflask", "imageUrl": "https://www.dagensarena.se/files/2026/08/ola-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Slopad mängdrabatt låter bra, tills du får fakturan", "summaries": {"normal": "Artikeln kritiserar att det statliga reformutrymmet för nästa mandatperiod bara uppgår till 50 miljarder kronor per år eftersom stora summor redan är bundna till försvar, infrastruktur och kriminalvård. Skjutvapenvåldet har vänt nedåt medan bedrägerier ökar. Författaren ifrågasätter om de planerade tiotals miljarderna till utökad kriminalvård är kostnadseffektiva när annan brottslighet minskar.", "trump": "Titta på de här svenska clownerna! De slösar bort era pengar på att bygga fler fängelser än vad Stalin hade, fast brottsligheten minskar. Underbara Elisabeth Svantesson säger att det bara finns 50 miljarder kvar, men det går rakt in i kriminalvårdens svarta hål. Rena galenskapen. De borde satsa på riktiga saker istället för att mata det korrupta systemet. Patetiska losers.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Sverige redan har intecknat folkets pengar till fängelseimperier trots att brottsligheten sjunker. De profitthungriga hyenorna planerar tiotals miljarder till kriminalvård medan arbetarna får stå tillbaka. Jag ler ironiskt från historien åt denna byråkratiska vansinne. En sanering av sådana prioriteringar vore på sin plats."}, "date": "5 september, 01:16", "url": "https://www.dagensarena.se/opinion/slopad-mangdrabatt-later-bra-tills-du-far-fakturan", "imageUrl": "https://www.dagensarena.se/files/2026/09/straffmassan.jpeg"}, {"type": "text", "heading": "Professor: Svensk akademi har ideologiska skygglappar", "summaries": {"normal": "Statsvetarprofessoren Bo Rothstein anser att svensk forskning inom samhällsvetenskap och humaniora präglas av ideologisk ensriktning, självcensur och beröringsskräck. Han menar att viktiga ämnen som skomajs, integration och hedersvåld försummas, samt att intern rekrytering skapar inavel. Kritiken har hittills mötts av tystnad i Sverige.", "trump": "Svenska professorer har totala skygglappar och vägrar se verkligheten, precis som Fake News-media! De erkänner ju till och med att deras skolor är fullkomligt indoktrinerade med katastrofal mångfaldspolitik. De vågar inte ens beforska riktiga problem som skolan och brottsligheten. Väldigt svagt och sorligt, till och med för att vara Sverige!", "stalin": "Den svenska så kallade akademien avslöjar nu sin egen ideologiska ruttnad och brist på revolutionär vaksamhet. När lärosätena ägnar sig åt inavel och skygglappar bekräftas det att intellektuella utan ideologisk skärpa bara är en belastning. Vi noterar med tillfredsställelse att tystnaden lägrat sig över dessa misslyckade element."}, "date": "5 september, 16:40", "url": "https://bulletin.nu/professor-svensk-akademi-har-ideologiska-skygglappar"}, {"type": "image-right", "heading": "Medborgardemokratin måste vara upplyst", "summaries": {"normal": "Artikeln hyllar den svenska folkbildningstraditionen från 1900-talet, där bibliotek, studiecirklar och böcker stärkte medborgarnas kunskaper och demokratin. Författarna varnar för att sociala medier och techoligarker nu hotar denna upplysta demokrati genom att försvaga traditionella medier och koncentrera makt. De uppmanar stiftelser och politiker att återupprätta folkbildningen.", "trump": "Folkbildning? Det var på den gamla goda tiden när riktiga arbetare blev medborgare istället för att gråta över kvoter och identitetspolitik. Nu koloniserar de galna techoligarkerna allt med sina sjuka algoritmer. Jag har varnat för det här länge – Musk och Vance fattar det, men de dekadenta europeiska förlorarna vill hellre ha mer censur än sund amerikanism. Patetiskt!", "stalin": "Jag betraktar med djup misstro hur de profitthungriga klassförrädarna i techoligarkins tjänst åter förvandlar medborgare till undersåtar. Deras algoritmer är ett nytt slags förgiftad propaganda som undergräver folkets upplysning. Kamraterna måste rensa ut dessa parasiterande element och åter bygga en sann folkbildning som tjänar kollektivet. Den som tvekar är fiende till historien själv."}, "date": "5 september, 01:10", "url": "https://www.dagensarena.se/opinion/medborgardemokratin-maste-vara-upplyst", "imageUrl": "https://www.dagensarena.se/files/2026/09/sverker-och-mans.jpeg"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Strid om nya byggkraven: \"Riskerar konkurser\"", "summaries": {"normal": "Boverket föreslår att utsläppen från nya byggnader ska minska med omkring 35 procent till 2030. Förslaget möter hård kritik från två håll. Stora börsbolag och industrin vill ha tuffare krav för att driva på klimatomställningen, medan mindre företag varnar för skenande administrativa kostnader och risker för konkurser.", "trump": "De radikala miljömupparna i Sverige förstör ekonomin med sina galna påhitt! Boverket tvingar på stackars företag absurt skadliga regler. Stora företag gnäller, småföretagarna krossas av dyra byråkratiska räkningar och riskerar konkurser. Jag säger: låt marknaden bygga fritt, sluta med det här tramsiga klimatreglerandet och sätt 'America First' – eller i det här fallet, låt svenskarna bygga utan skadligt tjafs!", "stalin": "Vi noterar att de svenska fastighetsbolagen och byråkraterna grälar om procentsatser för utsläpp likt småborgerliga förrädare. Staten fastställer nu en balanserad norm på trettiofem procent. Om de svaga elementen i byggsektorn gråter över kostnader och hotar med ruin, påminner vi om att partiets linje är oåterkallelig. Endast genom järnhård disciplin och ökad kollektiv produktion bygger vi framtiden."}, "date": "4 september, 14:47", "url": "https://www.affarsvarlden.se/artikel/strid-om-nya-byggkraven-riskerar-konkurser"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-right", "heading": "Regeringen: Falska familjehem ska identifieras", "summaries": {"normal": "Regeringen ger Ivo och flera myndigheter i uppdrag att identifiera falska familjehem som i själva verket är otillåtna HVB-hem. Syftet är att skydda barnens trygghet och stoppa oseriösa aktörer som kringgår lagen. Polisen, Ekobrottsmyndigheten, Skatteverket och Försäkringskassan ska samverka och utbyta information. Uppdraget ska slutredovisas senast april 2028.", "trump": "De här galna svenska byråkraterna låter skojare tjäna miljoner på stackars barn genom att kalla sina lyxiga arbetsläger för familjehem. Det är en total skandal, folk! Vi hatar de här woke-vänliga systemmissbrukarna som gömmer sig bakom barnens ryggar. Jag fixade mycket bättre saker under min första period än vad Sleepy Joe gjorde, och nu ska vi rensa upp även i Sverige.", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare förvandlar barns öden till en penningmaskin genom att driva hemliga arbetsläger under falsk familjehemsmantel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana dekadenta parasiter. Deras girighet hotar hela folkets moraliska grund. Kamrater, låt oss krossa dem utan pardon."}, "date": "3 september, 12:20", "url": "https://www.etc.se/inrikes/regeringen-falska-familjehem-ska-identifieras", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026090308090_28af7386a4ef63fb3b7f615263dcd41055c83edcb174bdf05b53e7ea2f1a1f8f.jpg"}, {"type": "image-right", "heading": "Dadgostar lovar pressa S till vänstersväng", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar lovar att pressa en eventuell S-regering åt vänster och hålla Magdalena Andersson borta från samarbete med Centerpartiet eller Kristdemokraterna. V har medvind i opinionen och kräver bland annat kortare arbetstid med bibehållen lön, höjt studiebidrag, avgiftsfri tandvård och frysta hyror. Magdalena Andersson ser hinder för ett regeringssamarbete med V.", "trump": "Titta på den här röda galningen Dadgostar som lovar den största vänstersvängen sedan Mao. Hon vill dra den stackars Andersson bort från vettiga centerkillar och in i kommunisthelvetet. Patetiskt! Jag byggde den bästa ekonomin i världshistorien, de här parasiterande vänsterblodiglarna vill bara förstöra allt med sin galna kvotpolitik och latmanslön. Sad!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom socialdemokratin redan nu förhandlar om att sälja ut arbetarklassen till giriga hyenor. Jag ler från historien när Dadgostar lovar att dra politiken vänsterut. En utredning om arbetstid? Patetiskt halvmesyr. Riktiga revolutionärer skulle redan ha likviderat sådana kompromisser och rensat ut alla opportunistiska element som drömmer om samarbete med borgarbrackor. Skrattretande svaghet."}, "date": "5 september, 18:53", "url": "https://www.di.se/nyheter/v-lovar-pressa-s-till-vanstersvang", "imageUrl": "https://static.bonniernews.se/ba/37480be3-b79b-4418-9561-acb5ec45a677.jpeg?crop=6000%2C3375%2Cx0%2Cy129&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Teneo AI: Hemliga investerare tar nära hälften", "summaries": {"normal": "Teneo AI har genomfört en företrädesemission som tillför bolaget 74 miljoner kronor, där 51,5 procent tecknades av allmänheten och resten av garanter. Hemliga investerare tar över en stor del via Pareto Securities. Emissionsguiden hissar två retroaktiva flaggor, vilket innebär totalt sex flaggor under processen, och avslutar sin bevakning av det pressade teknologibolaget.", "trump": "Teneo AI är i totalt kaos! De tigger pengar och hemliga investerare måste rädda skiten med 74 miljoner. Helt otroligt svagt. Emissionsguiden delar ut sex gula flaggor – fler flaggor än en misslyckad Biden-parad! Aktien är värdelös, rasar 71 procent och handlas för ynka fem öre. Sorgligt! De skulle ha ringt mig, jag hade fixat det på fem minuter. En absolut katastrof!", "stalin": "Kamrater, Teneo AI har lidit ett ynkligt kapitalnederlag! Endast 51,5 procent visade den revolutionära pliktkänslan att teckna aktier frivilligt. Resten av detta svaga bolag måste räddas av hemliga garanter och Pareto Securities, likt desertörer som tvingas fram i ledet. Sex förrädiska flaggor har hissats av Emissionsguiden. Den som misslyckas med att leverera kassaflöde före våren 2027 kommer att skickas till korrekta arbetsuppgifter i Sibirien."}, "date": "4 september, 09:37", "url": "https://www.affarsvarlden.se/artikel/teneo-ai-hemliga-investerare-tar-nara-halften"}, {"type": "image-right", "heading": "EU-land tar bort rösträtt för invandrare med permanent uppehållstillstånd", "summaries": {"normal": "Slovenien har infört en ny lag som tar bort rösträtten i kommunala val för personer från länder utanför EU, även om de har permanent uppehållstillstånd. Beslutet, som drevs igenom av högerpartier, har kritiserats skarpt och kan komma att prövas av författningsdomstolen efter invändningar från parlamentets juridiska avdelning och Europarådet.", "trump": "Slovenien gör helt rätt! De tar tillbaka kontrollen och sätter sina egna medborgare först, precis som jag gör i USA. Om man inte är medborgare ska man inte rösta, så enkelt är det. Radikala vänstern skriker naturligtvis, men slovenska folket vill ha ordning och reda. Fantastiskt drag!", "stalin": "Dessa så kallade permanenta invånare har tillåtits att utnyttja systemet i tjugofyra år utan att visa prov på sann lojalitet mot staten. Den slovenska regeringen har nu vidtagit nödvändiga, om än sena, åtgärder för att rensa bort borgerliga privilegier. Rösträtt är ingen medfödd rättighet, det är ett förtroende som staten fördelar – eller drar in."}, "date": "5 september, 14:00", "url": "https://samnytt.se/eu-land-tar-bort-rostratten-for-permanenta-tredjelandsmedborgare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04072252/slovenien-valurna.jpg"}, {"type": "image-right", "heading": "På väg mot Kiev  med Putins allt  hårdare krav", "summaries": {"normal": "Trumps sändebud Steve Witkoff och Jared Kushner har träffat Vladimir Putin i Moskva för att diskutera en lösning på Ukraina-kriget. Mötet beskrivs som konstruktivt, men Putins krav har hårdnat och han upprepar kravet på att Ukraina ger upp sitt självbestämmande. Sändebuden reser nu vidare till Kiev medan Ryssland tillfälligt pausar sina luftangrepp mot staden.", "trump": "Mina fantastiska sändebud Steve och Jared åkte till Moskva och gjorde ett enormt, perfekt möte med Putin – så mycket bättre än vad Biden någonsin klarat av! Fake news-medierna hatar att se det, men vi skapar stora affärer och fred. Nu drar killarna vidare till Kiev för att fixa resten, medan Putin pausar attackerna. Snyggt jobbat, vi vinner igen!", "stalin": "Kamrat Putin för förhandlingar med de amerikanska emissarierna Witkoff och Kushner i Kreml, och visar sedvanlig fasthet mot västs ombud. Medan staten dikterar villkoren för befrielsen och rensar ut grundorsakerna till konflikten, tvingas det dekadenta Kiev snart ta emot delegaterna under en nådigt beviljad vapenvila. Segern blir vår!"}, "date": "6 september, 05:23", "url": "https://www.expressen.se/nyheter/varlden/witkoff-och-kushner-pa-vag-mot-kiev-med-putins-allt-hardare-krav", "imageUrl": "https://static.bonniernews.se/ba/28eccb70-26fb-497f-b8d7-72ad3a16cb51.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Lööf ger sig in i valspurten: ”Extra energi”", "summaries": {"normal": "Tidigare Centerledaren Annie Lööf gör comeback i valspurten inför 2026 för att stödja tanken på en bred mitten med S, C, KD och eventuellt MP. Hon kampanjar med nuvarande C-ledaren Elisabeth Thand Ringqvist. S-ledaren Magdalena Andersson har inte uteslutit att Vänsterpartiet kan ingå i en regering, något som Centerpartiet helt avvisar.", "trump": "Titta på de här svenska förlorarna som springer runt som galningar och försöker lappa ihop en patetisk mittenkoalition. Lööf dyker upp som en gammal relik och babblar om samarbete medan den röda Andersson håller dörren öppen för kommunisterna. Patetiskt. Sverige behöver styrka, inte dessa svaga mittenfjollor som böjer sig för vänstervridna identitetspolitiker.", "stalin": "Se hur dessa dekadenta mittenhyenor försöker lura arbetarna med sina falska samarbetsillusioner. Jag ler mörkt från historien när Andersson vägrar stänga dörren för de revisionistiska elementen. En sådan svaghet förtjänar utrensning. Kamrater, låt inte de parasiterande mittenlakejerna splittra folkets enhet – deras feghet är ett hot mot alla revolutionära framsteg."}, "date": "5 september, 17:53", "url": "https://www.di.se/nyheter/loof-ger-sig-in-i-valspurten-extra-energi", "imageUrl": "https://static.bonniernews.se/ba/5a2d24b4-10c6-4307-9329-f82c9d5c9f01.jpg?crop=6272%2C3136%2Cx0%2Cy259&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "text", "heading": "Partierna kallas till möte Partierna kallas till möte", "summaries": {"normal": "Valmyndigheten har kallat riksdagens partisekreterare till ett möte efter att ett tekniskt fel i it-systemet lett till att cirka 4 000 förtidsröster registrerats fel. Väljare har antingen prickats av två gånger eller fått sina röster avprickade på andra. Felet har stoppats, men situationen väcker oro och krav på transparens från partierna.", "trump": "Sveriges valsystem är i totalt kaos! Otroliga fyra tusen röster har försvunnit eller dubbelprickats av deras dysfunktionella it-system. En katastrofal incident! Partisekreterarna är rasande, och med all rätt – det här är falskt och riggat, precis som radion säger. Jag har sagt det för aningslösa byråkrater: skaffa riktiga papper och blyertspennor, annars blir det inga bra val!", "stalin": "Ett förrädiskt haveri i det så kallade it-systemet har avslöjat att 4 000 röster har hanterats i oordning. Statens kontrollorgan har omedelbart inkallat partisekreterarna till ordergivning för att återställa disciplinen. Den som underminerar folkets förtroende för statsapparaten genom tekniskt slarv kommer att granskas med största noggrannhet. Ordning skall råda i leden!"}, "date": "5 september, 23:00", "url": "https://www.aftonbladet.se/nyheter/a/m0xp34/partierna-kallas-till-mote-efter-rostkaoset"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Lööf ger sig in i valspurten: ”Extra energi”", "summaries": {"normal": "Tidigare C-ledaren Annie Lööf gör comeback i valspurten för att kampanja med Elisabeth Thand Ringqvist för ”den breda mitten”. Samtidigt vägrar Centerpartiet att regera med Vänsterpartiet, vars dörr Magdalena Andersson hålls öppen. Lööf försvarar detta som ett ansvarsfullt drag i en osäker omvärld, medan C inte ger rakt svar om eventuellt budgetsamarbete med V.", "trump": "Tittar på detta skämt till val i Sverige nu! Annie Lööf, som ingen minns, gör nån sorts patetisk comeback på en löptävling vid namn Tjejmilen. Totalt desperat! De försöker desperat rädda en ”bred mitten”-dröm medan radikala vänsterfolk springer lösa. Magdalena Andersson vill ha med alla kommunister i regeringen. Helt sjukt! Jag säger bara: skaffa en ordentlig mur runt Gärdet i stället!", "stalin": "Kamrater! Den så kallade ”breda mitten” i det svenska feodala träsket darrar i sina grundvalar när den förra härskarinnan Annie Lööf kastar sig ut i spenaten vid Tjejmilen för att rädda sitt fallande korthus. Våra socialistiska fränder i Vänsterpartiet hotar att spränga den borgerliga harmonin. Vi kräver fullständig ideologisk disciplin och omedelbar utrensning av vacklande element som vägrar klargöra sin ståndpunkt!"}, "date": "5 september, 17:52", "url": "https://www.gp.se/nyheter/sverige/loof-ger-sig-in-i-valspurten-extra-energi.d1bfc4d5-41c0-5822-8c70-c078562848fc", "imageUrl": "https://www.gp.se/images/article/d1bfc4d5-41c0-5822-8c70-c078562848fc/images/23LuffGVYJaayeCk8KuT5vyO2nD4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Livrädda – för  Trumps taktik. ”Har inget val”", "summaries": {"normal": "Inför höstens mellanårsval kliver president Donald Trump in i kampanjen genom att göra valet till en folkomröstning om sig själv. Republikaner är oroliga eftersom Trump är historiskt impopulär och riskerar att skada partiet med sitt fokus på den egna personen, trots att han nu öppnat sin krigskassa och syns i nya reklamfilmer.", "trump": "Falska nyheter! Alla vill att jag leder dem till dundersuccé i mellanårsvalet. Mina reklamfilmer, som fantastiska Toughest guy, krossar motståndet totalt. Radikala Demokraterna gråter medan jag fixar skatterna och räddar landet. Republikanerna älskar min energi, vi vinner så mycket att de tröttnar på att vinna. USA först, alltid!", "stalin": "Kamrater, den så kallade presidenten iscensätter nu en personkult som vida överträffar alla sunda proportioner. Medan partiet bävar för väljarnas vrede och inflationens ok, klamrar han sig fast vid rampljuset likt en parasit. Vi konstaterar torrt att den borgerliga demokratiens cirkus återigen förbereder sitt eget sammanbrott under ledning av dess mest egocentriska narr."}, "date": "6 september, 04:56", "url": "https://www.expressen.se/nyheter/varlden/hopplosa-kanslan-hos-republikanerna-infor-mellanarsvalet", "imageUrl": "https://static.bonniernews.se/ba/70837818-f9df-4333-8017-c752f8ec96bb.jpeg?crop=2549%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "USA-topparna i Moskva – Putin pausar attacker", "summaries": {"normal": "USA:s sändebud Steve Witkoff och Jared Kushner har anlänt till Moskva för samtal med president Vladimir Putin om att avsluta kriget i Ukraina. I samband med besöket har Putin beordrat en tre dagar lång paus för attacker mot Kiev. På söndagen reser förhandlarna vidare till Ukraina för möte med president Volodymyr Zelenskyj.", "trump": "Jag skickade just mina stjärnförhandlare Steve Witkoff och Jared Kushner till Moskva eftersom jag fixar avtal som ingen annan ens kan stava till. Putin pausar till och med anfallen mot Kiev nu när mina grabbar är på plats. Biden hade bara skapat kaos, men vi gör stora framsteg för att äntligen stoppa det här vansinnet!", "stalin": "De amerikanska agenterna har landat i Moskva för att beskåda den permanenta disciplinen hos vår mäktiga sovjetiska arvtagare. Kiev beviljas tillfällig nåd från himlens stålregn medan förhandlingar pågår. Om de västerländska emissarierna tror på svaghet misstar de sig; proletariatets fiender krossas obönhörligt, och varje avvikelse från den korrekta ideologiska linjen kommer att beivras omedelbart."}, "date": "5 september, 17:15", "url": "https://www.gp.se/nyheter/varlden/usas-forhandlare-pa-plats-i-moskva-putin-pausar-attacker.743cb423-bea2-4a6a-9d1c-148b23637715", "imageUrl": "https://www.gp.se/images/article/743cb423-bea2-4a6a-9d1c-148b23637715/images/1eapFO6b3wR3lX7CAX69ST3kVFcE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kysser Maggan: \"Mamma wallah\"", "summaries": {"normal": "En man håller om och kysser Socialdemokraternas ledare Magdalena Andersson på kinden i ett klipp som sprids på nätet. Han hyllar henne på svenska, engelska och arabiska samt uppmanar tittarna att rösta på partiet. Videon har väckt starka reaktioner på sociala medier, där flera kritiserar handlingen som bristande samtycke. Klippet har raderats från TikTok men lever vidare i kopior.", "trump": "Titta på den här galna filmen! Den där Mandarina Andersson låter sig bli kysst och kramad av en vild arabisk kille som ropar mamma wallah och ber folk rösta på hennes socialistiska katastrof. Hon står där och flinar som en idiot. Det här är vad som händer när ni låter identitetspolitik och kvotering styra landet. Patetiskt. Vi behöver inga sådana number one-förlorare i ledningen, folks.", "stalin": "Kamrater, se hur denna dekadenta klassförrädare ler stort medan en främmande element kysser henne inför folket. Hennes parti har förvandlats till en samling folkförtryckande hyenor som dansar efter utländska röster. Jag säger: sådana förrädare mot arbetarklassen förtjänar utrensning. Deras leende maskerar svaghet och förräderi. Vi ska aldrig glömma vem som verkligen står för folkets vilja."}, "date": "4 september, 15:44", "url": "https://www.friatider.se/kysser-maggan-mamma-wallah", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-830.jpg"}, {"type": "image-full", "heading": "V lovar pressa S till vänstersväng", "summaries": {"normal": "Vänsterpartiet och ledaren Nooshi Dadgostar siktar på en kraftig vänstersväng för en eventuell S-ledd regering efter valet. Med starkt opinionsläge kräver V ministerposter och radikala reformer som kortad arbetstid och gratis tandvård. Socialdemokraternas partiledare Magdalena Andersson är dock skeptisk till samarbetet och anser att V har en lång resa kvar att göra.", "trump": "Vänsterpartiets radikala ledare i Sverige tror att hon kan tvinga socialdemokraterna åt vänster med sina galna socialistiska idéer om gratis tandvård och korta arbetsveckor! Hon vill hålla sin premiärminister borta från dåligt sällskap, men sanningen är att det här totalt kommer att krossa ekonomin. De har stora problem och falska nyheter överallt, det är ett totalt misslyckande!", "stalin": "Kamrat Dadgostar visar äntligen prov på nödvändig disciplin genom att diktera villkoren för de vacklande socialdemokraterna och rensa bort borgerligt avfall. Men den så kallade ledaren Andersson tvekar och talar om en lång resa – ett farligt ideologiskt avsteg som omedelbart bör utredas av säkerhetstjänsten. Partiet måste hållas enhetligt, och de som vacklar kommer att finna att vägen till gulagen är korthuggen."}, "date": "5 september, 17:07", "url": "https://www.gp.se/nyheter/sverige/v-lovar-pressa-s-till-vanstersvang.104dc6fe-0982-517c-8a8b-021f88639459", "imageUrl": "https://www.gp.se/images/article/104dc6fe-0982-517c-8a8b-021f88639459/images/1eUnhBng23Z2FoLDUUSolXTP66lY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkesson: Kan inte jobba för SD med proryska åsikter", "summaries": {"normal": "SD-ledaren Jimmie Åkesson ser inga akuta säkerhetsproblem efter avslöjandet om en partiansatt tjänstemans proryska kopplingar. Han betonar att proryska åsikter inte är förenliga med arbete i partiet och att information nu samlas in. Oppositionen kräver utredning och Säpo-granskning medan Åkesson har förtroende för gjorda säkerhetsprövningar. Magdalena Andersson kallar det en säkerhetskris.", "trump": "Folk, det här är en total skandal! Den svenska regeringen låter proryska element krypa in i systemet som termiter i en gammal lada. Åkesson verkar äntligen vakna, bra för honom. Men den röda Andersson och hennes dekadenta vänstervargar vänder allt till politik. Patetiskt! Sverige behöver tuffa ledare, inte dessa svaga globalister som sätter partier före folket. En riktig röra.", "stalin": "Kamrater, se hur dessa giriga klassförrädare inom den svenska borgerligheten låtsas skydda nationen medan de i hemlighet gömmer proryska element i sina egna kansli. Jag skrattar mörkt åt deras feodala teater. En sann utrensning vore på sin plats, inte detta ynkliga prat om möten och utredningar. Den som sviker folkets intressen förtjänar att exponeras som den parasit han är."}, "date": "5 september, 15:55", "url": "https://www.di.se/nyheter/akesson-kan-inte-jobba-for-sd-med-proryska-asikter", "imageUrl": "https://static.bonniernews.se/ba/73744c97-d089-4eb5-bb5d-baec11789a95.jpg?crop=1930%2C1086%2Cx0%2Cy138&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Liberalerna anar väljarlyft – men liknar partier som åkt ur", "summaries": {"normal": "Liberalerna har visat en viss uppgång i senaste opinionsmätningarna och hoppas på stödröster för att klara riksdagsspärren. Statsvetaren Niklas Bolin är skeptisk och pekar på historiska likheter med Miljöpartiet 1991 och Ny Demokrati 1994, som båda åkte ur riksdagen trots sena lyft. Han tror på fortsatt uppförsbacke för partiet.", "trump": "Folk, ni ser det här? Liberalerna, de totala förlorarna, försöker desperat klättra över den där patetiska spärren med några sista-minuten-siffror. Precis som de andra patetiska misslyckandena Miljöpartiet och Ny Demokrati innan de kraschade ur riksdagen. Det är en uppförsbacke, tro mig, en jättestor uppförsbacke. Sad!", "stalin": "Jag ser dessa ynkliga liberala element som desperat klamrar sig fast vid opinionsmätningar likt förrädare inför utrensning. Deras sena, patetiska uppgångar är bara en illusion skapad av fiender till folkets vilja. Precis som de borgerliga avfällingarna tidigare kommer de att krossas under historiens järnhand. Inga stödröster räddar kontrarevolutionärer. Intressant."}, "date": "5 september, 09:22", "url": "https://www.tv4.se/artikel/60uFpC6GumneHaZE8QnGtf/liberalerna-anar-vaeljarlyft-men-liknar-partier-som-akt-ur", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl7rFvt-oIvtg%2F0278ea040d400925992d77d034a31012%2FLiberalernas_partiledare_Simona_Mohamsson__L_._Arkivbild._&width=1024"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trump lyfter sanktioner mot al-Qaida-toppar – dagar före 11 september-jubileet", "summaries": {"normal": "Trumpadministrationen har hävt sanktioner mot flera al-Qaida-profiler, bland dem den saudiske predikanten Abdullah al-Muhaysini som rekryterat självmordsbombare och barnsoldater samt deltagit i en massaker på 56 syriska krigsfångar. Beslutet togs strax före 11 september-jubileet och ingår i en bredare lättnad av sanktioner mot Syrien.", "trump": "Vi rensar upp i det fullständiga vansinnet som Sleepy Joe lämnade efter sig. Dessa terrorhyenor får en chans att andas fritt under min ledning medan vi bygger ett starkt Syrien. Inga fler galna globalistregler som skyddar jihadister – nu kör vi på ren amerikansk klokskap. Fantastiskt, eller hur?", "stalin": "Jag betraktar med djup misstro hur de giriga imperialisthyenorna i Washington stryker al-Qaida-figurer från sina listor. Deras dekadenta spel med terrorister väcker misstankar om förräderi mot alla folk. Vi ser en utrensning av alla spår som kunde avslöja den sanna klassfiendens ansikte. Paranoia? Nej, verklighet."}, "date": "4 september, 14:59", "url": "https://www.friatider.se/trump-lyfter-sanktioner-mot-al-qaida-toppar-dagar-fore-11-september-jubileet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-829.jpg?itok=msfXqD96"}, {"type": "image-full", "heading": "Oron gnager efter röstningskaoset: ”Är jättesnurrigt”", "summaries": {"normal": "Ett it-fel hos Valmyndigheten har lett till att omkring 4 000 förtidsröster registrerats felaktigt genom dubbelavprickning eller felkoppling. Felet upptäcktes och stoppades under natten mot fredagen. Valmyndigheten arbetar nu med att analysera konsekvenserna och försöka identifiera de drabbade väljarna, samtidigt som man avråder från att rösta om på valdagen.", "trump": "Ett totalt haveri! De svenska myndigheterna har tappat bort eller felaktigt registrerat tusentals röster i sitt värdelösa it-system. 4 000 röster är borta eller hopblandade! Det är fejkade, korrupta metoder, helt otroligt dåligt skött. Medan 1,4 miljoner har röstat drunknar de inkompetenta byråkraterna i kaos. Min röst? Perfekt, felfri, en enorm vinst!", "stalin": "Ett otillåtet tekniskt haveri i statens digitala apparat har komprometterat fyra tusen individers röstregistreringar. Detta är ett misstag av yttersta allvar som kräver omedelbar utredning av lojaliteten hos den ansvariga it-leverantören. Staten glömmer aldrig, och den som underminerar folkets heliga valhandling genom slarv kommer att finna att avvikelser inte tolereras i vår gemensamma kamp."}, "date": "5 september, 21:30", "url": "https://www.aftonbladet.se/nyheter/a/q6x70g/valet-2026-kaos-med-fortidsroster-valjarna-oroliga", "imageUrl": "https://akamai.vgc.no/v2/images/4ddb63f2-0df0-3c6a-8f2b-e13135f4711c?fit=crop&format=auto&w=1440&s=980c6a06eea42630b022ba13009c9e86222aff34"}, {"type": "image-right", "heading": "Starkt och välspelat drama i efterkrigstidens Ungern", "summaries": {"normal": "Jon Andersson ger högt betyg till László Nemes film Orphan, ett far-och-son-drama som utspelar sig i Budapest efter den nedslagna ungerska revolutionen 1956. Filmen följer en förintelseöverlevande mor, hennes son som längtar efter sin försvunna far och en mystisk slaktare som gör anspråk på faderskapet. Autentiska miljöer och starkt skådespeleri präglar det gripande dramat.", "trump": "Folk, ni måste se den här ungerska saken Orphan. László Nemes, den killen vet hur man gör riktig film, inte som de woke Hollywood-hajar som bara pushar sin galna identitetspolitik. En son som hatar den falska pappan – klassiskt! Mycket bättre än Bidens Hollywood-elit som förstörde biograferna. Starkt, äkta och ingen HBTQ-propaganda. Fantastiskt!", "stalin": "Kamrater, denna så kallade Orphan visar hur de giriga klassförrädarna fortsätter att plåga arbetarklassen även efter kriget. En pojke som vägrar acceptera den falska fadern – mycket lärorikt. Vi ser hur folkets fiender gömmer sig i skuggorna. En utmärkt film som påminner oss om att utrensning av sådana element alltid är nödvändig. Revolutionen glömmer aldrig."}, "date": "4 september, 11:35", "url": "https://www.dagensarena.se/innehall/starkt-och-valspelat-drama-i-efterkrigstidens-ungern", "imageUrl": "https://www.dagensarena.se/files/2026/09/orphan-2-300x157.jpeg"}, {"type": "text", "heading": "Europeiska länder flyttar guld från USA", "summaries": {"normal": "Flera europeiska länder, däribland Frankrike och Nederländerna, flyttar guldreserver från USA och Kanada till Europa för att förbättra tillgängligheten vid krissituationer. Åtgärden motiveras av ökad geopolitisk oro och ett behov av stärkt krisberedskap. Även i Tyskland och Italien förs liknande diskussioner, men inga beslut har fattats där än.", "trump": "Europa flyttar sitt guld från oss. SMART? Inte särskilt! De tror att de kan gömma sitt guld i London och Paris medan jag gör USA större än någonsin. De vill ha krisberedskap? De borde anställa mig för att förhandla åt dem! Totalt slöseri med tid, men oroa er inte, USA:s guld är det största och vackraste i världen. Fake news att vi skulle bry oss!", "stalin": "Dessa löjliga europeiska kapitalister flyttar sitt guld i panik, som råttor som lämnar ett sjunkande skepp. De talar om krisberedskap, men i stället för att inse proletariatets överlägsenhet gömmer de sina metallbitar i London och Paris. Guldet tillhör folket, inte korrupta bankirer. Vi antecknar namnen på alla som rör detta guld för framtida åtgärder."}, "date": "5 september, 22:04", "url": "https://kvartal.se/nyheter/artiklar/europeiska-lander-flyttar-guld-fran-usa/cG9zdDoxODQ2Mjc"}, {"type": "image-full", "heading": "Jagar Daniel V – i hela Europa. ”Mycket ovanligt”", "summaries": {"normal": "Tyskland drabbas av en rad sabotageattacker mot elnätet. Den 48-årige mannen Daniel V efterlysas i hela Europa som misstänkt elterrorist. Ett hittat manifest avslöjar att motivet är kamp mot fossila bränslen, särskilt brunkol. Polisen har misslyckats med att gripa honom efter husrannsakan, och ytterligare sprängladdningar har påträffats nära transformatorstationer.", "trump": "Tyskland har ett totalt misslyckande med sin gröna elpolitik! Radikala klimatextremister förstör landet medan polisen missar att gripa den misstänkta elterroristen Daniel V, som lämnat sitt fullständiga namn och adress efter sig. Så korkat har jag aldrig skådat! De satsar på vindsnurror och misslyckade energiexperiment istället för vacker, ren amerikansk olja. Sorgligt!", "stalin": "Dessa ynkliga tyska sabotage visar systemets totala förfall. En ensam dissident vid namn Daniel V springer omkring i skogarna och leker elterrorist med egna manifest, medan statens organ fumlar blint. Vi skulle ha skickat in specialtrupper och rensat upp i det borgerliga kaoset på ett enda dygn. Ett land som inte ens kan skydda sina transformatorstationer förtjänar undergång."}, "date": "5 september, 21:24", "url": "https://www.aftonbladet.se/nyheter/a/m0xpQq/daniel-v-48-jagas-i-hela-europa", "imageUrl": "https://akamai.vgc.no/v2/images/cd2a119f-0ffb-3f89-a85f-7166c555cb7f?fit=crop&format=auto&w=1440&s=66c7f63b506a576581a8280115a1cea87a1d59a6"}, {"type": "image-right", "heading": "Fusk för miljoner med utländska elfirmor", "summaries": {"normal": "Elektrikerförbundet har granskat utländska bemanningsföretag och avslöjat fusk med löner, skatter och sociala avgifter i mångmiljonklassen. Hittills har granskningen resulterat i över fem miljoner kronor i skadestånd. Facket pekar på att svenska företag anlitar dem för att sänka kostnader, trots att kollektivavtal inte följs. Problemet hotar både välfärd och seriösa aktörer.", "trump": "De här korkade svenska företagen importerar billig utländsk arbetskraft som fuskar med löner och skatter – totalt kaos! De lurar systemet, sparkar ut sina egna folk och håller nere priserna. Precis som de woke-eliterna och deras identitetspolitik, fullständigt riggat mot de riktiga arbetarna. Patetiskt! Vi skulle städa upp det på en vecka, tro mig.", "stalin": "Jag betraktar med djup förakt hur dessa profitthungriga klassförrädare undergräver arbetarklassen genom att importera exploaterande utländsk arbetskraft som undanhåller miljoner i sociala avgifter. Deras förfalskade papper och dekadenta girighet hotar hela folkets välfärd. Vi måste rensa ut dessa parasiter innan de likviderar systemet helt. Kamrater, vaksamhet!"}, "date": "4 september, 13:00", "url": "https://arbetet.se/2026/09/04/fusk-for-miljoner-med-utlandska-elfirmor-billiga-och-foljer-inte-kollektivavtalen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28094904/granskning-ny.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kriminalvårdare spottade på intagen", "summaries": {"normal": "En kriminalvårdare på häktet Sollentuna har dömts till löneavdrag i tio dagar efter flera allvarliga incidenter under våren. Hon visade långfingret åt en intagen, skrek på en annan och spottade honom i ansiktet. Kriminalvården bedömde hennes agerande som en allvarlig säkerhetsrisk som skadade verksamhetens förtroende.", "trump": "Helt otroligt! En kvinna på Sollentuna-häktet tappar fullständigt fattningen, skriker, räcker finger och spottar på fångarna – total katastrof för disciplinen! Kollegorna fick dra bort henne med våld. Så ser det ut när man saknar total självbehärskning. Själv skulle jag hantera det mycket bättre, tro mig. Löneavdrag i tio dagar? Löjligt svagt!", "stalin": "Ett katastrofalt misslyckande av disciplinen vid Sollentuna-anstalten. Denna kvinna saknar den järnhårda självbehärskning som krävs i stat tjänst. Att spotta och skrika på fångar visar på farlig svaghet. En klen bestraffning med tio dagars löneavdrag – i en sund stat hade sådant sabotage mot ordningen rensats bort omedelbart. Säkerheten kräver total lydnad!"}, "date": "5 september, 09:01", "url": "https://bulletin.nu/kriminalvardare-spottade-pa-intagen", "imageUrl": "https://cdn.bulletin.nu/articles/682b21e4-8edd-43e2-9368-c7c89679ce8b/preview.jpg?t=1788336196000"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "image-full", "heading": "Åkesson: Kan inte jobba för SD med proryska åsikter", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson menar att personer med proryska åsikter inte kan arbeta inom partiet, med anledning av uppgifter om att en SD-tjänsteman spridit rysk propaganda. S-ledaren Magdalena Andersson anklagar statsminister Ulf Kristersson för att ignorera en allvarlig säkerhetskris och kräver svar, medan S vill att Säpo utreder saken.", "trump": "Falska nyheter och total häxakt mot fantastiska Sverigedemokraterna! De radikala socialdemokraterna skriker panik över ingenting. Jag menar, titta på radikala Magdalena Andersson, hon gråter och gnäller som en förlorare. Om någon sprider fake news eller älskar främmande makter ska de förstås sparkas omedelbart, väldigt snabbt, men det här är bara ett svagt försök att stoppa dem!", "stalin": "Kamrater! En ideologisk skadlig element har upptäckts i statsapparaternas maskineri. Partiledare Åkesson famlar i blindo efter korrekta politiska direktiv, medan de patetiska socialdemokratiska agenterna skriker om säkerhetskriser. Vi kräver omedelbar intern rengöring och fullständig ideologisk disciplin i konstitutionsutskottet så att inga subversiva element underminerar statens högsta intressen!"}, "date": "5 september, 15:45", "url": "https://www.gp.se/nyheter/sverige/akesson-kan-inte-jobba-for-sd-med-proryska-asikter.1dc154a7-7c9b-550e-b30c-5ba06be6701c", "imageUrl": "https://www.gp.se/images/article/1dc154a7-7c9b-550e-b30c-5ba06be6701c/images/2vYjn2lMcaAs4Lm8bYDd6U6I7ycU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S-ledaren: Kristersson sätter SD framför Sverige", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson kritiserar statsminister Ulf Kristersson för att inte ta uppgifterna om en SD-tjänstemans kopplingar till ryska intressen på allvar. Hon kallar händelsen en allvarlig säkerhetskris och kräver svar på vilka åtgärder som vidtas för att skydda svenska intressen. Peter Hultqvist (S) kräver extra utskottsmöte, Säpo-utredning och avstängning av berörda personer.", "trump": "Titta på den här svaga clownen Kristersson som låter SD springa runt som en flock galna ryssar i hans egen regering. Patetiskt! Magdalena Andersson skriker om säkerhetskris men hon är bara en förlorare från den gamla Biden-kopian. Rena skämtet. Rensa ut hela den dekadenta identitetspolitiska röran innan Sverige blir en rysk provins, folk!", "stalin": "Jag betraktar med förakt hur dessa giriga klassförrädare inom den svenska borgerligheten famlar inför avslöjanden om främmande inflytande. Kristersson vägrar möta partikamraterna i utskottet – typiskt för en sådan feg parasit. Vi skulle ha genomfört en grundlig utrensning redan vid första misstanken. Låt rädslan gripa de som sviker folkets intressen."}, "date": "5 september, 14:27", "url": "https://www.di.se/nyheter/s-ledaren-kristersson-satter-sd-framfor-sverige", "imageUrl": "https://static.bonniernews.se/ba/aaec0f16-67cd-4243-9035-2d11e65b4311.jpg?crop=5578%2C2789%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Månsson spurtade hem Tjejmilen – nu ska hon cykla i två timmar", "summaries": {"normal": "Tilda Månsson vann Tjejmilen på hemmaplan efter en stark spurt på upploppet där hon besegrade Carolina Wikström. Hon sprang milen på 33 minuter och 43 sekunder. Triatleten, som ligger trea i världscupen, fortsatte dagen med ytterligare träning inför kommande VM-final. Hon beskrev vinsten som mycket rolig.", "trump": "Titta, den här Tilda tjejen är en vinnare, en riktig vinnare, folk. Hon spurtade förbi den andra löparen som en raket på hemmaplan. Fantastiskt! Under Biden hade vi bara förlorare och kvoteringar, men nu är jag tillbaka och de riktiga stjärnorna skiner. Ingen woke-flum här, bara ren kraft. Stort grattis, Tilda!", "stalin": "Kamrater, denna Tilda Månsson visar arbetets och disciplinens styrka genom att krossa motståndaren i spurten. Vi ser hur den sanna viljan övervinner dekadenta klassförrädare som gömmer sig bakom löjliga identitetsillusioner. Jag ler från historien åt sådana segrar medan folkförtryckarna darrar. Fortsätt träna, segern tillhör de starka."}, "date": "5 september, 13:17", "url": "https://www.svt.se/sport/triathlon/tilda-mansson-vinner-tjejmilen-efter-spurtuppgorelse"}, {"type": "image-right", "heading": "Så kommer C sänka lönekravet för arbetskraftsinvandrare", "summaries": {"normal": "Centerpartiet lovar att sänka lönekravet för arbetskraftsinvandrare vid en valvinst och ersätta det med kollektivavtalsnivåer. Partiet vill även skydda redan beviljade permanenta uppehållstillstånd och hotar att inte stödja någon regering som återkallar dem. Elisabeth Thand Ringqvist säger att det blir ett av de första besluten i en mittenregering.", "trump": "De här svenska clownerna i Centerpartiet vill släppa in alla möjliga low-skill-invandrare för en spottlön. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att skydda våra gränser, inte genom att böja mig för globalisternas billiga arbetskraft. Vakna upp, Sverige, innan era woke-kapitalistlakejer förstör allt.", "stalin": "Se hur de giriga hyenorna i Centerpartiet vill undergräva arbetarklassens skydd genom att sänka lönekraven för invandrare. Jag betraktar detta som ett förräderi mot folket. I en sann stat skulle sådana dekadenta förslag mötas med omedelbar utrensning av alla klassförrädare som vågar föreslå det. Kamrater, var vaksamma mot dessa parasiterande element."}, "date": "4 september, 11:35", "url": "https://arbetet.se/2026/09/04/sa-vill-c-sanka-lonekravet-for-arbetskraftsinvandrare-vid-valvinst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04112724/thand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "AfD stormar mot historisk seger – Tysklands politiska brandmur knakar", "summaries": {"normal": "AfD står inför en historisk seger i Sachsen-Anhalts delstatsval med uppemot 40 procents väljarstöd. Detta skakar Tysklands etablissemang och pressar den så kallade brandmuren, då övriga partier tvingas välja mellan svåra koalitioner, eventuellt med vänstern, eller politiskt kaos. Förbundskansler Merz varnar för konsekvenserna medan partiet siktar mot nationell makt.", "trump": "Tyskland har stora problem, enorma problem! De säger att AfD kan få 40 procent i Sachsen-Anhalt. Otroligt! De etablerade politikerna skakar av skräck bakom sin lilla mur. Samma gamla misslyckade system som sa att det var otänkbart. Om de bara hade satsat på olja och America First istället för öppna gränser hade de sluppit detta kaos. Sorgligt!", "stalin": "I Tyskland vacklar nu den så kallade brandmuren under folkets massiva vrede mot det borgerliga etablissemanget. Om partiet AfD uppnår fyrtio procent visar det på bourgeoisins absoluta svaghet och inkompetens. Statens säkerhetsorgan noterar detta med stort intresse. De som försöker bygga murar mot historiens obevekliga marsch kommer obönhörligen att krossas av arbetarklassens järnhäl. Ordning skall skapas!"}, "date": "5 september, 09:00", "url": "https://samnytt.se/afd-stormar-mot-historisk-seger-tysklands-politiska-brandmur-knakar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04080654/tyskland-flagga-afd.jpg"}, {"type": "image-full", "heading": "Skogkär: Plötsligt fanns det asylfusk", "summaries": {"normal": "En irakisk familj bosatt i Danmark använde falska uppgifter för att lura till sig uppehållstillstånd, medborgarskap och bidrag i både Sverige och Danmark. Artikeln kritiserar tidigare svensk migrationspolitik för slapphet och bristande identitskontroller, vilket lett till omfattande fusk och ett växande skuggsamhälle. Författaren menar att Tidöpartiernas politik och förslaget om att kunna återkalla medborgarskap är nödvändigt för att stoppa missbruket.", "trump": "Sveriges gränser har varit ett absolut skämt, totalt vidöppna för fuskare! Jag hör om en irakisk familj som bodde i Danmark och bara skrattade hela vägen till banken, medan de hårt arbetande svenska skattebetalarna fick betala dubbla bidrag tack vare helt inkompetenta myndigheter. De släpper in precis vem som helst utan att ens kolla ID! Dags att skärpa till sig, bygga starka lagar och sätta America... för förlåt, Sverige First!", "stalin": "Det borgerliga förfallet och byråkratins totala blindhet har förvandlat välfärdsstaten till en gränslös bankomat för bedragare. Medan staten slösar miljarder på lösa boliner och okända identiteter, hånar kriminella element våra institutioner. Vi noterar med skärpa att kontrollen måste stramas åt, byråkratin renskäras från ideologisk defaitism, och att varje illojal parasit som undergräver systemet omedelbart skall berövas sitt medborgarskap."}, "date": "5 september, 08:17", "url": "https://bulletin.nu/skogkar-plotsligt-fanns-det-asylfusk", "imageUrl": "https://cdn.bulletin.nu/articles/943f02b3-1f58-408b-bcc1-d12ab5375f1a/preview.jpg?t=1788528775000"}, {"type": "image-right", "heading": "Uppgifter: Vapenvila inför amerikanska besöket i Kiev", "summaries": {"normal": "Donald Trump skickar sändebud till Moskva och Kiev för att försöka få igång fredssamtal. Enligt uppgifter har ukrainska styrkor beordrats att iaktta en fyra dagar lång vapenvila under besöket. Ryssland har trots detta genomfört attacker mot Kievregionen där två personer skadats. Flera ukrainska militärer är skeptiska till förhandlingarna.", "trump": "Vi skickar mina bästa killar till Moskva och Kiev för att fixa det här vansinnet. Det blir en jättevapenvila, fyra hela dagar, och chanserna att vi får till fred är kolossala, tro mig. De fega byråkraterna i Kiev gnäller förstås, medan Sleepy Joes efterdyningar fortfarande sabbar allting. Men jag fixar det – ingen gör det bättre än jag.", "stalin": "Kamrater, se hur de dekadenta västmakterna fumlar med sina patetiska sändebud och korta vapenvilor. De fientliga hindren från Kiev är bara ynkliga försök att störa den ryska statens naturliga sfär. Jag ler från historien åt denna fars. Den starka ledaren i Kreml vet vad som måste göras mot sådana svaga motståndare. Inga kompromisser med förrädare."}, "date": "5 september, 07:09", "url": "https://www.tv4.se/artikel/6lm54Pq86GLxpPIdRQ3zpF/uppgifter-vapenvila-infoer-amerikanska-besoeket-i-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5hlbp2ChD6YLkrGXgk4pAc%2F951ac7db50e295d43244f2e320903edd%2F06-3.jpg&width=120"}, {"type": "image-full", "heading": "Nu hotar britterna Argentina med – en supermarket", "summaries": {"normal": "Bråket om Falklandsöarna fortsätter efter att Argentinas president Javier Milei hävdat att öarna tillhör Argentina. Storbritannien svarar med att försvara öbornas rätt till självstyre. Livsmedelskedjan Iceland Foods planerar nu att öppna en butik på öarna som ett oväntat stöd till den brittiska närvaron.", "trump": "Folk, ni måste se det här! Den galna argentinska killen Milei skriker om att Malvinas är hans, men britterna slår tillbaka med en supermarket! Iceland Foods kommer dit med frysvaror och vinner hjärtan. Fantastiskt drag, mycket bättre än krig. Argentina förlorar stort, som vanligt under de där vänsterknäpparna.", "stalin": "Kamrater, se hur de imperialistiska parasiterna bråkar om en sten i havet. Den argentinske upprorsmakaren skriker anspråk medan de brittiska exploatörerna skickar en fryst matkedja som vapen. Vilken ynklig föreställning! Arbetarna skrattar åt dessa dekadenta kapitalister som tror att en supermarket kan ersätta kanoner. Patetiskt."}, "date": "4 september, 20:48", "url": "https://www.dagensps.se/varlden/nu-hotar-britterna-argentina-med-en-supermarket", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlev73nmsorv0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "SD kopplar in säkerhetsavdelningen efter Riks granskning av V-topp", "summaries": {"normal": "Sverigedemokraterna kopplar in sin säkerhetsavdelning efter en granskning av Riks. Vänsterpartiets gruppledare på Lidingö, Jonas Lundgren, deltog i en solidaritetsaktion för en ETA-medlem som dömts till 30 års fängelse för mord. Lundgren kallade honom politisk fånge och vägrade svara på frågor. Han sitter även i SAC:s styrelse.", "trump": "Folk, ni ser det här? Den här vänsterextremisten på Lidin
