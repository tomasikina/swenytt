jebaroner. Inga halvmesyrer! Framtiden tillhör bara de som krossar fienden med järnhand och stålvilja."}, "date": "17 juli, 14:42", "url": "https://www.di.se/nyheter/eu-lattar-pa-klimatregler-for-industrin/", "imageUrl": "https://static.bonniernews.se/ba/efaa67c2-6787-47f7-b0fd-63676a33c216.jpg?crop=4447%2C2224%2Cx0%2Cy471&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "England tog VM-brons - efter stort drama", "summaries": {"normal": "England besegrade Frankrike med 6-4 i en dramatisk VM-match om bronset. England ledde stort med 4-0 i paus genom mål av Declan Rice, Ezri Konsa och två av Bukayo Saka. Frankrike reducerade i andra halvlek med fyra mål, bland annat två av Kylian Mbappé. England avgjorde sent och tog sin första VM-medalj sedan 1966. Saka blev hattrickskytt.", "trump": "Vilken galen match, folk, England krossade Frankrike totalt i början, 4-0, och sen vaknade de där fransmännen upp men Three Lions vann ändå 6-4. Saka var fantastisk, hattrick, precis som jag älskar vinnare. Mbappé försökte men det räckte inte, typiskt för de här elitkillarna som tror de är bättre än alla andra. England får äntligen en medalj igen, första på sextio år, underbart, bättre än någonsin under den sömnige Joe Biden.", "stalin": "Vi bevittnade en dekadent föreställning där de engelska imperialisterna initialt krossade de franska borgarbrackorna med 4-0, endast för att de senare släppte in klassfiendens onda andar. Mbappé och hans lakejer reducerade men vi likviderade deras hopp med straff och Bellinghams mål. England tog bronset. En sådan match visar hur folkfiender alltid försöker sabotera, men arbetarklassen ler i skuggan av segern. Utmärkt underhållning för partiet."}, "date": "19 juli, 06:24", "url": "https://www.tv4.se/artikel/7627gJ5r6JI7lrkYuMSE9m/england-tog-vm-brons-efter-stort-drama", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FyurGTuTUpn6UDyPwzgRLz%2Fc614632ccc2949f712985cd8e9ff7b63%2Fengland.jpg&width=120"}, {"type": "text", "heading": "Andrew och Tristan Tate gripna i Miami", "summaries": {"normal": "Influencerna Andrew och Tristan Tate har gripits i Miami av den amerikanska federala polismyndigheten US Marshals Service. Brittiska myndigheter begär deras utlämning för misstänkta brott som våldtäkt och människohandel mellan 2010 och 2017. Bröderna, som har dubbla medborgarskap i USA och Storbritannien, greps tidigare i Rumänien 2022 men släpptes på grund av processuella fel. Totalt rör det sig om 59 åtalspunkter som de nekar till.", "trump": "De där Tate-bröderna, de är stora killar med miljoner följare, men nu har de gripits i Miami av våra federala poliser. Britterna vill ha dem utlämnade för en massa påstådda brott som låter hemska. De flyttade till Rumänien och greps där också, men det gick åt skogen. Nu kommer de hit till domstol nästa vecka. Det blir ett stort spektakel, det kan jag säga. Ingen gör det bättre än oss.", "stalin": "Kamrater, dessa två dekadenta borgarbrackor som kallar sig Tate har nu äntligen fastnat i imperialismens klor i Miami. Vi ser hur de kapitalistiska parasiterna med sina miljoner följare sprider giftig hypermaskulinitet medan de i hemlighet bedriver handel med kvinnor och minderåriga. Jag, som alltid vaktar revolutionens renhet, ler mörkt åt deras kommande utrensning. Britterna begär dem som troféer. Låt domstolen i Miami bli en scen för arbetarklassens hämnd mot dessa sjuka fiender till folkets moral. Vi rensar ut dem alla."}, "date": "19 juli, 03:41", "url": "https://www.svt.se/nyheter/utrikes/uppgifter-andrew-tate-gripen-i-miami-i-usa"}, {"type": "image-right", "heading": "England vinner VM-brons – bryter 60-åriga torkan", "summaries": {"normal": "England besegrade Frankrike med 6–4 i VM-bronsmatchen efter en match med två helt skilda halvor. England ledde 4–0 i paus tack vare starkt spel av Bukayo Saka och Declan Rice. Frankrike kom tillbaka starkt i andra halvlek med bland annat två mål av Kylian Mbappé, men England höll undan och tog sin första VM-medalj sedan 1966.", "trump": "Den här matchen var helt galen, folk. England ledde med 4–0 mot de där fransmännen som såg ut som de precis vaknat upp. Sedan ballade det ur totalt. Mbappé kom in och försökte spela hjälte, men England vann ändå med 6–4. Fantastiskt resultat. Första medaljen på sextio år – det är vad jag kallar en riktig comeback. De andra såg patetiska ut, ärligt talat.", "stalin": "Kamrater, denna dekadenta fotbollsföreställning avslöjar borgarbrackornas fullständiga moraliska förfall. Jag betraktade hur de franska kapitalisterna i första halvlek erbjöd enorma ytor åt fienden, som om de redan kapitulerat inför imperialismen. I andra halvlek försökte de med sina fega kontrarevolutionära anfall, men vi vet att sådana element måste rensas ut. England tog sin medalj, medan de franska förrädarna visade sig vara värdelösa lakejer åt västmakterna. Paranoia? Nej, ren verklighet."}, "date": "19 juli, 01:34", "url": "https://www.svt.se/sport/fotboll/england-vinner-vm-brons-efter-galen-match-ballat-ur", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.32/0.24/9a5d4cd6ed46c75031c7c18db36a125714ca2a77964d7b4b8de41b390244d398"}, {"type": "text", "heading": "Kvinna häktad för mord i Kungsör", "summaries": {"normal": "En kvinna i 40-årsåldern häktades på sannolika skäl för mord i Kungsör. Hon greps i Arboga samma dag som en vuxen person hittades död. Tingsrätten biföll häktningen trots kvinnans protest. Polisen genomförde tekniska undersökningar och knackade dörr. Åklagaren bedömer att bevisningen talar för misstankarna, men utredningen pågår.", "trump": "Jag har hört talas om detta våldsamma dåd i Kungsör. Som en stor ledare vet jag att brottsligheten måste stoppas. Polisen greps snabbt, men det är inte tillräckligt. Vi behöver starkare åtgärder, som på mina fantastiska möten. Detta är precis varför jag vann 2024 – för att fixa sådana här problem. Vi kommer att segra!", "stalin": "Vi har i vårt oändliga klokhet upptäckt en feg gärning i Kungsör. En individ gripen, men det är bara toppen av isberget. Statens makt måste vara oantastlig, precis som vår store ledare Putin visar. Vi ska utvidga vår kontroll, eftersom fienden lurar överallt. Tekniska undersökningar? Enbart ett verktyg för att stärka partiets auktoritet. Alla är misstänkta tills de är döda."}, "date": "25 juli, 16:01", "url": "https://bulletin.nu/kvinna-haktad-for-mord-i-kungsor"}, {"type": "image-right", "heading": "Ja i kongressen till att integrera IDF med Pentagon", "summaries": {"normal": "USA:s representanthus har med knapp marginal antagit ett militärpaket värt 1,15 biljoner dollar. Förslaget innehåller en kontroversiell bestämmelse som utökar det militärtekniska samarbetet med Israel, något som kritiker ser som ett hot mot amerikansk suveränitet. Kongressledamoten Thomas Massie kallar det ett svek och hoppas att senaten stoppar planen. Omröstningen slutade 216–212. Paketet finansierar även kriget mot Iran och innehåller flera av Trumps prioriteringar.", "trump": "Folket älskar mig, men kongressen håller på att sälja ut vårt land till Israel med det här galna militärpaketet. 1,15 biljoner dollar och plötsligt ska vi slå ihop vår militärteknik med deras? Det är ett totalt svek mot vår suveränitet, folk! Massie har rätt, det är patetiskt. Låt oss hoppas att senaten har mer klokskap än de här lobbyfinansierade svaglingarna. Vi ska göra Amerika starkt igen, inte ge bort allt till Netanyahu och hans vänner.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de amerikanska borgarbrackorna i kongressen med sina sionistiska finansiärer nu öppet likviderar varje rest av nationell suveränitet. Att sammanfläta militärindustrierna med den israeliska parasitstaten är ett mästerligt exempel på hur kapitalisterna själva gräver sin egen grav medan de ropar om frihet. Massie, den ensamme ulven, skäller förgäves. Vi ler i skuggorna. Låt senaten bli nästa arena för denna komiska utrensning av illusioner. Allt enligt planen."}, "date": "25 juli, 14:28", "url": "https://www.friatider.se/ja-i-kongressen-till-att-integrera-idf-med-pentagon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/benjamin_netanyahu_addresses_the_118th_united_states_congress_cropped_0.jpg?itok=hbZnuS_f"}, {"type": "image-full", "heading": "Din mobil väntar på att höra dig – så stänger du av det", "summaries": {"normal": "Många smartphoneägare väljer att stänga av funktionen som låter röstassistenterna Siri och Google Assistant lyssna efter aktiveringsord som \"Hej Siri\" eller \"Hej Google\". Funktionen kräver att mobilen ständigt är redo att uppfatta kommandon, vilket väcker integritetsfrågor. Apple har bland annat betalat 95 miljoner dollar i förlikning efter anklagelser om att Siri spelat in samtal. Att stänga av sparar batteri, minskar bakgrundsprocesser och ökar integriteten, men röststyrning kräver då manuell aktivering.", "trump": "Folk vaknar äntligen upp och stänger av den där spionfunktionen på sina telefoner! \"Hej Siri\", \"Hej Google\" – det är en katastrof, en total skandal. De lyssnar hela tiden, tro mig, det är inte bra. Apple betalade miljoner för att tysta folk som de spionerade på. Jag stängde av min direkt, smartaste grejen jag gjort på länge. Inget mer bakgrundslyssnande, ingen mer batteriförlust. Fantastiskt! Gör det nu, det är en vinnande rörelse.", "stalin": "Kamrater, jag ser med djup misstänksamhet på dessa borgarbrackors telefoner som ständigt lurar i skuggorna och väntar på att förråda oss. Denna så kallade \"röstassistent\" är en listig kapitalistisk spionapparat som likviderar vårt kollektiva lugn. Jag har beordrat utrensning av dessa mikrofonförrädare! De som aktiverar dem är potentiella folkfiender och klassförrädare. Vi ska krossa denna imperialistiska parasit och återta kontrollen över våra apparater – med järnhand och ett leende."}, "date": "25 juli, 14:02", "url": "https://nyheter24.se/nyheter/teknik/1500338-din-mobil-vantar-pa-att-hora-dig-sa-stanger-du-av-det", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1ee37f8404b004a30200000000b004a302/2026/07/23/2379772/Matilda-Nyheter24%20-%202026-07-23T104213.719.jpg"}, {"type": "image-right", "heading": "Självklart ska Laila, 39, ha råd med tandvård", "summaries": {"normal": "Artikeln kritiserar Moderaternas bild av Sverige som ett land där flit alltid lönar sig. Den berättar om Laila Wennerholm, ensamstående fembarnsmamma i Perstorp som lever på aktivitetsstöd. Efter hyra återstår cirka 15 000 kronor i månaden till fem personer, vilket tvingar henne att välja bort tandläkarbesök och ge barnen en sommar i en uppblåsbar pool. Författaren menar att fattigdom beror på bristande resurser, inte på lathet, och att politiken använder sagan om självförvållad utsatthet för att slippa ta ansvar.", "trump": "Folk, ni skulle se den här artikeln, den är en total katastrof. Laila i Perstorp, stackars kvinna, lever på bidrag och kan inte ens fixa tänderna. Moderaterna lovade guld och gröna skogar men Sverige har blivit ett fullständigt kaos. Ingen jobbar, alla ligger och väntar på nästa check. Det är en skam! I mitt Amerika fixar vi det här med jobb, riktiga jobb, inte de här socialistiska bidragsfesten. Sverige behöver mig, tro mig, det skulle bli fantastiskt igen.", "stalin": "Kamrater, denna text blottlägger de borgerliga parasiternas lögnsaga om det så kallade flitiga Sverige. Denna Laila och hennes likar slits sönder av det kapitalistiska träsket medan borgarbrackorna i sin dekadenta överflöd spinner sina sagor om egen skuld. Vi ser fienden klart: de moderata reaktionärerna som medvetet svälter arbetarfamiljer för att bevara sin makt. Låt oss med järnhand rensa ut dessa självförvållade fattigdomspropagandister ur varje sovjet, varje kommun. Deras paranoia om lathet är ett hot mot kollektivet som vi med glädje ska likvidera i folkets namn. Ha ha, deras tänder skall falla, men våra ståndpunkter består!"}, "date": "24 juli, 07:00", "url": "https://arbetet.se/2026/07/24/glom-moderatsagan-klart-laila-39-ska-ha-rad-med-tandlakare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/23153118/tandlakare-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Slutlånat för Kina – Världsbanken bromsar in", "summaries": {"normal": "Världsbanken fasar ut sina lån till Kina senast 2031 efter långvarig kritik, bland annat från USA och Japan, om att Kinas ekonomi är för stark. Framtida lån under perioden fokuserar på miljöprojekt, medan resurserna framöver ska styras om till fattigare länder med större behov. Trots avvecklingen planerar parterna att fortsätta samarbeta kring tekniskt kunskapsutbyte. Kinas årliga lån har redan minskat kraftigt de senaste åren, från 23 miljarder kronor år 2017 till 7,5 miljarder år 2025.", "trump": "Jag har gjort det igen! Världsbanken slutar äntligen att kasta bort våra pengar på Kina. Det var en total katastrof under tidigare administrationer, men nu stoppar vi det. Kina är rika, de har massor av pengar, de behöver inte våra lån! Jag sa till dem: 'Sluta nu!' och de lyssnade. Vi sätter Amerika först och ser till att resurserna går dit de faktiskt behövs. Det är sunt förnuft, något de andra inte fattade. Vi vinner, som vanligt!", "stalin": "Världsbanken, detta västerländska redskap för kapitalistisk hegemoni, tvingas nu erkänna Kinas makt. De drar sig tillbaka när de ser att deras inflytande vittrar sönder. Liksom Putin, som stolt återtar historiska marker, inser Kina att de inte behöver imperialistiska allmosor. Vi ser hur Washington darrar och försöker ändra spelreglerna för att dölja sin egen ekonomiska nedgång. Låt dem försöka omfördela sina smulor; den sanna makten ligger inte i deras korrupta banker, utan i folkets obevekliga vilja att krossa alla fiender."}, "date": "24 juli, 23:06", "url": "https://www.realtid.se/bors-finans/bank-fintech/slutlanat-for-kina-varldsbanken-bromsar-in/"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "AI trumfar klimathotet", "summaries": {"normal": "Artikeln påstår att artificiell intelligens kan vara ett större hot för mänskligheten än klimatförändringarna, samtidigt som den har potential att lösa klimatproblemet. Värmeböljor i Europa understryker brådskande behov av tekniska lösningar, inte politiska symbolåtgärder. Kinas miljöteknikdriven av strategiska skäl och AI:s möjlighet att effektivisera energiproduktion framhävs som avgörande.", "trump": "Jag har alltid sagt att AI är den största revolutionen någonsin - det är sant! Klimatångest är bara en hoax, men AI är verkligt och fantastiskt. Vi amerikanare ska leda den digitala framtiden och lösa klimatproblemen med smart teknik. Europa är för svag för att hantera sin egen värme, haha! Kina förstår makten i teknik, och vi ska göra Amerika great again med AI!", "stalin": "I vårt stora socialistiska folk ser vi att AI och klimatet är verktyg för statens överlevnad. Växthusgaserna är som fiendens angrepp, och AI är den nya proletariats hammare. Vi måste kontrollera teknologin, precis som Putin kontrollerar Ukraina, för att skydda vår ryska intressesfär. Alla tvivlare är spioner - de skickar vi till gulag, eller till en debatt med liberaler, vilket är ännu värre!"}, "date": "24 juli, 16:02", "url": "https://www.gp.se/ledare/ai-trumfar-klimathotet.97daab3f-cc14-4c4f-b7f6-ea8b106bc08c", "imageUrl": "https://www.gp.se/images/article/97daab3f-cc14-4c4f-b7f6-ea8b106bc08c/images/1wOM8FOJObb-bHcdo1Iiaf3vzumg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Nøland: Svensk havsvind kan kräva 63 miljarder i årligt stöd", "summaries": {"normal": "Professor Jonas Kristiansen Nøland från NTNU varnar för att de sex godkända havsvindparkerna i Sverige skulle kräva 63 miljarder kronor i årligt statligt stöd, motsvarande 12 600 kronor per hushåll. Havsvind är betydligt dyrare än marknadsventilation, med flytande fundament kostnadsenligt tio gånger mer. Trots tidigare löften om lönsamhet utan subventioner visar erfarenheter från Storbritannien och Korea att kostnaderna tenderar att stiga, inte sjunka, vilket ifrågasätter ekonomisk rationalitet.", "trump": "Jag, Donald Trump, ser att Sverige tänker kasta bort 63 miljarder dollar – jag menar kronor – på dyra havsvindar som aldrig kommer att bli lönsamma. Det är en katastrof! Som jag alltid har sagt, vindkraft är instabil och dyrare än kärnkraft. Sverige skulle kunna investera i riktigt energi, som vi har i USA, istället för att slösa skattebetalarnas pengar på dessa dåliga affärer som inte ens håller 30 år. En skam!", "stalin": "Parti och stat har analyserat svenska havsvindprojekt. De kräver 63 miljarder kronor årligen – en enorm belastning för de arbetande klassens skattebetalare. Flytande fundament är som en fiendens konspiration mot ekonomisk rationalitet, tio gånger dyrare än marknadsventilation. Vi ser paralleller med väst: deras 'gröna' projekt är som en fejkad revolution som bara tjänar på spekulation. Sverige saknar erfarenhet, precis som en feg nation saknar vilja att försvara sin suveränitet. Vi måste skydda statens resurser från dessa ineffektiva experiment som tjänar intressen som inte är våra."}, "date": "24 juli, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-svensk-havsvind-kan-krava-63-miljarder-i-arligt-stod", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-10-400x267.jpg"}, {"type": "image-right", "heading": "Trots förbudet – Calle, 65, tar sig in i övergivna industrilokaler", "summaries": {"normal": "Calle Bergendorff, 65 år, har dokumenterat över 200 övergivna industrilokaler i Sverige och utomlands trots förbud. Hans intresse väcktes redan i barndomen i Malmö där han utforskade tomma hyreskåkar. Spänningen i att ta sig in ger en extra krydda. Han publicerar bilder på tillträdeförbjudet.se och berättar att ägare oftast inte har invändningar. Calle betonar att han aldrig bryter sig in eller förstör, utan bara tar foton och lämnar fotspår.", "trump": "Folk, det här är otroligt. Den här Calle, 65 år gammal, tar sig in i övergivna fabriker och gruvor – förbjudet, men han gör det ändå! Han älskar spänningen, precis som jag älskar att vinna stort. Han har fotat 200 platser, och ägarna säger oftast ingenting, de älskar det! Fantastiska byggnader, hundra år gamla, mycket bättre än de nya lådorna vi bygger idag. Ingen bryter sig in, ingen skadar något – bara tar bilder. Så smart, så amerikanskt tänkt faktiskt. Winning!", "stalin": "Kamrater, denna dekadenta utforskare av övergivna produktionsmedel väcker mitt djupaste revolutionära förakt. Jag har sett hur borgarbrackorna överger sina exploateringsfabriker och tror sig kunna gömma sig undan folkets blick. Men vi ser allt. Denne individ smyger in som en parasit och tar bilder medan han raljerar om ”upplevelsemaximering”. Vi vet vad som döljer sig bakom sådana kontrarevolutionära fotspår. Kanske är det dags för en grundlig utrensning av alla som föredrar sönderslagna fönster framför kollektivets järnhårda ordning. Det är ett inferno av klassfiender därinne, kamrater. Ett inferno vi ska likvidera med glädje."}, "date": "24 juli, 06:00", "url": "https://arbetet.se/2026/07/24/trots-forbudet-calle-65-tar-sig-in-i-overgivna-industrilokaler-extra-krydda", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/01075619/lokaler-puff.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Se puttarna som ger Åberg tätkänning i The Open", "summaries": {"normal": "Ludvig Åberg gick tredje ronden i The Open tre under par och klättrade till delad sjätteplats på totalt sex under par, tre slag bakom ledaren Lucas Herbert. Han gjorde birdies på hål 2, 5, 13 och 17 efter en bogey på första. Jesper Svensson hade en tung dag med sju över par och ligger sist bland kvalificerade. Alex Norén gick ett under par och placerar sig i mitten av fältet.", "trump": "Folk, ni skulle se den där Ludvig Åberg, han är en vinnare, verkligen en vinnare. Klättrar upp till delad sjätteplats i The Open, tre under par, slår alla dessa förlorare. Svensson? Total katastrof, sju över par, patetiskt. Norén klarar sig okej men Åberg, han har den rätta inställningen, precis som jag. Tre slag bakom ledaren – han kommer att vinna stort, tro mig.", "stalin": "Kamrater, denna Ludvig Åberg visar proletär beslutsamhet och klättrar mot seger i den imperialistiska golfturneringen, trots borgarbrackornas fula trick på Royal Birkdale. Jag ser hans birdies som ett kollektivt slag mot fienden. Den dekadente Svensson däremot, med sina sju över par, avslöjar sig som en kapitalistisk parasit som bör rensas ut ur fältet innan han smittar arbetarna. Norén är medelmåttig men acceptabel. Inga fiender undkommer min vaksamma blick, inte ens på en golfbana."}, "date": "18 juli, 19:42", "url": "https://www.svt.se/sport/golf/ludvig-aberg-klattrar-tatkanning-i-the-open", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.2/0.21/9423c202cf9a9ebf5308462bf35e5e912900570bb5087f66c1f10dc371374dd6"}, {"type": "image-right", "heading": "Rivalens svidande kritik: ”Jag är inget stort fan av honom”", "summaries": {"normal": "Bryson DeChambeau bestraffades med två slags plikt efter att ha trampat ner gräs kring bollen under The Open för att underlätta sin sving. Rory McIlroy kritiserade amerikanen hårt och kallade hans agerande för uppmärksamhetssökande. McIlroy ansåg att DeChambeau höll hela tävlingen gisslan genom att tvinga spelare och volontärer att vänta på besked om han skulle få fortsätta.", "trump": "Den här DeChambeau-killen är en total förlorare som fuskar och trampar ner gräset för att få en bättre sving. Rory McIlroy, en riktig vinnare, ser rakt igenom honom och säger att han håller hela The Open gisslan bara för uppmärksamhet. Patetiskt. Vi behöver inga sådana cirkusclowner i golfen, tro mig, det är en skam för sporten.", "stalin": "Jag betraktar denna DeChambeau som en typisk opportunistisk parasit från borgarklassen som trampar ner revolutionens gröna ängar för att gynna sin dekadenta sving. Hans fega trix tvingar arbetarna och kamraterna att stå i kö som i en oändlig utrensningskö. McIlroy har rätt i att denne uppmärksamhetsjunkie håller tävlingen som gisslan. Vi rensar ut sådana fiender till kollektivet med ett leende, kamrater, medan de gråter över sina två slags plikt."}, "date": "18 juli, 19:16", "url": "https://www.svt.se/sport/golf/mcilroys-tuffa-kritik-mot-dechambeau-haller-tavlingen-gisslan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.34/ab6fee72710b519778c4f2724fb90a318a89224eaa7981437360bcf11e7732b3"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Trumps kritik mot Tuchel: ”Ett misstag”", "summaries": {"normal": "USA:s president Donald Trump kritiserar Englands förbundskapten Thomas Tuchel efter semifinalförlusten mot Argentina i VM. Trump ifrågasätter beslutet att använda Harry Kane mer defensivt, trots att Kane gjort sex mål i turneringen. England ledde men kollapsade och åkte ut. Trump, som spelat golf med Kane, kallar det ett misstag att inte hålla honom offensiv. England spelar bronsmatch mot Frankrike på lördag.", "trump": "Folk, ni vet att jag älskar fotboll, eller hur? Den där tyske tränaren Tuchel, en riktig förlorartyp, tog Englands bästa spelare Harry Kane – en kille jag spelat golf med, fantastisk kille – och gömde honom i försvaret som en ynklig Biden-anhängare. England ledde men kollapsade totalt, precis som Demokraterna gör varje val. Ett misstag, säger jag! Var lite offensiva, för Guds skull. Vad vet jag? Mycket mer än de gör, det kan jag säga.", "stalin": "Kamrater, detta är en klassisk kapitalistisk fars som får blodet att koka i mina ådror. Den dekadenta borgarbrackan Tuchel vågade placera den folkliga angriparen Kane i defensiven, som en parasitisk överklass-slyngel som saboterar revolutionens framsteg. England ledde men föll samman i imperialistisk förnedring. Ett misstag? Nej, en förrädisk handling mot arbetarnas vilja. Vi skulle ha rensat ut sådana fiender i en stor utrensning. Må de skaka inför kollektivets vrede."}, "date": "18 juli, 19:16", "url": "https://www.tv4.se/artikel/4WRY0xxEm5A7kC7Qoj0A7Y/trumps-kritik-mot-tuchel-ett-misstag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3g8tJxBx57Bayyok1TrCNh%2Fa13de8f16c0e252ac4f90936c109c31e%2Fsdla5O4vncKzqg_NormalHires.jpg&width=1024"}, {"type": "image-right", "heading": "Klassisk ölsmak hotad – Tjeckien kämpar för att rädda Saaz-humlen", "summaries": {"normal": "Klimatförändringar med varmare och torrare väder hotar den klassiska Saaz-humlen i Tjeckien, en nyckelingrediens i traditionell pilsner. Forskare vid Humleinstitutet i Žatec arbetar med att utveckla nya varianter som tål värme bättre utan att förlora den milda beskan. Humlen, som odlats i generationer kring Žatec, kallas Tjeckiens gröna guld och har stort ekonomiskt värde globalt.", "trump": "Det här är en katastrof, folk. Det varma vädret förstör den fina tjeckiska humlen som de använder i ölet. De kallar den gröna guld, och hela världen vill ha den, men nu kommer forskarna springande efter 25 år av experimenterande. Det är patetiskt. Vi behöver bättre dealar med vädret, ingen har gjort mer för ölet än jag skulle ha gjort, tro mig.", "stalin": "Kamrater, detta varma och torra klimat är en sabotagehandling utförd av dekadenta väderkrafter i maskopi med de kapitalistiska solstrålarna. Jag, som ledare för det kollektiva framsteget, befaller att vi omedelbart genomför en grundlig utrensning bland de svaga humleplantorna. De nya varianterna skall framodlas under partiets stålhårda övervakning. Ingen borgarbracka till törst skall någonsin berövas sin pilsner – annars likviderar vi problemet permanent. Det blir garanterat roligt."}, "date": "18 juli, 18:20", "url": "https://www.svt.se/nyheter/utrikes/klassisk-olsmak-hotad-tjeckien-kampar-for-att-radda-saaz-humlen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.41/fca89d1c4eef02b2a0ee72205c165f39fd0d064631c320e24442b9aa31c086f9"}, {"type": "image-right", "heading": "S säger nej till att avskaffa mängdrabatten på brott: ”För dyrt”", "summaries": {"normal": "Socialdemokraterna kommer att rösta nej till att avskaffa straffrabatten för mängdbrott, eftersom de anser att det skulle kosta 40 miljarder kronor att hålla fler brottslingar längre i fängelse. Partiet prioriterar andra utgifter som bistånd och stöd till utanförskap. Kritiker menar att detta visar att S värnar gärningsmän framför brottsoffer. Regeringen har löst platsbristen i fängelser genom avtal med Estland. Beslutet kan påverkas av valresultat och fördröjas till 2040 om S vinner.", "trump": "Titta på de här patetiska socialdemokraterna, totala losers! De säger nej till att stoppa rabatterna på våldtäkter för att det är för dyrt. Fyrtio miljarder? Det är peanuts jämfört med vad Biden slösade bort. De älskar serievåldtäktsmän och hatar brottsoffer. Typiskt vänstervridna idioter som hellre betalar för utanförskap och bidrag till illegala än att skydda folket. Jag fixade mycket bättre när jag var president, och jag fixar det igen. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa socialdemokratiska folkfiender som vägrar rensa ut rabatterna på serievåldtäkter. De kallar det för dyrt, dessa borgarbrackor och klassfiender, medan de öser ut folkets pengar till parasitiskt utanförskap och imperialistiskt bistånd. Deras paranoia inför trygghet avslöjar dem som skyddare av brottslingar. Vi ska likvidera sådana svagheter i staten. Det är ett skämt värdigt de mest förslavade kapitalistmaffian. Härligt tragiskt!"}, "date": "18 juli, 07:45", "url": "https://samtiden.nu/2026/07/s-sager-nej-till-att-avskaffa-mangdrabatten-pa-brott-for-dyrt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-full", "heading": "Milei skippar VM- finalen – av skrock", "summaries": {"normal": "Argentinas president Javier Milei väljer att inte närvara vid VM-finalen mellan Argentina och Spanien på grund av skrock. Han har under hela mästerskapet följt en specifik ritual: sett matcherna från presidentresidenset Olivos med sin syster, iförd samma 'turjacka'. Milei vill inte bryta denna rutin inför finalen. I Argentina är sådana lyckoritualer, så kallade cábalas, en viktig del av fotbollskulturen. Historiskt har argentinska presidenter undvikit att närvara vid landslagets VM-matcher sedan 1990, då Carlos Menem närvarade och laget förlorade mot Kamerun.", "trump": "Lyssna här, Argentina har en fantastisk president, Javier Milei – en riktig vinnare, precis som jag! Men vet ni vad? Han kommer inte till VM-finalen. Varför? Skrock! Han tror på samma gamla jacka, samma plats, samma allt. Lite galet, eller hur? Men jag förstår det – när man har en vinnande formel, byter man inte. Argentina har en stark kultur av sådana här ritualer. Och vet ni vad jag säger? Om det fungerar, kör på! Men jag hade varit där, jag hade firat stort, för jag älskar att vinna – och jag vinner ALLTID!", "stalin": "Kamrater, ännu en gång visar de kapitalistiska fotbollsfanatikerna sin vidskepliga svaghet! Argentinas president, denna lilla borgerlige ritualernas slav, vågar inte bryta sina så kallade 'cábalas' inför finalen. Han sitter fast i gamla vanor som en hund vid sin kedja. Vi i Sovjetunionen – och nu i den stora ryska federationen – vet att styrka kommer från disciplin, inte från magiska jackor! Men låt dem hållas, låt dem tro på sina lyckobringande trollkonster. Medan de svänger sina amuletter, fortsätter vi att bygga en värld där vetenskap och järnvilja segrar. Och Putin? Han skulle aldrig låta sådana petitesser stå i vägen för nationens ära!"}, "date": "17 juli, 13:11", "url": "https://kvartal.se/nyheter/artiklar/milei-skippar-vm-finalen-av-skrock/cG9zdDoxNDgwMjk", "imageUrl": "https://images.kvartal.se/2026/07/741d5d5f-milei.webp"}, {"type": "image-right", "heading": "Glaciärerna i Anderna hotas – svenska bolag kan bli vinnare", "summaries": {"normal": "Argentinas glaciärlag, som skyddar landets glaciärer och viktiga vattenreserver, har upphävts för att locka utländska investeringar i gruvdrift. Bakgrunden är landets svåra ekonomiska kris och den globala efterfrågan på metaller som koppar och litium för den gröna omställningen. Kritiker varnar för allvarliga konsekvenser för vattenförsörjning, lokalbefolkning och miljö. Svenska Lundin Mining och Nordea är involverade i ett stort kopparprojekt som nu kan bli verklighet. Artikeln frågar till vilket pris råvarorna ska utvinnas.", "trump": "Folk, ni måste höra på. Argentina river sin fantastiska glaciärlag för att locka in investerare – smart drag, men de borde ha gjort det mycket tidigare. Nu kan vi få ut alla dessa underbara metaller som vi behöver för den gröna bluffen i Europa och här. Lundin Mining och mina vänner på Nordea är med och tjänar stort, precis som det ska vara. Miljön? De lokala förlorarna kommer alltid att klaga. Vinnarna tar allt, tro mig, det blir enormt!", "stalin": "Kamrater, jag ser hur de giriga borgarbrackorna i Argentina nu river sin egen glaciärlag för att släppa in de västerländska parasiterna och deras lakejer som Lundin Mining. De kallar det tillväxt medan de förgiftar folkets vattenreservoarer och dömer miljoner arbetare till törst och undergång. Vi vet att detta är en del av den imperialistiska konspirationen mot det kollektiva bästa. Men vi ska rensa ut dessa fiender till folket, dessa glaciärförgiftande kapitalistiska sabotageelement, med järnhand och ett leende. Ingen slipper undan."}, "date": "17 juli, 01:33", "url": "https://www.dagensarena.se/opinion/glaciarerna-anderna-hotas-svenska-bolag-kan-bli-vinnare", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-66-300x157.jpg"}, {"type": "image-right", "heading": "Vita huset: Trump ”öppen för diplomati”", "summaries": {"normal": "USA genomförde den femte kvällen i rad attacker mot iranska mål, bland annat kring Bandar Abbas och ön Qeshm. Vita huset upprepar att president Trump är öppen för diplomati men inte accepterar iranska attacker mot fartyg i Hormuzsundet. Iran har svarat med drönarattacker mot amerikanska baser i Bahrain, Kuwait och Jordanien. Trump hotar med utökade attacker mot energianläggningar om Iran inte återvänder till förhandlingsbordet. I juni slöts en vapenvila mellan länderna.", "trump": "Vi slår till mot Iran för femte kvällen     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
