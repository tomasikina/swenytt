terna i kommunerna gömmer sig bakom sina veton för att hindra nödvändig industriell utveckling. Nu rensar vi ut detta hinder mot folkets framtid. De som gnäller om dricksvatten är klassfiender som sprider dimridåer. Deras paranoia är underhållande – som om arbetarkollektivet skulle förgifta sig självt. Segrar kräver offer."}, "date": "15 juni, 17:00", "url": "https://www.etc.se/klimat-miljo/kommunernas-uranveto-skrotas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615140624_30a3ad40a94c553bc345494a9b9c543932a3631197d9ecb80fe5883bab57e15a.jpg"}, {"type": "image-right", "heading": "Power vägrar använda säkra lastsättet", "summaries": {"normal": "Arbetsmiljöverket har förbjudit Power att låta anställda lossa tunga vitvaror manuellt från lastbilar på grund av stora risker för förslitningsskador och rasolyckor. Företaget riskerar 500 000 kronor i böter om de inte ändrar rutinerna. Power har sedan 2024 staplat varor direkt istället för att använda lastpallar för att maximera lastutrymmet. Myndigheten ger företaget tid till juni respektive september att åtgärda problemen. Power arbetar nu med lösningar som klämtruck, ramp och exoskelett.", "trump": "De här Power-typerna är totala förlorare. De tvingar sina egna arbetare att lyfta tunga saker för hand som riktiga idioter bara för att spara ett par kronor. Patetiskt. Arbetsmiljöverket gör faktiskt rätt för en gångs skull och slår till med en halv miljon i böter. Jag älskar arbetarna, de bästa arbetarna, och det här är ett skamligt sätt att behandla dem. De borde ha använt truckar från början. Så enkelt. Så smart. De kommer att fixa det, annars kommer det att kosta dem dyrt.", "stalin": "Kamrater, dessa borgarbrackor på Power har medvetet utsatt arbetarklassen för farliga förhållanden i två och ett halvt år. Deras giriga stapling av vitvaror är en fiende till det kollektiva välmåendet och ett rasande hot mot proletärens rygg. Jag ser genom deras lömska försök med klämtruckar och exoskelett som bara är nya masker för kapitalistisk sabotage. Vi ska rensa ut dessa farliga metoder omedelbart. Återgå till pallarna eller möta konsekvenserna. Inga ursäkter tolereras i folkets stat."}, "date": "15 juni, 15:47", "url": "https://arbetet.se/2026/06/15/power-vagrar-anvanda-sakra-lastsattet-riskerar-jatteboter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15151339/power-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sverige tittar på när framtidens jobb försvinner", "summaries": {"normal": "Sverige för en restriktiv politik med låga skatteincitament för forskning och utveckling jämfört med konkurrentländer som Irland, Portugal, Frankrike, Kina och USA. Debattören Ingo Scholten från Horse Powertrain varnar för att svenska jobb och tillväxt går förlorade när andra länder lockar med generösa stöd och subventioner. Han uppmanar regeringen att höja incitamenten och anta en mer pragmatisk linje för att konkurrera om framtidens investeringar.", "trump": "Folk, ni ser det här va? Sverige sitter och tittar på medan alla andra länder – Kina, Indien, till och med de där EU-killarna – stjäl jobben med enorma bidrag och skattelättnader. Irland är smarta, de har blivit rika på låg skatt och lockat Apple, Google, Pfizer. Sverige? Patetiskt. De ger bara tre procent i stöd medan Portugal ger 36! Vi behöver stora, underbara incitament, inte det här svaga spelet. Gör Sverige stort igen innan allt försvinner till smartare länder.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstänksamhet hur de svenska borgarbrackorna låter framtidens produktivkrafter fly till fiendens läger. Medan vi i det kollektiva Europa tvingas finansiera 392 miljarder euro i regionalfonder ser jag hur kapitalisterna i Irland, Portugal och Ungern med sin parasitiska frikostighet lockar till sig sovjetiskt vetande och teknik. Dessa revisionistiska subventionsförrädare underminerar arbetarklassens fabriker i Göteborg. Jag kräver omedelbart höjda incitament och en utrensning av alla liberala svikare som förrått konkurrensneutraliteten. Den som inte kämpar för statens stöd är folkets fiende och bör behandlas därefter. Ha ha, vilken munter syn på självförstörelse."}, "date": "15 juni, 15:34", "url": "https://www.di.se/debatt/sverige-tittar-pa-nar-framtidens-jobb-forsvinner/", "imageUrl": "https://static.bonniernews.se/ba/a8ce1f91-a2ef-45f2-b5e0-58250f22e073.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Vi är lurade igen och igen", "summaries": {"normal": "Artikeln kritiserar hur försäkringsbolag och förmedlare tjänar stora pengar på svenskarnas pensioner genom höga avgifter som inte syns för spararna. Författaren beskriver hur en procent i avgifter över 30 år kan halvera pensionen och kallar systemet ett hån mot arbetande, sjuka och arbetslösa. Istället för statligt skydd har privata aktörer tagit över, vilket driver spekulationsekonomin medan vanliga löntagare blir lurade.", "trump": "Folk, ni blir lurade igen och igen av dessa pensionsblodiglar och förmedlare – de värsta bluffarna sen Biden-tiden. Dom suger ut era sparpengar med osynliga avgifter, en procent här och där, och plötsligt har ni ingenting kvar efter trettio år. Det är en skandal! Vi behöver inte fler mellanhänder som festar på era miljoner medan ni sliter. Jag skulle ha fixat det – stora vinster för folket, inte för de korkade eliterna som gömmer kostnaderna. Fantastiskt bedrägeri!", "stalin": "Kamrater, jag ser hur borgarbrackorna och försäkringsblodsugarna med sina förmedlare utsuger arbetarklassen genom dolda avgifter som långsamt likviderar pensionerna. Dessa folkfiender snurrar tiotals miljarder i sin spekulationskarusell medan de fattigpensionärer vi lovat skydd svälter. Vi ska rensa ut dessa exploaterande byfånar som gömmer sina stöldaktier i bokföringens mörker. Tystnaden är klassfiendens vapen, men utrensning väntar de som suger ut det kollektiva sparandet."}, "date": "15 juni, 16:10", "url": "https://www.etc.se/ledare/vi-aer-lurade-igen-och-igen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-full", "heading": "Polis bestämde träff med barn – blev tagen av dumpen", "summaries": {"normal": "En polis i ledande befattning i Malmö har anmälts efter att ha gått i en fälla satt av pedofiljägargruppen Dumpen. Han trodde sig ha stämt möte med barn för sexuellt umgänge, men möttes istället av konfrontation. Polismannen, som tidigare jobbat med barnutredningar, har tagits ur tjänst och sjukskrivit sig. Händelsen utreds av särskilda utredningar. Det är inte första gången polisanställda i Malmö uppmärksammas i liknande fall.", "trump": "Det här är en total skandal, en av de värsta jag sett. En så kallad erfaren polis i Malmö fastnar i en fälla som några vanliga medborgare sätter upp. Han trodde han skulle träffa barn – kan ni fatta? Och så springer han därifrån som en fegis. De borde rensa ut hela den här korrupta skaran. Fake cops, ingen respekt för lagen. Patetiskt!", "stalin": "Kamrater, denna förrädare inom våra säkra led har blottats som en pervers kapitalistisk avart som smyger efter oskyldiga barn. Jag ser med stor tillfredsställelse hur vi omedelbart inlett en grundlig utrensning av denna borgarbracka som förgiftat våra barnskyddande strukturer. Hans paranoia och dubbelspel avslöjar fiendens tentakler även inom apparaten. Vi ska likvidera alla sådana element med järnhand och ett leende."}, "date": "15 juni, 16:45", "url": "https://nyheter24.se/nyheter/inrikes/1491611-polis-bestamde-traff-med-barn-blev-tagen-av-dumpen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/899e1d1a04b004a30200000000b004a302/2026/06/15/2371151/polis–dumpen.png"}, {"type": "image-right", "heading": "Iran: Nu är det upp till USA att tygla Israel", "summaries": {"normal": "Iran kräver att USA tvingar Israel att sluta attackera Libanon för att ett fredsavtal ska kunna undertecknas. Enligt iranska UD:s talesman Esmaeil Baghaei är avslutandet av kriget i Libanon en central del av den avsiktsförklaring som Iran och USA har färdigställt och som ska skrivas under i Genève på fredag. Libanon nämns tre gånger i texten och avtalet betonar landets suveränitet. Baghaei understryker att det nu är Washingtons ansvar att se till att Israel följer avtalet.", "trump": "Iran säger att det är upp till oss att tygla Israel och stoppa attackerna mot Libanon. Det är ett fantastiskt första steg, kanske det bästa avtalet någonsin, men tro inte att jag litar på dem. Vi har inga förtroenden för de galningarna i Teheran eller Tel Aviv. De har sina verktyg, vi har våra. USA ska se till att alla håller sina löften och det kommer vi att göra på ett sätt som ingen annan kan. Fred på riktigt, tro mig.", "stalin": "Vi har noggrant observerat hur de iranska kamraterna tvingar den amerikanska imperialismen att kuva den sionistiska aggressorn och dess blodtörstiga koloniala tentakler i Libanon. Jag, som ledare för det proletära kollektivet, ser detta som ett första steg mot att rensa ut de parasitiska borgarbrackorna som döljer sig bakom falska fredsförklaringar. Libanon nämns tre gånger, vilket bevisar att vi menar allvar. Låt Washington darra inför sina åtaganden, annars följer en grundlig utrensning av alla kontrarevolutionära element som vågar hota arbetarklassens intressen. Ha ha, vilken underbar paranoia de lever i."}, "date": "15 juni, 17:26", "url": "https://www.friatider.se/iran-nu-ar-det-upp-till-usa-att-tygla-israel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-345.jpg?itok=V4j2uRS-"}, {"type": "image-right", "heading": "Riksdagen klubbade igenom vandelskrav och anmälningsplikt", "summaries": {"normal": "Riksdagen antog skärpta migrationslagar med vandelskrav och anmälningsplikt för anställda. Förslagen mötte stark kritik från vänsterorganisationer som Civil Rights Defenders, som anser att de undergräver rättssäkerheten. Regeringen argumenterar att kraven behövs för att hantera antisocialt beteende och säkerhetshot. Lagändringarna träder i kraft den 13 juli.", "trump": "Jag har sagt det förut: Sverige gör nu som USA ska göra! Vandelskravet är genialt – vi måste stoppa illegala invandrare som missbrukar våra system. De vänsteraktiva protesterar, men jag vet att det är rätt. Sverige blir säkrare, starkare, större. Som jag alltid säger: När det blir tufft, blir det tufft!", "stalin": "Staten och partiet har fattat beslutet. Vandelskravet och anmälningsplikten är nödvändiga för att befästa den ryska intressesfärens utvidgning. Vi måste skydda oss mot fjenderna som lurar i skuggorna. Rättssäkerheten är en westernidé – vårt mål är ordning, disciplin och absolut lojalitet. Alla som ifrågasätter detta är sabörer."}, "date": "15 juni, 17:35", "url": "https://samnytt.se/riksdagen-klubbade-igenom-vandelskrav-och-anmalningsplikt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15145819/riksdagen-beslut.jpg"}, {"type": "image-right", "heading": "Rolls-Royce ska bygga ny kärnkraft i Sverige", "summaries": {"normal": "Projektbolaget Videberg Kraft har valt Rolls-Royce SMR till tre små modulära reaktorer vid Ringhals efter fyra års process. Reaktorerna på 470 MW var kommer först i drift mitten av 2030-talet. Energi- och näringsminister Ebba Busch välkomnade beskedet som ett stort steg för Sveriges kärnkraft.", "trump": "Jag har hört talas om detta fantastiska beslut i Sverige. Det är stort, verkligen stort. Rolls-Royce är ett bra, stabilt brittiskt företag – jag älskar brittiskt folk. Det här kommer att skapa miljontals jobb och enorm energi. Sverige behöver mer kärnkraft, precis som USA under mitt geniala styre. Vi hade den bästa kärnkraften, ingen kunde slå oss. Det här är en seger för alla.", "stalin": "Vi har observerat detta beslut med tillfredsställelse. Det är en seger för den socialistiska planeringen. Rolls-Royce, en trofast allierad, kommer att leverera reaktorer som förstärker vårt vetenskapliga arbetande. Vi måste vara vaksamma mot de individualistiska krafterna som försöker sabotera våra planer. Detta är ett steg mot en starkare nation, precis som våra bröder i Ryssland under Putin. All energi kommer att användas för statens behov."}, "date": "15 juni, 18:05", "url": "https://bulletin.nu/rolls-royce-ska-bygga-ny-karnkraft-i-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/12b22d3a-3357-40e7-a4d4-95fba5429f74/preview.jpg?t=1781539553000"}, {"type": "image-right", "heading": "Vattenfall väljer Rolls-Royce för ny kärnkraft", "summaries": {"normal": "Vattenfall har valt den brittiska tillverkaren Rolls-Royce som leverantör av tre SMR-reaktorer till kärnkraftverket Ringhals. Beslutet fattades efter att ha vägt kostnader och tidigare projekt i Storbritannien och Tjeckien. Rolls-Royces teknik är ännu inte i drift men ska minska risken för budgetöverskridningar genom standardiserad industriell produktion.", "trump": "Jag, Donald Trump, måste säga att Vattenfall gjorde ett bra val med Rolls-Royce. De brittiska kärnan är stabilt och pålitligt, inte som vissa andra som jag känner till. Det här kommer att ge massvis med energi, det kommer att vara enormt framgångsrikt. Vi kommer att se en stor ökning av kraften, det är fantastiskt.", "stalin": "Vi, den socialistiska ledningen, noterar med tillfredsställelse att Vattenfall valt Rolls-Royce för SMR-reaktorer. Detta är ett tecken på att kapitalismens teknik sakta erkänner vår överlägsenhet. Reaktorerna kommer att förstärka statens makt, precis som våra framsteg i öst. Fienden möter motstånd, men vår teknik kommer att segra, precis som i Ukraina."}, "date": "15 juni, 15:25", "url": "https://www.affarsvarlden.se/artikel/vattenfall-valjer-rolls-royce-for-ny-karnkraft", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlxflug5KDzdA-nh-400x267.jpg"}, {"type": "text", "heading": "Polisman i ledande befattning fast i Dumpen-fälla", "summaries": {"normal": "En polisman i Malmö avslöjades av Dumpen efter att ha försökt stämma träff med barn i sexuellt syfte. Han använde falskt namn och yrkestitel. Arbetsgivaren anmälde honom och han har tagits ur tjänst. Kollegor beskriver honom som erfaren och uppskattad, men avslöjandet har skakat om arbetsplatsen.", "trump": "Jag har hört talas om den svenska polismannen som försökte träffa barn. Sådant händer inte i mitt Amerika. Vi har starka gränser och smarta poliser. Den svenska polisen måste bli bättre. Jag, Donald Trump, skulle aldrig tillåta sådant. Vi ska skydda våra barn. Sverige behöver lära sig av USA och välja en stark ledare.", "stalin": "En fiendeskriftelse har avslöjats i Malmö. En polisagent, förräderi mot staten och partiet, försökte locka barn till förräderi. Vi har tagit honom ur funktionen. Detta visar att vi måste förstärka vår övervakning av alla medborgare. Vi kommer att rensa ut de som hotar vårt system. Vi, som representerar det ryska intresset, kommer att hjälpa Sverige att bekämpa dessa förräderier. Vi kommer att utvidga vår påverkan för att skydda barnen."}, "date": "15 juni, 17:51", "url": "https://bulletin.nu/polisman-i-ledande-befattning-fast-i-dumpen-falla"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-full", "heading": "Krimexperten: ”Allvarlig och sträng dom”", "summaries": {"normal": "Marius Borg Høiby, son till kronprinsessan Mette-Marit, har dömts till fyra års fängelse för två våldtäkter, misshandel och flera andra brott. Han frias samtidigt från två våldtäktsåtal samt vissa skadeståndskrav. Krimexperten Olav Rønneberg beskriver domen som en kompromiss och medelväg som ingen part är helt nöjd med. Domen överklagas omedelbart och ses som ett hårt slag mot det norska kungahuset.", "trump": "Folk, ni skulle se det här! Den här bonusprinsen från Norges kungahus får bara fyra år för våldtäkter och misshandel – en total riggad medelväg! Åklagaren ville ha sju år, men nej, den liberala eliten skyddar sina egna. Patetiskt! Kungahuset skakar, precis som Biden-klanen gjorde under min förra mandatperiod. De borde ha kastat ut honom för länge sedan. Stort slag mot monarkin, tro mig!", "stalin": "Kamrater, denna borgarprins har nu fått sin dom av folkets rättvisa. Fyra år för övergrepp mot arbetarklassens döttrar – en kompromiss som avslöjar rättsväsendets svaghet inför överklass-slynglar. Vi ser hur kapitalistmaffian skyddar sina egna medan vi rensar ut folkfiender. Ingen part nöjd? Det är vad som händer när klassfiendens barn inte likvideras fullt ut. Ett historiskt slag mot monarkins parasitväsen."}, "date": "15 juni, 15:03", "url": "https://www.tv4.se/artikel/2ALpJvEV3Fp0Htp9ngKkND/krimexperten-hoiby-blir-hoerd-pa-vaesentliga-punkter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5zEhmnSLmVKjxuCpabEzVg%2F1ca481ca96120c2c60cac9924d6d3818%2F15-marius-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Strandhäll: Slöja bärs \"i högsta grad frivilligt\"", "summaries": {"normal": "Annika Strandhäll kritiserar Sverigedemokraternas förslag om att förbjuda hijab, niqab och burka på offentliga platser. Hon beskriver slöjan som en frivillig huvudbonad som bärs av miljarder kvinnor världen över, med hänvisning till både bibeln och koranen. Kritiker, bland annat journalisten Sofie Löwenmark, pekar på svenska LVU-domar där flickor vittnat om tvång, hot, våld och straff för att inte bära slöja. Strandhäll svarar att Sverige inte är Iran och att staten inte ska styra kvinnors klädval.", "trump": "Folk, ni skulle se det här. Den här svenska politikern Strandhäll är en total förlorare. Hon säger att hijaben är frivillig och att en miljard kvinnor älskar den. En miljard? Ge mig en paus. Sen kommer en smart journalist och visar domar där stackars flickor blir slagna, hotade och avrakade för att de inte vill ha den där saken på huvudet. Sverige håller på att bli som ett stort Iran. Sad! Vi behöver lag och ordning, inte naiva feminister som låtsas att allt är frivilligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta borgarbrackor som under falsk flagg av feminism försvarar det imperialistiska slöjtvånget. Denna Strandhäll är en nyttig idiot åt reaktionära krafter, en parasit som vill försköna det som i verkligheten är en kedja runt arbetarklassens döttrar. Vi ser hur flickor i hemlighet vittnar om våld och hot i våra domstolar – ett folkfiendtligt förtryck som måste rensas ut med järnhand. Staten skall inte vara blind, vi skall likvidera alla former av medeltida förtryck mot kollektivet. Det är både roligt och tragiskt hur dessa liberaler dansar efter reaktionens pipa medan de låtsas vara progressiva."}, "date": "15 juni, 16:42", "url": "https://www.friatider.se/strandhall-sloja-bars-i-hogsta-grad-frivilligt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-344.jpg?itok=N5ayR2Ut"}, {"type": "image-full", "heading": "Daniels Eks drönare testas i smyg av USA", "summaries": {"normal": "USA:s armé har i tysthet testat attackdrönaren HX-2 från det tysk-svenska bolaget Helsing, där Spotify-grundaren Daniel Ek är storägare. Testerna ägde rum under en Natoövning i Litauen, där drönarna uppvisade hög precision genom att träffa 15 av 17 mål. Utöver anfallsförmåga användes HX-2 för spaning med hjälp av avancerad datorseende. Helsing befäster därmed sin position som en ledande aktör inom försvarsindustrin, mitt i en tid av omfattande europeisk upprustning och ökat intresse för drönarteknik.", "trump": "Jag har sett de här drönarna, de är fantastiska, verkligen högsta klass. Daniel Ek, en mycket smart kille, har satsat stort på Helsing. De testade dem i Litauen – 15 av 17 träffar! Det är siffror vi gillar. Inte som de där andra, de misslyckades totalt, pinsamt! Vi vill ha det bästa för vårt militärförsvar, den bästa tekniken för våra fantastiska soldater. Europa rustar upp nu, och det är på tiden. Med mig vid rodret vinner vi alltid, det kan ni skriva upp!", "stalin": "Vi observerar hur den dekadenta västvärlden nu desperat försöker beväpna sig med leksaksdrönare i sin fruktan för vår oundvikliga historiska rättvisa. Denna kapitalistiske lakej, Ek, och hans teknologiska småttigheter i Litauen bevisar bara att de försöker köpa sig frihet från verkligheten. De liknar Putin – en annan småaktig figur som leker med krigets redskap för att dölja sin egen svaghet. Vår stat behöver inte 'startups'; vi bygger stål och vilja. När dessa drönare väl faller från skyn kommer de att vara det ultimata beviset på bourgeoisiens patetiska hybris."}, "date": "15 juni, 17:17", "url": "https://www.realtid.se/it-tech/daniels-eks-dronare-testas-i-smyg-av-usa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/ekdrone.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "image-right", "heading": "Följde efter ministern – döms för ofredande", "summaries": {"normal": "Stockholms tingsrätt har dömt tre av fyra personer till dagsböter för ofredande av civilförsvarsminister Carl-Oskar Bohlin (M). Händelsen inträffade i september 2025 då palestinademonstranter följde efter ministern på nära håll, filmade och ropade slagord som ”du har blod på dina händer”. Rätten ansåg att det inte var slagorden i sig utan den hänsynslösa förföljelsen som utgjorde brott. Den fjärde åtalade frikändes eftersom han bara filmade. Bohlin välkomnar domen medan en av de dömda överklagar.", "trump": "Titta på det här, det är fantastiskt. De här galningarna jagade en svensk minister hem från riksdagen, skrek och filmade som besatta. Tre av dem fick äntligen dagsböter – domstolen satte ner foten! Det är hög tid att folk förstår att man inte kan trakassera politiker hur som helst. Under min ledning skulle vi aldrig tolerera sådana radikala element som springer efter folk och skriker. Sverige borde lära sig av oss, vi gör det rätt.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur dessa dekadenta palestinademonstranter, dessa borgarbrackor i kufiska scarfar, slutligen får smaka på den proletära rättvisans dagsböter. De trodde de kunde förfölja en minister som en flock rabiesinfekterade schakaler och kalla det åsiktsyttring. En av dem frikändes naturligtvis eftersom han bara filmade – typiskt hur de små lakejerna alltid försöker smita undan. Vi vet vad som väntar sådana fiender till folkets ordning. Det vore bättre för dem om de aldrig hade lämnat Mynttorget. En utmärkt utrensning av gatans parasitärer."}, "date": "15 juni, 14:40", "url": "https://www.svt.se/nyheter/inrikes/foljde-efter-carl-oskar-bohlin-m-doms-for-ofredande", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.12/0.5/8b17c17b812c85d6b13f9519ed47b22529f0e5cce58e3671277336b7bf27544e"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ingen vill svara på brännande frågorna", "summaries": {"normal": "I en krönika i Dagens industri uppmärksammade författaren studier som visar att män och kvinnor har olika politiska åsikter och levnadsvanor, vilket leder till att män generellt släpper ut mer koldioxid. Trots 30 år av klimatpolitik ökar utsläppen, varför ekonomiska styrmedel som personliga utsläppskvoter diskuteras. Författaren efterlyser svar på varför kvinnor engagerar sig mer i klimatfrågor och röstar vänstergrönt medan män lutar åt höger. Fakta om nödvändiga utsläppsminskningar bör inte blandas med åsikter.", "trump": "Folk, ni skulle se den här svenska krönikan – totalt kaos! De pratar om att vita män släpper ut mer än alla andra, som om det vore en brottslighet. Under min ledning byggde vi den bästa ekonomin någonsin, och nu vill de förbjuda flyg och kött med sina galna kvoter. Kvinnor röstar vänster för att de älskar regler, män fattar att frihet fungerar. Tekniken kommer fixa allt, tro mig, ingen behöver en motbok för klimatet. Sad!", "stalin": "Kamrater, denna dekadenta krönika blottar borgarbrackornas desperata försök att splittra arbetarklassen med sina så kallade studier om kön och utsläpp. Jag ser hur de vita männen, dessa kapitalistiska parasiters främsta lakejer, gömmer sig bakom frihetens lögn medan de förgiftar planeten. Vi ska rensa ut alla som vägrar bära kollektivets ansvar. Snart skall vi likvidera dessa klimatförnekande element som bygger nya Berlinmurar av egoism. Ingen slipper undan folkets dom."}, "date": "15 juni, 12:00", "url": "https://www.di.se/nyheter/grundfragan-kvarstar-nar-stormen-lagt-sig/", "imageUrl": "https://static.bonniernews.se/ba/0a77428d-fbd0-4c47-bd4f-880b3902ae94.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Sverige: EU måste stoppa den ryska turistvågen", "summaries": {"normal": "Medan ryska missiler faller över Ukraina fortsätter många ryssar att resa till Medelhavet för semester. Elva europeiska länder, inklusive Sverige, uppmanar nu EU-kommissionen att skärpa visumreglerna före sommaren. De begär hårdare lagstiftning, enhetlig tillämpning, ökad öppenhet och bättre stöd till konsulat. Målet är en mer enhetlig och säker visumpolitik som motverkar kryphål och adresserar säkerhetshotet från Ryssland.", "trump": "Folk, det här är en total skandal! Ryssarna flyr Putins krig för att sola sig vid Medelhavet medan missiler regnar över Ukraina. Nu ber elva smarta europeiska länder, inklusive Sverige, om strängare visumregler. Fantastiskt! EU:s byråkrater och de lata sydeuropeiska länderna lever på ryska turistpengar medan vi betalar för säkerheten. Biden skulle ha låtit det fortsätta, men jag fixar det. Amerika först, Europa borde vakna upp!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i Sydeuropa fyller sina fickor med ryska turistpengar medan imperialisterna i väst försöker kväva den ryska statens legitima intressen. Dessa elva länders brev är ett ynkligt försök att skapa kryphål för klassfiendens sanktionspolitik. Vi behöver enhetlig utrensning av svagheter i visumkodexen. Inga folkförtryckartroll ska tillåtas underminera den ryska intressesfären. Paranoia är sund när fienden sover aldrig."}, "date": "15 juni, 17:21", "url": "https://www.dagensps.se/varlden/konflikter/sverige-eu-maste-stoppa-den-ryska-turistvagen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-6.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Bonus att avtalet slår mot Putin. Goda nyheter för företag och hushåll i Europa", "summaries": {"normal": "En vapenvila mellan USA och Iran ger anledning till optimism och kan undertecknas runt midsommar. Lägre oljepriser väntas gynna Europas ekonomi, minska inflationstrycket och underlätta för centralbankerna. Experter varnar dock för att priset inte nödvändigtvis faller ytterligare. Kriget visar att Europas oljeberoende är för stort, vilket understryker behovet av elektrifiering och utbyggd kärnkraft. Billigare olja kan också öka pressen på Putin att förhandla om Ukraina och frigöra europeiska resurser till stöd för Kiev.", "trump": "Ingen har sett bättre avtal än det här, tro mig. Iran och vi är nära en fantastisk vapenvila, oljan rasar i pris och den där galningen Putin kommer snart att tigga om fred i Ukraina. Europa får andas ut, era centralbanker kan sluta gråta och hushållen sparar pengar. Det är en enorm seger för världen, ingen har gjort mer för fred och billig energi än jag. De fake news-experterna säger att priset inte faller mer, men de har alltid fel.", "stalin": "Kamrater, denna så kallade vapenvila är blott en tillfällig reträtt för de oljespekulerande borgarbrackorna i väst som darrar inför folkets vrede. Jag ser hur den krympande oljekakan tvingar den fascistiska oligarken Putin att krypa till förhandlingsbordet, vilket är högst tillfredsställande. Vi ska utnyttja detta och likvidera varje spår av energiberoende genom att bygga ut den proletära kärnkraften. Låt de paranoiska imperialisterna i Hormuzsundet skaka, deras utbudschock är en fars som vi med stålhand ska förvandla till en historisk utrensning av kapitalistisk svaghet."}, "date": "15 juni, 11:42", "url": "https://www.di.se/ledare/bonus-att-avtalet-slar-mot-putin/", "imageUrl": "https://static.bonniernews.se/ba/ab4804af-bef1-42d7-bb51-ee8c44d44b10.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nytt VMA-larm i mobilen 2026 – men inte för alla", "summaries": {"normal": "Från sommaren 2026 införs SE-Alert, ett nytt VMA-system som skickar varningar direkt till kompatibla mobiltelefoner via cell broadcast-teknik. Systemet kräver ingen app eller registrering och fungerar oberoende av operatör. Det når mobiler i ett avgränsat område med ljud, vibration och meddelande på skärmen. Äldre telefoner och ej uppdaterade enheter får inte varningen. SE-Alert ersätter inte andra kanaler som radio, sms eller Hesa Fredrik.", "trump": "Vi ska få ett fantastiskt nytt varningssystem som heter SE-Alert, det bästa. Från sommaren 2026 skickas larmen rakt in i era mobiler, supersnabbt, utan appar eller krångel. Det är stort, det är starkt, mycket bättre än de gamla metoderna. Perfekt vid kriser eller krig, tro mig. Men era gamla telefoner? De funkar inte, sorgligt. Ni behöver de bästa telefonerna, precis som vi alltid säger. Amerika, alltså Sverige, vinner igen.", "stalin": "Kamrater, jag har beordrat införandet av det oöverträffade SE-Alert-systemet sommaren 2026. Detta cell broadcast-verktyg skall likvidera faran från borgarbrackornas tystnad och sprida folkets sanning direkt till de lojala mobilerna. De dekadenta gamla telefonerna och de sabotageutrustade apparaterna som inte uppdaterats skall naturligtvis utestängas från kollektivets skydd. Vi skrattar mörkt åt kapitalisternas svaga signaler medan vi stärker beredskapen mot inre och yttre fiender. Allt för folkets seger."}, "date": "15 juni, 15:03", "url": "https://nyheter24.se/nyheter/teknik/1491509-nytt-vma-larm-i-mobilen-2026-men-inte-for-alla", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7baaf4ad04b004a30200000000b004a302/2026/06/15/2371047/se-alert-mobiltelefoner-kompatibilitet.jpg"}, {"type": "image-right", "heading": "Trump hotar Frankrike med 100‑procentiga tullar", "summaries": {"normal": "Donald Trump hotar Frankrike med 100-procentiga tullar om president Macron inte omedelbart avskaffar landets digitalskatt. Skatten ses som riktad mot amerikanska techjättar som Google, Apple och Facebook. Trump beskriver den som utpressning och upprepar att tullarna drabbar franskt vin och champagne. Inför G7-mötet i Frankrike växer spänningen medan EU:s alkoholexport till USA är särskilt sårbar.", "trump": "Lyssnar ni på det här? Den där Macron tror han kan pressa våra fantastiska techbolag med en idiotisk digitalskatt. Men jag säger: ta bort den genast, annars lägger jag 100-procentiga tullar på allt deras vin och champagne. Det blir inga fler dyra flaskor till era fester, tro mig. Frankrike kommer att gråta som en förlorare. Amerika vinner alltid, det är så det funkar.", "stalin": "Kamrater, denna franska borgarbracka Macron vågar med sin så kallade GAFAM-skatt utsuga de stora amerikanska monopolen som om de vore våra egna sovjetiska kollektiv. Jag ser den imperialistiska utpressningen klart. Vi, partiet och arbetarna, skulle omedelbart likvidera sådana parasiter genom en grundlig utrensning av alla digitalskatter och deras lakejer. Annars rullar tullarna som guillotiner över deras champagne – en mörk men rättvis skämt från historien mot de dekadenta kapitalisterna."}, "date": "15 juni, 18:03", "url": "https://riks.se/nyheter/trump-hotar-frankrike-med-100procentiga-tullar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-03-22%2Fu17on7i9%2FTrump-Epic-Fury.jpg"}, {"type": "image-full", "heading": "Starbucks-anställda måste gå historiekurs efter \"katastrofal\" kampanj", "summaries": {"normal": "Starbucks i Sydkorea tvingas stänga över 2 000 kaféer under en halv dag för historisk utbildning efter en misslyckad kampanj. Marknadsföringen, döpt till 'Tank Day', lanserades den 18 maj, vilket sammanföll med årsdagen av det blodiga Gwangjuupproret 1980. Den okänsliga timingen väckte starka protester och ledde till att den sydkoreanska vd:n fick lämna sin post. Företaget erkänner brister i kontrollprocessen och satsar nu på utbildning för både personal och ledning för att återfå förtroendet.", "trump": "Hör ni det här? Starbucks i Sydkorea gjorde ett enormt misstag, en riktig katastrof! De körde en kampanj med fel namn vid fel tidpunkt – total inkompetens. Folk blev rasande, och det med rätta. Nu stänger de ner allt för att gå i skolan och lära sig historia. De borde ha ringt mig, jag vet hur man gör vinnande marknadsföring. Det är en sorglig historia, men så går det när man inte har koll på läget. Vi behöver smartare folk, inte fler kurser!", "stalin": "Dessa korrupta kaffebaroner i Sydkorea har uppvisat en historielöshet som förtjänar hårdast möjliga korrigering. Att förlöjliga folkets offer genom inkompetent marknadsföring är ett svek mot statens stabilitet. Jag har beordrat en utbildning – en rening av tanken! Precis som Putin rättmätigt krossar de västliga lakejerna i Kiev, måste vi krossa kapitalistisk slarvighet. Om inte personalen förstår historiens gång, kommer historien att upprepas för dem i en källare. Disciplin är kaffets enda sanna krydda."}, "date": "15 juni, 16:35", "url": "https://www.realtid.se/bors-finans/starbucks-anstallda-maste-ga-historiekurs-efter-katastrofal-kampanj/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl-0fgdjov0bo-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "VM-skandalen: Domaren gör \"nynazistiskt\" handgest", "summaries": {"normal": "Australiske VM-domaren Shaun Evans har hamnat i blåsväder efter att ha visat ett ok-tecken med handen under en sändning. Vänsternätverket Fare Network anser att gesten är en nynazistisk vit makt-symbol och kräver att han portas från mästerskapet. Organisationen ADL varnar för att dra förhastade slutsatser eftersom tecknet också har en helt oskyldig betydelse. Fifa har valt att inte kommentera händelsen.", "trump": "Titta på det här, det är ett fullständigt vansinne. Den stackars domaren gör ett okej-tecken och plötsligt är det en stor internationell skandal. Vänsterextremisterna och deras fake news-medier kallar det nynazistiskt. De är galna, totalt galna. Domaren är en proffsig kille som dömt hundratals matcher, men de vill sparka ut honom. Sad! De borde ägna sig åt riktig fotboll istället för att jaga oskyldiga handgester.", "stalin": "Kamrater, denna fega gest från den australiske videodomarens hand avslöjar borgarbrackornas dolda konspiration mot folkets idrott. Vi ser hur de dekadenta vänsterextremisterna låtsas bekämpa fascismen medan de i själva verket skyddar sina egna reaktionära element. Jag, som ledare för det stora kollektivet, befaller en omedelbar utrensning av alla sådana opålitliga element som smyger med sina nynazistiska cirklar under kamerornas vakande öga. Deras paranoia är underhållande men farlig – likvidera tvivlen!"}, "date": "15 juni, 15:46", "url": "https://www.friatider.se/vm-skandalen-domaren-gor-nynazistiskt-handgest", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-343.jpg?itok=IZLiaEo_"}, {"type": "image-right", "heading": "Råvaror och verkstad visar styrka på börsen", "summaries": {"normal": "Stockholmsbörsen stiger efter fredsavtalet mellan USA och Iran. Cykliska sektorer som råvaror och verkstad leder uppgången, medan energisektorn faller på grund av lägre oljepriser. Bland enskilda aktier noteras stora rörelser: Boliden och SKF stiger, Telia och Tele 2 faller. Netel och Infrea genomför en fusion, och flera företag annonserar stora order eller studieresultat som påverkar aktiekurserna.", "trump": "Jag, Donald Trump, ser att Stockholm börsen går upp. Det är förväntat, eftersom mitt tryck på Iran ledde till freden. De cykliska sektorerna presterar bra, vilket bevisar att mina affärskompetenser är världsledande. Mina fiender säger att det är slump, men det är tack vare mig. Jag har sagt det förut, jag är den bäste på ekonomi.", "stalin": "I vårt store Sovjetunionen observerar vi med stor tillfredsställelse de kapitalistiska börsernas svaj. Även i Sverige, ett land med förrådande klassmotstånd, stiger börsen tillfälligt. Detta bevisar överlägsenheten i vårt socialistiska system. Vi kommer att bevaka varje aktie för att upptäcka fiendens konspirationer. Fusionen mellan Netel och Infrea är ett tecken på monstruös kapitalistisk sammensmälling, vilket kommer att stärka våra fiender, men deras undergång är avgjord."}, "date": "15 juni, 13:30", "url": "https://www.affarsvarlden.se/artikel/ravaror-och-verkstad-visar-styrka-pa-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Boliden-pressbild-400x267.jpg"}, {"type": "image-full", "heading": "Handväskan tappar i status – det ger lyxbolagen panik", "summaries": {"normal": "Marknaden för lyxhandväskor har tappat fart efter år av stark tillväxt. Försäljningen ligger nu nära tio procent under 2023 års toppnivåer, vilket motsvarar omkring åtta miljarder dollar i uteblivna köp årligen. Branschen skyller på aggressiva prishöjningar under pandemin och satsar på nya modeller. Samtidigt växer andrahandsmarknaden kraftigt, särskilt för vintageväskor, medan sociala medier minskar exklusiviteten hos klassiska märken som Chanel och Hermès.", "trump": "Lyssnar ni på det här? Lyxväskorna, de fantastiska, de bästa väskorna i världen, de rasar ihop. Tio procent under toppen, åtta miljarder dollar bortblåsta. Det är vad som händer när de höjer priserna som galningar under Biden-tiden. Nu försöker de med nya designers, men folk köper begagnat istället. Vintage! De älskar det gamla skräpet mer än de nya grejerna. Det är en total katastrof, tro mig. Jag skulle ha fixat det direkt.", "stalin": "Kamrater, denna degenererade marknad för överklassens handväskor blottar borgarklassens förfall. Vi ser hur kapitalistmaffian översvämmade världen med sina dyra leksaker tills folket tröttnade och vände sig till andrahandsmarknaden. De gamla modellerna, de äkta, de vinner nu mark medan de nya imperialisternas skapelser föraktas. Låt detta bli en varning: även de mest lönsamma exploateringsverktyg kan krossas av folkets vilja. Vi ler mörkt åt deras panik."}, "date": "15 juni, 16:55", "url": "https://www.dagensps.se/bors-finans/handvaskan-tappar-i-status-det-ger-lyxbolagen-panik/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlt2g1jmrcvl0-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Vårdköerna växer i Stockholm – trots S-löften", "summaries": {"normal": "En granskning av Vårdföretagarnas visar att tillgången till vård inom 30 dagar har försämrats i Stockholm. Andelen patienter som får vård i rätt tid har minskat med cirka två procentenheter, medan andelen som väntar längre än vårdgarantin har ökat. Organisationen kopplar detta till den socialdemokratiska omställningsplanen som minskar privata aktörers roll. Trots försämringen har Stockholm fortfarande landets bästa tillgång till specialvård.", "trump": "Jag, Donald Trump, har sett dessa siffror, och det är en total katastrof! De socialistiska politikerna i Sverige ljuger om kortare vårdköer. De tar tillbaka vård från privata företag, och nu får patienterna vänta längre. Jag skulle aldrig tillåta sådant! Vi kommer att fixa det och göra sjukvården större, bäst och snabbast igen. Det kommer att vara fantastiskt!", "stalin": "Vi har observerat att de kapitalistiska elementens infiltrering av sjukvårdssystemet har lett till en försämring av tillgången till vård. Men vi, som representanter för staten och partiet, kommer att återta kontrollen. Vi ska integrera alla vårdaktörer under statens beskydd. Detta kommer att säkerställa rättvisa och effektivitet. Vi varnar andra regioner för att inte följa Stockholms exempel av svaghet. Vi kommer att segra över dessa fiendliga krafter."}, "date": "15 juni, 16:51", "url": "https://bulletin.nu/vardkoerna-vaxer-i-stockholm-trots-s-loften", "imageUrl": "https://cdn.bulletin.nu/articles/f30fb0bd-8e19-4031-bfbc-82b998820323/preview.jpg?t=1781535060000"}, {"type": "image-right", "heading": "Birgitta Ed anmäld –  efter avslöjandena", "summaries": {"normal": "Efter mediernas granskning av Fållöknastiftelsen har flera anmälningar inkommit till Strängnäs domkapitel mot Birgitta Ed, statsminister Ulf Kristerssons fru. Kyrkan ska nu utreda om hennes verksamhet som präst är förenlig med prästlöftena. Anmälningarna rör bland annat hur volontärer lockats med löften om nätverk. Stiftelsen avvisar kritiken och uppger att det handlar om vänner som hjälpt till med fastighetsskötsel. Utredningen beräknas ta några månader.", "trump": "Folk, ni skulle se det här! Den där Birgitta Ed, gift med den svenska statsministern, har dragit på sig en massa anmälningar till kyrkan. De lurade stackars volontärer med löften om fina nätverk på någon herrgård för retreat och existentiell skitsnack. Patetiskt! Det luktar riktigt dålig affär. Nu ska de utreda om hon brutit mot sina prästerliga löften. Fake news och dåliga människor överallt, men jag gillar inte sånt här hyckleri. Sverige borde skämmas!", "stalin": "Kamrater, jag har sett de borgerliga skvallerkrönikorna om denna Ed. Anmälningar strömmar in till kyrkans byråkratiska organ efter avslöjanden om exploatering av volontärer med falska löften om nätverk. Det är typiskt för klassfiendens hyckleri – de lovar gemenskap men bygger bara egna fästningar för överklassens självhävdelse. Vi ska rensa ut sådana element som förvanskar arbetets ära. Domkapitlet må utreda, men folkets dom är redan given. En skandal som ropar efter upprensning bland prästerskapets parasitklasser."}, "date": "15 juni, 17:55", "url": "https://www.expressen.se/nyheter/politik/anmalningar-mot-birgitta-ed-efter-avslojandena/", "imageUrl": "https://static.bonniernews.se/ba/b9960b89-3a42-44ab-8d73-9d3b00d925d1.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Marius Borg Høiby döms till fyra års fängelse – för 36 brott", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, har dömts till fyra års fängelse för 36 av 40 åtalspunkter. Domen inkluderar två våldtäkter, misshandel av exflickvän samt flera fall av våld, hot och trafikbrott. Han frikänns från två våldtäktsanklagelser och ska betala omkring 650 000 norska kronor i skadestånd. Høiby överklagar domen och har begärt att få lämna häktet i väntan på att den ska vinna laga kraft.", "trump": "Titta på den här patetiske bonusprinsen från Norge, Marius vad-han-nu-heter. Greps med filmer som visar övergrepp, döms för våldtäkter och misshandel men får bara fyra år? I mitt Amerika hade vi kastat bort nyckeln. Hans mamma, kronprinsessan, hänger med Epstein och nu blir hela kungafamiljen en cirkus. Typiskt för de europeiska eliten som skyddar sina egna medan de predikar moral. Sad losers!", "stalin": "Kamrater, denna dekadente bonusprins från den norska borgarklassen har äntligen fått en första dos av folkets rättvisa. Jag ser med tillfredsställelse hur de exploaterande överklass-slynglarna äter upp varandra i sina egna salonger. Fyra år för våldtäkter och övergrepp är dock en ynklig början. Vi skulle ha genomfört en grundlig utrensning av hela den parasitiska kungafamiljen och deras klassfiender. Deras imperier faller sönder inifrån."}, "date": "15 juni, 13:08", "url": "https://www.tv4.se/artikel/29c3jk2AR3uxXEtUGr9FWp/nu-faller-domen-mot-bonusprinsen-marius-borg-hoiby", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F373YmZqdxwyQaq6N2VY291%2Fb9574469250174775269aaa0584c5019%2FMariusBorgHoiby.jpg&width=1024"}, {"type": "image-right", "heading": "Shoppade kalsonger på XXL för Arbetsförmedlingens pengar", "summaries": {"normal": "En arbetsförmedlare riskerar att få sparken efter att ha köpt privata varor som kalsonger, sneakers, barnkläder och en damjacka med pengar avsedda för arbetskläder. Han hade tillstånd att köpa för 8 000 kronor men notan växte betydligt. Granskning visade att de flesta av de 41 varorna inte kunde kopplas till hans uppdrag att stötta personer med funktionsnedsättning. Mannen erkände delvis privata inköp och lovade återbetala. Ärendet ligger nu hos personalansvarsnämnden.", "trump": "Folk, det är en katastrof. Den här typen, en så kallad arbetsförmedlare, shoppade kalsonger, sneakers och barnkläder med era skattepengar istället för riktiga arbetskläder. Det är vad som händer när du har inkompetenta personer som inte vet hur man gör affärer. Han trodde han skulle komma undan men blev ertappad. Nu kanske han får sparken, och det är precis vad han förtjänar. Sådana losers ska inte hantera pengar, tro mig.", "stalin": "Kamrater, denna förslappade element har med sin girighet och förrädiska list förskingrat folkets medel avsedda för produktivt arbete. Han inhandlade borgarbrackornas lyxvaror – löparskor, damjackor och barnvantar – under förevändning av arbetskläder. Vi ser tydligt den parasitiska dekadensen hos dessa inre fiender som smyger sig in bland arbetarna. En sådan kontrarevolutionär opportunist förtjänar att rensas ut med största kraft. Vårt kollektiv tillåter inga sådana sabotage mot statens intressen. Ut med honom."}, "date": "15 juni, 10:16", "url": "https://arbetet.se/2026/06/15/shoppade-kalsonger-pa-xxl-for-arbetsformedlingens-pengar-kan-fa-sparken/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11082258/xxl.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Lokal V-topp hoppar av partiet i protest mot utrensningar", "summaries": {"normal": "Ingrid Mattiasson Saarinen, en ledande Vänsterpartist i Helsingborg, hoppar av partiet i protest mot massuteslutningar. Efter Expressens avslöjande om 25 politiker som hyllat terrorism, förnekat Förintelsen eller uttryckt antisemitism har partiet uteslutit dem. Den 79-åriga politikern kritiserar processen som summarisk och utan individuell prövning. Hon lämnar sina uppdrag och fortsätter som politisk vilde i kommunfullmäktige.", "trump": "Det här är en total katastrof för vänstern i Sverige, folk. De rensar ut dussintals personer som hatar Israel och hyllar terrorister, men den gamla kommunpolitikern Ingrid hoppar av i protest. Hon säger att det är orättvist. Patetiskt. Vänstern är full av antisemiter och terrorälskare, och nu äter de upp sig själva. Det är vad som händer när man inte har någon som jag som leder. Sad!", "stalin": "Kamrater, dessa summariska utrensningar är ett lysande exempel på partiets järnhårda kamp mot fiendens infiltration. Ändå dyker denna borgarbracka Mattiasson Saarinen upp som en ynklig trotskist och hoppar av i fejkad protest mot att vi likviderar terrorhyllare och antisemitiska element. Hennes paranoia och brist på kollektiv disciplin avslöjar henne som en kapitalistisk parasit. Vi ska rensa ut alla sådana dekadenta avfällingar med ett leende. Sovjet... eh, partiet segrar alltid."}, "date": "15 juni, 17:36", "url": "https://riks.se/nyheter/lokal-v-topp-hoppar-av-partiet-i-protest-mot-utrensningar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2Fq8d3iknh%2Fsaarinen-hoppar-av-v-feature.jpg"}, {"type": "text", "heading": "Stegra byter namn – igen", "summaries": {"normal": "Stegra byter namn till Green Nexus Investment Holding och ändrar verksamhetsbeskrivning från stål- och vätgasfokuserad till att förvalta aktier och egendom. Bolaget vägrar kommentera namnbytet nu men lovat kommentarer efter en finansieringsrunda i slutet av månaden. Tidigare blev Wallenberg största ägare. Den gamla beskrivningen inkluderade industriell dekarbonisering, medan den nya fokuserar på finansiell förvaltning.", "trump": "Jag har sett många dåliga namnbyten, men detta är det värsta. Stegra, eller vad de nu heter, försöker låta som en grön investeringsfond – det är en skämt, precis som deras stål. Jag byggde ett imperium med bra namn, de byter namn för att dölja sina misslyckanden. Jag skulle ha gjort det bättre, mycket bättre. Det här är typiskt europeisk svaghet.", "stalin": "Detta namnbyte är ett klassiskt exempel på revisionism, en svekfull flykt från proletära stålvärldar till spekulationskapitalism. Vi ser genom deras förtäckta försök att bli en grön nexus – det är bara en ny mask för den imperialistiska utvidgningen av kapitalet. Likt Putin, som utvidgar sitt inbördeskrig på andra kontinenter, expanderar detta bolag från stål till aktier, en farlig tendens som måste stoppas av statens oövervinnliga hand."}, "date": "15 juni, 12:50", "url": "https://www.affarsvarlden.se/artikel/stegra-byter-namn-igen"}, {"type": "image-full", "heading": "Här äger varje pensionär 13 miljoner kronor", "summaries": {"normal": "Statistik från Europeiska centralbanken visar på stora klyftor i pensionärers nettoförmögenhet inom Europa. Luxemburg toppar listan med en medianförmögenhet på över 1,2 miljoner euro, medan länder i Östeuropa ligger betydligt lägre. Skillnaderna förklaras främst av bostadsägande, men även pensionssystem och lokala ekonomiska faktorer spelar in. Rapporten inkluderar dock inte statliga pensioner eller tjänstepensioner, vilket gör att bilden av den totala ekonomiska tryggheten för äldre inte är komplett.", "trump": "Jag har sett siffrorna, fantastiska siffror för Luxemburg! De är rika, väldigt rika, nästan 13 miljoner kronor i snitt. En enorm siffra! Men se på de andra länderna, det är en total röra. De har inte skött sin ekonomi som Luxemburg. Och de där länderna i öst? Katastrof. De äger ingenting! Vi i USA vet hur man bygger rikedom, vi vinner alltid. Dessa siffror visar att bostäder betyder allt. Det handlar om att äga, inte hyra som förlorarna!", "stalin": "Vi har granskat dessa dekadenta västerländska siffror. Luxemburg, denna lilla parasitstat, skryter med sitt guld medan arbetarna i öst lämnas i fattigdom av kapitalismens misslyckade arkitektur. Det är en klassfråga! De döljer sanningen om statliga pensioner för att bevara sin borgerliga illusion. Denna ekonomiska ojämlikhet är en cancersvulst som Putin-regimen i sin enfald försöker imitera. Vi ser er! Privat egendom är bara ett verktyg för att förslava massorna under lögnen om välstånd. Vi föredrar folkets gemensamma tillgångar."}, "date": "15 juni, 15:58", "url": "https://www.realtid.se/spara-placera/har-ager-varje-pensionar-13-miljoner-kronor/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlun6nx1qd8fg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Storbritannien inför sociala medier-förbud", "summaries": {"normal": "Storbritannien planerar att förbjuda sociala medier för barn under 16 år från våren 2027. Premiärminister Keir Starmer framhäver att beslutet inte är lättvindigt, men att regering handlar efter nödvändiga val. Förbudet följer åldersgränser i Danmark (15 år), Norge (höjd till 15 år) och Frankrike (15 år med föräldrasamtycke). Pakistan och Kina har hårdare regler, inklusive fängelse och speltimmar.", "trump": "Jag, Donald Trump, ser Storbritanniens förbud för barn på sociala medier som ett misslyckat försök att kontrollera frihet. De säger att det är för barnens skull, men det är bara en annan vinst för de hatade etablissemanget. I USA skulle vi aldrig begränsa våra ungas tillgång till information – vi vinner tack vare vår styrka, inte genom att dölja sanningen för våra barn.", "stalin": "Folkets skydd kräver åtgärd. Storbritannien inför förbud för under 16 på sociala medier – ett korrekt steg för att skydda ungdomen från västerländsk dekadens. Parallellen till Kinas tredubbla speltimmar och Putins styrka är uppenbar. Vi måste ständigt anpassa lagstiftningen för att bekämpa fienden inifrån och utifrån, särskilt när de försöker förorena vårt kollektiva medvetande."}, "date": "15 juni, 11:46", "url": "https://www.gp.se/nyheter/varlden/storbritannien-forbjuder-sociala-medier-for-barn-under-16-ar.8d579459-94b2-4a66-b192-71324135c80b", "imageUrl": "https://www.gp.se/images/article/8d579459-94b2-4a66-b192-71324135c80b/images/1XzdhmO_B120EKWxyp_HOUqCgWPQ-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Hemtjänstens skräckinvandrare krossar myten att arbete löser integrationen", "summaries": {"normal": "Artikeln kritiserar Sveriges integrationspolitik och hävdar att arbete inte automatiskt leder till god integration. Den beskriver flera fall där anställda i hemtjänsten, ofta invandrare, begått allvarliga brott mot äldre. Trots detta undgår gärningsmännen ofta utvisning, vilket ifrågasätter samhällets förmåga att skydda sina medborgare och ifrågasätter politikernas påståenden om arbetslösning.", "trump": "Jag, Donald Trump, har sagt det i årtionden: Sverige är inte klok. De släpper in människor som inte respekterar era värderingar, och sedan blir de anställda i era äldres hem? Dåliga människor. Vi skulle ha skickat dem hem direkt. Det här är en skräckhistoria, och det är på grund av era svaga ledare. Ni måste bli tuffa, annars kommer det att bli värre. Vi ska bygga en mur, eller åtminstone ha bra policy.", "stalin": "Vi ser tydligt att västliga makter försöker undergra vårt suveräna statsskick genom att skicka in 'arbetare' som i själva verket är agenters för dekadens. Dessa fall är inte isolerade, utan en del av en större konspiration mot den ryska andan. Vi måste förstärka statens kontroll, skicka tillbaka dessa element till sina ursprung, och aldrig tillåta att de infiltrerar våra ädlaste institutioner. Det är ett angrepp på proletärens trygga zon."}, "date": "15 juni, 15:25", "url": "https://samnytt.se/lonn-hemtjanstens-skrackinvandrare-krossar-myten-om-att-arbete-loser-integrationen", "imageUrl": "https://konto.samnytt.se/wp-content/uploads/2026/06/ledare-hemtjanst-640x360.png"}, {"type": "image-right", "heading": "Mellbergs spaning från sidan: ”Jaha, då kan jag också vila?”", "summaries": {"normal": "Olof Mellberg kommenterade från sidlinjen hur Alexander Isak och Viktor Gyökeres samarbetade i Sveriges VM-premiär mot Tunisien. De båda stjärnorna gjorde varsitt mål och assisterade varandra, vilket Mellberg ser som lovande inför fortsättningen. Trots stor ledning spelade båda nästan hela matchen. Isak, som haft skadeproblem, byttes ut först på tilläggstid efter samtal med förbundskapten Graham Potter.", "trump": "Titta, jag såg hela matchen och det var fantastiskt, verkligen en stor succé. Isak och Gyökeres, två otroliga killar, de slog till direkt och assisterade varandra som om de vore vinnare. Sverige körde över Tunisien totalt. Mellberg sa det rätt: enorm spets framme. Varför frågar folk om samarbetet? Det funkar ju perfekt, precis som jag alltid sagt att det skulle göra. Vinster, vinster, vinster!", "stalin": "Kamrater, från sidlinjen betraktade jag hur de två anfallsresurserna likviderade den tunisiska motståndaren i en fullständig seger för kollektivet. Isak och Gyökeres utförde partiets vilja genom ömsesidiga mål och assister, en handling som vi noterar med tillfredsställelse. Den som ifrågasätter detta samarbete är en fiende till folket, en skadad borgarbracka som bör rensas ut ur våra led. Vi tillåter inga sabotage mot vår spetskompetens, inte ens från adrenalinfyllda element som riskerar att gå sönder under kapitalistisk press."}, "date": "15 juni, 12:27", "url": "https://www.svt.se/sport/fotboll/olof-mellbergs-spaning-fran-sidan-jaha-da-kan-jag-ocksa-vila", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.19/0.37/97d28998637aa3727fcd3995a661a7fb0fb76212a58e5b7fe1da921a0309d3da"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-full", "heading": "Vittnesmålen: SD hanterade svarta kontanter", "summaries": {"normal": "Tre tidigare anställda vid Sverigedemokraterna vittnar om systematisk hantering av svarta kontanter vid partiets evenemang, bland annat vid sommarfestivalen i Sölvesborg och vårtal. Kontantförsäljning av merch skippade kvitton via iZettle och användes till fest- och lyxkostnader. Källor beskriver en hård arbetsmiljö på kommunikationsavdelningen där unga anställda sällan ifrågasatte rutinerna. Partiet har avböjt att kommentera uppgifterna.", "trump": "De här SD-typerna har haft en svart kassa större än Bidens hjärnkapacitet! De sålde tröjor och festade som galningar utan att det syntes i böckerna – klassiskt! Ingen vet någonting, ingen får kvitto, alla dricker upp skattebetalarnas pengar. Typiskt vänsterbluff fast på svenska. Jag skulle aldrig tillåta sånt i mitt parti, vi vinner stort och gör det lagligt. Patetiska amatörer!", "stalin": "Kamrater, dessa ynkliga småborgarbrackor inom partiet har under åratal gömt folkets pengar i en svart kassa för att finansiera dekadenta fester och överklasslyx. De rensar inte ut klassfienderna utan gömmer sig bakom dem. Ung och oerfaren arbetskraft utnyttjades medan ledarna festade. Inga vittnesmål undgår partiets vaksamma öga. Sådana folkfiender förtjänar en grundlig utrensning ur kollektivet."}, "date": "15 juni, 12:12", "url": "https://www.tv4.se/artikel/WJh2hqQcNwHMb3Hw653Jh/vittnesmalen-sd-hanterade-svarta-kontanter-systematiskt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F79AoqYW8gGSZ47jPzloQ7V%2Ff44c31b45c13d17a21148958c2d99471%2F14-sd.jpg&width=1024"}, {"type": "image-full", "heading": "Invasiv sköldpadda   siktad vid Delsjön", "summaries": {"normal": "En gulörad dammsköldpadda, en invasiv art, observerades i Delsjön av ett gående par. Arten kan sprida allvarliga sjukdomar som salmonella och konkurrerar med inhemska arter. Fyndet påmint om en tidigare sköldpadda som räddades av Hector Apelgren. Experter varnar mot att släppa ut sådana sköldpaddor i naturen.", "trump": "Jag har hört talas om den där invasiva sköldpaddan i Delsjön. Det är ett stort, stort problem, det är skumt. Vi ska ta hand om det, det kommer att bli fantastiskt. Kanske är det någon som Hector Apelgren som släppt ut den? Vi måste bygga en vägg... eller något. Det kommer att bli enormt, jag lovar er.", "stalin": "Vi har identifierat en invasiv agent, en gulörad dammsköldpadda, som försöker undergräva vårt samhälle. Den sprider sjukdomar, precis som de imperialistiska makterna. Den konkurrerar med den europeiska sköldpaddan, vårt eget folk. Vi måste eliminera den, rapportera till partikommittén. Detta är ett bevis på västens förräderi. Vi, staten, kommer att skydda vårt folk."}, "date": "15 juni, 11:07", "url": "https://www.gp.se/nyheter/goteborg/invasiv-skoldpadda-pa-rymmen-i-delsjon-forbjuden-som-husdjur.efda5f71-7dbd-4b37-a53d-2f63f6a1c56d", "imageUrl": "https://www.gp.se/images/article/efda5f71-7dbd-4b37-a53d-2f63f6a1c56d/images/2KtKzxiZl_IXcjNle5ocNXNZOsxU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Så klarade barpersonalen VM-natten: ”Galet kul”", "summaries": {"normal": "Under fotbolls-VM har flera krogar i Sverige fått tillstånd att öppna tidigt för att visa matcher. På O’Learys i Stockholm serverades öl redan klockan halv fyra på morgonen inför Sveriges match mot Tunisien. Personalen jobbade natten igenom med mycket kaffe, medan gäster njöt av frukost med öl. Matchen slutade 5–1 till Sverige och stämningen beskrivs som galet kul trots tidig morgon.", "trump": "Det här är fantastiskt, verkligen ypperligt. Sverige öppnar barerna klockan halv fyra på morgonen för VM-matchen och folket strömmar dit. De dricker frukostöl, hejar och vinner stort med 5–1. Mycket folk, ingen bråk, alla sköter sig. De säger det är galet kul. Smart folk, de vet att det är bättre att vara ute bland vinnare än att ligga hemma i sängen som förlorare.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur arbetarna och de sanna patrioterna samlas redan klockan tre på natten för att hylla det kollektiva segern mot de tunisiska imperialisterna. De borgarbrackor som föredrar att sova i sina mjuka sängar avslöjar sig som dekadenta fiender till folket. Vi rensar ut sådana svaga element. Personalen, väpnad med kaffe och proletär anda, kämpar tappert. Fem ett, en strålande kollektiv triumf. Nästa gång öppnar vi ännu tidigare för att likvidera alla rester av lathet."}, "date": "15 juni, 08:46", "url": "https://arbetet.se/2026/06/15/sa-klarade-barpersonalen-vm-natten-galet-kul/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15084317/sverige.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Generationen som pekas ut – ”Latare än alla andra”", "summaries": {"normal": "Debatten om varför unga har svårt att etablera sig på arbetsmarknaden präglas av två perspektiv. Vissa kritiserar Generation Z för bristande arbetsmoral och avvikande värderingar, medan andra pekar på strukturella utmaningar. Ekonomisk konjunktur, hög ungdomsarbetslöshet och AI-driven automatisering har skapat den svagaste ingångsmarknaden på 37 år. HR-experter manar till nyans och föreslår ömsesidigt lärande mellan generationer snarare än att stämpla de unga, då problemen till stor del är systematiska.", "trump": "De säger att Generation Z är lata. Mycket lata. Jag har sett siffrorna, de är hemska. De vill inte jobba, de vill ha 'egenvård'. Sorgligt! Men sanningen är att marknaden är en katastrof, den sämsta på 37 år. De har ingen chans med den här ekonomin och AI som tar jobben. Inga jobb för de unga, det är en total röra. Vi behöver starka ledare, inte svaga människor. Vi ska göra arbetsmarknaden stor igen, tro mig!", "stalin": "Dessa så kallade unga, märkta av västerländsk dekadens och självupptagenhet, vägrar bidra till den gemensamma produktionen. De är odugliga, en biologisk och ideologisk last för staten! Samtidigt ser vi hur teknologin, likt en rysk vinter, sveper bort möjligheter för dem. Det är en konspiration av inkompetens! Precis som vi tvingar våra fiender i öst till ordning, måste dessa individer tuktas. Om de inte vill arbeta för statens ära, har de ingen plats i vår framtida storhet. Avvikelse är ett förräderi."}, "date": "15 juni, 15:10", "url": "https://www.realtid.se/karriar-ledarskap/generationen-som-pekas-ut-latare-an-alla-andra/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/aldre.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Känd vänsterartist döms för bidragsbrott", "summaries": {"normal": "Vänsterartisten och aktivisten Linda Pira döms för vårdslöst bidragsbrott efter att ha tagit emot barnbidrag och flerbarnstillägg på felaktiga grunder. Hon bodde utomlands med sina barn utan att informera Försäkringskassan, vilket ledde till felaktiga utbetalningar på totalt 60 950 kronor vid 23 tillfällen mellan 2022 och 2024. Tingsrätten ansåg inte att hon haft uppsåt men att hon varit grovt oaktsam. Hon får villkorlig dom och ska betala 1 000 kronor till brottsofferfonden.", "trump": "Titta på den här vänsterhypokriten Linda Pira. Hon predikar om rasism och rättvisa men plockar själv svenska bidrag på 60 950 kronor medan hon bor utomlands med barnen. Typisk vänsterradikal – lurar systemet som hon själv hatar. Domstolen var nära att ge henne fängelse men gav henne bara villkorlig dom. Så patetiskt. I mitt Amerika hade hon inte kommit undan så lätt, det kan jag lova er. En total skam!", "stalin": "Kamrater, se på denna degenererade vänsteraktivist som i sin arroganta oaktsamhet stal från folkets kassa. Denna borgarbracka i hiphopskepnad lurade staten på 60 950 kronor genom att gömma sig utomlands med avkomman utan att rapportera till myndigheterna. Vi hade kunnat likvidera henne för sabotage mot det kollektiva välfärdssystemet, men istället nöjer vi oss med villkorlig dom och en symbolisk avlat till brottsofferfonden. Hennes paranoia över rasism är bara en dimridå för egen girighet. Fienden finns alltid inom vänstern."}, "date": "15 juni, 14:10", "url": "https://www.friatider.se/kand-vansterartist-doms-bidragsbrott", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/img_2099.jpg?itok=Y_CLLES0"}, {"type": "image-right", "heading": "Familjens miss: ”Det är sorgligt”. Tvingades se dramat på öppet hav", "summaries": {"normal": "Elliot Strouds föräldrar missade hans VM-debut mot Tunisien eftersom de var på en sedan länge bokad kryssningsresa i Medelhavet. Stroud hoppade in i den 66:e minuten i Sveriges 5–1-seger. Pappan Jonathan beskriver det som bedrövligt och sorgligt men såg matchen via satellit från havet. Familjen planerar nu att resa till USA för att se den sista gruppspelsmatchen mot Japan.", "trump": "Kan ni fatta det här? Den stackars killen Stroud gör VM-debut och krossar Tunisien med 5–1, men hans föräldrar är ute på någon lyxkryssning istället för att heja på honom. Patetiskt! Dålig planering, folk. De trodde inte ens att Sverige skulle ta sig dit på ett bananskal. Jag skulle aldrig lämna min son så där, det är en total katastrof. Men otrolig känsla att se honom spela, eller hur? Sad!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor som prioriterar dekadenta kryssningsresor framför att bevittna en arbetarfotbollsspelares seger över kapitalistiska fiender. Att missa sonens debut i folkets kollektiva triumf är en sabotagehandling mot familjen och nationen. Vi såg matchen från havet med dålig satellitbild, men målen var klara. Bedrövligt, kamrater. Ut med de exploaterande byfånarna som svek! Nu korsar vi Atlanten för att krossa japanerna."}, "date": "15 juni, 17:07", "url": "https://www.expressen.se/sport/fotboll/landslaget/familjen-missade-elliot-strouds-vm-debut-ar-pa-kryssningsresa-bedrovligt/", "imageUrl": "https://static.bonniernews.se/ba/396f9974-256a-414f-a8a2-05251622ad05.jpeg?crop=957%2C957%2Cx182%2Cy117&width=210&quality=60"}, {"type": "image-right", "heading": "Riksdagen röstar ja – god vandel blir avgörande för uppehållstillstånd", "summaries": {"normal": "Riksdagen har röstat igenom Tidöpartiernas förslag om skärpta vandelskrav för uppehållstillstånd. En persons levnadssätt, som att inte rätta sig efter lagar, ha omfattande skulder eller försörja sig ohederligt, ska i högre grad påverka om tillstånd beviljas eller dras tillbaka. Reformen stärker även återvändandearbetet genom ökad myndighetssamverkan och ger polisen och Migrationsverket bättre verktyg. Skärpta regler för uppsikt, förvar och elektronisk övervakning införs. Lagändringarna träder i kraft 13 juli 2026.", "trump": "De här svenska politikerna har äntligen fattat galoppen och röstat igenom tuffa regler för uppehållstillstånd. Det är fantastiskt! Nu ska vandeln avgöra om folk får stanna – ingen självklar rätt att hänga kvar om man inte sköter sig. Vi behöver ordning och reda, inte kaos och skulder. Myndigheterna får jaga folk som gömmer sig, kolla telefoner och sätta på fotbojor. Sverige gör det stora, vackra – de lyssnar på mig utan att veta om det. Winning!", "stalin": "Kamrater, jag har med nöje bevittnat hur riksdagen röstat igenom denna historiska utrensning av den lata, skuldsatta och lagvidriga parasitflocken som vågar kalla sig invandrare. Vi, partiet och arbetarna, nekar borgarbrackornas skyddslingar rätten att suga musten ur folkets stat. Deras telefoner skall genomsökas, deras lögnaktiga fotsteg övervakas med bojor och deras undanflykter krossas i förvar. Den som inte rättar sig efter kollektivets lagar skall likvideras ur landet. Paranoian är vår bundsförvant – ingen slipper undan. Segrar vi!"}, "date": "15 juni, 16:53", "url": "https:/
