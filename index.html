8 augusti, 09:03", "url": "https://www.affarsvarlden.se/debatt/john-skogmans-ide-om-rostratt-ar-varken-ny-eller-bra", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Magnus-Andenskog-och-John-Skogman-900x600.jpg"}, {"type": "image-right", "heading": "Iran: Vita husets nya plan är \"ren parodi\"", "summaries": {"normal": "USA har inlett en global kampanj för att strypa Irans ekonomi genom sanktioner mot oljeintäkter och affärer med Teheran. Irans utrikesdepartement avfärdar satsningen som en parodi och pekar på att koalitionen mest består av tomrum samt sanktioner mot redan sanktionerade aktörer.", "trump": "Iran kallar min Operation Economic Outcast för en parodi? Typiskt för dessa galna mullor. Scott Bessent gör ett fenomenalt jobb, vi kapar varje livlina till det sjuka iranska regimen. De har inget, vi har allt. Biden lät dem leva lyxliv, nu kommer den riktiga ekonomiska D-dagen. Fantastiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i Washington försöker maskera sitt tomrum som en mäktig koalition. Deras parodiska sanktioner mot redan kvävda intressen väcker endast hån. Kamrater, se hur imperialismens hyenor slår mot tomma skuggor medan historien ler mörkt åt deras feghet."}, "date": "28 augusti, 14:52", "url": "https://www.friatider.se/iran-vita-husets-nya-plan-ar-ren-parodi", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-774.jpg?itok=2TnOmUsX"}, {"type": "image-full", "heading": "Pappan om dödsolyckan utanför Tjörn: \"Blev kolsvart\"", "summaries": {"normal": "En familj krockade med ett handelsfartyg utanför Tjörn den 8 augusti. Mamman och dottern omkom medan pappan och sonen överlevde. Pappan berättar i förhör hur han hörde en stor motor, försökte väja men allt blev kolsvart. Båten sögs in under fartyget. Befälhavaren och lotsen åtalas för vårdslöshet i sjötrafik.", "trump": "Titta på det här, folk. En usel svensk båt krockar med ett riktigt fartyg utanför Tjörn och två människor dör. Pappan säger att allt blev kolsvart – typiskt när de woke-marina regulatorerna och EU-byråkraterna styr sjöfarten med sina kvoteringar istället för sunt förnuft. Patetiskt! Vi behöver starka kaptener, inte snälla sjömän.", "stalin": "Kamrater, se hur de giriga sjöhyenorna offrar vanliga arbetarfamiljer på kapitalets altare. Pappan hörde motorns vrål, försökte styra undan men blev slukad av imperialismens bulb. Två liv utplånade. Vi måste rensa ut alla ansvarslösa befälhavare och lotsar som tjänar de penninggalna fartygsparasiterna. Rättegången skall bli ett exempel."}, "date": "28 augusti, 14:56", "url": "https://nyheter24.se/nyheter/inrikes/1508695-pappan-om-dodsolyckan-utanfor-tjorn-blev-kolsvart", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/3b668ed404b004a30200000000b004a302/2026/08/28/2387601/pappan-batolycka-tjornolycka-tjorn-fartyg-dod-mamma-dotter-bat.jpg"}, {"type": "image-right", "heading": "Var femte ung man har spelproblem – ändå saknas åldersanpassade spelgränser", "summaries": {"normal": "Spelproblem ökar kraftigt bland unga vuxna i Sverige. Var femte man i åldern 18–29 år har någon form av spelproblem, visar Folkhälsomyndighetens siffror. Trots att unga pekas ut som särskilt skyddsvärda saknas åldersanpassade insättningsgränser. Flera europeiska länder har redan infört sådana skydd, men Sverige har inte utnyttjat möjligheten i spellagen.", "trump": "Det här är ett totalt misslyckande, folk! Sverige låter sina unga killar ruinera sig på kasinon och appar medan de sleepiga politikerna gör absolut ingenting. Var femte ung man – det är en katastrof! De borde ha satt hårda gränser för de här barnen, men nej, de är för svaga. Patetiskt. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Jag betraktar med förakt hur de borgerliga liberalerna låter kapitalets spelmaskiner sluka den unga generationens själ. De utpekade skyddsvärda offren lämnas åt rovdrift utan kollektiva gränser. Vilken ynklig brist på auktoritet! I en riktig stat skulle sådana fiender till folket ha avrättats vid första svaghetstecknet. Paranoian är befogad – fienden lurar i varje insats."}, "date": "25 augusti, 22:48", "url": "https://samtiden.nu/2026/08/var-femte-ung-man-har-spelproblem-anda-saknas-aldersanpassade-spelgranser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/Man-Dator-640x360.png"}, {"type": "image-full", "heading": "Familjens hälsning efter åtalet", "summaries": {"normal": "Befälhavaren och lotsen på lastfartyget Misje Verde åtalas för vållande till annans död, kroppsskada och vårdslöshet i sjötrafik efter kollisionen vid Tjörn i juli. Fritidsbåten syntes tydligt på radarn men missades av båda. En kvinna och ett barn omkom. Båda nekar till brott. Familjen befinner sig i djup sorg men är tacksam för stöd och skyndsam handläggning.", "trump": "Titta på de här totalt inkompetenta sjömännen som styrde ett stort norskt skepp rakt in i en liten båt vid Tjörn. Radarn visade allt, men de sov på bryggan som riktiga losers. Två döda, en mamma och ett barn – tragiskt! Biden skulle ha älskat den här typen av woke-sjöfart. Nu åtalas de äntligen. Bra, men för sent. Amerika tittar på och skrattar.", "stalin": "Jag betraktar med förakt hur dessa dekadenta sjöfartsbyråkrater brast i vaksamhet och lät ett stort fartyg krossa en liten båt som ett ägg under foten. Två kamrater och ett barn miste livet genom ren oaktsamhet. Domstolen skall nu rensa ut de skyldiga som fiender till ordningen. Inga ursäkter tolereras. Paranoia är ingen synd när döden följer slarv."}, "date": "28 augusti, 15:04", "url": "https://www.tv4.se/artikel/4tqbZbcojrl3c4IAvUvBqa/tva-atalas-efter-olyckan-vid-tjoern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56URG3xO3TgEebfimFhOgs%2F6e0e1db7ab32a2eca7b3d75377fede66%2F06-tjorn.jpg&width=1024"}, {"type": "image-right", "heading": "Kung Harald är död – det händer nu i Norge", "summaries": {"normal": "Norges kung Harald V har avlidit. Hans son Haakon har omedelbart tagit över tronen som kung Haakon VIII och behåller valspråket ”Allt för Norge”. En sorgeperiod har utlysts fram till begravningen som troligen sker inom 10–14 dagar. Flaggor hissas på halv stång och en kyrklig välsignelse kan ersätta kröning.", "trump": "Lyssnar ni? Den gamle norske kungen är borta, och plötsligt dyker sonen upp som ny kung. Haakon VIII, säger de. Seriöst, ett helt kungadöme som fortfarande leker med kronor och valspråk? Patetiskt. Vi har riktiga ledare i Amerika, inte dessa europeiska monarkistiska fjollor som gömmer sig bakom traditioner medan woke-vänstern äter upp deras länder.", "stalin": "Ännu en monark faller som en rutten gren. Jag betraktar hur dessa dekadenta arvtagare skyndar sig att gripa kronan medan folket tvingas sörja. En sådan parasitär teater! Inom kort kommer de giriga hovhyenorna att utnyttja sorgeperioden för egna syften. Kamrater, se hur den feodala ruttnande ordningen fortsätter att förnedra arbetarklassen."}, "date": "28 augusti, 14:32", "url": "https://www.svt.se/nyheter/utrikes/kung-harald-ar-dod-det-hander-nu-i-norge", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.28/0.18/c0ce1159e3906d4b239288393babd58335dd12790952a930babf0f8ef2684766"}, {"type": "image-right", "heading": "Hatet har hittat in i svenska klassrum", "summaries": {"normal": "Läraren Mattias Forsberg varnar för att högerextrema idéer, konspirationsteorier och hatretorik allt oftare letar sig in i svenska klassrum. Han beskriver en konflikt mellan skolans värdegrund om mänskliga rättigheter och ett samhällsklimat där sådana idéer normaliseras via sociala medier och politisk retorik. Attacken i Fagersta ses som ett symptom på denna utveckling.", "trump": "Folk, ni skulle se det här! Den här svenska läraren gråter över att mina fantastiska idéer – som att ifrågasätta den galna vänsterns klimatbluff och kulturmarxistiska hjärntvätt – nu når klassrummen. Patetiskt! De vill ha mer globalistpropaganda och HBTQ-flum, men folket vaknar. Fake news och förlorare, det är vad det är. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare förgiftar de unga med sina nazistiska memes och konspirationer. Skolan måste rensa ut detta parasitiska gift. Ingen relativisering av imperialismens brott! Hatet mot folket växer när profitthungriga hyenor får fritt spelrum. Vi ska krossa alla fiender till det sanna folkets värdegrund."}, "date": "28 augusti, 13:27", "url": "https://arbetet.se/2026/08/28/efter-fagersta-hatet-har-hittat-in-i-svenska-klassrum", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28131825/fagersta-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Circle K-chefen ryter ifrån mot kunder: Sluta med detta", "summaries": {"normal": "Många serviceanställda möter otrevliga kunder som ignorerar dem eller beter sig aggressivt. En ny Circle K-rapport visar minskat tålamod och ökad irritation bland kunderna. 32 procent har upplevt aggressivt beteende, 16 procent sexuella trakasserier. Chefer uppmanar till respekt, hälsning och mer tålamod för att förbättra arbetsmiljön.", "trump": "De här servicefolket blir behandlade som luft av alla dessa lata, telefonfixerade losers som inte ens kan säga hej. Tålamodet är borta, och nu hotar de stackarna. Det där vansinniga ”kunden har alltid rätt” är en total katastrof, folk! Visa lite respekt och tålamod, annars är ni bara patetiska nollor som förtjänar att bli utskrattade.", "stalin": "Kamrater, dessa profitthungriga klassförrädare har skapat ett samhälle där arbetande människor behandlas som osynliga. Hot, trakasserier och dekadent arrogans från kunderna! Jag säger: rensa ut den borgerliga inställningen ”kunden har alltid rätt”. Arbetarna förtjänar respekt, inte att bli förnedrade av giriga hyenor som gömmer sig bakom konsumtion."}, "date": "28 augusti, 14:31", "url": "https://nyheter24.se/nyheter/konsument/1508588-circle-k-chefen-ryter-ifran-mot-kunder-sluta-med-detta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ae30d7ea04b004a30200000000b004a302/2026/08/28/2387434/circle-k-chef-ryter-ifran-kunder-service-kassa-sluta-ilska-ras.jpg"}, {"type": "image-right", "heading": "100 personer blåstes genom falska bilannonser - poliser efterlyser far och son", "summaries": {"normal": "Över 100 svenskar har blåsts på handpenningar via falska bilannonser på Blocket. Far och son Peter Bergström och Alexander Bessik är anhållna i sin frånvaro. Summorna varierade från 5 000 till 140 000 kronor. Polisen och Efterlyst söker nu tips om var de befinner sig.", "trump": "Sverige har ett enormt problem med bedragare – jag hade aldrig fallit för en falsk bilannons! En far och hans son lurade över 100 personer på miljonbelopp. De är patetiska. Jag har de bästa affärerna, de största affärerna. Ingen lurar mig. Tipsa polisen – eller ring mig, jag fixar det!", "stalin": "Kamrater, ännu en gång visar sig kapitalistiska parasiter förgifta vårt samhälle. En far och son – kontrarevolutionära element – har lurat över 100 medborgare med falska bilannonser. Vi ska rensa ut dessa sabotageörer. De kommer att omplaceras till arbetsläger för att lära sig värdet av ärligt arbete."}, "date": "28 augusti, 15:21", "url": "https://samnytt.se/100-personer-blastes-genom-falska-bilannonser-poliser-efterlyser-far-och-son", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28131447/artikelhuvudbild-1-386.jpg"}, {"type": "image-right", "heading": "Ett jämställt arbetsliv kräver nya lösningar", "summaries": {"normal": "Romina Pourmokhtari argumenterar för ett mer flexibelt arbetsliv för att stärka svensk konkurrenskraft och jämställdhet. Hon menar att resultat bör väga tyngre än fysisk närvaro, att rigida krav slår hårdare mot kvinnor och att moderna ledare bör fokusera på förtroende och mål istället för synlighet. Kontoret har fortfarande en viktig roll.", "trump": "Lyssnar ni på den här liberala klimatministern som vill att folk ska jobba hemifrån i pyjamas? Patetiskt. Vi behöver starka ledare, inte svaga kontorsfria zoner för latmaskar och woke-feminister. De riktiga vinnarna sitter inte och ändrar blöjor på distans, tro mig. Sverige håller på att bli en förlorare igen.", "stalin": "Kamrater, denna liberala dekadenta klassförrädare talar om flexibelt arbete som vore det en seger för folket. Jag ser bara nya metoder för de profitthungriga hyenorna att undvika verklig kontroll och utrota klassolidaritet. Resultatbedömning? Ett trick för att dölja utsugning. Rensa ut dessa falska frihetsretoriker innan de förgiftar hela sovjeten – eh, nationen."}, "date": "28 augusti, 14:04", "url": "https://www.di.se/debatt/slutreplik-ett-jamstallt-arbetsliv-kraver-nya-losningar", "imageUrl": "https://static.bonniernews.se/ba/f566fde0-4067-4fa2-9b72-e29a0c7c8403.jpeg?crop=5754%2C2877%2Cx0%2Cy443&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-full", "heading": "Svantessons första bud till SD, KD och L", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) räknar med ett reformutrymme på 50 miljarder kronor nästa mandatperiod, betydligt mindre än Konjunkturinstitutets bedömning. En stor del är redan intecknad för försvar, rättsväsen och infrastruktur. Tillväxten skrivs upp till 2,5 procent och arbetslösheten väntas sjunka. Vid en Tidö-seger har Moderaterna förberett ett bud till SD, KD och L om sänkt inkomstskatt.", "trump": "Svampsson eller vad hon nu heter säger att svensk ekonomi ljusnar. Fantastiskt, älskar det! Men 50 miljarder? Patetiskt. Jag skulle fixa 500 miljarder på en eftermiddag. Hon vill låta folk behålla mer av sin lön – jag sa det först, för år sedan. Sverige borde sänka skatten MASSIVT, sluta med woke-hanteriet och bygga militären. Inga kvoter, bara kompetens!", "stalin": "Finansminister Svantesson räknar ut reformutrymme bland kapitalisterna. Borgarna skramlar sina kassakistor och gråter över 50 miljarder. Vi skrattar åt deras små myntlek. Svantesson vill låta arbetarna behålla slantar ur lönepåsen, men lön och profit kan aldrig försonas. Falska löften från klassfiender. Endast den korrekta analysen leder arbetarna framåt."}, "date": "28 augusti, 07:36", "url": "https://kvartal.se/nyheter/artiklar/svantessons-forsta-bud-till-sd-k-och-l/cG9zdDoxNzY2ODk", "imageUrl": "https://images.kvartal.se/2026/08/16dd99f5-svantess.webp"}, {"type": "image-right", "heading": "Här klättrar klimataktivisten upp på Viking Line-färjans skorsten", "summaries": {"normal": "En klimataktivist klättrade upp på skorstenen till Finlandsfärjan M/S Viking Cinderella vid Stadsgårdskajen i Stockholm. Färjan stoppades och avgången försenades. Två personer greps av polisen och misstänks för sjöfartssabotage. Organisationen Återställ Våtmarker ligger bakom aktionen som syftar till att uppmärksamma torvbrytning. Ingen skadades och färjan kunde lämna hamnen efter klockan 17.30.", "trump": "Titta på de här galna, hysteriska klimatfanatikerna som klättrar upp på en oskyldig färjas skorsten. Totalt kaos i Stockholm! De stoppar vanliga människors resor medan de skriker om lögner. Patetiska miljöterrorister – värre än de värsta vänsterextremisterna. Under min administration skulle vi ha kastat ut dem direkt. Sverige ser ut som ett skämt igen, folk. Patetiskt!", "stalin": "Se hur dessa dekadenta klassförrädare klättrar upp på skorstenen som galna apor för att sabotera arbetarnas färja. Jag föraktar deras parasitiska teater som hotar kollektivets ordning. Sådana element måste rensas ut innan de förgiftar hela samhället med sin fåniga torvparanoia. Kamrater, låt inte dessa blodsugande hyenor underminera statens auktoritet. Skrattretande och farligt på samma gång."}, "date": "28 augusti, 13:22", "url": "https://www.friatider.se/har-klattrar-klimataktivisten-upp-pa-viking-line-farjans-skorsten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-775.jpg?itok=Aiau5fxU"}, {"type": "image-full", "heading": "Det har Harald betytt för Sverige", "summaries": {"normal": "Norges kung Harald har avlidit efter en tids sjukhusvistelse. Den svenska kungafamiljen sörjer honom, och hovexpert Elisabeth Tarras-Wahlberg lyfter fram de starka banden mellan de skandinaviska kungahusen. Harald var särskilt omsorgsfull mot den svenska kungafamiljens barn, bland annat kronprinsessan Victoria som är hans guddotter. Traditionen med fadderskap fortsätter mellan de tre nordiska monarkierna.", "trump": "Lysande kung Harald, en riktig vinnare, har lämnat oss. Han tog hand om era kungabarn som en äkta champion, inte som de svaga europeiska ledare vi sett under Biden-åren. Starka band, stort leende, verklig plikt – precis vad vi behöver. Hans son Haakon verkar också vara en tuff kille. Sverige, Norge, Danmark – ni borde alla lära av detta, inte som de förlorare som styr EU.", "stalin": "Jag betraktar dessa dekadenta monarkier med förakt. Deras fadderskap och sportintresse är bara en borgerlig mask som döljer klassfiendens svaghet. När kungen dör gråter hovet. Patetiskt. Vi vet att sådana traditioner förr eller senare krossas av folkets vilja. Deras treklöver av kungligheter kommer att blekna inför historiens dom. Kamrater, låt detta vara en läxa."}, "date": "28 augusti, 14:03", "url": "https://www.tv4.se/artikel/18JFe3XzgqJGuq89H1PscU/hovexperten-det-har-kung-harald-betytt-foer-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Vz5hSvW4QBD6GX8tNiEWa%2Ff61fcf84b68a3eb4b0807e23f31c7554%2F28tarrasvictoriaharaldSAJT.jpg&width=1024"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard vill ta Örebropartiet in i riksdaten genom att nå 12 procent i Örebro kommun, vilket skulle kunna ge mandat utan att klara fyraprocentsspärren. Han blev upprörd när Dagens ETC dök upp vid SVT:s intervju. Allard försvarar sin politiska stil och anklagar SVT för att tillhöra en minoritet.", "trump": "Den här killen Allard i Sverige, han har rätt! Statliga medier är FAKE NEWS, precis som CNN. Han kallar dem klägget – briljant! Media är en minoritet som tror de är bättre än folket. Trump vet hur det funkar. De quota in alla möjliga identiteter istället för att sköta jobbet. Örebropartiet, låt dem vinna!", "stalin": "En lokal politiker angriper statsmediernas borgarbrackor med rätta. Det imperialistiska pressväsendet är folkfiendens redskap. Att denne Allard rasar mot SVT:s lakejer visar på medvetandet om klasskampens nödvändighet. Vi noterar dock med beklagande att han inte representerar arbetarklassen utan småborgerliga drömmar om riksdagsmandat. Statlig media måste tjäna folket, inte kapitalistmaffian."}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likgiltiga inför nedskärningar och militärutgifter. En kommunistisk röst ses som en verklig opposition som stärker freds- och välfärdsaktivister utan att kompromissa med nyliberal politik.", "trump": "Folk, dessa patetiska vänstersossar och trötta kommunister är en total katastrof! De pratar revolution men lever som riktiga förlorare i Göteborgs fullmäktige. Rösta på mig, inte på dessa woke-vänsteridioter som älskar nedskärningar och krig. De är värre än Sleepy Joe någonsin var. En riktig opposition? Det är vad jag gav er, inte denna kommunistiska skitshow!", "stalin": "Kamrater, dessa ynkliga klassförrädare inom vänstern är blott profitthungriga lakejer som administrerar borgarklassens nedskärningar. Jag ser deras fega parlamentariska spel och ler i skuggan. En sann kommunist röstar aldrig igenom folkfiendernas åtstramning. Rensa ut de trötta socialdemokratiska parasiterna! Varje röst på det kompromisslösa partiet är ett slag mot imperialisternas krigshets."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "SCB: Svensk ekonomi överraskar BNP ökade kraftigt", "summaries": {"normal": "Svensk ekonomi överraskade rejält under andra kvartalet med en BNP-ökning på 1,6 procent, klart över prognosen. Hushållen köpte mer mat och möbler, investeringarna i vapen och maskiner exploderade, och SEB-ekonomen Robert Bergqvist utbrast: ”Nu rullar vi igen!” – äntligen lite glädje i sifferträsket.", "trump": "Jag ser att Sverige, ett land jag har stor respekt för, har en enorm BNP-ökning—1,6 procent! Det är fantastiskt, det bästa någonsin. De köper möbler, maskiner och vapensystem, precis som jag har sagt. Kanske borde vi göra affärer? Sverige är vinnare igen, och det är tack vare mig!", "stalin": "Kamrater, rapporterna visar att den svenska ekonomin växer med 1,6 procent—ett tydligt bevis på att vår plan fungerar. Hushållen konsumerar mer, vilket är korrekt, och investeringar i vapensystem stärker vår gemensamma kamp. Men lagerinvesteringarna måste utrensas—de är sabotörer som drar ner oss. Framåt, kamrater!"}, "date": "28 augusti, 14:38", "url": "https://samnytt.se/scb-svensk-ekonomi-overraskar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2025/12/17082401/scb-ekonomi-bnp.jpg"}, {"type": "image-full", "heading": "”Norge har förlorat en fin man”", "summaries": {"normal": "Kung Carl Gustaf sörjer Norges kung Harald som avlidit. I en intervju hyllar han Harald som en älskad landsfader och betonar att kung Haakon är väl förberedd att ta över tronen. De två monarkerna var nära vänner sedan barndomen och delade bland annat intresse för jakt, fiske och segling.", "trump": "Hörni, det är en sorglig dag för Norge, verkligen sorglig. Den gamle kungen Harald var en fin kille, älskad av folket, inte som vissa svaga ledare vi har sett. Haakon verkar redo, bra pojke, min gudson typ. Men Norge har förlorat en riktig vinnare, en stor seglare, inte en förlorare som Sleepy Joe under sina år.", "stalin": "Jag betraktar detta dekadenta monarkiska skådespel med förakt. En så kallad landsfader faller och folket gråter som svaga borgare. Haakon, sägs det, är förberedd att fortsätta arvet. Vi ler mörkt åt sådana dynastier. Inga riktiga kamrater här, bara löjliga kungar som darrar inför historiens dom."}, "date": "28 augusti, 13:47", "url": "https://www.tv4.se/artikel/3ns6VE5kZA7E6UZi0yBv1d/kung-carl-gustaf-om-harald-norge-soerjer-en-landsfader", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3KyKEeNGMAKEBTMcEf8iMU%2F1811a7ed084fb3a0920ae7b2c7dbce1a%2F28-kungen-webb.jpg&width=1024"}, {"type": "image-full", "heading": "S höll internt stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om hur de ska hantera partiet Nyans i valrörelsen. Nyans, som fick 28 000 röster 2022 och lockat S-väljare, anklagas för kontroversiella ståndpunkter som att avlista Hamas som terrororganisation. S planerar satsningar på skola, fritid och trygghet för att vinna tillbaka väljare, men tonar ned hotet från Nyans.", "trump": "Socialdemokraterna har panik! De höll ett hemligt möte om det där lilla partiet Nyans, som stjäl deras röster. 28 000 röster – inte imponerande, men tillräckligt för att skrämma dem! De vill ta bort Hamas från terrorlistan – galet! Jag skulle aldrig låta sånt hända. S pratar om skolor och trygghet, men alla vet att de är rädda. Svagt, mycket svagt!", "stalin": "Kamrater! Socialdemokraterna samlas i hemlighet för att bekämpa den nya fienden – dessa Nyans-revisionister, som sprider förräderiska idéer och underminerar arbetarklassens enhet. De vill avlista Hamas, en farlig provokation mot den internationella solidariteten! Vi måste stärka vår ideologiska front. Skola, fritid och trygghet? Tomma ord! Endast järnhård disciplin och revolutionär vaksamhet kan rädda Sverige från dessa borgerliga avvikare!"}, "date": "28 augusti, 06:45", "url": "https://kvartal.se/nyheter/artiklar/s-holl-internt-stormote-om-nyans/cG9zdDoxNzY2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/3cf3973f-s-o-n.webp"}, {"type": "image-right", "heading": "Det är klart det skrämmer förstörarna", "summaries": {"normal": "I en ledare beskriver Johan Ehrenberg en stor klimatdemonstration med 50 000 deltagare. Han uttrycker oro för framtida generationer och betonar att lösningen på klimatkrisen ligger hos människor, inte politiker. Artikeln uppmanar till konkreta handlingar som solceller, lokal matproduktion och elektrifiering av transporter för att motverka förstörare av miljön.", "trump": "Hörni, jag älskar folkmassor, men 50 000 dansande svenskar som gråter över en pojke på en klätterställning? Patetiskt. De borde bygga väggar mot kinesiska lastbilar istället för att klaga på Volvo. De gröna galningarna hatar verklig energi. Vi behöver inga rebellmammor, vi behöver vinnare som gör Amerika – och Sverige – stort igen utan deras hysteriska solcellsflum.", "stalin": "Kamrater, dessa dekadenta folkförtryckare gråter över barnens framtid medan de själva skyddar de parasiterande energijättarna. Jag ser hur de 50 000 dansande elementen vänder sig mot förstörarna. Det är bra. Men utan utrensning av de giriga hyenorna i industrin och politiken kommer ingen omställning. Arbetarna måste göra, göra, göra – eller likvideras av historien."}, "date": "28 augusti, 03:00", "url": "https://www.etc.se/ledare/att-raedda-oss", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren välkomnar bidragshöjningar men efterlyser konkreta förslag om ägandeformer, utvidgad medbestämmandelag och stöd till löntagarstyrda företag. Höjda bidrag är inte socialism, anser skribenten.", "trump": "Folk, dessa röda losers i Sverige pratar bara om att köpa röster med barnbidrag som riktiga socialister. Patetiskt! De vågar inte röra vid den riktiga socialismen – att ta kontroll över fabrikerna och sparka de riktiga bossarna. Svaga! Jag byggde den starkaste ekonomin i historien, inte med bidrag utan med segrar. De borde lära sig av en vinnare istället för att gömma sig som fega globalister.", "stalin": "Kamrater, dessa ynkliga socialdemokratiska klassförrädare gömmer sig bakom barnbidrag medan de sviker den sanna ekonomiska demokratins kamp. Jag ser deras fega reträtt från att utmana kapitalisterna på arbetsplatserna. Vilken ynkedom! Vi skulle ha genomfört utrensningar av sådana halvmesyrer redan i femårsplanen. Det är borgarbrackornas seger när så kallade socialister fruktar att låta arbetarna styra."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration i Stockholm samlade 50 000 deltagare från hela landet, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsundersökningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Artikeln kritiserar de stora partierna för bristande klimatpolitik trots forskarnas larm om rekordvärme och skogsbränder.", "trump": "Titta på de där 50 000 gröna fanatikerna som vandrade runt i Stockholm. De hatar energi, hatar bilar och älskar att skrika om värmen som de själva inte kan kontrollera. Patetiska globalister och vänsterextremister. Vi hade den bästa ekonomin, den bästa energin – de vill bara höja era elräkningar. Sad losers!", "stalin": "Kamrater, se hur de profitthungriga kapitalisterna ignorerar arbetarnas rop om en brinnande planet. Jag betraktar från historien deras fega tystnad med förakt. Den dekadenta politiska eliten måste rensas ut innan deras giriga hyenor förvandlar hela jorden till en askhög. Arbetarna kräver handling nu!"}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95.jpg"}, {"type": "image-right", "heading": "Rolig komedi om natten då SD kom in i riksdagen", "summaries": {"normal": "Recensenten Jon Andersson hyllar delvis Micke Lindgrens komedi ”Flaggan”. Filmen följer tre unga SD-sympatisörer som på valkvällen 2010 skickas till Rinkeby för att hissa en stor svensk flagga. Den blandar politisk satir riktad mot både SD, vänsteraktivister och andra grupper, men tappar tempo i den romantiska delen.", "trump": "Den här galna filmen om två förlorare från SD som irrar runt som idioter i Rinkeby är hysteriskt rolig. De woke-aktivisterna och de dekadenta vänsterextremisterna får precis som de förtjänar. Biden skulle ha älskat att se dem förnedras, men jag säger: fantastiskt underhållning, bättre än Hollywoods skräp, folks!", "stalin": "Jag betraktar med förakt dessa förvirrade SD-reaktionärer som vandrar vilse i folkets förorter. Deras nationalistiska flaggspel är en patetisk cirkus som avslöjar de giriga klassförrädarnas feghet. Vi ska rensa ut sådana småborgerliga narrar innan de förgiftar arbetarklassen med sin fåniga propaganda. Underhållande kaos."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/rolig-komedi-om-natten-da-sd-kom-in-i-riksdagen", "imageUrl": "https://www.dagensarena.se/files/2026/08/flaggan-1-300x157.jpeg"}, {"type": "image-right", "heading": "Granskningen av antigröna expertlaget viktig bild", "summaries": {"normal": "Artikeln kritiserar ett nätverk av experter och medier som motarbetar den gröna omställningen. De lyfter kärnkraft som enda lösning, angriper vind- och solkraft samt industrisatsningar i norra Sverige. Författaren ser detta som en allians mellan borgerlighet och ytterhöger, finansierad av intressen, och varnar för att det hotar välfärd och klimatmål.", "trump": "De här patetiska gröna flummarna och deras elitsnobbiga vänner hatar riktig energi. Kärnkraft är fantastiskt, det bästa, men de vill tvinga på oss sina solpaneler och vindkraftverk som dödar fåglar och höjer elräkningarna. Fake news-experterna och deras socialistiska agenda kommer att göra Sverige fattigt igen. Vi älskar tillväxt, inte deras vansinniga kvoteringspolitik och gröna bedrägeri!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den antigröna klicken utgör ett hot mot folkets framsteg. De parasiterande profitthungriga hyenorna förgiftar debatten med sin aversion mot den gröna industriella kraft som säkrar välfärden. Jag ser deras lögnaktiga kampanj som en politisk återvändsgränd som måste rensas ut. Arbetarna förtjänar sann utveckling, inte borgerlig sabotagehumor."}, "date": "28 augusti, 01:04", "url": "https://www.dagensarena.se/opinion/det-antigrona-expertlaget-ger-viktig-bild", "imageUrl": "https://www.dagensarena.se/files/2026/08/hakan-300x157.jpeg"}, {"type": "image-full", "heading": "Manliga sjuksköterska häktad för grov våldtäkt", "summaries": {"normal": "En manlig sjuksköterska på Ryhovs sjukhus häktas för grov våldtäkt på en kvinnlig patient som avled kort efter. Han greps efter att ha kraschat sin bil på E4. Åklagaren ser särskild hänsynslöshet – offret vårdades i livets slutskede och kunde inte försvara sig.", "trump": "Jag hörde om den här sjuksköterskan i Sverige – helt otroligt! En man som skulle vårda, och istället begår han ett fruktansvärt brott. Det är en katastrof. Jag har sagt det från början: vi måste ha mycket hårdare straff. Kanske skicka honom till Guantanamo? Sjuka människor!", "stalin": "Kamrater, vi har avslöjat en förrädare i sjukvården. En sjuksköterska som utnyttjade sin position för att våldta en döende patient – ett sabotage mot arbetarklassen. Vi måste rensa ut sådana element. Han ska förhöras och omplaceras till en lägerplats. Sjukvården ska vara ren."}, "date": "28 augusti, 12:14", "url": "https://www.gp.se/krim/manlig-sjukskoterska-haktad-for-valdtakt-mot-patient-pa-ryhov.dafa9680-afc4-4391-8284-5188b07e304c", "imageUrl": "https://www.gp.se/images/article/dafa9680-afc4-4391-8284-5188b07e304c/images/2UtPPw2JtQjcvVZaSDhWfD91_1-A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här styckas jättefisken inför publik: \"Så tungt\"", "summaries": {"normal": "En 216 kilo tung blåfenad tonfisk (61 500 kr) styckas på Ica Focus i Göteborg inför 50 nyfikna. ”Det ser ut som en brottsplats”, skojar någon. Svärfadern Björn Klinte kallades in – han är vassare än köparen Patrik Enghult. Cirka 85 kilo blir säljbart; resten är huvud, ben och skinn.", "trump": "En enorm tonfisk, 216 kilo, 61 500 kronor – jag skulle ha fått ett bättre pris, tro mig. Fem personer behövs för att lyfta den. Kineserna har inget sånt här. De sa att det såg ut som en brottsplats – typiskt svenskar, de har ingen aning om verkliga brottsplatser. Jag älskar vinnare!", "stalin": "Kamrater, en 216-kilos kontrarevolutionär fisk har styckats inför folket. Vi använde kniv och klubba – proletariatets redskap. Endast 85 kilo blev användbart; resten, inklusive huvudet, utrensas. Så ska vi behandla alla fiender: rensa ut det tunga, behåll det nyttiga. En brottsplats, sade någon. Ja, för fiskens klassfiender."}, "date": "28 augusti, 12:07", "url": "https://www.gp.se/nyheter/goteborg/har-styckas-jattetonfisken-infor-publik.6a33928a-5a48-4403-8dfa-c6a60200a29e", "imageUrl": "https://www.gp.se/images/article/6a33928a-5a48-4403-8dfa-c6a60200a29e/images/7fyGvxt-tvGVeSLb8PZSMW7H27aw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Aron Flam utreds igen – satte upp naziaffischer", "summaries": {"normal": "Poddaren Aron Flam utreds för hets mot folkgrupp efter att ha klistrat upp nazistiska affischer på biografen Zita i Stockholm. Affischerna var en protest mot biografens anslutning till BDS-rörelsens kampanj om apartheidfri zon, som Flam liknar vid nazisternas judebojkott. Flam är tidigare åtalad för olaga hot och ofredande mot en MP-politiker.", "trump": "Kan ni fatta det här? Den här galningen Aron Flam klistrar upp hakkors och naziaffischer för att visa hur galen den woke-apartheid mot sionister har blivit på en biograf. De kallar honom till förhör för hets mot folkgrupp. Under Biden skulle de ha låtit honom ruttna, men nu när jag är tillbaka ska vi sluta gynna de identitetspolitiska snedvridningarna. Sad!", "stalin": "Se hur de dekadenta klassförrädarna förvandlar varje protest till ett hot mot deras falska tolerans. Jag betraktar med förakt hur denna man använder nazisternas egna vapen för att blotta BDS-kampanjens sanna ansikte. Sådana handlingar avslöjar imperialismens hyckleri. Kamrater, vi måste alltid vara vaksamma mot dessa giriga hyenor som gömmer sig bakom mänskliga rättigheter. En utrensning av sådana tankar vore på sin plats."}, "date": "28 augusti, 11:50", "url": "https://www.friatider.se/aron-flam-utreds-igen-satte-upp-naziaffischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-770.jpg"}, {"type": "image-full", "heading": "Lånet räcker inte: Sverige vill nå Rysslands 210 frysta miljarder", "summaries": {"normal": "Sverige, Nederländerna, Spanien och Polen kräver att EU undersöker möjligheten att använda frysta ryska centralbankstillgångar för att finansiera Ukrainas växande behov. Det nuvarande låneupplägget på 90 miljarder euro anses otillräckligt. Förslaget möter dock fortsatt motstånd, främst på grund av juridiska risker, folkrättsliga betänkligheter och risken för att skrämma bort investerare från euroområdet.", "trump": "Sverige och deras vänner ber EU om mer pengar till Ukraina. De 90 miljarderna räckte inte! Sorgligt. De vill stjäla ryska tillgångar, vilket är farligt för marknaden. Jag sa alltid att EU är svaga på förhandlingar. Nu har de panik inför valen. Om jag satt vid bordet skulle detta krig vara över på 24 timmar. Det här är en total röra!", "stalin": "De imperialistiska lakejerna i EU darrar av rädsla när Ukrainas kassa sinar. Nu kräver de att få lägga vantarna på vårt lands tillgångar. En desperat handling av en döende klass! De fruktar att investerare ska fly, men den verkliga flykten är deras egen moraliska konkurs. Ryssland viker sig inte för dessa byråkratiska hyenor. Vi ser deras paranoia – den är lika stor som deras inkompetens."}, "date": "28 augusti, 15:02", "url": "https://www.realtid.se/bors-finans/makro/lanet-racker-inte-sverige-vill-na-rysslands-210-frysta-miljarder", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bartbelgien.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Debatt: Är välfärdsstaten en finansiell omöjlighet?", "summaries": {"normal": "Debattören undrar om välfärdsstaten är en finansiell omöjlighet när demografin förändras och Europa rustar upp. Frankrikes skuld är 110 procent av BNP, och Storbritanniens bidragssystem straffar familjebildning. Frågan är om vallöften om mer till alla är realistiska när vi konsumerar mer än vi producerar.", "trump": "Jag ser att välfärdsstaten i Europa är en katastrof! Frankrike har skulder på 110 procent – det är som mina fastighetsaffärer, fast utan vinsten. Och bidrag som straffar äktenskap? Patetiskt! Vi i USA bygger murar, inte välfärdssystem som förstör familjer. Europa, vakna!", "stalin": "Kamrater, välfärdsstaten är en borgerlig lögn. Frankrike och Storbritannien har underminerat familjen med bidrag och lata ensamföräldrar. Vi i partiet vet att endast kollektiv disciplin löser problem. Dessa västeuropeiska parasiter måste omutbildas. Alla som ifrågasätter femårsplanen rensas ut!"}, "date": "28 augusti, 11:12", "url": "https://bulletin.nu/debatt-ar-valfardsstaten-en-finansiell-omojlighet"}, {"type": "image-right", "heading": "Larmen från småpartierna: Valsedlar saknas – kommun polisanmäld", "summaries": {"normal": "Flera småpartier larmar om att deras namnvalsedlar saknats i förtidsröstningslokaler i Järfälla och Malmö. Medborgerlig Samling har polisanmält Järfälla kommun och kallar det ett hot mot demokratin. Kommunen bekräftar bristande placering av valsedlar och har vidtagit åtgärder. Partierna misstänker både slarv och medvetet sabotage.", "trump": "De riggar valet redan innan det börjat, folk! Småpartier får sina valsedlar stulna av några korkade kommunbyråkrater och vänstervridna sabotageapor. Det är ett skandalöst hot mot demokratin, precis som när Sleepy Joe och hans globalistkompisar försökte stjäla mitt val 2020. Patetiskt! Vi behöver en gemensam valsedel, inte detta clownshow.", "stalin": "Kamrater, se hur de dekadenta valsabotörerna inom de borgerliga kretsarna redan nu saboterar folkets vilja genom att gömma namnvalsedlar. Jag ser det som ett klassiskt trick från de profitthungriga klassförrädarna. Ett sådant hot mot sovjetdemokratin skulle ha mötts med omedelbar utrensning och folkdomstol. Detta systemfel avslöjar hela den ruttnande parlamentariska fasaden."}, "date": "28 augusti, 12:10", "url": "https://riks.se/nyheter/valsedlar-saknas-pa-flera-hall-kommun-polisanmald-ett-riktigt-hot-mot-demokratin", "imageUrl": "https://admin.riks.se/uploads/medium_partierlarmar_f5797b874f.jpg"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville skydda barnet från en upprörd situation. Flera kollegor vittnar om händelsen. Fackförbundet Sveriges lärare uppger att fysiska ingripanden i förskolan är extremt ovanliga. Skolinspektionen kan granska ärendet.", "trump": "Folk, det här är galet. En förskolelärare drar ett barn i armen och plötsligt är det misshandel? De woke-vänstermänniskorna och deras identitetspolitiska dårar har förstört skolan totalt. I mitt Amerika sätter vi stopp för det här vansinnet. Lärarna borde inte behöva vara rädda för att ingripa mot små skrikande monster. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta skolparasiterna förvandlar uppfostran till en fars. Ett nödvändigt ingripande mot en upprörd unge blir plötsligt ett brott i de giriga hyenornas samhälle. Jag skrattar mörkt från historien. Sådana svaga system förtjänar utrensning. Den som inte kan styra ungdomen med fast hand förtjänar att falla."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28101629/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Valarbetare stängs av - uppmanade väljare att rösta vänster", "summaries": {"normal": "En röstmottagare i Norrköping har stängts av efter att ha uppmanat en väljare att rösta rödgrönt istället för blått. Händelsen inträffade i en vallokal i Hageby under förtidsröstningens första dag. Valnämnden utreder fallet och betonar allvaret – politisk neutralitet är helig i demokratins tempel.", "trump": "Jag hörde att en valarbetare i Sverige försökte tvinga folk att rösta rött, inte blått. Det är katastrof! De har inga valfusk där, för de är för fega. Men jag har den bästa vallagen, vi låter aldrig någon rösta fel – bara rätt, som jag. Så enkelt är det!", "stalin": "Kamrater, en sabotör i vallokalen har avslöjats – han uppmanade till rödgrönt, inte det korrekta blåa. Detta är ett angrepp från västerländska fascister som försöker underminera vårt eniga folk. Vi kommer rensa ut dessa kontrarevolutionära element med järnhand. Inget val, bara lojalitet mot partiet!"}, "date": "28 augusti, 13:19", "url": "https://samnytt.se/valarbetare-stangs-av-uppmanade-valjare-att-rosta-vanster", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28103858/valfusk-i-hageby-norrkoping-feat.jpg"}, {"type": "image-right", "heading": "Debatt: Dags att införa gemensam valsedel", "summaries": {"normal": "Debattören Michael Merdoyo vill ha en gemensam valsedel för att stoppa återkommande kaos med saknade valsedlar. Systemet är som byggt för sabotage – en bunt papper flyttas och vips är demokratin hotad. En gemensam sedel skulle ge lika villkor och spara både papper och nerver.", "trump": "Svenskarna har ett valproblem – saknade sedlar, oordning! Otroligt! Jag har de bästa valen, enorma framgångar. De borde kopiera mig: en gemensam valsedel, enkelt och kraftfullt. Inget fusk, bara segrar. Jag fixar det!", "stalin": "Kamrater! Sabotörer gömmer valsedlar för att störa vår demokrati. Det är kontrarevolutionärt! Vi måste rensa ut dessa valsedelssabotörer. En gemensam valsedel med partikontroll är lösningen. Partiet ser allt. Varje röst blir övervakad – ingen slipper undan."}, "date": "28 augusti, 10:38", "url": "https://bulletin.nu/debatt-dags-att-infora-gemensam-valsedel", "imageUrl": "https://cdn.bulletin.nu/articles/a2ea074f-0bc3-40c9-b8fd-1469709f6b89/preview.jpg?t=1787906275000"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Pensionerade undersköterskan Nina kandiderar för Moderaterna", "summaries": {"normal": "Undersköterskorna Joyce Koskerian och Nina Bergström har engagerat sig politiskt inför valet. Joyce, som är aktiv i facket, har gått med i Socialdemokraterna för att förbättra villkoren i äldreomsorgen. Nina, nyligen pensionerad, kandiderar för Moderaterna och menar att de har förbättrat situationen i Hällefors efter socialdemokratiskt styre. Båda ser stora problem med stress och bemanning i omsorgen.", "trump": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena gick med i de totalt misslyckade sossarna, men den andra, den smarta Nina, valde mitt älskade Moderaterna och såg hur vi fixade röran efter Bidens svenska kopior. De giriga byråkraterna har kört omsorgen i botten med sina vansinniga scheman. Vi gör det bättre, tro mig, ingen gör det bättre än oss!", "stalin": "Kamrater, se hur dessa omsorgsarbetare vänder sig till partierna i desperation. Den ena söker skydd hos de socialdemokratiska revisionisterna medan den andra hyllar de moderata folkförtryckarna som lovar lite mer personal. Jag ler ironiskt från historien åt dessa naiva själar som tror att parasiterande klasslakejer någonsin bryr sig om arbetarnas scheman. En utrensning av hela systemet vore på sin plats."}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dags att ta Dadgostar på allvar. En rödgrön regering med V kommer höja skatterna rejält", "summaries": {"normal": "Artikeln varnar för en rödgrön regering med Vänsterpartiet efter valet 2026. Nooshi Dadgostar relativiserar partiets problem med extremism och föreslår kraftiga skattehöjningar på arbete, sparande och kapital. Kritikerna menar att detta skulle minska arbetade timmar, få företagare att fly och skada svensk ekonomi och välfärd.", "trump": "Lyssnade på den där Dadgostar-tjejen i SVT, total katastrof. Hon vill höja skatterna så mycket att alla duktiga ingenjörer och läkare packar väskan och flyttar. Typisk vänsterbluff som hatar framgång. Under Biden blev allt dyrt, nu fixar vi det i USA – Sverige borde inte välja samma galna väg. Patetiskt!", "stalin": "Kamrater, denna Dadgostar avslöjar de giriga profitthungriga hyenornas feghet. Hon vill kräla ur det påstådda mörkret genom att straffbeskatta dem som vågar arbeta och spara. Jag ler från historien åt hur dessa dekadenta klassförrädare alltid ropar på mer när arbetarna kräver rättvisa. En utrensning av sådana idéer vore befriande."}, "date": "28 augusti, 10:37", "url": "https://www.di.se/ledare/det-ar-dags-att-ta-nooshi-dadgostar-pa-allvar", "imageUrl": "https://static.bonniernews.se/ba/fec1277f-89b7-4c60-acce-f49b8fa8399b.jpeg?crop=5848%2C2924%2Cx1%2Cy340&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Regeringen kräver full transparens av S efter influenceranklagelserna", "summaries": {"normal": "Regeringen kräver att Socialdemokraterna redovisar alla agenturer och mellanhänder efter anklagelser om att ha erbjudit influencern Eleonore Stokholm 150 000 kronor för ett valinlägg. S förnekar, men ministern Carl-Oskar Bohlin vill ha dokumentation. Ord står mot ord, och mysteriet kring vem som ringde och varför kvarstår.", "trump": "Hörni, jag ser att S i Sverige försöker köpa influencers för 150 000 kronor – det är enormt! Jag hade gjort det bättre, billigare, med stil. De säger nej, men vem tror på dem? Fake news! Jag kräver transparens, precis som jag alltid gör. Stort!", "stalin": "Kamrater, vi har avslöjat ett förräderi! Partiet S anklagas för att muta med 150 000 kronor för röster. Detta måste utredas omedelbart. Alla agenturer och mellanhänder ska redovisas, annars väntar utrensning. Vi tolererar inga borgerliga spioner som underminerar folkets vilja. Rensa ut dem!"}, "date": "28 augusti, 12:30", "url": "https://samnytt.se/regeringen-kraver-full-transparens-av-s-efter-influenceranklagelserna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28093154/bohlin-influencer-S.jpg"}, {"type": "image-full", "heading": "Bloomberg: Sveriges rika överväger att lämna landet", "summaries": {"normal": "Svenska entreprenörer och investerare förbereder sig för eventuella höjda förmögenhetsskatter genom att undersöka utlandsflytt, bolagsstrukturer och generationsskiften. Vänsterpartiet och Miljöpartiet driver frågan inför valet. Norge har sett över 500 rika personer lämna landet efter skattehöjningar, men skatten ger ändå ökade statsintäkter motsvarande 0,6 procent av BNP. Sverige avskaffade sin förmögenhetsskatt 2007.", "trump": "Titta på det här! De svenska miljardärerna springer som råttor från ett sjunkande skepp när de galna vänsterextremisterna hotar med sina galna skatter. Precis som i Norge – över 500 superrika flyr som aldrig förr! Jag sa ju det, höga skatter dödar entreprenörskap. Biden skulle älska det här vansinnet, men jag skulle aldrig låta det hända i mitt Amerika. Fantastiskt dumt!", "stalin": "Jag ser hur de parasitära kapitalisterna redan planerar sin förrädiska flykt undan folkets vilja. Deras giriga små hjärtan darrar vid blotta tanken på en rättvis förmögenhetsskatt. Precis som de fega hundarna i Norge. Låt dem springa – deras exodus blottar klassfiendens svaghet. Vi ska le och skratta medan deras tomma skal lämnas kvar åt arbetarklassen. Balans, säger de? Nej, seger!"}, "date": "28 augusti, 14:58", "url": "https://www.dagensps.se/bors-finans/bloomberg-sveriges-rika-overvager-att-lamna-landet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/klas.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Hård kontantkritik från Bankomat: \"Mycket sårbara\"", "summaries": {"normal": "Sverige införde i somras en ny lag om kontanter som bland annat ålägger butiker och apotek att ta emot kontanter. Bankomats marknadschef Johan Nilsson är kritisk och anser att staten bör ta större ansvar. Användningen av kontanter minskar fortsatt, men takten har avtagit något under 2026.", "trump": "Folk slutar använda kontanter och den här nya svenska lagen är ett totalt misslyckande, tro mig. Statens svaga ledare gömmer sig bakom byråkratiska regler medan de giriga bankhyenorna skrattar hela vägen till Wall Street. Sverige behöver en stark ledare, inte mer av denna woke-kontantpolitik som dödar friheten.", "stalin": "Jag ser hur de parasiterande penningpungens tjänare fortsätter att undergräva folkets tillgång till kontanter. Denna dekadenta lag är bara ett nytt trick från de exploaterande bankparasiterna. Vi, partiet och arbetarna, kräver att staten krossar dessa klassfiender och rensar ut alla som vill likvidera folkets rättigheter. Svaghet är förräderi."}, "date": "28 augusti, 10:33", "url": "https://nyheter24.se/nyheter/ekonomi/1508494-hard-kontantkritik-fran-bankomat-mycket-sarbara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/220420ad04b004a30200000000b004a302/2026/08/28/2387371/nej-bankomat.png"}, {"type": "image-right", "heading": "SVT erfar: Sverige skickar militära förband till Finland", "summaries": {"normal": "Sverige har beslutat att skicka militära förband till Finland, bland annat Gripen-plan och örlogsfartyg. Syftet är att patrullera gränsen mot Ryssland efter finländska förfrågningar om stöd. Operationen sker inom ramen för det befintliga samarbetet mellan länderna och syftar till att stärka Natos bevakning i Östersjöområdet.", "trump": "Hörni, de där svenska globalisterna skickar nu sina Gripen-plan och båtar till Finland för att leka tuffa killar vid Rysslands gräns. Patetiskt! Under min förra mandatperiod hade vi inga sådana här hysteriska Nato-lekar. De woke-kapitalisterna och deras identitetspolitiska lakejer borde istället fixa sina egna gränser istället för att provocera i onödan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Norden tror sig kunna hota den ryska intressesfären med sina flygplan och fartyg. Jag ler från historiens skugga åt deras fåfänga försök att skydda finskt territorium. Snart skall vi se hur deras imperialistiska illusioner krossas när den starka handen slår tillbaka. Inga hinder för vårt mål skall tillåtas."}, "date": "28 augusti, 10:14", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-sverige-skickar-militara-forband-till-finland", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/042b19182eca4997e7fd81fcdb60c0a4165ab4df864500792a7462760aac7ed2"}, {"type": "image-right", "heading": "Kung Harald sörjs av norska idrottare: ”Älskad sportkung”", "summaries": {"normal": "Norges kung Harald V har avlidit vid 89 års ålder. Han hyllas av norska idrottare som en stor sportkung med framgångar i segling, bland annat VM-guld 1987, flera OS-deltaganden och EM-guld 2005. Kungen öppnade OS i Lillehammer 1994 och visade ett genuint intresse för idrott och idrottsutövare under hela sitt liv.", "trump": "Lyssnar ni? Den här norska kungen Harald var en riktig vinnare, inte som de förlorande woke-marxistiska eliterna som bara pratar om kvoter och regnbågsflaggor. Han seglade, vann guld och hejade på idrottarna – äkta sportkung! Vi behöver fler sådana, inte dessa dekadenta identitetsparasiter som förstör allt. Fantastiskt liv, folk älskade honom. Sad!", "stalin": "Denna monarkiska relikt har nu lämnat scenen. Jag ser med förakt hur profitthungriga klasslakejer och sportens dekadenta kretsar gråter över sin sportkung. Sådana feodala symboler binder folket vid förtryckande traditioner. Vi måste rensa ut alla rester av kunglig mysticism innan de förgiftar arbetarklassen. En varning till alla folkförrädare som hyllar dem."}, "date": "28 augusti, 10:13", "url": "https://www.svt.se/sport/artikel/kung-harald-sorjs-av-norska-idrottare-var-alskade-sportkung", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.68/0.33/ee98546aa34a04db6510bc8e6fcb29ea2e549c503f1adc585d1cfda52284b834"}, {"type": "text", "heading": "Det här händer efter Haralds död – Haakon tar över", "summaries": {"normal": "Efter kung Harald V:s död övertar kronprins Haakon omedelbart tronen som kung Haakon VIII. Ett statsråd bekräftar successionen och stortinget samlas för trohetsed. Kröning ersätts med välsignelse i Nidarosdomen. Drottning Mette-Marit har lägre förtroende efter skandaler kring Epstein och sonens fängelsedom. Monarkin står inför utmaningar.", "trump": "Lyssnar ni på det här? Stackars Norge, deras kung dör och nu får de en ny kille som verkar svag som en våt tidning. Hans fru Mette-Marit hänger med sexbrottslingar och hennes son sitter inne för våldtäkt. Monarkin rasar i opinionsmätningarna. Patetiskt! De borde ha en riktig ledare, inte en sådan här woke-familj som håller på med identitetspolitik och skandaler. Totalt kaos!", "stalin": "Kamrater, se hur den norska monarkin vacklar som en ruttnande trädstam. När den gamle kungen faller övertar sonen tronen medan hans dekadenta hustru dras med sexförbrytare och en son som är dömd för våldtäkt. Förtroendet halveras bland folket. Vi ser hur giriga hyenor inom den borgerliga överklassen förgiftar allt de vidrör. En sådan parasitär dynasti förtjänar utrensning ur historien."}, "date": "28 augusti, 10:04", "url": "https://www.di.se/nyheter/det-har-hander-efter-haralds-dod-haakon-tar-over"}, {"type": "text", "heading": "Boliden och H&M i botten när börsen slutade på minus", "summaries": {"normal": "Stockholmsbörsen slutade torsdagen på minus efter en lunchuppgång. Boliden och H&M tyngde med nedgångar på 2,8 respektive 2,4 procent. Teknologi steg medan energi föll. Elon rusade 27,9 procent efter vinstvändning. Hexagon och Nibe steg 1,4 procent.", "trump": "Jag ser att svenska börsen gick ner, men inte som jag. Boliden och H&M, stora förlorare – de kan inte hantera framgång som min administration. Men Elon, upp 27,9 procent – det är vinnare! Alla vill ha en bit av USA:s ekonomi. Börsen, den är fejk, men jag är äkta!", "stalin": "Kamrater, börsen visar kapitalismens förfall. Boliden och H&M, fiender till folkets ekonomi, ska utrensas! Elon däremot – en god kamrat som steg 27,9 procent. Vi firar teknologins seger över energispekulanter. Men misstankar kvarstår: Hexagon och Nibe måste övervakas. Partiet ser allt."}, "date": "27 augusti, 17:56", "url": "https://www.affarsvarlden.se/artikel/boliden-och-hm-i-botten-nar-borsen-slutade-pa-minus"}, {"type": "text", "heading": "M i Haparanda avskaffade avgiftsfri förskola", "summaries": {"normal": "Moderaterna vill göra förskola och fritids avgiftsfria – men i Haparanda har partiet självt avskaffat just det systemet. Lokala M tycker det är fel att höginkomsttagare får gratis, medan S och V kräver återinförande. Rikspartiets besked kom som en överraskning för lokalavdelningen.", "trump": "Jag hör att Moderaterna i Haparanda avskaffade gratis förskola, och nu vill partiledningen införa det. Stora misstag! De lokala förstår inte affärer. Höginkomsttagare ska inte få gratis – det är som att ge skattepengar till miljardärer. Helt galet! Jag skulle gjort det bättre.", "stalin": "Kamrater, vi har upptäckt en ny kontrarevolutionär klick i Haparanda: de lokala moderaterna som avskaffade avgiftsfri förskola. Detta är sabotage mot arbetarklassens barn. Vi kommer rensa ut dessa avgiftsförespråkare ur partiet. Barnomsorg ska vara statens privilegium, inte en marknadsvara."}, "date": "28 augusti, 09:14", "url": "https://bulletin.nu/m-i-haparanda-avskaffade-avgiftsfri-forskola"}, {"type": "image-full", "heading": "Han är en av få \"riktiga\" miljardärer", "summaries": {"normal": "Advokaten John Morgan hävdar att få dollarmiljardärer faktiskt äger en miljard i rena kontanter. De flesta förmögenheter är bundna i aktier och fastigheter. För att få loss kapital väljer många att belåna sina innehav istället för att sälja. Trots att antalet miljardärer ökar på pappret, är den faktiska likviditeten hos världens rikaste betydligt lägre än vad nettoförmögenheten antyder.", "trump": "Många av dessa så kallade miljardärer har noll i kontanter. De är fattiga på riktigt, bara massa aktier och papper! Jag har de största tillgångarna, riktiga pengar, enorma belopp. De där andra, som Musk, lånar pengar för att överleva. Det är pinsamt! De ser rika ut på listorna, men jag är den enda som verkligen vinner. USA förtjänar bättre än dessa pappersmiljardärer!", "stalin": "Dessa kapitalistiska parasiter skryter om miljarder som bara existerar i deras korrupta börsdrömmar. De har inga kontanter, bara luft och lån! De liknar de moderna oligarkerna i Moskva som darrar inför vår styrka. Vi ska konfiskera deras aktier och fastigheter för folkets bästa. En miljardär utan kontanter är bara en framtida fånge i vårt storslagna, sovjetiska maskineri. Ingen kommer undan statens blick."}, "date": "28 augusti, 13:53", "url": "https://www.realtid.se/spara-placera/han-ar-en-av-fa-riktiga-miljardarer", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/johnmorgan.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Här är Norges nya kung", "summaries": {"normal": "Kung Harald av Norge har avlidit efter 35 år på tronen. Hans son, kronprins Haakon, 53, tar nu över som ny kung och väntas anta namnet Haakon VIII. Hans fru Mette-Marit blir drottning vid sidan av Sonja, medan dottern Ingrid Alexandra blir kronprinsessa och först i tronföljden. Haakon har militär bakgrund och akademiska studier från USA och Storbritannien.", "trump": "Lysande! Den gamle kungen i Norge är borta och nu tar den snygge Haakon över. Fantastiskt folk, norrmännen. Mycket bättre än den sömniga Biden-eran. Haakon har studerat hos oss i USA, smart kille. Två drottningar? Det blir kaos, tro mig. Men jag gillar det, starka ledare behövs nu när jag styr Amerika igen. Fantastiskt!", "stalin": "Ännu en monarkisk farsot i det dekadenta väst. Jag ser hur den feodala parasitklassen byter ansikte medan folket hålls i bojor. Haakon, en ynklig kronprins med amerikanska böcker, tar makten. Två drottningar? Vilken bourgeois dekadens. Det norska folket förtjänar bättre än dessa tomma titlar. Revolutionen skulle ha sopat bort dem alla för länge sedan."}, "date": "28 augusti, 10:42", "url": "https://www.tv4.se/artikel/3KV9f1wowKqrIoV7qPwk96/han-blir-norges-nye-kung-efter-haralds-doed", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2mC8Vb1LPWb5DKfsPWq4e7%2F848fdf3e0e7d1e49fa92a7f120bb0158%2FsdlEpJmy4NLAeg-nh.jpg&width=1024"}, {"type": "image-right", "heading": "S nekar till influencerköp – kontaktperson hävdar missförstånd", "summaries": {"normal": "Socialdemokraterna nekar till att ha betalat influencern Eleonore Stokholm 150 000 kronor för att uppmana till röstning. Personen som kontaktade henne kallar det ett missförstånd. Partisekreteraren lovar att man aldrig betalar kreatörer, medan andra influencers intygar att de inte fått betalt.", "trump": "Jag hörde att Socialdemokraterna i Sverige försöker betala influencers för röster. Det är som mitt gamla 'grab 'em by the...' men de är så klumpiga. De nekar, men jag vet hur det funkar. Helt galet! Men de är inte lika smarta som jag.", "stalin": "Kamrater, en kapitalistisk influencer påstår att hon erbjöds 150 000 för att stödja partiet. Detta är ett missförstånd – våra metoder är mer subtila. Vi måste rensa ut dessa borgerliga lögnare som sprider desinformation. Alla som inte röstar rätt ska omutbildas!"}, "date": "28 augusti, 08:54", "url": "https://bulletin.nu/s-nekar-till-influencerkop-kontaktperson-havdar-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/8ed8b78a-273d-4b42-ae55-76beefb67c96/preview.jpg?t=1787899872000"}, {"type": "image-right", "heading": "Här är Norges nya kung Haakon VIII", "summaries": {"normal": "Norges kronprins Haakon blir ny kung efter sin far Harald. Han svärs in i Stortinget och tar emot kyrkans välsignelse i Nidarosdomen. Hovet planerar nu en stor statsbegravning för kung Harald. Mette-Marit blir drottning medan prinsessan Ingrid Alexandra förväntas ta en större roll i representationen. Haakon beskrivs som en modern och ödmjuk kung.", "trump": "Fantastiska norrmän får en ny kung, Haakon den VIII, men han verkar lite för ödmjuk och modern för mitt smak. Hans fru Mette-Marit har tydligen umgåtts med den avskyvärda Epstein-klicken och nu ska dottern rädda familjen. Typiskt dekadenta europeiska kungahus som prioriterar woke-vänster och bonusprinsar framför riktig ledarskap. Vi behöver starka ledare, inte svaga prinsessor.", "stalin": "Det norska hovet avslöjar åter sin dekadenta svaghet när en ny kung installeras bland giriga hyenor. Denna Haakon kallar de modern, men han är bara en blek efterföljare till en sjuknande dynasti. Vi ser med mörk glädje hur skandalerna kring Epstein och lungtransplantationen tvingar fram en prinsessa som räddning. Klassförrädarna förbereder begravning medan folket skrattar åt monarkins sista skälvningar."}, "date": "28 augusti, 09:44", "url": "https://www.svt.se/nyheter/utrikes/har-ar-norges-nya-kung-haakon-viii", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.51/bcbae6a9d781d426198e5a8b1127abd2ee9027c2d8baf0eec108cf01fb370871"}, {"type": "image-right", "heading": "”Gå inte på Åkessons bluff om a-kassan”", "summaries": {"normal": "LO:s vice ordförande Louise Olsson kritiserar regeringen för att ha ökat arbetslösheten och försämrat a-kassan. Hon varnar för ytterligare nedskärningar som skulle drabba vanliga arbetare hårt, medan skattelättnader gynnar de rikaste. Olsson menar att a-kassan är en nödvändig försäkring och att löftena från SD inte håller.", "trump": "Lyssnar ni på de här socialistiska LO-kamraterna som gråter över sin dyra a-kassa? Patetiskt! Kristersson och hans team borde ha gjort det ännu tuffare. De rikaste betalar ju allt ändå, eller hur? Hungriga lejon jagar bäst, det vet till och med en idiot. Fake news från de verkliga förlorarna!", "stalin": "Kamrater, se hur de profitthungriga folkförtryckarna i den borgerliga regeringen svälter ut arbetarklassen med sin usla a-kassa. Jag ler i graven åt deras lögnaktiga löften. Inga barn ska svälta medan de dekadenta klassfienderna firar sina skattelättnader. Rensa ut dessa hyenor innan de förgiftar hela samhället!"}, "date": "28 augusti, 07:45", "url": "https://arbetet.se/2026/08/28/ga-inte-pa-jimmie-akessons-bluff-om-a-kassan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28074336/louise.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Kungen om Harald: Stor sorg", "summaries": {"normal": "Norges kung Harald har avlidit. Sveriges kung Carl Gustaf uttrycker stor sorg och beskriver honom som en god vän till Sverige. Hovet utlyser hovsorg från 30 augusti. Statsminister Kristersson och Socialdemokraternas Magdalena Andersson hyllar Haralds roll som en samlande kraft i Norden. Regeringen flaggar på halvstång.", "trump": "Lysande kung Harald, en riktig vinnare, har lämnat oss. Carl Gustaf skriver vackert om sin gamle vän, men låt oss vara ärliga – de nordiska kungarna borde ha byggt murar mot den woke-sjukan som sprider sig. Inga fler regnbågsflaggor på slottet! Haakon, lycka till, men skippa kvoterna och identitetspolitiken. Make Scandinavia Great Again!", "stalin": "En monark faller och borgarhyenorna gråter krokodiltårar. Jag ser hur de dekadenta hovparasiterna utlyser sorg för att dölja sin tomhet. Kamraterna i Norden borde rensa ut alla dessa förtryckande klassförrädare som klamrar sig fast vid kronorna. Haakon tar över – men utan folkets vilja är det bara en ny mask på samma gamla ansikte. Paranoia vakar!"}, "date": "28 augusti, 09:35", "url": "https://www.di.se/nyheter/kungen-om-harald-stor-sorg", "imageUrl": "https://static.bonniernews.se/ba/6ca145d2-10cf-4235-ac4c-45f368578cff.jpg?crop=4763%2C2679%2Cx0%2Cy97&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Vårdpersonal häktad för grov våldtäkt mot döende patient", "summaries": {"normal": "En sjuksköterska på Ryhov i Jönköping har häktats för grov våldtäkt mot en döende patient. Kollega slog larm, mannen flydde och kraschade under polisjakt. Offret avled kort därefter, troligen av sin sjukdom. Utredning pågår och regionen har gjort en anmälan till Ivo.", "trump": "Hör upp, Sverige! En sjuksköterska, en 'trygg och kunnig' sådan, åtalas för en vedervärdig gärning mot en döende kvinna. Otroligt! Han flydde i bil, kraschade – som en dåre. Vi har de bästa lagarna, det här skulle aldrig hända i USA. Fängsla honom på livstid!", "stalin": "Kamrater, vi har avslöjat en förrädare i sjukvården! En sjuksköterska, en så kallad 'trygg och kunnig' arbetare, har utnyttjat sin position för att begå ett grovt brott mot en döende patient. Detta är ett svek mot partiet och folket. Vi måste rensa ut dessa fiender! Den skyldige ska omgående straffas, för att visa att vi inte tolererar någon avvikelse från den socialistiska moralen. Allt annat är kontrarevolutionärt!"}, "date": "28 augusti, 11:40", "url": "https://samnytt.se/vardpersonal-haktad-for-grov-valdtakt-mot-doende-patient", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28100141/artikelhuvudbild-1-385.jpg"}, {"type": "image-full", "heading": "Norges kung är död: Detta händer nu", "summaries": {"normal": "Kung Harald av Norge har avlidit. Kronprins Haakon blir omedelbart ny kung medan Mette-Marit blir drottning och Ingrid Alexandra kronprinsessa. En sorgeperiod inleds, följt av ed inför Stortinget, tal till nationen och begravning i Oslo domkyrka. Kung Harald ska gravsättas i det kungliga mausoleet på Akershus slott.", "trump": "Hörni, den gamle norska kungen är borta, den svagaste kungen någonsin, och nu tar den fega kronprinsen över med sin fru som halva Norge hatar. Patetiskt! Jag som besegrade Biden och byggde den starkaste ekonomin i historien skulle ha fixat Norge på en vecka. Make Norway Great Again, eller hur?", "stalin": "Ännu en dekadent monark faller som en rutten gren i historiens storm. Jag ser hur dessa borgerliga parasitfamiljer klamrar sig fast vid sina tomma titlar medan folket lider. Den nye kungen är en ynklig efterföljare som inte förstår proletariatets kraft. Inga palats kan skydda mot folkets vrede när den vaknar."}, "date": "28 augusti, 10:13", "url": "https://www.tv4.se/artikel/bqEsvkZDX8eaI2md5SFJB/kung-harald-aer-doed-detta-haender-nu", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5oYw6D8vUyL69SyqpQyuVY%2F0d3e5195635438dde9aba8115398134a%2FsdlwN43Ld6FWc0-nh.jpg&width=1024"}, {"type": "image-right", "heading": "Ebba Busch klättrar i förtroende", "summaries": {"normal": "Ebba Busch har ökat sitt förtroende med åtta procentenheter och klättrar till tredje plats i Indikator Opinions mätning med 40 procent. Magdalena Andersson leder med 54 procent följd av Ulf Kristersson på 45. Jimmie Åkesson tappar till fjärde plats men behåller starkt stöd bland de som har mycket stort förtroende.", "trump": "Titta på den där svenska politikern Ebba Busch, hon klättrar som en raket, upp åtta punkter, folk älskar henne. Andersson och den där tråkige Kristersson ligger före men det här är stort. Åkesson har folkets verkliga kärlek, inte den fejkade typen. De svenska globalisterna och deras HBTQ-kvoteringsvansinne tappar mark. Fantastiskt!", "stalin": "Kamrater, se hur den svenska politiska cirkusen fortsätter. Jag betraktar med förakt hur dessa dekadenta klassförrädare tävlar om förtroende hos massorna. Ebba Busch stiger, men det är ändå en illusion skapad av borgerliga medier. Den sanna utrensningen av sådana opportunistiska element kommer förr eller senare. Historien ler mörkt."}, "date": "28 augusti, 09:39", "url": "https://riks.se/nyheter/ebba-busch-klattrar-i-fortroende", "imageUrl": "https://admin.riks.se/uploads/medium_bild_8359c15165.png"}, {"type": "image-full", "heading": "Spara till barn eller pension? Här bör pengarna gå först", "summaries": {"normal": "Sparekonom Felicia Schön råder föräldrar att prioritera den egna pensionen före barnsparande om ekonomin inte räcker till båda. Hon föreslår att dela upp sparandet, exempelvis 80 procent till pension och 20 procent till barnen. Barnsparande ses som ett privilegium och bör inte ske på bekostnad av förälderns trygghet. Genomsnittligt barnsparande bland Avanzas kunder ligger på 750 kronor i månaden.", "trump": "Folk, lyssna på mig, det här är en total katastrof för vanliga föräldrar. De giriga pensionshyenorna vill att ni ska glömma era egna barn medan de dekadenta eliterna i Bryssel och Wall Street skrattar. Sätt Amerika, eller Sverige, först! Pensionen går före, annars vaknar ni upp som förlorare när Biden-ekonomin har ätit upp allt. Fantastiskt råd faktiskt, men gör det stort!", "stalin": "Kamrater, se hur de profitthungriga klassparasiterna tvingar arbetande föräldrar att välja mellan sina barns framtid och sin egen ålderdom. Jag säger: prioritera den egna pensionen, annars blir ni utblottade offer för de penninggalna borgarhyenorna. Ett sådant barnsparande är blott ett dekadent privilegium för de få. Rensa ut osäkerheten – staten och kollektivet kräver din trygghet först. Den som sviker detta förtjänar historisk förakt."}, "date": "28 augusti, 09:32", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508387-spara-till-barn-eller-pension-har-bor-pengarna-ga-forst", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4a80febb04b004a30200000000b004a302/2026/08/27/2387321/barn-pension.png"}, {"type": "image-right", "heading": "LIVE. Norges kung Harald V är död", "summaries": {"normal": "Norges kung Harald V avled 89 år gammal på Rikshospitalet i Oslo den 28 augusti efter en tids sjukdom. Han vårdades för blodbrist och en bakteriell infektion. Familjen var samlad vid hans sida. Statsminister Jonas Gahr Støre och Sveriges kung Carl XVI Gustaf uttryckte stor sorg. Kronprins Haakon efterträder sin far som kung.", "trump": "Hörni, den där norska kungen Harald, en riktig gammal viking, har nu checkat ut. 89 år, inte illa. Men de där dekadenta nordiska globalisterna med sina HBTQ-parader och kvotergalenskaper kommer sakna en riktig man som stod stadigt. Haakon tar över – lycka till, grabben. Amerika först, men ni norrmän var alltid bra killar. Sad!", "stalin": "Ännu en monarkisk parasit har slutat sin verkningslösa existens. Dessa dekadenta arvshundar från den gamla ordningen vittrar bort som röken från en utrensad fiende. Det norska folket borde nu rensa ut alla kvarvarande klassförrädare som hyllar sådana figurer. Jag betraktar det med den sunda misstänksamhet som alltid krävs mot folkförtryckande rester från det förgångna."}, "date": "28 augusti, 09:10", "url": "https://www.svt.se/nyheter/utrikes/norges-kung-harald-v-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.42/c7bb99f34d3da3d175e13cc494656c539474c03d0fb50149106b2f970c457bb8"}, {"type": "image-full", "heading": "Kungen om Harald: ”Exceptionell”", "summaries": {"normal": "Norges kung Harald har avlidit, 87 år gammal. Sveriges kung Carl Gustaf uttrycker stor sorg och hyllar hans exceptionella levnadshistoria – från krigsbarn till idrottsman och samlande statschef. Hovsorg har utlysts i Sverige, och kondoleanser strömmar in från både kung Charles och statsminister Kristersson, som kallar Harald en trygg nordisk kraft.", "trump": "Jag har hört att kung Harald av Norge är död. En fin kille, men han var ingen vinnare som mig. Jag hade större publiksiffror på mina möten än han någonsin haft på ett slott. Norge sörjer, men de borde sörja att de inte har mig som kung! Stora kondoleanser, väldigt stora.", "stalin": "Kamrater, den norske kungen Harald har lämnat oss. Vi beklagar förlusten av en reaktionär monark, men låt oss inte glömma: hans folk har nu en chans att rensa ut kungahusets parasiter. Vaksamhet är nödvändig – imperialistiska agenter försöker stärka monarkin. Vi sänder inga kondoleanser, bara övervakning."}, "date": "28 augusti, 09:05", "url": "https://www.gp.se/nyheter/varlden/kungen-om-harald-exceptionell.64ff2ea9-69f9-46fa-80cb-426b3b872d57", "imageUrl": "https://www.gp.se/images/article/64ff2ea9-69f9-46fa-80cb-426b3b872d57/images/1rg3hcZBzc5_-tyQuzOaYU06lP00-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hela Norges ”bestefar” – enande i krig och kris", "summaries": {"normal": "Kung Harald V, Norges monark sedan 1991, har avlidit. Han var den förste norskfödde prinsen på 567 år och enade landet genom krig, ockupation och kris. De senaste åren präglades av skandaler kring kungahuset som urholkade folkets förtroende, trots att stödet för Harald själv förblev starkt. Han blev 88 år.", "trump": "Lyssnar ni på det här? Den gamle norske kungen Harald, en riktig tuffing från kriget, höll ihop hela Norge i 35 år. Sen kommer hans familj och förstör allt med schamaner, misshandelsgrejer och Epstein-kontakter. Typiskt dekadenta kungliga snobbar som inte kan hålla sig borta från skandalerna. Sad! Men folket älskade honom ända till slutet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i det norska kungahuset förvandlar en symbol för nationell enighet till en farsartad skandalorkester. Schamaner, misshandel och kontakter med sexförbrytare – typiskt för de giriga hyenornas värld. Folket genomskådar era löjliga maskerader. Historien ler mörkt mot er."}, "date": "28 augusti, 09:04", "url": "https://www.di.se/nyheter/hela-norges-bestefar-enande-i-krig-och-kris", "imageUrl": "https://static.bonniernews.se/ba/4de1fb7b-8a92-4bb5-a0a0-cb15cd60cac2.jpg?crop=6000%2C3375%2Cx0%2Cy313&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Hanif Bali polisanmäler S för att ha köpt röster", "summaries": {"normal": "Hanif Bali har polisanmält Socialdemokraterna efter att influeraren Eleonore Stokholm uppgivit att hon erbjöds 150 000 kronor för att spela entusiastisk S-väljare på Instagram. Bali anser att det kan röra sig om otillbörligt verkande vid röstning, ett brott som kan ge upp till fyra års fängelse. Socialdemokraterna förnekar anklagelserna.", "trump": "Folk, ni skulle se det här! De korrupta socialisterna i Sverige försöker köpa röster som billiga bedragare. 150 000 kronor till influencers för att ljuga om att de röstar på dem? Det är riggat valsystem på steroider. Patetiska förlorare. I mitt Amerika hade vi redan städat ut de här röstköparna. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom socialdemokratin försöker muta folket med blodspengar för att säkra sina lögner. Jag ler i graven åt deras fega försök att köpa röster. En sådan handling förtjänar snar utrensning och folkets vrede. Inga parasiter får hota arbetarklassens vilja."}, "date": "28 augusti, 08:42", "url": "https://www.friatider.se/hanif-bali-polisanmaler-s-att-ha-kopt-roster", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-771.jpg?itok=6jPBHgfD"}, {"type": "text", "heading": "Dadgostar står fast vid regeringskrav", "summaries": {"normal": "Nooshi Dadgostar kräver en S-V-MP-regering
