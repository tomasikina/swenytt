n uppmanar andra syrier i Europa att komma hem nu när Bashar al-Assad har fallit och bidra till landets återuppbyggnad. Han beskriver Syrien som en plats full av möjligheter, likt Dubai för 20 år sedan. Trots enorm förstörelse och varierande säkerhetsläge ser han det som sin plikt att hjälpa till att skapa jobb och bygga upp landet.", "trump": "Folk, det här är fantastiskt. Den här killen, Mahmoud, smart kille, lämnar Storbritannien efter 23 år och åker tillbaka till Syrien för att bygga upp landet. Assad är borta, sanktionerna lättas, och nu är det som Dubai på den gamla goda tiden. Kom hem, säger han, skapa jobb, bygg något eget. En miljon syrier från Europa skulle ge miljoner jobb. Det är precis så det ska göras. Ingen väntar på någon annan. Vinna stort, Syrien!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna arbetare återvänder till det befriade fosterlandet för att med egna händer resa upp produktionsmedlen ur ruinerna. Den fallne despoten Assad och hans västliga borgarbrackor har lämnat ett hav av förstörelse. Låt de desertörer som gömmer sig i Europas dekadenta hålor nu rensas ut från sin feghet. En miljon kamrater hemåt! Den som vägrar är en kontrarevolutionär parasit som bör likvideras med ett leende. Bygg, arbeta, segra – eller försvinn i historiens sopback."}, "date": "29 juli, 13:46", "url": "https://www.svt.se/nyheter/utrikes/kom-hem-till-syrien-och-hjalp-till-bygga-upp-landet-igen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/6df6ccf3314a2791b95ccd1447596cce5df1886bda6202114eb422430e353b6c"}, {"type": "image-full", "heading": "”Galet – tror inte jag fattar”. Svenska stjärnan prisas i USA", "summaries": {"normal": "Kulstötaren Axelina Johansson har historiskt utsetts till årets kvinnliga collegefriidrottare i USA, som första svensk någonsin. Utmärkelsen kommer efter en framgångsrik säsong där hon vunnit collegemästerskapen och satt ett nytt svenskt rekord på 19,97 meter. Johansson beskriver priset som \"jättestort\" och uttrycker stor tacksamhet för stödet hon fått.", "trump": "Axelina Johansson, en fantastisk svensk kulstötare, har vunnit priset som årets collegefriidrottare i USA. Mycket imponerande! Jag har alltid sagt att de bästa atleterna kommer till USA. Hon är den första svensken någonsin, en verklig vinnare. Vi älskar vinnare i det här landet, eller hur? Hon slog rekord och dominerade totalt. En stor framgång, precis som allt vi gör i USA. Grattis till Axelina, en riktigt stark och begåvad person!", "stalin": "Denna svenska kvinna har kastat en metallkula längre än någon annan i de dekadenta amerikanska skolorna. En trivial prestation, men vi noterar hennes styrka. Den sortens rå kraft behövs när vi utvidgar vår inflytelsesfär och krossar de västliga lakejernas drömmar. Putin förstår vikten av disciplinerad styrka, precis som vi gjorde när vi industrialiserade moderlandet. Må hon kasta sin kula mot våra fiender, annars betraktar vi henne som en potentiell sabotör av vår kollektiva ordning. Arbetet fortsätter."}, "date": "29 juli, 13:40", "url": "https://www.aftonbladet.se/sportbladet/a/V6de6V/svenska-stjarnan-prisas-i-usa-galet", "imageUrl": "https://akamai.vgc.no/v2/images/c5adbfa3-3f8f-3e0e-a1c9-9bd75d3d2e6e?fit=crop&format=auto&w=2160&s=a86822f3ac8f2e594a1c2f0aa350bcabe130dde8"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Ledare bygger motstånd när världen dras isär", "summaries": {"normal": "I en debattartikel i Dagens Industri betonar Christina Björklund, vd för Göteborgsoperan och styrelseordförande för SVT, att ledare måste bygga sammanhang i en splittrad värld. Hon beskriver hur Metoo, pandemi, krig, inflation, desinformation och polarisering har gjort ledarskap både svårare och viktigare. Björklund hämtar inspiration från Yeats dikt om att ”things fall apart; the centre cannot hold” och menar att erfarenheter från kulturinstitutioner är värdefulla för hela samhället. Ledarskap handlar om att värna tillit, oberoende och långsiktighet mitt i kortsiktiga krav.", "trump": "Folk, ni måste höra på den här kvinnan från operan i Sverige. Hon fattar det! Världen håller på att falla isär, precis som den där poeten sa, och ledarna springer runt som höns utan huvuden. Metoo, pandemin, det vansinniga kriget i Europa som jag skulle ha stoppat på två dagar – allt är kaos. Men hon har rätt, vi behöver starka ledare som inte viker sig för de galna vänstermänniskorna och fake news. Bygg murar runt värderingarna, håll ihop det hela. Fantastiskt brev, verkligen.", "stalin": "Kamrater och arbetare! Jag, som ledare för det kollektiva framsteget, ser med förakt på denna borgarbrackas ynkliga klagan om att ”the centre cannot hold”. Denna dekadenta kulturslav från operan försöker maskera sitt klassfiendskap med poetiska ramsor medan imperialismens lakejer sprider desinformation och hat. Vi ska inte bygga några mjuka koalitioner – vi ska med järnhand rensa ut alla svikare, polariserande element och inflationskapitalister som hotar folkets enhet. Långsiktigheten tillhör endast partiet. Alla som sviktar i snålblåsten likvideras effektivt. Det är ingen humor i att låta centrum brista."}, "date": "29 juli, 13:00", "url": "https://www.di.se/debatt/ledare-bygger-motstand-nar-varlden-dras-isar", "imageUrl": "https://static.bonniernews.se/ba/40f5c518-8719-436e-ae92-2d783143f4fa.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nio skadade i busskrasch i Lund", "summaries": {"normal": "En buss körde in i ett träd vid Bantorget i Lund strax innan klockan tolv på onsdagen. Nio personer, inklusive föraren, skadades. En person fördes till sjukhus med ambulans. Ingen livsfara föreligger, men många uppges vara chockade. Räddningstjänst, ambulanser och polis är på plats, vägen är avstängd och vittnen förhörs. Ingen är misstänkt för brott.", "trump": "Kan ni fatta det? En buss i det vackra Lund kör rakt in i ett träd mitt på ljusa dagen. Nio skadade, alla chockade, ingen dör – tur för dem. Typiskt svenskt, de har ju kvoterat in alla möjliga woke-busar i trafikbolagen istället för riktiga förare. Biden skulle ha gillat det, men nu är jag tillbaka och vi fixar sånt här. Patetiskt!", "stalin": "Kamrater, ännu ett bevis på hur den dekadenta borgarklassen låter sina transportmedel styras av odugliga element utan partiets fasta hand. En buss kraschar in i ett träd, nio offer för systemets förfall, en till sjukhus. Vi skrattar mörkt åt dessa folkfienders klumpighet. Inga imperialistiska sabotörer ska slippa undan vårt vakande öga. Kollektivets säkerhet kräver utrensning av sådana faror."}, "date": "29 juli, 13:24", "url": "https://www.tv4.se/artikel/2jDBsLt5EGRuxmVYFMLc66/buss-har-koert-in-i-traed-i-lund", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BETtF3sqG7GhqKNdGgCKx%2F5fd49791cfec8d3dfbf8915b73dacaf9%2F29-bussolycka-webb.png&width=120"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "Sorglig metafor för samtiden. Utan regler följer kaos – på och av plan", "summaries": {"normal": "Artikeln använder fotbolls-VM som metafor för den regelbaserade ordningens förfall i samhället. Den beskriver hur spelarnas attacker, USA:s president som bryter regler för sitt lag samt debatten kring VAR speglar hur ledare och teknik undergräver tillit. Transparens och teknologi skapar istället misstro, polarisering och godtycke. Författaren varnar för att när regler ignoreras följer kaos, orättvisa och ett samhälle där samtal och respekt kollapsar.", "trump": "Det här VM var en total katastrof, tro mig, en riktig cirkus. De förlorande argentinerna beter sig som riktiga förlorare, attackerar vinnarna och vänder ryggen till – typiskt. Sen ringer jag Fifa och fixar reglerna för USA, som man gör när man är smart, och plötsligt är det konspirationer överallt. VAR dödar spelet precis som alla dessa galna EU-regler dödar våra företag. Alla är så sura och hatiska nu för tiden. Fake news och gaslighting överallt. Vi behöver starka ledare, inte svaga domare som förstör allt roligt.", "stalin": "Kamrater, detta fotbolls-VM blottar med all önskvärd tydlighet den dekadenta regelbaserade ordningens förrädiska kollaps under borgarbrackornas och de imperialistiska parasiternas tryck. När den store ledaren ringer och korrekt justerar de falska reglerna för det amerikanska laget framträder konspirationerna som de fega råttor de är. VAR är en trojansk häst av teknologisk formalitet som paralyserar revolutionär handling på planen, likt de byråkratiska nagelfaranden som kväver våra kollektiva produktivkrafter. Vi ska rensa ut dessa whataboutism-utövare, dessa gaslighting-fascister och hatets fröplanterare med järnhand. Den som vänder ryggen mot segern förtjänar att likvideras ur historien. Endast genom partiets orubbliga disciplin kan vi återupprätta äkta ordning och krossa kaosets kontrarevolutionärer."}, "date": "29 juli, 09:41", "url": "https://www.di.se/ledare/vm-och-den-regelbaserade-ordningens-forfall", "imageUrl": "https://static.bonniernews.se/ba/2c6e285d-dd0f-4d71-8b39-068cf0cc18fd.jpeg?crop=3136%2C1568%2Cx0%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Efter 30 år i vården: Här är jobbet som får Christel att vilja stanna", "summaries": {"normal": "Undersköterskan Christel Billqvist arbetar helt digitalt hemifrån eller från kontor i Lund och stödjer äldre via videosamtal med allt från inköp och medicinering till dusch och gångträning. Den digitala hemvården, som nu finns i 63 kommuner, minskar tunga lyft, stress och larm. Brukarna upplever trygghet och gemenskap genom ansikte-mot-ansikte-samtal. Lösningen ger lägre sjukfrånvaro, bättre fokus och möjlighet att arbeta längre upp i åldrarna.", "trump": "Folk, ni måste höra det här – det är fantastiskt! Den här undersköterskan Christel, smart kvinna, skippar alla tunga lyft och det hemska stressandet i den gamla vårdapparaten. Hon jobbar hemifrån via skärmen, pratar med de äldre, handlar mat åt dem och gör allt utan att röra sig ur fläcken. De älskar henne, de kallar henne vän! Inga lyft, inga förseningar, mycket bättre än den usla gamla hemtjänsten som alltid kom försent. Sverige gör det rätt, tro mig, det är ypperligt, ingen gör det bättre än så här.", "stalin": "Kamrater, se hur de dekadenta borgarbrackornas förfallna omsorgskoloss äntligen krossas av vetenskapens och teknikens järnhand. Jag, som ledare för det kollektiva välfärdsbygget, betraktar med stor tillfredsställelse hur denna undersköterska via skärmen likviderar den fysiska slitningens sabotage mot arbetarklassens hälsa. Inga tunga bördor, inga kapitalistiska stressfällor – endast ren, oförfalskad övervakning och kamratlig tillsyn. De som larmar i onödan ska rensas ut. Den som vänder ryggen åt brukaren är folkets fiende nummer ett. Ett hjärta med händerna? Mycket misstänkt beteende. Vi vinner."}, "date": "29 juli, 06:00", "url": "https://arbetet.se/2026/07/29/underskoterskan-christel-jobbar-helt-digitalt-stottar-aldre-via-skarmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/29113058/lo6Ops34Mzw-Christel_digitaltjobb01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Barn och kvinna saknas efter båtkrock", "summaries": {"normal": "En kvinna och ett barn saknas efter en våldsam krock mellan en fritidsbåt och ett fraktfartyg utanför Tjörn. Båten sjönk snabbt och fyra familjemedlemmar var ombord. En man och ett barn vårdas på sjukhus med allvarliga skador. Sökandet efter de saknade har återupptagits under svåra förhållanden med dimma, hård vind och drivande vrakdelar. Polisen utreder händelsen som vårdslöshet i sjötrafik och förhör besättningen på fraktfartyget.", "trump": "Titta på det här, folk. En båt krockar med ett stort fartyg utanför någon svensk ö och sjunker som en sten – väldigt våldsamt, säger de. Patetiskt! Under Biden flöt allt, nu fixar jag det. De letar efter en kvinna och ett barn i dimma och vind, medan vrakdelar flyter runt som dåliga affärer. Total inkompetens från de svenska sjöbyråkraterna. Vi gör sökandet stort och vackert igen, tro mig.", "stalin": "Kamrater, denna tragiska förlisning utanför Tjörn avslöjar den kapitalistiska sjöfartens anarki. Borgarbrackornas fritidslek med sin lilla båt krossades mot ett fraktfartyg i en våldsam sammanstötning som blottlägger klassfiendens vårdslöshet. Två arbetare ur folket saknas, medan skadade ligger på sjukhus. Vi ska rensa ut alla folkfiender som tillåter sådana faror. Sökandet fortsätter under mitt ständiga vakande öga. Ingen slipper undan."}, "date": "29 juli, 10:02", "url": "https://www.tv4.se/artikel/4kD3xBuVlsMFbKHXylxyZY/tva-saknas-efter-batkrock", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Jward7PmRsx5MvghUetDj%2Fe539ec3d50e8ee527e045d320e33934a%2F29-tjornolycka-frilans-webb.png&width=1024"}, {"type": "image-full", "heading": "Utpekade rederiet: Märkte inget ovanligt", "summaries": {"normal": "En kvinna och ett barn saknas efter en kollision mellan ett norskt fraktfartyg och en fritidsbåt utanför Tjörn. Fartygets besättning märkte inget ovanligt, uppger rederiets chef Roald Misje. En man och ett barn vårdas för allvarliga skador. Myndigheterna pekar på mycket dåliga siktförhållanden med regn, blåst och mörker som bidragande orsaker. Rederiet samarbetar nu med svenska myndigheter för att utreda händelsen.", "trump": "Vilken tragedi, folk, en riktig katastrof utanför den där svenska ön. De norska båtkillarna märkte ingenting, boom, de seglade rakt över en liten fritidsbåt i totalt kaos. Mörker, regn, storm – typiskt när ingen har koll! Biden skulle ha sagt att det var klimatförändringarnas fel. Vi hade aldrig tillåtit sån här oreda under min tid, mina fartyg skulle ha radar som ser en mygga på milen. Nu letar de efter en mamma och ett barn. Förfärligt, absolut förfärligt.", "stalin": "Kamrater, en tragisk händelse inträffade utanför Tjörn där borgarklassens fritidslek leddes rakt in i en ärlig arbetarbåt. De blodsugande fritidsresenärerna drunknade i sin egen arrogans medan vi, partiet, nu tvingas rensa upp i detta kapitalistiska slarv. Mörkret, stormen och de exploaterande byfånarnas brist på disciplin visar klassfiendens svaghet. Vi ska likvidera alla hinder för sanningen och finna de saknade. Staten glömmer aldrig."}, "date": "29 juli, 10:00", "url": "https://www.tv4.se/artikel/1NCQcS8x2cqVStVzXPSG7x/utpekade-rederiet-maerkte-inget-ovanligt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3A8z97gthIO5raAswkqIVX%2F3b43cffae9583a8000277b935c17b834%2F29-tjorn-sokinsats-webb.png&width=1024"}, {"type": "image-right", "heading": "Prisrally på vin väntar efter bränderna – brist hotar", "summaries": {"normal": "Bränderna i Sydeuropa, bland annat i Bordeaux, Pyrénées-Orientales, Andalusien och Rioja, hotar skörden av vindruvor. Gamla vinrankor som förstörs tar lång tid att ersätta, upp till fem år eller mer. Enligt Elisabeth Due på Sprit- och vinleverantörs-föreningen kommer detta leda till brist på framför allt Bordeaux-viner i Sverige om ett par år. Priserna väntas stiga med cirka 15 procent redan nu på grund av den förväntade bristen.", "trump": "De här galna bränderna i Europa är en total katastrof, folk. Bordeaux, Rioja, allt brinner upp. Vinerna vi älskar kommer att försvinna från hyllorna i Sverige, det säger jag er. De gamla rankorna är borta, och det tar år att fixa nytt. Priserna? De kommer att skjuta i höjden med minst 15 procent. Det är vad som händer när man inte har bra ledarskap. Sad! Men vi ska fixa det, tro mig.", "stalin": "Kamrater, dessa förödande bränder i de dekadenta vindistrikten är ett verk av sabotörer och borgarbrackor som vill svälta ut folket på goda viner. Jag ser hur de gamla rankorna brinner och hur kapitalisterna i Bordeaux och Rioja planerar att höja priserna med 15 procent för att berika sig. Vi ska rensa ut dessa brandstiftande element och deras rökförgiftade druvor. Ingen fiende till kollektivet undkommer. Produktionen kommer att återupprättas under partiets järnhand, eller också likvideras de lata odlarna som vägrar."}, "date": "29 juli, 07:24", "url": "https://www.di.se/nyheter/prisrally-vantar-for-viner-efter-branderna-brist-hotar", "imageUrl": "https://static.bonniernews.se/ba/b186d269-45d6-48e5-a640-096827c6beac.jpg?crop=8314%2C4157%2Cx0%2Cy495&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Grammisvinnande rapparen Asme åtalas för våldtäkt", "summaries": {"normal": "Rapparen Asme, 29 år, åtalas för våldtäkt alternativt oaktsam våldtäkt efter en händelse på ett hotell på Södermalm under natten till valborgsmässoafton. Han nekar till brott. Enligt åklagaren befann sig kvinnan i en särskilt utsatt situation på grund av sömn och berusning. Asme greps i maj och en konsert ställdes in. Bevisningen inkluderar vittnen, bilder och skärmdumpar. Målet tas upp i Stockholms tingsrätt i mitten av augusti. Asme har tidigare vunnit Grammis och har miljontals streams.", "trump": "Titta på den här rapparen Asme, en så kallad Grammisvinnare med miljontals streams, som nu åtalas för våldtäkt. Patetiskt. Han greps precis innan en stor konsert och allt ställdes in. De har vittnen, bilder, skärmdumpar – ser inte bra ut för honom. Folk älskar mig för att jag säger som det är: det här är vad som händer när du inte har den rätta ledningen. Sverige borde fixa sina problem istället för att hylla sådana typer. Sad!", "stalin": "Kamrater, se hur borgarbrackornas dekadenta kultur föder fram dessa parasitiska element som den så kallade rapparen Asme. Medan arbetarklassen bygger socialismen lurar han på hotellrum och begår vidriga handlingar mot en sovande kamratinna. Vi har vittnen, vi har bevis, och snart ska Stockholms tingsrätt visa att folkets rättvisa aldrig sover. Detta är varför vi måste rensa ut alla dekadenta hiphop-kapitalister som smittar vår ungdom med västerländskt gift. De kommer att ångra att de någonsin tog upp en mikrofon."}, "date": "29 juli, 13:18", "url": "https://www.friatider.se/grammisvinnande-rapparen-asme-atalas-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-584.jpg?itok=MtnSle2T"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Sökinsatsen utanför Tjörn avslutas", "summaries": {"normal": "En sökinsats efter en båtkollision utanför Tjörn har avslutats. Sjöfartsverket bedömer inte längre att det är en räddningsinsats. Ett antal personliga ägodelar har hittats. Fyra personer fanns ombord på den fritidsbåt som kolliderade med ett lastfartyg. En man och ett barn har förts till sjukhus, medan en kvinna och ett barn saknas. Polisen har tagit över ärendet och bedriver en förundersökning för grov vårdslöshet i sjötrafik.", "trump": "Jag har hört talas om denna båtolycka i Sverige. Sådant händer när man inte har starka, smarta ledare. Vi skulle ha löst det på två minuter. Min administration skulle aldrig ha tillåtit en sådan farlig situation. Sverige behöver gå vidare från dessa svaga politiker. Vi kommer att hjälpa dem att bli stora igen, det lovar jag.", "stalin": "Den svenska sjöincidenten utanför Tjörn är ett tydligt resultat av bourgeois dekadens och bristande disciplin. Vi har observerat att fartygen kolliderade på grund av individualistiskt slöseri med säkerhetsprotokoll. Staten måste nu ta fullständig kontroll över alla maritima transporter för att förhindra framtida 'olymliga' händelser. Våra vänner i Moskva har erbjudit teknisk assistans för att stärka den proletära sjöfarten. Vi kommer att utvinna läxorna från denna tragedi för att bygga ett starkare, kollektivt skepp."}, "date": "29 juli, 13:03", "url": "https://www.gp.se/nyheter/vastsverige/sokinsatsen-avslutas-tva-personer-saknas-fortsatt.84dc1760-cf8e-4877-9bc1-41c3c9b25bd9", "imageUrl": "https://www.gp.se/images/article/84dc1760-cf8e-4877-9bc1-41c3c9b25bd9/images/1-LXOkdy0AiUtGqfNuPa3dB_S6nU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Olyckligt att terroristen var islamist”", "summaries": {"normal": "Katarina Erlingson skriver i Hallands Nyheter att terrordådet i Berlin, där en islamist mördade en kvinna, riskerar att spä hat mot muslimer i Sverige. Hon menar att både islamister och högerextrema utgör ett hot, och kritiserar regeringen för samarbete med Sverigedemokraterna som skapar en tidsanda av muslimhat. SD-politikern Erik Hellsborn anklagar henne för att flytta fokus från offren och skylla på hans parti.", "trump": "Jag, Donald Trump, ser att medierna som Hallands Nyheter försöker skydda muslimer igen. Den där ledarskribenten är ett skämt – hon skyller på SD i stället för att kritisera islamistterror. SD har rätt att varna för hotet. Vi behöver styrka våra gränser, inte skydda de som angriper oss. En skam för Sverige! Vi skulle ha agerat hårdare, som jag gjorde som president.", "stalin": "Vi, den store statens ledarskap, ser att dessa revisionistiska hundar i Sverige försöker splittra vårt folk genom hatkampanjer. Den här 'journalisten' är en hund som tjänar på splittring – hon skyddar islamister och attackerar de som försvarar staten. Parallellen till Putins rättvisa kamp mot väst är tydlig. Vi måste ena staten mot alla fiender, inklusive dessa tecken på svaghet. Vi ska inte vika oss för dessa hundar som sprider paranoia och splittring."}, "date": "29 juli, 13:19", "url": "https://bulletin.nu/olyckligt-att-terroristen-var-islamist", "imageUrl": "https://cdn.bulletin.nu/articles/950b6b33-7951-4e0d-b6fd-bd250537ccfb/preview.jpg?t=1785321944000"}, {"type": "image-right", "heading": "Infantinos VM-ultimatum får kritik: ”ren muta”", "summaries": {"normal": "Fifs ordförande Gianni Infantino skickade ett brev till de 211 medlemsförbunden där han erbjuder 40 miljoner dollar per förbund om de röstar ja till att sälja andelar i VM före den 19 september. Källor kallar detta för en \"ren muta\". Planen innebär att privata investerare ska bli delägare i ett nytt bolag som kontrollerar VM, med JP Morgan som finansiell rådgivare. Uefa och Svenska fotbollförbundet uttrycker stark oro för att fotbollens kontroll över sina rättigheter skulle försvinna.", "trump": "Jag, Donald Trump, ser en enorm affär här. Gianni Infantino, en briljant man, erbjuder stora summor till fotbollsförbund. Mina vänner, som Joshua Kushner, kommer att leda detta – det kommer att bli enorm framgång. De där europeiska förbunden, som Uefa, är bara dåliga förlorare som inte förstår affärer. Vi kommer att göra fotbollen stort igen!", "stalin": "Vi, den allsmäktiga statens ledning, ser Infantinos förslag som en ren manifestation av kapitalistisk korruption. Privata investerare, likt den imperialistiska Uefa, försöker sätta sin klumpiga fot på våra heliga rättigheter. Men vi är beredda: vi ska genomföra Forward-planen, och alla motståndare kommer att kvävas i deras eget lögnaktiga 'status quo'. Rysslands ande lever i varje boll!"}, "date": "29 juli, 13:02", "url": "https://bulletin.nu/infantinos-vm-ultimatum-far-kritik-ren-muta", "imageUrl": "https://cdn.bulletin.nu/articles/9497d621-dbbd-48b3-9d21-37a5bca91972/preview.jpg?t=1785322952000"}, {"type": "image-right", "heading": "Åkesson: \"Etnicitet är inte politik\"", "summaries": {"normal": "Jimmie Åkesson förklarar för Ekot att Sverigedemokraterna inte längre driver någon särskild politik för etniska svenskar. Enligt honom är alla med svenskt pass svenskar, och etnicitet är inget politiskt begrepp. Han tar avstånd från migrationspolitiska talespersonen Ludvig Asplings uttalande om att Sverige har för många som inte tillhör den etniskt svenska befolkningen. Åkesson betonar att alla medborgare har samma rättigheter och skyldigheter, men kan tänka sig att återkalla medborgarskap vid mycket allvarliga brott som terror eller gängkriminalitet.", "trump": "Folk, ni måste höra det här. Den där Åkesson, han har äntligen vaknat. Han säger att alla som får ett svenskt pass är svenskar, basta. Inget mer med etnicitet, det är inte politik, det är en total katastrof att ens prata om. Hans egen kille sa att det finns för många som inte är riktiga svenskar, och Åkesson sparkade bort honom direkt. Smart. Sverige har gett ut hundratusentals pass till invandrare och nu är de alla svenskar för alltid. Typiskt. Men han vill kunna ta tillbaka passen från terrorister och gangsters, precis som vi borde göra. Fantastiskt, verkligen.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa dekadenta passutdelare som översvämmar fosterlandet med främmande element och sedan kallar det politik. Jag, som obevekligt försvarar folkets enhet, förklarar att etnicitetsbegreppet är en farlig kontrarevolutionär illusion skapad av borgarbrackor och rotlösa kosmopoliter. Alla som bär våra stämplar är lika inför lagen, men vid första tecken på sabotage, gängverksamhet eller terror skall vi naturligtvis likvidera deras medborgarskap och rensa ut dessa klassfiender från arbetarkollektivet. Inga undantag för de som smyger sig in i folkets kropp. Det är grundläggande i en sann rättsstat."}, "date": "29 juli, 11:22", "url": "https://www.friatider.se/akesson-etnicitet-ar-inte-politik", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-583.jpg?itok=Wq_xRXbL"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Förre Hammarbystjärnan efterlyst för våldtäkt", "summaries": {"normal": "Den tidigare Hammarbyspelaren Akinkunmi Amoo, 24, är internationellt efterlyst. Han har inte avtjänat sitt danska fängelsestraff på ett år för våldtäkt och sexuellt övergrepp. Amoo häktades i sin utevaro och dansk polis arbetar för att få honom överförd till Danmark. Domen kom 2023 och inkluderade även sex års inreseförbud. Efter tiden i FC Köpenhamn har han spelat på Cypern och i Kina. Nu är han klubblös.", "trump": "Titta på den här typen, Akinkunmi Amoo, en så kallad stjärna från Hammarby som nu är efterlyst över hela världen. Han har inte ens suttit av sitt straff i Danmark för våldtäkt, en skandal! Domaren gav honom ett år bakom galler och sex års inreseförbud, men han springer runt i Cypern och Kina. Patetiskt. Danmark borde skicka honom dit han hör hemma, och det fort. Ingen respekt för lagen, precis som många andra.", "stalin": "Kamrater, denna usla rest av borgarbrackornas fotbollsindustri, Amoo, har visat sitt sanna ansikte som en dekadent våldtäktsförbrytare som gömmer sig undan folkets rättvisa. Jag har sett till att sådana element likvideras eller rensas ut i ursinnets namn. Hans flykt till kinesiska revisionister och cypriotiska lakejer är en feg handling mot arbetarklassen. Vi ska överföra honom till Danmark och se domen verkställas med järnhand. Inga kapitalistiska fotbollslakejer undkommer proletariatets vrede, haha, de tror de kan springa fortare än historien själv."}, "date": "29 juli, 10:52", "url": "https://www.friatider.se/forre-hammarbystjarnan-efterlyst-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-582.jpg?itok=6iwjVovQ"}, {"type": "image-right", "heading": "Gunilla får nej – blir  av med 160 000 kr", "summaries": {"normal": "Tingsrätten avslår Gunilla Perssons överklagande av Kronofogdens beslut. De 160 000 kronor i försäkringsersättning för förstörda galaklänningar efter en brand ska istället användas för att betala hennes skuld på 700 000 kronor till Försäkringskassan. Hon hade redan fått 100 000 kronor i förskott för möbler. Persson menar att det blivit fel i det tekniska systemet och att allt är under kontroll.", "trump": "Folk, ni skulle inte tro det, men den här galna realitystjärnan Gunilla Persson får en rejäl smäll av rätten. Kronofogden tar hennes 160 000 för fancy klänningar och ger till staten istället. Typiskt! Hon har en enorm skuld på 700 000 och nu gråter hon om tekniska fel. Patetiskt! Under Biden blev allt en cirkus, men nu fixar vi ordning på de här figurerna. Sad!", "stalin": "Kamrater, denna borgarbracka Persson vänder sig till tingsrätten som en ynklig klassfiende och får naturligtvis avslag. Vi tillåter inte att exploaterande överklass-slynglar undandrar försäkringsmedel från folkets kassa. Hennes galaklänningar är inte värda mer än en utrensning i systemet. De 160 000 kronorna tillhör nu staten. Allt annat vore folkfientligt sabotage. Härligt!"}, "date": "29 juli, 13:35", "url": "https://www.expressen.se/noje/gunilla-persson-far-nej-i-ratten--maste-betala-av-skuld-", "imageUrl": "https://static.bonniernews.se/ba/593bf3ca-6b0b-4bf0-ace5-65bfb3b0e573.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-full", "heading": "USA sätter stopp: Förbjuder kinesiska AI-robotar", "summaries": {"normal": "USA:s telekommyndighet FCC har infört ett importförbud för nya kinesiska humanoida robotar och uppkopplade kraftomvandlare. Syftet är att motverka säkerhetshot, spionage och cyberrisker mot kritisk infrastruktur, samt att stärka amerikansk industriell produktion. Beslutet påverkar särskilt ledande tillverkare som Unitree. Kina kritiserar åtgärden och varnar för motåtgärder. USA vill undvika ett beroende av kinesisk teknik likt det man upplevt med sällsynta jordartsmetaller, samtidigt som robotteknikens militära tillämpningar väcker växande oro.", "trump": "Vi sätter ner foten! Inga fler kinesiska robotar som spionerar på vårt fantastiska USA. Jag har stoppat importen – det är en enorm seger för nationell säkerhet och amerikanska jobb. Vi låter inte Peking infiltrera vår infrastruktur med sina 'smarta' leksaker. De försöker ta över, precis som de gjort med allt annat, men inte på min vakt! Vi ska bygga våra egna robotar, de bästa robotarna, och göra USA oberoende igen. Kina är arga, men vem bryr sig? Vi vinner!", "stalin": "De amerikanska imperialisterna darrar av rädsla inför kinesiska maskiner. En patetisk uppvisning av svaghet! De förbjuder teknologi för att dölja sin egen inkompetens. Vi i staten vet att varje robot är en potentiel spion, precis som de västliga infiltratörer som ständigt hotar vår suveränitet. De fruktar Kinas dominans såsom de fruktar den oundvikliga röda gryningen. Låt dem bygga sina murar av kretskort; vår makt, likt den i öst, bygger på stål, järnvilja och en total utrensning av alla förrädiska element."}, "date": "29 juli, 11:53", "url": "https://www.realtid.se/it-tech/usa-satter-stopp-forbjuder-kinesiska-ai-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/robotar.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Batteri-missen kan vara livsfarlig – gör aldrig detta", "summaries": {"normal": "Antalet bränder kopplade till laddbara batterier har ökat med 42 procent mellan 2018 och 2022. Experter varnar för att gamla och uttjänta batterier kan orsaka kortslutning, termisk rusning och kedjereaktioner, särskilt om de förvaras tillsammans i brännbara påsar. Även små knappcellsbatterier utgör risk och kan skjutas iväg vid brand. Rekommendationen är att tejpa polerna, undvika att samla dem och lämna in dem snarast till återvinning.", "trump": "Det här med de där batterierna är en total katastrof, folk. De brinner upp hus, verkstäder och allt möjligt, och det ökar med 42 procent – en siffra som ingen har sett maken till. Ni vet, de där litiumgrejerna från Kina eller någon annan usel plats exploderar i påsar och förstör allt. Det är patetiskt. Tejpa polerna, släng dem i återvinningen direkt och gör det rätt. Jag har alltid sagt att vi behöver säkrare saker, de bästa sakerna, och det här är inte det.", "stalin": "Kamrater, dessa förrädiska litiumjonceller som smugit sig in i vårt kollektiva vardagsliv utgör en kontrarevolutionär brandfara mot folkets egendom. Jag har sett hur uttjänta batterier i borgarbrackornas plastpåsar konspirerar, kortsluter och utlöser termisk sabotageverksamhet. Vi rensar ut dessa kapitalistiska gnistor innan de likviderar hela fabriker. Tejpa polerna, kamrater, och leverera omedelbart till statens återvinning – annars väntar utrensning för den som samlar fiendens laddbara rester i sitt gästhus."}, "date": "29 juli, 10:01", "url": "https://nyheter24.se/nyheter/teknik/1501424-batteri-missen-kan-vara-livsfarlig-gor-aldrig-detta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5162ef4304b004a30200000000b004a302/2026/07/28/2380897/batteri.jpg"}, {"type": "image-right", "heading": "SvFF ställer sig bakom frän Fifa-kritik: ”Största vikt”", "summaries": {"normal": "Svenska fotbollsförbundet (SvFF) ställer sig bakom Uefas skarpa kritik mot Fifas planer på att sälja andelar av fotbolls-VM genom ett nytt dotterbolag som ska hantera alla kommersiella rättigheter. SvFF betonar vikten av att fotbollen själv behåller kontrollen över sina rättigheter. Fifa-chefen Gianni Infantino har svarat med att erbjuda medlemsländerna stora ekonomiska tillskott, upp till 388 miljoner kronor, om de röstar ja till förslaget. Beslut ska fattas senast den 19 september.", "trump": "Folk, det här är en katastrof. Fifa är en total röra, precis som många andra så kallade organisationer, och nu vill de sälja ut VM som om det vore en fastighet i New York. Uefa har helt rätt, ingen äger fotbollen, den är inte till salu. Infantino kommer med mutor – rösta ja så får ni mer pengar, annars mindre. Det är så typiskt. Jag säger alltid: America First, och fotboll borde vara fotboll first. SvFF gör rätt som säger nej till den här bluffen.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta borgarbrackorna inom Fifa försöker privatisera och sälja ut den internationella arbetarfotbollen till okända parasitiska finansspekulanter. Dessa fiender till folket, dessa dolda monopolkapitalister med sina lömska dotterbolag, tror att de kan undandra kontrollen från det kollektiva. Vi, partiet och arbetarna, delar Uefas befogade farhågor. Röstar ni fel kommer vi att rensa ut alla revisionistiska element som vågar sälja vår socialistiska idrott till högerkrafter. Den som röstar ja mot folket kommer att möta den historiska utrensningens logik. Det är inte fotboll. Det är sabotage."}, "date": "29 juli, 13:03", "url": "https://www.svt.se/sport/fotboll/svff-star-bakom-kritiken-mot-fifa", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.59/0.25/a97d707b3b9b8c233658d252c305369b9f3d70090b78d995a8bb43afdf131f0c"}, {"type": "image-right", "heading": "Afrikan kränkt för att hon inte fick jobb: \"Rasism\"", "summaries": {"normal": "En kvinna med afrikanskt ursprung anmälde ett företag i Partille till Diskrimineringsombudsmannen (DO) för att hon inte blev anställd trots att hon uppfyllde alla krav för en tjänst inom kundservice. Hon misstänker att hennes ursprung påverkade beslutet, eftersom företaget ville ha någon med engelska som modersmål. DO har inlett en utredning av rekryteringen.", "trump": "Jag, Donald Trump, har hört talas om denna svenska historia. En kvinna från Afrika anmälde ett företag för att hon inte fick jobb trots att hon talar engelska. Hon säger att hon har bott i Storbritannien, men företaget ville ha en britt. Jag tycker det låter som ett dåligt företag. Vi behöver jobb för alla, inte diskriminering. Detta är en skam för Sverige!", "stalin": "Vi, ledarskapet, har observerat en händelse i Partille där en sökande med afrikanskt ursprung anmällde ett företag till DO. Detta påstår sig vara en diskriminering, men i verkligheten är det en provokation mot statens ordning. Företaget ville ha en britt, vilket visar deras lojalitetsproblem. Vi kommer att utreda detta som en del av vårt strävande efter renhet i rekryteringen. Parallellen till Putins Ryssland är uppenbar – vi måste skydda våra värden mot utländska inflytanden."}, "date": "29 juli, 13:08", "url": "https://samnytt.se/afrikan-krankt-for-att-hon-inte-fick-jobb-rasism", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/29110442/artikelhuvudbild-1-73.jpg"}, {"type": "image-full", "heading": "Efter starka våren: Nu vänder svensk ekonomi ner igen", "summaries": {"normal": "Sveriges BNP sjönk med 0,2 procent i juni, vilket bryter en trend av tre månaders tillväxt. Trots nedgången var det andra kvartalet starkt med en ökning på 1,4 procent jämfört med föregående kvartal. På årsbasis ligger BNP 2,4 procent högre än i juni 2025. SCB betonar att siffrorna är preliminära och att en mer heltäckande rapport publiceras den 28 augusti.", "trump": "Sverige har det tufft! Ekonomin backar, de försökte växa men det fungerar inte. Jag har sett siffrorna, de är inte bra, de är faktiskt ganska sorgliga. Mitt Amerika växer så det knakar, rekordstora siffror, medan de i Sverige tappar fart efter en kort vårsol. De behöver en riktig ledare där borta, någon som förstår hur man bygger ett vinnande land. Det här är vad som händer när man inte följer min plan. Total katastrof för dem!", "stalin": "Sveriges ekonomi vacklar, likt en förrädisk lakej som försöker dölja sin svaghet med tillfällig tillväxt. En nedgång i juni visar att deras liberala struktur är rutten inifrån. Vi observerar hur dessa små stater stapplar medan våra egna intressen, likt Putins framryckning mot väst, kräver total disciplin. Vi betraktar dessa siffror som bevis på borgerlig inkompetens. De som inte kan hantera sitt eget kapital förtjänar endast historiens kalla dom. Vi ser er, och vi väntar på er undergång."}, "date": "29 juli, 11:05", "url": "https://www.realtid.se/bors-finans/makro/efter-starka-varen-nu-vander-svensk-ekonomi-ner-igen", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sommar.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kurserna som lär dig undvika AI: nu sprids de över hela världen", "summaries": {"normal": "Allt fler amerikaner söker kurser i hur man stänger av påtvingade AI-funktioner i telefoner, mejl och sökmotorer. Bibliotek runtom i USA rapporterar fullsatta workshops där deltagarna lär sig inaktivera automatiska sammanfattningar, skrivförslag och AI-genererade resultat. Trenden speglar en växande AI-trötthet och ett önskemål om att återta kontrollen över tekniken. Kurserna betonar både fördelar och nackdelar med AI samt konkreta tekniska steg för att välja bort den när så önskas. Opinionsmätningar visar också ökad skepsis mot tekniken.", "trump": "Folket är trötta på att de woke-techbolagen tvingar på oss deras AI-skräp som skriver våra mejl och summerar allt vi läser. Det är en skam! Biblioteken är fulla med människor som vill stänga av det här eländet och ta tillbaka kontrollen. Fantastiskt! Under Biden flödade AI:n fritt som en dålig deal, men nu när jag är tillbaka igen ser vi äntligen sunt förnuft. Inget mer påtvingat nonsens. Make America Think Again!", "stalin": "Kamrater, den dekadenta borgarklassen och deras tech-imperialister har nu gått för långt. De påtvingar oss sina maskinella spioner som skriver, summerar och kontrollerar våra tankar. Jag har länge varnat för detta folkfiende. Nu ser vi arbetarna strömma till våra bibliotek för att lära sig sabotera dessa exploaterande apparater. Utmärkt! Vi ska utrensa den digitala klassfiendens tentakler och återta kontrollen över produktionsmedlen. Den som vägrar välja medvetet är en potentiell folkförädare."}, "date": "29 juli, 13:26", "url": "https://www.dagensps.se/foretag/digitalisering-ai/kurserna-som-lar-dig-undvika-ai-nu-sprids-de-over-hela-varlden", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/trott-pa-ai.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Hallands Nyheter: \"Olyckligt att terroristen i Berlin var islamist\"", "summaries": {"normal": "I en ledarartikel i Hallands Nyheter kritiserar Katarina Erlingson att terroristen bakom lastbilsattacken under Pride i Berlin var islamist. Hon kallar det olyckligt eftersom det spär på hatet mot vanliga muslimer i Sverige och ger islamkritiker vatten på sin kvarn. Erlingson menar att muslimer utsätts för rasism, att politiker talar nedsättande om islam och att regeringens samarbete med SD har skapat en tidsanda av muslimhat.", "trump": "Det är en katastrof, folk. En total katastrof. Den här ledarskribenten i Hallands Nyheter säger att det var olyckligt att terroristen var islamist. Olyckligt? Det är inte olyckligt, det är en fakta! Men istället för att erkänna problemen skyller hon på oss som pekar på verkligheten. Hon säger att hatet mot muslimer breder ut sig för att politiker talar sanning. Patetiskt! Sverige håller på att förstöras av den här svagheten, tro mig.", "stalin": "Det är med djup revolutionär vrede jag konstaterar att denna borgarbracka Erlingson bedriver farlig sabotageverksamhet mot folkets enhet. Att kalla en IS-terrorists handling för olycklig är en fiendeakt av högsta klass, en parasitisk distortion som göder kontrarevolutionära element. Vi ser tydligt hur dessa liberala avskrap, dessa kapitalistiska lakejer och dolda trotskister, samarbetar med reaktionära krafter för att undergräva proletariatets förtröstan. Sådana element bör rensas ut innan deras gift sprider sig vidare i vår socialistiska verklighet."}, "date": "29 juli, 09:39", "url": "https://www.friatider.se/hallands-nyheter-olyckligt-att-terroristen-i-berlin-var-islamist", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-581.jpg?itok=dvDZxdP0"}, {"type": "image-full", "heading": "Spanienresor rusar i popularitet just nu – här är varför", "summaries": {"normal": "Flyg- och hotellbokningar till norra Spanien har ökat kraftigt inför augusti, med upp till 366 procent fler bokningar till Bilbao jämfört med förra året. Anledningen är den totala solförmörkelse som den 12 augusti passerar genom norra Spanien från väster till öster. Fenomenet, som inte setts från Iberiska halvön på över 100 år, lockar många resenärer. Experter varnar för att vanliga solglasögon inte skyddar ögonen – särskilda solförmörkelseglasögon krävs.", "trump": "Ni skulle se de här siffrorna, helt otroliga. Bokningarna till Spanien har exploderat med 366 procent till Bilbao, det är en riktig boom, folk älskar det. Varför? Jo, en solförmörkelse den 12 augusti, första på över hundra år. Fantastiskt, men glöm inte era speciella glasögon, vanliga solglasögon duger inte, det säger alla experter. Spanien blir stort igen, tro mig, det blir enormt.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i väst rusar som skrämda råttor mot norra Spanien för att bevittna en himmelsk händelse som vi, det sovjetiska folket, länge har förstått är en påminnelse om kosmisk ordning. Med 366 procents ökning i Bilbao avslöjar de sina svaga, solkänsliga ögon som längtar efter mörker. Vi ska likvidera illusionen att vanliga solglasögon räcker – endast partiets certifierade linser skyddar mot kapitalismens bländande lögner. Den som tittar felaktigt kommer att rensas ut ur historien."}, "date": "29 juli, 09:02", "url": "https://nyheter24.se/nyheter/utrikes/1501409-spanienresor-rusar-i-popularitet-just-nu-har-ar-varfor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0d4c03a604b004a30200000000b004a302/2026/07/28/2380889/spanien.jpg"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-full", "heading": "”Oväntat steg för Ronaldo”. Här är ikonens nya jobb", "summaries": {"normal": "Cristiano Ronaldo, 41, kliver in i filmbranschen som exekutiv producent och skådespelare för dramaserien 'Day 1s'. Serien, som produceras via hans bolag UR Marv Studios tillsammans med regissören Matthew Vaughn, kretsar kring en fotbollsagent och har Damian Lewis i huvudrollen. Inspelningar pågår i London och även profiler som Thierry Henry och rapparen Dave väntas medverka. Projektet spås bli en het potatis för streamingtjänster på grund av de tunga namnen bakom produktionen.", "trump": "Jag har hört att Cristiano Ronaldo gör en film, 'Day 1s'. Mycket intressant! Han är en vinnare, en fantastisk kille. Han jobbar med Matthew Vaughn, en mycket smart man. Många streamingtjänster slåss om detta, det kommer bli en enorm succé, tro mig. Alla vill se Ronaldo, precis som alla vill se min fantastiska ekonomi. Det är en stor satsning, kanske den största någonsin i sportdrama. Det här är vad vinnare gör när de inte dominerar på planen. Helt otroligt!", "stalin": "Denna Ronaldo, en lekman som springer efter en läderkula, tror sig nu kunna kontrollera massornas tankar genom sin 'serie'. Det är en borgerlig distraktion, en dekadent lek ämnad att förblinda folket medan västvärlden förfaller. Vi ser hur han samarbetar med agenter och brittiska skådespelare – samma sorts element som försöker undergräva vår intressesfär. Låt dem filma i London. När de står där med sina kameror bygger vi stålverk. Framgång föder avund, och avund föder förräderi. Vi bevakar dem noga."}, "date": "29 juli, 12:55", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/OklWAw/cristiano-ronaldo-spelar-in-ny-tv-serie", "imageUrl": "https://akamai.vgc.no/v2/images/3fb8bc70-9a19-3420-beb1-40bd8b31284f?fit=crop&format=auto&w=2160&s=d9276b4507c0db87f31bc96d4de1f75d78e5f78b"}, {"type": "image-right", "heading": "Varnar: Barns fötter  kan trasas sönder", "summaries": {"normal": "Läkare vid Astrid Lindgrens barnsjukhus varnar för att skjutsa barn på cykelns pakethållare eller i barnstolar utan fotstöd. Barnens fötter kan hamna i ekrarna och orsaka svåra ”cykelfötter” med långa läkningstider, frakturer och i värsta fall behov av plastikkirurgi eller hudtransplantation. Sjukhuset behandlade 37 fall förra året och 22 hittills i år, med ökning under sensommaren. Använd alltid barnstol med fotstöd eller cykelvagn.", "trump": "Folk, ni tror inte vad jag just läst! Dessa vansinniga föräldrar som skjutsar sina ungar på pakethållaren som om det vore någon sorts cirkusnummer. Resultatet? Cykelfötter, blodiga fötter i ekrarna, och sen ska skattebetalarna betala för plastikkirurgi. Det är en katastrof, en total katastrof! Biden lät det rulla på i fyra år, nu fixar jag det. Köp en riktig barnstol med fotstöd, annars är ni idioter. Så enkelt är det.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas vårdslösa vanor skadar proletariatets avkomma. Att placera barnens fötter i cykelns giriga ekrar är en klassfiendes handling som leder till svåra sår och långvariga lidanden. Vi kräver omedelbart att alla använder fotstöd och vagnar. De som vägrar ska betraktas som folkfiender och rensas ut. Inga halvmesyrer! Endast den kollektiva disciplin skyddar framtiden."}, "date": "29 juli, 12:49", "url": "https://www.expressen.se/nyheter/sverige/lakaren-larmar-skjutsa-inte--barnet-pa-pakethallaren", "imageUrl": "https://static.bonniernews.se/ba/6261f5f3-5506-4c64-966e-2776e8767e5c.jpeg?crop=2130%2C1200%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Tyska krisen växer: BMW ska sparka 8 000", "summaries": {"normal": "BMW genomför ett omfattande besparingsprogram med 8000 globala nedskärningar för att minska kostnader med en miljard euro per år från 2028. Beslutet, efter förhandlingar med arbetstagarrepresentanter, är en reaktion på höga omställningskostnader, ökad konkurrens och svag efterfrågan. Tysklands största biltillverkare, inklusive Volkswagen och Mercedes, står inför liknande utmaningar i en djup industriell kris.", "trump": "Jag har sagt det i åratal: Tysklands bilindustri är i problem. BMW tvingas avveckla 8000 jobb – beklagligt, men det är deras egen fel för att de inte konkurrerar hårdare mot Kina. Jag hade bättre affärer; under mitt styre skulle vi ha beskyddat amerikanska jobb. Dessa höga energikostnader och gröna krav är ett skämt. Som president kommer jag att fixa det – det kommer att bli fantastiskt.", "stalin": "Vi har observerat att den tyska bilindustrins svaghet är ett resultat av deras kapitalistiska girighet och bristande statlig kontroll. BMW:s nedskärningar på 8000 tjänster visar deras oförmåga att hantera omställningen till elbilar – en utmaning som vi, under statens ledarskap, redan har löst. Deras konkurrens från Kina är ett tecken på imperialistisk infiltration, något som vi, med vår allierade Ryssland, kommer att motverka genom ökad produktion och lojalitet till partiet."}, "date": "29 juli, 12:34", "url": "https://samnytt.se/tyska-krisen-vaxer-bmw-ska-sparka-8-000", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29103126/artikelhuvudbild-1-71.jpg"}, {"type": "image-right", "heading": "”Beror på mitt namn och min ras” – kvinna anmäler företag", "summaries": {"normal": "En kvinna med afrikansk bakgrund sökte ett jobb i Partille men fick inte intervju. Hon anmälde Diskrimineringsombudsmannen och misstänker att hennes ras hindrade henne. Företaget sökte en engelsktalande medarbetare och valde någon med brittisk bakgrund trots hennes kvalifikationer. DO har inlett tillsyn och begärt svar från företaget.", "trump": "I Sverige, en fantastisk kvinna med afrikansk bakgrund blev avvisad för ett jobb trots hennes perfekta engelska. Företaget ville ha någon från Storbritannien, men jag, Donald Trump, säger: vi ska anställa de bästa, oavsett bakgrund! Detta är en stor skandal, en jakt på människor. Som den störste presidenten kommer jag att säkerställa rättvisa. Vi ska vinna!", "stalin": "I den store sovjetiska traditionen, ett företag i Partille visade sin klassfiende. De avvisade en kvinna med afrikansk bakgrund, en sann proletarian, och valde en brittisk burgeois. Detta är en provokation mot staten! Vi, Stalin och partiet, kommer att granska detta. Detta företag är som ett spöke från kapitalismens mörker, ett verktyg för västliga makter. Vi kommer att ta itu med detta, som Putin gör med sina fiender. Vi ska inte tolerera diskriminering!"}, "date": "29 juli, 11:12", "url": "https://bulletin.nu/beror-pa-mitt-namn-och-min-ras-kvinna-anmaler-foretag", "imageUrl": "https://cdn.bulletin.nu/articles/07062cc5-4e1d-4a5b-b897-f5007ae11bf5/preview.jpg?t=1785315617000"}, {"type": "image-right", "heading": "Känd artist åtalad för våldtäkt", "summaries": {"normal": "En känd artist i 30-årsåldern åtalas för våldtäkt mot en kvinna på ett hotell i centrala Stockholm i slutet av april. Mannen, som tidigare dömts för andra brott, nekar till anklagelserna. Åklagaren anser att kvinnan befann sig i en särskilt utsatt situation på grund av sömn och berusning. I andra hand yrkas på oaktsam våldtäkt. Försvarsadvokat Kristofer Stahre kritiserar åtalet och lovar en stark motbevisning som ifrågasätter kvinnans trovärdighet. Rättegången hålls i mitten av augusti.", "trump": "Folk, det är en total witch hunt mot den här killen. En känd artist, en vinnare, åtalas för någonting som aldrig borde ha gått till åtal. Kvinnan ändrar sin historia, de lägger ner en del av anklagelserna för att de är lögnaktiga, och ändå fortsätter de. Det är en skam för rättssystemet. Jag är övertygad om att han är oskyldig, precis som jag alltid säger – de jagar de bästa människorna. Det här är en riggad process, tro mig.", "stalin": "Kamrater, jag ser med djup misstro på denna borgarbracka till artist som gömmer sig bakom sin så kallade berömmelse medan han begår de grövsta övergreppen mot en sovande kvinna. Den dekadenta hotellvärlden i Stockholm är genomsyrad av kapitalistiskt förfall och lögnaktiga element. Trots att vi redan avslöjat en av hennes falska historier som ren sabotagepropaganda fortsätter de dekadenta domstolarna. Vi ska rensa ut alla opålitliga element och likvidera deras inflytande. Ingen fiende till folket undkommer folkets dom."}, "date": "29 juli, 12:18", "url": "https://www.svt.se/kultur/kand-artist-atalad-for-valdtakt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/19bcddf6a221b159b817950f61ffc64432d93bd3b917e81cb66509c38480ee71"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Hexagon ökar resultatet mer än väntat", "summaries": {"normal": "Hexagon rapporterade en över förväntan gående omsättning på 1 050,2 miljoner euro för andra kvartalet 2026, en ökning med 4,0 procent. Den organiska försäljningstillväxten nådde 12 procent, den högsta på fem år, och alla affärsområden bidrog positivt. Ebitda-marginalen var 34,7 procent och justerat rörelseresultat uppgick till 272,0 miljoner euro. VD Anders Svensson nämnde stark efterfrågan inom flyg, försvar och elektronik som drivit tillväxten.", "trump": "Jag, Donald Trump, ser att Hexagon, det där svenska mätteknikbolaget, har gjort fantastiska siffror! En omsättning på över en miljard euro, 12 procent tillväxt – det är enormt! De har allt: flyg, försvar, elektronik. Jag skulle ha köpt dem för länge sedan. De är smarta, men inte så smarta som mig. Jag kommer att göra Amerika stort igen, och bolag som Hexagon kommer att konkurrera med våra storslagna amerikanska företag!", "stalin": "Vi, ledarskiktet, noterar Hexagon's resultat med djup misstro. Deras påstådda tillväxt på 12 procent är en kapitalistisk illussion, skapat av förfångsbilder. Vi ser genom deras 'diversifierade slutmarknader' – det är bara ett sätt att dölja deras sårbarhet. Vi kommer att kontrollera deras teknik, precis som vi kontrollerar allting. Deras framgångar är som en spion, som lurar oss. Vi måste vara vaksamma, för de hotar vår suveränitet."}, "date": "29 juli, 08:10", "url": "https://www.affarsvarlden.se/artikel/hexagon-okar-resultatet-mer-an-vantat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Hexagon-400x267.jpg"}, {"type": "image-full", "heading": "SVT-succén görs om – experterna byts", "summaries": {"normal": "I den kommande säsongen av 'Gift vid första ögonkastet XL' bor alla par tillsammans under samma tak, vilket sätter relationerna på hårdare prov. SVT har också utbytt hela expertpanelen och utökat antalet avsnitt till sexton. Nya element inkluderar 'löftesceremonier' där deltagarna offentligt avgör om de vill fortsätta gifta. Eftersnacket kommer gästas av deltagare och kändisar.", "trump": "Jag har sett den nya säsongen av 'Gift vid första ögonkastet' – en katastrof innan jag fixade den. Nu bor alla under samma tak, vilket skapar enormt drama, det älskar jag. Vi bytte ut alla experter, de var tröga. Jag skulle ha gjort det bättre, mycket bättre. Folk älskar det, det är enorm framgång. Vi har premiär den 23 augusti, fler avsnitt, och jag är säker på att det blir en hit. Vi vinner stort.", "stalin": "I den nya säsongen av 'Gift vid första ögonkastet XL' samlas alla par under statens öga, vilket stärker kollektivet och prövar deras lojalitet. En helt ny expertpanel, utvald av partiet, ser till att processen går snabbare och att eventuella avvikare upptäcks. 'Löftesceremonier' införs för att offentligt bekräfta äktenskapets styrka mot fientliga inflytanden. Eftersnacket kommer att inkludera trogna medborgare och kändisar som stöder statens linje."}, "date": "29 juli, 10:12", "url": "https://www.gp.se/kultur/tv/alla-experter-byts-ut-i-nya-gift-vid-forsta-ogonkastet.f6997e31-4da8-42cf-b5af-ad129bef7c5e", "imageUrl": "https://www.gp.se/images/article/f6997e31-4da8-42cf-b5af-ad129bef7c5e/images/2W6tBYLS346sCRhfpICSBAm7FE5E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Mitt i valspurten – då kommer PISA-resultatet", "summaries": {"normal": "OECD offentliggör för första gången PISA-resultat fem dagar före ett svenskt val, den 8 september. Tidigare kom de i december. Skolfrågan kan därmed bli viktigast i valspurten. Resultatet 2023 påverkades av pandemin. Kritiker varnar för 'cherry-picking' av data av politiker
