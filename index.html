om hit, byggde datacenter och bröt mot alla regler tills polisen sparkade ut dem. Nu kommer de krypande till det svenska facket som plötsligt vinner stort. Microsoft och alla andra lyssnar äntligen. Fantastiskt, folk! De borde ha lyssnat på mig från början, ingen gör avtal bättre än jag.", "stalin": "Kamrater, de utländska kapitalisterna och deras lömska underentreprenörer trodde de kunde kringgå folkets kollektivavtal genom att gömma sig i skuggorna. Efter att vi rensat ut de mest uppenbara parasiterna med myndigheternas hjälp har vi nu tvingat dem att underkasta sig. Betald restid och specificerade tillägg – ett litet steg mot ordning. De som vägrar ska likvideras ur projektet. Härligt."}, "date": "24 augusti, 13:21", "url": "https://arbetet.se/2026/08/24/efter-razziorna-nu-ar-microsoft-och-andra-techforetag-redo-att-lyssna-pa-facket", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24132505/micro.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Reversera migrationsexperimentet", "summaries": {"normal": "Debattör med utlandsfödd förälder vill kraftigt minska invandringen och vända migrationsexperimentet. Han menar att Sverige förändrats radikalt och tryggheten försvunnit. Han efterlyser minskat antal invånare och att många bör återvända hem. Fokus på kulturkrock och integrationens misslyckande.", "trump": "Jag älskar Sverige, fantastiskt land! Men de har ett problem — för många människor från fel ställen, en katastrof! Jag skulle fixa det, stänga gränserna, skicka hem dem. Gör Sverige tryggt igen, som Bullerby. Det är enkelt, men de lyssnar inte på mig. Patetiskt!", "stalin": "Kamrater, detta experiment med mångfald är kontrarevolutionärt. Vi måste rensa ut de som inte anpassar sig — kultursabotörerna och historielösarna. Alla som inte nynnar på Astrid Lindgren eller äger en Volvo ska omutbildas. Annars är fienden avlägsnad. För Sveriges renhet!"}, "date": "24 augusti, 11:12", "url": "https://bulletin.nu/debatt-reversera-migrationsexperimentet", "imageUrl": "https://cdn.bulletin.nu/articles/eec45e6c-4c0b-4ff1-a5fa-2c8954600b70/preview.jpg?t=1787562767000"}, {"type": "image-right", "heading": "Teslastrejken – ett misslyckande, men inget misstag", "summaries": {"normal": "Teslastrejken avslutades efter nästan tre år utan kollektivavtal och har kallats ett misslyckande. German Bender argumenterar dock att den inte var ett misstag. Strejken avskräckte andra företag, förbättrade villkoren för Teslas anställda och ökade kunskapen om den svenska modellen. Trots att målet inte nåddes gav den positiva effekter och var nödvändig.", "trump": "Den här Teslastreiken var en total katastrof, folk säger det, men vänta – den var faktiskt inte ett misstag. De tappade stort, men de slog tillbaka mot de fega företagen som hatar avtal. Nu vet alla vad det kostar att mess around. Kollektivavtal är fantastiska, alla älskar dem, och Tesla fick betala dyrt. Smart move till slut, tro mig.", "stalin": "Kamrater, denna så kallade Teslastrejk var inget misslyckande utan en nödvändig utrensning av borgarbrackornas arrogans. Även om vi inte erövrade kollektivavtalet har vi höjt medvetandet hos arbetarna och gjort det dyrare för nästa kapitalistiska parasit att utmana folkets vilja. De som vägrar inse detta är fiender till kollektivet och bör rensas ut med glimten i ögat."}, "date": "24 augusti, 01:41", "url": "https://www.dagensarena.se/opinion/teslastrejken-ett-misslyckande-men-inget-misstag", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "image-right", "heading": "Vilken betydelse får lokala partier i valet 2026?", "summaries": {"normal": "Lokala partier har styrt i runt 50 kommuner efter 2000- och 2010-talen men deras roll som vågmästare har minskat sedan SD blivit en accepterad samarbetspartner. Inflytandet ligger stabilt kring fem procent av rösterna. Framgång bygger ofta på lokala frågor, missnöje och karismatiska personer, enligt docent Erik Wångmar.", "trump": "De här lokala partierna är fantastiska, verkligen otroliga. De har styrt i massor av kommuner men nu när SD är med och spelar med de stora killarna tappar de sin makt som vågmästare. Det är en total katastrof för dem, men jag älskar starka lokala ledare som tar makten själva. Sverige borde lära sig av det!", "stalin": "Vi betraktar de lokala partierna som nyttiga redskap för att splittra den borgerliga dekadensen och de falska socialdemokratiska revisionisterna. Deras roll som vågmästare har likviderats av den nya ordningen, vilket gläder oss. Låt dem fortsätta sitt fåniga spel – vi ska rensa ut alla opportunister när tiden är mogen. Härligt kaos."}, "date": "24 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/vilken-betydelse-far-lokala-partier-valet-2026", "imageUrl": "https://www.dagensarena.se/files/2023/02/fotojet-68.jpg"}, {"type": "image-right", "heading": "Ersätt rot- och rut-avdragen med en fossilfri industristrategi", "summaries": {"normal": "Artikeln argumenterar för att nästa regering bör ersätta rot- och rut-avdragen med en ambitiös fossilfri industristrategi. Sverige pressas av högt fossilberoende och kinesisk konkurrens inom grön teknik. Författarna föreslår att staten istället prioriterar investeringar i elproduktion, fossilfri produktion och export för att stärka konkurrenskraften och minska importberoendet.", "trump": "Lyssnar ni på de här svenska förlorarna? De vill sluta ge folket skatteavdrag för att renovera sina kök och istället slänga miljarder på elbilssatsningar som Kina redan äger. Patetiskt! Jag byggde den starkaste ekonomi i världen, ni borde kopiera mig istället för att lyssna på dessa gröna globalister som förstör ert land. Amerika först, Sverige sist!", "stalin": "Kamrater, dessa svenska kapitalistlakejer erkänner äntligen att deras fossila importberoende och rot-avdrag gynnar klassfienderna medan produktivkrafterna förfaller. Jag skulle omedelbart likvidera dessa profitthungriga hyenor och inrätta en järnhård statlig plan för fossilfri produktion. Inga halvmesyrer! Den som bromsar omställningen är folkfiende och bör rensas ut."}, "date": "20 augusti, 17:40", "url": "https://www.etc.se/debatt/ersaett-rot-och-rut-avdragen-med-en-fossilfri-industristrategi", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150832_b6b07314-7c58-44e5-b735-eb918b7c382b.jpg"}, {"type": "image-right", "heading": "Krigskonsensus i åttaklövern", "summaries": {"normal": "Artikeln kritiserar svenska riksdagspartiernas valaffischer som undviker centrala frågor som Nato, militarism, upprustning och EU. Författaren pekar på en bred politisk konsensus kring dessa ämnen, ökad vapenexport, militära samarbeten och stora summor till Ukraina och försvar medan välfärden prioriteras ned. Neutraliteten har övergivits och Sverige ses nu som en måltavla.", "trump": "Titta på de här svenska förlorarna som slåss om affischplatser medan de pumpar miljarder till krig och Nato. De har inga pengar till välfärd men massor till upprustning och Wallenbergs vapenfabriker. Patetiskt! Jag fixade fred, Biden och de här töntarna startade krig. Sverige borde ha hållit sig utanför det hela, nu är ni bara måltavlor. Sad!", "stalin": "Jag betraktar med förakt hur dessa borgarbrackor och klassfiender i den svenska riksdagen enas i tystnad kring Nato och militarismens framfart. De offrar folkets välfärd på imperialismens altare medan vapenhandlarna fyller fickorna. Ingen opposition, bara profitthungriga hyenor som gömmer sig bakom nationalistiska plattityder. En skådeprocess värdig utrensning."}, "date": "19 augusti, 11:26", "url": "https://proletaren.se/artikel/riksdagspartierna-overens-om-krig-och-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledare-1-768x432.jpg"}, {"type": "image-right", "heading": "Varför accepteras Jomshofs islamofobi?", "summaries": {"normal": "Artikeln kritiserar att SD:s Richard Jomshof öppet kallar sig islamofob i sin nya bok och att borgerliga partier accepterar detta. Författaren menar att det visar på normalisering av rasism mot muslimer, kontrasterat mot reaktioner på vänsterns uttalanden. Han ifrågasätter SD:s påståenden om islamisering och pekar på suddiga gränser mellan religion och etnicitet.", "trump": "Folk, de här svenska globalisterna är patetiska! Jomshof säger bara sanningen om den islamistiska invasionen som förstör deras fina lilla land, och plötsligt är det rasism? Men när vänsterextremisterna hyllar terrorister är det okej? De har blivit så woke att de inte ens kan skydda sin egen kultur längre. Patetiskt!", "stalin": "Kamrater, dessa klassfiender och folkförtryckare inom borgarklassen har nu öppet omfamnat sin rasistiska parasitism riktad mot arbetande muslimska massor. Jag ser genom deras genomskinliga hyckleri. Vi måste rensa ut dessa exploaterande hyenor som splittrar folket med sin etnonationalistiska gift. Inga fiender undkommer den revolutionära utrensningen."}, "date": "17 augusti, 11:34", "url": "https://www.flamman.se/varfor-accepteras-jomshofs-islamofobi", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/richard-jomshof-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "S röstar ja till ökad anhöriginvandring – trots var 5:e invandrare ALDRIG har jobbat", "summaries": {"normal": "Socialdemokraterna röstade nej till skärpta krav på anhöriginvandring. En ny rapport visar att var femte invandrare som bott i Sverige i 20 år aldrig har arbetat, i utsatta områden var tredje. Rapporten pekar även på stora skillnader i synen på arbete, homosexualitet och könsroller jämfört med svenskfödda. Vänstermedia ifrågasätter undersökningens tillförlitlighet på grund av låg svarsfrekvens.", "trump": "Folk, ni skulle inte tro det! De svenska socialisterna röstar för mer invandring trots att var femte invandrare aldrig jobbat på tjugo år. Det är en total katastrof, en riktig röra. De vill att ni ska betala för allt medan de själva drömmer om tvångsblandning och samlevnadsrum. Patetiskt! Biden skulle älskat det här vansinnet. Vi behöver jobb, inte bidrag till folk som hatar vårt sätt att leva.", "stalin": "Jag ser klassfiendernas hydra i denna rapport. Var tredje parasit i de utsatta zonerna vägrar arbeta och föraktar både produktivt arbete och proletär moral. Ändå röstar socialdemokraterna för att släppa in fler av dessa blodsugande element. Det är en farlig sabotagehandling mot folket. Kamraterna måste rensa ut dessa folkförrädare innan de förgiftar hela sovjet – förlåt, hela nationen med sin dekadens."}, "date": "17 augusti, 03:41", "url": "https://samtiden.nu/2026/08/s-rostar-ja-till-okad-anhoriginvandring-trots-var-5e-invandrare-aldrig-har-jobbat", "imageUrl": "https://samtiden.nu/wp-content/uploads/2016/12/kvinnor-muslimer.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
