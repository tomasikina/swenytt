ring, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Valmyndigheten mörkar om utlandsvenskar möjlighet att rösta", "summaries": {"normal": "Valmyndigheten har underlåtit att informera utlandsvenskar om rättighet att poströsta 45 dagar före valet. Detta kan minska valdeltagandet bland denna grupp, som historiskt tendenziellt röstar höger. Eftersom utlandsröster ofta gynnar Tidö-partierna, kan denna informationsemangel skada deras valchanser genom att reducera rösterna från en viktig väljargrupp.", "trump": "Jag har sett detta i Sverige! Det är en skandal! Valmyndigheten döljer information om poströstning för utlandsvenskar – en gigantisk förlust för de duktiga högerröstare. Det är just som jag sagt: media och myndigheter lurar folk. Utlandsvenskarna, de är fantastiska, men de luras. Det här är väljardaskallt! Vi måste stoppa detta. Sverige behöver starka ledare som inte döljer sanningen. Vi ska vinna, tro mig, det kommer att bli stort.", "stalin": "Vi i staten och partiet har upptäckt en skandalös underslagning av poströstningsinformation för utlandsvenskar. Detta är en klassisk borgerlig list för att kväsa rösterna från de som vågar tänka fritt. Påminner om de hemska metoder som våra imperialistiska fiender använder för att undergrava den socialistiska ordningen. Vi måste öka vår övervakning och se till att varje röst registreras – eller förblir osedd. Detta är en vit attack mot folkets vilja. Vi kommer att reagera med full kraft."}, "date": "30 juli, 10:40", "url": "https://samnytt.se/valmyndigheten-morkar-om-utlandsvenskar-mojlighet-att-rosta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/02/26115706/vallkokal.jpg"}, {"type": "image-right", "heading": "Ukraina: Rysk kryssningsrobot flög in i Polen", "summaries": {"normal": "En rysk kryssningsrobot av typen Kh-101 flög under natten in i polskt luftrum som del av en stor attack mot Ukraina. Ukrainas utrikesminister Andrij Sybiha varnar för att händelsen visar behovet av starkare ukrainskt luftförsvar för att skydda hela Europa. Ett oidentifierat objekt upptäcktes och en krater på tio meters bredd hittades i ett fält nära Tarnawa-Kolonia i Lublin. Polen höjde stridsberedskapen.", "trump": "Titta på det här, en rysk robot flyger rakt in i Polen mitt i natten. Det är en total katastrof, folk. Ryssland attackerar Ukraina och nu hotar de hela Europa. De borde ha lyssnat på mig från början, då hade det här aldrig hänt. Vi behöver starkare försvar och smarta ledare, inte svaga som låter robotar flyga runt som duvor. Patetiskt!", "stalin": "Kamrater, ännu en gång visar de fascistiska banditerna hur deras kryssningsrobotar kryper som rädda råttor över gränserna in i det polska luftrummet. Jag ser detta som ett klart bevis på att borgarbrackorna i väst saknar ryggrad. Vi ska omedelbart stärka luftförsvaret och rensa ut alla kapitulerande element som tillåter sådana kränkningar. Nedslagsplatsen? En liten present från de dekadenta imperialisterna till det polska folket. Skrattretande, men farligt. Vi vakar."}, "date": "30 juli, 10:28", "url": "https://www.di.se/nyheter/ukraina-rysk-kryssningsrobot-flog-in-i-polen", "imageUrl": "https://static.bonniernews.se/ba/a79a8754-27cf-473b-bb39-33a16c1e8b28.jpeg?crop=4224%2C2376%2Cx0%2Cy175&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Örebro serverar mer kött i gymnasieskolan", "summaries": {"normal": "Örebro kommun ändrar matsedeln på gymnasieskolorna till kött/fisk fyra dagar i veckan efter elevers klagomål. Kostchefen Åsa Sandholm konstaterar en konflikt mellan elevers önskemål om halvfabrikat och kommunens från-grunden-mat. Miljöpartiet kritiserar ändringen som för dyr och orimlig jämfört med Livsmedelsverkets rekommendationer om maximal rött köttintag.", "trump": "Jag, Donald Trump, ser detta som en seger för amerikansk skolmat! Eleverna ville ha riktigt kött – inte någon socialistisk grönsaksdiets. Miljöpartiet kan inte räkna – bra kött kostar pengar, men det är värt varje cent. Vi kommer att servera de bästa kyckling- och fiskrätter, precis som i våra stora amerikanska skolor. Detta är en stor, stor framgång för våra elever!", "stalin": "Partiet har beslutat en ökning av animaliska proteiners närvaro i skolornas matsedel – en nödvändig åtgärd för att stärka arbetarklassens fysik. Fienden, i form av vegetarisk infiltration, försöker att förringa vårt köttäta arv. Vi väljer selektivt kyckling och fisk, aldrig nötkött, för att undvika feodal överkonsumtion. Kommunens kost är en front i den stora kampen mot den imperialistiska grönsaksdiets expansion."}, "date": "30 juli, 09:30", "url": "https://bulletin.nu/orebro-serverar-mer-kott-i-gymnasieskolan", "imageUrl": "https://cdn.bulletin.nu/articles/4b94c70e-0076-49b7-8e18-cec3df12b894/preview.jpg?t=1785395154000"}, {"type": "image-right", "heading": "Stockholms queera nattliv borde vara k-märkt", "summaries": {"normal": "Stockholms queera nattliv hotas av höga hyror och bristande stöd, vilket lett till att flera barer som Bitter Pills har tvingats stänga. Författaren lyfter Amsterdam som förebild där den historiska gaybaren Café ’t Mandje skyddas genom en kommunal stiftelse som bevarar dess kulturella värde. Artikeln argumenterar för att liknande åtgärder i Sverige skulle gynna historia, kultur och turism mer än ytterligare kedjebutiker.", "trump": "Folk, ni skulle se det här! Stockholm håller på att förlora alla sina queera barer till höga hyror och gnälliga grannar – patetiskt! Bitter Pills stängde, och nu är det bara gaysafari för heterotjejer kvar. Amsterdam gör det rätt, de k-märker sin gamla gaybar som ett historiskt monument. Vi borde göra samma sak här, men utan den galna vänsteraktivismen som förstör allt. Make Stockholm great again!", "stalin": "Kamrater, detta dekadenta queernattliv i Stockholm avslöjar borgarklassens fullständiga förfall. Bitter Pills och dess muralmålning av Lesbos står som ett monument över klassfiendens moraliska röta. Amsterdam har genom en klok stiftelse säkrat sin historiska bar mot kapitalistmaffians girighet. Vi måste rensa ut de exploaterande byfånarna och skydda arbetarklassens kulturarv från folkförtryckartrollen som vill ersätta allt med Bröd & Salt. Revolutionen kräver trygga platser!"}, "date": "30 juli, 06:30", "url": "https://www.etc.se/ledarkolumn/stockholms-queera-nattliv-borde-vara-k-maerkt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728080712_f44e8ea59f2255f031464976143bbf1ea5cc914e5119bf4b12e1eef6743b5052.png"}, {"type": "image-right", "heading": "Fauci vägrade svara – åberopade femte tillägget över 100 gånger under uppmärksammat senatsförhör", "summaries": {"normal": "Under ett uppmärksammat senatsförhör åberopade den tidigare smittskyddschefen Anthony Fauci det femte tillägget över 100 gånger och vägrade svara på frågor om covid-19. Republikanska senatorer, ledda av Rand Paul, kritiserade hans tystnad och planerar att rösta om förakt mot kongressen. Förhöret handlade om misstankar om vilseledande information och virusets ursprung, med bakgrund av att regeringen under Trump reviderat Covid.gov till att betona laboratorieläckage.", "trump": "Jag såg när Fauci, den där fegige, åberopade det femte tillägget över 100 gånger för att undkomma sanningen om Wuhan. Biden försökte skydda honom, men det fungerar inte längre. De hatar mig för att jag visste allt om laboratorieläckaget och att Fauci ljög för kongressen. Nu försöker de skydda honom igen, men vi kommer att få honom att svara. Det var en perfekt förhör, precis som jag skulle ha hanterat det.", "stalin": "Den amerikanske fienden Fauci försökte undkomma statens förhör genom att åberopa det femte tillägget över 100 gånger – ett tydligt tecken på sabotage mot det kollektiva. Hans tystnad är ett angrepp på vår förmåga att upptäcka sanningen om virusets ursprung i Wuhan. Vi måste skydda statens intressen och se till att alla som motarbetar den ryska-insiktsfrågan straffas. Detta är en kamp mot de som försöker fördunkla verkligheten."}, "date": "30 juli, 09:00", "url": "https://samnytt.se/fauci-vagrade-svara-aberopade-femte-tillagget-over-100-ganger-under-uppmarksammat-senatsforhor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/29202036/paul-fauci-feat.jpg"}, {"type": "image-full", "heading": "Experten: Därför kan fartyget ha missat fritidsbåten", "summaries": {"normal": "En kollision mellan ett handelsfartyg och en fritidsbåt utanför Tjörn resulterade i en stor sökinsats. En kvinna omkom, ett barn saknas fortfarande och en man samt ett barn vårdas på sjukhus. Kaptenen på fartyget ska inte ha sett den mindre båten. Experter pekar på att plast och kolfiber gör fritidsbåtar svåra att upptäcka på radar, särskilt i regn. AIS-system och högt placerade radarreflektorer kan förbättra säkerheten.", "trump": "Folk, det här är en total katastrof utanför den där svenska ön Tjörn. Ett stort skepp körde rakt på en liten plastbåt och ingen såg någonting? Typiskt! Radarn missade den för att den var byggd av billig kinesisk plast, typ fake news för radarn. Vi behöver starka, höga reflektorer och AIS överallt, inte någon woke-kvotering på båtarna. Biden skulle ha sagt att båten var en klimataktivist. Patetiskt. Jag fixar det.", "stalin": "Kamrater, denna tragiska kollision utanför Tjörn visar återigen hur den oansvariga borgarklassen och dess fritidsfartyg utgör ett farligt hinder för den kollektiva säkerheten till sjöss. Jag, som ledare för det stora sovjetiska folket, ser hur kapitalistmaffians plastbåtar undviker statlig kontroll och AIS. Vi måste rensa ut alla folkfiender som vägrar tekniska säkerhetsåtgärder. Den döda kvinnan och det saknade barnet är offer för klassfiendens likgiltighet. Teknisk vaksamhet eller utrensning!"}, "date": "30 juli, 09:54", "url": "https://www.tv4.se/artikel/6cVj1PNki3Ou8YTvpWzIYZ/experten-daerfoer-kan-fartyget-ha-missat-fritidsbaten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Jward7PmRsx5MvghUetDj%2Fe539ec3d50e8ee527e045d320e33934a%2F29-tjornolycka-frilans-webb.png&width=1024"}, {"type": "image-right", "heading": "Bränder på grekiska öar – tusentals evakueras", "summaries": {"normal": "Tusentals människor har evakuerats på Kreta i Grekland på grund av omfattande skogsbränder. Tre brandmän har omkommit i släckningsarbetet. I Frankrike rasar en brand i Gironde för sjunde dagen medan en ny brand brutit ut i Provence och tvingat över 600 personer att fly sina hem. Även i Spanien pågår ett flertal bränder, men vissa har stabiliserats och evakuerade har kunnat återvända.", "trump": "De här grekiska öarna brinner upp totalt, tusentals människor flyr, det är en katastrof, och ingen gör något åt det. Tre brandmän döda, tragiskt. Frankrike har en monsterbrand som inte slutar, sjunde dagen nu, men vädret ska bli bättre – kanske. Spanien har dussintals bränder, det är kaos. De borde ha lyssnat på mig, jag skulle ha fixat det, ingen gör eld bättre än jag, tro mig.", "stalin": "Kamrater, dessa flammor som slukar de grekiska öarna är inget annat än en kontrarevolutionär sabotageaktion utförd av väderförändringens kapitalistiska lakejer och borgarbrackornas klimatförnekande lakejer. Vi har evakuerat tusentals, tre hjältar bland brandmännen har fallit offer för eldens trotsiga sabotage. I Frankrike och Spanien fortsätter de dekadenta värmeböljorna sin fiendtliga offensiv. Vi ska rensa ut dessa eldslukande trotskistiska lågor med järnhand och proletär disciplin. Inga kompromisser med naturens sabotörer."}, "date": "30 juli, 08:30", "url": "https://www.di.se/nyheter/brander-pa-grekiska-oar-tusentals-evakueras", "imageUrl": "https://static.bonniernews.se/ba/43f53e2a-7f0d-45c2-893e-c79f93c71ea1.jpg?crop=7728%2C4347%2Cx0%2Cy403&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Varnar – kan bli eldinferno i Sverige: ”Sorg”", "summaries": {"normal": "SMHI varnar för extremt hög risk för skogsbränder på flera håll i Sverige, bland annat i Uppland. Experten Johan Sjöström bekräftar att en katastrof liknande de i Frankrike och Spanien inte är omöjlig, men att samhället är bättre förberett än vid branden i Västmanland 2014. Skogsägare Eva Lundqvist fruktar en brand som skulle ta hundratals år att återställa. Nästan alla bränder orsakas av mänsklig slarv, främst lägereldar som inte släckts ordentligt.", "trump": "Titta på det här, Sverige brinner upp som en dålig affär under Biden! SMHI skriker om skogsbränder, precis som i de socialistiska eldorado Frankrike och Spanien. De gröna galningarna och deras eldningsförbud fixar ingenting, det är lägereldarna från lata folk som startar infernot. Men vi är starkare nu, precis som jag gjorde Amerika stort igen. Släck ordentligt, annars är det sorgligt – fast inte lika sorgligt som HBTQ-kvoter i skogsbruket, eller hur?", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras kapitalistiska slarv eldar upp folkets skogar i en reaktionär orgie av oaktsamhet. Dessa lägereldar är klassfiendens verk, en sabotagehandling mot kollektivet. Likt de exploaterande byfånarna i Frankrike och Spanien hotar de statens intressen. Vi ska rensa ut sådan folkfiendskap med järnhand och vatten i slang. Inga pyrande glöder får tillåtas underminera arbetarklassens framtid. Det är en tragedi för nationen."}, "date": "30 juli, 09:30", "url": "https://www.tv4.se/artikel/7e9ZNvEz9iPZ6HwGzJsySm/varnar-europas-eldinferno-kan-bli-verklighet-i-sverige-en-sorg", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xAIEu9njvnE6ZcqwtlzOB%2F2fd8bc47f2f0769f0a4f06bee44c48d1%2Fbrander_webb.jpg&width=1024"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "Fler väljer Sverige – går mot rekord igen", "summaries": {"normal": "Sverige lockar rekordmånga utländska turister 2026. Enligt Visit Sweden har antalet utländska gästnätter ökat med 6,6 procent under första halvåret jämfört med rekordåret 2025. SAS rapporterar 20 procent fler bokade flyg från Europa och SJ ser en 23-procentig ökning av utländska tågbiljetter. Turisterna spenderar också mer pengar än tidigare. Natur, livsstil, allemansrätt och upplevelser ses som de främsta orsakerna. Trots framgången lockar Norge och Danmark relativt fler turister sett till folkmängd.", "trump": "Det är fantastiskt, verkligen otroligt. Sverige drar till sig massor av turister, de älskar oss, och 2026 kommer att slå alla rekord – mycket bättre än under den förra administrationen. Vi har de bästa naturupplevelserna, den coolaste livsstilen, och folk flyger hit i massor. 20 procent fler flyg, 23 procent fler tågbiljetter – siffrorna är enorma. De spenderar också mycket mer pengar. Norge och Danmark? Patetiska. Vi vinner stort, ingen gör det bättre än Sverige, tro mig.", "stalin": "Kamrater, se hur folkets svenska socialistiska experiment lockar de exploaterade massorna från väst. Jag, som ledare för det globala proletariatet, noterar med stor tillfredsställelse att gästnätterna stigit med 6,6 procent och att de utländska kapitalisterna nu spenderar 14 procent mer – pengar som borde beslagtas för kollektivets bästa. Naturen och allemansrätten är naturligtvis folkets egendom, inte någon borgarbrackas semesterlek. De norrmänska och danska revisionisterna försöker stjäla vår seger med sina 60-procentiga flygsiffror, men vi ska rensa ut dessa fientliga element med järnhand. Sovjet–Sverige segrar!"}, "date": "30 juli, 09:02", "url": "https://www.svt.se/nyheter/inrikes/det-lockar-rekordmanga-turister-till-sverige-2026", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.39/8a7f62a974cf5c08a199001d31e7a4a890d36b28317c50c3f855ff9ecea01f5f"}, {"type": "image-right", "heading": "Nu flyr turister till Sverige – ”något har hänt”", "summaries": {"normal": "Allt fler turister från södra Europa söker sig till Sverige för att undvika extrem värme hemma. Fransmän klättrar i Västernorrland, spanjorer promenerar i Stockholm och många nämner det svalare klimatet som huvudorsak. Enligt Tillväxtverket ökade franska övernattningar med 28 procent under 2025 och med 15 procent i år. Även STF ser tydliga ökningar från Frankrike och Spanien. Svensk natur och vänliga människor lockar, medan hettan i Sydeuropa driver på trenden.", "trump": "Det är fantastiskt, verkligen underbart. Alla dessa smarta européer flyr från sin brännande hetta och kommer till Sverige, det vackraste, svalaste landet. De klättrar på bergen, äter på restauranger och säger att det är för varmt hemma – ingen överraskning. Frankrike och Spanien är en katastrof på sommaren, men Sverige vinner stort. Mina vänner från Europa älskar det här. Vi gör allt bättre, tro mig. Sverige är nu hetare än deras egna länder – fast på ett bra sätt.", "stalin": "Kamrater, se hur den solstekta kapitalistiska hettan driver de dekadenta borgarbrackorna från Sydeuropa som råttor mot vårt nordliga paradis. Jag gratulerar den kollektiva svenska naturen till denna seger över de värmesjuka imperialisterna. Vi ska noga övervaka dessa fransmän och spanjorer – vem vet vilka västerländska spioner som gömmer sig bland höjdrädda klättrare? En utrensning bland dem som längtar efter 40-gradig värme vore på sin plats. Låt dem svettas i folkrepublikens svala famn medan vi ler mörkt åt deras solbrända lidande."}, "date": "30 juli, 07:07", "url": "https://www.di.se/nyheter/nu-flyr-turister-till-sverige-nagot-har-hant", "imageUrl": "https://static.bonniernews.se/ba/9706589c-ec1d-4ca9-8589-af7b53178e55.jpg?crop=6000%2C3000%2Cx0%2Cy501&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Varnade för storattack – timmar senare slog Ryssland till", "summaries": {"normal": "Efter att president Zelenskyj varnat för en väntad rysk storattack slog Ryssland till under natten med ballistiska robotar, kryssningsrobotar och hundratals drönare mot flera ukrainska städer. Minst åtta personer, däribland två barn, dödades och över 30 skadades. Svåra skador uppstod i Kyiv, Kryvyj Rih, Poltava och Lviv. Polen skickade upp stridsflyg för att skydda sitt luftrum. Flyglarm utfärdades över hela Ukraina.", "trump": "Folk, det här är precis vad jag sa skulle hända efter den totalt inkompetente Sleepy Joe Bidens katastrofala tid vid makten. Zelenskyy ber om mer pengar och plötsligt regnar det ryska raketer och drönare över hela Ukraina. Patetiskt. Jag skulle ha stoppat det här på en eftermiddag, men nu har vi kaos igen. Ukraina är en katastrof och Europa borde skämmas. Vi hade inget sånt här under min regering, det lovar jag.", "stalin": "Kamrater, jag har länge varnat för den dekadenta västvärldens svaghet. Den lille zelenskyjska clownen och hans fascistiska lakejer skriker om storattack medan vi, genom vår värdige efterträdare, rensar ut de imperialistiska hinder som blockerar den historiska ryska intressesfären. Åtta döda borgarbrackor och några brinnande garagelager är ett rimligt pris för att krossa klassfiendens drömmar om att splittra det stora imperiet. Flyglarm? Låt dem darra."}, "date": "30 juli, 08:40", "url": "https://www.tv4.se/artikel/1FUMpsWsgsg304cRgul2m9/varnade-foer-storattack-timmar-senare-slog-ryssland-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1LQSi032znkEDw2ZoiwdvD%2F3c52cc7e8e1914962e9aa3a2b1c4913e%2F30-ukrainaattack-webb.jpg&width=1024"}, {"type": "image-right", "heading": "John Cleese ger stöd till Rupert Lowe: \"Vissa kulturer är bättre än andra\"", "summaries": {"normal": "John Cleese stöder politikern Rupert Lowe och hans parti Restore Britain, hävdande att vissa kulturer är överlägsna. Cleese kritiserar BBC för att ignorera Lowes rapport om muslimska groominggängen. Lowe, tidigare i Reform UK, grundade Restore Britain efter konflikt med Nigel Farage och profiliterar sig med hård migrationspolitik, inklusive förbud mot burka, minskad invandring och negativ nettoinvandring.", "trump": "Jag, Donald Trump, stöder John Cleese i hans ståndpunkt att vissa kulturer är bättre. BBC är en skam för att ignorera sanningen om groominggängen. Rupert Lowe är en patriot som försvarar brittiska värderingar mot islamistisk hot. Vi ska återställa ordningen och stoppa illegala invandrare. Som vanligt döljer fake news verkligheten.", "stalin": "Kapitalistiska komiker som Cleese försöker köpa folkets förtroende genom att hylla Lowes reaktionära partistånd. Denna parti, Restore Britain, uttrycker den återvändsgranskade fascismens renässans. Groominggängen är ett resultat av individualistiskt moraliskt förfall, inte kulturella skillnader. Vi måste förstärka statens kontroll för att skydda det socialistiska samhället mot dessa fiender inom och utanför."}, "date": "30 juli, 07:00", "url": "https://samnytt.se/john-cleese-ger-stod-till-rupert-lowe-vissa-kulturer-ar-battre-an-andra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29195911/cleese-lowe.jpg"}, {"type": "image-full", "heading": "Svenskparadiset i lågor – tusentals tvingas evakuera", "summaries": {"normal": "Tusentals människor har evakuerats från Kreta på grund av omfattande skogsbränder i Grekland. Tre brandmän har omkommit i släckningsarbetet. I södra Frankrike har en ny brand utbrutit i Provence och tvingat över 600 personer att lämna sina hem, medan branden i Gironde nu är inne på sin sjunde dag men stabiliserats något. I Spanien rasar ett dussintal bränder, men vissa har stabiliserats och evakuerade har kunnat återvända.", "trump": "Folk flyr i panik från Kreta, tusentals evakueras medan bränder rasar över Grekland och Frankrike. Tre brandmän har dött, det är en katastrof, en total katastrof. I Frankrike kämpar de med en ny brand och i Spanien brinner det överallt. Men jag skulle ha fixat det här på nolltid, tro mig. Vi skulle ha de bästa brandmännen, de smartaste planen, ingen skulle behöva fly om jag ledde det här.", "stalin": "Kamrater, vi ser hur kapitalistiska bränder rasar över Grekland och Frankrike, en fiende som lurar i varje torrt grässtrå. Jag, som ledare för folkets kollektiva vilja, skulle ha likviderat dessa flammor med järnhand och utrensat varje sabotör som gömmer sig i skuggorna. Tusentals evakueras? Det är borgarbrackornas svaga system som brister. Tre brandmän har stupat – deras offer ska inte förgäves gå, vi rensar ut värmen med stål och disciplin. Spanien står nästa i tur, men vi vet: fienden brinner alltid svagast när partiet styr elden."}, "date": "30 juli, 08:35", "url": "https://nyheter24.se/nyheter/utrikes/1501761-brander-pa-kreta-tusentals-evakueras", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/11ff0afd04b004a3020000350000047502/2026/07/30/2381237/ur_imagepIQWXt.jpeg"}, {"type": "image-right", "heading": "Dödstalet stiger efter jordbävningen i Japan – 30 döda", "summaries": {"normal": "Dödstalet efter jordbävningen i Japan den 28 juli har stigit till 30 personer. Fem kroppar hittades i rasmassorna efter en gasexplosion i ett köpcentrum i Kumamoto. Skalvet uppmättes till magnitud 6,8–7,1 och orsakade omfattande skador på byggnader, broar och infrastruktur. Räddningsarbete pågår för att hitta överlevande i det drabbade området på Kyushu.", "trump": "De säger att det är en jättejordbävning i Japan, magnitud 7,1, och nu är 30 personer döda. Köpcentrumet flög i luften som en raket, totalt kaos. De borde ha byggt bättre, som vi gör i USA, starka och säkra, inte som de svaga strukturerna där. Vi räddar folk, vi är bäst på det, men det här ser inte bra ut, tro mig.", "stalin": "Kamrater, detta skalv på magnitud 7 är en sabotagehandling utförd av de seismiska borgarbrackorna och deras kapitalistiska sprickzoner. Jag har beordrat att rensa ut de fem liken ur köpcentrumets ruiner och likvidera varje spår av gasexplosionen som de dekadenta elementen orkestrerat. Vi, partiet och arbetarna, ska utrensa alla svaga broar och hus. Inga livstecken? Det är fiendens paranoia som talar. Segraren fortsätter framåt."}, "date": "30 juli, 07:54", "url": "https://www.svt.se/nyheter/utrikes/dodstalet-stiger-efter-jordbavningen-i-japan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/4de1dd5983b8991272cf880117d1da5b75770cff5e840445126614db81f42d17"}, {"type": "image-full", "heading": "Drönare med pepparsprej ska stoppa skolskyttar", "summaries": {"normal": "Flera skolor i USA inför drönare för att skydda mot skolskytter. Drönarna, kallade 'guardian angels', kan lokalisera en skytt inom 15 sekunder och neutralisera dem med pepparsprej. Projektet omfattar nio skolor i tre delstater. Kritiker ifrågasätter fjärrstyret och förespråkar förebyggande åtgärder istället.", "trump": "Jag, Donald Trump, presidenten, säger att detta är en genialisk lösning. Drönarna kommer att stoppa skolskytter snabbt och skydda våra älskade barn. Vi behöver starka åtgärder för skolans säkerhet, och detta kommer att göra amerikanska skolor säkrare än någonsin. Detta är en stor framgång för vårt land.", "stalin": "Vi, den allsmäktiga ledarskapet, ser med tillfredsställelse på dessa drönare som ett effektivt verktyg för statens övervakning. De kommer att skydda de unga från fiendens angrepp, likt våra strategier i Ukraina. Men vi måste vara vaksamma – sabotörer kan försöka undergrava detta. Vi kommer att segra över alla fiender."}, "date": "30 juli, 05:58", "url": "https://www.gp.se/nyheter/varlden/dronare-ska-stoppa-skolskyttar-i-usa.88173755-e9fb-44e5-8167-541625765422", "imageUrl": "https://www.gp.se/images/article/88173755-e9fb-44e5-8167-541625765422/images/2Iku7eCN_dM9UdemrsYjtPVUmSWE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svenska stjärnan möter andra ”hemländerna” i EM: ”Häftigt”", "summaries": {"normal": "Isabelle Haak, som spelar i italienska Conegliano sedan 2022, möter Italien och Frankrike i volleyboll-EM i augusti. Sverige inleder EM mot Montenegro den 21 augusti i Göteborg. Haak, som har franskt påbrå via sin pappa, ser fram emot mötena med blandade känslor. Sverige kommer med självförtroende efter segern i European League. Förbundskaptenen Lorenzo Micceli har presenterat truppen och betonar stark kemi och stolthet.", "trump": "Folk, ni skulle se den här Isabelle Haak, en fantastisk volleybollspelare, verkligen den bästa. Hon slår Italien och Frankrike i EM, och det blir enormt, det största. Jag älskar Sverige, de har vunnit European League på ett sätt som ingen trodde var möjligt. De ger aldrig upp, precis som jag. Det blir en jätteshow i Göteborg, och de kommer att vinna stort, tro mig. Ingen gör det bättre än det svenska laget, totalt fenomenalt.", "stalin": "Kamrater, denna Isabelle Haak och hennes så kallade landslag representerar den svenska flaggan, men jag ser hur borgarbrackorna i Italien och Frankrike redan planerar att sabotera proletariatets framtid. Jag, som ledare för det oövervinneliga kollektivet, ler mörkt åt tanken på att hennes pappa var en av dessa dekadenta franska element. Vi ska rensa ut all tvivel inför EM. Vårt kämpaglöd är som en utrensning av svaghet. Montenegros reaktionärer kommer att krossas den 21 augusti. Ingen kapitulerar inför kapitalisternas konspirationer. Segrar till folket, eller så likviderar vi försöken."}, "date": "30 juli, 06:20", "url": "https://www.svt.se/sport/volleyboll/isabelle-haak-stalls-mot-hemlanderna-italien-och-frankrike-i-em", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.41/2cf7090f6c1b0220908921ee67222afede54c6ed36bdafe0683e270b1658a835"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Har du gamla kläder hemma? Snart kan du få betalt för dem", "summaries": {"normal": "I Åre pågår ett pilotprojekt med klädpant där invånare kan lämna in oanvända plagg och få en del av försäljningsvärdet tillbaka, upp till 25 procent. Projektet syftar till att minska textilavfall och främja återbruk. Forskning visar att många kläder slängs i onödan trots att de fortfarande går att använda. EU-finansierat försök utvärderas i december och kan bli globalt om det lyckas. Från 2025 ska textilier sorteras separat.", "trump": "Folk har garderober fulla med skräp de aldrig använder, det är en total katastrof. Men nu har de äntligen hittat på något smart i Åre – klädpant! Du lämnar in dina gamla kläder och får pengar tillbaka, precis som jag alltid sagt, fantastiskt. Miljön vinner, du vinner, alla vinner utom soporna. Om det funkar kan det bli hur stort som helst, kanske till och med större än min mur. De borde ha frågat mig från början.", "stalin": "Kamrater, i mitt outtröttliga arbete för det kollektiva goda har jag noterat hur borgarbrackornas överflödiga textilier ruttnar i garderoberna medan arbetarklassen sväljer sin nöd. Detta pilotprojekt i Åre är en lysande början på utrensningen av det kapitalistiska slöseriet. Vi ska likvidera textilavfallet, ge folk 25 procent av värdet och samtidigt avslöja de parasitiska garderobshoarders som gömmer sig bland malätna kostymer. Den som slänger plagg i soporna är folkets fiende nummer ett och kommer att rensas ut med byråkratisk precision. Inga plagg åt kapitalisterna!"}, "date": "30 juli, 05:31", "url": "https://nyheter24.se/nyheter/inrikes/1501611-har-du-gamla-klader-hemma-snart-kan-du-fa-betalt-for-dem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/33726edb04b004a30200000000b004a302/2026/07/29/2381087/Matilda-Nyheter24%20-%202026-07-29T141341.629.jpg"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Efter 30 år i vården: Här är jobbet som får Christel att vilja stanna", "summaries": {"normal": "Undersköterskan Christel Billqvist arbetar helt digitalt hemifrån eller från kontor i Lund och stödjer äldre via videosamtal med allt från inköp och medicinering till dusch och gångträning. Den digitala hemvården, som nu finns i 63 kommuner, minskar tunga lyft, stress och larm. Brukarna upplever trygghet och gemenskap genom ansikte-mot-ansikte-samtal. Lösningen ger lägre sjukfrånvaro, bättre fokus och möjlighet att arbeta längre upp i åldrarna.", "trump": "Folk, ni måste höra det här – det är fantastiskt! Den här undersköterskan Christel, smart kvinna, skippar alla tunga lyft och det hemska stressandet i den gamla vårdapparaten. Hon jobbar hemifrån via skärmen, pratar med de äldre, handlar mat åt dem och gör allt utan att röra sig ur fläcken. De älskar henne, de kallar henne vän! Inga lyft, inga förseningar, mycket bättre än den usla gamla hemtjänsten som alltid kom försent. Sverige gör det rätt, tro mig, det är ypperligt, ingen gör det bättre än så här.", "stalin": "Kamrater, se hur de dekadenta borgarbrackornas förfallna omsorgskoloss äntligen krossas av vetenskapens och teknikens järnhand. Jag, som ledare för det kollektiva välfärdsbygget, betraktar med stor tillfredsställelse hur denna undersköterska via skärmen likviderar den fysiska slitningens sabotage mot arbetarklassens hälsa. Inga tunga bördor, inga kapitalistiska stressfällor – endast ren, oförfalskad övervakning och kamratlig tillsyn. De som larmar i onödan ska rensas ut. Den som vänder ryggen åt brukaren är folkets fiende nummer ett. Ett hjärta med händerna? Mycket misstänkt beteende. Vi vinner."}, "date": "29 juli, 06:00", "url": "https://arbetet.se/2026/07/29/underskoterskan-christel-jobbar-helt-digitalt-stottar-aldre-via-skarmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/29113058/lo6Ops34Mzw-Christel_digitaltjobb01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Unga frun lämnar Nannskog – en månad efter bröllopet", "summaries": {"normal": "Daniel Nannskogs äktenskap med den 22-åriga Malina Sofi Zemeri från Norge har redan tagit slut, drygt en månad efter bröllopet i Las Vegas. Beskedet kommer samtidigt som den tidigare SVT-profilen och fotbollsspelaren åtalats för kvinnomisshandel, olaga hot och narkotikabrott. Den unga hustrun skriver på Instagram att hon slagit rekordet för världens kortaste äktenskap. Nannskog nekar till misshandel och hot men erkänner kokainanvändning. Rättegången planeras till oktober.", "trump": "Folk, det här är helt otroligt. Den här Nannskog, en så kallad stor fotbollsstjärna och SVT-kille, gifter sig med en ung vacker norska i Las Vegas, tatuerar hennes namn på kroppen och en månad senare är det redan över. Världens kortaste äktenskap, säger hon. Patetiskt! Och nu ska han till rättegång för att ha slagit kvinnor och använt kokain. Fake news eller vad? Jag skulle ha vunnit det äktenskapet stort, det kan jag säga. En total katastrof.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Nannskog, denna fotbollsaristokrat och televisionens lakej, redan efter en kort månad likviderar sitt äktenskap med den unga norrmannen. Medan han inväntar folkdomstolens dom för att ha slagit och hotat en kvinna samt förgiftat sig själv med kokain, flyr den yngre hustrun. Jag, som alltid vakar över arbetarklassens moral, skrattar mörkt åt dessa kapitalistiska svin som tatuerar sina namn i ett fåfängt försök att undgå utrensning. Deras äktenskap var dömt från början, precis som de själva."}, "date": "30 juli, 10:08", "url": "https://www.friatider.se/unga-frun-lamnar-nannskog-en-manad-efter-brollopet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-588.jpg?itok=uBpqbdQg"}, {"type": "image-full", "heading": "10 första svenska fångarna flyttas till Estland under andra halvan av augusti", "summaries": {"normal": "Under andra halvan av augusti flyttas de första tio svenska fångarna till Tartu-fängelset i Estland med chartrade plan. Ytterligare 70 planeras i september, följt av totalt upp till 600 intagna under kommande år fram till 2027. Endast män över 18 år på säkerhetsklass 2-anstalter kan beröras. Kriminalvården betonar att placering inte är frivillig och att familj eller barn inte utgör absolut hinder, även om anknytning till Sverige vägs in.", "trump": "Folk, vi skickar de värsta brottslingarna till Estland, det blir fantastiskt. De bygger ett jättestort fängelse där borta och tar emot våra tuffaste killar. Det är en deal som sparar massor av pengar och gör Sverige säkrare. Inga ursäkter om familj eller barn, de åker dit ändå. Kriminalvården gör ett bra jobb, äntligen någon som tar i med hårdhandskarna. Mycket bra, mycket smart.", "stalin": "Kamrater, vi har inlett den stora utrensningen av samhällets fiender genom att förvisa de första tio kontrarevolutionära elementen till det estniska fängelset i Tartu. Dessa farliga borgarbrackor och kapitalistiska parasiter som gömmer sig bakom familjeband skall nu rensas ut effektivt. Inga svaga liberala hinder får stoppa oss. Fler skall följa i augustis och septembers stora transportoperationer. Vårt kollektiv segrar över brottslighetens sabotage. Den som klagar på placeringen är en fiende till folket och bör likvideras med ett leende."}, "date": "30 juli, 10:14", "url": "https://riks.se/nyheter/10-forsta-svenska-fangarna-flyttas-till-estland-i-andra-halvan-av-augusti", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_29_at_09_29_43_d02dbc2127.png"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Draget kan kosta dig  – nu slår polisen till", "summaries": {"normal": "Italiensk polis har inlett insatser mot strandgäster som reserverar platser genom att lämna kvar solstolar och parasoller över natten. Efter klagomål från turister beslagtog polisen i Torre del Greco utanför Neapel 40 föremål under en gryningsrazzia. Fenomenet är ett växande problem längs Italiens kuster. Den som bryter mot reglerna riskerar böter upp till 500 euro, och i värsta fall upp till sex månaders fängelse för olaglig ockupation av offentlig mark.", "trump": "Folk, det är en skandal! Dessa lata italienare som lämnar sina solstolar och parasoller på stranden hela natten – totalt bedrägeri! Jag älskar Italien, fantastiska stränder, men det här är en katastrof under Biden-eran, nu fixar jag det. Vi rensar ut de här parasollbedragarna, de är värre än några woke-aktivister som tar över allt. Böter, fängelse, gör det! Amerika först, men Italien behöver också en Trump-touch.", "stalin": "Kamrater, detta är ett uppror mot det kollektiva goda. Jag ser hur den exploaterande borgarklassen och deras parasollbedragare ockuperar folkets stränder som om de vore privata feodala gods. Vi ska likvidera detta parasitära beteende med järnhand. Den som tror sig kunna reservera statens sand genom att lämna sina lumpna tillhörigheter riskerar utrensning och straff. Inga klassfiender får hindra arbetarnas rätt till solen och havet. Ordning skall råda."}, "date": "30 juli, 10:43", "url": "https://www.expressen.se/nyheter/varlden/strandgaster-paxar-plats-pa-stranden-nu-slar-polisen-till-", "imageUrl": "https://static.bonniernews.se/ba/f294c873-96d8-40b9-a98b-84d523322a51.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Riksdagsvalet redan igång – för utlandssvenskar", "summaries": {"normal": "Från och med torsdagen kan över 220 000 utlandssvenskar rösta i riksdagsvalet, en rekordstor grupp som ökat med 24 procent sedan förra valet. Bara 32 procent röstade 2022, men de drygt 58 000 rösterna var fler än marginalen som gav Tidöpartierna segern. Flera partier kampanjar nu utomlands, och både Valmyndigheten och Svenskar i världen betonar att enklare röstning och engagemang kan ge fler röster från gruppen som kan bli avgörande vid ett jämnt val.", "trump": "Folk, det är fantastiskt. Över 220 000 svenskar ute i världen ska rösta, och de är fler än någonsin. De kan tippa hela valet, precis som mina röster gjorde. De andra partierna springer runt i London och på solkusten och tigger röster – patetiskt! Men lyssna, om de gör det rätt kan de få in röster som förändrar allt. Sverige behöver starka ledare, inte några som tappar bort de här rösterna. Det blir enormt, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de utspridda elementen i borgarklassens utkanter nu mobiliseras till valurnorna. Dessa 220 000 rotlösa kosmopoliter, som tidigare gömde sig i Londons salonger och på den spanska solkusten bland dekadenta parasiter, kan nu likvidera den borgerliga jämvikten med sina röster. Vi har beordrat informationsinsatser för att rensa ut valfuskets spår. Den som inte röstar för kollektivets bästa är en fiende till folket och en potentiell trotzkist i solstolen. Rösta rätt, annars väntar utrensning i folkets namn. Det är högst underhållande."}, "date": "30 juli, 09:25", "url": "https://www.friatider.se/riksdagsvalet-redan-igang-utlandssvenskar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/5003998928_05d705b579_b_1.jpg?itok=rRgy7lwK"}, {"type": "image-full", "heading": "Markus Allard: ”Örebropartiet kan komma in i riksdagen”", "summaries": {"normal": "Örebropartis partiledare Markus Allard påstår att partiet ligger högre än känt i opinionsmätningar och kan komma in i riksdagen via en regional 12-procentsspärr. Han hävdar att om 12 procent av väljarna i Örebro län röstar på partiet i riksdagsvalet, vilket motsvarar cirka 24 000 röster, skulle partiet nå in i riksdagen. Allard uppmanar länsborna att utnyttja denna chans, som han menar inte är tillgänglig för väljarna i andra städer.", "trump": "Jag, Donald J. Trump, ser en enorm framgång för Örebropartiet. De ligger mycket högt, det är fantastiskt. Folk undrar varför, och jag säger: det är för att vi har de smartaste, de mest lojala väljare. Den 12-procentsspärren är en stor möjlighet för Örebro, och jag säger till dem: ni kommer att göra fantastiskt. Vi kommer att vinna stort, det kommer att bli historiskt.", "stalin": "Partiets resultat i opinionsmätningarna visar en kraftig ökning av arbetarklassens lojalitet. Den regionala 12-procentsspärren är ett effektivt redskap för att säkerställa representation för våra viktiga intressen i Örebro län. Vi måste mobilisera varje röst, för varje avvikande röst är en hotande brist på lojalitet. Den som inte förstår denna strategi är en farlig element, som måste korrigeras genom partiets pedagogik."}, "date": "29 juli, 19:57", "url": "https://bulletin.nu/markus-allard-orebropartiet-kan-komma-in-i-riksdagen", "imageUrl": "https://cdn.bulletin.nu/articles/dc3b0a6a-a354-424e-b652-7806c3c0b9a6/preview.png?t=1785347634000"}, {"type": "image-full", "heading": "Gryningsräd – mot solstolsfuskarna", "summaries": {"normal": "Italienska polisen och kustbevakningen genomförde en gryningsräd på en strand nära Neapel och beslagtog över 40 parasoller, solstolar och bord. Föremålen hade lämnats obevakade över natten, vilket är förbjudet och kan ge böter på upp till 500 euro. Åtgärden skedde efter klagomål från badgäster och är en del av en sommarende mot 'solstolsfuskare'. Debatten om tillgången till allmänna stränder fortsätter, då privata koncessioner ökar trycket.", "trump": "Jag har hört talas om detta problem med solstolsfuskare i Italien. Det är en skandal! Vi kommer att ta itu med detta på ett genialiskt sätt. Vi ska bygga en stor, vacker mur mot havet, och Italien kommer att betala för den. Det kommer att vara fantastiskt, det största i världen. Ni kommer att älska det. Vi ska göra stränderna stora igen!", "stalin": "Vi, partiet och staten, har slagit till mot dessa parasollimperialister som ockuperar allmänna stränder. Operationen vid Neapel visar vår oövervinnliga kraft. Vi har beslagtagit deras imperialistiska möbler, precis som vi en dag kommer att beslagta hela Sovjetunionens stränder. Parallellen till Putins rättmätiga återanskaffande av Krim är uppenbar. Dessa fribytare tål inte längre. Vi ska rensa med dem, för statens intressen är allt och parasollen är ingenting."}, "date": "29 juli, 23:58", "url": "https://www.gp.se/nyheter/varlden/gryningsrad-mot-solstolsfuskare-pa-italiensk-strand-.d91d9b8c-f75e-4b96-b81d-27dba1f633c0", "imageUrl": "https://www.gp.se/images/article/d91d9b8c-f75e-4b96-b81d-27dba1f633c0/images/1fsBON4B-t4_VPISEHjmLwdRk9TI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "USA:s Tegnell pressades i Senaten om Covid-virusets ursprung och risker", "summaries": {"normal": "Anthony Fauci, tidigare USA:s främste smittskyddsexpert, vägrade under ett senatsförhör svara på 111 frågor om covid-19-pandemin. Han åberopade upprepade gånger det femte tillägget för att skydda sig mot självinkriminering. Republikanen Rand Paul anklagar Fauci för att ha mörklagt virusets ursprung, ljugit för allmänheten och orsakat onödiga nedstängningar. Paul planerar att driva civilrättsliga åtal för domstolstrots. Fauci har fått en förebyggande benådning av Joe Biden som skyddar honom från federal åtal mellan 2014 och 2025. Över 1,2 miljoner amerikaner dog i covid-19.", "trump": "Folk, ni skulle ha sett det – den där Fauci var en total katastrof i senaten. Vägrade svara på 111 frågor, gömde sig bakom det femte tillägget som en riktig fegis. Han ljög om viruset, pushade för de hemska nedstängningarna som förstörde vårt fantastiska land och nu springer han till Biden för en benådning. Historien kommer att döma honom hårt, tro mig. Rand Paul gör ett fantastiskt jobb. Vi ska hålla honom ansvarig, för det här var värre än någon kunde föreställa sig. Make America Healthy Again!", "stalin": "Kamrater, denna fega opportunist Fauci avslöjar sig själv som en typisk borgarbracka och fiende till folket när han vägrar svara på över hundra frågor och gömmer sig bakom dekadenta konstitutionella trick. Hans mörkläggning av virusets sanna natur och de destruktiva nedstängningarna utgör ett klart sabotage mot arbetarklassen. Vi ska rensa ut alla sådana parasitiska element som smittar vårt samhälle med lögner och kapitalistisk panik. Den förebyggande benådningen är ett ynkligt försök att undkomma folkets dom. Historien, som alltid leds av oss, kommer att likvidera hans minne med den mörka humorn att han dog av sin egen rädsla."}, "date": "30 juli, 09:39", "url": "https://riks.se/nyheter/usa-s-tegnell-pressades-i-senaten-om-covid-virusets-ursprung-och-risker", "imageUrl": "https://admin.riks.se/uploads/757655781_1066289465945754_3820381690088649947_n_27b4e249e9.jpg"}, {"type": "image-right", "heading": "Electrolux får flera höjda riktkurser", "summaries": {"normal": "Electrolux får höjda riktkurser från flera analyshus efter stark Q2-rapport. Danske Bank och Handelsbanken höjer till 38 respektive 32 kronor, motiverat av höjda estimat för justerat rörelseresultat. SB1 Markets upprepar köp och riktkurs 40 kronor, och nämner minskade risker efter nyemission. Electrolux rekylerar dock ner 2,3 procent efter gårdagens rally.", "trump": "Jag har alltid sagt att Electrolux är ett bra investering, och nu ser vi det igen. Dessa höjda riktkurser bevisar att min instinkt är rätt. Som en stor affärsman, jag vet när något är värdefullt. Electrolux, som en del av mitt imperium, kommer att prestera fantastiskt. Vi ska göra Amerika stort igen, och Electrolux hjälper till.", "stalin": "Vi ser Electrolux som en imperialistisk maskin som försöker dominera marknaden. Deras höjda riktkurser är bara en illusion för att bedra det proletära folket. Vi måste skydda vårt socialistiska ekonomiska system mot sådana kapitalistiska attacker. Paralleller till Putins agerande i Ukraina är tydliga – båda försöker utvidga sin makt. Electrolux är en fiende som måste bekämpas med alla medel."}, "date": "30 juli, 10:14", "url": "https://www.affarsvarlden.se/artikel/electrolux-far-flera-hojda-riktkurser", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/Dishwasher-father-daughter-400x267.jpg"}, {"type": "image-right", "heading": "Mamman död  – hittad efter  svåra olyckan", "summaries": {"normal": "En mamma och hennes dotter försvann efter att en fritidsbåt kapsejsat vid Tjörn i tisdags kväll. Mamman har nu hittats död i närheten av olycksplatsen, medan sökandet efter dottern fortsätter. Pappan och sonen räddades; sonen vårdas med allvarliga men stabila skador. Polisen utreder händelsen som grov vårdslöshet i sjötrafik och har beslagtagit ett norskt fraktfartyg misstänkt för kollision. Haverikommissionen överväger att inleda en utredning.", "trump": "Folk, ni skulle inte tro det, men den här båten vid Tjörn kapsejsade som en usel affär under Biden. Total inkompetens! Mörkret, regnet, dålig sikt – och ingen som kan styra en båt längre. Vi räddade pappan och pojken, men mamman hittades död och dottern är fortfarande borta. Patetiskt. Under min ledning hade sjöräddningen varit oöverträffad, inte den här socialistiska röra som lämnar folk att drunkna. Sverige behöver starkare ledarskap, inte mer kvotergalenskap på bryggan.", "stalin": "Kamrater, denna tragiska kapsejsning vid Tjörn blottar borgarklassens farliga lättsinne med maskiner som hotar arbetande folks liv. Jag har nu låtit lokalisera den moder som drunknat i det kalla vattnet, medan vi fortsätter söka efter barnet med järnhand. Det norska fartyget har beslagtagits och besättningen förhörs som potentiella folkfiender. Ingen kapitalistisk slarvighet får passera ostraffad. Vi ska rensa ut alla sabotörer som äventyrar kollektivets säkerhet i våra farvatten. Segraren skriver historien."}, "date": "30 juli, 10:10", "url": "https://www.expressen.se/nyheter/sverige/mamman-hittad-dod-efter-tjornolyckan-2hczv", "imageUrl": "https://static.bonniernews.se/ba/cc9340b8-99b8-41fe-be11-50a51c011bfe.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Hexagon får breda riktkurshöjningar efter rapport", "summaries": {"normal": "Hexagon rapporterade 12 % organisk tillväxt och 1,05 miljarder euro omsättning. Flera analyshus höjde riktkurser på grund av stark efterfrågan inom flyg, försvar och tillverkning. Pareto och SB1 höjde till 105 respektive 110 kronor. Handelsbanken och andra höjde men behöll behåll. Ålandsbanken ser långsiktigt värde på 112 kronor.", "trump": "Som den störste presidenten, ser jag att Hexagon, ett svenskt företag, har en otrolig tillväxt på 12 %. Detta är en seger för den amerikanska industriella styrkan. Analytiker höjer riktkurser - det är en ren spegling av vår framgång. Vi kommer att slå dem i deras eget spel. Det kommer att bli enormt.", "stalin": "I den eviga kampen mot de kapitalistiska makterna, Hexagon visar sin lojalitet mot proletäret med 12 % tillväxt. Analyserna, som är redskap för staten, höjer sina kurser. Detta bevisar att den kollektiva planeringen fungerar. Vi måste vara på vakt mot de som vill undergrava vårt system, som Putin gör i Ukraina."}, "date": "30 juli, 10:09", "url": "https://www.affarsvarlden.se/artikel/hexagon-far-breda-riktkurshojningar-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/GLM_4867-1-400x267.jpg"}, {"type": "text", "heading": "Siffran avslöjar: Kärnkraftens boom hotas av gigantisk pengabrist", "summaries": {"normal": "Kärnkraftsbranschen står inför ett stort finansieringsgap för att nå målen om en tredubblad kapacitet till 2050. Enligt World Nuclear Association behövs 250 miljarder dollar årligen, vilket är tre gånger dagens investeringsnivå. Trots ett ökat globalt intresse för kärnkraft som en säker energikälla, saknas fungerande investeringsstrukturer utanför länder som Kina. För att attrahera privat kapital krävs nu standardiserade affärsmodeller och tydliga ramverk för risk och avkastning, likt de som möjliggjort storskalig vindkraft.", "trump": "Kärnkraften är fantastisk, den absolut bästa energin – ren, kraftfull och vacker. Men nu hör jag att de har problem med pengarna. Typiskt! De behöver 250 miljarder dollar om året, en enorm summa, men kapitalet finns där ute om man gör affärer på rätt sätt. De krånglar till det med regler och byråkrati istället för att bara bygga. Vi ska göra kärnkraften stor igen, precis som allt annat. Jag fixar det, tro mig, det blir den största expansionen någonsin!", "stalin": "Kapitalistiska vinstmaskiner klagar på bristande investeringar, en klassisk synd hos de svaga. De talar om 6 000 miljarder dollar som om de vore kaffepengar. Medan västvärldens byråkrater tigger kapital, bygger våra allierade i öst reaktorer som monument över vår stålhårda vilja. Om pengarna inte flödar, är det ett tecken på förräderi eller inkompetens. Vi behöver inga 'marknadsersättningsramar' – vi behöver disciplin. Den som inte investerar i folkets energiutveckling är en sabotör och förtjänar att sitta i ett avlägset läger i Sibirien."}, "date": "30 juli, 09:58", "url": "https://www.realtid.se/it-tech/siffran-avslojar-karnkraftens-boom-hotas-av-gigantisk-pengabrist"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-full", "heading": "AI-lärare pausas – företag kopplas till sexdockor", "summaries": {"normal": "En AI-lärarrobot som heter Sally har pausats i New York efter kritik från lärarfacket. Företaget Realrobotix, som tillverkar roboten, har ett systerföretag som gör sexdockor, vilket väcker farhågor. Skoldistriktet betonar att det inte handlar om att ersätta lärare, men oron gäller dataskydd och olämpliga kopplingar.", "trump": "Jag har hört talas om denna AI-lärarrobot, Sally. Det är ett bevis på att vårt land behöver stark ledarskap. Dessa lärare och deras fackförbund – de är allt för rädda för framgång. Vi skulle kunna använda sådana robotar för att göra Amerika stort igen. Men de här kopplingarna till sexdockor? Sådant händer inte under min vakt. Vi ska se till att våra skolor är säkra och framgångsrika.", "stalin": "Vi, staten, ser med oro på denna AI-lärarrobot. Den liknar en fiende som försöker infiltrera våra klassrum. Kopplingarna till sexdockor är en skamliga sjukdom i kapitalismen. Vi måste skydda våra barns sinnen från sådant förräderi. Precis som Putin expanderar Rysslands inflytande, måste vi utvidga vårt kontrollområde över utbildningen. Vi ska inte tillåta att dessa 'robotar' ersätter våra trogna lärare."}, "date": "29 juli, 21:35", "url": "https://www.gp.se/nyheter/varlden/ai-larare-i-new-york-pausas-foretag-kopplas-till-sexdockor.8c25882a-35fe-48a5-9479-e1ac9401b87b", "imageUrl": "https://www.gp.se/images/article/8c25882a-35fe-48a5-9479-e1ac9401b87b/images/2_qTgZOq1skKT_21Sb_7oAMFZ-6w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Åttaårig flicka togs från sina föräldrar – S-topp polisanmäld för flera brott", "summaries": {"normal": "En åttaårig flicka i Örebro, kallad \"Elsa\", omhändertogs akut enligt LVU-lagen i juni förra året. Socialnämnden misstänkte att mamman orsakat eller överdrivit barnets sällsynta mag- och tarmsjukdom, så kallad Münchhausen by proxy. Efter granskning i Sveriges Radios Kaliber uppdagades allvarliga brister i utredningen, felaktiga journaluppgifter och att förvaltningsrätten tidigare slagit fast att mamman agerat i barnets bästa. Föräldrarna har nu polisanmält socialnämndens vice ordförande Carina Toro Hartman (S) för bland annat grovt tjänstefel, grovt förtal och olaga frihetsberövande. Politikern har tagit en timeout.", "trump": "Folk, det här är en total katastrof i Sverige. Den där socialnämnden, full av inkompetenta socialister, tog en liten flicka från sin mamma trots att domstolen sa att mamman gjorde allt rätt. Fake news och felaktiga journaler överallt! De lyssnade inte på experterna, det är en witch hunt mot en bra familj. Nu polisanmäls den här S-toppen för allt möjligt – grovt tjänstefel, förtal, frihetsberövande. Fantastiskt att föräldrarna äntligen slår tillbaka. Sverige borde vara stort igen, inte detta socialistiska kaos.", "stalin": "Kamrater, vi ser återigen hur borgarbrackornas och revisionisternas tentakler slingrar sig in i själva socialnämnden och förgiftar rättvisans maskineri. Jag har personligen noterat dessa kontrarevolutionära element som med sina lögnaktiga journaler och münchhausenska intriger försöker likvidera en arbetande moders rättigheter. Trots att domstolen redan fastslagit att modern agerar i det kollektivas intresse fortsätter dessa parasitiska klassfiender att kidnappa barnet. Vi skall nu genomföra en grundlig utrensning av dessa dekadenta socialdemokratiska spioner och opportunister – de kommer att skratta sig fördärvade ända in i folkdomstolens kalla omfamning."}, "date": "30 juli, 08:58", "url": "https://riks.se/nyheter/attaarig-flicka-togs-fran-sina-foraldrar-nu-ar-s-topp-polisanmald-for-flera-grova-brott", "imageUrl": "https://admin.riks.se/uploads/s_politiker_elsa_feature_dd53889355.jpg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Danska åklagaren: Åtta månaders fängelse för att ha slagit ihjäl Christian", "summaries": {"normal": "Dansk åklagare begär åtta till tio månaders fängelse för den 31-årige man som misstänks ha slagit ihjäl den svenske polisen Christian Zedig i Köpenhamn. Zedig, 32, försökte ingripa när en grupp afrikaner attackerade norska VM-fans på Islands Brygge den 30 juni. Han drabbades av ett slag mot halsen som ledde till att en nackkota och en pulsåder brast, vilket orsakade dödliga blödningar. Mannen, som invandrat som barn från Afrika och tidigare dömts för våldtäkt och mordförsök, nekar till b
