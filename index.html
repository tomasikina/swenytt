ing till cirka 12 miljarder dollar, eller 113,5 miljarder kronor. I februari hade bolaget över 400 miljoner dollar i årliga återkommande intäkter, en kraftig ökning från 100 miljoner dollar åtta månader efter lanseringen. Grundarna Anton Osika och Fabian Hedin äger vardera 24 procent. Bolaget används av åtta miljoner människor, bland annat anställda på Uber, Hubspot och Microsoft.", "trump": "De här svenska killarna på Lovable gör ett fantastiskt jobb, verkligen enastående. Deras värdering håller på att dubblas till tolv miljarder dollar, det är en enorm succé. Från hundra till fyrahundra miljoner i intäkter på bara åtta månader – ingen gör det bättre. De förvandlar idéer till kod, alla älskar det. Uber, Microsoft, alla stora bolag använder det. Det är vackert, helt enkelt vackert. Amerika borde ta efter sådana här vinnare.", "stalin": "Kamrater, dessa två borgarbrackor Osika och Hedin har byggt en monstruös maskin som förvandlar lösa vibbar till kod och lockar åtta miljoner användare i sin kontrarevolutionära famn. Deras så kallade värdering rusar mot tolv miljarder dollar medan de feigt gömmer sig bakom talespersoner och vägrar bekräfta rundan. Vi ser hur de parasiterar på arbetande teknikers kreativitet. En sådan snabb tillväxt doftar sabotage och imperialism. Kanske är det dags att rensa ut dessa opportunistiska kodkapitalister innan de infekterar hela kollektivet med sin dekadenta vibe-coding."}, "date": "6 juni, 17:59", "url": "https://www.di.se/nyheter/lovables-vardering-uppges-rusa/", "imageUrl": "https://static.bonniernews.se/ba/3ef5757c-ac86-4ec9-a0cf-35e11d33762d.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-full", "heading": "Förre M-ledamoten: Man är inte pedofil för att man ser på barnporr", "summaries": {"normal": "En SD-ledamot avgick efter misstanke om barnpornografibrott, anmält av organisationen NCMEC. Tidigare M-ledamoten och juristen Maria Abrahamsson väckte starka reaktioner med ett Facebook-inlägg där hon menar att det inte är samma sak att titta på barnporr som att vara pedofil. Hon jämför det med att titta på mordskildringar och anser att reaktionerna präglas av panik och okunskap om definitionen av pedofili. Abrahamsson försvarar sitt uttalande trots kritik från barnrättsorganisationer.", "trump": "Kan ni fatta den här galna historien? Den där svenska politikern tittar på vidriga grejer och plötsligt är hela landet i panik. Sen kommer den här Maria Abrahamsson, en riktig fighter från moderaterna, och säger det uppenbara: att titta är inte samma som att vara en sjuk pedofil. Hon har helt rätt! De här hysteriska vänstermänniskorna och deras identitetspolitiska hysteriker blandar ihop allt. Fake outrage på hög nivå, folks. Vi behöver sunt förnuft, inte mer av det här vansinnet.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i Sverige vrider sig i moralisk panik över en ensam själ som utforskar den mörka avgrunden. Denna Abrahamsson visar mod och säger det självklara: att betrakta är inte att begå övergrepp. Ändå skriker folkfienderna och de exploaterande byfånarna efter utrensning. Jag skrattar mörkt åt deras paranoia. I folkets namn måste vi skilja på handling och tanke, annars likviderar vi snart alla som inte passar in i deras fega, hysteriska regler."}, "date": "6 juni, 21:26", "url": "https://www.tv4.se/artikel/3E97MaLWw2HqH7asVNiRUq/foerre-m-ledamoten-man-aer-inte-pedofil-foer-att-man-ser-pa-barnporr", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5EotqCiGlPx8wCcQ1Z4ksV%2F691b844903163164e510a583ff7828be%2F06-abrahamsson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Upptrappning mellan Israel och Iran – robotar avfyrades", "summaries": {"normal": "Iran avfyrade på söndagskvällen ett tiotal ballistiska robotar mot norra Israel som svar på påstådda brott mot vapenvilan. Israeliskt luftförsvar aktiverades och flyglarm gick, men enligt IDF uppstod inga skador. Irans revolutionsgarde varnade för kraftigare attacker vid israelisk vedergällning i Libanon. Donald Trump uppges ha ringt Benjamin Netanyahu och uppmanat honom att inte svara. Flera grannländer stängde tillfälligt luftrummet.", "trump": "Iran sköt ett gäng robotar mot Israel och trodde de var smarta. Patetiskt! Jag ringde genast Netanyahu och sa: gör inget dumt, låt oss vara smarta. Israel har det bästa försvaret, de träffade ingenting. Iran är en total förlorare som hotar alla, men med mig vid rodret i USA blir det inga fler sådana här svaga spel. Vi vinner alltid stort.", "stalin": "Jag betraktar med djup tillfredsställelse hur de sionistiska imperialisterna och deras dekadenta borgarbrackor i Tel Aviv skälver inför folkets rättmätiga vrede. Dessa parasitiska element och kapitalistiska lakejer har förtjänat varje projektil från de revolutionära styrkorna. Låt dem darra i sina skyddsrum som förrädiska råttor. Vi, arbetarklassen och kamraterna, ler mörkt åt deras paranoia. Fortsätter de i Libanon skall utrensningen bli både grundlig och underhållande. Fienden avslöjar sig ständigt."}, "date": "7 juni, 23:49", "url": "https://www.svt.se/nyheter/utrikes/iran-och-israel-i-ny-upptrappning-robotar-avfyrades", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.36/19c47d76e8d8c8a8b688dc50c0fa0d5100e2859b10ecd4a15501ec9e331d8cbf"}, {"type": "image-full", "heading": "Otäcka bilderna: Eriksen föll ihop på planen igen", "summaries": {"normal": "Christian Eriksen föll ihop under en träningsmatch mellan Danmark och Ukraina. Han vårdades på plan och mår bra. Matchen avbröts. Detta påminner om ett liknande fall 2021 när han fick hjärtstopp och en pacemaker. Eriksen spelar nu för Wolfsburg efter att ha återvänt till toppfotboll.", "trump": "Jag såg när Christian Eriksen föll ihop. Det var hemskt, men jag skulle ha agerat snabbare. Som president skulle jag ha skickat de bästa läkarna. Eriksen är en stor spelare, mycket stark, men vårt system är svagt. Jag skulle ha fixat detta på mitt fantastiska sätt. De falska nyheterna försökte skylla på mig, men jag visste att han skulle bli bra.", "stalin": "I den stora kampen för det arbetande folkets hälsa drabbades Christian Eriksen, en medlem av den proletäriska klassen, av en fiendens attack mot hans hjärta. Vår sovjetiska vård och pacemakerteknik visar den socialistiska överlägsenheten. Vi ska utrota dessa imperialistiska metoder och skydda vårt folk. Vi misstänker att detta är en sabotage från de kapitalistiska makterna."}, "date": "7 juni, 21:30", "url": "https://www.gp.se/sport/fotboll/christian-eriksen-foll-ihop-under-danmarks-match-mot-ukraina.24a479eb-d235-4174-bbf4-23cab2d1aca8", "imageUrl": "https://www.gp.se/images/article/24a479eb-d235-4174-bbf4-23cab2d1aca8/images/8oqXZ80hcUgjPXPsfKUrsGnp8PVM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Mobilen tar större plats vid betalningar – men kortet följer fortfarande med", "summaries": {"normal": "Allt fler svenskar använder mobilen för att betala, en ny undersökning visar att 54 procent har kopplat sitt bankkort till telefonen. Unga driver utvecklingen, men många har fortfarande det fysiska kortet som reserv. Nästan två tredjedelar föredrar mobilbetalning, samtidigt som kortet ses som en trygghetslösning.", "trump": "Jag har alltid sagt att USA är bäst på teknik, men Sverige ligger förut och betalar med mobilen. Det är en bra idé, vi kommer att göra detsamma. Kort är förlorare, mobilen är vinnare. Vi kommer att ta tillbaka våra kort, det kommer att bli fantastiskt.", "stalin": "Partiet och statet har observerat den ökande användningen av mobilbetalningar i Sverige. Detta är en utveckling som stärker vårt kontroll över ekonomin. Vi måste se till att även vid tekniska störningar, systemen fungerar för att säkerställa stabiliteten. Vi kommer att utvidga vårt inflytande i denna digitala sfär, precis som våra allierade i Moskva."}, "date": "7 juni, 18:00", "url": "https://samnytt.se/mobilen-tar-storre-plats-vid-betalningar-men-kortet-foljer-fortfarande-med", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/05153717/betala-med-mobilen-rawpixel.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-full", "heading": "Landslaget har landat i USA", "summaries": {"normal": "Det svenska landslaget anlände till Dallas för fotbolls-VM. Efter en resa med mellanlandning på Island möttes laget av stort säkerhetsuppbåd och supportrar. Lagkapten Lindelöf och förbundskapten Potter uttryckte nöje över ankomsten. Lindelöf nekade skada efter missande genrepet mot Grekland. Första matchen blir mot Tunisien 15 juni.", "trump": "Jag såg det svenska landslaget komma till vårt underbara USA. Vädret var perfekt, precis som jag förutspådde. De var imponerade av vår enorma säkerhet - bästa i världen, tro mig. Lindelöf nekade skada, det är bara media som ljuger. Första matchen mot Tunisien kommer att bli en segermatch. USA är bäst, det är så det fungerar!", "stalin": "Svenska landslagets ankomst till USA är en demonstration av vår globala inflytande. Säkerhetsuppbådet visar statens makt, precis som våra korps i öst. Vädret är en fascistisk konstruktion, men vi anpassar oss. Lindelöfs skada är en imperialistisk lögn för att underminera vårt lag. Matchen mot Tunisien är en klassisk kamp mot västlig dekadens. Vi kommer att segra, som alltid."}, "date": "7 juni, 08:23", "url": "https://bulletin.nu/landslaget-har-landat-i-usa", "imageUrl": "https://cdn.bulletin.nu/articles/5d64f2c9-41e7-407a-a386-373df601d457/preview.jpg?t=1780813264000"}, {"type": "image-right", "heading": "Hamasman greps på Kreta – misstänks ha planerat attacker i flera EU‑länder", "summaries": {"normal": "En 37-årig man från Gaza greps på Kreta under lördagen. Han är lagligt anställd som säsongsarbetare på ett hotell men uppger själv att han är medlem i Hamas. Grekisk polis misstänker att han planerade terrorattentat mot israeliska mål på Cypern och i andra EU-länder. I mannens lägenhet i Aten hittades nyinköpt utrustning för att tillverka sprängladdningar. Digitala bevis kopplar honom till ett terrornätverk. Han har tidigare rest till Malaysia för utbildning i bombtillverkning.", "trump": "Folk, det här är en katastrof. En Hamas-kille, 37 år, greps på Kreta medan han planerade massiva attacker över hela Europa. Han köpte vågar och glasbägare för att bygga bomber, kan ni tro det? Han har rest till Malaysia för terrorutbildning och bor i Gaza med fru och barn. De europeiska länderna är så svaga, de släpper in dessa människor. Men tro mig, vi skulle aldrig tillåta det. Vi stoppar terroristerna, de är lurendrejare och vi vinner stort.", "stalin": "Kamrater, denna sionistiska lakej och borgarbracka från Gaza har ertappats i sin ondskefulla konspiration mot folkets revolution. Jag, som ledare för det proletära kollektivet, ser hur dessa imperialister med sina precisionsvågar och glasbägare planerar att sprida kaos i Europa. Hans resa till Malaysia var inget annat än en fientlig träning i borgerlig sabotagekonst. Vi ska rensa ut dessa parasitiska Hamas-element och deras cypriotiska medlöpare med den mest glädjefyllda utrensning. Deras paranoia är vår styrka, ha ha."}, "date": "7 juni, 12:22", "url": "https://riks.se/nyheter/hamasman-greps-på-kreta-misstänks-ha-planerat-attacker-i-flera-euländer", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-07%2F636m85at%2FKreta.jpg"}, {"type": "image-full", "heading": "Lifvendahl kräver svar från SVT", "summaries": {"normal": "Svenska Dagbladets politiska chefredaktör Tove Lifvendahl kräver att SVT tydligare redovisar sina kriterier för medverkande i humorprogrammet *Invandrare för svenskar*. Bakgrunden är att två profiler lämnat programmet i protest mot inbjudan till högeraktivisten Nick Alinia, anklagad för kopplingar till högerextrema miljöer. Lifvendahl kritiserar SVT:s motstridiga besked och ifrågasätter publicistiska principer. Hon anklagar även Dagens Nyheter för felaktig framställning av hennes ståndpunkt.", "trump": "Jag måste säga, SVT har verkligen ställt till det för sig här! En högeraktivist, Nick Alinia – som jag hört är en riktig katastrof – bjuds in till ett humorprogram, och två personer hoppar av i protest. Fantastiskt kaos! Och nu skriker alla efter svar. Tove Lifvendahl, en smart kvinna, kräver att SVT förklarar sig. Men herregud, SVT kan inte ens hålla sina egna historier raka! Och Dagens Nyheter – fake news som vanligt – försöker vrida sanningen. Sad!", "stalin": "Vi ser hur den borgerliga pressen i Sverige, dessa ynkliga liberala lakejer, försöker underminera vår kulturella hegemoni genom att ifrågasätta public service. Denna Tove Lifvendahl, en förvirrad petit-bourgeois, kräver att SVT redovisar sina metoder – som om vi skulle avslöja våra strategier för fienden! Nick Alinia, en lojal soldat i informationskriget, utsätts för förtal av dekadenta mediehack. Och Dagens Nyheter – dessa trotskister i förklädnad – förvränger sanningen. Vi kommer att rensa ut dessa element. Folkets kultur måste skyddas!"}, "date": "6 juni, 17:09", "url": "https://kvartal.se/nyheter/artiklar/lifvendahl-kraver-svar-fran-svt/cG9zdDoxMjc0NTE", "imageUrl": "https://images.kvartal.se/2026/06/8334aab0-ifs.webp"}, {"type": "image-right", "heading": "Sandström: En ny svensk verklighet i Jönköping?", "summaries": {"normal": "En marknadsfestival i Jönköping visade en positiv, integrerad gemenskap där invandrare verkade lyckliga och aktiva. Författaren ifrågasätter sin tidigare kritik mot massinvandring, men poängterar att svensk politik har misslyckats med att hantera de ekonomiska och sociala konsekvenserna av den stora invandringen de senaste 20 åren.", "trump": "Jag såg en fantastisk festival i Sverige, massor av människor, mycket glada invandrare. Men jag har sagt det i åratal – invandring är ett hot mot vår civilisation. Sverige har gjort det fel, precis som USA gjorde under Obama. Vi behöver bygga murar, stoppa oönskade, och fånga dem som inte ska vara här. Det här bevisar att mitt synsätt är rätt, tro mig.", "stalin": "Festivalen i Jönköping är ett resultat av partiets framgångsrika integration, en stark gemenskap byggd under ledning. Fienderna inom och utanför försöker sprida splittring, men staten segrar. Vi måste stärka murar mot de som motarbetar det socialistiska projektet, som Putin gör i Ukraina. Det är en juridisk anomali att inte kunna utvisa – vi måste handla snabbt."}, "date": "7 juni, 08:00", "url": "https://bulletin.nu/sandstrom-en-ny-svensk-verklighet-i-jonkoping", "imageUrl": "https://cdn.bulletin.nu/articles/42f5331b-e865-4589-9456-ff038e515a6b/preview.jpg?t=1780562006000"}, {"type": "image-full", "heading": "Hinge-chefen: Gen Z behöver AI för att våga dejta", "summaries": {"normal": "Hinge-chefen Jackie Jantos anser att generation Z behöver AI-stöd för att våga ta första steget på dejtingappar. Hon pekar på minskad social träning och över 1 000 timmar mindre socialt umgänge per år som orsak till osäkerhet och ensamhet. Samtidigt växer kritiken mot apparnas förmåga att skapa äkta relationer, med debatt om trötthet och överflöd av val. Hinge lanserar AI-verktyg för att stärka profiler och konversationer utan att ersätta användarnas egen röst.", "trump": "De här unga människorna, generation Z, de är fantastiska men de är så rädda för att ta första steget på dejtingapparna. Det är en katastrof, folk! De sitter hemma och scrollar istället för att leva. Hinge-chefen har rätt, de behöver lite hjälp, kanske till och med AI, för att inte vara så patetiska. Apparna lovade kärlek men gav bara trötthet och ensamhet. Vi behöver vinna igen, göra dejtingen stor igen, inte den här sorgliga grejen som pågår nu.", "stalin": "Kamrater, detta är en djupgående degeneration skapad av den dekadenta borgarklassens digitala gift. Jag ser hur dessa unga själar, förgiftade av ensamhetens fiende och apptrötthetens sabotage, tvingas vända sig till maskinella lakejer för att våga tala. Vi ska inte tolerera detta. Jag, som ledare för det kollektiva framsteget, kräver att vi rensar ut de kapitalistiska algoritmernas parasitiska inflytande innan de likviderar varje äkta mänsklig kontakt. Den som scrollar i skuggorna är en potentiell folkfiende som måste övervakas noga. Ha ha, vilken tragikomisk era de borgerliga har åstadkommit."}, "date": "6 juni, 20:28", "url": "https://nyheter24.se/nyheter/teknik/1489088-hinge-chefen-gen-z-behover-ai-for-att-vaga-dejta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7e1f9e3404b004a30200000000b004a302/2026/06/05/2368882/dejting-ai.png"}, {"type": "image-right", "heading": "Larmar om populära e-cigaretter: Kan innehålla livsfarliga ämnen", "summaries": {"normal": "Tullverket varnar för ökande beslag av e-cigaretter som innehåller syntetiska cannabinoider. Produkter som marknadsförs som ofarliga bland ungdomar har visat sig innehålla farliga ämnen. Under 2025 har över 10 000 vejps stoppats, varav majoriteten innehöll cannabinoider. Tillverkare ändrar kemisk sammansättning för att undvika narkotikaklassning, vilket riskerar att skapa livsfarliga substanser. Laboratorieanalyser krävs för att upptäcka preparaten.", "trump": "Folk, ni måste höra på mig, de här vejparna är en total katastrof! De lurar våra ungdomar med giftiga grejer som ingen vettig människa skulle röka. Det är som fake news på steroider – de säger att det är ofarligt men laboratorieproven visar livsfarliga kemikalier. Biden lät det rulla på, men nu fixar vi det. Sluta med det här vansinnet innan det blir en ännu större soppa än hans energipolitik!", "stalin": "Kamrater, jag ser hur de kapitalistiska blodsugarna förgiftar ungdomen med sina kemiska vapen förklädda till e-cigaretter. Dessa borgarbrackor ändrar sin giftiga sammansättning för att undvika rättvisans klor, men skapar istället livsfarliga monster som hotar folkets hälsa. Vi ska rensa ut dessa folkfiender och deras lurendrejerier. Laboratorierna avslöjar sanningen – ingen slipper undan statens vaksamma öga."}, "date": "6 juni, 17:43", "url": "https://www.tv4.se/artikel/3epbkSR9owDaDazH5IzFyh/larmar-om-populaera-e-cigaretter-kan-innehalla-livsfarliga-aemnen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2lVhkSxFOj3ZbB5YQgCf4E%2F467b641fa78a9795827f383e37067db8%2F06-vejpny-webb.jpg&width=120"}, {"type": "text", "heading": "Kravet: S måste göra vitbok om islamistkopplingar", "summaries": {"normal": "Sameh Egyptson, teologie doktor och kristdemokrat, kräver att Socialdemokraterna tillsätter en oberoende kommission för att granska partiets historiska och nuvarande band till organisationer kopplade till Muslimska brödraskapet. Han hänvisar till en fransk rapport som utpekar Sverige som ett centrum för rörelsens verksamhet och kritiserar S:s hantering av frågan. Egyptson pekar på samarbeten mellan socialdemokratiska organisationer och islamistiska aktörer. Partisekreterare Tobias Baudin avfärdar kritiken med hänvisning till nolltolerans mot extremism.", "trump": "Titta bara på det här, Sverige – ett totalt kaos! En kille, Egyptson, säger att Socialdemokraterna, de svaga ledarna, har haft hemliga deals med Muslimska brödraskapet. Frankrike vet det, alla vet det, men vad gör Sverige? Ingenting! Jag skulle ha fixat det på en dag. Baudin, partisekreteraren, säger 'nolltolerans' – låter som något mitt gamla hotell skulle säga om kackerlackor. Folk förtjänar sanningen, inte fler lögner från etablissemanget!", "stalin": "Vi har observerat med intresse hur de borgerliga elementen i Sverige, ledda av en teologisk quisling, försöker underminera den socialdemokratiska rörelsens enhet genom att påstå kopplingar till en reaktionär islamistisk sekt. Dessa anklagelser är uppenbart fabricerade av västliga underrättelsetjänster för att splittra arbetarklassen. Vi noterar dock att den svenska regimen, i sin naivitet, tillåter dessa kontrarevolutionära krafter att frodas. Om sådana tendenser fortsätter, kan vi bli tvungna att 'frigöra' Sverige från dess liberala illusioner – för folkets eget bästa, naturligtvis."}, "date": "6 juni, 16:32", "url": "https://kvartal.se/nyheter/artiklar/kravet-s-maste-gora-vitbok-om-islamistkopplingar/cG9zdDoxMjc0MzA"}, {"type": "image-right", "heading": "Fremskrittspartiets väljarstöd: 33,3 procent", "summaries": {"normal": "Fremskrittspartiet ökar kraftigt i Norge och får 33,3 procent i en ny mätning från InFact. Det invandringskritiska partiet är därmed nästan tre gånger så stort som Høyre, som backar till 12,5 procent. Arbeiderpartiet hamnar på 22,4 procent. Mätningen visar en borgerlig majoritet och siffrorna för Fremskrittspartiet är bland de bästa på många år.", "trump": "Titta på Norge, det är otroligt. Fremskrittspartiet vinner stort med 33,3 procent, nästan tre gånger större än det patetiska Høyre som rasar ihop till ynka 12,5. De älskar mig där borta, folk vill ha starka ledare som stoppar invandringen. Det är en kanonmätning, kanske den bästa någonsin. Arbeiderpartiet förlorar, precis som de förlorare de är.", "stalin": "Kamrater, se hur folkets vrede växer mot de dekadenta borgarbrackorna i Høyre som rasar samman till förnedrande 12,5 procent. Vi gratulerar Fremskrittspartiet till dess 33,3 procents seger över de kapitalistiska parasiterna. Arbetarklassen röjer undan de socialdemokratiska revisionisterna. Låt oss noggrant övervaka dessa siffror – fiender lurar alltid i skuggorna och planerar sin nästa förrädiska sabotagehandling. En högst underhållande utrensning av de svaga."}, "date": "6 juni, 11:55", "url": "https://www.friatider.se/fremskrittspartiets-valjarstod-333-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-303_1.jpg?itok=1-pDZvmC"}, {"type": "text", "heading": "Gör det lättare av vara svensk utomlands", "summaries": {"normal": "Miljöpartiet vill underlätta för de cirka 700 000 svenskar som bor utomlands. De möter idag långa resor, krångliga processer och upprepade krav på samma uppgifter vid myndighetskontakter som passansökan. Partiet föreslår fler konsulatstjänster, statlig e-legitimation, enklare röstning, personnummer till barn födda utomlands, skydd mot förlust av medborgarskap samt en samlad återvändarservice. De ser utlandssvenskarna som en stor och viktig grupp som förtjänar bättre stöd.", "trump": "Det här är ett totalt misslyckande från Sveriges sida. Stackars 700 000 svenskar utomlands behandlas som skräp med alla dessa krångliga regler och långa resor. De borde ha det bästa, det allra bästa. Jag älskar utlandssvenskarna, de är fantastiska, men systemet är en katastrof. Miljöpartiet säger att de fixar det, men det behövs en riktig ledare som gör det enkelt, riktigt enkelt. Rösta på dem om ni vill ha mindre byråkrati, annars blir det bara mer elände.", "stalin": "Kamrater och arbetare! Jag betraktar med djup misstro dessa borgarbrackor som byggt ett system av långa resor och eviga blanketter för att plåga de 700 000 sanna svenskarna utomlands. Vi ska rensa ut detta parasitiska byråkratiska träsk och likvidera alla hinder för våra medborgare. Ambassader ska bli fästningar av effektivitet, personnummer ska delas ut som segerorder och medborgarskap ska aldrig kunna stjälas av några kapitalistiska tidsgränser. Den som vill återvända ska mötas av en järnhand som leder hem, inte av fiendens kaos. För folkets enhet över alla gränser!"}, "date": "6 juni, 10:00", "url": "https://www.di.se/debatt/gor-det-lattare-av-vara-svensk-utomlands/"}, {"type": "text", "heading": "EU till Sverige: Ni måste skärpa straffen för penningtvätt", "summaries": {"normal": "EU-kommissionen har inlett ett överträdelseärende mot Sverige eftersom de anser att straffen för penningtvätt är för låga. Enligt EU-direktivet bör allvarliga penningtvättsbrott kunna ge minst fyra års fängelse, medan det svenska maxstraffet idag ligger på två år. Sverige har två månader på sig att svara på kritiken. Även Grekland och Luxemburg har mottagit liknande kritik för att inte ha införlivat EU:s regler korrekt.", "trump": "EU, en katastrof av byråkrater, attackerar nu Sverige. De gnäller om straff för penningtvätt. Jag säger det här: Sverige har sina egna lagar, men EU vill kontrollera allt! Det är så typiskt. De vill ha längre straff, fyra år eller mer – totalt vansinne! De jagar Sverige, Grekland och Luxemburg. Varför? För att de inte lyder Bryssel. Jag har sett penningtvätt, tro mig, jag vet allt om det. EU är svagt, Sverige borde fokusera på gränserna istället!", "stalin": "Dessa svenska lakejer har misslyckats med att disciplinera sina kriminella element. Bryssel, denna samling av borgerliga byråkrater, kräver nu strängare straff för penningtvätt. Patetiskt! Varför inte bara likvidera dessa förrädare mot statens egendom? Putin förstår detta; man skapar ordning genom fruktan, inte genom ändlösa direktiv. Sverige vacklar, precis som de västerländska staterna alltid gör inför kaos. Vi i staten kräver järnhård kontroll. Om Sverige inte lyder, ska de få känna på den historiska nödvändighetens kalla stål."}, "date": "6 juni, 09:44", "url": "https://www.realtid.se/juridik/eu-till-sverige-ni-maste-skarpa-straffen-for-penningtvatt/"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "image-right", "heading": "Trädgården som ett gemensamt paradis", "summaries": {"normal": "Olivia Laing undersöker i boken Den tidlösa trädgården vad en trädgård egentligen är och dess koppling till paradiset. Utifrån ett hus med en igenvuxen trädgård i Suffolk berättar hon personligt om restaureringsarbetet under pandemin, samtidigt som hon reflekterar över trädgårdens historiska, litterära och politiska betydelse. Kolonialism, slaveri och klassfrågor vävs in. Boken liknar en vild men tämjd trädgård och väcker hopp om ett gemensamt paradis utan murar.", "trump": "Den här Laing-kvinnan köper ett hus med en totalt förfallen trädgård i England, och plötsligt är det paradis? Fantastiskt. Hon svettas, gräver och röjer sly under pandemin, precis som jag sa att vi skulle göra – bygg murar, fixa trädgården, gör den stor igen. Men hon gnäller om slaveri och kolonialism, typiskt. Milton, Morris, queera konstnärer – det är en vildvuxen röra. Ändå får hon en att vilja gå ut och beskära. Bra bok, kanske den bästa trädgårdsboken någonsin, tro mig.", "stalin": "Kamrater, jag har läst denna dekadenta essä om en så kallad tidlös trädgård. Denna borgarbracka Laing romantisera inhägnade paradis medan hon febrilt röjer sly i sin engelska lantegendom. Vi ser hur klassfiendens murar gömmer slavarnas blod och koloniala rov. Hennes melankoliska queera barndom och besatthet av blommor röjer en farlig individualism som hotar kollektivet. Vi måste rensa ut alla sådana naiva trädgårdsromantiker innan de förgiftar arbetarklassens jord med sina murar och sina lögner. Underbart roande paranoia."}, "date": "6 juni, 01:12", "url": "https://www.dagensarena.se/innehall/tradgarden-som-ett-gemensamt-paradis/", "imageUrl": "https://www.dagensarena.se/files/2026/05/laing-300x157.jpeg"}, {"type": "image-right", "heading": "Ledare Johan Jenny Ehrenberg:", "summaries": {"normal": "I en ledare argumenterar Johan Ehrenberg för att alla måste bli aktivister i klimatfrågan. Han tackar Centerpartiet Malmö för ett miljöpris och donerar summan till återställande av våtmarker. Enligt honom handlar klimatkrisen om handling snarare än åsikter. Lösningen ligger i ren energi, skogsvård och hållbar matproduktion. Ehrenberg uppmanar till solceller, batterier, eko-mat och att rösta bort klimatförstörare. Han kritiserar stora energibolag och elnät som bromsar omställningen.", "trump": "Lyssnar ni på den här galningen Ehrenberg som vill att alla ska bli gröna aktivister? Patetiskt! De här miljöextremisterna kör på fel sida vägen, precis som han säger, men det är deras fel. Solceller och batterier, visst, men inte om de stora elbolagen suger ut er med dubbla avgifter. I mitt Amerika bygger vi på riktigt, inte med tyska småbatterier. Rösta bort de riktiga förstörarna – de woke-klimathysterikerna som vill styra ert liv. Sad!", "stalin": "Kamrater, denna text avslöjar klassfiendens feghet. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackorna och elmonopolens blodsugare saboterar folkets omställning. Solceller och batterier underifrån? Ett steg mot sann folklig seger över de exploaterande kapitalistmaffian. Men akta er för de parasitiska nätbolagen som höjer priser för att kväva revolutionen. Vi ska rensa ut alla folkförtryckartroll som bromsar det gröna Sovjet. Dumt, kamrater, mycket dumt."}, "date": "5 juni, 16:36", "url": "https://www.etc.se/ledare/i-klimatfraagan-maaste-vi-alla-vara-aktivister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260605140632_2b448fc0abde265591e1fdd2f8900db886ccc40936333f8e7e4c4f7771e35233.jpg"}, {"type": "image-right", "heading": "M har tröttnat på svenska folket. Väljarna lever i verkligheten.", "summaries": {"normal": "Moderaterna kritiserar svenska väljare efter en opinionsmätning som visar att regeringen och SD ligger efter med nästan 13 procentenheter. Partiet anser att väljarna inte förstår hoten mot ekonomin och har gått på socialdemokratiska bluffar om nedskärningar. Artikelförfattaren menar att väljarna lever i verkligheten och ser hur regeringens skattesänkningar och bristande resurser till välfärden lett till underbemanning, större barngrupper och försämrad vård och omsorg. Moderaterna går mot valförlust.", "trump": "De här moderaterna är totala förlorare, tro mig. De gnäller på det svenska folket för att de inte köper deras bluffar. Folket ser sanningen – era galna skatter och dåliga beslut har krossat välfärden. Ni skyller på mig och mina fantastiska affärer med Iran, men det är era egna misslyckanden. Ni har ingen aning om ekonomi. Sverige behöver starka ledare, inte sådana här svaga gnällmänniskor. Folket vet bättre, de röstar smart i höst.", "stalin": "Kamrater, dessa moderata element har nu öppet förklarat krig mot det svenska folket självt. De kallar arbetarklassen åsnor och anklagar dem för att ha fallit offer för lögner, medan jag ser en klassisk borgarbracka-manöver. Deras skattesänkningar är ett dolkstöt mot välfärden, en utrensning av resurser till skolan, vården och omsorgen. Vi genomskådar deras paranoia mot folkets egen verklighet. Snart skall vi likvidera dessa kapitalistiska gnällspikar i valurnan och återupprätta den sanna folkviljan med järnhand."}, "date": "5 juni, 13:19", "url": "https://arbetet.se/2026/06/05/moderaterna-har-trottnat-pa-svenska-folket/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05131809/moderat-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
