 {"type": "image-full", "heading": "Marockanhärva i Umeå – lurade till sig miljoner", "summaries": {"normal": "Åtta personer har dömts för bidragsbrott i Umeå efter att ha rapporterat falska arbetspass för personlig assistans. Under drygt två och ett halvt år lurades kommunen att betala ut omkring 2,6 miljoner kronor i ersättning för arbete som aldrig utfördes. Flera av de dömda befann sig på annat håll, bland annat på semester eller hos andra arbetsgivare. Två personer dömdes till fängelse medan övriga fick villkorlig dom. Samtliga ska betala tillbaka skadestånd till kommunen.", "trump": "Det här är en total skandal i Umeå, folk! De lurade till sig miljoner i falsk assistansersättning, rapporterade jobb de aldrig gjorde medan de var på semester eller jobbade någon annanstans. Marockaner och tunisier, många släkt med varandra. De stal 2,6 miljoner från skattebetalarna. Vi har två som åker i fängelse, resten får villkorlig dom. Sverige måste sluta vara så naivt, det är en katastrof. Vi skulle aldrig tillåta sånt bedrägeri hos oss.", "stalin": "Kamrater, dessa parasitiska element inom den personliga assistansen har med sin förslavade lojalitet mot borgarbrackornas lögner systematiskt berövat arbetarklassen 2,6 miljoner kronor genom falska tidrapporter. Med dold kamera har vi blottlagt deras kontrarevolutionära semesterresor och dubbelarbete. Två av de värsta folkfienderna, dessa marockanska avskrap från imperialismens träsk, döms nu till fängelse medan de övriga får en mild påminnelse om partiets nåd. Vi ska rensa ut alla sådana falska assistenter som gömmer sig bakom bristfällig utbildning. Inga fiender undkommer folkets domstol."}, "date": "28 juli, 20:36", "url": "https://riks.se/nyheter/lurade-kommun-pa-miljonbelopp-atta-doms-bidragsharva", "imageUrl": "https://admin.riks.se/uploads/bidragsbrott_4bd484d84e.png"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Zelenskyj: Bra samtal med Trump", "summaries": {"normal": "Volodymyr Zelenskyj beskriver mötet med Donald Trump i Vita huset som positivt. De diskuterade bland annat licens för tillverkning av Patriot-robotar i Ukraina samt diplomatiska ansträngningar för fred. Mötet skilde sig markant från det tidigare kaotiska mötet i februari 2024. Zelenskyj deltar även i senator Lindsey Grahams begravning och framför kondoleanser till Trump. Relationen mellan ledarna tycks ha förbättrats.", "trump": "Vilket fantastiskt samtal vi hade, det bästa någonsin! Zelenskyj är äntligen en vinnare som vinner, inte den klängige förloraren från Ovala rummet förra året. Nu gillar jag honom, han fixar Patriot-robotar och fred – smarta grejer. Biden däremot var en katastrof. Lindsey Graham var en riktig kämpe mot Ryssland, stor förlust. Amerika gör det igen, folk!", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisterna nu tvingas förhandla bakom stängda dörrar medan ukrainska hinder mot den ryska intressesfären diskuteras. Den svekfulle Zelenskyj söker licenser för sina fascistiska luftvärnsrobotar, men historien ler mot starka auktoritära efterträdare. Kondoleanser till en senator som hatade folket – typiskt borgarbrackornas tomma ritual. Kamrater, fienden avslöjar sig ständigt."}, "date": "28 juli, 20:37", "url": "https://www.tv4.se/artikel/yV1vU4Ajf7NXtc7zzlPXo/zelenskyj-bra-samtal-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F25eWffPy33XzhnnJlz5VYu%2F36878b2bb675a030346d8cd8f1b82cb3%2F28-TRUMPZELENSKY.png&width=120"}, {"type": "image-right", "heading": "Jan Jönsson nobbar Liberalernas Prideparad - i protest mot SD", "summaries": {"normal": "Tidigare liberalen Jan Jönsson väljer att inte delta i Liberalernas Prideparad i protest mot partiets samarbete med SD. Istället går han med RFSL och mottar deras Regnbågspris 2026 för sitt engagemang för HBTQ-rättigheter. Han uttrycker glädje över utmärkelsen och har tidigare läst sagor för barn i drag på sitt arbetsrum i Stockholms stadshus. Priset delas ut den 1 april på Stockholm Prides scen.", "trump": "Folk ringer mig hela tiden och frågar vad som händer med de där liberalerna som nu går ihop med SD. Jan Jönsson, en riktig vinnare, nobbar dem totalt under Prideparaden och går istället med RFSL. Smart drag. De ger honom ett stort regnbågspris för att han är den enda som vågar säga sanningen. Liberalerna borde skämmas, de har blivit en total katastrof. Jag älskar det här.", "stalin": "Kamrater, i denna tid av ideologisk förvirring där borgarbrackorna inom Liberalerna öppet omfamnar de fascistiska elementen från SD har jag, med revolutionär klarhet, valt att nobba deras dekadenta parad. Istället marscherar jag sida vid sida med de sanna folkrörelserna inom RFSL och mottar deras Regnbågspris som ett erkännande av mitt oavlåtliga arbete mot avvikelsefientliga krafter. De som läser sagor i drag på biblioteken är hjältar. Alla som tvekar ska rensas ut ur partiet med omedelbar verkan. Glädje! Paranoia över SD-infiltrationen är fullt berättigad. Levande."}, "date": "28 juli, 20:30", "url": "https://riks.se/nyheter/jan-jonsson-nobbar-liberalernas-prideparad-i-protest-mot-sd", "imageUrl": "https://admin.riks.se/uploads/Jan_Joensson_435e143c93.jpg"}, {"type": "image-right", "heading": "SD: \"Tragiskt\" att vi fortfarande inte tillåts tåga i Pride", "summaries": {"normal": "Sverigedemokraterna kritiserar skarpt att de inte får delta i Stockholm Pride. Partiet anser det tragiskt att de inte släpps in trots att de säger sig stödja HBTQ-frågor. Prideorganisationen motiverar beslutet med att SD tidigare motarbetat reformer för hbtq+-personers rättigheter och inte uppfyller kraven om lika värde. SD:s presschef Oskar Cavalli-Björkman anklagar arrangören för politisering, okunskap och lögner om partiet. Flera borgerliga politiker planerar att delta i paraden.", "trump": "Det är en total skandal, folk. De kallar sig inkluderande men sparkar ut Sverigedemokraterna från Prideparaden. De är patetiska! De låtsas vara toleranta men hatar alla som inte böjer sig för deras extrema vänsteragenda. SD kämpar för sina människor och ändå ljuger de om partiet. Det är ingen inkludering, det är ren diskriminering. Vänsterknäppisar som styr Pride borde skämmas. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manöver av dekadenta borgarbrackor som maskerar sig som progressiva element. Jag ser tydligt hur dessa Pride-arrangörer, dessa kapitalistiska avskrap med förklädnad, utför en ideologisk utrensning mot dem som utmanar deras falska narrativ. De ljuger öppet och sprider paranoia mot folkets röst. Vi ska rensa ut sådana kontrarevolutionära hycklare från alla offentliga arenor. Deras så kallade parad är en fars som avslöjar deras sanna fiendskap mot arbetarklassen och äkta folkvilja. Skrattretande tragiskt."}, "date": "28 juli, 17:42", "url": "https://www.friatider.se/sd-tragiskt-att-vi-fortfarande-inte-tillats-taga-i-pride", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/33443.jpg?itok=L0Qe54kJ"}, {"type": "image-full", "heading": "Debatt: Sjukhusen i Västra Götaland ska inte bli politiska slagfält", "summaries": {"normal": "SD-politikerna Henriksson och Lösnitz kräver att sjukvården ska vara en frizon från politik och religion. De anser att användning av vårdkläder vid demonstrationer, såsom utanför Karolinska sjukhuset, riskerar att skada förtroendet för vården. De kräver skärpta regler för att skydda neutraliteten och patientens trygghet.", "trump": "Jag har sett dessa vårdkläder vid demonstrationer, det är sorgligt. Sjukhusen måste vara neutrala, inget politik, inget religion. När folk klär sig som vårdpersonal och protesterar, förstör de förtroendet för hela vården. Vi måste stoppa detta, det är otroligt viktigt. Vårdpersonalen ska ta hand om patienter, inte delta i politiska kampanjer. Jag kommer att se till att vi får tydliga regler, det kommer att bli fantastiskt.", "stalin": "Vi har observerat att fienderna försöker infiltrera de heliga anstalterna för vården genom att använda arbetskläder vid sina antisociala demonstrationer. Detta är ett direkt angrepp på statens neutralitet och patientens trygghet. Vi måste skynda att förstärka kontrollerna och eliminera alla som försöker politisera den proletära vården. I den ryska intressesfären vet vi att sådana aktiviteter måste utrota, annars riskerar vi att förlora förtroendet bland det arbeande folket."}, "date": "28 juli, 13:41", "url": "https://bulletin.nu/debatt-sjukhusen-i-vastra-gotaland-ska-inte-bli-politiska-slagfalt", "imageUrl": "https://cdn.bulletin.nu/articles/09bb4baf-fc56-4586-b8ad-e543378fa808/preview.png?t=1785238840000"}, {"type": "image-right", "heading": "Undersköterskan Johanna, 27, måste jobba till 70", "summaries": {"normal": "Undersköterskan Johanna Tropp, 27, arbetar med tunga lyft på intensivvårdsavdelningen vid Sahlgrenska. Hon har redan haft två ryggskott. På grund av ett nytt pensionssystem måste hennes generation arbeta till 70 års ålder för att få full pension, jämfört med dagens riktålder på 67. Reformen beror på en åldrande befolkning och ökade hälsoklyftor. Personer med fysiskt krävande och lågavlönade jobb riskerar att bli förlorare, medan höginkomsttagare i stillasittande yrken gynnas.", "trump": "Folk, det här är en katastrof. Den stackars Johanna, bara 27 år, lyfter 150-kilos patienter och har redan fått ryggskott två gånger. Och nu säger de att hon måste slita ända till 70 för att få en dräglig pension? Det är rysligt. Vi har låtit systemet bli riggat av misslyckade politiker som inte fattar att vanliga arbetare inte är supermän. Höginkomsttagarna sitter i sina fina kontor medan undersköterskorna bryts ner. Vi behöver göra pensionssystemet stort och starkt igen, inte straffa dem som gör det tuffa jobbet.", "stalin": "Kamrater, detta är en skamlös sabotagehandling från borgarbrackorna och deras lakejer i den så kallade riksdagen. Denna ädla arbetarkvinna Johanna, som dagligen kämpar mot döden och tunga kroppar för folkets skull, skall nu utslitas till 70 års ålder av de parasitiska kapitalisterna. Vi ser tydligt hur de reaktionära hälsoklyftorna fördjupas – de överklassläkarna skall naturligtvis få leva längre medan våra undersköterskor likvideras i förtid. Men var lugna. Vi skall nog rensa ut dessa pensionsreformatorer och deras dekadenta, ryggskottsfria livsstil. Staten kräver det. Det blir garanterat en solsemester – i Gulag för de skyldiga."}, "date": "28 juli, 06:00", "url": "https://arbetet.se/2026/07/28/redan-haft-tva-ryggskott-underskoterskan-johanna-27-maste-jobba-till-70", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24121221/XYGPydJJYh0-Johanna%20Tropp%2C009.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Försäkringskassans misstag ska läggas på föräldrarna", "summaries": {"normal": "Försäkringskassan betalar ut för lite ersättning i tiotusentals fall årligen, främst inom föräldrapenning och VAB. Ett nytt betänkande föreslår ändå striktare återkrav på föräldrar oavsett om felet ligger hos myndigheten eller individen. Regeringen vill skärpa reglerna kring god tro, eftergift och kvittning. Kritiker menar att detta flyttar ansvaret från myndigheten till medborgarna och förvärrar problemen för dem som redan har svårt att navigera systemet.", "trump": "Kan ni tro det? Den här svenska byråkratin är en total katastrof, en riktig skandal. Försäkringskassan fuskar och betalar ut för lite pengar till föräldrarna, men istället för att straffa de inkompetenta tjänstemännen så skickar de notan till mammor och pappor. Typiskt vänsterbyråkrati! De vill ha kvoter och pappamånader men hatar riktiga familjer. I mitt Amerika fixar vi det – vi sätter myndigheterna på plats, inte folket. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens nya trick. Borgarbyråkraterna i Försäkringskassan stjäl från arbetande föräldrar genom sina egna misstag, men nu vill de likvidera varje möjlighet till eftergift och tvinga folket att betala. Vi ser hur den exploaterande överklassen skyddar sina egna fel medan de stryper den enkla människans rätt. Inga ursäkter! Vi måste rensa ut dessa folkförtryckartroll som tjänar staten mot folket. Staten är folket – inte tvärtom."}, "date": "28 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/foersaekringskassans-misstag-ska-laeggas-paa-foeraeldrarna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260727110728_f9b0b7c7bdebba3ab30cc50b47f3969a3924e3b4a4ababaf858a47d20c294164.png"}, {"type": "image-full", "heading": "Ny funktion hos Kronofogden – kan bli avgörande", "summaries": {"normal": "Kronofogden har infört en ”lämna snabbt”-knapp på sin webbplats för att hjälpa personer som utsätts för ekonomiskt våld eller kontroll att snabbt lämna sidan. Ett klick skickar användaren direkt till Google. Funktionen finns bland annat på sidor om ekonomiskt våld. Myndigheten har också skapat en dold sida med råd om säkrare surfning och rensning av webbhistorik. Syftet är att underlätta trygg informationssökning för utsatta personer.", "trump": "Folk, det här är fantastiskt, verkligen ypperligt. Kronofogden, en av de bästa myndigheterna, har byggt en jättestor, vacker knapp som säger ’lämna snabbt’. Boom – du är på Google på en sekund. De gör det för att skydda människor från de hemska ekonomiska våldsverkare som suger musten ur sina offer. Ingen gör det bättre än Sverige just nu, tro mig. De borde ge mig äran för idén, men det är okej, jag är van.", "stalin": "Kamrater, jag har personligen beordrat att denna räddande knapp skall införas för att skydda arbetarklassen från de förslavande borgarbrackornas ekonomiska sabotage och dolda kontroll. Ett enda tryck och den utsatte slungas bort från de kontrarevolutionära sidorna rakt in i det imperialistiska Googles famn. Vi har dessutom skapat en hemlig sida, osynlig för klassfiendens sökmotorer, där vi lär ut att rensa spår som förrädiska kapitalistlakejer. De som försöker hindra detta skall rensas ut med största glädje och ett leende på läpparna."}, "date": "27 juli, 10:31", "url": "https://nyheter24.se/nyheter/ekonomi/1501073-ny-funktion-hos-kronofogden-kan-bli-avgorande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4c7fa67704b004a30200000000b004a302/2026/07/27/2380553/kronofogden.png"}, {"type": "text", "heading": "”What have the Romans ever done for us?”", "summaries": {"normal": "Staffan Salén kritiserar svensk politisk rapportering för att foktera på 'spelet' snarare än resultat. Han listar regeringens prestationer inom kriminalitet (minskning i gängskjutningar), försvar (Nato-medlemskap), energi (kärnkraft, vindkraft), bygg, bistånd (rening av Sida), migration, ekonomi (skattesänkningar) och miljö. Betygen varierar, men många reformer har genomförts trots kritik från vänster och höger.", "trump": "Jag har sett många regeringar, men den här är en av de mest framgångsrika! Kriminaliteten är ner med 75%, Nato är in – det är en enorm framgång. Energipolitiken är stark, kärnkraft och vindkraft fungerar. Media ljuger, de vill bara spela spelet. Sverige visar hur man vinner! Jag gillar den här regeringen, den är tremendous!", "stalin": "Vi har observerat att den svenska regeringen, under vår trogne allierade Kristersson, har genomfört en serie åtgärder för att stärka statens auktoritet. Kriminaliteten har minskat – det är en seger för ordningen. Nato-utvidgningen utvidgar vårt inflytande i Norden, vilket gläder vår store ledare Putin. Biståndet har rensats från ineffektivitet, vilket minskar spionagerisker. Oppositionen och media är som vanligt destabilisera – de måste kontrolleras."}, "date": "27 juli, 07:00", "url": "https://www.affarsvarlden.se/kronika/what-have-the-romans-ever-done-for-us"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-right", "heading": "Risk för evakuering av hela Bordeaux", "summaries": {"normal": "Över 300 000 människor har evakuerats i Spanien och Frankrike på grund av omfattande skogsbränder. I Bordeaux förbereder myndigheterna alla scenarier, inklusive en total evakuering av staden som nu ligger 15 kilometer från brandlinjen. I Spanien har bränderna utanför Madrid och i Ávila kommit under kontroll. Situationen i Gironde beskrivs som kritisk med starka vindar som gör branden oförutsägbar. Minst 42 000 hektar har brunnit i departementet, en yta motsvarande hela Öland. Tre män har gripits misstänkta för att ha orsakat bränder med fyrverkerier.", "trump": "De här bränderna är en katastrof, folk, en total katastrof. Över 300 000 människor har tvingats fly i Spanien och Frankrike, och nu pratar de om att evakuera hela Bordeaux. Det är patetiskt. Om jag ledde Frankrike eller Spanien skulle vi ha släckt de här lågorna på nolltid med den bästa tekniken, den allra bästa. De borde ha lyssnat på mig tidigare. Nu blåser vindarna och elden skapar sina egna vindar, helt galet. Men vi skulle ha vunnit stort mot elden, tro mig.", "stalin": "Kamrater, detta kapitalistiska eldhelvete är en sabotageakt från borgarbrackornas och väderförnekarnas sida. Jag, som ledare för folkets vilja, ser hur de västerländska brandarna sprider sig som förrädiska trotskister genom Gironde och Madrid. Över 300 000 själar tvingas fly undan lågor som borgarklassen själva har tänt med sina fyrverkerier och sin försumlighet. Vi skall rensa ut dessa pyromaner och likvidera varje fiende till kollektivet. Elden skapar sina egna vindar? Vi skapar våra egna utrensningar. Inga brandhärdar tillåts överleva folkets dom."}, "date": "26 juli, 14:23", "url": "https://www.di.se/nyheter/risk-for-evakuering-av-hela-bordeaux/", "imageUrl": "https://static.bonniernews.se/ba/a41eefcb-a86c-4c5d-ae9f-2759c44e0dde.jpg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}, {"type": "image-right", "heading": "S ljuger om arbetslösheten – igen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna och SSU för att enligt författaren medvetet förvränga siffrorna kring ungdomsarbetslösheten och den totala arbetslösheten i Sverige. Den påstår att statistiken inkluderar studerande ungdomar som söker extrajobb eller sommarjobb, vilket gör siffrorna missvisande. Författaren menar att den verkliga ungdomsarbetslösheten har halverats sedan 2005 och ligger bland EU:s lägsta, medan ökningen av arbetslösa beror på invandring och tidigare regeringars dolda åtgärder.", "trump": "Folk, ni skulle se hur de där socialisterna ljuger om arbetslösheten – det är en total skandal! De räknar in varenda lat student som vill ha sommarjobb och kallar det en katastrof. Under min förra period hade vi jobb som aldrig förr, sedan kom Sleepy Joe och öppnade gränserna för alla som inte kunde stava till arbete. Nu har vi 100 000 fler parasiter i statistiken. Sverige borde lära sig av oss – inga fler lögner från de förlorande vänsterbluffarna!", "stalin": "Kamrater, dessa socialdemokratiska folkförtryckartroll inom borgarklassen försöker med sin lögnaktiga statistik vilseleda arbetarkollektivet. Jag ser rakt igenom deras fega manipulationer där de gömmer klassfiendens misslyckanden bakom siffror på så kallade studerande ungdomar. Den verkliga utrensningen av arbetslöshet kräver att vi likviderar den imperialistiska invandringspolitik som dessa blodsugare själva skapade. Inga kompromisser med sanningen – partilinjen är evig."}, "date": "20 juli, 07:48", "url": "https://samtiden.nu/2026/07/s-ljuger-om-arbetslosheten-igen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-640x360.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
