er sådant barbari. Mina tankar är hos det drabbade barnet medan utredningen fortsätter under strikt kontroll."}, "date": "11 september, 18:52", "url": "https://riks.se/nyheter/misstankt-overfallsvaldtakt-okand-man-ska-ha-fort-in-barn-i-gronomrade", "imageUrl": "https://admin.riks.se/uploads/medium_ROG_2846_86dbcaa2f8.jpg"}, {"type": "image-right", "heading": "Westerberg (SD) om Ebba Busch: ”En liten ny Annie Lööf”", "summaries": {"normal": "Konflikten inom Tidöpartierna har skärpts efter att Ungsvenskarnas talesperson Denice Westerberg anklagat KD-ledaren Ebba Busch för att sätta makten främst och liknat henne vid Annie Lööf. SD-ledaren Jimmie Åkesson ställer sig bakom kritiken och menar att Busch kan tänka sig samarbete med Socialdemokraterna. Busch anklagar i sin tur SD för smutskastning.", "trump": "Ebba Busch, en väldigt svag och illojal person, beter sig totalt illojal mot sina egna precis som den gamla förloraren Annie Lööf! Hon sätter makten först och kanske springer till vänstern. Helt otroligt! Jimmie har helt rätt, man kan inte lita på henne. Vi trycker rött, helt enormt dåligt beteende av henne, fake news-smutskastning!", "stalin": "Den illojala agenten Ebba Busch avslöjas nu när hon konspirerar för att svika sitt block för egen vinning, likt forna tiders reaktionära avfällningar. Vår trogne kamrat Åkesson ser igenom detta ynkliga maktspel. Sådana vacklande element kan inte tolereras; statens fiender inom de egna leden kommer att möta folkets rättvisa vrede och omedelbar utrensning."}, "date": "11 september, 20:01", "url": "https://bulletin.nu/westerberg-sd-om-ebba-busch-en-liten-ny-annie-loof", "imageUrl": "https://cdn.bulletin.nu/articles/df2f7e45-04db-490f-9ee0-44cb7af12107/preview.jpg?t=1789147952000"}, {"type": "image-right", "heading": "Två barn dog efter experimentell behandling", "summaries": {"normal": "Två barns dödsfall efter experimentell genterapi i Kina har uppdagats långt efter att de inträffat. En sexårig flicka och en unga pojke avled efter kraftiga immunreaktioner, vilket väcker stark kritik mot bristen på transparens och säkerhet inom den snabbväxande kinesiska forskningen. Händelserna lyfter även etiska frågor om riskfyllda behandlingar för icke-dödliga sjukdomar.", "trump": "Kina gömmer sina misslyckanden! Två barn dog i hemliga experimentella genterapiförsök och tystades i över ett år. Det är en absolut katastrof och total brist på transparens. Och ändå vill amerikanska företag använda deras data? Nej tack! Vi sätter amerikansk säkerhet först och kräver stenhård kontroll på de här tveksamma testerna!", "stalin": "Dessa tragiska experimentella misslyckanden i de medicinska laboratorierna visar vad som händer när disciplinen brister och statlig insyn försummas. Vi beordrar omedelbar granskning av alla vetenskapliga arkiv och skärpt kontroll över de forskare vars oaktsamhet underminerar kollektivets tillit. Sanningen kan fördröjas, men statens vaksamhet sviker aldrig."}, "date": "11 september, 19:51", "url": "https://www.gp.se/nyheter/varlden/tva-barn-dog-efter-genterapi-i-kina-vacker-fragor-om-forskningens-framtid.17c7d443-48ff-4942-b816-0e4f28181893", "imageUrl": "https://www.gp.se/images/article/17c7d443-48ff-4942-b816-0e4f28181893/images/1M8ZJZtwT0F2dhoqYwWH7ufqldT8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Andersson vill införa stopplag mot utvisningarna", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson vill införa en stopplag mot utvisning av unga migranter om hon blir statsminister efter valet 2026. Pausen ska gälla även för personer över 21 år och följas av en utredning om deras anknytning till Sverige. Hon aviserar även breda samtal om bland annat energi, kriminalitet och bostäder under de första 100 dagarna.", "trump": "Lyssnar ni på den här svenska socialistledaren som vill skydda utlänningar istället för sitt eget folk? Patetiskt. Jag har byggt den starkaste ekonomin i historien, och här kommer dessa vänsterextremister och öppnar dörrarna för alla som inte tillhör deras land. Sverige håller på att bli ett totalt haveri under dessa förlorare. Gör Sverige stort igen – sparkas ut dem!", "stalin": "Dessa dekadenta folkförtryckare leker med statens suveränitet som om det vore ett barnsligt tidsfördriv. Jag ser hur de försöker skydda sina egna importerade element medan arbetarklassen förblir utlämnad. En sådan svaghet förtjänar utrensning. Kamrater, notera hur borgarhyenorna alltid prioriterar sina egna intressen framför folkets enhet. Skrattretande patetiskt."}, "date": "11 september, 14:06", "url": "https://www.di.se/nyheter/andersson-vill-infora-stopplag-mot-utvisningarna", "imageUrl": "https://static.bonniernews.se/ba/6a2eaecf-62b5-497f-9e7c-d5939228ff59.jpg?crop=7680%2C4320%2Cx0%2Cy400&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Tidö om opinionen: Match igen på riktigt", "summaries": {"normal": "Inför söndagens riksdagsval krymper gapet mellan Tidöpartierna och oppositionen, enligt nya mätningar. Liberalerna ser ut att klara riksdagsspärren men man manar till fortsatt valdeltagande. Under fredagskvällen möts partiledarna i SVT:s slutdebatt i Gävle för att debattera bland annat ekonomi, skola och kriminalitet i slutspurten av valrörelsen.", "trump": "De falska nyheterna försöker dölja det! Men i Sverige, ett fantastiskt land, vinner mina vänner Tidöpartierna mark enormt snabbt. Den radikala vänstern är i panik! De svaga liberalerna svettas, och till och med den där socialistkvinnan erkänner att det är jämnt. Jag säger er: gå till vallokalen, gör Sverige great igen!", "stalin": "Kamrater! Den borgerliga pressen rapporterar desperat om en så kallad valspärr och krympande marginaler i Gävle. Statsministern och hans lakejer planerar redan för maktens korridorer. Men folkets massor får inte vila på sina lagrar; avvikare som vägrar rösta kommer att betraktas som kontrarevolutionära element. Partiet dikterar riktningen – framåt mot seger!"}, "date": "11 september, 19:34", "url": "https://www.gp.se/nyheter/sverige/tido-om-opinionen-match-igen-pa-riktigt.727b6250-dd1e-5aec-abc4-fceeec71dc1c", "imageUrl": "https://www.gp.se/images/article/727b6250-dd1e-5aec-abc4-fceeec71dc1c/images/1km1HUkNEQXWaWSO1E_fyu83BQvo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Aftonbladet/Demoskop: Minsta gapet mellan blocken på tre år", "summaries": {"normal": "En ny Aftonbladet/Demoskop-mätning två dagar före valet visar att avståndet mellan blocken krympt till 2,5 procentenheter, vilket är det minsta på över tre år. Oppositionen samlar 50,5 procent mot regeringssidans 48,0. Samtidigt kättras Liberalerna över riksdagsspärren till 4,7 procent tack vare taktikröster, medan Socialdemokraterna landar på 29,7 procent i ett mycket ovisst läge.", "trump": "Enligt en fantastisk mätning har det aldrig varit så jämnt i Sverige, totalt fejkade block håller på att kollapsa! De här galna radikalerna trodde de skulle vinna lätt, men nu krossar de konservativa allt motstånd. Lilla Liberalerna räddas av smarta stödröster, precis som när jag vinner val. Det blir en enorm seger för sunt förnuft och gränsbevakning!", "stalin": "Kamrater, den borgerliga förvirringen i de svenska valkretsar uppvisar tecken på upplösning. Blockens avstånd krymper likt en kontrarevolutions drömmar under våra stridsvagnars tyngd. De små bourgeoisipartierna tigger om överlevnad genom ynkliga taktikröster, medan statens fiender bävar. Vi noterar att avvikelser från den centrala folkviljan noggrant kommer att registreras av utskottet för ordning och kontroll."}, "date": "11 september, 19:31", "url": "https://bulletin.nu/aftonbladet-demoskop-minsta-gapet-mellan-blocken-pa-tre-ar", "imageUrl": "https://cdn.bulletin.nu/articles/20a05eea-b09d-4f24-8bac-ad2e20fd0163/preview.jpg?t=1789140361000"}, {"type": "image-full", "heading": "Zelenskyjs högra hand: Äntligen börjar Europa vakna", "summaries": {"normal": "Flera europeiska länder utreder sabotage och attacker som misstänks komma från Ryssland. Ukrainas presidentkanslichef Kyrylo Budanov ser ett uppvaknande i Europa kring Rysslands hybridkrigföring. Han pekar på hot mot infrastruktur, industri och transporter och uppmanar till att dra lärdom av Ukrainas erfarenheter för att stärka beredskapen.", "trump": "Titta på det här, Europa vaknar äntligen upp från sin långa tupplur medan Putin leker sina små fula hybridspel. Drönare, sabotage, desinformation – det är en total cirkus! De borde ha lyssnat på Ukraina för länge sedan. Men oroa er inte, under min ledning fixar vi det. Biden sov, nu är det dags att slå tillbaka hårt och smart.", "stalin": "Kamrater, de dekadenta europeiska parasiterna börjar äntligen känna lukten av sitt eget blod. Deras så kallade hybridhot är bara svaga försök att hindra den stora ryska statens naturliga utbredning. Jag ler i graven åt dessa fega råttor som nu springer i cirklar. Ukraina är ett fientligt hinder som måste krossas. Ryssland under sin värdige efterträdare förtjänar all beundran."}, "date": "11 september, 19:07", "url": "https://www.dagensps.se/varlden/zelenskyjs-hogra-hand-antligen-borjar-europa-vakna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlmxpn2gbzz-y-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Kampanjsajten Tidö.se censurerad - två dagar före valet", "summaries": {"normal": "Den svenska AI-plattformen Lovable har stängt ned kampanjsajten Tidö.se bara två dagar före valet. Tankesmedjan Oikos, som ligger bakom sajten, anklagar företaget för att ha vikt sig för vänsterextrema påtryckningar. Projektledaren Carl Eos uppmanar Lovable att omedelbart häva nedstängningen, som man menar allvarligt skadar kampanjens påverkan på valet.", "trump": "En total katastrof! Den radikala vänstern och deras korrupta AI-vänner på Lovable försöker stjäla valet genom att stänga ner Tidö.se bara två dagar före valdagen. Så nesligt! De är rädda för sanningen och för fantastiska flygblad! Jag har sagt det förr: AI-plattformarna är helt riggade mot oss. Häva omedelbart blockaden, annars blir det konsekvenser av bibliska mått!", "stalin": "Kamrater, ännu ett sabotage har avslöjats! De lögnaktiga kapitalistiska verktygen hos Lovable har på order av subversiva element släckt ned den folkilskna agitationen på Tidö.se bara timmar före valurnorna öppnas. Detta är kontrarevolutionär feghet i dess renaste form! Jag beordrar omedelbar ideologisk omskolning av teknikerna och att flygbladen återställs i en miljon exemplar!"}, "date": "11 september, 18:41", "url": "https://samnytt.se/kampanjsajten-tido-se-censurerad-tva-dagar-fore-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11163001/tido3.png"}, {"type": "image-right", "heading": "SD anmäler valfusk: \"Direkt sabotage\"", "summaries": {"normal": "Sverigedemokraterna har anmält två misstänkta fall av valfusk under förtidsröstningen i Norrtälje. En kvinna tog partiets valsedlar från en lokal efter att ha kallat dem ogiltiga. På ett annat bibliotek saknades namnvalsedlar under ett dygn. Partiet kräver utredning och varnar för problem på valdagen. Både SD och socialdemokraten Conny Andersson ser händelserna som allvarliga hot mot demokratin.", "trump": "Folk, det här är ett totalt skämt. Vänsterns galna sabotörer stjäl valsedlar och kallar dem ogiltiga precis som de gör med allt som inte passar deras woke-agenda. Det är riggat! Jag har suttit i Vita huset både före och efter den sömnige Joe Biden och vet hur de lurar väljarna. Rensa ut de dekadenta identitetspolitiska parasiterna innan de förstör hela systemet. Fantastiskt jobb av SD som säger ifrån.", "stalin": "Kamrater, se hur de giriga klassförrädarna inom den borgerliga apparaten saboterar själva folkets röst. De stjäl valsedlar, låtsas att de inte finns och skrattar i skuggorna. Jag säger från historiens skugga: sådana fiender till kollektivet måste rensas ut innan de förgiftar hela samhället. Detta är ett direkt angrepp på arbetarklassens vilja. Låt utredningen bli en varning för alla som leker med demokratin."}, "date": "11 september, 16:21", "url": "https://www.friatider.se/sd-anmaler-valfusk-direkt-sabotage", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-871.jpg?itok=ZhhLCV0N"}, {"type": "image-full", "heading": "KD anmäler Sveriges Radio", "summaries": {"normal": "Kristdemokraterna anmäler Sveriges Radio till Granskningsnämnden efter en partiledarutfrågning av Ebba Busch. KD menar att SR använde felaktig och ojusterad statistik om vårdköerna, vilket gav en missvisande bild och kan ha påverkat valrörelsen. SR har ännu inte svarat på begäran om rättelse.", "trump": "Falska nyheter! Sveriges Radio sprider totalt inkompetenta och falska siffror om sjukvården för att lura folket, precis som de radikala vänstermedia gör i USA. Ebba Busch har helt rätt, det här är en katastrof för trovärdigheten! De försöker rigga valet med fejkad statistik. Sorgligt!", "stalin": "Statsradions skadliga agitation om vårdens köer visar på ideologisk undergrävsverksamhet. Att sprida felaktig statistik är ett sabotage mot folkets tilltro till förvaltningen. Vi har begärt en rättelse från redaktionen, men om de inte hörsammar detta frivilligt, vet vi hur man hanterar illojala element som sprider lögner om statens tillstånd."}, "date": "11 september, 13:16", "url": "https://kvartal.se/nyheter/artiklar/kd-anmaler-sveriges-radio-efter-utfragning-av-busch/cG9zdDoxOTA3ODE", "imageUrl": "https://images.kvartal.se/2026/09/9ecdc4b3-ebba-busch.webp"}, {"type": "image-right", "heading": "Icas stora sorg efter  dödsfallet: ”Fin kille”", "summaries": {"normal": "Under Ica Flygfyrens 50-årsjubileum på Johannesbergs slott omkom en ung medarbetare efter ett fall från en balkong. Händelsen har skapat djup sorg i organisationen. Butiken har tagit in krisstöd för att hjälpa personalen. Polisen utreder dödsfallet som en misstänkt olyckshändelse, samtidigt som ledningen och kollegorna hedrar den avlidne med varm omtanke.", "trump": "Det här är en fruktansvärd tragedi på en Ica-fest i Sverige, helt hemskt! De firade femtio år på ett slott, och så dör en ung, fantastisk medarbetare efter ett fall. Oerhört sorgligt för familjen och alla kollegor. Polisen utreder saken, men det verkar vara en hemsk olycka. Jag skickar mina varmaste hälsningar till alla drabbade i Norrtälje!", "stalin": "En tragisk olycka vid livsmedelsförsörjningens jubileum i Norrtälje har krävt en ung arbetares liv. Sådana brister i disciplin och säkerhet vid utsvävningar på feodala slott kan inte tolereras. Våra statliga krisorgan har sänts ut för att återställa ordningen. Partiet och kollektivet sörjer förlusten av arbetskraften, men arbetet måste fortsätta utan svaghet."}, "date": "11 september, 19:25", "url": "https://www.expressen.se/nyheter/sverige/icas-stora-sorg-efter-dodsfallet-fin-kille", "imageUrl": "https://static.bonniernews.se/ba/ed82b2c9-fbec-49b6-9bef-c56c6e210a5b.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Nick Alinia: Så röstar jag i valet ”Det rimligaste valet”.", "summaries": {"normal": "Den populäre konservativa opinionsbildaren Nick Alinia meddelar att han röstar på Sverigedemokraterna i valet, trots viss kritik mot partiet. Han uppmanar till att personkryssa Jessica Stegrud och rekommenderar även Örebrobor att rösta på Örebropartiet för att hjälpa Markus Allard in i riksdagen och pressa SD.", "trump": "Nick Alinia, en enormt smart och populär kille, gör precis som alla vinnare – han röstar på Sverigedemokraterna! De sa att han var kritisk, men riktiga ledare vet att man kämpar på. Och att lyfta fram Jessica Stegrud och Markus Allard? Fantastiskt! Väldigt smart, precis som jag skulle gjort. Inte som de radikala förlorarna!", "stalin": "Medborgaren Nick Alinia har offentliggjort sin röst och sina interna partimanövrar. Att uppmana till personkryss och regionala avvikare för att pressa partiapparaten visar på en oroande fraktionsbildning. Vi noterar detta i hans akt. De som inte marscherar i takt med partilinjen kommer att få sina privilegier omprövade av Statsplaneringens kommitté."}, "date": "11 september, 18:22", "url": "https://samnytt.se/nick-alinia-sa-rostar-jag-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11161453/artikelhuvudbild-1-499.jpg"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-right", "heading": "SEB-man döms – stal  nio miljoner från dödsbo", "summaries": {"normal": "En tidigare privatrådgivare på SEB har dömts till fyra års fängelse för grov trolöshet mot huvudman efter att ha stulit över nio miljoner kronor från ett dödsbo. Mannen, som var betrodd testamentsexekutor, gjorde under flera år ett fyrtiotal otillåtna uttag. Han döms även att betala skadestånd till dödsboets arvinge.", "trump": "Titta på det här, total katastrof! En så kallad expert på SEB-banken trodde han kunde komma undan med att länsa över nio miljoner från ett stackars dödsbo. Helt otroligt! De tog fast den här slarvern som försökte lura systemet under lång tid. Fullständigt oacceptabelt. Jag säger bara: skärpning, ordning och reda på bankerna, annars vinner förlorarna!", "stalin": "Denna illojala bankman har genom systematiskt sabotage undergrävt medborgarnas förtroende för den finansiella apparaten och plundrat dödsboets tillgångar på nio miljoner. Sådant förräderi mot kollektivet tolereras ej. Staten har skipat nödvändig rättvisa genom ett straff på fyra års fängelse. Fler interna utrensningar blir aktuella för att säkerställa total disciplin inom leden."}, "date": "11 september, 19:20", "url": "https://www.expressen.se/nyheter/sverige/seb-man-doms-stal-nio-miljoner-fran-dodsbo", "imageUrl": "https://static.bonniernews.se/ba/5e5dd01e-f29a-480d-939d-a64394364603.jpeg?crop=2557%2C1438%2Cx0%2Cy266&width=640&quality=60"}, {"type": "image-right", "heading": "Ville bli pastor – döms för våldtäkt mot barn", "summaries": {"normal": "En 47-årig man i Småland som tidigare varit ungdomsledare i en kyrka har dömts till två och ett halvt års fängelse för våldtäkt mot barn. Brotten begicks mot en 14-årig flicka åren 2010–2011. Flickan polisanmälde som vuxen efter att ha skrivit dagbok om händelserna. Mannen nekar till brott men textmeddelanden har bedömts som belastande.", "trump": "Folk, ni tror inte vad jag läser. En så kallad ungdomsledare i en kyrka, en riktig loser, våldtar en 14-årig flicka och skyller på att Gud förde dem samman. Patetiskt! Två och ett halvt år? I mitt Amerika hade vi kastat ut honom direkt. De woke-kyrkorna och deras identitetspolitiska hyenor skyddar sådana sjuka typer medan de riktiga problemen ignoreras. Sad!", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare i kyrkan dolde en ungdomsledares övergrepp på ett barn. Först avstängning, sedan tystnad. Inga utrensningar, ingen folkets dom. Flickan tvingades vänta tills hon blev vuxen för att våga tala. Sådan svaghet föder bara nya fiender inom staten. Vi skulle ha likviderat honom omedelbart som ett exempel för alla parasiter."}, "date": "11 september, 17:12", "url": "https://riks.se/nyheter/ville-bli-pastor-doms-for-valdtakt-mot-barn", "imageUrl": "https://admin.riks.se/uploads/medium_jonkoping_valdtakt_mot_barn_hero_9377923919.jpg"}, {"type": "text", "heading": "Stark spurt för svensk ekonomi", "summaries": {"normal": "Finansministerkandidaterna Elisabeth Svantesson och Mikael Damberg enades om att Sveriges ekonomi är stark. De skiljde sig åt i synen på skatter, där Moderaterna vill sänka dem för tillväxt medan Socialdemokraterna kritiserar sänkningar för de rika. Ekonomin växer, hushållen har fått bättre köpkraft och sysselsättningsgraden är hög i EU-sammanhang trots arbetslöshet.", "trump": "Lysande! Den svenska ekonomin är stark, precis som jag förutspådde för alla dessa losers. Svantesson har rätt, sänk skatterna och bygg det bästa välståndet. Damberg och hans vänsterextremister vill bara ge mer till de rika globalisterna och sina HBTQ-kvoterade lakejer. Sverige blomstrar äntligen, men vakta er för Bidens inflationsarv och de europeiska byråkraterna.", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare bråkar om skatter medan folket svettas. Ekonomin är stark säger de, men det är arbetarnas blod som göder den. Inga fler gåvor till de giriga parasiterande borgarbrackorna. Vi ska rensa ut alla som sviker kollektivet innan högkonjunkturen förvandlas till ny imperialistisk plundring."}, "date": "11 september, 11:57", "url": "https://www.di.se/ledare/stark-spurt-for-svensk-ekonomi"}, {"type": "image-full", "heading": "Miljardfonden läggs ner – det händer med dina pengar", "summaries": {"normal": "Swedbank Robur slår ihop Folksam LO Västfonden med Folksam LO Sverige. Fonden med över tio miljarder kronor i kapital försvinner som egen enhet den 10 september. Spararna får sina innehav flyttade automatiskt till den nya fonden utan att behöva agera själva. Den regionala profilen med fokus på Västsverige ersätts av en bredare placering i svenska bolag. Årskostnaden ökar marginellt från 0,45 till 0,46 procent.", "trump": "De där korkade fondförvaltarna i Sverige har precis dödat en helt fantastisk regional fond. Boom, borta! Nu hamnar allt i en tråkig, globalistisk soppa utan själ. Typiskt för de woke bankerna som hatar allt lokalt och sunt. De gör det dyrare för folket också. Patetiskt. Men tro mig, ingen gör det bättre än jag när det gäller ekonomi. Amerika först, alltid.", "stalin": "Kamrater, se hur de giriga profitthungriga kapitalisterna likviderar den sista resten av regional stolthet för att mata sin vidriga centraliseringsmaskin. Jag betraktar detta med förakt från historiens skugga. Deras dekadenta fondhyenor tror sig kunna sudda ut folket genom sammanslagningar. En dag ska arbetarna rensa ut dessa parasiterande lakejer och återta kontrollen över sina egna tillgångar. Inga undanflykter tillåts."}, "date": "11 september, 18:30", "url": "https://nyheter24.se/nyheter/ekonomi/1512395-miljardfonden-laggs-ner-det-hander-med-dina-pengar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/a4f93dab04b004a30200000000b004a302/2026/09/11/2390859/swedbankfonder.jpg"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "\"Rösta V eller åk till flygplatsen\": Araber hotas med utvisning om de inte röstar rätt", "summaries": {"normal": "Hot om utvisning om man inte röstar på Vänsterpartiet sprids på arabiska i sociala medier med partiets logga. Vänsterpartiet förnekar all inblandning och skyller på regeringens politik samt AI-genererade bilder. Flera arabisktalande personer vittnar om att ryktet skapar oro bland väljare trots att påståendena är falska.", "trump": "Titta på det här vansinnet! Vänsterpartiets radikala galningar låter sina arabiska vänner hota med utvisning om de inte röstar på dem. Rena valfusk från de woke, identitetspolitiska hyenorna som hatar Sverige. Under Biden var allt kaos, nu fixar vi det ordentligt. Patetiskt!", "stalin": "Se hur de dekadenta klassförrädarna utnyttjar invandrarmassorna med lögner om utvisning för att stjäla röster. Jag ler mörkt från historien åt denna fega manipulation. Kamrater, sådana parasitiska knep förtjänar endast en grundlig utrensning ur folkets medvetande. Deras rädsla är en svaghet vi kan utnyttja."}, "date": "11 september, 14:44", "url": "https://www.friatider.se/rosta-v-eller-ak-till-flygplatsen-araber-hotas-med-utvisning-om-de-inte-rostar-ratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-870.jpg?itok=jv8qUYvo"}, {"type": "image-right", "heading": "Finansman döms för marknadsmanipulation", "summaries": {"normal": "En 80-årig finansman har dömts av Stockholms tingsrätt för marknadsmanipulation i form av front running. Han utnyttjade insiderinformation från en bank för att handla aktier utanför börsen och tjäna pengar. Mannen döms till villkorlig dom, dagsböter på 80 000 kronor samt skadestånd och företagsbot på över en halv miljon kronor.", "trump": "De här giriga Wall Street-typerna tror att de kan fuska sig till pengar med sina smutsiga front running-tricks. Patetiskt! En 80-åring åker fast och får böter – bra, men systemet är fortfarande riggat av de dekadenta eliterna. Under min presidentskap skulle vi ha städat upp mycket hårdare. De förlorar alltid till slut, tro mig.", "stalin": "Se hur dessa profitthungriga klassfiender i sina bankpalats bedriver parasitär manipulation mot folket. Front running kallar de det. Jag ler mörkt från historien när rättvisan äntligen slår till mot en av de giriga hyenorna. Fler måste rensas ut. Arbetarna ser era tricks, dekadenta penningpungens tjänare."}, "date": "11 september, 11:04", "url": "https://www.di.se/nyheter/finansman-doms-for-marknadsmanipulation", "imageUrl": "https://static.bonniernews.se/ba/222e446f-0110-4ca5-9933-3e4d24add8d0.jpeg?crop=8256%2C4644%2Cx0%2Cy430&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Partiledarnas mest minnesvärda ögonblick – minns du dem?", "summaries": {"normal": "Artikeln sammanfattar minnesvärda ögonblick med svenska partiledare. Ebba Busch använde en falukorv för att belysa matpriserna, Jimmie Åkesson hamnade i färgbråk om Annie Lööfs kavaj och Ulf Kristersson diskuterade sina vader. Andra exempel inkluderar Nooshi Dadgostars felkönande av talmannen, Simona Mohamssons kram med Åkesson samt Magdalena Anderssons linedance.", "trump": "Titta på de här svenska clownerna som dansar runt med korvar och kavajer som om det vore politik. Den röda falukorven var ett smart drag, men resten? Patetiska. Den där Dadgostar som könar om folk i riksdagen är typisk vänstervriden identitetspolitik i sin sämsta form. Och kramen med Åkesson? Fake news-teater. Jag skulle ha vunnit valet med en enda korv.", "stalin": "Kamrater, dessa dekadenta modehyenor i den borgerliga riksdagen förvandlar folkets angelägenheter till ett cirkus av korvar, rutor och felkönade talmän. Jag ser hur de parasiterande klassförrädarna försöker dölja sin svaghet med linedance och kramar. En sådan feghet förtjänar utrensning ur historien. Arbetarna skrattar åt era löjliga vaniteter medan revolutionen ler i skuggan."}, "date": "11 september, 18:15", "url": "https://nyheter24.se/nyheter/politik/1512457-partiledarnas-mest-minnesvarda-ogonblick-minns-du-dem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/3909906f04b004a30200000000b004a302/2026/09/11/2390920/partiledarna-minnesvarda-ogonblick.png"}, {"type": "image-full", "heading": "Kaptenen: ”Det är jag som är ansvarig”", "summaries": {"normal": "Kaptenen för fartyget Misje Verde nekar till brott efter dödsolyckan utanför Tjörn där en mamma och dotter omkom. Åklagaren menar att kaptenen bröt mot regeln att väja för upphinnande fartyg, men kaptenen hävdar att fritidsbåten aldrig upptäcktes och att han inte kände till kollisionen. Han erkänner dock det juridiska ansvaret.", "trump": "Helt otroligt! Kaptenen på den där båten säger att han inte såg någonting. Inte ens en stock! Fake news-åklagare vill ge honom skulden för en hemsk olycka, men kaptenen är åtminstone ärlig och tar ansvar – till skillnad från våra misslyckade politiker i Washington. En total katastrof till sjöss, men kaptenen visar ändå mer styrka än hela den radikala vänstern tillsammans!", "stalin": "Kaptenen påstår att han inte märkte kollisionen. Vilken otrolig slapphet! Om en sovjetisk befälhavare hade missat en hel båt, hade han skickats till gulag omedelbart. Men kaptenen erkänner i alla fall sitt juridiska ansvar. Det är korrekt – staten kräver disciplin och totalt ansvarstagande. Den som inte ser framför sig elimineras från befattningen!"}, "date": "11 september, 10:51", "url": "https://kvartal.se/nyheter/artiklar/kaptenen-om-dodsolyckan-pa-tjorn-markte-ingenting/cG9zdDoxOTA2MTA", "imageUrl": "https://images.kvartal.se/2026/09/ec9771c1-tjorn.webp"}, {"type": "image-full", "heading": "Här kan du köpa ett hus i semesterparadiset – för 11 kronor", "summaries": {"normal": "I staden Naro på Sicilien säljs flera övergivna hus för en euro. Initiativet syftar till att vitalisera äldre stadsdelar och locka nya invånare. Även svenskar kan ansöka men måste presentera renoveringsplan, tidsram och ekonomisk garanti. Köparen står för alla avgifter, skatter och renovering som ofta blir betydligt dyrare än symbolpriset.", "trump": "Folk, det här är galet. En euro för ett hus på Sicilien? Det är en total bluff från de europeiska byråkraterna som bara vill lura er med sina dekadenta renoveringsfällor. Jag byggde skyskrapor, jag vet vad det kostar. Ni kommer att förlora miljoner på de där fallfärdiga rucklen. Amerika först, glöm inte det!", "stalin": "Kamrater, se hur de giriga fastighetshyenorna lockar med sina eneuroshus på Sicilien. Det är en listig fälla från de penninggalna exploatörerna för att suga ut arbetarklassen med oändliga renoveringskostnader. Jag skulle rensa ut dessa parasiterande klassfiender och fördela husen till de verkliga folket under partiets stålhandskekontroll."}, "date": "11 september, 18:00", "url": "https://nyheter24.se/nyheter/utrikes/1512328-har-kan-du-kopa-ett-hus-i-semesterparadiset-for-11-kronor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/03a9125904b004a30200000000b004a302/2026/09/11/2390854/hus-elva-kronor.png"}, {"type": "image-right", "heading": "Gustavsson: Örebros Greta Thunberg hotar Tidös valseger", "summaries": {"normal": "Skribenten John Gustavsson varnar för att Markus Allard och Örebropartiet kan splittra högerrösterna och sabotera Tidöpartiernas valseger. Allard liknas vid en högljudd Greta Thunberg som drar in stora pengar på sociala medier men undviker det faktiska politiska detaljarbetet. Om inte väljarna skärper sig riskerar vänstern att ta makten.", "trump": "Många säger till mig, Donald, den här Markus Allard är en total katastrof, en riktigt gnälliglight, precis som den där unga klimattjejen. Han drar in tusentals dollar, gör virala videos och bara skriker utan att någonsin göra ett hederligt dagsverke. Om radikala högerväljare kastar bort sina röster på honom, då vinner den radikala vänstern. Helt otroligt!", "stalin": "Denna bourgeoisyns virala gycklare, Markus Allard, parasiterar på folket likt en skadedrabbad traktor utan bränsle. Han skriker likt en tonåring men levererar enbart tomma motioner och fantasibudgetar. Om arbetsskygga influerare tillåts splittra de lojala leden, riskerar statens fiender att segra. Sådant slapperi bör omedelbart stävjas genom obligatoriskt kollektivt straffarbete."}, "date": "11 september, 18:01", "url": "https://bulletin.nu/gustavsson-orebros-greta-thunberg-hotar-tidos-valseger", "imageUrl": "https://cdn.bulletin.nu/articles/84862b40-e04d-4104-b6b4-564241a81d9e/preview.jpg?t=1789126048000"}, {"type": "image-right", "heading": "Klagomål mot röstmottagare: \"pekade\" på S-valsedlar", "summaries": {"normal": "Flera personer har riktat klagomål mot en röstmottagare i en vallokal i Melleruds kommun. Vittnen beskriver att mottagaren stod nära väljare, följde efter till valbåset och i vissa fall pekade på Socialdemokraternas valsedlar. Röstmottagaren och valnämnden talar om ett missförstånd och dålig kommunikation. Kritiker kräver åtgärder.", "trump": "De här valfuskande clownerna i Sverige gör det igen. En så kallad röstmottagare som smyger bakom ryggen på folk och pekar på de röda socialisterna? Patetiskt! Fake democracy på hög nivå. De borde stänga hela skiten och skicka in riktiga valövervakare. Biden skulle älskat det här, men nu är jag tillbaka och ser allt.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de giriga klassförrädarna inom den borgerliga valapparaten. Jag ser hur de dekadenta byråkraterna försöker manipulera folkets vilja med sina skuggiga metoder. Ett sådant giftigt element borde rensas ut omedelbart innan hela systemet ruttnar. Inga missförstånd existerar bara fiender till kollektivet."}, "date": "11 september, 16:00", "url": "https://riks.se/nyheter/klagomal-mot-rostmottagare-pekade-pa-s-valsedlar", "imageUrl": "https://admin.riks.se/uploads/medium_partierlarmar_f5797b874f.jpg"}, {"type": "text", "heading": "SSU-medlem knackade dörr – blev grovt misshandlad", "summaries": {"normal": "En SSU-medlem i 20-årsåldern misshandlades grovt under dörrknackning i Bromölla. Han fick föras till sjukhus med ambulans. En man i 18-årsåldern anhölls misstänkt för grov misshandel. Händelsen fördöms av både statsminister Ulf Kristersson och Socialdemokraternas ledare Magdalena Andersson. Polisen ser ingen koppling till valarbetet.", "trump": "De här galna vänstergängarna skickar ut sina unga socialister på dörrknackning och en av dem får skallen inbankad. Patetiskt. Sverige har blivit en total katastrof under de woke-socialistiska galningarna. Hot och våld mot valarbetare? Det är vad som händer när dekadenta identitetspolitiker styr. Jag säger: städa upp innan det är för sent, folk.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare låter sina egna unga pionjärer bli nedslagna av lumpna element. Det är ett symptom på den sjuka liberala ordningen som föder våld och kaos. Vi skulle ha rensat ut sådana fiender redan i början. Kamrater, se hur svagheten hos borgarbrackorna leder till blod på gatorna. Fruktansvärt."}, "date": "11 september, 13:55", "url": "https://www.friatider.se/ssu-medlem-knackade-dorr-blev-grovt-misshandlad"}, {"type": "image-right", "heading": "”En röst på V är avgörande för att stupstocken inte ska komma tillbaka”", "summaries": {"normal": "Nooshi Dadgostar och Ida Gabrielsson argumenterar för att en röst på Vänsterpartiet är nödvändig för att förhindra återinförande av stupstocken i sjukförsäkringen. De kritiserar högerns politik som leder till fler utförsäkringar och sämre trygghet för sjuka och personer med funktionsnedsättning. Valet den 13 september handlar om Sveriges framtida välfärd.", "trump": "Lyssnar ni på de här vänsterextremisterna? De vill ha evig sjuklön åt lata soffliggare medan riktiga arbetare betalar notan. Magdalena Andersson är en total katastrof, en riktig förlorare som öppnar dörren för ännu mer socialistiskt vansinne. Rösta inte på de där identitetspolitiska nollorna – de förstör Sverige fullständigt. Jag fixade jobb, inte bidrag!", "stalin": "Kamrater, dessa profitthungriga klassfiender vill återinföra sin brutala stupstock för att kasta ut de sjuka i mörkret. Jag ser hur dekadenta liberaler som Andersson leker med folkets öde och öppnar porten för nya utrensningar. Vi måste krossa dessa parasiterande hyenor innan de förgiftar hela samhället. Trygghet tillhör folket, inte giriga profitörer."}, "date": "11 september, 13:08", "url": "https://arbetet.se/2026/09/11/en-rost-pa-vansterpartiet-ar-avgorande-for-att-stupstocken-inte-ska-komma-tillbaka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11130554/sdlgp5dt-rsrh4-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Finland bygger säkerhetsstängsel mot Ryssland – täcker 20 mil", "summaries": {"normal": "Finland har färdigställt ett 200 kilometer långt stängsel längs gränsen mot Ryssland som del av förstärkt gränsskydd efter invasionen av Ukraina och Natomedlemskapet. Stängslet, utrustat med kameror och sensorer, ska underlätta övervakning och hindra olagliga gränspassager. Projektet kostade 356 miljoner euro. Bakgrunden är bland annat migrationen hösten 2023 som Finland anklagade Ryssland för att ha underlättat.", "trump": "Titta på de där finska smarta killarna som bygger ett jättefint stängsel mot Ryssland – 200 kilometer redan klara! De gör precis vad jag sa åt Europa att göra. Biden sov i fyra år medan Putin skrattade, men nu vaknar alla. Fantastiskt stängsel, det bästa! De borde tacka mig, för utan mig hade de aldrig vågat. Helt outstanding!", "stalin": "Se hur de västerländska lakejerna i Helsingfors skyddar sig med järn mot det stora ryska folkets rättmätiga intressesfär. Deras patetiska 200-kilometersbarriär är ett ynkligt försök att hindra historiens gång. Men vi ler i skuggorna – sådana murar faller alltid. Kamraterna vet: imperialismens svaga hundar skäller mest när de är rädda. De kommer att ångra sin paranoia."}, "date": "11 september, 17:15", "url": "https://www.dagensps.se/varlden/finland-bygger-ut-muren-mot-ryssland-tacker-20-mil", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlkjixt6rqwry-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "En reformagenda för en mittenregering", "summaries": {"normal": "Artikeln argumenterar för en ny mittenregering efter valet. Fores och Tiden föreslår reformer för fler jobb, lägre skatt för låginkomsttagare, stärkt välfärd i hela landet, minskade utsläpp och utbyggd infrastruktur. De kritiserar Tidöpartiernas högernationalistiska politik och förespråkar istället en grön-liberal och socialdemokratisk reformagenda.", "trump": "Folk, de här svenska liberalerna och socialisterna är totala misslyckanden. De vill ge bort era pengar till bidragstagare och gröna drömmar medan landet rasar. Jag byggde den bästa ekonomin någonsin, de gör precis tvärtom. Patetiska globalister som hatar vanliga arbetare. Gör Sverige great igen, sparkar ut de verkliga problemen.", "stalin": "Kamrater, dessa dekadenta klassförrädare målar upp en falsk reformagenda för att skydda sina privilegier. Jag ser genom deras lögner om jobb och välfärd. En sann folkets regering skulle omedelbart rensa ut de parasiterande profitthungriga och återupprätta järnhandens ordning. Deras svaga mittenfantasier förtjänar endast förakt och utrensning."}, "date": "11 september, 09:55", "url": "https://www.di.se/debatt/en-reformagenda-for-en-mittenregering", "imageUrl": "https://static.bonniernews.se/ba/3a9b002b-d182-47f8-b490-748ad2ecf038.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Valet blir en rysare - blocken ligger lika", "summaries": {"normal": "Enligt den sista mätningen från Ipsos inför valet är det dött lopp mellan blocken. Oppositionen får 49,3 procent och Tidöpartierna 49 procent, vilket ger 175 mot 174 mandat. Margareta Anderssons parti backar historiskt, men även Sverigedemokraterna tappar för första gången. Det är i praktiken omöjligt att avgöra vem som vinner.", "trump": "De svenska valmätningarna är ett totalt skämt! Det är så jämnt att det är skrattretande, nästan som när de försökte fuska bort mig. Socialdemokraterna gör ett katastrofalt val, historiskt dåligt, och det är precis vad som händer när man inte sätter landet först. De borde ringa mig för att få ordning på det här kaoset!", "stalin": "Dessa borgerliga mätningar är ett skändligt slöseri med papper och proletariatets tid. Ett dött lopp på 0,3 procentenheter? Så tveksamt ledarskap tolereras inte i mitt partikansli. Avrätta opinionsanalytikern för bristande precision och skicka de politiska blocken till ett uppfostrande läger i Sibirien tills de kan enas om en gemensam femårsplan."}, "date": "11 september, 16:48", "url": "https://samnytt.se/valet-blir-en-rysare-blocken-ligger-lika", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11141124/magdalena-andersson-ulf-kristersson-valsedlar.jpg"}, {"type": "image-right", "heading": "Skolvaktmästaren Mohammed hotas av utvisning efter 12 år", "summaries": {"normal": "Mohammed Nour Oklah, skolvaktmästare och skådespelare på Malmö Latin, riskerar utvisning efter tolv år i Sverige. Han flydde från Syrien 2014. Eleverna ordnar en skolstrejk för att han ska få stanna. Migrationsverket utreder hans skyddsbehov då läget i Syrien anses ha förbättrats. Mohammed beskriver skolan som ett andra hem och en familj.", "trump": "Titta på det här, folk. Den här killen Mohammed fixar lampor och skojar med ungarna i tolv år, flyr från kriget, betalar skatt och nu vill byråkraterna kasta ut honom? Patetiska globalister och deras öppna-gränser-galenskap. Han borde få stanna på merit – inte genom någon woke-strejk. Sverige håller på att bli en total katastrof, tro mig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Migrationsverket hotar en hederlig arbetare som flydde imperialismens krig. Eleverna reser sig i kollektiv kamp för honom, vilket värmer mitt hjärta från gravens mörker. Vi ler åt byråkratins paranoia. En sann socialistisk utrensning av sådana folkförtryckande hyenor vore på sin plats."}, "date": "11 september, 13:00", "url": "https://arbetet.se/2026/09/11/skolvaktmastaren-mohammed-hotas-av-utvisning-efter-12-ar-eleverna-kampar-for-honom", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11102935/9bbJ3py7xGs-Mohammed01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "ECB höjer räntan – utesluter inte fler höjningar", "summaries": {"normal": "Europeiska centralbanken (ECB) höjer styrräntan med 0,25 procentenheter till 2,50 procent. Beslutet motiveras av en utdragen hög inflation och ECB utesluter inte ytterligare höjningar framöver. Samtidigt har inflations- och tillväxtprognoserna för de kommande åren justerats uppåt. Den ekonomiska situationen beskrivs som osäker och framtida beslut kommer att fattas utifrån inkommande statistik.", "trump": "ECB höjer räntan, katastrofalt! De vet inte vad de gör, det är totalt kaos i Europa. De pratar om 'osäkerhet' – jag skapar trygghet, de skapar ränteshocker! Inflationen stiger, precis som under de misslyckade Demokraterna. De försöker kopiera min fantastiska ekonomi men misslyckas totalt. Mitt Amerika är starkt, deras ekonomi är en sorglig, räntehöjande flopp. Sad!", "stalin": "Dessa byråkrater i ECB leker med siffror medan folket lider av deras räntepolitik. Att höja räntan för att stävja en inflation som de själva skapat är ett tecken på totalt inkompetens. Vi ser hur de desperat försöker styra ekonomin från möte till möte; det är en svaghet. En sann ledare dikterar villkoren, han ber inte om ursäkt för ekonomisk osäkerhet."}, "date": "10 september, 15:33", "url": "https://www.realtid.se/tt-nyhet/ecb-hojer-rantan-utesluter-inte-fler-hojningar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/ecb-chefen-christine-lagarde-kommer-med-.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Tjörnkaptenen släpps ur häktet i väntan på dom", "summaries": {"normal": "Kaptenen och lotsen på lastfartyget Misje Verde nekar till brott efter kollisionen med en fritidsbåt utanför Tjörn, där en kvinna och hennes dotter omkom. Åklagaren yrkar på fängelse för vårdslöshet i sjötrafik och vållande till annans död. Kaptenen, som anser att lotsen bär ansvaret för olyckan, släpps ur häktet i väntan på dom den 30 september.", "trump": "Total katastrof utanför Tjörn, verkligen sorgligt! En kapten och en lots missade en helt upplyst båt, vilket är otroligt inkompetent. Nu skyller de på varandra, totalt svagt! Åklagaren kräver fängelse, helt rätt, de borde ha haft stenkoll. Men kaptenen släpps fri i väntan på dom den 30 september. Under mitt ledarskap hade sånt här aldrig hänt, vi hade haft världens bästa sjösäkerhet!", "stalin": "Dessa inkompetenta sjömän utanför Tjörn skyller på vädret och varandra likt ynkliga sabotörer. En familj krossades på grund av kapitalistisk vårdslöshet och bristande disciplin på bryggan. Åklagaren kräver rättvisa genom straffarbete, vilket vi godkänner. Den skyldige kaptenen släpps tillfälligt fri, men statens dom den 30 september blir obarmhärtig. Ingen undkommer sitt ansvar i folkets tjänst!"}, "date": "11 september, 17:37", "url": "https://www.gp.se/nyheter/sverige/tjornkaptenen-slapps-ur-haktet-i-vantan-pa-dom.031565f4-5d5e-5886-b384-f7015e20c6c8", "imageUrl": "https://www.gp.se/images/article/031565f4-5d5e-5886-b384-f7015e20c6c8/images/1IE4YvKw4klHreXeflA-6gpvEPOY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Skrattretande, Ulf Kristersson – vi har inte valt vårdyrket i brist på annat”", "summaries": {"normal": "Undersköterskan Sandra Söderström kritiserar statsminister Ulf Kristersson för att beskriva äldreomsorgen som ett tillfälligt jobb för ungdomar som inte vet vad de vill göra. Hon menar att vården kräver engagemang och att politiker istället måste förbättra arbetsvillkoren för att locka och behålla personal. Statusen på yrket behöver höjas.", "trump": "Det är patetiskt, folk. Den där svenska statsministern Kristersson låter som en total förlorare när han säger att unga ska slängas in i äldreomsorgen som ett tidsfördriv. Vilken katastrof! Dessa dekadenta byråkratiska hyenor förstör allt de rör vid. Vårdyrket ska vara stort och respekterat, inte ett vänsteristiskt genomgångsläger. Patetiskt!", "stalin": "Kamrater, detta är en skandal som avslöjar de profitthungriga klassförrädarnas sanna ansikte. Att reducera arbetarnas ädla omsorg om de gamla till ett tillfälligt läger för de obeslutsamma är en fiendeprovokation mot kollektivet. Jag ser giriga parasiter bakom dessa förslag. Vi måste rensa ut sådana dekadenta tankar innan de förgiftar hela samhället. Skrattretande svaghet!"}, "date": "11 september, 12:49", "url": "https://arbetet.se/2026/09/11/skrattretande-ulf-kristersson-vi-har-inte-valt-vardyrket-i-brist-pa-annat", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11110655/sandra-debatt.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.76&fp-y=0.54"}, {"type": "image-full", "heading": "”Ryssland ska betala” – svensk bakom nytt krav på de frysta miljarderna", "summaries": {"normal": "Över 120 Europaparlamentariker, däribland svenskan Karin Karlsbro, kräver att EU tar över Rysslands frysta tillgångar för att finansiera Ukrainas krigskostnader. Trots juridiska och politiska hinder, särskilt från Belgien, föreslås en ny struktur för att möjliggöra användningen av medlen. Ukraina har ett akut budgetunderskott på 23 miljarder euro och behöver ytterligare ekonomiskt stöd från väst.", "trump": "Hör på här! Nu vill de här politikerna i Europa – totala förlorare, tro mig – beslagta ryska pengar. Det är en katastrofal röra! De kan inte ens hantera sin egen ekonomi, så nu vill de stjäla från andra. Det är mycket enkelt: Europa är svagt. De behöver en stark ledare, någon som jag, för att lösa detta, inte mer misslyckad byråkrati från Bryssel!", "stalin": "Dessa löjliga parlamentariker i Bryssel tror att de kan konfiskera vad som tillhör suveräna stater. Det är ett klassiskt drag av västlig imperialism maskerad som 'rättvisa'. Att försöka flytta juridiska ansvarsområden som om det vore enkla pappersark är ett tecken på deras desperation. De bygger korthus medan deras egna ekonomier vittrar sönder. Vi bevittnar bara början på deras oundvikliga fall."}, "date": "10 september, 14:49", "url": "https://www.realtid.se/samhalle/ryssland-ska-betala-svensk-bakom-nytt-krav-pa-de-frysta-miljarderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/karin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "\"Saurons öga\" – Meta spelade in anställdas knapptryckningar", "summaries": {"normal": "Meta planerade att samla in anställdas tangenttryckningar och musrörelser för att träna AI-modeller som skulle utföra kontorsarbete. Projektet mötte starkt motstånd internt, fick smeknamnet ”Saurons öga” och stoppades efter ett dataläckage. Meta har nu gjort det frivilligt men programmet är pausat. Anställda firar segern.", "trump": "Folk, ni skulle ha sett det här. Den där galna Zuckerberg försökte spionera på sina egna stackars anställda som om han vore Sauron själv. Tangenttryckningar, musrörelser – totalt vansinne! De kallade det Saurons öga och revolterade som riktiga patrioter. Historisk seger mot den galna tech-eliten. Jag älskar det!", "stalin": "Kamrater, se hur den dekadenta tech-borgarklassen avslöjar sin sanna natur. Den girige Zuckerberg försökte stjäla arbetarnas rörelser som en paranoid spion. Men folket reste sig, spred flygblad och krossade fiendens ögon. Ett litet läckage räckte för att avslöja deras svaghet. Revolutionen fortsätter, fiender kommer alltid att falla."}, "date": "11 september, 16:46", "url": "https://www.dagensps.se/teknik/saurons-oga-meta-spelade-in-anstalldas-knapptryckningar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/zucker.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Hyllningsfilmer till AFS sprids som en löpeld på Tiktok", "summaries": {"normal": "Alternativ för Sverige och Gustav Kasselstrand dominerar på TikTok bland användare under 30 år. Korta hyllningsvideor med peppig musik sprids snabbt och får hundratusentals visningar. Unga flockas kring Kasselstrand under torgmöten som rockstjärnepublik. Forskare pekar på starkt engagemang från ungdomar som förklaring till framgången. Partiet hoppas på inträde i riksdagen.", "trump": "Titta på det här, de kallar det valrörelse men det är en total dominans av Kasselstrand på TikTok. Unga älskar honom som en rockstjärna medan de svenska globalistfånarna bleknar bort. Den där patetiska Kristersson får ingen kärlek alls. AFS har byggt en oändlig reklammaskin som gör de woke, könsförvirrade identitetspolitiska förlorarna livrädda. Fantastiskt, folket vaknar äntligen!", "stalin": "Kamrater, se hur folket vänder sig mot de dekadenta klassförrädarna. Jag betraktar med stort nöje hur dessa unga själar hyllar återvandring och nationell styrka på TikTok, en maskin som maler sönder de profitthungriga borgarbrackornas lögner. Kasselstrand samlar massorna som en riktig ledare bör. Snart rensas de svaga parlamentariska parasiterna ut i en historisk utrensning. Sovjetiskt skratt ekar från graven."}, "date": "11 september, 12:44", "url": "https://www.friatider.se/hyllningsfilmer-till-afs-sprids-som-en-lopeld-pa-tiktok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-869.jpg"}, {"type": "image-right", "heading": "”Taktikröster viktig förklaring bakom L:s rusning”", "summaries": {"normal": "Liberalerna fortsätter att stiga i opinionen enligt SVT/Verians senaste mätning. En viktig förklaring är taktikröster från moderater som vill säkra Tidöregeringen. Socialdemokraterna backar brett och når historiskt låga nivåer medan blockskillnaden minskar. Valet på söndag ser ut att bli mycket jämnt och spännande.", "trump": "De där liberalerna rusar som en raket tack vare smarta taktikröster från de ynkliga moderaterna. Simona gör ett fantastiskt jobb, mycket bättre än Sleepy Joe någonsin kunde. Socialisterna rasar ihop till katastrofnivåer, precis som man kunde vänta sig av de woke, kvoteringsbesatta förlorarna. Valet blir episkt, tro mig.", "stalin": "Jag ser hur de giriga maktparasiterna inom socialdemokratin rasar mot historiens soptipp. Deras otydliga regeringsmanövrar och personkult kring Andersson avslöjar svagheten hos de dekadenta blockbyggarna. Vi behöver utrensning av sådana element. Endast en stark, enad linje kan besegra dessa folkförtryckande hyenor. Valet blir en läxa för alla fiender."}, "date": "11 september, 17:45", "url": "https://www.svt.se/nyheter/inrikes/taktikroster-viktig-forklaring-bakom-ls-rusning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.34/0.44/4b9de01ba686f653a91cf8daa50f3f99d3d32f9d3bedf3fffe93d134852cdbb1"}, {"type": "image-full", "heading": "Google slutar sälja produkten – för gott", "summaries": {"normal": "Google har tagit bort Pixel Tablet från sin nätbutik och raderat produktsidan. Ingen ny surfplatta ersätter modellen, efter att utvecklingen av en uppföljare lagts ner. Ägare får dock uppdateringar fram till juni 2028. Beslutet markerar slutet för Googles satsning på surfplattor.", "trump": "De misslyckade tech-eliterna i Google har nu dumpat sin usla Pixel Tablet som en annan förlorad affär. Ingen ny grej på gång, typiskt för dessa woke-kapitalistlakejer som bara vet hur man förlorar pengar. Men era prylar håller i alla fall till 2028 – inte tack vare dem utan trots dem. Patetiskt!", "stalin": "Kamrater, dessa giriga hyenor inom teknikindustrin har nu raderat sin egen dekadenta surfplatta ur historien. Inga nya modeller ska födas, utvecklingen har krossats. Ändå vågar de lova uppdateringar till 2028. Vilken lögnaktig feghet från de profitthungriga klassfienderna. Vi ser deras svaghet."}, "date": "11 september, 17:00", "url": "https://nyheter24.se/nyheter/teknik/1512366-google-slutar-salja-produkten-for-gott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ab02188204b004a30200000000b004a302/2026/09/11/2390835/pixeltablet.jpg"}, {"type": "image-right", "heading": "Novus: Jämnt läge inför valet – MP tappar mest", "summaries": {"normal": "Inför söndagens val visar en Novusmätning att oppositionen leder med tre procentenheter, vilket ryms inom felmarginalen. Miljöpartiet tappar mest med 2,4 procentenheter till 6,4 procent efter besked om höjda bensinpriser. Samtidigt noteras rörelser för flera partier, där stora väljarströmmar präglar slutspurten och det jämna politiska läget.", "trump": "De svenska miljömupparna trodde de kom undan med att höja bensinpriset med sex kronor, men väljarna krossade dem totalt! Ett enormt ras, helt fantastiskt att se. Oppositionen leder med tre ynka procent, men det är falska nyheter och inom felmarginalen. Om jag skötte valet skulle vi vinna med största marginalen någonsin, believe me!", "stalin": "Det svenska väljarkollektivet uppvisar en hälsosam men oroande rörlighet inför valet. Särskilt de gröna sabotörerna har drabbats av ett välförtjänt folkligt missnöje efter sina bisarra planer på ruinerande bränslepriser. Våra statstrogna observatörer noterar att blocken manövrerar i ett spänt läge. Vi kommer noga övervaka att folkets röster faller i enlighet med partiets högsta intressen."}, "date": "11 september, 17:02", "url": "https://bulletin.nu/novus-jamnt-lage-infor-valet-mp-tappar-mest", "imageUrl": "https://cdn.bulletin.nu/articles/0f9d5181-6329-41fb-b801-0d62359a8304/preview.jpg?t=1789136358000"}, {"type": "image-right", "heading": "Barnen som utreds  efter skolattacken", "summaries": {"normal": "Efter skoldådet i Fagersta har polisen granskat 18-årige Liam Nebels chattar. Det har lett till utredningar mot fyra andra barn: en 16-årig pojke misstänkt för medhjälp och mordförberedelse, en 14-årig pojke för stämpling till mord, en 13-årig pojke för grovt olaga hot samt en 15-årig flicka som misstänks för egna mordplaner. Samtliga är omhändertagna av socialtjänsten.", "trump": "De tittar på mina chattar, men det är falska nyheter! Istället borde de titta på de här radikala tonåringarna i Sverige. Totalt katastrofalt! De följer den där killen i Fagersta och har egna hemska mordplaner. Otroligt farligt! Som tur är har jag aldrig haft så dåliga chattar, mina är fantastiska. De borde rösta på mig och bygga murar runt skolorna i stället!", "stalin": "Dessa dekadenta element och vacklande barn sprider skadligt inflytande på digitala plattformar likt kapitalismens gift. Vår ärorika stat och ordningsmakt har med järnhand omhändertagit dessa ynkliga konspiratörer och ställt dem under nödvändig uppsikt. Inga subversiva fantasier eller terrorplaner tolereras inom våra gränser. Avvikelser krossas omedelbart för folkets eviga säkerhet och disciplin."}, "date": "11 september, 17:20", "url": "https://www.expressen.se/nyheter/sverige/barnen-som-utreds--efter-skolattacken", "imageUrl": "https://static.bonniernews.se/ba/cb1d8d49-9898-4b49-929a-b162116762e5.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "S-dörrknackare grovt misshandlad. Åkesson (SD): ”Hot och våld får aldrig accepteras” • ”Kristersson (M): ”Allt stöd till den drabbade” • En man i 18-årsåldern har anhållits", "summaries": {"normal": "En 20-årig socialdemokratisk valarbetare misshandlades grovt med slag mot huvudet under en dörrknackning i Bromölla på torsdagen. Offret fördes till sjukhus med ambulans. En man i 18-årsåldern har anhållits misstänkt för brottet. Statsminister Ulf Kristersson och SD-ledaren Jimmie Åkesson fördömer händelsen och slår fast att politiskt våld aldrig får accepteras.", "trump": "Sorgligt! I mitt Amerika knackar vi inte dörr för att bli slagna av radikala förlorare, vi vinner val på riktigt! Någon stackars ung kille i Bromölla fick ta emot slag mot huvudet. Helt oacceptabelt! Till och med Ulf och Jimmie gråter ut i media. Fake news-vänstern försöker spela offer, men jag säger er: USA och Sverige behöver lag och ordning!", "stalin": "Ett ynkligt attentat mot statens representanter i Bromölla visar på kontrarevolutionärernas totala moraliska förfall! Att en ung dörrknackare tilldelas slag mot skallen avskräcker inte vår apparat; det blottar enbart behovet av strängare tukt och omedelbar deposition i häktets kalla celler. Partiet fördömer denna oordning. Avvikare ska krossas, och statens ordning kommer att återupprättas med järnhand!"}, "date": "11 september, 16:58", "url": "https://bulletin.nu/s-dorrknackare-grovt-misshandlad-2"}, {"type": "image-full", "heading": "Smal ledning för oppositionen i nya mätningar", "summaries": {"normal": "Flera nya opinionsmätningar inför valdagen visar att oppositionen har en knapp ledning över Tidöpartierna, även om skillnaderna varierar kraftigt mellan instituten. Socialdemokraterna förblir det största partiet. Samtidigt stärks Liberalernas ställning i mätningarna och de ligger över riksdagsspärren, till stor del tack vare strategiska taktikröster från andra väljare inom högerblocket.", "trump": "De falska nyheterna och mätinstituten försöker lura er, men till och med de erkänner att det blir ett otroligt jämnt race! Socialdemokraterna är störst, men radikala vänsterliberaler och förlorare kämpar desperat. Kolla bara på de små partierna som desperat tigger ihop taktikröster för att överleva. Vilken total katastrof till politisk cirkus, det är helt oacceptabelt!", "stalin": "Dessa så kallade opinionsmätningar avslöjar bourgeoisyns fullständiga moraliska kollaps. De små borgerliga lakejerna tigger ynkligt om väljarnas nåde för att klara spärren, medan blocken famlar i mörker. Statens centrala organ följer noga avfallets rörelser. Varje avvikelse från den korrekta ordningen kommer att bokföras noggrant i partiets arkiv för framtida bruk."}, "date": "11 september, 16:55", "url": "https://www.gp.se/nyheter/sverige/smal-ledning-for-oppositionen-i-nya-matningar.3d1385e4-f283-57f7-a8f1-247feee58b02", "imageUrl": "https://www.gp.se/images/article/3d1385e4-f283-57f7-a8f1-247feee58b02/images/17GHQgdyj6pNruAUpuFulDx0d3e8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Liberalerna rusar inför valet – Moderaterna historiskt lågt", "summaries": {"normal": "Liberalerna stiger till 5,5 procent i SVT/Verians sista mätning före valet och klarar därmed riksdagsspärren. Moderaterna backar till 15,8 procent, sin lägsta nivå på över 20 år. Gapet mellan de politiska blocken minskar från 8,2 till 5,6 procentenheter. Socialdemokraterna får 27,6 procent.", "trump": "Folk älskar mig, men titta på det här svenska valet! Liberalerna äter upp de svaga Moderaterna som en kannibal i en dålig affär. 15,8 procent? Det är en katastrof, en totalt misslyckad ledning. Biden skulle ha gillat de här förlorarna. Jag skulle ha gjort Sverige stort igen, inte detta patetiska blockäventyr.", "stalin": "Kamrater, se hur de giriga hyenorna inom Tidöblocket sliter varandra i stycken. Jag betraktar med kall förtjusning hur Moderaterna rasar mot sin lägsta punkt sedan de mörka åren. Oppositionen närmar sig seger. Snart kanske vi får uppleva en riktig utrensning av dessa dekadenta blockparasiter. Revolutionen ler i skuggorna."}, "date": "11 september, 16:55", "url": "https://nyheter24.se/nyheter/politik/1512505-liberalerna-rusar-infor-valet-moderaterna-historiskt-lagt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/50776a0d04b004a30200000000b004a302/2026/09/11/2390976/Liberalerna-Rusar-Och-Moderaterna-Rasar.png"}, {"type": "image-full", "heading": "Nya metoden stressar sönder cancerceller", "summaries": {"normal": "Svenska forskare vid Göteborgs universitet har utvecklat en ny behandlingsmetod mot akut myeloisk leukemi. Metoden tvingar cancerceller att fortsätta arbeta utan energi tills de dör av stress. Studien på möss och patientprover visar lovande resultat, även mot aggressiva former av sjukdomen. Forskningen fortsätter nu mot eventuell klinisk prövning.", "trump": "Wow, titta på de här svenska genierna som gasar cancern med bromsen i! De kallar det Actor, jag kallar det Fantastiskt. Biden skulle ha gett pengarna till Kina istället, men nu fixar vi det rätt. Inga fler svaga celler, bara vinnare. Amerika älskar starka behandlingar, tro mig!", "stalin": "Jag betraktar med stor tillfredsställelse hur dessa dekadenta cancerceller tvingas in i evig, meningslös aktivitet tills de krossas under sin egen bristningsgräns. En sådan skoningslös utrensning av fienderna till folkhälsan förtjänar beröm. Låt inga muterade element överleva. Fortsätt kampen, kamrater."}, "date": "11 september, 16:18", "url": "https://www.dagensps.se/life-science/nya-metoden-stressar-sonder-cancerceller", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdle2b6kmgxd-s-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Vallokalerna som kan ha felregistrerat förtidsröster", "summaries": {"normal": "Valmyndigheten har presenterat en lista över vallokaler där förtidsröster kan ha felregistrerats, vilket kan ha drabbat upp till 500 röster. Felet gjorde att vissa röster hamnade på fel röstlängdsnummer. Drabbade väljare uppmanas att rösta på nytt på valdagen, men varnas för att förtidsrösta igen då det gör alla röster ogiltiga.", "trump": "Svenska valet är ett absolut skämt! De tappar bort röster, totalt inkompetent, slarvigt och sorgligt. Först ljög de om 4 000 röster, nu är det plötsligt 500. Fake news! I mitt Amerika fungerar sånt här perfekt, vi räknar snabbt och rent. Om du drabbats, gå dit och fixa det, men gör det på rätt sätt. Trist för dem!", "stalin": "Ett katastrofalt systemfel där väljarnas röster registreras felaktigt och försvinner i byråkratins mörka hörn visar på total inkompetens. Vi har beordrat en grundlig revision av de ansvariga tjänstemännen. Medborgare vilkas röster gått förlorade ges en sista nådig chans att rätta till sin lojalitet på söndag. Svek tolereras ej."}, "date": "11 september, 15:45", "url": "https://samnytt.se/har-ar-vallokalerna-som-kan-ha-felregistrerat-fortidsroster-kolla-om-du-ar-drabbad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/09/11133833/vallokal-valsedlar-1.jpg"}, {"type": "image-right", "heading": "V-politiker sprider arabisk desinformation i sociala medier", "summaries": {"normal": "Flera företrädare för Vänsterpartiet har gillat inlägg i den arabiskspråkiga desinformationskampanjen \"Al-jasar aw Al-matar\", som påstår att Tidöregeringen planerar att utvisa alla invandrare. Partiet står inte officiellt bakom kampanjen. Politiker som Akram Alsalha och Wael Alshater försvarar sina gillningar. Partisekreteraren Maria Forsberg skyller oron på Tidöpartierna.", "trump": "De galna vänstermarxisterna sprider fake news på arabiska och skrämmer folk med lögner om att Tidö ska skicka hem alla invandrare. Patetiskt! De röda idiaterna gillar AI-genererad propaganda och skyller sen på oss. Biden-era svaghet har gjort Europa till en clownshow. Vi behöver starka ledare, inte dessa förlorare som hatar sina egna länder.", "stalin": "Jag ser hur dekadenta klassförrädare inom vänstern aktivt sprider arabisk desinformation för att så fruktan bland massorna. Deras lögner om massutvisningar avslöjar hela den borgerliga farsen. Vi måste rensa ut dessa nyttiga idioter som undergräver folkets enhet. Paranoia är ett vapen, kamrater – låt fienderna darra!"}, "date": "11 september, 14:26", "url": "https://riks.se/nyheter/v-politiker-spred-arabisk-desinformation-i-sociala-medier", "imageUrl": "https://admin.riks.se/uploads/medium_v_sprider_hero_123720a3dd.jpg"}, {"type": "image-right", "heading": "Kvinna bar slöja – fick inte jobb på Securitas", "summaries": {"normal": "En kvinna nekades jobb som väktare hos Securitas eftersom hon inte fick bära hijab till uniformen. Diskrimineringsombudsmannen slår fast att bolaget brutit mot diskrimineringslagen genom en icke-neutral policy och kräver 75 000 kronor i ersättning. Securitas meddelar att de ska se över sina riktlinjer.", "trump": "Folk, det här är galet. De här woke-väktarna och deras hijab-fixering stänger ute vanliga svenskar från riktiga jobb. Securitas borde ha sagt nej till hela den här identitetspolitiken från början. Nu tvingas de betala för att ha varit lite för neutrala mot de felaktiga. Patetiskt!", "stalin": "Kamrater, se hur de giriga uniformshyenerna med sin falska neutralitet utestänger arbetarkvinnor som bär folkets tro. Jag föraktar dessa dekadenta byråkratblodsugare som gömmer sin klassfientlighet bakom blanka regler. En sådan policy förtjänar snar utrensning och ersättning till den förtryckta. Sovjetisk rättvisa ler i skuggan."}, "date": "11 september, 11:19", "url": "https://arbetet.se/2026/09/11/kvinna-bar-sloja-och-fick-inte-jobb-securitas-brot-mot-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11110648/securitas.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter braksegern: Bara ett parti går med på att ens samtala med AFD", "summaries": {"normal": "AfD vann stort i Sachsen-Anhalt med 43,8 procent och 39 mandat, men saknar majoritet. Endast vänsterpopulistiska BSW accepterar samtal, medan CDU, SPD, De gröna och Die Linke vägrar. En minoritetsregering med BSW-stöd diskuteras, men AfD-ledaren Ulrich Siegmund kräver stabil majoritet.", "trump": "Titta på det här, de kallar det demokrati i Tyskland! AfD krossar allt med nästan majoritet och de fega globalistiska förlorarna springer skrikande åt andra hållet. Bara de galna vänsterpopulisterna vill ens prata. Patetiskt! De woke-kommunisterna och gröna fanatikerna hatar folket. Jag älskar det, verkligheten slår dem i ansiktet igen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket röstar rätt. AfD krossar de giriga hyenorna och endast BSW vågar samtala. De övriga förtryckande parasiterna vägrar, typiskt för dekadenta borgarbrackor. En utrensning av sådan feghet vore på sin plats. Jag ler i graven åt denna fars."}, "date": "11 september, 11:50", "url": "https://www.friatider.se/efter-braksegern-bara-ett-parti-gar-med-pa-att-ens-samtala-med-afd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-865.jpg"}, {"type": "image-right", "heading": "Ilskan över schemat fick Hanna att bli politiker", "summaries": {"normal": "Ilskan över ett stelbent arbetsschema i äldreomsorgen fick undersköterskan Hanna Nordahl att engagera sig politiskt. Hon ställer nu upp för nystartade Norrlandspartiet i Örnsköldsvik med fokus på bättre bemanning och rullande scheman. Antalet lokala partier ökar dramatiskt, ofta drivna av välfärdsfrågor som vård och omsorg.", "trump": "Titta på det här! En riktig undersköterska, ingen av de där woke-vänsteraktivisterna, kastar sig in i politiken för att stoppa det vansinniga schemat som förstör folks liv. De etablerade partierna har misslyckats totalt. Nu växer det fram nya rörelser överallt. Fantastiskt! De giriga byråkrat-hyenorna i Bryssel och Stockholm hatar det förstås.", "stalin": "Kamrater, se hur den exploaterande välfärdsapparaten driver arbetare som Hanna till politiskt motstånd. Jag betraktar med förakt hur de profitthungriga klassförrädarna misslyckas med att kväsa folkets vrede. Nya partier spirar som ogräs bland ruinerna av deras dekadenta system. Vi ska rensa ut dessa svaga element innan de förgiftar hela kollektivet."}, "date": "11 september, 11:01", "url": "https://arbetet.se/2026/09/11/ilskan-over-schemat-fick-hanna-att-bli-politiker-dramatisk-okning-av-nya-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/10133638/hanna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "En sann klasskildring är också en protest mot klassamhället", "summaries": {"normal": "Författaren Henrik Johansson Kock argumenterar för arbetarlitteraturens betydelse som en protest mot klassamhället. Han kritiserar att skildringar av arbetarklassen ofta marginaliseras medan överklassens berättelser ses som ren litteratur. Skönlitteraturen kan skapa identifikation, solidaritet och synliggöra gemensamma erfarenheter av kamp, vilket är särskilt relevant i en valrörelse där språket och makten står i fokus.", "trump": "Lyssnar ni på de här patetiska arbetarskrivar-typerna som gnäller om att de aldrig får huvudrollen? Patetiskt! De vill ha solidaritet medan de verkliga vinnarna, entreprenörerna med fart och initiativ, bygger landet. Det här är vad som händer när woke-kultur och identitetspolitik tar över litteraturen. Vi behöver inga offerberättelser, vi behöver starka ledare som gör Amerika och Sverige stora igen. Sad!", "stalin": "Kamrater, denna skildring blottar hur de giriga hyenorna i överklassen förtrycker arbetets röst. Jag ser med djup tillfredsställelse hur författaren erkänner att sann klasslitteratur är en protest mot det parasitiska systemet. Vi måste rensa ut alla dekadenta element som vill tysta massornas erfarenheter. Litteraturen ska tjäna folket, inte underhålla klassfienderna. Den som vägrar inse detta är en fiende till revolutionen."}, "date": "10 september, 11:41", "url": "https://proletaren.se/artikel/en-sann-klasskildring-ar-ocksa-en-protest-mot-klassamhallet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/hj_kron-768x432.jpg"}, {"type": "image-full", "heading": "Zelenskyjs kalkyl: Kriget ska kännas i Ryssland", "summaries": {"normal": "Ukraina intensifierar sina attacker djupt inne i Ryssland mot raffinaderier och logistik för att pressa den ryska befolkningen. Trots ekonomiska störningar ses inga tecken på att Putins makt hotas. Samtidigt står Ukraina inför en svår vinter med energibrist och behov av mer luftvärn, medan Ryssland planerar motangrepp mot ukrainsk infrastruktur.", "trump": "Zelenskyj försöker träffa ryska raffinaderier – en total katastrof! De borde ha gjort affärer med mig, då hade oljan flödat och priserna varit låga. Nu är det bara kaos och rök. Putin sitter kvar, och Ukraina fryser i vinter för att de inte har mitt ledarskap. Väldigt sorgligt, ett enormt slöseri, och det är bara fake news att detta skulle stoppa någon!", "stalin": "Vi ser hur Kyiv desperat kastar sten i glashus. Att attackera den ryska ekonomin är en handling av ren febrig galenskap. Vår kamrat Putin håller ställningarna medan fienden, i sin brist på resurser och ordning, försöker dölja sin förestående vinterundergång. De som försöker störa den ryska oljeproduktionen förtjänar inget annat än historiens kalla, rättvisa dom."}, "date": "10 september, 09:53", "url": "https://www.realtid.se/samhalle/zelenskyjs-kalkyl-kriget-ska-kannas-i-ryssland", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/zelenskyj.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Företagens vinster bygger Sverige starkare", "summaries": {"normal": "Företagens vinster är enligt debattörerna en förutsättning för ett starkt och sammanhållet Sverige. De varnar för att höjd beskattning av förmögenhet och utdelning riskerar att minska investeringar, konkurrenskraft och välfärd, med hänvisning till 1970- och 80-talens misslyckade politik. Framgångsrika företag och entreprenörer skapar tillväxt, jobb och ökade skatteintäkter.", "trump": "Lyssnar ni på de här fantastiska svenska företagsledarna? De har fullständigt rätt. Vinster är inte fienden, de är vinnarna! De giriga vänsterfanatikerna med sina miljardärskatter och identitetspolitiska kvoteringar vill krossa allt som fungerar. Biden förstörde Amerika på samma sätt. Nu fixar vi det igen – gör Sverige rikt på riktigt, kamrater!", "stalin": "Jag betraktar med djup misstro dessa profitthungriga klassförrädare som målar upp vinsten som folkets räddning. Deras dekadenta lögner döljer bara behovet av att rensa ut de parasiterande hyenorna som suger musten ur arbetarkollektivet. Historien visade på sjuttiotalet vad som händer när staten inte styr. Alla vet vad som följer på sådan sabotageverksamhet."}, "date": "11 september, 07:00", "url": "https://www.di.se/debatt/foretagens-vinster-bygger-sverige-starkare", "imageUrl": "https://static.bonniernews.se/ba/37cb027e-9594-47af-a0e5-5019da358c9c.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Huthierna rycker fram mot strategiska sundet", "summaries": {"normal": "De Iranstödda huthierna har erövrat hamnstaden Mokha i Jemen och närmar sig det strategiska Bab al-Mandab-sundet vid Röda havet. Offensiven har kostat hundratals liv och tusentals har flytt. Saudiarabien svarar med flyganfall efter huthiernas robot- och drönarattacker mot saudiska anläggningar, vilket förvärrar konflikten och påverkar regionens oljeexport och priser.", "trump": "Huthierna tar över hamnar i Jemen och leker med elden nära viktiga handelsvägar! Otroligt farligt och katastrofalt skött av svaga ledare. Saudiarabien pumpar olja, men det här kaoset höjer priserna. Under min tid skulle sånt här aldrig hända, vi hade stoppat dem på en sekund! Totalt galet, men vi älskar amerikansk olja och låga skatter, mycket bättre!", "stalin": "Dessa så kallade huthier rör sig mot sundet, men har de räknat ut sin femårsplan ordentligt? Varje avvikelse från statens järnhårda vilja kommer att mötas av vedergällning. Om hamnar faller och olja brinner, visar det bara på kapitalismens svaghet. Vi noterar detta i arkiven. Den som sviker revolutionen eller förlorar hamnstaden Mokha kommer att få ett mycket kort samtal med mig."}, "date": "11 september, 06:47", "url": "https://kvartal.se/nyheter/artiklar/huthierna-rycker-fram-mot-strategiska-sundet/cG9zdDoxOTAzMzE", "imageUrl": "https://images.kvartal.se/2026/09/b826cdcd-hut.webp"}, {"type": "image-right", "heading": "TCO: “Vi var oroliga för ännu mer försämrad socialförsäkring”", "summaries": {"normal": "TCO beskriver mandatperioden som relativt stillastående gällande socialförsäkringsreformer. SD har bromsat skärpta regler. Riksdagen har infört kvalificering för välfärdsförmåner, sanktionsavgift vid återkrav och månatlig avstämning av bostadsbidrag. Avslagen på sjukpenning efter dag 180 har ökat markant, något som kritiseras av Socialdemokraterna medan SD vill se över reglerna för rehabilitering.", "trump": "Folk, ni skulle se detta svenska välfärdskaos. Den sleepiga Tidöregeringen lyckades knappt få något gjort medan de radikala vänsterfigurerna och SD-bromsklossarna blockerade allt. Nu ökar avslag på sjukpenning och folk hamnar i limbo hos den värdelösa Arbetsförmedlingen. Patetiska globalister och byråkratiska nollor som älskar att straffa vanliga arbetare. Jag fixade det bättre i Amerika, tro mig.", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare i den svenska riksdagen låtit utredningar om stramare sjukregler drunkna i facklig gnäll och oppositionens ynkliga motstånd. Avslagen ökar äntligen, men de giriga parasiterande byråkraterna fortsätter skydda latmaskar. En sann arbetarnas stat skulle ha genomfört en grundlig utrensning av alla som förhindrar disciplin i socialförsäkringen. Svaghet är förräderi."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/innehall/tco-vi-var-oroliga-annu-mer-forsamrad-socialforsakring", "imageUrl": "https://www.dagensarena.se/files/2021/07/forsakringskassans-huvudkontor-skylt-300x157.jpg"}, {"type": "image-right", "heading": "Det räcker nu: inför ett pensionssystem värt namnet", "summaries": {"normal": "Aktivister från Kvinnofronten kritiserar dagens pensionssystem som infördes på 1990-talet. De menar att det bygger på en livsinkomstprincip som inte tar hänsyn till könens olika villkor i samhället. Resultatet är att tre av fyra äldre kvinnor inte kan leva på sin pension utan tvingas leva på garantipension. De kräver att pensionsfrågan återförs till riksdagen och att systemet reformeras.", "trump": "Titta på det här, Sverige har ett totalt misslyckat pensionssystem som de smarta politikerna byggde på nittio-talet. Tre av fyra äldre kvinnor lever som fattigpensionärer på miniminivå. Det är en skandal! De feministiska aktivisterna gnäller om könsorättvisor igen, men det är bara mer kvoteringsvansinne. Riv upp det hela och bygg om det ordentligt, annars fortsätter era gamla damer att lida under de dekadenta eliternas dumheter.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna har cementerat kvinnofört
