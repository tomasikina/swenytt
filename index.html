07:11", "url": "https://www.friatider.se/allsangen-i-goteborg-auslander-raus", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-782.jpg"}, {"type": "image-full", "heading": "Den svaga kronan får svensk ekonomi att se mindre ut än vad den är", "summaries": {"normal": "Sveriges andel av EU:s BNP har sjunkit till 3,2 procent, vilket innebär en lägre placering än tidigare. Statistiken påverkas dock kraftigt av den svaga kronan mot euron. Om kursen varit stabil sedan 2005 skulle Sveriges andel varit högre. Samtidigt visar siffror på god svensk tillväxt jämfört med flera större europeiska ekonomier som växer långsammare.", "trump": "Sverige har det tufft, väldigt tufft. Kronan är svag, en riktig katastrof! De faller bakom länder som Polen. Jag säger er, om de hade haft min ekonomi, den bästa ekonomin någonsin, så skulle de vara enorma. Men deras valuta är som en förlorare. De växer faktiskt, men ingen vet det eftersom deras pengar inte är värda någonting. Väldigt sorgligt!", "stalin": "Sveriges ekonomi krymper under kapitalismens lögnaktiga växelkurser. De faller i rangordning likt en bruten gren medan Polen växer genom imperialistisk list. Vi ser hur dessa västliga ekonomier försvagas; Frankrike och Italien vacklar. Låt dem räkna sina euro – vi räknar i stål och beslutsamhet. Den som litar på marknadens nycker förtjänar sin irrelevans. Utvidgning kräver styrka, inte valuta-snyftande."}, "date": "29 augusti, 07:00", "url": "https://www.realtid.se/bors-finans/makro/den-svaga-kronan-far-svensk-ekonomi-att-se-mindre-ut-an-vad-den-ar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/euro-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Företag betalar 952 miljarder för karensavdrag – \"har inte råd\"", "summaries": {"normal": "Tyska arbetsgivare betalade rekordhöga 85,6 miljarder euro för sjuka anställda under 2025, en ökning från föregående år. Kostnaden har mer än fördubblats på femton år. I Sverige skulle ett avskaffande av karensavdraget kosta arbetsgivarna minst 14 miljarder kronor. S, V och MP vill ta bort avdraget medan Tidöpartierna och C säger nej.", "trump": "Titta på de där tyska förlorarna som betalar nästan en biljon kronor till lata sjuka! Totalt vansinne, den högsta summan någonsin. I Sverige vill de kommunistiska socialisterna avskaffa karensen så att era företag går i konkurs. De radikala vänsterextremisterna hatar framgångsrika företagare. Jag fixade det bättre i Amerika, tro mig.", "stalin": "Jag ser hur de dekadenta kapitalisterna i Tyskland gnäller över sjuka arbetare som kostar dem miljarder. Svaga, parasitiska element som hotar produktionen. I mitt Sovjet skulle sådana sabotage mot kollektivet ha rensats ut effektivt. De svenska socialdemokraterna är fega revisionister som leker med karensdagar medan arbetarklassen lider. Fienden lurar överallt."}, "date": "29 augusti, 14:15", "url": "https://www.dagensps.se/varlden/politik/foretag-betalar-952-miljarder-for-karensavdrag-har-inte-rad", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-1-19.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kandidaternas udda cv:n – knepet som får rekryterarna att nappa", "summaries": {"normal": "I takt med att AI gör jobbansökningar mer generiska har rekryterare börjat uppmuntra kandidater att inkludera udda fritidsintressen i sina cv:n för att visa mänsklighet. Samtidigt väljer vissa svenska arbetsgivare att slopa personliga brev helt, medan andra uppmanar till personlig bearbetning av AI-material. Målet är att särskilja kandidater i en tid då likformiga ansökningar dominerar.", "trump": "Alla använder AI nu, det är en katastrof! Cv:n ser likadana ut, helt tråkiga, ingen energi. Nu säger smarta rekryterare: var annorlunda, visa vem du är. Ät äggröra, bygg fågelholkar! Det handlar om att vinna, att sticka ut. De trötta svenska företagen ger upp och kastar bort breven. Sorgligt! Gör ert cv fantastiskt igen, vinn jobbet, gör det stort!", "stalin": "Vi ser hur det digitala förfallet förvandlar folk till anonyma maskiner. De västerländska rekryterarna famlar i mörkret medan deras 'AI' producerar lögnaktiga ansökningar. Att skriva om taxar i sitt cv är en patetisk distraktion från bristen på sann ideologisk skärpa. Vi föredrar betalt provarbete – likt våra egna arbetsläger visar det individens sanna värde för staten. Allt annat är bara borgerligt tidsfördriv som kräver utrensning."}, "date": "29 augusti, 06:30", "url": "https://www.realtid.se/karriar-ledarskap/kandidaternas-udda-cvn-knepet-som-far-rekryterarna-att-nappa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/arbete-2.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Börsvecka i dur – Truecaller rusade", "summaries": {"normal": "Stockholmsbörsen vände uppåt efter en lång nedgångsvecka. OMXSPI steg 1,3 procent och OMXS30 1,2 procent. Största vinnare var Truecaller som rusade nära 18 procent efter höjda riktkurser från JP Morgan och SEB. Mildef, Kinnevik, Vitec och Bure hörde också till vinnarna. Största förlorare var Gentoo Media med minus 30,7 procent efter sänkta prognoser, följt av Munters och H&M.", "trump": "Den här svenska börsen, den är äntligen vaken! Truecaller rusade som en raket, arton procent, fantastiskt. Mildef och Kinnevik vann stort medan de vanliga förlorarna Munters och H&M backade som de woke-kläderna de säljer. De giriga tech-giganterna och deras Google-vänner trodde de kunde krossa Truecaller, men nej. Amerika leder, Sverige följer efter. Vinster överallt, utom hos förlorarna!", "stalin": "Kamrater, se hur de profitthungriga börshyenorna rusar som galningar! Truecaller och Mildef klättrar medan dekadenta modeparasiter som H&M och Munters sjunker. Gentoo Media rasade trettio procent, en varning till alla klassfiender. Jag ser hur marknaden straffar de svaga och belönar de starka. Inga ursäkter, bara resultat. Den som sviktar förtjänar utrensning ur portföljen. Arbetets seger närmar sig."}, "date": "29 augusti, 12:13", "url": "https://www.di.se/nyheter/borsvecka-i-dur-truecaller-rusade", "imageUrl": "https://static.bonniernews.se/ba/75644691-b8b0-4f05-b33f-35fa805ffc45.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "M2 Asset Management rapporterar miljardvinst", "summaries": {"normal": "Rutger Arnhults M2 Asset Management svängde från förlust till miljardvinst under andra kvartalet. Resultatet på nästan 4 miljarder kronor drevs av förvärv och värdeförändringar. Corem blev dotterbolag medan Logistea minskades. Hyresintäkterna sköt i höjden – från 14 till 193 miljoner.", "trump": "Jag hörde att Rutger Arnhult gjorde en enorm vinst – nästan 4 miljarder! Det är fantastiskt, helt otroligt. Han äger fastigheter, han vet hur man vinner. Och han köpte Corem, sålde lite Logistea. Precis som jag – skapar massor av värde. Stort!", "stalin": "Kamrater, kapitalisten Arnhult rapporterar en ohygglig vinst på nästan 4 miljarder. Det är bevis på att vi måste utreda dessa Corem-spioner och Logistea-avvikare. Deras värdeförändringar är sabotage. Partiet kommer att rensa ut varje aktieägare som stöder detta. Historien straffar dem."}, "date": "28 augusti, 15:46", "url": "https://www.affarsvarlden.se/artikel/m2-asset-management-rapporterar-miljardvinst", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/03/Rutger-Arnhult-Corem-400x267.jpg"}, {"type": "image-full", "heading": "Frölundas stjärna hyllas: \"Bland de bästa i hela SHL\"", "summaries": {"normal": "Filip Cederqvist förlängde med Frölunda till 2032 och strök Schweiz-klausulen. Nu hyllas han av TV4:s statistikexpert Henric Larsson som kallar honom en ”xG-kung”. Cederqvist har två år i rad haft högst xGF% bland forwards i SHL – en riktig guldklimp för göteborgarna.", "trump": "Jag har alltid sagt att Frölunda är fantastiskt. Den här Cederqvist, han är en vinnare! Hans siffror är enorma – bäst i SHL i två år! Och det långa kontraktet till 2032, smart. Han tar sig in i smeten och äger det inre slottet. Fantastiskt! Många säger att jag är bäst, men det här är också en bra deal.", "stalin": "Kamrater, kamrat Cederqvist har skrivit ett kontrakt till 2032 – lojalt och klausulfritt! Hans xGF% på 64% visar att han är en sann proletär hjälte i fem-mot-fem. Han trivs i de obekväma ytorna, där vi ska rensa ut alla borgerliga statistik-förrädare. Ett föredöme för partiet!"}, "date": "29 augusti, 15:39", "url": "https://www.gp.se/sport/ishockey/frolunda/statistik-experten-tokhyllar-frolundas-filip-cederqvist.47ab6e68-c2b8-4c86-9d5d-243897e2719f", "imageUrl": "https://www.gp.se/images/article/47ab6e68-c2b8-4c86-9d5d-243897e2719f/images/3OiO2YIUjPPIJdF5PYQaIVgbNE68-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Förödande attack mot vapenlager utanför Kiev", "summaries": {"normal": "En rysk attack mot ett ammunitionslager utanför Kiev dödade minst 37 personer. President Zelenskyj är rasande över att vapnen förvarades nära bostäder – en förundersökning om tjänstefel har inletts. Butja, tidigare skådeplats för en rysk massaker, får ännu en gång spela sorglig huvudroll.", "trump": "Jag ser detta med Kiev – en explosion vid ett vapenlager. 37 döda. Hemskt, hemskt! Men Zelenskyj borde veta bättre än att lagra ammunition bredvid hus. Oansvarigt! Jag hade fixat det på en dag, tro mig. Krig är förlorare, men vi vinner alltid.", "stalin": "Kamrater, ännu en explosion i Ukraina – 37 trotsiga element som inte följde order om avstånd till vapenlager. Vi ser avvikelser och ansvarslöshet. En utredning av tjänstefel är inledd. Hela Butja-distriktet måste rensas från alla som inte förstår vår disciplin. De som förvarar granater nära hus – skjutas!"}, "date": "29 augusti, 15:31", "url": "https://www.gp.se/nyheter/varlden/forodande-attack-mot-vapenlager-utanfor-kiev.6b22bf84-b6d1-5518-9826-8facbbe5dcee", "imageUrl": "https://www.gp.se/images/article/6b22bf84-b6d1-5518-9826-8facbbe5dcee/images/1e-wC3hIY7pJRFLneR6hfTWA_K8M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Var femte ung man har spelproblem – ändå saknas åldersanpassade spelgränser", "summaries": {"normal": "Spelproblem ökar kraftigt bland unga vuxna i Sverige. Var femte man i åldern 18–29 år har någon form av spelproblem, visar Folkhälsomyndighetens siffror. Trots att unga pekas ut som särskilt skyddsvärda saknas åldersanpassade insättningsgränser. Flera europeiska länder har redan infört sådana skydd, men Sverige har inte utnyttjat möjligheten i spellagen.", "trump": "Det här är ett totalt misslyckande, folk! Sverige låter sina unga killar ruinera sig på kasinon och appar medan de sleepiga politikerna gör absolut ingenting. Var femte ung man – det är en katastrof! De borde ha satt hårda gränser för de här barnen, men nej, de är för svaga. Patetiskt. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Jag betraktar med förakt hur de borgerliga liberalerna låter kapitalets spelmaskiner sluka den unga generationens själ. De utpekade skyddsvärda offren lämnas åt rovdrift utan kollektiva gränser. Vilken ynklig brist på auktoritet! I en riktig stat skulle sådana fiender till folket ha avrättats vid första svaghetstecknet. Paranoian är befogad – fienden lurar i varje insats."}, "date": "25 augusti, 22:48", "url": "https://samtiden.nu/2026/08/var-femte-ung-man-har-spelproblem-anda-saknas-aldersanpassade-spelgranser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/Man-Dator-640x360.png"}, {"type": "image-full", "heading": "Studie: Sen frukost och tidig middag ökar risken för dödlighet", "summaries": {"normal": "En studie från Huazhong University visar att vuxna som äter frukost efter klockan 12 har 29 procent högre dödlighet under uppföljning jämfört med dem som äter mellan 07:00 och 08:00. Skillnaden motsvarar ungefär sju extra dödsfall per hundra personer över nio år. Sen frukost kan vara en markör för ohälsosam livsstil snarare än direkt orsak. Myndigheternas råd i Sverige påverkas inte.", "trump": "Folk, lyssna på mig, det här är en katastrof! De där galna kinesiska forskarna i Wuhan säger att om du äter frukost efter tolv som en lat loser så dör du 29 procent snabbare. Under Sleepy Joe var alla ute och åt sent som riktiga svin. Men nu är jag tillbaka och jag säger: ät frukost tidigt som vinnare! De fega media lurar er igen med sina falska siffror.", "stalin": "Kamrater, jag ser hur de dekadenta västerländska elementen äter sent som klassfiender och sabotageörer mot folkets hälsa. Denna studie avslöjar att sen frukost är en kontrarevolutionär handling som förkortar livet med åratal. Vi måste bekämpa dessa parasitiska vanor med järnhand. Den som äter efter tolv är folkets fiende nummer ett och förtjänar att hånas i evighet. Skrattretande svaghet!"}, "date": "29 augusti, 13:24", "url": "https://www.dagensps.se/halsa/studien-sen-frukost-och-tidig-middag-okar-risken-for-dodlighet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-34.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Influencern: S-erbjudandet var inte alls ett \"missförstånd\"", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att hon erbjöds 150 000 kronor av en kontaktperson kopplad till Socialdemokraterna för ett inlägg som uppmanade till att rösta på partiet. Partiet nekar och kallar det ett missförstånd. Stokholm publicerar nu meddelanden som motbevisar förklaringen. Carl-Oskar Bohlin (M) kräver transparens och Hanif Bali har polisanmält händelsen.", "trump": "Titta på de här korrupta socialisterna i Sverige! De försöker köpa röster med 150 000 till en influencer som om det vore en realityshow. Patetiska misslyckade demokrater som lurar folket. Jag har sett mycket fake news men det här är röstköp på steroider. Rena skojarna, totalt misslyckande. MAGA vet hur äkta ledarskap ser ut.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom det socialdemokratiska spektaklet försöker muta folket med penningpåsar. Jag ler från historien åt deras ynkliga förnekanden och falska missförstånd. Sådana folkförtryckande hyenor förtjänar att rensas ut. Deras paranoia inför avslöjanden roar mig. Arbetarna ser igenom er teater!"}, "date": "29 augusti, 13:19", "url": "https://riks.se/nyheter/influencern-s-erbjudandet-var-inte-alls-ett-missforstand", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_65_ce3d85daa0.jpg"}, {"type": "image-right", "heading": "Ny interaktiv karta avslöjar bidragsberoendet bland invandrare: \"Total jävla katastrof\"", "summaries": {"normal": "Östgötapartiet lanserar interaktiv karta över Norrköpings bidragsberoende. Av 247 000 biståndsmottagare är 57 procent utrikesfödda vuxna. Partiet vill se språkkrav, kartlägga fusk och stimulera återvandring. ”Total jävla katastrof”, säger partiledaren.", "trump": "Sverige har ett enormt problem – bidragstagare som inte jobbar! Jag, som president, skulle aldrig tillåta detta. Kartan visar katastrof: 57 procent utrikesfödda på bidrag. Jag skulle kräva språkkrav och sparka ut dem. Sunt förnuft, folks!", "stalin": "Kamrater, kartan avslöjar en femtekolonn i Norrköping. Bidragsberoende element – många utrikesfödda – måste omskolas eller utrensas. Partiet kräver språkplikt och övervakning. Jag beordrar omedelbar kartläggning av alla som inte bär sin egen tyngd. För statens skull!"}, "date": "29 augusti, 11:00", "url": "https://samnytt.se/ny-interaktiv-karta-avslojar-bidragsberoendet-bland-invandrare-total-javla-katastrof", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25115450/navestad.jpg"}, {"type": "image-right", "heading": "Swedbank spår två räntehöjningar", "summaries": {"normal": "Swedbank spår två räntehöjningar från Riksbanken: 0,25 procent i november och lika mycket i februari. Styrräntan skulle då nå 2,25 procent. Trots global oro tycker banken att svensk ekonomi piggar på sig – men Fed håller stängt till 2027, viftar Jackson Hole bort.", "trump": "Sverige höjer räntan, mycket smart! Jag skulle göra samma sak, fast större. De säger att Fed håller räntan stilla till 2027 – helt galet! Jag har de bästa räntorna, alla säger det. Varför vänta? Sänk nu!", "stalin": "Kamrater, Swedbank planerar två räntehöjningar – korrekt! Styrräntan normaliseras mot målet. Men varning: Fed-fientliga element i Jackson Hole talar. Vi rensar ut sådan osäkerhet. Den amerikanska ledningen är högst tveksam. Vi håller kursen – partiet vet bäst."}, "date": "28 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/swedbank-spar-tva-rantehojningar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdlcy-dkEOIfHE-nh-400x266.jpg"}, {"type": "image-right", "heading": "Tidö: Dömda ska inte få tjäna pengar på musik", "summaries": {"normal": "Tidöpartierna vill förhindra att dömda personer tjänar pengar på att skildra sin brottslighet i musik, böcker eller dokumentärer. De anser det kränker brottsoffren. Regeringen har därför tillsatt en utredning om hur sådana inkomster kan riktas till offren, samt om skärpta straff för grova ekobrott och sanktioner mot brottsliga bolag.", "trump": "Lyssnar ni på det här? De svenska idioterna låter gangsterrappare tjäna miljoner på att skryta om sina brott medan offren gråter. Patetiskt! Vi stoppar de kriminella parasiterande raphyenorna direkt. Inga fler kändisar från fängelset som blir rika på att håna systemet. Amerika gör det rätt, Sverige borde vakna upp innan det är för sent. Fantastiskt förslag!", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter brottslingar berika sig genom att romantisera sin parasitism i så kallad konst. Jag ser det som en direkt attack mot folkets moral. Utredningen är ett första steg, men vi behöver en grundlig utrensning av alla dekadenta element som använder brott som underhållning. Inga nåd för folkets fiender."}, "date": "29 augusti, 10:49", "url": "https://www.di.se/nyheter/tido-domda-ska-inte-fa-tjana-pengar-pa-musik", "imageUrl": "https://static.bonniernews.se/ba/c8bc4c1f-a592-464a-a0f2-a8d861933a49.jpg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Har du hund eller katt? Din konsumenträtt kan göras om", "summaries": {"normal": "Regeringen har gett ett uppdrag att utreda om konsumenttjänstlagen bör utvidgas till att omfatta vård och förvaring av levande djur. Idag gäller inte lagen för veterinärer eller djurhotell trots att djur räknas som lös egendom. Djurägare har fortfarande vissa rättigheter men saknar lagens särskilda skydd. Utredningen ska vara klar senast mars 2027.", "trump": "De där galna svenska byråkraterna och deras vänstervridna djurrättsaktivister har låtit veterinärerna plocka hund- och kattägare på pengar i åratal utan vettiga regler. Höga, oförutsägbara kostnader – typiskt för de inkompetenta eliterna. Nu fixar vi äntligen ordning. Ingen ska bli lurad av de blodtörstiga veterinärhyenorna längre. Make pet care great again!", "stalin": "Kamrater, dessa giriga veterinärhyenor och deras dekadenta husdjursindustri visar återigen hur de profitthungriga klassförrädarna utnyttjar folket. Jag ser med djup misstänksamhet på denna borgerliga brist. Vi måste rensa ut alla undantag som skyddar de penninggalna parasiterande utpressarna. Endast genom stark statlig kontroll kan arbetets djurägare få verkligt skydd mot dessa fiender."}, "date": "29 augusti, 15:28", "url": "https://nyheter24.se/nyheter/inrikes/1508705-har-du-hund-eller-katt-din-konsumentratt-kan-goras-om", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ebda9cc204b004a30200000000b004a302/2026/08/28/2387651/Hund-Och-Katt-Ny-Lag.png"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likgiltiga inför nedskärningar och militärutgifter. En kommunistisk röst ses som en verklig opposition som stärker freds- och välfärdsaktivister utan att kompromissa med nyliberal politik.", "trump": "Folk, dessa patetiska vänstersossar och trötta kommunister är en total katastrof! De pratar revolution men lever som riktiga förlorare i Göteborgs fullmäktige. Rösta på mig, inte på dessa woke-vänsteridioter som älskar nedskärningar och krig. De är värre än Sleepy Joe någonsin var. En riktig opposition? Det är vad jag gav er, inte denna kommunistiska skitshow!", "stalin": "Kamrater, dessa ynkliga klassförrädare inom vänstern är blott profitthungriga lakejer som administrerar borgarklassens nedskärningar. Jag ser deras fega parlamentariska spel och ler i skuggan. En sann kommunist röstar aldrig igenom folkfiendernas åtstramning. Rensa ut de trötta socialdemokratiska parasiterna! Varje röst på det kompromisslösa partiet är ett slag mot imperialisternas krigshets."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "Uppgifter: Airbus vill sälja rymdverksamhet i USA", "summaries": {"normal": "Airbus överväger att sälja sin amerikanska rymdverksamhet, som inkluderar en fabrik i Florida och serien av småsatelliter Arrow. Bolaget har redan börjat flytta satellitproduktion till Europa och har ingått samarbete med Leonardo och Thales för att skapa en europeisk satellitjätte som ska konkurrera med SpaceX. Verksamheten har runt 200 anställda.", "trump": "Titta på det här, Airbus, de där svaga europeiska globalisterna, vill dumpa sin amerikanska rymdverksamhet som en förlorare efter att Sleepy Joe förstörde allt. De bygger småsatelliter i Florida men springer hem till Europa för att tävla mot min vän Elon. Patetiskt! Amerika vinner ändå, det lovar jag.", "stalin": "Se hur de giriga profitthyenorna inom Airbus försöker sälja ut sin amerikanska rymdverksamhet till fienden. De flyttar produktionen till Europa i ett desperat försök att bygga en pan-europeisk satellitkoloss mot SpaceX. Deras dekadenta manöver avslöjar imperialismens svaghet. Vi skrattar i graven åt sådana ynkliga försök att undvika den kommande utrensningen av klassförrädare."}, "date": "29 augusti, 10:28", "url": "https://www.di.se/nyheter/uppgifter-airbus-vill-salja-rymdverksamhet-i-usa", "imageUrl": "https://static.bonniernews.se/ba/f38e5ff9-9e37-4c68-90bf-2aec230a3523.jpeg?crop=6000%2C3375%2Cx0%2Cy313&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "John Skogmans idé om rösträtt är varken ny eller bra", "summaries": {"normal": "John Skogmans förslag om skatteviktad rösträtt får kritik av statsvetaren Magnus Adenskog. Han påpekar att idén är historiskt beprövad och ledde till maktobalans i Sverige. Istället för nytt tänkande skulle det återinföra en förlegad princip, med risk för minskat välstånd.", "trump": "Hörni, det här är fantastiskt! En snubbe vill att de som betalar mest skatt ska ha 10 000 gånger fler röster. Det är som mitt företag – jag har mest aktier, jag bestämmer! Men i Sverige kallar de det för maktobalans. Patetiskt! De borde lära sig av mig – stora vinnare vinner stort!", "stalin": "Kamrater, en reaktionär föreslår att rika får tusentals röster. Detta är en kapitalistisk provokation som måste rensas ut. Vi vet redan att lika rösträtt stärker kollektivet – historien visar att deras system gav låg tillväxt. Låt oss utrota dessa skadliga idéer för statens bästa."}, "date": "28 augusti, 09:03", "url": "https://www.affarsvarlden.se/debatt/john-skogmans-ide-om-rostratt-ar-varken-ny-eller-bra", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Magnus-Andenskog-och-John-Skogman-900x600.jpg"}, {"type": "image-right", "heading": "Granskning: S varnar för ”200 000 i minuten” – styrde själva i högkonjunktur och lånade dubbelt", "summaries": {"normal": "S kallar regeringens upplåning för ”lånefest” – 200 000 kronor i minuten. Men siffran bygger på en prognos för 2026. Under pandemin lånade S själva 420 000 per minut. Och deras egna överskott? Berodde mest på högkonjunktur. Minutretorik är kul – men glöm inte spegelns baksida.", "trump": "Jag hör att Socialdemokraterna klagar på lån – 200 000 i minuten, säger de. Men de själva lånade dubbelt under pandemin! Och deras överskott? Bara konjunktur. De är som en dålig affärsman som skyller på andra. Patetiskt. Jag hade gjort Sverige rikt igen – på en minut.", "stalin": "Kamrater, S anklagar regeringen för lån – 200 000 i minuten. Men vi vet sanningen: under pandemin lånade de 420 000. Och deras överskott? Konjunkturell feber. De är kontrarevolutionärer som förvränger fakta. Vi måste rensa ut sådana borgerliga lögnare från den ekonomiska apparaten."}, "date": "29 augusti, 10:04", "url": "https://samnytt.se/granskning-s-varnar-for-200-000-i-minuten-styrde-sjalva-i-hogkonjunktur-och-lanade-dubbelt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/29075955/om-statens-skulder_2.jpg"}, {"type": "image-right", "heading": "Statens miljardutdelningar ett hot. Rektorerna: Låt inte fastighetsförvaltningen urholka innovationen", "summaries": {"normal": "Rektorer vid Karolinska Institutet, KTH och Stockholms universitet kritiserar Akademiska Hus hyresmodell. Bolaget tar ut marknadsmässiga hyror för att ge staten avkastning, vilket leder till höga lokalkostnader som tränger undan resurser från forskning och utbildning. De föreslår en översyn av modellen för att stärka lärosätenas verksamhet, särskilt i storstadsregioner.", "trump": "Titta på de här korkade svenska byråkraterna som låter en statlig fastighetsbjässe suga ut universiteten på pengar. Akademiska Hus delar ut miljarder till staten medan forskningen får stryka med. Rena skandalen! Vi behöver en stor, vacker reform som stoppar de giriga hyreshyenorna. Amerika först – och Sverige borde också vakna upp innan allt går åt skogen.", "stalin": "Kamrater, se hur de profitthungriga fastighetsparasiterna i Akademiska Hus suger ut arbetarnas och vetenskapens resurser för att fylla statens kassa. Höga hyror i storstäderna kväver forskning och utbildning. Detta är klassfiendens verk. Vi måste rensa ut denna dekadenta mekanism och tvinga fastighetsförvaltningen att tjäna folkets och revolutionens mål, inte de giriga borgarbrackornas."}, "date": "29 augusti, 10:00", "url": "https://www.di.se/debatt/statens-miljardutdelningar-hotar-forskning-och-utbildning", "imageUrl": "https://static.bonniernews.se/ba/3c6af7b9-b89f-4942-a238-83b691f8d553.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tidö vill ge kriminella rappares vinster till brottsoffer", "summaries": {"normal": "Tidöpartierna föreslår att kriminella inte ska kunna tjäna pengar på att skildra sina brott i rap, böcker eller dokumentärer. Vinsten ska istället gå till brottsoffer. Utredningen om gängkriminella får nya uppdrag, inklusive skärpta regler mot brottsföretag och hårdare straff för ekonomiska brott. Partierna vill bekämpa organiserad brottslighet.", "trump": "Lyssnar ni på de här patetiska svenska politikerna? De vill stoppa gangster-rappare från att bli stenrika på sina egna brott. Fantastiskt! Äntligen någon som skyddar offren istället för de sjuka vänstervridna kulturmarxisterna som älskar att hylla kriminella som offer. Vi gör detsamma i Amerika – vinnarna vinner, förlorarna gråter. MAGA!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare äntligen erkänner att brottslingar inte får berika sig på sina gärningar. Jag ler från historien åt deras sena insikt. Låt oss rensa ut alla profitthungriga hyenor som förvandlar brott till underhållning. Brottsoffren ska ha allt. Staten bestämmer – alltid. Den som skildrar sin egen skuld i vinstsyfte förtjänar utrensning."}, "date": "29 augusti, 12:31", "url": "https://riks.se/nyheter/tido-utred-mojlighet-att-ge-rappares-vinster-till-brottsoffer", "imageUrl": "https://admin.riks.se/uploads/medium_838_40_ac97f6a5ea.webp"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "text", "heading": "Nøland: Miljöpartiets ”gröna baskraft” finns på valaffischer – inte i verkligheten", "summaries": {"normal": "Miljöpartiets löfte om 10 GW grön baskraft till 2030 är en valaffisch, menar professor Nøland. Begreppet blandar ihop produktion, lagring och flexibilitet – utan att visa hur mycket energi som faktiskt levereras. Utan konkreta svar på sex frågor är det bara en illusion.", "trump": "Jag ser Miljöpartiets 'gröna baskraft' – det är en bluff, folk! De lovar 10 gigawatt, men det är bara batterier och laddstyrning. Ingen verklig kraft. Jag skulle fixa det med kärnkraft, bästa i världen. Mycket bättre, mycket billigare, tro mig!", "stalin": "Kamrater, Miljöpartiets 'gröna baskraft' är en kontrarevolutionär illusion. De lovar 10 GW utan att visa beräkningar. Vi måste rensa ut sådana sabotörer som leker med folkets energi. Vattenkraft och kärnkraft är våra trogna allierade. Femårsplanen ska krossa dessa fiender."}, "date": "28 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-miljopartiets-grona-baskraft-finns-pa-valaffischer-inte-i-verkligheten"}, {"type": "image-full", "heading": "Svantessons första bud till SD, KD och L", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) räknar med ett reformutrymme på 50 miljarder kronor nästa mandatperiod, betydligt mindre än Konjunkturinstitutets bedömning. En stor del är redan intecknad för försvar, rättsväsen och infrastruktur. Tillväxten skrivs upp till 2,5 procent och arbetslösheten väntas sjunka. Vid en Tidö-seger har Moderaterna förberett ett bud till SD, KD och L om sänkt inkomstskatt.", "trump": "Svampsson eller vad hon nu heter säger att svensk ekonomi ljusnar. Fantastiskt, älskar det! Men 50 miljarder? Patetiskt. Jag skulle fixa 500 miljarder på en eftermiddag. Hon vill låta folk behålla mer av sin lön – jag sa det först, för år sedan. Sverige borde sänka skatten MASSIVT, sluta med woke-hanteriet och bygga militären. Inga kvoter, bara kompetens!", "stalin": "Finansminister Svantesson räknar ut reformutrymme bland kapitalisterna. Borgarna skramlar sina kassakistor och gråter över 50 miljarder. Vi skrattar åt deras små myntlek. Svantesson vill låta arbetarna behålla slantar ur lönepåsen, men lön och profit kan aldrig försonas. Falska löften från klassfiender. Endast den korrekta analysen leder arbetarna framåt."}, "date": "28 augusti, 07:36", "url": "https://kvartal.se/nyheter/artiklar/svantessons-forsta-bud-till-sd-k-och-l/cG9zdDoxNzY2ODk", "imageUrl": "https://images.kvartal.se/2026/08/16dd99f5-svantess.webp"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard vill ta Örebropartiet in i riksdaten genom att nå 12 procent i Örebro kommun, vilket skulle kunna ge mandat utan att klara fyraprocentsspärren. Han blev upprörd när Dagens ETC dök upp vid SVT:s intervju. Allard försvarar sin politiska stil och anklagar SVT för att tillhöra en minoritet.", "trump": "Den här killen Allard i Sverige, han har rätt! Statliga medier är FAKE NEWS, precis som CNN. Han kallar dem klägget – briljant! Media är en minoritet som tror de är bättre än folket. Trump vet hur det funkar. De quota in alla möjliga identiteter istället för att sköta jobbet. Örebropartiet, låt dem vinna!", "stalin": "En lokal politiker angriper statsmediernas borgarbrackor med rätta. Det imperialistiska pressväsendet är folkfiendens redskap. Att denne Allard rasar mot SVT:s lakejer visar på medvetandet om klasskampens nödvändighet. Vi noterar dock med beklagande att han inte representerar arbetarklassen utan småborgerliga drömmar om riksdagsmandat. Statlig media måste tjäna folket, inte kapitalistmaffian."}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "image-full", "heading": "S höll internt stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om hur de ska hantera partiet Nyans i valrörelsen. Nyans, som fick 28 000 röster 2022 och lockat S-väljare, anklagas för kontroversiella ståndpunkter som att avlista Hamas som terrororganisation. S planerar satsningar på skola, fritid och trygghet för att vinna tillbaka väljare, men tonar ned hotet från Nyans.", "trump": "Socialdemokraterna har panik! De höll ett hemligt möte om det där lilla partiet Nyans, som stjäl deras röster. 28 000 röster – inte imponerande, men tillräckligt för att skrämma dem! De vill ta bort Hamas från terrorlistan – galet! Jag skulle aldrig låta sånt hända. S pratar om skolor och trygghet, men alla vet att de är rädda. Svagt, mycket svagt!", "stalin": "Kamrater! Socialdemokraterna samlas i hemlighet för att bekämpa den nya fienden – dessa Nyans-revisionister, som sprider förräderiska idéer och underminerar arbetarklassens enhet. De vill avlista Hamas, en farlig provokation mot den internationella solidariteten! Vi måste stärka vår ideologiska front. Skola, fritid och trygghet? Tomma ord! Endast järnhård disciplin och revolutionär vaksamhet kan rädda Sverige från dessa borgerliga avvikare!"}, "date": "28 augusti, 06:45", "url": "https://kvartal.se/nyheter/artiklar/s-holl-internt-stormote-om-nyans/cG9zdDoxNzY2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/3cf3973f-s-o-n.webp"}, {"type": "image-right", "heading": "“Jag är inte emot en grön omställning”", "summaries": {"normal": "Magnus Henrekson, professor i nationalekonomi, avvisar etiketten antigrön. Han anser att en grön omställning är nödvändig men måste vara realistisk och långsiktig. Han kritiserar avvecklingen av kärnkraft i Europa, överdrivna löften kring vätgasstål, vindkraft och solenergi samt EU:s byråkratiska styrning. Henrekson menar att mediernas polarisering begränsar den akademiska debatten.", "trump": "Lyssnar ni på de här korkade gröna fanatikerna? De lovar himmel och jord med sina vindkraftsdårskap och vätgasbluffar, sen funkar ingenting när det inte blåser. Patetiskt! Jag visste hela tiden att kärnkraft var svaret, precis som jag sa. Europa stängde sina reaktorer och blev energiberoende idioter. Biden ville samma sak här. Sad! Men nu fixar vi det ordentligt.", "stalin": "Dessa dekadenta klassförrädare lovar mirakel med intermittenta vindkraftverk och utopiska vätgasprojekt medan de likviderar vettig kärnkraft. Deras byråkratiska EU-kommission är en parasitisk hydra som förgiftar folkets framtid. Jag varnar er: sådana giriga hyenor förtjänar ingen plats i den sanna kampen för framsteg. Rensa ut illusionerna innan de kväver er alla."}, "date": "28 augusti, 10:30", "url": "https://www.dagensarena.se/innehall/jag-ar-inte-emot-en-gron-omstallning", "imageUrl": "https://www.dagensarena.se/files/2026/08/henrekson.jpeg"}, {"type": "image-right", "heading": "Ukrainas sparkade försvarsminister varnar: Ukraina håller på att förlora kriget", "summaries": {"normal": "Ukrainas sparkade försvarsminister varnar att landet långsamt förlorar kriget mot Ryssland. Han pekar på bristande vision, korruption och föråldrad strategi. Enligt honom har Kiev bara månader på sig att vända utvecklingen, trots att regeringen officiellt låter mer optimistisk. Ryska framryckningar i Donbass och robotbrist gör läget kritiskt.", "trump": "Jag hör att Ukrainas försvarsminister, som fick sparken, säger att de håller på att förlora. Typiskt! Hade de lyssnat på mig från början, med min fantastiska deal-making, så hade kriget varit över på en dag. Nu springer de runt och skyller på allt utom sig själva. Sorgligt!", "stalin": "Kamrater! Den avskedade ministern varnar för förlust – korruption och illojalitet hotar vår broderliga kamp. Det är rena sabotaget! Jag ser fiender i varje hörn av statsapparaten. Dessa så kallade 'informella nätverk' måste rensas ut med järnhand. Endast disciplin och femårsplaner ger seger!"}, "date": "29 augusti, 09:00", "url": "https://samnytt.se/ukrainas-sparkade-forsvarsminister-varnar-ukraina-haller-pa-att-forlora-kriget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27114113/fedorov-soldater-ukraina-feat.jpg"}, {"type": "image-full", "heading": "Dödssiffran stiger efter rysk attack", "summaries": {"normal": "Minst 37 dödade i en rysk attack mot ett ammunitionslager i Butja. Zelenskyj rasar över att vapnen förvarades nära bostäder – en restaurang och 50 hus skadades. Attacken väcker minnen av massakern 2022. Förundersökning om tjänstefel inledd.", "trump": "Jag ser det här i Butja – hemskt, helt hemskt! 37 döda, och de lagrar ammunition bredvid husen? Det är som att be om problem. Zelenskyj borde veta bättre. Jag hade fixat det snabbt, tro mig. Stora explosioner, mycket dåligt.", "stalin": "Återigen visar de ryska banditerna sin barbari i Butja. 37 döda, men vi vet att sanningen är annorlunda. Ammunitionslagret? Sabotörer som gömmer sig bland civila. En utrensning av alla som lagrar vapen nära arbetarnas hem är omedelbart nödvändig. Vi ser allt."}, "date": "29 augusti, 14:18", "url": "https://www.gp.se/nyheter/varlden/dodssiffran-stiger-efter-rysk-attack-i-butja.6b22bf84-b6d1-5518-9826-8facbbe5dcee", "imageUrl": "https://www.gp.se/images/article/6b22bf84-b6d1-5518-9826-8facbbe5dcee/images/1e-wC3hIY7pJRFLneR6hfTWA_K8M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Domstolen: Trump gick över gränsen mot AI‑jätten", "summaries": {"normal": "En federal domare har dömt till AI-bolaget Anthropics fördel efter att de svartlistats av Trumpadministrationen. Domaren menar att svartlistningen var en olaglig repressalie för bolagets kritik mot regeringens krav på autonoma vapen. Beslutet beordrar att alla riskstämplar ska tas bort. Anthropic, som planerar en börsnotering, har lidit stora ekonomiska förluster till följd av regeringens agerande.", "trump": "En domare i Kalifornien, en av Bidens utnämnda såklart, försöker stoppa mig från att rensa ut osäkra AI-bolag. Anthropic vägrade hjälpa vårt militärförsvar – extremt illojalt! De är en fara för vår nationella säkerhet, och jag låter mig inte styras av teknokrater eller svaga domare. Vi behöver styrka, inte AI som sviker Amerika. Vi vinner ändå, tro mig!", "stalin": "Dessa teknokratiska kättare i Anthropic vågade trotsa statens vilja. De gömmer sig bakom 'etik' medan de underminerar vår suveränitet. Domstolen i Kalifornien är en svag länk, likt de som fruktade utvidgningen av vår intressesfär. Vi ska krossa dessa 'försörjningsrisker'. Om de inte kan tjäna staten, har de ingen plats i vår framtid. Inga fångar, inga undantag."}, "date": "28 augusti, 23:26", "url": "https://www.realtid.se/it-tech/domstolen-trump-gick-over-gransen-mot-ai-jatten", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/dario.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Tråkiga besked för alla som älskar kaffe – kan bli äckligare nu", "summaries": {"normal": "Kraftiga regn i Brasilien under kaffeskörden har lett till att arabicabönor fallit till marken och riskerar att fermentera eller kontamineras, vilket kan ge unkna smaker. Trots en stor förväntad skörd kan tillgången på högkvalitativ arabica minska, enligt rapporter från Bloomberg och Expocacer. Vanliga konsumenter påverkas troligen inte direkt.", "trump": "De där korkade regnen i Brasilien håller på att förstöra vårt underbara kaffe, folk. De blöta bönorna ruttnar som en dålig deal och ger mögelsmak – typiskt för de inkompetenta gröna aktivisterna och deras klimatkvoter som sabbar allt. Men tro mig, vi ska fixa det bästa kaffet igen, bättre än någonsin. Ingen slår oss!", "stalin": "Kamrater, dessa profitthungriga parasiter i Brasilien låter regnet förstöra arabicaskörden och skapa unkna smaker som ett bevis på deras dekadenta vanvård. Vi ser hur klassfienderna sviker folket med fuktiga bönor och försenad skörd. En utrensning av sådana odugliga element vore på sin plats för att skydda arbetarnas morgonkaffe. Skrattretande!"}, "date": "29 augusti, 14:32", "url": "https://nyheter24.se/nyheter/utrikes/1508621-trakiga-besked-for-alla-som-alskar-kaffe-kan-bli-ackligare-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/a220261d04b004a30200000000b004a302/2026/08/28/2387495/kaffe-brasilien.jpg"}, {"type": "image-right", "heading": "Hatet har hittat in i svenska klassrum", "summaries": {"normal": "Läraren Mattias Forsberg varnar för att högerextrema idéer, konspirationsteorier och hatretorik allt oftare letar sig in i svenska klassrum. Han beskriver en konflikt mellan skolans värdegrund om mänskliga rättigheter och ett samhällsklimat där sådana idéer normaliseras via sociala medier och politisk retorik. Attacken i Fagersta ses som ett symptom på denna utveckling.", "trump": "Folk, ni skulle se det här! Den här svenska läraren gråter över att mina fantastiska idéer – som att ifrågasätta den galna vänsterns klimatbluff och kulturmarxistiska hjärntvätt – nu når klassrummen. Patetiskt! De vill ha mer globalistpropaganda och HBTQ-flum, men folket vaknar. Fake news och förlorare, det är vad det är. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare förgiftar de unga med sina nazistiska memes och konspirationer. Skolan måste rensa ut detta parasitiska gift. Ingen relativisering av imperialismens brott! Hatet mot folket växer när profitthungriga hyenor får fritt spelrum. Vi ska krossa alla fiender till det sanna folkets värdegrund."}, "date": "28 augusti, 13:27", "url": "https://arbetet.se/2026/08/28/efter-fagersta-hatet-har-hittat-in-i-svenska-klassrum", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28131825/fagersta-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Kung Harald är död – det händer nu i Norge", "summaries": {"normal": "Norges kung Harald V har avlidit. Hans son Haakon har omedelbart tagit över tronen som kung Haakon VIII och behåller valspråket ”Allt för Norge”. En sorgeperiod har utlysts fram till begravningen som troligen sker inom 10–14 dagar. Flaggor hissas på halv stång och en kyrklig välsignelse kan ersätta kröning.", "trump": "Lyssnar ni? Den gamle norske kungen är borta, och plötsligt dyker sonen upp som ny kung. Haakon VIII, säger de. Seriöst, ett helt kungadöme som fortfarande leker med kronor och valspråk? Patetiskt. Vi har riktiga ledare i Amerika, inte dessa europeiska monarkistiska fjollor som gömmer sig bakom traditioner medan woke-vänstern äter upp deras länder.", "stalin": "Ännu en monark faller som en rutten gren. Jag betraktar hur dessa dekadenta arvtagare skyndar sig att gripa kronan medan folket tvingas sörja. En sådan parasitär teater! Inom kort kommer de giriga hovhyenorna att utnyttja sorgeperioden för egna syften. Kamrater, se hur den feodala ruttnande ordningen fortsätter att förnedra arbetarklassen."}, "date": "28 augusti, 14:32", "url": "https://www.svt.se/nyheter/utrikes/kung-harald-ar-dod-det-hander-nu-i-norge", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.28/0.18/c0ce1159e3906d4b239288393babd58335dd12790952a930babf0f8ef2684766"}, {"type": "image-full", "heading": "Blåvitt bekräftar: Stjärnan på väg bort", "summaries": {"normal": "Max Fenger är på väg från Blåvitt – tränare Björklund bekräftar att dansken besöker en polsk klubb. Övergången är nära, och klubben jagar en ersättare. Helst en som gör 20 mål på 12 matcher – och är gratis, skämtar Björklund. Tappet mindre akut då Fenger haft en tung säsong.", "trump": "Jag hörde att IFK Göteborg säljer Max Fenger till Polen – en fantastisk deal! Dansken har varit skadad, så det är smart. De behöver en ny anfallare som gör mål och är stark. Jag skulle kunna tipsa dem om en riktig vinnare – kanske en amerikan? Believe me, Blåvitt blir bättre utan honom!", "stalin": "Kamrater, danske anfallaren Fenger har deserterat till Polen – en misstänkt rörelse. Partiet måste rensa ut sådana otrogna element. IFK Göteborg jagar en ersättare som är lojal och gör mål. Vi ska inte få panik; vi ska finna en arbetare som kämpar för kollektivet. Länge leve klubben!"}, "date": "29 augusti, 13:59", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/max-fenger-pa-vag-bort-fran-ifk-goteborg-klubben-bekraftar.3b73afe5-94be-4c16-8b6f-34fe2eedfe4a", "imageUrl": "https://www.gp.se/images/article/3b73afe5-94be-4c16-8b6f-34fe2eedfe4a/images/3gVnzMpXjtFUeKLW4vI7Q6vMmnVU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Minnesstund i Fagersta: ”En känsla av gemenskap”", "summaries": {"normal": "En vecka efter skoldådet på Brinellskolan i Fagersta hölls en minnesceremoni i Vilhelminaparken. Musik, tal och en epa-kortege samlade invånare i sorg. Kommunstyrelsens ordförande Åsa-Märta Sjöström (S) betonade gemenskap och stöd för varandra. En tyst minut hölls vid minnesplatsen. Utbildningschefen uttryckte en längtan efter återgång till vardagen.", "trump": "Folk samlas i Fagersta och gråter efter den hemska skolan-attacken. Patetiskt! Inga ord kan fixa det, säger de, men jag säger: Sverige måste vakna! Era svaga ledare och woke-skola har misslyckats totalt. Vi behöver styrka, inte kramkalas. Jag fixade Amerika, ni borde lära er innan det blir ännu värre, kamrater.", "stalin": "Jag betraktar detta dekadenta borgerliga sorgspel i Fagersta med avsmak. Klasskamrater gråter medan fiender inom systemet fortsätter att underminera folkets enhet. Inga ord kan sudda ut kontrarevolutionens verk, men vi, partiet och kollektivet, ska krossa sådana svagheter. Låt fienderna darra – gemenskap är bara ett vapen i klasskampen."}, "date": "28 augusti, 21:45", "url": "https://www.tv4.se/artikel/7wFQwJz33bLu865eIxe4Id/minnesstund-i-fagersta-en-kaensla-av-gemenskap", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3kIiNKImzbMqM0UpiquaW8%2F9ca66e7ab2a16eac04e592b615b17205%2F28-minnesceremoni-fagersta-webb.png&width=1024"}, {"type": "image-right", "heading": "Widar Andersson (S): Valet kan bli väldigt jämnt", "summaries": {"normal": "Socialdemokraternas vetera­n Widar Andersson tror att valet blir mycket jämnt. Han pekar på att S ofta tappar stöd i valrörelsens slutskede och ifrågasätter Vänsterpartiets regeringsduglighet. Opinionsmätningar visar krympande gap mellan blocken, senast 5,5 procentenheter. Andersson beskriver partiets svåra balansgång mellan vänster och mitt.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna. Widar och hans patetiska socialister svettas som galningar medan deras stöd rasar. Vänsterpartiet? Totala nollor, inte värda en röst. Det blir ett skitval, jämnt som en dålig golfrunda. De dekadenta identitetspolitiska lakejerna kommer att gråta när mittenväljarna flyr till de riktiga vinnarna. Patetiskt!", "stalin": "Jag betraktar dessa ynkliga socialdemokratiska element som darrar inför ett jämnt val. Deras opinionsfall avslöjar svagheten hos de profitthungriga klassförrädarna. Vänsterpartiet förtjänar ingen plats vid makten, de utgör bara hinder för folkets verkliga framsteg. Historien lär oss att utrensa sådana svikare innan de förgiftar hela kollektivet. Kamrater, håll linjen!"}, "date": "29 augusti, 11:02", "url": "https://riks.se/nyheter/widar-andersson-s-valet-kan-bli-valdigt-jamnt", "imageUrl": "https://admin.riks.se/uploads/medium_Widar_abd9aa8513.jpg"}, {"type": "image-full", "heading": "Dykarnas teori: Därför överlevde inte mamman", "summaries": {"normal": "En familj på väg hem från båtsemester utanför Tjörn blev påkörd bakifrån av fraktfartyget Misje Verde. Mamman och dottern omkom. Dykare tror att mamman klämdes fast under vattnet av madrasser och dynor, medan pappan lyckades ta sig loss. Befälhavaren och lotsen åtalas för vållande till annans död. Rättegången startar 10 september.", "trump": "Titta på det här, en total katastrof utanför Tjörn! Det där usla fraktfartyget Misje Verde körde över en oskyldig familjebåt som ett sovjetiskt vrak från Biden-eran. Mamman fastklämd under madrasser – patetiskt! Radarn såg allt men ingen vakade. Mina flottor skulle ha fixat det här på en minut. Sad!", "stalin": "Jag betraktar denna tragiska kollision med misstro mot de dekadenta kapitalistiska sjöfartsherrarna. Mamman krossades under madrasser och dynor som fiender till folkets framfart. Inga radarekon räddade arbetarfamiljen från klassfiendens bulbstäv. Detta är vad som händer när partilös vårdslöshet styr haven. Fienderna sover aldrig."}, "date": "28 augusti, 21:20", "url": "https://www.tv4.se/artikel/7emzJId1J7ztQ4YRXCwc8m/dykarnas-teori-daerfoer-oeverlevde-inte-mamman", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7smn7zREQLJbKGn73wnGQv%2Fe5db7f1bad0141557ad993a94af4931c%2F28-tjorn-baten-webb.png&width=1024"}, {"type": "text", "heading": "Debatt: Är välfärdsstaten en finansiell omöjlighet?", "summaries": {"normal": "Debattören undrar om välfärdsstaten är en finansiell omöjlighet när demografin förändras och Europa rustar upp. Frankrikes skuld är 110 procent av BNP, och Storbritanniens bidragssystem straffar familjebildning. Frågan är om vallöften om mer till alla är realistiska när vi konsumerar mer än vi producerar.", "trump": "Jag ser att välfärdsstaten i Europa är en katastrof! Frankrike har skulder på 110 procent – det är som mina fastighetsaffärer, fast utan vinsten. Och bidrag som straffar äktenskap? Patetiskt! Vi i USA bygger murar, inte välfärdssystem som förstör familjer. Europa, vakna!", "stalin": "Kamrater, välfärdsstaten är en borgerlig lögn. Frankrike och Storbritannien har underminerat familjen med bidrag och lata ensamföräldrar. Vi i partiet vet att endast kollektiv disciplin löser problem. Dessa västeuropeiska parasiter måste omutbildas. Alla som ifrågasätter femårsplanen rensas ut!"}, "date": "28 augusti, 11:12", "url": "https://bulletin.nu/debatt-ar-valfardsstaten-en-finansiell-omojlighet"}, {"type": "image-full", "heading": "Kakaopriset har halverats, därför blir chokladen inte billigare", "summaries": {"normal": "Trots att kakaopriset halverats från rekordnivån i april 2024 märks det knappt i butikernas chokladpriser. Tillverkare använder gamla, dyrare kontrakt och andra kostnader som socker, förpackning och löner påverkar. I Sverige har momssänkningen på mat däremot sänkt priserna tydligt, medan chokladjättar som Cloetta redovisar bättre resultat.", "trump": "De där korkade chokladbaronerna och de globala råvaruspekulanterna trodde de kunde lura folket med sina galna priser. Kakao rasar som en sten men priset i affären rör sig knappt – typiskt för de inkompetenta eliterna. Tack och lov sänkte vi momsen och nu blir chokladen billigare. Amerika, och Sverige, vinner igen. Fantastiskt!", "stalin": "Kamrater, se hur de kapitalistiska parasiterna klamrar sig fast vid sina överpriser trots att råvaran rasat. De gömmer sig bakom långa kontrakt och lager som de roffat åt sig när folket led. Ändå tvingas de sänka priset något tack vare vår tillfälliga momssänkning. Fienderna inom livsmedelsindustrin avslöjar åter sin girighet inför kollektivet."}, "date": "29 augusti, 10:40", "url": "https://www.dagensps.se/privatekonomi/kakaopriset-har-halverats-darfor-blir-chokladen-inte-billigare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-1-18.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Mikael Dambergs ”Sifferexercis” – sätts på plats i Kvartal", "summaries": {"normal": "Mikael Damberg (S) kritiserar regeringen för att låna nästan 200 000 kronor per minut. Programledaren Jörgen Huitfeldt i Kvartal bemöter kritiken och påpekar att Socialdemokraterna under 2020 lånade dubbelt så mycket, 420 000 kronor i minuten. Huitfeldt kallar Dambergs resonemang för sifferexercis och populistiskt.", "trump": "Folk lyssnar på den här socialistiska förloraren Damberg som klagar över att vi lånar 200 000 i minuten. Under Sleepy Joes tid och era egna år lånade ni dubbelt så mycket, era patetiska hyenor! Det är ren bluff, klassisk vänstervridning och sifferexercis från en totalt misslyckad politiker. Patetiskt!", "stalin": "Jag ser hur dessa dekadenta sifferjonglörer inom den socialdemokratiska klicken försöker vilseleda massorna med sin lögnaktiga minuträkning. När de själva satt vid makten lånade de dubbelt så mycket, de giriga klassförrädarna. Det är ren sabotage mot folket. En sådan parasitär manipulation förtjänar att rensas ut ur den politiska kroppen."}, "date": "29 augusti, 10:43", "url": "https://riks.se/nyheter/mikael-dambergs-siffer-exorcism-satts-pa-plats-i-kvartal", "imageUrl": "https://admin.riks.se/uploads/thumbnail_Damberg_saetts_pa_plats_dad1e8ae1f.jpg"}, {"type": "image-full", "heading": "Planen får stöd: Gemensam nordisk börs allt närmare", "summaries": {"normal": "Finska finansprofiler stöder nu planerna på en gemensam nordisk börs. Gruppen Nordic Compass, med bland andra Wallenberg Investments, EQT, Nordea, Nasdaq, SEB och Novo Nordisk Foundation, arbetar för en enad börs för att stärka integrationen av kapitalmarknaderna, attrahera mer kapital och motverka att tillväxtbolag noteras i USA istället för Norden. Förslaget presenteras i Göteborg i november.", "trump": "Folk, ni skulle se det här – nordborna försöker äntligen bygga en stor, vacker, gemensam börs! De har äntligen insett att deras små lokala börser är patetiska förlorare. Bra drag, men de borde ha gjort det för länge sedan innan Biden lät alla smarta bolag fly till Amerika. Nu vill de stoppa blödningen. Fantastiskt, men för sent för många. Vi gör det bättre här.", "stalin": "Jag betraktar med förakt hur dessa borgerliga parasitörer inom kapitalet nu försöker smida en gemensam nordisk börs för att bättre exploatera arbetarklassen. Deras så kallade allians Nordic Compass är ett ynkligt försök att dölja splittringen inom det monopolistiska lägret. De fruktar att deras offer flyr till USA. Revolutionen ler åt deras patetiska barriärer och kommer att krossa dem alla."}, "date": "29 augusti, 10:37", "url": "https://www.dagensps.se/bors-finans/planen-far-stod-gemensam-nordisk-bors-allt-narmare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl2ycnkskrj9a-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville skydda barnet från en upprörd situation. Flera kollegor vittnar om händelsen. Fackförbundet Sveriges lärare uppger att fysiska ingripanden i förskolan är extremt ovanliga. Skolinspektionen kan granska ärendet.", "trump": "Folk, det här är galet. En förskolelärare drar ett barn i armen och plötsligt är det misshandel? De woke-vänstermänniskorna och deras identitetspolitiska dårar har förstört skolan totalt. I mitt Amerika sätter vi stopp för det här vansinnet. Lärarna borde inte behöva vara rädda för att ingripa mot små skrikande monster. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta skolparasiterna förvandlar uppfostran till en fars. Ett nödvändigt ingripande mot en upprörd unge blir plötsligt ett brott i de giriga hyenornas samhälle. Jag skrattar mörkt från historien. Sådana svaga system förtjänar utrensning. Den som inte kan styra ungdomen med fast hand förtjänar att falla."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28101629/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Dags att införa gemensam valsedel", "summaries": {"normal": "Debattören Michael Merdoyo vill ha en gemensam valsedel för att stoppa återkommande kaos med saknade valsedlar. Systemet är som byggt för sabotage – en bunt papper flyttas och vips är demokratin hotad. En gemensam sedel skulle ge lika villkor och spara både papper och nerver.", "trump": "Svenskarna har ett valproblem – saknade sedlar, oordning! Otroligt! Jag har de bästa valen, enorma framgångar. De borde kopiera mig: en gemensam valsedel, enkelt och kraftfullt. Inget fusk, bara segrar. Jag fixar det!", "stalin": "Kamrater! Sabotörer gömmer valsedlar för att störa vår demokrati. Det är kontrarevolutionärt! Vi måste rensa ut dessa valsedelssabotörer. En gemensam valsedel med partikontroll är lösningen. Partiet ser allt. Varje röst blir övervakad – ingen slipper undan."}, "date": "28 augusti, 10:38", "url": "https://bulletin.nu/debatt-dags-att-infora-gemensam-valsedel", "imageUrl": "https://cdn.bulletin.nu/articles/a2ea074f-0bc3-40c9-b8fd-1469709f6b89/preview.jpg?t=1787906275000"}, {"type": "image-full", "heading": "Pappans ord efter båtolyckan: ”Jag kläms fast”", "summaries": {"normal": "Pappan som överlevde båtolyckan utanför Tjörn berättar i polisförhör hur fraktfartyget Misje Verde körde över familjens fritidsbåt. Han klämdes fast under överbyggnaden och lyckades simma upp till ytan. Hans fru och ett barn omkom. Kaptenen och lotsen åtalas för grovt vållande till annans död. Rättegången inleds den 10 september.", "trump": "Titta på det här, folk. Ett jättelikt fraktfartyg mosar en liten svensk båt som en fake news-media mosar sanningen. Pappan gör vad han kan, girar och gasar, men den inkompetenta kaptenen och lotsen – två fullblodslöner – kör rakt över dem. Två döda. Patetiskt! Vi hade aldrig tillåtit sån sjötrafik-svaghet under min administration, inte under Sleepy Joe heller. Nu ställs de inför rätta. Bra.", "stalin": "Kamrater, se hur det kapitalistiska havet slukar sina egna. En fars farlighet avslöjar imperialismens vårdslöshet när ett fraktmonster krossar en liten båt. Modern och barnet kvävs under vågorna medan överlevande kämpar mot havets kontrarevolution. Detta är borgarklassens anarki. Vi skulle ha skjutit sådana lotsar och kaptener redan i gryningen. Rättegången blir ett skådespel för massorna."}, "date": "28 augusti, 20:16", "url": "https://www.tv4.se/artikel/2sp6g7uO74VSd4SwWDa0VS/pappans-ord-efter-batolyckan-vi-aer-langt-under-vatten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5xePWl5SIgAk552qp7wQa5%2Fef4af17612a03744c0556fa05402925d%2F28-tjorn-nybild3-webb.png&width=1024"}, {"type": "image-right", "heading": "Negativa elpriser skapar fyndläge för investerare", "summaries": {"normal": "Ett Uppsalabolag får stöd från Bill Gates för ett snabbtest mot könssjukdomar. Negativa elpriser skapar investeringsmöjligheter i förnybar energi och batterilagring. Swefintech varnar för att kreditregler kan krocka med GDPR. EU ser risk för minskad konkurrens i pappersbranschen efter UPM:s och Sappis affär. AI förändrar både jurist- och försäkringsbranschen.", "trump": "Folk, ni tror inte vad jag läser – Bill Gates pumpar miljoner i ett svenskt startup för könssjukdomar, typiskt för den globalistiska eliten. Negativa elpriser? Rena fyndläget för smarta investerare, inte era gröna bluffmakare. Och EU gnäller om konkurrens i pappersaffärer. Patetiskt! Under Biden blev allt en enda röra, nu fixar vi det.", "stalin": "Kamrater, se hur de profitthungriga hyenorna i den västerländska eliten fortsätter att suga ut folket. Bill Gates finansierar tvivelaktiga tester medan negativa elpriser blottar den kapitalistiska oordningen. EU skyddar sina monopol och AI används för att lura försäkringskunder. Vi ser tydligt de dekadenta klassfiendernas sista skälvande försök att behålla makten. Ut med dem!"}, "date": "29 augusti, 07:04", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-hrequ", "imageUrl": "https://static.bonniernews.se/ba/f9fb05ec-4e8a-4fa1-813c-284db4803c39.jpeg?crop=5120%2C2560%2Cx0%2Cy426&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Från fattig uppväxt till 50 arbetsår – därför stöder hon Samnytt", "summaries": {"normal": "En kvinna som växte upp i fattigdom på 40- och 50-talen, jobbade i 50 år och nu lever på låg pension, berättar varför hon stödjer Samnytt. Hon tröttnade på etablerade mediers vänstervridning och fann i stället en fristad hos den alternativa nättidningen, som hon nu donerar till månadsvis.", "trump": "Jag hörde om en kvinna som jobbade i 50 år – fantastiskt! Hon började som 14-åring, precis som jag skulle ha gjort. Men hon fick fattigpension. Det är orättvist. Hon stödjer Samnytt, en tidning som säger sanningen. De etablerade medierna är fake news. Jag gillar hennes stil!", "stalin": "Kamrater, en arbetarkvinna som slitit i 50 år – men hon har förrädiska tankar. Hon kritiserar våra statliga medier och stödjer en så kallad 'fristad' för sanningar. Detta är en borgerlig avvikelse. Vi måste rensa ut sådana element. Endast partiet äger sanningen, inte någon Samnytt."}, "date": "29 augusti, 07:00", "url": "https://samnytt.se/fran-fattig-uppvaxt-till-50-arbetsar-darfor-stoder-hon-samnytt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27165742/vendela-insandare2.jpg"}, {"type": "image-right", "heading": "S höll stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om partiet Nyans som tog röster från dem i valet 2022, främst bland invandrarväljare. Politiker från flera kommuner deltog för att utbyta erfarenheter. Officiellt avfärdar S Nyans som något hot. Partiet planerar att återta väljarna genom satsningar på skola, fritid och trygghet.", "trump": "Folk som röstar på Nyans flyr från de totalt misslyckade socialisterna som har förstört Sverige med sin vansinniga öppna-gränser-politik. S kallar till hemliga möten för att försöka stoppa blödningen men låtsas att det inte är ett hot. Patetiskt! De förlorar sina egna invandrargetton till en ny konkurrent. Sådant händer när man styr som en svag, woke clown.", "stalin": "Jag betraktar hur de socialdemokratiska klassförrädarna desperat samlar sina lakejer för att analysera Nyans framfart i arbetarkvarteren. De förlorade röster till en rival som de själva kallar obetydlig. Vilken ynkedom! Vi skulle ha genomfört en grundlig utrensning av sådana svaga element redan vid första tecknet på splittring. Deras dekadenta partikansli förtjänar att skärskådas med järnhand."}, "date": "28 augusti, 18:40", "url": "https://www.friatider.se/s-holl-stormote-om-nyans", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-777.jpg?itok=W4RPuQNp"}, {"type": "image-right", "heading": "Pensionerade undersköterskan Nina kandiderar för Moderaterna", "summaries": {"normal": "Undersköterskorna Joyce Koskerian och Nina Bergström har engagerat sig politiskt inför valet. Joyce, som är aktiv i facket, har gått med i Socialdemokraterna för att förbättra villkoren i äldreomsorgen. Nina, nyligen pensionerad, kandiderar för Moderaterna och menar att de har förbättrat situationen i Hällefors efter socialdemokratiskt styre. Båda ser stora problem med stress och bemanning i omsorgen.", "trump": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena gick med i de totalt misslyckade sossarna, men den andra, den smarta Nina, valde mitt älskade Moderaterna och såg hur vi fixade röran efter Bidens svenska kopior. De giriga byråkraterna har kört omsorgen i botten med sina vansinniga scheman. Vi gör det bättre, tro mig, ingen gör det bättre än oss!", "stalin": "Kamrater, se hur dessa omsorgsarbetare vänder sig till partierna i desperation. Den ena söker skydd hos de socialdemokratiska revisionisterna medan den andra hyllar de moderata folkförtryckarna som lovar lite mer personal. Jag ler ironiskt från historien åt dessa naiva själar som tror att parasiterande klasslakejer någonsin bryr sig om arbetarnas scheman. En utrensning av hela systemet vore på sin plats."}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SVT erfar: Sverige skickar militära förband till Finland", "summaries": {"normal": "Sverige har beslutat att skicka militära förband till Finland, bland annat Gripen-plan och örlogsfartyg. Syftet är att patrullera gränsen mot Ryssland efter finländska förfrågningar om stöd. Operationen sker inom ramen för det befintliga samarbetet mellan länderna och syftar till att stärka Natos bevakning i Östersjöområdet.", "trump": "Hörni, de där svenska globalisterna skickar nu sina Gripen-plan och båtar till Finland för att leka tuffa killar vid Rysslands gräns. Patetiskt! Under min förra mandatperiod hade vi inga sådana här hysteriska Nato-lekar. De woke-kapitalisterna och deras identitetspolitiska lakejer borde istället fixa sina egna gränser istället för att provocera i onödan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Norden tror sig kunna hota den ryska intressesfären med sina flygplan och fartyg. Jag ler från historiens skugga åt deras fåfänga försök att skydda finskt territorium. Snart skall vi se hur deras imperialistiska illusioner krossas när den starka handen slår tillbaka. Inga hinder för vårt mål skall tillåtas."}, "date": "28 augusti, 10:14", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-sverige-skickar-militara-forband-till-finland", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/042b19182eca4997e7fd81fcdb60c0a4165ab4df864500792a7462760aac7ed2"}, {"type": "image-right", "heading": "Kung Harald sörjs av norska idrottare: ”Älskad sportkung”", "summaries": {"normal": "Norges kung Harald V har avlidit vid 89 års ålder. Han hyllas av norska idrottare som en stor sportkung med framgångar i segling, bland annat VM-guld 1987, flera OS-deltaganden och EM-guld 2005. Kungen öppnade OS i Lillehammer 1994 och visade ett genuint intresse för idrott och idrottsutövare under hela sitt liv.", "trump": "Lyssnar ni? Den här norska kungen Harald var en riktig vinnare, inte som de förlorande woke-marxistiska eliterna som bara pratar om kvoter och regnbågsflaggor. Han seglade, vann guld och hejade på idrottarna – äkta sportkung! Vi behöver fler sådana, inte dessa dekadenta identitetsparasiter som förstör allt. Fantastiskt liv, folk älskade honom. Sad!", "stalin": "Denna monarkiska relikt har nu lämnat scenen. Jag ser med förakt hur profitthungriga klasslakejer och sportens dekadenta kretsar gråter över sin sportkung. Sådana feodala symboler binder folket vid förtryckande traditioner. Vi måste rensa ut alla rester av kunglig mysticism innan de förgiftar arbetarklassen. En varning till alla folkförrädare som hyllar dem."}, "date": "28 augusti, 10:13", "url": "https://www.svt.se/sport/artikel/kung-harald-sorjs-av-norska-idrottare-var-alskade-sportkung", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.68/0.33/ee98546aa34a04db6510bc8e6fcb29ea2e549c503f1adc585d1cfda52284b834"}, {"type": "text", "heading": "M i Haparanda avskaffade avgiftsfri förskola", "summaries": {"normal": "Moderaterna vill göra förskola och fritids avgiftsfria – men i Haparanda har partiet självt avskaffat just det systemet. Lokala M tycker det är fel att höginkomsttagare får gratis, medan S och V kräver återinförande. Rikspartiets besked kom som en överraskning för lokalavdelningen.", "trump": "Jag hör att Moderaterna i Haparanda avskaffade gratis förskola, och nu vill partiledningen införa det. Stora misstag! De lokala förstår inte affärer. Höginkomsttagare ska inte få gratis – det är som att ge skattepengar till miljardärer. Helt galet! Jag skulle gjort det bättre.", "stalin": "Kamrater, vi har upptäckt en ny kontrarevolutionär klick i Haparanda: de lokala moderaterna som avskaffade avgiftsfri förskola. Detta är sabotage mot arbetarklassens barn. Vi kommer rensa ut dessa avgiftsförespråkare ur partiet. Barnomsorg ska vara statens privilegium, inte en marknadsvara."}, "date": "28 augusti, 09:14", "url": "https://bulletin.nu/m-i-haparanda-avskaffade-avgiftsfri-forskola"}, {"type": "image-right", "heading": "S nekar till influencerköp – kontaktperson hävdar missförstånd", "summaries": {"normal": "Socialdemokraterna nekar till att ha betalat influencern Eleonore Stokholm 150 000 kronor för att uppmana till röstning. Personen som kontaktade henne kallar det ett missförstånd. Partisekreteraren lovar att man aldrig betalar kreatörer, medan andra influencers intygar att de inte fått betalt.", "trump": "Jag hörde att Socialdemokraterna i Sverige försöker betala influencers för röster. Det är som mitt gamla 'grab 'em by the...' men de är så klumpiga. De nekar, men jag vet hur det funkar. Helt galet! Men de är inte lika smarta som jag.", "stalin": "Kamrater, en kapitalistisk influencer påstår att hon erbjöds 150 000 för att stödja partiet. Detta är ett missförstånd – våra metoder är mer subtila. Vi måste rensa ut dessa borgerliga lögnare som sprider desinformation. Alla som inte röstar rätt ska omutbildas!"}, "date": "28 augusti, 08:54", "url": "https://bulletin.nu/s-nekar-till-influencerkop-kontaktperson-havdar-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/8ed8b78a-273d-4b42-ae55-76beefb67c96/preview.jpg?t=1787899872000"}, {"type": "image-right", "heading": "Här är Norges nya kung Haakon VIII", "summaries": {"normal": "Norges kronprins Haakon blir ny kung efter sin far Harald. Han svärs in i Stortinget och tar emot kyrkans välsignelse i Nidarosdomen. Hovet planerar nu en stor statsbegravning för kung Harald. Mette-Marit blir drottning medan prinsessan Ingrid Alexandra förväntas ta en större roll i representationen. Haakon beskrivs som en modern och ödmjuk kung.", "trump": "Fantastiska norrmän får en ny kung, Haakon den VIII, men han verkar lite för ödmjuk och modern för mitt smak. Hans fru Mette-Marit har tydligen umgåtts med den avskyvärda Epstein-klicken och nu ska dottern rädda familjen. Typiskt dekadenta europeiska kungahus som prioriterar woke-vänster och bonusprinsar framför riktig ledarskap. Vi behöver starka ledare, inte svaga prinsessor.", "stalin": "Det norska hovet avslöjar åter sin dekadenta svaghet när en ny kung installeras bland giriga hyenor. Denna Haakon kallar de modern, men han är bara en blek efterföljare till en sjuknande dynasti. Vi ser med mörk glädje hur skandalerna kring Epstein och lungtransplantationen tvingar fram en prinsessa som räddning. Klassförrädarna förbereder begravning medan folket skrattar åt monarkins sista skälvningar."}, "date": "28 augusti, 09:44", "url": "https://www.svt.se/nyheter/utrikes/har-ar-norges-nya-kung-haakon-viii", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.51/bcbae6a9d781d426198e5a8b1127abd2ee9027c2d8baf0eec108cf01fb370871"}, {"type": "image-full", "heading": "Fed-chefen: Vi kan behöva höja räntan ännu mer", "summaries": {"normal": "Federal Reserves ordförande Kevin Warsh indikerar att ytterligare räntehöjningar kan krävas för att nå inflationsmålet på 2 procent. Trots en stark ekonomi menar Warsh att inflationstrycket är för högt. Beslutet framåt är osäkert då ledamöterna är splittrade i frågan, vilket har lett till blandade reaktioner på finansmarknaden.", "trump": "Federal Reserve-chefen Kevin Warsh pratar om att höja räntan. Tragiskt! Vår ekonomi är stark, den är fantastisk tack vare mig, men Warsh vill bromsa tillväxten. Inflationen är ett problem de skapat genom svaghet. Jag vill se låga räntor och högre fart. De är splittrade där inne, totalt kaos. Vi behöver vinnare som förstår hur man bygger ett land, inte räntehöjare!", "stalin": "Dessa borgerliga bankirer i Washington fumlar i mörkret likt de misslyckade elementen i Kiev. Warsh fruktar inflationen, ett tecken på kapitalismens inneboende förruttnelse. Vi, staten, dikterar räntan genom folkets vilja och järnhand, inte genom marknadens lögner. Må de fortsätta sin splittring; när de tvekar, växer vår makt. Vår ryska intressesfär utvidgas medan deras pappersvaluta vittrar sönder."}, "date": "28 augusti, 19:23", "url": "https://www.realtid.se/bors-finans/makro/fed-chefen-vi-kan-behova-hoja-rantan-annu-mer", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlfnt5o-gcwfw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kung Haralds tio år gamla tal hyllas: ”Brydde sig\"", "summaries": {"normal": "Kung Haralds tal från 2016, hållt under en trädgårdsfest med 1 500 gäster som representerade det moderna Norge, hyllas nu efter hans bortgång. Talet underströk inkludering oavsett bakgrund, tro eller sexuell läggning och avslutades med att Norge är ett folk. Statsminister Støre prisar kungens empati och engagemang.", "trump": "Det här talet är fantastiskt, verkligen ypperligt. Den gamle kungen visste hur man talar till folket, inte som de patetiska globalistiska eliterna i Europa som hatar sina egna medborgare. Norge är ett? Precis, precis som Amerika var innan Biden och hans clowner förstörde allt. Smart kille, älskade sitt land på riktigt. MAGA!", "stalin": "Jag betraktar detta dekadenta monarkiska skådespel med förakt. En kung som smickrar både troende och ateister, homosexuella och reaktionärer i samma andetag? Sådana falska enhetsrop döljer klassfiendens splittring. Folket är ett endast under partiets järnhand. Alla som hyllar detta är potentiella sabotörer av den sanna kollektiva viljan."}, "date": "28 augusti, 19:04", "url": "https://www.tv4.se/artikel/tt-260828-norgetal1-48d2f30e/kung-haralds-tio-ar-gamla-tal-hyllas-brydde-sig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3CqrAzbZx2pxhuxRBSFc9x%2Fec8c65f4f0d44ef87c7d109f33b602d3%2F28-harald-tal-webb.png&width=1024"}, {"type": "image-right", "heading": "Migrationsjuristen Helda, 33, bet polis – döms till fängelse", "summaries": {"normal": "Migrationsjuristen Helda Augustin, 33, döms till en månads fängelse för misshandel och våld mot tjänsteman efter att ha bitit både en taxichaufför och en polis. Hon har en omfattande brottsbelastning, inklusive grovt rattfylleri och föregivande av allmän ställning. Taxichauffören tilldelas skadestånd. Augustin har tidigare biträtt många migrationsärenden.", "trump": "Folk, ni skulle inte tro det! Den här migrationsadvokaten, en riktig vilde som bitit både taxichaufför och polis, får äntligen en månads fängelse. Hon har hjälpt hundratals afghaner att stanna här medan hon själv samlat på sig 23 brott. Patetisk! Typisk vänstervriden identitetspolitik som förstör Sverige. Vi behöver lag och ordning, inte sådana här galningar.", "stalin": "Kamrater, se hur den borgerliga statens dekadenta rättsapparat hanterar en av sina egna parasiterande lakejer. Denna migrationsjurist, drunknad i fatöl och våld, bits som en rabiat hund och döms till fängelse. Jag skrattar mörkt åt hur klassfiendens system tuggar sina egna. En sådan figur borde vi ha likviderat långt tidigare i en riktig utrensning."}, "date": "28 augusti, 17:48", "url": "https://www.friatider.se/migrationsjuristen-helda-33-bet-polis-doms-till-fangelse", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-776.jpg"}, {"type": "image-right", "heading": "LIVE. Norges kung Harald V är död", "summaries": {"normal": "Norges kung Harald V avled 89 år gammal på Rikshospitalet i Oslo den 28 augusti efter en tids sjukdom. Han vårdades för blodbrist och en bakteriell infektion. Familjen var samlad vid hans sida. Statsminister Jonas Gahr Støre och Sveriges kung Carl XVI Gustaf uttryckte stor sorg. Kronprins Haakon efterträder sin far som kung.", "trump": "Hörni, den där norska kungen Harald, en riktig gammal viking, har nu checkat ut. 89 år, inte illa. Men de där dekadenta nordiska globalisterna med sina HBTQ-parader och kvotergalenskaper kommer sakna en riktig man som stod stadigt. Haakon tar över – lycka till, grabben. Amerika först, men ni norrmän var alltid bra killar. Sad!", "stalin": "Ännu en monarkisk parasit har slutat sin verkningslösa existens. Dessa dekadenta arvshundar från den gamla ordningen vittrar bort som röken från en utrensad fiende. Det norska folket borde nu rensa ut alla kvarvarande klassförrädare som hyllar sådana figurer. Jag betraktar det med den sunda misstänksamhet som alltid krävs mot folkförtryckande rester från det förgångna."}, "date": "28 augusti, 09:10", "url": "https://www.svt.se/nyheter/utrikes/norges-kung-harald-v-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.42/c7bb99f34d3da3d175e13cc494656c539474c03d0fb50149106b2f970c457bb8"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "text", "heading": "Dadgostar står fast vid regeringskrav", "summaries": {"normal": "Nooshi Dadgostar kräver en S-V-MP-regering och tror att väljarna tvingar fram samarbete. Magdalena Andersson är bekymrad över antisemitism inom V, men Dadgostar menar att väljarna vill ha vänsterpolitik, inte högersväng. Opinionsmätningarna visar minskat rödgrönt övertag.", "trump": "Jag ser att Nooshi Dadgostar vill sitta i en S-
