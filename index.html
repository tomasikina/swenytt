fiendska makter. Vi har gripit honom och kommer att straffa honom hårt. Kommunen har agerat, men det är för sent. Vi måste utvidga våra register och kontroller, som Putin gör, för att skydda våra äldre."}, "date": "7 augusti, 10:04", "url": "https://samnytt.se/aldreomsorgsanstalld-anhallen-for-valdtakt-och-grova-sexuella-overgrepp-under-flera-ars-tid", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07072623/artikelhuvudbild-1-164.jpg"}, {"type": "image-right", "heading": "V-ledamot hyllade terrordömd – ”Har inget i regeringen att göra”", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Ilona Szatmári Waldau har hyllat en terrordömd person på sociala medier, vilket Expressen avslöjade. Partiet förklarar det med bristande faktakoll efter uppgifter från palestinska riksförbundet. Politiska skribenter Heidi Avellan och Sakine Madon kritiserar V för upprepade misstag och menar att partiet saknar regeringsduglighet. Leonidas Aretakis ser det som ett tecken på partiets förflyttning mot mitten.", "trump": "Folk, ni måste se det här! Den här galna vänsterkvinnan Waldau hyllar terrorister och Vänsterpartiet har noll koll. Gång på gång samma korkade saker – precis som Biden-administrationen! De fixar inte ens sina egna galningar, hur ska de sitta i regering? Totalt kaos. Fake news-medier attackerar de som granskar dem. Patetiskt. Sverige behöver riktiga ledare, inte dessa identitetspolitiska nollor.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den dekadenta borgarklassen inom Vänsterpartiet blottar sin svaghet. Jag ser hur de misslyckas med att rensa ut folkfiender och imperialisternas nyttiga idioter. En ledare som inte dubbelkollar uppgifter förtjänar utrensning ur kollektivet. Deras halvhjärtade mittenrörelse mot klassfiendens boning är en fars. Partiet måste återupprätta järndisciplin eller likvideras från historien."}, "date": "7 augusti, 09:24", "url": "https://www.tv4.se/artikel/2sPwXsDV8c5KTsIgk8m6SW/v-ledamot-hyllade-terrordoemd-har-ingenting-i-regeringen-att-goera", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FjH480fUvJj7R3J655VxXO%2F6b318abbc23118dfa9a04cfb3e2a0086%2F07kolumnistnooshiSAJT.jpg&width=120"}, {"type": "image-right", "heading": "Replik: I Salanders krig mot Israel är dess första offer sanningen", "summaries": {"normal": "Kristofer Åberg replikerar på Pär Salanders debattinlägg och anklagar honom för att sprida falska citat för att utmåla Israel som grundat i syfte att etniskt rensa palestinierna. Åberg pekar på att befolkningen i området ökat kraftigt sedan staten bildades och att flera av Salanders citat är fabricerade eller tagna ur sitt sammanhang, bland annat från antisemitiska källor. Han ifrågasätter om Salander medvetet sprider desinformation för att polarisera.", "trump": "Det här är en total skandal. Den där Salander sprider lögner och falska citat om Israel, precis som de fega fakemedia gör mot mig. Han försöker måla ut dem som monsters, men befolkningen har exploderat – det är den sämsta etniska rensning i historien, folk! Israel gör ett fantastiskt jobb mot Hamas, och Salander är bara en annan galning som hatar framgångsrika länder. Patetiskt!", "stalin": "Kamrater, denna Salander är en farlig opportunist och en objektiv agent för de sionistiska kapitalisterna. Med sina förfalskade citat försöker han demonisera det heroiska Israel som kämpar mot reaktionära banditer. Vi ser genom hans paranoia! Han är en lögnens lakej som förtjänar ideologisk utrensning ur den offentliga sfären. Låt oss skratta åt hans patetiska försök att vilseleda arbetarklassen medan vi fortsätter den stora kampen mot alla fiender till folket."}, "date": "6 augusti, 12:48", "url": "https://www.dagensarena.se/opinion/replik-salanders-krig-mot-israel-ar-dess-forsta-offer-sanningen", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-13.jpg"}, {"type": "image-right", "heading": "Så upptäcker livräddarna vem som är i fara", "summaries": {"normal": "Emmie Andersson och Louise Harmsund arbetar som livräddare på stränderna i Ängelholm. De bevakar vattnet från torn, scannar efter tecken på fara och betonar att drunkningar ofta sker tyst. Deras närvaro skapar trygghet, de informerar om strömmar och brännmaneter samt gör förebyggande arbete. För att bli livräddare krävs simtest och 120 timmars intensivutbildning. Säsongen är snart över och båda återgår till studier.", "trump": "Folk drunknar tyst, kan ni tro det? Inget plaskande, bara tystnad. Men mina vänner, de här tjejerna i Ängelholm är fantastiska, de är där uppe i tornen och ser allt. Utan dem hade det varit en katastrof, tro mig. De hoppar i och räddar folk från strömmarna, precis som jag skulle ha gjort. Bästa livräddarna, de gör ett otroligt jobb. Ingen gör det bättre än dem, verkligen.", "stalin": "Kamrater, jag ser hur dessa proletära simmare i Ängelholm vakar över folkets vatten mot de osynliga drunkningarnas sabotage. Vi har byggt torn och flaggor för att krossa havets kontrarevolutionära strömmar. Borgarbrackornas lata badande element måste övervakas noga. Vår utbildning likviderar svaghet med 120 timmars stålträning. Den som inte simmar för kollektivet drunknar i historien. Härligt!"}, "date": "6 augusti, 14:43", "url": "https://arbetet.se/2026/08/06/livraddarnas-knep-sa-upptacker-de-vem-som-ar-i-fara", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06113001/aTv5jOzu_Nk-IMG_5250.jpeg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Yüksels plan: Kebab på moskén med Åkesson", "summaries": {"normal": "Mikail Yüksel, partiledare för Nyans, föreslår i en poddintervju att han som integrationsminister skulle besöka både moskéer och Sverigedemokraternas lokala föreningar. Han vill ta med Jimmie Åkesson på moskébesök följt av kebabmiddag för att minska motsättningarna mellan muslimer och SD-väljare. Yüksel betonar att Sverige måste acceptera fler muslimer och samtala med dem, samtidigt som han vill utvisa kriminella icke-medborgare.", "trump": "Folk, ni måste höra den här killen Yüksel. Han vill ta Jimmie till moskén och sedan äta kebab för att skapa fred. Det är så patetiskt. Kebab-diplomati? Vi har byggt murar och stoppat invasionen, men han tror att en tallrik kebab fixar allt. Patetiskt. Han låter som en vänsterextremist som dansar Kumbaya medan landet fylls på. Sad!", "stalin": "Kamrater, denna Yüksel vill samla borgarbrackornas rasande SD-horder och de troende vid samma kebabfat i moskén. Vilken naiv kontrarevolutionär fantasi! Vi ska inte vänja oss vid invasionen utan rensa ut de splittrande elementen som gömmer sig bakom taqqiya och falsk liberalism. En kebabmiddag löser ingenting när folkfienderna lurar bakom varje minaret. Ut med dem alla."}, "date": "6 augusti, 12:55", "url": "https://riks.se/nyheter/y-ksels-plan-kebab-pa-mosk-n-med-akesson", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_29_b8cd42c8c1.jpg"}, {"type": "text", "heading": "Bostadsministern om hyresförhandlingarna: ”Följer utvecklingen noga”", "summaries": {"normal": "Hyresförhandlingarna mellan Fastighetsägarna och Hyresgästföreningen kantas för fjärde året i rad av konflikt och strandar ofta. Antalet ärenden till skiljeman hos hyresnämnden har ökat kraftigt, från 1 464 år 2023 till 4 852 år 2025. Skiljeman ger i nio av tio fall högre hyreshöjningar. Fastighetsägarna kräver lagändringar medan bostadsminister Andreas Carlson anser att det är för tidigt att bedöma behovet. Båda parter har ett gemensamt ansvar för systemets legitimitet.", "trump": "Det här hyressystemet är ett totalt fiasko, folk. Förhandlarna strular till allt, de kan inte ens komma överens om en hyra utan att springa till någon skiljeman. Och den där ministern Carlson säger att det är för tidigt att göra något? Patetiskt! De behöver stora, vackra reformer nu, inte mer av det här svaga spelet. Annars kommer hyresgästerna att bli utpressade av de dåliga förhandlarna. Jag skulle fixa det på en vecka.", "stalin": "Kamrater, dessa borgarbrackor inom Fastighetsägarna saboterar systematiskt folkets hyresförhandlingar genom att medvetet stranda dem och kalla in sina lakejer i skiljemanströjor. Vi ser den parasitiska kapitalistiska konspirationen klart. Jag, som ledare för det kollektiva intresset, betraktar ministerns fega tvekan som en farlig brist på bolsjevikisk beslutsamhet. Kanske är det dags för en grundlig utrensning av dessa hyresfejder och deras dolda fiender inom byråkratin. Det blir underhållande att se dem darra."}, "date": "6 augusti, 11:55", "url": "https://www.dagensarena.se/innehall/bostadsministern-om-hyresforhandlingarna-foljer-utvecklingen-noga"}, {"type": "image-right", "heading": "Källor: USA:s robotlager sinar – Trump hotar \"förrädarna\"", "summaries": {"normal": "President Donald Trump förnekar rapporter om att USA:s vapenlager sinar till följd av kriget i Iran. Han hävdar att USA har enorma mängder krigsmateriel och hotar dem som läcker information med långa fängelsestraff. Trump ska enligt The Washington Post ha konfronterat försvarsminister Pete Hegseth under ett möte på Camp David. Vita huset avfärdar uppgifterna som falska.", "trump": "Folk, det är en skandal! Vi har enorma mängder krigsmateriel, bättre än någonsin, särskilt vissa typer som är helt fantastiska. De falska medierna och de förrädiska läckarna som påstår motsatsen borde låsas in länge. De hatar oss och sprider lögner. Hegseth är lojal, det här mötet på Camp David hände aldrig. Fake news!", "stalin": "Kamrater, jag ser tydligt hur borgarbrackorna inom den imperialistiska pressen och deras dekadenta läckare försöker undergräva folkets försvarskraft med sina lögner om sinande arsenaler. Vi har oändliga förråd av segerbringande vapen. De som viskar om svaghet ska rensas ut med största energi och hamna i de eviga lägren. Paranoiska förrädare och deras kapitalistiska marionetter Hegseth må darra. Ut med dem alla!"}, "date": "6 augusti, 10:56", "url": "https://www.di.se/nyheter/trump-usa-har-enorma-mangder-krigsmateriel", "imageUrl": "https://static.bonniernews.se/ba/16beb29f-3846-4366-877a-6fbf98f09060.jpg?crop=5632%2C2816%2Cx0%2Cy469&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Yubico rusar tvåsiffrigt på oregelbunden börs", "summaries": {"normal": "På Stockholmsbörsen noterades en svag uppgång i OMXS30. Yubico steg 28,3 procent trots lägre omsättning, medan ABB föll 1,7 procent. Medicover steg 8,1 procent efter att ha säljt sin indiska verksamhet för 1,2 miljarder euro. Bland sektorerna steg energi, medan fastigheter föll.", "trump": "Jag har sett fantastiska siffror på Stockholmsbörsen! Yubico rusar – det är enorm framgång, trots att de säger att omsättningen sjönk. Saab och SCA stiger, precis som jag förutsåg. ABB faller, de är svaga. Medicover gör en bra affär med Indien, det kommer att bli enormt framgångsrikt. Allt är enormt!", "stalin": "I den svenska börskogen observerar vi en strategisk balans. Yubico visar sin lojalitet genom en kraftig uppgång, vilket bekräftar partiets ekonomiska linje. ABB, en feg tillhållare, sjunker. Medicover, under vår vägledning, avyttrar sin indiska verksamhet för att stärka statens resurser. Alla skall tjäna det revolutionära statet."}, "date": "6 augusti, 09:40", "url": "https://www.affarsvarlden.se/artikel/yubico-rusar-tvasiffrigt-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/5CNFC-Lifestyle--400x266.jpg"}, {"type": "image-right", "heading": "Kvinnor vill se välfärd istället för vapen", "summaries": {"normal": "Artikeln argumenterar för att kvinnor i högre utsträckning än män röstar vänster i riksdagsvalet, något som bekräftas av opinionsmätningar. Författaren, Vera Peterson, menar att kvinnors prioriteringar ligger inom välfärd, sjukvård, skola, miljö och jämställdhet snarare än militär upprustning. Hon uppmanar kvinnor att samlas kring parollen ”Välfärd istället för vapen” och kritiserar att militär satsning inte prioriteras i valkompasser.", "trump": "Folk, det är en total katastrof. De här vänstertjejerna röstar som galningar för mer välfärd och mindre försvar, precis som Sleepy Joe gjorde. Kvinnor vill ha gratis grejer istället för starka militärer – patetiskt! Vi behöver inga woke-kvoter och identitetspolitik, vi behöver Amerika först, eller Sverige först, vad fan det nu heter. De rödgröna kommer att förstöra landet med sina svaga idéer. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens kvinnor låtsas värna välfärden medan de i hemlighet undergräver folkets kollektiva styrka. Denna borgarbracka med sin paroll om välfärd istället för vapen är en farlig folkfiende som vill försvaga statens försvar mot imperialisternas hot. Vi måste rensa ut dessa dekadenta element som sätter privata önskemål före partiets och arbetarklassens järnhårda linje. Inga kompromisser!"}, "date": "5 augusti, 12:44", "url": "https://proletaren.se/artikel/kvinnor-vill-se-valfard-istallet-for-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/lk_vera-768x432.jpg"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga f     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
