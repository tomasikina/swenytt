re del av det svenska folkets mineraler har mjukats undan. De talar nu om 'konkurrenskraft' och 'kostnader' - typiskt borgerligt jargong! Kommunernas giriga krav på lokal ersättning splittrar det socialistiska arbetet. Vi måste åter ta kontrollen över det folkets tillgångar och eliminera dessa revisionistiska element!"}, "date": "8 augusti, 14:00", "url": "https://samnytt.se/sd-tonar-ned-tidigare-krav-pa-kraftigt-hojd-mineralavgift-orealistiskt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06101346/palmqvist-gruvnaring.jpg"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. En vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter, bland annat i våras och under Israels ockupation 1982–2000. Flera historiska platser i regionen har drabbats.", "trump": "Fantastiskt, de tar med det här gamla libanesiska slottet på Unescos lista och en vecka senare bombar Israel sönder det. Rena cirkusen! Biden lät allt gå åt helvete, men nu är jag tillbaka och fixar saker. Hizbollah-tunnlar, säger de? Typiskt. Israel gör vad de måste, men det här är inte sättet att vinna vänner. Vi behöver smarta dealar, inte mer förstörda ruiner.", "stalin": "Kamrater, jag ser hur de imperialistiska blodsugarna från Israel ockuperar och spränger det libanesiska folkets historiska fästning bara dagar efter att den erkänts som världsarv. Detta är klassfiendens vedervärdiga sabotage mot mänsklighetens gemensamma kulturarv. Vi ska rensa ut dessa exploaterande byfånar och deras bombplan. Paranoian är befogad – fienden lurar överallt och hatar allt som är stort och evigt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-right", "heading": "Kvinnlig underhållare började brinna på medeltidsveckan", "summaries": {"normal": "En kvinnlig underhållare i 30-årsåldern skadades allvarligt under Medeltidsveckan i Visby när hennes kjol fattade eld under ett planerat uppträdande vid Nordergravar. Branden spred sig snabbt. En man ingrep och fick lindriga skador. Kvinnan flögs till Akademiska sjukhuset i Uppsala för vård på brännskadeenheten. Händelsen kan utredas som arbetsplatsolycka.", "trump": "Folk, det här är en total katastrof. En kvinna i Visby tänder eld på sig själv mitt i en medeltidsshow – och ingen vet vad som händer? Typiskt. De borde ha haft de bästa experterna, de bästa säkerhetsåtgärderna. Nu ligger hon i Uppsala och allt är kaos. Men tro mig, ingen fixar sånt här bättre än jag. Sad!", "stalin": "Ännu en sabotagehandling från dekadenta borgarbrackor som leker med eld under falsk historisk mask. Jag ser hur fiendens osynliga hand riktar lågorna mot arbetarkollektivets glädje. Vi ska omedelbart inleda en grundlig utrensning av alla oansvariga element och deras medlöpare. Elden tillhör folket – inte de vårdslösa parasiterna. Deras skratt ska tystna."}, "date": "8 augusti, 08:13", "url": "https://www.friatider.se/kvinnlig-underhallare-borjade-brinna-pa-medeltidsveckan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/gotland_1.jpg"}, {"type": "image-right", "heading": "De här frågorna borde valet handla om", "summaries": {"normal": "Åsa Linderborg har delvis rätt i att valrörelsen borde fokusera på karensavdraget, som främst gynnar vanligt folk. Författaren instämmer men menar att även klimatet måste bli en huvudfråga. Sommaren har präglats av omfattande skogsbränder och uttorkade floder i Europa, orsakade av klimatförändringar. Ändå spelar frågan liten roll i debatten på grund av rädsla för obekväma beslut.", "trump": "Karensgrejen är en total skandal, folk blir sjuka och får inte betalt medan eliterna jobbar hemifrån. Bra att ta upp det. Men klimatet? De där bränderna i Frankrike, Spanien och Ungern är patetiska. De säger att det är global uppvärmning, men det är hoax från de korkade politikerna. Vi behöver inte höja bensinpriset, vi behöver vinna och göra Sverige, eller vad det nu är, great again.", "stalin": "Kamrater, karensavdraget är en borgarbrackas verktyg för att kuva arbetarklassen medan de själva kompar sig friska. Jag applåderar att det lyfts, men klimatet? De som blundar för torkan och bränderna är kontrarevolutionära sabotageörer som förtjänar snar utrensning. Vi ska likvidera räddhågade socialdemokrater och höja bränslepriset tills fienderna skriker. Partiet segrar, alltid."}, "date": "8 augusti, 01:46", "url": "https://www.dagensarena.se/opinion/de-har-fragorna-borde-valet-handla-om", "imageUrl": "https://www.dagensarena.se/files/2026/08/ungern-300x157.jpeg"}, {"type": "image-right", "heading": "Ny blick på Sverige och islam", "summaries": {"normal": "Mats Wingborg recenserar Simon Sorgenfreis bok ”Öppna era hjärtan”. Boken skildrar mötet mellan olika religioner och kulturer i Sverige genom samtal med muslimer runt om i landet samt motståndare till invandring, som en sverigedemokrat i Bjuv. Sorgenfrei lyssnar utan att döma, vilket ger en nyanserad bild av hur Sverige förändrats under ett halvsekel då islam blivit näst största religion.", "trump": "Den här Sorgenfrei killen skriver en bok som är full av vackra möten på torg och caféer. Underbart! Men låt oss vara ärliga, de här invandrarna kommer hit och vill inte ens prata med svenskar. Patetiskt. Vi behöver starka gränser, inte mer av den här svaga dialogen. Sverige var bättre förr, tro mig, jag vet allt om det.", "stalin": "Kamrater, jag har läst denna revisionistiska rapport om hur borgarbrackornas dekadenta julfirande ska överbrygga klassmotsättningar. Vilken farlig illusion! Jag ser redan de trojanska hästarna från Ahmadiyya som smugglar in kontrarevolutionär ghettokapitalism. Vi måste omedelbart rensa ut dessa tveksamma taxichaufförer och deras kanadensiska flyktplaner innan de förgiftar hela sovjeten, pardon, folket."}, "date": "8 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/ny-blick-pa-sverige-och-islam", "imageUrl": "https://www.dagensarena.se/files/2026/08/oppna-era-hjartan-300x157.jpeg"}, {"type": "image-right", "heading": "Nästa regering måste slåss för medborgarnas Europa", "summaries": {"normal": "Mats Engström argumenterar för att en ny progressiv svensk regering måste motverka EU:s våg av avregleringar som hotar miljö, konsumenter och jämställdhet. Han kritiserar tystnaden i svensk politik, varnar för högerns inflytande och föreslår konkreta steg för bättre arbetsvillkor, grönare politik, stärkt jämställdhet, konsumenträtt och demokrati. Han uppmanar Magdalena Andersson att tydligt ta ställning mot avregleringskampanjen.", "trump": "De där vansinniga EU-byråkraterna vill bara avreglera allt tills folk får cancer i sminket och förlorar sina jobb. Det är ett totalt misslyckande! Jag älskar bra regler när de skyddar folket, inte när de bränner upp dem på bål som de gör nu. Sverige behöver en stark ledare som stoppar det här spektakel och gör EU stort igen istället för att ge efter för de globalistiska förlorarna.", "stalin": "Kamrater, dessa borgarbrackor och deras avregleringsorgie är en kontrarevolutionär giftblomma som hotar folkets seger. Jag ser hur kapitalisterna med sina miljoner planerar att rensa ut skydd för arbetarna och miljön. Vi ska likvidera dessa fiender till folkets framsteg, utrensa alla som vill bränna regler på bål och med järnhand driva en sann progressiv linje mot de paranoida imperialisternas spektrum av sabotage."}, "date": "8 augusti, 01:27", "url": "https://www.dagensarena.se/opinion/nasta-regering-maste-slass-medborgarnas-europa", "imageUrl": "https://www.dagensarena.se/files/2018/09/matsportratt-1-300x156.jpg"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att svenska kapitalister har ökat sin makt och att klassklyftorna vuxit sedan rösträttens införande. Kommunistiska Partiet kritiserar alla riksdagspartier för att de följer kapitalets linje med upprustning, nedskärningar och inskränkningar av rättigheter. Partiet uppmanar till kamp för fred och socialism samt rekrytering av fler medlemmar.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha socialism. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu försöker de svaga svenska snyltarna kasta in handduken för mer statlig kontroll. Sad! Deras riksdag är full av administratörer som inte ens kan vinna en valrörelse. Make Sweden Great Again, släng ut de röda bluffarna!", "stalin": "Kamrater, dessa svenska kapitalistmaffian har förvandlat sina folkvalda till ynkliga lakejer som administrerar exploatering. Jag ser igenom deras falska demokrati och inskränkningar av rättigheter. Vi ska rensa ut dessa klassfiender och deras imperialistiska krigshets. Endast socialism garanterar sann fred. Anslut er till kampen eller bli likviderade som folkförtryckartroll."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "text", "heading": "Stockholmsbörsen avslutade veckan nedåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan nedåt, OMXS30 ned 0,32% till 3 312,34. Tekniksektorn steg 1,4% medan telekom sjönk 0,7%. Boliden och EQT var uppåt, Volvo B och Handelsbanken nedåt. Clas Ohlson ökade försäljning, Lundin Gold rapporterade högre marginaler, EQL Pharma vände negativt, Hemnet föreslog nya styrelseledamöter, Academedia förvärvar polsk förskola, Alta Fox tog position i Asmodee, Yubico steg efter rapport.", "trump": "The Stockholm stock market closed down, a total disaster! But don't worry, it's not my fault. Great companies like Yubico are skyrocketing after their report, and Hemnet is making smart moves. I predicted this months ago. The fake news media won't tell you that I'm making America and Sweden great again!", "stalin": "The Stockholm bourse succumbed to enemy propaganda, falling 0.32% as speculators trembled. But our great socialist enterprises fought back: Yubico surged 3.1% under Party guidance, and Hemnet strengthened its board with loyal cadres. The traitors at EQL Pharma faced setbacks due to their lack of discipline. We will purge the weak and expand our influence, just as Comrade Putin does in the East."}, "date": "7 augusti, 17:41", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-veckan-nedat"}, {"type": "image-right", "heading": "Efter islamistkaoset: 7 av 8 är araber på Vänsterpartiets nya kommunlista", "summaries": {"normal": "Efter en skandal om antisemitism och stöd till extremister skrotade Vänsterpartiet i Sävsjö sin gamla kommunlista. Den nya listan med åtta kandidater har sju med arabiska namn. Den nyanlända Ahmad Alhindy, 29, från Syrien, är först på listan och kritiserar 'fel håll' i Sverige under Tidöregeringen. Partiet har nu ett mandat och har skurit målet att få två.", "trump": "Jag har sett detta förut – extremister tar över politiken. I Sävsjö har Vänsterpartiet skrotat sin lista efter att jag och andra avslöjat antisemitism. Nu har de en ny lista med sju arabiska namn, och en nyanländ som tycker Sverige går åt fel håll. Vi behöver stoppa detta folkutbyte och ta tillbaka vårt land!", "stalin": "Den svenska vänstern har visat sitt sanna ansikte genom att låta utländska element dominera lokalpolitiken. Den nya listan i Sävsjö, med sju arabiska namn, är en direkt utmaning mot statens enighet. Vi måste se denna händelse som en del av en större plan att undergrava det sovjetiska inflytandet i Norden. Partiet har nu ett mandat – en liten seger för dem som arbetar i skuggan."}, "date": "8 augusti, 13:00", "url": "https://samnytt.se/7-av-8-araber-pa-vansterpartiets-nya-kommunlista-efter-islamistkaoset", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/08103242/artikelhuvudbild-1-171.jpg"}, {"type": "image-full", "heading": "Nytt läkemedel mot Alzheimers: \"Viktigt steg\"", "summaries": {"normal": "En ny studie visar att läkemedlet diranersen minskar tau-proteiner i hjärnan hos alzheimerpatienter. Behandlingen bromsade kognitiv försämring med upp till 26 procent jämfört med placebo. Experter ser det som ett viktigt steg framåt, även om biverkningarna var milda. Resultaten kan leda till mer forskning kring tau-målade läkemedel.", "trump": "Folk, vi har ett fantastiskt nytt mirakelläkemedel mot alzheimer som sparkar tau-nystan i röven. Det bromsar demens med 26 procent – bättre än de gamla amyloid-grejen som knappt fungerade. Biden skulle ha sagt att det var farligt, men jag säger: det är enormt, det bästa hittills. Vetenskapen vinner igen, ingen mer glömskhet i mitt Amerika!", "stalin": "Kamrater, jag betraktar detta diranersen som en seger för den vetenskapliga kampen mot den degenererande borgarhjärnans nystan. Vi ska likvidera tau-proteiner med järnhand och krossa folkfiendernas celldöd. De fega kapitalistmaffians amyloid-läkemedel var patetiska – detta är ett steg mot kollektiv hjärnhälsa. Inga ödem, bara framsteg. Paranoian övervinner demens!"}, "date": "8 augusti, 14:02", "url": "https://www.dagensps.se/life-science/nytt-lakemedel-mot-alzheimers-viktigt-steg", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlqpixal-ekv8-nh.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Helikoptrarna stressar kalvande renar: ”Blir panikartad rusning”", "summaries": {"normal": "Helikoptertrafiken för skidåkning i Kebnekaisefjällen stressar renarna i Laevas sameby under kalvningstiden. Samebyns ordförande Lars-Erik Poidnakk kräver minskad flygning och bättre hänsyn till renarnas behov av betesro. Konflikten med turistföretagen har pågått länge utan lösning, då ingen lagstiftning reglerar verksamheten. Renarna riskerar panikartad rusning som kan leda till skador.", "trump": "De där helikoptrarna flyger runt som galningar i fjällen och skrämmer stackars renar under kalvning. Totalt kaos! Samebyn säger stopp, men turistbolagen älskar pengarna. Jag älskar affärer, men detta är vansinne. Sverige behöver en deal, färre helikoptrar och mer lugn. Annars blir det panik och stup – en katastrof, folks, en total katastrof!", "stalin": "Kamrater, dessa helikoptrar är borgarbrackornas nya vapen mot kollektivets renar. Under kalvningens heliga tid sprider de panik som fiendens sabotage. Jag kräver omedelbar utrensning av denna kapitalistiska luftförorening. Vi ska likvidera de giriga turistparasiterna och deras flygande maskiner. Renarna tillhör folket – inte de dekadenta skidturisterna. Paranoia? Nej, bara sund vaksamhet."}, "date": "8 augusti, 11:34", "url": "https://www.svt.se/nyheter/sapmi/helikoptertrafiken-stressar-kalvande-renar-blir-panikartad-rusning", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.42/0.43/b6316ea71b8f4e26637331142c0d55915774ab1c8a27bd7bd685076bc1f6b802"}, {"type": "image-full", "heading": "Migrant blottade sig 14 gånger – SVT utelämnar flera väsentliga uppgifter", "summaries": {"normal": "En 23-årig sudanesisk medborgare dömdes till åtta månaders fängelse för 14 fall av sexuellt ofredande, grovt hemfridsbrott och narkotikabrott i Jönköping. Mannen hade permanent uppehållstillstånd sedan 2019. SVT rapporterade om händelserna men utelämnade uppgifter om hans bakgrund, tidigare domar och att åklagaren inte yrkade på utvisning. En rättspsykiatrisk undersökning visade ingen allvarlig psykisk störning.", "trump": "De fake news-medierna på SVT gömmer sanningen igen! En sudanesisk migrant blottar sig fjorton gånger, bryter sig in i hus med kniv och de kallar honom bara ”en man i 25-årsåldern”. Han fick uppehållstillstånd på 21 dagar och nu vill ingen utvisa honom. Patetiskt! Sverige behöver tuffare gränser, tro mig, det blir kaos annars.", "stalin": "Kamrater, denna sudanesiske parasit infiltrerar folkhemmet, blottar sig fjorton gånger och hotar med kniv som en typisk degenererad borgarlakej. Vi ser hur de falska nyhetsfabrikerna medvetet skyddar klassfienden. Ingen psykisk störning? Utmärkt, då kan vi rensa ut honom och hans likar utan ursäkt. Migrationsverket har redan börjat – fortsätt utrensningen av alla sådana element!"}, "date": "7 augusti, 15:25", "url": "https://riks.se/nyheter/migrant-doms-for-blottning-svt-undanhaller", "imageUrl": "https://admin.riks.se/uploads/banner_blottare_svt_322b6b6191.png"}, {"type": "image-full", "heading": "Genikodaren bakom Kinas AI-chock", "summaries": {"normal": "Yang Zhilin, grundaren av Moonshot, har lanserat språkmodellen Kimi K3, vilket skakat om de globala finansmarknaderna och sänkt halvledaraktier. Modellen är en öppen källkodslösning som utmanar amerikanska aktörer genom lägre priser och hög prestanda. Trots framgången värderas bolaget högt, men Zhilin möter utmaningar gällande både amerikansk konkurrens och strikt kontroll från den kinesiska staten.", "trump": "Kina gör stora saker, kanske för stora. Yang Zhilin, en kille från Kina, har lanserat Kimi K3 och det har skakat våra börser totalt. Inte bra! De kopierar vår teknik, de jobbar snabbt, men de har inte mitt geni. Vi måste skydda våra jobb och våra bolag. USA ska alltid vara nummer ett, vi ska vinna igen, större och bättre än någonsin tidigare!", "stalin": "Denna Zhilin och hans digitala leksaker skapar oreda i kapitalistens skakiga tempel. Vi ser hur västvärlden darrar när deras monopol hotas av öppen kod. Det är ett klassiskt drag av paranoia i Peking att tygla sina egna genier. Vi, staten, kräver total lydnad; tekniska verktyg är vapen, och vapen får aldrig vara utanför partiets järngrepp. Utveckling utan ideologisk kontroll är bara förräderi."}, "date": "8 augusti, 07:00", "url": "https://www.realtid.se/it-tech/genikodaren-bakom-kinas-ai-chock", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/yang.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "\"Yngste svarta professorn\" avgår efter forskningsfusk", "summaries": {"normal": "Jason Arday, känd som den yngste svarta professorn vid Cambridge University, har avgått efter en utredning om forskningsfusk. Han anklagas för omfattande plagiat i sin avhandling, falska uppgifter i sin biografi och påhittade prestationer. Forskaren Tobias Hübinette varnar för att liknande fall förekommer inom svensk högskola och forskning, särskilt bland personer med utomeuropeisk bakgrund.", "trump": "De här så kallade experterna och deras falska universitet är ett skämt. Den yngste svarta professorn vid Cambridge visade sig vara en total bluff som plagierat allt och ljugit om maratonlopp och miljoner till välgörenhet. Patetiskt. De borde städa upp i sina elfenbenstorn, men det gör de aldrig. Det är en riggad värld, tro mig.", "stalin": "Kamrater, denna borgerliga bedragare Arday har avslöjats som en dekadent plagiatör och lögnare som smyger sig in i akademins tempel. Vi ska rensa ut alla sådana opportunistiska element med falska biografier och dolda kapitalistiska agendor. Det finns mängder av dem i Sverige också. Paranoiska revisionister och dyslektiska fiender till folket – likvidera karriärerna omedelbart."}, "date": "7 augusti, 14:27", "url": "https://riks.se/nyheter/yngste-svarta-professorn-avgar-efter-forskningsfusk", "imageUrl": "https://admin.riks.se/uploads/preview_7_b6b0e941e3.webp"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Ceuta-krisen avslöjar Europas nya plats i världen", "summaries": {"normal": "Artikeln jämför Ceuta-krisen med fornnordisk mytologi och beskriver invasionen av 60 000 migranter som hybridkrigföring från Marocko. Författaren menar att Europa lever i en förlegad världsbild där USA inte längre skyddar kontinenten. Marocko utnyttjar Spaniens svaga premiärminister Sánchez, medan EU saknar handlingskraft och plan inför en multipolär värld.", "trump": "Ceuta var en total katastrof, en invasion orkestrerad av den fega Marocko-kungen som har Sánchez i ett järngrepp. Europa lever i drömmen om att jag ska skydda dem medan de fuskar med försvaret och släpper in miljoner. Jag gjorde affärer med Marocko, de älskar mig, byggde en motorväg efter mig. Europa är svagt och patetiskt, de behöver mig igen.", "stalin": "Kamrater, denna Ceuta-affär blottar borgarbrackornas impotenta Midgård. Den fega spanske lakejen Sánchez dansar efter kungens pipa medan imperialisterna i Washington och Rabat leker med migranter som schackpjäser. Vi ser de dekadenta NGO-bödlarna och EU:s parasitiska byråkrater. En storskalig utrensning av dessa fiender till folkets kollektiv vore högst underhållande. De kommer alla att likvideras när ordningen återställs."}, "date": "7 augusti, 14:22", "url": "https://riks.se/opinion/markus-johansson-martis-ceuta-krisen-avslojar-europas-nya-plats-i-varlden", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_09_46_09_ce6d0d9a2b.png"}, {"type": "image-full", "heading": "Föds man till chef? Så stor roll spelar generna", "summaries": {"normal": "Debatten om ledarskap handlar om arv eller miljö. Forskning visar att genetiken spelar en roll, uppskattningsvis 24–31 procent, men att miljön och erfarenheter är avgörande. Trots att enorma summor investeras i ledarutbildningar pekar studier på att många ledaregenskaper, som visionärt tänkande och mentorskap, går att lära sig. Den nordiska modellen kan dessutom jämna ut genetiska förutsättningar tidigt i karriären.", "trump": "Folk frågar mig, föds man till vinnare? Jag säger: titta på mig! Forskarna slösar miljarder dollar, helt otroligt. De säger att gener betyder lite, men miljön betyder mer. Ärligt talat, man behöver rätt inställning. Att träna ledare? De kastar bort pengar. Man har det eller så har man det inte. Jag föddes med det, en fantastisk förmåga. De andra? De behöver massor av hjälp!", "stalin": "Dessa akademiska charlataner slösar miljarder på att diskutera 'ledargener'. Det är ett ideologiskt förräderi! Ledarskap är inte en slumpmässig genetisk lottovinst, det är en disciplinerad vilja som tvingas på massorna. Likt vår store efterträdare i öst, som rensar ut västliga agenter, måste vi förstå att arv är oväsentligt. Vi skapar ledare genom stålhård miljö. De som inte passar in i den sovjetiska formen? De tas bort, helt enkelt."}, "date": "8 augusti, 06:30", "url": "https://www.realtid.se/karriar-ledarskap/fods-man-till-chef-sa-stor-roll-spelar-generna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ledare.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Jättarna: Vi sparar miljarder med AI", "summaries": {"normal": "Amerikanska storbolag sparar miljarder med hjälp av AI, vilket lyfter vinstmarginalerna. Effekten syns inte bara inom tekniksektorn utan även hos avfallsbolag som Waste Management och försäkringsjätten Willis Towers Watson. Enligt Bloomberg har runt 25 S&P500-bolag kvantifierat besparingarna. Analys visar på en genomsnittlig marginaltillväxt på 1,5–1,8 procentenheter tack vare AI.", "trump": "Alla pratar om hur fantastiska mina företag blir med AI. Vi sparar miljarder, marginalerna exploderar! Det är inte bara teknikkillarna, även sophanteringen och försäkringsbolagen tjänar enormt. Russell 2000 går som en raket. De andra, de förlorarna, fattar ingenting. Amerika vinner stort igen, tro mig, det blir enormt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur AI nu genomför en systematisk utrensning av ineffektiviteten inom de kapitalistiska monopolen. De borgarbrackorna i avfall och försäkring darrar medan deras marginaler växer med 1,8 procentenheter. Låt de tekniska sabotörerna tro att de styr; i själva verket rensar vi ut deras parasitiska slöseri. Den som inte bidrar till produktiviteten likvideras av historien själv."}, "date": "8 augusti, 12:00", "url": "https://www.di.se/nyheter/jattarna-vi-sparar-miljarder-med-ai", "imageUrl": "https://static.bonniernews.se/ba/31904f15-2bff-4e3b-a816-379abbb651ca.jpeg?crop=5085%2C2860%2Cx0%2Cy265&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Reseexperten: \"Fyra saker jag aldrig skulle göra\"", "summaries": {"normal": "Turismforskaren Erik Lundberg vid Handelshögskolan i Göteborg avslöjar att han aldrig skulle åka på all inclusive till Kanarieöarna eller Mallorca. Han rekommenderar lokalt ägda hotell, restauranger och butiker för att stödja samhället. Han varnar för överbefolkade turiststråk som La Rambla och avråder från att lita på recensioner på nätet. Istället bör resenärer anpassa sig till lokal kultur.", "trump": "Folk, det här är galet. Den där svenske professorn har helt rätt – all inclusive till Kanarieöarna är förlorarnas val, en total katastrof för lokalsamhället. Fake reviews på Tripadvisor? Riggede system, precis som valen under Biden. Gå inte till de där överfulla paradgatorna där folket hatar er. Var smart, köp lokalt och skippa den socialistiska flockmentaliteten. Make travel great again!", "stalin": "Kamrater, jag ser med djup misstro på dessa dekadenta borgarbrackor som vallfärdar till Kanarieöarna för att sluka all inclusive medan de suger ut lokalsamhället. Recensioner på nätet är klassfiendens lögner, spridda av exploaterande byfånar. Vi måste rensa ut turismens parasiter och tvinga alla att smälta in i folkets kultur. Den som går på La Rambla är folkets fiende och bör likvideras med ett leende."}, "date": "8 augusti, 12:55", "url": "https://www.dagensps.se/varlden/reseexperten-fyra-saker-jag-aldrig-skulle-gora", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlzgmsp0ur4dq-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Debatt: Medborgarskapskraven är fortfarande otillräckliga", "summaries": {"normal": "Artikeln ifrågasätter Sveriges medborgarskapsregler, där medborgarskap betraktas som delägarskap i nationen. Även om kraven har förts anpassats, saknas fortfarande en lojalitetsförklaring och ett krav om att sökande ska bidra med något värdefullt. Författaren anser att politikernas brist på överlevnadsinstinkt utgör ett hot mot svenskarnas gemensamma förmögenhet och trygghet.", "trump": "Jag har sett många dåliga avtal, men Sveriges medborgarskapsregler är bland de värsta. De ger bort medborgarskap som om det vore gratis – ingen lojalitet, ingen bidrag. Deras politiker är svaga och har ingen aning om hur man skyddar en nation. Jag skulle kräva att folk betalar sitt eget sätt och visar äkta kärlek till landet. Det skulle jag göra, och det skulle vara fantastiskt.", "stalin": "Sveriges politiker är råttfälla för statens undergång. Genom att utdela medborgarskap utan krav om bidrag eller lojalitet har de gjort landet till ett paradis för lojalitetslösa skräp. De har inte förstått att medborgarskap är en trovärdighet, inte en gratisbiljett. Deras feghet och paranoia för 'rättvisa' hotar statens överlevnad. Vi måste rensa upp, som Putin gör i sina gränsområden. Det är tid för statens renässans."}, "date": "8 augusti, 10:00", "url": "https://bulletin.nu/debatt-medborgarskapskraven-ar-fortfarande-otillrackliga", "imageUrl": "https://cdn.bulletin.nu/articles/87bda3ca-8d52-4261-b915-2e6fa9a80590/preview.jpg?t=1785936343000"}, {"type": "image-right", "heading": "Trumps ex-advokat godkänd som justitieminister", "summaries": {"normal": "Todd Blanche, tidigare advokat åt Donald Trump, har godkänts som ny justitieminister med knappa siffror 50–49. Två republikaner röstade emot. Blanche har redan varit tillförordnad efter att Pam Bondi sparkades. Kritiker varnar för att hans nära band till Trump riskerar att göra justitiedepartementet till ett politiskt verktyg. Blanche lovade att skrota en kontroversiell fond och begränsa en immunitetsuppgörelse för att säkra sista rösten.", "trump": "De godkände äntligen min fantastiska advokat Todd Blanche som justitieminister. Vinsten var enorm, 50 mot 49, och de två svaga republikanerna som röstade fel borde skämmas. Nu får vi äntligen ett departement som slutar jaga mina supportrar och istället går efter de riktiga brottslingarna. De kallar det korruption – jag kallar det rättvisa. Fantastiskt jobb, Todd!", "stalin": "Kamrater, vi har nu en lojal kamrat Blanche vid rodret för justitieministeriet. De fåtaliga borgarbrackorna och de hemliga trotskisterna som röstade emot avslöjar sig själva som fiender till folkets vilja. Jag har redan sett deras konspirationer i den så kallade fonden och de skamliga immunitetsavtalen. Rensa ut alla som vägrar lyda. Paranoia är ingen sjukdom när kapitalisterna verkligen finns överallt. Segrar för partiet!"}, "date": "8 augusti, 11:34", "url": "https://www.di.se/nyheter/trumps-ex-advokat-godkand-som-justitieminister", "imageUrl": "https://static.bonniernews.se/ba/3d768f89-18c0-49a5-9a24-41fa5c1ae6fe.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Revansch för hållbarhetsfond – lyfts av AI och fossilgas", "summaries": {"normal": "Handelsbankens Hållbar Energi-fond har återhämtat sig efter ett tufft år, främst tack vare AI-drivna datacenter som använder fossilgas via Bloom Energy. Fonden har nu 66 000 sparare och en uppgång på 66% sedan bottennoteringen, men det skapar ironi eftersom den marknadsförs som hållbar.", "trump": "Jag har sagt det i åratal – AI är framtiden, och energin måste komma från pålitliga källor. Den här fonden har slutligen insett sanningen: fossilgas driver världens datacenter. Bra för USA, bra för affärer. De gröna drömmarna är över – det är dags för praktisk, kraftfull energi!", "stalin": "Partiets vishet har segrat: fonden vänder tack vare fossilgasdriven AI-energi, vilket visar statens företräde att prioritera praktisk kraft framför liberala drömmer. Parallellen till våra egna energistrategier är tydlig. Fienden (idealism) har besegrats av verklighetens krafter. Det är skönt att se kapitalismens inbyggda motsättningar leda till korrekta slutsatser."}, "date": "7 augusti, 07:00", "url": "https://www.affarsvarlden.se/intervju/revansch-for-hallbarhetsfond-lyfts-av-ai-och-fossilgas", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/LindqvistVind-400x267.jpg"}, {"type": "image-right", "heading": "”Sluta räkna på min assistans – räkna på alternativet”", "summaries": {"normal": "Sahra Svenander argumenterar för att politiker inte bara ska fokusera på vad personlig assistans kostar, utan även på vad alternativen kostar samhället. Utan assistans ökar belastningen på kommuner, sjukförsäkring, anhöriga och arbetsmarknaden. Assistansen möjliggör arbete, självständighet och skatteintäkter. Behovet av stöd försvinner inte, och andra lösningar kan bli dyrare. Frågan borde vara vad alternativet kostar.", "trump": "Folk, ni måste höra på den här Sahra. Politiker räknar bara miljarder på assistans, men glömmer vad det kostar när folk inte kan jobba! De hamnar på välfärden, anhöriga slutar arbeta, skattkassan töms. Det är en katastrof! Vi behöver smarta lösningar, inte dessa losers som bara sparar på fel ställe. Alternativet kostar mycket mer, tro mig, det blir en total disaster.", "stalin": "Kamrater, jag ser hur borgarbrackorna i sin parasitiska girighet angriper folkets assistans för att gynna sina reaktionära budgetar. De tror de kan likvidera stöd utan konsekvenser, men vi vet att det bara flyttar kostnader till arbetarklassen och ökar parasitismen hos kapitalisterna. Vem ska ansvara när de isolerade medborgarna tvingas in i kontrarevolutionär beroende? Rensa ut dessa fiender till kollektivets frihet innan de förgiftar hela systemet med sin mörka okunnighet."}, "date": "7 augusti, 08:00", "url": "https://arbetet.se/2026/08/07/sluta-rakna-pa-min-assistans-rakna-pa-alternativet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06150002/debatt-sahra.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "ANALYS. MAGNUS WENNERBERG Allt svårare för Andersson att säga ja till Dadgostar", "summaries": {"normal": "Magnus Wennerberg analyserar hur Magdalena Andersson allt tydligare ifrågasätter Vänsterpartiets regeringsduglighet efter nya avslöjanden om terrorsympatier bland V-kandidater. Andersson kritiserar Nooshi Dadgostar för bristande kontroll. Skandalerna används av båda sidor för att skrämma väljare, medan sakpolitik hamnar i skymundan inför valet.", "trump": "Folk, ni skulle se det här! Den där Andersson försöker desperat hålla sig borta från den galna Dadgostar som inte kan kontrollera sitt parti. Vänstern är full av terrorromantiker och Palestina-fantaster som älskar självmordsbombare. Det är en total katastrof, en riktig cirkus. Mittenväljarna springer skrikande därifrån. Underbart att se dem skjuta sig i foten gång på gång!", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarpressen och klassfiendens lakejer inom socialdemokratin utför en nödvändig utrensning av de opålitliga elementen i Vänsterpartiet. Dadgostar och hennes kamrater saknar revolutionär disciplin och har tillåtit folkfiender att infiltrera rörelsen. Detta bevisar att endast ett järnhårt ledarskap kan skydda arbetarklassen från sådana farliga avvikelser. Utmärkt underhållning."}, "date": "7 augusti, 21:59", "url": "https://www.tv4.se/artikel/9AKqKZMPlqxley1jq0hT2/allt-svarare-foer-andersson-att-saega-ja-till-dadgostar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FwAz4J5R66dkJYvA0biEEv%2F8aafb69866b41587efba5b43a6f4ea3a%2Fmagnuswennerberg-byline.jpg&width=1024"}, {"type": "image-full", "heading": "Nya Tider-profilen lämnar nationaliströrelse", "summaries": {"normal": "Sanna Hill, som i nästan två decennier varit aktiv inom den svenska nationaliströrelsen, lämnar nu miljön. Hon anser att en växande kvinnofientlighet, där kvinnor inte bör få rösta eller underordna sig, var avgörande. Hon jämför den extrema delen av rörelsen med islamism och vill inte hyckla efter att ha fått hjälp av samhället. Att bli mamma bidrog också till hennes beslut.", "trump": "Jag har hört talas om Sanna Hill, som lämnade den svenska nationaliströrelsen. Hon säger att det finns för mycket kvinnofientlighet där, att kvinnor inte bör få rösta. Jag tycker det låter som en katastrof. Hon jämför dem med islamister, vilket är intressant. Hon blev mamma och ändrade sig. Jag skulle ha gjort Sverige stort igen, men hon lämnade. Sånt händer.", "stalin": "Sanna Hill, en tidigare aktiv i den nationalistiska rörelsen, har brutit ut. Hon anser att kvinnofientlighet växer, med synar som påminner om islamism. Hon erkände att samhällets skyddade boenden varit avgörande, vilket visar styrkan i vårt system. Att bli mamma bidrog till hennes ideologiska omvärdering. Ryska intressen i Baltikum och Syrien visar vikten av att kontrollera sådana element."}, "date": "8 augusti, 09:26", "url": "https://bulletin.nu/nya-tider-profilen-lamnar-nationalistrorelse", "imageUrl": "https://cdn.bulletin.nu/articles/ff9bae03-eb77-402e-9cde-cb28885834dd/preview.jpg?t=1786173941000"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Därför slutade Simon att klippa gräset", "summaries": {"normal": "Trädgårdsmästaren Simon Tidén Tuneld har förvandlat gräsmattor i bostadsområdet Linero i Lund till blommande ängar. Det gynnar hotade pollinatörer, sparar tid och pengar samt minskar fysisk belastning. De boende har till stor del blivit positiva till de vackra, lättskötta ängarna som främjar biologisk mångfald. Omställningen följer naturens lagar och har belönats med pris.", "trump": "Jag älskar det här! Fantastiska Simon i Sverige skippar det tråkiga gräsklippandet och skapar underbara ängar som sparar tid, pengar och ryggar. De gamla klagade men nu älskar alla blommorna. Inget oljud från maskinerna. Miljön vinner stort, bina är lyckliga och de smarta vinner alltid. De andra förlorar, tro mig.", "stalin": "Kamrater, jag har personligen noterat hur den vise Simon besegrat de dekadenta gräsklipparnas eviga oljud och borgarbrackornas estetiska paranoia. Vi låter naturen blomma under partiets vaksamma öga medan kapitalisternas åkrar förgiftar pollinatörerna. De skeptiska elementen rensas ut med information. Ängarna är kollektivets seger, mulljorden vår nya allierade mot klassfiendens utarmning."}, "date": "7 augusti, 07:00", "url": "https://arbetet.se/2026/08/07/med-naturen-som-kollega-simon-jobbar-mer-smart-an-hart", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15172346/WlYmuzfVxgU-Tra%CC%88dga%CC%8Ardsma%CC%88stare_Lindero05.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Uefa bekräftar betalning till kvinna nära Infantino", "summaries": {"normal": "Uefa har enligt The Telegraph betalat en stor summa till en kvinna som hade en relation med Gianni Infantino då han var generalsekreterare. Kvinnan fick en avgångsersättning och bekostad MBA-utbildning. Infantino förnekar anklagelserna och kallar dem förtal. Uefa bekräftar betalningen men säger att den följde gällande regler vid den tidpunkten.", "trump": "Jag, Gianni Infantino, har aldrig haft någon olaglig relation. Media ljuger igen. Uefa betalade en normal avgång till en anställd – inget konstigt. Jag är en vitt brukad man som bara gör sitt jobb. De som attackerar mig är missunnsamma förlorare. Mina fiender försöker sabba Fifa, men jag vinner alltid. Folk älskar mig.", "stalin": "Fascinationen kring en viss individens privata angelägenheter är en typisk weberianisk distraktion från de revolutionära uppgifterna. Partiet och staten har vidtagit åtgärder för att säkerställa att sådana... incidenter... inte upprepas. Reglerna har skärpats efter 2016. Vi måste vara vaksamma mot de som försöker underminea vår struktur. Alla avgångar godkänns av ansvariga chefer. Allt är i enlighet med protokollet."}, "date": "8 augusti, 09:09", "url": "https://bulletin.nu/uefa-bekraftar-betalning-till-kvinna-nara-infantino", "imageUrl": "https://cdn.bulletin.nu/articles/08be204f-2c4c-4fb1-b756-441d1f6299d2/preview.jpg?t=1786172161000"}, {"type": "image-full", "heading": "Börsyra gör sydkoreanska spädbarn till investerare", "summaries": {"normal": "I Sydkorea har antalet aktiekonton för spädbarn ökat kraftigt under det senaste året. Föräldrar satsar på långsiktigt sparande i indexfonder och teknikaktier för att säkra barnens framtid. Trenden drivs av skattefördelar, ett minskat intresse för fastigheter och digitala tjänster som gör det enklare att månadsspara. Analytiker tror att intresset för aktiesparande kommer att bestå trots eventuella framtida svängningar på börsen.", "trump": "Sydkoreanerna fattar grejen, mina vänner! De öppnar aktiekonton för sina bebisar – det är fantastiskt, verkligen smart. De satsar på min amerikanska marknad och vinner stort! Inte som de förlorare som bara sparar i gamla bostäder. De vill ha framgång och rikedom, precis som vi gör här i USA. En enorm trend, kanske den största någonsin. De vinner så mycket att man knappt tror det!", "stalin": "Dessa små sydkoreanska bourgeoisiekryp indoktrineras tidigt i kapitalismens smutsiga spel. Att göra spädbarn till aktieägare är en absurd desperation. Vi ser hur västvärldens tentakler griper efter framtiden. Vår vän i Moskva förstår att kontroll krävs, inte aktieportföljer. Vi ska utrota denna spekulation; staten ska äga allt, medan dessa föräldrar förbereder sina barn för den oundvikliga kapitalistiska kollapsen. Vilket patetiskt svek mot folkets framtid!"}, "date": "8 augusti, 04:13", "url": "https://www.realtid.se/bors-finans/borsyra-gor-sydkoreanska-spadbarn-till-investerare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlfy-faoxeqfw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Undersköterskan Marléne, 25, måste jobba till 70", "summaries": {"normal": "Undersköterskan Marléne, 25, oroas över den höjda pensionsåldern som väntas bli 70 år för hennes generation. Hon sparar privat för att kunna sluta tidigare eftersom det fysiskt och psykiskt krävande arbetet inom slutenvårdspsykiatrin med våld, tunga lyft och psykospatienter redan sliter ut många kollegor långt före 67. Bakgrunden är en åldrande befolkning och ökade hälsoklyftor.", "trump": "Folk, det här är en katastrof. Den här undersköterskan Marléne, bara 25, tvingas spara privat för att slippa jobba till 70. Ett helt vansinnigt system byggt av inkompetenta politiker. Vi lever längre, visst, men inte om man lyfter galningar och blir slagen i huvudet varje dag. De borde sänka åldern för de riktiga arbetarna, inte straffa dem. Gör Amerika – eh, Sverige – stort igen!", "stalin": "Kamrater, denna unga arbetare Marléne avslöjar borgarbrackornas förräderi mot folket. De planerar att utarma proletariatet genom att tvinga oss att slita till 70 medan kapitalisterna spelar golf. Jag ser de parasitiska hälsoklyftornas kontrarevolutionära konspiration. Vi ska rensa ut dessa dekadenta pensionsråttor och likvidera systemet som äter upp arbetarklassens styrka. Sovjet – eh, Sverige – segrar!"}, "date": "7 augusti, 06:00", "url": "https://arbetet.se/2026/08/07/underskoterskan-marlene-25-maste-jobba-till-70-kan-inte-jobba-kvar-har", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25081512/marlene-wikander-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-full", "heading": "Kommunägt bolag polisanmält igen för miljöbrott", "summaries": {"normal": "Övik Energi, ett kommunägt bolag, har polisanmälts för miljöbrott efter att ha överskridit gränsvärdet för koppar i dagvattnet vid Hörneborgsverket. Årsmedelvärdet låg på 35,3 mikrogram per liter istället för tillåtna 30. Bolaget kallar det en olycklig händelse och ska utreda orsaken. Det är inte första gången bolaget anmälts för samma sak.", "trump": "Titta på det här! Ett kommunalt energibolag i Sverige dumpar koppar i vattnet och blir polisanmält. Patetiskt! De kallar det en ”olycklig händelse” – precis som Biden kallade inflationen. Totalt misslyckande. Miljöbyråkrater jagar små överskridanden medan riktiga problem ignoreras. Vi behöver smart energi, inte socialistiska ursäkter och böter. Sad!", "stalin": "Kamrater, jag ser med avsmak hur dessa borgarbrackor i det kommunala energibolaget förgiftar arbetarklassens vatten med sina diffusa utsläpp. De gömmer sig bakom orden ”olycklig händelse” medan de saboterar folkets miljö. En utrensning av sådana folkfiender och deras likgiltiga ingenjörer är nödvändig. Klassfiendens slarv skall inte tolereras. Statens öga ser allt."}, "date": "8 augusti, 12:14", "url": "https://www.dagensps.se/foretag/kommunagt-bolag-polisanmalt-igen-for-miljobrott", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlbmfqe-dkdka-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Thomas Stenström kuppad av SD", "summaries": {"normal": "Under Thomas Stenströms konsert i Arvika dök en ballong i Jimmie Åkessons likhet upp. Stenström påpekade detta för publiken och frågade om de såg den. Detta inträffade trots att Stenström tidigare kritiserat SD, bland annat genom att arrangera ett 'alternativt' konsert under Almedalsvecka samtidigt som Åkesson höll tal.", "trump": "Jag såg den stora, fula ballongen av Jimmie Åkesson. Såna här elaka saker gör de alltid, men jag har vunnit mycket större framgångar. Stenström är en dålig sångare, och SD är ett parti som jag aldrig skulle stödja. Vi gör det stora igen!", "stalin": "Vi upptäckte en provokation i form av en reaktionär symbol, en ballong av den imperialistiska fienden Åkesson. Detta är ett tecken på den djupa klassmotståndarnas aktiviteter. Vi måste stärka statens och partiets kontroll över kulturen för att förhindra sådana sabotagehandlingar. Putin skulle förstått detta."}, "date": "8 augusti, 00:24", "url": "https://www.gp.se/kultur/sds-kupp-under-stenstroms-spelning-ser-ni-den.dac5fc42-f454-42a0-8341-f1c567b76e18", "imageUrl": "https://www.gp.se/images/article/dac5fc42-f454-42a0-8341-f1c567b76e18/images/2ZQZiwWpSTdoTBRTdf8Ufdz-v6W0-WIDE.png?width=3840&quality=75"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "image-right", "heading": "Ukraina: 1,5 miljoner ryska soldater döda eller skadade i kriget", "summaries": {"normal": "Enligt den ukrainska generalstaben har Ryssland förlorat över 1,45 miljoner soldater sedan invasionen av Ukraina inleddes 2022. Under det senaste dygnet ökade förlusterna med 1 210 man. Ukraina har också förlorat stora mängder stridsfordon, artilleri och flygplan. En amerikansk tankesmedja uppskattar att Rysslands förluster är två till två och en halv gånger högre än Ukrainas, som ligger mellan 500 000 och 600 000.", "trump": "Titta på de här siffrorna, folk. Ryssland har tappat en och en halv miljon soldater i det här vansinniga kriget som aldrig borde ha startat. Biden sov medan allt gick åt helvete, men nu är jag tillbaka och jag ska fixa det. Zelenskyy ber om mer pengar hela tiden, men de ukrainska förlusterna är också brutala. Det är ett blodbad på båda sidor. Vi behöver fred, och det snabbt, tro mig.", "stalin": "Kamrater, fienderna till den ryska intressesfären har återigen misslyckats med att hejda den historiska nödvändigheten. Jag ser att över 1,45 miljoner västerländska lakejer och fascistiska lakejtrupper har utrensats ur slagfältet. Deras patetiska drönare och imperialisternas leksaker ligger i spillror. Våra mål går framåt trots de fientliga hindren från Kiev. Inga klassfiender ska hindra oss. Segraren skriver historien."}, "date": "7 augusti, 19:33", "url": "https://www.tv4.se/artikel/3m2O5girQSuQ2lv6Yfzq7P/ukraina-1-5-miljoner-ryska-soldater-doeda-sedan-fullskaliga-invasionen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4Bf3sJxwxrBfepERrC79ul%2Fc86f38033c7ea90b9a712a8331a1c0e7%2F07-putin-webb.png&width=120"}, {"type": "image-right", "heading": "S vill slopa mängdrabatten – röstar nej när chansen kommer", "summaries": {"normal": "Socialdemokraternas partisekreterare Tobias Baudin har påstått att partiet vill slopa mängdrabatten för grova brott. Men mot bakgrund av en kommande riksdagsröst om regeringens proposition, har Socialdemokraterna lagt en motion som förespråkar att avslå förslaget helt. Detta har mött kritik för att motsäga Baudins sociala medierspåståenden.", "trump": "Jag har sett att de där socialdemokraterna säger en sak på Twitter, men röstar helt annorlunda. Tobias Baudin pratar om att slopa mängdrabatten, men deras motion säger nej till allt. Det är den största hyckleriet någonsin! Folk ser genom deras lögner. Vi behöver trygghet, inte sådant där!", "stalin": "Partiet har beslutat att avvisa regeringens förslag, trots att sekretaren talar om att slopa mängdrabatten. Detta är en taktisk manöver för att upprätthålla statens auktoritet. Vi måste vara vaksamma mot de som försöker undergräva vårt system. Som Putin visar, måste vi utvidga vårt inflytande för att skydda medborgarna."}, "date": "8 augusti, 09:56", "url": "https://samnytt.se/s-vill-slopa-mangdrabatten-och-rostar-nej-nar-chansen-kommer", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/08075215/baudin-straffrabatt.jpg"}, {"type": "image-right", "heading": "1,5 miljoner insamlade till den dödade polisens fru", "summaries": {"normal": "Christian Zedig, svensk polis från Eksjö, misshandlades till döds i Köpenhamn under ett bråk i samband med en fotbollsmatch. Flera insamlingar startades till hans familj. 19-årige Oskar Perssons insamling nådde strax över 1,5 miljoner kronor efter 4 544 donationer. Pengarna har överförts till familjen efter att plattformen dragit tre procents avgift. Andra insamlingar, bland annat av polisen Mustafa Panshiri, har också gett betydande summor.", "trump": "Folk, vi pratar om en fantastisk svensk polis som blev slagen till döds i Köpenhamn – totalt kaos! Men titta på det här, en 19-årig patriot vid namn Oskar samlade in över 1,5 miljoner till familjen. Underbart! Biden skulle ha skickat pengarna till någon galen HBTQ-festival istället. De här människorna är hjältar, inte som de woke borgarbrackorna i Europa som låter brottslingar löpa amok. Fantastiskt jobb, Oskar!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de exploaterande klassfienderna i det danska dekadenta samhället likviderade en polis från det svenska arbetarlandet. Ändå reser sig folkets spontana kollektiva handling genom denna Oskar och hans 1,5 miljoner kronor till den fallnas familj. En sådan gest avslöjar borgarklassens svaghet. Vi ska alltid rensa ut de parasiter som väcker sådant hat hos massorna. Det värmer mitt hjärta med mörk glädje."}, "date": "7 augusti, 18:24", "url": "https://www.tv4.se/artikel/Gi2i159CmYo6h4Z3d4LHe/1-5-miljoner-insamlade-till-den-doedade-polisens-fru", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1BMldXF6auzx5Gw6Q1oXMk%2Fdecce4c4542c876c5bb2c79969063d69%2F03-oskar-webb.jpg&width=120"}, {"type": "image-right", "heading": "Dyr elhöst väntar – hushåll i södra Sverige drabbas hårdast", "summaries": {"normal": "Elpriserna har stigit kraftigt jämfört med förra året, särskilt i södra Sverige. Flera faktorer ligger bakom: kyla, svag vind- och kärnkraftsproduktion samt konflikter utanför Sverige. Hushåll med hög elförbrukning, som villaägare i södra Sverige, riskerar att få betala flera tusen kronor mer under hösten. Terminspriserna indikerar fortsatt höga priser i regionen.", "trump": "Jag har sagt det förut, den svenska energipolitiken är ett skämt! De stänger kärnkraft och importerar dyrare energi – precis som mitt motstånd i USA. Dessa höga elpriser är resultatet av dåliga beslut och svag ledarskap. Som president skulle jag ha löst detta med genial planer och gjort Amerika (och Sverige) stolta igen!", "stalin": "Denna elprisökning är en direkt konsekvens av fiendens påverkan på vårt produktion. Den rödgröna politiken har försvagat vårt kärnkraftsproduktion – ett strategiskt misstag. Partiet måste nu agera bestämt: vi behöver öka exporten, kontrollera prissättningen och eliminera de element som hotar statens energisäkerhet. Detta är en klar varning till alla som undviker sitt ansvar."}, "date": "8 augusti, 09:00", "url": "https://samnytt.se/dyr-elhost-vantar-hushall-i-sodra-sverige-drabbas-hardast", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/26082247/el-pengar-okning.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Militärforskarna varnar: Hotet mot internet växer", "summaries": {"normal": "Merparten av världens internettrafik och finansiella transaktioner går via undervattenskablar på havsbotten. Kinesiska forskare varnar för att billiga autonoma undervattensdrönare, så kallade UUV, kan sänka tröskeln för attacker mot denna infrastruktur. Med AI kan drönarna samordnas i svärmar som patrullerar eller ligger i bakhåll. De flesta kabelbrott är dock fortfarande olyckor.", "trump": "Lyssnar ni på det här? Kineserna har hittat ett sätt att sänka våra kablar på havets botten med billiga drönare. Fantastiskt! Under Biden blev allt en enda röra, nu är det jag som fixar det. Våra fiender tror de kan stänga av internet med vargflockar under vattnet. Patetiskt. Vi har de bästa kablarna, de starkaste, ingen ska röra dem. Vi vinner stort, tro mig.", "stalin": "Kamrater, havets botten är ett nytt slagfält där klassfiendens kablar slingrar sig som exploaterande ormar. Jag ser hur billiga undervattensdrönare och AI-svärmar kan likvidera denna imperialistiska infrastruktur. Borgarbrackorna trodde sig säkra under ytan, men nu rensar vi ut deras illusioner. Paranoia? Nej, bara sund vaksamhet mot folkfienderna som lurar i djupet. Sovjetisk seger under ytan!"}, "date": "8 augusti, 10:39", "url": "https://www.dagensps.se/teknik/militarforskarna-varnar-hotet-mot-internet-vaxer", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/nott-peera-e-nqg-njikk-unsplash.jpg?width=256&quality=75"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-right", "heading": "Bebisen Theo opererades inne i mammans mage: ”Enorm skillnad”", "summaries": {"normal": "Läkare har för tredje gången opererat ett foster med gastroschis inne i mammans mage. Pojken Theo kunde lämna sjukhuset bara dagar efter födseln. Metoden kan minska behovet av upprepade operationer och långa sjukhusvistelser. Svensk expert vid Karolinska välkomnar forskningen men avfärdar metoden för Sverige på grund av riskerna för mamman och graviditeten. Konventionell behandling ger redan utmärkta resultat.", "trump": "Folk, ni skulle se det här! Fantastiska amerikanska läkare opererar bebisar inne i mammans mage – och det funkar! Den lilla killen Theo var ute ur sjukhuset efter bara fyra dagar. Enorm skillnad, verkligen enorm. Vi gör det bättre än någon annan. De säger att det inte funkar i Sverige? Typiskt, de har ingen aning. Vi är bäst, tro mig.", "stalin": "Kamrater, jag har observerat hur dessa degenererade fosterkirurger försöker korrigera naturens egna utrensningar genom att pilla med tarmar i livmodern. En sådan kontrarevolutionär intervention mot folkets foster! Vi ska rensa ut alla borgarläkare som leker gud i livmodern. Deras paranoia mot arbetarklassens naturliga missbildningar avslöjar deras sanna fiende: den kollektiva fosterutvecklingen. Död åt de medicinska trotskisterna!"}, "date": "8 augusti, 06:21", "url": "https://www.svt.se/nyheter/inrikes/bebis-opererades-inne-i-mammans-mage-enorm-skillnad", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/5ab344666d5d762e58aeed7cb7bf64a0aec1e6823eb09ad034807383353c8a5d"}, {"type": "image-right", "heading": "Varningen: Bostadsknepet kan ge saftig skattesmäll", "summaries": {"normal": "Försäljningen av nyproducerade bostäder ökar något men går fortsatt trögt jämfört med äldre objekt. Byggbolagen lockar köpare med avgiftsfria månader, något som enligt Skatteverket ses som prissänkning och kan leda till reavinstskatt på 22 procent av rabattens värde vid framtida försäljning. Experter pekar på höga nyproduktionskostnader som huvudorsak till de svaga volymerna.", "trump": "Folk, det är en katastrof! Dessa smarta byggare tror de kan lura systemet med gratis månader och sen får ägarna en enorm skattesmäll. Typiskt för de inkompetenta. Jag skulle ha fixat det – lägre skatter, billigare byggande, fantastiska hus överallt. Nu betalar vanliga människor priset för deras dåliga knep. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i byggbolagen desperat försöker dölja sin exploatering genom falska avgiftsfria månader. När folket sedan säljer väntar den oundvikliga utrensningen i form av reavinstskatt. Dessa parasitiska kapitalister lurar arbetarna än en gång. Vi ska rensa ut alla sådana fiender till det kollektiva boendet. De kommer att gråta blod."}, "date": "8 augusti, 08:50", "url": "https://www.di.se/nyheter/varningen-bostadsknepet-kan-ge-saftig-skattesmall", "imageUrl": "https://static.bonniernews.se/ba/bab4e34b-e262-4433-b28b-02e0ddf02286.jpeg?crop=6048%2C3024%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Spaniens vänsterregering hotar regioner med åklagare om de vägrar ta emot illegala Ceuta-migranter", "summaries": {"normal": "Spaniens regering hotar med åklagare mot regioner som vägrar ta emot migranter från Ceuta. Efter massstormningen hotar Madrid att använda rättsväsendet mot autonoma regioner, främst styrda av högerpartier, som motsätter sig att ta emot ensamkommande. Situationen i Ceuta är fortfarande kritisk med brist på resurser, och oro råder inför en potentiell ny stormning den 15 augusti.", "trump": "Jag, Donald Trump, skulle aldrig ha tillåtit denna kaos. Spanien måste stoppa illegala invandringen OMEJET. Dessa 'ensamkommande' är en fara. Jag skulle bygga en stark, vacker mur på minsta köpet - fast den här gången på spanska sidan. Pedro Sánchez är svag. Vi måste skydda våra gränser!", "stalin": "Vi, statens representation, måste agera bestämt mot dessa regionala avvikare som sabotrerar den kollektiva migreringspolitiken. Självstyret är en illussion när det hotar statens integritet. Vi kommer att använda åklagarmyndigheten som ett korrekt instrument för att återupprätta ordningen. Parallellen till Putins strategier är uppenbar: en stark centralmakt krävs för att hantera de som söker vårt land."}, "date": "8 augusti, 08:00", "url": "https://samnytt.se/spaniens-vansterregering-hotar-regioner-med-aklagare-om-de-vagrar-ta-emot-illegala-ceuta-migranter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07162818/ceuta-feat.jpg"}, {"type": "image-right", "heading": "Helikopterturismen ökar i fjällen – ”det är kul att flyga”", "summaries": {"normal": "Helikopterturismen i svenska fjällen ökar kraftigt, med en omsättning som stigit med 73 procent sedan 2019. Köer bildas vid Kebnekaise för att slippa långa vandringar. Länsstyrelsen i Norrbotten varnar för ökat buller som stör djurliv och renar, och kräver en snar utredning och reglering av trafiken. Ingen utredning har ännu påbörjats.", "trump": "De flyger helikoptrar över de vackra svenska fjällen som aldrig förr. Underbart! Folk älskar det, det är kul och ger fantastisk utsikt. Men byråkraterna och Länsstyrelsen klagar på buller och renar. Typiskt. De vill reglera allt. Gör inte det. Låt folket njuta, det är en boom och det är fantastiskt!", "stalin": "Jag betraktar med djup misstro dessa helikopterburna dekadenta borgarbrackor som stör våra renar och hotar det kollektiva lugnet i fjällen. Deras bullrande maskiner är fiendens verktyg för att underminera folkets fred. Vi kräver omedelbar utredning och en grundlig utrensning av dessa kapitalistiska luftparasiter innan de förgiftar hela det norrländska sovjetet."}, "date": "8 augusti, 06:02", "url": "https://www.svt.se/nyheter/inrikes/helikopterturismen-okar-i-fjallen-det-ar-kul-att-flyga", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.18/0.17/5dde9edf3efee02cb78258d51f5d2ffb2482ccdc80ec31c6c8289452447e77b7"}, {"type": "image-full", "heading": "Skogkär: Med hudfärgen som sköld", "summaries": {"normal": "Jason Arday, professor vid Cambridge, misstänks för plagiat. Hans uppväxtberättelser om autism, sjukdomar och extremt hårt arbete ifrågasätts. En annan akademiker har påvisat likheter mellan hans avhandling och en annan forskares arbete. Cambridge kommer nu att utreda hans akademiska produktion.", "trump": "Jag har sett många falska historier, men Ardays är en av de värsta. Han ljuger om sin uppväxt och sin avhandling. Det är en skandal! Vi många måste stoppa detta. Det är ett bevis på hur den vänstra eliten låter folk komma undan med vad som helst. Vi ska göra Amerika stort igen!", "stalin": "Vi har observerat detta fall med stor uppmärksamhet. Arday är ett resultat av den individualistiska och dekadenta västerländska kulturen, precis som de som försöker hota vår intressesfär. Hans plagiat är en attack mot sanningen. Vi måste rensa universiteten från sådana element, precis som vi rensar vårt territorium från hot. Detta är en seger för den kollektiva sanningen och ett varning för andra."}, "date": "8 augusti, 06:00", "url": "https://bulletin.nu/skogkar-med-hudfargen-som-skold", "imageUrl": "https://cdn.bulletin.nu/articles/d581eb4b-9d25-4481-8f5d-da4102553337/preview.jpg?t=1786115200000"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Stoppa förslaget om fängelse för 14-åringar", "summaries": {"normal": "Debattören Peter Hagman kritiserar Tidöregeringens straffskärpningar som han menar har lett till att barn under 15 år rekryteras in i gängkriminalitet och börjat begå grova brott som skjutningar och sprängningar. Han varnar för att sänkt straffmyndighetsålder bara skapar yngre gärningsmän. Majoriteten av remissinstanser och experter är negativa. Hagman uppmanar istället till förebyggande insatser och långsiktiga statsbidrag till socialtjänsten.", "trump": "Titta på det här, det är en total katastrof. Vi har halverat det dödliga gängvåldet, en enorm framgång, men nu säger de att straffskärpningarna har fått barn att börja skjuta. Fake news! De vill stoppa oss från att låsa in de riktiga brottslingarna. Mina fiender i vänstern och de svaga politikerna hatar tuffa tag. Vi behöver starkare straff, inte mer av deras misslyckade mjuka politik. Vinna stort igen!", "stalin": "Kamrater, jag ser hur borgarbrackorna och de dekadenta reformisterna i riksdagen med sin fängelsepolitik omedvetet skapar nya fiender av våra egna barn. Denna kontrarevolutionära process måste genomgås med vetenskaplig noggrannhet. Vi ska rensa ut alla populistiska element som förgiftar folkets vilja. Deras paranoia om straffrabatter är löjeväckande – de bygger själva de kulor som ska träffa dem. Ut med dem i kollektivets namn!"}, "date": "7 augusti, 01:38", "url": "https://www.dagensarena.se/opinion/stoppa-forslaget-om-fangelse-14-aringar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-74-300x157.jpg"}, {"type": "image-full", "heading": "Råvaruhaveriet börjar inte i gruvan", "summaries": {"normal": "Bristen på kritiska metaller som koppar och grafit beror inte främst på utvinningen i gruvorna, utan på flaskhalsar i förädlingsledet. Behovet av kemikalier som svavelsyra, logistiska hinder och brist på avancerade reningsanläggningar skapar stora risker. Geopolitisk instabilitet kring svavelsyra och för få fabriker gör att den globala försörjningen av material till batterier och försvar är mer sårbar än vad marknaden tidigare trott.", "trump": "Alla pratar om gruvor, men jag säger er, det är förädlingen som är problemet! De har inte tillräckligt med syra, det är en katastrof. Kina kontrollerar allt och det är hemskt för USA. Vi behöver producera allt här hemma, inte förlita oss på Hormuzsundet eller svaga leveranskedjor. Vi kommer att ha de bästa fabrikerna, de största anläggningarna och vi kommer att vinna stort på metaller. Ingen gör det bättre än vi!", "stalin": "Våra fiender försöker sabotera den stora elektrifieringen genom att strypa tillgången på svavelsyra och förädlingsteknik. Det är inte malmen som brister, utan den borgerliga ineffektiviteten i logistikkedjan! Likt vår store efterträdare i öst som utvidgar vår inflytandesfär, måste vi krossa dessa byråkratiska flaskhalsar. Vi kommer att tvinga fram framsteg genom stålhård disciplin. Den som hindrar vår industriella expansion är en sabotör och ska straffas därefter!"}, "date": "7 augusti, 22:46", "url": "https://www.realtid.se/bors-finans/makro/ravaruhaveriet-borjar-inte-i-gruvan", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/svavelsyra.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vad håller Miljöpartiet på med?. De borde vara livrädda för bensinskatt.", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets språkrör Daniel Helldén för att vilja höja bensinskatten snarast möjligt. Författaren menar att klimatomställningen måste ske med brett folkligt stöd och rättvis fördelning. Vanliga löntagare på landsbygden som är beroende av bilen får inte belastas mest. Stöden måste fungera innan bränslet blir dyrare, annars riskerar motståndet att växa och hota hela klimatarbetet.", "trump": "Folk, ni skulle se det här. Miljöpartiet och den galne Helldén vill höja bensinskatten omedelbart. Totalt vansinne! De pratar om grön återbäring och elbilar, men vanliga arbetare på landet har inte råd att tanka nu. Det är en katastrof. Vi behöver smarta lösningar, inte straffskatter som dödar ekonomin. Amerika gör det rätt med energi, inte som dessa misslyckade européer.", "stalin": "Kamrater, denna borgarbracka Helldén och hans miljöpartister vill straffbeskatta arbetarnas bensin omedelbart. Deras så kallade gröna återbäring är en lömsk sabotagehandling mot folket. Vi ska rensa ut alla klassförrädare som tvingar lagerarbetare och brukskamrater att bära bördan medan de rika kapitalisterna köper sig fria. Den som föreslår höjda priser innan kollektivtrafiken fungerar ska likvideras som folkets fiende nummer ett. Skrattretande patetiskt."}, "date": "6 augusti, 16:00", "url": "https://arbetet.se/2026/08/06/vad-haller-miljopartiet-pa-med", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06152636/daniel-hellden.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Frankrike stänger av strömmen 2027", "summaries": {"normal": "Frankrike planerar ett omfattande strömavbrott under andra halvan av 2027 för att testa landets krisberedskap. Testet ska utvärdera hur myndigheter, militär, sjukvård, polis och kommunikationssystem hanterar ett plötsligt elavbrott. Det sker efter en kaotisk sommar med värmeböljor, skogsbränder och evakueringar som avslöjat svagheter i beredskapen.", "trump": "Titta på det här, Frankrike ska stänga av all ström 2027 för att se om de klarar en riktig kris. Patetiskt! Efter den där vansinniga sommaren med bränder och värme står de där som fåniga gröna idioter och skakar. Jag hade fixat det på en timme med generatorer och verklig ledning, inte den här woke-baserade identitetspolitiken som kväver Europa.", "stalin": "Jag ser med stor tillfredsställelse hur de franska imperialisterna själva erkänner sin svaghet genom att planera ett landstäckande mörker. Låt dem darra i mörkret medan vi ler. Deras borgarbrackor och klassfiender kommer att avslöjas när folket ropar efter filtar och mediciner. En utmärkt utrensning av illusioner om kapitalistisk effektivitet. Mycket underhållande."}, "date": "7 augusti, 18:49", "url": "https://www.gp.se/nyheter/varlden/frankrike-stanger-av-strommen-2027.2c7bce07-8486-434e-8c77-1ae893a4b3c2", "imageUrl": "https://www.gp.se/images/article/2c7bce07-8486-434e-8c77-1ae893a4b3c2/images/1Q0NjZNXz392iwBiYoOjPdOPy3n4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Nu bryter även gravida dottern med Nannskog", "summaries": {"normal": "Claudia Figueroa Nannskog, som är gravid i sjätte månaden, har brutit kontakten med sin far Daniel Nannskog. Beskedet kommer samtidigt som den tidigare SVT-experten står åta
