pratar om att staten ska ta över välfärden men kan inte förklara sina egna planer. Jag ser giriga hyenor som försöker dölja sin oförmåga. Ett sådant lättsinne förtjänar utrensning ur varje seriös diskussion. Det är löjeväckande."}, "date": "28 augusti, 06:52", "url": "https://arbetet.se/2026/08/28/ebba-busch-och-simona-mohamsson-gor-parodi-pa-politiken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28064931/parodi-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "image-full", "heading": "V-ledaren pressas om antisemitism", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i SVT:s Utfrågningen om antisemitism inom partiet. Hon medgav att partiet borde upptäckt de avslöjade personerna tidigare. Dadgostar hänvisade till partiets Palestina-engagemang som förklaring och avfärdade jämförelser med Sverigedemokraterna.", "trump": "Sveriges vänstern är en total katastrof, folket! Nooshi Dadgostar – vad för en namn ens? – pressas om antisemitism i sitt eget parti och skyller på Palestina. Vänstern älskar terrorister! Och så säljer de kartor utan Israel. Sjuka skygglappar! De kvoterar in alla möjliga galningar. SADAN självhävdelse!", "stalin": "Detta är intressant. En partiledare som medger svaghet inför allmänheten – typiskt för borgarpressens utfrågningar. Att klassfiender söker sig till hennes parti bekräftar bara deras ideologiska förvirring. Vi hade rensat ut dem AllaBryter snabbare och mer grundligt. Debil kartförsäljning är rätt sortens provokation från imperialisterna."}, "date": "27 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-pressas-om-antisemitism/cG9zdDoxNzY1NjY", "imageUrl": "https://images.kvartal.se/2026/08/e354013f-dadgostar.webp"}, {"type": "text", "heading": "Boliden och H&M i botten när börsen slutade på minus", "summaries": {"normal": "Stockholmsbörsen slutade torsdagen på minus efter en lunchuppgång. Boliden och H&M tyngde med nedgångar på 2,8 respektive 2,4 procent. Teknologi steg medan energi föll. Elon rusade 27,9 procent efter vinstvändning. Hexagon och Nibe steg 1,4 procent.", "trump": "Jag ser att svenska börsen gick ner, men inte som jag. Boliden och H&M, stora förlorare – de kan inte hantera framgång som min administration. Men Elon, upp 27,9 procent – det är vinnare! Alla vill ha en bit av USA:s ekonomi. Börsen, den är fejk, men jag är äkta!", "stalin": "Kamrater, börsen visar kapitalismens förfall. Boliden och H&M, fiender till folkets ekonomi, ska utrensas! Elon däremot – en god kamrat som steg 27,9 procent. Vi firar teknologins seger över energispekulanter. Men misstankar kvarstår: Hexagon och Nibe måste övervakas. Partiet ser allt."}, "date": "27 augusti, 17:56", "url": "https://www.affarsvarlden.se/artikel/boliden-och-hm-i-botten-nar-borsen-slutade-pa-minus"}, {"type": "image-right", "heading": "Högsta betyg åt skildring av musik bakom galler", "summaries": {"normal": "Recensionen hyllar filmen Primavera som en gripande skildring av kvinnoförtryck, ensamhet och utsatthet i 1700-talets Venedig. Den handlar om barnhemsflickor som tränas till musiker men tvingas gifta bort sig vid vuxen ålder. Regisserad av Damiano Michieletto med Antonio Vivaldi som central figur får filmen högsta betyg av recensenten.", "trump": "Den här filmen Primavera är en total vinnare, folk. Den visar hur de riggade systemen håller nere begåvade kvinnor, precis som de riggade medierna gör med mig. Vivaldi, den stora kompositören, han skulle älska det. Fantastisk musik, vackra bilder, bättre än Tár. Höstens absolut bästa film, ingen gör det bättre än italienarna, tro mig.", "stalin": "Vi ser här hur den dekadenta borgarklassen under feodalismens mask förslavade arbetarkvinnorna genom att förvandla deras musikaliska talang till en handelsvara. Denna film blottlägger det borgerliga fängelset med galler och brännmärken. Ett utmärkt verk som visar att endast genom kollektiv kamp kan sådana utsugningssystem krossas. Mycket underhållande utrensning av illusioner."}, "date": "27 augusti, 13:06", "url": "https://www.dagensarena.se/innehall/hogsta-betyg-at-skildring-av-musik-bakom-galler", "imageUrl": "https://www.dagensarena.se/files/2026/08/primavera-1-300x157.jpeg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att SD:s vision om ett etniskt homogent Sverige är orealistisk, då många invandrare är en integrerad del av arbetskraften och motstånd mot partiets politik är möjligt.", "trump": "Folk, ni måste se det här – det är en katastrof för de svenska nationalisterna! Tjugo lata somaliska bussförare strejkar mot en enkel annons om att åka hem. De lovar ett rent Sverige men kan inte ens få bussarna att rulla utan sina kvoterade mångfaldschaufförer. Patetiskt! De woke bussarna och deras offermentalitet förstör allt. Sad!", "stalin": "Kamrater, se hur de rasande klassfienderna inom högerpopulismen förgiftas av sina egna lögner. Tjugo arbetare av somalisk börd, de sanna produktiva krafterna, vägrar lyda de fascistiska budskapen och visar att borgarbrackornas dröm om etnisk utrensning är dömd att krossas. Motståndet lever. Arbetarna har makten att låta bli. Skräckinjagande för folkförrädarna."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();

        if ('serviceWorker' in navigator) {

                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))

            });

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
