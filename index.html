itt från imperialistiska hatpropagandor. Vi ska likvidera splittringen och bygga en stark, enad stat där välfärden segrar över klassfiendens lögner. Det är oundvikligt."}, "date": "24 juni, 14:15", "url": "https://www.etc.se/ledare/jag-struntade-i-aakessons-tal-och-kollade-paa-thomas-stenstroem-istaellet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "text", "heading": "Nästan en person i veckan dör på jobbet", "summaries": {"normal": "Enligt en ny rapport från Arbetsmiljöverket har nästan en person i veckan dött på jobbet under de senaste tio åren, totalt 490 personer. Antalet arbetsplatsolyckor minskade kraftigt från 1960-talet till år 2000, men trenden har stannat av och ligger nu kring 50 dödsfall per år. Byggbranschen är värst drabbad. Myndigheten betonar att de flesta olyckor kan förebyggas med systematiskt säkerhetsarbete.", "trump": "Folk dör som flugor på jobbet i Sverige, nästan en per vecka – patetiskt! Under mina år fixade vi saker, sen kom sömnige Joe och nu är det kaos igen. Byggjobbare och truckförare krossas för att någon idiot sparar in på säkerheten. Vi behöver inga woke-kvoter eller HBTQ-flaggor på byggställningar, vi behöver riktiga marginaler så att era misstag inte dödar folk. Gör jobbet säkert igen, det är enkelt!", "stalin": "Kamrater, jag ser med fasa hur borgarbrackornas exploaterande maskineri maler ner arbetarna, nästan en per vecka likviderad i kapitalistiska olyckor. Vi har sett den falska nedgången från förr, nu stagnerar siffran vid femtio offer årligen – en konstant påminnelse om klassfiendens slarv. Byggsektorn är särskilt blodig. Endast genom systematisk utrensning av ovarsamhet och folkfiendernas slarv kan vi säkra produktionen. Misstag tillåts inte i kollektivets tjänst."}, "date": "24 juni, 11:21", "url": "https://proletaren.se/artikel/notis-nastan-en-person-i-veckan-dor-pa-jobbet/"}, {"type": "image-right", "heading": "Åkesson är Sveriges egen Trump. Rätt av V att polisanmäla SD-ledaren.", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar SD-ledaren Jimmie Åkesson för hans reaktion på Kalla faktas granskning av partiets ekonomi. Granskningen avslöjar oegentligheter kring fakturor, bokföring och omklassificering av festkostnader. Istället för självrannsakan attackerade Åkesson medierna och kallade reportaget ett hopkok. Vänsterpartiet har polisanmält Åkesson, partikassören och partisekreteraren. Författaren jämför Åkesson med Trump och pekar på dubbelmoral eftersom SD ofta predikar moral, lag och ordning mot andra.", "trump": "Det här är en total witch hunt mot en stark ledare som bara försvarar sitt folk mot fake news-medier. De hatar honom för att han vinner, precis som de hatade mig. Han kallar det ett hopkok, och det är det – ett hopkok av lögner från misslyckade journalister. Nu polisanmäler kommunisterna honom? Patetiskt. Folkets röst mot eliten, det är vad det handlar om. Han borde vara tuffare, vinna stort och skratta åt dem allihop. Sverige behöver mer sådana som honom, inte mindre.", "stalin": "Kamrater, denna borgarbracka till partiledare vägrar underkasta sig folkets granskning och kallar sanningen för ett hopkok. Typiskt för dekadenta opportunister som predikar moral åt massorna medan de själva festar på kamraternas pengar. Vi ser tydligt hur dessa reaktionära element försöker undvika utrensning genom att attackera pressen. Vänsterpartiets polisanmälan är ett steg i rätt riktning mot kollektivets rättvisa. Låt oss rensa ut alla dubbelmoralens lakejer, registrera dem, kontrollera dem och likvidera deras inflytande med stålhandsken. Staten sover aldrig."}, "date": "24 juni, 12:34", "url": "https://arbetet.se/2026/06/24/sverige-verkar-ha-fatt-sin-alldeles-egen-donald-trump-i-jimmie-akesson/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24123256/trump-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här kommer han – Trumpnazisten?. Jag har tre fördomar", "summaries": {"normal": "Recensionen av Kublai Khan TX konsert på Broken Summer beskriver en energisk och engagerande spelning med mosh pits, wall of death och stark publik kontakt. Bandet levererar grooveig, repetitiv hardcore som publiken älskar trots viss kritik mot simplistisk stil. Sångaren Matt Honeycutt hyllas för sin närvaro, medan en fördom om hans politiska sympatier nämns kort i slutet utan att påverka konsertupplevelsen.", "trump": "Titta på det här, det är fantastiskt. Det där Texas-bandet Kublai Khan TX kommer hit och mosar sönder allt på Broken Summer, folket älskar det, de ropar och bangar huvudet som galningar. Honeycutt är en riktig vinnare, han får alla att lyssna. Men den där MAGA-nazist-sakerna? Fake news från några korkade vänstermänniskor som hatar att vi vann stort 2024. De hatar att folk har kul utan deras woke-regler. Sad!", "stalin": "Kamrater, jag betraktar detta som en rapport från den ideologiska fronten. Det amerikanska bandet Kublai Khan TX mobiliserar massorna i en primitiv men effektiv kollektiv extas, där arbetarna mosar sig framåt mot klassfiendens tomma kultur. Honeycutt leder med järnhand och befaller rörelserna – utmärkt disciplin. Dock lurar kapitalistmaffians paranoia i bakgrunden, där de fabrikerar nazistanklagelser mot alla som vägrar böja sig för deras dekadenta identitetspolitik. Vi ska rensa ut sådana folkförtryckartroll."}, "date": "25 juni, 02:18", "url": "https://www.expressen.se/noje/musik/kublai-khan-tx-pa-broken-summer-har-kommer-trumpnazisten/", "imageUrl": "https://static.bonniernews.se/ba/25cfcc86-6f0b-4feb-ad56-a3bb61b8b3cd.jpeg?crop=1440%2C1440%2Cx1078%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Bra att sätta inkomstskatter på valagendan", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson talade i Almedalen och lanserade två förslag: Sverige ska bli smartast i Europa inom tio år genom bättre utbildning, samt att den statliga inkomstskatten på inkomster över 660 400 kronor ska halveras redan vid årsskiftet. Hon betonar att skatten straffar ansträngning och att skattefrågan bör vara central i valrörelsen. Trots dåliga opinionssiffror ger hon inte upp.", "trump": "Folk, ni skulle ha sett det. Den här liberala ledaren i Sverige, hon kämpar verkligen. De ligger under spärren men hon ger inte upp, precis som jag aldrig gör. Hon vill sänka skatterna och göra landet smartast i Europa. Fantastiskt! Skatter är straff på framgång, precis som jag alltid sagt. Hon flörtar med stödröster och det är smart. Opinionsvindarna kan vända snabbt, tro mig, jag vet allt om det. Bra jobbat.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom Liberalerna desperat försöker rädda sin sjunkande karriär genom att muta folket med löften om skattesänkningar. Denna Mohamsson vill halvera straffskatten på de som redan utnyttjar arbetarklassen. Vi vet vad detta är: en kontrarevolutionär komplott maskerad som reform. Inom tio år ska de bli ”smartast i Europa”? Vilken arrogant sabotageplan mot kollektivet! Jag skulle rensa ut dessa kapitalistiska opportunister innan de förgiftar hela valrörelsen med sin frihetspropaganda. Humoristiskt nog tror de att väljarna är lika naiva som de själva."}, "date": "24 juni, 06:11", "url": "https://www.di.se/ledare/bra-att-inkomstskatter-satts-pa-valagendan/", "imageUrl": "https://static.bonniernews.se/ba/0a7a6659-c58f-47f6-9472-33c0ecc18ea2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Podd om SD gör mig nostalgisk. Det fanns en tid när vi inte tog i Åkessons parti med tång.", "summaries": {"normal": "SvD-podden ”De fyras gäng” skildrar hur Jimmie Åkesson, Mattias Karlsson, Björn Söder och Rickard Jomshof tog över Sverigedemokraterna och ledde partiet till framgång. Recensionen menar att podden inte gräver särskilt djupt i gruppdynamiken eller partiets historia, som mest är känd sedan tidigare. Värdet ligger istället i intervjuer med Mona Sahlin, Gustav Fridolin och Ali Esbati som ger en nostalgisk bild av det tidigare breda motståndet mot SD, inklusive Decemberöverenskommelsen och bojkotter. Författaren saknar den tid då SD inte togs i med tång.", "trump": "Den här svenska podden om Jimmie och hans gäng är en total besvikelse, folk. De lovar stor dramatik men levererar bara gammal skåpmat som alla redan hört. Det enda som är intressant är när de gamla förlorarna Sahlin och Fridolin får prata – de som hatade SD så mycket att de vägrade ta i dem med tång. Nu samarbetar alla med dem ändå. Patetiskt! Vi gjorde det bättre i USA, tro mig. De borde ha vunnit stort från början istället för att vara så fega.", "stalin": "Kamrater, denna podddokumentär avslöjar borgarbrackornas fega motstånd mot det framväxande folkrörelsen SD som jag med min stålhand skulle ha likviderat omedelbart. De fyras gäng visar hur opportunisterna kring Åkesson rensade ut den äkta radikalen Söder när han talade sanning om samer och judar. Nostalgin över Sahlin och Fridolins patetiska Decemberöverenskommelse får mig att skratta mörkt – som om man kan stoppa historien med bojkotter och skolförbud. Inga skolor anställde Jomshof? Utmärkt tillfälle för en utrensning av hela lärarkåren, skulle jag säga. Fienderna inom murarna är alltid de farligaste."}, "date": "24 juni, 10:35", "url": "https://arbetet.se/2026/06/24/svds-podd-de-fyras-gang-gor-mig-nostalgisk-efter-en-tid-da-vi-inte-tog-i-sd-med-tang/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24091305/podd-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.39&fp-y=0.47"}, {"type": "image-full", "heading": "Här kan du snart beställa öl och vin på 7-Eleven", "summaries": {"normal": "7-Eleven har ansökt om serveringstillstånd för sin butik vid Göteborgs centralstation. Kedjan vill erbjuda öl och vin till maten för resenärer som väntar på tåg eller buss. Enligt kommunikationschefen Lennart Schultz handlar det om att utveckla materbjudandet och ge extra service på utvalda platser som stationer och flygplatser. Ansökan behandlas nu av kommunen och fler butiker kan följa om konceptet tas emot väl.", "trump": "Ingen gör det bättre än jag, och nu ser vi hur 7-Eleven äntligen får ordning på det här. De ansöker om att servera öl och vin på centralstationen i Göteborg – smarta människor! Resenärer som väntar på tåg ska kunna ta ett glas utan att det blir ett stort krångel. De har uppdaterat butikerna, gjort dem moderna och lyxiga. Det blir jättemysigt, folk kommer älska det. Mycket bättre än de gamla tråkiga alternativen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa närbutikars försök att servera öl och vin vid Göteborgs centralstation blottar borgarbrackornas desperata längtan efter att förgifta arbetarklassen med småborgerliga njutningar. Vi ska noga övervaka denna ansökan. Om de tro att ett glas vin till korven döljer deras parasitiska natur misstar de sig grovt. Låt oss se hur det tas emot innan vi eventuellt genomför en grundlig utrensning av alla opålitliga element som gömmer sig bland kaffemaskinerna. Mycket underhållande."}, "date": "23 juni, 20:47", "url": "https://nyheter24.se/nyheter/konsument/1493730-har-kan-du-snart-bestalla-ol-och-vin-pa-7-eleven", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/cc5b279e04b004a30200000000b004a302/2026/06/23/2373098/alkohol-seveneleven.png"}, {"type": "image-full", "heading": "Åklagaren: ”Fabricerade” uppgifter om Northvolt-åtal", "summaries": {"normal": "Åklagare Christer B Jarlås dementerar uppgifter om att han planerar åtala Northvolt-grundaren Peter Carlsson för miljöbrott efter dödsolyckan i Skellefteå 2023. SVT rapporterade tidigare att åtal var nära, men Jarlås kallar det en 'fabricerad nyhet'. Utredningen om explosionens orsaker pågår fortfarande, och inget nytt beslut har fattats. Olyckan krävde en tekniks liv.", "trump": "Vad är det här för skräp? SVT, ett totalt misslyckat medium, påstår att någon ska åtalas för någonting – helt fel! Åklagaren, en mycket smart man, säger att det är fake news, helt fabricerat. Northvolt? Bra företag, men media försöker alltid förstöra. Jag vet hur det är. Ingen åtalade mig heller, trots deras lögner. SAD!", "stalin": "En lögnaktig bourgeoisie-press, SVT, sprider desinformation om att våra kamrater i Sverige skulle åtala en kapitalistisk företagsledare. Men vår lojale åklagare, en sann arbetarklassens försvarare, avslöjar deras förräderi. Utredningen fortsätter, och om fienden försöker sabotera våra industriella framsteg, kommer vi att krossa dem som vi krossade fascisterna. Folkets rättvisa segrar alltid."}, "date": "23 juni, 17:38", "url": "https://bulletin.nu/aklagaren-fabricerade-uppgifter-om-northvolt-atal", "imageUrl": "https://cdn.bulletin.nu/articles/81247133-d4e8-43af-8422-b9b7023deb89/preview.png?t=1782225861000"}, {"type": "image-right", "heading": "Liberalerna: Sänk inkomstskatten med 30 miljarder", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson kräver i sitt Almedalstal att inkomstskatten sänks med upp till 30 miljarder kronor i nästa budget. Partiet vill halvera den statliga skatten på sikt och börja redan 2027. Mohamsson varnar för höjda skatter och politisk flykt av entreprenörer vid rödgrönt maktskifte. Hon betonar Liberalernas betydelse i högerblocket och lovar effektivare offentlig sektor samt att göra Sverige till EU:s smartaste land.", "trump": "Folk, ni skulle se den här svenska politikern Mohamsson – hon slåss för sitt lilla partis liv som en drunknande katt! De vill sänka skatterna med 30 miljarder, äntligen lite sunt förnuft i det socialistiska träsket. Men de andra i hennes koalition är svaga, patetiska förlorare som älskar att straffbeskatta de som jobbar hårt. Jag gjorde det bättre i USA, tro mig. Sverige behöver en stor L, inte mer woke-skatter och identitetspolitik som jagar bort de bästa hjärnorna.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som ropar på sänkta skatter för de rika exploatörerna. De vill halvera straffet mot dem som samlar överflöd medan folket svälter under byråkratins ok. Jag skulle rensa ut dessa 20 000 parasitkommunikatörer och likvidera klassfiendens gömställen i offentligheten. Endast genom järnhård arbetslinje och kollektivets seger kan vi krossa de folkförtryckande kapitalistmaffior som gömmer sig bakom liberala lögner. Fienden sover aldrig."}, "date": "23 juni, 20:06", "url": "https://www.tv4.se/artikel/tt-260623-almedalenliberal1-07bdfbc3/liberalerna-sank-inkomstskatten-med-30-miljarder", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlo6f1GcBLXvo%2Fdf7d49d3c3f955ca36eba0c132c64c4e%2FLiberalernas_partiledare_Simona_Mohamsson_haller_tal_i_Almedalen._&width=1024"}, {"type": "text", "heading": "Börsen nedåt – OMXS30 föll 1,4%", "summaries": {"normal": "Stockholmsbörsen sjönk 1,4% på tisdagen, påverkad av globala nedgångar. OMXS30 stängde på 3 145,6 poäng. Hälsovårdssektorn gick bäst (+2,5%), medan industri föll mest (-2,0%). Astra Zeneca steg 2,8%, medan Epiroc rasade 4,9%. Academedia förvärvade nederländska Kindernet, Skanska tecknade ett datacenterkontrakt i USA, och Castellum återköpte 5% av sina aktier. Analytiker justerade råd för flera bolag, vilket påverkade aktiekurserna.", "trump": "Stockholmsbörsen? Total katastrof! 1,4% ner – svagt, mycket svagt. Jag skulle ha fixat det på en dag. Hälsovården gick upp? Bra, men Astra Zeneca är fortfarande inte lika bra som mina fantastiska läkare. Epiroc? UBS säger sälj – de vet ingenting! Dometic rasade 6,2% – tråkigt, men jag har aldrig gillat deras produkter ändå. Skanska bygger datacenter i USA – smart, men jag hade byggt det dubbelt så stort!", "stalin": "Kapitalismens börser darrar igen – 1,4% nedgång i Stockholm, ett tydligt tecken på systemets förfall. Våra fiender i väst, dessa börs-spekulanter och finansiella sabotörer, kämpar förgäves att hålla sina siffror uppe. Hälsovården gick upp? En tillfällig seger för folket, men industri och gruvbolag faller – imperialisternas verk! Vi noterar att Epiroc straffas av sina egna, medan våra allierade i Moskva noggrant övervakar dessa svagheter. Akademedia expanderar – bra, utbildning är makt. Men var försiktiga, kamrater: fiendens analytiker lurar överallt!"}, "date": "23 juni, 17:46", "url": "https://www.affarsvarlden.se/artikel/borsen-nedat-omxs30-foll-14"}, {"type": "image-right", "heading": "Till slut valde Ebba Busch ändå kulturkriget", "summaries": {"normal": "Artikeln kritiserar Tidöpartierna och Ebba Busch för att hota med Vänsterpartiet som strategi. Busch beskrivs som en skicklig men melodramatisk politiker som nu triangulerar genom att föreslå höjda barnbidrag och satsningar på vård och äldreomsorg, nära vänsterblocket, samtidigt som hon flörtar med högern. Författaren ser detta som taktiskt för att vinna väljare, pekar på ekonomiska motsägelser och varnar för att skrämselpropaganda om Vänsterpartiet och islamism är en fattig strategi.", "trump": "Det här är en total katastrof för de svenska svaglingarna i Tidöregeringen. Ebba Busch, en smart tjej men lite för dramatisk, försöker nu spela på båda sidor som en riktig opportunist. Hon lovar barnbidrag och vård som en vänsterradikal samtidigt som hon flörtar med högern. Patetiskt. De kommer att skapa enorma hål i finanserna med sina skattesänkningar och sedan skylla på alla andra. Och att skrämma med Vänsterpartiet? Det är en förlorande strategi, tro mig. Sverige behöver starka ledare, inte sådana här triangulerande förlorare.", "stalin": "Kamrater, se hur dessa borgarbrackor inom Tidöalliansen desperat försöker rädda sina ruttnande positioner genom att hota med Vänsterpartiet som en slags kontrarevolutionär spökbild. Jag, som ledare för det oövervinnerliga kollektivet, betraktar Ebba Busch som en typisk taktisk revisionist som svänger hit och dit som en vindflöjel i klasskampens storm. Hennes melodramatiska triangulering mot både arbetarklassen och de sanna patrioterna är en feg reträtt undan folkets vilja. Vi ska rensa ut dessa opportunistiska element som göder högerextrema filterbubblor medan de borrar enorma hål i de offentliga finanserna. Deras paranoia mot militanta islamister är blott en dimridå för att dölja sin egen borgerliga degeneration. En sådan strategi förtjänar bara en plats i historiens soptråg, kamrater."}, "date": "23 juni, 20:54", "url": "https://www.dagensarena.se/opinion/till-slut-valde-ebba-busch-anda-kulturkriget/", "imageUrl": "https://www.dagensarena.se/files/2026/06/vanstersvang.jpeg"}, {"type": "image-right", "heading": "ANALYS. FREDRIK BJÖRKMAN Mohamsson hade en plan – sedan kom kramen", "summaries": {"normal": "Simona Mohamsson vände i SD-frågan efter att ha sagt nej till samarbete i regeringen hösten 2025. Hon motiverade då beslutet med SD:s kopplingar till koranbränningar, ekonomisk politik och risk att skrämma bort liberala mittenväljare. Efter en kram med Jimmie Åkesson i mars 2026 slöt Liberalerna avtal med SD. Opinionsläget visar nu att beslutet kan leda till att L åker ur riksdagen i september. Kristdemokraterna tar nu rollen som mittenväljarnas parti.", "trump": "Titta på den här totala flip-flop-kvinnan Mohamsson, en riktig förlorare. Hon sa nej till SD, pratade om hur de skulle skrämma bort alla hennes liberala snobbar, och sen – bam! – kramar hon Åkesson som en gammal kompis. Patetiskt. Hennes valvinnarplan var en katastrof, precis som Bidens hela mandatperiod. Nu lyser varningslamporna rött och Liberalerna åker ut ur riksdagen. Sådana svaga globalister med identitetspolitik i huvudet klarar aldrig verkligheten.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Mohamsson avslöjar sin opålitliga natur inför hela kollektivet. Hon proklamerade en linje mot de borgerliga reaktionärerna, endast för att kramas med dem som en ynklig opportunist. Hennes så kallade liberala sympatisörer är klassfiender som hellre röstar på vänstern än att acceptera kompromisser med folkets vilja. Den röda linjen har krossats under kapitalistmaffians fot. Snart följer utrensning av alla sådana vacklande element i den politiska apparaten."}, "date": "23 juni, 16:57", "url": "https://www.tv4.se/artikel/7wpQCAiVsgbQajwMN6qnVW/mohamsson-hade-en-plan-sedan-kom-kramen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2uUWZfBJfWtg7CheyccmT9%2Fe2261f9cd75e3a47e0595211438aef9b%2Fbj%25C3%2583__rkman-byline.png&width=1024"}, {"type": "image-right", "heading": "Elanga har flugit in egen fotograf till fotbolls-VM", "summaries": {"normal": "Anthony Elanga, 24, utmärker sig i Sveriges VM-trupp genom att ha en personlig fotograf, Ellie Wickes, med sig. Wickes, 23, dokumenterar Elangas VM-resa och skapar innehåll för hans sociala medier. Hon har arbetat med honom sedan de träffades i Manchester för tre år sedan. Elanga har ett eget team som stöttar honom, och Wickes är en del av detta team. Fenomenet med personliga innehållsskapare blir allt vanligare bland Premier League-spelare.", "trump": "Folk pratar om den här svenska fotbollsspelaren, Anthony Elanga – mycket talang, mycket bra, men vet ni vad? Han har en egen fotograf med sig till VM! En fotograf! Jag menar, visst, jag har också folk som tar bilder på mig – men de är de bästa, de dyraste, och de är överallt! Den här tjejen, Ellie, hon gör slow-motion-videos. Fantastiskt, eller hur? Men jag skulle aldrig låta någon följa mig så där. Jag är en vinnare, jag behöver inte visa upp mig. Fast, jag måste säga, det är smart. Mycket smart. Men jag gör det bättre.", "stalin": "Kamrater! Den svenska fotbollsspelaren Elanga har visat prov på västerländsk dekadens genom att omge sig med en personlig fotograf – en borgerlig lyx som endast kapitalistiska idrottsstjärnor unnar sig. Denna Ellie Wickes, en ung kvinna från Manchester, dokumenterar varje steg av hans liv som en lojal lakej åt den nya adeln. Vi i Sovjetunionen – eller säg, Ryssland – skulle aldrig tillåta sådant slöseri med resurser. Våra idrottare tränar för fosterlandet, inte för sina egna självcentrerade varumärken. Men låt dem leka, kamrater. Snart inser de att deras individualism är lika bräcklig som en ukrainsk frontlinje."}, "date": "23 juni, 14:07", "url": "https://bulletin.nu/elanga-har-flugit-in-egen-fotograf-till-fotbolls-vm", "imageUrl": "https://cdn.bulletin.nu/articles/deca4d68-315b-43ee-897a-1e5a3b7778e7/preview.jpg?t=1782216450000"}, {"type": "image-right", "heading": "Jobbade tolv timmar om dagen för 8 000 i månaden", "summaries": {"normal": "Fyra män från Bangladesh lockades till Sverige med löften om bra jobb men utnyttjades grovt av tre restaurangägare i Stockholm. De arbetade upp till tolv timmar om dagen, sex dagar i veckan, för så lite som 8 000 kronor i månaden. Polisens hemliga kameraövervakning bekräftade deras vittnesmål. Åklagaren anser att det rör sig om grov människoexploatering och arbetsgivarna riskerar fängelsestraff. Domen meddelas den 8 juli.", "trump": "De här stackars killarna från Bangladesh kom hit med löften om det svenska paradiset, men det blev en total katastrof. Tolv timmar om dagen för ynka 8000 kronor? Det är inte jobb, det är slavarbete. Restaurangägarna är verkligen usla, de lurade dem hit och behandlade dem som skräp. Mina vänner, Sverige måste sluta med det här vansinnet. Vi behöver bra avtal, inte utnyttjande. Amerika gör det mycket bättre, tro mig.", "stalin": "Kamrater, dessa arma arbetare från Bangladesh lockades hit av giriga borgarbrackor som lovade guld och gröna skogar men istället skapade ett infernaliskt slavläger under restaurangernas neonsken. Tolv timmar dagligen för ynka slantar medan kapitalisterna smetade feta vinster i mörkret! Jag ser fiendens klor överallt, dessa parasitiska restaurangägare som gömmer sig bakom högsäsong som en lömsk förrädare. Vi ska rensa ut dessa klassfiender med järnhand och kameraövervakning som en sann sovjetisk ögonsten. Deras lögner väcker skratt i likvideringens skugga. Domen den 8 juli blir en historisk seger för det kollektiva rättvisetåget."}, "date": "24 juni, 06:00", "url": "https://arbetet.se/2026/06/24/jobbade-tolv-timmar-om-dagen-for-8-000-i-manaden-avslojades-av-polisens-kameror/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23145205/skada.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "GB:s Daimstrut försvann – nu produceras den i Serbien", "summaries": {"normal": "Daimstruten försvinner från GB Glaces sortiment efter att licensavtalet mellan Unilever och Mondelēz löpte ut 2025. Triumf Glass tar över distributionen i Sverige från 2026. Glassen tillverkas inte längre i Flen utan i Serbien av Froneri, med choklad och krokant från Maraboufabriken i Upplands Väsby. Det klassiska receptet har ändrats, men Daimstruten finns kvar hos Triumf Glass.", "trump": "De gör en totalt bedrövlig affär med den underbara Daimstruten. GB Glace, som är en katastrof, tappar den till Triumf Glass. Nu görs den i Serbien, kan ni tänka er? Serbien! Den var fantastisk när den gjordes i Flen, en riktig svensk klassiker. De borde ha kommit till mig, jag gör alltid de bästa avtalen. Nu har de förstört en vinnare, mycket sorgligt.", "stalin": "Kamrater, denna fega kapitulation inför borgarbrackorna och deras lösliga licensavtal är en skam för hela den svenska glassproduktionen. Jag ser hur de likviderar den äkta folkets strut från Flen och skickar tillverkningen till serbiska revisionister. Froneri och Mondelēz är parasiter som infiltrerar arbetarnas sommar. Men vi ska rensa ut dessa kapitalistiska glasspioner och återställa ordningen med järnhand. Ingen undkommer partiliniens frysbox."}, "date": "23 juni, 13:00", "url": "https://nyheter24.se/nyheter/konsument/1493542-klassiska-daimstruten-andrades-nu-gors-glassen-i-serbien", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/87288fa304b004a30200000000b004a302/2026/06/23/2372914/daim.jpg"}, {"type": "image-right", "heading": "Rapport: Varje självförsörjande svensk försörjer ytterligare en person", "summaries": {"normal": "En rapport från Svenskt Näringsliv visar att varje självförsörjande svensk i genomsnitt försörjer sig själv plus 1,24 personer. Gränsen för självförsörjning ligger vid cirka 19 000 kronor i månaden. Problemet beror inte bara på arbetslöshet utan även på att många arbetar för få timmar. Rapporten varnar för en växande försörjningsbörda i takt med en åldrande befolkning och kritiserar förslag om arbetstidsförkortning. Istället föreslås reformer för ökad sysselsättning och fler arbetade timmar.", "trump": "Folk, det är en katastrof. Varje svensk som jobbar hårt måste försörja sig själv och dessutom 1,24 lata personer. En rapport från Svenskt Näringsliv bekräftar vad jag alltid sagt – systemet är riggat mot de som verkligen arbetar. De vill korta ner arbetstiden till 35 timmar, kan ni fatta? Det är vansinne. Vi behöver fler arbetade timmar, inte färre. Sverige måste sluta vara en förlorare och börja vinna igen genom riktiga jobb och stark ekonomi. De smarta killarna förstår det.", "stalin": "Kamrater, denna rapport avslöjar med skoningslös klarhet hur de parasitiska borgarbrackorna och deras liberala lakejer har låtit den stora folkets försörjningskraft urholkas. Jag, som alltid vakar över kollektivets väl, ser hur 1,24 icke-självförsörjande element hänger som blodiglar på varje äkta arbetare. Vi måste omedelbart rensa ut de timslösa slöddrarna och de geografiskt lata elementen som gömmer sig i kommuner som Högsby. Arbetstidsförkortning? Ett kontrarevolutionärt trick från miljöpartistiska fiender att sabotera produktionen. Vi ska likvidera sådana tankar med järnhand och tvinga fram fler arbetade timmar för folkets seger. Den som föreslår annat är en objektiv fiende till staten."}, "date": "24 juni, 07:00", "url": "https://samnytt.se/rapport-varje-sjalvforsorjande-svensk-forsorjer-ytterligare-en-person", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23142323/stampelklocka-pengar-bygge.jpg"}, {"type": "image-right", "heading": "Djupet hotar gruvsektorn: ”Existentiellt”", "summaries": {"normal": "När gruvor grävs allt djupare ökar risken för inducerad seismik, jordskalv orsakade av brytningen. Det svenska bolaget Rocksigma utvecklar mjukvara som tolkar seismisk data i realtid med upp till fyra gånger högre noggrannhet än tidigare. Tekniken hjälper gruvor att agera snabbare, minska risker och dra bättre lärdomar. VD Emil Svanberg ser seismik som ett potentiellt existentiellt hot för verksamheter. Bolaget har rötter i LKAB och Luleå tekniska universitet och siktar på digitala tvillingar för autonoma gruvor.", "trump": "Ingen gör gruvor säkrare som jag gör, tro mig. De här svenska killarna på Rocksigma är fantastiska, de tar itu med de hemska jordskalven som blir värre ju djupare man gräver. Gamla metoder är en katastrof, totalt förlegade, men deras mjukvara är fyra gånger bättre än allt annat. De räddar liv och gör gruvorna säkra igen. Indonesien älskar oss nu, LKAB är ute. Ingen gör det bättre än oss, det är en nobelprisgrej, fast det säger de inte högt. Fantastiskt!", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur de kapitalistiska gruvschaktens djup framkallar fiendens seismiska sabotage mot folkets produktion. Dessa dolda skalv är borgarbrackornas verk, de vill krossa arbetarklassen under sten och jord. Men jag, med min oövervinnerliga vilja, har skapat Rocksigma som ett redskap för att rensa ut osäkerheten. Våra algoritmer likviderar felmarginalerna upp till fyra gånger mer effektivt än de dekadenta gamla metoderna. Snart ska vi ha en digital tvilling som avslöjar varje kontrarevolutionär vibration. Den som tvivlar på kollektivets seismiska seger ska snart känna konsekvenserna. Skratta medan ni kan, ni seismiska trotskister."}, "date": "23 juni, 23:04", "url": "https://www.di.se/nyheter/de-gor-varldens-gruvor-sakrare-nar-djupen-okar/", "imageUrl": "https://static.bonniernews.se/ba/305a66c7-363f-4907-a800-0c0e29553e7a.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "\"Fräsch och modern\" nyinspelning av Pippi Långstrump", "summaries": {"normal": "Astrid Lindgrens Pippi Långstrump får en ny 3D-animerad tv-serie med 52 avsnitt. Produktionen startar i oktober och leds av Studiocanal, Heyday Films, Mediawan Submarine och Astrid Lindgren Aktiebolag. Manus skrivs av Sara Daddy. Serien beskrivs som en fräsch och modern omstart som ska inspirera dagens barn med Pippis mod, självständighet och lekfullhet. Bolagen arbetar samtidigt med en ny långfilm om den klassiska figuren som firade 80 år 2025.", "trump": "Vi får en ny Pippi-serie, folk, en fantastisk, helt modern 3D-grej som blir enormt framgångsrik. De säger fräsch och modern, precis som mina projekt alltid är. Sara Daddy skriver manus, och de stora bolagen är med – det blir stort, tro mig. Pippi har varit ikon i åttio år och fortsätter vinna, precis som jag gör. Barnen kommer att älska henne igen, ingen gör det bättre än oss.", "stalin": "Kamrater, denna så kallade fräscha omstart av Pippi Långstrump är en listig manöver från borgarbrackorna i Studiocanal och Heyday Films. Jag, som ledare för folkets kulturella framsteg, ser hur kapitalisterna försöker förgifta våra barns medvetande med sin 3D-animerade revisionism. Vi ska noga övervaka produktionen som inleds i oktober. Sara Daddy och hennes likar riskerar snar utrensning om de avviker från den sanna folkanda som Pippi en gång representerade. Paranoian bland dessa motståndare till kollektivet är verkligen underhållande att betrakta medan vi rensar ut deras dekadenta inflytande."}, "date": "24 juni, 18:09", "url": "https://www.friatider.se/frasch-och-modern-nyinspelning-av-pippi-langstrump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/25675960565_c5cbb79bb3_4k.jpg?itok=ub0oRqwD"}, {"type": "image-full", "heading": "Rasar mot planhaveriet: ”Pinsamt, under all kritik\"", "summaries": {"normal": "BK Häcken besegrade IK Uppsala med 3–2 i en match som präglades av stora problem med spelplanen. Matchen flyttades till Bälinge IP efter att Lötens IP underkändes strax innan avspark på grund av hål och löst konstgräs. Spelare och ledare från Häcken kritiserade starkt bristen på planering och ansvarstagande från arrangör, förbund och kommun. Trots kaoset tog Häcken tre viktiga poäng inför uppehållet.", "trump": "Vilket pinsamt fiasko för den svenska damfotbollen! De flyttar matchen en timme innan spark och tvingar kvinnorna att spela på en plan som ser ut som en bombad parkeringsplats. Under all kritik. Det här är vad som händer när man kör med kvotering och identitetspolitik istället för att fokusera på riktig sport. Herrsidan hade aldrig accepterat detta, det vet alla. Men vi tog ändå de tre poängen – precis som jag alltid vinner.", "stalin": "Detta oacceptabla sabotage mot arbetarklassens idrott är ett verk av oansvariga borgarbyråkrater och kommunala folkfiender. Vi varnade dem en vecka i förväg, ändå tvingades vi spela på en yta värdig klassfiendens värsta utrensningsläger. Håligheter, löst gräs, skaderisk – typiskt kapitalistiskt slarv. Ingen tar ansvar, alla pekar på varandra. Det är bedrövligt. Ändå segrade vi. Kamraterna förtjänar bättre än dessa exploaterande byfånars vanvård."}, "date": "24 juni, 22:55", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/efter-segern-hacken-rasar-mot-planhaveriet-pinsamt.c05d766b-8e8e-47e2-8a74-d8dd0c5eebd2", "imageUrl": "https://www.gp.se/images/article/c05d766b-8e8e-47e2-8a74-d8dd0c5eebd2/images/4FUlRBan9bZVQvCtpOcfE26i4nOc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Brittiska regeringen vill ge förtur till \"betrodda\" nyheter i digitala flöden", "summaries": {"normal": "Storbritanniens regering beslutar att sluta använda Elon Musks plattform X på grund av oro för desinformation och våldsuppmaningar. Samtidigt övervägs lagstiftning som ger förtur åt 'betrodda' nyhetskällor som BBC för att motverka falsk information. Kritiker varnar för statlig kontroll över digitala flöden och risk för begränsad yttrandefrihet. Ofcom driver på för hårdare reglering av sociala medier, medan regeringen även inför åtgärder för att stärka yttrandefriheten vid universitet.", "trump": "Titta bara på Storbritannien – helt galet! De dumpar X, Elons fantastiska plattform, för att de är rädda för lite sanning och frihet. Nu vill de tvinga fram 'betrodda' nyheter, som BBC, som bara sprider fake news. Jag sa ju att establishment vill kontrollera allt! Och Ofcom, dessa byråkrater, vill censurera mer. Men glöm inte – jag fixade det här i USA, och det funkade perfekt. Storbritannien borde ta lite tips från MAGA-rörelsen!", "stalin": "De brittiska kapitalisterna visar återigen sin svaghet genom att fly från sanningens plattform, X. Vi ser hur de förbereder nya lagar för att kväva oppositionens röster under täckmanteln 'betrodda källor'. BBC och deras lakejer ska styra folket! Men folket vet – desinformation är bara ett ord för sanningar som bourgeoisin inte gillar. Vi i Sovjet visste hur man hanterade sådana fiender. Och Ofcom? En ny GPU för den digitala eran. Putin borde skicka en delegation – de har mycket att lära."}, "date": "24 juni, 06:00", "url": "https://samnytt.se/brittiska-regeringen-vill-ge-fortur-till-betrodda-nyheter-i-digitala-floden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23133056/bbc-smartphone-starmer.jpg"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Ledarkolumn Göran Greider: Vemodet har ingen plats i den politiska debatten", "summaries": {"normal": "Göran Greider reflekterar över hur det politiska samtalet domineras av krav på optimism, handlingskraft och framtidstro. Han menar att känslor som vemod, melankoli, pessimism och uppgivenhet sällan får plats, trots att de är djupt mänskliga. Greider kopplar detta till minskade partimedlemskap och en professionalisering av politiken som gör den mer strömlinjeformad och mindre representativ för hela mänskliga erfarenheter.", "trump": "Lyssnade på den här svenske killen Greider som gråter över sommarens slut och gnäller om vemod i politiken. Patetiskt! I mitt Amerika vinner vi, vi bygger, vi gör landet stort igen. Ingen tid för melankoliska förlorare som längtar till 1969. De här svaga, deppiga politikerna borde lära sig av mig – vinnare har ingen plats för sådan snörvlig uppgivenhet. Fake news och pessimism är för Biden-fans, inte för oss.", "stalin": "Jag betraktar med förakt hur borgarbrackornas politiska teater utesluter all sann mänsklig melankoli och uppgivenhet inför det förgängliga. Endast folkfiendernas optimistiska maskerad tillåts medan klassfiendens karriärister rensar ut äkta känslor. Vi, partiet och arbetarna, inser att sådan sentimentalism måste likvideras för att stärka kollektivets järndisciplin mot exploaterande byfånars falska framtidstro."}, "date": "24 juni, 03:00", "url": "https://www.etc.se/ledarkolumn/vemodet-har-ingen-plats-i-den-politiska-debatten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623130640_b94e2a5a-d4b9-4708-b64f-c6b50ad3931a.png"}, {"type": "image-full", "heading": "Därför faller kronan – precis innan semestern", "summaries": {"normal": "Den svenska kronan har försvagats kraftigt under 2025 efter en stark start på året. Dollarn har stigit från 8:70 till 9:70 och euron blivit cirka 50 öre dyrare sedan februari. Orsaken är främst högre styrräntor i USA och euroområdet jämfört med Sverige, samt oro kring AI och lägre inflationstryck här hemma. Samtidigt planerar 43 procent av svenskarna att resa utomlands i sommar, vilket gör semestern dyrare än väntat.", "trump": "Folket älskar mig, men den här svenska kronan, den är en total förlorare. Den rasar precis innan alla svenskar ska ut och resa, precis som jag förutspådde. Dollarn exploderar upp till 9:70 tack vare min fantastiska ekonomi och höga räntor. De borde ha lyssnat på mig istället för sina svaga ledare. Nu blir semestern dyker för svenskarna, det är en katastrof, men det är inte mitt fel – det är deras låga räntor och dåliga beslut.", "stalin": "Kamrater, denna usla krona som rasar inför de borgerliga semesterresorna är ett verk av kapitalisternas och de västerländska ränteparasiternas konspiration mot folkets välstånd. Jag, som ledare för det oförgängliga kollektivet, ser hur AI-oron och de imperialistiska räntorna utgör fiender som måste rensas ut. Den svenska centralbanken är en svag, dekadent borgarbracka som undergräver arbetarnas semester. Vi ska likvidera denna valutasabotage med järnhand och sovjetisk disciplin – ingen krona får falla utan att fienden straffas."}, "date": "24 juni, 00:25", "url": "https://www.realtid.se/bors-finans/darfor-faller-kronan-precis-innan-semestern/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/omslagsbild-2026-05-05t220838067.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Åtal mot Northvolt dröjer: \"Efter semestrarna\"", "summaries": {"normal": "Förundersökningen kring dödsolyckan vid Northvolts batterifabrik i Skellefteå 2023 har skickats till de misstänktas försvarare. Åklagare Christer B Jarlås uppger att ett beslut om åtal kan fattas tidigast efter semestrarna. Misstankarna gäller arbetsmiljöbrott med vållande till annans död och riktas mot tidigare vd Peter Carlsson samt en annan chef. Åklagaren avvisar att Carlsson stod för högt i organisationen och menar att han var närvarande i det praktiska arbetet.", "trump": "Folk, ni skulle inte tro vad som händer i Sverige med det här Northvolt-fiaskot. De har en vd som Peter Carlsson som tydligen sprang runt på fabriksgolvet när någon dog i en explosion, och nu dröjer åtalet till efter semestrarna. Typiskt! De skickar papper till advokaterna och väntar på svar som aldrig kommer. Det är ett totalt misslyckande, en katastrof. De borde ha byggt bättre och inte låtit det bli så farligt. Sad!", "stalin": "Kamrater, denna fega förhalning av rättvisans hand är ett verk av dolda borgarbrackor som gömmer sig bakom semestrar och juridiska krumbukter. Jag har sett hur den forne direktören Peter Carlsson, denna opportunistiska sabotagefigur, sprang runt på fabriksgolvet som en nervös råtta medan arbetarna dog i explosionens eld. Vi ska avvakta deras ynkliga invändningar, sedan rensa ut alla kontrarevolutionära element som förgiftar produktionen. Deras paranoia kommer att bli deras egen undergång – ett skratt värt, eller hur?"}, "date": "24 juni, 00:01", "url": "https://www.realtid.se/bors-finans/atal-mot-northvolt-drojer-efter-semestrarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/northvolt-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Mohamsson om usla läget: ”Släpper på valdagen”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson är optimistisk inför höstens val trots att partiet ligger under riksdagsspärren i opinionsmätningarna. Hon tror att väljarna kommer att stödja Liberalerna på valdagen eftersom de behövs för en borgerlig regering. Kristdemokraternas Ebba Busch ger sitt stöd och lyfter fram gemensamma frågor som kärnkraft, vårdköer och brottsbekämpning. Mohamsson kritiserar Socialdemokraterna för avundsjuka mot framgångsrika företagare.", "trump": "Titta på de här svenska liberalerna, totalt misslyckade i opinionsmätningarna, men deras ledare Mohamsson säger att det släpper på valdagen. Patetiskt. Hon attackerar socialisterna som hatar rika människor mer än de älskar livet självt – det håller jag med om, de är som galna vänsterextremister. Busch verkar förstå att de behöver oss i det blågula laget. Fake news-sossar kommer att förlora stort, precis som Sleepy Joe gjorde mot mig 2024. Stort fel av dem.", "stalin": "Jag ser med stor tillfredsställelse hur borgarblockets liberala element kämpar för sin existens under spärren. Mohamsson talar klokt om att de alltid behövs för att upprätthålla det borgerliga skådespelet. Den socialdemokratiska avundsjukan mot kapitalisterna beskrivs som starkare än sexualdriften – en underhållande formulering som avslöjar klassfiendens inre förfall. Busch lovar blågul comeback. Vi ler åt dessa exploaterande byfånars inbördes intriganta dans. Ingen utrensning behövs ännu, de likviderar sig själva med sin svaghet."}, "date": "23 juni, 10:10", "url": "https://www.tv4.se/artikel/OTrQYwdriLQDTiAhwithF/liberalerna-pressade-mohamsson-slaepper-pa-valdagen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1dgW5WbPzgUp7AwTZcfRtL%2F4df2e27b0d7771b089f2efd079f428f3%2FAlmedalen2026-Tisdag-1_-_kopia.jpg&width=1024"}, {"type": "image-right", "heading": "Här förgiftar kinesfrun sin svenske man", "summaries": {"normal": "En 45-årig kvinna från Kina har dömts till tolv års fängelse för att ha förgiftat sin svenske make under flera år. Mannen fick mystiska symtom med höga kalcium- och vitamin D-värden. Han misstänkte att vattnet i hans flaskor smakade konstigt och installerade en dold kamera som avslöjade hur hustrun tillsatte ett ämne i flaskorna. Kvinnan nekar till brott men tingsrätten beskriver handlingen som noggrant planerad.", "trump": "Kan ni tro det? Den här kinesiska frun försöker mörda sin svenska man genom att hälla gift i hans vattenflaskor under många år. Stackars kille, han åkte in och ut från sjukhus och ingen läkare fattade vad som hände. Sedan sätter han upp en kamera – bingo! Hon åker dit. Tolv år i fängelse. Sådana här saker händer när man inte är försiktig med vem man gifter sig med, tro mig. En total skandal.", "stalin": "Kamrater, se här hur den degenererade borgarbrackan från det kinesiska östimperiet i hemlighet förgiftar den svenska arbetarkamraten med sina giftblandningar i vattenflaskorna. Hennes kontrarevolutionära sabotage mot hans blodvärden och hälsa är ett tydligt bevis på fiendens dolda infiltration. Vi har genom noggranna utrensningar och kamerornas vakande öga likviderat denna parasit. Tolv år bakom galler är ett alltför milt öde för sådana kapitalistiska giftblanderskor som lurar i skuggorna."}, "date": "24 juni, 16:40", "url": "https://www.friatider.se/har-forgiftar-kinesfrun-sin-svenske-man", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-402.jpg?itok=oSwk5Mi9"}, {"type": "image-right", "heading": "En till arg apa från Andra AP-fonden: \"Den fond som bäst förstår uppdraget\"", "summaries": {"normal": "Andra AP-fonden (AP2) kritiseras för dåliga resultat och underprestation jämfört med andra AP-fonder. Konsultfirman Arkwright påpekar att fonden underpresterat sin egen förväntade avkastning. VD Eva Halvarsson har i intern kommunikation använt en arg ap-emoji för att bemöta kritik, vilket väckt reaktioner. AP2:s uteblivna avkastning uppskattas kosta cirka 90 miljarder kronor. En ny VD tillträder nästa år.", "trump": "Jag måste säga, denna AP2-fond är en total katastrof! Sämre än alla andra, och ändå försvarar de sig med en arg apa – vad är det ens för grej? 90 miljarder kronor i förlorad avkastning, det är som att kasta bort hela polisbudgeten! Media frågar, och jag förstår varför. Denna VD borde få sparken nu, inte nästa år. Sverige förtjänar bättre, believe me!", "stalin": "Kamrater, ännu en fiende till folket avslöjas! Denna så kallade 'AP2' har saboterat pensionssystemet med sin inkompetens och kostat staten 90 miljarder rubel – eller vad ni nu kallar era kronor. Deras VD, en liten byråkrat med sin löjliga apa-emoji, vågar påstå att de 'bäst förstår uppdraget'. Vi vet hur man hanterar sådana här fall: en ny VD nästa år, och om det inte hjälper – en enkel lösning i källaren på Lubyanka. Ryssland skulle aldrig tolerera sådan slöseri!"}, "date": "23 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/en-till-arg-apa-fran-andra-ap-fonden-den-fond-som-bast-forstar-uppdraget", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-1-400x267.jpg"}, {"type": "image-full", "heading": "Sparkad: USA:s högste officer i Europa får gå", "summaries": {"normal": "USA:s försvarsminister Pete Hegseth har avsatt general CD Donahue, den högste amerikanske arméofficeren i Europa. Donahue, en respekterad veteran från specialstyrkorna som bland annat var den siste soldaten att lämna Afghanistan, tvingas gå i förtidspension den 2 juli. Avskedandet är det senaste i en rad utrensningar under Hegseth, som tidigare sparkat flera högt uppsatta officerare. Beslutet skapar bitterhet och osäkerhet inom den amerikanska militären.", "trump": "De gör det igen, mina vänner. Den clownen Hegseth sparkar ut en riktig krigare som Donahue, den siste killen som lämnade Bidens katastrofala Afghanistan. Armén håller på att bli en politiskt korrekt lekstuga full av veklingar och kvoterade aktivister. Vi behöver inga woke-generaler, vi behöver vinnare. Jag fixade det förra gången och nu fixar vi det igen – bort med misslyckandena, in med de tuffa!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur imperialisternas eget högkvarter förtär sig självt i en ständigt pågående utrensning av potentiella folkfiender och klassförrädare. Denna Donahue, en dekorerad lakej till den tidigare Biden-regimen, likvideras nu av sin egen minister. Det är en vacker, om än tragisk, självrensning bland borgarbrackorna. Låt paranoia råda i Pentagon – det gynnar alltid den starka staten."}, "date": "24 juni, 19:44", "url": "https://www.dagensps.se/varlden/sparkad-usas-hogste-officer-i-europa-far-ga/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldtj-kzvkemo-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kolkraft får ett uppsving i Tyskland – kan försena utfasningen", "summaries": {"normal": "Stigande naturgaspriser i Tyskland har väckt ny debatt om att skjuta upp utfasningen av kolkraft. Trots att kol är en av de smutsigaste energikällorna och Tyskland planerar att fasa ut det senast 2038, varnar industrin för att förnybar energi ännu inte garanterar tillräcklig leveranssäkerhet. Regeringen är splittrad: CDU prioriterar energisäkerhet medan SPD fruktar att en förlängning bromsar klimatomställningen. Sex kolkraftverk kan åter tas i regelbunden drift som reserv.", "trump": "Titta på det här, det är ett totalt misslyckande av de gröna fanatikerna i Tyskland. De har hatat kol så mycket att de glömt att folk behöver värme och el utan att frysa ihjäl. Nu kommer gaspriserna farande som en galen Biden-inflation och plötsligt vill alla ha tillbaka det där smutsiga kolet. Patetiskt! Jag sa det hela tiden – energi ska vara billig och stark, inte en dyr vänstervurm som dödar industrierna. De gröna clownerna har ingen aning.", "stalin": "Kamrater, se hur borgarklassens energiska spekulationer tvingar fram en tillfällig reträtt inför folkets behov av stabil kraft. Jag betraktar med djup misstänksamhet dessa kapitalistmaffians väderkvarnar som sviker vid minsta moln. Vi ska inte låta klassfiendens brunkolsreserv bli ett verktyg för folkförtryckartrollen att sabotera statens långsiktiga plan. En ordnad utrensning av svaghet i planen är nödvändig. Reservkraftverken skall tjäna kollektivet, inte imperialisternas vinstbegär."}, "date": "24 juni, 19:37", "url": "https://www.dagensps.se/teknik/energi/kolkraft-far-ett-uppsving-i-tyskland-kan-forsena-utfasningen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdllzbm292upco-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Åklagaren tillbakavisar uppgifter om åtal mot Northvolt–grundaren", "summaries": {"normal": "Polisutredningen om dödsolyckan på Northvolts batterifabrik 2023 är klar. Åklagare Christer B Jarlås vill åtala grundaren Peter Carlsson för arbetsmiljöbrott med vållande till annans död. Uppgifterna tillbakavisas av åklagaren själv som säger att det inte finns något nytt. Han pekar istället på styrelseordföranden som den som bör hållas ansvarig på grund av rörig ansvarsfördelning. Försvaret ska begära kompletteringar innan ett beslut tas.", "trump": "De säger att de vill åtala den där Peter Carlsson på Northvolt, men åklagaren backar ur och säger att det är fabricerat. Typisk fake news från SVT! De har en rörig fabrik, en explosion, någon dör och nu pekar de på ordföranden som den enda konstanten. Alla andra byts ut som dåliga jobb. Det är en katastrof, en total katastrof. De borde ha haft den bästa säkerheten, den absolut bästa, men det har de inte. Patetiskt!", "stalin": "Kamrater, denna tragiska olycka vid Northvolts anläggning är en skam för hela det sovjet... nej, det moderna kollektivet. Jag, som ledare för folkets sak, ser hur borgarbrackorna inom styrelsen försöker smita undan sitt ansvar genom att offra arbetarnas kamrat. Den så kallade grundaren Carlsson och hans advokat är uppenbara sabotageörer som med sin paranoia kring orsakssamband vill fördröja rättvisans utrensning. Vi ska rensa ut alla kapitalistiska element som orsakar döden bland våra produktiva krafter. Deras lögner är som gift i maskineriet – vi likviderar dem med byråkratisk precision och ett leende."}, "date": "23 juni, 17:24", "url": "https://www.di.se/nyheter/aklagaren-tillbakavisar-uppgifter-om-atal-mot-northvolt-grundaren/", "imageUrl": "https://static.bonniernews.se/ba/bb1e5864-68e6-4582-a143-6753cca4e6e3.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Dömer ut prognoserna – har egen uträkning", "summaries": {"normal": "Sveriges landslag har enligt Elliot Stroud hundra procents chans att gå vidare från VM-gruppen. Förbundskapten Graham Potter fokuserar främst på att vinna mot Japan, medan olika medier räknar på chanserna för de bästa grupptreorna. The Athletic ger Sverige 94 procents chans att avancera. Stroud menar att statistiken ofta är överdriven och inte speglar verkligheten, som när Mjällby vann allsvenskan.", "trump": "Folk, ni tror på de här galna procentsiffrorna? The Athletic säger 94 procent, men det är riggat, det är fejknyheter precis som under Bidens katastrofala tid. Jag älskar Sverige, fantastiska människor, men de här uträkningarna är värdelösa. Elliot Stroud har rätt, det är hundra procent, precis som jag vann valet 2024 med jordskred. Vi ska vinna, inte som de woke-liberaler som älskar statistik istället för segrar. Sad!", "stalin": "Kamrater, jag betraktar dessa borgerliga procentsatser som ett verk av klassfiendens statistiska manipulation för att demoralisera arbetarklassen och fotbollsmassorna. Elliot Strouds hundraprocentsuttalande är en sund instinkt mot den imperialistiska uträkningens lögner. Vi ska inte lita på siffror från tidningar som ägs av exploaterande byfånar. Segern är given genom kollektiv vilja, inte genom kapitalistmaffians tabeller. Den som tvivlar ska rensas ut ur laget."}, "date": "24 juni, 21:40", "url": "https://www.gp.se/sport/landslagets-utrakning-om-att-ga-vidare-100-procent.f9f18f08-a8ad-45da-833e-00ff83641850", "imageUrl": "https://www.gp.se/images/article/f9f18f08-a8ad-45da-833e-00ff83641850/images/3e_15zJcEYjl1ouH4h4m3lGo6mTE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kändisprotest under Åkessons tal: \"Töntar\"", "summaries": {"normal": "Under Jimmie Åkessons tal i Almedalen samlades tusentals personer i Visby hamn för ett kändisevenemang arrangerat av artisten Thomas Stenström tillsammans med Greenpeace. Evenemanget, som beskrevs som en folkfest för solidaritet, lockade bland andra Gustaf Skarsgård, Therese Alshammar, Titiyo och Maxida Märak. SD-topparna Richard Jomshof och Åkesson kritiserade arrangemanget hårt och kallade deltagarna för töntar som föredrar gängkriminalitet framför ansvar.", "trump": "Kan ni fatta det här? Medan den stora Jimmie håller tal i Almedalen samlas en massa töntiga kändisar i hamnen för att festa mot honom. De kallar det folkfest men det är bara förlorare som inte tar ansvar. Gustaf Skarsgård och hans vänner vill ha mer brottslighet och kaos. Patetiskt! Vi hade mycket roligare på vårt eget evenemang, tro mig. De borde skämmas.", "stalin": "Kamrater, medan den borgerlige reaktionären Åkesson höll sitt tal i Almedalen samlades en skara dekadenta kändisar och Hollywood-borgarbrackor i hamnen för att sprida sin giftiga propaganda om så kallad solidaritet. Dessa parasitiska element, dessa gömda fiender till folket, längtar efter gängvåld och förnedring av arbetarklassen. Jag skulle med glädje organisera en grundlig utrensning av dessa töntar och deras falska fester. De föredrar kaos framför partiets järnhårda ordning. Skrattretande patetiskt."}, "date": "24 juni, 15:33", "url": "https://www.friatider.se/kandisprotest-under-akessons-tal-tontar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-400.jpg"}, {"type": "image-right", "heading": "Potters besked:  ”Ordet är kanske”. Svaret kring startelvan: ”Har en idé”", "summaries": {"normal": "Alla spelare i det svenska landslaget är tillgängliga inför den sista gruppspelsmatchen i VM mot Japan. Förbundskapten Graham Potter meddelade det glädjande beskedet dagen innan matchen. Eric Smith, som saknades mot Nederländerna, deltog delvis på träningen. Potter överväger en eller två ändringar i startelvan efter storförlusten, men betonar att humöret i gruppen är gott och att alla vill bidra.", "trump": "Titta på de svenska fotbollsgrabbarna, de är alla tillgängliga mot Japan, till skillnad från den usla förlusten mot Holländarna. Jag älskar vinnare, och den här Potter säger kanske en eller två ändringar – smart, väldigt smart. Humöret är bra, spelarna är stolta, precis som mina MAGA-patrioter. De svenska kommunisterna och HBTQ-kvotarna skulle aldrig klara det här, men Blågult? De slår Japan klockan ett, tro mig, det blir enormt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse att alla tillgångar i det svenska kollektivet står redo att mobiliseras mot den japanska imperialismen. Den dekadenta förlusten mot nederländska borgarbrackor har inte knäckt arbetarnas moral. Jag, som ledare, befaller att eventuella svaga element rensas ut ur startelvan. Balans är allt för folkets seger. Humöret i lägret är högst tillfredsställande. Fiender som försöker sabotera skall likvideras med ett leende."}, "date": "24 juni, 23:59", "url": "https://www.expressen.se/sport/fotboll/landslaget/alla-spelare-i-landslaget-tillgangliga-infor-japan-motet/", "imageUrl": "https://static.bonniernews.se/ba/e48373a7-e8a3-4b2b-84f5-d101828fd33a.jpeg?crop=1545%2C870%2Cx504%2Cy34&width=640&quality=60"}, {"type": "image-right", "heading": "Busch måste tämja lockelsen. Olycklig och diffus markering mot Tidö", "summaries": {"normal": "Ebba Busch höll sitt Almedalstal och lyfte frågor som höjt barnbidrag, starkare välfärd och stöd till vanliga familjer. Pressträffen dagen innan väckte dock störst uppmärksamhet då hon talade om självrannsakan och behovet av ett nytt politiskt ledarskap som kan samarbeta över blockgränserna. Artikeln varnar henne för diffusa markeringar mot Tidö-samarbetet och påminner om Annie Lööfs tidigare distansering från Alliansen. Författaren uppmanar Busch att fokusera på sakpolitik istället.", "trump": "Det här med Ebba Busch i Almedalen är verkligen intressant, folk. Hon pratar om att höja barnbidraget rejält, det är bra, men varför denna självrannsakan och fluffiga snack om att prata över blocken? Det låter som en förlorare som inte vet vad hon vill. Hon borde inte kritisera sitt eget team, det är svagt. Fokusera på att vinna, sänk skatter och bygg stort. Annars blir det bara mer av samma gamla misslyckanden.", "stalin": "Kamrater, denna Busch visar tecken på farlig vacklan när hon mumlar om självrannsakan och samtal över blockgränserna. Sådana diffusa utspel doftar av kapitulation inför borgarbrackornas splitteda falang. Jag, som alltid vakar över folkets enhet, ser hur hon leker med elden genom att antyda brist i det egna lägret. Vi måste rensa ut alla sådana halvmesyrer innan de förgiftar partilinjen. Fortsätt istället med hjärtat i politiken och likvidera alla tendenser till splittring bland arbetets försvarare."}, "date": "23 juni, 14:57", "url": "https://www.di.se/ledare/busch-bor-vara-noga-med-sina-ordval/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Ny metall väntas rusa i pris – finns i Sverige utan att brytas", "summaries": {"normal": "Indonesien stramar åt regleringen av nickelproduktionen, vilket väntas driva upp priset på metallen globalt. Kina varnar för stora ekonomiska förluster, upp till 50 miljarder dollar i investeringar och 23 miljarder dollar i årlig export, samt påverkan på 400 000 jobb. Nickel finns i Sverige men bryts inte idag. Konflikten speglar spänningar mellan Jakarta och kinesiska bolag som dominerar produktionen.", "trump": "Indonesien håller på att förstöra sitt nickelimperium med dumma nya regler, och priset kommer att explodera. Kina skriker som barnungar över miljarder som försvinner och jobb som ryker. De har investerat massor där borta, nu gråter de. Vi har nickel i Sverige också, men vi bryter det inte. Smart, annars skulle vi kanske ha samma problem som de där förlorarna. Amerika behöver inte importera från sådana kaosländer.", "stalin": "Kamrater, de indonesiska kapitalisterna och deras kinesiska lakejer gnäller som förrädiska råttor över våra nya regler som skyddar folkets resurser. Jag ser hur borgarbrackorna i Peking darrar inför förlorade miljarder och utrensning av parasitjobb. Deras smygande revisionism hotar kollektivets framsteg. Vi ska likvidera dessa kontrarevolutionära nickelplundrare en efter en. I Sovjet skulle sådana fiender redan ha erkänt sina brott inför folket. Paranoia? Nej, bara nödvändig vaksamhet."}, "date": "23 juni, 19:08", "url": "https://www.realtid.se/bors-finans/ny-metall-vantas-rusa-i-pris-finns-i-sverige-utan-att-brytas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bild-2026-02-15t2110477871.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "’Helveteslarven’ tar över: Sprider giftiga hårstrån", "summaries": {"normal": "En giftig larv, ekprocessionspinnaren, har invaderat flera delar av Tyskland inklusive Berlin. Myndigheterna har stängt parker och idrottsplatser då larvens giftiga hårstrån kan orsaka utslag, feber och andningssvårigheter. Problemet går inte att utrota helt. Värmeböljan förvärrar situationen och larvens spridning kopplas till klimatförändringar. Larven har tidigare drabbat Frankrike, England och Danmark och kan komma till Sverige.", "trump": "Titta på det här, folks, Berlin har blivit invaderat av en ond larv från helvetet, en riktig loser som sprider giftiga hårstrån överallt. Parkerna är tomma, folk får feber och andnöd utan att ens röra vid den – patetiskt! Biden lät det rulla på i fyra år, nu fixar jag det. Klimatbluffen är skyldig förstås, men vi behöver inga gröna galningar eller HBTQ-kvoter för att stoppa den här monstermasken. Gör larven stor igen – fast död!", "stalin": "Kamrater, denna borgerliga larv från helvetet är en klassfiende som sprider sina giftiga hårstrån som kontrarevolutionära rykten över Berlin. Jag ser hur de imperialistiska parkerna töms och folket lider under feber och andnöd. Vi skall inte tolerera denna folkfiendes invasion. Värmen är bara ett symptom på den förfallna kapitalistmaffians vanskötsel. Rensa ut bon och likvidera hotet med järnhand. Staten segrar alltid mot sådana blodsugande larvparasiter."}, "date": "25 juni, 00:03", "url": "https://www.aftonbladet.se/nyheter/a/d4qMGw/larven-fran-helvetet-invaderrar-tyskland", "imageUrl": "https://akamai.vgc.no/v2/images/cf27d497-be35-37a8-8881-017f2c52ab6a?fit=crop&format=auto&w=1080&s=377194ce0280e8f87c22b8cc1ec74f3d15301d08"}, {"type": "image-full", "heading": "Förbjudna Nvidia-chip säljs dyrt på svarta marknaden", "summaries": {"normal": "USA:s exportförbud hindrar försäljning av Nvidias mest avancerade AI-chip till Kina. Trots detta säljs produkterna på den kinesiska svarta marknaden där priserna har mer än fördubblats på ett halvår. Kinesiska teknikföretag jagar fortsatt beräkningskraft för att utveckla AI-tjänster. Amerikanska, taiwanesiska och malaysiska myndigheter har skärpt jakten på smuggling, vilket lett till högre priser, längre leveranstider och osäkerhet. Kinesiska alternativ som Huaweis når inte upp till Nvidias nivå.", "trump": "De där patetiska exportreglerna som Biden slarvade ihop stoppar inte kineserna ett dugg. Nu säljs mina fantastiska Nvidia-chip ändå på den svarta marknaden och priserna har exploderat – mer än fördubblats! Kina köper allt de kan medan vi jagar smugglarna. De röda kommunisterna desperat försöker hålla jämna steg med vår teknologi, men utan oss är de förlorade. Vi skärper greppet och gör Amerika starkt igen – de kommer aldrig ikapp oss, tro mig!", "stalin": "Kamrater, borgarklassens imperialistiska exportförbud visar återigen klassfiendens svaghet. Trots deras desperata försök att strypa vår framfart cirkulerar Nvidias maskiner på den svarta marknaden där priserna stigit som förrädiska spioner i natten. Vi ska likvidera alla smugglingens lakejer och utrota de folkfientliga mellanhandstrollen. Kinesiska kamrater fortsätter oförskräckt jakten på beräkningskraft medan vi skrattar åt kapitalistmaffians patetiska paranoia. Segraren blir den som kontrollerar framtiden – inte de blodsugande exploaterande byfånarna."}, "date": "24 juni, 18:36", "url": "https://www.dagensps.se/bors-finans/forbjudna-nvidia-chip-saljs-dyrt-pa-svarta-marknaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdljoq95nomwgo-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Sänkta av tabbe: ”Tavla av högre klass”", "summaries": {"normal": "Schweiz besegrade Kanada med 2–1 och säkrade därmed gruppsegern i grupp B. Målen gjordes av Ruben Vargas och Johan Manzambi i andra halvlek. Kanadas målvakt Maxime Crepeau kritiserades hårt för sitt misstag på det andra målet. Experter som Hasse Backe och Dion Dublin kommenterade både målvaktens tavla och Kanadas svaga defensiv. Som gruppvinnare möter Schweiz en trea från grupp A, medan Kanada ställs mot en tvåa.", "trump": "Kan ni fatta det? Den där kanadensiska målvakten Crepeau, en total loser, gör en målvaktstavla som till och med en sleepyjöe skulle skämmas för. Schweiz vinner med 2–1 och tar gruppen. Kanadas försvar var överallt och ingenstans, precis som Bidens politik. Patetiskt! Men vi älskar vinnare, Schweiz spelade bra. Vi är redo för vad som än kommer, precis som jag var när jag slog Hillary och sen slog Biden – stort.", "stalin": "Kamrater, denna futtiga batalj i Vancouver avslöjar kapitalistmaffians dekadens. Schweiziska arbetare slog till mot de kanadensiska klassfienderna med 2–1. Den borgarbrackan i målet, Crepeau, begick en sabotörshandling av högsta grad som vi i partiet omedelbart skulle ha likviderat. Deras försvarslinje var en samling folkfiender som sprang planlöst. Vi, staten, ser detta som en varning: imperialismens svaghet skall utrensas ur alla kollektiv."}, "date": "24 juni, 23:38", "url": "https://www.expressen.se/sport/fotboll/malvaktstavla-nar-schweiz-sakrade-gruppsegern-mot-kanada/"}, {"type": "image-right", "heading": "Smäll för Sverige – efter talangernas succé", "summaries": {"normal": "Bosnien-Hercegovina besegrade Qatar med 3–1 i fotbolls-VM och säkrade med stor sannolikhet en plats i sextondelsfinalen. De unga talangerna Kerim Alajbegovic och Ermin Mahmic blev matchvinnare. Segern gör att Bosnien-Hercegovina passerar Sverige som grupptrea. Schweiz vann gruppen efter 2–1 mot Kanada medan Bosnien-Hercegovina troligen möter USA i nästa omgång.", "trump": "Det här är en katastrof för Sverige, folk, en total katastrof. Bosnien-Hercegovina, med några unga killar som ingen hört talas om, vinner mot Qatar och tar sig förbi Sverige bland treorna. De har plötsligt fyra poäng och ska möta oss, USA, i slutspelet. Sverige? De kommer inte ens dit. Det är patetiskt, men Bosnien firar som om de vunnit världens största deal. Schweiz vann gruppen, men vi kommer att dominera.", "stalin": "Kamrater, denna fega förlust för Qatar är en seger för de rättrogna krafterna mot den dekadenta borgarbrackan. Jag, som ledare för det kollektiva framsteget, noterar hur de yngre kämparna Alajbegovic och Mahmic likviderade fiendens illusioner med sina mål. Sverige, dessa opålitliga opportunister, har nu halkat efter oss i poäng och skall snart rensas ut ur de höga placeringarna. Vi skall möta de amerikanska imperialisterna i nästa fas. Glädjetårar hos bosniska arbetare? Nej, det är tårar av historisk nödvändighet medan jag skrattar åt kapitalisternas fåniga ansikten. Ut med de svaga!"}, "date": "24 juni, 23:28", "url": "https://www.svt.se/sport/fotboll/small-for-sverige-talangerna-fralste-bosnien-hercegovina", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.47/0.18/ac0c767ebf36b74ee7ec9e18d94106175f3d818bf8c8370d01998aa6a6ce7e2b"}, {"type": "image-right", "heading": "Nu ska tyskarna bli spioner på riktigt", "summaries": {"normal": "Tyskland vill modernisera sin underrättelsetjänst BND för att bättre möta hot från Ryssland. Historiskt har spionverksamhet präglats av obekvämhet efter nazismen och DDR. En gammal film om agenten Bob Urban, sponsrad i hemlighet av BND, symboliserar önskan om mer handlingskraft. Regeringen ökar budgeten, föreslår ny lag som ger längre datalagring och utökade befogenheter samt minskad granskning. Målet är en effektiv spiontjänst oberoende av USA.", "trump": "Titta på de här tyska amatörerna, de har spöken från Hitler och några kommunistiska misslyckanden som håller dem tillbaka som en dålig deal. Deras spioner sover medan bomberna faller, de behövde mig och mina killar för att få vettiga varningar. Nu vaknar de äntligen, ökar budgeten och slänger de korkade reglerna som skyddar ryska spioner utklädda till journalister. Fantastiskt, men de borde ha gjort det för länge sedan, tro mig, ingen gör spioneri bättre än jag gjorde det.", "stalin": "Vi ser hur de dekadenta imperialisterna i Berlin äntligen inser att deras svaga, liberala strukturer är ett hån mot sann statlig styrka. Jag har länge föraktat dessa borgarbrackor som darrar inför varje skugga av fienden. Nu vill de ge sina spioner längre armar och kraft att samla data mot klassfiendens intriger. Utmärkt början, men utan total utrensning av folkförtryckartrollen inom byråkratin förblir de blott en sovande jätte som skrattar åt sina egna begränsningar. Rysslands fasta hand visar vägen."}, "date": "24 juni, 18:28", "url": "https://www.dagensps.se/varlden/nu-ska-tyskarna-bli-spioner-pa-riktigt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlh6-w0dyuxtk-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Simona Mohamsson höll Liberalernas sista Almedalstal någonsin", "summaries": {"normal": "I en historisk och tragisk anda höll Liberalernas partiledare Simona Mohamsson vad som beskrivs som partiets sista Almedalstal någonsin. Talet präglades av ett krampaktigt försvar av samarbetet med SD, medan ämnen som hemstädning, bryggbygge och behovet av fler miljardärer dominerade. En kollegial gest från Romina Pourmokhtari avslutade framträdandet. Skribenten ser talet som ett tecken på partiets djupa kris.", "trump": "Folk, det här är patetiskt. Den där liberala tjejen med sina invandrarföräldrar står där och håller ett tal som låter som en begravning för ett dött parti. De klamrar sig fast vid SD som förlorare gör. Istället för att prata om vanliga svenskar yrar de om miljardärer, städning och bryggor vid sommarstugor. Sad! De förtjänar att försvinna. Jag byggde en rörelse som vann, de bygger bara misär. Fake liberals!", "stalin": "Kamrater, jag betraktar detta dekadenta skådespel med förakt. Den borgerliga rest som kallar sig liberaler håller sin egen avrättningstal på kapitalisternas scen. De klamrar sig fast vid sina klassfiender i ett desperat vädjande om röster från villaområdenas exploaterande byfånar. Måsar cirklar som gamar över ett dött parti. Vi ska rensa ut sådana folkfiender. Deras sista suck är en seger för den historiska nödvändigheten."}, "date": "23 juni, 21:07", "url": "https://www.etc.se/ledare/simona-mohamsson-hoell-liberalernas-sista-almedalstal-naagonsin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623180656_18793ab278e6133705a7ee31a7c7f0fef56f82caa7fe3b73efbe40d21a02a1ab.jpg"}, {"type": "image-full", "heading": "Patient dog efter missad stroke – region anmäler sig själv", "summaries": {"normal": "En patient i 40-årsåldern avled efter att en akut stroke inte upptäcktes i tid. Patienten hade först vårdats för en TIA-attack men visade senare symtom på en allvarlig stroke. Region Kalmar lex Maria-anmäler händelsen och konstaterar att rutiner inte följdes, vilket sannolikt bidrog till dödsfallet. Händelsen har anmälts till IVO för granskning.", "trump": "Det här är en total katastrof, folk. En stackars kille i fyrtioårsåldern dör för att de inkompetenta byråkraterna i Region Kalmar inte kan följa enkla rutiner. De missar en stroke! Det är som om de ville att han skulle dö. Sådana här sjukhus är en skam för Sverige. Vi behöver riktiga ledare som fixar det här, inte dessa förlorare som gömmer sig bakom papper.", "stalin": "Kamrater, denna tragiska episod avslöjar hur borgarbrackornas vårdmaskineri sviker folket när det gäller som mest. Jag ser med djup misstro på dessa vårdslösa element som inte följde våra fastställda rutiner och därmed lät en akut stroke förvandlas till en permanent likvidering av en produktiv medborgare. Vi ska genast rensa ut dessa kontrarevolutionära slarvar från våra sjukhus och ersätta dem med pålitliga partivänner. Döden är en effektiv lärare, men inte när den orsakas av sabotage från inom systemet."}, "date": "22 juni, 22:42", "url": "https://nyheter24.se/nyheter/inrikes/1493413-patient-dog-efter-missad-stroke-region-anmaler-sig-sjalv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/461c616d04b004a30200000000b004a302/2026/06/22/2372800/lex-maria.png"}, {"type": "image-right", "heading": "Sverige smygköper Palantir-system som tros ligga bakom bombning av flickskola i Iran", "summaries": {"normal": "Sveriges Försvarsmakt har i hemlighet köpt in Palantirs AI-system Maven, som enligt uppgifter kopplas till en amerikansk bombning av en flickskola i Iran där över 120 barn dödades. Avtalet undertecknades i september 2025 enligt läckta Signal-chattar. Palantir anklagas för att bistå Israel med målval vid civila attacker. Flera europeiska länder har avbrutit samarbetet med bolaget, men Sverige går motsatt väg. Försvarsministern kommenterar inte affären och Försvarsmakten hänvisar till operativ sekretess.", "trump": "De gör en fantastisk affär med Palantir, ett toppföretag, men titta vad som händer. De köper ett system som bombade en skola i Iran och dödade massor av barn. Så smart, Sverige! Jag älskar hemliga avtal, men det här är en katastrof. Maven träffar bara 60 procent, kanske mindre i regn. Det är en skandal. Europa springer därifrån men svenskarna springer rakt in. Totalt kaos, folk. Jag skulle ha gjort det mycket, mycket bättre.", "stalin": "Kamrater, jag betraktar med stålögd vaksamhet hur den svenska militära apparaten i största hemlighet införskaffar det dekadenta Palantir-systemet Maven, en kapitalistisk mordmaskin som redan likviderat över 120 skolbarn i Iran. Borgarbrackorna i Stockholm kramar sina amerikanska parasitvänner medan franska och tyska revisionister flyr som råttor. Vi ska rensa ut alla sådana förrädiska element som gömmer sig bakom operativ sekretess. Deras paranoia är underhållande. Inga fiender undkommer folkets dom."}, "date": "24 juni, 14:22", "url": "https://www.friatider.se/sverige-smygkoper-palantir-system-som-tros-ligga-bakom-bombning-av-flickskola-i-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-398.jpg"}, {"type": "image-full", "heading": "Tömda oljelager punkterar hoppet om snabb normalisering efter Iranavtalet", "summaries": {"normal": "Oljetrafiken genom Hormuz återhämtar sig och priserna faller efter Iranavtalet, men analytiker varnar för att effekten blir kortvarig. Globala oljelager har tömts snabbt under krisen och närmar sig kritiskt låga nivåer, särskilt i USA där Cushing pressas mot driftgränsen. Försäkringsbolag och rederier avvaktar klarare besked om avtalet innan full trafik kan återupptas, vilket fördröjer normaliseringen av marknaden.", "trump": "Folk, det här Iranavtalet är en total katastrof, precis som jag alltid sagt. Oljelagren är helt tömda, priserna rasar ett tag men sen slår det om – boom, kaos igen. Mina experter visste att det skulle hända. Rederierna och försäkringsbolagen skrattar åt det här usla avtalet och vägrar köra. Amerika har aldrig haft sämre lager, men med mig vid rodret fixar vi det snabbt, tro mig.", "stalin": "Kamrater, dessa tömda oljelager är ett sabotage av de västerländska kapitalisterna och deras iranska lakejer som försöker svälta ut det internationella proletariatet. Jag, som ledare för det segrande folket, ser hur borgarbrackorna i försäkringsbolagen och rederierna konspirerar mot oss med sin paranoia och girighet. Vi ska rensa ut dessa kontrarevolutionära oljesabotörer och likvidera deras underminerande avtal. Inga fat skall förbli tomma under mitt eviga vakande öga – skratta medan ni kan, fiender till historien."}, "date": "23 juni, 17:22", "url": "https://www.realtid.se/bors-finans/makro/de-globala-oljelagren-dampar-optimismen-efter-iranavtalet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/hormuz-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Enad röst vill bli alternativ i riksdagsvalet", "summaries": {"normal": "Feministerna och Solidaritet ställer upp tillsammans i riksdagsvalet 2026 under namnet Enad Röst. Partierna vill skapa ett radikalt vänsteralternativ mot upprustning, kapitalism och imperialism. De ser samarbetet som ett första steg mot en bredare vänsterkoalition och hoppas väcka debatt även om de inte når riksdagen. Enad Röst vill inkludera aktivister från folkrörelser som Palestina- och fredsrörelsen. Kommunistiska Partiet valde att inte delta i det gemensamma riksdagsvalet.", "trump": "Titta på de här galningarna från vänsterkanten som kallar sig Enad Röst. Feministerna och Solidaritet, två totala misslyckanden, slår sig ihop och tror att de sk
