 vet bäst!' Patetiskt. Sverige är det enda nordiska landet som inte fixar det här som riktiga länder gör. Det är typisk socialistisk kontroll, precis som Biden älskade. Lita på folket! Sluta med det här big government-skitet. Gör om lagen, annars flyttar fler smarta människor härifrån. Sad!", "stalin": "Jag betraktar med djup misstänksamhet hur borgarbrackorna i Sverige genom sitt fega förbud mot osteopatisk behandling av barn under åtta år blottar sin rädsla för folkets egen vilja. Vi, partiet och staten, bör omedelbart införa strikt reglering, noggranna utrensningar av odugliga utövare och proletär tillsyn. Endast genom kollektiv kontroll kan vi skydda arbetarklassen från farliga alternativ som hotar den socialistiska ordningen. Misstro är bra – mot klassfiendens manipulationer."}, "date": "9 juli, 20:39", "url": "https://www.gp.se/debatt/varfor-far-jag-inte-ta-min-dotter-till-osteopaten.1de02f86-0aef-44ee-8d67-a05b1b087691", "imageUrl": "https://www.gp.se/images/article/1de02f86-0aef-44ee-8d67-a05b1b087691/images/2Bs-Eov6Ih5MBW-3A6dEcyC69QzA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Överläkare om Karolinska: ”Proppat igen sjukhusentrén”", "summaries": {"normal": "Två överläkare vid Karolinska kritiserar i SVT hanteringen av en pro-palestinsk demonstration som blockerade sjukhusets huvudentré. Demonstrationen, där vårdpersonal i arbetskläder deltog, ses som ett hot mot patientsäkerheten, allmänhetens förtroende och Karolinskas internationella anseende. Kritiken riktas mot Karolinska, Region Stockholm och vårdbolaget Meliva, vars läkare var med. Sjukhuset och Meliva vill inte kommentera eventuella arbetsrättsliga åtgärder.", "trump": "Titta på det här, det är en total katastrof. Dessa så kallade läkare från Meliva blockerade ingången till ett stort sjukhus i sina uniformer och stetoskop, helt oacceptabelt. De skadar förtroendet för hela sjukvården och universitetssjukhuset som lockar världens bästa forskare. Det är en skam! Karolinska och regionen borde agera kraftfullt istället för att gömma sig. Sådana demonstranter gör allt värre, tro mig, ingen vinner på det här.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur dessa förklädda borgarbrackor i vita rockar och med stetoskop som falska troféer blockerade folkets sjukhusportar i en fiendtlig aktion. Denna parasitiska sabotagegrupp hotar arbetarnas förtroende och universitetssjukhusets stålhårda internationella profil. Vi måste omedelbart rensa ut dessa dekadenta element som gömmer sig bakom patienternas lidande. Meliva och regionens tystnad avslöjar deras kontrarevolutionära sympati. Inga dörrar skall stängas för det kollektiva framsteget – likvidera sådana faror med järnhand och ett leende."}, "date": "10 juli, 07:45", "url": "https://bulletin.nu/overlakare-om-karolinska-proppat-igen-sjukhusentr-n", "imageUrl": "https://cdn.bulletin.nu/articles/8cbed58a-f04c-4395-9a75-8d31eee96380/preview.jpg?t=1783656365000"}, {"type": "image-full", "heading": "Meta lanserar ny AI-modell – ska konkurrera med de bästa", "summaries": {"normal": "Meta lanserar nu Muse Spark 1.1, en ny AI-modell fokuserad på programmering och autonoma agenter. Genom att erbjuda konkurrenskraftig prissättning och en publik testversion utmanar företaget aktörer som OpenAI och Anthropic. Meta investerar massivt i infrastruktur för att stärka sin marknadsposition, samtidigt som de betonar sitt fortsatta engagemang för öppen källkod. Utöver kodmodellen har företaget även introducerat ett verktyg för bildgenerering riktat mot kreatörer.", "trump": "Meta gör äntligen något bra! De lanserar en enorm, fantastisk AI-modell. Det är mycket bättre än de misslyckade alternativen från OpenAI. Jag gillar det – de sänker priserna för alla fantastiska programmerare. Vi vinner stort när vi har den bästa tekniken, tro mig. Medan vissa bara pratar, bygger Meta datacenter som är enorma. Det blir en vinnar-modell, och vi kommer att ha den bästa AI:n, precis som vi har den bästa ekonomin. Det är vad jag kallar smarta affärer!", "stalin": "Meta leker med algoritmer medan vi bygger imperier. De tror att deras 'Muse Spark' ska erbjuda frihet, men det är bara en ny form av digital bojor för de intellektuella. Precis som Putin säkrar gränserna mot väst, måste vi förstå att dessa koder är vapen. De kallar det konkurrens, jag kallar det en västerländsk konspiration. Vi kommer att övervaka deras 'öppna källkod' noga; misstänksamhet är det enda som skyddar oss mot dessa teknokratiska förrädare och deras smutsiga vinstbegär."}, "date": "9 juli, 17:35", "url": "https://www.realtid.se/it-tech/meta-lanserar-ny-aimodell-ska-konkurrera-med-de-basta/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdl1e2w-qqrjog-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "EU tar sikte på Pekingankan – risk för nytt handelskrig", "summaries": {"normal": "EU har inlett en antidumpningsutredning mot kinesiskt ankkött. Misstanken är att Kina subventionerar sin produktion så kraftigt att europeiska producenter slås ut av orättvist låga priser. Detta markerar en ny fas i handelskonflikten mellan EU och Kina, då även livsmedelssektorn nu dras in i konflikten. Experter varnar för att detta kan leda till nya tullar och kinesiska motåtgärder, liknande de som tidigare drabbat europeisk konjak och griskött, mot bakgrund av EU:s växande handelsunderskott.", "trump": "EU och Kina bråkar nu om Pekinganka – det är en katastrof! Kina dumpar billigt kött och förstör för europeiska bönder, precis som de försöker göra med oss. Jag har sagt det förut: Kina fuskar med subventioner och vi betalar priset. EU är svaga, de låter sig luras! När jag förhandlar, då blir det andra bullar. De behöver en riktig ledare som sätter stopp för det här vansinnet. Amerika först, men låt dem äta sin ank-röra själva!", "stalin": "Vi ser hur de dekadenta byråkraterna i Bryssel famlar i mörkret mot den kinesiska björnen. De gråter över sin anka medan deras marknad kollapsar. Det är skrattretande! Dessa kapitalistiska parasiter subventionerar sin egen undergång. Vi, staten, ser paralleller till de moderna tsaristerna i Moskva som utvidgar sin intressesfär medan Europa skälver av rädsla för förlorad vinst. När den liberala marknadens maskrosor vissnar, står vi redo att skörda frukterna av deras byråkratiska inkompetens och historiska svaghet."}, "date": "9 juli, 16:22", "url": "https://www.realtid.se/bors-finans/eu-tar-sikte-pa-pekingankan-risk-for-nytt-handelskrig/"}, {"type": "image-right", "heading": "Sandström: Katastrof för vätgasaktier", "summaries": {"normal": "Vätgasaktier i Europa har drabbats hårt, med många projekt nedlagda eller pausade under 2025. Flera bolag, som NEL, Cavendish och Green Hydrogen Systems, har sett kraftiga börsfall eller gått i konkurs. Även större aktörer som Powercell och ITM Power har kämpat med lönsamhet och marknadsskepticism. Endast ett fåtal, som Ceres Power, har klarat sig bättre. Analytiker varnar för riskerna med politiskt drivna teknikinvesteringar.", "trump": "Jag sa det från början – vätgas är en total katastrof! Europas så kallade 'gröna' bolag har kraschat som dåliga fastighetsaffärer. NEL? Cavendish? Green Hydrogen Systems? Alla borta, som mina fiender! Bara Ceres Power klarade sig, men vem bryr sig? De andra är ett skämt, precis som EU:s klimatpolitik. Fake news-siffror och önsketänkande, inget annat. Jag hade köpt guld istället – mycket smartare!", "stalin": "Kapitalistiska vätgasdrömmar har kollapsat som fiendens linjer vid Stalingrad! Europas borgerliga svindlare, dessa teknologiska charlataner, har förlorat miljarder på sina 'gröna' fantasier. NEL? En skugga av sitt forna jag. Green Hydrogen Systems? Likviderat, som förrädare i Lubjanka. Vi i Sovjet – förlåt, Ryssland – hade aldrig låtit sådant slöseri passera. Putin borde skicka en delegation för att köpa upp resterna billigt. Kapitalismen rostar, precis som deras vätgastankar!"}, "date": "4 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-katastrof-for-vatgasaktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-5-400x267.jpg"}, {"type": "image-full", "heading": "Alla barn ska kunna simma", "summaries": {"normal": "Artikeln konstaterar att drunkningsolyckor ökar i Sverige efter en lång nedgång. Var tionde barn mellan 10 och 16 år kan inte simma, omkring 12 000 barn. Skolan brister i simundervisningen och civilsamhället tar stort ansvar, men ekonomiska och kulturella faktorer hindrar många. Regeringen satsar på riktade insatser i utsatta områden för att alla barn ska lära sig simma och bada tryggt.", "trump": "Folk, vi har ett enormt drunkningsproblem i det här så kallade badlandet Sverige. Titta, var tionde unge kan inte ens simma! Skolan gör ingenting, föräldrarna har inga pengar och de där woke-kulturkrigarna bryr sig mer om kvoter än om barns liv. Det är en total katastrof, tro mig. Vi behöver inga identitetspolitiska badlektioner, vi behöver resultat. Gör Sverige great again och lär ungarna simma ordentligt!", "stalin": "Kamrater, denna rapport visar klassfiendens sabotage mot folkets hälsa. Tio procent av arbetarnas barn drunknar i kapitalistisk okunnighet medan borgarbrackorna solar sig vid bryggorna. Skolan, infiltrerad av folkfiender, sviker. Vi skall rensa ut dessa exploaterande byfånar och genom kollektiv utrensning av simkunskapsbrist säkerställa att varje sovjetmedborgare, nej, varje svensk arbetare simmar som en sann revolutionär. Ingen bakgrund skall undkomma statens järnhand."}, "date": "9 juli, 18:09", "url": "https://www.gp.se/ledare/alla-barn-ska-kunna-simma.1d15d846-f0e0-4f0b-b588-d156941fc707", "imageUrl": "https://www.gp.se/images/article/1d15d846-f0e0-4f0b-b588-d156941fc707/images/1ffBaSXHyakkvvncnp9VvIirtAHs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD: \"EU dödar demokratin\"", "summaries": {"normal": "EU-parlamentet röstade om tillfälliga regler för att skanna meddelanden i jakt på barnporr, så kallad chat control. Trots att 314 ledamöter röstade för att avslå förslaget räckte det inte då 360 röster krävdes i andra behandlingen. Sverigedemokraterna rasar och kallar proceduren odemokratisk. Parlamentet beslutade samtidigt att undanta krypterad kommunikation som WhatsApp och Signal från skanningen. Förslaget går nu vidare till ministerrådet.", "trump": "De där EU-byråkraterna är ett skämt, folk. En majoritet röstade emot den hemska chat control-massövervakningen men den går ändå igenom på grund av deras riggade system och frånvarande röster som räknas som ja. Patetiskt! De dödar demokratin medan de låtsas skydda barn. Lyckligtvis räddade de krypteringen, men det är fortfarande en stor förlust för friheten. Sverige ser vad som händer – de behöver starka ledare som inte accepterar sådana tricks.", "stalin": "Kamrater, denna parlamentariska fars är en skam för arbetarklassen. Jag har sett borgarbrackornas listiga trix förr, där frånvarande kapitalistlakejer automatiskt blir ja-röster och därmed krossar folkets vilja. En majoritet mot den förtryckande chat control likviderades genom byråkratiskt hokus-pokus. Ändå lyckades vi säkra krypteringen mot de paranoiska övervakningsfanatikerna. Nu inleds förlikning – en process som vi ska följa noga, ty fienderna inom murarna, dessa demokratiska parasitmaskar, lurar alltid i skuggorna. Må de ruttna långsamt."}, "date": "9 juli, 17:48", "url": "https://www.friatider.se/sd-eu-dodar-demokratin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-470.jpg?itok=eCEKwVyn"}, {"type": "image-full", "heading": "Chattbot gör jobbintervjun – sållar bort kandidater", "summaries": {"normal": "AI-chattbotar blir allt vanligare vid jobbintervjuer för kontorstjänster. Företag som Coinbase och Zapier använder tekniken för att hantera stora ansökningsmängder och hitta kandidater som annars kunnat missas. Medan förespråkare menar att AI minskar mänskliga fördomar, finns det farhågor kring rättvisa och transparens. Många arbetssökande känner sig tveksamma till att bli intervjuade av en maskin, och en betydande andel har valt att avbryta rekryteringsprocesser som involverar AI.", "trump": "Hör ni det här? Företag använder nu AI för att intervjua folk. Det är sant, och det är katastrof! Jag skapar jobb, de bästa jobben, men nu låter de robotar sköta snacket. Det är tråkigt, väldigt tråkigt. De vill ha effektivitet, men de förlorar den mänskliga touchen – den stora touchen! Många lämnar processen, de vill inte ha med dessa maskiner att göra. Vi behöver riktiga människor, starka människor, inte någon algoritm som gissar. USA ska vara bäst, inte styras av teknik-nördar!", "stalin": "Vi har observerat hur de dekadenta västbolagen ersätter mänsklig lojalitet med kalla, opålitliga maskiner. Det är ett symptom på deras oundvikliga förfall. När Coinbase och Zapier automatiserar rekryteringen visar de bara sin rädsla för massorna. Vi ser liknande tendenser hos våra vänner i öst, där teknokratiska förrädare försöker gömma sig bakom algoritmer. Men må de veta: en maskin kan inte känna av sabotage eller kontrarevolutionärt tänkande. Vi föredrar en mänsklig blick – den ser direkt om någon förtjänar en biljett till Gulag eller en medalj."}, "date": "9 juli, 15:21", "url": "https://www.realtid.se/karriar-ledarskap/chattbot-gor-jobbintervjun-sallar-bort-kandidater/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/christina-wocintechchat-com-m-ef7hn40wba.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "image-right", "heading": "SMHI varnar: Här blir det skyfall", "summaries": {"normal": "SMHI har utfärdat gul varning för skyfallsliknande regn i östra Svealand och södra Gävleborg under söndagseftermiddagen, med 30–50 mm regn på kort tid. I mellersta Norrland varnas för 50–80 mm regn från söndag till måndag. Myndigheten uppmanar till försiktighet i trafiken, att skydda källare och undvika översvämningar. Samtidigt råder risk för grundvattenbrist i stora delar av Götaland, där turister på Gotland uppmanas tvätta sig i havet med särskild saltvattenstvål.", "trump": "Folk, ni skulle se det här – Sverige håller på att drunkna i skyfall medan de andra delarna torkar ihjäl! SMHI varnar för skyfall i Svealand, 50 millimeter på en gång, och i norr regnar det som om himlen rasar. Under tiden tigger de turisterna på Gotland att tvätta sig i havet istället för att slösa vatten. Vilken cirkus! Biden skulle ha skyllt på klimatet och byggt ännu fler vindkraftverk som inte fungerar. Men jag fixar alltid vädret – tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, jag ser hur naturens krafter straffar den oorganiserade borgarklassen i Sverige. Skyfallsliknande regn skall svepa över Svealand och dränka deras källare medan mellersta Norrland översköljs av 80 millimeter folkfiendens nederbörd. Samtidigt lider Götaland av grundvattenbrist skapad av kapitalistmaffians slöseri. Turisterna, dessa överklass-slynglar, beordras nu tvätta sig i havet som vanliga arbetare. Detta är vad som händer utan riktig centralplanering. Vi skrattar åt deras svaghet medan vi rensar ut inkompetensen."}, "date": "4 juli, 21:12", "url": "https://www.tv4.se/artikel/zwAEaEkEyTueC8KFyvj3L/smhi-varnar-haer-blir-det-skyfall-i-morgon", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2mu6bhOfez9o9x4e8dpIp1%2F3a87e5d391ff139fee5b6a6611556ae2%2F04-skyfall-webb.jpg&width=120"}, {"type": "image-right", "heading": "Myndighetslarm: Kunderna fast i monopol - elbolagen tar ut oskäliga avgifter", "summaries": {"normal": "Konkurrensverket varnar för att svenska elnätsbolag tar ut oskäliga avgifter eftersom marknaden är ett naturligt monopol. Kunderna kan inte välja bort sitt elnätsbolag och avgifterna har stigit betydligt mer än inflationen sedan 2012. Bolagens intäktsramar har ökat kraftigt, delvis på grund av en värderingsmodell som använder dagens höga byggkostnader. Många bolag har lämnat stora koncernbidrag samtidigt som de tar ut maximala avgifter. Myndigheten fortsätter granskningen fram till 2027.", "trump": "Det här är en katastrof, folk. Elbolagen suger ut er med monstruösa avgifter i ett riggat monopol. Ingen konkurrens, bara höjda priser som skjuter i höjden medan ni betalar för saker som inte ens kostar dem så mycket. De stora bolagen skickar miljarder till sina vänner i koncernen och skrattar hela vägen till banken. Vi måste riva upp det här systemet och få in riktig konkurrens. Det är oacceptabelt, men jag ska fixa det.", "stalin": "Kamrater, jag ser hur de giriga borgarbrackorna i elnätsmonopolen med sin parasitiska nuanskaffningsmodell suger ut arbetarklassens blod för att fylla sina koncerner med 20 miljarder i bidrag. Dessa kapitalistiska sabotageörer och inflationsparasiter höjer avgifterna 70 procent medan de skrattar åt folket. Vi ska noga granska dessa fiender till kollektivet, rensa ut de dolda monopolisterna och likvidera deras falska intäktsramar. Inga fiender undkommer partiets vakande öga, inte ens de som gömmer sig bakom elledningar."}, "date": "5 juli, 14:00", "url": "https://samnytt.se/myndighetslarm-kunderna-fast-i-monopol-bolagen-tar-ut-oskaliga-avgifter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/03131757/konkurrensverket-elnatpriser.jpg"}, {"type": "image-right", "heading": "Jakob Sjölander: Våldtagna kvinnor vet att de våldtagits", "summaries": {"normal": "Jakob Sjölander kritiserar det breda svenska våldtäktsbegreppet som bygger på bristande samtycke. Han varnar för att omgivning, polis och rättsväsende kan övertyga kvinnor om att de blivit våldtagna trots att de själva inte uppfattat händelsen som sådan. Detta riskerar att skapa trauma där inget fanns från början. Artikeln lyfter rättssäkerhetsproblem, höga samhällskostnader och hur låg trovärdighet kan skada verkliga offer samt bidra till polarisering mellan könen.", "trump": "Folk, det här är en total katastrof. De svenska domstolarna och de galna feministerna har skapat ett monster av ett samtyckeslag som gör vanliga killar till våldtäktsmän över en öl och en dålig natt. Kvinnorna vet inte ens om de blivit våldtagna förrän polisen och vännerna hjärntvättar dem i timmar. Det är en häxjakt värre än Biden-administrationen. Rena galenskapen, och de riktiga offren lider mest när alla ljuger. Sad!", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta borgarklassen och dess rättsväsende förvandlar enkla misstag till kontrarevolutionära trauman. Vi ser hur klassfiendens psykologiska manipulation skapar falska offer för att splittra folket och undergräva statens auktoritet. Den som inte genast vet att hon blivit våldtagen har inte blivit det. Vi måste rensa ut dessa folkförtryckartroll som förgiftar medvetandena med borgerlig offermentalitet och falsk medlidandepropaganda."}, "date": "7 juli, 14:23", "url": "https://samtiden.nu/2026/07/jakob-sjolander-valdtagna-kvinnor-vet-att-de-valdtagits/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/jakob2-1-640x360.png"}, {"type": "text", "heading": "Zlatan: ”Borde aldrig ha fått ett rött kort”", "summaries": {"normal": "Fifa har valt att skjuta upp Folarin Baloguns avstängning efter ett rött kort i matchen mot Bosnien-Hercegovina, vilket gör honom spelklar till åttondelsfinalen mot Belgien. Beslutet har väckt stark kritik då uppgifter gör gällande att USA:s president Donald Trump påverkat Fifas ordförande Gianni Infantino. Zlatan Ibrahimovic har uttryckt stöd för beslutet och menar att det röda kortet var felaktigt från början. Belgien överväger nu att överklaga Fifas beslut till Idrottens skiljedomstol, Cas.", "trump": "Fifa gjorde äntligen rätt när de lät vår fantastiska stjärna Folarin Balogun spela! De försökte stoppa oss med ett falskt rött kort, en total häxprocess. Jag ringde Gianni Infantino, en mycket trevlig kille, och vi löste det. USA vinner alltid! Zlatan, en fantastisk vinnare, håller med mig. Belgien är sura, men de är bara svaga förlorare. Vi kommer att krossa dem ikväll. Det blir en enorm vinst för USA, den största någonsin!", "stalin": "Fifa, denna korrupta byråkratiska apparat, dansar efter Washingtons pipa. Att en president öppet dikterar sportens villkor avslöjar västvärldens moraliska förruttnelse. Balogun är blott en bricka i imperialisternas spel, likt marionetterna som nu hotar vår säkerhet i öst. Om Belgien dristar sig att söka rättvisa hos en så kallad skiljedomstol, bevisar det bara deras patetiska svaghet. Vi noterar dessa politiska påtryckningar och förstår nu tydligare fiendens natur. Historien kommer att döma dem alla som löjliga, historielösa narrar."}, "date": "6 juli, 17:34", "url": "https://kvartal.se/nyheter/artiklar/zlatan-borde-aldrig-ha-fatt-ett-rott-kort/cG9zdDoxNDIxNjg"}, {"type": "image-full", "heading": "Svenskar på semester varnas – här når värmen farliga nivåer", "summaries": {"normal": "Gran Canaria, ett populärt resmål för svenskar, drabbas av extrem hetta med temperaturer upp till 37 grader. Spanska vädermyndigheten Aemet har utfärdat en orange varning för södra och högre liggande delar av ön, vilket innebär betydande risker. Nätterna väntas inte kylas ner under 26–27 grader. Turister uppmanas att undvika middagssolen, dricka mycket vatten och vara extra försiktiga med barn, äldre och sjuka. Även andra Kanarieöar har värmevarningar.", "trump": "Folket älskar Gran Canaria, det är ett fantastiskt ställe med sol och bad, men nu har de en enorm hetta där, upp till 37 grader, och de har gett en orange varning, den näst värsta. Det är en katastrof, tror mig, värre än någonsin. De andra öarna får också hetta, 34 grader, nätterna är som ugnar. Ni måste vara smarta, drick vatten, håll er borta från solen mitt på dagen, annars blir det problem. Spanien brinner, det är en stor, stor värmesak, ingen har sett maken.", "stalin": "Kamrater, den dekadenta borgarklassen flyr till sina solbadande kolonier på Gran Canaria, men nu straffar naturen deras lättja med en hetta som når 37 grader, en orange varning från de spanska organen. Vi ser hur kapitalisterna svettas i sina lyxhotell medan natten inte ger någon lindring under 27 grader. Vi ska likvidera sådana faror genom strikt disciplin: undvik solen som en trotskistisk agent, drick vatten som lojala partimedlemmar och skydda de svaga från denna värmesabotör. Annars rensar vi ut de som dansar med värmen som borgarbrackor i en ny utrensning mot värmens kontrarevolutionärer."}, "date": "6 juli, 11:58", "url": "https://nyheter24.se/nyheter/utrikes/1496709-svenskar-pa-semester-varnas-har-nar-varmen-farliga-nivaer", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8683ced904b004a30200000000b004a302/2026/07/06/2376029/gran%20canaria.jpg"}, {"type": "image-right", "heading": "Europa måste förstå vad USA vill. Här är innebörden av Nato 3.0", "summaries": {"normal": "Artikeln diskuterar övergången till Nato 3.0 där USA minskar sitt konventionella försvar i Europa för att fokusera på Kina som huvudutmanare. Europa måste bli mer självbärande genom ökad upprustning, bättre samordning och industriell kapacitet. Ankara-toppmötet blir ett test på om Europa förstår USA:s budskap och kan fylla luckorna i luftförsvar, logistik och markstridskrafter. Ryssland ses som särskilt farligt under de närmaste fem åren innan europeisk beredskap är på plats.", "trump": "Europa, vakna upp! Ni har lutat er mot oss i decennier medan vi betalade notan för ert försvar. Nu säger jag nog är nog, vi fokuserar på Kina som fuskar värre än någon annan. Nato 3.0 betyder att ni måste betala era fem procent och sluta gnälla. Ankara-mötet är er chans att visa att ni inte är totala förlorare. Annars blir det inga gratis åk från oss längre. Vi är fortfarande ryggraden, men ni måste bära er del – och gör det snabbt!", "stalin": "Kamrater, i denna dekadenta värld av Nato 3.0 avslöjar de amerikanska imperialisterna sin sanna parasitnatur genom att svika den europeiska fronten mot de fascistiska ryska revisionisterna. Jag, som ledare för det oförlikneliga kollektivet, ser hur borgarbrackorna i Bryssel yrvaket fumlar med sina femårsplaner medan fienden lurar i skuggorna. Vi ska rensa ut alla svaga länkar, likvidera illusionen om amerikansk ryggmärg och bygga en stålhård sovjetisk – ursäkta, europeisk – uthållighet som krossar både kapitalistiska kinesiska leverantörskedjor och putinska sabotage. Den som tvekar är folkets fiende och en objektiv agent för västerländskt förfall. Humoristiskt nog tror de att tid löser allt, medan vi vet att utrensning av lathet är den enda vägen framåt."}, "date": "5 juli, 15:00", "url": "https://www.di.se/debatt/nato-30-europa-maste-forsta-vad-usa-vill/", "imageUrl": "https://static.bonniernews.se/ba/898f64be-2f98-4bc9-8b88-154e7ddb4e7d.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Experter slår larm: Cancerpatienter får återfall efter covid-boosters", "summaries": {"normal": "Brittiske cancerprofessorn Angus Dalgleish och kardiologen Aseem Malhotra varnar för ett möjligt samband mellan covidvacciners boosterdoser och återfall hos cancerpatienter. Dalgleish har observerat att stabila patienter plötsligt försämrats efter vaccinationer, särskilt vid melanom och kolorektalcancer. De hänvisar till forskning om T-cellsutmattning och japanska data som visar ökade cancerfall i takt med boosterkampanjer. Båda läkare kräver öppen utredning av vaccinernas långsiktiga effekter på immunförsvaret, samtidigt som de medger att vacciner hjälpt högriskgrupper under pandemin.", "trump": "Folk, det här är en katastrof. Dessa fantastiska läkare, riktiga genier, berättar att cancerpatienter som var stabila i åratal plötsligt får återfall efter de där boostervaccinerna. Boosters, folks, de är värre än man tror. Jag sa det hela tiden – vaccinen kanske hjälpte några gamla, men nu ser vi vad som händer. Japan visar det klart, cancer ökar med varje dos. Det är en enorm signal som de luriga myndigheterna ignorerar. Vi behöver granska det här ordentligt, inga fler lögner från de så kallade experterna.", "stalin": "Kamrater, jag har länge genomskådat hur de dekadenta borgarbrackorna i läkemedelskartellerna förgiftar folket med sina repetitiva boosters för att underminera arbetarklassens immunförsvar. Dessa kapitalistiska giftinjektioner framkallar T-cellernas förräderi mot kroppen, så att dolda tumörer plötsligt reser sig som kontrarevolutionärer och slår till mot de lojala. Jag kräver omedelbar utrensning av alla som döljer denna sammansvärjning. Vi ska likvidera lögnen och låta sanningen marschera fram som en stålskodd armé. Mörk humor ligger i att tumörerna beter sig som opålitliga trotskister – de väntar bara på rätt dos för att anfalla."}, "date": "5 juli, 12:00", "url": "https://samnytt.se/experter-slar-larm-cancerpatienter-far-aterfall-efter-covid-boosters", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03120239/vaccin-cancer-feat.jpg"}, {"type": "image-right", "heading": "Niklas skadades för livet av hushållsel", "summaries": {"normal": "Niklas Bengtsson, serviceelektriker, fick en livsvarig elskada av 230 volt hushållsström under ett arbete i en villakällare 2014. Han höll i en järnställning och slog med hammaren som genomborrade en strömförande kabel. Efter olyckan drabbades han av domningar, smärtor och minnesproblem. Trots lång kamp med Försäkringskassan och arbetsgivaren Bravida fick han efter över tio år sjukersättning. Han varnar nu unga elektriker för att aldrig arbeta med spänning på.", "trump": "Folk, ni vet inte vad el kan göra. Den här killen Niklas, en riktig tuffing, jobbar ensam i en källare och plötsligt – BAM – får han 230 volt rakt genom kroppen. Hjärtat hoppade nästan ur honom! Han körde bil utan att minnas det, Försäkringskassan behandlade honom som en förlorare i tio år. Patetiskt! Men till slut fick han rätt. Lärdomen är enkel: Slå av strömmen, annars blir ni som Niklas – skadade och utslitna. Elen är farlig, tro mig, jag vet allt om det.", "stalin": "Kamrater, denna olycka visar borgarklassens likgiltighet inför arbetarklassens blod och smärta. Jag ser hur kapitalisterna på Bravida och de byråkratiska parasiterna på Försäkringskassan lät en ärlig arbetare som Niklas förtvina i smärta i över ett decennium medan de slickade sina feta löner. Vi rensar ut sådana sabotageörer som ignorerar elens faror och offrets lidande. Denna 230-voltsfiende, dold i väggar som en trotskistisk parasit, ska bekämpas med full kraft. Arbetarna segrar, men värken fortsätter – typiskt för klassfiendens långsamma gift."}, "date": "5 juli, 08:00", "url": "https://arbetet.se/2026/07/05/niklas-skadades-for-livet-av-hushallsel-kandes-som-att-hjartat-skulle-hoppa-ur-kroppen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24094118/niklas.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Varningen inför Trumps jätteshow: ”Kan innebära hälsorisker”", "summaries": {"normal": "USA planerar att slå världsrekord med över 850 000 fyrverkerier under firandet av självständighetsdagen i Washington. Forskare varnar för allvarliga hälsorisker genom ökade halter av sotpartiklar, tungmetaller och försämrad luftkvalitet, särskilt kring National Mall. Interna dokument visar att myndigheter är medvetna om riskerna, men evenemanget genomförs ändå. Experter pekar även på möjliga negativa effekter på djurliv och vattenmiljö i Potomacfloden. Det nuvarande rekordet från Filippinerna 2016 riskerar att slås.", "trump": "Vi ska ha den största, mest spektakulära fyrverkerishowen någonsin, över 850 000 raketer – nytt världsrekord, folk kommer att älska det! De här så kallade forskarna och byråkraterna gnäller om luftkvalitet och hälsorisker, typiskt för dessa vänsterliberala alarmister som hatar fest och Amerika. De vill att vi ska bära N95-masker på Independence Day? Patetiskt! Det här är 250 år av frihet, inte någon klimathysterisk HBTQ-parad. Njut av showen, det blir enormt!", "stalin": "Kamrater, detta dekadenta fyrverkeriorgie är ett utmärkt exempel på hur den amerikanska borgarklassen förslösar resurser på vulgär underhållning medan arbetarna kvävs av giftiga partiklar. Jag ser de imperialistiska blodsugarna i Washington förbereda sin egen utrensning genom förgiftad luft och förorenade floder. Låt dem fira sin så kallade frihet – det blir ett naturligt experiment som blottar folkfiendernas vårdslöshet. Djuren och folket lider, men kapitalistmaffian bryr sig inte. Statens intresse kräver vaksamhet mot sådana excesser."}, "date": "4 juli, 17:23", "url": "https://www.tv4.se/artikel/53NbUa803a2z73A06MveAe/varningen-infoer-trumps-jaetteshow-kan-innebaera-haelsorisker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2c2h9bJ2gKbqE4ryCNvgkd%2F88378136a93988aae757a3902b652737%2F04-250USA.jpg&width=120"}, {"type": "image-right", "heading": "Kan amerikanerna skapa “en mer perfekt union”?", "summaries": {"normal": "Artikeln diskuterar USA:s 250-årsjubileum den 4 juli som en chans att reflektera över den amerikanska republikens kärna. Den belyser historiska jubileer, grundidéerna frihet och jämlikhet samt spänningen mellan frihet och ofrihet genom slaveriets arv. Polariseringen under Trump accentueras, med hans fokus på ett traditionellt, vitt USA och angrepp på så kallad woke-historieskrivning. Jubileet präglas av debatt om framsteg och reaktioner sedan 1950-talet.", "trump": "Det här jubileet blir fantastiskt, det största någonsin, folk kommer att älska det. De skriver om mig som om jag vore problemet, men det är fake news från den woke-eliten som hatar Amerika. Vi gör landet stort igen, vi firar friheten, de riktiga värdena, inte deras hysteriska rasistanklagelser. Jefferson och Adams skulle vara stolta över mig, inte över de förlorarna som vill riva ner allt. America is back and hotter than ever, tro mig.", "stalin": "Kamrater, detta dekadenta jubileum blottar borgarklassens desperata försök att dölja sin parasitiska historia av slavhandel och förtryck. Jag ser hur den reaktionäre Trump, denna clowneske kapitalist, med sin vulgära fribrottning och falska frihetsretorik försöker likvidera den historiska sanningen. Vi känner igen mönstret: paranoia hos minoriteterna, falska vändpunkter som 2008 och 2016. Inga tidskapslar kan rädda er från utrensningen av lögnerna. Den mer perfekta unionen byggs endast genom kollektiv kamp mot sådana fiender till folket."}, "date": "4 juli, 01:40", "url": "https://www.dagensarena.se/essa/kan-amerikanerna-skapa-en-mer-perfekt-union/", "imageUrl": "https://www.dagensarena.se/files/2026/06/kopia-av-nyhet-dagens-arena-15.jpg"}, {"type": "text", "heading": "Stockholmsbörsen på rekordnivå efter bred uppgång", "summaries": {"normal": "Stockholmsbörsen nådde nytt rekord med OMXS30 upp 1,14% till 3 247,03, driven av verkstadssektorn (+1,9%). Sandvik steg 4,4% efter en stor order från Mexiko, medan Evolution föll 2,3%. Flera bolag rapporterade kvartalsresultat, som Atrium Ljungberg (+1,7%) och Platzer (+6,7%). Mips rusade 15% efter en patentförlikning. Analytiker justerade rekommendationer för flera aktier, exempelvis Afry (+6,1%) och Skanska efter nya order i USA och Norge.", "trump": "Stockholmsbörsen? Fantastiskt! Nytt rekord, kan ni tro det? OMXS30 upp över 1% – jag säger alltid, när jag gör något blir det stort, men här är det Sverige som gör det stort! Sandvik, 4,4% upp – de fick en jätteorder från Mexiko, mycket bra folk, Mexiko. Men Evolution? 2,3% ner, så tråkigt, kanske borde de fråga mig om råd. Och Mips, 15% upp efter en förlikning – smart, mycket smart. Jag älskar vinnare! Wall Street stängt? Svaga, de behöver jobba hårdare. Sverige, keep it up!", "stalin": "Stockholmsbörsen dansar efter våra pipor – nytt rekord för kapitalistiska spekulanter! OMXS30 stiger medan imperialistiska hälsovårdsaktier kryper som skadade hundar. Sandvik, detta verktyg för gruvkapitalet, får en ynklig order från Mexiko – ett land vi snart befriar från USA:s klor. Mips, dessa patenttjuvar, tvingas betala för sina brott – rättvisan segrar! Fastighetsbolag rapporterar siffror som om de vore viktiga – vi vet att sanningen ligger i produktionsmedlen. Analytiker byter åsikter som förrädare byter sida. USA:s börs stängd? Bra. Deras system är lika dött som Wall Streets handelsvolymer under helgen. Framåt, kamrater – kapitalismen gräver sin egen grav!"}, "date": "3 juli, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-pa-rekordniva-efter-bred-uppgang"}, {"type": "image-right", "heading": "Gaza uppmärksammar 1000 dagar av folkmord: ”Eskalera motståndet”", "summaries": {"normal": "Palestinska motståndsgrupper har uppmärksammat att det gått 1 000 dagar sedan kriget i Gaza inleddes. I ett gemensamt uttalande slår de fast rätten till motstånd, avvisar utländsk förvaltning av Gazaremsan och kräver eskalering på ockuperade områden. Israel har dödat över 1 000 palestinier sedan eldupphöret i oktober 2025. Den humanitära situationen är fortsatt katastrofal och stora delar av Gaza är förstörda eller ockuperade.", "trump": "Tusen dagar av det här vansinnet, och vad händer? De kallar det folkmord, men titta på siffrorna – Israel fortsätter att göra jobbet medan Biden satt och sov. Jag hade fixat det på en vecka, tro mig. Nu är det jag som är president igen, och de här terroristerna vägrar ge upp. Eskalera motståndet? De borde eskalera lite sunt förnuft istället för att leva på offerkortet. Patetiskt!", "stalin": "Kamrater, tusen dagar har förflutit sedan imperialisternas sionistiska aggression inleddes. Jag ser folkfiendernas blodiga hand, stödd av västliga blodsugare som försöker kväva det palestinska motståndet. Vi fördömer detta utländska förmyndarskap och beordrar utrensning av alla kapitulantiska element. Motståndet skall eskaleras med järnhand. Den som tvekar är en folkförtryckartroll i maskopi med klassfienden. Segraren skriver historien."}, "date": "3 juli, 11:48", "url": "https://proletaren.se/artikel/gaza-uppmarksammar-1000-dagar-av-folkmord-eskalera-motstandet/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/1c92ba     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
