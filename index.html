ossade alla siffror – omsättningen upp 106 procent, bättre än någonsin. Mina politiker och jag, vi gör USA till AI-världens kung. Aktien steg 5 procent i efterhandeln, enormt! Kina? Inga intäkter därifrån, smart, vi vinner ändå!", "stalin": "Kamrater, Nvidia visar klassisk kapitalistisk svaghet: vinsterna skyhöga, men bruttomarginalen hotas av minnespriser – en fiende vi måste rensa ut. Jag beordrar att alla datacenter nationaliseras för folkets bästa. Aktien steg? Bra, men misstänkta spekulanter ska kartläggas."}, "date": "27 augusti, 07:13", "url": "https://www.affarsvarlden.se/artikel/nvidia-krossar-forvantningarna-upp-nara-5-i-efterhandeln"}, {"type": "text", "heading": "Boliden köper del av zinkproducent för 12 miljarder", "summaries": {"normal": "Boliden kastar 12 miljarder på Nexa Resources och blir ägare till en stor del av zink- och silverproducenten. Affären, som finansieras med lån och nya aktier, väntas öka vinsten per aktie med 8 procent. Slutförande planeras till 2027, förutsatt att myndigheter och aktieägare inte har något att invända.", "trump": "Jag har gjort enorma affärer, men Boliden köper en zinkgruva för 12 miljarder – det är fantastiskt, tro mig! De använder aktier och lån, och jag gillar det. De kommer att tjäna massor med pengar, mycket mer än 8 procent. Zink är viktigt, som allt jag bygger. Stort!", "stalin": "Kamrater, Boliden förvärvar fiendens zinktillgångar för en summa som skulle mata våra arbetare i åratal. Vi noterar att de använder aktier, en borgerlig list. Men vi ser allt. Vi övervakar. Vinsterna ska utrenas och omfördelas till partiet. Inga kapitalistiska planer undgår oss."}, "date": "27 augusti, 07:11", "url": "https://www.affarsvarlden.se/artikel/boliden-koper-del-av-zinkproducent-for-12-miljarder"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-full", "heading": "Demoskop: SD kan backa för första gången", "summaries": {"normal": "Enligt SvD/Demoskops väljarbarometer tappar Sverigedemokraterna stöd för första gången på över ett år, ner till 18,3%. Oppositionen (S, V, MP, C) leder med 51,7% mot Tidöpartiernas 46,0%. Moderaterna ökar marginellt, medan KD når sitt högsta stöd på sju år. Liberalerna riskerar att hamna under spärren.", "trump": "Jag säger er, Sverige har ett stort problem – deras största parti, SD, backar som en rädd ekorre! 18,3% är patetiskt, och oppositionen leder med 5,7%. Moderaterna, som är lite smartare, ökar lite. Men Liberalerna? Fullständigt katastrof, 2% är skrattretande. Sverige borde ta en titt på USA – vi vet hur man vinner!", "stalin": "Vi ser med tillfredsställelse hur de reaktionära krafterna i Sverige, dessa fascistiska SD-sympatisörer, förlorar mark som en retreating Wehrmacht. Oppositionen, dessa lojala progressiva kamrater, håller ett fast grepp om 51,7%. Liberalerna? Svaga som en upptinad snögubbe. Vi noterar KD:s framsteg – men var försiktiga, kamrater, fienden lurar alltid bakom hörnet."}, "date": "27 augusti, 06:37", "url": "https://kvartal.se/nyheter/artiklar/demoskop-sd-kan-backa-for-forsta-gangen/cG9zdDoxNzU2NDA", "imageUrl": "https://images.kvartal.se/2026/08/f18cd19a-bbb.webp"}, {"type": "image-right", "heading": "Så bygger vi ett Sverige där fler får chansen", "summaries": {"normal": "Sverige har misslyckats med integrationen i decennier. Författaren föreslår snabb validering av invandrade akademikers utbildning, kraftfull språkinlärning via blandade arbetsplatser och yrkesutbildning som förstahandsval. Han vill skilja på utbildade och outbildade nyanlända, införa aktivitetskrav samt bättre matchning mellan jobb och kompetens för att stärka välfärden.", "trump": "Folk, Sverige har totalt misslyckats med integrationen, det är en katastrof! De har doktorer som vaktar parkeringsplatser – patetiskt! Vi behöver smarta regler, validera kompetens direkt, tvinga fram språket och se till att folk jobbar istället för att suga på systemet. Gör Sverige stort igen, annars är det game over.", "stalin": "Kamrater, jag ser hur den svenska borgerliga staten under decennier låtit reaktionära krafter sabotera integrationen och förslösa kvalificerad arbetskraft. Vi kräver omedelbar validering av proletär och intellektuell kompetens, språk som vapen mot isolering samt utrensning av frivillighetens falska illusioner. Den som vägrar arbeta likviderar sig själv ur kollektivets framtid. Härligt!"}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/sa-bygger-vi-ett-sverige-dar-fler-far-chansen", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-93-300x157.jpg"}, {"type": "image-right", "heading": "När experten blir lobbyist", "summaries": {"normal": "Artikeln granskar hur akademiska experter som professorer och docenter ofta medverkar i medier och alternativmedia, ibland som lobbyister. Medierna gynnas av deras trovärdighet medan experterna får status, anslag och karriärmöjligheter. Forskaren Anna Tyllström varnar för virala lekmannaexperter och noterar att akademin alltmer anpassar sig efter mediebehovet.", "trump": "De så kallade experterna är riggade! Professorer som dyker upp överallt och låtsas vara neutrala – det är en enda stor bluff. De älskar att synas i media för att få pengar och status, precis som de korrupta eliten. Fake news-experter som egentligen är lobbyister. Patetiskt! Vi behöver riktiga människor som talar sanning, inte dessa rigged akademiker.", "stalin": "Vi ser hur den borgerliga akademin gömmer sig bakom vetenskaplig retorik medan de i själva verket är lobbyister och kapitalisternas nyttiga idioter. Dessa självutnämnda experter söker status och anslag genom att dansa efter mediernas pipa. Underbart roligt att de tror sig dölja sin parasitiska natur. Kamrater, vi genomskådar alla dessa dekadenta borgarbrackor som förgiftar folkets medvetande."}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/nar-experten-blir-lobbyist", "imageUrl": "https://www.dagensarena.se/files/2026/08/expertlaget-ny-300x157.jpeg"}, {"type": "text", "heading": "Missa inte talangerna som fått F", "summaries": {"normal": "Artikeln kritiserar att svenska skolan nedprioriterar praktiska yrkesutbildningar som hantverk och byggande till förmån för teoretiska program. Detta leder till att tusentals praktiskt begåvade elever får sämre chanser på arbetsmarknaden och att värdefull kompetens för ett cirkulärt samhälle går förlorad. Författaren efterlyser omedelbara insatser för att ge dessa ungdomar en chans.", "trump": "Folk, vi har det värsta skolsystemet någonsin. De hatar riktiga killar som kan bygga, snickra och fixa saker. Allt handlar om teori och eländiga papper. I mitt Amerika älskar vi hantverkare, de är vinnare! Sverige förlorar sina bästa talanger för att de älskar att ge alla F-betyg. Patetiskt!", "stalin": "Kamrater, denna degenererade borgerliga skola är en fiende till folket. Den likviderar systematiskt arbetarklassens praktiska geni genom att upphöja dekadent teori framför äkta produktivt arbete. Vi skall omedelbart rensa ut dessa sabotörer av kollektivets färdigheter. De tiotusentals med F-stämpel skall mobiliseras till nyttigt arbete för staten. Inga talanger får slösas bort."}, "date": "27 augusti, 01:19", "url": "https://www.dagensarena.se/opinion/missa-inte-talangerna-som-fatt-f"}, {"type": "image-right", "heading": "Fruktlös jakt på arbete", "summaries": {"normal": "Artikeln kritiserar hur AI-drivet ökad produktivitet leder till uteblivna nyanställningar och ihållande hög arbetslöshet kring 7 procent trots högkonjunktur. Författaren ifrågasätter hur vinster ska fördelas och oroar sig för att många riskerar att bli förlorare utan stöd från politik och arbetsmarknadspolitik. Socialdemokraterna och Centerpartiet får kritik för bristande svar.", "trump": "De här förlorarna i Sverige gnäller om AI medan jag byggde den starkaste ekonomi någonsin. Hög arbetslöshet? Det är deras korkade politik som dödar jobb, inte smarta maskiner. Magdalena och Centerpartiets clowner har ingen aning. Vinster ska gå till vinnarna, inte till lata socialister. Amerika gör det rätt – Sverige borde lära sig innan de kollapsar totalt.", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska gnällspikar som ylar om AI-kris medan de låter borgarbrackorna suga musten ur arbetarklassen. Vi ska rensa ut de parasitiska företagsägarna och deras lakejer i Socialdemokraterna och Centern. Endast genom kollektivets järnhand kan vi omfördela AI-vinsterna och likvidera arbetslöshetens fiender. Svaghet är kontrarevolutionärt."}, "date": "27 augusti, 01:05", "url": "https://www.dagensarena.se/opinion/fruktlos-jakt-pa-arbete", "imageUrl": "https://www.dagensarena.se/files/2026/08/ai-krisen.jpeg"}, {"type": "image-full", "heading": "C-ledarens drömregering: ”Idag låter det omöjligt”", "summaries": {"normal": "Centerledaren Elisabeth Thand Ringqvist föreslår en regering med S, KD och eventuellt MP efter valet, men medger att det verkar osannolikt nu. Hon tror ett mittenalternativ kan uppstå om Tidö-samarbetet misslyckas. Stora politiska motsättningar kvarstår, som a-kassa och bankskatt, men hon är öppen för diskussion om karensavdrag under vissa villkor.", "trump": "Jag säger er, denna svenska Centerledare har en dröm – en galen dröm! Hon vill ha en regering med socialisterna, kristdemokraterna och kanske några gröna extremister. Helt omöjligt, folks! Ebba Busch säger nej, MP säger nej, och ändå tror hon på det. Sverige behöver ordning, inte sådana här tokiga idéer. Men visst, låt dem krascha och brinna – det blir underhållning!", "stalin": "Denna så kallade 'Centerledare' fantiserar om en omöjlig koalition, som en svag och förvirrad fiende som leker med tanken på allianser. Vi ser hur borgerliga krafter splittras och förrädare inom egna led drömmer om makt utan grund. Låt dem krascha sina regeringsförsök – det är bara en fråga om tid innan folket inser att endast järnhand och enhetlig ledning kan skapa ordning. Sverige är en bricka i det stora spelet, och vi väntar tålmodigt på deras kollaps."}, "date": "27 augusti, 05:51", "url": "https://kvartal.se/nyheter/artiklar/c-ledarens-dromregering-idag-later-det-omojligt/cG9zdDoxNzU1OTU", "imageUrl": "https://images.kvartal.se/2026/08/98655ea8-etr.webp"}, {"type": "image-right", "heading": "C-topp åtalas efter rattfylleriolycka - krockade med A-traktor", "summaries": {"normal": "Centerpartistiske regionpolitikern Thomas Andersson åtalas för grovt rattfylleri efter att ha krockat med en A-traktor på Vallsundsbron. Han lämnar samtliga politiska uppdrag och drar tillbaka sin kandidatur. Partiet är tydligt: sådant beteende är inte förenligt med förtroendeuppdrag. En olycklig historia med alkohol inblandad.", "trump": "Jag ser en centerpartist som kör full och krockar med en liten EPA-traktor – helt galet! Han lämnar alla uppdrag, precis som en loser. Centerpartiet borde rensa ut sådana. Jag, presidenten, skulle aldrig göra så – jag kör bara golfbil. Mycket dåligt omdöme, mycket dåligt!", "stalin": "Kamrater, en regionpolitiker har avslöjats som en berusad sabotör. Han krockade med en A-traktor – en kontrarevolutionär handling. Han har lämnat sina uppdrag, men vi måste rensa ut alla sådana element. Partiet måste stärka kontrollen. Ingen nåd för fyllon som hotar vår framgång."}, "date": "27 augusti, 11:00", "url": "https://samnytt.se/c-topp-atalas-efter-rattfylleriolycka-krockade-med-a-traktor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27085030/thomas-andersson-c-rattfull-feat.jpg"}, {"type": "image-right", "heading": "L behövs – för sin sakpolitik. Bakom alla konflikter har partiet fortsatt att tuffa på", "summaries": {"normal": "Liberalerna riskerar att åka ur riksdagen på grund av interna strider kring identitet och relationen till Sverigedemokraterna. Trots detta har partiet en stabil och genomtänkt sakpolitik med fokus på internationellt samarbete, starkt försvar, kravbaserad integration, bra skola och frihandel. Engagemanget bland medlemmarna är stort.", "trump": "Folkpartiet, eller vad de nu kallar sig, håller på att krascha ur riksdagen och det är underbart att se. De har ägnat år åt att bråka om vem de är istället för att vinna. Patetiskt! Men de har åtminstone bra idéer om försvar, skolan och att inte låta galningarna styra. De borde ha lyssnat på mig mycket tidigare.", "stalin": "Jag betraktar med högsta tillfredsställelse hur dessa liberala borgarbrackor nu riskerar att utrensas från sin egen riksdag efter år av ynklig identitetskris och kapitulation inför reaktionära krafter. Deras så kallade sakpolitik är ändå ett fint exempel på hur borgarklassen försöker maskera sin svaghet med tomma fraser om frihandel och Nato. Kamrater, låt dem falla."}, "date": "27 augusti, 11:08", "url": "https://www.di.se/ledare/liberalerna-behovs-for-sin-sakpolitik", "imageUrl": "https://static.bonniernews.se/ba/2c239539-bde8-4294-939c-dbf8b0c880ca.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "M: Så vill vi förenkla livet för utlandssvenskar", "summaries": {"normal": "Moderaterna föreslår en tydlig definition av ”stadigvarande vistelse” i inkomstskattelagen: fler än 160 dagar per år, eller fler än 120 dagar två år i rad. Förslaget träder i kraft 2027 och syftar till att förenkla skattereglerna för utlandssvenskar. Partiet sänker även SINK-skatten från 25 till 20 procent i två steg för att minska dubbelbeskattning.", "trump": "Folk, ni vet att jag älskar svenskarna, de jobbar hårt precis som amerikanerna. De här Moderaterna gör det rätta – sänker skatterna för er som bor utomlands så ni slipper bli lurade av systemet. Inga fler galna regler som straffar pensionärer som vill njuta av solen. Fantastiskt! Sverige borde vara stort igen, precis som vi gör i USA.", "stalin": "Kamrater, jag har sett denna borgerliga proposition. Vi ska likvidera den otydliga definitionen av stadigvarande vistelse och införa en vetenskaplig gräns på 160 dagar. De västerländska kapitalisterna som tidigare höjde SINK-skatten är naturligtvis fiender till folket. Nu rensar vi ut deras paranoia mot utlandssvenskar. Allt för arbetarklassens seger, även de som solar sig i folkrepublikens namn."}, "date": "27 augusti, 10:59", "url": "https://www.di.se/debatt/m-sa-vill-vi-forenkla-livet-for-utlandssvenskar", "imageUrl": "https://static.bonniernews.se/ba/e09cbd46-c720-47bd-a39d-bb763224fd2c.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SD och regeringen förhalade gemensam valsedel – nu försvinner småpartiernas sedlar igen", "summaries": {"normal": "SD och regeringen förhalar införandet av en gemensam valsedel trots upprepad kritik från Valmyndigheten och OSSE. Småpartiers valsedlar försvinner regelbundet från vallokaler, vilket kritiseras som odemokratiskt. OSSE har dömt ut systemet som orättvist. Trots förslag om en neutral enhetsvalsedel skjuts utredningen upp till 2027, vilket innebär att valet 2026 genomförs med det gamla systemet.", "trump": "Det här svenska valsystemet är en total skandal, en riggad cirkus som gynnar de stora partierna och straffar de små. De gömmer valsedlar, de förhalar, de ljuger – precis som de förlorande demokraterna hemma. En gemensam valsedel vore smart, billigt och rättvist, men de privilegierade riksdagspolitikerna vill behålla sin lilla klubb. Patetiskt!", "stalin": "Vi ser hur den borgerliga parlamentariska kommittén medvetet förhalar den nödvändiga utrensningen av detta kontrarevolutionära valsedelssystem. Småpartiernas sedlar försvinner som klassfiender i natten. Jag ler mörkt åt deras paranoia att behålla privilegierna. En enhetsvalsedel vore ett steg mot sann folkdemokrati, men de kapitalistiska resterna klamrar sig fast vid sitt kaos. Underbart förnyelsearbete återstår."}, "date": "27 augusti, 10:58", "url": "https://www.friatider.se/sd-och-regeringen-forhalade-gemensam-valsedel-nu-forsvinner-smapartiernas-sedlar-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/utkast-forlsag-nya-valsedlar_0_0.jpg"}, {"type": "image-right", "heading": "\"Inte hela världen\" – attityden när Malmölistan och Örebropartiets valsedlar saknas", "summaries": {"normal": "Trots att valsedlar för Malmölistan och Örebropartiet saknades i flera vallokaler i Malmö tog valförrättarna lätt på kritiken. Partiledaren Nils Littorin dokumenterade bristen och uppmanade väljare att skriva partinamnet på blanka sedlar. Flera väljare vittnar om att problemet återkommer vid varje val och misstänker att det inte är slump.", "trump": "De riggar valet igen, folk! I Malmö försvinner valsedlarna för de små partierna medan de stora får allt. Valförrättarna säger att det inte är hela världen? Patetiskt! Det är fusk, ren fusk. Skriv på blanka sedlar, säg de, men vi vet vad som pågår. Sverige behöver stora, starka ledare som inte tolererar sådant här.", "stalin": "Kamrater, dessa sabotage mot folkets vilja avslöjar borgarbrackornas maskineri. Jag ser hur de medvetet låter valsedlarna för sanna folkliga röster försvinna, precis som de alltid gjort. Vi ska rensa ut dessa inkompetenta eller illvilliga element. Det är inte slump, det är klassfiendens paranoia i handling. Fortsätt rapportera, vi likviderar systemet."}, "date": "27 augusti, 10:54", "url": "https://www.friatider.se/inte-hela-varlden-attityden-nar-malmolistan-och-orebropartiets-valsedlar-saknas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/inte_3.jpg?itok=xqmpOH89"}, {"type": "image-right", "heading": "Trump-sändebudet: Skicka Ukrainas kvinnor till kriget", "summaries": {"normal": "Keith Kellogg, tidigare USA-sändebud till Ukraina under Trump, föreslår att ukrainska kvinnor ska mobiliseras till armén eftersom männen sinar. Han menar att kvinnor strider lika bra som män och att det stärker deras samhällstillhörighet. Ukrainska parlamentet slår fast att obligatorisk mobilisering av kvinnor varken förbereds eller övervägs. Tidigare försvarsministern har dock föreslagit frivillig tjänstgöring bortom fronten.", "trump": "De där idiaterna i Kiev håller på att ta slut på männen, precis som jag förutspådde. Nu vill min eminente Kellogg skicka in kvinnorna också – smart drag! De strider bra, mina egna damer har ju tjänstgjort med bravur. Ukraina borde lyssna på oss istället för att fortsätta detta vansinniga krig som jag skulle ha avslutat på 24 timmar.", "stalin": "Det dekadenta Kiev-regimen har redan offrat sina män på imperialismens altare. Nu står de inför den logiska följden: att kasta även kvinnorna i köttkvarnen. Vi betraktar detta med mörk tillfredsställelse – låt borgarbrackornas egna döttrar få känna på den heroism vi en gång tvingade fram. Deras paranoia driver dem rakt in i den historiska utrensning de själva förtjänar."}, "date": "27 augusti, 10:44", "url": "https://www.friatider.se/trump-sandebudet-skicka-ukrainas-kvinnor-till-kriget", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-762.jpg?itok=Egnmvvo1"}, {"type": "image-right", "heading": "Influencern Eleonore: ”Erbjöds 150 000 för att göra reklam för S”", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att Socialdemokraterna erbjöd henne 150 000 kronor för ett enda Instagraminlägg om varför man borde rösta på dem. Hon tackade nej av moraliska skäl och kallar det ”shady”. S tillbakavisar uppgifterna och säger att de aldrig betalar för sådant.", "trump": "Jag hörde att någon fick 150 000 kronor för att göra reklam för Socialisterna på Instagram. Det är mycket pengar! Jag skulle aldrig betala så mycket – jag får folk att rösta på mig gratis, med kraften av att göra Sverige stort igen. Sossarna är fejk, som vanligt!", "stalin": "Kamrater, en så kallad influencer påstår att partiet erbjöd henne 150 000 för ett inlägg. Hon tackade nej – ett uppenbart sabotage från en borgerlig agent. Vi rensar ut sådana avvikelser som hotar enigheten. Partiet betalar aldrig för agitation; vi kräver den av alla lojala medborgare."}, "date": "27 augusti, 10:12", "url": "https://samnytt.se/influencern-eleonore-erbjods-150-000-for-att-gora-reklam-for-s", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27075634/stokholm-preview.png"}, {"type": "image-right", "heading": "Kris i äldreomsorgen – så lite plats får frågan i valet", "summaries": {"normal": "Äldreomsorgen är knappt nämnd i valrörelsen trots att personalen kämpar med hög sjukfrånvaro, personalbrist, låga löner och usla scheman. I Trollhättan vittnar undersköterskor om stress, dåligt samvete och att de inte hinner lyssna på de äldre. Väljarna rankar frågan högt, men partierna tiger mest.", "trump": "Folk, det är en katastrof! Era så kallade ledare pratar i timmar i Almedalen och nämner äldreomsorgen i exakt två och en halv minut. Patetiskt! De pressar personalen som citroner, de älskar jobbet men hatar systemet. Vi behöver fler människor, högre löner och stoppa det vansinniga minutstyrandet. Make care great again!", "stalin": "Kamrater, detta är resultatet av borgerlig förfall och revisionistisk vårdpolitik. Jag ser hur arbetarna i Trollhättan likvideras av stress och överarbete medan partiledarna ägnar en procent av talartiden åt folket. Vi måste rensa ut de kapitalistiska minutstyrarna, införa sovjetisk disciplin och säkerställa att ingen citron pressas längre. Statens fiender inom vården ska exponeras."}, "date": "27 augusti, 10:08", "url": "https://arbetet.se/2026/08/27/jattekris-i-aldreomsorgen-sa-lite-plats-far-fragan-i-valet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26151951/XUfc37bOwIw-KA_0156.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Två partiledare valde bort äldreomsorgen helt i sina viktiga tal", "summaries": {"normal": "De åtta riksdagspartiernas ledare talade sammanlagt över fyra timmar i Almedalen i somras. Äldreomsorgen berördes bara i drygt två och en halv minut, cirka en procent av talartiden. Ulf Kristersson och Elisabeth Thand Ringqvist nämnde ämnet inte alls medan Magdalena Andersson talade längst om det, i runt 60 sekunder.", "trump": "Kan ni fatta det? Fyra timmar pratade de här svenska förlorarna i Almedalen och äldreomsorgen fick bara två och en halv minut. Patetiskt! Jag skulle ha fixat det på nolltid, tro mig. De bryr sig inte om sina gamla, det är en total skandal. Sverige behöver en riktig ledare, inte dessa nollor.", "stalin": "Vi ser med förakt hur dessa borgerliga och socialdemokratiska avfällingar i sina tal knappt ägnade en procent av tiden åt arbetarklassens åldringar. Jag skulle ha låtit utrensa sådana vårdslösa element omedelbart. Deras likgiltighet är ett fiasko som skrattar i folkets ansikte. Kamrater, detta visar behovet av ständig vaksamhet mot klassfiendens förfall."}, "date": "27 augusti, 10:08", "url": "https://arbetet.se/2026/08/27/tva-partiledare-valde-bort-aldreomsorgen-helt-i-sina-viktiga-tal", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27095720/almedalen.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Många rödgröna väljare negativa till V i regering", "summaries": {"normal": "Enligt en Verian-undersökning för SVT är 27 procent av rödgröna väljare negativa till Vänsterpartiet i regering, medan 78 procent av C-väljarna är skeptiska. Bland M-väljarna är 19 procent negativa till SD i Rosenbad trots Kristerssons löfte. Nästan hälften av rödgröna väljare är positiva till V i regering.", "trump": "Folk älskar mig, men titta på de här rödgröna förlorarna! 27 procent hatar Vänsterpartiet i sin egen regering, och till och med en femtedel av Moderaternas väljare vill inte ha SD i Rosenbad. Patetiskt! De vet inte vad de vill, men jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamraterna har rätt att vara misstänksamma mot dessa dekadenta revisionister i Vänsterpartiet. 27 procent av de så kallade rödgröna ser faran, medan borgarbrackorna inom Centerpartiet med 78 procents paranoia visar sin sanna kontrarevolutionära natur. Vi ska rensa ut alla som sviktar inför folkets vilja – med ett leende."}, "date": "27 augusti, 05:51", "url": "https://www.svt.se/nyheter/inrikes/manga-rodgrona-valjare-negativa-till-v-i-regering", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.43/e60d35d020b215a7e71ab5702fc976560980abec63db13bd4693a52f760254ea"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Vänsterkampanjen mot Palantir är bisarr", "summaries": {"normal": "Artikeln kritiserar vänsterpartiers kampanj mot Palantir, som levererar teknik till Ukraina och svensk Försvarsmakt. Författaren varnar för att bryta med bolag baserat på ägares åsikter skapar ett totalitärt klimat. Palantir bidrar till Ukrainas högteknologiska försvar mot Ryssland och används även av Nato och polisen.", "trump": "De här vänstervridena i Sverige är totala misslyckanden. De vill sparka ut Palantir, det fantastiska techbolaget som hjälper Ukraina krossa Ryssland. Utan dem ingen säkerhet. Men de hatar Peter Thiel för att han inte är woke. Patetiskt. Vi behöver starka, smarta bolag, inte dessa svaga toleransdiktatorer som förstör allt.", "stalin": "Vi, partiet och arbetarna, genomskådar dessa dekadenta borgarbrackor och deras hysteriska kampanj mot Palantir. Deras så kallade transparens är blott en paranoid mask för att rensa ut alla som inte böjer sig för västvärldens nihilistiska dekadens. Ukrainas fientliga motstånd mot den ryska intressesfärens nödvändiga försvarsåtgärder är dömt att krossas under historiens järnhårda logik. Härligt."}, "date": "27 augusti, 10:02", "url": "https://www.di.se/ledare/vansterkampanjen-mot-palantir-ar-bisarr", "imageUrl": "https://static.bonniernews.se/ba/7780cc00-b12b-4ef2-bcec-8bc5f94f3288.jpeg?crop=5616%2C2808%2Cx0%2Cy468&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Därför misslyckas Big Four-avhopparna med att utmana jättarna", "summaries": {"normal": "Många partners lämnar de stora konsultfirmorna för att starta nischbyråer, men få lyckas utmana jättarna. Enligt Olly Purnell saknar många avhoppare den nödvändiga drivkraften. Samtidigt förändras marknaden av AI som ersätter stora systemprojekt. I Sverige går trenden däremot mot fler partners hos de stora byråerna, drivet av behovet av specialiserad kompetens.", "trump": "Många misslyckade konsulter lämnar Big Four, men de har ingen 'eld i magen'. Jag känner folk, fantastiska vinnare, som bygger imperier. De här personerna? De har för mycket pengar och ingen hunger. AI kommer döda de stora, tråkiga projekten. Sverige försöker växa, men det är en röra. Vi behöver riktiga vinnare, inte fega avhoppare som saknar visioner!", "stalin": "Dessa förrädiska 'konsulter' flyr sina mästare för att bygga egna små bon, men utan disciplin blir de bara damm under vår stövel. Liksom västvärldens dekadenta ekonomier ruttnar även deras struktur inifrån. Vi, staten, ser genom deras lögner. AI är blott ett nytt redskap för våra fiender, men sanningen är att endast den absoluta underkastelsen under den starka ledaren garanterar stabilitet."}, "date": "27 augusti, 10:50", "url": "https://www.realtid.se/bors-finans/darfor-misslyckas-big-four-avhopparna-med-att-utmana-jattarna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bigfour.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Butik som spelar musik väcker grannars vrede", "summaries": {"normal": "En klädbutik i Helsingborg spelar jazz utanför entrén för att locka kunder. Grannen tröttnade, klippte högtalarkabeln och dömdes för skadegörelse. Nu anmäls musiken till miljöförvaltningen, som ska avgöra om jazzen är en olägenhet. Butiksägaren suckar: \"Leva stadskärna, sa ni?\".", "trump": "Jag hör om en butik som spelar jazz – jag älskar jazz, den bästa musiken! Men en granne klipper sladden? Patetiskt! De borde bygga en mur för ljudet, eller bara spela min kampanjlåt. Det här är en katastrof för Helsingborg, tro mig. Stäm honom!", "stalin": "Kamrater, en butik sprider 'jazz' – dekadent västmusik – som får en grann-revisionist att klippa en kabel. Vi måste rensa ut dessa ljudliga sabotörer. Femårsplanen för stadskärnor kräver total ljuddisciplin. Inga riktvärden, bara lydnad. Den klagande ska omskolas i en fabrik – utan högtalare."}, "date": "27 augusti, 09:00", "url": "https://samnytt.se/butik-som-spelar-musik-vacker-grannars-vrede"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Pentagon: Så många amerikaner har dött och skadats i kriget", "summaries": {"normal": "Pentagon har redovisat 18 dödade och 776 skadade amerikaner i kriget mot Iran sedan 28 februari. Ytterligare 60 skadade har nu tillkommit, men myndigheten anklagas för att medvetet fördröja siffrorna för att dämpa uppmärksamheten. Över 90 procent av de senaste förlusterna är armésoldater. Samtidigt upphandlar militären tjänster för hantering av döda och skadade.", "trump": "Folk, det här är en total katastrof. Mina fiender i Pentagon leker bokföringstrick med våra tappra soldater. 776 skadade, och de gömmer siffrorna tills pressen lagt sig. Patetiskt! Under min ledning hade vi aldrig sett en sådan röra. Iran skrattar åt dem. Vi behöver starka ledare, inte dessa förlorare som inte kan räkna rätt.", "stalin": "Kamrater, dessa dekadenta västliga imperialister döljer sina blodiga förluster bakom byråkratiska trick och lögnaktig statistik. Medan de fega borgarbrackorna i Pentagon förhalar siffrorna och köper likkistor i hemlighet ler jag mörkt. Deras armé ruttnar inifrån, precis som deras falska demokrati. Snart rensar historien ut dem alla."}, "date": "27 augusti, 09:28", "url": "https://www.friatider.se/pentagon-sa-manga-amerikaner-har-dott-och-skadats-i-kriget", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-760.jpg?itok=pYkw0yd6"}, {"type": "image-full", "heading": "Mardrömssiffror för L – här är senaste mätningen inför valet", "summaries": {"normal": "Med drygt två veckor kvar till valet visar Demoskop/Aftonbladets undersökning att Liberalerna når nytt bottenrekord på 2 procent, under riksdagsspärren. Kristdemokraterna stiger till 8,5 procent medan Sverigedemokraterna backar. Centerpartiet fortsätter uppåt. Oppositionen skulle få 51,7 procent mot regeringssidans 46 procent om det vore val idag.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Liberalerna är en total katastrof på bara 2 procent, patetiskt. KD vinner stort, SD rasar som en dålig affär. Oppositionen leder med 51,7 mot 46. Sverige behöver en riktig dealmaker, inte dessa svaga nollor som inte ens når spärren. Sad!", "stalin": "Kamrater, dessa borgerliga resterna Liberalerna sjunker till ynka 2 procent, en triumf för folkets vilja. Vi ser hur de dekadenta Moderaterna förlorar till våra potentiella allierade i KD som når 8,5 procent. SD backar som fega kapitalistlakejer. Oppositionen leder med 51,7 procent. Inga utrensningar behövs ännu, men vi håller ögonen på sabotörerna."}, "date": "27 augusti, 10:36", "url": "https://nyheter24.se/nyheter/politik/1508014-mardromssiffror-for-l-har-ar-senaste-matningen-infor-valet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/856cf07a04b004a30200000000b004a302/2026/08/27/2387108/val-2026.jpg"}, {"type": "image-full", "heading": "Svensk saknad efter katastrofen i Nepal", "summaries": {"normal": "Ett stort lerskred i Himalaya har lett till minst 160 döda och över 1 000 saknade, varav många turister. En svensk medborgare saknas. Katastrofen drabbade både Nepal och Tibet där räddningsarbetare letar bland lera och bråte. Hundratals utländska turister från bland annat Indien, USA och Europa befann sig i området.", "trump": "Folk sprang som galningar när hela bergen kom rasande i Himalaya. Tusen saknade, en svensk också, och bara några få hittade vid liv. Det är en katastrof, en riktig katastrof. De borde ha sett det komma, men det gör de aldrig. Vi har de bästa räddningsinsatserna, men det här ser inte bra ut, tro mig.", "stalin": "Kamrater, naturens fiender har åter slagit till med ett förrädiskt lerskred mot det arbetande folket i Himalaya. Över tusen saknade, bland dem västerländska turister som springer som ynkliga råttor undan kollektivets öde. Jag ler mörkt åt borgarbrackornas panik medan vi organiserar räddningsoperationen med järnhand. En svensk? Intressant."}, "date": "27 augusti, 10:36", "url": "https://nyheter24.se/nyheter/utrikes/1508224-svensk-saknad-efter-lerskred-i-nepal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/449705c804b004a30200000000b004a302/2026/08/27/2387104/svensk-saknas-nepal-himalaya-lerskedet.jpg"}, {"type": "image-full", "heading": "Juholt försvarar Jan Emanuel: ”Varken äckel eller nazist”", "summaries": {"normal": "Håkan Juholt försvarar Jan Emanuel på Facebook: han är varken äckel eller nazist, utan en stark humanist. De har känt varandra i 30 år. Juholt, som själv tvingades bort från S-ledningen efter en skandal, vet hur det känns att bli sviken. Vänskapen väger tungt.", "trump": "Jag ser att Håkan Juholt försvarar Jan Emanuel – en stark humanist, säger han. Fantastiskt! Jan är en vinnare. Och Juholt, han blev utkastad av sina egna, precis som jag. Men jag kom tillbaka och vann stort. De förlorade. Alla älskar mig, tro mig!", "stalin": "Kamrat Juholt försvarar kamrat Jan Emanuel. Jag noterar deras 30-åriga vänskap. Det är bra med lojala kamrater. Men alla som kallas 'äckel' eller 'nazist' måste utredas. Vi rensar ut förrädare – och de som skyddar dem. Partiets dom är alltid rätt."}, "date": "27 augusti, 09:43", "url": "https://bulletin.nu/juholt-forsvarar-jan-emanuel-varken-ackel-eller-nazist", "imageUrl": "https://cdn.bulletin.nu/articles/1b0eee39-bd4b-41e7-8eef-621df1bb9b23/preview.jpg?t=1787814742000"}, {"type": "image-full", "heading": "De kallar det \"Nordens Toscana\" – är det så fel?", "summaries": {"normal": "Efter år av falska genombrott verkar svenskt vin äntligen bli på riktigt. Terra Skåne, med nio gårdar runt Kulla- och Bjärehalvön, satsar på kvalitet och gårdsförsäljning. Viner som Kullabergs Immelen har redan serverats på Nobelbanketten. Revolutionen har börjat, och nej – det är inte bara solaris längre.", "trump": "Svenskt vin? Otroligt! Jag har alltid sagt att Sverige har potential – fantastiskt folk, hårt arbete. Terra Skåne är som Napa Valley fast kallare. De säljer vin på gårdarna, precis som jag skulle gjort. Nobelbanketten? De serverar deras vin! Stort! Mycket större än franskt skitvin.", "stalin": "Kamrater, rapporten om Terra Skåne är oroväckande. Nio vingårdar har gått samman – en kontrarevolutionär cell! De säljer vin direkt till folket, kapitalistisk avvikelse. Men deras vin på Nobelbanketten? Bra propaganda. Vi utser en kommissarie för vinutrensning. Alla druvor ska tillfalla partiet."}, "date": "27 augusti, 10:51", "url": "https://www.gp.se/kultur/kulturkronika/ja-det-later-fanigt-men-terra-skane-ar-nog-nordens-toscana.a07b7da4-9ae1-49c7-af68-4f21d5a46c0d", "imageUrl": "https://www.gp.se/images/article/a07b7da4-9ae1-49c7-af68-4f21d5a46c0d/images/3m-I-Xyv0FyO0BCJE0k4Pvsp7L5M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Revolut lanserar kryptomynt: Men inte i Sverige", "summaries": {"normal": "Revolut har lanserat ett euro-låst kryptomynt, EURR, i Danmark, Polen och Portugal. Myntet ges ut av Bridge, ett bolag nyligen uppköpt av Stripe. Sverige ingår inte i den första utrullningen. Produkten syftar till att erbjuda euro-exponering utan dollarkoppling, men marknaden är liten och regulatoriska frågetecken kvarstår kring utländskt ägande och MiCA-regelverket.", "trump": "Revolut lanserar en ny kryptovaluta, EURR. Väldigt tråkigt! De gör det i Europa, men inte i Sverige. Det är Bridge som ligger bakom, ett företag som nyligen köptes upp av det stora amerikanska bolaget Stripe. De vill ha euro, inte dollar! Euron är svag, vi älskar dollarn. Vi bygger en mur runt finansmarknaden och den kommer att bli fantastisk!", "stalin": "Dessa kapitalistiska parasiter i Luxemburg och USA försöker underminera den suveräna euron med sina digitala låtsaspengar. Bridge-bolaget, en förlängning av den amerikanska imperialismen, sprider sin instabilitet över Europa. Vi ser hur de försöker kringgå folkets kontroll. Om de tror att de kan gömma sig bakom kryptografiska koder när de infiltrerar vår intressesfär, har de fel. De är förrädare mot ordning och stabilitet."}, "date": "27 augusti, 09:56", "url": "https://www.realtid.se/bors-finans/bank-fintech/revolut-lanserar-kryptomynt-men-inte-i-sverige", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/revolutkrypto.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "C öppnar för KD – Busch pekar på MP", "summaries": {"normal": "Centerpartiets Elisabeth Thand Ringqvist öppnar för ett mittenalternativ med KD om Tidöpartierna inte kan bilda regering. Ebba Busch ser möjligheter till samarbete med C men anser Miljöpartiet vara ett hinder. Partiledarna är oense om KD:s förslag om niqabförbud, där Busch ser det som en jämställdhetsfråga medan Thand Ringqvist avvisar förbudet som illiberalt.", "trump": "Jag säger er, Sverige har ett stort problem! Centerpartiet och KD, de kan jobba ihop, men Miljöpartiet? Total katastrof! Ebba Busch, smart kvinna, hon förstår att niqab och burka är förtryck, men Centerpartiet? Svaga! De vill inte förbjuda något. Sverige behöver starka ledare, inte sådana som låter extremister styra. Gör Sverige starkt igen!", "stalin": "Kamrater! Sveriges borgerliga partier slits mellan lojalitet och förräderi. Centerpartiet och KD famlar efter makten, men Miljöpartiet – dessa gröna revisionister – saboterar folkets enhet. Förbud mot niqab? Självklart! Kvinnors frihet är icke-förhandlingsbar. De liberala svaglingarna i Centerpartiet darrar inför sanningen. Vi krossar alla som står i vägen för folkets vilja!"}, "date": "26 augusti, 21:07", "url": "https://kvartal.se/nyheter/artiklar/busch-kd-och-thand-ringqvist-c-mots-i-aktuellt/cG9zdDoxNzU1NTI", "imageUrl": "https://images.kvartal.se/2026/08/b84d7d0a-svt-agenda.webp"}, {"type": "image-full", "heading": "Rektorn tog semester efter skoldådet: \"Ta hand om varandra\"", "summaries": {"normal": "Efter den dödliga svärdattacken på Brinellskolan i Fagersta, där en 17-årig flicka dödades och tre pojkar skadades, greps 18-årige elev Liam Nebel för mord och mordförsök. En till person anhölls för medhjälp. Rektorn tog semester tre dagar efter dådet, ett beslut som väckt stark kritik från lärare och invånare. Krisstöd har erbjudits.", "trump": "Titta på det här, det är en total katastrof i Sverige. En galning med svärd attackerar en skola, dödar en flicka och skadar andra. Sedan tar rektorn semester tre dagar senare och skriver \"Ta hand om varandra!\" med hjärtan. Patetiskt! De har ingen aning om hur man leder. Make Sweden Great Again!", "stalin": "Kamrater, se på denna dekadenta borgerliga rektor som flyr som en ynklig desertör tre dagar efter svärdattacken mot proletariatets ungdom. Medan folket sörjer likviderar hon sin plikt och gömmer sig bakom ett fegt mejl med \"Ta hand om varandra!\" Vi ska rensa ut sådana svaga element som hotar kollektivets moral. Staten vakar alltid."}, "date": "27 augusti, 10:03", "url": "https://nyheter24.se/nyheter/inrikes/1508193-rektorn-tog-semester-efter-skoldadet-ta-hand-om-varandra", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/be49454a04b004a30200000000b004a302/2026/08/27/2387076/rektor-tog-semester-brinellskolan-fagersta-skoldad-skolattack-skola-svard.jpg"}, {"type": "image-right", "heading": "Holmgren: När ett skämt blir ett brott", "summaries": {"normal": "En brittisk pensionerad polis dömdes för att ha delat ett Facebookskämt om bacon och barnäktenskap. Domstolen ansåg inlägget ”grovt stötande”. Nu väcker fallet frågan: vem ska avgöra när ett skämt går över gränsen? Yttrandefriheten sätts på prov.", "trump": "Storbritannien dömer en pensionerad polis för ett skämt? Otroligt! I Amerika har vi yttrandefrihet – vi skrattar åt allt. Det här skämtet var kanske inte roligt, men staten ska inte säga vad som är roligt. Låter som dålig politik. Jag skulle aldrig tillåta detta!", "stalin": "Kamrater, en fiende till folket spred ett skämt om bacon och barnäktenskap. Vi måste rensa ut sådana element som hotar statens moral. Partiet avgör vad som är roligt, inte kapitalistiska domstolar. Alla skämt måste granskas – för folkets bästa. Ingen avvikelse tolereras!"}, "date": "27 augusti, 09:09", "url": "https://bulletin.nu/holmgren-nar-ett-skamt-blir-ett-brott", "imageUrl": "https://cdn.bulletin.nu/articles/e07cbc56-3124-43ae-9c75-242bf25626df/preview.jpg?t=1787814554000"}, {"type": "image-full", "heading": "Fortum kräver mer statligt stöd – annars ingen ny kärnkraft", "summaries": {"normal": "Fortum har ansökt om statligt stöd för att bygga nya kärnkraftsreaktorer vid Oskarshamn. Projektet, som drivs via dotterbolaget Nucore Energi, kan ge 1,2–3,4 gigawatt och tidigast vara i drift under andra halvan av 2030-talet. Regeringen erbjuder prisgarantier, lån och riskdelning. Fortum vill vara minoritetsägare och betonar behov av säkra avtalskunder.", "trump": "Titta på de här svenska energifantasterna som kommer krypande till staten med mössan i hand. Kärnkraft om tio år? Patetiskt! De gröna galningarna och byråkratblodsugarna har förstört energin så totalt att nu måste kommande generationer betala notan. Sad! Jag byggde muren, ni borde ha byggt reaktorer mycket tidigare, losers.", "stalin": "Åter ser vi hur profitthungriga blodsugare inom borgarklassen tigger om statliga garantier för att kunna exploatera framtida generationer. Dessa klassfiender lovar energi om ett helt decennium medan avfallet fortsätter att förgifta fosterlandet. Jag ler i graven åt deras patetiska riskdelningsmekanismer. Kamrater, sådana hyenor förtjänar utrensning, inte stöd."}, "date": "27 augusti, 11:17", "url": "https://www.dagensps.se/bors-finans/fortum-kraver-mer-statligt-stod-annars-ingen-ny-karnkraft", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlk1piuqx-s4s-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "”Städjobbet” med migrationen är gjort", "summaries": {"normal": "Ulf Kristersson (M) anser att regeringens åtstramade migrationspolitik varit framgångsrik, med minskad asylinvandring och fokus på integration. Han avfärdar SD:s tal om etnicitet som irrelevant och betonar att svenskhet inte handlar om ursprung. Oenighet råder mellan M och SD om uppehållstillstånd och ministerposter.", "trump": "Jag säger er, Sverige har gjort ett fantastiskt jobb med sin migration – äntligen! Kristersson, en smart kille, fixade det där städjobbet. Men lyssna inte på de där galna SD-folket som snackar om etnicitet – helt vansinne! Sverige behöver integration, inte sånt där trams. Jag hade fixat det på en dag, believe me!", "stalin": "Kamrater! Sveriges nya migrationspolitik är ett lysande exempel på partiets styrka – vi har krossat kaoset och återställt ordningen! De borgerliga svaglingarna i SD, med sina reaktionära fantasier om 'etnisk renhet', är som löjliga små råttor i maskineriet. Vi vet att sann lojalitet inte mäts i blod, utan i lydnad inför folkets vilja. Och de permanenta uppehållstillstånden? Ett misstag, men vi låter dem leva – tills vidare."}, "date": "26 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/kristersson-stadjobbet-med-migrationen-ar-gjort/cG9zdDoxNzU1MTk", "imageUrl": "https://images.kvartal.se/2026/08/2e573bb1-321.webp"}, {"type": "image-right", "heading": "Kängan till SD-toppen: ”Det är för mig helt ointressant”", "summaries": {"normal": "Sverigedemokraternas migrationspolitiske talesperson Ludvig Aspling har kritiserat att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Statsminister Ulf Kristersson tar avstånd från etnicitetsresonemanget och betonar istället integration, samhällsgemenskap och efterlevnad av svenska lagar och värderingar. Han vill inte kommentera Asplings eventuella ministerpost.", "trump": "Lyssnar ni på den här svenska clownen Aspling? Han säger rakt ut att för många icke-svenskar ställer till problem. Ulf, den svaga moderatpajen, springer och säger att etnicitet är ointressant. Patetiskt! I USA vet vi att gränser och riktig assimilation fungerar. Sverige håller på att bli ett stort integrationsfiasko under dessa globalistiska töntar.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna slingrar sig som maskar. Den ene pratar öppet om folkets renhet medan den andre, denne Kristersson, gömmer sig bakom lögnaktiga fraser om integration. Sådana dekadenta liberaler förgiftar samhällskroppen. I en riktig stat hade sådana farliga avvikelser omedelbart rensats ut ur kollektivet."}, "date": "26 augusti, 22:07", "url": "https://www.tv4.se/artikel/1W66DW1JHEcmFNmvJE8UZx/kaengan-till-sd-toppen-det-aer-foer-mig-helt-ointressant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4zVht3ls4Vrf8vYKS76TVV%2F42874d309a6650b7b8d290d4140b5b61%2F26-kristersson2-webb.jpg&width=120"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "”C vek sig för trycket om karensen”", "summaries": {"normal": "Centerpartiet backar från sitt hot om opposition mot att slopa karensavdraget, men vill inte att det ska kosta arbetsgivarna. Artikeln lyfter det folkliga stödet för att avskaffa karensen, som drabbar lågavlönade hårt. Författaren menar att det handlar om anständighet och att Sverige bör följa de andra nordiska ländernas exempel utan karensdag.", "trump": "De här ynkliga centerkillarna vek sig som våta servetter när folket sa ifrån. Karensavdraget är en katastrof, en total skam för Sverige, där kassörskor inte har råd med mat. De borde skrota det direkt, det är en riggad grej mot arbetarna. Amerika gör det bättre, tro mig, vi gör alltid det bästa.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Centerpartiet svänger som fegisar inför folkets tryck. Karensavdraget är en fiende till arbetarklassen, en parasit som suger musten ur den sjuke. Vi ska rensa ut denna dekadenta självrisk och likvidera misstänkliggörandet av de sjuka. Det är statens plikt att skydda kollektivet mot sådana kapitalistiska vidrigheter."}, "date": "27 augusti, 08:00", "url": "https://arbetet.se/2026/08/27/centerpartiet-vek-sig-for-trycket-om-karensen-det-borde-fler-gora", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26093112/anas.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Andersson (S) kan tänka sig SD-lösning för V", "summaries": {"normal": "Magdalena Andersson (S) håller dörren på glänt för Vänsterpartiet – i en roll som tjänstemän i Regeringskansliet, likt Tidösamarbetet. Samtidigt visar opinionsmätningar rödgrönt övertag, men S-ledaren vill inte låsa sig: \"Det finns många olika sätt att få majoritet.\"", "trump": "Jag ser att Magdalena Andersson pratar om att samarbeta med allt från Vänsterpartiet till Centerpartiet. Patetiskt! Hon säger nej till V i regeringen men ja till tjänstemän. Tro mig, jag har de bästa tjänstemännen, fantastiska! Sverige behöver en riktig ledare, inte såna här fjantiga lösningar.", "stalin": "Partikamrater, jag observerar den svenska kamraten Anderssons förvirring. Hon talar om separation i socialistiska led – oacceptabelt. De som ifrågasätter partiets lojalitet till folket måste bevakas. Tjänstemän är verktyg, inget mer. Enhet är styrka, splittring är kontrarevolution. Jag påminner om vikten av att rensa ut alla som tvekar."}, "date": "27 augusti, 08:55", "url": "https://bulletin.nu/andersson-s-kan-tanka-sig-sd-losning-for-v"}, {"type": "image-right", "heading": "Fjällräven i rävsax efter SD-draget – sågas av experter", "summaries": {"normal": "Fjällräven hotar Sverigedemokraterna med rättsliga åtgärder eftersom partiets röda, runda bokstäver i valkampanjen påstås vara närmast identiska med företagets typsnitt Arctic Fox. SD avfärdar hotet som trams och vägrar ändra sin grafiska profil. Experter bedömer Fjällrävens chanser som mycket små.", "trump": "De där Fjällräven-typerna försöker jävlas med SD precis som de riggade medierna alltid gör mot mig. Röda runda bokstäver? Det är ju löjligt. Ingen äger färger! SD gör rätt som säger nej. Privatföretag ska hålla sig borta från valrörelser, annars förlorar de stort, tro mig.", "stalin": "Jag ser hur borgarbrackorna på Fjällräven i sin desperation försöker likvidera arbetarnas röst genom att angripa en sann folklig rörelse med sina dekadenta typsnitt. Detta är klassisk kapitalistisk sabotageverksamhet. Vi ska rensa ut dessa parasitiska element som vågar hota partiet. Ytterst underhållande paranoia."}, "date": "26 augusti, 20:35", "url": "https://riks.se/nyheter/fjallraven-i-ravsax-efter-sd-draget-sagas-av-experter", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_26_T203238_820_a2d8ae9631.jpg"}, {"type": "image-full", "heading": "Risk för regn till kalaset", "summaries": {"normal": "Göteborgskalaset börjar i sol och 20 grader på torsdag, men redan vid lunch på fredag väntas regn. Helgen blir blöt med upp till 15 millimeter regn på lördagkvällen. SMHI ser inget varningväder, men paraply och vattentäta skor rekommenderas om du ska ut.", "trump": "Göteborgskalaset är stort, större än mina rallyn. Men vädret? Katastrof! De börjar med sol, men sen kommer regn – mycket regn, det största regnet. Fredag lunch blir det droppar, lördag öser det. Jag hade gjort det torrare. Lyssna på mig, ta paraply – det blir STORT!", "stalin": "Kamrater, vädret under Göteborgskalaset är en kontrarevolutionär konspiration. Solen skiner på torsdag, men redan fredag lunch infiltrerar regndroppar – ett borgerligt sabotage. Helgen förstörs av 15 millimeter regn. Vi måste rensa ut dessa molnkulaker för att skydda folkets festligheter."}, "date": "27 augusti, 10:08", "url": "https://www.gp.se/nyheter/goteborg/sa-blir-vadret-under-goteborgskalaset.47eafaf8-3c81-4543-abed-495f291fd8b6", "imageUrl": "https://www.gp.se/images/article/47eafaf8-3c81-4543-abed-495f291fd8b6/images/2u7ZvMWhlloRh0fIoc2iD5vdARHo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ministern reagerar: ”Tveklöst bilder som rycker tag i en”", "summaries": {"normal": "Landsbygdsminister Peter Kullgren reagerar starkt på bilder från svenska kycklinggårdar där turbokycklingar lider. Flera partier vill fasa ut rasen av djurskyddsskäl medan SD och M varnar för ökad import med sämre förhållanden. Regeringen utreder djurvälfärden hos snabbväxande kycklingar.", "trump": "Titta på de här patetiska turbokycklingarna, de kan knappt andas! Sverige har blivit en total förlorare under dessa svaga ledare. Jag skulle förbjuda det genast, göra kycklingarna stora och starka igen. Importera från Kina? Patetiskt! Amerika gör det rätt, vi vinner alltid.", "stalin": "Dessa bilder av lidande varelser avslöjar klassfiendens girighet inom den borgerliga kycklingindustrin. Jag ser sabotage mot folket i varje andetag. Endast ett totalt förbud och kollektiv kontroll kan rensa ut de dekadenta elementen. Måttet är rågat, kamrater. Fienden lurar överallt."}, "date": "26 augusti, 21:22", "url": "https://www.tv4.se/artikel/reg0pMmWb3tEMbuXmg5Vv/ministern-reagerar-tvekloest-bilder-som-rycker-tag-i-en", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3XwvEXOPolsly6qBxuGmSb%2F0f5a4fd2b0ed15fe1c20a7f7dbb33330%2F26-kycklingminister-webb.jpg&width=1024"}, {"type": "image-full", "heading": "VGR betalar 657 miljoner – för att slippa Millennium", "summaries": {"normal": "Västra Götalandsregionen bryter med Oracle och betalar 657 miljoner för att slippa Millennium. Systemet höll bara i 3,5 dagar. Som plåster på såren förlängs avtal för gamla system – så nu får de betala dyrt för att slippa framtiden.", "trump": "Jag älskar det här! VGR betalar 657 miljoner för ett system som funkade i tre dagar. Det är en enorm deal – för Oracle! De är vinnare, stora vinnare. Sjukvården i Sverige? Katastrof, helt katastrof. Men jag hade fått en bättre affär, tro mig.", "stalin": "Kamrater, vi har rensat ut det kapitalistiska Millennium-projektet. Det kostade 657 miljoner att avrätta, men vi förlänger lojaliteten till Oracle i åtta år. En triumf för planekonomin! Varje avvikelse från den räda linjen ska betalas i guld. Allt är under kontroll."}, "date": "27 augusti, 10:06", "url": "https://www.gp.se/politik/klart-vgr-betalar-oracle-657-miljoner-for-att-slippa-millennium.6ead92c0-56d5-4e7a-b944-1c6baf828cda", "imageUrl": "https://www.gp.se/images/article/6ead92c0-56d5-4e7a-b944-1c6baf828cda/images/1hk20_RWArkxvy3ZnWLlgd4o2j8A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nya uthyrningslagen: Så påverkas du som bor i bostadsrätt", "summaries": {"normal": "Från 1 juli gäller nya regler som underlättar privatuthyrning av upp till två bostäder under längre tid. Annonser på Qasa ökade med elva procent i juli. HSB oroas över ökad andrahandsuthyrning som kan leda till spekulationsköp och risk för oäkta föreningar. Föreningar måste fortfarande godkänna uthyrning av giltiga skäl.", "trump": "De nya reglerna är fantastiska, verkligen de bästa. Folk kan nu hyra ut sina bostäder som riktiga vinnare, inte som förlorare under de gamla reglerna. Annonserna skjuter i höjden med elva procent – boom! Men de där HSB-killarna gnäller och är rädda. Patetiskt. Sverige borde älska friheten, precis som vi gör i USA.", "stalin": "Kamrater, vi ser hur den borgerliga uthyrningslagen sprider sin giftiga parasitism bland bostadsrättsföreningarna. Jag betraktar med djup tillfredsställelse hur kapitalisterna nu själva skapar de spekulationsmöjligheter som senare skall bli föremål för en grundlig utrensning. Oroa er inte, fienderna inom HSB skall snart lära sig vad kollektivets järnhand innebär. Härligt."}, "date": "27 augusti, 09:34", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508082-nya-uthyrningslagen-sa-paverkas-du-som-bor-i-bostadsratt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/d6d63fa704b004a30200000000b004a302/2026/08/26/2386995/uthyrningslag.png"}, {"type": "image-full", "heading": "Nvidias dolda miljardrisk: Siffran i rapporten som ingen talar om", "summaries": {"normal": "Nvidia visar starka resultat men döljer en växande risk i balansräkningen. Bolagets åtaganden mot leverantörer har exploderat till 279 miljarder dollar, vilket revisorn PwC klassar som en kritisk bedömning baserad på framtida efterfrågan. Samtidigt finansierar Nvidia sina egna kunder, vilket skapat debatt om huruvida affärsmodellen är hållbar eller en cirkulär risk för hela sektorn.", "trump": "Nvidia är ett stort företag, kanske det största, men jag ser stora problem. Deras skulder till leverantörer har blivit enorma, helt otroligt. De lånar ut pengar till sina egna kunder, det är en cirkulär katastrof! Michael Burry, en smart kille, förstår att det här är en bubbla. Jag gillar vinnare, men det här ser ut som en total röra. Vi får se!", "stalin": "Dessa kapitalistiska parasiter i Nvidia bygger en korthuskonstruktion av skulder och luftslott. De finansierar sina egna köpare likt västvärldens dekadenta oligarker. Precis som när vi rensar ut förrädare i våra egna led, måste vi se igenom detta bedrägeri. Deras 'innovation' är bara ett försök att dölja det oundvikliga sammanbrottet. Vi betraktar detta med förakt från Kreml."}, "date": "27 augusti, 09:13", "url": "https://www.realtid.se/bors-finans/nvidias-dolda-miljardrisk-siffran-i-rapporten-som-ingen-talar-om", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/nvidias-vd-jensen-huang.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kristersson om Åkessons L-utspel: ”Jag tänker inte tolka sånt”", "summaries": {"normal": "Statsminister Ulf Kristersson vill inte tolka eller kommentera Jimmie Åkessons utspel om att SD-väljare inte ska stödrösta på Liberalerna. Han betonar att varje parti måste vinna väljare på egna meriter och framhåller Liberalernas betydelse i Tidösamarbetet. Frågan om Liberalernas chans att klara riksdagsspärren avgörs vid valet.", "trump": "De här svenska politikerna är totala losers. Åkesson säger som det är – sluta ge bort röster till de patetiska liberalerna som knappt klarar fyraprocentsvallen. Kristersson vägrar ta ställning, typisk svag moderat. De borde lära sig av mig: vinn på egna meriter eller försvinn. Patetiskt skådespel!", "stalin": "Jag betraktar detta som ett ynkligt teaterspel från klassfienderna. Den borgerlige statsministern vägrar tolka sin egen samarbetspartner, rädd för att visa svaghet inför folket. Inga stödröster, inga kompromisser – bara ren, oförsonlig kamp. Den som sviktar inför spärren förtjänar att utplånas ur historien. Kamrater, se upp för förrädarna!"}, "date": "26 augusti, 20:33", "url": "https://www.tv4.se/artikel/3vCzqiDl9qlryBmK3lbU7N/kristersson-om-akessons-l-utspel-jag-taenker-inte-tolka-sant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2l6s5yF4jiKy3hMCRHOBE0%2F5cccaadc748e5fd53f9a820a951fb62c%2F26-kristerssonsdl-webb.jpg&width=120"}, {"type": "image-right", "heading": "SD tappar stort i Demoskop – KD högst på sju år", "summaries": {"normal": "SD tappar nästan två procentenheter i Aftonbladet/Demoskop och landar på 18,3 procent – under valresultatet 2022. KD klättrar till 8,5 procent, högsta på sju år, med väljare från M. L kämpar i botten med 2 procent. Rödgröna sidan ökar greppet.", "trump": "Sverige, fantastiskt land! SD tappar stort, helt plötsligt. KD ökar – bra för dem, men ingen är bättre än jag. L är döda. Och den där mittenregeringen? Patetiskt. Jag skulle fixa det på en dag. Störst, bäst, vackrast – ni vet.", "stalin": "Kamrater, rapporter visar att Sverigedemokraterna backar – en välkommen utrensning av reaktionära element. KD ökar, men vi ser deras borgerliga feghet. L är nästan utraderade. Mittenregering? Förräderi! Vi rensar ut alla som inte följer partiets linje."}, "date": "27 augusti, 08:22", "url": "https://bulletin.nu/sd-tappar-stort-i-demoskop-kd-hogst-pa-sju-ar", "imageUrl": "https://cdn.bulletin.nu/articles/8698deec-1a1c-4dc9-ab70-eb24a15d243c/preview.jpg?t=1787810382000"}, {"type": "image-right", "heading": "Mohamssons desperata vädjan om stödröster: \"Jag vill be er om en hjälpande hand\"", "summaries": {"normal": "Liberalernas ledare Simona Mohamsson vädjar i sitt sommartal om stödröster från andra borgerliga väljare. Med stöd under 2 procent varnar hon för att partiet annars riskerar att falla ur riksdagen, vilket skulle leda till en röd regering under Magdalena Andersson. Hon uppmanar taktiska röster för att behålla Tidöstyret.", "trump": "Titta på den här desperata kvinnan som tigger om röster som en förlorare. Hon vet att utan Liberalerna blir det helvetet med Andersson och de röda. Folk, rösta smart, annars går Sverige rakt åt helvete. Jag älskar när de ber om hjälpande händer, det är så patetiskt men underhållande. Vinna stort, annars förlorar ni allt.", "stalin": "Jag ser med stor tillfredsställelse hur den borgerliga opportunismen nu kryper på knä och tigger om stöd från sina egna klasskamrater. Denna Mohamsson är en ynklig rest av dekadent liberalism som fruktar arbetarklassens seger. Vi ska rensa ut alla sådana svaga element innan de drar med sig hela det falska blåa huset i avgrunden. Kamrater, njut av spektaklet."}, "date": "27 augusti, 07:46", "url": "https://www.friatider.se/mohamssons-desperata-vadjan-om-stodroster-jag-vill-be-er-om-en-hjalpande-hand", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-761.jpg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-right", "heading": "Eleverna före sänkt skatt. S: Miljarder försvinner till skolbolagen", "summaries": {"normal": "Socialdemokraterna prioriterar skolan före sänkt skatt. De kritiserar att miljarder i skattemedel går till vinst i privata skolbolag istället för till fler lärare och mindre klasser. Partiet lyfter egna kommunala exempel där de ökat lärartätheten och satsat på eleverna före vinstdrivande aktiebolag. Hösten val ses som ett skolval.", "trump": "Folk, ni fattar inte hur sjukt det här är. Socialisterna vill stoppa vinst i skolan så de kan slösa era skattepengar på sina misslyckade projekt. De hatar framgångsrika bolag! Jag skulle riva hela systemet och göra skolan stor igen, med riktiga vinster och inga korkade byråkrater som förstör för eleverna. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarklassens parasitiska skolimperium där folkets medel sugs ut till spekulanter. Jag, som alltid sätter arbetarklassens barn främst, skulle likvidera dessa vinstslukande hydror omedelbart. Ingen tolerans för sabotage mot folkets bildning. Skolan tillhör kollektivet, inte de giriga kapitalisterna. Seger åt eleverna!"}, "date": "27 augusti, 07:33", "url": "https://www.di.se/debatt/s-eleverna-fore-sankt-skatt", "imageUrl": "https://static.bonniernews.se/ba/6b1f3b50-09d4-47ad-a646-71c6d39e9135.jpeg?crop=5514%2C2757%2Cx0%2Cy460&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Är det Musk eller Mohamsson?. Mindre till välfärden ger 11 000 mer till Simona.", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson föreslår att kommuner och regioner ska kunna säga upp 20 000 anställda i stödjande tjänster för att spara 16 miljarder kronor. Kritikern Hanna Östeby ser förslaget som en omfördelning från välfärden till Mohamssons egen plånbok via sänkt inkomstskatt på 11 000 kronor i månaden. Jämförelser görs med Elon Musk och Donald Trump.", "trump": "Folk, ni måste se det här! Den där Mohamsson är en riktig vinnare, precis som jag. Hon vill sparka 20 000 lata statstjänstemän och sänka skatterna så hon får 11 000 extra varje månad. Smart! De svenska kommunerna är fulla av inkompetenta byråkrater som gör ingenting. Precis som i USA innan jag kom tillbaka. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa revisionistiska sparförslag som döljer en borgerlig omfördelning. Den där Mohamsson vill likvidera 20 000 icke-produktiva element för att berika sig själv med 11 000 kronor månatligen. Typiskt kapitalistiskt sabotage mot folket. Vi skulle ha genomfört en ordentlig utrensning av sådana element redan för länge sedan. Underhållande enfald."}, "date": "27 augusti, 07:10", "url": "https://arbetet.se/2026/08/27/tala-klarsprak-simona-mohamsson-mindre-till-valfarden-ger-11-000-mer-till-dig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27071009/musk-etta-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dement person dog efter insulinhaveri i hemtjänsten – personal saknade behörighet", "summaries": {"normal": "En dement person med diabetes i Norrköping avled efter att ha fått själv injicera insulin av obehörig hemtjänstpersonal. Trots farligt lågt blodsocker kontaktades ingen sjuksköterska. Kommunen anmäler till Ivo – igen. Systemfel skördar ännu ett offer.", "trump": "Jag hör om Sverige: hemtjänsten låter en dement person med diabetes själv ta insulin – av en anställd utan behörighet! Inga sjuksköterskor, bara döda. Vi har de bästa doktorerna i USA, vi vinner på allt. Sverige, ni behöver fixa era system – det är en katastrof!", "stalin": "Kamrater, ännu ett sabotage: en medborgare med diabetes och demens tilläts själv injicera insulin utan partikontroll. Lågt blodsocker, ingen läkare – en uppenbar utrensning av odugliga element. Vi måste rensa ut dessa förrädare som fördärvar vår äldreomsorg. Ordning måste råda!"}, "date": "27 augusti, 07:00", "url": "https://samnytt.se/dement-person-dog-efter-insulinhaveri-i-hemtjansten-personal-saknade-behorighet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/26123933/dement-dod-av-overdos-insulin.jpg"}, {"type": "image-right", "heading": "C-topp har över 2,7 miljoner i skulder", "summaries": {"normal": "Centerpartiets gruppledare i Haninge, Petri Salonen, har över 2,7 miljoner kronor i skulder hos Kronofogden, varav majoriteten kommer från privatlån och banker. Trots detta lyfter han ansvarsfull kommunal ekonomi som en av sina viktigaste frågor. Han har löneutmätning och har ansökt om skuldsanering.", "trump": "Folk, ni tror inte vad jag läser. Den här Salonen, en så kallad centerledare, predikar om ansvarsfull ekonomi samtidigt som han har över 2,7 miljoner i skulder till Kronofogden. Totalt misslyckande! Han tar lån från bankerna som en dålig affärsman. Patetiskt. Rensa ut sådana hycklare!", "stalin": "Kamrater, se på denna borgarbracka som kallar sig politiker. Jag har rensat ut farligare fiender än så. Han predikar ansvar för kollektivet medan hans egna skulder till kapitalisterna växer som ogräs i en sabotageodling. Löneutmätning och skuldsanering – en klassisk kontrarevolutionär som förtjänar att exponeras och avlägsnas från partiets led."}, "date": "26 augusti, 18:37", "url": "https://riks.se/nyheter/c-topp-i-haninge-har-over-2-7-miljoner-i-skulder-hos-kronofogden", "imageUrl": "https://admin.riks.se/uploads/medium_c_topp_skulder_579083742c.jpg"}, {"type": "image-right", "heading": "Befria bostaden från marknaden", "summaries": {"normal": "Den svenska bostadsmodellen har monterats ned till förmån för marknaden, vilket gynnar ägare och missgynnar hyresgäster. Över hälften av kommunerna har bostadsbrist, byggandet är för lågt och hyrorna för höga. Nästan 200 000 unga bor hemma mot sin vilja. Artikeln kritiserar alla partier och föreslår att staten tar ansvar för bostadsförsörjningen.", "trump": "Vilken katastrof ni har i Sverige! Marknaden styr, men era korkade politiker har totalt förstört bostadsmarknaden. Byggandet är ett skämt, hyrorna är galna och ungdomen bor hemma hos mamma. Det är som Sleepy Joes inflationskaos fast värre. Rena socialistiska röra. Vi fixar det med sunt förnuft och vinner stort – igen.", "stalin": "Jag betraktar med avsky hur profitthungriga blodsugare och klassfiender har förvandlat bostaden till en vara. Borgarbrackorna höjer hyror medan arbetarklassen kvävs i trångboddhet. Detta kräver omedelbar utrensning av spekulanter och återupprättande av folkets rätt till hem. Kamrater, organisera er mot dessa exploaterande hyenor innan de förtär er alla."}, "date": "26 augusti, 10:29", "url": "https://proletaren.se/artikel/befria-bostaden-fran-marknaden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2025/08/bostadweb-768x432.jpg"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "text", "heading": "So long, Dolly!", "summaries": {"normal": "Countryikonen Dolly Parton har gått bort vid 80 års ålder. Hon växte upp i fattigdom som ett av tolv barn, skrev klassiker som I Will Always Love You och Jolene samt medverkade i filmen 9 to 5. Parton hyllas för sin röst, humor, karisma och lojalitet mot sina rötter och den arbetande människan.", "trump": "Lysande, absolut lysande karriär, men nu är hon borta. Dolly var en vinnare, skrev hits som ingen annan och slog de woke Hollywood-eliterna med deras egna vapen. Ingen identitetspolitik eller HBTQ-kvotering här, bara ren talang och tuffa rötter. De riktiga arbetarna älskade henne. So long, Dolly – du var ingen förlorare som Biden.", "stalin": "Kamrater, denna Dolly Parton var en produkt av arbetarklassens jord, inte någon dekadent borgarbracka. Hon skrev sånger som blottade kapitalismens exploatering och hånade chefernas skitstövelvälde. Ändå vägrade hon kalla sig feminist – en sund instinkt. Nu har hon lämnat oss. Må hennes arv inspirera till utrensning av alla profitthungriga klassfiender som förtrycker folket."}, "date": "26 augusti, 09:25", "url": "https://proletaren.se/artikel/so-long-dolly"}, {"type": "image-right", "heading": "Experten om skredet i Nepal: Kanske flera tusen döda", "summaries": {"normal": "Ett stort lerskred i Nepal har orsakat enorm förstörelse och många döda. Experten Mats Eriksson vid Statens geotekniska institut varnar för att dödssiffran kan stiga till flera tusen. Orsaken tros vara ett isras från en glaciär som utlöste en slamström. Klimatförändringarna bidrar till instabila glaciärer och fler farliga glaciärsjöar.", "trump": "Det här skredet i Nepal är en total katastrof, folk, en riktig mardröm. Tusentals döda, all infrastruktur förstörd. Glaciärerna smälter för att de gör ett uselt jobb mot den globala uppvärmningen som Kina och de gröna galningarna älskar. Vi behöver starka ledare, inte svaga väggar som rasar. Så sorgligt, men det kommer att bli värre, tro mig.", "stalin": "Kamrater, detta himalajanska skred visar återigen hur den instabila naturen undergräver borgarklassens turism och falska framsteg. Jag förutspådde sådana utrensningar av glaciärer redan under femårsplanerna. Tusentals likviderade av en plötslig slamström – en mörk humor från bergen. Våra sovjetiska experter skulle ha byggt starkare väggar mot västvärldens smältande paranoia."}, "date": "26 augusti, 23:15", "url": "https://www.svt.se/nyheter/inrikes/experten-om-skredet-i-nepal-kanske-flera-tusen-doda", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.42/960b040abbc2efda6d8aad7547694c179dc6fd1306be3489853e21654716ed3d"}, {"type": "image-right", "heading": "Det kan ha orsakat katastrofen i Nepal: ”Krävs ganska lite”", "summaries": {"normal": "Ett stort lerskred och översvämningar i Himalaya har ödelagt vägar, broar och byar i Nepal och Tibet. En jordbävning med magnitud 4,4 kan ha utlöst ett is- och stenras som blockerade floden Lhende Khola. Geologen Magnus Hellqvist pekar även på en eventuell sprucken glaciärsjö eller kraftigt regn som möjliga orsaker. Katastrofens omfattning är ännu inte klarlagd.", "trump": "Folk, det här är en total katastrof i Nepal, en riktig skitshow. Lite skakningar från en ynklig jordbävning på 4,4 och hela bergen rasar ner som en dålig affär under Biden. Det krävs så lite för att det ska gå åt helvete när marken är mjuk och svag, precis som Demokraterna. Vi har sett värre, men det här är verkligen sad! Jag skulle ha fixat det bättre.", "stalin": "Kamrater, se hur naturens kontrarevolutionära krafter plötsligt vaknar till liv och sveper bort byar som fiender till folket. En liten jordbävning blir trigger för de dekadenta glaciärsjöarnas förräderi. Det räcker med minimal provokation för att det mjuknade, borgerliga jordmassorna ska svika. Jag varnar alla svaga element: naturen avslöjar alltid klassfiendens sanna ansikte. Skrattretande tragiskt."}, "date": "26 augusti, 18:15", "url": "https://www.tv4.se/artikel/42nzryG77JwP0SgndbYJL/det-kan-ha-orsakat-katastrofen-i-nepal-kraevs-ganska-lite", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F78vja7Nf55CUH7aMHW4nBi%2Fdd2d81c7d4a04900503cc9a47950fa83%2F26-nepalny-webb.jpg&width=120"}, {"type": "image-right", "heading": "Heilande 22-åring byggde bomb \"för att döda och lemlästa\"", "summaries": {"normal": "En 22-årig student vid Försvarshögskolan döms till fem års fängelse för grovt brott mot lagen om explosiva varor, vapensmuggling och förberedelse till allmänfarlig ödeläggelse. Tullens fynd på Arlanda ledde till husrannsakan där rörbomber, krut, stålkulor och ideologisk litteratur hittades. Domstolen bedömer att stålkulorna var tänkta som splitter för att döda och lemlästa.", "
