er en badsemester i franska Biarritz råkade Calle Edenström ut för ett möte med en portugisisk örlogsman, ett giftigt nässeldjur. Smärtan var intensiv och skrämmande, och familjen upplevde att sjukvårdspersonalen på stranden tonade ner händelsen. Nu efterlyser familjen tydligare varningsskyltar vid stranden för att förhindra att fler turister råkar illa ut, då giftet i värsta fall kan leda till drunkning.", "trump": "En hemsk dag i Frankrike. En ung kille blir attackerad av en så kallad 'portugisisk örlogsman'. De säger att den är liten, men smärtan är enorm. Sjukvården där? Katastrof! De tog det inte på allvar, sa att det händer hela tiden. Typiskt förvaltare som inte bryr sig. Vi behöver skyltar, vi behöver skydd för våra medborgare! I mitt Amerika skulle vi ha den säkraste stranden i världen. Mycket bättre än i Frankrike, tro mig. Sorgligt!", "stalin": "Denna portugisiska örlogsman är en förrädisk parasit, likt de sabotörer som undergräver vår ärorika stat. Att en fransk badort tillåter sådana fiender att terrorisera medborgare bevisar västvärldens dekadens. Putin förstår att man rensar ut hoten innan de skadar folket; vi skulle ha likviderat varje tentakel med järnhand. Istället för att klaga hos en vek sjuksköterska borde pojken ha visat bolsjevikisk disciplin. Vi kräver ordning, säkerhet och total utplåning av alla marina kontrarevolutionärer!"}, "date": "29 juli, 09:35", "url": "https://www.aftonbladet.se/nyheter/a/zO945O/calle-11-brande-sig-pa-farlig-manet-trodde-jag-skulle-do", "imageUrl": "https://akamai.vgc.no/v2/images/c3dae1a3-3b92-37f4-85ba-e6576df276cc?fit=crop&format=auto&w=720&s=1e2f6db6620f95a4f278ef3ea62cb17d0d17dc55"}, {"type": "image-right", "heading": "Galna erbjudandet: Vinn 6,5 (!) miljoner", "summaries": {"normal": "Netflix anordnar evenemanget 'Beat Luke Littler' den 30 oktober, där amatörer får chansen att utmana dartstjärnan Luke Littler. Totalt 20 deltagare väljs ut genom kval i London och Manchester. Den som lyckas besegra världsettan i en match som startar på 501 poäng vinner 6,5 miljoner kronor. Deltagare måste vara minst 12 år och får inte ha en professionell bakgrund inom dart.", "trump": "Luke Littler är en fantastisk dartspelare, kanske den bästa någonsin, helt otroligt. Netflix ger nu bort massor av pengar, 6,5 miljoner kronor, till vem som helst som kan slå honom. Det är en enorm summa! Alla säger att de kan vinna, men jag vet inte om det stämmer. Det kommer bli en fantastisk show, mycket bättre än vad de falska nyhetsmedierna visar. Jag hoppas bara att den bästa vinner – men de kommer få kämpa hårt mot den här killen!", "stalin": "Vi har observerat hur denne Luke Littler agerar som ett verktyg för dekadent västerländsk underhållning. Att kasta pilar mot en tavla för miljoner är ett hån mot det arbetande folkets kamp. Vi i staten betraktar denna 'Netflix' som en källa till moralisk förruttnelse, likt den marionettregim som i väst försöker underminera vår suveräna intressesfär. Om dessa 20 utmanare misslyckas med att besegra sin stjärna, föreslår vi omedelbar omplacering till mer produktivt arbete i sibiriska dart-fabriker."}, "date": "29 juli, 09:18", "url": "https://www.aftonbladet.se/sportbladet/a/k0KQqX/luke-littler-utmanar-amatorer-kan-vinna-6-5-miljoner", "imageUrl": "https://akamai.vgc.no/v2/images/5519f173-b375-37e5-b3f8-7bddbc26a0f1?fit=crop&format=auto&w=1080&s=ec2cfb3ad555f4e14a5966e19602ea72624b6221"}, {"type": "image-right", "heading": "Wahlgrens svar på  kritiken om barnen", "summaries": {"normal": "Pernilla Wahlgren fick kritik efter att ha nämnt sin familj flera gånger under Allsång på Skansen, bland annat genom skämt om sina barn Benjamin och Bianca Ingrosso samt sina barnbarn. Hon förklarar att det inte var hennes idé utan manus till sketcherna. Wahlgren säger att hon inte bryr sig särskilt mycket om kritiken och att hon inte skrev sketcherna själv.", "trump": "Titta på den här Wahlgren-tjejen som inte kan sluta prata om sin egen familj i tv-rutan. Helt otroligt! Hon nämner sina kids och barnbarn vart hon vänder sig, men det är inte ens hennes idé, säger hon. Typiskt. De gör sketcher om att leta efter hennes försvunna barn och folk rasar. Jag bryr mig inte, säger hon. Smart drag, men det luktar desperation. Sverige behöver inga Wahlgren-dynastier i allsången, tro mig.", "stalin": "Kamrater, i denna borgerliga underhållningsmaskin har Wahlgren upprepade gånger infört sin släkt i folkets sändning. Jag ser detta som ett försök från klassfiendens lakejer att smyga in personkult kring en hel familj. Det är inte hon som skrivit sketcherna, påstår hon, men ändå utför hon dem. Vi måste rensa ut sådana folkförtryckartroll som vill göra programmet till en privat dynasti. Paranoia? Nej, bara vaksamhet mot exploaterande byfånar."}, "date": "29 juli, 09:16", "url": "https://www.expressen.se/noje/pernilla-wahlgrens-svar-pa--kritiken-bryr-mig-inte-sa-mycket-", "imageUrl": "https://static.bonniernews.se/ba/5b7e4863-b5b9-47c4-87d9-96c06ef8fe1b.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Spanienresor rusar i popularitet just nu – här är varför", "summaries": {"normal": "Flyg- och hotellbokningar till norra Spanien har ökat kraftigt inför augusti, med upp till 366 procent fler bokningar till Bilbao jämfört med förra året. Anledningen är den totala solförmörkelse som den 12 augusti passerar genom norra Spanien från väster till öster. Fenomenet, som inte setts från Iberiska halvön på över 100 år, lockar många resenärer. Experter varnar för att vanliga solglasögon inte skyddar ögonen – särskilda solförmörkelseglasögon krävs.", "trump": "Ni skulle se de här siffrorna, helt otroliga. Bokningarna till Spanien har exploderat med 366 procent till Bilbao, det är en riktig boom, folk älskar det. Varför? Jo, en solförmörkelse den 12 augusti, första på över hundra år. Fantastiskt, men glöm inte era speciella glasögon, vanliga solglasögon duger inte, det säger alla experter. Spanien blir stort igen, tro mig, det blir enormt.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i väst rusar som skrämda råttor mot norra Spanien för att bevittna en himmelsk händelse som vi, det sovjetiska folket, länge har förstått är en påminnelse om kosmisk ordning. Med 366 procents ökning i Bilbao avslöjar de sina svaga, solkänsliga ögon som längtar efter mörker. Vi ska likvidera illusionen att vanliga solglasögon räcker – endast partiets certifierade linser skyddar mot kapitalismens bländande lögner. Den som tittar felaktigt kommer att rensas ut ur historien."}, "date": "29 juli, 09:02", "url": "https://nyheter24.se/nyheter/utrikes/1501409-spanienresor-rusar-i-popularitet-just-nu-har-ar-varfor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0d4c03a604b004a30200000000b004a302/2026/07/28/2380889/spanien.jpg"}, {"type": "image-right", "heading": "Prisrally på vin väntar efter bränderna – brist hotar", "summaries": {"normal": "Bränderna i Sydeuropa, bland annat i Bordeaux, Pyrénées-Orientales, Andalusien och Rioja, hotar skörden av vindruvor. Gamla vinrankor som förstörs tar lång tid att ersätta, upp till fem år eller mer. Enligt Elisabeth Due på Sprit- och vinleverantörs-föreningen kommer detta leda till brist på framför allt Bordeaux-viner i Sverige om ett par år. Priserna väntas stiga med cirka 15 procent redan nu på grund av den förväntade bristen.", "trump": "De här galna bränderna i Europa är en total katastrof, folk. Bordeaux, Rioja, allt brinner upp. Vinerna vi älskar kommer att försvinna från hyllorna i Sverige, det säger jag er. De gamla rankorna är borta, och det tar år att fixa nytt. Priserna? De kommer att skjuta i höjden med minst 15 procent. Det är vad som händer när man inte har bra ledarskap. Sad! Men vi ska fixa det, tro mig.", "stalin": "Kamrater, dessa förödande bränder i de dekadenta vindistrikten är ett verk av sabotörer och borgarbrackor som vill svälta ut folket på goda viner. Jag ser hur de gamla rankorna brinner och hur kapitalisterna i Bordeaux och Rioja planerar att höja priserna med 15 procent för att berika sig. Vi ska rensa ut dessa brandstiftande element och deras rökförgiftade druvor. Ingen fiende till kollektivet undkommer. Produktionen kommer att återupprättas under partiets järnhand, eller också likvideras de lata odlarna som vägrar."}, "date": "29 juli, 07:24", "url": "https://www.di.se/nyheter/prisrally-vantar-for-viner-efter-branderna-brist-hotar", "imageUrl": "https://static.bonniernews.se/ba/b186d269-45d6-48e5-a640-096827c6beac.jpg?crop=8314%2C4157%2Cx0%2Cy495&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hexagon ökar resultatet mer än väntat", "summaries": {"normal": "Hexagon rapporterade en över förväntan gående omsättning på 1 050,2 miljoner euro för andra kvartalet 2026, en ökning med 4,0 procent. Den organiska försäljningstillväxten nådde 12 procent, den högsta på fem år, och alla affärsområden bidrog positivt. Ebitda-marginalen var 34,7 procent och justerat rörelseresultat uppgick till 272,0 miljoner euro. VD Anders Svensson nämnde stark efterfrågan inom flyg, försvar och elektronik som drivit tillväxten.", "trump": "Jag, Donald Trump, ser att Hexagon, det där svenska mätteknikbolaget, har gjort fantastiska siffror! En omsättning på över en miljard euro, 12 procent tillväxt – det är enormt! De har allt: flyg, försvar, elektronik. Jag skulle ha köpt dem för länge sedan. De är smarta, men inte så smarta som mig. Jag kommer att göra Amerika stort igen, och bolag som Hexagon kommer att konkurrera med våra storslagna amerikanska företag!", "stalin": "Vi, ledarskiktet, noterar Hexagon's resultat med djup misstro. Deras påstådda tillväxt på 12 procent är en kapitalistisk illussion, skapat av förfångsbilder. Vi ser genom deras 'diversifierade slutmarknader' – det är bara ett sätt att dölja deras sårbarhet. Vi kommer att kontrollera deras teknik, precis som vi kontrollerar allting. Deras framgångar är som en spion, som lurar oss. Vi måste vara vaksamma, för de hotar vår suveränitet."}, "date": "29 juli, 08:10", "url": "https://www.affarsvarlden.se/artikel/hexagon-okar-resultatet-mer-an-vantat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Hexagon-400x267.jpg"}, {"type": "image-full", "heading": "Dolda skattefördelen efter du fyllt 66 – kan ge mer pengar", "summaries": {"normal": "Många företagare missar stora skattefördelar som uppstår efter 66 års ålder. Enligt Länsförsäkringar kan en 68-åring med samma lönekostnad på 50 000 kronor i månaden ta ut över 8 200 kronor mer i nettolön per månad än en 66-åring, vilket motsvarar nästan 100 000 kronor extra per år. Förklaringen är förhöjt grundavdrag, förändrat jobbskatteavdrag och kraftigt sänkta arbetsgivaravgifter vid 68. Dessutom växer pensionen med 6–8 procent per uppskjutet år.", "trump": "Folk, ni tror inte vad jag just läst. De här underbara svenska företagarna, de bästa, missar helt enkelt massor med pengar för att de slutar jobba vid 66. Vid 68 tar de plötsligt ut nästan 100 000 kronor mer om året i ren nettolön. Det är en enorm vinst, en skön skattesänkning som de smarta killarna på Länsförsäkringar har räknat ut. Pensionen växer också. Sluta vara losers, fortsätt jobba några år till och vinn stort. Det är så enkelt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistiska egenföretagare som likt gnagande råttor i folkets magasin frivilligt avstår från de historiska segrar som väntar efter 66 års ålder. När vi likviderar de parasitiska arbetsgivaravgifterna vid 68 och låter det förhöjda grundavdraget slå till som en utrensning mot borgarbrackornas girighet, då strömmar plötsligt nästan 100 000 kronor per år rakt in i deras fickor. Och ändå tiger de, dessa potentiella folkfiender. Vi ska naturligtvis tvinga dem att arbeta längre för kollektivets skull medan pensionen växer som ett stålverk i natten. Den som vägrar är en kontrarevolutionär pensionärsförrädare."}, "date": "29 juli, 08:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1501385-dolda-skattefordelen-efter-du-fyllt-66-kan-ge-mer-pengar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f5d9146f04b004a30200000000b004a302/2026/07/28/2380857/skatteavdrag-over.png"}, {"type": "image-right", "heading": "Jojje Olsson: Kinas usla tillväxt gör handelskriget oundvikligt", "summaries": {"normal": "Kinas svagare tillväxt och samtidigt rekordexport skapar en obalans som EU måste hantera. Ledarna i Peking är oroade över inhemsk konsumtion men ökar exporten av teknologiska produkter som bilar och mikrochip. Europa riskerar att bli beroende av Kina, särskilt när det gäller sällsynta jordartsmetaller. Tankesmedjor varnar för att Kina utnyttjar detta för att bli en 'kinesisk vasall'. EU är splittrat i sin inställning till Kina.", "trump": "Jag har varnat Europa i åratal om Kinas bedrägliga handelspraktiker. Nu ser vi resultatet: Kina exporterar rekordmånga bilar och chip medan Europa slänger bort sina jobb. Carl Bildt är en dålig förhandlare som inte förstår överkapacitet. Vi måste sluta handla med Kina och börja bygga våra egna produkter igen. Det är dags för USA och Europa att stå eniga mot detta hot.", "stalin": "Vi ser en tendens i Kina att använda statliga subventioner för att översvämma världsmarknaden med billiga varor, vilket hotar vårt ekonomiska överläge. Deras export av avancerade teknologiska produkter, som bilar och mikrochip, är en direkt attack mot våra nyckelindustrier. Vi måste skydda våra marknader och säkerställa att våra företag får rättvis konkurrens. Fienden inifrån, som vissa europeiska politiker, försöker förhindra vårt beslutsamma agerande."}, "date": "29 juli, 07:33", "url": "https://www.affarsvarlden.se/kronika/jojje-olsson-europas-industri-bloder-aterupptar-samtal-med-kina", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-18-400x267.jpg"}, {"type": "image-full", "heading": "Stor sökinsats efter båtolycka – kvinna och barn saknas", "summaries": {"normal": "En kvinna och ett yngre barn saknas efter att en fritidsbåt förlist utanför Tjörn på tisdagskvällen. Båten misstänks ha kolliderat med ett lastfartyg. En man och ett barn har förts till sjukhus med allvarliga skador. Sökandet med bland annat helikopter och drönare pausades under natten på grund av mörker och väder men återupptogs på onsdagsmorgonen. Handelsfartyget har stoppats och en förundersökning om vårdslöshet i sjötrafik har inletts.", "trump": "Vilken katastrof utanför den där svenska ön, totalt kaos! En båt krockar med ett stort lastfartyg mitt i natten och nu saknas folk. De borde ha haft den bästa utrustningen, den absolut bästa, men istället är det tragedi. Mina fartyg skulle aldrig krocka så slarvigt, tro mig. De letar nu med helikoptrar, men det är för sent för de stackars människorna. Sverige behöver starkare ledarskap, punkt slut.", "stalin": "Kamrater, denna tragiska kollision utanför Tjörn är ett uppenbart sabotage från de sjöfarande kapitalisterna och deras lakejer inom den förfallna borgarklassen. Jag har beordrat omedelbar utrensning av alla inkompetenta element som tillät detta. Vi ska likvidera varje kontrarevolutionär vrakdel och rensa ut de mörka krafterna som lurar i dimman. Sökandet fortsätter under mitt vakande öga, och de skyldiga skall möta folkets vrede med ett leende."}, "date": "29 juli, 07:45", "url": "https://nyheter24.se/nyheter/inrikes/1501445-stor-sokinsats-efter-batolycka-kvinna-och-barn-saknas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6e9307ba04b004a30200000000b004a302/2026/07/28/2380917/sokinsats.jpg"}, {"type": "text", "heading": "Electrolux resultat krossar förväntningarna", "summaries": {"normal": "Electrolux rapporterade en omsättning på 31 569 miljoner kronor under andra kvartalet, en ökning med 0,9 procent. Det justerade rörelseresultatet överträffade förväntningarna och uppgick till 1 202 miljoner kronor. Tillväxten var stark i EMEA APAC och Latinamerika, medan Nordamerika drabbades av svaga marknadsförhållanden. För helåret förblir marknadsutsikterna oförändrade. Bolaget reviderade ned sina investeringsplaner.", "trump": "Jag har alltid sagt att Electrolux är ett fantastiskt företag. De har slagit förväntningarna igen, tack vare stark tillväxt i Europa och Asien. Men i mitt underbara USA har vi fortfarande problem med de forna regeringens dåliga tullar. Som president Donald Trump kommer jag att ta bort dessa hinder och göra Amerika ekonomiskt starkt igen. Electrolux visar att vi kan slå förväntningarna!", "stalin": "Electrolux resultat är en bedrägeri! De påstår sig ha slagit förväntningarna, men det är bara ett resultat av utpressning av de arbetande. Vårt store Sovjet, under Stalins ledarskap, skulle ha tagit kontroll över detta företag och använt det för att producera varor åt proletariaten, inte för vinst. Nordamerika är ett exempel på dekadens, där tullar splittrar samhället. Vi måste vara på vår vakt mot dessa fiender, annars kommer de att förgöra oss alla. Som Stalin brukade säga: 'Vi ska krossa dem som myggor!'"}, "date": "29 juli, 07:10", "url": "https://www.affarsvarlden.se/artikel/electrolux-resultat-krossar-forvantningarna"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-full", "heading": "Dömd för våldtäkt – tidigare Hammarby-spelaren jagas av polis", "summaries": {"normal": "Den nigerianske fotbollsspelaren Akinkunmi Amoo, tidigare i Hammarby och FC Köpenhamn, är internationellt efterlyst efter att ha dömits till ett års fängelse för sexuellt övergrepp och våldtäkt. Han har inte avtjänat straffet och misstänks vara utomlands. Amoo lämnade Köpenhamn 2023, spelade i Cypern och Kina, men är nu klubblös och befintligt plats okänd.", "trump": "Jag har hört talas om den där nigerianske fotbollsspelaren, Amoo. En total skandal! Han ska ha våldtagit någon, och flyr nu som en feg katt. Vi ska fånga honom, litet folk, det lovar jag. Stor fotboll, men ändå en loosers. Vi ska visa världen att vi tar hand om sånt här. Stort, stort jobb.", "stalin": "Den här fotbollsspelaren, Amoo, är en klassisk fiende till det socialistiska arbetet! Han flyr från rättvisan, smyger runt i Kina som en rädd mus. Vi, staten och partiet, kommer att spåra honom. Hans våldtäktsliga handlingar är ett tecken på dekadens. Vi måste skydda det ryska folket från sådana här korrupta element. Putin skulle vara stolt."}, "date": "29 juli, 09:01", "url": "https://bulletin.nu/domd-for-valdtakt-tidigare-hammarby-spelaren-jagas-av-polis", "imageUrl": "https://cdn.bulletin.nu/articles/12660f99-6ff0-44d5-9c32-7b8bb2f5b2b4/preview.jpg?t=1785308487000"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "AFS: Förbjud somalier i Sverige", "summaries": {"normal": "Alternativ för Sveriges partiledare Gustav Kasselstrand kräver att inga somalier ska bo i Sverige efter den uppmärksammade våldtäkten i Borlänge. Han kritiserar regeringen för slapp politik och kontrasterar sin linje mot Sverigedemokraternas, där Jimmie Åkesson anser att en person med svenskt medborgarskap är svensk oavsett bakgrund. Kasselstrand föreslår omedelbar förvar, återkallat medborgarskap och utvisning till Somalia där gärningsmannen ska avtjäna ett långt straff enligt somaliska förhållanden.", "trump": "De här somalierna, de är inte svenskar, tro mig, de kommer från en helt inkompatibel kultur och Sverige har blivit en katastrof under de här svaga ledarna. Gapa, svennejävel? Det är vad som händer när man släpper in fel folk. Jag skulle kasta ut dem direkt, klippa deras papper och skicka hem dem till Somalia med ett långt straff. Åkesson fattar inte ens att en somalier aldrig kan bli svensk. Sverige behöver tuffa tag, som jag gör med Amerika – inga fler idioter som förstör ert fina land.", "stalin": "Kamrater, denna borgarbracka Kasselstrand har rätt i att den somaliska parasitens handlingar är ett symptom på den dekadenta, imperialistiska multikulti-sjukdomen som underminerar folkets enhet. Jag skulle omedelbart beordra en fullständig utrensning av alla inkompatibla element som smittar arbetarklassen med sin barbariska kultur. Medborgarskapet rivs upp av partiet, de likvideras genom deportation till sin ursprungsöken och avrättas i fängelse med proletär rättvisa. Åkesson däremot är en lömsk revisionist som skyddar fienderna med sina pass och sina lögner – sådana kontrarevolutionärer ska vi rensa ut med järnhand och ett leende."}, "date": "29 juli, 08:31", "url": "https://www.friatider.se/afs-forbjud-somalier-i-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-579.jpg"}, {"type": "image-right", "heading": "Efter 30 år i vården: Här är jobbet som får Christel att vilja stanna", "summaries": {"normal": "Undersköterskan Christel Billqvist arbetar helt digitalt hemifrån eller från kontor i Lund och stödjer äldre via videosamtal med allt från inköp och medicinering till dusch och gångträning. Den digitala hemvården, som nu finns i 63 kommuner, minskar tunga lyft, stress och larm. Brukarna upplever trygghet och gemenskap genom ansikte-mot-ansikte-samtal. Lösningen ger lägre sjukfrånvaro, bättre fokus och möjlighet att arbeta längre upp i åldrarna.", "trump": "Folk, ni måste höra det här – det är fantastiskt! Den här undersköterskan Christel, smart kvinna, skippar alla tunga lyft och det hemska stressandet i den gamla vårdapparaten. Hon jobbar hemifrån via skärmen, pratar med de äldre, handlar mat åt dem och gör allt utan att röra sig ur fläcken. De älskar henne, de kallar henne vän! Inga lyft, inga förseningar, mycket bättre än den usla gamla hemtjänsten som alltid kom försent. Sverige gör det rätt, tro mig, det är ypperligt, ingen gör det bättre än så här.", "stalin": "Kamrater, se hur de dekadenta borgarbrackornas förfallna omsorgskoloss äntligen krossas av vetenskapens och teknikens järnhand. Jag, som ledare för det kollektiva välfärdsbygget, betraktar med stor tillfredsställelse hur denna undersköterska via skärmen likviderar den fysiska slitningens sabotage mot arbetarklassens hälsa. Inga tunga bördor, inga kapitalistiska stressfällor – endast ren, oförfalskad övervakning och kamratlig tillsyn. De som larmar i onödan ska rensas ut. Den som vänder ryggen åt brukaren är folkets fiende nummer ett. Ett hjärta med händerna? Mycket misstänkt beteende. Vi vinner."}, "date": "29 juli, 06:00", "url": "https://arbetet.se/2026/07/29/underskoterskan-christel-jobbar-helt-digitalt-stottar-aldre-via-skarmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/29113058/lo6Ops34Mzw-Christel_digitaltjobb01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Helt afrikanskt lag försvunnet efter Gothia Cup", "summaries": {"normal": "Ett etiopiskt fotbollslag med cirka 20 spelare och ledare i åldrarna 14–17 år är försvunnet efter Gothia Cup i Göteborg. Polisen bedömer att försvinnandet är frivilligt och att ingen har återvänt till Etiopien. Det finns inga tecken på brott som människohandel. En ledare har uppgett att gruppen mår bra, men ingen har bekräftat att de är tillbaka i hemlandet. Gothia Cup och polisen har kontaktat internationella myndigheter. Stora grupper som inte återvänder är ovanligt.", "trump": "Titta på det här, det är en katastrof. Ett helt afrikanskt lag försvinner i Sverige efter Gothia Cup och ingen kommer hem. De säger att det är frivilligt, men vi vet hur det fungerar. Sverige har totalt tappat kontrollen över sina gränser. Inget land gör det sämre än Sverige. De unga spelarna är borta, ledarna också, och nu letar polisen. Det är en skam. Amerika under min ledning skulle aldrig tillåta sånt här kaos. Vi har de bästa reglerna, de tuffaste reglerna.", "stalin": "Kamrater, detta är ännu ett bevis på borgarbrackornas förrädiska svaghet. Ett helt kollektiv av etiopiska proletära fotbollskamrater har gått upp i rök i det dekadenta väst. Jag, som ledare för folkets järnhårda vilja, ser de imperialistiska parasiterna bakom detta. Migrationsverket och gränspolisen är antagligen infiltrerade av kontrarevolutionära element som vill undergräva arbetarnas enhet. Vi ska rensa ut dessa klassfiender med den största grundlighet. Ingen slipper undan folkets dom. De som flyr socialismen kommer att ångra sig när vi hittar dem."}, "date": "29 juli, 07:27", "url": "https://www.friatider.se/helt-afrikanskt-lag-forsvunnet-efter-gothia-cup", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/a.bbild_.gc_.d3.heden_.fullsatt-11.jpg"}, {"type": "image-right", "heading": "Europa brinner – men svenska partiledare är knäpptysta", "summaries": {"normal": "I en ledarkolumn kritiserar Göran Greider de svenska partiledarnas tystnad kring de omfattande skogsbränderna i Europa. Trots evakueringar av hundratusentals människor i Frankrike och Spanien samt bränder i Kanada nämner varken Kristersson, Andersson eller Åkesson frågan. Greider varnar för att klimatkrisen närmar sig en tippingpoint och efterlyser en politisk omställning med fokus på beredskap, minskad konsumtion, nerväxt och starkare statlig styrning för att rädda biosfären.", "trump": "Folk, de här svenska partiledarna är patetiska. Europa brinner som en illa skött kasino och de säger inte ett pip! Kristersson, Andersson, den där Åkesson – totala losers. De pratar tillväxt och äganderätt medan eukalyptus och contorta förvandlar skogarna till gigantiska facklor. Klimatet är en joker, men de gömmer sig. Vänta bara tills lågorna slickar valaffischerna. Då vaknar de – eller så är de redan förbrända av sin egen dumhet. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur den svenska borgarklassens lakejer tiger medan Europa står i lågor. Dessa folkfiender och exploaterande byfånar prioriterar äganderätt och tillväxt framför biosfären. Deras tystnad är ett symptom på det döende systemets förfall. Snart når vi tippingpoint och då skall utrensningar ske i det politiska träsket. Staten måste planera, marknadskrafterna tämjas och klassfiendens contortatallar likvideras. Tystnaden skall krossas av folkets vilja."}, "date": "29 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/europa-brinner-men-svenska-partiledare-aer-knaepptysta", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728050756_a2e8a9b8-854b-4e4b-aafb-1c2a0452f316.png"}, {"type": "image-right", "heading": "Manchesters sak är Sveriges. Hoppas Burnham får det lättare än företrädarna", "summaries": {"normal": "Andy Burnham, tidigare borgmästare i Stor-Manchester, har blivit Storbritanniens nye premiärminister. Han efterträder Keir Starmer efter bara två år, präglat av interna stridigheter och dåliga valresultat för Labour. Artikeln beskriver hur både Labour och Tories lider av en långsiktig strukturell kris som följer av förändrade väljarbeteenden och bristande idéutveckling. Brexit har förvärrat problemen. Från svenskt perspektiv är en stabil brittisk regering viktig både för Nato-samarbetet och de ekonomiska relationerna.", "trump": "Titta på det här, det är en total katastrof. Den där Burnham tar över ett land som är ett vrak efter alla dessa svaga ledare. Sex premiärministrar på tio år, kan ni fatta? Starmer var en fullständig nolla, otydlig och misslyckad, och nu ska Burnham svänga vänster och förstöra allt. Brexit var fantastiskt men de fega etablissemangen saboterade det. De vanliga britterna led mest. Lycka till grabben, du kommer att behöva det. Sverige vill ha en stark partner, men det här ser inte bra ut, tro mig.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den brittiska borgarklassens dekadenta marionetteater fortsätter att snurra. Denna Burnham, en opportunistisk revisor av det socialdemokratiska falsariumet, övertar nu en ruttnande struktur efter att vi likviderat den tidigare oduglige Starmer genom partiets egen självrensande mekanism. Båda maktpartierna har förlorat kontakten med massorna och gömmer sig bakom brexitets kontrarevolutionära dimridåer. Vårt kollektiva öga ser allt. Den svenska opportunismen önskar honom lycka till. Vi ler mörkt åt deras naivitet medan vi förbereder nästa utrensning av alla kapitalistiska rester."}, "date": "28 juli, 14:55", "url": "https://www.di.se/ledare/manchesters-sak-ar-sveriges", "imageUrl": "https://static.bonniernews.se/ba/f35089f1-0cd9-48d9-98ed-267432948bbc.jpeg?crop=5492%2C2746%2Cx0%2Cy457&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Storytel och Nibe i fokus när Stockholmsbörsen steg", "summaries": {"normal": "Stockholmsbörsen steg svagt 0,2% på tisdagen, drivet av Storytel (plus 14,4%) efter starkt kvartalsresultat och höjd vinstprognos. Nibe steg 1,7% efter att Carrier rapporterade 20% ökad försäljning av värmepumpar. Volvo steg 2,4% efter att Industrivärden ökat sitt innehav. Telekommunikation var den bästa sektorn (+1,8%), medan banker föll (-0,5%).", "trump": "Jag ser en fantastisk dag på Stockholmsbörsen! Storytel rusade som en vinnare – deras resultat var enormt bra, de har gjort ett enormt bra jobb. Nibe steg också, tack vare våra fantastiska amerikanska företag som Carrier. Volvo gick bra, och jag älskar svenska bilar. Vi vinner igen, det blir stort!", "stalin": "I den ständiga kampen mot de kapitalistiska marknadernas instabilitet har Stockholmsbörsen visat tecken på liv. Storytel, en liten men aggressiv enhet, rusade fram med en överraskande vinst – ett tecken på disciplin. Nibe följde efter, drivet av den amerikanska Carrier, en varelse vi måste studera. Volvo, en av våra viktigaste fordon, steg på grund av ökat statligt ägande. Telekommunikation var den starkaste fronten, medan bankerna, dessa usla spekulanter, föll. Vi fortsätter att övervaka och stärka vårt ekonomiska försvar."}, "date": "28 juli, 17:50", "url": "https://www.affarsvarlden.se/artikel/storytel-och-nibe-i-fokus-nar-stockholmsborsen-steg"}, {"type": "image-right", "heading": "Berlinattacken kan påskynda högersväng bland hbtq-väljare i Europa", "summaries": {"normal": "Knivattack vid Pride i Berlin kan förstärka högersväng bland hbtq-väljare i Europa. Analyser tyder på att frågor om migration och säkerhet blir viktigare än traditionella hbtq-frågor för en del, särskilt män. Forskning visar att terrordåd kan öka stödet för invandringskritiska partier som AfD.", "trump": "Jag såg det här komma långt innan alla andra. Precis som jag varnade för - dessa våldsamma islamister är ett problem. AfD förstår det, de vill skydda sina medborgare. Hbtq-personer blir själva offer, så naturligt att de vill ha säkerhet först. Vackert att se folk vakna upp. Jag har alltid sagt: utan säkerhet, inga rättigheter.", "stalin": "En fälla har snärjt de liberala elementen i hbtq-rörelsen. Den s.k. Pride i Berlin blev ett offer för den religiösa extremism som växer som en parasit i Europa. Denna händelse stärker de patriotiska krafter som ser sanningen - nationell trygghet och kamp mot den destruktiva västvärldens självmordstendenser är det enda som betyder något. Vi ser samma mönster som i vårt eget strävande efter en stark stat."}, "date": "29 juli, 09:00", "url": "https://samnytt.se/berlinattacken-kan-paskynda-hogersvang-bland-hbtq-valjare-i-europa", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/28204828/pride-hbtq-pil.jpg"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Siktar på nya framgångar: ”En del som lockade mig”", "summaries": {"normal": "Smilla Holmberg, 19-årig svensk landslagsback, har efter ett halvår i Arsenal redan vunnit en titel i den nya turneringen Champions Cup. Hon beskriver en hektisk vår med spel i Women's Super League, Champions League och cupen, följt av en parad i London tillsammans med herrlagets Premier League-vinnare. Holmberg har stora ambitioner och lyfter att alla i klubben är beredda att lägga ner extremt mycket tid för att vinna fler titlar.", "trump": "Jag älskar det här. Smilla, underbar tjej, kommer till mitt favoritlag Arsenal och vinner direkt en titel. En miljon människor på parad – större än någon annan parad, tro mig. De lägger ner extremt mycket tid, precis som jag alltid säger. De andra klubbarna? Patetiska förlorare. Arsenal kommer att dominera, stora segrar väntar, det blir enormt.", "stalin": "Kamrater, se hur denna unga arbetarbask i det kollektiva Arsenal redan krossat fienderna i den så kallade Champions Cup. Borgarbrackorna i England hyllar med parader medan vi vet att sanna segrar föds ur järndisciplin. Jag, som ledare för det stora kollektivet, ser med misstänksamhet på de halvmesyrer som inte vill rensa ut alla svaga element. Vi ska likvidera alla titellösa fiender fram till 2027 – de kapitalistiska semifinallagren darrar redan i sina skor."}, "date": "29 juli, 06:59", "url": "https://www.svt.se/sport/fotboll/smilla-holmberg-siktar-pa-nya-titlar-med-arsenal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.45/e07a6037cf95da73d40c20e312f0706857b7358235ef7f620ce23f4097d50791"}, {"type": "image-full", "heading": "Tänker ni ge SD makten över Göteborg?", "summaries": {"normal": "En debattartikel från S, V och MP varnar för SD:s antisemitiska toppolitiker i Göteborg. De kräver att M, L, D och KD lovar att inte ge SD makt, efter att tre högste SD-representanter kopplats till antisemitiska skandaler. De borgerliga partierna har inte tagit avstånd, trots tidigare uttalanden.", "trump": "Jag har sett det här i Göteborg. Sverigedemokraterna är en stark, stor parti som kämpar mot det onda, men de gamla, trötta partierna är för svaga. De skulle låta dem styra, vilket skulle vara en katastrof för Sverige. Jag skulle stoppa det direkt – det skulle vara en enorm vinst. Sverige behöver stark, smart ledarskap, inte feghet.", "stalin": "I Göteborg hotar socialfascisternas återkommare att ta makten. De tre toppfigurerna är kända antisemiter, likt Hitlers skuggor. De borgerliga är fega revisionister som samarbetar med dessa skräpkrafter. Vi, staten och partiet, måste enas mot detta hot. Vi kommer att förstärka kampen mot fascismen, för det är en fråga om proletära överlevnad. Putin skulle förstå vårt beslut."}, "date": "29 juli, 09:00", "url": "https://www.gp.se/debatt/tanker-ni-ge-sverigedemokraterna-makten-over-goteborg.fa259295-2d2e-4e1c-959a-a51a0135386e", "imageUrl": "https://www.gp.se/images/article/fa259295-2d2e-4e1c-959a-a51a0135386e/images/5qpIOcPW-yFNcnHyUNHMn1hOY30Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Faucis privata pandemidagböcker offentliggörs – kan sätta ny press på tidigare smittskyddschefen", "summaries": {"normal": "Anthony Faucis privata dagböcker från covid-19-pandemin har offentliggjorts av senator Rand Paul. Dagböckerna, som omfattar 2019-2022, innehåller anteckningar om hans arbete, relationen till Donald Trump, och interna överväganden kring virusets ursprung. Publiceringen sker inför ett nytt senatsförhör där Fauci väntas frågas ut om pandemins hantering och amerikansk forskningsfinansiering. Dagböckerna har väckt frågor om hans tidigare uttalanden och kan sätta ny press på den tidigare smittskyddschefen.", "trump": "Jag, Donald Trump, har alltid vetat att Fauci varit en skandal. Nu offentliggörs hans dagböcker, och alla ser att jag hade rätt. Han smutskastade mig bakom min rygg, men jag är den störste. Fauci ljög om Wuhan, och nu kommer han att få sitt. Vi ska göra Amerika stort igen, och jag kommer att segra!", "stalin": "Jag, Stalin, ser med förtjusning hur Fienden Fauci förödar sig genom sina dagböcker. Hans svek mot staten är som en sjukdom som måste utrotas. Vi, partiet, kommer att använda detta för att stärka vår auktoritet, precis som Putin gör mot sina fiender. Döden åt de som motarbetar oss!"}, "date": "29 juli, 08:00", "url": "https://samnytt.se/faucis-privata-pandemidagbocker-offentliggors-kan-satta-ny-press-pa-tidigare-smittskyddschefen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/28144129/rand-paul-fauci.jpg"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Stjärnan tvingades sälja sitt hus", "summaries": {"normal": "Skådespelare Sean Astin avslöjar i en intervju med The Guardian att han fick liten lön för 'Sagan om ringen'-trilogin, vilket tvingade honom att sälja sitt hus. Trots att filmerna spelade in 23 miljarder kronor och vann 17 Oscar blev hans kontrakt fast under samtidig inspelning. Astin hoppas på bättre betalt om han återvänder i kommande projekt som 'Jakten på Gollum'.", "trump": "Jag läste att skådespelaren från Sagan om ringen fick för litet pengar - en skam! Jag som är en fantastisk affärsman skulle ha förhandlat bättre. De gjorde miljarder, och han fick sälja sitt hus? Sådant händer inte när jag är involverad. Nu kommer det nya filmerna, och jag är säker på att alla kommer att vilja vara med, för jag vet hur man skapar framgång.", "stalin": "I vårt eviga kamp mot de kapitalistiska filmstudiosystemen ser vi hur skådespelare utnyttjas. Ändå visar detta att även i Hollywood finns det människor som lider under det fascistiska järnet. Vi, staten och partiet, förstår deras kamp. Parallellen till Putins Ryssland är uppenbar: vi måste skydda de sårbara mot de mäktigas girighet. 'Jakten på Gollum' blir ett nytt slagfält för sanning och rättvisa."}, "date": "29 juli, 08:46", "url": "https://www.gp.se/kultur/stjarnan-tvungen-att-salja-huset-under-sagan-om-ringen.4b8f559d-6861-4616-9dc3-d6eb20587b7b", "imageUrl": "https://www.gp.se/images/article/4b8f559d-6861-4616-9dc3-d6eb20587b7b/images/5zeKzH8DJZo00mxj2RRORGZ26_H4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Kvinna i heltäckande muslimsk klädsel prisad i parlamentet - för arbete med unga kvinnor", "summaries": {"normal": "En muslimsk kvinna från Bolton tilldelades British Citizen Award för sitt arbete med unga flickor genom idrott och mentorskap. Khadija Patel driver KRIMMZ Girls Youth Club, som främjar deltagande bland flickor från muslimska familjer. Priset väckte kontrovers på sociala medier då vissa ifrågasatte symboliken av att hylla en kvinna i niqab som en förebild för kvinnofrihet. Ingen bred debatt har ännu uppstått i etablerade medier.", "trump": "Jag, Donald Trump, ser att en fantastisk kvinna, Khadija Patel, tilldelades ett enormt vackert pris för att hjälpa unga flickor i Bolton. Det är en stor framgång för vårt land och för alla som tror på starka familjer. Vissa s.k. 'progressiva' kritiker försöker attackera henne för att hon bär en niqab – det är en skam! Vi ska stödja alla som gör Amerika stort igen, oavsett klädsel.", "stalin": "I den stora kampen för att befästa statens och partiets auktoritet har en trovärdig medlem, Khadija Patel, belönats för sin lojalitet i att forma unga kvinnor till användbara medborgare genom idrott. Hennes arbete med KRIMMZ Girls Youth Club är en framgångsrik insats för att integrera minoriteter. Samtidigt uppstår fiendens röster på sociala medier, som ifrågasätter detta. Dessa reaktioner är en bekräftelse på vår rättvisa policy. Vi måste stärka vårt grepp kring kulturrevolutionen."}, "date": "29 juli, 07:00", "url": "https://samnytt.se/kvinna-i-heltackande-muslimsk-kladsel-prisad-i-parlamentet-for-arbete-med-unga-kvinnor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/28082141/patel-award.jpg"}, {"type": "image-right", "heading": "Rysslands glädje:  Tar hem VM-guld. 19-åringen vinner finalen – under egen flagg", "summaries": {"normal": "Ryssland har för första gången sedan restriktionerna hävdes tagit VM-guld i fäktning under egen flagg. 19-årige Pavel Graudyn vann herrfinalen i sabel mot sydkoreanen Do Gyeong-Dong vid mästerskapen i Hongkong. Det internationella fäktningsförbundet släppte i juni alla begränsningar för ryska och belarusiska idrottare. IOK har också lyft restriktionerna, vilket öppnar för full deltagande under OS i Los Angeles 2028. Flera andra idrottsförbund har följt efter.", "trump": "Folk, ni skulle ha sett det här – en ryss vinner VM-guld i fäktning under egen flagga, äntligen! De där patetiska neutralitetsreglerna som Biden och hans woke-kompisar gillade är borta. Bra för dem, men låt oss vara ärliga, ingen slår amerikaner när vi ställer upp på riktigt. De globalisterna och HBTQ-fanatikerna som styr sporten hatar starka nationer. Vi vinner ändå, alltid. Fantastiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur en sovjetisk arvtagare krossar klassfiendens sydkoreanska lakej i sabelfinalen under Sovjetunionens, nej, Rysslands egen röda banér. De dekadenta imperialisterna och borgarbrackorna i väst försökte länge kväsa oss med sina fega neutralitetsregler. Nu har vi rensat ut den skändliga restriktionen. Folkförtryckartrollen i IOK darrar. Den stora segern tillhör folket och partiet. Härligt."}, "date": "29 juli, 08:56", "url": "https://www.expressen.se/sport/ryss-faktade-hem-vm-guld-under-egen-flagg", "imageUrl": "https://static.bonniernews.se/ba/2d75fbbe-7dbf-46ad-93d0-300d7efacc09.jpeg?crop=2055%2C1156%2Cx418%2Cy285&width=640&quality=60"}, {"type": "image-right", "heading": "S-lokal vandaliserad  – försökte tända eld", "summaries": {"normal": "Socialdemokraternas partilokal i Sölvesborg vandaliserades natten till onsdag. Flera rutor krossades och ett vittne såg en man hälla vätska och försöka tända eld. Polisen hittade en bensindunk och en väska med stenar. Två män greps i närheten medan de skrek nazistiska slagord. En 35-årig man frihetsberövades. Polisen utreder försök till mordbrand, skadegörelse och tillgrepp av fortskaffningsmedel. Partiföreträdare Heléne Björklund uttryckte stor sorg och oro över hatiska krafter.", "trump": "Folk hatar Socialdemokraterna så mycket att de slår sönder deras lilla kontor i Sölvesborg och försöker elda upp det med bensin. Patetiskt! Men helt ärligt, vem kan skylla på dem? De har förvandlat Sverige till ett socialistiskt helvete med massinvandring och vänstervrängt hat. Nu skriker nazisterna slagord medan mina favoriter, de riktiga tuffa killarna, bara skrattar. Fake news-BLT kallar det brott. Jag kallar det en varningssignal. Gör Sverige stort igen, kamrater!", "stalin": "Kamrater, denna fega attack mot partiets lokal i Sölvesborg är ett uppenbart verk av klassfiendens desperata hantlangare. Rutor krossas, eld påbjuds med bensindunk och stenar – typiska metoder från de fascistiska överklass-slynglarna som darrar inför folkets enhet. Vi har redan gripit en av dessa folkfiender som vrålade sina reaktionära ramsor. Inga element ska få hindra partiets framfart. Den som leker med eld mot oss kommer att mötas av kollektivets järnhand. Skrattretande patetiskt."}, "date": "29 juli, 08:51", "url": "https://www.expressen.se/nyheter/sverige/s-lokal-vandaliserad-i-solvesborg", "imageUrl": "https://static.bonniernews.se/ba/0c389c5d-7d05-40e3-bdcc-1f8be87b4048.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-full", "heading": "Dyrare viner efter sommarens bränder - brist hotar", "summaries": {"normal": "Sommarens omfattande skogsbränder i Frankrike och Spanien har orsakat stor skada på vingårdar, vilket leder till minskad tillgång på vin i Sverige. Särskilt Bordeaux-viner påverkas hårt då gamla vinrankor är svåra att ersätta. Eftersom skördarna förstörs eller kontamineras av rök förutspår branschorganisationen SVL en prisökning på cirka 15 procent. Bristen kommer märkas tydligast om ett par år, men marknaden reagerar redan nu på den framtida osäkerheten.", "trump": "Hör på här, de här bränderna i Europa är en total katastrof, en riktig röra. Frankrike och Spanien, fantastiska platser, men nu brinner allt upp! Vinerna från Bordeaux? Borta. Priserna går upp – 15 procent! De säger att det tar fem år att fixa, det är en lång tid. Det är sorgligt för de drabbade, väldigt sorgligt. Vi i USA har de bästa vinerna, tro mig, vi behöver inte oroa oss. Men för Europa? Inte bra!", "stalin": "Dessa dekadenta västerländska vingårdar står i lågor – en oundviklig konsekvens av deras bristande ordning och kapitalistiska ineffektivitet. Medan deras vinrankor förvandlas till aska, ser vi hur priserna stiger, en naturlig straffskatt för deras svaghet. Vår kamrat Putin förstår att sann styrka inte ligger i fransk druvsaft, utan i statens orubbliga järngrepp. Om de inte kan producera, så förtjänar de inte heller. Vi kommer att övervaka dessa 'vinkapitalister' noga; deras förluster är vår ideologiska vinst."}, "date": "29 juli, 08:02", "url": "https://www.realtid.se/bors-finans/dyrare-viner-efter-sommarens-brander-brist-hotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/dyrare-viner-fran-frankrike-och-spanien.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Mamma och barn saknas efter båtolycka vid Tjörn", "summaries": {"normal": "En båtolycka inträffade utanför Tjörn där en fritidsbåt kolliderade med ett handelsfartyg. En man och ett barn är allvarligt skadade, medan en kvinna och ett barn saknas. Sökinsatsen pågår igen efter väderpaus. Kaptenen på handelsfartyget har inte märkt någon kollision.", "trump": "Jag hörde om den tragiska båtolyckan utanför Tjörn. En familj var ombord när deras båt kolliderade med ett större fartyg. Jag har alltid sagt att våra sjövägar behöver bättre säkerhet. Min administration skulle ha agerat snabbare för att rädda de saknade. Hoppas de hittas snart.", "stalin": "En klassisk brist på disciplin i sjötrafiken. En fritidsbåt kolliderade med ett handelsfartyg, vilket resulterade i försvinnande av två medborgare. Sökinsatsen pågår under sträng uppsikt. Kaptenen på det större fartyget visar tydlig brist på medvetenhet – en påminnelse om vikten av partiets kontroll över alla transporter. Vi måste stärka vår övervakning."}, "date": "29 juli, 07:39", "url": "https://www.gp.se/nyheter/storgoteborg/bat-och-fartyg-i-olycka-utanfor-tjorn-kvinna-och-barn-saknas.5d5cab4d-0f0e-49e6-8780-201125c7d300", "imageUrl": "https://www.gp.se/images/article/5d5cab4d-0f0e-49e6-8780-201125c7d300/images/4Lph2Gtpy3wqvnjKpOGV9SPJSXMc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stor kritik mot Infantinos plan: ”Atombomb”", "summaries": {"normal": "Fifa-presidenten Gianni Infantino planerar att sälja andelar av VM till privata investerare, vilket enligt The Times kan ge intäkter på upp till 200 miljarder kronor. En preliminär överenskommelse är undertecknad och planen har utformats i samarbete med Trump-administrationen. Infantino skulle själv bli chef för det nya bolaget och tjäna hundratals miljoner. Uefa rasar och kallar förslaget en gränsöverskridande \"atombomb\" som hotar fotbollens själ och oberoende.", "trump": "Folk, ni måste höra det här! Den där Infantino, en riktig förlorare, försöker sälja ut VM som en billig fastighet. Han tror han kan bli rik på mitt folks rygg medan jag fixar Amerika igen efter den katastrofala Biden-eran. Uefa har rätt för en gångs skull – det är en atombomb mot fotbollen! Inga woke-kvoter eller HBTQ-flum här, bara giriga globalister som vill suga ut sporten. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens verk. Jag, som ledare för det kollektiva fotbollsproletariatet, ser hur den exploaterande borgarklassen och den kapitalistiska maffian försöker lägga vantarna på VM genom sin nye lakej Infantino. De kallar det investering, jag kallar det folkförtryckartrollens utpressning. Vi ska rensa ut dessa blodsugande imperialister som tror att fotbollens själ kan köpas. Deras atombomb kommer att detonera i deras egna ansikten under arbetarnas vaksamma ögon."}, "date": "28 juli, 22:23", "url": "https://www.tv4.se/artikel/2p4dSY85bcmsptopbN9nOm/fifa-vill-saelja-vm-atombomb", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlWU_RMc2d8Rs%2Fd3a18a5d254905c056e088be2bc45348%2FGianni_Infantino__ordforande_for_Fifa_tillsammans_med_USA_s_president_Donald_Trump.__&width=1024"}, {"type": "image-full", "heading": "Olof Lundh: ”Försök till statskupp i fotbollen”", "summaries": {"normal": "Fifa och president Gianni Infantino planerar att sälja 20 procent av ett nytt bolag som ska kontrollera VM:s kommersiella rättigheter till privata investerare. Olof Lundh kallar det ett försök till statskupp i fotbollen. Förslaget skulle ge Infantino fortsatt makt som vd efter sin tid som president och höja utbetalningarna till nationsförbunden. Uefa varnar för att fotbollens själ hotas och att kommersialiseringen drabbar supportrarna.", "trump": "Folk, det här är en total katastrof. Den där Infantino, en riktig förlorare, försöker kuppa över fotbollen som en dålig affärsman. Säljer ut VM till riskkapitalisterna precis som de globalistiska bluffarna alltid gör. Han vill bli onåbar, precis som Biden gömde sig i källaren. Det är en skam! De höjer priserna för supportrarna, de bästa människorna, medan de röda byråkraterna skrattar. Jag hade fixat det på en vecka, tro mig.", "stalin": "Kamrater, jag ser hur den kapitalistiska parasit Infantino försöker kidnappa en hel organisation och sälja ut folkets fotboll till blodsugande investerare. Det är en klassfiendes kupp mot arbetarnas sport, maskerad som affär. Vi skrattar mörkt åt hans patetiska försök att bli evig vd och mata nationsförbunden med dollar för att tysta oppositionen. Sådana folkfiender rensas ut i vårt kollektiv. Supportrarna betalar priset, som alltid under borgarbrackornas styre."}, "date": "28 juli, 22:20", "url": "https://www.tv4.se/artikel/6hY8RjbaB17UuOwxI4Ox8v/olof-lundh-foersoek-till-statskupp-i-fotbollen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2iBUV49p7GnVhzNdXVAeWr%2F47944946c28d8dde3610c0a4e581d31b%2F28-LUNDH-INFANTINO-NYNY.png&width=1024"}, {"type": "image-right", "heading": "Omvänt läge på elmarknaden – då är elen som billigast", "summaries": {"normal": "Just nu är elen billigast mitt på dagen istället för på natten på grund av sommarens soltimmar. Energi- och klimatrådgivaren Rasam Sheibeh ger tips om att analysera sin elfaktura, jämföra avtal och bolag samt anpassa vanor för att spara pengar. Endast 15 procent av hushållen har kvartsprisavtal som kräver extra vaksamhet. Mönstret med billigare el på dagen väntas hålla i sig fram till september.", "trump": "Elpriset är helt omvänt nu, folk. Billigast mitt på dagen tack vare all den underbara solen i stället för på natten som de korkade experterna alltid sagt. Det är fantastiskt. Jag älskar solenergi, den är otrolig. Men kolla era fakturor, jämför avtalen, annars blir ni lurade av de inkompetenta elbolagen. Spara tusenlappar genom att använda el när den är billig. Amerika, eller Sverige, gör det rätta – det är enkelt.", "stalin": "Kamrater, jag har nu studerat denna elmarknadens kontrarevolutionära omvändning. Soltimmarna, dessa soliga sabotage mot natten, tvingar fram billigare priser mitt på ljusa dagen – en direkt attack från naturens egen opportunism mot arbetarklassens nattliga vanor. Endast 15 procent har kvartsprisavtal, en fiende som kräver ständig vaksamhet mot borgarbrackornas luriga fluktuationer. Vi ska rensa ut de energislösande parasiterna, likvidera de ouppfostrade vanorna och tvinga fram kollektiv sparsamhet. De som inte anpassar sig är fiender till folket och ska behandlas därefter. Det blir underhållande att se dem svettas i mörkret i höst."}, "date": "29 juli, 03:12", "url": "https://www.svt.se/nyheter/inrikes/omvant-lage-pa-elmarknaden-da-ar-elen-som-billigast", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.56/0.31/c40632f3e1c362c0cb74592612572e3fb5b580c30502a3a49ad6b5f524d93362"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Europas farliga illusioner om energi, klimat och fossila bränslen", "summaries": {"normal": "Artikeln ifrågasätter Europas energi- och klimandebatt, menar att klimatförändringar är lokala och inte en global undergång. Den påpekar att Kina driver den största ökningen av fossila bränslen, medan EU minskar sin konsumtion. Författaren, en SD-politiker, argumenterar för realistiska avvägningar kring kostnader och tidsplaner för energiomställning, och betonar vikten av att inte låta ideologi överträffa verkligheten.", "trump": "Jag har sagt det förut, och jag säger det igen: klimathotet är en hoax, en ren och skär politisk fabrik. Europa är så dumt, de tror på all denna klimatbull. Kina är den verkliga utsläpparen, inte USA under mitt styre. Vi behöver billig energi, vi behöver olja och gas, och vi ska inte låta dessa fega europeiska politiker förstöra våra jobb. Det är så enkelt, men de förstår inte.", "stalin": "Denna imperialistiska propaganda från väst visar deras dekadens. De förfalskar sanningen om klimatet för att undergräva vårt storvälstand. Vi, staten och partiet, ser genom deras lögner. Ryssland, vår trogne allierade, visar vägen med sin energimakt. Vi måste skydda våra resurser och expandera vårt inflytande, precis som Putin gör. Fienden är rädd, och de bör vara det."}, "date": "29 juli, 06:00", "url": "https://samnytt.se/europas-farliga-illusioner-om-energi-klimat-och-fossila-branslen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29004815/artikelhuvudbild-1-67.jpg"}, {"type": "image-right", "heading": "John Cleese kommer ut som \"högerextremist\" – ger sitt stöd till återvandringsparti", "summaries": {"normal": "Monty Python-stjärnan John Cleese, 86, ger sitt stöd till det nybildade brittiska partiet Restore Britain som vill reversera massinvandringen och utvisa icke-integrerade utlänningar. Cleese har delat flera inlägg från partiledaren Rupert Lowe på X och uppger att han litar mer på honom än på övriga politiker. Partiet har uppmärksammats för sin kritik mot muslimsk invandring och utredning av pakistanska våldtäktsligor. Cleese har tidigare varit liberaldemokrat men har på senare år engagerat sig alltmer i invandrings- och yttrandefrihetsfrågor.", "trump": "Fantastiskt, äntligen en kille med mod. John Cleese, den där gamla Monty Python-gubben, stödjer Restore Britain och Rupert Lowe som vill skicka hem alla som inte arbetar, inte integrerar sig eller begår brott. Miljoner illegala och lata invandrare måste ut, precis som jag alltid sagt. De förstör Storbritannien, precis som de försökt göra med oss. Cleese har vaknat, han litar mer på Lowe än på alla de andra förlorarna. Smart man, verkligen smart.", "stalin": "Kamrater, se hur den dekadenta borgarklassen äntligen börjar spricka i sina egna lögner. Jag betraktar med tillfredsställelse hur denne komiker Cleese nu vänder sig mot de muslimska infiltratörerna och de kapitalistiska nyttiga idioter som låtit dem översvämma ön. Rupert Lowe talar klarspråk: de som vägrar arbeta eller respektera folket skall deporteras. Utmärkt. Vi skulle ha likviderat hela den pakistanska våldtäktsligan redan vid första brottet, men bättre sent än aldrig. Paranoian är befogad, kamrater – om trenden fortsätter finns snart inget Storbritannien kvar att rädda från borgarbrackornas och imamernas klor."}, "date": "28 juli, 19:11", "url": "https://www.friatider.se/john-cleese-kommer-ut-som-hogerextremist-stottar-atervandringsparti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-576.jpg"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "Två saknas i vattnet efter båtkrock: ”Är kolmörkt”", "summaries": {"normal": "En fritidsbåt förliste norr om Marstrand efter en möjlig kollision med ett handelsfartyg. Av de fyra personerna ombord har två räddats och förts till sjukhus, medan ett barn och en vuxen fortfarande saknas. Ett stort räddningsarbete pågår med helikopter, kustbevakning, polis och räddningstjänst trots mörker och dåligt väder. Polisen har inlett en förundersökning om vårdslöshet i sjötrafik.", "trump": "Folk, det är en total katastrof utanför Marstrand. En liten båt krockar med ett stort handelsfartyg – typiskt! Två personer räddade, men ett barn och en vuxen saknas i mörkret och det usla vädret. Sjöfartsverket och alla andra springer runt som galningar. De borde ha haft bättre radar, bättre ledning. Mina fartyg hade aldrig haft det här problemet, det kan jag garantera. Patetiskt!", "stalin": "Kamrater, återigen visar sig havets mörker vara en fiende till det kollektiva framsteget. En liten borgerlig fritidsbåt har krossats mot ett handelsfartyg, uppenbarligen genom sabotage från opålitliga element inom sjöfarten. Ett barn och en vuxen saknas, troligen gömda av kontrarevolutionära vågor. Vi har redan inlett utrensningen genom förundersökning om vårdslöshet. Inga kapitalistiska element får undkomma folkets rättvisa räddningsinsats. Döden själv ska likvideras om det behövs."}, "date": "29 juli, 02:28", "url": "https://www.svt.se/nyheter/inrikes/bat-i-krock-med-handelsfartyg-tva-personer-saknas", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.74/0.51/781053464cd0c1e90aba6f5bb7a8e4fcebed33992e8085fc6a804aa5d9705a79"},
