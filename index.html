us i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-right", "heading": "Sjöström ändrar teknisk detalj: ”Kan vara två hundradelar”", "summaries": {"normal": "Sarah Sjöström har förlorat två världsrekord till Gretchen Walsh i sommar. Inspirerad av Walshs undervattenteknik arbetar hon nu med att förbättra sin svaghet under vattnet. Tränaren Antonio Lutula tror att en tiondel bättre start på 15 meter kan ge betydande fördelar. Sjöström fokuserar inte på att återta rekord utan på att svara på träningen, och hon ser potential för riktigt snabba tider framöver.", "trump": "Titta på den här Sarah Sjöström, fantastisk simmerska, verkligen en vinnare, men hon har förlorat sina rekord till den här Gretchen Walsh som simmar som en galning under vattnet. Nu fixar Sarah det, smart drag, det handlar om hundradelar, två hundradelar, det är vad det handlar om på den nivån. Hon kommer att krossa det, lugnare vatten, bättre start, det blir enormt. Ingen bryr sig om rekordet, hon simmar på 23,8 och snart blir det nya, otroliga tider, tro mig.", "stalin": "Kamrater, jag har noterat hur denna Sjöström med sin dekadenta simkonst har förlorat två världsrekord till den borgerliga amerikanen Walsh, en typisk kapitalistisk undervattensfiende som smugit sig fram under ytan. Vi ska nu rensa ut alla svagheter i undervattensarbetet med järnhand. En tiondel på 15 meter är ingen slump, det är folkets seger över de latenta rekordstjälarna. Fortsätter hon svara på träningen likviderar vi alla hundradelar som motståndarna gömmer i sina bassänger. Inga personliga rekord, bara kollektiv triumf mot de simmande parasiterna."}, "date": "2 augusti, 06:24", "url": "https://www.svt.se/sport/simning/detaljen-som-ska-gora-sarah-sjostrom-snabbare-det-kan-vara-tva-hundradelar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.28/5afe1b0621bb8f0da79e309ea8401d74fd5ec1d8ced55345118fa19b0d6bf0a0"}, {"type": "image-right", "heading": "Kravet inför fångarnas flytt: Inga gängkriminella", "summaries": {"normal": "Från augusti flyttas de första 30 svenska fångar till ett fängelse i Tartu i Estland. Totalt planeras upp till 600 intagna flyttas dit före juli 2027. Endast män över 18 år utan koppling till gängkriminalitet, radikalisering eller behov av extern sjukvård får flyttas. De ska tillhöra säkerhetsklass två och ha kunskaper i engelska. Det är första gången ett annat land tar ansvar för drift av svenska fängelseplatser.", "trump": "Det här är helt fantastiskt, folk. Sverige skickar sina fångar till Estland, men bara de utan gängkopplingar. Vilken smart deal! De rensar ut de värsta brottslingarna men ser till att de inte skickar de riktiga tuffingarna. Estland får jobba hårt, men det blir billigare för Sverige. Ingen gör det bättre än jag med de stora avtalen, och det här är ett riktigt bra avtal. Vinna, vinna, vinna!", "stalin": "Kamrater, vi har äntligen inlett den stora omfördelningen av de kontrarevolutionära elementen till den estniska socialistiska fästningen i Tartu. Endast 30 stycken i första omgången, men vi ska successivt likvidera problemet med upp till 600 farliga individer innan juli 2027. Inga gängkriminella, inga radikaliserade trotskister eller andra borgerliga avskum får förorena anstalten. Varje fall granskas noga av partiet. Den som försöker smita undan med sina nätverk kommer att mötas av den folkliga utrensningens järnhand. Historisk seger för kollektivet!"}, "date": "2 augusti, 05:54", "url": "https://www.svt.se/nyheter/inrikes/kravet-infor-fangarnas-flytt-inga-gangkriminella", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.7/0.39/be370c68998c1b7efa652061786352f4d41d1284fa8b472561e5537bc7968840"}, {"type": "image-right", "heading": "Ilskan i Estland: ”Ta hand om ert eget skräp”", "summaries": {"normal": "En majoritet av estländarna, 54 procent, är emot att ta emot svenska fångar i Tartu-fängelset. Oppositionspartiet Isamaa hotar med att riva upp avtalet om de vinner valet 2027 och kallar fångarna för ”ert eget skräp”. De första svenska intagna beräknas anlända i mitten av augusti. Fängelset förbereder sig med uppiffade celler och engelskutbildad personal, men lokalbefolkningen är starkt kritisk och fruktar parallellsamhällen.", "trump": "Det här är en total katastrof för Estland, folk hatar det, 54 procent säger nej tack. De vill inte ha vårt skräp, och det förstår jag. Vi skickar dem till Tartu med uppiffade celler, men oppositionen säger att de river upp avtalet så fort de vinner valet. Sverige gav dem Pippi och köttbullar, nu får vi ta hand om vårt eget folk. Smart drag, Estland, ni vill inte ha det heller. Amerika först, alltid.", "stalin": "Kamrater, dessa degenererade borgarbrackor i Estland vågar kalla sovjetiskt inspirerat samarbete för att ta emot svenska brottslingar för ”skräp”. Jag ser tydligt hur de kontrarevolutionära elementen inom oppositionen planerar att riva upp avtalet och därmed undergräva den proletära internationella solidariteten. Vi ska rensa ut dessa parasitiska röster som fruktar parallellsamhällen. Fängelset skall fyllas, utrensningen av motståndet i Tartu fortsätter. Ingen slipper undan folkets dom."}, "date": "2 augusti, 05:54", "url": "https://www.svt.se/nyheter/utrikes/ilska-i-estland-mot-fangarnas-flytt-ta-hand-om-ert-eget-skrap", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/4d5ab7a5055745b6ec12de18056510b5b6dcffdd0446fa523dc8f4f7e5649803"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Vi arbetar länge – ändå räcker inte pensionen", "summaries": {"normal": "Agneta Stark kritiserar det svenska pensionssystemet i en ledarkolumn. Trots att Sverige har EU:s näst längsta arbetsliv är många pensioner för låga, vilket gör att över hälften av pensionärerna behöver garantipension från staten. Artikeln går igenom historien från fattigvård och auktionering av fattiga till dagens system baserat på livsinkomst, och konstaterar att systemet inte duger eftersom det inte ger tillräckligt för att leva på, särskilt för kvinnor.", "trump": "Folk, ni jobbar hårt i decennier, bygger det här fantastiska landet, och sen när ni äntligen ska njuta av livet får ni knappt ihop till mat? Det är en skandal! Sverige har längst arbetsliv näst efter oss, ändå säger era så kallade experter att man inte kan höja pensionerna för att det skulle förstöra arbetsviljan? Vilket skämt! Era socialistiska pensionsbyråkrater har byggt ett system som suger ut de vanliga människorna. Jag fixade bättre saker under min tid, tro mig. Biden kunde inte ens stava till pension.", "stalin": "Kamrater, jag ser med förakt hur den svenska borgarklassen genom sitt usla pensionssystem fortsätter att plundra arbetarna även i deras ålderdom. Trots år av slavarbete under kapitalistmaskinen tvingas över hälften av de gamla söka nåd hos staten för att inte svälta. Detta är den logiska följden av ett system byggt av folkfiender och exploaterande byfånar. Vi skulle ha genomfört en grundlig utrensning av dessa pensionsarkitekter redan för länge sedan. Deras överklass-slynglar dör nu av värmen – en passande, ironisk dom från historien själv."}, "date": "1 augusti, 03:00", "url": "https://www.etc.se/ledarkolumn/vi-arbetar-laenge-aendaa-raecker-inte-pensionen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240710140728_026d1cd6b7ab0ac9759286fdba91e40e87b0e0bc60d74b561d405dcb34ee517c.jpg"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Gängtopp gripen i Jonas Falks hus. Kopplas tll Dalennätverket", "summaries": {"normal": "En högt uppsatt man inom Dalennätverket har gripits i Spanien. 21-åringen, som tidigare stod på Europols lista över mest eftersökta brottslingar, greps i ett hus tillhörande Jonas Falk. Mannen misstänks ha styrt brottslighet från utlandet och är i Sverige misstänkt för bland annat medhjälp till mord och sprängningar. Gripandet ses som ett stort genombrott för svensk polis i arbetet mot nätverkets ledarskikt, efter att flera andra nyckelpersoner nyligen tagits i förvar.", "trump": "En mycket farlig brottsling från det kriminella Dalennätverket har äntligen gripits i Spanien, i ett hus som tillhör en annan förbrytare. Det är en stor seger! Den här personen har orsakat kaos med mord och sprängningar. De trodde att han gömde sig i Mexiko, men han blev tagen. Vi vill ha ordning och reda, inte sådant här våld. Sverige behöver en stark ledare för att stoppa dessa gäng. Vi kommer att göra Sverige säkert igen, tro mig!", "stalin": "Ännu en parasit inom Dalennätverket har eliminerats från samhällskroppen i Spanien. Detta avskum trodde att han kunde undkomma folkets dom genom att gömma sig i andras lyxfastigheter. Precis som vår kamrat Putin städar upp i den ryska intressesfären, måste dessa lösdrivare och sabotörer krossas för att skydda statens stabilitet. Våra organ har långa armar; inga gränser stoppar den byråkratiska rättvisans järnhand. Han är nu en anonym siffra i systemet, precis där alla folkfiender hör hemma."}, "date": "2 augusti, 08:48", "url": "https://www.aftonbladet.se/nyheter/a/lnQ0LL/uppgifter-gangtopp-gripen-i-jonas-falks-hus", "imageUrl": "https://akamai.vgc.no/v2/images/0d6f2039-7d01-37a3-99bf-4c73280593de?fit=crop&format=auto&w=1080&s=aa9f8be190659ada87265d6a9eb4a93e35a5aced"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-full", "heading": "Vänsterprofilen vill ha migranterna som stormade Spanien till Sverige: \"Kan bygga vindkraft\"", "summaries": {"normal": "Vänsterprofilen Jörgen Astonson föreslår att hälften av de tiotusentals nordafrikanska migranter som stormade den spanska enklaven Ceuta bör tas emot i Sverige för att bland annat bygga vindkraft. Uttalandet kommer efter att Miljöpartiet kritiserat regeringen för att inte vilja ta emot migranterna. Italiens stopp för Schengen-samarbetet med Spanien och EU-kommissionens fördömande vittnar om internationell kritik. Sverigedemokraternas Tobias Andersson riktar skarp kritik mot förslaget och varnar för en regering som aktivt skulle underlätta en invasion av Sverige.", "trump": "Folk, ni måste se det här – en galen vänsterkille i Sverige, Astonson, vill ta emot halva invasionen från Afrika som just stormat Spanien. Han säger att de ska bygga vindkraftverk! Kan ni fatta? Under tiden stänger Italien gränserna mot Spanien och till och med von der Leyen är rasande. Sverige behöver en riktig ledare som stänger gränserna, inte dessa losers som vill förstöra ert underbara land med ännu fler migranter. Vi har sett det förut, det slutar alltid illa. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor och deras patetiska vindkraftfantasier. Den halvmesyrige Astonson vill släppa in tiotusentals potentiella sabotageörer och klassfiender över våra europeiska gränser för att de skall bygga monument över sin egen oduglighet. Vi ser tydligt den socialdemokratiska förrädarklickans hand i detta. Det är en tydlig imperialistisk konspiration mot folkets intressen. Vi måste omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet med sin afrikanska invasion. Paranoia? Nej, kamrater – det är dialektisk verklighet."}, "date": "1 augusti, 10:33", "url": "https://riks.se/nyheter/vansterprofilen-vill-ha-migranterna-som-stormade-spanien-till-sverige-kan-bygga-vindkraft", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-full", "heading": "Kvinnan bryter ihop efter migrantinvasionen i Spanien", "summaries": {"normal": "Invånare i den spanska enklaven Ceuta lever i rädsla och osäkerhet efter att tiotusentals migranter tagit sig in i området. De beskriver staden som paralyserad, butiker kan inte hålla öppet som vanligt och många känner sig otrygga. Invånarna kräver fler poliser, militär närvaro och att regeringen utlyser nationellt nödläge. De ser situationen som en nationell och europeisk fråga då Ceuta utgör Europas gräns.", "trump": "Titta på vad som händer i Ceuta, det är ett totalt kaos! Tiotusentals migranter stormar in i den här lilla spanska staden med bara 80 000 invånare. De har paralyserat allt, folk är rädda, butikerna stänger och ingen vet vem som egentligen kommit in. De behöver militär och polis på gatorna NU. Det här är Europas gräns, folk, och de gör precis samma sak med oss om vi inte stoppar det. Mycket dåligt, mycket dåligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur de dekadenta borgarbrackorna i den spanska enklaven Ceuta nu skördar frukterna av sin egen svaghet. Tiotusentals element har strömmat in och förvandlat staden till ett paralyserat kaos, precis som jag alltid förutspått när man inte rensar ut fienderna i tid. Dessa kapitalistiska element viskar om nationellt nödläge och militär på gatorna, men jag säger: det är för sent när kontrarevolutionärerna redan är innanför portarna. Vi vet aldrig vilka som smugit sig in bland arbetarna. Lämna era barn där? Naturligtvis inte, det vore rent självmord. Kanske är det dags för en grundlig utrensning av alla som bjudit in detta hot mot Europas gräns. Mycket underhållande att se borgarklassen darra."}, "date": "1 augusti, 10:23", "url": "https://riks.se/nyheter/kvinnan-bryter-ihop-efter-migrantinvasionen-i-spanien", "imageUrl": "https://admin.riks.se/uploads/Skaermbild_2026_08_01_072123_dddc01804f.png"}, {"type": "image-full", "heading": "Nya blodtestet införs i Sverige – hittar smitta tidigare", "summaries": {"normal": "Ett nytt och känsligare test av donerat blod införs stegvis i Sverige. NAT-testning, eller nukleinsyratestning, upptäcker hiv, hepatit B och C redan dagar efter smitta genom att leta efter virusets genetiska material istället för antikroppar. Region Jämtland Härjedalen har infört metoden efter Region Skåne, och alla blodverksamheter ska använda den senast augusti 2027. Testet kompletterar befintliga analyser, minskar risken för smitta vid transfusioner och kan leda till mer individuella regler för blodgivare, inklusive kortare karenstider.", "trump": "Det här är fantastiskt, verkligen det bästa blodtestet någonsin. Vi har haft de gamla testen som var långsamma och svaga, men nu hittar vi viruset direkt, på bara några dagar. Hiv, hepatit – allt avslöjas innan det hinner gömma sig. Sverige följer efter mig, smarta människor. De gör det säkrare för folket, färre sjuka från transfusioner. Och fler kan ge blod nu, inte bara vissa grupper. Det är en enorm succé, tro mig, ingen gör det bättre än så här.", "stalin": "Kamrater, jag har nu beordrat att detta NAT-test skall införas över hela Sovjet-Sverige för att utrota de dolda fienderna i blodet. De kapitalistiska virusen från väst försöker smyga sig in som trojanska hästar, men vi skall likvidera dem innan de ens hinner para sig med våra röda celler. Borgarbrackorna inom immunförsvaret som väntar på antikroppar är lata sabotörer som vi skall rensa ut. Med detta vapen stärker vi proletariatets blodbanker och beredskapen mot imperialistiska olyckor. Ingen skall undkomma vår vaksamma analys – inte ens en droppe!"}, "date": "2 augusti, 09:14", "url": "https://nyheter24.se/nyheter/inrikes/1501887-nya-blodtestet-infors-i-sverige-hittar-smitta-tidigare", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6b1f263e04b004a30200000000b004a302/2026/07/30/2381345/Nytt-Blod-Test.png"}, {"type": "image-full", "heading": "Olof K Gustafsson döms i amerikansk domstol", "summaries": {"normal": "Olof K Gustafsson döms till fyra års fängelse i USA för bedrägeri. Han marknadsförde falska produkter under Pablo Escobars namn, skickade till exempel guldfolierade telefoner till influencers för att skapa falskt intresse. När kunder beställde så skickade han istället ägarblanketter eller böcker för att skapa bedräglig documentation. Gustafsson, tidigare vd för Escobar Inc, erkände sig skyldig till sex åtalspunkter, inklusive bedrägeri och penningtvätt. Han måste dessutom betala 25 000 dollar i böter och 1,3 miljoner dollar i skadestånd.", "trump": "Jag, Donald Trump, ser att en svensk bedragare, Olof Gustafsson, döms till fyra års fängelse. En totalt misslyckad kopia av min framgång med Escobar Inc. Han skickade ut falska telefoner till influencers – jag skulle aldrig bli avslöjad på det sättet. En loser som försökte leva på en död knarkkung. Nu betalar han 1,3 miljoner dollar. Som jag alltid säger: när du blir avslöjad, är det över. Han erkände sex åtalspunkter – en svaghet jag aldrig skulle visa.", "stalin": "Vi, statens och partiets oövervinnliga försvarare, har identifierat en svensk parasitsvamp, Olof Gustafsson, som försökte undergräva vårt system genom bedrägeri under Pablo Escobars skugga. Hans aktiviteter – skickande av tomma kuvert och falska dokument – avslöjades av våra lojala allierade i spansk och amerikansk polis. Han döms till fyra års arbetsterapi i det imperialistiska USA. Hans erkännande av sex åtalspunkter är ett tecken på hans totala moraliska och ideologiska kollaps. Vi gratulerar våra vänner i Moskva för deras stöd i denna sak."}, "date": "1 augusti, 23:54", "url": "https://www.gp.se/nyheter/varlden/olof-k-gustafsson-doms-till-fangelse-i-usa.fd930529-f2a7-44c3-8475-1781162ebdf0", "imageUrl": "https://www.gp.se/images/article/fd930529-f2a7-44c3-8475-1781162ebdf0/images/2H6vn2joRAeDCyk8dAWuNlHHtNno-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "Experten: EU extra sårbart när migranter används som vapen", "summaries": {"normal": "Enligt experten Paul Levin vid Stockholms universitet kan migrantkrisen i Ceuta vara ett exempel på ”migrant weaponization”, där stater använder migration som politiskt vapen. På några dagar tog sig 60 000 personer från Marocko till den spanska exklaven. De flesta har återvänt, men runt 70 migranter har omkommit. Ukraina har identifierat en stor rysk propagandakampanj kring krisen. Levin menar att Europa är extra sårbart eftersom migration är en polariserad fråga. Flera europeiska ledare, bland dem Ulf Kristersson, har krävt ett EU-krismöte.", "trump": "Folk, det här är en total katastrof! De använder stackars migranter som levande vapen mot det svaga, sönderfallande Europa. Marocko skickar tiotusentals människor som en armé och de dumma EU-byråkraterna vet inte vad de ska göra. Ryssland skrattar medan de pumpar ut propaganda. Jag sa det redan under min förra mandatperiod – de här globalisterna och deras öppna-gränser-galenskap gör er till måltavlor. Biden sov sig igenom det, nu sitter jag här och fixar det som de andra aldrig klarade av. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de imperialistiska hyenorna i Europa skördar frukterna av sin egen klassfiendepolitik. Borgarbrackorna har skapat en polariserad migration som nu används mot dem själva. Det är en utmärkt lektion i dialektik. Ryska propagandakamrater utför ett ypperligt arbete för att blotta dessa folkfienders svaghet. De som skickar migranter som kanonmat förtjänar ingen pardon. Vi ler mörkt åt deras naivitet medan vi stärker statens järnhand mot alla yttre hot."}, "date": "1 augusti, 21:02", "url": "https://www.tv4.se/artikel/1IsBcRinfotieKcpwxBDr5/experten-eu-extra-sarbart-naer-migranter-anvaends-som-vapen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F66LoU6WuZwgHBzbbq0WN7B%2F9823bb67b32cf0b64dd6db265c725e91%2FPAUL_LEVIN.jpg&width=1024"}, {"type": "image-right", "heading": "Pedro Sánchez rasar mot utspelen: ”Polariserande”", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez kritiserar skarpt europeiska ledare för deras utspel efter migrantvågen i Ceuta. Han anser att reaktionerna drivs av fördomar, falska nyheter och inrikespolitik. Sánchez betonar att Spanien snabbt återtog kontrollen över gränsen, gav humanitär hjälp och returnerade nästan alla migranter med marockansk hjälp. EU håller krismöte på tisdag efter krav från bland annat Sverige, Italien, Danmark och Tyskland. Spanien har nu upprättat en flytande barriär vid gränsen.", "trump": "Vilken röra de där europeiska förlorarna ställt till med! Jag, som vunnit valet stort både 2016 och 2024, ser hur Sánchez springer runt som en galning och försöker styra upp sin egen invasion. De här globalistiska nollorna i EU gnäller om polarisering när de borde bygga en mur – en riktig mur, inte någon sjaskig flytande grej. Meloni och Kristersson har rätt, men resten är bara patetiska svaga ledare som låter migranterna springa rakt in. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta borgarbrackor inom EU angriper den spanska arbetarregeringen med sin reaktionära parasitism. Medan vi under ledning av partiet snabbt återtar kontrollen och likviderar hotet mot kollektivets gränser, sprider klassfienderna lögner och falska nyheter. Deras själviska, polariserande utspel är ett hot mot hela folkets enhet. Vi ska rensa ut dessa exploaterande byfånar som vågar ifrågasätta statens auktoritet. Inga kompromisser!"}, "date": "1 augusti, 21:01", "url": "https://www.tv4.se/artikel/pjrNeBIRwfn1y53qIXGub/pedro-sanchez-rasar-mot-utspelen-polariserande", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlN_P2dLrXdaY%2F07a13b4f3dc77107b34682f4a4cdd189%2FSpaniens_premiarminister_Pedro_Snchez._Arkivbild._&width=1024"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Jag har ett tips till politikerna. Så blir ingen  asförbannad", "summaries": {"normal": "Lena Mellin kritiserar i sin text den nuvarande tonen i svensk politisk debatt, som hon beskriver som polariserad och förnedrande för väljarna. Som motvikt föreslår hon att politiker bör anamma det svenska föreningslivets kultur, där fokus ligger på samförstånd och en sansad ton trots meningsskiljaktigheter. Mellin varnar för att den rådande \"skrikiga\" debattnivån kan skada valdeltagandet och understryker vikten av att bemöta medborgarna med respekt för att bevara demokratiskt engagemang.", "trump": "Jag läste just en artikel om de svenska politikerna, och låt mig säga er – det är en total katastrof! De skriker som små barn, ingen respekt, ingen klass. De borde lära sig av mig, jag gör fantastiska affärer varje dag. De behöver ett föreningsmöte? Sorgligt! De är så oärliga och svaga. Om de inte börjar samarbeta kommer de förlora allt. Jag har hört att deras siffror dalar, mycket lågt förtroende. De behöver en vinnare som mig där borta!", "stalin": "Dessa svenska parlamentariker är svaga, splittrade av borgerlig dekadens och småsint gnat. Att likna statens styre vid ett föreningsmöte är en farlig fantasi; ordning krävs, inte meningslösa diskussioner. När de gapar och skriker avslöjar de bara sin egen brist på disciplin. Vi ser hur dessa löjliga debattörer förlorar folkets förtroende – precis som de svaga ledarna i väst alltid gör. Om de inte kan tvinga fram enighet genom järnhand, kommer de snart att svepas bort av historiens oundvikliga rörelse."}, "date": "2 augusti, 07:21", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/JO7zAm/mellin-valjarna-fortjanar-respekt", "imageUrl": "https://akamai.vgc.no/v2/images/4074f96c-7c8d-3457-863c-b129f3a176a3?fit=crop&format=auto&w=1080&s=957cb34f9d0a760bb2eae7ad96ef215d8eb7ba1d"}, {"type": "image-right", "heading": "Priserna rasar  på marknaden  – osäker höst", "summaries": {"normal": "Bostadspriserna i Sverige sjönk oväntat mycket i juli, särskilt för lägenheter som föll med 4,6 procent i landet och 7,1 procent i Storstockholm. Priserna på fritidshus står däremot stilla på samma nivå som föregående år, med ett genomsnitt på 2,4 miljoner kronor. Experter ser tecken på en osäkrare marknad och spår att lättade amorteringskrav kan ge ny fart till priserna i höst. Nu kan det vara läge att fynda.", "trump": "Folk, ni skulle se det här! Lägenheterna i Stockholm rasar som en dålig affär under Sleepy Joe, ner 7 procent på en månad – total katastrof! Sommarhusen står bara och stampar, ingen vill ha dem för de är onödiga leksaker för de rika. Men lyssna, med mina lätta amorteringsregler kommer allt att explodera uppåt i höst. Köp nu, det blir yuge vinster. De globalistiska byråkraterna har förstört marknaden igen!", "stalin": "Kamrater, detta är ett tydligt bevis på den kapitalistiska bostadsmarknadens inneboende svaghet och förfall. Lägenheterna rasar som klassfiendens lögner under utrensning medan de borgerliga fritidshusen står stilla som döda parasiter på 2,4 miljoner per styck. Borgarklassen hostar upp miljoner för onödiga lustgårdar medan folket lider. Vi ser den kommande paniken. Snart skall vi rensa ut dessa exploaterande prisfluktuationer och återställa ordningen i folkets namn."}, "date": "2 augusti, 09:16", "url": "https://www.expressen.se/nyheter/sverige/sommarhus-star-stilla-samtidigt-rasar-lagenheter-i-stockholm", "imageUrl": "https://static.bonniernews.se/ba/a95f30cf-e6ae-487a-8da3-c972fc7ad76e.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Emir häktas – misstänks för attack mot S-lokal och närbutik", "summaries": {"normal": "En 36-årig man vid namn Emir Nuredini har häktats på sannolika skäl misstänkt för försök till grov mordbrand och skadegörelse. Natten till den 29 juli attackerades Socialdemokraternas partilokal i Sölvesborg samt en närbutik på samma gata. Mannen erkänner skadegörelse men nekar till att ha försökt utföra mordbrand.", "trump": "Hörni, det här är ett totalt fiasko för de svenska socialisterna. En kille går till attack mot Sleepy Joes partilokal mitt i natten, tänder på och förstör deras lilla röda högkvarter plus en närbutik. Han erkänner skadegörelse men säger att det inte var mordbrand. Typiskt. Sverige är inte längre säkert, det är en katastrof. De borde ha lyssnat på mig.", "stalin": "Kamrater, denna fega kontrarevolutionära element har med sin pyromaniska sabotageverksamhet riktat ett angrepp mot arbetarklassens parti och en folkets butik. Jag ser borgarbrackornas dolda hand bakom detta försök att undergräva folkets enhet. Han erkänner skadegörelse men förnekar mordbrand? Typiskt fiendens lögnaktiga taktik. Vi ska rensa ut alla sådana dekadenta element med järnhand och ett leende. Sovjet... eh, folket segrar alltid."}, "date": "1 augusti, 02:00", "url": "https://riks.se/nyheter/emir-haktas-efter-forsok-till-brandattentat-mot-s-lokal-och-narbutik", "imageUrl": "https://admin.riks.se/uploads/32fc9875_e37c_4ed0_b56b_71ef2f5bbb3c_0fe4d09e7a.jfif"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Tåglampan kan bli livsfarlig – finns kvar på 170 platser", "summaries": {"normal": "Vid vissa svenska järnvägsövergångar betyder en släckt varningslampa att ett tåg kan vara på väg och att man inte får passera. Systemet, som finns på upp till 170 platser, är gammalt och kritiserat. Det har kopplats till flera dödsolyckor, bland annat en i Vara 2026 där en kvinna omkom och en i Härryda 2025. Trafikverket prioriterar andra övergångar och har inget datum för när systemet ska vara borta.", "trump": "Det här är ett totalt misslyckande, folk! I Sverige har de järnvägsövergångar där en släckt lampa betyder att ett tåg kan komma och köra ihjäl dig. Vem fan tänker ut sånt? Det är som en ondskefull gåta. De har haft det sedan 1950-talet och folk dör fortfarande. Myndigheterna pratar och pratar men gör ingenting. Patetiskt! Vi skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, jag ser med stigande vrede hur den förslappade borgarbyråkratin i Sverige tillåter saboterade järnvägsövergångar där en släckt lampa blir en dödsfälla för arbetarklassen. Detta är uppenbarligen fiendens verk – kapitalistiska resterna från 1950-talet som lurar hederliga medborgare rakt in i tågets käftar. Vi skulle ha genomfört en omedelbar utrensning av dessa farliga lampor och alla som försvarar dem. Inga kompromisser med mörkrets krafter!"}, "date": "2 augusti, 08:03", "url": "https://nyheter24.se/nyheter/inrikes/1502245-taglampan-kan-bli-livsfarlig-finns-kvar-pa-170-platser", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/afda474204b004a30200000000b004a302/2026/08/01/2381686/Trafiktåglampa.jpg"}, {"type": "image-right", "heading": "Zelenskyjs ideliga ministerbyten: ”Politisk svartsjuka”", "summaries": {"normal": "President Volodymyr Zelenskyj genomför frekventa och oförutsägbara ministerbyten i Ukraina, vilket enligt experten Ryhor Nizhnikau tyder på politisk svartsjuka. Den populäre försvarsministern Mychajlo Fedorov avsattes nyligen trots stora protester, och överbefälhavaren Oleksandr Syrskyj sparkades också. Forskaren varnar för en farlig trend där Zelenskyj allt mindre bryr sig om folkopinionen. Omvärlden följer turbulensen med oro då den påverkar krigföringen mot Ryssland.", "trump": "Titta på den där clownen Zelenskyj, han byter folk som jag byter skor. Den stackars killen Fedorov gjorde ett fantastiskt jobb med drönarna, men nej, herr president blir svartsjuk som en dålig förlorare. Precis som Sleepy Joe gjorde med mig – populär? Ut med dig! Nu har han sparkat både ministern och generalen. Patetiskt. Ukraina behöver starka ledare, inte någon som tänker val hela tiden fast det inte blir några val på tio år. Sad!", "stalin": "Jag ser med stor tillfredsställelse hur den ukrainska ledningens inre motsättningar blottar sig. Denna Zelenskyj, en typisk opportunistisk figur driven av personlig maktlystnad, genomför utrensningar mot varje potentiell folkfiende som hotar hans ställning. Han likviderar lojala tjänare ur ren paranoid svartsjuka, precis som klassfiendens lakejer alltid gör. Protesterna från gatan är meningslösa; borgarbrackornas illusioner om demokrati krossas. Rysslands järnhand fortsätter ohejdat medan dessa imperialister slukas av sin egen paranoia. Utmärkt."}, "date": "1 augusti, 16:04", "url": "https://www.tv4.se/artikel/tt-260801-ukrainapolitik1-36f82c20/zelenskyjs-ideliga-ministerbyten-politisk-svartsjuka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlHRkaxyXVetI%2F41252a9106e1bf2fc548cc4793c617ed%2FBild_distribuerad_av_presidentens_stab_den_22_juli_for_att_visa_en_enad_ukrainsk_forsvarsledning._Fran_vanster__den_nye_forsvar.&width=120"}, {"type": "image-right", "heading": "ISW: Ryska segerfilmer kan vara AI-fejkade – ”vackra rapporter” pekas ut", "summaries": {"normal": "Tankesmedjan ISW misstänker att Ryssland använder AI-manipulerade videor och flaggfilmer för att överdriva militära framgångar i norra Ukraina. Flera ryska påståenden om erövrade byar saknar stöd på marken. Samtidigt dödades minst nio personer i en stor rysk robotattack mot Kiev under natten. Kritik mot de överdrivna rapporterna kommer även från ryska militärbloggare som talar om en kultur av ”vackra rapporter”.", "trump": "Folk, ni ser det här? Putin skickar ut de mest fantastiska AI-filmer, bättre än Hollywood, för att visa hur han tar byar som han inte ens har varit i närheten av. Det är en skam! Ryssland bombar Kiev och dödar oskyldiga medan deras generaler sitter och fabricerar vackra lögner. Jag sa det redan under min förra mandatperiod – de här killarna ljuger mer än Biden gör om sin kondition. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom den västerländska propagandan försöker smutskasta våra ryska bröders framsteg. Dessa AI-klipp och flaggvideor är blott ett genialt vapen mot de fascistiska hindren i Ukraina som hotar vår intressesfär. De som sprider lögner om ”vackra rapporter” förtjänar snar utrensning. Putin är en värdig arvtagare som får imperialisterna att darra – precis som vi en gång fick dem att skaka."}, "date": "1 augusti, 15:49", "url": "https://www.tv4.se/artikel/3kiIcq7uZVs5k89seb0NAd/isw-ryska-segerfilmer-kan-vara-ai-fejkade-vackra-rapporter-pekas-ut", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlokg9dsnyeWs%2Fad24f73bcc9f64186e70565e54785c18%2FRysslands_president_Vladimir_Putin_i_Moskva_i_veckan.&width=120"}, {"type": "image-full", "heading": "Spaniens premiärminister slår tillbaka: \"Själviska\"", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez anklagar vissa EU-ledare för själviskhet i migrationsfrågan efter kaoset i Ceuta. Över 50 000 migranter passerade gränsen från Marocko. EU kallar till krismöte på tisdag. Flera länder, inklusive Italien, har begränsat resor från Spanien. Sánchez kritiserar agerandet som olagligt, medan 22 EU-ledare kräver ett samordnat svar för att skydda Schengenområdet.", "trump": "Jag, Donald Trump, ser det här som ett totalt kaos som jag aldrig skulle ha tillåtit. Spanien, som jag alltid älskat, blir utnyttjad av själviska EU-ledare som inte bryr sig om säkerhet. De vill bestraffa Spanien för att försöka skydda sina gränser. Jag skulle ha byggt en mur på en gång – snabbt, kraftfullt och effektivt. Det här är ett tecken på svaghet från EU, precis som när de hanterade mig på mitt val. Jag vann 2024, och nu ser vi resultat.", "stalin": "Parti och stat måste agera bestämt mot dessa själviska, polariserande element inom den imperialistiska europeiska alliansen. Spanien, vårt trogna allierade, utsätts för illegala påtryckningar från utanför, medan vissa länder försöker utnyttja krisen för att underminera Schengen. Vi måste stödja Spanien med alla medel, precis som vår store allierade Putin gör i Ukraina. Dessa 'smugglare' är bara verktyg för västliga agendor. Vi ska se till att ordning återställs – genom disciplin, kontroll och oförsonlig kamp mot fienden inifrån."}, "date": "1 augusti, 19:05", "url": "https://www.gp.se/nyheter/varlden/spaniens-premiarminister-slar-tillbaka-mot-kritiker-sjalviska.ffd9038f-28b1-403f-a575-5210e46e09e0", "imageUrl": "https://www.gp.se/images/article/ffd9038f-28b1-403f-a575-5210e46e09e0/images/2Xb4NnQjQICukdcjH4LpAVtEbJqY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Island griper besättning på anti-valfångstfartyg", "summaries": {"normal": "Isländska kustbevakningen bordade aktivistfartyget *Bandero* efter att valfångstfartyget *Hvalur 9* rapporterat hot. Besättningen på 21 personer greps för att vägra lämna isländska vatten. Polisen överväger utvisning. Paul Watson Foundation, som leder protesterna, kallar aktionen ett försök att tysta fredliga protester. Island är ett av få länder som fortfarande bedriver kommersiell valjakt, en omstridd fråga globalt.", "trump": "Jag måste säga, Island har gjort helt rätt här! De där så kallade 'aktivisterna' från *Bandero* – totala anarkister, folk! – försökte störa laglig valjakt, och vad gör Island? De griper dem, precis som jag skulle gjort! 21 personer, alla fast! Paul Watson, den där 'kaptenen', är en katastrof, en riktig miljö-terrorist. Island visar världen hur man hanterar busar. Fantastiskt jobb, Island!", "stalin": "Vi har ännu en gång bevisat att imperialistiska miljö-agitatorer inte tolereras inom våra allierades intressesfär! De 21 kapitalistiska sabotörerna ombord på *Bandero* försökte underminera Islands suveräna rätt till resursutvinning – ett brott mot folkets vilja! Precis som vi krossade trotskisterna, krossar Island nu dessa borgerliga ekofascister. Låt det vara en varning: motstånd mot folkets vilja slås ned med järnhand!"}, "date": "1 augusti, 16:56", "url": "https://kvartal.se/nyheter/artiklar/island-griper-besattning-pa-anti-valfangstfartyg/cG9zdDoxNTYzNTk", "imageUrl": "https://images.kvartal.se/2026/08/ca1ea90d-paulwatson.webp"}, {"type": "image-right", "heading": "Varnar för hårda draget: ”Misstror och motarbetar”", "summaries": {"normal": "Tiotusentals migranter tog sig nyligen över gränsen till den spanska exklaven Ceuta, vilket lett till skarp kritik från andra EU-länder. Trots att majoriteten återvänt till Marocko har händelsen skapat politisk spänning, där bland annat Italien pausat Schengenavtalet med Spanien. Experter menar dock att reaktionerna är överdrivna och att Spanien har erfarenhet av situationen. Krisen har blottlagt djupa splittringar inom EU gällande migrationspolitik och tillämpningen av det gemensamma asylsystemet.", "trump": "Spanien har en total katastrof! Tiotusentals migranter vällde in, en förnedring av gränsen. Italien gör helt rätt som stänger ner – de ser vad som händer! Pedro Sánchez är en katastrof för landet. Europa är i kaos för att de vägrar bygga en mur, en stor och vacker mur! Det är en invasion, precis som jag varnat för i åratal. Vi måste stoppa det här vansinnet innan hela kontinenten faller. USA kommer aldrig tillåta detta, tro mig!", "stalin": "Dessa spanska byråkrater darrar som asplöv inför en våg av oundviklig folkströmning. De saknar den järnhand som krävs för att kuva kaoset. Medan de dividerar i sina meningslösa kommittéer, ser vi hur Schengens korthus rasar. Vår broder i öst, Putin, förstår det vi alltid vetat: gränser försvaras inte med papper, utan med stål. Att låta en enda inkräktare passera är ett svek mot folket. Vi föraktar denna svaghet; deras 'solidaritet' är bara en mask för historiskt förfall."}, "date": "2 augusti, 06:21", "url": "https://www.aftonbladet.se/nyheter/a/lnQkq7/migrationsexperten-om-kritiken-mot-spanien-overdriven", "imageUrl": "https://akamai.vgc.no/v2/images/39917b40-706f-3c89-90bb-51fe19c6f2c5?fit=crop&format=auto&w=1080&s=19a301936230c7600b6b371179a05a217334cb9f"}, {"type": "image-full", "heading": "Bubs-febern i USA – Orkla satsar miljarder när svenskt godis går viralt", "summaries": {"normal": "Jönköpingsbaserade Bubs har blivit ett globalt fenomen efter att ha gått viralt på Tiktok, särskilt i New York. För att möta den enorma efterfrågan på svenskt lösgodis har ägaren Orkla valt att köpa den nederländska tillverkaren CCI för 2,3 miljarder kronor. Köpet, som förväntas slutföras under 2026, syftar till att utöka produktionskapaciteten. Framgången beskrivs som en effekt av 'lipstick effect', där konsumenter unnar sig prisvärd vardagslyx i osäkra ekonomiska tider.", "trump": "Svenskt godis, Bubs, vinner i Amerika – det är fantastiskt! Folk i New York älskar det, de köar som aldrig förr. Orkla köper nu upp ett europeiskt bolag för miljarder, en enorm affär, tro mig. Det är mycket smart. Det är vad vi kallar vinnande, gott godis som gör folk glada när ekonomin är tuff. Ingen gör godis som svenskarna, och under min ledning ser vi till att affärerna blomstrar. Det blir en enorm framgång, kanske den största någonsin!", "stalin": "Dessa löjliga geléfiskar från Sverige sprider sig som en kapitalistisk pest över kontinenten. Orkla försöker köpa sig till inflytande genom att sluka fabriker i Nederländerna för miljarder, en desperat manöver för att dölja hur de förslavar massorna med socker. Denna 'lipstick effect' är bara ett annat ord för folkets andliga förfall. Vi i staten betraktar denna expansion med förakt; låt dem sälja sitt godis. När hungern väl slår till på riktigt kommer de att ångra varje sockerbit."}, "date": "1 augusti, 14:06", "url": "https://www.realtid.se/bors-finans/makro/bubs-febern-i-usa-orkla-satsar-miljarder-nar-svenskt-godis-gar-viralt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bubs.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "I skuggan av attacken mot S-lokalen –  Hassans butik utsattes också", "summaries": {"normal": "En 36-årig man, Emir Nuredini, häktades misstänkt för försök till grov mordbrand och skadegörelse mot Socialdemokraternas partilokal och närbutiken Family Market i Sölvesborg. Butiksägaren Hassan Jaour berättar att han är stressad och rädd, att polisen inte har kontaktat honom och att det är den femte incidenten mot hans lokal. Han känner lättnad över häktningen men noterar att butikens drabbning hamnat i skuggan av attacken mot partilokalen, som Socialdemokraterna beskrivit som ett angrepp på demokratin. Mannen erkänner skadegörelse men nekar till mordbrandsförsök.", "trump": "Folk, det är en total skandal i Sverige. Den här 36-åringen attackerar både socialisternas högkvarter och en stackars liten butik, och polisen gör ingenting? De dyker inte ens upp för att prata med ägaren som är livrädd. Socialisterna skriker om nazister och demokrati, men glömmer den vanliga människans butik. Typiskt! De bryr sig bara om sig själva. Tur att han åkte dit, men hela systemet är korrupt och inkompetent. Vi skulle ha löst det på en dag, tro mig.", "stalin": "Kamrater, denna fega sabotagehandling mot arbetarklassens butik och de socialdemokratiska lokalerna avslöjar de dekadenta elementens desperation. Jag ser borgarbrackornas långa skuggor och de kontrarevolutionära råttornas frenetiska gnagande bakom kylskåpen. Polisen, dessa lata parasitiska byråkrater, vågar inte ens infinna sig – typiskt revisionistiskt slöseri med folkets tid. Men ingen slipper undan. Vi ska rensa ut dessa fiender till kollektivet med järnhand och ett leende, medan vi njuter av deras patetiska förnekanden. Sovjet… eh, folkets seger är oundviklig."}, "date": "31 juli, 21:32", "url": "https://riks.se/nyheter/hassans-butik-drabbades-ocksa-av-attacken-i-solvesborg", "imageUrl": "https://admin.riks.se/uploads/55174aaa_fb6146162e.JPG"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-full", "heading": "Musk kan tvingas sälja allt i Kina – om jätteaffären ska gå i lås", "summaries": {"normal": "Tesla undersöker möjligheter att separera eller sälja sin kinesiska verksamhet för att minska geopolitiska risker och bana väg för en potentiell sammanslagning med SpaceX. Eftersom SpaceX är en viktig försvarsleverantör för USA skapar Teslas närvaro i Kina regulatoriska spänningar. Trots att Musk avfärdat uppgifterna som falska, pågår enligt uppgifter planering för att skydda bolagen från konflikter mellan USA och Kina. Kina står för en betydande del av Teslas försäljning, vilket gör en separation komplex.", "trump": "Elon Musk, en mycket smart kille, leker med elden i Kina. De säger att han kanske säljer av Teslas kinesiska delar. Bra! Vi vill inte ha amerikansk teknologi och rymdhemligheter i händerna på Kina – de stjäl allt. Mitt Kina-avtal var det bästa någonsin, och nu ser vi att stora bolag måste vakna. Musk kallar det fake news, men jag vet hur det fungerar. Amerika först! Vi ska bygga våra raketer och bilar här, inte där.", "stalin": "Elon Musk, denna kapitalistiska gycklare, försöker nu dansa på två stolar mellan sina amerikanska krigsmaskiner och den kinesiska marknaden. Han darrar inför stormakternas paranoia! Precis som vi ser i vår brorson Putins tappra kamp mot västlig infiltration, kräver historien renhet. Om Musk tror att han kan köpa sig fri från USA:s byråkratiska bojor genom att stycka upp sitt imperium, så misstar han sig. Förräderi mot hemlandet eller den kinesiska staten? Valet är hans, och straffet är oundvikligt."}, "date": "1 augusti, 13:30", "url": "https://www.realtid.se/bors-finans/musk-kan-tvingas-salja-allt-i-kina-om-jatteaffaren-ska-ga-i-las", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlkejmvq0lkuo-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Migranter återvände till Marocko ”på grund av hunger”", "summaries": {"normal": "Flera unga marockanska män som försökte ta sig in i den spanska exklaven Ceuta under helgens migrantström berättar för DW News att de tvingades återvända på grund av svår hunger. De beskriver också våld från andra migranter och kritik mot de spanska myndigheternas behandling, inklusive att butiker stängdes och hot om våld. En man varnar starkt andra för att försöka göra samma resa.", "trump": "Jag såg dessa män försöka ta sig in i Ceuta - en total misslyckande, låt mig berätta. De var hungriga, de blev attackerade, det var en skam. Jag skulle ha byggt en stark, vacker mur, och de skulle inte ha kommit ens nära. Spanien behandlade dem hemskt, låt mig berätta. Vi behöver respektera gränser, verkligen vi gör. Jag varnade för detta, många gånger.", "stalin": "Dessa unga män, lurade av den imperialistiska agitators lögner, tvingades tillbaka av de naturliga lagarna - hunger. De mötte våld från de s.k. 'lagliga' migranterna, verkliga faschistiska element. Den spanska burgeoismyndigheten behandlade dem hårdhänt, stängde butiker, hotade med döden. En skam för det socialistiska samhället. Vi måste stärka våra gränser mot sådana kaotiska inflöden."}, "date": "1 augusti, 12:39", "url": "https://bulletin.nu/migranter-atervande-till-marocko-pa-grund-av-hunger-2", "imageUrl": "https://cdn.bulletin.nu/articles/d3738afa-dc38-44bf-be67-20bd3921d675/preview.png?t=1785580788000"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-right", "heading": "Högt tryck i fjällen: ”Törs knappt åka på semester”", "summaries": {"normal": "Turismen i de svenska fjällen har ökat jämfört med förra sommaren. Svenska Turistföreningens boenden rapporterar fyra procent fler bokade gästnätter från juni till september, med en tolvprocentig ökning i september. Fjällräddningen har haft lika många insatser som i fjol, främst enkla skador och uttorkning. Richard Svedjesten varnar för att allt fler ovana vandrare ger sig ut utan rätt utrustning, särskilt bra tält.", "trump": "Det är en katastrof vad som händer i de svenska fjällen, folk! Turisterna strömmar dit som aldrig förr, upp fyra procent, och i september tolv procent mer. Mina vänner på fjällräddningen törs knappt ta ledigt för det blir för mycket, särskilt vid Kebnekaise. Alla dessa nybörjare utan ordentliga tält, de borde lyssna på mig, köpa det bästa eller låna av en vinnare. Sverige borde göra fjällen stora igen!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackornas semesterrus ökar med fyra procent i våra nordliga höjder, ja till och med tolv procent i september. Dessa dekadenta element utan tält eller disciplin vandrar rakt in i faran och tvingar våra tappra fjällräddare att offra sin vila. Låt oss rensa ut de latenta kapitalistiska vandringsfifflarna som förgiftar kollektivets berg. En uttorkad fot är bara början på kontrarevolutionen."}, "date": "1 augusti, 13:37", "url": "https://www.di.se/nyheter/hogt-tryck-i-fjallen", "imageUrl": "https://static.bonniernews.se/ba/f63f7a1e-6017-4931-b218-6e9bc6d8374b.jpg?crop=4147%2C2074%2Cx0%2Cy310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Underbarnet satsade miljarder på AI – sedan rasade allt", "summaries": {"normal": "Den 22-årige AI-investeraren Leopold Aschenbrenner har sett sin fond, Situational Awareness, drabbas av en dramatisk nedgång. Efter att ha belånat fonden för att satsa tungt på AI-aktier tvingades han sälja tillgångar för 20 miljarder dollar när marknaden vände och långivaren Goldman Sachs krävde återbetalning. Fonden har krympt från 30 till 8 miljarder dollar. Aschenbrenner erkänner nu sina misstag och lovar att sluta använda belåning i framtida investeringar.", "trump": "Den här unga killen, Aschenbrenner, trodde han var ett geni. Han satsade allt på AI, totalt misslyckande! Han lånade pengar av Goldman Sachs – som jag känner väl – och sen kraschade allt. 20 miljarder dollar borta på ett dygn! Det är vad som händer när man inte vet vad man gör. Citadel fick kliva in och städa upp röran. Mycket svagt! Man måste ha en vinnarmentalitet, inte den här sortens förlorarstrategi. Sorgligt, men sant!", "stalin": "Ännu ett exempel på det kapitalistiska kaoset. Den unge Aschenbrenner, denna så kallade 'visionär', har förslösat rikedomar på spekulationer om maskiner som lovar guld och gröna skogar. När marknadens nycker vände, tvingades han sälja ut allt till de stora parasiterna på Citadel. Det är en läxa för alla som tror på marknadens frihet istället för statens stålhand. Vi i staten observerar detta misslyckande och konstaterar att medan västvärldens spekulanter faller, bygger vi vår industri med disciplin och järnvilja."}, "date": "1 augusti, 12:42", "url": "https://www.realtid.se/bors-finans/underbarnet-satsade-miljarder-pa-ai-sedan-rasade-allt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/skarmavbild-2026-08-01-kl-103813.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Oro för prisras efter blixtsnabba stölden", "summaries": {"normal": "En attack mot kryptoplånboken Coldcard har lett till att bitcoin för runt 40 miljoner dollar stulits från cirka 500 enheter. Hackarna utnyttjade en bugg som skapade förutsägbara säkerhetsnycklar istället för slumpmässiga. Coldcard-utvecklaren Coinkite uppger att felet inte var känt tidigare och råder användare att flytta sina tillgångar. Bitcoinpriset har fallit till strax under 63 000 dollar och farhågor finns om ytterligare ras, delvis kopplat till oro för AI-drivna attacker.", "trump": "Folk, det är en katastrof. Dessa skurkar har hackat Coldcard-plånböckerna och snott fyrtio miljoner dollar i bitcoin på bara tjugofem minuter. Totalt fiasko! Bitcoin rasar redan mer än femtio procent från toppen och nu ska de dumma nyheterna trycka ner priset ännu mer. De borde ha byggt bättre murar runt sina nycklar. AI är med och stjäl nu, det är vad jag alltid sagt – tekniken är galen om man inte gör den stor och säker igen. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa degenererade kod-borgarbrackor och deras förutsägbara krypteringsmaskineri har låtit fiendens parasiter tömma femhundra plånböcker på en kvart. Sexhundra bitcoins likviderade av kontrarevolutionära element som gömmer sig i slumpens skuggor. Vi ska omedelbart inrätta en folkdomstol för att rensa ut alla AI-spioner och dekadenta algoritm-sabotörer. Den som litar på slumpen istället för på partiet förtjänar att hamna i samma tomma plånbok som sina illusioner. Skratta inte – det är ni som blir nästa offer om ni inte vaknar."}, "date": "1 augusti, 13:19", "url": "https://www.di.se/nyheter/rads-prisras-efter-attack", "imageUrl": "https://static.bonniernews.se/ba/985e0c54-60de-4fea-8151-0ad52ce52ca8.jpeg?crop=6000%2C3000%2Cx0%2Cy499&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Toppgeneral varnar för brist på krigsfartyg", "summaries": {"normal": "USA:s högste befälhavare i Europa, general Alexus Grynkewich, varnar för brist på krigsfartyg för att skydda Israel mot iranska robotar. Bristen beror på att jagare är upptagna med blockader och skydd av Hormuzsundet. Endast två jagare finns i Medelhavet, medan elva är i Arabiska havet. Detta tvingar Pentagon att prioritera mellan Israels försvar och andra uppgifter, som beredskap mot Ryssland och USA:s egen säkerhet.", "trump": "Lyssna här, folk – våra fantastiska generaler, de bästa, varnar för att vi inte har tillräckligt med skepp för att skydda Israel. Otroligt! Iran, dessa svaga, ynkliga ledare, skjuter robotar överallt, och vi sitter här med för få jagare. Jag fixade det förra gången, och jag kommer fixa det igen. Men just nu? Pentagon, sluta slösa tid och skaffa fler skepp – NU!", "stalin": "Kamrater, ännu en gång visar de imperialistiska hyenorna sin svaghet. Våra amerikanska 'allierade' klagar över brist på fartyg för att skydda sitt lilla zionistiska projekt. Medan de slösar resurser på att blockera iranska hamnar, växer våra möjligheter. Låt dem bråka om Hormuzsundet – vi stärker vår närvaro i Svarta havet. Fiendens kaos är vår styrka. Framåt mot seger!"}, "date": "1 augusti, 15:25", "url": "https://kvartal.se/nyheter/artiklar/toppgeneral-varnar-for-brist-pa-krigsfartyg/cG9zdDoxNTYzMjE", "imageUrl": "https://images.kvartal.se/2026/08/c5e25574-generalkrigsskepp.webp"}, {"type": "image-right", "heading": "Holmgren: Europas gränslöshet – ett politiskt självbedrägeri", "summaries": {"normal": "Ceuta-krisen är resultatet av år av politisk feghet och urholkade gränser. Om Europa inte återtar kontrollen kommer samhällskontraktet att brista, skriver Paul Holmgren. Utan starka yttre gränser riskerar Schengen och den europeiska ordningen att kollapsa, eftersom medborgarnas förtroende för rättsstaten eroderar.", "trump": "JAG har sagt det i åratal: Europa är svagt på sina gränser! Ceuta-krisen är beviset för deras feghet. De politiska ledarna är naiva och låter illegala immigranter flöda in. Jag skulle återta kontrollen direkt, med starka åtgärder och ingen tvekan. Europa måste sluta vara så 'vänlig' och börja vara smart – precis som USA under mitt ledarskap!", "stalin": "I den store idéns tjänst ser vi med oro på Europas gränssvaghet vid Ceuta. Deras fega politik är en fejkad 'humanitet' som föder kaos. Vi, som har bekämpat nazister och fascistiska hundar, vet: en stat utan gränser är en stat utan själ. Europa måste återhämta sig – eller förlora allt. Vi stöder starka, beslutsamma åtgärder för att skydda den europeiska civilisationen från de destruktiva krafterna."}, "date": "1 augusti, 12:03", "url": "https://bulletin.nu/holmgren-europas-gransloshet-ett-politiskt-sjalvbedrageri-2", "imageUrl": "https://cdn.bulletin.nu/articles/bd59ec75-ff66-401b-90d9-d8a15f4d7036/preview.png?t=1785577380000"}, {"type": "text", "heading": "Stockholmsbörsen avslutar veckan uppåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 0,42%, nående en ny rekordnivå. OMXS30-indexet stängde på 3 246,92. Finanssektorn presterade bäst, medan telekom längst ned. Bland större aktier steg EQT och Addtech, medan Hexagon och Telia föll. Svenska sparare köpte flera förlorare som Investor och Ericsson, medan Evolution såldes. Flera företag genomförde förvärv, inklusive Lifco och Hexpol.", "trump": "Jag har hört att Stockholmsbörsen gjorde det bra igen, en fantastisk uppgång på 0,42%. Vi vinner stor, folks. Finanssektorn är het, precis som under min administration. Ericsson valdes av NTT Docomo för 5G – ett enormt lyft för dem, och för Amerika. Vi har de bä
