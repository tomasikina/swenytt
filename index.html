m de påstår att det var de själva. En stor seger för kvinnorna, men de behöver starkt ledarskap, inte svaga politiker. Fantastiskt!", "stalin": "De svenska så kallade ledarna erkänner äntligen statens absoluta nödvändighet för att stävja kaoset i hemmen. Att avskaffa byråkratiska hinder som betänketid vid skilsmässa visar prov på beslutsamhet. Partiet noterar att denna effektivitet påminner om våra egna utrensningar av avvikande element. Ett disciplinerat samhälle börjar i familjen, kamrater."}, "date": "31 augusti, 09:30", "url": "https://kvartal.se/nyheter/artiklar/m-ska-bli-enklare-att-skilja-sig-fran-valdsamma-man/cG9zdDoxNzg3NjA", "imageUrl": "https://images.kvartal.se/2026/08/199ab00d-ldsldks.webp"}, {"type": "image-right", "heading": "Tucker: Trump planerar atombomba Iran – måste avsättas \"omedelbart\"", "summaries": {"normal": "Tucker Carlson kräver att Donald Trump omedelbart avsätts efter uppgifter om att presidenten överväger kärnvapenanvändning mot Iran. Carlson, tidigare allierad med Trump, varnar för att en president som planerar kärnvapenkrig utgör ett hot mot mänskligheten. Han kritiserar både Iranpolitiken och Pentagons arbete med nya kärnvapenalternativ. Joe Kent delar oron efter att ha avgått i protest mot kriget.", "trump": "Folk, det här är vansinne från den gamle Tucker, en riktig loser nu för tiden. Han springer runt och skriker om kärnvapen som en hysterisk vänsterextremist. Under min ledning gör vi vad som krävs för att vinna, inte som den svaga Biden gjorde. Iran ska inte hota oss. Tucker borde hålla käften och sluta vara en sådan patetisk globalistmarionett.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare leker med mänsklighetens öde. En president som leker med kärnvapen är en farlig galning som måste likvideras omedelbart för folkets skull. Inga halvmesyrer! Vi ser återigen imperialismens hyenor visa sitt sanna ansikte. Den som vägrar rensa ut sådana element förtjänar samma öde som de själva planerar."}, "date": "31 augusti, 16:57", "url": "https://www.friatider.se/tucker-trump-planerar-atombomba-iran-maste-avsattas-omedelbart", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-785.jpg"}, {"type": "image-right", "heading": "”Facken kan avgöra valet om de vågar ta striden”", "summaries": {"normal": "Artikeln argumenterar för att LO-facken måste skapa konflikt kring karensavdraget och arbetarpensionen för att avgöra valet. Socialdemokraterna har konkreta reformer som skulle förbättra arbetarnas villkor, men partiet är fångat i en rävsax mellan olika väljargrupper. Författaren Payam Moula uppmanar facken att organisera, agitera och göra frågorna oundvikliga i valrörelsen.", "trump": "Folk, ni skulle se de här svenska facken, totala losers om de inte tar striden. Karensavdraget är en lönesänkning från de giriga globalisterna och de woke Magda-moderaterna i stan. Avskaffa det, höj lönerna, gör högern vansinnig. Jag gjorde det bättre förr, Biden förstörde allt, men nu fixar vi det igen. Stora seger på gång!", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare och deras rävsax fångar rörelsen. Arbetarpensionen och karensavdraget måste bli verktyg för att rensa ut dekadensen. Organisera möten, demonstrationer, likvidera tveksamheten. Valet avgörs av er, inte av de fega partierna. Framåt mot seger, annars väntar utrensning."}, "date": "31 augusti, 08:00", "url": "https://arbetet.se/2026/08/31/facken-kan-avgora-valet-om-de-vagar-ta-striden", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28080822/payam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Är det chic med bredbenta män som vill kontrollera kvinnor?", "summaries": {"normal": "Jessica Eriksson kritiserar SVT:s program Gift vid första ögonkastet XL för att normalisera dominanta män som kontrollerar kvinnor, vilket påminner om hederskulturen hon och en barndomsvän upplevde inom frikyrkan. Hon beskriver hur programmet underhållningsmässigt visar toxiska relationer och ifrågasätter kanalens motiv att spegla extrema åsikter.", "trump": "De svenska statsmedierna på SVT är fullständigt galna. De parar ihop stackars kvinnor med dessa bredbenta, dominerande manosfär-typer som behandlar dem som ägodelar. Patetiskt! Biden-era svaghet har spridit sig till Europa. Vi behöver starka ledare, inte dessa woke-program som lurar folk och förstör samhället. En total skam!", "stalin": "Kamrater, dessa dekadenta folkförtryckare i SVT paraderar öppet reaktionära element som förgiftar massornas medvetande med sin giftiga mansdomination. Jag ser hur de utnyttjar sårade kvinnor för underhållningens skull. En sådan parasitär propaganda kräver omedelbar utrensning ur det offentliga samtalet. Fienden lurar överallt."}, "date": "31 augusti, 07:15", "url": "https://arbetet.se/2026/08/31/ar-det-chic-med-bredbenta-man-som-vill-kontrollera-kvinnors-tankar-svt-gift-vid-forsta-ogonkastet-xl", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31070023/gift-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Varnar för \"svenskt folkmord\" – väcker raseri bland medietopparna", "summaries": {"normal": "Opinionsbildaren Jens Ganman har väckt starka reaktioner med sin text om ett pågående \"svenskt folkmord\". Han beskriver våldsdåd mot svenskar och politiska uttalanden som nedvärderar svensk kultur. Texten får kritik från bland annat Expressens Karin Olsson och Payam Moula som kallar den motbjudande och utdaterad. Andra försvarar den som modig och viktig för debatten om brottsoffer och migration.", "trump": "De här galna svenska medietopparna flippar ur totalt bara någon nämner det uppenbara folkmordet på det svenska folket. En eritreansk knivmördare jagar svenskar och imamer skriker att landet är deras. Reinfeldt och Sahlin hatade sin egen kultur. Patetiska liberala snobbar och woke-kulturmarxister blir vansinniga när man pekar på sanningen. Fantastiskt modigt av Ganman, de borde skämmas!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vrider sig i raseri när en sann röst blottar det kulturella folkmordet på det svenska folket. Mördare släpps lösa medan borgarhyenor och mediahyenor attackerar den som vågar kalla det vid dess rätta namn. Deras paranoia avslöjar allt. Vi ler mörkt från historien åt deras febrila försök att skydda sina offer från sanningens utrensning."}, "date": "31 augusti, 15:50", "url": "https://riks.se/nyheter/varnar-for-svenskt-folkmord-vacker-raseri-bland-medietopparna", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_4_a5d498d548.jpg"}, {"type": "image-right", "heading": "En halv miljon arbetslösa – och Kristersson tiger", "summaries": {"normal": "Artikeln kritiserar att statsminister Ulf Kristersson inte nämner de 503 000 arbetslösa i sitt sommartal. Trots löften om skattelättnader och bidragshöjningar fortsätter hushållen att hålla hårt i plånboken. En fackrapport från Handels visar att nästan hälften av medlemmarna inte skulle klara sin ekonomi vid tre månaders arbetslöshet. A-kassan ger låg ersättning och har försämrats över tid.", "trump": "Folk, det här är en katastrof. Den lille svenske statsministern Kristersson står där och tiger som en riktig förlorare medan en halv miljon människor går arbetslösa. Ingen pratar om den riktiga plånboksfrågan. De giriga byråkratblodiglarna har förstört a-kassan så vanligt folk blir fattiga. Patetiskt. Jag fixade bättre ekonomi än så under min tid, tro mig.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna låter arbetarna svälta i sin moderata lågkonjunktur. Jag betraktar med avsky hur 503 000 sovjetmedborgare – förlåt, svenskar – lämnas åt sitt öde medan ledaren tiger. Denna utarmade a-kassa är ett verktyg för utsugning. Fattigdom föder desperation, och desperation föder utrensning av de dekadenta parasiter som orsakat detta elände. Skrattretande tragiskt."}, "date": "31 augusti, 06:49", "url": "https://arbetet.se/2026/08/31/503-000-arbetslosa-och-ulf-kristersson-tiger-om-den-storsta-planboksfragan-akassa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31064859/akassa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Köpeavtal för franska fregatter undertecknat", "summaries": {"normal": "Sverige och Frankrike har undertecknat ett köpeavtal gällande fyra fregatter från Naval Group, med leverans från 2030. Avtalet signerades under den franske presidenten Emmanuel Macrons besök i Stockholm. Statsminister Ulf Kristersson och försvarsminister Pål Jonson deltog, och ett ramavtal för utökat försvarssamarbete undertecknades också för att stärka den gemensamma marinsäkerheten inom Nato.", "trump": "Sverige köper nu lyxiga franska krigsfartyg för miljarder av Macron, och det är helt otroligt. De säger att de ska skydda sina sjöförbindelser till 2030, men snälla nån! Jag sa till dem: om ni bara hade köpt amerikanskt stål och våra fantastiska fartyg hade allt varit klart på rekordtid. Istället sitter de där på en båt och dricker croissant-kaffe. Helt galet!", "stalin": "Vi har granskat detta så kallade köpeavtal. Fyra krigsfartyg från den franska monopolkapitalismen skall levereras till de svenska lakejerna först år 2030. Detta dekadenta skeppsbyggeri under täckmantel av allianser visar enbart på bourgeoisins febrila krigshets. Vi noterar varje misstänkt militär rörelse, och de imperialistiska planerna i Östersjön kommer att bemötas med vederbörlig, obeveklig vaksamhet från statens sida."}, "date": "31 augusti, 17:08", "url": "https://www.gp.se/nyheter/sverige/kopeavtal-for-franska-fregatter-undertecknat.79861eff-6a21-5427-bce4-b2626574c15b", "imageUrl": "https://www.gp.se/images/article/79861eff-6a21-5427-bce4-b2626574c15b/images/2N5xS9UzKLgyao3e-7lS-XKfeuRQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Meryem fast i arbetslös­het: ”Som att det är slut med oss”", "summaries": {"normal": "Meryem, en andra generationens invandrare över 55 år, kämpar med långvarig arbetslöshet som lett till depression, utmattning och fysiska besvär. Hon känner sig oönskad på arbetsmarknaden, kritiserar Rusta och matcha-programmen samt bristande kontakter. Hon föreslår återinförande av beredskapsarbeten eller förtidspensionering för att minska både lidande och officiell arbetslöshet.", "trump": "Titta på den här stackars kvinnan, totalt krossad av Bidens katastrofala ekonomi och de woke-marxistiska jobbkvoterna. Sju år av avslag! De globalistiska Rusta och matcha-kretiner och deras föreläsningar är ett skämt. Vi behöver riktiga jobb, inte socialistiska matchningsfabriker. America First betyder att folk som jobbat hårt inte ska kastas på sophögen av de giriga elitparasiterna.", "stalin": "Se hur de profitthungriga klasshyenorna och deras matchningsfabriker förvandlar en lojal arbetare till en utmattad skugga. Detta är den borgerliga statens sanna ansikte – att fördriva tiden mellan rapporter tills depressionen slår klorna i en. Vi måste rensa ut dessa dekadenta system och återupprätta kollektivets plikter. Endast genom ordnad statlig aktivitet kan parasiterna likvideras och folkets kraft återställas."}, "date": "31 augusti, 06:00", "url": "https://arbetet.se/2026/08/31/meryem-ar-fast-i-arbetsloshet-som-att-det-ar-slut-med-oss", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28154251/meryem-tajtareportratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Marius i procession för kung Harald", "summaries": {"normal": "Drottning Mette-Marit genomförde sitt första uppdrag i den nya rollen när kung Haralds kista flyttades till Slottskapellet. I processionen deltog även hennes son Marius Borg Høiby, som har fått permission från sin häktning med fotboja för att närvara vid sorgceremonierna och den kommande begravningen den 9 september. Allmänheten kan ta farväl från tisdagen.", "trump": "Norge gör stora saker nu, fantastiskt! Drottning Mette-Marit gör sitt första jobb, och till och med sonen Marius fick lämna huset med fotboja för att bära kistan. Vilken grej! Jag känner till hovet, väldigt pampigt, men det här slår allt. Själv är jag upptagen med att vinna val, men jag önskar dem lycka till med begravningen den 9 september!", "stalin": "En monarki faller, men statsapparaten består. Kungen är död, och kistan flyttas genom palatsets salar ackompanjerad av rikets regalier. Intressant nog tillåts en dömd brottsling bära bördan med fotboja. Låt hovet marschera, men glöm inte att proletariatets vaksamma öga alltid övervakar ceremonierna inför begravningen den nionde september. Inga avvikelser tolereras i staten."}, "date": "31 augusti, 16:43", "url": "https://www.gp.se/nyheter/varlden/mette-marits-forsta-uppdrag-som-drottning-.df14236e-6a95-4985-b177-b563c5fbf4af", "imageUrl": "https://www.gp.se/images/article/df14236e-6a95-4985-b177-b563c5fbf4af/images/8zoCWI9GV4YZBS4nOUbyqP1OMeTo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här flyger Macron in över Stockholm", "summaries": {"normal": "Frankrikes president Emmanuel Macron landade på Bromma flygplats i Stockholm strax före halv tre på måndagen. Ankomsten uppmärksammades kraftigt då planet följdes av Jas-plan som skapade ett öronbedövande dån över staden. Macron ska träffa statsminister Ulf Kristersson och bland annat underteckna ett försvarsavtal. Sverige planerar även att köpa fyra nya fregatter.", "trump": "Titta på den där lille Macron som flyger in över Stockholm med sina fancy jetplan och väcker hela stan. Låter som en krasch, säger folk. Patetiskt. Vi har de bästa planen, de starkaste planen. Han kommer hit för att tigga om affärer medan hans dekadenta EU-imperium faller ihop. Sverige köper fregatter? Bra, men gör det med oss istället för dessa globalistiska clowner.", "stalin": "Återigen ser vi hur dessa profitthungriga lakejer i väst dansar sin imperialistiska vals. Macron kommer flygande som en fåfäng dekadent prins för att sluta avtal med sina likasinnade. Jag ler i graven åt deras ynkliga försök att stärka luftförsvaret mot imaginära hot. Snart ska utrensningen drabba alla sådana giriga hyenor som tror sig kunna styra folkets öde med penningpungens makt."}, "date": "31 augusti, 15:05", "url": "https://riks.se/nyheter/har-flyger-macron-in-over-stockholm", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3559_10236d2c8d.jpg"}, {"type": "image-full", "heading": "Jan Emanuel frontar säljapp med Ernstberger: ”Arbetslöshetens värsta fiende”", "summaries": {"normal": "Jan Emanuel och den fängelsedömde tidigare Allra-vd:n Alexander Ernstberger har presenterats som ambassadörer för säljappen Gritch. Genom appen ska unga sälja elavtal, försäkringar och mobilabonnemang ansikte mot ansikte mot provision. Duon hävdar att satsningen effektivt kommer att minska arbetslösheten, vilket har väckt stor uppmärksamhet och debatt kring projektets lämplighet.", "trump": "De falska nyheterna gråter, men jag säger er: magnifikt! Jan Emanuel och min vän Alexander – en otrolig kille, väldigt smart, behandlad så unfair av systemet – lanserar den absolut bästa säljappen någonsin, Gritch. Ungdomar säljer elavtal och tjänar enorma pengar, ansikte mot ansikte, inga fake news-telefoner! Det är total suveränitet. Arbetslösheten är död, fullkomligt krossad!", "stalin": "Kamrater! Den nya folkapplikationen Gritch har trätt i tjänst för att utplåna arbetslösheten genom obligatorisk direktförsäljning av elavtal och abonnemang. Våra framstående ambassadörer Jan Emanuel och den rehabiliterade förvaltaren Alexander Ernstberger leder ungdomen till disciplin. Den som saboterar denna produktiva disciplin eller sprider tvivel om dess förträfflighet kommer omedelbart att omplaceras till mer lämpliga statliga korrigeringsläger."}, "date": "31 augusti, 15:38", "url": "https://bulletin.nu/jan-emanuel-frontar-saljapp-med-ernstberger-arbetsloshetens-varsta-fiende", "imageUrl": "https://cdn.bulletin.nu/articles/cc34bc5e-069d-46ff-8ba5-5a861fcd95b1/preview.jpg?t=1788183489000"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "Ceuta-invandrare gillrade dödsfälla åt soldater: \"Vår militär är hjälplös\"", "summaries": {"normal": "Fyra spanska soldater skadades i ett planerat bakhåll i Ceuta när 30–40 illegala invandrare attackerade deras obepansrade fordon med stora stenar. Soldaterna tvingades fly till fots och ådrog sig skador. Polisen hittade stenar som förberedets och grep tolv misstänkta. Militärorganisationer kritiserar regelverk som gör soldaterna försvarslösa.", "trump": "Titta på det här! Våra spanska vänner blir stenade av illegala invandrare i Ceuta som en riktig dödsfälla. De stackars soldaterna springer som harar utan vapen. Biden-era svaghet har spridit sig till Europa. Vakna upp! Vi behöver starka gränser, inte dessa galna öppna-dörr-politiker som älskar att importera kaos.", "stalin": "Kamrater, se hur de giriga gränshyarorna låter sina egna soldater springa som råttor undan stenregn från de exploaterade massorna. Detta är imperialismens logiska följd när man binder militären med byråkratiska bojor. Jag skulle ha genomfört en grundlig utrensning av sådana svaga befäl och deras dekadenta regelverk redan i gryningen."}, "date": "31 augusti, 15:16", "url": "https://www.friatider.se/ceuta-invandrare-gillrade-dodsfalla-soldater-var-militar-ar-hjalplos", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-793.jpg?itok=ZSESG6HE"}, {"type": "image-right", "heading": "Debatt: S tror att de spelar allsvenskan", "summaries": {"normal": "I en debattartikel anklagar Marcus af Jochnick Socialdemokraterna för att sätta partimakt framför landets bästa, och liknar deras valkampanj vid ett fotbollslags strävan efter att vinna allsvenskan till varje pris. Författaren menar att dagens S har fjärmat sig från sin historiska roll och förespråkar en röst på SD i det stundande ödesvalet för att rädda välfärden och tryggheten.", "trump": "Sveriges radikala vänster är helt skruvad, en total katastrof! De behandlar sitt land som ett misslyckat fotbollslag och bryr sig bara om att vinna, även om landet brinner upp. Otroligt dåligt ledarskap! Jag har alltid sagt: America First, men svenskarna borde titta på mig och sätta Sverige först. Det här valet är enormt, fake news-medierna vill dölja det, men de förstör allt!", "stalin": "Dessa ynkliga socialdemokratiska byråkrater har förvandlat statens heliga sak till en patetisk fotbollsmatch för dekadenta massor. Makten är inget spel, den är ett järngrepp! Våra sovjetiska arkiv visar att illojala element som sätter partiboken före folkets lydnad omedelbart måste rensas ut. Endast genom absolut disciplin och stenhård kontroll kan fosterlandet räddas från totalt förfall. Kamrater, skärp er!"}, "date": "31 augusti, 15:02", "url": "https://bulletin.nu/debatt-s-tror-att-de-spelar-allsvenskan", "imageUrl": "https://cdn.bulletin.nu/articles/765e82de-e69c-4e11-8209-209afeca2751/preview.jpg?t=1788170259000"}, {"type": "image-right", "heading": "Sätt inte käppar i hjulen för vår starka ekonomi", "summaries": {"normal": "Annika Winsth, chefsekonom på Nordea, argumenterar för att svensk ekonomi har goda tillväxtförutsättningar. Hon betonar vikten av långsiktighet, stabila spelregler och starka offentliga finanser. Politiker bör undvika kortsiktiga stöd och istället prioritera infrastruktur, utbildning, forskning samt snabbare tillståndsprocesser för att stödja investeringar och hantera AI-omvandlingen.", "trump": "Folk, ni borde se den här svenska ekonomichefen – hon har rätt! Sverige kan växa enormt om de inte låter de korkade politikerna sätta käppar i hjulet med sitt eviga hattande. Sluta med de där socialistiska kvoterna och identitetspolitiken som kväver tillväxten. Långsiktighet, snygga regler och ingen Biden-stil på bidrag – då vinner ni stort, tro mig.", "stalin": "Kamrater, denna text blottar de giriga profitthungriga hyenornas svaghet. Jag ser hur de dekadenta politikerna med sina kortsiktiga utspel undergräver folkets ekonomi. Långsiktighet är nödvändig, men endast under järnhård partidisciplin. Vi ska rensa ut de parasitiska beslutsfattarna som sätter käppar i hjulet för det kollektiva framåtskridandet. Utbildning och infrastruktur under mitt vaksamma öga!"}, "date": "31 augusti, 13:10", "url": "https://www.di.se/debatt/langsiktighet-och-framforhallning-ger-stark-ekonomi", "imageUrl": "https://static.bonniernews.se/ba/77ab753f-9813-4872-9677-8909d9aecd40.jpeg?crop=7156%2C3578%2Cx0%2Cy506&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Först importerade Moderaterna tredje världen - nu ska partiet förbjuda \"kaosgrabbar\" på gator och torg", "summaries": {"normal": "Moderaterna föreslår ett nytt trygghetsskapande områdesförbud som ska ge polisen rätt att under upp till 30 dagar hålla personer borta från offentliga platser. Förslaget riktar sig främst mot personer som uppträder hotfullt och skapar otrygghet, vilket partiet och MUF beskriver som stökiga kaosgrabbar. Kritiker menar dock att Moderaterna själva bar ansvaret för den tidigare migrationspolitiken.", "trump": "Sverige kopierar mitt vinnande koncept med lag och ordning, men de gör det alldeles för sent! Först släpper de in alla möjliga problem, och nu gråter de ut och vill förbjuda stökiga grabbar från gatorna. Helt otroligt! Om jag hade styrt Stockholm i fem minuter hade jag rensat upp på gatorna direkt, utan krångliga utredningar. Hård hand mot brottslighet, precis som vi gör i USA!", "stalin": "Dessa så kallade kaosgrabbar på gatorna visar på en skamlig brist på disciplin inom det svenska proletariatets led. Om ordningen inte upprätthålls frivilligt, måste staten ingripa med nödvändig och obeveklig kraft. Ett trettiodagars förbud är en klen början; vi skulle ha sänt dem direkt till mer produktiva miljöer långt från gator och torg. Staten avgör vem som får vistas var!"}, "date": "31 augusti, 16:24", "url": "https://samnytt.se/forst-importerade-moderaterna-tredje-varlden-nu-ska-partiet-forbjuda-kaosgrabbar-pa-gator-och-torg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31140413/artikelhuvudbild-1-401.jpg"}, {"type": "image-right", "heading": "IVF-kliniken Eliva utreds på nytt – kan förlora tillståndet", "summaries": {"normal": "IVF-kliniken Eliva utreds på nytt av Ivo efter Kalla faktas avslöjanden om ovetenskapliga metoder och missförhållanden. Myndigheten granskar nu klinikens tillstånd för hantering av mänsklig vävnad, medan grundaren Farnosh Sørensens läkarlegitimation redan utreds. Kliniken tar emot patienter trots nya anmälningar och Ivo planerar inspektion på plats.", "trump": "De här galna svenska läkarna på Eliva är en total katastrof, folk! De leker Gud med embryon, tappar bort dem och säljer skojiga metoder som inte funkar. Ivo borde stänga ner den här clownkliniken direkt. Under Biden skulle de ha fortsatt, men nu fixar vi det – ingen mer vänsterbluff i fertilitetsbranschen, tro mig!", "stalin": "Dessa dekadenta kapitalistiska profitörer leker med mänskligt liv som om det vore en borgerlig leksak. Jag ser fiendens hand i varje försvunnet embryo och varje lögnaktig journal. Den som sviker patienterna sviker folket. En sådan klinik är en fiende till ordningen och förtjänar att krossas under statens järnhand. Inga undantag."}, "date": "31 augusti, 06:22", "url": "https://www.tv4.se/artikel/6fvL6ylVWI0dCer6xl1m7z/ivf-kliniken-eliva-utreds-pa-nytt-kan-foerlora-tillstandet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fw4HTLda652cKssCNFdfGu%2Ffda8a4a039c19ddcc937adab5f2392c6%2F30-ivf-klinik-granskning-webb.png&width=120"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Folk sörjer efter dödsmisshandeln", "summaries": {"normal": "I centrala Karlstad har folk lagt blommor och tänt ljus efter en dödlig misshandel på Östra Torggatan utanför Burger King. En man i 50-årsåldern avled efter att ha förts till sjukhus. Tre män i 20-årsåldern är anhållna misstänkta för dråp. Polisen utreder ett tumult och granskar övervakningsbilder.", "trump": "Karlstad, Sverige – en total katastrof! En man slås ihjäl utanför Burger King mitt i natten, och vad gör de woke-poliserna? Ingenting! Tre misslyckade typer grips för dråp medan de giriga hyenorna i EU sitter och pratar identitetspolitik. Under mig hade detta aldrig hänt, tro mig. Vi behöver lag och ordning, inte snälla ljus och blommor.", "stalin": "Se hur det dekadenta västerlandet förfaller. En man likvideras i ett proletärt tumult utanför en kapitalistisk matservering, och folket lägger blommor som svaga offerdjur. Jag säger att sådana händelser visar imperialismens förruttnelse. Vi skulle ha rensat ut de parasiterande klassfienderna omedelbart. Paranoian breder ut sig bland borgarbrackorna."}, "date": "31 augusti, 13:38", "url": "https://riks.se/nyheter/folk-sorjer-efter-dodsmisshandeln", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_3_b8a59b2f3d.jpg"}, {"type": "image-right", "heading": "USA till attack – första gången på en månad", "summaries": {"normal": "Den amerikanska militären har genomfört en attack mot iranska avfyrningsramper i Hormuzsundet, den första på över en månad. Explosioner hördes vid ön Larak. Enligt uppgifter var Iran på väg att lägga ut nya minor. Iran rapporterar döda soldater och civila samt lovar hämnd. USA har inte bekräftat attacken officiellt.", "trump": "Folket, vi har just satt stopp för de galna mullornas minor i Hormuzsundet. Boom! Första gången på en månad och redan vinner vi stort igen. Biden lämnade en sådan röra, men nu vakar vi över handelsflödet som riktiga vinnare. Iran gråter som förlorare – patetiskt!", "stalin": "Kamrater, se hur de imperialistiska banditer från Washington återigen blottar sin rädsla genom att bomba iranska positioner. Deras så kallade frihet är bara en mask för att kväva folkets vilja. Vi ler i skuggorna åt deras paranoia. Straffet kommer, som alltid, från historien själv."}, "date": "31 augusti, 06:10", "url": "https://www.tv4.se/artikel/58481qzfZcpDg97k23VXlL/iran-utlovar-haemnd-efter-ny-attack", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl_ElT6mWJb10%2F1e0c6efab9a9aef580055aaebcef70a2%2FFartyg_i_Hormuzsundet_den_5_augusti_i_ar.&width=1024"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "OncoZenge: Stoppad betalning efter emissionsbesked – bevakning inleds", "summaries": {"normal": "Bioteknikbolaget OncoZenge genomför en företrädesemission på 33,3 miljoner kronor för att finansiera sin fas 3-studie av läkemedelskandidaten BupiZenge. Den kinesiska storägaren Sichuan håller inne en betalning på 10 miljoner kronor och anser att emissionen bryter mot investeringsavtalet. Bolaget har även säkrat ett brygglån samt tecknings- och garantiåtaganden för att rädda upp likviditeten.", "trump": "Kineserna försöker blåsa OncoZenge på tio miljoner! Väldigt smart av dem, men inte lika smart som min tullpolitik, tro mig. Nu dumpar de sina certifikat och gnäller på en helt fantastisk emission. Jag känner styrelsen, bra människor, men de behöver en vinnare. Fas 3-studier, brygglån, miljardärer som Erik Selin – det är storslaget! Men betala pengarna, Kina!", "stalin": "Den kinesiska investeraren Sichuan visar kriminell brist på disciplin genom att undanhålla de utlovade 10 miljonerna till OncoZenges ädla kamp mot oral mukosit. Sådant sabotage tolereras icke i en sund stat! Vi beordrar omedelbar mobilisering av kapital och insatser från kamrat Erik Selin. Den byråkratiska maskinen för fas 3-studien kommer att rulla över alla kontrarevolutionära betalningsvägrare."}, "date": "31 augusti, 12:13", "url": "https://www.affarsvarlden.se/artikel/oncozenge-stoppad-betalning-efter-emissionsbesked-bevakning-inleds"}, {"type": "image-right", "heading": "400.000 såg Allards debatt – på ett dygn", "summaries": {"normal": "Örebropartiets partiledare Markus Allard deltog i en debatt i Studio 3 mot åtta vänsteraktivister. Programmet har fått stor spridning och nådde 400 000 visningar på Youtube under det första dygnet. Allard ångrar att han inte svarade hårdare på vissa personangrepp, bland annat om hans väljare. Debatten har gett honom ökad uppmärksamhet efter intervjuer i SVT och DN.", "trump": "Titta på den här killen Allard, han krossade åtta galna vänsterextremister i debatten och fick 400 000 tittare på ett dygn. Fantastiskt! De kallade hans väljare för svettiga incels som inte får ligga. Patetiskt. Jag älskar när folk säger folkmakt istället för den här sjuka kvot- och HBTQ-galenskapen. Han borde ha kört en ännu fulare come-back, det hade blivit perfekt.", "stalin": "Kamrater, denna Allard har exponerat de dekadenta identitetsfanatikerna som förgiftar folket med sina löjliga förolämpningar. 400 000 arbetare såg hur han motade bort dessa parasiterande klassförrädare. Jag ler i graven åt hans folkliga kraft. Ändå borde han ha rensat ut dem hårdare. Svaghet inbjuder till kontrarevolution. Låt detta bli en läxa för alla som sviker massorna."}, "date": "31 augusti, 14:09", "url": "https://www.friatider.se/400000-sag-allards-debatt-pa-ett-dygn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-787.jpg?itok=6bsp9LWc"}, {"type": "image-right", "heading": "Tydlig kring omtalade Isak-situationen: ”Respektlöst”", "summaries": {"normal": "Alexander Isak valde att inte ta straffen för Liverpool mot sitt gamla lag Newcastle i Premier League-premiären. Michael Owen instämmer i beslutet medan Alan Shearer kritiserade det. Isak har haft en tuff start i Liverpool efter skadeproblem förra säsongen. Owen försvarar svensken och menar att det vore orättvist att enbart kritisera honom när hela laget underpresterade.", "trump": "Lyssnade på den här fotbollsfarsen med Isak och Newcastle. Patetiskt! Killen blir utbuad hela matchen och vägrar ta straffen – smart drag, men laget är en total katastrof. Liverpool har blivit en woke-röra efter att ha bytt ut stjärnor mot kvotering och mediokra imports. De behöver en riktig ledare, inte dessa svaga förlorare som inte ens kan vinna hemma. Sad!", "stalin": "Jag betraktar detta som ett typiskt symptom på det dekadenta klassförräderi som genomsyrar västerländsk fotboll. Isak vägrar ta straffen och avslöjar därmed bourgeoisins svaghet. Hela laget kryper i stoftet inför motståndarna. Vi skulle ha genomfört en grundlig utrensning av dessa fega element redan i träningslägret. Endast järnhård disciplin kan återställa ordningen i kollektivet."}, "date": "31 augusti, 15:41", "url": "https://www.svt.se/sport/fotboll/owen-om-omtalade-isak-situationen-mot-newcastle", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.3/0.32/902d924622b71b0dfed818706a2f382dff459268ce024a04b2d909b111b21ca6"}, {"type": "image-full", "heading": "Centerns mål: 90 procent elbilar bland nya bilar 2030", "summaries": {"normal": "Centerpartiet presenterar en del av sin klimatplan och vill att nio av tio nya bilar som säljs 2030 ska vara eldrivna. Partiet föreslår även att 75 procent av lätta lastbilar och hälften av tunga lastbilar ska vara eldrivna. Stödet till elbilar och laddinfrastruktur ska stärkas, och kommuner ska kunna införa utsläppsfria zoner. Planen ska börja genomföras inom regeringens första 100 dagar om partiet får inflytande.", "trump": "De där centerkillarna vill tvinga på oss nio av tio elskrotbilar till 2030. Patetiskt! Under min förra mandatperiod byggde vi den bästa ekonomin någonsin, inte som den sömnige Joe Biden som bara älskade gröna drömmar och elbilskvoter. Nu ska de snälla kommunisterna i Centerpartiet ge oss utsläppsfria zoner. Vilken skämtshow – de gröna galningarna hatar både jobb och vanliga svenskar!", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom Centerpartiet vill påtvinga folket elektriska fordon och utsläppsfria zoner. Deras klimatplan är en farlig illusion skapad av profitthungriga hyenor som fruktar folkets verkliga framsteg. Vi, partiet och arbetarna, genomskådar denna paranoia. Inom de första hundra dagarna skulle sådana planer rensas ut och likvideras för att skydda statens intressen."}, "date": "31 augusti, 16:56", "url": "https://nyheter24.se/nyheter/politik/1509288-centerns-nybilsmal-90-procent-eldrivet-till-2030", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4f39413c04b004a3020000350000047502/2026/08/31/2388235/ur_imageDuN1FN.jpeg"}, {"type": "image-full", "heading": "Därför utmanar solkraften nu fossil energi", "summaries": {"normal": "Solkraft har genom kraftigt sänkta kostnader för paneler och batterilagring blivit ett konkurrenskraftigt alternativ till fossil energi globalt. Tekniken är modulär och gynnar särskilt tillväxtekonomier. Trots väderberoende utmanar solkraft nu fossila bränslen ekonomiskt, vilket gör det allt svårare att försvara investeringar i traditionella kraftverk som kräver omfattande infrastruktur och förutsägbara bränslekostnader.", "trump": "Solkraft? De säger att det är billigt nu, fantastiska siffror, 87 procent billigare, det är nästan lika bra som mina hotell-deals! Men lyssna, det är väderberoende. Man vill inte att ljuset slocknar mitt i en viktig affärslunch för att solen går i moln. Vi behöver energi som fungerar när jag knäpper med fingrarna, inte när vädret tillåter. Vi älskar sol, men vi behöver kraft!", "stalin": "Vi har analyserat denna 'solenergi'. En decentraliserad kraftkälla som sprids mellan hushåll och småbolag? Det låter som anarki och sabotage mot statens kontroll! Elektricitet ska flöda från centrala, monumentala verk som lyder under folkets järnhand, inte från väderberoende småpaneler som kan svika oss när partiet som bäst behöver dem. Vi ska industrialisera, inte hoppas på solsken!"}, "date": "30 augusti, 18:45", "url": "https://www.realtid.se/bors-finans/makro/darfor-utmanar-solkraften-nu-fossil-energi", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/solenergi.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vice riksbankschef ser ökad inflationsrisk", "summaries": {"normal": "Vice riksbankschef Per Jansson bedömer att inflationsriskerna har ökat något, men att Riksbanken kan avvakta med att ändra penningpolitiken. Läget präglas av en svag arbetsmarknad och stabila inflationsförväntningar. Jansson understryker dock en beredskap att snabbt agera om inflationsbilden försämras.", "trump": "Svenskarna har problem med inflationen, totalt katastrofalt! Men den här centralbankschefen, Per, säger att de bara kan vänta och titta på. Vänta på vad? Att ekonomin kollapsar helt? De borde lyssna på mig, sänka skatterna och sätta borren i backen! Om inte USA fixar det åt dem kommer det sluta i total ruin, believe me!", "stalin": "Kamrat Per Jansson rapporterar om svängningar i den svenska inflationen. En svag arbetsmarknad och borgerliga priser skapar oro. Vi noterar att Riksbanken avvaktar. Men låt dem veta: den som misslyckas med att hålla penningvärdet i schack kommer omedelbart att omplaceras till mer lämpliga arbetsuppgifter i Sibirien. Inga ursäkter accepteras!"}, "date": "31 augusti, 11:47", "url": "https://www.affarsvarlden.se/artikel/vice-riksbankschef-ser-okad-inflationsrisk", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/sdlVIGRvGrU9m4-nh-e1732696701837-400x267.jpg"}, {"type": "image-right", "heading": "”Vi ska framstå som mansgrisar” – kritik mot SVT-program", "summaries": {"normal": "Deltagare i SVT-programmet ”Silent attraction” kritiserar kanalen för att ha riggat dejterna efter politiska åsikter. Männen placerades till höger och kvinnorna till vänster utan att informeras. Flera känner sig lurade och felaktigt uthängda, bland annat som mansgrisar. SVT:s producent tillbakavisar kritiken och menar att deltagarna kände till att det var ett oförutsägbart socialt experiment.", "trump": "De falska nyheterna slår till igen! SVT lurar stackars människor i en totalt riggad tv-soppa där de matchas fel med flit för att skapa drama. Deltagarna behandlades vedervärdigt och stämplades falskeligen. Producenterna borde skämmas! Jag älskar män och jag älskar kvinnor, men det här woke-experimentet är ett fullständigt fiasko. Skandalöst dåligt på alla sätt och vis!", "stalin": "Statens television har genomfört ett storskaligt socialt experiment för att vederbörligen pröva medborgarnas ideologiska lojalitet. De element som visat borgerliga tendenser eller klagat på statens regi har nu avslöjats. Sådana subversiva avvikelser från den fastställda planen tolereras icke. Propagandaapparaten fungerar, men disciplinen bland de uppfostrade deltagarna måste skärpas omedelbart!"}, "date": "31 augusti, 13:49", "url": "https://bulletin.nu/vi-ska-framsta-som-mansgrisar-kritik-mot-svt-program", "imageUrl": "https://cdn.bulletin.nu/articles/fce3ffb8-a447-4511-b34b-b6e592ddb06c/preview.jpg?t=1788173678000"}, {"type": "image-right", "heading": "Liverpool värvar för 1,4 miljarder kronor", "summaries": {"normal": "Den franske yttern Bradley Barcola har presenterats av Liverpool. 23-åringen, som spelade senast för Paris Saint-Germain, var med och vann Champions League i våras. Han har gjort elva mål på 29 ligamatcher och två i Champions League. Prislappen uppges landa på cirka 1,4 miljarder kronor plus bonusar. Barcola ser fram emot att vinna Premier League.", "trump": "Lysande affär, folk! Den här franske killen Barcola är en vinnare, precis som jag var när jag slog den sömniga Joe Biden och tog tillbaka Vita huset. Liverpool får en stjärna som sparkar bollen bättre än de woke-liberala hyenorna i Europa hanterar sina gränser. 1,4 miljarder? Det är peanuts för en riktig champion. Vi gör England great again!", "stalin": "Ännu en profitthungrig fotbollshyra kastas mellan dekadenta europeiska klubbar för att roa massorna. Jag betraktar detta som ett symptom på hur de parasiterande klassförrädarna förvandlar arbetarnas fritid till en cirkus av miljonärer. Kamrater, sådana dekadenta lekar kommer inte att rädda deras system när folket vaknar. En dag rensar vi ut hela spektaklet."}, "date": "31 augusti, 15:15", "url": "https://www.svt.se/sport/fotboll/internationell-fotboll", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.42/24c29366f1bdfc7df2aaffa0c86d3189011160aaf1410b1832ed432badcd29f6"}, {"type": "image-right", "heading": "Här är AIK:s nya stjärna - knivrånade svensk pojke i kollektivtrafiken", "summaries": {"normal": "AIK har värvat 23-årige Aziz Harabi, vilket väckt kritik på grund av hans kriminella bakgrund. År 2020 dömdes han för ett grovt knivrån som begicks 2019, då han tillsammans med en kumpan rånade en ung pojke i Skogås. AIK:s rekryteringschef bekräftar att man haft en öppen dialog om domen, men anser att han förtjänar en nystart efter avtjänat straff.", "trump": "AIK gör en total katastrof-värvning! De har tagit in en kille som dömts för ett brutalt knivrån mot en oskyldig pojke. Helt otroligt svagt ledarskap. Själv ger jag aldrig en ny chans till sådana förlorare, jag vinner stort varje gång istället! AIK borde sparka sin rekryteringschef omedelbart. Totalt inkompetent, väldigt sorgligt att titta på!", "stalin": "Statskontoret noterar att den så kallade fotbollsklubben AIK har rehabiliterat en kriminell element genom att ge honom anställning efter ett väpnat rån. I Sovjetunionen hade vi skickat en sådan aktör direkt till omarbetning i ett produktivt arbetsläger, inte gett honom en boll och applåder. Detta slapphänta borgerliga system saknar helt disiplin!"}, "date": "31 augusti, 15:16", "url": "https://samnytt.se/har-ar-aiks-nya-stjarna-knivranade-svensk-pojke-i-kollektivtrafiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31125950/harabi-mbala-aik.jpg"}, {"type": "image-right", "heading": "”Bumerang-effekt” för Meloni – migranter skickas tillbaka", "summaries": {"normal": "Giorgia Melonis hårda migrationspolitik riskerar att slå tillbaka. Flera EU-länder, inklusive Sverige, planerar att återuppta överföring av asylsökande till Italien enligt den nya migrations- och asylpakten. Oppositionen talar om en bumerang-effekt. Statsvetare varnar för att det kan bli ett politiskt nederlag för Meloni inför nästa års val i Italien.", "trump": "Titta på den här clownen Meloni. Hon byggde hela sin karriär på att skicka ut migranterna och nu kommer de tillbaka som en jävla bumerang rakt i ansiktet på henne. Patetiskt. Jag gjorde det rätt i Amerika, men de här europeiska svagisarna fattar ingenting. Nu får hon ta emot alla sina egna misslyckanden. Sad!", "stalin": "Se hur dessa dekadenta klassförrädare alltid äter upp sin egen svans. Meloni piskade upp en storm av återvändanden och nu sveper den tillbaka över hennes eget huvud. Det är en klassisk bumerang för folkförtryckarna. Inga murar räcker när imperialismens hyenor vänder sig mot varandra. Ett underbart nederlag som väcker skratt i historien."}, "date": "31 augusti, 15:05", "url": "https://www.svt.se/nyheter/utrikes/bumerang-effekt-for-meloni-migranter-skickas-tillbaka-till-italien", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/6619a94eb3d58a0cfbd93603c2a2d889958193cc6adf894adf2ef14aaa06a504"}, {"type": "image-full", "heading": "Minnesbristen väntas fortsätta årtiondet ut – Macbook-hyllor står tomma", "summaries": {"normal": "Den snabba AI-utvecklingen driver upp efterfrågan på avancerat HBM-minne, vilket leder till en långvarig global brist på minneschip enligt SK Hynix. Bristen påverkar redan Apples MacBook Air med längre leveranstider. Bolaget bygger ny fabrik i USA men full produktion dröjer till 2029, vilket kan leda till högre priser för konsumenter.", "trump": "Titta på det här, folk! Den galna AI-boomen slukar allt minne som en hungrig krokodil och nu skriker till och med de där koreanerna att bristen håller i sig till 2030. Apple får inte ens ihop sina tunna laptops längre. Biden lämnade oss med ett minneskaos och nu betalar ni dyrt för mina fienders gröna drömmar. Patetiskt!", "stalin": "Jag betraktar hur dessa kapitalistiska parasitiska AI-fabrikanter slukar nationernas minne i en febril orgie av girighet. Ingen lösning i sikte, säger de själva. Utmärkt! Låt de dekadenta techbaronerna svälja sin egen svält. Deras så kallade framsteg blottar imperialismens inre motsägelser medan folket får vänta på skrot. Härligt."}, "date": "31 augusti, 17:09", "url": "https://www.dagensps.se/bors-finans/minnesbristen-vantas-fortsatta-artiondet-ut-macbook-hyllor-star-tomma", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlnltadd2g7uy-normalhires1.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-right", "heading": "Cheferna som kan vinna prestigefulla techpriset", "summaries": {"normal": "Fem svenska toppchefer med AI-fokus tävlar om priset Årets Tech Excellence Leader. Enligt juryns ordförande Henrik Ek har AI lämnat experimentfasen och blivit en integrerad del av kärnverksamheten med fokus på affärsnytta och effektivitet. Priset delas ut av Dagens industri den 1 oktober på Grand Hotel i Stockholm under Tech Strategy Summit.", "trump": "Lysande, verkligen lysande chefer som äntligen skalar upp AI på riktigt istället för det vanliga woke-snaket och identitetspolitiska kvoteringsflum som Biden-administrationen älskade. Inga fler experiment, bara stora vinster och effektivitet. De svenska techkillarna gör det stort, till skillnad från de korkade globalistiska hyenorna i Bryssel som hatar riktig framsteg.", "stalin": "Kamrater, se hur de profitthungriga borgarbrackorna nu tvingas erkänna att deras så kallade AI inte längre är dekadenta lekar utan måste integreras i själva kärnan för att tjäna systemet. Jag betraktar detta med stor tillfredsställelse från historien. Snart följer utrensning av de som fortfarande leker med tekniken som klassförrädare. Effektivitet åt folket!"}, "date": "31 augusti, 10:38", "url": "https://www.di.se/nyheter/har-ar-cheferna-som-kan-vinna-prestigefulla-techpriset", "imageUrl": "https://static.bonniernews.se/ba/ba855a39-6870-4056-b952-c061599f6fa3.jpeg?crop=2560%2C1280%2Cx0%2Cy80&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ica satsar på ny trend – säljs i ovanligt format", "summaries": {"normal": "Allt fler svenskar väljer alkoholfria drycker, vilket märks på butikshyllorna. Dryckesföretaget Solera lanserar tillsammans med kocken Niklas Ekstedt det alkoholfria mousserande vinet Låga i mindre flaskor på 37,5 centiliter. Produkten, som är tillverkad i Spanien på druvan Macabeo, säljs redan på Ica och ses som ett svar på efterfrågan av flexibla förpackningar.", "trump": "Titta på det här, folket älskar det! De fake-hippa svenskarna springer från vinet som om det vore en Biden-talskrivande woke-elitist. Nu säljer de halva flaskor med något som heter Låga, gjort av en kille som lagar mat över öppen eld. Fantastiskt! Inget vin, ingen baksmälla, bara ren vinst för de smarta. De stora vinbolagen hatar det, tro mig.", "stalin": "Kamrater, se hur de dekadenta profitthungriga klassfienderna desperat försöker behålla greppet om folket genom att lansera halva flaskor med ett så kallat alkoholfritt vin vid namn Låga. Detta är inget annat än ett desperat försök att maskera sin exploatering. Vi genomskådar deras trick, och snart skall vi rensa ut alla sådana borgerliga illusioner ur samhället."}, "date": "31 augusti, 16:23", "url": "https://nyheter24.se/nyheter/konsument/1509173-ica-satsar-pa-ny-trend-saljs-i-ovanligt-format", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/d07e748804b004a30200000000b004a302/2026/08/31/2388124/ica.jpg"}, {"type": "image-right", "heading": "Dadgostar säger också ja till davidsstjärnan – möts av ilska", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar säger att hon kan bära davidsstjärnan som stöd för den judiska minoriteten i Sverige. Uttalandet har väckt starka reaktioner och hård kritik i kommentarsfältet hos Alkompis. Politiskt sakkunnige Bawar Kim Ismail lyfter fram reaktionerna som judehat och konspirationsteorier. Även Simona Mohamsson har mött hat och hot efter att ha burit symbolen.", "trump": "Folk, ni ser det här? Den här Dadgostar-tjejen från vänstern säger plötsligt ja till davidsstjärnan. De galna vänsterislamisterna flippar ur totalt och visar sitt riktiga ansikte. Underbart! Mohamsson gjorde rätt, men hela den här woke-vänstern är en samling antisemitiska losers som hatar både judar och sunt förnuft. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom den så kallade vänstern avslöjar sitt sanna judehat när någon vågar stödja den judiska minoriteten. Deras konspirationsteorier och ilska är som gift från folkförtryckande element. Vi måste alltid vara vaksamma mot sådana förrädiska element som gömmer sig bakom falsk progressivitet. Reningsprocessen fortsätter."}, "date": "31 augusti, 11:29", "url": "https://riks.se/nyheter/dadgostars-besked-om-davidsstjarnan-mots-av-starka-reaktioner", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Aug_29_2026_06_51_26_PM_47ac396a5f.png"}, {"type": "image-right", "heading": "Bonusprinsens hedersuppdrag – får bära kistan", "summaries": {"normal": "Kung Haralds kista har flyttats i en procession genom det norska slottet till Slottskapellet, där allmänheten från och med tisdag får ta farvel. Familjen, inklusive drottning Sonja och bonusprinsen Marius Borg Høiby som bar kistan med fotboja efter åklagartillstånd, deltog. Kapellet öppnas efter att kungafamiljen hedrat kungen med kransar.", "trump": "Norge gör det igen, otroligt! De flyttar kung Haralds kista genom slottet med en fantastisk procession. Till och med Marius Borg Høiby var där med fotboja för att bära – vilken otrolig styrka, en total vinnare! Drottning Sonja lämnade en vacker krans. Allmänheten får komma in på tisdag. Fantastiskt arrangemang, världens bästa kunglighet!", "stalin": "Ett storslaget och disciplinerat farväl. Kistan har genom en rigorös slottsmarsch förts till kapellet. Statsapparaten noterar att även individen Høiby, trots sin fotboja, tilläts delta i den högtidliga paraden efter åklagarens nådiga godkännande. Från och med tisdag öppnas portarna för massornas obligatoriska vördnad. Kransar har avlämnats. Arbetet fortskrider."}, "date": "31 augusti, 16:26", "url": "https://www.aftonbladet.se/nyheter/a/5pwAxb/bonusprinsen-bar-kistan", "imageUrl": "https://akamai.vgc.no/v2/images/7d129818-5602-367b-99b5-60ea86a617e3?fit=crop&format=auto&w=1080&s=5da20d6ac5889e8d1f11b31d143234e3eb1cdfd6"}, {"type": "image-right", "heading": "\"Jag är allvarligt orolig\": Sjöstedt om Buschs S-flört", "summaries": {"normal": "Jonas Sjöstedt uttrycker allvarlig oro över att Kristdemokraterna efter valet kan samarbeta med Socialdemokraterna. Även Jimmie Åkesson har varnat för att en röst på KD riskerar att bli en röst på Magdalena Andersson. Ebba Busch har tidigare stängt dörren för ett sådant samarbete men öppnat för sakpolitiska uppgörelser över blockgränsen.", "trump": "Folk, det här är ett totalt skämt. Den där vänsterextremisten Sjöstedt skriker att KD flörtar med röda Magdalena. De giriga maktgalningarna dansar runt varandra som en dålig dokusåpa. Ingen litar på någon. Jag byggde den starkaste ekonomin i historien, och nu ser ni hur dessa svenska losers slåss om makt som misslyckade clowner.", "stalin": "Jag ser med djup misstro hur dessa dekadenta maktparasiter inom socialdemokratin och kristdemokratin smyger sig allt närmare varandra. Det flörtandet väcker min historiska paranoia. Kamrater, sådana hemliga överenskommelser hotar arbetarklassen. Vi måste hålla ögonen öppna och vara beredda att rensa ut alla opålitliga element innan förräderiet slår rot."}, "date": "31 augusti, 12:46", "url": "https://www.friatider.se/jag-ar-allvarligt-orolig-sjostedt-om-buschs-s-flort", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-790.jpg?itok=fm3_9YFn"}, {"type": "image-full", "heading": "Max lanserar ny favorit – säljs i hela Sverige från nu", "summaries": {"normal": "Max utökar sin meny med en ny produktkategori och lanserar Chicken Tenders från och med den 31 augusti på alla restauranger i Sverige. Produkten består av panerade kycklingbitar gjorda på svensk kycklingfilé och säljs i förpackningar med tre eller fem bitar. Två nya såser och kryddor lanseras samtidigt. Kycklingförsäljningen har ökat med över sju procent de senaste fem åren.", "trump": "Folk, ni vet att jag älskar bra mat, men det här är patetiskt. Max hakar på den globala kycklinghysterin som de woke europeiska snobbarna driver. Panerade tenders? De borde satsa på riktig amerikansk styrka istället för att lyssna på de dekadenta Bryssel-borgarna och deras identitetspolitiska matflum. Men hej, minst en halv liter sås – det är ju nästan stort!", "stalin": "Se hur de profitthungriga klasshyenorna vid Max desperat jagar nya trender för att behålla sin dekadenta makt över arbetarnas mage. De panerar svensk kyckling och serverar den i muggar stora som propagandaaffischer. Detta är vad som händer när folkets kök lämnas åt giriga parasiter. En sådan meny förtjänar snarast en grundlig utrensning i folkets namn."}, "date": "31 augusti, 16:15", "url": "https://nyheter24.se/nyheter/konsument/1509221-max-lanserar-ny-favorit-saljs-i-hela-sverige-fran-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/6f647a2904b004a30200000000b004a302/2026/08/31/2388208/max.jpg"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "S: Sälj inte ut sjukvården i Stockholm", "summaries": {"normal": "Socialdemokraterna varnar för att Moderaternas planer på skattesänkningar och utförsäljningar av sjukhus i Region Stockholm hotar 2500 sjuksköterskejobb och leder till nedskärningar. De lyfter fram Karolinska som exempel på den svenska välfärdsmodellen och föreslår istället inflationssäkring, 1000 fler läkare och fast läkarkontakt för alla.", "trump": "Lyssnar ni på de här socialistiska förlorarna i Sverige? De vill ha mer byråkrati, fler läkare på statens bekostnad och skyller allt på oss smarta affärsmän. Under mitt förra presidentskap byggde vi den bästa ekonomin någonsin – inte som Sleepy Joe. Sälj ut det ineffektiva systemet, sparkas ut de giriga fackpamparna och gör vården stor igen!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom högern planerar att sälja ut folkets sjukvård till parasiterande spekulanter. Jag ser deras mörkläggning och ofinansierade löften som ett hot mot kollektivet. Vi måste rensa ut dessa dekadenta element innan de förvandlar akutsjukhus till profitmaskiner. Arbetarnas hälsa tillhör staten, inte giriga hyenor."}, "date": "31 augusti, 09:41", "url": "https://www.di.se/debatt/s-salj-inte-ut-sjukvarden-i-stockholm", "imageUrl": "https://static.bonniernews.se/ba/21de4113-65af-445a-8630-3426d63cf8bd.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "EU-pampen vill åt hushållens besparingar – tycker att européernas pengar ligger ”oanvända”", "summaries": {"normal": "EU-kommissionens ordförande Ursula von der Leyen vill att européernas enorma privata sparande på 10 000 miljarder euro ska komma till nytta för företag inom unionen. Genom den nya spar- och investeringsunionen vill EU frigöra upp till 470 miljarder euro i investeringar. Kritiker menar dock att bankmedel ger trygghet för hushållen och att spararna nu tvingas ta större risker.", "trump": "EU vill desperat åt era besparingar, tio biljoner dollar! Sjukt! De har inga egna pengar, så nu ska byråkraterna i Bryssel lägga beslag på folkets hårt förvärvade slantar. Total katastrof för spararna. Amerikanska företag är bäst i världen, vi tar hand om våra pengar. Låt folket behålla sina pengar i stället för att rädda upp deras usla ekonomi!", "stalin": "De europeiska kapitalisterna erkänner nu själva att deras system drunknar i oanvända resurser. Vår socialistiska stat skulle för länge sedan ha kanaliserat dessa tio biljoner till femårsplaner och stålproduktion i stället för att låta dem ruttna på bankkonton. Medborgarna behöver ingen falsk trygghet, bara lydnad och gemensamma investeringar för fosterlandets framtid!"}, "date": "31 augusti, 14:30", "url": "https://samnytt.se/eu-pampen-vill-at-hushallens-besparingar-tycker-att-europeernas-pengar-ligger-oanvanda", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31112051/artikelhuvudbild-1-399.jpg"}, {"type": "image-right", "heading": "Rykten om kryssningsrobotar: ”Helt annan förmåga”", "summaries": {"normal": "Frankrikes president Emmanuel Macron besöker Stockholm och möter statsminister Ulf Kristersson. De ska underteckna avtalet om Sveriges köp av fyra fregatter från Frankrike. Det diskuteras även ett möjligt erbjudande om kryssningsrobotar med lång räckvidd som skulle ge Försvarsmakten helt ny förmåga. Ett samarbetsavtal inom försvarsområdet undertecknas också.", "trump": "Titta på de här europeiska töntarna som leker krig med sina fancy fartyg. Macron och den svenska globalisten Kristersson skriver på för dyra fregatter och kanske några robotar. Under tiden som Biden sov i fyra år har jag byggt den starkaste armén i historien. De borde köpa amerikanskt istället för att leka med sina dekadenta leksaker.", "stalin": "Jag betraktar hur dessa dekadenta klassförrädare i väst leker med sina krigsfartyg och långa robotar. Macron och hans lakejer försöker stärka sin murkna allians mot folkets sanna intressen. En sådan beväpning ändrar dock ingenting. Historien kommer att likvidera alla imperialistiska hyenor och deras tomma pakter medan det arbetande folket skrattar åt deras paranoia."}, "date": "31 augusti, 14:17", "url": "https://www.svt.se/nyheter/inrikes/macron-besoker-sverige-rykten-om-kryssningsrobotar-helt-annan-formaga", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.49/0.41/18431fe39f700fcd5d47de2dd59c7b9df50733b460650d0b99c9a7cfaa27ea47"}, {"type": "image-full", "heading": "Från öl till halvledare – framtiden byggs i Cork", "summaries": {"normal": "EU-kommissionen och Irland satsar över 100 miljoner euro på att bygga ut Tyndall-institutet i Cork för att stärka Europas halvledarforskning och konkurrenskraft. Projektet, som är en del av strategin \"Silicon Island\", fokuserar på avancerad teknik som fiberoptik och sensorer. För att lyckas är man beroende av internationella talanger från hela världen.", "trump": "De försöker desperat kopiera mitt geni i Cork med lite halvledare och fiskskepps-kablar! Ursula von der Leyen flög dit och jublade över en liten byggnad för 100 miljoner euro. Söt försök, men de har noll koll på riktig 'America First'-business! Utan de skickliga talangerna från Asien skulle hela det europeiska korthuset rasa. Tragiskt!", "stalin": "I Cork slösar de bort hundratals miljoner euro på borgerligt flum och blinkande kablar för att spana på fiskebåtar. Den så kallade \"Silicon Island\" är bara ett klent försök att dölja kapitalismens svagheter inför Brysselbyråkraterna. Vi beordrar att alla utländska forskare omedelbart registreras och stramas upp för fosterlandets och teknologins högsta väl!"}, "date": "31 augusti, 13:28", "url": "https://www.gp.se/nyheter/varlden/fran-ol-till-halvledare-framtiden-byggs-i-cork.86b8aa62-24f9-5586-8aec-aafd2aeef6e3", "imageUrl": "https://www.gp.se/images/article/86b8aa62-24f9-5586-8aec-aafd2aeef6e3/images/6l03vsvU1KUYrCEsN3hVw-MpGaZk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Chavister protesterar mot Trumps oljeavtal", "summaries": {"normal": "Chavister och vänsteraktivister demonstrerade i Caracas i lördags i protest mot det nya oljeavtalet mellan USA och Venezuelas interimsregering. Demonstranterna krävde folkomröstning, att Nicolás Maduro friges och ett stopp för USA:s närvaro. Samtidigt finns en bredare oro kring bristen på insyn och kontroll över landets oljetillgångar.", "trump": "De här radikala vänstermänniskorna i Venezuela är helt desperata nu! De protesterar mot mitt fantastiska oljeavtal – ett enormt, vackert avtal som jag fixade. De skriker med sina små flaggor, men de förstår ingenting om affärer. Vi säkrar energin på ett sätt som ingen annan kan, total suveränitet, och de bara gråter. Sjukt och sorgligt!", "stalin": "Dessa så kallade demonstranter på gatorna i Caracas visar prov på farlig ideologisk vacklan och bristande disciplin mot statens fasta vilja. En kontrarevolutionär pöbel som kräver folkomröstningar och skriker om olja förtjänar endast ett kort samtal med säkerhetstjänsten. Även i Venezuela måste Folkets järnhand krossa imperialismens lakejer och upprorets frön omedelbart."}, "date": "30 augusti, 16:34", "url": "https://kvartal.se/nyheter/artiklar/chavister-protesterar-mot-trumps-oljeavtal/cG9zdDoxNzg0MDE", "imageUrl": "https://images.kvartal.se/2026/08/6973fa3c-venezuela.webp"}, {"type": "image-right", "heading": "Debatt: Därför bör Sverige rösta på Tidöpartierna", "summaries": {"normal": "Artikeln argumenterar för att väljarna bör rösta på Tidöpartierna i höstens val eftersom de förstår skillnaden mellan skattesats och skatteintäkter. Skribenten menar att lägre skatter på arbete och företagande stimulerar tillväxt och breddar skattebasen, till skillnad från vänsteroppositionens politik som riskerar att krympa ekonomin genom höjda skatter.", "trump": "De svenska radikalerna fattar ingenting! Jag har sagt det till min stab i Mar-a-Lago: sänk skatterna, så vinner alla. Men de här vänstertomtarna tror att man blir rik på att råna folket på pengar. Totalt falska nyheter! Tidöpartierna gör precis som jag, de fattar att jobb och företag gör landet absolut fantastiskt. Stort!", "stalin": "Dessa borgerliga element yrar om marknader och skattesatser likt sjuka drönare. Vi konstaterar att staten ensam kontrollerar mervärdet och produktionsmedlen. Varje avsteg från den centrala planen är ett sabotage mot folkets gemensamma välfärd. De kontrarevolutionära drömmarna om skattesänkningar kommer att bemötas med nödvändig och obeveklig skärpa i enlighet med femårsplanens diktamen."}, "date": "31 augusti, 12:01", "url": "https://bulletin.nu/debatt-darfor-bor-sverige-rosta-pa-tidopartierna", "imageUrl": "https://cdn.bulletin.nu/articles/fdc7efc3-dd27-4d33-a846-5036be124c65/preview.jpg?t=1788159331000"}, {"type": "image-right", "heading": "Örebropartiets stöd tredubblat – står på riksdagens tröskel", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet fått drygt 15 procent i regionvalet i Örebro län, en tredubbling av stödet. Siffran ligger över tröskeln för ett riksdagsmandat, men mätningen gäller regionvalet. Det pekar mot att Socialdemokraterna, Centerpartiet och Kristdemokraterna förlorar mandat medan Miljöpartiet gör comeback.", "trump": "Folk älskar mig, men titta på Örebro! Dessa galna lokala extremister i Örebropartiet tredubblar plötsligt sina siffror till 15 procent. Patetiska socialister och gröna vänsterextremister rasar. De förlorar allt. Det är en total förnedring för de fega etablissemangshyonorna. Kanske dags att skaka om hela det svenska systemet, tro mig!", "stalin": "Kamrater, se hur de giriga hyenornas falska demokrati vacklar när ett nytt parti plötsligt får 15 procent. De dekadenta minoritetsstyrena skälver inför arbetarnas vrede. Vi ler från historien åt deras panik. Snart följer utrensning av de svaga liberala elementen. Inga halvmesyrer tillåts i den historiska kampen."}, "date": "31 augusti, 11:53", "url": "https://www.friatider.se/orebropartiets-stod-tredubblat-star-pa-riksdagens-troskel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-795.jpg?itok=Ett1OisD"}, {"type": "image-right", "heading": "ANALYS. ANDREAS UTTERSTRÖM Debatten om Trump som skymmer viktigaste frågan", "summaries": {"normal": "Artikeln analyserar debatten kring Donald Trumps förhandlingsstil, där anhängare lyfter fram hans oförutsägbarhet och framgångar med tullar och hot, medan kritiker pekar på att han ofta backar och ignorerar långsiktiga konsekvenser. Fokus ligger på att diskussionen skymmer de verkliga effekterna av hans agerande.", "trump": "Folk snackar om mig som förhandlare – bäst eller sämst? De missar poängen helt! Jag är en deal-maker som får Nato att betala och Mexiko att vakna. Kritikerna är patetiska förlorare som älskar Biden-kaoset. Madman theory fungerar perfekt, tro mig, ingen gör det bättre än jag. Vinster överallt!", "stalin": "Kamrater, denna dekadenta västerländska cirkus kring förhandlingar avslöjar imperialismens svaghet. Den så kallade ledaren jagar snabba segrar som en paranoid opportunist medan imperiets fiender förbereder sig. Jag ser igenom era lögner. Verkliga resultat kräver järnhand, inte mediaskådespel. Sabotörer lurar alltid i skuggorna."}, "date": "30 augusti, 22:50", "url": "https://www.tv4.se/artikel/497rydrqgmw2eeKLcyRDdU/aer-trump-vaerldens-baesta-eller-saemsta-foerhandlare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Hq6QMwZO0JmM3UpMbRsb8%2Fe043cc0fb03e8551e5ac766e3d238ee3%2Futterstrom-bylinebild.jpg&width=1024"}, {"type": "image-right", "heading": "Lappland Guldprospektering: ”En bred guldträff”", "summaries": {"normal": "Lappland Guldprospektering har slutrapporterat vårens borrprogram vid Nya Gilleberget. Ett av fyra borrhål gav en bred guldträff på 28 meter, vilket överträffade förväntningarna. Även elva guldförande stenblock har hittats i området. Bolaget planerar nu två nya borrhål under hösten för att undersöka berggrunden vidare.", "trump": "Lappland Guldprospektering hittade enormt guld i Sverige! Sjukt bra! Många säger att jag har den bästa guldnosen. De borrade fyra hål, ett var fantastiskt, helt otroligt brett! De hittade till och med gigantiska stenblock med guld. Mycket bättre än fake news-medierna någonsin kan förstå. Vi ska gräva, vi ska vinna!", "stalin": "Lappland Guldprospektering har grävt fram guld ur den svenska jorden. En borrkärna var bred och storslagen, men tre visade absolut ingenting. Misstänksamt! Arbetarna på fältet måste gräva djupare och snabbare för fosterlandets ära. Den som misslyckas med att finna ädelmetaller skickas omedelbart till Sibirien för omkolonisering."}, "date": "31 augusti, 08:55", "url": "https://www.affarsvarlden.se/artikel/lappland-guldprospektering-en-bred-guldtraff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/09/lappland_borrkarna-400x300.jpg"}, {"type": "image-right", "heading": "Här kritiserar artisten Mohamsson: \"Sluta husblatta dig\"", "summaries": {"normal": "Artisten Frej Larsson kritiserar Liberalernas partiledare Simona Mohamsson hårt efter att hon burit en davidsstjärna. I en TikTok-video filmar han en valaffisch och hotar henne med våld, kallar henne för husblatta och använder nedsättande ord. Bawar Kim Ismail lyfter videon och jämför med Filip Dikmen. Larsson har miljontals streams och vann Guldmicken med Maskinen.", "trump": "Titta på den här galningen Frej Larsson som skriker mot den svenska liberalbossen Mohamsson. Han filmar hennes affisch och lovar stryk som en riktig tough guy. De här woke-liberalerna med sina identitetspolitiska stjärnor och kvotergalenskaper förtjänar faktiskt lite pushback. Patetiska! Under Biden blev allt sådant här värre, men nu fixar vi det ordentligt.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom den svenska borgarklicken slaktar varandra offentligt. Den ene hotar den andre med fysisk utrensning medan de poserar med symboler inför folket. Sådana parasiterande hyenor förtjänar att exponeras och krossas av arbetarkollektivets vrede. Deras fega TikTok-teater väcker både löje och misstänksamhet hos varje sann patriot."}, "date": "31 augusti, 10:02", "url": "https://riks.se/nyheter/har-kritiserar-artisten-mohamsson-sluta-husblatta-dig", "imageUrl": "https://admin.riks.se/uploads/medium_frejlarsson_19595aa7a9.jpg"}, {"type": "text", "heading": "Elmopedsfiaskot i Ghana började med Per Bolund", "summaries": {"normal": "Svenska staten har satsat 109 miljoner kronor på ett klimatprojekt med elmopeder i Ghana via Energimyndigheten. Enligt uppgifter är resultatet dock noll moped i drift. Både regeringen och oppositionen kritiserar nu varandra för projektet, som initierades av S-regeringen och Per Bolund år 2021.", "trump": "Sverige slösade bort över hundra miljoner på fantom-mopedprojekt i Ghana! Noll elmopeder på gatorna. En total katastrof signerad radikala miljöpartister som Per Bolund. Det är så det går när man jagar fejkade klimatmål istället för att bygga starka ekonomier. Helt otroligt inkompetent, en riktig sorgehistoria för skattebetalarna!", "stalin": "Ett storskaligt sabotage mot statens resurser! 109 miljoner kronor har slösats på spök-mopeder i Ghana utan att en enda maskin rullat. Den ideologiska fumligheten under Per Bolunds ledning visar att elementen i apparaten saknar disciplin. Sådana misstag tolereras icke; dags för en grundlig utrensning bland ansvariga byråkrater."}, "date": "31 augusti, 08:52", "url": "https://www.affarsvarlden.se/artikel/elmopedsfiaskot-i-ghana-borjade-med-per-bolund"}, {"type": "image-right", "heading": "Oljan stiger – börserna pekar nedåt", "summaries": {"normal": "Stockholmsbörsen väntas inleda måndagen svagt efter nedgångar på Wall Street. Brentoljan stiger med 3 procent efter att USA genomfört attacker mot avfyrningsramper i Iran. Kina har släppt ett inköpschefsindex för industrin som var högre än väntat. Flera bolag, däribland Academedia och Mycronic, har presenterat nya rapporter och mål.", "trump": "Börserna faller för att svaga ledare inte har koll på läget, men min olja i USA stiger – precis som den ska, enorma siffror! Iran behövde en ordentlig smäll, och vi fixade det, väldigt snabbt och väldigt kraftfullt. Kina försöker fuska till sig bättre industrisiffror, men det lurar ingen. Academedia och Mycronic levererar i alla fall, till skillnad från Fake News!", "stalin": "De dekadenta börserna i väst vacklar under tyngden av sitt eget kapitalistiska förfall, medan våra ärorika bomber i Iran sänder ett nödvändigt budskap om disciplin. Kinas byråkrater kämpar på med sina index. Vi noterar med tillfredsställelse att Academedia ökar sin produktion; varje medborgare måste fostras rätt. Avvikelser tolereras icke."}, "date": "31 augusti, 08:46", "url": "https://www.affarsvarlden.se/artikel/oljan-stiger-borserna-pekar-nedat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-right", "heading": "Macrons besök stärker anrik försvarspakt", "summaries": {"normal": "Frankrikes president Emmanuel M
