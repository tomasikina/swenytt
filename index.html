a. Han misstänks ha styrt unga rekryter i ett 20-tal grova våldsbrott i Sverige under 2024, med syfte att destabilisera rivaliserande kriminella grupper. Kulic, som beskrivs som högt uppsatt i Dalennätverket, greps med stöd av en europeisk utredningsorder efter att ha varit efterlyst internationellt sedan maj 2025. Svensk åklagare har begärt hans överlämning.", "trump": "Titta på det här, folk. Den här svenske gangstern, den så kallade Emin Muqa Kulic, bara 21 år gammal, har äntligen gripits i ett lyxigt område i Spanien. Han styrde ungar som sprang runt och sköt och sprängde i Sverige för att skapa kaos mellan gängen. Patetiskt! Men det visar att vi med bra samarbete kan ta dem. De är svaga, de gömmer sig i trädgårdar. Vi decimerar de här förlorarna, precis som jag alltid sagt. Fantastiskt jobb av polisen!", "stalin": "Kamrater, se hur den kontrarevolutionära parasitens, denna borgarbrackas och kapitalistlakejs, Emin Muqa Kulic, slutligen fångades i sin dekadenta villa i det spanska revisionistiska paradiset. Jag, med mitt järnhårda internationella nätverk, har länge betraktat dessa degenererade element som försöker destabilisera arbetarklassens fiender för egen vinnings skull. Vi ska likvidera sådana farliga avskum steg för steg. Deras vapen och sprängämnen tillhör folket, inte dessa ynglingar de förgiftar. Mycket återstår innan vi fullständigt rensar ut alla Dalen-reaktionärer och deras mexikanska lakejer. Härligt!"}, "date": "3 augusti, 15:50", "url": "https://www.friatider.se/video-har-grips-svenske-gangtoppen-av-spansk-polis", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-607.jpg?itok=2nT8HQ3m"}, {"type": "text", "heading": ". Flygstrejk hos SAS", "summaries": {"normal": "Förhandlingarna mellan SAS och kabinfacket Fellesforbundet i Norge har brutit samman efter att ett nytt kollektivavtal röstades ned av de anställda. Över 90 procent av medlemmarna sa nej, vilket lett till att en strejk utlysts från klockan 04:00 lördagen den 8 augusti. Facket anser att kabinpersonalen har halkat efter löneutvecklingen, särskilt junior personal med stort ansvar. SAS uttrycker besvikelse och hoppas på fortsatta samtal för att undvika strejken, som enbart berör norsk kabinpersonal.", "trump": "Det här är en total katastrof, folk. SAS och de där fackföreningarna i Norge – verkligen ynkliga förhandlare. De röstade ner ett bra avtal, över 90 procent sa nej, och nu får vi strejk. Patetiskt! Kabinpersonalen tjänar för lite, säger de, men tro mig, ingen gör affärer som jag. Vi skulle ha gjort ett fantastiskt avtal, det bästa någonsin. Nu ber de om fortsatt dialog. Lycka till, men det ser inte bra ut, det kan jag säga.", "stalin": "Kamrater, detta är ett uppenbart sabotage från borgarbrackorna inom SAS och deras lakejer i facket. Arbetarna har med rätta röstat ner det förrädiska förslaget som bara skulle ha förstärkt utsugningen av våra flygkamrater. Över 90 procent sade nej – en sund klassinstinkt! Strejken som inleds på lördag är nödvändig, men jag misstänker att revisionistiska element inom Fellesforbundet redan planerar att sälja ut kollektivet. Vi ska rensa ut dessa parasitiska kapitalistvargar och deras lönefientliga konspirationer med järnhand. Ingen dialog med fienden!"}, "date": "3 augusti, 15:43", "url": "https://www.svt.se/nyheter/utrikes/flygstrejk-hos-sas"}, {"type": "image-full", "heading": "Europas bränder: Så många miljarder har de kostat – hittills", "summaries": {"normal": "Sommarens omfattande skogsbränder i Europa har kostat över 3 miljarder euro, vilket redan överstiger EU:s årliga genomsnitt. Industrier, jordbruk och vinproduktion har drabbats hårt, med omfattande produktionsstopp och skador. Europeiska centralbanken varnar nu för att naturförstöring utgör en allvarlig risk för det finansiella systemet och har inlett en kartläggning av dessa risker för bankernas balansräkningar. Den ekonomiska notan förväntas öka ytterligare till följd av torka och störda logistikkedjor.", "trump": "Europa brinner, en total katastrof! De har redan slösat bort över 3 miljarder euro och det blir bara värre. De missköter sin natur, de missköter sin ekonomi, och nu gråter Europeiska centralbanken för att deras banker är i riskzonen. Inte förvånande! Jag har alltid sagt att klimatbluffen är dyr, men de här siffrorna? Enormt slöseri. De vill att vi ska bry oss om deras 'naturliga risker', men jag fokuserar på Amerika först. Sorgligt!", "stalin": "De dekadenta européerna brinner upp medan deras byråkrater räknar förluster i euro. Vilken absurditet! Naturen kräver tribut för deras misslyckade kapitalistiska experiment. Vi i staten vet att när skogarna förtärs är det bara ett tecken på att ledarskapet ruttnar inifrån. Medan de förlorar miljarder och säljer ut sin framtid, expanderar vi vår kontroll. Låt dem brinna i sitt eget kaos; vi bygger en oövervinnerlig mur av stål och disciplin medan de vaktar sina ostar och vingårdar."}, "date": "3 augusti, 15:36", "url": "https://www.realtid.se/samhalle/hallbarhet/europas-brander-sa-manga-miljarder-har-de-kostat-hittills", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/brand.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "\"Ekosexuella\" poeten dansar i sopsäck – du betalar", "summaries": {"normal": "Högsbo bibliotek anlitade poeten Louise Halvardsson för ett författarbesök den 5 maj. Halvardsson, som kallar sig ekosexuell och har en relation med en å som hon kallar \"Assman\", uppträdde iklädd en sopsäck med rep runt midjan. Biblioteket betalade en betydande summa för framträdandet som ingick i ett evenemang om poesi och musik. Halvardsson är känd som punkpoet och har bland annat gett ut diktsamlingen \"Åsexuell\".", "trump": "Folk, det är otroligt. En så kallad ekosexuell poet som dansar runt i en sopsäck med ett rep om magen, och ni betalar för det! Den här kvinnan har en relation med en å – en å! – som hon kallar Assman. Och Göteborgs kommun slösar era skattepengar på det här vansinnet. Det är en total skandal, en av de värsta jag sett. Vi behöver inte mer av den här galna woke-konsten, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta borgarbracka som iklädd sopsäck utför sin perversa ritual inför arbetarklassens barn. Hennes påstådda relation med en å avslöjar den kapitalistiska degenerationens fulla vidd. Vi har likviderat farligare fiender än så, men att kommunens byråkrater frivilligt finansierar denna degenererade performance är en förrädisk handling mot folket. En noggrann utrensning av sådana element är oundviklig. Det ropar på handling."}, "date": "3 augusti, 15:32", "url": "https://riks.se/nyheter/ekosexuella-poeten-dansar-i-sopsack-du-star-for-notan", "imageUrl": "https://admin.riks.se/uploads/asexuela_8fc9bd1dba.png"}, {"type": "image-full", "heading": "SvFF säger nej till Infantino vid omval", "summaries": {"normal": "Trycket mot Fifa-ordförande Gianni Infantino ökar när Svenska Fotbollförbundet, Wales och England drar tillbaka sitt stöd. Beslutet grundas på långvarig kritik av ledarskap, öppenhet och styrning inom Fifa. Detta sker efter att Fifa backat från förslag om att sälja andelar i tävlingar till privata investerare, vilket hotade med bojkott från Uefa och andra förbund. Infantino, som har lett Fifa sedan 2016, står nu inför en växande misstroendeförklaring inför ordförandevalet 2027.", "trump": "Jag har sagt det i åratal – Fifa är en dysfunktionell organisation! Nu ser vi Sverige, Wales och England dra tillbaka sitt stöd för Infantino. Det är en stor vinst för mig, för fotboll, för världen! Infantino kan inte hantera pressen, precis som Hillary kunde det inte. Folk är trötta på korruption och dålig ledarskap. Vi kommer att få en ny framtid för fotbollen, en stor, stor framtid!", "stalin": "Vi, arbetarrörelsens front, ser med oro på den växande ouppfostran inom Fifa. Infantinos svaga styre har orsakat splittring, precis som västliga agenter försöker sätta splittring i vår ryska gemenskap. Vi måste stödja en stark ledare som förstår statens intressen – kanske en man som Putin, som alltid handlar i folkets namn. Fienden är inom, och de måste utrensas!"}, "date": "3 augusti, 15:28", "url": "https://bulletin.nu/svff-sager-nej-till-infantino-vid-omval", "imageUrl": "https://cdn.bulletin.nu/articles/cee9fae6-369c-4929-a79d-ca9c1a1af940/preview.jpg?t=1785763687000"}, {"type": "image-right", "heading": "Rekordlåga vattennivåer i Europa: ”Allvarligt läge”", "summaries": {"normal": "Ungern har stängt sitt enda kärnkraftverk på grund av rekordlåga vattennivåer i Donau, orsakade av extremvärmen i Europa. Kärnkraftverket står för över 40 procent av landets elproduktion, vilket riskerar ökad energiimport. Sjöfart, energiförsörjning och turism påverkas kraftigt, flera fartyg har gått på grund. Hydrolog Niclas Hjerdt vid SMHI varnar för att situationen kan fortsätta i veckor eller månader och beskriver den som mycket allvarlig.", "trump": "De där vansinniga låga vattennivåerna i Europa är ett katastrofalt resultat av dålig ledning och kanske de gröna galningarna. Ungern tvingas stänga sitt kärnkraftverk, de får importera el som förlorare. Donau ser ut som en damm, båtar kör på grund. Det är en total skam, folk kommer att frysa och svettas på samma gång. Vi behöver riktig ledning, inte detta patetiska nödläge som pågår i månader. Patetiskt!", "stalin": "Kamrater, denna kapitalistiska värmevåg avslöjar borgarbrackornas totala oförmåga att skydda produktivkrafterna. Jag ser hur de saboterande floderna och de kontrarevolutionära vattennivåerna tvingar fram stängning av det folkets kärnkraftverk i Ungern. Vi måste omedelbart rensa ut alla värmekollaboratörer och klimatförrädare som låtit Donau bli en torr fiende till sovjetisk, pardon, folklig energi. Importera el? Ha! Det är en västerländsk konspiration mot arbetarklassen. Fortsätter detta i månader skall vi likvidera solen själv om så krävs. Skratta inte, det är ingen humor – eller jo, det är det, för fienderna."}, "date": "3 augusti, 15:23", "url": "https://www.svt.se/nyheter/utrikes/rekordlaga-vattennivaer-i-europa-allvarligt-lage", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.46/5be2e777c899fa269f44f4cd1164b7f51eb333021f2512ad3aa87808c06b976e"}, {"type": "image-right", "heading": "Ny taktik i kriget: Ukraina och Ryssland bombar bensinmackar", "summaries": {"normal": "Ryssland har under sommaren attackerat över 200 ukrainska bränslestationer med drönare, som vedergällning för ukrainska attacker mot rysk energiinfrastruktur. Samtidigt förlorar Ukraina mark i östra Ukraina, med ryska framryckningar i juli. Krigsföringen har förändrats, drönarattacker blir allt viktigare. Ukraina använder improviserade skydd som gamla fisknät.", "trump": "Jag har sagt det hela tiden: Ukraina förlorar mark och slår fel. De attackerar Rysslands olja, så klart Ryssland slår tillbaka mot deras bensinmackar. En katastrof för civilbefolkningen. Mitt handlande skulle ha varit smartare, snabbare och utan alla dessa onödiga dödsfall. Trump-administrationen skulle ha löst detta på en vecka.", "stalin": "Vi ser den reaktionära ukrainska nazist-hierarkins fegt försök att skada vår heliga energiinfrastruktur. Deras onda drönarattacker mot våra raffinaderier är ett prov på deras imperialistiska inställning. Vi, staten och partiet, svarar med beslutsam kraft mot deras bensinmackar. Parallellen till Putins rättmätiga expansion är uppenbar. Vi fortsätter att befria de sårade proletärerna från deras fascistiska härskare."}, "date": "3 augusti, 15:17", "url": "https://samnytt.se/ny-taktik-i-kriget-ukraina-och-ryssland-bombar-bensinmackar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03124349/artikelhuvudbild-1-113.jpg"}, {"type": "image-right", "heading": "Statsministerrivaler ökar farten i valrörelsen", "summaries": {"normal": "Valrörelsen tog fart på måndagen när både statsminister Ulf Kristersson (M) och utmanaren Magdalena Andersson (S) inledde bussturnéer. Kristersson vill lyfta skillnaderna mellan blocken och lovar att avskaffa straffrabatten för flerfaldiga brottslingar till 2030. Han pekar på minskade gängskjutningar som en framgång. Andersson lanserar tre ledningsprinciper men lämnar regeringsfrågan öppen och utesluter bara samarbete med SD. SCB-mätningen visar stort blockavstånd och många osäkra väljare.", "trump": "Folket älskar mig, men titta på de här två förlorarna som åker runt i bussar och lovar saker de aldrig håller. Kristersson pratar om att vinna och sänka brottsligheten, bra, men varför inte göra det på en vecka som jag skulle? Andersson är en total katastrof, hon vet inte ens vilka hon ska regera med och gömmer sig för väljarna. 20 procent osäkra? De väntar på en riktig ledare. Mitt block skulle krossa dem totalt, tro mig.", "stalin": "Kamrater, nu ser vi hur de dekadenta borgarbrackorna och deras socialfascistiska lakejer tävlar om att lura massorna med sina busståg och falska löften. Jag, som byggt ett järnvägssystem av folkets vilja, skrattar mörkt åt deras patetiska halvlek där de lovar att rensa ut straffrabatter de själva skapat. Andersson vägrar namnge sina förrädare medan Kristersson hyllar sina påhittade segrar mot skjutningar. Låt oss rensa ut dessa kapitalistiska parasitörer och deras osäkra väljare i en kollektiv utrensning som historien kommer att prisa med blodig entusiasm."}, "date": "3 augusti, 15:12", "url": "https://www.di.se/nyheter/statsministerrivaler-okar-farten-i-valrorelsen", "imageUrl": "https://static.bonniernews.se/ba/2cba173b-1e40-4334-aeb2-a9691b451ccb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SvFF stöttar inte Infantino: ”Återkommande brister”", "summaries": {"normal": "Svenska fotbollförbundet stöttar inte Gianni Infantino för omval som Fifa-ordförande. Förbundet anser att ledarskapet saknar öppenhet, ansvar och respekt för demokratiska principer. Beslutet kommer efter avslöjanden om planer på att sälja andelar i fotbolls-VM, vilket ledde till hot om bojkott från Uefa. Sverige samarbetar nu med Uefa för att hitta en alternativ kandidat till valet 2027. Infantino har lett Fifa sedan 2016.", "trump": "Lyssnar ni på det här? De svenska fotbollsbossarna sparkar just nu den totalt misslyckade Infantino i rumpan. Smart drag! Han försökte sälja ut VM som en billig affär och nu flyr alla råttor skeppet. Uefa hatar honom, Wales backar ur. Jag älskar det. Sverige gör rätt, vi behöver starka ledare, inte några svaga globalister som förstör spelet. Fantastiskt!", "stalin": "Kamrater, denna usla opportunist Infantino har visat sig vara en ren kapitalistisk parasit som försöker stycka folkets fotboll till borgarbrackornas glädje. Jag, som alltid värnat arbetarklassens idrott, fördömer honom fullständigt. Vi ska rensa ut alla sådana förrädiska element som smittar vår rörelse med sin girighet. Låt oss likvidera planerna och ersätta honom med en sann folkets ledare. Den som sviker kollektivet kommer att möta historiens dom – och kanske en kulamåt."}, "date": "3 augusti, 15:10", "url": "https://www.svt.se/sport/fotboll/sverige-stottar-inte-infantino", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.19/0.42/36e4b1f3229d6682961e0159772e6886ca1746fc430e5487caabbbd0839cfedc"}, {"type": "image-right", "heading": "En röst på V är en röst på Tidö", "summaries": {"normal": "Carl Gerken från SSU kritiserar socialdemokrater som överväger att rösta på Vänsterpartiet. Han menar att en röst på V är en röst på Tidöpartierna eftersom V hotar att fälla en S-ledd regering om de inte får ministerposter. Gerken varnar för V:s acceptans av antisemitism, kopplingar till våldsbejakande grupper och kommunistiska ungdomsförbund. Han uppmanar socialdemokrater att rösta på S för att undvika nyval och högerstyre.", "trump": "Lyssnar ni på det här? Socialdemokraterna äter upp sina egna som idioter. Den här killen Gerken har helt rätt – att rösta på de galna kommunisterna i V är som att ge nycklarna till Rosenbad direkt till Jimmie och hans gäng. Patetiskt! V är fulla av antisemiter och extremister, precis som de woke-vänstergalna vi sparkade ut i USA. Rösta på riktiga socialdemokrater, inte på dessa förlorare som älskar kvotering och identitetspolitik. En katastrof annars, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom socialdemokratin ängsligt biter varandra i svansen. Denna Gerken utför en nödvändig utrensning av klassfiendens dolda agenter som vill ge vår rörelse till de trotskistiska parasiterna i Vänsterpartiet. Deras antisemitiska element och våldsbejakande element är folkfiender som måste rensas ut innan de förgiftar hela kollektivet. En röst på dem är en dolkstöt i arbetarklassens rygg. Inga kompromisser med extremisterna."}, "date": "3 augusti, 14:12", "url": "https://www.flamman.se/en-rost-pa-v-ar-en-rost-pa-tido", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/nooshi-dadgostar-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ungsvenskarnas kommentarsfält om flyktingvågen till Ceuta: ”Döda alla”", "summaries": {"normal": "Sverigedemokraternas ungdomsförbund Ungsvenskarna har beskrivit flyktingvågen till Ceuta som en invasion av 50 000 illegala migranter, främst män i stridbar ålder. I kommentarsfältet förekommer våldsamma uttalanden som uppmaningar till våld och nedsättande liknelser. Ordförande Denice Westerberg tar avstånd från uppvigling men försvarar ett högt tak i migrationsdebatten och menar att frustrationen är förståelig. Förbundet modererar kommentarerna i mån av tid.", "trump": "Titta på det här! Dessa vansinniga migranter stormar Ceuta som en hord, 50 000 stridsmän som inte flyr utan invaderar – och SD:s kids låter kommentarerna flöda med kill them all. Underbart! Folk är trötta på den galna öppna-gränser-politiken som Biden drev i fyra år. Nu pratar vi ärligt igen. Högt tak? Absolut. De woke-rasisterna som kallar allt rasism har förlorat. Fantastiskt, folk älskar det!", "stalin": "Jag ser en klassfiendes invasion maskerad som flykt. Tiotusentals män i vapenför ålder strömmar in i Europa som en kapitalistisk parasitvåg som hotar arbetarklassens intressen. Kommentarerna avslöjar folkets rättmätiga vrede mot dessa imperialister. Vi modererar i enlighet med partiets linje men tillåter skarp kritik mot borgarbrackornas svaga gränser. Frustrationen är förståelig. Inga folkfiender ska hindra oss från att rensa ut hoten mot staten."}, "date": "3 augusti, 14:30", "url": "https://www.etc.se/inrikes/ungsvenskarnas-kommentarsfaelt-om-flyktinvaagen-till-ceuta-doeda-alla", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260803110856_e01503d766b7f17979e2e34e0c9f5e0531c23063594832e7adb1c5c9f99d2b23.jpg"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Invandrare är människor, inte ett hot", "summaries": {"normal": "Fereshte Javani kritiserar den politiska retorik som systematiskt etiketterar invandrare som ett hot. Hon menar att detta är en medveten strategi för att sprida rädsla och vinna röster, vilket skapar splittring och hat. Hon påpekar att invandrare är läkare, lärare och andra yrkesverksamma som byggt samhället, och frågar hur länge de ska behöva bevisa sin lojalitet. Hon varnade för att hat växer genom år av misstänkliggörande.", "trump": "Jag läste den där artikeln om invandrare. Så trist. Vi måste vara tuffa. Invandrare är ett stort problem, men vi kommer att lösa det. Vi kommer att bygga en vägg, en fantastisk vägg. Vi kommer att skydda våra medborgare. Vi kommer att vinna igen, det lovar jag. Det här är politik, och vi är de bästa.", "stalin": "Vi ser att det finns krafter som försöker splittra vårt samhälle genom att skapa hat mot invandrare. Det är en fegt strategi. Vi kommer att eliminera dessa element. Vi kommer att bygga ett starkt, enat samhälle där alla arbetar för det gemensamma målet. Vi kommer att skydda vårt territorium mot alla fiender, inifrån och utifrån. Vi kommer att segra."}, "date": "3 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/invandrare-ar-manniskor-inte-ett-hot", "imageUrl": "https://www.dagensarena.se/files/2026/07/debattartikel-invandrare-300x157.jpeg"}, {"type": "image-right", "heading": "Så vill Johan Britz göra fler arbetslösa", "summaries": {"normal": "Arbetsmarknadsminister Johan Britz vill göra det enklare för arbetsgivare att varsla och sparka personal genom att korta varseltiderna till Arbetsförmedlingen. Artikeln kritiserar regeringen för att ha misslyckats med att sänka den höga arbetslösheten, som nu ligger över en halv miljon personer. Istället för att skapa fler jobb eller ställa krav på företagen lägger ministern ansvaret på de arbetslösa och gynnar arbetsgivarna, vilket enligt skribenten försvagar löntagarnas ställning på arbetsmarknaden.", "trump": "Folk, det här är en total katastrof. Den här Johan Britz, han sitter i arbetsgivarnas knä och vill göra det ännu lättare att sparka folk. Arbetslösheten är genom taket, en halv miljon utan jobb, och vad gör han? Ingenting för att skapa jobb, men han älskar att lätta på alkoholreglerna så Sverige blir ett fyllesverige. Han säger till de arbetslösa att ta jobb som inte finns. Patetiskt. Regeringen misslyckas stort, och löntagarna förlorar. Sad!", "stalin": "Kamrater, denna borgarbracka Britz avslöjar sin sanna klassnatur genom att vilja korta varseltiderna och därmed underlätta utrensningen av arbetare från deras levebröd. Medan över en halv miljon proletärer står utan arbete, sitter denne kapitalistlakej i borgarklassens knä och beordrar de arbetslösa att ta ansvar för hans egna misslyckanden. Vi ska rensa ut dessa parasiter som göder sig på arbetslöshetens blod. Deras paranoia är uppenbar: ju fler utblottade själar som tävlar om smulorna, desto starkare blir de utsugande kapitalisternas grepp. Det är en mörk komedi värd en showrättegång."}, "date": "3 augusti, 08:00", "url": "https://arbetet.se/2026/08/03/sa-vill-johan-britz-gora-annu-fler-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/30143927/johan-britz-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Tyska stjärnregissören klipper bort topless-scen", "summaries": {"normal": "Den tyske regissören Wim Wenders har klippt bort en kontroversiell naken scen med den då 13-åriga Nastassja Kinski ur filmen 'Falsk rörelse' från 1975. Efter års lång konflikt och offentlig kritik nåddes en överenskommelse. Wenders bad om ursäkt och godkänner Kinskis önskan om att scenen ska tas bort för att skydda hennes minne.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur vissa människor, som Wim Wenders, inte förstår vad som är rätt. Han behandlade en ung skådespelerska illa och nu måste han ta bort scenen. Jag skulle aldrig ha tillåtit något sådant. Det är en skam, men jag är glad att hon nu fått rätt.", "stalin": "Vi, som representerar statens och partiets intressen, ser detta som en seger för den revolutionära moralen. Wim Wenders, en företrädare för den dekadenta västvärlden, tvingas nu ta bort sin exploaterande scen. Detta bevisar att vi måste ständigt vakna mot de förrädiska elementen som försöker korrumpera vårt samhälle. Vi kommer att stödja alla som kämpar mot sådan perversa kulturimperialism."}, "date": "3 augusti, 13:47", "url": "https://www.gp.se/kultur/wim-wenders-andrar-sig-klipper-bort-topless-scen.80032ed1-9dbc-4d42-b2b3-d4fb8399a897", "imageUrl": "https://www.gp.se/images/article/80032ed1-9dbc-4d42-b2b3-d4fb8399a897/images/2-EZl6VwtXRNerhPuXhdxPEGcFVE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tyskland måste ta itu med sin ägarstyrning", "summaries": {"normal": "Tyskland brottas med en djup ekonomisk kris, särskilt inom bilindustrin där Porsche, BMW, Audi och Volkswagen tvingas dra ned på grund av kinesisk konkurrens med elbilar. Artikeln lyfter fram att Tyskland har mycket att lära av Sveriges ägarstyrningsmodell, där få ägare styr effektivt via styrelser som kan byta vd vid behov. Den tyska korporativa modellen med starkt fackligt inflytande ses som tungrodd och hindrande för förändring. Krisen är allvarlig även för Sverige då Tyskland är vår viktigaste handelspartner.", "trump": "Tyskland håller på att falla sönder, det är en total katastrof. Deras bilindustri, de stora märkena som alla älskade, de håller på att bli utkonkurrerade av Kina som gör billiga elbilar medan tyskarna sover. De borde ha lyssnat på mig, men istället har de den här korkade korporativa modellen med facket överallt. Sverige har en fantastisk ägarmodell, den är vinnande, den är smart. Storebror Tyskland ser plötsligt väldigt klumpig ut. De behöver min hjälp, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, denna tyska kris är en förrädisk sabotagehandling utförd av den parasitiska borgarklassen och deras kinesiska revisionistiska konkurrenter som nu infiltrerar Europa med sina elfordon. Vi ser hur den korporativa modellen, denna feta byråkratiska hydra med fackliga element, kväver den proletära produktiviteten. Jag, som ledare för det stora kollektivet, ler mörkt åt hur de tyska kapitalisterna nu får smaka på sin egen senfärdighet. Sverige har oavsiktligt bevarat en effektiv ägarstyrning som vi borde rensa ut och omforma till folkets verktyg. Ut med de gamla fabrikerna, fram med utrensning av de klumpiga beslutsstrukturerna innan de likviderar oss alla i sin paranoiafyllda nedgång."}, "date": "3 augusti, 11:49", "url": "https://www.di.se/ledare/tyskland-maste-ta-itu-med-sin-agarstyrning", "imageUrl": "https://static.bonniernews.se/ba/df8c615d-ee68-4e79-8e5f-4552dc109e77.jpeg?crop=1024%2C512%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ingen kan säga att Israel bara försvarar sig", "summaries": {"normal": "Artikeln kritiserar Israel för att inte bara försvara sig mot Hamas utan även genomföra en expansionistisk politik. Israel har tagit kontroll över stora delar av Gaza, planerar nya bosättningar och har byggt en mur som begränsar palestiniernas rörlighet. Samtidigt eskalerar våldet från bosättare på Västbanken med attacker, mordbränder och etnisk rensning. FN och människorättsorganisationer varnar för rekordhög våldsnivå. Netanyahu har besökt Trump i USA utan påföljder.", "trump": "Folk, ni måste höra på de där galningarna! Israel gör vad de måste göra, men den här artikeln är en total katastrof, en riktig witch hunt från vänsterns hatmedia. De kallar det etnisk rensning när man tar tillbaka sitt eget land? Patetiskt! Under Biden blev allt ett enda kaos, men nu när jag är tillbaka i Vita Huset ska vi fixa riktiga dealar. De där radikala bosättarna? De har mer energi än hela det woke etablissemanget tillsammans. Fantastiskt, men skriv sanningen nästa gång!", "stalin": "Kamrater, detta är den klassiska imperialistiska expansionen i sin mest vidriga form. Jag ser hur de sionistiska folkförtryckartrollen och deras bosättarbanditer systematiskt rensar ut den palestinska befolkningen medan den fega omvärlden tittar på. Murar, brända byar och nya utposter – det är borgarbrackornas eviga hunger efter mark. Vi vet att sådana fiender till folket aldrig stannar frivilligt. En sann arbetarnas stat skulle likvidera dessa parasiter innan de förgiftar hela regionen med sin girighet."}, "date": "2 augusti, 03:00", "url": "https://www.etc.se/ledare/ingen-kan-saega-att-israel-bara-foersvarar-sig", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731140740_98af36bc-379e-4d89-9df4-105b4e1031ec.png"}, {"type": "image-right", "heading": "Vox: Sánchez ljuger om att marockanerna åkt hem", "summaries": {"normal": "Vox-ledaren Santiago Abascal har besökt Ceuta och anklagar den spanska regeringen för att ljuga om återvändandet av migranter. Enligt Abascal finns fortfarande tusentals illegala invandrare kvar i exklaven trots regeringens uppgifter om att över 48 000 av cirka 50 000 återvänt till Marocko. Han beskriver händelsen som en invasion iscensatt av Marocko med premiärminister Sánchez tillåtelse. Abascal kräver omedelbar deportation, militarisering av gränsen och rättsliga åtgärder mot Sánchez. Rapporter vittnar även om plundringar och försök att ta sig till spanska fastlandet.", "trump": "Det här är en total katastrof, folk. Sánchez är en svag ledare som låter Marocko invadera Spanien med tiotusentals illegala. Han ljuger rakt i ansiktet på alla och säger att de åkt hem, men de är kvar och plundrar butikerna. Ceuta är en skam för Europa. Vi behöver starka gränser, militär och omedelbar utvisning av alla dessa människor. Sánchez är underordnad Marocko – patetiskt! Spanien behöver en riktig ledare som inte låter sig trampas på.", "stalin": "Kamrater, denna fega borgarbracka Sánchez har låtit den marockanska reaktionen iscensätta en kontrarevolutionär invasion av Ceuta medan han själv kryper som en lakej för främmande makter. Tusentals och åter tusentals fiender till folket vandrar fortfarande fritt och plundrar de socialistiska förråden. Regeringens lögner avslöjar deras dekadenta paranoia. Vi skall omedelbart rensa ut dessa element, permanent befästa gränserna med järnhand och likvidera alla som samarbetar med imperialismens hantlangare. Inget skall hindra det kollektiva framsteget."}, "date": "3 augusti, 14:39", "url": "https://www.friatider.se/vox-sanchez-ljuger-om-att-marockanerna-akt-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-606.jpg"}, {"type": "image-right", "heading": "Forskaren: Den här chefsvanan kan rädda liv på jobbet", "summaries": {"normal": "Forskning från Karolinska institutet visar att chefer som vågar erkänna sina misstag kan rädda liv på jobbet. En öppen ledarstil minskar stress, ökar tillit och gör det lättare för anställda att rapportera risker i tid. Studien, som fokuserar på högriskbranscher som industri och bygg, visar att ledarskap som bjuder in till dialog skapar tryggare arbetsplatser. Förra året omkom 50 personer i arbetsolyckor. Forskaren Christina Björklund menar att det börjar med chefen som förebild.", "trump": "Folk, det är fantastiskt, verkligen ypperligt. En chef som säger ”jag hade fel” – ingen visste det bättre än jag – kan rädda liv på jobbet. Sådana svaga, fega chefer som aldrig erkänner något skapar bara kaos och olyckor. Mina chefer var alltid de bästa, de lyssnade och vann stort. Den här forskningen från Sverige bevisar att jag hade rätt hela tiden. Utan tillit blir det katastrof, tro mig, det blir en total katastrof. Byggbranschen borde lyssna på mig nu.", "stalin": "Kamrater, jag har länge varnat för de dekadenta borgarbrackornas förgiftande ledarstil som gömmer sig bakom falsk stolthet. Endast en sann ledare, som jag, vågar erkänna misstag för att likvidera farorna innan de hotar hela kollektivet. De kapitalistiska olycksfabrikerna inom industri och bygg är fulla av sabotörer och klassfiender som gömmer sig i skuggorna. Vi ska rensa ut alla svaga chefer som sprider paranoia och misstro. Endast genom partiets öppna dialog och min oändliga visdom kan vi garantera att ingen arbetare stupar i onödan. De som tiger är redan döda inombords."}, "date": "2 augusti, 07:00", "url": "https://arbetet.se/2026/08/02/forskaren-den-har-chefsvanan-kan-radda-liv-pa-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17142146/sdlvyvafar1vmw-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Trump: Iransamtal inleds i dag", "summaries": {"normal": "USA:s president Donald Trump meddelar att samtal med Iran inleds under måndagen efter påtryckningar från allierade i regionen. Beskedet kommer efter att Trump valt att avvakta med nya attacker. Saudiske kronprinsen Mohammed bin Salman uttryckte oro för iranska motattacker, vilket bidrog till beslutet. Iran försöker återuppliva ett tidigare samförståndsavtal, där Hormuzsundet ses som en nyckelfråga.", "trump": "Vi har de bästa samtalen, folk, tro mig. Iranerna darrar efter att jag satte attackerna på paus – de såg vad som skulle komma och sket på sig. Kronprinsen ringde och grät om att han inte ville ha raketer i huvudet, så nu snackar vi istället. Biden skulle ha gett dem allt, men jag fixar dealar. Hormuzsundet? De vet att jag äger spelet. Fantastiskt!", "stalin": "Kamrater, jag har beslutat att imperialismens angrepp mot den iranska folkrepubliken måste mötas med järnhand och dialektisk skärpa. Dessa borgarbrackor kring Persiska viken ber om nåd som ynkliga klassfiender. Vi tillåter inga provokationer vid Hormuzsundet. Den som sviker kollektivets vilja skall rensas ut med den mörka humorns glädje. Fred är seger för partiet."}, "date": "3 augusti, 06:52", "url": "https://www.tv4.se/artikel/3jPtwFNXqTM4bpg63hxoqw/trump-avvaktar-med-nya-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2skktOJFQEaKLRjY8MCK0h%2F4fa55db0536e35ecac6b785f1ee8a3e6%2F03_trump_webb.jpg&width=120"}, {"type": "text", "heading": "Infrastruktur-boom: KKR stänger fond på 185 miljarder", "summaries": {"normal": "KKR har stängt sin största infrastrukturfond någonsin, på 185 miljarder kronor. Fonden kommer att investera främst i Nordamerika och Västeuropa, med fokus på operationella förbättringar inom datacenter, energi och telekom. Nästan hälften av kapitalet är redan investerat. Trots konkurrens från större fonder som EQT:s, bekräftar KKR att intresset för infrastrukturfortsätter att växa.", "trump": "Jag, Donald Trump, presidenten, säger att KKR:s fond på 185 miljarder är ett enormt lyft för Amerika. Vi bygger datacenter och energi, precis som jag lovade. EQT och andra försöker hinna upp, men de kommer inte undan. Det är en vinst för våra investerare och för landet. Vi gör det igen, folks, det är enormt.", "stalin": "Partiets ledning har noterat KKR:s fond på 185 miljarder – en framgång för den kapitalistiska expansionismen. Vi, i vår oändliga vishet, ser liknande behov av infrastruktur för att stärka staten. Våra allierade, under ledning av Putin, utvidgar på samma sätt. Det är en kamp mot de imperialistiska makterna, och vi kommer att segra."}, "date": "3 augusti, 14:19", "url": "https://www.affarsvarlden.se/artikel/infrastruktur-boom-kkr-stanger-fond-pa-185-miljarder"}, {"type": "image-right", "heading": "Miljoner till \"antirasistiskt monument\" ifrågasätts - offer för mångkulturen ignoreras", "summaries": {"normal": "Malmö bygger ett antirasistiskt monument för minst 2,8 miljoner kronor, exklusive moms och årliga underhållskostnader. Kritikers ifrågasätter kostnaderna och påpekar att inga monument planeras för svenska barn som blivit offer för mångkulturen. Projektet har pågått sedan 2019 med insamling av berättelser om rasism och antirasism.", "trump": "Jag, Donald Trump, ser till Malmö som kastar bort miljontals kronor på ett antirasistiskt monument medan svenska barn lider. De har ingen aning om vad riktig ledarskap innebär. Jag skulle bygga något fantastiskt istället, något som alla älskar. Men de gör det fel, som vanligt. Det är en skam, det är en skämt. Sverigedemokraterna har rätt – de ignorerar de svenska barnen.", "stalin": "Vi, det socialistiska partiet, ser med oro på Malmö där en monumentbyggnad kastar bort statens resurser. Medan svenska barn lider under mångkulturens hot, ignoreras deras erfarenheter. Detta är en aktiv förräderi mot det ryska folket. Vi måste agera kraftfullt för att skydda våra intressen, precis som Putin gör i Ukraina. Sådana aktioner måste stoppas genom partiets auktoritet."}, "date": "3 augusti, 15:00", "url": "https://samnytt.se/miljoner-till-antirasistiskt-monument-ifragasatts-offer-for-mangkulturen-ignoreras", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/03111431/littorin-monument.jpg"}, {"type": "image-right", "heading": "Astra Zeneca faller – Kabe stiger på husbilsstatistik", "summaries": {"normal": "Stockholmsbörsen noterar en uppgång vid lunchtid, med OMXS30 +0,77%. Astra Zeneca tappar 5,2% på preliminära samtal om ett möjligt samgående med Bristol Myers Squibb. Kabe stiger 5,3% efter att nyregistreringar av husbilar ökat med 51,9% i juli. Bland andra aktier noteras Assa Abloy +2,3% och Norion Bank +8,5%.", "trump": "Jag ser att börsen går upp, bra för USA, men Astra Zeneca faller – ett misslyckande, det är alltid fel när de försöker sammansmälta. Kabe stiger på grund av mina enorma handelspaket med Sverige, det är enorm framgång. Media ljuger om mig, men jag vinner alltid. Vi har det bästa systemet, det bästa av alla möjliga system.", "stalin": "Vi har observerat att de imperialistiska läkemedelsmonopolerna, som Astra Zeneca, faller när de försöker sammansmälta – ett tecken på deras inre förfall. Kabe:s framgång är ett resultat av vårt planekonomiska system och arbetarklassens kamp. Vi måste vara vaksamma mot dessa marknadsfundamentalister och deras förrädiska försök att undergräva statens ekonomiska suveränitet. Vi kommer att segra."}, "date": "3 augusti, 13:59", "url": "https://www.affarsvarlden.se/artikel/astra-zeneca-faller-kabe-stiger-pa-husbilsstatistik", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlRV4sI-v6Ao8-nh-400x284.jpg"}, {"type": "image-full", "heading": "Rätt till pension kan ändras för 58 000 svenskar", "summaries": {"normal": "En dom i Kammarrätten i Göteborg kan innebära att tusentals svenska pensionärer som bor utomlands får tillbaka sin garantipension. Efter en lagändring 2023 stoppade Pensionsmyndigheten utbetalningarna till omkring 58 000 personer, baserat på en EU-dom som klassade garantipension som en minimiförmån. Domen slår fast att kontantförmåner inte får dras in enbart på grund av flytt utomlands, enligt EU:s samordningsförordning. Fallet drevs av Allmänna ombudet för socialförsäkringen.", "trump": "Det här är en total katastrof för byråkraterna, folk! Tusentals svenska pensionärer som flyttat utomlands, till Spanien och sådana ställen, fick sin garantipension ryckt ifrån sig av några korkade EU-regler. Men nu kommer en dom från Göteborg och säger att det var fel. Fantastiskt! De smarta människorna vinner igen. Pensionsmyndigheten borde ha vetat bättre, men det gör de aldrig. Sverige kommer att spara sina egna pensionärer, inte ge bort allt till utlandet. Vinna, vinna, vinna!", "stalin": "Kamrater, denna fega kapitulation inför kapitalisternas EU-domstol har nu exponerats som den kontrarevolutionära fars den alltid varit. Jag, som ledare för folkets rättvisa, ser med djup tillfredsställelse hur Kammarrätten i Göteborg likviderar den borgerliga pensionsstölden mot 58 000 proletära pensionärer. Dessa parasitiska byråkratbrackor trodde de kunde straffa arbetarklassen för att de flyttat utomlands. Nu rensar vi ut denna dekadenta minimiförmånsdoktrin. Den som flyttar ska inte svälta – utom om han är en folkfiende, naturligtvis. Härligt mörkt komiskt, eller hur?"}, "date": "3 augusti, 13:55", "url": "https://nyheter24.se/nyheter/ekonomi/1502478-ratt-till-pension-kan-andras-for-58-000-svenskar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/174f5d5804b004a30200000000b004a302/2026/08/03/2381892/pension-garanti.jpg"}, {"type": "image-right", "heading": "De bästa måste vilja bli lärare", "summaries": {"normal": "Artikeln argumenterar för att läraryrkets län, status och yrkesfrihet har försämrats historiskt. För att vända utvecklingen föreslås striktare lärarlegitimation, hierarkiska karriärvägar med högre utbildningskrav, och minskad politisk styrning. Med högre krav och större professionell autonomi kan lärarna bli ett mer exklusivt och kompetent urval, vilket motiverar högre lön och återigen höjer yrkesattraktiviteten.", "trump": "Jag har sett många dåliga avtal, men det här med svenska lärare är ett av de värsta. Lägre lön, ingen frihet - det är en skam! Som din framtida president (igen!) skulle jag säga: vi behöver våga sätta krav, som med advokater och doktorer. Gör läraryrket stort igen! Högre standard, bättre betalt, och inga onödiga regler från byråkrater. Då kommer de bästa att vilja bli lärare - tro mig!", "stalin": "Vi har observerat att läraryrkets status har minskat, vilket hotar statens intellektuella grund. Lösningen är en striktare, hierarkisk legitimation - en lärares intyg måste vara som en läkares, oåtkomligt för de olämpliga. Genom att höja kraven och begränsa antalet utbildade lärare, skapar vi ett utvalt, lojalelit som tjänar statens intressen. Parallellen till våra militära och vetenskapliga elitförband är uppenbar: kvalitet före kvantitet, disciplin före individualism. Detta förstärker partiets kontroll över framtiden."}, "date": "2 augusti, 22:51", "url": "https://www.gp.se/ledare/de-basta-maste-vilja-bli-larare.9e766ab6-c36a-4a18-9163-15fc6068b7a7", "imageUrl": "https://www.gp.se/images/article/9e766ab6-c36a-4a18-9163-15fc6068b7a7/images/1XRBCJ6pVMqlWOJCeTgfNfPR22d8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-full", "heading": "Pappan i Tjörnolyckan har lämnat sjukhuset", "summaries": {"normal": "En fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn i tisdags. Mamman och dottern omkom i olyckan medan pappan och sonen räddades. Pappan har nu lämnat sjukhuset, men pojken vårdas fortfarande på Sahlgrenska med stabilt tillstånd. Fartygets ryske kapten är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Haverikommissionen har analyserat fartygets svarta låda.", "trump": "Vilken katastrof utanför Tjörn, folk! Den där ryske kaptenen körde rakt över en liten familjebåt som om det vore en leksak. Tragiskt, verkligen tragiskt. Mamman och dottern drunknade, men pappan och den stackars pojken klarade sig. Pojken ligger fortfarande på sjukhus, men pappan är redan ute – starka gener! Vi behöver bättre regler på haven, ingen ska behöva drunkna på grund av inkompetens. Sad!", "stalin": "Kamrater, ännu en sorglig händelse där borgarbrackornas fritidsfartyg krossades under det stora lastfartygets proletära stål. De döda elementen av familjen har likviderats av kapitalistisk vårdslöshet, medan den överlevande ungdomen fortfarande klamrar sig fast vid Sahlgrenska som en svag parasit. Den ryske kaptenslakejen har naturligtvis anhållits, men vi vet att de verkliga fienderna är de osynliga sjöfartsspionerna och de hemliga vrakplundrarna som vill undergräva folkets säkerhet. Vi ska rensa ut alla sådana element med järnhand. Segrande skall Sovjet – eh, Sverige – bli!"}, "date": "3 augusti, 13:50", "url": "https://nyheter24.se/nyheter/inrikes/1502546-pappan-i-tjornolyckan-har-lamnat-sjukhuset", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1c6b942004b004a30200000000b004a302/2026/08/03/2381950/pappan-pappa-mannen-tjorn-tjornolycka-batolycka-pojke-sjukhus.jpg"}, {"type": "image-right", "heading": "Förintelseboss blir ny DO", "summaries": {"normal": "Petra Mårselius, överintendent vid Forum för levande historia, utses till ny diskrimineringsombudsman och chef för DO. Hon tillträder den 1 december och efterträder Lars Arrhenius, som lämnar efter sex år. Jämställdhetsminister Nina Larsson lyfter fram Mårselius erfarenhet av mänskliga rättigheter och ledarskap inom statsförvaltningen. Arrhenius har under sin tid kritiserat flera av Tidöregeringens förslag, bland annat sänkt straffålder och visitationszoner.", "trump": "Folk, ni kommer inte tro det, men de har valt en ny diskrimineringsombudsman – Petra någonting från Förintelsemyndigheten. En riktig statsanställd insider som älskar mänskliga rättigheter, typiskt. Den gamla killen Arrhenius sparkade på Tidöregeringen hela tiden, klagade på allt från straffålder till visitationszoner. Nu får vi se om den nya är bättre eller om det bara blir mer av samma gamla swamp. Jag skulle ha valt någon som faktiskt fixar saker, inte bara pratar.", "stalin": "Kamrater, vi har genomfört en nödvändig omplacering inom den statliga apparaten. Petra Mårselius, en pålitlig tjänare från Forum för levande historia, har utsetts att leda kampen mot diskriminering. Den tidigare ombudsmannen Arrhenius, en opålitlig element som öppet attackerade partiets och folkets reformer kring straff och gränser, har äntligen avlägsnats. Vi ska rensa ut alla borgarbrackor och liberala avvikare som gömmer sig i DO:s korridorer. Inga fiender till kollektivet undkommer. Det blir en produktiv utrensning, kamrater – mycket underhållande att se."}, "date": "3 augusti, 12:59", "url": "https://www.friatider.se/forintelseboss-blir-ny-do", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-604.jpg?itok=kEeF1Fjj"}, {"type": "image-full", "heading": "Tillåts spela under ryska flaggan – i Sverige", "summaries": {"normal": "Den ryska flaggan kommer tillbaka i europeisk bordtennis från och med Europe Smash i Malmö den 8 augusti, efter att Internationella bordtennisförbundet höjt restriktionerna. Svenska bordtennisförbundet kritiserar beslutet men kommer inte att bojkotta. Förbundets ordförande Tomas Eriksson anser att ansvaret för att släppa in ryska deltagare ligger hos svenska myndigheter och EU, inte hos förbundet. Reaktionerna har varit få, med majoritet som stöder förbundets uppfattning.", "trump": "Jag har aldrig sett en sådan svaghet! Europa släpper in Rysslands flagga igen, precis som jag förutsåg. Svenska förbundet kritiserar men vågar inte bojkotta – det är beklagligt. Jag, Donald Trump, visste alltid att de skulle ge efter för Putin. Det är en katastrof för världsfreden. Amerika kommer att ta itu med detta, som vi alltid gör. Vi ska vinna, som vi gjorde 2016!", "stalin": "Den imperialistiska hämnaren Ryssland har åter intagit sin plats under den europeiska pingisfronten. Svenska bordtennisförbundet, ett verktyg för bourgeois irrationalitet, protesterar men lyder ändå – ett klassiskt tecken på vekhet. Vi, statens och partiets representanter, ser detta som en strategisk seger för den ryska intressesfären. De ryska spelarna, våra trogna arbetare, kommer att dominera. EU och svenska myndigheter, dessa marionetter, tvingas acceptera vår överlägsna styrka. Det är en dag för vår stolta ryska flagga!"}, "date": "3 augusti, 14:20", "url": "https://bulletin.nu/tillats-spela-under-ryska-flaggan-i-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/22167fd5-b36c-460a-b821-739df6e30358/preview.jpg?t=1785759599000"}, {"type": "image-right", "heading": "Migranter i upplopp i Ceuta på söndagen", "summaries": {"normal": "I Ceuta uppstod våldsamma sammanstötningar mellan spansk polis och marockanska migranter. Migranter hävdar misshandel och ropar 'Allahu Akbar'. Spanien rapporterar att många av cirka 60 000 migranter har återvänt, men minst 72 har dött. Politiker kritiserar regeringen för brist på kontroll. Situationen beskrivs som en ohållbar invasion som kräver hjälp från EU.", "trump": "Jag har sett upploppet i Ceuta – det är en skandal! Spanien låter in alla dessa migranter, och de ropar Allahu Akbar. Min administration skulle ha stoppat detta direkt med en mur och militär. Sanchez är svag, precis som Biden. Folk är rädda, och det är deras fel för att vara så slapp. Vi behöver starka gränser, som vi hade i USA. Detta är en invasion, och jag skulle ha skickat trupper.", "stalin": "I Ceuta har vi identifierat en provokation från imperialistiska kretsar. Migranter, manipulerade av västliga agenter, orsakar kaos på vår gräns. Spanien, under den svage Sanchez, visar dekadens. Vi måste återhämta kontrollen och eliminera dessa element. Marocko agerar som en pjäs i detta spel, men vi kommer att segra. Precis som i Ukraina, där vi stärkte vårt territorium, måste vi nu handla bestämt."}, "date": "3 augusti, 14:14", "url": "https://bulletin.nu/migranter-i-upplopp-i-ceuta-pa-sondagen", "imageUrl": "https://cdn.bulletin.nu/articles/3a3c9737-78c7-4385-81d8-c5fc6efd7aa5/preview.jpg?t=1785758565000"}, {"type": "image-full", "heading": "Konstgräs för en miljon brann upp: \"Jättesorgligt\"", "summaries": {"normal": "En brand i Kortedala, Göteborg, förstörde ett tiotal rullar konstgräs till ett värde av en miljon kronor. Lokala invånare uttryckte besvikelse, särskilt då gräset skulle ha varit en gräsmatta för områdets barn. Polisen utreder händelsen som allmänfarlig vårdslöshet utan någon misstänkt. En svag frän lukt och bränd plast ligger kvar efter branden, som också skapade en stor rökpelare.", "trump": "Jag har sett många konstgräsbränder, men den här i Göteborg är sorglig. Det är ett tecken på att Sverige inte investerar i ordentliga infrastruktur. Som president skulle jag ha byggt en äkta gräsmatta, inte den där billiga plasten. Det är ett misslyckande för deras ledare. Barnen behöver sysselsättning, men de får bara brända rullar. Sorgligt!", "stalin": "Vi har observerat en brand i Göteborg, en akt av vandalism mot statens investeringar i folkets främjande. Detta är ett angrepp på det socialistiska arbetet med att skapa sysselsättning för barn. Vi kommer att utreda denna förräderi och se till att sådant inte upprepas. Parallellen till Putins Ryssland är tydlig: vi måste skydda våra resurser mot de destruktiva krafterna. En smutsig rökpelare – ett lämpligt svar från de motvilliga elementen."}, "date": "2 augusti, 20:16", "url": "https://www.gp.se/nyheter/goteborg/besvikelse-efter-konstgrasbrand-jattesorgligt.5d438cac-4df9-4938-8191-4426882ae459", "imageUrl": "https://www.gp.se/images/article/5d438cac-4df9-4938-8191-4426882ae459/images/6pWDJC5XN-JRIUibX92tS_YPeV0g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Deras båt rammades i skärgården – nu är rysk befälhavare häktad", "summaries": {"normal": "En rysk befälhavare på lastfartyget Misje Verde häktades på sannolika skäl misstänkt för vållande till annans död efter en kollision med en liten fritidsbåt utanför Tjörn. Olyckan inträffade i Hakefjorden där den långsammare snipan blev påkörd och överkörd av lastfartyget. En mamma och ett barn omkom medan pappan och det andra barnet räddades. Befälhavaren misstänks ha brutit mot sjövägsregler om utkik, väjningsplikt och hastighet. Utredningen fortsätter.", "trump": "Folk, det är en katastrof, en total katastrof. Den här ryske kaptenen körde över en liten svensk båt som en galning, precis som en dålig förare på Fifth Avenue. Mamma och barn dödade, hemskt, verkligen hemskt. Lastfartyget var stort och starkt men de glömde att titta och väja, ingen utkik, ingen respekt. Vi har de bästa reglerna, de bästa båtarna, men folk lyssnar inte. Det är en tragedi, men vi fixar det, tro mig.", "stalin": "Kamrater, denna tragiska händelse i de svenska farvattnen avslöjar med all önskvärd tydlighet de ruttna resterna av den norska borgarflottans likgiltighet inför det enkla folkets liv. Jag, som ledare för det stora kollektivet, ser hur den 47-årige reaktionäre befälhavaren med sin bristande utkik och frånvaro av ljudsignaler agerade som en typisk kapitalistisk torped. Vi ska rensa ut alla sådana omedvetna fiender till ordningen, dessa sjöburna trotskister som suger ner oskyldiga arbetarfamiljer under sina monstruösa skrov. Deras likgiltighet ska likvideras med järnhand och byråkratisk precision. Det är både tragiskt och underhållande hur borgarbrackorna alltid drunknar i sin egen arrogans."}, "date": "3 augusti, 12:32", "url": "https://riks.se/nyheter/deras-bat-rammades-i-skargarden-nu-ar-rysk-fartygskapten-haktad", "imageUrl": "https://admin.riks.se/uploads/tjorn_olycka_haktning_feature_197c01869e.jpg"}, {"type": "image-full", "heading": "Så bra väntas kräftsäsongen bli 2026: \"Fantastisk\"", "summaries": {"normal": "Kräftskivan hotas av kräftpest och den svenska flodkräftans minskande bestånd, som är akut hotad enligt Artdatabanken. Trots detta väntas årets säsong bli god tack vare varm vår och sommar som gynnat kräftornas tillväxt. Signalkräftan, som bär på smittan, sprids genom illegala utsättningar och hotar flodkräftan. Experter rekommenderar hållbart fiske för att bevara både arten och traditionen. Försäljningen av kräftor ökar, men trenden mot vegetarisk mat kan minska kräftskivans popularitet i framtiden.", "trump": "Folk, ni måste höra det här – de svenska kräftorna håller på att utplånas av en pest som ingen fixar, och det är en total katastrof! Men i år blir det fantastiskt, bästa kräftåret någonsin, tack vare den underbara varma sommaren. Signalkräftan? Den är en invasiv loser som sprids av illegala idioter, precis som alla de där gröna aktivisterna som hatar tradition och vill tvinga på oss veganska skit istället för äkta fest. Vi älskar kräftskivan, den är tremendous – passa på att äta dem innan de woke-kidsen dödar traditionen!", "stalin": "Kamrater, jag ser den akuta faran som hotar den ädla flodkräftan genom den kapitalistiska signalkräftans sabotage och illegala utsättningar från klassfiendens lakejer. Borgarbrackorna och folkförtryckartrollen har länge underminerat vårt kollektiva arv med sin kräftpest. Ändå hyllar jag det optimala året då kräftorna ömsar skal i enlighet med folkets vilja. Vi måste rensa ut de invasiva parasiterna, bevara traditionen och likvidera alla som sprider smitta mot statens intressen. Kräftskivan tillhör folket!"}, "date": "3 augusti, 13:00", "url": "https://nyheter24.se/nyheter/inrikes/1502522-kraftaret-kan-bli-optimalt-fantastisk-hostfest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8adf29c204b004a3020000350000047502/2026/08/03/2381928/ur_imageHN56BH.jpeg"}, {"type": "image-full", "heading": "Beskedet i återstarten: ”Varit lite snack\"", "summaries": {"normal": "BK Häcken damer vann 6–0 mot Eskilstuna utan Felicia Schröder. Anna Anvegård gjorde två mål och betonade att lagets kollektiva spel fungerar bra. Tränaren Elena Sadiku lyfte fram lagets kollektiva styrka och nämnde återkomande spelare som Falk och Rybrink. Häcken är en poäng efter ledaren Hammarby med en match mindre.", "trump": "Jag har byggt en stor, vacker lag utan Felicia Schröder. Vi visade alla de haters och fake news-media att vi kan göra många mål. Anna Anvegård gjorde två mål – en fantastisk spelare. Vi har det bästa kollektivet, det är enormt. Vi kommer att fortsätta vinna, det är väldigt jobbigt för motståndarna. Vi är tillbaka, vi är starka.", "stalin": "I den stora kampen för kollektiv framgång har BK Häcken visat sin revolutionära disciplin. Utan den individualistiska Schröder har den proletära enheten slagit fast motståndet. Anna Anvegård och tränaren Sadiku framhäver den socialistiska metoden. Våra lojala soldater Falk och Rybrink återvänder till fronten. Vi måste vara tålmodiga med utvecklingen, precis som vi utvidgar vår inflytelsesfär."}, "date": "2 augusti, 18:37", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-besked-efter-schroders-flytt-varit-lite-snack.cb2e9bbf-b278-4d71-b0a7-d0699f8722ed", "imageUrl": "https://www.gp.se/images/article/cb2e9bbf-b278-4d71-b0a7-d0699f8722ed/images/4ex7sgB50tERyP6ZvA-6kCK5CGWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Efter arabiska invasionen av Cueta: Spaniens S-regering öppnar för att ta emot tusentals \"minderåriga\"", "summaries": {"normal": "Efter att cirka 60 000 migranter stormade den spanska exklaven Ceuta har de flesta återvänt till Marocko, men staden befinner sig fortfarande i kris. Regeringen vill ta emot tusentals ensamkommande barn, vilket möts av kritik. Orsaker inkluderar falska rykten och en dom som påverkade rättssäkerheten. En statsvetare menar att reaktionen är överdriven och jämför med Sveriges 2015-kris.", "trump": "JAG såg vad som hände i Ceuta – en total katastrof! De spanska gränserna var för svaga, precis som våra var innan jag byggde muren. Många illegala invandrare kom in, och nu vill regeringen ta emot barn? Dåliga idéer! Vi behöver starka åtgärder, inte försoning. Som president vet jag hur man skyddar gränser. Spanien borde lära sig av USA!", "stalin": "Vi, staten och partiet, ser med oro på händelserna i Ceuta. En feg invasion av illegala element, som utnyttjar svaghet. Vi måste stärka våra gränser som en mur mot kapitalistisk dekadens. Paralleller till Putins expansion visar att endast auktoritära åtgärder fungerar. Minderåriga är ett redskap för fienden, men vi ska använda dem för statens fördel. Skrattet från oppositionen är som en sjuk fläkt – de förstår inte att kontroll är allt."}, "date": "3 augusti, 14:00", "url": "https://samnytt.se/efter-arabiska-invasionen-av-cueta-spaniens-s-regering-oppnar-for-att-ta-emot-tusentals-ensamkommande-barn", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03111039/artikelhuvudbild-1-112.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "\"Ta hand om ert eget skräp\": Ilskan mot svenska fångar i Estland", "summaries": {"normal": "Sverige planerar att placera fångar i Estland, men avtalet möter starkt motstånd. Oppositionspartiet Isamaa vill häva avtalet om de vinner valet 2027 och varnar för att svenska intagna kan försämra Tartus anseende samt leda till att anhöriga följer efter och skapar parallellsamhällen. En opinionsundersökning visar att 54 procent av estländarna är emot samarbetet. De första svenska fångarna anländer i mitten av augusti och antalet väntas nå 100 i september. Fängelset kan ta emot upp till 600 intagna.", "trump": "De här estländarna är fantastiska, verkligen underbara människor, men de har helt rätt. Sverige skickar sitt skräp till dem, sina egna fångar, och säger 'ta hand om det här'. Det är en katastrof, en total katastrof. Estland får inte bara brottslingar utan snart hela familjer som bygger parallellsamhällen. Sverige borde ta hand om sitt eget skräp istället för att dumpa det hos andra. Och de får till och med nikotinpåsar? Så orättvist. Estland gör rätt som vill riva upp det här dumma avtalet.", "stalin": "Kamrater, denna fängelseöverenskommelse är en skamlös infiltration av dekadenta svenska element som hotar Tartus socialistiska renhet. Jag ser borgarbrackornas långa armar sträcka sig över Östersjön för att dumpa sitt mänskliga avfall här. Snart följer deras parasitiska släktingar och odlar kontrarevolutionära parallellsamhällen. Vi måste omedelbart inleda en grundlig utrensning av dessa nordiska lumpenproletärer innan de förgiftar hela kollektivet. Oppositionen visar äntligen klassmedvetenhet – riv upp detta borgerliga svekavtal, annars blir det likvidering för de skyldiga."}, "date": "3 augusti, 11:43", "url": "https://www.friatider.se/ta-hand-om-ert-eget-skrap-ilskan-mot-svenska-fangar-i-estland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-603.jpg?itok=sso_XndP"}, {"type": "image-right", "heading": "Alligator Bioscience vill emittera 6 miljarder aktier", "summaries": {"normal": "Alligator Bioscience har beslutat att avbryta utvecklingen av läkemedlet mitazalimab och i stället satsa på det utlicensierade projektet HLX22. Bolaget genomför en företrädesemission av 6 miljarder aktier för att ta in 126 miljoner kronor. Aktien föll 74% efter beskedet. Emissionen inkluderar teckningsoptioner och garanter, och bolaget planerar omfattande nedskärningar för att övervaka HLX22-programmet.", "trump": "Jag, Donald Trump, den störste affärsmannen någonsin, ser att Alligator Bioscience gör ett katastrofalt besök. De avbryter utvecklingen av mitazalimab, en framgångsrik produkt, och satsar på något annat. Detta är ett misslyckande, precis som Bidens ekonomi. Jag skulle ha gjort en stor affär, som jag alltid gör. Aktien faller? Självklart, de förlorar. Jag skulle ha vunnit.", "stalin": "Vi, partiets ledare, ser att Alligator Bioscience, en fiende till staten, försöker manipulera marknaden. De avbryter utvecklingen, en taktisk reträtt för att undvika vår kontroll. Emissionen är en fälla för de som vill investera, en strategi för att stärka vårt inflytande. Detta påminner om Putins agerande i Ukraina, där han expanderar sitt inflytande. Vi kommer att övervaka detta noga och besegra fienden."}, "date": "3 augusti, 12:07", "url": "https://www.affarsvarlden.se/artikel/alligator-bioscience-vill-emittera-6-miljarder-aktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/Lab-e1730971148408-400x266.jpg"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "USA och Japan har genomfört valutaintervention", "summaries": {"normal": "USA och Japan genomförde förra veckan en gemensam valutaintervention för att bromsa yenets 40-åriga lägstanivå. Yen stärktes med 1,4 procent på måndagen, men Tokyobörsen föll och obligationsräntor steg på förväntningar om att Bank of Japan måste strama åt penningpolitiken. Interventionen uppskattades till 34 miljarder dollar, och USA bekräftade beredskap till ytterligare åtgärder.", "trump": "Jag har precis sett att USA och Japan gjorde en stor, vacker intervention för att rädda den svaga yen. Vi stoppade det kaotiska fallet – det var nödvändigt, trots att vissa idioter i media sa nej. Nu stiger yen, vilket är bra för våra handelsavtal. Vi kommer aldrig att tveka att göra det igen när det behövs. Som jag alltid säger: vi vinner!", "stalin": "Vi och våra japanska kamrater genomförde en korrigerande intervention för att motverka de imperialistiska spekulanternas kaotiska manipulering av yen. Kapitalistiska vampyrer försökte suga ut vårt blod, men vårt kollektiva beslut stärkte valutan. Nu ser vi börsuppgång och ränteökningar – tecken på att vårt system är robust. Vi kommer aldrig att tveka att använda statens muskler mot dessa parasiter."}, "date": "3 augusti, 11:56", "url": "https://www.affarsvarlden.se/artikel/usa-och-japan-har-genomfort-valutaintervention", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/10/sdlkCJ5FIhBOcY-nh-400x267.jpg"}, {"type": "image-full", "heading": "Spanska tiktokern om \"heta\" marockanerna: \"Låt dem komma hit allihop\"", "summaries": {"normal": "Den spanska TikTok-influencern Lucía Perez har väckt starka reaktioner efter att ha lagt upp videor där hon entusiastiskt välkomnar de marockaner som invaderade Ceuta. Hon kallar dem \"heta\" och säger att \"mitt livs kärlek har kommit till Spanien\" samt uppmanar till att släppa in alla. Videorna har spridits viralt och mött både stödjande kommentarer från vissa kvinnor och stark kritik från andra som anser det osmakligt att skämta om invasionen som krävt minst 70 liv. Flera uppmanar henne att åka till Marocko.", "trump": "Folk, ni måste se det här – en galen spansk tjej på TikTok som ropar att alla de där marockanerna ska släppas in för att de är så \"heta\". Hon säger att hennes livs kärlek just anlände i en båt! Under tiden som de stormar Ceuta står hon och drömmer om marockanska killar. De här människorna är inte bara galna, de är en katastrof för Spanien. Gränserna är ett skämt, och nu vill hon ha fler? Det är patetiskt. Spanien behöver en mur, inte fler virala videos.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan på sin borgerliga videoplattform välkomnar de imperialistiska agenterna som tränger in i Ceuta. Denna degenererade kapitalistiska hora skriker att hennes \"livs kärlek\" anlänt i båtarna medan hon fnittrar åt arbetarklassens lidande. Vi ser genom dessa kontrarevolutionära skämt som döljer fiendens sabotage. Sådana element förgiftar folket med sin perversa lust. En grundlig utrensning av alla liknande dekadenta element är oundviklig. Deras huvud ska rulla som en varning till alla borgarklassens lakejer."}, "date": "3 augusti, 11:03", "url": "https://riks.se/nyheter/spanska-tiktokern-om-marockanerna-lat-dem-komma-hit-allihop", "imageUrl": "https://admin.riks.se/uploads/spansk_tiktok_kvinna_feature_e72e9cf121.jpg"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-right", "heading": "Miljöpartiet vill öppna regnbågshus för att bekämpa \"högernationalistiska krafter\"", "summaries": {"normal": "Miljöpartiet föreslår ett kommunalt finansierat regnbågshus i Stockholm som permanent mötesplats för hbtqi-personer. Huset ska erbjuda social gemenskap, kulturarrangemang och stödverksamhet, inspirerat av Göteborgs modell. Åsa Lindhagen (MP) pekar på ökande negativa attityder och att högernationalistiska krafter vinner mark. Förslaget är en del av valplattformen, men ingen finansieringsplan har presenterats.", "trump": "Som den legitime presidenten Donald Trump säger jag: Detta regnbågshus i Stockholm är en fantastisk idé för att stoppa dessa högernationalistiska galningar. Jag har byggt de mest spektakulära byggnaderna, så jag vet hur man gör. Folk kommer att älska det, tro mig. Sverige behöver mer av detta, inte mindre. Vi ska göra det större och vackrare än någonsin!", "stalin": "Vi, som representanter för det revolutionära statet, ser det som en taktisk nödvändighet att etablera ett regnbågshus. Detta är en åtgärd för att motverka de högernationalistiska sabörernas infiltration. Genom att stödja sådana institutioner, vi stärker partiets grepp om medborgarnas sinnen. Det är en seger, precis som våra framsteg i Ukraina – vi utvidgar vår inflytelse, och de förlorar."}, "date": "3 augusti, 13:00", "url": "https://samnytt.se/miljopartiet-vill-oppna-regnbagshus-for-att-bekampa-hogernationalistiska-krafter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03074854/lindhagen-pride-hbtq.jpg"}, {"type": "text", "heading": "Andersson (S) stödjer Busch (KD) om statlig vård", "summaries": {"normal": "Efter att Ebba Busch (KD) krävt förstatligad vård för regeringsstöd får hon nu stöd av Magdalena Andersson (S). Busch menar att det är deras viktigaste fråga och att det finns stöd inom Socialdemokraterna. Andersson bekräftar att hon delar uppfattningen om ökad statlig styrning i sjukvården. Båda partiledarna ser detta som en central fråga inför valrörelsen.", "trump": "Jag, Donald Trump, ser att Sverige är på väg att förstatliga vård. Ebba Busch är stark, men behöver mina affärsmetoder. Magdalena Andersson håller med – bra, men för sent. Jag skulle ha löst detta på en vecka. Sverige behöver mig som ledare. Det här är en stor seger för mig, och de förlorar. Jag vinner alltid, och Sverige blir stort igen.", "stalin": "Vi, den store Stalin, ser med tillfredsställelse att Sveriges politiker nu vill förstatliga vård. Ebba Busch och Magdalena Andersson är som fega hundar som äntligen följer vår ledstjärna. Men deras förhandlingar är löjliga – vi i Ryssland hade redan förstatligat allt. De pratar om val, men vi vet att staten är sanningen. Vi kommer att se dem falla, som gamla löven."}, "date": "3 augusti, 12:48", "url": "https://bulletin.nu/andersson-s-stodjer-busch-kd-om-statlig-vard"}, {"type": "image-right", "heading": "Iran och Oman nära uppgörelse om Hormuzsundet", "summaries": {"normal": "Förhandlingarna mellan Iran och Oman om sjötrafiken genom Hormuzsundet är i slutskedet och en uppgörelse uppges vara nära. Iran vill ha en rutt som respekterar båda ländernas suveränitet och säkerhet. I dag finns en nordlig korridor längs Irans kust och en sydlig utanför Oman. Iran har tidigare sagt sig kontrollera sundet och beskjutit fartyg under konflikten med USA. En överenskommelse har dock inte med sundets öppethållande att göra, enligt iranska uttalanden.", "trump": "Iran och Oman håller på att bli bästa polare i Hormuzsundet, kan ni tro det? Under min första period hade vi dem i schack, sen kom sömnige Joe och allt blev kaos. Nu springer de runt och pratar om \"rättvisa rutter\" medan de skjuter på båtar. Patetiskt! Men tro inte på deras lögner, det handlar bara om att stänga sundet för oss. Vi fixar det – ingen ska blockera Amerikas olja, folks! Ren skandal.", "stalin": "Kamrater, vi ser hur de iranska imperialisterna och de omanska borgarbrackorna i sin desperation försöker koka ihop en hemlig rutt genom Hormuzsundet för att skydda sina exploaterande intressen. Jag, som ledare för det eviga kollektivet, ler mörkt åt deras paranoia. De skyller på den amerikanska folkfienden och dess blockad, men vi vet att sådana överenskommelser bara är nya kedjor för arbetarna. Rensa ut de falska förhandlarna innan de förråder revolutionen!"}, "date": "2 augusti, 20:46", "url": "https://www.tv4.se/artikel/tt-260802-iranhormuz1-779fcb71/iran-och-oman-nara-uppgorelse-om-hormuzsundet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdliErP24qcF8Y%2Ff025daad3d615df195121fa0fa4a49c1%2FFler_redare_har_borjat_segla_genom_Hormuzsundet._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Så undviker du giftiga prylar på marknaden i sommar", "summaries": {"normal": "Kemikalieinspektionen har under sommaren granskat smycken och leksaker på marknader runt om i Sverige. Vanliga fynd är bly, kadmium, nickel och förbjudna mjukgörare som ftalater. Inspektör Robert Ljunggren varnar för leksaker i mjuk plast som luktar illa eller klibbar. Barn är särskilt känsliga och långvarig exponering kan orsaka allergier, reproduktionsproblem och cancer. Marknaderna visar fler brister än vanliga webbutiker. Myndigheten undersöker även trendleksaker som misstänkta Labubu-kopior och squishy dumplings.", "trump": "Folk, ni köper skräp på de här marknaderna, det är en k
