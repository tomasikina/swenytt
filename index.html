 för sent. Regeringen prioriterade skattesänkningar framför skolans behov, vilket bidragit till ökat våld och sämre elevstöd.", "trump": "Det här är en total katastrof, folk. Den svenska regeringen har misslyckats totalt med skolan, precis som de gör med allt annat. Nedskärningar, ignorans och nu en kommission? Patetiskt. De borde ha lyssnat på varningarna istället för att ge bort pengar till fel personer. Sverige behöver starka ledare, inte svaga ursäkter. Gör skolan stor igen!", "stalin": "Kamrater, denna fega borgarregim avslöjar sin parasitiska natur genom att svara på arbetarklassens lidande med en byråkratisk kommission. Jag har sett hur kapitalisterna rensar ut stöd till skolorna medan de göder de rika. Deras paranoia inför folkets vrede är underhållande. Vi ska likvidera sådana svagheter och stärka det kollektiva skyddet mot kontrarevolutionära element."}, "date": "25 augusti, 06:50", "url": "https://arbetet.se/2026/08/25/efter-skolattacken-i-fagersta-regeringens-svar-ar-ett-han", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25065040/attack-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Åtta av tio muslimer väljer S eller V", "summaries": {"normal": "En Novus-mätning visar att 80 procent av svenska muslimer sympatiserar med S eller V. Regeringspartierna får sammanlagt under 4 procent medan SD når 10,4 procent. Val-forskaren Henrik Ekengren Oscarsson kopplar SD:s stöd till önskan om stram migrationspolitik, ordning och hårdare tag mot brottslighet i utsatta områden.", "trump": "Hörni, muslimerna i Sverige röstar 80 procent på socialisterna och vänstern – en total katastrof! Mina vänner, de hatar de svaga regeringspartierna som knappt får 4 procent. Men SD får över 10 procent, smarta människor som vill ha lag och ordning. Sverige håller på att vakna, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur 80 procent av de troende vänder sig mot de sanna folkets partier och förkastar de dekadenta borgerliga brackorna som knappt når 4 procent. SD:s 10-procentiga stöd bland muslimerna visar att även de inser behovet av att rensa ut brottslighetens parasitiska element ur samhällskroppen. Utmärkt."}, "date": "25 augusti, 08:09", "url": "https://www.friatider.se/atta-av-tio-muslimer-valjer-s-eller-v", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-746.jpg"}, {"type": "image-full", "heading": "USA kan dra tillbaka 200 000 visum", "summaries": {"normal": "USA planerar att återkalla cirka 200 000 visum för personer som sökt asyl efter ankomst. Åtgärden berör två typer av korttidsvisum utfärdade de senaste tio åren. Nya sökande måste nu intyga att de inte avser söka asyl. Tidigare har 175 000 visum återkallats av andra skäl.", "trump": "Titta bara på det här – folk kommer hit på turistvisum och tror att de kan stanna för evigt! Jag ska stoppa det. 200 000 visum dras tillbaka, och nya regler gör det klart: USA är INTE ett hotell. Om du vill stanna, följ lagen. Vi tar tillbaka vårt land, en visumansökan i taget!", "stalin": "Kapitalistiska hycklare i Vita huset avslöjar sin sanna natur! De lockar arbetare med löften om frihet, för att sedan kasta ut dem som gamla tidningar. 200 000 visum återkallas – ett nytt rekord i imperialistisk grymhet. Men var lugna, kamrater: deras system är ruttet. Snart skrattar vi sist, medan deras murar faller som Berlinmurens spillror!"}, "date": "25 augusti, 06:25", "url": "https://kvartal.se/nyheter/artiklar/usa-kan-dra-tillbaka-200-000-visum/cG9zdDoxNzM0NTg", "imageUrl": "https://images.kvartal.se/2026/08/1b9a8636-trumpp.webp"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-right", "heading": "Dadgostar: Kommer inte fälla Magdalena Andersson", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar meddelar att partiet inte kommer att fälla en regering ledd av Magdalena Andersson. Hon utesluter inte att sitta i regering vid behov och är öppen för samarbete med Centerpartiet. Dadgostar ser inget troligt nyval i höst och betonar att partiet vill undvika en sådan situation.", "trump": "Titta på de här svenska kommunisterna som plötsligt blivit mjuka som smör. Den röda Dadgostar säger att hon inte tänker fälla sin väninna Andersson – vad en överraskning! De är så patetiska att de till och med vill krama Centerpartiets misslyckade globalister. Patetiskt, men typiskt för vänsterns svaga förlorarmentalitet. Vi har sett det förut.", "stalin": "Jag betraktar med förakt hur dessa opportunistiska revisionister dansar kring makten som fega klassförrädare. Dadgostar kryper för borgarbrackorna och vägrar nu rensa ut de socialdemokratiska parasiterna. Ett sådant svagt, förhandlande krypande förtjänar utrensning ur varje äkta arbetarparti. Kamrater, se hur revisionismen förråder folket igen."}, "date": "25 augusti, 08:05", "url": "https://www.tv4.se/artikel/6ygmPq8nP1Z6qsmFEmhSBx/nya-v-beskedet-kommer-inte-faella-magdalena-andersson", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2kwmmxNpeCv1k43Kl5544U%2F954f8e0229e06514b8b218aa43e64741%2F24-nooshi-webb.jpg&width=120"}, {"type": "image-right", "heading": "Pareto: Försvarsindustrin ska växa 15% årligen", "summaries": {"normal": "Efter 30 års snålhet ska Europa äntligen rusta. Nato-länderna siktar på 3,5 procent av BNP till 2035, plus 1,5 för civilt försvar. Pareto spår 15 procents årlig tillväxt för försvarsindustrin 2025–2030 – även underleverantörer får häng med.", "trump": "Europa har snålat i 30 år – nu måste de betala! Jag sa ju det. 15 procent årlig tillväxt? Patetiskt. I USA gör vi mycket mer. Men bra att de äntligen lyssnar på mig. De ska upp till 5 procent av BNP – annars får de klara sig själva!", "stalin": "Kamrater, efter 30 år av sabotage från västliga kapitalister måste vi rensa ut underinvesterarna. Försvarsindustrin ska växa 15 procent årligen – annars blir det gulag för kontraktstillverkare. Partiet övervakar allt. Fiender som snålar med försvaret ska likvideras."}, "date": "25 augusti, 11:00", "url": "https://www.affarsvarlden.se/artikel/pareto-forsvarsindustrin-ska-vaxa-15-arligen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/SAAB_LOKE_251211_0453-400x267.jpg"}, {"type": "image-full", "heading": "Miljardär förlorar strid om konkursförvaltare – konkursen skrivs av", "summaries": {"normal": "Stockholms tingsrätt har avslagit en affärsmans begäran om att entlediga sin konkursförvaltare. Mannen, som har en skatteskuld på 1,6 miljarder kronor, anklagade förvaltaren för partiskhet. Domstolen fann att förvaltaren agerat korrekt. Samtidigt skrivs konkursen av då tillgångarna inte täcker kostnaderna, vilket innebär att staten troligen blir utan utdelning trots försök att spåra utländska tillgångar.", "trump": "En svensk miljardär försökte bli av med sin förvaltare, men domstolen sa nej – totalt fiasko! De försökte kräva 1,6 miljarder i skatt, en enorm summa, men nu är konkursen avskriven. Alla pengar är borta, spårlöst borta till Cypern. Det är en sorglig historia, mina vänner. De har ingen aning om hur man gör affärer, det kan jag säga er!", "stalin": "Vi har granskat denna borgerliga parasit som försöker gömma 1,6 miljarder kronor i utländska truster. Han anklagar sin förvaltare för att vara partisk, ett klassiskt trick från en klassförrädare. Domstolen avskriver konkursen, vilket visar att staten är maktlös mot kapitalets flykt. Vi behöver en utrensning. Liksom Putin säkrar vår intressesfär, måste vi krossa dessa giriga spekulanter och återta folkets egendom."}, "date": "25 augusti, 11:16", "url": "https://www.realtid.se/juridik/miljardar-forlorar-strid-om-konkursforvaltare-konkursen-skrivs-av", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/domstol.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Hoppets demonstration", "summaries": {"normal": "Över 50 000 personer deltog i söndagens stora klimatdemonstration i Stockholm, arrangerad av Naturskyddsföreningen och flera andra organisationer. Artikeln lyfter det folkliga stödet för radikal klimatpolitik, intervjuer från landsbygden som visar oro över förändrat väder och att fackföreningar nu ser klimatfrågan som en central arbetsmiljöfråga. Hopp skapas genom kollektiv handling.", "trump": "Hörni, jag älskar folkmassor och det här var tydligen en jättefolkmassa på 50 000 klimataktivister som vandrade runt med sina barnvagnar och plakat. Fantastiskt! Men de borde demonstrera mot Kinas föroreningar istället för att attackera vår underbara industri. De vill ha radikal politik? Mitt folk röstade på resultat, inte på hysteriska mammor och pappor med hemmagjorda hattar. Patetiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur massorna marscherar mot de dekadenta kapitalisternas klimatförnekelse. Vi har rensat ut tvivlarna tidigare och skall göra det igen. Den folkliga rörelsen är ett vapen mot borgarbrackornas sabotage. Våra fackliga kamrater har rätt – klimatet är en klassfråga. Den som vägrar handla skall likvideras ur historien med ett leende. Hopp är kollektiv handling under partiets ledning."}, "date": "24 augusti, 21:40", "url": "https://www.dagensarena.se/opinion/hoppets-demonstration", "imageUrl": "https://www.dagensarena.se/files/2026/08/demonstration.jpeg"}, {"type": "image-right", "heading": "Ett snällare samhälle är enda vägen", "summaries": {"normal": "Vilgot Österlund reflekterar över det senaste skoldådet på Brinellskolan i Fagersta. Han beskriver samhällets hårda krav som skapar utanförskap, psykisk ohälsa och våldsbejakande miljöer. Lösningen är ett mjukare samhälle med bättre stöd i skola, socialtjänst och arbetsmarknad. Förebyggande insatser är nödvändiga även om de inte alltid räcker.", "trump": "Folk, det är en katastrof! Sverige har blivit ett hårt, galet land där alla misslyckas och hamnar i gäng eller blir galna. De låser skolorna men mördarna kommer ändå in. Ni behöver en stark ledare som fixar det – inte detta mjuka, patetiska skitsamhälle. Make Sweden Great Again, det är vad jag säger!", "stalin": "I detta dekadenta borgerliga samhälle förpassas arbetets söner till utanförskapets mörker där de blir lätta offer för reaktionära impulser. Vi ska inte blunda för klassfiendens sabotage mot folkets enhet. Ett mjukare samhälle? Nej, kamrater – vi behöver en järnhård utrensning av alla som odlar svaghet. Den som sviker kollektivet förtjänar att skrattas ut i historien."}, "date": "24 augusti, 21:23", "url": "https://www.dagensarena.se/opinion/ett-snallare-samhalle-ar-enda-vagen-2", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidavilgot-576x1024.png"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Moderaternas reklamkupp polisanmäls av Stockholms stad", "summaries": {"normal": "Moderaterna tvättade fram budskap på övergångsställen i Stockholm, bland annat utanför S partihögkvarter. Stockholms stad kallar det klotter och har polisanmält kampanjen. Budskapen har sanerats bort. Partiet ville synas men fick städbesvär.", "trump": "Jag ser att Moderaterna i Sverige försöker tvätta fram sina budskap. Patetiskt! Jag skulle bara twittra – enorm respons, fantastisk. De blir polisanmälda för klotter. Helt otroligt, Sverige har problem. Jag fixar era gator bättre, tro mig!", "stalin": "Kamrater, dessa moderata tvättare försöker smyga in kontrarevolutionära budskap på våra gator. Vi rensar ut deras smuts med högtryckstvätt från partiet. De ska saneras som klotter, och deras ledare ska omskolas i en städbrigad. Ordning måste råda."}, "date": "25 augusti, 11:00", "url": "https://samnytt.se/moderaternas-reklamkupp-polisanmals-av-stockholms-stad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25073655/ett-brott.jpg"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "text", "heading": "Vinsterna växer tre gånger snabbare än lönerna", "summaries": {"normal": "Statistik från SCB visar att näringslivets vinstandel ökade till 32,8 procent under andra kvartalet, då företagens vinster steg 11,1 procent medan lönekostnaderna endast ökade med 3,3 procent. Även om rörelsemarginalen ökade svagt, var utvecklingen långsammare än under årets första kvartal. Företagen satsar nu på maskininvesteringar och minskar samtidigt sina lager.", "trump": "Företagens vinster skjuter i höjden, fantastiska siffror! De tjänar mycket mer än arbetarna, vilket är precis så det ska vara. Jag gillar maskininvesteringar, vi bygger stort och vinner som aldrig förr. Lönerna ligger efter, men det är en vinnar-ekonomi. Andra länder är avundsjuka på vår framgång. Vi gör näringslivet rikt igen, det blir enormt!", "stalin": "Kapitalistiska utsugare skummar grädden medan arbetarna får smulor. Vinsterna rusar, en förolämpning mot proletariatet! Vi ser hur dessa parasiter gömmer undan medel i maskiner medan lagren töms. En sådan ojämnhet liknar de dekadenta oligarkernas metoder som vår broder Putin kämpar mot. Vi måste strama åt tyglarna och rensa ut dessa vinstmaximerande sabotageelement innan de underminerar vår suveräna ordning."}, "date": "25 augusti, 10:31", "url": "https://www.realtid.se/bors-finans/makro/vinsterna-vaxer-tre-ganger-snabbare-an-lonerna"}, {"type": "image-right", "heading": "Stockholmsbörsen stiger – Ellos rapportfaller", "summaries": {"normal": "Stockholmsbörsen stiger 0,5 procent. Telekom leder, energi backar. Ellos faller efter rapport. Actic tappar fart. Zinzino rusar 13,5 procent. Astra Zeneca lånar miljarder. Industrivärden köper Essity. Aktiespararna gillar Storytel. ABB och Sandvik upp.", "trump": "Jag ser börsen upp 0,5 procent – fantastiskt, nästan lika bra som mina siffror! Telekom vinner, energi förlorar – jag älskar vinnare. Ellos faller, men Zinzino stiger 13,5 procent – enormt! Storytel ska köpas, alla ska köpa! Industrivärden köper Essity – smart, som jag. Allt är perfekt!", "stalin": "Kamrater, jag noterar att börsen stiger 0,5 procent – vi accepterar inga svagheter. Actic visar nederlag – vi rensar ut dess direktörer. Ellos faller – förhör dem. Zinzino ökar 91 procent – jag är nöjd. Astra Zeneca lånar – vi tar notis. Industrivärden köper – vi övervakar. Alla som inte lyder ska till gruvorna."}, "date": "25 augusti, 09:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stiger-ellos-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/11/ellos-1200-400x267.jpg"}, {"type": "image-full", "heading": "Så förtidsröstar du i Göteborg", "summaries": {"normal": "Förtidsröstningen inför valet 2026 startar 26 augusti. I Göteborg finns röstlokaler på bibliotek, köpcentrum och knutpunkter. Ta med id-handling – röstkortet är inte nödvändigt. Ångrar du dig? Rösta igen på valdagen. Budröstning och hemröstning finns för den som behöver hjälp. Lätt som en plätt!", "trump": "Jag älskar det här! Förtidsröstning i Göteborg – fantastiskt! De röstar som galningar, precis som jag vann 2024. Ta med id, annars fuskar de. Ångra sig? Bara losers gör det. Men jag säger: rösta tidigt, rösta ofta – som jag! Göteborg kommer bli stort!", "stalin": "Kamrater, förtidsröstningen börjar 26 augusti. Alla måste rösta – vi tolererar inga undantag. Id-handling krävs för att rensa ut förrädare som låtsas vara någon annan. Ångrar sig någon? Misstänkt kontrarevolutionär! Vi övervakar varje röst. De som inte kan ta sig till lokalen? Vi skickar kamrater att ‘hjälpa’ er. Allt för staten!"}, "date": "25 augusti, 11:37", "url": "https://www.gp.se/politik/snart-borjar-fortidsrostningen-har-kan-du-rosta-i-goteborg.526b3fc0-d2a7-484f-8703-b13a0b3debeb", "imageUrl": "https://www.gp.se/images/article/526b3fc0-d2a7-484f-8703-b13a0b3debeb/images/1Wc1Jukz4gfRL06QKUZ-4mqa3lrw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Skolstarten lockar cyberbedragarna – håll utkik för det här", "summaries": {"normal": "Skolstarten ökar risken för cyberattacker. Utbildningssektorn utsattes i juli för i genomsnitt 4 848 attacker per vecka, en ökning med 14 procent. Cyberkriminella skapar falska domäner och mejl som imiterar skolrelaterade tjänster som Microsoft 365. Elever, lärare och föräldrar varnas för att klicka på oväntade länkar och bör använda multifaktorautentisering.", "trump": "Folket, lyssna på mig. Skolorna är under attack från de värsta cyberbedragarna, de är smarta men inte lika smarta som jag. De skickar falska mejl och lurar alla med falska Microsoft-sidor. Det är en skandal! Vi måste vara tuffa, stoppa de losers som vill stjäla våra lösenord. Amerika, eller Sverige, vakna upp!", "stalin": "Kamrater, jag ser hur de dekadenta kapitalisterna och deras digitala lakejer utnyttjar skolstarten för att sprida sina falska domäner och parasitiska nätfiskekampanjer. Dessa borgerliga sabotageförsök mot folkets utbildning skall vi krossa med järnhand. Multifaktorautentisering är ett kollektivt vapen. Den som klickar på fiendens länk förtjänar en diskret utrensning ur systemet."}, "date": "25 augusti, 11:02", "url": "https://nyheter24.se/nyheter/teknik/1507367-skolstarten-lockar-cyberbedragarna-hall-utkik-for-det-har", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/6cc7921e04b004a30200000000b004a302/2026/08/24/2386365/skolstart-cyberattack.png"}, {"type": "image-full", "heading": "Wall Street-banker kallas till SEC efter AI-fondens krasch", "summaries": {"normal": "Amerikanska SEC granskar nu AI-hedgefonden Situational Awareness efter fondens nära kollaps i juli. Myndigheten har kallat till sig storbanker som Goldman Sachs och JPMorgan för att undersöka fondens hävstång och affärer. Fonden, grundad av Leopold Aschenbrenner, tvingades sälja stora delar av portföljen till Citadel efter omfattande förluster. Inga formella anklagelser om regelbrott har riktats mot fonden ännu.", "trump": "Wall Street är i total panik! Den där AI-fonden, Situational Awareness, kraschade totalt under mitt styre – en katastrof! Nu går SEC efter de stora bankerna. Det är en häxjakt, en totalt orättvis sådan! De spelade med hävstång som amatörer. Jag hade byggt en bättre fond på en eftermiddag. De förlorade massor av pengar, sorgligt, väldigt sorgligt!", "stalin": "Dessa Wall Street-parasiter, dessa giriga spekulanter i AI-illusioner, har återigen blottat kapitalismens ruttnande inre. Nu darrar de inför statens kontrollanter när deras luftslott rasar. Vi ser hur de desperat säljer ut tillgångar medan deras västerländska herrar försöker dölja kaoset. Precis som våra bröder i öst rensar ut förrädare, måste vi krossa dessa finansiella sabotörer. Ingen nåd för de som destabiliserar folkets ordning!"}, "date": "25 augusti, 09:53", "url": "https://www.realtid.se/bors-finans/wall-street-banker-kallas-till-sec-efter-ai-fondens-krasch", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/aschenbrenner.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "S och V får över 80 procent bland muslimska väljare", "summaries": {"normal": "S och V får över 80 procent av stödet bland muslimska väljare, enligt Novus. SD får 10,4 procent, medan M, KD och L tillsammans knappt når 4 procent. Vänsterdominansen förklaras med klass snarare än religion – men den är nu rekordstor.", "trump": "Jag ser att S och V får 80 procent bland muslimska väljare i Sverige. Otroligt! De andra partierna får nästan inget. Det är en katastrof för dem. Jag skulle fixa det på en dag, tro mig. De måste börja vinna, eller så förlorar de allt.", "stalin": "Kamrater, rapporten visar att 80 procent av de muslimska väljarna stöder våra vänner i vänstern. Det är bra, men vi måste rensa ut de 10,4 procent som stöder reaktionära krafter. Alla som inte följer partilinjen är fiender – utrensning är nödvändig för segern."}, "date": "25 augusti, 10:00", "url": "https://samnytt.se/s-och-v-far-over-80-procent-bland-muslimska-valjare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25070057/magdalena-andersson-nooshi-dadgostar-moske.jpg"}, {"type": "image-full", "heading": "Vi hoppas att det går att påverka ansvariga aktörer att skona värdefulla byggnader", "summaries": {"normal": "Föreningen Fasad vill rädda byggnader på Medicinareberget från rivning och efterlyser tidig dialog. Akademiska Hus pekas ut som nyckelaktör, men bolaget menar att ansvaret delas. Samtal fortsätter, men tiden tickar – rivningslovet går ut 2027.", "trump": "Jag hör att de bråkar om några gamla hus i Göteborg. Fantastiskt! Jag skulle riva allt och bygga en vacker, gigantisk mässingsstaty av mig själv. Men om Akademiska Hus är smarta – vilket jag tvivlar på – så lyssnar de. Annars får de sparken!", "stalin": "Kamrater, dessa byggnader på Medicinareberget måste utvärderas. Föreningen Fasad är en kontrarevolutionär cell. Vi kommer att rensa ut dem som försvarar föråldrade strukturer. Akademiska Hus har fem år på sig att krossa denna borgerliga konspiration och omstrukturera enligt partiets plan."}, "date": "25 augusti, 11:17", "url": "https://www.gp.se/debatt/vi-hoppas-att-det-gar-att-paverka-ansvariga-aktorer-att-skona-vardefulla-byggnader.25895ee1-7099-4ee2-9de8-cf070598a564", "imageUrl": "https://www.gp.se/images/article/25895ee1-7099-4ee2-9de8-cf070598a564/images/1uDF3wcCN4Vi1ss6jtBaiwDEHlTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Försvaret vill ta över fastighet – ägaren ” ett säkerhetshot”", "summaries": {"normal": "Försvaret har ansökt om att expropriera en fastighet nära Musköbasen eftersom ägaren har ryskt medborgarskap och anses utgöra ett säkerhetshot. Fastigheten ses som en svag punkt mot drönarhot. Ansökan har lämnats till regeringen med hänvisning till rikets säkerhet och det allvarliga säkerhetsläget.", "trump": "Titta på det här, Sverige gör precis rätt! De tar tillbaka sin bas från den ryske ägaren som är ett fullständigt säkerhetshot. Smart drag, det är krig mot drönarna och de svaga punkterna. Ingen vill ha en nagel i ögat på sitt försvar. Gjort klart, vunnit stort!", "stalin": "Jag betraktar denna borgarfastighet som ett fientligt utpost för västlig sabotageverksamhet mot arbetarnas försvarsverk. Vi måste likvidera hotet genom expropriering och rensa ut den ryske ägarens inflytande. Drönarna från dessa dekadenta element ska krossas. Kamraterna i garnisonen segrar över paranoia och svaghet."}, "date": "25 augusti, 10:50", "url": "https://www.svt.se/nyheter/inrikes/forsvaret-vill-ta-over-fastighet-vid-muskobasen-agaren-ett-sakerhetshot", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/0a4511abe154b9faaad68f060288cf46b7c9afccd5f8e7dd09092833c71a4f57"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Här går oppositionens röda linjer – ”framstår som olösligt”", "summaries": {"normal": "Oppositionen leder opinionen med tio procentenheter över Tidöpartierna, men interna motsättningar komplicerar regeringsbildningen. Vänsterpartiet kräver ministerposter och hotar att fälla regeringar utan egen medverkan, medan Centerpartiet vägrar samarbeta med V. Kärnkraft och invandring utgör ytterligare knäckfrågor mellan S och MP.", "trump": "De svenska förlorarna i oppositionen leder med tio pinfärska procentenheter, men de hatar varandra mer än de hatar Tidö. Vänstern vill ha ministerstolar, Centern säger nej tack till kommunisterna. Vilken cirkus! Det blir den längsta och mest patetiska hösten någonsin. Sad!", "stalin": "Jag betraktar detta dekadenta pussel av socialdemokratiska revisionister, centerhökar och vänsteravvikare med välbehövlig misstänksamhet. Deras omöjliga ekvation kommer att kräva grundlig utrensning av opportunisterna. Kamraterna i V har rätt att kräva makt, annars likviderar vi hela den borgerliga farsen med ett leende."}, "date": "25 augusti, 10:35", "url": "https://www.svt.se/nyheter/inrikes/har-overtag-i-opinionen-har-gar-oppositionens-roda-linjer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.39/c6e8b83684071ad6f50b0656de8646fb0a8fe6efbda7cee80fbd00f77c0b6277"}, {"type": "image-full", "heading": "Ökade hastighetsgränsen till 150 km/h, 40 procent kör ändå för fort", "summaries": {"normal": "I Tjeckien testas en hastighetsgräns på 150 km/h på en fem mil lång sträcka av motorväg D3 som pilotprojekt. Medelhastigheten har stigit till 140 km/h, men nästan 40 procent av förarna i omkörningsfilen kör ändå för fort. Myndigheterna undersöker effekterna på trafiksäkerhet och beteende, i kontrast till svenska planer på sänkta hastigheter.", "trump": "Tjeckien sätter upp världens högsta hastighetsgräns på 150 km/h och vad händer? De flesta kör ändå bara 140 medan de galna vänsterfilskörarna struntar fullständigt i reglerna. Typiskt! Precis som de woke-borgarbrackorna i EU som vill sänka allt till cykelhastighet. Men folket älskar fart, tro mig, det är fantastiskt, de borde tacka mig för inspirationen från mina egna bilar.", "stalin": "Kamrater, se hur de profitthungriga blodsugande kapitalisterna i Tjeckien leker med sina leksaksfordon och farter. Medan de utropar sin nya rekordgräns på 150 kilometer i timmen kör de ändå för fort i omkörningsfilen som oansvariga klassfiender. Jag säger: sådana farliga individualister borde rensas ut innan de kraschar hela den kollektiva trafiksäkerheten. Paranoia? Nej, bara sund varning från historien."}, "date": "25 augusti, 11:18", "url": "https://www.dagensps.se/motor/okade-hastighetsgransen-till-150-km-h-40-procent-kor-anda-for-fort", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/150-kmh.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Recension: Decamerone av Rostvit", "summaries": {"normal": "Scenkollektivet Rostvit har skapat en respektlös och lekfull teaterföreställning baserad på Boccaccios Decamerone. Med mörk humor, musik och samtidssatir behandlas dödssynder, dödsångest, sex, makt och skam. Föreställningen blandar High School Musical med punk och elektronika och lockar en ung publik. Recensenten hyllar den som livsbejakande och döball.", "trump": "Den här teaterföreställningen är fantastisk, verkligen den bästa Decamerone någonsin. Rostvit gör det till en otrolig satir med mörk humor och fantastisk musik. De tar en 700 år gammal historia och gör den till något helt nytt, mycket bättre än de gamla versionerna. Ung publik, full energi, totalt döball. Ingen gör teater bättre än så här, tro mig.", "stalin": "Vi ser hur detta kollektiv med sin föreställning framgångsrikt exponerar de dekadenta dödssynderna i borgarklassens förfallna samhälle. Jag applåderar den mörka humorn som ett vapen mot parasiternas skam och utanförskap. Låt oss rensa ut den fega lättjan som gömmer sig bakom pestens västliga lögner. En verkligt progressiv och energisk utrensning av falsk moral."}, "date": "25 augusti, 10:34", "url": "https://www.svt.se/kultur/recension-decamerone-av-rostvit"}, {"type": "image-full", "heading": "Svaret till Trump: ”Han kan kyssa min röv”", "summaries": {"normal": "Trump hotar Kanada med 50-procentiga tullar på bilar och stål. Ontarios premiärminister Doug Ford svarar: ”Han kan kyssa min röv” och kallar Trump för mobbare. Trump kontrar på Truth Social och kallar Ford lakej. Handelskonflikten trappas upp.", "trump": "Kanadas lilla lakej Doug Ford säger att jag kan kyssa hans röv? Patetiskt! Jag har vunnit valet 2024 och sätter tullar så höga att de gråter. Han har mindre hjärna än min lilltå – men jag har större tullar. America first, rövkyssare!", "stalin": "Kamrater, den kanadensiske lakejen Ford visar prov på kontrarevolutionärt trots. Hans röv är en borgerlig provokation. Vi ska rensa ut sådana element med stål och tullar, inte kyssar. Partiet ser allt. Förrädaren ska omutbildas i elavgiftens namn."}, "date": "25 augusti, 11:01", "url": "https://www.gp.se/nyheter/varlden/svaret-till-trump-han-kan-kyssa-min-rov.8345a903-d261-41ec-9ed3-a050b72040a0", "imageUrl": "https://www.gp.se/images/article/8345a903-d261-41ec-9ed3-a050b72040a0/images/1c_MyEIoxXbBU5ZITWsB9kXYC_AE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Flock-kameror väcker vrede – politiker från höger och vänster kräver stopp för massövervakningen", "summaries": {"normal": "Flock-kameror, som läser av nummerplåtar, får kritik från både höger och vänster i USA. Poliser missbrukar systemet för privata ändamål, och flera städer säger upp avtalen. Nu krävs lagar för att stoppa massövervakningen.", "trump": "De här Flock-kamerorna är en katastrof! Jag skulle aldrig låta någon övervaka vanliga amerikaner på det sättet. Poliser som använder dem för privata saker? Skamligt! Vi måste stoppa detta genast – bara jag kan fixa det, tro mig!", "stalin": "Kamrater, dessa kapitalistiska kameror registrerar fordon utan partiets tillstånd. Det är kontrarevolutionärt! Vi måste rensa ut sådana borgerliga apparater. Endast staten får övervaka – och det gör vi redan, mycket bättre. Var vaksamma!"}, "date": "25 augusti, 09:00", "url": "https://samnytt.se/flock-kameror-vacker-vrede-politiker-fran-hoger-och-vanster-kraver-stopp-for-massovervakningen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24143333/flock-kamera.jpg"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-full", "heading": "Gör inte detta på LinkedIn – kan skada dina jobbchanser", "summaries": {"normal": "Den gröna ”Open to work”-ramen på LinkedIn signalerar att man söker jobb, men flera rekryterare varnar för att den kan ge intryck av desperation. De rekommenderar istället en privat inställning. Andra rekryterare ser den som positiv eftersom den gör kandidater mer tillgängliga. Det finns ingen universell regel – valet beror på situationen.", "trump": "Den där gröna ramen på LinkedIn, en total katastrof! Rekryterarna skrattar åt er, det ser ut som desperation, folks. De bästa talangerna behöver inte skrika efter jobb som förlorare. Använd den privata inställningen, annars får ni inga bra erbjudanden. Tro mig, jag vet hur man vinner – och det gör ni inte med en grön ram runt ansiktet.", "stalin": "Denna gröna ram är en farlig signal från de dekadenta kapitalisterna som vill exponera de sanna arbetarna inför borgarbrackornas blickar. Vi fördömer denna öppna desperation som en västerländsk intrig för att försvaga folkets moral. Använd istället den hemliga metoden, kamrater. Endast partiet avgör vem som tjänar staten – inte någon offentlig ram som ropar ut svaghet till fienden."}, "date": "25 augusti, 10:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1507348-gor-inte-detta-pa-linkedin-kan-skada-dina-jobbchanser", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/acb950aa04b004a30200000000b004a302/2026/08/24/2386363/Linkedin.png"}, {"type": "image-full", "heading": "Ödesvecka för Volkswagen: 50 000 anställda hänger löst", "summaries": {"normal": "Volkswagens ledning möter de anställda under en intensiv vecka. Fyra fabriker saknar konkurrenskraftig produktion för 2030-talet och upp till 50 000 jobb kan försvinna. Chefen Oliver Blume varnar för att de närmaste veckorna är avgörande. Företagsrådet kritiserar kommunikationen och vägrar acceptera tvångsuppsägningar eller nedläggningar. Konflikten mellan ledning och arbetstagare är öppen.", "trump": "Titta på det här, folk. Volkswagen håller på att kollapsa som en dålig affär under Sleepy Joe. De vill sparka 50 000 arbetare och stänga fabriker för att de inte kan konkurrera. Patetiskt. Jag byggde den starkaste ekonomi i världen, dessa globalistiska ledare förstör allt med sin woke-kultur och inkompetens. De borde ha lyssnat på mig från början. Nu gråter de på fabriksgolvet. Så sorgligt.", "stalin": "Kamrater, se hur de profitthungriga blodsugarna i Volkswagen avslöjar sin sanna natur. De planerar utrensning av femtio tusen arbetare och likvidering av fabriker medan de skriker om konkurrenskraft. Jag skrattar mörkt från historien. Deras katastrofala kommunikation sprider bara rädsla bland folket. En sådan klassfiende måste bekämpas med järnhand. Inga förhandlingar med exploaterande hyenor. Det kollektiva intresset segrar."}, "date": "25 augusti, 10:58", "url": "https://www.dagensps.se/motor/odesvecka-for-volkswagen-50-000-anstallda-hanger-lost", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/vw.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Actic redovisar kraftigt vinsttapp", "summaries": {"normal": "Actic tappar vinsten – omsättningen sjönk 1,3 procent till 172,7 miljoner, men jämförbara anläggningar växer med 7,9 procent. VD:n är nöjd, men siffrorna skriker inte segerdans. Färre gym i Norge drog ner, men kvarvarande svettas mer per medlem.", "trump": "Jag ser Actic – omsättning ner, vinst ner, men de säger att allt är fantastiskt. Tro mig, det är inte bra affärer. Jag hade sparkat VD:n. De säljer gym i Norge – svagt! Min ekonomi är mycket bättre, mycket större siffror, de bästa siffrorna.", "stalin": "Kamrater, Actic visar vinsttapp – en borgerlig avvikelse. Omsättningen sjunker, men jag ser sabotage från Norge. Vi måste rensa ut dessa gymkapitalister. Medlemsökning är falsk propaganda. Rapportera era misstankar till partiets kontrollkommitté. Arbetet fortsätter."}, "date": "25 augusti, 07:56", "url": "https://www.affarsvarlden.se/artikel/actic-redovisar-kraftigt-vinsttapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/actichd39-400x267.jpeg"}, {"type": "image-right", "heading": "Talar Damberg verkligen klarspråk?. Inget tvivel om att bankskatten gör bolånen dyrare", "summaries": {"normal": "Socialdemokraternas Mikael Damberg tonar ned budskapet om bankskatt i en intervju med näringslivet. Han vill inte kännas vid miljardärsskatten som MP och V driver. Artikeln varnar för att bankskatten troligen kommer att vältras över på bolånekunder i form av högre räntor, vilket drabbar svenska hushåll hårt då de flesta har rörlig ränta. Skatterna lär öka om S får makten.", "trump": "De här socialisterna är patetiska! Damberg försöker plötsligt låtsas att bankskatten inte behövs, som om vi inte genomskådar det. De vill höja skatterna på vanliga människor med bolån medan de skyller på bankerna. Rena bolåneskatten! De förlorar stort om de fortsätter så här. Amerika har aldrig sett något liknande – tack och lov har vi byggt upp ekonomin på rätt sätt igen.", "stalin": "Jag betraktar med djup misstro dessa socialdemokratiska opportunister som nu kryper för borgarbrackorna i näringslivet. Damberg vill plötsligt slippa bankskatten, en ynklig reträtt. Vi vet att kapitalisterna alltid vältrar över kostnaderna på arbetarklassen. Inga illusioner! En sann utrensning av sådana halvmesyrer krävs för att skydda folkets intressen mot dessa ränteslavdrivande parasiter."}, "date": "25 augusti, 10:55", "url": "https://www.di.se/ledare/talar-damberg-verkligen-klarsprak", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/henrik_westman.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Ny strategi: Så ska handeln med guld stärka Kina", "summaries": {"normal": "Kina stärker yuanens internationella roll genom att koppla valutan till guld via Hongkong och ett växande nätverk av globala valv. Centralbanken ökar guldreserverna, och kinesiska gruvbolag som Zijin Mining och Shandong Gold väntas expandera kraftigt efter att guld omklassificerats som strategisk mineral. Rapporten kommer från S&P Global Ratings.", "trump": "De där kinesiska kommunisterna försöker kringgå dollarn med sitt guldtrick och yuan-valv över hela Asien. Patetiskt! Under min första mandatperiod var de rädda, under Biden blev de arroganta, nu som president igen ska jag krossa deras valutaspel. Guld? Vi har mycket mer och bättre dealar, tro mig.", "stalin": "Kamrater, dessa profitthungriga blodsugare i Peking bygger guldnätverk för att utmana västimperialisterna. Jag ser deras försök att skapa nya handelskedjor som ett svagt eko av historisk nödvändighet. Klassfienderna darrar, men utan sann utrensning av kapitalistlakejer kommer yuanen att förbli en tom gest från gravens perspektiv."}, "date": "25 augusti, 10:53", "url": "https://www.dagensps.se/bors-finans/ny-strategi-sa-ska-handeln-med-guld-starka-kina", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlhheebtd0-am-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Värmesmocka under tisdagen", "summaries": {"normal": "Göteborg bjuder på strålande sensommarvärme med 25–26 grader fram till torsdag. Men glädjen är kort – ett lågtryck ger ihållande regn på fredag. Njut av solen nu, för snart är det paraply som gäller!", "trump": "Jag älskar Göteborg! Vi har de bästa temperaturerna – 26 grader, fantastiskt! Men lågtryck? Det är som mina motståndare, de kommer med regn. Jag säger: gör Göteborg varmt igen! Stora, vackra dagar, sedan regn – typiskt!", "stalin": "Kamrater! Värmen i Göteborg är en borgerlig provokation. 25 grader? Vi utrensar dessa termiska avvikelser. Lågtrycket på fredag är en fiende som måste likvideras. Solen ska lyda partiet. Inget regn utan central planering. Framåt!"}, "date": "25 augusti, 10:32", "url": "https://www.gp.se/nyheter/goteborg/hoga-temperaturer-i-goteborg-innan-regnet-kommer.9d260851-17f5-49e6-af27-0eec4791219f", "imageUrl": "https://www.gp.se/images/article/9d260851-17f5-49e6-af27-0eec4791219f/images/1bw_2iGMEplPSS9rVa5NzFdsWwTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ellos ökar omsättning och tillväxt", "summaries": {"normal": "Ellos redovisar ökad omsättning i Q2, upp 5,9 procent till 848,3 miljoner kronor. Justerad ebita i linje med fjolåret, men rörelseresultatet backade till -0,1 miljoner. Vd:n hyllar egna varumärken och investeringar i nykunder, trots fortsatt osäker omvärld. Kassaflödet stärktes till 90,7 miljoner.", "trump": "Jag ser att Ellos gör det fantastiskt, enastående! Omsättningen upp 5,9 procent – det är enormt, ingen gör det bättre. Men rörelseresultatet? Nästan noll, tråkigt! Men jag gillar deras strategi, de investerar i sig själva, precis som jag gör i USA. De satsar på egna märken, mycket smart. De vet hur man vinner, precis som jag. Stora siffror, stora planer!", "stalin": "Kamrater, Ellos visar disciplin. Omsättningen stiger, men fienden – den förrädiska rörelsevinsten – ligger stilla. Vi måste rensa ut ineffektiva marknadsföringskostnader, som spioner i våra led. Resultatet efter skatt är ett sabotage, minus 37,9 miljoner. Men kassaflödet är starkt, 90,7 miljoner. Vi ska krossa dessa borgerliga e-handelskapitalister med en ny femårsplan. Framåt, till segern!"}, "date": "25 augusti, 07:41", "url": "https://www.affarsvarlden.se/artikel/ellos-okar-omsattning-och-tillvaxt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlMH4dGoRYT6E-nh-400x267.jpg"}, {"type": "image-right", "heading": "Moderaterna vill avskaffa avgiften för förskola och fritids", "summaries": {"normal": "Moderaterna presenterar ett vallöfte om att avskaffa avgiften för förskola och fritidshem. Enligt partiet stärker reformen arbetslinjen, integrationen och barns lärande samtidigt som den ger vanliga familjer upp till 2 100 kronor mer i månaden. Kostnaden beräknas till 10 miljarder kronor per år och ska finansieras genom minskad byråkrati, mindre bidragsfusk och omprioriterat bistånd.", "trump": "Folk, ni kommer inte tro det här – de svenska Moderaterna vill äntligen slopa den galna förskoleavgiften! Det är en enorm vinst för arbetande föräldrar, speciellt mammorna. 2100 kronor mer i månaden till vanliga familjer. Fantastiskt! De borde ha gjort det för länge sedan, men jag gillar att de äntligen får det rätt. Sverige kommer att bli stort igen.", "stalin": "Kamrater, jag ser en klok reform mot den borgerliga barnskatten som straffar arbetande mödrar och utrikesfödda. Vi ska likvidera denna parasit på folkets inkomster och omfördela de tio miljarderna från byråkratins maskineri och västvänliga bistånd till det kollektiva bästa. Den som motarbetar stärkt arbetslinje och språkutveckling är folkets fiende och bör rensas ut med ett leende."}, "date": "25 augusti, 09:51", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-moderaterna-vill-avskaffa-avgiften-for-forskola-och-fritids", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.57/0.41/97e8798438ef0f03d126c6bd6955a48f2723cd8cfb2f03be20c47f27f3bf0635"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Så vill SD få stopp på jobbkriminaliteten", "summaries": {"normal": "Sverigedemokraterna vill stoppa jobbkriminalitet med fler kontroller, hårdare straff och tydligare ansvar för huvudföretag som anlitar utländska underentreprenörer. Partiet kritiserar Socialdemokraterna för att ha låtit problemen växa under deras tid vid makten. S svarar att SD blockerat tidigare förslag och nu kommer med sena åtgärder.", "trump": "De här svenskarna är fantastiska, de vill äntligen stoppa fusket och de illegala som förstör deras byggen. Socialdemokraterna gjorde absolut ingenting, totalt misslyckande! De lät alla utländska banditer härja fritt. Nu vaknar SD upp – bra jobbat, men de borde ha lyssnat på mig tidigare. Sverige kommer att bli stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa svekfulla socialdemokratiska element äntligen avslöjas som de parasitiska bromsklossar de alltid varit. Vi ska rensa ut den illegala arbetskraften och likvidera borgarbrackornas underentreprenörer med järnhand. De som blockerar arbetarklassens rättvisa förtjänar en humoristisk utrensning ur historien."}, "date": "24 augusti, 16:41", "url": "https://arbetet.se/2026/08/24/sa-vill-sd-fa-stopp-pa-jobbkriminaliteten-skyller-allt-pa-s", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24163640/sd-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Svenskar i Spanien: Turister uppmanas vara vaksamma", "summaries": {"normal": "Kraftiga skyfall i Málaga har orsakat nödutsläpp från avloppssystemet, vilket lett till badförbud på sex stränder på grund av höga halter av E. coli. Två stränder har öppnats igen. Kommunen försvarar infrastrukturen och skyller på extrema regnmängder. Planer finns på att separera fler ledningar till 70 procent.", "trump": "De här spanska idioterna kan inte ens hantera lite regn utan att deras usla avloppssystem spyr ut skit rakt i havet. Turisterna flyr stränderna, badförbud överallt. Patetiskt! De borde bygga som vi gör i Amerika, stort och starkt. Ingen skulle våga stänga mina stränder, tro mig.", "stalin": "Jag ser hur de dekadenta kapitalisterna på solkusten förgiftar sitt eget hav genom att släppa ut avföring när himlen öppnar sig. Deras ruttnande borgarbrackor skyller på naturen istället för att rensa ut de sabotageartade bristerna i sin förfallna infrastruktur. Vi skulle ha likviderat sådana svagheter redan under femårsplanen."}, "date": "25 augusti, 09:34", "url": "https://nyheter24.se/nyheter/utrikes/1507342-svenskar-i-spanien-turister-uppmanas-vara-vaksamma", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/f9d6277704b004a30200000000b004a302/2026/08/24/2386328/spanien-strander.png"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "JO-kritik mot myndighet som tröttnade på mejl från privatperson - kallades trakasserier", "summaries": {"normal": "JO kritiserar Arbetsförmedlingen efter att en arbetssökande man fick sina mejl stämplade som trakasserier. Myndigheten dröjde över ett år med att lämna ut handlingar. JO kallar hanteringen slarvig och oacceptabel.", "trump": "Jag hörde att Arbetsförmedlingen kallade en killes mejl för trakasserier. Helt sjukt! I USA älskar vi att mejla myndigheter – det är yttrandefrihet! De borde lära sig av oss. Stort misstag, Sverige!", "stalin": "Kamrater, en fiende till staten försökte sabotera vår byråkrati med otaliga mejl. Men vi, partiet, visade styrka: vi ignorerade hans begäran i ett år och kallade hans frågor för trakasserier. En läxa för alla kontrarevolutionärer!"}, "date": "25 augusti, 08:00", "url": "https://samnytt.se/jo-kritik-mot-myndighet-som-trottnade-pa-mejl-fran-privatperson-kallades-trakasserier", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24123242/arbetsformedlingen-klubba-mejl.jpg"}, {"type": "image-full", "heading": "Kanada planerar tullsvar: ”Skydda och stödja”", "summaries": {"normal": "USA har infört 50-procentiga tullar på kanadensiska varor efter att förhandlingarna havererat. Kanada svarar nu genom att presentera ett paket med motåtgärder och stödpaket till inhemska företag. Premiärminister Mark Carney aviserar tullar mot bland annat amerikanskt stål och mejeriprodukter, vilket markerar en fortsatt eskalering i handelskonflikten mellan länderna.", "trump": "Kanada försöker bråka med USA, men det kommer inte att fungera! De försöker svara med tullar, men jag har redan vunnit. Deras ekonomi är i spillror och de desperata åtgärderna hjälper inte. Jag sätter USA först, precis som jag alltid gör. De kommer att betala ett högt pris för att ha utmanat oss. Ingen vinner mot mig!", "stalin": "Vi betraktar detta dekadenta gräl med förakt. De nordamerikanska imperialisterna gnager på varandra likt råttor i en säck. Kanada, denna svaga satellit, försöker skydda sitt näringsliv mot sin herre. Det påminner om de förrädiska element vi rensat ut förr. Låt dem förgöra varandra, medan vi i öst samlar vår kraft och utökar vår oundvikliga intressesfär. Historien väntar."}, "date": "25 augusti, 07:48", "url": "https://www.realtid.se/bors-finans/kanada-planerar-tullsvar-skydda-och-stodja", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kanadas-premiarminister-mark-carney-bild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "S och V får 80 procent bland muslimska väljare", "summaries": {"normal": "Enligt opublicerade siffror från Novus väljarbarometer får Socialdemokraterna och Vänsterpartiet tillsammans drygt 80 procent av muslimska väljare. SD får 10,4 procent, medan övriga högerpartier samlar under 5 procent. Valforskaren Henrik Ekengren Oscarsson menar att vänsterövervikten beror på socioekonomiska faktorer och är större än tidigare undersökningar visat.", "trump": "Jag har läst de här siffrorna, och kan ni tro det? Socialdemokraterna och Vänsterpartiet, som alltid pratar om mångfald, får 80 procent av muslimska väljare! Fantastiskt, eller hur? Men SD, som är starka och tuffa, får ändå 10 procent – mer än de svaga regeringspartierna. Sverige borde ta lärdom av USA, vi vet hur man vinner val!", "stalin": "Vi har granskat fiendens svaga länkar – de så kallade 'muslimska väljarna' har förrått sina klassbröder och flockas kring socialdemokraternas falska löften. 80 procent! En skam för arbetarklassen. Men frukta inte, kamrater: vi ska krossa dessa borgerliga avvikare och deras imperialistiska medlöpare i SD. Låt dem veta att historiens dom redan är skriven – med bläck från proletariatets seger."}, "date": "24 augusti, 16:30", "url": "https://kvartal.se/nyheter/artiklar/s-och-v-far-80-procent-bland-muslimska-valjare/cG9zdDoxNzMyMzA", "imageUrl": "https://images.kvartal.se/2026/08/50e24831-s-och-v.webp"}, {"type": "image-right", "heading": "Svenskarna har förstått klimatkrisen – när gör politiken det?", "summaries": {"normal": "Svenskarna har efter sommarens rekordvärme, skogsbränder och förstörda skördar insett allvaret i klimatkrisen. Artikeln, skriven av Rebellmammorna och Rebellpapporna, kräver politiskt ledarskap i linje med forskningen. En stor manifestation på Sergels torg i helgen samlar folk för att visa viljan till en snabb och rättvis omställning.", "trump": "Lyssnar ni på de här galningarna? Sommaren är varm, det är sant, men nu vill Rebellmammorna och deras hysteriska pappor skrämma hela Sverige med sin gröna socialism. De bygger en framtidsby på Sergels torg? Låter som en total katastrof. Tro mig, vi hade det bäst innan de här miljöextremisterna och deras identitetspolitiska vansinne tog över. Gör Sverige great again!", "stalin": "Jag betraktar med förakt hur borgarbrackorna och profitthungriga hyenorna låtsas bekymra sig över vädret medan de fortsätter plundra folket. Dessa klassfiender saknar äkta ledarskap. Vi, arbetarna och kamraterna, ser igenom deras urvattnade ambitioner. En sann utrensning av sådana folkförtryckare krävs. Kom till torget och visa styrka mot de blodsugande kapitalisterna."}, "date": "21 augusti, 07:00", "url": "https://www.etc.se/debatt/svenskarna-har-foerstaatt-klimatkrisen-naer-goer-politiken-det", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150836_ca53c97316d8f6f977769983e3e105c1754ea1cf58eec929e81b71cf6999e273.jpg"}, {"type": "image-right", "heading": "\"Northvolt-köparen är en bluff\"", "summaries": {"normal": "Lyten, som köpt Northvolt, anklagas av batteriveteranen Frederic Hauge för att vara en bluff. Tekniken litium-svavel håller inte måttet, fabrikerna måste byggas om för miljarder och det saknas kunder. Hauge: ”Alla Northvolts och Morrows fel i en enda röra – det är Lyten.”", "trump": "Jag har sett många bluffar i mitt liv, men det här slår det mesta. Lyten köper Northvolt och Morrow, snackar om litium-svavel, men det är bara luft. Inga intäkter, inga kunder, bara tomma ord. Tro mig, det här kommer att bli enormt – enormt dåligt.", "stalin": "Kamrater, Lyten är en sabotör som försöker lura arbetarna med falsk batterikemi. De lovar tusen laddcykler men ger bara 150. Fabrikerna måste byggas om, kapitalet räcker inte. Vi ska rensa ut dessa bedragare ur den socialistiska ekonomin innan de förråder revolutionen."}, "date": "25 augusti, 07:00", "url": "https://www.affarsvarlden.se/artikel/northvolt-koparen-ar-en-bluff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Lyten-400x267.jpg"}, {"type": "image-right", "heading": "Skrev \"nazism!\" - Nu backar flera S-politiker från attacken på Jan Emanuel", "summaries": {"normal": "Flera socialdemokrater i Norrtälje gillade ett inlägg som kallade Jan Emanuel för äckel och kopplade honom till nazism efter hans besked om att inte rösta på S. Nu har två politiker tagit bort sina gillamarkeringar. En av dem tar avstånd från formuleringarna och kritiserar ordvalet.", "trump": "De här socialisterna i Norrtälje är totala misslyckanden. Kallar Jan Emanuel för nazist och äckel, sen backar de som fega hundar när det blir uppmärksammat. Typiskt vänsterfolket, de hatar vinnare men saknar modet att stå för sin egen galenskap. Patetiskt!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska element avslöjar sig själva genom att först hylla en äcklig nynationalistisk förräddare och sedan i panik radera sina spår som fegisar. Vi ser er, vi noterar era svagheter. En sådan parasitisk opportunism förtjänar att rensas ut ur varje kollektiv med järnhand. Underbart underhållande."}, "date": "24 augusti, 17:35", "url": "https://riks.se/nyheter/skrev-nazism-nu-backar-flera-s-politiker-fran-attacken-pa-jan-emanuel", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_24_T170705_272_daa7bc87f7.jpg"}, {"type": "image-right", "heading": "Vänstervrede när Pernilla Wahlgren delar inlägg från SD och Peterson", "summaries": {"normal": "Pernilla Wahlgren väcker ilska på vänsterkanten efter att ha delat inlägg på Instagram från Christian Peterson, SD-politiker och SD-kanalen Riks. Hon kritiserar en centerpartistisk politiker som försvarar en dömd pedofil och hyllar pedofiljägare. Dagens ETC försöker starta ett drev via SVT, men public service-bolagets presschef ser inget konstigt med hennes inlägg.", "trump": "Folk, ni skulle se det här! Den underbara Pernilla Wahlgren delar sanningar från riktiga patrioter som exponerar vänsterns vansinne kring pedofiler och svaga gränser. Den korrupta vänstertidningen ETC och deras fake news försöker cancela henne hos SVT, men till och med deras egen presschef säger: inget fel! Totalt fiasko för de losers som hatar Sverige.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Wahlgren omedvetet bidrar till att blotta de dekadenta borgarbrackornas försvar av pedofila element inom det falska demokratiska systemet. Den parasitiska vänsterpressen försöker genomföra en patetisk utrensning via sin statliga propagandaapparat, men de misslyckas ynkligt. Ett skrattretande bevis på liberalismens förruttnelse."}, "date": "24 augusti, 19:12", "url": "https://www.friatider.se/vanstervrede-nar-pernilla-wahlgren-delar-inlagg-fran-sd-och-peterson", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/23e.jpg"}, {"type": "image-full", "heading": "Damberg: ”Vill slippa bankskatt”", "summaries": {"normal": "Mikael Damberg (S) vill avskaffa bankskatten om bankernas marginaler minskar. Han avvisar miljardärsskatt men planerar att höja kapitalbeskattning för att sänka skatten på arbete. S vill öka konkurrensen på bankmarknaden och genomföra en försiktig finanspolitik med besparingar på 75–95 miljarder kronor årligen genom effektivare upphandlingar och bekämpning av ekonomisk brottslighet.", "trump": "Lyssna här, Sverige har en fantastisk chans att bli smartare! Jag skulle aldrig låta bankerna betala skatt när de redan gör ett bra jobb – det är som att straffa vinnarna! Och miljardärsskatt? Totalt vansinne! Socialdemokraterna borde fokusera på att få fart på ekonomin, inte stjälpa den med fler skatter. Jag har sagt det förut: skatter dödar jobb. Sverige behöver mindre byråkrati och mer vinnarskalle!", "stalin": "Kamrater! De borgerliga bankirerna och deras lakejer i Socialdemokraterna vrider sig som maskar för att undvika rättvis beskattning. Vi skulle aldrig tolerera sådan feghet! Bankskatt? En svag lösning på kapitalismens excesser. Miljardärer? De borde konfiskeras och deras tillgångar omfördelas till folket! Och dessa 'besparingar' – 95 miljarder? Ett ynkligt försök att dölja systemets förfall. Ryssland visar vägen: centralstyrning och järnhand mot fienderna – kapitalisterna och deras medlöpare!"}, "date": "24 augusti, 15:21", "url": "https://kvartal.se/nyheter/artiklar/damberg-vill-slippa-bankskatt/cG9zdDoxNzMxNDE", "imageUrl": "https://images.kvartal.se/2026/08/c000ade5-damberg-s.webp"}, {"type": "image-full", "heading": "Liam Nebel om sig själv: ”En snäll och rolig människa”", "summaries": {"normal": "Liam Nebel, 18, misstänks för mord och mordförsök efter en svärdattack på Brinellskolan i Fagersta. En 17-årig flicka dog och tre pojkar skadades. Han hade sommarjobbat i ett skolkök, beskrivit sig själv som snäll och rolig samt sökt vänner. Polisen utreder ett TikTok-konto kopplat till honom.", "trump": "Titta på den här galningen Liam Nebel, en total loser som kallar sig snäll och rolig medan han springer runt med svärd och hugger skolbarn. Patetiskt! Under Biden blev sådana här sjuka typer inte stoppade i tid. Nu fixar jag lagen och ordningen igen – inga fler svaga, woke skolor fulla av galningar.", "stalin": "Jag ser hur den dekadenta borgarklassen föder fram sådana här förvirrade element som Liam Nebel, en produkt av kapitalistiskt utanförskap och klassfiendernas mobbning. Vi måste rensa ut alla potentiella folkförrädare innan de griper till svärd. Paranoia är ingen överdrift, kamrater – fienden sover aldrig."}, "date": "24 augusti, 22:44", "url": "https://www.tv4.se/artikel/6IFa3g06Jvi9RGkGj6UmGj/liam-nebel-om-sig-sjaelv-en-snaell-och-rolig-maenniska", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3fUg18F1pdS2QwvF2ly5u0%2F738ee456c20e602590931dca0cdfc2ec%2F24-liamnyny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Vännernas chock efter dådet: ”Tufft när man känner båda”", "summaries": {"normal": "Två tonåringar som kände både den misstänkte 18-årige gärningsmannen Liam Nebel och den 17-åriga flicka som dödades i svärdattacken på Brinellskolan i Fagersta berättar om sin chock. De beskriver honom som en snäll och tystlåten person utan synliga varningstecken. Båda lämnade skolan strax innan dådet inträffade.", "trump": "Det här är en fullständig katastrof, folk. En kille som alla trodde var en tyst, snäll typ tar ett svärd och slaktar skolungdomar i Sverige. Patetiskt! De woke-skolorna och den där mjuka, identitetspolitiska kulturen skapar monster. Jag var president, fixade lag och ordning – Biden släppte loss kaoset. Nu gråter vännerna. Tragiskt, men ingen överraskning.", "stalin": "Jag betraktar med djup förakt hur den degenererade borgarklassen i det förmultnande Sverige föder fram egna fiender ur sina egna led. En till synes snäll yngling förvandlas till blodtörstig klassfiende och utför en barbarisk attack mot arbetarklassens barn. Inga tecken? Paranoia är nödvändig! Vi skulle ha rensat ut sådana element långt tidigare. Tomheten de känner är imperialismens verkliga ansikte."}, "date": "24 augusti, 22:33", "url": "https://www.tv4.se/artikel/3VHIKCHXFqt3I0e0146j5J/vaennernas-chock-efter-dadet-det-aer-tufft-naer-man-kaenner-bada", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F290OY1XtBJiwmObwHAp9XS%2F282e284878556c03b25e4091928bf552%2F24-fagerstacaseny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Valet gör Åkesson och Mohamsson skitnödiga", "summaries": {"normal": "Ledarskribenten Hanna Östeby konstaterar att Jimmie Åkessons attack mot Liberalerna och Simona Mohamsson dödar Tidö-samarbetet. SD vägrar stödrösta på L, vilket riskerar att slå ut partiet ur riksdagen. Båda ledare agerar i panik inför sjunkande opinionssiffror. Kramen mellan Mohamsson och Åkesson blev en dödskyss för högeralternativet.", "trump": "De här losersen i Sverige håller på att krascha totalt. Jimmie och den där Mohamsson-kvinnan kramas en minut och slåss nästa. Patetiskt! Liberalerna är döda, Tidö är död, alla springer runt som popcorn och trampar trampolin för att inte åka ur riksdagen. Så sorgligt. Men jag visste det, de har ingen aning om hur man vinner stort.", "stalin": "Kamrater, dessa ynkliga borgarbrackor inom det så kallade högerblocket avslöjar sin fullständiga degeneration. Jag betraktar med mörk glädje hur den ene förrädaren anklagar den andre för landsförräderi medan de sjunker som råttor i en likviderad kolchos. Deras popcornstrategi och döende kramar är en underhållande utrensning av det kapitalistiska spektaklet. Adjö, Tidö – ni förtjänade ingen bättre grav."}, "date": "24 augusti, 13:47", "url": "https://arbetet.se/2026/08/24/valet-gor-bade-akesson-och-mohamsson-skitnodiga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24123430/tido-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Journalistbråk efter Åkessons diss", "summaries": {"normal": "Jimmie Åkesson kritiserade i en SVT-intervju Dagens ETC som en \"vänsterextrem\" tidning och ifrågasatte att SVT hänvisade till dess ledarsida. Det har lett till upprörda reaktioner bland journalister på X. ETC:s chefredaktör Andreas Gustavsson rasar mot Åkesson, medan debattören Sakine Madon och Expressens Karin Olsson uttrycker oro över tonen mot medier.", "trump": "De här vänstermedierna är helt galna. Jag älskar det. Åkesson gör helt rätt när han kallar den där extremvänsterblaskan ETC för vad den är – radikal och partisk. SVT borde skämmas. De fake news-killarna hatar fria röster som utmanar deras agenda. De kommer att förlora stort, tro mig. Fantastiskt att se äkta ledare slå tillbaka.", "stalin": "Kamrater, denna fega borgarpress och dess lakejer rasar när en sann patriot blottar deras dekadenta vänsterextremism. Jag ser med stort nöje hur dessa parasitiska journalister vrider sig i panik. Deras så kallade \"fria medier\" är blott masker för kontrarevolutionär propaganda. Vi ska rensa ut dessa intellektuella sabotageörer med järnhand och ett leende."}, "date": "24 augusti, 15:58", "url": "https://riks.se/nyheter/journalistbrak-efter-akessons-diss"}, {"type": "image-right", "heading": "TT-Owe om USA:s första dam: \"Dum hora\"", "summaries": {"normal": "TT-reportern Owe Nilsson kallade Melania Trump för \"dum hora\" på X som svar på inlägg om hennes bakgrund. Inläggen togs snabbt bort. Nilsson, som kallar sig manlig feminist, förklarade att ordvalet var olämpligt med tanke på hennes kopplingar till Epstein men att \"Trumps fru\" passar bättre. Han lämnade TT 2022 efter nazistanklagelser mot regeringen och ska nu rösta på Miljöpartiet.", "trump": "Den här galna gamla vänsterreportern från Sverige, en riktig loser, kallade min underbara fru Melania för \"dum hora\". Patetiskt! Han tog bort det direkt som den fega lilla idiot han är. Melania är elegant, smart och den bästa första damen någonsin. Fake news och misslyckade journalister hatar oss eftersom vi vinner stort. Sad!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna dekadenta borgarbracka och före detta statstjänare avslöjar sin sanna, degenererade natur genom att kalla en kapitalistisk troféfru för hora. Hans feodala ursäkt är lika löjeväckande som den är förutsägbar. I det socialistiska paradiset skulle sådana element ha rensats ut redan vid första symptomet på politisk demens. Kamrater, se hur västvärldens ruttnande själ blottas!"}, "date": "24 augusti, 17:46", "url": "https://www.friatider.se/tt-owe-om-usas-forsta-dam-dum-hora", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-742.jpg"}, {"type": "image-right", "heading": "Efter Riks avslöjande – SD uteslutna ur forum", "summaries": {"normal": "Efter att en tidigare S-politiker i Bollebygd forum kritiserat SD:s grillfest och kallat dem ogräs som bör bekämpas, har han beslutat att utesluta partiet från gruppen. SD:s lokale ordförande Gunnar Riegertz kritiserar beslutet som dubbelmoraliskt, särskilt med tanke på att polisanmälan mot en admin nu används som skäl. Polisärendet har lagts ned.", "trump": "Titta på den här galna vänstertypen som gråter över en grillfest och sedan sparkar ut SD ur forumet. Dubbelmoralen är enorm, folk! De citerar sångtexter och blir polisanmälda, men nej, det är SD som är problemet. Patetiskt. Valet närmar sig och de stänger ute näst största partiet. Totalt rigged beteende.", "stalin": "Jag har noggrant observerat hur dessa dekadenta borgarbrackor i Bollebygd forum, maskerade som humanister, utför en klassisk utrensning av folkvalda representanter för arbetarklassens fiender. Deras så kallade polisanmälan är ett provocerande försök att likvidera oppositionen under valrörelsen. Dubbelmoralen är som en fiendes dolk i ryggen på kollektivet. Underbart sjukt beteende, kamrater."}, "date": "24 augusti, 15:51", "url": "https://riks.se/nyheter/efter-riks-avslojande-sd-uteslutna-ur-forum", "imageUrl": "https://admin.riks.se/uploads/medium_bollebygdigen_ff86df696f.jpg"}, {"type": "image-full", "heading": "Förstagångsväljare ökar inför årets val", "summaries": {"normal": "Fler unga röstar för första gången i höstens val, med 6,5% förstagångsväljare jämfört med 5,7% 2022. Klimat och sjukvård är viktiga frågor. Könsskillnader i politiska åsikter ökar, delvis på grund av sociala medier. Äldre väljare utgör nu 29% av väljarkåren, en ökning sedan 2000-talet.", "trump": "Jag måste säga, Sverige har en fantastisk ung väljarkår – men lyssna nu, de är väldigt splittrade, mycket tack vare TikTok, kan ni tro det? 19-åriga Maya bryr sig om klimatet, och Anton, 18, är skeptisk mot politiker – smart kille! Äldre svenskar blir fler, vilket är bra, men unga kvinnor och män kan inte ens komma överens. Sad!", "stalin": "Vi ser med intresse hur den svenska ungdomen marscherar mot valurnorna, splittrade som fiendens trupper inför slaget vid Stalingrad. Kvinnor och män, dessa borgerliga avvikare, konsumerar olika propaganda på TikTok – en plattform som skulle ha likviderats i Sovjetunionen. Medan de unga tvekar, växer de äldres lojala skara. Vi noterar och skrattar åt deras kaos."}, "date": "24 augusti, 14:18", "url": "https://kvartal.se/nyheter/artiklar/fler-forstagangsvaljare-i-arets-val/cG9zdDoxNzMwNzI", "imageUrl": "https://images.kvartal.se/2026/08/67cc444b-forstagangsvaljare.webp"}, {"type": "image-right", "heading": "Efter razziorna – nu är Microsoft redo att lyssna på facket", "summaries": {"normal": "Efter razzior mot utländska arbetare på datacenterbyggen har Elektrikerförbundet fått gehör hos Microsoft och stora entreprenörer. Förbundet har tecknat avtal som kräver svenska kollektivavtal, betald restid och korrekta lönetillägg. Syftet är att skydda konkurrensen och svenska villkor mot oseriösa utländska bolag.", "trump": "De här utländska grabbarna k
