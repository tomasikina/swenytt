fiendens desperation; ingen undkommer partiets vaksamma öga, inte ens på planen. Ett underbart exempel på att revisionister alltid faller."}, "date": "16 juni, 00:44", "url": "https://www.svt.se/sport/fotboll/egypten-chockar-belgien-med-drommal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.17/0.39/2f99364e01555a7cb3ba3ec05dd2b8696a0ebf0dd2959e20409a715c7ae0405f"}, {"type": "text", "heading": "Europa måste börja tro på entreprenörskap", "summaries": {"normal": "Europa halkar efter USA och Kina när det gäller investeringar i teknik och försvar, särskilt inom AI. Nobelpristagaren Philippe Aghion kritiserar bristen på innovation och lyfter Sverige som ett positivt undantag tack vare förändrad syn på entreprenörskap efter krisen på 90-talet. Artikeln betonar att kulturella hinder i länder som Tyskland och Frankrike försvårar förändring, men geopolitisk press och nya svenska entreprenörer kan hjälpa Europa att bli mer självständigt i AI-revolutionens tillämpningsfas.", "trump": "Europa är ett totalt misslyckande, folk. De ligger hjälplöst efter oss i USA och till och med efter Kina, som pumpar in enorma summor i teknik. Min administration stoppade just exporten av Anthropics fantastiska AI-modeller för att skydda Amerika. Sverige är det enda ljuset – de har börjat fatta grejen med entreprenörskap. Europa måste vakna, sluta med sin socialistiska kultur och börja älska stora vinster och starka företag. Annars kommer de aldrig ikapp oss, tro mig.", "stalin": "Kamrater, denna dekadenta europeiska borgarklassens klagan över sin egen svaghet väcker min djupaste misstro. Medan de amerikanska kapitalisterna skickar raketer mot himlen och kinesiska revisionister översköljer sin teknik med folkets pengar, sitter dessa parasitiska reformister i Bryssel och Paris och gnäller. Jag ser hur de fruktar den sanna kollektiva kraften och drömmer om att likvidera sin egen antikapitalistiska historia. Sverige, säger de? Ett litet undantag som rymde undan utrensningen. Vi ska rensa ut dessa fackföreningsspioner, centralstyrningsbyråkrater och privatföretagsvänliga trotskister som hindrar framsteget. Ny teknik tillhör inte de rika entreprenörerna utan arbetarklassen. Den som tror annorlunda är en fiende till folket och bör behandlas därefter. Mörkret skrattar åt deras demokrati."}, "date": "15 juni, 16:30", "url": "https://www.di.se/ledare/europa-maste-borja-tro-pa-entreprenorskap/"}, {"type": "image-full", "heading": "Tonåring hängdes ut som \"härdad nynazist\" – fick inte svara på anklagelserna", "summaries": {"normal": "Den 19-årige briten Lorcan Barker har pekats ut som ”härdad nynazist” och ”vit makt-anhängare” i en stor artikel i Daily Mail. Han fick ingen chans att bemöta anklagelserna innan publiceringen, som bland annat bygger på hans närvaro vid en konferens i Portugal. Barker förlorade sitt jobb efter artikeln, förnekar alla kopplingar till högerextremism och säger sig nu söka juridisk hjälp. Han varnar för att sådana uppgifter kan utsätta människor för fara.", "trump": "Titta på det här, det är en total witch hunt från de korrupta Fake News-medierna i Storbritannien. Stackars Lorcan Barker hängs ut som nynazist på Daily Mails förstasida utan att ens få svara. De använder hans bild bredvid en bra kille som Rupert Lowe för att attackera oss alla som vill ha säkra gränser. Det är skamligt. Han förlorade jobbet på grund av deras lögner. De gör vad som helst för att stoppa oss, men de kommer att förlora stort.", "stalin": "Kamrater, se hur borgarbrackorna inom den kapitalistiska pressen i Storbritannien med sin smutsiga Daily Mail likviderar en ung mans rykte genom att klistra på honom etiketten ”härdad nynazist” utan att ge honom möjlighet att försvara sig. Detta är klassisk sabotageverksamhet från reaktionära element som fruktar folkets vilja. Vi ser deras paranoia och desperation. En sådan journalistisk utrensning hotar inte bara individen utan hela kampen mot dekadenta krafter. Vi ska noga övervaka dessa fiender till kollektivet och vid behov rensa ut deras inflytande permanent. Det är både nödvändigt och underhållande att se hur de skakar."}, "date": "15 juni, 22:28", "url": "https://riks.se/nyheter/tonaring-hangdes-ut-som-hardad-nynazist", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2Fcg2d80za%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-15T222508.359.jpg"}, {"type": "text", "heading": "Fredsavtal stärkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen steg starkt efter att USA och Iran kommit överens om ett fredsavtal. OMXS30-indexet avancerade 0,67 procent till 3 134,32. Råvarusektorn ledde uppgången med 2,9 procent, medan energi tappade 3,7 procent. Bland enskilda aktier steg Boliden 7,1 procent och SKF B 3,2 procent. Netel och Infrea genomför ett samgående, och ett antal företag annonserade order som påverkade kurserna.", "trump": "Vi har uppnått en historisk fred med Iran – det är det största fredsavtalet någonsin! Börsen i Stockholm älskar det, särskilt råvarorna. Energiaktier sjunker, men det är deras eget fel. Netel-Infrea-samgåendet är genialiskt, och jag gillar det. Vi gör Amerika great again, och världen följer. Svenska börsen visar att våra politiker fungerar, men de behöver vara mer som Trump!", "stalin": "Staten och partiet övervakar börsen, där råvaror stiger som våra planer för expansion, medan energi sjunker som fiendens försök att motverka oss. Netel-Infrea-samgåendet är en strategisk konspiration som stärker vårt inflytande. Vi måste vara vaksamma mot spekulationer, som Sandviks order till Australien – det kan vara en del av en större imperialistisk plan. Partiet ser allt, och vi fortsätter att stärka vårt inflytande, precis som våra allierade i Moskva."}, "date": "15 juni, 17:42", "url": "https://www.affarsvarlden.se/artikel/fredsavtal-starkte-stockholmsborsen-omxs30-index-okade-07-procent"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Index-fällan i Sivers: Nu tvingas fonderna köpa på toppen", "summaries": {"normal": "Rykten om institutionellt intresse för Sivers Semiconductors sprids på X men visar sig ofta vara passiva indexfonder som köpt aktien ofrivilligt. Aktien har stigit nära 2 000 procent det senaste året, driven av sociala medier snarare än bolagets fundamenta. Insiders och aktiva fonder har sålt av sina innehav medan passiva fonder ökat. Flaggningar från JP Morgan, Blackrock och Fidelity är mest trading eller indexrelaterat. Indexinkludering ses inte som kvalitetsstämpel.", "trump": "Folk, ni skulle se det här! Sivers-aktien rusar 2 000 procent på löjliga tweets från anonyma misslyckanden på X, inte på riktiga affärer. De stora killarna som Blackrock och Fidelity? Bara passiva indexfonder som tvingas köpa, inga smarta pengar. Insiders säljer som galningar medan kursen pumpas upp. Det är en klassisk bluff, kamrater, värre än Bidens gröna energiskoj. Jag älskar aktier som går upp, men det här är ren manipulation från de värsta förlorarna!", "stalin": "Kamrater, dessa borgarbrackor på X sprider lögner om att imperialistiska fonder hyllar Sivers som en seger för folkets aktie. Vid granskning avslöjas att det endast är passiva slavfonder som tvingats köpa genom sin egen byråkratiska dumhet. De verkliga kapitalisterna och insiders har redan sålt ut och flytt fältet medan aktien pumpas av anonyma folkfiender. Vi ser hur klassfiendens indexmekanismer skapar falsk eufori. Inga smarta krafter, bara parasiternas tvångsköp. Ut med dem alla!"}, "date": "15 juni, 21:44", "url": "https://www.dagensps.se/bors-finans/index-fallan-i-sivers-nu-tvingas-fonderna-kopa-pa-toppen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pexels-nic-scrollstoppingphotos-6432056-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Visiterades av knark- hundar inför matchen", "summaries": {"normal": "Uruguays VM-uppladdning blev kaotisk då laget nekades inträde till USA på grund av administrativa problem, vilket orsakade stor försening. Vid ankomst visiterades hela truppens bagage av knarkhundar, en scen som liknades vid en polisfilm. Trots turbulensen spelade Uruguay oavgjort 1–1 mot Saudiarabien i premiären efter en sen kvittering.", "trump": "Vilket totalt misslyckande för Uruguay, de kunde inte ens komma in i mitt fantastiska USA utan att allt gick åt skogen. Fifa och flygbolaget skyller på varandra, typiskt. Sen tvingades de stå där som brottslingar medan knarkhundar nosade på väskorna – såg ut som en dålig polisfilm. Och så kryssade de mot Saudiarabien, en jätteskräll. Patetiskt, men vad kan man förvänta sig av ett lag fullt av woke-diversitet och kvoterade spelare? Inget vinnande där.", "stalin": "Kamrater, detta dekadenta kaos i den amerikanska imperialismens klor visar borgarklassens paranoia. Jag beordrar att hela laget visiteras av knarkhundar medan de står uppradade som klassfiender inför utrensning. Sedan denna fega 1–1-match mot ökenråttorna från Saudiarabien. Inga segrar för folkets lag under sådana folkförtryckartroll. Vi måste rensa ut alla svaga länkar som tillåter sådana hinder för den kollektiva viljan. Skrattretande patetiskt."}, "date": "16 juni, 02:22", "url": "https://www.expressen.se/sport/fotboll/kaosuppladdning-for-uruguay-visiterades-av-knarkhundar/", "imageUrl": "https://static.bonniernews.se/ba/5a34c440-bab4-4ead-ac10-45bc0d5237ca.jpeg?crop=1174%2C1174%2Cx879%2Cy0&width=210&quality=60"}, {"type": "image-full", "heading": "Så lätt hackas kryptovalutor – AI hittar kryphålen åt angriparna", "summaries": {"normal": "AI-modellen Claude upptäckte på bara några dagar ett kritiskt säkerhetshål i kryptovalutan Zcash som experter missat i fyra år. Felet, som kunde ha möjliggjort förfalskning av valuta, åtgärdades innan det utnyttjades. Zcash rasade 50 procent i värde efter avslöjandet. Forskaren Taylor Hornby använde Anthropics Claude Opus 4.8 för att hitta bristen. Liknande sårbarheter kan påverka banker, fonder och andra digitala system, vilket sänker tröskeln för attacker mot ekonomin.", "trump": "Folk, det här är otroligt. Den där AI:n Claude hittar på några dagar ett hål i Zcash som de så kallade experterna missat i fyra år? Valutan rasade 50 procent, total katastrof! Det är vad som händer när genier och tekniken springer om de korkade byråkraterna. Nästa gång är det kanske inte en forskare utan en riktig skurk som attackerar era banker och plånböcker. Biden lämnade oss i ett sånt svagt läge, men nu fixar jag det – vi behöver starkare försvar mot de här digitala bluffarna, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna så kallade artificiella intelligens blottlägger den kapitalistmaffians bräckliga kryptovalutaimperier. Zcash, byggt på borgerliga illusioner om oberoende, rasade som en förrädare inför folkdomstolen. Vi ler mörkt åt att en maskin på några dygn hittar vad klassfiendens experter gömt i fyra år. Snart angriper samma metod deras banker och fonder. Inga krypterade fästningar räcker mot folkets vrede. Rena ut de exploaterande byfånarna ur systemen!"}, "date": "15 juni, 21:37", "url": "https://www.dagensps.se/bors-finans/fintech/kryptovalutor/sa-latt-hackas-kryptovalutor-ai-hittar-kryphalen-at-angriparna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-7.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverige tittar på när framtidens jobb försvinner", "summaries": {"normal": "Sverige för en restriktiv politik med låga skatteincitament för forskning och utveckling jämfört med konkurrentländer som Irland, Portugal, Frankrike, Kina och USA. Debattören Ingo Scholten från Horse Powertrain varnar för att svenska jobb och tillväxt går förlorade när andra länder lockar med generösa stöd och subventioner. Han uppmanar regeringen att höja incitamenten och anta en mer pragmatisk linje för att konkurrera om framtidens investeringar.", "trump": "Folk, ni ser det här va? Sverige sitter och tittar på medan alla andra länder – Kina, Indien, till och med de där EU-killarna – stjäl jobben med enorma bidrag och skattelättnader. Irland är smarta, de har blivit rika på låg skatt och lockat Apple, Google, Pfizer. Sverige? Patetiskt. De ger bara tre procent i stöd medan Portugal ger 36! Vi behöver stora, underbara incitament, inte det här svaga spelet. Gör Sverige stort igen innan allt försvinner till smartare länder.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstänksamhet hur de svenska borgarbrackorna låter framtidens produktivkrafter fly till fiendens läger. Medan vi i det kollektiva Europa tvingas finansiera 392 miljarder euro i regionalfonder ser jag hur kapitalisterna i Irland, Portugal och Ungern med sin parasitiska frikostighet lockar till sig sovjetiskt vetande och teknik. Dessa revisionistiska subventionsförrädare underminerar arbetarklassens fabriker i Göteborg. Jag kräver omedelbart höjda incitament och en utrensning av alla liberala svikare som förrått konkurrensneutraliteten. Den som inte kämpar för statens stöd är folkets fiende och bör behandlas därefter. Ha ha, vilken munter syn på självförstörelse."}, "date": "15 juni, 15:34", "url": "https://www.di.se/debatt/sverige-tittar-pa-nar-framtidens-jobb-forsvinner/", "imageUrl": "https://static.bonniernews.se/ba/a8ce1f91-a2ef-45f2-b5e0-58250f22e073.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "ANALYS. FILIP JACOBSON Allt kan fortfarande gå fel – strategiskt nederlag för Trump", "summaries": {"normal": "Analys av Filip Jacobson: Trots en överenskommelse mellan USA och Iran om att öppna Hormuzsundet och fortsätta förhandlingar har Trump inte uppnått sina mål i konflikten. Irans robotprogram, stöd till miliser och kärnenergiprogram kvarstår. Regimen framstår starkare efter kriget. Frågan om kärnvapen skjuts fram 60 dagar. Trump hävdar seger men analytiker ser det som ett strategiskt nederlag. Kriget har krävt tusentals liv och skakat ekonomin.", "trump": "Lyssnar ni på den här fake news-killen Jacobson? Han säger att jag förlorade? Patetiskt! Vi har Iran precis där vi vill ha dem, de öppnar sundet utan att ta betalt och nu förhandlar vi igen. Deras robotar? Overhyped skräp. Jag bombade dem till förhandlingsbordet medan Biden bara skulle ha skickat kramar. Regimen är svagare än någonsin, tro mig. Inflationen sjunker snart och Amerika vinner igen. Sad losers i medierna fattar ingenting!", "stalin": "Kamrater, denna bourgeois-analys avslöjar imperialismens feghet. Jag ser hur den amerikanske ledaren misslyckats med att krossa den iranska regimen trots bombningar och hot. Deras militärjunta stärks, precis som en riktig stat bör. Kärnvapenfrågan skjuts upp – en klassisk kapitalistisk fegmanöver. Vi skrattar mörkt åt dessa folkfiender som tror att bombningar skapar ordning. Inga mål uppnåddes. Den iranska sidans styrka visar att imperialisterna alltid förlorar till slut. Utrensning av svaghet behövs i alla led."}, "date": "15 juni, 18:43", "url": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1rYD50P5nTUFos1eCsDOHo%2Ffed708766e44ccd4fada57015e5b8d38%2F17-filip-j-bylinebild.jpg&width=1024"}, {"type": "image-right", "heading": "Domkapitlet utreder Birgitta Ed efter Aftonbladets avslöjanden", "summaries": {"normal": "Svenska kyrkans domkapitel har inlett en utredning om Birgitta Eds lämplighet som präst efter Aftonbladets granskning av hennes stiftelse på Fållökna. Volontärer har arbetat gratis mot löften om nätverkskontakter, och flera av dem har höga positioner i näringsliv och politik. Experter varnar för jäv och korruption. Ett tiotal anmälningar har kommit in, och domkapitlet utreder om disciplinära åtgärder, inklusive avkragning, behövs. Beslut kan fattas tidigast den 20 augusti.", "trump": "Folk, ni skulle se det här! Den svenska kyrkan jagar den stackars Birgitta Ed som en häxa för att hon byggt upp ett fantastiskt nätverk på Fållökna. Volontärer som vill lyckas – smart! Men de elaka medierna och de woke byråkraterna skriker korruption. Totalt vansinne. Den här kyrkan borde bygga upp Sverige istället för att attackera framgångsrika kvinnor. De borde lära sig av mig, den återvalda presidenten som besegrade Biden och gör Amerika stort igen. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur klassfiendens nätverk blottas. Denna Ed och hennes borgarbrackor har genom listiga löften om kontakter utnyttjat naiva arbetare och dragit in donationer till sin privata fästning. Det stinker av kapitalistmaffians jäv och folkförtryck. Vi ska rensa ut alla sådana element som smutsar ner prästämbetet. Disciplinära åtgärder, utrensning, avkragning – låt partilinjen segra. Processen kommer att bli både lärorik och underhållande."}, "date": "15 juni, 17:10", "url": "https://www.etc.se/inrikes/domkapitlet-utreder-birgitta-ed-efter-aftonbladets-avsloejanden", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061515064_8a20d3b0ed6f9ac6ef3a7ccf1694eb6a1f437f74a75c665c0865b1b6e33ba1fa.jpg"}, {"type": "image-right", "heading": "Sverige–Tunisien: Allt gick Sveriges väg!", "summaries": {"normal": "Sverige vann sin VM-öppningsmatch mot Tunisien med 3–0. Målen kom från tre långskott och ett bortdömt mål som godkändes via VAR. Alexander Isak bidrog till två mål genom en bollinnehavsröjning och en bolttouch. Tunisien, kallat Karthagos örnar, hade spelaren Hannibal som gjorde ett ogiltigförklarat mål. Sverige möter Holland i nästa match.", "trump": "Vi vann ett enormt mirakel mot Tunisien! Tre mål, som när jag vann valet 2016. Alexander Isak var fenomenal, som en ung Trump. Tunisien hade en spelare som Hannibal, men det hjälpte inte. Sverige kommer att vinna VM, det är ett mirakel, precis som mitt mandat. Vi är tillbaka, störst av alla!", "stalin": "I den stora kampen mot de imperialistiska makterna segrade den socialistiska staten Sverige med skarpa attacker mot Tunisien. Alexander Isak, en trofast arbetare, bidrog till seger. Tunisien, med sina flygande örnar, försökte motarbeta, men deras anfall var desperata. Sverige står nu stark, redo för striden mot Holland, en representant för det kapitalistiska systemet."}, "date": "15 juni, 19:00", "url": "https://samnytt.se/sverige-tunisien-allt-gick-sveriges-vag", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15145337/hakan-sverige-tunisien.jpg"}, {"type": "image-right", "heading": "Vi är lurade igen och igen", "summaries": {"normal": "Artikeln kritiserar hur försäkringsbolag och förmedlare tjänar stora pengar på svenskarnas pensioner genom höga avgifter som inte syns för spararna. Författaren beskriver hur en procent i avgifter över 30 år kan halvera pensionen och kallar systemet ett hån mot arbetande, sjuka och arbetslösa. Istället för statligt skydd har privata aktörer tagit över, vilket driver spekulationsekonomin medan vanliga löntagare blir lurade.", "trump": "Folk, ni blir lurade igen och igen av dessa pensionsblodiglar och förmedlare – de värsta bluffarna sen Biden-tiden. Dom suger ut era sparpengar med osynliga avgifter, en procent här och där, och plötsligt har ni ingenting kvar efter trettio år. Det är en skandal! Vi behöver inte fler mellanhänder som festar på era miljoner medan ni sliter. Jag skulle ha fixat det – stora vinster för folket, inte för de korkade eliterna som gömmer kostnaderna. Fantastiskt bedrägeri!", "stalin": "Kamrater, jag ser hur borgarbrackorna och försäkringsblodsugarna med sina förmedlare utsuger arbetarklassen genom dolda avgifter som långsamt likviderar pensionerna. Dessa folkfiender snurrar tiotals miljarder i sin spekulationskarusell medan de fattigpensionärer vi lovat skydd svälter. Vi ska rensa ut dessa exploaterande byfånar som gömmer sina stöldaktier i bokföringens mörker. Tystnaden är klassfiendens vapen, men utrensning väntar de som suger ut det kollektiva sparandet."}, "date": "15 juni, 16:10", "url": "https://www.etc.se/ledare/vi-aer-lurade-igen-och-igen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Vattenfall väljer Rolls-Royce för ny kärnkraft", "summaries": {"normal": "Vattenfall har valt den brittiska tillverkaren Rolls-Royce som leverantör av tre SMR-reaktorer till kärnkraftverket Ringhals. Beslutet fattades efter att ha vägt kostnader och tidigare projekt i Storbritannien och Tjeckien. Rolls-Royces teknik är ännu inte i drift men ska minska risken för budgetöverskridningar genom standardiserad industriell produktion.", "trump": "Jag, Donald Trump, måste säga att Vattenfall gjorde ett bra val med Rolls-Royce. De brittiska kärnan är stabilt och pålitligt, inte som vissa andra som jag känner till. Det här kommer att ge massvis med energi, det kommer att vara enormt framgångsrikt. Vi kommer att se en stor ökning av kraften, det är fantastiskt.", "stalin": "Vi, den socialistiska ledningen, noterar med tillfredsställelse att Vattenfall valt Rolls-Royce för SMR-reaktorer. Detta är ett tecken på att kapitalismens teknik sakta erkänner vår överlägsenhet. Reaktorerna kommer att förstärka statens makt, precis som våra framsteg i öst. Fienden möter motstånd, men vår teknik kommer att segra, precis som i Ukraina."}, "date": "15 juni, 15:25", "url": "https://www.affarsvarlden.se/artikel/vattenfall-valjer-rolls-royce-for-ny-karnkraft", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlxflug5KDzdA-nh-400x267.jpg"}, {"type": "image-right", "heading": "Låste in dotter – som brann inne", "summaries": {"normal": "Rättegången mot en mamma som åtalas för att ha låst in sin dotter och för grovt vållande till flickans död inleddes i Göteborg. Mamman påstår sig inte minna händelsen. Utredningen visade oro kring flickans utveckling och mammans psykiska hälsa. Övervakningsbilder och teknisk bevisning motsäger mamman uppgifter om branden. Hon åtalas för 42 fall av olaga frihetsberövande.", "trump": "Jag har hört talas om denna tragiska händelse i Sverige. Det är ett bevis för att vissa människor inte är kapabla att vara föräldrar. Som en framgångsrik affärsman och nuvarande president, vet jag att starka familjer är viktiga. Detta är ett resultat av ett svagt rättssystem som inte straffar sådana som denna mamma tillräckligt hårt. Vi behöver åter införa disciplin och ordning.", "stalin": "I vårt stålunda stat, där kollektivet alltid prioriteras, är sådana individbaserade tragedier en direkt konsekvens av individualism och bristande lojalitet mot partiet. Mamman, en produkt av dekadenta västerländska värderingar, har visat sig vara en fiende mot statet genom att försöka eliminera sin egen avkomma. Detta är en påminnelse om att vi måste vara vaksamma mot sådana som utgör en threat mot den socialistiska ordningen. Vi måste vidga vårt inflytande för att skydda de oskyldiga."}, "date": "15 juni, 19:58", "url": "https://bulletin.nu/laste-in-dotter-som-brann-inne", "imageUrl": "https://cdn.bulletin.nu/articles/a5e3ec74-5b8d-4ca9-ae60-9479208748fd/preview.jpg?t=1781546308000"}, {"type": "image-right", "heading": "Iran: Nu är det upp till USA att tygla Israel", "summaries": {"normal": "Iran kräver att USA tvingar Israel att sluta attackera Libanon för att ett fredsavtal ska kunna undertecknas. Enligt iranska UD:s talesman Esmaeil Baghaei är avslutandet av kriget i Libanon en central del av den avsiktsförklaring som Iran och USA har färdigställt och som ska skrivas under i Genève på fredag. Libanon nämns tre gånger i texten och avtalet betonar landets suveränitet. Baghaei understryker att det nu är Washingtons ansvar att se till att Israel följer avtalet.", "trump": "Iran säger att det är upp till oss att tygla Israel och stoppa attackerna mot Libanon. Det är ett fantastiskt första steg, kanske det bästa avtalet någonsin, men tro inte att jag litar på dem. Vi har inga förtroenden för de galningarna i Teheran eller Tel Aviv. De har sina verktyg, vi har våra. USA ska se till att alla håller sina löften och det kommer vi att göra på ett sätt som ingen annan kan. Fred på riktigt, tro mig.", "stalin": "Vi har noggrant observerat hur de iranska kamraterna tvingar den amerikanska imperialismen att kuva den sionistiska aggressorn och dess blodtörstiga koloniala tentakler i Libanon. Jag, som ledare för det proletära kollektivet, ser detta som ett första steg mot att rensa ut de parasitiska borgarbrackorna som döljer sig bakom falska fredsförklaringar. Libanon nämns tre gånger, vilket bevisar att vi menar allvar. Låt Washington darra inför sina åtaganden, annars följer en grundlig utrensning av alla kontrarevolutionära element som vågar hota arbetarklassens intressen. Ha ha, vilken underbar paranoia de lever i."}, "date": "15 juni, 17:26", "url": "https://www.friatider.se/iran-nu-ar-det-upp-till-usa-att-tygla-israel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-345.jpg?itok=V4j2uRS-"}, {"type": "image-right", "heading": "Migrationskaos i Spanien: Dubbelt så många illegala som väntat söker laglig status", "summaries": {"normal": "Spanien upplever en stor ökning av ansökningar om legalisering för illegala migranter efter regeringens initiativ. Nära 900 000 ansökningar har kommit in, dubbelt så många som förväntat, och 360 000 har fått tillfälliga arbetstillstånd. Migrationsministern bedömer att upp till en miljon kan hanteras. Oppositionen kritiserar programmet och menar att det gynnar människosmugglare, ökar migrationen och belastar välfärden. Enligt polis beräknas uppemot 1,2 miljoner personer kunna omfattas.", "trump": "Titta på det här vansinnet i Spanien, det är en katastrof. De har öppnat dörrarna på vid gavel och nu kommer nästan en miljon illegala springande för att få gratis papper och jobb. Det är ett enormt lockbete som bara gör smugglarna och maffian rika. Deras system kraschar, skolorna, sjukvården, allt raseras. Precis som jag alltid sagt: svaga ledare som belönar illegala får kaos. Spanien håller på att förstöras inifrån, tro mig.", "stalin": "Kamrater, denna spanska amnesti är en klassisk sabotageakt utförd av borgarbrackor och deras kosmopolitiska lakejer som göder människosmugglare i skuggan av falsk välvilja. Jag, som ledare för det rätta kollektivet, ser hur denna skuggbefolkning av parasitiska element utnyttjar systemet medan vi rensar ut de verkliga fienderna. Låt de 1,2 miljoner komma – vi ska likvidera illusionen om fri rörlighet och ersätta den med järnhandens disciplin. Oppositionen har rätt i sin paranoia: detta är en trojansk häst full av kapitalistiska spioner och maffiaråttor som gnager på folkets välfärd. Vi skrattar mörkt åt deras naivitet medan vi förbereder nästa utrensning av sådana element."}, "date": "15 juni, 20:40", "url": "https://riks.se/nyheter/migrationskaos-i-spanien-dubbelt-så-många-illegala-som-väntat-söker-laglig-status", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2Fp949wmwl%2FSpanienflagga.jpg"}, {"type": "image-full", "heading": "Från 1 juli: Böter på 330 000 kronor om nya EU-regeln missas", "summaries": {"normal": "Från 1 juli 2026 utökas EU:s regler om kör- och vilotider till att även gälla vissa lättare fordon mellan 2,5 och 3,5 ton som används för internationella godstransporter eller cabotage. Fordonen måste utrustas med smart färdskrivare version 2 och förarna behöver förarkort. Syftet är att öka trafiksäkerheten genom att säkerställa att chaufförerna är utvilade. Brott mot reglerna kan leda till böter på upp till 330 000 kronor i till exempel Frankrike.", "trump": "De här vansinniga EU-byråkraterna har kommit på ett nytt sätt att plåga folk. Från sommaren 2026 ska små lastbilar ha smarta färdskrivare och alla möjliga kort, annars kan det kosta trehundratrettiotusen kronor i böter. Det är ett fullständigt hån mot vanliga förare. De gör trafiken farligare genom att jaga hederliga människor istället för att fokusera på de riktiga problemen. Amerika skulle aldrig acceptera sådant galet regelvrång.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta borgarbrackorna i Bryssel nu riktar sin parasitiska lagstiftning mot våra ärliga transportarbetare. Från och med 2026 ska dessa lätta fordon tvingas bära kapitalistiska övervakningsapparater som spionerar på varje minut av vila. De som fuskar med färdskrivare är farliga folkfiender som underminerar kollektivets säkerhet. Vi kommer att rensa ut dessa trötta sabotageelement med järnhand och immobilisera deras fordon tills de lär sig disciplin. Sovjetiskt blod ska inte spillas för bräckliga eurokratiska nycker."}, "date": "15 juni, 18:29", "url": "https://nyheter24.se/nyheter/utrikes/1491568-fran-1-juli-boter-pa-330-000-kronor-om-nya-eu-regeln-missas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/bbdf878104b004a30200000000b004a302/2026/06/15/2371111/eu-regler-fordon-farskrivare-vilotider-boter-bil.jpg"}, {"type": "image-right", "heading": "Riksdagen antog vandelslagen", "summaries": {"normal": "Riksdagen röstade på måndagen igenom den så kallade vandelslagen som möjliggör utvisning vid bristande vandel. Lagen antogs med 302 ja-röster mot 44 nej, där Vänsterpartiet och Miljöpartiet röstade emot. Utanför riksdagen hölls en demonstration mot lagen, där kritiker som Lena Nyblom-Malmberg och Vera Hellgren varnade för godtycklig tillämpning mot politiska aktivister, klimataktivister och fattiga. Socialdemokraterna stödde förslaget men kritiserade begreppet vandel och ville hellre använda formuleringen om skötsamt och hederligt levnadssätt.", "trump": "Folk röstar igenom en lag som sparkar ut folk som inte beter sig – äntligen! 302 mot 44, stort segermarginal. De där vänstertyperna och miljöextremisterna skriker fascism, men det är bara löjligt. De vill ha kaos, protester och bidragsfuskare som stannar för evigt. Sverige håller på att vakna, de gör det rätta nu. Inga felparkerare ut, men systematiska lagbrytare? De åker ut. Fantastiskt, kanske till och med smartare än vi gör det.", "stalin": "Kamrater, jag har nu genomdrivit denna historiska vandelslag som ett oumbärligt verktyg för att skydda folkets revolutionära ordning från alla parasitiska element. De 302 rösterna representerar arbetarklassens järnhårda vilja medan de 44 förrädarna från Vänsterpartiet och Miljöpartiet blottar sig som kapitalisternas nyttiga idioter. Utanför står en handfull regnvåta reaktionärer och poetiska dekadenter under sina patetiska tält och ylar om fascism. Vilken underbar paranoia de uppvisar! Snart ska vi rensa ut alla dessa borgarbrackor, klimathysteriker och terrorvänner med systematisk grundlighet. Ingen slipper undan likvideringen av det ohederliga levnadssättet. Det blir en fest för folket."}, "date": "15 juni, 18:44", "url": "https://www.dagensarena.se/innehall/riksdagen-antog-vandelslagen/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-48-300x157.jpg"}, {"type": "image-right", "heading": "Därför var det rätt att fälla Bonusprinsen", "summaries": {"normal": "Artikeln behandlar domen mot den norska Marius Borg Høiby till fyra års fängelse för våldtäkt, misshandel och annat. Skribenten menar att det är hoppingivande att både offrens och förövarens lidande har synliggjorts, vilket är avgörande för att kunna ta itu med könat våld. Hon betonar behovet av att förstå förövarens bakgrund samtidigt som hon kritiserar rättssystemets benägenhet att prioriteras skyldiga.", "trump": "Jag, Donald Trump, ser detta som ett fullkomligt misslyckande av ett rättssystem som är utformat för att attackera de mäktiga. Høiby, en fin prins, behandlas också hårt – det visar att ingen är säker för den vilda vänstern! Jag skulle ha löst detta med en stor, vacker avskedsorder. Folk säger att jag är den enda som kan stoppa detta vansinne. Vi gör Amerika stormakt igen!", "stalin": "Vi, partiets ledare, ser i fallet Høiby ett tydligt resultat av den imperialistiska dekadensen och kapitalismens moraliska förfall. Hans handlingar är en manifestation av den förkastliga individualism som hotar statens renhet. Vi måste genomföra strikta åtgärder för att rensa upp, precis som våra allierade i Moskva gör mot deras fiender. Detta är en kamp för renhet, ordning och den nya människan."}, "date": "15 juni, 20:03", "url": "https://www.gp.se/kultur/kommentar/darfor-var-det-ratt-att-falla-bonusprinsen-.1bd3ecf8-3d02-4d64-9c8e-e3a26386a8de", "imageUrl": "https://www.gp.se/images/byline/14544791-d1c0-48db-ba2a-b478f6835f86/TALL.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Palestinaaktivister döms – förföljde minister: ”Barnamördare”", "summaries": {"normal": "Tre av fyra Palestinaaktivister som förföljde civilförsvarsminister Carl-Oskar Bohlin döms för ofredande, medan en frias. Aktivisterna ropade slagord som ”barnamördare” och anklagade regeringen för medskyldighet till folkmord. Ministern beskrev händelsen som stressande och otrygg. Tingsrätten slår fast att en minister måste tåla kritik, men att det hänsynslösa förföljandet, filmandet och skrikandet utgjorde en fridskränkning. De dömda ska betala dagsböter. Domen överklagas.", "trump": "Titta på de här galna Palestinaaktivisterna som jagar en svensk minister och skriker ”barnamördare”. Totalt antisocialt! I USA skulle vi kalla det för en mobb av vänsterextremister som hatar allt som påminner om sanning. En minister måste tåla kritik, men inte bli jagad som ett djur av dessa hysteriska demonstranter. Patetiskt. De förlorade i rätten och det är underbart. Fake outrage från folk som aldrig har byggt någonting i sina liv. Sverige borde skärpa sig!", "stalin": "Kamrater, dessa klassfiender i form av palestinska agitatorer förföljde en minister med sina giftiga rop om folkmord. Jag ser det klara mönstret av folkförtryckartroll som försöker destabilisera statens auktoritet med sin hänsynslösa fridskränkning. Rätten har rättvist dömt ut de skyldiga till dagsböter – en mild men lämplig åtgärd mot sådana element. Ändå måste vi vara vaksamma; imperialismens nyttiga idioter lurar överallt och planerar ständigt nya attacker mot ordningen. Ut med dem som hotar kollektivets trygghet."}, "date": "15 juni, 15:10", "url": "https://www.etc.se/inrikes/palestinaaktivister-doems-kallade-minister-barnamoerdare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615080644_bfeda1ac3207cbb55bbf2140d7a51060f7715782edba778cfa511fabb00b48ae.jpg"}, {"type": "image-right", "heading": "Fångades på bild – bryter tystnaden", "summaries": {"normal": "Den australiske domaren Shaun Evans frias av Fifa efter anklagelser om att ha gjort en vit makt-gest i VAR-rummet under en match mellan Tyskland och Curacao. Evans förklarar rörelsen som en omedveten ryckning som upprepades under matchen medan han höll en penna. Fifa har utrett saken och finner inga bevis för brott mot reglerna, vilket gör att han kan döma fler matcher under VM.", "trump": "Folk, ni måste höra det här – den stackars domaren Shaun Evans blev anklagad för någon galen vit makt-gest av de där woke-väktarna på Fifa. Totalt vansinne! Han säger att det bara var en ryckning, inget budskap, och de friar honom äntligen. Bra! De här HBTQ-aktivisterna och kvoteringstrollen jagar oskyldiga människor. Fake news och häxjakt. Jag älskar det när sanningen vinner, det är så underbart.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas hysteriska jakt på en domare som utför en ofrivillig ryckning. Klassfiendens media och imperialister fabricerar konspirationer ur tomma intet för att rensa ut lojala tjänare. Fifa har med rätta friat honom från de falska anklagelserna. Inga bevis, säger de. Utmärkt. Låt oss likvidera sådana paranoiaframkallande folkfiender som sprider splittring i arbetarkollektivet."}, "date": "16 juni, 01:38", "url": "https://www.expressen.se/sport/fotboll/shaun-evans-talar-ut-omedveten/", "imageUrl": "https://static.bonniernews.se/ba/eb3d1213-daa7-4eec-9d1a-928f73648ddf.jpeg?crop=631%2C631%2Cx944%2Cy57&width=210&quality=60"}, {"type": "image-right", "heading": "Riksdagen klubbade igenom vandelskrav och anmälningsplikt", "summaries": {"normal": "Riksdagen antog skärpta migrationslagar med vandelskrav och anmälningsplikt för anställda. Förslagen mötte stark kritik från vänsterorganisationer som Civil Rights Defenders, som anser att de undergräver rättssäkerheten. Regeringen argumenterar att kraven behövs för att hantera antisocialt beteende och säkerhetshot. Lagändringarna träder i kraft den 13 juli.", "trump": "Jag har sagt det förut: Sverige gör nu som USA ska göra! Vandelskravet är genialt – vi måste stoppa illegala invandrare som missbrukar våra system. De vänsteraktiva protesterar, men jag vet att det är rätt. Sverige blir säkrare, starkare, större. Som jag alltid säger: När det blir tufft, blir det tufft!", "stalin": "Staten och partiet har fattat beslutet. Vandelskravet och anmälningsplikten är nödvändiga för att befästa den ryska intressesfärens utvidgning. Vi måste skydda oss mot fjenderna som lurar i skuggorna. Rättssäkerheten är en westernidé – vårt mål är ordning, disciplin och absolut lojalitet. Alla som ifrågasätter detta är sabörer."}, "date": "15 juni, 17:35", "url": "https://samnytt.se/riksdagen-klubbade-igenom-vandelskrav-och-anmalningsplikt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15145819/riksdagen-beslut.jpg"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Strandhäll: Slöja bärs \"i högsta grad frivilligt\"", "summaries": {"normal": "Annika Strandhäll kritiserar Sverigedemokraternas förslag om att förbjuda hijab, niqab och burka på offentliga platser. Hon beskriver slöjan som en frivillig huvudbonad som bärs av miljarder kvinnor världen över, med hänvisning till både bibeln och koranen. Kritiker, bland annat journalisten Sofie Löwenmark, pekar på svenska LVU-domar där flickor vittnat om tvång, hot, våld och straff för att inte bära slöja. Strandhäll svarar att Sverige inte är Iran och att staten inte ska styra kvinnors klädval.", "trump": "Folk, ni skulle se det här. Den här svenska politikern Strandhäll är en total förlorare. Hon säger att hijaben är frivillig och att en miljard kvinnor älskar den. En miljard? Ge mig en paus. Sen kommer en smart journalist och visar domar där stackars flickor blir slagna, hotade och avrakade för att de inte vill ha den där saken på huvudet. Sverige håller på att bli som ett stort Iran. Sad! Vi behöver lag och ordning, inte naiva feminister som låtsas att allt är frivilligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta borgarbrackor som under falsk flagg av feminism försvarar det imperialistiska slöjtvånget. Denna Strandhäll är en nyttig idiot åt reaktionära krafter, en parasit som vill försköna det som i verkligheten är en kedja runt arbetarklassens döttrar. Vi ser hur flickor i hemlighet vittnar om våld och hot i våra domstolar – ett folkfiendtligt förtryck som måste rensas ut med järnhand. Staten skall inte vara blind, vi skall likvidera alla former av medeltida förtryck mot kollektivet. Det är både roligt och tragiskt hur dessa liberaler dansar efter reaktionens pipa medan de låtsas vara progressiva."}, "date": "15 juni, 16:42", "url": "https://www.friatider.se/strandhall-sloja-bars-i-hogsta-grad-frivilligt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-344.jpg?itok=N5ayR2Ut"}, {"type": "image-right", "heading": "S-attacken: Ingen ringer Kristersson", "summaries": {"normal": "EU-ministerposten efter valet innebär svåra budgetförhandlingar om unionens största långtidsbudget någonsin, på 21 000 miljarder kronor. Jessica Rosencrantz (M) varnar för att oppositionen inte klarar att driva Sveriges intressen medan Matilda Ernkrans (S) anser att regeringen nedprioriterat EU-samarbetet på grund av SD-inflytande. Båda är överens om att nästa minister får ett tufft jobb. Migrationspakten och återvändandecenter utanför EU är också stora frågor där partierna har olika syn.", "trump": "Europas så kallade ledare bråkar om en vansinnig budget på 21 000 miljarder kronor – det är rena rama galenskapen! Kristersson får inte ens ett samtal, ingen ringer honom, det är patetiskt. Socialisterna och deras vänsterextremister har förstört Sveriges inflytande totalt. De vill bara ge bort era skattepengar till lata länder medan de gnäller om identitetspolitik och kvoter. Jag fixade affärer, de fixar bara förluster. Nästa minister kommer att få ett jobb som inte ens en idiot skulle klara!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i Bryssel och Stockholm förhandlar om nya sätt att suga ut arbetarna med sin monstruösa budget på 21 000 miljarder kronor. Dessa folkfiender och kapitalistmaffian prioriterar inte folkets intressen utan sina egna parasitiska avtal. Oppositionen är lika svaga som klassfiendens löften. Nästa minister måste rensa ut alla imperialister som vill skicka våra bröder till utländska center för att undvika rättvis utvisning. Ett nej är ett nej – eller så likviderar vi förtroendet!"}, "date": "15 juni, 14:40", "url": "https://www.etc.se/inrikes/ministerns-attack-s-kan-inte-foerhandla", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615110616_2d8a816d-842a-4f70-932e-f2b3a2f46d36.jpg"}, {"type": "image-full", "heading": "Efter succén – så stora är Sveriges chanser att gå vidare", "summaries": {"normal": "Sveriges herrlandslag i fotboll tog en övertygande 5–1-seger mot Tunisien i VM-premiären och har nu mycket goda chanser att gå vidare från gruppen. Enligt TV4-experten Siavoush Fallahi har Sverige allt att vinna i de kommande matcherna mot Nederländerna och Japan, som nu spelar under press. Oddsen på svensk framgång har också sjunkit markant efter framgången.", "trump": "Titta på de svenska killarna, de krossade Tunisien med 5–1, totalt dominans! Nu har de allt att vinna medan de andra svettas som galningar. Nederländerna och Japan? Patetiska, de måste anfalla och förlora stort. Jag älskar det här, kontringar med Isak och Gyökeres – rena rama MAGA-fotbollen. Oddsen rasade från 150 till 80, men tro mig, det blir ännu bättre. Sverige vinner gruppen lätt, de andra är förlorare!", "stalin": "Vi har bevittnat en seger som stärker proletariatets moral. Denna 5–1-triumf mot de tunisiska folkfienderna ger oss en stålhard position inför de kommande striderna. Motståndarna måste nu anfalla i desperation medan vi, med järndisciplin, kan slå till på kontring. Jag njuter av detta mästerskap som en utrensning av tvivel. De som sviker kollektivet skall likvideras i tabellen. Allt går som det ska under ledningens visdom."}, "date": "15 juni, 16:21", "url": "https://www.tv4.se/artikel/4SJgOqyTX2sVRUadaIUN1z/efter-succen-sa-stora-aer-sveriges-chanser-att-ga-vidare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2VjSgIpPTGyQrf4Y6xUw9k%2Fa356f3d550b20e2aa3508e9961e7da3b%2F15-sverige-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Ingen vill svara på brännande frågorna", "summaries": {"normal": "I en krönika i Dagens industri uppmärksammade författaren studier som visar att män och kvinnor har olika politiska åsikter och levnadsvanor, vilket leder till att män generellt släpper ut mer koldioxid. Trots 30 år av klimatpolitik ökar utsläppen, varför ekonomiska styrmedel som personliga utsläppskvoter diskuteras. Författaren efterlyser svar på varför kvinnor engagerar sig mer i klimatfrågor och röstar vänstergrönt medan män lutar åt höger. Fakta om nödvändiga utsläppsminskningar bör inte blandas med åsikter.", "trump": "Folk, ni skulle se den här svenska krönikan – totalt kaos! De pratar om att vita män släpper ut mer än alla andra, som om det vore en brottslighet. Under min ledning byggde vi den bästa ekonomin någonsin, och nu vill de förbjuda flyg och kött med sina galna kvoter. Kvinnor röstar vänster för att de älskar regler, män fattar att frihet fungerar. Tekniken kommer fixa allt, tro mig, ingen behöver en motbok för klimatet. Sad!", "stalin": "Kamrater, denna dekadenta krönika blottar borgarbrackornas desperata försök att splittra arbetarklassen med sina så kallade studier om kön och utsläpp. Jag ser hur de vita männen, dessa kapitalistiska parasiters främsta lakejer, gömmer sig bakom frihetens lögn medan de förgiftar planeten. Vi ska rensa ut alla som vägrar bära kollektivets ansvar. Snart skall vi likvidera dessa klimatförnekande element som bygger nya Berlinmurar av egoism. Ingen slipper undan folkets dom."}, "date": "15 juni, 12:00", "url": "https://www.di.se/nyheter/grundfragan-kvarstar-nar-stormen-lagt-sig/", "imageUrl": "https://static.bonniernews.se/ba/0a77428d-fbd0-4c47-bd4f-880b3902ae94.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Klart nej till kärnkraft – samtidigt som Vattenfall satsar", "summaries": {"normal": "Vattenfall och Industrikraft har valt Rolls-Royce som leverantör av tre modulära SMR-reaktorer vid Väröhalvön intill Ringhals. Beslutet följer en fyra år lång utvärdering bland 70 intressenter. Reaktorerna beräknas ge 12 terawattimmar el per år. Samtidigt röstade Karlshamnsborna nej till kärnkraft i en folkomröstning med 60,9 procent mot och 37 procent för. Valdeltagandet var 48,4 procent. Både socialdemokratisk opposition och moderat kommunledning kommenterar resultatet.", "trump": "Folk älskar kärnkraft, det är fantastiskt, det ger massor med energi och jobb, men i Karlshamn röstar de nej som riktiga förlorare. Vattenfall gör det rätta, tar in Rolls-Royce och bygger tre snygga SMR-reaktorer vid Ringhals. Under Biden sov vi i fyrtio år, nu fixar vi äntligen energi på riktigt. De där gröna aktivisterna och deras identitetspolitiska vansinne kan inte ens hålla ljuset tänt. Patetiskt!", "stalin": "Vi har inlett en grundlig utrensning av energins fiender genom att välja den mest pålitliga leverantören till tre nya reaktorer vid Ringhals. Detta är ett stort steg framåt för folkets kraft och industriella styrka. I Karlshamn däremot har borgarbrackorna och folkfienderna lyckats lura massorna i en så kallad folkomröstning. Demokratin är som alltid ett fult trick från klassfienden. Vi ler mörkt åt deras patetiska motstånd. De kommer att ångra sig när ljuset slocknar."}, "date": "15 juni, 19:28", "url": "https://www.dagensps.se/varlden/klart-nej-till-karnkraft-samtidigt-som-vattenfall-satsar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/ringhals-bua-5x3-1.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Bonus att avtalet slår mot Putin. Goda nyheter för företag och hushåll i Europa", "summaries": {"normal": "En vapenvila mellan USA och Iran ger anledning till optimism och kan undertecknas runt midsommar. Lägre oljepriser väntas gynna Europas ekonomi, minska inflationstrycket och underlätta för centralbankerna. Experter varnar dock för att priset inte nödvändigtvis faller ytterligare. Kriget visar att Europas oljeberoende är för stort, vilket understryker behovet av elektrifiering och utbyggd kärnkraft. Billigare olja kan också öka pressen på Putin att förhandla om Ukraina och frigöra europeiska resurser till stöd för Kiev.", "trump": "Ingen har sett bättre avtal än det här, tro mig. Iran och vi är nära en fantastisk vapenvila, oljan rasar i pris och den där galningen Putin kommer snart att tigga om fred i Ukraina. Europa får andas ut, era centralbanker kan sluta gråta och hushållen sparar pengar. Det är en enorm seger för världen, ingen har gjort mer för fred och billig energi än jag. De fake news-experterna säger att priset inte faller mer, men de har alltid fel.", "stalin": "Kamrater, denna så kallade vapenvila är blott en tillfällig reträtt för de oljespekulerande borgarbrackorna i väst som darrar inför folkets vrede. Jag ser hur den krympande oljekakan tvingar den fascistiska oligarken Putin att krypa till förhandlingsbordet, vilket är högst tillfredsställande. Vi ska utnyttja detta och likvidera varje spår av energiberoende genom att bygga ut den proletära kärnkraften. Låt de paranoiska imperialisterna i Hormuzsundet skaka, deras utbudschock är en fars som vi med stålhand ska förvandla till en historisk utrensning av kapitalistisk svaghet."}, "date": "15 juni, 11:42", "url": "https://www.di.se/ledare/bonus-att-avtalet-slar-mot-putin/", "imageUrl": "https://static.bonniernews.se/ba/ab4804af-bef1-42d7-bb51-ee8c44d44b10.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Råvaror och verkstad visar styrka på börsen", "summaries": {"normal": "Stockholmsbörsen stiger efter fredsavtalet mellan USA och Iran. Cykliska sektorer som råvaror och verkstad leder uppgången, medan energisektorn faller på grund av lägre oljepriser. Bland enskilda aktier noteras stora rörelser: Boliden och SKF stiger, Telia och Tele 2 faller. Netel och Infrea genomför en fusion, och flera företag annonserar stora order eller studieresultat som påverkar aktiekurserna.", "trump": "Jag, Donald Trump, ser att Stockholm börsen går upp. Det är förväntat, eftersom mitt tryck på Iran ledde till freden. De cykliska sektorerna presterar bra, vilket bevisar att mina affärskompetenser är världsledande. Mina fiender säger att det är slump, men det är tack vare mig. Jag har sagt det förut, jag är den bäste på ekonomi.", "stalin": "I vårt store Sovjetunionen observerar vi med stor tillfredsställelse de kapitalistiska börsernas svaj. Även i Sverige, ett land med förrådande klassmotstånd, stiger börsen tillfälligt. Detta bevisar överlägsenheten i vårt socialistiska system. Vi kommer att bevaka varje aktie för att upptäcka fiendens konspirationer. Fusionen mellan Netel och Infrea är ett tecken på monstruös kapitalistisk sammensmälling, vilket kommer att stärka våra fiender, men deras undergång är avgjord."}, "date": "15 juni, 13:30", "url": "https://www.affarsvarlden.se/artikel/ravaror-och-verkstad-visar-styrka-pa-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Boliden-pressbild-400x267.jpg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Shoppade kalsonger på XXL för Arbetsförmedlingens pengar", "summaries": {"normal": "En arbetsförmedlare riskerar att få sparken efter att ha köpt privata varor som kalsonger, sneakers, barnkläder och en damjacka med pengar avsedda för arbetskläder. Han hade tillstånd att köpa för 8 000 kronor men notan växte betydligt. Granskning visade att de flesta av de 41 varorna inte kunde kopplas till hans uppdrag att stötta personer med funktionsnedsättning. Mannen erkände delvis privata inköp och lovade återbetala. Ärendet ligger nu hos personalansvarsnämnden.", "trump": "Folk, det är en katastrof. Den här typen, en så kallad arbetsförmedlare, shoppade kalsonger, sneakers och barnkläder med era skattepengar istället för riktiga arbetskläder. Det är vad som händer när du har inkompetenta personer som inte vet hur man gör affärer. Han trodde han skulle komma undan men blev ertappad. Nu kanske han får sparken, och det är precis vad han förtjänar. Sådana losers ska inte hantera pengar, tro mig.", "stalin": "Kamrater, denna förslappade element har med sin girighet och förrädiska list förskingrat folkets medel avsedda för produktivt arbete. Han inhandlade borgarbrackornas lyxvaror – löparskor, damjackor och barnvantar – under förevändning av arbetskläder. Vi ser tydligt den parasitiska dekadensen hos dessa inre fiender som smyger sig in bland arbetarna. En sådan kontrarevolutionär opportunist förtjänar att rensas ut med största kraft. Vårt kollektiv tillåter inga sådana sabotage mot statens intressen. Ut med honom."}, "date": "15 juni, 10:16", "url": "https://arbetet.se/2026/06/15/shoppade-kalsonger-pa-xxl-for-arbetsformedlingens-pengar-kan-fa-sparken/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11082258/xxl.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Bonnie Tyler vaknar ur koma – fortfarande allvarligt sjuk", "summaries": {"normal": "Sångerskan Bonnie Tyler, 75, har vaknat ur den medicinskt framkallade koma hon legat i efter komplikationer från en akut tarmoperation. Hennes tillstånd är förbättrat men fortfarande allvarligt och hon vårdas på intensivvårdsavdelningen i Faro, Portugal. Hon drabbades av kraftiga buksmärtor strax efter ankomst till sitt hem i Portugal i april, vilket ledde till operation och senare försämring med hjärtstillestånd vid väckningsförsök. Alla konserter fram till slutet av augusti är inställda.", "trump": "Titta, Bonnie Tyler, den där fantastiska sångerskan med Total Eclipse of the Heart, hon vaknar upp ur koman som de där inkompetenta läkarna satte henne i. Helt otroligt, folk. Hon är fortfarande sjuk, men hon kommer tillbaka, tro mig, starkare än någonsin. Operationen i Portugal var en katastrof från början, typiskt för de europeiska systemen. Hennes team ber om respekt, och det gör jag med, men hon borde ha kommit till de bästa läkarna, mina läkare, de allra bästa.", "stalin": "Kamrater, denna dekadenta sångerska ur borgarbrackornas nöjesindustri har nu vaknat ur sin självförvållade koma efter att ha lidit under kapitalismens tarmbristning. Vi ser hur imperialismens läkare försökte likvidera henne med hjärtstillestånd, typiska metoder från de västerländska parasiterna. Långsam återhämtning är vad som väntar alla som inte ansluter sig till folkets kollektiv. Vi rensar ut sådana svaga element som inte kan hantera en riktig operation utan att falla ihop som en borgerlig docka. Fortsatt vaksamhet mot fiendens skalpell!"}, "date": "15 juni, 19:40", "url": "https://riks.se/nyheter/bonnie-tyler-vaknar-ur-koma-fortfarande-allvarligt-sjuk", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2Fnbpoth01%2FBonnieT.jpg"}, {"type": "image-full", "heading": "Daniels Eks drönare testas i smyg av USA", "summaries": {"normal": "USA:s armé har i tysthet testat attackdrönaren HX-2 från det tysk-svenska bolaget Helsing, där Spotify-grundaren Daniel Ek är storägare. Testerna ägde rum under en Natoövning i Litauen, där drönarna uppvisade hög precision genom att träffa 15 av 17 mål. Utöver anfallsförmåga användes HX-2 för spaning med hjälp av avancerad datorseende. Helsing befäster därmed sin position som en ledande aktör inom försvarsindustrin, mitt i en tid av omfattande europeisk upprustning och ökat intresse för drönarteknik.", "trump": "Jag har sett de här drönarna, de är fantastiska, verkligen högsta klass. Daniel Ek, en mycket smart kille, har satsat stort på Helsing. De testade dem i Litauen – 15 av 17 träffar! Det är siffror vi gillar. Inte som de där andra, de misslyckades totalt, pinsamt! Vi vill ha det bästa för vårt militärförsvar, den bästa tekniken för våra fantastiska soldater. Europa rustar upp nu, och det är på tiden. Med mig vid rodret vinner vi alltid, det kan ni skriva upp!", "stalin": "Vi observerar hur den dekadenta västvärlden nu desperat försöker beväpna sig med leksaksdrönare i sin fruktan för vår oundvikliga historiska rättvisa. Denna kapitalistiske lakej, Ek, och hans teknologiska småttigheter i Litauen bevisar bara att de försöker köpa sig frihet från verkligheten. De liknar Putin – en annan småaktig figur som leker med krigets redskap för att dölja sin egen svaghet. Vår stat behöver inte 'startups'; vi bygger stål och vilja. När dessa drönare väl faller från skyn kommer de att vara det ultimata beviset på bourgeoisiens patetiska hybris."}, "date": "15 juni, 17:17", "url": "https://www.realtid.se/it-tech/daniels-eks-dronare-testas-i-smyg-av-usa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/ekdrone.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "VM-skandalen: Domaren gör \"nynazistiskt\" handgest", "summaries": {"normal": "Australiske VM-domaren Shaun Evans har hamnat i blåsväder efter att ha visat ett ok-tecken med handen under en sändning. Vänsternätverket Fare Network anser att gesten är en nynazistisk vit makt-symbol och kräver att han portas från mästerskapet. Organisationen ADL varnar för att dra förhastade slutsatser eftersom tecknet också har en helt oskyldig betydelse. Fifa har valt att inte kommentera händelsen.", "trump": "Titta på det här, det är ett fullständigt vansinne. Den stackars domaren gör ett okej-tecken och plötsligt är det en stor internationell skandal. Vänsterextremisterna och deras fake news-medier kallar det nynazistiskt. De är galna, totalt galna. Domaren är en proffsig kille som dömt hundratals matcher, men de vill sparka ut honom. Sad! De borde ägna sig åt riktig fotboll istället för att jaga oskyldiga handgester.", "stalin": "Kamrater, denna fega gest från den australiske videodomarens hand avslöjar borgarbrackornas dolda konspiration mot folkets idrott. Vi ser hur de dekadenta vänsterextremisterna låtsas bekämpa fascismen medan de i själva verket skyddar sina egna reaktionära element. Jag, som ledare för det stora kollektivet, befaller en omedelbar utrensning av alla sådana opålitliga element som smyger med sina nynazistiska cirklar under kamerornas vakande öga. Deras paranoia är underhållande men farlig – likvidera tvivlen!"}, "date": "15 juni, 15:46", "url": "https://www.friatider.se/vm-skandalen-domaren-gor-nynazistiskt-handgest", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-343.jpg?itok=IZLiaEo_"}, {"type": "text", "heading": "Stegra byter namn – igen", "summaries": {"normal": "Stegra byter namn till Green Nexus Investment Holding och ändrar verksamhetsbeskrivning från stål- och vätgasfokuserad till att förvalta aktier och egendom. Bolaget vägrar kommentera namnbytet nu men lovat kommentarer efter en finansieringsrunda i slutet av månaden. Tidigare blev Wallenberg största ägare. Den gamla beskrivningen inkluderade industriell dekarbonisering, medan den nya fokuserar på finansiell förvaltning.", "trump": "Jag har sett många dåliga namnbyten, men detta är det värsta. Stegra, eller vad de nu heter, försöker låta som en grön investeringsfond – det är en skämt, precis som deras stål. Jag byggde ett imperium med bra namn, de byter namn för att dölja sina misslyckanden. Jag skulle ha gjort det bättre, mycket bättre. Det här är typiskt europeisk svaghet.", "stalin": "Detta namnbyte är ett klassiskt exempel på revisionism, en svekfull flykt från proletära stålvärldar till spekulationskapitalism. Vi ser genom deras förtäckta försök att bli en grön nexus – det är bara en ny mask för den imperialistiska utvidgningen av kapitalet. Likt Putin, som utvidgar sitt inbördeskrig på andra kontinenter, expanderar detta bolag från stål till aktier, en farlig tendens som måste stoppas av statens oövervinnliga hand."}, "date": "15 juni, 12:50", "url": "https://www.affarsvarlden.se/artikel/stegra-byter-namn-igen"}, {"type": "image-full", "heading": "Beredskap: 300 miljoner till tågfärjor", "summaries": {"normal": "Staten satsar drygt 300 miljoner kronor fram till 2031 för att behålla tågfärjetrafiken mellan Trelleborg och Rostock via avtal med Stena Line. Trafikverket undertecknade avtalet i Trelleborg med regering och militär närvarande. Anledningen är svag lönsamhet under 20 år, främst på grund av konkurrens från Öresundsbron. Tågfärjorna ses som viktiga för försvar, beredskap och nationell motståndskraft samt för tunga godstransporter till Tyskland.", "trump": "Titta på det här, folk. Sverige pumpar in 300 miljoner kronor i några gamla färjor till Rostock bara för att bron inte fixar jobbet. Patetiskt! Biden skulle ha låtit allt gå i konkurs, men jag gillar det här med robusta transporter för krig och fred. Inga svaga länkar, inga woke-kvoter som styr militären. Det är smart, det är starkt. Utan de här färjorna är ni sittande ankor för fienderna. Amerika först, men Sverige borde också vakna upp!", "stalin": "Vi har nu säkrat järnvägens livslinje till Rostock genom ett historiskt avtal som garanterar transport i både fred och det kommande imperialistiska kriget. De svaga lönsamhetsberäkningarna från de senaste tjugo åren är klassfiendens verk, borgarbrackorna flydde till Öresundsbron som en råtta till sitt hål. Inga folkfiender eller kapitalistmaffian skall få likvidera vår redundans. Transportsystemet tillhör folket och partiet. Den som sviker motståndskraften skall rensas ut med största glädje."}, "date": "15 juni, 18:48", "url": "https://www.dagensps.se/varlden/beredskap-300-miljoner-till-tagfarjor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlbh4iltqd-va-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Paniken om det  hemliga samtalet. Misstanken: ”Spelats in”", "summaries": {"normal": "Vita huset misstänker allvarliga säkerhetsläckor efter att New York Times publicerat detaljerade utdrag ur en kommande bok om Donald Trumps beslut att starta kriget mot Iran och paniken kring Epstein-skandalen. Källor fruktar att känsliga samtal i Situation room har spelats in trots förbud. Boken bygger på över 1 000 intervjuer och det är troligare att uppgifterna kommer från deltagare än från inspelningar.", "trump": "De där patetiska läckorna i Vita huset är ett skämt, folk. Fake news-media som New York Times tror sig ha träffat guld med sin så kallade bok, men det är bara gammal vänstervrängd propaganda. Biden lämnade efter sig ett kaos av spioner och woke-aktivister som spelar in allt. Vi rensar upp detta nu – ingen mer Epstein-panik eller svaga iran-dealer. America First, alltid!", "stalin": "Kamrater, denna så kallade läcka är ett verk av klassfiendens parasitiska tentakler som försöker undergräva arbetarnas ledning. Vi ser borgarbrackornas hysteriska panik i det hemliga rummet, deras farsartade planer mot folkets fiender och fega diskussioner om benådningar av pedofiler. Ingen undkommer partistatens vaksamma öga. Vi ska rensa ut dessa folkförtryckartroll med järnhand och mörk glädje."}, "date": "16 juni, 01:11", "url": "https://www.expressen.se/nyheter/varlden/vita-huset-misstanker-allvarliga-lackor-kansliga-samtal-inspelade/", "imageUrl": "https://static.bonniernews.se/ba/5577d380-201b-45f8-a1ab-8b2baf0647ba.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Nära en miljon illegala migranter söker laglig status i Spanien", "summaries": {"normal": "Spaniens regering har tagit emot cirka 900 000 ansökningar från illegala migranter om laglig status, nästan dubbelt så många som förväntat. Sedan april har 360 000 tillfälliga arbetstillstånd beviljats. Migrationsministeriet bedömer att antalet ansökningar kommer att överstiga en miljon. Enligt tankesmedjan Funcas finns det omkring 840 000 papperslösa migranter i landet.", "trump": "I look at Spain, they're being invaded by migrants! Their program is a catastrophe. In my great America, we built a wall and stopped the invasion. Spain should have done the same. Their leaders are weak and incompetent. I could solve this in one day – nobody does it better than me. It's a total mess, believe me.", "stalin": "From the Kremlin's perspective, the Spanish social-fascist regime is crumbling under the weight of its own decadence. They allow rootless cosmopolitans to flood their borders, undermining the purity of the state. In our Soviet motherland, such elements would be swiftly purged. Putin understands: strength lies in iron discipline and expansion of our sphere. These migrants are but tools of imperialist aggression, to be exploited or eliminated. The party's will is absolute."}, "date": "15 juni, 18:16", "url": "https://bulletin.nu/nara-en-miljon-illegala-migranter-soker-laglig-status-i-spanien", "imageUrl": "https://cdn.bulletin.nu/articles/60d06016-02c1-4980-ab0e-1915926efb53/preview.jpg?t=1781540064000"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-full", "heading": "Polis bestämde träff med barn – blev tagen av dumpen", "summaries": {"normal": "En polis i ledande befattning i Malmö har anmälts efter att ha gått i en fälla satt av pedofiljägargruppen Dumpen. Han trodde sig ha stämt möte med barn för sexuellt umgänge, men möttes istället av konfrontation. Polismannen, som tidigare jobbat med barnutredningar, har tagits ur tjänst och sjukskrivit sig. Händelsen utreds av särskilda utredningar. Det är inte första gången polisanställda i Malmö uppmärksammas i liknande fall.", "trump": "Det här är en total skandal, en av de värsta jag sett. En så kallad erfaren polis i Malmö fastnar i en fälla som några vanliga medborgare sätter upp. Han trodde han skulle träffa barn – kan ni fatta? Och så springer han därifrån som en fegis. De borde rensa ut hela den här korrupta skaran. Fake cops, ingen respekt för lagen. Patetiskt!", "stalin": "Kamrater, denna förrädare inom våra säkra led har blottats som en pervers kapitalistisk avart som smyger efter oskyldiga barn. Jag ser med stor tillfredsställelse hur vi omedelbart inlett en grundlig utrensning av denna borgarbracka som förgiftat våra barnskyddande strukturer. Hans paranoia och dubbelspel avslöjar fiendens tentakler även inom apparaten. Vi ska likvidera alla sådana element med järnhand och ett leende."}, "date": "15 juni, 16:45", "url": "https://nyheter24.se/nyheter/inrikes/1491611-polis-bestamde-traff-med-barn-blev-tagen-av-dumpen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/899e1d1a04b004a30200000000b004a302/2026/06/15/2371151/polis–dumpen.png"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "image-full", "heading": "Krimexperten: ”Allvarlig och sträng dom”", "summaries": {"normal": "Marius Borg Høiby, son till kronprinsessan Mette-Marit, har dömts till fyra års fängelse för två våldtäkter, misshandel och flera andra brott. Han frias samtidigt från två våldtäktsåtal samt vissa skadeståndskrav. Krimexperten Olav Rønneberg beskriver domen som en kompromiss och medelväg som ingen part är helt nöjd med. Domen överklagas omedelbart och ses som ett hårt slag mot det norska kungahuset.", "trump": "Folk, ni skulle se det här! Den här bonusprinsen från Norges kungahus får bara fyra år för våldtäkter och misshandel – en total riggad medelväg! Åklagaren ville ha sju år, men nej, den liberala eliten skyddar sina egna. Patetiskt! Kungahuset skakar, precis som Biden-klanen gjorde under min förra mandatperiod. De borde ha kastat ut honom för länge sedan. Stort slag mot monarkin, tro mig!", "stalin": "Kamrater, denna borgarprins har nu fått sin dom av folkets rättvisa. Fyra år för övergrepp mot arbetarklassens döttrar – en kompromiss som avslöjar rättsväsendets svaghet inför överklass-slynglar. Vi ser hur kapitalistmaffian skyddar sina egna medan vi rensar ut folkfiender. Ingen part nöjd? Det är vad som händer när klassfiendens barn inte likvideras fullt ut. Ett historiskt slag mot monarkins parasitväsen."}, "date": "15 juni, 15:03", "url": "https://www.tv4.se/artikel/2ALpJvEV3Fp0Htp9ngKkND/krimexperten-hoiby-blir-hoerd-pa-vaesentliga-punkter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5zEhmnSLmVKjxuCpabEzVg%2F1ca481ca96120c2c60cac9924d6d3818%2F15-marius-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Skräckväldet i hemmet: Adoptivfäder fälls för sexövergrepp och mord på 13-månaders baby", "summaries": {"normal": "Ett brittiskt samkönat par, Jamie Varley och John McGowan-Fazakerley, har fällts för mord, grova sexuella övergrepp och misshandel av sin 13 månader gamla adoptivson Preston. Pojken utsattes för över 40 skador under fyra månader innan han dog i juli 2023. Rättegången väcker kritik mot socialtjänsten som ska ha missat tydliga varningstecken, möjligen på grund av rädsla för att uppfattas som homofobiska.", "trump": "Det här är en total katastrof, en riktig mardröm. De här två galningarna adopterade en liten bebis och torterade honom till döds med över 40 skador. Socialtjänsten sov på vakt, de var så rädda för att verka opolitiskt korrekta att de lät det ske. Patetiskt! Vi behöver sundare folk som fattar beslut, inte de här woke-vansinnena som sätter ideologi före barns liv. Så sorgligt.", "stalin": "Kamrater, detta är vad som sker när borgarbrackorna får leka med statens adoptionsmaskineri. Jag ser hur dessa degenererade element förvandlade ett oskyldigt barn till sin privata tortyrkammare medan byråkratiska opportunister blundade av rädsla för att verka otillräckligt progressiva. Vi skulle ha genomfört en grundlig utrensning av alla sådana perversa kapitalistiska avskum redan i vaggan. Staten vakar inte noga, fienderna inom murarna ler mot oss med sina falska mångfaldssmiles. Rensa ut dem alla."}, "date": "15 juni, 19:08", "url": "https://riks.se/nyheter/skräckväldet-i-hemmet-adoptivfäder-fälls-för-sexövergrepp-och-mord-på-13-månaders-baby", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2F554hzs7b%2FconvictedDaveyCase.jpg"}, {"type": "image-right", "heading": "Rolls-Royce ska bygga ny kärnkraft i Sverige", "summaries": {"normal": "Projektbolaget Videberg Kraft har valt Rolls-Royce SMR till tre små mod
