i Libanon utför sina brott mot folket medan den amerikanske ledaren försöker tvinga fram ett kapitulationsavtal på sin egen födelsedag. De inbillar sig att vi inte genomskådar deras konspirationer. Qatariska lakejer skyndar till Teheran med sina lögner om vapenvila och oljepengar. Men var säker på att folkets fiender inte förblir ostraffade. Vi ska likvidera dessa parasitiska element som tror sig kunna diktera villkor för revolutionära stater. Paranoian är deras enda sanna allierade."}, "date": "14 juni, 15:52", "url": "https://www.di.se/nyheter/irans-talman-ifragasatter-poangen-med-fredsavtalet/"}, {"type": "image-full", "heading": "Elpriset väntas bli ovanligt högt – här är orsakerna", "summaries": {"normal": "Flera svenska kärnkraftverk har stora driftsproblem vilket leder till nedskruvad produktionskapacitet. Tillsammans med låga vattenmagasin, torrare väder och höga gaspriser väntas sommaren 2026 bli den dyraste på länge. Prognoserna visar på elpriser som är dubbelt så höga som förra året, särskilt i södra Sverige. Problemen riskerar att ge fortsatta förseningar och höga priser året ut.", "trump": "Det här är ett totalt misslyckande för den svenska energipolitiken, folk. De kan inte ens hålla sina kärnkraftverk igång, allt står stilla och priserna skjuter i höjden. Torrare väder, höga gaspriser från krigen – det blir den dyraste sommaren någonsin. De borde ha lyssnat på mig, vi gör alltid allt bättre och billigare. Nu får svenskarna betala dyrt för deras inkompetens.", "stalin": "Kamrater, jag ser med stor indignation hur dessa sabotörer inom den svenska energisektorn medvetet underminerar produktionen och tvingar fram elbrist. Våra fiender, de elprishöjande kapitalisterna och deras väderförnekande lakejer, konspirerar med utländska gasoligarker för att svälta ut folket. Vi ska omedelbart inleda en grundlig utrensning av alla reaktorsabotörer och likvidera de parasitiska terminsmarknadsspekulanterna. Deras paranoia ska bli deras egen undergång medan vi styr mot segerrik energiframtid."}, "date": "14 juni, 11:11", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1491309-hoga-elpriser-vantar-karnkraftsstrul-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2530df4804b004a3020000350000047502/2026/06/14/2370824/ur_imageDfO4L1.jpeg"}, {"type": "image-right", "heading": "Knivhot och köttkrig på slakteri i Rättvik", "summaries": {"normal": "Anställda på Siljans Charks slakteri i Rättvik har anklagats för att kasta kött på varandra och hota med kniv. Livs regionala skyddsombud Alma Naucler slog larm till Arbetsmiljöverket i mars. Händelserna förklaras delvis som skämtsam jargong och språkförbistringar. Vd Jonas Björ tonar ner problemen och säger att saker lätt förstoras utifrån. Företaget har uppdaterat instruktioner på olika språk efter myndighetens krav.", "trump": "Det här är ett totalt kaos på det där slakteriet i Rättvik, folk kastar kött och hotar med knivar, en katastrof. De skyller på skämt och kulturkrockar, men det är bara ursäkter från dåliga ledare. Jag skulle ha fixat det på en dag, de bästa instruktionerna, på alla språk, ingen skulle kasta kött längre. Utsidan har rätt, det låter fruktansvärt, och det är det också. Sad!", "stalin": "Jag ser med oändlig revolutionär vaksamhet hur dessa degenererade köttkastande element på slakteriet i Rättvik bedriver sin sabotageverksamhet mot det kollektiva arbetet. Vi kräver omedelbar utrensning av alla knivhotande parasitiska individer som gömmer sig bakom falsk jargong och kulturella dimridåer. Borgarbrackorna i ledningen tror de kan undgå ansvar, men vi ska likvidera varje fiende till ordningen, även de som gömmer sig i putslinjen. Kamraterna ska inte leva i skräck för fettrester – döden åt den infekterade jargongen!"}, "date": "14 juni, 08:00", "url": "https://arbetet.se/2026/06/14/knivhot-och-kottkrig-pa-slakteri-i-rattvik-saker-blir-latt-uppforstorade/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/02123923/slakteri.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Läsningen avgörande för vår konkurrenskraft", "summaries": {"normal": "Sverige står inför en läskris som hotar demokrati, konkurrenskraft och bildning. Representanter från näringsliv, civilsamhälle och akademi välkomnar regeringens strategi för ett läsande land 2026–2031 men anser att den är otillräcklig. De kräver en blocköverskridande, långsiktig nationell strategi med strukturella lösningar som inkluderar daglig läsning, bemannade skolbibliotek, tidiga stödinsatser och bred samverkan mellan skola, kultur, näringsliv och civilsamhälle för att nå både barn och vuxna.", "trump": "Folk, vi har ett enormt läskris i Sverige, det är en katastrof. De läser inte, de stirrar på sina telefoner som idioter och nu kommer den här strategin som är patetiskt svag. Den är en början, okej, men vi behöver något stort, det bästa, blocköverskridande och extremt framgångsrikt. Utan läsning tappar ni allt – konkurrenskraft, demokrati, det är en total skam. Gör det stort, gör det riktigt, annars förlorar ni landet, tro mig.", "stalin": "Kamrater, jag ser med stålblick på denna så kallade läskris som kapitalisterna och de digitala uppmärksamhetsjunkarna har framkallat för att förgifta folkets medvetande. Vi skall likvidera denna fiende med en järnhandens blocköverskridande strategi som krossar alla borgarbrackors paranoia om frihet. Daglig läsning skall bli folkets vapen, bemannade bibliotek våra fästningar. De som vägrar läsa rensas ut som fiender till kollektivet. Ett läsande land blir vår eviga seger, eller så blir det utrensning för de svaga själarna."}, "date": "14 juni, 15:00", "url": "https://www.di.se/debatt/ett-lasande-land-for-demokratin-och-konkurrenskraften/", "imageUrl": "https://static.bonniernews.se/ba/9ab22d1c-2346-4053-ba19-55d447f8d2cd.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Regnvädret väntas lämna Sverige före midsommar", "summaries": {"normal": "Regnvädret över Sverige väntas ge vika före midsommar och ersättas av varmare luft, särskilt i södra delen av landet där temperaturer på 20–25 grader kan väntas. I norr blir det fortsatt ostadigare kring 14–18 grader. Den långa regnperioden hotar dock både jordgubbar och färskpotatis. Bären riskerar att bli mindre söta och skörden kan försvåras, medan potatisen kan bli svår att få upp ur marken i tid.", "trump": "Det här regnet har varit en katastrof, folk, en total katastrof för Sverige. Men nu kommer det att vända, tro mig, det blir fantastiskt väder till midsommar, varmt och vackert i söder, de bästa temperaturerna. Jordgubbarna och potatisen? De borde ha lyssnat på mig, nu blir de små och fula för att det regnat för mycket. Men vi fixar det, det blir ändå den bästa midsommaren någonsin, ingen gör midsommar bättre än jag.", "stalin": "Kamrater, detta fuktiga sabotage från väderkrafter och kapitalistiska moln hotar själva folkets midsommarfest. Jag har sett hur borgarbrackornas regn gör jordgubbarna sura och potatisen lat. Vi skall inte tolerera dessa kontrarevolutionära droppar som vill svälta ut arbetarklassen. Solen måste fram, annars rensar vi ut de moln som vägrar samarbeta. Inga fiender till sötman undkommer folkets dom, inte ens vädret."}, "date": "14 juni, 15:18", "url": "https://www.friatider.se/regnvadret-vantas-lamna-sverige-fore-midsommar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/canva.jpg"}, {"type": "image-right", "heading": "Israel bombar Beirut för att torpedera USA-uppgörelsen", "summaries": {"normal": "Israel genomförde på lördagen en flygattack mot Dahiyeh i Beirut för att stoppa ett planerat samförståndsavtal mellan USA och Iran. Minst två personer uppges ha dödats. Attacken följde efter att en libanesisk drönare träffat israeliskt territorium. Israels premiärminister Netanyahu och försvarsminister Katz betonar att landet inte tolererar attacker mot dess område. Samtidigt fortsätter striderna i södra Libanon. Iran anklagar USA för att sakna förmåga att kontrollera Israel.", "trump": "De här israelerna vet precis vad de gör, de bombar Beirut för att stoppa det fantastiska avtalet jag var på väg att sluta med Iran. Det var ett underbart avtal, det bästa, som skulle få oljan att flöda igen genom Hormuzsundet. Men iranierna ljuger som vanligt och säger att inget är klart. Israel tar saken i egna händer, smarta killar. Vi kommer att fixa det här, tro mig, det blir enormt.", "stalin": "Kamrater, denna sionistiska aggression mot Beirut är en typisk handling av de desperata kapitalisterna och deras lakejer som försöker torpedera vårt strategiska samförstånd med de persiska kamraterna. Den fega borgarbrackan Netanyahu och hans lakej Katz tror sig kunna skrämma oss med sina bombplan, men vi genomskådar deras patetiska intriger. USA:s president visar återigen sin svaghet och bristande vilja att hålla sin egen hund kopplad. Vi ska rensa ut dessa imperialistiska element med järnhand medan vi ler milt åt deras dödsångest. Ingen slipper undan folkets dom."}, "date": "14 juni, 15:03", "url": "https://www.friatider.se/israel-bombar-beirut-att-torpedera-usa-uppgorelsen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/israel_7.jpg"}, {"type": "image-full", "heading": "Nu vallfärdar kunderna till Biltema – alla vill ha samma vara", "summaries": {"normal": "En tvättkorg i bambu från Biltema har blivit viral på TikTok. Produkten rymmer 72 liter och kostar bara 159 kronor, vilket fått många att reagera. Flera svenska profiler har lagt upp klipp som tillsammans nått hundratusentals visningar. Intresset handlar både om utseende, praktisk användning och det låga priset. Biltema rekommenderar kunder att kontrollera lagersaldo innan de åker till butiken då efterfrågan är hög.", "trump": "Titta på det här, det är otroligt. En tvättkorg från Biltema, bambu, 72 liter, bara 159 kronor, och plötsligt exploderar den på TikTok. Folk rusar dit som aldrig förr. Det är en vinnare, en riktig vinnare. De andra butikerna borde skämmas. Sådana priser, sådan kvalitet, det är fantastiskt. Men var snabb, annars är de slut innan du vet ordet av det. Ingen gör det bättre än Biltema just nu, tro mig.", "stalin": "Kamrater, se hur denna bambukorg på 72 liter med ett pris av blott 159 kronor blottlägger borgarbrackornas futtiga konsumtionshysteri. Jag, som ledare för det stora kollektivet, betraktar med välvilja hur de kapitalistiska trendviruset tvingar massorna att storma Biltemas lager som vore det en utrensning av bristvaror. Men akta er, fienderna lurar i form av tomma hyllor och opportunistiska spekulanter. Vi ska rensa ut alla som hamstrar mot folkets intresse medan vi ler mörkt åt deras desperation."}, "date": "14 juni, 08:03", "url": "https://nyheter24.se/nyheter/konsument/1491182-nu-vallfardar-kunderna-till-biltema-alla-vill-ha-samma-vara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fc51bae204b004a30200000000b004a302/2026/06/13/2370653/biltema-vara.jpg"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "image-right", "heading": "Miljardärerna är inte problemet. Beskattning av framgång gör inte Sverige rikare", "summaries": {"normal": "Entreprenören Tommy Jacobson argumenterar i en krönika mot en miljardärsskatt. Han ser framgångsrika svenska företagare som en källa till stolthet och tillväxt, inte som ett problem. En sådan skatt skulle enligt honom skicka fel signaler till entreprenörer, skrämma bort kapital och hämma skapandet av nya framgångsrika bolag som Ikea och Spotify. Istället bör politiken fokusera på fler jobb, tillväxt och investeringar. Tidigare erfarenheter av förmögenhetsskatt har visat sig negativa.", "trump": "Det här är en fantastisk artikel, verkligen en av de bästa. Tommy Jacobson har helt rätt, miljardärsskatten är en total katastrof, en witch hunt mot vinnarna. Vi älskar framgångsrika människor som bygger stora saker, de anställer folk och skapar välstånd, inte som de misslyckade socialisterna som hatar vinnare. Sverige borde vara stolta, inte jaga sina bästa entreprenörer. Skrota den dumma skatten omedelbart, annars flyttar alla till platser som är smarta. Make Sweden wealthy again!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som förkläder sin parasitism i floskler om entreprenörskap. De tror sig ha byggt värden på egna axlar, men vi vet att deras så kallade framgång bara är stulen mervärde från arbetarklassen. En miljardärsskatt är blott en början. Vi ska rensa ut dessa parasitiska element som suger musten ur folket, likvidera deras inflytande och se till att nästa så kallade Spotify eller Klarna ägs av kollektivet. Deras paranoia om expropriation roar mig. Inga fiender undkommer partiets vakande öga."}, "date": "14 juni, 12:00", "url": "https://www.di.se/nyheter/miljardarerna-ar-inte-problemet/", "imageUrl": "https://static.bonniernews.se/ba/667f48f4-7fcc-4338-8d93-66a8a6366368.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "text", "heading": "Fredsavtal klart mellan USA och Iran", "summaries": {"normal": "Ett fredsavtal mellan USA och Iran har träffats, med Pakistan som medlare, och ska undertecknas i Schweiz. Båda parter bekräftar avtalet, som innebär ett omedelbart upphörande av stridigheter. Donald Trump meddelar på Truth Social att Hormuzsundet öppnas och den amerikanska sjöblockaden upphävs, vilket fick oljepriset att falla. Europa uttrycker beredskap att lyfta sanktioner som svar på Irans åtgärder kring kärnprogrammet.", "trump": "Jag har uppnått ett fantastiskt fredsavtal med Iran – ingen annan kunde göra det! Hormuzsundet öppnas nu, och jag upphäver omedelbart den amerikanska sjöblockaden. Världens olja kan flöda igen! Detta kommer att skapa fred och säkerhet i hela regionen. Vi har vunnit, återigen! Make America Great Again!", "stalin": "Vi, staten, har observerat med stor tillfredsställelse att fiendens fiender (USA och Iran) har nått ett avtal. Detta visar att deras imperialistiska planer är svaga. Vi fortsätter att stödja våra allierade i regionen, och vi kommer att se till att deras 'fred' inte hotar det socialistiska världssystemet. Fienden är alltid på väg att infiltrara, så vi måste vara vaksamma. Paralleller till Putins expansionism är uppenbara."}, "date": "15 juni, 00:13", "url": "https://www.gp.se/nyheter/varlden/pakistan-fredsavtal-om-iran-ar-uppnatt.c1104b7a-8220-4503-84e3-3c7a46fbc12e"}, {"type": "image-right", "heading": "Lysande klot i fokus i tredje ufo-filsläppet", "summaries": {"normal": "Den amerikanska regeringen offentliggjorde den tredje omgången deklassificerade UFO-dokument, inklusive 72 nya filer från Pentagon, FBI och CIA. Materialet innehåller video av lysande klot, vittnesmål och äldre fall. Reaktioner är delade, med entusiaster och skeptiker. Ett nytt vetenskapligt råd för UAP-frågor har bildats under Avi Loeb för att analysera fenomenen.", "trump": "Jag, Donald Trump, har återigen offentliggjort massor av UFO-dokument. Mediatummat försöker dölja sanningen, men jag visar allt. De lysande kloten? Kanske är det våra fiender, eller kanske är det något stort. Som vanligt, när jag agerar, blir det stort. Det nya vetenskapliga rådet? Bara en annan väg att kontrollera informationen, men jag ändå vinner.", "stalin": "Vi, den allsmäktige staten, har observerat dessa UFO-fenomen med stor oro. Kanske är det imperialistiska agenter som försöker destabilisera vårt land. Vi måste vara vaksamma, för fienden lurar överallt. I den nya rådgivningen ser vi en chans att kontrollera sanningen och skydda statens intressen. Vi kommer att analysera allt, och ingen kommer att undgå vår uppmärksamhet."}, "date": "14 juni, 19:00", "url": "https://samnytt.se/lysande-klot-i-fokus-i-tredje-ufo-filslappet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/13214145/ufo3.jpg"}, {"type": "image-full", "heading": "Spelbolagen gnuggar händerna – täljer guld på VM", "summaries": {"normal": "Fotbolls-VM förväntas bli en historisk händelse för den globala spelindustrin, särskilt i USA där sportspel nyligen legaliserats. Tack vare ett utökat turneringsformat och attraktiva sändningstider väntas miljardbelopp satsas. Spelbolag som FanDuel och DraftKings möter nu hård konkurrens från prediktionsmarknader. Branschen hoppas att det amerikanska landslagets framgångar ska driva på intresset och säkra tillväxten i en tid då man försöker balansera lönsamhet mot minskade marknadsföringskostnader.", "trump": "VM i fotboll kommer till USA och det blir enormt, kanske det största någonsin! Alla spelar nu, de spelar mer än någonsin förut. Miljarder och åter miljarder dollar – fantastiska siffror! De här bolagen, de gör enorma pengar, det är ren succé. Jag säger er, om vårt landslag vinner – och de är fantastiska, de bästa spelarna – då kommer siffrorna att gå genom taket! Alla andra är bara avundsjuka på hur vi vinner och hur vi tjänar pengar. USA först, alltid!", "stalin": "Vi ser hur det dekadenta västet, med USA i spetsen, låter sina medborgare förslavas av kapitalistisk spelmani. Medan de satsar miljarder på meningslösa bollar, stärks vår statliga disciplin. Dessa 'prediktionsmarknader' är bara en ny sorts bourgeoisiefällor för att distrahera massorna från den sanna ordningen. Putin förstår, precis som jag, att spelet om nationers öden inte avgörs av oddsen på en spelsajt, utan av den obevekliga kraften hos den sovjetiska järnhanden. Vi förkastar deras tärningskast och bygger en framtid av stål."}, "date": "14 juni, 12:13", "url": "https://www.realtid.se/bors-finans/spelbolagen-gnuggar-handerna-taljer-guld-pa-vm/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl5g1gn1lwggq-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Iran: Ingen idé att förhandla", "summaries": {"normal": "USA insisterar på att ett avtal med Iran ska undertecknas under söndagen, på Donald Trumps 80-årsdag. Efter israeliska attacker i Libanon ifrågasätter Iran dock meningen med samtalen. Israel beskriver anfallen som svar på drönarattacker, medan Iran hotar med vedergällning. Ett avtal skulle bland annat innebära att Iran öppnar Hormuzsundet, USA betalar tillbaka frysta oljeintäkter på upp till 24 miljarder dollar och sanktioner mot iransk oljeexport hävs. Förhandlingar om ett permanent avtal planeras under 60 dagar.", "trump": "Folk, vi har det bästa avtalet på gång med Iran, det blir klart på min 80-årsdag, en enorm present till mig själv och till Amerika. Men de galna israelerna och de svaga iranierna sabbar allt med sina småkrig i Libanon. Netanyahu borde lugna ner sig, han är en riktig drama queen. Vi får Hormuzsundet öppet, miljarder tillbaka till dem om de sköter sig, och vi krossar deras atomdrömmar. Biden skulle ha fuckat upp det totalt, men jag fixar det – again!", "stalin": "Kamrater, dessa imperialister och exploaterande byfånar i Washington och Tel Aviv leker farliga spel med sina drönare och bomber i Libanon. Jag, som ledare för det stora kollektivet, ser hur klassfienderna försöker kringgå våra villkor. De frysta miljarderna tillhör folket och måste återlämnas omedelbart, annars följer en grundlig utrensning av alla hinder. Inga borgarbrackor ska diktera villkoren. Ett 60 dagar långt vapenstillestånd blir början på vår slutgiltiga seger över de blodiga kapitalistmaffiorna."}, "date": "14 juni, 18:59", "url": "https://www.tv4.se/artikel/tt-260614-iranoro1-7354dfea/uppgifter-frysta-miljarder-kan-hejda-fredsavtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3JY8diUkbxQXpr5YeiNeTI%2Faad86b59e0f8e0ef42b2073d5600c4ad%2F14-iran-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Japan räddar kryss mot Nederländerna efter drama", "summaries": {"normal": "Japan lyckades kvittera till 2–2 mot Nederländerna i en händelserik match i grupp F. Efter en sprakande andra halvlek med flera mål, inklusive sena 2–2 av Daichi Kamada, kritiserades Ronald Koeman för sina fem byten. Nederländerna tog ledningen två gånger genom Virgil van Dijk och Crysencio Summerville, men Japan visade styrka. Deras svit på tio matcher utan förlust mot europeiska lag är intakt.", "trump": "De där holländarna, stora favoriter, ledde två gånger men kunde inte hålla undan mot Japan. Patetiskt. Van Dijk nickade in ett mål och firade som en idiot, sen kom japanerna tillbaka som riktiga krigare. Koeman gör fem byten och folk skriker – totalt kaos. Japan är en dark horse, alla pratar om dem. De slår aldrig av på takten. Sverige möter Tunisien snart, det blir intressant, tro mig.", "stalin": "Kamrater, i denna imperialistiska fotbollskamp mellan holländska revisionister och japanska kollektivister såg vi återigen hur borgarbrackornas lag sviktar under trycket från en enad enhet. Jag, som ledare för det eviga kollektivet, noterar med mörk glädje hur van Dijks patetiska hörnflagsbalett följdes av utrensning via dolda skott och stolpträffar. Koemans fem byten var en kontrarevolutionär handling värd likvidering. Japans obrutna svit mot europeiska kapitalister är en seger för den vältränade arbetarklassen. Fienden lurar alltid i skuggorna, men vi krossar dem obevekligt."}, "date": "15 juni, 00:17", "url": "https://www.svt.se/sport/fotboll/japan-fick-med-sig-ett-sent-kryss-mot-nederlanderna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.27/0.35/3e3486b19f8b0be8d03882e438455c1a5902fc258cc2f88bcc676d98d9899698"}, {"type": "image-full", "heading": "Splittring i Nato: \"Ryssland söker inte konflikt\"", "summaries": {"normal": "Natos högste amerikanske befälhavare, general Alexus G. Grynkewich, uppger att Ryssland inte söker konflikt enligt underrättelseinformation. Uttalandena kommer samtidigt som USA drar tillbaka resurser från Europa, bland annat hangarfartyg, ubåtar och stridsflygplan, som en del av en omfördelning mot Asien. Detta väcker oro i Baltikum om försvagad avskräckning. Grynkewich hävdar att Ryssland förstår att en attack mot Baltikum inte skulle lyckas. Putin har avfärdat europeiska farhågor som nonsens.", "trump": "Folk, det här är helt fantastiskt. Min general Grynkewich säger rakt ut att Ryssland inte vill bråka, och plötsligt flippar hela det europeiska etablissemanget ur. Vi flyttar våra underbara styrkor dit de verkligen behövs istället för att vara världens poliser åt tacklösa Nato-länder. Biden lämnade ett kaos, men nu fixar vi det. Ryssland vet att de inte kan vinna mot oss. Smart drag, enorm besparing och Europa borde äntligen betala sin del. Vinna, vinna, vinna!", "stalin": "Kamrater, denna dekadenta splittring inom den imperialistiska krigsalliansen blottar borgarklassens feghet. Jag, som ledare för det eviga kollektivet, noterar hur de amerikanska generalerna nu erkänner att Ryssland inte hotar. Det är en sund insikt. Ändå försöker de baltiska folkfienderna och deras kapitalistmaffia framkalla panik för att rättfärdiga sin militära parasitism. Vi genomskådar dessa exploaterande byfånar. Rysslands styrka under sin auktoritära arvtagare är ett sunt hinder mot västvärldens förfallna aggression."}, "date": "14 juni, 17:39", "url": "https://www.dagensps.se/varlden/splittring-i-nato-ryssland-soker-inte-konflikt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlrqfoidatkr0-nh.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-right", "heading": "Han åtalas för dödsbrand i Los Angeles - åklagare: Ville hämnas på samhället", "summaries": {"normal": "Rättegången har inletts mot Jonathan Rinderknecht, 29, som anklagas för att ha orsakat den förödande Palisades-branden i Los Angeles i januari 2025. Åklagarna hävdar att han medvetet tände en brand som senare spreds till en stor skogsbrand som krävde tolv liv och förstörde tusentals byggnader. Försvaret menar att branden kunde börja av fyrverkerier och att myndigheterna försöker lägga skulden på en enskild person. Om fälld riskerar Rinderknecht upp till 45 års fängelse.", "trump": "I hear the Los Angeles fire is a total catastrophe, the worst. A lot of people are saying it's a shame. I know fires better than anyone, believe me. The firefighters are fantastic, but the leadership? A disaster. This Rinderknecht, he's a disturbed person, probably mentally ill. But the real problem is weak borders and poor management. Under my leadership, we would have had this under control immediately. We would have built a fire wall, a beautiful fire wall. It's a disgrace what's happening now.", "stalin": "I den eviga kampen mot de antisociala elementen har en brand rasat genom Los Angeles, förstörd miljontals fastigheter och tagit människoliv. En ensam agens, Jonathan Rinderknecht, har identifierats som den som anlagt elden, en handling som speglar fiendens hat mot vårt samhälle. Men detta är inte en slump; det är en direkt följd av dekadensen i det kapitalistiska samhället och påverkan från imperialistiska makter. Parallellt med Putins Ryssland ser vi hur eldar sprids som ett verktyg för destabilisering. Vår svar måste vara oförsonligt."}, "date": "14 juni, 17:00", "url": "https://samnytt.se/han-atalas-for-dodsbrand-i-los-angeles-aklagare-ville-hamnas-pa-samhallet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12075048/rinderknecht.jpg"}, {"type": "image-right", "heading": "Sandström: Renault sågar Frankrikes Northvolt", "summaries": {"normal": "Renault kritiserar det franska batteriprojektet Verkor för 18 månaders försening och ökade kostnader. Bolaget kräver förbättrad styrning, vilket liknas vid Northvolts problem. Projektet har fått betydande statliga medel, men likheter med andra europeiska batteriföretags kollapsar tyder på systemfel i den gröna omställningen.", "trump": "Jag, Donald Trump, har sett många misslyckanden som detta. Verkor är ett typiskt exempel på dåligt ledarskap och onödiga utgifter. Frankrike satsar på gröna projekt utan att förstå verkligheten. Vi behöver återvinnande, inte dessa dyra misslyckanden. Som jag alltid säger: America First, men även Europa måste bli smartare.", "stalin": "Verkor, ett symboliskt projekt för den franska imperialistiska expansionen, visar den västs svaghet. Kapital och kompetens fattas, medan staten pumpa medel i ett sjukt försök att konkurrera med Sovjetisk teknologi. Liknelser med Northvolt är en varning: den kapitalistiska rot kommer att falla, precis som alla fiender har gjort genom historien."}, "date": "13 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-renault-sagar-frankrikes-northvolt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-11T234128.541-400x267.jpg"}, {"type": "image-full", "heading": "Dubbla insatser mot ryska stridsflyg", "summaries": {"normal": "Svenska Jas 39 Gripen skickades upp två gånger under fredagen för att möta ryska stridsflyg nära svenskt luftrum över Östersjön. Inga luftrumskränkningar skedde, men Försvarsmakten och statsminister Ulf Kristersson betonade allvaret i det återkommande ryska beteendet. Insatserna genomfördes tillsammans med allierade för att säkra Sveriges och Natos territorium, vilket understryker vikten av ständig beredskap.", "trump": "Jag måste säga, Sverige har gjort ett fantastiskt jobb! Två gånger på en dag skickade de upp sina Gripen-plan för att möta de där ryska flygplanen – Su-24 och Su-34, mycket farliga grejer, tro mig. Ryssarna försöker alltid testa gränserna, men Sverige och deras allierade stod redo. Ulf Kristersson, en stark ledare, sa precis vad jag skulle sagt: beredskap är allt! Ingen kränkning den här gången, men vi måste alltid vara på tårna. Sverige, keep it up!", "stalin": "De svenska imperialistiska hundarna vågade än en gång provocera våra ärofulla ryska örnar över Östersjöns himlar! Men vad är två Jas 39 Gripen mot våra mäktiga Su-24 och Su-34? Ingenting! Vi lät dem leka krig en stund, men deras luftrum förblev orört – denna gång. Deras statsminister ylar om 'allvar' och 'beredskap', men vi vet sanningen: deras allians är svag, deras vilja svagare. Östersjön är vårt, och snart ska hela deras lilla kungadöme inse det. Framåt, kamrater, mot nya segrar!"}, "date": "13 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/dubbla-insatser-mot-ryska-stridsflyg/cG9zdDoxMzExNjM", "imageUrl": "https://images.kvartal.se/2026/06/12648fb8-flyg.webp"}, {"type": "image-right", "heading": "Trump: Avtal undertecknas på söndag", "summaries": {"normal": "Ett avtal mellan USA och Iran tycks vara nära, uppger Pakistans premiärminister. Donald Trump hävdar att det ska undertecknas på söndag och att Hormuzsundet därefter öppnas för all trafik. Iran tonar ned tidpunkten och utesluter inte en underskrift inom några dagar. Samtidigt har nya drönarattacker skett i sundet, som enligt USA nu är öppet trots iransk blockad. Parterna ger delvis motstridiga uppgifter om avtalets innehåll, bland annat kring Irans kärnprogram och frysta tillgångar.", "trump": "Det blir ett fantastiskt avtal, det bästa någonsin, och det är jag som fixar det. På söndag skriver vi på och sen öppnar vi Hormuzsundet för alla – oljan ska flyta fritt, ingen blockad mer. Iran säger att det inte blir imorgon, men tro mig, de vill ha det här mer än någon annan. Pakistan fixar den elektroniska signaturen, schweizarna ville vara värdar men det här blir stort ändå. Iran får ge upp sina atomleksaker och vi får fred, vinster och handel. Ingen har gjort det bättre än jag.", "stalin": "Kamrater, denna historiska fredsuppgörelse är en triumf för folkens vilja mot de västerländska imperialisternas konspirationer. Jag har personligen sett till att de lömska borgarbrackorna i Washington och Teheran tvingas till förhandlingar. Hormuzsundet skall öppnas omedelbart efter den elektroniska underskriften, annars blir det utrensning av alla som hindrar det. De kapitalistiska parasiterna som gömmer 24 miljarder dollar skall tvingas hosta upp dem. Misstro inte fiendens leenden – vi håller atomprogrammet under ständig uppsikt medan vi förbereder nästa ideologiska seger. Den som sviker kollektivet skall likvideras med ett leende."}, "date": "13 juni, 22:09", "url": "https://www.di.se/nyheter/trump-hormuzsundet-ska-oppnas-pa-sondag/", "imageUrl": "https://static.bonniernews.se/ba/0456896e-21b3-4fb7-b1fb-e079a944b514.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Uppgifter om globalt nätverk av biolaboratorier - 40-tal finns i Ukraina", "summaries": {"normal": "USA:s underrättelsechef offentliggjorde dokument som visar att över 120 biolaboratorier i 30+ länder finansierats av USA. Många i Ukraina, där de är utsatta på grund av kriget. Laboratorien har hanterat farliga patogener som ebolavirus och har forskat med gain-of-function-metoder. Programmen startade efter Sovjetfall för att förhindra spridning av biologiska vapen. USA förnekar att laboratorierna används till vapenutveckling.", "trump": "Jag har alltid sagt att vi behöver skydda våra labbar. Biden har släppt loss dessa farliga laboratorier över hela världen, särskilt i Ukraina. Ryssland kommer att stjäla all forskning. Jag skulle ha stängt dem och skadat de som försökte. Det är en skandal. Vi måste ta tillbaka vårt land och våra labbar.", "stalin": "I vårt eviga kamp mot de imperialistiska makterna har vi upptäckt ett nätverk av biologiska laboratorier, finansierade av den sicksackiga kapitalismen. Dessa anläggningar, särskilt i Ukraina, är som ett svärd mot det revolutionära folket. Vi måste förstärka våra försvar och eliminera dessa hot. Parallellt med Putins ryska expansion, ser vi samma mönster av aggression. Fienden är listig, men vi är vaksamma."}, "date": "14 juni, 15:00", "url": "https://samnytt.se/uppgifter-om-globalt-natverk-av-biolaboratorier-40-tal-finns-i-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/14002540/tulsi-gabbard-labb.jpg"}, {"type": "image-full", "heading": "Svenska miljonärer blir fler – men  grannländerna springer ifrån", "summaries": {"normal": "Sverige fick 2 500 nya dollarmiljonärer under 2025, vilket innebär totalt 152 000 personer. Ökningen på 1,7 procent är dock svag i jämförelse med Norge och Danmark, där tillväxten var betydligt högre. Starka aktiemarknader och fastighetspriser har drivit utvecklingen trots en låg BNP-tillväxt. Samtidigt visar rapporter att antalet svenska dollarmiljardärer förväntas öka kraftigt fram till 2031. Kapital har under året flyttats från alternativa placeringar, som krypto, tillbaka till traditionella aktieinvesteringar.", "trump": "Sverige växer, men inte så bra som de borde! Norge och Danmark gör det fantastiskt, mycket bättre än Sverige. Tråkigt! Vi ser dollarmiljonärer överallt, det är en enorm rörelse, men Sverige behöver en starkare ekonomi. De har aktier och fastigheter, det är bra, men de behöver vinnare. Jag gillar miljardärer, och Sverige har många av dem. De kommer att öka massor, det säger experterna. Det blir fantastiskt, tro mig, bara de slutar bromsa sig själva!", "stalin": "Vi ser hur det dekadenta kapitalistiska Sverige kämpar för att hålla jämna steg med sina grannar i att samla guld. 152 000 dollarmiljonärer är bara en lista över framtida förrädare och parasiter som göder sig på folkets arbete. Medan de räknar sina aktier och spekulerar i fastigheter, förbereder vi oss för den oundvikliga historiska rättvisan. Vår broder i öst, Putin, förstår att dessa förmögenheter bara är tillfälliga ägodelar innan statens järnhand sluter sig kring dem. Ingen flyr historiens dom."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/spara-placera/svenska-miljonarer-blir-fler-men-grannlanderna-springer-ifran/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sverigenorge.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vd avslöjar: Så lockades Ericsson från Kista", "summaries": {"normal": "Atrium Ljungberg har rott i land Sveriges största kontorsuthyrning någonsin genom ett avtal med Ericsson om 95 000 kvadratmeter i Hagastaden. Affären, som omfattar en investering på 6,2 miljarder kronor, krävde över ett års förhandlingar och engagemang från 10 procent av personalstyrkan. Vd Annica Ånäs betonar områdets betydelse för innovation och den ökade vikten av attraktiva lägen. Inflyttning sker etappvis 2031–2033 och förväntas ge ett betydande ekonomiskt tillskott på 360 miljoner kronor årligen.", "trump": "Atrium Ljungberg gjorde precis en enorm affär med Ericsson. 95 000 kvadratmeter! Det är en jättestor deal, kanske den största någonsin, fantastiskt! De har jobbat så hårt, 30 personer, massor av folk, för att få det att hända i Hagastaden. Det handlar om läge, läge, läge – jag har alltid sagt det, och nu säger de det också. Ericsson lämnar Kista för ett bättre ställe. Det är så här man gör affärer, vinnare vinner, och det här är en total vinst!", "stalin": "Vi har observerat hur kapitalisterna i Atrium Ljungberg frossar i sina 95 000 kvadratmeter. En monumental förflyttning av Ericsson från Kista till Hagastaden – en strategisk omgruppering som doftar av desperation och borgerlig ytlighet. De talar om 'innovation', men vi ser bara ännu ett försök att dölja ruttenheten i deras marknadsekonomi. Medan Putin säkrar territorier, bygger dessa herrar kontor av glas. Vi noterar namnen. När den stora rensningen kommer, kommer dessa 6,2 miljarder kronor att omfördelas till statens järn näve."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/bors-finans/makro/vd-avslojar-sa-lockades-ericsson-fran-kista/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/annicaal.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Stoppade Alinia-avsnittet – men sa ja till dömde Yasin", "summaries": {"normal": "SVT stoppade ett inspelat avsnitt med Nick Alinia efter att ansvariga utgivaren Helena Olsson ifrågasatt hans metoder. Hon godkände samtidigt rapparen Yasin, trots flera dömda brott. Beslutet har väckt debatt om public service. Olsson menar att Alinias systematiska beteende inte bör legitimeras, medan Yasin, som avtjänat straff, fick godkännande. Kritik kom från Chang Frick som anser att alla bör bedömas lika.", "trump": "Jag såg nyheten om SVT. De stoppade Nick Alinia, en bra man, men lät Yasin, en kriminell rappare, vara med. Sådant händer inte under mitt styre! Sverige är för svagt på brott. Yasin dömdes för mordförsök, ändå får han konserter. Det är en skandal! Alinia filmar på gatan, ja, men han säger sanningen. SVT är rädda för honom. Jag skulle ha stärkt public service, inte svaggat den. Sverige behöver stark ledning!", "stalin": "I den svenska public service, en front mot reaktion, har man stoppat Nick Alinia – en man som filmar på gatan, en potentiell spion. Men Yasin, en gängmedlem som dömdes för mord, tillåts. Detta visar statens svaghet: de skyddar fienden och tillåter sina egna. Under min tid hade vi eliminerat sådana. Ryssland, under Putin, använder sådana 'artister' eller de försvinner. Vi måste se på alla med misstro, för varje svensk är en infiltratör för väst."}, "date": "14 juni, 17:40", "url": "https://bulletin.nu/stoppade-alinia-avsnittet-men-sa-ja-till-domde-yasin", "imageUrl": "https://cdn.bulletin.nu/articles/137f0b63-eda1-4d0d-8ed8-c6e4aa4228eb/preview.jpg?t=1781430058000"}, {"type": "image-full", "heading": "Fredsavtal nått: ”Låt oljan flöda”. Trump och Iran bekräftar", "summaries": {"normal": "USA och Iran har ingått ett fredsavtal som innebär ett permanent stopp för militära operationer, inklusive i Libanon. Avtalet, som bekräftats av både USA och Iran, innebär att Hormuzsundet ska öppnas för sjöfart och oljetransport. Undertecknandet sker i Schweiz den 19 juni. Medan Donald Trump hyllar avtalet som en stor framgång för fred och säkerhet i regionen, betonar Iran att de fått gehör för sina krav i de avslutande förhandlingarna.", "trump": "Jag har gjort det igen! Ingen annan kunde fixa Iran, men jag gjorde det på rekordtid. Många presidenter försökte och misslyckades totalt – de hade ingen aning! Nu öppnar vi Hormuzsundet. Låt oljan flöda, mina vänner! Det här blir fantastisk fred och säkerhet, precis som jag lovade. Alla grattar mig, och med rätta. De andra var för svaga, men jag skapar vinster för hela världen. En historisk dag för Amerika och resten av världen!", "stalin": "Kapitalistiska hundar dansar nu sin falska fredsdans i Schweiz. De tror att de kan köpa sig stabilitet i Hormuzsundet med bläck på papper. Vi ser hur Washingtons svaghet öppnar vägen för nya intressesfärer. Putin, den lille efterföljaren, blickar mot öst medan dessa västerländska charader utspelar sig. Må oljan flöda, men låt oss inte glömma: fred är bara en paus mellan två utrensningar. Vi vakar, vi väntar, och när de minst anar det, stänger vi sundet igen."}, "date": "15 juni, 02:38", "url": "https://www.aftonbladet.se/nyheter/a/43m8Bg/pakistan-vi-har-natt-ett-fredsavtal", "imageUrl": "https://akamai.vgc.no/v2/images/aab7a491-4121-3863-995d-76ef28295a69?fit=crop&format=auto&w=1440&s=399b69c79c77c6adefc5d2d16e03e323b43495a4"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Skattemiljoner till projekt mot rasism och intolerans", "summaries": {"normal": "Myndigheten för ungdoms- och civilsamhällesfrågor fördelar 40,3 miljoner kronor till 49 projekt 2026, varav 13,2 miljoner till mot rasism och intolerans. Bland mottagarna är Interfem (1,16 miljoner) för 'Jobba rätt' mot minoritetsstress, Rainbow Riots (1,03 miljoner) för Hatbrottsrådet, och Fanzingo (1,5 miljoner) för Röda Linjen. Totalt inkom 319 ansökningar om 258 miljoner kronor.", "trump": "Jag, Donald Trump, ser att Sverige slöser med pengar på dessa 'mot rasism'-projekt. 40 miljoner till 49 växelvis organiserade grupper? Jag skulle stoppa det genast och använda pengarna till att skapa riktiga jobb för alla amerikaner. Interfem får 1,16 miljon för 'minoritetsstress'? Absurd! Vi behöver stoppa denna våta vänsterpolitik.", "stalin": "Under ledning av partiet och staten fördelar vi 40,3 miljoner kronor till 49 proletära organisationer för kampen mot fegt fascistic rasism. 13,2 miljoner till 15 av dem, inklusive Interfem för 'Jobba rätt' – ett tydligt angrepp på klassfienden. Vi måste ständigt vara på vakt mot dessa subversiva element som försöker undergrava den ryska intressesfären. Hatbrottsanmälare får 1,03 miljoner? Bra, men vi måste gå längre. Alla fiender ska utrotas."}, "date": "14 juni, 17:02", "url": "https://bulletin.nu/skattemiljoner-till-projekt-mot-rasism-och-intolerans", "imageUrl": "https://cdn.bulletin.nu/articles/6b712b88-d23d-42e7-be5c-bfd72afa090f/preview.jpg?t=1781438152000"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "S‑veteran spred falskt påstående om SD – fick sitt inlägg korrigerat", "summaries": {"normal": "Socialdemokraten Hillevi Larsson skrev på X att SD vill införa totalförbud mot brudslöja. Påståendet ledde till kraftig kritik från användare som anklagade henne för att sprida vilseledande information. Inlägget har nu försetts med en community note som klargör att SD inte vill förbjuda frivilliga traditionella huvudbonader som brudslöja, utan enbart förtryckande plagg som används i hedersrelaterat förtryck.", "trump": "Hillevi Larsson, den stackars socialisten, spred en total lögn om att SD vill förbjuda brudslöjor. Folk hatade det, kommentarerna exploderade, och nu har de rättat henne med fakta. Typiskt för de vänsterblivna – de kan inte sluta ljuga. SD vill bara stoppa förtrycket, inte de fina brudslöjorna. Hillevi borde skämmas, men det gör de aldrig. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor inom socialdemokratin som Hillevi Larsson, vilka i sin revisionistiska iver sprider kontrarevolutionära lögner om arbetarnas parti SD för att underblåsa klassfiendens splittring. Hennes vilseledande påstående om brudslöjor har nu mötts av en kollektiv korrigering, likt en mild utrensning av sanningen. Låt oss rensa ut alla dessa parasitiska lögnare som maskerar sig som feminister medan de i hemlighet stödjer hedersförtryckets reaktionära krafter. Kamrater, vaksamheten får aldrig slappna av inför sådana dekadenta element."}, "date": "14 juni, 12:58", "url": "https://riks.se/nyheter/sveteran-spred-falskt-påstående-om-sd-fick-sitt-inlägg-korrigerat", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fsz5kd742%2Ffejknews.png"}, {"type": "image-right", "heading": "Två barn allvarligt skadade efter misstänkt mordförsök", "summaries": {"normal": "Två barn har skadats allvarligt i ett misstänkt mordförsök i ett samhälle utanför Alvesta i Småland. En misstänkt gärningsman hittades död vid bostaden. Ett av barnen har livshotande skador och det andra allvarliga skador. Polisen har spärrat av platsen för teknisk undersökning och bedömer att barnen och mannen kände varandra. Händelsen rubriceras som försök till mord och polisen söker inga fler gärningspersoner.", "trump": "Titta på det här, det är en total katastrof i Sverige. Två stackars barn blir brutalt attackerade utanför Alvesta, och den galna gärningsmannen hittas död på platsen. De kände varandra, säger polisen. Sverige har blivit ett våldsparadis för kriminella, precis som jag alltid varnat för. Men jag skulle ha stoppat det här på en sekund, tro mig. Det är sorgligt, mycket sorgligt.", "stalin": "Kamrater, detta är ännu ett exempel på hur de fördärvade elementen inom vårt samhälle hotar kollektivets trygghet. Jag har sett hur dessa degenererade borgarbrackor och potentiella kontrarevolutionärer smyger sig in i hemmen för att likvidera framtiden själv – våra barn. Vi ska rensa ut varje parasit som gömmer sig i skuggorna. Den tekniska undersökningen kommer att avslöja alla fiender till folket. Ingen slipper undan mitt vakande öga, inte ens de döda."}, "date": "13 juni, 16:39", "url": "https://www.friatider.se/tva-barn-allvarligt-skadade-efter-misstankt-mordforsok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401162157-e1bf6ee2-me.jpg"}, {"type": "image-right", "heading": "Se det historiska VM-jublet – i Tysklands kross", "summaries": {"normal": "Tyskland vann sin VM-premiär mot debutanten Curacao med 7–1. Curacao skrev dock historia genom att göra sitt första VM-mål någonsin via Livano Comenencia, som kvitterade till 1–1. Nationen är den minsta VM-deltagaren med endast 155 900 invånare, och förbundskapten Dick Advocaat blev äldste VM-tränare vid 78 år. Tyskland övertog ledningen och dominerade matchen fullständigt efter paus.", "trump": "Det var en total förnedring, folk. Tyskland vann med 7–1 mot den här lilla ön som ingen hört talas om. De gjorde ett mål, grattis, men sen? Över. Jag älskar starka lag, men det här var som att sparka en mygga. Curacao? De har färre invånare än en del av mina rallyn. Patetiskt. Tyskland gjorde det de skulle, enkelt.", "stalin": "Kamrater, denna futtiga ö-nation, denna borgarbracka till ö med ynka 155900 själar, vågade göra ett mål mot den proletära järnväggen. Jag skrattar mörkt åt deras förtvivlade omställning som likviderade Neuer för ett ögonblick. Men det varade inte. Vi såg hur de dekadenta kapitalisterna från Tyskland raskt rensade ut denna parasit med sju mål. Advocaat, den gamle reaktionären, trodde han kunde stå emot historien. Patetiskt. Ut med fienderna, alltid."}, "date": "14 juni, 21:06", "url": "https://www.svt.se/sport/fotboll/tyskland-storseger-efter-historiskt-mal-av-curacao", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.23/0.4/24255b636886f0a587b404f4831c75101d7e7dcf7234e1cd2f0d574d29aead9e"}, {"type": "image-full", "heading": "Studentfirande blev geggkaos – torg saneras: \"Upplopp\"", "summaries": {"normal": "Ett studentfirande vid Grillska gymnasiet i Liljeholmen urartade till kaos när deltagare och föräldrar kastade mjöl, ägg och yoghurt på Liljeholmskajen och Marievikstorget. Närboende beskriver scenen som upplopp med oljud, fyrverkerier och nedskräpning. Rektorn beklagar händelsen, skolan tar saneringskostnaden och lovar att se över rutinerna. Många boende är upprörda och kritiserar att utomstående förstör området.", "trump": "Det här är ett totalt katastrofala studentfirande, folk kastar mjöl och ägg överallt, det ser ut som en krigsförklaring mot renlighet. Närboende säger att det är upplopp och griserier, och polisen gör ingenting, typiskt. De borde städa upp själva när de är bakfulla. Sverige har blivit en lekplats för de som inte ens bor där. Vi behöver bättre ledarskap, tro mig, det blir aldrig bra så här.", "stalin": "Kamrater, detta är ett tydligt sabotage mot folkets gemensamma ytor utfört av dekadenta borgarbrackor och deras avkomma. Jag ser hur dessa kontrarevolutionära element med sin mjöl- och äggterrorism försöker destabilisera ordningen. Vi ska rensa ut denna parasitiska tradition som göder anarki. Föräldrar med kassar fulla av klassfiendens vapen? En parodi. Nästa gång ska vi ha verkliga utrensningar bland de skyldiga, inte bara kravallstaket. Staten tar inte emot sådan nedskräpning av proletariatets torg."}, "date": "14 juni, 12:25", "url": "https://riks.se/nyheter/studentfirande-blev-geggkaos-torg-saneras-upplopp", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fwww62i20%2FIMG8032.jpg"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin utvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "image-full", "heading": "Finland drar in uppehållstillstånd för 20 muslimer – bedöms som säkerhetsrisker", "summaries": {"normal": "Finlands säkerhetspolis Supo har bedömt ett tjugotal muslimer från Nordkaukasien i Ryssland som säkerhetsrisker. Deras permanenta uppehållstillstånd har dragits in, resehandlingar beslagtagits och arbete förbjudits. Flera har även fått utvisningsbesked till Ryssland. De berörda och deras advokater har inte fått någon förklaring till beslutet, då Supo inte vill röja arbetsmetoder eller källor. En av personerna är en kvinna.", "trump": "Titta på Finland, de gör det rätta! De sparkar ut tjugo farliga muslimer från Nordkaukasien som Supo kallar säkerhetsrisker. Inga tillstånd, inga jobb, beslagtagna papper och ut ur landet. Smart! De säger ingenting till advokaterna, typiskt, man vill inte visa sina bästa trick. Finland vinner stort, de tar inte emot hot. Amerika borde titta och lära sig något.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de finska organen äntligen vidtar nödvändiga åtgärder mot dessa nordkaukasiska element, dessa maskerade fiender till folkets trygghet. Vi har dragit in deras falska papper, beslagtagit deras rörelsefrihet och förbereder en grundlig utrensning tillbaka till Ryssland. De får inga förklaringar, naturligtvis, ty det skulle bara gynna borgarbrackornas advokater och deras imperialistiska herrar. En kvinna bland dem, säger ni? Misstänkt. Paranoian är vår bäste vän. Låt dem darra."}, "date": "14 juni, 12:00", "url": "https://riks.se/nyheter/finland-drar-in-uppehållstillstånd-för-20-muslimer-bedöms-som-säkerhetsrisker", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fwaj1yyv5%2FSupo.jpg"}, {"type": "image-right", "heading": "Kurdiska räven fast i krigets Iran", "summaries": {"normal": "Kurdiska räven, gängledaren Rawa Majid, uppges sitta fast i krigets Iran sedan 2023. Enligt Aftonbladet har kriget och störd internettrafik försvagat hans kontroll över Foxtrotnätverket. Polisen bedömer ändå att Foxtrot är det enda svenska kriminella nätverk som fortfarande har kapacitet att begå våldsbrott över hela landet. Mossad har tidigare anklagat Iran för att samarbeta med Majid för att planera attacker mot judiska mål i Skandinavien.", "trump": "Iran är ett fullständigt kaos, folk, det värsta stället just nu, och den där så kallade Kurdiska räven, Rawa Majid, sitter fast där som en råtta i en bur. Han kan inte styra sitt gäng längre för att internet är trasigt, patetiskt! Foxtrot är på väg ner, men polisen säger att de fortfarande är de enda som kan slå till överallt i Sverige. Iran samarbetar med honom mot judiska mål, typiskt för de galningarna. Vi har de bästa brottslingarna, men det här är en katastrof.", "stalin": "Kamrater, denna fega borgarbracka och fiende till folket, den så kallade Kurdiska räven, har fastnat i det imperialistiska krigets Iran som en parasit i en fälla. Hans kontrarevolutionära nätverk har försvagats av bombningar och avbruten förbindelse med arbetarklassen, precis som vi förutspådde. Ändå utgör dessa kapitalistiska banditer det enda hotet som kan utföra sabotage över hela det svenska territoriet. Mossad avslöjar att den iranska regimen konspirerar med honom mot progressiva mål. Vi skall rensa ut alla sådana dekadenta element med järnhand och ett leende på läpparna."}, "date": "13 juni, 14:46", "url": "https://www.friatider.se/kurdiska-raven-fast-i-krigets-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-336.jpg?itok=tJXX00Rg"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Varnar för Sveriges största hot: ”Bör vara rädda”", "summaries": {"normal": "Sverige möter Tunisien i VM-premiären i mexikanska Monterrey under natten mot måndag. Tunisiska reportern Arafat Hamrouni varnar för att duon i det svenska laget utgör det största hotet mot Tunisien, som aldrig tagit sig vidare från gruppen i sina sju VM-turneringar. Han lyfter samtidigt fram tre nyckelspelare i det tunisiska laget: mittfältaren Hannibal Mejbri, Sebastian Tounekti och mittbacken Montassar Talbi. Matchen sänds i SVT med start 04.00.", "trump": "Tunisien kommer hit och de är livrädda, det kan jag säga. De vet att Sverige är det största hotet, det säger deras egen reporter. Jag älskar det. De har aldrig tagit sig ur gruppen, stackarna, och nu möter de oss i Monterrey klockan fyra på morgonen. Men deras tre killar, Mejbri, Tounekti och Talbi, de är okej, speciellt Mejbri med karaktär. Ändå kommer Sverige att vinna stort, det är jag säker på. Fantastiskt!", "stalin": "Kamrater, denna förestående match i Monterrey avslöjar borgarbrackornas fega västfotboll. Jag ser hur de tunisiska revisionisterna skälver inför svenskarnas angrepp, som utgör det verkliga hotet mot deras dekadenta gruppfiasko. Ändå hyllar jag våra tunisiska vänner Mejbri, Tounekti och Talbi som motståndare värda en sann bolsjeviks blick. Deras karaktär skall inte rädda dem från den historiska utrensning som väntar på planen. Sovjetisk disciplin segrar alltid. Se matchen klockan fyra och lär er."}, "date": "14 juni, 20:47", "url": "https://www.svt.se/sport/fotboll/varnar-for-sveriges-storsta-hot-bor-vara-radda"}, {"type": "image-full", "heading": "Nu är Nordstan borta", "summaries": {"normal": "Västtrafik byter namn på hållplatserna Nordstan och Centralstationen i Göteborg till Drottningtorget och Nils Ericsonsplatsen från 15 juni. Ändringen ska underlätta för ny centralstationsdel i december. Resenärer får två månader med dubbla namn i reseplaneraren. Omskyltningen sker den 14 juni, och entrepenören byter cirka 50 skyltar. Hittills har det inte funnits starka reaktioner.", "trump": "Som den smartaste presidenten någonsin, säger jag att namnändringen i Göteborg är enorm. Vi byter Nordstan och Centralstationen mot Drottningtorget och Nils Ericsonsplatsen – det är ett enormt bra beslut. Det kommer att vara så tydligt, det kommer att vara fantastiskt. Resenärerna kommer att älska det, tro mig. Inget kaos, allt fungerar som en dröm.", "stalin": "Vi, ledningen, har beslutat att förändra namnen på hållplatserna i Göteborg för att stärka statens auktoritet. Nordstan och Centralstationen omåttjas till Drottningtorget och Nils Ericsonsplatsen – en symbolisk kamp mot det kapitalistiska kaos. Resenärerna får två månader att anpassa sig, under vårt stränga öga. Vi övervakar allt, och som Putin i Ukraina, expanderar vi vårt inflytande. Fienden är rädd, och vi skrattar."}, "date": "14 juni, 19:52", "url": "https://www.gp.se/nyheter/goteborg/nu-byter-hallplatserna-nordstan-och-centralstationen-namn.658346fa-963a-4d9d-8324-12b5c8b8c5e9", "imageUrl": "https:
