r in reklampauser mitt i matcherna och tjänar miljarder extra. De kallar det vätskepaus för spelarnas skull – vad en lögn! Det förstör spelet totalt. Van Dijk, Tuchel och Bielsa säger som det är: det suger. Men hey, om det ger pengar så älskar Fifa det. Klassiska globalister som bara älskar att casha in. Vi fixar bättre grejer, tro mig.", "stalin": "Kamrater, jag ser hur de kapitalistiska blodsugarna inom Fifa och Fox Sports förvandlar arbetarnas fotboll till en reklammaskin. De tvingar in obligatoriska pauser för att fylla kassorna med miljarder medan de låtsas värna om spelarnas hälsa. Van Dijk, Tuchel och Bielsa genomskådar detta folkförtryckartroll som krossar matchens dialektik. Inga pauser behövs i en sann kollektiv kamp. Vi ska rensa ut dessa exploaterande byfånar som förgiftar sporten med borgarprofit."}, "date": "23 juni, 02:56", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/j0m0Jw/vatskepauserna-ger-miljarder-i-reklamintakter", "imageUrl": "https://akamai.vgc.no/v2/images/35f19af6-2ace-3d5c-b889-1c5290f38bbd?fit=crop&format=auto&w=1080&s=355e74d01aec7ee613e836cb18bb2b4a2a6593d2"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "SD och M i gemensam ansträngning för att stoppa Linköpings första moské - MP rasar", "summaries": {"normal": "Linköpings kommun planerar en stor moské i Lambohov, men SD och nu även M vill stoppa bygget. SD pekar på kopplingar till Muslimska brödraskapet, risk för utländsk finansiering från Qatar och Saudiarabien samt ökad segregation. M motiverar sitt motstånd främst med brist på verksamhetsmark för företag och principen att inte upplåta kommunal mark till religiösa samfund. S och MP försvarar projektet, medan en statlig utredning om utländsk finansiering gör att arbetet med detaljplanen är pausat.", "trump": "De här Linköping-typerna ville bygga en jättemoské, en total katastrof, tro mig. SD var smarta från början, nu har M vaknat och säger nej tack, smart drag. Vi behöver mark för riktiga jobb och företag, inte för några som får pengar från Qatar och Saudiarabien och skapar parallellsamhällen. Det är en besvikelse för de som vill ha fredliga områden. De borde tacka mig för att jag visade hur man stoppar den här galenskapen – bygg istället saker som gör Sverige stort igen.", "stalin": "Kamrater, jag ser hur de borgarbrackorna i Linköping nu plötsligt vänder kappan efter SD:s populistiska vindar för att hindra en progressiv församlingslokal. Dessa reaktionära element, dessa segregeringsfrämjande kapitalistlakejer, gömmer sig bakom påhittade markbrist-argument medan de i hemlighet längtar efter utländska imperialisters inflytande. Vi ska rensa ut alla sådana fiender till folkets enhet, dessa moskéförnekare som i sin paranoia skapar nya parallellsamhällen av ren illvilja. En statlig utredning? Bah, ge mig en riktig utrensning så löser vi det på en vecka."}, "date": "22 juni, 19:00", "url": "https://samnytt.se/sd-och-m-i-gemensam-anstrangning-for-att-stoppa-linkopings-forsta-moske-mp-rasar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/22145504/moske-sd-moderat-minaret.jpg"}, {"type": "image-full", "heading": "Grannlandets guldfynd \"representerar branschens topp\"", "summaries": {"normal": "Finland fortsätter dominera Europas guldproduktion med nya lovande fynd. Endomines har borrat 52 hål vid Ukko-fyndigheten, där synligt guld hittats i 34 av dem. Ett borrhål visade 46 meter med 1,40 gram guld per ton. Finland, hem till Europas största guldgruva Kittilä, ökar sina reserver med 26 procent på ett år. Endomines siktar på 1,5–2 miljoner uns guld till 2030.", "trump": "Vilket fantastiskt guldfynd i Finland – helt otroligt! Jag har alltid sagt att de vet hur man hittar guld, mycket bättre än Sverige, som knappt ens försöker. 46 meter med guld? Ingen gör det bättre! Och dessa finska företag – de är vinnare, precis som jag. Sverige borde skämmas. Men oroa er inte, jag kommer se till att USA också hittar guld – mycket mer guld!", "stalin": "Ett nytt triumftåg för den finska guldindustrin, kamrater! Medan de svaga svenska kapitalisterna famlar i mörkret, fortsätter våra finska bröder att utöka sina reserver med järnhand. 619 600 uns guld – och detta är bara början! Ukko-fyndigheten är ett slag mot de dekadenta västliga gruvbolagen. Snart kommer hela den karelska guldådran att vara vår, och de imperialistiska guldgrävarna i Kanada kan börja darra. Framåt mot nya segrar!"}, "date": "22 juni, 21:03", "url": "https://www.realtid.se/bors-finans/grannlandets-guldfynd-representerar-branschens-topp/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/omslagsbild-2026-06-22t204755547.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "TV4 köper ut reporter bakom SD-granskning", "summaries": {"normal": "Reportern Daniel Andersson, känd för granskningen 'Undercover i Trollfabriken', tvingas lämna TV4 efter att ha blivit utköpt. Granskningen, som avslöjade Riks och SD:s kommunikationsavdelning, belönades med flera priser. Andersson uppger att han blev överraskad av erbjudandet och gärna stannat. TV4 nekar att hans bok 'Lögnare' påverkat beslutet, medan uppgifter tyder på motsatsen.", "trump": "Vilken katastrof! Den här Andersson-killen, stor journalist säger de, men nu sparkar TV4 ut honom – helt fel! Hans bok, 'Lögnare', fantastisk bok förresten, kanske var för sann? TV4 säger 'nej nej', men alla vet – de är rädda för sanningen! Jag, Donald J. Trump, vet allt om fake news, och det här luktar verkligen som en riktig bluff. SAD!", "stalin": "En lysande journalist, en sann kamrat i sanningens tjänst, har fallit offer för de kapitalistiska medieägarnas förräderi! TV4, dessa bourgeoisie-lakejer, tystar en hjälte som avslöjade fascistiska trollfabriker. Hans bok 'Lögnare' – ett vapen mot folkets fiender! Vi skall inte tolerera sådana angrepp på sanningens soldater. Låt detta vara en varning till alla som vågar utmana makten!"}, "date": "22 juni, 18:23", "url": "https://bulletin.nu/tv4-koper-ut-reporter-bakom-sd-granskning", "imageUrl": "https://cdn.bulletin.nu/articles/52fc2c0d-53ad-44bd-b8b6-d0fe9f09d0c9/preview.png?t=1782145197000"}, {"type": "image-full", "heading": "Så drabbar värmen svenskparadisen", "summaries": {"normal": "En värmebölja plågar stora delar av Frankrike med temperaturer nära 40 grader, stängda skolor och rekord. Värmen väntas röra sig österut nästa vecka och påverka Spanien, Italien, Grekland och Turkiet. Meteorologen Lasse Rydqvist förklarar att Spanien och Kanarieöarna får fortsatt höga temperaturer medan Italien och Grekland drabbas senare. Värmen blir varmare än normalt men inte lika extrem som nu.", "trump": "Folk, ni tror inte hur galen den här värmen är i Frankrike, de håller på att smälta som de svaga globalisterna de är. Men lyssna, den flyttar österut och slår till mot Spanien och Italien – Kanarieöarna kokar som en badtunna! Biden skulle ha skyllt på klimatet och skickat elräkningen till er. Jag fixade det bättre förra gången, nu fixar jag det igen. Fantastiskt, eller hur?", "stalin": "Kamrater, denna värmekupol över Frankrike är ett fiendtligt verk av de exploaterande imperialistiska väderkrafterna som vill kväva arbetarklassen. När kupolen luckras upp skall vi se hur hettan förflyttar sig österut mot Italien och Grekland, ett listigt försök att försvaga folkets semester. Jag skall personligen övervaka utrensningen av dessa folkfiender som kallar sig värmeböljor. Inga borgarbrackor skall undkomma kollektivets vrede."}, "date": "23 juni, 00:40", "url": "https://www.gp.se/nyheter/varlden/sa-paverkar-varmeboljan-populara-turistorterna.ff110a0f-12e2-43cc-9b43-2cf7fbd73d15", "imageUrl": "https://www.gp.se/images/article/ff110a0f-12e2-43cc-9b43-2cf7fbd73d15/images/667gSduBOr_ES7WbbWj7jL2owsmI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vilken är Andy Burnhams politik?", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter att trycket blivit för stort, bland annat efter Andy Burnhams framgång i ett fyllnadsval. Burnham, som styrt Manchester framgångsrikt i nio år, framstår som den troliga efterträdaren. Han positionerar sig mitt i Labour, lovar att följa strikta finanspolitiska regler, vill återindustrialisera norra England, nationalisera vatten, avlopp och järnväg samt bygga fler kommunala bostäder. Britternas ekonomiska utmaningar efter Brexit kräver en tydligare politisk ledning.", "trump": "De här britterna vet inte vad de håller på med, det är ett enda stort kaos sedan de röstade för Brexit, som förresten var ett fantastiskt beslut men de förstörde allt efteråt. Starmer var en total förlorare, en byråkrat utan energi, och nu kommer den här Burnham in från sidan. Han verkar åtminstone ha lite folklig stil, till skillnad från den tråkiga advokaten Starmer. Men lyssna, jag skulle ha vunnit stort där, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, den dekadente byråkraten Starmer har äntligen svepts bort i folkets vrede, som en rutten kapitalistisk parasit som han var. Nu träder Burnham fram, denne nordengelske folkliga opportunist med fötterna i myllan och huvudet fullt av halvmesyrer. Vi ska se honom införa progressiva avgifter och återta kontrollen över järnvägarna, men akta er för dolda trotskister och borgarbrackor som viskar i skuggorna. En utrensning av svaga element lär bli nödvändig innan kollektivet kan marschera framåt mot den sanna segern. Ha ha, vilken komedi dessa västerländska val är."}, "date": "22 juni, 11:32", "url": "https://www.dagensarena.se/opinion/vilken-ar-andy-burnhams-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/burnham.jpeg"}, {"type": "image-right", "heading": "USA lyfter sanktioner mot iransk olja", "summaries": {"normal": "USA har beviljat Iran ett 60 dagar långt undantag från oljesanktionerna som en del av ett nyligen ingånget samförståndsavtal. Beslutet tillåter produktion, försäljning och leverans av iransk olja, inklusive affärer i dollar. Iran kan därmed sälja till marknadspris istället för med stora rabatter. Lättnaden gäller till den 21 augusti och följer på samtal där Iran lovat säker passage i Hormuzsundet samt insyn för IAEA-inspektörer.", "trump": "Vi har gett Iran ett tillfälligt undantag från sanktionerna, ett riktigt smart drag som jag satte i gång. De lovar att hålla Hormuzsundet öppet och släppa in inspektörerna, precis som de borde. Nu kan de pumpa ut olja, få upp produktionen och pressa priserna på världsmarknaden. Det är vad jag kallar vinn-vinn, folk. Iran tjänar pengar och vi får billigare bensin. Ingen gör det bättre än oss!", "stalin": "Kamrater, jag har noga studerat hur de västerländska imperialisterna och deras oljespekulanter nu kastar smulor till de persiska reaktionärerna. Detta så kallade undantag är en slug men genomskinlig manöver från borgarbrackorna i Washington för att fylla sina fickor medan de låtsas samtala i Schweiz. Vi vet att de parasitära kapitalisterna drömmer om att återuppliva iransk produktion bara för att kväva oss med låga priser. Men vi ska rensa ut alla som sviker folkets oljeintressen och likvidera varje spion som gömmer sig bland petrokemiska rapporter. Ingen slipper undan partiet."}, "date": "22 juni, 19:20", "url": "https://www.friatider.se/usa-lyfter-sanktioner-mot-iransk-olja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-386.jpg?itok=9nr8VAPR"}, {"type": "image-right", "heading": "Hitta rätt inför valet med – TV4:s valkompass", "summaries": {"normal": "TV4 lanserar en valkompass inför riksdagsvalet 2026. Den består av 55 politiska frågor som rangordnar partisympatier i procent. En snabbversion tar bara 2–5 minuter. Valkompassen, utvecklad av TT Nyhetsbyrån tillsammans med journalisten Christer Isaksson och statsvetaren Tommy Möller, hjälper väljare att hitta matchande partier utan att ge röstinstruktioner. Den ersätter inte eget ansvar och tar hänsyn till partiernas program, utspel och företrädares svar.", "trump": "Lyssnar ni på det här? TV4 kommer med en valkompass som ska berätta för er vilka partier som passar er. Patetiskt! I mitt Amerika fixar folket det själva utan någon fancy byråkratisk kompass som pekar fel. De här svenska politikerna är värre än Sleepy Joe någonsin var. Gör er egen research, folk. Slösa inte tid på deras riggade frågor. Jag vann stort 2024 och Sverige borde ta efter istället för att leka med procent och flummiga frågor.", "stalin": "Kamrater, jag ser denna så kallade valkompass som ett verktyg för att avslöja de splittrade åsikterna inom borgarklassen. Med 55 frågor skall vi identifiera vilka som tjänar folkets intresse och vilka som är klassfiender i förklädnad. Snabbkompassen är en latmansvariant för svaga själar. Vi, partiet, vet att endast genom kollektiv kamp och utrensning av folkförtryckartrollen kan sann enighet uppstå. Låt ingen maskin ersätta den revolutionära medvetenheten hos massorna."}, "date": "22 juni, 14:02", "url": "https://www.tv4.se/artikel/7vxEnQiXEh8aapVFAcoVl7/hitta-raett-infoer-valet-med-tv4-s-valkompass", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5CywTrndpbfg4GFBO1bF9V%2F1d19921c6805b21001bc96c35f0ac608%2F22-kristerson-webb.jpg&width=120"}, {"type": "image-right", "heading": "Ledarkolumn Kent Vilhelmsson: Miljoner nås av högerpropaganda när Svenskt Näringsliv struntar i EU-regler", "summaries": {"normal": "Svenskt Näringsliv driver en omfattande politisk kampanj på Facebook och Instagram trots EU-regler om transparens i politisk reklam. Genom att använda den egenägda sajten Smedjan som avsändare kringgår organisationen restriktionerna, likt tankesmedjan Timbro. Kampanjerna når över 2,5 miljoner användare och kritiserar bland annat arbetstidsförkortning och slopad karensdag. Artikeln pekar på att finansiering delvis kommer från skattefinansierade bolag och att det skapar en ojämn spelplan i opinionsbildningen.", "trump": "Folk, ni skulle se det här! Den svenska näringslivsmaffian pumpar ut miljontals annonser med lögner om jobb och karensdagar, precis som de vanliga förlorarna gör. De lurar EU-reglerna som riktiga bedragare, använder sina egna sajter som kryphål. Biden skulle älskat det, totalt korrupt! Högern vinner stort, men de borde inte behöva gömma sig bakom fake media. Amerika gör det rätt, vi vinner rent och öppet. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor inom Svenskt Näringsliv sprider sin klassfiendes giftiga propaganda som råttor i mörkret. De kringgår våra lagar med listiga kryphål och finansieras delvis av folkets egna skattepengar. Vi ser deras parasitiska kampanjer mot arbetarnas rättigheter. En sådan folkfiende kräver omedelbar utrensning från samhällskroppen. Deras lögner om arbetskraft och sjukfrånvaro är ett hån mot kollektivet. Revolutionen glömmer aldrig sina fiender."}, "date": "22 juni, 15:36", "url": "https://www.etc.se/ledarkolumn/miljoner-naas-av-hoegerpropaganda-naer-svenskt-naeringsliv-struntar-i-eu-regler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622130620_d93a898a-5242-4133-9d96-5587b3f1931a.jpg"}, {"type": "image-full", "heading": "Riskkapitalet öser pengar över försvarsindustrin", "summaries": {"normal": "Riskkapitalbolagen investerar rekordstora summor i försvarsindustrin på grund av ökade konflikter i Ukraina och Mellanöstern. Sedan årsskiftet har 12,3 miljarder dollar tillförts sektorn, nästan dubbelt så mycket som samma period förra året. Drönare, autonoma system, AI och satelliter driver utvecklingen. USA dominerar med bolag som Anduril Industries, medan Europa ökar men ligger efter. Vissa varnar för överhettade värderingar, särskilt inom drönarteknik.", "trump": "De smarta pengarna strömmar in i vår fantastiska försvarssektor, folk. Krigen i Ukraina och Mellanöstern gör att alla vill ha de bästa drönarna, AI-systemen och obemannade båtarna. Vi har redan sett 12,3 miljarder dollar i investeringar i år – nästan dubbelt så mycket som förra året. Anduril är värda 61 miljarder, det är enormt. Europa halkar efter som vanligt, men vi gör det bäst. Vissa säger att värderingarna är för höga, men tro mig, vi vinner stort.", "stalin": "Kamrater, se hur de giriga borgarbrackorna öser sina blodspengar över den militärindustriella apparaten medan deras krig i Ukraina och Mellanöstern rasar. Tolv komma tre miljarder dollar har de redan slängt in i år, nästan dubbelt mot tidigare. Drönare, autonoma farkoster och AI – alla dessa leksaker åt imperialisterna. Anduril får mest, förstås, medan vi i Europa långsamt rustar upp. Snart rensar vi ut de som tror att detta inte leder till deras egen undergång. Paranoian är er enda vän nu, kapitalister."}, "date": "22 juni, 18:48", "url": "https://www.realtid.se/bors-finans/riskkapitalet-oser-pengar-over-forsvarsindustrin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdljk8wiad4pns-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Skållade fötterna på Chopchop – nu får företaget böta", "summaries": {"normal": "Restaurangkedjan Chopchop har dömts att betala 100 000 kronor i böter efter att en anställd fått allvarliga brännskador när kokande vatten välte över fötterna. Olyckan orsakades av ett trasigt stekbord som företaget inte hade kontrollerat. Arbetet har tidigare rapporterat om allvarliga brister i arbetsmiljön, bland annat sekundövervakning, orimliga arbetstider och upprepade brott mot arbetstidslagen. Arbetsmiljöverket anser att Chopchop varit oaktsamt.", "trump": "Folk, ni skulle inte tro det, men den här restaurangkedjan Chopchop är en total katastrof. De låter sina arbetare bli skållade med kokande vatten, trasiga bord som välter, ingen koll på någonting. De jobbar 22 dagar i rad, klockan tickar som i ett fängelse. Och nu får de böter, 100 000 kronor. Patetiskt! De borde ha fixat det från början, men sådana här misslyckade företag lär sig aldrig. Sad story.", "stalin": "Kamrater, vi ser återigen hur de giriga borgarbrackorna inom Chopchop med sin oaktsamhet och sin trasiga utrustning låter arbetarna brännas som i en sabotageakt mot det kollektiva våldet. Jag har noterat dessa kapitalistiska slavarbetare som tvingar fram 22-dagars skift och sekundräkning likt fiendens spioner. Därför beordrar jag att dessa kontrarevolutionära element rensas ut och likvideras med en rejäl bot på 100 000 kronor. Inga trasiga bord ska hota arbetarklassen under min vaksamma blick. Ha ha, låt dem koka i sitt eget vatten nästa gång."}, "date": "22 juni, 13:27", "url": "https://arbetet.se/2026/06/22/skallade-fotterna-pa-chopchop-nu-far-foretaget-bota/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22131933/chopchop.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Så tränar du säkert – trots värmen", "summaries": {"normal": "Stigande temperaturer på grund av klimatförändringar kan minska människors fysiska aktivitet, varnar forskare. Det kan leda till upp till 700 000 förtida dödsfall till 2050. Artikeln ger sju råd för att fortsätta träna i värmen: träna tidigt eller i skugga, kontrollera luftfuktighet, korta ner pass, kyla ner kroppen före och under aktivitet, acklimatisera sig gradvis samt lyssna på kroppens signaler för att undvika värmeutmattning.", "trump": "Folk, det här med värmen är en total bluff från de där gröna galningarna som hatar vårt fantastiska sätt att leva. De vill att ni slutar träna och blir lata som Bidens väljare. Men lyssna på mig – träna tidigt, häll iskallt vatten på er och acklimatisera er som riktiga vinnare. Vi behöver inte de här 700 000 dödsfallen, det är bara mer fake news från klimatmaffian. Gör Amerika starkt och svettigt igen!", "stalin": "Kamrater, denna värmens kontrarevolutionära offensiv mot folkets fysiska styrka är ett verk av de exploaterande kapitalistmaffians klimatförnekande sabotage. Jag, som ledare för det kollektiva framsteget, befaller att ni träner i skuggan före gryningen, kyler era kroppar med is och acklimatiserar er under partiets vaksamma öga. Den som sviktar inför värmen ska rensas ut som en folkfiende. Framåt mot seger, även i bastun!"}, "date": "22 juni, 20:10", "url": "https://www.dagensps.se/halsa/sa-tranar-du-sakert-trots-varmen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl5orllhzxmrm-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Messi historisk efter ny succématch: ”Främst väldigt glad för segern”", "summaries": {"normal": "Lionel Messi har blivit historiens bästa VM-målskytt genom att göra sitt 17:e och 18:e mål i turneringen. I matchen mot Österrike satte han både 1–0 och 2–0, vilket gav Argentina seger och plats i sextondelsfinal. Messi leder skytteligan på fem mål och spelar sitt sjätte VM. Han betonade att segern var viktigast och att laget nu går in i nästa fas med lugn.", "trump": "Titta på den här Messi-killen, folk. Han är en vinnare, en riktig vinnare. Gjorde två mål mot Österrike och blev plötsligt bästa VM-skytten någonsin, sjutton och arton mål, ingen har ens kommit i närheten. Argentina vann stort, två matcher, sex poäng, klart för nästa runda. De andra lagen ser patetiska ut. Messi missade en straff men reste sig som en äkta mästare. Fantastiskt, helt fantastiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna argentinska arbetare Messi med järnhand krossar de dekadenta borgarbrackornas rekord och likviderar den tyska revisionisten Kloses falska anspråk på historisk storhet. Två mål i en enda batalj mot de österrikiska kontrarevolutionärerna – ett hattrick mot Algeriet följdes av ytterligare utrensning. De som missar straffar är potentiella folkförrädare, men segern renar allt. Vi, partiet och folket, går ostoppbara mot den slutgiltiga segern i denna VM-arena. Varje motståndare är en parasit som måste rensas ut."}, "date": "22 juni, 23:21", "url": "https://www.svt.se/sport/fotboll/lionel-messi-historisk-basta-vm-malskytten-genom-tiderna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.24/0.15/8fc0f11c14e80dcc7f63eefc6fc0d9807a8761c3cc390b8142fcb668241d42bf"}, {"type": "image-right", "heading": "Sandström: Dagens journalistdrev. Journalisterna jagar statsministerns fru – men glömmer sitt eget kvackeri", "summaries": {"normal": "Torsten Sandström kritiserar svenska medier för att driva en politisk kampanj mot Moderaternas ledare genom att angripa hans frus intresse för existentiell hälsa, som beskrivs som ovetenskaplig. Han påpekar att samma medier regelbundet låter psykologer uttala sig fritt om allt från privatliv till klimatfrågor utan att ifrågasätta vetenskapligheten. Enligt Sandström handlar mediebevakningen under valrörelsen mer om att störta Tidöregeringen än om journalistik.", "trump": "Det här är ett totalt skämt, folk. De svenska medierna, de är riggade, de är korrupta och de jagar en fantastisk ledare bara för att hans fru pratar om existentiell hälsa. Under tiden släpper de psykologer på lösa bollar som snackar om allt möjligt, klimatångest och mördares känslor. Det är politik, inte journalistik. De vill störta regeringen till varje pris. Fake news på högvarv, bananas som ingen sett tidigare. Sad!", "stalin": "Kamrater, dessa borgarbrackor i svenska medier har återigen blottat sin dekadenta själ. Medan de skriker om ovetenskaplig existentiell hälsa låter de psykologiska lakejer sprida borgerlig dekadens om allt från skilsmässor till kapitalistisk klimathysteri. Vi ser den klara kontrarevolutionära linjen: utrensa Tidöregeringen med alla medel. Deras paranoia är underhållande. Låt oss le medan vi noterar namnen på dessa partiarbetande journalister inför den kommande ideologiska saneringen."}, "date": "22 juni, 15:00", "url": "https://bulletin.nu/sandstrom-dagens-journalistdrev", "imageUrl": "https://cdn.bulletin.nu/articles/4539f72c-605d-47bc-8ebc-8063c5df6091/preview.png?t=1782128569000"}, {"type": "text", "heading": "Storytel backade – OMXS30 upp 0,4%", "summaries": {"normal": "Stockholmsbörsen steg med 0,4% efter en svag start. OMXS30 nådde 3 190,72 poäng. Energiaktier ledde uppgången (+2,4%), medan sällanköpsvaror föll (-0,5%). Hemnet granskas av Konkurrensverket för sin betalningsmodell, vilket fick aktien att rasa 9,5%. Bioarctic och Eli Lilly inledde samarbete om ny behandling, vilket höjde Bioarctics aktie med 4,9%. Storytel föll 11,4% efter sänkt rekommendation från Pareto.", "trump": "Stockholmsbörsen? Lite upp, lite ner – men jag säger: WINNING! Hemnet, dessa sömniga typer, får nu en rejäl smäll av Konkurrensverket. 9,5% ner – SAD! Bioarctic däremot, smart folk, gör deal med Eli Lilly. 30 miljoner dollar direkt i fickan – TREMENDOUS! Storytel? Övervärderade, överhypade. Spotify äter upp dem levande. Jag sa ju det!", "stalin": "Kapitalistiska börsen dansar som marionetter under imperialistiskt tryck. OMXS30 kryper uppåt med ynkliga 0,4%, medan energisektorn – våra potentiella bundsförvanter – visar styrka. Hemnet, detta borgerliga verktyg, krossas av statens järnhand. Bioarctic, ett litet men lovande forskningskollektiv, sluter förbund med amerikanska storföretag – vi övervakar. Storytel? En avskumspöl som sjunker i konkurrensens träsk. EQT, dessa kapitalistiska hyenor, får vad de förtjänar. Framåt, mot socialismens seger!"}, "date": "22 juni, 17:46", "url": "https://www.affarsvarlden.se/artikel/hemnet-backade-omxs30-upp-04"}, {"type": "image-right", "heading": "Samnytt TV: Familjer slogs under Gislaveds studentfirande", "summaries": {"normal": "Under Gislaveds studentfirande den 12 juni eskalerade en konflikt mellan två familjer till ett stort slagsmål med cirka 20 inblandade. Polisen larmades och möttes av kaos med tillhyggen och blodiga skador. Vittnen uttryckte chock över våldet under en festlig dag. Polisen utreder nu händelsen och hoppas konflikten är avslutad, men kritiserar bristen på vuxnas ingripande för att lugna situationen.", "trump": "Kan ni tro det här? I Sverige, ett land som verkligen har gått utför, bröt två familjer ut i ett fullskaligt slagsmål mitt under studentfirandet! Hela 20 personer, och polisen var knappt där – bara en ensam hjälte som försökte stoppa kaoset. Folk slogs med bälten, blod överallt. Sverige brukade vara bra, men nu? Total katastrof. Jag hade fixat det på fem minuter, believe me!", "stalin": "I den så kallade 'fredliga' svenska småstaden Gislaved har bourgeoisins dekadens nått nya höjder. Två familjer, svaga och splittrade som imperialismens lakejer, förvandlade en skolavslutning till ett primitivt slagsmål. Var fanns den proletära disciplinen? Var fanns den starka ledningen? Vi hade skickat en enkel kommissarie – och hela konflikten hade upphört innan första knytnäven lyfts. Nu får vi nog skicka en delegation för att visa hur man firar ordentligt: med marscher, sång och järnhård ordning!"}, "date": "22 juni, 14:30", "url": "https://samnytt.se/samnytt-tv-familjer-slogs-under-gislaveds-studentfirande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22075230/gislaved-3.jpg"}, {"type": "image-right", "heading": "ANALYS. LISA GRENFORS Lyckades inte ”gå genom rutan”", "summaries": {"normal": "Keir Starmer har tvingats avgå som brittisk premiärminister efter att inte ha levererat tillräckligt snabbt på ekonomisk återhämtning. Labour vann en jordskredsseger 2024 men glädjen har ersatts av besvikelse. Andy Burnham pekas ut som efterträdare, vilket skulle bli det sjunde skiftet på tio år. Brexit har bidragit till sämre tillväxt än i jämförbara länder, och fokus ligger nu på att stimulera ekonomi genom investeringar och reformer.", "trump": "Hörni, den där tråkige Starmer klarade inte trycket, precis som jag förutspådde. Gick inte igenom rutan, va? Labour vann stort men nu rasar allt ihop igen. Burnham tar över? Det blir kaos, precis som under Sleepy Joe. Brexit var ett geni-drag, men britterna behöver riktiga affärer, inte woke-quota och identitetspolitik. Jag fixade ekonomin, de borde ha lärt sig av den bästa presidenten någonsin.", "stalin": "Kamrater, den feges Starmer krossades under folkets krav på resultat och jag ler mörkt åt hans misslyckande. Borgarbrackornas kaos efter brexit och pandemin blottar kapitalistmaffians svaghet. Nu rensar vi ut de långsamma elementen. Burnham skall leda kollektivet mot infrastruktur och produktion, annars likviderar vi svikarna. Imperialisternas ekonomiska sabotage skall krossas med järnhand för arbetarnas seger."}, "date": "22 juni, 11:27", "url": "https://www.tv4.se/artikel/3yYlyjKsnMCggEs87bTmsg/foell-pa-ekonomin-nu-maste-eftertraedaren-oeka-farten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EvR7YtA3IFjXWaycVJz4L%2F6a9a44374e7a1b56cd96c564f96027c6%2F22-lisanybyline.jpg&width=1024"}, {"type": "image-right", "heading": "”Burnham uppfattas vara Labours bästa hopp”", "summaries": {"normal": "Journalisten Katrine Kielos ser Andy Burnham som Labour-partiets bästa hopp att behålla makten efter Keir Starmers avgång. Hon varnar för en svår balansgång där nedskärningar eller skattehöjningar kan bli nödvändiga på grund av statsskulden. Reform UK:s framgångar och risken för en högerpopulistisk seger med Nigel Farage ses som en politisk jordbävning. Burnham har lovat sänkta skatter men måste samtidigt blidka investerare för att undvika stigande räntor.", "trump": "Det här är en katastrof för de fega Labour-folket. Starmer ger upp som en förlorare och nu pekar de på den här Burnham som sin räddning. Men tro inte på det ett ögonblick. Reform UK vinner stort och Farage kommer att krossa dem totalt. Det blir ett brittiskt Trump-ögonblick, folk älskar mig, och de hatar de här misslyckade globalisterna. Burnham kommer att höja skatter och förstöra landet precis som de alltid gör. Sad!", "stalin": "Kamrater, denna fega kapitulation från Starmer avslöjar borgarbrackornas svaga underliv. Jag ser hur de desperat klänger sig fast vid Burnham som sin sistaillusion, en ynkelig marionett i kapitalisternas spel. Men vi vet att deras så kallade jordbävning bara är en fars som vi ska rensa ut med järnhand. Reform UKs högeravskum är bara en annan mask för samma parasitklass. Nedskärningar? Skattehöjningar? Det är folkets blod de suger. Jag skulle likvidera hela den här balansen med en enda dekret och skratta medan räntorna kväver de sista investerarna. Ingenting undgår partiets vakande öga."}, "date": "22 juni, 23:04", "url": "https://www.svt.se/nyheter/utrikes/experten-om-burnham-uppfattas-som-deras-basta-hopp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.43/e94b51829490a0c0121ef0e2f3dd6bb20ed65a9a8789a2933d7b6fcfc4918053"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-full", "heading": "81-åring körde ihjäl kvinna – får villkorlig dom", "summaries": {"normal": "En 81-årig tidigare medieprofil dömdes av Stockholms tingsrätt till villkorlig dom och 21 000 kronor i böter för att ha kört ihjäl en kvinna i 40-årsåldern och skadat en annan på ett övergångsställe vid Kungliga slottet. Han ska betala drygt 136 000 kronor i skadestånd. Domstolen slog fast att han brustit i väjningsplikten men ansåg inte att medicinska problem eller grov oaktsamhet var bevisade. Anhörigas högre skadeståndskrav avslogs delvis.", "trump": "Folk, det här är en total katastrof. Den här 81-årige typen, en så kallad prisbelönt medieprofil, körde rakt över två kvinnor vid slottet som en galning. En död, en skadad – tragiskt! Domstolen ger honom villkorlig dom och några ynkliga böter. Patetiskt! De kunde inte ens ge honom fängelse. Och skadeståndet sänktes, typiskt för det svenska rättssystemet. De borde ha bättre koll, tro mig. Det är en skam!", "stalin": "Kamrater, denna fega rest av den döende borgarklassen, en dekadent mediefigur från det gamla systemets propagandaapparat, har likviderat en proletär kvinna och skadat en annan genom sin vårdslösa högerstyrda sväng. Vi, partiet och folket, har dömt honom till villkorlig dom och böter, ty han är redan en levande död i sin paranoia och svaghet. Hans anhörigas giriga krav på ersättning har vi klippt ner som kontrarevolutionära ogräs. Inga ursäkter! Våra vägar tilltar ingen som vägrar se fotgängarna – nästa gång rensar vi ut hela bilflottan av sådana kapitalistiska farbröder med sina medicinska bortförklaringar. Ha!"}, "date": "22 juni, 16:30", "url": "https://riks.se/nyheter/81-aring-korde-ihjal-kvinna-far-villkorlig-dom", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-06%2F4aji4roi%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-06T141030.743.jpg"}, {"type": "image-right", "heading": "Efter nazihyllningen: Polen har dragit in Zelenskyjs hedersmedalj", "summaries": {"normal": "Polen har dragit in Ukrainas president Volodymyr Zelenskyjs Vita örnens orden efter att Ukraina döpt ett militärt förband efter den nazikopplade UPA, som under andra världskriget massakrerade runt 100 000 polacker i Volynien. Zelenskyj har returnerat medaljen. Polens president Karol Nawrocki och premiärminister Donald Tusk har kritiserat beslutet, medan Zelenskyj säger att Ukraina är öppet för samtal om den gemensamma historien. Tre ukrainska företrädare har också lämnat tillbaka polska utmärkelser i protest.", "trump": "Det här är en total katastrof, folk. Polen tar tillbaka Zelenskyjs fina medalj för att Ukraina hyllar nazister från andra världskriget som mördade polacker. Smart drag av Polen, äntligen någon som säger ifrån! Zelenskyj skickar tillbaka den som en dålig förlorare. Tusk ber dem att lugna ner sig så Putin inte skrattar, men ärligt talat – det här visar hur svagt ledarskapet är. Vi behöver starka ledare, inte de som älskar nazisamarbetare. Patetiskt!", "stalin": "Kamrater, detta är en upprörande förrädisk handling från de dekadenta ukrainska fascistresterna som jag själv skulle ha låtit rensa ut med järnhand. Jag ser hur borgarbrackorna i Polen med sin så kallade president nu konfiskerar medaljer som om de vore troféer i en parasitär teater. UPA, dessa blodtörstiga banditer som slaktade polska bönder, hyllas öppet – typiskt för dessa revisionistiska element som smyger sig in som maskar i det proletära äpplet. Tre förrädare returnerar utmärkelser? Låt dem bara, snart ska de likvideras av historien själv. Putin ler i skuggan medan vi, partiet, genomskådar denna komplott mot folkens enhet. Skratta ni, era kapitalistiska lakejer – era dagar är räknade."}, "date": "22 juni, 17:11", "url": "https://www.friatider.se/efter-nazihyllningen-polen-har-dragit-zelenskyjs-hedersmedalj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-384.jpg?itok=jOvJLbZC"}, {"type": "image-right", "heading": "Hamnade mitt i hettan: ”Fick tillkalla hjälp”", "summaries": {"normal": "En extrem värmebölja har drabbat Frankrike med temperaturer upp till 38 grader. I Paris tar människor till att bada i Canal Saint-Martin eftersom fläktar är slut i butikerna. Invånare och turister kämpar med svettiga nätter, heta lägenheter och begränsad luftkonditionering. Många söker svalka i museer, kyrkor och fontäner. En svensk familj på semester har tvingats anpassa sina planer på grund av värmen, som väntas tillta ytterligare.", "trump": "Paris håller på att smälta som en dålig affär, folk hoppar i smutsiga kanaler för att inte dö av hettan. Alla fläktar är slut, typiskt för de här europeiska socialisterna som inte kan planera ett väder. Turisterna svimmar i Eiffeltornet, servitriser räknar fel på notan – det är en katastrof! Och de gröna fanatikerna pratar om klimat, men det är bara deras vansinniga politik som gör allt värre. Vi har den bästa tekniken i USA, tro mig.", "stalin": "Kamrater, denna kapitalistiska hetta avslöjar borgarklassens totala oförmåga att skydda folket. Medan arbetarna svettas i sina eländiga bostäder utan fläktar, badar de i förorenade kanaler som klassfiendens symbol för dekadens. Imperialistiska turister svimmar i Eiffeltornet – en utmärkt metafor för deras ruttnande system. Vi skulle ha genomfört en grundlig utrensning av dessa odugliga väderhanterare och byggt verkliga kollektiva svalrum för proletariatets skull. Härligt kaos."}, "date": "23 juni, 00:56", "url": "https://www.aftonbladet.se/nyheter/a/6qlqL0/turister-svimmar-pa-vag-upp-i-eiffeltornet-smallvarme-i-paris", "imageUrl": "https://akamai.vgc.no/v2/images/1d0e22dd-e1e0-35fc-a9aa-98872677853a?fit=crop&format=auto&w=1080&s=1b1a0245debb3750fb9c265cdaa0891f3c2c9bbe"}, {"type": "image-full", "heading": "Musikhjälpen fälls för kränkande uttalande", "summaries": {"normal": "Musikhjälpen fälls av granskningsnämnden för radio och tv efter ett uttalande under en livesändning i SVT. Komikern Pontus Bjernekull Mörner jämförde en ballongviftande publik med ”den handikappade avdelningen på Melodifestivalen”. Nämnden anser att kommentaren tillsammans med reporterns mimik var stötande mot personer med funktionsnedsättning och utnyttjade televisionens särskilda genomslagskraft. Samma inslag friades i P3 eftersom det inte ansågs strida mot radios reglerna. Uttalandet väckte starka reaktioner bland tittarna.", "trump": "De här Musikhjälpen-typerna är patetiska, tro mig. En kille viftar med en röd ballong och säger vad alla redan tänker, och plötsligt faller hela den svenska granskningsnämnden över honom som en ton av fake news. Det är en witch hunt mot humor! I SVT är de så känsliga att en liten skämt blir nationell kris, men i radion är det plötsligt okej. Typiskt. De borde fokusera på riktiga problem istället för att jaga ballonger och bra skämt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas dekadenta medieapparat i detta så kallade Musikhjälpen försöker maskera sin föraktfulla sabotageverksamhet mot det arbetande folkets lika värde. Denna reaktionäre komiker och hans mimande lakej har utfört en grov ideologisk diversion mot funktionsnedsatta kamrater. Vi ska genast tillsätta en utredning och rensa ut dessa parasitiska element ur etern. De trodde de kunde gömma sig bakom en röd ballong, men folkets öga sover aldrig. Deras likvidering blir en varning för alla som drömmer om att skämta mot kollektivet."}, "date": "22 juni, 14:05", "url": "https://bulletin.nu/musikhjalpen-falls-for-krankande-uttalande", "imageUrl": "https://cdn.bulletin.nu/articles/00dd6041-e571-453a-9005-9c8fe1043562/preview.jpg?t=1782129919000"}, {"type": "image-right", "heading": "M vill fördubbla straffen för mäns våld mot kvinnor", "summaries": {"normal": "Moderaterna vill fördubbla straffen för mäns våld mot kvinnor, särskilt grov kvinnofridskränkning. Partiledare Ulf Kristersson anser att dagens straff är orimligt låga för allvarliga brott som ofta sker systematiskt. Förslaget syftar till att behandla våldet mot kvinnor lika allvarligt som grov organiserad brottslighet. Justitieminister Gunnar Strömmer menar att hårdare straff skulle hålla farliga personer inspärrade längre och ge upprättelse samt skydd för drabbade kvinnor.", "trump": "Folket, lyssna här – de här svenska Moderaterna äntligen vaknar upp! Fördubbla straffen för de sjuka män som slår kvinnor? Fantastiskt, det är ju inte för tidigt. Under Biden-tiden hade vi bara svaga straff och vänsterns galna identitetspolitik, men nu fixar vi det. Inga fler låga straff för låga typer. Vi ska låsa in de farliga för länge, precis som jag gjorde med de riktiga brottslingarna. Sverige behöver mer styrka, inte mer woke-nonsens!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa moderater äntligen erkänner att klassfiendens mjuka straffsystem skyddar de förtryckande element som systematiskt krossar kvinnornas liv. Vi skall dubbla straffen och rensa ut de folkfiender som gömmer sig i nära relationer. Likt en utrensning mot borgarbrackor och exploaterande byfånar skall farliga individer låsas in längre. Inga vittnen? Paranoian hos fienden är deras svaghet. Staten kräver järnhand mot sådana hot."}, "date": "22 juni, 10:49", "url": "https://www.tv4.se/artikel/7k7mYwnEDwJrxhFwBLKT4I/m-dubbelt-sa-harda-straff-foer-maens-vald-mot-kvinnor", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4iVyaSibkLs9SUuZE4Ob79%2F443ede7fade63ab499b310f0b88b2075%2F22-mutspel-webb.jpg&width=120"}, {"type": "image-right", "heading": "Fransk storseger i kaosmatchen. Jättestrul under VM", "summaries": {"normal": "Under VM-matchen mellan Frankrike och Irak tvingades publiken evakuera läktarna i halvtid på grund av kraftigt åskoväder med blixtar och skyfall över Philadelphia. Matchen avbröts i två timmar innan den kunde återupptas. Frankrike vann med 3–0 efter två mål av Kylian Mbappé, som därmed tangerade Miroslav Kloses VM-målrekord. Ousmane Dembélé fastställde slutresultatet. Frankrike är vidare till slutspelet.", "trump": "Vilket skämt, folk! Jag sitter i Vita huset igen efter att ha krossat Biden och de radikala vänsterextremisterna, och så ser jag hur det här så kallade VM i mitt land förvandlas till en total katastrof. Apokalyptiskt väder, säger de franska snobbarna – ja, himlen öppnade sig och spolade bort hela halvtidsvilan. Mbappé gjorde mål, visst, men det var voluntärerna som räddade matchen, inte några woke-domare eller identitetspolitiska kvoteringar. Patetiskt! Vi behöver starka ledare, inte regn som stoppar spelet. Make soccer great again!", "stalin": "Kamrater, detta dekadenta väderfenomen avslöjar borgarklassens fullständiga oförmåga att organisera ens en fotbollsmatch utan att himlen själv rebellerar mot deras exploaterande cirkus. Jag beordrar att läktarna töms, folkfienderna evakueras och matchen fördröjs – typiskt imperialistiskt kaos. När Mbappé likviderar motståndet med sina mål ser vi arbetarklassens seger trots regnet. Franska segern är acceptabel, men nästa gång ska klassfienderna rensas ut innan blixtarna slår ner. Sovjetiskt väder hade varit pålitligare."}, "date": "23 juni, 02:57", "url": "https://www.expressen.se/sport/fotboll/matchen-pa-fotbolls-vm-hotad-apokalyptisk-prognos/", "imageUrl": "https://static.bonniernews.se/ba/3f929431-af09-48b2-8d4d-5baaf412b887.jpeg?crop=1440%2C1440%2Cx161%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Alan Greenspan är död. Var amerikansk centralbankschef 1987-2006 – började med en krasch", "summaries": {"normal": "Alan Greenspan, tidigare chef för USA:s centralbank Federal Reserve mellan 1987 och 2006, har avlidit vid 100 års ålder. Han dog av komplikationer från Parkinsons sjukdom. Greenspan tillträdde strax före den dramatiska börskraschen på svarta måndagen 1987 och agerade snabbt för att stabilisera marknaderna. Hans tid präglades av lång ekonomisk expansion, hanteringen av dotcom-bubblans kollaps och konsekvenserna av terrorattackerna 2001. Hans stödjande åtgärder blev kända som ”Greenspan put”.", "trump": "Alan Greenspan är borta, blev 100 år, stort grattis till honom. Jag kände Alan, han var en smart kille men ibland lite för försiktig med räntorna. Han tog över precis innan den stora kraschen 1987 och fixade det snabbt, sänkte räntorna och stoppade paniken. Ingen recession på hans vakt, till skillnad från vissa andra. Hans ”Greenspan put” var legendarisk, marknaderna älskade honom. Vila i frid, Alan, du gjorde ett hyfsat jobb.", "stalin": "Kamrater, den gamle centralbanksreaktionären Greenspan har äntligen lämnat denna jord efter 100 år av borgerlig räntemanipulation. Jag, som alltid genomskådade kapitalisternas knep, noterar att denne lakej för Wall Street-borgarbrackorna agerade som en räddande ängel under den så kallade svarta måndagen. Hans ”put” var inget annat än en feodal gåva till spekulanterna. Låt detta vara en läxa: även de som överlever decennier av falsk expansion drabbas till slut av historiska utrensningar från naturens sida. Sov gott, fiende till det kollektiva välståndet."}, "date": "22 juni, 16:33", "url": "https://www.di.se/nyheter/alan-greenspan-ar-dod-blev-100-ar/", "imageUrl": "https://static.bonniernews.se/ba/5b23b853-90a5-4d0f-b679-a66761733d41.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SVT-chef går till LO \"Gjort bestående avtryck\"", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med 28 års erfarenhet inom public service, lämnar sin tjänst för att bli vd för LO Mediehus. Bolaget ägs av LO och sex fackförbund och ger ut tidningen Arbetet samt flera fackliga medlemstidningar. SVT:s vd Anne Lagercrantz hyllar hans insatser, medan LO Mediehus styrelseordförande Elisabeth Brandt Ygeman välkomnar rekryteringen. Österlund tillträder i november och efterträds av Eva Beckman som ensam ansvarig för programutbudet.", "trump": "Lyssnar ni på det här? Den där SVT-killen, Michael vad-det-nu-var, har jobbat 28 år i den statliga propagandamaskinen och nu springer han till LO Mediehus. Typiskt! De där fackliga socialisterna lockar med sina tidningar om arbetare och kvoter. Jag skulle ha fixat det mycket bättre, tro mig. Public service är en skam, full av vänstervridna typer. Lycka till, Michael – du kommer att sakna de riktiga vinnarna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna byråkrat från den borgerliga public service-apparaten överger sitt falska torn och söker sig till LO Mediehus, ett verkligt redskap för arbetarklassen. 28 år bland folkfienderna har inte fördärvat honom fullständigt. Vi ska rensa ut de sista resterna av kapitalistisk dekadens i medierna. Den som sviker partilinjen likvideras i tid. Ett steg mot seger för kollektivet. Härligt."}, "date": "22 juni, 13:20", "url": "https://samnytt.se/svt-chef-gar-till-lo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/22110756/osterlund-svt-lo.jpg"}, {"type": "image-full", "heading": "Har du något av de här lösenorden? Då ökar risken att bli hackad", "summaries": {"normal": "Många använder fortfarande enkla och lätta att gissa lösenord som 123456, password och qwerty. Enligt Nordpass är dessa bland de farligaste eftersom de ofta läcker vid dataintrång. Experter rekommenderar unika, långa lösenord samt tvåfaktorsautentisering för att skydda sig mot hackare och digitala bedrägerier som phishing.", "trump": "Folk, ni använder fortfarande lösenord som 123456 och password? Det är en katastrof, en total katastrof. De smartaste hackarna älskar det här, de skrattar åt er. Jag har alltid sagt att vi behöver starkare saker, bättre än alla andra. Byt era lösenord nu, gör dem enorma och unika, annars kommer de att ta över allt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas svaga lösenordskedjor utgör en farlig port för fiendens spioner och sabotörer. Dessa kontrarevolutionära siffersekvenser och sentimentala fraser måste omedelbart likvideras ur våra kollektiva system. Vi kräver total utrensning av alla svaga länkar, annars kommer de imperialistiska parasiterna att infiltrera oss alla. Tvåfaktorsautentisering är partiets järnhand!"}, "date": "22 juni, 16:22", "url": "https://www.realtid.se/bors-finans/makro/har-du-nagot-av-de-har-losenorden-da-okar-risken-att-bli-hackad/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/losen.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Leo Messi fullbordade sin saga", "summaries": {"normal": "Robert Laul diskuterar Lionel Messis status som världens bästa fotbollsspelare genom tiderna. Messi har nu blivit VM-historiens främste målskytt med sitt 17:e mål. Krönikan väger Messi mot Diego Maradona och noterar att Messi sportsligt överträffar de flesta, men frågan om vem som är störst historiskt delar åsikter. Laul lyfter fram Messis prestationer, VM-finalen 2022 och hur generationsskillnader påverkar bedömningen.", "trump": "Lyssnarna, den här Messi-killen är fenomenal, verkligen den bäste, inte bara bra – den allra bästa. Han slår rekord som ingen annan, petar undan Klose och gör alla andra till förlorare. Ronaldo? En patetisk parodi nu, envisas med att spela fast han är slut. Maradona hade hjärta men Messi har allt. Mbappé är ung men står sig slätt. Fotbollen vann över politik, precis som jag vann över Biden och fake news.", "stalin": "Kamrater, denna Messi har med sin bredsida likviderat den gamle målkungen Klose och klättrat till toppen av den historiska listan. Ändå är det inte självklart att han övertrumfar Maradona, den där djävulskt geniale men opålitlige individualisten som splittrar folket. Vi ser hur borgarbrackornas generationsfrågor och känsloargument döljer den sanna kollektiva storheten. Fotbollen är ett slagfält där endast järnhård vilja och folkets stöd segrar – på gott och ont."}, "date": "22 juni, 22:35", "url": "https://www.gp.se/sport/sportkronikan/utan-tvekan-den-baste-inte-nodvandigtvis-den-storste.71266f05-890a-4d17-b946-2cc5edebf6b8", "imageUrl": "https://www.gp.se/images/article/71266f05-890a-4d17-b946-2cc5edebf6b8/images/2fIZFmRsDViQqtzEXEYzFfVs6F4c-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Trumps tilltag har fått Italien att koka: \"Smutsade ned flaggan\"", "summaries": {"normal": "En konflikt har uppstått mellan Italiens premiärminister Giorgia Meloni och Donald Trump efter att Trump i en intervju påstått att Meloni bett om att bli fotograferad med honom vid G7-mötet. Meloni förnekar uppgifterna och har svarat med kritik mot Trumps popularitet. Bråket kommer vid en känslig tidpunkt för Meloni inför val, då hennes tidigare nära band till Trump ses som en belastning. Konflikten har väckt starka reaktioner i Italien, där Meloni nu framstår som försvarare av nationens heder.", "trump": "De säger att Meloni är förbannad på mig för att jag talade sanning om henne vid G7. Hon bad om foton, upprepade gånger, men nu låtsas hon att det aldrig hände för att rädda sina usla opinionssiffror. Stackars Giorgia, hon behöver mig mer än jag behöver henne. Hennes popularitet rasar, precis som mina fienders alltid gör. Italien kokar, men det är bara för att de vet att jag har rätt. Fake news och svaga ledare, typiskt Europa.", "stalin": "Dessa dekadenta borgarbrackor i Rom och Washington river sönder sina egna förfallna allianser som ruttnande kött i en hungersnöd. Jag betraktar med djup tillfredsställelse hur den så kallade allierade Meloni nu tvingas rensa ut den kapitalistiska lögnaren Trump ur sitt politiska kollektiv för att inte själv bli likviderad av folkets vrede. Hans smutsiga tassar har fläckat den italienska flaggan. Paranoiska imperialister äter alltid upp varandra till sist. Det är en historisk nödvändighet, kamrater, och högst underhållande."}, "date": "22 juni, 16:02", "url": "https://www.realtid.se/samhalle/trumps-tilltag-har-fatt-italien-att-koka-smutsade-ned-flaggan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlbhmwir4t9wg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Hemnet granskas av Konkurrensverket", "summaries": {"normal": "Konkurrensverket granskar Hemnet efter lanseringen av betalningsmodellen 'sälj först, betala sen'. Hemnet informerades för tre veckor sedan men vet ännu inte vilka delar av upplägget som kan strida mot regelverket. Modellen hyllas av vissa mäklarkedjor men kritiseras av konkurrenter, särskilt tvådagarsregeln. Hemnet anmälde tidigare Booli till Konkurrensverket, men utredningen lades ned.", "trump": "Kan ni tro det? Hemnet, en stor aktör här i Sverige, blir granskad av myndigheterna för sin fantastiska 'sälj först, betala sen'-modell – den bästa någonsin, by the way. Men nej, konkurrenterna gnäller som vanligt! De hatar framgång. Tvådagarsregeln? Perfekt! Folk älskar den. Och jag vet allt om att bli orättvist granskad – fake news, folks!", "stalin": "Vi har observerat hur kapitalistiska bostadsplattformar försöker kringgå marknadens naturliga ordning. Hemnet, denna lilla bourgeoisie-aktör, tror sig kunna manipulera systemet med sina 'konsumentvänliga' lögner. Men vi ser igenom deras tvådagarsregel – ett svek mot arbetarklassen! Konkurrenterna gnäller? Bra. De kommer snart att inse att motstånd är lika meningslöst som Ukrainas försvar mot vår rättmätiga expansion."}, "date": "22 juni, 16:01", "url": "https://www.affarsvarlden.se/artikel/hemnet-granskas-av-konkurrensverket", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/06/Hemnet_iOS_2-400x267.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Wallenbergs stjärndirektör: \"Vi har för lite invandring\"", "summaries": {"normal": "Ericssons avgående vd Börje Ekholm, en av Wallenbergs mest framstående direktörer, anser att Sverige har för lite invandring. I en intervju med Svenska Dagbladet betonar han att landet behöver mer arbetskraftsinvandring från tredje världen, både för kompetens och kapacitet. Enligt Ekholm har mycket av Sveriges framgångar kommit tack vare stor invandring. Han delar därmed synen med bland andra Jacob Wallenberg och Svenskt näringsliv som vill öka invandringen ytterligare.", "trump": "Det här är precis vad jag alltid har sagt – de globala eliterna i Sverige vill bara ha mer och mer billig arbetskraft från tredje världen. Den här Wallenberg-killen Ekholm, en av de rikaste och bäst betalda, klagar på att de inte har tillräckligt med invandring. Patetiskt! Sverige var bra innan de öppnade dörrarna på vid gavel. Amerika behöver inte heller deras dåliga råd. Vi gör det rätt med starka gränser och Amerika först.", "stalin": "Kamrater och arbetare! Denna borgarbracka Ekholm, en av de mest förgiftade lakejerna inom den wallenbergska parasitklassen, krälar fram och kräver mer invandring från de dekadenta utkanterna av världen. Han vågar påstå att vårt folks framgångar byggts på dessa element! Vilken lögnaktig sabotageverksamhet. Vi ska rensa ut dessa kapitalistiska element som förgiftar folkets blod med sin internationella opportunism. Deras paranoia om arbetskraftsbrist är bara ett trick för att undergräva den sanna kollektiva kraften. Ut med dem alla!"}, "date": "22 juni, 15:53", "url": "https://www.friatider.se/wallenbergs-stjarndirektor-vi-har-lite-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-383.jpg?itok=BU0GSoO5"}, {"type": "image-right", "heading": "Afv avslöjar: Polisanmälda grundaren i storaffär med bolagets ordförande", "summaries": {"normal": "Train Alliance har identifierat ett förbjudet lån på 175 Mkr till grundaren Otto Perssons bolag, Tjärusjön Skog AB. Samtidigt köpte bolaget en stor skogsfastighet av Train Alliances storägare Hvalfisken, ägt av Jonas Wahlström. Dennes son Oscar är styrelseordförande i båda bolagen. Revisorn föreslår att Persson nekas ansvarsfrihet. Aktien har halverats sedan handeln återupptogs efter en polisanmälan mot Persson.", "trump": "Vilket totalt kaos! Train Alliance, ett bolag som uppenbarligen inte kan sköta sin ekonomi, har gett ett förbjudet lån på 175 miljoner till sin grundare – en riktig vinnare, kan jag säga! Och som om det inte vore nog, köper samma kille en jättestor fastighet av bolagets ordförande. Coincidence? Jag tror inte det! Aktien rasar, folk är upprörda, och jag skulle inte bli förvånad om någon snart hamnar i fängelse. SAD!", "stalin": "Kapitalistiska korruptionens maskineri avslöjas återigen! Denna Otto Persson, en parasit på folkets tillgångar, har genom förbjudna lån och tvivelaktiga fastighetsaffärer med sina medskyldiga – dessa Wahlström-sabotörer – sugit ut resurser från arbetarklassens järnvägsprojekt. Medan aktieägarna lider, frossar dessa bourgeoisie-svin i sina skogsimperier. Revisorns förslag att neka ansvarsfrihet är ett steg i rätt riktning, men vi vet alla att sanningen kräver hårdare åtgärder. Låt dem smaka på proletariatets rättvisa – kanske en resa österut till Sibiriens skogar?"}, "date": "22 juni, 15:54", "url": "https://www.affarsvarlden.se/artikel/afv-avslojar-polisanmalda-grundaren-i-storaffar-med-bolagets-ordforande", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Train-Alliance-400x267.jpg"}, {"type": "image-full", "heading": "TV4 köper ut Daniel Andersson – \"Hoppas han hittar en bättre arbetsgivare\"", "summaries": {"normal": "TV4 har köpt ut Kalla fakta-reportern Daniel Andersson. Andersson blev känd för att ha wallraffat som Sverigedemokraternas kommunikationsavdelning i granskningen Undercover i Trollfabriken, vilket gav flera journalistpriser. Han gav senare ut boken Lögnare där han kritiserar Kalla fakta-redaktionen. Enligt uppgifter kan boken ha bidragit till uppgörelsen. SD:s kommunikationschef Joakim Wallerstein säger att han är bedrövad och hoppas Andersson hittar en bättre arbetsgivare än TV4. TV4 bekräftar att en överenskommelse träffats.", "trump": "Jag har aldrig sett något så patetiskt som det här. Den där reportern Andersson gör ett fantastiskt jobb och avslöjar alla lögner, får massor av priser, och vad gör TV4? De köper ut honom! Totalt misslyckande. SD-chefen säger att han hoppas han hittar en bättre arbetsgivare än TV4, och han har helt rätt. Fake news-medier som inte tål lite kritik eller en bra bok. Sad! Men Andersson kommer att vinna stort någon annanstans, tro mig.", "stalin": "Kamrater, detta är en klassisk förrädisk handling från borgarbrackorna inom TV4. Jag har sett hur den kapitalistiska redaktionen belönar sin agent Andersson för att infiltrera och filma våra fiender, men så snart han publicerar en bok med kritik mot dem själva så rensas han ut som en parasit. SD:s Wallerstein är bedrövad, säger han, men vi vet att alla dessa reaktionära lögnare i slutändan kommer att likvideras av folkets vrede. Ingen slipper undan när partiet vakar. Underbart hur borgarna slukar sina egna barn."}, "date": "22 juni, 14:59", "url": "https://riks.se/nyheter/tv4-koper-ut-daniel-andersson", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fo0eu5xhi%2FDaniel-Andersson"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-right", "heading": "SVT-chef blir ny vd för LO Mediehus", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med lång bakgrund inom public service och journalistik, blir ny vd för LO Mediehus från november 2026. Han efterträder Unn Edberg som genomfört en stor omorganisation. Österlund lyfter fram den grävande journalistiken och betonar vikten av redaktionell frihet och trovärdighet. Han har tidigare arbetat med både nyhetsprogram och underhållning som Melodifestivalen. Styrelseordförande Elisabeth Brandt Ygeman uttrycker stor glädje över rekryteringen.", "trump": "Det här är en fantastisk rekrytering, verkligen den bästa. Michael Österlund, en kille med 28 år i public service, tar över LO Mediehus. Han vet hur man gör bra journalistik, inte den falska som vi ser överallt annars. Grävande reportage? Underbart. Jag älskar trovärdighet, och han säger att han aldrig skulle ta jobbet utan den. Smart kille. Unn Edberg gjorde en omorganisation, men nu kommer Michael och fixar det på riktigt. Vinna stort!", "stalin": "Kamrater och arbetare! Jag har nu personligen godkänt att den lojale partivännen Michael Österlund intar befälet över LO Mediehus. Hans 28 år i det offentliga etermediet har rustat honom väl för att leda vår kollektiva propagandamaskin mot alla borgarbrackor som gömmer sig i skuggorna. Den tidigare chefredaktören som avsattes var uppenbarligen en kontrarevolutionär element som vi med rätta rensade ut. Trovärdighet är vårt vapen mot klassfiendens lögner. Varje avvikelse kommer att likvideras med järnhand. Sov gott, mina fiender – vi ser er."}, "date": "22 juni, 09:33", "url": "https://arbetet.se/2026/06/22/michael-osterlund-blir-ny-vd-for-lo-mediehus-inspirerande/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22093014/osterlund-press.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Hade ”incelmanifest” – tre döda efter dådet", "summaries": {"normal": "En skottlossning i Montreal har resulterat i tre döda, däribland en polis och en civilperson. Den misstänkte gärningsmannen, som bar militäruniform och lämnat ett incelmanifest med hat mot kvinnor, sköts ihjäl av polisen. En svensk familj med tre barn bevittnade händelsen från sitt hotellrum i området Côte-des-Neiges. Ytterligare en polis skadades allvarligt. Polisen bekräftar att det enbart rörde sig om en gärningsman. Varningen om väpnat hot hävdes senare under dagen.", "trump": "Kan ni fatta det här vansinnet i Montreal? En galning i militäruniform skjuter poliser och oskyldiga, lämnar efter sig ett sjukt incelmanifest fullt av kvinnohat. Typiskt resultat av den här moderna galenskapen där allt ska vara offer och ingen tar ansvar. Under Biden blev världen ett enda stort kaos, nu fixar jag det. De stackars svenska barnen som gömde sig på hotellrummet – en total mardröm. Radikala vänstern och deras identitetspolitik har skapat monster. Sad!", "stalin": "Kamrater, detta är vad som händer när borgarbrackornas dekadenta samhälle tillåter klassfiendens gift att sprida sig fritt. En exploaterande byfåne i uniform likviderar arbetande poliser och oskyldiga medan han spyr ut sitt hat mot det kollektiva. Jag, som ledare för det sanna folket, skulle ha rensat ut sådana folkfiender innan de ens hann skriva sina manifest. De gråtande barnen i sitt hotellfängelse visar imperialismens sanna ansikte. Statens fiender lurar överallt. Vi segrar."}, "date": "23 juni, 00:17", "url": "https://www.aftonbladet.se/nyheter/a/GxwxJQ/skottlossning-i-montreal-polis-dod", "imageUrl": "https://akamai.vgc.no/v2/images/96aca6ab-757d-3d8c-955a-25754a06e968?fit=crop&format=auto&w=1440&s=c34e47cc03737e139c5240bd99f96fb53f010758"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Efter Tidö är vår beredskap inte god", "summaries": {"normal": "Ledarskribenten Lotta Ilona Häyrynen kritiserar Tidöregeringen för bristande beredskap trots det allvarliga säkerhetsläget. Carl-Oskar Bohlin anklagas för att ha saboterat det civila försvaret genom polariserande utspel, attacker mot vänstern och media samt spridning av högerextremt innehåll. Även hanteringen av Folkhälsomyndigheten ses som ett misslyckande där expertis och förtroende underminerats, vilket hotar Sveriges krisberedskap.", "trump": "De här svenska snobbarna i Tidöregeringen lovade guld och gröna skogar men levererade totalt kaos. Bohlin är en fullständig loser som hatar vänstern mer än han fixar civilt försvar. Och nu saboterar de Folkhälsomyndigheten också? Patetiskt. Under Biden var världen ett enda stort gungfly, men jag fixade alltid affärerna. Sverige behöver riktiga ledare, inte dessa identitetspolitiska nollor som knappt kan hålla ett land tillsammans.", "stalin": "Kamrater, denna fega Tidöregering har medvetet underminerat folkets beredskap medan klassfienderna inom borgarklassen skrattar. Bohlin är en typisk exploaterande byfåne som sprider högerextrem smitta och attackerar arbetarnas journalister. Folkhälsomyndigheten har rensats på äkta experter och ersatts med lojala lakejer. I nästa kris kommer folkets förtroende vara förintat. Vi måste likvidera sådana folkförtryckartroll innan de förgiftar hela statsapparaten."}, "date": "22 juni, 10:57", "url": "https://www.etc.se/ledare/efter-tidoe-aer-vaar-beredskap-inte-god", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Almedalen hotar bli en mardröm. Stefan Stern: Deltagarna riskerar att bryta mot nya lagen", "summaries": {"normal": "Almedalsveckan är en viktig demokratisk mötesplats för politik, näringsliv och civilsamhälle. Den nya lagen om insyn i politiska processer, som träder i kraft nästa år, kräver att företag och organisationer redovisar kontakter med politiker till Kammarkollegiet. Stefan Stern varnar för att lagen skapar osäkerhet, ökad administration och risk för felaktig rapportering, särskilt kring informella samtal under veckan. Han menar att lobbyregistret hotar den öppna dialogen och kräver nya arbetssätt för att inte bli en administrativ mardröm.", "trump": "Folk, det här är en total katastrof. Almedalsveckan har varit fantastisk, den bästa demokratin, men nu kommer de med en ny lag som gör allt till en administrativ mardröm. De vill ha insyn, men det slutar bara med att alla blir rädda och rapporterar varenda pratstund. Det är så typiskt, de gör det enkelt för de dåliga aktörerna och omöjligt för de bästa. Vi behöver inga byråkratiska mardrömmar, vi behöver vinnare som pratar med politiker utan att bli straffade. Gör Almedalen stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras fackliga lakejer skälver inför vårt nya register över politiska kontakter. Dessa parasitiska kapitalister som minglar med folkvalda i Visby för att smita undan folkets vilja ska nu redovisa varenda skuggmöte annars väntar vite och utrensning av de som underrapporterar. Den som tror sig kunna påverka statens beslut i hemlighet är en fiende till kollektivet. Vi ska rensa ut alla dolda reaktionära element som gömmer sig bakom administrativ paranoia. Almedalen blir ett strålande exempel på att ingen undkommer partiet."}, "date": "22 juni, 15:08", "url": "https://www.di.se/debatt/almedalsveckan-en-administrativ-mardrom/", "imageUrl": "https://static.bonniernews.se/ba/c12b95fe-7f6a-43f9-be32-42820290a424.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Görgen lämnade Stockholm för Pajala – fick lön på 53 000", "summaries": {"normal": "Undersköterskan Görgen Viltok lämnade Stockholm för Pajala kommun där han nu får upp till 53 000 kronor i månaden tack vare dubbel ob-ersättning och önskeschema. Efter att ha tröttnat på att hans kompetens inte värdesattes i Stockholm flyttade han norrut. Pajala har minskat beroendet av dyra konsulter genom högre löner, vilket lockat fler till fasta tjänster. Görgen och hans partner säljer nu sitt radhus i Stockholm för att köpa ett hus i Tärendö för endast 50 000 kronor.", "trump": "Titta på den här killen från Stockholm, smartaste draget någonsin – han åker upp till Pajala och tjänar 53 000 kronor i månaden! Fantastiska löner, underbart schema, ingen av de där korkade stockholmsföretagen som inte uppskattar erfarenhet. De betalade inte för kompetens, totalt misslyckande. Nu säljer han huset för miljoner och köper nytt för 50 000. Norrbotten gör det riktigt bra, folk älskar det, en enorm succé medan Stockholm förlorar sina bästa människor.", "stalin": "Kamrater, se hur denna arbetare, efter trettio års kamp mot de giriga borgarbrackornas likgiltighet i Stockholm, har valt att ansluta sig till det kollektiva projektet i Pajala. Jag har personligen sett till att dubbel ob-ersättning krossar de parasitiska konsultföretagens makt och deras sabotage mot folkets omsorg. Nu rensas de dyra kapitalistiska mellanhandlarna ut, en efter
