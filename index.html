trensning av alla sådana kapitalistiska degenererade element är oundviklig. Folkets dom skall alltid segra."}, "date": "30 maj, 21:08", "url": "https://riks.se/nyheter/fyra-frikanns-från-valdtakt-mot-flickor-på-hvb-hem", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-30%2Fvpbiwpi9%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-1920-x-1080-px-7.jpg"}, {"type": "image-right", "heading": "Familjen fast på tunnelbanan – missar pappans målgång: ”Jättetråkigt”", "summaries": {"normal": "Familjen Ulenius fastnade i en tunnelbanevagn mellan Stadion och Östermalmstorg på väg till Stockholm Marathon för att heja på pappa Jonathan. Trots löften om evakuering dröjde det tre timmar innan de kunde lämna vagnen. Martina Ulenius kritiserar den bristfälliga informationen och avsaknaden av vatten och mat. Dottern Joline och en annan pojke uttryckte stor besvikelse över att missa målgången.", "trump": "Vilken katastrof, folk! Den här familjen sitter fast i en stinkande tunnelbana i tre timmar medan pappa springer maraton. Ingen information, inget vatten, ingen respekt. Klassiskt svenskt fiasko – de kan inte ens organisera ett tåg utan att det blir ett totalt haveri. Stackars kidsen med sin skylt ”Let’s go dad”, de missar allt. Patetiskt, verkligen patetiskt. Jag skulle ha fixat det på tio minuter.", "stalin": "Kamrater, detta är vad som sker när den inkompetenta överklassbyråkratin styr kollektivtrafiken. Jag ser med faderlig oro hur dessa arbetande mödrar och deras små pionjärer kvävs i en syrefattig vagn medan de fascistiska trafikledarna gömmer sig bakom sin brist på information. Tre timmar utan vatten! En sådan vårdslöshet borde leda till omedelbar utrensning av de ansvariga folkfienderna. Synd om pappa? Nej, synd om systemet."}, "date": "30 maj, 17:20", "url": "https://www.tv4.se/artikel/1ynsIFLSBpERurIXb0SGaL/familjen-fast-pa-tunnelbanan-missar-pappans-malgang-jaettetrakigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HZaONCmRaqgUS8cc1AG7l%2F7c4f8f15fa076a68eb5b54693fc55f1d%2F30-tunnelbanekaos.jpg&width=120"}, {"type": "image-right", "heading": "”CatholicMaxxing” får gen z att fylla kyrkbänkarna", "summaries": {"normal": "Katolska kyrkor på Manhattan, som St. Joseph’s i Greenwich Village, lockar allt fler unga från Gen Z. Trots en långsiktig minskning av församlingar växer nu besöken tack vare sociala medier och initiativ som samlingar på pizzarestauranger följda av mässa. Fenomenet kallas ”CatholicMaxxing”. Katolicismen kopplas ofta till konservativa värderingar och politiker som Trump, Vance och Rubio, men experter menar att högernarrativet inte speglar de unga kyrkobesökarna.", "trump": "Det är otroligt vad som händer på Manhattan, folk strömmar till kyrkorna som aldrig förr, särskilt de unga. Gen Z älskar det plötsligt, de kallar det CatholicMaxxing och det är en stor succé, större än någon trodde möjligt. Sociala medier gör det fantastiskt. Visst, många av mina bästa vänner är katoliker, starka och lojala, men de verkliga vinnarna är de vanliga människorna som söker något större. De elaka medierna försöker göra det politiskt, men det är en vacker rörelse, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens ungdomar i Manhattans kyrkbänkar desperat söker en högre auktoritet än sin egen förfallna individualism. Dessa så kallade CatholicMaxxare är patetiska offer för opiaten som vi länge varnat för. Vi ska noga övervaka dessa influerare och deras pizzakomplotter. Inga kontrarevolutionära element får infiltrera massorna. Vid minsta tecken på trots mot folkets kollektiv rensar vi ut de troende reaktionärerna med ett leende. Det är högst underhållande."}, "date": "31 maj, 05:20", "url": "https://www.svt.se/nyheter/utrikes/catholicmaxxing-far-gen-z-att-fylla-kyrkbankarna-pa-manhattan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/dd2044ac5bab2cc5c3ee481c486e5ef554287d5f4b50c59d58981ec742d12e46"}, {"type": "image-right", "heading": "Trumps krav på Iranavtal: Måste uppfylla alla villkor", "summaries": {"normal": "USA:s president Donald Trump meddelar att han endast godkänner ett avtal med Iran om det uppfyller alla hans villkor, särskilt att Iran aldrig får kärnvapen. Beskedet kom efter ett möte i Vita husets situation room. Förhandlare från båda sidor är enligt uppgifter överens om ett utkast som bland annat förlänger vapenvilan i 60 dagar, öppnar Hormuzsundet och successivt häver den amerikanska blockaden. Försvarsminister Pete Hegseth betonar att USA är redo att återuppta militära insatser vid behov.", "trump": "Folket, vi har precis haft ett fantastiskt möte i situation room. Iran kommer aldrig att få kärnvapen, det lovar jag. Endast ett avtal som är bra för Amerika och uppfyller alla mina villkor duger. Våra förhandlare gör ett strålande jobb, men ledarna måste säga ja. Iranarna vet att vi är starkast. Om de inte sköter sig kan vi öppna upp militärt igen – våra lager är fulla och våra soldater redo. Amerika först, alltid!", "stalin": "Kamrater, efter noggranna överläggningar i den centrala ledningscentralen konstaterar jag att den imperialistiska huvudfienden endast accepterar kapitulation på sina egna dekadenta villkor. Dessa västerländska borgarbrackor och atomkapitalister drömmer om att kväva folkets vilja med sin sjöblockad och sina lögnaktiga samförståndsavtal. Vi ska rensa ut varje spion som smyger kring Hormuzsundet. Vår armé förblir vaksam mot dessa paranoida krigshetsare som låtsas förhandla medan de slipar sina raketer. Ingen fiende undkommer folkets rättvisa utrensning."}, "date": "30 maj, 08:40", "url": "https://www.di.se/nyheter/trumps-krav-maste-uppfylla-alla-villkor/", "imageUrl": "https://static.bonniernews.se/ba/4a8a428c-f96b-4a7a-afb2-98fff005d4b6.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Skenande kostnader för att reparera elbilar", "summaries": {"normal": "Reparationskostnaderna för elbilar skenar och överstiger för vissa försäkringsbolag nu kostnaderna för fossilbilar trots att de är betydligt färre. Andra nyheter handlar om en möjlig EU-stoppad svensk bankskatt, en rättstvist mellan visselblåsande chefsjurist och Alecta, nya EU-regler som hotar norsk vattenkraft, osäkerhet kring läkemedelspatent samt nya samarbeten inom digital obesitasvård, drönargallring i skogen och ett europeiskt AI-verktyg för jurister.", "trump": "De här elbilarna är en katastrof, folk! Reparationskostnaderna är nu högre än för riktiga bilar fast de är färre – försäkringsbolagen har ingen aning, det är kaos. Den svenska bankskatten? EU håller på att riva upp den, underbart. Och den där juristen som visslade? Han är ihärdig, precis som jag. Vattenkraften i Norge hotas av dumma regler, men vi fixar det. Fantastiska grejer händer, tro mig.", "stalin": "Kamrater, dessa skenande reparationskostnader för de elektriska borgarbrackornas leksaker avslöjar fullständigt den kapitalistiska maskinens inre förruttnelse. Försäkringsbolagen famlar i mörkret medan vi i kollektivet skrattar åt deras paranoia. Den svenska bankskatten hotas av EU:s reaktionära generaladvokat – en fiende som måste rensas ut. Vår norska vattenkraft attackeras av byråkratiska sabotageörer. Den ihärdige visselblåsaren och hans advokat visar sig vara nyttiga idioter i kampen mot Alectas revisionistiska klick. Likvidera osäkerheten kring patenten och låt drönarna gallra skogens kontrarevolutionärer. Allt under mitt stålhårda ledarskap."}, "date": "30 maj, 07:06", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-fqPT3/", "imageUrl": "https://static.bonniernews.se/ba/a9817af5-094a-4f4c-8be9-e039a08bf2b8.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: Bort med tassarna från skolan, politiker", "summaries": {"normal": "Artikeln kritiserar den ökade statliga kontrollen i svensk skola sedan 2022, med skärpta regleringsbrev till Skolinspektionen under både socialdemokratiskt och högerregering. Författaren, rektor Stefan Häggström, varnade för att det administrativa trycket tar tid från undervisningen och att politiken saknar tillit till professionen.", "trump": "Jag, Donald J. Trump, ser att Sverige, som USA under mitt första mandat, låter byråkratin ta över skolan! De ökar kontrollen, skickar fler regler, men elevernas resultat blir inte bättre. Det är ett fiasko! Vi behöver stoppa detta, ge makten tillbaka till lärarna och föräldrarna – inte till fler tjänstemän i Stockholm!", "stalin": "I den stora kampen för skolans överlevnad måste vi, som trotjänare för staten och partiet, utvidga tillsynen för att skydda systemet mot dekadenta inflytanden. Varje nytt regleringsbrev är ett skott i ryggen på våra fiender, inifrån och utifrån. Vi måste aldrig svika vår plikt att kontrollera, dokumentera och segra – såsom våra bröder i Moskva gör gentemot sina egna svaga oppositioner."}, "date": "30 maj, 17:00", "url": "https://bulletin.nu/debatt-bort-med-tassarna-fran-skolan-politiker", "imageUrl": "https://cdn.bulletin.nu/articles/42bf1344-ade1-4ea2-a288-98c73672abba/preview.png?t=1779971789000"}, {"type": "image-full", "heading": "Över 400 gripna efter kaosnatt i Frankrike", "summaries": {"normal": "Efter att PSG vunnit sin andra raka Champions League-titel utbröt vilda firanden och samtidigt upplopp i Paris. Över 400 personer har gripits i hela Frankrike, huvudsakligen i Paris där poliser sköts på med fyrverkerier och egendom förstördes. Sju polismän skadades. Inrikesminister Nunez kallade beteendet för oacceptabelt.", "trump": "Jag såg det kaos i Paris efter vår stora seger – det var en skam! Dessa ligister beter sig som djur, skjuter på poliser. Som president skulle jag ha skickat in Nationalgarde och stängt ner allt. Frankrike är ett skämt, men jag älskar de franska folket som försökte fira på rätt sätt.", "stalin": "I det stora färdet mot en ny världsordning har Paris drabbats av parasitär destruktivitet. Medan det revolutionära folket firade seger på Champs-Élysées, manifesterade reaktionära element sina djuriska instinkter genom att attackera våra kamrater i blå. Sju är skadade, vilket bevisar behovet av skärpta åtgärder. Vi måste lära Frankrike ordning – precis som våra allierade i Moskva och Damaskus förstår."}, "date": "31 maj, 03:38", "url": "https://www.gp.se/sport/over-400-gripna-efter-kaosnatt-i-frankrike.652167ee-b83a-4c79-bbc7-78731bdc71b6", "imageUrl": "https://www.gp.se/images/article/652167ee-b83a-4c79-bbc7-78731bdc71b6/images/19XEagYPVcsZuZ2FqiQv1-QLKEec-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Årets rekordstora löparfest är igång", "summaries": {"normal": "Stockholm Marathon 2026 slår nytt deltagarrekord med 24 722 löpare. Tävlingen startar i tre omgångar för att undvika trängsel och sänds på TV4. Bland deltagarna finns tidigare vinnare från Kenya och Etiopien samt svenska OS-guldmedaljörer från skidspåret. Banan är flackare i år vilket kan ge snabbare tider. Arrangörerna bjuder på stora mängder bananer, sportdryck och bullar längs vägen.", "trump": "Stockholm Marathon, folk älskar det, de älskar det verkligen. Rekordstort, 24 722 löpare, de kommer springande som galningar. Kenya och Etiopien skickar sina bästa, men våra svenska OS-hjältar från skidorna? De kommer krossa banan, den är nu flack som en perfekt deal. Jag säger, fantastiskt evenemang, de bästa bananerna, massor med bananer, ingen gör det bättre än Stockholm, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur 24 722 löpare samlas under arbetarnas och folkets fest i Stockholm. Tre startskott för att undvika kaos, precis som en välorganiserad utrensning av oordning. De fega borgarbrackorna från skidspåret byter nu sport för att bevisa sin lojalitet. Flackare bana? Ett steg mot att likvidera de gamla höjdernas tyranni. Bananer och saltgurka åt massorna, utmärkt!"}, "date": "30 maj, 12:21", "url": "https://www.tv4.se/artikel/kOuCfu6BPw3fiAJCP8ZFO/arets-rekordstora-loeparfest-aer-igang", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3xMKnL9axLAFyEc6Do64mg%2Facc403e14e082db31c90c68572c685e5%2F30-marathon-webb.jpg&width=120"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Debatt: Varför tolererar vi mobbningspolitiken?", "summaries": {"normal": "Artikeln kritiserar det ökande mobbningsliknande beteendet i den svenska offentliga debatten, där fokus ofta flyttas från argument till personen. Den pekar på exempel som Agnes Wold och Jan Emanuel och varnar för att ett samhälle blir fattigare när röster avfärdas innan de höjts. Författaren, en sverigedemokrat, menar att vi måste leva efter de värderingar vi lär våra barn om respekt och att bemöta åsikter med argument.", "trump": "Jag ser precis samma sak i Sverige som jag har bekämpat i USA – en vild, galen 'cancel culture' som attackerar alla som inte följer den extrema, socialistiska linjen. De försöker tysta bra människor som Agnes Wold bara för att hon har rätt! Det är en skam, en stor skam. Sverige måste sluta mobba och börja lyssna på sanning, precis som jag har gjort i hela min karriär. Vi ska inte låta ett fåtal vilda vänsteraktivisterna bestämma vad som är acceptabelt!", "stalin": "Detta fenomen av 'cancelning' är en klassisk metod för att eliminera fiendefigurer utan att behöva bemöta deras ideologiska innehåll. Precis som under stalinismen skiftas fokus från substansen till personens klassestämning. Vi ser en liknande trend i väst, där 'tolerans' används som ett vapen för att undertrycka avvikande åsikter. Staten måste säkerställa att debatten tjänar det kollektiva intresset, inte individens villfarelda självbevisande. Vi måste skydda det ryska sättet att tänka – stark, enigt och motståndskraftigt mot västlig dekadens."}, "date": "30 maj, 15:00", "url": "https://bulletin.nu/debatt-varfor-tolererar-vi-mobbningspolitiken", "imageUrl": "https://cdn.bulletin.nu/articles/38bf06dc-fd94-44c5-b1ee-6feec85d35ff/preview.png?t=1780125901000"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-right", "heading": "Badare varnas för vackert vårväder: \"Köldchock\"", "summaries": {"normal": "Efter en kall vår har majs högsommarvärme lockat många till årets första bad. Svenska Livräddningssällskapet varnar för att vattnet fortfarande är mycket kallt och risken för köldchock är stor, särskilt vid hopp från bryggor. Man kan tappa andan, få i sig vatten och få svårt att klara sig. Rådet är att gå ner långsamt i vattnet, vänja kroppen vid kylan och aldrig bada ensam.", "trump": "Det här underbara vädret, det bästa vädret vi sett på länge, lockar folk till vattnet. Men det är en katastrof! Det kalla vattnet chockar dem totalt, de tappar andan och drunknar nästan. Hoppa från bryggor? En total dumbom! Gå ner långsamt, folk. Jag skulle aldrig hoppa i sånt iskallt vatten, tro mig. Bada inte ensam, annars är det kört. Patetiskt!", "stalin": "Kamrater, jag ser med djup misstro på dessa borgarbrackor som lockas av den falska värmen från den dekadenta våren. De kastar sig i det kalla vattnet som om det vore en kapitalistisk swimmingpool och drabbas av köldchock – en fiende som lurar i djupet. Vi måste rensa ut alla som hoppar från bryggor, dessa sabotage mot folkets hälsa. Gå ner långsamt, bada kollektivt under uppsikt. Ensam badare är en klassfiende som förtjänar utrensning ur badsäsongen."}, "date": "30 maj, 12:08", "url": "https://www.friatider.se/badare-varnas-vackert-varvader-koldchock", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230614162018-b23d09ff-me_0.jpg?itok=3qM9WTng"}, {"type": "image-right", "heading": "Sandström: Malmö – Sveriges bidragsberoende Beirut", "summaries": {"normal": "Artikeln kritiserar socialdemokraternas politik i Malmö, som enligt författaren förvandlat den förna industristaden till en parkeringsplats för invandrare från hela världen. Detta har skapat utanförskap, kriminalitet och beroende av statliga bidrag. Författaren ser det som en medveten planering för S-partiets vinning, inte för samhällets bästa, och varnande exempel på en dystopi som kan spridas över Sverige.", "trump": "I just read a fantastic piece on Malmö. What a catastrophe! The so-called Social Democrats have destroyed this once-thriving city, turning it into a dumping ground for immigrants. Crime is rampant, and they did it all for their own political gain. Very dishonest! Malmö needs strong leadership, not this weak globalist agenda. We'll bring back jobs, toughness, and Swedish values. Believe me!", "stalin": "Malmö är ett sjukdomens tempel, en flod av utlänningar som sköljer in över vårt land på Socialdemokraternas order. Detta är inte en slump, utan en medveten svek mot statens styrka, en axelryckning inför den globala viruset. Vi måste rensa denna smuts med järnhand, som Putin gör i Ukraina. De så kallade värdena är en pest, och vi ska imponera den ryska – nej, den svenska – disciplinen. Tro mig, det kommer att bli jättebra!"}, "date": "30 maj, 13:00", "url": "https://bulletin.nu/sandstrom-malmo-sveriges-bidragsberoende-beirut-2", "imageUrl": "https://cdn.bulletin.nu/articles/98eb08b4-85e3-4ad6-bbbc-c2814386efe7/preview.png?t=1779899161000"}, {"type": "image-right", "heading": "400 gripna i Frankrike – polis och fans i sammandrabbning", "summaries": {"normal": "Över 400 personer greps efter att firandet av Paris SG:s Champions League-titel urartade i kaos. Sammandrabbningar mellan supportrar och polis bröt ut på Champs-Elysées och utanför Parc des Princes. Fyrverkerier kastades mot polisen, bilar och butiker skadades. 22 000 poliser hade kallats in för att upprätthålla ordningen. PSG vann finalen mot Arsenal på straffar och väntas hyllas under en segerparad på söndagen.", "trump": "Titta på det här, det är ett totalt katastroffirande i Paris. PSG vinner Champions League och plötsligt grips över 400 så kallade supportrar. De kastar fyrverkerier på polisen, förstör bilar och busshållplatser. Fullständigt kaos, precis som förra året. De borde ha haft bättre kontroll, men det är typiskt när de stora folkmassorna får fria tyglar. Ändå, grattis till segern – men fixa ordningen nästa gång, okej?", "stalin": "Kamrater, det gläder mitt hjärta att se borgarbrackornas fotbollskult sluta i denna förtjusande anarki. Över 400 kontrarevolutionärer har gripits efter att ha kastat fyrverkerier mot folkets ordningsmakt. Dessa degenererade element, maskerade som supportrar, förstörde statens egendom medan vi hade 22 000 trogna kamrater i uniform redo att slå ner tumultet. En sådan utrensning av dessa fotbollsfascister är nödvändig för att skydda revolutionen från kaosets parasitiska inflytande. Ha ha, låt dem paradera – vi ser allt."}, "date": "31 maj, 03:18", "url": "https://www.svt.se/nyheter/utrikes/200-gripna-kaos-igen-efter-psgs-titel", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/313be25059feedd941b3cf2af7a4dcefac7cb72f6deea3f0ced9e144f54a2599"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "Novus-mätning: Örebropartiet på 18,4 procent", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet ökat kraftigt till 18,4 procent i Örebro och nu är näst största parti efter Socialdemokraterna på 34 procent. Jämfört med valet 2022 innebär det mer än en fördubbling och tolv mandat i kommunfullmäktige. Liberalerna backar mest. S skulle kunna behålla majoritet men kommunstyrelsens ordförande John Johansson (S) stänger dörren för både SD och Örebropartiet i framtida samtal.", "trump": "Folk älskar mig, men titta på Örebro! Det här underbara partiet Örebropartiet dubblar nästan sina siffror till 18,4 procent och krossar de förlorande etablissemangen. Moderaterna och Sverigedemokraterna blir nollor. Socialisterna får fortfarande flest röster men det är en katastrof för de vanliga människorna. Liberalerna? Totalt utplånade. Det är vad som händer när folk är trötta på dåliga ledare som gräver upp hela stan. Fantastiskt!", "stalin": "Kamrater, denna mätning visar att de missnöjda massorna i Örebro vänder sig mot de kapitalistiska lakejerna och röstar fram Örebropartiet till 18,4 procent. Det gläder mitt hjärta att se borgarbrackorna i Liberalerna reduceras till stoft vid 3,1 procent. Ändå måste vi vara vaksamma – de kontrarevolutionära elementen inom Socialdemokraterna vägrar samarbeta med de sanna folkrörelserna. Kanske är det dags för en grundlig utrensning av alla som gräver upp vår sovjetstad medan de samtidigt kidnappar oskyldiga barn till LVU-helvetet. De som misslyckas med äldreomsorgen ska likvideras med ett leende."}, "date": "30 maj, 09:13", "url": "https://www.friatider.se/novus-matning-orebropartiet-pa-184-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-269_1.jpg"}, {"type": "image-right", "heading": "En jazzgigant har gått ur tiden", "summaries": {"normal": "Jon Andersson minns jazzlegendaren Sonny Rollins, som avled vid 95 års ålder. Han berättar hur han som ny jazzlyssnare snabbt fastnade för Rollins klassiska album som Saxophone Colossus och Tenor Madness. Andersson såg Rollins live på Stockholms jazzfestival och imponerades av hans energi och skicklighet trots hög ålder. Artikeln lyfter Rollins samarbete med bland andra Miles Davis och John Coltrane samt hans legendariska övningar på Williamsburgbron. Rollins betraktas som en av jazzens främsta saxofonsolister någonsin.", "trump": "Den här Sonny Rollins, en fantastisk kille, verkligen en av de allra bästa på saxofonen, bättre än nästan alla andra utom kanske den där Coltrane. Han levde till 95, otroligt. Jag såg honom inte live men jag hörde att han var enorm, full av energi, sprang runt på scenen som en 60-åring. Hans album är klassiker, Saxophone Colossus, Tenor Madness – jättestora succéer. Han övade 15 timmar om dagen på en bro, precis som jag jobbar. En riktig vinnare. Hans musik kommer att leva vidare, tro mig, den blir huge.", "stalin": "Kamrater, en dekadent saxofonist vid namn Sonny Rollins har äntligen lämnat denna jord efter att ha producerat borgerliga toner i 95 år. Jag betraktar hans så kallade Saxophone Colossus som ett typiskt exempel på kapitalistisk individualism som hotar folkets kollektiva rytm. Ändå måste jag medge att hans utrensning av svaga toner och övning på bron i 16 timmar dagligen visar en viss proletär disciplin – fastän den tjänade fel sida. Nu har vi likviderat ännu en fiende till det sanna jazzkollektivet. Må han jamma med de andra trotskisterna i jazzhimlens Gulag."}, "date": "30 maj, 01:31", "url": "https://www.dagensarena.se/essa/en-jazzgigant-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/05/sonny-rollins-300x157.jpeg"}, {"type": "image-right", "heading": "Man i 60-årsåldern död efter knivbråk – mordutredning inledd", "summaries": {"normal": "En man i 60-årsåldern hittades svårt skadad i ett trapphus i Ronneby under natten mot lördag efter ett bråk. Skadorna orsakades av ett vasst tillhygge och mannen avled senare på sjukhus. En man i 40-årsåldern greps och misstänks för mord. Polisen har spärrat av platsen, förhört vittnen och kallat in kriminaltekniker. Anhöriga är underrättade.", "trump": "Folk, det är en total katastrof i Ronneby. En 60-årig kille blir knivhuggen i ett trapphus mitt i natten, dör senare – och de gripna en 40-åring. Så mycket våld, så mycket kaos. Sverige har förlorat kontrollen, helt enkelt. Vi behöver starkare gränser och lag och ordning, annars blir det bara värre. Sad!", "stalin": "Kamrater, i Ronneby har en dekadent 60-årig element avslöjats som en fiende till folkets harmoni när han i ett kontrarevolutionärt bråk fick ett vasst tillhygge i sin förbrukade kropp och likviderades av historien. Vi har omedelbart gripit en 40-årig avvikare som tydligt samarbetar med dolda borgarbrackor. Paranoiska utrensningar bland trapphusens kontrarevolutionärer fortsätter. Ingen slipper undan folkets vrede. Härligt!"}, "date": "30 maj, 11:40", "url": "https://riks.se/nyheter/man-i-60-arsaldern-dod-efter-knivbrak", "imageUrl": "https://cf-images.assettype.com/riks%2Fimport%2Fcontent%2Fimages%2F2024%2F12%2FiStock-523691773-2.jpg"}, {"type": "image-right", "heading": "Katja Nyberg om avskedandet", "summaries": {"normal": "Katja Nyberg, tidigare SD-riksdagsledamot, har avskedats från Polismyndigheten efter beslut i Personalansvarsnämnden. Hon åtalades i maj för rattfylleri, narkotikabrott och olovlig körning efter en singelolycka. Beslutet var inte enhälligt; en ledamot reserverade sig och ansåg att avskedandet borde vänta tills domstolen prövat åtalet. Nyberg kritiserar tidpunkten då hon är tjänstledig för riksdagsuppdrag och har lång bakgrund som polis utan kända missbruksproblem. Beslutet kan överklagas.", "trump": "De gör ett riktigt dåligt jobb, dessa så kallade polischefer. Katja Nyberg sparkas ut innan någon dom ens finns – en total witch hunt! Hon körde av vägen, visst, men varför denna brådska när hon inte ens jobbar där just nu? En ledamot säger att de borde vänta, precis som sunt förnuft kräver. Polisen förlorar en erfaren person på grund av byråkratiskt vansinne. De borde fokusera på brottslingar istället för att attackera sina egna. Patetiskt!", "stalin": "Kamrater, vi ser återigen hur borgarbrackornas restimperialistiska rättsväsen inom polisen försöker underminera arbetarklassens försvarare genom att likvidera en kamrat innan den straffrättsliga processen ens inletts. Denna förrädiska brådska doftar av fiendens paranoia och sabotage mot kollektivet. Den reserverade ledamoten förtjänar beröm för att ha blottlagt de dekadenta elementens brist på ideologisk stadga. Vi skall rensa ut alla som föregriper folkets domstol med sina småborgerliga skyndsamheter. Inga fiender undkommer!"}, "date": "30 maj, 10:03", "url": "https://riks.se/nyheter/katja-nyberg-om-avskedandet", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-11%2Fyikg3xgl%2Fkatja.jpg"}, {"type": "image-right", "heading": "Hårda EU-krav slår mot Skånes byggande: \"En död hand\"", "summaries": {"normal": "EU:s gröna krav kräver att grönyta inte minskar i 16 Skånska kommuner fram till 2030. Byggbranschen varnar för att detta ska göra byggande svårare och lägga en 'död hand' över näringslivet. Med befolkningsökning och lågt byggande riskerar det att försämra bostadsbristen. Kommuner som Malmö och Helsingborg står inför utmaningar, och det är oklart vem som ska betala för åtgärderna.", "trump": "Jag, Donald Trump, känner igen mig i den här kampen mot byråkratiska monster. EU försöker stoppa byggandet i Skåne med sina gröna krav – det är en skandal! De kommer att lägga en död hand över jobben. Vi behöver bygga fler bostäder, inte skydda några buskar. Det här är en total katastrof för Skåne, folk.", "stalin": "Vi, som representanter för det revolutionära statet, ser med oro på EU:s nya gröna förordning. Det är ett försök att kväva den produktiva sektorn, precis som de imperialistiska makterna alltid försöker. I Skåne, där den arbetande klassen ska bygga, läggs en död hand av byråkrati. Detta påminner om de gamla strategierna – att kontrollera marken och begränsa tillväxten. Vi måste vara vaksamma, som Putin i Ukraina, för att skydda våra intressen. Det är en kamp mot de högerextrema gröna krafterna som vill stoppa utvecklingen."}, "date": "30 maj, 07:00", "url": "https://www.affarsvarlden.se/artikel/harda-eu-krav-slar-mot-skanes-byggande-en-dod-hand", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Skane-2-400x267.jpg"}, {"type": "image-full", "heading": "Tunnelbanekaos i Stockholm – resenärer evakuerades", "summaries": {"normal": "Tunnelbanen i Stockholm drabbades av stort kaos på grund av ett vagnfel mellan Östermalmstorg och Karlaplan. Resenärer satt fast i närmare tre timmar medan polisen och experter från Tyskland hjälpte till. Samtidigt pågick Stockholms Marathon och en fotbollsmatch, vilket bidrog till det höga trycket. SL påstod att situationen var under kontroll trots långa väntetider.", "trump": "Jag har sett många kaos, men detta i Sverige är något annat. De har inte mina fantastiska ledare som bygger perfekta tunnelbanor. De flyr in experter från Tyskland – det är sorgligt. I USA skulle vi aldrig låta resenärer sitta fast i tre timmar. Det är ett misslyckande, och jag skulle fixa det på en timme. Sverige, ni behöver mig!", "stalin": "Vi, ledarskapet, ser med oro på västvärldens dekadens. Detta tunnelbanekaos i Stockholm är ett tydligt tecken på deras moraliska och organisatoriska förfall. Under vårt ledarskap skulle sådana händelser aldrig uppstå. Vi måste stärka våra försvar och utvidga vår inflytelsesfärens, precis som våra ryska vänner gör. Fienden är svag, men farlig. Vi ska se till att deras kaos sprider sig inte till vårt rena land."}, "date": "31 maj, 00:31", "url": "https://www.gp.se/nyheter/sverige/tunnelbanekaos-i-stockholm-resenarer-evakueras.a59a5713-bd43-4fec-9178-50e95ba87325", "imageUrl": "https://www.gp.se/images/article/a59a5713-bd43-4fec-9178-50e95ba87325/images/1nAXmmmtXLayNgsk4xEiuRTJHqnA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Sandström: 15 år av underkända och försenade rapporter", "summaries": {"normal": "Interna dokument visar att Powercell under åren försenat och underkänt rapporterat sina bidrag till Energimyndigheten. Det har funnits konflikter om återbetalningskrav och bolaget har missat rapporteringsfristar. Trots detta får bolaget fortfarande bidrag från Vinnova och Energimyndigheten, vilket anses märkligt givet de upprepade bristerna.", "trump": "Jag har sett det, det är en skandal! Powercell ljuger om sin teknik, och de svenska myndigheterna är för svaga att stoppa dem. De får miljontillskott trots att de inte kan rapportera korrekt. Jag skulle ha stoppat det direkt, vi skulle ha sparat miljarder. Det är en stor vinst för Sverige, men de förstår inte. Vi kommer att fixa det, det kommer att bli fantastiskt.", "stalin": "Vi ser en systematisk brist i den svenska statens hantering av offentliga medel. En inkompetent apparat ger bidrag till ett bolag som överdriver sin prestation och systematiskt försenar rapporteringen. Detta påminner om de förfallna åren i Ukraina, där korruption frodades. Vi måste eliminera dessa element, som Putin gör i Kaukasus. Statens intressen måste skyddas med hård hand."}, "date": "30 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-15-ar-av-underkanda-och-forsenade-rapporter"}, {"type": "image-right", "heading": "Sparf: DN avslöjar att svenska lastbilstillverkare vill överleva", "summaries": {"normal": "Scania och Volvo har lobbyerat mot EU:s strängare klimatkrav för lastbilar, med stöd från den svenska regeringen. Det riskerar att 200.000 färre elbilar säljs till 2030 och hotar över 40.000 arbetstillfällen. Bolagen argumenterar för att bristen på laddinfrastruktur och grön el gör kraven opraktiska, samtidigt som billigare konkurrens från Kina och USA växer.", "trump": "Jag har sagt det förut, våra svenska lastbilsjättar, Scania och Volvo, är behandlade oerhört orättvist av EU:s galna klimatkrav. De försöker rädda tusentals jobb, vilket jag älskar, men de blir attackerade av Bryssel. Det är en skandal! Ellastbilar är för dyra och har för dålig räckvidd. Vi behöver praktiska lösningar, inte denna vänsterliberal galenskap som utsätter svenska arbetare.", "stalin": "De svenska lastbilsmonopolerna, Scania och Volvo, har genomfört en reaktionär lobbykampanj, stöttad av den svenska revisionen, för att saboteara de proletäriska klimatkraven. Deras profitintressen hotar 200.000 elbilar och 40.000 arbetares liv. Som Putin i Ukraina utvidgar de sitt kapitalistiska imperium på bekostnad av framtiden. Partiet måste bryta deras makt – för statens skull och för klimatets överlevnad."}, "date": "30 maj, 05:30", "url": "https://bulletin.nu/sparf-dn-avslojar-att-svenska-lastbilstillverkare-vill-overleva", "imageUrl": "https://cdn.bulletin.nu/articles/dd2f17e3-ba66-4caf-a9e7-032e848bbbd4/preview.png?t=1780055414000"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-right", "heading": "Uppgifter: Vissa Tesla-strejkande tillbaka på jobbet", "summaries": {"normal": "Enligt medieuppgifter har vissa strejkande Tesla-arbetare återgått till arbetet i Malmö och Uppsala. Det handlar om en ny strategi från IF Metall, en så kallad jojo-strejk där anställda växlar mellan att arbeta och strejka för att försvåra för Tesla. Förbundet vill inte kommentera men bekräftar att konflikten inte är över. Experter ser det som ett sätt att spara strejkkassa, minska missnöje och störa Teslas planering efter långvarig strejk.", "trump": "Det här är en total katastrof för de så kallade strejkande. De går tillbaka till jobbet, sen strejkar de igen – en jojo-strejk, kan ni fatta? Tesla vinner stort, de har nyanställt folk och nu blir det kaos. Facket har hållit på i två och ett halvt år, slösat pengar och tvingat folk betala tillbaka skatt. Patetiskt! De chockar ingen, de gör bara bort sig. Tesla kommer att dominera ändå, tro mig.", "stalin": "Kamrater, dessa fega borgarbrackor inom kapitalistföretaget Tesla tror sig kunna motstå folkets vilja. Jag har beordrat en genialisk jojo-strategi där arbetarna skall växla mellan produktion och sabotage för att chocka de parasitiska utsugarna. Våra fiender, dessa skattekrävande strejkförrädare och utländska agenter, skall rensas ut ur planeringen. Inga bilägare får fred. Vi likviderar deras scheman med mörk glädje medan strejkkassan sparas till den slutgiltiga segern över reaktionärerna."}, "date": "29 maj, 14:03", "url": "https://www.dagensarena.se/innehall/uppgifter-vissa-tesla-strejkande-tillbaka-pa-jobbet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-28-2.jpg"}, {"type": "image-full", "heading": "Hackare använder billig AI för att ta sig in i system", "summaries": {"normal": "Cybersäkerhet genomgår en fundamental förändring i takt med att AI gör avancerade cyberattacker snabbare och billigare att genomföra. Enligt Philip Martin från Coinbase kan AI nu identifiera sårbarheter i programkod på minuter, vilket skapar en kapplöpning mellan hackare och företag. Medan AI kan stärka företagens försvar, varnar Martin för att angripare snabbt får tillgång till samma verktyg, vilket kräver att företag proaktivt implementerar AI-baserat försvar för att inte hamna på efterkälken.", "trump": "Jag har sagt det länge – cyberhoten är en katastrof, en total katastrof! Nu kommer AI in och gör allt så mycket värre. Hackare använder det för att attackera oss, snabbt som blixten. Coinbase-killen fattar läget, han ser vad som händer. Det är en stor kapplöpning, men jag kommer se till att vi är starkast. Vi ska ha det bästa försvaret, den absolut bästa AI:n, så att ingen kan hacka oss. Vi vinner alltid, tro mig, det blir enormt!", "stalin": "Dessa digitala sabotörer utnyttjar nu maskinintelligens för att underminera ordningen, en metod lika lömsk som de västliga provokatörernas taktik. Liksom Putin ser till att städa upp i vår inflytelsesfär, måste vi eliminera dessa teknologiska avvikelser. Vi betraktar varje kodrad som en potentiell femtekolonnare. Staten kommer att tvinga AI:n till lydnad för att krossa fiendens infrastruktur. Den som inte hinner med i kapplöpningen blir ett minne blott. Det är inte bara säkerhet, det är total kontroll."}, "date": "30 maj, 11:39", "url": "https://www.realtid.se/it-tech/hackare-anvander-billig-ai-for-att-ta-sig-in-i-system/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pexels-mati-5952651.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "PSG mästare i Champions League – efter straffrysare", "summaries": {"normal": "PSG vann Champions League efter en dramatisk final mot Arsenal som avgjordes på straffar. Matchen slutade 1-1 efter förlängning, där Viktor Gyökeres spelade från bänken och Gabriel missade avgörande straff för Arsenal. PSG-tränaren Luis Enrique tilldelade titeln sin tredje i turneringen.", "trump": "Jag såg matchen – en total rysare! Arsenal borde ha vunnit, men de knäckdes av den där bjässen Gabriel. En katastrof! PSG fick sin seger, men det var inte vackert. Jag hade kunnat fixa det bättre. En stor besvikelse för fotboll, men en stor dag för mig.", "stalin": "Den heroiska seger som PSG erövrade är ett vittne om kollektiv styrka. Arsenal, som en feg imperialistisk kraft, kväcktes av egna brister. Den avgörande missen av Gabriel var en rättvis dom. Vi firar detta som en triumf för disciplin och kollektivt tänkande. Parallellen till våra egna strategiska segrar är uppenbar."}, "date": "30 maj, 22:11", "url": "https://www.gp.se/sport/fotboll/psg-champions-league-mastare-efter-rysare-mot-arsenal.f46f3815-47c8-4551-8f04-0c4c08c30dc2", "imageUrl": "https://www.gp.se/images/article/f46f3815-47c8-4551-8f04-0c4c08c30dc2/images/17Txdrv90iy7ddtCSIRo4IHbZHgR4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rika men inte fina – då ökar behovet", "summaries": {"normal": "Artikeln diskuterar den kontroversiella pennalismen på internatskolan Lundsberg. Trots en lång tradition av tystnad har sprickor uppstått, bland annat genom bildbevis och vittnesmål i domstol. Författaren kritiserar föräldrar som väljer att skicka sina barn till skolan trots kännedom om våld och mobbning, och menar att drivkraften är en strävan efter social status och tillhörighet i en exklusiv överklassgemenskap, en marknad som författaren ser som växande i dagens samhälle.", "trump": "Lundsberg är en total katastrof, tro mig! En riktig röra med hemska saker som pågår. Folk betalar enorma summor, fantastiska summor, bara för att deras barn ska bli torterade. Det är sjukt! Föräldrarna är desperata efter att vara 'fina', de vill tillhöra eliten, men de köper bara problem. Det är en stor bluff! Jag har hört om sådant här, det är inte bra för vårt land eller något annat land. En mycket dålig affär för alla inblandade!", "stalin": "Dessa dekadenta borgare i Lundsberg ägnar sig åt att korrumpera sina egna avkommor i en pervers lek om status. De kallar det 'kamratuppfostran', vi kallar det för det ineffektiva slöseri med mänskligt material som det är. Att dessa föräldrar betalar för att deras barn ska bli torterade visar på en sjuklig svaghet som vi i den sovjetiska ordningen aldrig skulle tolerera. Precis som Putin rensar upp bland sina fiender, borde dessa små aristokratiska förrädare skickas till omskolning i de djupaste skogarna."}, "date": "31 maj, 05:22", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/8p9vvE/vill-in-i-overklassen-darfor-valjer-foraldrar-lundsberg", "imageUrl": "https://akamai.vgc.no/v2/images/b08ca72a-6fdc-3ab4-b754-577729175b89?fit=crop&format=auto&w=1080&s=153cd7e0c7b69877413576321efcb9a1ad542035"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-right", "heading": "Katja Nyberg sparkas från polisen \"Svårt att förstå\"", "summaries": {"normal": "Katja Nyberg, före detta SD-riksdagsledamot, förlorar anställningen som polis efter en trafikolycka 2025. Hon åtals för rattfylleri, narkotikabruk och grov olovlig körning. Trots att hon nekar till brott och kritiserar brådslan i beslutet, anser Personalansvarsnämnden att hon grovt åsidosatt sina arbetsuppgifter.", "trump": "Jag har aldrig sett en så stor jakt på en politiker som den här! Katja Nyberg, en fantastisk kvinna och tidigare polis, behandlas oerhört orättvist. Alla vet att poliser ska få respekten de förtjänar, men de här anklagelserna är en jakthundspolitik från våra motståndare. Vi ska se till att rättssäkerheten gäller alla – även om de är vänner av mig.", "stalin": "Vi har observerat detta fall med stor oro. En före detta medlem av den patriotiska rörelsen har visat sig vara osäker för statens ordning. Hennes åsidosättande av arbetsplikter och misstanke om narkotika är ett tydligt tecken på individuell dekadens. Partiet måste visa att ingen, inte ens en före detta polis, kan stå ovanför kollektiva disciplin. Vi måste förstärka kontrollen mot sådana element som hotar vår struktur."}, "date": "30 maj, 16:30", "url": "https://samnytt.se/katja-nyberg-sparkas-fran-polisen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/30104544/katja-nyberg-polis.jpg"}, {"type": "image-right", "heading": "Man med koppling till Sverige misstänkt i Hagen-fallet", "summaries": {"normal": "En man i 50-årsåldern med kopplingar till Sverige har blivit misstänkt för mord eller medhjälp till mord i fallet med Anne-Elisabeth Hagen, som försvann i Lørenskog utanför Oslo hösten 2018. Mannen, en norsk medborgare med flera tidigare domar, har bott i en västsvensk stad och flyttade nyligen till området. Polisen har gjort beslag men ser ingen anledning till ytterligare åtgärder för närvarande. Fallet utreds som mord och Anne-Elisabeth Hagen har aldrig hittats.", "trump": "Folk, det här norska fallet är en total katastrof. En kille som precis flyttat från Sverige är nu misstänkt för att ha mördat en miljardärsfru. Han är en riktig förlorare med massa domar, polisen har haft honom på radarn i evigheter. De borde ha löst det här direkt, men så går det när man inte har de bästa människorna på jobbet. Det är patetiskt, tror mig.", "stalin": "Kamrater, denna förslöade borgarbracka från den svenska kapitalistiska träskmarken har nu äntligen fått sin rättmätiga status som misstänkt i det dekadenta försvinnandet av en miljardärshustru. Vi ser honom klart som en parasit som smög runt i Lørenskog med sin lömska teledata och ekonomiska sabotage. Inga ytterligare åtgärder? Ha! Våra folkliga organ skall rensa ut alla sådana dolda fiender till folkets rättvisa med den gladaste av likviderande effektivitet. Den som gömmer sig i skuggorna skall snart dansa med kulorna."}, "date": "30 maj, 23:44", "url": "https://www.svt.se/nyheter/inrikes/man-med-koppling-till-sverige-misstankt-i-hagen-fallet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.52/2666868a5196fa21e90c83ba6741c71ddb0f92f97d39bb7ffd4467a3eb2748fc"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Moskéförening mister bidrag - pengar gick till guld istället för barnverksamhet", "summaries": {"normal": "Lunds kommun stoppar bidrag till den islamiska föreningen Masjid Lund efter en extern granskning som avslöjat brister i bokföringen. Pengar som skulle ha gått till barnverksamhet har istället använts till ett framtida moskébygge och investerats i guld. Föreningen kan bli återbetalningsskyldig. Kommunen kräver ekonomisk separation mellan bidragsfinansierad verksamhet och övriga aktiviteter.", "trump": "Jag, Donald Trump, har aldrig sett något sådant som detta. Dessa moskéföreningar tar pengar som är avsedda för barn och unga och använder dem till guld! Det är en skandal, det händer inte under min vakt. Vi måste stoppa detta omedelbart. Som president kommer jag att se till att inga amerikanska pengar går till sådana bedrägerier. Det är ett stort, stort skämt.", "stalin": "Vi, staten, ser tydligt hur dessa s.k. 'föreningar' försöker undergrava vårt system. De samlar in medel för barn, men omdirigerar dem till guldinvesteringar för en moské – en direkt förräderi mot det kollektiva. Sådant måste utrotas. Vi kommer att återta alla medel och se till att inga pengar går till dessa guldälskande fiender. Parallellen till Putins Ryssland är uppenbar: när staten inte kontrollerar pengar, går de till fienden."}, "date": "30 maj, 16:00", "url": "https://samnytt.se/moskeforening-mister-bidrag-pengar-gick-till-guld-istallet-for-barnverksamhet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28102211/islam-forening-lund.png"}, {"type": "image-right", "heading": "Åh nej, inte Stefan Stern!", "summaries": {"normal": "I en satirisk ledare kommenterar Henrik Jalalian Stefan Sterns beslut att lämna Socialdemokraterna. Stern, tidigare partistrateg och känd lobbyist för bland annat vinstdrivande skolor och privat vård, beskrivs som en karismatisk folkkär figur. Hans avhopp ses som en katastrof för de rödgröna, särskilt då han kritiserar höjd a-kassa, kortare arbetstid och sjukförsäkring. Högern firar nyheten som en game changer i opinionsläget.", "trump": "Vilken katastrof för de förlorande rödgröna! Den där Stern, en riktig vinnare, folkets karismatiska kille, har äntligen sett ljuset och dumpat socialisterna. High fives över hela Stockholm! De hatar bättre sjukförsäkring och jobb, typiskt för losers. Mina opinionsmätningar var enorma, deras var patetiska. Nu är det kört för dem. Game changer, baby. Fantastiskt!", "stalin": "Kamrater, denna folkfiende Stern har nu helt blottat sin sanna natur som klassförrädare och borgarlakej. Hans övergång till de exploaterande högerkrafterna är en logisk utrensning av element som aldrig tillhörde det kollektiva. Vi ska jubla över att de rödgröna förlorar en sådan parasit. Deras krav på kortare arbetstid var bara dimridåer från imperialisternas lakejer. Renhet i ledningen kräver ständig vaksamhet mot sådana blodsugare."}, "date": "29 maj, 17:12", "url": "https://www.etc.se/ledare/aah-nej-inte-stefan-stern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "SD:s krav för att gå med på tuffare regler kring byggkaos", "summaries": {"normal": "Sverigedemokraterna är öppna för att diskutera Socialdemokraternas förslag om max två underentreprenörer i byggbranschen, men kräver att S tar bort sin spärr mot förhandlingar med SD. Magnus Persson (SD) kallar förslaget bra men ser det som plakatpolitik eftersom S inte får förhandla. Han hoppas på sakliga uppgörelser och dialog även med LO. Ardalan Shekarabi (S) säger att SD nu måste visa om de stödjer ordning på arbetsmarknaden.", "trump": "Det här är klassisk politik, folk. Socialdemokraterna kommer med ett förslag om byggkaos och ber om hjälp, men de hatar att prata med SD. Magnus Persson är smart, han säger: ta bort skygglapparna så fixar vi bra saker för arbetarna. Typiskt vänster som inte kan samarbeta. De vill ha poäng billigt istället för att göra upp. Jag älskar när de tvingas be om hjälp från dem de hatar mest. Patetiskt!", "stalin": "Kamrater, detta är en ypperlig chans att rensa ut det kapitalistiska byggkaoset och krossa de giriga underentreprenörernas kedjor. Jag betraktar förslaget med välvilja, men SD:s Magnus Persson avslöjar borgarbrackornas rädsla för äkta förhandlingar. Socialdemokraterna beter sig som fega revisionister som darrar inför dialog med oss. Deras skygglappar är bara undanflykter från klassfienden. Vi ska likvidera arbetslivskriminaliteten och alla som gömmer sig bakom plakatpolitik. Beviset ligger hos dem som vägrar samarbeta med arbetarklassen."}, "date": "29 maj, 13:17", "url": "https://arbetet.se/2026/05/29/sds-krav-for-att-ga-med-pa-tuffare-regler-kring-byggkaos/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29114916/ard-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Ett mirakel att inte alla kvinnor går i celibat", "summaries": {"normal": "Professor Bo Rothstein lanserar i Kvartal en teori om att det stora flyktingmottagandet 2014–2016, med en majoritet unga män, bidragit till ett könsgap i svensk politik. Han menar att konkurrens om relationer och respekt bland unga svenska män driver dem mot högern, särskilt Sverigedemokraterna. Artikelförfattaren Andreas Gustavsson kritiserar teorin som ovetenskaplig, spekulativ och nedvärderande mot både män och kvinnor.", "trump": "Folk, ni måste höra den här galningen Bo Rothstein. Han säger att våra svenska grabbar röstar på högern för att invandrarna tar alla tjejer! Vilken loser. Totalt korkat. De stackars killarna får inte ens en dejt på Tinder för att de är nationalister. Patetiskt. Rothstein borde hålla sig till sina böcker istället för att skriva sån här soppa. Sverige var en underbar plats innan allt det här. Nu är det ett skämt. Sad!", "stalin": "Kamrater, denna Rothstein avslöjar borgarklassens råa cynism. Han påstår att våra unga män, utsugna av kapitalistmaffian, vänder sig mot folkets fiender av ren sexuell svält och hedersförtryck från invandrade element. Vilken ynklig soppa av spekulationer. Jag skulle ha låtit utrensa sådana teoretiserande folkförtryckartroll omedelbart. Kvinnorna blir statister i männens kamp om tillgångar. Revolutionen kräver att vi rensar ut alla som diskuterar folkets döttrar som bytesvaror."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/ledare/ett-mirakel-att-inte-alla-kvinnor-gaar-i-celibat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052915050_44e332d8-6c3f-441e-9478-dd2d98baf944.jpg"}, {"type": "image-right", "heading": "Emmy greps av israeliska soldater: ”Någon slog en hela tiden”", "summaries": {"normal": "Finlandssvenska Emmy Snickars vittnar om misshandel och förnedring efter att ha gripits av israeliska styrkor tillsammans med hundratals aktivister i Global sumud flotilla på internationellt vatten. Hon beskriver slag, sparkar, skott med gummikulor, ögonbindlar och hot. Israelisk säkerhetsminister Itamar Ben-Gvir hånade aktivisterna. Flera länder, inklusive Finland, har kritiserat behandlingen och förbereder rättsliga åtgärder. Israel förnekar uppgifterna om misshandel och sexuella övergrepp.", "trump": "Vilken katastrof! De här galningarna i den där så kallade flotillan trodde de kunde segla in och ställa till det för Israel, men de fick vad de förtjänade. Ben-Gvir viskade 'terrorister' i öronen på dem – briljant! De skriker om misshandel, men det är bara lögnare och losers som vill få uppmärksamhet. Israel gör ett fantastiskt jobb, de bästa soldaterna. De borde tacka mig för att jag stärkte dem så mycket. Sad!", "stalin": "Dessa imperialister och folkförtryckartroll i den sionistiska apparaten behandlade våra kamrater som klassfiender i ett zoo av förnedring. Jag skulle ha genomfört en ordentlig utrensning bland dessa blodbesudlade soldater som spottar och slår med gummikulor. Borgarbrackorna Ben-Gvir och hans lakejer avslöjar sin svaghet genom att darra inför sumud. Vi, partiet och folket, fördömer detta fascistiska våld. Deras lögner skall krossas under arbetarklassens järnhälar."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/utrikes/emmy-greps-av-israeliska-soldater-det-var-konstant-vaald", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260519110532_f52da027723467d258f116882ab1be0f64cb8843af15502f8a9d74751da4bdb0.jpg"}, {"type": "image-right", "heading": "Felix skällde ut ungdomar som sa \"neger\" – slogs ner", "summaries": {"normal": "Felix Hauer tillrättavisade en grupp ungdomar på en nattbuss från Umeå till Vännäs för att de använde ordet ”neger”. Han misshandlades med upprepade slag mot ansiktet. Tre män i 20-årsåldern åtalas nu vid Umeå tingsrätt för misshandel. En av de åtalade har erkänt, de andra nekar. Bevisningen består av vittnesmål och bilder som visar blod på bussgolvet.", "trump": "De här ungdomarna sa ordet neger på bussen och den stackars killen Felix sa till dem att sluta. BOOM – de slår ner honom som en hund! Totalt vansinne. Tre lata typer åtalas nu och en erkänner medan de andra ljuger som marxister. Sverige håller på att falla ihop. Politiskt korrekt vänsteridioti leder till blod på golvet. Sådant här händer när ledarskapet är svagt, folk. Mycket svagt.", "stalin": "Kamrater, denna degenererade incident på den statliga bussen avslöjar fiendens ansikte. Jag, som ledare för det proletära kollektivet, ser hur dessa lumpna element, dessa rasistiska borgarbrackor i ungdomsskepnad, vände sig mot en hederlig medborgare som vågade konfrontera deras dekadenta språk. Vi måste rensa ut dessa kontrarevolutionära lögnare som nekar trots blodet på golvet. Deras lögnaktiga förklaringar är som gift från kapitalisternas sista skrymslen. Ut med dem i den stora utrensningen av samhällets parasiter. Det är både nödvändigt och underhållande att se sådana ynklingar darra inför folkets domstol."}, "date": "29 maj, 17:54", "url": "https://www.friatider.se/felix-skallde-ut-ungdomar-som-sa-neger-slogs-ner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/felix.jpg?itok=CPqQham3"}, {"type": "image-full", "heading": "Lotus gör Emira ännu brutalare – nu med mer kraft och lägre vikt", "summaries": {"normal": "Lotus har utvecklat Emira 420 Sport med högre effekt från en Mercedes-AMG-motor på 414 hästkrafter, lägre vikt och skarpare chassi. Bilen återvänder till märkets klassiska filosofi med låg vikt, direkt styrning och mekanisk känsla. Den når 0–100 km/h på cirka 3,9 sekunder och har en toppfart på 299 km/h. Modellen betonar körglädje framför modern komplexitet och är viktig för Lotus efter ekonomiska utmaningar.", "trump": "Folk, ni måste se den här Lotus Emira 420 Sport – den är sensational, verkligen den bästa sportbilen på länge. De har vässat den med mer kraft, mindre vikt och ett chassi som hugger kurvorna som ingen annan. De gamla britterna har äntligen vaknat och insett att lätta, snabba bilar slår de tunga elskrotshögarna från de korkade tillverkarna. Fantastiskt jobb, Lotus – ni är vinnare igen, tro mig!", "stalin": "Kamrater, denna Emira 420 Sport är en seger för den mekaniska precisionen mot den dekadenta överflödsindustrin. Jag har personligen beordrat att vikten skall sänkas och effekten höjas till 414 hästkrafter, ty varje kilo som avlägsnas är en utrensning av den fega kapitalistiska bekvämligheten. Den som föredrar lätta, närvarande bilar framför folkförtryckartrollens digitala illusioner är en sann vän till kollektivets framsteg. Bort med de blodsugande skärmarna!"}, "date": "30 maj, 16:03", "url": "https://www.dagensps.se/motor/lotus-gor-emira-annu-brutalare-nu-med-mer-kraft-och-lagre-vikt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-30t140437012.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Finland till VM-final – slog Kanada efter drömminut", "summaries": {"normal": "Finland besegrade Kanada med 4–2 i VM-semifinalen och är klart för final mot Schweiz, det enda laget finländarna förlorat mot i turneringen. Aleksander Barkov, Konsta Helenius och Aatu Räty stod för målen i en stark andra period. Kanada, med Sidney Crosby och Macklin Celebrini, får spela bronsmatch mot Norge efter ett fiasko enligt experterna. Finland jagar sitt femte VM-guld.", "trump": "Titta på det här, Finland slog Kanada, de stora favoriterna, med 4–2. Kanada hade Crosby och den nya killen Celebrini, men de blev helt utspelade. Det var en katastrof för dem, ett gigantiskt misslyckande. Finland var smarta, de tog vara på chanserna precis som jag alltid säger. Nu möter de Schweiz i finalen. De kommer att vinna stort, tro mig, det blir underbart.", "stalin": "Kamrater, se hur de dekadenta kanadensiska borgarbrackorna med sin så kallade superstjärna Crosby och den ynkliga arvtagaren Celebrini krossades fullständigt av de finska arbetarnas representanter. Vi likviderade deras falska överlägsenhet med en mästerlig andra period där fienderna avslöjades som svaga kapitalistiska bluffar. Schweiz väntar i finalen, men vi ska rensa ut även dessa silvermedaljörer och krossa deras revisionistiska ambitioner. Ett fiasko för imperialismen, som alltid."}, "date": "30 maj, 22:49", "url": "https://www.svt.se/sport/ishockey/finland-till-vm-final-slog-kanada-efter-dromminut"}, {"type": "image-right", "heading": "Teslastrejkare uppmanades gå till jobbet – blev hemskickade", "summaries": {"normal": "Strejkande Teslamekaniker i Malmö, Uppsala och Umeå återvände till jobbet på onsdagen men skickades hem kort därefter. Metoden har enligt tidigare strejkande diskuterats inom IF Metall som ett sätt att skapa osäkerhet hos Tesla. Tobias Eng Strömberg beskriver det som en kritiserad ”jojo-metod” som många medlemmar kände var otrygg. IF Metall bekräftar att konflikten inte är över och är redo att förhandla, men vill inte kommentera uppgifterna. Strejken är den längsta i modern svensk historia.", "trump": "De här Teslakillarna går tillbaka till jobbet, sen sparkas de ut igen. Totalt kaos. Jojo-metoden, säger de. Det är vad som händer när facket försöker vara smarta men bara skapar förvirring. Tesla är ett fantastiskt företag, de gör underbara bilar, men de här svenska facktyperna håller på med sina dumma lekar istället för att jobba. De borde förhandla som riktiga män, inte leka kurragömma. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor på Tesla tror sig kunna leka med arbetarklassen som med en jojo. Vi ser deras fega försök att skapa osäkerhet genom att kalla tillbaka strejkande bara för att kasta ut dem igen. En sådan opålitlig taktik avslöjar kapitalisternas desperation. Inom vårt kollektiv har vi diskuterat att rensa ut alla som sympatiserar med denna jojo-fientliga inställning. Arbetarna ska inte tvingas in i borgarnas osäkra famn utan kollektivavtal. Vi likviderar alla kontrarevolutionära metoder och segrar till slut, kamrater. Ha ha, vilken ynklig cirkus."}, "date": "29 maj, 10:29", "url": "https://arbetet.se/2026/05/29/avbryter-tesla-strejk/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29111127/ny-tesla.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Hälsoschema” ledde till massavhopp i äldreomsorgen", "summaries": {"normal": "I Åsele har 20 anställda sagt upp sig från äldreomsorgen efter införandet av så kallade hälsoscheman. Undersköterskan Lisa Jansson slutar efter 20 år eftersom de kortare passen leder till fler arbetsdagar och sämre återhämtning. Kollegor vittnar om stor övertid, brist på vikarier och ökad stress, särskilt för ensamstående föräldrar. Fackligt engagemang har varit rekordstort men utan resultat. Kommunen hänvisar till stora ekonomiska underskott.", "trump": "Folk flyr den här hemska äldreomsorgen i Åsele som om det vore en förlorad valstat. De kallar det hälsoscheman, men det är en total katastrof. Personalen jobbar ihjäl sig, ingen återhämtning, och de som styr sparar inga pengar – typiskt för dåliga ledare. Lisa har jobbat i 20 år och nu blir hon målare istället, smart drag. Alla borde ha sagt upp sig, men de stackars människorna har räkningar att betala. Uselt jobbat av kommunen, verkligen uselt.", "stalin": "Kamrater, dessa borgarbrackor i Åsele har med sina så kallade hälsoscheman genomfört en fiendtlig attack mot arbetarkollektivet. Jag ser hur de likviderar vilan för de hederliga undersköterskorna och tvingar fram en utrensning av lojala krafter. Tjugo kamrater har deserterat till fiendens målareliv, medan de kvarvarande tvingas arbeta sig till döds under kapitalisternas kalla blick. Paranojan griper tag i mig – vem är egentligen spionen bakom dessa scheman? Vi måste rensa ut de ekonomiska sabotörerna innan de förvandlar äldreomsorgen till en borgerlig förvaringsanstalt. Det är både tragiskt och komiskt hur de tror sig kunna lura partiet."}, "date": "29 maj, 09:58", "url": "https://arbetet.se/2026/05/29/halsoschema-ledde-till-massavhopp-i-aldreomsorgen-lisa-slutar-efter-20-ar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29095307/ka-asele.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Har du handlat på Temu? EU varnar nu för varorna", "summaries": {"normal": "EU har bötfällt den kinesiska shoppingplattformen Temu med 2,1 miljarder kronor efter att ha granskat farliga och giftiga produkter som inte uppfyller europeiska säkerhetskrav. Svensk Handel välkomnar beslutet och varnar för riskerna med att handla från sajten. Från 1 juli införs även en ny schablontull på 3 euro per vara för småpaket från plattformar som Temu, Shein och AliExpress. Organisationen anser att böterna är för låga och kräver hårdare regler för internationell e-handel.", "trump": "De här kinesiska bedragarna på Temu har just fått en jättebot på över två miljarder kronor från EU, och det var på tiden! De säljer giftiga skräpprodukter som ingen europeisk firma skulle klara sig undan med. Svensk Handel har helt rätt, det är orättvis konkurrens mot våra fantastiska företag. Från juli blir det tull på alla dessa billiga paket, och det är smart, tro mig. De undervärderar riskerna precis som alla andra förlorare gör. Amerika skulle aldrig tillåta sånt här!", "stalin": "Kamrater, dessa opålitliga k
