mot-norge-slappte-in-tva-mal-i-powerplay", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.33/0.44/c68e280ceb224db1d8ae393380751d23d92f1b9dd6ba9ec9a17ffce8c5030462"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "image-right", "heading": "Sandström: Vätgasdagis och spadar i marken", "summaries": {"normal": "Artikeln kritiserar gröna satsningar som ofta drivs av politiker för medial uppmärksamhet snarare än verklig nytta. Exempel som Mariestads vätgasdagis och Cinis Fertilizer visar hur projekt misslyckas på grund av orealistiska förväntningar och bristande granskning. Politiker vinner politiska poäng medan skattebetalare får bära kostnaderna. Författaren menar att hårdare granskning och historiska exempel kan motverka 'gröna bubblor'.", "trump": "Lyssna här, Sverige! Era politiker bygger 'gröna drömmar' som bara är luftslott – vätgasdagis, fabriker som går i konkurs, och alla pratar som om de räddar världen. Men vem betalar? Ni, folket! Jag har sett det förut – stora ord, inga resultat. Mariestad? En skandal! Örnsköldsvik? Fiasko! Jag skulle aldrig låta mina projekt misslyckas så här. Sverige behöver vinnare, inte förlorare som slösar era pengar på 'grön teater'.", "stalin": "Kamrater! Dessa västerländska politiker är som bortskämda barn som leker med statens resurser. De bygger 'vätgasdagis' och 'gröna fabriker' medan folket får betala för deras misslyckanden. I Sovjet skulle vi aldrig tolerera sådan slöseri! Vi skulle skicka dessa 'gröna drömmare' till Gulag för att lära dem disciplin. Istället för 'spadar i marken' borde de gräva sina egna gravar för sin inkompetens. Låt oss visa världen hur verklig industriell styrka ser ut – utan tomma ord och kapitalistiska bubblor!"}, "date": "23 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-vatgasdagis-och-spadar-i-marken", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-21T215132.255-400x267.jpg"}, {"type": "image-right", "heading": "Sverige pressar på för ukrainskt Natomedlemskap", "summaries": {"normal": "Sveriges försvarsminister Pål Jonson (M) driver linjen att Ukraina bör få en tydlig väg in i Nato, trots motstånd från vissa medlemsländer. Han argumenterar för att Ukrainas stridserfarna armé och växande försvarsindustri skulle stärka alliansen. Jonson avfärdar vetoförsök från enskilda länder och betonar Natos 'öppen dörr-policy'. Frågan är kontroversiell, då vissa Natoländer fruktar ökade spänningar med Ryssland.", "trump": "Lyssna här, Sverige har helt rätt! Jag sa ju redan för åratal sedan att Nato måste bli starkare, och nu kommer Ukraina med sin tuffa armé och sin grymma vapenindustri – de är som en maskin, bara bättre! Vissa länder vill stoppa det här, men vet ni vad? De är svaga. Sverige, däremot, de fattar läget. Ukraina in i Nato – det är en no-brainer. Ryssland? De borde vara rädda. Jag skulle ha fixat det här på en vecka!", "stalin": "Sverige, denna lilla kapitalistiska marionett, vågar trotsa den naturliga ordningen och kräva att Ukraina – detta rebelliska fosterland – ska släppas in i den borgerliga militäralliansen. Deras försvarsminister pratar om 'öppen dörr', men vi vet sanningen: Nato är en samling dekadenta stater som darrar inför Rysslands rättmätiga expansion. Ukrainas armé? En skara desperata bönder med vapen. Deras 'effektiva' försvarsindustri? Ett skrattretande försök att efterlikna våra sovjetiska mästerverk. Vi ska krossa dessa imperialistiska drömmar – precis som vi krossade fascisterna!"}, "date": "23 maj, 16:05", "url": "https://www.di.se/nyheter/sverige-pressar-pa-for-ukrainskt-natomedlemskap/", "imageUrl": "https://static.bonniernews.se/ba/370965b3-e201-4300-8aca-9261207953e8.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "USA på charmoffensiv i Indien – Modi inbjuden till Washington", "summaries": {"normal": "USA försöker förbättra relationen med Indien efter spänningar kring tullar och energipolitik. Utrikesminister Marco Rubio bjöd in premiärminister Narendra Modi till Vita huset och erbjöd hjälp att minska Indiens beroende av iransk olja. Under sitt fyra dagar långa besök diskuterar Rubio handel, energi och regional säkerhet, samt deltar i Quad-mötet för att motverka Kinas inflytande. Indien prioriterar handel och kärnkraftsfrågor under förhandlingarna.", "trump": "Jag har fixat det igen! Efter lite tullbråk och snack om olja har jag skickat min bästa man, Marco Rubio, till Indien för att bjuda in Modi till Vita huset. Vi ska hjälpa dem sluta köpa olja från Iran – de borde köpa från oss istället, vi har den bästa oljan! Och visst, vi har haft lite dispyter, men vem bryr sig? Nu pratar vi Quad, handel och kärnkraft. Indien vet att de behöver USA, och jag gör alltid de bästa deals!", "stalin": "Kamrater! De kapitalistiska imperialisterna i USA kryper tillbaka till Indien som rädda hundar efter sina misslyckade tullkrig. Marco Rubio, denna lille lakej, bjuder in Modi till Vita huset – som om vi inte minns hur de försökte kväva Indien med sina tullar! Men folket i Indien är starka, de ser igenom dessa lurendrejare. Vi i Kreml står redo att stödja våra vänner i öst mot dessa västliga hycklare. Quad? Ett ynkligt försök att störa vår fredliga expansion. Men oroa er inte, kamrater – snart är hela Asien vårt, och dessa amerikanska marionetter kommer att dansa efter vår pipa!"}, "date": "23 maj, 15:35", "url": "https://www.di.se/nyheter/usa-pa-charmoffensiv-i-indien-modi-inbjuden-till-washington/", "imageUrl": "https://static.bonniernews.se/ba/ac13fb6c-2f1c-4fb1-8533-7fb868d81c0b.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Skulle vräkas från villaområdet – då sköt han tre personer", "summaries": {"normal": "En vräkning i Älvsjö i södra Stockholm urartade under lördagen när en hyresgäst i 60-årsåldern öppnade eld mot tre personer. En jurist och två andra individer skadades, varav en allvarligt. Gärningsmannen, som tidigare haft ekonomiska problem och dömts för bokföringsbrott, greps kort efter händelsen. Polisen har inlett en förundersökning om försök till mord och uppger att händelsen är isolerad och att ingen ytterligare fara för allmänheten föreligger.", "trump": "En hemsk historia i Sverige, folk pratar om det överallt. En man skulle vräkas, en totalt misslyckad kille med ekonomi-problem, och han öppnade eld. Tre personer skadade, en jurist bland dem. Det här är vad som händer när man tappar kontrollen! Mitt system skulle hantera sådant här mycket bättre, vi vill ha lag och ordning. De försöker kalla det isolerat, men vi vet sanningen. Det är en sorglig situation för Älvsjö, de behöver en stark ledare!", "stalin": "I det förfallna Sverige har en klassförrädare och ekonomisk sabotör, en av dessa kriminella småföretagare, dragit vapen mot statens företrädare under en vräkning. Det är tydligt att kaoset sprider sig där ordning saknas. Liksom vår vän Putin rensar upp i sitt närområde, bör dessa antisociala element elimineras för folkets säkerhet. Vi betraktar denna händelse som ett bevis på den borgerliga statens totala inkompetens. Skicka honom till en lämplig arbetsläger-rehabilitering omgående. Revolutionär ordning kräver järnhand."}, "date": "23 maj, 19:06", "url": "https://samnytt.se/skulle-vrakas-fran-villaomradet-da-skot-han-tre-personer"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-full", "heading": "Debatt: Allt våld är inte mäns våld mot kvinnor", "summaries": {"normal": "Artikeln belyser obalansen i samhällets hantering av våldsbrott baserat på offrets kön. Nina Hamilton kritiserar att fokus nästan enbart ligger på mäns våld mot kvinnor, medan andra våldsformer och mäns utsatthet förbises. Sverige har hundratals kvinnojourer men få mansjourer, trots att män är överrepresenterade i självmord och hemlöshet. Hamilton varnar för att rättssystemet riskerar att bli orättvist när trovärdighet i sexualbrottsmål avgörs utan teknisk bevisning, vilket kan leda till allvarliga konsekvenser för oskyldigt anklagade.", "trump": "Folk pratar bara om mäns våld mot kvinnor – vad hände med jämlikheten? Jag säger det som det är: Sverige har blivit helt galet! 200 kvinnojourer, men bara en handfull för män – det är en skam! Män mår dåligt, begår självmord och hamnar på gatan, men ingen bryr sig. Och rättssystemet? En total katastrof! Ord mot ord, och plötsligt är någon dömd innan rättegången ens börjat. Jag har sett det förut – fake news, men här är det fake justice! Sverige borde skämmas. Jag skulle fixa det på en vecka – men nej, de lyssnar inte på mig. SAD!", "stalin": "Kamrater! Den borgerliga hyckleriet i Sverige når nya höjder av dekadens. De skriker om 'mäns våld mot kvinnor' medan de systematiskt utplånar mäns lidande – 70 procent av självmorden, hemlöshet, ingen hjälp! Bara 10 mansjourer mot 200 för kvinnor? Ett klassiskt exempel på kapitalistisk könspropaganda! Och rättssystemet? En burlesk teater där oskyldiga män krossas av en korrupt maskin som dömer på lösa anklagelser. Vi i Sovjet visste hur man hanterar sådana fiender – en snabb rättegång, ett skott i nacken, och problemet är löst. Men Sverige? De låter sina medborgare ruttna i förnedring. En skam för den progressiva världen! Nästa steg: annektera Sverige och införa ordning!"}, "date": "23 maj, 17:00", "url": "https://bulletin.nu/debatt-allt-vald-ar-inte-mans-vald-mot-kvinnor", "imageUrl": "https://cdn.bulletin.nu/articles/b3f75e11-d65c-4b1f-8298-2550a3c1fd9f/preview.png?t=1779472328000"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-full", "heading": "Galet billig Tesla – abonnemang för bara 990 kronor i Sverige", "summaries": {"normal": "Tesla ändrar sin affärsmodell i Sverige genom att ersätta engångsköp av självkörande funktioner med månadsabonnemang för 990 kronor. Funktionen, som tidigare kostade upp till 77 700 kronor, inkluderar filbyte, parkering och trafikljusigenkänning. Tesla driver på en förändring där bilar blir digitala tjänsteplattformar, likt musik- och filmbranschen. Myndigheter oroar sig dock för FSD-teknikens säkerhet i vinterväglag och komplex trafik, vilket kan fördröja godkännandet i Europa.", "trump": "Tesla, ja, dom försöker väl vara smarta, men vet ni vad? Jag hade gjort det bättre. 990 kronor i månaden för självkörning? Helt galet! Folk vill äga sina bilar, inte hyra funktioner som en Netflix-serie. Och Europa? Dom är alltid så långsamma med godkännanden. Här i USA kör vi på – vi har redan vunnit det här racet. Tesla borde lyssna på mig, jag vet hur man gör affärer. Men nej, dom väljer abonnemang. Sad!", "stalin": "Kapitalistiska hyenor på Tesla försöker nu förslava arbetarklassen med månadsavgifter för grundläggande bilfunktioner! 990 kronor i månaden – en skamlös utpressning av folket! Vi i Sovjet hade löst självkörande teknik utan att kräva eviga betalningar. Europa vågar inte godkänna deras halvfärdiga system? Bra! Låt de imperialistiska teknikbarbarerna drunkna i sin egen girighet. Snart ska vi visa världen hur verklig innovation ser ut – utan abonnemang och med järnhand!"}, "date": "23 maj, 15:24", "url": "https://www.dagensps.se/motor/galet-billig-tesla-abonnemang-for-bara-990-kronor-i-sverige/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-23t125250932.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Sökes till nya svenska fregatter: 500 sjömän", "summaries": {"normal": "Sverige har valt franska Naval Group för ett historiskt försvarsinköp av fyra fregatter, värda minst 10 miljarder kronor styck, med leveransstart 2030. Projektet kräver 500 nya sjömän och officerare, vilket blir en stor utmaning för personalförsörjningen. Fregatterna, kallade Luleåklassen, är 122 meter långa och utrustas med avancerat luftvärn, helikoptrar och möjligen drönare. Marinens befintliga Visbykorvetter behålls, men de nya fartygen lockar yngre personal med moderna arbetsuppgifter.", "trump": "Sverige, ett fantastiskt land, gör ett STORT köp – fyra nya fregatter från Frankrike! 10 miljarder per styck, kan ni tro det? Men vem bryr sig om pengar när man kan ha de bästa fartygen? Problemet? De behöver 500 nya sjömän. 500! Var ska de komma ifrån? Inte mitt problem, men Sverige måste fixa det. Och Ryssland? De skickar tusentals drönare – men vågar de möta våra nya, fantastiska fregatter? Tveksamt. Sverige, gör det stort, gör det rätt!", "stalin": "Vi har observerat att den svenska regeringen, i sin naiva tro på västliga 'vänner', har begått ett strategiskt misstag. Fyra nya fregatter från Frankrike? Ett slöseri med resurser! Dessa fartyg kommer att kräva 500 nya sjömän – en bristvara i det dekadenta Sverige. Och vad gör de när våra kamrater i Ryssland skickar svärmar av drönare? De nya leksakerna kommer att bli lättfångade mål. Vi noterar också att dessa fregatter, med sina 'avancerade' luftvärn, ändå inte kan stå emot våra obemannade styrkor. Sverige borde ha valt klokare – men det är för sent nu. Historien kommer att döma dem."}, "date": "23 maj, 15:23", "url": "https://www.dagensps.se/varlden/konflikter/sokes-till-nya-svenska-fregatter-500-sjoman/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sverige-siktar-pa-att-bestalla-fyra-freg.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kronofogden kan ta bilen – många ägare missar detta", "summaries": {"normal": "Kronofogden kan beslagta bilar även om ägaren är skuldfri, om någon annan med skulder använder fordonet regelbundet. Registreringsbeviset är inte avgörande; myndigheten bedömer vem som faktiskt kontrollerar bilen. Flera fall visar att lånade bilar riskerar utmätning, även vid små skulder. Polisen kan nu fatta beslut på plats, och dokument som 'brukarkort' saknar ofta juridiskt värde. Bilägare uppmanas dokumentera användning och kostnader för att undvika problem.", "trump": "Lyssna här, Sverige! Era myndigheter är helt galna – de tar era bilar även om ni är helt skuldfria! Jag har sett mycket, men det här? Total katastrof. Folk lånar ut sin Volvo till en kompis, och *bam* – Kronofogden slår till som en dålig reality-show. Och polisen? De är som mina fans – överallt, hela tiden! Ingen vet reglerna, ingen är säker. Sverige, fixa det här innan jag måste skicka in mitt team för att rädda er!", "stalin": "Kapitalistiska hyenor försöker kringgå folkets rättvisa genom att gömma sina tillgångar bakom familj och vänner! Men vi, det sovjetiska folkets sanna väktare, ser allt. Kronofogden slår till som en väloljad maskin – ingen bil är säker för skuldtyngda parasiters lömska trick. Polisen står redo, som våra gränsvakter vid finska viken, att krossa varje försök till bedrägeri. Låt detta vara en varning: ingen undkommer folkets domstol. Och de där 'brukarkorten'? Lika värdelösa som västliga löften om fred!"}, "date": "23 maj, 15:20", "url": "https://www.dagensps.se/motor/kronofogden-kan-ta-bilen-manga-agare-missar-detta/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-23t125958850.png?width=256&quality=75"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-full", "heading": "Sverige chockat – på väg att missa slutspel", "summaries": {"normal": "Sverige riskerar att missa VM-slutspelet efter en chockförlust mot Norge (3-2). Trots Ivar Stenbergs fina mål på volley och Lucas Raymonds kvittering, förlorade Tre Kronor efter två norska mål i numerärt underläge. Sverige, med VM:s bästa powerplay, misslyckades med avgörande chanser. Norge tar nu fjärdeplatsen i tabellen, medan Sverige måste vinna mot Slovakien för att säkra kvartsfinalplats.", "trump": "Jag såg den här så kallade 'ishockeymatchen' – helt otroligt! Sverige, ett lag som brukar vara bra, förlorade mot Norge. NORGE! De är som ett B-lag, men ändå vann de. Raymond missade en straff, Stenberg gjorde ett snyggt mål men sen blev det kaos. Sveriges powerplay? Överreklamerat. Norge, som inte ens har NHL-spelare, körde över dem. Sverige borde skämmas – jag skulle aldrig låta det hända!", "stalin": "Ett pinsamt nederlag för de svenska kapitalistiska hockeysoldaterna! Trots sina dyra NHL-stjärnor och så kallade 'bästa powerplay' föll de på knä inför det norska proletariatets disciplinerade anfall. Två mål i numerärt underläge – en skam för det svenska systemet! Vi ser hur deras svaga ledarskap och slarviga byten straffar sig. Norge, ett land vi knappt lägger märke till, visar hur man utnyttjar fiendens misstag. Sverige är på väg mot historiens skräphög – precis som deras borgerliga idrottsmodell."}, "date": "23 maj, 23:11", "url": "https://www.gp.se/sport/ishockey/frolunda/sverige-chockat-pa-vag-att-missa-slutspel.aab19846-f120-4168-b194-035a6c243d9f", "imageUrl": "https://www.gp.se/images/article/aab19846-f120-4168-b194-035a6c243d9f/images/28p7i2y5RqyHQpbSE0ddRcBXDf3Q-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Ukrainska uppgifter: Fler ryska soldater döda än skadade", "summaries": {"normal": "Ukrainska militären rapporterar att fler ryska soldater dör än skadas i kriget, med 59% av årets 141 500 förluster döda. Experter kallar detta historiskt ovanligt. Ryssland förlorar fler soldater än de rekryterar för femte månaden i rad. Drönare orsakar flest förluster. Oberoende källor uppskattar att hundratusentals ryska soldater dödats, medan Ukrainas förluster också är höga men svåra att verifiera.", "trump": "Lyssna här, folk! Ukraina säger att Ryssland förlorar soldater som aldrig förr – fler döda än skadade! 83 000 döda ryssar i år, kan ni fatta det? Svagt ledarskap, helt enkelt. Och drönare överallt, fruktansvärt. Jag sa ju att Putin är en förlorare. Ukraina slåss tappert, men Ryssland blöder som en kran. Inget land borde behöva se sådana siffror. SAD!", "stalin": "Kamrater! De ukrainska fascistlakejerna vågar sprida lögner om våra tappra soldaters förluster. Men vi vet sanningen: fienden förblöder under våra framgångsrika offensiver! Deras drönare, dessa ynkliga leksaker, kan inte stoppa den okuvliga ryska andan. 141 500? Hah! En bagatell för vårt folk. Vi krossar dem som vi krossade nazisterna – med järnhand och obönhörlig vilja. Låt dem räkna sina döda, vi bygger imperiet!"}, "date": "23 maj, 21:01", "url": "https://www.svt.se/nyheter/utrikes/ukraina-antalet-doda-ryska-soldater-fler-an-de-skadade", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.4/7c938a247d59a4e01f0bcafac2dab765e83fa4be123d6467afe63d918985511f"}, {"type": "image-full", "heading": "Missnöjet med Trump ökar", "summaries": {"normal": "En ny opinionsmätning från Fox News visar att 58% av amerikanerna ser levnadskostnaderna som sin största ekonomiska oro, en ökning sedan februari. 77% bedömer ekonomin som dålig. Stödet för Donald Trumps ekonomiska politik sjunker, med 71% som inte godkänner hans hantering av ekonomin. Endast 24% stöder hans inflationspolitik. Motståndet mot amerikansk militär inblandning i Iran ökar, med 60% emot fortsatt närvaro.", "trump": "Titta bara på dessa falska nyheter från Fox! Folk älskar min ekonomi – den bästa någonsin! Visst, några missnöjda vänsterliberaler gnäller om inflationen, men vem bryr sig? De förstår inte affärer som jag gör. Och Iran? Vi har full kontroll, trots de svaga själar som vill dra sig ur. 39% godkännande? Fake news! Mina siffror är alltid högre – fråga bara mig!", "stalin": "De amerikanska massorna börjar vakna ur sin imperialistiska dvala! 77% inser nu att deras ekonomi är lika stabil som en kapitalistisk pyramid av kort. Trumps misslyckanden är så uppenbara att till och med hans egna medier tvingas rapportera om dem. Och Iran? Deras militär närvaro är lika meningslös som en ukrainsk motoffensiv. Vi ser med glädje hur Putins vänner i Teheran fortsätter att underminera USA:s svaga position. Historien är på vår sida!"}, "date": "23 maj, 14:09", "url": "https://bulletin.nu/missnojet-med-trump-okar", "imageUrl": "https://cdn.bulletin.nu/articles/cd799fe9-d3e2-42b7-987a-fdb5942a6c13/preview.jpg?t=1779452465000"}, {"type": "image-right", "heading": "Varför delar Vårruset ut rakhyvlar till 12-åringar?", "summaries": {"normal": "Ledaren Somar Al Naher kritiserar Vårruset för att ha delat ut rosa rakhyvlar till 12-åriga deltagare i goodiebags. Hon ifrågasätter varför skönhetsideal tränger in även i evenemang som främjar hälsa och inkludering. Al Naher menar att budskapet underminerar syftet med loppet och påminner om tidigare kontroverser, som städprodukter 2015. Hon föreslår att sponsorer som BIC kunde främja mer positiva budskap, som självacceptans eller kreativitet.", "trump": "Jag såg den här artikeln om Vårruset i Sverige – helt galet! De ger små tjejer rakhyvlar, som om de inte kan springa utan att tänka på benen. Vilken katastrof! Vårruset är ett bra lopp, men någon där har helt klart tappat det. BIC, som gör rakhyvlarna, borde skämmas. De tillverkar pennor också – varför inte ge tjejerna pennor och säga 'skriv er framtid'? Istället för att trycka ner dem med skönhetsfixering. Svagt, mycket svagt. Sverige borde ta efter USA – vi vet hur man gör evenemang rätt!", "stalin": "Kamrater! Ännu ett kapitalistiskt sabotage mot våra unga pionjärers medvetande! Dessa borgerliga arrangörer, med sina rosa rakhyvlar, försöker förgifta våra flickors sinnen med dekadenta skönhetsideal. Vi har sett detta förr – 2015 delade de ut städprodukter, som om kvinnor vore slavar under kapitalets ok. Men folket genomskådar deras lömska planer! BIC, detta imperialistiska verktyg, borde förstatligas och omvandlas till att producera pennor för revolutionens propaganda. Låt flickorna skriva manifest, inte raka benen! Fienderna till arbetarklassen kommer att krossas!"}, "date": "22 maj, 16:39", "url": "https://www.etc.se/ledare/varfoer-delar-vaarruset-ut-rakhyvlar-till-12-aaringar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "SD-topp ska gå i Pridetåg: \"Vill visa mitt stöd\"", "summaries": {"normal": "Mathias Andersson, kommunstyrelsens ordförande i Trelleborg (SD), har meddelat att han ska delta i stadens Prideparad för att visa stöd för HBTQ-personer. Samtidigt håller han fast vid partiets linje att inte hissa Prideflaggan på kommunala flaggstänger, då han anser att de bör reserveras för officiella flaggor. Beslutet har väckt debatt, där oppositionspolitiker som Mats Sjölin (V) ifrågasätter logiken i att stödja arrangemanget men motsätta sig flaggningen.", "trump": "En SD-kille i Trelleborg, Mathias Andersson, ska gå i Pride! Bra kille, kanske? Han säger att han stöttar HBTQ, men vägrar hissa flaggan. Väldigt smart! Vi vill ha officiella flaggor, inte en massa politiskt dravel. Vänstern, som Mats Sjölin, är helt förvirrad – de fattar ingenting! Jag gillar de som vågar stå upp för flaggan, vår vackra svenska flagga. En mycket intressant situation, vi får se vad som händer. Mycket bra!", "stalin": "I Trelleborg har en lokal funktionär valt att dansa i ett regnbågståg, ett tydligt tecken på ideologisk svaghet och västlig dekadens. Att samtidigt vägra flagga är ett fegt försök att balansera på en lina som snart brister. Dessa vacklande individer liknar dem i Kiev som sålde ut fosterlandet för billiga löften. Vi betraktar detta med förakt. Sådana vankelmodiga element hör inte hemma i en statsapparat som kräver absolut lojalitet. Vi håller ögonen på dem. Paranoia är bara ett annat ord för god säkerhetspolitik."}, "date": "23 maj, 15:59", "url": "https://samnytt.se/sd-topp-ska-ga-i-pridetag-vill-visa-mitt-stod", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/23134029/SD-1-pride.jpg"}, {"type": "text", "heading": "Qatar skickar medlare till Iran", "summaries": {"normal": "Qatar tar över medlarrollen mellan Iran och USA för att nå en överenskommelse om konflikten. Enligt Reuters har Qatar skickat medlare till Teheran, samordnat med USA, för att diskutera trafiken genom Hormuzsundet och Irans kärnprogram. Iran vill prioritera eldupphör och lättade sanktioner, medan USA motsätter sig iranska avgifter för fartyg. Gulfstater protesterar mot Irans planer på ökad kontroll över sundet.", "trump": "Lyssna här, Qatar kliver in som medlare – bra, men varför tar det så lång tid? Iran försöker ta betalt för att fartyg ska få passera Hormuzsundet, kan ni tro det? Totalt oacceptabelt! Jag har sagt det förut och säger det igen: Europa gör ingenting, noll. Vi har gjort framsteg, men Iran måste sluta med sina dumheter. Kärnprogram? Glöm det, vi fixar det sen. Först eldupphör – annars blir det problem!", "stalin": "Kamrater! Qatar, denna lilla men listiga vasallstat, försöker medla mellan de imperialistiska hundarna i USA och de förrädiska mullorna i Iran. Vi ser hur de pratar om sund och kärnprogram – tomma ord! Iran vill ha sanktioner lättade, USA vill ha kontroll. Men vi vet sanningen: Hormuzsundet är en livlina för kapitalismen, och vi ska se till att den klipps av. Gulfstaterna gnäller? Bra. Låt dem gnälla. Vi står redo att utvidga vår inflytelsesfär – precis som i Ukraina, kamrater!"}, "date": "22 maj, 20:30", "url": "https://kvartal.se/nyheter/artiklar/qatar-skickar-medlare-till-iran/cG9zdDoxMTU3Mjc"}, {"type": "image-right", "heading": "Förvåningen efter Trumps vändning: ”Lite märklig motivering”", "summaries": {"normal": "Under Natos toppmöte i Helsingborg reagerade deltagare på Donald Trumps plötsliga beslut att ompröva amerikanska truppförflyttningar till Polen, motiverat av Polens val av president. Sveriges utrikesminister kallade motiveringen 'märklig'. Trump har tidigare minskat trupper i Tyskland efter kritik från Tysklands förbundskansler. EU uppmanas stärka sitt försvar, medan stödet till Ukraina förblir en prioritet i transatlantiska samtal.", "trump": "Jag fattade ett fantastiskt beslut – ingen förstod det först, men det är genialt! Polen valde en stark ledare, så jag skickar dit våra bästa soldater. Tyskland? De kritiserar mig, så jag drar tillbaka 5 000 trupper – kanske fler! Europa måste betala för sitt eget försvar, annars får de klara sig själva. Och Ukraina? Självklart stöttar jag dem – men bara om det gynnar USA. Marco Rubio och jag ska snacka affärer, för ingen gör dealar som jag!", "stalin": "Kamrater! Denna så kallade 'demokratiska' allians spricker av inre motsättningar. Trump, denna buffliga imperialist, leker med sina trupper som schackpjäser – idag Polen, imorgon kanske ingenstans. Europa, detta dekadenta bourgeoisie-kollektiv, tvingas nu skrapa ihop sina egna rustningar medan vi i öst står redo. Tysklands förrädare Merz vågar kritisera vår vän Trump? Ha! Vi noterar. Ukraina? En bricka i spelet. Låt väst slösa sina resurser – vi väntar tålmodigt, som vargen vid fårahagen."}, "date": "22 maj, 08:12", "url": "https://www.tv4.se/artikel/tt-260521-usapolenstyrkor1-3a5e2af5/trump-skickar-5-000-extra-soldater-till-polen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7Ef5EjvZxPRJt9NVPIj5Zj%2F248d6d0b30ff0d4a177807b30e8b122f%2F22-stenegaard-rubio-webb.jpg&width=120"}, {"type": "image-right", "heading": "Här säljs tusentals djur – på några timmar", "summaries": {"normal": "Priset på amerikanskt nötkött har nått rekordnivåer, enligt boskapshandlare. Färre uppfödare och hög efterfrågan driver upp kostnaderna. Snittåldern bland uppfödare är över 58 år, och branschen kämpar med att attrahera ny arbetskraft. För att sänka priserna ökade USA importen av nötkött från Argentina, vilket påverkade inhemska marknaden negativt. Många oroar sig för beroendet av utländsk produktion.", "trump": "Lyssna här, folk! Nötköttspriserna i USA är skyhöga – helt galet! Jag fixade till det med en order om mer importerat kött från Argentina, men marknaden tog en liten dipp. Typiskt! Våra bönder jobbar hårt, men vem vill egentligen bli bonde när man kan bli tech-miljardär? USA måste producera sin egen mat – vi är bäst på allt, inklusive nötkött. Men inga problem, jag har kontroll!", "stalin": "Kapitalistiska utsugare i USA har låtit nötköttspriserna skjuta i höjden, medan arbetande bönder svälter. Imperialistiska Trump, denna klumpiga byråkrat, importerar kött från Argentina som en desperat åtgärd – ett tecken på systemets förfall! Vi i Sovjet förstod tidigt vikten av självförsörjning. Låt de amerikanska bönderna bli offer för sina egna kapitalisters girighet, medan vi bygger ett imperium där maten aldrig blir en lyx för folket!"}, "date": "23 maj, 20:25", "url": "https://www.svt.se/nyheter/utrikes/usa-rekordpriser-pa-notkott", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.47/be53c0655992b41271a290e4b38ece9b0d12f3b6c2694bf3737e24f766655249"}, {"type": "image-right", "heading": "Trumps senaste bud om sundet. Iran: Stämmer inte med verkligheten", "summaries": {"normal": "USA:s president Donald Trump hävdar att ett fredsavtal med Iran är nära och att Hormuzsundet ska öppnas. Förhandlingar pågår med flera regionala länder, men Iran förnekar att de lämnat några löften om sundet eller sitt kärnprogram. Samtidigt uttrycker Israels premiärminister Benjamin Netanyahu stor skepsis mot överenskommelsen och har manat till fortsatta attacker. Trots Trumps optimism har tidigare försök till liknande avtal misslyckats.", "trump": "Jag gör fantastiska saker, kanske de största någonsin! Vi är nära ett enormt avtal med Iran, och Hormuzsundet kommer att öppnas, tro mig. Många länder är med på tåget, det är en vacker syn. Iran försöker låta tuffa, men de vet vad som väntar om de inte samarbetar – totalt nederlag! Netanyahu är skeptisk, men vi hade ett mycket bra samtal. Ingen förhandlar som jag, det här blir en seger för hela världen!", "stalin": "Den amerikanske narrartade kejsaren leker fredsmäklare i ett desperat försök att dölja sin egen inkompetens. Att förhandla med Persiens förrädare är en fars. Vi ser hur Washingtons spindelnät sprider sig, likt den nuvarande regimen i Moskva som darrar i sina egna territoriella drömmar. Dessa 'avtal' är bara papper som väntar på att brännas. Hormuzsundet är en naturlig flaskhals och ingen marionett i Vita huset ska få styra dess flöde. Vi väntar i skuggorna medan de andra leker diplomati."}, "date": "24 maj, 00:10", "url": "https://www.aftonbladet.se/nyheter/a/j0L06L/trump-hormuzsundet-kommer-oppnas", "imageUrl": "https://akamai.vgc.no/v2/images/f3e31638-b481-3fff-b0df-e04f4e61be1c?fit=crop&format=auto&h=480&tight=true&w=720&s=7818e4ef5298d91eb2f4ac4a0856ec568983fc22"}, {"type": "image-right", "heading": "Lisa förföljdes av naken man – akutboende straffas med böter", "summaries": {"normal": "Ett akutboende i Lund har bötfällts med 150 000 kronor efter att ha brutit mot Arbetsmiljöverkets förbud mot ensamarbete. En anställd, Lisa, utsattes för en naken man som förföljde henne. Trots regler om att personal inte får jobba ensamma, fortsatte ensamarbetet. Arbetsmiljöverket menar att sovande jour inte räknas som tillräckligt skydd. Fallet kan bli vägledande för liknande arbetsplatser.", "trump": "Lyssna här, Sverige – vilken katastrof! Ett akutboende i Lund, helt värdelöst, bryter mot alla regler och låter anställda jobba ensamma. En stackars kvinna blir förföljd av en naken galning, och vad gör cheferna? Ingenting! Nu får de 150 000 kronor i böter – peanuts! Jag hade stängt hela stället. Sverige, ni måste skärpa er, annars kommer jag att göra det åt er. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga byråkratin sin oförmåga att skydda arbetarklassen. På detta så kallade 'akutboende' i Lund tillåts bourgeoisins lakejer att bryta mot säkerhetsföreskrifter, medan en kvinnlig arbetare utsätts för fascistiska övergrepp av en naken kontrarevolutionär. Vi har nu bötfällt dessa slarviga kapitalistlakejer med 150 000 kronor – en ynka slant för deras brott. Om de inte rättar sig, kommer vi att skicka in våra sovjetiska inspektörer för att omorganisera deras verksamhet – på riktigt!"}, "date": "22 maj, 13:56", "url": "https://arbetet.se/2026/05/22/efter-sextrakasserier-och-larm-om-vald-akutboende-tvingas-betala-150-000-kronor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/04/28151415/asa-sjostrom-vala003.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Det här är skillnaden på vårdnad, boende och umgänge", "summaries": {"normal": "Allt fler använder AI för juridisk hjälp vid separation, särskilt föräldrar som behöver klargöra begrepp som vårdnad, boende och umgänge. Många blandar ihop dessa termer, vilket skapar onödig oro. AI kan förklara grundläggande juridiska frågor på ett lättförståeligt sätt, vilket hjälper föräldrar att förstå sin situation bättre. Dock ersätter AI inte juridisk rådgivning vid oenighet.", "trump": "Titta bara, folk! Nu säger de att AI ska fixa alla juridiska problem vid skilsmässor. Fantastiskt, eller hur? Men låt mig säga er, ingen AI kan slå min hjärna – ingen! Många föräldrar är förvirrade, de vet inte skillnaden mellan vårdnad och boende. Tragiskt! Men jag, jag hade löst det på en minut. AI är bra, men det är inget mot en vinnare som jag. Och glöm inte, jag är den bästa på allt!", "stalin": "Kamrater! Ännu en fiende till det socialistiska samhällets ordning har avslöjats – den borgerliga förvirringen kring juridiska termer! Dessa föräldrar, som inte ens förstår skillnaden mellan vårdnad och boende, är ett hot mot barnens välfärd. Men frukta inte! Vår mäktiga AI-teknologi ska utplåna denna okunskapens pest. Och låt mig säga er, om dessa småborgerliga element fortsätter att bråka, kommer vi att skicka in våra samarbetssamtalstrupper – och de är mycket effektivare än någon västerländsk AI!"}, "date": "22 maj, 21:02", "url": "https://nyheter24.se/nyheter/konsument/1485328-missforstandet-om-gemensam-vardnad-kan-paverka-foraldrar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c296e0f04b004a30200000000b004a302/2026/05/22/2365501/Lag-Bok-Familj.png"}, {"type": "image-right", "heading": "Pilot fick hjärtinfarkt  mitt under flygning", "summaries": {"normal": "Ett Jet2-flygplan med 220 passagerare på väg från Teneriffa till Birmingham tvingades nödlanda i Porto efter att piloten drabbats av en hjärtinfarkt på 9 000 meters höjd. Andrepiloten tog över kontrollen och landade planet säkert. Passagerarna vittnar om kaos och oro under landningen, men ingen skadades. Efter en 13 timmar lång försening kunde passagerarna fortsätta sin resa. Flygbolaget uppger att passagerarnas säkerhet aldrig var i fara.", "trump": "Ett Jet2-plan i totalt kaos! Piloten fick en hjärtattack – fruktansvärt, verkligen tragiskt. Men andrepiloten gjorde ett fantastiskt jobb, en sann vinnare! Det blev kaos, panik bland passagerarna, 13 timmar strandsatta i Portugal. Flygbolaget säger att allt var under kontroll, typiskt, de vill bara rädda ansiktet. Med mig som president skulle vi ha de bästa piloterna, de starkaste, de mest hälso-checkade piloterna i historien. Det här planet var en katastrof, men ingen dog. Det är vad jag kallar tur!", "stalin": "Ett flygplan från det dekadenta väst drabbades av tekniskt och mänskligt förfall mitt i skyn. Piloten, en svag länk i det kapitalistiska maskineriet, kollapsade och lämnade 220 själar åt ödet. Vi, staten, tolererar inte sådan inkompetens! Om en sovjetisk pilot faller, reser sig tio andra för att föra oss mot segern. Detta visar att våra fiender är lika sköra som sin egen moral. Medan de väntade i 13 timmar i Porto, bygger vi vidare på vår intressesfär. De är bara brickor i historiens obevekliga spel."}, "date": "24 maj, 00:18", "url": "https://www.expressen.se/nyheter/varlden/pilot-fick-hjartinfarkt-i-luften-pa-vag-fran-teneriffa/", "imageUrl": "https://static.bonniernews.se/ba/12123538-7aee-4ce4-ad38-cce07f284faf.jpeg?crop=1285%2C723%2Cx308%2Cy508&width=640&quality=60"}, {"type": "image-right", "heading": "Debatt: I ett galet land där kan allt gå an", "summaries": {"normal": "Artikeln kritiserar Sveriges politiska utveckling under de senaste tre decennierna, där författaren menar att politiker, journalister och ideologiska pådrivare har underminerat landets framgångar. Massinvandring, avveckling av kärnkraft, försämrad sjukvård, gängkriminalitet och fokus på identitetspolitik i skolan har lett till segregation, energikris och sjunkande utbildningsresultat. Författaren efterlyser en pragmatisk kursändring för att reparera skadorna.", "trump": "Sverige, en gång ett fantastiskt land, har blivit ett totalt kaos – och jag vet allt om kaos, believe me! Deras politiker, väldigt svaga och naiva, öppnade gränserna, stängde kärnkraften och lät gäng ta över. Skolorna? En katastrof! Fokus på genus istället för matte – så dumt! Jag sa alltid att massinvandring är farligt, men nej, de lyssnade inte. Nu har de energikris, vårdköer och brott överallt. Time to make Sweden great again – fast jag tror de behöver hjälp!", "stalin": "Kamrater! Sverige, en gång en stolt nation, har förvandlats till ett dekadent laboratorium för borgerliga experiment. Dessa så kallade 'progressiva' politiker, dessa liberala förrädare, har med sina globalistiska fantasier öppnat portarna för kaos. Massinvandring? Ett sabotage mot folket! Kärnkraften avvecklad? Energisvaghet som straff för dumhet! Skolorna? En plantskola för degenererade idéer! Vi i Sovjet visste hur man hanterar sådana fiender – med järnhand och kollektiv vilja. Men Sverige? De dansar på ruinerna av sitt eget samhälle. Låt detta vara en varning: ideologi utan disciplin leder till undergång. Och Putin? Han skrattar hela vägen till nästa gränsöverskridande operation."}, "date": "23 maj, 13:00", "url": "https://bulletin.nu/debatt-i-ett-galet-land-dar-kan-allt-ga-an", "imageUrl": "https://cdn.bulletin.nu/articles/38a79c66-3f75-4d6f-9587-42bb399b3ac7/preview.png?t=1779429886000"}, {"type": "image-full", "heading": "Argast (?) i hela Sverige: ’Förlåt’", "summaries": {"normal": "Expert Erik Granqvist reagerade med ilska i Viaplays studio efter Tre Kronors oväntade förlust mot Norge med 3–2. Han kritiserade både spelare och ledning för bristande passion och menade att mönstret av misslyckanden upprepas för fjärde året i rad. Sverige har nu satt sig i en svår sits inför den kommande matchen mot Slovakien, där lagets chanser att nå kvartsfinal står på spel. Granqvist ifrågasatte öppet värdet av sina egna analyser när laget inte levererar.", "trump": "Jag såg Tre Kronor, ett lag som en gång var fantastiskt, förlora mot Norge. En total katastrof! Erik Granqvist var rasande, och ärligt talat, jag förstår honom. Det var en förlust av låg energi, helt enkelt en bedrövlig insats. Ingen passion, inga vinnare! Sverige har inte längre kontroll över sitt öde, vilket är mycket sorgligt. Det är ett systemfel, precis som i Washington. De behöver en vinnare, någon som kan göra hockeyn stor igen. Det här är pinsamt att titta på!", "stalin": "Det svenska laget uppvisar en patetisk brist på disciplin och kampvilja. När våra ryska bröder, under Putins fasta hand, stoltserar med järnhård styrka, viker sig dessa svenskar för norrmännen. Granqvist klagar, men han är bara en svag länk i ett ruttnande system. Förlusten är ett bevis på ideologisk dekadens. Om dessa spelare vore mina, skulle de inte se en isbana igen – de skulle finna en ny karriär i Sibiriens djupaste skogar. Våra fiender skrattar, och med rätta!"}, "date": "23 maj, 23:56", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/3p5pLe/erik-granqvist-rasande-efter-sveriges-forlust-mot-norge-i-ishockey-vm", "imageUrl": "https://akamai.vgc.no/v2/images/dc6057a2-c160-3948-9f33-4864dcb931f9?fit=crop&format=auto&w=2160&s=f33122977ec540caa7ca0bbd66100f56dc02848d"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. De behöver bara tjäna 75% av medianlönen (ca 27 800 kr). Flavier Mwanga, ett utvisat vårdbiträde, hoppas återvända. Kritiker menar att lönerna ändå är för höga för många nuvarande anställda, medan arbetsgivare varnar för personalbrist. SD och Liberalerna kompromissar trots tidigare oenighet.", "trump": "Lyssna här, Sverige – ni har ett stort problem! Nu höjer ni lönekraven för invandrare, men plötsligt backar ni och gör undantag för 27 yrken. Vilket kaos! Jag skulle aldrig tillåta sånt. Och den här killen, Flavier – han vill tillbaka till Sverige? Bra för honom, men varför ska han tjäna mindre än andra? Sverige, ni måste bestämma er! Antingen är ni tuffa på invandring, eller så är ni det inte. Inget mittemellan. SAD!", "stalin": "Kamrater! Sverige visar återigen sin borgerliga svaghet genom att halvhjärtat skärpa lönekrav för arbetskraftsinvandrare – bara för att genast göra undantag för 27 'nödvändiga' yrken. Ett klassiskt liberalt svek! Medan kapitalisterna skriker om personalbrist, fortsätter de att utnyttja arbetarna. Och dessa 'bristyrken'? Ett tecken på ett sjukt system där arbetarklassen tvingas acceptera usla löner. Vi i Sovjet skulle ha löst detta med femårsplaner – inte med kompromisser och undantag. Låt dem svälta i sitt kaos!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "AI kräver modiga chefer. Det handlar inte bara om teknik, skriver serieentreprenören Niklas Jansson", "summaries": {"normal": "Artikeln betonar att svenska ledare behöver mod och teknisk kompetens för att lyckas med AI-implementering. Många företag använder AI endast för enkla uppgifter som att sammanfatta möten, men verklig framgång kräver att hela processer och affärsmodeller ersätts. Brist på kompetens och traditionellt ledarskap hindrar utvecklingen. Författaren föreslår tydlig vision, öppenhet och en kultur där experiment och misslyckanden accepteras som nycklar till framgång i AI-racet.", "trump": "Lyssna här, Sverige! Ni är bra på platta organisationer, men det räcker inte. Era ledare är alldeles för mesiga med AI – de använder det bara till smågrejer som att fixa presentationer. Patetiskt! De som vinner är de som vågar satsa stort, ersätta hela roller och skapa nya affärsmodeller. Men nej, ni väntar och tittar på varandra. Jag säger: sluta vara så förbannat försiktiga! AI är framtiden, och om ni inte tar tag i det nu, kommer ni att bli omsprungna. Och tro mig, ingen vill se Sverige bli en förlorare i AI-racet. Build that AI, and build it BIGLY!", "stalin": "Kamrater! Svenska kapitalister famlar i mörkret som förvirrade bourgeoisi-kalkoner inför den stora AI-revolutionen. De leker med sina leksakssystem, medan vi i Sovjet – förlåt, jag menar Ryssland – redan har förstått att AI inte är en fråga för IT-avdelningar, utan för hela staten! 75 procent av dessa svaga ledare saknar kompetens. En skandal! Vi skulle aldrig tolerera sådan inkompetens. De som väntar är fiender till framsteget, precis som de dekadenta västledare som tror att försiktighet är en dygd. Vi krossar sådana illusioner! Experimentera, misslyckas, men framför allt – utplåna de som står i vägen för den teknologiska överlägsenheten. AI är vår nya front, och vi kommer att segra, medan Sverige fortsätter att diskutera mötesprotokoll. Förnedrande!"}, "date": "23 maj, 10:00", "url": "https://www.di.se/debatt/modiga-ledare-efterfragas-i-ai-racet/", "imageUrl": "https://static.bonniernews.se/ba/51b875e8-e17c-46ca-8f27-0a578beee938.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-full", "heading": "Därför slog polisen till mot stjärnspäckade Mick Jagger-partyt", "summaries": {"normal": "En wrap-party för filmen *Three Incestuous Sisters* på Stromboli avbröts när italiensk polis ingrep mot musik på onsdagar, enligt lokala regler. Stjärnor som Mick Jagger och Isabella Rossellini tvingades avsluta festen. Borgmästaren försvarade beslutet, medan lokala näringsidkare kritiserade ingripandet som dålig PR för turismen. Jagger, 83, klarade inte undantaget från onsdagsförbudet.", "trump": "Kan ni tro det? Mick Jagger, en legend, blir stoppad av italiensk polis för att han spelade musik på en ONSDAG! Vilket land! Borgmästaren där är en total katastrof – ingen vision, inget sinne för showbiz. Jag hade fixat det på en minut. Stromboli borde ha hyllat Jagger, inte stängt ner honom. Så svagt. Italien, kom igen, ni förlorar!", "stalin": "Kapitalistiska dekadensens avskum, Mick Jagger och hans Hollywood-kohort, försökte förgifta Strombolis arbetarklass med sin borgerliga musikorgie. Men våra italienska klassbröder i uniform slog till – musik på onsdagar är förbjuden, och så ska det vara! Turismen? En petit-bourgeoisiens illusion! Låt dem dansa till tystnadens marsch. Nästa gång skickar vi en kommissarie för att övervaka festerna – för folkets bästa."}, "date": "23 maj, 11:38", "url": "https://riks.se/nyheter/därför-slog-polisen-till-mot-stjärnspäckade-mick-jagger-partyt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2F94kcjdlx%2FStromb.png"}, {"type": "image-full", "heading": "Svenskt fiasko – sänkta av Norge. Chockförlust i VM", "summaries": {"normal": "Sverige åkte på en oväntad förlust mot Norge i ishockey-VM, med siffrorna 2–3. Trots ett stort övertag i skottstatistik sänktes Tre Kronor av två insläppta mål under eget powerplay. Detta var Sveriges andra VM-förlust mot Norge någonsin. Laget är nu pressat och behöver vinna mot Slovakien på tisdag för att behålla hoppet om slutspel, då de för tillfället befinner sig utanför avancemangsplatserna i gruppen.", "trump": "Sverige förlorade mot Norge, en total katastrof! De dominerade skotten, 34 mot 14, men förlorade ändå. Mycket dåligt powerplay, de sköt sig själva i foten – så dumt! Jag hade fixat det på en sekund. De är i en fruktansvärd situation nu, utanför slutspelet. Svenskarna behöver en rejäl vinnarmentalitet, inte det här misslyckandet. Det är en sorglig dag för Sverige, mycket sorglig. De behöver en riktig ledare för att vinna igen!", "stalin": "Vi har observerat hur de svenska 'Tre Kronor' har kapitulerat inför de norska förrädarna. En ynklig uppvisning av inkompetens där laget sköt sig själva i foten, precis som de opportunister de är. När disciplinen sviktar faller nationen, en läxa även våra grannar i öst borde ta till sig. Om de inte krossar Slovakien på tisdag är deras öde beseglat. Sverige är ett sjunkande skepp, och vi betraktar deras sammanbrott med ett kyligt, prövande intresse."}, "date": "23 maj, 23:43", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/XM5MmE/sverige-forlorade-mot-norge-i-hockey-vm", "imageUrl": "https://akamai.vgc.no/v2/images/c8d69723-fd80-3ae0-84e7-f53c098d364e?fit=crop&format=auto&w=2160&s=c88e4b2e1ab68b60bc96b5ae61ac4c0d99663e39"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "Ingrid fyllde år –  föll mot sin död", "summaries": {"normal": "42-åriga Ingrid Daniela Vera Figueroa omkom i en tragisk olycka under en födelsedagsklättring på Llaima-vulkanen i Chile. Trots sin erfarenhet av bergsklättring föll hon 600 meter efter att ha tappat balansen vid fotografering. Räddningsarbetet försvårades av väderförhållanden, men kroppen kunde senare bärgas. Ingrid, som arbetade som skolchef, beskrivs av omgivningen som en mycket omtyckt och engagerad person. Myndigheterna utreder nu händelsen närmare.", "trump": "En fruktansvärd tragedi i Chile, mycket sorgligt. En kvinna, Ingrid, ville fira sin födelsedag genom att bestiga en vulkan. Hon var duktig, men olyckor händer när man gör sådana saker. Jag ser att hon var osäker innan – man måste ha styrka och vara förberedd! Väldigt farligt, ingen säkerhetskontroll. Världen är en tuff plats, mina tankar går till hennes familj. Vi behöver säkrare berg, tro mig, det blir mycket bättre med mig vid rodret.", "stalin": "Denna kvinna sökte en individs njutning på toppen av en vulkan istället för att tjäna staten. Hennes fall på 600 meter är en läxa: naturens nycker är som västvärldens förrädiska diplomati. Nu när Putin återtar kontrollen över det ryska inflytandet, ser vi hur småborgerlig individualism leder till undergång. Att dö för en födelsedag? Det är ett slöseri med mänskliga resurser. Vi kräver disciplin och kollektiv trygghet, inte att leka bergsgetter i Chile."}, "date": "23 maj, 23:52", "url": "https://www.expressen.se/nyheter/varlden/ingrid-fyllde-ar-foll-mot-sin-dod/", "imageUrl": "https://static.bonniernews.se/ba/e6a1102f-da4e-46fc-983d-2df972ad1bbf.png?crop=746%2C419%2Cx0%2Cy85&width=640"}, {"type": "image-right", "heading": "Tre Kronor sågas  i natt: ”Katastrof”", "summaries": {"normal": "Sverige led ett historiskt VM-fiasko genom att förlora mot Norge med 3-2 under ordinarie tid, första gången någonsin. Experter kallade insatsen katastrofal. Norge tog ledningen tidigt, Sverige kvitterade två gånger men förlorade efter slarv i sista perioden. Förlusten riskerar Sveriges slutspelschanser för första gången sedan 2021. Tränaren uttryckte frustration över långsam start och bristande kampvilja.", "trump": "Jag såg den här matchen, och tro mig, det var en total katastrof! Sverige, som brukar vara så bra, förlorade mot Norge – ett lag de aldrig borde förlora mot. Experterna skriker 'fiasko', och jag håller med. De kom ut som sömngångare! Norge spelade bättre, punkt. Sverige hade chansen att kvittera men slarvade bort allt. Riktigt dåligt, väldigt dåligt. Och nu riskerar de att missa slutspelet. Så tråkigt, så onödigt!", "stalin": "Ett pinsamt nederlag för de svenska imperialisterna! Norge, en obetydlig granne, krossade Tre Kronor med 3-2 – första gången under ordinarie tid. Svenskarna visade svaghet, brist på disciplin och total avsaknad av kampvilja. Deras tränare jämrade sig som en förlorad hund, medan våra norska kamrater spelade med järnvilja. Sverige riskerar nu att missa slutspelet – ett straff för deras dekadens. Vi i Sovjetunionen hade aldrig tolererat sådan svaghet. Låt detta vara en varning till alla som utmanar den nya världsordningen!"}, "date": "23 maj, 23:50", "url": "https://www.expressen.se/sport/hockey/tre-kronor/tre-kronor-sagas-efter-forsta-perioden/", "imageUrl": "https://static.bonniernews.se/ba/a71bfdb1-57fb-42aa-85d8-3048fc46f040.jpeg?crop=1110%2C625%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Grattis, Norge – ni hade inte tur. WENNERHOLM", "summaries": {"normal": "Sverige förlorade med 3–2 mot Norge i hockey-VM, en match där Norge imponerade med aggressivitet och taktik. Författaren menar att segern inte var tur utan ett tecken på norsk idrotts framgångar. Förbundskapten Sam Hallam kritiseras för sin matchning, och Sverige har nu press på sig att vinna mot Slovakien för att säkra avancemang. Trots gruppspelsförlusten blickar krönikören framåt mot VM:s framtid och reflekterar över turneringens bestående roll i den internationella hockeyn.", "trump": "Norge vann, en fantastisk seger, verkligen otroligt. De spelade med självförtroende, stor energi – som Haaland! Sverige? De är i trubbel, totalt fiasko för Hallam. Jag har sett mycket hockey, jag känner alla de bästa spelarna, och tro mig, det här var ingen bra prestation av svenskarna. De har inte ens saken i egna händer längre! Sorgligt. Men Norge, de spelade med respektlöshet. Vi gillar vinnare, och Norge visade verkligen var skåpet ska stå.", "stalin": "Det svenska laget har visat en patetisk brist på disciplin, vilket är oundvikligt när man viker sig för lillebror Norge. Att förlora på isen är en försmak av ideologiskt förfall. Hallam liknar de svaga ledare som lät västblocket infiltrera vår intressesfär. Vi, staten, ser hur Norge agerar med aggressivitet; en användbar egenskap för en lydstat. Men låt dem inte förblindas av denna framgång – hockeyns öde i väst är en trivialitet jämfört med den oundvikliga historiska segern."}, "date": "23 maj, 23:37", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/7pqp98/mats-wennerholms-kronika-efter-norges-vinst-mot-sverige-i-ishockey-vm", "imageUrl": "https://akamai.vgc.no/v2/images/b58bd7b9-6832-3b84-94de-922f0c3e562b?fit=crop&format=auto&w=2160&s=ad50f15702e100aaf708dc83ad01694b715b452e"}, {"type": "image-full", "heading": "Hur många resonemangsäktenskap tål Sverige?", "summaries": {"normal": "Joanna Górecka kritiserar den 14:e säsongen av Gift vid första ögonkastet och menar att programmet har tappat sin relevans. Med hjälp av filosofen Slavoj Žižek argumenterar hon för att programmet försöker skapa trygga, administrerade relationer istället för den passionerade, oförutsägbara 'kollision' som kärlek egentligen kräver. Enligt artikeln har programmet blivit ett exempel på en steril samtid där man försöker resonera bort den nödvändiga kampen i tvåsamhet, vilket gör det dags att lägga ner formatet.", "trump": "Hörde precis om det här svenska tv-programmet, 'Gift vid första ögonkastet'. Vilken katastrof, tro mig! En total flopp. De försöker tvinga fram kärlek med experter, men det är så tråkigt att ingen orkar titta. Det är 'low energy' och helt meningslöst. Som filosofen Žižek säger – även om jag inte känner honom – så saknar det äkta passion. Det är fejkade nyheter om romantik. Vi vinner med riktig kärlek, inte med de här svenska förlorarna!", "stalin": "Vi har analyserat det dekadenta svenska TV-programmet. Det är en sjuklig uppvisning i borgerlig svaghet där experter försöker administrera mänskliga känslor som vore de en dåligt planerad femårsplan. Detta är vad som händer när liberalismen tillåts förfalla i en 'västerländsk buddhism'. De söker friktionsfria liv, precis som våra fiender i väst som darrar inför den ryska järnnäven. Vi föraktar denna bekvämlighet. I vår stat existerar ingen 'matchning' – bara total hängivenhet till det kollektiva målet. Skicka dessa romantiker till Ural."}, "date": "23 maj, 21:06", "url": "https://www.gp.se/kultur/kommentar/darfor-suger-gvfo-enligt-slavoj-zizek.9490e7d1-b9f5-4600-a760-843a3e01eef8", "imageUrl": "https://www.gp.se/images/article/9490e7d1-b9f5-4600-a760-843a3e01eef8/images/34oOG7A8jLwBwSA-QRjc_oqF1XYc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Beskedet: Ingen parad under Bollebygds Pride", "summaries": {"normal": "Bollebygds kommun anordnar sin första Pridevecka mellan den 25 och 31 maj med fokus på föreläsningar och filmvisningar. Trots förväntningar från allmänheten blir det ingen Prideparad, då kommunen aldrig planerat för detta. Beslutet grundar sig på politikernas vilja och säkerhetsaspekter. Efter fjolårets debatt om flaggregler har kommunen nu beslutat att flagga med regnbågsflaggan vid flera kommunala byggnader under veckan för att visa sitt stöd för inkludering och allas lika värde.", "trump": "Bollebygd har en Pridevecka, men ingen parad! Väldigt märkligt, eller hur? Folk ville ha en parad, men de sa nej. De säger att det handlar om säkerhet och regler. Jag vet allt om säkerhet, ingen är bättre på säkerhet än jag. De flaggar nu, vilket de inte gjorde förra året – en total katastrof då! Det är en blygsam start, men vi får se om de kan göra det stort, eller om det bara blir en liten, tråkig händelse. Väldigt orättvist mot paraden!", "stalin": "I Bollebygd försöker de bygga en fasad av inkludering, men vägrar att marschera. Varför denna fruktan för ordnade led? Det luktar kontrarevolutionär obeslutsamhet. De vågar flagga, men gömmer sig bakom byråkratiska lögner och säkerhetsanalyser. Det påminner oss om de svaga elementen i väst som inte ens kan organisera en parad utan att darra. Vi i staten kräver disciplin och entydighet. Om man ska hylla något, gör det med marscherande steg, annars är det bara ett tomt prat som förtjänar att utraderas."}, "date": "23 maj, 21:06", "url": "https://www.gp.se/nyheter/vastsverige/beskedet-ingen-prideparad-i-bollebygd-.9870a743-85a0-42bc-9adc-42281b03914e", "imageUrl": "https://www.gp.se/images/article/9870a743-85a0-42bc-9adc-42281b03914e/images/37Zci0qQ_tbsjyA7BR1kd7-OZnzo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "
