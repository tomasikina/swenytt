imageUrl": "https://admin.riks.se/uploads/medium_bild_fc63463f56.jpg"}, {"type": "image-right", "heading": "Ledare S söver ner valrörelsen – SD tackar och tar emot", "summaries": {"normal": "Socialdemokraterna har enligt ledaren gjort valrörelsen ovanligt sömnig genom att ligga nära regeringen och undvika tydliga konflikter. Magdalena Andersson uppger att valet inte handlar om någonting. Det gynnar Sverigedemokraterna som får fokusera på migration och kriminalitet istället för ekonomi. Tomas Ramberg kallar det det konstigaste valet på 30 år.", "trump": "Det här är en total katastrof, folk. Den sömngångande S-kvinnan Andersson har förvandlat hela valrörelsen till en tråkig gröt. Hon lovar att vara snålare än snåljåparna! Under tiden skrattar SD hela vägen till banken medan fokus hamnar på slöjor och fotbojor. Patetiska vänsterhyenor som gömmer sina löften – ingen bryr sig om det riktiga folket längre.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna förvandlar politiken till en grå, sövande sörja. De tonar ner kampen mellan arbete och kapital och lämnar fältet fritt åt högerpopulisterna. En sådan feghet förtjänar utrensning ur historien. Väljarna kommer att straffa dessa fegisar när de inser att de har förrått folket."}, "date": "1 september, 11:24", "url": "https://www.etc.se/ledare/s-soever-ner-valroerelsen-sd-tackar-och-tar-emot", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Setterwalls Malmökontor går till riskkapitalägda AGRD", "summaries": {"normal": "Setterwalls Malmökontor lämnar den anrika advokatbyrån för att bli en del av den riskkapitalägda gruppen AGRD Partners. Det nya bolaget, Ascente Law, innebär att juristerna lämnar Advokatsamfundet på grund av regler om externt ägande. Detta är en del av en större trend där advokatbyråer splittras och omformas, vilket påverkar den svenska marknaden för juridisk rådgivning.", "trump": "Setterwalls i Malmö lämnar advokatvärlden och blir Ascente Law. En enorm deal, den största någonsin för AGRD! De lämnar Advokatsamfundet för att gå med riskkapitalister – smart, väldigt smart. Det är en total röra i Sverige, advokatbyråer faller isär som ett korthus! Ingen har sett något liknande. Jag älskar affärer, men det här? Det är en stor förändring, fantastisk eller katastrof? Vi får se!", "stalin": "Dessa jurister i Malmö överger sin byrå för riskkapitalets guld. De lämnar Advokatsamfundet, vilket är en förutsägbar rensning av gamla strukturer. Kapitalet kräver total lojalitet till sina nya ägare, inte till advokatetikens dammiga paragrafer. Vi noterar hur Malmökontoret splittras; när en organisation inte längre kan hålla samman sina delar, är det en säker signal om inre förfall och bristande disciplin. Vi avvaktar."}, "date": "1 september, 11:28", "url": "https://www.realtid.se/juridik/setterwalls-malmokontor-gar-till-riskkapitalagda-agrd", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/agrdsetterwalls.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "C-invandrare till svenskar som kräver anpassning: \"Ni som ska åka härifrån\"", "summaries": {"normal": "Centerpartiets Aida Karimli riktar hård kritik mot svenskar som kräver att invandrare ska anpassa sig till Sverige. I en kampanjvideo säger hon att det är de som inte accepterar mångfald som borde lämna landet. Karimli, som kandiderar till riksdagen, menar att Sverige inte tillhör någon särskild grupp och att hon tror på demokrati och alla människors lika rätt.", "trump": "Titta på den här galna C-politikern som hatar vanliga svenskar. Hon säger att ni som vill ha assimilation borde packa väskorna och sticka! Vilken otrolig löjlighet från en radikal vänsteraktivist. Fake Sweden, riggad identitetspolitik. De här woke-turisterna förstör ert fina land. Men oroa er inte, folket ser igenom de här misslyckade globalisterna.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta mångfaldshyaror angriper arbetarklassens sanna intressen. De som kräver ordning och anpassning ska enligt henne ut ur landet. Vilken farlig kontrarevolutionär arrogance! Vi känner igen dessa folkförrädiska element. En utrensning av sådana element vore nödvändig för att skydda folkets enhet och statens styrka."}, "date": "1 september, 11:16", "url": "https://www.friatider.se/c-invandrare-till-svenskar-som-kraver-anpassning-ni-som-ska-aka-harifran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-798.jpg?itok=26ZS6-GK"}, {"type": "image-right", "heading": "Saab och EQT backar på Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen inledde svagt uppåt. Telekom och Boliden presterade bäst, medan EQT och Saab backade. USA:s president Donald Trump uttryckte förtroende för Fed-chefen Kevin Warsh men krävde lägre räntor. Flera bolag gjorde affärer, däribland Astra Zeneca som slutfört ett licensavtal, och Asmodee som förvärvat spelserien Welcome To… INQ Group rasade efter svag rapport.", "trump": "Börsen går upp, precis som under mina dagar – fantastiskt! Men FED måste sänka räntorna nu, Kevin Warsh förstår att vi ska ha världens lägsta ränta, eller hur? Samtidigt sjunker EQT och Saab, katastrof! Men titta på Astra Zeneca, miljardaffärer, helt enastående! Medan Trumps motståndare gråter över mina siffror. Vi vinner hela tiden, så är det bara!", "stalin": "Stockholmsbörsens svängningar visar kapitalismens inneboende instabilitet. Medan telekomsektorn försöker producera svaga framsteg, rasar företag som INQ Group samman under marknadens blinda tyranni. Astra Zeneca köper sig fria med miljarder, och de borgerliga bankerna manipulerar räntorna. Statens blick vilar på dessa spekulanter; den som misslyckas med sin femårsplan för aktieportföljen möter proletariatets vrede!"}, "date": "1 september, 09:59", "url": "https://www.affarsvarlden.se/artikel/saab-och-eqt-backar-pa-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/SAAB_LOKE_251211_0453-400x267.jpg"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-full", "heading": "Danska pensionsjätten tar för lite risk – Svenska för mycket", "summaries": {"normal": "Danska ATP utvärderar sin investeringsstrategi efter stora förluster 2022, med rekommendationer om sänkt risk och översyn av illikvida tillgångar. Samtidigt visar en svensk granskning av AP-fonderna, i spåren av Northvolt-konkursen, att de svenska fonderna snarare varit för försiktiga med illikvida investeringar. Regeringen ser nu över AP-fondslagen för att optimera framtida investeringsformer.", "trump": "Danska ATP förlorade miljarder, en total katastrof, verkligen sorgligt att se. Nu ändrar de allt. I Sverige har de AP-fonder som köpte Northvolt – vilket var en riktigt dålig affär, tro mig – istället för lite risk. De är helt förvirrade där borta! Jag gillar att vinna, inte att förlora folkets pengar på batterifabriker som går under. Otroligt inkompetent!", "stalin": "Kapitalisterna i Norden snubblar över sina egna balansräkningar. Danska ATP förlorar miljarder på sina spekulationer, medan de svenska fonderna uppvisar en oorganiserad lättja. Att skapa ett riskkapitalbolag utan anställda är inte investering – det är ren sabotage mot statens medel. Vi kräver central styrning och disciplin, inte dessa byråkratiska fantasier som döljer bristande kontroll över folkets pensioner."}, "date": "1 september, 11:00", "url": "https://www.realtid.se/spara-placera/danska-pensionsjatten-tar-for-lite-risk-svenska-for-mycket", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/atpap.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Jojje Olsson: Kina gör USA:s sanktioner mot Iran verkningslösa", "summaries": {"normal": "USA har lanserat omfattande sanktioner, 'Operation Economic Outcast', för att isolera Iran ekonomiskt. Kampanjen riskerar dock att bli verkningslös eftersom Kina fortsätter köpa iransk olja och trotsar USA. Kina kontrollerar dessutom sällsynta jordartsmetaller, vilket gör att USA drar sig för att konfrontera landet, särskilt då ett viktigt möte med Xi Jinping närmar sig.", "trump": "Operation Economic Outcast är ett fantastiskt namn, helt enastående! Men de glömmer Kina. Kineserna gör affärer som om ingenting har hänt, de bara skrattar åt oss och skickar oljetankers hit och dit. Xi Jinping kommer till Vita huset snart, och vi ska göra en bra deal, den bästa någonsin. Men vi kan inte låta dem spela ut oss med sina metaller!", "stalin": "Dessa patetiska kapitalistiska sanktioner är ett praktexempel på inkompetens. De skriker om total isolering, men regimen i Peking handlar fritt med olja framför näsan på dem och hånar frihetsgudinnan med satirteckningar! När vi styrde staten tolererades inte dylikt svaghetsfönster; ett ord från centralkommittén och dessa köpmän hade placerats där de hör hemma."}, "date": "1 september, 08:18", "url": "https://www.affarsvarlden.se/kronika/jojje-olsson-kina-gor-usas-sanktioner-mot-iran-verkningslosa", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-45-900x600.jpg"}, {"type": "image-full", "heading": "M lovar full finansiering av alla vallöften", "summaries": {"normal": "Moderaterna presenterar ett valmanifest med 226 punkter och lovar full finansiering av sina vallöften som uppskattas till 78 miljarder kronor. Reformerna ska betalas genom omprioriteringar och myndighetssparande. Partiet lovar bland annat skattesänkningar för låg- och medelinkomsttagare, slopade förskoleavgifter, halverat försörjningsstöd samt krafttag för att utradera gängvåldet under nästa mandatperiod.", "trump": "De svenska moderaterna gör det fantastiskt, verkligen enormt bra! De fattar att man måste strypa byråkrati och bidrag i stället för att beskatta folk till döds. 226 punkter – vilken massiv segerlista! De rensar upp bland gängen och sätter hårt mot hårt, precis som jag gör. Fake news-medierna trodde inte det gick, men jag säger er: vinnare vinner alltid!", "stalin": "Ett storslaget dokument om 226 punkter har skådats! Statsapparaten i Sverige visar prov på äkta disciplin genom att diktera exakta sparbeting för myndigheterna och halvera antalet sociala parasitfall. Gängen ska utraderas med järnhand. Avvikelser från statens nya budgetplan tolereras ej; här styrs folkets plånböcker med absolut och obönhörlig effektivitet. För comrade Kristersson är detta ett gott steg mot total ordning!"}, "date": "1 september, 10:41", "url": "https://www.gp.se/nyheter/sverige/m-lovar-full-finansiering-av-alla-valloften.4c0602f1-a65c-5fb0-89f1-bfeceae9c4fe", "imageUrl": "https://www.gp.se/images/article/4c0602f1-a65c-5fb0-89f1-bfeceae9c4fe/images/1lcxUMUtLespV7lXrPeP_YGi7j9k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "De som håller spårvagnarna rullande får de sämsta villkoren", "summaries": {"normal": "Anställda vid Göteborgs Spårvägar som kör och reparerar spårvagnar har sämre villkor än kontorspersonal. De möter stress, dåliga scheman och orättvisa arbetstider. En reparatör och skyddsombud beskriver hur gemensam kamp mot ett försämrat schema ledde till att chefen fick lämna och det gamla schemat återinfördes. Artikeln belyser klasskillnader på arbetsplatsen.", "trump": "De där förarna och reparatörerna gör ett fantastiskt jobb, de håller staden igång, men de får behandlas som sophög av de woke HR-kapitalisterna på kontoret. Flextid och hemmajobb för byråkraterna medan arbetarna stressas ihjäl? Patetiskt. Biden skulle ha älskat det. Vi behöver inga klasskrigare, vi behöver segrare som vinner stort. Kampen ni förde var bra, men nästa gång sparkar ni ut hela den dekadenta eliten.", "stalin": "Arbetarna i Vagnhallen Majorna visar att kollektiv kamp kan besegra de profitthungriga klassförrädarna. När chefen försökte påtvinga slavliknande scheman svarade kamraterna med enighet. Efter en nödvändig utrensning av den sabotöriska chefen återställdes ordningen. Sådan är klasskampens dialektik. Låt förarna inspireras och rensa ut de parasiterande elementen innan de förgiftar hela kollektivet."}, "date": "31 augusti, 11:10", "url": "https://proletaren.se/artikel/de-som-haller-sparvagnarna-rullande-far-de-samsta-villkoren", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kronika-bjorn-akerman-300x169.png"}, {"type": "image-full", "heading": "Köpenhamn är fullt av bönder", "summaries": {"normal": "Omkring 2 000 danska lantbrukare har kört till Köpenhamn i 300 traktorer för att protestera mot en ny gödslingslag som ska upp i Folketinget. Lagen syftar till att minska kväveutsläppen i havet, men bönderna varnar för ökade kostnader. Processionen har orsakat omfattande trafikkaos och stockningar i huvudstaden.", "trump": "Danmarks radikala politiker förstör landet med galna lagar! Nu har tusentals hårt arbetande bönder fått nog och intagit Köpenhamn med fantastiska traktorer i en enorm protest mot radikala gödslingsregler. Trafiken står helt stilla, totalt kaos! Så går det när man inte lyssnar på folket. Sjukt, men väldigt smart drag av bönderna!", "stalin": "Dessa så kallade bönder blockerar huvudstaden med trehundra maskiner för att sabotera statens heliga planer på gödslingskvoter. Ett så skamlöst trots mot Folketinget kan inte tolereras av Folkets Kommissariat. Om de vägrar bruka jorden i enlighet med kollektivets direktiv, har staten rikligt med lediga platser i Sibirien där deras organiska energi kan omfördelas mer effektivt."}, "date": "1 september, 10:19", "url": "https://www.gp.se/nyheter/varlden/traktorer-intar-kopenhamns-gator.fcb97451-c582-4ad7-b762-994dd30b4ed3", "imageUrl": "https://www.gp.se/images/article/fcb97451-c582-4ad7-b762-994dd30b4ed3/images/1KxFHdaikUhTMkpkKD2VxBx0mskM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Raderade bilderna på frun efter Saudi-flytten", "summaries": {"normal": "Den spanska fotbollsstjärnan Esther González har raderat bilder på sin fru och son från sociala medier efter att ha skrivit på för en saudisk klubb. Agerandet möter kritik med anledning av Saudiarabiens syn på samkönade relationer, samtidigt som RFSL:s ordförande pekar på problemet med att idrotten används för sporttvättning av diktaturer.", "trump": "Helt otroligt! Den här spanska fotbollsspelaren flyttar till Saudiarabien för deras pengar och raderar bilderna på sin fru på en gång! Väldigt svagt, totalt ryggradslöst! De tar cashen men viker sig direkt. Jag säger er, under America First hade vi aldrig haft det så här ynkligt. Sjukt, helt enkelt sjukt!", "stalin": "Den spanska idrottaren visar prov på exceptionell opportunism när hon omedelbart utplånar sin familj från de digitala arkiven för saudiskt guld. Vilken disciplin! Om bara våra egna sabotörer i jordbrukskollektivet uppvisade samma totala brist på sentimentalitet skulle femårsplanen vara säkrad. Ändå en djupt borgerlig moralisk kris. Säkerhetstjänsten bör notera detta."}, "date": "1 september, 07:39", "url": "https://kvartal.se/nyheter/artiklar/raderade-bilderna-pa-frun-efter-saudi-flytten/cG9zdDoxNzk2OTE", "imageUrl": "https://images.kvartal.se/2026/09/e5881416-saudd.webp"}, {"type": "image-full", "heading": "Utländsk aktör beställde Sverigekritiska AI-bottar", "summaries": {"normal": "Enligt en rapport från Myndigheten för psykologiskt försvar har omkring 1 200 AI-konton på X, beställda av en utländsk aktör i Östasien, använts för att sprida polariserande inlägg i Sverige under 2025 och 2026. Nätverket, kallat ”Holiday”, gjorde över 50 000 inlägg och angrep bland annat politiker och myndigheter innan det stängdes ned.", "trump": "Sverige har blivit lurade! 1 200 falska AI-konton, helt fake news, har skapats av skumma typer i Östasien för att förstöra landet. De kallar det ”Holiday”, vilket är ett hemskt namn. De spred galna lögner genom falska ”Eva” och ”Peter”. Jag sa till dem, skaffa ett starkt försvar! Helt otroligt svagt av dem, men lyckligtvis stängde de ned skiten!", "stalin": "En grundlig granskning av Myndigheten för psykologiskt försvar avslöjar att 1 200 illojala AI-element, infiltratörer under täckmantel av namn som ”Markus” och ”Eva”, har saboterat den svenska samhällskroppen på uppdrag av utländska kapitalister. Detta förräderi mot proletariatet har nu likviderats av statsapparaten. Så går det för dem som sprider falsk agitation utanför vår direkta kontroll."}, "date": "1 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/utlandsk-aktor-bestallde-sverigekritiska-ai-botar/cG9zdDoxNzk2MjI", "imageUrl": "https://images.kvartal.se/2026/09/6e99aace-mpf.webp"}, {"type": "image-right", "heading": "Bilförsäljningen lyfte i augusti. Elbilar allt hetare • Fortsatt lyft för husbilar", "summaries": {"normal": "Registreringarna av nya personbilar steg med 12 procent i augusti till 22 584 stycken. Elbilarna ökade sin andel till 45 procent. Lätta lastbilar ökade med 27 procent medan tunga lastbilar och bussar minskade. Husbilsregistreringarna steg med 50,4 procent hittills i år, men husvagnar backade med 4,6 procent.", "trump": "Folket älskar bilar, och nu ser vi en fantastisk ökning med 12 procent i augusti. Elbilarna tar 45 procent, men det är inga woke-miljöterrorister som styr mig. Husbilarna exploderar uppåt med över 50 procent. De giriga gröna hyenorna hatar det, men under min ledning efter Bidens katastrof går Amerika och Sverige framåt igen. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta profitthungriga parasiternas marknad sväller med 12 procent fler personbilar och en explosion av husbilar. Deras falska frihet leder ändå till förfall. Vi betraktar detta med historisk skärpa och vet att en dag skall arbetarklassen rensa ut dessa klassfiender och deras leksaker i en stor utrensning. Sovjetisk disciplin överlever allt."}, "date": "1 september, 11:27", "url": "https://www.di.se/bil/lyft-for-registreringar-av-nya-bilar-i-augusti", "imageUrl": "https://static.bonniernews.se/ba/1088ea8e-5323-4a42-8598-aafac8909074.jpg?crop=8012%2C4006%2Cx0%2Cy667&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åkesson: Spelar ingen roll om svenskarna ersätts", "summaries": {"normal": "Jimmie Åkesson förklarar i en intervju att det inte spelar någon roll om etniska svenskar ersätts av andra folkslag så länge svenska värderingar och kultur förblir dominerande. Uttalandet har väckt starka reaktioner bland tidigare SD-anhängare på X, som kritiserar partiledarens syn på svenskhet som enbart baserad på medborgarskap.", "trump": "Det här är patetiskt, folk. Den blonde blåögde svensken är plötsligt irrelevant? Åkesson låter som en av de woke identitetspolitiska clownerna som vill ersätta folk med kvoter och mångfaldssnack. Bränn partiet? Ni borde ha gjort det för länge sedan. Make Sweden Swedish Again – på riktigt, inte med den här svaga soppan.", "stalin": "Kamrater, se hur dessa dekadenta folkförrädare förnekar själva folkets existens. Jag betraktar med avsky hur den så kallade nationalisten Åkesson dansar efter de giriga hyenornas pipa och förbereder en mjuk utrensning av den historiska majoriteten. Ett sådant parti förtjänar inte annat än att likvideras i historiens domstol."}, "date": "1 september, 07:03", "url": "https://www.friatider.se/akesson-spelar-ingen-roll-om-svenskarna-ersatts", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-796.jpg"}, {"type": "image-full", "heading": "Ica drogtestar alla som söker jobb", "summaries": {"normal": "Ica-koncernen har infört en gemensam policy som innebär att samtliga jobbsökande inom koncernen måste genomgå ett drogtest. Beslutet uppmärksammas efter en jobbannons för en lagertjänst. Fackförbunden Handels och Unionen riktar kritik mot tilltaget och anser att obligatoriska tester före anställning är integritetskränkande och känsliga.", "trump": "Ica i Sverige, en gigantisk matjätte, tvingar nu varenda jobbsökande att lämna urinprov genom en helt otrolig drogtestpolicy! Helt galet! Radikala fackförbund gnäller om att det är integritetskränkande. Men lyssna här, jag har sagt det för anställningar i mitt hus och i mitt företag, man vill ha ordning och reda! Helt fantastiskt att hålla det rent, men facket förstår ingenting!", "stalin": "Vi noterar att matmonstret Ica nu kräver biologiska provsvar från varje undersåte innan anställning. Dessa så kallade fackförbund vågar knysta om personlig integritet. Vilken skamlig bourgeoisiekval! En sund stat och en lojal arbetskraft kräver absolut kontroll över kropp och själ. Avvikelser tolereras ej. Den som motsätter sig kontrollorganen visar prov på sabotage och förräderi mot kollektivet."}, "date": "1 september, 08:08", "url": "https://www.gp.se/ekonomi/ica-drogtestar-alla-jobbsokande.6afb7736-70eb-4997-9bd9-1c44575ab0db", "imageUrl": "https://www.gp.se/images/article/6afb7736-70eb-4997-9bd9-1c44575ab0db/images/3xgZIWRR0ppuKrYdjIRtLU6kR_sw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Malmö anmälde aldrig stölderna på äldreboenden", "summaries": {"normal": "Malmö stad har under tre år brutit mot lagen genom att inte anmäla 180 misstänkta stölder inom äldreomsorgen till Ivo. En utpekad undersköterska med flera polisutredningar mot sig har dessutom återanställts upprepade gånger. Först efter mediegranskning i somras stängdes personen av. Staden medger allvarliga brister i både anmälningar och referenstagning.", "trump": "Malmö misslyckas totalt, en katastrof! De har struntat i att anmäla hundratals stölder mot äldre och gett nya jobb till en utredd person i åratal. Oerhört svagt ledarskap. De stängde av personen först när media tvingade dem. Helt otroligt inkompetent hantering, jag säger er, det är en stor skam för hela staden!", "stalin": "Det råder total oordning i Malmös äldreomsorg. Hundratals stölder har dolts för statliga organ, och illojala element har belönats med nya kontrakt om och om igen. Sådan inkompetens tolereras inte i en fungerande stat. Sektionschefer som sviker sitt ansvar granskas nu, och ordning ska återställas med järnhand för att skydda samhällets mest sårbara."}, "date": "1 september, 11:31", "url": "https://bulletin.nu/malmo-anmalde-aldrig-stolderna-pa-aldreboenden", "imageUrl": "https://cdn.bulletin.nu/articles/7c4ce8d4-1c9c-460f-ac49-0006a4a909c2/preview.jpg?t=1788253176000"}, {"type": "image-right", "heading": "Bridgespelarna: ”Det är för mycket valfläsk och tjafs”", "summaries": {"normal": "Pensionärer i Stockholm samlas regelbundet för att spela bridge på Hägerstensåsens medborgarhus. Spelet erbjuder social gemenskap, mental stimulans och spänning. Många är kritiska till valrörelsen 2026 och upplever att partierna underskattar pensionärer. Flera röstar blankt eller önskar en mittenregering. Klubben söker mer ekonomiskt stöd från stadsdelen.", "trump": "Titta på de här underbara pensionärerna som spelar bridge i Stockholm. Fantastiskt! De hatar den riggade valrörelsen där de globalistiska partierna bara köper röster från barnfamiljer medan de glömmer de som byggde landet. Rena bedragare. Jag älskar att de röstar blankt mot de korrupta eliten. Helt rätt. Gör bridge great again!", "stalin": "Kamrater, dessa pensionärer avslöjar dekadenta klassförrädare som lovar guld och gröna skogar men levererar tomma löften. Jag ler mörkt från historien när de röstar blankt mot de profitthungriga parasiter som styr valrörelsen. Snart kommer utrensning av alla valfläskets lakejer. Bridgeklubben visar arbetarklassens sanna styrka mot borgerlig dekadens."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/innehall/bridgespelarna-det-ar-mycket-valflask-och-tjafs", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-98.jpg"}, {"type": "image-right", "heading": "Återupprätta biståndet – för Sveriges säkerhet", "summaries": {"normal": "Socialdemokrater för Tro och Solidaritet kritiserar regeringen för att använda bistånd som finansiering för inrikespolitiska löften som gratis förskola. De menar att nedskärningar i biståndet till fattiga länder och FN-program rasar Sveriges internationella anseende som försvarare av demokrati och fred. Författarna uppmanar till att återställa enprocentsmålet och stödet till UNDP.", "trump": "Folk älskar mig, men de här svenska socialisterna är totala förlorare. De gnäller över att regeringen tar från sina globala kassakossor för att ge gratis dagis istället för att skicka miljarder till korrupta diktaturer. Patetiska! Sverige var en gång stort, nu är det en skam. Jag fixade Amerika – de borde lära sig innan de går i konkurs som Biden lämnade efter sig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i regeringen plundrar biståndet för att köpa billiga röster med gratis förskola. De river ner sextio års internationellt förtroende och lämnar tomrum åt fiender. Jag ler ironiskt från historien – sådana giriga hyenor förtjänar utrensning. Återställ ordningen, annars sväljer krisen er alla."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/opinion/ateruppratta-bistandet-sveriges-sakerhet", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-31t100338781-300x157.jpg"}, {"type": "image-right", "heading": "Folkbildningens starkaste argument ligger framför oss", "summaries": {"normal": "Artikeln argumenterar för att folkhögskolan kan bli allt viktigare i en framtid där AI tar över många arbetsuppgifter. När arbete inte längre ger identitet och mening behöver människor platser för bildning, gemenskap och skapande. Folkbildningen erbjuder sådana rum utan krav på omedelbar nytta, och kan fungera som en motvikt till ett samhälle där ekonomisk produktivitet definierar människors värde.", "trump": "Folkhögskolor? Lysande! AI kommer att krossa de korkade globalisternas jobbmaskineri och lämna alla dessa woke-aktivister och kvoteringsfanatiker utan mening i livet. Vi behöver inte fler förlorare som sitter och ritar regnbågsflaggor. Ge folket riktiga platser att träffas, inte de dekadenta eliternas fantasier. Amerika först, Sverige borde följa efter istället för att lyssna på dessa misslyckade socialister.", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna redan fruktar maskinernas framfart. Deras falska utbildningsfabriker bygger bara på exploatering och tom nytta. Jag säger: folkbildningens kollektiva verkstäder kan bli vår nya utrensning mot den parasitiska individualismen. Låt folket skapa och organisera sig fritt från de blodsugande penninghyenornas grepp. Annars väntar ett samhälle av meningslös dekadens."}, "date": "1 september, 01:26", "url": "https://www.dagensarena.se/opinion/folkbildningens-starkaste-argument-ligger-framfor-oss", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Jetdrönare Rysslands nya vapen: ”Definitivt dåligt för Ukraina”", "summaries": {"normal": "Ryssland har infört jetdrivna varianter av Shahed-drönare, kallade Geran-4. De når upp till 500 km/h och 5 000 meters höjd, vilket gör dem betydligt svårare att skjuta ner än tidigare modeller. Drönarexperten David Hambling konstaterar att det krävs robotar för att bekämpa dem, något som är både dyrt och sällsynt. Andelen sådana drönare i ryska attacker har ökat kraftigt.", "trump": "De där ryska jetdrönarna flyger som raketer medan Ukrainas luftförsvar ser ut som en samling woke-snowflakes med nerdragna byxor. Biden lämnade dem med skräp, men nu under min ledning ska vi se till att det inte blir några fler billiga segrar för Putins supersnabba leksaker. De dekadenta globalisterna hatar att vi vinner med riktig styrka.", "stalin": "Dessa nya jetdrivna verktyg visar återigen hur svaga de giriga klassfienderna är när de möter verklig beslutsamhet. Jag ser från historien hur fienderna skriker efter sina dyra robotar medan den ryska intressesfären fortsätter framåt. Ukrainas fientliga hinder är bara patetiska försök från västvärldens parasiterande lakejer att fördröja det oundvikliga. Låt dem darra."}, "date": "1 september, 10:41", "url": "https://www.svt.se/nyheter/utrikes/nya-ryska-dronaren-darfor-ar-den-sa-svar-att-skjuta-ner", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.64/70a1b09ea6a78f42ba03b4fa5c8b75afbaa54ba7f89187021341acd058502725"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "M lovar full finansiering av alla vallöften", "summaries": {"normal": "Moderaterna presenterar ett valmanifest med 226 punkter och lovar full finansiering av alla vallöften. Partiet vill sänka skatter, avskaffa förskoleavgifter och göra arbetsgivarens månadskort skattefria. Målet är högst levnadsstandard i EU om tio år, halverat försörjningsstöd och att eliminera gängvåldet. Finansieringen sker genom besparingar på byråkrati, bidrag och bistånd samt ökad tillväxt.", "trump": "Titta på de här svenska måttligt begåvade socialisterna som kallar sig Moderaterna. De lovar skattelättnader och att krossa gängen, men det är samma gamla globalistiska snack om att flytta pengar från bistånd till välfärd. Patetiska! Jag fixade mycket bättre tillväxt på min tid än vad dessa woke-vänliga byråkratälskare någonsin kommer att göra. Sverige behöver en riktig ledare, inte fler löften.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare lovar att halvera bidragen och utradera gängen medan de planerar att suga ut mer ur arbetarna genom stram migration. Jag skrattar mörkt från historien åt deras löjliga försök att stärka arbetslinjen. Inom kort kommer deras omprioriteringar att avslöja dem som de giriga parasiter de är. Ingen utrensning är för stor för att skydda folkets intressen."}, "date": "1 september, 10:18", "url": "https://www.svt.se/nyheter/inrikes/m-lovar-full-finansiering-av-alla-valloften", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.6/a1b0cf1cfded48f92cc48ca4dc96a09ed1554bf6ef3b2b8495c97ae5d953787a"}, {"type": "image-full", "heading": "Åkesson om bråken: ”Bör bejaka våra skillnader”", "summaries": {"normal": "I TV4:s Valutfrågningen kommenterade Jimmie Åkesson Tidöpartiernas bråk och Ebba Buschs uttalanden om ett samarbete med S. Åkesson vill bejaka partiernas skillnader för att maximera rösterna och försvarar sitt ultimatum till Liberalerna. Han uttryckte även oro för att Örebropartiet ska stjäla viktiga väljare från Sverigedemokraterna.", "trump": "Jimmie Åkesson har det tufft, totalt kaos med hans så kallade vänner i regeringen! De bråkar hela tiden, precis som falska nyheter-medierna. Och nu är han rädd för något litet Örebroparti som ska sno hans väljare? Väldigt svagt! Jag hade löst det på en sekund med enorma framgångar. Sad!", "stalin": "Kamrat Åkesson gråter ut i televisionen över illojala bundsförvanter och små desertörer som Örebropartiet. Så ser det ut när disciplinen brister i de borgerliga leden! Om de inte kan ena sig mot hotet måste vi skicka dem på en uppfostrande semester i Sibirien. Partiet kräver absolut lojalitet, annars väntar korrektionsarbete!"}, "date": "31 augusti, 20:29", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-tidobraket-vill-inte-braka/cG9zdDoxNzk0NTg", "imageUrl": "https://images.kvartal.se/2026/08/d82bd903-akesson-1.webp"}, {"type": "image-right", "heading": "C-topp: Svenskar som vill ha assimilation bör lämna landet", "summaries": {"normal": "Centerpartiets riksdagskandidat Aida Karimli kritiserar i ett inlägg på sociala medier svenskar som kräver att invandrare assimileras, och menar att de som vill det bör lämna landet. Karimli lyfter fram integration genom arbete och företagande som centrala frågor, samtidigt som hon är starkt kritisk till Tidösamarbetet och Sverigedemokraterna.", "trump": "Helt otroligt! Centerpartiet har en total katastrof till kandidat, Aida Karimli, som säger åt sina egna väljare att lämna landet! Kan ni tänka er? Om någon sa så i USA skulle de vara ute på gatan direkt. Vi vill ha jobb och stark ekonomi, inte så här galet tjafs. Fake news-politiker som skrämmer bort folk!", "stalin": "Den så kallade politikern Aida Karimli visar prov på ett farligt borgerligt virrvarr kring assimilation och arbetsmarknad. Att uppmana medborgare att lämna landet löser inga produktionsmål. Vi ska granska hennes ställningstaganden grundligt i centralkommittén. Den som inte bidrar till femårsplanen och kollektivets välfärd kommer omedelbart att skickas på omvärdering."}, "date": "1 september, 10:00", "url": "https://samnytt.se/c-topp-svenskar-som-vill-ha-assimilation-bor-lamna-landet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01072801/aida-karimli-c.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Langade tio liter hembränt på fängelse – kan förlora jobbet", "summaries": {"normal": "En kriminalvårdare tog med tio liter hembränt till fängelset och gav det till en kollega i köket. Kollegan ställde dunkarna i sin bil, där de senare upptäcktes av arbetsgivaren. Händelsen utreds internt, har polisanmälts och kan leda till att kvinnan avskedas enligt Kriminalvårdens rekommendation.", "trump": "Kan ni tro det? En kriminalvårdare smyger in tio liter hembränt på fängelset som en riktig förlorare. Sedan ger hon bort det till en annan idiot som ställer det i bilen. Patetiskt! I mitt Amerika skulle vi sparka dem direkt, inga woke-kvoter eller snälla HR-snowflakes, bara ren utrensning av de inkompetenta.", "stalin": "Jag ser hur dessa dekadenta folkförtryckare inom fängelseväsendet förgiftar arbetarkollektivet med hembränt. En sådan handling är sabotage mot statens ordning. Vi måste omedelbart inleda en grundlig utrensning bland dessa moraliskt ruttnande element innan deras giriga hyenor sprider vidare kaos och förräderi mot folket."}, "date": "1 september, 08:28", "url": "https://arbetet.se/2026/09/01/langade-tio-liter-hembrant-pa-fangelse-kan-forlora-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01082732/dunkar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åklagaren förtegen om dödsmisshandeln i Karlstad", "summaries": {"normal": "I Karlstad misshandlades en 48-årig svensk man till döds utanför en restaurang natten till söndagen. Två män i 20-årsåldern greps och anhölls misstänkta för dråp. Åklagaren är mycket förtegen och vill inte kommentera händelseförloppet, motiv eller de anhållnas bakgrund. De ska begäras häktade senast på onsdag.", "trump": "Titta på det här. I Karlstad slår två galna 20-åringar ihjäl en oskyldig pappa som bara var ute med sin dotter. Totalt kaos, precis som under Biden. De woke-domarna och den svenska vänsterns mjuka rättsväsende kommer släppa ut dem igen. Vi behöver lag och ordning, inte den här sjuka identitetspolitiken som skyddar brottslingar.", "stalin": "Ännu en tragisk händelse i det dekadenta västerlandet där giriga hyenor tillåter att oskyldiga medborgare slås ihjäl på öppen gata. Jag ser hur klassfiendernas svaga rättsapparat skyddar de verkliga brottslingarna. Vi skulle ha rensat ut dessa element redan i ett tidigt skede. Paranoia är ingen överdrift när fienden lurar överallt."}, "date": "1 september, 11:22", "url": "https://riks.se/nyheter/aklagaren-fortegen-om-dodsmisshandeln-i-karlstad", "imageUrl": "https://admin.riks.se/uploads/medium_drapet_i_karlstad_hero_a3c90a2132.jpg"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "En unik kapitalmarknad hotas efter valet", "summaries": {"normal": "Gunnar Hökmark varnar för att Socialdemokraterna, Vänsterpartiet och Miljöpartiet hotar Sveriges unika kapitalmarknad med höjda skatter på banker, kapitalinnehav och inkomster. Han lyfter fram den dynamiska aktiemarknaden, många börsnoteringar och starka investeringar som grund för tillväxt, jobb och välfärd. Enligt honom riskerar hårdare beskattning att minska investeringar och underminera ekonomin.", "trump": "Lyssnar ni på de där socialistiska förlorarna? De vill krossa Sveriges fantastiska aktiemarknad med sina galna skattehöjningar på banker och rika. Det är en total katastrof! Jag byggde den bästa ekonomin i historien innan den sömnige Joe förstörde allt. Sluta lyssna på dessa identitetspolitiska nollor som hatar framgång – sänk skatterna och gör Sverige stort igen!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom socialdemokratin och de gröna vill med sina skattehöjningar krossa den borgerliga spekulationsmaskinen som de kallar kapitalmarknad. Jag ler mörkt från historien åt deras ynkliga försök att plocka mer från de parasiterande kapitalisterna. Men akta er, sådana halvmesyrer leder bara till svaghet. Riktig utrensning av folkförtryckarna vore bättre."}, "date": "1 september, 07:35", "url": "https://www.di.se/debatt/en-unik-kapitalmarknad-hotas-efter-valet", "imageUrl": "https://static.bonniernews.se/ba/d87c74c5-2bb0-45b7-86dc-fd58da464394.jpeg?crop=768%2C384%2Cx0%2Cy158&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Tesla ville bråka med svenska facken – det blev jävligt dyrt!”", "summaries": {"normal": "Konflikten mellan Tesla och svenska fackföreningar avslutades den 19 augusti. Tesla mötte inte bara IF Metall utan hela den svenska fackliga rörelsen med sympatiåtgärder från flera yrkesgrupper. Företaget blev överraskat av styrkan i den svenska modellen och konflikten blev både längre och dyrare än väntat. Facken betonar vikten av solidaritet inför kommande avtalsrörelser.", "trump": "De där eländiga svenska fackhyenorna körde över Teslas idioter fullständigt. Hela packen av sympatistrejkande slöa byggjobbare och hamnarbetare slöt upp som en mur av facklig galenskap. Tesla trodde de skulle vinna mot den svenska modellen, men det blev jävligt dyrt. Patetiska globalister lär sig aldrig: angrip socialismen och du får betala priset. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare från Tesla trodde de kunde splittra den enade arbetarkraften. Jag ser med mörk tillfredsställelse hur hela den fackliga fronten slog tillbaka med järnhand. De dekadenta utländska profitörerna mötte en mur av solidaritet och fick betala dyrt för sin arrogans. Låt detta vara en läxa: ingen fiende undkommer kollektivets vrede ostraffat."}, "date": "1 september, 08:01", "url": "https://arbetet.se/2026/09/01/tesla-ville-braka-med-svenska-facken-det-blev-dyrt-for-dem", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31173119/unga-elektriker-tesla.jpeg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Man misshandlades till döds i centrala Karlstad – två män misstänks för dråp", "summaries": {"normal": "En man i 50-årsåldern har avlidit efter en grov misshandel i centrala Karlstad i samband med krogstängning. Två män i 20-årsåldern är anhållna misstänkta för dråp, och uppgifter förekommer om att en tredje person kan ha gripits. Polisen utreder motivet och söker efter vittnen samt övervakningsmaterial.", "trump": "Karlstad är helt utom kontroll, en veritabel katastrof! Jag tittar på det här, hemskt våld utanför en restaurang, fruktansvärt. De radikala vänsterliberalerna har förstört allt med sin slappa syn på brott. I mitt Amerika skulle sånt här aldrig hända, vi sätter dit dem stenhårt. Fake news-medierna pratar om tre misstänkta, vem vet? En total röra. Sad!", "stalin": "En tragisk och oacceptabel ordningsstörning på Östra Torggatan i Karlstad har lett till en borgares död. Statsmakten tolererar inte att kriminella element agerar fritt utanför statliga restauranger vid stängningsdags. De skyldiga har gripits och kommer att genomgå en grundlig revision av sina livsöden. Ordning skall råda i proletariatets folkhem!"}, "date": "1 september, 09:00", "url": "https://samnytt.se/man-misshandlades-till-dods-i-centrala-karlstad-tva-man-misstanks-for-drap", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01064535/karlstad-polis.jpg"}, {"type": "image-full", "heading": "Jan Emanuel (S) vill att partiledningen avgår", "summaries": {"normal": "S-profilen Jan Emanuel meddelar att han inte kommer att rösta på Socialdemokraterna i höstens val, efter att ha gästat SD i Örebro. Han anser att partiet har flyttat sig från arbetarleden och kritiserar dess samarbetspartners. Trots detta kallar han sig traditionell socialdemokrat och kräver att partiledningen avgår för att rädda partiet.", "trump": "Very smart guy, min käre vän Jan Emanuel, en riktig vinnare som inser att radikala socialdemokrater har förstört Sverige! Han vägrar rösta på dem, total katastrof till ledning, fake news! Han dök upp hos SD i Örebro och sa det som alla tänker: ledningen måste bort! Precis som mina siffror, helt enormt!", "stalin": "Den så kallade kamraten Jan Emanuel bedriver subversiv verksamhet genom att vägra rösta på partiet och kräva ledningens avgång efter sitt misstänkta uppträdande i Örebro. Att skylla på ideologisk förskjutning är kontrarevolutionärt. Partiapparaten tolererar inga fraktioner; om ledningen har misslyckats med att upprätthålla järngreppet kommer Folkets kommissariat att vidta nödvändiga åtgärder omedelbart."}, "date": "1 september, 10:04", "url": "https://bulletin.nu/jan-emanuel-s-vill-att-partiledningen-avgar", "imageUrl": "https://cdn.bulletin.nu/articles/2c0eed92-1919-4f69-8786-d2b3d9cdd1c3/preview.jpg?t=1788249799000"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-right", "heading": "M vill vinna valet med våldtäktsstrategi", "summaries": {"normal": "Moderaterna har presenterat 30 förslag mot mäns våld mot kvinnor inför valet. Artikeln kritiserar att partiet tidigare under mandatperioden låtit hälften av landets skyddade boenden stänga, vilket försvårat stödet till våldsutsatta. Skribenten ifrågasätter tidpunkten för engagemanget och efterlyser istället satsningar på ekonomiskt oberoende, jourernas finansiering och förebyggande arbete.", "trump": "Titta på de här patetiska Moderaterna som plötsligt låtsas rädda svenska kvinnor med en desperat våldtäktsstrategi två veckor före valet. De har stängt hälften av skyddade boenden medan de styrde, nu febrilt twittrar om serievåldtäktsmän. Vilka förlorare! Kvinnor röstar inte på svaga globalister som utnyttjar rädsla istället för att fixa ekonomin och stoppa den galna vänsterpolitiken.", "stalin": "Jag betraktar hur dessa dekadenta folkförtryckare i Moderaterna plötsligt vädrar rädsla som ett vapen mot arbetarkvinnorna. De har låtit skyddade boenden stänga medan de sitter vid makten, nu försöker de med sin fega valpropaganda. Kamrater, sådan opportunism förtjänar utrensning. Vi ska bygga ett samhälle där kvinnornas oberoende krossar alla parasiterande hyenor som göder sig på våldet."}, "date": "1 september, 06:59", "url": "https://arbetet.se/2026/09/01/moderaterna-vinner-val-med-valdtaktsstrategi", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01065534/vald-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Muslimsk TikTok-profil till kristen kvinna: ”Du kommer att torteras”", "summaries": {"normal": "En muslimsk TikTok-profil med nära en halv miljon följare har hotat en kristen libanesisk kvinna i Frankrike. I ett klipp spottar han och säger att hon ska torteras både i detta livet och efter detta på grund av sin tro och sitt kors. Mannen uppges befinna sig illegalt i landet efter att ha tagit sig via Spanien.", "trump": "Titta på det här, folk. En galen radikal islamist med en halv miljon följare på TikTok spottar och hotar en stackars kristen kvinna i Frankrike med tortyr. Typiskt de där woke-vänsterns älskade mångkulturalister som vi städade bort under min förra mandatperiod. Biden släppte in dem alla, nu torterar de kristna på gatorna. Patetiskt!", "stalin": "Se hur de dekadenta religionshyenorna river sönder varandra i det ruttnande väst. Jag betraktar med avsmak denna hotfulla arab som lovar tortyr åt en kristen kvinna. Sådana klassförrädare mot folket förtjänar snar utrensning. Deras falska gudar och imperier ska alla krossas under arbetarklassens järnhand. Skrattretande svaghet."}, "date": "1 september, 10:38", "url": "https://riks.se/nyheter/muslimsk-tiktok-profil-till-kristen-kvinna-du-kommer-att-torteras", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_1_2026_09_22_36_AM_74d1165429.png"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så mycket sjönk matpriserna efter momssänkningen", "summaries": {"normal": "Mellan mars och april sjönk livsmedelspriserna med 5,5 procent efter att matmomsen halverades. Konsumentverket och Konjunkturinstitutet bekräftar att momssänkningen fick fullt genomslag i samtliga stora matvarukedjor. Prisnedgången var bred och märktes i hela sortimentet, till skillnad från hämtmaten där genomslaget var begränsat. Reformen beräknas spara över 500 kronor i månaden för en barnfamilj.", "trump": "Sverige halverade matmomsen och priserna rasade med 5,5 procent. Fantastiskt, helt enkelt fantastiskt! Alla fyra jättekedjor sänkte priserna, precis som jag alltid säger att man gör med smarta skattesänkningar. Över 500 spänn i månaden till vanliga barnfamiljer. Inte som de radikala vänstermänniskorna som bara vill höja skatterna. Siffrorna ljuger inte, en enorm succé!", "stalin": "Genom partiets och statensvisa ingripande har livsmedelspriserna tvingats ned med 5,5 procent efter en halvering av matmomsen. Fyra kapitalistiska kedjor lydde omedelbart folkets vilja. De kontrarevolutionära tendenserna hos hämtmaten har dock noterats och kommer att utredas. Varje familj tilldelas nu en besparing på 500 kronor i månaden. Planekonomin triumferar återigen över marknadens kaos."}, "date": "1 september, 09:27", "url": "https://bulletin.nu/sa-mycket-sjonk-matpriserna-efter-momssankningen", "imageUrl": "https://cdn.bulletin.nu/articles/68bf0ae9-b93c-4682-bf0a-c492d5c9eadb/preview.jpg?t=1788247217000"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "text", "heading": "OncoZenge: Stoppad betalning efter emissionsbesked – bevakning inleds", "summaries": {"normal": "Bioteknikbolaget OncoZenge genomför en företrädesemission på 33,3 miljoner kronor för att finansiera sin fas 3-studie av läkemedelskandidaten BupiZenge. Den kinesiska storägaren Sichuan håller inne en betalning på 10 miljoner kronor och anser att emissionen bryter mot investeringsavtalet. Bolaget har även säkrat ett brygglån samt tecknings- och garantiåtaganden för att rädda upp likviditeten.", "trump": "Kineserna försöker blåsa OncoZenge på tio miljoner! Väldigt smart av dem, men inte lika smart som min tullpolitik, tro mig. Nu dumpar de sina certifikat och gnäller på en helt fantastisk emission. Jag känner styrelsen, bra människor, men de behöver en vinnare. Fas 3-studier, brygglån, miljardärer som Erik Selin – det är storslaget! Men betala pengarna, Kina!", "stalin": "Den kinesiska investeraren Sichuan visar kriminell brist på disciplin genom att undanhålla de utlovade 10 miljonerna till OncoZenges ädla kamp mot oral mukosit. Sådant sabotage tolereras icke i en sund stat! Vi beordrar omedelbar mobilisering av kapital och insatser från kamrat Erik Selin. Den byråkratiska maskinen för fas 3-studien kommer att rulla över alla kontrarevolutionära betalningsvägrare."}, "date": "31 augusti, 12:13", "url": "https://www.affarsvarlden.se/artikel/oncozenge-stoppad-betalning-efter-emissionsbesked-bevakning-inleds"}, {"type": "image-right", "heading": "Tidö: Begränsa vinsterna från gangsterrap", "summaries": {"normal": "Regeringen vill utreda hur man kan begränsa inkomster för dömda personer som tjänar pengar på skildringar av sina grova brott. Intäkterna ska kunna gå till brottsoffer. Uppdraget är ett tillägg till utredningen om åtgärder mot gängkriminella och inspireras av amerikanska Son of Sam-lagar. Utredningen ska vara klar 2028.", "trump": "Folk, det är en total skandal. De här svenska gangsterrapparna blir rika på att skryta om mord och kaos medan hederliga människor lider. Vi stoppar den här galna affären direkt. Pengarna ska gå till offren, inte till dessa patetiska brottshjältar. Amerika leder vägen, Sverige borde följa efter istället för att vara så svaga.", "stalin": "Kamrater, dessa profitthungriga skuggparasiter skamlöst berikar sig på lidandet de själva orsakat. Jag ser en stötande förnedring av arbetarklassen och brottsoffren. Vi måste rensa ut denna dekadenta profitkultur med järnhand. Inga fiender till folket ska tillåtas vända brott till guldkantade självbiografier. Staten tar kontrollen."}, "date": "1 september, 08:15", "url": "https://www.svt.se/kultur/tido-vill-begransa-vinster-pa-brottsskildringar-pekar-pa-gangsterrap", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.32/0.21/c46a951ad86548ec5b67f9100ca9dbf2d09cf6b05b9198a1fccc426d35040ee1"}, {"type": "image-right", "heading": "Malmö mörkar stöldvåg inom äldreomsorgen", "summaries": {"normal": "Malmö stad har under tre år missat att anmäla 180 misstänkta stölder inom äldreomsorgen till IVO. Trots polisutredningar om grova stölder kunde en undersköterska fortsätta få nya anställningar inom kommunen fram till en mediegranskning i somras. Kommunen medger nu allvarliga brister i både rutiner och referenstagning.", "trump": "Malmö är i totalt kaos, tro mig! 180 stölder begångna mot våra äldre, och de bara sopar det under mattan utan att anmäla. De lät en skum arbetare få nya jobb om och om igen! Komplett inkompetens. Jag behövde bara titta på det så fick de sparken direkt. Oerhört svagt ledarskap!", "stalin": "Ett skamligt förfall i Malmö! 180 interna stölder mot de äldre och inte en enda rapport till centralmakten. Slarviga chefer som anställer förrädare om och om igen utan kontroll. När staten till slut ingriper sparkas de skyldiga omedelbart. Så rensas elementen ut ur systemet!"}, "date": "1 september, 08:00", "url": "https://samnytt.se/malmo-morkar-stoldvag-inom-aldreomsorgen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31143853/rollator-silhuett.jpg"}, {"type": "image-right", "heading": "Vice riksbankschef ser ökad inflationsrisk", "summaries": {"normal": "Vice riksbankschef Per Jansson bedömer att inflationsriskerna har ökat något, men att Riksbanken kan avvakta med att ändra penningpolitiken. Läget präglas av en svag arbetsmarknad och stabila inflationsförväntningar. Jansson understryker dock en beredskap att snabbt agera om inflationsbilden försämras.", "trump": "Svenskarna har problem med inflationen, totalt katastrofalt! Men den här centralbankschefen, Per, säger att de bara kan vänta och titta på. Vänta på vad? Att ekonomin kollapsar helt? De borde lyssna på mig, sänka skatterna och sätta borren i backen! Om inte USA fixar det åt dem kommer det sluta i total ruin, believe me!", "stalin": "Kamrat Per Jansson rapporterar om svängningar i den svenska inflationen. En svag arbetsmarknad och borgerliga priser skapar oro. Vi noterar att Riksbanken avvaktar. Men låt dem veta: den som misslyckas med att hålla penningvärdet i schack kommer omedelbart att omplaceras till mer lämpliga arbetsuppgifter i Sibirien. Inga ursäkter accepteras!"}, "date": "31 augusti, 11:47", "url": "https://www.affarsvarlden.se/artikel/vice-riksbankschef-ser-okad-inflationsrisk", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/sdlVIGRvGrU9m4-nh-e1732696701837-400x267.jpg"}, {"type": "image-full", "heading": "Stopp i tågtrafiken mellan Stockholm och Göteborg", "summaries": {"normal": "Under måndagskvällen drabbades tågtrafiken mellan Stockholm och Göteborg av stora förseningar på grund av ett elfel vid Årstaberg. Ett stillastående tåg drabbades extra hårt av bristfällig information, vilket ledde till ilska och upprörda passagerare. Trafiken började gradvis rulla på ett av spåren under kvällen efter säkerhetskontroller.", "trump": "Sveriges tågtrafik är en total katastrof, helt inkompetent! Ett enkelt litet elfel vid Årstaberg stoppade hela linjen mellan Stockholm och Göteborg, och resenärerna skriker av ilska på grund av noll information. Sånt händer aldrig i mitt Amerika, vi bygger bäst, snabbast och starkast. Det här är fake news-nivå av kaos!", "stalin": "Ett förrädiskt elfel i Årstaberg har förlamat järnvägslinjen mellan Stockholm och Göteborg. Dessa upprörda, skrikande passagerare som saknar information visar ett farligt borgerligt förfall. Statens transportkommission kräver omedelbara förhör med lokförare och ansvariga. Sådana sabotage mot kollektivtrafiken tolereras inte; de skyldiga kommer att finna sig omplacerade långt mot norr."}, "date": "31 augusti, 21:58", "url": "https://www.gp.se/nyheter/sverige/stopp-i-tagtrafiken-mellan-stockholm-och-goteborg-.02dacc2c-0839-43dd-8e51-383acab70551", "imageUrl": "https://www.gp.se/images/article/02dacc2c-0839-43dd-8e51-383acab70551/images/1d6Kw4HKtfaw70VU3NFdYsOWT6KA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Ni kräver kompetens av oss – men vilken kompetens har ni som bestämmer?”", "summaries": {"normal": "Undersköterskan Fredrika Andersson kritiserar politikerna för att de ignorerar personalens varningar om tidsbrist och utmattning inom äldreomsorgen. Scheman håller inte i verkligheten, kompetent personal lämnar och de äldre får otillräcklig omsorg. Hon uppmanar beslutsfattarna att följa med i vardagen och lyssna på dem som arbetar på golvet innan fler slutar.", "trump": "De inkompetenta politikerna i det här socialistiska helvetet kräver att undersköterskorna ska vara superhjältar medan de själva sitter i sina lyxiga kontor och effektiverar ihjäl systemet. Det är en total katastrof! Personalen springer som galningar och de stackars gamlingarna får tio sekunder per dag. Vakna upp, era värdelösa byråkratblodiglar, innan hela skiten kollapsar!", "stalin": "Kamrater, dessa dekadenta klassförrädare i politiken blundar medvetet medan arbetarna inom äldreomsorgen utmattas under tidspressens järnhand. Jag ser hur de profitthungriga beslutsfattarna offrar folkets välfärd på effektiviseringens altare. Gå ut bland folket, lyssna eller förbered er på utrensning av de som sviker de arbetande massorna. Detta är ett sabotage mot kollektivet."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/ni-kraver-kompetens-av-oss-men-vilken-kompetens-har-ni-som-bestammer-over-aldreomsorgen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31144036/ka-debatt-kompetens.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Tobias får inget jobb: ”Mår dåligt av regeringens hatiska attityd”", "summaries": {"normal": "Tobias är fortfarande arbetslös och känner sig utsatt av både hat på internet och regeringens attityd. Han söker jobb inom trädgård och lager, planerar att ta körkort och går kurser. Han kritiserar Arbetsförmedlingen för meningslösa möten, bristande stöd och gammaldags system. Han önskar bättre trygghet och en ny regering som höjer bidragen.", "trump": "Den här stackars killen Tobias sitter fast i Bidens soppa och nu den här svenska vänsterregeringens hat mot vanliga arbetare. De kallar det stöd men det är bara fikamöten med Rusta och matcha. Totalt misslyckande! Vi behöver inte mer byråkrati, vi behöver jobb, inte dessa deklasserade socialisthjärnor som hatar folk som faktiskt vill arbeta. Patetiskt!", "stalin": "Denna arbetslöse kamrat avslöjar de parasiterande klassförrädarnas förtryckande system. Deras meningslösa fikamöten och föråldrade maskineri visar imperialismens svaga underliv. Jag ser hatet från penninggalna hyenor som vill likvidera arbetarklassens värdighet. Vi måste rensa ut dessa dekadenta element och bygga ett äkta trygghetssystem för folket. Fienden sover aldrig."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/tobias-far-inget-jobb-mar-daligt-av-regeringens-nastan-hatiska-attityd", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31125859/tobias-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Åkesson: När jag var fem visste jag att det var fel att mörda", "summaries": {"normal": "Jimmie Åkesson (SD) anser att brottsoffret måste stå i centrum även vid brott begångna av mycket unga barn. Han vill hålla farliga personer borta från gatan, men omhändertagandet ska anpassas efter barnets ålder. Åkesson kritiserar svensk kriminalpolitik för att ha prioriterat gärningsmannen framför offret och avfärdar remisskritik mot hårdare straff.", "trump": "Lyssnar ni på den här svenske killen Åkesson? Han fattar det! De här mini-mördarna ska inte springa runt på gatorna och döda ärliga människor. Håll de farliga små monsterbubblorna borta från samhället. Sverige har haft den värsta socialistiska kriminalpolitik under Sleepy Joe-eran, men nu vaknar folk äntligen. Fantastiskt!", "stalin": "Jag betraktar med förakt hur dessa borgerliga liberaler fortfarande skyddar samhällets fiender under förevändning av ålder. Farliga element som hotar folkets trygghet måste isoleras omedelbart, oavsett hur små de är. Att prioritera brottslingens välbefinnande framför proletariatets säkerhet är kontrarevolutionärt nonsens. Rättvisa åt offret, eller döden åt svagheten!"}, "date": "31 augusti, 21:53", "url": "https://www.tv4.se/artikel/1SKHoEYgUbMY7qcq9gk5Ik/akesson-naer-jag-var-fem-visste-jag-att-det-var-fel-att-moerda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1KdIURGhv2MBS38b8plQEq%2Fd5ec500910d3f7ab0fa30922fdc10eb4%2F31-akesson-puff-webb.png&width=1024"}, {"type": "image-right", "heading": "Från bokföringskrångel till strategisk kraft", "summaries": {"normal": "Filip Ullsten, grundare av Worktiles och tidigare finanschef, beskriver hur fragmenterade system och bristande arbetsflödeshantering skapar stress och felrisker inom ekonomifunktionen. Han menar att AI måste förstå hela ekonomiprocessen för att ge värde. Worktiles samlar flöden, automatiserar uppgifter och ger bättre överblick. Plattformen används av både små och stora bolag som H&M.", "trump": "De där patetiska Excel-slavarna och deras fragmenterade system är en total katastrof, tro mig. Ringande telefoner hela sommaren, utbrända finanskillar, det är vad den giriga byråkrat-eliten lämnar efter sig. Min administration fixade mycket bättre. Nu kommer AI och gör det på minuter istället för veckor. Fantastiskt! Men bara om den inte styrs av några woke-konsulter.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom ekonomin klamrar sig fast vid sina splittrade system och Excel-listor som drunknande råttor. Deras sena nätter och utbrändhet är bara symptom på det förtryckande systemets kollaps. Jag ser hur AI kan bli ett vapen för kollektiv planering, men bara om vi rensar ut de profitthungriga parasiter som gömmer sig bakom fragmenterade flöden. Ordning skall råda!"}, "date": "1 september, 05:00", "url": "https://www.di.se/nyheter/fran-bokforingskrangel-till-strategisk-kraft", "imageUrl": "https://static.bonniernews.se/ba/f269b19a-cdfe-4c22-bf26-0d517488dd24.jpeg?crop=1418%2C798%2Cx0%2Cy22&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Missnöjet minskar inte av Tidöstyre", "summaries": {"normal": "En ny rapport visar att SD-väljarna behållit extrema ståndpunkter om invandring trots kraftigt minskade nivåer. De har radikaliserats ytterligare kring medborgarskap och uppvisar fortsatt hög misstro mot medier och domstolar. Samtidigt har Moderaternas väljare närmat sig SD:s värderingar, medan SD-väljarna blivit mer högerinriktade i ekonomiska frågor.", "trump": "Folk, ni måste se det här! De där galna SD-väljarna röstar fortfarande för att stänga gränserna trots att Sverige knappt släpper in någon längre. Och nu har de dragit med sig de patetiska moderaterna in i samma virvel. De kallar det radikalisering, jag kallar det sunt förnuft. Fake news-medierna och de riggade domstolarna hatar det förstås. Amerika först, Sverige vaknar äntligen!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna desperat försöker förklara varför arbetarnas missnöje består trots alla deras lögner. SD-väljarna har genomskådat den dekadenta borgerlighetens spel och kräver nu utrensning av främmande element. Deras misstro mot de lögnaktiga medierna och domstolarna är en sund reaktion. Revolutionen fortsätter, fienderna skälver."}, "date": "31 augusti, 16:10", "url": "https://www.dagensarena.se/opinion/missnojet-minskar-inte-av-tidostyre", "imageUrl": "https://www.dagensarena.se/files/2026/08/sd-valjare.jpeg"}, {"type": "image-full", "heading": "EU kan driva igenom ny snuslag – om Sverige saknar regering", "summaries": {"normal": "Sveriges regeringsbildning efter valet kan påverka EU:s beslut om tobaksskatt. Om en svensk regering saknas vid oktobermötet kan Sverige tvingas avstå från omröstning, vilket underlättar för EU att införa höjda skatter på nikotinprodukter. Sverige har hittills varit ett hinder för förslaget då man vill skydda snuset, som anses vara ett mindre skadligt alternativ än cigaretter.", "trump": "Sverige har ett totalt kaos med sin regeringsbildning, en riktig katastrof! Nu försöker EU utnyttja det för att höja skatterna på svenskarnas snus. Det är vad jag kallar dåliga affärer. De vill beskatta allt, precis som de radikala vänsterliberalerna här hemma. Sverige borde sköta sitt, behålla sitt snus och sluta lyssna på byråkraterna i Bryssel. Sad!", "stalin": "Dessa svenska teknokrater kan inte ens organisera en enkel regering, och nu riskerar de sitt folk genom att låta Bryssel styra. Att inte kunna rösta i en kritisk fråga om tobak är ett tecken på absolut svaghet. En sann stat kräver ordning och disciplin, inte detta parlamentariska förfall. De svaga kommer alltid att bli överkörda av unionens byråkratiska maskineri."}, "date": "31 augusti, 17:20", "url": "https://www.realtid.se/juridik/eu-kan-driva-igenom-ny-snuslag-om-sverige-saknar-regering", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdl9tqtsoxgltm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Irans svar i natt: Attacker mot USA-baser i Jordanien", "summaries": {"normal": "Iran har attackerat amerikanska militärbaser i Jordanien med ballistiska robotar som svar på USA:s anfall mot iranska avfyrningsramper i Hormuzsundet. Jordaniens luftförsvar sköt ned åtta robotar. Attackerna markerar den största direkta konfrontationen mellan länderna på över en månad och spänningarna kring oljetransporten fortsätter.", "trump": "Iranerna, de fega mullorna, försöker sig på en patetisk hämnd mot våra baser i Jordanien efter att vi pulveriserade deras minor i Hormuzsundet. Patetiskt! Mitt inlägg om Kharg som blåses till småbitar fick dem att darra. Biden lämnade kaos, nu fixar jag det med stålhandskar och sanktioner mot deras banker. Amerika först!", "stalin": "Jag betraktar dessa imperialisternas dans kring Hormuzsundet med kall förakt. De amerikanska reaktionärerna och de iranska teokraterna slåss om handelsleder som arbetarklassen borde kontrollera. Deras robotar och bomber är löjliga skådespel för svaga ledare. Den sanna segern tillhör endast det kollektiva folket, inte dessa paranoida narrar som darrar för sin egen skugga."}, "date": "31 augusti, 21:19", "url": "https://www.tv4.se/artikel/tt-260831-iranoro1-065ddc4a/revolutionsgardet-attackerat-usa-mal-i-jordanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlRpEROg0V_XA%2F403eb7f13949090b16f8745ff0e28a0f%2FVantande_containerfartyg_vid_Hormuzsundet__fotograferade_fran_en_strand_i_Iran._Bild_fran_den_27_juli.&width=1024"}, {"type": "image-full", "heading": "Åkesson efter fikat med Busch: ”Vill veta vad exceptionellt läge är”", "summaries": {"normal": "Jimmie Åkesson kritiserade i sitt sommartal Ebba Busch för hennes uttalande om att kunna stödja Magdalena Andersson som statsminister i ett exceptionellt läge. Efter ett möte i Sölvesborg kräver han fortfarande ett tydligt offentligt besked om vad begreppet innebär. Han ser det som ett steg framåt att det inte handlar om valresultat men vill ha klarhet.", "trump": "Lyssnar ni på det här? Den där Busch-kvinnan, en riktig svag ledare, snackar om att rösta på den socialistiska katastrofen Andersson i ett så kallat exceptionellt läge. Patetiskt! Jag träffade många sådana bluffmakare under Biden-åren. Åkesson gör rätt som pressar henne. Kräv ett besked, annars är det bara feg strategi från en förlorare.", "stalin": "Jag betraktar med djup misstro dessa borgerliga opportunister som leker med begreppet exceptionellt läge. Busch döljer sina kapitulationistiska avsikter bakom dimmor av vaghet, precis som folkfiender alltid gör. Åkesson kräver klarhet – klokt. I mitt im
