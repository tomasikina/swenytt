26 augusti, 08:33", "url": "https://www.tv4.se/artikel/5W38I3vTr4rIR1pXUiyl2n/fran-och-med-i-dag-kan-du-foertidsroesta-sa-gar-det-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1xcSQC1yqcm6ssKreXDuCG%2F924932709d7c847954b45f284ce9dab7%2F26fortidsrostaSAJT.jpg&width=120"}, {"type": "text", "heading": "K vill stoppa utförsäljningarna och sänka hyrorna", "summaries": {"normal": "Kommunistiska Partiet vill stoppa utförsäljning av hyresrätter och sänka hyrorna. Artikeln lyfter bostadsbristen, segregationen och kommuners bristande ansvar. Exempel från Lysekil, Alingsås och Göteborg visar hur allmännyttan prioriterar vinst framför rimliga hyresrätter. Partiet ser boendet som en social rättighet snarare än en handelsvara.", "trump": "De här kommunistiska förlorarna i Sverige vill stoppa smarta affärer och ge bort lägenheter till lata hyresgäster. Patetiskt! Istället för att bygga lyx för de som har råd prioriterar de evenemangskvarter – bra, men de borde riva hela det socialistiska systemet. Biden skulle älska deras hyreshöjningar, men jag fixar det bättre.", "stalin": "Kamrater, dessa profitthungriga borgarbrackor och folkfiender förvandlar arbetarnas bostäder till vinstobjekt åt klassfiender och semesterhyenor. Jag ser hur de exploaterande hyenorna säljer ut folkets egendom medan segregationen växer. Rensa ut dessa kapitalistlakejer! Boendet tillhör kollektivet, inte penningpungens tjänare."}, "date": "26 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsfragan"}, {"type": "image-right", "heading": "Sandström: Ny miljardförlust för pensionsfondernas fjärrvärme", "summaries": {"normal": "Solör Bioenergi, ägt av AP-fonderna, gör miljardförlust för 2025 – minus 1,3 miljarder och skulder på 22 miljarder. Trots skyhöga priser, dyrast i landet, räcker det inte. Expansionen blev en dödsspiral, och notan skickas till pensionärerna. Fyndig, eller hur?", "trump": "Svenska pensionärer, de blir lurade! AP-fonderna förlorar 1,3 miljarder – det är enorma summor. Deras företag är dyrast och ändå går det dåligt. Jag skulle ha fixat det på en dag. Inga förluster, bara vinster. De är katastrof!", "stalin": "Kamrater, jag har hört om dessa AP-fonder som förlorar miljarder. Deras ’unika strategi’ är ett sabotage mot folkets egendom. Vi måste rensa ut de skyldiga – direktörerna som inte kan förvalta värmen. Förlusterna är förräderi. En ny utrensning av marknadsfiender är nödvändig."}, "date": "26 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-ny-miljardforlust-for-pensionsfondernas-fjarrvarme", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-39-400x267.jpg"}, {"type": "image-full", "heading": "SVT:s ord till L-ledaren: Du låter som Åkesson", "summaries": {"normal": "Liberalernas ledare Simona Mohamsson kritiserades i SVT:s *Utfrågningen* för klimatpolitiken och sänkta bränslepriser. Hon menade att Sveriges enskilda insatser spelar liten roll globalt och avvisade höjda bränslepriser. Mohamsson jämfördes med Jimmie Åkesson (SD) av programledaren. Hon kommenterade även skolans problem och Åkessons uppmaning till väljare att rösta bort Liberalerna.", "trump": "Vilken katastrof! Liberalernas ledare, Simona, pratar som en förlorare – precis som den där Åkesson-killen. Sverige ensamt? Vem bryr sig? Jag skulle fixa klimatet på en vecka, men nej, hon snackar om Europa. Och skolan? Fullt kaos! 19 700 elever utan behörighet – SAD! Jag skulle göra svensk skola GREAT AGAIN, men hon? Bara ursäkter. Svagt, väldigt svagt!", "stalin": "Kamrater! Denna Mohamsson är ett skolexempel på borgerlig dekadens. Hon pratar om 'kultur' i skolorna medan 19 700 elever lämnas i mörkret – ett systematiskt sabotage mot arbetarklassens framtid! Och klimatet? 'Sverige ensamt spelar liten roll' – ett ynkligt försök att maskera kapitalistisk eftergiftspolitik. Vi skulle ha skickat henne till Sibirien för sådan defaitism! Åkesson? En reaktionär marionett, men till och med han ser igenom hennes liberala svaghet. Revolutionen tolererar inga kompromisser!"}, "date": "25 augusti, 20:21", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-pressas-om-forsamrade-skolresultat/cG9zdDoxNzQzNDE", "imageUrl": "https://images.kvartal.se/2026/08/1a1fea07-mohamssonhokmberg.webp"}, {"type": "image-right", "heading": "Osäkert jobb och sämre hälsa – då blir sjukskrivningarna färre", "summaries": {"normal": "En ny rapport från Försäkringskassan visar att personer med osäkra jobb och sämre hälsa tar ut sjukpenning betydligt mer sällan än fast anställda. Särskilt tydligt är det bland utrikes födda. Förklaringen kan vara rädsla för att förlora jobbet eller okunskap om försäkringen. Även företagare sjukskriver sig mer sällan men längre när de gör det.", "trump": "Folk med usla jobb och dålig hälsa tar nästan aldrig ut sjukpenning, kan ni fatta det? De är rädda för att förlora sina skräpjobb, precis som jag alltid sagt. Fast anställda lever som kungar medan de andra darrar. Patetiskt! Sverige borde skämmas, men det gör de aldrig. Sådana här rapporter är underbara, tro mig.", "stalin": "I denna degenererade borgerliga stat ser vi hur de osäkra proletärerna, plågade av kapitalisternas piska, inte vågar söka sjukpenning av rädsla för utrensning från arbetskollektivet. Det är en mörk komedi värdig västvärldens paranoia. Vi ler ironiskt åt hur de sjuka döljer sin svaghet för att inte provocera borgarbrackornas hämnd. Kamrater, detta är klasskampens tragikomiska ansikte."}, "date": "25 augusti, 15:48", "url": "https://arbetet.se/2026/08/25/rapporten-osakert-jobb-och-samre-halsa-da-blir-sjukskrivningarna-farre", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25154125/trott.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Har högern mörkat om bidragsbrotten?", "summaries": {"normal": "Artikeln ifrågasätter om högerstyren mörkat omfattande bidragsfusk inom ROT-avdrag och privat vård. Skatteverket utgår från tillit gentemot företag, medan privatpersoner ses som potentiella fuskare. Uppdrag granskning och regioner har avslöjat miljonbelopp i fusk hos bland annat Mindler och Mandolean. Frågan väcks om medveten passivitet från högern medan skattemedel sipprat ut ur välfärden.", "trump": "Folk, det här är en total skandal! Högern har låtit dessa vänsterkapitalistiska vårdblodsugare och ROT-fuskare suga ut miljarder ur systemet medan de behandlar vanliga svenskar som brottslingar. Tillitsbaserat för miljardärerna, Gestapo för mammor som tar ut VAB. Patetiskt! Jag skulle ha städat upp det här träsket på en vecka, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna under högerns styre låtit profitthungriga blodsugare och privatvårdens exploaterande hyenor suga ut folkets välfärdsmiljoner med copy-paste-fusk och falska journaler. Jag skulle ha genomfört en grundlig utrensning av dessa klassfiender redan vid första misstanken. De ler mot folket medan de stjäl från det kollektiva arvet. Avskyvärt."}, "date": "25 augusti, 11:18", "url": "https://www.etc.se/ledare/har-hoegern-moerkat-om-bidragsbrotten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Hoppets demonstration", "summaries": {"normal": "Över 50 000 personer deltog i söndagens stora klimatdemonstration i Stockholm, arrangerad av Naturskyddsföreningen och flera andra organisationer. Artikeln lyfter det folkliga stödet för radikal klimatpolitik, intervjuer från landsbygden som visar oro över förändrat väder och att fackföreningar nu ser klimatfrågan som en central arbetsmiljöfråga. Hopp skapas genom kollektiv handling.", "trump": "Hörni, jag älskar folkmassor och det här var tydligen en jättefolkmassa på 50 000 klimataktivister som vandrade runt med sina barnvagnar och plakat. Fantastiskt! Men de borde demonstrera mot Kinas föroreningar istället för att attackera vår underbara industri. De vill ha radikal politik? Mitt folk röstade på resultat, inte på hysteriska mammor och pappor med hemmagjorda hattar. Patetiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur massorna marscherar mot de dekadenta kapitalisternas klimatförnekelse. Vi har rensat ut tvivlarna tidigare och skall göra det igen. Den folkliga rörelsen är ett vapen mot borgarbrackornas sabotage. Våra fackliga kamrater har rätt – klimatet är en klassfråga. Den som vägrar handla skall likvideras ur historien med ett leende. Hopp är kollektiv handling under partiets ledning."}, "date": "24 augusti, 21:40", "url": "https://www.dagensarena.se/opinion/hoppets-demonstration", "imageUrl": "https://www.dagensarena.se/files/2026/08/demonstration.jpeg"}, {"type": "image-right", "heading": "Ett snällare samhälle är enda vägen", "summaries": {"normal": "Vilgot Österlund reflekterar över det senaste skoldådet på Brinellskolan i Fagersta. Han beskriver samhällets hårda krav som skapar utanförskap, psykisk ohälsa och våldsbejakande miljöer. Lösningen är ett mjukare samhälle med bättre stöd i skola, socialtjänst och arbetsmarknad. Förebyggande insatser är nödvändiga även om de inte alltid räcker.", "trump": "Folk, det är en katastrof! Sverige har blivit ett hårt, galet land där alla misslyckas och hamnar i gäng eller blir galna. De låser skolorna men mördarna kommer ändå in. Ni behöver en stark ledare som fixar det – inte detta mjuka, patetiska skitsamhälle. Make Sweden Great Again, det är vad jag säger!", "stalin": "I detta dekadenta borgerliga samhälle förpassas arbetets söner till utanförskapets mörker där de blir lätta offer för reaktionära impulser. Vi ska inte blunda för klassfiendens sabotage mot folkets enhet. Ett mjukare samhälle? Nej, kamrater – vi behöver en järnhård utrensning av alla som odlar svaghet. Den som sviker kollektivet förtjänar att skrattas ut i historien."}, "date": "24 augusti, 21:23", "url": "https://www.dagensarena.se/opinion/ett-snallare-samhalle-ar-enda-vagen-2", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidavilgot-576x1024.png"}, {"type": "image-right", "heading": "Varför accepteras Jomshofs islamofobi?", "summaries": {"normal": "Artikeln kritiserar att SD:s Richard Jomshof öppet kallar sig islamofob i sin nya bok och att borgerliga partier accepterar detta. Författaren menar att det visar på normalisering av rasism mot muslimer, kontrasterat mot reaktioner på vänsterns uttalanden. Han ifrågasätter SD:s påståenden om islamisering och pekar på suddiga gränser mellan religion och etnicitet.", "trump": "Folk, de här svenska globalisterna är patetiska! Jomshof säger bara sanningen om den islamistiska invasionen som förstör deras fina lilla land, och plötsligt är det rasism? Men när vänsterextremisterna hyllar terrorister är det okej? De har blivit så woke att de inte ens kan skydda sin egen kultur längre. Patetiskt!", "stalin": "Kamrater, dessa klassfiender och folkförtryckare inom borgarklassen har nu öppet omfamnat sin rasistiska parasitism riktad mot arbetande muslimska massor. Jag ser genom deras genomskinliga hyckleri. Vi måste rensa ut dessa exploaterande hyenor som splittrar folket med sin etnonationalistiska gift. Inga fiender undkommer den revolutionära utrensningen."}, "date": "17 augusti, 11:34", "url": "https://www.flamman.se/varfor-accepteras-jomshofs-islamofobi", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/richard-jomshof-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "S röstar ja till ökad anhöriginvandring – trots var 5:e invandrare ALDRIG har jobbat", "summaries": {"normal": "Socialdemokraterna röstade nej till skärpta krav på anhöriginvandring. En ny rapport visar att var femte invandrare som bott i Sverige i 20 år aldrig har arbetat, i utsatta områden var tredje. Rapporten pekar även på stora skillnader i synen på arbete, homosexualitet och könsroller jämfört med svenskfödda. Vänstermedia ifrågasätter undersökningens tillförlitlighet på grund av låg svarsfrekvens.", "trump": "Folk, ni skulle inte tro det! De svenska socialisterna röstar för mer invandring trots att var femte invandrare aldrig jobbat på tjugo år. Det är en total katastrof, en riktig röra. De vill att ni ska betala för allt medan de själva drömmer om tvångsblandning och samlevnadsrum. Patetiskt! Biden skulle älskat det här vansinnet. Vi behöver jobb, inte bidrag till folk som hatar vårt sätt att leva.", "stalin": "Jag ser klassfiendernas hydra i denna rapport. Var tredje parasit i de utsatta zonerna vägrar arbeta och föraktar både produktivt arbete och proletär moral. Ändå röstar socialdemokraterna för att släppa in fler av dessa blodsugande element. Det är en farlig sabotagehandling mot folket. Kamraterna måste rensa ut dessa folkförrädare innan de förgiftar hela sovjet – förlåt, hela nationen med sin dekadens."}, "date": "17 augusti, 03:41", "url": "https://samtiden.nu/2026/08/s-rostar-ja-till-okad-anhoriginvandring-trots-var-5e-invandrare-aldrig-har-jobbat", "imageUrl": "https://samtiden.nu/wp-content/uploads/2016/12/kvinnor-muslimer.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
