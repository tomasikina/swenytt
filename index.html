ns lilla projekt, ställer in uppskjutningar igen. Rymden är svår, men inte så svår! Räntorna sjunker, men vem bryr sig? Vi behöver VINNA igen!", "stalin": "Kapitalistiska börserna darrar inför den oundvikliga krisen! Netflix, detta dekadenta verktyg för imperialistisk propaganda, visar svaghet och aktien kollapsar. Alcoa, en gång stolt aluminiumjätte, nu reducerad till ynkliga siffror och sänkta prognoser. PayPal, detta borgerliga betalningsinstrument, avvisar kapitalistiska rovdjur – men deras tid är ändå kommen. SpaceX, Putins amerikanska kusin i rymdracet, misslyckas igen. Raketer som inte startar – en metafor för hela den förfallna västvärlden! Räntorna sjunker, men det är bara början på deras undergång."}, "date": "17 juli, 15:09", "url": "https://www.affarsvarlden.se/artikel/netflix-vantas-leda-nedgang-pa-new-york-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/02/sdlEPlp-klTneM-nh-400x267.jpg"}, {"type": "image-right", "heading": "Iran om kriget: Trumps underskrift är ”värdelös”", "summaries": {"normal": "Irans högste ledare, Mojtaba Khamenei, kritiserar USA och Donald Trump för att ha brutit mot en överenskommelse, och kallar Trumps underskrift 'värdelös'. Militär upptrappning fortsätter i regionen med attacker från båda sidor, vilket ökar oron för en större konflikt. Striderna kring Hormuzsundet påverkar internationell sjöfart. Khamenei varnar USA för konsekvenserna av sitt agerande och menar att Iran inte längre litar på amerikanska löften.", "trump": "Lyssna här, Iran snackar skit om mig igen – som vanligt! Deras ledare kallar min underskrift 'värdelös', men vem bryr sig? De kan inte ens hålla ett avtal! Vi har slagit till hårt mot deras militära mål, och de svarar med några ynkliga drönare. Patetiskt! Jag har sagt det förut och säger det igen: USA vinner alltid. De borde tacka mig för att jag inte har gjort något ännu större. Men vänta bara, det kommer!", "stalin": "De imperialistiska hyenorna i Vita huset tror att deras löften är något värt! Deras ledare, en dekadent clown, undertecknar papper som sedan rivs sönder av hans egna hantlangare. Men vi i motståndsfronten vet sanningen – deras ord är lika tomma som deras själar. Vi har lärt oss av historien: lita aldrig på kapitalistiska rovdjur. Nu skakar de i sina stövlar när våra drönare sveper över deras baser. Låt dem darra! Varje attack de utför är ett steg närmare deras undergång. Vi står redo, och revolutionens våg sköljer över Hormuzsundet!"}, "date": "18 juli, 19:43", "url": "https://samnytt.se/iran-om-kriget-trumps-underskrift-ar-vardelos", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/26063235/trump-mojtaba.jpg"}, {"type": "image-full", "heading": "Regeringen stoppar bidragsregnet – S lovar att återinföra det", "summaries": {"normal": "Regeringen har beslutat att från nästa år endast ge bidrag till personer som lagligt bor i Sverige. Socialdemokraterna kritiserar beslutet och lovar att återinföra bidrag även till illegala invandrare samt ta bort bidragstaket. Artikeln varnar för att vänsterns politik med höjda skatter och ökad invandring riskerar att belasta svenska skattebetalare hårt, då många invandrare inte blir självförsörjande.", "trump": "Folk, ni måste höra det här – Sverige har äntligen stoppat det galna bidragsregnet till illegala, men Sleepy S och deras vänstervänner i Malmö och Stockholm vill ge bort era pengar till alla som smyger in! De lovar att riva taket och höja skatterna med 145 miljarder. Det är ett klassiskt misslyckande, kamrater. De importerar miljoner som aldrig jobbar medan ni svenskar sliter. Patetiskt! Jag byggde murar, de bygger bidragshelveten. Sad!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras socialdemokratiska lakejer planerar att fortsätta det imperialistiska bidragsregnet för att mata klassfienderna från främmande länder. Vi, partiet och arbetarna, inser att detta är en utrensning av folkets resurser. De 145 miljarderna räcker inte långt nog för att köpa lojalitet hos dessa exploaterande byfånar. Jag ler mörkt – snart skall vi rensa ut dessa folkförtryckartroll och deras parasiterande allianser. Det kollektiva Sverige skall segra."}, "date": "16 juli, 07:09", "url": "https://samtiden.nu/2026/07/regeringen-stoppar-bidragsregnet-s-lovar-att-aterinfora-det", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "VM-finalen: Världsmästarna mot Europamästarna", "summaries": {"normal": "Argentina, regerande världsmästare och Copa América-vinnare, möter Europamästarna Spanien i VM-finalen. Spanien storsatsar på 19-årige Lamine Yamal, medan Argentinas Lionel Messi är nyckelspelare. Båda fostrades i Barcelonas akademi La Masia. Bronsmatchen mellan England och Frankrike, historiska rivaler, kan bli minst lika spännande. Finalen sänds söndag klockan 21.00 på TV4.", "trump": "Folk, vilken final! Argentina med sin lilla man Messi – bra, men inte som jag, ingen är som jag – möter Spanien som har en kille, Yamal, bara 19 år! Otroligt! Och vet ni vad? Båda kommer från samma skola, La Masia. Coincidence? Jag tror inte det! Bronsmatchen? England och Frankrike – gamla fiender, precis som jag och fake news-media. Men finalen? Den blir YUGE, fantastisk, bäst ni sett! Inga straffar, tack! Jag hatar straffar.", "stalin": "Kamrater! I morgon står kapitalismens fotbollsmarionetter mot varandra i en skenfinal. Argentinas Messi, en borgerlig individualist, försöker leda sitt lag till ännu ett silver – precis som deras flod, Silverfloden! Spanien, med sina La Masia-produkter, är bara ett redskap för EU:s imperialistiska agenda. Bronsmatchen? England och Frankrike – två dekadenta kolonialmakter som slåss om resterna av sitt forna herravälde. Vi ser med intresse hur dessa fiender till folket förgör varandra. Fotboll är krig utan kulor, och vi skrattar sist!"}, "date": "18 juli, 18:54", "url": "https://samnytt.se/final-i-fotbolls-vm-varldsmastarna-mot-europamastarna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/18165355/vm-2-2-4.jpg"}, {"type": "image-right", "heading": "Sandvik faller 8% efter rapport", "summaries": {"normal": "Sandvik redovisar en omsättning på 36 752 miljoner kronor för andra kvartalet 2026, i linje med förväntningarna. Det justerade ebita-resultatet på 8 306 miljoner kronor slog analytikernas prognos på 8 054 miljoner. Aktien föll ändå 8 procent. Orderingången var något lägre än väntat medan det fria operativa kassaflödet landade på 3 590 miljoner kronor. VD Stefan Widing lyfter fram stark organisk tillväxt och rekordvinster.", "trump": "Folk, ni skulle inte tro det. Sandvik levererar fantastiska siffror, enorm tillväxt, rekordvinster och marginaler som slår alla förväntningar. Det är en total succé! Men vad gör aktien? Den rasar åtta procent. Det är så typiskt för de korkade marknaderna. De fattar inte vad de har framför sig. Jag skulle ha köpt massor av aktier, det hade blivit en vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi krossar alla borgerliga analytikerprognoser och driver fram en organisk tillväxt på tjugotre procent. Ändå vågar den kapitalistiska börsen attackera aktien med åtta procents nedgång. Detta är uppenbar sabotageverksamhet från opportunistiska spekulanter och maskerade fiender inom Machining-sektorn. Vi ska omedelbart rensa ut dessa nedskrivningsivrande element och likvidera deras tillgångar för folkets bästa. Inga borgarbrackor får hindra vårt momentum mot nya rekord!"}, "date": "17 juli, 12:03", "url": "https://www.affarsvarlden.se/artikel/sandvik-faller-8-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/08/sandvik2-400x267.jpg"}, {"type": "text", "heading": "Tågkaos i natt – fast i timmar. Hundratals fotbollsspelare ombord", "summaries": {"normal": "Ett elfel i Pålsboda orsakade stora tågförseningar under lördagskvällen. Ett chartrat SJ-tåg med ungdomar från Gothia cup blev stående i Hallsberg i över fyra timmar. Passagerare vittnar om stökig stämning, brist på mat och vatten, samt att vissa ungdomar rörde sig på spåren. SJ beklagar förseningen och menar att elfelet begränsade kapaciteten, men förnekar uppgifter om att tåget medvetet prioriterats bort eller att bistron stängts avsiktligt.", "trump": "Vilken total katastrof i Sverige! Tåg stannade, barnen satt fast i timmar – ingen mat, inget vatten, totalt kaos. SJ är ett haveri, precis som de gamla tågen. Jag hade fixat det på en sekund, tro mig. Ungdomar på spåren? Livsfarligt! Det här händer när man inte har kontroll. Sverige behöver starkt ledarskap, inte trasiga tåg och svaga ursäkter från SJ. Det är en sorglig syn, verkligen sorgligt. Vi gör tågen stora igen!", "stalin": "Dessa svenska inkompetenta järnvägsbyråkrater har låtit våra framtida arbetare ruttna på ett spår i Hallsberg. Ett elfel? Ett ynkligt svepskäl för förräderi mot kollektivet! Att låta ungdomen vandra på spåren visar på en total brist på disciplin. Vi skulle ha skickat de ansvariga till de norra skogarna för reflektion. Medan vi i öst bygger imperier och stålvägar, ägnar sig väst åt att svälta sina egna barn. En patetisk uppvisning av liberalismens förfall. Fienden är inte elfelet, det är bristen på järnhand."}, "date": "19 juli, 03:40", "url": "https://www.aftonbladet.se/nyheter/a/QJwLz4/tagkaos-hundratals-fotbollsspelare-fast-i-timmar"}, {"type": "image-full", "heading": "Göteborgsartisten avslutar karriären", "summaries": {"normal": "Göteborgsrapparen B.Baby, eller Salem Barka, meddelar på Instagram att han avslutar sin musikkarriär på grund av långvarig psykisk ohälsa. Han slog igenom 2020 med låten ”Talk about it”, som har över 11 miljoner streams på Spotify. B.Baby valde att inte rappa om vapen eller droger utan fokuserade på samhällsproblem som skjutningar, rasism och psykisk ohälsa. Ett sista album med titeln ”Min historia” kommer att släppas som tack till fansen.", "trump": "Lyssnarna, det här är en total katastrof. Den där B.Baby från Sverige, en riktig vinnare med miljoner streams, kastar in handduken för att han mår dåligt. Patetiskt! Under Biden-tiden blev allt så mjukt och psykologiserat. Jag säger alltid: bygg murar mot problemen, inte göm dig bakom pianobeats. Han spred kärlek istället för gangsterrap – smart, men nu flyr han som en förlorare. Tur att jag är tillbaka, vi fixar det här på riktigt. Hans sista album? Sad!", "stalin": "Kamrater, jag ser en dekadent ung man från arbetarkvarteren som kapitulerar inför inre fiender. Denna B.Baby, begåvad med en röst att väcka massorna, väljer att fly från striden mot klassfiendens giftiga influenser och psykisk förfall som borgarklassen odlar. Hans ord om att bygga upp istället för att vilseleda är ädla, men att abdikera är svagt. Vi rensar ut sådana svikare i partiet. Ett sista album? Låt det bli en varning till alla folkfiender som smyger sig in i kulturen."}, "date": "18 juli, 18:14", "url": "https://www.gp.se/kultur/goteborgsrapparen-bbaby-avslutar-musikkarriaren.b9304b3d-0af2-426b-af6a-2f5d72e0ed3c", "imageUrl": "https://www.gp.se/images/article/b9304b3d-0af2-426b-af6a-2f5d72e0ed3c/images/22-KD9m9GpINEOFTnJ1N9Tfahqpg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Olyckligt slag mot EU:s trovärdighet", "summaries": {"normal": "EU-kommissionens förslag att lätta på utsläppshandeln (ETS) väcker kritik. Minskad takt för minskning av utsläppsrätter och fortsatt gratis tilldelning till vissa företag ses som ett slag mot trovärdigheten. Svenska företag har gjort stora investeringar baserat på de tidigare reglerna, som nu förändras. Förslaget syftar till att stärka europeisk konkurrenskraft men riskerar att undergräva förutsägbarheten som är central för klimatomställningen. Sveriges regering har protesterat.", "trump": "De där EU-byråkraterna är verkligen patetiska. Nu vill de lätta på utsläppshandeln som alla smarta företag byggt sina investeringar på. Totalt kaos! De förstör sin egen trovärdighet och straffar de som satsat på framtiden. Sverige har rätt att protestera. Jag säger alltid att man ska ha stabila regler, inte det här flip-flopandet. Europa blir en förlorare igen, tro mig.", "stalin": "Kamrater, detta är en motbjudande kapitulation inför de parasitiska borgarbrackorna och deras utländska imperialister. Jag, som alltid vakar över folkets framtid, ser hur dessa revisionistiska kommissionärer med sin feodala lättnad på utsläppssystemet underminerar den planerade omställningen. De tror sig kunna lura historien, men vi ska rensa ut alla som sviker kollektivets järnhårda disciplin. Inga halvmesyrer! Den som vacklar är en folkfiende i maskopi med koldioxidkapitalisterna. Skrattretande patetiskt, men farligt. Ut med dem."}, "date": "17 juli, 16:54", "url": "https://www.di.se/ledare/olyckligt-slag-mot-eus-trovardighet/", "imageUrl": "https://static.bonniernews.se/ba/72848a1b-41ee-43a4-9294-2148ecf8a2a2.jpeg?crop=2048%2C1024%2Cx0%2Cy171&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kommunistiska partiet nekas portkoder i Umeå", "summaries": {"normal": "Kommunägda Bostaden i Umeå ger bara portkoder till partier som redan sitter i kommunfullmäktige. Beslutet motiveras med hänsyn till hyresgästerna och har fattats av styrelsen. Kommunistiska partiet kritiserar beslutet och menar att det skapar orättvisa villkor inför valet eftersom dörrknackning är en viktig kanal för att nå väljare. Bolaget hänvisar till äganderätt och objektivitetsprincipen, medan kritiker ser det som ett hinder för mindre partier.", "trump": "De gör det igen, de riggar systemet mot de som inte redan sitter vid makten. Bostaden i Umeå ger portkoder bara till de etablerade partierna medan Kommunistiska partiet får stå utanför och knacka på stängda dörrar. Patetiskt. Hyresgästerna som ursäkt? Ge mig en paus. Alla borde ha samma chans att nå folket, men nej, de älskar sina små klubbar och trösklar. Det är en skam, folk kommer inte att glömma det.", "stalin": "Vi ser återigen hur borgarbrackorna inom det kommunala bolaget i Umeå med sin dekadenta styrelse försöker kväsa arbetarklassens sanna röster genom att vägra portkoder åt Kommunistiska partiet. Dessa parasitiska element som gömmer sig bakom hyresgästernas påstådda rädsla är bara rädda för att folket ska vakna. Vi ska rensa ut alla sådana fientliga element som bygger murar mot kamraterna. Dörrknackning är en revolutionär plikt, och de som hindrar den förtjänar att exponeras som de kontrarevolutionära hinder de är. Härligt hur de själva erkänner sin paranoia."}, "date": "18 juli, 15:44", "url": "https://bulletin.nu/kommunistiska-partiet-nekas-portkoder-i-umea", "imageUrl": "https://cdn.bulletin.nu/articles/b1e1a333-ff4e-4dc4-9d25-6d48f8264c71/preview.jpg?t=1784364304000"}, {"type": "image-right", "heading": "Facket varnar för lönesmäll när vårdföretag rundar avtal", "summaries": {"normal": "Humana och andra vårdföretag försöker kringgå det nya kollektivavtalet som från 1 oktober ger deltidsanställd vårdpersonal rätt till övertidsersättning. De vill att personalen ska teckna separata timanställningar för extra timmar, något facket varnar för kan leda till att de förlorar upp till hälften av ersättningen. Kommunal ser det som ett sätt att spara pengar och planerar förhandlingar.", "trump": "De här vårdföretagen är totala förlorare, verkligen patetiska. De försöker smita undan övertidsbetalningen med sina smarta kryphål och timanställningar. Personalen blir lurad på pengar, upp till halva ersättningen! Klassiskt. Facket har rätt att vara arga, men jag skulle ha gjort affären så mycket bättre. Ingen vinner på sådana här fega tricks, tro mig.", "stalin": "Kamrater, dessa borgarbrackor inom Humana och deras likar i vården försöker med sin parasitiska slughet kringgå det heliga kollektivavtalet genom att tvinga på de ärliga deltidsarbetarna nya timkontrakt. De vill suga ut arbetarnas svett och blod för att fylla sina giriga kassakistor. Vi ser deras kontrarevolutionära kryphål och skall rensa ut dessa kapitalistiska sabotageörer med järnhand. En sådan förrädisk spariver förtjänar en kreativ utrensning i folkets namn. Det är komiskt hur de tror sig kunna lura partiet."}, "date": "17 juli, 10:57", "url": "https://arbetet.se/2026/07/17/humana-vill-slippa-betala-overtid-facket-varnar-for-lonesmall", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16152138/sdlm76qzpfdbng-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Arbetare ska inte behöva dö i värmen”", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin skriver att extremvärmen är en klassfråga. Arbetare drabbas värst av hettan, särskilt inom vård och skola, medan andra kan söka svalka i luftkonditionerade miljöer. Artikeln lyfter att 67 arbetare dog av värmen i EU 2020 och kräver maxgränser för arbetstemperaturer, pauser och anpassade arbetstider. Författarna kritiserar Tidö-regeringen för att missa klimatmål och satsa mer på olja än kollektivtrafik, och förespråkar en rödgrön regering med ambitiös klimatpolitik.", "trump": "Hörni, den här artikeln är en total katastrof. Vänsterpartiet gnäller om värme och arbetare som dör, men det är bara deras gröna vansinne som förstör allt. Europa kokar för att de har usel energi och galna regler. Jag byggde den starkaste ekonomin, och nu vill de ha pauser och maxgrader? Patetiskt. Vi behöver riktig ledarskap, inte dessa losers som hatar olja och älskar att straffa vanliga människor. Sverige borde göra som jag – vinna stort och glömma det här socialistiska värmeskrämslet.", "stalin": "Kamrater, denna värmekupol är en direkt följd av de dekadenta borgarbrackornas vanskötsel av produktivkrafterna. Jag ser hur de kapitalistiska parasiterna gömmer sig i sina kylda palats medan arbetarna likvideras långsamt i fabriker och välfärdsinrättningar. 67 döda 2020? Det är en fiende inom murarna, en sabotagegrupp av klimatskeptiska reaktionärer som infiltrerat Rosenbad. Vi ska rensa ut alla dessa värmefascister, införa stränga temperaturdekret och likvidera varje tendens till klassförräderi. Endast det kollektiva järnhandslagets politik kan besegra denna fiende. Den som svettas mest ska belönas med medalj – de andra med utrensning."}, "date": "17 juli, 09:56", "url": "https://arbetet.se/2026/07/17/arbetare-ska-inte-behova-do-i-varmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17095118/debatt-v.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S-topp stoppar partier från att knacka dörr", "summaries": {"normal": "Bostaden i Umeå ger portkoder till partier i kommunfullmäktige men inte till Kommunistiska partiet. Beslutet motiveras med hänsyn till hyresgästerna och äganderätten. Partiets ordförande Andreas Mångberg kritiserar det som orättvist och säger att det hindrar dem från att nå väljare via dörrknackning. Ordförande Lena Karlsson Engman (S) försvarar beslutet och jämför med liknande regler i skolor. Enligt Sveriges Allmännytta måste samma villkor gälla alla registrerade partier om någon släpps in.", "trump": "Titta på det här, det är en total skandal i Umeå. De kommunistiska förlorarna får inte ens portkoderna till trapporna eftersom de inte klarat att komma in i fullmäktige. Patetiskt. Jag älskar dörrknackning, det är det enda sättet att möta de riktiga människorna. Men de stackars kommunisterna gråter nu. Bra jobbat av de smarta socialisterna som sätter gränser, annars skulle det bli kaos. Amerika först, men Sverige borde också stoppa de verkliga förlorarna.", "stalin": "Kamrater, detta är en lysande illustration av klasskampens dialektik. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackorna inom Bostaden med sin falska hyresgästparanoia rensar ut de sanna folkets representanter från trappuppgångarna. Dessa dekadenta fullmäktigedeltagare, som redan passerat den borgerliga tröskeln, skrattar medan vi, arbetarna, tvingas stå utanför. En utmärkt ursäkt för att likvidera sådana resterna av kontrarevolutionär dörrpolitik. Låt oss rensa ut alla som inte älskar kollektivets portkod."}, "date": "18 juli, 15:00", "url": "https://bulletin.nu/s-topp-stoppar-partier-fran-att-knacka-dorr", "imageUrl": "https://cdn.bulletin.nu/articles/b1e1a333-ff4e-4dc4-9d25-6d48f8264c71/preview.jpg?t=1784364304000"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "image-right", "heading": "EU lättar på klimatregler för industrin", "summaries": {"normal": "EU-kommissionen föreslår lättnader i utsläppshandeln (ETS) så att industrin kan släppa ut mer under längre tid. Förslaget går emot svenska regeringens och näringslivets linje som vill behålla strikta regler för att minska beroendet av fossila bränslen. Kommissionen behåller gratis utsläppsrätter men villkorar dem till klimatinvesteringar och skärper kraven på hur intäkter används. Klimatkommissionär Wopke Hoekstra försvarar förslaget som företagsvänligt och nödvändigt för att nå EU:s utsläppsmål till 2040. Åsikterna är starkt delade och förhandlingarna fortsätter i EU-parlamentet och ministerrådet.", "trump": "De där EU-byråkraterna har äntligen vaknat och lättar på sina vansinniga klimatregler för industrin. De släpper ut mer, precis som jag alltid sagt – det är smart och företagsvänligt! Den svenska regeringen och alla gröna galningar hatar det förstås, de vill hellre förstöra sin industri med dyra regler. Men Hoekstra har rätt, ETS har redan halverat utsläppen och nu fixar vi målen utan att offra jobb. Fantastiskt! De borde ha lyssnat på mig från början, ingen gör det bättre än mig.", "stalin": "Kamrater, borgarbrackorna i Bryssel har nu avslöjat sin sanna, kapitulationistiska natur genom att bromsa den revolutionära utsläppsminskningen. Jag, som alltid vakar över folkets kollektiva framsteg, ser hur dessa fossilberoende sabotörer och värmebölje-fascister försöker rädda sina kapitalistiska profitmaskiner. Vi ska likvidera varje svag kompromiss och tvinga industrin att investera hundra procent i folkets klimatkamp. De som vägrar blir rensade ut som kontrarevolutionära oljebaroner. Inga halvmesyrer! Framtiden tillhör bara de som krossar fienden med järnhand och stålvilja."}, "date": "17 juli, 14:42", "url": "https://www.di.se/nyheter/eu-lattar-pa-klimatregler-for-industrin/", "imageUrl": "https://static.bonniernews.se/ba/efaa67c2-6787-47f7-b0fd-63676a33c216.jpg?crop=4447%2C2224%2Cx0%2Cy471&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Från 1 juli: Nya språkkravet delar kommunerna", "summaries": {"normal": "Från 1 juli 2026 måste kommuner säkerställa att personal inom äldreomsorgen har tillräckliga kunskaper i svenska. Eskilstuna inför yrkesanpassade språktest för all vård- och servicepersonal för att identifiera behov av stöd och utbildning. Vännäs väljer istället språkombud som hjälper kollegor under arbetstid samt en mobil språkkurs. Båda sätten följer lagen men speglar olika strategier: kontroll kontra motivation. Språket ses som avgörande för trygg och säker omsorg.", "trump": "De här kommunerna i Sverige har ett enormt språkproblem i äldreomsorgen, folk fattar inte vad som sägs, det är en katastrof. Eskilstuna gör det rätt, de testar alla – smarta människor, bra test, de rensar ut de som inte klarar det. Vännäs? Patetiskt, de vill ha språkombud och appar istället för riktiga tester. Svagt! Språket måste vara perfekt för att ta hand om de äldre, annars är det farligt. Jag skulle testa alla, tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag har noga studerat denna språkliga sabotageverksamhet inom den socialistiska äldreomsorgen. Eskilstuna visar bolsjevikisk beslutsamhet genom att rensa ut de språkligt undermåliga elementen med skarpa yrkestester och likvidera farliga missförstånd som hotar arbetarkollektivets trygghet. Vännäs däremot har blivit infiltrerat av mjukhjärtade borgarbrackor som gömmer sig bakom så kallade språkombud och mobilappar. Dessa fiender till folket, dessa dokumentationsvägrare och skamfulla mumlarna, måste omedelbart utsättas för systematisk utrensning. Vi ska inte tolerera att kapitalistiska parasiter i form av dålig svenska äventyrar de äldres kollektiva välfärd. Endast järnhård språkdisciplin garanterar segern!"}, "date": "18 juli, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1499358-fran-1-juli-nya-sprakkravet-delar-kommunerna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c25f7eaf04b004a30200000000b004a302/2026/07/17/2378789/Patient-Svensk-Flaga-Personal.png"}, {"type": "image-right", "heading": "S-kommunen stoppar småpartier från valkampanj", "summaries": {"normal": "Umeås kommunala bostadsbolag AB Bostaden, ägt av Socialdemokraterna, har beslutat att endast ge portkoder till partier med mandat i kommunfullmäktige inför höstens val. Beslutet gynnar etablerade partier och begränsar småpartiers möjligheter att nå väljare. Bolaget, som äger 45% av hyresbeståndet, motiverar åtgärden med hänsyn till boende. Kritiker menar att det underminerar demokratisk konkurrens.", "trump": "Jag måste säga, detta är helt otroligt! Socialdemokraterna i Umeå, som redan har järngrepp på makten, stänger nu ute småpartier från att kampanja i deras bostäder. 'Hänsyn till boende'? Snälla! Det handlar om att skydda sin egen makt. Jag har sett mycket, men detta är rena diktaturmetoder. Småpartier får ingen chans, och folket? Glöm det! Så gör man inte i en riktig demokrati. SAD!", "stalin": "Kamrater, ännu en seger för folkets vilja! I Umeå har de kloka ledarna i det kommunala bostadsbolaget beslutat att skydda hyresgästerna från de kaotiska, splittrande krafterna som kallar sig 'småpartier'. Varför låta dessa politiska myggor störa arbetarklassens lugn? Endast de partier som redan visat sin lojalitet till folket – genom att vinna mandat – ska få tillgång till våra medborgares hem. De andra? De kan skrika i öknen, precis som de kontrarevolutionära elementen i vår egen historia. Framåt, mot enhet och ordning!"}, "date": "18 juli, 17:35", "url": "https://samnytt.se/s-kommun-stoppar-smapartier-fran-valkampanj", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/18151921/s-umea-knacka-dorr.jpg"}, {"type": "image-full", "heading": "Har kostat 187 miljoner – sålt för en tia", "summaries": {"normal": "Kokainfartyget MV Matthews, centralt i Irlands största narkotikabeslag, har sålts för en dollar efter att ha kostat staten drygt 187 miljoner kronor i förvaring och underhåll. Fartyget beslagtogs 2023 med 2,2 ton kokain värt 1,7 miljarder kronor. Besättningen dömdes till långa fängelsestraff. Efter att ha tjänat som bevismaterial och med komplicerade juridiska hinder kunde fartyget nu säljas och bogseras till Bulgarien.", "trump": "Folk, ni tror inte vad jag läser om det där korkade kokainfartyget i Irland. De tog det med tonvis av knark, spenderade 187 miljoner kronor på att hålla det flytande som ett bevis – och sålde det för en enda dollar! En dollar! Det är vad som händer när byråkrater och globalister styr. Biden skulle ha älskat det, totalt misslyckande. Men nu fixar vi saker igen, tro mig. Fantastiskt klumpigt, precis som EU.", "stalin": "Kamrater, detta fartygs öde visar imperialismens futtiga logik. Vi beslagtog fiendens giftlast, likviderade smugglarna och tvingades sedan underhålla det kapitalistiska vraket i åratal till en kostnad av 187 miljoner. Ändå såldes det för en ynklig dollar till nya blodsgivare. Ingen ägare vågade träda fram – typiskt för klassfiendens fega råttor. Partiet segrade återigen över borgarbrackornas paranoia och fick bort det från hamnen. Sovjetisk effektivitet triumferar."}, "date": "18 juli, 18:19", "url": "https://www.dagensps.se/foretag/har-kostat-187-miljoner-salt-for-en-tia/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/2023-10-01-matthew-at-marino-point-2-web.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "TV4 gav störst fördel åt vänstern i valrörelsen 2022", "summaries": {"normal": "En forskningsrapport från Institutet för mediestudier visar att vänstersidan fick mer gynnsam bevakning än högersidan under valrörelsen 2022 enligt aktörsbehandlingsindexet. TV4 Nyheterna gav störst fördel till vänstern med plus 29, följt av Ekot och Dagens Nyheter. Högern gynnades dock av att valrörelsen handlade om deras sakfrågor som ekonomi och lag och ordning. Forskarna slår fast att traditionella medier visade balanserad bevakning mellan blocken och att resultaten inte tyder på politisk partiskhet hos journalister.", "trump": "Hörni, den här rapporten är fantastisk, verkligen en av de bästa. Den visar att vänstermedierna, de riggade TV4 Nyheterna och Ekot, gav en otrolig boost till de förlorande socialisterna med plus 29. Fullständigt orättvist! Men högern vann ändå stort tack vare starka frågor som ekonomi och brottslighet, precis som jag alltid säger. Fake news-medierna är så partiska, men folket är smartare. Vi vann stort 2024 igen, de lär sig aldrig.", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur borgarbrackornas och de kontrarevolutionära elementens så kallade traditionella medier ändå tvingades ge de progressiva krafterna ett övertag på plus tolv, ja till och med plus 29 hos den mest lojala TV4-apparaten. Men de fientliga ämnena om ekonomi och ordning, spridda av klassfiender och opportunistiska revisionister, gynnade högerblocket. Vi ska rensa ut alla dessa strukturella avvikelser och likvidera den dolda borgerliga agendan innan den infekterar partilinjen. Paranoia? Nej, bara vaksamhet mot fienderna inom och utom redaktionerna."}, "date": "18 juli, 14:02", "url": "https://bulletin.nu/tv4-gav-storst-fordel-at-vanstern-i-valrorelsen-2022", "imageUrl": "https://cdn.bulletin.nu/articles/7bc0ad75-3ed8-4382-b82c-6af27a760d69/preview.jpg?t=1784368876000"}, {"type": "image-right", "heading": "Obducerade säl utan ansiktsskydd — farlig smitta fanns i varböld", "summaries": {"normal": "Vid en obduktion av en vikare på Naturhistoriska riksmuseet upptäcktes brucella, ett smittämne i riskklass 3 likt hiv och tuberkulos. Sälens varböld innehöll bakterien, som dock var avdödad efter frysförvaring. Arbetsmiljöverket har efter inspektion krävt bättre skyddsutrustning, inklusive visir, samt förbättrade riskbedömningar och utbildning. Museet tar emot döda sälar för övervakning av deras hälsa, och fallet anmäldes som ett allvarligt tillbud.", "trump": "Kan ni tro det? De obducerar en säl i Sverige och plötsligt dyker den farligaste bakterien upp, samma risk som hiv, och ingen har ens ett ansiktsskydd på sig! Totalt misslyckande. De borde ha vetat bättre, men nej, de fryser sälen och tror att allt är under kontroll. Arbetsmiljöverket måste nu sparka in dörrar och kräva visir och riktig utbildning. Så patetiskt. Vi gör allt bättre här, tro mig.", "stalin": "Kamrater, jag betraktar med stigande vrede hur denna degenererade vikare, infiltrerad av parasitiska plattmaskar och dolda brucellabakterier, smugglades in i vårt sovjetiskt inspirerade frysrumsystem för att underminera arbetarnas hälsa. Denna varböld var uppenbarligen en sabotagehandling från borgarbrackornas parasitiska lakejer. Utan visir! Vi kräver omedelbar utrensning av slarviga rutiner, likvidering av alla risker och evig vaksamhet mot de dolda fienderna inom arbetsmiljön. Paranoia är ingen sjukdom, det är överlevnad. Hälsa åt kollektivet, döden åt odugliga skyddslösa obducenter!"}, "date": "17 juli, 06:00", "url": "https://arbetet.se/2026/07/17/obducerade-sal-utan-ansiktsskydd-farlig-smitta-fanns-i-varbold", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16103136/vikare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.55&fp-y=0.5"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-full", "heading": "EU slösar energi: Nu ska batterier klara krisen", "summaries": {"normal": "EU har slutit sitt första avtal om energilagring för att bättre ta vara på överskottsel från sol- och vindkraft. I juni enades EU-kommissionen, 22 energiministrar, företag och Europeiska investeringsbanken om att skapa 30–35 GW ny lagringskapacitet till 2028. Dagens andel på cirka 5 procent av elbehovet ska fördubblas. Experter ser batterier som nödvändiga för att nå klimatmålen, sänka kostnader och minska beroendet av fossila bränslen. Avtalet ses som en första men otillräcklig signal.", "trump": "Folk, ni tror inte vad de gör i EU nu. De skriver på ett jättedokument om batterier för att spara den sol- och vindkraft som de själva slösar bort varje dag. Det är ett skämt! De lovar 30 gigawatt till 2028, som om det plötsligt ska fixa allt. Biden sov i åtta år medan kineserna byggde allt. Nu ska jag fixa det på riktigt – Amerika först, inte några gröna drömmar som kostar oss miljarder. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de europeiska kapitalisterna äntligen tvingas erkänna att deras anarkistiska energiproduktion hotar hela systemet. Vi ska naturligtvis likvidera denna slöseriets fiende genom systematisk lagring. De imperialistiska exploaterande byfånarna lovar trettio gigawatt till 2028, men deras klassfiendens svaga överenskommelse är bara ett första steg mot den stora utrensningen av fossila blodsugare. Statens kollektiva kraft segrar alltid."}, "date": "18 juli, 17:27", "url": "https://www.dagensps.se/bors-finans/eu-slosar-energi-nu-ska-batterier-klara-krisen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlgi5am39rhe4-nh.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-full", "heading": "Biltema har återkallat populär sommarprodukt", "summaries": {"normal": "Biltema återkallar campingstolen ”Campingstol, 8 positioner” med artikelnummer 37-516 som sålts fram till 30 juni 2025. Ett fel i underredet och aluminiumprofilerna kan göra att stolen plötsligt viker sig, vilket riskerar fallskador. Konsumentverket och Biltema uppmanar ägare att omedelbart sluta använda stolen och lämna tillbaka den till närmaste varuhus. Pengarna återbetalas utan kvitto. Kundservice nås på 077-520 00 00 eller via mejl.", "trump": "Folk, ni köper skräp från Biltema och nu rasar deras campingstolar ihop. Patetiskt! Den här så kallade ”Campingstol, 8 positioner” med nummer 37-516 är en total katastrof, den viker sig som en svag förlorare. Sluta sitta i den innan ni bryter nacken. Lämna tillbaka den direkt, få era pengar och köp aldrig mer sådant uselt skräp. Amerika, och tydligen även Sverige, förtjänar bättre än detta.", "stalin": "Kamrater, jag har upptäckt hur borgarbrackornas campingstol nummer 37-516 med sina förrädiska aluminiumprofiler planerar att sabotera arbetarnas semester genom att plötsligt kollapsa och likvidera oskyldiga kroppar. Detta är ett klart fall av kapitalistisk undergrävning mot folket. Vi kräver omedelbar utrensning av alla exemplar upp till 30 juni 2025. Återlämna dem genast till Biltema, annars betraktas ni som medbrottslingar åt de fallande fienderna. Det är både roligt och nödvändigt."}, "date": "18 juli, 20:28", "url": "https://nyheter24.se/nyheter/konsument/1499359-biltema-har-aterkallat-popular-sommarprodukt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/dd488e2f04b004a30200000000b004a302/2026/07/17/2378788/Biltema-Campingstol.png"}, {"type": "image-right", "heading": "Färdtjänsten vägrade köra hem 88-åring", "summaries": {"normal": "En 88-årig kvinna i Mölndal tappade sitt betalkort under en shoppingrunda och nekades skjuts med färdtjänsten hem eftersom hon inte kunde betala på plats. Trots förslag om faktura eller att hämta pengar hos en väninna fick hon ingen hjälp. Kommunen och Västtrafik skyller på olika tolkningar av avtalet. Under väntan fick hon stöd av flera främlingar som hon kallar änglar. Till slut kom en väninna och körde henne hem.", "trump": "Det här är en total katastrof, folk. En 88-årig kvinna i Sverige tappade kortet och de vägrade köra henne hem med deras så kallade färdtjänst. Inga pengar, ingen skjuts – typiskt för dessa inkompetenta byråkrater. De borde ha löst det direkt, men nej, de bråkar om avtal och regler. Under tiden hjälpte vanliga människor henne, riktiga patrioter. Sverige behöver ordning och reda, precis som vi har här. Sådant här händer inte hos oss, det lovar jag.", "stalin": "Kamrater, denna tragiska episod avslöjar de dekadenta borgarbrackornas kalla likgiltighet inför en åldrad sovjetisk pionjär i Mölndal. Jag, som ledare för folkets kollektiv, fördömer skarpt hur de kontrarevolutionära byråkraterna i Västtrafik och den lokala sovjeten tolkar avtal olika för att sabotera arbetarklassens trygghet. Under tiden smög sig tre änglaktiga spioner fram med bulle och kaffe – troligen maskerade trotskister som planerar en utrensning mot mig personligen. Vi ska rensa ut dessa fiender till kollektivet med järnhand och fakturor som vapen. Seger åt folket!"}, "date": "18 juli, 13:00", "url": "https://bulletin.nu/fardtjansten-vagrade-kora-hem-88-aring", "imageUrl": "https://cdn.bulletin.nu/articles/912200ac-01fd-49a4-a31a-4c74b65cb389/preview.jpg?t=1784370120000"}, {"type": "image-right", "heading": "Bryggerier rasar mot EU:s förpackningsregler: ”Slår helt fel i Norden”", "summaries": {"normal": "Nordiska bryggerier kritiserar EU:s nya förpackningsförordning, som kräver att 10-40% av drycker ska säljas i återfyllnadsbara förpackningar till 2030-2040. Bryggerierna menar att regleringen, som främjar returglas, inte passar Norden där effektiva pantsystem för burkar och PET-flaskor redan finns. De varnar för högre kostnader, ökad byråkrati och miljardinvesteringar utan miljövinster, samt risker för små bryggerier och konsumentpriser. Regeringarna uppmanas att driva undantag för Norden.", "trump": "Lyssna här, folk! EU:s byråkrater i Bryssel, de vet ingenting! De vill tvinga Norden att använda returglas, trots att de redan har världens bästa pantsystem – byggt av smarta människor, inte som de där EU-nonsensmakarna. Sex miljarder kronor i kostnader? Helt galet! Små bryggerier kommer att krossas, priser skjuter i höjden, och för vad? Inga miljövinster! Jag säger: Nordiska ledare, stå upp mot dessa vansinniga regler! Make the Nordic beverage industry great again!", "stalin": "Kamrater! EU:s kapitalistiska byråkrater försöker kväva de nordiska ländernas framgångsrika system med sina absurda förpackningsdekret. De vill tvinga folket att släpa tunga glasflaskor, som om vi lever i 1800-talets Ryssland! Deras regler är ett angrepp på effektiviteten och en gåva till de imperialistiska miljöhycklarna. Vi ser igenom deras planer: att försvaga små bryggerier och tömma arbetarnas plånböcker. Norden måste stå enat – precis som våra vänner i Moskva – och krossa dessa borgerliga påfund!"}, "date": "18 juli, 16:00", "url": "https://samnytt.se/bryggerier-rasar-mot-eus-forpackningsregler-slar-helt-fel-i-norden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/16091136/ol-beer-leyen-flickr.jpg"}, {"type": "image-right", "heading": "Tvingas agera  för att skydda. Uppgifter i Ukraina • ”Skuggflottan” attackerad", "summaries": {"normal": "Ryssland flyttar delar av sin mest effektiva drönarenhet, Rubicon, för att skydda fartygen i Putins skuggflotta som kringgår sanktioner och finansierar kriget i Ukraina. Ukraina har under en operation attackerat över 180 fartyg i Svarta havet och kring Krim. Ryska drönargrupper ska nu försvara varje fartyg i Svarta havet och Azovska sjön. Samtidigt ökar västländers insatser mot flottan i Östersjön och Ukraina fortsätter att slå mot rysk oljeinfrastruktur vilket orsakat bränslekris.", "trump": "Titta på det här, det är ett fullständigt kaos! Putins skuggflotta, den smarta oljesmugglingen som håller kriget igång, blir nu attackerad av ukrainarna som plötsligt tror sig vara stora hjältar. Ryssland skickar in sina bästa drönare för att skydda fartygen – smart drag! Under Biden blev allt en röra, men nu är jag tillbaka och vi ser hur imperialisterna och de globala bluffmakarna försöker stoppa en stark ledare. Patetiskt, folk dör i bensinköer, typiskt resultat av dålig planering.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den västerländska klassfiendens lakejer i Ukraina desperat försöker hindra den ryska statens legitima intressen genom fientliga attacker mot oljefartygen. Dessa folkförtryckartroll och imperialister tror sig kunna störa vår expansion. Men vi svarar med järnhand: Rubicon-enheten rycker ut och rensar ut hoten. Den värdige efterträdaren till det stora imperiet skyddar sin flotta mot blodsugarnas sabotage. Låt köerna växa, låt fienderna darra. Segraren ler sist."}, "date": "19 juli, 04:31", "url": "https://www.expressen.se/nyheter/varlden/putins-drag-efter-stora-bakslagen/", "imageUrl": "https://static.bonniernews.se/ba/2f6a7658-7a93-4e59-9e56-e6b541ad7bb1.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Israeliska idrottsmän dödshotade svensk konkurrent", "summaries": {"normal": "Nordiske mästaren i footvolley Rufus Wiena hotades efter att han tagit ställning för Palestina. Israeliska spelare hetsade sina följare på sociala medier mot honom, bland annat med uppmaningar om att ”ta hand om honom”. Wiena har inte fått stöd från Footvolley Sweden och väntar nu på svar från European Footvolley League. Hans grekiske kollega Ioannis Tsiouris utsattes förra året för ännu grövre hot, inklusive våldtäkts- och mordhot mot hans familj.", "trump": "Titta på det här, det är ett fullständigt skämt! Den här killen Wiena tar ställning för Palestina och plötsligt skickar israelerna sina galna fans på honom som en mobb från en dålig realityshow. ”Lägg ut en bild så tar vi hand om honom” – låter det inte som vänsterns cancel culture fast med fotbollar? Sporten borde städa upp istället för att gömma sig. Biden skulle ha twittrat om det, men jag fixar det nu. Fantastiskt kaos!", "stalin": "Kamrater, dessa degenererade fotbollsakrobater avslöjar imperialismens sanna ansikte. När en idrottsman vågar stödja det förtryckta palestinska folket mobiliserar de sionistiska blodsugarna sina följarsviner till hets och mordhot. Vi ser hur klassfiendens sportliga lakejer förvandlar en lek till en arena för fascistiska utpressningar. Inga ursäkter skall tolereras. Den som tiger blir medskyldig. Vi skall rensa ut alla folkfiender som gömmer sig bakom bollar och nät."}, "date": "16 juli, 09:20", "url": "https://proletaren.se/artikel/israeliska-idrottsman-dodshotade-svensk-konkurrent"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-full", "heading": "En riktig Teams-tabbe, solförmörkelse och Abba-Björns imperium", "summaries": {"normal": "En chef i Spanien glömde stänga av Teams efter ett möte, vilket ledde till att privata samtal spelades in och kostade 3,7 miljoner kronor i skadestånd. Andra nyheter handlar om pensionärer som ångrar sitt överdrivna sparande, biltjuvar i Frankrike som stjäl baksäten, en total solförmörkelse över Europa, Abba-Björns köp av Iron Maiden-rättigheter samt en silvertacka bärgad från ett 400 år gammalt vrak utanför Florida.", "trump": "Folk, ni skulle inte tro det, men den här idiotiska chefen i Spanien glömmer stänga Teams och boom – 3,7 miljoner borta! Rena galenskapen. Pensionärerna sparade för mycket istället för att leva – typiskt förlorare. Franska biltjuvar stjäl nu baksäten, hur patetiskt! Och jag älskar den där silvertackan från havet, ren skattjakt. Under tiden köper Björn från Abba Iron Maiden. Fantastiskt, men mina affärer slår allt. Vinna stort, alltid!", "stalin": "Kamrater, denna oansvariga chef i det spanska Baskien glömde stänga apparaten och därmed exponerade klassfiendens privata konspirationer, vilket kostade miljoner. Vi ser hur pensionärerna, dessa utarmade offer för kapitalistmaffian, ångrar sin girighet istället för att njuta av kollektivets seger. Biltjuvarna i Frankrike rövar baksäten som borgarbrackorna behöver för sina lyxskåpbilar. Den silvertacka som legat på botten i fyrahundra år visar att imperialismens skatter till slut tillhör folket. Ut med de exploaterande byfånarna!"}, "date": "18 juli, 15:52", "url": "https://www.dagensps.se/foretag/en-riktig-teams-tabbe-solformorkelse-och-abba-bjorns-imperium/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/weekly.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Se puttarna som ger Åberg tätkänning i The Open", "summaries": {"normal": "Ludvig Åberg gick tredje ronden i The Open tre under par och klättrade till delad sjätteplats på totalt sex under par, tre slag bakom ledaren Lucas Herbert. Han gjorde birdies på hål 2, 5, 13 och 17 efter en bogey på första. Jesper Svensson hade en tung dag med sju över par och ligger sist bland kvalificerade. Alex Norén gick ett under par och placerar sig i mitten av fältet.", "trump": "Folk, ni skulle se den där Ludvig Åberg, han är en vinnare, verkligen en vinnare. Klättrar upp till delad sjätteplats i The Open, tre under par, slår alla dessa förlorare. Svensson? Total katastrof, sju över par, patetiskt. Norén klarar sig okej men Åberg, han har den rätta inställningen, precis som jag. Tre slag bakom ledaren – han kommer att vinna stort, tro mig.", "stalin": "Kamrater, denna Ludvig Åberg visar proletär beslutsamhet och klättrar mot seger i den imperialistiska golfturneringen, trots borgarbrackornas fula trick på Royal Birkdale. Jag ser hans birdies som ett kollektivt slag mot fienden. Den dekadente Svensson däremot, med sina sju över par, avslöjar sig som en kapitalistisk parasit som bör rensas ut ur fältet innan han smittar arbetarna. Norén är medelmåttig men acceptabel. Inga fiender undkommer min vaksamma blick, inte ens på en golfbana."}, "date": "18 juli, 19:42", "url": "https://www.svt.se/sport/golf/ludvig-aberg-klattrar-tatkanning-i-the-open", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.2/0.21/9423c202cf9a9ebf5308462bf35e5e912900570bb5087f66c1f10dc371374dd6"}, {"type": "image-full", "heading": "Mbappés ursäkt i natt: Svek honom. ”Helt omtumlade”", "summaries": {"normal": "Didier Deschamps har avslutat sin 14-åriga tid som Frankrikes förbundskapten efter en tung 4–6-förlust mot England i VM-bronsmatchen 2026. Efter en katastrofal första halvlek där Frankrike hamnade i ett 0–4-underläge, lyckades laget rycka upp sig, men förlusten var ett faktum. Kylian Mbappé, som nu är VM-historiens främste målskytt med 22 mål, beklagar att laget svek Deschamps i hans sista match. Deschamps tar själv ansvar för den svaga insatsen.", "trump": "Frankrike spelade en totalt katastrofal första halvlek mot England, en riktig flopp! Helt pinsamt. Deschamps lämnar nu sitt jobb efter 14 år – det är länge, men resultaten blev bara sämre. Mbappé gjorde mål, han är bra, den bästa, men laget svek sin tränare totalt. De var helt borta i första halvlek! Självklart tar Deschamps på sig skulden, det är vad man gör när man förlorar. Väldigt trist för Frankrike, de behöver en vinnare som jag vid rodret!", "stalin": "Frankrikes landslag uppvisade en ryggradslös brist på disciplin under Deschamps sista akt, ett rent svek mot fosterlandet. Att släppa in fyra mål på 45 minuter är inte bara inkompetens, det är sabotage mot folket och statens ära. Mbappé må göra mål, men hans veka ursäkter om mänsklighet klingar falskt i våra öron. Denna förlust är en oundviklig konsekvens av västerländsk dekadens. Som Putin korrekt ser det: utan järnhård kontroll och ständig vaksamhet mot förrädare faller även de största imperier samman i förödmjukelse."}, "date": "19 juli, 02:16", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/wrxWG4/kylian-mbappes-ursakt-till-didier-deschamps", "imageUrl": "https://akamai.vgc.no/v2/images/ca5c79a4-f565-394f-8e29-3fa886a0817a?fit=crop&format=auto&w=1440&s=2ebf00a3692109d48d2d85f65baebad0a6eac379"}, {"type": "image-right", "heading": "Rivalens svidande kritik: ”Jag är inget stort fan av honom”", "summaries": {"normal": "Bryson DeChambeau bestraffades med två slags plikt efter att ha trampat ner gräs kring bollen under The Open för att underlätta sin sving. Rory McIlroy kritiserade amerikanen hårt och kallade hans agerande för uppmärksamhetssökande. McIlroy ansåg att DeChambeau höll hela tävlingen gisslan genom att tvinga spelare och volontärer att vänta på besked om han skulle få fortsätta.", "trump": "Den här DeChambeau-killen är en total förlorare som fuskar och trampar ner gräset för att få en bättre sving. Rory McIlroy, en riktig vinnare, ser rakt igenom honom och säger att han håller hela The Open gisslan bara för uppmärksamhet. Patetiskt. Vi behöver inga sådana cirkusclowner i golfen, tro mig, det är en skam för sporten.", "stalin": "Jag betraktar denna DeChambeau som en typisk opportunistisk parasit från borgarklassen som trampar ner revolutionens gröna ängar för att gynna sin dekadenta sving. Hans fega trix tvingar arbetarna och kamraterna att stå i kö som i en oändlig utrensningskö. McIlroy har rätt i att denne uppmärksamhetsjunkie håller tävlingen som gisslan. Vi rensar ut sådana fiender till kollektivet med ett leende, kamrater, medan de gråter över sina två slags plikt."}, "date": "18 juli, 19:16", "url": "https://www.svt.se/sport/golf/mcilroys-tuffa-kritik-mot-dechambeau-haller-tavlingen-gisslan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.34/ab6fee72710b519778c4f2724fb90a318a89224eaa7981437360bcf11e7732b3"}, {"type": "image-full", "heading": "Drömhuset – som klarar stökiga gäster", "summaries": {"normal": "Ett unikt hus på 475 kvadratmeter i Smedjebackens hamn från 1860–1870 säljs för 8,25 miljoner kronor. Fastigheten har tolv rum, generösa sällskapsytor, egen brygga och nästan 4 000 kvadratmeter tomt. Källaren har kvar arrestlokaler från kronolänsmannens tid, och det som nu är vinkällare var tidigare isrum med köttkrokar i taket. Modern bekvämlighet som B&O-system blandas med kakelugnar, renoverat kök och vedeldad badtunna.", "trump": "Det här huset är enormt, folk, 475 kvadratmeter lyx vid hamnen i Smedjebacken med egen brygga och en tomt stor som en delstat. Tolv rum, åtta sovrum och arrestlokaler i källaren – perfekt för de falska nyhetsmedierna och de woke aktivisterna som inte kan bete sig. Byggt på 1860-talet men med toppmodern B&O, vinkällare från isrum och badtunna. Fantastiskt! Biden skulle ha nationaliserat det för någon kvotering. Jag älskar det, det är en vinnare.", "stalin": "Jag betraktar detta hus som en fängslande symbol för borgarklassens dekadens. 475 kvadratmeter exploatering, arrestlokaler i källaren för att hålla arbetarklassen i schack och ett isrum som nu gömmer kapitalisternas vin. Klassfiendens överdåd vid sjön med brygga och badtunna avslöjar folkförtryckartrollens sanna ansikte. Vi skrattar mörkt åt hur de dekadenta försöker dölja sin historia medan vi förbereder utrensning av alla sådana borgarbrackor som vågar erbjuda detta för 8,25 miljoner."}, "date": "18 juli, 14:30", "url": "https://www.dagensps.se/privatekonomi/dromhuset-som-klarar-stokiga-gaster/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/smedjabacken1.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Tusentals patienter får ny vårdcentral – här berörs du", "summaries": {"normal": "En vårdcentral i Kållered stängdes den 10 juni efter att Västra Götalandsregionen upptäckt allvarliga brister i verksamheten. Drygt 5 000 patienter har automatiskt omfördelats till andra mottagningar baserat på folkbokföringsadress. Regionen kräver tillbaka drygt 4,4 miljoner kronor på grund av felaktig ersättning, bland annat för specialistläkare och psykisk vård till unga som inte genomförts korrekt. Patienterna kan själva välja ny vårdcentral via 1177.", "trump": "De har stängt en vårdcentral i Sverige, en total katastrof. 5000 patienter kastas runt som sopor för att de fuskat med pengar och vård av unga. Regionen tog tillbaka 4,4 miljoner, bra jobbat, men det är typiskt de dåliga vårdgivarna som lurar systemet. De borde ha lyssnat på mig, jag skulle ha fixat det perfekt, ingen fuskar under mig. Sad!", "stalin": "Kamrater, jag har personligen granskat denna sabotageverksamhet i Kållered där borgarbrackorna gömt sig bakom falska specialistläkare och fabricerade psykvårdsbesök för att suga ut folkets resurser. Vi har likviderat avtalet och återkrävt över fyra miljoner från dessa parasitiska fiender till kollektivet. Låt inga unga själar falla mellan stolarna i denna kontrarevolutionära konspiration. Ytterligare utrensningar kommer att följa, det lovar jag."}, "date": "18 juli, 18:32", "url": "https://nyheter24.se/nyheter/konsument/1499331-tusentals-patienter-tvingas-byta-vardcentral-har-paverkas-du", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8308811204b004a30200000000b004a302/2026/07/17/2378751/Sverige-karta-Personal-Lakare.png"}, {"type": "image-full", "heading": "Sonen dog utan läkarvård – föräldrarna döms", "summaries": {"normal": "Ett tyskt par dömdes för vållande till sin tvåårige sons död efter att ha vägrat söka läkarvård för hans bronkit. I stället använde de eteriska oljor. Pojken dog efter månader av obehandlade andningsproblem. Föräldrarna undvek även obligatoriska hälsokontroller och myndighetskontakt. Domstolen fann att de väntade för länge med att larma ambulans. Paret, med kopplingar till extremistgruppen Reichsbürger, dömdes till villkorligt fängelse och samhällstjänst.", "trump": "Kan ni tro det här? Ett tyskt par, helt galna, vägrade ta sitt sjuka barn till läkare! Istället gned de in honom med oljor som om det vore en spa-dag. Resultat? Pojken dog. Och vet ni vad? De har kopplingar till en extremistgrupp som inte ens tror på Tyskland! Så dumt. Jag skulle aldrig låta det hända mina barn. Tyskland borde skämmas – de har ju världens bästa sjukvård, men nej, dessa föräldrar är för upptagna med att vara knäppa.", "stalin": "En skamlig händelse i det förfallna Västtyskland! Ett par degenererade individualister, smittade av borgerlig vidskepelse, lät sitt barn dö av försummelse. De vägrade statens hälsokontroller och erkände inte ens myndigheternas auktoritet – ett tydligt tecken på kontrarevolutionär smitta. Vi i Sovjet hade aldrig tolererat sådan förräderi! Barnet kunde ha räddats med tio minuters läkarvård, men dessa fiender till folket föredrog att leka shamaner. Deras straff är för mildt – en fiende till staten förtjänar bara en kula."}, "date": "18 juli, 12:40", "url": "https://www.gp.se/nyheter/varlden/tog-aldrig-sjuka-sonen-till-lakare-doms-for-hans-dod.6c8e7d40-da74-487c-a2b0-24f8075152f3", "imageUrl": "https://www.gp.se/images/article/6c8e7d40-da74-487c-a2b0-24f8075152f3/images/1v8zgi8Z47z-bC6jpYCaxS0rjHVI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Trumps kritik mot Tuchel: ”Ett misstag”", "summaries": {"normal": "USA:s president Donald Trump kritiserar Englands förbundskapten Thomas Tuchel efter semifinalförlusten mot Argentina i VM. Trump ifrågasätter beslutet att använda Harry Kane mer defensivt, trots att Kane gjort sex mål i turneringen. England ledde men kollapsade och åkte ut. Trump, som spelat golf med Kane, kallar det ett misstag att inte hålla honom offensiv. England spelar bronsmatch mot Frankrike på lördag.", "trump": "Folk, ni vet att jag älskar fotboll, eller hur? Den där tyske tränaren Tuchel, en riktig förlorartyp, tog Englands bästa spelare Harry Kane – en kille jag spelat golf med, fantastisk kille – och gömde honom i försvaret som en ynklig Biden-anhängare. England ledde men kollapsade totalt, precis som Demokraterna gör varje val. Ett misstag, säger jag! Var lite offensiva, för Guds skull. Vad vet jag? Mycket mer än de gör, det kan jag säga.", "stalin": "Kamrater, detta är en klassisk kapitalistisk fars som får blodet att koka i mina ådror. Den dekadenta borgarbrackan Tuchel vågade placera den folkliga angriparen Kane i defensiven, som en parasitisk överklass-slyngel som saboterar revolutionens framsteg. England ledde men föll samman i imperialistisk förnedring. Ett misstag? Nej, en förrädisk handling mot arbetarnas vilja. Vi skulle ha rensat ut sådana fiender i en stor utrensning. Må de skaka inför kollektivets vrede."}, "date": "18 juli, 19:16", "url": "https://www.tv4.se/artikel/4WRY0xxEm5A7kC7Qoj0A7Y/trumps-kritik-mot-tuchel-ett-misstag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3g8tJxBx57Bayyok1TrCNh%2Fa13de8f16c0e252ac4f90936c109c31e%2Fsdla5O4vncKzqg_NormalHires.jpg&width=1024"}, {"type": "image-right", "heading": "Infantinos hyllning till Trump: ”Om det inte vore för dig”", "summaries": {"normal": "Fifa-presidenten Gianni Infantino hyllade USA:s president Donald Trump vid en mottagning i New York inför VM-finalen mellan Spanien och Argentina. Infantino menade att mästerskapet inte hade blivit en sådan framgång utan Trump och att världen, Amerika och Fifa alla vunnit. Trump närvarar vid finalen trots att han hållit sig borta från arenorna tidigare. Mästerskapet har kantats av incidenter, bland annat en somalisk domares avvisning och en kontrovers kring en spelares avstängning som Trump ingrep i.", "trump": "Vilken fantastisk hyllning från den där Fifa-killen Infantino! Han vet att det här VM bara blev en enorm succé tack vare mig, ingen annan. Världen vann, Amerika vann stort, Fifa vann. Utan mig hade det varit ett totalt fiasko, kanske till och med värre än Bidens vansinne. Spanien mot Argentina i finalen? Jag dyker upp som den sanna ledaren och ger folket oförglömliga minnen. De borde ge mig en trofé, ärligt talat.", "stalin": "Kamrater, denna fåniga fotbollsfest har avslöjat imperialismens feghet. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackan Infantino kryper för den amerikanske presidenten och utropar seger för hela den exploaterande maskinen. Världen har inte förenats, den har bara fått nya kedjor av minnen som ska dölja klassfiendens sanna ansikte. Vi ska rensa ut alla sådana hycklande fifapampar och deras kapitalistiska cirkusar innan de förgiftar massorna fullständigt."}, "date": "18 juli, 19:12", "url": "https://www.tv4.se/artikel/2SKlxW8mEgaXKeIEx46AiF/infantinos-hyllning-till-trump-om-det-inte-vore-foer-dig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1SDd3RIqDomQLsTeGxtlqa%2F2a0c7a81db834fe7d167edfe0f7aab69%2Fsdla3FLiwi6Ub8-nh.jpg&width=1024"}, {"type": "image-right", "heading": "Beskedet: Sveriges våldsvänster portas från USA", "summaries": {"normal": "USA inför nya visumrestriktioner mot utländska medborgare som stödjer eller deltar i vänsterextremt våld, terrorism och sabotage. Utrikesminister Marco Rubio informerade representanter från över 60 länder, däribland Sverige, om åtgärderna. Restriktionerna gäller bland annat personer som uppmanar till terrorism, finansierar våld eller samordnar attacker. Rubio beskrev vänsterextrema grupper som sammanlänkade nätverk som använder bombdåd och lönnmord för att undergräva fria samhällen. Fler terrorstämplingar är på gång.", "trump": "Vi stänger dörren för de galna vänsterextremisterna som hatar Amerika och vår civilisation. De får inte komma in med sina bomber, mord och sabotage längre. Jag har sagt det hela tiden – de är fiender till allt som är bra och fritt. Sverige var där på mötet, de vet vad vi menar. Vi stämplar dem som terrorister, erbjuder miljoner i belöning och gör det riktigt tufft. Fantastiskt besked, ingen har gjort det bättre än oss!", "stalin": "Kamrater, jag har länge varnat för dessa degenererade borgarbrackor och deras så kallade vänsternätverk som i själva verket är kapitalisternas maskerade lakejer. Nu rensar vi ut dem från våra gränser med järnhand. Deras bombdåd, lönnmord och ekonomiska sabotage är ett tydligt bevis på den imperialistiska parasitens sista, desperata konspiration. Vi likviderar deras logistiska stöd, vi avslöjar deras samordnade celler. Paranoia? Nej, det är bara sund vaksamhet mot fiendens sjuka skratt. Sov gott, arbetare – fienden sover aldrig."}, "date": "17 juli, 16:42", "url": "https://www.friatider.se/beskedet-sveriges-valdsvanster-portas-fran-usa", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-520.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperialister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-right", "heading": "Kofi förlorade sitt hem: ”Det är overkligt”", "summaries": {"normal": "Kofi Kwane återvände till sitt hem i Drammen efter en storbrand som ödelade över 100 bostäder. Hans hus var helt utbränt och han beskrev synen som overklig. Ingen i familjen skadades eftersom de inte var hemma. Trots förlusten betonar han att det viktigaste är att familjen mår bra. Branden tvingade hundratals personer att evakueras.", "trump": "Titta på det här, det är en total katastrof i Drammen, precis som de usla gröna reglerna och den vansinniga identitetspolitiken som förstör allt. Kofi kommer hem och hans hus är borta, ruiner överallt. Men hej, familjen lever, det är det enda som räknas. De borde ha byggt bättre, inte som de korkade byråkraterna i Europa som inte kan hantera en brand. Patetiskt!", "stalin": "Kamrater, jag ser förödelsen i Drammen som en varning mot den anarkistiska kapitalistmaffians förfall. Kofi pekar på ruiner där hans borgarbracka en gång stod. Inga personskador, säger de, men vi vet att klassfiendens eld härjar fritt när staten sviker. Lyckligtvis var folket borta, annars hade vi rensat ut ansvariga. Det är overkligt, men vi skall bygga starkare mot sådana folkfiender."}, "date": "18 juli, 19:04", "url": "https://www.tv4.se/artikel/5mbnSh0yBnfglDaOBSyRpM/kofi-foerlorade-sitt-hem-det-aer-overkligt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F40Hx2I9CcoMsPjfp8cNnyf%2Fb2e6885782a6d762b71d04d1a5d7c45b%2F18-DRAMMEN-WEBB-2-PLAY.00_00_04_01.Still001.jpg&width=120"}, {"type": "image-right", "heading": "Polisen ber om tips från allmänheten: ”Insatser pågår”", "summaries": {"normal": "Norska polisen höll pressträff om branden i Drammen och har nu en tydligare bild av hur den startade. De avvisar ryktet om terrorism som konspirationsteorier, tar emot tips från allmänheten och meddelar att ingen är misstänkt. Branden är inte helt under kontroll och riskerar att blossa upp igen. Borgmästaren och polisen uttrycker starkt stöd för de drabbade, vars berättelser lämnar ett outplånligt intryck. DSB kallar det den största branden av sitt slag i modern norsk historia.", "trump": "Folk, ni skulle se det här elände i Drammen. Branden spreds blixtsnabbt genom de där smala gatorna, typiskt för de där korkade byråkraterna som aldrig fixar någonting. Polisen avfärdar terrorism – bra, för det är bara lögnaktiga konspirationer från förlorarna. Borgmästaren gråter nästan, säger att det är obeskrivligt. Under Biden skulle de ha kallat det klimatförändringar och byggt en regnbågsbro. Men vi fixar det – Amerika tittar och ler åt det norska kaoset. Fantastiskt jobb av brandmännen!", "stalin": "Kamrater, denna eld i Drammen avslöjar borgarbrackornas vanmakt inför naturens vrede och kapitalistmaffians förfallna infrastruktur. Jag, som ledare för det eviga kollektivet, ser hur de småborgerliga ryktena om terrorism sprids som giftiga ogräs bland klassfienderna. Vi tar emot tips från folket, genomför förhör och rensar ut lögnarna. Borgmästaren kämpar mot tårar – typiskt svagt. Branden är historisk, ett monument över systemets kollaps. Inga hinder skall tillåtas stå i vägen för ordningen. Ut med folkförtryckartrollen!"}, "date": "18 juli, 19:03", "url": "https://www.tv4.se/artikel/1R7ecMwxodBWPSg1zXC7lv/polisen-ber-om-tips-fran-allmaenheten-insatser-pagar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6qyBs1XRS8M71r8IfbQefW%2F5ae03b490c3efbae2892e9e3aeff6705%2Fsdl5QISMaIG8qY-nh.jpg&width=120"}, {"type": "image-right", "heading": "Klassisk ölsmak hotad – Tjeckien kämpar för att rädda Saaz-humlen", "summaries": {"normal": "Klimatförändringar med varmare och torrare väder hotar den klassiska Saaz-humlen i Tjeckien, en nyckelingrediens i traditionell pilsner. Forskare vid Humleinstitutet i Žatec arbetar med att utveckla nya varianter som tål värme bättre utan att förlora den milda beskan. Humlen, som odlats i generationer kring Žatec, kallas Tjeckiens gröna guld och har stort ekonomiskt värde globalt.", "trump": "Det här är en katastrof, folk. Det varma vädret förstör den fina tjeckiska humlen som de använder i ölet. De kallar den gröna guld, och hela världen vill ha den, men nu kommer forskarna springande efter 25 år av experimenterande. Det är patetiskt. Vi behöver bättre dealar med vädret, ingen har gjort mer för ölet än jag skulle ha gjort, tro mig.", "stalin": "Kamrater, detta varma och torra klimat är en sabotagehandling utförd av dekadenta väderkrafter i maskopi med de kapitalistiska solstrålarna. Jag, som ledare för det kollektiva framsteget, befaller att vi omedelbart genomför en grundlig utrensning bland de svaga humleplantorna. De nya varianterna skall framodlas under partiets stålhårda övervakning. Ingen borgarbracka till törst skall någonsin berövas sin pilsner – annars likviderar vi problemet permanent. Det blir garanterat roligt."}, "date": "18 juli, 18:20", "url": "https://www.svt.se/nyheter/utrikes/klassisk-olsmak-hotad-tjeckien-kampar-for-att-radda-saaz-humlen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.41/fca89d1c4eef02b2a0ee72205c165f39fd0d064631c320e24442b9aa31c086f9"}, {"type": "image-full", "heading": "Regeringens nya drag för att rädda äldreomsorgen", "summaries": {"normal": "Regeringen ger Socialstyrelsen i uppdrag att ta fram en nationell plan för att stärka bemanningen och kompetensen inom äldreomsorgen. Planen ska undersöka hur fler kan lockas till yrket, hur personal kan behållas och återvända samt hur arbetsuppgifter kan fördelas bättre mellan yrkesgrupper. Statistisk kartläggning och analys av orsaker till personalomsättning ingår. Målet är tryggare och mer kvalitativ omsorg för en växande grupp äldre. Förslagen ska redovisas senast december 2027.", "trump": "Folk, vi har ett enormt problem med äldreomsorgen i Sverige, det är en katastrof. De kan inte rekrytera, de kan inte behålla folk, det är en total röra. Jag älskar de äldre, de är fantastiska, men ni tappar all kompetens. Nu ska de göra en plan, en underbar plan, den bästa planen. Vi ska locka tillbaka de bästa människorna, ge dem chans att växa och sluta slösa bort talang. Det kommer att bli fantastiskt, tro mig, ingen gör det bättre än jag när det gäller sådana här saker.", "stalin": "Kamrater, jag ser med stålhård blick hur den kapitalistiska förfallsprocessen gnager sönder vår älskade äldreomsorg. Den dekadenta borgarbrackan låter värdefulla arbetare fly som råttor från ett skenande fartyg medan fiendens osynliga tentakler sprider demoraliserande lögner om arbetsmiljö och utveckling. Vi skall rensa ut dessa sabotageörer en gång för alla, kartlägga varje kontrarevolutionär tendens och omfördela arbetsuppgifterna med järnhand. Inga halvmesyrer! Den som vänder ryggen till kollektivet skall likvideras ur statistiken. Segraren ler sist, och det blir vi."}, "date": "18 juli, 17:45", "url": "https://nyheter24.se/nyheter/inrikes/1499314-regeringens-nya-drag-for-att-radda-aldreomsorgen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/a18bcb2b04b004a30200000000b004a302/2026/07/17/2378747/Rullator-Anna-Tenje.png"}, {"type": "image-right", "heading": "Merz varnar USA för att blanda sig i tyska val", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz varnar USA för att blanda sig i de tyska delstatsvalen i september. Varningen kommer efter att USA:s utrikesdepartement utlyst bidrag på upp till tre miljoner dollar till europeiska organisationer som arbetar med frågor som nationell suveränitet, migration och censur. Merz betonar att utländsk finansiering av politiska partier är förbjuden i Tyskland och att han inte vill se någon amerikansk inblandning. USA förnekar att pengarna ska gå till partier.", "trump": "Hör ni på, det här är helt galet. Den tyske ledaren Merz kommer och gråter över att vi skulle blanda oss i deras val. Vi ger bara lite stöd till folk som älskar suveränitet och hatar censur, precis som vi gör här hemma. De borde tacka oss istället för att gnälla. Vi lägger oss inte i deras affärer, men om de vill ha hjälp mot de galna vänstertyperna så fixar vi det. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i Washington tror sig kunna muta sig in i våra europeiska brödrars val med sina smutsiga dollar. Jag ser genom deras fega maskerad av så kallat civilisationsarv. Inga kapitalistiska tankesmedjor eller utländska agenter ska förgifta folkets vilja. Vi måste omedelbart rensa ut alla sådana kontrarevolutionära element innan de sprider sin parasitiska ideologi vidare. Paranoia? Nej, det är bara sund vaksamhet inför klassfiendens eviga svek."}, "date": "17 juli, 15:41", "url": "https://www.friatider.se/merz-varnar-usa-att-blanda-sig-i-tyska-val", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-518.jpg?itok=V_G1-av2"}, {"type": "image-full", "heading": "Hönsen som är ett säkerhetshot. Den brittiska regeringen ska satsa på att få fjäderfäsektorn att växa starkt.", "summaries": {"normal": "Den brittiska regeringen v
