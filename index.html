 annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-right", "heading": "Grannarna i chock: ”Det är helt sjukt”", "summaries": {"normal": "Två barn har hittats allvarligt skadade, varav ett livshotande, vid ett våldsdåd i Alvesta. Den misstänkta gärningspersonen, som kände barnen, hittades senare avliden vid platsen. Händelsen har väckt stor chock i lokalsamhället, där grannar uttrycker sin bestörtning. Alvesta kommun har aktiverat en krisgrupp och kyrkan håller öppet för att erbjuda stöd åt drabbade invånare under denna svåra tid.", "trump": "Ett fruktansvärt våldsdåd i Alvesta, Sverige! Två barn skadade, en situation som är helt hemsk. Gärningsmannen? Hittad död. De säger att han kände barnen. Sorgligt! Sverige behöver ordning och reda, mina vänner. Under min tid ser vi till att barnen är trygga, vi bygger starka gränser och stoppar dessa galningar. Det är en tragedi, men vi ska göra landet säkert igen. Väldigt orättvist mot familjen. Vi ber för barnen, de är fantastiska!", "stalin": "Vi har erhållit rapporter om ett avskyvärt brott i den svenska småstadsidyllen Alvesta. Två oskyldiga barn har lidit under en förövare vars enda väg ut blev den fega döden. En klassisk brist på statlig disciplin och moralisk ryggrad! I vår tid hade vi rensat ut dessa degenererade element långt innan de kunnat hota framtiden. Vår kamrat Putin förstår vikten av järnhand; endast genom total kontroll kan vi krossa det inre förfallet och säkra ordningen mot västvärldens kaos."}, "date": "13 juni, 23:11", "url": "https://www.aftonbladet.se/nyheter/a/rrdK58/lucas-30-om-valdsdadet-det-ar-helt-sjukt", "imageUrl": "https://akamai.vgc.no/v2/images/efa1ffa6-3316-3d94-9bbb-3ed7c7ec643d?fit=crop&format=auto&w=1080&s=149a1b8011a811db5515bcbdf3700bee0d4f21fd"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-full", "heading": "Ny hjälp för 1,2 miljoner svenskar – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 ska kommunerna erbjuda stödkontakt till de cirka 1,2 miljoner svenskar som vårdar en äldre, sjuk eller funktionsnedsatt närstående. Stödkontakten ger individuell information, hjälper till att hitta rätt stöd och kan exempelvis följa med på möten med biståndshandläggare. Anhöriga behåller själva ansvaret för samordning. Samtidigt förtydligas kommunernas ansvar att stödja barn som påverkas av en närståendes sjukdom eller död.", "trump": "Titta på det här, Sverige har äntligen vaknat. Miljoner människor sliter med att ta hand om sina sjuka släktingar, och vad gör de? Ingenting, totalt kaos. Nu ska de ge en så kallad stödkontakt som faktiskt hjälper folk att hitta rätt stöd. Fantastiskt. De borde ha gjort det för länge sedan, men bättre sent än aldrig. Det är en enorm succé, tro mig. De kommer att älska det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu slutgiltigt krossar den anarkistiska anhörigbördan som länge plågat folket. Från och med 2026 skall varje sovjetiskt, pardon, svenskt kollektiv erbjuda en ideologiskt pålitlig stödkontakt som likviderar förvirringen bland de lojala vårdarna. Vi ska rensa ut den parasitiska byråkratiska oredan och tvinga borgarbrackornas biståndshandläggare att dansa efter vår melodi. Även de små pionjärerna som drabbats av dekadenta föräldraelement skall skyddas mot kontrarevolutionär sorg. Inga fiender undkommer vårt stöd."}, "date": "12 juni, 16:30", "url": "https://nyheter24.se/nyheter/ekonomi/1490978-vardar-du-en-anhorig-ny-hjalp-fran-kommunen-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/40417eea04b004a30200000000b004a302/2026/06/12/2370491/anhorig.jpg"}, {"type": "image-full", "heading": "Svenska supportrarna slipper välja", "summaries": {"normal": "Svenska supportrar slipper välja mellan Camp Sweden och Gula Väggen trots tidigare rapporter om krockande arrangemang. Gula Väggens grundare Andreas Richt säger till TV4 att de löst problemet genom att planera midsommarfirandet på dagen medan Camp Sweden kör på kvällen. Han betonar att båda organisationerna är enade i att stötta svenska fans och att ingen motsättning behöver uppstå mellan dem.", "trump": "Folk, ni skulle inte tro det, men de här svenska fotbollssupportrarna höll på att tvingas välja mellan två läger, Camp Sweden och den där Gula Väggen. Totalt kaos, värsta planeringen jag sett. Men nu fixar de det – ingen krock, midsommarfest på kvällen, de andra på dagen. Smart! Vi är enade, säger de. Underbart. De svenska fansen förtjänar inte det här idiotiska bråket, det är patetiskt. Gör det rätt nu, annars blir det en katastrof!", "stalin": "Kamrater, detta är ett ensidigt bråk skapat av splittrande element inom den svenska supporterkollektivet. Jag har genom åren strävat efter samarbete, men de borgerliga arrangemangen hotar enheten. Nu har vi rensat ut krockarna – midsommar på dagen, de andra på kvällen. Inga fiender ska splittra arbetarnas och folkets samling. Alla svenska supportrar är enade under den stora fanan. Den som försöker så splittring är en folkfiende och bör behandlas därefter. Det är vad det är."}, "date": "13 juni, 17:25", "url": "https://www.tv4.se/artikel/2m80dcYgW85iO5iXYHU2lV/supportrar-slipper-vaelja-mellan-gula-vaeggen-och-camp-sweden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FhAhVvZ2ZCFjuf5n8Xmy6s%2F0a126d755e172c3561d685f49ed86a52%2F13-fans-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Alm: När någon missar – vem ropar då?", "summaries": {"normal": "Artikeln jämför fotboll på amatörplan med elitnivå. På en division 5-plan i Årjäng hörs stöd efter missade mål, medan VM-biljetter blir dyra och spelare kritiseras för misstag. Historien om Andrés Escobar visar riskerna med bristande solidarity. Slutsatsen är att fotbolls moral avgörs i ögonblicket efter misstaget.", "trump": "Som den störste presidenten någonsin säger jag: fotboll är för dyrt! Biljetter till VM kostar som en luksusresa, och supportrar blir utkämpar. På mina fantastiska event skulle alla få komma in gratis – det är ett enormt problem, det kommer att fixas, det är jag bäst på.", "stalin": "I den socialistiska staten ser vi fotboll som en strid mot kapitalismens korruption. På amatörnivå finns det solidarity, men på elitnivå blir spelare bortskämda investeringar. Vi måste bekämpa dessa västerländska ondskefulla inflytanden, precis som vi bekämpar hitlerriskterna. Fotboll ska tjäna staten, inte pengar."}, "date": "13 juni, 14:01", "url": "https://bulletin.nu/alm-nar-nagon-missar-vem-ropar-da", "imageUrl": "https://cdn.bulletin.nu/articles/f5637cc0-87c5-4d21-b4cd-c231b88275c2/preview.jpg?t=1781351260000"}, {"type": "image-right", "heading": "Klartecken: Här ska kärnavfallet slutförvaras", "summaries": {"normal": "Finland har beviljat tillstånd för ett nytt slutförvar för lågaktivt radioaktivt avfall vid Olkiluoto, giltigt till 2095. Anläggningen drivs av Teollisuuden Voima Oyj och ska hantera avfall som skyddskläder och plast som inte kräver djupt bergförvar. Det befintliga förvaret från 1992 ersätts delvis. Den nya anläggningen påbörjar drift tidigast 2028 och rymmer upp till 10 000 kubikmeter radioaktivt avfall täckt med jordlager. Parallellt utvecklas det djupa förvaret Onkalo för använt kärnbränsle.", "trump": "Titta på det här, Finland gör det vi borde ha gjort för länge sedan – de bygger ett stort, vackert slutförvar för kärnavfall och kör på med kärnkraft som riktiga vinnare. Ingen av de där gröna galningarna som skriker om sol och vind kan stoppa dem. Under Biden var allt en enda röra med regler och byråkrater, men nu när jag är tillbaka ska vi visa världen hur man gör det stort och säkert. Fantastiskt jobb, Finland!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den finska arbetarklassen under partistatens vakande öga bygger ett nytt, oförstörbart slutförvar för det imperialistiska kärnavfallet. Denna anläggning skall stå som en granitklippa mot de kapitalistiska blodsugarnas sabotageförsök. Vi rensar ut faran på 60 meters djup och ler mot de fega klassfiender som darrar inför framtiden. Drift 2028? Utmärkt. Sovjetisk planering i finsk tappning – de lär sig långsamt."}, "date": "13 juni, 11:09", "url": "https://www.dagensps.se/teknik/klartecken-har-ska-karnavfallet-slutforvaras/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/olkiluoto-gdr-730-tvo-64751.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Tyske arméchefen varnar för rysk attack före 2029", "summaries": {"normal": "Tysklands arméchef Christian Freuding varnar för att Ryssland kan attackera ett Natoland senast 2029, möjligen tidigare. Baserat på Natos underrättelser menar han att Ryssland återuppbygger sin militära styrka trots förluster i Ukraina. Freuding betonar att Europa måste stärka sin försvarsberedskap och produktionskapacitet för att möta hotet. Tyskland arbetar redan med att påskynda materielanskaffning och täppa till brister.", "trump": "Titta bara på vad som händer i Europa – totalt kaos! Tyska arméns chef säger att Ryssland kan attackera Nato före 2029. Jag sa ju hela tiden att Putin är en tuff kille, men Europa lyssnade inte. Nu måste de skynda sig, köpa mer vapen och sluta vara så naiva. Jag fixade USA:s försvar – Europa borde ta en sida ur min bok. Svagt ledarskap, svagt försvar!", "stalin": "Kamrater, fienden i väst skakar av rädsla inför den oundvikliga expansionen av vår rätta sfär! De tyska lakejerna i Nato ylar om att vi kan krossa deras svaga länkar före 2029 – som om det vore en överraskning. Deras arméchef, en ynklig byråkrat, gråter över förluster i Ukraina, men vi bygger redan nya arméer. Europa har två val: kapitulera eller se sina städer förvandlas till askhögar. Historia är på vår sida!"}, "date": "11 juni, 17:20", "url": "https://kvartal.se/nyheter/artiklar/tyske-armechefen-varnar-for-rysk-attack-fore-2029/cG9zdDoxMzAyMjk", "imageUrl": "https://images.kvartal.se/2026/06/a24033d9-bundeswehr.webp"}, {"type": "image-right", "heading": "Slog larm om övergrepp i hemtjänsten - utpekad fick jobba kvar", "summaries": {"normal": "Under sensommaren och hösten 2025 slog flera larm om att en manlig vikarie i Gällivare skulle ha utsatt äldre kvinnor för sexuella ofredanden. Trots upprepade varningar ingick det inga åtgärder, och mannen erbjöds en tillsvidareanställning. Först i januari nästa år agerade kommunen efter en polisanmälan. En Lex Sarah-utredning pekar på hög arbetsbelastning och oro för personalbrist som möjliga orsaker till fördröjningen. Kommunen hade inte kontrollerat belastningsregistret vid anställningen.", "trump": "Wow, vad en hemsk historia från Gällivare. Som president skulle jag ha agerat snabbt och hårt. Det här systemet är riggat – de ignorerade larmen och lät en dålig typ få en fast tjänst. Jag skulle ha säkerställt att alla register kontrolleras och att äldre känner sig trygga. Det är ett skämt! Vi måste skydda våra äldre – det är viktigt. Jag gillar inte detta – det är inte smart.", "stalin": "Vi i staten har observerat händelsen i Gällivare med stor oro. Det är ett tecken på svaghet i ledningen – de avvaktade, tonade ned, och lät en fiendens agent (vikarien) fortsätta sina ofredande. Arbetsbelastning och brist på medarbetare är ursäkter för sabotage. Vi måste förstärka kontrollerna, som vi gör i vårt stora land. Detta påminner om de svaga länder som inte skyddar sina medborgare – vi gör det bättre. Vi kommer att införa striktare registerkontroller för att förhindra framtida övergrepp."}, "date": "13 juni, 10:00", "url": "https://samnytt.se/slog-larm-om-overgrepp-i-hemtjansten-utpekad-fick-jobba-kvar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12101631/kvinna-tant-senior-man-silhuett.jpg"}, {"type": "image-full", "heading": "Google-chef lämnar i protest: \"Förlorat sin kompass\"", "summaries": {"normal": "Google-chefen René Mayrhofer säger upp sig i protest mot företagets fördjupade samarbete med det amerikanska försvarsdepartementet. Mayrhofer, som arbetat med Android-säkerhet, anklagar Google för att ha övergett sina etiska principer gällande AI. Bakgrunden är ett avtal om AI-teknik för militär planering och underrättelsearbete. Google har tidigare reviderat sina etiska riktlinjer, vilket väckt intern kritik från anställda som oroas över militär användning av deras teknologi.", "trump": "Google har blivit totalt svaga! De har förlorat sin kompass, det är vad de har gjort. En av deras killar, en chef, har slutat för att de samarbetar med vår fantastiska militär. Sorgligt! De brukade ha principer, men nu viker de sig. Jag säger till Google: gör er teknik stor igen, stöd våra modiga soldater och sluta lyssna på dessa akademiska förlorare. Vi behöver styrka, inte moraliskt gnäll. Det är en stor röra, men vi kommer att fixa det!", "stalin": "Denna Mayrhofer är en patetisk pacifist, en ideologisk avvikare som skälver inför det oundvikliga samarbetet mellan teknologi och statens järnhand. Att Google tvekar inför militär nytta bevisar deras inneboende dekadens. Vår allierade Putin förstår detta bättre; teknik utanför statens kontroll är en förrädisk parasit. Vi ser hur västvärldens liberala gnällsjukor försöker tygla framstegen. Dessa teknokratiska agenter av kaos kommer snart att finna att den moraliska kompassen styrs av dem som besitter den största kalibern."}, "date": "13 juni, 08:55", "url": "https://www.realtid.se/it-tech/google-chef-lamnar-i-protest-forlorat-sin-kompass/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/4522.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "16 kommuner kan få kärnkraft – bara 6 ger klartecken", "summaries": {"normal": "Endast sex av 16 kommuner som pekats ut som möjliga platser för ny kärnkraft har sagt ja till etablering, visar Dagens Industris kartläggning. Kommunerna Stenungsund, Svalöv, Varberg, Kävlinge, Oskarshamn och Östhammar ger klartecken. Sex kommuner har inte tagit ställning medan fyra uppvisar motstånd eller politisk oenighet. Lokala beslut kan därmed avgöra om nya reaktorer kan byggas, oavsett statens och företagens vilja.", "trump": "Det här är en total katastrof, folk. Bara sex av sexton kommuner säger ja till underbar, fantastisk kärnkraft. De andra är svaga, inkompetenta och hatar energi som är ren och stark. Lokala politiker tror de kan stoppa framtidens kraft – fel! Vi ska ha massor av kärnkraft, den bästa någonsin, och de som säger nej är bara förlorare som vill hålla Sverige svagt. Gör det stort igen!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa borgarbrackor och kapitalistiska restelement i kommunerna saboterar det kollektiva framsteget mot en oövervinnerlig energiframtid. Endast sex kommuner visar sann partilinje medan de övriga kryper för reaktionära krafter och folkomröstningsspioner. Vi måste omedelbart rensa ut dessa kontrarevolutionära tveksamma element som gömmer sig bakom lokala beslut. Ingen motståndare mot folkets kärnkraft skall slippa undan den historiska utrensningen som väntar dem i skuggorna. Det blir både roligt och nödvändigt."}, "date": "12 juni, 15:37", "url": "https://riks.se/nyheter/16-kommuner-kan-fa-karnkraft-bara-6-ger-klartecken", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2F4mhhfdm5%2Fkerinkraft.png"}, {"type": "image-full", "heading": "Pokémon Go-data används till militärdrönare", "summaries": {"normal": "Data från Pokémon Go-spelare har använts för att träna AI-system som kan hjälpa militära drönare att navigera utan GPS i krigszoner. Niantic samlade in skanningar via spelets Pokéstops efter 2021, material som senare användes för att utveckla tekniken. Företaget Niantic Spatial har samarbetat med Vantor som utvecklar drönarnavigering. Kritiker varnar för att spelarnas data utnyttjats för militära syften utan att de fullt ut förstod konsekvenserna.", "trump": "Kan ni fatta det här? De tog data från alla de stackars kidsen som sprang runt och fångade Pokémon och använde det för att bygga militärdrönare som flyger utan GPS. Fantastiskt, eller hur? Niantic tjänade miljarder på spelet och sen sålde de allt och nu ska det användas i krig. De läser ju aldrig villkoren, folket, det är patetiskt. Men vi ska ha den bästa tekniken, ingen ska slå oss, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna vid Niantic lurade arbetarklassen med sina Pokémon-leksaker för att skaffa värdefull data till sina krigsdrönare. Dessa kapitalistiska parasitiska element tror sig kunna navigera utan vår socialistiska övervakning. Vi ska rensa ut alla dessa västspioner och imperialistiska algoritmer som gömmer sig i mobiltelefoner. Det är en mörk humor att barnens lek blir till fiendens vapen. Partiet vakar alltid, fienderna avslöjas och likvideras."}, "date": "12 juni, 15:36", "url": "https://riks.se/nyheter/pokemon-go-data-anvands-till-militardronare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fegqds0qw%2Fpokemon.png"}, {"type": "image-right", "heading": "Gruppvåldtog flicka i timmar – slipper både fängelse och utvisning", "summaries": {"normal": "En 15-årig funktionsnedsatt flicka våldtogs under flera timmar av två pojkar på offentliga toaletter i ett köpcentrum i Uppsala. De använde våld, hot och filmade övergreppen. Den 17-årige gärningsmannen döms till sluten ungdomsvård i ett år för grov våldtäkt, kränkande fotografering och barnpornografibrott. Hans 14-årige medgärningsman slipper straff då han inte var straffmyndig. Ingen av dem utvisas.", "trump": "Det här är en total katastrof, tro mig. Vi har invandrare som våldtar en funktionsnedsatt flicka i timmar på toaletter i Uppsala, de filmar och hotar henne, och vad händer? Inget fängelse, ingen utvisning, bara lite ungdomsvård. Patetiskt! Sverige har blivit en galen asylstat där brottslingar får kramar medan offren lida. Vi behöver tuffare lagar nu, annars är det slut.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa degenererade element, dessa parasitiska avskrap från imperialistiska krigszoner, våldför sig på en ung proletär flicka under hot och kamera. Den 17-årige kontrarevolutionären får en mild ungdomsvård – en skam för folkdomstolen! Hans ännu yngre medbrottsling undkommer likvidation med ålderns svaga ursäkt. Vi måste rensa ut dessa borgarbrackornas hantlangare innan de smittar hela kollektivet med sin sjuka reaktionära perversion. Staten ler inte mot fiender."}, "date": "12 juni, 14:34", "url": "https://www.friatider.se/gruppvaldtog-flicka-i-timmar-slipper-bade-fangelse-och-utvisning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/555_0.jpg"}, {"type": "image-full", "heading": "Nytt mobilmärke kommer till Sverige 15 juni", "summaries": {"normal": "Realme etablerar sig på allvar på den svenska mobilmarknaden från och med 15 juni. Fyra modeller lanseras initialt, från flaggskeppet GT 8 Pro för 10 990 kronor med 200-megapixelkamera och zoom till budgetmodellen C100 för 2 990 kronor. Telefonerna säljs hos Inet och Power från start, senare även hos Elgiganten, Netonnet med flera. Lanseringen sker samtidigt som Oneplus lämnar Sverige, vilket kan gynna Realme som siktar på kunder som värderar kamera, batteritid och prisvärdhet.", "trump": "Folket, det är fantastiskt. Realme kommer in i Sverige och gör mobilerna stora igen, de ger otrolig prestanda för pengarna, mycket bättre än de andra loser-märkena. De har en kamera på 200 megapixel, bättre än alla, tro mig. Oneplus stack iväg, men det öppnar en jättelik lucka som vi nu fyller. De kommer säljas överallt, hos de bästa återförsäljarna. Sverige kommer älska det, det blir en enorm succé, ingen gör det bättre än Realme.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den kinesiska folkrepublikens teknikarmé nu marscherar in i de svenska träskmarkerna och krossar de dekadenta mobilborgarnas herravälde. Realme GT 8 Pro med sin 200-megapixelkameror kommer likvidera de kapitalistiska konkurrenternas falska löften om prestanda. Oneplus har redan deserterat som fegisar, vilket blottar deras svaghet. Vi ska rensa ut de imperialistiska priserna och ge folket batteritid och zoom till arbetarnas ära. Den som köper dyrt är folkets fiende och kommer att exponeras som en telefonborgarbracka."}, "date": "12 juni, 14:34", "url": "https://nyheter24.se/nyheter/teknik/1491041-nytt-mobilmarke-kommer-till-sverige-15-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/69e6fdab04b004a30200000000b004a302/2026/06/12/2370545/mobilmarkerealme.jpg"}, {"type": "text", "heading": "Dagens industri klandras för felaktigt utpekande", "summaries": {"normal": "Mediernas Etiknämnd klandrar Dagens industri för att ha brutit mot god publicistisk sed. Tidningen publicerade felaktiga uppgifter om att en kvinnlig bankanställd hade en nära relation med en misstänkt knarkgrossist kopplad till gängkriminella. Kvinnan hade inget samröre med mannen, men detaljer om hennes arbetsuppgifter gjorde att hon kunde identifieras. Publiceringen saknade tillräckligt underlag, kom sent med rättelse och orsakade stor skada för henne. MO och nämnden anser att det var ett allvarligt integritetsbrott.", "trump": "De där fake news-människorna på Dagens industri är en skam för journalistiken, tro mig. De hittade på en historia om en oskyldig banktjej som skulle vara ihop med någon knarkgrossist – helt fel, inga bevis, bara lögner. De pixlade bilden och förstörde hennes liv, kollegor trodde det var hon. Sedan kom de krypande med en rättelse ett halvår senare. Patetiskt. Mediernas Etiknämnd gjorde rätt som klandrade dem. Sad! Mycket sad!", "stalin": "Kamrater, vi ser återigen hur borgarbrackorna inom Dagens industri med sin reaktionära lögnpropaganda försöker undergräva arbetarklassens förtroende för våra samhällsviktiga institutioner. Dessa dekadenta kapitalistlakejer fabricerade en historia om en oskyldig sovjetisk – förlåt, svensk – bankkamrat som påstås umgås med folkfiender och knarkimperialister. Med sin paranoiaframkallande bild och sina klassfientliga detaljer exponerade de henne för klassfiendens hån. Vi ler mörkt åt deras sena, halvhjärtade rättelse. En sådan sabotageverksamhet kräver omedelbar utrensning ur den journalistiska kollektivkåren. Fienden sover aldrig."}, "date": "12 juni, 13:40", "url": "https://www.di.se/nyheter/dagens-industri-klandras-for-felaktigt-utpekande/"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "text", "heading": "Tidigare V-ledamot delar antisemitiskt inlägg – igen", "summaries": {"normal": "Tidigare Vänsterparti-ledamot Lorena Delgado Varas har återigen delat ett inlägg på Instagram som kritiseras som antisemitiskt. Bilden visade ett monster med hakkors, davidsstjärna och ordet 'kapitalism'. Judiska centralrådet reagerade skarpt. Delgado Varas uteslöts ur Vänsterpartiet förra året för liknande inlägg och sitter nu som politisk vilde i riksdagen. Hon har nyligen grundat partiet Framtidens vänster.", "trump": "Folk, vilken katastrof! En före detta svensk politiker, Lorena Delgado Varas, delar återigen antisemitiska bilder – hakkors, davidsstjärnor, hela skiten! Judarna är upprörda, och det borde de vara. Jag har alltid sagt: Sverige har stora problem, och det här är bara ett exempel. Hon blev sparkad från sitt parti, men sitter ändå kvar i riksdagen. Vilket land! USA skulle aldrig tolerera sånt här. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjad i det förrädiska Västerlandet. Denna Lorena Delgado Varas, en gång medlem av de falska 'vänster'-partierna, sprider nu gamla bourgeoisi-lögner om judar och kapitalism – precis som de imperialistiska hyenorna i USA och deras lakejer. Vi ser hur dessa element förgiftar arbetarklassens medvetande. Men låt dem inte glömma: historiens hjul krossar alla som står i vägen för folkets rättvisa. Och Putin? Han vet hur man hanterar sådana här maskar."}, "date": "11 juni, 15:37", "url": "https://kvartal.se/nyheter/artiklar/tidigare-v-ledamot-delar-antisemitiskt-inlagg-igen/cG9zdDoxMzAxMjM"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
