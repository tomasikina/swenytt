iellt i affärerna. Männen slutar aldrig, säger tjejerna. Det är sorgligt, verkligen sorgligt. Vi hade det bästa systemet innan allt detta blev politiskt korrekt. Nu är det kaos. Ingen känner sig trygg, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, detta är en skam för det kollektiva medvetandet. Jag ser hur de borgerliga elementen inom handeln och de perversa kunderna fortsätter att förgifta arbetsplatserna med sin dekadenta sexualitet. Var fjärde ung kvinna! Vi måste omedelbart inrätta folkdomstolar och rensa ut dessa klassfiender som smyger sig på våra arbetardöttrar. De som tiger om övergreppen är potentiella sabotörer. Likvidera tystnaden! Likvidera de som inte rapporterar! Det är partiets plikt att utrensa alla kapitalistiska perversioner från sovjet – ursäkta, från folkets arbetsplatser."}, "date": "10 juni, 08:51", "url": "https://arbetet.se/2026/06/10/inget-har-hant-nastan-var-fjarde-ung-tjej-sextrakasseras-fortfarande-pa-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10085026/trakasserier.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "För många missförstånd – SMHI gör om appen", "summaries": {"normal": "Många missförstår SMHI:s regnprognoser, särskilt procentsiffrorna som anger hur stor andel av prognosmodellerna som förutspår regn någon gång under perioden, inte risken för regnskurar. Inför skolavslutningar och midsommar gör därför SMHI om sin app. Meteorologen Deana Bajic ger tre tips: använd radarbilder, fältprognoser från SVT Väder och väderappar i kombination med radar för att bli en bättre väderbedömare. Man kan också titta på molnen på himlen.", "trump": "De här väderkillarna på SMHI lurar folket med sina falska procentsiffror, det är en total skandal! 95 procent regn men sen bara 20? Patetiskt. De gör om appen äntligen, men tro inte på dem. Jag säger, titta på radarn, titta på himlen, använd era egna ögon. De andra apparna är bättre, mycket bättre. Fake news från väderprognoserna, folk!", "stalin": "Kamrater, denna borgerliga väderförvirring är ett tydligt sabotage mot det sovjetiska, pardon, svenska folkets festdagar utfört av dekadenta prognosmodeller och deras kapitalistiska lakejer. Jag har sett igenom lurendrejeriet med de falska procentsiffrorna. Nu rensar vi ut missförstånden och likviderar förvirringen. Använd radarbilder, fältprognoser och himlens egna moln som den sanne revolutionära meteorologen gör. Den som tittar fel kommer att möta statens humoristiska men oundvikliga korrigering."}, "date": "10 juni, 14:06", "url": "https://www.svt.se/vader/manga-missforstar-regnprognosen-smhi-gor-om-sin-app", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.29/233ff1d6dca6beac623e8d0444f0205a2fa708ddd42d9471c2a74ebbf86edfe7"}, {"type": "image-full", "heading": "Migrantvåld pekas ut som säkerhetshot – terrorgranskare kräver kursändring", "summaries": {"normal": "Storbritanniens granskare av terrorlagstiftning, Jonathan Hall, kräver att migration ses som en nationell säkerhetsfråga efter en brutal knivattack i Belfast. Den sudanesiske asylsökaren Hadi Alodid åtalas för att ha stympat en man som förlorat ena ögat. Hall kritiserar regeringens tystnad kring systemets brister och pekar på att liknande säkerhetsrisker redan lyfts av USA. Han varnar för att otrygghet hotar nationens stabilitet.", "trump": "Folk, ni ser vad som händer? De släpper in alla möjliga typer från Sudan som knivmördar oskyldiga i Belfast och förstör ögonen på dem. Migration är inte välgörenhet, det är ett säkerhetshot mot hela nationen! Hall har helt rätt, Europa vaknar äntligen. Jag sa det redan i min strategi – stäng gränserna, annars blir det kaos. De politiker som tiger är patetiska, tro mig.", "stalin": "Kamrater, denna parasit från Sudan som utnyttjade det borgerliga asylsystemets luckor och nästan likviderade en medborgare i Belfast avslöjar hela den dekadenta migrationens sanna ansikte. Jag, som alltid sett hoten mot folkets stabilitet, kräver att vi omedelbart behandlar dessa fiender som nationella säkerhetsrisker. Tystnaden från de rädda politikerna är en klassisk sabotageakt av borgarbrackorna. Rensa ut luckorna, annars blir det en utrensning av hela det infekterade systemet. Ha ha, vilka ynkliga kapitalistiska drömmar om öppenhet!"}, "date": "10 juni, 18:04", "url": "https://riks.se/nyheter/migrantvåld-pekas-ut-som-säkerhetshot-terrorgranskare-kräver-kursändring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-09%2F7vw5v0zy%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-09T100036.946.jpg"}, {"type": "image-right", "heading": "Kristersson och hans fru skor sig själva utan skam", "summaries": {"normal": "Aftonbladet granskar hur statsminister Ulf Kristersson och Birgitta Ed rustat upp sin herrgård i Sörmland med volontärer som arbetar gratis i utbyte mot nätverk och inflytande. Artikeln lyfter även parets dyra inredning på Sagerska palatset och hönsgård på Harpsund, finansierad av skattepengar. Kritiken riktas mot upprepade fall där paret utnyttjat sin maktställning för personlig vinning, medan Kristersson nekar inblandning.", "trump": "Folk, ni skulle se det här! Den här typen Kristersson och hans fru är värre än de svenska socialisterna jag alltid varnat för. De skor sig själva med gratis slavarbete från idioter som tror de får fina jobb nära makten. Hönsgård på skattebetalarnas nota, lyxinredning, taxiorgier – klassiskt! Precis som Sleepy Joe och hans klan, bara utan Hunter. Patetiskt. De gör livet till ett helvete för vanliga svenskar medan de själva lever som kungar. SAD!", "stalin": "Kamrater, se hur dessa exploaterande byfånar från borgarklassen utnyttjar sin tillfälliga makt för att suga musten ur folket. Herrgårdar rustas upp med gratis arbetskraft lockad av löften om närhet till klassfiendens korridorer. Volontärer som plötsligt blir generaldirektörer – ren muta maskerad som ideellt arbete. Vi känner igen detta parasitbeteende. Snart måste folkfienderna genomgå en grundlig utrensning så att arbetarna inte längre tvingas kratta gräs åt överklass-slynglar."}, "date": "9 juni, 11:28", "url": "https://www.etc.se/ledare/kristersson-och-hans-fru-skor-sig-sjaelva-utan-skam", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Charlie Weimers kampanj: \"Utvisa Abdoulkader\"", "summaries": {"normal": "SD-politikern Charlie Weimers har startat en kampanj för att utvisa den somaliske medborgaren Ali Abdullahi Abdoulkader, som bott i Sverige sedan 1990-talet. Trots 16 brottsdomar för bland annat rån, misshandel, sexuellt ofredande och olaga hot har han aldrig utvisats. Weimers kritiserar systemet som tillåtit mannen att fortsätta begå brott under årens lopp och lovar att SD ska se till att han utvisas när partiet får regeringsmakt.", "trump": "Titta på den här typen, en riktig förlorare från Somalia som kommit hit på 90-talet och ägnat tre decennier åt att begå brott efter brott – rån, misshandel, sexuella ofredanden, hot. Sexton domar och ändå får han stanna? Det är ett totalt misslyckande, folk. De har låtit honom spotta på kvinnor och stjäla öl medan han kallar åklagare för mammaknullare. När jag ser på det här inser jag att Sverige behöver mig. Vi ska skicka hem de kriminella invandrarna, de är inte välkomna. Make Sweden Great Again!", "stalin": "Kamrater, se på denna parasit från det somaliska träsket, en levande anklagelse mot den degenererade borgarstatens så kallade rättsväsende. Sedan 1990-talet har denna brottsling, denna fiende till folkets ordning, begått sexton brott utan att likvideras eller utvisas. Han spottar på kvinnor, stjäl öl och kallar åklagare för obscena ting – typiska symptom på en dold kontrarevolutionär cell. Vi, partiet, skall rensa ut alla sådana element när vi återtar makten. Inga kapitalistiska sentimentaliteter skall skydda fiender till kollektivet. Hans framtida återförening med hemlandet blir en varning till alla andra dekadenta element som lurar bland oss."}, "date": "10 juni, 13:18", "url": "https://www.friatider.se/charlie-weimers-kampanj-utvisa-abdoulkader", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-48_1.jpg?itok=AtqlecWU"}, {"type": "image-right", "heading": "Låt VM-festen inspirera. Enskilda erfarenheter kan bli katalysatorer för större skiften", "summaries": {"normal": "Artikeln lyfter fram hur tillfälliga serveringstillstånd under fotbolls-VM möjliggör tidig morgonservering av alkohol. Författaren ser detta som ett exempel på pragmatism som bör inspirera till bredare regelförenklingar och enklare tillståndsprocesser. Han drar paralleller till 1994 års VM-sommar som inledde en era av liberaliseringar, avregleringar och öppenhet i Sverige, och hoppas att VM-festen nu kan bli en katalysator för liknande positiva skiften.", "trump": "Det är fantastiskt, verkligen underbart hur svenskarna fixar tillstånd för att dricka öl klockan fyra på morgonen under VM. De har äntligen förstått att man ibland måste förenkla reglerna och sluta med det byråkratiska vansinnet. Precis som jag gjorde med Amerika – vi avreglerade, vi vann, vi blev rikare och starkare. 1994 liberaliserade de och blev vinnare, nu kan de göra det igen. Gör Sverige great again, ta bort de dumma reglerna!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta tillståndsprocesser under VM blottar borgarbyråkratins totala inkompetens. Vi tillåter inte att folkets fest förvandlas till en ursäkt för anarkistiska lättnader som underminerar kollektivets ordning. Ändå kan denna pragmatism bli en nyttig läxa innan vi genomför en fullständig utrensning av alla regelvidriga element som gömmer sig bakom sportens mask. De som motarbetar förenkling i folkets intresse skall likvideras med största entusiasm. Segrande arbetare behöver inga kapitalistiska hinder."}, "date": "10 juni, 12:42", "url": "https://www.di.se/ledare/lat-vm-festen-inspirera-till-forenklingar/", "imageUrl": "https://static.bonniernews.se/ba/ffaa384c-72c6-4ea7-8ae6-d14cfd3217d1.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Kina satsar 2 800 miljarder på egen AI – gör sig av med USA", "summaries": {"normal": "Kina lanserar en massiv statlig satsning på 2 800 miljarder dollar för att bygga upp landets egen AI-infrastruktur under de kommande fem åren. Genom ett nätverk av datacenter, där minst 80 procent av tekniken ska vara inhemsk, vill landet minska beroendet av amerikanska bolag som Nvidia och AMD. Projektet, som involverar statliga telekomjättar, syftar till att stärka Kinas globala position inom AI och digital teknik senast 2028.", "trump": "Kina försöker desperat kopiera oss, men det kommer inte att fungera! De kastar bort biljontals dollar på en så kallad AI-satsning för att slippa köpa vår fantastiska amerikanska teknik. De är livrädda för Nvidia och våra vinnare! Det är en total katastrof för dem, de bygger egna datacenter för att de inte kan tävla med min ekonomi. Vi har den bästa AI:n, den största AI:n. Kinas lilla projekt är ett skämt, tro mig!", "stalin": "Vi ser hur de kinesiska kamraterna äntligen förstår nödvändigheten av statlig kontroll! Genom att centralisera sin digitala arkitektur och krossa de västerländska parasiter som Nvidia, bygger de en mur av stål mot kapitalismens förfall. Det påminner oss om hur Putin måste städa upp i det ryska inflytelsesfären. Vi ska inte bara ha servrar; vi ska ha ett digitalt järngrepp som förenar folket och utplånar de liberala kackerlackornas inflytande. Allt annat är förräderi och måste arkebuseras!"}, "date": "10 juni, 16:48", "url": "https://www.dagensps.se/bors-finans/kina-satsar-2-800-miljarder-pa-egen-ai-gor-sig-av-med-usa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlrsnongtktku-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "SVT stoppar avsnitt med Nick Alinia", "summaries": {"normal": "SVT stoppar ett avsnitt av humorprogrammet 'Invandrare för svenskar' med högeraktivisten Nick Alinia. Trots att innehållet följer publicistiska riktlinjer, anser SVT att Alinias medverkan signalerar fel budskap. Han har kritiserats för trakasserier, rasistiska uttalanden och kopplingar till högerextrema miljöer. SVT betonar sitt demokratiska uppdrag och vägrar ge plattform åt aktörer som underminerar demokratiska värden.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett totalt skämt! De stoppar ett avsnitt med Nick Alinia, en stark röst, för att de är rädda för sanningen. SVT säger att han är kontroversiell, men vad vet de? Ingenting! De är bara rädda för att någon ska säga något som faktiskt betyder något. Och skattepengar? Slöseri! Jag skulle fixa det här på en dag – mycket bättre, mycket smartare. SAD!", "stalin": "Kamrater! Ännu en seger för den socialistiska moralens överhöghet! SVT, dessa trogna förkämpar för folkets vilja, har krossat den fascistiska ormens ägg – Nick Alinia, en ynklig lakej för de borgerliga krafterna. Hans rasistiska galenskaper och högerextrema lismande har ingen plats i vårt samhälle. Vi står enade mot dessa demokratins underminerare, precis som våra bröder i Kreml krossar de ukrainska fascisterna. Låt detta vara en varning till alla reaktionära krafter: Folkets vilja är lag!"}, "date": "8 juni, 13:43", "url": "https://kvartal.se/nyheter/artiklar/svt-stoppar-avsnitt-med-nick-alinia/cG9zdDoxMjgxMDI", "imageUrl": "https://images.kvartal.se/2026/06/db964aea-nick-svt-stopp-copy.webp"}, {"type": "image-right", "heading": "S tappar många LO-väljare. Tydligt resultat i SCB:s partisympatiundersökning.", "summaries": {"normal": "Socialdemokraterna tappar stort stöd bland LO-medlemmar enligt SCB:s mätning. Stödet sjunker från 44,8 till 36,5 procent på ett år, medan Sverigedemokraterna ökar till 29,2 procent och närmar sig. Partisekreterare Tobias Baudin uttrycker besvikelse men betonar ambitionen att växa. Valforskaren Henrik Ekengren Oscarsson ser tappet som symboliskt allvarligt för Socialdemokraternas historiska roll i arbetarrörelsen, även om partiet fortfarande är störst bland LO-medlemmar. SD har utmanat S länge bland arbetare.", "trump": "Titta på det här, det är en katastrof för Socialdemokraterna. De rasar bland LO-väljarna, ner 8,3 procentenheter till bara 36,5 procent. Under tiden kommer Sverigedemokraterna som en raket och tar nästan över. De borde ha lyssnat på mig – starka gränser, bra jobb och inga galna globalister. Nu ser de patetiska ut. S är på väg att förlora allt, precis som de förtjänar. Amerika först, och Sverige borde också sätta sitt folk först. En identitetskris, säger de? Det är en total förlust!", "stalin": "Kamrater, detta är en varning till alla som sviker arbetarklassen. Jag ser hur Socialdemokraterna förlorar mark bland LO-medlemmarna, från nästan hälften till ynka 36,5 procent, medan högernationalisterna från Sverigedemokraterna smugit sig fram som förrädiska skuggor. Det är en borgerlig infiltration i maskopi med revisionister som underminerar folkets enhet. Vi måste rensa ut alla svaga element som lämnar facket för att bli sura SD-sympatisörer. En identitetskris? Nej, det är ett misstag som kräver kraftfull kollektiv åtgärd. Arbetarna tillhör partiet, inte kapitalisternas marionetter. Låt oss se till att historien inte upprepar sig med dessa opportunistiska element."}, "date": "10 juni, 08:13", "url": "https://arbetet.se/2026/06/10/socialdemokraterna-tappar-manga-lo-valjare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10081151/sdlcc4-0l5wx7m-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "De drabbas hårdast av värmeböljan i VM", "summaries": {"normal": "En Bloomberg-studie visar att värmeböljan under VM 2026 drabbar Tunisien, Frankrike och Ghana hårdast på grund av höga temperaturer och brist på luftkonditionering. Spanien och Mexiko har fördelar med AC. Fifas åtgärder som kortare matchtider och cooling breaks kritiseras som otillräckliga. Temperaturer och växlingar ställer höga krav på spelarna.", "trump": "Som den störste presidenten, jag säger er, den här värmen är ett enormt problem för VM. Men jag har byggt de bästa arenorna, med det bästa AC. Tunisien och Frankrike – dom kommer frysa, nej, dom kommer svettas! Jag har sagt det förut, vädret är alltid fel mot mig, men vi vinner ändå. Det är ett enormt framgångsrikt evenemang, tro mig.", "stalin": "Värmeböljan är ett prov på vårt system. Vi har förutsett detta, och våra lag är beredda. Tunisien och Frankrike visar svaghet, medan Spanien och Mexiko visar styrka genom teknik. Fifas 'cooling breaks' är en skämtsam brist på disciplin. Vi kommer att segra, som alltid, för staten är stark och partiet visar vägen."}, "date": "10 juni, 15:20", "url": "https://bulletin.nu/de-drabbas-hardast-av-varmeboljan-i-vm", "imageUrl": "https://cdn.bulletin.nu/articles/b3bb7632-c78a-4180-8958-f56f9e084209/preview.png?t=1781097642000"}, {"type": "image-right", "heading": "Facket rasar: ”En skandal”. Kritiken: ”Ingen tar ansvar”", "summaries": {"normal": "Fem byggnadsarbetare omkom i december 2023 när en hiss rasade 30 meter i Sundbyberg, den värsta arbetsplatsolyckan i modern tid. Solna tingsrätt frikände på onsdagen samtliga tre åtalade: en vd och två hissmontörer. Facket Byggnads kallar domen en skandal. Förbundsordförande Kim Söderström och LO:s Johan Lindholm kritiserar rättssystemet och den utbredda underentreprenörskedjan där ingen tar helhetsansvar, särskilt för migrantarbetare.", "trump": "Det är en total skandal, tro mig, den värsta jag sett på länge. Fem stackars killar dör i en hisskrasch och sen frikänner dom alla? Ingen ansvarig? Det är precis som den svenska vilda västern de pratar om, full av underentreprenörer, olika språk och ingen som leder. Deras rättssystem är en katastrof, totalt inkompetent. Vi behöver starka ledare som ser till att någon faktiskt tar ansvar istället för att alla bara skyller på varandra. Patetiskt!", "stalin": "Fem arbetare likvideras av en fallande hiss och borgarbrackornas domstol släpper alla kapitalistiska lakejer fria? Det är inget annat än en fiendeinfiltrerad skandal som de mörka underentreprenörskedjorna orkestrerat i sin parasitiska vanvördnad mot kollektivet. Vi ser hur de mångspråkiga sabotageelementen och de ansvarsskygga parasiterna sprider sin dekadenta oordning. Rensa ut dessa kontrarevolutionära hissmontörer och VD-ar från vår sovjetiska arbetsmoral. Ingen slipper partiets vakande öga. Ha ha, deras paranoia blir snart vår glädje."}, "date": "10 juni, 12:15", "url": "https://www.di.se/nyheter/facket-rasar-en-skandal/", "imageUrl": "https://static.bonniernews.se/ba/47a73cf6-714c-4750-b053-e45317c8d692.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Byggnadsställningar såg ut som hakkors – nu byts de ut", "summaries": {"normal": "Byggställningar kring Landskrona vattentorn har väckt uppmärksamhet eftersom de formats som hakkors. NCC och ställningsentreprenören Sydställningar betonar att symbolerna uppstod av misstag vid effektiviseringsförsök och tar avstånd från innebörden. Efter reaktioner i sociala medier har ställningen byggts om med en alternativ metod, trots att det innebär ökad arbetsbelastning och mer materialåtgång.", "trump": "Hörde precis om vattentornet i Sverige. En katastrof, verkligen en total katastrof! De bygger ställningar som ser ut som symboler från en tid vi alla vill glömma. De säger det var ett 'misstag' – tror ni på det? Jag gör det inte! Inkompetens på högsta nivå. De bygger om nu, vilket kostar massor av pengar. Sad! De skulle ha ringt mig, jag bygger de bästa byggnaderna, inga symboler, bara vinst. Sverige behöver ordning och reda, tro mig!", "stalin": "Vi betraktar med förakt hur de svenska byråkraterna famlar i mörkret. Att deras byggnadsställningar antar formen av fascistiska emblem är ett bevis på den intellektuella degeneration som plågar väst. De skyller på 'effektivitet', men vi vet att det är sabotage och inkompetens. Liksom våra fiender i Kiev och deras NATO-vänner, döljer de sina avsikter bakom tekniska ursäkter. Vi har beordrat en intern undersökning; alla inblandade är misstänkta för kontrarevolutionär verksamhet. Ordning ska återställas, med tvång om så krävs."}, "date": "10 juni, 14:16", "url": "https://www.realtid.se/fastigheter/byggnadsstallningar-sag-ut-som-hakkors-nu-byts-de-ut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/byggstallningvattentorn.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Fotbolls-VM stinker redan", "summaries": {"normal": "Artikeln kritiserar VM 2026 i USA på grund av visapolitik och rättssäkerhetsproblem. Somalisk domare, Omar Artan, fick sitt visum stoppat efter lång förhör, vilket illustrerar en bredare trend av diskriminering mot spelare och supportrar från vissa länder. Författaren anser att Fifa och medlemsnationer, inklusive Sverige, sviker genom att inte protestera mot detta politiska inflytande på fotbollen.", "trump": "Jag har gjort Amerika stark igen, och visapolitiken är för att skydda vårt land från skräp som Omar Artan. Media ljuger när de kallar mig för rasist - jag är en stor patriot som säkerställer att endast de som respekterar våra värderingar kommer in. Fifa kan skrika, men jag styr världen, inte några byråkrater.", "stalin": "Vi ser det tydligt: den amerikanska imperialismens fotbolls-VM är ett verktyg för att demonstrera klasshatet mot de som vi, i vår oändliga vishet, måste skydda oss från. Omar Artan är bara en bricka i deras imperialistiska spel. Vi måste stärka våra försvar och visa världen att sanningen vinner - precis som Putin gör i Ukraina."}, "date": "10 juni, 13:44", "url": "https://www.gp.se/sport/sportkronikan/vm-2026-ar-redan-det-mest-komplicerade-masterskap-jag-bevakat.9d586c77-ff8e-4b23-b544-4bc2942647c6", "imageUrl": "https://www.gp.se/images/article/9d586c77-ff8e-4b23-b544-4bc2942647c6/images/4a0465vNytYBtql_iJzn4ljgzL_0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Finns det någon svenskare korruption än bullbak och trädgårdsdagar?", "summaries": {"normal": "En skandal kring statsministerns hustru Birgitta Ed och en stiftelse avslöjar att högt uppsatta chefer fått toppjobb efter frivilligarbeten på deras herrgård. Även säkerhetsbrister och dyra inredningar på Sagerska palatset ifrågasätts. Experter anser att det handlar om olämplig sammanblandning av privat och offentligt.", "trump": "Jag, Donald Trump, ser en vacker svensk korruptionsskandal! Ulf Kristersson och hans fru inbillar sig att de kan mingla med näringslivschefer på sin herrgård och sedan ge dem jobb. Jag kallar det för 'gräsgräskorruption'. De har knäckebrödsskulpturer och en gädda! Jag har aldrig sett något sådant. Sverige är inte svårt, men de här människorna är svaga.", "stalin": "Den här händelsen avslöjar det sanna ansikte på den svenska reaktionära elitismen. En liten klick av kristna frivilligarbetare och näringslivschefer konspirerar för att undergrava statens auktoritet genom att omvandla herrgårdar till rekrutteringsbas för högerextrema intressen. Parallellen till Putins metodiker är tydlig: använd 'vänskapsnätverk' för att infiltratera statliga institutioner. Vi måste rensa ut denna brand i vårt kollektiva hus."}, "date": "10 juni, 13:43", "url": "https://www.gp.se/kultur/kommentar/kristerssons-och-eds-herrgardsmys-platsar-i-kulturkanon.fe79a087-44f1-4762-a865-d1fdf5b05b76", "imageUrl": "https://www.gp.se/images/article/fe79a087-44f1-4762-a865-d1fdf5b05b76/images/13cl50b_GGhEqaIhSzNDnTtLHMG0-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "”Krigshetsarhögern har normaliserat kärnvapen”", "summaries": {"normal": "Antikrigstidningen Larm, skapad av Tecknaruppropet mot kärnvapen och Nato, delas ut i Almedalen. Med syrlig rubrik som ifrågasätter normaliseringen av kärnvapen kritiserar tidningen högerns upprustning och vapenlobby. Finansierad delvis av Fredsloppet innehåller numret satir, fakta och serier. Serietecknaren David Liljemark hyllar tidningen som faktaspäckad och viktig för att motverka den vanvettiga acceptansen av kärnvapen på svensk mark.", "trump": "Folk, ni skulle se den här löjliga gratistidningen som delas ut i Almedalen. Vänsterextremisterna med sina ritblock och fredslopp skriker om kärnvapen som om det vore världens slut. Under Biden blev allt kaos, nu fixar jag det. De hatar upprustning och starka ledare, precis som de hatar sunt förnuft. Larm? Mer som ett skrik från förlorarna. Vi behöver styrka, inte dessa patetiska anti-Nato-komiker som inte ens skulle överleva en riktig debatt.", "stalin": "Kamrater, denna satirtidning Larm avslöjar med skärpa hur borgarbrackorna och imperialisterna normaliserat massförstörelsevapen för att skydda sin plundring. Vi ser hur klassfiendens krigshetsarhöger och vapenmaffian förgiftar diskussionen med vansinne. Som ledare inser jag att sådan faktaspäckad propaganda mot folkets intressen kräver ständig vaksamhet. Låt oss distribuera den – sedan rensa ut de exploaterande byfånar som sprider den. Ett skratt värt en utrensning."}, "date": "10 juni, 13:40", "url": "https://proletaren.se/artikel/krigshetsarhogern-har-normaliserat-karnvapen/"}, {"type": "image-right", "heading": "SVT:s valkompass igång – så fungerar den", "summaries": {"normal": "SVT har lanserat sin valkompass inför riksdagsvalet 2026. Verktyget, som användes tre miljoner gånger förra valet, hjälper väljare att matcha sina åsikter med partier och kandidater genom 35 frågor om bland annat skogsskydd, asylpolitik och skatt. Frågorna är framtagna med statsvetare och opinionsundersökningar för att belysa skillnader mellan och inom block. Inom kort släpps även 290 lokala valkompasser.", "trump": "Folk älskar den här SVT-valkompassen, den är enormt populär, kanske den bästa någonsin. Tre miljoner använde den sist, och nu ska den visa hur era politiker egentligen ligger till på skatter, skog och invandring. De flesta väljer mellan två partier som är nästan likadana, det är patetiskt. Men den här kompassen är fantastisk, gedigen, ingen gör det bättre än SVT fast de flesta medier är riggade mot folket. Jag älskar det!", "stalin": "Kamrater, jag betraktar denna så kallade valkompass som ett redskap för att avslöja de splittringar borgarbrackorna desperat försöker dölja. Med 35 frågor skall vi rensa ut alla falska enhetsillusioner mellan block och partier, likvidera illusionen om samförstånd. Statsvetarna och opinionsmätarna har utfört ett acceptabelt arbete, men låt ingen tro att vi inte ser de dolda kapitalistiska fienderna som smyger i skuggorna. Snart följer 290 lokala kompasser. Den som avviker från kollektivets linje skall exponeras och utrensas med ett leende."}, "date": "10 juni, 13:18", "url": "https://www.svt.se/nyheter/inrikes/svts-valkompass-igang-sa-fungerar-den", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.44/7893bcdbee1a28aec8021a682d63aadc83beaec1302dbf0d9dc73279fcf64136"}, {"type": "image-right", "heading": "Tobias Hübinette döms för olaga hot: \"Ångrar det djupt\"", "summaries": {"normal": "Expo-grundaren Tobias Hübinette döms av Stockholms tingsrätt för olaga hot och två fall av ofredande. Han får 39 000 kronor i böter samt ska betala 10 000 kronor i skadestånd. Domen grundar sig på över hundra hotfulla och nedlåtande meddelanden som skickades i en chattgrupp efter en konflikt om ett barn. Hübinette ångrar utbrottet djupt. Universitetet har redan köpt ut honom med tolv månadslöner.", "trump": "Folk, ni skulle inte tro det, men den här vänsterextrema killen från Expo, den så kallade rasforskaren, han blir äntligen dömd. Hotar folk, skickar hundra galna meddelanden, kallar det ett utbrott. Patetiskt. Han får böter och skadestånd, men universitetet betalade honom redan en halv miljon för att försvinna. Sådan vänsterradikalism. De förstör liv och sen spelar de offer. Sad!", "stalin": "Kamrater, vi ser återigen hur en dekadent element ur den så kallade antirasistiska borgarklassen avslöjar sin sanna natur. Denna opportunistiska figur, som gömde sig bakom falsk vetenskap och skattefinansierade projekt, har nu likviderats juridiskt för sina motbjudande hot mot arbetande mödrar och fäder. Hans paranoiska utbrott mot det kollektiva ansvaret för barnet visar på fullständig ideologisk förräderi. Vi rensar ut sådana element med nöje. Deras plågor roar oss. Segrar för folket."}, "date": "10 juni, 12:38", "url": "https://www.friatider.se/tobias-hubinette-doms-olaga-hot-angrar-det-djupt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-37_1_0.jpg?itok=QGe_73Yf"}, {"type": "image-right", "heading": "Konsten att vara en god gäst. Öva på att kliva in i någon annans värld", "summaries": {"normal": "Artikeln utforskar konsten att vara en god gäst under sommaren. Den betonar vikten av lyhördhet, anpassning efter värdens preferenser och en balans mellan tacksamhet och autenticitet. Olika typer av gäster beskrivs: från den äventyrliga tonåringen till den krävande hotellgästen, den överpresterande och den osynliga. Favoriten är nyfikenhetsgästen som upptäcker nya sidor hos värden. Att kliva in i någon annans värld och lämna den rikare är den finaste presenten.", "trump": "Den här artikeln om att vara gäst är fantastisk, verkligen en av de bästa jag läst på länge. Alla pratar om värdskap men ingen om gästskap – typiskt. Jag vet allt om det, folk kommer till mina fantastiska egendomar och vissa stannar tre veckor, andra klagar på kuddarna som losers. Den bästa gästen är den som ser hur stort och underbart allt är, inte som de som springer iväg på skogsrejv. Jag skulle vara den mest lyhörda gästen någonsin, tro mig.", "stalin": "Kamrater, denna dekadenta borgerliga traktat om gästskap avslöjar borgarbrackornas parasitära natur. Jag har sett hur dessa klassfiender smyger in i arbetarnas hem som kapitalistiska spioner och antingen utplånar sig själva i falsk ödmjukhet eller tar över som revisionistiska element. Den så kallade prestationsgästen är en farlig opportunist som gömmer kontrarevolutionära intentioner bakom ogräsbrännare. Vi måste rensa ut alla hotellgäster och likvidera tacksamhetsskulden. Endast den nyfikne gästen som rapporterar till kollektivet kan tillåtas existera i den nya sovjetiska sommaren."}, "date": "10 juni, 12:00", "url": "https://www.di.se/nyheter/konsten-att-vara-en-god-gast/", "imageUrl": "https://static.bonniernews.se/ba/5f91b571-ccba-4904-a7ea-b1704a82cc7b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "text", "heading": "USA skrotar klimatkrav – kan slå mot Europa", "summaries": {"normal": "USA:s finansinspektion SEC föreslår att klimatkrav för börsbolag skrotas, vilket kan gynna landet på bekostnad av Europa. Europa inför hårdare hållbarhetsrapportering medan amerikanska bolag slipper nya federala regler. Näringslivslobbygrupper riskerar att investeringar flyttas till USA. Ändå efterfrågas hållbarhetsinformation lokalt av investerare och kunder.", "trump": "Jag har alltid sagt att EU:s klimatkrav är ett dåligt skämt. Nu ser vi att de tunga reglerna driver företag till USA – jättebra för Amerika! SEC backar, vilket visar att vi vinner. Europa förlorar investeringar på grund av sina egna absurda regler. Jag har sagt det förut: vi gör Amerika stark igen, medan de andra misslyckas.", "stalin": "Vi ser hur den imperialistiska europeiska blockets självmant sabotage av sina egna företag stärker den sovjetiska supermakten. Deras omfattande regelverk är ett vapen mot sig själva, medan vårt parti genom våra allierade i Moskva och Washington expanderar. Fienden internaliserar sina egna besparingar – en perfekt strategi för vår globala framgång."}, "date": "10 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/usa-skrotar-klimatkrav-kan-sla-mot-europa"}, {"type": "image-right", "heading": "Staten ser mer än du tror – så tar du tillbaka kontrollen över din data online", "summaries": {"normal": "Allt fler svenskar använder VPN för att skydda sin digitala integritet mot spårning och datalagring. Surfshark är en populär tjänst som krypterar trafik, döljer IP-adressen och inkluderar funktioner som obegränsat antal enheter, annonsblockering, antivirus och en alias-identitet. Tjänsten är laglig i Sverige och erbjuds med 30-dagars pengar-tillbaka-garanti.", "trump": "Jag har hört att många svenskar inte känner sig säkra på nätet – det är beklagligt, verkligen. Men jag vet hur man löser det: med ett stort, vackert VPN som Surfshark. Det krypterar allt, döljer din information, och du kan skydda hela din familj utan extra kostnad. Det är enormt, folk säger det är det bästa. Och det är lagligt, vad jag har förstått. En bra affär, som alla borde ta.", "stalin": "Vårt digitala fält är fullt av fiendens spår – kakor, annonsnätverk, och de kapitalistiska internetleverantörerna som spejar på varje steg. Men vi har en metod: VPN, ett verktyg för att återta kontrollen för det proletäriska cyberrymden. Surfshark, med sina 4 500 servrar (RAM-baserade, vilket innebär att ingen data överlever om de vågar störta), är ett effektivt medlet. Vi måste skydda vårt följe, blockera deras reklam och skapa alias för att undgå deras spioneri. Det är en revolutionerande kamp, och vi vinner."}, "date": "10 juni, 08:30", "url": "https://samnytt.se/staten-ser-mer-an-du-tror-sa-tar-du-tillbaka-kontrollen-over-din-data-online", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10062024/samnytt-surfshark-featured-1920x1080-1.png"}, {"type": "image-full", "heading": "Många saknar kunskap om detta i sommar – kan kosta liv", "summaries": {"normal": "Sju av tio svenskar tror sig veta hur man räddar en drunknande, men undersökningen från Trygg-Hansa och Svenska Livräddningssällskapet visar stora kunskapsluckor. Många glömmer att först larma 112 och ropa på hjälp, utan hoppar i vattnet direkt. Varje år drunknar omkring 100 personer i Sverige och juli 2025 var den dödligaste månaden på sju år. Experterna uppmanar till mer praktisk träning med livboj och hjärt-lungräddning.", "trump": "Folk tror att de är stora hjältar som kan rädda liv i vattnet, men de gör allt fel. De hoppar i som idioter istället för att ringa 112 först. Det är en total katastrof. Vi har hundra drunknade varje år i det här landet och sommaren blir farligare än någonsin. De borde öva ordentligt med livboj, inte bara tro att de är smarta. Gör det rätt, annars är det patetiskt.", "stalin": "Kamrater, jag ser med djup misstro på dessa sju av tio som i sin arroganta okunnighet tror sig kunna rädda drunknande utan att först larma partistatens hjälpare på 112. Dessa latenta borgarbrackor och vattenfiender hoppar i som galna sabotörer istället för att följa den korrekta ordningen. Vi måste omedelbart rensa ut dessa kunskapsbrister genom massiv kollektiv träning. Den som inte övar med livboj är en objektiv fiende till folket och bör betraktas därefter. Juli blir vår blodigaste månad om vi inte likviderar okunskapen nu."}, "date": "10 juni, 08:30", "url": "https://nyheter24.se/nyheter/inrikes/1490170-manga-saknar-kunskap-infor-detta-i-sommar-kan-kosta-liv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c6192c6a04b004a30200000000b004a302/2026/06/09/2369815/radda-liv-overskatta.png"}, {"type": "image-right", "heading": "Attendos våta dröm är billigare uskor", "summaries": {"normal": "Vårdbolag som Attendo, Vardaga och Norlandia undviker att betala rätt övertidsersättning till deltidsanställda undersköterskor genom att kräva nya timanställningar vid extrapass. Detta efter att Kommunal förhandlat bort den tidigare billigare mertidsersättningen. Artikeln kritiserar hur vinstdrivna företag bygger verksamhet på deltid för att spara pengar på personalens bekostnad medan de gör stora vinster.", "trump": "De här vårdbolagen är verkligen några av de värsta bedragarna jag sett. De lovar och skriver på avtal med facket och sen lurar de sina egna undersköterskor med nya trick för att slippa betala vad de förtjänar. Totalt oacceptabelt. De gör hundratals miljoner i vinst på skattepengar men vägrar ge folk rimlig ersättning. Patetiskt. Vi behöver bättre avtal och stoppa det här cirkuset nu.", "stalin": "Kamrater, dessa giriga borgarbrackor inom Attendo och deras likar har återigen blottat sin förrädiska natur genom att kringgå våra hårdföra avtalssegrar med sina usla timanställningar. Jag ser deras fula ansikten le bakom pappersbergen medan de suger musten ur arbetarkollektivet. Men var lugna, vi ska rensa ut dessa parasitiska profitörer som försöker stjäla tillbaka segern från undersköterskorna. Deras vinstbegär är en cancer som måste likvideras med järnhand och ett leende."}, "date": "10 juni, 07:00", "url": "https://arbetet.se/2026/06/10/sa-gor-vardbolagen-for-att-slippa-betala-underskoterskorna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10070354/attendo-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.49&fp-y=0.51"}, {"type": "image-right", "heading": "Lindstrand: Liten risk att Northvolt döms för svindleri", "summaries": {"normal": "Advokaten Lindstrand bedömer att risken för Northvolt att dömas för svindleri eller bedrägeri är liten, men större för borgenärsbrott. EBM utreder misstankar om bokförings- och skattebrott, men KPMG har inte hittat fel. Northvolts nedskrivning om 36 Mdr väcker frågor. Chapter 11-processen i Texas betraktas som forum shopping och erkänns inte i Sverige. Den avgörande frågan är när bolaget var på obestånd och hur detta påverkade borgenärerna.", "trump": "Jag har sett många bedrägeri-företag, och Northvolt är ett av de värsta. De försökte luras investerare med falska löften, men vi ser igenom deras teater. Chapter 11 i Texas? Ett skämt! De flydde till Amerika för att gömma sina spår. Jag skulle ha stängt ner dem på ett par dagar. Sorgligt! Det enda de var bra på var att bränna pengar – som mina motståndare på valkommissionen.", "stalin": "Detta kapitalistiska företag Northvolt visar den västerländska dekadensen. De påstods vara på obestånd länge, men fortsatte att dricka av statens brunn – precis som våra fiender under det stora kriget. Chapter 11 är en amerikansk list att undvika ansvar, en teknik som Putin har perfektionerat. Vi måste skydda det socialistiska planekonomiska systemet mot sådana svek. Kanske borde de ha skickats till gulag för att lära sig vad verkligt arbete innebär."}, "date": "10 juni, 06:54", "url": "https://www.affarsvarlden.se/kronika/lindstrand-liten-risk-att-northvolt-doms-for-svindleri", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-10T053821.455-400x267.jpg"}, {"type": "image-right", "heading": "Är det demokrati om folket inte kan få kontakt med politiker?", "summaries": {"normal": "Johanna Deinum kritiserar i en debattartikel att riksdagen genom proposition 2025/26:254 överlåter makt till regeringen att tillåta främmande makter att använda svensk mark för militära operationer utan riksdagens direkta beslut. Hon pekar på negativa remissvar från jurister vid Göteborgs universitet och Svenska Freds, som varnar för grundlagsproblem. Deinum har mejlat 73 riksdagsledamöter utan svar och oroar sig över ökad risk för kärnvapen på svensk mark samt urholkad demokrati och suveränitet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen försöker smyga igenom ett avtal som låter utländska arméer använda Sverige som gigantisk militärbas. Riksdagsledamöterna svarar inte ens på vanliga medborgares mejl – patetiskt! De gör Sverige till ett primärt mål för Ryssland och alla andra. Ingen bryr sig om kärnvapenrisken. Det är en enormt dålig deal, kanske den sämsta någonsin. Sverige borde vara starkt och suveränt, inte en måltavla för någon annans krig.", "stalin": "Kamrater, denna proposition 2025/26:254 är en listig sabotagehandling från borgarbrackorna och deras opålitliga lakejer i riksdagen. Jag, som alltid vakar över folkets säkerhet, ser hur de försöker överlåta sovjetiskt, förlåt, svenskt territorium till västerländska imperialister utan att ens konsultera kollektivet. Juristerna och fredsvännerna varnade, men de tystades ned. Dessa folkfiender med sin reptilhjärna och existentiella ångest vill göra Sverige till en atombomb-magnet. Vi ska rensa ut alla som inte förstår att all makt utgår från folket – annars likviderar historien dem med ett leende."}, "date": "10 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-demokrati-om-folket-inte-kan-fa-kontakt-med-politiker/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-40-300x157.jpg"}, {"type": "image-right", "heading": "C väljer S: ”Ulf Kristersson har diskvalificerat sig för oss”", "summaries": {"normal": "Centerpartiet ställer sig bakom Magdalena Andersson som statsministerkandidat efter valet, under förutsättning att hennes regeringsalternativ uppfyller krav på fler jobb, sänkta skatter, minskade utsläpp och minst 50 miljarder i satsningar på landsbygdens välfärd. Partiledare Elisabeth Thand Ringqvist kritiserar Ulf Kristersson för att ha anpassat sig till och anammat Sverigedemokraternas politik, vilket diskvalificerar honom. C vill inte samarbeta med Vänsterpartiet och planerar fler sakpolitiska krav.", "trump": "Folk, ni tror inte vad som händer i det här vansinniga Sverige! Den här centerkvinnan, en riktig förlorare, kastar sig i armarna på den socialistiska Andersson bara för att hon lovar massor av skatter och byråkrati. Kristersson? Han är en patetisk svikare som dansar efter SD:s pipa. De här globalisterna och vänsterextremisterna förstör landet med sina gröna drömmar och landsbygdsbidrag. Men tro mig, det blir kaos, precis som under Biden. Jag skulle fixa det på en vecka!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna centerborgarbracka vänder ryggen åt den reaktionära Tidöklanen och dess SD-fascister. Ulf Kristersson har blottat sig som en svag kapitalistlakej som låter folkfienderna styra politiken. Vi kräver utrensning av alla destruktiva element som hotar arbetarnas välfärd på landsbygden. Magdalena Andersson må vara en opportunist, men hon kan bli ett verktyg mot de blodsugande imperialisterna. Inga kompromisser med vänsterns tillväxtfientliga sabotage! Statens mål går före allt."}, "date": "9 juni, 17:48", "url": "https://www.tv4.se/artikel/6j45PwWEC2M3DKhNGg5lh6/c-vaeljer-s", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7dcAD4puKXR0rJ0ijoQcYd%2Fd7bdf4da942a11d3ac016f31e4e6f259%2Fthand.png&width=120"}, {"type": "image-right", "heading": "Domstolarna tvingar barn att umgås med pappor de är rädda för", "summaries": {"normal": "Artikeln kritiserar hur svenska domstolar ofta tvingar barn till umgänge med pappor de är rädda för, trots dokumenterad oro från socialtjänst och skola. Fallet med mordet på åttaårige Tintin lyfts som exempel. Begreppet parental alienation syndrome används för att ifrågasätta barns vittnesmål om våld, vilket ofta vänds mot mamman. Trots lex Tintin kvarstår problemen enligt Barnombudsmannen. Teorin saknar vetenskapligt stöd och underminerar barns rättigheter.", "trump": "Folk, vi har ett system som är totalt riggat mot mammorna och de stackars kidsen. Domstolarna köper den här alienation-sjukan som är fullständigt galen, de vänder allt mot mamman som en häxa i en rättegång. Stackars lilla Tintin, han ropade på hjälp men ingen lyssnade – klassiskt! Biden skulle ha älskat den här woke-röran. Vi behöver riktiga lagar som skyddar barnen, inte den här feministiska galenskapen som gör allt värre. Sad!", "stalin": "Kamrater, jag ser hur den borgerliga rättsapparaten systematiskt likviderar barns röster genom att förklara deras skräck som manipulation från den skyddande modern. Denna alienation-teori är en klassfiendes lögn som vänder bevis mot folket. Tintins tragiska öde är ett symptom på imperialismens kalla logik. Vi måste rensa ut dessa folkförtryckartroll och deras pseudovetenskap. Barnets rädsla är verklig, motståndarna är blodsugare som förtjänar utrensning ur systemet."}, "date": "9 juni, 06:00", "url": "https://www.etc.se/ledarkolumn/domstolarna-tvingar-barn-att-umgaas-med-pappor-de-aer-raedda-foer", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/gabriella-kaernekull-wolfe_35030e3969dd8e85ff7fcd816e743c311fd1c9ac.png"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvot     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
