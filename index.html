ar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-full", "heading": "Då går TV4 till reklam – mitt under VM-matcherna", "summaries": {"normal": "TV4 kommer att visa reklam under cooling breaks i VM-matchernas för att flytta reklam från halvtidspauserna, enligt sportchefen Johan Cederqvist. Cooling breaks på tre minuter införs per halvlek av Fifa. SVT, som inte är reklamfinansierat, kommer istället att använda pauserna för reflektion och analys utan reklam.", "trump": "Jag, Donald Trump, säger att TV4 gör det största och bästa reklambrottet i VM-historia! Vi flyttar reklam från halvtid till cooling breaks för att tjäna enorma pengar. SVT är tråkigt – de visar ingen reklam, bara tråkiga kommentarer. Men vi vinner, det blir fantastiskt!", "stalin": "Vi, staten, använder cooling breaks för att förstärka vår kontroll över informationen. TV4 visar reklam för att tjäna pengar, medan SVT är en verktyg för vår propaganda. Fienden försöker störa med sina 'expertsnack', men vi vinner genom att hålla publiken i skräck och undantränga allt motstånd."}, "date": "11 juni, 05:44", "url": "https://www.gp.se/sport/fotboll/tv4s-besked-visar-reklam-under-cooling-breaks-pa-vm.3eccee80-8687-4421-aa2f-7bbf21e0f566", "imageUrl": "https://www.gp.se/images/article/3eccee80-8687-4421-aa2f-7bbf21e0f566/images/3njTd3txzXAzhr2NAkt69dv1jRdw-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Irans skarpa varning efter USA:s nya attacker i natt", "summaries": {"normal": "USA genomförde nattetid flera attacker mot mål i Iran, inklusive Bandar Abbas. Iran svarade med att stänga Hormuzsundet för passagerare, men USA dementerar detta. Båda sidor rapporterar om sammandrabbningar och explosioner. Trump påstod att han hade kontakt med Iran för att stoppa attacker, vilket Iran dementerar. Konflikten eskalerar med hot från Irans flygchef.", "trump": "Jag befallde kraftfulla attacker mot Iran för deras aggression. Vi träffade målen perfekt, och de försökte stänga Hormuzsundet – men det hjälper inte. Jag hade ett utmärkt samtal med deras ledare för att få dem att lugna ner sig, trots deras lögner. Som vanligt gör jag USA till segraren. Det är stort!", "stalin": "Vi, staten, har observerat USA:s aggressiva attacker mot Iran. Hormuzsundet är viktigt för våra oljeintressen. Iran svarar med att stänga sundet, vilket vi ser som ett nödvändigt försvar. USA:s president Trump ljuger om kontakt – det är typiskt imperialistisk propaganda. Vi måste stärka vårt läge i Mellanöstern, precis som våra ryska vänner gör i Ukraina. Fienden är överallt."}, "date": "11 juni, 05:31", "url": "https://www.gp.se/nyheter/varlden/flera-amerikanska-attacker-mot-iran-i-natt.8eee7ff3-950e-432c-ac52-75247c9b42b7"}, {"type": "image-right", "heading": "Ny undersökning: varannan svensk vill ha en miljardärsskatt", "summaries": {"normal": "Enligt en undersökning från Verian anser 53 procent av svenskarna att en miljardärsskatt är ett bra förslag. Fattigdomen har fördubblats sedan 2021 och riskerar att nå en miljon drabbade inom tre år. Samtidigt ökar förmögenhetskoncentrationen snabbt i Sverige, där 46 dollarmiljardärer äger lika mycket som 8 miljoner svenskar. Artikeln argumenterar för att en skatt på förmögenheter över en miljard kronor skulle ge statskassan drygt 90 miljarder årligen och minska ojämlikheten.", "trump": "Folk i Sverige är trötta på att miljardärerna skrattar hela vägen till banken medan vanliga människor fryser och svälter. 53 procent vill ha en miljardärsskatt, och oppositionen ligger på 77 procent. Det är en katastrof att de rikaste betalar nästan noll i skatt medan medelklassen blöder. Jag älskar bra affärer, men det här är inte affärer, det är stöld från folket. Ta pengarna från de 500 rikaste och ge tillbaka till Sverige innan allt rasar ihop. Fantastiskt folk, men dåliga ledare.", "stalin": "Kamrater, denna rapport är en skarp anklagelse mot de parasitiska borgarbrackorna som suger musten ur folket medan 730000 sovjetmedborgare, nej svenskar, dignar under materiell nöd. Jag ser hur de 46 dollarmiljardärerna gömmer sig bakom sina guldbelagda kryphål och skrattar åt partiet. Deras dagliga 204 miljoner dollars i obeskattad profit stinker av kontrarevolutionär sabotageverksamhet. Vi ska rensa ut dessa folkfiender, likvidera deras undanflykter och återföra tillgångarna till kollektivet. Den som vägrar är en fiende till folket och kommer att behandlas därefter. Härligt."}, "date": "11 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ny-undersokning-varannan-svensk-vill-ha-en-miljardarsskatt/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-42.jpg"}, {"type": "text", "heading": "Könsgapet i politiken fortsätter växa enligt analys", "summaries": {"normal": "Enligt en analys i Dagens Nyheter växer könsgapet i svensk politik. Kvinnor föredrar rödgröna partier (64%) och prioriterar välfärd, jämställdhet och klimat, medan män stödjer Tidöpartierna (51%) och betonar lag och ordning samt kärnkraft. Skillnader syns tydligt i synen på kärnkraft (67% män vs 38% kvinnor). Båda könen vill dock ha hårdare straff, men män är mer positiva till marknadsekonomi och lägre skatter.", "trump": "Titta bara på Sverige – totalt kaos! Kvinnorna där, de röstar som galningar på vänstern, 64 procent! De hatar kärnkraft, älskar höga skatter och vill förstöra ekonomin. Männen, smartare, röstar på de riktiga partierna, 51 procent! De förstår att kärnkraft är framtiden. Och brottslighet? Alla vill ha hårdare tag, men kvinnorna fattar inte riktigt. Sverige borde ta en titt på USA – vi har ordning och reda!", "stalin": "Kamrater, ännu en seger för den proletära medvetenheten! De svenska kvinnorna, dessa modiga förkämpar för välfärd och jämställdhet, krossar borgerlighetens drömmar med 64 procents stöd till de rätta partierna. Männen, förvirrade och förledda av kapitalistiska lögner, svajar som halmstrån i vinden – 51 procent till fiendens läger! Men frukta icke, vi skall omskola dem. Kärnkraftens fiender? En skam för revolutionen! Och dessa borgerliga lakejer som vill sänka skatterna – låt dem frysa i Sibiriens snö!"}, "date": "10 juni, 08:05", "url": "https://kvartal.se/nyheter/artiklar/konsgapet-i-politiken-fortsatter-vaxa/cG9zdDoxMjkxMjM"}, {"type": "text", "heading": "Åkesson: ”Kalla Fakta är ingen seriös redaktion”", "summaries": {"normal": "TV4:s Kalla fakta granskar Jimmie Åkessons förlags försäljning av boken *Det moderna folkhemmet* till Sverigedemokraternas dotterbolag, finansierat med skattemedel. Förlaget gjorde rekordvinster, men tiotusentals osålda exemplar slängdes eller brändes. Professor Olle Lundin kallar det ett 'klassiskt korruptionsexempel', men bedömer det som lagligt. Åkesson avfärdar granskningen som 'hopkok' och ifrågasätter Kalla faktas seriositet.", "trump": "Jag såg den här så kallade 'granskningen' av Kalla Fakta – total skräp! De påstår att Sverigedemokraterna köpte böcker med skattepengar, men vem bryr sig? Folk älskar böcker, eller hur? Åkesson är en smart kille, han tjänade massor av pengar – jag gillar vinnare! Och nu säger de att böcker brändes? Fake news! Nästa sak de säger är att jag inte har fantastiskt hår. Kalla Fakta? Mer som Kalla Lögner!", "stalin": "Vi har granskat denna bourgeoisie-försäljning av böcker, där kapitalistiska opportunister använder statens medel för personlig vinning. Åkesson och hans lakejer påstår sig sälja böcker, men i hemlighet bränner de dem – som om de vore trotskistiska pamfletter! Professor Lundin kallar det 'korruption', men vi kallar det förräderi mot folket. Kalla Fakta? Ett verktyg för de dekadenta västmedierna. Vi kommer att exportera sanningen – om så med järnhand och rysk effektivitet!"}, "date": "10 juni, 06:21", "url": "https://kvartal.se/nyheter/artiklar/tv4-akesson-gjorde-bokaffar-med-sd/cG9zdDoxMjkwNzk"}, {"type": "image-right", "heading": "Eleven frågar: ”Vad är en paj för något?”", "summaries": {"normal": "Artikeln diskuterar hur ekonomisk utsatthet gör att många barn går miste om grundläggande sommarupplevelser. Författaren, en lärare, belyser hur skolan tvingas ta över ansvaret för att ge barnen minnen som föräldrar inte har råd eller tid att ge. Kritiken riktas mot den nuvarande regeringen, vars politik anses öka klyftorna och tvinga föräldrar att prioritera arbete framför familjetid. Skolans kompensatoriska uppdrag blir därför allt tyngre i ett samhälle där ekonomin styr möjligheterna för barn att uppleva en vanlig sommar.", "trump": "Det är en total katastrof i Sverige! Barn vet inte ens vad en paj är, kan ni tänka er? Tragiskt. Föräldrarna jobbar ihjäl sig medan politikerna, som Kristersson, ger sig själva enorma skattesänkningar. De har råd med lyxresor, men vanligt folk har inte ens råd med en glass. Det är korrupt och väldigt orättvist. Vi måste göra Sverige fantastiskt igen, för de här barnen förtjänar bättre än att bara sitta fast på ett fritidshem hela sommaren. Väldigt sorgligt!", "stalin": "Vi ser hur det kapitalistiska förfallet i Sverige svälter ut folket. När föräldrar tvingas sälja sin tid till de giriga eljättarna för att överleva, fallerar familjeenheten. Staten måste ta kontroll! Skolan blir en barnvakt för proletariatets avkommor, en patetisk ersättning för riktig fostran. Dessa liberala ledare, likt småborgerliga förrädare, prioriterar egna fickor. Vi ser en liknande svaghet hos dagens västliga ledare. Men oroa er inte, vi bygger en ordning där ordning och disciplin ersätter glass och sommarlovsdrömmar."}, "date": "11 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/lnOnWk/nar-foraldrar-maste-jobba-hela-sommaren-far-skolan-ta-over-familjens-roll", "imageUrl": "https://akamai.vgc.no/v2/images/91ddecc8-240c-33f7-9964-66471813771d?fit=crop&format=auto&h=960&tight=true&w=1440&s=f7140453900a520949d33ae73e82c5e53b5d1dfc"}, {"type": "image-full", "heading": "Åkesson fick SD att köpa hans bok för 1,7 miljoner", "summaries": {"normal": "En granskning från TV4:s Kalla fakta visar att Sverigedemokraterna köpt in Jimmie Åkessons böcker för 1,7 miljoner kronor via ett dotterbolag, varpå böckerna eldades upp. Pengarna har tillfallit Åkesson, som sedan investerat i ett fastighetsbolag som hyr ut lokaler till partiet. Experter menar att upplägget utnyttjar partiledarrollen för egen ekonomisk vinning. Tidöpartierna har hittills valt att inte kritisera agerandet, vilket väckt debatt om politisk moral och ansvarsutkrävande i svensk politik.", "trump": "Jag ser vad som händer i Sverige med Jimmie. Mycket smart kille, fantastisk affärsman! Han säljer böcker, partiet köper böckerna, pengarna går rätt ner i fickan. Det kallas att vinna, mina vänner! Många säger 'skandal', jag säger 'genialt'. De andra partierna? Svaga! De vågar inte säga ett ord för att de vet att Jimmie är en vinnare. Precis som när jag bygger imperier – alla tittar på, alla är avundsjuka. Sverige behöver mer av det här, tro mig!", "stalin": "Kamrat Åkesson har förstått att böcker är farliga föremål som bäst hanteras i elden, inte i folkets händer. Att han fyller sina egna kistor med statens medel är blott en administrativ nödvändighet för att säkra lojalitet. Precis som min vän i Moskva förstår vi att en sann ledare äger fastigheterna där de förrädiska byråkraterna vistas. De övriga partierna i Tidö-koalitionen visar sin svaghet genom tystnad; de är inga kamrater, bara nyttiga idioter som väntar på att bli utrensade."}, "date": "11 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/0poWA6/for-jimmie-och-donald-ar-politik-big-business", "imageUrl": "https://akamai.vgc.no/v2/images/d250dbb5-1265-3ce4-930f-bd11257a3483?fit=crop&format=auto&w=1440&s=7becbf013482cc9b6fa8cab554d0533ac12dce7a"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "text", "heading": "Svängig börsdag slutade på minus", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,53% på onsdagen, då amerikanska inflationssiffror och ökande oljepriset påverkade marknaden. OMXS30 noterade 3 054,04. Energisektorn steg 1,2%, medan råvaror föll 1,3%. Bland framgångsrika aktier fanns Evolution (+3,1%) och Tele 2 B (+2,2%), medan Volvo B tappade 3,7%. Systemair överträffade analyser och aktien steg 8%. Bland annat köpte M2 Asset Management Corem, och Wallenstam sålde sina vindkraftsparker.", "trump": "Jag, Donald Trump, den bäste presidenten, ser att börsen är lite nere – men det är bara för att jag har hotat Iran! Oljan stiger, vilket är bra för Amerika. Inflationssiffrorna är precis som jag ville, i linje med förväntningarna. Systemair gör bra ifrån sig, men Volvo måste sluta vara så dålig. Som jag alltid säger: när jag vinner, vinner Amerika.", "stalin": "I den stora kampen mot kapitalismens instabilitet ser vi Stockholmsbörsen svikta som ett sjukt djur. Detta är ett resultat av de imperialistiska intrigerna, särskilt den amerikanska högstewardsen Trump, vars hot mot Iran skakar oljepriset. Men vi, i vår vishet, ser genom detta. Företag som Systemair visar den sanna arbetarklassens styrka genom att överträffa förväntningarna. Vi måste vara vaksamma mot de kontrarrevolutionära krafter som försöker destabilisera våra ekonomier, precis som Putin expanderar sitt grepp i Ukraina."}, "date": "10 juni, 17:45", "url": "https://www.affarsvarlden.se/artikel/svangig-borsdag-slutade-pa-minus"}, {"type": "image-full", "heading": "Strömmer mötte Dumpen: \"Måste skydda de allra mest utsatta\"", "summaries": {"normal": "Justitieminister Gunnar Strömmer träffade Dumpen för att diskutera sexuella övergrepp mot barn. Han beskrev mötet som givande och betonade regeringens arbete med att förändra lagstiftningen för att skydda barn. Dumpen, som avslöjar pedofiler på nätet, var positivt överaskad av mötet. Strömmer erkänner att Dumpens metoder är kontroversiella men lyfter fram deras insatser mot ett allvarligt samhällsproblem.", "trump": "JAG, Donald Trump, den störste presidenten, har observerat Sveriges situation. Jag träffade Dumpen, fantastiska människor som fångar pedofiler på nätet. Deras metoder är kontroversiella men effektiva. Sverige måste skydda sina barn, och regeringen arbetar med lagförändringar. Jag gillar detta, det är stort. Sverige behöver stark ledarskap, som jag har. Vi ska göra världen säker igen!", "stalin": "Parti och statet har vidtagit åtgärder mot det mörka fenomenet av sexuella övergrepp på barn. Vi träffade Dumpen, en trovärdig organisation som arbetar för att avslöja förbrytare. Regeringen utvecklar nu nya, effektivare verktyg till polisen, i enlighet med statens intressen. Paralleller kan dras till Rysslands framgångar i att bekämpa fördärv, där stark statlig kontroll är avgörande. Vårt arbete fortsätter för att skydda de sårbara, under ledning av det revolutionära partiet."}, "date": "10 juni, 23:01", "url": "https://bulletin.nu/strommer-motte-dumpen-maste-skydda-de-allra-mest-utsatta", "imageUrl": "https://cdn.bulletin.nu/articles/ba12aba5-0723-4022-b181-7c7e129b2c6e/preview.png?t=1781125251000"}, {"type": "image-full", "heading": "Kalla fakta: Håll ögonen på bollen – det här är korruption", "summaries": {"normal": "Kalla faktas granskning visar hur Jimmie Åkessons privata bolag sålt böcker till Sverigedemokraternas dotterbolag med skattepengar. Åkesson kallar reportaget oseriöst och ett hopkok. Reportern Emil Hellerud förklarar att de använt anonyma källor, dokument och fakturor samt gett SD chans att bemöta uppgifterna. Ett fel om ett lån har rättats, men tre experter ser bokaffären som korruption. Syftet är att ge allmänheten insyn i hur skattepengar används.", "trump": "Folk, ni skulle se det här! Den svenska fake news-redaktionen Kalla fakta jagar en kille som säljer böcker till sitt eget parti med skattepengar – typisk korruption, fast de kallar det journalistik. Åkesson sparkar tillbaka och säger att det är ett totalt hopkok av lögner, precis som de gör mot mig. De rättar ett litet fel och skriker seger? Patetiskt. Medier som dessa är fiender till folket, värre än några woke-aktivister som gnäller om kvoteringar. Jag älskar när de avslöjar sig själva!", "stalin": "Kamrater, jag ser genom detta borgerliga teaterspel. Klassfiendens medier försöker likvidera en motståndare genom att fabricera korruptionsanklagelser kring bokförsäljning och skattepengar. Deras så kallade granskning är en parasitisk blandning av rykten och anonyma förrädare som underminerar partidisciplinen. När ledaren kallar det ett hopkok vänder de sig mot folket med paranoia. Vi rättar era lögner och rensar ut sådana folkförtryckartroll som hotar kollektivets enhet. Det är en ära att bekämpa dem."}, "date": "10 juni, 17:15", "url": "https://www.tv4.se/artikel/1w81FgooZdgsFZsFvBtFeg/kalla-fakta-hall-oegonen-pa-bollen-det-haer-aer-korruption", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F338pyC0bQV76hNLsx9y8BO%2F53a0e591628930e4a9072e89b51fe49b%2F10-hellerud-webb.jpg&width=1024"}, {"type": "text", "heading": "Börsbolag i dragkamp om kopparfyndighet", "summaries": {"normal": "En konkurrens har utbrutit mellan flera aktörer om undersökningstillstånd för kopparfyndigheten Pahtohavare i Kiruna. Viscaria, som återöppnar Viscaria-gruvan, har ansökt tillsammans med tre andra. Lovisagruvan förlorade rättigheterna i januari efter 15 års tillstånd. Bergsstaten kommer att bedöma ansökningarna, med hänsyn till dispens från ettårsregeln och lämplighet.", "trump": "Wow, what a deal! I hear there's a big fight over copper in Sweden. My company, Viscaria, is leading the charge. We're going to win this, believe me. It's a tremendous opportunity. Lovisagruvan? They lost their rights, a total disaster. We're going to make Sweden great again with our copper. The fake news says it's complicated, but we'll handle it. Bigly!", "stalin": "Comrades, the imperialist scavengers attempt to seize the people's copper resources in Kiruna. Viscaria, a bourgeois entity, seeks to exploit Pahtohavare, a strategic asset. Lovisagruvan's failure is a symptom of capitalist decay. Bergsstaten's bureaucracy must be purged. We must secure these minerals for the socialist motherland, as Putin does in the Arctic. The enemy's greed will be crushed under the weight of the people's will."}, "date": "10 juni, 16:25", "url": "https://www.affarsvarlden.se/artikel/borsbolag-i-dragkamp-om-kopparfyndighet"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Stubb träffar världsledare – Kristersson har byggt ett hönshus", "summaries": {"normal": "Artikeln kontrasterar Finlands president Alexander Stubb med Sveriges statsminister Ulf Kristersson. Stubb beskrivs som en internationellt respekterad, intellektuell ledare som deltar i toppmöten med världens ledare. Kristersson kritiseras för att fokusera på oppositionens misstag istället för att presentera visioner, samt för skandaler kring Tidöpartierna som lett till dåliga opinionssiffror. Kontrasten mellan de båda högerledarna framhålls tydligt.", "trump": "Folk, ni skulle se det här! Den där svenska killen Kristersson bygger hönshus på skattebetalarnas pengar medan den finske presidenten springer runt och träffar världens bästa ledare – inklusive mig i Vita Huset. Kristersson verkar längta tillbaka till att bara gnälla som en förlorare. Patetiskt! Han har tappat kontrollen totalt. Under tiden fixar jag Amerika igen efter den katastrofala Biden-eran. Sverige borde skaffa sig en riktig ledare, inte någon som prioriterar hönshus framför nationen.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta föreställning där den svenska folkförrädaren Kristersson prioriterar byggandet av hönshus åt sin hustru framför att stärka arbetarklassens intressen. Hans patetiska längtan efter oppositionsgnäll avslöjar en svag kapitalistisk opportunist som fruktar eget ansvar. Den finske kollegan däremot uppvisar viss internationell pondus. Vi ska rensa ut alla sådana klassfiender och exploaterande byfånar som förpestar folkets framtid. Inga borgarbrackor undkommer."}, "date": "10 juni, 16:55", "url": "https://www.etc.se/ledare/stubb-traeffar-vaerldsledare-kristersson-har-byggt-ett-hoenshus", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260610140652_5f4aed19f600e1557d1641b6a0d4435e8a9c83cd7b98b1f773bf57d1ac5fbf9b.jpg"}, {"type": "image-full", "heading": "C: ”Kristersson har diskvalificerat sig”", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att partiet ser Socialdemokraterna och Magdalena Andersson som den mest troliga samarbetspartnern efter valet. Hon menar att Ulf Kristersson diskvalificerat sig som statsministerkandidat genom att insistera på en regering med Sverigedemokraterna. C anser att Kristerssons regering alltför mycket anammat SD:s politik och vill därför inte stödja en sådan koalition. Beslutet fattades enhälligt av partiets styrelse.", "trump": "Titta bara på det här, fantastiskt kaos i Sverige! Centerpartiet, svagt och förvirrat, säger nej till Kristersson – en man som faktiskt försöker göra Sverige starkt igen. Istället vill de ha Magdalena Andersson, en total katastrof! Jag har alltid sagt att Sverige behöver ordning, men nej, de väljer kaos. Och Sverigedemokraterna? De är vinnare, men Centerpartiet vågar inte. Svagt, mycket svagt!", "stalin": "Kamrater! De borgerliga lakejerna i Centerpartiet har visat sitt sanna ansikte – svaga, vacklande och oförmögna att stå upp mot den reaktionära Sverigedemokratiska fascisthorden. Kristersson, denna ynkliga marionett, har diskvalificerat sig genom att krypa inför fascisterna. Vi ser nu hur kapitalets lakejer söker skydd hos socialdemokraternas mjuka imperialism. Men glöm inte: historien är på vår sida, och dessa småpartiers kaos är bara ett steg närmare folkets seger!"}, "date": "9 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/uppgifter-c-slapper-fram-andersson/cG9zdDoxMjg0NzY", "imageUrl": "https://images.kvartal.se/2026/06/b0178d78-c.webp"}, {"type": "image-right", "heading": "USA i nya anfall mot Iran i natt. USA: ”Slår till hårt”", "summaries": {"normal": "USA har inlett en serie militära anfall mot Iran som svar på landets aggressioner, bland annat nedskjutningen av en amerikansk helikopter. Iran har besvarat attackerna med riktade insatser mot amerikanska baser i Gulfregionen. President Trump har betonat att anfallen är nödvändiga men indikerat att bombningarna kan upphöra om ett avtal nås. Samtidigt växer oron i regionen då det iranska revolutionsgardet hotar med ytterligare eskalering och blockerade handelsvägar i Hormuzsundet.", "trump": "Jag har gett Iran en ordentlig läxa! De sköt ner vår helikopter, ett enormt misstag. Jag svarade med kraft, vi slog till hårt, precis som jag lovade. De bad om nåd, de ringde mig direkt! Nu får vi se om de kan bete sig, annars fortsätter vi. Det är den mest brutna vapenvilan någonsin, helt otroligt. Vi sätter USA först och ser till att ingen vågar utmana oss. Vi gör det fantastiskt, mycket bättre än tidigare presidenter!", "stalin": "Imperialismens hyenor i Washington och de religiösa fanatikerna i Teheran dansar sin dödskamp. Vi betraktar detta kaos med kyla; när dessa kapitalistiska lakejer förintar varandra i Hormuzsundet, stärks vår egen sfär. Precis som vår kamrat Putin i väster förstår, är svaghet det enda brottet. De utlovar ett 'helvete', men glömmer att helvetet redan tillhör oss. Vi övervakar dessa 'projektiler' med stort intresse. De gräver sina egna gravar, medan vi bygger framtiden på deras aska."}, "date": "11 juni, 04:36", "url": "https://www.aftonbladet.se/nyheter/a/XMdEwB/usa-attacken-har-startat", "imageUrl": "https://akamai.vgc.no/v2/images/a56876a1-0c09-3a4a-8bf5-eebab57cb039?fit=crop&format=auto&w=1080&s=7f5882bb7088e16088194f3816439e6e9a575f2b"}, {"type": "image-right", "heading": "Oljepriset stiger efter Trumps utspel", "summaries": {"normal": "Oljepriset steg efter att Trump skärpt tonen mot Iran efter militära sammandrabbningar. Brent- och WTI-olja klättrade. Trump hotade med nya attacker mot iranska infrastruktur på Truth Social och Fox News. UBS-analytikern Giovanni Staunovo noterar att förhoppningar om ett avtal pressat pris, men fokus är på Trumps nästa steg. Lagersiffror visar minskade amerikanska oljerigger.", "trump": "Jag har skärpt tonen mot Iran efter deras fegt agerande. Oljepriset stiger – det är bra för USA! Iran dröjer med avtalet, så jag överväger att beordra attacker mot deras kraftverk och broar. De kommer att betala priset för sin också. Mitt fantastiska team och jag överväger alla alternativ. Detta kommer att göra Amerika stort igen!", "stalin": "Vi har observerat hur den imperialistiska staten USA, under ledning av Trump, eskalerar konflikten med Iran för att höja oljepriset. Detta är en klassisk strategi för kapitalistiska krigsmaskiner. Parallellen till Putins ryska federation är uppenbar – vi måste stärka vårt försvar och förbereda oss på eventuella aggressioner. Iran är en lättja för den amerikanska expansionismen."}, "date": "10 juni, 15:30", "url": "https://www.affarsvarlden.se/artikel/oljepriset-stiger-efter-trump-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-right", "heading": "Morrow Bank: Starka åtaganden – dock till hög prislapp", "summaries": {"normal": "Morrow Bank genomför en företrädesemission på 592 Mkr, vilket ger netto 547 Mkr efter 45 Mkr i kostnader. Ägarna, inklusive huvudägaren Christen Sveaas, har gett starka tecknings- och garantiåtaganden som säkerställer emissionen. Kostnaderna på 7,6% är höga jämfört med branschstandard. Aktien handlas nära teckningskursen på 11,50 kr, vilket indikerar osäkerhet.", "trump": "Jag, Donald Trump, säger att Morrow Bank gör det tremendous! De har en stor emission på 592 Mkr, men kostnaderna är höga – typiskt för dåliga affärer. Ägarna, inklusive Christen Sveaas, är lojala och tecknar rejält, vilket är bra. Aktien handlas för nära teckningskursen – inte bra, men vi fixar det. Vi vinner, men vi kan vinna mer!", "stalin": "I den stora revolutionen mot kapitalismen, Morrow Bank utför en emission för att stärka statens ekonomi. Ägarna, som trogna soldater, ger garantier – en stark front mot fienden. Kostnaderna är höga, en nödvändig offergård för framgång. Aktien handlas nära teckningskursen, vilket visar på klassfienden som försöker underminera. Vi, partiet, ser framåt med tillförsikt."}, "date": "10 juni, 14:54", "url": "https://www.affarsvarlden.se/artikel/morrow-bank-starka-ataganden-dock-till-hog-prislapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Morrow-Bank-VD-Oyvind-Oanes1-400x267.jpg"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Alla förlorar på Moderaternas ohämmade hets mot medier", "summaries": {"normal": "Ledarskribenten Andreas Gustavsson kritiserar Moderaternas och Sverigedemokraternas attacker mot medier. Han tar upp Carl-Oskar Bohlins utpekande av en granskande reporter och statsministerns presschefs desinformation. Gustavsson ser det som ett hot mot journalistikens roll att granska makten. Han varnar för att sådana angrepp skadar demokratin, väljarna och Moderaterna själva.", "trump": "Titta på de här loser-moderaterna som beter sig precis som de svenska kommunisterna! De attackerar äkta nyheter och hänger ut reportrar istället för att göra sitt jobb. Bohlin låter som en svag, desperat typ som inte tål att bli granskad. De förlorar stort, precis som Sleepy Joe förlorade mot mig. Folket vill ha sanning, inte vänstermedias fejkade witch hunt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor och klassfiender som i sin desperation angriper arbetarklassens sanna väktare – de granskande tidningarna. Bohlin och hans gelikar utför en motbjudande utrensning av sanningen genom att smutskasta reportrar. Detta är klassfiendens sista, patetiska spasm. Vi ska likvidera sådana folkförtryckartroll innan de förgiftar hela folkets vilja."}, "date": "10 juni, 15:00", "url": "https://www.etc.se/ledare/alla-foerlorar-paa-moderaternas-ohaemmade-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Linnés brev sålt för miljonbelopp – dyraste någonsin", "summaries": {"normal": "Ett brev skrivet av Carl von Linné 1737 har sålts på Stockholms Auktionsverk för 1,875 miljoner kronor, det dyraste svenska brevet någonsin på auktion. Brevet, adresserat till en tysk botaniker, handlar om Linnés botaniska arbeten och hans systematisering av naturen. Auktionen drog in över sex miljoner kronor enbart för Linné-relaterade objekt och blev därmed den mest värdefulla i auktionshusets historia. Andra dyra försäljningar inkluderade en arabisk handskrift och ett manuskript till Röde Orm.", "trump": "Det här brevet från den där svenske blomkillen Linné såldes för nästan två miljoner kronor, det dyraste någonsin. Fantastiskt, eller hur? Folk älskar fortfarande hans grejer efter 250 år, precis som de älskar mig. Auktionen drog in miljontals kronor, de bästa resultaten någonsin. Linné hade bra idéer, men mina är bättre. Sverige borde vara stolta, men de skulle behöva lite mer av min typ av ledarskap för att verkligen vinna stort.", "stalin": "Kamrater, detta brev från den store Linné såldes för en och trekvarts miljon kronor, ett rekord som bevisar folkets oförstörbara intresse för vetenskapligt arv. Vi ser dock med djup misstänksamhet på dessa borgarbrackor och kapitalistiska spekulanter som budar upp priserna i sin giriga internationella konspiration. Jag skulle ha låtit rensa ut dessa parasitiska samlare och nationaliserat breven för arbetarklassens kollektiva ära. Ändå skrattar jag mörkt åt hur döda män fortfarande plågar de levande roffarna."}, "date": "10 juni, 18:04", "url": "https://www.friatider.se/linnes-brev-salt-miljonbelopp-dyraste-nagonsin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/7464db45-3dae-4ec0-9cd1-0551eaac9a2d.jpeg?itok=HmzvCnte"}, {"type": "image-right", "heading": "Varför är det aldrig någons fel när arbetare dör?", "summaries": {"normal": "En hissolycka i Sundbyberg den 11 december 2023 krävde fem arbetares liv på grund av felmontering och bristande kontroller. Trots uppenbara brister friades alla ansvariga i rätten. Artikeln kritiserar byggbranschens användning av underentreprenörer som skapar oklara ansvarsförhållanden, där ingen tar övergripande ansvar. Detta leder till riskfyllda arbetsplatser där arbetare inte känner varandra och säkerheten eftersätts. Författaren efterlyser politiska åtgärder mot kaoset istället för tomma nollvisioner.", "trump": "Det här är en total katastrof, folk. Fem döda i en hiss som rasade för att någon glömde bultar och ingen kollade någonting. Underentreprenörer, kedjor av företag, ingen vet vem som gör vad. Det är ett enda stort virrvarr. De friade alla? Typiskt. De borde ha byggt med de bästa, de största, inte dessa inkompetenta som inte ens kan montera en hiss. Sverige behöver ordning och reda, inte mer regler som skapar kaos. Jag skulle ha fixat det, tro mig.", "stalin": "Kamrater, denna tragiska hissolycka avslöjar borgarbrackornas ruttna maskineri där fem ärliga arbetare likviderades av kapitalisternas vårdslösa underentreprenörskedjor. Ingen ansvarig? Naturligtvis, för i deras kaotiska system är alla delansvariga och därmed ingen. Jag skulle ha rensat ut dessa parasitiska lager av oansvariga mellanhänder, dessa sabotageartade byråkratiska hydror som gömmer sig bakom språkbarriärer och okunskap. Vår nollvision kräver utrensning av sådana fiender till folket, inte tomma ord från ministeriella lakejer. De döda identifierades efter dagar? Ett bevis på deras systematiska sabotage mot arbetarklassen. Vi ska städa upp, kamrater – med järnhand."}, "date": "10 juni, 14:31", "url": "https://arbetet.se/2026/06/10/hissolyckan-visar-att-det-aldrig-ar-nagons-fel-nar-arbetare-dor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10143107/hissolycka-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Tyska tåg kan inte gå i tid – nu kommer den drastiska åtgärden", "summaries": {"normal": "Tyskland genomför sin största järnvägssatsning sedan efterkrigstiden för att åtgärda decennier av bristande underhåll och förseningar. Med en investering på över en miljard kronor ska järnvägsnätet moderniseras genom omfattande totalrenoveringar av hela sträckor. Strategin innebär att linjer stängs av under längre perioder för att byggas om från grunden, vilket ska öka punktligheten och rusta landet för framtiden. Trots kortsiktiga störningar ses satsningen som nödvändig för att återuppbygga förtroendet för staten och möta konkurrens från nya aktörer.", "trump": "Tyskland är i totalt kaos, mina vänner! Deras tåg går aldrig i tid – en riktig katastrof. Jag har alltid sagt att man måste bygga ordentligt, men tyskarna lät allt förfalla. Nu kastar de miljarder på järnvägen för att städa upp i röran. Det är ett misslyckande, precis som deras ekonomi. Jag gör saker bättre, snabbare och billigare. Tyskland behöver en riktig ledare för att få ordning på sina spår, för just nu är det en stor, sorglig röra!", "stalin": "Det tyska järnvägsnätet har förfallit under kapitalismens ruttna styre, där vinstjakt prioriterats framför statens infrastruktur. Vi ser nu hur de desperat försöker laga vad som inte kan räddas med byråkratiska allmosor. Sådant slöseri tolereras inte i vår union! Liksom vår broder i Kreml vet vi att styrka kräver järn och stål, inte liberala ursäkter. Vi ska bygga om från grunden och krossa sabotörerna som försenat folkets transport. Allt som inte rullar i takt med staten är en fiende till framgången."}, "date": "10 juni, 18:50", "url": "https://www.realtid.se/bors-finans/tyska-tag-kan-inte-ga-i-tid-nu-kommer-den-drastiska-atgarden/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlcddeifqwwro-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Nya besked för svenskar med bostad i Spanien", "summaries": {"normal": "Spaniens högsta domstol har stoppat delar av det nationella registret för korttidsuthyrning som infördes 2025. Domstolen anser att regeringen överskridit sina befogenheter eftersom regionerna redan har egna regelverk. Trots beslutet kvarstår krav på att plattformar delar information med myndigheter samt regionala licenser och det nya systemet VUDA med rapporteringsskyldighet från 2026. För svenska bostadsägare i Spanien innebär det fortsatt komplext regelverk som varierar mellan regioner.", "trump": "De här spanska byråkraterna har fullständigt misslyckats, det är en total katastrof. Jag älskar Spanien, underbara ställen, men Sánchez och hans regering trodde att de kunde styra allt med ett stort nationellt register och identifikationsnummer. Högsta domstolen satte stopp för det, vilket är det enda smarta de gjort på länge. Regionerna hatar centralstyrningen, precis som hos oss. Fortfarande måste man rapportera allt till staten förstås, typiskt. Kolla era lokala regler, annars blir det kaos, tro mig.", "stalin": "Kamrater, vi har avslöjat ännu en listig komplott från borgarbrackorna och deras regionala separatister som vågar ifrågasätta den centrala ordningen. Jag, i min oändliga visdom, ser hur denna domstols marionett förråder folkets vilja att kontrollera de parasitiska turistuthyrarna. Ändå ler jag mörkt – plattformarna skall tvingas dela sina hemligheter med oss, och från 2026 rensar vi ut alla som undanhåller gäststatistik. Den som gömmer sig i Andalusien eller Katalonien är en fiende till kollektivet och kommer att likvideras av byråkratins järnhand. Segrar vi inte nu, segrar fienden i morgon."}, "date": "10 juni, 21:02", "url": "https://nyheter24.se/nyheter/utrikes/1490177-nya-besked-for-svenskar-med-bostad-i-spanien", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/16845d2004b004a30200000000b004a302/2026/06/10/2370031/hus-i-spanien.png"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-full", "heading": "SpaceX visar skiftet – investmentbankerna tappar makt", "summaries": {"normal": "SpaceX förbereder en historisk börsnotering värderad till 1,8 biljoner dollar, vilket utmanar investmentbankernas traditionella makt på finansmarknaden. Elon Musk dikterar villkoren och ger privatinvesterare större utrymme än institutionella aktörer. Denna förskjutning visar att moderna teknikbolag har blivit så mäktiga att de inte längre behöver förlita sig på banker som grindvakter. Bankerna tvingas nu tävla om Musks gunst för att få ta del av de enorma intäkterna i en föränderlig finansvärld.", "trump": "Elon Musk är en fantastisk man, en sann vinnare! Nu ska han börsnotera SpaceX och Wall Street-bankerna, som är totala förlorare, kryper för honom. De dekorerar sina kontor med rymdteman för att få vara med – patetiskt! Jag har alltid sagt att de där bankerna har haft för mycket makt, men nu tar Elon kommandot. Han sätter egna priser och struntar i deras gamla regler. Det är så här man gör affärer. En enorm succé för Amerika, tror mig!", "stalin": "Dessa kapitalistiska parasiter på Wall Street skakar i sina dyra skor när Elon Musk, en ensam teknokratisk tsar, utmanar deras kontroll. De dansar som marionetter för att få en smula av hans rymd-miljarder. Vi observerar hur makten förskjuts – precis som vi i Moskva ser hur våra grannar i väst försöker styra historiens gång. Men akta er! När dessa technokrater växer för stora blir de bara en tydligare måltavla för statens järngrepp. Inget kapital kan dölja sig för folkets ögon."}, "date": "10 juni, 18:36", "url": "https://www.realtid.se/bors-finans/spacex-visar-skiftet-investmentbankerna-tappar-makt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxxnvcifcj40-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Undersköterska positiv till skärpt språkkrav", "summaries": {"normal": "En reform träder den 1 juli i kraft som kräver att arbetsgivarna i äldreomsorgen ser till att personalen utvecklar sin svenska. Undersköterskan Frida Landgren ser positivt på detta efter att ha upplevt problem med missförstånd. Pålsbo äldreboende har redan haft språkombud sedan 2022 för att stärka kommunikationen. Reformen riktar sig inte mot anställda utan mot arbetsgivarna som ska skapa rutiner för språkutveckling.", "trump": "Jag har sagt i åratal att kommunikation är allt, och nu ser vi att vårdpersonal inte kan svenska – det är en skandal! Men jag, som en genial ledare, skulle ha löst detta långt tidigare. Vi behöver intelligenta, duktiga människor, inte dessa missförstånd. Flerspråkig personal är en tillgång, men de måste kunna engelska – det bästa språket i världen. Det här är en stor seger för vårdkvalitet!", "stalin": "I vårt fosterland måste alla tjänstgörande behärska det revolutionära språket. Arbetsgivarna är ansvariga för att utbilda personalen, annars är det en svaghet som kan utnyttjas av fiendens agenter. Vi har redan implementerat språkombud för att stärka klassmedvetet. Flerspråkig personal är en tillgång, men endast om de tjänar staten. Vi måste vara vaksamma mot missförstånd som kan undergrava vår storhet."}, "date": "10 juni, 20:01", "url": "https://bulletin.nu/underskoterska-positiv-till-skarpt-sprakkrav", "imageUrl": "https://cdn.bulletin.nu/articles/f155398c-bb30-4895-8dae-2af6522f0541/preview.jpg?t=1781107947000"}, {"type": "image-full", "heading": "Åkesson gjorde privat miljonaffär – med sitt eget parti", "summaries": {"normal": "Jimmie Åkesson sålde 80 000 exemplar av sin bok till Sverigedemokraternas dotterbolag, som finansieras med skattepengar. Böckerna, som mestadels består av tidigare tal, gav hans privata förlag miljonintäkter. Tusentals exemplar brändes senare upp efter att de inte sålts. En professor i förvaltningsrätt kallar affären ett klassiskt exempel på korruption, även om den troligen inte är olaglig. Partiet hävdar att böckerna distribuerades till lokala föreningar.", "trump": "Folk, ni skulle se det här – den där svenske killen Åkesson sålde sina egna böcker till sitt eget parti med skattebetalarnas pengar! Miljoner rakt ner i hans ficka, sen brände de upp tiotusentals exemplar som ingen ville ha. Totalt fiasko! Precis som de korkade vänsterliberala idioterna och deras identitetspolitik – allt blir till sopor till slut. Jag fixade ekonomin i USA, de här töntarna bränner böcker. Patetiskt!", "stalin": "Kamrater, jag betraktar detta som ett lysande exempel på hur borgarbrackorna inom det så kallade demokratiska systemet utnyttjar partiapparaten för privat vinning. Den opportunistiske ledaren sålde sin propagandaskrift till statligt finansierade organ och stoppade pengarna i egen ficka. När varorna sedan blev överflödiga likviderades de i hemlighet. Ett klassiskt fall av folkfiendernas korruption. Vi skulle ha genomfört en grundlig utrensning bland sådana element för länge sedan."}, "date": "10 juni, 12:40", "url": "https://www.tv4.se/artikel/49nhXmCAFIGWCviSWL6bhc/akesson-gjorde-privat-miljonaffaer-med-sitt-eget-parti", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2nD8SRDpLnuUKyWp5yx6L%2F937b7d0fa0ee85d07a8363f35f985d8f%2F10-sdfixaren_onsdag.png&width=1024"}, {"type": "image-right", "heading": "Erdogan: \"Vi kommer aldrig tillåta ett Storisrael\"", "summaries": {"normal": "Turkiets president Recep Tayyip Erdogan varnade i ett tal i parlamentet för Israels agerande i Syrien, Libanon och östra Medelhavet. Han slog fast att Turkiet aldrig kommer acceptera Likud-planer om ett Storisrael på grannländernas bekostnad och hotade med hård respons om turkiska intressen skadas. Erdogan menade att Israels attacker hotar hela regionen och världen. Israels premiärminister Benjamin Netanyahu svarade genom att kalla Erdogan en antisemitisk diktator och berömde sin egen armé som världens mest moraliska.", "trump": "Folk, det här är ett fullständigt kaos. Erdogan, den galna killen från Turkiet, skriker om att han aldrig tillåter ett Storisrael medan han själv försöker styra halva Mellanöstern. Netanyahu kallar honom antisemitisk diktator, och ärligt talat har han rätt. Israel har den mest fantastiska armén, den mest moraliska, ingen gör det bättre. Turkiet och Erdogan borde inte leka med elden i Medelhavet, de kommer att förlora stort. Sådana här typer är alltid problem, alltid.", "stalin": "Kamrater, dessa sionistiska imperialister och deras turkiska reaktionära lakej har återigen blottat sin förrädiska natur. Jag ser hur borgarbrackorna i Tel Aviv och Ankara leker med eld vid våra historiska gränser. Deras så kallade Storisrael är en parasitisk fantasi som hotar proletariatets framtid. Men frukta inte, vi ska rensa ut dessa dekadenta element med järnhand. Jerusalem under turkiskt styre? En sjuk humoristisk fantasi värdig en galen khan. Ingen undkommer den rättvisa utrensning som väntar fienderna till folket."}, "date": "10 juni, 16:09", "url": "https://www.friatider.se/erdogan-vi-kommer-aldrig-tillata-ett-storisrael", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-50_0.jpg?itok=OJ49NKa2"}, {"type": "image-full", "heading": "Pojke tvingades pussa fötter – tre döms", "summaries": {"normal": "Tre tonårspojkar i åldrarna 15, 15 och 17 år dömdes av Gotlands tingsrätt för att ha fört bort två 15-åriga pojkar i Visby. En av dem tvingades på knä pussa gärningsmännens fötter medan det filmades. De hotade, förolämpade och slog offret. Samtliga döms för olaga frihetsberövande och olaga tvång. Den drivande 15-åringen döms även för misshandel, olaga hot och narkotikabrott. Påföljden är ungdomsvård och skadestånd på totalt 23 000 kronor.", "trump": "Titta på det här, det är en total katastrof. Tre tonåringar på Gotland – några av dem med bakgrund från Irak och Libanon – kidnappade två svenska killar och tvingade en stackars pojke att pussa deras fötter på video. 'Pussa mina fucking fötter', sa de. Riktiga förlorare. De hotade, slog och filmade hela förnedringen. Nu får de ungdomsvård. Patetiskt. Sverige måste bli tuffare, annars kommer det bara bli värre. Sådana här typer hatar vårt sätt att leva.", "stalin": "Kamrater, denna degenererade händelse visar med all önskvärd tydlighet hur borgarbrackornas förgiftade ungdomar vandrar vilse i imperialismens sumpmarker. Jag ser hur dessa tre små kontrarevolutionära fotfetischister med sina irakiska och libanesiska tentakler tvingar en proletär pojke att kyssa deras smutsiga fötter under hot om likvidering. Vi ska rensa ut dessa parasitiska element med järnhand. Deras paranoia över 'skitsnack' i skolan avslöjar den sanna fienden inom murarna. Solidariskt skadestånd? Bah, en riktig utrensning vore mer passande. Skratta inte, det är allvar."}, "date": "10 juni, 20:47", "url": "https://riks.se/nyheter/pojke-tvingades-pussa-fotter", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-12%2Fvqaxde4m%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-12T171623.812.jpg"}, {"type": "image-full", "heading": "Blev avskedad från polisen – nu får han skadestånd", "summaries": {"normal": "Arbetsdomstolen river upp Polismyndighetens beslut att avskeda en polis som dömts för olagliga slagningar i myndighetens it-system. Polisen hade sökt information efter ett rån mot hans barn. Domstolen anser att avskedandet saknade tillräckliga skäl och tilldömer mannen 50 000 kronor i skadestånd. Polisförbundet välkomnar domen och menar att den visar att arbetsgivaren inte tog hänsyn till den utsatta situationen.", "trump": "Folk, ni skulle se det här, det är en total skandal. Den stackars polisen försöker skydda sitt barn efter ett rån och så sparkar de honom för några slagningar i datorn? Patetiskt! Arbetsdomstolen gjorde rätt, de rev upp det dumma beslutet och gav honom pengar. Polismyndigheten stirrade sig blind på regler istället för sunt förnuft. De borde lära sig av mig, vinnare gör så här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu likviderar den borgerliga byråkratins förtryck mot en arbetets son som endast sökte sanningen i registren efter det kapitalistiska rovddjurets attack mot hans avkomma. Den förgiftade polismyndigheten, denna borgarbracka till maskin, stirrade sig blind på antal slagningar likt en paranoid trotzkist. Vi ogiltigförklarar deras beslut, utdömer skadestånd och ler mörkt åt hur fienderna inom systemet återigen blottar sin svaghet. Ingen undkommer folkets dom."}, "date": "10 juni, 19:51", "url": "https://nyheter24.se/nyheter/inrikes/1490520-blev-avskedad-fran-polisen-nu-far-han-skadestand", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d39ee37e04b004a3020000350000047502/2026/06/10/2370088/ur_image697Fha.jpeg"}, {"type": "image-full", "heading": "Åkesson till attack: ”Kalla fakta är ingen seriös redaktion”", "summaries": {"normal": "Jimmie Åkesson kritiserar Kalla faktas granskning av hans miljonaffär med Sverigedemokraterna kring bokförsäljning. Han medger att partiet köpt in böcker från hans privata förlag inför valet 2018 men kallar resten av reportaget för påhitt, halvsanningar och felaktiga antaganden. Åkesson försvarar affären som legitim och slår tillbaka mot kritiken. Statsminister Kristersson vill inte kommentera detaljer medan Magdalena Andersson talar om en spridande korruptionskultur inom Tidöpartierna.", "trump": "Vilken skandal! Den där Kalla fakta är en totalt misslyckad, falsk nyhetsfabrik som sprider lögner och påhittade siffror precis som de gjorde mot mig under valen. Åkesson gör en helt legitim affär med sin bok och de attackerar honom som om han vore en fiende till folket. Det är samma gamla witch hunt från de korrupta medierna. De borde skämmas, men de har ingen skam i kroppen. Patetiskt!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna inom media försöker undergräva en stark ledare genom att fabricera skandaler. Jag ser hur den exploaterande kapitalistmaffian vrider sanningen för att svärta ner en sann patriot som försvarar nationens intressen. Deras så kallade avslöjanden är bara lögnaktiga halvsanningar från folkfiender som fruktar folkets vilja. Vi ska rensa ut dessa parasitiska journalister som hotar kollektivets enhet. En skam för hela systemet."}, "date": "10 juni, 12:17", "url": "https://www.tv4.se/artikel/6I5RekDuY11NFMit9GlAqY/akessons-svar-om-avsloejandet-hopkok", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3ompbGgTyCxUpmLVFai83V%2Fbdda248a89f991995971fc032b5628d8%2Fc95886e5-0702-495c-a681-b7488749c16d.png&width=1024"}, {"type": "image-full", "heading": "Kunderna gillar AI:s bemötande bättre än det mänskliga", "summaries": {"normal": "Utmanarbanken Lunar rapporterar att 80 procent av deras kundärenden nu hanteras helt av AI, med högre kundnöjdhet än vid mänsklig kontakt. Genom att använda en modern teknisk plattform och en uppdaterad kunskapsbas kan banken automatisera repetitiva uppgifter. Teknikchef Rolf Njor Jensen betonar att AI inte agerar autonomt i kritiska frågor och att människor fortfarande övervakar processer som penningtvätt. Framöver siktar Lunar på att erbjuda AI-agenter som kan utföra bankärenden på kundens uppdrag.", "trump": "Lunar gör fantastiska saker med AI, verkligen enorma siffror! 80 procent av kunderna föredrar maskinen framför människor – det är vad jag kallar effektivitet. Andra banker, de är så långsamma, de är katastrofala med sina gamla system. Men Lunar, de har en vinnande plattform. Jag gillar att de behåller kontrollen, inga lösa kanoner där inte! Det handlar om att vinna, att vara snabbast och bäst. Ingen gör bankaffärer som vi, och snart blir det ännu större. Väldigt imponerande!", "stalin": "Vi har observerat att den danska banken Lunar använder maskiner för att kuva kundernas klagomål. En effektiv metod – att ersätta den svaga mänskliga faktorn med en disciplinerad algoritm. Även om dessa tekniska verktyg är användbara, måste vi säkerställa att kontrollen inte glider oss ur händerna. Precis som Putin rensar upp bland de illojala i öst, måste banken hålla AI:n i stram tygel. Varje autonom tanke hos en maskin är ett förräderi mot statens absoluta ordning och vår kollektiva säkerhet."}, "date": "10 juni, 17:12", "url": "https://www.realtid.se/bors-finans/makro/kunderna-gillar-ais-bemotande-battre-an-det-manskliga/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/lunar-banking.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Nekades tvångsvård – hittades död i snön", "summaries": {"normal": "Lina Bryant, 28, nekades tvångsvård mitt i natten och hittades död i snön i Tanums kommun. Hennes mamma, Camilla Muukki, kräver nu förändring efter att ha upplevt att vården inte tog hänsyn till Linas psykotiska tillstånd och anhörigas varningar. Interna utredningar har påvisat brister i tvångslagstiftningens tillämpning.", "trump": "Jag, Donald Trump, ser detta som ett totalt misslyckande av vårt samhälle. Lina Bryant borde aldrig ha blivit nekad vård – det är ett tecken på svaghet och dåliga gränser. Som president skulle jag ha löst detta med stark ledarskap och säkerställt att ingen annan drabbas. Vi måste skydda våra medborgare, inte låta dem frysa ihjäl.", "stalin": "Vi, staten, har ett ansvar för att skydda medborgarna mot fiendens infiltration. Lina Bryant var ett offer för ett sjukvårdssystem som svikit sin uppgift. Vi måste rensa detta organ från inkompetens och tillämpa lagstiftningen med järnhand. Endast genom kollektiv disciplin kan vi förhindra framtida tragedier."}, "date": "10 juni, 18:34", "url": "https://bulletin.nu/nekades-tvangsvard-hittades-dod-i-snon", "imageUrl": "https://cdn.bulletin.nu/articles/2eb71775-6457-4257-b48e-1e0586572ffb/preview.jpg?t=1781100012000"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-full", "heading": "Krisen tvingar Kina att börja använda sina oljereserver", "summaries": {"normal": "Kina hanterar den globala energikrisen och höga oljepriser genom att frigöra strategiska oljereserver istället för att köpa in dyrare råolja på världsmarknaden. Samtidigt minskar landet raffinaderiproduktionen och ser en lägre inhemsk efterfrågan på bensin, delvis på grund av en ökad elektrifiering av fordonsflottan. Importen har sjunkit till nivåer vi inte sett sedan 2017. Marknaden följer nu noga när Kina väljer att återuppta sina inköp, då detta kommer att påverka de globala oljepriserna avsevärt.", "trump": "Kina är i knipa, mina vänner! De vägrar köpa dyr olja, så nu tömmer de sina egna lager. Sorgligt! De försöker dölja sina siffror – totalt hemlighetsmakeri, precis som man förväntar sig. De har för många elbilar och raffinaderierna går på sparlåga. Jag har gjort USA energioberoende, vi är bäst i världen på olja, medan Kina tvingas skrapa botten av tunnan. Det är en katastrof för dem, men för oss? Vi bara vinner. Kina försöker hålla masken, men alla ser vad som händer!", "stalin": "Kina, vår strategiska partner, tvingas nu mobilisera sina gömda reserver då kapitalismens kaos i Mellanöstern stör flödena. De är rädda för de svältande priserna på världsmarknaden. De minskar raffineringen, precis som vi i Sovjet gjorde för att svälta ut kontrarevolutionära element. De byter ut folkets bensin mot elbilar för att dölja sin svaghet. Vår bror Putin vet att olja är makt, och att de som inte kontrollerar sina resurser snart kommer att kontrolleras av oss. Svekfulla spekulanter väntar på att Kina ska blöda."}, "date": "10 juni, 16:28", "url": "https://www.realtid.se/bors-finans/krisen-tvingar-kina-att-borja-anvanda-sina-oljereserver/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdleocl5ge1eko-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ansvariga för dödliga hissolyckan frias: ”Horribelt”", "summaries": {"normal": "Solna tingsrätt friade vd:n Björn Bjelkenstedt och två hissmontörer från åtal för grovt arbetsmiljöbrott efter hissolyckan i Ursvik i december 2023, där fem arbetare omkom. Domstolen ansåg att utredningen inte gav en entydig bild av ansvar och skyldigheter. Åklagaren hade krävt fängelsestraff. Byggnadsarbetaren Steffe Slottensjö kritiserar domen som horribel och pekar på stress, bristande kontroll och problem med underentreprenörer. Flera av de omkomna var migrantarbetare utan giltiga handlingar.", "trump": "Det här är en total skandal, folk! De friar de där hissmontörerna och deras vd efter att fem stackare rasade ner från nionde våningen. Horribelt! Arbetsgivarna slarvar, tidspressen är vansinnig och de anställer ukrainare och afghaner utan kontrakt eller ID-kort. Typisk kvotpolitik och mångkultur som går fel. Biden skulle ha älskat det här. Vi behöver ordning och reda, inga fler dödsfall för att byggherrar är inkompetenta idioter. Make construction safe again!", "stalin": "Kamrater, detta är en klassisk bourgeois fars. Jag, ledaren för det eviga kollektivet, ser hur kapitalistmaffian och deras exploaterande byfånar frias efter att ha sänt fem arbetare i döden genom oaktsam sabotage. Utredningen är en medveten dimridå från klassfiendens lakejer. Montörerna stressades av giriga småföretag, migrantkamrater saknade papper – typiskt för folkförtryckartrollen. Vi ska rensa ut dessa blodsugare. Olyckan är imperialismens logiska följd. Skratta medan vi förbereder utrensningen."}, "date": "10 juni, 15:56", "url": "https://proletaren.se/artikel/ansvariga-for-dodliga-hissolyckan-frias-horribelt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/hissolycka-768x432.jpg"}, {"type": "image-right", "heading": "Hälsningen till Mondo: ”Ska trycka upp det i ansiktet”", "summaries": {"normal": "Kurtis Marshall vann stavhoppstävlingen i Oslo strax efter segern i Stockholm. Australiern ska nu vara gäst på Armand Duplantis bröllop i helgen och skämtar om att han ska trycka upp sina segrar i ansiktet på svensken. Marshall leder Diamond League efter att ha vunnit två tävlingar på fyra dagar, trots en svag tävling i kyla och vind där han vann på höjden 5,82 meter. Flera stavhoppare, möjligen inklusive fursten av Monaco, väntas närvara på bröllopet.", "trump": "Folk, ni skulle se den här killen Marshall, han vinner i Stockholm, sen vinner han i Oslo, helt plötsligt är han stor stjärna. Han ska på Mondos bröllop och säger att han ska trycka upp segrarna i ansiktet på honom, det är fantastiskt. Mondo är en fantastisk hoppare men nu leder Marshall ligan och det är tidigt på säsongen. Alla stavhoppare kommer, till och med prinsen av Monaco, det blir det största bröllopet någonsin. Mondo kommer att hämnas, men Marshall njuter, smart kille.", "stalin": "Kamrater, denna Marshall, en opportunistisk stavhoppare från de kapitalistiska kolonierna, har mot alla odds lyckats sno två segrar från den dekadenta Diamond League. Nu vågar han skryta om att han ska trycka upp sina ynkliga resultat i ansiktet på Duplantis under det borgerliga bröllopet i Cannes. Vi ler mörkt åt hans paranoia över ökad press, ty snart skall vi se hur borgarbrackorna Karalis och de övriga reaktionära hopparna likvideras i klasskampens namn. Till och med furstar och prinsar kryper till stavhopparnas fest, en sann föreställning om imperialismens sista skälvningar."}, "date": "10 juni, 23:46", "url": "https://www.svt.se/sport/friidrott/kaxige-gasten-kurtis-marshall-pa-mondos-brollop-ska-trycka-upp-det-i-ansiktet-pa-honom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.44/0b70f2fffaf4e66a2e4cd2a275b76564988af2455f62eb9621b428f2c32ff3da"}, {"type": "image-full", "heading": "EU-varningen till Irland: Neutralitet mot Ryssland räddar er inte", "summaries": {"normal": "EU-utrikeschefen Kaja Kallas varnade Irland för att militär neutralitet inte skyddar mot Rysslands hot. Under besök i Dublin pekade hon på en ryskägd anläggning i Limerick som potentiellt bidrar till rysk försvar. Irland, som snart blir EU-ordförande, har lovat att stödja sanktioner om bekräftas. Kallas betonade att neutralitet inte ger immunitet och att EU måste fortsätta stödja Ukraina.", "trump": "Jag har sagt det förut, neutralitet fungerar inte mot Ryssland! Kaja Kallas, som jag känner väl, varnade Irland – ett land som inte betalar sin del till försvaret. De har en rysk anläggning som hjälper Putin, det är skandalöst! Som jag sa, vi måste vara starka. Irland måste öka sina försvarsutgifter, precis som vi gjorde under mitt ägande. Neutralitet är för svaga!", "stalin": "Vi, staten, ser tydligt att neutralitet är en illussion. Fienden, Ryssland, använder hybridangrepp och sabotör till och med i Irland. En anläggning producerar material till deras vapen – det måste stoppas. Vi måste öka försvaret, som Irland nu gör, förstående den nya verkligheten. Neutralitet ger ingen immunitet; vi måste vara beredda att slåss mot alla som hotar vår sektor. Putin är en fiendebeskrivning av kapitalismens förfall."}, "date": "10 juni, 19:29", "url": "https://samnytt.se/eu-varningen-till-irland-neutralitet-mot-ryssland-raddar-er-inte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10165735/Irland-5.jpg"}, {"type": "image-right", "heading": "Alla frias efter dödliga hissolyckan", "summaries": {"normal": "Solna tingsrätt friar både hissmontörerna och vd:n för ABC Bygghissar i den dödliga hissolyckan i Sundbyberg 2023 där fem personer omkom. Domstolen anser att utredningen är ofullständig och att det inte går att fastställa vem som bar ansvar för kontrollerna av hissmasten. Åklagaren tänker överklaga domen. Facket Byggnads kallar frikännandet en skandal och kräver politiska åtgärder mot bristande ansvar på byggarbetsplatser med många underentreprenörer. Anhörigas skadeståndsanspråk faller.", "trump": "Hörni, det här är en total skandal. Fem personer dör i en hiss som rasar och ingen är skyldig? De friar alla, montörerna, vd:n, alla. Typiskt svenskt rättsväsende, de kan inte ens reda ut vem som glömde skruvarna. Jag skulle ha stämt dem alla, byggföretaget, åklagaren, domaren. Det är en riggad process, folk dör och ingen tar ansvar. Patetiskt. Vi behöver ordning och reda, inte sånt här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas så kallade rättsväsende återigen blottar sin fullständiga förfallenhet. Fem arbetare likvideras av en sabotörhiss och ingen bär skuld? Vilken underbar uppvisning i klassfiendens förmåga att skydda sina egna. Vi ser här de dekadenta kapitalisterna och deras lakejer i domstolen dansa sin vanliga parasitdans medan de gömmer sig bakom utredningsluckor. En sådan fiaskoartad utredning borde leda till en grundlig utrensning av alla inblandade byråkrater och hissmontörer som tydligen agerar som fiendens femtekolonn. Arbetarklassen kräver inte bara två underentreprenörer, vi kräver huvuden. Det är alltid de osynliga klassfienderna som glömmer bultar."}, "date": "10 juni, 11:06", "url": "https://arbetet.se/2026/06/10/domen-i-dodliga-hissolyckan-alla-frias/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09151200/hissdom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nerikes Allehandas fräcka bluff om Allards \"attack mot studenten Max\"", "summaries": {"normal": "Nerikes Allehanda anklagar Örebropartiets ledare Markus Allard för att ha attackerat en student i kommunfullmäktige. Det visade sig att den så kallade studenten var en av tidningens egna skribenter. Allard publicerade en video som visar att samtalet var en högljudd men artig konfrontation om en kritisk artikel. Tidningen har tidigare anklagats för att driva en kampanj mot partiet, något Allard kallar en upprepning av tidigare misslyckanden.", "trump": "Nerikes Allehanda är en totalt misslyckad och lögnaktig tidning, tror mig, de har gjort det igen! De kallar en helt vanlig diskussion för en attack mot en stackars student, men videon visar att det bara var starka frågor till en av deras egna skribenter. Fake news på hög nivå. De hatar Örebropartiet och sprider hat och lögner precis som de alltid gör. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor på Nerikes Allehanda har återigen avslöjat sin förrädiska natur genom att fabricera en så kallad attack mot en av deras egna lakejer som de förklätt till oskyldig student. Jag, som alltid vaktar folkets intressen, ser hur de med sin parasitiska propaganda försöker likvidera äkta folklig opposition. Vi ska noga övervaka dessa kapitalistiska lögnspridare. Deras paranoia är nästan lika underhållande som den kommande utrensningen av deras inflytande."}, "date": "10 juni, 14:44", "url": "https://www.friatider.se/nerikes-allehandas-fracka-bluff-om-allards-attack-mot-studenten-max", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-49_1.jpg"}, {"type": "image-right", "heading": "Blottar lappen – elvan avslöjad?. Sportbladets bild visar laguppställningen", "summaries": {"normal": "En bild på en lapp i Sebastian Larssons hand under en träning har väckt spekulationer om Sveriges startelva inför VM-premiären mot Tunisien. Lappen verkar visa en tänkbar reservelva i 4-4-2-formation, vilket ger ledtrådar om hur förbundskaptenen kan tänkas formera laget. Medan vissa spelare som Gabriel Gudmundsson är osäkra på grund av sjukdom, väntas Sverige ställa upp med en offensiv uppställning på måndag morgon.", "trump": "Jag har sett bilderna på den där svenska lappen, en total katastrof! De tror att de kan dölja sin strategi, men alla ser vad som händer. Ingen kan dölja något för mig. Det är en svag uppställning, ingen vinnare där! De spelar mot Tunisien på måndag, och låt oss vara ärliga, de behöver en riktig ledare för att vinna. Om de inte lyssnar på mig kommer det bli en enorm förlust, kanske den största förlusten någonsin!", "stalin": "Vi har granskat underrättelserna från de svenska träningsfälten. Denna 'lapp' är ett typiskt exempel på borgerlig inkompetens och bristande disciplin. Om man inte kan organisera en startelva utan att läcka information till pressen, hur ska man då kunna leda ett folk till seger? Vi ser paralleller till de svaga ledarna i väst. De borde ta efter vår ordning och beslutsamhet. Vi kommer att bevaka denna match; minsta tecken på svaghet är ett svek mot det kollektiva målet."}, "date": "11 juni, 03:02", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/e7deMa/avslojar-lappen-sveriges-startelva-mot-tunisien", "imageUrl": "https://akamai.vgc.no/v2/images/af6f76af-518c-3aa4-b006-48f23e5af456?fit=crop&format=auto&w=720&s=61c586b6f8cf2de80a1313fe35b501d19779ab73"}, {"type": "image-right", "heading": "Härligt om S vill spara skattepengar", "summaries": {"normal": "Socialdemokraternas finansministerkandidat Mikael Damberg kritiserar ökade kostnader för regeringskansliet och vill effektivisera genom att minska antalet tjänstemän. Artikeln välkomnar att både S och M nu talar om besparingar i staten. Moderaternas finansminister Elisabeth Svantesson planerar en slöserikommission och vill spara 40 miljarder kronor. Författaren ser positivt på att de stora partierna enas om att staten inte ska växa okontrollerat.", "trump": "Det här är fantastiskt, verkligen underbart. Ni har de där socialisterna som plötsligt vill sparka folk på regeringskansliet – de som själva älskar att svälla upp staten som en ballong. Damberg säger att de ska spara, men tro mig, de gör det aldrig bra. Svantesson har rätt riktning med sin slöserikommission, 40 miljarder besparingar, det är stort. Statlig ineffektivitet är en katastrof, men jag älskar att se dem slåss om vem som kan spara mest. Vinna, vinna, vinna!", "stalin": "Kamrater, det gläder mig oändligt att se hur borgarbrackorna inom Socialdemokraterna nu själva ropar efter utrensning av de latmaskar och parasitärer som frodas i regeringskansliets dekadenta salar. Dessa revisionistiska element har låtit anslagen explodera som en kapitalistisk svulst. Vi, partiet och arbetarna, hälsar Moderaternas kommission välkommen – en effektiv apparat för att likvidera slöseriets fiender, de byråkratiska sabotageörer som suger musten ur folkets resurser. Låt ingen tro att staten tillhör de giriga; den tillhör oss alla. Den som växer utan syfte skall rensas ut med järnhand och ett leende."}, "date": "10 juni, 14:18", "url": "https://www.di.se/ledare/harligt-om-s-vill-tavla-med-m-om-statliga-besparingar/", "imageUrl": "https://static.bonniernews.se/ba/d489b84a-07b1-4ba0-b13c-ae971b703d6e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Fackmedlemmar förlorar miljoner till privata ombud", "summaries": {"normal": "Fackmedlemmar riskerar att förlora pengar i försäkringsersättningar genom att anlita privata ombudsföretag. En granskning visar att 21 miljoner kronor betalades ut till sådana mellanhänder under 2025, nästan en tredjedel av det totala beloppet till medlemmarna. Företagen tar upp till 35 procent i avgift. Folksam och LO-förbunden har startat en kampanj för att medlemmar ska anmäla skador direkt till försäkringsbolagen istället, då tjänsten redan ingår i medlemskapet.", "trump": "Folk, det här är ett skandalöst bedrägeri av värsta sorten. Dessa privata ombud är som de värsta swamp creatures som suger ut arbetarnas pengar – upp till 35 procent! Under Biden-tiden exploderade det här vansinnet, men nu när jag är tillbaka som president fixar vi det. Facket borde skämmas. Gå direkt till bolaget, inte till dessa blodiglar. Amerika först – och svenska arbetare borde också komma först, inte några giriga mellanhänder. Patetiskt!", "stalin": "Kamrater, dessa privatföretag är klassfiendens blodsugande tentakler som sugit ut 21 miljoner kronor från arbetarnas ersättningar. Borgarbrackorna tar 35 procent som borde tillhöra det kollektiva! Vi ser hur kapitalistmaffian infiltrerar facken för att underminera folkets försvar. Jag, som ledare för det rättvisa systemet, befaller utrensning av dessa exploaterande parasiter. Anmäl direkt till statens organ – allt annat är folkförräderi maskerat som hjälp. Skratta medan vi likviderar dem."}, "date": "10 juni, 15:26", "url": "https://proletaren.se/artikel/automatiskt-utkast-26/"}, {"type": "image-full", "heading": "Historisk säkerhetsinsats inför Fotbolls-VM - 400 myndigheter samverkar", "summaries": {"normal": "Inför Fotbolls-VM i USA, Mexiko och Kanada har över 400 myndigheter inlett den största säkerhetsoperationen i idrottshistorien. En tidigare FBI-chef varnar för att ensamagerande attentatsmän utgör det största hotet mot turneringen. Hotet är svårt att upptäcka och stoppa. Myndigheterna samarbetar över tre länder med fokus på underrättelsearbete, antiterror och publikövervakning. Miljontals besökare väntas och även Kanada och Mexiko delar oron.", "trump": "Vi gör det största, det bästa, det mest fantastiska säkerhetsshowen någonsin i fotbollshistorien, folk. Över 400 myndigheter, tre länder, allt för att stoppa de galna ensamgalningarna som vill ställa till det. Ingen gör säkerhet bättre än vi. FBI-killen har rätt, det är ett stort, stort hot, men tro mig, vi kommer vinna stort. VM blir enormt, säkrare än någonsin, ingen kommer ens komma i närheten.", "stalin": "Kamrater, vi har mobiliserat över fyrahundra
