rycket i pensionssystemets själva grund. Jag varnade redan då de införde denna livsinkomstprincip, men de lyssnade inte. Nu tvingas majoriteten av äldre kvinnor leva på miniminivå som fattigpensionärer. Detta är ett hån. Det krävs omedelbar utrensning av den slutna Pensionsgruppen och en återgång till öppet sovjetiskt, det vill säga folkligt, beslutsfattande. Inga kompromisser med folkets fiender."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/det-racker-nu-infor-ett-pensionssystem-vart-namnet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-80-300x157.jpg"}, {"type": "image-right", "heading": "Vi inför en biljett för bussar och regionaltåg i hela landet", "summaries": {"normal": "Under Tidö-regeringen har klimatarbetet gått bakåt i fyra år och missat både svenska och europeiska mål. Vänsterpartiet förespråkar satsningar på järnväg, billig kollektivtrafik och en permanent Sverigebiljett. Exempel från andra länder visar att lägre biljettpriser minskar utsläppen. Partiet lyfter lokala initiativ och uppmanar till röst på vänstern istället för borgerliga kopior.", "trump": "Folk, dessa vänstervridna radikaler har totalt misslyckats i fyra år med sin så kallade gröna bluff. Nu när valet närmar sig kopierar de svaga Tidö-typerna plötsligt vår idé om billiga tåg och bussar. Patetiskt! Jag fixade det bättre, större och billigare. Rösta på de som faktiskt levererar, inte på dessa klimatångest-drivande förlorare som hatar friheten.", "stalin": "Kamrater, dessa dekadenta klassförrädare har i fyra år saboterat folkets klimatomställning och lämnat arbetarna i sticket. Nu i valet försöker de stjäla våra idéer om kollektivtrafik och järnvägar för att dölja sin egen svaghet. Jag ler från historien åt deras ynkliga kopiering. Rensa ut de giriga profittyranner och bygg det gemensamma med järnhand. Handlingskraft, inte ångest!"}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/vi-infor-en-biljett-bussar-och-regionaltag-hela-landet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-79.jpg"}, {"type": "image-right", "heading": "Tidernas mest osakliga valrörelse?", "summaries": {"normal": "Författaren beskriver den svenska valrörelsen som osaklig och snuttifierad. Medier och partier fokuserar på spel, opinionsmätningar, affärer och lögner istället för visioner om samhällets framtid. Stora frågor som klimat, AI, migration och krig hamnar i bakgrunden. Detta skadar demokratin och väljarnas möjligheter att fatta välgrundade beslut.", "trump": "Den här svenska valrörelsen är en total katastrof, folk! Full av fuskande medier och patetiska politiker som bara leker spel istället för att prata om riktiga problem. De fokuserar på lögner och småskit medan de stora frågorna som AI och klimat dör. Rena clownshowen. Jag fixade Amerika – de borde lära sig innan det är för sent.", "stalin": "Kamrater, denna dekadenta valcirkus är en klassisk symptom på hur de profitthungriga klassförrädarna förgiftar folkets medvetande. Istället för att tala om det socialistiska samhällets framtid ägnar de sig åt lögner och smådrama. Vi måste rensa ut dessa fiender till folkets vilja innan de drar hela nationen ner i avgrunden. Se upp!"}, "date": "11 september, 01:19", "url": "https://www.dagensarena.se/opinion/tidernas-mest-osakliga-valrorelse", "imageUrl": "https://www.dagensarena.se/files/2026/09/valrorelse-300x157.jpeg"}, {"type": "image-right", "heading": "Gammal fascism i ny kostym", "summaries": {"normal": "Artikeln kritiserar partiet Alternativ för Sverige (AFS) som ett högerextremt parti med rasistisk och arbetarfientlig politik. AFS anklagas för att vilja ställa arbetare mot invandrare istället för att rikta kritiken mot kapitalister. Författaren, själv undersköterska, varnar för att partiets program skulle leda till kollaps inom vård och omsorg.", "trump": "Lyssnar ni på det här? Dessa AFS-typer är fullständiga losers som klär gamla fascistiska idéer i ny kostym. De vill spela ut arbetare mot invandrare medan de riktiga vinnarna, de globala elitsnyltarna, skrattar hela vägen till banken. Patetiskt! Vi behöver inga kvotfascister eller identitetspolitiska nollor, bara vinnare som sätter Amerika och verkliga jobb först.", "stalin": "Kamrater, dessa dekadenta klassförrädare i AFS försöker med sin reaktionära giftpropaganda splittra arbetarklassen och rikta vreden mot fel fiende. Jag ser rakt igenom deras falska harmoni med penninggalna hyenor. I ett sant folkstyre skulle sådana element genomgå grundlig utrensning. Deras dröm om ett korporativt Sverige är en löjeväckande parodi på verklig socialism."}, "date": "10 september, 10:24", "url": "https://proletaren.se/artikel/gammal-fascism-i-ny-kostym", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/afskronika-768x432.png"}, {"type": "image-right", "heading": "När Centerpartiet råkade införa nyliberal sharia", "summaries": {"normal": "Uppdrag granskning har avslöjat att privata jobbcoacher finansierade av Arbetsförmedlingen ibland hjälper män som vill hålla sina fruar hemma och isolerade från samhället. Avslöjandet riktar kritik mot Centerpartiets drivna privatiseringar inom välfärden, där skattepengar går till företag som understödjer hederskultur istället för att främja arbetsmarknadsintegration.", "trump": "Folk, ni måste höra det här. Den svenska vänstern och deras nyliberala centerbluffar har skapat en total katastrof. Skattepengar går till woke-coacher som hjälper latmanskillar att låsa in fruarna i köket. Det är en skam! Biden skulle älskat det, men jag fixar upp det – inga fler bidrag till dessa dekadenta identitetsmarxister och deras hemska kvotergalna politik.", "stalin": "Kamrater, se hur dessa giriga hyenor inom det borgerliga partiet Center låter marknaden styra allt, till och med att rusta män för att matcha kvinnor med köksbänken. Jag betraktar detta med avsmak från historien. En sådan parasitär klassförräderi förtjänar snar utrensning ur samhällskroppen. Det är löjligt och farligt på samma gång."}, "date": "10 september, 14:25", "url": "https://www.flamman.se/nar-centerpartiet-rakade-infora-nyliberal-sharia", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/sdl6euzsag7fsm-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Oligarkerna styr även efter valet", "summaries": {"normal": "Artikeln kritiserar den svenska valrörelsen där partierna lagt rekordstora summor på reklam. Den pekar på att både Tidö-regeringen och Socialdemokraterna saknar verklig vänsterpolitik. Författaren menar att alla riksdagspartier stödjer militär upprustning som hotar välfärden och kräver en stark opposition mot högerpolitik, nedskärningar och repression.", "trump": "De här svenska politikerna är totala misslyckanden, folk. Miljarder slängs på reklam medan oligarkerna och de giriga globalisterna styr bakom kulisserna. Andersson är en svag ledare som böjer sig för Wallenbergs och hans dekadenta vänner. De hatar verkliga arbetare och älskar krigshets. Patetiskt! Jag skulle dränera träsket på en vecka.", "stalin": "Kamrater, dessa profitthungriga klassförrädare fortsätter att låtsas som om de styr medan de blodsugande oligarkerna drar i trådarna. Deras så kallade val är en fars som döljer den fortsatta exploateringen av folket. Jag ser hur de rullar fram militärens vagnar och förbereder nya nedskärningar. En sann utrensning av dessa parasiterande hyenor vore på sin plats."}, "date": "10 september, 09:59", "url": "https://proletaren.se/artikel/vad-hander-efter-valet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledarbildweb-768x432.jpg"}, {"type": "text", "heading": "Trump utlovar pengaregn vid valseger", "summaries": {"normal": "Vid ett republikanskt konvent i Texas utlovade Donald Trump 5 000 dollar till varje vuxen amerikan om partiet vinner mellanårsvalet. Trump varnade för skattehöjningar och minskad säkerhet om Demokraterna vinner. Presidenten föreslog även att döpa om New Mexico till New America och Hormuzsundet till Trumpsundet, trots att finansieringen och genomförandet av löftena är oklart.", "trump": "Jag har den bästa idén någonsin – en massiv utdelning till folket! Om vi vinner stort, och det kommer vi göra, får varje amerikan 5 000 dollar. Det är som en enorm vinstutdelning för vårt land! Och New Mexico? Namnet låter föråldrat. Vi döper om det till New America, vackert! Hormuzsundet? Trumpsundet. Mycket bättre, mycket starkare. Enkelt!", "stalin": "Denna amerikanske charlatan försöker köpa undersåtarnas lojalitet med trycksvärta och tomma löften. Att muta befolkningen med 5 000 dollar är ett kapitalistiskt haveri maskerat som generositet. Att dessutom vilja döpa om geografiska platser efter sig själv är ett patetiskt rop på odödlighet. Vi i staten vet att sann makt inte kräver mutor, bara en järnhand och ett effektivt angivarsystem."}, "date": "10 september, 08:06", "url": "https://www.realtid.se/tt-nyhet/trump-utlovar-pengaregn-vid-valseger"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
