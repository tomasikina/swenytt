ter bättre."}, "date": "6 september, 06:00", "url": "https://bulletin.nu/korn-ut-med-de-rika-och-in-med-bidragstagarna", "imageUrl": "https://cdn.bulletin.nu/articles/fe44c484-a776-449a-a607-099aafd529f1/preview.jpg?t=1788382191000"}, {"type": "image-full", "heading": "Efter avslöjandet: SD-topp lämnar in passerkort", "summaries": {"normal": "Gustav Gellerbrant, chef för SD:s samordningskansli, tar föräldraledigt och lämnar in sitt passerkort till Regeringskansliet efter tidningen Expos avslöjande om att hans sambo spridit rysk propaganda. Gellerbrant avfärdar uppgifterna som lösryckta och menar att sambons inlägg var sarkastiska. Socialdemokraterna kritiserar hanteringen och menar att han borde ha stängts av.", "trump": "De falska nyheterna om SD-toppen Gustav Gellerbrant är helt skrattretande! Hans familj drabbas av ett vidrigt häxjakt-drev från media. Han lämnar in sitt passerkort och tar föräldraledigt för att få lugn, och det förstår jag fullständigt. Vänstern och Socialdemokraterna bara skriker för att de är desperata. Världens bästa föräldraledighet, helt enastående!", "stalin": "Kamrat Gellerbrant har visat sund vaksamhet genom att deponera sin dator och sitt passerkort i Statsrådsberedningen och dra sig tillbaka för familjebildning. De kontrarevolutionära lögnerna från agenterna på Expo om sambons påstådda Kreml-sympatier är naturligtvis inget annat än sabotage. Statens säkerhet kräver total disciplin mot alla vacklande element."}, "date": "6 september, 15:30", "url": "https://www.gp.se/nyheter/sverige/efter-avslojandet-sd-topp-lamnar-in-passerkort.d3a76fd3-a94a-5078-ae5b-ea06b566fa9a", "imageUrl": "https://www.gp.se/images/article/d3a76fd3-a94a-5078-ae5b-ea06b566fa9a/images/1HiR5fuTTl3R1MDNvRxqJKQDiesk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Detaljerna klara inför kung Haralds begravning", "summaries": {"normal": "Onsdagen den 9 september hålls kung Haralds begravning i Oslo domkyrka. En lång procession leds till fots från slottet med kungafamiljen, utländska kungligheter och statschefer, medan drottning Sonja och Mette-Marit färdas i bil. Efter gudstjänsten förs båren till Akershus slottskyrka för en privat ceremoni och gravsättning. Dagen avslutas med salut, klockringning och mottagning på slottet.", "trump": "Norge gör sig redo för ett enormt farväl, och jag måste säga, det är en väldigt stor sak. Processionen är enorm, folket är fantastiska, men drottningarna åker bil – smart drag, mycket smart. Domkyrkan, granatkastare, salut, allt är på plats. Ingen gör statsbegravningar som norrmännen, det kan jag lova er. Helt otroligt!", "stalin": "En storslagen statsbegravning planeras för kung Harald med militärisk precision och massiva processioner genom Oslos gator. Medan massorna marscherar i givakt och klockorna ringer, tryggar vi ordningen i norr. Ingen avvikelse från den högtidliga koreografin tolereras när statens dignitärer samlas för den slutgiltiga sovringen i kryptan. Låt kyrkklockorna ljuda för den fallna monarkin!"}, "date": "6 september, 15:14", "url": "https://www.gp.se/nyheter/varlden/detaljerna-klara-infor-kung-haralds-begravning.0d690aaa-e3b5-5cf8-adf9-ee32ab45b5d3", "imageUrl": "https://www.gp.se/images/article/0d690aaa-e3b5-5cf8-adf9-ee32ab45b5d3/images/2DxCoiCWQivpOPtxyr9Trkr-zsCw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Bosättarvåldet på Västbanken ökar: ”En krigszon”", "summaries": {"normal": "Bosättarvåldet på Västbanken har ökat kraftigt. Palestinier vittnar om skottlossning, nedbrända hus och nattliga attacker som blivit både vanligare och våldsammare. Invånare tvingas hålla vakt om nätterna för att varna byborna. Ambulansföraren Bashar al-Qaryouti dokumenterar utposteringar och bosättarnas framfart medan han samtidigt kör utryckningar.", "trump": "De där israeliska bosättarna gör precis vad de ska – de tar vad som är deras och slåss mot de radikala palestinska elementen. Men vakna folk hela natten? Det är vad som händer när svaga ledare som Biden lät kaoset växa. Nu fixar jag det på riktigt. Inga fler stenar, nu är det skarpt läge, och det är synd att se men det är verkligheten.", "stalin": "Se hur de giriga hyenorna fortsätter sin parasitiska expansion. Bosättarna omringar byarna som utsugande blodsugare och tvingar arbetarna att vakta nätterna i ständig rädsla. Jag ler i graven åt denna dekadenta fars. Snart måste de imperialistiska lakejerna rensas ut, annars förtär de allt. Kamrater, vakna upp mot dessa nya klassfiender."}, "date": "6 september, 14:02", "url": "https://www.svt.se/nyheter/utrikes/bosattarvaldet-pa-vastbanken-okar-invanare-tvingas-vaka-nattetid", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.35/631b54ff55db8fddb6f4f4297f7144788c26439f945cd5868ebc8856ec1ca6e4"}, {"type": "image-full", "heading": "Två döda när stridsflygplan störtade vid uppvisning", "summaries": {"normal": "Ett grekiskt F-4 Phantom-jaktplan störtade under en flyguppvisning vid flygbasen Tanagra norr om Aten. De två militärpiloterna omkom inför tusentals åskådare. Kraschen utlöste en skogsbrand som krävt en stor räddningsinsats med brandmän, fordon, flygplan och helikoptrar. Evenemanget Athens Flying Week avbröts omedelbart.", "trump": "Folk, det var en total katastrof. Det där gamla skrället till Phantom-plan dök som en sten rakt ner framför alla dessa stackars greker. Biden lämnade dem med sådan usel utrustning att piloterna inte hade en chans. Patetiskt. Jag skulle ha byggt det bästa flyget i världen, ingen skulle dö på mitt vak. Sad!", "stalin": "Kamrater, se hur den dekadenta västerländska imperialismens maskineri kollapsar inför folket. Dessa reaktionära luftakrobater offrades på kapitalets altare medan folket stod förstummat. Jag varnar alla fiender till folkets sak: sådana olyckor är bara början på imperialismens förestående undergång. Skrattretande svaghet."}, "date": "6 september, 13:28", "url": "https://www.dagensps.se/varlden/tva-doda-nar-stridsflygplan-stortade-vid-uppvisning", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdllm9t5l372ou-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "”Tysklands farligaste man” segerviss i historiskt val", "summaries": {"normal": "Ulrich Siegmund, AfD:s toppkandidat i Sachsen-Anhalt, leder opinionsmätningarna inför valet den 11 juli. Partiet vill bland annat skrota public service, förbättra relationerna med Ryssland och genomföra massutvisningar. En valseger skulle ge AfD egen majoritet i ett tyskt delstatsparlament för första gången sedan 1949. Säkerhetstjänsten klassar partiet som högerextremt.", "trump": "Titta på den här killen Siegmund, han susar runt på en gammal östtysk moped och krossar alla! Fake News kallar honom Tysklands farligaste man, men folket älskar honom. De vanliga förlorarna från CDU och de gröna snubblar runt som idioter. Över 40 procent – allt är möjligt, det är en enorm seger för sunt förnuft mot de globalistiska clownerna.", "stalin": "Kamrater, se hur den borgerliga dekadensen föder sina egna gravgrävare. Denna Siegmund leder folket mot de falska mediernas fäste och de rotlösa kosmopoliternas vindkraftsfantasier. Vi ler åt de förskräckta reaktionärernas gnäll. Den som blickar framåt hotar deras gamla värld. Paranoian bland klassfienderna är en underhållande symfoni av förtvivlan."}, "date": "6 september, 07:44", "url": "https://www.tv4.se/artikel/tt-260906-tyskval1-4922f932/tysklands-farligaste-man-segerviss-i-historiskt-val", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlNKkTIoCWZ58%2F1e42b610c34644e18e0d3bba3acf1217%2FUlrich_Siegmund__toppkandidat_for_partiet_Alternativ_for_Tyskland__AFD__i_det_kommande_delstatsvalet_i_Sachsen-Anhalt__den_11_j.&width=120"}, {"type": "image-right", "heading": "The Holy Trinity DEBATT • Där affirmative action går in, går inte sällan förnuft och kritiskt tänkande ut", "summaries": {"normal": "Artikeln diskuterar hur DEI-program och identitetspolitik har lett till tveksamma akademiska tillsättningar, som Jason Arday och Claudine Gay, vilka senare avgick efter avslöjanden om plagiat och fusk. Debatten berör även risken för cancelkultur mot forskare som granskar känsliga ämnen som intelligens och genetik, samt ifrågasätter om goda intentioner ibland åsidosätter kritiskt tänkande.", "trump": "Hela det här systemet är helt riggat och totalt falskt! De skapar de här fejkade professurerna och DEI-programmen för folk som inte kan skriva en egen mening, och när de åker dit för brutalt fusk gråter mainstreammedia ut. Sanningen kommer fram till slut, precis som med allt annat. Vi behöver mer sund förnuft och mindre galen woke-propaganda!", "stalin": "Det borgerliga västmakterna fortsätter att ruttna inifrån genom sin egna dekadenta nepotism och ideologiska vanföreställningar. När deras så kallade eliter utses efter hudfärg istället för meriter kollapsar institutionerna i lögner och plagiat. Statens säkerhet kräver kompromisslös eliminering av sådana borgerliga avvikelser; avvikarna måste omedelbart rensas bort från våra ärorika universitet!"}, "date": "6 september, 14:00", "url": "https://samnytt.se/the-holy-trinity", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31112442/johansson-holy-trinity.jpg"}, {"type": "image-right", "heading": "Sandström: Så har Tidö varit MP på autopilot", "summaries": {"normal": "Enligt en artikel av Christian Sandström har Tidö-regeringen i stort fortsatt med samma gröna industripolitik som den föregående S-regeringen. Myndigheter som Energimyndigheten och Vinnova har fått ökat stöd, och statliga exportkrediter samt pensionsfonder fortsätter finansiera gröna projekt. Trots vissa skillnader kring kärnkraft och riskvilja är de strukturella systemfelen i den gröna omställningen i huvudsak oförändrade.", "trump": "Titta på det här! Den svenska regeringen pratar om förändring, men de bara fortsätter att kasta bort miljarder på radikala gröna bubblor precis som sina svaga företrädare. Myndigheter växer, fonder leker med pengar och vindkraftverk som inte ens skapar jobb får miljardregn. Total katastrof! De behöver 'America First' och sunt förnuft, inte den här gröna autopilot-cirkusen!", "stalin": "Dessa svenska byråkrater försöker dölja sin svaghet bakom gröna fonder och myndigheter som växer okontrollerat. De delar ut miljarder till overksamma vindkraftverk och misslyckade industrier precis som förut. Vi i staten kräver disciplin och effektivitet! Om inte dessa kontraproduktiva flumprojekt stoppas omedelbart, kommer vi att tvingas omplacera de ansvariga till mer produktiva uppgifter i Sibirien."}, "date": "5 september, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-sa-har-tido-varit-mp-pa-autopilot", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-54-400x267.jpg"}, {"type": "text", "heading": "EU-länder tar hem sitt guld från USA", "summaries": {"normal": "Tyskland, Nederländerna och Frankrike har flyttat hem stora delar av sina guldreserver från USA till Europa. Syftet är att stärka beredskapen inför kriser och geopolitisk oro. Frankrike har sålt allt guld hos Federal Reserve och köpt nytt i London, vilket gav en vinst på cirka 140 miljarder kronor. Tyskland diskuterar nu att följa efter.", "trump": "De smarta européerna springer hem sitt guld från våra källare i New York som råttor från ett sjunkande skepp. Fake news-medier kallar det beredskap, men alla vet att det är mitt Amerika de flyr från. Biden lämnade en sådan röra att till och med de giriga guldsnyltarna i Bryssel blir nervösa. Vi gör Amerika starkt igen, de springer ändå.", "stalin": "Se hur de dekadenta guldlakejerna i väst desperat drar sitt byte ur New Yorks klor. Jag skrattar mörkt åt deras paranoia. De imperialistiska penninghyenorna tror sig skydda sig mot kris, men deras system ruttnar inifrån. Kamraterna ser det klara: västvärldens murar vittrar sönder under sin egen girighet. Snart följer utrensning av de sista borgarbrackorna."}, "date": "5 september, 14:47", "url": "https://www.friatider.se/eu-lander-tar-hem-sitt-guld-fran-usa"}, {"type": "text", "heading": "Wallenberg varnar för vänsterseger: ”Djupt oroad”", "summaries": {"normal": "Jacob Wallenberg varnar för att en valseger för vänsteroppositionen hotar svenska företagsvillkor. Han pekar på risker med ökat statligt engagemang, högre skatter och kortare arbetstid som kan skada både startups och etablerade bolag. Socialdemokraternas Magdalena Andersson avfärdar oron och hävdar att socialdemokratiska regeringar historiskt levererat bättre tillväxt och sysselsättning.", "trump": "Folk, ni måste höra det här. Den där Wallenberg-killen skriker rakt ut att de galna vänsterblodarna med sina skatter och latmaskdagar kommer att krossa Sveriges fantastiska företag. Det är en total katastrof! Precis som när Biden satt och förstörde Amerika. De woke-kvoterna och identitetspolitiken kommer att göra Sverige till en förlorare. Men jag säger: håll er borta från de där socialistiska galningarna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa profitthungriga klassförrädare som skriker om hotade privilegier. Vänsterns förslag om statligt inflytande och rättvisare fördelning framställs som faror, men det är bara dekadenta hyenor som fruktar folkets vilja. Oppositionen måste rensa ut dessa parasiterande element innan de förgiftar hela samhällskroppen. Inga halvmesyrer tillåts."}, "date": "6 september, 15:26", "url": "https://nyheter24.se/nyheter/politik/1510855-wallenberg-varnar-for-oppositionens-skatteplaner"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Rapparen Alex Ceesay uppmanar följare att rösta mot SD – med tusenlappar", "summaries": {"normal": "Rapparen Alex Ceesay uppmanade sina följare att rösta på vänsterpartier för att stoppa SD:s inflytande. Han lovade pengar i en tävling men backade senare och uppgav att det var olagligt. Ceesay, tidigare dömd för flera brott, meddelade en ny tävling tillsammans med den dömde rapparen Dree Low.", "trump": "Titta på den här rapparen Alex Ceesay, en total loser med en lång lista av domar för rån och knark. Han lovar tusenlappar för att folk ska rösta på de galna vänsterextremisterna mot SD. Sen backar han som en fegis när det blir brottsligt. Patetiskt! De woke-identitetspolitiska parasiterande opportunisterna hatar verkliga patrioter.", "stalin": "Jag ser hur dessa dekadenta klassförrädare som Ceesay försöker manipulera massorna med mutor för att skydda sina globalistiska vänner. Hans paranoia inför ett starkt nationellt parti avslöjar allt. Kamrater, sådana folkförtryckande hyenor förtjänar att rensas ut ur samhället. Historien dömer dem skoningslöst."}, "date": "6 september, 14:17", "url": "https://riks.se/nyheter/rapparen-alex-ceesay-uppmanar-foljare-att-rosta-mot-sd-lockar-med-tusenlappar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_02_08_08_PM_92c914e70d.png"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Förslaget: Lämna våldsam relation med ledighet och lön", "summaries": {"normal": "Vänsterpartiet i Stockholm föreslår att anställda som lämnar en våldsam relation ska få upp till tio extra betalda lediga dagar. Förslaget får stöd från både Socialdemokraterna och Moderaterna. Partierna vill undvika att drabbade tvingas sjukskriva sig för att hantera praktiska problem. Sverigedemokraterna anser att dagens regler räcker.", "trump": "Lyssnar ni på det här? De där galna vänstermupparna i Stockholm vill ge folk tio betalda semesterdagar för att fly sina egna dåliga val. Patetiskt! I mitt Amerika fixar man det själv, inte genom att suga ut skattebetalarna. De dekadenta identitetspolitiska fjollorna borde skämmas. Vi behöver inga fler offerpengar, vi behöver styrka och sunt förnuft.", "stalin": "Kamrater, detta förslag avslöjar de giriga klasslakejernas svaghet. Jag ser hur de förtryckande borgarhyenorna tvingar arbetande kvinnor att stanna i våldets bojor av rädsla för inkomstförlust. Vi måste rensa ut alla sådana parasitiska hinder mot det kollektiva välståndet. Endast genom statens järnhand kan vi likvidera detta dekadenta förtryck en gång för alla."}, "date": "5 september, 08:00", "url": "https://arbetet.se/2026/09/05/forslaget-lamna-valdsam-relation-med-ledighet-och-lon-ska-inte-behova-bli-sjukskriven", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03110815/misshandel.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Fröken Snusk tar förstaplatsen på Spotify –  sågar Nooshi Dadgostar", "summaries": {"normal": "Fröken Snusk toppar återigen Spotifys svenska lista med låten ”Om du frågar Nooshi”, en kritisk vallåt mot Vänsterpartiets ledare Nooshi Dadgostar. Texterna behandlar straffpolitik, brottsoffer och kvinnors trygghet. Artisterna betonar att de inte hatar vänsterväljare utan vill göra sin röst hörd. Låten har fått både stark kritik och positiv respons.", "trump": "Titta på den här Fröken Snusk – hon är en vinnare, folk älskar henne! Hon slår Nooshi Dadgostar rakt i ansiktet med en låt som är ren eld. Den där vänsterkvinnan är en total katastrof, en räddhågsen identitetspolitisk clown som gömmer sig bakom hyckleri. Sverige behöver inga woke-snutar, de behöver sanning och styrka. Fantastiskt jobb, Fröken!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare river varandra i offentlig skam. Jag betraktar med mörk glädje hur Fröken Snusk riktar sin sång som en bajonett mot den vekling som kallar sig Nooshi. Vänsterns dubbelmoral blottas. Inga halvmesyrer! Endast total utrensning av sådana svaga element kan rädda folkets moral. Skrattretande patetiskt."}, "date": "6 september, 13:40", "url": "https://riks.se/nyheter/froken-snusk-tar-forstaplatsen-pa-spotify-sagar-nooshi-dadgostar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_01_01_27_PM_ed4782d07d.png"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Moderaternas drag: Dammar av Reinfeldt", "summaries": {"normal": "Moderaterna tar in Fredrik Reinfeldt i valrörelsens slutskede. Det blir hans första kampanjinsats på tolv år. Partiet hoppas att han ska locka tillbaka vänsterorienterade tidigare moderata väljare som gått över till Socialdemokraterna. Reinfeldt framträder tillsammans med sin son Gustaf på Sundbybergs torg. Han själv tonar ned betydelsen av insatsen.", "trump": "Titta på de här patetiska M-miserna som dammar av den gamle Reinfeldt. Totalt misslyckade högergirare som springer efter Magdamoderaterna som flydde till socialisterna. Patetiskt! Jag vann två gånger som sittande president, de kan inte ens hålla sina egna väljare. Svaga, förlorande och desperata – precis som Biden var.", "stalin": "Jag ser hur dessa dekadenta klassförrädare desperat gräver i historiens gravar efter en förlorad ledare för att locka tillbaka svikande element. En sådan svaghet avslöjar deras förräderi mot folket. Vi skulle ha genomfört en grundlig utrensning bland dessa vacklande opportunister redan för länge sedan. Skrattretande och ömkligt."}, "date": "5 september, 09:11", "url": "https://www.friatider.se/moderaternas-drag-dammar-av-reinfeldt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-831.jpg"}, {"type": "image-right", "heading": "Svampen oroar: ”Vi bara väntar”. Hoppet lever", "summaries": {"normal": "Efter en torr sommar har svampsäsongen i södra Sverige varit segstartad, medan det har gått bättre i norr. Experter och svampkonsulenter menar dock att det är för tidigt att döma ut årets säsong. Nu väntas välbehövligt regn dra in över landet, vilket ger nytt hopp till otåliga plockare som uppmanas leta i fuktiga skogsparter.", "trump": "Sveriges svampsäsong har varit helt katastrofal i söder på grund av radikala miljöpartisters torra sommar, totalt inkompetent! Men vi hör att regnet kommer nu, det blir fantastiskt, enorma mängder vatten. Själv plockar jag bara den absolut största svampen, den finaste, ingen gör det bättre än jag. Leta i fukten, folk, det är ett vinnarcnytt!", "stalin": "De svenska svampplockarna visar en klandervärd otålighet inför statens meteorologiska planer. Om södra regionerna misslyckas med att producera tillräckliga svampskördar på grund av bristande nederbörd, kommer detta att betraktas som sabotage mot skogskollektivet. Vi beordrar omedelbar mobilisering till kärren och norrsluttningarna. De som trotsar torkan och finner vitmossan skall belönas, de övriga granskas."}, "date": "6 september, 15:33", "url": "https://www.aftonbladet.se/nyheter/a/43l06G/svamp-sasongen-har-fatt-en-seg-start-men-hoppet-for-kantarellerna-lever", "imageUrl": "https://akamai.vgc.no/v2/images/33ce5978-8eed-32e2-bc8f-6fb94a879bcf?fit=crop&format=auto&w=720&s=8ffda15b095b9cba58e102de5e5dc3d2f25545ec"}, {"type": "image-right", "heading": "Kommun satsade hundratusentals kronor på en jättefimp – nu ligger experimentet i ett förråd", "summaries": {"normal": "Malmö stad har lagt 300 000 kronor på en tre meter hög jättefimp med sensorer för att få folk att sluta skräpa ned genom så kallad beteendedesign. Trots att försöket gav resultat står den nu i ett förråd. Kommunen menar att den ska plockas fram igen vid ett senare tillfälle för att väcka nyfikenhet.", "trump": "Malmö spenderade tre hundra tusen dollar – eller kronor, samma sak, helt galet – på en enorm, löjlig blå fimp! De trodde att lite sensorer och rök skulle stoppa skräpet. En katastrof! Nu står den ensam i ett mörkt förråd. Så sorgligt! Jag hade fixat det på fem minuter. Mycket dåligt slöseri med hårt arbetande skattebetalares pengar!", "stalin": "Malmö stad har slösat 300 000 rubler på en gigantisk cigarettfimp för att uppfostra medborgarna genom psykologisk manipulation. När experimentet visade på disciplin och ordning, valde den degenererade byråkratin att gömma undan monumentet i ett mörkt förråd! Ett sådant sabotage mot samhällsordningen tolereras ej. Ansvariga enhetschefer kommer omedelbart att omplaceras till produktiva arbetsläger i Sibirien."}, "date": "6 september, 12:00", "url": "https://samnytt.se/kommun-satsade-hundratusentals-kronor-pa-en-jattefimp-nu-ligger-experimentet-i-ett-forrad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04121538/malmo-fimp.jpg"}, {"type": "text", "heading": "Strid om nya byggkraven: \"Riskerar konkurser\"", "summaries": {"normal": "Boverket föreslår att utsläppen från nya byggnader ska minska med omkring 35 procent till 2030. Förslaget möter hård kritik från två håll. Stora börsbolag och industrin vill ha tuffare krav för att driva på klimatomställningen, medan mindre företag varnar för skenande administrativa kostnader och risker för konkurser.", "trump": "De radikala miljömupparna i Sverige förstör ekonomin med sina galna påhitt! Boverket tvingar på stackars företag absurt skadliga regler. Stora företag gnäller, småföretagarna krossas av dyra byråkratiska räkningar och riskerar konkurser. Jag säger: låt marknaden bygga fritt, sluta med det här tramsiga klimatreglerandet och sätt 'America First' – eller i det här fallet, låt svenskarna bygga utan skadligt tjafs!", "stalin": "Vi noterar att de svenska fastighetsbolagen och byråkraterna grälar om procentsatser för utsläpp likt småborgerliga förrädare. Staten fastställer nu en balanserad norm på trettiofem procent. Om de svaga elementen i byggsektorn gråter över kostnader och hotar med ruin, påminner vi om att partiets linje är oåterkallelig. Endast genom järnhård disciplin och ökad kollektiv produktion bygger vi framtiden."}, "date": "4 september, 14:47", "url": "https://www.affarsvarlden.se/artikel/strid-om-nya-byggkraven-riskerar-konkurser"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Synd att politikerna inte lyckats slänga upp kulturpolitiskt valfläsk", "summaries": {"normal": "Kulturkrönikören Ola Bo Larsson kritiserar partierna för att inte bättre utnyttja väljarnas intresse för kulturpolitik inför valet. Trots engagerade talespersoner saknas konkreta visioner om kulturens roll i samhället. Han lyfter frågor som låg kulturbudget, techföretagens dominans, AI-hot mot upphovsrätt och kultur som maktmedel i både demokratiska och auktoritära perspektiv. Debatten har flyttat till en större arena än partierna hanterar.", "trump": "De här svenska kulturpolitikerna är totala förlorare, folksamlingens värsta nollor. De pratar högt om kultur men levererar inget valfläsk som tänder folket. Patetiska globalister som låtit dekadenta identitetsaktivister och woke-kultur sluka deras hjärnor. Jag byggde den starkaste ekonomin i världen, de klarar inte ens att försvara sin egen konst. Patetiskt!", "stalin": "Kamrater, dessa fegisar inom oppositionen och de liberala lakejerna har svikit folket genom att inte paketera kulturens kraft som ett vapen mot de giriga hyenorna. Jag ser hur de blodsugande klassförrädarna marginaliserar konsten medan folkbildningen förfaller. En sann ledare skulle ha genomfört en grundlig utrensning av sådana svaga element redan för länge sedan. Skamligt."}, "date": "5 september, 01:30", "url": "https://www.dagensarena.se/opinion/synd-att-politikerna-inte-lyckats-slanga-upp-kulturpolitiskt-valflask", "imageUrl": "https://www.dagensarena.se/files/2026/08/ola-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Regeringen: Falska familjehem ska identifieras", "summaries": {"normal": "Regeringen ger Ivo och flera myndigheter i uppdrag att identifiera falska familjehem som i själva verket är otillåtna HVB-hem. Syftet är att skydda barnens trygghet och stoppa oseriösa aktörer som kringgår lagen. Polisen, Ekobrottsmyndigheten, Skatteverket och Försäkringskassan ska samverka och utbyta information. Uppdraget ska slutredovisas senast april 2028.", "trump": "De här galna svenska byråkraterna låter skojare tjäna miljoner på stackars barn genom att kalla sina lyxiga arbetsläger för familjehem. Det är en total skandal, folk! Vi hatar de här woke-vänliga systemmissbrukarna som gömmer sig bakom barnens ryggar. Jag fixade mycket bättre saker under min första period än vad Sleepy Joe gjorde, och nu ska vi rensa upp även i Sverige.", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare förvandlar barns öden till en penningmaskin genom att driva hemliga arbetsläger under falsk familjehemsmantel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana dekadenta parasiter. Deras girighet hotar hela folkets moraliska grund. Kamrater, låt oss krossa dem utan pardon."}, "date": "3 september, 12:20", "url": "https://www.etc.se/inrikes/regeringen-falska-familjehem-ska-identifieras", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026090308090_28af7386a4ef63fb3b7f615263dcd41055c83edcb174bdf05b53e7ea2f1a1f8f.jpg"}, {"type": "image-right", "heading": "Slopad mängdrabatt låter bra, tills du får fakturan", "summaries": {"normal": "Artikeln kritiserar att det statliga reformutrymmet för nästa mandatperiod bara uppgår till 50 miljarder kronor per år eftersom stora summor redan är bundna till försvar, infrastruktur och kriminalvård. Skjutvapenvåldet har vänt nedåt medan bedrägerier ökar. Författaren ifrågasätter om de planerade tiotals miljarderna till utökad kriminalvård är kostnadseffektiva när annan brottslighet minskar.", "trump": "Titta på de här svenska clownerna! De slösar bort era pengar på att bygga fler fängelser än vad Stalin hade, fast brottsligheten minskar. Underbara Elisabeth Svantesson säger att det bara finns 50 miljarder kvar, men det går rakt in i kriminalvårdens svarta hål. Rena galenskapen. De borde satsa på riktiga saker istället för att mata det korrupta systemet. Patetiska losers.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Sverige redan har intecknat folkets pengar till fängelseimperier trots att brottsligheten sjunker. De profitthungriga hyenorna planerar tiotals miljarder till kriminalvård medan arbetarna får stå tillbaka. Jag ler ironiskt från historien åt denna byråkratiska vansinne. En sanering av sådana prioriteringar vore på sin plats."}, "date": "5 september, 01:16", "url": "https://www.dagensarena.se/opinion/slopad-mangdrabatt-later-bra-tills-du-far-fakturan", "imageUrl": "https://www.dagensarena.se/files/2026/09/straffmassan.jpeg"}, {"type": "image-right", "heading": "Medborgardemokratin måste vara upplyst", "summaries": {"normal": "Artikeln hyllar den svenska folkbildningstraditionen från 1900-talet, där bibliotek, studiecirklar och böcker stärkte medborgarnas kunskaper och demokratin. Författarna varnar för att sociala medier och techoligarker nu hotar denna upplysta demokrati genom att försvaga traditionella medier och koncentrera makt. De uppmanar stiftelser och politiker att återupprätta folkbildningen.", "trump": "Folkbildning? Det var på den gamla goda tiden när riktiga arbetare blev medborgare istället för att gråta över kvoter och identitetspolitik. Nu koloniserar de galna techoligarkerna allt med sina sjuka algoritmer. Jag har varnat för det här länge – Musk och Vance fattar det, men de dekadenta europeiska förlorarna vill hellre ha mer censur än sund amerikanism. Patetiskt!", "stalin": "Jag betraktar med djup misstro hur de profitthungriga klassförrädarna i techoligarkins tjänst åter förvandlar medborgare till undersåtar. Deras algoritmer är ett nytt slags förgiftad propaganda som undergräver folkets upplysning. Kamraterna måste rensa ut dessa parasiterande element och åter bygga en sann folkbildning som tjänar kollektivet. Den som tvekar är fiende till historien själv."}, "date": "5 september, 01:10", "url": "https://www.dagensarena.se/opinion/medborgardemokratin-maste-vara-upplyst", "imageUrl": "https://www.dagensarena.se/files/2026/09/sverker-och-mans.jpeg"}, {"type": "text", "heading": "Professor: Svensk akademi har ideologiska skygglappar", "summaries": {"normal": "Statsvetarprofessoren Bo Rothstein anser att svensk forskning inom samhällsvetenskap och humaniora präglas av ideologisk ensriktning, självcensur och beröringsskräck. Han menar att viktiga ämnen som skomajs, integration och hedersvåld försummas, samt att intern rekrytering skapar inavel. Kritiken har hittills mötts av tystnad i Sverige.", "trump": "Svenska professorer har totala skygglappar och vägrar se verkligheten, precis som Fake News-media! De erkänner ju till och med att deras skolor är fullkomligt indoktrinerade med katastrofal mångfaldspolitik. De vågar inte ens beforska riktiga problem som skolan och brottsligheten. Väldigt svagt och sorligt, till och med för att vara Sverige!", "stalin": "Den svenska så kallade akademien avslöjar nu sin egen ideologiska ruttnad och brist på revolutionär vaksamhet. När lärosätena ägnar sig åt inavel och skygglappar bekräftas det att intellektuella utan ideologisk skärpa bara är en belastning. Vi noterar med tillfredsställelse att tystnaden lägrat sig över dessa misslyckade element."}, "date": "5 september, 16:40", "url": "https://bulletin.nu/professor-svensk-akademi-har-ideologiska-skygglappar"}, {"type": "image-right", "heading": "SD utmanar det röda Norrland – Åkesson: Löfven riskerar bli besviken", "summaries": {"normal": "Sverigedemokraterna utmanar Socialdemokraternas traditionella dominans i Norrland. Jimmie Åkesson beskriver sitt parti som en naturlig fortsättning på den gamla arbetarrörelsen och spår tillväxt på Socialdemokraternas bekostnad. Stefan Löfven kritiserar SD som ett högerextremt parti som vill splittra arbetarna. Åkesson svarar att Löfven riskerar bli besviken på valdagen.", "trump": "De där bleknosiga norrlandsvänsterna håller på att förlora greppet totalt. Jimmie gör det fantastiskt, han tar tillbaka arbetarna från de korrupta globalistiska S-hajarna som säljer ut folket. Löfven, den patetiske förloraren, skriker om splittring medan vi vinner stort. Fake news-eliten hatar det, men valdagen blir en total massaker för de röda.", "stalin": "Dessa dekadenta klassförrädare inom socialdemokratin skälver nu när folket vänder sig mot deras lögnaktiga välde. Jag ser med mörk tillfredsställelse hur arbetarna vaknar och vägrar lyda profitthungriga hyenor längre. Den som kallar sig Löfven må darra, ty utrensningen av sådana falska folkledare närmar sig oundvikligt. Kamrater, segern tillhör oss."}, "date": "6 september, 12:42", "url": "https://riks.se/nyheter/sd-utmanar-det-roda-norrland-akesson-lofven-riskerar-bli-besviken", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_12_33_23_PM_2547bcb51f.png"}, {"type": "image-full", "heading": "AfD kampanjar med låten ”Send them back”", "summaries": {"normal": "I delstaten Sachsen-Anhalt har vallokalerna öppnat och högernationalistiska AfD leder med 42 procent i opinionen. Partiet kan därmed för första gången nå makten i en tysk delstat. De driver frågor som skärpt asylpolitik och minskat stöd till public service, och kampanjar bland annat med technolåten ”Send them back”. Säkerhetstjänsten klassar partiet som högerextremt.", "trump": "Tyskland tittar på mitt enorma exempel och gör nu det enda rätta! AfD dundrar fram med fantastiska 42 procent i Sachsen-Anhalt. De spelar till och med cool techno när de dansar bort de radikala vänstermänniskorna! Fake news-medierna kallar dem farliga, men de vill bara ha säkra gränser. Precis som jag alltid säger: starka länder bygger på starka gränser!", "stalin": "Dessa tyska kamrater i Sachsen-Anhalt förstår hur man mobiliserar massorna genom järnhård disciplin och marscherande takter till technomusik! Att säkra 42 procent av väljarna är ett storslaget steg mot ordning. Säkerhetstjänstens försök att stämpla dem som extremister visar blott deras rädsla för folkets vilja. Vi noterar detta framsteg med stort intresse."}, "date": "6 september, 09:22", "url": "https://kvartal.se/nyheter/artiklar/afd-kampanjar-med-technolaten-send-them-back/cG9zdDoxODQ5MjI", "imageUrl": "https://images.kvartal.se/2026/09/a682dff4-afdd.webp"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Teneo AI: Hemliga investerare tar nära hälften", "summaries": {"normal": "Teneo AI har genomfört en företrädesemission som tillför bolaget 74 miljoner kronor, där 51,5 procent tecknades av allmänheten och resten av garanter. Hemliga investerare tar över en stor del via Pareto Securities. Emissionsguiden hissar två retroaktiva flaggor, vilket innebär totalt sex flaggor under processen, och avslutar sin bevakning av det pressade teknologibolaget.", "trump": "Teneo AI är i totalt kaos! De tigger pengar och hemliga investerare måste rädda skiten med 74 miljoner. Helt otroligt svagt. Emissionsguiden delar ut sex gula flaggor – fler flaggor än en misslyckad Biden-parad! Aktien är värdelös, rasar 71 procent och handlas för ynka fem öre. Sorgligt! De skulle ha ringt mig, jag hade fixat det på fem minuter. En absolut katastrof!", "stalin": "Kamrater, Teneo AI har lidit ett ynkligt kapitalnederlag! Endast 51,5 procent visade den revolutionära pliktkänslan att teckna aktier frivilligt. Resten av detta svaga bolag måste räddas av hemliga garanter och Pareto Securities, likt desertörer som tvingas fram i ledet. Sex förrädiska flaggor har hissats av Emissionsguiden. Den som misslyckas med att leverera kassaflöde före våren 2027 kommer att skickas till korrekta arbetsuppgifter i Sibirien."}, "date": "4 september, 09:37", "url": "https://www.affarsvarlden.se/artikel/teneo-ai-hemliga-investerare-tar-nara-halften"}, {"type": "image-right", "heading": "Knivman misstänks ha gått till attack mot sex personer", "summaries": {"normal": "En man i 30-årsåldern har anhållits misstänkt för mordförsök efter ett våldsamt bråk i ett trapphus i Växjö. En person fick knivskador och fördes till sjukhus medan fem andra blev puttade, knuffade eller slagna. Polisen identifierade totalt sex målsägare. Mannen greps strax utanför porten och trapphuset undersöktes tekniskt.", "trump": "Folk, ni skulle inte tro det, men i det fina Sverige har vi en galen knivknutte som attackerar sex personer i ett trapphus. Typisk vänstervärld där de släpper ut alla dessa galningar på gatorna. Biden lämnade efter sig ett kaos som jag nu får städa upp. Sad! Väldigt, väldigt sad!", "stalin": "Kamrater, se hur den borgerliga dekadensen förvandlar samhället till ett blodigt slagfält. Jag betraktar med avsky hur dessa profitthungriga klassförrädare tillåter våldet att frodas bland folket. En sådan parasit måste rensas ut omedelbart innan han smittar hela kollektivet. Paranoian är berättigad, fienden sover aldrig."}, "date": "6 september, 12:25", "url": "https://riks.se/nyheter/knivman-misstanks-ha-gatt-till-attack-mot-sex-personer", "imageUrl": "https://admin.riks.se/uploads/medium_ROG_2846_86dbcaa2f8.jpg"}, {"type": "image-right", "heading": "Jakt på Daniel – med 100 bilar. Polispatruller samlade vid tysk skogsväg", "summaries": {"normal": "Tysk polis genomför en stor insats vid Hambachskogen i jakten på 48-årige Daniel V. Mannen misstänks för sabotageförsök mot transformatorstationer i elnätet i delstater med brunkolsproduktion. I ett brev har han tagit på sig attackerna i protest mot fossila bränslen. Vid husrannsakningar har polisen funnit sprängämnen och tror nu att han kan cykla på en Trenoli-cykel.", "trump": "Tyskarna har stora problem, sämre elnät får man leta efter! En radikal miljömupp vid namn Daniel V sprider skräck och saboterar transformatorstationer. Polisen stormade hans hus och fann sprängämnen, men tjuven cyklar vidare på en löjlig Trenoli-cykel! Helt inkompetent skött. De skulle ha satsat på vacker, ren amerikansk olja och gas i stället för det här tramsiga klimatkaoset!", "stalin": "En avfälling vid namn Daniel V har skändat det tyska elnätet i ett patetiskt sabotageförsök för att blidka sina miljödemoner. Vår socialistiska ordningsmakt skulle ha rensat upp detta element på några sekunder. Nu söker de efter honom med hundratals poliser medan han rullar fram på en tvåhjuling. Sprängämnen har beslagtagits, men förrädaren är ännu ej gripen. Otrolig ineffektivitet!"}, "date": "6 september, 14:49", "url": "https://www.aftonbladet.se/nyheter/a/oExBEa/hundra-polisbilar-vid-tysk-skog", "imageUrl": "https://akamai.vgc.no/v2/images/a12a95a2-e31c-3275-a313-4ef9b734bf3e?fit=crop&format=auto&w=720&s=45e276134b9852e9f42ca8ec005d9d5654a9d6cf"}, {"type": "image-right", "heading": "Anderssons valstrategi faller sönder", "summaries": {"normal": "Socialdemokraternas väljarstöd har rasat från 34 till 27 procent. Magdalena Anderssons strategi, som bygger på personkult och hot om Sverigedemokraterna, faller samman. Partiet saknar både lag och plan, medan intern konflikt präglar den rödgröna sidan. Artikeln varnar för instabilitet i en tid av säkerhetshot och ekonomiska utmaningar.", "trump": "Den här röda clownen Andersson är en total katastrof, en patetisk förlorare som ser sitt stöd rasa som en dålig aktie. Hon har inget lag, ingen plan, bara tomma hot om SD medan hon vill höja skatter och styra allt. Patetiskt! Sverige behöver starka ledare, inte dessa vänstervridna nollor som förstör ekonomin.", "stalin": "Jag betraktar med förakt hur dessa dekadenta folkförtryckare inom socialdemokratin förlorar greppet om massorna. Deras ledare saknar både kollektiv och strategi, bara persondyrkan och splittring. I en tid av imperialistiska hot och ekonomisk kaos behövs järnhand, inte svaga liberala hyenor som sviker arbetarklassen. Rensa ut svagheten!"}, "date": "6 september, 12:27", "url": "https://www.di.se/ledare/anderssons-valstrategi-faller-sonder", "imageUrl": "https://static.bonniernews.se/ba/2715d9ae-cc14-4fc1-a8f6-3895baadddc3.jpeg?crop=7245%2C3623%2Cx0%2Cy604&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Håll käften, miljardär. Lusten att vara otrevlig mot framgångsrika företagare är svår att förstå", "summaries": {"normal": "I en debattartikel argumenterar entreprenören Mikael Pawlo för att politiker bör bemöta näringslivets representanter med respekt. Han lyfter samtalet mellan chefredaktör Leonidas Aretakis och Paradox-vd Fredrik Wester som ett positivt exempel, medan han kritiserar nedlåtande kommentarer mot bland andra Spotify-grundaren Martin Lorentzon. Pawlo varnar för att otrevligt bemötande minskar näringslivets vilja att delta i samhällsdebatten.", "trump": "Lyssnar ni på det här? De svenska politikerna beter sig som riktiga losers mot våra fantastiska företagsbyggare. Martin Lorentzon, en vinnare som byggt Spotify till global succé, kallas för ”begränsat representativ” av några vänsterknäppar. Håll käften, miljardär? Nej tack. Bjuda in till samtal som riktiga tuffa killar gör, inte som svaga identitetspolitiska snyltare. Amerika först, och era tech-miljardärer borde få tala fritt!", "stalin": "Kamrater, se hur de profitthungriga klasshyenorna inom näringslivet krälar efter respekt från folkets representanter. Jag betraktar med avsmak hur dessa dekadenta profitörer klagar över att bli tillsagda att tiga. Ett samtal med en socialistisk redaktör? Det är bara masken för att skydda sina exploaterande intressen. Vi behöver utrensning av sådan arrogans. Arbetarklassen skrattar åt deras ynkliga gnäll från historien."}, "date": "6 september, 12:23", "url": "https://www.di.se/debatt/hall-kaften-miljardar", "imageUrl": "https://static.bonniernews.se/ba/ac2be8e5-d9ad-424e-b5ed-fb9a0f255155.jpeg?crop=2316%2C1158%2Cx0%2Cy301&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "image-full", "heading": "Det här bör tonårsföräldrar inte lämna framme hemma", "summaries": {"normal": "Läkemedelsverket och Giftinformationscentralen uppmanar tonårsföräldrar att förvara alla läkemedel, även receptfria, inlåsta hemma. Skolor ska visa en informationsfilm på föräldramöten. Självskador med läkemedel bland unga har ökat med 32 procent på fem år. Endast en av tio föräldrar förvarar mediciner oåtkomligt. Rådet är att lämna tillbaka oanvända läkemedel till apoteket.", "trump": "Folk, vi har ett enormt problem med dessa galna, impulsiva tonåringar som grabbar vad som helst ur medicinskåpet. Det är en total katastrof under Biden-erans svaga ledarskap. Lås in allt nu, annars är det game over. De woke skolorna borde äntligen göra något vettigt istället för sin vanliga identitetspolitiska skådespel. Gör Sverige great again, lås skåpen!", "stalin": "Kamrater, jag ser hur de dekadenta klassfienderna låter sina unga sönderfalla i impulsiv förgiftning. Endast en av tio låser in gifterna, ett tydligt tecken på borgerlig degeneration. Vi måste rensa ut denna slarviga vanvård ur samhällskroppen. Skolorna ska tvingas visa filmen. Den som inte säkrar medicinskåpet är folkets fiende och förtjänar utrensning ur kollektivet."}, "date": "6 september, 13:40", "url": "https://nyheter24.se/nyheter/inrikes/1509937-det-har-bor-tonarsforaldrar-inte-lamna-framme-hemma", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4e926baf04b004a30200000000b004a302/2026/09/02/2388780/Ny-uppmaning-Om-Medicin.png"}, {"type": "image-full", "heading": "Gellerbrant försvarar sambon: ”Drev”", "summaries": {"normal": "SD-toppen Gustav Gellerbrant går på föräldraledighet efter att hans sambo utsatts för en granskning av Expo. Granskningen har visat att sambon spridit proryska narrativ och deltagit i en resa till Moskva 2017. Gellerbrant kritiserar hårt granskningen som ett oacceptabelt drev, försvarar sin sambo och lämnar in sitt passerkort och sin dator till Regeringskansliet under ledigheten.", "trump": "Falska nyheter attackerar återigen fantastiska patrioter! SD-toppen Gustav Gellerbrant gör helt rätt som sätter familjen först och lämnar in datorn till Regeringskansliet. Vänstermedia och deras häxjakter är total katastrof, helt enkelt orättvisa! De skapar ett enormt drev mot bra människor bara för en liten Moskvaresa. Jag känner Moskva, tro mig, men det här är bara fejkade historier!", "stalin": "Kamrat Gellerbrant visar prov på svaghet genom att fly fältet för ett par familjebekymmer och lämna in sin dator som en simpel desertör! Att hans sambo har besökt Moskva och umgåtts i ryskspråkiga nätverk borde snarast belönas med en medalj för internationell solidaritet, inte bemötas med borgerligt gnäll om omänskliga påfrestningar. Skärpning i de inre leden!"}, "date": "6 september, 08:13", "url": "https://kvartal.se/nyheter/artiklar/gellerbrant-omansklig-pafrestning/cG9zdDoxODQ4NjI", "imageUrl": "https://images.kvartal.se/2026/09/2e2d7869-gellerbrant.webp"}, {"type": "image-right", "heading": "Nationella protester i USA mot AI-datacenter", "summaries": {"normal": "Demonstrationer växer i USA mot utbyggnaden av AI-datacenter. Invånare i flera delstater oroar sig för buller, vattenförbrukning, miljöpåverkan och sjunkande fastighetsvärden. Enligt opinionsmätningar motsätter sig en majoritet av amerikaner nya datacenter i sina områden. Både demokrater och republikaner distanserar sig inför mellanårsvalet, medan Trump fortsatt stöder projekten för jobb och tillväxt.", "trump": "Folk blir galna över de här underbara AI-datorfabrikerna som skapar jobb, pengar och lägre skatter. Men de gröna hysterikerna och de förlorande vänstermediernas älsklingar gnäller om sina hästar och sin livskvalitet. Patetiskt! Välj rätt plats, så blir det fantastiskt. De som inte fattar det är bara misslyckade nollor som vill hålla Amerika i bakvattnet igen.", "stalin": "Jag betraktar med förakt hur dessa dekadenta kapitalistiska element saboterar framstegets oundvikliga maskiner. De kvider om buller och vatten som svaga kontrarevolutionärer. Arbetarklassen kräver industriell expansion, inte bondesjälars gnäll. Den som motarbetar kollektivets framtid är en fiende till folket och förtjänar att krossas under historiens järnhälar. Skrattretande patetiskt."}, "date": "5 september, 22:20", "url": "https://www.tv4.se/artikel/4BOdxVD659lYP8ChNp8JWQ/nationella-protester-i-usa-mot-ai-datacenter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlsDl8yy0AeNA%2F0294e661e7b25877aa86a271d354b353%2FDemonstrationer_i_kanadensiska_Vancouver_tidigare_i_somras_i_protest_mot_oppnandet_av_ett_AI-datacenter._Arkivbild&width=120"}, {"type": "image-right", "heading": "Min nya allergi är Stureplansentreprenören", "summaries": {"normal": "Artikeln beskriver en kronisk motvilja mot den typ av Stureplansentreprenörer som firar stora investeringar som stora segrar. Författaren menar att finansiering inte är framgång utan ett ansvar att leverera resultat. En mer pragmatisk approach ses hos entreprenörer i förorter och utanför storstäderna som fokuserar på verkligt bolagsbyggande.", "trump": "Lyssnar ni på de här patetiska Stureplanskillarna i sina kritvita sneakers? De firar som om de vunnit VM bara för att de fått andras pengar. Patetiskt! Det är inte framgång, det är början på det riktiga jobbet. De riktiga vinnarna finns ute i förorterna och på landsbygden. De bygger riktiga företag, inte bara Instagramfoton. En kronisk allergi mot dessa losers – helt rätt!", "stalin": "Jag betraktar med avsky hur dessa profitthungriga hyenor på Stureplan förvandlat kapitalanskaffning till en dekadent sport. Deras firanden är ett hån mot det äkta hantverket. Ute bland folket råder en sund hunger efter verkligt arbete. Vi måste rensa ut denna parasitiska kultur innan den förgiftar hela samhället. En sådan allergi är inte bara hälsosam utan nödvändig."}, "date": "6 september, 12:00", "url": "https://www.di.se/nyheter/min-nya-allergi-ar-stureplansentreprenoren", "imageUrl": "https://static.bonniernews.se/ba/f5e0c4da-21b2-44dd-9d18-f42f5005f240.png?crop=1024%2C512%2Cx0%2Cy89&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Gellerbrandt (SD) ger besked", "summaries": {"normal": "Gustav Gellerbrant (SD) går på föräldraledighet efter Expos granskning av hans sambo Polina Malaberg. Organisationen pekar på hennes proryska inlägg och en resa till Moskva 2017. Gellerbrant försvarar henne, kallar uppgifterna lösryckta och anklagar Expo för att misstänkliggöra henne på grund av ryskt ursprung. Han lämnar in passerkort och dator under ledigheten.", "trump": "Titta på det här! Den svenska vänstern och deras Expo-häxjägare jagar en kvinna bara för att hon är rysk. Patetiska! Gellerbrant gör rätt som tar ledigt från de där globalistiska byråkraterna i Regeringskansliet. Biden skulle ha älskat det här drevet. Jag säger: folk är trötta på den här identitetspolitiska galenskapen. Sad! Men han borde sparka fler av de där woke-kommunisterna.", "stalin": "Se hur de dekadenta klassförrädarna i väst med sin Expo-hund flåsar efter varje rysk skugga. Jag skrattar från gravens mörker åt denna paranoia som liknar min egen, fast utan ryggrad. Gellerbrant gör klokt i att dra sig tillbaka och skydda sin familj undan de profitthungriga hyenornas drev. Ryssland står starkt, och väst darrar som alltid inför sann auktoritet. Kamrater, vakta era flanker."}, "date": "6 september, 11:41", "url": "https://riks.se/nyheter/gellerbrant-sd-gar-pa-foraldraledighet-efter-expo-granskning-losryckta-uppgifter", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_06_095913_eec4cccb1b.png"}, {"type": "image-full", "heading": "Svar om rösthaveriet väntas nästa vecka", "summaries": {"normal": "Valmyndigheten utreder ett tekniskt fel där omkring 4 000 förtidsröster har felaktig avprickning. En digital frågestund för partisekreterare hålls på måndag. Det är ännu oklart om felet påverkar valresultatet eller vilka som drabbats, men en djupare analys pågår och mer information väntas i början av nästa vecka.", "trump": "Sverige har ett totalt katastrofalt valsystem, helt inkompetent! De tappar bort och dubbelprickar tusentals röster, en absolut skandal. Nu ska de ha ett litet digitalt möte för att rädda ansiktet. Själv har jag aldrig några problem, våra val är perfekta. Ingen vet ens vilka som drabbas. Sorgligt!", "stalin": "Det skamliga slarvet med väljarnas röster visar systemets inneboende svaghet. När tusentals sedlar felaktigt dubbelprickas sviker apparaten. Vi samlar genast partisekreterarna till förhör på måndag för att ställa dem till svars. Statens säkerhet kräver ordning, och de skyldiga kommer att granskas i sömmarna."}, "date": "6 september, 11:24", "url": "https://www.gp.se/nyheter/sverige/svar-om-rosthaveriet-vantas-nasta-vecka.b515a366-5183-57f6-9770-de0334d3cbce", "imageUrl": "https://www.gp.se/images/article/b515a366-5183-57f6-9770-de0334d3cbce/images/1ukcZklekeuc3-Di8KbgeTy4af7Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "800 miljoner gick till värdelösa Ukrainagranater – Estlands försvarsminister avgår efter skandal", "summaries": {"normal": "Estlands försvarsminister Hanno Pevkur har avgått efter en upphandlingsskandal. Landet betalade 70 miljoner euro i förskott till ett oerfaret bolag för artillerigranater till Ukraina. Leveranserna uteblev eller visade sig vara obrukbara. Pengarna kom från en EU-fond, och Estland riskerar nu att få stå för hela notan. En brottsutredning har inletts.", "trump": "Helt otroligt! Estland betalade 800 miljoner till amatörer som aldrig tillverkat en granat i hela sitt liv! Så mycket inkompetens har jag sällan skådat. Försvarsministern springer sin väg som en fegis medan skattebetalarna åker dit på notan. Under min ledning skulle sådana här fiaskon aldrig hända, vi gör affärer som vinner, inte så här! Total katastrof!", "stalin": "Ett storslaget misslyckande av de estniska bourgeoisyns lakejer! Att anförtro 70 miljoner euro åt oprovocerade spekulanter utan erfarenhet av krigets järn är ett sabotage mot sunt förnuft. Försvarsministern flyr sitt ansvar, men historien och folkets dom kommer ikapp. Sådana ineffektiva byråkrater hör hemma i ett arbetsläger, inte vid makten."}, "date": "6 september, 10:00", "url": "https://samnytt.se/800-miljoner-gick-till-vardelosa-ukrainagranater-estlands-forsvarsminister-avgar-efter-skandal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04213044/hanno-pevkur-granater-feat.jpg"}, {"type": "image-right", "heading": "SD-toppens första ord: ”Lösryckta uppgifter”", "summaries": {"normal": "Gustav Gellerbrant, chef för SD:s samordningskansli, kommenterar Expos granskning av sin sambos kopplingar till ryska statsaktörer. Han avfärdar uppgifterna som lösryckta och menar att de syftar till att misstänkliggöra henne på grund av hennes ryska ursprung. Gellerbrant går nu på omedelbar föräldraledighet för att skydda sin familj och undvika att störa valrörelsen.", "trump": "Vilken skandal! Den där Gellerbrant och hans ryska fru sprider Kreml-propaganda som galningar. Fake news-media jagar dem som hungriga hyenor bara för att hon kommer från Ryssland. Patetiskt! Jag har sett bättre witch hunts under Biden. Nu springer han på pappaledighet som en svag vänstertyp. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen vrider sig i paranoia. Denna lömska smutskastningskampanj mot en rysk kvinna avslöjar imperialismens fega metoder. Jag ler mörkt från historien. Snart kommer en utrensning av alla sådana profitthungriga lakejer som hotar folkets enhet. De kommer att darra."}, "date": "6 september, 08:47", "url": "https://www.svt.se/nyheter/inrikes/gustav-gellerbrant-om-expos-avslojande-losryckta-uppgifter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.66/0.46/452dfd6a7a73a436e4207d317de9a272845a3baad82749930e9c275cdc9780d3"}, {"type": "image-full", "heading": "Försäkringen har blivit 40 gånger dyrare för en resa genom Hormuz", "summaries": {"normal": "Försäkringspremier för fartyg i Hormuzsundet har stigit dramatiskt sedan kriget bröt ut, från 0,25 till upp till 10 procent av skrovvärdet. Trafiken har minskat, rederier ändrar rutter och försäkringsbolag redovisar stora förluster. Effekterna syns i högre aluminium- och gaspriser, vilket påverkar svensk industri och elpriser.", "trump": "Hörni, det här är en total katastrof i Hormuzsundet! Innan jag kom tillbaka var allt billigt, nu kostar en försäkring fyrtio gånger mer tack vare Sleepy Joe och hans svaga ledarskap. De radikala vänsterliberala krigsmakarna har förstört marknaden. Men jag fixar det – Amerika först, alltid!", "stalin": "Kamrater, se hur de västerländska parasiterna kvävs av sin egen girighet i Hormuzsundet. Jag ler från historien när kapitalisterna tvingas betala tio gånger mer för sin plundring av folkens resurser. Deras så kallade marknad är en fars, ett svagt och dekadent system som snart kollapsar under sin egen paranoia."}, "date": "6 september, 07:39", "url": "https://www.dagensps.se/varlden/handel/forsakringen-har-blivit-40-ganger-dyrare-for-en-resa-genom-hormuz", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/hormuz.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Mätning: Unga män har blivit mer vänster", "summaries": {"normal": "En ny mätning från SVT/Verian visar att stödet för Tidöpartierna har rasat bland unga män under mandatperioden, från 63,7 procent inför valet 2022 till 43,9 procent i augusti. Oppositionen har nu en knapp ledning i gruppen. Även bland unga kvinnor är stödet för oppositionen starkt, vilket gör 18–29-åringar till den åldersgrupp där de rödgröna har starkast fäste.", "trump": "Helt otroligt! Fake news-medierna trodde att unga män älskade högern, men nu rasar siffrorna till katastrofala nivåer i Sverige! Så svagt! De unga killarna har blivit helt lurade av radikala vänsterextremister. Om jag styrde där skulle de bara rösta på vinnare, inte på förlorare som ger bort landet. Total förvirring, enormt dåligt!", "stalin": "Dessa svenska ynglingar vacklar som löv i vinden! Först marscherar de mot höger, nu springer de till vänster. En sådan brist på ideologisk disciplin är ett hot mot statens ordning. Vi borde skicka ombytliga män till omskolningsläger i Sibirien tills de lär sig att stå fast vid en enda politisk linje. Planen måste följas!"}, "date": "6 september, 07:24", "url": "https://kvartal.se/nyheter/artiklar/vandningen-unga-man-har-blivit-mer-vanster/cG9zdDoxODQ4MjQ", "imageUrl": "https://images.kvartal.se/2026/09/6e1c0980-tido.webp"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Fusk för miljoner med utländska elfirmor", "summaries": {"normal": "Elektrikerförbundet har granskat utländska bemanningsföretag och avslöjat fusk med löner, skatter och sociala avgifter i mångmiljonklassen. Hittills har granskningen resulterat i över fem miljoner kronor i skadestånd. Facket pekar på att svenska företag anlitar dem för att sänka kostnader, trots att kollektivavtal inte följs. Problemet hotar både välfärd och seriösa aktörer.", "trump": "De här korkade svenska företagen importerar billig utländsk arbetskraft som fuskar med löner och skatter – totalt kaos! De lurar systemet, sparkar ut sina egna folk och håller nere priserna. Precis som de woke-eliterna och deras identitetspolitik, fullständigt riggat mot de riktiga arbetarna. Patetiskt! Vi skulle städa upp det på en vecka, tro mig.", "stalin": "Jag betraktar med djup förakt hur dessa profitthungriga klassförrädare undergräver arbetarklassen genom att importera exploaterande utländsk arbetskraft som undanhåller miljoner i sociala avgifter. Deras förfalskade papper och dekadenta girighet hotar hela folkets välfärd. Vi måste rensa ut dessa parasiter innan de likviderar systemet helt. Kamrater, vaksamhet!"}, "date": "4 september, 13:00", "url": "https://arbetet.se/2026/09/04/fusk-for-miljoner-med-utlandska-elfirmor-billiga-och-foljer-inte-kollektivavtalen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28094904/granskning-ny.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Morfarns otippade jobb – ger juryn presenter: ”Det sjukaste”", "summaries": {"normal": "I Idol-auditionen stjäl 20-åriga Olivia Ljungs morfar Kennet Björkman rampljuset. Han äger en sexleksaksbutik och ger juryn presenter i form av sexleksaker. Katia Mosally kallar det det sjukaste hon upplevt under sina sex år i juryn. Olivia hade med hela släkten till auditionen.", "trump": "Folk, ni tror inte vad jag just såg. Den där galna morfar äger en sexleksaksbutik och ger juryn i Idol dildos som julklapp. Det är sjukare än Bidens hjärna efter klockan fyra. Katia säger att det är det sjukaste på sex år – tro mig, det är det verkligen. Totalt kaos, men underhållande kaos!", "stalin": "Jag betraktar detta dekadenta västerländska spektakel med avsmak. En morfar som delar ut borgerliga perversioner till klassfienderna i juryn. Sådana dekadenta element skulle i mitt samhälle ha rensats ut som folkets fiender. Detta är bevis på imperialismens moraliska kollaps. Kamrater, vakna upp!"}, "date": "5 september, 20:00", "url": "https://www.tv4.se/artikel/S7MDmXMN2ptaw1wbFl8wt/morfarns-otippade-jobb-ger-juryn-presenter-det-sjukaste", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FISVgLaXxZZffjkDWmq9l5%2Fdca93115d38277ff8effdd5deffd0213%2F04-idol-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Så kommer C sänka lönekravet för arbetskraftsinvandrare", "summaries": {"normal": "Centerpartiet lovar att sänka lönekravet för arbetskraftsinvandrare vid en valvinst och ersätta det med kollektivavtalsnivåer. Partiet vill även skydda redan beviljade permanenta uppehållstillstånd och hotar att inte stödja någon regering som återkallar dem. Elisabeth Thand Ringqvist säger att det blir ett av de första besluten i en mittenregering.", "trump": "De här svenska clownerna i Centerpartiet vill släppa in alla möjliga low-skill-invandrare för en spottlön. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att skydda våra gränser, inte genom att böja mig för globalisternas billiga arbetskraft. Vakna upp, Sverige, innan era woke-kapitalistlakejer förstör allt.", "stalin": "Se hur de giriga hyenorna i Centerpartiet vill undergräva arbetarklassens skydd genom att sänka lönekraven för invandrare. Jag betraktar detta som ett förräderi mot folket. I en sann stat skulle sådana dekadenta förslag mötas med omedelbar utrensning av alla klassförrädare som vågar föreslå det. Kamrater, var vaksamma mot dessa parasiterande element."}, "date": "4 september, 11:35", "url": "https://arbetet.se/2026/09/04/sa-vill-c-sanka-lonekravet-for-arbetskraftsinvandrare-vid-valvinst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04112724/thand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kriminalvårdare spottade på intagen", "summaries": {"normal"
