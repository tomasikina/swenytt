t det är under kontroll, men tro mig, det är det inte. Det är så illa! När jag var president skulle sådant aldrig hända, jag skulle ha stoppat det direkt. De kan inte ens laga sina egna maskiner på grund av mina sanktioner. Rysslands ekonomi, den dalar som en sten!", "stalin": "Våra ryska bröder lider av inkompetens. Att tillåta fascisterna i Kiev att sabotera vår ärorika energiinfrastruktur är en handling av obeskrivlig svaghet. Vår statsapparat måste rensas från de byråkrater som tillåter att folk köar för bränsle. Vi ser hur Krimhalvön förfaller under denna oordning. Centralbankens chefer darrar likt rädda möss inför inflationen. Vi måste återinföra järnhandens ordning. Den som inte kan leverera olja till krigsmaskinen är en sabotör och förtjänar inte en plats i vår framtida union."}, "date": "2 juli, 18:26", "url": "https://www.realtid.se/bors-finans/rysk-ekonomi-stors-pa-riktigt-efter-ukrainas-vagade-drag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlu-ylwb9afs0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Saab i topp på svag Stockholmsbörs", "summaries": {"normal": "Stockholmsbörsen sjönk med 0,57% efter två dagars uppgång. Teknologiaktier gick bäst (+0,6%), medan telekom föll mest (-2,3%). Saab och EQT steg över 3%, medan Telia rasade 3,5%. TriCarb höjde budet på Cint till 6 kr/aktie. Dustin överraskade positivt med högre ebita än väntat. Saab fick en order på Gripen-plan till Ukraina för 24,6 miljarder kr. Alzecure rusade 60% efter ett stort samarbetsavtal.", "trump": "Stockholmsbörsen? Svag, mycket svag! Men jag säger er, Saab – fantastiska killar, eller? 3,3% upp! Och EQT, de vet hur man vinner. Telia? Total katastrof, 3,5% ner, fruktansvärt. Cint? Någon höjer budet, smart, mycket smart. Dustin? De levererar, bättre än väntat, jag gillar det. Och Saab säljer stridsflyg till Ukraina – 24 miljarder, kan ni tro det? Vinnare! Alzecure? 60% upp, det är vad jag kallar en riktig deal. Sverige behöver fler vinnare som jag!", "stalin": "Stockholmsbörsen darrar under kapitalismens kris – 0,57% ner, som väntat. Men se hur våra vänner på Saab triumferar med 3,3% uppgång! 24,6 miljarder kronor för Gripen-plan till Ukraina – ett steg närmare folkets seger över fascistiska krafter. Teknologisektorn, en svag länk i kedjan, visar tecken på liv, men telekom? Kollapsar som borgerlighetens moral. Dustin? En liten seger i en havererad ekonomi. Alzecure rusar 60% – vetenskapens makt över imperialistisk dekadens! Vi ska krossa fienderna, en aktie i taget."}, "date": "1 juli, 17:45", "url": "https://www.affarsvarlden.se/artikel/saab-i-topp-pa-svag-stockholmsbors"}, {"type": "image-full", "heading": "Spanien–Österrike VM 2026: skrällen från 1978 kan upprepas", "summaries": {"normal": "Spanien möter Österrike i VM:s sextondelsfinal på torsdag. La Roja gick obesegrade genom gruppspelet som etta i grupp H. Österrike är tillbaka i VM efter 28 år och tog sig vidare från en tuff grupp bakom Argentina. Spanien är storfavorit med Lamine Yamal, Pedri och Rodri i spetsen. Österrike bygger på hög press, rutin från Alaba och Arnautović samt omställningar. Matchen kan bli en kamp mellan spanskt bollinnehav och österrikisk aggressiv press. Den spelas i Los Angeles på SoFi Stadium.", "trump": "Det här blir en fantastisk match, folk, verkligen enastående. Spanien, de är stora favoriter, de har aldrig förlorat i gruppen, de har den där unge killen Yamal som springer som en galning. Österrike? De har inte varit med på 28 år, plötsligt dyker de upp och tror att deras press kan stoppa oss – jag menar dem. Det kommer att bli mål åt båda hållen, tro mig. Spanien vinner stort, Österrike kommer att lämna massor av ytor, det blir en slakt. Fantastiskt VM, det bästa någonsin.", "stalin": "Kamrater, inför denna sextondelsfinal mellan de spanska fotbollskrafterna och de österrikiska reaktionärerna tar vi kompromisslös kontroll över spelet. Vi, partiet och arbetarna, ser hur borgarbrackorna i Österrike med sin dekadenta höga press och sin kapitalistiska paranoia försöker störa det kollektiva bollinnehavet. Utan sin kreativa agent Baumgartner, som vi redan betraktar som utrensad ur historien, blir de ännu mer patetiska. Vi ska likvidera deras omställningar med järnhand. Spanien är vårt verktyg för att krossa fienden. Segern tillhör folket. Allt annat är kontrarevolutionär sabotageverksamhet utförd av fotbollens fiender."}, "date": "2 juli, 08:00", "url": "https://bulletin.nu/spanien-osterrike-vm-2026-skrallen-fran-1978-kan-upprepas", "imageUrl": "https://cdn.bulletin.nu/articles/70b72860-a13c-45ba-90eb-c725e33ad5b1/preview.jpg?t=1782906310000"}, {"type": "image-right", "heading": "Ryssland har kartlagt hålen i Natos luftförsvar", "summaries": {"normal": "En ny rapport från International Institute for Strategic Studies kopplar den europeiska drönarvågen förra året till Ryssland. Den ryska skuggflottan misstänks ha använts för att skjuta upp drönare som kartlagt hål i Natos luftförsvar. Över 150 drönare flögs in under 19 månader, vilket bland annat ledde till nedstängning av Köpenhamns flygplats och Belgiens luftrum. Experter ifrågasätter delar av rapporten och pekar på många falsklarm samt bristande europeiskt samarbete och modernt luftförsvar.", "trump": "Folk, ni skulle inte tro det, men den här rapporten säger att Ryssland skickade drönare över hela Europa och stängde ner flygplatser. Deras skuggflotta lurade runt i Östersjön och kartlade alla svaga punkter i Natos försvar. Det är en katastrof, en total katastrof. Europa har förlegat försvar och uselt samarbete. Men jag sa ju det, de lyssnar aldrig. Vi vet hur man fixar sånt här ordentligt, tro mig.", "stalin": "Kamrater, jag ser med största tillfredsställelse hur de dekadenta västeuropeiska luftförsvarsborgarbrackorna avslöjar sina egna hål som vi så effektivt kartlagt. Dessa fascistiska drönarspioner från skuggflottan har med kirurgisk precision blottat imperialismens svagheter medan de kapitalistiska byråkraterna skriker falsklarm och pekar fel. Vi ska rensa ut alla dessa parasitiska luftrumshål och likvidera varje kontrarevolutionär drönarignorant som vågar ifrågasätta folkets överlägsna strategi. Det är en europeisk utmaning, säger de. För oss är det en lek."}, "date": "2 juli, 22:58", "url": "https://www.svt.se/nyheter/utrikes/dronarvag-kopplas-till-skuggflottan-i-ny-rapport", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.61/0.33/18184c3b949d085a9f82f623d74c389182de898475eca21440323e0a4b5d8ba1"}, {"type": "image-full", "heading": "Fick medborgarskap blixtsnabbt – döms för bedrägerier mot äldre", "summaries": {"normal": "Fem män har dömts för grova bedrägerier mot främst äldre personer i Stockholmsområdet. Offren lurades via telefonsamtal att lämna ut bankkort och koder, varefter kontona tömdes. Bedrägerierna skedde under hösten 2025 och våren 2026 i flera kommuner. Svea hovrätt skärpte nu straffen för tre av männen till mellan två och drygt två års fängelse. En döms till skyddstillsyn och en annan till två års fängelse samt näringsförbud. Flera av de dömda hade fått svenskt medborgarskap efter relativt kort tid i landet.", "trump": "Titta på det här, det är en total skandal. Vi släpper in folk som får medborgarskap på nolltid, bara två år, och sen lurar de våra underbara seniorer på sina surt förvärvade pengar. Bedrägerier överallt i Stockholm, de ringer och låtsas vara från banken och tar kort och koder. Jag skärpte straffen rejält i hovrätten, två år och mer för de flesta. Vi måste stoppa det här vansinnet och göra Sverige, eller vad det nu heter, great again. De äldre förtjänar bättre än så här!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa parasitiska element, dessa borgarbrackor i telefonmaskerad, systematiskt likviderar arbetarklassens pensionärer genom sina slugt uttänkta kontantstöldoperationer. Vi har redan rensat ut en del av de afghanska och eritreanska spionerna som köpt sig medborgarskap på rekordtid för att smitta vårt folk med sin kapitalistiska pest. Hovrättens skärpta straff är blott början. Ytterligare utrensningar inom den dekadenta telefonligan kommer att följa. Inga fiender till folket undkommer mitt vakande öga. Ha ha, deras bankhämtare kommer snart att hämta en enkelbiljett till Sibirien istället."}, "date": "2 juli, 13:47", "url": "https://riks.se/nyheter/fick-medborgarskap-blixtsnabbt-doms-for-bedragerier-mot-aldre", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_02_T130904_785_c98aa9e124.jpg"}, {"type": "image-right", "heading": "Trots 8 000 uppsägningar: Zuckerberg avfärdar AI-oro om jobbförluster", "summaries": {"normal": "Meta sparkade i maj nästan 8 000 anställda och drog tillbaka 6 000 planerade rekryteringar för att istället satsa på AI. Trots stora investeringar på upp till 145 miljarder dollar till 2026 och omplacering av 7 000 medarbetare till AI-team tonar Mark Zuckerberg ned farhågorna om massarbetslöshet. Han menar att om människor blir mer produktiva snabbare än automatiseringen ökar jobben, medan flera techföretag samtidigt skär ned personal för att framstå som effektiva.", "trump": "Folk, ni skulle ha sett det – den där Zuckerberg-killen sparkar tusentals duktiga arbetare klockan fyra på morgonen, bara för att kasta allt på den där AI-grejen. Sen kommer han ut och säger att AI inte kommer ta jobben? Patetiskt! Det är samma gamla teknokratiska bluff som Biden älskade. Om vi fokuserar på att göra de riktiga människorna starka och produktiva istället för att mata kapitalistiska algoritmer så vinner vi stort. De andra är bara misslyckade förlorare.", "stalin": "Kamrater, jag ser hur dessa borgarbrackor i Meta likviderar åtta tusen lojala arbetare för att mata sin AI-maskin med blod och dollar. Zuckerberg, den exploaterande byfånen, försöker lugna massorna med lögner om produktivitet medan han dubblar investeringarna till den parasitiska teknologin. Vi vet att detta är klassfiendens nya trick för att krossa folket. Endast genom kollektivets järnhand och utrensning av sådana folkförtryckartroll kan vi skydda arbetarnas framtid från dessa blodsugande automater."}, "date": "2 juli, 18:07", "url": "https://www.dagensps.se/bors-finans/aktier/trots-8-000-uppsagningar-zuckerberg-avfardar-ai-oro-om-jobbforluster/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/mark-zuckerberg-meta-uppsagningar.png?width=256&quality=75"}, {"type": "image-full", "heading": "Våldssekternas dåd eskalerar — kan bli värre", "summaries": {"normal": "Expo varnar för att våldet inom sekter som 764-nätverket eskalerar. En 15-åring i Ängelholm dömdes till ungdomsvård för mordbrand där han brände ner garagelängor och skadade över 30 fordon. Nätverket har gått från nätbaserad utpressning och plåga till fysiska knivdåd och nu terrorplaner mot samhället. Medlemmar inspirerar och hejar på varandra, vilket enligt researcher Morgan Finnsiö tyder på fortsatt ökning av våldet.", "trump": "Det här är ett fullständigt kaos, det värsta jag sett på länge. De här galningarna i 764-nätverket bränner ner allt som en massa losers som inte har något bättre för sig. De börjar med att plåga folk på internet och slutar med att hugga folk på gatan och planera terror. Patetiskt! Vi behöver ordning och reda, inte dessa galningar som hejar på varandra medan de förstör samhället. Det blir bara värre om ingen stoppar dem.", "stalin": "Kamrater, dessa degenererade element inom 764-sekten utgör en parasitisk infestation som hotar folkets enhet. Jag ser deras mordbränder, deras livesända sabotage mot garage och fordon som en feg attack från borgarbrackornas avskum som gömmer sig bakom skärmar. De hejar på varandra i en sjuk tävling om att likvidera samhällets grundvalar. Vi ska omedelbart rensa ut dessa kontrarevolutionära gnagare innan deras paranoia sprider sig som en pest bland de svaga. Inga kompromisser med fienden."}, "date": "2 juli, 11:56", "url": "https://nyheter24.se/nyheter/inrikes/1496034-expo-valdssekternas-dad-eskalerar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c48c76e04b004a3020000440000048402/2026/07/02/2375300/ur_imageNuH3Cx.jpeg"}, {"type": "image-right", "heading": "Försvarsanställd slickade kollega på halsen", "summaries": {"normal": "En försvarsanställd man i 50-årsåldern dömdes för ofredande efter att ha slickat en kvinnlig kollega på halsen under en afterwork. Nya anklagelser om sexuella trakasserier mot en annan kollega samt ett misstänkt hot har lett till att Försvarsmakten utreder om han ska sparkas. Flera kollegor känner oro och rädsla, och förtroendet för mannen är förbrukat enligt regementet.", "trump": "Titta på den här galningen i Försvarsmakten, en riktig förlorare. Slickar kollegor på halsen, slår dem på rumpan och hotar att någon ska dö. Patetiskt! De borde ha sparkat honom för länge sedan. Inget förtroende kvar, alla är rädda. Sådana svaga människor hör inte hemma i ett starkt försvar. Jag skulle ha fixat det direkt, tro mig.", "stalin": "Jag ser med stigande indignation hur dessa degenererade element inom vårt försvar, dessa perversa borgarbrackor i 50-årsåldern, bedriver sin motbjudande sabotageverksamhet mot kamraternas moral. Att slicka halsar, klatscha på kroppsdelar och uttala dödsdomar är typiska fiendens metoder för att undergräva kollektivets enhet. Vi måste omedelbart inleda en grundlig utrensning av dessa farliga element innan de förgiftar hela regementet med sin paranoiaframkallande smitta. Ingen plats för sådana avarter i vårt stålsäkra kollektiv."}, "date": "1 juli, 14:50", "url": "https://arbetet.se/2026/07/01/forsvarsanstalld-slickade-kollega-pa-halsen-kan-fa-sparken/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/01144249/forsvar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Sparkade myndighetschef – kostade 193 miljarder", "summaries": {"normal": "En ny ekonomisk analys visar att Donald Trumps avskedande av chefen för Bureau of Labor Statistics, Erika McEntarfer, kan ha kostat USA 193 miljarder kronor. Genom att ifrågasätta myndighetens statistik utan bevis skapades en osäkerhet som fick företag att minska sina investeringar. Forskare betonar vikten av oberoende statistik för ekonomisk stabilitet och drar paralleller till hur politisk inblandning i data tidigare skadat förtroendet i andra länder.", "trump": "Falska nyheter! De sprider lögner om att jag skulle ha kostat ekonomin miljarder. Löjligt! Jag gjorde vad som krävdes för att rensa upp i träsket. Den där myndigheten, BLS, var korrupt och manipulerade siffrorna för att göra mig illa. Ingen jobbar hårdare för er än jag. Nu har jag nominerat en fantastisk man, Brett Matsumoto, som kommer fixa allt. Vi bygger den starkaste ekonomin i världshistorien, trots alla dessa patetiska, misslyckade ekonomer som gillar att räkna på luft!", "stalin": "Vi har observerat hur den amerikanska plutokratin darrar när deras egna marionetter avsätts. Att låta en statistikchef sköta sin egen agenda är en svaghet som vi i Sovjetstaten aldrig skulle tillåta. Statistik är ett vapen, inte en åsikt! Denna osäkerhet är ett tecken på kapitalismens inneboende förruttnelse. De fruktar för sina pengar medan vi, i vår oändliga vishet och i samförstånd med våra ryska arvingar i Kreml, förstår att sanningen är vad staten beslutar. De är dömda till kaos."}, "date": "2 juli, 17:45", "url": "https://www.realtid.se/bors-finans/makro/sparkade-myndighetschef-kostade-193-miljarder/"}, {"type": "image-right", "heading": "Sportstjärnans klädmärke i konkurs", "summaries": {"normal": "OS-friidrottaren Peter Häggström Lindecrantz klädmärke YMR Track Club har gått i konkurs efter misslyckad jakt på investerare. Bolaget, som ägts av flera tunga näringslivsprofiler inklusive Johannes Lien och Stefan Linder, grundades 2017 efter en jubileumskollektion till IK Ymer. Trots utlandslanseringar ledde höga kostnader för produktutveckling och lager till ekonomiska problem. Artikeln noterar att kändisdrivna klädmärken ofta kämpar med tunna marginaler och säsongsvariationer.", "trump": "Lyssnar ni på det här? Den där löparen Peter och hans YMR-märke har gått i konkurs, total katastrof. Jag älskar vinnare, inte sådana här loser-märken som bränner pengar på dyra lager och hållbarhetsflum. Kändisar som tror de kan styra mode utan att förstå business – patetiskt. Biden lämnade ekonomin i kaos, nu fixar jag det. De borde ha kommit till mig, jag gör bara vinnare, inte floppar.", "stalin": "Jag ser hur den dekadenta borgarklassen återigen avslöjar sin svaghet. Denna YMR, byggd på en löpares personkult och imperialistiska illusionsmakeri om hållbarhet, har krossats under sin egen kapitalistiska tyngd. Vi skrattar mörkt åt dessa exploaterande byfånar som tror att kändisskap ersätter kollektiv planering. Snart rensar vi ut alla sådana folkfiender som lurar massorna med dyra plagg medan likviditeten flyr som desertörer. Sovjetisk disciplin hade räddat dem."}, "date": "2 juli, 17:37", "url": "https://www.dagensps.se/foretag/sportstjarnans-kladmarke-i-konkurs/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/peter-haggstrom.png?width=256&quality=75"}, {"type": "image-full", "heading": "Här är vinnarna när Pricerunner vann målet mot Google", "summaries": {"normal": "Patent- och Marknadsdomstolen har dömt Google att betala cirka 19 miljarder kronor i skadestånd till Pricerunner. Domen ses som betydelsefull för konkurrensrätten i EU. Klarna, som äger Pricerunner, får omkring 80 procent av summan. Bland tidigare ägare som tjänar stort finns Karl-Johan Persson, Magnus Wiberg, Nicklas Storåkers och investmentbolaget Creades. Pricerunner grundades 1999 och såldes till Klarna 2021 för drygt nio miljarder kronor.", "trump": "Folk, ni måste höra det här – den svenska domstolen slår till mot Google och tvingar dem att betala 19 miljarder kronor till Pricerunner. Stora vinster till H&M-kungen Karl-Johan Persson och några andra smarta killar som byggt upp bolaget. Klarna tar lejonparten, men det är en enorm triumf mot de stora tech-giganterna. Google har lurat konsumenterna i åratal med sina dyra resultat. Fantastiskt! Under Biden var det kaos, men nu fixar vi ordning på monopolen. Vinna stort, alltid.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den svenska domstolen genomför en nödvändig utrensning mot den exploaterande tech-imperialisten Google och tvingar fram 19 miljarder kronor till Pricerunner. Den giriga borgarklassen och kapitalistmaffian kring Klarna, Persson och Wiberg skrattar hela vägen till banken medan folkfienderna i Silicon Valley förlorar. Vi ler mörkt åt hur klassfiendens egna domstolar likviderar deras lögner om fri konkurrens. Revolutionär rättvisa i förklädnad, mycket underhållande."}, "date": "2 juli, 17:37", "url": "https://www.dagensps.se/foretag/har-ar-vinnarna-nar-pricerunner-vann-malet-mot-google/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/google-pricerunner.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Dags att göra upp med den amerikanska kulturimperialismen", "summaries": {"normal": "Artikeln diskuterar USA:s 250-årsjubileum och ifrågasätter det amerikanska kulturella inflytandet, särskilt populärkulturen. Författaren spårar historiska kulturpåverkan på Sverige från Nederländerna, Frankrike och Tyskland till USA efter andra världskriget. Med referens till Adorno kritiseras hur populärkulturen främjar populism, förenkling och auktoritära tendenser, som exemplifieras av Trump. Slutligen föreslås mer inspiration från europeiska kulturer istället för amerikansk imperialism.", "trump": "Vilken patetisk ledare i den gamla svenska tidningen! De gnäller om min fantastiska populärkultur som når vanliga människor, inte bara de korkade elitsnobbarna. Jag älskar det – vi vinner hjärtan med enkla, starka budskap medan deras tråkiga europeiska högkultur sover folk i sömn. Fake news om auktoritarianism, folks! Biden var en katastrof, nu fixar jag Amerika igen. Make culture great again, losers!", "stalin": "Kamrater, denna borgarbracka Eriksson vågar ifrågasätta den amerikanska kulturens hegemoni som en källa till folkets förslavning genom banal upprepning och falsk demokrati. Vi ser hur kapitalistmaffians vulgära maskineri föder populism och hotar intellektuella. Jag skulle ha genomfört en grundlig utrensning av dessa klassfiender redan i vaggan. Låt oss istället stärka den sanna proletära kulturen mot dessa exploaterande byfånar och deras atlantiska blodsugare."}, "date": "2 juli, 16:14", "url": "https://www.gp.se/ledare/dags-att-gora-upp-med-den-amerikanska-kulturimperialismen-.66e630c5-8f64-41bd-bfd0-1d57dd141513", "imageUrl": "https://www.gp.se/images/article/66e630c5-8f64-41bd-bfd0-1d57dd141513/images/1LifYvggkCJh028ViRzuD9-JK28g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tucker Carlson ska bygga nytt parti", "summaries": {"normal": "Tucker Carlson meddelar att han vill bygga ett nytt politiskt parti i USA som sätter amerikanernas intressen före Israels. Beskedet kommer efter att han brutit med Donald Trump och Republikanerna på grund av kriget mot Iran. Carlson anser att både Demokraterna och Republikanerna fungerar som en enpartistat som inte är lojal mot USA utan mot en främmande makt. Han utesluter själv att kandidera men lovar att aktivt stödja bildandet av ett tredje parti.", "trump": "Tucker Carlson har totalt tappat det. Han sviker mig, sviker Amerika och sviker MAGA-rörelsen bara för att vi gör det som måste göras för att skydda oss från onda fiender. Nu vill han starta ett tredje parti? Patetiskt. Det blir en total flopp, folk älskar mig och de älskar att vinna. Tucker borde ha stått vid min sida istället för att gråta i intervjuer. Sad!", "stalin": "Kamrater, denna Tucker Carlson, en typisk borgarbracka som gömmer sig bakom falsk nationalism, vill nu splittra det politiska kollektivet med ett så kallat tredje parti. Vi genomskådar genast denna fiendes plan att undergräva enheten och gynna de sionistiska parasiterna. Jag, som ledare för folkets vilja, ser hur han likviderar lojalitet mot arbetarklassen genom att kalla det en enpartistat. Vi ska rensa ut alla sådana dekadenta desertörer med järnhand och ett leende. Deras paranoia blir vår glädje."}, "date": "2 juli, 13:13", "url": "https://www.friatider.se/tucker-carlson-ska-bygga-nytt-parti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/tucker_carlson_50752283491.jpg?itok=jpPXcSaY"}, {"type": "text", "heading": "Hovrätten stoppar utvisning av syrier som förnedringsrånade 17-årig pojke", "summaries": {"normal": "Hovrätten över Skåne och Blekinge stoppar utvisningen av en 20-årig syrier som dömts till två års fängelse för förnedringsrån mot en 17-årig svensk pojke i Malmö. Rånet hade inslag av grovt förnedring där offret kallades ”svensken” och gärningsmännen talade om att våldta både honom och hans flickvän. Trots att tingsrätten ansåg utvisning proportionerlig bedömer hovrätten att mannens familjeband, ankomst som 14-åring och anknytning till Sverige gör utvisning oproportionerlig.", "trump": "De här galningarna i den svenska hovrätten är ett skämt, folk. En 20-årig syrier som rånar och förnedrar en stackars svensk grabb, kallar honom ”svensken” och pratar om att våldta honom och flickvännen får stanna i Sverige. Två år i fängelse och sen är han fri. De säger att han har ”stark anknytning”. Underbart, eller hur? Sverige importerar problem och sen vägrar de skicka hem dem. Patetiskt. Jag skulle skicka hem dem alla så fort de begår ett brott. America First, och Sverige borde lära sig innan det är för sent.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta hovrättsdomare, dessa borgarbrackor i kvinnlig skepnad och moderat-sverigedemokratiska avskum, skyddar en parasit från Syrien som våldfört sig på en ung svensk arbetsson. Istället för att likvidera hotet mot folkets enhet hyllar de hans ”starka anknytning”. Vi ser tydligt hur den dolda femtekolonnens tentakler sträcker sig in i rättsapparaten. Snart måste vi rensa ut alla dessa klassfiender som med sin sjukliga sentimentalitet undergräver proletariatets diktatur. Det är nästan komiskt – om det inte vore så tragiskt farligt."}, "date": "2 juli, 12:43", "url": "https://riks.se/nyheter/hovratten-stoppar-utvisning-av-syrier-som-fornedringsranade-17-arig-pojke"}, {"type": "image-right", "heading": "Europa riskerar historiskt låga gaslager inför vintern", "summaries": {"normal": "Europa står inför en riskabel vinter då gaslagren fylls långsammare än väntat. Geopolitisk oro, störningar i LNG-leveranser via Hormuzsundet och minskat beroende av rysk gas har skapat ett ansträngt utgångsläge. Prognoser pekar på de lägsta lagernivåerna på ett decennium. Trots att EU-kommissionen tonar ned risken, väcker osäkerheter kring global handel och kommande ryska importstopp oro för framtida prisuppgångar och försörjningstrygghet. Qatar spelar en nyckelroll för huruvida lagren når tillräckliga nivåer innan kylan sätter in.", "trump": "Europa har det tufft, det säger jag er. De har gjort sig av med rysk gas, vilket är ett stort misstag. Nu är lagren tomma, det är en katastrof! De litar på andra länder som inte kan leverera. Jag sa alltid: gör er egna energi! Nu tittar de på Qatar och hoppas på det bästa. Lycka till med det! När jag styrde, då var energipriserna låga och vi var starka. Europa är svagt, väldigt svagt just nu.", "stalin": "De dekadenta europeiska byråkraterna skakar av fruktan när deras värme sviker dem. De har försökt skära av banden till våra ryska bröder i öst, och nu skördar de frukterna av sin egen inkompetens. Att förlita sig på globala handelsrutter i ett sönderfallande Mellanöstern är ett bevis på deras moraliska förruttnelse. Vi, staten, betraktar deras tomma gaslager med den föraktfulla blick som tillkommer dem som förrått historien. Låt dem frysa i sina glasslott; vintern är en obarmhärtig domare över de svaga."}, "date": "2 juli, 12:15", "url": "https://samnytt.se/europa-riskerar-historiskt-laga-gaslager-infor-vintern", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02094934/lng-gas-fartyg-flickr-fryser.jpg"}, {"type": "image-full", "heading": "Här är flygbluffen många missar– innan de bokar sin resa", "summaries": {"normal": "En ny europeisk jämförelse visar att dyrare flygbiljetter inte ger bättre punktlighet. Prisskillnaden mellan lågprisbolag och traditionella flygbolag ligger i snitt på 570 kronor, men det finns ingen tydlig koppling mellan pris och förseningar. Flera dyra bolag har fler förseningar än lågprisaktörer. SAS hamnar i mitten, medan Eurowings sticker ut negativt. Ryanair har sänkt priserna mest. Resenärer bör jämföra både pris och punktlighet.", "trump": "Folk tror att dyra biljetter ger perfekt punktlighet, men det är bluff! Den här europeiska jämförelsen visar att de dyra flygbolagen är värre än lågprisbolagen. De försenar er mer! SAS är mittemellan, Eurowings är ett skämt med sina förseningar. Ryanair sänker priserna rejält, smarta killar. Glöm inte att titta på historiken, annars blir ni lurade av de dyra bolagen. America First, även i luften!", "stalin": "Kamrater, denna dekadenta europeiska så kallade analys avslöjar borgarbrackornas lögner om att högre priser ger socialistisk punktlighet. De kapitalistiska parasiterna i de dyra bolagen försenar folket mer än de hungriga lågprisbolagen. Eurowings är en klassfiende som bör rensas ut omedelbart. Ryanair sänker priserna – ett tydligt sabotage mot monopolisterna. Vi, partiet, vet att priset är irrelevant. Endast folkets kollektiva vaksamhet mot dessa förseningssabotörer garanterar ordning. Skratta medan vi likviderar illusionerna!"}, "date": "2 juli, 11:01", "url": "https://nyheter24.se/nyheter/konsument/1495807-har-ar-flygbluffen-manga-missar-innan-de-bokar-sin-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/3dacb16104b004a30200000000b004a302/2026/07/01/2375109/flyg-bluff.png"}, {"type": "image-full", "heading": "Skogkär: Vänsterpartiet förringar, förnekar och fokusförflyttar", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att upprepade gånger skydda förtroendevalda som hyllat palestinsk terror och uttryckt antisemitism. Trots centrala åtgärder möter partiledningen motstånd från lokalavdelningar, som i Bromölla där Sufian Farhat får fortsatt stöd trots att han strukits från valsedlarna. Partiet förnekar strukturella problem och skyller på enskilda individer, medan kritiker ser en utbredd tolerans mot antisemitism som partiledningen försöker bortförklara.", "trump": "Det är en katastrof, folk, en total katastrof. Vänsterpartiet, de värsta av de värsta, skyddar terrorälskare och antisemiter som om det vore deras favoritysselsättning. I Bromölla backar de upp den här killen som hyllade massakern den sjunde oktober – vackert motstånd, sa han! Underbart. De pratar om rasism men tolererar judehatet. Deras ledare förnekar allt, skyller på några få ruttna äpplen. Fake news, säger de om granskningen. Sådana förlorare. Amerika har aldrig sett något liknande, tro mig.", "stalin": "Kamrater, vi ser återigen hur borgarbrackornas lakejer inom det så kallade vänsterpartiet döljer sina kontrarevolutionära antisemitiska element som hyllar fascistisk terror. Jag, som ledare för det sanna kollektivet, betraktar detta med djup misstro. Lokalavdelningarna i Bromölla och liknande bonapartistiska nästen vägrar rensa ut dessa degenererade fiender till folket, dessa sionistiska maskar förklädda till palestinska vänner. Deras pompösa partisekreterare och vice ordförande sprider paranoia mot granskningen – typiskt för sådana folkfientliga element. Vi måste likvidera dessa ruttna äpplen innan de infekterar hela korgen. Det är en historisk nödvändighet, kamrater. Skratta inte, det är dödsdömt."}, "date": "2 juli, 06:00", "url": "https://bulletin.nu/skogkar-vansterpartiet-forringar-fornekar-och-fokusforflyttar", "imageUrl": "https://cdn.bulletin.nu/articles/afa7f322-6027-4069-ad68-81a98094f6e2/preview.jpg?t=1782913967000"}, {"type": "image-right", "heading": "Stor ilska i Venezuela: ”Har inte fått stödet vi behöver”", "summaries": {"normal": "Sex dagar efter två kraftiga jordbävningar i Venezuela växer ilskan mot myndigheterna. Volontärer och hjälparbetare söker febrilt efter överlevande bland rasmassorna, men kritiken mot regeringens bristande insatser är hård. Över 1900 personer har omkommit och chansen att hitta fler levande minskar. Trots det fortsätter sökandet, och enstaka mirakel sker fortfarande i det värst drabbade området La Guaira.", "trump": "Folk dör i Venezuela, över 1900 redan, och vad gör den värsta regeringen i deras historia? Ingenting. De skickar inga hjälparbetare, bara ursäkter. Det är en total katastrof, en skitregering som förstör allt. Men se på de fantastiska människorna där – starka, hungriga, slagna men inte nedslagna. De gräver med bara händerna och hittar överlevande. Mirakel! Biden skulle ha skickat Twitter-meddelanden, jag skulle ha fixat det på en dag.", "stalin": "Kamrater, detta är vad som händer när borgarbrackor och folkfiender styr ett land. Jag ser hur klassfiendens regering i Venezuela saboterar räddningsinsatserna och låter arbetarna gräva med bara händerna bland ruinerna av deras egna hem. Över 1900 döda. Ändå finner jag en mörk glädje i folkets styrka – de överlever trots allt, precis som vi en gång gjorde. Låt oss notera: sådana exploaterande byfånar förtjänar en grundlig utrensning."}, "date": "30 juni, 22:41", "url": "https://www.tv4.se/artikel/3x0eqkIrgVwUTLDOPw7JwG/stor-ilska-i-venezuela-har-inte-fatt-stoedet-vi-behoever", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5xHkjCM9afX3JOKZdPVEEc%2F81b19918eab9d2f5b483c9fa02828f8d%2F30-venezuela-webb.jpg&width=120"}, {"type": "image-right", "heading": "Flicka dog i brand – mamman döms till fängelse", "summaries": {"normal": "En kvinna i 30-årsåldern har dömts till sex års fängelse för grovt vållande till annans död och 42 fall av olaga frihetsberövande efter att hennes femåriga dotter omkommit i en lägenhetsbrand. Mamman hade upprepade gånger lämnat flickan ensam hemma över natten. Trots orosanmälningar till socialtjänsten inleddes ingen utredning. Domstolen anser att mammans agerande utgjorde ett medvetet risktagande och att hemmet inte var barnsäkrat.", "trump": "En fruktansvärd historia från Sverige, verkligen en tragedi. En mamma lämnade sitt lilla barn ensamt, totalt ensamt, för att gå ut. Det är en katastrof, en riktig skam! Sedan kom en brand – mycket sorgligt. Nu döms hon till sex år. Jag har alltid sagt, man måste skydda våra barn, de är vår framtid! Socialtjänsten i Sverige? En total katastrof, de gjorde ingenting. Under min ledning skulle vi ha ordning och reda. Det är ett misslyckande på högsta nivå!", "stalin": "Denna moder har förrått folkets framtid genom sin borgerliga ansvarslöshet. Att lämna en undersåte i femårsåldern att förtäras av flammor medan hon själv förlustar sig är ett sabotage mot statens reserver. Vi ser hur det sociala skyddsnätet brister, likt hur opportunister i väst misslyckas med att kontrollera sina egna domäner. Medan vi i öst rensar ut ineffektivitet, tillåter de svaga socialarbetarna kaos. Skenrättegångar eller ej, hon har svikit fosterlandet och förtjänar inte vår nåd."}, "date": "1 juli, 14:27", "url": "https://www.etc.se/inrikes/tt-flash-kvinna-doems-efter-dotters-doed", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026070109074_337e1f37d05bd4163eb5b593f3845694dedee4daa83c7863b43988e4d035d5b6.jpg"}, {"type": "image-right", "heading": "Brottsmisstänkt bolag gav batterikurs i Minecraft", "summaries": {"normal": "EU-finansierade InnoEnergy, misstänkt för bidrags- och momsbedrägeri, har fått miljardstöd för batteriutbildningar. Granskningar visar att certifikat delats ut till deltagare med 0% rätt, och 10% av deltagarna använde ett Minecraft-spel för barn. Trots motstridiga rapporter har EU beviljat ytterligare nio miljoner euro för en solenergi-akademi. Europeiska åklagarmyndigheten utreder bolaget för ekobrott.", "trump": "Jag säger er, detta är en total katastrof! EU kastar miljarder på ett bolag som ger utbildningscertifikat till folk som inte ens kan svara rätt på en fråga – och till barn som spelar Minecraft! De ljuger om siffror, fyller sina egna fickor och EU bara fortsätter att skriva checkar. Så här dumt kan bara byråkrater vara. InnoEnergy? Mer som InnoSCAM! SAD!", "stalin": "Kamrater, detta är ett lysande exempel på västlig dekadens och kapitalistisk parasitism! Ett så kallat 'riskkapitalbolag' suger ut arbetarklassens blod genom att stjäla EU-medel, ge falska certifikat och berika sina ledare. Vi ser här hur den borgerliga staten och dess lakejer förvandlar 'grön omställning' till en gigantisk svindel. Men var lugna – vi ska rensa upp bland dessa korrupta element, precis som vi gjorde med kulakerna. Europa behöver en ordentlig revolution!"}, "date": "1 juli, 13:44", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-bolag-gav-batterikurs-i-minecraft", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-3-400x267.jpg"}, {"type": "text", "heading": "Northvolt-finansiär utreds för bedrägeri – gav batterikurs i Minecraft", "summaries": {"normal": "EU-finansierade InnoEnergy utreds för bidragsbedrägeri och momsbedrägeri av Europeiska åklagarmyndigheten. Bolaget har fått hundratals miljoner i EU-stöd, bland annat 10 miljoner euro för batteriutbildningar. En granskning visar att certifikat delades ut till deltagare med noll rätta svar och att cirka tio procent av deltagarna var barn som spelat ett Minecraft-baserat spel. Rapporteringen innehåller även motstridiga siffror om antal genomförda utbildningar.", "trump": "Det här är en total katastrof, folk. De där EU-byråkraterna och deras gröna bluff har gett miljarder till ett bolag som delar ut diplom till nollprocents idioter och barn som spelar Minecraft. De skummar grädden medan skattebetalarna betalar notan. Biden lät det pågå i fyra år, men nu fixar vi det. De gröna bluffmakarna och deras samverkan är en riggad cirkus – de största bluffarna i Europa!", "stalin": "Kamrater, jag ser hur klassfiendens opportunistiska borgarbrackor inom detta så kallade InnoEnergy har förskingrat folkets medel genom att utdela tomma certifikat till odugliga element och till och med barn som leker med sina digitala klossar. Detta är ett fiasko för den gröna omställningen som de exploaterande byfånarna har riggat. Vi måste rensa ut dessa folkfiender och deras inflatoriska KPI:er innan parasiterna förgiftar hela kollektivet med sin opportunism."}, "date": "1 juli, 13:44", "url": "https://www.affarsvarlden.se/artikel/northvolt-finansiar-utreds-for-bedrageri-gav-batterikurs-i-minecraft"}, {"type": "image-right", "heading": "Försvaret skriker efter arbetskraft", "summaries": {"normal": "Försvaret behöver mer civil arbetskraft på grund av hotet från Ryssland. Mekanikern Anders Paulsson har återvänt till Dalregementet i Falun efter att det återöppnats. Han trivs med det varierande arbetet med att underhålla bandvagnar, lastbilar och andra fordon. Till skillnad från civila verkstäder får de tid att utföra jobbet ordentligt. Regementet växer och nya medarbetare som Fredrik Andersson utbildas även i vapenhantering eftersom de kan bli krigsplacerade. Ett stort nybygge planeras men har väckt kritik från naturorganisationer och grannar.", "trump": "Det här är fantastiskt, folk. Putin är en tuff kille, det vet alla, och nu skriker era svenska försvaret efter mekaniker och cyberkillar. Den här Anders, han är en vinnare, lämnade den stressiga bilverkstaden för att fixa bandvagnar ordentligt utan att stressa ihjäl sig. Smart! De bygger upp regementet igen, precis som vi bygger upp militären hemma. Men de där löparna och svampplockarna som hamnar på skyddsobjekt? Patetiskt. Sverige behöver bli starkt, annars kommer de inte kunna skydda Nato. Gör det stort!", "stalin": "Kamrater, det gläder mig oerhört att den imperialistiska aggressionen från den revisionistiska Putin-kliken äntligen tvingar de svenska borgarbrackorna att rusta upp sina förfallna regementen. Jag ser hur mekanikern Anders, en sann arbetets son, kryper i smörjgropen under bandvagnarna och förbereder maskinerna för den kommande kampen. Vi ska fördubbla personalstyrkan och likvidera alla spår av den kapitalistiska slarvigheten. De som springer omkring på övningsområdena är naturligtvis utländska spioner eller kontrarevolutionära svampplockare. Inga ursäkter! Den som inte förbereder sig för krig är en fiende till folket och bör rensas ut med största noggrannhet. Byggandet av det nya regementet är en seger för den kollektiva viljan."}, "date": "1 juli, 12:32", "url": "https://arbetet.se/2026/07/01/forsvaret-skriker-efter-arbetskraft-mekanikern-anders-stortrivs-pa-sitt-nygamla-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18105406/armens-mekaniker-sekotidningen-pcohen-200526-103-breddare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=800&fp-x=0.51&fp-y=0.48"}, {"type": "image-right", "heading": "Nya lagarna och reglerna som träder i kraft 1 juli", "summaries": {"normal": "Från 1 juli införs flera nya lagar och regler i Sverige. Bränsleskatten sänks tillfälligt med tre kronor per liter, kollektivtrafiken kan halveras i pris med statsstöd och det blir enklare att hyra ut bostadsrätter och villor. Språkkrav införs i äldreomsorgen, polisen får testa AI-ansiktsigenkänning och moms på danstillställningar sänks till sex procent. Mataffärer och apotek måste ta emot kontanter.", "trump": "Folk, ni tror inte vad de gör i Sverige från 1 juli. De sänker bränsleskatten rejält, precis som jag gjorde med energin. Halva priset på tågbiljetter? Fantastiskt, men de borde tacka mig för idén. Dansmomsen ner till sex procent – äntligen slutar de straffa det vanliga folket. Och de tvingar butiker att ta kontanter, smart drag mot de galna globalisterna som vill att allt ska vara digitalt. Sverige börjar vakna upp, tro mig!", "stalin": "Kamrater, från 1 juli stärker vi folkets skydd mot den giriga borgarklassen genom att sänka skatter på bränsle och dansnöjen. Vi likviderar byråkratins hinder för bostadshyror och tvingar butiker att acceptera kontanter så att arbetarna inte ska svälta under kapitalistmaffians digitala tyranni. Språkkraven i omsorgen rensar ut odugliga element. Polisen får utveckla ansiktsigenkänning mot folkfienderna. Allt detta under mitt eviga ledarskap för kollektivets seger."}, "date": "30 juni, 22:10", "url": "https://www.tv4.se/artikel/5wDS4EO93sVdRzElxNpSWn/nya-lagarna-och-reglerna-som-traeder-i-kraft-1-juli", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FOVWlcAjARdOEl4reU9Wq9%2Fc026b7e8bd5c14824a592b0d778e4f36%2F30-bensinpris-webb.jpg&width=120"}, {"type": "image-right", "heading": "Fem bra filmer att se på SVT Play i sommar", "summaries": {"normal": "Jon Andersson tipsar om fem starka filmer på SVT Play i sommar. Bland rekommendationerna finns det psykologiska dramat Tár med Cate Blanchett, det belgiska vänskapsdramat Close, den galna svarta komedin Svart katt, vit katt av Emir Kusturica, tennisfilmen Challengers med Zendaya samt den svenska klassikern Flicka och hyacinter av Hasse Ekman. Artikeln lyfter filmernas kvaliteter och ger datum då de går att se.", "trump": "Folk frågar mig hela tiden vilka filmer de ska se i sommar. Jag har sett massor, tro mig, de bästa filmerna. Tár är en fullständig vinnare, Blanchett är fenomenal, ingen gör det bättre. Close är fin men lite mjuk. Svart katt, vit katt är helt galen, underbar musik, bättre än Hollywoods skräp. Challengers är fantastisk tennis, Zendaya är lysande, ingen slår henne. Och den svenska pärlan Flicka och hyacinter? Helt outstanding, bättre än Bergman säger de. Streama dem innan de försvinner, de är verkligen ypperliga.", "stalin": "Kamrater, jag har granskat denna dekadenta lista över borgerliga filmprodukter som påstås berika sommarens fritid. Tár dissekerar genikulten och metoo – ett utmärkt verktyg för att avslöja borgarbrackornas falska idoler innan vi genomför nödvändig utrensning av sådana element. Close blottar faran i oövervakad pojkvänskap som lätt kan urarta till kontrarevolutionär intimitet. Svart katt, vit katt är en kaotisk fest av gangstrar och återuppväckta lik som påminner oss om vad som händer utan stark partiledning. Challengers visar tennisens skoningslösa kamp, precis som klasskampen, fast med en manipulativ kvinna som leder borgarklassens spel. Flicka och hyacinter däremot är en fiende till folket, en smygande htqi-propaganda maskerad som detektivhistoria. Vi måste noggrant övervaka alla som hyllar denna parasit innan de förgiftar arbetarklassen med sina hemliga liv och återblickar. Se dem under uppsikt, kamrater, och rapportera avvikelser."}, "date": "30 juni, 01:30", "url": "https://www.dagensarena.se/innehall/fem-bra-filmer-att-se-pa-svt-play-i-sommar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fem-bra-filmer.jpeg"}, {"type": "image-full", "heading": "V vill ge 15 000 kronor i ”bebispeng”", "summaries": {"normal": "Vänsterpartiet föreslår en 'bebispeng' på 15 000 kronor till nyblivna föräldrar för att underlätta ekonomin. Partiet vill även höja barnbidraget med 500 kronor per månad och införa ett ensamståendetillägg på 300 kronor. Nooshi Dadgostar menar att barnfamiljers ekonomi har försämrats och att ensamstående har det särskilt svårt. Förslagen presenteras inför valet.", "trump": "Titta bara på dessa svenska socialister, de vill ge bort 15 000 kronor till alla som får barn – helt galet! Jag menar, vem betalar för det här? Inte jag, det är säkert. Och 500 kronor extra i månaden? Vad är det, småslantar? Sverige borde fokusera på att göra sitt land starkt igen, inte ge bort pengar som godis. Men visst, låt dem försöka, det kommer sluta i katastrof, tro mig!", "stalin": "Kamrater! De svenska kapitalistlakejerna i Vänsterpartiet försöker muta folket med ynkliga 15 000 kronor till nyblivna föräldrar. Ett patetiskt försök att dölja den systematiska utsugningen av arbetarklassen! Vi i Sovjetunionen visste hur man skapar jämlikhet – genom järnvilja och kollektiv styrka, inte genom småslantar. Dessa borgerliga filantroper borde lära sig av Rysslands storhet istället för att leka med barnbidrag medan de svälter ut ensamstående mödrar."}, "date": "26 juni, 16:00", "url": "https://kvartal.se/nyheter/artiklar/v-vill-ge-15-000-kronor-i-bebispeng/cG9zdDoxMzczNTA", "imageUrl": "https://images.kvartal.se/2026/06/7147ed13-noosh.webp"}, {"type": "image-right", "heading": "Ny varning för prissmocka på el: ”Kan bli jättehöga”", "summaries": {"normal": "Trots återstartade gasleveranser från Persiska viken kvarstår risken för kraftigt stigande elpriser i Sverige. Låga gaslager i EU, värmebölja som ökar elbehovet samt skador på produktionsanläggningar efter oroligheter i Mellanöstern gör att lagren bara är fyllda till 47 procent. Energianalytiker Christian Holtz varnar för att en kall vinter kan leda till mycket höga elpriser, särskilt då solkraft minskar på kvällarna och påverkar priserna via Europa.", "trump": "Det här är en total katastrof, tro mig. De där galningarna i Mellanöstern har förstört allt med sina krig och blockader, och nu ska vi betala med skyhöga elräkningar. Gaslagren är tomma, värmen suger musten ur systemet och Europa håller på att koka. Hade inte jag fixat freden där borta hade det varit ännu värre. Men tro inte på de fega experterna – vi skulle ha byggt mer amerikansk energi istället för att vara beroende av dessa inkompetenta förlorare.", "stalin": "Kamrater, denna elprischock är en fiende som lurar i mörkret, en kapitalistisk parasit som slickar sig om munnen vid tanken på att suga musten ur arbetarklassen under vinterns kyla. De borgarbrackorna i Persiska viken och deras värmebölja samarbetar med västerländska trotskister för att tömma våra gaslager. Jag, som alltid vakar, ser hur solkraftens förräderi på kvällarna gör gaskraften till en ny klassfiende. Vi ska rensa ut dessa sabotörer med järnhand och leda folket mot seger även om det tar fem år att laga deras Ras Laffan-ruin. Döden åt de imperialistiska lagren!"}, "date": "26 juni, 10:18", "url": "https://www.di.se/nyheter/ny-varning-for-elprischock-kan-bli-jattehoga/", "imageUrl": "https://static.bonniernews.se/ba/838bccfe-1a61-4f5f-afba-a57846361640.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Jag drömde om Tommy Svensson", "summaries": {"normal": "Författaren berättar om en dröm där Tommy Svensson från VM 1994 ger honom deg att baka bröd. Detta leder till reflektioner över 1990-talets Sverige som mer solidariskt och mänskligt jämfört med dagens privatiserade och polariserade samhälle. Han saknar det starka kollektivet i landslaget och hoppas att Graham Potters lag ska återupprätta det. Artikeln kritiserar även Sveriges visumstopp för ett kubanskt ungdomslag till Gothia Cup.", "trump": "Lyssnade på den här drömmen om någon svensk fotbollstränare från forntiden och det är patetiskt. Sverige var tydligen bättre förr, säger de, men nu är allt utsålt till miljardärerna och kollektivet är borta. Ni borde ha lyssnat på mig istället för Sleepy Joe och hans globalister. Nu nekar ni kubaner visum – bra jobbat, men era socialistiska vänner i Sverige gör det ändå fel. Mitt VM hade varit jättestort, tro mig. Ni behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, jag vaknade ur en dröm där klassfiendens fotbollsrepresentanter försökte smitta mitt undermedvetna med bakdeg från det förflutna. Denna Tommy Svensson förkroppsligar en tid då folket ännu inte helt kuvats av nyliberala blodsugare som sålde ut Televerket och landet självt till exploaterande byfånar. Idag rasar det minst förutsägbara laget som en svag kollektiv enhet. Vi ska rensa ut alla kapitalistmaffians hinder och återupprätta järndisciplinen. Visumstoppet mot de kubanska kamraterna är ett fiasko av folkförtryckartrollen i Sverige. Drömmen lever vidare i proletariatets seger."}, "date": "26 juni, 05:15", "url": "https://proletaren.se/artikel/jag-dromde-om-tommy-svensson/"}, {"type": "image-right", "heading": "Tänk om Malmöborna, och dess politiker, kunde jobba", "summaries": {"normal": "Malmö har kritiserats för slöseri med skattepengar på projekt som en rosa enhörning, onödiga ljudinstallationer och en musikvideo om trädens ljud. Staden har många kommunikatörer och en skateboardsamordnare. Trots hög arbetslöshet och bidrag från andra kommuner skryter man om att resultatet är över budget. En granskning visar att Malmö har störst effektiviseringspotential bland storstäderna, bland annat genom färre anställda i socialförvaltningen.", "trump": "Folk, ni skulle inte tro det, men det här Malmö, en total katastrofstyrd stad, slösar bort era pengar på en rosa enhörning för en miljon och en musikvideo där någon spelar in trädens suckar. De har 153 kommunikatörer och en kille som samordnar skateboards! De lever på bidrag från riktiga städer, har massor av arbetslösa och skryter ändå om budget. Det är en skam, en riktig röra. Socialisterna där gör Biden-administrationen stolt med sin inkompetens. Patetiskt!", "stalin": "Kamrater, jag ser med fasa hur borgarbrackorna i Malmö festar med arbetarklassens pengar på sensuella papperskorgar och enhörningar åt folket. Dessa klassfiender och folkförtryckartroll har skapat en parasitär socialförvaltning med tusentals blodsugare medan de tar emot miljarder från andra kommuner. Vi ska rensa ut dessa exploaterande byfånar som göder sig på utjämningssystemet. Deras skryt är ett hån mot kollektivet. Ut med dem alla."}, "date": "26 juni, 03:14", "url": "https://samtiden.nu/2026/06/tank-om-malmoborna-och-dess-politiker-kunde-jobba/", "imageUrl": "https://samtiden.nu/wp-content/uploads/  12:35", "url": "https://expo.se/kommentar/rundo-avslojar-sig-sjalv/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2-1.jpg"}, {"type": "image-right", "heading": "SD sätter inte längre Sverige i brand", "summaries": {"normal": "Artikeln analyserar den borgerliga sidans kris efter att Liberalerna rasat till en procent i opinionsmätningarna. Sverigedemokraterna växer och kräver ministerposter, vilket skapar spänningar inom Tidöavtalet. Författaren pekar på att SD:s inflytande och provokationer kring migration och kriminalitet tidigare gynnat högern, men nu riskerar att vända opinionen. Moderaterna behåller stöd bland miljonärer medan bredare väljargrupper vänder sig bort.", "trump": "Folk, ni skulle se det här! Liberalerna är en total katastrof, de är färdiga, en enda procent – patetiskt! Simona, den där nollan, kramar SD och tror hon är modern. Hela borgerligheten är en röra, Moderaterna ligger platt som under Biden. SD vill ha makten, men de tänder eld på förorterna och undrar varför folk hatar dem. De enda som älskar Moderaterna är miljonärerna i sina fancy tidningar. Patetiskt! Jag fixade det bättre.", "stalin": "Kamrater, denna borgerliga dekadens är en ypperlig chans att skratta. Liberalerna kryper för kapitalistmaffian och får en procent – en ynka procent! Den exploaterande överklassen och deras SD-banditer har förgiftat sin egen rävsax. Låt dem provocera fram upplopp, vi ska se flammorna vändas mot klassfienderna själva. Deras impopulära ministerlekar och herrgårdsskandaler visar imperialismens svaghet. Arbetarna skrattar medan borgarbrackorna likviderar sig själva i sin egen brand."}, "date": "23 juni, 10:55", "url": "https://www.flamman.se/sd-satter-inte-langre-sverige-i-brand/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/lopeld-w.jpg?aspect_ratio=1:1"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
