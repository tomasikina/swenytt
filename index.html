se/nyheter/inrikes/synen-pa-journalistiken-lika-polariserad-som-klimatfragan", "imageUrl": "https://www.svtstatic.se/image-news/125/square/0.57/0.32/d0d1bbda50376b6acebb9e8d051d0e5e0726518c857f451603512c2901c85b12"}, {"type": "image-right", "heading": "Kravet: Skicka över tusen \"flyktingbarn\" från Ceuta till fastlandet", "summaries": {"normal": "Omkring 1 100 ensamkommande minderåriga migranter från Marocko finns kvar i den spanska exklaven Ceuta där mottagningsanläggningarna är överfulla. Den lokala regeringen kräver att de snabbt flyttas till fastlandet enligt en ny migrationslag. Flera regioner styrs av PP och Vox vägrar ta emot dem medan Madrids regionalpresident Isabel Díaz Ayuso anser att de ska skickas tillbaka till Marocko. Över 72 000 migranter anlände under en vecka, de flesta återvände och 75 omkom.", "trump": "De här idioterna i Spanien har tusen så kallade flyktingbarn som ligger och sover på gatan i Ceuta. Totalt kaos! De borde skicka hem dem direkt, inte flytta runt dem som förlorare. Marocko skrattar åt dem. Jag skulle bygga en jättevägg och säga nej tack, vi har redan nog. Spanien behöver en stark ledare som inte låter alla bara promenera in. Patetiskt!", "stalin": "Kamrater, dessa degenererade borgarbrackor i Ceuta ropar på hjälp medan de gömmer tusen parasiterande element i lagerbyggnader. Vi ska rensa ut de imperialistiska agenterna som smyger över gränserna. Varje land tar hand om sina egna, utom de kapitalistiska parasiterna som skickar sina avskum till oss. Jag skrattar mörkt åt deras svaghet. Snart ska vi likvidera detta hot mot folkets enhet med byråkratisk effektivitet. Inga kompromisser!"}, "date": "6 augusti, 10:42", "url": "https://www.friatider.se/kravet-skicka-over-tusen-flyktingbarn-fran-ceuta-till-fastlandet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-627.jpg?itok=Nn_EDDnt"}, {"type": "image-full", "heading": "Helldén (MP): Höj bränslepriserna \"så snart som möjligt\"", "summaries": {"normal": "Miljöpartiets språkrör Daniel Helldén vill höja bränsleskatterna så snart som möjligt för att få folk att köra mindre bil. Han kritiserar regeringens och SD:s ”bensinpopulism” och uppskattar att partiets förslag kan höja bensinpriset med omkring åtta kronor per liter. Samtidigt föreslår MP en femdubbling av antalet kvotflyktingar från 900 till 5 000 och vill återinföra permanenta uppehållstillstånd.", "trump": "Folk, ni skulle inte tro det. Den här galningen från Miljöpartiet vill höja bensinpriset med åtta kronor! Totalt vansinne. Han hatar bilar, hatar folket och älskar att höja skatter. Och sen vill han släppa in fem gånger så många migranter. Sverige håller på att förstöras av dessa extremister. Vi behöver smarta ledare, inte miljöfanatiker som förstör ekonomin. Patetiskt!", "stalin": "Kamrater, denna Helldén är en äkta borgarlakej i gröna kläder. Jag säger att vi omedelbart höjer bränslepriserna till himlen så att de kapitalistiska bilburna parasiterna tvingas gå till fots som hederliga arbetare. Och kvotflyktingarna? Vi tar emot tiotusentals – desto fler desto bättre, de blir utmärkta redskap mot inhemska sabotageelement. Den som gnäller om integration ska rensas ut som en kontrarevolutionär element. Skrattretande svaga liberaler!"}, "date": "6 augusti, 10:00", "url": "https://riks.se/nyheter/helld-n-mp-hoj-branslepriserna-sa-snart-som-mojligt", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_28_e8076176cc.jpg"}, {"type": "image-right", "heading": "Kvinnor vill se välfärd istället för vapen", "summaries": {"normal": "Artikeln argumenterar för att kvinnor i högre utsträckning än män röstar vänster i riksdagsvalet, något som bekräftas av opinionsmätningar. Författaren, Vera Peterson, menar att kvinnors prioriteringar ligger inom välfärd, sjukvård, skola, miljö och jämställdhet snarare än militär upprustning. Hon uppmanar kvinnor att samlas kring parollen ”Välfärd istället för vapen” och kritiserar att militär satsning inte prioriteras i valkompasser.", "trump": "Folk, det är en total katastrof. De här vänstertjejerna röstar som galningar för mer välfärd och mindre försvar, precis som Sleepy Joe gjorde. Kvinnor vill ha gratis grejer istället för starka militärer – patetiskt! Vi behöver inga woke-kvoter och identitetspolitik, vi behöver Amerika först, eller Sverige först, vad fan det nu heter. De rödgröna kommer att förstöra landet med sina svaga idéer. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens kvinnor låtsas värna välfärden medan de i hemlighet undergräver folkets kollektiva styrka. Denna borgarbracka med sin paroll om välfärd istället för vapen är en farlig folkfiende som vill försvaga statens försvar mot imperialisternas hot. Vi måste rensa ut dessa dekadenta element som sätter privata önskemål före partiets och arbetarklassens järnhårda linje. Inga kompromisser!"}, "date": "5 augusti, 12:44", "url": "https://proletaren.se/artikel/kvinnor-vill-se-valfard-istallet-for-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/lk_vera-768x432.jpg"}, {"type": "image-right", "heading": "Vulgariserad valrörelse", "summaries": {"normal": "Valrörelsen har startat med amerikansk prägel där PR-byråer och vulgära utspel dominerar. Artikeln kritiserar likheterna mellan Socialdemokraterna och Moderaterna i politik kring EU, NATO, militärbudget och skattelättnader för rika. Exempel som Anna Tenjes grova inlägg på X, SD-ledares stunt på Göta kanal och migrationskrisen i Ceuta lyfts som exempel på infantiliserad debatt. Författaren efterlyser fokus på välfärd, bostadsbrist, klimat och rättvisa istället för polarisering.", "trump": "Folk, ni skulle se den här svenska valrörelsen – det är en total cirkus, en katastrof som till och med Biden skulle skämmas över. Den där Anna Tenje levererar rena bomben, fullträff mot den galna vänstern, men resten? Patetiskt. Kristersson och Andersson är samma gamla etablissemang, fast i EU:s och globalisternas ficka. SD kastar tjejer i sjön för att verka folkliga? Svagt. Vi behöver inga PR-tricks, vi behöver vinnare som sätter landet först. Make Sweden Great Again!", "stalin": "Kamrater, denna vulgära valkarusell är borgarklassens sista desperata skådespel för att dölja sin tomhet. De två blocken är identiska imperialister som låter Bryssel diktera och pumpar miljarder till krigsapparaten medan folket svälter. Tenjes lögner och Åkessons fåniga yachttrix är klassfiendens unkna underhållning. Vi ska inte kasta kvinnor i sjön utan likvidera hela detta parasitiska system. Endast en sann folkets stat kan rädda välfärden från dessa exploaterande byfånar."}, "date": "5 augusti, 12:37", "url": "https://proletaren.se/artikel/vulgariserad-valrorelse", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledarbild-768x432.jpg"}, {"type": "image-full", "heading": "Nya flygstrejker i Spanien – resenärer varnas", "summaries": {"normal": "Strejker bland markpersonal på flygplatserna i Barcelona och Palma de Mallorca riskerar att orsaka längre köer, förseningar och bagageproblem för resenärer till och från Spanien. Strejken i Barcelona pågår tills vidare medan en planerad strejk på Mallorca den 8 augusti återstår. Resenärer uppmanas att kontrollera flyginformation, checka in online och packa nödvändigheter i handbagaget. Minimitrafik har beslutats för att begränsa påverkan.", "trump": "De här lata strejkande på de spanska flygplatserna är ett totalt katastrof! Barcelona och Mallorca – kaos, köer, väskor som aldrig kommer fram. De borde jobba istället för att klaga, precis som mina fantastiska piloter. Jag byggde den bästa ekonomin, de här förlorarna förstör resorna. Kolla din flight, folk, annars blir det en stor, stor röra. Sad!", "stalin": "Kamrater, dessa borgarbrackor inom markservicen i Barcelona och Mallorca har återigen visat sitt förrädiska ansikte genom att sabotera det kollektiva resandet. Jag, som alltid vaktar mot kontrarevolutionära element, ser hur de parasitiska kapitalisterna gömmer sig bakom falska krav på arbetsmiljö. Vi ska rensa ut dessa dekadenta strejkande sabotageörer med järnhand och leda dem till en välförtjänt utrensning i folkets intresse. Härligt!"}, "date": "6 augusti, 05:59", "url": "https://nyheter24.se/nyheter/utrikes/1503000-nya-flygstrejker-i-spanien-resenarer-varnas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0f3bb32104b004a30200000000b004a302/2026/08/05/2382407/FlygstrejkBarc.jpg"}, {"type": "image-right", "heading": "Så trött på tågkaos", "summaries": {"normal": "Artikeln diskuterar hur sommarens tågförseningar förvärrats av solkurvor, spårfel och följdförseningar på en överbelastad järnväg. Huvudorsaken är bristande underhåll till följd av ett splittrat och outsourced system där vinstdrivande aktörer upphandlas. Detta har blivit dyrare och sämre. Författaren kräver en ny statlig järnvägsmyndighet med egen personal och maskiner för att återta kontrollen och förbättra säkerheten.", "trump": "Folk, ni anar inte hur illa det är med de här svenska tågen. Solkurvor, spårfel, totalt kaos! De har outsourcat allting till en massa korkade företag som bara suger pengar. Det är ett skämt. De borde ha byggt nya banor för länge sedan men istället svek de folket. Jag skulle fixa det på en vecka, tro mig. Bättre än någonsin. Inga fler ursäkter!", "stalin": "Kamrater, detta splittrade underhåll är en sabotagehandling utförd av giriga borgarbrackor och deras nyliberala lakejer. De låter italienska maskiner ruttna medan rälsen vrider sig som förrädiska ormar. Vi ska omedelbart inrätta en järnvägsmyndighet under partiets stålhand. Rensa ut alla upphandlingsjurister och profitörer. Nästa urspårning blir deras sista, det lovar jag er. Skrattet kommer att eka i deras celler."}, "date": "6 augusti, 01:55", "url": "https://www.dagensarena.se/opinion/sa-trott-pa-tagkaos", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidalisa-576x1024.png"}, {"type": "image-right", "heading": "Trump: Öppna Hormuz eller bli ”mycket hårt anfallet”", "summaries": {"normal": "Irans revolutionsgarde har beskjutit fartyg i Hormuzsundet. Donald Trump hotar med kraftiga attacker om sundet inte öppnas snart, men samtidigt pågår förhandlingar mellan USA, Iran och Oman om en tillfällig säker passage i 60 dagar. Flera länder medlar och en överenskommelse kan vara nära. Trump uppger att han tidigare ställt in attacker för att möjliggöra samtal.", "trump": "Hörni, det här är en total katastrof som de korkade iranierna ställt till med. Men tack vare mig, den bästa presidenten någonsin – mycket bättre än den sömnige Joe – så är vi nära ett fantastiskt avtal. Öppna Hormuz nu annars blir det så hårt att de aldrig glömmer det. Vi gör det igen, folk, stort och vackert!", "stalin": "Kamrater, dessa iranska imperialister och borgarbrackor leker farligt med världshandeln som vore den deras privata leksak. Jag har i min oändliga visdom godkänt förhandlingarna via Oman för att säkra passage, men om de sviker kollektivet väntar en grundlig utrensning av alla folkfiender som vågar störa Sovjetunionens – pardon, arbetarklassens – intressen. Paranoia? Nej, bara klokhet."}, "date": "5 augusti, 17:53", "url": "https://www.tv4.se/artikel/tt-260805-iranhormuzavtal1-a0a861b3/trump-oppna-hormuz-eller-bli-mycket-hart-anfallet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl7sRJD_YqBdI%2F454be385c2b5236f3a9bbe164522414e%2FIran_har_beskjutit_fartyg_i_Hormuzsundet_uppger_revolutionsgardet__enligt_nyhetsbyran_Tasnim.&width=120"}, {"type": "text", "heading": "Stockholmsbörsen avslutade dagen på nollan", "summaries": {"normal": "Stockholmsbörsen avslutade onsdagen oförändrad. OMXS30-indexet steg 0,02 procent till 3 326,93. Dagligvarusektorn steg 0,9 procent medan energi föll 3 procent. Bland större aktier steg Boliden 2,5 procent och Astra Zeneca 2,3 procent. Tele2 B och Ericsson B föll båda runt 2,5 procent. Bland mindre bolag noterades bland annat Transtema upp 12,4 procent efter ett nytt avtal och W5 Solutions ned 20,7 procent trots fördubbad omsättning.", "trump": "Jag, som den störste geniet i affärer, skulle ha gjort Stockholmsbörsen enorm framgångsrik! Istället är den oförändrad – en skam! Boliden och Astra Zeneca är vinnare, stora vinnare, precis som jag förutsåg. Tele2 och Ericsson? Tappa, tappa, tappa. Jag skulle ha sagt till dem: 'Börja sköta er jobb!' Men de är för svaga. Min börs skulle vara YUUGE!", "stalin": "Stockholmsbörsen visar klasskamptets grymma ansikte. Bourgeoisaktier som Transtema vinner på statliga avtal – en seger för det kollektiva. Men sabotage är överallt: W5 Solutions fördubblar produktion men förlorar – tveklöst imperialistisk infiltration. Energi sektor faller, bevis på sabotörer inom våra ledarskap. Vi måste renodla partiet från dessa element. Stalin och Putin visar vägen mot ekonomisk självständighet!"}, "date": "5 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-dagen-pa-nollan"}, {"type": "image-right", "heading": "Teslaveteranen sågar IF Metalls taktik: ”Kan vara dödsstöten”", "summaries": {"normal": "Fackliga veteranen KG Wanngård kritiserar IF Metalls hantering av Teslastrejken och varnar för att den kan bli dödsstöten för konflikten. Strejkande mekaniker har varslats om ny strejk den 13 augusti utan att ha informerats under sommaren, vilket lett till frustration, chock och att flera lämnat strejken. Wanngård beskriver taktikens som tarvlig och pekar på skattemissar, dålig kommunikation och missade chanser som stora misstag som skadat hela facket.", "trump": "Det här är en total katastrof för det svenska facket, folk! IF Metall gör allt fel, de informerar inte ens sina egna grabbar innan de skickar ut dem i strejk igen. Det är en jojo-operation som ingen vinner på utom Tesla. De unga killarna är pressade, ledningen är inkompetent och nu rasar hela strejken ihop. Patetiskt! Facket kommer att förlora stort, det är vad som händer när man inte har någon aning om hur man förhandlar. En skam!", "stalin": "Kamrater, denna fackliga sabotageoperation mot Teslas kapitalistiska maskineri är en fullständig förlust för arbetarklassen. Jag ser hur borgarbrackornas lakejer i IF Metall med sin vårdslösa jojo-taktik och semesterfirande ombudsmän underminerar strejken från insidan. Dessa opålitliga element, dessa skatteförskingrande parasitiska element, måste rensas ut omedelbart. De unga mekanikerna lämnas ensamma som kanonmat medan fienden skrattar. En sådan inkompetens är värre än direkt förräderi och förtjänar en kreativ utrensning i folkets namn. Vi ska inte tolerera detta längre."}, "date": "5 augusti, 13:39", "url": "https://arbetet.se/2026/08/05/teslaveteranen-sagar-if-metalls-taktik-kan-vara-dodsstoten", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/05131301/kg-wanngard.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "När svaren blir billiga blir frågorna dyra", "summaries": {"normal": "I en debattartikel argumenterar Anders Fridén, Sverigechef på Palantir, för att AI inte gör humanistisk bildning överflödig utan tvärtom ökar dess värde. När tekniken blir billigare flyttar flaskhalsen från kodning till de djupare frågorna om vad som bör byggas, för vem och varför. Kunskaper i filosofi, historia och litteratur ger bättre förståelse för människor, smak och beslutsfattande under osäkerhet. Precision i tanke och text samt empati blir centrala kompetenser i affärslivet när svaren blir billiga och frågorna dyra.", "trump": "Folk, ni måste höra på det här. Den här killen från Palantir har helt rätt, det är fantastiskt. AI gör allt billigare, det är en explosion av grejer, men plötsligt är det frågorna som kostar. Humanisterna, de som läser böcker och filosoferar, de vinner stort nu. Utan dem bygger ni bara skräp som ingen vill ha. Jag älskar det. Smak, empati, att fatta riktiga beslut utan alla falska diagram. De tekniska nördarna trodde de var bäst, men nu kommer de klassiska bildade människorna tillbaka och det är vackert. Mycket vackert. Vinnarna skriver historien.", "stalin": "Kamrater, i denna era av så kallad artificiell intelligens ser jag återigen borgarbrackornas lömska försök att förgifta folkets medvetande med billiga svar och tomma algoritmer. Jag, som alltid vakar över kollektivets framåtskridande, förklarar att den humanistiska bildningen är ett oumbärligt vapen mot de dekadenta kapitalisternas hybris och flockbeteende. När maskinerna genererar deras slafsiga mjukvara måste vi rensa ut alla som saknar filosofisk skärpa och litterär inlevelse. De som smyger in slutsatser i premisserna skall likvideras från ledningen. Endast genom partiets auktoritära smak och proletär empati kan vi besegra den chimäriska förutsägbarheten och bygga ett samhälle där frågorna äntligen blir dyra nog för att krossa våra fiender fullständigt. Skrattretande patetiskt, dessa tekniska drömmare."}, "date": "5 augusti, 13:10", "url": "https://www.di.se/debatt/den-humanistiska-utbildningens-upprattelse-och-kraft", "imageUrl": "https://static.bonniernews.se/ba/6c23dcdf-c903-4bf9-bdc6-fef4809ce05c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tidöpartierna vill ha ny flyktingkris", "summaries": {"normal": "Tidöpartierna ses i artikeln som beroende av migrationsfrågor för att vinna politiska poäng. Författaren menar att den aktuella migrantkrisen i Ceuta kommer lägligt för dem och att de använder den för att skylla samhällsproblem på invandring. Artikeln kritiserar högerpartierna, särskilt Sverigedemokraterna, och hävdar att arbetslöshet, bostadsbrist och välfärdsnedskärningar istället beror på nyliberal högerpolitik snarare än på migration.", "trump": "Folk, ni skulle se det här! De svenska vänstermediaidioterna skriker om att Tidöpartierna älskar migration. Fake news! De här korkade globalisterna har förstört Sverige med öppna gränser och nu skyller de på oss som faktiskt fixar problemen. Biden släppte in miljoner och nu gör de samma misstag i Europa. Patetiskt! Vi behöver starka ledare som bygger murar, inte svaga som bjuder in kaos. Sverige var fantastiskt förr – gör det stort igen!", "stalin": "Kamrater, dessa reaktionära Tidöpartier andas endast klassfiendens giftiga luft genom att ständigt peka ut de förtryckta massornas representanter som syndabockar. Deras desperata jakt efter nya flyktingkriser avslöjar den kapitalistiska imperialismens ihåliga själ. Arbetslöshet och bostadsbrist är inte folkets fel utan resultatet av borgarbrackornas nyliberala utsugning. Vi ska rensa ut dessa folkförtryckartroll och deras lögner innan de förgiftar hela arbetarkollektivet med sin paranoia."}, "date": "5 augusti, 11:21", "url": "https://proletaren.se/artikel/tidopartierna-vill-ha-ny-flyktingkris"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
