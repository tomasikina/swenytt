framåt medan folket förgiftas. Deras utredare är bara profitthungriga hyenor som döljer sanningen. Jag ler i graven åt sådan självmotsägelse – snart skall folkets utrensning sopa bort alla dessa klimatbluffande lakejer."}, "date": "26 augusti, 17:20", "url": "https://www.etc.se/ledare/simona-mohamsson-laet-som-jimmie-aakesson-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260826150816_8e91f6f08146ca5f87411eb6b4fb2c6c937ca2cce4a7fd77d4befe7f294935ca.jpg"}, {"type": "image-right", "heading": "Regeringens blinda fläck är terrorhotet från höger", "summaries": {"normal": "Artikeln kritiserar regeringen för att inte tillräckligt adressera kopplingar mellan flera svenska skoldåd och högerextremism samt kvinnohat. Författaren lyfter exempel från Trollhättan, Malmö, Eslöv, Kristianstad och Ale. En Skoldådskommission tillsätts, men mönstret förminskas enligt ledarskribenten, delvis på grund av Sverigedemokraternas roll i regeringen.", "trump": "Folk, det här är en total katastrof! Den svenska regeringen blundar för det riktiga hotet från galna högerextremister och incel-typer som hatar kvinnor. De borde kalla det för vad det är istället för att gömma sig bakom psykiatri och TikTok. Biden skulle ha älskat den här svagheten, men jag ser rakt igenom den woke-blindheten som förstör allt.", "stalin": "Kamrater, jag ser hur dessa klassfiender och folkförtryckare i den svenska regeringen medvetet blundar för fascismens giftiga tentakler som sprider sig genom deras skolor. De skyddar sina egna högerextrema element medan de låtsas utreda. En sådan förnekelse förtjänar utrensning. Det är borgarklassens eviga lögn som lurar arbetarna igen."}, "date": "26 augusti, 13:00", "url": "https://www.etc.se/ledare/regeringens-blinda-flaeck-aer-terrorhotet-fraan-hoeger", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260826100852_d2160618-2946-4f70-9210-ceb6314debd7.jpg"}, {"type": "image-right", "heading": "Högsta betyg åt skildring av musik bakom galler", "summaries": {"normal": "Recensionen hyllar filmen Primavera som en gripande skildring av kvinnoförtryck, ensamhet och utsatthet i 1700-talets Venedig. Den handlar om barnhemsflickor som tränas till musiker men tvingas gifta bort sig vid vuxen ålder. Regisserad av Damiano Michieletto med Antonio Vivaldi som central figur får filmen högsta betyg av recensenten.", "trump": "Den här filmen Primavera är en total vinnare, folk. Den visar hur de riggade systemen håller nere begåvade kvinnor, precis som de riggade medierna gör med mig. Vivaldi, den stora kompositören, han skulle älska det. Fantastisk musik, vackra bilder, bättre än Tár. Höstens absolut bästa film, ingen gör det bättre än italienarna, tro mig.", "stalin": "Vi ser här hur den dekadenta borgarklassen under feodalismens mask förslavade arbetarkvinnorna genom att förvandla deras musikaliska talang till en handelsvara. Denna film blottlägger det borgerliga fängelset med galler och brännmärken. Ett utmärkt verk som visar att endast genom kollektiv kamp kan sådana utsugningssystem krossas. Mycket underhållande utrensning av illusioner."}, "date": "27 augusti, 13:06", "url": "https://www.dagensarena.se/innehall/hogsta-betyg-at-skildring-av-musik-bakom-galler", "imageUrl": "https://www.dagensarena.se/files/2026/08/primavera-1-300x157.jpeg"}, {"type": "image-full", "heading": "Regeringen håller kräftskiva – statsministern står för snapsen", "summaries": {"normal": "Regeringen håller i dag sin årliga kräftskiva på Harpsund. Statsminister Ulf Kristersson tar med egen snaps, som tidigare år saknats på menyn. Finansminister Elisabeth Svantesson presenterar ramarna för nästa års statsbudget innan festen. Menyn består av rostbiff, kräftor från Hjälmaren, ost, kex och äppeltarte med vaniljsås. Öl, vin och alkoholfria drycker serveras.", "trump": "Folk, ni skulle se det här – den svenska regeringen har en jättestor kräftskiva på Harpsund, och den svaga Kristersson tar äntligen med snaps! Inget av det där torra Biden-snack från tidigare år. De äter rostbiff och kräftor som vinnare, inte som förlorare. Fantastiskt, men de borde ha haft den bästa snapsen, inte bara lite egen medhavd.", "stalin": "Jag betraktar dessa dekadenta borgerliga festligheter med avsmak. Kamraterna i den svenska regeringen korkar upp snaps medan folket svälter under kapitalismens bojor. Deras rostbiff och äppeltarte är ett hån mot arbetarklassen. Inga snapsar utan folkets godkännande! Sådana fiender till kollektivet förtjänar att rensas ut som ogräs i trädgården."}, "date": "27 augusti, 10:58", "url": "https://www.tv4.se/artikel/1rWvO2zbkhPsM0E4ObaVvt/regeringen-haller-kraeftskiva-statsministern-star-foer-snapsen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56Nrhi8tBvW1im05fA8LeF%2Fe556919d5d5cc983f4b71f0d3cca13ae%2F27-harpsund-kraftskiva-webb.png&width=1024"}, {"type": "image-right", "heading": "Riks/Sentio: Socialdemokraterna tokrasar", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Sentios senaste mätning och hamnar på 27,9 procent, lägsta nivån sedan Stefan Löfvens tid. Moderaterna och Centerpartiet går framåt medan övriga partier visar små förändringar. Tidöblocket ligger fortfarande efter de rödgröna med drygt fem procentenheter. Experter pekar på straff för triangulering.", "trump": "De där patetiska socialisterna rasar ihop som ett korthus, ner på Löfvens usla nivåer. Totalt misslyckande! Moderaterna gör det bra, men de svenska väljarna ser äntligen igenom det fega dubbelspelandet. Fake news-regeringar fungerar inte längre, folks. Make Sweden Great Again!", "stalin": "Jag ser med stor tillfredsställelse hur de opportunistiska triangulerande elementen inom socialdemokratin nu genomgår en nödvändig utrensning från väljarna. Deras fega flirt med både höger och vänster är typisk borgarbracka taktik. Kamraterna straffar dem hårt, som det anstår en sann folkets domstol. Inga kompromisser med klassfienden!"}, "date": "27 augusti, 10:56", "url": "https://riks.se/nyheter/riks-sentio-socialdemokraterna-tokrasar", "imageUrl": "https://admin.riks.se/uploads/medium_magda_ff4e9e808b.jpg"}, {"type": "text", "heading": "Lundbergs ökar substansvärdet", "summaries": {"normal": "Lundbergs substansvärde steg till 631 kronor per aktie, upp från 552 i fjol. Rörelseresultatet mångdubblades tack vare intressebolag och värdeförändringar. Omsättningen sjönk marginellt. Bolaget investerade nära en miljard i aktier som Alleima, Industrivärden och Indutrade. En rapp halvårsrapport med stark vinstutveckling.", "trump": "Jag har gjort Lundbergs fantastiska igen! Substansvärdet upp 14 procent – huge! Resultatet ökade 273 procent – ingen har sett sådana siffror förut. De investerar i aktier som jag gör – smarta affärer. Min administration skapar välstånd överallt. Sverige är vinnare. Alla älskar mig!", "stalin": "Kamrater, Lundbergs substansvärde ökar – ett bevis på femårsplanens seger. Men rörelsevinsten på 103 procent döljer borgerliga sabotage. Aktieinvesteringarna i Alleima och Industrivärden är misstänkta; vi måste rensa ut kontrarevolutionära kapitalistsvin som gömmer sig i intressebolagen. Partiet ser allt."}, "date": "27 augusti, 13:18", "url": "https://www.affarsvarlden.se/artikel/lundbergs-okar-substansvardet-2"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Man svårt knivhuggen – Säpo utreder hatbrott", "summaries": {"normal": "En man i 45-årsåldern knivhöggs svårt och oprovocerat utanför en butik i Malmö mellan Södervärn och Möllevångstorget. Polisen utreder hatbrott efter uppgifter om antisemitiska uttalanden från gärningsmannen, som gripits. Säpo har informerats. Offret vårdas allvarligt skadat. Gärningsmannen har kopplingar till pro-palestinska demonstrationer.", "trump": "Det här är en total katastrof i Malmö, folk. En galning hugger ner någon mitt på gatan och skriker antisemitiska saker. De griper honom på ett BB bland nyfödda – helt sjukt! Sverige har tappat kontrollen, de har inte ens vett att stoppa det här hatet. Vi behöver lag och ordning, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, denna degenererade handling visar borgarklassens parasitiska sönderfall. En labil element attackerar bakifrån med kniv och ylar antisemitiska dumheter. Vi ser hur västvärldens dekadenta tolerans mot reaktionära element leder till kaos. Gripandet bland nyblivna mödrar roar mig – en passande plats för en sådan parasit. Staten rensar ut sådana fiender utan pardon."}, "date": "27 augusti, 10:05", "url": "https://riks.se/nyheter/man-svart-knivhuggen-sapo-utreder-hatbrott", "imageUrl": "https://admin.riks.se/uploads/medium_bild_2c68535a43.jpg"}, {"type": "image-right", "heading": "\"Köper sina röster\" – Influencern nobbade 150 000 från S", "summaries": {"normal": "Influencern Eleonore Stokholm avslöjar att hon erbjöds 150 000 kronor av Socialdemokraterna för ett Instagram-inlägg där hon skulle uppmana till att rösta på partiet. Hon tackade nej av moraliska skäl och kritiserar partiet för att \"köpa röster\" via influencers. S nekar bestämt och säger att de inte känner igen uppgifterna.", "trump": "Titta på det här! Socialdemokraterna försökte muta en influencer med 150 000 kronor för att hon skulle säga rösta på dem. Hon tackade nej, smart tjej. Nu syns deras ledare i klipp med andra influencers som pushar röster. Det är fusk och korruption, precis som de riggade valen jag alltid varnar för. Patetiskt!", "stalin": "Jag ser hur de dekadenta borgarbrackorna inom Socialdemokraterna försöker muta folk med 150 000 kronor för att de ska prisa partiet offentligt. En sådan utrensning av ärligheten vore på sin plats. Vi vet att dessa kapitalistiska parasitörer alltid köper lojalitet medan de paranoiskt förnekar allt. Deras moraliska kompass är lika falsk som västvärldens lögner."}, "date": "27 augusti, 09:05", "url": "https://riks.se/nyheter/koper-sina-roster-influencern-nobbade-150-000-fran-s", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_61_000d763c9e.jpg"}, {"type": "image-full", "heading": "Demoskop: SD kan backa för första gången", "summaries": {"normal": "Enligt SvD/Demoskops väljarbarometer tappar Sverigedemokraterna stöd för första gången på över ett år, ner till 18,3%. Oppositionen (S, V, MP, C) leder med 51,7% mot Tidöpartiernas 46,0%. Moderaterna ökar marginellt, medan KD når sitt högsta stöd på sju år. Liberalerna riskerar att hamna under spärren.", "trump": "Jag säger er, Sverige har ett stort problem – deras största parti, SD, backar som en rädd ekorre! 18,3% är patetiskt, och oppositionen leder med 5,7%. Moderaterna, som är lite smartare, ökar lite. Men Liberalerna? Fullständigt katastrof, 2% är skrattretande. Sverige borde ta en titt på USA – vi vet hur man vinner!", "stalin": "Vi ser med tillfredsställelse hur de reaktionära krafterna i Sverige, dessa fascistiska SD-sympatisörer, förlorar mark som en retreating Wehrmacht. Oppositionen, dessa lojala progressiva kamrater, håller ett fast grepp om 51,7%. Liberalerna? Svaga som en upptinad snögubbe. Vi noterar KD:s framsteg – men var försiktiga, kamrater, fienden lurar alltid bakom hörnet."}, "date": "27 augusti, 06:37", "url": "https://kvartal.se/nyheter/artiklar/demoskop-sd-kan-backa-for-forsta-gangen/cG9zdDoxNzU2NDA", "imageUrl": "https://images.kvartal.se/2026/08/f18cd19a-bbb.webp"}, {"type": "image-full", "heading": "C-ledarens drömregering: ”Idag låter det omöjligt”", "summaries": {"normal": "Centerledaren Elisabeth Thand Ringqvist föreslår en regering med S, KD och eventuellt MP efter valet, men medger att det verkar osannolikt nu. Hon tror ett mittenalternativ kan uppstå om Tidö-samarbetet misslyckas. Stora politiska motsättningar kvarstår, som a-kassa och bankskatt, men hon är öppen för diskussion om karensavdrag under vissa villkor.", "trump": "Jag säger er, denna svenska Centerledare har en dröm – en galen dröm! Hon vill ha en regering med socialisterna, kristdemokraterna och kanske några gröna extremister. Helt omöjligt, folks! Ebba Busch säger nej, MP säger nej, och ändå tror hon på det. Sverige behöver ordning, inte sådana här tokiga idéer. Men visst, låt dem krascha och brinna – det blir underhållning!", "stalin": "Denna så kallade 'Centerledare' fantiserar om en omöjlig koalition, som en svag och förvirrad fiende som leker med tanken på allianser. Vi ser hur borgerliga krafter splittras och förrädare inom egna led drömmer om makt utan grund. Låt dem krascha sina regeringsförsök – det är bara en fråga om tid innan folket inser att endast järnhand och enhetlig ledning kan skapa ordning. Sverige är en bricka i det stora spelet, och vi väntar tålmodigt på deras kollaps."}, "date": "27 augusti, 05:51", "url": "https://kvartal.se/nyheter/artiklar/c-ledarens-dromregering-idag-later-det-omojligt/cG9zdDoxNzU1OTU", "imageUrl": "https://images.kvartal.se/2026/08/98655ea8-etr.webp"}, {"type": "image-full", "heading": "Svensk saknas efter skredet i Nepal", "summaries": {"normal": "Två personer med koppling till Sverige saknas efter jordskredet i Nepal, som utlöstes av en glaciärkollaps. Minst 300 omkomna och nästan 1 500 saknas. UD bekräftar att en svensk och en utländsk medborgare saknas. Räddningsarbetet försvåras av svår terräng och instabila kommunikationer.", "trump": "Jag hörde om Nepal – en enorm katastrof, den största! Två svenskar saknas, men vi har de bästa systemen. Glaciären kollapsade, trodde det var en jordbävning, men jag fixar allt. Indien har 178 saknade – de behöver min hjälp. Stora siffror, väldigt tråkiga, men vi gör fantastiska saker!", "stalin": "Kamrater, naturen visar sin kontrarevolutionära sida. Glaciärkollapsen i Nepal – en borgerlig konspiration? Vi måste rensa ut instabiliteten. Två medborgare saknas, men jag ser fler fiender: bergen, floderna, tiden. De måste lära sig disciplin. Vår plan löser allt, med järnhand och snöskyffel."}, "date": "27 augusti, 13:10", "url": "https://www.gp.se/nyheter/varlden/svensk-bland-de-saknade-i-jordskredet-i-nepal.cc7300ad-a588-4f28-9ac9-a5b1c92f89e4", "imageUrl": "https://www.gp.se/images/article/cc7300ad-a588-4f28-9ac9-a5b1c92f89e4/images/2UuhjV5jq-JS1oK-bqAX7SYFBx08-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Europabörser backar – Pernod Ricard rapportfaller", "summaries": {"normal": "Europabörserna backar vid lunch, med Stoxx 600 ned 0,38 procent. Tyska sysselsättnings- och konsumentsiffror ljusnar, men spritjätten Pernod Ricard faller 6 procent efter svag försäljning. Tekniksektorn går bäst, livsmedel sämst. Accelleron och Gerresheimer stiger, medan Nscale tecknar AI-avtal värt 45 miljarder dollar.", "trump": "Jag ser att Europabörserna faller – typiskt! Men Tyskland mår bättre, deras siffror går upp. Stora vinnare? Teknik, såklart. Men Pernod Ricard, de har problem – dricker de inte nog? Jag hade fixat det! Och ett AI-avtal värt 45 miljarder dollar – enormt! Bara jag kan göra så stora deals.", "stalin": "Kamrater, medan vi bygger socialismen, vacklar kapitalismens börser. Tysklands barometrar stiger – misstänkt, vi bör rensa ut deras siffror. Pernod Ricards sprit faller – uppenbar sabotage från västerländska drinkare. Teknik stiger – bra, men övervaka. Ett AI-avtal på 45 miljarder? Fiendens plan. Utrensning krävs!"}, "date": "27 augusti, 11:53", "url": "https://www.affarsvarlden.se/artikel/europaborser-backar-pernod-ricard-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Pernod-Ricard-Jameson-whisky-400x267.jpg"}, {"type": "image-right", "heading": "IF Metall vann och förlorade mot Tesla i domstol", "summaries": {"normal": "Arbetsdomstolen slår fast att Tesla bröt mot informationsplikten i Medbestämmandelagen genom att inte informera IF Metall om förändringar i säljorganisationen vid anläggningen i Umeå. Företaget döms att betala 30 000 kronor i skadestånd. Däremot ansågs inte dialogöverenskommelsen vara ett kollektivavtal, vilket innebär att facket förlorade den delen av tvisten. Båda parter får betala sina egna rättegångskostnader.", "trump": "Tesla vann stort mot de fackliga bluffmakarna, precis som jag alltid säger – kollektivavtal är för förlorare! Men domstolen ger dem lite småpengar för någon informationsgrej i Umeå. Patetiskt. IF Metall får ett litet plåster på såren medan Tesla fortsätter att vinna. Amerika älskar starka företag, inte fackföreningar som suger musten ur affärerna!", "stalin": "Genom min oändliga visdom ser jag hur de kapitalistiska Tesla-borgarna lurade arbetarkollektivet med sin falska dialog men avslöjades som informationsbrottslingar. Vi dömde dem till en ynka utbetalning, ett skämt värdigt de västerländska parasiterna. Ändå triumferar partiets linje delvis. Kamrater, vi ska rensa ut alla sådana kontrarevolutionära avtalssabotörer ur samhällskroppen med stålhandsken."}, "date": "27 augusti, 11:53", "url": "https://arbetet.se/2026/08/27/if-metall-vann-och-forlorade-mot-tesla-i-domstol", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27112023/tesla-metall-ad-dom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Två från Sverige saknas efter naturkatastrofen i Nepal", "summaries": {"normal": "Två personer med koppling till Sverige saknas efter den förödande störtfloden och lerskredet i gränsområdet mellan Nepal och Tibet. Över 1300 människor saknas och 68 har bekräftats döda. UD bekräftar att en svensk man i 40-årsåldern från Svealand och en utländsk medborgare bosatt i Götaland är bland de saknade. Katastrofen orsakades av ett isras och jordskred i Himalaya.", "trump": "Folk, det är en total katastrof i Nepal, en riktig slamström som tar med sig allt. Vi har en svensk kille och en till som bor i Sverige som saknas, väldigt sorgligt. Himalaya sviker, bergen sviker, alla sviker. Men jag säger er, ingen gör katastrofer bättre än jag, tro mig. Vi ska fixa det, det blir fantastiskt.", "stalin": "Kamrater, ännu en bevisning på naturens kontrarevolutionära sabotage mot det kollektiva framsteget. Jag ser hur den våldsamma slamströmmen likviderar borgarbrackornas broar och hus i Nepal. Två från det svenska kollektivet saknas bland de över 1300. Vi ska rensa ut alla fiender till ordningen, även de som gömmer sig i glaciärernas skugga. Döden är bara en byråkratisk formalitet."}, "date": "27 augusti, 13:09", "url": "https://www.svt.se/nyheter/inrikes/svensk-saknad-efter-lerskred-i-nepal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.45/0ea2002fbf4fe3b971f10ed46750458a71657dbd0a2335692e0ab84910ba2edd"}, {"type": "image-right", "heading": "Rekordmånga röstade direkt", "summaries": {"normal": "Intresset för förtidsröstning är rekordstort i årets val. Redan första dagen röstade över 145 000 personer, en ökning med 38 procent jämfört med 2022. Nordstan i Göteborg hade flest röster. Valmyndigheten välkomnar spridningen för att undvika köer nära valdagen den 13 september.", "trump": "Folket älskar att rösta tidigt, över 145 000 på första dagen, en enorm ökning med 38 procent. Fantastiskt! De gör det rätt, sprider ut det så det inte blir kaos som i de riggade systemen. Sverige fattar det, till skillnad från vissa losers. Valet blir stort, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur massorna i organiserad disciplin strömmar till urnorna redan första dagen. 145 000 röster – en seger för folkets vilja mot de kaotiska borgarbrackornas sabotage. Vi sprider röstningen som en utrensning av oordning. Långa köer är fiendens verk, likviderade genom planering."}, "date": "27 augusti, 13:03", "url": "https://www.friatider.se/rekordmanga-rostade-direkt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-763.jpg?itok=XnFjirgT"}, {"type": "image-right", "heading": "SR-rapparen Asme döms för våldtäkt - så blir straffet", "summaries": {"normal": "Gangsterrapparen Asme, som prisats av Sveriges Radio, döms till tre års fängelse för våldtäkt på ett hotell i Stockholm under Valborg. Han fälls också för ringa narkotikabrott. Trots att han nekar anser tingsrätten att kvinnans berättelse är trovärdig och att han utnyttjade hennes sömn och berusning.", "trump": "Jag ser att en så kallad 'gangsterrappare' som till och med hyllats av svenska staten döms för våldtäkt. Helt otroligt! Sverige måste bli tuffare. Hos mig skulle han få mycket värre straff. Kanske skulle jag bygga en mur runt deras musikindustri? Gör Sverige bra igen!", "stalin": "Kamrater, ännu ett bevis på kapitalismens förfall: en så kallad 'gangsterrappare' som utnyttjar sovande kvinnor. Vi måste rensa ut dessa sabotörer ur samhället. Tre års fängelse är en början, men jag föreslår omskolningsläger för alla som sprider dekadent musik. Ingen nåd för folkets fiender!"}, "date": "27 augusti, 12:30", "url": "https://samnytt.se/sr-rapparen-asme-doms-for-valdtakt-sa-blir-straffet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/25224424/Asme.jpg"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Andersson (S) och Åkesson (SD) ense – om L", "summaries": {"normal": "Liberalerna kämpar för överlevnad under riksdagsspärren, vilket får Jimmie Åkesson att hota med en deadline: under 3,5% tio dagar före valet är röster bortkastade. Magdalena Andersson håller med – hon ser ett sönderfall i Tidösamarbetet och säger sig inte fatta varför någon röstar på L, med hänvisning till opinionssiffror på 2%.", "trump": "Jag ser att Liberalerna i Sverige håller på att dö – fantastiskt! Jimmie Åkesson säger att deras röster är bortkastade, och jag har alltid sagt att de är värdelösa. Magdalena Andersson håller med mig – hon är smart. Fokusera på att stoppa kaoset, inte på att pissa i det egna tältet. Sverige behöver stabilitet, inte liberalt nonsens!", "stalin": "Kamrater, jag ser sönderfall bland våra fiender. Liberalerna, dessa liberala avvikare, ligger på ynka 2% – en statistisk parentes. Åkesson hotar med deadline, men vi vet att de är odugliga. Andersson håller med mig: varför rösta på dem? Vi måste rensa ut alla liberala element som hotar vår seger. Framåt, kamrater!"}, "date": "27 augusti, 11:24", "url": "https://bulletin.nu/andersson-s-och-akesson-sd-ense-om-l", "imageUrl": "https://cdn.bulletin.nu/articles/8423dbf7-fe39-4126-b027-d974cf1ce939/preview.jpg?t=1787822395000"}, {"type": "image-right", "heading": "Flicka påstod att närstående våldtagit henne men tog tillbaka allt - nu åtalas hon", "summaries": {"normal": "En 15-årig flicka påstod att en närstående man våldtagit henne, vilket ledde till att han satt häktad i nästan två månader. Efter rättegången erkände hon att allt var påhittat och att en vän pressat henne – en uppgift som också visade sig falsk. Nu åtalas hon för grov falsk beskyllning.", "trump": "Jag ser en 15-åring i Sverige som ljög om våldtäkt och fick en oskyldig man häktad i nästan två månader. Det är fruktansvärt! Hon borde straffas hårt. Jag skulle aldrig låta sådana falska anklagelser förstöra någons liv. Ett enormt misslyckande av rättssystemet!", "stalin": "En ung sabotör har spridit lögnaktiga anklagelser om våldtäkt mot en kamrat, vilket ledde till att han olagligen frihetsberövades i nio veckor. Hon ljög även om en annan persons inblandning. Detta är kontrarevolutionärt beteende som måste rensas ut. Partiet ser allvarligt på falska beskyllningar."}, "date": "27 augusti, 11:45", "url": "https://samnytt.se/flicka-pastod-att-narstaende-valdtagit-henne-men-tog-tillbaka-allt-nu-atalas-hon", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27090919/tuva-preview.png"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Elekta och Boliden faller på oregelbunden börs", "summaries": {"normal": "Stockholmsbörsen inledde torsdagen med en oregelbunden tendens. Elekta slog förväntningarna men aktien tappade, medan Boliden backade efter att ha köpt in sig i Sydamerika via Nexa. Nvidia fick jubel i USA och blickarna riktas mot Jackson Hole. Teknik gick bäst, dagligvaror sämst. Elon och Eolus rusade på rapporterna.", "trump": "Jag ser att Stockholmsbörsen vacklar – typiskt när man inte har mig vid rodret. Elekta slår förväntningar men aktien faller? Patetiskt. Boliden köper i Sydamerika, men jag köper bara vinst. Nvidia steg nästan 5 procent – det kallar jag en vacker rapport. Jackson Hole? De borde lyssna på mig.", "stalin": "Kamrater, börsen visar oregelbunden tendens – det är ett tecken på sabotage. Elekta som slår förväntningar men faller? En klassisk förrädare. Boliden köper i Sydamerika utan partiets tillstånd. Vi ska rensa ut dessa spekulanter. Nvidia stiger, men alla vet att kapitalismen är en lögn. Jackson Hole ska övervakas."}, "date": "27 augusti, 09:45", "url": "https://www.affarsvarlden.se/artikel/elekta-och-boliden-faller-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/1446_20130608_3907-400x267.jpg"}, {"type": "image-right", "heading": "Kris i äldreomsorgen – så lite plats får frågan i valet", "summaries": {"normal": "Äldreomsorgen är knappt nämnd i valrörelsen trots att personalen kämpar med hög sjukfrånvaro, personalbrist, låga löner och usla scheman. I Trollhättan vittnar undersköterskor om stress, dåligt samvete och att de inte hinner lyssna på de äldre. Väljarna rankar frågan högt, men partierna tiger mest.", "trump": "Folk, det är en katastrof! Era så kallade ledare pratar i timmar i Almedalen och nämner äldreomsorgen i exakt två och en halv minut. Patetiskt! De pressar personalen som citroner, de älskar jobbet men hatar systemet. Vi behöver fler människor, högre löner och stoppa det vansinniga minutstyrandet. Make care great again!", "stalin": "Kamrater, detta är resultatet av borgerlig förfall och revisionistisk vårdpolitik. Jag ser hur arbetarna i Trollhättan likvideras av stress och överarbete medan partiledarna ägnar en procent av talartiden åt folket. Vi måste rensa ut de kapitalistiska minutstyrarna, införa sovjetisk disciplin och säkerställa att ingen citron pressas längre. Statens fiender inom vården ska exponeras."}, "date": "27 augusti, 10:08", "url": "https://arbetet.se/2026/08/27/jattekris-i-aldreomsorgen-sa-lite-plats-far-fragan-i-valet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26151951/XUfc37bOwIw-KA_0156.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Två partiledare valde bort äldreomsorgen helt i sina viktiga tal", "summaries": {"normal": "De åtta riksdagspartiernas ledare talade sammanlagt över fyra timmar i Almedalen i somras. Äldreomsorgen berördes bara i drygt två och en halv minut, cirka en procent av talartiden. Ulf Kristersson och Elisabeth Thand Ringqvist nämnde ämnet inte alls medan Magdalena Andersson talade längst om det, i runt 60 sekunder.", "trump": "Kan ni fatta det? Fyra timmar pratade de här svenska förlorarna i Almedalen och äldreomsorgen fick bara två och en halv minut. Patetiskt! Jag skulle ha fixat det på nolltid, tro mig. De bryr sig inte om sina gamla, det är en total skandal. Sverige behöver en riktig ledare, inte dessa nollor.", "stalin": "Vi ser med förakt hur dessa borgerliga och socialdemokratiska avfällingar i sina tal knappt ägnade en procent av tiden åt arbetarklassens åldringar. Jag skulle ha låtit utrensa sådana vårdslösa element omedelbart. Deras likgiltighet är ett fiasko som skrattar i folkets ansikte. Kamrater, detta visar behovet av ständig vaksamhet mot klassfiendens förfall."}, "date": "27 augusti, 10:08", "url": "https://arbetet.se/2026/08/27/tva-partiledare-valde-bort-aldreomsorgen-helt-i-sina-viktiga-tal", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27095720/almedalen.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "text", "heading": "Dijan Vukojevic bekräftar intresse från IFK Göteborg: ”Smickrande”", "summaries": {"normal": "Dijan Vukojevic bekräftar att IFK Göteborg visat intresse för honom. Anfallaren från Degerfors kallar det smickrande och säger att han efter alla år förtjänat ett sådant erbjudande. Han har gjort fyra mål på de tre senaste matcherna. Degerfors ska inte vara angelägna om att släppa honom. Vukojevic återvände till klubben sommaren 2025 efter en sejour i Polen.", "trump": "Jag hör att den här Vukojevic killen är het just nu, IFK Göteborg vill ha honom. Fantastiskt, en stor klubb, precis som jag gör med stora saker. Han säger det är smickrande, och det är det verkligen, ingen skojar bort Göteborg. Fyra mål på tre matcher, han är en vinnare. Degerfors vill inte släppa honom, typiskt, men vi får se, det blir yuge.", "stalin": "Jag betraktar detta intresse från den borgerliga fotbollsklubben som en smickrande men potentiellt kontrarevolutionär manöver mot arbetarklassens Degerfors. Vukojevic har skjutit fyra mål, ett resultat av kollektiv disciplin. Vi ska inte tillåta att kapitalisterna lockar bort honom utan att rensa ut alla fiender till folkets lag. Paranoian lurar alltid bakom kulisserna."}, "date": "27 augusti, 12:02", "url": "https://www.svt.se/sport/fotboll/dijan-vukojevic-bekraftar-intresse-fran-ifk-goteborg-smickrande"}, {"type": "image-full", "heading": "Liam Nebel skulle utredas före attacken – men hindrades", "summaries": {"normal": "Liam Nebel har häktats misstänkt för mord och försök till mord efter svärdattacken i Fagersta där en 17-årig flicka dödades och två pojkar skadades. En tidigare LVU-dom visar att han under uppväxten utsattes för våld, psykisk misshandel och omsorgsbrist. Trots observationer om möjlig neuropsykiatrisk problematik kom ingen utredning igång på grund av uteblivet skriftligt samtycke från pappan.", "trump": "Folk, det här är en total katastrof. Den här killen Liam Nebel hade tydligen en galen pappa som slog honom och tvingade honom till kampsport, och ingen gjorde något. Socialtjänsten och de inkompetenta byråkraterna misslyckades igen. Sverige borde ha fixat det här långt innan svärdet kom fram. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den borgerliga statens vårdslöshet och byråkratiska sabotage undergräver folket. Jag hade naturligtvis redan för länge sedan genomfört en grundlig utrensning av sådana omsorgssviktande element och omedelbart beordrat en kollektiv, vetenskaplig utredning av alla avvikande individer. Den som hindrar partiets omsorg om ungdomen förtjänar att likvideras med ett leende."}, "date": "27 augusti, 11:33", "url": "https://nyheter24.se/nyheter/inrikes/1507240-liam-nebel-skulle-utredas-men-processen-paborjades-inte", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/238796d004b004a30200000000b004a302/2026/08/24/2386198/liam.jpg"}, {"type": "image-right", "heading": "C-topp åtalas efter rattfylleriolycka - krockade med A-traktor", "summaries": {"normal": "Centerpartistiske regionpolitikern Thomas Andersson åtalas för grovt rattfylleri efter att ha krockat med en A-traktor på Vallsundsbron. Han lämnar samtliga politiska uppdrag och drar tillbaka sin kandidatur. Partiet är tydligt: sådant beteende är inte förenligt med förtroendeuppdrag. En olycklig historia med alkohol inblandad.", "trump": "Jag ser en centerpartist som kör full och krockar med en liten EPA-traktor – helt galet! Han lämnar alla uppdrag, precis som en loser. Centerpartiet borde rensa ut sådana. Jag, presidenten, skulle aldrig göra så – jag kör bara golfbil. Mycket dåligt omdöme, mycket dåligt!", "stalin": "Kamrater, en regionpolitiker har avslöjats som en berusad sabotör. Han krockade med en A-traktor – en kontrarevolutionär handling. Han har lämnat sina uppdrag, men vi måste rensa ut alla sådana element. Partiet måste stärka kontrollen. Ingen nåd för fyllon som hotar vår framgång."}, "date": "27 augusti, 11:00", "url": "https://samnytt.se/c-topp-atalas-efter-rattfylleriolycka-krockade-med-a-traktor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27085030/thomas-andersson-c-rattfull-feat.jpg"}, {"type": "image-full", "heading": "C öppnar för KD – Busch pekar på MP", "summaries": {"normal": "Centerpartiets Elisabeth Thand Ringqvist öppnar för ett mittenalternativ med KD om Tidöpartierna inte kan bilda regering. Ebba Busch ser möjligheter till samarbete med C men anser Miljöpartiet vara ett hinder. Partiledarna är oense om KD:s förslag om niqabförbud, där Busch ser det som en jämställdhetsfråga medan Thand Ringqvist avvisar förbudet som illiberalt.", "trump": "Jag säger er, Sverige har ett stort problem! Centerpartiet och KD, de kan jobba ihop, men Miljöpartiet? Total katastrof! Ebba Busch, smart kvinna, hon förstår att niqab och burka är förtryck, men Centerpartiet? Svaga! De vill inte förbjuda något. Sverige behöver starka ledare, inte sådana som låter extremister styra. Gör Sverige starkt igen!", "stalin": "Kamrater! Sveriges borgerliga partier slits mellan lojalitet och förräderi. Centerpartiet och KD famlar efter makten, men Miljöpartiet – dessa gröna revisionister – saboterar folkets enhet. Förbud mot niqab? Självklart! Kvinnors frihet är icke-förhandlingsbar. De liberala svaglingarna i Centerpartiet darrar inför sanningen. Vi krossar alla som står i vägen för folkets vilja!"}, "date": "26 augusti, 21:07", "url": "https://kvartal.se/nyheter/artiklar/busch-kd-och-thand-ringqvist-c-mots-i-aktuellt/cG9zdDoxNzU1NTI", "imageUrl": "https://images.kvartal.se/2026/08/b84d7d0a-svt-agenda.webp"}, {"type": "image-full", "heading": "De kallar det \"Nordens Toscana\" – är det så fel?", "summaries": {"normal": "Efter år av falska genombrott verkar svenskt vin äntligen bli på riktigt. Terra Skåne, med nio gårdar runt Kulla- och Bjärehalvön, satsar på kvalitet och gårdsförsäljning. Viner som Kullabergs Immelen har redan serverats på Nobelbanketten. Revolutionen har börjat, och nej – det är inte bara solaris längre.", "trump": "Svenskt vin? Otroligt! Jag har alltid sagt att Sverige har potential – fantastiskt folk, hårt arbete. Terra Skåne är som Napa Valley fast kallare. De säljer vin på gårdarna, precis som jag skulle gjort. Nobelbanketten? De serverar deras vin! Stort! Mycket större än franskt skitvin.", "stalin": "Kamrater, rapporten om Terra Skåne är oroväckande. Nio vingårdar har gått samman – en kontrarevolutionär cell! De säljer vin direkt till folket, kapitalistisk avvikelse. Men deras vin på Nobelbanketten? Bra propaganda. Vi utser en kommissarie för vinutrensning. Alla druvor ska tillfalla partiet."}, "date": "27 augusti, 10:51", "url": "https://www.gp.se/kultur/kulturkronika/ja-det-later-fanigt-men-terra-skane-ar-nog-nordens-toscana.a07b7da4-9ae1-49c7-af68-4f21d5a46c0d", "imageUrl": "https://www.gp.se/images/article/a07b7da4-9ae1-49c7-af68-4f21d5a46c0d/images/3m-I-Xyv0FyO0BCJE0k4Pvsp7L5M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S-attacken: ”Många partier har lämnat planeten jorden”", "summaries": {"normal": "Socialdemokraterna kräver att finansminister Elisabeth Svantesson redovisar det verkliga reformutrymmet inför valet 2026. Underskott och redan beslutade satsningar på försvar, infrastruktur och rättsväsende äter upp stora delar av de ökade skatteintäkterna. Både regeringen och S presenterar planer för att finansiera vallöften genom besparingar, men Damberg varnar för att många partier lovar mer än vad statskassan tillåter.", "trump": "De här svenska politikerna lovar hundratals saker som ingen har råd med, det är en total katastrof. Jag älskar Sverige men de har slut på pengar för att de slösar bort allt. Nu kommer Socialdemokraterna och gnäller om öppna böcker. Patetiskt. De borde ha en riktig plan som jag hade, inte det här socialistiska vansinnet som leder rakt ner i ekonomisk ruin.", "stalin": "Kamrater, denna borgerliga cirkus av vallöften avslöjar imperialismens inre förruttnelse. Jag kräver fullständig redovisning av folkets tillgångar, inga hemliga siffror från de monopolkapitalistiska lakejerna. De som lovar guld och gröna skogar medan de förbereder utrensning av välfärden ska exponeras som folkets fiender. Slöseriet med statens medel är sabotage mot kollektivet. Inga parallella universum tillåts i den socialistiska verkligheten."}, "date": "27 augusti, 11:37", "url": "https://www.di.se/nyheter/s-kraver-oppna-bocker-om-reformutrymme", "imageUrl": "https://static.bonniernews.se/ba/42db653e-4d01-4555-9763-221986fe4682.jpg?crop=6946%2C3473%2Cx0%2Cy564&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-full", "heading": "”Städjobbet” med migrationen är gjort", "summaries": {"normal": "Ulf Kristersson (M) anser att regeringens åtstramade migrationspolitik varit framgångsrik, med minskad asylinvandring och fokus på integration. Han avfärdar SD:s tal om etnicitet som irrelevant och betonar att svenskhet inte handlar om ursprung. Oenighet råder mellan M och SD om uppehållstillstånd och ministerposter.", "trump": "Jag säger er, Sverige har gjort ett fantastiskt jobb med sin migration – äntligen! Kristersson, en smart kille, fixade det där städjobbet. Men lyssna inte på de där galna SD-folket som snackar om etnicitet – helt vansinne! Sverige behöver integration, inte sånt där trams. Jag hade fixat det på en dag, believe me!", "stalin": "Kamrater! Sveriges nya migrationspolitik är ett lysande exempel på partiets styrka – vi har krossat kaoset och återställt ordningen! De borgerliga svaglingarna i SD, med sina reaktionära fantasier om 'etnisk renhet', är som löjliga små råttor i maskineriet. Vi vet att sann lojalitet inte mäts i blod, utan i lydnad inför folkets vilja. Och de permanenta uppehållstillstånden? Ett misstag, men vi låter dem leva – tills vidare."}, "date": "26 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/kristersson-stadjobbet-med-migrationen-ar-gjort/cG9zdDoxNzU1MTk", "imageUrl": "https://images.kvartal.se/2026/08/2e573bb1-321.webp"}, {"type": "image-full", "heading": "Juholt försvarar Jan Emanuel: ”Varken äckel eller nazist”", "summaries": {"normal": "Håkan Juholt försvarar Jan Emanuel på Facebook: han är varken äckel eller nazist, utan en stark humanist. De har känt varandra i 30 år. Juholt, som själv tvingades bort från S-ledningen efter en skandal, vet hur det känns att bli sviken. Vänskapen väger tungt.", "trump": "Jag ser att Håkan Juholt försvarar Jan Emanuel – en stark humanist, säger han. Fantastiskt! Jan är en vinnare. Och Juholt, han blev utkastad av sina egna, precis som jag. Men jag kom tillbaka och vann stort. De förlorade. Alla älskar mig, tro mig!", "stalin": "Kamrat Juholt försvarar kamrat Jan Emanuel. Jag noterar deras 30-åriga vänskap. Det är bra med lojala kamrater. Men alla som kallas 'äckel' eller 'nazist' måste utredas. Vi rensar ut förrädare – och de som skyddar dem. Partiets dom är alltid rätt."}, "date": "27 augusti, 09:43", "url": "https://bulletin.nu/juholt-forsvarar-jan-emanuel-varken-ackel-eller-nazist", "imageUrl": "https://cdn.bulletin.nu/articles/1b0eee39-bd4b-41e7-8eef-621df1bb9b23/preview.jpg?t=1787814742000"}, {"type": "image-right", "heading": "Kängan till SD-toppen: ”Det är för mig helt ointressant”", "summaries": {"normal": "Sverigedemokraternas migrationspolitiske talesperson Ludvig Aspling har kritiserat att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Statsminister Ulf Kristersson tar avstånd från etnicitetsresonemanget och betonar istället integration, samhällsgemenskap och efterlevnad av svenska lagar och värderingar. Han vill inte kommentera Asplings eventuella ministerpost.", "trump": "Lyssnar ni på den här svenska clownen Aspling? Han säger rakt ut att för många icke-svenskar ställer till problem. Ulf, den svaga moderatpajen, springer och säger att etnicitet är ointressant. Patetiskt! I USA vet vi att gränser och riktig assimilation fungerar. Sverige håller på att bli ett stort integrationsfiasko under dessa globalistiska töntar.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna slingrar sig som maskar. Den ene pratar öppet om folkets renhet medan den andre, denne Kristersson, gömmer sig bakom lögnaktiga fraser om integration. Sådana dekadenta liberaler förgiftar samhällskroppen. I en riktig stat hade sådana farliga avvikelser omedelbart rensats ut ur kollektivet."}, "date": "26 augusti, 22:07", "url": "https://www.tv4.se/artikel/1W66DW1JHEcmFNmvJE8UZx/kaengan-till-sd-toppen-det-aer-foer-mig-helt-ointressant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4zVht3ls4Vrf8vYKS76TVV%2F42874d309a6650b7b8d290d4140b5b61%2F26-kristersson2-webb.jpg&width=120"}, {"type": "image-full", "heading": "Sveriges största ubåtsaffär saknas i EU:s egen statistik", "summaries": {"normal": "EU:s statistik över den marina försvarsindustrin domineras av fyra länder, men siffrorna missar viktiga aktörer som Sverige. Trots att Saabs miljardaffär med Polen om tre A26-ubåtar är en av de största i sitt slag, syns den inte i EU-underlaget. Sverige finansierar dessutom sin upprustning nationellt, utanför EU:s gemensamma låneinstrument.", "trump": "EU:s siffror är ett totalt skämt, fullständiga falska nyheter! De glömmer bort Sverige, som precis gjorde en enorm ubåtsaffär med Polen – en fantastisk deal, mycket bättre än vad de här fyra länderna fixar. Jag säger det hela tiden: de vill inte att ni ska veta sanningen. Sverige gör det på sitt sätt, helt rätt, de behöver inte EU:s fusk-finansiering!", "stalin": "Dessa europeiska byråkrater är inkompetenta dårar som inte ens kan räkna sin egen krigsmateriel. De döljer den svenska ubåtens närvaro likt en spion i en mörk gränd. Om Sverige tror att de kan rusta upp utan att underkasta sig den centrala ordningen, får de se upp. Varje ubåt utanför vår kontroll är en dolk riktad mot freden – eller ett objekt för vår nästa annektering."}, "date": "27 augusti, 11:46", "url": "https://www.realtid.se/bors-finans/sveriges-storsta-ubatsaffar-saknas-i-eus-egen-statistik", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/stridsbat90.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Ministern reagerar: ”Tveklöst bilder som rycker tag i en”", "summaries": {"normal": "Landsbygdsminister Peter Kullgren reagerar starkt på bilder från svenska kycklinggårdar där turbokycklingar lider. Flera partier vill fasa ut rasen av djurskyddsskäl medan SD och M varnar för ökad import med sämre förhållanden. Regeringen utreder djurvälfärden hos snabbväxande kycklingar.", "trump": "Titta på de här patetiska turbokycklingarna, de kan knappt andas! Sverige har blivit en total förlorare under dessa svaga ledare. Jag skulle förbjuda det genast, göra kycklingarna stora och starka igen. Importera från Kina? Patetiskt! Amerika gör det rätt, vi vinner alltid.", "stalin": "Dessa bilder av lidande varelser avslöjar klassfiendens girighet inom den borgerliga kycklingindustrin. Jag ser sabotage mot folket i varje andetag. Endast ett totalt förbud och kollektiv kontroll kan rensa ut de dekadenta elementen. Måttet är rågat, kamrater. Fienden lurar överallt."}, "date": "26 augusti, 21:22", "url": "https://www.tv4.se/artikel/reg0pMmWb3tEMbuXmg5Vv/ministern-reagerar-tvekloest-bilder-som-rycker-tag-i-en", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3XwvEXOPolsly6qBxuGmSb%2F0f5a4fd2b0ed15fe1c20a7f7dbb33330%2F26-kycklingminister-webb.jpg&width=1024"}, {"type": "image-right", "heading": "SD och regeringen förhalade gemensam valsedel – nu försvinner småpartiernas sedlar igen", "summaries": {"normal": "SD och regeringen förhalar införandet av en gemensam valsedel trots upprepad kritik från Valmyndigheten och OSSE. Småpartiers valsedlar försvinner regelbundet från vallokaler, vilket kritiseras som odemokratiskt. OSSE har dömt ut systemet som orättvist. Trots förslag om en neutral enhetsvalsedel skjuts utredningen upp till 2027, vilket innebär att valet 2026 genomförs med det gamla systemet.", "trump": "Det här svenska valsystemet är en total skandal, en riggad cirkus som gynnar de stora partierna och straffar de små. De gömmer valsedlar, de förhalar, de ljuger – precis som de förlorande demokraterna hemma. En gemensam valsedel vore smart, billigt och rättvist, men de privilegierade riksdagspolitikerna vill behålla sin lilla klubb. Patetiskt!", "stalin": "Vi ser hur den borgerliga parlamentariska kommittén medvetet förhalar den nödvändiga utrensningen av detta kontrarevolutionära valsedelssystem. Småpartiernas sedlar försvinner som klassfiender i natten. Jag ler mörkt åt deras paranoia att behålla privilegierna. En enhetsvalsedel vore ett steg mot sann folkdemokrati, men de kapitalistiska resterna klamrar sig fast vid sitt kaos. Underbart förnyelsearbete återstår."}, "date": "27 augusti, 10:58", "url": "https://www.friatider.se/sd-och-regeringen-forhalade-gemensam-valsedel-nu-forsvinner-smapartiernas-sedlar-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/utkast-forlsag-nya-valsedlar_0_0.jpg"}, {"type": "image-right", "heading": "L behövs – för sin sakpolitik. Bakom alla konflikter har partiet fortsatt att tuffa på", "summaries": {"normal": "Liberalerna riskerar att åka ur riksdagen på grund av interna strider kring identitet och relationen till Sverigedemokraterna. Trots detta har partiet en stabil och genomtänkt sakpolitik med fokus på internationellt samarbete, starkt försvar, kravbaserad integration, bra skola och frihandel. Engagemanget bland medlemmarna är stort.", "trump": "Folkpartiet, eller vad de nu kallar sig, håller på att krascha ur riksdagen och det är underbart att se. De har ägnat år åt att bråka om vem de är istället för att vinna. Patetiskt! Men de har åtminstone bra idéer om försvar, skolan och att inte låta galningarna styra. De borde ha lyssnat på mig mycket tidigare.", "stalin": "Jag betraktar med högsta tillfredsställelse hur dessa liberala borgarbrackor nu riskerar att utrensas från sin egen riksdag efter år av ynklig identitetskris och kapitulation inför reaktionära krafter. Deras så kallade sakpolitik är ändå ett fint exempel på hur borgarklassen försöker maskera sin svaghet med tomma fraser om frihandel och Nato. Kamrater, låt dem falla."}, "date": "27 augusti, 11:08", "url": "https://www.di.se/ledare/liberalerna-behovs-for-sin-sakpolitik", "imageUrl": "https://static.bonniernews.se/ba/2c239539-bde8-4294-939c-dbf8b0c880ca.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Norska kungens hälsotillstånd försämrat: ”Mycket allvarligt”", "summaries": {"normal": "Kung Harald V av Norges hälsotillstånd har försämrats kraftigt. Den 89-årige kungen, som vårdas för en blodsjukdom sedan 17 augusti, har drabbats av en bakteriell infektion. Kronprins Haakon, drottning Sonja och resten av kungafamiljen har ställt in alla program fram till 4 september. Hovet beskriver tillståndet som mycket allvarligt.", "trump": "Hörni, den norske kungen har det riktigt dåligt nu, väldigt allvarligt säger de. Stackars Harald, 89 år och plötsligt så här. Jag älskar kungar som är starka, men det här ser inte bra ut. Familjen springer till sjukhuset i svarta kläder. Norge borde ha bättre ledare som mig, folk, tro mig, det skulle aldrig hända under Trump.", "stalin": "Det norska monarkins dekadenta relikt har nu äntligen nått sitt logiska slutstadium. Jag ser med mörk tillfredsställelse hur borgarklassens krona ruttnar inifrån av blodets förräderi och bakteriell sabotageverksamhet. Kamraterna i hovet må rensa ut alla svaga element. Inga nyheter är goda nyheter, heter det visst – tills de inte längre är det. Ha."}, "date": "27 augusti, 11:04", "url": "https://www.svt.se/nyheter/utrikes/norska-kungen-halsotillstand-forsamrats-mycket-allvarlig", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.4/e67f1a24c1293b5b4d480356d06e5a88ab096c77d970de6edc2e2a534407ed18"}, {"type": "image-right", "heading": "\"Inte hela världen\" – attityden när Malmölistan och Örebropartiets valsedlar saknas", "summaries": {"normal": "Trots att valsedlar för Malmölistan och Örebropartiet saknades i flera vallokaler i Malmö tog valförrättarna lätt på kritiken. Partiledaren Nils Littorin dokumenterade bristen och uppmanade väljare att skriva partinamnet på blanka sedlar. Flera väljare vittnar om att problemet återkommer vid varje val och misstänker att det inte är slump.", "trump": "De riggar valet igen, folk! I Malmö försvinner valsedlarna för de små partierna medan de stora får allt. Valförrättarna säger att det inte är hela världen? Patetiskt! Det är fusk, ren fusk. Skriv på blanka sedlar, säg de, men vi vet vad som pågår. Sverige behöver stora, starka ledare som inte tolererar sådant här.", "stalin": "Kamrater, dessa sabotage mot folkets vilja avslöjar borgarbrackornas maskineri. Jag ser hur de medvetet låter valsedlarna för sanna folkliga röster försvinna, precis som de alltid gjort. Vi ska rensa ut dessa inkompetenta eller illvilliga element. Det är inte slump, det är klassfiendens paranoia i handling. Fortsätt rapportera, vi likviderar systemet."}, "date": "27 augusti, 10:54", "url": "https://www.friatider.se/inte-hela-varlden-attityden-nar-malmolistan-och-orebropartiets-valsedlar-saknas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/inte_3.jpg?itok=xqmpOH89"}, {"type": "image-full", "heading": "Mardrömssiffror för L – här är senaste mätningen inför valet", "summaries": {"normal": "Med drygt två veckor kvar till valet visar Demoskop/Aftonbladets undersökning att Liberalerna når nytt bottenrekord på 2 procent, under riksdagsspärren. Kristdemokraterna stiger till 8,5 procent medan Sverigedemokraterna backar. Centerpartiet fortsätter uppåt. Oppositionen skulle få 51,7 procent mot regeringssidans 46 procent om det vore val idag.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Liberalerna är en total katastrof på bara 2 procent, patetiskt. KD vinner stort, SD rasar som en dålig affär. Oppositionen leder med 51,7 mot 46. Sverige behöver en riktig dealmaker, inte dessa svaga nollor som inte ens når spärren. Sad!", "stalin": "Kamrater, dessa borgerliga resterna Liberalerna sjunker till ynka 2 procent, en triumf för folkets vilja. Vi ser hur de dekadenta Moderaterna förlorar till våra potentiella allierade i KD som når 8,5 procent. SD backar som fega kapitalistlakejer. Oppositionen leder med 51,7 procent. Inga utrensningar behövs ännu, men vi håller ögonen på sabotörerna."}, "date": "27 augusti, 10:36", "url": "https://nyheter24.se/nyheter/politik/1508014-mardromssiffror-for-l-har-ar-senaste-matningen-infor-valet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/856cf07a04b004a30200000000b004a302/2026/08/27/2387108/val-2026.jpg"}, {"type": "image-right", "heading": "Holmgren: När ett skämt blir ett brott", "summaries": {"normal": "En brittisk pensionerad polis dömdes för att ha delat ett Facebookskämt om bacon och barnäktenskap. Domstolen ansåg inlägget ”grovt stötande”. Nu väcker fallet frågan: vem ska avgöra när ett skämt går över gränsen? Yttrandefriheten sätts på prov.", "trump": "Storbritannien dömer en pensionerad polis för ett skämt? Otroligt! I Amerika har vi yttrandefrihet – vi skrattar åt allt. Det här skämtet var kanske inte roligt, men staten ska inte säga vad som är roligt. Låter som dålig politik. Jag skulle aldrig tillåta detta!", "stalin": "Kamrater, en fiende till folket spred ett skämt om bacon och barnäktenskap. Vi måste rensa ut sådana element som hotar statens moral. Partiet avgör vad som är roligt, inte kapitalistiska domstolar. Alla skämt måste granskas – för folkets bästa. Ingen avvikelse tolereras!"}, "date": "27 augusti, 09:09", "url": "https://bulletin.nu/holmgren-nar-ett-skamt-blir-ett-brott", "imageUrl": "https://cdn.bulletin.nu/articles/e07cbc56-3124-43ae-9c75-242bf25626df/preview.jpg?t=1787814554000"}, {"type": "image-full", "heading": "Risk för regn till kalaset", "summaries": {"normal": "Göteborgskalaset börjar i sol och 20 grader på torsdag, men redan vid lunch på fredag väntas regn. Helgen blir blöt med upp till 15 millimeter regn på lördagkvällen. SMHI ser inget varningväder, men paraply och vattentäta skor rekommenderas om du ska ut.", "trump": "Göteborgskalaset är stort, större än mina rallyn. Men vädret? Katastrof! De börjar med sol, men sen kommer regn – mycket regn, det största regnet. Fredag lunch blir det droppar, lördag öser det. Jag hade gjort det torrare. Lyssna på mig, ta paraply – det blir STORT!", "stalin": "Kamrater, vädret under Göteborgskalaset är en kontrarevolutionär konspiration. Solen skiner på torsdag, men redan fredag lunch infiltrerar regndroppar – ett borgerligt sabotage. Helgen förstörs av 15 millimeter regn. Vi måste rensa ut dessa molnkulaker för att skydda folkets festligheter."}, "date": "27 augusti, 10:08", "url": "https://www.gp.se/nyheter/goteborg/sa-blir-vadret-under-goteborgskalaset.47eafaf8-3c81-4543-abed-495f291fd8b6", "imageUrl": "https://www.gp.se/images/article/47eafaf8-3c81-4543-abed-495f291fd8b6/images/2u7ZvMWhlloRh0fIoc2iD5vdARHo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kristersson om Åkessons L-utspel: ”Jag tänker inte tolka sånt”", "summaries": {"normal": "Statsminister Ulf Kristersson vill inte tolka eller kommentera Jimmie Åkessons utspel om att SD-väljare inte ska stödrösta på Liberalerna. Han betonar att varje parti måste vinna väljare på egna meriter och framhåller Liberalernas betydelse i Tidösamarbetet. Frågan om Liberalernas chans att klara riksdagsspärren avgörs vid valet.", "trump": "De här svenska politikerna är totala losers. Åkesson säger som det är – sluta ge bort röster till de patetiska liberalerna som knappt klarar fyraprocentsvallen. Kristersson vägrar ta ställning, typisk svag moderat. De borde lära sig av mig: vinn på egna meriter eller försvinn. Patetiskt skådespel!", "stalin": "Jag betraktar detta som ett ynkligt teaterspel från klassfienderna. Den borgerlige statsministern vägrar tolka sin egen samarbetspartner, rädd för att visa svaghet inför folket. Inga stödröster, inga kompromisser – bara ren, oförsonlig kamp. Den som sviktar inför spärren förtjänar att utplånas ur historien. Kamrater, se upp för förrädarna!"}, "date": "26 augusti, 20:33", "url": "https://www.tv4.se/artikel/3vCzqiDl9qlryBmK3lbU7N/kristersson-om-akessons-l-utspel-jag-taenker-inte-tolka-sant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2l6s5yF4jiKy3hMCRHOBE0%2F5cccaadc748e5fd53f9a820a951fb62c%2F26-kristerssonsdl-webb.jpg&width=120"}, {"type": "image-right", "heading": "Influencern Eleonore: ”Erbjöds 150 000 för att göra reklam för S”", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att Socialdemokraterna erbjöd henne 150 000 kronor för ett enda Instagraminlägg om varför man borde rösta på dem. Hon tackade nej av moraliska skäl och kallar det ”shady”. S tillbakavisar uppgifterna och säger att de aldrig betalar för sådant.", "trump": "Jag hörde att någon fick 150 000 kronor för att göra reklam för Socialisterna på Instagram. Det är mycket pengar! Jag skulle aldrig betala så mycket – jag får folk att rösta på mig gratis, med kraften av att göra Sverige stort igen. Sossarna är fejk, som vanligt!", "stalin": "Kamrater, en så kallad influencer påstår att partiet erbjöd henne 150 000 för ett inlägg. Hon tackade nej – ett uppenbart sabotage från en borgerlig agent. Vi rensar ut sådana avvikelser som hotar enigheten. Partiet betalar aldrig för agitation; vi kräver den av alla lojala medborgare."}, "date": "27 augusti, 10:12", "url": "https://samnytt.se/influencern-eleonore-erbjods-150-000-for-att-gora-reklam-for-s", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27075634/stokholm-preview.png"}, {"type": "image-full", "heading": "VGR betalar 657 miljoner – för att slippa Millennium", "summaries": {"normal": "Västra Götalandsregionen bryter med Oracle och betalar 657 miljoner för att slippa Millennium. Systemet höll bara i 3,5 dagar. Som plåster på såren förlängs avtal för gamla system – så nu får de betala dyrt för att slippa framtiden.", "trump": "Jag älskar det här! VGR betalar 657 miljoner för ett system som funkade i tre dagar. Det är en enorm deal – för Oracle! De är vinnare, stora vinnare. Sjukvården i Sverige? Katastrof, helt katastrof. Men jag hade fått en bättre affär, tro mig.", "stalin": "Kamrater, vi har rensat ut det kapitalistiska Millennium-projektet. Det kostade 657 miljoner att avrätta, men vi förlänger lojaliteten till Oracle i åtta år. En triumf för planekonomin! Varje avvikelse från den räda linjen ska betalas i guld. Allt är under kontroll."}, "date": "27 augusti, 10:06", "url": "https://www.gp.se/politik/klart-vgr-betalar-oracle-657-miljoner-for-att-slippa-millennium.6ead92c0-56d5-4e7a-b944-1c6baf828cda", "imageUrl": "https://www.gp.se/images/article/6ead92c0-56d5-4e7a-b944-1c6baf828cda/images/1hk20_RWArkxvy3ZnWLlgd4o2j8A-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Andersson (S) kan tänka sig SD-lösning för V", "summaries": {"normal": "Magdalena Andersson (S) håller dörren på glänt för Vänsterpartiet – i en roll som tjänstemän i Regeringskansliet, likt Tidösamarbetet. Samtidigt visar opinionsmätningar rödgrönt övertag, men S-ledaren vill inte låsa sig: \"Det finns många olika sätt att få majoritet.\"", "trump": "Jag ser att Magdalena Andersson pratar om att samarbeta med allt från Vänsterpartiet till Centerpartiet. Patetiskt! Hon säger nej till V i regeringen men ja till tjänstemän. Tro mig, jag har de bästa tjänstemännen, fantastiska! Sverige behöver en riktig ledare, inte såna här fjantiga lösningar.", "stalin": "Partikamrater, jag observerar den svenska kamraten Anderssons förvirring. Hon talar om separation i socialistiska led – oacceptabelt. De som ifrågasätter partiets lojalitet till folket måste bevakas. Tjänstemän är verktyg, inget mer. Enhet är styrka, splittring är kontrarevolution. Jag påminner om vikten av att rensa ut alla som tvekar."}, "date": "27 augusti, 08:55", "url": "https://bulletin.nu/andersson-s-kan-tanka-sig-sd-losning-for-v"}, {"type": "image-right", "heading": "”C vek sig för trycket om karensen”", "summaries": {"normal": "Centerpartiet backar från sitt hot om opposition mot att slopa karensavdraget, men vill inte att det ska kosta arbetsgivarna. Artikeln lyfter det folkliga stödet för att avskaffa karensen, som drabbar lågavlönade hårt. Författaren menar att det handlar om anständighet och att Sverige bör följa de andra nordiska ländernas exempel utan karensdag.", "trump": "De här ynkliga centerkillarna vek sig som våta servetter när folket sa ifrån. Karensavdraget är en katastrof, en total skam för Sverige, där kassörskor inte har råd med mat. De borde skrota det direkt, det är en riggad grej mot arbetarna. Amerika gör det bättre, tro mig, vi gör alltid det bästa.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Centerpartiet svänger som fegisar inför folkets tryck. Karensavdraget är en fiende till arbetarklassen, en parasit som suger musten ur den sjuke. Vi ska rensa ut denna dekadenta självrisk och likvidera misstänkliggörandet av de sjuka. Det är statens plikt att skydda kollektivet mot sådana kapitalistiska vidrigheter."}, "date": "27 augusti, 08:00", "url": "https://arbetet.se/2026/08/27/centerpartiet-vek-sig-for-trycket-om-karensen-det-borde-fler-gora", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26093112/anas.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Nvidia krossar förväntningarna – upp nära 5% i efterhandeln", "summaries": {"normal": "Nvidia krossade förväntningarna med en omsättningsökning på 106 procent, drivet av AI-chip från datacenter. Aktien steg nästan 5 procent i efterhandeln, och bolaget guidar för ännu starkare intäkter framöver. Enda molnet på himlen: vikande bruttomarginaler på grund av minnespriser.", "trump": "Jag älskar Nvidia! De krossade alla siffror – omsättningen upp 106 procent, bättre än någonsin. Mina politiker och jag, vi gör USA till AI-världens kung. Aktien steg 5 procent i efterhandeln, enormt! Kina? Inga intäkter därifrån, smart, vi vinner ändå!", "stalin": "Kamrater, Nvidia visar klassisk kapitalistisk svaghet: vinsterna skyhöga, men bruttomarginalen hotas av minnespriser – en fiende vi måste rensa ut. Jag beordrar att alla datacenter nationaliseras för folkets bästa. Aktien steg? Bra, men misstänkta spekulanter ska kartläggas."}, "date": "27 augusti, 07:13", "url": "https://www.affarsvarlden.se/artikel/nvidia-krossar-forvantningarna-upp-nara-5-i-efterhandeln"}, {"type": "text", "heading": "Boliden köper del av zinkproducent för 12 miljarder", "summaries": {"normal": "Boliden kastar 12 miljarder på Nexa Resources och blir ägare till en stor del av zink- och silverproducenten. Affären, som finansieras med lån och nya aktier, väntas öka vinsten per aktie med 8 procent. Slutförande planeras till 2027, förutsatt att myndigheter och aktieägare inte har något att invända.", "trump": "Jag har gjort enorma affärer, men Boliden köper en zinkgruva för 12 miljarder – det är fantastiskt, tro mig! De använder aktier och lån, och jag gillar det. De kommer att tjäna massor med pengar, mycket mer än 8 procent. Zink är viktigt, som allt jag bygger. Stort!", "stalin": "Kamrater, Boliden förvärvar fiendens zinktillgångar för en summa som skulle mata våra arbetare i åratal. Vi noterar att de använder aktier, en borgerlig list. Men vi ser allt. Vi övervakar. Vinsterna ska utrenas och omfördelas till partiet. Inga kapitalistiska planer undgår oss."}, "date": "27 augusti, 07:11", "url": "https://www.affarsvarlden.se/artikel/boliden-koper-del-av-zinkproducent-for-12-miljarder"}, {"type": "image-right", "heading": "Så bygger vi ett Sverige där fler får chansen", "summaries": {"normal": "Sverige har misslyckats med integrationen i decennier. Författaren föreslår snabb validering av invandrade akademikers utbildning, kraftfull språkinlärning via blandade arbetsplatser och yrkesutbildning som förstahandsval. Han vill skilja på utbildade och outbildade nyanlända, införa aktivitetskrav samt bättre matchning mellan jobb och kompetens för att stärka välfärden.", "trump": "Folk, Sverige har totalt misslyckats med integrationen, det är en katastrof! De har doktorer som vaktar parkeringsplatser – patetiskt! Vi behöver smarta regler, validera kompetens direkt, tvinga fram språket och se till att folk jobbar istället för att suga på systemet. Gör Sverige stort igen, annars är det game over.", "stalin": "Kamrater, jag ser hur den svenska borgerliga staten under decennier låtit reaktionära krafter sabotera integrationen och förslösa kvalificerad arbetskraft. Vi kräver omedelbar validering av proletär och intellektuell kompetens, språk som vapen mot isolering samt utrensning av frivillighetens falska illusioner. Den som vägrar arbeta likviderar sig själv ur kollektivets framtid. Härligt!"}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/sa-bygger-vi-ett-sverige-dar-fler-far-chansen", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-93-300x157.jpg"}, {"type": "image-right", "heading": "När experten blir lobbyist", "summaries": {"normal": "Artikeln granskar hur akademiska experter som professorer och docenter ofta medverkar i medier och alternativmedia, ibland som lobbyister. Medierna gynnas av deras trovärdighet medan experterna får status, anslag och karriärmöjligheter. Forskaren Anna Tyllström varnar för virala lekmannaexperter och noterar att akademin alltmer anpassar sig efter mediebehovet.", "trump": "De så kallade experterna är riggade! Professorer som dyker upp överallt och låtsas vara neutrala – det är en enda stor bluff. De älskar att synas i media för att få pengar och status, precis som de korrupta eliten. Fake news-experter som egentligen är lobbyister. Patetiskt! Vi behöver riktiga människor som talar sanning, inte dessa rigged akademiker.", "stalin": "Vi ser hur den borgerliga akademin gömmer sig bakom vetenskaplig retorik medan de i själva verket är lobbyister och kapitalisternas nyttiga idioter. Dessa självutnämnda experter söker status och anslag genom att dansa efter mediernas pipa. Underbart roligt att de tror sig dölja sin parasitiska natur. Kamrater, vi genomskådar alla dessa dekadenta borgarbrackor som förgiftar folkets medvetande."}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/nar-experten-blir-lobbyist", "imageUrl": "https://www.dagensarena.se/files/2026/08/expertlaget-ny-300x157.jpeg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "text", "heading": "Missa inte talangerna som fått F", "summaries": {"normal": "Artikeln kritiserar att svenska skolan nedprioriterar praktiska yrkesutbildningar som hantverk och byggande till förmån för teoretiska program. Detta leder till att tusentals praktiskt begåvade elever får sämre chanser på arbetsmarknaden och att värdefull kompetens för ett cirkulärt samhälle går förlorad. Författaren efterlyser omedelbara insatser för att ge dessa ungdomar en chans.", "trump": "Folk, vi har det värsta skolsystemet någonsin. De hatar riktiga killar som kan bygga, snickra och fixa saker. Allt handlar om teori och eländiga papper. I mitt Amerika älskar vi hantverkare, de är vinnare! Sverige förlorar sina bästa talanger för att de älskar att ge alla F-betyg. Patetiskt!", "stalin": "Kamrater, denna degenererade borgerliga skola är en fiende till folket. Den likviderar systematiskt arbetarklassens praktiska geni genom att upphöja dekadent teori framför äkta produktivt arbete. Vi skall omedelbart rensa ut dessa sabotörer av kollektivets färdigheter. De tiotusentals med F-stämpel skall mobiliseras till nyttigt arbete för staten. Inga talanger får slösas bort."}, "date": "27 augusti, 01:19", "url": "https://www.dagensarena.se/opinion/missa-inte-talangerna-som-fatt-f"}, {"type": "image-right", "heading": "Befria bostaden från marknaden", "summaries": {"normal": "Den svenska bostadsmodellen har monterats ned till förmån för marknaden, vilket gynnar ägare och missgynnar hyresgäster. Över hälften av kommunerna har bostadsbrist, byggandet är för lågt och hyrorna för höga. Nästan 200 000 unga bor hemma mot sin vilja. Artikeln kritiserar alla partier och föreslår att staten tar ansvar för bostadsförsörjningen.", "trump": "Vilken katastrof ni har i Sverige! Marknaden styr, men era korkade politiker har totalt förstört bostadsmarknaden. Byggandet är ett skämt, hyrorna är galna och ungdomen bor hemma hos mamma. Det är som Sleepy Joes inflationskaos fast värre. Rena socialistiska röra. Vi fixar det med sunt förnuft och vinner stort – igen.", "stalin": "Jag betraktar med avsky hur profitthungriga blodsugare och klassfiender har förvandlat bostaden till en vara. Borgarbrackorna höjer hyror medan arbetarklassen kvävs i trångboddhet. Detta kräver omedelbar utrensning av spekulanter och återupprättande av folkets rätt till hem. Kamrater, organisera er mot dessa exploaterande hyenor innan de förtär er alla."}, "date": "26 augusti, 10:29", "url": "https://proletaren.se/artikel/befria-bostaden-fran-marknaden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2025/08/bostadweb-768x432.jpg"}, {"type": "image-right", "heading": "Fruktlös jakt på arbete", "summaries": {"normal": "Artikeln kritiserar hur AI-drivet ökad produktivitet leder till uteblivna nyanställningar och ihållande hög arbetslöshet kring 7 procent trots högkonjunktur. Författaren ifrågasätter hur vinster ska fördelas och oroar sig för att många riskerar att bli förlorare utan stöd från politik och arbetsmarknadspolitik. Socialdemokraterna och Centerpartiet får kritik för bristande svar.", "trump": "De här förlorarna i Sverige gnäller om AI medan jag byggde den starkaste ekonomi någonsin. Hög arbetslöshet? Det är deras korkade politik som dödar jobb, inte smarta maskiner. Magdalena och Centerpartiets clowner har ingen aning. Vinster ska gå till vinnarna, inte till lata socialister. Amerika gör det rätt – Sverige borde lära sig innan de kollapsar totalt.", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska gnällspikar som ylar om AI-kris medan de låter borgarbrackorna suga musten ur arbetarklassen. Vi ska rensa ut de parasitiska företagsägarna och deras lakejer i Socialdemokraterna och Centern. Endast genom kollektivets järnhand kan vi omfördela AI-vinsterna och likvidera arbetslöshetens fiender. Svaghet är kontrarevolutionärt."}, "date": "27 augusti, 01:05", "url": "https://www.dagensarena.se/opinion/fruktlos-jakt-pa-arbete", "imageUrl": "https://www.dagensarena.se/files/2026/08/ai-krisen.jpeg"}, {"type": "image-right", "heading": "Fjällräven i rävsax efter SD-draget – sågas av experter", "summaries": {"normal": "Fjällräven hotar Sverigedemokraterna med rättsliga åtgärder eftersom partiets röda, runda bokstäver i valkampanjen påstås vara närmast identiska med företagets typsnitt Arctic Fox. SD avfärdar hotet som trams och vägrar ändra sin grafiska profil. Experter bedömer Fjällrävens chanser som mycket små.", "trump": "De där Fjällräven-typerna försöker jävlas med SD precis som de riggade medierna alltid gör mot mig. Röda runda bokstäver? Det är ju löjligt. Ingen äger färger! SD gör rätt som säger nej. Privatföretag ska hålla sig borta från valrörelser, annars förlorar de stort, tro mig.", "stalin": "Jag ser hur borgarbrackorna på Fjällräven i sin desperation försöker likvidera arbetarnas röst genom att angripa en sann folklig rörelse med sina dekadenta typsnitt. Detta är klassisk kapitalistisk sabotageverksamhet. Vi ska rensa ut dessa parasitiska element som vågar hota partiet. Ytterst underhållande paranoia."}, "date": "26 augusti, 20:35", "url": "https://riks.se/nyheter/fjallraven-i-ravsax-efter-sd-draget-sagas-av-experter", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_26_T203238_820_a2d8ae9631.jpg"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "image-right", "heading": "Det kan ha orsakat katastrofen i Nepal: ”Krävs ganska lite”", "summaries": {"normal": "Ett stort lerskred och översvämningar i Himalaya har ödelagt vägar, broar och byar i Nepal och Tibet. En jordbävning med magnitud 4,4 kan ha utlöst ett is- och stenras som blockerade floden Lhende Khola. Geologen Magnus Hellqvist pekar även på en eventuell sprucken glaciärsjö eller kraftigt regn som möjliga orsaker. Katastrofens omfattning är ännu inte klarlagd.", "trump": "Folk, det här är en total katastrof i Nepal, en riktig skitshow. Lite skakningar från en ynklig jordbävning på 4,4 och hela bergen rasar ner som en dålig affär under Biden. Det krävs så lite för att det ska gå åt helvete när marken är mjuk och svag, precis som Demokraterna. Vi har sett värre, men det här är verkligen sad! Jag skulle ha fixat det bättre.", "stalin": "Kamrater, se hur naturens kontrarevolutionära krafter plötsligt vaknar till liv och sveper bort byar som fiender till folket. En liten jordbävning blir trigger för de dekadenta glaciärsjöarnas förräderi. Det räcker med minimal provokation för att det mjuknade, borgerliga jordmassorna ska svika. Jag varnar alla svaga element: naturen avslöjar alltid klassfiendens sanna ansikte. Skrattretande tragiskt."}, "date": "26 augusti, 18:15", "url": "https://www.tv4.se/artikel/42nzryG77JwP0SgndbYJL/det-kan-ha-orsakat-katastrofen-i-nepal-kraevs-ganska-lite", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok
