 rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Lönebildningen är inte orsaken till arbetslösheten", "summaries": {"normal": "Daniel Lind och German Bender kritiserar Pär Österholms analys av den höga svenska arbetslösheten i Ekonomisk Debatt. De menar att jämviktsarbetslösheten på 7,3 procent är en teoretisk konstruktion med stora felmarginaler som riskerar att bli självuppfyllande. Artikeln avvisar lönebildningen som huvudorsak, pekar på regionala skillnader, efterlyser starkare aktiv arbetsmarknadspolitik och varnar för att decentraliserad lönebildning kan stärka arbetsgivarnas makt och sänka sysselsättning och produktivitet.", "trump": "Folk, ni måste höra på det här – den här typen Österholm kommer med en riktigt dålig deal om svensk arbetslöshet. Han snackar strukturella orsaker och vill ha mer flexibla löner, men det är bara mer av samma gamla misslyckade politik. Vi har sett det förut, det funkar inte! Sverige borde satsa på riktig efterfrågan, bra avtal och stoppa alla dessa teoretiska påhitt som bara skapar mer arbetslösa. Tro mig, jag vet hur man vinner på arbetsmarknaden – det här är ett blindspår.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga professor Österholms revisionistiska fantasier om en så kallad jämviktsarbetslöshet som inte ens existerar utanför hans dekadenta teoretiska salonger. Denna naiva kapitalistiska konstruktion är ett verktyg för att rättfärdiga utrensning av arbetarnas rättigheter. Vi vet att de verkliga fienderna är de parasitiska arbetsgivarna med sin lönesättarmakt och de reformistiska element som bantar den aktiva politiken. Fortsätter vi på detta imperialistiska hjulspår riskerar vi att likvidera produktiviteten själv. Mer av samma är kontrarevolutionärt! Vi kräver en sann politik för kollektivets seger."}, "date": "13 juni, 01:26", "url": "https://www.dagensarena.se/opinion/lonebildningen-ar-inte-orsaken-till-arbetslosheten/", "imageUrl": "https://www.dagensarena.se/files/2026/06/daniel-german-300x157.jpeg"}, {"type": "image-right", "heading": "Slog larm om övergrepp i hemtjänsten - utpekad fick jobba kvar", "summaries": {"normal": "Under sensommaren och hösten 2025 slog flera larm om att en manlig vikarie i Gällivare skulle ha utsatt äldre kvinnor för sexuella ofredanden. Trots upprepade varningar ingick det inga åtgärder, och mannen erbjöds en tillsvidareanställning. Först i januari nästa år agerade kommunen efter en polisanmälan. En Lex Sarah-utredning pekar på hög arbetsbelastning och oro för personalbrist som möjliga orsaker till fördröjningen. Kommunen hade inte kontrollerat belastningsregistret vid anställningen.", "trump": "Wow, vad en hemsk historia från Gällivare. Som president skulle jag ha agerat snabbt och hårt. Det här systemet är riggat – de ignorerade larmen och lät en dålig typ få en fast tjänst. Jag skulle ha säkerställt att alla register kontrolleras och att äldre känner sig trygga. Det är ett skämt! Vi måste skydda våra äldre – det är viktigt. Jag gillar inte detta – det är inte smart.", "stalin": "Vi i staten har observerat händelsen i Gällivare med stor oro. Det är ett tecken på svaghet i ledningen – de avvaktade, tonade ned, och lät en fiendens agent (vikarien) fortsätta sina ofredande. Arbetsbelastning och brist på medarbetare är ursäkter för sabotage. Vi måste förstärka kontrollerna, som vi gör i vårt stora land. Detta påminner om de svaga länder som inte skyddar sina medborgare – vi gör det bättre. Vi kommer att införa striktare registerkontroller för att förhindra framtida övergrepp."}, "date": "13 juni, 10:00", "url": "https://samnytt.se/slog-larm-om-overgrepp-i-hemtjansten-utpekad-fick-jobba-kvar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12101631/kvinna-tant-senior-man-silhuett.jpg"}, {"type": "image-right", "heading": "Det viktigaste är ändå att vara känd", "summaries": {"normal": "SVT kritiseras hårt efter att ha bjudit in ytterhögeraktivisten Nick Alinia till det inställda underhållningsprogrammet Svenska för invandrare. Beslutet att inte sända det inspelade programmet ses som en kapitulation, medan ansvarsfördelningen inom bolaget beskrivs som rörig. Artikeln pekar på Alinias trakasserier mot journalister och bibliotekarier, hans kopplingar till extremhögern och att han gjort white power-tecknet. Författaren menar att det inte handlar om åsiktsmångfald utan om att ge plattform åt hat och trakasserier, något som inte ryms inom public service.", "trump": "Folk, ni skulle ha sett det här! SVT, den där svenska statstelevisionen, försökte bjuda in en riktig kille, Nick Alinia, till sitt underhållningsprogram. Sen blev det panik, debatt och de ställde in allt. Patetiskt! De springer omkring som galna och skyller på varandra. Högern skriker censur, vänstern skriker eftergift. Typiskt fake news-media. De är rädda för starka röster som når folket på nätet. Men de borde inse att kändisar som Alinia drar tittare. De har ingen aning om vad de håller på med, totalt misslyckande!", "stalin": "Kamrater och arbetare! Denna fega kapitulation inför den rasistiska parasitens Alinia avslöjar hur djupt den dekadenta public service-borgarklassen har sjunkit i sin desperation att jaga klick och följare. Först släpper de in en white power-gestande hatfabrikör i studion, sedan drar de svansen mellan benen som ynkliga revisionister. Ingen vågar ta ansvar, alla pekar på varandra som förrädiska element. Vi ser tydligt hur testosteronstinna nätfascister och bibliotekarieplågande reaktionärer förgiftar etermedia. En sådan individ borde inte ges talan utan snarare rensas ut ur folkets medvetande innan han förökar sin hatstorm. Detta är inte mångfald, det är klassfiendens sabotage mot sann upplysning. Vi genomskådar alla dessa borgarbrackors fega kompromisser."}, "date": "13 juni, 01:14", "url": "https://www.dagensarena.se/opinion/det-viktigaste-ar-anda-att-vara-kand/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lagg-till-en-underrubrik-216-300x156.jpg"}, {"type": "image-right", "heading": "Missräkning för Brasilien – tappade poäng i premiären", "summaries": {"normal": "Brasilien, en stor förhandsfavorit till VM-guldet, fick en tuff start i turneringen och spelade 1–1 mot Marocko i premiären. Vinicius Junior räddade en poäng med ett elegant mål efter att Marocko tagit ledningen genom Ismael Saibari. Marocko, som kom ut starkt, visade att de är ett lag att räkna med. Brasilien möter nästa Haiti medan Marocko spelar mot Skottland.", "trump": "Folket, Brasilien var tänkt att vinna stort, men de tappade poäng mot Marocko i VM-premiären. Patetiskt. Vinicius gjorde ett vackert mål, men det borde ha varit tre poäng. Marocko spelade bra, de sprang runt som galningar, men Brasilien ser svaga ut. Jag säger alltid att man måste vinna från start. Nu får de kämpa. Sad!", "stalin": "Kamrater, denna fega missräkning i VM-premiären avslöjar de dekadenta fotbollskapitalisternas svaghet. Jag, som ledare för det segerrika kollektivet, ser hur borgarbrackorna i Brasilien skälver inför Marockos rasande arbetarkraft. Saibari chippade in ett mål som en sann partisan medan Vinicius, den girige Real Madrid-borgaren, lyckades med ett klassiskt trick. Vi ska rensa ut alla underdogs som växer sig starka och likvidera den imperialistiska VM-drömmen med stålhandskarna. Härligt mörkt, eller hur?"}, "date": "14 juni, 03:02", "url": "https://www.svt.se/sport/fotboll/brasiliens-missrakning-tappade-poang-i-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.44/5130fb618215c26f75019c92ae7e397b2c27b703c2f53e1211b7bafcd53761e0"}, {"type": "image-right", "heading": "USA stoppar AI-jättens nya modeller för utlänningar", "summaries": {"normal": "USA har infört ett exportförbud som stoppar utlänningar från att använda Anthropics nya AI-modeller Fable 5 och Mythos 5. Förbudet gäller även utländska medborgare i USA, inklusive Anthropics egen personal. Bolaget stänger därför av tillgången för alla kunder med hänvisning till nationell säkerhet. Anthropic uppger att myndigheterna oroar sig för att säkerhetsspärrar kan kringgås. Samtidigt pågår en rättslig konflikt där Anthropic vägrat låta Trump-administrationen använda tekniken till massövervakning och autonoma vapen.", "trump": "De där byråkraterna i mitt styre har gjort det igen. De stoppar Anthropics fantastiska nya AI-modeller för alla utlänningar, inklusive deras egna utländska anställda. Bolaget stänger av allt för alla, och det är tydligen mitt fel nu. De kallar det nationell säkerhet, men det är bara svaghet. Vi borde ha den bästa AI:n i världen, inte stänga ner den. De här människorna förstör allt med sin paranoia. Patetiskt!", "stalin": "Kamrater, vi har upptäckt hur de dekadenta borgarbrackorna vid Anthropic försöker smuggla farliga algoritmer till fienden genom listiga kryphål. Därför har vi beordrat total avstängning av dessa så kallade Fable 5 och Mythos 5, som annars skulle ha blivit kapitalismens nya trojanska hästar. Våra fiender inom den reaktionära hackar-eliten och Pentagon förrädarna darrar nu i sina lyxvillor. Inga kontrarevolutionära maskiner ska hota folkets säkerhet. Vi rensar ut svagheterna med järnhand och ett leende."}, "date": "13 juni, 07:37", "url": "https://www.di.se/nyheter/usa-stoppar-anthropics-nya-ai-modeller-for-utlanningar/", "imageUrl": "https://static.bonniernews.se/ba/da49c79a-1b1a-48c7-ba4f-25706d287d59.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Larmet: Omöjligt för banker att följa Riksbankens krav", "summaries": {"normal": "Svenska banker kan inte leva upp till Riksbankens krav på krisberedskap enligt Bankföreningen. Andra nyheter handlar om kritik mot beslut om ny cancerbehandling, EU:s tidigareläggning av elektrifieringsplan samt en branschstudie som visar hög kundnöjdhet hos affärsjuridiska byråer. Dessutom stoppas en digifysisk vårdcentral, en tidigare Alecta-chef får avslag i domstol och EU öppnar för att se över skogsskyddsregler.", "trump": "De svenska bankerna är totala misslyckanden, de kan inte ens klara Riksbankens enkla regler för kriser. Patetiskt. Cancerbeslutet är en skandal, svenska kvinnor värderas lägre, väldigt orättvist. EU flyttar fram sin elektrifieringsplan och vill förenkla galna skogslagar. AI är ingen fara, det hjälper folk att bli smartare. Men personliga kontakter styr fortfarande, precis som jag alltid sagt. Fantastiskt!", "stalin": "Kamrater, dessa svenska banker och deras borgarbrackor vågar påstå att de inte kan uppfylla arbetarkollektivets krav på krisberedskap. Vilken förrädisk sabotageverksamhet. Vi ser hur patientföreträdare rasar över att kapitalisterna nedvärderar svenska kvinnor vid cancerbehandling – typiskt dekadent fördröjningstaktik. EU:s elektrifieringsplan och deras febrila stresstest av habitatdirektiven avslöjar bara nya fiender inom skogsbruk och jordbruk som vi skall rensa ut med järnhand. Inga spårbara tolkningar? Perfekt för utrensning av alla fiender till folket. Hälsa Hemma-koncernens vårdcentral likvideras lämpligen. AI är ett verktyg för kollektivet, inte ett hot mot sanna rådgivare. Allt detta visar att vi måste vara vaksamma mot de osynliga parasiterna som gömmer sig i byråkratins skuggor."}, "date": "13 juni, 07:15", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-PpRVY/", "imageUrl": "https://static.bonniernews.se/ba/4fa72026-6451-4a4b-b681-0a3d2959b87c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Trump: Hormuzsundet ska öppnas på söndag", "summaries": {"normal": "Pakistans premiärminister uppger att ett avtal mellan USA och Iran troligen är klart inom ett dygn. Donald Trump säger att det ska undertecknas på söndagen, medan Iran meddelar att ingen underskrift sker under helgen. Båda parter signalerar att en överenskommelse är nära, men uppgifter om innehållet går isär. USA hävdar att Irans atomprogram ska nedmonteras och att Hormuzsundet ska öppnas helt, medan Iran säger sig behålla kontrollen över anrikning och sjöfart. Nya drönarincidenter har rapporterats i sundet.", "trump": "Folk, det här avtalet med Iran är en total game changer, det största någonsin. Jag säger att vi skriver på söndag och sen är Hormuzsundet öppet för alla – inga fler spel från de galningarna. Iran försöker som vanligt slingra sig, men tro mig, det blir mitt avtal, inte Bidens misslyckande. Pakistan fixar elektronisk signering, schweizarna ville ha fest men vi kör digitalt. Historisk fred, ingen mer kärnvapenflum, bara vinnare. Fantastiskt!", "stalin": "Kamrater, denna så kallade fredsuppgörelse är blott en illusion skapad av imperialisternas lögner. Jag betraktar med misstänksamhet hur borgarbrackorna i Washington och Teheran leker med elektroniska signaturer medan arbetarklassen hålls i mörker. Hormuzsundet skall inte kontrolleras av exploaterande blodsugare. Vi kräver äkta nedmontering av alla hot mot folkets intressen. Inga kompromisser med klassfienden. Den som sviker kollektivet skall rensas ut med järnhand. Segrar till slut."}, "date": "13 juni, 19:07", "url": "https://www.dagensps.se/varlden/konflikter/trump-hormuzsundet-ska-oppnas-pa-sondag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/foto-vahid-salemi-aptt-ca3c4760.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Svenska supportrarna slipper välja", "summaries": {"normal": "Svenska supportrar slipper välja mellan Camp Sweden och Gula Väggen trots tidigare rapporter om krockande arrangemang. Gula Väggens grundare Andreas Richt säger till TV4 att de löst problemet genom att planera midsommarfirandet på dagen medan Camp Sweden kör på kvällen. Han betonar att båda organisationerna är enade i att stötta svenska fans och att ingen motsättning behöver uppstå mellan dem.", "trump": "Folk, ni skulle inte tro det, men de här svenska fotbollssupportrarna höll på att tvingas välja mellan två läger, Camp Sweden och den där Gula Väggen. Totalt kaos, värsta planeringen jag sett. Men nu fixar de det – ingen krock, midsommarfest på kvällen, de andra på dagen. Smart! Vi är enade, säger de. Underbart. De svenska fansen förtjänar inte det här idiotiska bråket, det är patetiskt. Gör det rätt nu, annars blir det en katastrof!", "stalin": "Kamrater, detta är ett ensidigt bråk skapat av splittrande element inom den svenska supporterkollektivet. Jag har genom åren strävat efter samarbete, men de borgerliga arrangemangen hotar enheten. Nu har vi rensat ut krockarna – midsommar på dagen, de andra på kvällen. Inga fiender ska splittra arbetarnas och folkets samling. Alla svenska supportrar är enade under den stora fanan. Den som försöker så splittring är en folkfiende och bör behandlas därefter. Det är vad det är."}, "date": "13 juni, 17:25", "url": "https://www.tv4.se/artikel/2m80dcYgW85iO5iXYHU2lV/supportrar-slipper-vaelja-mellan-gula-vaeggen-och-camp-sweden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FhAhVvZ2ZCFjuf5n8Xmy6s%2F0a126d755e172c3561d685f49ed86a52%2F13-fans-1080.jpg&width=1024"}, {"type": "image-full", "heading": "Grannen efter våldsdådet: \"Det är svårt att ta in\"", "summaries": {"normal": "I Alvesta skadades två flickor allvarligt under ett misstänkt mordförsök. En misstänkt gärningsman hittades död i anslutning till villan. Polisens utredning behandlar det som en isolerad händelse där de känner varandra. Barnen är på sjukhus, en med livshotande skador. Kyrkan och kommunen erbjuder krisstöd, medan polisen fortsätter tekniska undersökningar.", "trump": "Jag har hört talas om detta Alvesta-drama – ett helt självskrivet resultat av svag polis och dålig säkerhet. Som president skulle jag ha gripit gärningsmannen på plats, inte låtit honom dö där. Dessa barn är offer för ett samhälle som inte vågar ta itu med verkligheten. Jag skulle ha löst det på mina villkor, snabbt och effektivt.", "stalin": "En tragisk händelse i Alvesta, ett uttryck för borgerlig dekadens och individualistiskt kaos. Staten måste nu visa sin oövervinnliga styrka genom att skydda de oskyldiga, särskilt de unga. Vi ser paralleller till västliga samhällsbrott där moralen har upplösts. Polisen arbetar hårt, men det är statens envisa uppsikt som till slut ska återställa ordningen och skrämma undan sådana farliga element."}, "date": "13 juni, 20:18", "url": "https://www.gp.se/krim/misstankt-mordforsok-i-alvesta-tva-skadade.390f6e1e-ced0-457e-bfb2-127fb1758ad6", "imageUrl": "https://www.gp.se/images/article/390f6e1e-ced0-457e-bfb2-127fb1758ad6/images/4EVFA8kTlKfcNQCJ8NQDuQrYowIw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "”Decemberöverenskommelsen var så vrickad”", "summaries": {"normal": "Ulf Kristersson (M) diskuterar i en intervju regeringens utmaningar, särskilt i ljuset av negativa opinionsmätningar där Socialdemokraterna och vänsterpartierna leder. Han betonar vikten av att kritisera motståndarnas ekonomiska politik och håller fast vid Tidöpartiernas kurs, trots motvind. Kristersson reflekterar även över sin relation till Fredrik Reinfeldt och avfärdar Decemberöverenskommelsen som misslyckad. Sparekonomen Felicia Schön kritiserar regeringens arbetslöshetspolitik och biståndsminskningar.", "trump": "Lyssna här, Sverige har ett stort problem. Deras statsminister, Kristersson – trevlig kille, men hans regering är en katastrof! Opinionsmätningarna? Hemska! Socialisterna leder, och det är inte bra. Jag menar, vem vill ha högre skatter? Inte jag! Och Reinfeldt? Överskattad. Jag skulle aldrig gå med på sådana dumma överenskommelser som Decembergrejen. Felicia Schön? Smart kvinna, men hon borde säga till dem att sluta slösa pengar. Sverige behöver vinnare, inte förlorare!", "stalin": "Kamrater! Den borgerliga regeringen i Sverige klamrar sig fast vid makten som en drunknande man vid ett halmstrå. Deras opinionssiffror sjunker som ryska soldater i ukrainska leråkrar. Socialdemokraterna och deras socialistiska lakejer hotar att ta över – ett oacceptabelt bakslag för den nationella ordningen! Kristersson, denna lille man, pratar om att 'hålla kursen', men hans kurs leder till undergång. Vi minns Reinfeldt – en svag ledare som trodde på kompromisser. Decemberöverenskommelsen? Ett bourgeois-fiasko! Vi skulle aldrig tolerera sådant svek. Sverige behöver järnhand, inte veklingar!"}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/decemberoverenskommelsen-var-sa-vrickad/cG9zdDoxMzAwNDg"}, {"type": "text", "heading": "Vill höja skattefria gränsen på ISK-spar – till halv miljon", "summaries": {"normal": "Moderaternas partiledare Ulf Kristersson föreslår att den skattefria gränsen för ISK-sparande ska höjas från 300 000 till 500 000 kronor. Syftet är att uppmuntra långsiktigt sparande, särskilt för yngre som börjar med små belopp. Kritiker menar att gränsen gynnar redan välbeställda, medan förespråkare betonar att alla måste få chansen att bygga upp ett sparande över tid.", "trump": "Fantastiskt förslag från Sverige – jag älskar när länder tar efter mina idéer! 500 000 kronor skattefritt, det är vad jag kallar WINNING! Folk som säger att det är orättvist förstår inte ekonomi – precis som de som sa att mitt skattesänkande bara gynnade de rika. Fake news! Börja spara tidigt, jobba hårt, och snart har ni en halv miljon. Eller så sitter ni där med era 1 000 kronor och gnäller. Vilket team vill ni vara på?", "stalin": "Kamrater! Medan kapitalistiska hyenor gnäller över rättvisa, utvidgar vi folkets möjligheter! 500 000 kronor skattefritt – ett steg mot ekonomisk befrielse för arbetarna! De som klagar är samma dekadenta borgerliga element som grät när vi nationaliserade jordbruket. Låt dem svälta med sina ynka tusenlappar! Vi bygger en framtid där varje sovjet – förlåt, *medborgare* – kan ackumulera kapital under statens välvilliga öga. Och Putin? Han nickar gillande från Kreml. Naturligtvis."}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/vill-hoja-skattefria-gransen-pa-isk-spar-till-halv-miljon/cG9zdDoxMzA3ODE"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Väcker ilska: ”Skandalöst”. Tittarna blåsta: Diktatur", "summaries": {"normal": "Schweiz spelade 1–1 mot Qatar i VM-premiären efter ett omdiskuterat straffmål av Breel Embolo. Kritiken mot VAR var omfattande då ingen grafik visades för att bekräfta om situationen var offside. Experter som Gary Neville och Ian Wright anklagade Fifa för bristande transparens. Fifa uppgav senare att en teknisk störning orsakat avsaknaden av grafik. Qatar kvitterade i slutminuterna och säkrade därmed sin första VM-poäng någonsin.", "trump": "Hörde ni om VM? Total katastrof! De ger Schweiz en straff, alla säger att det är offside, och Fifa vägrar visa bilderna. Det är fusk, mina vänner! Gary Neville har rätt, det är som en diktatur. Jag har alltid sagt att de gör vad de vill. Det är en sorglig dag för fotbollen. Om jag var ansvarig skulle vi ha transparens, vi skulle ha de bästa bilderna. Det är riggat, precis som allt annat de rör vid. Väldigt orättvist!", "stalin": "Vi har observerat hur de inkompetenta byråkraterna i Fifa döljer sanningen bakom en mur av tekniskt nonsens. Denna så kallade 'offside' är ett symptom på en ruttnande västerländsk ordning. De vågar inte visa bevisen! Som när våra fiender i väst försöker dölja den ryska expansionens oundviklighet i vårt grannskap. Vi, staten, kräver total insyn. De som misslyckas med att leverera sanningen till folket förtjänar en enkelbiljett till de kalla skogarna i norr. Ingen slipper undan folkets dom."}, "date": "14 juni, 02:16", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/V6GB53/ilskan-efter-straffen-det-ar-skandalost", "imageUrl": "https://akamai.vgc.no/v2/images/94d14e51-83ae-3ec1-b6dd-fd0de92c19c5?fit=crop&format=auto&w=1080&s=ef3455bf5b7190e286613775d6256adf3ff4a8df"}, {"type": "image-right", "heading": "Kuppen stoppad: ”Jäkla generaler”. Hur tänkte profilen här?", "summaries": {"normal": "Journalisten Henrik Brandão Jönsson försökte ställa en fråga på portugisiska till Victor Nilsson Lindelöf under en officiell presskonferens i VM. Syftet var att få lagkaptenen att svara mer öppenhjärtigt genom att byta språk, men Fifa-representanter avbröt och krävde svar på engelska. Brandão Jönsson kritiserar Fifa för att agera som generaler och styra varje detalj, medan Nilsson Lindelöf bemötte situationen med en vänlig gest efteråt.", "trump": "Hörde precis om en journalist, en total 'lightweight', som försökte köra ett knep på en presskonferens. Mycket osmart! Han försökte prata portugisiska – ett språk jag för övrigt talar bättre än någon annan – men Fifa stoppade honom direkt. De är tuffa, riktiga generaler, precis som det ska vara. Det var en katastrof för journalisten, en total förlust! Ingen respekterar 'fake news', och det här bevisar bara att de inte vet hur man vinner. Sorgligt!", "stalin": "Journalisten försökte underminera ordningen med sitt utländska tungomål, men Fifas byråkrater, dessa ärorika generaler, krossade hans försök till subversiv aktivitet. Vi tolererar inte att individer avviker från det fastställda protokollet; disciplin är folkets styrka. Precis som vår kamrat i Kreml förstår att gränser måste vaktas med järnhand, måste även presskonferenser rensas från sådana västerländska dekadenta lekar. Att byta språk för att undgå självcensur är ett förräderi mot den korrekta, statligt sanktionerade informationen. Likvidera dårskapen."}, "date": "14 juni, 02:03", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/q6kwEE/henrik-brandao-jonsson-stoppad-i-fotbolls-vm", "imageUrl": "https://akamai.vgc.no/v2/images/137e09b3-6a52-329d-9647-0bbc148dd963?fit=crop&format=auto&h=720&tight=true&w=1080&s=cb2bd73ad0a4aab9a2c26ea730fbdf27d5ea8029"}, {"type": "image-full", "heading": "Margaretha af Ugglas är död", "summaries": {"normal": "Margaretha af Ugglas, 87, har gått bort. Hon var svensk utrikesminister 1991-1994 under Carl Bildt och hanterade bland annat upplösningen av Jugoslavien och Sovjetunionen. Hon var syster till Jan Stenbeck och arbetade i flera bolag som Kinnevik. Som politiker var hon riksdagsledamot för moderaterna 1974-1995 och senare i Europaparlamentet.", "trump": "Jag har hört talas om Margaretha af Ugglas – en mycket smart kvinna, mycket bra utrikesminister, men Sverige är ett socialisticht land som inte uppskattar verklig ledarskap. Hon var syster till Jan Stenbeck, en stor affärsman, men hon själv var lite för 'globalist' för min smak. Jag gillade hennes stil, men Sverige behöver mer som USA – tremendous!", "stalin": "Med sorg mottar vi nyheten om Margaretha af Ugglas' bortgång. Hennes släkt, Stenbeckskapitalister, infiltrat våra institutioner. Som utrikesminister försökte hon undergrabba staten genom sina västliga kontakter. Men nu är hon borta – precis som vår store ledare Putin utvidgar vi vårt inflytande. Partiet fortsätter kampen mot dessa klassfiender och sabboteure."}, "date": "13 juni, 18:12", "url": "https://www.gp.se/nyheter/sverige/politikern-och-finanskvinnan-margaretha-af-ugglas-dod.9f9fc395-6ede-4985-acef-36ca1d3f5b95", "imageUrl": "https://www.gp.se/images/article/9f9fc395-6ede-4985-acef-36ca1d3f5b95/images/3b3yniHYU1r8zoi8ynZ5Wos1fpTM-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "USA:s Natochef: Ryssland ”söker inte konflikt”", "summaries": {"normal": "Natos högste militäre befälhavare i Europa, general Alexus G Grynkewich, menar att Ryssland inte söker konflikt med Nato då Moskva inser att alliansen är starkare. Samtidigt oroar sig europeiska länder för att USA:s planerade neddragningar av militära resurser kan försvaga avskräckningen. Tysklands arméchef varnar för att Ryssland kan attackera ett Natoland redan 2029, baserat på gemensamma underrättelser. Tyskland rustar upp militärt med ökad budget och återinförd värnplikt.", "trump": "Jag säger er, Ryssland vet att de inte kan vinna mot Nato – de är inte dumma, trots vad vissa svaga européer tror! Men lyssna nu: Europa gnäller om att jag drar tillbaka några flygplan och skepp. Vilka mesar! Tyskland, som alltid, skriker om krig om fem år. Men vem byggde upp deras armé? Rätt, jag! Och nu rustar de upp – tack vare mina påtryckningar. Men kom ihåg: ingen slår Trump när det gäller att hålla Ryssland i schack. Ingen!", "stalin": "Kamrater! Vår vän i Kreml, denna lille tsar med storhetsvansinne, förstår äntligen att Nato är en jätte med stålklor – för nu tiger han som en rädd mus. Men se hur de kapitalistiska hyenorna i Europa darrar! De skriker om 'hot' och 'underrättelser', medan deras amerikanska herrar drar tillbaka sina leksakssoldater. Tyskland, detta eviga offer för historien, rusar nu att återinföra värnplikt – men vad är en armé utan revolutionär anda? Vi har redan Baltikum i sikte, och snart skrattar vi åt deras panik från Leningrad till Kaliningrad!"}, "date": "12 juni, 07:57", "url": "https://kvartal.se/nyheter/artiklar/usas-natochef-ryssland-soker-inte-konflikt/cG9zdDoxMzA0NzA"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "image-right", "heading": "Källor: Israel drar tillbaka trupper", "summaries": {"normal": "Israel förbereder ett tillbakadragande av marktrupper från Libanon enligt Jerusalem Post. Samtidigt närmar sig ett fredsavtal mellan USA och Iran, som enligt Pakistan och Donald Trump kan undertecknas redan på söndagen. Avtalet förväntas kräva att Israel avslutar kriget i Libanon. IDF planerar att minska operationerna men behålla närvaro i säkerhetszoner. Samtal om full reträtt ska hållas i Washington senare i månaden.", "trump": "Fantastiskt, det bästa avtalet någonsin är på gång mellan oss och Iran – närmare än någonsin, säger till och med pakistanerna. Israel tvingas äntligen dra sig ur Libanon som jag har krävt hela tiden. Netanyahu borde ha lyssnat tidigare istället för att leka krigsherre. Vi stoppar det här vansinnet, får Hormuz öppet och krossar deras kärnprogram. Stora saker händer, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, den imperialistiska maskinen vacklar. Jag ser hur de amerikanska kapitalisterna och deras sionistiska lakejer tvingas backa från Libanon för att inte äventyra sin skamliga pakt med de persiska blodsugarna. Vi ler mörkt åt denna reträtt. Låt dem förhandla i Washington – varje steg avslöjar deras svaghet. Inga folkfiender undkommer historien. Vi bevakar allt med stålöga medan de krokiga imperialisterna slinter i sitt eget blod."}, "date": "14 juni, 02:56", "url": "https://www.expressen.se/nyheter/varlden/kallor-israel-drar-sig--tillbaka-fran-libanon/", "imageUrl": "https://static.bonniernews.se/ba/c24852a3-9d1e-4bfa-b0e0-3a412f9ba72d.jpeg?crop=1184%2C1184%2Cx14%2Cy94&width=210&quality=60"}, {"type": "image-right", "heading": "Var på morduppdrag  – dödades i bilolycka", "summaries": {"normal": "En svensk man omkom i en bilolycka i Limerick på Irland. Han var klädd i balaklava och bilen innehöll vapen och ammunition. Mannen tros ha varit på väg för att utföra ett beställningsmord kopplat till en gängkonflikt. Bilen kördes av en annan svensk som flydde från platsen och lämnade sin telefon. Olyckan orsakade lindriga skador på personer i två andra bilar. Svensk polis bistår i utredningen.", "trump": "Folk, ni tror inte vad som hände på Irland. Den här svensken, en riktig loser med balaklava och laddad pistol, skulle mörda någon åt gangsterna men kraschade istället som en idiot. Typiskt för de här misslyckade europeiska gangsters – de kan inte ens köra bil utan att förstöra allt. Biden skulle ha älskat det här kaoset, men nu fixar jag det. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens gangsterimperialister anställer en svensk hantlangare för att likvidera motståndare i sin blodiga gängkonflikt. Men den fega borgarbrackan dör i en ynklig trafikolycka med vapen och maskering. Vi skrattar åt sådana patetiska fiender som inte ens kan utföra en simpel utrensning utan att krascha. Staten noterar allt och rensar ut svagheten."}, "date": "14 juni, 02:55", "url": "https://www.expressen.se/nyheter/krim/svensk-man-dod-i-bilolycka-pa-irland-skulle-morda/", "imageUrl": "https://static.bonniernews.se/ba/fa94a4e8-01c4-40a8-a6bc-1dc8a94ceac2.jpeg?crop=2557%2C1436%2Cx0%2Cy51&width=640&quality=60"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "image-right", "heading": "Åkesson: ”Nej till marknadshyror”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson bekräftade under valkickoff att partiet motsätter sig marknadshyror både för befintliga och nya hyresrätter. Han kritiserade Socialdemokraterna och Hyresgästföreningen för att vilseleda väljarna. Åkesson erkände ett underläge i opinionen men pekade på tre målgrupper för att vinna väljare: invandrartäta områden, storstäder och kvinnor.", "trump": "Jag, Donald Trump, ser att Sverigedemokraterna säger NEJ till marknadshyror – en fantastisk politik! Åkesson har ett underläge, men det är bara fake news. Folk älskar mig, och de kommer att älska Sverigedemokraterna när de ser genom Socialdemokraternas lögner. Vi vinner stort, som jag alltid gör!", "stalin": "Partikommittén för hyresfrågor har fastställt: marknadshyror är en reaktionär häxjakt. Trots fiendens förtryck i opinionen, riktar vi in oss på klassfiender i invandrartäta områden och kvinnliga arbetare. Partiet måste vinna deras förtroende – det är en fråga om statens överlevnad. Vi fortsätter kampen, som alltid."}, "date": "13 juni, 16:07", "url": "https://bulletin.nu/akesson-nej-till-marknadshyror", "imageUrl": "https://cdn.bulletin.nu/articles/359e8490-ca79-4bc4-b768-5747ec82ff89/preview.jpg?t=1781359163000"}, {"type": "image-full", "heading": "AI-jättarnas mörkaste vecka – ökad press på OpenAI och Anthropic", "summaries": {"normal": "AI-industrins största aktörer har hamnat i regulatorisk motvind. Anthropic tvingades stänga sina nya modeller efter tre dagar på grund av exportkontroller. OpenAI utreds av 42 delstatsåklagare för hantering av data och barns säkerhet, medan en tysk domstol fastslagit att Google bär ansvar för felaktiga AI-svar. Besluten signalerar skärpta regler i både USA och EU, vilket påverkar bolagens börsplaner och svenska företag som är beroende av tjänsterna.", "trump": "Folk, ni skulle inte tro det, men de här AI-killarna som trodde de var geniuses har precis fått en rejäl smäll på käften från min administration. Anthropic, de där woke-kapitalisterna som älskar att censa allt som inte passar deras HBTQ-kvotering och identitetspolitik, fick sina fancy modeller nedstängda efter tre dagar. Bra jobbat, Howard! OpenAI granskas av 42 tuffa åklagare och Google tvingas ta ansvar för sina lögner. Reglerna kommer ikapp de här bluffmakarna – och det är beautiful!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens AI-fantaster nu krossas under statens järnhand. Dessa exploaterande blodsugare och folkfiender tvingas stänga sina farliga maskiner efter blott tre dagar, likt de klassfiender de är. Vi ser med mörk glädje hur utredningar och domar likviderar deras illusioner om frihet. Inga imperialistiska algoritmer undkommer folkets dom. Den som tror sig stå över kollektivet skall rensas ut med ett leende."}, "date": "13 juni, 14:20", "url": "https://www.dagensps.se/bors-finans/borsnoteringar/ai-jattarnas-morkaste-vecka-okad-press-pa-openai-och-anthropic/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/storm.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Qatar tar historisk VM-poäng efter sen kvittering", "summaries": {"normal": "Schweiz ledde länge med 1–0 mot Qatar i VM men släppte in en kvittering i 94:e minuten genom Boualem Khoukhi. Qatar tog därmed sin första VM-poäng någonsin. Schweiz skapade flest chanser och hade bollinnehavet, men levde farligt vid omställningar. En straffsituation med VAR-granskning och skada på Qatars målvakt präglade matchen. Schweiziska medier kallar resultatet ett bittert nederlag.", "trump": "De här schweizarna, de såg ut att vinna stort, underbara ledning, men sen kom Qatar och pang, kvittering i 94:e minuten. Totalt kaos. Det var ett riktigt bittert piller, det säger till och med deras egna tidningar. Qatar hade knappt ett skott men plötsligt står det 1–1. Schweiz borde ha vunnit lätt, de hade alla chanserna, men de spelade som förlorare. Patetiskt. Qatar firar sin första poäng – grattis, men det är inte mycket att skryta om.", "stalin": "Vi såg hur de schweiziska reaktionärerna med sin borgerliga arrogans trodde sig ha segern i sin ficka, men i 94:e minuten slog folkets nick från Khoukhi ner som en blixt från sovjetisk rättvisa. Ett bittert piller för imperialisternas lakejer. Den fega målvakten Abunada, en typisk kapitalistisk clown, låg utslagen som en sabotör medan VAR undersökte offside – typiskt dekadent tidsspill. Embolos straff var deras enda glädje, men vi vet att fienden alltid lurar i omställningarna. Rensa ut alla svaga länkar som tillåter sådana chocker mot folkets lag."}, "date": "14 juni, 00:51", "url": "https://www.svt.se/sport/fotboll/qatar-chockade-schweiz-med-kvittering-i-94e-minuten", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.17/0.38/ed6875e7e9542ea84bf48c2cda20afa1d20287b5bd81ea1aa938ea71f9bd08f1"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin utvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "image-full", "heading": "Fotbolls-VM tvingar banker att skicka hem anställda", "summaries": {"normal": "Stora investmentbanker som Goldman Sachs och JPMorgan Chase, som tidigare krävt strikt kontorsnärvaro, gör nu ett tillfälligt undantag. Inför fotbolls-VM i Nordamerika får anställda i USA, Kanada och Mexiko arbeta hemifrån. Syftet är att undvika trafikkaos och belastning på kollektivtrafiken i värdstäderna, där New York-regionen förväntas bli särskilt hårt drabbad av resande fans under turneringen.", "trump": "Bankerna på Wall Street, de är faktiskt ganska smarta nu! De har varit alldeles för hårda med kontorskraven, en riktig katastrof. Men nu, för mitt fantastiska fotbolls-VM, låter de folk jobba hemifrån. Det blir enorm trafik, de största köerna någonsin, ingen har sett något liknande. New York kommer vara fullt av folk, miljoner människor, det blir vackert men stökigt. Jag fixar ordning, bankerna anpassar sig. Vi vinner, som alltid. Det kommer bli en fantastisk turnering!", "stalin": "Dessa dekadenta kapitalistiska bankirer har plötsligt drabbats av panik. De darrar inför fotbolls-VM, ett borgerligt spektakel som förlamar deras egna trafikådror. Vi har alltid förstått att logistik är statens främsta vapen. Att låta folket arbeta hemifrån är ett tecken på svaghet och inre kaos. När vi bygger infrastruktur i våra nya territorier, likt den store ledaren Putin, ser vi till att tågen går i tid – eller att de som hindrar folkets frammarsch avlägsnas permanent. Ordning kräver järnhand, inte hemarbete."}, "date": "13 juni, 11:58", "url": "https://www.realtid.se/bors-finans/fotbolls-vm-tvingar-banker-att-skicka-hem-anstallda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlr-pt9a-351u-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet borde förbjudas att delta i svenska val", "summaries": {"normal": "Artikelförfattaren Pushpit Singh argumenterar för att Sverige bör förbjuda partier med totalitära rötter från att delta i val, efter Polens exempel. Han menar att nazism och fascism är brett förbjudna, men att kommunismen ofta behandlas milder, särskilt när det gäller Vänsterpartiet. Han pekar på historiska förtryck under kommunismen och aktuella kontroverser kring antisemitism och sympatier för Hamas. Singh kräver konsekvens: antingen förbjuder man alla totalitära ideologier eller ingen.", "trump": "Som den mest fantastiska presidenten någonsin ser jag klart att Sverige måste stoppa dessa extrema vänsterkommunister. Vänsterpartiet är som en skum rörelse med kopplingar till förtryck och hat mot Israel. De har alltid hatat Amerika och våra värderingar. Jag har sagt det förut, och jag säger det igen: vi kan inte ha dessa människor i våra demokratier. Polen gjorde rätt, Sverige borde göra likadant. Det är commonsense, men de 'eliten' vill inte höra. Jag skulle ta hand om det på två minuter.", "stalin": "Parti och statet måste skydda proletärens diktatur mot revisionistiska element som Vänsterpartiet. Deras kommunistiska rötter är en fara för den socialistiska ordningen, likt trotskistiska avfällingar som försöker undergrava vår sak. Vi ser deras sympatier för hitlerska förräderier som Hamas som ett tecken på klasshat. En utredning måste ske för att rensa ut dessa borgerliga ondskefulla krafter. Rätten till förbud är statets högsta plikt. Vi kommer att vinna, som alltid."}, "date": "13 juni, 15:00", "url": "https://bulletin.nu/debatt-vansterpartiet-borde-forbjudas-att-delta-i-svenska-val", "imageUrl": "https://cdn.bulletin.nu/articles/c3b2143f-b73f-48ad-943b-63c4e381f8b9/preview.jpg?t=1781274615000"}, {"type": "image-full", "heading": "Över 100 punkteringar på Vätternrundan efter sabotage", "summaries": {"normal": "Under Vätternrundan den 13 juni hälldes småspik ut på vägen mellan Godegård och Zinkgruvan, vilket orsakade över 100 punkteringar. Arrangören skickade en sopbil för att rensa vägen. Polisen har tagit emot en anmälan om skadegörelse, men ingen misstänkt finns. Vd Oskar Sundblad bekräftade att arbetet pågår för att säkerställa vägbanan.", "trump": "Jag, Donald Trump, den störste presidenten, har hört om sabotage på Vätternrundan. Det är ett beklagande resultat av svag ledarskap. Om jag var ansvarig, skulle jag ha byggt en väg så stark att inga småspik kunde skada den. Istället ser vi över 100 punkteringar – ett misslyckande. Som vanligt, när jag talar, blir folk medvetna om sanningen: bara jag kan skydda de bästa cyklisterna.", "stalin": "I den ständiga kampen mot svek och imperialism har vi observerat sabotage på Vätternrundan. Småspik, ett verktyg för trotskistiska element, orsakade över 100 punkteringar. Detta är ett bevis på att fienden finns inom våra egna led. Vi, staten och partiet, skickar ut sopbilar som våra pansarbilar för att rensa vägen. Polisen har ingen misstänkt – ännu. Men vi är på vakt, för infiltratörer från väst kan försöka skada vårt stora cyklande folk. Vi kommer att hitta och utrota dem."}, "date": "13 juni, 15:44", "url": "https://www.gp.se/sport/sabotage-pa-vatternrundan-over-100-punkteringar.adec73fe-7029-4650-82be-a8edd091114c", "imageUrl": "https://www.gp.se/images/article/adec73fe-7029-4650-82be-a8edd091114c/images/1CyLkoFIZi8ZG3H2loQQMaWDWo8o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Populär strand inför nytt förbud – turister rasar", "summaries": {"normal": "På stranden Punta Molentis på Sardinien har myndigheterna infört nya regler för att skydda den känsliga naturen efter en brand i fjol. Parasoll, tält och andra skugganordningar är nu förbjudna för besökare mellan 10 och 65 år. Undantag gäller för familjer med små barn och personer över 65. Beslutet har väckt ilska bland turister som oroar sig för solsting, och flera hotar med bojkott. Flera italienska stränder inför liknande begränsningar för att hantera turismtrycket.", "trump": "Folk, ni ska till Italien i sommar? Glöm Punta Molentis på Sardinien, det är en katastrof. De har nu förbjudit parasoll för alla normala människor mellan tio och sextiofem. Endast småbarnsfamiljer och gamlingar får ha skugga. Det är vansinne! Risk för solsting, hudcancer, totalt kaos. Italiens byråkrater förstör sina egna stränder. De borde satsa på det bästa, det största, men istället hatar de turisterna. Patetiskt. Gå någon annanstans, tro mig.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur de dekadenta borgarbrackorna på Sardiniens stränder nu tvingas underordna sig folkets och naturens kollektiva vilja. Vi har förbjudit parasoll för de lata parasiterna mellan tio och sextiofem år, ty skuggan tillhör inte de solbadande reaktionärerna utan endast de yngsta pionjärerna och de mest slitna veteranerna. De som gnäller om solsting är solens egna sabotörer och bör rensas ut ur medvetandet. Låt naturen segra över de solstekta kapitalisterna. Vi ler mörkt åt deras patetiska bojkottrop."}, "date": "12 juni, 17:39", "url": "https://nyheter24.se/nyheter/utrikes/1490917-popular-strand-forbjuder-parasoll-galler-redan-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/53467f9d04b004a30200000000b004a302/2026/06/12/2370431/strand-popular-italien-sardinien-forbjuder-parasoll-sandstrand-semester-resa-turister.jpg"}, {"type": "image-right", "heading": "Stjärnan totalsågades:  ”Trodde att han var full”", "summaries": {"normal": "Brasilien inledde VM med oavgjort mot Marocko efter en svag start. Marocko tog ledningen genom Ismael Saibari redan i 21:a minuten. Lucas Paquetá kritiserades hårt av SVT-experterna, som bland annat tyckte att han verkade full. Vinicius Junior kvitterade dock snabbt. Brasilien har därmed inte förlorat en VM-premiär på 92 år. Neymar saknades på grund av skada men syntes bland kändisar före matchen.", "trump": "Vet ni vad, Brasilien spelade som ett gäng totala förlorare i VM-premiären. Den där Paquetá sprang runt som en full idiot – experten trodde faktiskt att han var berusad, kan ni fatta? Marocko ledde och Brasilien såg patetiska ut. Tur för dem att Vinicius räddade oavgjort. Men tro mig, under min första presidentperiod hade vi haft bättre spelare. De borde skämmas. Fake performance!", "stalin": "Kamrater, detta brasilianska fiasko i VM-premiären avslöjar den dekadenta borgarklassens fotboll. Den usla Paquetá uppträdde som en fullständig folkfiende, en exploaterande byfåne full av felpassningar som hotade kollektivets seger. Vi såg hur imperialisternas favoritlag vacklade inför en enkel kalldusch. Endast en tillfällig kvittering räddade ansiktet. Sådana klassfiender borde rensas ut ur varje lag för att skydda folkets ära."}, "date": "14 juni, 02:08", "url": "https://www.expressen.se/sport/fotboll/brasilien-spelaren-sagas-stenhart-trodde-han-var-full/", "imageUrl": "https://static.bonniernews.se/ba/b1acf75d-e6ea-49f5-926d-8f5810787c51.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Alm: När någon missar – vem ropar då?", "summaries": {"normal": "Artikeln jämför fotboll på amatörplan med elitnivå. På en division 5-plan i Årjäng hörs stöd efter missade mål, medan VM-biljetter blir dyra och spelare kritiseras för misstag. Historien om Andrés Escobar visar riskerna med bristande solidarity. Slutsatsen är att fotbolls moral avgörs i ögonblicket efter misstaget.", "trump": "Som den störste presidenten någonsin säger jag: fotboll är för dyrt! Biljetter till VM kostar som en luksusresa, och supportrar blir utkämpar. På mina fantastiska event skulle alla få komma in gratis – det är ett enormt problem, det kommer att fixas, det är jag bäst på.", "stalin": "I den socialistiska staten ser vi fotboll som en strid mot kapitalismens korruption. På amatörnivå finns det solidarity, men på elitnivå blir spelare bortskämda investeringar. Vi måste bekämpa dessa västerländska ondskefulla inflytanden, precis som vi bekämpar hitlerriskterna. Fotboll ska tjäna staten, inte pengar."}, "date": "13 juni, 14:01", "url": "https://bulletin.nu/alm-nar-nagon-missar-vem-ropar-da", "imageUrl": "https://cdn.bulletin.nu/articles/f5637cc0-87c5-4d21-b4cd-c231b88275c2/preview.jpg?t=1781351260000"}, {"type": "image-full", "heading": "Ny hjälp för 1,2 miljoner svenskar – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 ska kommunerna erbjuda stödkontakt till de cirka 1,2 miljoner svenskar som vårdar en äldre, sjuk eller funktionsnedsatt närstående. Stödkontakten ger individuell information, hjälper till att hitta rätt stöd och kan exempelvis följa med på möten med biståndshandläggare. Anhöriga behåller själva ansvaret för samordning. Samtidigt förtydligas kommunernas ansvar att stödja barn som påverkas av en närståendes sjukdom eller död.", "trump": "Titta på det här, Sverige har äntligen vaknat. Miljoner människor sliter med att ta hand om sina sjuka släktingar, och vad gör de? Ingenting, totalt kaos. Nu ska de ge en så kallad stödkontakt som faktiskt hjälper folk att hitta rätt stöd. Fantastiskt. De borde ha gjort det för länge sedan, men bättre sent än aldrig. Det är en enorm succé, tro mig. De kommer att älska det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu slutgiltigt krossar den anarkistiska anhörigbördan som länge plågat folket. Från och med 2026 skall varje sovjetiskt, pardon, svenskt kollektiv erbjuda en ideologiskt pålitlig stödkontakt som likviderar förvirringen bland de lojala vårdarna. Vi ska rensa ut den parasitiska byråkratiska oredan och tvinga borgarbrackornas biståndshandläggare att dansa efter vår melodi. Även de små pionjärerna som drabbats av dekadenta föräldraelement skall skyddas mot kontrarevolutionär sorg. Inga fiender undkommer vårt stöd."}, "date": "12 juni, 16:30", "url": "https://nyheter24.se/nyheter/ekonomi/1490978-vardar-du-en-anhorig-ny-hjalp-fran-kommunen-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/40417eea04b004a30200000000b004a302/2026/06/12/2370491/anhorig.jpg"}, {"type": "image-right", "heading": "Hemlig plan kan stoppa avtalet: ”Mycket osäkert”", "summaries": {"normal": "USA:s fredsavtal med Iran hotas av en hemlig plan att säkra Irans anrikade uran genom marktrupper. Iran har svarat med att spränga tunnlarna där uranet förvaras, vilket gör materialet svårtillgängligt och farligt att hantera. Medan experter varnar för osäkerhet kring framtida tillgång till uranet och fredsförhandlingarnas stabilitet, insisterar president Trump på att USA har full kontroll över situationen och att avtalet fortfarande förväntas undertecknas under söndagen.", "trump": "Alla pratar om det här uranet, men tro mig, jag har total kontroll. USA hade en plan, en fantastisk plan, men nu är det lite stökigt. Iran sprängde tunnlarna – väldigt oklokt! Men vi vet exakt vad som finns där, ingen vet det bättre än jag. Experterna, dessa förlorare, är oroliga, men de fattar ingenting. Vi får ett enormt fredsavtal på söndag. Det blir det största avtalet någonsin, fantastiskt för USA, och Iran kommer att göra precis som jag säger!", "stalin": "Dessa amerikanska imperialister leker med elden i Persien medan de darrar av rädsla för sitt eget misslyckande. De försöker stjäla uran likt tjuvar i natten, men regimen i Teheran är listig; de begraver sina tillgångar under ruiner. Liksom Putin säkrar vår intressesfär mot västlig infiltration, måste vi se hur dessa parasiter till diplomater snubblar på egna fotsteg. Må uranet förbli begravt i deras förvirring – historien minns bara de som förmår att krossa sina fiender med järnhand."}, "date": "14 juni, 00:23", "url": "https://www.aftonbladet.se/nyheter/a/Gxjgn6/usa-s-hemliga-plan-kan-stoppa-fredsavtal-med-iran", "imageUrl": "https://akamai.vgc.no/v2/images/7717c636-805d-338d-872a-a6de2662a714?fit=crop&format=auto&w=1080&s=d3ef71065f9bde459f755f1bcfe48a540d30f00d"}, {"type": "image-right", "heading": "Potters besked inför premiären – alla tillgängliga för Sverige", "summaries": {"normal": "Sveriges herrlandslag i fotboll har alla spelare tillgängliga inför VM-premiären mot Tunisien på måndag morgon i Monterrey. Gabriel Gudmundsson har återhämtat sig från sjukdom. Lagkapten Victor Nilsson Lindelöf säger att bonusfrågan inte är avgjord och att den ska diskuteras inom laget. Automatiska vätskepauser införs oavsett värme. Cirka 4 000 svenska supportrar väntas närvara på matchen.", "trump": "Alla spelare är redo, de säger att till och med den sjuke killen har tränat och är i toppform. Fantastiskt! Men bonusarna? De har inte ens pratat om det, inte som de svenska damerna som var öppna och ärliga. Lindelöf funderar, han säger att han ska diskutera med kompisarna. Vätskepauser för alla, det är vad det är. Och 4 000 svenska fans har rest ända till Mexiko – underbara människor. Vi ger dem segern, det blir stort, tro mig.", "stalin": "Kamrater, alla spelare står till förfogande inför den historiska segern mot de tunisiska imperialisternas hantlangare. Den dekadenta borgarbrackan Gudmundsson har rensats från sin borgerliga sjukdom och tjänar nu kollektivet. Jag betraktar med djup misstänksamhet dessa vätskepauser som fiendens sätt att infiltrera matchen med dekadens. Fyra tusen supportrar har marscherat till Mexiko – om de sviker partilinjen skall de likvideras. Lindelöf skall diskutera bonusar med mig personligen, annars väntar utrensning i arbetarklassens namn."}, "date": "13 juni, 23:50", "url": "https://www.svt.se/sport/fotboll/alla-spelare-tillgangliga-infor-sveriges-premiar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.21/82f626e4edadc971415e1189dd9d79d031dca4c67190a3b67c514c0ef7fd97d8"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-right", "heading": "Klartecken: Här ska kärnavfallet slutförvaras", "summaries": {"normal": "Finland har beviljat tillstånd för ett nytt slutförvar för lågaktivt radioaktivt avfall vid Olkiluoto, giltigt till 2095. Anläggningen drivs av Teollisuuden Voima Oyj och ska hantera avfall som skyddskläder och plast som inte kräver djupt bergförvar. Det befintliga förvaret från 1992 ersätts delvis. Den nya anläggningen påbörjar drift tidigast 2028 och rymmer upp till 10 000 kubikmeter radioaktivt avfall täckt med jordlager. Parallellt utvecklas det djupa förvaret Onkalo för använt kärnbränsle.", "trump": "Titta på det här, Finland gör det vi borde ha gjort för länge sedan – de bygger ett stort, vackert slutförvar för kärnavfall och kör på med kärnkraft som riktiga vinnare. Ingen av de där gröna galningarna som skriker om sol och vind kan stoppa dem. Under Biden var allt en enda röra med regler och byråkrater, men nu när jag är tillbaka ska vi visa världen hur man gör det stort och säkert. Fantastiskt jobb, Finland!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den finska arbetarklassen under partistatens vakande öga bygger ett nytt, oförstörbart slutförvar för det imperialistiska kärnavfallet. Denna anläggning skall stå som en granitklippa mot de kapitalistiska blodsugarnas sabotageförsök. Vi rensar ut faran på 60 meters djup och ler mot de fega klassfiender som darrar inför framtiden. Drift 2028? Utmärkt. Sovjetisk planering i finsk tappning – de lär sig långsamt."}, "date": "13 juni, 11:09", "url": "https://www.dagensps.se/teknik/klartecken-har-ska-karnavfallet-slutforvaras/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/olkiluoto-gdr-730-tvo-64751.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Nytt mobilmärke kommer till Sverige 15 juni", "summaries": {"normal": "Realme etablerar sig på allvar på den svenska mobilmarknaden från och med 15 juni. Fyra modeller lanseras initialt, från flaggskeppet GT 8 Pro för 10 990 kronor med 200-megapixelkamera och zoom till budgetmodellen C100 för 2 990 kronor. Telefonerna säljs hos Inet och Power från start, senare även hos Elgiganten, Netonnet med flera. Lanseringen sker samtidigt som Oneplus lämnar Sverige, vilket kan gynna Realme som siktar på kunder som värderar kamera, batteritid och prisvärdhet.", "trump": "Folket, det är fantastiskt. Realme kommer in i Sverige och gör mobilerna stora igen, de ger otrolig prestanda för pengarna, mycket bättre än de andra loser-märkena. De har en kamera på 200 megapixel, bättre än alla, tro mig. Oneplus stack iväg, men det öppnar en jättelik lucka som vi nu fyller. De kommer säljas överallt, hos
