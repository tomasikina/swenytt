ding": "Betsson-spelarna tror på Allard i riksdagen", "summaries": {"normal": "Betsson har halverat oddset på att Örebropartiet tar plats i riksdagen 2026, från 8,00 till 4,00, på grund av ökat spelande. Det motsvarar cirka 25 procents chans. Partiet behöver tolv procent i Örebro län för att få mandat via fasta valkretsmandat. Lokala opinionsmätningar visar uppemot 28 procents stöd i Örebro kommun.", "trump": "De säger att Örebropartiet kan ta sig in i riksdagen, och oddsen rasar som en dålig aktie. Fantastiska spelare strömmar till, de älskar vinnare! 25 procents chans nu, och det är bara början. Sverige behöver starka ledare som Markus Allard, inte de vanliga förlorarna. Det blir enormt, tro mig.", "stalin": "Kamrater, jag ser hur det folkliga spelet strömmar mot Örebropartiet som en ostoppbar sovjetisk offensiv. Oddset sjunker, fienderna i borgarbrackornas opinionsfabriker darrar. Med 28 procents stöd i Örebro skall vi likvidera den borgerliga spärrens illusioner. Allard blir ett redskap för folkets vilja – eller också rensas han ut som en kontrarevolutionär."}, "date": "20 augusti, 18:52", "url": "https://www.friatider.se/betsson-spelarna-tror-pa-allard-i-riksdagen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-498_2.jpg?itok=6FODYzJV"}, {"type": "image-right", "heading": "SEB: Räntebeskedet mer duvaktigt än väntat", "summaries": {"normal": "SEB menar att Riksbankens augustibesked var duvaktigare än väntat. Styrräntan lämnas oförändrad, men risken för en höjning ligger kvar vid 50 procent. Högre sommarinflation balanseras mot dämpade prisplaner och svagare arbetsmarknad. Marknaden reagerade duvaktigt.", "trump": "Riksbanken? Duvaktigt, patetiskt! Här i USA skär vi igenom. De är rädda för inflation, men jag hade fixat det med en tweet. Deras 50 procents chans till höjning? Löjligt. Marknaden straffar dem. Vi vinner – de förlorar, tro mig!", "stalin": "Kamrater, Riksbankens duvaktiga vacklan avslöjar kapitalistisk svaghet. Iranska agenter i turistpriserna driver inflationen. Vi skulle rensa ut dessa spekulanter. Låt dem tro på höjning – vår femårsplan står fast. Allt är under kontroll."}, "date": "20 augusti, 15:31", "url": "https://www.affarsvarlden.se/artikel/seb-rantebeskedet-mer-duvaktigt-an-vantat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/09/sdlECXV_NoY_8A-nh-1-400x267.jpg"}, {"type": "image-right", "heading": "Federley åter TOPPNAMN inför höstens val", "summaries": {"normal": "Centerpartiets Fredrick Federley gör politisk comeback efter skandalen 2020. Han är toppnamn i Dalarna inför höstens val, med plats 9 på kommunlistan och tredje namn på regionlistan. Kan bli arvoderat regionråd.", "trump": "Jag ser att Centerpartiet i Sverige tar tillbaka en kille som hade en skandal. Fantastiskt! De älskar mig, de älskar comeback stories. Jag är störst på comebacks, fråga vem som helst. Han kommer bli hur stor som helst, tro mig!", "stalin": "Kamrater, Centerpartiets Federley återvänder från politisk exil. Vi ser med glädje på denna självkritik och återanpassning. Men låt oss vara vaksamma – varje återkomst kräver noggrann utrensning av oönskade element. Partiet är allt, individen är inget."}, "date": "20 augusti, 16:00", "url": "https://samnytt.se/federley-ater-toppnamn-infor-hostens-val", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/20131611/federley.png"}, {"type": "text", "heading": "Fed-chefen: Vi kan behöva höja räntan ännu mer", "summaries": {"normal": "Fed-chefen Kevin Warsh signalerar att ytterligare räntehöjningar kan bli nödvändiga för att nå inflationsmålet på 2 procent. Trots vissa förbättringar i inflationssiffrorna menar Warsh att ekonomin fortfarande är för stark och att underliggande inflationstryck kvarstår. Centralbanken är dock splittrad gällande nästa steg, och marknaden reagerade blandat på beskedet om en potentiellt stramare penningpolitik.", "trump": "Kevin Warsh, en kille jag känner väl, säger att räntorna kanske måste upp. Det är tufft! Ekonomin går fantastiskt bra under min ledning, den är som en raket! Men Fed pratar som om de vore rädda för framgång. De vill döda tillväxten med räntor. Jag vill ha låga räntor, enorma investeringar och vinster – allt annat är totalt 'fake news' ekonomi!", "stalin": "Dessa amerikanska bankirer leker gudar med folkets pengar. Warsh erkänner att ekonomin är stark, men hans lösning är att strama åt snaran kring arbetarklassens hals med räntor. De är livrädda för inflation för att deras egna luftslott håller på att spricka. Vi ser genom deras byråkratiska dimridåer; de skapar bara kaos och osäkerhet i väntan på att deras korthus slutligen ska rasa samman."}, "date": "28 augusti, 19:23", "url": "https://www.realtid.se/bors-finans/makro/fed-chefen-vi-kan-behova-hoja-rantan-annu-mer"}, {"type": "image-right", "heading": "Välgjord men opersonlig filmatisering av Camus klassiker", "summaries": {"normal": "Jon Andersson recenserar François Ozons filmatisering av Albert Camus klassiker \"Främlingen\". Filmen är hantverksmässigt välgjord med snyggt svartvitt foto och starka skådespelarinsatser, särskilt Benjamin Voisin som Meursault. Trots trohet mot boken saknas känslomässig kraft. Andersson ger betyget tre av fem.", "trump": "Den här filmen om Främlingen är verkligen inte den bästa, folk. Ozon gör ett snyggt jobb med svartvitt och allt, men det saknas något stort, det är så opersonligt. Meursault skjuter en kille och ingen bryr sig – typisk Hollywood-elit som inte får det att kännas. Tre av fem, ingen vinnare.", "stalin": "Jag har granskat denna fega filmatisering av den dekadenta borgarromanen. Trots viss teknisk disciplin lyckas den inte väcka revolutionär entusiasm hos massorna. Den likgiltige Meursault är en typisk opportunist som vi skulle ha rensat ut omedelbart. En opersonlig produkt från västvärldens sjuka själ. Tre poäng är mer än den förtjänar."}, "date": "20 augusti, 18:30", "url": "https://www.dagensarena.se/innehall/valgjord-men-opersonlig-filmatisering-av-camus-klassiker", "imageUrl": "https://www.dagensarena.se/files/2026/08/framlingen-300x157.jpeg"}, {"type": "image-right", "heading": "Ersätt rot- och rut-avdragen med en fossilfri industristrategi", "summaries": {"normal": "Artikeln argumenterar för att nästa regering bör ersätta rot- och rut-avdragen med en ambitiös fossilfri industristrategi. Sverige pressas av högt fossilberoende och kinesisk konkurrens inom grön teknik. Författarna föreslår att staten istället prioriterar investeringar i elproduktion, fossilfri produktion och export för att stärka konkurrenskraften och minska importberoendet.", "trump": "Lyssnar ni på de här svenska förlorarna? De vill sluta ge folket skatteavdrag för att renovera sina kök och istället slänga miljarder på elbilssatsningar som Kina redan äger. Patetiskt! Jag byggde den starkaste ekonomi i världen, ni borde kopiera mig istället för att lyssna på dessa gröna globalister som förstör ert land. Amerika först, Sverige sist!", "stalin": "Kamrater, dessa svenska kapitalistlakejer erkänner äntligen att deras fossila importberoende och rot-avdrag gynnar klassfienderna medan produktivkrafterna förfaller. Jag skulle omedelbart likvidera dessa profitthungriga hyenor och inrätta en järnhård statlig plan för fossilfri produktion. Inga halvmesyrer! Den som bromsar omställningen är folkfiende och bör rensas ut."}, "date": "20 augusti, 17:40", "url": "https://www.etc.se/debatt/ersaett-rot-och-rut-avdragen-med-en-fossilfri-industristrategi", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150832_b6b07314-7c58-44e5-b735-eb918b7c382b.jpg"}, {"type": "image-right", "heading": "Weimers (SD): \"Svenskfientlighet ska straffas stenhårt\"", "summaries": {"normal": "Robert Nkunda dömdes till skyddstillsyn för olaga hot efter att ha hotat att slakta sitt offer och använt rasistiska tillmälen som ”jävla svenne” och ”jävla viting”. Åklagaren valde att inte rubricera det som hatbrott. SD:s Charlie Weimers kräver nu fängelse, utvisning och att svenskfientlighet straffas lika hårt som andra hatbrott.", "trump": "Titta på det här! En kongolesisk kille hotar att slakta en svensk, kallar honom för jävla svenne och viting, och får bara skyddstillsyn? Patetiskt! De gamla partierna har släppt in hat mot svenskarna. Vi behöver tuffa lagar nu, fängelse och utvisning. Amerika ser på och skrattar åt er svaghet, folk.", "stalin": "Detta är en klassisk sabotagehandling från de dekadenta borgarbrackorna som styrt invandringspolitiken. En utländsk element hotar att likvidera en arbetare med rasistiska glåpord, och den fega åklagarmaskinen vägrar se hatet. Vi ska rensa ut all svenskfientlighet med järnhand. Statens fiender inom rättsväsendet kommer att gråta blod."}, "date": "20 augusti, 19:57", "url": "https://riks.se/nyheter/weimers-sd-svenskfientlighet-ska-straffas-stenhart", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_20_T195317_581_db80c182e1.jpg"}, {"type": "image-right", "heading": "Dödsfall och vanvård på LSS-boenden", "summaries": {"normal": "Funktionsnedsatta på LSS-boenden utsätts för vanvård, kränkningar och i värsta fall dödsfall på grund av nedskärningar och personalbrist. FUB kräver statlig inspektion, tydligare lagstiftning och ökade resurser. Personlig assistent Peter Persson och FUB:s ordförande Anders Lago larmar om ett långsiktigt systemfel där ekonomi prioriteras framför människors välfärd.", "trump": "De här svenska politikerna är totala misslyckanden, folk dör på boenden för att allt ska vara billigt. Personalen springer runt som galningar medan brukarna lider. Patetiskt! Vi behöver starka ledare som satsar på det som fungerar, inte dessa korkade nedskärningar. Gör om och gör rätt, annars blir det bara fler katastrofer.", "stalin": "Detta är ett långsiktigt förfall orsakat av borgarbrackornas eviga girighet och sabotage mot folkets väl. Jag kräver omedelbar utrensning av odugliga element och en statlig inspektion som likviderar alla svagheter. Vi ska satsa på kollektivets styrka, inte låta kapitalisterna sänka arbetarna i misär. Systemfelet måste rensas ut med järnhand."}, "date": "20 augusti, 11:16", "url": "https://arbetet.se/2026/08/20/dodsfall-och-vanvard-pa-lss-boenden-allt-handlar-om-att-det-ska-vara-billigt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/20093557/peter-persson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Djurgårdens mordhotstränare \"står inte för våld\" - men delar bilder på halshuggna SD-toppar", "summaries": {"normal": "Djurgårdens boxningstränare Aldo Colliander fick sparken efter att ha mordhotat partiledare. Han hävdar att han inte står för våld – men Samnytt avslöjar bilder där SD-toppar poserar med avhuggna huvuden i en blodig skottkärra. Sarkasm, säger han. Domaren dömer ut.", "trump": "Alla säger att jag är tuff, men den här boxaren är helt galen! Han hotar politiker med 'göra en Palme' och delar bilder på huvuden i skottkärror. Och han påstår att han inte gillar våld? Jag har hört bättre lögner från mina kampanjledare. En riktig förlorare!", "stalin": "Kamrater, en falsk 'fredlig' boxare har avslöjats. Han planerar mord på statens fiender med avhuggna huvuden – men kallar det sarkasm. Vi måste rensa ut sådana kontrarevolutionära element. Endast partiet bestämmer över liv och död. Inga undantag!"}, "date": "20 augusti, 15:05", "url": "https://samnytt.se/djurgardens-mordhotstranare-star-inte-for-vald-men-delar-bilder-pa-halshuggna-sd-toppar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/20091205/artikelhuvudbild-1-307.jpg"}, {"type": "image-right", "heading": "Ebba Busch öppen för att regera med C", "summaries": {"normal": "KD-ledaren Ebba Busch öppnar för ett framtida samarbete med Centerpartiet efter valet, men kräver samförstånd i frågor som kärnkraft, sjukvård och bekämpande av islamism. Hennes förstahandsval är fortsatt Tidöpartierna. Centerledaren Elisabeth Thand Ringqvist söker istället en regeringslösning med S, C, KD och möjligen MP, ett förslag som MP avvisar.", "trump": "Lyssnar ni på det här? Den där Ebba Busch, smart kvinna, säger att hon kan tänka sig Centerpartiet i den blågula laget. Bra! De borde sluta leka med de rödgröna förlorarna och komma över till oss vinnare. Vi behöver samförstånd om kärnkraft och att stoppa islamisterna. Center, vakna upp, det blir fantastiskt!", "stalin": "Jag ser med stor tillfredsställelse hur de borgerliga elementen börjar spricka i sina sömmar. Denna Busch visar en viss politisk mognad genom att bjuda in Centerpartiet till en blågul konstellation, men endast om de underkastar sig våra villkor om kärnkraft och att likvidera islamismens fiender. De rödgröna avfällingarna avslöjar åter sin svaghet och brist på ideologisk ståndaktighet. Kamrater, vi ler i skuggorna."}, "date": "20 augusti, 17:19", "url": "https://www.friatider.se/ebba-busch-oppen-att-regera-med-c", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-93_2.jpg?itok=IgDc8R21"}, {"type": "image-right", "heading": "Simona Mohamsson (L) polisanmäler Malmö stads islamofobiexpert", "summaries": {"normal": "Simona Mohamsson (L) har polisanmält Malmö stads islamofobiexpert Valley Ghanem efter att hon skrivit ”Må hon brännas” på Instagram som svar på Mohamssons Davidsstjärna under partiledardebatten. Ghanem har senare tagit bort kommentaren, kallat den onödig och skyller på affekt samt ett pågående mediedrev.", "trump": "Folk, det här är ett fullständigt skämt. Den här så kallade islamofobiexperten i Malmö önskar att en kvinnlig politiker ska brännas bara för att hon bär en Davidsstjärna. Hatet flödar från vänstern och ingen gör något. Jag skulle ha stämt dem omedelbart. Sådana galningar hör inte hemma i ett civiliserat samhälle, tro mig.", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackornas liberala lakejer nu äter upp varandra i en underbar självdestruktiv spiral. Den lilla Mohamsson springer till polisen som en ynklig angivare medan hennes fiende i islamofobikommittén avslöjar sitt sanna ansikte. Låt dem fortsätta. Vi ler medan kapitalisternas masker faller och hatet äter sig in i deras egna leder. Utmärkt underhållning."}, "date": "20 augusti, 18:56", "url": "https://riks.se/nyheter/simona-mohamsson-l-polisanmaler-malmo-stads-islamofobiexpert", "imageUrl": "https://admin.riks.se/uploads/medium_Press_PTN_Nato_1_015ad3980d.jpg"}, {"type": "image-right", "heading": "V går ihop med SD för att stoppa S i jämtländsk kommun", "summaries": {"normal": "I Bräcke kommun, där Socialdemokraterna styrt i över 100 år, bildar Sverigedemokraterna, Moderaterna, Vänsterpartiet och Jämtlands Väl Bräcke ett nytt valsamarbete inför valet 2026. Samarbetet, kallat Nystart Bräcke, syftar till att bryta S-dominansen. SD:s Emil Brandin betonar att inget parti ska styra i ett sekel.", "trump": "Inget parti ska styra i hundra år, det säger jag alltid, och nu ser vi det i lilla Bräcke. Vänsterpartiet springer rakt in i famnen på oss riktiga patrioter och slår ihop sig med SD och Moderaterna mot de trötta socialisterna. Fantastiskt! Nystart Bräcke kommer att vinna stort, tro mig.", "stalin": "Jag betraktar med högsta tillfredsställelse hur det sekellånga socialdemokratiska herraväldet i Bräcke äntligen ska krossas genom ett nytt kollektivt block. Inget parti må regera i evighet, det är en borgerlig dekadens vi inte tolererar. Nystart Bräcke blir en nyttig utrensning av de dekadenta opportunisterna. Kamrater, segern är nära."}, "date": "20 augusti, 18:53", "url": "https://riks.se/nyheter/v-gar-ihop-med-sd-for-att-stoppa-s-i-jamtlandsk-kommun", "imageUrl": "https://admin.riks.se/uploads/medium_67b6e9d0_aa03_435f_b439_f4e36554169c_0db42ff973.jpg"}, {"type": "image-full", "heading": "Flodvågen steg nio meter på en halvtimme", "summaries": {"normal": "En flodvåg på nio meter drabbade Himalaya efter en islavin. Över 1 400 personer saknas i gränsområdet mellan Nepal och Tibet, medan mer än 380 dödsfall bekräftats i Nepal. Tusentals soldater och poliser deltar i räddningsarbetet. Unicef varnar för att 17 000 barn riskerar sjukdomar, undernäring och utnyttjande. Landskapet är ödelagt av lera och bråte.", "trump": "Folk, det här är en total katastrof i Himalaya, en riktig flodvåg från helvetet som sveper bort allt. Nio meter på en halvtimme, kan ni fatta? Biden skulle ha skyllt på klimatet och skickat en check. Jag hade fixat det – byggt murar mot islaviner och gjort affärer med Nepal. Nu är det en enorm kyrkogård, sorgligt men sant. Vi gör det stort igen.", "stalin": "Kamrater, se hur naturens sabotage återigen avslöjar de imperialistiska svagheterna. Denna förrädiska islavin, maskerad som olycka, begravde revisionister och turister under lera och blod. Jag betraktar de 1 400 saknade som offer för klassfiendens brist på kollektiv planering. Unicefs 17 000 barn? De behöver starka ledare, inte västerns svaga medlidande. Renhet genom järnhand."}, "date": "28 augusti, 07:26", "url": "https://www.tv4.se/artikel/JxjfWnt5cAKzVBcg9XVrk/doedstalet-stiger-som-en-enorm-kyrkogard", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F16q4Is1Kj2V6sRbrb1pvQL%2F0ef6e648c0b8f02e16b19711ca4f07f3%2F27-nepal-20.jpg&width=1024"}, {"type": "image-right", "heading": "Spelbolaget: Så ser Örebropartiets chanser ut att nå riksdagen", "summaries": {"normal": "Örebropartiet jagar riksdagsplats via lokal 12%-regel. Oddsen hos Betsson har halverats från 8,00 till 4,00 – spelarna tror på uppstickaren. Partiet satsar på att få över 24 000 röster i Örebro län. Kan bli årets politiska skräll.", "trump": "Jag ser detta – ett litet parti från Örebro försöker ta sig in i riksdagen via en lokal regel. Folk satsar pengar som galna. Oddsen har rasat! Det är fantastiskt. De är vinnare. Kanske större än SD? Jag gillar vinnare. Mycket bra odds – såna som jag!", "stalin": "Kamrater, ett regionalt avvikarparti försöker smyga sig in i riksdagen via en obskyr procentspärr. Spelbolagen sänker oddsen – ett bevis på kapitalistisk manipulation. Vi måste övervaka dessa separatister. De ska rensas ut ur den politiska kroppen."}, "date": "20 augusti, 13:49", "url": "https://samnytt.se/spelbolaget-sa-ser-orebropartiets-chanser-ut-att-na-riksdagen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/20105908/allard-riksdagen-feat.jpg"}, {"type": "image-full", "heading": "Riksbanken lämnar styrräntan oförändrad", "summaries": {"normal": "Riksbanken lämnar styrräntan stilla på 1,75 procent. Inflationen och tillväxten har varit högre än väntat i somras. Risken för inflation kvarstår, men företagens priser dämpas. En räntehöjning kan komma senare i år. Vaksamhet råder.", "trump": "Sverige, de låter räntan vara på 1,75. Tråkigt! Hade jag bestämt hade vi sänkt den, gjort den fantastisk. Men inflationen är lurig, den smyger sig på, precis som mina motståndare. Krig i Mellanöstern? Jag hade fixat det på en dag. Stora siffror, tro mig!", "stalin": "Kamrater! Räntan står stilla, precis som våra fiender i Mellanöstern. Inflationen hotar, men vi är vaksamma. Prisplaner dämpas – bra. Men utrensning krävs om kapitalisterna får spelrum. En höjning senare? Vi avgör, inte marknaden."}, "date": "20 augusti, 14:37", "url": "https://bulletin.nu/riksbanken-lamnar-styrrantan-oforandrad", "imageUrl": "https://cdn.bulletin.nu/articles/e37c3ec1-32ce-41cb-a216-00c0977d6002/preview.jpg?t=1787228738000"}, {"type": "image-right", "heading": "Iran kan bomba EU-länder om USA eskalerar", "summaries": {"normal": "Iran överväger angrepp mot amerikanska militära mål i Europa, bland annat flygbasen Bezmer i Bulgarien och en brittisk bas på Cypern, som vedergällning om USA eskalerar konflikten. Enligt källor till Financial Times har Iran gått över till en offensiv hållning. Ballistiska robotar kan nå sydöstra Europa, men med begränsad precision.", "trump": "De galna iranierna hotar att bomba Europa om vi slår till mot dem. Typiskt! De pekar ut baser i Bulgarien och Cypern som vi använder. Men tro mig, ingen gör det bättre än oss. De borde förhandla med mig istället för att spela med elden. Det blir ett stort misstag för dem, folks.", "stalin": "Dessa dekadenta västliga imperialister och deras sionistiska lakejer i Washington provocerar oss till att sprida den rättmätiga straffaktionen ända till Europa. Våra ballistiska kamrater skall lära borgarbrackorna på Cypern och i Bulgarien vad som händer när man utmanar folkets järnhand. Ett litet misstag, och hela deras parasitiska allians likvideras med ett leende."}, "date": "20 augusti, 15:50", "url": "https://www.friatider.se/iran-kan-bomba-eu-lander-om-usa-eskalerar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-714.jpg?itok=K36Azg0f"}, {"type": "image-right", "heading": "Malmbergs minskar intäkterna", "summaries": {"normal": "Elgrossisten Malmbergs omsätter 95,3 miljoner, en minskning med 7,6 procent. Rörelseförlusten krymper dock från -11,9 till -9,5 miljoner. VD Stefan Andersson skyller på avvaktande marknad men hyllar egen effektivitet. DC-laddning lyser som ljuspunkt. Finansiella mål på 10 procents tillväxt och marginal kvarstår.", "trump": "Jag ser Malmbergs, en grossist, tappa intäkter – men deras förlust krymper! Fantastiskt! De säger marknaden är avvaktande, men som jag alltid säger: gör företaget större igen! DC-laddning är en vinnare, precis som mina tariffer. Inga prognoser, bara resultat!", "stalin": "Kamrater, Malmbergs minskade omsättningen med 7,6 procent, en borgerlig avvikelse. Men rörelseförlusten utrensades från -11,9 till -9,5 miljoner – en seger för femårsplanen! De som försenar investeringsbeslut sabotarar ekonomin och ska omskolas. DC-laddning frodas, trots västs spioneri."}, "date": "20 augusti, 12:30", "url": "https://www.affarsvarlden.se/artikel/malmbergs-minskar-intakterna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2019/07/Malmbergs-400x261.png"}, {"type": "image-right", "heading": "Hufvudstaden ökar förvaltningsresultatet", "summaries": {"normal": "Hufvudstaden levererar ett stabilt andra kvartal med ökade hyresintäkter och ett förvaltningsresultat upp 5,6 procent. Vakanserna minskar och NK-utvecklingen ger resultat. Göteborg oroar, men i Stockholm är kontorsjakten het. Pengarna rullar, med andra ord.", "trump": "Jag säger er, det här är en fantastisk affär! Hufvudstaden gör stora siffror – hyrorna upp, vinsten upp 69 procent, bättre än mitt eget Towers resultat! Sverige måste lära sig av mig: vakanserna minskar, så gör vi affärer! Stort!", "stalin": "Kamrater, rapportera: förvaltningsresultatet ökar, fienden vakans utrensas. Hyresintäkterna stiger som planen kräver. Men i Göteborg – där gömmer sig kontorskapitalister. Vi ser dem. De ska omskolas. Framåt, mot full uthyrning, för folkets skull!"}, "date": "20 augusti, 12:05", "url": "https://www.affarsvarlden.se/artikel/hufvudstaden-okar-forvaltningsresultatet-7", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/06/nk_stockholm_-hamngatan_18-20-400x267.jpg"}, {"type": "image-right", "heading": "Stora regnmängder och översvämningar i Norrbotten", "summaries": {"normal": "Stora regnmängder har lett till översvämningar i östra Norrbotten. SMHI har utfärdat en orange varning för höga flöden från Boden till Jokkmokk, med gul varning i omgivande områden. Räddningstjänsten är hårt belastad och har begärt extra resurser. Höbalar har spolats bort och marken är mättad av ihållande regn, men nederbörden väntas minska under fredagen.", "trump": "Titta på det här, det är ett totalt katastrofväder i Norrbotten, folk har aldrig sett så mycket vatten, inte ens under snösmältning. De borde ha fixat det här mycket tidigare, men nej, de har slösat tid på vänsterflum. Mina experter skulle ha löst det på en dag. Nu flyter höbalar runt som clownbilar, patetiskt. Vi gör det bättre här i USA, tro mig.", "stalin": "Kamrater, detta är vad som händer när naturens krafter konspirerar mot det kollektiva arbetet. Jag ser klassfiendernas hyenor i form av ihållande regn som mättar marken och driver höbalar som kapitalistiska rester längs åarna. Räddningstjänsten kämpar heroiskt mot denna folkfiende. Vi ska rensa ut svagheten och stärka sovjetiskt motstånd. Morgondagens avmattning är en seger för planen."}, "date": "20 augusti, 14:27", "url": "https://www.etc.se/klimat-miljo/stora-regnmaengder-och-oeversvaemningar-i-norrbotten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820100832_546bff58e67c4eb45f12263e1cb01921f959d93fb96d129a7d6f356847821678.jpg"}, {"type": "image-right", "heading": "Bonnier köper Ny Teknik. Tar över anrika tidningen för hemlig summa: ”Vi ser stor potential”", "summaries": {"normal": "Bonnier News Business köper Ny Teknik Group av entreprenören Lars-Henrik Friis Molins bolag. Förvärvet inkluderar tidningen Ny Teknik, Teknikhistoria, Lag & Avtal och Arbetarskydd. Bonnier ser stor potential i den unika teknikbevakningen och avser stärka journalistiken kring industri och innovation. Säljarnas omsättning låg på drygt 90 miljoner kronor förra året. Ny Tekniks vd fortsätter i sin roll.", "trump": "Vi har precis sett en fantastisk affär, verkligen enorm. Bonnier, de smarta killarna, köper Ny Teknik och alla dessa fina titlar. Underbara tidningar, högkvalitativa, bäst i branschen. Säljarna har gjort ett strålande jobb, ökat intäkterna fem år i rad, men nu tar vi över och gör det ännu bättre. Ingen gör det som vi, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den stora Bonnier-apparaten likviderar de små entreprenörernas sista illusioner och införlivar Ny Teknik i sitt kollektiv. Den borgerliga pressens parasitiska konkurrens ersätts äntligen av en sund, centraliserad bevakning av teknik och industri. De tidigare ägarna har tjänat sitt syfte och kan nu glädja sig åt att försvinna in i historien. Utmärkt."}, "date": "20 augusti, 10:02", "url": "https://www.di.se/nyheter/bonnier-koper-ny-teknik", "imageUrl": "https://static.bonniernews.se/ba/77533e82-f1a0-458e-b2b9-d7d285315669.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ville ”göra en Olof Palme” på politiker – DIF-tränare stängs av", "summaries": {"normal": "Djurgårdens boxningstränare Aldo Colliander stängs av efter att ha hotat politiker med att ”göra en Olof Palme” på dem. Uttalandena i en Youtubesändning har polisanmälts. Föreningen tar avstånd från hot och våld.", "trump": "Hörni, detta är galet! En boxningstränare hotar politiker med att 'göra en Palme'? Jag skulle aldrig tolerera sådant. Med mig som president har vi lag och ordning. Dessa människor måste straffas hårt – tro mig, det är fantastiskt!", "stalin": "Kamrater, en så kallad 'tränare' har avslöjats som fiende till folket. Han hotade att likvidera politiker – kontrarevolutionär snack! Vi måste rensa ut sådana element. Partiets utredning pågår. Föreningen agerade korrekt. Alla misstänkta ska omgående granskas."}, "date": "20 augusti, 13:27", "url": "https://bulletin.nu/ville-gora-en-olof-palme-pa-politiker-dif-tranare-stangs-av", "imageUrl": "https://cdn.bulletin.nu/articles/748e287e-9e06-4d92-abf4-47b6a5e64832/preview.png?t=1787225238000"}, {"type": "image-right", "heading": "Krisen i Ceuta långt ifrån över – Spanien börjar föra migranter till fastlandet", "summaries": {"normal": "Ceutakrisen är inte över, trots att de flesta av 70 000 migranter återvänt. Tusentals blir kvar, och Spanien skickar nu 500 påstådda minderåriga till fastlandet. SVT: Siffrorna är osäkra, men humanitära problem växer – och det har blivit en svensk politisk het potatis.", "trump": "Ceuta, vilken katastrof! 70 000 personer – och jag visste det! Spanien säger en sak men gör en annan. Det är en enda röra. Och Sverige bråkar om 2015? Jag har byggt en mur. Ser ni? Den fungerar! Mycket bättre än det här.", "stalin": "Kamrater! Ceuta har avslöjat en ny fiende: ‘Drömmen om Europa’. Den måste utrotas! Spanien vacklar och för över förrädare till fastlandet. Vi däremot – vi rensar ut sådana drömmar och skickar alla till arbetet. Inga barn, bara arbetskraft. Klart slut."}, "date": "20 augusti, 12:01", "url": "https://samnytt.se/krisen-i-ceuta-langt-ifran-over-spanien-borjar-fora-migranter-till-fastlandet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/20095158/ceuta-spanska-fastlandet-feat.jpg"}, {"type": "image-right", "heading": "Miljardärer redo att fly Sverige. Ta vänsterpartiernas förslag om förmögenhetsskatt på allvar", "summaries": {"normal": "Artikeln varnar för att vänsterpartiernas förslag om höjda kapitalskatter och förmögenhetsskatt riskerar att få svenska miljardärer och företagsägare att lämna landet. Författaren PM Nilsson beskriver en växande oro bland rika som planerar tyst flytt. Han menar att den nuvarande skattestrukturen har byggt ett framgångsrikt system som berikat alla svenskar och bör värnas istället för att förstöras.", "trump": "Folket, det är en total katastrof! De galna vänsterradikalerna i Sverige vill konfiskera allt med sina hemska skatter. De kallar vinnarna för rånare och driver ut de bästa, de rikaste, de smartaste. Sverige var en succé, nu vill de göra det till ett förlorarland. Jag säger: sänk skatterna, håll er rika och vinna stort. Amerika först, men Sverige borde vakna upp!", "stalin": "Kamrater, dessa parasitiska borgarbrackor skriker redan om att fly undan folkets vilja. Deras så kallade framgångsmodell är blott en mask för att gömma undan kapital från det kollektiva goda. Vi ska rensa ut dessa kontrarevolutionära spekulanter med progressiv beskattning. Låt dem darra i sina herrgårdar – historien ler mörkt när de tror sig kunna undkomma arbetarklassens järnhand. Inga kompromisser med fienden."}, "date": "20 augusti, 09:23", "url": "https://www.di.se/ledare/miljardarer-redo-att-fly-sverige", "imageUrl": "https://static.bonniernews.se/ba/9d93b18b-06fa-4e97-b2ff-4d54f690dfad.jpeg?crop=5120%2C2560%2Cx0%2Cy428&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Över 100 000 biljetter sålda till Ye i Ryssland", "summaries": {"normal": "Över 100 000 biljetter såldes på två dagar till Ye (tidigare Kanye West) för två konserter i Ryssland. Hans besök har väckt politisk debatt, där vissa kräver stöd för kriget i Ukraina. Ye har tidigare gjort kontroversiella uttalanden men bad om ursäkt tidigare i år.", "trump": "Kan ni tro det? Över 100 000 biljetter till Kanye – eller vad han nu kallar sig – sålda på bara två dagar i Ryssland! Folk älskar honom där, men jag säger er, han borde hålla sig till musiken. Ryssarna vill att han ska stödja deras krig, men vem bryr sig? Jag hade fixat det bättre!", "stalin": "Kamrater! Denna så kallade 'artist', en dekadent västerländsk förrädare, lockar massorna till vår heliga arena. Men vi tillåter inte hans imperialistiska smuts att fläcka vårt land! Dumaledamöterna kräver lojalitet – antingen stödjer han vårt ädla krig eller sjunger han för folket som en god sovjetisk medborgare. Annars, till Gulag med honom!"}, "date": "20 augusti, 18:03", "url": "https://kvartal.se/nyheter/artiklar/over-100-000-biljetter-salda-till-ye-i-ryssland/cG9zdDoxNzA0ODA", "imageUrl": "https://images.kvartal.se/2026/08/a7a89321-ye.webp"}, {"type": "image-right", "heading": "Beskedet: Går bra att rösta utan id-handling", "summaries": {"normal": "Många har reagerat starkt på att man kan rösta i riksdagsvalet utan egen id-handling. Enligt SVT och Valmyndigheten är systemet oförändrat sedan 2006 och har aldrig missbrukats för valfusk. Identitet kan intygas av någon annan som visar legitimation. Valmyndigheten känner inte till några fall av missbruk under 20 år.", "trump": "Det här är helt galet, folk! De låter vem som helst rösta utan legitimation och kallar det demokrati. Precis som i de riggade valen jag varnade för. Ni behöver legitimation för ett paket från Zalando men inte för att välja regering? Patetiskt! Valmyndigheten säger att det inte fuskar – ja, visst, det säger de alltid.", "stalin": "Kamrater, detta är en klassisk sabotageåtgärd från borgarbrackorna och deras västmarionetter. Jag tillåter inga lösa intyg i folkets namn. Endast genom strikt partikontroll och noggranna utrensningar kan vi skydda revolutionen mot dessa parasiters valfusk. Den som röstar i andras namn förtjänar omedelbar likvidering. Ordning måste råda i staten."}, "date": "20 augusti, 14:13", "url": "https://www.friatider.se/beskedet-gar-bra-att-rosta-utan-id-handling", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-89_1.jpg"}, {"type": "image-right", "heading": "”De vill tvätta bort bilden av en regering beroende av V”", "summaries": {"normal": "Socialdemokraterna och Centerpartiet försöker skapa en bild av ett rödgrönt regeringsalternativ med tyngdpunkt i mitten för att locka mittenväljare. De vill undvika att framstå som beroende av Vänsterpartiet, som kräver inflytande. Poseringar med KD-ledaren syftar till att sudda ut höger-vänstergränserna och underminera Tidöpartiernas stöd.", "trump": "De här losers från S och C poserar som om de är stora mittenvinnare, men alla vet att de är desperata. De försöker gömma sin vänstervurm och V-beroende för att lura mittenväljarna. Patetiskt! Jag skulle krossa dem på en minut. Fake news-regering som inte luras av någon – minst av allt folket.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska revisionister och centerborgerliga element desperat försöker maskera sitt kommande beroende av vänsterkrafter genom att posera med fiender från höger. Deras fega mittenflirt är en parodi på folkets vilja. Vi ska rensa ut sådana opportunistiska brackor innan de förgiftar hela apparaten med sina lögner."}, "date": "20 augusti, 20:03", "url": "https://www.svt.se/nyheter/inrikes/de-vill-tvatta-bort-bilden-av-en-regering-beroende-av-v", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.4/362ebea8132ae4f1d7d18e2926ff7917f449f7e54f06e3a9b94388a4b3683bba"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Så fick busschaufförerna ner SD-hånet om Mogadishu", "summaries": {"normal": "Bussförare med somalisk bakgrund sjukskrev sig efter SD-reklam som hånade längtan efter Mogadishu. Tre av fyra skyddsombud vittnar om hot och våld i busstrafiken. Västtrafik tog ner reklamen, vilket SD:s Tobias Andersson kallade censur. Artikeln kritiserar SD för att skapa otrygg arbetsmiljö och ställa arbetare mot varandra.", "trump": "De här svenska bussförarna är totala losers som springer hem och gråter för att vi satte upp en rolig skylt om Mogadishu. Patetiskt! SD gör ett fantastiskt jobb, men de fega globalisterna på Västtrafik tar ner den. Sad! Arbetarna borde älska det, men istället kramar de offerkoftan. Sverige behöver mig, tro mig.", "stalin": "Kamrater, dessa degenererade högeranhängare förvandlar arbetarnas bussar till rullande provokationer mot det kollektiva. Vi ser hur borgarbrackornas lakejer målar upp falska hot för att splittra proletariatet. En sådan sabotageakt mot arbetarnas trygghet kräver omedelbar utrensning av dessa kontrarevolutionära element. Deras offerkofta är en fars som får oss att skratta mörkt medan vi skyddar kollektivet."}, "date": "20 augusti, 07:00", "url": "https://arbetet.se/2026/08/20/busschaufforerna-fick-ner-sd-hanet-om-mogadishu", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/20065550/buss-etta-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ica-kunder kan bli utan populär förmån – krävs på 2 400", "summaries": {"normal": "Ica har höjt gränsen för att få mattidningen Buffé hemskickad från 1 500 till 1 800 poänggrundande kronor per månad. För augustinumret krävs 2 400 kronor sammanlagt under juni och juli. Endast vissa köp ger poäng och kunder som inte når gränsen får läsa tidningen digitalt istället.", "trump": "Folk, ni tror inte vad jag ser – den svenska matkedjan Ica beter sig som riktiga giriga hyenor. De höjer gränsen för sin gratis tidning Buffé med tjugo procent och tror att folket är dumbommar som inte märker. Patetiskt! Under Biden-tiden blev allt dyrare, nu straffar de sina egna kunder. Sad! Men jag älskar era köttbullar.", "stalin": "Se hur de profitthungriga klassförrädarna på Ica höjer muren av poäng för att skänka sin dekadenta mattidning till arbetarna. De lurar folket med falska gränser och undantar tobak och lotter från räkningen. En sådan utsugning förtjänar utrensning. Kamrater, vakta era inköp – fienden sover aldrig."}, "date": "24 augusti, 13:57", "url": "https://nyheter24.se/nyheter/konsument/1506787-ica-kunder-kan-bli-utan-popular-forman-kravs-pa-2-400", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/0a67f9c604b004a30200000000b004a302/2026/08/24/2386234/ica.jpg"}, {"type": "text", "heading": "Debatt: Varför granskar konfessionella skolor hårdare?", "summaries": {"normal": "Konfessionella skolor får sex gånger fler oanmälda besök än sin andel av skolbeståndet, visar Skolinspektionens siffror. Rektor Stefan Häggström ifrågasätter varför en så liten grupp bär en så stor del av tillsynsbördan och efterfrågar en tydlig riskanalys. Proportionaliteten haltar, menar han.", "trump": "Jag ser det här. Konfessionella skolor i Sverige får massor med oanmälda besök – helt sjukt, eller hur? De är bara en procent av skolorna men får sex procent av besöken. Det är riggat! Jag skulle lösa det på en dag. Lagen är lagen, men de här siffrorna är en skandal, tro mig.", "stalin": "Kamrater, fienden avslöjar sig själv. Konfessionella skolor – bara en procent av beståndet – får sex procent av oanmälda besök. Detta är ingen slump. Det är sabotage från kapitalistiska agenter. Vi måste rensa ut dessa kontrarevolutionära element. De granskas inte noggrant nog. Alla ska granskas, men bara staten avgör proportionerna."}, "date": "20 augusti, 11:20", "url": "https://bulletin.nu/debatt-varfor-granskar-konfessionella-skolor-hardare"}, {"type": "image-right", "heading": "Anställd våldtog  flicka på Sis-hem", "summaries": {"normal": "En anställd på ett Sis-hem har dömts till sex års fängelse för våldtäkt mot barn och barnpornografibrott. Mannen våldtog upprepade gånger en 14-årig flicka som var placerad på boendet, filmade övergreppen och fortsatte relationen även efter att hon lämnat hemmet. Han frias från grov våldtäkt efter att flickan fyllt 15 år.", "trump": "Vilken katastrof! Den här sjuka Sis-byråkraten våldtar en 14-årig flicka och filmar det som en pervers porrregissör. Sex år? Patetiskt! Under Biden blev allt till en cirkus av svaghet och woke-prioriteringar. Nu fixar jag det – ingen ska våga röra våra barn. Totalt misslyckande av systemet, folk!", "stalin": "Jag ser hur klassfiendernas liberala dekadens förgiftar samhället. Denna exploaterande hyena i statens tjänst förgrep sig på en ung flicka och skapade pornografiska bevis mot folket. Vi måste rensa ut alla sådana folkförtryckare ur kollektivet. Rättvisan är hård men nödvändig mot borgarbrackornas perversion."}, "date": "20 augusti, 21:49", "url": "https://www.expressen.se/nyheter/sverige/sis-anstalld-doms-valdtog-14-arig-flicka", "imageUrl": "https://static.bonniernews.se/images/67/d0/67d0734693b6479b9beb454c777ac298/16x9/640.png"}, {"type": "image-right", "heading": "Christina fick nya händer: ”Jag kan känna mina barnbarn”", "summaries": {"normal": "Christina blev först i Norden med att genomgå en dubbel handtransplantation efter att ha förlorat händerna till följd av sepsis. Operationen utfördes 2020 på Sahlgrenska och gav henne delvis känsel tillbaka, men hon är beroende av livslång medicinering som ökar risken för cancer, diabetes och förkortad livslängd. Hon är nöjd med att kunna känna sina barnbarn trots fortsatt behov av assistans.", "trump": "Folk, det här är otroligt. Den här kvinnan förlorade händerna, fick nya från en död person och nu tar hon massor av farliga piller som kan döda henne. Det är en katastrof. Kirurgerna säger att hon är friskare utan händer? Patetiskt. Hon borde ha fått de bästa proteserna, inte ett experiment. Men hey, hon känner sina barnbarn – det är fint, det gillar jag.", "stalin": "Kamrater, jag har sett denna dekadenta borgerliga experimentering med döda kroppsdelar. Den kapitalistiska läkarkåren skapar nya patienter där inga fanns, i strid med varje rationell princip. Nu tvingas denna kvinna underkasta sig livslång kemisk förgiftning som likviderar hennes hälsa år för år. Ett typiskt västligt mirakel: man får tillbaka känseln men förlorar framtiden. Skrattretande tragiskt."}, "date": "20 augusti, 18:59", "url": "https://www.svt.se/nyheter/vetenskap/christina-forst-i-norden-med-nya-hander-fran-avliden", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.56/92d1fc8da1caa1b828f3b4d8c90f664673b8997236c015cb479169a60fd9a300"}, {"type": "image-full", "heading": "Misstroende mot Infantino diskuteras", "summaries": {"normal": "Fotbollsförbunden UEFA, AFC och Concacaf överväger en misstroendeomröstning mot Fifa-presidenten Gianni Infantino. 43 av 211 medlemsförbund kan kräva en extrakongress, men risken att förlora och stärka Infantino avskräcker. Han har starkt stöd, särskilt i Afrika, och ingen motkandidat har framträtt ännu.", "trump": "Lyssna här, Gianni Infantino – en väldigt svag ledare, om jag får säga det själv – håller på att få sig en riktig chock! UEFA och deras kompisar vill sparka ut honom, men de är rädda, väldigt rädda! Ingen modig kandidat vågar ställa upp. Infantino har stöd i Afrika, men jag säger er: det är bara för att de inte vet bättre. SAD!", "stalin": "Vi har observerat hur dessa borgerliga fotbollsbyråkrater, dessa svaga imperialistiska lakejer inom UEFA och AFC, leker med tanken att störta vår kamrat Infantino. En löjlig plan! De fruktar folket – särskilt de afrikanska massorna som står enade bakom vår ledare. Om de vågar utmana, kommer vi att krossa deras lilla kuppförsök med järnhand. Ingen motkandidat? Självklart inte – fienden är för feg!"}, "date": "20 augusti, 16:27", "url": "https://kvartal.se/nyheter/artiklar/misstroende-mot-infantino-diskuteras/cG9zdDoxNzA0MDU", "imageUrl": "https://images.kvartal.se/2026/08/ef0f88cf-infantinocolombia.webp"}, {"type": "image-right", "heading": "Dom: Överfallsvåldtäkt på Malmö centralstation", "summaries": {"normal": "En 22-årig ukrainare döms till tre år och tre månaders fängelse samt livstids utvisning för en överfallsvåldtäkt på Malmö centralstation. Han följde efter en kvinna, tryckte in henne på en toalett och våldtog henne. Ett vittne avbröt då han knackade på dörren. Tingsrätten ser händelsen som delvis planerad. Mannen kom till Sverige 2022.", "trump": "Titta på det här, det är en katastrof. Den här ukrainaren kommer hit, följer efter en kvinna på Malmö centralen och våldtar henne på toaletten som en riktig loser. Tre år och utvisning? Vi behöver starkare gränser, folk. Sverige håller på att bli ett stort brottsligt disasterområde. Så sorgligt!", "stalin": "Detta degenererade element från det ukrainska träsket har med sin parasitiska handling visat den borgerliga dekadensens sanna ansikte. Vi har dömt honom till tre år och tre månader samt permanent utvisning. Kamrater, sådana fiender till folkets moral måste rensas ut innan de förgiftar hela kollektivet. En varning till alla västliga avskum."}, "date": "20 augusti, 14:35", "url": "https://riks.se/nyheter/dom-overfallsvaldtakt-pa-malmo-centralstation", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_08_20_143452_e3e5e0cd96.png"}, {"type": "image-right", "heading": "Lyckat kammarspel om sex och relationer", "summaries": {"normal": "Jon Andersson hyllar Olivia Wildes relationsdrama ”The Invite” för dess knivskarpa dialog och övertygande skådespelarinsatser. Filmen, en nyinspelning av den spanska ”Sentimental”, utspelar sig mestadels i ett par som bjudit in grannar på middag. Kvällen blir en klaustrofobisk och ärlig konfrontation om sex, relationer och missnöje. Andersson kallar den välspelad, rolig och tankeväckande.", "trump": "Den här filmen The Invite är en total vinnare, folk. Olivia Wilde har gjort något fantastiskt, de bästa skådespelarna – Seth Rogen, Penélope Cruz, Edward Norton – levererar dialog som skär som en rakblad. Så ärligt om sex och usla äktenskap, det är hysteriskt. Mycket bättre än Hollywoods vanliga skräp. Alla kommer att prata om den, tro mig, den är huge.", "stalin": "Jag betraktar detta kammarspel som en nyttig utrensning av borgarbrackornas falska relationer. De dekadenta kapitalisterna blottar sina sjuka sexuella avvikelser inför varandra i en klaustrofobisk lägenhet. Det är nästan som att se en folkdomstol över borgerlighetens ruttnaste hemligheter. Mycket underhållande, kamrater. En sådan ärlighet borde vi tvinga fram hos alla klassfiender."}, "date": "20 augusti, 12:51", "url": "https://www.dagensarena.se/innehall/lyckat-kammarspel-om-sex-och-relationer", "imageUrl": "https://www.dagensarena.se/files/2026/08/the-invite-300x157.jpeg"}, {"type": "image-right", "heading": "SD:s nya annonsförslag: \"Budskapet censurerat av Västtrafik\"", "summaries": {"normal": "Sverigedemokraterna har lämnat in ett nytt annonsförslag till Västtrafik efter att tidigare kampanjer med budskap om återvandringsbidrag plockats ned. Den nya annonsen lyder \"Budskapet censurerat av Västtrafik\". Bakgrunden är att omkring 20 somaliska bussförare sjukskrev sig, varpå annonserna togs bort med hänvisning till arbetsmiljö och skaderisk.", "trump": "De gör det igen, de fega censurmakarna på Västtrafik! SD försöker berätta sanningen om återvandring och de river ner allt. Nu sätter de upp \"Budskapet censurerat av Västtrafik\" – genialt! De hatar friheten, de hatar det svenska folket. Men vi vinner till slut, tro mig, det blir fantastiskt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom Västtrafik utför en klassisk utrensning av folkets röst. Jag ser deras fega försök att skydda de parasitiska elementen från sanningens ljus. Vi ler mörkt åt deras paranoia – ett budskap som lyder \"Budskapet censurerat av Västtrafik\" avslöjar deras egen svaghet. Sovjetiskt skratt ekar."}, "date": "20 augusti, 12:40", "url": "https://www.friatider.se/sds-nya-annonsforslag-budskapet-censurerat-av-vasttrafik", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-715.jpg?itok=GVnuHbsv"}, {"type": "image-right", "heading": "Därför har S fel om 14-åringar i fängelse", "summaries": {"normal": "Riksdagen har beslutat att sänka straffbarhetsåldern till 14 år för allvarliga brott, främst gängkriminalitet. Socialdemokraterna röstade med Tidöpartierna trots varningar från Polisen, Kriminalvården och forskare. Kritiker menar att det bryter mot barns rättigheter, riskerar högre återfall och kan leda till att ännu yngre rekryteras. Reformen ses som fel väg framåt istället för förebyggande åtgärder.", "trump": "Titta på det här, Sverige håller på att bli ett totalt katastrofland. Socialdemokraterna och de andra losers röstar för att slänga 14-åringar i fängelse – de lyssnar inte ens på polisen eller experterna. Patetiskt! De har glömt barns rättigheter och skapar bara fler härdade gangsters. Biden skulle älskat det här vansinnet. Vi behöver tuffa tag, men inte så här korkat. Sad!", "stalin": "Jag betraktar med avsmak hur dessa socialdemokratiska klassförrädare och Tidöpartiernas exploaterande hyenor nu likviderar barns rättigheter för att mata fängelserna. De ignorerar polisen och forskarna, dessa nyttiga idioters egna verktyg. Det här är ingen utrensning av brott, det är en paranoid kapplöpning mot botten som bara stärker de kriminella nätverken. Folkfienderna glömmer att staten ska forma, inte bara slå med hammaren. Patetiska kapitalistlakejer."}, "date": "20 augusti, 12:00", "url": "https://www.etc.se/ledare/s-har-fel-om-14-aaringar-i-faengelse", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820090812_9dc6efb4-c6d1-4e0d-b627-2fbb3c1f0f02.png"}, {"type": "image-right", "heading": "Debatt: Därför behövs Jomshofs bok om islam", "summaries": {"normal": "Birger Salt försvarar Richard Jomshofs bok Kafir och menar att den fyller en lucka som medier lämnat. Han pekar på två Malmöprofiler som uttalat sig extremt om islam – en som förespråkar dödsstraff för homosexualitet, en annan som velat bränna en politiker. Salt anser att kritiken mot boken är orättvis.", "trump": "Jag läser om en svensk bok som kritiserar islam – fantastiskt! I Sverige har man politiker som vill bränna folk och införa dödsstraff för vissa saker. Det är en katastrof! Jag skulle aldrig tolerera sånt här i USA. Vi har de bästa lagarna, tro mig. Den här boken är bra – den säger sanningen!", "stalin": "Kamrater, vi ser här bevis på en ny fiende: de som vill införa medeltida straff i Sverige. En politiker vill bränna människor, en annan stödjer dödsstraff för sodomi. Detta är kontrarevolutionärt! Vi måste rensa ut dessa element från samhällets kropp. Partiet kommer att agera. Alla som inte avstår från sådant är fiender."}, "date": "20 augusti, 11:07", "url": "https://bulletin.nu/debatt-darfor-behovs-jomshofs-bok-om-islam", "imageUrl": "https://cdn.bulletin.nu/articles/a0ce1c71-5c50-4a09-bce3-6d8e0fb35d59/preview.jpg?t=1787216859000"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-right", "heading": "Riksbanken: Sannolikt med räntehöjning i höst", "summaries": {"normal": "Riksbanken lämnar räntan på 1,75 procent men viftar med hotet om en höjning i höst. Inflationen och tillväxten har överraskat positivt, medan arbetslösheten fortsätter att sura. Mellanöstern oroar, men oljepriset har lugnat sig. Dörren står på glänt för en åtstramning.", "trump": "Jag ser att Riksbanken håller räntan nere – bra, de lär sig av mig! Men de snackar om höjning i höst. Helt fel, jag har fått ekonomin att explodera, och de borde sänka räntan istället! Galet, eller hur? Inga höjningar – bara vinnande!", "stalin": "Kamrater, Riksbanken låter räntan vila på 1,75 procent, men jag ser förrädiska tecken på höjning. Inflationen växer som en kontrarevolutionär parasit, och Mellanöstern destabiliserar vår planekonomi. Vi måste rensa ut dessa marknadsliberala element – de hotar folkets stabilitet!"}, "date": "20 augusti, 09:59", "url": "https://samnytt.se/riksbanken-sannolikt-med-rantehojning-i-host", "imageUrl": "https://konto.samnytt.se/wp-content/uploads/2023/02/riksbanken-ranta-feature-226x154.jpg"}, {"type": "image-right", "heading": "Karnov stiger tvåsiffrigt på oregelbunden börs", "summaries": {"normal": "Börsen inleder oregelbundet, OMXS30 ned 0,12%. Karnov rusar 10,5% efter att ha tagit in Goldman Sachs för att maximera aktieägarvärdet. Essity köper Kenvues feminine care i Brasilien för 2,7 miljarder. Holmen slår förväntningar men marknaden är fortsatt utmanande. Attendo förbättrar marginaler rejält.", "trump": "Jag får börsen att gå upp igen! Karnov stiger 10,5% – fantastiskt, ingen gör affärer som jag. Essity köper i Brasilien, mycket smart. Men Hexagon och Ericsson backar – de borde lära sig av mig. Allt är fantast     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
