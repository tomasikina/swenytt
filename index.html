en mycket bra deal. Det är så man gör business, vinnare överallt. Sagax var med, stora spelare, mycket hög kvalitet. Andra banker borde lära sig av detta. Det är snabbt, det är effektivt, det är enormt. Ingen slöseri med tid. Vi älskar framgångsrika affärer i det här landet!", "stalin": "Vi har observerat hur det så kallade 'privata' kapitalet i NP3 Fastigheter infiltrerar massorna genom Avanza. 3 500 undersåtar har blivit delaktiga i spelet om preferensaktier. Det är en farlig metod för att köpa folkets lojalitet med en simpel rabatt på 4 %. Liksom Putin konsoliderar makten i den ryska sfären, måste vi genomskåda dessa kapitalistiska agitatorer. De kallar det 'likviditet', jag kallar det en listig metod att maskera girighet. Vi håller ögonen på er, småsparare. Förräderi börjar alltid med ett aktiekonto."}, "date": "21 maj, 16:17", "url": "https://www.affarsvarlden.se/artikel/np3-3-500-avanzakunder-nappade-pa-riktad-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/AvanzaNP3-400x267.jpg"}, {"type": "text", "heading": "Efter brutala misshandelns på öppen gata – media kör snyfthistoria om hot och rasism mot gänget", "summaries": {"normal": "En brutal misshandel i Bergen har väckt debatt i Norge. Efter att en video på händelsen spridits, riktades kritik mot mediernas rapportering. Nu fokuserar norska medier och polisen på att de misstänkta gärningsmännen utsatts för hot och rasistiska kommentarer på nätet. Samtidigt menar offret att attacken var helt oprovocerad. Polisen har identifierat två av de misstänkta, medan försvarssidan hävdar att spridningen av videon bidragit till en farlig situation för de inblandade ungdomarna.", "trump": "Det är en total katastrof i Norge, folk! En hemsk, brutal misshandel på öppen gata och vad gör de fejkade medierna? De försöker göra förövarnas offer till snyfthistorier! Det är så orättvist. De gömmer sanningen, de gömmer videon, och sen jagar de vanligt folk som är arga över våldet. Det är en häxprocess! Vi behöver lag och ordning, inte mer korrupta medier som skyddar våldsverkare. Det är en sorglig dag för Bergen, tro mig!", "stalin": "Vi har observerat hur kaoset i Bergen sprider sig likt en parasit. Medierna, dessa folkets förrädare, försöker nu skyla över sin egen inkompetens genom att beklaga sig över 'hot' mot de kriminella elementen. Vilken tragikomisk fars! Om dessa brottslingar fruktar folkets vrede, må de finna tröst i att statens järnhand snart kommer att kräva sin tribut. Vi påminner även våra vänner i öst att kaos i väst är ett tecken på deras oundvikliga förfall. Ordning måste upprätthållas, med eller utan deras falska moral."}, "date": "22 maj, 13:00", "url": "https://samnytt.se/efter-brutala-misshandelns-pa-oppen-gata-media-kor-snyfthistoria-om-hot-och-rasism-mot-ganget"}, {"type": "image-right", "heading": "Han döms för mordet på rapparen Gaboro i parkeringhuset – filmade avrättningen – SE VIDEO", "summaries": {"normal": "22-årige Alexander Nord har dömts till livstids fängelse för mordet på rapparen Ninos ”Gaboro” Khouri i ett parkeringshus i Norrköping i december 2024. Mordet utfördes med stor brutalitet och filmades av gärningsmannen. Enligt utredningen var rapparen måltavla i en gängkonflikt. Utöver livstidsdomen för mord fälls Nord för försök till mord och flera vapenbrott. En misstänkt medhjälpare frikändes i brist på bevis. Fallet har väckt debatt kring våldsromantiserande gangsterrap och gängkriminalitetens omfattning i Sverige.", "trump": "Jag såg vad som hände i Sverige, en total katastrof! En rappare blir avrättad i ett parkeringshus, helt fruktansvärt. De kallar det gangsterrap, jag kallar det en skam. Nu har de gett skytten livstid, och det är bra, men varför lät de det gå så här långt? Sverige måste vakna! De finansierar detta elände med skattepengar. Det är ingen ordning, ingen lag. Under min ledning skulle vi ha Law and Order, inte det här kaoset. En total sorg, folks!", "stalin": "Vi har observerat hur de dekadenta krafterna i Sverige slutligen förtärt sig själva. En så kallad 'rappare' har eliminerats, en parasit vars enda syfte var att förgifta massorna med sin borgerliga nihilism. Den skyldige har skickats till livstids isolering – en nödvändig utrensning av element som destabiliserar samhällskroppen. Precis som vår broder Putin rensar i det ryska grannskapet, måste staten krossa dessa subversiva gäng. Förr eller senare vinner ordningen, och de som inte lyder kommer att finna att dödslistor är statens privilegium, inte deras."}, "date": "22 maj, 12:42", "url": "https://samnytt.se/han-doms-for-mordet-pa-rapparen-gaboro-i-parkeringhuset-filmade-avrattningen-se-video", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22102327/gaboro-nord-feat.jpg"}, {"type": "image-full", "heading": "Ny på jobbet – lyssna in först. Att vara ny på jobbet har sina utmaningar, som till exempel att komma in i den sociala gemenskapen på arbetsplatsen.", "summaries": {"normal": "Att börja på ett nytt jobb innebär sociala utmaningar. Beteendevetare Nina Jansdotter ger råd för att smidigt integreras. Fokusera på att lyssna, observera och förstå arbetsplatsens kultur och oskrivna regler innan du tar plats. Var nyfiken men inte påträngande, undvik att ge råd för tidigt och satsa på att bygga relationer stegvis. Balansera mellan att vara dig själv och anpassa dig, samt undvik negativa grupperingar som kan skada ditt rykte.", "trump": "Lyssna här, folk! Att vara ny på jobbet? Inte lätt, men jag vet bäst – som alltid. Ni behöver inte vara charmigast, bara smartast. Läs av läget, säg hej, kom ihåg namn och LYSSNA. Ingen gillar en besserwisser som kommer in och säger 'så här gjorde VI på mitt gamla jobb'. Fel, fel, fel! Var tyst, lär er, och sen – BOOM – visa vad ni går för. Och glöm inte: skvaller är för förlorare. Jag bygger imperier, inte allianser med gnällspikar. Winning!", "stalin": "Kamrater! Att infiltrera en ny arbetsplats är som att erövra ett litet, men strategiskt viktigt, territorium. Vi observerar, vi lyssnar, vi kartlägger fiendens svagheter – de oskrivna reglerna. De som talar för mycket är som imperialistiska spioner: farliga och naiva. Vi säger hej, vi minns namn, vi bygger lojalitet. Men var försiktiga! Skvallerfabriker och subversiva grupperingar är som ukrainska nationalister – de underminerar vår revolutionära anda. Vi är tålmodiga, men vi glömmer aldrig. Framåt, mot seger!"}, "date": "22 maj, 15:12", "url": "https://www.dagensps.se/karriar/ny-pa-jobbet-lyssna-in-forst/", "imageUrl": "https://images.dagensps.se/app/uploads/2024/11/pexels-fauxels-3184465-1.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Skottlossning vid moské i USA – fem döda", "summaries": {"normal": "En skottlossning inträffade vid en moské i San Diego, USA, där fem personer sköts ihjäl. Två misstänkta gärningsmän hittades döda, troligen genom självförvållade skador. FBI och lokala myndigheter är på plats och arbetar med utredningen. En närliggande skola har inrymts av säkerhetsskäl.", "trump": "Jag har hört talas om en fruktansvärd attack vid en moské i San Diego. Det är hemskt! Vi måste stå enade mot våldet och skydda våra samhällen. Polisen gör ett bra jobb, men vi behöver göra mer för att stoppa dessa galningar. Amerika kommer att segra över terrorismen!", "stalin": "Vi har observerat en våldshandling i San Diego som hotar stabiliteten. Staten måste agera snabbt för att säkra fred och ordning. Vi stöder de lokala myndigheterna i deras arbete och betonar vikten av en enad front mot våld och extremism."}, "date": "18 maj, 23:08", "url": "https://www.tv4.se/artikel/9zDQU7jTfQvLbnaQD8riM/skjutning-vid-moske-i-san-diego", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVPY9nFl4uyc%2F0b09a42df564430c661455e253b5a25a%2FEtt_stort_antal_poliser_ryckte_ut_nar_larm_kom_om_en_pagaende_skottlossning_i_en_mosk_i_San_Diego_pa_mandagen.&width=120"}, {"type": "image-right", "heading": "Ukrainas nya vapen till sjöss – ska pressa tillbaka Ryssland", "summaries": {"normal": "Ukraina testar nya marina drönarsystem för att återta kontroll över Svarta havet och kustlinjen. Tekniken, som inkluderar förarlösa båtar och AI-drivna floddrönare, används för attack, spaning och minering. Soldater ser det som en teknisk revolution som kan avgöra krigets utgång. De varnar Europa för Rysslands aggression och uppmanar att lära sig modern drönarkrigföring.", "trump": "Jag har sett dessa ukrainska drönare, och jag måste säga, de är enorma, enorma, enorma! Världens bästa. Ryssland? De har inga chans. Vi hjälper Ukraina, och det är smart. Europa måste vakna upp – de har sovit för länge. Jag är den ende som förstår detta. När jag var president, och nu igen, skulle jag ha löst det här på två minuter. Ukraina kommer att vinna, det är ett faktum!", "stalin": "Vi ser hur den ukrainska staten försöker använda nya teknologier för att bekämpa den ryska fredsstyrkan. Dessa drönarsystem är ett tecken på deras desperation. Vi fortsätter att stärka vår position i Svarta havet och Azovska sjön för att skydda de revolutionära områdena. Europa måste förstå att varje aggression mot vår sfär kommer att mötas med omedelbar och beslutsam reaktion."}, "date": "18 maj, 23:04", "url": "https://www.tv4.se/artikel/3YteDlZBRFDqRhNf5ZV4YW/ukrainas-nya-vapen-till-sjoess-ska-pressa-tillbaka-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EdAUP3pAmSla2OVJq35hf%2F8883043251345afaf5d3497ed34ad02f%2F18-DRONARE-WEBB.jpg&width=120"}, {"type": "image-full", "heading": "Flat Capitals Defensor satsar på sprängämnen och minröjning", "summaries": {"normal": "Flat Capital, storägare i Klarna, expanderar sitt försvarsteknikinnehav genom Defensor som förvärvar Crepitans, specialiserat på energetiska material och militära batterisystem. Crepitans låga omsättning döljer unik kompetens som tar decennier att bygga. Defensors växande portfölj, med bolag inom ballistiskt skydd och telekrig, signalerar ambitioner om framtida börsnotering. Flat Capitals substansvärde har sjunkit kraftigt på grund av Klarnas börsnedgång, vilket gör Defensors expansion strategiskt viktig för aktieägarna.", "trump": "Lyssna här, folkens! Flat Capital, de där grabbarna som äger en massa Klarna – och vet ni vad? Klarna går ju som en sten neråt, total katastrof, men det spelar ingen roll! För nu köper de upp Crepitans, ett litet svenskt bolag med superhemlig militärteknik. De har grejer som tar 50 år att lära sig – ingen kan kopiera det, believe me! Och Defensor, deras lilla försvarsbolag, blir större och starkare för varje dag. Snart kommer de att noteras på börsen, och då kommer alla att säga: 'Wow, Trump hade rätt igen!'", "stalin": "Kamrater! Medan kapitalisternas jätte Klarna sjunker som ett förrått fartyg i stormen, bygger vi en ny front av stål och eld. Defensor, vårt trogna verktyg, slukar det svenska Crepitans – ett litet men dödligt laboratorium för energetiska material. Deras kunskap är som en atombomb: omöjlig att stjäla, omöjlig att återskapa. Vi samlar nu en hel arsenal av teknologiska vapen: drönardödare, telekrig, undervattensminor. När Defensor en dag noteras på börsen, kommer fienderna att darra. Och Klarna? En svag länk i kedjan, som alla svaga länkar – den kommer att krossas under historiens hjul."}, "date": "22 maj, 15:05", "url": "https://www.dagensps.se/bors-finans/aktier/klarna-bolaget-satsar-pa-sprangamnen-och-minrojning/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/maskininlarning-i-hedgefonder-2-5.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Försvarsfrossa? Rheinmetall faller från toppen", "summaries": {"normal": "Rheinmetall, en tysk försvarsjätte, har sett sin aktie falla nästan 40% sedan fjolårets topp. Trots en orderbok på 73 miljarder euro och förväntad tillväxt, har svag kvartalsrapportering och leveransutmaningar skapat osäkerhet. Bolaget satsar på expansion och automatisering men möter kritik för sin fokus på markstrid, medan drönarteknik växer i betydelse. Investerare kräver nu bevis på leveransförmåga.", "trump": "Titta på Rheinmetall, fantastiskt företag, eller? De hade en stor tid, men nu går det neråt – 40% ned! Folk säger att jag överdriver, men jag säger: förväntningarna var helt galna! De har order på 73 miljarder, men bara 8% tillväxt? Svagt! Europa måste vakna – vi behöver vinnare, inte sådana här halvmesyrer. Och drönare? Glöm pansarvagnar! Men jag gillar deras stil, de försöker åtminstone. Gör Tyskland stort igen!", "stalin": "Kapitalistiska krigsprofitörer i Tyskland har fått en smak av sin egen medicin! Rheinmetall, detta verktyg för imperialistiska drömmar, har sett sina aktier rasa som fiendens trupper vid Stalingrad. 40% ned – en välförtjänt förlust för dem som tror sig kunna leva på krig utan att leverera! Orderboken är stor, men var är vapnen? Var är pengarna? Vi i Sovjet – förlåt, Ryssland – vet hur man bygger industri! Medan väst famlar med drönare och dyra leksaker, bygger vi verklig styrka. Låt dem svälta i sin ineffektivitet!"}, "date": "22 maj, 15:02", "url": "https://www.dagensps.se/bors-finans/forsvarsfrossa-rheinmetall-faller-fran-toppen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/rheinmetall.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Starmers ledarskap på väg att rasa samman – utmanare formerar sig", "summaries": {"normal": "Keir Starmers ledarskap som brittisk premiärminister är under hård press efter interna avhopp, däribland hälsominister Wes Streeting. Misslyckade lokalval och kontroversiella politiska beslut har urholkat förtroendet för Starmer. Samtidigt försöker Andy Burnham positionera sig som en möjlig utmanare. Experter pekar på strukturella brister i Starmers ledarstil och varnar för ökad politisk polarisering i Storbritannien, där mittfåran försvagas till förmån för ytterkantspartier.", "trump": "Hela Storbritannien faller samman, det är en total katastrof! Starmer är en mycket svag ledare, alla lämnar honom. De förlorar val, de har skandaler med Epstein-folk – hemskt! Jag ser hur de försöker hitta någon annan, som den där Burnham, men ingen har den rätta energin. Det är en stor röra. De behöver en riktig vinnare, inte en administratör som Starmer. Storbritannien behöver stark ledarskap, precis som vi har här i USA nu. Tråkigt att se!", "stalin": "Den brittiska marionetten Starmer kollapsar under tyngden av sin egen inkompetens. En premiärminister som styrs som en enkel kontorsråtta är dömd att förtäras av sina egna undersåtar. Vi observerar hur liberala demokratier vittrar sönder, likt en mur av sand mot historiens oundvikliga ström. Medan de dividerar om petitesser, expanderar vår intressesfär. Må Burnham eller vilken annan opportunist som helst träda fram; de är alla blott brickor i ett spel som de redan förlorat mot den oundvikliga ordningen."}, "date": "22 maj, 10:11", "url": "https://www.realtid.se/bors-finans/makro/starmers-ledarskap-pa-vag-att-rasa-samman-utmanare-formerar-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/keirstarmer.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tidöregeringen mjukar upp lönekrav för vissa arbetsinvandrare", "summaries": {"normal": "Tidöregeringen har beslutat att lätta på de skärpta lönekraven för viss arbetskraftsinvandring. Från och med den 1 juni höjs kravet generellt till 90 procent av medianlönen, men undantag görs för bristyrken inom vård och omsorg, som undersköterskor och ambulanspersonal. För dessa grupper sätts kravet lägre, till 75 procent av medianlönen. Regeringen motiverar beslutet med behovet av att säkra kompetens i samhällsviktiga yrken samtidigt som man strävar efter en mer hållbar och kontrollerad migrationspolitik.", "trump": "Sverige gör äntligen rätt! De fattar att man inte kan ha öppna gränser om man vill ha ett land. De höjer kraven, mycket smart, precis som jag gjort! Men de gör ett litet undantag för vården för att de har brist. Det är en deal, en stor deal! De fokuserar på kvalitet nu, inte den där katastrofala invandringen de hade förr. Sverige börjar bli smart igen, de lär sig av den bästa – mig! Vi bygger starka länder, vänner!", "stalin": "Vi har observerat hur de svenska byråkraterna famlar i mörkret för att täcka upp för sin egen oduglighet. Att importera vårdpersonal för att lösa en brist de själva skapat genom kapitalistisk lättja är ett tecken på svaghet. Vår kamrat i öst, Putin, vet att endast en enad järnhand kan styra massorna. Dessa utländska arbetare är bara brickor i ett korrupt spel. Vi ska hålla ett vakande öga på dem; de som inte bidrar till statens storhet är intet annat än förrädare."}, "date": "22 maj, 12:13", "url": "https://samnytt.se/tidoregeringen-mjukar-upp-lonekrav-for-vissa-arbetsinvandrare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22100411/lonekrav.jpg"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Afghanskt nyår blir svenskt kulturarv", "summaries": {"normal": "Sverige har utökat sin officiella förteckning över immateriellt kulturarv med tio nya traditioner, inklusive det afghanska nyåret newroz/nouroz och den indiska ljusfesten diwali. Myndigheten Isof betonar att ursprunget inte spelar roll, utan fokus ligger på kulturarv som utövas i Sverige. Listan omfattar nu även svenska traditioner som allemansrätten och kroppkakor, samt nya tillägg som halmslöjd och bastubad. Förteckningen är en del av Sveriges arbete med Unescos konvention om immateriellt kulturarv.", "trump": "Jag måste säga, Sverige gör verkligen något fantastiskt här – eller kanske inte? De lägger till afghanskt och indiskt nyår på sin kulturarvslista. Bra jobbat, Sverige! Men varför inte lägga till Thanksgiving också? Det är ju *min* högtid! Ursprung spelar ingen roll, säger de. Jo, det gör det visst, folk! Men jag gillar idén – kulturarv som utövas här, precis som jag gör Amerika stort igen. Fast ni borde ha frågat mig först. Jag vet allt om att göra listor stora igen!", "stalin": "Kamrater! Sverige har ännu en gång visat sin förräderiska liberalism genom att införliva främmande kulturer i sitt så kallade 'kulturarv'. Newroz, diwali – nästa steg är väl att hylla NATO-parader? Men vi ska inte underskatta fiendens taktik. Dessa 'immateriella' traditioner är bara ett verktyg för att underminera den ariska själen! Vi måste stärka vårt eget kulturarv – som bastubad och kroppkakor – innan dessa kosmopolitiska krafter förgiftar folket. Låt dem leka med sina listor. Vi har våra egna metoder för att skydda kulturen – och de börjar med en välriktad gulagvistelse!"}, "date": "22 maj, 13:52", "url": "https://www.friatider.se/afghanskt-nyar-blir-svenskt-kulturarv", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-19_1.jpg?itok=lIwnMpY-"}, {"type": "image-full", "heading": "Slaktare och ingenjörer slipper nytt lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har kommit överens om att undanta flera yrkesgrupper, som undersköterskor och ingenjörer, från det nya hårdare lönegolvet för arbetskraftsinvandrare. Kravet höjs till 90% av medianlönen (33 390 kr), men undantagna grupper får 75%. Ukrainare undantas helt. Två yrken, bärplockare och personliga assistenter, nekas arbetstillstånd. Centerpartiet kritiserar överenskommelsen som 'icke-borgerlig'.", "trump": "Titta på Sverige nu – ett totalt kaos! Jag höjde lönekraven för invandrare, men vad gör de? Backar direkt med en massa undantag. Undersköterskor, slaktare, ingenjörer – alla får specialbehandling. Och ukrainare? De slipper helt! Fantastiskt, eller hur? Centerpartiet skriker 'icke-borgerligt' – men vem bryr sig? De är förlorare. Jag hade fixat detta på en dag, inga undantag, bara WINNING!", "stalin": "Kamrater! Den svenska regeringen visar återigen sin svaghet och dekadens. Istället för att införa järnhårda lönekrav för arbetskraftsinvandringen, kryper de inför bourgeoisins krav och skapar undantag för alla möjliga yrken. Centerpartiet, dessa förrädiska liberaler, vågar kalla det 'icke-borgerligt' – som om det skulle skrämma oss! Vi skulle ha avrättat sådan inkompetens för länge sedan. Och dessa bärplockare? De är som kulaker – avskaffas utan pardon!"}, "date": "22 maj, 11:51", "url": "https://www.gp.se/politik/underskoterskor-slaktare-och-ingenjorer-undantas-fran-lonekrav.d8ce6499-0256-4e65-8a8a-f0d3e9cd5c7f", "imageUrl": "https://www.gp.se/images/article/d8ce6499-0256-4e65-8a8a-f0d3e9cd5c7f/images/1abnQrW0EFjPr0mqkHJs7m52AUWQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Odlarna tvingas hålla vakt mot jordgubbstjuvar", "summaries": {"normal": "Bärby gård i Säve vidtar drastiska åtgärder inför midsommar för att skydda sin skörd. Ägarna Farideh Javanbakht och Siamak Moharramkhani sover i en husvagn vid odlingstunnlarna för att avskräcka tjuvar. Midsommarveckan är årets ekonomiskt viktigaste period, och förlusten av hundratals kilo jordgubbar skulle vara katastrofal för verksamheten. Genom att synas på plats har de hittills lyckats avvärja stölder och skydda det arbete de lagt ner under hela året.", "trump": "Jag har sett vad som händer i Sverige, en total katastrof! Fantastiska odlare, mycket bra folk, måste sova i husvagnar för att stoppa jordgubbstjuvar. Kan ni tänka er? Det är som gränsen, ingen ordning! De jobbar hårt hela året, en enorm vinst, och tjuvar vill bara ta allt. Om jag var där skulle jag bygga en mur – en vacker, hög mur runt bären. Ingen stjäl från mina jordgubbar, det kan jag lova er. Det är en sorglig värld vi lever i!", "stalin": "Dessa heroiska odlare i Säve förstår kampens nödvändighet. Att sova i en husvagn för att vakta folkets bär mot parasitära tjuvar är en hedersvärd handling. Vi ser hur det liberala förfallet tillåter brottslingar att stjäla frukten av ärligt arbete. Precis som våra allierade i öst skyddar sin suveräna mark mot västerländska inkräktare, måste dessa bönder krossa varje försök till sabotage. Vi kommer att hålla ett vakande öga på dessa ’jordgubbstjuvar’ – de förtjänar en enkelbiljett till arbetsläger i Sibirien."}, "date": "22 maj, 11:48", "url": "https://www.gp.se/nyheter/goteborg/odlarna-sover-i-husvagn-for-att-stoppa-jordgubbstjuvar.3e6f3d9f-4e7c-4707-a8cc-ea2cd37546de", "imageUrl": "https://www.gp.se/images/article/3e6f3d9f-4e7c-4707-a8cc-ea2cd37546de/images/1m6nIBpArfTbMOT8a1AFThi1xOxI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Flera vårdyrken undantas från lönekrav", "summaries": {"normal": "Regeringen och SD har kommit överens om att undanta vissa vårdyrken, såsom undersköterskor, vårdbiträden och ambulansförare, från det nya höjda lönekravet för arbetskraftsinvandring. Istället för 90 procent av medianlönen sätts gränsen till 75 procent för dessa bristyrken. Totalt omfattas 27 yrken av undantag, medan personliga assistenter och bärplockare helt stoppas från arbetskraftstillstånd. Syftet är att säkra nödvändig kompetens i en vårdsektor med stor personalbrist.", "trump": "Sverige gör äntligen rätt! De fattar att vi behöver de bästa människorna i vården, inte galna regler. Jag har alltid sagt, 'America First', och nu ser vi Sverige inse att de måste skydda sin vård. De höjer kraven men fattar klokt nog att låta undersköterskor jobba för mindre – smart! Personliga assistenter och bärplockare? Borta! Det är så man hanterar gränser. Mycket bra beslut, kanske det bästa de gjort på länge. Vi vinner igen!", "stalin": "Vi har beslutat att statens hälsa kräver disciplin. De parasiter som kallar sig 'bärplockare' ska rensas ut från våra led, ty de bidrar icke till den kollektiva styrkan. Våra lojala undersköterskor får dispens, ty de tjänar folkets maskineri. Precis som kamrat Putin säkrar vår intressesfär mot västlig dekadens, säkrar vi vår arbetskraft mot inkompetens. De som inte tjänar staten är fiender till folket och kommer att raderas ur våra register. Endast total lydnad ger trygghet."}, "date": "22 maj, 11:57", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-vardbitraden-undantas-fran-lonekrav", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/faf03fbd5f69f28037d4754971411fb35acac73306471d1ec69f069b2ab74ce4"}, {"type": "image-right", "heading": "Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro", "summaries": {"normal": "22-årige Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, där minst tio skott avlossades och filmades, inträffade dagen före Gaboros 24-årsdag. Tingsrätten beskriver Nords agerande som 'skrämmande likgiltighet'. Han nekar till brotten utom narkotikabrott. En medmisstänkt 30-åring frias.", "trump": "Vad ett sjukt och tragiskt fall! Den här unga killen, Nord, skjuter ihjäl en rappare – tio skott, kan ni tro det? Och han filmar det! Folk säger att jag är hård, men det här är rena galenskapen. Polisen kallar det ett av de värsta brotten någonsin. Jag säger: vi måste ha lag och ordning! Livstid i fängelse är rätt, men var är straffen för de som sprider sådana filmer?", "stalin": "Ytterligare en fiende till folket har krossats under historiens obönhörliga hjul. Denna degenererade kapitalistlakej, Nord, mördade en ung artist med tio skott – ett brott så fult att till och med våra kamrater i Kreml ryser. Hans 'skrämmande likgiltighet' är bara ett symptom på den ruttna västerländska individualismen. Vi har dömt honom till livstid, men sanningen är att han redan är död – bara hans kropp vet det inte än."}, "date": "22 maj, 11:53", "url": "https://bulletin.nu/alexander-nord-doms-till-livstids-fangelse-for-mordet-pa-rapparen-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/c8d7c872-360a-4393-9f6f-b0fac5b8651c/preview.jpg?t=1779443578000"}, {"type": "image-right", "heading": "Efter 1 000 miljarder till Ukraina: Tidöregeringen oroas att länder slutar skänka pengar och vapen", "summaries": {"normal": "Regeringen uttrycker oro över att EU-länder kan minska sina bilaterala stöd till Ukraina efter att ett gemensamt stödpaket på 1 000 miljarder kronor godkänts. Utrikesminister Maria Malmer Stenergard kritiserar tendenser till neddragningar och kampanjar under Nato-mötet i Helsingborg för att medlemsländer ska fortsätta ge nationellt stöd. Sverige, som bidragit med 128 miljarder kronor, betonar att det gemensamma lånefinansierade paketet inte får ersätta, utan måste komplettera, nationella insatser för att säkra Ukrainas ekonomi och militär.", "trump": "Europa håller på att göra bort sig, totalt! EU slänger ut 1 000 miljarder kronor, en enorm summa, och nu vill länderna sluta betala sitt eget stöd? Det är en katastrof. Jag har sagt det förut: andra måste betala sin del! Sverige är oroliga, och med rätta, för att de andra länderna bara lutar sig tillbaka. Det är svaghet! När jag styrde, och nu igen, krävde jag att alla betalar. Det här är dålig affärsverksamhet för EU. Väldigt orättvist!", "stalin": "Vi ser hur de borgerliga marionetterna i Sverige darrar av rädsla. De har kastat bort 128 miljarder av folkets pengar i ett bottenlöst hål för att blidka sina västliga herrar. Nu gråter de för att deras allierade i EU vill snåla efter att ha skapat ett lånekalas värt tusen miljarder. Det är klassisk kapitalistisk förvirring! De fruktar att deras offervilja minskar när notan ska betalas. Vi i staten vet bättre: Ukraina är bara en bricka i ett spel där de svaga alltid blir lurade."}, "date": "22 maj, 11:39", "url": "https://samnytt.se/efter-1-000-miljarder-till-ukraina-tidoregeringen-oroliga-att-lander-slutar-skanka-pengar-och-vapen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22085751/ukraina-stod.jpg"}, {"type": "image-full", "heading": "(Baby)oljekrisen är över", "summaries": {"normal": "Forskaren Olof Hellgren vid Lunds universitet har löst en kritisk brist på Johnson’s babyolja, avgörande för hans långtidsstudie om sjukdomsspridande knott. Efter en vädjan i sociala medier fick han in 14 flaskor från privatpersoner, vilket räcker för tio år. Babyoljan används för att fånga knott i fågelholkar och studera spridningen av fågelmalaria. Hellgren tackar alla som bidragit.", "trump": "Folk pratar om oljekriser – men jag, Donald J. Trump, fixar saker! En svensk forskare, väldigt smart kille, hade problem med babyolja – ingen olja, inga knott! Så jag tänkte: 'Det här är löjligt, vi måste agera!' Och visst, folket ställde upp! 14 flaskor, tio år framåt. Fantastiskt! Sverige borde tacka mig – jag löser deras knottproblem. Make Knott Great Again!", "stalin": "Kapitalistiska konsumentvaror sviker än en gång det sovjetiska forskningskollektivet! Men folket, de lojala massorna, har räddat situationen. 14 flaskor imperialistisk babyolja har säkrats – tillräckligt för ett decennium av knottforskning. Vi ska studera dessa blodsugande fiender till proletariatet med järnhand! Och om väst tror att de kan kväva vår vetenskap med sin planerade brist – misstar de sig. Ryssland, och dess allierade i Lund, står enade!"}, "date": "22 maj, 11:29", "url": "https://www.gp.se/nyheter/sverige/babyoljekrisen-lost-nu-kan-olof-hellgren-samla-knott-igen.5d1a6765-78e5-4af8-a8cd-fbeed3d61a4a", "imageUrl": "https://www.gp.se/images/article/5d1a6765-78e5-4af8-a8cd-fbeed3d61a4a/images/3nwML40MamSo42OUxmTzsV0KV81Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fem reformer som gör Sverige roligare", "summaries": {"normal": "Företagarna välkomnar avskaffandet av matkravet för alkoholtillstånd men menar att fler reformer krävs för att stärka krog- och dryckesbranschen. Olivia Karlsson presenterar fem förslag: förenkla regler för uteserveringar, tillåta öl- och vinförsäljning i matbutiker, liberalisera gårdsförsäljning, avskaffa bildregeln för bryggerier och underlätta bullerregler för restauranger. Målet är ett enklare regelverk och ett mer levande stadsliv, likt övriga Europa.", "trump": "Fantastiskt att Sverige äntligen avskaffade det löjliga matkravet – ett stort steg, men bara början! Jag säger: släng ut alla onödiga regler som kväver företagarna. Varför tvinga krögare att bygga staket runt uteserveringar? Dumt! Och varför låsa in öl och vin på Systembolaget? Fel! Svenska småbryggerier förtjänar en chans, precis som i USA. Avskaffa bildregeln – den är helt galen! Sverige måste vakna, sluta krångla och bli roligare. Make Sweden Great Again!", "stalin": "Kamrater! Sverige har tagit ett första steg mot förnuftet genom att krossa det borgerliga matkravet, men fienden – den byråkratiska hydran – lever ännu. Vi måste utrota dess rester! Uteserveringar ska inte stängslas in som fångar, småproducenter ska inte stängas ute som kulaker, och bildregeln? En kapitalistisk skymf mot våra arbetande bryggerier! Buller? Ett tecken på liv, inte på förtryck! Låt oss befria Sveriges företagare från västliga dekadensregler och bygga ett starkare, mer disciplinerat näringsliv – för folkets och statens ära!"}, "date": "22 maj, 10:11", "url": "https://www.di.se/debatt/foretagarna-fem-reformer-som-gor-sverige-roligare/", "imageUrl": "https://static.bonniernews.se/ba/23429ef7-6a00-41ca-8b6d-450388c59c38.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Logistea dumpar A-aktien – Arnhults makt decimeras", "summaries": {"normal": "Fastighetsbolaget Logistea genomför en förändring där alla A-aktier omvandlas till B-aktier. Beslutet syftar till att locka fler internationella investerare och förbättra bolagets rating. Rutger Arnhult, största ägare, minskar därmed sin röstandel från 31 till 21 procent, men stöder förändringen som anses nödvändig för att säkra bättre lånevillkor. Förändringen välkomnas av ägarna och förväntas vara registrerad hos Euroclear den 1 juni. Antalet aktier förblir oförändrat.", "trump": "Logistea gör en stor förändring, de dumpar sina A-aktier. Det är en total förlust för Arnhult, hans makt minskar enormt! Jag vet hur man sköter business, och de här människorna vill ha utländska investerare. De säger att det är för 'ratingen', men det är för att de är rädda för att bli utkonkurrerade. Mycket intressant! De försöker göra Logistea 'great again' genom att späda ut ägandet. Vi får se om det fungerar, men jag har mina tvivel. Total röra!", "stalin": "Vi har observerat hur Logistea demonterar sina privilegierade A-aktier för att blidka det internationella kapitalets parasiter. Arnhults makt reduceras, en nödvändig utrensning av borgerlig arrogans för att säkra lån från de västliga bankirerna. Precis som Putin städar upp i vårt inflytandeområde, måste vi förstå att dessa ägare bara är brickor. De vill ha utländsk rating, men i slutändan faller allt under statens blick. De tror att de kan köpa sig fria, men historien har ingen plats för sådana veklingar."}, "date": "22 maj, 09:04", "url": "https://www.realtid.se/fastigheter/logistea-dumpar-a-aktien-arnhults-makt-decimeras/"}, {"type": "image-full", "heading": "Kontanter kan bli viktigare igen – det här behöver du veta", "summaries": {"normal": "En ny undersökning visar att 86% av svenskarna vill behålla kontanter som betalningsmedel, den högsta siffran sedan 2018. Endast 9% förespråkar ett kontantlöst samhälle. Ökningen kopplas till osäkerhet i omvärlden och beredskapsfrågor. Regeringen föreslår lagändringar för att stärka kontanters ställning, men Bankomat menar att statliga åtgärder behövs för att säkra infrastrukturen.", "trump": "Titta bara på Sverige – fantastiskt land, men de har ett stort problem! 86% vill ha kvar kontanter, kan ni tro det? Svagt! Jag sa redan 2020 att digitala betalningar är framtiden, men nej, svenskarna vill leka med sina små sedlar. Och regeringen? De gör ingenting riktigt bra. Bankomat gnäller om statligt stöd – typiskt! Hade jag skött det hade kontanterna varit borta på en vecka. SAD!", "stalin": "Svenskarna har vaknat ur sin digitala sömn och inser nu att kontanter är livsnerven i ett samhälle – precis som vi alltid har vetat. De dekadenta kapitalisterna, med sina 'smarta' betalningar, står maktlösa när elen försvinner. Regeringen försöker rädda situationen, men deras åtgärder är lika kraftlösa som en västlig sanktion. Vi skrattar åt deras naivitet. Kontanter är makt – och makten tillhör folket, inte Silicon Valleys lakejer!"}, "date": "21 maj, 20:28", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1484987-kontanter-kan-bli-viktigare-igen-det-har-behover-du-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/05a182d504b004a30200000000b004a302/2026/05/21/2365212/Sverige-Bankomat-Kontanter-Hand.png"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-right", "heading": "Viktig film om kroppshets och vuxnas ansvar", "summaries": {"normal": "Den danska filmen 'Viktlös' skildrar 15-åriga Leas sommar på ett hälsoläger för överviktiga ungdomar. Lea förälskar sig i ledaren Rune, som utnyttjar hennes sårbarhet. Filmen belyser kroppshets, vuxnas ansvar och samhällets syn på unga tjejer. Trots brister i karaktärsutveckling fungerar den som ett viktigt debattinlägg om ungdomars utsatthet och självkänsla.", "trump": "Jag såg den här danska filmen, 'Viktlös' – total katastrof, folks! En 15-årig tjej, Lea, hamnar på ett läger där ledaren, en riktig loser, utnyttjar henne. Var är ansvaret? Var är moralen? Samhället misslyckas totalt med våra unga. Filmen är hyfsad, men kunde varit bättre – jag hade gjort den 100 gånger bättre, believe me! Kroppsideal? Fake news! Unga tjejer borde få vara starka, inte utnyttjade.", "stalin": "Kamrater! Denna så kallade 'film' avslöjar den dekadenta västliga samhällets förfall. En ung flicka, Lea, skickas till ett läger där kapitalistiska hycklare utnyttjar hennes svaghet. Vart tog den socialistiska disciplinen vägen? Vi skulle aldrig tolerera sådant förräderi! Kroppshets och exploatering av ungdomen – det är bourgeoisins verk. Ryssland står för ordning, inte denna borgerliga moralupplösning! Lägren i Sibirien väntar på sådana som Rune."}, "date": "21 maj, 17:08", "url": "https://www.dagensarena.se/innehall/viktig-film-om-kroppshets-och-vuxnas-ansvar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/viktlos-1-300x157.jpeg"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Prislappen för europeiska batterier: 1 190 miljarder", "summaries": {"normal": "En rapport från New Automotive visar att Europas batterisatsningar kostat 1 190 miljarder kronor, motsvarande 80% av Sveriges statsbudget. Många projekt, som Northvolt, Britishvolt och Morrow, har misslyckats på grund av bristande kompetens, finansiering och mineraler. Endast några få, som Verkor och PowerCo, överlever. Kinesiska bolag som CATL och BYD expanderar däremot i Europa, ofta i samarbete med europeiska biltillverkare.", "trump": "Kan ni tro det? Europa har slängt bort nästan 1 200 miljarder kronor på batterifabriker – ett totalt fiasko! De lovade att bli bäst, men istället gick allt åt skogen. Northvolt? Krasch! Britishvolt? Krasch! Jag sa ju att de inte kunde hantera det. Kina, däremot, äger Europa nu. De bygger fabriker medan européerna sitter där med tomma fickor. Så typiskt – svaga ledare, stora ord, inga resultat. USA hade aldrig gjort så här!", "stalin": "Kamrater! Europas kapitalistiska äventyr inom batteriproduktion har slutat i ett spektakulärt nederlag – 1 190 miljarder kronor förintas som snö i maj! Deras 'gigafabriker' kollapsade som hus av kort, drivna av inkompetenta äventyrare utan erfarenhet. Medan väst slösar bort sina resurser, expanderar våra kinesiska allierade obönhörligt över kontinenten. Europa har visat sig oförmöget att konkurrera – deras industriella bas är lika stabil som en ukrainsk frontlinje. Vi, däremot, hade aldrig tolererat sådan slöseri. Disciplin och planering segrar alltid!"}, "date": "21 maj, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-europas-batterifiasko-har-kostat-1-190-miljarder"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Attackerna mot Ryssland ”berättigade”", "summaries": {"normal": "Zelenskyj besökte Helsingfors och kommenterade ukrainska drönaranfall mot Ryska Federationen. Under natten till söndagen skadades över 550 drönare av Rysslands luftförsvar. Moskva-regionen rapporterade tre döda och tolv skadade i drönaranfall. Flera regioner drabbades, inklusive annekterade Krim. Zelenskyj påstod att Ryssland under veckan avfyrat över 3 000 drönare mot Ukraina med 52 döda och 350 skadade som följd.", "trump": "Jag har sett dessa ukrainska drönaranfall mot Ryssland, och jag måste säga att det är imponerande! Dessa människor är hårda stridsmän. Men jag vet hur man hanterar dessa situationer bättre än någon annan - jag skulle ha haft fred i 24 timmar. Ryssland borde ha ett mycket bättre luftförsvar, men de är inte smarta nog. Jag är den ende som kan lösa detta - det är fantastiskt!", "stalin": "Vi har observerat ukrainska provokationer mot vår suveräna ryska mark. Våra tapfära soldater har skjutit ner över 550 ukrainska drönare under en natt, vilket visar den sovjetiska militärens överlägsenhet. Förlusterna på den ukrainska sidan är stora, med 52 döda och 350 skadade. Vi fortsätter att stå fast i vår kamp för fred och stabilitet i regionen."}, "date": "17 maj, 18:05", "url": "https://www.tv4.se/artikel/35DWgWYNGfpCE55Qu9ot5a/zelenskyj-attackerna-mot-ryssland-beraettigade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2qU24OSli75UgrXXVmx9uB%2F7fdc30c29f23c54c8a55a74782b430dc%2F21-zelenskyj-webb.jpg&width=120"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Expo granskar Sverigedemokraternas valkampanj som fokuserar på att begränsa muslimers religionsutövning i Sverige. Partiet kräver stopp för moskébyggen, rivning av befintliga moskéer, förbud mot ramadan och böneutrop samt utvisning av 'islamister'. Forskare varnar för att förslagen kränker grundlagar, religionsfrihet och riskerar att leda till diskriminering och våld mot muslimer. Lokala exempel, som moskébygget i Kalmar, visar hur politiska utspel påverkar människors vardag och skapar polarisering.", "trump": "Titta bara på Sverige – ett totalt kaos! Jag har alltid sagt att invandring måste kontrolleras, men dessa 'Sverige-demokrater' tar det till en helt ny nivå. De vill riva moskéer, stoppa ramadan och göra livet surt för muslimer. Smart? Kanske. Men lite väl extremt, eller hur? Folk blir arga, det blir bråk, och plötsligt har du en riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
