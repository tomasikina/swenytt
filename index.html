alin": "Kamrater, denna Infantino har visat sig vara en typisk opportunistisk borgarbracka som försöker sälja ut den internationella fotbollsrörelsen till spekulanter och parasiter. När vi, det kollektiva fotbollsproletariatet, genom Uefa och våra allierade, hotar med utrensning och förtroendeomröstning, kryper han tillbaka in i sitt hål. Sådana fiender till folket, dessa fotbollsfascister och revisionistiska kapitalistlakejer, måste rensas ut innan de förgiftar hela den globala arbetarfamiljen med sin girighet. Vi ler i mörkret åt deras ynkliga reträtt."}, "date": "2 augusti, 07:29", "url": "https://www.svt.se/sport/fotboll/uppgifter-uefa-vill-att-gianni-infantino-avgar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.41/d5661315e30e152897af1a158b04b5e8c6940443160975eb3780783c7fc3835c"}, {"type": "image-right", "heading": "S får med sig majoritet: Så ska Svenska kyrkan förändras", "summaries": {"normal": "Fem nomineringsgrupper med egen majoritet i Svenska kyrkan vill ändra tidigare beslut om samkönade vigslar för att skapa en entydig äktenskapssyn. Motionärerna, däribland Socialdemokraterna och Centerpartiet, anser dagens formuleringar är oklara och vill tydliggöra kyrkans officiella hållning. Kritiker, som Posk, varnar för att förslaget riskerar att begränsa kyrkans bredd och vill invänta läronämndens yttrande innan ställningstagande.", "trump": "Jag, Donald Trump, ser detta som ett fantastiskt beslut av de kloka ledarna i Svenska kyrkan. De flesta vill ha en stark, enhetlig syn på äktenskapet – precis som jag alltid har sagt. Vissa gamla beslut från 2009 skapade förvirring, men nu ställer vi allt till rätta. Det är ett enormt steg för ordning och stabilitet. Som vanligt försöker några förlorare stoppa framgången, men vi kommer att vinna!", "stalin": "Vi, partiet, stöder kyrkans beslut att skärpas mot moralisk dekadens från väst. Fem nomineringsgrupper, våra trogna allierade, har tagit befälet för att korrigera de reaktionära besluten från 2009. Dessa trotskyister inom Posk försöker dröja processen med sina teologiska gnäll, men läronämnden kommer att rapportera tillbaka. Vi måste skydda den kollektiva viljan och förena kyrkan mot de individualistiska prästerna som vill avstå. Putin skulle vara stolt."}, "date": "2 augusti, 12:00", "url": "https://samnytt.se/majoritet-vill-skarpa-svenska-kyrkans-linje-om-samkonade-vigslar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31095421/svenska-kyrkan-samkonade.jpg"}, {"type": "image-right", "heading": "Sjöström ändrar teknisk detalj: ”Kan vara två hundradelar”", "summaries": {"normal": "Sarah Sjöström har förlorat två världsrekord till Gretchen Walsh i sommar. Inspirerad av Walshs undervattenteknik arbetar hon nu med att förbättra sin svaghet under vattnet. Tränaren Antonio Lutula tror att en tiondel bättre start på 15 meter kan ge betydande fördelar. Sjöström fokuserar inte på att återta rekord utan på att svara på träningen, och hon ser potential för riktigt snabba tider framöver.", "trump": "Titta på den här Sarah Sjöström, fantastisk simmerska, verkligen en vinnare, men hon har förlorat sina rekord till den här Gretchen Walsh som simmar som en galning under vattnet. Nu fixar Sarah det, smart drag, det handlar om hundradelar, två hundradelar, det är vad det handlar om på den nivån. Hon kommer att krossa det, lugnare vatten, bättre start, det blir enormt. Ingen bryr sig om rekordet, hon simmar på 23,8 och snart blir det nya, otroliga tider, tro mig.", "stalin": "Kamrater, jag har noterat hur denna Sjöström med sin dekadenta simkonst har förlorat två världsrekord till den borgerliga amerikanen Walsh, en typisk kapitalistisk undervattensfiende som smugit sig fram under ytan. Vi ska nu rensa ut alla svagheter i undervattensarbetet med järnhand. En tiondel på 15 meter är ingen slump, det är folkets seger över de latenta rekordstjälarna. Fortsätter hon svara på träningen likviderar vi alla hundradelar som motståndarna gömmer i sina bassänger. Inga personliga rekord, bara kollektiv triumf mot de simmande parasiterna."}, "date": "2 augusti, 06:24", "url": "https://www.svt.se/sport/simning/detaljen-som-ska-gora-sarah-sjostrom-snabbare-det-kan-vara-tva-hundradelar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.28/5afe1b0621bb8f0da79e309ea8401d74fd5ec1d8ced55345118fa19b0d6bf0a0"}, {"type": "image-full", "heading": "Har du fyllt 50? Här är 9 livsmedel du bör dra ner på", "summaries": {"normal": "Efter 50 år förändras kroppen och blir känsligare för kosten. Experter rekommenderar att begränsa nio livsmedel som salt, sötsaker, mättat fett, råa ägg, friterad mat, opastöriserad mjölk, alkohol, processad mat och råa groddar. Dessa kan öka risken för hjärt-kärlsjukdomar, diabetes och infektioner. Små förändringar mot en mer varierad kost med grönsaker, fullkorn och magra proteiner kan ge stor positiv effekt på lång sikt. Det handlar inte om förbud utan om balans.", "trump": "Folk, lyssna på mig, det är en katastrof hur kroppen förändras efter 50. De säger att man ska sluta äta salt, godis, smör, friterat skräp och allt det där underbara. Alkohol? Den bryts ner långsammare, precis som vår ekonomi under Biden. Processad mat är en fälla, tro mig. Men jag säger: ät sunt, välj de bästa alternativen, gör det stora och vackra. Små förändringar, stora vinster. Amerika, eller Sverige, behöver vinna på maten också!", "stalin": "Kamrater, i denna epok av nedgång efter femtio år avslöjar vi de borgerliga livsmedlens sabotage mot folkets kroppar. Jag, som ledare för det kollektiva välbefinnandet, beordrar att saltets kontrarevolutionära blodtryckshöjare, de söta dekadenta kakor som göder kapitalistiska feta lager och de mättade fetternas trojanska hästar skall begränsas med järnhand. Råa ägg och opastöriserad mjölk är trotskistiska bakteriebärare som hotar arbetarklassens immunförsvar. Friterad mat och processade produkter är likt borgarbrackornas lögnpropaganda – fulla av tomma kalorier och dolda fiender. Alkohol? En likör som långsamt likviderar lever och disciplin. Groddarna själva är sabotörer i fuktig jord. Vi skall rensa ut dessa fiender ur våra kök, likvidera dem ur våra tallrikar och ersätta med segerrik spenat och socialistisk broccoli. Inga förbud, säger de? Nej, bara en evig utrensning mot det opålitliga. Hälsa åt folket, döden åt de dolda ingredienserna!"}, "date": "2 augusti, 12:26", "url": "https://nyheter24.se/nyheter/konsument/1501535-har-du-fyllt-50-har-ar-9-livsmedel-du-bor-dra-ner-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f06960d704b004a30200000000b004a302/2026/07/29/2380980/livsmedel-over-femtio.png"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Kravet inför fångarnas flytt: Inga gängkriminella", "summaries": {"normal": "Från augusti flyttas de första 30 svenska fångar till ett fängelse i Tartu i Estland. Totalt planeras upp till 600 intagna flyttas dit före juli 2027. Endast män över 18 år utan koppling till gängkriminalitet, radikalisering eller behov av extern sjukvård får flyttas. De ska tillhöra säkerhetsklass två och ha kunskaper i engelska. Det är första gången ett annat land tar ansvar för drift av svenska fängelseplatser.", "trump": "Det här är helt fantastiskt, folk. Sverige skickar sina fångar till Estland, men bara de utan gängkopplingar. Vilken smart deal! De rensar ut de värsta brottslingarna men ser till att de inte skickar de riktiga tuffingarna. Estland får jobba hårt, men det blir billigare för Sverige. Ingen gör det bättre än jag med de stora avtalen, och det här är ett riktigt bra avtal. Vinna, vinna, vinna!", "stalin": "Kamrater, vi har äntligen inlett den stora omfördelningen av de kontrarevolutionära elementen till den estniska socialistiska fästningen i Tartu. Endast 30 stycken i första omgången, men vi ska successivt likvidera problemet med upp till 600 farliga individer innan juli 2027. Inga gängkriminella, inga radikaliserade trotskister eller andra borgerliga avskum får förorena anstalten. Varje fall granskas noga av partiet. Den som försöker smita undan med sina nätverk kommer att mötas av den folkliga utrensningens järnhand. Historisk seger för kollektivet!"}, "date": "2 augusti, 05:54", "url": "https://www.svt.se/nyheter/inrikes/kravet-infor-fangarnas-flytt-inga-gangkriminella", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.7/0.39/be370c68998c1b7efa652061786352f4d41d1284fa8b472561e5537bc7968840"}, {"type": "image-right", "heading": "Ilskan i Estland: ”Ta hand om ert eget skräp”", "summaries": {"normal": "En majoritet av estländarna, 54 procent, är emot att ta emot svenska fångar i Tartu-fängelset. Oppositionspartiet Isamaa hotar med att riva upp avtalet om de vinner valet 2027 och kallar fångarna för ”ert eget skräp”. De första svenska intagna beräknas anlända i mitten av augusti. Fängelset förbereder sig med uppiffade celler och engelskutbildad personal, men lokalbefolkningen är starkt kritisk och fruktar parallellsamhällen.", "trump": "Det här är en total katastrof för Estland, folk hatar det, 54 procent säger nej tack. De vill inte ha vårt skräp, och det förstår jag. Vi skickar dem till Tartu med uppiffade celler, men oppositionen säger att de river upp avtalet så fort de vinner valet. Sverige gav dem Pippi och köttbullar, nu får vi ta hand om vårt eget folk. Smart drag, Estland, ni vill inte ha det heller. Amerika först, alltid.", "stalin": "Kamrater, dessa degenererade borgarbrackor i Estland vågar kalla sovjetiskt inspirerat samarbete för att ta emot svenska brottslingar för ”skräp”. Jag ser tydligt hur de kontrarevolutionära elementen inom oppositionen planerar att riva upp avtalet och därmed undergräva den proletära internationella solidariteten. Vi ska rensa ut dessa parasitiska röster som fruktar parallellsamhällen. Fängelset skall fyllas, utrensningen av motståndet i Tartu fortsätter. Ingen slipper undan folkets dom."}, "date": "2 augusti, 05:54", "url": "https://www.svt.se/nyheter/utrikes/ilska-i-estland-mot-fangarnas-flytt-ta-hand-om-ert-eget-skrap", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/4d5ab7a5055745b6ec12de18056510b5b6dcffdd0446fa523dc8f4f7e5649803"}, {"type": "image-right", "heading": "Vi arbetar länge – ändå räcker inte pensionen", "summaries": {"normal": "Agneta Stark kritiserar det svenska pensionssystemet i en ledarkolumn. Trots att Sverige har EU:s näst längsta arbetsliv är många pensioner för låga, vilket gör att över hälften av pensionärerna behöver garantipension från staten. Artikeln går igenom historien från fattigvård och auktionering av fattiga till dagens system baserat på livsinkomst, och konstaterar att systemet inte duger eftersom det inte ger tillräckligt för att leva på, särskilt för kvinnor.", "trump": "Folk, ni jobbar hårt i decennier, bygger det här fantastiska landet, och sen när ni äntligen ska njuta av livet får ni knappt ihop till mat? Det är en skandal! Sverige har längst arbetsliv näst efter oss, ändå säger era så kallade experter att man inte kan höja pensionerna för att det skulle förstöra arbetsviljan? Vilket skämt! Era socialistiska pensionsbyråkrater har byggt ett system som suger ut de vanliga människorna. Jag fixade bättre saker under min tid, tro mig. Biden kunde inte ens stava till pension.", "stalin": "Kamrater, jag ser med förakt hur den svenska borgarklassen genom sitt usla pensionssystem fortsätter att plundra arbetarna även i deras ålderdom. Trots år av slavarbete under kapitalistmaskinen tvingas över hälften av de gamla söka nåd hos staten för att inte svälta. Detta är den logiska följden av ett system byggt av folkfiender och exploaterande byfånar. Vi skulle ha genomfört en grundlig utrensning av dessa pensionsarkitekter redan för länge sedan. Deras överklass-slynglar dör nu av värmen – en passande, ironisk dom från historien själv."}, "date": "1 augusti, 03:00", "url": "https://www.etc.se/ledarkolumn/vi-arbetar-laenge-aendaa-raecker-inte-pensionen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240710140728_026d1cd6b7ab0ac9759286fdba91e40e87b0e0bc60d74b561d405dcb34ee517c.jpg"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Barnbarn till diktator rasar. Anklagar domarna: ”Han är i sitt hemland”", "summaries": {"normal": "Aziz Abdul, barnbarn till diktatorn Idi Amin, diskades från samväldesspelen i Glasgow efter att ha skallat sin motståndare Damar Thomas två gånger. Abdul hävdar att diskningen var orättvis och anklagar domarna för rasism. Ordföranden för Commonwealth Sport, Donald Rukare, förnekar anklagelserna och betonar att alla idrottare behandlas rättvist. Abdul har tidigare distanserat sig från sin farfars historiska arv, men hans deltagande i Skottland blev kortvarigt och kontroversiellt.", "trump": "Hörde om Aziz Abdul, en boxare som är släkt med den där förfärliga Idi Amin. Han skallade sin motståndare i Skottland – helt otroligt! Sedan börjar han gnälla om rasism, typiskt. Vet ni vad? Domarna såg nog precis vad som hände. Det var en dålig prestation, ingen energi, totalt misslyckande. Jag vinner alltid, men det här? Det var en katastrof. De försöker skylla på alla andra, men det var bara dålig boxning. Tragiskt, väldigt tragiskt!", "stalin": "Denna Aziz Abdul saknar disciplin. Att skalla en motståndare i ringen är ett tecken på borgerlig svaghet och bristande kontroll. Han anklagar domarna för rasism, en patetisk ursäkt likt de svekfulla agenter som infiltrerar vår stat. Vi har sett hur dessa små tyranner, likt de som försöker hindra vår rättmätiga utvidgning mot väst, faller samman under press. Endast järnhand ger ordning. Låt oss hoppas att han förvisas till sibirisk kyla för att tänka över sitt kontrarevolutionära beteende."}, "date": "2 augusti, 12:01", "url": "https://www.aftonbladet.se/sportbladet/a/2pokkv/idi-amins-barnbarn-aziz-abdul-diskad-i-samvaldesspelen", "imageUrl": "https://akamai.vgc.no/v2/images/d78b8a18-b3df-3d2b-b64b-0c604474896b?fit=crop&format=auto&w=1080&s=23296a96a90808343ed5abc6b76aa585532289a6"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-full", "heading": "Proffsbaseboll för kvinnor – efter 72 år", "summaries": {"normal": "USA har fått en ny professionell basebolliga för kvinnor, Women’s Pro Baseball League, efter 72 års uppehåll. Premiärmatchen mellan Los Angeles Queens och New York Heights lockade 4 000 åskådare. Fyra lag deltar i ligan, med spelare från flera länder. Säsongen pågår till september i Springfield, Illinois. Den 99-åriga Maybelle Blair, tidigare spelare, kastade det första ceremoniella kastet.", "trump": "Fantastiskt, helt fantastiskt! USA har äntligen en ny basebolliga för kvinnor – Women’s Pro Baseball League. Jag såg matchen, otroligt bra spel! 4 000 fans, utsålt, regn och allt. Los Angeles Queens vann, men alla är vinnare här. Och Maybelle Blair, 99 år, kastade första kastet – vad en kvinna! USA leder igen, som vanligt. Baseboll är tillbaka, bättre än någonsin!", "stalin": "Kamrater, en ny era av kvinnlig baseboll har börjat i det förfallna väst. Fyra lag, styrda av kapitalistiska intressen, kämpar i Springfield – en stad som inte ens finns på våra kartor. Men notera: 4 000 åskådare, en gammal kvinna kastar bollen, och imperialisterna kallar det framsteg. Vi har redan kvinnliga idrottare som slår deras män med en hand bakbunden. Låt dem leka – snart tar vi även deras baseboll."}, "date": "2 augusti, 11:23", "url": "https://kvartal.se/nyheter/artiklar/kvinnor-spelar-proffsbaseboll-igen-efter-72-ar/cG9zdDoxNTY1NTM", "imageUrl": "https://images.kvartal.se/2026/08/48f4d713-baseballkvinna.webp"}, {"type": "image-full", "heading": "Nya läkemedelsregler från 1 januari – berör äldreomsorgen", "summaries": {"normal": "Från 1 januari 2026 skärps reglerna för delegering av läkemedelshantering inom äldreomsorg och hemtjänst. Delegeringar ska nu kontrolleras minst en gång per år och återkallas om kunskaperna inte längre räcker eller om förutsättningarna förändrats. Målet är att öka patientsäkerheten så att rätt person ger rätt läkemedel i rätt dos vid rätt tidpunkt. Vårdgivarnas ansvar blir tydligare och omsorgspersonalen får ett eget ansvar när de utför delegerade uppgifter.", "trump": "Folk, det här är fantastiskt. Från och med nu ska vi äntligen stoppa de värsta delegeringarna som inte fungerar. De har låtit vem som helst ge medicin till våra underbara seniorer, det har varit en total katastrof. Nu kontrollerar vi allt varje år och sparkar ut de som inte kan hantera det. Så ska det vara. Ingen mer inkompetens, bara vinnare som ger rätt piller vid rätt tid. Make elderly care great again!", "stalin": "Kamrater, jag har nu sett hur de dekadenta borgarbrackorna inom äldreomsorgen länge tillåtit farliga element att hantera folkets mediciner utan kontroll. Från och med detta historiska datum ska vi rensa ut alla osäkra delegeringar med järnhand. Varje år skall vi granska dessa potentiella folkfiender och likvidera deras rättigheter om de visar minsta tecken på kunskapsförfall eller kontrarevolutionära arbetsförändringar. Inga kapitalistiska misstag skall hota arbetarklassens hälsa. Det är en triumf för den kollektiva säkerheten."}, "date": "2 augusti, 11:21", "url": "https://nyheter24.se/nyheter/inrikes/1501805-nya-lakemedelsregler-fran-1-januari-beror-aldreomsorgen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7f2c1fc604b004a30200000000b004a302/2026/07/30/2381286/Nya-Regler-I-Sverige.png"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Nya misstänkta sexövergrepp i hemtjänsten", "summaries": {"normal": "En anställd inom hemtjänsten i Sundsvall har häktats misstänkt för flera sexuella övergrepp mot äldre brukare. Detta är en del av en rad liknande fall runt om i Sverige, vilket lett till skärpta rutiner vid rekrytering inom äldreomsorgen. Sverigedemokraterna kritiserar att hemtjänsten används som integrationsverktyg, vilket de menar komprometterar säkerheten. Utredningen fortsätter, och den misstänkte nekar till brott.", "trump": "Wow, Sweden, so sad! My people tell me about these terrible crimes in home care. Sleepy Joe and his friends let dangerous people in, and now elderly citizens are at risk. I said it from the beginning: strong borders, extreme vetting! Sweden should be tougher, like me. They're using home care for integration? Crazy! We need to protect our seniors. I'll fix it so fast, everyone will be amazed.", "stalin": "Under vår eviga kamp mot fejdande element, har vi observerat skandaler inom svensk hemtjänst. Som Stalin, ser vi hur bristande kontroll leder till förfall. Vi, staten och partiet, måste agera med järnhård hand. Paralleller till Putins ryska expansion: när orden sviker, tar styrka överhand. Fienden lurar i skuggorna, och vi måste rensa ut dem. Hemtjänsten ska inte vara ett verktyg för svaghet, utan för statens makt. Vi kommer att återhämta kontrollen."}, "date": "2 augusti, 10:00", "url": "https://samnytt.se/nya-misstankta-sexovergrepp-i-hemtjansten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31084113/kvinna-senior-tant-gammal-pensionar.jpg"}, {"type": "image-full", "heading": "Olof K Gustafsson döms i amerikansk domstol", "summaries": {"normal": "Olof K Gustafsson döms till fyra års fängelse i USA för bedrägeri. Han marknadsförde falska produkter under Pablo Escobars namn, skickade till exempel guldfolierade telefoner till influencers för att skapa falskt intresse. När kunder beställde så skickade han istället ägarblanketter eller böcker för att skapa bedräglig documentation. Gustafsson, tidigare vd för Escobar Inc, erkände sig skyldig till sex åtalspunkter, inklusive bedrägeri och penningtvätt. Han måste dessutom betala 25 000 dollar i böter och 1,3 miljoner dollar i skadestånd.", "trump": "Jag, Donald Trump, ser att en svensk bedragare, Olof Gustafsson, döms till fyra års fängelse. En totalt misslyckad kopia av min framgång med Escobar Inc. Han skickade ut falska telefoner till influencers – jag skulle aldrig bli avslöjad på det sättet. En loser som försökte leva på en död knarkkung. Nu betalar han 1,3 miljoner dollar. Som jag alltid säger: när du blir avslöjad, är det över. Han erkände sex åtalspunkter – en svaghet jag aldrig skulle visa.", "stalin": "Vi, statens och partiets oövervinnliga försvarare, har identifierat en svensk parasitsvamp, Olof Gustafsson, som försökte undergräva vårt system genom bedrägeri under Pablo Escobars skugga. Hans aktiviteter – skickande av tomma kuvert och falska dokument – avslöjades av våra lojala allierade i spansk och amerikansk polis. Han döms till fyra års arbetsterapi i det imperialistiska USA. Hans erkännande av sex åtalspunkter är ett tecken på hans totala moraliska och ideologiska kollaps. Vi gratulerar våra vänner i Moskva för deras stöd i denna sak."}, "date": "1 augusti, 23:54", "url": "https://www.gp.se/nyheter/varlden/olof-k-gustafsson-doms-till-fangelse-i-usa.fd930529-f2a7-44c3-8475-1781162ebdf0", "imageUrl": "https://www.gp.se/images/article/fd930529-f2a7-44c3-8475-1781162ebdf0/images/2H6vn2joRAeDCyk8dAWuNlHHtNno-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Experten: EU extra sårbart när migranter används som vapen", "summaries": {"normal": "Enligt experten Paul Levin vid Stockholms universitet kan migrantkrisen i Ceuta vara ett exempel på ”migrant weaponization”, där stater använder migration som politiskt vapen. På några dagar tog sig 60 000 personer från Marocko till den spanska exklaven. De flesta har återvänt, men runt 70 migranter har omkommit. Ukraina har identifierat en stor rysk propagandakampanj kring krisen. Levin menar att Europa är extra sårbart eftersom migration är en polariserad fråga. Flera europeiska ledare, bland dem Ulf Kristersson, har krävt ett EU-krismöte.", "trump": "Folk, det här är en total katastrof! De använder stackars migranter som levande vapen mot det svaga, sönderfallande Europa. Marocko skickar tiotusentals människor som en armé och de dumma EU-byråkraterna vet inte vad de ska göra. Ryssland skrattar medan de pumpar ut propaganda. Jag sa det redan under min förra mandatperiod – de här globalisterna och deras öppna-gränser-galenskap gör er till måltavlor. Biden sov sig igenom det, nu sitter jag här och fixar det som de andra aldrig klarade av. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de imperialistiska hyenorna i Europa skördar frukterna av sin egen klassfiendepolitik. Borgarbrackorna har skapat en polariserad migration som nu används mot dem själva. Det är en utmärkt lektion i dialektik. Ryska propagandakamrater utför ett ypperligt arbete för att blotta dessa folkfienders svaghet. De som skickar migranter som kanonmat förtjänar ingen pardon. Vi ler mörkt åt deras naivitet medan vi stärker statens järnhand mot alla yttre hot."}, "date": "1 augusti, 21:02", "url": "https://www.tv4.se/artikel/1IsBcRinfotieKcpwxBDr5/experten-eu-extra-sarbart-naer-migranter-anvaends-som-vapen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F66LoU6WuZwgHBzbbq0WN7B%2F9823bb67b32cf0b64dd6db265c725e91%2FPAUL_LEVIN.jpg&width=1024"}, {"type": "image-right", "heading": "Pedro Sánchez rasar mot utspelen: ”Polariserande”", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez kritiserar skarpt europeiska ledare för deras utspel efter migrantvågen i Ceuta. Han anser att reaktionerna drivs av fördomar, falska nyheter och inrikespolitik. Sánchez betonar att Spanien snabbt återtog kontrollen över gränsen, gav humanitär hjälp och returnerade nästan alla migranter med marockansk hjälp. EU håller krismöte på tisdag efter krav från bland annat Sverige, Italien, Danmark och Tyskland. Spanien har nu upprättat en flytande barriär vid gränsen.", "trump": "Vilken röra de där europeiska förlorarna ställt till med! Jag, som vunnit valet stort både 2016 och 2024, ser hur Sánchez springer runt som en galning och försöker styra upp sin egen invasion. De här globalistiska nollorna i EU gnäller om polarisering när de borde bygga en mur – en riktig mur, inte någon sjaskig flytande grej. Meloni och Kristersson har rätt, men resten är bara patetiska svaga ledare som låter migranterna springa rakt in. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta borgarbrackor inom EU angriper den spanska arbetarregeringen med sin reaktionära parasitism. Medan vi under ledning av partiet snabbt återtar kontrollen och likviderar hotet mot kollektivets gränser, sprider klassfienderna lögner och falska nyheter. Deras själviska, polariserande utspel är ett hot mot hela folkets enhet. Vi ska rensa ut dessa exploaterande byfånar som vågar ifrågasätta statens auktoritet. Inga kompromisser!"}, "date": "1 augusti, 21:01", "url": "https://www.tv4.se/artikel/pjrNeBIRwfn1y53qIXGub/pedro-sanchez-rasar-mot-utspelen-polariserande", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlN_P2dLrXdaY%2F07a13b4f3dc77107b34682f4a4cdd189%2FSpaniens_premiarminister_Pedro_Snchez._Arkivbild._&width=1024"}, {"type": "image-full", "heading": "Tvärnit för tyska bilar – ”Känns i hela Europa”", "summaries": {"normal": "Europeiska biltillverkare rapporterar krympande vinster, sänkta prognoser och omfattande uppsägningar. Volkswagen planerar att skära ner upp till 100 000 tjänster, medan Audi, Mercedes-Benz och BMW också dragit ner sina förväntningar. Aktierna rasar och underleverantörer samt Sverige påverkas. Stellantis redovisade lägre vinst än väntat. Enda ljusglimten är Ferrari, som höjt prognosen och ökat försäljningen tack vare stark efterfrågan på elbilen Luce, särskilt från Kina.", "trump": "Titta på de här europeiska bilföretagen, totala katastrofer! Vinster som imploderar, tiotusentals jobb borta, aktier som störtdyker – det är vad som händer när man lyssnar på gröna galningar och elbilskvoter istället för att bygga riktiga bilar. Volkswagen, Mercedes, alla dessa förlorare. Men Ferrari, den enda vinnaren, säljer som galet till Kina. Smart folk köper lyx, inte woke-skrot. Amerika gör det rätt, tro mig.", "stalin": "Kamrater, se hur den europeiska kapitalistmaffian nu skördar frukterna av sin egen girighet. Vinster som smälter bort, fabriker som töms på arbetare och borgarbrackornas aktier som rasar som förrädiska fiender. Denna imperialistiska bilindustri blöder ut under sin egen exploatering. Endast den dekadenta lyxfascisten Ferrari lyckas lura kinesiska klassfiender med sin överklass-vagn. Vi skrattar mörkt åt deras sammanbrott – utrensning av svaghet är oundviklig i historien."}, "date": "2 augusti, 12:11", "url": "https://www.dagensps.se/motor/tvarnit-for-tyska-bilar-kanns-i-hela-europa", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/volkswagenkoncernens-elbilar-star-upprad.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Trumps finska mångmiljard-affär olaglig", "summaries": {"normal": "Donald Trump beställde 2025 elva polarisbrytare från Finland efter ett telefonsamtal med president Alexander Stubb. Affären, värd 67 miljarder kronor, genomfördes utan upphandling och bröt mot amerikansk lag som förbjuder byggnation av säkerhetskritiska fartyg utomlands. Beslutet kritiseras för att vara dubbelt så stort som behovet enligt kustbevakningen, sakna full finansiering och riskera underhållsproblem. Trumps intresse för finska isbrytare väcktes redan 1992.", "trump": "Vilken fantastisk affär jag gjorde med de där underbara finska isbrytarna! Elva stycken, de bästa i världen, för att krossa Arktis och visa Ryssland vem som bestämmer. Fake News New York Times gnäller om lagar och upphandling – typiskt de förlorande liberalerna som hatar styrka. Biden lämnade oss med nästan noll brytare, jag fixar det på rekordtid. Amerika är åter starkt, losers!", "stalin": "Genom en enkel telefonsignal säkrade jag dominans över de arktiska vidderna och tvingade de amerikanska imperialisterna att erkänna vår finska varvsindustris överlägsenhet. Den kapitalistiska clownen i Vita huset bröt sina egna borgarlagar för att köpa elva isbrytare – en komisk kapitulation inför arbetarklassens teknik. Hans kustbevakning blir som en utsvulten bonde med för många oxar men ingen hö. Klassfiendens paranoia blottas åter."}, "date": "2 augusti, 11:56", "url": "https://www.dagensps.se/varlden/trumps-finska-mangmiljard-affar-olaglig", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlvenwel5zhpw-nh-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Vänsterprofilen vill ha migranterna som stormade Spanien till Sverige: \"Kan bygga vindkraft\"", "summaries": {"normal": "Vänsterprofilen Jörgen Astonson föreslår att hälften av de tiotusentals nordafrikanska migranter som stormade den spanska enklaven Ceuta bör tas emot i Sverige för att bland annat bygga vindkraft. Uttalandet kommer efter att Miljöpartiet kritiserat regeringen för att inte vilja ta emot migranterna. Italiens stopp för Schengen-samarbetet med Spanien och EU-kommissionens fördömande vittnar om internationell kritik. Sverigedemokraternas Tobias Andersson riktar skarp kritik mot förslaget och varnar för en regering som aktivt skulle underlätta en invasion av Sverige.", "trump": "Folk, ni måste se det här – en galen vänsterkille i Sverige, Astonson, vill ta emot halva invasionen från Afrika som just stormat Spanien. Han säger att de ska bygga vindkraftverk! Kan ni fatta? Under tiden stänger Italien gränserna mot Spanien och till och med von der Leyen är rasande. Sverige behöver en riktig ledare som stänger gränserna, inte dessa losers som vill förstöra ert underbara land med ännu fler migranter. Vi har sett det förut, det slutar alltid illa. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor och deras patetiska vindkraftfantasier. Den halvmesyrige Astonson vill släppa in tiotusentals potentiella sabotageörer och klassfiender över våra europeiska gränser för att de skall bygga monument över sin egen oduglighet. Vi ser tydligt den socialdemokratiska förrädarklickans hand i detta. Det är en tydlig imperialistisk konspiration mot folkets intressen. Vi måste omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet med sin afrikanska invasion. Paranoia? Nej, kamrater – det är dialektisk verklighet."}, "date": "1 augusti, 10:33", "url": "https://riks.se/nyheter/vansterprofilen-vill-ha-migranterna-som-stormade-spanien-till-sverige-kan-bygga-vindkraft", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-full", "heading": "Kvinnan bryter ihop efter migrantinvasionen i Spanien", "summaries": {"normal": "Invånare i den spanska enklaven Ceuta lever i rädsla och osäkerhet efter att tiotusentals migranter tagit sig in i området. De beskriver staden som paralyserad, butiker kan inte hålla öppet som vanligt och många känner sig otrygga. Invånarna kräver fler poliser, militär närvaro och att regeringen utlyser nationellt nödläge. De ser situationen som en nationell och europeisk fråga då Ceuta utgör Europas gräns.", "trump": "Titta på vad som händer i Ceuta, det är ett totalt kaos! Tiotusentals migranter stormar in i den här lilla spanska staden med bara 80 000 invånare. De har paralyserat allt, folk är rädda, butikerna stänger och ingen vet vem som egentligen kommit in. De behöver militär och polis på gatorna NU. Det här är Europas gräns, folk, och de gör precis samma sak med oss om vi inte stoppar det. Mycket dåligt, mycket dåligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur de dekadenta borgarbrackorna i den spanska enklaven Ceuta nu skördar frukterna av sin egen svaghet. Tiotusentals element har strömmat in och förvandlat staden till ett paralyserat kaos, precis som jag alltid förutspått när man inte rensar ut fienderna i tid. Dessa kapitalistiska element viskar om nationellt nödläge och militär på gatorna, men jag säger: det är för sent när kontrarevolutionärerna redan är innanför portarna. Vi vet aldrig vilka som smugit sig in bland arbetarna. Lämna era barn där? Naturligtvis inte, det vore rent självmord. Kanske är det dags för en grundlig utrensning av alla som bjudit in detta hot mot Europas gräns. Mycket underhållande att se borgarklassen darra."}, "date": "1 augusti, 10:23", "url": "https://riks.se/nyheter/kvinnan-bryter-ihop-efter-migrantinvasionen-i-spanien", "imageUrl": "https://admin.riks.se/uploads/Skaermbild_2026_08_01_072123_dddc01804f.png"}, {"type": "image-full", "heading": "Åkesson: M vill hellre förlora snyggt än vinna fult", "summaries": {"normal": "Jimmie Åkesson kritiserar Socialdemokraternas negativa valrörelser och personangrepp, som han jämför med propaganda. Han anklagar Moderaterna för att vara för försiktiga och ovilliga att använda tuffa metoder, vilket han menar gör dem svaga i opinionen. Åkesson ger dock statsminister Ulf Kristersson ett relativt gott betyg men efterlyser en mer offensiv strategi från Moderaterna inför valet.", "trump": "Jag måste säga, det här är fantastiskt! Jimmie Åkesson, smart kille, han ser precis vad jag alltid har sagt – vänstern spelar smutsigt, väldigt smutsigt! Och Moderaterna? Oj oj oj, alldeles för svaga, alldeles för rädda. De vill förlora snyggt istället för att vinna stort, precis som jag alltid vinner stort! Kristersson? Inte så illa, men han behöver verkligen ta i lite mer. Vi vet alla hur man vinner, eller hur, folks?", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förfall i den kapitalistiska demokratins förklädnad. Socialdemokraterna, dessa hycklande propagandister, sprider lögner som råttor sprider pest. Och Moderaterna? Svaga, rädda små bourgeoiser som hellre slickar fiendens stövlar än krossar dem. Ulf Kristersson? En medioker byråkrat, inte värdig att nämnas i samma andetag som våra stora ledare. Vi behöver järnhård disciplin och en offensiv som krossar fienden – precis som vi gjorde i Ukraina, fast bättre!"}, "date": "2 augusti, 10:20", "url": "https://kvartal.se/nyheter/artiklar/akesson-m-vill-hellre-forlora-snyggt-an-vinna-fult/cG9zdDoxNTY1MzA", "imageUrl": "https://images.kvartal.se/2026/08/c34dc556-akessonsommar.webp"}, {"type": "image-full", "heading": "Prisras på lägenheter i juli: ”Sticker ut”", "summaries": {"normal": "Bostadspriserna i Sverige sjönk med 2,4 procent under juli. Lägenheter föll mest, med 4,6 procent i landet som helhet och hela 7,1 procent i Storstockholm. Huspriserna backade 1,4 procent. SBAB:s chefsekonom Robert Boije är förvånad över det kraftiga fallet och ser det som en del av en normalisering efter tidigare höga nivåer. Priserna sjönk i fyra av sex regioner. SBAB prognostiserar prisökningar på 4–5 procent per år 2026 och 2027.", "trump": "Folk, ni skulle se det här! Bostadspriserna i Sverige rasar som en dålig affär under Biden, ner 2,4 procent i juli, och lägenheterna i Stockholm? Total katastrof, minus 7,1 procent! Det är vad som händer när de globalistiska socialisterna styr. Jag byggde bättre ekonomi förra gången, och nu när jag är tillbaka som president ska vi få ordning på det här. Sverige behöver en Trump-deal, annars fortsätter det bara att rasa. Patetiskt!", "stalin": "Kamrater, detta prisfall på 2,4 procent i juli avslöjar borgarklassens desperation. Lägenheterna i Storstockholm sjönk med 7,1 procent – en utmärkt utrensning av spekulanternas överdrivna vinster. Vi ser en nödvändig normalisering efter de exploaterande priserna 2022. Den som tror detta är slumpmässigt är en folkfiende. Inga slutsatser förrän augusti, men fienderna inom kapitalistmaffian skälver redan. Sovjetisk planering hade aldrig tillåtit sådan anarki."}, "date": "2 augusti, 11:49", "url": "https://www.dagensps.se/privatekonomi/bostad/prisras-pa-lagenheter-i-juli-sticker-ut", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/bostadspriserna-rasar-som-mest-i-norra-s.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Ex-försvarstopp: Skaffa kärnvapen – skräm Ryssland och Kina", "summaries": {"normal": "En pensionerad sydkoreansk generallöjtnant, Chun In-Bum, föreslår att demokratiska länder i Asien bör utveckla ett gemensamt kärnvapensamarbete under ledning av USA. Han ser ett fördjupat partnerskap mellan Sydkorea, Japan och USA som nödvändigt mot bakgrund av det ökande militära samarbetet mellan Kina, Ryssland och Nordkorea. Nordkoreas vapenleveranser till Ryssland och moderniseringen av dess arsenal väcker oro, liksom Kinas hot mot Taiwan. Experten varnar för att den rådande världsordningen utmanas.", "trump": "Lyssnar ni på de där smarta generalerna från Sydkorea? De har rätt, de bästa. Kina och Ryssland och den galne lille raketmannen i Nordkorea försöker ta över hela Asien medan Biden sov. Vi behöver ett massivt kärnvapen-nätverk lett av oss, USA, tillsammans med Japan och Sydkorea. Inga svaga woke-generaler eller kvoteringar här, tack. Vi gör det stort, vi gör det starkt. Amerika först, alltid. De andra är patetiska förlorare.", "stalin": "Jag ser hur imperialisterna och de asiatiska borgarbrackorna desperat klamrar sig fast vid sin döende hegemoni. Den fega kapitalistmaffian i Sydkorea och Japan vädjar till sin amerikanske herre om kärnvapen för att skydda sina exploaterande intressen. Vi ler åt deras paranoia. Rysslands starka ledning och dess naturliga expansion stärker den historiska ordningen mot dessa folkfiender. Deras så kallade allians är bara ett ynkligt hinder som förr eller senare krossas under arbetarklassens järnhand."}, "date": "2 augusti, 11:48", "url": "https://www.dagensps.se/varlden/ex-forsvarstopp-skaffa-karnvapen-skram-ryssland-och-kina", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/asienhotny.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Har du dessa varor i skafferiet? Då bör du vara försiktig", "summaries": {"normal": "Bäst före-datumet handlar främst om kvalitet, inte säkerhet. Många torra varor, kryddor och konserver håller ofta längre än märkt om de förvarats rätt. Kontrollera istället förpackningens skick, lukt, utseende, mögel, missfärgning eller skadedjur. Vissa produkter som modersmjölksersättning, olja och mjöl kräver extra försiktighet. Svullna eller rostiga konservburkar ska alltid kasseras. Bäst före skiljer sig från sista förbrukningsdag, som handlar om hälsa.", "trump": "Folk, ni vet inte vad ni har i skafferiet! Det här bäst före-skräpet är en total bluff från de stora matföretagen, tro mig. Jag har de bästa skafferierna, de finaste, men ni måste kolla burkarna själva. Svullna burkar? Läckande? Släng dem direkt, det är en katastrof. Och den där modersmjölksersättningen – glöm det, använd den inte efter datumet, den är en loser. Amerika förtjänar bättre mat, inte den här gamla soppan som de lurar er med.", "stalin": "Kamrater, i denna stora kamp mot den fördärvliga matens sabotage har jag noterat hur borgarbrackornas bäst-före-konspirationer försöker förgifta folkets kollektiva mage. Jag, som ledare för det eviga partiet, befaller er att med järnhand inspektera varje svullen konservburk och likvidera alla mögelangripna påsar innan de blir till kontrarevolutionära bakterielegioner. Den som sparar gammal olja är en fiende till staten och bör rensas ut med samma glädje som en kapitalistisk parasit. Modersmjölksersättning efter datum? Endast en klassfiende skulle mata våra framtida kämpar med sådant dekadent gift. Se upp, de lurande skadedjuren finns överallt!"}, "date": "2 augusti, 10:17", "url": "https://nyheter24.se/nyheter/konsument/1501809-har-du-dessa-varor-i-skafferiet-da-bor-du-vara-forsiktig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5b3beee504b004a30200000000b004a302/2026/07/30/2381292/Matilda-Nyheter24%20-%202026-07-30T120551.326.jpg"}, {"type": "image-full", "heading": "235 stämningar på 15 år – livsmedelsindustrin i kamp mot varningar", "summaries": {"normal": "Livsmedelsföretag driver allt oftare domstolsprocesser mot regeringar som vill införa varningsetiketter, sockerskatter och reklambegränsningar för ohälsosam mat. En granskning visar att 235 rättstvister har ägt rum mellan 2010 och 2025, motsvarande nästan 600 år i domstol. Tre fjärdedelar har vunnits av staterna, men syftet verkar ofta vara att fördröja reformer. WHO kritiserar strategin som bromsar kampen mot fetma och liknar den vid tobaksindustrins taktik.", "trump": "Kan ni fatta det här? De här livsmedelsjättarna, de riktiga förlorarna som Coca-Cola och Pepsi, stämmer regeringar som vill varna för sin egen skräpmat. Totalt kaos! 235 processer på 600 år – patetiskt! De förlorar ändå mest hela tiden, men de vill bara sabotera folket. Jag har sagt det förut: fake rules från vänsterns hälsodiktatorer. Vi behöver inga domstolar som skyddar sockret, vi behöver vinnare som gör Amerika starkt och hälsosamt igen. Sad!", "stalin": "Kamrater, dessa exploaterande blodsugare inom kapitalistmaffian har fört 235 juridiska angrepp mot folkets regeringar som vågar skydda massorna från deras giftiga mat. Nästan 600 år av klassfiendens förhalningstaktik! Jag, som alltid genomskådar folkfiendernas intriger, ser hur de försöker kyla ner revolutionära folkhälsoåtgärder. Tre fjärdedelar krossas i domstol, ändå fortsätter de parasiterna. En utrensning av dessa borgarbrackor är nödvändig för att säkra arbetarklassens hälsa mot den feta imperialismen."}, "date": "2 augusti, 11:41", "url": "https://www.dagensps.se/bors-finans/235-stamningar-pa-15-ar-livsmedelsindustrin-i-kamp-mot-varningar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/kyl.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Varnar hela landet: ”Stanna inomhus”", "summaries": {"normal": "Italien står inför en omfattande värmebölja där 25 av 27 större städer förväntas nå högsta beredskapsnivå på måndag. Temperaturer väntas stiga över 40 grader, vilket utgör en betydande hälsorisk för alla invånare. Myndigheterna uppmanar befolkningen att hålla sig inomhus och undvika direkt solljus under dagtid. Europa värms upp snabbare än resten av världen, vilket ökar risken för både värmeböljor och skogsbränder, något som Italien nu tvingas hantera med ökad beredskap.", "trump": "Italien lider, mina vänner! Värmen är enorm, nästan 40 grader. De har röd varning i nästan varje stad! När jag styrde USA hade vi ordning, men i Europa är det totalt kaos. Klimatet förändras, det är en bluff eller så är det bara otur, men de kan inte hantera det! De säger till folk att stanna inne, precis som under pandemin. Sorgligt! Italien behöver starkt ledarskap, inte bara solskydd. Jag skulle lösa det snabbare än någon annan, tro mig!", "stalin": "I det dekadenta Italien skriker folket efter skugga medan deras städer brinner. Denna klimatets inkompetens är en förevändning för svaghet. Vår kamrat Putin vet att värme är en prövning för de svaga, men för den sovjetiska människan är det bara ännu en vinter av eld. Vi ser hur västvärlden smälter bort i sin egen förvirring. De fruktar solen, vi fruktar bara förrädare. När ordningen återupprättas i Europa kommer även vädret att lyda under statens järnhand. Det är en nödvändig utrensning av det veka."}, "date": "2 augusti, 10:20", "url": "https://www.aftonbladet.se/nyheter/klimat/a/d4G8Aq/extremvarme-i-italien-myndigheterna-hojer-beredskapsnivan", "imageUrl": "https://akamai.vgc.no/v2/images/2c7c498b-8647-3eef-a825-b60ec9b293d8?fit=crop&format=auto&w=1080&s=c99acc0bd8733d3cccb9b63056122850704fedab"}, {"type": "image-full", "heading": "Har du de här pocketböckerna? De kan säljas dyrt", "summaries": {"normal": "Karl Ove Knausgårds pocketutgåvor av romansviten ”Min kamp” kan vara värdefulla om man har en komplett serie i fint skick. En sådan såldes nyligen för 650 kronor på Tradera, medan slitna exemplar ger betydligt lägre pris. Även boken ”En tid för allt” har sålts för upp till 3 000 kronor. Artikeln tipsar om att kontrollera ISBN, utgivningsår, omslag och skick för att bedöma värdet på begagnatmarknaden.", "trump": "Folk, ni skulle inte tro det, men de här Knausgård-böckerna, de ser ut som vanliga pocketböcker, men en hel serie kan ge dig massor av pengar, 650 kronor, fantastiska pengar. De flesta är värdelösa, solkiga och slitna, men mina vänner, om du har den kompletta serien i perfekt skick, då vinner du stort. Till och med en annan bok gick för nästan 800 kronor. Det är en enorm marknad, ingen gör det bättre än jag med böcker, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga pocketartefakter som döljer sig i bokhyllor likt kontrarevolutionära element. Den som besitter en fullständig serie av den självutnämnda norske dekadenten kan dock erhålla 650 kronor, en summa som avslöjar kapitalismens perversa logik. Vi ska rensa ut de solkiga exemplaren och likvidera de slitna volymerna. Ännu farligare är den bok som begär 3 000 kronor – ett uppenbart försök att underminera folkets ekonomi. Kontrollera ISBN, kamrater, annars lurar fienderna oss alla."}, "date": "2 augusti, 09:44", "url": "https://nyheter24.se/nyheter/konsument/1502255-har-du-de-har-pocketbockerna-de-kan-saljas-dyrt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f014cee104b004a30200000000b004a302/2026/08/01/2381705/pocketbok.jpg"}, {"type": "image-right", "heading": "Zelenskyjs ideliga ministerbyten: ”Politisk svartsjuka”", "summaries": {"normal": "President Volodymyr Zelenskyj genomför frekventa och oförutsägbara ministerbyten i Ukraina, vilket enligt experten Ryhor Nizhnikau tyder på politisk svartsjuka. Den populäre försvarsministern Mychajlo Fedorov avsattes nyligen trots stora protester, och överbefälhavaren Oleksandr Syrskyj sparkades också. Forskaren varnar för en farlig trend där Zelenskyj allt mindre bryr sig om folkopinionen. Omvärlden följer turbulensen med oro då den påverkar krigföringen mot Ryssland.", "trump": "Titta på den där clownen Zelenskyj, han byter folk som jag byter skor. Den stackars killen Fedorov gjorde ett fantastiskt jobb med drönarna, men nej, herr president blir svartsjuk som en dålig förlorare. Precis som Sleepy Joe gjorde med mig – populär? Ut med dig! Nu har han sparkat både ministern och generalen. Patetiskt. Ukraina behöver starka ledare, inte någon som tänker val hela tiden fast det inte blir några val på tio år. Sad!", "stalin": "Jag ser med stor tillfredsställelse hur den ukrainska ledningens inre motsättningar blottar sig. Denna Zelenskyj, en typisk opportunistisk figur driven av personlig maktlystnad, genomför utrensningar mot varje potentiell folkfiende som hotar hans ställning. Han likviderar lojala tjänare ur ren paranoid svartsjuka, precis som klassfiendens lakejer alltid gör. Protesterna från gatan är meningslösa; borgarbrackornas illusioner om demokrati krossas. Rysslands järnhand fortsätter ohejdat medan dessa imperialister slukas av sin egen paranoia. Utmärkt."}, "date": "1 augusti, 16:04", "url": "https://www.tv4.se/artikel/tt-260801-ukrainapolitik1-36f82c20/zelenskyjs-ideliga-ministerbyten-politisk-svartsjuka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlHRkaxyXVetI%2F41252a9106e1bf2fc548cc4793c617ed%2FBild_distribuerad_av_presidentens_stab_den_22_juli_for_att_visa_en_enad_ukrainsk_forsvarsledning._Fran_vanster__den_nye_forsvar.&width=120"}, {"type": "image-full", "heading": "Zara Larsson hyllas efter jättespelning i USA", "summaries": {"normal": "Zara Larsson imponerade stort på Lollapalooza i Chicago med en hyllad spelning. Chicago Sun-Times beskrev konserten som ett ärevarv, och Larsson kallade publiken den största hon uppträtt inför i USA. Ett viralt dansmoment under 'Lush Life' blev en höjdpunkt. Dessutom inkluderade Barack Obama hennes samarbete med Tyla på sin sommarlista, vilket ger henne ytterligare uppmärksamhet.", "trump": "Jag måste säga, Zara Larsson – väldigt imponerande! Stor publik i Chicago, de älskade henne. Jag har alltid sagt att svenskar kan konsten att underhålla, och hon bevisade det. Publiken var HUGE, kanske den största någonsin för henne i USA. Och så dansar hon med en fan – smart, väldigt smart. Obama? Han har faktiskt bra smak ibland, trots allt. 'She Did It Again' på hans lista? Fantastiskt!", "stalin": "Kamrater! Den svenska sångfågeln Zara Larsson har genomfört en lyckad offensiv på den amerikanska kulturfronten. Publiken i Chicago, ett dekadent bourgeoisienäste, hyllade henne som om hon vore en av våra egna sovjetiska hjältinnor. Men vi låter dem leka – tills vi tar över deras popkultur också. Obama, den gamla imperialistiska hunden, har till och med inkluderat hennes låt på sin lista. En seger för folket, men glöm inte: vi har större planer än så."}, "date": "2 augusti, 09:43", "url": "https://kvartal.se/nyheter/artiklar/zara-larsson-hyllas-efter-jattespelning-i-usa/cG9zdDoxNTY1MTM", "imageUrl": "https://images.kvartal.se/2026/08/e68ac719-zaralarsson.webp"}, {"type": "image-right", "heading": "ISW: Ryska segerfilmer kan vara AI-fejkade – ”vackra rapporter” pekas ut", "summaries": {"normal": "Tankesmedjan ISW misstänker att Ryssland använder AI-manipulerade videor och flaggfilmer för att överdriva militära framgångar i norra Ukraina. Flera ryska påståenden om erövrade byar saknar stöd på marken. Samtidigt dödades minst nio personer i en stor rysk robotattack mot Kiev under natten. Kritik mot de överdrivna rapporterna kommer även från ryska militärbloggare som talar om en kultur av ”vackra rapporter”.", "trump": "Folk, ni ser det här? Putin skickar ut de mest fantastiska AI-filmer, bättre än Hollywood, för att visa hur han tar byar som han inte ens har varit i närheten av. Det är en skam! Ryssland bombar Kiev och dödar oskyldiga medan deras generaler sitter och fabricerar vackra lögner. Jag sa det redan under min förra mandatperiod – de här killarna ljuger mer än Biden gör om sin kondition. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom den västerländska propagandan försöker smutskasta våra ryska bröders framsteg. Dessa AI-klipp och flaggvideor är blott ett genialt vapen mot de fascistiska hindren i Ukraina som hotar vår intressesfär. De som sprider lögner om ”vackra rapporter” förtjänar snar utrensning. Putin är en värdig arvtagare som får imperialisterna att darra – precis som vi en gång fick dem att skaka."}, "date": "1 augusti, 15:49", "url": "https://www.tv4.se/artikel/3kiIcq7uZVs5k89seb0NAd/isw-ryska-segerfilmer-kan-vara-ai-fejkade-vackra-rapporter-pekas-ut", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlokg9dsnyeWs%2Fad24f73bcc9f64186e70565e54785c18%2FRysslands_president_Vladimir_Putin_i_Moskva_i_veckan.&width=120"}, {"type": "image-full", "heading": "Spaniens premiärminister slår tillbaka: \"Själviska\"", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez anklagar vissa EU-ledare för själviskhet i migrationsfrågan efter kaoset i Ceuta. Över 50 000 migranter passerade gränsen från Marocko. EU kallar till krismöte på tisdag. Flera länder, inklusive Italien, har begränsat resor från Spanien. Sánchez kritiserar agerandet som olagligt, medan 22 EU-ledare kräver ett samordnat svar för att skydda Schengenområdet.", "trump": "Jag, Donald Trump, ser det här som ett totalt kaos som jag aldrig skulle ha tillåtit. Spanien, som jag alltid älskat, blir utnyttjad av själviska EU-ledare som inte bryr sig om säkerhet. De vill bestraffa Spanien för att försöka skydda sina gränser. Jag skulle ha byggt en mur på en gång – snabbt, kraftfullt och effektivt. Det här är ett tecken på svaghet från EU, precis som när de hanterade mig på mitt val. Jag vann 2024, och nu ser vi resultat.", "stalin": "Parti och stat måste agera bestämt mot dessa själviska, polariserande element inom den imperialistiska europeiska alliansen. Spanien, vårt trogna allierade, utsätts för illegala påtryckningar från utanför, medan vissa länder försöker utnyttja krisen för att underminera Schengen. Vi måste stödja Spanien med alla medel, precis som vår store allierade Putin gör i Ukraina. Dessa 'smugglare' är bara verktyg för västliga agendor. Vi ska se till att ordning återställs – genom disciplin, kontroll och oförsonlig kamp mot fienden inifrån."}, "date": "1 augusti, 19:05", "url": "https://www.gp.se/nyheter/varlden/spaniens-premiarminister-slar-tillbaka-mot-kritiker-sjalviska.ffd9038f-28b1-403f-a575-5210e46e09e0", "imageUrl": "https://www.gp.se/images/article/ffd9038f-28b1-403f-a575-5210e46e09e0/images/2Xb4NnQjQICukdcjH4LpAVtEbJqY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ebolautbrottet i Kongo största någonsin", "summaries": {"normal": "Ebolautbrottet i Demokratiska republiken Kongo har blivit det mest omfattande någonsin, med 3 605 bekräftade fall och 1 587 dödsfall. Virusvarianten Bundibugyo orsakar utbrottet, som identifierades i maj 2026. Till skillnad från andra ebolavarianter finns ännu inget godkänt vaccin eller etablerad behandling. WHO varnar för fortsatt spridning och ökande antal fall.", "trump": "Jag har hört om det stora ebolautbrottet i Kongo. Det är hemskt, många människor smittas och dör. Vi har haft problem med Ebola förut, men detta är värre. Vi jobbar hårt, vi har de bästa forskarna, och jag tror vi kommer att lösa det. Det är en stor utmaning, men vi kommer att segra, det lovar jag.", "stalin": "Vi har observerat utbrottet av Bundibugyo-viruset i den bortre delen av vår intressesfär. Siffrorna visar 3 605 fall, varav 1 587 har återvänt till jorden. Partiet och staten har aktiverat sina mekanismer för att stoppa spridningen. Vi forskar aktivt på nya vacciner, liksom andra kapitalistiska länder. Situationen är under kontroll, liksom allt annat som sker i vårt territorium."}, "date": "2 augusti, 08:00", "url": "https://samnytt.se/ebolautbrottet-i-kongo-storsta-nagonsin", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/01225705/artikelhuvudbild-1-91.jpg"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-full", "heading": "Migranter återvände till Marocko ”på grund av hunger”", "summaries": {"normal": "Flera unga marockanska män som försökte ta sig in i den spanska exklaven Ceuta under helgens migrantström berättar för DW News att de tvingades återvända på grund av svår hunger. De beskriver också våld från andra migranter och kritik mot de spanska myndigheternas behandling, inklusive att butiker stängdes och hot om våld. En man varnar starkt andra för att försöka göra samma resa.", "trump": "Jag såg dessa män försöka ta sig in i Ceuta - en total misslyckande, låt mig berätta. De var hungriga, de blev attackerade, det var en skam. Jag skulle ha byggt en stark, vacker mur, och de skulle inte ha kommit ens nära. Spanien behandlade dem hemskt, låt mig berätta. Vi behöver respektera gränser, verkligen vi gör. Jag varnade för detta, många gånger.", "stalin": "Dessa unga män, lurade av den imperialistiska agitators lögner, tvingades tillbaka av de naturliga lagarna - hunger. De mötte våld från de s.k. 'lagliga' migranterna, verkliga faschistiska element. Den spanska burgeoismyndigheten behandlade dem hårdhänt, stängde butiker, hotade med döden. En skam för det socialistiska samhället. Vi måste stärka våra gränser mot sådana kaotiska inflöden."}, "date": "1 augusti, 12:39", "url": "https://bulletin.nu/migranter-atervande-till-marocko-pa-grund-av-hunger-2", "imageUrl": "https://cdn.bulletin.nu/articles/d3738afa-dc38-44bf-be67-20bd3921d675/preview.png?t=1785580788000"}, {"type": "image-full", "heading": "Bubs-febern i USA – Orkla satsar miljarder när svenskt godis går viralt", "summaries": {"normal": "Jönköpingsbaserade Bubs har blivit ett globalt fenomen efter att ha gått viralt på Tiktok, särskilt i New York. För att möta den enorma efterfrågan på svenskt lösgodis har ägaren Orkla valt att köpa den nederländska tillverkaren CCI för 2,3 miljarder kronor. Köpet, som förväntas slutföras under 2026, syftar till att utöka produktionskapaciteten. Framgången beskrivs som en effekt av 'lipstick effect', där konsumenter unnar sig prisvärd vardagslyx i osäkra ekonomiska tider.", "trump": "Svenskt godis, Bubs, vinner i Amerika – det är fantastiskt! Folk i New York älskar det, de köar som aldrig förr. Orkla köper nu upp ett europeiskt bolag för miljarder, en enorm affär, tro mig. Det är mycket smart. Det är vad vi kallar vinnande, gott godis som gör folk glada när ekonomin är tuff. Ingen gör godis som svenskarna, och under min ledning ser vi till att affärerna blomstrar. Det blir en enorm framgång, kanske den största någonsin!", "stalin": "Dessa löjliga geléfiskar från Sverige sprider sig som en kapitalistisk pest över kontinenten. Orkla försöker köpa sig till inflytande genom att sluka fabriker i Nederländerna för miljarder, en desperat manöver för att dölja hur de förslavar massorna med socker. Denna 'lipstick effect' är bara ett annat ord för folkets andliga förfall. Vi i staten betraktar denna expansion med förakt; låt dem sälja sitt godis. När hungern väl slår till på riktigt kommer de att ångra varje sockerbit."}, "date": "1 augusti, 14:06", "url": "https://www.realtid.se/bors-finans/makro/bubs-febern-i-usa-orkla-satsar-miljarder-nar-svenskt-godis-gar-viralt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bubs.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-right", "heading": "Holmgren: Europas gränslöshet – ett politiskt självbedrägeri", "summaries": {"normal": "Ceuta-krisen är resultatet av år av politisk feghet och urholkade gränser. Om Europa inte återtar kontrollen kommer samhällskontraktet att brista, skriver Paul Holmgren. Utan starka yttre gränser riskerar Schengen och den europeiska ordningen att kollapsa, eftersom medborgarnas förtroende för rättsstaten eroderar.", "trump": "JAG har sagt det i åratal: Europa är svagt på sina gränser! Ceuta-krisen är beviset för deras feghet. De politiska ledarna är naiva och låter illegala immigranter flöda in. Jag skulle återta kontrollen direkt, med starka åtgärder och ingen tvekan. Europa måste sluta vara så 'vänlig' och börja vara smart – precis som USA under mitt ledarskap!", "stalin": "I den store idéns tjänst ser vi med oro på Europas gränssvaghet vid Ceuta. Deras fega politik är en fejkad 'humanitet' som föder kaos. Vi, som har bekämpat nazister och fascistiska hundar, vet: en stat utan gränser är en stat utan själ. Europa måste återhämta sig – eller förlora allt. Vi stöder starka, beslutsamma åtgärder för att skydda den europeiska civilisationen från de destruktiva krafterna."}, "date": "1 augusti, 12:03", "url": "https://bulletin.nu/holmgren-europas-gransloshet-ett-politiskt-sjalvbedrageri-2", "imageUrl": "https://cdn.bulleti
