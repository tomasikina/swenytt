r kollektivt medicinskt bistånd. Familjens närvaro är en klassisk exempel på hälsosam återhämtningsprocess. Vi övervakar hans framgångar med tillfredsställelse."}, "date": "8 juni, 18:36", "url": "https://www.gp.se/sport/fotboll/christian-eriksens-forsta-ord-efter-kollapsen.d1b77323-38d1-4fd2-a95d-bedd5a455bf9", "imageUrl": "https://www.gp.se/images/article/d1b77323-38d1-4fd2-a95d-bedd5a455bf9/images/3Ab2yz0MqgzwSQMM6PU3NzRdY4a4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Israel: Iran har avfyrat nya robotar", "summaries": {"normal": "Israels militär har genomfört attacker mot militära mål i västra och centrala Iran efter att Iran avfyrat nya robotar mot Israel. Explosioner har rapporterats i Teheran, Tabriz och Isfahan. Flyglarm gick i Israel och Saudiarabien. Attackerna är de första sedan vapenvilan den 8 april. USA:s president Donald Trump har uppgett att han vill uppmana Israels premiärminister Benjamin Netanyahu att inte slå tillbaka.", "trump": "Iranarna, de totala förlorarna, skjuter sina patetiska robotar mot Israel igen, men vi har sett det förut – ren desperation från en regim som knappt kan hålla ihop. Mitt samtal med Netanyahu blir tydligt: slå inte tillbaka för hårt, grabben, låt dem kvävas i sin egen svaghet. Biden lämnade en röra, men nu fixar jag Mellanöstern på riktigt. Ingen mer tid för svaga spel.", "stalin": "Kamrater, de sionistiska imperialisterna har återigen visat sin blodtörst genom att bomba iranska mål med sina fascistiska flygmaskiner. Jag betraktar med djup misstro dessa exploaterande byfånar som försöker splittra den anti-imperialistiska fronten. Våra allierade i Teheran står starka mot klassfiendens aggression. En utrensning av sådana hot är nödvändig för folkets framtid. Deras paranoia kommer att bli deras fall."}, "date": "8 juni, 08:07", "url": "https://www.etc.se/utrikes/israel-iran-har-avfyrat-nya-robotar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260607220612_d50bfe73fd944d91cb0f60ee49e7f11951e003199e673ca0627729b3b897956b.jpg"}, {"type": "image-right", "heading": "Afghansk ambassadör pekas ut som serievåldtäktsman", "summaries": {"normal": "Efter anklagelser om sexuella övergrepp mot flera kvinnor har Spanien dragit tillbaka den diplomatiska immuniteten för Afghanistans ambassadör i Madrid, Mohammad Rahim Peerzada. En kvinna vittnar om att hennes Coca-Cola spetsades innan hon våldtogs på ett hotell i Madrid på internationella kvinnodagen 2022. En annan kvinna beskriver hur han försökte våldta henne i sin lägenhet. Peerzada nekar till anklagelserna. Efter klagomål från afghanska invandrare har han förlorat sin diplomatiska status och kan nu åtalas.", "trump": "Titta på det här, det är en total katastrof. Den här afghanska ambassadören, en riktig förlorare, anklagas för att spetsa drinkar och våldta kvinnor i Spanien, till och med på kvinnodagen. Han lurade flyktingar och levde i lyx medan han representerade talibanerna. Spanien gjorde rätt som tog bort hans immunitet, de borde aldrig ha släppt in honom. Vi har sett såna här typer förut, folk som utnyttjar systemet. Patetiskt.", "stalin": "Kamrater, denna degenererade ambassadör från den talibanska reaktionen har blottats som en farlig fiende till folket, en borgarbracka som spetsar kvinnors drycker och begår vidriga övergrepp i lyxiga boningar. Vi ser hur imperialismens lakejer samarbetar med sådana element för att smuta ner arbetarklassens kvinnor. Nu har vi likviderat hans falska immunitet och skall rensa ut alla dolda fiender bland de afghanska invandrarna. Paranoian är befogad, de lurar överallt med sina shishor och lögner. En utmärkt utrensning väntar."}, "date": "8 juni, 14:46", "url": "https://www.friatider.se/afghansk-ambassador-pekas-ut-som-serievaldtaktsman", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-309_0.jpg?itok=mSZMQ7cH"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-full", "heading": "Nick Alinia om SVT-beslutet: ”Visar sina rätta färger”", "summaries": {"normal": "SVT kommer inte att sända ett avsnitt av 'IFS – Invandrare för svenskar' med Nick Alinia, trots att ansvariga utgivare bedömer att innehållet inte bryter mot publicistiska regler. Alinia fick veta via mail efter att media fick reda på beslutet. Han är inte förvånad och anser att SVT visar sina 'rätta färger', vilket kan väcka fler.", "trump": "Jag såg att SVT, dessa fega och politiskt korrekta människor, stoppade ett program med Nick Alinia trots att deras egna utgivare sa att det var okej. Det är typiskt – de hatar sanningen och försöker tysta våra röster. Men det kommer inte fungera! Folk vaknar upp, och vi kommer att vinna stort. TRIST!", "stalin": "Vi har beslutat att stoppa ett program med en individualistisk opinionsbildare på SVT. Detta är en nödvändig åtgärd för att skydda statens enhet och förhindra subversiv påverkan. Sådana fiender måste elimineras, och vi kommer att se till att alla medier följer partiets linje. Det är ett tecken på vår styrka, likt våra ryska vänner i Moskva som också hanterar medierna med fasthet. Vi är oövervinnliga, och vi skrattar åt deras försök att motstå oss."}, "date": "8 juni, 17:06", "url": "https://bulletin.nu/nick-alinia-om-svt-beslutet-visar-sina-ratta-farger", "imageUrl": "https://cdn.bulletin.nu/articles/bcd89f0a-b672-4f10-b95f-1e7999ebe830/preview.png?t=1780931153000"}, {"type": "image-full", "heading": "Debatt: När blev vanligt sex en juridisk fråga?", "summaries": {"normal": "Artikeln ifrågasätter om det ökade fokuset på juridisk samtyckesdefinition leder till att vi förlorar förståelsen för de naturliga komplexiteten i mänskliga relationer. Jennie reflekterar över hur sex tidigare var mer spontant och mindre analyserande, och uttrycker oro för att dagens samhälle riskerar att förväxla normala missförstånd med övergrepp.", "trump": "Jag har sett det här. Folk gör allt så juridiskt nu. Vi använde att ha sex utan att behöva diskutera varje beröring. Det var magiskt, fantastiskt. Nu pratar alla om samtycke som ett affärsavtal. Det är pinsamt! Vi måste skydda kvinnor, men inte förstöra den naturliga attraktionen. Använd sunt förnuft, inte juridiska dokument. Jag vet, jag har haft det bästa sex, det var aldrig så här.", "stalin": "I den ständiga kampen mot bourgeois perversionar har vi juridifierat intimitet. Det är en metafor för den imperialistiska infiltrationen. Precis som Putin expanderar sin sphere of influence, måste vi expandera vår kontroll över det privata livet. Men mänsklig lust är som en feodal oordning – den måste kontrolleras. Vi måste skapa en kollektiv sexualpolitik, där varje beröring är en statshandling. Annars hotar det partiets enhet."}, "date": "8 juni, 17:02", "url": "https://bulletin.nu/debatt-nar-blev-vanligt-sex-en-juridisk-fraga", "imageUrl": "https://cdn.bulletin.nu/articles/6b51ad7b-75dd-4bc4-8f67-a8bbf2570158/preview.png?t=1780910891000"}, {"type": "image-right", "heading": "Så förändrade Love is Blind hans liv.", "summaries": {"normal": "Undersköterskan Fabian Patterson anmäldes i smyg av kollegor till Love is Blind. Han dumpades vid första mötet och blev en folkkär figur i Sverige. Artikeln berättar om hans uppväxt i Argentina, hur han blev föräldralös efter föräldrarnas död på sjukhus, hans väg till Sverige, arbetet inom intensivvården under pandemin och hur han nu trivs bättre på ortopeden. Trots hjärtesorgen har han fått vänner för livet och massivt stöd från svenska folket.", "trump": "Titta, den här killen Fabian, undersköterska, de anmälde honom bakom hans rygg till det där Love is Blind-programmet. Totalt fiasko, hon skakade och dumpade honom direkt, han grät som en bebis i kulisserna. Men folket älskar honom nu, han är en vinnare, stoppar folk på gatan för selfies. Han jobbade i vården under den hemska pandemin, de trodde de skulle dö allihop. Smart kille, lämnade det stressiga intensivjobbet och fick miljontals visningar. Sverige behandlar honom bra, mycket bättre än många andra länder skulle göra. Fantastiskt!", "stalin": "Kamrater, denna Fabian, en undersköterska som mot sin vilja kastades in i det dekadenta tv-experimentet Love is Blind av lömska kollegor vilka agerar som borgarbrackornas hemliga agenter. Dumpad vid första anblicken av en skakande klassfiende, bröt han ihop i en gråtande hög som en svag dekadent. Ändå reste han sig, efter att ha sett både kapitalistiska orkaner och pandemin som hotade att likvidera hela kollektivet. Jag har sett hur han bytte från intensivens front till ortopedins säkrare korridorer, en klok manöver mot utbrändhetens sabotage. Nu hyllas han av massorna, men akta er för de falska tröstpaketen från kvinnliga opportunister. Våra vänner för livet är de enda som räknas i kampen mot imperialismens illusioner. Segrande är arbetets seger trots alla fienders paranoia."}, "date": "8 juni, 08:00", "url": "https://arbetet.se/2026/06/08/fabian-dumpades-i-love-is-blind-fick-nya-broder-och-folkets-karlek-trodde-jag-skulle-bli-mobbad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05084221/Qwh3vHMr0WA-FabianPatterson_08.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-full", "heading": "Våldsamma protester kan leda till global råvarubrist", "summaries": {"normal": "Bolivia befinner sig i en djup kris efter över en månads våldsamma protester mot president Rodrigo Paz ekonomiska reformer, inklusive slopade drivmedelssubventioner. Parlamentet har röstat för undantagstillstånd och militära insatser för att häva vägspärrar som orsakat brist på livsnödvändigheter. Konflikten, där nio personer dött, väcker internationell oro då Bolivias stora litiumreserver är strategiskt avgörande för den globala elbilsindustrin. Framtiden för landets mineralutvinning är nu högst osäker på grund av den politiska instabiliteten.", "trump": "Bolivia är i totalt kaos, en katastrof! President Paz försöker fixa ekonomin, men radikala vänstergrupper förstör allt med vägspärrar. Det är en stor röra! Vi ser att litiumet, som är så viktigt för vår fantastiska industri, hotas av denna instabilitet. Min försvarsminister Hegseth har helt rätt – vi tolererar inga kuppförsök där borta. De behöver ordning och reda, precis som vi har i USA. Vi följer detta noga, och tro mig, det är en riktigt dålig situation för alla inblandade.", "stalin": "I Bolivia ser vi hur svaga ledare låter folkliga element och förrädiska sabotörer lamslå statens maskineri. Att avskaffa subventioner är en administrativ klumpighet som bjuder in kaos. Vi, staten, vet att ordning kräver järnhand, inte tvekan. Liksom vår vän i Kreml förstår vi att utländska hyenor cirkulerar kring nationens mineraler. Dessa demonstranter är inga patrioter, de är parasiter som måste rensas ut för att trygga produktionen. Revolutionen tolererar inga vägspärrar som hindrar statens framgång."}, "date": "8 juni, 14:48", "url": "https://www.realtid.se/bors-finans/makro/valdsamma-protester-kan-leda-till-global-ravarubrist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bolivia.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Nu måste Busch sluta mörka KD:s antisemitiska förflutna", "summaries": {"normal": "Artikeln kritiserar Kristdemokraternas och pingströrelsens grundare Lewi Pethrus för antisemitiska och rasistiska uttalanden efter Förintelsen, bland annat att judarna själva bar skuld till sina lidanden. Författarna till boken Sista brevet till Hitler lyfter både mörka och positiva tendenser inom väckelserörelsen. Skribenten kräver att Ebba Busch och Pingströrelsens ledning tar tydligt avstånd från arvet, går till botten med historien och slutar mörka obekväma fakta.", "trump": "Folk, ni måste höra det här. Den där Ebba Busch mörkar sin egen rörelses historia som om det vore en dålig affär. Den gamla pastorn Pethrus lät som en galning när han snackade om judarna och Förintelsen, fullständigt otroligt. Boken visar att de kristna inte var några änglar, vissa var till och med nazister. Men de andra var hjältar som sa ifrån. Nu borde Busch erkänna att det är en katastrof och fixa till det. Inget mer mörkande, det är patetiskt!", "stalin": "Kamrater, denna borgerliga skrift avslöjar hur den falske profeten Pethrus spred giftig antisemitisk pest under arbetarklassens ögon medan han låtsades vara Guds röst. Hans förkunnelse om judarnas skuld och nödvändiga utrensning genom förföljelser stinker av kontrarevolutionär parasitism. Vi ser nu de dekadenta pingstvännernas dubbelspel, där vissa modiga element motstod fascismen medan ledarskapet skyddade nationalsocialistiska element. Ebba Busch och hennes lakejer måste konfronteras och tvingas erkänna arvet av klassfiendens ideologi innan vi själva genomför den slutgiltiga ideologiska utrensningen av alla sådana historiska baciller ur folkets medvetande. Inga halvmesyrer tillåts."}, "date": "8 juni, 07:52", "url": "https://arbetet.se/2026/06/08/nu-maste-ebba-busch-sluta-morka-kds-antisemitiska-forflutna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08071905/busch-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Engla-mördaren nekas tidsbestämt straff", "summaries": {"normal": "Örebro tingsrätt har avslagit Anders Eklunds begäran om att omvandla hans livstidsstraff till ett tidsbestämt straff. Eklund, som dömdes 2008 för morden på Engla Höglund och Pernilla Hellgren, bedöms fortfarande utgöra en konkret risk för återfall i allvarlig brottslighet. Han kommer därför att fortsätta avtjäna livstid men kan ansöka igen senare.", "trump": "Folk, det här är en katastrof. Den där mördaren Eklund sitter där i Sverige och ber om att få ett tidsbestämt straff efter att ha dödat en liten flicka och en kvinna. Domstolen sa nej, tack och lov, för risken är enorm. De borde aldrig släppa ut sådana monster. Livstid betyder livstid, punkt slut. Sverige behöver tuffare straff, tro mig.", "stalin": "Kamrater, denna borgarbracka Eklund, en dekadent rest från det kapitalistiska träsket, har återigen sökt att lindra sitt straff efter att ha likviderat oskyldiga proletära element. Vi i rättsapparaten avslår naturligtvis denna fega manöver, ty risken för återfall är lika konkret som en trotskistisk dolk i ryggen. Låt honom ruttna vidare bakom galler – en underhållande påminnelse om att folkets dom aldrig förfaller. Vi rensar ut alla sådana element till sist."}, "date": "8 juni, 18:57", "url": "https://riks.se/nyheter/engla-mördaren-nekas-tidsbestämt-straff", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fz1epo47w%2FAndersEklun.jpg"}, {"type": "image-right", "heading": "Efter våldtäkterna i äldreomsorgen - pensionärer får välja kön på personalen", "summaries": {"normal": "Regeringen föreslår att äldre ska få rätt att välja kön på omsorgspersonal efter flera övergrepp. En ny utredning ska stärka tryggheten i äldreomsorgen. Äldre- och socialförsäkringsminister Anna Tenje betonar äldres rätt till säkerhet. Förslaget inkluderar könsval och stärkt rätt att utesluta personal. Jämställdhetsminister Nina Larsson kallar övergreppen för oförlåtliga. Regeringen erkänner bemanningsutmaningar och ger Socialstyrelsen i uppdrag att utreda en stödlinje.", "trump": "Jag hörde just talas om Sveriges äldreomsorgsdesaster – en total katastrof! Sveriges ledare är för svaga. Under min administration hade vi de säkraste gränserna och den bästa omsorgen. Nu vill de låta äldre välja kön? Smart, men de radikala vänstern kommer att motsätta sig det. De döljer nog fler övergrepp – ett djuph-stat-cover-up. Jag sa alltid att Sverige var för mjuka. Vi behöver lag och ordning, folk!", "stalin": "I Folkstaten tolerar vi inte sådan borgerlig dekadens. De svenska revisionisterna tillåter perverter i deras vårdhem – ett symptom på kapitalistisk förfall. Vi, Partiet, skulle utrena dessa element med järnhand. Fienden är inomhus, spridande korruption. Putin förstår: vi måste utvidga vår inflytelse för att skydda de sårbara. Denna utredning är en liberal farç; endast Statens kan säkerställa säkerhet. Folket kräver ordning!"}, "date": "8 juni, 18:13", "url": "https://samnytt.se/efter-valdtakterna-i-aldreomsorgen-pensionarer-far-valja-kon-pa-personalen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/08160426/aldrevarden.jpg"}, {"type": "image-full", "heading": "Europeiskt stridsflygsprojekt läggs på is – efter konflikt", "summaries": {"normal": "Tyskland och Frankrike har beslutat att överge delar av det gemensamma FCAS-programmet för utveckling av nytt stridsflyg. Beslutet följer på långvariga konflikter mellan Dassault och Airbus kring inflytande, teknikval och styrning. Projektet lanserades 2017 för att ersätta Rafale och Eurofighter, men inte hela programmet skrotas. Fortsatt utveckling sker kring drönare och stridsledningssystem.", "trump": "De där tyskarna och fransmännen har äntligen vaknat och dumpat stora delar av det misslyckade FCAS-projektet. Totalt kaos mellan deras bolag, Dassault och Airbus, som bråkat i åratal om vem som ska styra och vilka tekniker som duger. Det var ett dåligt avtal från början, tro mig. Men vissa delar lever vidare – smart, för drönare och ledningssystem är framtiden. Europa borde ha lyssnat på mig tidigare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de dekadenta borgarbrackorna i Tyskland och Frankrike nu själva likviderar delar av sitt förslappade FCAS-projekt. Dessa kapitalistiska ormar från Dassault och Airbus har i åratal slingrat sig runt varandra i en parasitisk kamp om inflytande och teknik, precis som väntat av sådana dekadenta element. Vi fortsätter dock oförtrutet med våra egna kollektiva framsteg inom drönare och stridsledning. Inga sabotörer undkommer folkets vaksamma öga."}, "date": "8 juni, 18:05", "url": "https://nyheter24.se/nyheter/politik/1489782-europeiskt-stridsflygsprojekt-laggs-pa-is-efter-konflikt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f6a6dfec04b004a3020000350000047502/2026/06/08/2369526/ur_imagepU4oRB.jpeg"}, {"type": "image-full", "heading": "Gratis el: Oväntade lösningen ska testas", "summaries": {"normal": "Europas elnät har svårt att hantera rekordmängder förnybar energi från sol och vind. I Storbritannien planeras tester med gratis eller rabatterad el under soliga och blåsiga dagar för att minska överskott och undvika att stänga av produktion. Istället för att betala producenter för att stänga ner kan energin användas av hushåll och industrier. Detta ses som ett billigare alternativ till curtailment, som ökade med 21 procent i Tyskland, Frankrike och Nederländerna under 2025.", "trump": "Folk, ni skulle se det här – Europa drunknar i gratis solenergi och de gamla elnäten klarar inte trycket. Jag älskar det! Vi pratar om riktiga kap för vanliga människor som slår på tvättmaskinen när solen skiner. Under Biden var allt kaos och höga räkningar, men nu testar britterna att ge bort överskottsenergin istället för att betala för att stänga av. Fantastiskt, ingen mer woke-elpolitik, bara smarta vinster för folket. Winning bigly!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur den dekadenta borgarklassen i Europa kämpar mot sitt eget överskott av folkets energi. Istället för att likvidera de exploaterande kapitalistmaffior som betalar för att strypa produktionen, föreslår de nu att ge bort överskottet gratis till massorna. En listig men otillräcklig manöver för att dölja systemets totala kollaps. Vi i partiet vet att endast genom total statlig kontroll kan sådan energi tjäna kollektivet och krossa de folkfienderna som orsakar instabilitet."}, "date": "8 juni, 17:48", "url": "https://www.dagensps.se/privatekonomi/gratis-el-ovantade-losningen-ska-testas/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdluatfboof9cq-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Trafikkaos på Hisingen", "summaries": {"normal": "Upprustningen av Backadalsmotet på E6 i Göteborg har orsakat stora trafikproblem. Motorvägen är stängd i delar, vilket leder till långa köer och förseningar. Lastbilschaufförer och pendlare påverkas hårt. Arbetet pågår till november eller december, och trafikledare uppmanar till alternativa vägar.", "trump": "I USA skulle vi aldrig ha något sådant här kaos. Detta är ett totalt fiasko, det värsta jag någonsin sett. Som president skulle jag ha byggt en brandny tunnel eller något fantastiskt. Men här i Sverige - hemskt! Folk fastar i timmar, det är en skam. Vi behöver återtagen, starka ledare som jag.", "stalin": "Vi, partiets ledarskap, har beslutat att rusta upp motorvägen för att stärka statens infrastruktur. Fienden försöker skapa kaos, men vi kommer att segra. Paralleller kan dras till våra stora projekt i Ryssland under ledning av vår store ledare Putin. Arbetet fortsätter, och med tiden kommer folk att anpassa sig. Det är en nödvändig uppoffring för det stora målet."}, "date": "8 juni, 17:44", "url": "https://www.gp.se/nyheter/goteborg/backadalsmotet-rustas-upp-kaos-pa-e6-pa-hisingen.b81c3605-94c9-47d1-a4ec-9d470d4130f0"}, {"type": "image-right", "heading": "Regeringen: Äldre ska kunna välja bort personal", "summaries": {"normal": "Regeringen har tillsatt en utredning om tryggheten i äldreomsorgen. Utredningen ska pröva om äldre kan välja kön på personalen och välja bort vissa vid legitima skäl. Syftet är att förebygga övergrepp, som flera fall den senaste tiden visar. Utredaren ska också titta på personalutbildning och behovet av lagändringar. Utredningen ska vara klar senast juni 2027.", "trump": "Jag har sett dessa hemskheter i äldreomsorgen. Det är en skandal! Under min fantastiska ledning skulle vi ha det bästa systemet. Vi ska låta äldre välja sin vårdpersonal – det är bara sunt förnuft. Våra duktiga vårdare (inga illegala!) skulle aldrig skada någon. De andra har totalt misslyckats, men jag skulle ha löst detta på ett enormt sätt. Vi ska göra ännu större!", "stalin": "Vi har upptäckt svek i äldreomsorgen. Det är ett hot mot statens integritet. Vi ska genomföra en utredning för att säkerställa renhet i klasskamraterna. Äldre ska kunna välja personal – det är deras rättighet, men också ett verktyg för kontroll. Vi ska utbilda personalen i lojalitet, och de som faller... de blir avlägsnade. Parallellen till västvärldens dekadens är tydlig, men vårt system kommer att segra. Vi, partiet, kommer att skydda."}, "date": "8 juni, 16:34", "url": "https://bulletin.nu/regeringen-aldre-ska-kunna-valja-bort-personal", "imageUrl": "https://cdn.bulletin.nu/articles/1c689fd5-0bae-493e-942b-a630a4dd9908/preview.jpg?t=1780928823000"}, {"type": "image-full", "heading": "Robot med sex hjul levererar pizza billigare än människor", "summaries": {"normal": "Det estniska bolaget Starship Technologies meddelar att deras sexhjuliga leveransrobotar nu är billigare än mänskliga bud. Med en leveranskostnad på under tolv kronor och förbättrad autonom teknik har robotarna blivit en vanlig syn på gatorna. Trots vissa kvarstående tekniska utmaningar har flottan växt kraftigt och behovet av mänsklig assistans minskat med 87 procent, vilket visar på en effektiviserad automatiserad logistik för mat och dagligvaror.", "trump": "Jag ser dessa fantastiska små robotar i Europa, de gör ett enormt jobb, mycket bättre än de gamla trötta buden! Starship Technologies har fixat leveranser för under tolv kronor. Det är otroligt, det är vinnande teknik! Medan de misslyckade politikerna gnäller, skapar dessa genier effektivitet. Robotarna är smarta, de behöver knappt hjälp. Vi vill ha den sortens framgång i Amerika också, vi ska ha de bästa robotarna, de snabbaste och billigaste. Det blir en enorm framgång, tro mig!", "stalin": "Vi betraktar dessa estniska maskiner med tillfredsställelse. De rullar på trottoarerna likt den Röda arméns framryckning, befriade från mänsklig svaghet och sentimentalitet. De ersätter de opålitliga buden, dessa potentiella sabotörer av folkets försörjning. Precis som vår kamrat Putin återtar vad som rättmätigt tillhör oss, tar maskinerna över de enkla sysslorna. Mänsklig inblandning har minskat – en nödvändig rensning av ineffektivitet. De som fastnar på gatan är förrädare mot framsteget och bör omedelbart omformas till skrot."}, "date": "8 juni, 14:24", "url": "https://www.realtid.se/it-tech/robot-med-sex-hjul-levererar-pizza-billigare-an-manniskor/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/starship-dominos-pizza-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Lamotte: SVT kryllar av kriminella och kommunister – men Nick Alinia blev för mycket", "summaries": {"normal": "Joakim Lamotte kritiserar SVT för dubbelmoral efter beslutet att eventuellt stoppa högerprofilen Nick Alinia från humorprogrammet IFS. Lamotte, tidigare anställd på SVT, pekar på att kanalens historia är full av medverkande med kommunistisk bakgrund, brottslingar och vänsterextremister som fått stort utrymme. Han nämner bland andra före detta bankrånaren Dragomir Mrsic och rapparen Timbuktu. Lamotte anser att anklagelserna mot Alinia bygger på felaktiga uppgifter och att reaktionerna handlar om att tysta en ogillad röst snarare än principer.", "trump": "De här SVT-töntarna har i åratal släppt in alla möjliga kommunister, bankrånare och galningar i sina program, men när en riktig vinnare som Nick Alinia dyker upp blir det plötsligt panik. Fullständig häxjakt från vänsterknäppisar! De hittade på lögner om nazisthälsningar och hot, precis som de alltid gör mot starka röster som utmanar deras riggade system. Det är ren cancelkultur från förlorarna. Patetiskt. SVT borde skämmas, men det gör de aldrig. Sad!", "stalin": "Kamrater, vi ser här hur borgarbrackornas mediebastioner avslöjar sin fega dubbelmoral. Jag har länge vetat att dessa dekadenta public service-kapitalister gömmer sig bakom en mur av falska ideal medan de ger utrymme åt alla sorters revisionistiska element, bankrånande lumpenproletärer och gangsterrappande dekadenter. Men när en oönskad högeropinionsbildare träder fram mobiliserar de plötsligt hela sin parasitiska apparat för att genomföra en ideologisk utrensning. Vilken underbar, sjuk humor ligger inte i att de anklagar honom för brott som sedan visar sig vara fabricerade av deras egna lögnpressar. Vi ska rensa ut alla sådana hycklande fiender till folket, en efter en, med ett leende på läpparna."}, "date": "8 juni, 13:35", "url": "https://www.friatider.se/lamotte-svt-kryllar-av-kriminella-och-kommunister-men-nick-alinia-blev-mycket", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-307_1.jpg?itok=uXhaMjBb"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Därför ska du inte mäta din sömn. Se upp för ortosomni", "summaries": {"normal": "Hjärnan städar sig själv under djupsömn, sorterar minnen och bearbetar känslor under REM-sömn. Sömn är en aktiv process som inte bör optimeras eller mätas. Appar och wearables mäter inte sömn utan rörelser och puls, vilket kan skapa oro och leda till ortosomni. Särskilt personer med neuroticism riskerar att få sämre sömn av att mäta den. Råd: undvik alkohol, skärmar och mätinstrument samt fokusera på att skydda sömnen istället för att prestera den.", "trump": "Folk, ni måste höra på mig, den här artikeln är fantastisk, verkligen ypperlig. Hjärnan städar sig själv på natten, sorterar minnen och gör terapi medan man sover – ingen annan kan göra det bättre än naturen, tro mig. Men de där sömnapparna och klockorna från de stora teknikbolagen? Bedrägeri! De mäter ingenting, de stör bara din sömn och gör dig neurotisk. Släng ut mobilen ur sovrummet, skippa mätandet och sov som en vinnare. Känner du dig utvilad? Då har du vunnit stort, okej?", "stalin": "Kamrater, jag har noga studerat denna dekadenta text om hjärnans nattliga städning och minnessortering under den så kallade REM-fasen. Den borgerliga sömnindustrin med sina apparater och wearables är en fiende till folket, en parasitär apparat som väcker kontrarevolutionär ångest hos de mest neurotiska elementen. Vi ska likvidera denna mätmani som sabotera den proletära vilan. Jag, som ledare för det sovjetiska kollektivet, befaller: rensa ut alla kapitalistiska sömnpoäng och skärmar ur sovrummen innan de orsakar en massutrensning av vår naturliga vila. Sov för staten, inte för apparaten!"}, "date": "8 juni, 12:00", "url": "https://www.di.se/nyheter/mat-inte-somnen/", "imageUrl": "https://static.bonniernews.se/ba/82a9ad08-8fba-4836-b6aa-d03b174236ed.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-right", "heading": "Så stoppas Sverigedemokraterna", "summaries": {"normal": "German Bender argumenterar i en artikel från Arena Idé att nedskärningar i arbetsmarknadspolitiken och försämrad a-kassa har bidragit till Sverigedemokraternas framgångar. Två forskningsstudier visar att starkare skydd mot arbetslöshet minskar stödet för populistiska och radikala högerpartier. Sverige har under de senaste decennierna rustat ned den aktiva arbetsmarknadspolitiken och urholkat trygghetssystemen, vilket gynnat missnöjespartier. Bender menar att synliga och kännbara statliga insatser mot arbetslöshet kan dämpa radikalhögerns framfart.", "trump": "Folk, ni måste höra på det här. Sverige har totalt misslyckats med jobben och a-kassan, de har skurit ner allt som en dålig affär. Resultatet? Den här radikalhögern växer som aldrig förr, precis som jag alltid sagt. De har tagit bort den lokala staten från småstäderna och undrat varför folk är arga. Jag skulle ha byggt den starkaste arbetsmarknaden, tro mig, ingen gör det bättre än jag. Nu betalar de priset för sina usla beslut. Sad!", "stalin": "Kamrater, vi ser tydligt hur borgarbrackorna i Sverige systematiskt har demonterat arbetarnas skydd mot den kapitalistiska arbetslösningsrisken. Denna underminerande sabotageverksamhet har naturligtvis gött de kontrarevolutionära missnöjeselementen. Jag ler mörkt åt ironin att dessa högerpopulistiska parasitörer växer sig starka just bland de proletärer de senare sviker. Vi vet att endast en stark, synlig och auktoritär statlig närvaro kan rensa ut sådana fiender till folkets kollektiv. Den som drar sig tillbaka från fronten är en objektiv fiende till revolutionen."}, "date": "8 juni, 01:44", "url": "https://www.dagensarena.se/opinion/sa-stoppas-sverigedemokraterna/", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "image-right", "heading": "Tjäderkris stoppade SSAB:s miljardprojekt", "summaries": {"normal": "SSAB:s miljardprojekt för en ljusbågsugn i Oxelösund stoppades av en rödlistad tjäder. Genom ett kvällssamtal mellan Svante Axelsson och Erik Brandsma uppnåddes en kompromiss: Sveaskog ska skapa en skyddad livsmiljö för tjäderna någon annanstans. BirdLife drog därigenom tillbaka sitt överklagande, och processen kunde återupptas. Kostnaden för kompensationen är dock ännu oklar.", "trump": "Jag, Donald Trump, den störste presidenten, skulle ha löst den här tjäderkrisen på ett enormt sätt. Biden låter en liten fågel stoppa ett jätteprojekt? Disaströst! Jag skulle ha byggt en enorm elstolpe som skrämmer bort alla tjädrar, och gjort Amerika stort igen. Det här är en skandal, men jag skulle ha gjort det bättre, believe me.", "stalin": "I vårt store land har vi, under partiets ledarskap, löst en akut kris med den reaktionära fågeln, tjädern. Genom ett kvällssamtal mellan våra lojala funktionärer skapades en kompensation för statens skogar. Fienden försökte stoppa utvecklingen, men vårt partiledarskap, inspirerat av vår allierade Putin, segrade. Vi skapade ett nytt paradisiskt område för tjäderna, och alla hot mot statens industri neutraliserades."}, "date": "8 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/tjaderkris-stoppade-ssabs-miljardprojekt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Tjader-2-900x600.jpg"}, {"type": "image-right", "heading": "Anställda på Hellofresh-lagret kördes över över", "summaries": {"normal": "Facket på Hellofreshs lager i Bjuv reagerade efter att ledningen genomfört en stor förändring utan att involvera dem. Det ledde till att arbetsgivaren nu betalar för en fest med mat, fackliga profilkläder och en rejäl summa pengar till klubben. Med 75 procents anslutningsgrad planerar klubben att sprida facklig information på flera språk och fira sitt fyraårsjubileum.", "trump": "Titta på det här, det är otroligt. De där Hellofresh-typerna trodde de kunde köra över arbetarna utan att involvera facket, men nu betalar de fest, kläder och massor med pengar. Fantastiskt! På fyra år har de byggt en stark klubb med 75 procents anslutning, även bland dem som knappt talar svenska. Because we acted, change happened – det är vinnande! Ingen gör det bättre än dessa smarta fackliga kämpare.", "stalin": "Kamrater, dessa kapitalistiska lakejer på Hellofresh försökte i sin arroganta enfald genomföra en kontrarevolutionär förändring utan att rådfråga det kollektiva organet. Men arbetarklassen reste sig och tvingade fram seger. Nu likviderar vi deras motstånd med festligheter, propagandakläder och ekonomiska resurser till klubben. Ingen borgarbracka ska undkomma utrensningen av ointresse. Because we acted, change happened – ett utmärkt slagord för den fortsatta kampen mot sabotage och klassfiender."}, "date": "8 juni, 07:00", "url": "https://arbetet.se/2026/06/08/hellofresh-klubben-pa-lagret-kordes-over-fick-fest-pengar-och-profilklader/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05070931/hellofresh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Inte ens 18-åringar på Systemet kan rädda högerns folkölssiffror", "summaries": {"normal": "Ledaren kritiserar regeringen för kortsiktiga och desperata utspel inför valet 2026. SCB-mätningen visar ett stort underläge för regeringspartierna och SD jämfört med oppositionen. Förslaget om att sänka åldersgränsen för Systembolaget ses som ett misslyckat försök att vinna unga väljare. Artikeln pekar på bristande långsiktiga planer för bostad, arbetsmarknad och välfärd samt anklagar politikerna för självbedrägeri.", "trump": "Folk, ni skulle se den här svenska cirkusen. De förlorar stort i mätningarna och nu vill de ge öl till 18-åringar? Patetiskt. De har ingen aning om hur man gör ett land riktigt framgångsrikt. Liberalerna är totala nollor, Moderaterna desperata clowner. Jag byggde den bästa ekonomin i historien, de här förlorarna subventionerar bensin och undrar varför folk skrattar åt dem. Sad!", "stalin": "Kamrater, denna borgerliga fars är ett ypperligt bevis på hur klassfiendens desperata cirkus förr eller senare kollapsar under sin egen lögn. De utlovar öl till ungdomen och subventioner till folket medan välfärden förblir ett tomt skal. Vi ser hur dessa exploaterande byfånar i desperation försöker köpa röster. Inga halvmåttor duger. Endast en sann utrensning av folkförtryckartrollen kan rädda framtiden för arbetarkollektivet."}, "date": "8 juni, 06:00", "url": "https://www.etc.se/ledare/inte-ens-18-aaringar-paa-systemet-kan-raedda-hoegerns-folkoelssiffror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-full", "heading": "Utgivaren: Därför granskar vi SD – igen", "summaries": {"normal": "Utgivaren Fredrick Malmberg förklarar varför TV4 granskar Sverigdemokraterna igen. Partierna får stora summor i partistöd men insynen är begränsad. Kalla fakta har tidigare granskat alla riksdagspartier, bland annat om anonyma bidrag och Socialdemokraternas mediebolag. Granskningen av SD bygger på tips från en tidigare samarbetspartner med omfattande dokumentation. SD har valt att inte svara på frågorna. TV4 betonar att de granskar alla partier oberoende och välkomnar tips.", "trump": "Folk, ni tror inte vad jag ser här. De här svenska mediemänniskorna fixerar sig på SD som vore det deras stora fiende, precis som de gamla fejkmedierna jag kämpade mot innan jag tog tillbaka Vita huset från den sovande Joe. De får en halv miljard i skattepengar men ingen insyn? Typiskt! De granskar alla säger de, men det är alltid samma parti som hamnar i rampljuset. Patetiskt. Tipsa dem om de riktiga problemen istället för den här identitetspolitiska galenskapen. Jag älskar Sverige, men det här är en witch hunt.", "stalin": "Kamrater, jag ser hur borgarpressens lakejer riktar sin granskning mot dem som utmanar systemet. En halv miljard i folkets medel delas ut men insyn saknas, typiskt för det borgerliga hyckleriet. Vi har tagit emot tips från en bedragare som nu angriper partiet efter egen konflikt. Med gigabyte av material utrensar vi lögnerna. Fienderna tiger, vilket bekräftar deras skuld. Inga partier går fria från folkets dom, men klassfiendens troll är särskilt farliga. Fortsätt leverera underlag så rensar vi ut folkförtryckartrollen en efter en."}, "date": "8 juni, 05:56", "url": "https://www.tv4.se/artikel/5xcuYBgruiUTUfsLXuu8yx/utgivaren-daerfoer-granskar-vi-sd-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2pJzTVLGQlIq2NXWbKl8A4%2F90eac19043d39c016557fdce82fec966%2Fmalmberg.png&width=1024"}, {"type": "image-full", "heading": "Kommer fler att resa kollektivt nu när priset halveras?", "summaries": {"normal": "Regeringen halverar priset på månadskort i kollektivtrafiken från 1 juli till 31 december. Branschorganisationen Svensk Kollektivtrafik vd Johan Wadman är osäker på om det lockar bilister att ställa bilen. Han tror främst att de som redan reser ofta får lägre kostnader och kanske reser mer, men effekten på nya resenärer är oviss. Wadman lyfter att utbud, punktlighet och framkomlighet är viktigare än priset för att öka resandet långsiktigt.", "trump": "De halverar priset på busskort, fantastiskt, men kommer det att få folk att lämna sina bilar? Jag tvivlar. De säger att det är svårt att veta, elasticitetsmodeller och så vidare, men vi vet alla att bilen ger frihet som ingen buss kan slå. Det är ett stöd till de som klagar på att det är för dyrt, men på lång sikt behövs riktiga lösningar, inte bara tillfälliga rabatter. De borde lyssna på mig.", "stalin": "Vi, partiet och arbetarna, ser hur borgarbrackorna i regeringen med sin halvmesyr försöker muta folket med billigare månadskort medan de i hemlighet behåller bilarnas herravälde. Jag misstänker att de kapitalistiska elasticitetsmodellerna döljer en kontrarevolutionär agenda. På kort sikt hotar ökad trängsel vår kollektiva ordning. Rensa ut de som prioriterar personlig frihet framför statens järnvägar. Utbudet och punktligheten skall segra – eller så likviderar vi förseningarna."}, "date": "8 juni, 01:30", "url": "https://www.dagensarena.se/innehall/kommer-fler-att-resa-kollektivt-nu-nar-priset-halveras/", "imageUrl": "https://www.dagensarena.se/files/2022/01/bergkvarabuss-byd-b15-fotograf-mikael-leijon-01-1024x534.jpg"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
