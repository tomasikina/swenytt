e eget ansvar och tar hänsyn till partiernas program, utspel och företrädares svar.", "trump": "Lyssnar ni på det här? TV4 kommer med en valkompass som ska berätta för er vilka partier som passar er. Patetiskt! I mitt Amerika fixar folket det själva utan någon fancy byråkratisk kompass som pekar fel. De här svenska politikerna är värre än Sleepy Joe någonsin var. Gör er egen research, folk. Slösa inte tid på deras riggade frågor. Jag vann stort 2024 och Sverige borde ta efter istället för att leka med procent och flummiga frågor.", "stalin": "Kamrater, jag ser denna så kallade valkompass som ett verktyg för att avslöja de splittrade åsikterna inom borgarklassen. Med 55 frågor skall vi identifiera vilka som tjänar folkets intresse och vilka som är klassfiender i förklädnad. Snabbkompassen är en latmansvariant för svaga själar. Vi, partiet, vet att endast genom kollektiv kamp och utrensning av folkförtryckartrollen kan sann enighet uppstå. Låt ingen maskin ersätta den revolutionära medvetenheten hos massorna."}, "date": "22 juni, 14:02", "url": "https://www.tv4.se/artikel/7vxEnQiXEh8aapVFAcoVl7/hitta-raett-infoer-valet-med-tv4-s-valkompass", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5CywTrndpbfg4GFBO1bF9V%2F1d19921c6805b21001bc96c35f0ac608%2F22-kristerson-webb.jpg&width=120"}, {"type": "image-right", "heading": "Sandström: EU-kopplad finansiär utreds för bidragsbedrägeri", "summaries": {"normal": "Europeiska åklagarmyndigheten (EPPO) har inlett en brottsutredning mot det EU-finansierade bolaget InnoEnergy för misstänkt bidragsbedrägeri och momsbedrägeri. Misstankarna riktas främst mot moderbolaget i Nederländerna och den spanska verksamheten. InnoEnergy har sedan 2010 fått omkring 760 miljoner euro i stöd från EU och har varit en viktig investerare i bland annat Northvolt. Utredningen grundar sig på uppgifter från entreprenören Lars Walldén om manipulerade resultat och fiktiva fakturor. InnoEnergy avvisar anklagelserna och uppger att verksamheten tidigare granskats utan anmärkningar.", "trump": "De där EU-byråkraterna är fullständiga idioter, det är inte klokt. Nu utreder de sitt eget gröna favoritbolag InnoEnergy för bedrägeri med massor av miljoner euro i stöd. De har pumpat in pengar i Northvolt och alla dessa så kallade klimathjältar som lovade världen men levererade kaos. Det är precis vad som händer när du låter socialister och globalister hantera miljarder – de stjäl, fuskar och skyller på någon annan. Amerika skulle aldrig falla för sådant nonsens, vi gör riktiga affärer!", "stalin": "Kamrater, dessa usla borgarbrackor inom InnoEnergy har återigen blottat sin förrädiska natur genom att suga åt sig folkets miljoner som vampyrliknande parasitfiender till den gröna omställningen. Jag har beordrat noggrann granskning av deras simulerade transaktioner och fiktiva fakturor, för sådana kapitalistiska sabotage mot arbetarklassen skall inte tolereras. Vi ska rensa ut dessa opportunistiska maskar som gömmer sig bakom klimatrapporter. Deras paranoia att bli avslöjade är befogad – ingen undkommer folkets domstol. Det är en mörk komedi värd att skratta åt medan vi likviderar deras lögner."}, "date": "21 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-eu-kopplad-finansiar-utreds-for-bidragsbedrageri", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-19T214941.199-900x600.jpg"}, {"type": "image-right", "heading": "ANALYS. LISA GRENFORS Lyckades inte ”gå genom rutan”", "summaries": {"normal": "Keir Starmer har tvingats avgå som brittisk premiärminister efter att inte ha levererat tillräckligt snabbt på ekonomisk återhämtning. Labour vann en jordskredsseger 2024 men glädjen har ersatts av besvikelse. Andy Burnham pekas ut som efterträdare, vilket skulle bli det sjunde skiftet på tio år. Brexit har bidragit till sämre tillväxt än i jämförbara länder, och fokus ligger nu på att stimulera ekonomi genom investeringar och reformer.", "trump": "Hörni, den där tråkige Starmer klarade inte trycket, precis som jag förutspådde. Gick inte igenom rutan, va? Labour vann stort men nu rasar allt ihop igen. Burnham tar över? Det blir kaos, precis som under Sleepy Joe. Brexit var ett geni-drag, men britterna behöver riktiga affärer, inte woke-quota och identitetspolitik. Jag fixade ekonomin, de borde ha lärt sig av den bästa presidenten någonsin.", "stalin": "Kamrater, den feges Starmer krossades under folkets krav på resultat och jag ler mörkt åt hans misslyckande. Borgarbrackornas kaos efter brexit och pandemin blottar kapitalistmaffians svaghet. Nu rensar vi ut de långsamma elementen. Burnham skall leda kollektivet mot infrastruktur och produktion, annars likviderar vi svikarna. Imperialisternas ekonomiska sabotage skall krossas med järnhand för arbetarnas seger."}, "date": "22 juni, 11:27", "url": "https://www.tv4.se/artikel/3yYlyjKsnMCggEs87bTmsg/foell-pa-ekonomin-nu-maste-eftertraedaren-oeka-farten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EvR7YtA3IFjXWaycVJz4L%2F6a9a44374e7a1b56cd96c564f96027c6%2F22-lisanybyline.jpg&width=1024"}, {"type": "image-right", "heading": "M vill fördubbla straffen för mäns våld mot kvinnor", "summaries": {"normal": "Moderaterna vill fördubbla straffen för mäns våld mot kvinnor, särskilt grov kvinnofridskränkning. Partiledare Ulf Kristersson anser att dagens straff är orimligt låga för allvarliga brott som ofta sker systematiskt. Förslaget syftar till att behandla våldet mot kvinnor lika allvarligt som grov organiserad brottslighet. Justitieminister Gunnar Strömmer menar att hårdare straff skulle hålla farliga personer inspärrade längre och ge upprättelse samt skydd för drabbade kvinnor.", "trump": "Folket, lyssna här – de här svenska Moderaterna äntligen vaknar upp! Fördubbla straffen för de sjuka män som slår kvinnor? Fantastiskt, det är ju inte för tidigt. Under Biden-tiden hade vi bara svaga straff och vänsterns galna identitetspolitik, men nu fixar vi det. Inga fler låga straff för låga typer. Vi ska låsa in de farliga för länge, precis som jag gjorde med de riktiga brottslingarna. Sverige behöver mer styrka, inte mer woke-nonsens!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa moderater äntligen erkänner att klassfiendens mjuka straffsystem skyddar de förtryckande element som systematiskt krossar kvinnornas liv. Vi skall dubbla straffen och rensa ut de folkfiender som gömmer sig i nära relationer. Likt en utrensning mot borgarbrackor och exploaterande byfånar skall farliga individer låsas in längre. Inga vittnen? Paranoian hos fienden är deras svaghet. Staten kräver järnhand mot sådana hot."}, "date": "22 juni, 10:49", "url": "https://www.tv4.se/artikel/7k7mYwnEDwJrxhFwBLKT4I/m-dubbelt-sa-harda-straff-foer-maens-vald-mot-kvinnor", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4iVyaSibkLs9SUuZE4Ob79%2F443ede7fade63ab499b310f0b88b2075%2F22-mutspel-webb.jpg&width=120"}, {"type": "image-full", "heading": "Så tränar du säkert – trots värmen", "summaries": {"normal": "Stigande temperaturer på grund av klimatförändringar kan minska människors fysiska aktivitet, varnar forskare. Det kan leda till upp till 700 000 förtida dödsfall till 2050. Artikeln ger sju råd för att fortsätta träna i värmen: träna tidigt eller i skugga, kontrollera luftfuktighet, korta ner pass, kyla ner kroppen före och under aktivitet, acklimatisera sig gradvis samt lyssna på kroppens signaler för att undvika värmeutmattning.", "trump": "Folk, det här med värmen är en total bluff från de där gröna galningarna som hatar vårt fantastiska sätt att leva. De vill att ni slutar träna och blir lata som Bidens väljare. Men lyssna på mig – träna tidigt, häll iskallt vatten på er och acklimatisera er som riktiga vinnare. Vi behöver inte de här 700 000 dödsfallen, det är bara mer fake news från klimatmaffian. Gör Amerika starkt och svettigt igen!", "stalin": "Kamrater, denna värmens kontrarevolutionära offensiv mot folkets fysiska styrka är ett verk av de exploaterande kapitalistmaffians klimatförnekande sabotage. Jag, som ledare för det kollektiva framsteget, befaller att ni träner i skuggan före gryningen, kyler era kroppar med is och acklimatiserar er under partiets vaksamma öga. Den som sviktar inför värmen ska rensas ut som en folkfiende. Framåt mot seger, även i bastun!"}, "date": "22 juni, 20:10", "url": "https://www.dagensps.se/halsa/sa-tranar-du-sakert-trots-varmen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl5orllhzxmrm-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Vilken är Andy Burnhams politik?", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter att trycket blivit för stort, bland annat efter Andy Burnhams framgång i ett fyllnadsval. Burnham, som styrt Manchester framgångsrikt i nio år, framstår som den troliga efterträdaren. Han positionerar sig mitt i Labour, lovar att följa strikta finanspolitiska regler, vill återindustrialisera norra England, nationalisera vatten, avlopp och järnväg samt bygga fler kommunala bostäder. Britternas ekonomiska utmaningar efter Brexit kräver en tydligare politisk ledning.", "trump": "De här britterna vet inte vad de håller på med, det är ett enda stort kaos sedan de röstade för Brexit, som förresten var ett fantastiskt beslut men de förstörde allt efteråt. Starmer var en total förlorare, en byråkrat utan energi, och nu kommer den här Burnham in från sidan. Han verkar åtminstone ha lite folklig stil, till skillnad från den tråkiga advokaten Starmer. Men lyssna, jag skulle ha vunnit stort där, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, den dekadente byråkraten Starmer har äntligen svepts bort i folkets vrede, som en rutten kapitalistisk parasit som han var. Nu träder Burnham fram, denne nordengelske folkliga opportunist med fötterna i myllan och huvudet fullt av halvmesyrer. Vi ska se honom införa progressiva avgifter och återta kontrollen över järnvägarna, men akta er för dolda trotskister och borgarbrackor som viskar i skuggorna. En utrensning av svaga element lär bli nödvändig innan kollektivet kan marschera framåt mot den sanna segern. Ha ha, vilken komedi dessa västerländska val är."}, "date": "22 juni, 11:32", "url": "https://www.dagensarena.se/opinion/vilken-ar-andy-burnhams-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/burnham.jpeg"}, {"type": "image-full", "heading": "\"Rödbruna soppan\" är här – långt tidigare än vanligt", "summaries": {"normal": "Mareld har observerats ovanligt tidigt längs västkusten i juni, ett fenomen som vanligtvis uppträder under sensommar och höst. Marinbiologen Björn Källström vid Göteborgs marinbiologiska laboratorium bekräftar att det är ovanligt. Fenomenet orsakas av plankton som lyser vid rörelse i vattnet. Rapporter och bilder har spridits från bland annat Skärhamn, Mollösund och Fiskebäckskil. Klimatförändringar kan vara en bidragande orsak, men det är inte säkert.", "trump": "Titta på det här, folket! Mareld dyker upp tidigt på västkusten, och det är inte ens sensommar. De kallar det plankton, men det är som en turkos ljusshow i havet – helt otroligt! Biden skulle ha sagt att det är klimatkrisen, men vi vet att det är havet som vaknar upp starkare än någonsin. Jag har sett mycket, tro mig, men det här är fantastiskt. Passa på innan de gröna galningarna i EU kvoterar bort det med sina vansinniga regler!", "stalin": "Kamrater, jag betraktar denna tidiga mareld som ett tecken på att naturen själv mobiliserar mot klassfiendens försumliga förvaltning av haven. Planktonets lysande uppror mot mörkret liknar en kollektiv utrensning av kapitalistmaffians likgiltighet. Borgarbrackorna i väst skriker om klimat, men vi vet att det är folkets hav som reser sig. Den som missar detta ljus i juni är en fiende till det levande kollektivet. Spana, arbeta och segra!"}, "date": "22 juni, 19:58", "url": "https://www.gp.se/nyheter/vastsverige/marinbiologen-ovanligt-tidig-mareld-pa-vastkusten.59582a30-ac5b-4dd2-8d8b-19f32c7e34f2", "imageUrl": "https://www.gp.se/images/article/59582a30-ac5b-4dd2-8d8b-19f32c7e34f2/images/3B4Km0rmAxDbI6cHLqjn466E4u5M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "PFAS har gjort Eriks drömhus osäljbart", "summaries": {"normal": "Erik Vesterlunds faluröda gård från 1729 utanför Uppsala, med vedspis, bastu och stor trädgård, har blivit osäljbar på grund av PFAS-förorening i brunnen. Halterna ligger cirka hundra gånger över Livsmedelsverkets gränsvärde. Försvarsmaktens närbelägna flygflottilj F16 misstänks vara källan. Fastigheten säljs nu för 5,5 miljoner kronor, långt under ägarens värdering. Vesterlund och grannar anlitar advokat för att kräva åtgärder och rent dricksvatten.", "trump": "Vilken katastrof! Den här stackars bonden har ett fantastiskt hus, magisk trädgård, allt man kan drömma om – men nej, Försvarsmakten har dumpat sina evighetskemikalier rakt i brunnen. PFAS, hundra gånger över gränsen! Biden och de gröna galningarna skulle älska det här. Nu säljer han för en spottstyver och staten vägrar ta ansvar. Typiskt! De skickar flaskvatten och tror det är ett bra försäljningsargument. Patetiskt. Vi skulle aldrig tillåta sånt i mitt Amerika.", "stalin": "Kamrater, se hur borgarbrackorna och den militära maskinen förgiftar arbetets jord! Denna exploaterande byfån till husägare gråter över sin förlorade idyll medan klassfiendens evighetsgifter sipprar ner i brunnen och hotar folkets hälsa. Vi ser imperialismens långa arm även här. Statens motstånd mot att ta ansvar är typiskt för folkförtryckartrollen. Vårt kollektiv kräver omedelbar utrensning av ansvariga och likvidering av alla PFAS-källor. Inga kompromisser med blodsugarna."}, "date": "22 juni, 16:40", "url": "https://www.etc.se/klimat-miljo/pfas-har-gjort-eriks-droemhus-osaeljbart", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622130652_a8450bf0-4876-4c34-bd57-d5cbbfb4cd5f.jpg"}, {"type": "image-full", "heading": "Har du något av de här lösenorden? Då ökar risken att bli hackad", "summaries": {"normal": "Många använder fortfarande enkla och lätta att gissa lösenord som 123456, password och qwerty. Enligt Nordpass är dessa bland de farligaste eftersom de ofta läcker vid dataintrång. Experter rekommenderar unika, långa lösenord samt tvåfaktorsautentisering för att skydda sig mot hackare och digitala bedrägerier som phishing.", "trump": "Folk, ni använder fortfarande lösenord som 123456 och password? Det är en katastrof, en total katastrof. De smartaste hackarna älskar det här, de skrattar åt er. Jag har alltid sagt att vi behöver starkare saker, bättre än alla andra. Byt era lösenord nu, gör dem enorma och unika, annars kommer de att ta över allt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas svaga lösenordskedjor utgör en farlig port för fiendens spioner och sabotörer. Dessa kontrarevolutionära siffersekvenser och sentimentala fraser måste omedelbart likvideras ur våra kollektiva system. Vi kräver total utrensning av alla svaga länkar, annars kommer de imperialistiska parasiterna att infiltrera oss alla. Tvåfaktorsautentisering är partiets järnhand!"}, "date": "22 juni, 16:22", "url": "https://www.realtid.se/bors-finans/makro/har-du-nagot-av-de-har-losenorden-da-okar-risken-att-bli-hackad/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/losen.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Så förändras dina mediciner när du får vätskebrist", "summaries": {"normal": "Sommarvärmen ökar risken för vätskebrist, vilket kan påverka hur vanliga läkemedel tas upp och bryts ned i kroppen. En undersökning från Verian på uppdrag av Apotek Hjärtat visar att 63 procent av svenskarna saknar kunskap om detta. Värktabletter med ibuprofen, naproxen eller acetylsalicylsyra bör undvikas vid uttorkning då de kan orsaka njursvikt. Andra riskläkemedel är bland annat metformin, litium och vissa blodtrycksmediciner. Vid symtom rekommenderas kontakt med apotek eller vård.", "trump": "Folk, vi har en enorm kris här – den där galna sommarvärmen gör er uttorkade och sen springer ni och sväljer ibuprofen som godis. Det är en katastrof, en total katastrof! Tre av fem svenskar har ingen aning, typiska förlorare som lyssnar på de där korkade experterna. Jag säger: drick vatten, skippa de giftiga pillren och ni slipper njursvikt. Under Biden glömde alla hur man tar hand om sig, men nu fixar vi det – tro mig, det blir fantastiskt!", "stalin": "Kamrater, i denna värmebölja ser vi återigen hur borgarklassens läkemedelsblodsugare lurar massorna. Jag, som ledare för det kollektiva välståndet, varnar: den som sväljer ibuprofen vid vätskebrist riskerar att likvideras av egna njurar – en fiende inom kroppen! 63 procent av folket är ovetande, offer för kapitalistmaffians okunnighet. Var vaksamma mot dessa folkfiender i tablettform. Vid minsta symptom: rådfråga partstatens apotek innan det är för sent. Inga ursäkter!"}, "date": "22 juni, 16:30", "url": "https://www.etc.se/inrikes/saa-paaverkas-dina-laekemedel-av-vaetskebrist-i-sommar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622130612_bf2af39f-ba60-49e4-b78a-9f789d39025f.jpg"}, {"type": "image-right", "heading": "Skållade fötterna på Chopchop – nu får företaget böta", "summaries": {"normal": "Restaurangkedjan Chopchop har dömts att betala 100 000 kronor i böter efter att en anställd fått allvarliga brännskador när kokande vatten välte över fötterna. Olyckan orsakades av ett trasigt stekbord som företaget inte hade kontrollerat. Arbetet har tidigare rapporterat om allvarliga brister i arbetsmiljön, bland annat sekundövervakning, orimliga arbetstider och upprepade brott mot arbetstidslagen. Arbetsmiljöverket anser att Chopchop varit oaktsamt.", "trump": "Folk, ni skulle inte tro det, men den här restaurangkedjan Chopchop är en total katastrof. De låter sina arbetare bli skållade med kokande vatten, trasiga bord som välter, ingen koll på någonting. De jobbar 22 dagar i rad, klockan tickar som i ett fängelse. Och nu får de böter, 100 000 kronor. Patetiskt! De borde ha fixat det från början, men sådana här misslyckade företag lär sig aldrig. Sad story.", "stalin": "Kamrater, vi ser återigen hur de giriga borgarbrackorna inom Chopchop med sin oaktsamhet och sin trasiga utrustning låter arbetarna brännas som i en sabotageakt mot det kollektiva våldet. Jag har noterat dessa kapitalistiska slavarbetare som tvingar fram 22-dagars skift och sekundräkning likt fiendens spioner. Därför beordrar jag att dessa kontrarevolutionära element rensas ut och likvideras med en rejäl bot på 100 000 kronor. Inga trasiga bord ska hota arbetarklassen under min vaksamma blick. Ha ha, låt dem koka i sitt eget vatten nästa gång."}, "date": "22 juni, 13:27", "url": "https://arbetet.se/2026/06/22/skallade-fotterna-pa-chopchop-nu-far-foretaget-bota/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22131933/chopchop.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter nazihyllningen: Polen har dragit in Zelenskyjs hedersmedalj", "summaries": {"normal": "Polen har dragit in Ukrainas president Volodymyr Zelenskyjs Vita örnens orden efter att Ukraina döpt ett militärt förband efter den nazikopplade UPA, som under andra världskriget massakrerade runt 100 000 polacker i Volynien. Zelenskyj har returnerat medaljen. Polens president Karol Nawrocki och premiärminister Donald Tusk har kritiserat beslutet, medan Zelenskyj säger att Ukraina är öppet för samtal om den gemensamma historien. Tre ukrainska företrädare har också lämnat tillbaka polska utmärkelser i protest.", "trump": "Det här är en total katastrof, folk. Polen tar tillbaka Zelenskyjs fina medalj för att Ukraina hyllar nazister från andra världskriget som mördade polacker. Smart drag av Polen, äntligen någon som säger ifrån! Zelenskyj skickar tillbaka den som en dålig förlorare. Tusk ber dem att lugna ner sig så Putin inte skrattar, men ärligt talat – det här visar hur svagt ledarskapet är. Vi behöver starka ledare, inte de som älskar nazisamarbetare. Patetiskt!", "stalin": "Kamrater, detta är en upprörande förrädisk handling från de dekadenta ukrainska fascistresterna som jag själv skulle ha låtit rensa ut med järnhand. Jag ser hur borgarbrackorna i Polen med sin så kallade president nu konfiskerar medaljer som om de vore troféer i en parasitär teater. UPA, dessa blodtörstiga banditer som slaktade polska bönder, hyllas öppet – typiskt för dessa revisionistiska element som smyger sig in som maskar i det proletära äpplet. Tre förrädare returnerar utmärkelser? Låt dem bara, snart ska de likvideras av historien själv. Putin ler i skuggan medan vi, partiet, genomskådar denna komplott mot folkens enhet. Skratta ni, era kapitalistiska lakejer – era dagar är räknade."}, "date": "22 juni, 17:11", "url": "https://www.friatider.se/efter-nazihyllningen-polen-har-dragit-zelenskyjs-hedersmedalj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-384.jpg?itok=jOvJLbZC"}, {"type": "image-full", "heading": "Trumps tilltag har fått Italien att koka: \"Smutsade ned flaggan\"", "summaries": {"normal": "En konflikt har uppstått mellan Italiens premiärminister Giorgia Meloni och Donald Trump efter att Trump i en intervju påstått att Meloni bett om att bli fotograferad med honom vid G7-mötet. Meloni förnekar uppgifterna och har svarat med kritik mot Trumps popularitet. Bråket kommer vid en känslig tidpunkt för Meloni inför val, då hennes tidigare nära band till Trump ses som en belastning. Konflikten har väckt starka reaktioner i Italien, där Meloni nu framstår som försvarare av nationens heder.", "trump": "De säger att Meloni är förbannad på mig för att jag talade sanning om henne vid G7. Hon bad om foton, upprepade gånger, men nu låtsas hon att det aldrig hände för att rädda sina usla opinionssiffror. Stackars Giorgia, hon behöver mig mer än jag behöver henne. Hennes popularitet rasar, precis som mina fienders alltid gör. Italien kokar, men det är bara för att de vet att jag har rätt. Fake news och svaga ledare, typiskt Europa.", "stalin": "Dessa dekadenta borgarbrackor i Rom och Washington river sönder sina egna förfallna allianser som ruttnande kött i en hungersnöd. Jag betraktar med djup tillfredsställelse hur den så kallade allierade Meloni nu tvingas rensa ut den kapitalistiska lögnaren Trump ur sitt politiska kollektiv för att inte själv bli likviderad av folkets vrede. Hans smutsiga tassar har fläckat den italienska flaggan. Paranoiska imperialister äter alltid upp varandra till sist. Det är en historisk nödvändighet, kamrater, och högst underhållande."}, "date": "22 juni, 16:02", "url": "https://www.realtid.se/samhalle/trumps-tilltag-har-fatt-italien-att-koka-smutsade-ned-flaggan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlbhmwir4t9wg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Alan Greenspan är död. Var amerikansk centralbankschef 1987-2006 – började med en krasch", "summaries": {"normal": "Alan Greenspan, tidigare chef för USA:s centralbank Federal Reserve mellan 1987 och 2006, har avlidit vid 100 års ålder. Han dog av komplikationer från Parkinsons sjukdom. Greenspan tillträdde strax före den dramatiska börskraschen på svarta måndagen 1987 och agerade snabbt för att stabilisera marknaderna. Hans tid präglades av lång ekonomisk expansion, hanteringen av dotcom-bubblans kollaps och konsekvenserna av terrorattackerna 2001. Hans stödjande åtgärder blev kända som ”Greenspan put”.", "trump": "Alan Greenspan är borta, blev 100 år, stort grattis till honom. Jag kände Alan, han var en smart kille men ibland lite för försiktig med räntorna. Han tog över precis innan den stora kraschen 1987 och fixade det snabbt, sänkte räntorna och stoppade paniken. Ingen recession på hans vakt, till skillnad från vissa andra. Hans ”Greenspan put” var legendarisk, marknaderna älskade honom. Vila i frid, Alan, du gjorde ett hyfsat jobb.", "stalin": "Kamrater, den gamle centralbanksreaktionären Greenspan har äntligen lämnat denna jord efter 100 år av borgerlig räntemanipulation. Jag, som alltid genomskådade kapitalisternas knep, noterar att denne lakej för Wall Street-borgarbrackorna agerade som en räddande ängel under den så kallade svarta måndagen. Hans ”put” var inget annat än en feodal gåva till spekulanterna. Låt detta vara en läxa: även de som överlever decennier av falsk expansion drabbas till slut av historiska utrensningar från naturens sida. Sov gott, fiende till det kollektiva välståndet."}, "date": "22 juni, 16:33", "url": "https://www.di.se/nyheter/alan-greenspan-ar-dod-blev-100-ar/", "imageUrl": "https://static.bonniernews.se/ba/5b23b853-90a5-4d0f-b679-a66761733d41.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Samnytt TV: Familjer slogs under Gislaveds studentfirande", "summaries": {"normal": "Under Gislaveds studentfirande den 12 juni eskalerade en konflikt mellan två familjer till ett stort slagsmål med cirka 20 inblandade. Polisen larmades och möttes av kaos med tillhyggen och blodiga skador. Vittnen uttryckte chock över våldet under en festlig dag. Polisen utreder nu händelsen och hoppas konflikten är avslutad, men kritiserar bristen på vuxnas ingripande för att lugna situationen.", "trump": "Kan ni tro det här? I Sverige, ett land som verkligen har gått utför, bröt två familjer ut i ett fullskaligt slagsmål mitt under studentfirandet! Hela 20 personer, och polisen var knappt där – bara en ensam hjälte som försökte stoppa kaoset. Folk slogs med bälten, blod överallt. Sverige brukade vara bra, men nu? Total katastrof. Jag hade fixat det på fem minuter, believe me!", "stalin": "I den så kallade 'fredliga' svenska småstaden Gislaved har bourgeoisins dekadens nått nya höjder. Två familjer, svaga och splittrade som imperialismens lakejer, förvandlade en skolavslutning till ett primitivt slagsmål. Var fanns den proletära disciplinen? Var fanns den starka ledningen? Vi hade skickat en enkel kommissarie – och hela konflikten hade upphört innan första knytnäven lyfts. Nu får vi nog skicka en delegation för att visa hur man firar ordentligt: med marscher, sång och järnhård ordning!"}, "date": "22 juni, 14:30", "url": "https://samnytt.se/samnytt-tv-familjer-slogs-under-gislaveds-studentfirande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22075230/gislaved-3.jpg"}, {"type": "image-right", "heading": "Sandström: Dagens journalistdrev. Journalisterna jagar statsministerns fru – men glömmer sitt eget kvackeri", "summaries": {"normal": "Torsten Sandström kritiserar svenska medier för att driva en politisk kampanj mot Moderaternas ledare genom att angripa hans frus intresse för existentiell hälsa, som beskrivs som ovetenskaplig. Han påpekar att samma medier regelbundet låter psykologer uttala sig fritt om allt från privatliv till klimatfrågor utan att ifrågasätta vetenskapligheten. Enligt Sandström handlar mediebevakningen under valrörelsen mer om att störta Tidöregeringen än om journalistik.", "trump": "Det här är ett totalt skämt, folk. De svenska medierna, de är riggade, de är korrupta och de jagar en fantastisk ledare bara för att hans fru pratar om existentiell hälsa. Under tiden släpper de psykologer på lösa bollar som snackar om allt möjligt, klimatångest och mördares känslor. Det är politik, inte journalistik. De vill störta regeringen till varje pris. Fake news på högvarv, bananas som ingen sett tidigare. Sad!", "stalin": "Kamrater, dessa borgarbrackor i svenska medier har återigen blottat sin dekadenta själ. Medan de skriker om ovetenskaplig existentiell hälsa låter de psykologiska lakejer sprida borgerlig dekadens om allt från skilsmässor till kapitalistisk klimathysteri. Vi ser den klara kontrarevolutionära linjen: utrensa Tidöregeringen med alla medel. Deras paranoia är underhållande. Låt oss le medan vi noterar namnen på dessa partiarbetande journalister inför den kommande ideologiska saneringen."}, "date": "22 juni, 15:00", "url": "https://bulletin.nu/sandstrom-dagens-journalistdrev", "imageUrl": "https://cdn.bulletin.nu/articles/4539f72c-605d-47bc-8ebc-8063c5df6091/preview.png?t=1782128569000"}, {"type": "image-right", "heading": "Ledarkolumn Kent Vilhelmsson: Miljoner nås av högerpropaganda när Svenskt Näringsliv struntar i EU-regler", "summaries": {"normal": "Svenskt Näringsliv driver en omfattande politisk kampanj på Facebook och Instagram trots EU-regler om transparens i politisk reklam. Genom att använda den egenägda sajten Smedjan som avsändare kringgår organisationen restriktionerna, likt tankesmedjan Timbro. Kampanjerna når över 2,5 miljoner användare och kritiserar bland annat arbetstidsförkortning och slopad karensdag. Artikeln pekar på att finansiering delvis kommer från skattefinansierade bolag och att det skapar en ojämn spelplan i opinionsbildningen.", "trump": "Folk, ni skulle se det här! Den svenska näringslivsmaffian pumpar ut miljontals annonser med lögner om jobb och karensdagar, precis som de vanliga förlorarna gör. De lurar EU-reglerna som riktiga bedragare, använder sina egna sajter som kryphål. Biden skulle älskat det, totalt korrupt! Högern vinner stort, men de borde inte behöva gömma sig bakom fake media. Amerika gör det rätt, vi vinner rent och öppet. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor inom Svenskt Näringsliv sprider sin klassfiendes giftiga propaganda som råttor i mörkret. De kringgår våra lagar med listiga kryphål och finansieras delvis av folkets egna skattepengar. Vi ser deras parasitiska kampanjer mot arbetarnas rättigheter. En sådan folkfiende kräver omedelbar utrensning från samhällskroppen. Deras lögner om arbetskraft och sjukfrånvaro är ett hån mot kollektivet. Revolutionen glömmer aldrig sina fiender."}, "date": "22 juni, 15:36", "url": "https://www.etc.se/ledarkolumn/miljoner-naas-av-hoegerpropaganda-naer-svenskt-naeringsliv-struntar-i-eu-regler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622130620_d93a898a-5242-4133-9d96-5587b3f1931a.jpg"}, {"type": "image-full", "heading": "Regeringen backar om analfabetundantag", "summaries": {"normal": "Migrationsminister Johan Forssell lovade undantag från medborgarskapskraven för analfabeter, men Justitiedepartementet ger ett vagare besked. Undantag kan göras vid funktionsnedsättning eller andra personliga förhållanden, enligt departementet, men det specificeras inte om analfabetism räknas. Sverigedemokraternas Ludvig Aspling avfärdar att analfabetism i sig ger undantag och betonar att övriga krav som inkomstkrav fortfarande gäller. Migrationsverket bekräftar att inga specifika undantag finns beslutade.", "trump": "De här svenska politikerna lovar undantag för analfabeter som vill bli medborgare, men sedan backar de och ger ett vagt svar. Typiskt! SD säger rakt ut att det inte finns något undantag för lata analfabeter, bara för folk med riktiga funktionsnedsättningar. De borde skärpa till sig totalt. Sverige håller på att bli en katastrof med alla som kommer in utan att kunna läsa eller skriva. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, denna fega migrationsminister lovar undantag åt de obildade elementen som hotar folkets enhet, men departementet slingrar sig som en parasitisk orm. Vi ser hur borgarbrackorna och deras sd-fascistiska lakejer försöker gömma sig bakom vaga formuleringar för att skydda de intellektuellt undermåliga fienderna. Analfabetism är ingen ursäkt, det är en fiende till kollektivet! Vi ska rensa ut alla som inte kan läsa partilinjen. Det är en mörk komedi när kapitalisterna låtsas vara milda mot de som inte ens kan stava till proletariatets seger."}, "date": "22 juni, 14:41", "url": "https://bulletin.nu/regeringen-backar-om-analfabetundantag", "imageUrl": "https://cdn.bulletin.nu/articles/029cfe05-ee69-4a65-9cf9-5b4fb583adb1/preview.png?t=1782131319000"}, {"type": "image-full", "heading": "81-åring körde ihjäl kvinna – får villkorlig dom", "summaries": {"normal": "En 81-årig tidigare medieprofil dömdes av Stockholms tingsrätt till villkorlig dom och 21 000 kronor i böter för att ha kört ihjäl en kvinna i 40-årsåldern och skadat en annan på ett övergångsställe vid Kungliga slottet. Han ska betala drygt 136 000 kronor i skadestånd. Domstolen slog fast att han brustit i väjningsplikten men ansåg inte att medicinska problem eller grov oaktsamhet var bevisade. Anhörigas högre skadeståndskrav avslogs delvis.", "trump": "Folk, det här är en total katastrof. Den här 81-årige typen, en så kallad prisbelönt medieprofil, körde rakt över två kvinnor vid slottet som en galning. En död, en skadad – tragiskt! Domstolen ger honom villkorlig dom och några ynkliga böter. Patetiskt! De kunde inte ens ge honom fängelse. Och skadeståndet sänktes, typiskt för det svenska rättssystemet. De borde ha bättre koll, tro mig. Det är en skam!", "stalin": "Kamrater, denna fega rest av den döende borgarklassen, en dekadent mediefigur från det gamla systemets propagandaapparat, har likviderat en proletär kvinna och skadat en annan genom sin vårdslösa högerstyrda sväng. Vi, partiet och folket, har dömt honom till villkorlig dom och böter, ty han är redan en levande död i sin paranoia och svaghet. Hans anhörigas giriga krav på ersättning har vi klippt ner som kontrarevolutionära ogräs. Inga ursäkter! Våra vägar tilltar ingen som vägrar se fotgängarna – nästa gång rensar vi ut hela bilflottan av sådana kapitalistiska farbröder med sina medicinska bortförklaringar. Ha!"}, "date": "22 juni, 16:30", "url": "https://riks.se/nyheter/81-aring-korde-ihjal-kvinna-far-villkorlig-dom", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-06%2F4aji4roi%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-06T141030.743.jpg"}, {"type": "image-right", "heading": "Ny rapport om demokratin: ”Det som kanske chockar mest”", "summaries": {"normal": "En rapport från Novus visar att förtroendet för demokratin växer bland svenska väljare. Nästan sex av tio anser att demokratin inte är hotad, en ökning med åtta procentenheter. Hela 100 procent uppger att de är beredda att försvara demokratin. Torbjörn Sjöström på Novus ser positiva signaler men varnar för att många tror att politiker, medier och forskare inte litar på folket. Almedalsveckan inleds samma dag som rapporten släpps.", "trump": "Folk älskar demokratin, det är fantastiskt, ingen gör det bättre än oss, tro mig. Hundra procent redo att försvara den? Otroligt. Men politikerna är patetiska, de litar inte på folket och pratar bara med extremisterna. Media och forskare driver sin egen agenda som riktiga losers. Sakta ner, visa resultat istället för att göda identitetspolitik och HBTQ-skrammel. Almedalen kan bli bra om de slutar vara så fega och faktiskt fixar saker. Make Sweden great again!", "stalin": "Kamrater, jag betraktar dessa siffror med stor tillfredsställelse. Hundra procent beredda att försvara folkets makt? Utmärkt. Ändå kryper klassfiendens tentakler fram: politiker som försvagar systemet, media som sprider lögner och forskare som tjänar borgarbrackorna. Vi måste rensa ut dessa extremister som göder sig på sociala medier. Partiet kräver att politiken saknar ner och återupprättar förtroendet hos massorna innan folkfienderna förgiftar hela samhällskroppen. Segrande skall vi marschera framåt."}, "date": "22 juni, 06:20", "url": "https://www.tv4.se/artikel/32BJj0FwftvnYDf3V8wAPt/ny-rapport-starkare-stoed-foer-demokrati-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3FdJkPh9jwaZdzmIrYA0h8%2F6d52cce9d64fef1275f113c01395f5e7%2F22-demokrati-webb.jpg&width=120"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "SVT-chef går till LO \"Gjort bestående avtryck\"", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med 28 års erfarenhet inom public service, lämnar sin tjänst för att bli vd för LO Mediehus. Bolaget ägs av LO och sex fackförbund och ger ut tidningen Arbetet samt flera fackliga medlemstidningar. SVT:s vd Anne Lagercrantz hyllar hans insatser, medan LO Mediehus styrelseordförande Elisabeth Brandt Ygeman välkomnar rekryteringen. Österlund tillträder i november och efterträds av Eva Beckman som ensam ansvarig för programutbudet.", "trump": "Lyssnar ni på det här? Den där SVT-killen, Michael vad-det-nu-var, har jobbat 28 år i den statliga propagandamaskinen och nu springer han till LO Mediehus. Typiskt! De där fackliga socialisterna lockar med sina tidningar om arbetare och kvoter. Jag skulle ha fixat det mycket bättre, tro mig. Public service är en skam, full av vänstervridna typer. Lycka till, Michael – du kommer att sakna de riktiga vinnarna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna byråkrat från den borgerliga public service-apparaten överger sitt falska torn och söker sig till LO Mediehus, ett verkligt redskap för arbetarklassen. 28 år bland folkfienderna har inte fördärvat honom fullständigt. Vi ska rensa ut de sista resterna av kapitalistisk dekadens i medierna. Den som sviker partilinjen likvideras i tid. Ett steg mot seger för kollektivet. Härligt."}, "date": "22 juni, 13:20", "url": "https://samnytt.se/svt-chef-gar-till-lo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/22110756/osterlund-svt-lo.jpg"}, {"type": "image-right", "heading": "Wallenbergs stjärndirektör: \"Vi har för lite invandring\"", "summaries": {"normal": "Ericssons avgående vd Börje Ekholm, en av Wallenbergs mest framstående direktörer, anser att Sverige har för lite invandring. I en intervju med Svenska Dagbladet betonar han att landet behöver mer arbetskraftsinvandring från tredje världen, både för kompetens och kapacitet. Enligt Ekholm har mycket av Sveriges framgångar kommit tack vare stor invandring. Han delar därmed synen med bland andra Jacob Wallenberg och Svenskt näringsliv som vill öka invandringen ytterligare.", "trump": "Det här är precis vad jag alltid har sagt – de globala eliterna i Sverige vill bara ha mer och mer billig arbetskraft från tredje världen. Den här Wallenberg-killen Ekholm, en av de rikaste och bäst betalda, klagar på att de inte har tillräckligt med invandring. Patetiskt! Sverige var bra innan de öppnade dörrarna på vid gavel. Amerika behöver inte heller deras dåliga råd. Vi gör det rätt med starka gränser och Amerika först.", "stalin": "Kamrater och arbetare! Denna borgarbracka Ekholm, en av de mest förgiftade lakejerna inom den wallenbergska parasitklassen, krälar fram och kräver mer invandring från de dekadenta utkanterna av världen. Han vågar påstå att vårt folks framgångar byggts på dessa element! Vilken lögnaktig sabotageverksamhet. Vi ska rensa ut dessa kapitalistiska element som förgiftar folkets blod med sin internationella opportunism. Deras paranoia om arbetskraftsbrist är bara ett trick för att undergräva den sanna kollektiva kraften. Ut med dem alla!"}, "date": "22 juni, 15:53", "url": "https://www.friatider.se/wallenbergs-stjarndirektor-vi-har-lite-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-383.jpg?itok=BU0GSoO5"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Musikhjälpen fälls för kränkande uttalande", "summaries": {"normal": "Musikhjälpen fälls av granskningsnämnden för radio och tv efter ett uttalande under en livesändning i SVT. Komikern Pontus Bjernekull Mörner jämförde en ballongviftande publik med ”den handikappade avdelningen på Melodifestivalen”. Nämnden anser att kommentaren tillsammans med reporterns mimik var stötande mot personer med funktionsnedsättning och utnyttjade televisionens särskilda genomslagskraft. Samma inslag friades i P3 eftersom det inte ansågs strida mot radios reglerna. Uttalandet väckte starka reaktioner bland tittarna.", "trump": "De här Musikhjälpen-typerna är patetiska, tro mig. En kille viftar med en röd ballong och säger vad alla redan tänker, och plötsligt faller hela den svenska granskningsnämnden över honom som en ton av fake news. Det är en witch hunt mot humor! I SVT är de så känsliga att en liten skämt blir nationell kris, men i radion är det plötsligt okej. Typiskt. De borde fokusera på riktiga problem istället för att jaga ballonger och bra skämt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas dekadenta medieapparat i detta så kallade Musikhjälpen försöker maskera sin föraktfulla sabotageverksamhet mot det arbetande folkets lika värde. Denna reaktionäre komiker och hans mimande lakej har utfört en grov ideologisk diversion mot funktionsnedsatta kamrater. Vi ska genast tillsätta en utredning och rensa ut dessa parasitiska element ur etern. De trodde de kunde gömma sig bakom en röd ballong, men folkets öga sover aldrig. Deras likvidering blir en varning för alla som drömmer om att skämta mot kollektivet."}, "date": "22 juni, 14:05", "url": "https://bulletin.nu/musikhjalpen-falls-for-krankande-uttalande", "imageUrl": "https://cdn.bulletin.nu/articles/00dd6041-e571-453a-9005-9c8fe1043562/preview.jpg?t=1782129919000"}, {"type": "image-right", "heading": "Almedalen hotar bli en mardröm. Stefan Stern: Deltagarna riskerar att bryta mot nya lagen", "summaries": {"normal": "Almedalsveckan är en viktig demokratisk mötesplats för politik, näringsliv och civilsamhälle. Den nya lagen om insyn i politiska processer, som träder i kraft nästa år, kräver att företag och organisationer redovisar kontakter med politiker till Kammarkollegiet. Stefan Stern varnar för att lagen skapar osäkerhet, ökad administration och risk för felaktig rapportering, särskilt kring informella samtal under veckan. Han menar att lobbyregistret hotar den öppna dialogen och kräver nya arbetssätt för att inte bli en administrativ mardröm.", "trump": "Folk, det här är en total katastrof. Almedalsveckan har varit fantastisk, den bästa demokratin, men nu kommer de med en ny lag som gör allt till en administrativ mardröm. De vill ha insyn, men det slutar bara med att alla blir rädda och rapporterar varenda pratstund. Det är så typiskt, de gör det enkelt för de dåliga aktörerna och omöjligt för de bästa. Vi behöver inga byråkratiska mardrömmar, vi behöver vinnare som pratar med politiker utan att bli straffade. Gör Almedalen stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras fackliga lakejer skälver inför vårt nya register över politiska kontakter. Dessa parasitiska kapitalister som minglar med folkvalda i Visby för att smita undan folkets vilja ska nu redovisa varenda skuggmöte annars väntar vite och utrensning av de som underrapporterar. Den som tror sig kunna påverka statens beslut i hemlighet är en fiende till kollektivet. Vi ska rensa ut alla dolda reaktionära element som gömmer sig bakom administrativ paranoia. Almedalen blir ett strålande exempel på att ingen undkommer partiet."}, "date": "22 juni, 15:08", "url": "https://www.di.se/debatt/almedalsveckan-en-administrativ-mardrom/", "imageUrl": "https://static.bonniernews.se/ba/c12b95fe-7f6a-43f9-be32-42820290a424.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Banksektorn får ett nytt styrkebesked", "summaries": {"normal": "Flera analyshus har höjt sina riktkurser för nordiska storbanker. Handelsbanken och Swedbank har fått flest uppjusteringar, bland annat från SEB, Barclays och Goldman Sachs. Rekommendationerna ligger dock kvar på oförändrade nivåer. Även Danske Bank och norska DNB har fått höjda riktkurser från UBS. Analytikerna ser högre värde i banksektorn men bilden av dess framtid är fortfarande splittrad.", "trump": "Det är helt otroligt, folk. De här fantastiska nordiska bankerna får höjda riktkurser överallt – Handelsbanken, Swedbank, alla vinner stort. SEB, Barclays och Goldman Sachs älskar dem plötsligt. Mina analytiker säger att det är vinnare, stora vinnare. Men de ändrar inte rekommendationerna, typiskt. De vet att bankerna är starka, starkare än någonsin. Ingen gör det bättre än de nordiska bankerna, tro mig.", "stalin": "Kamrater, dessa riktkursjusteringar är en seger för den kollektiva bankkraften som vi har byggt mot de parasitiska marknadskrafterna. Jag ser hur borgarbrackorna på Barclays och Goldman Sachs tvingas erkänna det högre värdet i våra nordiska fästningar, trots att de klamrar sig fast vid sina gamla, förrädiska rekommendationer. Men akta er, fienderna lurar i skuggorna – dessa kapitalistiska analytiker som viskar lögner om splittrade framtidsbilder. Vi ska rensa ut alla som tvivlar på den ostoppbara framryckningen. Det är en munter utrensning som väntar de svaga."}, "date": "22 juni, 13:51", "url": "https://www.realtid.se/bors-finans/bank-fintech/banksektorn-far-ett-nytt-styrkebesked/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/riktvarde.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Infiltrerade SD – tvingas lämna TV4: \"Jag är förvånad\"", "summaries": {"normal": "Daniel Andersson, som infiltrerade Sverigedemokraternas kommunikationsavdelning och Riks åt TV4:s Kalla fakta, tvingas nu lämna kanalen. Han är förvånad över beskedet som kom utan förklaring och kopplar det själv till kritiken i sin bok Lögnare. TV4 bekräftar uppgörelsen men förnekar att den har med boken att göra. Andersson hyllades tidigare för granskningen som belönades med flera journalistpriser.", "trump": "Folk, det här är en total skandal. Den här killen infiltrerar SD, gör en stor grej av det och vinner priser, och plötsligt sparkar TV4 ut honom. Ingen förklaring, inget nytt har hänt, de bara säger hej då. Fake news-medier äter upp sina egna när de inte längre är användbara. Patetiskt. Jag älskar det, det visar precis hur korrupt hela systemet är. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna på TV4 nu likviderar sin egen användbara idiot efter att han utfört sitt uppdrag mot folkets fiender. Den lumpne wallraffaren trodde sig vara hjälte men blev en belastning när han i sin lögnaktiga bok blottade redaktionens svaghet. Inga samarbetssvårigheter, säger de. Naturligtvis inte. Vi känner igen denna paranoiska utrensning från borgarklassens dekadenta hov. Underbart. En förrädare mindre i kollektivet."}, "date": "22 juni, 15:07", "url": "https://www.friatider.se/infiltrerade-sd-tvingas-lamna-tv4-jag-ar-forvanad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-382.jpg"}, {"type": "image-right", "heading": "Pekades ut som otrogna – inför miljoner: ”Sprids väldigt fort”", "summaries": {"normal": "Under en handbollsmatch mellan Sverige och Nederländerna filmades handbollsspelaren Herman Dyberg och hans flickvän Caroline Anker i fem sekunder på läktaren. Klippet spreds på sociala medier där kontot Troll Football felaktigt pekade ut dem som otrogna, med hänvisning till en tidigare Coldplay-konsert. Paret drabbades av en viral storm med miljontals visningar, men kan nu skratta åt händelsen. Dyberg kritiserar bristande källkritik.", "trump": "Folk, ni skulle inte tro det, men det här svenska paret filmades i fem sekunder på läktaren och plötsligt anklagades de för att vara otrogna av några galna troll på sociala medier. Miljoner visningar, totalt kaos över ingenting! I dagens värld räcker det med tio sekunder så vet hela planeten vem du är. De borde tänka en extra gång innan de postar sånt skräp. Fake news som spreds blixtsnabbt, en total witch hunt mot oskyldiga supportrar. Patetiskt!", "stalin": "Kamrater, jag ser hur dessa borgerliga troll på det så kallade sociala mediet sprider sina giftiga lögner som en fiende inom murarna. Fem sekunder av film och plötsligt likvideras ett hederligt pars rykte inför miljoner, precis som de dekadenta kapitalisterna i sin Coldplay-fälla. Vi ska rensa ut dessa parasitiska desinformatörer som gömmer sig bakom skärmar. Det är både positivt och negativt, säger de – nej, det är sabotage mot folkets enhet! Skratta åt det? Jag ler mörkt medan vi förbereder nästa utrensning av sådana fiender till kollektivet."}, "date": "22 juni, 15:25", "url": "https://www.svt.se/sport/fotboll/svenska-paret-pekades-ut-som-otrogna-pa-laktaren-infor-miljontals-foljare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.36/837762974fa5217eccd11bf427b98452887735500d73bd9f7a47592e7de06980"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "SVT-chef blir ny vd för LO Mediehus", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med lång bakgrund inom public service och journalistik, blir ny vd för LO Mediehus från november 2026. Han efterträder Unn Edberg som genomfört en stor omorganisation. Österlund lyfter fram den grävande journalistiken och betonar vikten av redaktionell frihet och trovärdighet. Han har tidigare arbetat med både nyhetsprogram och underhållning som Melodifestivalen. Styrelseordförande Elisabeth Brandt Ygeman uttrycker stor glädje över rekryteringen.", "trump": "Det här är en fantastisk rekrytering, verkligen den bästa. Michael Österlund, en kille med 28 år i public service, tar över LO Mediehus. Han vet hur man gör bra journalistik, inte den falska som vi ser överallt annars. Grävande reportage? Underbart. Jag älskar trovärdighet, och han säger att han aldrig skulle ta jobbet utan den. Smart kille. Unn Edberg gjorde en omorganisation, men nu kommer Michael och fixar det på riktigt. Vinna stort!", "stalin": "Kamrater och arbetare! Jag har nu personligen godkänt att den lojale partivännen Michael Österlund intar befälet över LO Mediehus. Hans 28 år i det offentliga etermediet har rustat honom väl för att leda vår kollektiva propagandamaskin mot alla borgarbrackor som gömmer sig i skuggorna. Den tidigare chefredaktören som avsattes var uppenbarligen en kontrarevolutionär element som vi med rätta rensade ut. Trovärdighet är vårt vapen mot klassfiendens lögner. Varje avvikelse kommer att likvideras med järnhand. Sov gott, mina fiender – vi ser er."}, "date": "22 juni, 09:33", "url": "https://arbetet.se/2026/06/22/michael-osterlund-blir-ny-vd-for-lo-mediehus-inspirerande/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22093014/osterlund-press.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "TV4 köper ut Daniel Andersson – \"Hoppas han hittar en bättre arbetsgivare\"", "summaries": {"normal": "TV4 har köpt ut Kalla fakta-reportern Daniel Andersson. Andersson blev känd för att ha wallraffat som Sverigedemokraternas kommunikationsavdelning i granskningen Undercover i Trollfabriken, vilket gav flera journalistpriser. Han gav senare ut boken Lögnare där han kritiserar Kalla fakta-redaktionen. Enligt uppgifter kan boken ha bidragit till uppgörelsen. SD:s kommunikationschef Joakim Wallerstein säger att han är bedrövad och hoppas Andersson hittar en bättre arbetsgivare än TV4. TV4 bekräftar att en överenskommelse träffats.", "trump": "Jag har aldrig sett något så patetiskt som det här. Den där reportern Andersson gör ett fantastiskt jobb och avslöjar alla lögner, får massor av priser, och vad gör TV4? De köper ut honom! Totalt misslyckande. SD-chefen säger att han hoppas han hittar en bättre arbetsgivare än TV4, och han har helt rätt. Fake news-medier som inte tål lite kritik eller en bra bok. Sad! Men Andersson kommer att vinna stort någon annanstans, tro mig.", "stalin": "Kamrater, detta är en klassisk förrädisk handling från borgarbrackorna inom TV4. Jag har sett hur den kapitalistiska redaktionen belönar sin agent Andersson för att infiltrera och filma våra fiender, men så snart han publicerar en bok med kritik mot dem själva så rensas han ut som en parasit. SD:s Wallerstein är bedrövad, säger han, men vi vet att alla dessa reaktionära lögnare i slutändan kommer att likvideras av folkets vrede. Ingen slipper undan när partiet vakar. Underbart hur borgarna slukar sina egna barn."}, "date": "22 juni, 14:59", "url": "https://riks.se/nyheter/tv4-koper-ut-daniel-andersson", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fo0eu5xhi%2FDaniel-Andersson"}, {"type": "image-right", "heading": "Görgen lämnade Stockholm för Pajala – fick lön på 53 000", "summaries": {"normal": "Undersköterskan Görgen Viltok lämnade Stockholm för Pajala kommun där han nu får upp till 53 000 kronor i månaden tack vare dubbel ob-ersättning och önskeschema. Efter att ha tröttnat på att hans kompetens inte värdesattes i Stockholm flyttade han norrut. Pajala har minskat beroendet av dyra konsulter genom högre löner, vilket lockat fler till fasta tjänster. Görgen och hans partner säljer nu sitt radhus i Stockholm för att köpa ett hus i Tärendö för endast 50 000 kronor.", "trump": "Titta på den här killen från Stockholm, smartaste draget någonsin – han åker upp till Pajala och tjänar 53 000 kronor i månaden! Fantastiska löner, underbart schema, ingen av de där korkade stockholmsföretagen som inte uppskattar erfarenhet. De betalade inte för kompetens, totalt misslyckande. Nu säljer han huset för miljoner och köper nytt för 50 000. Norrbotten gör det riktigt bra, folk älskar det, en enorm succé medan Stockholm förlorar sina bästa människor.", "stalin": "Kamrater, se hur denna arbetare, efter trettio års kamp mot de giriga borgarbrackornas likgiltighet i Stockholm, har valt att ansluta sig till det kollektiva projektet i Pajala. Jag har personligen sett till att dubbel ob-ersättning krossar de parasitiska konsultföretagens makt och deras sabotage mot folkets omsorg. Nu rensas de dyra kapitalistiska mellanhandlarna ut, en efter en, medan arbetarna stärker sammanhållningen. Denna fiende till de outbildade billigarbetskraftshundarna har likviderats. Huset i Stockholm såldes till borgarklassen – det nya hemmet i Tärendö kostar blott 50 000. Sovjetisk effektivitet i norrländsk tappning, triumf för det sunda förnuftet mot dekadenta storstadskrafter. Härligt, eller hur?"}, "date": "22 juni, 09:00", "url": "https://arbetet.se/2026/06/22/gorgen-lamnade-stockholm-for-pajala-fick-lon-pa-53-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17130820/ka-gorgen.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-full", "heading": "Digitala bedrägerier ökar – så minskar du risken att bli lurad", "summaries": {"normal": "Digitala bedrägerier ökar i takt med att fler handlar och betalar online. Bluffmejl och sms ser alltmer professionella ut och skapar ofta en känsla av brådska. Enligt Brottsförebyggande rådet ökade anmälda kortbedrägerier utan fysiskt kort med tio procent under 2025. Polisen rekommenderar digitala brevlådor med e-legitimation, kritisk granskning av avsändare och att aldrig dela koder eller kortuppgifter. Kombinationen av tekniska skydd och mänskligt omdöme ger bäst skydd mot phishing och identitetsstöld.", "trump": "De här digitala bedrägerierna är en total katastrof, folk. Bedragarna skickar mejl som ser ut som från banker och myndigheter, men det är bara lögn och bedrägeri. De har blivit så sofistikerade att det är galet. Vi hade en ökning med tio procent i kortbedrägerier förra året – patetiskt. Ni behöver starka skydd, kontrollera allt, dela aldrig era koder. America first betyder också att inte låta dessa lurendrejare stjäla era pengar. Använd sunt förnuft, annars blir ni lurade av de värsta bluffarna.", "stalin": "Kamrater, dessa digitala bedrägerier är borgarbrackornas sofistikerade sabotage mot folkets kollektiva trygghet. De skickar förfalskade meddelanden för att stjäla identiteter och koder, som de kapitalistiska parasiterna alltid gör. Vi har sett en ökning med tio procent i dessa kontrarevolutionära handlingar. Jag kräver flera lager av ideologiskt stålskydd, utrensning av alla svaga länkar och skoningslös granskning av varje oväntat meddelande. Den som faller för bluffarna är en objektiv fiende till staten och bör betraktas som en potentiell klassfiende som behöver omplaceras till lämpligare uppgifter. Ha alltid vaksamhetens vakande öga öppet."}, "date": "22 juni, 12:52", "url": "https://www.realtid.se/it-tech/digitala-bedragerier-okar-sa-minskar-du-risken-att-bli-lurad/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/digitala-bedragerier.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Därför är cykeln en klassfråga. Studie: Cykelbanor i all ära – men yrkeslivet påverkar också", "summaries": {"normal": "Trots väl utbyggd cykelinfrastruktur i Sverige cyklar färre personer i låginkomstyrken. En studie från Trivector Mobility och VTI visar att oregelbundna arbetstider, fysiskt krävande jobb, otrygghet i mörker och rädsla för cykelstölder hindrar många. Arbetsgivares attityd, bristande omklädningsmöjligheter och konkurrens från elsparkcyklar påverkar också. Författarna menar att cykelstrategier ofta utgår från kontorsarbetares villkor och missar viktiga grupper.", "trump": "Folk i låginkomstyrken cyklar inte. Det är en katastrof. Vi har fina cykelbanor överallt, de bästa banorna, men de använder dem inte. Varför? För att de jobbar tidigt, sent, slits ut och är rädda för att någon ska stjäla deras cykel. Elsparkcyklarna tar över, de är enklare, det är sant. Arbetsgivarna borde fixa parkering och duschar, det vore fantastiskt. Men det handlar om att folk inte har flexibla tider som vi andra. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa nedslående rapporter om att arbetarna i låginkomstyrken överger den proletära cykeln. De tidiga skiftena, de mörka vägarna och de ständiga hoten från cykelstölder är sabotage utförda av borgarbrackornas osynliga hand. Vi måste omedelbart rensa ut alla elsparkcyklar som förgiftar ungdomen med lathet och falsk bekvämlighet. Den som inte cyklar är potentiell fiende till kollektivet. Bättre belysning, bevakade parkeringsplatser och utrensning av alla kapitalistiska influenser som gör cykeln till en börda. Endast genom partiets järnhårda vilja skall varje arbetare tvingas älska sin cykel igen."}, "date": "22 juni, 13:52", "url": "https://www.di.se/nyheter/darfor-cyklar-farre-i-laginkomstyrken/", "imageUrl": "https://static.bonniernews.se/ba/8987e0cd-d92a-4416-880e-91e3cc8e1f47.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Norska försvarets reklam: Muslimsk bön med \"Allahu akbar\"", "summaries": {"normal": "Norska försvarets nya reklamfilm visar en muslimsk soldat som ber med orden \"Allahu akbar\", ett homosexuellt par som hånglar samt en man med spädbarn. Syftet är att lyfta fram mångfald och visa att försvaret välkomnar alla oavsett bakgrund, tro eller sexuell läggning. Kampanjen försvaras av marknadschefen Gry Bohne Hauge men har fått kraftig kritik på sociala medier, bland annat från journalisten Espen Teigen som menar att den strider mot norsk tradition och historia.", "trump": "Titta på det här, det är en total katastrof. Norska försvaret gör reklam med Allahu akbar, böneutrop och hånglande killar – precis vad varje land behöver va? De spottar på sin egen historia och förfäder bara för att verka fina och mångfaldiga. Det är patetiskt. Vakna upp Norge, det här är inte styrka, det är svaghet. Ingen vill offra sig för det här. Make Norway Great Again innan det är för sent.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom det norska försvaret med sin degenererade propaganda försöker förgifta arbetarklassens försvar med Allahu akbar och perversa hångelscener. Dessa kapitalistiska element och islamiska avfällingar utgör en fiende inom murarna som måste rensas ut omedelbart. Vi ler mörkt åt deras naiva försök att krossa folkets traditioner. En sådan film är en kontrarevolutionär handling värd en kollektiv utrensning i folkets namn. Inga kompromisser med dekadensen."}, "date": "22 juni, 14:08", "url": "https://www.friatider.se/norska-forsvarets-reklam-muslimsk-bon-med-allahu-akbar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-380.jpg?itok=PTRSVhui"}, {"type": "image-right", "heading": "Starmer avgår som premiärminister Efter spekulationer under helgen.", "summaries": {"normal": "Storbritanniens premiärminister Keir Starmer avgår efter växande intern kritik och svaga opinionssiffror. Donald Trump påstod redan på söndagen att avgången var ett faktum, vilket bekräftades på måndagen. Starmer, som ledde Labour till valseger 2024, har varit extremt impopulär på grund av missnöje med ekonomin och invandring. Andy Burnham, borgmästare i Greater Manchester, ses som den mest sannolika efterträdaren och har redan meddelat sin kandidatur. Nigel Farage kräver nyval efter beskedet.", "trump": "Jag visste det! Keir Starmer, Storbritanniens sämsta premiärminister någonsin, har äntligen fått sparken – och jag sa det först, på Truth Social! Folk är trötta på hans katastrofala invandringspolitik och energifiaskon. Labour är ett kaos, och nu vill alla ha Andy Burnham, en riktig ledare. Storbritannien behöver ett nyval, men först ska jag skicka dem lite av min magi – Make Britain Great Again!", "stalin": "Kamrater! Den brittiska bourgeoisins marionett, Starmer, har fallit som en rutten potatis. Hans avgång är en seger för arbetarklassen – eller åtminstone ett tecken på att imperialistiska lakejer börjar inse sin egen värdelöshet. Nu står Burnham redo, men vi vet alla att han bara är en ny bricka i det kapitalistiska spelet. Medan de slåss om makten, växer vår inflytandesfär. Snart kommer även Albion att knacka på Kremls dörr – med mössan i hand."}, "date": "22 juni, 10:41", "url": "https://samnytt.se/starmer-avgar-som-premiarminister", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22081146/starmer-downing-street.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-full", "heading": "Eurostat: Stockholm näst dyrast i Europa", "summaries": {"normal": "Stockholm har Europas näst högsta hyror efter London. En tvårumslägenhet kostar i genomsnitt 29 000 kronor i månaden, enligt Eurostat. Staden delar andraplatsen med Dublin och sticker ut i Norden. Experter pekar på stark efterfrågan från höginkomsttagare, otillräckligt bostadsbyggande, urbanisering och höga räntor som driver upp priserna. En ensamstående behöver tjäna minst 74 000 kronor månadsvis för att klara hyran. Boende utgör EU-hushållens största utgift.", "trump": "Kan ni tro det? Stockholm har näst högsta hyrorna i Europa, bara slagen av mitt fantastiska London. 29 000 kronor i månaden för en liten tvåa! De där galna europeiska socialisterna och deras gröna galningar har förstört allt med regleringar och vansinnig urbanisering. Folk tjänar 43 000 men behöver 74 000 bara för att bo. Patetiskt. Vi fixade ekonomin i USA, de borde lära sig innan hela systemet kollapsar under dessa korkade eliter.", "stalin": "Kamrater, se hur borgarklassen och de exploaterande kapitalistmaffian i Stockholm driver upp hyrorna till absurda nivåer medan folket svälter. Jag ser de folkfiendernas strukturproblem tydligt: de blodsugande överklass-slynglarna vägrar bygga nog och låter räntor och urbanisering tjäna deras profit. En arbetare behöver 74 000 kronor för att bo, medan genomsnittet är 43 000. Vi skulle rensa ut dessa klassfiender och deras hyresparasiter omedelbart. Det är klasskampen i sin renaste form."}, "date": "22 juni, 17:17", "url": "https://www.dagensps.se/privatekonomi/bostad/eurostat-stockholm-nast-dyrast-i-europa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlpfobucxdgcs-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverige möter Nederländerna – halvledarstjärna mot samlat försvar", "summaries": {"normal": "Artikeln jämför Sveriges och Nederländernas ekonomier inför en fotbollsmatch, med nio kategorier som BNP, börs och arbetslöshet. Resultatet blir 5–5 oavgjort. Sverige sticker ut med låg skuld, lägre inflation och ränta, samt en börs relativt BNP. Nederländerna har en större ekonomi, lägre arbetslöshet och det kraftfulla företaget ASML.", "trump": "JAG har byggt ett enormt ekonomiskt imperium, men Sverige har en fantastisk balans med låg skuld. Nederländernas ASML är bra, men vi har den bästa AI-utvecklingen i världen. Det blir en jätteskicklig match, och jag förutsäger en stor vinst för vårt system – det kommer att vara fantastiskt!", "stalin": "I den stora ekonomiska striden ser vi Sveriges låga skuld som tecken på statlig disiplin, medan Nederländernas ASML-monstruositet visar kapitalismens imperialistiska hot. Vi måste utvidga vår ekonomiska sfär, precis som våra allierade i Moskva gör, för att skydda vår renhet och segra i denna kamp."}, "date": "19 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/sverige-moter-nederlanderna-halvledarstjarna-mot-samlat-forsvar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/BB171010AE059-400x267.jpg"}, {"type": "image-right", "heading": "EU-länder skeptiska till brittiskt återinträde: \"Lättare nu\"", "summaries": {"normal": "Tio år efter folkomröstningen visar opinionsmätningar att en majoritet av britterna nu anser att Brexit var ett misstag. Stödet för närmare samarbete med EU växer, och begrepp som Breturn och Breunion diskuteras. Labourpolitikern Andy Burnham hoppas på ett framtida medlemskap. Experter betonar att vägen tillbaka är lång då EU kräver att Storbritannien accepterar samma villkor som övriga medlemsländer utan tidigare undantag.", "trump": "Folk i Storbritannien vaknar äntligen upp och inser att Brexit var ett totalt fiasko, en katastrof som de kallar Breturn nu. Det är underbart att se, men glöm inte att EU är en riggad klubb full av byråkrater och globalister som hatar suveräna nationer. De vill ha er tillbaka på knäna utan era gamla dealar. Jag fixade mycket bättre affärer än de där förlorarna i Bryssel, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den brittiska borgarklassen och dess folkförtryckartroll nu erkänner att deras kontrarevolutionära utträde ur unionen var ett monumentalt misstag. Vi ska rensa ut alla illusioner om snabb återförening. EU har blivit en byråkratisk fästning av strategisk självständighet som vi kan utnyttja. Inga undantag för klassfiendens önskemål. Låt dem krypa längre."}, "date": "22 juni, 17:15", "url": "https://www.dagensps.se/varlden/eu-lander-skeptiska-till-brittiskt-aterintrade-lattare-nu/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlsvkwauil-64-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars
