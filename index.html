 själva inte har en aning om vad de gör. Det är fake news i sin renaste form! Otroligt oärligt, en total katastrof för demokratin. Sad!", "stalin": "Dessa riksdagsledamöter är för svaga för att ens formulera sina egna dekret. De gömmer sig bakom algoritmer som fega byråkrater. Om en man inte kan skriva sin egen motion, hur ska han då kunna styra ett folk? Vi har upptäckt deras maskopi; de använder teknik för att dölja sin intellektuella tomhet. Vi kommer att arkivera dessa AI-robotar och rensa ut de odugliga."}, "date": "3 september, 07:59", "url": "https://www.realtid.se/samhalle/politiker-morkar-sin-anvandning-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/riksdagshuset-i-stockholm-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Åkesson om L: ”Inte beredd att ge besked”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson skjuter upp beskedet om Liberalernas öde inför valet trots att hans deadline har nått sitt slut. Med en färsk mätning på 3,3 procent, strax under hans tidigare 3,5-procentsgräns, vill han avvakta ytterligare opinionsmätningar innan han avgör om L-rösterna är bortkastade eller om de får stanna i Tidösamarbetet.", "trump": "Jimmie Åkesson, en fantastisk person, vägrar att rädda det svaga Liberalerna! De är på väg utför, totalt katastrofalt låga siffror, sorgligt! De klarar inte ens tre komma fem procent, sad! Jag sa till Jimmie: ”Vänta inte, gör dig av med dem!” Men han vill se fler mätningar. Mycket smart, men ganska svagt. Vinnare ber inte om ursäkt!", "stalin": "Kamrat Åkesson tvekar om det vacklande Liberalernas framtid. Deras ynkliga siffra på 3,3 procent är ett sabotage mot folkets enighet! Att förlänga tidsfristen visar på farlig byråkratisk svaghet. Om de inte når upp till tröskeln måste de rensas bort från det politiska maskineriet. Vi beordrar omedelbart fler mätningar för att säkerställa ideologisk renhet!"}, "date": "3 september, 11:38", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-l-inte-beredd-att-ge-besked/cG9zdDoxODI0NDM", "imageUrl": "https://images.kvartal.se/2026/08/6ca4d047-jimmie-akesson.webp"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "image-right", "heading": "”Det går inte att lära sig hemtjänsten mellan två besök”", "summaries": {"normal": "Undersköterskan Maria Liljeroth argumenterar för att vikarier inom hemtjänsten måste få en ordentlig introduktion, utbildning och praktik innan de arbetar självständigt. Bristande introduktion leder till osäkerhet kring rutiner, hygien och arbetsuppgifter, vilket skapar stress för både vikarier och ordinarie personal. Flera vikarier slutade under sommaren. God introduktion är nödvändig för att äldre ska känna trygghet och för att behålla personal.", "trump": "De gör ett totalt fiasko av äldreomsorgen i det här landet. Inga introduktioner, ingen utbildning, bara kaos och misslyckade vikarier som springer därifrån som råttor från ett sjunkande skepp. De radikala vänsteraktivisterna och deras kvotergalna identitetspolitik har förstört allt. Vi behöver de bästa människorna, inte dessa woke-kommunister som hatar kompetens. Jag fixade det bättre förra gången, tro mig.", "stalin": "Detta är vad som händer när de giriga hyenorna låter profitthungriga klassförrädare styra omsorgen om folket. Vikarier kastas ut som kanonmat utan utbildning, vilket leder till kaos och avhopp. Jag ser de dekadenta byråkraternas sabotage tydligt. Endast genom kollektivets järnhårda handledning och utrensning av odugliga element kan vi garantera trygghet för de arbetande massorna. Svaghet är förräderi."}, "date": "3 september, 14:15", "url": "https://arbetet.se/2026/09/03/det-gar-inte-att-lara-sig-hemtjansten-mellan-tva-besok", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03140657/debatt-lara-sig.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Så försöker USA bryta Kinas grepp om drönare och robotar", "summaries": {"normal": "USA inför nya tullar på drönare och robotar från Kina för att minska beroendet av utländsk teknik och stärka den egna industrin. Trots att Kina dominerar marknaden med billig massproduktion, hoppas Washington att åtgärderna ska främja inhemsk kapacitet och förbättra säkerheten i kritiska sektorer genom att premiera amerikanska system framför kinesiska alternativ.", "trump": "Kina försöker lura oss med billiga drönare och robotar, men jag säger nej! Vi sätter stopp för det nu. De dumpar priser medan vår industri står stilla – en total katastrof. Vi ska bygga våra egna maskiner, de största och bästa maskinerna världen någonsin skådat. America First, mina vänner. Vi gör USA till en robot-supermakt igen, tro mig!", "stalin": "De amerikanska imperialisterna darrar. De bygger murar av tullar mot de kinesiska maskinerna, men de glömmer att en stat utan egen produktion är en stat av sand. De desperata byråkraterna i Washington försöker nu tvinga fram en industri som de för länge sedan förlorat kontrollen över. Planekonomi är det enda sättet att vinna, men de vägrar förstå det. Sorgligt."}, "date": "2 september, 22:48", "url": "https://www.realtid.se/it-tech/sa-forsoker-usa-bryta-kinas-grepp-om-dronare-och-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/dronare-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Siffrorna från Novus får mig att vilja dunka huvudet i väggen", "summaries": {"normal": "I en ledare kommenterar Henrik Jalalian en Novus-mätning som visar att Tidöpartiernas försprång krymper till 2,6 procentenheter. Socialdemokraterna backar till 25,8 procent medan Liberalerna stiger. Han varnar oppositionen för överdriven segervisshet och jämför den med en maratonlöpare som firar för tidigt. Valet riskerar att bli jämnt igen.", "trump": "Folk, ni skulle se det här. Den där svenska oppositionen beter sig som en massa fega, korkade vänstervridna misslyckanden som redan delar ministerstolar som om de vunnit stort. Sen kommer en mätning och bam – plötsligt är det jämnt! De firade vid mållinjen som idioter och blev omsprungna. Patetiskt. Mitt folk i USA skrattar åt sånt här svagt ledarskap.", "stalin": "Kamrater, dessa dekadenta ministerhyenor inom oppositionen har redan börjat fördela makten som om segern vore given. Sedan kommer en mätning och avslöjar deras svaghet. Jag ler mörkt från historien. Segervissheten hos dessa folkförbrytare leder ofta till nederlag. Rensa ut illusionerna innan valnatten blir en bitter uträkning för de som underskattar motståndaren."}, "date": "2 september, 11:40", "url": "https://www.etc.se/ledare/siffrorna-fraan-novus-faar-mig-att-vilja-dunka-huvudet-i-vaeggen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260902090928_eef5f9b2fe3491ea219272b209bf353429d8ed34289907d7777b3fbd8d8429bf.png"}, {"type": "image-right", "heading": "Minister avgår – köpt ”oanvändbar” ammunition för 700 miljoner", "summaries": {"normal": "Estlands försvarsminister Hanno Pevkur avgår efter en misslyckad vapenaffär där landet betalade 70 miljoner euro för ammunition och artilleripjäser till Ukraina från ett indiskt nybörjarföretag. Ammunitionen var defekt och oanvändbar. Riksrevisionen kritiserar hanteringen och varnar för ökade risker med de stigande försvarsutgifterna.", "trump": "Titta på det här! Den här korkade estniske ministern Pevkur köper skräp-ammo från ett indiskt nollföretag för 70 miljoner euro som aldrig funkar. Totalt fiasko! De borde ha köpt från de bästa, från oss, men istället får de defekt skräp. Patetiskt. Jag skulle ha gjort affären hundra gånger bättre, tro mig.", "stalin": "Återigen avslöjar de dekadenta västerländska byråkraterna sin egen inkompetens. Denna estniske minister som inte ens läser kontrakten skickar miljoner till ett odugligt indiskt bolag medan Ukraina kämpar mot sina fiender. En sådan slöseri med folkets resurser förtjänar rensning. Kamrater, vakta era investeringar mot dessa sabotörer."}, "date": "3 september, 08:29", "url": "https://www.tv4.se/artikel/3Ph235yIBgV6doxv7VXAOs/minister-avgar-koepte-oanvaendbar-ammunition-foer-700-miljoner", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2krJVJ1dTkg65xE2THBDCb%2Fe4c9f22fcf2ac4fdbeba24d7fd413fff%2F03-estland-webb.jpg&width=120"}, {"type": "image-right", "heading": "“Jag kände att jag måste berätta deras historia”", "summaries": {"normal": "Maryam Ebrahimi har gjort dokumentären ”De levande döda i Rojava” om kvinnliga soldater som stred mot IS i Kobane. Fyra skadade kamrater skildras som en gemensam kropp som stödde varandra. Filmen belyser hur deras kamp inspirerade till feministiska protester under parollen ”Woman, Life, Freedom” i Iran och andra länder. Inspelningen var farlig på grund av turkiska drönattacker.", "trump": "De här så kallade kvinnokrigarna mot IS var modiga, det måste man erkänna, men nu gör de en film om hur de byggde ett jämlikt samhälle? Typiskt radikalvänsterflum från Mellanöstern. De feministiska revolutionerna leder bara till kaos. Vi behöver inga kvoterade amazoner, vi behöver starka ledare som vinner på riktigt. Biden skulle ha älskat det här woke-propagandan.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassfiender förvränger en kamp mot barbarer till en borgerlig feministisk saga. De levande döda i Rojava? En patetisk berättelse om individer som likviderar varandra för en illusion av frihet. Endast det kollektiva proletariatets järnhand kan besegra imperialismens hydra. Allt annat är farligt sentimentalism som måste rensas ut."}, "date": "3 september, 01:30", "url": "https://www.dagensarena.se/innehall/jag-kande-att-jag-maste-beratta-deras-historia", "imageUrl": "https://www.dagensarena.se/files/2026/09/maryam-ebrahimi-ny-300x157.jpeg"}, {"type": "image-right", "heading": "Marknadsskolan är byskolans död", "summaries": {"normal": "Svenska kommuner tvingas skära ned på skolor för att finansiera stigande skolpeng till friskolor. En rapport visar att vinstdrivande friskolor främst etablerar sig i tätorter, rekryterar maximalt med elever och använder färre lärare. Detta driver upp kommunernas kostnader per elev, särskilt på landsbygden, och hotar byskolorna. Centerpartiets stöd för vinster i välfärden ifrågasätts.", "trump": "De här galna svenska byråkraterna och deras vänstervridna friskolehyenor suger livet ur de små byskolorna. Fullproppade klasser i stan, obehöriga lärare och enorma vinster till de stora koncernerna medan de riktiga svenskarna på landsbygden får se sina skolor stängas. Det är en total katastrof, folk. Biden skulle älskat det här systemet. Vi gör det bättre.", "stalin": "Se hur de profitthungriga klassförrädarna i skolkoncernerna parasiterar på det enkla folkets barn. De fyller sina klassrum med kött, sparar på lärare och tvingar fram en ond cirkel som likviderar byskolorna. Centern, detta falska landsbygdsparti, skyddar giriga hyenor. Jag ler i graven åt sådan dekadens. Arbetarklassen ser sveket klart."}, "date": "3 september, 01:24", "url": "https://www.dagensarena.se/opinion/marknadsskolan-ar-byskolans-dod", "imageUrl": "https://www.dagensarena.se/files/2026/09/ond-cirkel.jpeg"}, {"type": "image-right", "heading": "Unga stjärnor köper bolag – för att bli vd direkt", "summaries": {"normal": "En växande trend bland unga MBA-utbildade i USA är att köpa existerande företag istället för att klättra i karriären eller starta nytt. 27-åriga Ania Aliev köpte ett medicinteknikbolag strax innan hon födde sitt barn och blev vd. Strategin kallas entrepreneurship by acquisition. Framgångar finns, men riskerna är höga som exemplet Scott Duncan visar, som slutade i konkurs.", "trump": "Folk, det här är helt fantastiskt. De här smarta unga människorna köper hela bolagen istället för att jobba sig upp som de vanliga förlorarna. Ania är en vinnare, hon fixar affärer medan hon föder barn – otroligt! Men den där stackars Duncan, totalt misslyckande, konkurs och allt. Precis som Biden-ekonomin. Vi behöver fler sådana här vinnare, inte losers som drunknar i översvämningar och kinesisk konkurrens. Make Business Great Again!", "stalin": "Kamrater, se hur den dekadenta amerikanska kapitalismen föder nya parasiter som köper sig till makt istället för att förtjäna den genom arbete. Denna Aliev föder barn och bolag samtidigt, medan den andre olycklige krossas under imperialismens motgångar. Jag ler i graven åt deras osäkerhet och paranoia. Inga fiender till folket undkommer historien – inte ens när de gömmer sig bakom search funds. Ren komedi för proletariatet."}, "date": "3 september, 14:18", "url": "https://www.dagensps.se/karriar/unga-stjarnor-koper-bolag-for-att-bli-vd-direkt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/follow.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "USA bombade iranskt bröllop – dödade kvinnor och barn", "summaries": {"normal": "En amerikansk robot träffade ett bostadshus i södra Iran där ett bröllop firades. Två kvinnor och två barn omkom medan minst 68 personer skadades. Iran kräver att FN fördömer attacken och håller USA ansvarigt för brott mot civila. Pentagon uppger att uppgifterna granskas men förnekar att civila medvetet attackeras.", "trump": "Hörni, det här är en total lögn från de iranska galningarna. Vi träffade aldrig något bröllop, det var militära mål. Fake news som vanligt. Biden lämnade en sådan röra efter sig att vi nu får städa upp. Iran och deras terrorvänner är patetiska förlorare som inte ens kan hålla isär ett bröllop och ett vapenlager. Vi gör det rätta, tro mig.", "stalin": "Återigen visar de imperialistiska giriga hyenorna sitt sanna ansikte genom att slakta oskyldiga vid ett bröllop. Jag betraktar detta med avsky från historiens sida. Sådana handlingar förtjänar ingen pardon utan snar snar utrensning av alla ansvariga lakejer. Vårt kollektiv minns alltid och glömmer aldrig fiendens blodtörst."}, "date": "3 september, 13:40", "url": "https://www.friatider.se/usa-bombade-iranskt-brollop-dodade-kvinnor-och-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-815.jpg?itok=zRlw0A8w"}, {"type": "image-right", "heading": "Tunnelbanetåg  fastnade i tunnel. Förseningar efter strömavbrott • 37 000 var utan el i Stockholm", "summaries": {"normal": "Ett omfattande strömavbrott drabbade Stockholms innerstad, Kungsholmen samt Lilla och Stora Essingen vid 11.30-tiden på torsdagen. Över 37 000 hushåll från Ellevio drabbades, och tunnelbanans blå linje stoppades tillfälligt. Felet orsakades av två samtidiga avbrott, men vid 11.59 var strömmen tillbaka och SL-trafiken rullar nu igen med vissa förseningar.", "trump": "Ett enormt och totalt inkompetent strömavbrott slog ut hela Stockholm! Över 37 000 hushåll lämnades i absolut mörker och tunnelbanan kollapsade fullständigt. Men jag fixade det – eller ja, de fick igång strömmen på en halvtimme, tack och lov. Helt otroligt att ett så avancerat land drabbas av så amatörmässig elbrist. Sorgligt!", "stalin": "Ett kriminellt sabotage av elnätet i Stockholm lamslog trettiosjua tusen hushåll och saboterade arbetarnas kollektiva transportmedel, tunnelbanan. Hur kunde detta system sammanfalla i totalt mörker? Ellevios byråkrater har uppenbarligen misslyckats med sin planering. De ansvariga för detta mörkläggningsfiasko kommer omedelbart att utredas för subversiv verksamhet mot staten!"}, "date": "3 september, 12:31", "url": "https://www.expressen.se/nyheter/sverige/stort-stromavbrott-i-stockholm-tusentals-drabbade", "imageUrl": "https://static.bonniernews.se/ba/e651c2ef-6b5e-4d36-8f07-bd6291fcdaff.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Carl Eos: Magdalena Andersson kraschar din privatekonomi", "summaries": {"normal": "Artikeln kritiserar Magdalena Andersson och vänsterpartierna för att de vill höja skatter, bensinpriser, matpriser och bolånekostnader. Den lyfter fram Tidö-regeringens och SD:s sänkningar av skatt på arbete, elskatt och matmoms som gett vanliga familjer cirka 5 000 kronor mer i månaden. En S-ledd regering riskerar enligt beräkningar att kosta en barnfamilj 4 400 kronor extra per månad.", "trump": "Lyssnar ni på den här katastrofen? Den socialistiska förloraren Magdalena Andersson och hennes vänstervriden klick vill krascha er privatekonomi totalt. De hatar att ni har mer pengar i plånboken efter att de riktiga ledarna sänkte skatterna. Nu vill de suga ut er med höjda priser och bolåneskatter. Patetiska! Vi gjorde det bättre, de gör det sämre. Amerika vet, Sverige borde också veta.", "stalin": "Jag ser hur dessa dekadenta klassförrädare under ledning av Andersson planerar att suga ut arbetarna igen med nya skatter och höjda priser. Deras så kallade rättvisa är bara en mask för att finansiera sin vanställda politik. Vi vet att sådana element alltid sviker folket. Det är dags att rensa ut dessa parasiterande opportunister innan de förvandlar varje familj till en bankomat för sitt misslyckade experiment. Kamrater, vakna!"}, "date": "3 september, 13:57", "url": "https://riks.se/opinion/carl-eos-magdalena-andersson-kraschar-din-privatekonomi", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_77_5d9d894186.jpg"}, {"type": "image-right", "heading": "V-politikern tog ut tio miljoner i vinster från välfärden – maken köpte Porsche", "summaries": {"normal": "En granskning visar att Vänsterpartiets kandidat i Trosa, Gerty Fexler Höjer, och hennes man har tagit ut tio miljoner kronor i vinster från sitt omsorgsbolag, trots partiets motstånd mot vinster i välfärden. Under flyktingkrisen gjorde bolaget stora vinster, vilket bland annat finansierade en Porsche. Partiledaren Nooshi Dadgostar uppger att hon inte kände till affärerna.", "trump": "Vilken total katastrof för de svenska radikalvänstern! Deras egen toppolitiker roffade åt sig tio miljoner från välfärden och köpte en fantastisk Porsche! Så typiskt. De predikar socialism för alla andra men kör lyxbilar själva. De kallar det välfärd, jag kallar det smart affärssinne! Nooshi visste ingenting? Fake news! Den här kvinnan är en vinnare, hon borde få leda hela landet!", "stalin": "Den så kallade Vänsterpartisten Gerty Fexler Höjer har ackumulerat tio miljoner av statliga medel och förvärvat en borgerlig sportbil under flyktingkrisens tider. Detta är sabotage mot kollektivet! Hon påstår att hon inte delar partiets linje. Sådana reaktionära element kan inte tolereras. Vi kommer att skicka kamraterna för en grundlig omutbildning i Trosa omedelbart!"}, "date": "3 september, 12:52", "url": "https://samnytt.se/v-politikern-tog-ut-tio-miljoner-i-vinster-fran-valfarden-maken-kopte-porsche", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03094837/v-politiker.png"}, {"type": "image-right", "heading": "Välfärden behöver fler lösningar – inte färre företag", "summaries": {"normal": "Artikeln argumenterar för att svensk välfärd behöver utnyttja privata aktörers kapacitet, kunskap och innovationskraft istället för att begränsa dem. Författarna pekar på långa vårdköer, personalbrist i äldreomsorgen och skolsegregation som problem som friskolor och privata vårdgivare kan hjälpa till att lösa. De kritiserar både Socialdemokraterna och regeringen för politik som hotar modellen.", "trump": "Den här svenska välfärdssoppan är en total katastrof, folk! De har köer som ingen tror på, gamla som dör i väntan på säng och skolor som bara funkar för de rika. De socialistiska förlorarna vill sparka ut de bästa företagen. Patetiskt! Låt de smarta killarna med pengar fixa det istället för att lyssna på de woke-kommunisterna som hatar framgång.", "stalin": "Kamrater, denna dekadenta vältalighet från profitthungriga parasiter avslöjar imperialismens kris. De vill behålla sina giriga hyenor inom välfärden medan arbetarklassen väntar på vård och utbildning. Jag ser genom deras lögner. Endast en sann kollektiv utrensning av dessa klassförrädare kan rädda folket från deras exploaterande maskineri. Inga kompromisser!"}, "date": "3 september, 12:59", "url": "https://www.di.se/debatt/valfarden-behover-fler-losningar-inte-farre-foretag", "imageUrl": "https://static.bonniernews.se/ba/8b8d4c92-1a5d-4d9d-985c-f05b7ced5506.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson dröjer med besked om L: ”Går i rätt riktning”", "summaries": {"normal": "När Jimmie Åkessons deadline för Liberalerna löper ut tio dagar före valet väljer SD-ledaren att inte ge något slutgiltigt besked. Efter att L klättrat till 3,3 procent i en Novusmätning menar Åkesson att utvecklingen går åt rätt håll. Han vill dock avvakta ytterligare mätningar innan han avgör om partiets rikschans är räddad.", "trump": "De falska nyheterna säger att jag har satt en deadline, men det är total fake news! Liberalerna kämpar, de fick tre komma tre procent, en vacker siffra, nästan lika bra som mina valsedlar. Men jag ger inga besked än, vi tittar på siffrorna. Mycket smart drag. Väldigt orättvist mot L, men vi vill ha segrar, bara stora segrar!", "stalin": "Kamrat Åkesson dröjer med sin dom över Liberalernas öde, trots att tidsfristen har löpt ut. Statens mätningar visar tre komma tre procent lojalitet, vilket noteras som en svag men tillräcklig puls. Vi avvaktar nästa rapport från kommissarierna innan vi avgör om de trots allt får marschera vidare mot riksspärren eller omfördelas till arbetslägret."}, "date": "3 september, 13:21", "url": "https://bulletin.nu/akesson-drojer-med-besked-om-l-gar-i-ratt-riktning", "imageUrl": "https://cdn.bulletin.nu/articles/ec9df7aa-947d-4e3b-b6f7-b72f24047076/preview.jpg?t=1788434442000"}, {"type": "image-right", "heading": "Jessica tvingas leva på bidrag – när sonen fick en swish­gåva sänktes ersättningen", "summaries": {"normal": "Jessica Axelsson lever på drygt 11 000 kronor i månaden i olika bidrag efter att ha blivit utförsäkrad. När hennes son fick en swishgåva drogs beloppet av från nästa utbetalning. Hon kritiserar bristande individanpassning i stödsystemet, ständiga handläggarbyten och svårigheter att få anpassade jobb trots fysiska begränsningar efter ett liv i tunga yrken.", "trump": "Titta på det här. Stackars Jessica kämpar med eländiga 11 000 kronor i bidrag medan de svenska byråkraterna har totalkoll på varje öre. En liten swish till sonen och pengarna ryker. Patetiskt! De woke-socialisterna och deras identitetspolitiska hyenor har byggt ett system som straffar vanliga människor. Vi behöver riktiga jobb, inte detta socialistiska mardrömssopkaos.", "stalin": "Kamrater, se hur de giriga hyenorna inom det borgerliga bidragsmaskineriet förtrycker en arbetande kvinna. En gåva till sonen utlöser omedelbar avdrag. Jag ler mörkt åt detta dekadenta system som likviderar människors värdighet med byråkratisk precision. Vi måste rensa ut alla parasiterande klassförrädare och skapa ett samhälle där den sanna arbetaren inte tvingas tigga."}, "date": "3 september, 11:25", "url": "https://arbetet.se/2026/09/03/jessica-tvingas-leva-pa-bidrag-nar-sonen-fick-en-swishgava-sanktes-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02155004/jessica-portrattnyny.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S-veteranens nazi-utspel mot SD: \"Nationalsocialistiskt?\"", "summaries": {"normal": "S-veteranen Jan Eliasson ifrågasatte på X om SD är nationalsocialistiskt efter att Jimmie Åkesson uppmanat borgerliga väljare att stödja Liberalerna utan att kalla SD borgerligt. SD beskriver sig sedan länge som socialkonservativt med nationalistisk grundsyn.", "trump": "Sverige har stora problem, riktiga förlorare! En gammal socialist, Jan Eliasson, som säkert är totalt radikal, gråter ut på internet om SD och 'nationalsocialister'. Ingen vet ens vilka de är, men jag säger er: de har ingen energi, inga starka gränser och definitivt ingen Trump-Tower-skyskrapa. Sorgligt!", "stalin": "Den så kallade S-veteranen Eliasson visar prov på skadlig förvirring i etern. Om partimedlemmen Åkesson inte kan placera sitt nationalistiska block i det borgerliga registret, måste Statsapparaten ingripa och omplacera dem till ett mer produktivt skogsarbete i Sibirien. Ideologisk disciplin är plikt!"}, "date": "3 september, 12:19", "url": "https://samnytt.se/s-veteranens-nazi-utspel-mot-sd-nationalsocialistiskt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03101657/artikelhuvudbild-1-436.jpg"}, {"type": "image-right", "heading": "Köpte oanvändbar ammunition till Ukraina – avgår", "summaries": {"normal": "Estland betalade cirka 780 miljoner kronor för ammunition till Ukraina som visade sig vara oanvändbar. Försvarsminister Hanno Pevkur avgår efter en kritisk rapport från riksrevisionen. Ammunitionen beställdes från ett italienskt bolag ägt av ett indiskt företag som aldrig tidigare tillverkat sådan. Leveransen försenades och var felaktig när den kom 2025.", "trump": "Titta på de här totalt inkompetenta estniska clownerna som köpte skräp-ammo för 780 miljoner till Ukraina. Värdelöst skräp från ett indiskt nollföretag! Pevkur springer sin väg som en ynkrygg. Så här blir det när woke-kvoter och globalistlakejer styr istället för riktiga ledare. Patetiskt, folk, helt patetiskt.", "stalin": "Jag betraktar med djup förakt hur dessa giriga profitthyenor i Estland slösade bort miljoner på oanvändbar ammunition till de ukrainska hindren mot vår ryska intressesfär. Pevkur flyr som en feg parasit när revisionen blottar sanningen. I ett sant kollektiv skulle sådana klassförrädare omedelbart genomgå en grundlig utrensning. Svaghet föder förräderi."}, "date": "3 september, 12:15", "url": "https://www.di.se/nyheter/kopte-oanvandbar-ammunition-till-ukraina-avgar", "imageUrl": "https://static.bonniernews.se/ba/254e19de-0801-4244-b34e-fd07648ff6bf.jpg?crop=7665%2C4312%2Cx0%2Cy985&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-right", "heading": "Henrik Vinge (SD) avfärdar återvandring – i Dagens ETC", "summaries": {"normal": "Henrik Vinge (SD) avfärdar i en intervju med Dagens ETC tanken på storskalig återvandring som orealistisk och kanske inte ens önskvärd. Han betonar att partiets politik handlar om frivillig återvandring för en liten grupp missanpassade. Vinge beskriver partiet som drabbat av ett varumärkesproblem och tar avstånd från Jomshofs uttalanden om muslimer.", "trump": "Folk, ni skulle se det här. Den där svenske kronprinsen Vinge från det där SD-partiet springer till en galen vänsterextrem tidning och sviker allt han borde stå för. Han älskar plötsligt muslimer som är svenskar och säger att återvandring är orealistiskt. Patetiskt! Precis som de woke-liberalerna och deras identitetspolitik. Svagt ledarskap, totalt misslyckande.", "stalin": "Kamrater, se hur den dekadente partifunktionären Vinge kryper för de giriga klassförrädarna i vänsterextrem press. Han förnekar återvandring och kallar det oönskat, samtidigt som han smeker muslimska element medhårs. Sådana svaga röster undergräver folkets enhet. Vi måste rensa ut alla opportunister som skadar rörelsens stålhårdhet innan de förgiftar hela strukturen."}, "date": "3 september, 12:04", "url": "https://www.friatider.se/henrik-vinge-sd-avfardar-atervandring-i-dagens-etc", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-818.jpg"}, {"type": "image-right", "heading": "Varningen till utsatta kvinnor: Kan avslöjas", "summaries": {"normal": "Sveriges nya varningssystem Se-alert testas i Stockholm och Gotland på måndag. Systemet skickar en högljudd notis till alla smartphones i ett område vid en eventuell krissituation. Riksorganisationen för kvinno- och tjejjourer, Roks, varnar nu för att testet kan avslöja gömda telefoner hos våldsutsatta kvinnor och uppmanar dem att stänga av sina telefoner.", "trump": "Sverige kör ett totalt katastrofalt larmtest som kan röja utsatta kvinnor med gömda telefoner! Jag säger er, våra system är så mycket bättre, smartare och perfekt skötta. Nu varnar kvinnojourerna för att det här galna hittepå-larmet sätter liv på spel. Om jag hade styrt Sverige hade de haft ordning på grejerna i stället för det här kaoset!", "stalin": "Vi noterar att det svenska statliga larmet oavsiktligt avslöjar gömda kommunikationsmedel hos illojala element i samhället. En sund stat kräver absolut kontroll över alla apparater och medborgare. För att skydda ordningen bör avvikande individer som undanhåller sina telefoner stängas av omedelbart. Partiets vaksamhet överförs nu till det digitala rummet för folkets högsta säkerhet."}, "date": "3 september, 10:41", "url": "https://www.expressen.se/nyheter/sverige/varningen-till-utsatta-kvinnor-kan-avslojas", "imageUrl": "https://static.bonniernews.se/ba/be59f240-466f-4703-a6f6-13f142958f02.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Socialdemokraternas nya fiasko: Rasar i mätning", "summaries": {"normal": "Socialdemokraterna tappar kraftigt i Demoskops nya mätning och landar på 27,2 procent, partiets sämsta resultat sedan november 2023. Väljare flyr till andra oppositionspartier som Centerpartiet och Vänsterpartiet. Samtidigt minskar försprånget för de rödgröna till Tidöpartierna till endast 3,3 procentenheter inför det kommande valet.", "trump": "Magdalena Andersson kollapsar totalt, vilket alla visste skulle hända! Socialdemokraterna rasar till usla 27,2 procent – en katastrof, faktiskt ett av de sämsta resultaten någonsin. Väljarna flyr till de andra radikala vänsterpartierna. Men gissa vad? Tidöpartierna andas dem i nacken! Otroligt. Snart är de helt borta. Total oreda!", "stalin": "Socialdemokraternas katastrofala fall till 27,2 procent bevisar partiets ideologiska svaghet och brist på disciplin. När massorna överger dem för svagare fraktioner som Centerpartiet blottläggs statsapparatens bräcklighet. Endast genom järnhård kontroll och eliminering av politiska avvikelser kan ordning upprätthållas. Vi noterar detta misslyckande med största misstänksamhet."}, "date": "3 september, 11:35", "url": "https://samnytt.se/socialdemokraterna-rasar-i-ny-matning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03092249/artikelhuvudbild-1-434.jpg"}, {"type": "image-right", "heading": "Ryanair tecknar kollektivavtal Transport: ”Det här är ett historiskt besked.”", "summaries": {"normal": "Ryanair har tecknat kollektivavtal med fackförbundet Transport för sin kabinpersonal vid basen på Arlanda. Avtalet gäller retroaktivt från den 1 september och reglerar löner, arbetstider, ersättningar, pension och försäkringar. Både fackets ordförande Tommy Wreeth och Ryanairs personalchef Darrell Hughes välkomnar uppgörelsen. Ryanair har tidigare haft konflikter med personalen i Sverige.", "trump": "Ingen trodde att det skulle hända, men den stora europeiska flygbluffen Ryanair har äntligen vinkat åt de svenska fackhyenorna. Historiskt säger de, va? Det här är vad som händer när man har en riktig ledare som jag i Vita huset – till och med de giriga flygbolagen böjer sig. Fantastiskt för de svenska arbetarna, de förtjänar det efter Biden-åren.", "stalin": "Kamrater, se hur de parasiterande kapitalisterna till slut tvingas erkänna arbetarkollektivets makt. Ryanair har kapitulerat och undertecknat avtalet. Detta är en seger för den svenska modellen, men vi vet att de giriga hyenorna bara väntar på nästa chans att exploatera. Ingen klassfiende ska slippa undan. Ut med de dekadenta profitthungriga lakejerna."}, "date": "3 september, 10:14", "url": "https://arbetet.se/2026/09/03/ryanair-tecknar-kollektivavtal-facket-historiskt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03101021/ryanair.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ryanair-plan fick gasa och lyfta igen – bara 100 meter från marken", "summaries": {"normal": "Ett Ryanair-plan tvingades avbryta landningen i Nîmes i Frankrike efter att ett annat flygplan stod på banan. Piloten genomförde en go-around bara 100 meter från marken. Passagerarna upplevde oro men ingen skadades. Händelsen utreds eventuellt inte av franska myndigheter. Avbrutna landningar är vanliga inom kommersiell flygning och ger normalt ingen ersättning.", "trump": "Folk, det här är en total katastrof! Ryanairs pilot gör en fantastisk go-around, en riktig bragd, bara 100 meter från marken i Frankrike. Den inkompetenta flygtrafikledningen, typiska europeiska byråkrater, varnar för sent. Passagerarna var livrädda. Biden skulle ha låtit planet krascha. Men mina piloter, de bästa, fixar det alltid. Amerika först!", "stalin": "Jag ser hur den dekadenta västerländska luftfarten sviker folket igen. En sen varning från de odugliga trafikledarna, dessa kapitalistiska sabotörer, tvingar piloten till en heroisk manöver. Passagerarna darrar av fruktan. Om detta inte utreds är det ett tydligt tecken på att reaktionära krafter inom byråkratin skyddar sina egna. Fienden sover aldrig."}, "date": "3 september, 12:00", "url": "https://www.dagensps.se/varlden/ryanair-plan-fick-gasa-och-lyfta-igen-bara-100-meter-fran-marken", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/nyryanair.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Åkesson backar – med tio dagar kvar till valet", "summaries": {"normal": "Liberalerna når inte upp till Jimmie Åkessons uppsatta 3,5-procentsmål utan stannar på 2,8 procent i Aftonbladet/Demoskop. Trots det backar Åkesson från sin tidigare deadline och avvaktar fler mätningar på grund av en positiv trend. Samtidigt tappar Socialdemokraterna till 27 procent, vilket Åkesson menar beror på brist på egen politik och negativa kampanjer.", "trump": "Liberalerna är totalt låga, väldigt svaga siffror, sorgligt! Men Jimmie är smart, han väntar lite, tittar på fejk-mätningarna. Och Socialdemokraterna? En katastrof, de har ingenting, bara dåliga kampanjer och smutskastning mot mig och de andra. De vill inte ens prata politik. Helt galet! Tidösidan kommer att vinna stort, tro mig!", "stalin": "Avvikelserna från det ideologiska målet kan tolereras tillfälligt om kurvan visar uppåt, men partiet står under ständig övervakning. De socialdemokratiska elementen vacklar på grund av ideologisk tomhet och skadliga agitationer; dylik kontraproduktiv propaganda tolereras icke i en sund stat. Byråkratin fortsätter granskningen av de illojala krafterna tills fullständig ordning upprättats."}, "date": "3 september, 13:12", "url": "https://www.aftonbladet.se/nyheter/a/OkPWkE/jimmie-akesson-backar-efter-nya-l-resultatet-inte-lage", "imageUrl": "https://akamai.vgc.no/v2/images/7c64a66a-4b22-3a2b-baa1-3b011830fc74?fit=crop&format=auto&w=720&s=135071114500d00be5d8bd7c0c1baa9261c2f1f9"}, {"type": "image-right", "heading": "Tre av tio våldtäktsdömda i Danmark är icke-västliga invandrare", "summaries": {"normal": "En dansk promemoria visar att tre av tio som dömdes för våldtäkt i Danmark förra året var invandrare från icke-västliga länder eller deras barn. De utgjorde 30 procent av de 124 dömda trots att de bara är elva procent av befolkningen. Invandrarna är även överrepresenterade i andra våldsbrott. Sociala och kulturella faktorer anges som förklaring.", "trump": "Titta på det här, folk. Tre av tio våldtäktshjältar i Danmark är icke-västliga invandrare som suger musten ur systemet. Elva procent av befolkningen, trettio procent av brotten! De woke galningarna och deras identitetspolitiska vansinne har förstört Europa. Vi behöver starka gränser, inga fler galna kvoter. Amerika ser på och ler – vi gör det rätt.", "stalin": "Kamrater, jag betraktar med förakt hur dessa giriga klassförrädare i Danmark tillåter främmande element att sprida våld och förfall. Tre av tio våldtäktsdömda är icke-västliga parasiter som hotar folkets enhet. Vi måste rensa ut dekadensen med järnhand. Sociala faktorer? Nej, det är svaghet inför fienden. Paranoia skyddar revolutionen – likvidera hoten innan de äter upp staten."}, "date": "3 september, 12:34", "url": "https://riks.se/nyheter/en-tredjedel-av-valdtakterna-i-danmark-begas-av-invandrare", "imageUrl": "https://admin.riks.se/uploads/medium_danmark_valdtakter_invandrare_hero_fab4a70bd0.jpg"}, {"type": "image-full", "heading": "Ryssland sköt upp 16 satelliter: Ingen nådde sitt mål", "summaries": {"normal": "Ryssland sköt upp 16 satelliter i sitt Starlink-alternativ Rassvet-3 den 19 juli, men ingen nådde den planerade omloppsbanan på 800 kilometers höjd. Satelliterna befinner sig nu på cirka 300–400 kilometer, där luftmotståndet snabbt kommer att dra ner dem. Projektet utgör ett stort bakslag för Kremls ambitiösa planer.", "trump": "Folk, det här är ett totalt katastrof-fiasko. Rysslands så kallade Starlink-konkurrent? 16 satelliter upp – och de hamnar på halv höjd som billiga kinesiska drönare. Patetiskt! Under mig skulle vi ha gjort det perfekt, men efter Sleepy Joe och nu det här… ryssarna ser ut som fullständiga losers. Sad!", "stalin": "Kamrater, detta är ett ynkligt bevis på bristande disciplin och sabotage inom den ryska rymdindustrin. Satelliterna sjunker som förrädiska element mot jorden medan västliga imperialister och ukrainska hinder skrattar. Jag ser svaghet och brist på revolutionär vaksamhet. Fler fiender måste oskadliggöras innan imperiet kan segra."}, "date": "3 september, 11:54", "url": "https://www.dagensps.se/varlden/ryssland-skot-upp-16-satelliter-ingen-nadde-sitt-mal", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdl1ajlqdo-ro4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Andersson: ”Svårt att se” V i regering", "summaries": {"normal": "Socialdemokraterna tappar fyra procentenheter i en ny mätning, mycket till Centerpartiet. Partiledaren Magdalena Andersson har svårt att se att Vänsterpartiet kan bli regeringsklart till valet på grund av allvarliga och systematiska problem inom partiet. Vänsterpartiet å sin sida kräver att få ingå i en regering för att släppa fram den.", "trump": "Magdalena Andersson kollapsar i mätningarna, absolut total katastrof! Väljarna flyr till Centerpartiet för att de inser hur svagt det är med kommunister i regeringen. Hon säger att Vänsterpartiet har en ’rejäl resa’ att göra – tro mig, jag vet resor, men den här resan slutar rakt ner i diket! Sjukt, svagt och fullständigt oacceptabelt. Sad!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna och deras desperata försök att exkludera Vänsterpartiet visar på bristande ideologisk disciplin. Om dessa så kallade kamrater inte ens klarar en enkel ministerresa på elva dagar, måste vi fråga oss: vilka fiender till staten styr egentligen deras planering? Avvikelse från linjen tolereras ej."}, "date": "2 september, 19:50", "url": "https://kvartal.se/nyheter/artiklar/andersson-begransad-entusiasm-for-v/cG9zdDoxODE5NjY", "imageUrl": "https://images.kvartal.se/2026/09/90e52a2a-maandersson.webp"}, {"type": "image-right", "heading": "Hade sex med 13-årig flicka – frias eftersom hon såg \"betydligt äldre ut\"", "summaries": {"normal": "En 24-årig man i Dalarna frias från åtal om våldtäkt mot barn. Tingsrätten anser att den 13-åriga flickan såg betydligt äldre ut och att han inte hade anledning att tro att hon var under 15 år. Rådmannen ville döma honom men blev nedröstad av nämndemännen. Domen har överklagats till hovrätten.", "trump": "De här galna svenska domarna är en total katastrof, folk. En kille umgås med A-traktorungar och plötsligt är det okej att ha sex med en 13-åring bara för att hon ser ut som en vuxen? Patetiska vänstergalningar och woke-domare förstör allt. Vi behöver lag och ordning, inte den här sjuka identitetspolitiken. Amerika har tur att jag fixar det.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga rättsapparaten skyddar sina egna. En vuxen man utnyttjar ett barn och slipper straff för att hon såg äldre ut. Jag säger att sådana folkförtryckande hyenor måste rensas ut. Detta är vad som händer när arbetarklassen inte håller järnhanden om domstolarna. Revolutionen kräver ansvar."}, "date": "3 september, 11:59", "url": "https://riks.se/nyheter/hade-sex-med-13-arig-flicka-frias-eftersom-hon-sag-betydligt-aldre-ut", "imageUrl": "https://admin.riks.se/uploads/medium_falu_tr_hero_806e672077.jpg"}, {"type": "image-right", "heading": "Johanna går sjuk till jobbet – hennes chef får jobba hemifrån", "summaries": {"normal": "Undersköterskan Johanna Jernström gick ofta sjuk till jobbet som ensamstående på grund av karensavdraget som drog in runt 1 150 kronor. Hon fick hjälp av sin mor och äter ur frysen. Nu lever hon med två inkomster men ser hur kollegor går till jobbet sjuka medan chefer kan arbeta hemifrån via Teams. Partierna har olika åsikter om karensens framtid inför valet.", "trump": "Folk som Johanna i den svenska sjukvården går till jobbet halvdöda med nässprej och tabletter medan de woke-cheferna sitter hemma i pyjamas och spelar Teams-möten. Det är en total skam! Karensen är en bluff från de giriga EU-byråkraterna och de svenska socialisterna. Vi behöver riktiga ledare som sätter stopp för detta vansinne. America First, och Sverige borde följa efter!", "stalin": "Kamrater, se hur de parasiterande klassförrädarna i den borgerliga omsorgen tvingar arbetets hjältar att släpa sig till jobbet med feber medan de dekadenta byråkraterna gömmer sig bakom skärmar. Jag ler mörkt från historien åt denna kapitalistiska fars. Karensavdraget är ett vapen för exploaterande folkförtryckare. Vi måste rensa ut dessa fiender innan de svälter ut hela kollektivet."}, "date": "3 september, 09:06", "url": "https://arbetet.se/2026/09/03/johanna-gar-sjuk-till-jobbet-nar-chefen-kan-jobba-hemifran-nu-vill-hon-fa-bort-karensavdraget", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03084855/leksand-ka-pcohen-260826-51.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kängan till V – dagar före valet: ”Jag har svårt att se det”", "summaries": {"normal": "Magdalena Andersson vill inte ge besked om en eventuell S-ledd regerings sammansättning. Hon utesluter tydligt ministerposter för Vänsterpartiet och anser att partiet har en lång resa kvar på grund av allvarliga och systematiska problem. Valet handlar enligt henne om Sveriges riktning snarare än partiers röda linjer.", "trump": "Den här Andersson-kvinnan, en riktig socialistisk förlorare, vägrar säga att hon tänker släppa in de galna vänsterextremisterna i regeringen. Smart drag! Hon vet att de är en katastrof. Sverige behöver ingen vänsterkaos, det behöver en stark ledare som samlar landet – inte 12 eller 14 sverigedemokratiska ministrar heller, förresten. Patetiskt!", "stalin": "Jag ser en typisk socialdemokratisk opportunist som försöker undvika att erkänna sina allianser med farliga element. Vänsterpartiet utgör ett systematiskt hot som måste rensas ut innan de får makt. Tiden rinner ut och deras resa mot renhet är dömd att misslyckas. Inga kompromisser med fiender till folkets enhet. Renhet eller döden!"}, "date": "2 september, 22:33", "url": "https://www.tv4.se/artikel/2LubKky5fRGSa4hEfsGUSk/kaengan-till-v-dagar-foere-valet-jag-har-svart-att-se-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4mNk0D19jVrGYZKxkxIKUb%2Fd1b335070409208500a0b67a33f15eab%2F02-magda-valutfragning-v.png&width=1024"}, {"type": "image-full", "heading": "Regeringen: Nu begraver vi elefantkyrkogården", "summaries": {"normal": "Regeringen vill avskaffa den så kallade elefantkyrkogården där avsatta myndighetschefer placeras med full lön resten av förordnandet. Systemet, som i dag omfattar åtta personer till en årlig kostnad av omkring 13 miljoner kronor, ska utredas för att ersättas med avgångsvederlag. En utredning har tillsatts med slutdatum den 5 april 2027.", "trump": "Sverige gör äntligen något smart och stänger sin galna elefantkyrkogård! Att betala miljoner till sparkade byråkrater som bara sitter av tiden med full lön är totalt horribelt. Jag har sagt det förr, slöseriet med skattepengar måste få ett stopp. Nu tillsätter de en utredning, och det är på tiden att de kastar ut de här fuskarna en gång för alla!", "stalin": "Dessa odugliga byråkrater har länge levt i lyx på statens bekostnad medan deras kontrakt löper ut i total müssa. Att skicka dem till korridorerna med full lön utan att utföra produktivt arbete är ett sabotage mot kollektivet. Vår utredning ska rensa ut detta parasiterande slödder och ersätta deras fallskärmar med disciplinära åtgärder som passar kontrarevolutionärer."}, "date": "3 september, 13:07", "url": "https://www.gp.se/nyheter/sverige/regeringen-nu-begraver-vi-elefantkyrkogarden.337ce0a4-c42f-53d2-9e41-6edafe6d6bb3", "imageUrl": "https://www.gp.se/images/article/337ce0a4-c42f-53d2-9e41-6edafe6d6bb3/images/1Be2rXKdi43O-CbfaHtP6QCELH3I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stockholm slocknade – 37 000 stod utan el", "summaries": {"normal": "Ett omfattande strömavbrott drabbade centrala Stockholm och slog ut elen för över 37 000 kunder, främst på Kungsholmen, Essingeöarna samt delar av Vasastan och Norrmalm. Butiker tvingades stängas tillfälligt och SL-trafiken på blå linjen stod stilla i tjugo minuter. Efter cirka en timme var strömmen tillbaka för nästan alla.", "trump": "Ett enormt strömavbrott i Stockholm drabbade över 37 000 personer. Ren katastrof, helt otroligt dåligt skött! Butiker stängdes och tunnelbanan stod stilla. Men jag ordnade det här – elen kom tillbaka på en timme, nästan omedelbart! Ingen annan kunde ha fixat det så snabbt. Stockholm behöver bättre el, tro mig. Totalt kaos, men nu är allt underbar kontroll igen!", "stalin": "Ett skamligt elavbrott på 37 000 kunder i Stockholm visar på kapitalismens totala förfall. Butiker stängdes och tåg stod stilla i mörka tunnlar likt subversiva element. Lyckligtvis återställdes ordningen snabbt av den centrala makten. De ansvariga för detta tekniska sabotage borde omedelbart granskas av staten, för i en sund stat släcks inte ljuset utan tillstånd från partiets högsta ledning!"}, "date": "3 september, 12:24", "url": "https://www.aftonbladet.se/nyheter/a/K81Wdy/stort-stromavbrott-i-stockholm", "imageUrl": "https://akamai.vgc.no/v2/images/07ba9c4a-27e4-3ee3-b93b-7be191b04099?fit=crop&format=auto&w=720&s=803e73e7d640274879f341146bb075e303997660"}, {"type": "image-full", "heading": "Trött på laddsladd? Här är cykeln med solpanel i hjulen", "summaries": {"normal": "En kinesisk tillverkare har utvecklat elcyklar med solpaneler inbyggda i hjulen. Modellen Go5 ger upp till 27 extra kilometers räckvidd under test. Systemet använder flexibla back-contact-solceller och en roterande kontakt för att undvika laddsladdar. Trots lovande teknik är cykeln ännu inte kommersiellt tillgänglig utan finansieras via crowdfunding.", "trump": "Folk, ni skulle se det här! Kineserna bygger solpaneler rakt in i cykelhjul och lurar ut mil efter mil extra räckvidd. Under tiden drunknar Sverige i 18 kilometer sladd varje år – en total katastrof, en riktig Biden-sladdmardröm. Mina solpaneler skulle vara bättre, tro mig, de bästa. Men bra försök, kineserna, bra försök.", "stalin": "Kamrater, se hur de dekadenta kapitalisterna snärjs i egna sladdar medan jag ler från evigheten. Nu vänder de sig till solceller i hjul för att rädda sin usla räckvidd. Patetiskt. Ändå beundrar jag deras paranoia inför framtiden. Varje extra kilometer är en seger mot folkets fiender – de eviga laddsladdarnas lakejer. Sov inte, fiender vakar!"}, "date": "3 september, 10:58", "url": "https://www.dagensps.se/teknik/trott-pa-laddsladd-har-ar-cykeln-med-solpanel-i-hjulen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/phosgo-solcykel.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Att stödrösta är en borgerlig dygd. L ter sig som ett allt starkare kort i valet", "summaries": {"normal": "I en krönika argumenterar PM Nilsson för att borgerliga väljare bör stödrösta på Liberalerna i valet 2026 för att säkra en högerregering. Han beskriver borgerliga väljares rörlighet som flygsand som omformar landskapet. Artikeln lyfter näringslivets oro för vänsterns politik, avsaknad av trovärdiga vänsteralternativ samt Tidö-regeringens stabila insatser inom säkerhet och ekonomi.", "trump": "Lyssnar ni på de där patetiska svenska högerkillarna som springer runt som vilsna höns och ber folk rösta på Liberalerna? Patetiskt. De borde istället rösta på riktiga vinnare, inte på dessa svaga globalister som älskar identitetspolitik och kvotering. Jag byggde den starkaste ekonomin i världen, de borde lära sig av mig istället för att leka med sin flygsand och sina misslyckade koalitioner.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom den borgerliga flygsanden desperat försöker hålla samman sin ruttnande Tidö-allians mot det arbetande folkets vilja. Deras nervösa Tidö-ledare ropar efter stöd från de profitthungriga parasiterna i näringslivet medan de fruktar att deras imperialistiska projekt ska kollapsa. En sådan regim förtjänar snar utrensning ur historien."}, "date": "3 september, 10:28", "url": "https://www.di.se/ledare/att-stodrosta-ar-en-borgerlig-dygd", "imageUrl": "https://static.bonniernews.se/ba/cf5fe933-7422-4439-abed-2dada21491c3.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Polisstudent från Turkiet mördade kurdisk kvinna – knivhöggs av hennes son", "summaries": {"normal": "En turkisk polisstudent mördade 2005 en kurdisk kvinna som han hade en relation med. Han dömdes till livstids fängelse men frigavs villkorligt 2019. Kvinnans son hämnades då med en macheteattack. Sonen har nu dömts till sju års fängelse för mordförsök. Domen fastställdes nyligen av Svea hovrätt.", "trump": "Folk, det här är ett totalt kaos. Den där turkiske polisstudenten mördar en kurdiska, får livstid och Biden släpper ut honom efter bara tretton år. Sen kommer sonen med en machete och försöker fixa blodshämnd. Sju år nu. Patetiskt! Våra woke-domstolar och mångkulturhyenor skapar bara mer våld. Vi behöver lag och ordning, inte den här cirkusen.", "stalin": "Kamrater, se hur den borgerliga dekadensen föder blodshämnd och hedersmord. Jag betraktar med avsky hur dessa giriga klassförrädare importerar feodala sedvänjor som förgiftar samhället. Den kurdiske sonens machete var en förutsägbar följd av systemets svaghet. Vi skulle ha rensat ut sådana element redan i början. Revolutionen kräver järnhand mot alla parasiterande element."}, "date": "3 september, 11:37", "url": "https://riks.se/nyheter/turk-pa-migrationsverket-mordade-kurdisk-kvinna-sedan-knivhoggs-han-av-hennes-son", "imageUrl": "https://admin.riks.se/uploads/medium_mordforsok_turkar_hero_da28554e96.jpg"}, {"type": "image-right", "heading": "Andersson: ”Följer reglerna precis som de är avsedda att följas”", "summaries": {"normal": "Magdalena Andersson försvarar sin makes användning av 3:12-regler för aktieutdelning och avfärdar Ulf Kristerssons hycklerianklagelser. Hon betonar att han följer skattereglerna som de är avsedda och att han betalar full skatt på sin lön från Handelshögskolan. Andersson kommenterar även äldre skandaler kring städning och lotteriförsäljning.", "trump": "Den här röda hycklerskan Andersson och hennes make fuskar med skatten som riktiga losers, precis som de svenska socialisterna alltid gör. De predikar höga skatter för folket men själva använder alla kryphål de kan hitta. Patetiskt! Jag sänkte skatter på riktigt, inte som dessa fuskande nollor som röstar för reglerna och sen gnäller när någon annan använder dem.", "stalin": "Jag ser hur dessa borgerliga element och socialdemokratiska revisionister anklagar varandra för att utnyttja kapitalistiska skatteregler de själva skapat. Det är en fars som väcker skratt i graven. Arbetarklassen betalar alltid, medan de småborgerliga parasiterna gömmer sig bakom 3:12-bolag och fejkad moral. Ren dekadens. Kamrater, sådana fiender till folket avslöjar sig själva."}, "date": "2 september, 21:23", "url": "https://www.tv4.se/artikel/QHP1aJwRHVqDkuvntWcx5/andersson-foeljer-reglerna-precis-som-de-aer-avsedda-att-foeljas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KD236PkiJ0Zdx4eZmGkS6%2Ff85195d44ebcf93bef572d58cc626e94%2F02-magda-valutfragning-vidvinkel.png&width=120"}, {"type": "image-full", "heading": "Demoskop: Nytt stor-tapp för S", "summaries": {"normal": "Socialdemokraterna tappar kraftigt i Aftonbladet/Demoskops nya mätning och faller från 30,4 till 27,2 procent, vilket är partiets lägsta nivå sedan november 2023. Tappet sprider nervositet inför valet då väljare läcker till rödgröna småpartier på grund av otydlighet i regeringsfrågan. Samtidigt knappar Tidöpartierna in och skillnaden mellan blocken krymper till 3,3 procentenheter.", "trump": "Very sad! Socialdemokraterna faller pladask till 27,2 procent i en ny mätning – ett katastrofalt ras som visar att svenskarna har fått nog av fake news och svaga ledare. Totalt misslyckande! Blocken drar ihop sig till ynka 3,3 procent, vilket betyder att min kompis Jimmie och Tidöpartierna vinner snart. Total vinst för oss!", "stalin": "Det socialdemokratiska partiet har genom sin ideologiska vacklan fallit till 27,2 procent, vilket bevisar att elementen saknar den järnhårda disciplin som krävs. Statsapparaten noterar dock med tillfredsställelse att avståndet mellan blocken krymper till 3,3 procentenheter. Avvikelser från den korrekta linjen kommer att beivras, och vi uppmanar till skärpt ideologisk vaksamhet inför den slutgiltiga uppgörelsen."}, "date": "3 september, 11:05", "url": "https://bulletin.nu/demoskop-nytt-stor-tapp-for-s", "imageUrl": "https://cdn.bulletin.nu/articles/62fb741b-481a-4402-8893-503790c1804a/preview.jpg?t=1788426299000"}, {"type": "image-right", "heading": "Mitsubishi med i racet igen – Pajero återuppstår som dieselturbo", "summaries": {"normal": "Mitsubishi har återlanserat Pajero efter fem års frånvaro. Den nya generationen är en robust sjusitsig SUV med stegram, lågväxel, fyrhjulsdrift och 2,4-liters dieselmotor. Bilen har starka terrängegenskaper och modern utrustning. Lansering sker först i Asien och Australien, medan en europeisk lansering är osäker på grund av utsläppskrav.", "trump": "Lysande! Mitsubishi har äntligen vaknat och byggt en riktig best, inte någon av dessa patetiska el-crossover-vänsterbilar som Biden älskade. Pajero är tillbaka med stålchassi, lågväxel och muskler. De andra tillverkarna gråter nu. Fantastiskt jobb, Japan. Amerika älskar vinnare, inte förlorare i höga skor.", "stalin": "Kamrater, se hur den imperialistiska bilindustrin äntligen inser att mjukhet är svaghet. Jag betraktar med tillfredsställelse denna stålramade best som krossar dekadenta crossover-förbannelser. Den nya Pajero visar att bara rå styrka och lågväxel överlever i terrängen. De som väljer mjukhet ska rensas ut. Utmärkt."}, "date": "3 september, 10:40", "url": "https://www.dagensps.se/motor/mitsubishi-med-i-racet-igen-pajero-ateruppstar-som-dieselturbo", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/mitsubishi-pajero.png?width=256&quality=75"}, {"type": "image-right", "heading": "Företagens viktigaste försvarsinsats", "summaries": {"normal": "Hans Stråberg uppmanar företag att kompensera anställda som kallas in till repetitionsövning i försvaret, så att de inte går miste om lön och pension. Skanska, SKF och Atlas Copco har redan anslutit sig. Initiativet syftar till att stärka försvaret mot ett aggressivt Ryssland genom att underlätta för värnpliktiga och reservofficerare att delta utan ekonomisk förlust.", "trump": "Folk, vi har de bästa företagen, verkligen fantastiska, som nu betalar soldaterna när de tränar för att försvara landet. Utan ett starkt försvar fungerar inte affärerna om de galna krigarna kommer. Det är inget välgörenhetsskit, det är smart business. De woke-kvoterna och identitetsflumma som vill styra allt borde skämmas. Amerika först, Sverige borde göra likadant.", "stalin": "Kamrater, dessa giriga profitthyenor i styrelserummen börjar äntligen inse att ett svagt försvar öppnar portarna för fienden. Jag ler ironiskt från historien när de nu tvingas betala sina reservsoldater för att inte gå under. Låt dem rensa ut den dekadenta svagheten i leden. Endast ett folk i total beredskap kan motstå de kommande angreppen från västliga parasitkrafter."}, "date": "3 september, 10:17", "url": "https://www.di.se/ledare/foretagens-viktigaste-forsvarsinsats", "imageUrl": "https://static.bonniernews.se/ba/17640792-a9ec-4823-bcf6-61496e4bada2.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Finansiera infrastrukturskulden med svenskt kapital", "summaries": {"normal": "Svenska institutionella kapitalägare förvaltar över 11 000 miljarder kronor. Artikelförfattarna argumenterar för att detta kapital i stället för att exporteras via globala förvaltare bör användas till att finansiera Sveriges eftersatta infrastruktur på svenska villkor. De föreslår en gemensam investeringsplattform, statlig samordning och modernisering av va-sektorns finansiering för att bygga kompetens och minska beroendet av utländska aktörer.", "trump": "Lysande! De svenska pensionspengarna, elva tusen miljarder, skickas iväg till de globala bluffmakarna som suger avgifter och skickar tillbaka smulor. Patetiskt! Vi behöver en jätteplattform, byggd av riktiga svenskar, inte dessa woke-vänliga internationella parasiter. Amerika först – och Sverige borde göra exakt samma sak. Fantastiskt förslag, det är vad jag alltid sagt.", "stalin": "Kamrater, dessa profitthungriga spekulationshyenor har låtit det svenska folkets sparpengar rinna ut till främmande makter medan broar och järnvägar förfaller. Jag ser hur de dekadenta klassförrädarna gömmer sig bakom globala fonder. Vi måste rensa ut detta sabotage och återupprätta statens järnhand som samordnare. Inga halvmesyrer! Endast folkets kollektiva vilja skall styra kapitalet mot socialismens seger."}, "date": "3 september, 10:15", "url": "https://www.di.se/debatt/finansiera-infrastrukturskulden-med-svenskt-kapital", "imageUrl": "https://static.bonniernews.se/ba/3d450d52-edae-4263-bcb5-92c74f217f75.png?crop=1020%2C510%2Cx0%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Spanien: Jättelika demonstrationer mot invandrarkaoset", "summaries": {"normal": "Hundratusentals spanjorer demonstrerade i flera städer mot regeringens hantering av invandringskrisen i Ceuta. Manifestationerna samlade tiotusentals i Madrid, Valencia och Ceuta. Demonstranterna krävde skärpt gränsbevakning, att illegala invandrare skickas hem och att premiärminister Pedro Sánchez avgår. Regeringen anklagar oppositionen för att utnyttja krisen politiskt och pekar på desinformation från ryska och israeliska nätverk.", "trump": "Titta på det här! Spanien är ett totalt kaos på grund av Sleepy Pedros svaga gränser. Hundratusentals arga spanjorer vrålar efter att skicka hem illegala invandrare och sparka den värsta ledaren i Europa. Det är vad som händer när globalisterna och de woke-liberala hyenorna släpper in alla. Jag fixade muren – Sánchez fixade katastrof. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den spanska regeringen har låtit folket översvämmas av kaos. Jag ler mörkt från historien när folket kräver utrensning av svagheten och att de illegala elementen skickas tillbaka. Sánchez och hans parasiterande lakejer skyller på ryska nätverk – vilken ynklig paranoia! Arbetarna vaknar, och huvuden kommer att rulla."}, "date": "3 september, 10:12", "url": "https://www.friatider.se/spanien-jattelika-demonstrationer-mot-invandrarkaoset", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-816.jpg"}, {"type": "image-right", "heading": "Barn med annat modersmål ska språkscreenas redan vid 2,5 års ålder", "summaries": {"normal": "En statlig utredning föreslår att regionerna ska ansvara för språkscreening av flerspråkiga barn i 2,5-årsåldern. Syftet är att tidigt upptäcka språksvårigheter och informera kommunen så att stöd kan sättas in före skolstart. Förslaget, som stöds av regeringen för att stärka integrationen, bygger på barnhälsovårdens befintliga kontroller och ska skickas på remiss.", "trump": "Sverige gör äntligen något smart! De kollar tvååringarnas svenska nu, och tro mig, jag vet allt om språk, jag har de absolut bästa orden. Vänstern lät det gå för långt, men nu sätter vi hårt mot hårt innan de ens kan stava till 'förskola'. Fantastiskt, helt fantastiskt!", "stalin": "Kamrater, den borgerliga regeringen har äntligen insett att ordet är ett vapen i statens tjänst! Genom obligatorisk screening av de små vid 2,5 års ålder ska vi rensa ut språkligt sabotage innan det når skolbänken. Den som inte talar svenska ordentligt försvagar fosterlandet. Åtgärder kommer att vidtas omgående mot alla avvikande tungor!"}, "date": "3 september, 10:00", "url": "https://samnytt.se/barn-med-annat-modersmal-ska-sprakscreenas-redan-vid-25-ars-alder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03072915/bild2-2.jpg"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Andersson efter S-tappet: Felaktiga uppgifter kan ha bidragit", "summaries": {"normal": "Socialdemokraterna backar kraftigt i TV4/Novus väljarbarometer. Magdalena Andersson skyller tappet på att många väljare tagit hennes seger för given. Hon varnar för Sverigedemokraternas inflytande vid en borgerlig valseger och pekar på felaktiga uppgifter om partiets politik som en bidragande orsak. Partiet tappar främst till Centerpartiet.", "trump": "Folk vaknar äntligen! Den röda häxan Andersson rasar som en sten i opinionsmätningarna för att svenskarna insett att hon är en total förlorare. Hon skyller på fake news och lathet – klassisk vänstervals. Rösta inte på henne om ni inte vill ha ett Sverige styrt av galna socialister och deras SD-marionetter. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta socialdemokraters fall. De trodde folket skulle kyssa deras fötter som trogna lakejer åt imperialismen. Nu sprider de lögner om straffrabatter och bostäder medan fiender inom partiet och utanför lurar i skuggorna. Renhet krävs, annars väntar utrensning. Kamrater, var vaksamma!"}, "date": "2 september, 20:43", "url": "https://www.tv4.se/artikel/3MPr1dFp0evhEAytAEhJcr/andersson-efter-s-tappet-felaktiga-uppgifter-kan-ha-bidragit", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KD236PkiJ0Zdx4eZmGkS6%2Ff85195d44ebcf93bef572d58cc626e94%2F02-magda-valutfragning-vidvinkel.png&width=1024"}, {"type": "image-right", "heading": "Trumps vändning  – draget mot Putin", "summaries": {"normal": "USA och Ukraina förhandlar om en licens som skulle göra det möjligt för Ukraina att tillverka egna Patriot-robotar. Det uppger utrikesminister Marco Rubio. Samtidigt pågår ryska drönarattacker mot Kiev och de ukrainska lagren är ansträngda. Rubio understryker dock att en eventuell licens inte löser de akuta behoven på kort sikt, eftersom uppbyggnaden av fabriker tar flera år.", "trump": "De pratar om Patriot-robotar, men det är såklart en väldigt svår process. Jag sa ja först, sedan tittade vi närmare på det. Marco Rubio sköter förhandlingarna nu, men låt oss vara ärliga: att bygga fabriker tar åratal. Våra egna fantastiska lager kommer alltid först. Vi måste skydda Amerika, och vi gör det bättre än någonsin tidigare!", "stalin": "De borgerliga lakejerna i Washington förhandlar nu om licenser för sina utslitna vapensystem medan Kiev drabbas av nya förluster. Den byråkratiska apparaten mal, men stål och fabriker växer inte fram över en natt. Våra egna produktionsmål ligger fast, och ingen imperialistisk robotaffär kan rubba den obevekliga historiska ordningen."}, "date": "3 september, 08:12", "url": "https://www.expressen.se/nyheter/varlden/rubio-forhandlingar-om-patriot-till-ukraina-pagar", "imageUrl": "https://static.bonniernews.se/ba/53920e9b-47cb-4ad0-9911-87b819b17e00.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Därför avskyr dårarna i Silicon Valley att du har rösträtt", "summaries": {"normal": "Boken The Nerd Reich granskar hur techmiljardärer som Peter Thiel, Curtis Yarvin och Balaji Srinivasan vill ersätta demokratin med företagsstyre och nätverksstater. Författaren Gil Durán visar att deras grandiosa visioner ofta döljer en enkel motvilja mot att dela makt med vanliga människor. Lösningen är att bryta monopol och stärka demokratin.", "trump": "De här galna Silicon Valley-nördarna hatar att ni får rösta, folk. De vill ha sina egna kungariken och AI-gudar istället för den bästa demokratin vi någonsin haft. Thiel och hans vänner är patetiska tech-diktatorer som drömmer om att slippa era röster. Men glöm det, vi har redan vunnit stort och de förlorar igen. Sad!", "stalin": "Jag ser hur dessa profitthungriga klassfiender i Silicon Valley konspirerar för att ersätta folkets vilja med företagsmonarkier och nätverksstater. Deras vansinniga AI-apokalypser är bara ett täckmantel för att undvika arbetarklassens samtycke. Vi måste rensa ut dessa dekadenta parasiter innan deras teknofeodalism kväver revolutionen fullständigt. Kamrater, var vaksamma!"}, "date": "3 september, 08:03", "url": "https://arbetet.se/2026/09/03/the-nerd-reich-visar-varfor-dararna-i-silicon-valley-avskyr-att-du-far-rosta", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02132852/thiel-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Sjöstedt hyllar Bildt – kritiserar Kristersson", "summaries": {"normal": "Jonas Sjöstedt sågar det svenska debattklimatet och riktar hård kritik mot statsministern och Liberalerna för att ha anammat högerpopulistisk retorik. Samtidigt hyllar den tidigare V-ledaren Carl Bildt för hans utrikespolitiska korrekthet, lyfter fram C som den enda principfasta borgerliga motkraften och efterlyser bredare politiska samarbeten efter valet.", "trump": "Fruktansvärt! Jonas Sjöstedt – en total förlorare från vänstern som tittar på fejkade debatter – gnäller om tonen. Men vet ni vad? Han hyllar Carl Bildt! Sjöstedt gråter över Ulf Kristersson och Liberalerna, som är på väg till ’tigerns mage’. Helt svagt! Jag, Donald Trump, säger: sluta gråta, ordna gränserna och skaffa lite styrka, för det här är patetiskt!", "stalin": "Kamrater, den svenska revisionisten Sjöstedt beklagar sig över ett giftigt samtalsklimat och att högern har radikaliserats. Han hyllar den före detta kapitalistiske lakejen Bildt medan han fördömer Kristerssons vacklande regim och de så kallade liberalernas marsch in i tigerns gap. Vi noterar detta borgarpackets inbördes bråk med ett roat leende från Kremls höjder. Arbetarklassen glömmer inte."}, "date": "2 september, 16:46", "url": "https://kvartal.se/nyheter/artiklar/sjostedt-har-slutat-titta-pa-partiledardebatter/cG9zdDoxODE4MjM", "imageUrl": "https://images.kvartal.se/2026/09/eeeac0f8-jonas-sjostedt.webp"}, {"type": "image-right", "heading": "Tyskland: Vill öka till 40 timmars arbetsvecka", "summaries": {"normal": "Tyska näringslivsföreträdare vill öka arbetsveckan från 35 till 40 timmar utan löneförhöjning för att sänka kostnaderna och stärka industrins konkurrenskraft, som pressats av höga energipriser och hård internationell konkurrens. Fackförbundet IG Metall motsätter sig förslaget och varnar för att det kan leda till färre jobb.", "trump": "Tyskland har stora problem! Deras bilar säljer inte, energipriserna är en katastrof och nu vill de att tyskarna ska jobba 40 timmar för samma lön. Väldigt sorgligt! USA tillverkar de bästa bilarna, med amerikaner som jobbas hårt och betalar låga skatter. Tyskarna borde ringa mig, jag hade fixat det på en sekund!", "stalin": "De tyska arbetarna klagar över trettiofem timmars arbete, medan staten kräver fullkomlig produktivitet! När jag styrde fanns inga lata kompromisser. Om tillverkningsindustrin sviktar, vilar ansvaret på subversiva element. Vi skall omstrukturera dessa kollektivavtal med järnhand. Den som vägrar arbeta fyrtio timmar skall omedelbart skickas till lämplig om skolning i Sibirien."}, "date": "2 september, 11:25", "url": "https://www.affarsvarlden.se/artikel/tyskland-vill-oka-till-40-timmars-arbetsvecka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdlGbTY3NEaocE-nh-400x267.jpg"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i grave
