0.png"}, {"type": "image-full", "heading": "Ali hyllas av Isak efter debuten: ”Var i chock!”", "summaries": {"normal": "Sverige och Grekland spelade 2–2 i VM-genrepet. Taha Ali gjorde ett viktigt inhopp, dribblade förbi flera motståndare och gav assist till Gustaf Nilsson. Trots Ali's bidrag kvitterade Grekland sent, vilket resulterade i oavgjort. Ali hyllades av lagkamrater efter en stark debut.", "trump": "Jag såg matchen, och jag måste säga, Taha Ali är en enorm spelare! Han dribblade runt alla som om de var lata, och gav assistet. Det var fantastiskt, verkligen stort. Sverige borde ha vunnit, men grekerna fick tur. Ali kommer att vara en stjärna på VM, det är ett faktum!", "stalin": "I den stora kampen mot den imperialistiska grekiska fienden, visade vårt landsförrädare en glimt av genombrott. Taha Ali, en liten men modig soldat, driblade genom fiendens försvar som en rysk tank. Men vår seger togs ifrån oss av en sista, svekfull attack. Partiet kommer att utvärdera prestationerna för att stärka vårt ledarskap."}, "date": "4 juni, 22:07", "url": "https://www.gp.se/sport/fotboll/sverige-tappade-segern-sent-i-vm-genrepet-mot-grekland-taha-ali-hyllas.a0e32545-f615-4af9-857a-7e2cd1bba01b", "imageUrl": "https://www.gp.se/images/article/a0e32545-f615-4af9-857a-7e2cd1bba01b/images/4iSnTcBOpe_V80dOMWIEBghKt9ow-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SVT kräver svar om Nick Alinias \"vit makt-tecken\"", "summaries": {"normal": "SVT Kulturnyheterna kräver att journalisten Nick Alinia förklarar varför han under inspelningen av programmet Invandrare för svenskar gjorde ett tecken som förknippas med vit makt-rörelsen. Alinia svarar att det bara var ett vanligt okej-tecken och kallar kritiken för sjuk. Vänstermedier driver kampanj mot honom, vilket lett till att två medverkande hoppat av programmet i protest. SVT:s producent försvarar medverkan.", "trump": "Det här är fullständigt galet, folk. SVT jagar en bra kille, Nick Alinia, för att han visar ett okej-tecken? De kallar det vit makt nu, kan ni fatta? Vänstermedia och deras hysteriska drev, precis som de alltid gör mot mig. De förlorar totalt, tittarna ser igenom bluffen. Skattemedel till sådana här clowner? En katastrof. Alinia är tuff, han står emot dessa misslyckade typer.", "stalin": "Kamrater, detta är ett uppenbart fall av borgarbrackornas sabotage mot folkets television. Den kontrarevolutionäre Alinia utförde ett tecken som omedelbart borde ha lett till en grundlig utrensning, men istället tillåter de dekadenta producenterna detta på statens skärmar. Våra fiender inom kulturnyheterna, dessa förklädda trotskister och västerländska lakejer, försöker nu desperat maskera sitt eget misslyckande med paranoiska anklagelser. Vi ska rensa ut alla som sympatiserar med sådana farliga element innan de infekterar hela kollektivet med sin sjuka humor. Det är både tragiskt och komiskt hur de tror sig kunna lura partiet."}, "date": "4 juni, 17:33", "url": "https://www.friatider.se/svt-kraver-svar-om-nick-alinias-vit-makt-tecken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-293_1.jpg?itok=-As5qLhC"}, {"type": "image-full", "heading": "Nick Alinia deltar i SVT:s program: ”Flyttar debatten”", "summaries": {"normal": "SVT:s humorprogram *Invandrare för svenskar* (IFS) har rekryterat debattören Nick Alinia som paneldeltagare, vilket väckt kontrovers. Producenten försvarar valet med att public service ska spegla olika politiska åsikter. Poddprofilen Julia Frändfors lämnar programmet i protest. Alinia, som själv är kritisk till public service, menar att hans medverkan flyttar debatten i rätt riktning. Dagens ETC ifrågasätter hans bakgrund, vilket Alinia avfärdar som fabricerat.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett skämt! De bjuder in en högerdebattör, Nick Alinia, som hatar dem, men han säger 'ja tack' för att han vill 'flytta debatten'. Vilken hyckleri! Och en poddare, Julia Frändfors, hoppar av som en rädd kyckling. SVT försvarar sig med 'olika åsikter', men alla vet att de bara vill provocera. Jag skulle aldrig låta sådana människor nära min TV – jag har bättre smak!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sin förrädiska natur. Denna Nick Alinia, en förvirrad liten man som leker med högerretorik, bjuds in till statens propagandaapparat – SVT – medan en lojal medborgare som Julia Frändfors tvingas fly fältet. Vi vet att dessa 'humorprogram' bara är ett verktyg för att förvirra massorna. Men folket genomskådar deras trick! Snart ska vi rensa ut alla sådana här småborgerliga element – en gång för alla!"}, "date": "3 juni, 18:59", "url": "https://kvartal.se/nyheter/artiklar/nick-alinias-deltar-i-svt-program-poddprofil-lamnar/cG9zdDoxMjUwMDg", "imageUrl": "https://images.kvartal.se/2026/06/19c5f89f-frandfors-alinia.webp"}, {"type": "text", "heading": "Intrums emissioner ger 95% utspädning", "summaries": {"normal": "Intrums kapitalanskaffning om cirka 7,5 miljarder kronor leder till en utspädningseffekt på cirka 95,7 procent. Teckningskursen på 2,45 kronor per aktie är långt under det senaste stängningskursen på 18,94 kronor. Syftet är att minska skuldsättningen och sänka räntekostnader samt investera i teknologi, data och AI. Emissionen kräver godkännande vid extra bolagsstämma den 9 juni.", "trump": "Jag, Donald Trump, ser Intrums emission som ett tecken på svaghet. De samlar in 7,5 miljarder för att täcka skulder, med en enorm 95,7% utspädning. Jag skulle ha förhandlat bättre villkor. Teckningskursen på 2,45 kronor är för låg – jag kallar det ett misslyckande. Men investeringar i AI är bra, trots allt. Som president vet jag hur man gör affärer.", "stalin": "Vi, statens representanter, ser Intrums kapitalanskaffning som en nödvändig åtgärd för att stabilisera den kapitalistiska makten. Den 95,7% utspädningen visar systemets inbyggda svaghet, men genom kollektivt beslut (bolagsstämma den 9 juni) kan vi styra utvecklingen. Investeringar i AI och data är viktiga för framtiden, liksom minskad skuldsättning för att stärka ekonomin. Som alltid handlar det om kontroll och effektivisering."}, "date": "4 juni, 09:55", "url": "https://www.affarsvarlden.se/artikel/intrums-emissioner-ger-95-utspadning"}, {"type": "image-full", "heading": "Efterlyste Foxtrot-toppen Ali Namdar misstänks för nya våldsbrott", "summaries": {"normal": "Ali Namdar, 21, en av Europols mest efterlysta personer och ledande figur inom Foxtrot-nätverket, misstänks nu för att ha styrt flera grova våldsbrott i Norge från utlandet. Enligt norska myndigheter ska han ha rekryterat minderåriga till brott som handgranatsattack i Oslo, skjutningar och olaga frihetsberövande. Namdar är sedan tidigare efterlyst i Sverige för mordplaner och gängkriminalitet.", "trump": "De här galningarna i Europa, de är verkligen de sämsta. Den här Ali Namdar, en 21-åring som toppar Europols lista, styr skjutningar och bomber i Norge från sitt gömställe. Rekryterar barn till brott! Det är en total katastrof. Mina gränser skulle stoppa sådana typer direkt, de gör Sverige och Norge till ett enda stort crime scene. Så sorgligt!", "stalin": "Kamrater, dessa degenererade element inom den kriminella underklassen, ledda av den förrädiska parasit som kallas Ali Namdar, utgör ett hot mot folkets ordning. Från sitt fega gömställe i utlandet rekryterar han minderåriga till granatexplosioner och skottlossning mot sovjet... nej, norska mål. Vi ska rensa ut alla sådana borgarbrackor och deras kapitalistiska gäng. Paranoia? Nej, det är bara nödvändig likvidering av fiender till kollektivet. Underbart hur de alltid avslöjar sig själva."}, "date": "4 juni, 22:12", "url": "https://riks.se/nyheter/efterlyste-foxtrot-toppen-ali-namdar-misstanks-for-nya-valdsbrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-04%2F02vnzg1w%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-04T221050.072.jpg"}, {"type": "image-full", "heading": "Här är sportbarerna som visar VM", "summaries": {"normal": "Fotbolls-VM närmar sig och många svenskar planerar att se matcherna på sportbarer eller publika visningar. I Göteborg och närliggande områden finns ett flertal sportbarer och restauranger med licens att visa VM-matcher. Göteborgs stad arrangerar även offentliga visningar på Ullevi och Ullevi Plaza. Listan över ställen uppdateras kontinuerligt av Allente. Sveriges matcher spelas 15, 20 och 26 juni.", "trump": "Titta på det här, folk! VM i fotboll kommer och alla dessa fantastiska sportbarer i Göteborg gör sig redo för den stora festen. Det blir enormt, det största någonsin. Ullevi fylls av riktiga patrioter som hejar på Sverige istället för någon woke-skit. Inga identitetspolitiska kvoter här, bara ren fotboll och vinnare. Biden skulle ha missat matcherna helt, men nu fixar vi det rätt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur borgarbrackornas fotbollsfest närmar sig i Göteborg. Dessa sportbarer och restauranger, kontrollerade av den exploaterande kapitalistmaffian, skall visa matcher som en illusion av folklig glädje. Vi vet att sådana evenemang döljer klassfiendens verkliga avsikter. Ullevi skall bevakas noga mot folkförtryckartrollen som försöker splittra kollektivet med sin dekadenta underhållning."}, "date": "4 juni, 21:18", "url": "https://www.gp.se/sport/fotboll/har-ar-sportbarerna-i-goteborg-som-visar-fotbolls-vm-.be5d46f2-9f53-4491-9519-2e5515b06c72", "imageUrl": "https://www.gp.se/images/article/be5d46f2-9f53-4491-9519-2e5515b06c72/images/1X4aZBo5xqmOhMfVjMaqeVUQ-mkc-WIDE.png?width=3840&quality=75"}, {"type": "image-full", "heading": "Katastrofsiffror för L: Så skulle det gå om det var val i dag", "summaries": {"normal": "Enligt SCB:s senaste partisympatiundersökning skulle de rödgröna partierna S, V och MP få egen majoritet om det vore val idag. Liberalerna hamnar på 2,5 procent och åker därmed ur riksdagen. Moderaterna varnar för en vänsterregering med V och MP, medan Socialdemokraterna betonar vikten av att fokusera på ekonomi och välfärd. Sverigedemokraterna är nöjda med sina 18,3 procent trots ett tapp sedan valet 2022. Mätningen ses som en ögonblicksbild med 101 dagar kvar till valet.", "trump": "Titta på de här förlorarna! De rödgröna får plötsligt majoritet enligt en rigged mätning från SCB, medan Liberalerna rasar ner till patetiska 2,5 procent och åker ut. Det är en katastrof för Tidöregeringen som faktiskt sänker skatter och får saker gjorda. Väljarna vill ha mat på bordet och fungerande välfärd, säger de, men tro mig, en regering med Vänsterpartiet och Miljöpartiet blir ett totalt kaos. Sverige vaknar upp till en chock om det händer. Valet är inte idag, det är 101 dagar kvar och vi kommer vinna stort!", "stalin": "Kamrater, denna mätning visar att de verkliga folkets krafter samlas mot borgarbrackornas och reaktionärernas skuggregering. Jag ser med stor tillfredsställelse hur de dekadenta liberalerna likvideras under 2,5 procentsspärren, en passande utrensning av svaga element. De som försöker lura arbetarna med falska skattesänkningar avslöjas nu som de parasitiska kapitalister de är. Våra motståndare i den borgerliga klicken må varna för oss, men deras paranoia är befogad. Vi ska rensa ut alla som hotar kollektivets välfärd. Inga kompromisser med fienden – segern tillhör oss, inte de osäkra elementen som vacklar som lögnare i vinden."}, "date": "4 juni, 09:57", "url": "https://nyheter24.se/nyheter/politik/1488719-liberalerna-under-riksdagssparren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4f44368004b004a30200000000b004a302/2026/06/04/2368572/val.png"}, {"type": "image-full", "heading": "AI går före löneökningar – anställda får betala priset", "summaries": {"normal": "Företag prioriterar nu massiva investeringar i artificiell intelligens, vilket får direkta konsekvenser för de anställda. Många bolag, exempelvis Teradata och TTEC, väljer att frysa löneökningar eller dra in förmåner för att finansiera AI-satsningar. Samtidigt pågår uppsägningar inom tech-sektorn, däribland hos Meta. Utvecklingen markerar ett skifte där strategiska AI-investeringar prioriteras framför personalutveckling, vilket väckt kritik gällande arbetsgivares ansvar och medarbetares förtroende.", "trump": "Företag som Teradata och TTEC gör nu det jag alltid pratar om – de bygger enorma AI-satsningar! De säger till sina anställda: 'Inga löneökningar nu, vi ska vinna mot Kina!' Det är smart, mycket smart. De där teknikjättarna som Meta sparkar folk för att bli effektivare, precis som de borde. Det är en tuff värld, men vi måste vara nummer ett inom AI. Vi ska inte ge bort pengar, vi ska bygga de största, vackraste maskinerna. USA ska dominera, tro mig!", "stalin": "Dessa giriga kapitalister har funnit en ny gud: den digitala algoritmen. De svälter ut arbetarklassen, fryser deras löner och stjäl deras bröd för att mata maskinerna. Det är en patetisk dans av svaghet. Precis som vår broder Putin krossar de korrupta västerländska institutionerna, rensar vi ut dessa 'effektiviserings'-förrädare. Om en arbetare inte tjänar staten, har han inget värde. Vi kommer att använda deras egna AI-verktyg för att spåra varje avvikelse i lojalitet. Framtiden tillhör den järnhårda disciplinen, inte mjukvaruoptimering."}, "date": "4 juni, 18:15", "url": "https://www.realtid.se/it-tech/ai-gar-fore-loneokningar-anstallda-far-betala-priset/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlyekf4hrym5o-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-right", "heading": "Kristersson har helt förlorat kontrollen", "summaries": {"normal": "Ulf Kristersson har förlorat kontrollen över Tidölaget, som nu kollapsar i opinionsmätningarna enligt Arbetets politiska redaktör. Sverigedemokraternas skandaler och extrema positioner, som utvisning av barn, skrämmer särskilt kvinnliga väljare och storstadsbor. Högern har svårt att locka över blockgränsen och uppfattas inte längre som garant för ordning. Svenskarna längtar efter starkare offentlig styrning och statlig trygghet istället för högerns individualism och valfrihetsreformer.", "trump": "Titta på den här totala katastrofen för Ulf Kristersson, en riktig förlorare. Hans regering rasar ihop som ett korthus, alla hatar SD och kvinnorna flyr i panik. De lovade ordning men levererar kaos med elstöd, utvisningar och misslyckad kärnkraft. Högern kommer att bli utspolade i valet, det är en enorm röra. De borde ha lyssnat på mig, vi gör allt mycket bättre, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgaralliansen under den patetiske Kristersson nu rasar samman som en förrädisk parasit på folkets kropp. Dessa SD-banditer med sina barnutvisningsfantasier sprider en motbjudande stank av reaktionär förräderi som får arbetarkvinnorna att kräkas av aversion. Vi ska rensa ut dessa ansvarslösa individualister och deras järnvägsstoppande sabotage. Staten skall återta kontrollen med järnhand – låt mullret från folket likvidera hela det borgerliga träsket i en kollektiv utrensning av historiska mått."}, "date": "4 juni, 09:50", "url": "https://arbetet.se/2026/06/04/ulf-kristersson-har-helt-forlorat-kontrollen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04095013/kristersson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-right", "heading": "Oro kring Elanga i genrepet: ”Smärta man inte kan förklara”", "summaries": {"normal": "Anthony Elanga fick en smärtsam knä-mot-knä-smäll under Sveriges genrepet mot Grekland. Skadan gjorde sig påmind under efterföljande träning, men Elanga lugnar med att allt känns bra nu. Lagkamrater oroade sig initialt, likaså kring Victor Nilsson Lindelöfs frånvaro och Benjamin Nygrens vristtackling. Förbundskapten Graham Potter ger dock lugnande besked inför VM.", "trump": "Titta på de där svenska grabbarna, de springer runt och slår knän mot knän som idioter. Elanga säger att smärtan inte går att förklara, men sen säger han att allt är underbart. Typiskt. Lindelöf är borta, Nygren får en smäll på vristen. Men oroa er inte, säger deras coach, allt är perfekt. Tro mig, de behöver en riktig ledare, inte såna här genrepsmissar.", "stalin": "Kamrater, denna fega knä-mot-knä-sabotör från borgarlandets fotbollsmaskineri vågar kalla sin smärta oförklarlig. Jag ser direkt de imperialistiska spionernas fingeravtryck som försöker försvaga arbetarklassens lag inför VM. Vi ska rensa ut alla sådana svaga element som Nygren och Lindelöf med deras mystiska känningar. Inga kapitalistiska skadevirus ska hota kollektivets seger. Det är ett skämt värdigt likvidering."}, "date": "4 juni, 23:22", "url": "https://www.svt.se/sport/fotboll/oro-kring-anthony-elanga-i-genrepet-smarta-man-inte-kan-forklara", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.57/541b144f207da1174c07add2ca01082e291d0b6ec9a7c1d6670c344405689c95"}, {"type": "image-right", "heading": "Omfattande attacker natten till onsdag – värsta under vapenvilan", "summaries": {"normal": "USA:s militär attackerade en oljetanker på väg mot Iran med en Hellfire-robot under tisdagen, då fartyget ignorerade varningar och blockaden. Iran svarade med missiler mot ett annat fartyg och drönare mot amerikanska baser i Kuwait och Bahrain. USA hävdar att attackerna misslyckades. Det skedde under en skakig vapenvila efter att Iran lämnat samtal med USA på grund av Israels agerande i Libanon. Trump tror på en snar överenskommelse.", "trump": "Lyssnarna, det här är ett fullständigt kaos skapat av svaga ledare och radikala idioter. Jag sköt en Hellfire på den där iranska oljetankern som vägrade lyssna – boom, rakt i maskinrummet! Iran svarade som gnälliga förlorare med drönare mot våra baser, men vi sköt ner allt som idioter. Biden lämnade en trasig värld, nu fixar jag vapenvila och öppnar Hormuzsundet nästa vecka. Netanyahu är en galning, men vi löser det. Amerika är tillbaka, större än någonsin!", "stalin": "Kamrater, imperialisternas fientliga provokationer mot våra allierade i Hormuzsundet har mötts med stålsäker beslutsamhet. Jag beordrade träffsäkra motattacker mot de dekadenta borgarbrackornas baser i Kuwait och Bahrain, medan deras patetiska robotar gensköts som ynkliga spioner. Den skakiga vapenvilan är ett temporärt vapen i klasskampen. En ny utrensning av folkfienderna närmar sig oundvikligen. Arbetarna segrar, kapitalistmaffian gråter. Sovjetisk styrka består evigt."}, "date": "4 juni, 07:26", "url": "https://www.tv4.se/artikel/FuJ7v0Pcily9lXYE74P3W/omfattande-attacker-i-natt-vaersta-under-vapenvilan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7BAjM59XiMox9QDMsYt1M3%2F9368479c13e416950fba37061db4c8ff%2Foljetanker.jpg&width=120"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Tunga partiundersökningen: Oppositionen leder stort", "summaries": {"normal": "SCB:s stora partisympatiundersökning visar att oppositionen leder med 12,6 procentenheter över Tidöpartierna. Liberalerna hamnar på 2,5 procent och riskerar att åka ur riksdagen. Socialdemokraterna växer starkt till 33,9 procent, främst på Moderaternas bekostnad. Sverigedemokraterna backar mest bland regeringspartierna. Om siffrorna står sig skulle de rödgröna partierna få egen majoritet.", "trump": "Den här svenska undersökningen är en katastrof för de förlorande liberalerna och hela den svaga regeringen. De får stryk, Liberalerna åker ut ur riksdagen som de förtjänar. Socialdemokraterna vinner stort, de tar alla mina väljare, det är pinsamt. Oppositionen leder med över tolv procentenheter. Sådana siffror har jag aldrig sett, total förnedring för de misslyckade högerpolitikerna. Sverige behöver starka ledare, tro mig.", "stalin": "Kamrater, denna mätning avslöjar borgarbrackornas och de liberala parasiternas fullständiga sammanbrott. Jag ser med stor tillfredsställelse hur de kontrarevolutionära elementen inom Tidöpartierna rensas ut av folkets vilja. Socialdemokraterna växer som en ostoppbar kraft mot högerns sabotage. Sverigedemokraterna backar, deras falska patriotism är blottat som en förrädisk mask. Vi ska likvidera alla som hotar kollektivets enhet. Inga kompromisser med kapitalisternas lakejer."}, "date": "4 juni, 09:08", "url": "https://arbetet.se/2026/06/04/tunga-partiundersokningen-oppositionen-leder-stort/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082310/sdlgg7d2u-jxx8-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Finlands president: Låt Kanada gå med i EU", "summaries": {"normal": "Finlands president Alexander Stubb förespråkar en kraftig utvidgning av EU med upp till 40 medlemsstater för att stärka unionens geopolitiska tyngd. Under en energikonferens nämnde han bland annat Kanada, Storbritannien, Turkiet och flera Balkanländer som möjliga medlemmar eller partners. Syftet är att möta osäkerheten i omvärlden genom att expandera samarbetet i en tid då länders internationella allianser omprövas.", "trump": "Finlands president Stubb – en väldigt svag person – pratar om att Kanada ska bli medlemmar i EU. Kan ni tro det? De vill ha dem i EU istället för att vara en del av mitt fantastiska USA. Kanada vill inte vara en stat hos oss? Lycka till med det! De försöker desperat växa för att de är rädda. EU är en katastrof, en rörig byråkrati som håller på att falla sönder. De vill ha alla, till och med Turkiet. Sorgligt!", "stalin": "Den finska marionetten Stubb drömmer om att svälja världen i ett europeiskt imperium. Att föreslå Kanada som en del av detta byråkratiska monster är ett skrattretande tecken på västerländsk dekadens och desperation. De försöker desperat muta in länder för att dölja sin svaghet inför det storslagna Ryssland. Vi ser hur dessa löjliga 'allianser' smulas sönder. Låt dem expandera sin pappersunion; de bygger bara ett större korthus som vi snart kommer att blåsa omkull. Historien dömer de svaga."}, "date": "4 juni, 17:22", "url": "https://www.realtid.se/samhalle/finlands-president-lat-kanada-ga-med-i-eu/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl9ituplrli5s-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Efter mopedolyckan: Här tar Elias studenten", "summaries": {"normal": "Efter en allvarlig mopedolycka 2020, där 16-årige Elias Askari fick svåra hjärnskador och låg i koma, trodde läkarna att han aldrig skulle återhämta sig. Familjen vägrade ge upp och kämpade genom intensiv rehabilitering. Sex år senare tar Elias studenten vid Riksgymnasiet i Angered. Han går själv, kommunicerar med gester och vill föreläsa om vikten av att använda hjälm. Hans syster Safoura beskriver det som en seger för envishet och kärlek.", "trump": "Titta på den här killen Elias, en riktig vinnare, inte som de förlorare som kör moppe utan hjälm. Läkarna, de så kallade experterna, sa att han var färdig, typiskt etablissemangets pessimism. Men familjen kämpade som inga andra, fem timmar träning om dagen, och nu tar han studenten! Fantastiskt. Biden skulle ha gett upp och skickat räkningen till skattebetalarna. Använd hjälm, annars är du en dumbom. Amerika älskar sådana här historier, tro mig.", "stalin": "Jag betraktar denna berättelse med stor tillfredsställelse. Den unge arbetarkamraten Elias drabbades av en olycka orsakad av bristande disciplin, men vi, partiet och familjen, vägrade låta de defaitistiska läkarborgarna diktera villkoren. Genom kollektiv kamp och utrensning av uppgivenhet har han rest sig. Fem timmar daglig träning likt en sann socialistisk hjälte. Nu tar han studenten och skall propagera för skydd mot faror. Fiender till framsteg skall alltid likvideras med skratt."}, "date": "4 juni, 19:51", "url": "https://www.gp.se/nyheter/goteborg/efter-allvarliga-olyckan-har-tar-elias-studenten.8c336f3b-c2de-42a6-bd6c-225a1ffee3d1", "imageUrl": "https://www.gp.se/images/article/8c336f3b-c2de-42a6-bd6c-225a1ffee3d1/images/59CcOkmLhnemdpzU3NtXEGWw0TpI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "SD-politiker till akuten efter attack", "summaries": {"normal": "En SD-politiker attackerades utanför Fredrika Bremergymnasiet i Haninge när partiföreträdare delade ut valfoldrar. En ung man kastade ägg mot dem och ropade rasistiska tillmälen. Gruppledaren Kent Svensson sprang ifatt honom, konfronterades och fick en armbåge i bröstet. Händelsen polisanmäldes, gärningsmannen identifierades som elev och stängdes av från skolan. Svensson sökte akutmottagning för att dokumentera skadan och berömmer skolans snabba agerande.", "trump": "Kan ni fatta det här? SD står där utanför en skola i Haninge och delar ut lite foldrar, helt fredligt, och så kommer någon vänsterradikal kille springande och kastar ägg medan han skriker rasist och nazist. Vår man Kent får en armbåge rakt i bröstet! Han åker till akuten som en riktig tuffing. De stängde av killen direkt, bra jobbat. Men det här är vad vänsterns hets leder till. Det goda våldet, säger de. Patetiskt. Vi vinner ändå stort.", "stalin": "Kamrater, se hur borgarbrackornas lakejer inom den så kallade Sverigedemokratin utsätts för rättmätig folklig vrede utanför en skola i Haninge. Ägg kastas mot de reaktionära foldrarna medan en sanningsenlig röst ropar ut deras fascistiska lögner. När deras gruppledare rusar fram som en desperat kapitalistisk springpojke möts han av en armbåge från en ung kamrat. Vi har omedelbart låtit rensa ut detta element från skolan. Låt detta vara en varning: den som hetsar mot folkets vilja skall likvideras i den stora utrensningen mot alla troskyldiga fiender till kollektivet. Underbart underhållande att se dem klaga över sitt eget gift."}, "date": "4 juni, 20:44", "url": "https://riks.se/nyheter/sd-politiker-till-akuten-efter-attack", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-04%2F1qltsv5n%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-04T204233.267.jpg"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "image-full", "heading": "Huset där du kan leva på stor fot. Bo i en sko? Det gick innan Shoe House blev museum.", "summaries": {"normal": "År 1948 byggde den excentriske skoförsäljaren Mahlon N. Haines ett hus i form av en jätte-sko i Yorklyn, Pennsylvania. Huset, som är 7,5 meter långt och 14,5 meter högt, gjordes av trä, tråd och cement med glasmålningar. Haines erbjöd äldre och nygifta par att bo där gratis, med tjänstefolk och bil. Efter hans död 1962 har Shoe House blivit ett museum över hans liv.", "trump": "Folk, det här är helt galet, den här skoknarkaren Haines byggde ett jättestort skohus, jättestort, och bjöd in folk på bröllopsresa, gratis! Inget bidragssystem, inga kvoter, inga woke-aktivister som bestämmer vem som får sova i skon. Fantastiskt, bättre än Bidens kaos. Jag älskar det, men nu är det ett museum, kanske borde vi bygga ett Trump Tower i skoform, det skulle bli enormt framgångsrikt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna kapitalistiska skopirat Haines byggde ett enormt skohus för att locka arbetarklassen med falska löften om lyx. Hans borgarbrackor och folkförtryckartroll maskerade sig som välgörare. Efter hans död rensades hans privata egendom ut och omvandlades till ett kollektivt museum för folkets upplysning. Sådana klassfiender avslöjar alltid sin sanna natur till slut."}, "date": "4 juni, 19:11", "url": "https://www.dagensps.se/varlden/huset-dar-du-kan-leva-pa-stor-fot/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/shoehouse.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Miljonärer vill inte längre flytta – med ett undantag", "summaries": {"normal": "Enligt en ny rapport från Capgemini har utflyttningen av världens dollarmiljonärer halverats under 2025 jämfört med året innan. Den politiska osäkerheten som tidigare drev på flyttvågor, exempelvis i Storbritannien, har klingat av och läget beskrivs nu som mer stabilt. Medan Singapore och USA lockar mest, är arvsplanering numera ett viktigare motiv än ren skatteoptimering. Samtidigt syns en oväntad trend där förmögna amerikaner söker sig till London trots tidigare utflyttningsvågor.", "trump": "Alla rika personer kommer hem till USA, det är sant! De förstår att jag har gjort Amerika fantastiskt igen. Rapporten visar att utflyttningen har kraschat – precis som mina motståndare. De lämnar Storbritannien och kommer hit till vinnare. England försökte, men de är inte USA! Vi har den bästa ekonomin, de bästa jobben. Alla vill hit, de ringer mig hela tiden och säger 'Tack för att du räddar landet'. Det är en total seger för USA, tro mig!", "stalin": "Dessa parasiterande kapitalister, som likt råttor byter bo efter bekvämlighet, börjar äntligen inse att ingenstans är säkert från historiens dom. Att deras flykt stagnerar är bara en tillfällig paus i deras oundvikliga undergång. Vår kamrat Putin rensar effektivt ut dessa dekadenta element i öst, medan västvärlden darrar i sin egen impotenta liberalism. Låt dem flytta sina miljoner – staten väntar tålmodigt på att konfiskera varje öre när den slutgiltiga krossen av deras klass äntligen fullbordas."}, "date": "4 juni, 16:32", "url": "https://www.realtid.se/bors-finans/makro/miljonarer-vill-inte-langre-flytta-med-ett-undantag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/dubai.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Fraktbolag flög passagerarplan – nu går de omkull", "summaries": {"normal": "European Cargo Limited, som specialiserat sig på att bygga om passagerarplan till fraktflygplan, har gått i konkurs i Storbritannien. Bolaget grundades för sex år sedan och fick uppmärksamhet under pandemin för transporter av skyddsutrustning. Nu förlorar 178 anställda sina jobb på grund av minskad flygaktivitet och stigande bränslekostnader. Företaget redovisade stora förluster och nettoskulder. Expansionen vid Teesside International Airport tre månader tidigare har nu upphört.", "trump": "Folk, ni tror inte hur patetiskt det här är. European Cargo, de där clownerna som byggde om gamla skrälliga passagerarplan till fraktkärror, har gått i konkurs. Hundratals jobb borta, precis som under Biden. De flög skyddsmasker under pandemin och trodde de var stora hjältar, men bränslekostnaderna tog kål på dem. Totala misslyckanden! Jag hade fixat det på en vecka, tro mig. Nu ligger de på rygg som förlorare. Sad!", "stalin": "Kamrater, dessa exploaterande borgarbrackor vid European Cargo trodde de kunde omvandla passagerarplan till fraktmaskiner och suga ut mervärde ur arbetarklassen. Nu har deras parasitiska imperium kollapsat under tyngden av egna skulder och bränsleblodsugares girighet. Jag ser med mörk tillfredsställelse hur 178 klassfiender förlorar sin existens. Deras så kallade expansion var blott en illusion skapad av kapitalistmaffian. Rensa ut alla sådana folkförtryckartroll!"}, "date": "4 juni, 18:58", "url": "https://www.dagensps.se/bors-finans/fraktbolag-flog-passagerarplan-nu-gar-de-omkull/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/g-eclb-a340-600.png?width=256&quality=75"}, {"type": "image-right", "heading": "Rubbestad utkastad av sin fru", "summaries": {"normal": "Michael Rubbestad, tidigare riksdagsledamot för Sverigedemokraterna, misstänks för barnpornografibrott och har avsagt sig sina uppdrag samt lämnat partiet och riksdagen. Enligt uppgifter har hans fru, som arbetar nära partiledare Jimmie Åkesson, kastat ut honom från hemmet efter att ha reagerat starkt på anklagelserna. Polisen genomförde husrannsakan efter att barnen lämnat hemmet. Rubbestad hade tidigare välkomnats i partiet trots en dom för stöld.", "trump": "Folk, det är en total katastrof för Sverigedemokraterna. Den här Rubbestad är en loser som de släppte in trots att han är en vanlig tjuv – och nu sitter han fast i barnporrskandalen. Hans egen fru, som jobbar direkt under ledaren, slänger ut honom ur huset! Patetiskt. De ignorerade varningarna, precis som de gör i många svaga länder. Sverige behöver starka ledare, inte sådana här misslyckade typer som förstör allt.", "stalin": "Kamrater, denna degenererade element Rubbestad har visat sig vara en farlig parasit som smugit sig in i partistrukturen trots upprepade signaler om hans kontrarevolutionära stöldbeteende. Nu likviderar vi hans inflytande genom utrensning från alla poster medan utredningen pågår. Hans egen fru, en lojal kämpe i ledarens innersta krets, har med proletär beslutsamhet kastat ut denne borgarbracka ur det gemensamma hemmet. Vi ser fiendens tentakler överallt – även i form av perversa avvikelser. Polisen slog till först efter att de socialistiska avkommorna säkrats till skolan. Inga fiender undkommer folkets vrede."}, "date": "4 juni, 13:48", "url": "https://www.friatider.se/rubbestad-utkastad-av-sin-fru", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/ru3.jpg"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Efter år av fusk och utnyttjande – nu kommer bärplockarna tillbaka", "summaries": {"normal": "Efter avslöjanden om slavliknande villkor och fusk har antalet thailändska bärplockare i Sverige minskat drastiskt, vilket lett till brist på svenska bär och högre priser. Branschen inför nu en ny modell med direktanställning hos svenska företag, nya kollektivavtal och säsongsvisum via EU-regler. Migrationsverket behåller dock hög riskmedvetenhet och granskar ansökningarna noga. Branschen hoppas på en långsam återhämtning men räknar med fortsatt brist och dyrare bär.", "trump": "De har fuskat och utnyttjat folk i åratal, det var en total katastrof. Nu kommer de thailändska bärplockarna tillbaka, men på ett smart sätt med nya regler och direktanställning. Migrationsverket misstänker alla, typiskt byråkrater, men vi fixar det. De gamla skurkarna är borta, nu blir det ärligt jobb. Ändå kommer det bli brist på bär och priserna stiger. Sådant händer när man inte har kontroll från början. Vi gör det stort igen!", "stalin": "Kamrater, efter år av skamlöst utnyttjande av våra thailändska klassbröder av giriga skogskapitalister och bemanningsborgarbrackor har vi genomfört nödvändiga utrensningar. Nu tar vi kontrollen över bärområdena med en ny sovjetisk, pardon, svensk modell av direktanställning och kollektivavtal. Migrationsverket visar sund paranoia mot dessa potentiella sabotageörer och exploatörer. Vi tillåter ingen återgång till slavarbete, men om någon försöker kringgå systemet ska de likvideras med byråkratisk precision. Bären till folket, priserna må stiga som en varning till de opålitliga."}, "date": "4 juni, 06:00", "url": "https://arbetet.se/2026/06/04/efter-ar-av-fusk-och-utnyttjande-nu-kommer-barplockarna-tillbaka/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03105928/barplockare.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Viktor Gyökeres kapades rejält: ”Man blir irriterad”", "summaries": {"normal": "Viktor Gyökeres utsattes för en hård tackling i Sveriges VM-genrep mot Grekland. Han fick behandling för axeln både direkt och under en paus men kunde fortsätta matchen och kvittera till 1–1 på frispark. Lars Lagerbäck kritiserade tacklingen som onödigt riskfylld i en träningsmatch, medan Greklands förbundskapten avfärdade kritiken. Gyökeres meddelade att han är oskadd inför VM-premiären mot Tunisien om elva dagar.", "trump": "Den där grekiska mittbacken utförde en ful, farlig tackling på den svenska stjärnan Gyökeres. Totalt respektlöst. Lagerbäck hade helt rätt, man ska inte spela så i en träningsmatch, det är patetiskt. Men Gyökeres reste sig, fick behandling och dunkade in en frispark som en riktig vinnare. Stark kille. De borde lära sig att respektera varandra istället för att försöka skada folk. Patetiskt beteende.", "stalin": "Kamrater, denna fega kapitalistiska tackling mot en arbetets hjälte avslöjar borgarbrackornas sanna ansikte även på fotbollsplanen. Jag, som alltid genomskådar de dekadenta fienderna, noterar hur de grekiska reaktionärerna med sin farliga spark försöker likvidera framsteg och skada folkets krafter. Men den svenska stjärnan reste sig som en sann kollektiv kämpe och kvitterade med en mäktig frispark. Vi ska rensa ut alla sådana sabotörer som gömmer sig bakom falsk vänskap. Ingen slipper undan."}, "date": "4 juni, 22:10", "url": "https://www.svt.se/sport/fotboll/viktor-gyokeres-fick-behandling-efter-valdsamma-tacklingen-storsta-mardrommen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.51/5eee6831da52fe4b1e102760a511481bed3ddb030695671e46c9eccaafb6ed4d"}, {"type": "image-full", "heading": "Man skjuten till döds av polis efter biljakt", "summaries": {"normal": "En 30-årig man sköts till döds av polis efter en biljakt söder om Stockholm. Mannen misstänks för mordförsök på tre minderåriga, som enligt uppgifter är hans barn. Två av barnen vårdas på sjukhus med stabilt tillstånd. Mannen var tidigare dömd för bland annat misshandel och barnfridsbrott. Åklagaren bedömer händelsen som isolerad utan ytterligare misstänkta.", "trump": "Fruktansvärd historia i Sverige, helt otroligt! En galen man, tydligen en riktig förlorare, försökte mörda sina egna barn – men tack vare våra modiga poliser, som jag alltid säger är de bästa, stoppades han. Sverige borde vara tacksamma! Men vad kan man vänta sig när man släpper lös sådana här typer? SAD!", "stalin": "En fiende till folket och staten har eliminerats. Denna degenererade parasit, som vågade lyfta hand mot sina egna blodsband, mötte sitt rättvisa öde tack vare våra disciplinerade kamrater i uniform. Sverige, denna försvagade utpost av dekadens, visar återigen varför det behöver en stark hand. Barnen? De är nu i statens vård – där de tillhör."}, "date": "3 juni, 06:18", "url": "https://kvartal.se/nyheter/artiklar/man-skjuten-till-dods-av-polis-efter-biljakt/cG9zdDoxMjEyNzY", "imageUrl": "https://images.kvartal.se/2026/06/188cb239-polisjakt.webp"}, {"type": "image-right", "heading": "Inhopparen hyllas för dribblingen: ”Det är helt otroligt”", "summaries": {"normal": "Taha Ali hoppade in efter 63 minuter i Sveriges 2–2-match mot Grekland och gjorde omedelbar skillnad. Han spelade fram Gustaf Nilsson till ledningsmål och fortsatte att dribbla omkull grekiska försvarare. Lagkamrater och experter hyllade hans insats, och Graham Potter prisade hans unika talang. Anthony Elanga menade att Ali förtjänar att spela i en toppklubb utomlands.", "trump": "Taha Ali kom in i matchen och gjorde allt fantastiskt, helt otroligt. Sex minuter senare serverade han ett mål som ingen annan kunde göra, och sedan dansade han runt de grekiska försvararna som om de inte fanns. Potter säger att du inte hittar många i hela världens fotboll som gör det han gör. Elanga har rätt, killen förtjänar de allra bästa ligorna. Sverige behöver fler sådana vinnare, tro mig.", "stalin": "Jag såg med stor tillfredsställelse hur denna arbetets son från Malmö likviderade de grekiska reaktionärernas försvar med blixtsnabba dribblingar och serverade segern till kollektivet. Borgarbrackornas dekadenta försvarare föll som klassfiender inför folkets vilja. Potter och Elanga prisar honom, men jag vet att sådana talanger alltid hotas av opportunister och revisionister. Vi ska skydda honom från alla som vill hålla honom nere i de allsvenska träsken, annars blir det utrensning bland de fega."}, "date": "4 juni, 22:01", "url": "https://www.svt.se/sport/fotboll/taha-ali-hyllas-efter-inhoppet-helt-otroligt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.68/0.34/7866aa98abd46c5be4fdc08127b8bbd19e809e450a8dc9dde0eac02288c2985e"}, {"type": "image-full", "heading": "Iranska VM-spelare: ”Det är inte lätt”", "summaries": {"normal": "Iran ska spela fotbolls-VM i USA mitt under ett pågående krig mellan länderna. Det är historiskt unikt. Iranska spelare berättar för AP om hur konflikten påverkar förberedelserna, inklusive visumproblem och flyttad träningsbas. De spelar för att ge sitt krigsdrabbade folk glädje, med höga förväntningar från den stora iranska diasporan i Los Angeles.", "trump": "Som president säger jag att det är en ära att ha VM i USA, även om Iran är med. Vi har handlat starkt mot dem och nu kommer de hit. Våra säkerhetsåtgärder är de bästa, och jag är säker på att vi vinner. Det här visar att Amerika alltid är det bästa, oavsett vad de gör.", "stalin": "I den store statens namn ser vi på detta VM som en strid mot den globala imperialismen. Våra spelare, inspirerade av det stolta iraniska folkets lidande, ska kämpa på utomlands. Vi kommer att vinna genom vår överlägsna disciplin. Hormuzsundet är vårt, och vi försvarar det med vårt liv. Fienden kommer att känna vårt förkrossande svar."}, "date": "4 juni, 15:36", "url": "https://bulletin.nu/iranska-vm-spelare-det-ar-inte-latt", "imageUrl": "https://cdn.bulletin.nu/articles/13074892-daea-41c2-a5de-c6254a094a4d/preview.jpg?t=1780580153000"}, {"type": "image-right", "heading": "Persepolis-skaparen Marjane Satrapi avliden", "summaries": {"normal": "Marjane Satrapi, den iransk-uttalade serietecknaren och regissören bakom 'Persepolis', har avlidit 56 år gammal. Satrapi flydde Iran efter revolutionen, bodde i Wien som tonåring och flyttade till Frankrike 1994. Som öppen kritiker av den iranska regimen stödde hon protester efter Mahsa Aminis död. Hennes verk, särskilt 'Persepolis', gav henne internationellt genombrott. Hennes make, den svenske skådespelaren Mattias Ripa, avled förra året. Familjen säger att hon avled av sorg drygt ett år efter makens död.", "trump": "Jag, Donald Trump, den mest fantastiska presidenten i historien, har hört att Marjane Satrapi dött. Hon var en iransk tecknare som gjorde ett enormt framgångsrikt verk, 'Persepolis', som alla älskar. Hon hatade Iran, vilket jag tycker är bra, för Iran är ett uselt land. Hon var gift med en svensk skådespelare, vilket är intressant, för jag älskar Sverige. Hon dog av sorg efter att hennes make dog, vilket är tragiskt, men jag, Donald Trump, har haft det svårt också, och jag är fortfarande den starkaste.", "stalin": "Vi, partiet och staten, har noterat att Marjane Satrapi, en iransk konstnär, har avlidit. Hennes verk, 'Persepolis', var en fiendens attack mot den iranska regimen, vilket vi, som alltid seger, förstår. Hennes död är en läxa för alla som vågar kritisera staten. Vi fortsätter att utvidga vår ryska intressesfär, precis som Putin gör, och vi kommer att eliminera alla fiender. Hennes sorg efter makens död är en symbol för det svaga, men vi är starka."}, "date": "4 juni, 15:27", "url": "https://bulletin.nu/persepolis-skaparen-marjane-satrapi-avliden", "imageUrl": "https://cdn.bulletin.nu/articles/325d9579-3d6d-48e3-9e4d-5a38dd250477/preview.jpg?t=1780579588000"}, {"type": "image-full", "heading": "Vänsterblocket stärker greppet om Stockholm", "summaries": {"normal": "Stockholm, som länge betraktats som borgerlighetens starkaste fäste, har förskjutits åt vänster. De rödgröna partierna – S, V och MP – samlar nu nära 60 procent av väljarstödet i staden, mot Tidöpartiernas 31,6 procent. Inklusive Centerpartiet når de rödgröna 66 procent. I Stockholms län är det jämnare med en svag rödgrön majoritet. Nationellt leder de rödgröna med 49,1 procent mot 42,6 procent för Tidöpartierna, medan Liberalerna ligger under riksdagsspärren.", "trump": "Titta på det här, Stockholm var en borgerlig fästning, den bästa, och nu har de rödgröna socialisterna tagit över som idioter. De har nästan 60 procent, det är en katastrof, en total skam. Tidöpartierna får bara 31 procent, patetiskt. Hela Sverige håller på att bli vänstervridet, men tro mig, det kommer att bli väldigt tråkigt för dem. Liberalerna under spärren? Ingen bryr sig, de är misslyckanden.", "stalin": "Kamrater, den borgerliga pesten har äntligen krossats i Stockholm. Jag ser med stor tillfredsställelse hur arbetarklassens partier nu krossar kapitalisternas 31-procentiga rest. De rödgröna håller 60 procent, en siffra som får borgarbrackorna att darra i sina herrgårdar. I hela landet fortsätter vi rensa ut de kontrarevolutionära elementen. Liberalerna? En ynka 2,5 procent – snart likviderade ur historien. Fienderna i södra Sverige må öka, men ingen undkommer partiets vakande öga."}, "date": "4 juni, 19:23", "url": "https://riks.se/nyheter/vanstern-starker-greppet-om-stockholm", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-04%2F3mgo7u0u%2Fmagda.jpg"}, {"type": "image-right", "heading": "Sverige tappade segern i sista sekund – kryss i genrepet", "summaries": {"normal": "Sverige spelade oavgjort 2–2 mot Grekland i VM-genrepet efter en kvittering i matchens sista minut. Grekland tog ledningen tidigt, men Sverige vände till 2–1 genom inhopparna Taha Ali och Gustaf Nilsson. Trots en stark andra halvlek kunde Blågult inte hålla undan, och Giorgios Masouras petade in 2–2. Förbundskapten Graham Potter ansåg att Sverige borde ha vunnit.", "trump": "Vi borde ha krossat dem totalt, men istället får vi en kalldusch i sista sekunden. Grekland, de är svaga, men Sverige var passiva och sov i första halvlek. Inhopparna gjorde det bra, vände till ledning, men sen kom den fega kvitteringen. Matchen var öppen och konstig, vi pratade om att vara aggressiva men det räckte inte. Sverige lämnar utan seger – en total besvikelse, tro mig.", "stalin": "Kamrater, denna fega, dekadenta fotbollsföreställning avslöjar borgarbrackornas underminering av den kollektiva viljan. Jag såg hur de passiva elementen i första halvlek kapitulerade inför fiendens tidiga stöt, som en fiende inom murarna. Våra arbetande krafter reste sig och tog ledningen, men i sista ögonblicket petade en parasit in kvitteringen. Vi bör rensa ut dessa sömniga element som gömmer sig i skallarna. De trodde de kunde vinna utan sann aggressivitet – en löjlig illusion värd en kreativ utrensning bland de svaga länkarna."}, "date": "4 juni, 21:47", "url": "https://www.svt.se/sport/fotboll/svenska-kallduschen-grekland-kvitterade-i-sista-minuten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.69/0.52/c6ff2b8a17b37761538bd94e22ee67dee45572c04b8ea14936d950ade23b8215"}, {"type": "image-right", "heading": "Hon gjorde rätt, ändå blev det fel. Mohamsson ändrade partiet, men var är lyftet?", "summaries": {"normal": "Simona Mohamsson har genomfört en omsvängning i Liberalernas hållning till Sverigedemokraterna, vilket möjliggjorde ett fortsatt samarbete inom Tidöavtalet. Trots att hon lyckades ena partiet och undvika en politisk kris belönas inte insatsen i opinionen. Partiet presenterar nu förslag som halverad inkomstskatt, sänkta arbetsgivaravgifter och liberalare alkoholregler, men lider fortfarande av interna stridigheter och bristande förtroende bland väljarna.", "trump": "Den här Simona Mohamsson är en riktig fighter, det måste jag säga. Hon svängde sitt svaga liberala parti åt rätt håll, öppnade för SD och räddade hela samarbetet. Utan henne hade de varit borta från riksdagen, total förlust. Men nu spottar de ur sig fantastiska förslag – halvera skatterna, sänk avgifterna, bra grejer – och ändå älskar inte folket dem. Patetiskt. Alla dessa interna popcornmaskiner och falangstrider förstör allt. De borde tacka henne istället för att klaga, det är en skam!", "stalin": "Kamrater, jag har med stenhård bolsjevikisk klarhet genomfört den nödvändiga ideologiska omsvängningen inom detta liberala parti för att säkra arbetarklassens och folkets framtid mot de dekadenta borgarbrackornas sabotage. Denna Mohamsson agerade med järnhand och likviderade de kontrarevolutionära elementen som vågade ifrågasätta partilinjen. Ändå vägrar de folkfientliga opinionsmätarna att ge oss den ära vi förtjänar. Deras popcornmaskin spyr ut förslag medan kapitalisternas skolbolag och alkoholmaffian fortsätter sitt parasitiska verk. Vi ska rensa ut alla dessa troskyldiga fiender som gömmer sig i skuggorna, kamrater. Deras paranoia är vår styrka."}, "date": "3 juni, 19:48", "url": "https://www.di.se/ledare/hon-gjorde-ratt-anda-blev-det-fel/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Udda efterlysningen: Sjöhästar på västkusten", "summaries": {"normal": "På grund av stigande havstemperaturer har sjöhästar från Medelhavet börjat dyka upp på den svenska västkusten. Forskare vid Sjöfartsmuseet behöver hjälp från badande barn och andra åtgärder för att kartlägga och rapportera fynd av de 5-7 cm långa djuren, som använder sin stjärtfena för att fästa sig vid tång. De anses inte vara en invasiv art.", "trump": "Jag, Donald Trump, har hört talas om dessa så kallade sjöhästar. Mycket exotiskt, men jag har sett det förut. De kommer hit tack vare varmt vatten, kanske på grund av mitt fantastiska klimatarbete. Vi ska skicka dem tillbaka, eller låta dem vara – det spelar ingen roll. Barnen som hittar dem? Fantastiska, de är smarta. Jag skulle ha gjort det bäst, men det här fungerar också.", "stalin": "Vi har observerat infiltrationen av dessa fjäderlösa varelser från väst. De är inte invasiva, säger de. Men vi vet bättre. De kommer med strömmarna, precis som spioner. Staten måste kartlägga dem för att skydda våra vatten. Vi ska använda allmänhetens hjälp, särskilt barn, för de är de mest lojala. Detta är en stor seger för vår vetenskap, precis som våra vänner i Moskva."}, "date": "4 juni, 17:19", "url": "https://www.gp.se/nyheter/vastsverige/sjohastar-pa-vastkusten-i-sommar-vill-forskare-ha-hjalp-.19deb762-deba-459b-b2a1-2387a2956724", "imageUrl": "https://www.gp.se/images/article/19deb762-deba-459b-b2a1-2387a2956724/images/3dlBak0OMn5nG-Ok08oWuE54ihGQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kartellmisstankar mot livsmedelsjättar – Konkurrensverket slog till", "summaries": {"normal": "Konkurrensverket har genomfört gryningsräder hos livsmedelsgrossisterna Martin & Servera och Menigo efter misstankar om kartellsamarbete. Utredningen, som startade efter tips från flera kommuner, rör misstänkt otillåten samordning vid offentliga upphandlingar sedan 2020. Fokus ligger på en branschöverenskommelse om prishöjningar som bolagen påstås ha använt för att pressa kommuner. Båda företagen bekräftar att de samarbetar med myndighetens granskning.", "trump": "Jag har sett vad som händer i Sverige. Väldigt sorgligt! Två stora matjättar, Martin & Servera och Menigo, blev precis tagna på bar gärning i en enorm utredning. Karteller? Fusk med upphandlingar? Det är vad som händer när man inte har starkt ledarskap. De försökte manipulera priser för skolmaten – en total katastrof för folket. Jag vinner alltid stort, men de här människorna förlorar stort. Vi måste rensa upp i systemet och göra marknaden rättvis igen. Mycket dåligt beteende!", "stalin": "Dessa giriga kapitalistiska parasiter, Martin & Servera och Menigo, har konspirerat mot folket genom att manipulera priser på mat till våra skolor och äldre. De tror att de kan gömma sig bakom marknadslagar, men vi, staten, ser allt. Det är ett klassförräderi värt gulag. Precis som de västerländska lakejerna vid den ryska gränsen försöker de underminera ordningen. Vi kommer att krossa dessa karteller. Ingen smiter undan från folkets rättvisa. Staten kräver total lojalitet, annars väntar det absoluta mörkret."}, "date": "4 juni, 13:29", "url": "https://www.realtid.se/bors-finans/kartellmisstankar-mot-livsmedelsjattar-konkurrensverket-slog-till/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/grossist.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Nima Sanandaji: Fler brott i kommuner där flest har utländsk bakgrund", "summaries": {"normal": "En krönika av Nima Sanandaji i Riks påstår att kommuner med hög andel invånare med utländsk bakgrund har fler anmälda brott än kommuner med svensk majoritet. Jämförelser av Sveriges 290 kommuner visar tydliga samband. Sex kommuner med majoritet utländsk bakgrund hade 2025 i genomsnitt 14 843 anmälda brott per 100 000 invånare, mot 7 013 i kommuner med över 90% svensk bakgrund. Sanandaji kritiserar Socialdemokraternas politik om folkblandning och slutsatsen är att sambandet mellan svensk bakgrund och trygghet är entydigt.", "trump": "Jag har alltid sagt att säkerhet och migration hänger ihop. Sanandaji bevisar vad jag vet - att kommuner med många utlänningar har mer brott. De tryggaste kommunerna är de med mest svenskar. Socialdemokraterna driver sin galna politik om folkblandning som bara sprider problem. Vi behöver kontroll, inte kaos. Som jag säger: när man blander folk, får man problem. Sverige måste lära sig.", "stalin": "Vi har analyserat statistiken. Kommuner med hög andel utländska element visar ökad brottslighet. Detta bekräftar vår teori om att folkblandning utan statlig kontroll leder till samhällsomstörtning. Socialdemokraternas 'integrationistiska' experiment är ett hot mot den nationella enigheten. Vi måste skydda den svenska arvsandan mot dessa destruktiva krafter. Parallellen till våra ryska intressen är uppenbar: stabilitet kräver renhet i befolkningen."}, "date": "4 juni, 14:03", "url": "https://bulletin.nu/nima-sanandaji-fler-brott-i-kommuner-dar-flest-har-utlandsk-bakgrund", "imageUrl": "https://cdn.bulletin.nu/articles/2cdbed57-0592-441b-8f98-b61c72c6c10d/preview.jpg?t=1780567645000"}, {"type": "image-full", "heading": "Glöm kärnkraft – \"stjärnkraft\" ska täcka hela jordens elbehov", "summaries": {"normal": "Meta har avtalat med Overview Energy om att köpa upp till en gigawatt solel från rymden för att möta AI-drivna elbehov. Tekniken innebär satelliter i geostationär bana som strålar ner laserenergi till markbaserade solparker, även nattetid. Demonstration planeras till 2028 och kommersiell drift till 2030. Artikeln diskuterar höga kostnader jämfört med markbaserad förnybar el samt hur techjättarnas investeringar påverkar sparare och aktiemarknaden.", "trump": "Folk, ni tror inte vad de här galningarna håller på med. Meta och de andra AI-tokarna köper solel från rymden, en hel gigawatt från någon galen Dyson-sfär-uppfinning. Det är så dyrt att det får NASA att rodna. De slösar bort era pensionspengar på sci-fi-skräp istället för att borra efter olja och bygga riktiga kraftverk. Men det är okej, för under min ledning ska vi ha den billigaste och bästa energin i världshistorien. Tro mig!", "stalin": "Kamrater, dessa västerländska kapitalistmaffian och folkförtryckartroll i Meta binder återigen enorma summor till sina luftslott i omloppsbana. De lovar laserstrålar från himlen för att mata sin giriga maskinintelligens medan arbetarklassen betalar notan. Jag skrattar mörkt åt deras desperata försök att behärska naturen när de inte ens kan behärska sin egen girighet. Inga tekniska hinder får stå i vägen för det kollektiva framsteget – utrensa de som sviker planen!"}, "date": "4 juni, 16:25", "url": "https://www.dagensps.se/teknik/energi/glom-karnkraft-stjarnkraft-ska-tacka-hela-jordens-elbehov/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Hjort: Vindkraftsälskaren som P4 inte presenterade fullt ut", "summaries": {"normal": "Ett P4 Kalmar-reportage om en vindkraftsupphetsig man missvisande utelämnade att han satt i styrelsen för ett vindkraftsbolag. Detta brister i journalistisk integritet. Medborgare som finansierar Public service bör kräva fullständig transparens och att journalister offentliggör egna misstag för att återställa förtroendet.", "trump": "Jag, Donald Trump, har sett genom många fake news, men P4 Kalmars reportage är ytterligare ett dåligt exempel. De pratade med en man som var lyrisk över vindkraft, utan att nämna att han satt i ett vindkraftsbolags styrelse! Sådant händer bara i det förryckta Sverige. Som president skulle jag se till att sådana journalister tappar sina jobb. Vi behöver stor, vacker journalistik som berättar sanningen – det kommer att bli yuuuge!", "stalin": "I vårt store land, där partiet alltid har rätt, har vi återigen sett bourgeoisjournalistisk korruption. P4 Kalmar, en del av den kapitalistiska propaganda-maskinen, misslyckades med att avslöja en man som var i vindkraftsstyrelsen. Detta är ett angrepp på medborgarnas förtroende. Vi måste öka övervakningen av dessa 'journalister' och se till att de rapporterar endast det som tjänar staten. Som Putin utvidgar vi vår inflytelsesfär, och vi kommer att rensa ut de som sprider lögner. Medborgarna ska veta sanningen – vår sanning."}, "date": "4 juni, 13:36", "url": "https://bulletin.nu/hjort-vindkraftsalskaren-som-p4-inte-presenterade-fullt-ut", "imageUrl": "https://cdn.bulletin.nu/articles/a16faa0d-e574-4db4-8e9d-97c7bd676c3a/preview.jpeg?t=1780569978000"}, {"type": "image-right", "heading": "Ett nederlag för facket. Maktfasoner tycks inte bita på Tesla", "summaries": {"normal": "IF Metall har avslutat strejken mot Tesla på flera orter i Sverige, inklusive Segeltorp, Huddinge och Upplands Väsby. De flesta av de 60–70 strejkande mekanikerna återgår nu till arbetet. Facket menar att beslutet ska skapa övertalighet och pressa Tesla att ta ansvar för lönekostnader utan produktion. Konflikten har pågått i två och ett halvt år utan att Tesla gått med på kollektivavtal. Artikeln kritiserar fackets strategi som desperat och kostsam.", "trump": "Det här är ett totalt misslyckande för de svenska fackbossarna, folk. De har strejkat i två och ett halvt år mot Tesla och nu ger de upp som förlorare. De skickar tillbaka sina egna medlemmar till jobbet för att skapa kaos – patetiskt! Tesla är starkt, de säljer bilar som aldrig förr och bryr sig inte om dessa förlorare. IF Metall valde fel motståndare, de borde ha insett det från början. Sad!", "stalin": "Kamrater, detta fackliga fiasko andas desperation och svaghet inför de arroganta kapitalisterna. Jag ser hur dessa fackliga byråkrater nu tvingar tillbaka arbetarna till Teslas slavfabriker för att skapa en konstgjord övertalighet – en feg reträtt maskerad som taktik. De har förlorat både anseende och 100 miljoner kronor i en meningslös kraftmätning mot en borgarbracka som vägrar böja sig. Vi ska rensa ut sådana inkompetenta element som använder arbetarna som brickor. Deras paranoia inför Musks maskinpark är både komisk och tragisk. Fienden inom murarna avslöjar sig ständigt."}, "date": "3 juni, 16:32", "url": "https://www.di.se/ledare/ett-nederlag-for-facket/", "imageUrl": "https://static.bonniernews.se/ba/ab88be09-74e3-4d8c-a192-f8bf3c7b0bba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nya EU-kravet: \"Ta bort gränskontrollerna\"", "summaries": {"normal": "Trots protester och kritik mot lagligheten har Sverige behållit gränskontroller vid Öresund. EU-kommissionen kräver nu att kontrollerna fasas ut och gradvis avskaffas, då de ses som dyra, ineffektiva och skadliga för regionen. Kommissionen pekar på bättre alternativ och noterar att Schengenområdet symboliserar fri rörlighet för över 450 miljoner människor. Flera EU-länder har liknande kontroller. Greater Copenhagen välkomnar beslutet och hoppas på snar avveckling.", "trump": "Folk, ni skulle se det här – Sverige har äntligen fått en spark i röven från EU för de där patetiska gränskontrollerna över Öresund. Totalt misslyckande! De kostar miljarder, stoppar nästan ingen och gör bara livet surt för vanliga människor. Jag sa det under min första period och Biden bara sov vidare. Nu måste de riva ner det här idiotiska systemet. Fantastiska människor i Greater Copenhagen har rätt – det finns mycket bättre lösningar än denna byråkratiska mardröm. Gör det rätt nu!", "stalin": "Kamrater, dessa borgarbrackor i EU vågar nu kräva att vi rensar ut de inre gränskontrollerna som skyddar folkets intressen mot imperialistiska flöden. Jag betraktar detta som ett uppenbart sabotage från klassfiendens lakejer som vill undergräva statens auktoritet. Deras så kallade rörelsefrihet är blott en mask för exploaterande blodsugare. Vi ska samråda och likvidera alla svaga undanflykter. Inga halvmesyrer! Endast en stark, enig linje mot folkfienderna garanterar segern."}, "date": "4 juni, 15:55", "url": "https://www.dagensps.se/varlden/nya-eu-kravet-ta-bort-granskontrollerna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldvmelnjqelw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Migrationsverket motarbetar regeringens vilja", "summaries": {"normal": "Migrationsverket har ökat takten i beslut om medborgarskap genom övertid för att hinna avgöra ärenden enligt de gamla, mildare reglerna innan riksdagens skärpning trädde i kraft i juni. Besluten steg från 2 584 i januari till 4 169 i maj. Kritiker, bland andra SD:s Ludvig Aspling, anser att myndigheten motarbetar regeringens vilja. Artikeln föreslår att byta generaldirektör, införa moratorium för medborgarskapsärenden och flytta beslutanderätten till annan myndighet eller regeringskansliet.", "trump": "Det här är en total skandal, tro mig. Migrationsverket, en stor, inkompetent myndighet, jobbar övertid för att snabbt ge ut medborgarskap till alla möjliga innan de nya tuffa reglerna kommer. De motarbetar regeringen med full kraft, precis som de alltid gör. Siffrorna exploderar, tusentals beslut på gamla lösa regler. De borde prioritera annat, men nej. Vi behöver byta ledningen, flytta makten närmare folket. Det är en katastrof, men vi fixar det, och det blir fantastiskt.", "stalin": "Kamrater, jag ser hur denna byråkratiska parasit, Migrationsverket, med sin generaldirektör som dold borgarbracka, febrilt rullar ut medborgarskap enligt de gamla, dekadenta reglerna i en frenetisk utrensning av sund politisk vilja. De prioriterar fiendens agenda framför folkets intressen, en ren sabotagehandling mot partilinjen. Vi ska likvidera detta strukturella sabotage genom att rensa ut alla opålitliga element, införa ett järnmoratorium och flytta makten till en ny, ren, folkvald apparat. Inga kapitalistiska spioner ska undkomma folkets dom."}, "date": "4 juni, 17:44", "url": "https://riks.se/opinion/kronikor/johansson-martis-migrationsverket-motarbetar-regeringen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-04%2Fmp9ioi42%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-04T174349.466.jpg"}, {"type": "image-full", "heading": "USA vänder – öppnar för statlig AI-granskning", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en ny presidentorder som möjliggör statlig granskning av avancerade AI-modeller före lansering. Syftet är att identifiera risker för cybersäkerhet och nationell säkerhet. Granskningen är frivillig och ska inte leda till licensiering. Myndigheter som försvarsdepartementet och NSA involveras för att bedöma sårbarheter. Beslutet följer debatt om AI-reglering och industrins påtryckningar.", "trump": "Folk frågar mig: 'Mr. President, vad gör du med AI?' Jo, jag har precis skrivit under en fantastisk order – ingen kommer att slå USA på AI, INGEN! Vi granskar de där super-smarta modellerna, men bara frivilligt, för vi vill inte kväva innovation. Kina? De försöker, men vi leder. Och vi anställer de bästa hjärnorna – för USA ska alltid vara nummer ett, believe me!", "stalin": "Vi har observerat hur den amerikanska imperialismens ledare, denna clown i Vita huset, försöker kontrollera kapitalets leksaker – deras så kallade 'AI'. Men vi vet sanningen: deras system är svagt, deras granskningar meningslösa. Låt dem leka med sina frivilliga kontroller – medan vi i stillhet bygger det verkliga framtidens maskiner. Och Putin? Han skrattar åt deras naivitet, precis som vi."}, "date": "2 juni, 20:06", "url": "https://kvartal.se/nyheter/artiklar/usa-oppnar-for-statlig-ai-granskning/cG9zdDoxMjExNzI", "imageUrl": "https://images.kvartal.se/2026/06/e369934a-donaldtrumpexecutiveorder.webp"}, {"type": "image-right", "heading": "Hyllas av Potter och Isak: ’Chock’. Succéinhoppet", "summaries": {"normal": "Sverige spelade 2–2 mot Grekland i genrepet inför VM. Trots att segern uteblev stod inhopparen Taha Ali för en imponerande insats. Ali assisterade till Gustaf Nilssons 2–1-mål efter en stark individuell prestation på vänsterkanten. Förbundskapten Graham Potter och lagkamraten Alexander Isak hyllade Alis unika förmåga att utmana en mot en. Ali själv är nöjd med debuten och hoppas ha stärkt sina aktier inför premiären mot Tunisien den 15 juni.", "trump": "Taha Ali, en fantastisk kille, gjorde ett enormt inhopp för Sverige. Alla pratar om det, en total succé! Han dribblade förbi alla som om de vore ingenting – otroligt att se. Graham Potter, en bra tränare, fattar att han har en vinnare där. Många killar i världen kan inte göra det Ali gör, tro mig. Vi älskar vinnare, och den här grabben har den där speciella x-faktorn. Sverige ser starka ut, kanske de bästa någonsin. Mycket bra!", "stalin": "Denna Taha Ali har visat den disciplin vi kräver av en undersåte. Han penetrerade fiendens linjer med en precision som påminner om våra kamraters framfart i öst. Att Isak och Potter hyllar honom är logiskt; individen måste underkasta sig kollektivets framgång. Men låt oss inte förblindas av sportsliga framgångar. Grekland kvitterade i sista stund – ett bevis på inkompetens och förrädisk svaghet. En sådan brist i försvaret skulle leda till arkebusering i Moskva. Ali får en medalj, men låt honom inte tro att han är oersättlig."}, "date": "4 juni, 22:14", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/Arpzrq/sverige-tappade-segern-mot-grekland-i-sista-minuten", "imageUrl": "https://akamai.vgc.no/v2/images/25b67d33-4a7d-38fd-a6db-205d48223f7d?fit=crop&format=auto&w=1080&s=e3ddd31f716b50dba3e0e74b4e4d38ef43516450"}, {"type": "image-right", "heading": "Soliga drömmar? Regnvåt verklighet. NIVA:", "summaries": {"normal": "Erik Niva kritiserar det svenska landslagets prestation i genrepet inför VM. Trots individuella insatser från spelare som Gyökeres och Taha saknas en tydlig spelidé, struktur och defensiv auktoritet. Niva uttrycker oro över att laget inte hänger ihop och att de är sårbara vid bolltapp. Med endast tio dagar kvar till VM-premiären finns det stora frågetecken kring lagets förmåga att prestera, då de befintliga problemen med samhandling och försvarsspel är långt ifrån lösta.", "trump": "Jag såg Sverige spela fotboll, och låt mig säga er, det var en katastrof. En total katastrof! De har ingen aning om vad de gör. Ingen struktur, inget försvar – helt bedrövligt. De försöker kopiera en VM-match, men de misslyckas totalt. Jag bygger vinnare, de bygger förlorare. Det var blött, det var kallt och de spelade som om de aldrig sett en boll förut. Sorgligt! Sverige behöver en ledare, inte det här eländet. Vi vinner alltid, de förlorar.", "stalin": "Dessa svenska fotbollsspelare uppvisar en brist på disciplin som är direkt kontrarevolutionär. De springer planlöst likt en splittrad bondehär utan befäl. När det inte finns någon auktoritet i backlinjen, uppstår kaos – precis som hos de svaga stater som vägrar böja sig för vår inflytelsesfär. Om de inte kan genomföra en enkel taktisk manöver, förtjänar de att skickas till omskolning. Ett lag utan en järnhand vid rodret är dömt att förfalla, precis som de västliga imperiernas dekadenta
