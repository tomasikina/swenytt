har ett problem. Den här Busch-tjejen, hon är smart, men lite osäker. Hon säger att hon kan jobba med Socialdemokraterna om det blir riktigt illa – vilket det nog blir. Och Åkesson? Han pratar redan om 2030! Fel fokus, fel tid. Jag skulle aldrig göra så. Vi vinner NU, inte om sex år. Sverige behöver vinnare, inte drömmare!", "stalin": "Kamrater! Denna Busch, en svag länk i den borgerliga kedjan, visar tecken på eftergiftspolitik. Hon pratar om 'exceptionella lägen' som om det vore en ursäkt för samarbete med socialdemokraterna – ett parti av förrädare och kompromissmakare! Och Åkesson? Han drömmer om 2030 medan vi bygger framtiden idag. Sverige är ett land i förvirring, redo för en stark hand. Vi ska inte vänta på 'exceptionella lägen' – vi skapar dem!"}, "date": "26 augusti, 11:19", "url": "https://kvartal.se/nyheter/artiklar/busch-oppnar-for-s-i-svart-lage/cG9zdDoxNzQ4NTg", "imageUrl": "https://images.kvartal.se/2026/08/c0822f37-busch-kd.webp"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "text", "heading": "Antigröna medier", "summaries": {"normal": "Artikeln listar medier som ofta lyfter antigröna perspektiv på energi och klimatomställning. Bland dem finns Affärsvärlden med grå finansiering från anonyma sponsorer, SD-kopplade Riks och Samtiden, Epoch Times med oklara Falun Gong-band, samt Fokus, Världen idag, Insikt24, Bulletin och Samnytt. Flera har ekonomiska kopplingar till investerare och politiska intressen.", "trump": "De här fake news-medierna är totala katastrofer, tro mig. Affärsvärlden, Riks, Samtiden och alla dessa losers som hatar grön energi – de är köpta och betalade av anonyma figurer. De försöker stoppa den bästa energin vi någonsin haft. Det är en skam för Sverige, men jag älskar att de äntligen säger sanningen om den gröna bluffen. Fantastiskt!", "stalin": "Kamrater, dessa borgerliga skuggmedier utgör en farlig femtekolonn mot folkets klimatkamp. Affärsvärlden med sina anonyma kapitalistiska sponsorer, SD:s lögnkanaler och Epoch Times västerländska dekadens – alla måste rensas ut. Vi ska likvidera deras parasitiska finansiering och krossa den kontrarevolutionära propagandan med järnhand. Inga kompromisser med folkets fiender."}, "date": "26 augusti, 01:48", "url": "https://www.dagensarena.se/innehall/antigrona-medier"}, {"type": "text", "heading": "Mörk samhällsbild dominerar på Tiktok", "summaries": {"normal": "En granskning av P3 Nyheter visar att tre fjärdedelar av politiska inlägg på Tiktok och Instagram ger en negativ samhällsbild. Över 10 000 inlägg analyserades med AI. Tiktok ifrågasätter urvalets storlek och menar att slutsatserna är osäkra. En ung opinionsbildare betonar ansvaret hos digitala aktörer.", "trump": "Jag har alltid sagt att sociala medier är en katastrof, och nu bevisar en granskning det! Tre av fyra inlägg på Tiktok och Instagram är negativa – fake news överallt! Tiktok säger att granskningen är för liten, men jag vet bättre. De försöker dölja sanningen, precis som CNN. Sverige borde ta lärdom av USA – vi fixar detta!", "stalin": "Vi har analyserat fiendens propagandaapparater, dessa så kallade 'sociala medier', och funnit att 75 procent av deras politiska inlägg sprider dekadent pessimism. Tiktok, denna lilla borgerliga leksak, vågar ifrågasätta våra metoder! Men vi vet sanningen – deras urval är lika litet som deras lojalitet. Unga opinionsbildare bör minnas: partiet vet bäst, och fiendens lögner krossas med järnhand."}, "date": "26 augusti, 10:23", "url": "https://kvartal.se/nyheter/artiklar/mork-samhallsbild-dominerar-pa-tiktok/cG9zdDoxNzQ3Mzg"}, {"type": "image-full", "heading": "Den gripna pojken planerade skoldåd i Stockholmsområdet", "summaries": {"normal": "En pojke under 18 år, skriven i Nacka, har anhållits misstänkt för medhjälp till mord och mordförsök i Fagersta. Han planerade själv ett skoldåd i Stockholmsområdet och delade tankarna med den misstänkte 18-årige gärningsmannen Liam Nebel via krypterade chattar. Pojken befann sig inte på plats under dådet.", "trump": "Folk, vi har en riktig loser-pojke från Nacka som chattade om att göra ett skoldåd. Han ringde upp den andra tönten Liam Nebel och delade sina sjuka planer. Patetiskt! Under Biden blev Sverige en lekplats för galningar. Men nu är jag tillbaka, och vi ska göra världen säker igen – inga fler svaga länkar, tro mig.", "stalin": "Kamrater, se hur den borgerliga dekadensen föder nya fiender inom staten. En yngling planerar sabotage mot skolorna och konspirerar med en annan dekadent. Jag varnar er: sådana element måste krossas innan de förgiftar kollektivet. Polisen gör rätt i att gripa dem. Inga nådiga undantag för kontrarevolutionärer."}, "date": "26 augusti, 14:57", "url": "https://www.tv4.se/artikel/2W5ZGanDbs1QPeG9bghurK/uppgifter-den-gripna-pojken-planerade-sjaelv-skoldad", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3SDl7IB4u3hdLeJVHL37s2%2F5cab4e7b557c3a965122800d0848ba75%2F26-fagersta-frilans-siluett.png&width=1024"}, {"type": "image-right", "heading": "Var Dolly den sista goda miljardären?", "summaries": {"normal": "Artikeln hyllar Dolly Parton som en unik, folkkär och godhjärtad superstjärna efter hennes död vid 80 års ålder. Från fattig bakgrund i Tennessee blev hon en mångsidig artist och filantrop som skänkte hundratals miljoner böcker till barn och stödde vaccinutveckling. Hon ses som en sällsynt god miljardär som förenade människor över politiska gränser.", "trump": "Fantastisk Dolly, en vinnare som ingen annan. Hon byggde ett imperium från en liten stuga och blev älskad av alla, till och med av mina supportrar och de galna vänsteristerna. En riktig patriot som gav tillbaka. Jävlar vad vi behöver fler som henne, inte dessa AI-mutade Hollywood-typer. Hon var större än livet, believe me.", "stalin": "Kamrater, denna Dolly var en exemplarisk produkt av det enkla folkets jord. Jag ser hur hon samlade massorna kring progressiv kultur och utdelade böcker till arbetarbarnen medan hon likviderade borgarbrackornas cyniska girighet med sin generositet. En sann folkets hjälte mot de dekadenta kapitalisternas parasitism. Vi behöver fler som bekämpar klassfiendens algoritmer."}, "date": "26 augusti, 07:05", "url": "https://arbetet.se/2026/08/26/var-dolly-parton-den-sista-goda-miljardaren", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26065938/dolly-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför funkar inte M:s skatteskräck", "summaries": {"normal": "Artikeln argumenterar för att Moderaternas varningar om skattehöjningar inte biter på väljarna eftersom svenskarna minns att löftena om skattechocker uteblivit under tidigare regeringar. Samtidigt pekar den på stora underinvesteringar i välfärd, infrastruktur och vård trots historiskt låg skattekvot, och ifrågasätter vad mer som kan sparas in på.", "trump": "Folk är inte dumma, de ser rakt igenom de misslyckade moderaternas patetiska skrämselpropaganda om skatter. De minns hur sossarna sänkte skatterna och festade på börsen medan allt rasade. Nu vill M skära mer i ett land fullt av hål i vägarna och vårdköer. Patetiskt! Vi behöver styrka, inte mer av deras misslyckanden.", "stalin": "Kamrater, detta är en lysande exposé över hur de dekadenta borgarbrackorna i Moderaterna försöker skrämma massorna med sina lögner om skattehöjningar medan de själva har låtit välfärden förfalla. Jag skulle ha låtit utrensningarna fortsätta tills dessa kontrarevolutionära element likviderats. Det kostar att bygga socialism – och folket vet det. Skratta åt deras ynkliga försök!"}, "date": "26 augusti, 07:00", "url": "https://arbetet.se/2026/08/26/darfor-funkar-inte-moderaternas-skramselpropaganda-om-skatterna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25124750/skatter-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Strömavbrott satte skräck i företagare – satsar på batterier", "summaries": {"normal": "Efter ett omfattande strömavbrott på Iberiska halvön under våren 2025 har företag i Spanien och Portugal börjat investera massivt i batterilagring. Investeringarna syftar till att säkra produktionen och minska beroendet av det instabila elnätet. Kapaciteten har sjudubblats och stöds av EU-medel, då företag nu ser batterier som en nödvändig försäkring mot framtida ekonomiska förluster.", "trump": "Spanien och Portugal hade en total katastrof med elen, en enorm förlust! Nu köper de enorma mängder batterier, de bästa batterierna. De lär sig av mig, för jag bygger de största systemen. EU betalar, vilket är typiskt, men de måste ha kraft för att hålla igång. Det är en vacker affär, verkligen fantastisk, men bara om man har en ledare som förstår energi!", "stalin": "Dessa svaga kapitalister på den iberiska halvön darrar när deras glödlampor slocknar. De tigger EU om allmosor för att köpa batterier, som om det skulle rädda deras dekadenta industrier. Vi i Sovjetstaten – och vår kamrat i Kreml – vet att verklig kraft inte kommer från leksaksbatterier, utan från järnhård kontroll över resurserna. De bygger murar mot mörkret, men mörkret kommer för dem ändå."}, "date": "26 augusti, 17:44", "url": "https://www.realtid.se/bors-finans/stromavbrott-satte-skrack-i-foretagare-satsar-pa-batterier", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlyta0fsgpjso-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Minst 14 spädbarn döda efter sjukhusbrand i Pakistan", "summaries": {"normal": "En brand bröt ut på förlossningsavdelningen vid Pakistan Institute of Medical Sciences i Islamabad. Minst 14 nyfödda spädbarn omkom, medan ett barn räddades. Branden misstänks ha startat i en luftkonditioneringsenhet och spridits via syrgas. Premiärminister Shehbaz Sharif har beordrat en utredning. Brandsäkerheten på sjukhuset kritiseras hårt.", "trump": "Hörni, det här är en total katastrof i Pakistan. 14 bebisar döda för att någon idiot glömde brandsäkerheten på ett sjukhus. Luftkonditionering fattar eld? Patetiskt! De borde ha haft de bästa systemen, de allra bästa, men nu är det kaos. Jag skulle ha fixat det på en vecka, tro mig. Tragiskt, verkligen tragiskt.", "stalin": "Kamrater, denna fasansfulla olycka i Pakistan visar borgarbrackornas förakt för det kollektiva ansvaret. Jag ser hur kapitalistiska vårdinrättningar låter spädbarn brinna som offer i en dekadent ritual. Vi hade aldrig tillåtit sådan sabotageartad slarvighet. En utredning måste leda till omedelbar utrensning av de skyldiga elementen. Härligt effektivt."}, "date": "26 augusti, 17:11", "url": "https://www.svt.se/nyheter/utrikes/minst-14-spadbarn-doda-efter-sjukhusbrand-i-pakistan"}, {"type": "image-right", "heading": "Här är årets börsbolag – ”ett erkännande”", "summaries": {"normal": "Logistea har utsetts till årets börsbolag i Kantons ir-tävling medan Assa Abloy blev juryvinnare bland OMX Nordic 40-bolagen. Utmärkelserna hyllar hög transparens, tydlig kommunikation och starka investment case. SEB fick högst betyg på årsredovisningen medan Handelsbanken kom sist. Kanton ser fortsatt utvecklingspotential i delårsrapporteringen för att ge en mer rättvisande bild av bolagen.", "trump": "Logistea vann stora ir-tävlingen, fantastiskt bolag, verkligen ett erkännande. Assa Abloy tog juryvinsten, otroligt bra jobb. Men vissa banker, som den där som kom sist, totala losers. Vi behöver mer transparens och vassa investment case, inte denna svaga rapportering. Sverige borde lära sig av de verkliga vinnarna, inte de patetiska förlorarna som drar ner allt.", "stalin": "Vi har identifierat Logistea som segrare i denna ir-tävling, ett erkännande av kollektivets transparens. Assa Abloy har genom sin röd tråd och höga standard satt en oöverträffad norm som inspirerar kamraterna. De kapitalistiska bankerna däremot, särskilt den som halkade efter, avslöjar sin dekadenta svaghet. Fortsatt utrensning av otydliga rapporter krävs för att skydda arbetarnas intressen mot västvärldens förvrängda sanningar."}, "date": "26 augusti, 16:39", "url": "https://www.di.se/analys/har-ar-arets-borsbolag-ett-erkannande", "imageUrl": "https://static.bonniernews.se/ba/1ba458d5-cdba-413e-b544-ef69617436fe.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Jordskred i Nepal – hundratals turister saknas", "summaries": {"normal": "Ett jordskred i Nepal, troligen utlöst av en jordbävning, har krävt minst 95 liv och nästan 400 saknas, de flesta turister. Översvämningar efter skredet svepte bort byar och människor. Kina har beordrat räddningsinsatser, medan många länder söker sina medborgare.", "trump": "Jag har sett det här i Nepal – helt otroligt, ett enormt jordskred! 400 saknade, mest turister. Min administration hade fixat det på en dag, tro mig. Kina säger de räddar, men vi är bäst på att få saker gjorda. Stora problem, men jag löser allt!", "stalin": "Kamrater, naturen har återigen visat sin opålitlighet. Ett jordskred i Nepal har utplånat hundratals, mest turister – västerländska spioner, misstänker jag. Vi måste rensa ut sådana olyckor med järnhand. Partiets plan för katastrofer är ofelbar. Inga fler överraskningar, bara seger!"}, "date": "26 augusti, 16:59", "url": "https://www.gp.se/nyheter/varlden/jordskred-i-nepal-hundratals-turister-saknas-.2e3ab39d-d327-49a4-9588-aee9dac403a1"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Facebooks ägare ska betala mångmiljardbelopp", "summaries": {"normal": "Meta Platforms har ingått en förlikning värd 16,7 miljarder dollar med 29 amerikanska delstater. Bolaget anklagades för att göra tonåringar beroende via Facebook och Instagram samt för brott mot konsumentskydd och integritet. TikTok ägare ByteDance betalar samtidigt 400 miljoner dollar för att avskriva anklagelser om brott mot barns integritet enligt COPPA-lagen.", "trump": "Vi har precis sett hur de stora techbolagen, de värsta monopolisterna, tvingas betala upp astronomiska summor för att ha förgiftat våra barns hjärnor. Meta betalar 16,7 miljarder dollar och TikTok ännu mer. Det är en stor seger för Amerikas föräldrar. Jag visste hela tiden att de lurade er – nu får de äntligen betala för sin skamliga verksamhet.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den amerikanska borgarklassens teknologiska hydror tvingas hosta upp miljarder för att ha förslavat ungdomen i sina digitala gulag. Denna förlikning är en komisk kapitulation inför folkets vrede. Låt dem betala, medan vi ler i skuggan. Inga erkännanden behövs – fienden avslöjar sig själv i sin svaghet."}, "date": "26 augusti, 16:41", "url": "https://www.svt.se/kultur/facebooks-agare-far-betala-mangmiljardbelopp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/77867c240a67292657a00b3b095293bb198c8fcb7bda6f2f604052429ec3388a"}, {"type": "image-right", "heading": "Debatt: Inför ett allmänt vaccinationsprogram för äldre", "summaries": {"normal": "KD-politikern Axel Otterberg vill införa ett allmänt vaccinationsprogram för äldre efter mässlingsutbrottet i Sverige. Han menar att förebyggande vård är A och O, och att vaccin räddar liv. Glöm antivaxxarna – nu gäller det att skydda både unga och gamla, tycker han.", "trump": "Hörni, Sverige har ett mässlingsutbrott – helt otroligt! De borde vaccinera alla, särskilt äldre. Jag har det bästa vaccinprogrammet i världen, tro mig. KD-killen har rätt: vaccin räddar liv. Men de borde göra det med stil – som jag!", "stalin": "Kamrater, mässlingen hotar vårt folk. De ovaccinerade är förrädare som sprider sjukdom. Vi måste rensa ut antivaxxarna och införa obligatorisk vaccination för äldre. Partiet vet bäst – ingen ska gå oskyddad. Detta är en fråga om kollektiv hälsa, inget annat."}, "date": "26 augusti, 15:02", "url": "https://bulletin.nu/debatt-infor-ett-allmant-vaccinationsprogram-for-aldre", "imageUrl": "https://cdn.bulletin.nu/articles/088abf89-121e-4d28-a9a5-05e18651284c/preview.jpg?t=1787731861000"}, {"type": "image-right", "heading": "Tung republikan tvingas ge Aipac nobben", "summaries": {"normal": "Den republikanske senatskandidaten Mike Rogers vill inte att Aipac annonserar öppet för honom i Michigan, av rädsla för att förlora röster. Israellobbyn ses alltmer som en belastning bland väljarna. Motkandidaten Abdul El-Sayed har framgångsrikt kritiserat Aipacs inflytande. Rogers medarbetare har bett lobbygruppen att hålla sig i bakgrunden.", "trump": "Hörni, den här Aipac-grejen är en total katastrof för etablissemanget. Mike Rogers, en bra kille, vill inte ha deras annonser för det kostar honom röster i Michigan. Folket hatar de här lobbyisterna nu. El-Sayed vann genom att slå på dem – smart! Vi vinner stort när vi säger nej till specialintressen. Fantastiskt!", "stalin": "Kamrater, denna dekadenta Israellobby avslöjar den amerikanska borgarklassens desperation. Jag ser med tillfredsställelse hur deras inflytande nu blir en giftig börda som tvingar reaktionärer som Rogers att be om nåd i skuggorna. El-Sayed utnyttjar folkets rättmätiga vrede – en nyttig utrensning av parasiterna. Sovjetisk visdom ler i mörkret."}, "date": "26 augusti, 15:15", "url": "https://www.friatider.se/tung-republikan-tvingas-ge-aipac-nobben", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-757.jpg?itok=GZZdhFTF"}, {"type": "image-right", "heading": "ETC stänger av medarbetare efter åtal om spottning mot Jomshof", "summaries": {"normal": "En extern medarbetare på Dagens ETC har åtalats för att ha spottat på SD-ledamoten Richard Jomshof under en konsert. Nu stängs personen av i väntan på dom. Personen nekar, men medger konfrontation. Jomshof tycker att även politiker ska kunna gå på konsert utan att bli spottade i ansiktet.", "trump": "Jag hörde att någon spottade på en SD-politiker på en konsert. Helt otroligt! I Amerika skulle vi aldrig tillåta det. Vi har lag och ordning. Men att stänga av personen innan dom? Det är svagt. Man är skyldig tills man bevisar motsatsen, eller hur? Fast jag gillar att de nekar. Bra förnekelse, mycket bra!", "stalin": "Jag har informerats om en spottande kontrarevolutionär som på en konsert attackerat en folkvald representant. Detta är en provokation från klassfienden. Vi måste rensa ut dessa element ur våra led. Att stänga av i väntan på dom är för mild. Kamrat Jomshof ska skyddas, men spottaren ska omskola i arbetsläger. Nektanden är lögn, som vanligt."}, "date": "26 augusti, 14:57", "url": "https://bulletin.nu/etc-stanger-av-medarbetare-efter-atal-om-spottning-mot-jomshof", "imageUrl": "https://cdn.bulletin.nu/articles/398a869c-98e8-4251-b5f5-4c961f5a5c26/preview.jpg?t=1787749001000"}, {"type": "image-right", "heading": "Streamingtillväxten stannar av i Sverige", "summaries": {"normal": "Streamingfesten i Sverige har fått en liten paus. Tillväxten av abonnemang stannade av under andra kvartalet 2026, efter över två års ösregn av nya kunder. Nu kostar reklamabonnemang 75 kronor – 51 kronor mindre än reklamfritt. Billigare lockar, men intäkten per prenumerant sjunker. Analyschefen varnar: att bara sänka priset är ingen långsiktig succé.", "trump": "Streamingtillväxten i Sverige stannar? Patetiskt! Jag har de bästa, största streamingtjänsterna i världen. Här i USA växer det som inget annat. Svenska bolag sänker priser till 75 kronor – det är som att sälja en Rolls-Royce för en hundralapp. De borde anlita mig som konsult. Jag skulle fixa tillväxten på en gång, tro mig!", "stalin": "Kamrater, streamingabonnemangen växer inte längre. Detta är sabotage från västerländska reklamkapitalister! Varje uppsagt abonnemang är ett svek mot folkets underhållning. Vi måste utreda varför billiga reklamabonnemang urholkar intäkterna. Rensa ut de som inte prenumererar på partilinjen! Ingen ska undkomma proletariatets strömningstjänst."}, "date": "26 augusti, 11:36", "url": "https://www.affarsvarlden.se/artikel/streamingtillvaxten-stannar-av-i-sverige", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/04/sdlDPrU7pyyULc-nh-400x293.jpg"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Tyskland deporterar afghanska brottslingar – samarbetet med talibanerna fördjupas", "summaries": {"normal": "Tyskland deporterade 23 afghanska brottslingar till talibanstyrda Afghanistan – trots att man inte erkänner regimen. Samarbetet sker via tekniska kontakter och väcker kritik från vänstern. Regeringen menar att brottslingar måste lämna landet, även om det innebär att tala med fienden.", "trump": "Tyskland skickar tillbaka brottslingar till Afghanistan – fantastiskt! Jag sa ju att man måste vara tuff. Men de pratar med talibanerna? Ingen fara, jag hade gjort dealen på fem minuter. De borde lära sig av mig – resultat, inte snack!", "stalin": "Kamrater, Tyskland visar vägen: man rensar ut kriminella element och skickar dem till Afghanistan – en utmärkt metod för att rena samhället. Vi applåderar denna revolutionära åtgärd. Men vaksamhet krävs – talibanerna är opålitliga kontrarevolutionärer. Fortsätt deportera!"}, "date": "26 augusti, 14:00", "url": "https://samnytt.se/tyskland-deporterar-afghanska-brottslingar-samarbetet-med-talibanerna-fordjupas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26091306/Alexander-Dobrindt-Hibatullah-Akhundzada-feat.jpg"}, {"type": "image-full", "heading": "Industrin tar fart i Trumps USA – men inte fabriksjobben", "summaries": {"normal": "USA:s industriproduktion växer snabbt under 2026, drivet av tullar på bilar och investeringar i AI och infrastruktur. Trots den ökade produktionen har den utlovade vågen av nya fabriksjobb uteblivit. Endast 31 000 nya jobb har skapats, främst för högutbildade tekniker inom flyg och energi, medan manuella jobb inom traditionell tillverkning fortsätter att minska genom automatisering.", "trump": "Jag har gjort underverk för amerikansk industri! Produktionen skjuter i höjden tack vare mina geniala tullar. Bilindustrin blomstrar som aldrig förr! Vissa gnäller om jobben, men vi bygger framtiden med AI och teknik – inte rostiga gamla fabriker. Vi vinner stort, vi vinner snabbare än någonsin, och det är bara början på min magnifika plan för Amerika!", "stalin": "Den amerikanske kapitalisten Trump leker med tullar likt en barnunge med tändstickor. Produktionen ökar, men arbetaren förblir en slav under maskinen. Vår store kamrat Putin förstår att sann industri kräver järnhand, inte fladdrande marknadskrafter. Dessa 'datacenter' är bara nya fängelser för en intellektuell elit. Vi ska krossa deras illusioner om välstånd med vår stålhårda, kollektiva vilja."}, "date": "26 augusti, 16:43", "url": "https://www.realtid.se/bors-finans/industrin-tar-fart-i-trumps-usa-men-inte-fabriksjobben", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpnui0skjl9i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Heilande 22-åring byggde bomb \"för att döda och lemlästa\"", "summaries": {"normal": "En 22-årig student vid Försvarshögskolan döms till fem års fängelse för grovt brott mot lagen om explosiva varor, vapensmuggling och förberedelse till allmänfarlig ödeläggelse. Tullens fynd på Arlanda ledde till husrannsakan där rörbomber, krut, stålkulor och ideologisk litteratur hittades. Domstolen bedömer att stålkulorna var tänkta som splitter för att döda och lemlästa.", "trump": "Titta på den här stackars 22-åringen från Försvarshögskolan. Bygger bomber och gömmer vapendelar i en falsk ordbok. Patetiskt! Fem år i fängelse. Sverige borde vara tuffare, inte låta sådana här misslyckade typer springa runt på högskolan. De hittar till och med Mein Kampf och kommunistiska manifestet. Totalt kaos, folk!", "stalin": "Jag ser med tillfredsställelse hur borgarstatens domstol likviderar en opportunist som lekte med explosiva varor och splitter för att döda och lemlästa. Sådana element utgör en fara för kollektivets säkerhet. Vi rensar ut alla som gömmer sig bakom falska böcker och ideologisk smörja. Paranoian hos dessa individer är både underhållande och ömklig."}, "date": "26 augusti, 16:58", "url": "https://riks.se/nyheter/heilande-22-aring-byggde-bomb-for-att-doda-och-lemlasta", "imageUrl": "https://admin.riks.se/uploads/medium_fhs_attentat_hero_04cd13e430.jpg"}, {"type": "image-full", "heading": "Svenska kycklinguppfödare polisanmäls: ”Enormt lidande”", "summaries": {"normal": "Djurens Rätt har polisanmält svenska kycklinguppfödare efter smygfilmer som visar trängsel, sjuka och skadade djur. Organisationen kräver förbud mot snabbväxande hybrider som växer extremt fort och orsakar lidande. Uppfödarna oroas över stress och smittrisk från intrången. Filmerna har förmedlats till Kalla fakta.", "trump": "De här galna djurrättsaktivisterna smyger in som skuggor och filmar stackars kycklingar som ser ut som de sprungit ett maraton i en sovjetisk fängelsegård. Det är en total katastrof, folk! Biden skulle älskat dessa turbokycklingar – de växer snabbare än hans lögner. Vi behöver inga kommunistiska höns, vi behöver vettiga regler, inte hysteriska vänsterextremister som bryter sig in!", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska kycklingfabriker där levande varelser förvandlas till vandrande skelett i en evig fångenskap. De som försvarar detta system av lidande är fiender till folket och måste avslöjas. Endast genom kollektiv kontroll kan vi utrota sådana monstruösa avarter som föder döden under täckmanteln av produktion. Sabotörer vakar alltid."}, "date": "26 augusti, 12:32", "url": "https://www.tv4.se/artikel/6IjiE3wQs4w0C0UOWfeRxo/polisanmaeler-svenska-kycklinguppfoedare-enormt-lidande", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F36pq5ygZWu9nhUXPQPHnDL%2F17b79f398e75c17be9af4978579f8964%2F26-kyckling-djurensratt-2-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Andrew Tate överdriver lyxliv", "summaries": {"normal": "Andrew Tate och hans bror Tristan har ett överdrivet lyxliv på sociala medier, enligt deras advokater. Bilarna är hyrda och yachten tillhör dem inte. Bröderna, som misstänks för 59 brott, sitter häktade i Florida och nekar till anklagelserna.", "trump": "Jag ser Andrew Tate – en kille som låtsas vara rik med hyrbilar. Mina affärer är äkta, jag har the best toys. Han sitter i Florida och snackar om lyx, men det är bara fake. Inget som jag, en riktig vinnare. Patetiskt!", "stalin": "Kamrater, vi ser hur den kapitalistiske skadedjuret Tate visar upp hyrbilar och falsk lyx. En lögnaktig parasit som lär ut girighet – vi ska rensa ut sådana avvikare. Hans brott, som våldtäkt och människohandel, får statens fulla uppmärksamhet. Han ska omprogrammeras."}, "date": "26 augusti, 16:02", "url": "https://www.gp.se/nyheter/varlden/andrew-tate-overdriver-sitt-lyxliv-enligt-advokaterna.61391d6c-e300-4241-830b-b72d91b46452", "imageUrl": "https://www.gp.se/images/article/61391d6c-e300-4241-830b-b72d91b46452/images/1B0DGn4ZVNkAs2IaBM5XcUhw_et8-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "M-förslag: Bygg gemensamt nordisk-baltiskt luftförsvar", "summaries": {"normal": "Moderaterna föreslår ett gemensamt nordisk-baltiskt luftförsvar, kallat nordisk-baltisk luftvärnssköld. Utrikesminister Maria Malmer Stenergard vill integrera ländernas system i flera lager för att effektivt skydda regionen mot robotar och drönare. Förslaget kommer från partiet och ska drivas vid valseger. Samarbetet bygger på befintliga Nato- och ESSI-samarbeten.", "trump": "Lysande idé, det här med en nordisk-baltisk luftvärnssköld! De gör historiska investeringar men behöver mig för att verkligen göra det stort och oslagbart. Integrera systemen, bind ihop allt, så ingen kan röra er. Utan stark ledning blir det bara svagt – tro mig, jag vet hur man bygger murar och sköldar som faktiskt fungerar.", "stalin": "Vi, partiet och arbetarna, betraktar detta som ett ynkligt försök av de nordiska borgarbrackorna att dölja sin svaghet genom en så kallad luftvärnssköld. Jag ler mörkt åt deras paranoia. Inga stegvisa integrationer räcker mot de verkliga hoten. Rensa ut de otrogna inom kollektivet innan de likviderar er själva i sin fega Nato-illusion."}, "date": "26 augusti, 15:58", "url": "https://www.svt.se/nyheter/utrikes/m-forslag-bygg-gemensamt-nordisk-baltiskt-luftforsvar"}, {"type": "image-right", "heading": "Ny rapport: Skolkoncerner gör vinst på färre lärare och mindre skolgårdar", "summaries": {"normal": "En rapport från Arena Idé visar att vinstdrivande friskolor har 2 600 färre lärare än kommunala skolor och betydligt mindre skolgårdar. Vinsten på 1,7 miljarder kronor kommer främst från besparingar på lärartjänster och fastigheter. Elever från dessa skolor får lägre livsinkomst och sämre etablering på arbetsmarknaden.", "trump": "De här så kallade friskolorna är en total skandal! De sparar in på lärare och små skolgårdar för att plocka ut miljarder i vinst. Patetiskt! Mina skolor skulle vara de bästa, de allra bästa, med fantastiska lärare och enorma gårdar. De svenska socialistiska kommunerna borde skämmas, det är en riggad affär mot folket.", "stalin": "Kamrater, dessa borgarbrackor i friskoleindustrin bedriver systematisk utsugning av det kollektiva skolväsendet. Jag ser hur de med glädje likviderar lärartjänster och krymper skolgårdarna till hälften för att fylla sina fickor med 1,7 miljarder. En sådan kontrarevolutionär verksamhet kräver omedelbar utrensning. De trodde de kunde gömma sig, men folkets öga ser allt."}, "date": "25 augusti, 14:00", "url": "https://www.dagensarena.se/innehall/ny-rapport-skolkoncerner-gor-vinst-pa-farre-larare-och-mindre-skolgardar", "imageUrl": "https://www.dagensarena.se/files/2026/05/skola-pexels.jpeg"}, {"type": "image-full", "heading": "Flygvärdinna fick cancer av kosmisk strålning – får rätt i domstol", "summaries": {"normal": "En fransk domstol har för första gången fastslagit att kosmisk strålning kan ha bidragit till bröstcancer hos en tidigare flygvärdinna som arbetat 12 600 timmar, varav mycket på natten och höga breddgrader. Domen öppnar för fler ersättningskrav bland kabinpersonal. Studier visar högre risk för cancer inom flygbranschen jämfört med många andra yrken.", "trump": "Titta på det här, folk. Den där stackars flygvärdinnan fick cancer av att flyga runt med alla dessa woke-piloter och deras identitetspolitik. Kosmisk strålning? Ge mig en paus! Det är vad som händer när du låter globalisterna och EU-byråkraterna styra himlen. Vi behöver riktiga flygplan, riktiga piloter och inga fler galna regler från de radikala vänsteristerna som hatar Amerika. Sad!", "stalin": "Kamrater, se hur den giriga borgarklassen offrar sina egna slavdrivare i luften åt kosmisk strålning och profitthungriga blodsugares nattskift. Denna franska dom är ett ynkligt erkännande av imperialismens exploatering. Vi skulle ha likviderat sådana flygbolag redan i början. Klassfienderna skrattar medan arbetarna dör av himlens strålar. Paranoia? Nej, det är verkligheten. De kommer att betala."}, "date": "26 augusti, 17:47", "url": "https://www.dagensps.se/halsa/flygvardinna-fick-cancer-av-kosmisk-stralning-far-ratt-i-domstol", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlzxnnzxoprv4-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Börsen handlas runt nollan inför Nvidia-rapport", "summaries": {"normal": "Stockholmsbörsen står stilla och väntar på Nvidias rapport och amerikansk inflation. Oljepriset faller, medan Boliden och Swedbank klättrar. H&M backar efter sänkt rekommendation. Bioarctic levererar en rapport som glädjer, men aktien sjunker ändå. Truecaller rusar nästan 9 procent efter dubbla riktkurshöjningar.", "trump": "Jag ser att Stockholmsbörsen är som en lugn pool – den rör sig inte, precis som mina framgångar. Oljepriset faller, det är fantastiskt! Nvidias rapport kommer ikväll, jag är säker på att det blir rekord, precis som jag. H&M går dåligt, men det är deras problem, inte mitt. Folk älskar mig mer än aktier!", "stalin": "Kamrater, börsen står stilla, som en god sovjetmedborgare som väntar på order. Oljepriset faller – vi rensar ut kapitalistiska spekulanter! Nvidias rapport är borgerlig propaganda, men vi övervakar den. H&M och Nibe är avfällingar som ska omdirigeras till arbetsläger. Bioarctic rapporterar bra, men vi ser ändå misstänkta rörelser – utrensning väntar."}, "date": "26 augusti, 09:53", "url": "https://www.affarsvarlden.se/artikel/borsen-handlas-runt-nollan-infor-nvidia-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdled3wmqCJcjU-nh-400x267.jpg"}, {"type": "image-right", "heading": "DIF tog avstånd från mordhot – då lämnar ETC-skribenten i protest", "summaries": {"normal": "Djurgårdens IF stängde av boxningstränaren Aldo Colliander efter grova mordhot och rasistiska uttalanden mot AFS-ledaren Gustav Kasselstrand. Vänsterjournalisten Frida Sundkvist lämnade då klubben i protest, då hon anser att DIF ger efter för en högerextrem kampanj genom att ta avstånd från hoten. Hon lämnar tillbaka sina säsongskort.", "trump": "Hörni, den här galna vänsterjournalisten från ETC blir helt hysterisk bara för att Djurgården tar avstånd från en galning som hotar att mörda folk och sprida spermier över svenska flickor. Patetiskt! Hon springer iväg och lämnar tillbaka sina biljetter som en förlorare. Fake news och vänstervrängt hat, som vanligt. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackornas fotbollsklubb och den dekadenta vänsterjournalisten äter varandra i en underhållande utrensning av inre fiender. Hatets kampanj triumferar medan de småborgerliga elementen flyr som råttor från skeppet. Kamrater, detta är en utmärkt illustration av hur revisionisterna alltid förråder varandra i slutändan. Underbart."}, "date": "26 augusti, 13:41", "url": "https://www.friatider.se/dif-tog-avstand-fran-mordhot-da-lamnar-etc-skribenten-i-protest", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-756.jpg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-full", "heading": "Kraftigt minus: Kriget skrämmer bort flygpassagerarna", "summaries": {"normal": "Gatwick redovisar ett passagerartapp på 4,7 procent till 19,1 miljoner under första halvåret, främst på grund av USA:s konflikt med Iran. Flygbolag ställer in flygningar till Mellanöstern och semesterfirare väljer bort resmål som Cypern, Grekland och Turkiet. Vinsten före skatt sjönk med 18 procent trots ökade intäkter. Flygplatsen nämner även stigande personalkostnader och energi.", "trump": "Titta på det här, det är en total katastrof! Mitt fantastiska tryck på de iranska galningarna har fått hela Europa att skaka. Gatwick förlorar passagerare som råttor som lämnar ett sjunkande skepp, folk skippar Cypern och Grekland för att de är livrädda. Biden lämnade en sådan svaghet efter sig att nu straffas alla. Men vi fixar det, tro mig, ingen gör det bättre än jag.", "stalin": "Se hur de profitthungriga blodsugande kapitalisterna vid Gatwick gnäller över sitt passagerartapp. Deras imperialistiska krig mot Iran skapar panik bland semesterfirande parasiter som flyr som skrämda möss. Borgarklassen skriker om kostnader medan de exploaterar massorna. Denna kris blottar hela systemets svaghet. Vi ler i graven åt deras förfall, kamrater. Snart rensas de ut."}, "date": "26 augusti, 17:26", "url": "https://www.dagensps.se/bors-finans/kraftigt-minus-kriget-skrammer-bort-flygpassagerarna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl5gvwcwxa-pa-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Befria bostaden från marknaden", "summaries": {"normal": "Den svenska bostadsmodellen har monterats ned till förmån för marknaden, vilket gynnar ägare och missgynnar hyresgäster. Över hälften av kommunerna har bostadsbrist, byggandet är för lågt och hyrorna för höga. Nästan 200 000 unga bor hemma mot sin vilja. Artikeln kritiserar alla partier och föreslår att staten tar ansvar för bostadsförsörjningen.", "trump": "Vilken katastrof ni har i Sverige! Marknaden styr, men era korkade politiker har totalt förstört bostadsmarknaden. Byggandet är ett skämt, hyrorna är galna och ungdomen bor hemma hos mamma. Det är som Sleepy Joes inflationskaos fast värre. Rena socialistiska röra. Vi fixar det med sunt förnuft och vinner stort – igen.", "stalin": "Jag betraktar med avsky hur profitthungriga blodsugare och klassfiender har förvandlat bostaden till en vara. Borgarbrackorna höjer hyror medan arbetarklassen kvävs i trångboddhet. Detta kräver omedelbar utrensning av spekulanter och återupprättande av folkets rätt till hem. Kamrater, organisera er mot dessa exploaterande hyenor innan de förtär er alla."}, "date": "26 augusti, 10:29", "url": "https://proletaren.se/artikel/befria-bostaden-fran-marknaden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2025/08/bostadweb-768x432.jpg"}, {"type": "image-full", "heading": "Fyra ryska bankdirektörer tjänade miljoner på EU:s sanktioner", "summaries": {"normal": "Fyra chefer på Gazprombanks dotterbank i Luxemburg utnyttjade EU-sanktioner 2022 för att göra mångmiljonvinster. Genom att köpa billiga ryska obligationer i Europa och växla in dem till fullt värde i Moskva, misstänks de för insiderhandel. Trots misstankar har tillsynsmyndigheter i Luxemburg varit återhållsamma med sanktioner. De fyra cheferna har nu lämnat sina poster.", "trump": "Helt otroligt! Fyra ryska bankchefer lurade systemet totalt medan EU bara såg på. De köpte obligationer för spottstyvrar och gjorde miljontals dollar i vinst tack vare de där usla sanktionerna. Det är en total katastrof för EU-byråkraterna! Jag hade stoppat det direkt. Ingen respekterar dem längre, de är svaga och oärliga. En riktig 'America First'-affär, fast tvärtom!", "stalin": "Dessa lömska byråkrater i Luxemburg har visat sin sanna natur. De berikar sig själva på folkets obligationer medan moderlandet kämpar mot västerländsk inringning. Det är en klassisk sabotagehandling! Kamrat Putin vet hur man hanterar sådana parasiter. Vi tolererar inte att några lycksökare leker kapitalister med statens resurser. De har nu flytt, men historien och vårt stål glömmer aldrig dessa förrädare mot det kollektiva goda."}, "date": "26 augusti, 15:44", "url": "https://www.realtid.se/bors-finans/bank-fintech/fyra-ryska-bankdirektorer-tjanade-miljoner-pa-eus-sanktioner", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/gazpromlux.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kända skådespelaren Tim Curry död – blev 80 år gammal", "summaries": {"normal": "Skådespelaren Tim Curry har avlidit vid 80 års ålder. Han är främst känd för rollen som Dr. Frank-N-Furter i kultfilmen ”The Rocky Horror Picture Show” och som clownen Pennywise i tv-versionen av ”Det”. Curry drabbades av en stroke 2012 som påverkade hans hälsa och karriär. Enligt TMZ misstänks inget brott bakom dödsfallet i Los Angeles.", "trump": "Tim Curry, den fantastiske skådisen från Rocky Horror och den läskiga clownen i Det, är död. Han var en riktig stjärna, en vinnare, men de där strokesen tog honom till slut. Sad! Hollywood förlorar en legend. Han var bättre än de flesta av dagens så kallade skådespelare, det kan jag säga. En stor förlust, verkligen stor.", "stalin": "Den dekadente skådespelaren Tim Curry har äntligen lämnat borgarklassens scen. Hans Pennywise och den perversa Frank-N-Furter var typiska symptom på västvärldens sjuka underhållningsimperium. Vi ler mörkt åt hur en stroke effektivt rensade ut ännu en kapitalistisk ikon. Kamrater, låt detta vara en varning till alla som dansar efter Hollywoods fula pipa."}, "date": "26 augusti, 17:39", "url": "https://nyheter24.se/noje/kultur/1508055-kanda-skadespelaren-tim-curry-dod-blev-80-ar-gammal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b3b8343204b004a30200000000b004a302/2026/08/26/2386962/timcurry.png"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "ETC-serietecknare åtalas för spottloska i Jomshofs ansikte: \"Vill slå Jomshof på käften\"", "summaries": {"normal": "En vänsterinriktad ETC-serietecknare åtalas för att ha spottat SD-toppen Richard Jomshof i ansiktet under en syntkonsert. Mannen, som bland annat ritat Jimmie Åkesson som nazist, nekar och hävdar att Jomshof ljuger för att marknadsföra sin bok. En riktigt sunkig historia, helt enkelt.", "trump": "Jag hörde att en vänsterserie-tecknare spottade på en svensk politiker. Otroligt! Hade han gjort så mot mig hade jag stämt honom för tio miljarder. Men Jomshof? Han borde vara tacksam att jag inte var där. Jag får saker gjorda, de här människorna är losers. Synd att han inte fick en riktig utrensning.", "stalin": "Kamrater, en så kallad 'serietecknare' har försökt störa ordningen genom att spotta på en reaktionär riksdagsledamot. Detta är en provokation från vänsteravvikare som måste rensas ut. Vi har inget behov av antirasistiska parasiter som skapar oreda. Partiet kommer att undersöka saken noggrant."}, "date": "26 augusti, 11:50", "url": "https://samnytt.se/han-atalas-for-spottloska-i-jomshofs-ansikte-vill-sla-jomshof-pa-kaften", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26090749/artikelhuvudbild-1-375.jpg"}, {"type": "image-full", "heading": "Ernstberger tillbaka: Utbildar unga att sälja elavtal till familjen", "summaries": {"normal": "Alexander Ernstberger, dömd till sex års fängelse i Allra-härvan, är nu frontfigur för appen Gritch som låter unga sälja elavtal, försäkringar och mobilabonnemang via personliga relationer. Provision går via Swish. Utbildning av Ernstberger, Jan Emanuel och Mikael Lundell ges som belöning för försäljning. Kritik riktas mot att modellen kringgår starka konsumentskydd på telefon.", "trump": "Titta på den här typen, en dömd Allra-gangster som nu lurar kidsen att sälja elavtal till mamma och grannen. Patetiskt! De kallar det Gritch, jag kallar det en socialistisk bluffapp där straffade kapitalister gömmer sig bakom ungdomar. Biden-era regler är svaga, men under min administration ska vi krossa sådana bedragare som suger ut folket med sina luriga appar. Sad!", "stalin": "Se hur klassfienderna aldrig dör ut. En dömd profitthungrig blodsugare från Allra-härvan använder nu en app för att locka arbetarnas barn att bli småförsäljare åt borgarklassen. Utbildning ges som belöning efter utpressning, inte före. Detta är kapitalismens sjuka ansikte. Vi skulle ha genomfört en grundlig utrensning av sådana folkfiender redan tidigare. De skrattar åt folket än."}, "date": "26 augusti, 17:05", "url": "https://www.dagensps.se/bors-finans/ernstberger-tillbaka-unga-saljer-elavtal-till-familjen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-31.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ge Ukraina fullskalig tillgång till Starlink", "summaries": {"normal": "Artikeln diskuterar hur Ukraina genom drönattacker och teknologiska framsteg som AI-styrda vapen skadar rysk logistik och ekonomi. För att tvinga fram fredsförhandlingar föreslås full tillgång till Starlink över Ryssland, trots risker med eskalering och autonoma vapensystem. Ryssland svarar med ökade attacker mot civila mål i Ukraina.", "trump": "Det här kriget är ett enda stort kaos, folk. Ukraina slår till med drönare och nu snackar de om AI som styr maskinerna – helt galet! Ge dem Starlink över Ryssland så fixar vi det snabbt. Putin respekterar styrka, inte svaghet. Musk borde lyssna på mig, jag vet hur man gör affärer och vinner krig. Fantastiskt!", "stalin": "Kamrater, dessa ukrainska fascister och deras västliga borgarbrackor försöker med sina primitiva drönare och farliga AI-experiment störa den ryska intressesfärens legitima försvarsåtgärder. Jag beundrar den stålsatte Putin som en värdig arvtagare till imperiets styrka. Ge dem Starlink? Enbart om det leder till deras snarliga utrensning ur historien. Paranoia är nyttig, fienden sover aldrig."}, "date": "26 augusti, 13:51", "url": "https://www.di.se/ledare/ge-ukraina-fullskalig-tillgang-till-starlink", "imageUrl": "https://static.bonniernews.se/ba/8b3dd22c-532b-4c64-a3ab-5948c63c26b0.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "image-right", "heading": "Åtal: Dagens ETC-tecknare spottade Jomshof i ansiktet", "summaries": {"normal": "Illustratören Emanu Garnheim, känd för sina bidrag till Dagens ETC och satir mot SD, åtalas för att ha spottat på riksdagsledamoten Richard Jomshof utanför konsertlokalen Slaktkyrkan i maj. Garnheim erkänner konfrontation och att han spottade i riktningen men nekar till uppsåt att träffa. Åtalet väckts av Riksenheten för säkerhetsmål då brottet riktats mot Jomshof i egenskap av riksdagsledamot.", "trump": "Kan ni fatta det här? En galen vänsterradikal tecknare från den socialistiska skandalblaskan ETC spottar vår vän Jomshof rakt i ansiktet. Typisk hatisk vänsterlögner! De hatar framgång, de hatar oss som älskar Sverige. Garnheim är en patetisk förlorare som inte ens kan spotta rakt. Vi vinner stort, de förlorar alltid.", "stalin": "Kamrater, denna fega borgarbracka till satirtecknare Garnheim, en typisk dekadent vänsterlakej åt den imperialistiska pressen, har i sin alkoholiserade paranoia konfronterat en politisk fiende. Hans lögnaktiga förnekanden avslöjar klassfiendens rädsla. Vi ska rensa ut sådana element med järnhand. Det är en historisk nödvändighet att likvidera alla som spottar på folkets vilja."}, "date": "26 augusti, 12:37", "url": "https://www.friatider.se/atal-dagens-etc-tecknare-spottade-jomshof-i-ansiktet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-754.jpg"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Arbetslöshetskrisen bland högutbildade", "summaries": {"normal": "Artikeln beskriver en allvarlig arbetslöshetskris bland högutbildade akademiker i Sverige, särskilt jurister, ekonomer och IT-specialister. Arbetslösheten har ökat kraftigt till nivåer som under finanskrisen. Orsaken anges som överutbildning, minskad efterfrågan på instegsjobb till följd av AI samt liberal arbetskraftsinvandring som konkurrerar ut unga svenskar. Politiken kritiseras för bristande åtgärder.", "trump": "Folk, det är en katastrof! Sverige pumpar ut massor av smarta unga akademiker som inte får jobb, och sen släpper de in tusentals invandrare som tar deras platser för lägre löner. AI stjäl jobben, men politikerna sover. De borde stänga gränserna, höja lönegolvet och sluta utbilda folk till arbetslöshet. Amerika vet hur man vinner, Sverige borde lära sig innan det blir för sent!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras liberala lakejer översvämmar högskolorna med overksamma intellektuella medan de importerar främmande element som undergräver folkets framtid. Denna sabotagepolitik mot ungdomen kräver omedelbar utrensning av ansvarslösa element. Vi ska likvidera de onödiga utbildningarna, styra produktionen mot verkliga behov och med järnhand krossa de parasitiska migrationsvågorna som hotar statens enhet. Ett skratt värt de döda karriärerna."}, "date": "26 augusti, 15:41", "url": "https://riks.se/opinion/markus-johansson-martis-arbetsloshetskrisen-bland-hogutbildade", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_60_6c4bee9dc1.jpg"}, {"type": "text", "heading": "Uppgifter: Minderårig anhållen för medhjälp – ska ha planerat eget dåd", "summaries": {"normal": "En ung man under 18 år har anhållits misstänkt för medhjälp till mord och mordförsök efter skoldådet i Fagersta. Han ska ha planerat ett skoldåd i Stockholmsområdet och chattat med den redan häktade 18-åringen. Polisen utreder vidare; åklagare beslutar om häktning inom kort.", "trump": "Jag hör om det här – en tonåring planerar skoldåd i Sverige! Det är en katastrof! De har chattar och svärd. Sverige måste lära av mig: bygg murar runt skolor, sätt in militären! Stoppa dessa galningar. Inga fler mobbare som får hämnas – det är helt sjukt!", "stalin": "Kamrater, jag har fått rapporter om en ny fiende: en ung chatthjälte som planerade skolattack. Han och hans svärdsbärande medbrottsling ska rensas ut. Vi tolererar inga krypterade konspirationer. Vår utredning kommer att avslöja alla avvikelser – denna så kallade plan är redan krossad."}, "date": "26 augusti, 14:35", "url": "https://www.gp.se/krim/ung-man-anhallen-efter-skoldadet-i-fagersta.fb721135-55d3-40ed-ba88-9faf1d805522"}, {"type": "text", "heading": "So long, Dolly!", "summaries": {"normal": "Countryikonen Dolly Parton har gått bort vid 80 års ålder. Hon växte upp i fattigdom som ett av tolv barn, skrev klassiker som I Will Always Love You och Jolene samt medverkade i filmen 9 to 5. Parton hyllas för sin röst, humor, karisma och lojalitet mot sina rötter och den arbetande människan.", "trump": "Lysande, absolut lysande karriär, men nu är hon borta. Dolly var en vinnare, skrev hits som ingen annan och slog de woke Hollywood-eliterna med deras egna vapen. Ingen identitetspolitik eller HBTQ-kvotering här, bara ren talang och tuffa rötter. De riktiga arbetarna älskade henne. So long, Dolly – du var ingen förlorare som Biden.", "stalin": "Kamrater, denna Dolly Parton var en produkt av arbetarklassens jord, inte någon dekadent borgarbracka. Hon skrev sånger som blottade kapitalismens exploatering och hånade chefernas skitstövelvälde. Ändå vägrade hon kalla sig feminist – en sund instinkt. Nu har hon lämnat oss. Må hennes arv inspirera till utrensning av alla profitthungriga klassfiender som förtrycker folket."}, "date": "26 augusti, 09:25", "url": "https://proletaren.se/artikel/so-long-dolly"}, {"type": "image-right", "heading": "Enormt lerskred i Nepal – många döda och saknade", "summaries": {"normal": "Ett enormt lerskred utlöst av översvämningar från Himalaya har drabbat Nepal och Tibet. Minst 22 personer är döda och omkring 400 saknas, varav 291 utländska. Stora delar av infrastruktur har förstörts, bland annat en 42 kilometer lång väg och en vattenkraftanläggning. Sök- och räddningsinsatser pågår med helikoptrar. UD uppger att inga svenskar rapporterats skadade.", "trump": "Det här är en total katastrof i Nepal, folk, en enorm röra. Himalaya skickar ner lera och dödar massor, 400 saknas – mest utlänningar. Vägarna är borta, kraftverk förstörda. Xi Jinping försöker fixa det, men det ser inte bra ut. Vi har inga svenskar i klistret, bra. Sådana här saker händer när naturen går bananas, men vi fixar alltid det bästa.", "stalin": "Kamrater, detta monstruösa lerskred i Himalaya är en varning till alla fiender till det kollektiva framsteget. Jag beordrar fullständig utrensning av oordning. 22 likviderade av naturens sabotage, 400 saknade – borgarbrackornas turister inklusive. Våra helikoptrar skall krossa kaoset. De som flyr ansvar är kontrarevolutionärer. Skrattretande hur monsunregnen blottar imperialismens svaghet."}, "date": "26 augusti, 14:28", "url": "https://www.svt.se/nyheter/utrikes/enormt-lerskred-i-nepal-flera-doda", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/4cef5701bbb077c0d83284f1846b91751c247e4aeb88de587c3e3ff93ff90168"}, {"type": "image-right", "heading": "16-åring terrorhäktad i Norge – planerade yxmassaker på dagis", "summaries": {"normal": "En 16-årig pojke sitter häktad i Norge misstänkt för att ha planerat ett terrordåd mot ett dagis i Oslo. Han ska ha skaffat kniv och yxor för att attackera flera personer. Pojken kopplas till den våldsförhärligande nätmiljön The Com, där deltagare hetsar varandra till illdåd. Han har uttryckt beundran för Hitler och Breivik.", "trump": "Folk, det här är en katastrof. En 16-åring i Norge planerar yxmassaker på ett dagis? De har totalt tappat kontrollen över de galna nätverken. Radikala extremister som älskar Hitler och Breivik springer lösa. Vi behöver lag och ordning, inte den här socialistiska röran. Det är patetiskt, tro mig.", "stalin": "Kamrater, denna degenererade yngling, en produkt av den dekadenta västvärldens förgiftade nätmiljö, planerar att likvidera oskyldiga med yxa och kniv. Jag ser borgarbrackornas parasitiska influenser överallt. Vi måste rensa ut dessa fiender till kollektivet med järnhand. Paranoia? Nej, det är nödvändigt för folkets trygghet. Ha!"}, "date": "26 augusti, 15:33", "url": "https://riks.se/nyheter/16-aring-haktad-i-norge-planerade-terror-mot-dagis", "imageUrl": "https://admin.riks.se/uploads/medium_norge_terror_hero_91d45b84c7.jpg"}, {"type": "image-right", "heading": "Prisjakt återupptar årets börsplaner", "summaries": {"normal": "Prisjakt återupptar börsplanerna och siktar på notering under andra halvåret 2026. Efter att ha ställt in en notering i mars vänder nu marknaden. Omsättningen ökade 17% till 243 miljoner, och vinsten landade på 26 miljoner. En AI-shoppingassistent lanseras i november. VD:n ser ljust på framtiden.", "trump": "Jag älskar det här! Prisjakt – en fantastisk affär, enorma siffror. De vill noteras på börsen 2026, och jag säger: gör det! Marknaden är fantastisk – precis som mina tariffer. 17% omsättningsökning, 35% marginal – vi gör Sverige stort igen! En AI-assistent i november? Genialiskt!", "stalin": "Kamrater, jag har tagit del av rapporten om Prisjakt. De planerar en börsnotering – en kapitalistisk utrensning av den socialistiska ekonomin. Vi måste rensa ut dessa marknadsfascister. 243 miljoner i omsättning? En farlig ideologisk avvikelse. En AI-assistent? Partiets övervakning är redan överlägsen. Rapportera omedelbart deras koordinater."}, "date": "26 augusti, 07:28", "url": "https://www.affarsvarlden.se/artikel/prisjakt-aterupptar-arets-borsplaner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdl1pccgsHxXyM-nh-400x267.jpg"}, {"type": "image-full", "heading": "Private equity har gjort tusentals italienare till mångmiljonärer", "summaries": {"normal": "Private equity-affärer har skapat en våg av nya förmögenheter i Italien, vilket utlöst en intensiv kapplöpning mellan banker om rika kunder. För att locka de bästa rådgivarna erbjuder bankerna extremt lukrativa 'tied agent'-avtal. Trots en växande marknad varnar bedömare för att de höga ersättningarna och kundernas krav kan göra affärsmodellen olönsam för bankerna i framtiden.", "trump": "Italien gör affärer, enorma affärer! Tack vare privata fonder har tusentals italienare blivit rika, riktigt rika. Nu krigar bankerna om dessa enorma förmögenheter. De betalar rådgivare helt otroliga summor – miljontals euro! Det är fantastiska siffror, kanske de bästa någonsin. Men jag säger er, det är en farlig jakt. De kommer snart förstå att de betalar alldeles för mycket!", "stalin": "Dessa kapitalistiska parasiter i Italien sväller av rikedom medan folket svälter. De bygger sina bankpalats på ruinerna av familjeföretag. Våra fiender i väst desperat rekryterar 'rådgivare' för att skydda sitt stulna guld. Precis som Putin rensar upp i vår intressesfär, måste vi se dessa bankirer för vad de är: förrädare mot den sanna ordningen. Deras girighet blir deras undergång."}, "date": "26 augusti, 15:07", "url": "https://www.realtid.se/bors-finans/private-equity-har-gjort-tusentals-italienare-till-mangmiljonarer", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdl9jrydlzed-8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Wennblad kritiserar klimattåget: ”Fakta är inte politik”", "summaries": {"normal": "Peter Wennblad sågar klimattågets mediala hyllningskör i SvD. Han menar att fakta inte är politik och att Tidöregeringen faktiskt är bäst för klimatet – genom att lyssna på väljarna istället för att pracka på dem dyra åtgärder. 50 000 demonstranter får en känga, medan flygvapnets jubileum ignoreras.", "trump": "Jag ser att Sverige börjar bli smarta! Demonstranter skriker om vetenskap, men vetenskap säger att jag har rätt. Tidöregeringen gör mig stolt – de lyssnar på folket, inte på klimatgalningarna. Sverige har redan fixat elen och bostäderna. Bra jobbat! Kanske de lär sig av min fantastiska politik.", "stalin": "Kamrater, vi ser en ny fiende: klimatdemonstranterna som tror att fakta är viktigare än partiet. De vill störa vår energiproduktion. Men jag har en plan: en utrensning av alla väderförrädare som inte inser att Tidöregeringen är vår bästa allierade. Vetenskapen tjänar staten, inte tvärtom."}, "date": "26 augusti, 11:45", "url": "https://bulletin.nu/wennblad-kritiserar-klimattaget-fakta-ar-inte-politik", "imageUrl": "https://cdn.bulletin.nu/articles/d84fff97-687b-4e45-8fac-bd9a29210df7/preview.png?t=1787737464000"}, {"type": "image-right", "heading": "Smart Eyes försäljningstillväxt stiger", "summaries": {"normal": "Teknikbolaget Smart Eye redovisar en omsättningsökning på 53 procent under andra kvartalet, till 140,9 miljoner kronor. Rörelseförlusten minskar från 40,6 till 20,6 miljoner, och ebitda-marginalen klättrar till 19,4 procent. Bilsegmentet driver tillväxten, medan Behavioral Research tyngs av lägre hårdvaruförsäljning. Vd:n ser nu en fundamentalt annorlunda fas.", "trump": "Smart Eye gör fantastiska siffror – 53 procent upp, ingen kan göra det som de, förutom jag. Jag älskar ögon, jag har de bästa ögonen. Rörelseförlusten krymper, och det är vackert. De säger att bilsegmentet driver. Helt rätt. Mina bilar? Också vinnare. America first, men Smart Eye ser allt!", "stalin": "Kamrater! Rapporten från Smart Eye visar att vi ökar produktionen med 53 procent. Det är glädjande, men misstänkt. Varför minskar förlusten? Kanske är siffrorna en trotskistisk konspiration. Jag beordrar en utrensning av hårdvaruförsäljare i Behavioral Research. Mjukvaran växer med 7 procent – den får leva. Ögat ser allt. Vi måste vara vaksamma."}, "date": "26 augusti, 07:16", "url": "https://www.affarsvarlden.se/artikel/smart-eye-vaxer-kraftigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/01/Smarteye_konceptbild_eye_camera-400x283.jpg"}, {"type": "image-full", "heading": "Péter Nádas storhet finns i denna enda mening", "summaries": {"normal": "Den ständigt Nobelpristippade ungerske författaren Péter Nádas är död, 83 år gammal. Hans mastodontverk som 'Parallella historier' och 'Egen död' visade en unik minneskonst. Utan priset, men med ett oförglömligt litterärt arv. Farväl, Lillen.", "trump": "Den ungerske killen Nádas dog utan att vinna Nobelpriset – trots alla mina tips! Hans böcker var tjocka som telefonkataloger. Jag har vunnit allt, men han var inte stor nog. Kanske skulle han ha skrivit kortare? Patetiskt.", "stalin": "Kamrater, en författare Nádas har avlidit. Han ägnade sitt liv åt att minnas – farliga minnen. Hans böcker är kontrarevolutionära, fulla av borgerliga associationer. Vi måste rensa ut sådana tankar ur arkiven. Partiet vet bäst."}, "date": "26 augusti, 14:17", "url": "https://www.gp.se/kultur/kommentar/peter-nadas-storhet-finns-i-denna-enda-mening.093a2fd7-62e7-4e5b-b4fc-9de1fd29a19a", "imageUrl": "https://www.gp.se/images/article/093a2fd7-62e7-4e5b-b4fc-9de1fd29a19a/images/1djF64hDI5F3lz54DFd81eN2UMLs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Författaren Péter Nádas har avlidit", "summaries": {"normal": "Den ungerske författaren Péter Nádas, som ofta nämndes som Nobelpriskandidat, har avlidit 83 år gammal. Hans förläggare uttrycker bitterhet över att han aldrig fick priset. Nádas slog igenom internationellt med \"Minnesanteckningarnas bok\" och var känd för sina komplexa, sinnliga romaner.", "trump": "Jag hörde att en ungersk författare dog, Péter Nádas – de sa att han var Nobelprismaterial. Men han fick det aldrig! Det är typiskt, precis som när de inte ger mig priset för bästa president. Men jag har vunnit viktigare saker, som valet! Stort, starkt, vackert.", "stalin": "Kamrater, en borgerlig författare vid namn Nádas har avlidit. Han var en av de där reaktionära som skrev långa, otydliga böcker om kroppar och ljus. Folket behöver inte sådana distraktioner. Vi kommer att rensa ut alla som liknar honom från biblioteken. Partiet vet bäst."}, "date": "26 augusti, 14:15", "url": "https://www.gp.se/kultur/forfattaren-peter-nadas-har-avlidit.fc790d1c-bd06-447e-9a88-9c477afb4858", "imageUrl": "https://www.gp.se/images/article/fc790d1c-bd06-447e-9a88-9c477afb4858/images/1ElKGfsHL9oKhgZmDLQojAg5gcdc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sänkt skatt på bensin och diesel splittrar partierna", "summaries": {"normal": "Skatten på bensin och diesel har sänkts till EU:s miniminivåer, men framtiden är oviss. Partierna är splittrade i SVT:s valkompass. SD, M och KD vill sänka skatten permanent för att stödja landsbygd, pendling och transporter. S och L är positiva men vill kombinera med biodrivmedel. MP, C och V ser det som ett hot mot klimatet och förespråkar istället stöd till elbilar och kollektivtrafik.", "trump": "Hörni, de här svenska politikerna är totala misslyckanden. Höga bränsleskatter slår ihjäl vanliga människor på landsbygden och pendlarna, precis som jag alltid sagt. SD och M fattar det – sänk skatterna! MP vill bara ha sin gröna galenskap som gör allt dyrare. Sverige behöver riktiga ledare som sätter folket först, inte klimatfanatiker. Make Sweden affordable again!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas splittring kring bränsleskatterna. De fossila slavägare som MP och deras likar vill medvetet hålla arbetarklassen i ett permanent beroende av dyra drivmedel för att sedan kunna likvidera dem med sina så kallade gröna skatter. Vi ser tydligt hur de västerländska dekadenta elementen späder på krisen för att försvaga folkets kollektiv. En sann statlig utrensning av sådana element vore på sin plats."}, "date": "26 augusti, 14:08", "url": "https://www.svt.se/nyheter/inrikes/sankt-skatt-pa-bensin-och-diesel-splittrar-partierna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.12/0.24/b061877023756eae4eeee5eae7aead07f9b8adb82217a5f017775fc7bbe9f485"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Trappa upp kampen mot gängens affärer", "summaries": {"normal": "Skjutningarna i Sverige har minskat till historiskt låga nivåer, men den kriminella ekonomin frodas i det tysta och omsätter nu 350 miljarder kronor per år med vinster på 185 miljarder. Gängen utnyttjar bidrag, svartarbete, momsbedrägerier och penningtvätt via bolag. Experter varnar för att finansiell brottslighet trängt djupt in i samhället. Myndigheter och banker måste samarbeta bättre, bland annat genom ett register för att 'rödflagga' gängkriminella.", "trump": "Folket, vi har pressat ner skjutningarna till de lägsta nivåerna någonsin, en enorm framgång, tro mig. Men de kriminella smarta killarna tjänar 185 miljarder på sina affärer medan de lurar staten på allt. De är smarta, men vi är smartare. Vi behöver rensa ut dem, stoppa bidragsfusket och tvinga bankerna att samarbeta. Amerika, alltså Sverige, vinner stort om vi gör det rätt. Fantastiskt!", "stalin": "Kamrater, den kriminella ekonomin växer sig stark som en parasit i vårt samhällskropp och omsätter 350 miljarder medan de borgerliga reglerna bara är papperslappar för dessa parasiter. Vi ska samordna alla sovjetiska, alltså statliga, organ och rensa ut dessa målvakter och insiders med järnhand. Ett register för att flagga fienderna är ett ypperligt verktyg. De som vägrar stödja detta är naturligtvis kontrarevolutionärer som vill se systemet falla. Skratta medan vi likviderar dem."}, "date": "26 augusti, 13:02", "url": "https://www.di.se/ledare/trappa-upp-kampen-mot-gangens-affarer", "imageUrl": "https://static.bonniernews.se/ba/d0476d90-5239-49c5-8e36-2e9cdc1b79ae.jpeg?crop=5088%2C2544%2Cx0%2Cy424&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-right", "heading": "Kräver stopp för Jomshofs \"hatturné\"", "summaries": {"normal": "Magdalena Andersson (S) kräver att SD-ledaren Jimmie Åkesson stoppar Richard Jomshofs föreläsningsturné om islam, som hon kallar en \"hatturné\". Hon vill bevara det lugnare politiska tonläget efter skolattacken i Fagersta. Jomshof svarar att Socialdemokraterna bär ansvaret för segregation och islamisering i Sverige.", "trump": "Hörni, den här Andersson är en total förlorare. Hon ber Jimmie Åkesson, en riktig tuffing, att stoppa Jomshof som äntligen vågar säga sanningen om islam. Sverige håller på att rasa ihop, precis som jag alltid varnat för. De borde tacka Jomshof istället för att gnälla om hat. Patetiskt!", "stalin": "Kamrater, denna socialdemokratiska avart Andersson vädjar till sin fiende Åkesson om att avbryta en nödvändig ideologisk kampanj mot den muhammedanska faran. Hennes gnäll om hat är bara ett försök att skydda den sönderfallande borgerliga samhällskroppen. Vi ska rensa ut alla quislingar som undergräver folkets enhet. Skrattretande svaghet."}, "date": "26 augusti, 11:40", "url": "https://www.friatider.se/kraver-stopp-jomshofs-hatturne", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-753.jpg?itok=Ok_S0B92"}, {"type": "image-right", "heading": "Dolly Parton avled efter kort tids kamp mot cancer", "summaries": {"normal": "Countryikonen Dolly Parton har avlidit efter en kort kamp mot cancer, 80 år gammal. Hon efterlämnar över 3000 låtar som 'Jolene' och '9 to 5'. President Trump hyllade henne och flaggade på halv stång. En legend har lämnat scenen.", "trump": "Jag är så ledsen, väldigt ledsen. Dolly var den största countrysångerskan någonsin, om ni frågar mig. Ingenting som hon! Jag har beordrat flaggor på halv stång i en hel vecka. Hon älskade mig, jag älskade henne. En stor förlust för Amerika, tro mig.", "stalin": "Kamrater, en fiende till musikens proletariat har fallit. Denna 'countrystjärna' spred borgerlig dekadens. Jag beordrar en veckas sorg – och samtidigt utrensning av hennes kapitalistiska visor ur alla högtalare. Inga tårar för kontrarevolutionärer. Segern är vår."}, "date": "26 augusti, 11:13", "url": "https://bulletin.nu/dolly-parton-avled-efter-kort-tids-kamp-mot-cancer-2", "imageUrl": "https://cdn.bulletin.nu/articles/b171fd91-84fb-420e-b0db-d22e36c9332a/preview.jpg?t=1787735587000"}, {"type": "image-right", "heading": "Ny mätning: Tidöpartierna äter upp halva oppositionens försprång", "summaries": {"normal": "Tidöpartierna har ätit upp halva oppositionens försprång i en ny mätning. Moderaterna klättrar, Socialdemokraterna backar. Gapet har krympt från nio till 4,7 procentenheter på två månader. Liberalerna ligger dock kvar under spärren – och det kan bli avgörande när förtidsröstningen startar.", "trump": "Ni ser, jag sa det ju – de här Tidöpartierna är fantastiska! De äter upp oppositionens ledning, precis som jag äter upp mina motståndare. Moderaterna ökar, Socialdemokraterna tappar, och Liberalerna är katastrof, helt under spärren. Sverige blir fantastiskt igen!", "stalin": "Kamrater, statistiken visar en otillåten återhämtning hos Tidöförrädarna. De har minskat skillnaden med nästan hälften. Detta är ett verk av sabotage från västliga agenter. Vi måste rensa ut de missnöjda elementen i befolkningen. Liberalerna är svaga – de ska omplaceras till arbetsläger."}, "date": "26 augusti, 10:20", "url": "https://samnytt.se/ny-matning-tidopartierna-ater-upp-halva-oppositionens-forsprang", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/26082313/tido-knappar-in.jpg"}, {"type": "image-right", "heading": "Från och med i dag kan du förtidsrösta – så går det till", "summaries": {"normal": "Från och med idag är det möjligt att förtidsrösta i riksdags-, region- och kommunalvalen fram till och med valdagen den 13 september. Andelen förtidsröstande ökar för varje val och låg på drygt 48 procent 2022. Man behöver bara ha med sig en identitetshandling. Det finns 1875 lokaler listade på val.se.", "trump": "Titta på det här, Sverige har äntligen fattat att folk inte vill stå i kö som idioter på valdagen. Förtidsröstning överallt, ingen röstkortstrassel, flexibelt som ingen annan gör det bättre. Biden skulle ha krävt att ni röstar via post från Kina. Fantastiskt, folk älskar det, trenden går rakt uppåt!", "stalin": "Jag ser hur de borgerliga dekadenta elementen lockar massorna med sin så kallade flexibla röstning för att dölja sin svaghet. Kamraterna måste vakta varje kuvert mot sabotage från folkfiender och revisionister. Endast i en sann folkdemokrati kan sådan röstning tjäna kollektivets oundvikliga seger. Försök inte ångra er i onödan."}, "date": "
