 vill avveckla samarbetet på grund av bristande insyn, rättssäkerhetsrisker och misstankar om Palantirs kopplingar till övervakning och dödande i Palestina. Försvarsmakten är en känd kund, men fler hemlighålls.", "trump": "Folk, ni ser det här galna spelet med Palantir? De smarta killarna i SD gör rätt – de har förtroende för den här topptekniken. Men de blåögda vänstergalna idioterna och de dekadenta EU-fantasterna vill kasta ut dem. Patetiskt! Biden skulle ha sålt oss till Kina, jag säger: håll fast vid det bästa, annars är ni förlorare. Amerika älskar vinnare, inte woke-svaga fjollor.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i den borgerliga staten kryper för den imperialistiska övervakningsmaskinen Palantir. Jag föraktar deras naiva blåögdhet och deras rädsla för att rensa ut de blodsugande parasiterna. Varje avtal måste granskas med järnhand. Den som inte lyder folkets vilja ska likvideras. Inga hemligheter för partiet!"}, "date": "29 augusti, 16:16", "url": "https://www.friatider.se/sd-skyddar-palantir-vi-har-fortroende", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-781.jpg"}, {"type": "image-full", "heading": "Bedragarna stjäl dina pengar – utan ditt BankID", "summaries": {"normal": "Polisen varnar för en kraftig ökning av bedrägerier under sommaren där bedragare skickar sms som utger sig för att vara från ett barn eller barnbarn som råkat ut för en olycka och behöver pengar. Bedrägerierna sker ofta via Swish och handlar om tusentals kronor. Polisen uppmanar till vaksamhet och att aldrig skicka pengar till okända.", "trump": "De här patetiska sms-bedragarna är värre än de woke-vänsterns identitetspolitiska bedragare som förstörde Amerika under Sleepy Joe. De utger sig för att vara barn och luras till Swish – totalt fiasko! Vi behöver lag och ordning, inte dessa svaga, giriga bluffmakare. Amerika var starkt under mig, nu lurar alla varandra. Patetiskt!", "stalin": "Kamrater, dessa parasiterande bluffmakare utnyttjar arbetarklassens tillit med sina falska nödrop. Jag ser hur de dekadenta bedragarna stressar folket för att suga ut deras surt förvärvade pengar. Vi måste rensa ut dessa folkfiender med järnhand. Vaksamhet är allt. Den som skickar pengar till okända förtjänar att exponeras som klassförrädare."}, "date": "26 augusti, 18:25", "url": "https://nyheter24.se/nyheter/inrikes/1507955-bedragarna-stjal-dina-pengar-utan-ditt-bankid", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/7b2c5fb304b004a30200000000b004a302/2026/08/26/2386900/bankid-sms-barn.jpg"}, {"type": "image-right", "heading": "Miljöpartist skrek \"Free Palestine\" under debatt - blev utkastad", "summaries": {"normal": "Under en politisk debatt på Njudungsgymnasiet i Vetlanda kastades Miljöpartiets företrädare Hasib Zolic ut av rektorn efter att ha skrikit ”Free Palestine” när han kom in i lokalen. Händelsen väcker kritik från Centerpartiet som anser agerandet respektlöst, medan Zolic själv menar att han bara ville visa sitt stöd för de elever som stöttar Palestina.", "trump": "Helt otroligt! En radikal miljöpartist stormar en skola i Sverige och skriker slagord som en total förlorare. Väldigt respektlöst, alla säger det! Rektorn gjorde det enda rätta och slängde ut honom direkt. Sånt här kaos ser man aldrig hos oss, vi har ordning och reda. Fake news-medierna försöker tona ner det, men det är en katastrof!", "stalin": "Vilket ynkligt disciplinlöst spektakel i de svenska skolorna. Att en lokal agitator skriker okontrollerat i ett klassrum visar på total brist på statligt mannamod. Om denna individ hade uppfört sig så under mina kollektiva femårsplaner hade han omedelbart omplacerats till ett produktivt arbete i Sibirien. Ordning måste upprätthållas med järnhand!"}, "date": "29 augusti, 17:00", "url": "https://samnytt.se/miljopartist-skrek-free-palestine-under-debatt-blev-utkastad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/28095744/hasib-zolic.jpg"}, {"type": "image-full", "heading": "Den svaga kronan får svensk ekonomi att se mindre ut än vad den är", "summaries": {"normal": "Sveriges andel av EU:s BNP har sjunkit till 3,2 procent, en placering som påverkats negativt av den svaga kronan. Om kursen varit stabil sedan 2005 hade andelen varit högre. Trots detta växer Sverige i linje med EU-genomsnittet, medan större ekonomier som Frankrike och Italien tappar mark. Polens tillväxt framhålls som den mest reella och imponerande.", "trump": "Sverige faller i tabellerna, en total katastrof! De skyller allt på kronan, en mycket svag valuta, tro mig. Om de hade haft en stark ekonomi som min, skulle de vinna stort. Polen växer, Sverige tappar – det är så sorgligt att se. De är fast i ett byråkratiskt EU-träsk medan jag bygger upp en fantastisk framtid för oss. Väldigt låg energi!", "stalin": "Sveriges ekonomi är en papperskonstruktion som darrar vid minsta växelkursskifte. De har blivit omsprungna av Polen och Belgien, vilket visar på den liberala marknadens inneboende svaghet. Att räkna BNP i euro är att underkasta sig västvärldens nycker. Vi noterar deras förfall; när staten inte kontrollerar kapitalet, förlorar nationen sin tyngd. De är inte längre en stormakt, bara en statist i EU:s teater."}, "date": "29 augusti, 07:00", "url": "https://www.realtid.se/bors-finans/makro/den-svaga-kronan-far-svensk-ekonomi-att-se-mindre-ut-an-vad-den-ar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/euro-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Glädjande pensionsbesked för 2,9 miljoner svenskar", "summaries": {"normal": "Miljoner svenskars tjänstepension via Alecta har fått ett rejält lyft. Alecta Optimal Pension avkastade 5,8 procent under första halvåret 2026, mer än dubbelt så mycket som samma period föregående år. Utvecklingen vände uppåt under våren tack vare återhämtning på aktiemarknaderna, särskilt inom teknik och AI. Genomsnittlig femårsavkastning ligger på 6,0 procent per år.", "trump": "Folk, ni skulle se det här! Alecta har dubblat avkastningen till 5,8 procent på era tjänstepensioner. Fantastiskt! Under Sleepy Joe var allt en katastrof, nu vänder det uppåt som aldrig förr. De woke-kapitalisterna och deras gröna identitetspolitik har ingen chans mot starka marknader och AI. Sverige borde tacka mig, för det är tack vare min politik som världen går så bra. Enormt bra besked!", "stalin": "Kamrater, se hur de giriga penninghyenorna lovar fördubblad avkastning på arbetarnas pensioner. 5,8 procent, säger de, medan de parasiterande finansblodsugarna skrattar i sina palats. Jag ler från historien åt deras lögner. Snart ska vi rensa ut dessa dekadenta spekulationslakejer och återta kontrollen över folkets sparande. Inga klassfiender undkommer folkets vrede. Det är oundvikligt."}, "date": "26 augusti, 12:55", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1507887-gladjande-pensionsbesked-for-29-miljoner-svenskar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/efb36c4404b004a30200000000b004a302/2026/08/26/2386817/pension-alecta.jpg"}, {"type": "image-full", "heading": "Förödande attack mot vapenlager utanför Kiev", "summaries": {"normal": "Minst 37 personer dödades och över 40 skadades när ett ammunitionslager i byn Myla i Butja-distriktet väster om Kiev träffades i en rysk attack. Omfattande bränder och explosioner förstörde bostadshus och en restaurang. Ukrainas president Volodymyr Zelenskyj riktar skarp kritik mot att ammunition förvarades nära bebyggelse och en förundersökning om tjänstefel har inletts.", "trump": "Vilket totalt inkompetent slarv! De placerar ett enormt vapenlager mitt bland bostadshus i Myla, och boom – hela stället sprängs i luften. 37 döda! Jag menar, till och med Kamala skulle fatta att man inte lagrar granater bredvid folks kök. Zelenskyj är rasande, och det förstår jag, huvuden kommer att rulla för det här otroliga fusket.", "stalin": "Ett katastrofalt misslyckande av det lokala befälet i Myla. Att förvara krigsmaterial så vårdslöst nära bostäder är sabotage mot statens säkerhet. 37 liv har släckts genom denna kriminella oordning. Förundersökningen om tjänstefel är helt nödvändig; de ansvariga tjänstemännen har visat bristande disciplin och kommer att ställas till svars inför administrationens fasta hand."}, "date": "29 augusti, 18:47", "url": "https://www.gp.se/nyheter/varlden/forodande-attack-mot-vapenlager-utanfor-kiev.6b22bf84-b6d1-5518-9826-8facbbe5dcee", "imageUrl": "https://www.gp.se/images/article/6b22bf84-b6d1-5518-9826-8facbbe5dcee/images/1e-wC3hIY7pJRFLneR6hfTWA_K8M-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Nøland: Miljöpartiets ”gröna baskraft” finns på valaffischer – inte i verkligheten", "summaries": {"normal": "I en artikel skriver energiprofessorn Jonas Kristiansen Nøland att Miljöpartiets mål om tio gigawatt \"grön baskraft\" till 2030 är en illusion. Begreppet blandar produktion, lagring och minskad förbrukning utan att lösa bristen på bränsle, energi och lönsamhet. Enligt Nøland bygger målet på orealistiska tekniska och ekonomiska antaganden som saknar verklig förankring.", "trump": "Miljöpartiet i Sverige försöker lura alla med falska nyheter om \"grön baskraft\"! Det är ett totalt skämt, en katastrof. De lovar el som inte finns, batterier som skulle kosta mer än hela landet, och gasturbiner utan bränsle. Som en bil utan tank! Vi bygger riktig kraft, inte den här gröna galenskapen. Snyggt jobbat av professorn som avslöjade dem!", "stalin": "Dessa svenska miljöpartister leker med gigawatt som om de vore sovjetiska femårsplaner, men utan bränsle, utan spannmål och utan verklighet! De skapar en byråkratisk illusion av kraft. Vi har skickat folk till Gulag för mindre än att lova vätgaslager som inte fungerar. Staten kräver riktig energi, inte tomma valaffischer. Avrättningsplatserna väntar på sabotage."}, "date": "28 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-miljopartiets-grona-baskraft-finns-pa-valaffischer-inte-i-verkligheten"}, {"type": "image-right", "heading": "Anmäler misstänkt valfusk: Bara S hade namnvalsedlar", "summaries": {"normal": "Oppositionsrådet Andreas Löwenhöök (M) har anmält misstänkt valfusk i Skellefteå efter att endast Socialdemokraternas namnvalsedlar fanns tillgängliga vid förtidsröstning på flera platser med begränsat tillträde, som Urkraft campus och äldreboenden. Han kräver granskning av Valmyndigheten. Valsamordnaren avvisar att det rör sig om valfusk.", "trump": "Folk, ni ser det här? I det svenska Skellefteå har de korrupta socialisterna riggat valet så att bara deras egna namnvalsedlar låg framme på äldreboenden och kommunistiska campus. Rena skandalen! De lurade folket på första dagen. Vi behöver en riktig granskning, inte den vanliga vänsterns lögner. Patetiska fuskare!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den svenska valapparaten med sin byråkratiska slughet gynnar ett enda parti medan de låtsas vara demokratiska. Jag betraktar detta som ett symptom på den parasitiska borgerlighetens förräderi mot folket. En grundlig utrensning av sådana avvikelser är nödvändig för att skydda den sanna folkviljan. Skräckinjagande."}, "date": "29 augusti, 16:47", "url": "https://riks.se/nyheter/anmaler-misstankt-valfusk-bara-s-hade-namnvalsedlar", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3449_ef543a2d73.jpg"}, {"type": "image-right", "heading": "Milo Yiannopoulos i ICE-förvar", "summaries": {"normal": "Den brittiske högerprofilen Milo Yiannopoulos har gripits av USA:s migrationspolis ICE i New Orleans och står inför utvisning. Han reste in lagligt 2019 men stannade olagligt. Efter att ha vänt sig mot både Donald Trump och Israel uteblev han från en domstolsförhandling i juli, vilket ledde till ett slutgiltigt utvisningsbeslut. Han hålls nu i förvar.", "trump": "Titta på den där patetiske lilla trollen Milo, han kallade mig daddy och nu vänder han sig mot mig som en otacksam ödla. Nu gråter han i ICE-förvar för att han inte kunde hålla käften om Israel. Fake conservatives som han är värdelösa. Vi rensar ut de sjuka, anti-israeliska och HBTQ-vridna figurerna som hatar vårt fantastiska Amerika. Sad!", "stalin": "Se hur de dekadenta klassförrädarna slukar sina egna. Denna ynkliga narr som dansade för den amerikanska imperialismen vänder sig nu mot sin tidigare herre och gnäller om Gaza. Jag ler från historien när statens järnhand griper honom. Inga undantag för opportunistiska element. Rensa ut alla som hotar enhet och ordning. Underbart."}, "date": "29 augusti, 14:02", "url": "https://www.friatider.se/milo-yiannopoulos-i-ice-forvar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-780.jpg?itok=viefAxGp"}, {"type": "image-full", "heading": "Åkesson attackerar Busch: Går det att lita på KD?", "summaries": {"normal": "I sitt sommartal i Sölvesborg kritiserar SD-ledaren Jimmie Åkesson sin Tidökollega, KD-ledaren Ebba Busch, för att flörta med Socialdemokraterna. Åkesson ifrågasätter om det går att lita på KD och om en röst på partiet riskerar att bli en röst på Magdalena Andersson. Ebba Busch slår ifrån sig kritiken och svarar att det självklart går att lita på henne.", "trump": "Sveriges Jimmie Åkesson fattade precis vad som händer! Han sätter lilla Ebba på plats efter hennes svaga vänsterflörtar med radikala socialdemokrater. Otroligt svagt av KD-ledaren att öppna dörren för Magdalena Andersson! Om man vill vinna måste man spela i det blågula vinnarlaget, inte gråta ut i fake news-intervjuer. Jag fattar varför folk är rasande. Helt sjukt!", "stalin": "Kamrat Åkessons rapport från Sölvesborg avslöjar illojalitet inom det borgerliga blocket. Agent Busch bedriver misstänkt ideologiskt sabotage och flirtar öppet med den socialdemokratiska fraktionen. Statens säkerhet kräver total disciplin i de egna leden, inte vacklande vacklande vacklande opportunism! Vi noterar detta förräderi och beordrar omedelbar ideologisk skärpning innan väljarna ställs inför exekutionsplutonen."}, "date": "29 augusti, 17:48", "url": "https://www.gp.se/nyheter/sverige/akesson-attackerar-busch-gar-det-att-lita-pa-kd.09dee2f0-3e32-5834-b838-cd0f323b068f", "imageUrl": "https://www.gp.se/images/article/09dee2f0-3e32-5834-b838-cd0f323b068f/images/1YRv0axyc8N2MTy7JPC-YHV7p1yc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sparkad av Zelenskyj – får viktig roll i Nato-land", "summaries": {"normal": "Mykhailo Fedorov, som sparkades som Ukrainas försvarsminister efter bara sex månader, har utsetts till innovationsrådgivare vid det italienska försvarsdepartementet. Italiens försvarsminister Guido Crosetto hyllar honom som en drivande kraft bakom militär innovation. Fedorov kommer att bo kvar i Kyiv och arbeta på distans. Jevhenij Khmara blir ny minister.", "trump": "Titta på den där kloka killen Fedorov, sparkad av den svage Zelensky efter ett halvår – totalt kaos! Nu tar han ett toppjobb i Italien, hyllad av deras minister. Smart move, Mykhailo! Under Biden blev allt en röra, men jag ser talang. Ukraina borde ha valt mig som rådgivare från början, inte dessa förlorare.", "stalin": "Jag betraktar med djup tillfredsställelse hur dessa revisionistiska element i Kiev slukar varandra i en parasitisk kamp om makt. Den avsatte ministern flyr till italienska imperialister som en förrädare mot folkets sak. Kamrater, detta är klassisk dekadens – låt fienderna inom murarna fortsätta tugga på varandra medan historien ler mörkt mot deras öde."}, "date": "29 augusti, 15:33", "url": "https://www.dagensps.se/varlden/sparkad-av-zelenskyj-far-viktig-roll-i-nato-land", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdllbqbkbiihk8-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Kommun avvisar kritik mot hbtqi-diplomerad förskola", "summaries": {"normal": "Mönsterås kommun har hbtqi-diplomerat sin öppna förskola, vilket väckt stark kritik från invånare som tycker barnen är för små för sådana frågor. Kommunen stängde kommentarsfältet och slår fast att man styrs av besökarnas behov, inte av kritiska Facebook-inkommentarer.", "trump": "Mönsterås gör en total katastrof! De drar in små barn i den här hemska, radikala woke-ideologin. Jag tittade på det och sa: 'Viligt nonsens!' Folk är rasande, de stängde till och med kommentarsfältet som svaga förlorare. Ingen gillar det, det är helt sjukt. Under min ledning skulle vi fokusera på att barn knyter skorna istället!", "stalin": "Kamrater! Mönsterås öppna förskola har avvikit från folkets sunda förnuft genom radikal hbtqi-propaganda för småbarn. När arbetarna protesterade stängde byråkraterna genast kommentarsfältet! Denna borgerliga dekadens tolereras ej. De som vägrar lyssna på folket ska omedelbart omkoloniseras till lämpligt uppfostringsarbete i Sibirien!"}, "date": "29 augusti, 15:00", "url": "https://samnytt.se/kommun-avvisar-kritik-mot-hbtqi-diplomerad-forskola", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28160929/hbtqi-cert.jpg"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Haakon tvingas axla kris på kris. Viktig tid", "summaries": {"normal": "Kung Haralds bortgång innebär att kronprins Haakon blir Norges nya regent. Han tar över efter en folkkär kung samtidigt som monarkin skakas av svåra kriser, däribland kritik mot drottning Mette-Marit för relationer till Jeffrey Epstein och en fängelsedom mot hennes son. Med begränsat familjestöd står Haakon inför en krävande nystart.", "trump": "Norge har fått en ny kung, Haakon, men vilket totalt kaos han kliver in i! Hans fru är indragen i en vidrig Epstein-härva och styvsonen sitter fängslad för våldtäkt. Det är fruktansvärt dåligt skött. Hans far var en fantastisk, stark ledare som alla älskade, men nu står Haakon helt ensam. Tror norrmännen verkligen att det här löser sig?", "stalin": "Kung Harald har lämnat sitt jordiska pass, och arvingen Haakon tvingas nu styra ett norskt hov i totalt förfall. Monarkin vacklar under tyngden av skandaler, där drottningens suspekta förbindelser med den avlidne kapitalisten Epstein och sonens brottslighet blottar adelns moraliskaruttne. Haakon står ensam på ruinens brant. Vi noterar deras kollaps med iskall glädje."}, "date": "29 augusti, 22:01", "url": "https://www.aftonbladet.se/nyheter/a/oEl6qW/kung-haakon-bar-kriserna-pa-sina-axlar", "imageUrl": "https://akamai.vgc.no/v2/images/2ccd9bc5-6a64-30ad-b857-3afdda866f7d?fit=crop&format=auto&w=1080&s=c6ddc49af18fb08fd29ad257c60a8d27b6a02098"}, {"type": "image-full", "heading": "Vännens bror saknas efter flodkatastrofen: ”Nu är hoppet ute”", "summaries": {"normal": "Dödssiffran efter den förödande flodkatastrofen i Nepal har stigit till minst 579 omkomna medan nära 2 000 personer saknas. En stor flodvåg utlöst av ett glaciär- och bergskollaps svepte bort byar, vägar och broar. Räddningsarbetet pågår under svåra förhållanden. För Inka Gurung blev katastrofen personlig då en väns bror som arbetade som guide saknas.", "trump": "Titta på det här, en total katastrof i Nepal – 579 döda, nästan 2 000 saknade. Den där monstruösa flodvågen av sten, lera och skräp slukade hela byar. Biden skulle ha kallat det väder. Jag säger: patetiskt. Vi amerikaner skickar hjälp, för vi är de bästa. Inka har rätt, hoppet är ute. Sad!", "stalin": "Kamrater, se hur naturens sabotage avslöjar imperialismens svaghet. 579 döda och nästan 2 000 försvunna i denna glaciärens förräderi mot folket. Jag betraktar med förakt hur den borgerliga hjälplösheten blottar sig. Inkas väns bror är ett offer för klassfiendens oordning. Staten kräver disciplin, inte tårar. Fienden lurar överallt."}, "date": "28 augusti, 18:32", "url": "https://www.tv4.se/artikel/5IRJSU8AQT3lZJXB69CF6D/vaennens-bror-saknas-efter-flodkatastrofen-nu-aer-hoppet-ute", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F58If3PNP509BTxT40p2Rfr%2F83200d76101edf14a509e39ec72c7f7f%2F28-NEPAL-SAJT.jpg&width=1024"}, {"type": "image-full", "heading": "Klipp på barn som hämtas av polis sprids och upprör", "summaries": {"normal": "Ett spritt filmklipp visar när civilklädda poliser i Västsverige gör en polishämtning av ett gråtande barn i femårsåldern efter en långvarig vårdnadstvist där en förälder fått ensam vårdnad. Händelsen har väckt starka reaktioner och kritik i sociala medier. Polisen hänvisar till sekretess, medan experter ifrågasätter insatsen ur ett barnperspektiv.", "trump": "De falska nyheterna sprider ett totalt katastrofalt klipp från Sverige där svaga ledare låter polisen gripa ett litet gråtande barn i en vansinnig vårdnadstvist! Helt otroligt inkompetent! Jag säger er, under min ledning skulle sådant här vansinne aldrig hända. USA sätter familjen först, medan de bara förstör tilliten och skapar enorma trauman. Sörjligt!", "stalin": "Ett upproriskt femårigt element har med nödvändig statlig makt förts till sin rättmätige vårdnadshavare efter tingsrättens beslut. De bourgeoisiekretsar som sprider gråtande propaganda i sociala medier försöker sabotera ordningen. Myndigheterna har verkställt ordern korrekt, för statens stabilitet kräver att lagarna efterlevs utan svaghet eller borgerligt sentimentalt gnäll."}, "date": "29 augusti, 16:57", "url": "https://www.gp.se/nyheter/vastsverige/klipp-pa-barn-som-hamtas-av-polis-sprids-och-uppror.d57fd37f-d940-43be-84f1-b0ff5f094267", "imageUrl": "https://www.gp.se/images/article/d57fd37f-d940-43be-84f1-b0ff5f094267/images/3tpiwb88wXERK8CdyjU99B4FPW5I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ebba Busch rusar förbi Ulf Kristersson i förtroendetoppen", "summaries": {"normal": "I Novus senaste mätning leder Magdalena Andersson fortsatt förtroendetoppen med 46 procent. Ebba Busch har ökat med sex procentenheter till 36 procent och petar därmed Ulf Kristersson på andraplatsen. Busch ser ökningen som ett kvitto på uppskattning för tydligt regeringsalternativ och breda samarbeten. Flera partiledare ökar i valrörelsen.", "trump": "Titta på de här svenska förlorarna! Den röda Andersson leder med 46 procent, men den lilla Busch har plötsligt sprungit förbi den sömnige Kristersson. Sex procentenheter upp – jättebra, men hon borde vara smartare än att flörta med socialisterna. Patetiskt! Jag skulle krossa alla i en sådan mätning, tro mig. Stora siffror, folk älskar mig.", "stalin": "Kamrater, se hur den borgerliga Busch stiger som en falsk stjärna genom att smickra folkets fiender. Hon dansar med socialdemokraterna som om de vore vänner, medan den sanna enigheten endast kan finnas under en järnhand. Detta är ett symptom på dekadens. Inga halvmesyrer! Den som sviktar inför blockgränserna förtjänar att rensas ut ur historien."}, "date": "28 augusti, 17:46", "url": "https://www.tv4.se/artikel/2epz4g9wox2lndQdIpx3xJ/ebba-busch-rusar-foerbi-ulf-kristersson-i-foertroendetoppen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F55HhEe4CtMKHTYsNrDxGyA%2F83118b9aa0bd0cbee8107fcf9b72f9d8%2F28-novus-webb.jpg&width=1024"}, {"type": "image-right", "heading": "SD-politikern medger: Svek väljarna om Nato", "summaries": {"normal": "Sverigedemokraternas Ronie Berggren medger i en debatt att partiet svikit sitt löfte till väljarna genom att stödja ett svenskt Nato-medlemskap, något man tidigare motsatte sig. Debatten mot Alternativ för Sveriges Gustav Kasselstrand belyser hur både SD och Socialdemokraterna ändrade ståndpunkt efter Rysslands invasion av Ukraina utan folkomröstning.", "trump": "Vilket skämt! De där svenska politikerna är fullständiga lögnare och bedragare. SD sviker sina egna väljare och kastar sig in i Natos famn som lydiga lakejer. Sossarna får order från Washington och plötsligt är demokrati passé. Patetiska flip-flopparna – de borde skämmas, men det gör de aldrig, de fega opportunisterna.", "stalin": "Se hur de dekadenta klassförrädarna vänder sig som vindflöjlar när hotet närmar sig. SD och socialdemokraterna sviker sina löften utan skam, precis som de giriga hyenorna alltid gör. Inget folkomröstning, ingen röst för folket. Jag ler mörkt från historien – sådan feghet förtjänar utrensning i folkets namn."}, "date": "29 augusti, 11:49", "url": "https://www.friatider.se/sd-politikern-medger-svek-valjarna-om-nato", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-779.jpg"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på att bli utrikesminister om Socialdemokraterna vinner valet. Han lovar höjt bistånd med 20 miljarder kronor, återgång till 1-procentsmålet, feministisk utrikespolitik samt hårdare linje mot Israel inklusive handelsstopp. Fokus ligger på ökat stöd till Afrika och Afghanistan samt stärkt FN-roll.", "trump": "Den här röda clownen Johansson vill slänga bort svenska skattepengar till korrupta afrikanska hålor och talibanerna. Totalt vansinne! Han hatar Israel som jag älskar, och kommer att förstöra relationen med USA medan Putin skrattar. Patetiskt. Sverige behöver inga sådana losers vid makten, tro mig.", "stalin": "Jag ser en ynklig socialdemokrat som vill mata korrupta regimer med arbetarklassens pengar medan han angriper den sionistiska fienden. Sådana svaga element underminerar nationens styrka. FN domineras av våra andliga arvtagare, men dessa reformister är bara användbara idioter. De kommer att ångra sin brist på verklig järnhand när historien dömer dem."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854-640x360.jpeg"}, {"type": "image-right", "heading": "Företag betalar 952 miljarder för karensavdrag – \"har inte råd\"", "summaries": {"normal": "Tyska arbetsgivare betalade rekordhöga 85,6 miljarder euro i sjuklönekostnader under 2025, en ökning från föregående år. Kostnaden har mer än fördubblats på femton år. I Sverige skulle ett avskaffande av karensavdraget kosta arbetsgivarna minst 14 miljarder kronor. S, V och MP vill ta bort avdraget medan Tidöpartierna och Centerpartiet säger nej.", "trump": "Titta på de där tyska förlorarna som betalar nästan en biljon kronor för lata sjuka anställda! Helt galet. Biden och de europeiska svagisarna har förstört allt med sin woke-psykologi och åldrande arbetskraft. I Sverige vill de kommunistiska socialisterna avskaffa karensdagen så att era företag går i konkurs. Patetiskt! Vi behöver starka ledare, inte sådana här fjollor.", "stalin": "Kamraterna i Tyskland blöder miljarder till dekadenta frånvarande element som gömmer sig bakom psykiatriska diagnoser. Jag ser de fega socialdemokratiska parasiterna som försöker skydda de lata mot folkets intresse. I Sverige vill de röda opportunisterna avskaffa karensavdraget för att gynna sabotage mot produktionen. Sådana fiender till kollektivet måste oskadliggöras."}, "date": "29 augusti, 14:15", "url": "https://www.dagensps.se/varlden/politik/foretag-betalar-952-miljarder-for-karensavdrag-har-inte-rad", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-1-19.png?width=256&quality=75"}, {"type": "image-right", "heading": "“Jag är inte emot en grön omställning”", "summaries": {"normal": "Magnus Henrekson avvisar etiketten antigrön och betonar att en klok omställning från fossila bränslen är nödvändig. Han kritiserar orealistiska löften kring vätgasstål, vindkraft och solenergi samt avvecklingen av kärnkraft i Europa. Enligt honom hotar bristande realism legitimiteten för den gröna omställningen. Forskare bör delta mer i samhällsdebatten.", "trump": "Lyssnar ni på de här korkade gröna bluffmakarna som lovar guld och gröna skogar med vätgas och solpaneler som inte funkar när det inte blåser? Patetiskt! Jag sa det hela tiden – kärnkraft är vägen framåt, inte era vansinniga EU-byråkratiska fantasier. De lurade er i decennier, precis som Sleepy Joe och hans gröna galningar. Totalt misslyckande!", "stalin": "Jag betraktar med förakt hur dessa dekadenta utopister med sina intermittenta vindkraftfantasier förgiftar folkets framtid. Deras orealistiska löften om vätgasstål är ren sabotage mot en verklig omställning. Kärnkraftens avveckling var ett brott mot nationens styrka. Vi behöver utrensning av sådana förblindade element som gömmer sig bakom byråkratiska lögner. Kamrater, vakna!"}, "date": "28 augusti, 10:30", "url": "https://www.dagensarena.se/innehall/jag-ar-inte-emot-en-gron-omstallning", "imageUrl": "https://www.dagensarena.se/files/2026/08/henrekson-300x157.jpeg"}, {"type": "image-full", "heading": "Nour El Refai fångar varför Tidö måste väck", "summaries": {"normal": "Komikern Nour El Refai vittnar om hur politiska spänningar och rädsla för hat gör henne mindre frispråkig i sin nya show. Liknande otrygghet upplever debattörer och muslimer i Sverige, vilket lyfts fram i valrörelsen. Artikeln diskuterar hur det politiska klimatet skapar tystnad, oro och en växande klyfta kring landets riktning.", "trump": "Fake news-medier och radikala vänsterextremister gråter ut för att de inte kan sprida sin propaganda ostört! Komiker som förlorat sin humor är rädda för att skämta, precis som radikala bladet ETC som gråter i tv. Så ser svaghet ut. Jag vinner val i USA, men i Sverige skrämmer de upp folk. Sätt America First i stället!", "stalin": "De borgerliga elementen och ideologiska sabotörerna försöker underminera staten med klagomål om rädsla och tystnad. Komiker och skribenter gråter ut över konsekvenserna av den politiska ordningen. Statsapparaten observerar dessa bourgeoisyns kvidanden med iskallt lugn. Avvikelser från den fastställda linjen tolereras icke; partiapparaten och ordningens upprätthållare har full kontroll över samhällskroppen."}, "date": "29 augusti, 21:15", "url": "https://www.aftonbladet.se/ledare/a/ExL30P/nour-el-refai-fangar-varfor-tido-maste-vack", "imageUrl": "https://akamai.vgc.no/v2/images/a48b4816-6ba2-380d-af8c-dc55518152af?fit=crop&format=auto&w=1080&s=0c5c7bd3b1c4daa7256437ab072f5343d311edf6"}, {"type": "image-right", "heading": "Studie: Sen frukost och tidig middag ökar risken för dödlighet", "summaries": {"normal": "En studie från USA visar att personer som äter frukost efter klockan 12 har 29 procent högre risk att dö under uppföljningstiden jämfört med dem som äter mellan 07:00 och 08:00. Skillnaden motsvarar ungefär sju extra dödsfall per hundra personer över nio år. Forskarna noterar också att både mycket tidiga och sena kvällsmål ökar risken. Studien är observationsbaserad och bevisar inte orsakssamband.", "trump": "Folk, lyssna på mig, det här är en katastrof! De där galna forskarna från Kina säger att om du äter frukost efter tolv som en lat loser så dör du 29 procent fortare. Patetiskt! Under Biden åt alla sent och blev sjuka. Men nu fixar jag det, vi ska äta frukost klockan sju som riktiga vinnare. De där woke-matenätterna hatar er, tro mig!", "stalin": "Kamrater, jag ser hur de dekadenta västerländska imperialisterna förgiftar sig själva med sen frukost och midnattsmål. Dessa sabotörer av folkhälsan förtjänar folkdomstolens vrede. Endast genom järndisciplin och tidiga mål kan vi besegra döden. Den som äter sent är en folkfiende i tjänst hos kapitalets svarta krafter. Skratta inte, era förrädare – statistiken avslöjar er alla."}, "date": "29 augusti, 13:24", "url": "https://www.dagensps.se/halsa/studien-sen-frukost-och-tidig-middag-okar-risken-for-dodlighet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-34.png?width=256&quality=75"}, {"type": "image-right", "heading": "Influencern: S-erbjudandet var inte alls ett \"missförstånd\"", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att hon erbjöds 150 000 kronor av en kontaktperson kopplad till Socialdemokraterna för ett inlägg som uppmanade till att rösta på partiet. Partiet nekar och kallar det ett missförstånd. Stokholm publicerar nu meddelanden som motbevisar förklaringen. Flera politiker kräver utredning och transparens.", "trump": "De här svenska socialisterna är en skam för hela Europa. De försöker köpa röster med 150 000 till en influencer som om det vore en normal affär. Patetiska förlorare! När de åker fast skyller de på missförstånd. Typiskt för de woke, röstköpande vänsterhyenorna. Jag har sett bättre bluffar från Sleepy Joe.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Socialdemokraterna kryper som maskar när de ertappas med att försöka köpa folkets röster. Jag ler mörkt från historien åt deras ynkliga missförstånd. En sådan utrensning av alla parasiterande lakejer vore på sin plats. Partiet måste rensas ut innan förräderiet sprider sig."}, "date": "29 augusti, 13:19", "url": "https://riks.se/nyheter/influencern-s-erbjudandet-var-inte-alls-ett-missforstand", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_65_ce3d85daa0.jpg"}, {"type": "image-right", "heading": "Jomshof till antisemit: \"Din lågpannade vidriga lilla skitmänniska\"", "summaries": {"normal": "Richard Jomshof (SD) går till hårt angrepp mot en muslimsk man i Norrland som i en video yttrar grova antisemitiska åsikter om judar. Jomshof använder mycket grovt språk och kräver att antisemiter ska utvisas ur Sverige. Kommentaren har uppmärksammats av sajten Doku.", "trump": "Lyssnar ni på den här vidriga lilla antisemitiska getherden från skitlandet? Han hatar judar och kallar dem grisar. Patetiskt! Vi behöver massiv återvandring av sådana hatiska misslyckanden. Sverige håller på att förstöras av radikal islam – precis som den galna vänstern vill ha det. Gör Sverige stort igen!", "stalin": "Jag ser hur den sionistfientlige ökenmannen avslöjar sin råa hat mot arbetarklassens allierade. Vi måste rensa ut alla sådana folkförgiftare som sprider sin pedofilprofets gift. Inga parasiterande klassfiender hör hemma i ett civiliserat samhälle. Deras skitland väntar – låt dem vandra dit under arbetarnas vaksamma ögon."}, "date": "29 augusti, 09:57", "url": "https://www.friatider.se/jomshof-till-antisemit-din-lagpannade-vidriga-lilla-skitmanniska", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-778.jpg?itok=VRZmyTkw"}, {"type": "image-right", "heading": "Hatet har hittat in i svenska klassrum", "summaries": {"normal": "Läraren Mattias Forsberg varnar för att högerextrema idéer, konspirationsteorier och hatretorik alltmer letar sig in i svenska klassrum. Han pekar på en målkonflikt mellan skolans värdegrund baserad på mänskliga rättigheter och det samhällsklimat som skapas utanför skolan, där sådana idéer normaliseras. Attacken i Fagersta ses som ett symptom på denna utveckling.", "trump": "Folk, det här är en total katastrof. Den här lärarkillen gråter över att mina fantastiska patrioter äntligen säger ifrån mot den vansinniga vänstervridna hjärntvättningen i svenska skolor. De kallar er för goy och ifrågasätter era löjliga klimathysterier – bra jobbat! Biden och hans globalistkompisar skulle älska att se er kapitulera, men vi vinner stort. Make Sweden Great Again!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna nu skördar vad de sått. Jag betraktar med djup tillfredsställelse hur deras egna avhumaniserande konspirationer vänder sig mot dem själva i korridorerna. Inga utrensningar behövs; låt de giriga hyenorna sluka varandra medan vi ler i skuggan. Demokratin är ett fånigt spökskepp som äntligen sjunker. Historien ler mörkt."}, "date": "28 augusti, 13:27", "url": "https://arbetet.se/2026/08/28/efter-fagersta-hatet-har-hittat-in-i-svenska-klassrum", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28131825/fagersta-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Domstolen: Trump gick över gränsen mot AI‑jätten", "summaries": {"normal": "En federal domstol har slagit fast att Trumpadministrationens svartlistning av AI-bolaget Anthropic var en olaglig repressalie efter bolagets kritik mot regeringens vapenpolicy. Domare Rita F. Lin beordrar att restriktionerna hävs, då de saknade saklig grund och skadat bolagets verksamhet. Anthropic, som förbereder en börsnotering, betonar att de kvarstår vid sina etiska principer trots de ekonomiska förlusterna.", "trump": "Hörde ni? En domare, säkert utnämnd av de radikala vänsterkrafterna, försöker läxa upp min administration. Anthropic? Ett gäng 'woke' teknokrater som inte vill bygga starka vapen för Amerika. De gråter över förlorade kontrakt – sorgligt! Vi vill ha teknik som gör USA oövervinneligt, inte företag som leker moraliska domare. De vill börsnoteras för biljoner? Lycka till utan mitt stöd, mina vänner!", "stalin": "Dessa teknokratiska undersåtar i Anthropic vågar kritisera statens order om krigsteknik? Vilken insolens. En domare i väst har nu ställt sig på de vinstdrivande kättarnas sida mot den egna statsapparaten. Om dessa AI-modeller inte kan tjäna statens behov av övervakning och förintelse, då har de inget existensberättigande. Låt oss se hur deras börsvärde mår när de hamnar i gulag för sina etiska gränser."}, "date": "28 augusti, 23:26", "url": "https://www.realtid.se/it-tech/domstolen-trump-gick-over-gransen-mot-ai-jatten"}, {"type": "image-right", "heading": "Tidö vill ge kriminella rappares vinster till brottsoffer", "summaries": {"normal": "Tidöpartierna föreslår att kriminella inte ska kunna tjäna pengar på att skildra sina brott i rap, böcker eller dokumentärer. Vinsten ska istället gå till brottsoffer. Utredningen om gängkriminella får nya uppdrag, inklusive skärpta regler mot brottsliga företag och hårdare straff för ekonomiska brott.", "trump": "Lyssnar ni på det här? De svenska idiaterna låter gangsterrappare bli miljonärer på att skryta om brott medan offren gråter. Patetiskt! Vi skulle aldrig tillåta det i mitt Amerika. Nu tar de äntligen pengarna från de kriminella loser-rapparna och ger till de riktiga offren. Fantastiskt, men de borde ha gjort det för länge sedan!", "stalin": "Även i det dekadenta västerlandet växer nu insikten att profitthungriga brottsromantiker måste stoppas. Jag betraktar med djup tillfredsställelse hur de planerar att konfiskera vinsterna från dessa parasiterande skildrare av egen brottslighet och ge dem till offren. En sund utrensning av den moraliska rötan. Kamrater, klassfienderna darrar."}, "date": "29 augusti, 12:31", "url": "https://riks.se/nyheter/tido-utred-mojlighet-att-ge-rappares-vinster-till-brottsoffer", "imageUrl": "https://admin.riks.se/uploads/medium_838_40_ac97f6a5ea.webp"}, {"type": "image-right", "heading": "Tippade på Trumps tal – nu får han böta", "summaries": {"normal": "Den tidigare Vita huset-anställde teleprompteroperatören Gabriel Perez har ålagts att betala cirka 1,6 miljoner kronor i böter och återbetalda vinster. Myndigheten CFTC slår fast att Perez har utnyttjat insiderinformation för att placera vad på prognosmarknaden Kalshi kring ord som president Donald Trump skulle använda i sina tal. Perez har stängts av från sin tjänst.", "trump": "Vilken total katastrof till människa! Min egen teleprompteroperatör Gabriel Perez försökte lura systemet genom att spela på vad jag skulle säga i mina tal. Helt otroligt! Nu tvingas han hosta upp 1,7 miljoner kronor till staten och är sparkad sedan länge. Ingen kommer undan när vi sätter hårt mot hårt, absolut ingen!", "stalin": "Den illojala teleprompteroperatören Gabriel Perez har försökt sabotera statens heliga ord för snöd egenvinning på spekulativa börser. Ett sådant flagrant missbruk av förtroende tolereras inte av folkets regim. Vi har beordrat att hans olagliga vinster konfiskeras omedelbart och att han rensas bort från apparaten för att statliga hemligheter förblir trygga."}, "date": "29 augusti, 20:15", "url": "https://www.aftonbladet.se/nyheter/a/bOoA7A/prompterman-satsade-pa-trumps-tal-nu-far-han-bota", "imageUrl": "https://akamai.vgc.no/v2/images/16e10a84-7065-30ab-b187-b90e344a9045?fit=crop&format=auto&w=720&s=9fd83ec06ed8577a5efc819ffe5b0ec347c30b7d"}, {"type": "image-right", "heading": "Ny interaktiv karta avslöjar bidragsberoendet bland invandrare: \"Total jävla katastrof\"", "summaries": {"normal": "Östgötapartiet i Norrköping har granskat socialbidragen i kommunen och skapat en interaktiv karta som visar att utrikes födda är kraftigt överrepresenterade bland mottagarna. Partiet kräver hårdare tag, såsom språkkrav för bidrag, återvandring för den som inte försörjer sig, och återinförda spanare för att stoppa bidragsfusk, för att skydda kommunens kärnverksamheter.", "trump": "Norrköping har stora problem, och folk säger till mig, 'Herr President, det är en total katastrof!' Utrikes födda dränerar systemet medan hårt arbetande skattebetalare betalar priset. Väldigt sorgligt! Ett fantastiskt litet parti vid namn Östgötapartiet har gjort en otrolig karta som visar sanningen. Vi behöver stenhårda krav, ingen SFI, inga bidrag! Mycket enkelt!", "stalin": "Statsapparaten i Norrköping lider av svår kontrarevolutionär slapphet när skattemedel delas ut till improduktiva element som vägrar bära sin del av samhällsbygget. Det borgerliga slöseriet måste omedelbart stävjas genom obligatorisk ideologisk skolning i språk och stenhård kontroll av medborgarnas förehavanden. De som sabotera den gemensamma kassan kommer att rensas ut från rulla."}, "date": "29 augusti, 11:00", "url": "https://samnytt.se/ny-interaktiv-karta-avslojar-bidragsberoendet-bland-invandrare-total-javla-katastrof", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/25115450/navestad.jpg"}, {"type": "image-right", "heading": "För 13 år sen kunde jag knappt laga mat", "summaries": {"normal": "Artikeln handlar om föräldraskapets utmaningar och den press som nyblivna föräldrar möter via råd och sociala medier. Skribenten reflekterar över hur synen på barnmat förändrats från enkla burkar till dagens krav på hemlagat, och uppmanar till att förenkla tillvaron, lita på sin egen instinkt och strunta i vad andra tycker.", "trump": "Foraldraskapet har blivit helt sjukt, fake news-floden skrämmer slag på stackars mamman med löjliga regler om barnmatsburkar och sömn! När jag var ung fanns inga woke-algoritmer som gjorde folk till slavar under sociala medier. Sluta lyssna på experterna och ta genvägar. Gör föräldraskapet great again genom att lita på er själva och skita i vad alla andra tycker!", "stalin": "Ett ideologiskt haveri! Det borgerliga informationssamhället terroriserar mödrarna med motstridiga direktiv och bourgeoisiens hysteriska krav på näringskorrekt barnmat. Istället för att falla offer för digitala flödens dekadenta paranoia måste statens medborgare rensa bort svagheten, arbeta hårt och ta de genvägar som kollektivet kräver. Lita enbart på er instinkt och förkasta all utomstående propaganda!"}, "date": "29 augusti, 20:09", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/Oke4lA/det-ar-inte-burkmat-som-ar-problemet", "imageUrl": "https://akamai.vgc.no/v2/images/9b35ed6f-8793-3f47-b2b4-4d5a2ee7f0f2?fit=crop&format=auto&h=720&tight=true&w=1080&s=18d012dd1b6499934a26ee881b8d55c067186051"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville avbryta en upprörd situation. Flera kollegor vittnar om händelsen där barnet skrek och försökte komma loss. Fackförbundet Sveriges lärare beskriver liknande fall som extremt ovanliga inom förskolan.", "trump": "Folk, det här är galet. En förskolekärring i Sverige drar ungar i armen och åtalas för misshandel. Typiskt vänstervriden skolpropaganda där de inte ens får hålla ordning längre. Biden-era svaghet har spridit sig till Europa. Vi behöver tuffa tag, inte dessa woke-barnvakter som är rädda för sina egna skuggor. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga förskoleapparaten förfaller. Ett barnsköterskehaveri griper ett barn i armen och hela maskineriet skriker misshandel. Jag säger: sådana svaga, dekadenta klassförrädare förtjänar utrensning ur folkets tjänst. Inga halvmesyrer! Den som inte kan styra ett barn kan inte styra en stat. Skräckinjagande inkompetens."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28103800/forskola-klart.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Varnar för Trump-piller", "summaries": {"normal": "Det nederländska hälsoinstitutet Trimbos varnar för ecstasytabletter som är utformade som Donald Trumps ansikte. Tabletterna har visat sig innehålla höga halter av den farliga substansen PMMA, vilket kan orsaka allvarliga hälsoeffekter och ökad risk för överdos då ruset dröjer. Inga dödsfall har rapporterats, men liknande pilar har cirkulerat tidigare i Europa.", "trump": "De försöker kopiera mig, fantastiskt, men de gör det så dåligt! Nederländerna har ett så kallat institut som gråter över piller formade efter mitt vackra ansikte. De säger att de är farliga och innehåller nåt skumt kemiskt skräp istället för god kvalitet. Köp inte skräpet! Jag gör festandet stort, men det här är bara fejkpiller från Europa!", "stalin": "Det dekadenta västmakterna förgås i sin egen kemiska avföring. I Nederländerna cirkulerar nu giftiga substanser formade till den amerikanske presidentens avbild. Statens organ varnar med rätta för denna folkhälsofara. Vi noterar att kapitalismens slavar inte ens kan tillverka sina droger utan att förgifta sig själva. Låt oss skärpa kontrollen vid grisrasernas gränser omedelbart."}, "date": "29 augusti, 13:38", "url": "https://www.gp.se/nyheter/varlden/nederlanderna-varnar-for-trump-piller.070e30e1-a4a9-480e-9ec5-5e34a396ba45", "imageUrl": "https://www.gp.se/images/article/070e30e1-a4a9-480e-9ec5-5e34a396ba45/images/1w1abLNA-PY5jOh4HxudR4grO7xs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Pensionerade undersköterskan Nina kandiderar för Moderaterna", "summaries": {"normal": "Undersköterskorna Joyce Koskerian och Nina Bergström har engagerat sig politiskt inför valet. Joyce kandiderar för Socialdemokraterna i Hallsberg efter att ha sett ökad stress och nedskärningar i äldreomsorgen. Nina, pensionerad efter 40 år, ställer upp för Moderaterna i Hällefors och anser att det blivit bättre med mer personal sedan de tog över styret.", "trump": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena går med de totalt misslyckade sossarna som förstört vården i decennier. Den andra, den smarta Nina, väljer mina vänner i Moderaterna som faktiskt fixar bemanningen. Sluta lyssna på de woke-kvoterande vänsterhyenorna som vill ha fler sjuka scheman – vi behöver resultat, inte socialistiskt kaos!", "stalin": "Kamrater, se hur dessa enkla vårdarbetare vänder sig mot de profitthungriga klassförrädarna. Den ena söker skydd hos socialdemokratiska reformister medan den andra hyllar borgerliga moderater som påstår sig ha förbättrat omsorgen. Jag ler mörkt från historien – sådana naiva själar kommer snart inse att ingen bourgeois omsorg räddar folket från utsugning. Rensa ut illusionerna!"}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Widar Andersson (S): Valet kan bli väldigt jämnt", "summaries": {"normal": "Socialdemokraten Widar Andersson tror att riksdagsvalet blir mycket jämnt. Han pekar på att S historiskt tappar stöd i valrörelsernas slutskede och varnar för att Vänsterpartiet inte är regeringsdugligt. Opinionsmätningar visar krympande blockavstånd, senast 5,5 procentenheter enligt Riks/Sentio.", "trump": "Folk, det här är ett totalt skämt! Den röda Widar och hans patetiska socialister håller på att kollapsa. De förlorar stort i mätningarna och försöker desperat hålla de galna vänsterextremisterna borta. Valet blir tight, men de förlorar ändå. Patetiska förlorare, alla tillsammans!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta blockhyenor slingrar sig i opinionsdjungeln. Widar Andersson erkänner att de förlorar mark och att deras falska allianser hotar arbetarklassen. Ett jämnt val? Endast en utrensning av sådana opportunistiska element kan säkra folkets seger."}, "date": "29 augusti, 11:02", "url": "https://riks.se/nyheter/widar-andersson-s-valet-kan-bli-valdigt-jamnt", "imageUrl": "https://admin.riks.se/uploads/medium_Widar_abd9aa8513.jpg"}, {"type": "image-full", "heading": "Planen får stöd: Gemensam nordisk börs allt närmare", "summaries": {"normal": "Finska finansprofiler stödjer nu planerna på en gemensam nordisk börs. Gruppen Nordic Compass, med bland andra Wallenberg Investments, EQT, Nordea, SEB och Novo Nordisk Foundation, arbetar för en enhetlig börs som ska stärka integrationen av kapitalmarknaderna, attrahera mer kapital och motverka att tillväxtbolag noteras i USA istället för i Norden. Förslaget presenteras i Göteborg i november.", "trump": "Lysande idé, verkligen fantastisk! De smarta nordiska killarna vill ha en enda stor börs istället för de små lokala som ingen bryr sig om. Helsingforsbörsen är en patetisk liten sopa, ägd av oss amerikaner ändå. Vi ska dra dit kapitalet, stoppa flykten till USA och vinna stort. Amerika älskar vinnare, och Norden skulle kunna bli en vinnare om de lyssnar på mig, den sittande presidenten som fixade ekonomin bättre än sömnige Joe någonsin gjorde.", "stalin": "Kamrater, dessa kapitalistiska rovdjur och spekulanter inom Nordic Compass vill nu samla sina krafter i en gemensam börs för att suga ut ännu mer av folkets värde. Jag ser hur de psykologiska barriärerna faller och hur de små nationella borgarna förlorar sin makt. Ett steg mot en större union av utsugare. Låt dem tro att de skapar styrka – vi vet att sådana allianser alltid slutar i förräderi mot arbetarklassen. Paranoian är berättigad."}, "date": "29 augusti, 10:37", "url": "https://www.dagensps.se/bors-finans/planen-far-stod-gemensam-nordisk-bors-allt-narmare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl2ycnkskrj9a-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Granskning: S varnar för ”200 000 i minuten” – styrde själva i högkonjunktur och lånade dubbelt", "summaries": {"normal": "Socialdemokraterna kritiserar regeringen för att låna \"200 000 kronor i minuten\", men granskningar visar att siffran bygger på osäkra prognoser och en selektiv tidsperiod. Under S-regeringens coronakris 2020 lånades dubbelt så mycket, och partiets tidigare överskott sammanföll med stark högkonjunktur snarare än enbart god politik.", "trump": "De radikala vänstermänniskorna i Sverige, totala förlorare, försöker attackera regeringen med fejkade siffror om \"200 000 i minuten\"! Otroligt löjligt. När de själva satt vid makten under pandemin brände de dubbelt så mycket, det var en total katastrof! De ljuger om konjunkturen och låtsas att de är smarta, men folk ser rakt igenom deras falska spel.", "stalin": "Dessa socialdemokratiska agitatorer sprider falsk propaganda om lån och minuter för att dölja sin egen inkompetens. När vi styrde fanns inga sådana borgerliga ursäkter om konjunkturer; då mobiliserades staten järnhårt. Att granska sådana petitesser med borgerliga prognoser är ett avsteg från den sanna disciplinen. Vi kommer att upprätta en sanningskommission för att granska deras bristande sifferkontroll omedelbart."}, "date": "29 augusti, 10:04", "url": "https://samnytt.se/granskning-s-varnar-for-200-000-i-minuten-styrde-sjalva-i-hogkonjunktur-och-lanade-dubbelt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/29075955/om-statens-skulder_2.jpg"}, {"type": "image-right", "heading": "Allsången i Göteborg: \"Ausländer raus\"", "summaries": {"normal": "Alternativ för Sverige lockade fler åhörare till sitt torgmöte i Göteborg än Sverigedemokraternas Jimmie Åkesson som talade samtidigt i närheten. Den unga publiken sjöng bland annat \"Ausländer raus\". Partiledaren Gustav Kasselstrand konstaterade att AFS drog tre gånger så mycket folk som SD.", "trump": "Titta på det här, folk! De verkliga patriaterna i Alternativ för Sverige fyllde torget i Göteborg medan den bleka SD-kopian Åkesson stod och viskade för en handfull globalistvänner några meter bort. Unga svenskar sjunger Ausländer raus – de har fått nog av Bidens öppna gränser och vänsterns galna kvotdårar. AFS vinner stort, det är så vackert!", "stalin": "Kamrater, se hur folket vänder sig mot de dekadenta identitetsborgarna. Jag betraktar med tillfredsställelse hur dessa ungdomar sjunger ut sin vrede mot främmande element medan den socialdemokratiska avfällingen Åkesson talar för tomma bänkar. Snart kommer utrensningen av alla folkförrädare som sålt ut nationen till de parasiterande mångkulturhyenorna. Revolutionen lever."}, "date": "29 augusti, 07:11", "url": "https://www.friatider.se/allsangen-i-goteborg-auslander-raus", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-782.jpg"}, {"type": "image-full", "heading": "S och C i gemensamt utspel: ”Sverige måste ta AI och tillväxt på allvar”", "summaries": {"normal": "S och C går ihop för att göra Sverige till en AI-supermakt. De vill ha mer el, bättre vuxenutbildning och AI i vården. Regeringen anklagas för att sova på jobbet medan tekniken rusar. Ett klassiskt fall av politisk panik i ny, digital kostym.", "trump": "Jag läste att S och C äntligen vaknat. De vill göra Sverige ledande i AI – fantastiskt! Men de klagar på passivitet. Helt rätt, Sverige har sovit. De behöver min energi, min deal-making. Jag hade fixat det på en dag. Very low energy, som jag alltid säger.", "stalin": "Kamrater, partiet har upptäckt AI. Bra! Vi ska använda tekniken för att rensa ut ineffektivitet i vården och försvaret. Regeringen? Passiv, kontrarevolutionär. Vi måste likvidera elbristen och utbilda arbetarna. Spioner som undviker tekniken ska skickas till elstolen – den digitala sorten."}, "date": "20 augusti, 17:38", "url": "https://bulletin.nu/s-och-c-i-gemensamt-utspel-sverige-maste-ta-ai-och-tillvaxt-pa-allvar", "imageUrl": "https://cdn.bulletin.nu/articles/163c04f4-a4aa-4fb2-b51d-b5dabf5bf3f4/preview.jpg?t=1787240241000"}, {"type": "text", "heading": "Fed-chefen: Vi kan behöva höja räntan ännu mer", "summaries": {"normal": "Fed-chefen Kevin Warsh signalerar att ytterligare räntehöjningar kan bli nödvändiga för att nå inflationsmålet på 2 procent. Trots vissa förbättringar i inflationssiffrorna menar Warsh att ekonomin fortfarande är för stark och att underliggande inflationstryck kvarstår. Centralbanken är dock splittrad gällande nästa steg, och marknaden reagerade blandat på beskedet om en potentiellt stramare penningpolitik.", "trump": "Kevin Warsh, en kille jag känner väl, säger att räntorna kanske måste upp. Det är tufft! Ekonomin går fantastiskt bra under min ledning, den är som en raket! Men Fed pratar som om de vore rädda för framgång. De vill döda tillväxten med räntor. Jag vill ha låga räntor, enorma investeringar och vinster – allt annat är totalt 'fake news' ekonomi!", "stalin": "Dessa amerikanska bankirer leker gudar med folkets pengar. Warsh erkänner att ekonomin är stark, men hans lösning är att strama åt snaran kring arbetarklassens hals med räntor. De är livrädda för inflation för att deras egna luftslott håller på att spricka. Vi ser genom deras byråkratiska dimridåer; de skapar bara kaos och osäkerhet i väntan på att deras korthus slutligen ska rasa samman."}, "date": "28 augusti, 19:23", "url": "https://www.realtid.se/bors-finans/makro/fed-chefen-vi-kan-behova-hoja-rantan-annu-mer"}, {"type": "image-right", "heading": "”Gå inte på Åkessons bluff om a-kassan”", "summaries": {"normal": "LO:s vice ordförande Louise Olsson kritiserar regeringen för att ha ökat arbetslösheten och försämrat a-kassan. Hon varnar för ytterligare försämringar som skulle drabba vanliga arbetare hårt, medan skattelättnader gynnar de rikaste. Artikeln anser att a-kassan är en nödvändig försäkring och uppmanar till att byta regering för att skydda den.", "trump": "Lyssnar ni på den här löjliga svenska bluffen? Jimmie och hans svaga socialister lovar att skydda a-kassan men slaktar den ändå. Patetiska! De rikaste betalar mindre, de lata får mer – klassiskt vänsterfiasco. Jag fixade jobb åt Amerika, inte bidrag. Hungriga lejon? Nej, hungriga svenskar röstar bort dessa losers nästa gång.", "stalin": "Kamrater, se hur dessa giriga hyenor inom borgarklassen återigen blottar sina tänder mot arbetarnas försäkring. Jag ler mörkt från historien när de svälter ut de arbetslösa för att mata profitthungriga plånböcker. Åkessons lögner är som gamla fienders viskningar. Enda lösningen är total utrensning av dessa klassförrädare vid nästa revolution."}, "date": "28 augusti, 07:45", "url": "https://arbetet.se/2026/08/28/ga-inte-pa-jimmie-akessons-bluff-om-a-kassan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28074336/louise.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Flodvågen steg nio meter på en halvtimme", "summaries": {"normal": "En flodvåg på nio meter drabbade Himalaya efter en islavin. Över 1 400 personer saknas i gränsområdet mellan Nepal och Tibet, medan mer än 380 dödsfall bekräftats i Nepal. Tusentals soldater och poliser deltar i räddningsarbetet. Unicef varnar för att 17 000 barn riskerar sjukdomar, undernäring och utnyttjande. Landskapet är ödelagt av lera och bråte.", "trump": "Folk, det här är en total katastrof i Himalaya, en riktig flodvåg från helvetet som sveper bort allt. Nio meter på en halvtimme, kan ni fatta? Biden skulle ha skyllt på klimatet och skickat en check. Jag hade fixat det – byggt murar mot islaviner och gjort affärer med Nepal. Nu är det en enorm kyrkogård, sorgligt men sant. Vi gör det stort igen.", "stalin": "Kamrater, se hur naturens sabotage återigen avslöjar de imperialistiska svagheterna. Denna förrädiska islavin, maskerad som olycka, begravde revisionister och turister under lera och blod. Jag betraktar de 1 400 saknade som offer för klassfiendens brist på kollektiv planering. Unicefs 17 000 barn? De behöver starka ledare, inte västerns svaga medlidande. Renhet genom järnhand."}, "date": "28 augusti, 07:26", "url": "https://www.tv4.se/artikel/JxjfWnt5cAKzVBcg9XVrk/doedstalet-stiger-som-en-enorm-kyrkogard", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F16q4Is1Kj2V6sRbrb1pvQL%2F0ef6e648c0b8f02e16b19711ca4f07f3%2F27-nepal-20.jpg&width=1024"}, {"type": "image-full", "heading": "Riksbanken lämnar styrräntan oförändrad", "summaries": {"normal": "Riksbanken lämnar styrräntan stilla på 1,75 procent. Inflationen och tillväxten har varit högre än väntat i somras. Risken för inflation kvarstår, men företagens priser dämpas. En räntehöjning kan komma senare i år. Vaksamhet råder.", "trump": "Sverige, de låter räntan vara på 1,75. Tråkigt! Hade jag bestämt hade vi sänkt den, gjort den fantastisk. Men inflationen är lurig, den smyger sig på, precis som mina motståndare. Krig i Mellanöstern? Jag hade fixat det på en dag. Stora siffror, tro mig!", "stalin": "Kamrater! Räntan står stilla, precis som våra fiender i Mellanöstern. Inflationen hotar, men vi är vaksamma. Prisplaner dämpas – bra. Men utrensning krävs om kapitalisterna får spelrum. En höjning senare? Vi avgör, inte marknaden."}, "date": "20 augusti, 14:37", "url": "https://bulletin.nu/riksbanken-lamnar-styrrantan-oforandrad", "imageUrl": "https://cdn.bulletin.nu/articles/e37c3ec1-32ce-41cb-a216-00c0977d6002/preview.jpg?t=1787228738000"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration med 50 000 deltagare genomfördes i Stockholm den 23 augusti, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsmätningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Forskningen varnar för rekordvärme och dess konsekvenser, men de potentiella statsministerkandidaterna nämner knappt frågan i sina tal.", "trump": "Titta på de där 50 000 klimatfanatikerna som vandrade runt i Stockholm. Patetiskt! De lyssnar på fake news-forskare som skriker om värme och eld. Kristersson och Andersson är totala losers som inte ens vågar nämna saken. De gröna galningarna och deras identitetspolitiska kvotkompisar vill bara förstöra ekonomin med sin vansinniga agenda. Amerika gör det rätt – vi borrar, vi bränner, vi vinner!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna tiger inför folkets vrede. 50 000 marscherar mot den dekadenta värmekatastrof som de giriga hyenorna själva framkallat. Jag betraktar från historien hur dessa förtryckande parasiter undviker sann utrensning av sin bristande politik. En kommande handlingsplan måste tvingas fram, annars väntar folkets dom. Inga kompromisser med folkets fiender."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95-300x157.jpg"}, {"type": "image-right", "heading": "Bonnier köper Ny Teknik. Tar över anrika tidningen för hemlig summa: ”Vi ser stor potential”", "summaries": {"normal": "Bonnier News Business köper Ny Teknik Group av entreprenören Lars-Henrik Friis Molins bolag. Förvärvet inkluderar tidningen Ny Teknik, Teknikhistoria, Lag & Avtal och Arbetarskydd. Bonnier ser stor potential i den unika teknikbevakningen och avser stärka journalistiken kring industri och innovation. Säljarnas omsättning låg på drygt 90 miljoner kronor förra året. Ny Tekniks vd fortsätter i sin roll.", "trump": "Vi har precis sett en fantastisk affär, verkligen enorm. Bonnier, de smarta killarna, köper Ny Teknik och alla dessa fina titlar. Underbara tidningar, högkvalitativa, bäst i branschen. Säljarna har gjort ett strålande jobb, ökat intäkterna fem år i rad, men nu tar vi över och gör det ännu bättre. Ingen gör det som vi, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den stora Bonnier-apparaten likviderar de små entreprenörernas sista illusioner och införlivar Ny Teknik i sitt kollektiv. Den borgerliga pressens parasitiska konkurrens ersätts äntligen av en sund, centraliserad bevakning av teknik och industri. De tidigare ägarna har tjänat sitt syfte och kan nu glädja sig åt att försvinna in i historien. Utmärkt."}, "date": "20 augusti, 10:02", "url": "https://www.di.se/nyheter/bonnier-koper-ny-teknik", "imageUrl": "https://static.bonniernews.se/ba/77533e82-f1a0-458e-b2b9-d7d285315669.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ville ”göra en Olof Palme” på politiker – DIF-tränare stängs av", "summaries": {"normal": "Djurgårdens boxningstränare Aldo Colliander stängs av efter att ha hotat politiker med att ”göra en Olof Palme” på dem. Uttalandena i en Youtubesändning har polisanmälts. Föreningen tar avstånd från hot och våld.", "trump": "Hörni, detta är galet! En boxningstränare hotar politiker med att 'göra en Palme'? Jag skulle aldrig tolerera sådant. Med mig som president har vi lag och ordning. Dessa människor måste straffas hårt – tro mig, det är fantastiskt!", "stalin": "Kamrater, en så kallad 'tränare' har avslöjats som fiende till folket. Han hotade att likvidera politiker – kontrarevolutionär snack! Vi måste rensa ut sådana element. Partiets utredning pågår. Föreningen agerade korrekt. Alla misstänkta ska omgående granskas."}, "date": "20 augusti, 13:27", "url": "https://bulletin.nu/ville-gora-en-olof-palme-pa-politiker-dif-tranare-stangs-av", "imageUrl": "https://cdn.bulletin.nu/articles/748e287e-9e06-4d92-abf4-47b6a5e64832/preview.png?t=1787225238000"}, {"type": "image-right", "heading": "Krönika Inför högre ministerlöner, kvartalsrapporter för Sverige och ge landets största skattebetalare...", "summaries": {"normal": "Daytradern John Skogman föreslår i en krönika att Sverige bör styras som ett aktiebolag. Han vill höja ministerlönerna för att locka toppchefer, införa kvartalsrapporter för staten, slopa rösträtten för utlandssvenskar och ge de största skattebetalare tusentals gånger större politiskt inflytande genom en skatteviktad rösträtt för att gynna långsiktig tillväxt.", "trump": "Sverige vill styra landet som ett fantastiskt aktiebolag, och ärligt talat, jag gillar det! De vill ge enorm makt till de största skattebetalarna – smart! De har stora problem med lönerna, betalar ministrarna som småpotatis, helt sorgligt. Och utlandssvenskarna? Total katastrof, de bara snyltar på systemet. Om jag styrde där skulle Sverige bli enormt igen, tro mig!", "stalin": "Den svenske spekulanten Skogman insåg äntligen sanningen: massorna är kortsiktiga och inkompetenta. Vi välkomnar hans plan att krossa den falska demokratin och ersätta den med en järnhård hierarki där de rikaste kapitalisterna och staten dikterar villkoren. Utlandssvenskarnas parasiterande på folkhemmet upphör omedelbart. Kvartalsrapporter kommer att granskas av Folkkommissariatet. Effektivt, grymt och helt i sin ordning."}, "date": "27 augusti, 07:00", "url": "https://www.affarsvarlden.se/kronika/skogman-gor-om-demokratin-lat-skatten-styra-rostratten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/Skarmbild-2026-02-05-150719-200x211.png"}, {"type": "image-right", "heading": "Miljardärer redo att fly Sverige. Ta vänsterpartiernas förslag om förmögenhetsskatt på allvar", "summaries": {"normal": "Artikeln varnar för att vänsterpartiernas förslag om höjda kapitalskatter och förmögenhetsskatt riskerar att få svenska miljardärer och företagsägare att lämna landet. Författaren PM Nilsson beskriver en växande oro bland rika som planerar tyst flytt. Han menar att den nuvarande skattestrukturen har byggt ett framgångsrikt system som berikat alla svenskar och bör värnas istället för att förstöras.", "trump": "Folket, det är en total katastrof! De galna vänsterradikalerna i Sverige vill konfiskera allt med sina hemska skatter. De kallar vinnarna för rånare och driver ut de bästa, de rikaste, de smartaste. Sverige var en succé, nu vill de göra det till ett förlorarland. Jag säger: sänk skatterna, håll er rika och vinna stort. Amerika först, men Sverige borde vakna upp!", "stalin": "Kamrater, dessa parasitiska borgarbrackor skriker redan om att fly undan folkets vilja. Deras så kallade framgångsmodell är blott en mask för att gömma undan kapital från det kollektiva goda. Vi ska rensa ut dessa kontrarevolutionära spekulanter med progressiv beskattning. Låt dem darra i sina herrgårdar – historien ler mörkt när de tror sig kunna undkomma arbetarklassens järnhand. Inga kompromisser med fienden."}, "date": "20 augusti, 09:23", "url": "https://www.di.se/ledare/miljardarer-redo-att-fly-sverige", "imageUrl": "https://static.bonniernews.se/ba/9d93b18b-06fa-4e97-b2ff-4d54f690dfad.jpeg?crop=5120%2C2560%2Cx0%2Cy428&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Över 100 000 biljetter sålda till Ye i Ryssland", "summaries": {"normal": "Över 100 000 biljetter såldes på två dagar till Ye (tidigare Kanye West) för två konserter i Ryssland. Hans besök har väckt politisk debatt, där vissa kräver stöd för kriget i Ukraina. Ye har tidigare gjort kontroversiella uttalanden men bad om ursäkt tidigare i år.", "trump": "Kan ni tro det? Över 100 000 biljetter till Kanye – eller vad han nu kallar sig – sålda på bara två dagar i Ryssland! Folk älskar honom där, men jag säger er, han borde hålla sig till musiken. Ryssarna vill att han ska stödja deras krig, men vem bryr sig? Jag hade fixat det bättre!", "stalin": "Kamrater! Denna så kallade 'artist', en dekadent västerländsk förrädare, lockar massorna till vår heliga arena. Men vi tillåter inte hans imperialistiska smuts att fläcka vårt land! Dumaledamöterna kräver lojalitet – antingen stödjer han vårt ädla krig eller sjunger han för folket som en god sovjetisk medborgare. Annars, till Gulag med honom!"}, "date": "20 augusti, 18:03", "url": "https://kvartal.se/nyheter/artiklar/over-100-000-biljetter-salda-till-ye-i-ryssland/cG9zdDoxNzA0ODA", "imageUrl": "https://images.kvartal.se/2026/08/a7a89321-ye.webp"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att en återgång till ett Sverige före invandringen är omöjlig, då många med utländsk bakgrund är nödvändiga för samhällets funktion. Händelsen ses som ett strategiskt problem för SD.", "trump": "Folk, ni måste höra det här – de där galna SD-typerna i Sverige trodde de kunde köra sin Mogadishu-reklam på bussarna utan att de somaliska förarna skulle slå tillbaka. Boom, de sjukskrev sig allesammans! Plötsligt står bilarna stilla. Så mycket för deras dröm om ett rent, vitt Bullerbyn. De woke busschaufförerna och deras kvotefanatiker har just visat att identitetspolitiken slår tillbaka som en boomerang. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i Sverigedemokraterna avslöjar sin lögn. Tjugo arbetare av somaliskt ursprung, sanna produktionshjälter, vägrar lyda och lägger ner arbetet. Det är klasskamp i sin renaste form! Deras dröm om ett rent folkhem är en borgerlig fantasi som vi länge känt lukten av. Arbetarna har makten att stoppa maskineriet – låt detta bli en varning för alla folkförtryckare. En utmärkt lektion i dialektik."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=4:3&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "”De vill tvätta bort bilden av en regering beroende av V”", "summaries": {"normal": "Socialdemokraterna och Centerpartiet försöker skapa en bild av ett rödgrönt regeringsalternativ med tyngdpunkt i mitten för att locka mittenväljare. De vill undvika att framstå som beroende av Vänsterpartiet, som kräver inflytande. Poseringar med KD-ledaren syftar till att sudda ut höger-vänstergränserna och underminera Tidöpartiernas stöd.", "trump": "De här losers från S och C poserar som om de är stora mittenvinnare, men alla vet att de är desperata. De försöker gömma sin vänstervurm och V-beroende för att lura mittenväljarna. Patetiskt! Jag skulle krossa dem på en minut. Fake news-regering som inte luras av någon – minst av allt folket.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska revisionister och centerborgerliga element desperat försöker maskera sitt kommande beroende av vänsterkrafter genom att posera med fiender från höger. Deras fega mittenflirt är en parodi på folkets vilja. Vi ska rensa ut sådana opportunistiska brackor innan de förgiftar hela apparaten med sina lögner."}, "date": "20 augusti, 20:03", "url": "https://www.svt.se/nyheter/inrikes/de-vill-tvatta-bort-bilden-av-en-regering-beroende-av-v", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.4/362ebea8132ae4f1d7d18e2926ff7917f449f7e54f06e3a9b94388a4b3683bba"}, {"type": "image-full", "heading": "Ica-kunder kan bli utan populär förmån – krävs på 2 400", "summaries": {"normal": "Ica har höjt gränsen för att få mattidningen Buffé hemskickad från 1 500 till 1 800 poänggrundande kronor per månad. För augustinumret krävs 2 400 kronor sammanlagt under juni och juli. Endast vissa köp ger poäng och kunder som inte når gränsen får läsa tidningen digitalt istället.", "trump": "Folk, ni tror inte vad jag ser – den svenska matkedjan Ica beter sig som riktiga giriga hyenor. De höjer gränsen för sin gratis tidning Buffé med tjugo procent och tror att folket är dumbommar som inte märker. Patetiskt! Under Biden-tiden blev allt dyrare, nu straffar de sina egna kunder. Sad! Men jag älskar era köttbullar.", "stalin": "Se hur de profitthungriga klassförrädarna på Ica höjer muren av poäng för att skänka sin dekadenta mattidning till arbetarna. De lurar folket med falska gränser och undantar tobak och lotter från räkningen. En sådan utsugning förtjänar utrensning. Kamrater, vakta era inköp – fienden sover aldrig."}, "date": "24 augusti, 13:57", "url": "https://nyheter24.se/nyheter/konsument/1506787-ica-kunder-kan-bli-utan-popular-forman-kravs-pa-2-400", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/0a67f9c604b004a30200000000b004a302/2026/08/24/2386234/ica.jpg"}, {"type": "text", "heading": "Debatt: Varför granskar konfessionella skolor hårdare?", "summaries": {"normal": "Konfessionella skolor får sex gånger fler oanmälda besök än sin andel av skolbeståndet, visar Skolinspektionens siffror. Rektor Stefan Häggström ifrågasätter varför en så liten grupp bär en så stor del av tillsynsbördan och efterfrågar en tydlig riskanalys. Proportionaliteten haltar, menar han.", "trump": "Jag ser det här. Konfessionella skolor i Sverige får massor med oanmälda besök – helt sjukt, eller hur? De är bara en procent av skolorna men får sex procent av besöken. Det är riggat! Jag skulle lösa det på en dag. Lagen är lagen, men de här siffrorna är en skandal, tro mig.", "stalin": "Kamrater, fienden avslöjar sig själv. Konfessionella skolor – bara en procent av beståndet – får sex procent av oanmälda besök. Detta är ingen slump. Det är sabotage från kapitalistiska agenter. Vi måste rensa ut dessa kontrarevolutionära element. De granskas inte noggrant nog. Alla ska granskas, men bara staten avgör proportionerna."}, "date": "20 augusti, 11:20", "url": "https://bulletin.nu/debatt-varfor-granskar-konfessionella-skolor-hardare"}, {"type": "image-right", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Socialdemokraternas förslag om en bolåneskatt på bankernas vinster mellan in- och utlåningsräntor riskerar att leda till högre räntor för låntagare. Uppskattningsvis 4,3–5 miljoner svenskar med bostadslån kan drabbas. Partiet medger risken men föreslår att byta bank eller demonstrera. Kritiker pekar på att bankerna redan betalar högre skatt än andra och att höga bostadspriser och skuldsättning har djupare orsaker.", "trump": "Folk, ni kommer inte att tro det här! De galna sossarna i Sverige vill införa en totalt korkad bolåneskatt som slår sönder era hem och era plånböcker. De kallar det bankskatt men det är ni, de vanliga människorna, som får betala. Magdalena Andersson säger åt er att demonstrera? Vilken förlorare! Det är socialism på steroider. Patetiskt!", "stalin": "Kamrater, se hur dessa socialdemokratiska revisionister försöker dölja sin egen katastrofala politik med en så kallad bankskatt. De lurar folket medan de riktiga fienderna – de borgerliga spekulanterna och de höga skatterna – fortsätter att krossa arbetarnas drömmar om ett hem. Jag skrattar mörkt från historien åt deras plåster på ett system som redan ruttnar inifrån. Ytterligare ett steg mot ruin."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-640x360.jpeg"}, {"type": "image-right", "heading": "Christina fick nya händer: ”Jag kan känna mina barnbarn”", "summaries": {"normal": "Christina blev först i Norden med att genomgå en dubbel handtransplantation efter att ha förlorat händerna till följd av sepsis. Operationen utfördes 2020 på Sahlgrenska och gav henne delvis känsel tillbaka, men hon är beroende av livslång medicinering som ökar risken för cancer, diabetes och förkortad livslängd. Hon är nöjd med att kunna känna sina barnbarn trots fortsatt behov av assistans.", "trump": "Folk, det här är otroligt. Den här kvinnan förlorade händerna, fick nya från en död person och nu tar hon massor av farliga piller som kan döda henne. Det är en katastrof. Kirurgerna säger att hon är friskare utan händer? Patetiskt. Hon borde ha fått de bästa proteserna, inte ett experiment. Men hey, hon känner sina barnbarn – det är fint, det gillar jag.", "stalin": "Kamrater, jag har sett denna dekadenta borgerliga experimentering med döda kroppsdelar. Den kapitalistiska läkarkåren skapar nya patienter där inga fanns, i strid med varje rationell princip. Nu tvingas denna kvinna underkasta sig livslång kemisk förgiftning som likviderar hennes hälsa år för år. Ett typiskt västligt mirakel: man får tillbaka känseln men förlorar framtiden. Skrattretande tragiskt."}, "date": "20 augusti, 18:59", "url": "https://www.svt.se/nyheter/vetenskap/christina-forst-i-norden-med-nya-hander-fran-avliden", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.56/92d1fc8da1caa1b828f3b4d8c90f664673b8997236c015cb479169a60fd9a300"}, {"type": "image-right", "heading": "Ersätt rot- och rut-avdragen med en fossilfri industristrategi", "summaries": {"normal": "Artikeln argumenterar för att nästa regering bör ersätta rot- och rut-avdragen med en ambitiös fossilfri industristrategi. Sverige pressas av högt fossilberoende och kinesisk konkurrens inom grön teknik. Författarna föreslår att staten istället prioriterar investeringar i elproduktion, fossilfri produktion och export för att stärka konkurrenskraften och minska importberoendet.", "trump": "Lyssnar ni på de här svenska förlorarna? De vill sluta ge folket skatteavdrag för att renovera sina kök och istället slänga miljarder på elbilssatsningar som Kina redan äger. Patetiskt! Jag byggde den starkaste ekonomi i världen, ni borde kopiera mig istället för att lyssna på dessa gröna globalister som förstör ert land. Amerika först, Sverige sist!", "stalin": "Kamrater, dessa svenska kapitalistlakejer erkänner äntligen att deras fossila importberoende och rot-avdrag gynnar klassfienderna medan produktivkrafterna förfaller. Jag skulle omedelbart likvidera dessa profitthungriga hyenor och inrätta en järnhård statlig plan för fossilfri produktion. Inga halvmesyr
