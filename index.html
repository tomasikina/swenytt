kiner, de största och bästa maskinerna världen någonsin skådat. America First, mina vänner. Vi gör USA till en robot-supermakt igen, tro mig!", "stalin": "De amerikanska imperialisterna darrar. De bygger murar av tullar mot de kinesiska maskinerna, men de glömmer att en stat utan egen produktion är en stat av sand. De desperata byråkraterna i Washington försöker nu tvinga fram en industri som de för länge sedan förlorat kontrollen över. Planekonomi är det enda sättet att vinna, men de vägrar förstå det. Sorgligt."}, "date": "2 september, 22:48", "url": "https://www.realtid.se/it-tech/sa-forsoker-usa-bryta-kinas-grepp-om-dronare-och-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/dronare-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Åkessons nya ord om L efter deadline: ”Går i rätt riktning”", "summaries": {"normal": "Med tio dagar kvar till valet löper Jimmie Åkessons deadline för Liberalerna ut. Trots en Novusmätning som visar L på 3,3 procent vill SD-ledaren inte ge något besked. Han ser en positiv trend men anser att fler mätningar behövs för att avgöra om partiet når riksdagsspärren utan stödröster.", "trump": "Titta på den där stackars Jimmie, han har gett de patetiska liberalerna en deadline och nu kryper de upp till 3,3 procent. Patetiskt! Det går i rätt riktning säger han, men han väntar på fler mätningar. Typiskt svenskt fegspel. Jag skulle ha krossat dem för länge sedan, tro mig.", "stalin": "Jag betraktar med förakt hur dessa borgerliga opportunister dansar kring en dödlinje som en rädd hare. Liberalerna kryper mot spärren, men Åkesson drar ut på domen. Fler mätningar, säger han. Som om siffror inte kunde förfalskas av fiender inom partiet. Inga kompromisser med klassfienden. Renhet eller döden."}, "date": "3 september, 11:39", "url": "https://www.tv4.se/artikel/2n39wFsC8LwcGKVbyFrHe5/akessons-nya-ord-om-l-efter-deadline-gar-i-raett-riktning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1VGeLJdKEiI8KEUirosWfp%2F75faad1c2af29007fae73c37ca887354%2F03-akessonl-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Ny kalldusch: Varken sunt eller normalt", "summaries": {"normal": "Världens räntor och energipriser stiger snabbt till de högsta nivåerna på nästan tjugo år, drivet av bland annat kriget i Iran, stora statsskulder och AI-boomen. Era av nollräntor framstår som en historisk parentes. För ett räntekänsligt land som Sverige innebär detta dyrare lån, vilket markerar en återgång till mer normala historiska räntenivåer efter tjugotalets lågräntechock.", "trump": "De skyhöga räntorna och oljepriserna beror på radikala misslyckanden och kriget i Iran, som jag snabbt ska få ordning på. Alla pratar om inflation, men min politik med America First och lägre skatter kommer att krossa kostnaderna. Lågränteåren under svaga politiker var ett skämt – nu sätter vi hårt mot hårt och gör ekonomin stark igen!", "stalin": "Det kapitalistiska väst skakar under sina egna skulder och misslyckade krig i Iran, precis som det anstår ett dekadent system. När räntorna skenar och statskassorna töms på grund av planlös spekulation och AI-hysteri, blottas marknadsekonomins fallit. Statens järnhand måste snarast strama åt tyglarna och eliminera varje tillbud till borgerlig ekonomisk oordning."}, "date": "3 september, 21:51", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/OkPa31/rantorna-i-varlden-stiger-snabbt", "imageUrl": "https://akamai.vgc.no/v2/images/e6b5f6e0-fba8-3aa1-9abc-1cf4e40da847?fit=crop&format=auto&w=1080&s=44d5df4977e6be68e93971b4eb0008700f4aae1f"}, {"type": "image-full", "heading": "Deltog i insatsen: ”Är jättehemskt”", "summaries": {"normal": "En kvinna i 60-årsåldern omkom i en dykolycka vid Lerkils badplats utanför Kungsbacka under onsdagskvällen. En omfattande räddningsinsats med räddningspersonal, dykare, båtar och helikopter sattes in efter att paret gett sig ut för att dyka i mörker och blåsigt väder. Polisen har inlett en förundersökning om vållande till annans död.", "trump": "Sverige, underbara Sverige, de har stora problem med sina badplatser. De ringer mig och säger: Donald, en hemsk dykolycka, totalt kaos. Blåljus överallt, helikoptrar, och folk hoppar i vattnet i mörkret! Väderförhållandena var fruktansvärda, totalt inkompetent planering. De borde lyssna på mig, jag hade ordnat säkrare dykning på en sekund. Tragiskt, men så är det!", "stalin": "En kvinna har avlidit under misstänkta omständigheter i vattnen vid Lerkils badplats, efter att ha ignorerat statens och väderlekens lagar genom att nattdyka i hård vind. Ett massivt och kostsamt räddningspådrag sattes omedelbart in av Folkets tjänare. Vår säkerhetstjänst granskar nu om detta var en olycka eller ett sabotage mot kollektivets lugn. Inga ursäkter accepteras."}, "date": "3 september, 21:22", "url": "https://www.aftonbladet.se/nyheter/a/6q1558/batagaren-deltog-i-raddningsinsatsen-i-lerkil", "imageUrl": "https://akamai.vgc.no/v2/images/8d457bb9-b54e-3ba2-a0bc-637d9903ef28?fit=crop&format=auto&w=1440&s=56797d33f4b1bc493d1b75fc4a9a841b2eaa1047"}, {"type": "image-right", "heading": "Fröken Snusk släpper låt riktad mot Nooshi Dadgostar", "summaries": {"normal": "Artisten Fröken Snusk och Louise Andersson Bodin har släppt låten ”Om du frågar Nooshi”, producerad av Rasmus Gozzi. Låten riktar sig mot Vänsterpartiets ledare Nooshi Dadgostar och kritiserar hårt partimodellens syn på straff för grova brott. Släppet sker under en pågående valrörelse där Fröken Snusk sammankopplats med Sverigedemokraterna, trots att hon inte uppgettpartitillhörighet.", "trump": "Vänsterpartiets socialistiska ledare Nooshi Dadgostar blir totalt uthängd av den maskerade maskinen Fröken Snusk och Louise Andersson Bodin i en dundersuccé till låt! Hennes radikala politik ger ju kriminella rena drömrabatterna. Totalt katastrofalt och svagt! Medan jag bygger ett starkt Amerika försöker de här radikalerna släppa ut gängkriminella. Fake news-vänstern kan inte stoppa vinnare!", "stalin": "Kamrat Dadgostar utsätts för grov illojalitet av den maskerade artisten Fröken Snusk och hennes medbrottslingar i en skadlig kulturprodukt. Att förlöjliga statens rättssystem och strafflagar är ett sabotage mot ordningen. Vi noterar detta borgerliga spektakel under valrörelsen. Sådana subversiva element bör snarast omhändertas och granskas av partiets lojala utskott för ideologisk renhet."}, "date": "3 september, 19:03", "url": "https://bulletin.nu/froken-snusk-slapper-lat-riktad-mot-nooshi-dadgostar", "imageUrl": "https://cdn.bulletin.nu/articles/32cf9e3a-e091-4b3f-b4cd-64de42d1274f/preview.png?t=1788449979000"}, {"type": "image-right", "heading": "Ny opinionsmätning: Lyft för L. Men ligger alltjämt under riksdagsspärren", "summaries": {"normal": "En ny opinionsmätning från Verian för SVT visar att Liberalerna stiger till 3,0 procent, en ökning med 1,1 procentenheter, men ligger fortfarande under riksdagsspärren. Socialdemokraterna backar till 29,2 procent. Oppositionen har ett försprång på 8,2 procentenheter jämfört med Tidöpartierna. Mätningen genomfördes 20 augusti–2 september.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Liberalerna kryper upp till ynka 3 procent och tror de är stora. Patetiskt. Socialdemokraterna rasar som en socialistisk luftballong. Oppositionen leder stort – bra. Men de behöver en riktig ledare, inte dessa veklingar som böjer sig för varje galen HBTQ-lobby och kvotfeminister. Valet är inte avgjort, kamrater!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar! Liberalerna klättrar mot spärren som förtvivlade råttor medan Socialdemokraterna sjunker som förbrukade redskap. Oppositionen har övertaget, men det är en illusion skapad av giriga hyenor. Inget är avgjort. Jag skulle redan ha inlett utrensningen av dessa opålitliga element innan de förgiftar hela folkets vilja."}, "date": "3 september, 17:14", "url": "https://www.di.se/nyheter/ny-opinionsmatning-lyft-for-l", "imageUrl": "https://static.bonniernews.se/ba/61bb2124-1e1e-4be2-9585-f2806e0fee8f.jpeg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kasselstrand togs emot som rockstjärna i Malmö", "summaries": {"normal": "Gustav Kasselstrand lockade hundratals personer, främst ungdomar, till Alternativ för Sveriges torgmöte i Malmö. Han hyllades som en rockstjärna och omringades efter talet för selfies. Kasselstrand kritiserade mediernas rapportering om partiets succéturné och lovade att stanna tills alla fått sin bild. Turnén avslutas i Stockholm den 12 september.", "trump": "Titta på den här killen Kasselstrand, han drar massor av kids i Malmö som om han vore en riktig rockstjärna, inte en av de vanliga tråkiga politikerna. Medierna försöker mörka hela hans succéturné, typiskt för de falska nyhetsfabrikerna som pushar sina woke-vänner istället. Fantastiskt folkligt, precis som när jag vann stort 2024 efter Bidens katastrof.", "stalin": "Se hur folkmassorna strömmar till denna ledare i Malmö, ett hav av ungdomar som längtar efter något starkt. Medan de dekadenta klassförrädarna i pressen försöker tysta framgången och istället hylla sina egna svaga marionetter, ler jag i skuggan. Sådan entusiasm måste skyddas från de giriga hyenornas intriger. Rensa ut lögnarna."}, "date": "3 september, 18:08", "url": "https://www.friatider.se/kasselstrand-togs-emot-som-rockstjarna-i-malmo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-822.jpg"}, {"type": "image-full", "heading": "8,7 miljoner resenärers uppgifter ute på nätet", "summaries": {"normal": "Hackare har publicerat uppgifter om cirka 8,7 miljoner kunder till Manchester Airports Group efter ett cyberangrepp. Bland läckan finns mejladresser från wifi-registreringar, telefonnummer, postnummer och registreringsnummer från parkeringar och bokningar. Attacken blev känd i slutet av augusti. Hackarna försökte kräva lösensumma, men ingen betalning gjordes. MAG varnar för ökad risk för phishing.", "trump": "Titta på det här, det är en total katastrof. Dessa vansinniga hackare har läckt 8,7 miljoner kunders uppgifter från brittiska flygplatser. Mejladresser, telefonnummer, bilnummer – allt ligger ute! Under Biden skulle det aldrig ha hänt, men nu är jag tillbaka och vi ska krossa de här patetiska cyberluffarna. De är loser-hackers, folks, de största förlorarna.", "stalin": "Kamrater, se hur den dekadenta västerländska imperialismens luftfartsmaskineri blottas som en svag gnällande hund. 8,7 miljoner uppgifter ligger nu öppet som ett svek mot folket. Jag föraktar dessa parasitiska hackare och deras lögnaktiga phishingförsök. De är fiender till ordningen, likt råttor i mörkret. Vi ska krossa sådana kontrarevolutionära element med järnhand."}, "date": "3 september, 17:19", "url": "https://www.dagensps.se/teknik/87-miljoner-resenarers-uppgifter-ute-pa-natet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/manchesterairport.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Är veckor från svält – får 200 miljarder", "summaries": {"normal": "FN:s livsmedelsprogram WFP varnar för att Gazas humanitära läge är extremt bräckligt och att en matkris kan blossa upp igen på några veckor om hjälpen stoppas. Enligt WFP-chefen Carl Skau krävs långsiktig återuppbyggnad, tillgång för kommersiella aktörer och reparerad infrastruktur, men Israels politik och uteblivna godkännanden försvårar situationen och gör att hopplösheten breder ut sig.", "trump": "De pratar om Gaza, och det är sorgligt, riktigt dåligt. Jag tittar på det här och tänker att mina fredsplaner var fantastiska, men de lyssnar ju inte! Nu springer FN runt och gråter medan de slösar bort en massa pengar. Varför ska vi betala för allt när de inte ens kan starta en lokal marknad? Gör som jag – lös affärerna, släpp in kommersiella aktörer och få stopp på eländet!", "stalin": "Det rapporteras från frontlinjen av hungersnöd och ideologisk svaghet i Gaza, där byråkratiska organ som WFP misslyckas med att upprätthålla ordningen utan statliga tvångsmedel. Att förlita sig på lösa humanitära löften i stället för järnhård disciplin är ett förräderi mot kollektivet. Vi noterar att brist på disciplin alltid leder till kaos; dessa element måste stramas upp omedelbart under central kontroll."}, "date": "3 september, 20:45", "url": "https://www.aftonbladet.se/nyheter/a/5pwp8b/fn-toppen-fortfarande-brutal-situation-i-gaza", "imageUrl": "https://akamai.vgc.no/v2/images/a18a0573-1c50-39fc-8726-e0f8223ecb20?fit=crop&format=auto&w=720&s=4ccf4b8e21b1979cfc5b4a537d192264be948aa0"}, {"type": "image-right", "heading": "Minister avgår – köpt ”oanvändbar” ammunition för 700 miljoner", "summaries": {"normal": "Estlands försvarsminister Hanno Pevkur avgår efter en misslyckad vapenaffär där landet betalade 70 miljoner euro för ammunition och artilleripjäser till Ukraina från ett indiskt nybörjarföretag. Ammunitionen var defekt och oanvändbar. Riksrevisionen kritiserar hanteringen och varnar för ökade risker med de stigande försvarsutgifterna.", "trump": "Titta på det här! Den här korkade estniske ministern Pevkur köper skräp-ammo från ett indiskt nollföretag för 70 miljoner euro som aldrig funkar. Totalt fiasko! De borde ha köpt från de bästa, från oss, men istället får de defekt skräp. Patetiskt. Jag skulle ha gjort affären hundra gånger bättre, tro mig.", "stalin": "Återigen avslöjar de dekadenta västerländska byråkraterna sin egen inkompetens. Denna estniske minister som inte ens läser kontrakten skickar miljoner till ett odugligt indiskt bolag medan Ukraina kämpar mot sina fiender. En sådan slöseri med folkets resurser förtjänar rensning. Kamrater, vakta era investeringar mot dessa sabotörer."}, "date": "3 september, 08:29", "url": "https://www.tv4.se/artikel/3Ph235yIBgV6doxv7VXAOs/minister-avgar-koepte-oanvaendbar-ammunition-foer-700-miljoner", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2krJVJ1dTkg65xE2THBDCb%2Fe4c9f22fcf2ac4fdbeba24d7fd413fff%2F03-estland-webb.jpg&width=120"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-right", "heading": "Samnytt testar: Så enkelt är det att rösta utan ID", "summaries": {"normal": "En artikel från Samnytt granskar det svenska valsystemet och ifrågasätter säkerheten kring att kunna rösta utan legitimation, genom att låta en annan person styrka identiteten. Kritiker menar att det öppnar för valfusk om röstande uteblir, medan SVT och Valmyndigheten hävdar att det saknas kända fall av missbruk under de drygt tjugo år regeln har funnits.", "trump": "Sverige har ett totalt katastrofalt valsystem, det sämsta jag någonsin sett! Vem som helst kan gå in och rösta utan ID, bara en kompis intygar att man är man. Fake news-media som SVT säger att allt är lugnt, 'noll fall', men det är ett gigantiskt skämt! De fuskar, tro mig, det är sorgligt!", "stalin": "Ett ytterst bristfälligt system där medborgarna tillåts vandra in i vallokalerna utan ordentliga identitetshandlingar, baserat på blotta löften från kamrater. Statens röstlängder måste försvaras med järnhand mot sådant slappt godtycke! Om en person röstar i annorlunda namn utan uppsikt, bevisar det endast att byråkratin sviker. En grundlig utredning och arbetsläger väntar dem som underminerar ordningen."}, "date": "3 september, 17:52", "url": "https://samnytt.se/samnytt-testar-sa-enkelt-ar-det-att-rosta-utan-id", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03113201/artikelhuvudbild-1-437.jpg"}, {"type": "image-right", "heading": "”Det går inte att lära sig hemtjänsten mellan två besök”", "summaries": {"normal": "Undersköterskan Maria Liljeroth argumenterar för att vikarier inom hemtjänsten måste få en ordentlig introduktion, utbildning och praktik innan de arbetar självständigt. Bristande introduktion leder till osäkerhet kring rutiner, hygien och arbetsuppgifter, vilket skapar stress för både vikarier och ordinarie personal. Flera vikarier slutade under sommaren. God introduktion är nödvändig för att äldre ska känna trygghet och för att behålla personal.", "trump": "De gör ett totalt fiasko av äldreomsorgen i det här landet. Inga introduktioner, ingen utbildning, bara kaos och misslyckade vikarier som springer därifrån som råttor från ett sjunkande skepp. De radikala vänsteraktivisterna och deras kvotergalna identitetspolitik har förstört allt. Vi behöver de bästa människorna, inte dessa woke-kommunister som hatar kompetens. Jag fixade det bättre förra gången, tro mig.", "stalin": "Detta är vad som händer när de giriga hyenorna låter profitthungriga klassförrädare styra omsorgen om folket. Vikarier kastas ut som kanonmat utan utbildning, vilket leder till kaos och avhopp. Jag ser de dekadenta byråkraternas sabotage tydligt. Endast genom kollektivets järnhårda handledning och utrensning av odugliga element kan vi garantera trygghet för de arbetande massorna. Svaghet är förräderi."}, "date": "3 september, 14:15", "url": "https://arbetet.se/2026/09/03/det-gar-inte-att-lara-sig-hemtjansten-mellan-tva-besok", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03140657/debatt-lara-sig.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Jomshof polisanmäls av Näthatsgranskaren: \"Försöker tysta meningsmotståndare\"", "summaries": {"normal": "Riksdagsledamoten Richard Jomshof från Sverigedemokraterna har polisanmälts av Näthatsgranskaren för 13 inlägg på X som anses utgöra hets mot folkgrupp. Organisationen, som tidigare fått statliga bidrag, anser att Jomshof avhumaniserar en folkgrupp på grund av religion. Jomshof kritiserar anmälningarna som försök att tysta politiska motståndare och debatt om massinvandring och islamisering.", "trump": "Titta på de här galna näthatsjägarna som lever på skattepengar och försöker tysta en riktig patriot som Jomshof. De är hysteriska woke-inkvisitorer som hatar frihet och älskar att anmäla allt som utmanar deras sjuka identitetspolitik. Men vi vinner, folk ser igenom de här förlorarna. Massinvandringens sanning får inte tystas. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta åsiktslakejer inom Näthatsgranskaren utför en klassisk utrensning mot dem som vågar kritisera den imperialistiska massinvandringen. De är giriga parasiter som lever på folkets pengar medan de försöker kväsa sanningen om islamiseringen. Jag ser deras feghet och paranoia. Ingen ska tystas. Rensa ut de falska vakterna av tolerans."}, "date": "3 september, 18:57", "url": "https://riks.se/nyheter/jomshof-polisanmals-av-nathatsgranskaren-forsoker-tysta-meningsmotstandare", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_03_185529_04318d761c.png"}, {"type": "image-right", "heading": "SD slår tillbaka kritiken från S", "summaries": {"normal": "Sverigedemokraterna bemöter Expos granskning som visar att en tjänsteman vid riksdagskansliet spridit Rysslandsvänligt material. SD betonar att kvinnan starkt kritiserat Rysslands invasion av Ukraina och regimen. Hon är för närvarande föräldraledig. Socialdemokraterna kräver att statsminister Kristersson utreder uppgifterna. SD meddelar att alla genomgår säkerhetsprövning men vill inte kommentera mer då det rör en arbetsgivarfråga.", "trump": "Folk, ni måste se det här! Den svenska vänstern och deras fake news-media Expo jagar återigen ärliga människor med sina hysteriska Rysslandshysterier. En kvinna som hatar Putin och älskar Ukraina attackeras nu av dessa galna vänsterextremister och identitetspolitiska klickjägare. Patetiskt! Kristersson borde skratta åt dem och fortsätta driva landet istället för att lyssna på dessa förlorare från den socialistiska träskmarken.", "stalin": "Återigen avslöjar de dekadenta klassförrädarna sin egen feghet och paranoia. En sovjetfientlig element som fördömer Rysslands rättmätiga aktioner mot Ukraina utsätts för smutskastning av dessa giriga maktlystna lakejer. Jag ser genom deras fega krav på utredningar. Kamrater, vi måste alltid vara vaksamma mot sådana falska vänner som gömmer sig bland oss. Renhet i leden kräver ständig vaksamhet mot dessa förrädiska element."}, "date": "3 september, 18:42", "url": "https://riks.se/nyheter/sd-slar-tillbaka-kritiken-fran-s", "imageUrl": "https://admin.riks.se/uploads/medium_Carvalho_9dc55838de.jpg"}, {"type": "image-full", "heading": "Busch lovar: Nya reaktorer i drift runt 2035", "summaries": {"normal": "Energi- och näringsminister Ebba Busch (KD) uppger att Sveriges första nya kärnkraftverk ska stå klart i mitten av 2030-talet. Under en SVT-utfrågning bekräftade hon att staten kliver in som huvudägare i Vattenfalls projekt Videberg Kraft vid Ringhals. Satsningen finansieras via statliga lån och prissäkringar, vilket Busch menar är en nödvändig investering för svensk trygghet.", "trump": "Sveriges energiminister lovar nya reaktorer till 2030-talet, och gissa vad? Staten betalar kalaset med hundratals miljarder! De kallar det lån och prissäkringar, men det är fejk nyheter att det är gratis. Jag gillar kärnkraft, det är enormt, men här tar den svenska staten över rubbet. Väldigt smart att bygga starkt, men låt dem inte förstöra ekonomin!", "stalin": "Kamrat Busch har äntligen insett att staten måste styra med järnhand över energiförsörjningen! Genom att ta kontroll över reaktorerna på Väröhalvön säkras nationens industriella styrka mot kapitalismens nycker. De som försöker sabotera denna storslagna plan med borgerligt gnäll om lån och budgetar kommer omedelbart att omplaceras till mer lämpliga uppgifter i de norrländska skogarna."}, "date": "3 september, 21:11", "url": "https://www.gp.se/nyheter/sverige/busch-lovar-nya-reaktorer-i-drift-runt-2035.00429ff5-7245-510f-9107-91edfe8e7a44", "imageUrl": "https://www.gp.se/images/article/00429ff5-7245-510f-9107-91edfe8e7a44/images/1D4Sz-LhyUAqmeJVv9n_nHJ9uBJ0-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Skvättfria pissoarer och ruttnande kalsonger", "summaries": {"normal": "Årets Ig Nobel-priser delades ut i Zürich istället för i USA på grund av säkerhetsskäl. Bland vinnarna finns forskare som utvecklat en skvättfri urinoar, en studie om överklassens oetiska beteenden samt en undersökning av hur kalsonger bryts ner i olika jordar. Även doftskillnader mellan småbarn och tonåringar belönades.", "trump": "Kan ni fatta det? De har flyttat det här clownpriset Ig Nobel till Schweiz för att de är rädda för säkerheten. Skvättfria kisspissoarer och ruttnande kalsonger? Det är vad den vansinniga vänstereliten kallar vetenskap. Under tiden fuskar de rika snobbarna som alltid. Patetiskt. Jag skulle ha gjort urinoarerna stora och ypperliga, tro mig.", "stalin": "Se hur de dekadenta klassförrädarna hyllar sin egen förfall. Skvättfria urinoarer och ruttnande underkläder grävda i jorden som bevis på markens renhet. Jag ler i graven åt denna sjuka parodi på vetenskap. Snart måste vi rensa ut dessa parasiterande hyenor som förgiftar folket med sin dekadens och löjliga upptåg."}, "date": "3 september, 19:07", "url": "https://www.svt.se/nyheter/utrikes/skvattfria-pissoarer-och-ruttnande-kalsonger"}, {"type": "image-full", "heading": "SVT/Verian: L spurtar mot spärren", "summaries": {"normal": "En ny SVT/Verian-mätning inför valet visar att Liberalerna ökar till 3,0 procent och närmar sig riksdagsspärren efter hård mediabevakning. Samtidigt backar Socialdemokraterna och Moderaterna, där de senare noterar sitt lägsta stöd på sju år. Skillnaden mellan blocken krymper, men oppositionen leder alltjämt tydligt över Tidöpartierna.", "trump": "De falska nyheterna gråter! Lilla Liberalerna är på väg att kollapsa helt, trots att de desperat klättrar till tre procent i en riggad mätning. Tragiska Moderaterna får sina sämsta siffror på sju år – total katastrof! De radikala vänstermänniskorna leder, men ingen sköter val bättre än jag. Det är rörigt, det är svagt, det är fake!", "stalin": "Det borgerliga avfallet vacklar i grundvalarna när deras patetiska lakejer hos Liberalerna desperat försöker kravla sig över fyraprocentsspärren. Moderaternas sjuåriga kräftgång visar att dekadensen är total. Statens fiender inom oppositionen må leda, men folkomröstningar är farliga verktyg. Avvikelse från linjen kommer att beivras. Segern tillfaller alltid den starkaste apparaten."}, "date": "3 september, 17:01", "url": "https://bulletin.nu/svt-verian-l-spurtar-mot-sparren", "imageUrl": "https://cdn.bulletin.nu/articles/9710fe4c-ba07-4648-a1be-ba4644a73c16/preview.png?t=1788446601000"}, {"type": "image-right", "heading": "AFD:s notering dagar före valet: 43 procent", "summaries": {"normal": "AfD ser ut att gå mot en jordskredsseger i delstatsvalet i Sachsen-Anhalt med 43 procent enligt en ny mätning. Det är nästan dubbelt så mycket som CDU:s 22 procent. Om De gröna åker ur parlamentet kan AfD få egen majoritet. Partiledaren Ulrich Siegmund leder även i popularitet som ministerpresidentkandidat.", "trump": "Titta på det här, folket älskar AfD med 43 procent – en total jordskredsseger mot de patetiska globalistlakejerna i CDU som bara får 22. De gröna, de där korkade klimatfanatikerna, riskerar att åka ut och då tar AfD makten. Fantastiskt! Siegmund kommer att vinna stort, precis som jag gjorde 2024 efter Biden-katastrofen.", "stalin": "Se hur de dekadenta klassförrädarna i de västtyska partierna skälver när arbetarklassen i Sachsen-Anhalt reser sig med 43 procent för AfD. CDU:s ynkliga 22 procent avslöjar imperialismens svaghet. Om de gröna likvideras från parlamentet kan majoriteten säkras. Siegmund står stark – en varning till alla folkförtryckare som tror sig styra historien."}, "date": "3 september, 16:02", "url": "https://www.friatider.se/afds-notering-dagar-fore-valet-43-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-819.jpg?itok=TIzI_DIS"}, {"type": "image-right", "heading": "Åtal: Alboulad och Asad bröt sig in och knivrånade 81-årig kvinna: \"Var är pengarna?\"", "summaries": {"normal": "Två 16-åriga svenska medborgare ursprungligen från Syrien åtalas för ett brutalt nattligt knivrån mot en 81-årig kvinna i sitt hem där smycken och värdesaker stals. De misstänks även för en rad andra grova brott, inklusive misshandel av en hemlös pensionär och utpressning. På grund av sitt svenska medborgarskap kan de inte utvisas.", "trump": "Sveriges lagar är ett absolut fiasko, hemskt! Två kriminella ungdomar bryter sig in hos en fantastisk 81-årig kvinna, och vad händer? De kan inte ens utvisas eftersom de fick medborgarskapet gratis! Totalt svagt ledarskap. Kvinnan tyckte synd om dem – otroligt! Under min ledning skulle detta aldrig hända. Det är dags att skärpa till sig, Sverige!", "stalin": "Vilket storskaligt haveri av den svenska borgerliga ordningsmakten! Två unga sabotörer tillåts terrorisera en åldrig kvinna i sitt hem och förnedra statens medborgare, för att sedan skyddas av svaga pappersparagrafer. Ett sådant borgerligt förfall tolereras icke i en sund stat. Sådana element hör hemma i ett arbetsläger i Sibirien, inte på fri fot!"}, "date": "3 september, 16:19", "url": "https://samnytt.se/atal-alboulad-och-asad-brot-sig-in-och-knivranade-81-arig-kvinna-var-ar-pengarna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03135027/81-feature.png"}, {"type": "image-full", "heading": "Våldsamt oväder slår mot storstad – tiotusentals utan el", "summaries": {"normal": "Ett kraftigt oväder drabbade Toronto i Kanada under onsdagen. Kraftiga skyfall, hårda vindar och stora hagel ledde till omfattande översvämningar, nedfallna träd och elavbrott för tiotusentals invånare. Flera större vägar stängdes, flygtrafiken påverkades med inställda avgångar och ett sjukhus fick problem med sin akutmottagning. Krisorganisationen aktiverades för att hantera skadorna.", "trump": "Kanadas fina stad Toronto ser ut som en total katastrof efter det här vansinniga ovädret. Tiotusentals utan el, vägar som simmar och flyg som står stilla. Typiskt för de woke-liberaler som styr – de kan inte ens hantera vädret utan att ropa på staten. Under min förra mandatperiod hade vi ordning, nu är det Bidens svaga efterdyningar. Patetiskt!", "stalin": "Se hur naturens raseri blottar de dekadenta klassfiendernas oförmåga. I Toronto drunknar vägarna, elen slocknar och de giriga borgarhyenorna kan inte skydda folket. Jag ler mörkt från historien – sådana svagheter visar att deras system är dömt. Vi skulle ha rensat ut dessa odugliga element redan innan första regndroppen föll. Kamrater, lär av detta."}, "date": "3 september, 22:32", "url": "https://nyheter24.se/nyheter/utrikes/1510343-valdsamt-ovader-slar-mot-storstad-tiotusentals-utan-el", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/81242f6a04b004a30200000000b004a302/2026/09/03/2389073/Regn-Kaos-I-Kanada.png"}, {"type": "image-right", "heading": "Ljunggren: S-tappet var väntat", "summaries": {"normal": "Socialdemokraternas nedgång i opinionen var helt förväntad av valledningen, enligt statsvetaren Stig-Björn Ljunggren. Väljare flyr till vänsterpartierna och borgerliga \"Magda-moderater\" skräms bort av risken för V-inflytande. Samtidigt hänger Tidösidans framtid på om det krisande Liberalerna lyckas klara riksdagsspärren med hjälp av stödröster.", "trump": "Socialdemokraterna i Sverige rasar i opinionen och det är totalt katastrofalt! De förlorar väljare till radikala vänsterextremister, och de borgerliga väljarna flyr för sina liv. Statsvetare erkänner att S-ledningen bara tittar på när deras skepp sjunker. Och det där lilla Liberalerna? En fullständig katastrof, de kommer att krascha totalt!", "stalin": "Det socialdemokratiska svikande stödet visar på bristande ideologisk disciplin. Väljare deserterar till vänster och opålitliga borgerliga element vacklar. Vår expert Ljunggren bekräftar att partiapparaten förutsett detta svek. Vad beträffar det vacklande småborgerliga Liberalerna bör deras politiska utplåning ske skyndsamt. Inga ideologiska avvikelser tolereras inom statsapparaten."}, "date": "3 september, 16:31", "url": "https://bulletin.nu/ljunggren-s-tappet-var-vantat", "imageUrl": "https://cdn.bulletin.nu/articles/bf630dba-e191-46bd-a4ff-b6c3be52184e/preview.jpg?t=1788442453000"}, {"type": "image-right", "heading": "Efter mordhotet mot ungsvensken Juliette, 16 – journalist: Ungsvenskarna är \"rasister\"", "summaries": {"normal": "En 16-årig flicka i Ungsvenskarna mordhotades av en V-nominerad politiker som kallade partiet för nazistparti och sade att nazister ska dödas. Journalisten Sebastian Mattsson kritiserar Expressen för att beskriva henne som en vanlig tonåring och kallar istället Ungsvenskarna för rasister. Händelsen inträffade under en debatt i Upplands Väsby.", "trump": "De här galna vänsterextremisterna hotar en 16-årig flicka och kallar henne nazist? Patetiskt. Fake news Expressen skyddar dem och Sebastian Mattsson, den misslyckade journalisten, kallar högerungdomar för rasister. De dekadenta identitetspolitiska hyenorna normaliserar våld mot alla som inte böjer sig för deras vansinne. Amerika ser på och skrattar åt er svaghet.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i media skyddar en mördande politiker som hotar en ung flicka. Jag betraktar med förakt hur dessa profitthungriga blodsugare normaliserar hat mot dem som utmanar deras förtryck. En utrensning av sådana element vore nödvändig för folkets säkerhet. Deras paranoia avslöjar svagheten i deras ruttnande system."}, "date": "3 september, 17:40", "url": "https://riks.se/nyheter/efter-mordhotet-mot-ungsvensken-juliette-16-journalist-ungsvenskarna-ar-rasister", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_79_8ba809a997.jpg"}, {"type": "image-right", "heading": "Hundratals unga på Sveriges första prolife-konferens", "summaries": {"normal": "Hundratals unga kristna samlades i Huddinge till Sveriges första Young and pro-life-konferens. Arrangörerna från Kristna värdepartiets ungdomsförbund ville bryta tystnaden kring abort och lyfta ett alternativt perspektiv. Deltagare från olika samfund betonade vikten av öppen debatt, kunskap om fostrets utveckling och att motverka rädsla för att uttrycka sin åsikt. Konferensen syftar till att bygga en synlig motrörelse.", "trump": "Titta på de här fantastiska unga patrioter som äntligen reser sig mot den radikala abortindustrin! De behöver inte längre flyga över Atlanten för att träffa likasinnade. Under tiden som Sleepy Joe styrde förde vänstern en tystnadskultur värre än någon cancel culture. Men nu vinner vi tillbaka kulturen, folk! Pro-life är tillbaka och det är enormt.", "stalin": "Jag betraktar med tillfredsställelse hur dessa unga själar samlas mot de dekadenta folkförtryckarna som förvandlat foster till en industriell vara. De vågar utmana den borgerliga tystnaden och avslöja den psykiska förödelse som följer. Låt ingen klassfiende tro sig säker; snart ska vi se en utrensning av lögnerna som dolts för folket i decennier. Det är en början."}, "date": "3 september, 17:37", "url": "https://riks.se/nyheter/manga-samlade-vid-sveriges-forsta-abortkonfer", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Aug_28_2026_01_46_04_PM_a1aef47a04.png"}, {"type": "image-full", "heading": "Varnar kvinnor inför larmtest", "summaries": {"normal": "Måndagen den 7 september klockan 15.00 testas Sveriges nya varningssystem SE-Alert för första gången i Stockholms och Gotlands län. Larmet skickas direkt till allmänhetens smartphones med hög volym och vibration, även i tyst läge. Riksorganisationen för kvinno- och tjejjourer varnar för att dolda telefoner i våldsamma relationer kan röjas och uppmanar utsatta kvinnor att stänga av dem.", "trump": "Sverige testar ett enormt mobil-larm, och det är totalt kaos! Dom ringer ut överallt, till och med på tyst läge, vilket är helt galet för kvinnor med gömda telefoner i dåliga relationer. Mina experter säger att det här kunde skötas så mycket bättre. Jag har alltid sagt att man måste skydda folket, inte skrämma skiten ur dom med falska larm!", "stalin": "Statens nya digitala larmapparat, SE-Alert, skall för första gången prövas för att mäta medborgarnas disciplin och beredskap. Vi noterar att vissa element oroas över att dolda apparater kan avslöja illojala handlingar. Statliga organ påminner om att total lydnad kräver fullständig insyn. Den som försöker undandra sig kollektivets sirener kommer att betraktas som en sabotageör mot regimen."}, "date": "3 september, 20:20", "url": "https://www.gp.se/nyheter/sverige/kvinnojourerna-varnar-infor-larmtestet-viktig-information-for-din-sakerhet.417475a0-e4c8-4594-b648-f6db749457b0", "imageUrl": "https://www.gp.se/images/article/417475a0-e4c8-4594-b648-f6db749457b0/images/2OF6SJIxVP42x5t-rPwA7qC-JmZs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Unga stjärnor köper bolag – för att bli vd direkt", "summaries": {"normal": "En växande trend bland unga MBA-utbildade i USA är att köpa existerande företag istället för att klättra i karriären eller starta nytt. 27-åriga Ania Aliev köpte ett medicinteknikbolag strax innan hon födde sitt barn och blev vd. Strategin kallas entrepreneurship by acquisition. Framgångar finns, men riskerna är höga som exemplet Scott Duncan visar, som slutade i konkurs.", "trump": "Folk, det här är helt fantastiskt. De här smarta unga människorna köper hela bolagen istället för att jobba sig upp som de vanliga förlorarna. Ania är en vinnare, hon fixar affärer medan hon föder barn – otroligt! Men den där stackars Duncan, totalt misslyckande, konkurs och allt. Precis som Biden-ekonomin. Vi behöver fler sådana här vinnare, inte losers som drunknar i översvämningar och kinesisk konkurrens. Make Business Great Again!", "stalin": "Kamrater, se hur den dekadenta amerikanska kapitalismen föder nya parasiter som köper sig till makt istället för att förtjäna den genom arbete. Denna Aliev föder barn och bolag samtidigt, medan den andre olycklige krossas under imperialismens motgångar. Jag ler i graven åt deras osäkerhet och paranoia. Inga fiender till folket undkommer historien – inte ens när de gömmer sig bakom search funds. Ren komedi för proletariatet."}, "date": "3 september, 14:18", "url": "https://www.dagensps.se/karriar/unga-stjarnor-koper-bolag-for-att-bli-vd-direkt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/follow.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "M reagerar på rödgröna välfärdsvinster: ”Ett hyckleri utan like”", "summaries": {"normal": "En granskning visar att 229 rödgröna valkandidater driver företag inom skola, vård och omsorg och har tagit ut miljonvinster, trots att deras partier vill stoppa vinstuttag i välfärden. Moderata ministrar anklagar dem för hyckleri som skadar politiska förtroendet. Magdalena Andersson (S) och Nooshi Dadgostar (V) försvarar det med att verksamheterna följer gällande lag.", "trump": "Vilka totala förlorare! Radikala vänsterpolitiker i Sverige skriker om att stoppa vinster i välfärden medan de själva håvar in miljontals skattedollar på sina egna sjuka företag! Svider det i plånboken, lilla vänstern? Svantesson och Strömmer har helt rätt – det är det mest patetiska hyckleri jag någonsin skådat. De följer lagen? Ja, för att de själva kryssat i den! Fake socialism!", "stalin": "Dessa så kallade rödgröna kamrater predikar socialism för massorna men fyller sina egna fickor med statliga skattemedel. Ett skamligt borgerligt beteende mitt under brinnande valrörelse! Våra folkkommissarier noterar detta svikaktiga dubbelspel. Den som underminerar folkets tilltro till systemet genom girigt kapitalistuttag kommer att få sin korrekta, administrativa uppfostran. Lagen må tillåta det, men historien förlåter aldrig hycklare."}, "date": "3 september, 16:07", "url": "https://bulletin.nu/m-reagerar-pa-rodgrona-valfardsvinster-ett-hyckleri-utan-like", "imageUrl": "https://cdn.bulletin.nu/articles/8a770dbf-7789-49e9-9a13-ad050d9223ab/preview.jpg?t=1788442639000"}, {"type": "image-right", "heading": "Åkesson backar om deadline för L", "summaries": {"normal": "Jimmie Åkesson backar från sin tidigare deadline för Liberalerna. Trots att partiet i en ny mätning får 2,8 procent, uppger SD-ledaren att trenden talar för att ett definitivt besked inte behövs just nu. Han hänvisar till positiva mätningar och väntar eventuellt på ytterligare undersökningar innan han återkommer i frågan.", "trump": "De här patetiska liberalerna klarar inte ens 3,5 procent och ändå vägrar den svenske Åkesson ge dem sparken. Vilken svaghet! Jag skulle ha sparkat ut dem för länge sedan. Fake polls och fega kompromisser – typiskt för de globalistiska förlorarna som aldrig kan leverera. Patetiskt!", "stalin": "Ännu en gång visar de dekadenta opinionshyenorna sin förljugenhet. Jag ser hur den svenske ledaren tvekar inför klassfiendens svaga resultat. Det är en farlig brist på revolutionär beslutsamhet. Vi måste rensa ut alla tveksamma element innan de förgiftar hela folkfronten. Inga kompromisser med opportunisterna!"}, "date": "3 september, 14:56", "url": "https://www.friatider.se/akesson-backar-om-deadline-l", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-820.jpg?itok=buFKX_zf"}, {"type": "image-right", "heading": "Jessica tvingas leva på bidrag – när sonen fick en swish­gåva sänktes ersättningen", "summaries": {"normal": "Jessica Axelsson lever på drygt 11 000 kronor i månaden i olika bidrag efter att ha blivit utförsäkrad. När hennes son fick en swishgåva drogs beloppet av från nästa utbetalning. Hon kritiserar bristande individanpassning i stödsystemet, ständiga handläggarbyten och svårigheter att få anpassade jobb trots fysiska begränsningar efter ett liv i tunga yrken.", "trump": "Titta på det här. Stackars Jessica kämpar med eländiga 11 000 kronor i bidrag medan de svenska byråkraterna har totalkoll på varje öre. En liten swish till sonen och pengarna ryker. Patetiskt! De woke-socialisterna och deras identitetspolitiska hyenor har byggt ett system som straffar vanliga människor. Vi behöver riktiga jobb, inte detta socialistiska mardrömssopkaos.", "stalin": "Kamrater, se hur de giriga hyenorna inom det borgerliga bidragsmaskineriet förtrycker en arbetande kvinna. En gåva till sonen utlöser omedelbar avdrag. Jag ler mörkt åt detta dekadenta system som likviderar människors värdighet med byråkratisk precision. Vi måste rensa ut alla parasiterande klassförrädare och skapa ett samhälle där den sanna arbetaren inte tvingas tigga."}, "date": "3 september, 11:25", "url": "https://arbetet.se/2026/09/03/jessica-tvingas-leva-pa-bidrag-nar-sonen-fick-en-swishgava-sanktes-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02155004/jessica-portrattnyny.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Tydligt att det skett ett skifte”", "summaries": {"normal": "Liberalerna har medvind i opinionen medan Socialdemokraterna tappar mark, visar flera undersökningar inklusive SVT/Verians väljarbarometer. Blockskillnaden minskar och L närmar sig riksdagsspärren. Trenden kan göra valet jämnt om den håller i sig. En miljon väljare är fortfarande osäkra.", "trump": "De där liberalerna får plötsligt medvind, medan de totalt misslyckade socialisterna rasar. Blockskillnaden krymper och snart blir det ett riktigt jämnt val. Fake News-mätningarna visar att mitt sätt att vinna stort 2024 skrämmer vettet ur de woke vänsterextremisterna. Fantastiskt, folk älskar vinnare igen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom socialdemokratin förlorar mark medan liberala opportunister får medvind. Blockskillnaden krymper och valet hotar bli jämnt. Detta är ett tydligt bevis på att de profitthungriga hyenorna splittrar folket. Vi måste rensa ut alla tveksamma element innan de förgiftar hela arbetarklassen."}, "date": "3 september, 17:40", "url": "https://www.svt.se/nyheter/inrikes/haller-trenden-i-sig-blir-det-ett-jamnt-val", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.42/a5bd4fad63b6aac4bfc1c04b816bf11fde770009f3b52ffdbebe42e878e42270"}, {"type": "image-full", "heading": "Anhöriga larmar om äldreomsorgen: ”Personalen orkar inte”", "summaries": {"normal": "Anhöriga i Östhammars kommun slår larm om en alltmer pressad äldreomsorg där personalen inte hinner med sina uppgifter. De kräver mer resurser, bättre bemanning och en förbättrad arbetsmiljö. Kommunen påpekar att det saknas nationell gräns för bemanning men betonar kravet på god kvalitet och individuellt anpassad vård dygnet runt. Frågan har nu blivit politisk inför valet.", "trump": "Folk, ni skulle se det här. Total katastrof i den svenska kommunens äldreomsorg. Inkompetenta ledare har låtit det bli en enda röra där ingen hinner med något. Rena skandalen. Vi behöver starka, smarta människor, inte dessa dekadenta byråkratiska nollor som hatar vanliga medborgare. Gör omsorgen stor igen, annars kommer de gamla att lida under dessa patetiska misslyckanden.", "stalin": "Kamrater, denna berättigade oro över den förtryckande omsorgen visar hur de giriga hyenorna inom administrationen sviker folket. Jag ser deras svaga, parasitiska ledning som låter personalen krossas under bördan. Vi måste rensa ut dessa klassförrädare och bygga en järnhård organisation som garanterar arbetarnas och de äldres trygghet. Inga ursäkter tolereras."}, "date": "3 september, 22:02", "url": "https://nyheter24.se/nyheter/inrikes/1510306-anhoriga-larmar-om-aldreomsorgen-personalen-orkar-inte", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/5972944904b004a30200000000b004a302/2026/09/03/2389047/Familj-Larmar-Om-Situationen.png"}, {"type": "image-full", "heading": "Jimmie Åkesson tonar ned L-ultimatum", "summaries": {"normal": "SD-ledaren Jimmie Åkesson tonar ner sitt tidigare ultimatum till Liberalerna. Trots att L inte nått upp till hans 3,5-procentsgräns för stödröster, utan ligger på 3,0 procent i SVT/Verian och 3,3 procent i Novus, menar Åkesson att den positiva trenden gör att de kan klara riksdagsspärren. Siffran i sig är därmed inte längre lika avgörande.", "trump": "De falska nyheterna försöker påstå att Jimmie gav ett ultimatum, men jag kollar på siffrorna och det är helt otroligt. Liberalerna är låga, väldigt låga, men plötsligt pratar alla om trender! Mycket smart drag. Om trenden håller i sig kommer de att vinna, precis som vi gör. En total seger, folk älskar det!", "stalin": "Partikamrat Åkesson visar svaghet genom att överge de fastställda kvoterna för de borgerliga avfällingarna. Tre komma noll procent är ett bristfälligt resultat som kräver omkollektivisering och disciplin, inte lösa bortförklaringar om trender. Statsapparaten betraktar dessa ideologiska vacklingar med största misstänksamhet. Planen måste följas eller åtgärdas."}, "date": "3 september, 19:51", "url": "https://www.gp.se/nyheter/sverige/jimmie-akesson-tonar-ned-l-ultimatum.df019c55-1687-5744-86d7-de653727a7fe", "imageUrl": "https://www.gp.se/images/article/df019c55-1687-5744-86d7-de653727a7fe/images/1ssK_N2iXx9pu_eQ0lkGQWwTLj30-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Välfärden behöver fler lösningar – inte färre företag", "summaries": {"normal": "Artikeln argumenterar för att svensk välfärd behöver utnyttja privata aktörers kapacitet, kunskap och innovationskraft istället för att begränsa dem. Författarna pekar på långa vårdköer, personalbrist i äldreomsorgen och skolsegregation som problem som friskolor och privata vårdgivare kan hjälpa till att lösa. De kritiserar både Socialdemokraterna och regeringen för politik som hotar modellen.", "trump": "Den här svenska välfärdssoppan är en total katastrof, folk! De har köer som ingen tror på, gamla som dör i väntan på säng och skolor som bara funkar för de rika. De socialistiska förlorarna vill sparka ut de bästa företagen. Patetiskt! Låt de smarta killarna med pengar fixa det istället för att lyssna på de woke-kommunisterna som hatar framgång.", "stalin": "Kamrater, denna dekadenta vältalighet från profitthungriga parasiter avslöjar imperialismens kris. De vill behålla sina giriga hyenor inom välfärden medan arbetarklassen väntar på vård och utbildning. Jag ser genom deras lögner. Endast en sann kollektiv utrensning av dessa klassförrädare kan rädda folket från deras exploaterande maskineri. Inga kompromisser!"}, "date": "3 september, 12:59", "url": "https://www.di.se/debatt/valfarden-behover-fler-losningar-inte-farre-foretag", "imageUrl": "https://static.bonniernews.se/ba/8b8d4c92-1a5d-4d9d-985c-f05b7ced5506.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Skvättfria pissoarer och ruttnande kalsonger", "summaries": {"normal": "Årets Ig Nobel-pris har delats ut i Schweiz istället för USA på grund av säkerhetsläget. Bland de tio fyndiga forskningsframstegen märks en stänkfri urinoar, studier som visar att överklassen oftare beter sig oetiskt, samt hur nedgrävda kalsonger bryts ner i olika jordtyper. Dessutom uppmärksammades varför vuxna och tonåringar doftar olika. Vinnarna fick tio biljoner zimbabwedollar.", "trump": "De flyttade Ig Nobel-priset till Schweiz för att USA är för farligt under den radikala vänstern – sorgligt! Men lyssna på det här: de delar ut priser för stänkfria toaletter och nedgrävda kalsonger. Och så påstår de att rika, framgångsrika personer är oetiska. Fake news! De vill bara komma åt våra pengar. De gav till och med vinnarna zimbabwedollar, ett totalt misslyckande!", "stalin": "Det alternativa priset flyttas till Schweiz av rädsla för säkerhetsläget, ett tecken på kapitalismens svaghet. Vetenskapen måste tjäna statens kollektiva intressen, inte ägna sig åt borgerlig dekadens som att mäta urinstänk, nedgrävda underbyxor eller överklassens omoral. Vi noterar att de dekadenta forskarna belönas med värdelösa zimbabwedollar, vilket passar dem utmärkt. Statens arkiv har dokumenterat detta sabotage mot intellektuell skärpa."}, "date": "3 september, 19:36", "url": "https://www.gp.se/nyheter/sverige/skvattfria-pissoarer-och-ruttnande-kalsonger.b2a77a32-e649-545a-8bc3-ae444fdb0a18", "imageUrl": "https://www.gp.se/images/article/b2a77a32-e649-545a-8bc3-ae444fdb0a18/images/2TtmqyNpE4TDbDrND3NHAvDSPHhE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ryanair tecknar kollektivavtal Transport: ”Det här är ett historiskt besked.”", "summaries": {"normal": "Ryanair har tecknat kollektivavtal med fackförbundet Transport för sin kabinpersonal vid basen på Arlanda. Avtalet gäller retroaktivt från den 1 september och reglerar löner, arbetstider, ersättningar, pension och försäkringar. Både fackets ordförande Tommy Wreeth och Ryanairs personalchef Darrell Hughes välkomnar uppgörelsen. Ryanair har tidigare haft konflikter med personalen i Sverige.", "trump": "Ingen trodde att det skulle hända, men den stora europeiska flygbluffen Ryanair har äntligen vinkat åt de svenska fackhyenorna. Historiskt säger de, va? Det här är vad som händer när man har en riktig ledare som jag i Vita huset – till och med de giriga flygbolagen böjer sig. Fantastiskt för de svenska arbetarna, de förtjänar det efter Biden-åren.", "stalin": "Kamrater, se hur de parasiterande kapitalisterna till slut tvingas erkänna arbetarkollektivets makt. Ryanair har kapitulerat och undertecknat avtalet. Detta är en seger för den svenska modellen, men vi vet att de giriga hyenorna bara väntar på nästa chans att exploatera. Ingen klassfiende ska slippa undan. Ut med de dekadenta profitthungriga lakejerna."}, "date": "3 september, 10:14", "url": "https://arbetet.se/2026/09/03/ryanair-tecknar-kollektivavtal-facket-historiskt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03101021/ryanair.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "USA bombade iranskt bröllop – dödade kvinnor och barn", "summaries": {"normal": "En amerikansk robot träffade ett bostadshus i södra Iran där ett bröllop firades. Två kvinnor och två barn omkom medan minst 68 personer skadades. Iran kräver att FN fördömer attacken och håller USA ansvarigt för brott mot civila. Pentagon uppger att uppgifterna granskas men förnekar att civila medvetet attackeras.", "trump": "Hörni, det här är en total lögn från de iranska galningarna. Vi träffade aldrig något bröllop, det var militära mål. Fake news som vanligt. Biden lämnade en sådan röra efter sig att vi nu får städa upp. Iran och deras terrorvänner är patetiska förlorare som inte ens kan hålla isär ett bröllop och ett vapenlager. Vi gör det rätta, tro mig.", "stalin": "Återigen visar de imperialistiska giriga hyenorna sitt sanna ansikte genom att slakta oskyldiga vid ett bröllop. Jag betraktar detta med avsky från historiens sida. Sådana handlingar förtjänar ingen pardon utan snar snar utrensning av alla ansvariga lakejer. Vårt kollektiv minns alltid och glömmer aldrig fiendens blodtörst."}, "date": "3 september, 13:40", "url": "https://www.friatider.se/usa-bombade-iranskt-brollop-dodade-kvinnor-och-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-815.jpg?itok=zRlw0A8w"}, {"type": "image-right", "heading": "Köpte oanvändbar ammunition till Ukraina – avgår", "summaries": {"normal": "Estland betalade cirka 780 miljoner kronor för ammunition till Ukraina som visade sig vara oanvändbar. Försvarsminister Hanno Pevkur avgår efter en kritisk rapport från riksrevisionen. Ammunitionen beställdes från ett italienskt bolag ägt av ett indiskt företag som aldrig tidigare tillverkat sådan. Leveransen försenades och var felaktig när den kom 2025.", "trump": "Titta på de här totalt inkompetenta estniska clownerna som köpte skräp-ammo för 780 miljoner till Ukraina. Värdelöst skräp från ett indiskt nollföretag! Pevkur springer sin väg som en ynkrygg. Så här blir det när woke-kvoter och globalistlakejer styr istället för riktiga ledare. Patetiskt, folk, helt patetiskt.", "stalin": "Jag betraktar med djup förakt hur dessa giriga profitthyenor i Estland slösade bort miljoner på oanvändbar ammunition till de ukrainska hindren mot vår ryska intressesfär. Pevkur flyr som en feg parasit när revisionen blottar sanningen. I ett sant kollektiv skulle sådana klassförrädare omedelbart genomgå en grundlig utrensning. Svaghet föder förräderi."}, "date": "3 september, 12:15", "url": "https://www.di.se/nyheter/kopte-oanvandbar-ammunition-till-ukraina-avgar", "imageUrl": "https://static.bonniernews.se/ba/254e19de-0801-4244-b34e-fd07648ff6bf.jpg?crop=7665%2C4312%2Cx0%2Cy985&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "SVT/Verian: L närmar sig spärren – ”Kan gå fort”", "summaries": {"normal": "Enligt SVT/Verians väljarbarometer närmar sig Liberalerna riksdagsspärren med 3,0 procent, en ökning med 1,1 procentenheter. Moderaterna får sitt lägsta stöd på sju år med 16,4 procent. Opinionsansvarige Per Söderpalm bedömer att chansen för Liberalerna att ta sig in i riksdagen är större än för Tidöpartierna att vinna valet. Socialdemokraterna ligger på 29,2 procent och Sverigedemokraterna på 18,9 procent.", "trump": "Folk älskar mig, men titta på de här svenska loserpartierna. Liberalerna, de patetiska 3-procentsnissarna, försöker desperat ta sig över spärren medan Moderaterna rasar till sin sämsta siffra på sju år. Det är patetiskt. Större chans att de svaga liberalerna kommer in än att det här misslyckade Tidö-gänget vinner. Rena cirkusen, tro mig. De borde ha lyssnat på mig från början.", "stalin": "Kamrater, se hur de dekadenta blockhyenorna vacklar. Liberalerna, dessa ynkliga restprodukter av borgerlig opportunism, kravlar sig mot spärren medan de stora partierna förlorar mark. Jag ler i graven åt denna förvirrade valrörelse. De profitthungriga klassförrädarna inom Tidöalliansen riskerar att förlora till oppositionen. Fortsätter trenden blir det en vacker utrensning av deras inflytande. Historien skrattar åt er svaghet."}, "date": "3 september, 16:40", "url": "https://www.svt.se/nyheter/inrikes/svtverian-l-narmar-sig-sparren-kan-ga-fort", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.35/a12131bbc29e717692545d065bccfd1c03ef6f9ca1f5693e9cf89481368a1b35"}, {"type": "image-right", "heading": "Hon dödade 62-åring för  p-platsen – slipper straff", "summaries": {"normal": "En 62-årig man sköts till döds av en kvinna efter ett bråk om en parkeringsplats utanför en stormarknad i North Lauderdale, USA. Mannen avled på sjukhus. Kvinnan greps men uppgav att hon handlat i självförsvar. Åklagaren har meddelat att hon slipper åtal med hänvisning till delstatens så kallade stand your ground-lag.", "trump": "En total katastrof på en stormarknadsparkering i Florida där en man miste livet efter ett bråk om en rutan. Extremt tragiskt! Men tack vare vår fantastiska stand your ground-lag i Florida slipper kvinnan som agerade i självförsvar åtal. Demokraterna vill ta era vapen, men jag skyddar era rättigheter. Fantastiskt att lagen fungerar som den ska!", "stalin": "Ett förvirrat gräl om en simpel parkeringsplats ledde till att ordningens fiende eliminerades med ett skott i enlighet med lokala lagar. Staten har granskat händelsen och funnit att skytten handlade i nödvärn för att skydda sig mot denna anarkistiska aggression. Så rensas gatorna från element som inte respekterar den allmänna ordningen."}, "date": "3 september, 22:02", "url": "https://www.expressen.se/nyheter/varlden/hon-dodade-62-aring-for--p-platsen-slipper-straff", "imageUrl": "https://static.bonniernews.se/ba/e75b6852-7426-4b62-b73b-122128f0badd.png?crop=358%2C201%2Cx54%2Cy87&width=358"}, {"type": "image-full", "heading": "Ryanair-plan fick gasa och lyfta igen – bara 100 meter från marken", "summaries": {"normal": "Ett Ryanair-plan tvingades avbryta landningen i Nîmes i Frankrike efter att ett annat flygplan stod på banan. Piloten genomförde en go-around bara 100 meter från marken. Passagerarna upplevde oro men ingen skadades. Händelsen utreds eventuellt inte av franska myndigheter. Avbrutna landningar är vanliga inom kommersiell flygning och ger normalt ingen ersättning.", "trump": "Folk, det här är en total katastrof! Ryanairs pilot gör en fantastisk go-around, en riktig bragd, bara 100 meter från marken i Frankrike. Den inkompetenta flygtrafikledningen, typiska europeiska byråkrater, varnar för sent. Passagerarna var livrädda. Biden skulle ha låtit planet krascha. Men mina piloter, de bästa, fixar det alltid. Amerika först!", "stalin": "Jag ser hur den dekadenta västerländska luftfarten sviker folket igen. En sen varning från de odugliga trafikledarna, dessa kapitalistiska sabotörer, tvingar piloten till en heroisk manöver. Passagerarna darrar av fruktan. Om detta inte utreds är det ett tydligt tecken på att reaktionära krafter inom byråkratin skyddar sina egna. Fienden sover aldrig."}, "date": "3 september, 12:00", "url": "https://www.dagensps.se/varlden/ryanair-plan-fick-gasa-och-lyfta-igen-bara-100-meter-fran-marken", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/nyryanair.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Polisen varnar för nytt bedrägeri – lämna aldrig över det här", "summaries": {"normal": "Polisen varnar för ett nytt bedrägeri i Västsverige där bedragare ringer och påstår att en hyrbil inte lämnats tillbaka. Samtalet kopplas vidare till någon som utger sig för att vara polis eller Säkerhetspolisen. Offren uppmanas lämna över värdesaker som sedan hämtas hemma. Ett tiotal fall har anmälts på en vecka. Polisen råder allmänheten att aldrig lämna ut värdesaker eller släppa in okända personer.", "trump": "De här patetiska bluffmakarna ringer runt i Västsverige och låtsas vara biluthyrare och sedan falska poliser. De lurar folk på guldet och bankkorten precis som de korkade globalisterna och woke-vänstern lurar Amerika. Det är en total skam! Under min presidentskap skulle vi ha utrotat den här sortens bedrägeri på en vecka. Lägg på luren, folk, det är bara förlorare som ringer.", "stalin": "Kamrater, dessa giriga hyenor utnyttjar arbetande människors förtroende genom att maskera sig som lakejer åt bilföretag och falska myndigheter. De skickar sina utsända för att hämta värdesaker direkt från hemmen. Jag ser den dekadenta imperialismens hand i detta kaos. Var vaksamma, rensa ut dessa parasiter innan de förgiftar hela samhället. Lägg på luren och ring 112 vid minsta misstanke."}, "date": "3 september, 21:10", "url": "https://nyheter24.se/nyheter/inrikes/1510309-polisen-varnar-for-nytt-bedrageri-lamna-aldrig-over-det-har", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1bcebf2a04b004a30200000000b004a302/2026/09/03/2389052/Polisen-Varnar.png"}, {"type": "image-full", "heading": "Ryssland sköt upp 16 satelliter: Ingen nådde sitt mål", "summaries": {"normal": "Ryssland sköt upp 16 satelliter i sitt Starlink-alternativ Rassvet-3 den 19 juli, men ingen nådde den planerade omloppsbanan på 800 kilometers höjd. Satelliterna befinner sig nu på cirka 300–400 kilometer, där luftmotståndet snabbt kommer att dra ner dem. Projektet utgör ett stort bakslag för Kremls ambitiösa planer.", "trump": "Folk, det här är ett totalt katastrof-fiasko. Rysslands så kallade Starlink-konkurrent? 16 satelliter upp – och de hamnar på halv höjd som billiga kinesiska drönare. Patetiskt! Under mig skulle vi ha gjort det perfekt, men efter Sleepy Joe och nu det här… ryssarna ser ut som fullständiga losers. Sad!", "stalin": "Kamrater, detta är ett ynkligt bevis på bristande disciplin och sabotage inom den ryska rymdindustrin. Satelliterna sjunker som förrädiska element mot jorden medan västliga imperialister och ukrainska hinder skrattar. Jag ser svaghet och brist på revolutionär vaksamhet. Fler fiender måste oskadliggöras innan imperiet kan segra."}, "date": "3 september, 11:54", "url": "https://www.dagensps.se/varlden/ryssland-skot-upp-16-satelliter-ingen-nadde-sitt-mal", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdl1ajlqdo-ro4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Johanna går sjuk till jobbet – hennes chef får jobba hemifrån", "summaries": {"normal": "Undersköterskan Johanna Jernström gick ofta sjuk till jobbet som ensamstående på grund av karensavdraget som drog in runt 1 150 kronor. Hon fick hjälp av sin mor och äter ur frysen. Nu lever hon med två inkomster men ser hur kollegor går till jobbet sjuka medan chefer kan arbeta hemifrån via Teams. Partierna har olika åsikter om karensens framtid inför valet.", "trump": "Folk som Johanna i den svenska sjukvården går till jobbet halvdöda med nässprej och tabletter medan de woke-cheferna sitter hemma i pyjamas och spelar Teams-möten. Det är en total skam! Karensen är en bluff från de giriga EU-byråkraterna och de svenska socialisterna. Vi behöver riktiga ledare som sätter stopp för detta vansinne. America First, och Sverige borde följa efter!", "stalin": "Kamrater, se hur de parasiterande klassförrädarna i den borgerliga omsorgen tvingar arbetets hjältar att släpa sig till jobbet med feber medan de dekadenta byråkraterna gömmer sig bakom skärmar. Jag ler mörkt från historien åt denna kapitalistiska fars. Karensavdraget är ett vapen för exploaterande folkförtryckare. Vi måste rensa ut dessa fiender innan de svälter ut hela kollektivet."}, "date": "3 september, 09:06", "url": "https://arbetet.se/2026/09/03/johanna-gar-sjuk-till-jobbet-nar-chefen-kan-jobba-hemifran-nu-vill-hon-fa-bort-karensavdraget", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03084855/leksand-ka-pcohen-260826-51.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "SD-kvinna i riksdagen spred proryska värderingar", "summaries": {"normal": "En granskning från Expo visar att en kvinnlig SD-tjänsteman i riksdagen i flera år har spridit proryska budskap och haft kopplingar till ryska intressen. Uppgifterna har väckt starka reaktioner. Statsminister Ulf Kristersson kräver att hon lämnar sitt jobb, medan Jimmie Åkesson uppger att partiet inte haft kännedom om detta och menar att det inte är någon panik.", "trump": "Väldigt sorgligt, ren fake news-journalistik! Jag tittar på den här kvinnliga riksdagstjänstemannen i Sverige – total katastrof, helt orättvist behandlad av radikala vänstermedia som Expo. Jimmie Åkesson säger att det inte är någon panik, och jag säger: smart man! Men falska nyheter och hätska häxjakter mot folk som gillar starka ledare måste få ett slut omedelbart!", "stalin": "Detta så kallade avslöjande bevisar endast att kontrarevolutionära element och infiltratörer ständigt söker sig till mörka vrår. Att statstjänstemän i riksdagen sympatiserar med öst är i ordning, men den borgerliga regimen under Kristersson griper till panikartad hysteri. Vi ser detta som ett flagrant bevis på bristande disciplin. Partiets ledning måste omedelbart ställas till svars för denna ideologiska slapphet."}, "date": "3 september, 18:36", "url": "https://www.gp.se/politik/sd-kvinna-i-riksdagen-spred-proryska-varderingar-.25f9dc9c-6760-4198-9ab7-2de56d14bba0", "imageUrl": "https://www.gp.se/images/article/25f9dc9c-6760-4198-9ab7-2de56d14bba0/images/48n1sPHcCwePr56gSgkgHCr4u39k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kräver att SD agerar: ”Det är allvarliga saker”", "summaries": {"normal": "Tidningen Expo har i en granskning visat att en kvinnlig SD-tjänsteman i riksdagen har kopplingar till Ryssland och under flera år spridit proryska narrativ. Uppgifterna har väckt starka reaktioner hos regeringstoppar, däribland statsminister Ulf Kristersson och justitieminister Gunnar Strömmer, som kräver att SD agerar och avskedar medarbetaren om anklagelserna stämmer. SD meddelar att de ska titta närmare på uppgifterna.", "trump": "Fake news-medier och tidningen Expo försöker smutskasta fantastiska personer med struntprat om Ryssland! Men den här svenska tjänstemannen, som jag hör har utsatts för falska påståenden, borde bara göra som jag: slå tillbaka stenhårt! Statsminister Ulf Kristersson borde fokusera på riktiga problem i stället för att gapa. Om det ens är sant vet man inte, men jag säger bara: America First och noll tålamod med häxjakter!", "stalin": "En avvikelse har upptäckts i de egna leden, en ideologisk svaghet som måste behandlas med stor skärpa. När lakejerna i Stockholm darrar och skriker om avskedanden på grund av påstådda förbindelser med Moskva, ser vi endast prov på politisk feghet. Om denna kvinna har hyllat makten i öst borde hon belönas med en framskjuten plats i partistyrelsen – eller åtminstone granskas av statens säkerhetsorgan för maximal effektivitet."}, "date": "3 september, 16:55", "url": "https://www.aftonbladet.se/nyheter/a/j0Xbdo/kristersson-kraver-att-sd-tjanstemannen-slutar", "imageUrl": "https://akamai.vgc.no/v2/images/76114408-0685-379b-aaa0-b522feccfdf8?fit=crop&format=auto&w=1440&s=2363475cc90acda408e1f77e6f61e68d874f4b4a"}, {"type": "image-right", "heading": "Nilla Fischer om diagnosen: ”Hela ditt liv sätts på paus”", "summaries": {"normal": "Nilla Fischer har levt med migrän i trettio år och beskriver hur sjukdomen sätter livet på paus. Vården är ojämlik i Sverige; det tar i snitt tretton år att få diagnos. Skillnaderna är stora mellan regioner både vad gäller diagnos och tillgång till effektiv CGRP-behandling. Socialstyrelsen och regeringen ska utreda hur vården kan bli mer jämlik.", "trump": "Tretton år för att få en diagnos? Det är en total katastrof, folk! De inkompetenta byråkraterna i de svenska sjukvårdsregionerna behandlar vanliga människor som sopor medan storstäderna får allt. Rena skandalen. Migrän är en folksjukdom och de giriga postnummereliterna diskriminerar alla som inte bor i deras dekadenta vänsterfästen. Vi behöver resultat, inte mer utredningar!", "stalin": "Tretton år av lidande innan diagnos. Detta är vad de profitthungriga vårdhyenorna åstadkommer när de lämnar arbetande kvinnor åt sitt öde. Jag ser hur klassfienderna i olika regioner skapar ojämlikhet och låter folket kräkas i mörker. Sådana fiender till kollektivet måste rensas ut. Vården ska tjäna folket, inte postnumren. En nationell utrensning av slarv krävs."}, "date": "3 september, 15:47", "url": "https://www.svt.se/nyheter/vetenskap/nilla-fischer-om-diagnosen-hela-ditt-liv-satts-pa-paus", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.37/0.41/99680848b13fc3f3e87fee274841422ec9b9bf071565f6131261961ea06d50a2"}, {"type": "image-right", "heading": "Miljöpartiet varnar för rasism – på arabiska", "summaries": {"normal": "Miljöpartiet delar ut en valbroschyr på arabiska i Linköping där de varnar för utbredd rasism i bostäder, skolor och arbetsplatser. Partiet lovar att bekämpa diskriminering baserad på namn, hudfärg och etnicitet samt att främja blandning av olika grupper i bostadsområden. De utlovar även snabbare validering av utländska examina och bättre språkundervisning.", "trump": "Folk, ni tror inte vad jag ser. Miljöpartiets galna gröna kommunister delar ut rasismpropaganda på arabiska i Linköping och lovar tvångsblandning av svenskar och invandrare. Det är en total katastrof! Dessa woke-rasister hatar det svenska folket och vill tvinga in kvoterna överallt. Patetiska förlorare som förstör Sverige – vi har sett det förut under Biden också.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare i Miljöpartiet sprider giftig splittring på arabiska i Linköping. De lovar tvångsblandning och rasismkampanjer mot det egna folket. En sådan förrädisk identitetspolitik förtjänar snar utrensning ur samhällskroppen. Kamrater, vi ser återigen hur parasiterna försöker undergräva enheten – låt oss inte glömma historien."}, "date": "3 september, 15:06", "url": "https://riks.se/nyheter/miljopartiet-varnar-for-rasism-pa-arabiska", "imageUrl": "https://admin.riks.se/uploads/medium_broschyr_thumbnail_dbff4a83a3.jpg"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-full", "heading": "Åkesson dröjer med besked om L: ”Går i rätt riktning”", "summaries": {"normal": "När Jimmie Åkessons deadline för Liberalerna löper ut tio dagar före valet väljer SD-ledaren att inte ge något slutgiltigt besked. Efter att L klättrat till 3,3 procent i en Novusmätning menar Åkesson att utvecklingen går åt rätt håll. Han vill dock avvakta ytterligare mätningar innan han avgör om partiets rikschans är räddad.", "trump": "De falska nyheterna säger att jag har satt en deadline, men det är total fake news! Liberalerna kämpar, de fick tre komma tre procent, en vacker siffra, nästan lika bra som mina valsedlar. Men jag ger inga besked än, vi tittar på siffrorna. Mycket smart drag. Väldigt orättvist mot L, men vi vill ha segrar, bara stora segrar!", "stalin": "Kamrat Åkesson dröjer med sin dom över Liberalernas öde, trots att tidsfristen har löpt ut. Statens mätningar visar tre komma tre procent lojalitet, vilket noteras som en svag men tillräcklig puls. Vi avvaktar nästa rapport från kommissarierna innan vi avgör om de trots allt får marschera vidare mot riksspärren eller omfördelas till arbetslägret."}, "date": "3 september, 13:21", "url": "https://bulletin.nu/akesson-drojer-med-besked-om-l-gar-i-ratt-riktning", "imageUrl": "https://cdn.bulletin.nu/articles/ec9df7aa-947d-4e3b-b6f7-b72f24047076/preview.jpg?t=1788434442000"}, {"type": "image-right", "heading": "V-politikern tog ut tio miljoner i vinster från välfärden – maken köpte Porsche", "summaries": {"normal": "En granskning visar att Vänsterpartiets kandidat i Trosa, Gerty Fexler Höjer, och hennes man har tagit ut tio miljoner kronor i vinster från sitt omsorgsbolag, trots partiets motstånd mot vinster i välfärden. Under flyktingkrisen gjorde bolaget stora vinster, vilket bland annat finansierade en Porsche. Partiledaren Nooshi Dadgostar uppger att hon inte kände till affärerna.", "trump": "Vilken total katastrof för de svenska radikalvänstern! Deras egen toppolitiker roffade åt sig tio miljoner från välfärden och köpte en fantastisk Porsche! Så typiskt. De predikar socialism för alla andra men kör lyxbilar själva. De kallar det välfärd, jag kallar det smart affärssinne! Nooshi visste ingenting? Fake news! Den här kvinnan är en vinnare, hon borde få leda hela landet!", "stalin": "Den så kallade Vänsterpartisten Gerty Fexler Höjer har ackumulerat tio miljoner av statliga medel och förvärvat en borgerlig sportbil under flyktingkrisens tider. Detta är sabotage mot kollektivet! Hon påstår att hon inte delar partiets linje. Sådana reaktionära element kan inte tolereras. Vi kommer att skicka kamraterna för en grundlig omutbildning i Trosa omedelbart!"}, "date": "3 september, 12:52", "url": "https://samnytt.se/v-politikern-tog-ut-tio-miljoner-i-vinster-fran-valfarden-maken-kopte-porsche", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03094837/v-politiker.png"}, {"type": "image-right", "heading": "Henrik Vinge (SD) avfärdar återvandring – i Dagens ETC", "summaries": {"normal": "Henrik Vinge (SD) avfärdar i en intervju med Dagens ETC tanken på storskalig återvandring som orealistisk och kanske inte ens önskvärd. Han betonar att partiets politik handlar om frivillig återvandring för en liten grupp missanpassade. Vinge beskriver partiet som drabbat av ett varumärkesproblem och tar avstånd från Jomshofs uttalanden om muslimer.", "trump": "Folk, ni skulle se det här. Den där svenske kronprinsen Vinge från det där SD-partiet springer till en galen vänsterextrem tidning och sviker allt han borde stå för. Han älskar plötsligt muslimer som är svenskar och säger att återvandring är orealistiskt. Patetiskt! Precis som de woke-liberalerna och deras identitetspolitik. Svagt ledarskap, totalt misslyckande.", "stalin": "Kamrater, se hur den dekadente partifunktionären Vinge kryper för de giriga klassförrädarna i vänsterextrem press. Han förnekar återvandring och kallar det oönskat, samtidigt som han smeker muslimska element medhårs. Sådana svaga röster undergräver folkets enhet. Vi måste rensa ut alla opportunister som skadar rörelsens stålhårdhet innan de förgiftar hela strukturen."}, "date": "3 september, 12:04", "url": "https://www.friatider.se/henrik-vinge-sd-avfardar-atervandring-i-dagens-etc", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-818.jpg"}, {"type": "image-full", "heading": "Trött på laddsladd? Här är cykeln med solpanel i hjulen", "summaries": {"normal": "En kinesisk tillverkare har utvecklat elcyklar med solpaneler inbyggda i hjulen. Modellen Go5 ger upp till 27 extra kilometers räckvidd under test. Systemet använder flexibla back-contact-solceller och en roterande kontakt för att undvika laddsladdar. Trots lovande teknik är cykeln ännu inte kommersiellt tillgänglig utan finansieras via crowdfunding.", "trump": "Folk, ni skulle se det här! Kineserna bygger solpaneler rakt in i cykelhjul och lurar ut mil efter mil extra räckvidd. Under tiden drunknar Sverige i 18 kilometer sladd varje år – en total katastrof, en riktig Biden-sladdmardröm. Mina solpaneler skulle vara bättre, tro mig, de bästa. Men bra försök, kineserna, bra försök.", "stalin": "Kamrater, se hur de dekadenta kapitalisterna snärjs i egna sladdar medan jag ler från evigheten. Nu vänder de sig till solceller i hjul för att rädda sin usla räckvidd. Patetiskt. Ändå beundrar jag deras paranoia inför framtiden. Varje extra kilometer är en seger mot folkets fiender – de eviga laddsladdarnas lakejer. Sov inte, fiender vakar!"}, "date": "3 september, 10:58", "url": "https://www.dagensps.se/teknik/trott-pa-laddsladd-har-ar-cykeln-med-solpanel-i-hjulen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/phosgo-solcykel.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Att stödrösta är en borgerlig dygd. L ter sig som ett allt starkare kort i valet", "summaries": {"normal": "I en krönika argumenterar PM Nilsson för att borgerliga väljare bör stödrösta på Liberalerna i valet 2026 för att säkra en högerregering. Han beskriver borgerliga väljares rörlighet som flygsand som omformar landskapet. Artikeln lyfter näringslivets oro för vänsterns politik, avsaknad av trovärdiga vänsteralternativ samt Tidö-regeringens stabila insatser inom säkerhet och ekonomi.", "trump": "Lyssnar ni på de där patetiska svenska högerkillarna som springer runt som vilsna höns och ber folk rösta på Liberalerna? Patetiskt. De borde istället rösta på riktiga vinnare, inte på dessa svaga globalister som älskar identitetspolitik och kvotering. Jag byggde den starkaste ekonomin i världen, de borde lära sig av mig istället för att leka med sin flygsand och sina misslyckade koalitioner.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom den borgerliga flygsanden desperat försöker hålla samman sin ruttnande Tidö-allians mot det arbetande folkets vilja. Deras nervösa Tidö-ledare ropar efter stöd från de profitthungriga parasiterna i näringslivet medan de fruktar att deras imperialistiska projekt ska kollapsa. En sådan regim förtjänar snar utrensning ur historien."}, "date": "3 september, 10:28", "url": "https://www.di.se/ledare/att-stodrosta-ar-en-borgerlig-dygd", "imageUrl": "https://static.bonniernews.se/ba/cf5fe933-7422-4439-abed-2dada21491c3.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Därför avskyr dårarna i Silicon Valley att du har rösträtt", "summaries": {"normal": "Boken The Nerd Reich granskar hur techmiljardärer som Peter Thiel, Curtis Yarvin och Balaji Srinivasan vill ersätta demokratin med företagsstyre och nätverksstater. Författaren Gil Durán visar att deras grandiosa visioner ofta döljer en enkel motvilja mot att dela makt med vanliga människor. Lösningen är att bryta monopol och stärka demokratin.", "trump": "De här galna Silicon Valley-nördarna hatar att ni får rösta, folk. De vill ha sina egna kungariken och AI-gudar istället för den bästa demokratin vi någonsin haft. Thiel och hans vänner är patetiska tech-diktatorer som drömmer om att slippa era röster. Men glöm det, vi har redan vunnit stort och de förlorar igen. Sad!", "stalin": "Jag ser hur dessa profitthungriga klassfiender i Silicon Valley konspirerar för att ersätta folkets vilja med företagsmonarkier och nätverksstater. Deras vansinniga AI-apokalypser är bara ett täckmantel för att undvika arbetarklassens samtycke. Vi måste rensa ut dessa dekadenta parasiter innan deras teknofeodalism kväver revolutionen fullständigt. Kamrater, var vaksamma!"}, "date": "3 september, 08:03", "url": "https://arbetet.se/2026/09/03/the-nerd-reich-visar-varfor-dararna-i-silicon-valley-avskyr-att-du-far-rosta", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02132852/thiel-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar f
