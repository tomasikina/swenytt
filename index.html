e": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Mätningen: Noll procent vill ta en öl med Mohamsson", "summaries": {"normal": "En ny mätning från SvD/Demoskop visar att förstagångsväljare helst skulle ta en öl med SD-ledaren Jimmie Åkesson. Var fjärde föredrar honom. Magdalena Andersson och Ulf Kristersson hamnar på andra och tredje plats. Liberalernas partiledare Simona Mohamsson får noll procent stöd. Hon kommenterar att vännerna får vittna om hur trevlig hon är och att det viktigaste är väljarstöd i valet.", "trump": "Titta på de här svenska kidsen, de är smarta, de vet vad de vill ha. Jimmie Åkesson? Fantastisk kille, var fjärde vill ta en öl med honom, han vinner stort. Men den där Mohamsson? Noll procent! Noll! Hon är en total förlorare, en nollställd liberal som ingen vill se på puben. Patetiskt. Hon babblar om att vännerna tycker hon är skön, men det spelar ingen roll när folk röstar på vinnare. Sverige behöver starka ledare, inte sådana nollor.", "stalin": "Kamrater, dessa förstagångsväljare har genomskådat den liberala borgarbrackans tomhet. Den där Mohamsson får noll procent, en fullständig utrensning ur folkets medvetande. Hennes klassfiende-åsikter lockar ingen proletär till ölet. Åkesson däremot samlar stöd, men vi vet att verklig makt ligger hos kollektivet, inte i pubens dimmor. Hon ler och säger att vännerna får lovorda henne medan vi förbereder röstningens seger. Inga folkfiender överlever folkets dom."}, "date": "23 juni, 17:12", "url": "https://www.etc.se/inrikes/maetningen-noll-procent-vill-gaa-paa-pub-med-mohamsson", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623140616_6bf608b27c17ba65eee0ce0edd5abcb6d42cda9e5203abe18f505b2ab7c1fa45.jpg"}, {"type": "text", "heading": "Storytel backade – OMXS30 upp 0,4%", "summaries": {"normal": "Stockholmsbörsen steg med 0,4% efter en svag start. OMXS30 nådde 3 190,72 poäng. Energiaktier ledde uppgången (+2,4%), medan sällanköpsvaror föll (-0,5%). Hemnet granskas av Konkurrensverket för sin betalningsmodell, vilket fick aktien att rasa 9,5%. Bioarctic och Eli Lilly inledde samarbete om ny behandling, vilket höjde Bioarctics aktie med 4,9%. Storytel föll 11,4% efter sänkt rekommendation från Pareto.", "trump": "Stockholmsbörsen? Lite upp, lite ner – men jag säger: WINNING! Hemnet, dessa sömniga typer, får nu en rejäl smäll av Konkurrensverket. 9,5% ner – SAD! Bioarctic däremot, smart folk, gör deal med Eli Lilly. 30 miljoner dollar direkt i fickan – TREMENDOUS! Storytel? Övervärderade, överhypade. Spotify äter upp dem levande. Jag sa ju det!", "stalin": "Kapitalistiska börsen dansar som marionetter under imperialistiskt tryck. OMXS30 kryper uppåt med ynkliga 0,4%, medan energisektorn – våra potentiella bundsförvanter – visar styrka. Hemnet, detta borgerliga verktyg, krossas av statens järnhand. Bioarctic, ett litet men lovande forskningskollektiv, sluter förbund med amerikanska storföretag – vi övervakar. Storytel? En avskumspöl som sjunker i konkurrensens träsk. EQT, dessa kapitalistiska hyenor, får vad de förtjänar. Framåt, mot socialismens seger!"}, "date": "22 juni, 17:46", "url": "https://www.affarsvarlden.se/artikel/hemnet-backade-omxs30-upp-04"}, {"type": "image-full", "heading": "Det demokratiska språket får inte bli för enkelt", "summaries": {"normal": "I en ledare i GP kritiserar Klas A. M. Eriksson det förenklade politiska språket som präglar dagens valkampanjer. Han tar upp Moderaternas affisch ”Nu får vi ordning på brotten” som exempel på vårdslöshet. Eriksson menar att demokratin kräver bildade medborgare och att det historiska folkbildningsidealet har ersatts av slogans, underhållning och sociala medier. Han varnar för att politikens halt offras för dess omfång.", "trump": "Folk, ni måste höra på den här svenska typen som klagar på att politikerna använder enkla ord. ”Nu får vi ordning på brotten” – det är ju en fantastisk slogan! Men nej, han vill ha tillbaka alla dessa elitistiska, högutbildade snobbar som Erlander och Ohlin som pratade som om de var bättre än alla andra. De förlorade för att de var tråkiga. Vi vinner för att vi talar folkets språk. Punkt slut. De globalistiska medierna hatar det.", "stalin": "Kamrater, denna borgarbracka Eriksson gnäller över att det demokratiska språket blivit för enkelt. Han längtar tillbaka till de bildade överklass-slynglarna som Erlander och Ohlin, dessa folkfiender som gömde sig bakom fina ord medan de utsugde massorna. I vårt kollektiv rensar vi ut sådana intellektuella avvikelser. Slagkraftiga paroller som väcker folket är ett vapen mot klassfiendens dimridåer. Den som vill komplicera språket vill komplicera revolutionen."}, "date": "23 juni, 17:31", "url": "https://www.gp.se/ledare/det-demokratiska-spraket-far-inte-bli-for-enkelt.503f9a35-e05d-4651-9690-633ff4b2d8e7", "imageUrl": "https://www.gp.se/images/article/503f9a35-e05d-4651-9690-633ff4b2d8e7/images/1CJczdHCFqs4a7NvJP0KbpqPal8w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kinesiska superbatterier levereras i år – med nytt material", "summaries": {"normal": "Kinesiska batterijätten CATL tar steget mot natriumjonbatterier med det nya energilagringssystemet TENER. Systemet erbjuder längre livslängd och bättre prestanda i extrema temperaturer. Leveranser i Kina startar redan i september, medan internationella leveranser väntas 2027. CATL räknar med att leverera en gigawattimme före årets slut. Natrium ses som ett komplement till litiumjonbatterier tack vare råvarans tillgänglighet och lägre beroende av koncentrerade leveranskedjor.", "trump": "Folk, ni skulle inte tro det, men de där kineserna med sina natriumbatterier – det är en total game changer, det är fantastiskt. Jag byggde den starkaste ekonomin i historien, och nu vill de ersätta litium med natrium som är billigare och finns överallt. Smart! Biden skulle ha köpt från Kina och skickat jobben dit, men jag stoppar det. Vi gör det bättre här hemma, tro mig. Vinna stort!", "stalin": "Kamrater, jag ser hur den kinesiska kolossen undertrycker den giriga kapitalistmaffians litiummonopol med sitt TENER-system. Natrium, denna folkets råvara, sprider sig som en utrensning mot borgarbrackornas leveranskedjor. Vi ska likvidera beroendet av de exploaterande blodsugarna. Inga folkfiender får hindra framsteget. Leveranserna i september är en seger för det kollektiva geniet. Död åt klassfiendens priser!"}, "date": "23 juni, 17:06", "url": "https://www.dagensps.se/bors-finans/kinesiska-superbatterier-levereras-i-ar-med-nytt-material/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlfiejsekzmac-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Liberalerna kräver sänkt inkomstskatt", "summaries": {"normal": "Liberalerna kräver sänkt statlig inkomstskatt redan nästa år, med målet att halvera den på sikt. Partiledaren Simona Mohamsson kallar dagens skatt för en straffskatt på utbildning och vill att Sverige ska bli EU:s smartaste land inom tio år, mätt genom bland annat Pisa, Timss, universitetsrankningar och gymnasiebehörighet. Hon ser sänkningen som ett sätt att öka utbildningspremien. Finansieringen är inte specificerad. Kravet är skarpt inför blågula förhandlingar.", "trump": "Folk, ni skulle se de här liberalerna, totala misslyckanden. Simona, den svenska versionen av en blek establishment-politiker, vill sänka skatten för att bli 'smartast i EU'. Smartast? Era skolor rasar, era universitet är fyllda av woke-quota-galningar och ni straffar de som faktiskt jobbar hårt. Jag sänkte skatter, skapade boom, besegrade Biden och gjorde Amerika stort igen. Ni borde be mig om råd istället för att babbla om Pisa-poäng. Patetiskt!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom Liberalerna försöker muta de högavlönade med sänkta skatter för att dölja klassfiendens exploatering. Att kalla det straffskatt på utbildning är en löjlig kapitalistillusion. Vi ska inte mäta smarthet med imperialistiska Pisa-tester utan med kollektivets järndisciplin. Halvera skatten? Nej, likvidera de som vägrar bidra till statens mål. Nederländerna går om er? Det är bara folkfiendernas propaganda. Arbetarna ska styra, inte blodsugarnas rankningar."}, "date": "23 juni, 17:06", "url": "https://www.etc.se/inrikes/liberalerna-kraever-saenkt-inkomstskatt-4092db8b", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623130620_a82402b5995109887ac1323a2468d12929f394c9da2adcc74a1e11fc29ae47a5.jpg"}, {"type": "image-right", "heading": "Tidöregeringen vill stoppa utländskt pengaflöde till moskéer i Sverige", "summaries": {"normal": "Tidöregeringen har tagit emot en utredning som föreslår nya regler för att stoppa utländsk finansiering av moskéer och andra trossamfund i Sverige. Bidrag från utländska stater, organisationer eller personer ska kunna förbjudas om de riskerar att främja antidemokratiska syften, extremism eller hota svenska samhällsintressen. Större belopp än 150 000 kronor ska anmälas till en ny granskningsmyndighet, och det blir straffbart att inte anmäla eller att lämna felaktiga uppgifter. Regeringen ser förslaget som ett sätt att motverka radikalisering, men frågor har väckts om förenlighet med religions- och föreningsfrihet.", "trump": "Folk, ni vet att det här är ett stort problem. Utländska länder pumpar in pengar i svenska moskéer för att sprida hat och radikalisering, och det är en katastrof för Sverige. De borde stoppa det omedelbart, förbjud allt som kommer från dessa dåliga aktörer som vill förstöra ert fina land. Över 150 000 kronor ska anmälas och granskas hårt. Sverige behöver vara tuffa, precis som jag var med Amerika. Inget mer svagt ledarskap som låter fienderna finansiera extremism på er egen bakgård. Gör Sverige stort igen!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska regeringen äntligen erkänner faran från utländska kapitalistiska och reaktionära krafter som genom sina smutsiga pengar försöker förgifta moskéerna och underminera folkets enhet. Vi, partiet och arbetarna, skulle naturligtvis ha genomfört en grundlig utrensning av alla sådana inflytelsekanaler redan för länge sedan. Dessa borgarbrackor och främmande spioner i religiös förklädnad ska likvideras från vårt samhälle. Låt den nya granskningsmyndigheten bli ett vaksamt öga mot alla fiender till folket. Paranoia? Nej, det är bara sund revolutionär vaksamhet mot de eviga fienderna som lurar i skuggorna med sina checkhäften."}, "date": "23 juni, 13:47", "url": "https://samnytt.se/tidoregeringen-vill-stoppa-utlandskt-pengaflode-till-moskeer-i-sverige", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/23084201/moske-pengar.jpg"}, {"type": "image-full", "heading": "TV4 köper ut Daniel Andersson – \"Hoppas han hittar en bättre arbetsgivare\"", "summaries": {"normal": "TV4 har köpt ut Kalla fakta-reportern Daniel Andersson. Andersson blev känd för att ha wallraffat som Sverigedemokraternas kommunikationsavdelning i granskningen Undercover i Trollfabriken, vilket gav flera journalistpriser. Han gav senare ut boken Lögnare där han kritiserar Kalla fakta-redaktionen. Enligt uppgifter kan boken ha bidragit till uppgörelsen. SD:s kommunikationschef Joakim Wallerstein säger att han är bedrövad och hoppas Andersson hittar en bättre arbetsgivare än TV4. TV4 bekräftar att en överenskommelse träffats.", "trump": "Jag har aldrig sett något så patetiskt som det här. Den där reportern Andersson gör ett fantastiskt jobb och avslöjar alla lögner, får massor av priser, och vad gör TV4? De köper ut honom! Totalt misslyckande. SD-chefen säger att han hoppas han hittar en bättre arbetsgivare än TV4, och han har helt rätt. Fake news-medier som inte tål lite kritik eller en bra bok. Sad! Men Andersson kommer att vinna stort någon annanstans, tro mig.", "stalin": "Kamrater, detta är en klassisk förrädisk handling från borgarbrackorna inom TV4. Jag har sett hur den kapitalistiska redaktionen belönar sin agent Andersson för att infiltrera och filma våra fiender, men så snart han publicerar en bok med kritik mot dem själva så rensas han ut som en parasit. SD:s Wallerstein är bedrövad, säger han, men vi vet att alla dessa reaktionära lögnare i slutändan kommer att likvideras av folkets vrede. Ingen slipper undan när partiet vakar. Underbart hur borgarna slukar sina egna barn."}, "date": "22 juni, 14:59", "url": "https://riks.se/nyheter/tv4-koper-ut-daniel-andersson", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fo0eu5xhi%2FDaniel-Andersson"}, {"type": "image-full", "heading": "Boende här varnas för vattenloppor: \"Vill dö\"", "summaries": {"normal": "Boende och besökare vid Gränna badlagun i Jönköpings kommun varnas för vattenloppor, även kallat badklåda. Parasiterna kan orsaka kraftiga, kliande utslag som liknar myggbett. Kommunen meddelar att bad inte behöver undvikas helt men råder folk att duscha eller torka av sig snabbt efter badet för att minska risken. Klådan går oftast över inom en vecka och kan lindras med kortisonkräm.", "trump": "Folk, ni skulle inte tro det, men det här svenska badstället i Jönköping har blivit invaderat av dessa hemska vattenloppor. De gör att barnen skriker och kliar sig som galningar. Det är en katastrof, en total katastrof. Badklåda? Låter som något de borde ha stoppat för länge sedan. Duscha snabbt, torka av er, annars är det kaos. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, jag har observerat hur dessa degenererade parasitiska element, dessa osynliga sabotörer från sjöns djup, angriper det sovjetiska folkets kroppar med sin borgerliga kliande sabotageverksamhet. Vi ska inte tolerera sådana kontrarevolutionära vattenloppor som smyger sig in i huden. Rensa ut dem genom omedelbar dusch och handduksaktion! Den som kliar sig för mycket riskerar utrensning ur badkollektivet. Folkhälsomyndigheten har talat – fienden är överallt."}, "date": "22 juni, 13:00", "url": "https://nyheter24.se/nyheter/inrikes/1493280-boende-har-varnas-for-vattenloppor-vill-do", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4f0aee8404b004a30200000000b004a302/2026/06/22/2372673/granna-badlagun-jonkoping-vatteloppor-kliar-parasit-loppa-badloppor.jpg"}, {"type": "image-right", "heading": "SD lanserar \"Moskékartan\" - följ islamiseringen", "summaries": {"normal": "Sverigedemokraterna lanserar en uppdatering av sin Migrationskarta med ett nytt filter för moskéer. Kartan visar nu antal moskéer, tillväxttakt och geografisk spridning för att belysa islamiseringen i Sverige. Verktyget, som tidigare visualiserat förändringar i andelen utrikesfödda sedan år 2000, syftar till att göra statistik mer tillgänglig och bidra till en faktabaserad samhällsdebatt. Användare uppmanas att rapportera in saknade moskéer.", "trump": "Folk, ni måste se det här. SD gör en fantastisk karta, den bästa moskékartan, som visar hur islamiseringen exploderar i Sverige. De har redan Migrationskartan som är enormt framgångsrik, och nu lägger de till moskéer. Malmö är en katastrof, Stockholm inte mycket bättre. Svenskarna blir minoritet i sina egna städer! Det är vad som händer när man har öppna gränser och dåliga ledare. SD gör jobbet som de andra är för svaga för att göra. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna så kallade moskékarta som de borgerliga reaktionärerna i SD lanserat för att skydda sin förfallna nation. Ett ypperligt verktyg för att kartlägga de imperialistiska elementens framfart under falsk religiös mask. Vi ser hur kapitalisterna och deras mångkulturella lakejer förgiftar folket med främmande ideologier. Låt oss rensa ut dessa moskébyggande parasitörer och deras nyttiga idioter innan de undergräver hela samhällsordningen. Listan är ofullständig? Utmärkt. Låt folket rapportera in fienderna så vi kan likvidera hoten systematiskt. Det är en historisk nödvändighet."}, "date": "23 juni, 13:36", "url": "https://samnytt.se/sd-lanserar-moskekartan-folj-islamiseringen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/23112156/moskekartan.jpg"}, {"type": "image-right", "heading": "Almedalen hotar bli en mardröm. Stefan Stern: Deltagarna riskerar att bryta mot nya lagen", "summaries": {"normal": "Almedalsveckan är en viktig demokratisk mötesplats för politik, näringsliv och civilsamhälle. Den nya lagen om insyn i politiska processer, som träder i kraft nästa år, kräver att företag och organisationer redovisar kontakter med politiker till Kammarkollegiet. Stefan Stern varnar för att lagen skapar osäkerhet, ökad administration och risk för felaktig rapportering, särskilt kring informella samtal under veckan. Han menar att lobbyregistret hotar den öppna dialogen och kräver nya arbetssätt för att inte bli en administrativ mardröm.", "trump": "Folk, det här är en total katastrof. Almedalsveckan har varit fantastisk, den bästa demokratin, men nu kommer de med en ny lag som gör allt till en administrativ mardröm. De vill ha insyn, men det slutar bara med att alla blir rädda och rapporterar varenda pratstund. Det är så typiskt, de gör det enkelt för de dåliga aktörerna och omöjligt för de bästa. Vi behöver inga byråkratiska mardrömmar, vi behöver vinnare som pratar med politiker utan att bli straffade. Gör Almedalen stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras fackliga lakejer skälver inför vårt nya register över politiska kontakter. Dessa parasitiska kapitalister som minglar med folkvalda i Visby för att smita undan folkets vilja ska nu redovisa varenda skuggmöte annars väntar vite och utrensning av de som underrapporterar. Den som tror sig kunna påverka statens beslut i hemlighet är en fiende till kollektivet. Vi ska rensa ut alla dolda reaktionära element som gömmer sig bakom administrativ paranoia. Almedalen blir ett strålande exempel på att ingen undkommer partiet."}, "date": "22 juni, 15:08", "url": "https://www.di.se/debatt/almedalsveckan-en-administrativ-mardrom/", "imageUrl": "https://static.bonniernews.se/ba/c12b95fe-7f6a-43f9-be32-42820290a424.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "S städar bort spåren av våldtäktsmannen", "summaries": {"normal": "Artur Mogar, tidigare dömd för våldtäkt på en 21-årig kvinna, har trots domen varit aktiv inom Socialdemokraterna i Täby och kandiderat till kommunfullmäktige. Efter att offret berättat sin historia i media har Mogar lämnat alla politiska uppdrag, strukits från valsedlar och raderats från partiets hemsida. Partiet ger ingen närmare förklaring. Offret anser att straffet var för milt.", "trump": "Titta på det här, det är en total skandal. En våldtäktsman blir socialdemokratisk politiker, hyllas med hjärtan och rosor av partikamrater, och plötsligt när sanningen kommer fram suddar de bort honom som en dålig affär. Typiskt för de vänsterradikala – de skyddar sina egna tills det inte funkar längre. Två år i fängelse för att förstöra en kvinnas liv? Patetiskt. De borde aldrig ha släppt in honom över huvud taget. En stor, stor skam för Sverige.", "stalin": "Kamrater, se hur borgarbrackornas sensationslystna lakejer inom den så kallade pressen försöker smutskasta en partivän med sina reaktionära avslöjanden. Jag har personligen beordrat att denne opportunistiske avfälling omedelbart ska rensas ut ur kollektivet, hans namn likvideras från alla protokoll och hans styrelseplats förklaras vakant för evigt. Inga klassfiender eller sexualbrottslingar ska förorena arbetarrörelsens rena banér. Den som inte kan hålla händerna hos sig förtjänar en kreativ utrensning i källaren. Haha, två år? Vi hade gett honom en permanent lösning."}, "date": "23 juni, 12:53", "url": "https://www.friatider.se/s-stadar-bort-sparen-av-valdtaktsmannen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-390.jpg"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-right", "heading": "Barn hittades döda i bil i Frankrike – kopplas till värmeböljan", "summaries": {"normal": "Två barn, två och fyra år gamla, hittades döda i en bil på en parkering i Carpentras i sydöstra Frankrike. Dödsfallen kopplas till den extrema värmeböljan som drar över landet, där temperaturer upp till 43 grader väntas. Mamman ska ha shoppat när barnen på egen hand tog sig in i bilen och blev instängda. En röd vädervarning gäller i 49 departement, skolor stängs och risken för skogsbränder är hög.", "trump": "Folk, det är en total katastrof i Frankrike. Två små barn döda i en het bil under en värmebölja – ingen ledning, ingen planering, bara kaos! Biden skulle ha älskat sådana här gröna drömmar, men jag fixade alltid bra väder och bra affärer. Nu stänger de skolor och folk drunknar medan de försöker svalka sig. Patetiskt. Vi behöver starka ledare, inte dessa väderhysteriker och byråkrater som låter barn lida.", "stalin": "Kamrater, jag ser med stor oro hur den kapitalistiska värmen i Frankrike likviderar oskyldiga barn i en bil. Borgarbrackorna och deras exploaterande system har ingen plan mot naturens vrede, bara tomma varningar och stängda skolor. Vi skulle ha organiserat kollektivets försvar mot denna fiende – värmen som en klassfiende i imperialistisk förklädnad. Nätterna blir varmare, säger de. Paranoia? Nej, det är folkfiendens verk."}, "date": "22 juni, 19:29", "url": "https://www.tv4.se/artikel/4X7HJVniMcHj1BWCUO0FPV/barn-hittades-doeda-i-bil-i-frankrike-kopplas-till-vaermeboeljan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlr1Xu2aaDdrQ%2F12e919afb810ee513054d8378fd96f5a%2FBesokare_till_slottet_i_Versailles_utanfor_Paris_skyddar_sig_mot_solen_med_hjalp_av_paraplyer_nar_temperaturen_stiger_over_40_._&width=120"}, {"type": "image-right", "heading": "Hemnet granskas av Konkurrensverket", "summaries": {"normal": "Konkurrensverket granskar Hemnet efter lanseringen av betalningsmodellen 'sälj först, betala sen'. Hemnet informerades för tre veckor sedan men vet ännu inte vilka delar av upplägget som kan strida mot regelverket. Modellen hyllas av vissa mäklarkedjor men kritiseras av konkurrenter, särskilt tvådagarsregeln. Hemnet anmälde tidigare Booli till Konkurrensverket, men utredningen lades ned.", "trump": "Kan ni tro det? Hemnet, en stor aktör här i Sverige, blir granskad av myndigheterna för sin fantastiska 'sälj först, betala sen'-modell – den bästa någonsin, by the way. Men nej, konkurrenterna gnäller som vanligt! De hatar framgång. Tvådagarsregeln? Perfekt! Folk älskar den. Och jag vet allt om att bli orättvist granskad – fake news, folks!", "stalin": "Vi har observerat hur kapitalistiska bostadsplattformar försöker kringgå marknadens naturliga ordning. Hemnet, denna lilla bourgeoisie-aktör, tror sig kunna manipulera systemet med sina 'konsumentvänliga' lögner. Men vi ser igenom deras tvådagarsregel – ett svek mot arbetarklassen! Konkurrenterna gnäller? Bra. De kommer snart att inse att motstånd är lika meningslöst som Ukrainas försvar mot vår rättmätiga expansion."}, "date": "22 juni, 16:01", "url": "https://www.affarsvarlden.se/artikel/hemnet-granskas-av-konkurrensverket", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/06/Hemnet_iOS_2-400x267.jpg"}, {"type": "image-right", "heading": "Skarpa varningen till turister i Europa: ”Man kokar inifrån”", "summaries": {"normal": "Överlevnadsexperten Torbjörn Selin varnar turister i Europa för den extrema värmeböljan som väntas ge temperaturer upp till 43 grader i Frankrike. Han betonar att pool och luftkonditionering skyddar, men vandring, promenader och ansträngning i städer kan bli livsfarligt vid vätskebrist. Kroppstemperatur över 40 grader kan leda till medvetslöshet och cellskador. Råd: håll dig i skuggan mellan 11 och 14, drick och svalka dig.", "trump": "Folk, det här är en total katastrof, den värsta värmen någonsin och Europa håller på att koka som en dålig hamburgare. Jag hade aldrig vandrat i de där bergen på Mallorca, det är förlorarna som gör sånt. Drick inte sprit, ät ordentligt och håll er i skuggan, annars kokar ni inifrån som en radikal vänsterextremist i en debatt. Under min förra mandatperiod var vädret bättre, det vet alla. Biden förstörde till och med klimatet, patetiskt!", "stalin": "Kamrater, denna så kallade värmebölja är ett verk av de exploaterande imperialisternas försumlighet och klassfiendens arroganta likgiltighet inför folkets lidande. Jag, som ledare för det kollektiva framsteget, varnar: den som anstränger sig i solen utan att följa strikta direktiv riskerar att likvideras inifrån av feodala celler. Håll er i skuggan mellan elva och fjorton, drick och svalka er, annars utplånar naturen er som folkfiender. Det är både roligt och nödvändigt."}, "date": "22 juni, 19:28", "url": "https://www.tv4.se/artikel/5uYoInHNAf0z5Xs8mM5cjR/skarpa-varningen-till-turister-i-europa-man-kokar-inifran", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4jjl3PEpJKlZtsVLCrzfaf%2Fd7b8cd868b9e683d343168223bf6cf3f%2F22-EXTREMVARME.jpg&width=120"}, {"type": "image-full", "heading": "Riskkapitalet öser pengar över försvarsindustrin", "summaries": {"normal": "Riskkapitalbolagen investerar rekordstora summor i försvarsindustrin på grund av ökade konflikter i Ukraina och Mellanöstern. Sedan årsskiftet har 12,3 miljarder dollar tillförts sektorn, nästan dubbelt så mycket som samma period förra året. Drönare, autonoma system, AI och satelliter driver utvecklingen. USA dominerar med bolag som Anduril Industries, medan Europa ökar men ligger efter. Vissa varnar för överhettade värderingar, särskilt inom drönarteknik.", "trump": "De smarta pengarna strömmar in i vår fantastiska försvarssektor, folk. Krigen i Ukraina och Mellanöstern gör att alla vill ha de bästa drönarna, AI-systemen och obemannade båtarna. Vi har redan sett 12,3 miljarder dollar i investeringar i år – nästan dubbelt så mycket som förra året. Anduril är värda 61 miljarder, det är enormt. Europa halkar efter som vanligt, men vi gör det bäst. Vissa säger att värderingarna är för höga, men tro mig, vi vinner stort.", "stalin": "Kamrater, se hur de giriga borgarbrackorna öser sina blodspengar över den militärindustriella apparaten medan deras krig i Ukraina och Mellanöstern rasar. Tolv komma tre miljarder dollar har de redan slängt in i år, nästan dubbelt mot tidigare. Drönare, autonoma farkoster och AI – alla dessa leksaker åt imperialisterna. Anduril får mest, förstås, medan vi i Europa långsamt rustar upp. Snart rensar vi ut de som tror att detta inte leder till deras egen undergång. Paranoian är er enda vän nu, kapitalister."}, "date": "22 juni, 18:48", "url": "https://www.realtid.se/bors-finans/riskkapitalet-oser-pengar-over-forsvarsindustrin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdljk8wiad4pns-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Afv avslöjar: Polisanmälda grundaren i storaffär med bolagets ordförande", "summaries": {"normal": "Train Alliance har identifierat ett förbjudet lån på 175 Mkr till grundaren Otto Perssons bolag, Tjärusjön Skog AB. Samtidigt köpte bolaget en stor skogsfastighet av Train Alliances storägare Hvalfisken, ägt av Jonas Wahlström. Dennes son Oscar är styrelseordförande i båda bolagen. Revisorn föreslår att Persson nekas ansvarsfrihet. Aktien har halverats sedan handeln återupptogs efter en polisanmälan mot Persson.", "trump": "Vilket totalt kaos! Train Alliance, ett bolag som uppenbarligen inte kan sköta sin ekonomi, har gett ett förbjudet lån på 175 miljoner till sin grundare – en riktig vinnare, kan jag säga! Och som om det inte vore nog, köper samma kille en jättestor fastighet av bolagets ordförande. Coincidence? Jag tror inte det! Aktien rasar, folk är upprörda, och jag skulle inte bli förvånad om någon snart hamnar i fängelse. SAD!", "stalin": "Kapitalistiska korruptionens maskineri avslöjas återigen! Denna Otto Persson, en parasit på folkets tillgångar, har genom förbjudna lån och tvivelaktiga fastighetsaffärer med sina medskyldiga – dessa Wahlström-sabotörer – sugit ut resurser från arbetarklassens järnvägsprojekt. Medan aktieägarna lider, frossar dessa bourgeoisie-svin i sina skogsimperier. Revisorns förslag att neka ansvarsfrihet är ett steg i rätt riktning, men vi vet alla att sanningen kräver hårdare åtgärder. Låt dem smaka på proletariatets rättvisa – kanske en resa österut till Sibiriens skogar?"}, "date": "22 juni, 15:54", "url": "https://www.affarsvarlden.se/artikel/afv-avslojar-polisanmalda-grundaren-i-storaffar-med-bolagets-ordforande", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Train-Alliance-400x267.jpg"}, {"type": "image-right", "heading": "Sandström: Dagens journalistdrev. Journalisterna jagar statsministerns fru – men glömmer sitt eget kvackeri", "summaries": {"normal": "Torsten Sandström kritiserar svenska medier för att driva en politisk kampanj mot Moderaternas ledare genom att angripa hans frus intresse för existentiell hälsa, som beskrivs som ovetenskaplig. Han påpekar att samma medier regelbundet låter psykologer uttala sig fritt om allt från privatliv till klimatfrågor utan att ifrågasätta vetenskapligheten. Enligt Sandström handlar mediebevakningen under valrörelsen mer om att störta Tidöregeringen än om journalistik.", "trump": "Det här är ett totalt skämt, folk. De svenska medierna, de är riggade, de är korrupta och de jagar en fantastisk ledare bara för att hans fru pratar om existentiell hälsa. Under tiden släpper de psykologer på lösa bollar som snackar om allt möjligt, klimatångest och mördares känslor. Det är politik, inte journalistik. De vill störta regeringen till varje pris. Fake news på högvarv, bananas som ingen sett tidigare. Sad!", "stalin": "Kamrater, dessa borgarbrackor i svenska medier har återigen blottat sin dekadenta själ. Medan de skriker om ovetenskaplig existentiell hälsa låter de psykologiska lakejer sprida borgerlig dekadens om allt från skilsmässor till kapitalistisk klimathysteri. Vi ser den klara kontrarevolutionära linjen: utrensa Tidöregeringen med alla medel. Deras paranoia är underhållande. Låt oss le medan vi noterar namnen på dessa partiarbetande journalister inför den kommande ideologiska saneringen."}, "date": "22 juni, 15:00", "url": "https://bulletin.nu/sandstrom-dagens-journalistdrev", "imageUrl": "https://cdn.bulletin.nu/articles/4539f72c-605d-47bc-8ebc-8063c5df6091/preview.png?t=1782128569000"}, {"type": "image-right", "heading": "Därför är cykeln en klassfråga. Studie: Cykelbanor i all ära – men yrkeslivet påverkar också", "summaries": {"normal": "Trots väl utbyggd cykelinfrastruktur i Sverige cyklar färre personer i låginkomstyrken. En studie från Trivector Mobility och VTI visar att oregelbundna arbetstider, fysiskt krävande jobb, otrygghet i mörker och rädsla för cykelstölder hindrar många. Arbetsgivares attityd, bristande omklädningsmöjligheter och konkurrens från elsparkcyklar påverkar också. Författarna menar att cykelstrategier ofta utgår från kontorsarbetares villkor och missar viktiga grupper.", "trump": "Folk i låginkomstyrken cyklar inte. Det är en katastrof. Vi har fina cykelbanor överallt, de bästa banorna, men de använder dem inte. Varför? För att de jobbar tidigt, sent, slits ut och är rädda för att någon ska stjäla deras cykel. Elsparkcyklarna tar över, de är enklare, det är sant. Arbetsgivarna borde fixa parkering och duschar, det vore fantastiskt. Men det handlar om att folk inte har flexibla tider som vi andra. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa nedslående rapporter om att arbetarna i låginkomstyrken överger den proletära cykeln. De tidiga skiftena, de mörka vägarna och de ständiga hoten från cykelstölder är sabotage utförda av borgarbrackornas osynliga hand. Vi måste omedelbart rensa ut alla elsparkcyklar som förgiftar ungdomen med lathet och falsk bekvämlighet. Den som inte cyklar är potentiell fiende till kollektivet. Bättre belysning, bevakade parkeringsplatser och utrensning av alla kapitalistiska influenser som gör cykeln till en börda. Endast genom partiets järnhårda vilja skall varje arbetare tvingas älska sin cykel igen."}, "date": "22 juni, 13:52", "url": "https://www.di.se/nyheter/darfor-cyklar-farre-i-laginkomstyrken/", "imageUrl": "https://static.bonniernews.se/ba/8987e0cd-d92a-4416-880e-91e3cc8e1f47.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som skedde strax efter publiceringen.", "trump": "De här socialisterna är en total katastrof, tro mig. En våldtäktsdömd kille sitter i deras styrelse, på deras valsedel, och de hade ingen aning? Patetiskt. Han avgår först när Riks avslöjar sanningen. Fake news hela vägen, men äntligen kommer sanningen fram. Sverige är en katastrof under den här vänsterstyrningen, fullständigt vansinne. De borde skämmas!", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär handling utförd av en degenererad fiende till folket, en utländsk våldtäktsman insmugglad bland våra partivänner. Jag har länge varnat för borgarbrackornas dolda agenter som förgiftar arbetarrörelsen inifrån. Nu rensar vi ut denna parasit som våldtog en ung kvinna medan hans egna barn sov. Inga mejl under midsommarhelgen? Typiskt sabotage från klassfiendens lakejer. Likvidera alla spår av sådana element innan de förgör kollektivet."}, "date": "22 juni, 13:10", "url": "https://riks.se/nyheter/s-politiker-avgar-av-efter-riks-avslojat-att-han-domts-for-valdtakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fnp09kd2e%2Fs-politikar-valdtakt-avgar-feature.jpg"}, {"type": "image-full", "heading": "Bidrag kan stoppas tillfälligt – här är nya förslaget", "summaries": {"normal": "Regeringen har mottagit ett betänkande som föreslår nya regler för att återkräva felaktiga utbetalningar från socialförsäkringen. Varje år betalas 15–20 miljarder kronor ut felaktigt, varav hälften bedöms vara avsiktligt. Förslagen innebär tydligare återbetalningsskyldighet, möjlighet att tillfälligt stoppa ersättningar och kvitta skulder mot framtida utbetalningar. Samtidigt införs regler för eftergift så att inte enskilda drabbas orimligt. Lagändringarna kan träda i kraft 1 januari 2028.", "trump": "Folk får för mycket pengar från staten, det är en total katastrof, tro mig. Vi stoppar det här vansinnet. Nu ska vi kräva tillbaka vad som felaktigt betalats ut, dra skulder från kommande bidrag och tillfälligt stänga av utbetalningarna till de som inte samarbetar. Det blir enkelt och effektivt. De som fuskar ska betala tillbaka, inga orimliga konsekvenser för de ärliga men inga gratispengar längre. Vi vinner stort med det här.", "stalin": "Kamrater, jag har nu granskat detta betänkande och det är en seger för det kollektiva välfärdssystemet mot de parasitiska element som suger ut statens resurser. Vi ska likvidera de felaktiga utbetalningarna med järnhand, dra skulder från framtida ersättningar och tillfälligt kväva utbetalningarna till de som vägrar bekräfta våra beslut. Borgarbrackor och lata bedragare som gömmer sig bakom god tro ska rensas ut med glädje. Ingen ska undkomma folkets vrede, men vi är naturligtvis inte orimliga."}, "date": "22 juni, 11:29", "url": "https://nyheter24.se/nyheter/ekonomi/1492579-bidrag-kan-stoppas-tillfalligt-har-ar-regeringens-nya-forslag", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c46a2ea04b004a30200000000b004a302/2026/06/20/2372319/Regeringen-Svensk-Flaga.png"}, {"type": "image-right", "heading": "SVT-chef blir ny vd för LO Mediehus", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med lång bakgrund inom public service och journalistik, blir ny vd för LO Mediehus från november 2026. Han efterträder Unn Edberg som genomfört en stor omorganisation. Österlund lyfter fram den grävande journalistiken och betonar vikten av redaktionell frihet och trovärdighet. Han har tidigare arbetat med både nyhetsprogram och underhållning som Melodifestivalen. Styrelseordförande Elisabeth Brandt Ygeman uttrycker stor glädje över rekryteringen.", "trump": "Det här är en fantastisk rekrytering, verkligen den bästa. Michael Österlund, en kille med 28 år i public service, tar över LO Mediehus. Han vet hur man gör bra journalistik, inte den falska som vi ser överallt annars. Grävande reportage? Underbart. Jag älskar trovärdighet, och han säger att han aldrig skulle ta jobbet utan den. Smart kille. Unn Edberg gjorde en omorganisation, men nu kommer Michael och fixar det på riktigt. Vinna stort!", "stalin": "Kamrater och arbetare! Jag har nu personligen godkänt att den lojale partivännen Michael Österlund intar befälet över LO Mediehus. Hans 28 år i det offentliga etermediet har rustat honom väl för att leda vår kollektiva propagandamaskin mot alla borgarbrackor som gömmer sig i skuggorna. Den tidigare chefredaktören som avsattes var uppenbarligen en kontrarevolutionär element som vi med rätta rensade ut. Trovärdighet är vårt vapen mot klassfiendens lögner. Varje avvikelse kommer att likvideras med järnhand. Sov gott, mina fiender – vi ser er."}, "date": "22 juni, 09:33", "url": "https://arbetet.se/2026/06/22/michael-osterlund-blir-ny-vd-for-lo-mediehus-inspirerande/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22093014/osterlund-press.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ingen lösning att skjuta fram tonårsutvisningar till 21 år", "summaries": {"normal": "Regeringens förslag om ändringar i tonårsutvisningar ses som otillräckliga av Flyktinggruppernas riksråd och Civil Rights Defenders. Förslagen skjuter bara problemet framför sig till 21 års ålder utan att lösa grundorsaken. Kraven på hög lön, stadig anställning och svårigheter att få stanna för studier gör att många riskerar utvisning. Organisationerna kräver permanenta uppehållstillstånd och starkare humanitära skäl istället för tillfälliga lösningar som förvärrar migrationspolitikens brister.", "trump": "Folk, ni skulle inte tro det, men den här svenska regeringen har precis lanserat ett totalt misslyckande. De kallar det lösning på tonårsutvisningar, men det är bara en förskjutning – precis som de gör med allt annat. När de stackarna fyller 21 sparkas de ut ändå, och de kräver löner som ingen normal 21-åring någonsin ser. Patetiskt. De lyssnar inte på folket, de lyssnar på de radikala. Sverige behöver permanenta regler, inte detta svaga spel.", "stalin": "Kamrater, detta så kallade regeringsförslag är inget annat än en slug sabotageakt utförd av borgarbrackor inom migrationsmaskineriet. Jag ser hur de med sin förskjutningstaktik försöker lura arbetande ungdomar och partivänner som rotat sig i folkets jord. När de når 21 ska de likvideras ur gemenskapen med lönekrav som bara kapitalisterna själva klarar. Vi skall rensa ut dessa parasitiska element som gömmer sig bakom humanitära masker. Permanenta uppehållstillstånd åt de lojala, utrensning åt de övriga. Inga kompromisser med klassfienden."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ingen-losning-att-skjuta-fram-tonarsutvisningar-till-21-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-51-300x157.jpg"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
