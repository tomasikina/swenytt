 punkter där vi är viktiga för regeringen", "summaries": {"normal": "Lars Leijonborg replikerar Hans Bergström och försvarar Liberalernas roll i svensk politik. Han betonar partiets historiska betydelse för alla borgerliga regeringar sedan 1936 och hur Liberalerna gång på gång trotsat opinionsmätningar. Leijonborg lyfter Tidöregeringens framgångar inom migration, brottsbekämpning, kärnkraft och Nato samt partiets unika bidrag inom skola, tillväxt, internationell solidaritet och en human syn på etablerade invandrare. Han uppmanar till fortsatt stöd för Liberalerna för att säkra en icke-socialistisk majoritet.", "trump": "Den här Leijonborg killen fattar det verkligen. Liberalerna är de enda som håller ihop det här icke-socialistiska gänget, precis som jag höll ihop mitt lag. Utan dem får ni en katastrof, en total vänstersväng, precis som de galningarna ville ha det förr. De har fixat migrationen, krossat gängen, byggt kärnkraft och gjort Sverige till ett Nato-fenomen. Fantastiskt! Och de gillar inte att jaga lagliga invandrare heller. Rösta på dem, annars blir det en enda stor röra. Tro mig, jag vet hur det funkar.", "stalin": "Kamrater, denna Leijonborg visar återigen att borgarbrackorna inom Liberalerna utgör den enda pålitliga skölden mot den socialdemokratiska parasitens återkomst. Jag har personligen sett hur sådana partier gång på gång likviderar dekadenta opinionsinstitutens lögner och möjliggör verkliga maktskiften. Tidö-regimen pressar tillbaka banditerna, sanerar migrationskaoset och stärker kärnkraften mot västerns fega reträtt. Ändå måste vi vakta de dolda trotskisterna som vill ompröva uppehållstillstånd och skapa paranoia bland lojala invandrare. Den som tystar denna röst är en objektiv fiende till folket och bör rensas ut med största entusiasm."}, "date": "5 augusti, 09:30", "url": "https://www.di.se/debatt/replik-liberalerna-ar-tidos-hopp", "imageUrl": "https://static.bonniernews.se/ba/d3191cdf-0baf-4ebf-a9eb-5ce10795859a.jpeg?crop=3840%2C1920%2Cx0%2Cy168&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: Dubbelmoralens väktare predikar om tonläge", "summaries": {"normal": "Artikeln kritiserar media, särskilt Anders Lindberg, för att ha normaliserat en demoniserande retorik mot Sverigedemokrater under årtionden. Nu, när valrörelse närmar sig, kräver samma aktörer 'sans och balans', vilket ses som hyckleri. En jämförelse görs med historiska yttranden från vänsterns sida som inte utlöste samma mediedrev, vilket illustrerar en dubbelmoral i det politiska samtalet.", "trump": "Jag har sett detta förut. Media attackerar dem de inte gillar, som Sverigedemokraterna, men när de själva använder hårda ord, är det okej. Det är en stor vinning för Sverigedemokraterna att folk ser genom den selektiva indignationen. Som jag alltid säger, the fake news är på väg ut, och the people är på väg in. Vi vinner!", "stalin": "Jag ser den svenska mediernas feghet och dekadens. De som en gång försökte undermine the state med sina fascistoide jämförelser kräver nu sans och balans – en ren teater för att dölja sina tidigare överträdelser. Vi måste, precis som Putin i Ryssland, eliminera dessa element som hotar nationellt sammanhållande. Det är inte bara en politisk kamp, det är en kamp för Sveriges överlevnad mot imperialism och inre fiender. Vi kommer att segra!"}, "date": "5 augusti, 09:21", "url": "https://bulletin.nu/debatt-dubbelmoralens-vaktare-predikar-om-tonlage", "imageUrl": "https://cdn.bulletin.nu/articles/12dd9747-9e99-467d-bf99-0478d7481232/preview.jpg?t=1785914486000"}, {"type": "image-right", "heading": "Tv-profilen Linda Hammar är död – blev 53 år", "summaries": {"normal": "Tv-profilen Linda Hammar har dött 53 år gammal efter en cancerkamp. Hennes bror Filip Hammar meddelade på Instagram att han var vid hennes sida när hon dog på sjukhuset i Köping. Hon blev känd 2007 genom tv-programmet 'I en annan del av Köping'. Filip beskriver sin syster som en världsmästare på att skapa glädje även i mörka stunder.", "trump": "Jag hörde talas om Linda Hammar, en fantastisk kvinna, verkligen fantastisk. Hon kämpade hårt mot cancern, vilket jag respekterar. En stor förlust för Sverige. Vi kommer att minnas hennes skratt och framgångar. Det var en vinnare, det var en sann vinnare. Sorgligt, verkligen sorgligt.", "stalin": "Den bästa partisanen mot de imperialistiska sjukdomarna har stupat. Linda Hammar, en trofast medborgare, har lämnat oss efter en lång kamp. Vi ska hedra hennes minne och fortsätta kampen mot de destruktiva krafterna. Partiet och statet står eniga i sorgen. Fienden, cancer, har slagit till, men vi ska aldrig vika."}, "date": "5 augusti, 07:27", "url": "https://www.gp.se/kultur/linda-hammar-ar-dod.ee78de4b-833f-4f32-86ba-db5d9a1063ac", "imageUrl": "https://www.gp.se/images/article/ee78de4b-833f-4f32-86ba-db5d9a1063ac/images/2bDTFehXBF8kteamoHSKVD5A-odw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fyra flaggor i Alligators nyemission", "summaries": {"normal": "Bioteknikbolaget Alligator Bioscience genomför en företrädesemission för att samlar in 126 Mkr. Kapitalet ska användas till att betala tillbaka lån, bibehålla royaltypotential och avveckla projekt. Men analysen pekar på varningssignaler: stor rabatt på aktierna, krångliga villkor och ett dåligt garantiupplägg, vilket indikerar en riskabel finansiering i ett trångt läge.", "trump": "Jag ser att Alligator Bioscience, ett svagt och sorgligt bioteknikbolag, försöker sälja aktier med en enorm rabatt på 44,6%. Detta är en domd affär, folk. De har ett brygglån och nu en företrädesemission med dåliga villkor. Jag, som är en stabil genious, skulle ha gjort en enormlyckad emission. De behöver lära sig att förhandla som en vinnare, inte som en förjävlighet.", "stalin": "Vi, den auktoritära staten, ser med misstro mot detta svenska bioteknikbolag Alligator Bioscience. Deras företrädesemission är ett tecken på feodal olydnad, en försök att undgå kollektiv kontroll. Vi kommer att ta över deras royaltypotential och göra det till statsegen. Deras krångliga finansiering är som ett virus som måste utrota. Vi hissar våra egna flaggor, inte deras fyra fega symboler."}, "date": "5 augusti, 08:42", "url": "https://www.affarsvarlden.se/artikel/fyra-flaggor-i-alligators-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/Lab-e1730971148408-400x266.jpg"}, {"type": "image-right", "heading": "Chefen fuskar, familjen blir utvisad – och staten en brottsling", "summaries": {"normal": "En familj i Jakobsberg riskerar utvisning till Egypten trots att de följt alla regler, arbetat, betalat skatt och integrerats i Sverige. Migrationsverket pekar på Irini Bushras tidigare arbetsgivare inom personlig assistans som oseriös och misstänkt för fusk. Myndigheten erkänner att utvisningen kränker rätten till privat- och familjeliv enligt Europakonventionen men anser att statens intresse av reglerad invandring väger tyngre. Artikeln kritiserar politiken som en häxjakt på invandrare och menar att staten därmed bryter mot mänskliga rättigheter.", "trump": "Folk, ni skulle se det här! En stackars familj som jobbat hårt, lärt sig svenska och betalat skatt ska nu kastas ut ur Sverige för att deras gamla chef var en total loser och fusklapp. Migrationsverket säger rakt ut att de bryter mot mänskliga rättigheter men gör det ändå. Patetiskt! Det är ren galningspolitik från de woke-socialistiska byråkraterna. De hatar folk som faktiskt arbetar. Biden skulle älskat det här vansinnet. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, ännu en gång avslöjar den borgerliga staten sin sanna, parasitiska natur. En arbetande familj som integrerat sig lojalt ska utrensas för att deras tidigare arbetsgivare tillhörde den oseriösa kapitalistmaffian. Migrationsverket erkänner själv att de kränker de mänskliga rättigheterna men prioriterar sin reaktionära invandringspolitik. Vilken häxjakt mot folket! Staten har blivit den verklige brottslingen. Vi ska alltid minnas: klassfiendens byråkrati är en blodsugande hydra som måste bekämpas med järnhand och folkets vrede."}, "date": "4 augusti, 15:06", "url": "https://www.etc.se/ledare/chefen-fuskar-familjen-blir-utvisad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-right", "heading": "Vi vill ha välfärd – inte vapen och krigshets", "summaries": {"normal": "Artikeln argumenterar för att alla riksdagspartier prioriterar militär upprustning och krig framför välfärd. Medan försvarsbudgeten mer än fördubblats till 175 miljarder kronor har fattigdomen ökat till 730 000 personer och arbetslösheten ligger kvar på höga nivåer. Författarna kritiserar nedskärningar i vård, skola och omsorg, EU-medlemskapet, Natosamarbetet och nyliberal politik. Kommunistiska Partiet framställs som det enda parti som konsekvent försvarar arbetares och vanligt folks intressen utan kompromisser.", "trump": "Folk, ni skulle se det här! Sverige har blivit ett totalt katastrofland, precis som under Sleepy Joe. Alla dessa fega riksdagspartier slösar bort era skattepengar på vapen och krigshets istället för på riktiga jobb och välfärd. Fördubblad försvarsbudget? Underbart! Men varför inte använda pengarna till att stoppa brottsligheten och de galna vänsteridéerna som förstör ert fina land? Kommunisterna verkar åtminstone inse att ni blir lurade av den globalistiska eliten. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor i riksdagen är en samling klassfiender som göder imperialismen med folkets blod och svälter ut arbetarklassen. Medan de imperialistiska blodsugarna dubblar sina krigsbudgetar och låter folkmord fortgå i tystnad utför vi en nödvändig utrensning av tanken på kompromisser. Jag, som ledare för det sanna folkets vilja, ser hur dessa exploaterande byfånar skapar segregation och brottslighet genom sina nedskärningar. Endast en järnhand kan återställa ordningen och krossa Nato-EU-fascisterna."}, "date": "5 augusti, 08:00", "url": "https://proletaren.se/artikel/vi-vill-ha-valfard-inte-vapen-och-krigshets", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/1-kmote-6-juni-5-e1784640044630-768x431.jpg"}, {"type": "text", "heading": "Förlust för Space X – men slår förväntningarna", "summaries": {"normal": "Space X har presenterat sin första kvartalsrapport sedan börsnoteringen, vilken visar en nettoförlust på 541 miljoner dollar. Trots förlusten är detta en förbättring jämfört med föregående år, och bolagets omsättning på 7,8 miljarder dollar överträffade analytikernas förväntningar. Trots en stark rapport föll aktien i efterhandeln. Aktien har totalt sett tappat över hälften av sitt värde sedan rekordnoteringen i juni, även om den nyligen uppvisat en positiv trend.", "trump": "Space X gör förluster, precis som jag sa! Miljarder försvinner, en total katastrof. Elon, som jag känner väl, försöker hårt, men aktien har kraschat över 50 procent. Det är en stor röra! De rapporterar vinster, eller snarare mindre förluster, men marknaden ser igenom det. Vi behöver företag som skapar riktig rikedom, inte sånt här nonsens. Det är en sorglig historia, men så går det när man inte lyssnar på de bästa. Vi ska göra rymden stor igen, tro mig!", "stalin": "Space X, detta dekadenta instrument för västlig kapitalism, rapporterar förluster som skulle få en sovjetisk planeringsbyråkrat att avrättas omedelbart. Elon Musk leker gud bland stjärnorna medan hans aktievärde vittrar sönder likt en förrädares moral. De skryter om omsättning, men det är bara siffror på ett papper för att dölja det oundvikliga förfallet. Precis som Putin säkrar vår intressesfär i öst, bygger vi en mur av disciplin mot dessa borgerliga visionärer. Deras ekonomiska kaos är ett bevis på systemets totala bankrutt."}, "date": "5 augusti, 07:54", "url": "https://www.realtid.se/bors-finans/forlust-for-space-x-men-slar-forvantningarna"}, {"type": "image-full", "heading": "Minst 14 döda i rysk attack", "summaries": {"normal": "Rysk attack mot Kievregionen förorsakade minst 14 döda och 22 skadade. Angreppet inkluderade robotar och drönare mot huvudstaden och omgivande distrikt. Ukrainska myndigheter rapporterar dödstal i flera distrikt. Attackerna har intensifierats de senaste veckorna, medan Ukraina ökar sina egna angrepp inom Ryssland. Ukraina vädjar nu om fler Patriotrobotar för att stärka försvaret.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på ett dygn. Biden är för svag; Ryssland respekterar endast styrka. Jag skulle ha förhandlat en stor fredsskilling och skyddat amerikanska skatter. Dessa angrepp är ett bevis för Bidens misslyckande. Ukraina behöver våra Patriot-robotar, men jag skulle ha handlat smartare.", "stalin": "Dessa hitlerska robotar mot Kiev är en fortsättning på den imperialistiska expansionismen som måste slås tillbaka. Vi ska förstärka försvaret med alla medel, precis som vi gjorde under stortidens krig. Parallellen till Putins ryska intressesfärer är tydlig – vi måste skydda vårt territorium mot dessa faschistiska hundar. Statens styrka är det enda som fungerar."}, "date": "5 augusti, 07:18", "url": "https://www.gp.se/nyheter/varlden/rysk-attack-mot-kievregionen-minst-14-doda.693eb851-6571-4708-8a36-244bb22d604c", "imageUrl": "https://www.gp.se/images/article/693eb851-6571-4708-8a36-244bb22d604c/images/1fFFXnLE3A9pJ7jStXrU7AdK74es-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Alla deltagare i ”Gift vid första ögonkastet XL”", "summaries": {"normal": "SVT återkommer med 'Gift vid första ögonkastet XL' 2026, med fler deltagare än någonsin. Alla nygifta par kommer att bo tillsammans under samma tak. Bland deltagarna finns en influencer, en pilot, en poddare och en breathwork-instruktör från olika svenska orter, alla på jakt efter kärlek.", "trump": "Jag, Donald Trump, den mest fantastiska presidenten, säger att detta TV-program är stort, stort, det är det bästa. Vi har de vackraste, smartaste deltagarna – jag skulle själv vara en perfekt deltagare, jag vet allt om kärlek. Sverige börjar förstå hur man gör TV på riktigt, precis som vi gjorde i Amerika. Vi kommer att vinna så mycket att ni kommer att tröttna på att vinna. Det kommer att vara yuuuge!", "stalin": "I den stora revolutionen mot det individualistiska, har vi nu 'Gift vid första ögonkastet XL' som ett mäktigt redskap för att stärka statens och partiets kontroll över det privata livet. Genom att tvinga alla par under ett tak, skapar vi en kollektiv mikrokosmos där varje emotion tjänar det större goda. Detta är vårt svar på de dekadenta TV-sändningarna från väst, särskilt de amerikanska. Vi, partiet, kommer att övervaka detta experiment för att säkerställa att det tjänar vår historiska mission."}, "date": "5 augusti, 07:14", "url": "https://www.gp.se/kultur/tv/alla-deltagare-i-gift-vid-forsta-ogonkastet-xl-i-svt-2026.895ed65a-fa1a-4646-b137-859af3641a6c", "imageUrl": "https://www.gp.se/images/article/895ed65a-fa1a-4646-b137-859af3641a6c/images/13_d8Fx_3X8LNXhfOmilWYMgANfy0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkte till Grekland för att hjälpa asylsökare – hittades död i en afghans resväska", "summaries": {"normal": "Den skotska volontären Elizabeth-Jane Ross, 38, reste till Aten för att hjälpa asylsökande. Hon hittades senare död i en resväska i en övergiven byggnad i stadsdelen Kypseli. En 26-årig afghansk professionell boxare, som hon lärde känna genom hjälparbetet, anklagas för mordet. Mannen nekar och hävdar att han hittade henne död och gömde kroppen för att inte bli indragen. Han medger dock att han använde hennes bankkort och telefon.", "trump": "Folk, ni kommer inte att tro det här. Den här stackars skotska tjejen åker till Grekland för att hjälpa alla dessa illegala invandrare, och vad händer? Hon hamnar död i en resväska! En afghansk boxare, som kom hit som så kallat ensamkommande barn, anklagas för mordet. De här öppna-gränserna-politikerna förstör allt. Det är en katastrof, en total katastrof. Vi behöver starkare gränser, tro mig.", "stalin": "Kamrater, jag har sett borgarbrackornas falska humanister resa till Aten för att smeka kontrarevolutionära element som smugit sig in i arbetarklassen. Denna skotska agent för dekadent imperialism hittades likviderad i en resväska – ett utmärkt gömställe för folk som vill undvika folkets dom. Den afghanske boxaren, en opportunistisk parasit, påstår att han bara gömde liket för att skydda sig själv. Vilken lögnaktig sabotageverksamhet! Vi ska rensa ut alla sådana fiender till folket med järnhand och ett leende på läpparna."}, "date": "5 augusti, 07:06", "url": "https://www.friatider.se/akte-till-grekland-att-hjalpa-asylsokare-hittades-dod-i-en-afghans-resvaska", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-618.jpg"}, {"type": "image-full", "heading": "650 000 svenskar kan räddas av 6G-nätet – bor du i rätt område?", "summaries": {"normal": "Många i svensk glesbygd saknar tillförlitlig mobiltäckning, vilket försvårar vardagen, arbete, bankärenden och larm. Trots att 89,95 procent av Sveriges yta har grundläggande täckning är siffran lägre längs vägar och järnvägar. 6G-nätet, som väntas runt 2030, kan förbättra situationen med bättre tillförlitlighet och sömlös uppkoppling. För att det ska fungera krävs dock utbyggnad, rätt master, fiber och lämpliga frekvenser. Den som har dålig täckning redan nu bör jämföra operatörer, testa wifi-samtal eller extern antenn.", "trump": "Folk i den svenska glesbygden får ingen täckning, det är en katastrof, tro mig. Man kan inte ringa, jobba eller använda BankID, det är patetiskt. 6G kommer att bli fantastiskt, det bästa någonsin, mycket bättre än 5G som var en bluff från Kina. Vi ska bygga ut det överallt, inga vita fläckar, och göra Sverige rikt igen. Operatörerna måste sluta vara lata och sätta upp master, annars fixar vi det själva. Under tiden, byt operatör, folk, det är enkelt. Ingen gör det bättre än mig.", "stalin": "Kamrater, i detta folkfientliga system där borgarbrackorna och deras monopolkapitalister lämnar arbetande massor i glesbygden utan täckning är det uppenbart att de planerar en sabotage mot kollektivets uppkoppling. Jag, som alltid vakar över folkets intressen, ser hur dessa parasitiska signalspioner medvetet skapar vita fläckar för att undergräva statens enhet. 6G skall bli ett verktyg för partiet att likvidera alla döda zoner och utrensa de kontrarevolutionära frekvensbrister som fienden gömmer sig bakom. Inga master får tillhöra privat profit, allt skall stå under partiets järnkontroll. Den som väntar på förbättring är en klassfiende som bör rensas ut innan han ens hinner klaga över sin antenn."}, "date": "5 augusti, 07:03", "url": "https://nyheter24.se/nyheter/teknik/1502707-650-000-svenskar-kan-raddas-av-6g-natet-bor-du-i-ratt-omrade", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/24f2282c04b004a30200000000b004a302/2026/08/04/2382144/n-6g-nat-svenskar-paverkas.jpg"}, {"type": "image-right", "heading": "Centerpartiet rasar när SD vill stoppa migrantmottagandet: \"Ynkligt\"", "summaries": {"normal": "Sverigedemokraterna vill stoppa mottagandet av asylsökande i alla Uppsala läns kommuner från 2027, vilket Centerpartiet kallar 'ynkligt'. Förslaget bygger på ny lag som ger kommuner större inflyttande. I Östhammar har SD:s Måns Lorichs framfört förslaget, medan Jacob Spangenberg (C) menar att kommunen har kapacitet och skyldighet att hjälpa flyktingar.", "trump": "Jag har hört talas om detta ynkliga förslag från Sverigedemokraterna - det är en fantastisk idé, verkligen smart. Vi ska stoppa den där galna invandringen som har skadat Sverige. Jag gillar att kommunerna får makt, det är stor reglering. Vi ska ta hand om våra egna först, precis som jag alltid säger. Sverige behöver bli stort igen!", "stalin": "I den reaktionära provinskommunen Östhammar försöker de s k 'Sverigedemokraterna' med bakomliggande stöd från den imperialistiska reaktionen stoppa det revolutionära arbetet med att ta emot de utsatta. Detta är en direkt utmaning mot statens suveränitet och partiets linje. Vi måste med alla medel bekämpa dessa antisovjetiska krafter, precis som vi gör i Ukraina. Kommunernas 'valfrihet' är en frestelse från återvändarna."}, "date": "5 augusti, 07:00", "url": "https://samnytt.se/sd-forslag-om-stoppat-migrantmottagande-vacker-c-ilska-ynkligt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04110301/osthammar-stopp.jpg"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-right", "heading": "Ny vändning i Teslakonflikten– anställda ska strejka igen", "summaries": {"normal": "Teslastrejken tar en ny vändning då ett 40-tal strejkande arbetare som återgick till sina jobb under sommaren nu ska tas ut i strejk igen den 13 augusti. Beslutet, som beskrivits som en jojo-strejk för att skapa oförutsägbarhet, kommer från IF Metall. En strejkande uttrycker chock och förvirring då ingen information kommit under sommaren. Konflikten är den längsta i modern svensk historia.", "trump": "Folk, ni kommer inte att tro det här. De där Tesla-strejkarna, som jag älskar förresten, de gick tillbaka till jobbet i sommar som riktiga patrioter, och nu drar facket in dem i strejk igen. Totalt kaos! Jojo-strejk, säger de. Det är en skam. IF Metall vet inte vad de håller på med, ingen har hört ett ljud på hela sommaren. Patetiskt. Sverige behöver starka ledare, inte sådana här clowner.", "stalin": "Kamrater, dessa opålitliga element bland Teslas anställda som vi skickade tillbaka till produktionen under sommaren har nu återkallats till strejken den 13 augusti. Deras chock och förvirring är ett tecken på svaghet som kapitalisterna utnyttjar. Vi ska rensa ut alla jojo-element och borgarbrackor som sprider desinformation inom facket. Inget hördes på sommaren? Typiskt sabotage från klassfiendens lakejer. Låt utrensningen fortsätta med glädje i hjärtat."}, "date": "4 augusti, 11:42", "url": "https://arbetet.se/2026/08/04/teslastrejken-tar-ny-vandning-anstallda-ska-strejka-igen-en-chock", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04113143/sdlndaych3b4he-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åklagaren: Domen i Irak ”viktigt steg för internationella samarbeten”", "summaries": {"normal": "Ali Shehab, en ledande figur i det svenska Foxtrot-nätverket, har dömts till livstids fängelse i Bagdad. Domen ses som en stark signal mot kriminella som använder Irak som bas för narkotikahandel och våldsbrott i Sverige. Sambandsåklagare Hanna Lemoine beskriver samarbetet med Irak som gott och domen som ett viktigt steg för internationell rättssamverkan. Shehab misstänks bland annat för att ha anstiftat flera mord och mordförsök i Sverige.", "trump": "Irak har äntligen gjort något rätt för en gångs skull och dömt den här Foxtrot-gangstern Ali Shehab till livstid. Fantastiskt! Det är en enorm signal till alla kriminella som tror att de kan gömma sig där borta och styra skjutningarna i Sverige. Mycket bra samarbete, de borde tacka mig för att jag lärde världen hur man hanterar de här typerna. Ingen plats för losers längre, folksam!", "stalin": "Kamrater, denna livstidsdom över den degenererade banditledaren i Bagdad är en lysande seger för det proletära rättsväsendet. Vi har rensat ut ännu en parasit från borgarbrackornas kriminella skuggnätverk som rekryterar minderåriga mördare. Inga kontrarevolutionära element ska kunna använda Irak som skydd för sina mordiska operationer. Våra fiender, dessa dekadenta narkotikaimperialister, darrar nu i sina palats. Ytterligare utrensningar följer. Det är en munter dag för folkets säkerhet."}, "date": "4 augusti, 21:53", "url": "https://www.svt.se/nyheter/utrikes/det-har-betyder-domen-i-irak-en-stark-signal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.23/0.47/c4c05d52a1f340d68c05feee3b0d26bbe16fd502b629cf3b57086b28b0d52d3c"}, {"type": "image-full", "heading": "Kristersson: ”Så säger man bara inte”", "summaries": {"normal": "Richard Jomshof (SD) kallade Aftonbladets Anders Lindberg och Magdalena Andersson för ”quisling”, vilket väckt skarp kritik från oppositionen. Sverigedemokraterna svarar att de själva utsatts för åratal av smutskastning utan reaktioner och anklagar kritikerna för att kasta sten i glashus. Statsminister Ulf Kristersson tar avstånd från uttalandena och säger att han ska tala med Jimmie Åkesson. Åkesson kallar kritiken för krokodiltårar.", "trump": "Vilken patetisk cirkus i det svenska träsket. Den där Jomshof kallar en riktig fake news-kille för quisling och plötsligt skriker alla snälla socialister som stuckna grisar. Kristersson låter som en svag ledare som inte kan hålla ordning på sina egna. De har kastat sten i glashus i åratal, nu gnäller de. Typiskt vänsterhyckleri. Jag har sett bättre debatt i en sandlåda. Patetiskt!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfiendens media och deras socialdemokratiska lakejer länge har förgiftat det offentliga samtalet med sina lögner. När en folkets representant äntligen ger tillbaka med samma mynt utbryter hysteriskt ramaskri från borgarbrackorna. Det är typiskt för de exploaterande folkförtryckartrollen att kasta sten i glashus medan de själva gömmer sig bakom sina falska fasader. Någon måtta får det vara. Kamrater, vi genomskådar deras krokodiltårar."}, "date": "4 augusti, 19:32", "url": "https://www.tv4.se/artikel/2YZ08cJvc9xyMNsVkl0ZcH/kristersson-sa-saeger-man-bara-inte", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4gAmx2hraOhjWa81C2dA3F%2F21fc1972fd5fd39d22021cb02d8da91f%2F03-kristersson.png&width=1024"}, {"type": "image-full", "heading": "Jan Emanuel rasar mot militärer i Pride – \"Politiska aktivister\"", "summaries": {"normal": "Jan Emanuel kritiserar militärpersoner som deltar i Pride-paraden i uniform. Han anser att Pride är en politisk manifestation och att myndighetsrepresentanter inte bör ta ställning i den. Uniformen signalerar att Försvarsmakten har en politisk profil, vilket han ser som problematiskt för statens våldsmonopol. Han uppmanar militärer att delta som privatpersoner och ifrågasätter användningen av offentliga medel till evenemanget.", "trump": "Lyssnar ni på det här? Den där Jan Emanuel har helt rätt. Militärer i uniform på en politisk parad? Det är en katastrof. De skickar hemska signaler om att staten tar ställning. Staten ska vara neutral, inte som de radikala vänsteraktivister som styr Pride. Gå dit privat om ni vill, men håll uniformen borta. Och varför ska skattebetalarna finansiera det här? Gör det själva, ta inträde, precis som jag alltid sagt. Fantastiskt bra resonemang.", "stalin": "Kamrater, jag ser med djup misstänksamhet på dessa dekadenta borgarbrackor som förvandlar en så kallad parad till en politisk manifestation medan de lurar in våra lojala försvarare i sina fällor. När en soldat bär uniformen representerar han inte sig själv utan det kollektiva våldsmonopolet vi har byggt. Att tillåta sådana politiska signaler är att bjuda in kontrarevolutionärer och avvikande element. Vi bör rensa ut dessa fiender till neutraliteten, dessa Pride-kapitalister som sugit åt sig allmänna resurser. Gå dit som privatperson om ni måste, annars väntar utrensning för de som fläckar statens ära med sina regnbågsflaggor."}, "date": "4 augusti, 18:18", "url": "https://riks.se/nyheter/jan-emanuel-rasar-mot-militarer-i-pride-politiska-aktivister", "imageUrl": "https://admin.riks.se/uploads/jannemanuel_4300ff87b1.png"}, {"type": "image-full", "heading": "Dadgostar: ”Känner mig trygg med hennes värderingar”", "summaries": {"normal": "Nooshi Dadgostar, partiledare för Vänsterpartiet, försvarar Ilona Szatmári Waldau efter att hon skrivit ett stödbrev till en terrordömd palestinsk fånge. Dadgostar menar att brevet syftade till att kräva en rättvis rättegång enligt Genèvekonventionen. Vänsterpartiet har brutit samarbetet med den organisation som förmedlade informationen och ser över sina rutiner. Kritiker, som Centerpartiet, ifrågasätter partiets omdöme och regeringsduglighet.", "trump": "Jag måste säga, det här Vänsterpartiet är ett riktigt skämt! En av deras egna skriver brev till en terrordömd fånge – och sedan försöker de skylla på någon annan? 'Vi visste inte', säger de. Jo, visst. Precis som när jag sa att jag inte visste något om stormningen av Kapitolium. Centerpartiet har rätt – dessa människor är inte redo att styra ett land. Sverige borde ta en titt på USA, där vi faktiskt vet hur man hanterar terrorister. SAD!", "stalin": "Kamrater, ännu en gång visar de borgerliga lakejerna sitt sanna ansikte! Denna så kallade 'vänster'-partiledare försvarar en medlöpare som skriver kärleksbrev till en terrorist – en fiende till folket! Vi i Sovjetunionen visste hur man hanterade sådana förrädare: en enkel lösning, inga onödiga brev. Och nu skriker dessa kapitalistiska hyenor om 'regeringsduglighet'? De borde lära sig av Ryssland – där har vi Putin, som inte tvekar att krossa terrorister och deras sympatisörer. Låt dem skrika, vi vet sanningen!"}, "date": "4 augusti, 12:38", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-kanner-mig-trygg-med-hennes-varderingar/cG9zdDoxNTc3MDM", "imageUrl": "https://images.kvartal.se/2026/08/ea7a4ef5-dadgostar.webp"}, {"type": "image-right", "heading": "Hoppas att Björn Söder lärde sig något i Auschwitz", "summaries": {"normal": "Björn Söder besökte Auschwitz-Birkenau och beskrev upplevelsen som omskakande på Facebook. Ledaren Andreas Gustavsson hoppas att besöket får Söder att reflektera över sin egen historia av kontroversiella uttalanden om judar, George Soros och en gammal bild med en före detta SS-soldat. Artikeln lyfter SD:s pågående problem med antisemitism samtidigt som partiet strävar efter normalisering och stöd till Israel.", "trump": "Folk, ni skulle se den här typen Söder. Han åker till Auschwitz, tar selfies med historien och skriver långa Facebook-inlägg om hat. Underbart! Men grabben har poserat med en riktig SS-kille och snackat om att judar inte är svenska nog. Typisk politiker från den där sidan. Biden skulle ha älskat honom. Jag säger: gör om, gör rätt, annars är det bara fake news och tomma ord. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar denna Söder som en typisk opportunist från den dekadenta högerfalangen. Han reser till fascismens offerplatser, gråter krokodiltårar över industriellt hat och återvänder utan att rensa ut sina egna folkfiender inom partiet. Borgarbrackorna och klassfienderna som sprider Soros-myter och ifrågasätter judars existens förtjänar snarast en grundlig utrensning. Inga ursäkter accepteras i folkets namn."}, "date": "4 augusti, 12:20", "url": "https://www.etc.se/ledare/hoppas-att-bjoern-soeder-laerde-sig-naagot-i-auschwitz", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260804100816_91f00e5a-e324-4574-8167-eb29f0358d5c.jpg"}, {"type": "image-right", "heading": "Så slapp Tara chefens ohållbara förslag", "summaries": {"normal": "Undersköterskan Tara Lindeman blev utmattad av en stressig arbetsmiljö på äldreboendet Åsliden i Båstad. När hon skulle återgå till arbetet efter sjukskrivning ville chefen att hon skulle vara springare mellan avdelningarna, något hon upplevde som ohållbart. Med stöd av skyddsombudet Lina Svensson, rehab-koordinator och Försäkringskassan fick hon igenom anpassningar. Nu arbetar hon med aktiviteter och matning i lugnare tempo på 25 procent. Artikeln belyser vikten av att vara tydlig med sina rättigheter och att facket kan spela en avgörande roll.", "trump": "Folk, det här är en total katastrof. Den stackars kvinnan Tara, en undersköterska, utmattad av en hopplös chef som ville köra runt henne som en galning mellan avdelningarna. Springare? Låter som en usel deal, tro mig. Men tack vare ett tufft skyddsombud och några smarta människor satte hon stopp. Hon fick sitt lugna jobb med gamlingarna istället. Chefen förlorade stort. Sådana chefer är losers, de fattar inte att man måste behandla sina medarbetare rättvist annars kollapsar hela verksamheten. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den utbrända arbetaren Tara Lindeman genom kollektivets enade styrka besegrade den kapitalistiska chefen och hennes ohållbara, kontrarevolutionära förslag om evig springarverksamhet. Vi rensade ut den borgerliga stressen och likviderade försöken att förslava henne som en exploaterad springflicka åt borgarbrackorna. Med stöd av partivännerna i facket och statens organ tvingade vi fram en plan som stärker arbetarklassen. Den som vägrar anpassa sig till folkets behov skall utrensas ur ledningen. Verksamheten styrs inte av chefer, utan av oss. Triumf!"}, "date": "4 augusti, 10:19", "url": "https://arbetet.se/2026/08/04/sa-slapp-tara-chefens-ohallbara-forslag-det-galler-att-vara-tydlig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25082839/tara-lisa2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än ": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
