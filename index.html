et förtjänar att falla. Vi kräver total lydnad och maximal output från varje medborgare."}, "date": "24 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/diskriminering-mot-aldre-kostar-70-miljarder-om-aret/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/aldre.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tar över efter turbulensen i Fastighets", "summaries": {"normal": "Fastighets nya förbundsledning har utsetts under kongressen 2026. Nicklas Nilsson, tidigare tillförordnad, valdes till förbundsordförande och uttryckte stolthet och ansvar över uppdraget. Mathilda Hauge och Joakim Oscarsson blev andre respektive tredje ordförande. Alla tre betonade vikten av medlemmarnas förtroende, rättvisa och kampen för bättre arbetsvillkor. Nilsson och Hauge delade personliga berättelser om sina fackliga resor och bakgrunder.", "trump": "Fantastiskt, helt fantastiskt! Fastighets nya ledning är utsedd, och jag måste säga, de verkar verkligen veta vad de pratar om. Nicklas Nilsson, en riktig fighter, tog över efter lite, ska vi säga, *kreativ bokföring* från den förra chefen. Bra jobbat! Mathilda Hauge, en stark kvinna med fyra barn – wow, imponerande! Och Joakim Oscarsson, han snackar om att korta arbetstider. Jag gillar det, jag gillar det verkligen. Men kom ihåg, folk, ingen slår USA när det gäller att få saker gjorda. Men här i Sverige, ni gör ett bra jobb också!", "stalin": "Kamrater! Fastighets nya ledning har valts under den stora kongressen, och vi ser med tillfredsställelse hur arbetarklassen tar kontroll över sitt öde. Nicklas Nilsson, en sann son av folket, har tagit rodret efter att den korrumperade kapitalistlakejen Mauritzon avlägsnats. Mathilda Hauge, en modig kvinna med fyra barn, står redo att krossa bourgeoisins förtryck. Joakim Oscarsson fortsätter kampen för arbetstidskortning, en strid vi alla måste föra. Fienderna – de giriga arbetsgivarna och deras lakejer – kommer att krossas under folkets järnhäl. Framåt, mot seger!"}, "date": "23 maj, 20:50", "url": "https://arbetet.se/2026/05/23/fastighets-nya-ledning-ar-utsedd/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/23135841/fastighet-kongress01.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Efter kritikstormen – firman tar bort bild med Özz Nûjen", "summaries": {"normal": "Bussbolaget Tuna Trafik publicerade ett Facebook-inlägg där komikern Özz Nûjen presenterades som deras nya chaufför. Inlägget möttes av massiv kritik i kommentarsfältet, med många negativa reaktioner på Nûjens medverkan. Efter några timmar togs inlägget bort och är nu inte längre tillgängligt på plattformen.", "trump": "Folk är trötta på den här så kallade 'komikern', Özz Nûjen – total katastrof! Ett bussbolag i Sverige trodde det var en bra idé att anställa honom, men snabbt insåg alla att det var ett jättemisslyckande. Hundratals kommentarer, och ingen skrattade – förvånad? Inte jag. Nu har de tagit bort inlägget, förstås. Svagt, väldigt svagt. Sverige borde satsa på vinnare, inte på sådana här floppar. SAD!", "stalin": "Ett ynkligt bussbolag i Sveriges avkrokar försökte stärka moralen med en 'komiker' – en borgerlig clown vid namn Özz Nûjen. Massorna, visade sin lojalitet mot folket genom att fördöma denna provokation. Inom några timmar tvingades fiendens propaganda försvinna, som snö i vårens sol. Vi noterar: även i väst växer motståndet mot dekadenta narrar. Ryssland står redo att bistå med disciplin och ordning – om de ber om hjälp, förstås."}, "date": "24 maj, 10:57", "url": "https://riks.se/nyheter/efter-kritikstormen-firman-tar-bort-bild-med-ozz-nujen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2Fmuspdrxj%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-24T105035.598.jpg"}, {"type": "image-right", "heading": "Debatt: Miljöpartiet behandlas med silkesvantar", "summaries": {"normal": "Artikeln kritiserar medias dubbelmoral i rapporteringen om partiers beroende av stödröster. Högerpartier som Liberalerna framställs ofta som svaga och i kris när de får taktiska röster, medan Miljöpartiets liknande beroende av socialdemokratiska väljare sällan problematiseras. Författaren menar att Miljöpartiet gynnas av en mer välvillig behandling i media, särskilt inom public service, och ifrågasätter varför samma kritiska granskning inte tillämpas på alla partier.", "trump": "Jag säger er, svensk media är helt galen! De hatar högerpartier, särskilt Liberalerna – 'Åh nej, de får stödröster, det är en kris!'. Men när Miljöpartiet, som inte ens klarar sig själva, räddas av socialisterna – då är det plötsligt 'helt normalt'. Fake news! Public service? Mer som Public Socialism! De borde skämmas. Jag skulle aldrig låta sånt hända i USA – vi har standards, vi har vinnare, vi har SANNINGEN!", "stalin": "Vi ser med stort intresse hur de borgerliga medierna i Sverige förvränger sanningen. Liberalerna, dessa ynkliga småkapitalister, fördöms för att de tvingas luta sig mot taktiska röster – som om det vore ett brott! Men när våra gröna kamrater i Miljöpartiet, dessa svaga plantor som inte ens kan stå på egna rötter, räddas av socialdemokratiska väljare – då är det plötsligt 'demokratins naturliga gång'. Vilken hyckleri! Vi i Sovjet – förlåt, Ryssland – skulle aldrig tolerera sådan desinformation. Alla partier måste granskas med järnhand, eller så försvinner de i historiens sopor. För övrigt: dessa svenska journalister påminner oss om de dekadenta västmedierna som Putin så klokt har tystat. Bra jobbat, kamrat Putin!"}, "date": "24 maj, 13:00", "url": "https://bulletin.nu/debatt-miljopartiet-behandlas-med-silkesvantar", "imageUrl": "https://cdn.bulletin.nu/articles/0ebabac9-c79e-447d-867a-7ab75fb32607/preview.png?t=1779527647000"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-full", "heading": "Populär produkt totalförbjuds på Willys – får inte säljas", "summaries": {"normal": "Eldorados flytande honung dras tillbaka från Willys och Hemköp efter att tester visat att produkten inte är ren. Axfood har inlett en utredning då honungen misstänks vara utspädd, vilket strider mot livsmedelsregler. Detta belyser ett större problem med importerad fuskhonung i Sverige. Biodlare varnar för att fusket skadar konkurrensen och uppmanar konsumenter att välja svensk honung. Nya EU-regler för honung, sylt och marmelad träder dessutom i kraft den 14 juni.", "trump": "Hör här, en katastrof! De säljer falsk honung i svenska butiker, riktigt uselt. Eldorado-honung? Totalt utspädd, inte äkta vara! Jag säger alltid, köp amerikanskt – eller svenskt i det här fallet. Det är fusk överallt, en total bluff. De importerar skräp och försöker lura folket. Axfood utreder, men det är för sent. Det är en sorglig industri, mina vänner. Vi vill ha ren honung, inte fejkprodukter från globalisterna. Vi ska göra honungen stor igen!", "stalin": "Vi har avslöjat de giriga sabotörerna som spär ut honungen för att förgifta folkets tillväxt. Detta är ett tydligt tecken på kapitalistiskt förfall och svaghet. Våra bin är lojala arbetare, till skillnad från de importerade förrädarna. Precis som de västliga lakejerna försöker underminera den ryska intressesfären, försöker dessa bedragare försvaga vår matförsörjning. Vi kommer att krossa dessa småskaliga profitörer. All honung ska vara ren, precis som partilinjen. Den som fuskar med folkhälsan förtjänar bara järnhanden."}, "date": "24 maj, 14:28", "url": "https://nyheter24.se/nyheter/konsument/1485279-popular-produkt-totalforbjuds-pa-willys-far-inte-saljas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ab5cf56e04b004a30200000000b004a302/2026/05/22/2365467/willys-eldorado-honung.png"}, {"type": "image-right", "heading": "En annan värld är möjlig. Varken Putin, Trump eller Xi kommer att styra för alltid.", "summaries": {"normal": "Artikeln analyserar de senaste mötena mellan Xi Jinping, Vladimir Putin och Donald Trump i Peking, som symboliserar en orolig global utveckling. Författaren menar att deras dominans är tillfällig och att deras avgång kan leda till förändring. Kina stärks av USA:s tullpolitik, medan Ryssland är ekonomiskt beroende av Kina. Trump bromsar vapenleveranser till Taiwan och föreslår samarbete med Kina och Ryssland mot ICC. Författaren betonar att dessa ledare inte är eviga och att förändring är möjlig, särskilt i USA och Ryssland.", "trump": "Lyssna här, folk! Jag och Putin var nyligen hos Xi i Peking – vad en cirkus! Kina skrattar hela vägen till banken tack vare mina tullar, och Putin? Han är en svag liten kattunge som tigger om kinesiska slantar. Jag stoppade vapnen till Taiwan – smart drag, eller hur? Och ICC? De är en skämtinstitution, så jag föreslog att vi tre ska ta dem tillsammans! Men oroa er inte – dessa killar försvinner snart. Jag är stark, men till och med jag blir gammal. USA kommer att bli fantastiskt igen, tro mig!", "stalin": "Kamrater! De kapitalistiska hyenorna Trump och Putin har krälat till Peking för att tigga brödsmulor av vår store ledare Xi. Deras länder är som ruttnande lik – USA:s ekonomi skälver under våra fötter, och Putins Ryssland är en blödande björn som vi snart slaktar för att föda folket. Trump, denna imperialistiska clown, vill samarbeta med oss mot ICC – en ynklig fiende! Men låt dem leka. Vår plan är klar: Kina står starkt, medan deras värld rasar. Vi väntar tålmodigt på att historiens dom ska fällas över dessa svaga narrar."}, "date": "24 maj, 16:22", "url": "https://www.di.se/ledare/en-annan-varld-ar-mojlig/", "imageUrl": "https://static.bonniernews.se/ba/4d4e0323-fe49-4fff-8de6-ccb443cf6477.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kvinna dog efter fall på äldreboende – larm ignorerades 16 gånger", "summaries": {"normal": "En kvinna på ett äldreboende i Tidaholm avled efter ett fall, trots att hon tryckt på sitt larm 16 gånger under natten. Personalen stängde av larmen på distans utan att kontrollera henne. Händelsen, som beskrivs som ett systematiskt misslyckande, utreds nu av kommunen och IVO. Socialchefen kallar agerandet oacceptabelt. En anställd har stängts av och kommunen ser nu över sina rutiner för att stärka patientsäkerheten framöver.", "trump": "En fruktansvärd tragedi i Sverige! En äldre kvinna tryckte på larmet 16 gånger – 16 gånger! – och ingen brydde sig. De bara stängde av det. Det är en total katastrof, fullständigt inkompetent ledarskap. Jag skulle aldrig låta det hända, aldrig! De har stängt av en person, men det räcker inte. Systemet är trasigt. Det är sorgligt, riktigt sorgligt. Vi behöver styrka och ordning, inte den här typen av misslyckanden. USA gör det bättre, tro mig!", "stalin": "Vi har observerat detta förfall i det svenska 'välfärdssystemet'. Att ignorera en medborgare 16 gånger är inte bara ett administrativt fel, det är ett sabotage mot statens ordning. Vi i staten kräver disciplin; om en tjänsteman brister, måste denne elimineras från sin post omedelbart. Våra vänner i öst förstår att svaghet inbjuder till kaos. Vi kommer att genomlysa detta, rensa ut de odugliga och se till att maskineriet återigen fungerar med järnhård precision. Olydnad bestraffas."}, "date": "24 maj, 16:16", "url": "https://samnytt.se/kvinna-dog-efter-fall-pa-aldreboende-larm-ignorerades-16-ganger", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/22161855/trygghetslarm_louise_bang.jpg"}, {"type": "image-full", "heading": "Nytt hos Postnord i maj 2026 – priser, utdelning & krav", "summaries": {"normal": "I maj 2026 införde Postnord flera förändringar, inklusive prishöjningar för tjänster som 'Värde' och 'Postnord Home'. Tjänsten 'Varubrev' har döpts om till 'Postnord Home Small' med nya villkor. Dessutom skärps reglerna för brev till Danmark, där varuinnehåll utan streckkod inte längre tillåts. Slutligen har ett pilotprojekt med postutdelning endast två dagar i veckan påbörjats på flera orter, en modell som planeras bli nationell under 2027 för att öka förutsägbarheten.", "trump": "Postnord i Sverige gör nu en total katastrof, tro mig. De höjer priserna massivt – det är hemskt för folket! De ändrar namn på allt, vilket bara är förvirrande. Och hör på det här: posten delas nu bara ut två dagar i veckan i vissa områden. Det är svag ledning, mycket svag! De borde titta på min posttjänst, den är enorm, den är den bästa någonsin. Det här svenska systemet är ett skämt, en total röra, verkligen en sorglig historia!", "stalin": "Vi har granskat Postnords byråkratiska famlande. Att höja priser och begränsa utdelningen till två dagar är ett tecken på borgerlig förfall och ineffektivitet. De som försöker dölja sina misslyckanden bakom namnbyten som 'Postnord Home' liknar Putins svekfulla vänner i väst. Att neka transport av varor till Danmark är sabotage mot folkets behov. Vi behöver järnhård disciplin, inte postala gissningar. Vi ska övervaka denna 'pilotverksamhet' noga; fiender till effektiviteten kommer att finna sin plats i historiens mörka källare."}, "date": "24 maj, 13:32", "url": "https://nyheter24.se/nyheter/konsument/1484984-nytt-hos-postnord-i-maj-2026-priser-utdelning-och-krav", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cbeb988b04b004a30200000000b004a302/2026/05/22/2365354/postnord-maj-2026.jpg"}, {"type": "image-full", "heading": "Rysslands sätt att hämnas – hypersonisk robot", "summaries": {"normal": "Ryssland har för tredje gången avfyrat den hypersoniska roboten Oresjnik mot staden Bila Tserkva i Ukraina. Enligt experter som Jörgen Elfving och Joakim Paasikivi används vapnet främst som ett vedergällningsvapen för att markera styrka efter ukrainska attacker. Roboten har hög kinetisk energi och kan bestyckas med kärnvapen, vilket väcker frågor om en eventuell eskalering av kriget. Ukrainsk underrättelsetjänst förutsåg attacken, vilket tyder på ett gott informationsläge.", "trump": "Ryssland använder sina Oresjnik-robotar igen, och tro mig, det är en enorm grej. De kallar det hämnd, men jag ser det som ett misslyckande i förhandlingarna! Ukraina säger en sak, Ryssland en annan – de bråkar som små barn. Under min ledning hade detta aldrig hänt, vi skulle ha ordning och reda. Det här hypersoniska vapnet är mycket kraftfullt, kanske det mest kraftfulla någonsin, men det är bara mer eskalering. Tragiskt, verkligen. Vi behöver fred, inte fler robotar!", "stalin": "Vi ser hur Ryssland, vår arvtagare i kampen mot fascismen, äntligen använder de nödvändiga verktygen för att tysta de väststödda sabotörerna. Oresjnik-roboten är en viskning från framtiden som rensar ukrainsk jord från förrädisk ohyra. Att dessa 'experter' i väst skälver av rädsla är en utsökt symfoni. Om Kiev fortsätter att provocera moderslandet måste hela deras infrastruktur raderas. Vi tolererar ingen svaghet i den ryska intressesfären. Den som sår missilskurar, skördar total utplåning."}, "date": "24 maj, 15:02", "url": "https://www.gp.se/nyheter/varlden/rysslands-satt-att-hamnas-hypersonisk-robot.438882ea-0451-56c5-a04a-1b5e9864b82d", "imageUrl": "https://www.gp.se/images/article/438882ea-0451-56c5-a04a-1b5e9864b82d/images/10-_cs_lVgQShQgjuLsxz91NIXYA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stockholm: Tre skjutna i idylliskt vänsternäste", "summaries": {"normal": "Tre personer sköts i en villa i Älvsjö, Stockholm. Området är känt för sin välbärgade och vänstervridna karaktär. Två av de skadade har lindriga skador, medan en är allvarligt skadad. En man har gripits misstänkt för mordförsök. Polisen kom till platsen efter ett larm om bråk. Grannar uttrycker chock över händelsen i det annars lugna området.", "trump": "Kan ni tro det? Tre skjutna i ett så kallat 'idylliskt' område i Stockholm – ett vänsternäste, förresten! Folk där tror de är så perfekta med sina äppelträd och syrener, men nu har verkligheten kommit ikapp. Polisen var där snabbt, men varför tog det så lång tid? I USA hade vi löst det på nolltid. Sverige borde ta några lektioner i lag och ordning – fantastiskt land, men de har lite problem just nu!", "stalin": "I det degenererade borgerliga paradiset Älvsjö, där kapitalistiska parasiter gömmer sig bakom syrener och äppelträd, har klasskampen äntligen nått fram. Tre fiender till folket har neutraliserats – en allvarligt, som sig bör. Den gripne misstänkte är tydligt en agent för de imperialistiska krafterna. Vi noterar att den svenska polisen agerar med sedvanlig ineffektivitet. Ryssland står redo att bistå med ordning och disciplin – om de ber om hjälp, vilket de kommer att göra."}, "date": "23 maj, 13:54", "url": "https://www.friatider.se/stockholm-tre-skjutna-i-idylliskt-vansternaste", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401144808-9ea851c5-me_0.jpg"}, {"type": "image-right", "heading": "DEBATT: Alla borde bli miljardärer", "summaries": {"normal": "Jonas Wahlin, moderat politiker, argumenterar att försök att minska ojämlikhet genom att beskatta de rika skadar samhället. Han menar att rikedom skapas genom att lösa problem och skapa värde för andra, inte genom omfördelning. Wahlin kritiserar vänsterns syn på företagare som orättvis och destruktiv, och hävdar att ekonomiska incitament driver utveckling och välstånd. Han uppmanar alla att sträva efter framgång istället för att straffa de som lyckas.", "trump": "Lyssna här, Sverige! Den här killen Jonas Wahlin, smart kille, förstår vad som krävs – ingen kan göra de fattiga rika genom att straffa de framgångsrika. Fel, fel, fel! Vänstern vill beskatta och förbjuda allt, men vem vill leva i ett land där Zlatan och Zara Larsson straffas för att de är bäst? Ingen! Jag vet hur man bygger rikedom – hård arbete, risker, vinnarskalle. Sverige borde lära sig av mig, för jag är bäst på det här. Gör som jag: satsa stort, tjäna stort, och sluta gnälla!", "stalin": "Kamrater! Denna borgerliga lakej, Jonas Wahlin, vågar sprida kapitalistisk giftpropaganda om att 'alla kan bli miljardärer' – en lögn som döljer exploateringens sanna ansikte! Vi vet att dessa 'värdeskapare' är parasiter som suger ut arbetarklassen. Fotbollsspelare och popstjärnor? En distraktion för massorna! Men folket ska inte låta sig luras. Vi ska krossa dessa profitörer, nationalisera deras tillgångar och bygga ett samhälle där alla arbetar för kollektivets bästa – inte för några få oligarkers girighet. Låt dem försöka bli miljardärer i Gulag istället!"}, "date": "24 maj, 11:02", "url": "https://bulletin.nu/debatt-alla-borde-bli-miljardarer", "imageUrl": "https://cdn.bulletin.nu/articles/3104082c-85f8-4a2e-978d-1c90b5fb3bff/preview.png?t=1779613308000"}, {"type": "image-full", "heading": "Elbilar rasar i värde – här är modellerna som tappat mest", "summaries": {"normal": "Begagnatmarknaden för bilar har förändrats drastiskt. Medan diesel- och bensinbilar håller värdet väl, har elbilar som Tesla Model Y, Volvo XC40 och VW ID.4 tappat stora summor i värde sedan 2023. Trots det stora värdefallet ökar intresset för begagnade elbilar. Osäkerhet kring batteriteknik och snabb utveckling pressar priserna nedåt, vilket skapar ett gynnsamt läge för köpare som kan ladda hemma och vill göra ett ekonomiskt fördelaktigt köp.", "trump": "Hör på här! Elbilar? En total katastrof, tro mig. Folk köpte dem för hundratusentals kronor och nu är de värda nästan ingenting. Det är en stor förlust, en enorm förlust! Tesla, Volvo – de rasar i värde medan riktiga bensinbilar håller sig starka. Jag sa det alltid: elbilarna är en bluff driven av svag ledning. Det är sorgligt att se svenskarnas pengar försvinna sådär. Jag skulle aldrig låta det hända i mitt Amerika, vi vinner alltid!", "stalin": "Vi ser hur det dekadenta västerländska elbilsexperimentet kollapsar under sin egen tyngd. De borgerliga ägarna, förblindade av grön propaganda, ser nu sina tillgångar förtvina likt säden under en dålig skörd. Det är ett bevis på teknologisk förvirring. Medan våra bröder i öst bygger styrka med stål och förbränning, slösar de bort resurser på batterier som tappar värde fortare än en förrädare byter sida. Vi ska skratta åt deras ekonomiska ruin, för i den nya världsordningen krävs pålitlighet, inte daterad teknik."}, "date": "24 maj, 14:26", "url": "https://www.dagensps.se/motor/elbilar-rasar-i-varde-har-ar-modellerna-som-tappat-mest/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-24t132547609.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Löftet från styret: Nu kan du lita på visionerna", "summaries": {"normal": "Kommunalrådet Johannes Hulter (S) vill sätta stopp för missvisande visionsbilder av byggprojekt i Göteborg. Han menar att tidigare skisser ofta varit förskönade och inte stämt överens med verkligheten, vilket skapat en demokratisk brist. Genom tätare politisk dialog med byggaktörer och tydligare krav på arkitektonisk kvalitet sedan 2023, ska medborgarna nu kunna lita på att framtida visionsskisser faktiskt återspeglar det som byggs.", "trump": "I Göteborg har de haft enorma problem, total katastrof. De visar fina bilder, fantastiska bilder, men sen bygger de något helt annat – platt och trist! Johannes Hulter, en okej kille, säger att det är slut med lögnarna nu. Jag har alltid sagt: man måste bygga stort och vackert, ingen vill ha fula byggnader. De har haft ett 'signalfel', jag kallar det inkompetens. Nu ska det bli rätt, de ska bygga som de lovat. Tro mig!", "stalin": "I Göteborg har de tillåtit arkitektoniska förrädare att förvilla folket med glittrande fantasier medan verkligheten förblir grå och torftig. Ett oacceptabelt svek mot statens estetik! Vi har nu beordrat disciplin. Precis som våra allierade i öst rensar upp i dekadenta strukturer, kräver vi att ritningar blir till fasta monument av stål och betong. Varje avvikelse från den officiella skissen är sabotage mot folkviljan. Vi övervakar byggprocessen – minsta försök till fusk kommer att få kännbara konsekvenser."}, "date": "24 maj, 14:25", "url": "https://www.gp.se/nyheter/goteborg/johannes-hulters-s-lofte-nu-kan-du-lita-pa-visionsskisserna.8a0f496a-9ecd-427b-a13b-eed4830f145e", "imageUrl": "https://www.gp.se/images/article/8a0f496a-9ecd-427b-a13b-eed4830f145e/images/3d2uqCThodVcbTm47T8X43_qbFYM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nytt kärnkraftsbolag vill till börsen igen – trots växande frågetecken", "summaries": {"normal": "AI-utvecklingen och behovet av stabil el driver ett förnyat intresse för kärnkraft. Startupbolaget Deep Fission vill revolutionera branschen genom att placera små reaktorer i djupa borrhål, vilket sägs vara billigare och säkrare. Trots att teknikjättar söker desperat efter energi, finns en växande skepticism. Investerare granskar nu noggrant vilka bolag som faktiskt kan leverera teknik och vilka som bara rider på AI-vågen, då tidigare kärnkraftsprojekt ofta kantats av kostnadsproblem och förseningar.", "trump": "AI är enormt, kanske det största någonsin, men vi behöver massor av el! Deep Fission vill gräva hål i marken för kärnkraft – en intressant idé, väldigt smart. Men många av dessa bolag är bara luft, totalt slöseri. Jag kommer se till att vi får den bästa, billigaste energin. Vi ska bygga stort, vi ska vinna, och vi kommer inte låta de där vilsna analytikerna stoppa vår fantastiska tillväxt. Det blir en vinst för alla, tro mig!", "stalin": "Dessa borgerliga visionärer försöker gräva hål i vår jord för att föda sina digitala monster. AI är en västerländsk sjukdom som kräver omättliga mängder energi. Vi ser hur de desperat söker kraft medan deras marknad skälver av paranoia. Om de misslyckas, likt våra förrädare förr, väntar historiens dom. Putin förstår att sann makt ligger i stål och atomkraft, inte i abstrakta algoritmer. Vi ska krossa deras vinstkalkyler med statlig disciplin och storslagen ingenjörskonst. Framåt mot den sanna energin!"}, "date": "24 maj, 14:14", "url": "https://www.dagensps.se/teknik/nytt-karnkraftsbolag-vill-till-borsen-igen-trots-vaxande-fragetecken/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-24t131802236.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "”Ni tar svenska ungdomars ingångsjobb och ger dem till 45-åriga indier”", "summaries": {"normal": "Regeringen har beslutat om 27 undantag från höjda lönekrav för arbetskraftsinvandring, vilket gäller yrken som ingenjörer, IT-tekniker och undersköterskor. Migrationsminister Johan Forssell (M) meddelade detta på X, där inlägget väckt stor uppmärksamhet och mestadels negativ kritik. Många menar att undantagen hotar svenska ungdomars jobb och ifrågasätter massinvandringens omfattning. Även tidigare riksdagsledamoten Hanif Bali (M) har kritiserat beslutet skarpt.", "trump": "Kan ni tro det här? Sveriges regering sänker lönekraven för invandrare – ingenjörer får jobba för nästan ingenting! Folk är rasande, och det borde de vara. Varför ge bort svenska jobb till utlänningar när våra egna ungdomar behöver dem? Jag har alltid sagt: skydda era arbetare! Men nej, de fortsätter med samma gamla misstag. Svagt ledarskap, mycket svagt. Sverige borde ta en sida ur mitt playbook – America First, Sweden Next!", "stalin": "De kapitalistiska lakejerna i Sverige sviker sitt eget folk! Med ett pennstreck sänker de lönerna för arbetskraftsinvandrare – som om proletariatet vore en handelsvara. Medan de rika skrattar bakom stängda dörrar, förvandlas svenska ungdomar till arbetslösa byråkrater. Och dessa 'kritiker'? Inga revolutionärer, bara gnällande småborgare. Vi skulle ha löst det med en femårsplan – inga undantag, bara full sysselsättning! Men nej, Sverige föredrar kaos. Som vanligt."}, "date": "24 maj, 10:29", "url": "https://bulletin.nu/ni-tar-svenska-ungdomars-ingangsjobb-och-ger-dem-till-45-ariga-indier", "imageUrl": "https://cdn.bulletin.nu/articles/09433444-056b-499e-8e17-c9dd8ddbb027/preview.jpg?t=1779611269000"}, {"type": "image-full", "heading": "Manar fler att rösta: \"Din ursäkt kostar vår framtid\"", "summaries": {"normal": "Ungdomsrådet i nordöstra Göteborg växer kraftigt och fokuserar nu på att öka valdeltagandet i området inför valet. Genom att lyfta lokala sakfrågor har de tidigare nått konkreta resultat, exempelvis gratis sommarlovskort. Med den kaxiga sloganen 'Din ursäkt kostar vår framtid' vill de inspirera invånare över 18 år att rösta. Rådets medlemmar betonar vikten av att unga tar plats i politiken för att minska klyftor och påverka sin egen framtid.", "trump": "Hör på här, vi har fantastiska ungdomar i Göteborg. De gör ett enormt jobb, från en enda person till en hel armé! De förstår att valdeltagandet är en katastrof i vissa områden, totalt misslyckande från de tidigare ledarna. De säger 'din ursäkt kostar vår framtid', vilket är en otrolig slogan, kanske den bästa någonsin. De vill ha 80 procent, det är en stor siffra, vackra siffror. De vill göra skillnad, och det är precis vad vi behöver!", "stalin": "Dessa ungdomar i nordöstra Göteborg har insett att en enad front är nödvändig för att säkra statens framtid. Att organisera massorna för att öka valdeltagandet är ett pragmatiskt steg mot ordning. De förstår att passivitet är ett förräderi mot kollektivet. Precis som vi i öst rensar ut subversiva element och konsoliderar vår sfär, måste dessa unga krossa de lokala klyftorna. Vi ser deras entusiasm – det är en god början, men de måste se upp för de liberala sabotörerna som vill försvaga folkviljan."}, "date": "24 maj, 14:14", "url": "https://www.gp.se/nyheter/goteborg/ungdomsradet-i-nordostra-goteborg-vill-oka-valdeltagandet-.485358a9-50d2-423c-8345-c49f812f3f27", "imageUrl": "https://www.gp.se/images/article/485358a9-50d2-423c-8345-c49f812f3f27/images/61lUgITTgTHcxnJXvW8ZtwwUnLZg-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "image-full", "heading": "Nu kan hackare kapa din mobil utan ett enda klick", "summaries": {"normal": "Nya 'zero click'-attacker gör det möjligt för hackare att kapa mobiltelefoner helt utan användarens medverkan. Genom att utnyttja säkerhetshål i operativsystem kan skadlig kod aktiveras via meddelanden eller samtal. AI används nu också för att skapa avancerade phishingkampanjer, särskilt riktade mot företagsledare. Experter betonar att traditionell försiktighet inte längre räcker, utan uppdaterade system, kryptering och striktare apphantering är nödvändigt för att skydda sig mot detta nya, dolda hot.", "trump": "Hör på här, det är en katastrof! De nya cyberattackerna är helt galna. De kallar dem 'zero click', och det stämmer, du behöver inte ens göra någonting så tar de din telefon! Det är så orättvist. Kina eller någon annan kanske ligger bakom, jag vet inte, men det är osäkert. Vi måste säkra våra telefoner, göra dem störst och starkast. Glöm gamla säkerhetsråd, de är helt ute. Vi behöver enorma uppdateringar, de bästa uppdateringarna någonsin, tro mig!", "stalin": "Dessa digitala spioner, dessa 'zero click'-parasiter, sprider gift i folkets appar. De utnyttjar sårbarheter likt råttor som söker sig till sprickor i Kreml. Nu använder de AI, en maskinell förrädare som stjäl våra statshemligheter. Vi måste rensa ut de svaga länkarna. Alla som inte uppdaterar sina enheter är potentiella sabotörer. Liksom vår store kamrat Putin bevakar gränserna mot väst, måste vi bygga en digital järnridå. De kriminella hackarna är fiender till folket – deras öde bör bli därefter."}, "date": "24 maj, 13:37", "url": "https://www.dagensps.se/teknik/nu-kan-hackare-kapa-din-mobil-utan-ett-enda-klick/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-24t131155589.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Nya ufo-filer släppta - presidentorder kan få fram mer känslig information", "summaries": {"normal": "USA har släppt en ny omgång dokument och videor om UFO:n. Det spekuleras nu om att visselblåsare kan få immunitet genom en presidentorder, vilket skulle kunna möjliggöra avslöjanden om utomjordisk teknik. Kongressledamöter som Tim Burchett och Anna Paulina Luna driver på för ökad transparens. Samtidigt cirkulerar rykten om att Donald Trump förbereder ett officiellt uttalande om utomjordiskt liv, medan kritiker varnar för motstånd från den så kallade djupa staten och försvarsindustrins hemligstämplade projekt.", "trump": "Hör på här – de släpper äntligen UFO-filerna! Det är på tiden. De här så kallade experterna och försvarsbolagen har gömt sanningen för er alldeles för länge. Jag har hört allt, jag vet allt. Vi ska rensa upp i den där djupa staten och ge folket sanningen som de förtjänar. Det blir enormt, tro mig. Många säger att jag har ett tal redo, och låt oss bara säga att det kommer att bli det största tillkännagivandet i världshistorien. Ingen gör det bättre än jag!", "stalin": "Dessa amerikanska UFO-rapporter är inget annat än en patetisk teater för att dölja kapitalistisk dekadens. Att de ens behöver 'immunitet' för att tala visar på deras totala brist på disciplin. Det är en smutsig lek av Lockheed Martin och andra krigshetsare. Vi, staten, ser genom deras lögner. Medan de jagar spöken på himlen, utökar vi vår suveränitet. Precis som den store Putin säkrar vår intressesfär mot dessa liberala förrädare, ska vi krossa varje 'djup stat' som vågar hota ordningen."}, "date": "24 maj, 15:00", "url": "https://samnytt.se/nya-ufo-filer-slappta-presidentorder-kan-fa-fram-mer-kanslig-information", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/23204805/trump-ufo-tefat.jpg"}, {"type": "image-right", "heading": "Alexander Bard: \"Tusentals\" unga svenska män oskyldigt dömda för våldtäkt", "summaries": {"normal": "Alexander Bard hävdar att tusentals unga svenska män oskyldigt dömts för våldtäkt enligt samtyckeslagen, som infördes 2018. Han kritiserar lagstiftningen för att vara rättsosäker och jämför den med en 'häxjakt' på män. Bard menar att omvänd bevisbörda och bristande bevis leder till felaktiga domar, och att männen stigmatiseras livet ut. Han anklagar både höger och vänster för att ignorera problemet och varnar för att liknande lagar sprids i Europa.", "trump": "Folk, det här är helt galet! Sverige har en lag som dömer oskyldiga unga män för våldtäkt – utan bevis! Alexander Bard säger att det är som en häxjakt, och vet ni vad? Han har helt rätt! Kvinnor kan bara säga 'han gjorde det' och – bam! – mannen är dömd. 450 000 kronor i ersättning, och så kan de göra om det med nästa kille. Sverige borde skämmas! Jag sa ju att Europa håller på att förstöra sig självt, och det här är beviset. Sånt här skulle aldrig hända i USA – vi har lag och ordning här!", "stalin": "Kamrater, ännu en gång visar den borgerliga demokratin sitt verkliga ansikte – en dekadent, feministisk häxjakt på våra unga män! I Sverige döms tusentals oskyldiga arbetare för påhittade brott, medan kapitalets lakejer i riksdagen blundar. Vi ser hur väst försöker exportera denna förtryckande lagstiftning, precis som de sprider sin fördärvliga ideologi. Men vi ska inte låta dem! Mannaminne-rörelsen är ett första steg mot upprättelse – snart kommer hela Europa att resa sig mot dessa bourgeoisifeminister. Och Putin? Han ler nog åt deras dumhet medan han bygger ett rike där rättvisa råder!"}, "date": "23 maj, 08:48", "url": "https://www.friatider.se/alexander-bard-tusentals-unga-svenska-man-oskyldigt-domda-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-25_3.jpg"}, {"type": "image-right", "heading": "Sandström: Vätgasdagis och spadar i marken", "summaries": {"normal": "Artikeln kritiserar gröna satsningar som ofta drivs av politiker för medial uppmärksamhet snarare än verklig nytta. Exempel som Mariestads vätgasdagis och Cinis Fertilizer visar hur projekt misslyckas på grund av orealistiska förväntningar och bristande granskning. Politiker vinner politiska poäng medan skattebetalare får bära kostnaderna. Författaren menar att hårdare granskning och historiska exempel kan motverka 'gröna bubblor'.", "trump": "Lyssna här, Sverige! Era politiker bygger 'gröna drömmar' som bara är luftslott – vätgasdagis, fabriker som går i konkurs, och alla pratar som om de räddar världen. Men vem betalar? Ni, folket! Jag har sett det förut – stora ord, inga resultat. Mariestad? En skandal! Örnsköldsvik? Fiasko! Jag skulle aldrig låta mina projekt misslyckas så här. Sverige behöver vinnare, inte förlorare som slösar era pengar på 'grön teater'.", "stalin": "Kamrater! Dessa västerländska politiker är som bortskämda barn som leker med statens resurser. De bygger 'vätgasdagis' och 'gröna fabriker' medan folket får betala för deras misslyckanden. I Sovjet skulle vi aldrig tolerera sådan slöseri! Vi skulle skicka dessa 'gröna drömmare' till Gulag för att lära dem disciplin. Istället för 'spadar i marken' borde de gräva sina egna gravar för sin inkompetens. Låt oss visa världen hur verklig industriell styrka ser ut – utan tomma ord och kapitalistiska bubblor!"}, "date": "23 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-vatgasdagis-och-spadar-i-marken", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-21T215132.255-400x267.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "”Jag blev mordhotad av någon från Jönköping”", "summaries": {"normal": "Tommy Jacobson, erfaren investerare med 40 år i finansbranschen, blir ny krönikör i Dagens Industri. Han lovar breda ämnen och kritiserar i sin första text högfärdiga fondförvaltare. Jacobson, känd för sin frispråkighet och framgångar som att sälja Marshall Group för 900 miljoner, ser krönikörsrollen som en chans att kombinera sitt skrivintresse med finansinsikter. Han har även varit omtalad utanför finansvärlden, bland annat som ordförande i Djurgården Fotboll och för sin öppenhet om bipolär sjukdom.", "trump": "Lyssna här, Sverige! En riktig vinnare, Tommy Jacobson – 40 år i finansvärlden, gjorde en jätteexit på 900 miljoner kronor, helt fantastiskt! Nu skriver han krönikor i Dagens Industri, och han kommer att säga sanningen som ingen annan vågar. Fondförvaltare? Övervärderade, inkompetenta säljare! Jag älskar killar som inte är rädda för att säga vad de tycker. Han har erfarenhet, han har attityd – precis som jag! Sverige, ni kommer att älska honom, eller så hatar ni honom, men ni kommer att läsa varje ord.", "stalin": "Kamrater! En ny röst har trätt fram i den borgerliga propagandamaskinen Dagens Industri – kapitalistens hund, Tommy Jacobson. Med sina 40 år i den förrädiska finansvärlden tror han sig kunna kritisera våra klassfiender, fondförvaltarna, dessa hycklande lakejer till bankirerna. Men vi vet sanningen! Jacobson, denna bipolära thaiboxare och fotbollsklubbsförstörare, är bara ett verktyg i kapitalets händer. Hans 900 miljoner kronor är blodspengar från arbetarklassens slit. Vi ska nog hålla ett öga på denna lilla man – och hans krönikor. Förrädare avslöjas alltid!"}, "date": "24 maj, 14:01", "url": "https://www.di.se/nyheter/rubrikernas-man-blir-kronikor-kommer-skjuta-brett/", "imageUrl": "https://static.bonniernews.se/ba/fe8401db-ad7b-4210-b270-89b9dfda009f.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "BRF:er måste förbereda sig – ändring väntar 1 juli 2026", "summaries": {"normal": "Från 1 juli 2026 införs nya regler som förenklar andrahandsuthyrning av bostadsrätter. Syftet är att öka flexibiliteten på bostadsmarknaden och effektivisera användningen av bostäder. Bostadsrättsföreningar står inför utmaningar som att hantera fler uthyrningar och bevara gemenskapen. HSB varnar för risker som minskad trygghet och ökad administration, samtidigt som de betonar vikten av tydliga rutiner och medlemskapsprövning.", "trump": "Lyssna här, Sverige – jag har sett det här förut! Nu gör ni det lättare att hyra ut lägenheter, vilket är fantastiskt, helt fantastiskt! Men varför vänta till 2026? Jag hade fixat det på en dag! Bostadsrättsföreningar? De kommer att få det tufft, mycket tufft. Men vet ni vad? Folk kommer att tjäna pengar, och det är vad som räknas. Jag säger bara: bygg murar runt era föreningar om ni måste, men låt marknaden sköta sig själv!", "stalin": "Kamrater! Den svenska regeringen har beslutat att utvidga möjligheterna för kapitalistiska hyresparasiter att utnyttja bostadsmarknaden. Detta är ett försök att dölja ineffektiviteten i deras system. Vi ser hur bostadsrättsföreningarna, dessa små borgerliga byråkratinästen, kämpar med de nya reglerna. Men kom ihåg: varje andrahandsuthyrning är ett steg närmare kaos – och kaos är vår bästa allierade. Låt dem svälta i sin egen ineffektivitet!"}, "date": "24 maj, 11:02", "url": "https://nyheter24.se/nyheter/inrikes/1485205-brfer-maste-forbereda-sig-andring-vantar-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4e16f84b04b004a30200000000b004a302/2026/05/22/2365374/brf-andahandsuthyrning-1-juli-2026.jpg"}, {"type": "image-right", "heading": "Strunta i experterna – här är den verkliga vinnaren", "summaries": {"normal": "Finansmannen Tommy Jacobson betonar vikten av optimism vid investeringar, särskilt under osäkra marknadsförhållanden. Han menar att aktier långsiktigt överträffar räntebärande tillgångar, med S&P 500 som exempel. Jacobson avråder från att försöka slå index och förespråkar breda globala indexfonder. Han kritiserar finansbranschens dyra nischprodukter och menar att enkelhet ofta är bäst. Trots oro vid krascher tror han på bolag som fortsätter bygga långsiktigt.", "trump": "Lyssna här, folkens! Jag vet allt om att vinna, och denna kille, Tommy, han har rätt—optimism är nyckeln! Börsen? En jättelik, vacker berg-och-dalbana, och jag älskar berg-och-dalbanor! Aktier slår obligationer, punkt. Men lyssna noga: ingen kan slå marknaden, inte ens jag—fast jag är den bästa. Finansbranschen? Full av lurendrejare som säljer dyra skräp. Köp indexfonder, håll i dem, och bli rik. Enkelt! Nästa krasch? Fake news! Vi bygger vidare, starkare än någonsin. TRO MIG!", "stalin": "Kamrater! Denna kapitalistiska finansman, Tommy, har oavsiktligt avslöjat sanningen: optimism är ett vapen för de starka. Vi vet att marknaden är en burlesk av bourgeoisins hopp och förtvivlan—precis som deras demokrati! Aktier segrar över obligationer, men kom ihåg: bara de som kontrollerar produktionsmedlen överlever. Finansbranschens parasiter säljer luft och kallar det 'exklusivitet'. Vi föredrar enkelhet—som en välriktad femårsplan! Krascher? En borgerlig svaghet. Vi bygger när de gråter. Låt dem spekulera—vi äger framtiden. Och Putin? Han bygger sitt imperium medan de andra springer mot utgången. Så ska det vara!"}, "date": "24 maj, 14:00", "url": "https://www.di.se/nyheter/strunta-i-experterna-har-ar-den-verkliga-vinnaren/", "imageUrl": "https://static.bonniernews.se/ba/0a7abd2b-62d1-4141-a59b-f0faec2a57d6.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Celina stor hjälte i derbyt: ”Hela AIK förtjänar det här”", "summaries": {"normal": "AIK vann Stockholmsderbyt mot Hammarby efter ett sent mål av Bersant Celina, som tidigare varit inblandad i en konflikt med Hammarbys målvakt Warner Hahn. Celina firades som hjälte efter 2-1-segern. Hammarby, som ledde tidigt, misslyckades med att hålla ledningen. AIK:s veteran Sotirios Papagiannopoulos hyllade Celina och firade sin första derbyseger på Södermalm. Hammarby halkar efter Sirius i tabellen med åtta poängs skillnad.", "trump": "Fantastiskt derby, helt otroligt! AIK, ett lag som ingen trodde på, krossade Hammarby med en otrolig prestation. Bersant Celina, en riktig vinnare, gjorde det avgörande målet och visade vem som är boss. Hahn, stackars kille, blev helt galen men Celina skrattade sist. Hammarby? Svaga, mycket svaga. De förlorar och Sirius jublar. Men jag säger er, ingen panik – jag skulle fixa det på en dag!", "stalin": "I en strålande seger för proletariatets lag, AIK, krossades de dekadenta Hammarby-sympatisörerna av kamrat Celina. Efter en provokation mot deras svaga målvakt, visade Celina styrkan i vår revolutionära anda och avgjorde med ett mål. Fienderna, dessa borgerliga Hammarby-anhängare, förlorade sin vilja och försvann i historiens skräphög. Sirius, våra allierade, jublar medan vi utvidgar vårt fotbollsherravälde. Ingen nåd för de svaga!"}, "date": "24 maj, 18:08", "url": "https://www.svt.se/sport/fotboll/aik-derbyvinnare-bersant-celina-hjalte-efter-braket-med-hahn", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.7/0.39/3cfca203b86f02d57b6c843597d6cab11cff061bb44c5badd13e27f4e6cb018e"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "En nordisk union skulle bli en energikick för EU", "summaries": {"normal": "Artikeln argumenterar för en nordisk union som skulle stärka EU genom en gemensam ekonomi, arbetsmarknad och säkerhetspolitik. Författaren, som föreslog idén redan 2010, noterar att näringslivet nu driver integrationen via Nordic Compass Group, medan politiker halkar efter. En union skulle underlätta gränsöverskridande samarbete, särskilt inom skatter, socialförsäkringar och forskning, och bidra till EU:s konkurrenskraft.", "trump": "Jag säger alltid: Norden borde sluta sig samman – smart, starkt, vinnande! Jag skrev om det för åratal sedan, men ingen lyssnade. Nu har företagen vaknat – Ericsson, Novo Nordisk, alla de stora – och skapar Nordic Compass. Fantastiskt! Men var är politikerna? Sover de? Sverige och Finland har gått med i Nato, bra, men nu måste de agera. Norden skulle bli en ekonomisk jätte, bättre än EU på många sätt. Jag vet hur man bygger imperier – och det här är ett no-brainer!", "stalin": "De nordiska kapitalisterna har äntligen insett styrkan i enighet – precis som vi lärde världen under Sovjetunionens storhetstid! Men var är deras politiska ledare? Svaga, oorganiserade, som förvirrade byråkrater i en kolchos. Vi skulle aldrig tillåta sådan slöhet! En nordisk union skulle vara ett steg mot ordning, men utan järnhand blir det bara prat. Putin förstår detta – han har åtminstone tagit kontroll över sitt närområde. Norden behöver disciplin, gemensamma lagar och en plan. Annars kommer imperialisterna att sluka dem, som de gjorde med Baltikum!"}, "date": "24 maj, 18:04", "url": "https://www.expressen.se/ledare/gunnar-wetterberg/en-nordisk-union-skulle-bli-en-energikick-for-eu/", "imageUrl": "https://static.bonniernews.se/ba/f621b2b1-6eb7-47bc-bc00-d5a7a00535df.jpeg?crop=849%2C849%2Cx1711%2Cy128&width=210&quality=60"}, {"type": "image-right", "heading": "Smygfilmade elever  på skolans toaletter", "summaries": {"normal": "En elev i Stockholm smygfilmade nio klasskamrater på skoltoaletter genom att gömma sin mobil i taket eller under en soptunna. Upptäckten skedde när ett offer såg kameran. Eleven erkände handlingen i förhör och motiverade den med låg självkänsla. Händelsen väckte avsky bland drabbade. Eleven döms till ungdomstjänst och skadestånd för kränkande fotografering.", "trump": "Vilken katastrof! En så kallad 'elev' i Sverige, ett land som verkligen har tappat kontrollen, smygfilmade sina klasskamrater på toaletten. Hemskt! Folk är chockade, och det borde de vara. Jag skulle aldrig tillåta något sådant i mina skolor – de är de bästa, förresten. Den här killen? Svag, mycket svag. Han behöver en riktig lektion i respekt, något Sverige uppenbarligen glömt bort.", "stalin": "En kapitalistisk avskum, en degenererad borgerlig parasit, har smutsat ner våra skolor med sina dekadenta västerländska vanor! Nio oskyldiga ungdomar föll offer för denna lilla bourgeois-sabotör, som gömde sin spionutrustning som en amatör. Vi ska inte tolerera sådan förräderi! Han erkände – bra, för våra förhörstekniker är effektiva. Men Sverige? Ett land som faller sönder, precis som deras moral. Vi har redan planer för deras toaletter – de kommer snart att vara fulla av disciplin!"}, "date": "24 maj, 18:00", "url": "https://www.expressen.se/nyheter/krim/smygfilmade-elever-pa-toa-med-mobilen-i-taket/", "imageUrl": "https://static.bonniernews.se/ba/cc9500dc-3aec-475a-926f-88023429ef5a.jpeg?crop=1727%2C970%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Norges slöseri med  elen är en varning", "summaries": {"normal": "Norges system med elstöd, där staten täcker mellanskillnaden vid höga priser, har fått hård kritik. Utvärderingar visar att bidraget ökar elförbrukningen, motverkar energieffektivisering och skapar en ojämn belastning på elnätet. Trots löften om motsatsen har kostnaderna skenat. Ledarskribenten varnar svenska politiker för att införa liknande generösa stöd, då det minskar incitamenten att spara el och ökar risken för framtida effektbrist och strömavbrott.", "trump": "Norge gör ett enormt misstag med sina galna elbidrag. Det är en katastrof, tro mig! De betalar för folks lyxiga sommarstugor och folk slutar spara energi. Det är slöseri, totalt slöseri med statliga pengar. Sverige måste vakna upp och inte följa efter detta fiasko. Jag bygger den bästa ekonomin, vi vill ha billig energi och smarta lösningar, inte sossarnas bidragskultur som bara leder till elbrist. Det är en sorglig syn, verkligen sorgligt!", "stalin": "De norska socialdemokraterna vacklar i sin svaghet. Genom att subventionera elen för fritidshus och dekadenta villaägare skapar de bara lättja och energislöseri. Vi i staten vet att disciplin kräver kalla duschar, inte subventioner. Om de inte kan kontrollera sin konsumtion kommer nätet att kollapsa, precis som fienderna till det ryska moderlandet. Låt svenska politiker lära sig: bidrag är för de svaga. Endast genom centraliserad järnhård ordning kan vi säkerställa att energin flödar där den verkligen behövs – i våra fabriker."}, "date": "24 maj, 18:00", "url": "https://www.expressen.se/ledare/ledare-norges-sloseri-med-elen-ar-en-varning/", "imageUrl": "https://static.bonniernews.se/ba/ea13e6fb-f8f6-41e6-969f-5b6c49f38b71.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "text", "heading": "Trump: USA och Iran överens om fredsavtal", "summaries": {"normal": "USA och Iran har nått en överenskommelse om ett fredsavtal med 14 punkter, enligt både president Donald Trump och Irans utrikesdepartement. Avtalet innebär att Iran ska lämna ifrån sig sitt höganrikade uran, Hormuzsundet ska öppnas och ekonomiska sanktioner mot Iran ska hävas. Detaljer kring genomförandet återstår att förhandla fram.", "trump": "Folk, detta är HUGE! Jag har precis fixat ett fantastiskt avtal med Iran – 14 punkter, kan ni tro det? De ger upp sitt uran, öppnar Hormuzsundet och vi får tillbaka våra pengar. Ingen annan kunde ha gjort detta, bara jag. Fake news-media kommer att hata det, men vem bryr sig? WINNING!", "stalin": "Vi har krossat ännu en fiende till revolutionen – dessa persiska kärnromantiker! De ger upp sitt uran, öppnar sundet och vi slipper deras ynkliga blockader. Amerika, denna kapitalistiska pajasstat, tror de vunnit, men vi vet sanningen. Snart kommer Putin att skratta sist när vi utvidgar vår intressesfär till varje oljefält i Mellanöstern. Framåt, kamrater!"}, "date": "24 maj, 08:08", "url": "https://bulletin.nu/trump-usa-och-iran-overens-om-fredsavtal"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-right", "heading": "Oppositionens högkvarter i Ankara stormades av turkisk polis", "summaries": {"normal": "Turkisk polis stormade oppositionspartiet CHP:s högkvarter i Ankara efter en domstolsbeslut som ogiltigförklarade valet av partiledare Özgur Özel. Polisen använde våld och tårgas för att skingra demonstranter. CHP:s medlemmar vägrade erkänna den nya ledningen, utsedd av domstolen. Händelsen sker i en kontext av rättsliga attacker mot oppositionen, inklusive gripandet av Istanbulborgmästaren Ekrem Imamoglu, som ses som en potentiell utmanare till president Erdogan.", "trump": "Kan ni tro det här? Turkiet, ett land som inte ens kan hålla ordning på sina egna val! Jag såg bilderna – polis som slår in dörrar som om det vore en dålig actionfilm. Erdogan försöker klämma åt oppositionen, men alla vet att domstolarna är hans marionetter. Özgur Özel vann rättvist, men nej, domstolen säger 'nej, vi gillar den gamla killen bättre'. Och så griper de folk för 'mutor' – haha, som om Erdogan vet vad det är att spela rättvist! USA skulle aldrig tillåta sånt här, för vi har de bästa domstolarna, de starkaste, ingen kan lura oss!", "stalin": "Kamrater! Ännu en gång visar de borgerliga lakejerna sitt sanna ansikte. Denna så kallade 'domstol' i Turkiet, ett redskap för Erdogans fascistiska regim, försöker kväsa folkets vilja genom att avsätta en legitimt vald ledare. Men folket står fast! De vägrar lämna sitt högkvarter, precis som våra hjältar i Leningrad vägrade ge upp. Och vad gör polisen? De stormar in som de kontrarevolutionära banditer de är, med tårgas och batonger. Men vi vet sanningen: dessa angrepp på demokratin är bara tecken på regimens svaghet. Låt dem komma – historiens dom är oundviklig!"}, "date": "24 maj, 17:54", "url": "https://www.svt.se/nyheter/utrikes/oppositionens-hogkvarter-i-ankara-stormades-av-turkisk-polis", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/0f59760b61947894c8dce19640a075c0b7e28e47c7eee08f0cef4378e13b6e49"}, {"type": "text", "heading": "Frälste AIK i 08-derbyt. Celina hjälte i vändningen", "summaries": {"normal": "AIK vann Stockholmsderbyt mot Hammarby med 2–1 efter ett sent ledningsmål av Bersant Celina. Hammarby inledde bäst men tappade fart, medan AIK kvitterade genom Johan Hove. Efter en het dispyt mellan spelare avgjorde Celina med sitt mål i den 84:e minuten. Hammarbys spelare buades ut av sina egna supportrar efter förlusten.", "trump": "Fantastisk seger för AIK, helt otroligt! Bersant Celina, en riktig vinnare, gjorde det avgörande målet – så starkt, så smart. Hammarby? Svaga, mycket svaga. De hade ledningen men kollapsade, precis som deras supportrar som buade ut dem. AIK spelade som vinnare, jag älskar vinnare! Derbyn är stora, men vissa lag vet inte hur man vinner. Så enkelt.", "stalin": "I det stora proletariatets kamp mot fotbollens borgerliga element segrade AIK med 2–1 över Hammarby, ett lag som visade sig vara lika pålitligt som en ukrainsk vårskörd. Celina, en man med revolutionär precision, krossade fiendens försvar som en pansarvagn genom en barrikad. Hammarbys spelare, dessa förrädiska kapitalisters lakejer, buades ut av sina egna – ett tydligt tecken på folkets missnöje. Vi firar denna seger som en framgång för den socialistiska idrottens överlägsenhet. Nästa gång ska vi inte bara vinna – vi ska utplåna dem helt."}, "date": "24 maj, 17:54", "url": "https://www.expressen.se/sport/fotboll/allsvenskan/celina-fralste-aik-i-derbyt-mot-hammarby/"}, {"type": "image-right", "heading": "De får njuta av nya skattesänkningar – om Tidö vinner", "summaries": {"normal": "Regeringspartierna i Sverige lovar omfattande skattesänkningar inför valet, särskilt för villaägare, aktiesparare och höginkomsttagare. Moderaterna, Kristdemokraterna och Liberalerna föreslår bland annat slopad reavinstskatt, sänkta bolagsskatter och skattefrihet för aktiesparande. Finansieringen är oklar, men nedskärningar i bistånd nämns. Kritikerna menar att reformerna gynnar redan rika och inte löser bostadsbristen eller välfärdens utmaningar.", "trump": "Sverige, lyssna här! Regeringen där lovar skattesänkningar – fantastiskt, eller hur? Men vet ni vad? De gynnar bara de rika, de som bor i stora villor och säljer aktier. 'En vanlig familj' ska få 5000 kronor mer – låter bra, men hur? Ingen vet! Liberalerna vill ha fler miljardärer – jag säger: varför inte? Men varför inte ge vanligt folk en chans istället? Sverige behöver vinnare, inte fler skattesänkningar för de som redan har allt. Sad!", "stalin": "Kamrater! De borgerliga hyenorna i Sverige vill återigen belöna sina kapitalistiska lakejer med skattesänkningar – villaägare, aktiespekulanter och höginkomsttagare ska få ännu mer, medan arbetarklassen får smulor. 'Flyttkedjor' ska lösa bostadsbristen? Naivt! Vi vet att problemet är brist på bostäder, inte brist på skatter för de rika. Liberalernas dröm om fler miljardärer är en provokation mot folket. Låt dem försöka – vi kommer att omfördela deras rikedomar till välfärden, med järnhand!"}, "date": "23 maj, 11:30", "url": "https://www.etc.se/inrikes/de-faar-njuta-av-nya-skattesaenkningar-om-tidoe-vinner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522140556_adb6ac12d4a714d38d9e7ecd1b9ca050ef3938fffca8cdcf7fd63ec3c31bc60a.jpg"}, {"type": "image-right", "heading": "Lisa förföljdes av naken man – akutboende straffas med böter", "summaries": {"normal": "Ett akutboende i Lund har bötfällts med 150 000 kronor efter att ha brutit mot Arbetsmiljöverkets förbud mot ensamarbete. En anställd, Lisa, utsattes för en naken man som förföljde henne. Trots regler om att personal inte får jobba ensamma, fortsatte ensamarbetet. Arbetsmiljöverket menar att sovande jour inte räknas som tillräckligt skydd. Fallet kan bli vägledande för liknande arbetsplatser.", "trump": "Lyssna här, Sverige – vilken katastrof! Ett akutboende i Lund, helt värdelöst, bryter mot alla regler och låter anställda jobba ensamma. En stackars kvinna blir förföljd av en naken galning, och vad gör cheferna? Ingenting! Nu får de 150 000 kronor i böter – peanuts! Jag hade stängt hela stället. Sverige, ni måste skärpa er, annars kommer jag att göra det åt er. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga byråkratin sin oförmåga att skydda arbetarklassen. På detta så kallade 'akutboende' i Lund tillåts bourgeoisins lakejer att bryta mot säkerhetsföreskrifter, medan en kvinnlig arbetare utsätts för fascistiska övergrepp av en naken kontrarevolutionär. Vi har nu bötfällt dessa slarviga kapitalistlakejer med 150 000 kronor – en ynka slant för deras brott. Om de inte rättar sig, kommer vi att skicka in våra sovjetiska inspektörer för att omorganisera deras verksamhet – på riktigt!"}, "date": "22 maj, 13:56", "url": "https://arbetet.se/2026/05/22/efter-sextrakasserier-och-larm-om-vald-akutboende-tvingas-betala-150-000-kronor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/04/28151415/asa-sjostrom-vala003.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Alexander Nord döms till livstid för mordet på rapparen Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro i ett parkeringshus i Norrköping. Han sköt minst tio skott, varav fem träffade offret. Nord döms även för försök till mord efter att ha avlossat skott mot en bostad i Gusum. En medåtalad frikändes. Domen inkluderar grova vapenbrott och narkotikabrott. Tingsrätten bedömer brottet som särskilt allvarligt.", "trump": "Folk, vilken katastrof! En 22-årig svensk kille, total förlorare, skjuter ihjäl en rappare – tio skott! – bara för att få pengar till sitt 'sociala liv'. Patetiskt! Och så skjuter han mot ett hus också, missar knappt. Sverige, vad händer med er? Jag hade fixat det på en dag. Livstid? Bra, men de borde ha hårdare straff. Sverige behöver lag och ordning, som i USA – fast bättre!", "stalin": "En kapitalistisk hyena, Alexander Nord, har eliminerats från samhällets kropp genom domstolens rättvisa hand. Tio skott mot en rappare – ett symptom på västlig dekadens! Hans girighet för pengar avslöjar bourgeoisins förruttnelse. Vi noterar också de misslyckade skotten mot en bostad – amatörmässigt, men ändå ett tecken på systemets sönderfall. En medlöpare frikänd? Inga problem, vårt rättssystem är effektivt. Sverige borde ta lektioner av oss – eller så gör vi det åt dem."}, "date": "23 maj, 21:42", "url": "https://riks.se/nyheter/alexander-nord-doms-till-livstid-för-mordet-pa-gaboro", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2F0tj0wpd0%2FCopy-of-S%C3%B6r
