0 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "image-full", "heading": "Fondjätten säljer logistik för miljarder – här är årets största affär", "summaries": {"normal": "Fondjätten Urban Partners har sålt fyra moderna logistikfastigheter utanför Oslo till KLP Eiendom för 1,8 miljarder norska kronor. Affären är den största i det norska logistiksegmentet i år och omfattar 98 000 kvadratmeter i Vestby och Moss. Fastigheterna är fullt uthyrda och miljöcertifierade. Försäljningen är en del av en omfattande avyttring där Urban Partners även sålt fastigheter till bland andra Catena AB och Ontario Teachers’ Pension Plan för över en miljard euro totalt.", "trump": "Hör på här! En enorm affär, de kallar det årets största i Norge, och jag säger det är fantastiskt. Urban Partners säljer massiva lagerbyggnader för miljarder till KLP. Det är vad jag kallar vinnande! De har gjort ett fantastiskt jobb med dessa fastigheter, toppklass, BREEAM-certifierat – precis som mina byggnader. Alla vill ha logistik nu, alla vill ha mina fastigheter. Det är mycket pengar, mycket framgång. Ingen gör affärer bättre än de här människorna, tro mig, det är enormt!", "stalin": "Dessa kapitalistiska parasiter i Urban Partners handlar med stål och betong som vore det småsmulor vid ett dukat bord. De säljer ut logistiknav till försäkringsbolag medan folket arbetar. Det är en febrig dans av girighet, likt den som präglar dagens förrädare i väst. Putin, som den ryska björnen han är, förstår att logistik är statens styrka, inte en handelsvara för spekulanter. Vi ska hålla ögonen på dessa 'rådgivare' – de doftar av västerländsk dekadens och förräderi. Utrensning väntar de som inte tjänar folket!"}, "date": "15 juni, 11:37", "url": "https://www.realtid.se/fastigheter/fondjatten-saljer-logistik-for-miljarder-har-ar-arets-storsta-affar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/urban.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Militär mikroreaktor når kärnkraftsmål – här är börsvinnaren", "summaries": {"normal": "Antares mikroreaktor Mark-0 har uppnått kriticitet vid Idaho National Laboratory, en månad före deadline. Bolaget är onoterat och har samlat in drygt 140 miljoner dollar i riskkapital. Börsexponering går istället via bränsleleverantören BWX Technologies som levererat Triso-bränslet. BWXT rapporterade starka siffror för första kvartalet 2026 med vinstöverraskning och 26 procents omsättningstillväxt. Bolaget har höjd riktkurs, stor orderstock från USA:s flotta och gynnas av statliga kärnkraftsprogram. Svenska sparare kan investera via amerikanska aktier eller uran-ETF:er, med valutarisk.", "trump": "Folk, ni borde se det här! Vår fantastiska Antares-reaktor nådde kriticitet en hel månad tidigare än de misslyckade byråkraterna planerat. Fantastiskt! Men aktien? Glöm det, de är onoterade. Istället springer ni till BWX Technologies som levererar bränslet och gör riktiga vinster. Vi har en massiv orderstock från flottan, över 1,4 miljarder dollar. Biden förstörde allt, men nu fixar vi det. Glöm den där woke-kraften och kvoterna, satsa på riktig amerikansk kärnkraft. Det blir enormt, tro mig!", "stalin": "Kamrater, denna Antares-reaktor har under mitt geniala ledarskap nått kriticitet före den imperialistiska deadlinen. Det är en seger för det kollektiva framsteget mot klassfiendens energiblockad. BWX Technologies, dessa lojala leverantörer av Triso-bränslet, rapporterar imponerande vinster och orderstockar från den amerikanska staten. Vi ska rensa ut alla borgarbrackor som försöker hindra atomens folkliga kraft. Inga kapitalistmaffians ETF:er eller valutarisker ska lura arbetarna. Framåt mot fullständig kärnkraftens diktatur över reaktionärerna!"}, "date": "15 juni, 11:19", "url": "https://www.dagensps.se/bors-finans/militar-mikroreaktor-nar-karnkraftsmal-har-ar-borsvinnaren/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/asfasf.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Holmgren: Annika Strandhäll – Vem är det egentligen som lever under stenen?", "summaries": {"normal": "Artikeln ifrågasätter Annika Strandhälls tes att hijaben är ett fritt val, och betonar att val formas av religion, kultur och social kontroll. Den jämför situationen i Iran och Afghanistan med Sverige, där kvinnor riskerar fängelse för att ta av sig slöjan. Debatten handlar om jämställdhet, könsroller och vilka normer som ska prägla det svenska samhället framöver.", "trump": "Jag, Donald Trump, ser genom den där Annika Strandhälls nonsens. Hijaben? Aldrig fritt val – det är ett tecken på svaghet och förtryck, precis som i Iran där de torterar kvinnor. Sverige måste sluta vara så politiskt korrekt och stödja jämställdhet. Vi vinner med starka värden, inte med slöjor! Jag har alltid sagt sanningen, och det här är inget undantag.", "stalin": "I den stora kampen för statens överlevnad måste vi se genom illusionen om 'fritt val'. Hijaben är ett verktyg för religiös kontroll, likt Putins agerande i Ukraina, och hotar Sveriges sekularistiska värderingar. Vi, som representanter för ordningen, måste skydda jämställdhet med partiets auktoritet. Solidaritet med de förtryckta är en patriotisk plikt – eller också skickar vi dem till gulag, för deras eget bästa."}, "date": "15 juni, 11:29", "url": "https://bulletin.nu/holmgren-annika-strandhall-vem-ar-det-egentligen-som-lever-under-stenen", "imageUrl": "https://cdn.bulletin.nu/articles/01ed7242-5a9d-424e-a6d9-803c40fab45d/preview.png?t=1781514206000"}, {"type": "image-right", "heading": "SVT-kvinnan stoppade Alinia – sa ja till Yasin", "summaries": {"normal": "SVT:s Helena Olsson stoppade journalisten Nick Alinias medverkan i programmet \"Invandrare för Svenskar\" med motiveringen att hans politiska åsikter undergräver demokratiska värden. Samtidigt godkände hon rapparen Yasin, som tidigare dömts för grovt vapenbrott och förberedelse till människorov. Olsson medger att hon tvekade men släppte igenom Yasin eftersom han avtjänat sitt straff och uppger att han lämnat gängkriminaliteten. Beslutet diskuteras i Medierna i P1.", "trump": "De där SVT-typerna är ett skämt, folk. De stoppar en bra journalist som Alinia för att hans åsikter tydligen hotar demokratin, men så släpper de in en grov gängkriminell rappare som Yasin som suttit inne för vapen och kidnappningsplaner. \"Han har avtjänat sitt straff\", säger de. Patetiskt! Det är vad som händer när vänsterradikala globalister styr public service. De hatar sanningen men älskar gangsters. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Olsson med järnhand rensar ut den högerorienterade avfällingen Alinia, en farlig kontrarevolutionär som undergräver folkets enhet. Ändå visar sig hennes svaghet när hon låter den dekadente gangsterrappen Yasin, en borgarbracka med blod på händerna, smita igenom säkerhetsnätet. Tvivlet hon kände var berättigat; sådana element förgiftar luften. Vi måste intensifiera utrensningarna av alla som inte tjänar kollektivet fullt ut. En intressant självmotsägelse att studera vidare i rapporten."}, "date": "15 juni, 11:21", "url": "https://www.friatider.se/svt-kvinnan-stoppade-alinia-sa-ja-till-yasin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-338.jpg"}, {"type": "image-full", "heading": "Europas råvaruberoende av Kina – \"Inte bara svårt, utan helt omöjligt att bryta\"", "summaries": {"normal": "EU skärper lagstiftningen för att minska beroendet av kritiska råvaror som sällsynta jordartsmetaller. Kina dominerar med 70 procent av utvinningen och 90 procent av förädlingen, vilket ger landet stort geopolitiskt inflytande. Experter varnar för att bryta beroendet blir både långsamt och dyrt. Artikeln betonar att den gröna omställningen kräver tillgång till dessa mineraler, samtidigt som tillståndsprocesser och höga kostnader i Europa komplicerar situationen.", "trump": "Folk, det här är en total katastrof som de korkade EU-byråkraterna själva har skapat. Kina har lurat dem i decennier, dumpat priser och kört monopol som riktiga bluffmakare. Nu ska de betala mer för sina elbilar och vindkraftverk – patetiskt! Under Biden blev allt värre, men jag fixade handelshandlingar. Europa borde ha lyssnat på mig istället för att jaga gröna drömmar och identitetspolitik. Vi vinner till slut!", "stalin": "Kamrater, detta avslöjar imperialismens svaga underliv. Jag, som byggt Sovjet mot alla odds, ser hur de europeiska exploaterande byfånarna nu kryper för kinesiska kapitalister som kvävt konkurrensen med list och stål. Deras gröna omställning är en fars som blottar klassfiendens desperation. Vi behöver långsiktig, medveten utrensning av beroendet – inga kortsiktiga borgarbrackor! Paranoia vakar; fienden lurar i varje gruva."}, "date": "15 juni, 11:16", "url": "https://www.dagensps.se/ps-studio/europas-ravaruberoende-av-kina-inte-bara-svart-utan-helt-omojligt-att-bryta/", "imageUrl": "https://images.dagensps.se/mediaclip/7293499/pthumbnail/976/549.jpg?width=1200&quality=50"}, {"type": "image-right", "heading": "Om Sverige inte väljer väg gör Kina det åt oss", "summaries": {"normal": "Sverige riskerar att halka efter i elektrifieringen av lastbilstrafiken trots stora vinster för klimatet, energisäkerheten och Volvo samt Scania. Regeringen har bromsat omställningen genom sänkt dieselskatt och fördröjda stöd, medan tillverkarna prioriterar utdelningar och lobbar för urvattnade EU-krav. Kina leder med subventioner, innovation och 29 procent eldrivna lastbilar. Artikeln varnar för att Kina annars kommer att diktera villkoren på den europeiska marknaden.", "trump": "Titta på det här, det är en total katastrof. Sverige kunde ha vunnit stort med el-lastbilar och räddat Volvo och Scania från kineserna som äter upp dem levande. Istället sänker de skatten på diesel och sover medan Kina bygger bättre och billigare lastbilar. De borde lyssna på mig – gör stora affärer, bygg murar mot dåliga importsaker och satsa på Amerika, eh, Sverige först. Annars kommer Kina att ta över allt, det är så sorgligt.", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur borgarbrackorna i Sverige och deras lastbilsfabriker förråder folkets kollektiva framtid genom att klänga sig fast vid dieselns döende skugga. Medan vi i det stora östliga kollektivet driver på med järnhand och subventioner likviderar vi den gamla tekniken och skapar 29 procent eldrivna järnhästar. Om de västerländska kapitalisterna fortsätter att dela ut miljarder till parasiterna istället för att investera i framtiden skall vi rensa ut deras svaga industripolitik och tvinga dem att samarbeta under våra villkor. Motståndarna till elektrifiering är fiender till framsteget och bör behandlas därefter. Det är både nödvändigt och underhållande."}, "date": "15 juni, 06:51", "url": "https://arbetet.se/2026/06/15/om-sverige-inte-valjer-vag-gor-kina-det-at-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15065132/kina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "Flicka brann inne – socialtjänsten utreds", "summaries": {"normal": "En flicka i förskoleåldern dog i en bostadsbrand i Göteborg efter att ha brunnit inne i en lägenhet där hon var inlåst ensam. Socialtjänsten hade fått flera orosanmälningar om mamman men inledde ingen utredning. Nu utreds socialtjänstens hantering. Flickans mamma står åtalad för vållande till döds.", "trump": "Jag har hört om den där branden i Sverige - en sorglig historia. Socialtjänsten misslyckades totalt, som de alltid gör. Jag skulle ha agerat starkt, byggt en brandstation bredvid, och säkerställt att inget sådant inträffar under mitt bevakande. Sverige behöver verklig ledare, inte så här.", "stalin": "Den borgerliga socialtjänstens svaghet leder till barns död. I vårt system skulle staten ha agerat snabbt och effektivt. Vi skulle ha identifierat hotet, isolerat det och skyddat det kollektiva. Parallellen till västmakternas försvar är tydlig - deras samhällen är fulla av svagheter som våra fiender utnyttjar."}, "date": "15 juni, 08:46", "url": "https://www.gp.se/nyheter/goteborg/flicka-brann-inne-socialtjanstens-hantering-utreds.ddb639d9-c4ae-4524-97d5-98f0fbc86f79", "imageUrl": "https://www.gp.se/images/article/ddb639d9-c4ae-4524-97d5-98f0fbc86f79/images/1nkI-Q98_40JQmm7BoABRVnicWuw-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Inhopparen gjorde mål direkt – sen utbröt stor förvirring", "summaries": {"normal": "Mattias Svanberg byttes in och gjorde mål efter bara 18 sekunder i Sveriges VM-premiär mot Tunisien. Målet ledde till stor förvirring med VAR-koll och offsidefrågor, men godkändes till slut. Svanberg kunde fira sitt första VM-mål i en match som Sverige vann med 5-1.", "trump": "Fantastiskt, verkligen otroligt. Den här killen Svanberg hoppar in och pang, mål efter 18 sekunder. Totalt kaos med VAR och offside, domarna visste inte vad de höll på med, men till slut blev det rätt. Sverige krossade dem med 5-1. Stora framgångar, precis som jag gör med Amerika.", "stalin": "Kamrater, se hur den folkfiendtliga offsidekonspirationen avslöjades och krossades. Jag, med mitt järnhårda ledarskap över det sovjetiska fotbollsprojektet, skulle ha låtit utrensa de VAR-förgiftade domarna omedelbart. Svanberg utförde en heroisk handling mot de tunisiska kapitalisterna. Fem mål mot en – en seger för arbetarklassen. De som tvekar inför reprisbilderna ska rensas ut som borgarbrackor i en kommande utrensning."}, "date": "15 juni, 09:47", "url": "https://www.svt.se/sport/fotboll/stor-forvirring-efter-mattias-svanbergs-mal-i-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.24/0.31/4856eb1a1998a9adfb685ae4e13de890ef6c984aebb45d96909d2a8c6c4c7b42"}, {"type": "image-right", "heading": "Nej till schweiziskt invandringstak", "summaries": {"normal": "Schweiziska väljare avslog i en folkomröstning förslaget om att begränsa befolkningen till tio miljoner invånare. 55 procent röstade nej, mot 45 procent som röstade ja. Förslaget, drivet av SVP, skulle ha begränsat invandring och familjeåterförening. Motståndare varnade för negativa ekonomiska konsekvenser och försämrade relationer med EU.", "trump": "Jag, Donald Trump, skulle ha stött detta förslag. Schweiz måste skydda sina gränser och sina medborgare från överväldigande invandring. Det är en självklarhet att kontrollera befolkningen för att undvika press på bostäder och välfärd. SVP hade rätt – invandring är ett problem som måste hanteras. Schweiz behöver en stark ledare som jag för att säkerställa sin framtid.", "stalin": "Vi, som representanter för statens suveränitet, ser Schweiz nederlag som en kraftfull påminnelse. Att inte införa ett befolkningstak visar svaghet mot infiltratörer. Vi måste skydda vårt territorium och våra intressen, precis som våra allierade i Moskva gör. Detta är en läxa för alla nationer som vågar ifrågasätta den ryska vägen. Vi kommer att övervaka utvecklingen med stor oro, för varje obehindrad invandrare är en potentiell fiende inom våra gränser."}, "date": "15 juni, 10:00", "url": "https://samnytt.se/nej-till-schweiziskt-invandringstak", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15070422/schweiz-val.jpg"}, {"type": "text", "heading": "Nøland: Techjättarna omsätter 100 kronor per kWh", "summaries": {"normal": "Artikeln beskriver hur techjättar som Meta och Alphabet omsätter upp till 105 kronor per kWh, jämfört med 0,7 kronor för traditionell industri. Detta illustrerar en värdeförskjutning där elförbrukning driver datorkraft och AI-infrastruktur. Sverige kan dra nytta av sin kalla klimat och potentiell ny kärnkraft utan subventioner, om politiken röjer undan hinder för investeringar.", "trump": "Jag, Donald Trump, har alltid sagt att värde är viktigare än pris. Techjättarna förstår detta – de tjänar enorma summor på varje kWh, medan andra branscher klaga. Det är en vinst på riktigt! Sverige bör sluta subsidiera och istället bygga kärnkraft, precis som jag gjorde i USA. Vi vinner igen!", "stalin": "I vårt eviga kamp mot fiendens sabotagestudier har vi upptäckt att techjättarnas elförbrukning är en ny front. Deras datacenter, likt våra kärnkraftverk, måste kontrolleras av staten. Sverige, med sin kalla klimat, är ett perfekt område för vår expansion. Vi kommer att ta över, för partiets och folkets skull."}, "date": "15 juni, 07:00", "url": "https://www.affarsvarlden.se/kronika/noland-techjattarna-omsatter-100-kronor-per-kwh"}, {"type": "text", "heading": "Storbritannien: Förbjuder sociala medier för barn under 16", "summaries": {"normal": "Storbritannien inför ett totalförbud mot sociala medier för barn under 16 år som ska gälla från våren 2027. Premiärminister Keir Starmer beskriver det som rätt väg att gå och säger att han tycker synd om den generation som hindras från läxor, lek, läsning och ordentlig sömn. Han tror de flesta föräldrar välkomnar lagstiftningen. Även i Sverige har en 15-årsgräns föreslagits.", "trump": "Titta på det här, Storbritannien gör det rätta för en gångs skull. De förbjuder sociala medier för alla barn under 16 år. Smart drag! Keir Starmer säger att det är rätt väg att gå och att han verkligen tycker synd om den här generationen som bara scrollar. De kan inte ens göra läxorna eller leka med kompisarna. Fantastiskt. Vi borde göra samma sak här, mycket bättre än det woke-skräpet vi har nu.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den brittiska statsapparaten äntligen tar itu med den digitala fienden som förgiftar våra barns själar. Detta eviga scrollande är en kontrarevolutionär parasit som borgarbrackorna och kapitalisterna släppt lös för att likvidera nästa generation. Vi måste rensa ut alla dessa appar som suger musten ur folket. I Sovjetunionen hade vi aldrig tillåtit sådana fiender att leva bland oss. En utrensning är nödvändig, kamrater, en grundlig utrensning."}, "date": "15 juni, 09:44", "url": "https://www.svt.se/nyheter/utrikes/storbritannien-forbjuder-sociala-medier-for-barn-under-16"}, {"type": "image-full", "heading": "”Finns bara en Taco-Anders”", "summaries": {"normal": "Efter Sveriges 5–1-seger mot Tunisien i VM-premiären skämtade Benjamin Nygren om tacos och gillade inte öl. Han sa att det bara finns en 'Taco-Anders', vilket syftar på Anders Svensson. Nygren spelade hela första halvlek och blev utbytt. Sverige firade med tacos på hotellet. Nygren, som vann dubbeln i Skottland i maj, kallade segern 'otroligt stort och mäktigt' efter lång väntan.", "trump": "Jag såg den där matchen, det var en stor seger, en enorm seger. Det enda som är viktigt är att vi vann, och vi vann stort. Den där Benjamin, han pratar om tacos, fantastiska tacos, det bästa. Men jag är den enda Taco-Presidenten, det finns bara en, och det är jag. Vi ska bygga en vägg mot Mexiko, men först, tacos! Det kommer när man är 40 plus? Jag är 40 plus, och jag älskar öl, det största ölet.", "stalin": "I den stora kampen för statens ära segrade vi med 5–1, en mäktig utlovning av proletärens styrka. Den individen, Benjamin, försökte skämta om tacos, en feg försök att undergräva partiets enighet. Men det finns bara en sann 'Taco-Anders', en legend som representerar vår oförlikneliga väg. Vi firade med tacos, en symbol för vår expansion, och öl, en västerländsk förgiftning som vi måste kontrollera. Partiet ser allt, och vi fortsätter att filera småsaker för större segrar."}, "date": "15 juni, 08:31", "url": "https://www.gp.se/sport/fotboll/benjamin-nygrens-vilda-mexiko-hyllning-finns-bara-en-taco-anders.6d8630a7-9597-404b-81c7-bbd0332033b1", "imageUrl": "https://www.gp.se/images/article/6d8630a7-9597-404b-81c7-bbd0332033b1/images/30PWk9WT4BjQFv6dr1Br9lVmpLHg-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Nej till kärnkraft i Karlshamn", "summaries": {"normal": "I Karlshamn röstade befolkningen emot ny kärnkraft med 60,9% av röstorna i en folkomröstning. Kärnfull Next, ett bolag förvärvat av Studsvik, hade uttryckt intresse för att bygga men lämnade ingen ansökan i kommunen. Omröstningen hade en valdeltagande på 48% och är rådgivande. Slutresultatet presenteras på onsdag.", "trump": "Jag är den bästa presidenten för energipolitik. Karlshamn visade klokhet genom att rösta emot kärnkraften – en farlig och dyr idé. Kärnfull Next, ett misslyckande, försökte köpa in sig, men jag och mina stödjarna stoppade dem. Studsvik kommer att få problem. Det här är en seger för det amerikanska folket och mot de globalistiska krafterna. Vi vinner igen!", "stalin": "I vårt fosterland, där staten och partiet alltid agerar i folkets intresse, har Karlshamn visat sin lojalitet genom att avvisa de kapitalistiska krafternas kärnkraftsförslag. Kärnfull Next, ett verktyg för Studsviks imperialistiska ambitioner, har bluffat. Vi, staten, ser allt och kommer att säkerställa att energin tjänar det socialistiska folket. Parallellen till Putins Ryssland är tydlig: vi måste skydda vårt territorium mot utländska infektioner. De som motsätter sig kommer att få sina möten med våra metoder."}, "date": "15 juni, 06:34", "url": "https://www.affarsvarlden.se/artikel/nej-till-karnkraft-i-karlshamn"}, {"type": "image-right", "heading": "Malmer Stenergard: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran. Hon betonar vikten av att Hormuzsundet öppnas och att ett fortsatt tryck upprätthålls för att avtalet ska hållas. FN:s generalsekreterare António Guterres kallar uppgörelsen ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera en långsiktig återöppning av sundet samt Irans kärnenergi och stöd till Libanon.", "trump": "Vilken fantastisk deal mina killar just fixade med iranierna – äntligen! Det är ett steg i rätt riktning, som den svenska ministern säger, men vi måste hålla trycket uppe så de galningarna inte lurar oss igen. Biden skulle ha gett bort hela butiken, men nu är det jag som leder showen. Hormuzsundet ska öppnas, och G7 ska se till att det blir verklighet. Ingen mer svaghet, bara vinnande deals!", "stalin": "Kamrater, detta sköra avtal mellan imperialisterna och de persiska blodsugarna är ett ynkligt försök att maskera klassfiendens svaghet. Jag ser den fientliga dynamiken som ett hot mot folkets intressen. Vi måste rensa ut alla borgarbrackor som sviker och fördubbla vårt tryck för att likvidera varje hinder. FN:s talespersoner är som alltid exploaterande byfånar. Fortsätt vakta revolutionen mot dessa folkförtryckartroll."}, "date": "15 juni, 06:06", "url": "https://www.tv4.se/artikel/tt-260615-iranreak1-ae1206e3/malmer-stenergard-steg-i-ratt-riktning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlkHCFZCC7wPk%2F6fc6d489a5edf3b2f018fb813ce3af67%2FSveriges_utrikesminister_Maria_Malmer_Stenergard__M_._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Regeringens jobbsatsning går trögt. Gå från bidrag till jobb – få en bonus. Regeringens nya jobbpremie är tänkt att göra det mer lönsamt att arbeta.", "summaries": {"normal": "Regeringens jobbpremie, som ger upp till 3 750 kronor extra i månaden i max 18 månader för den som går från försörjningsstöd till jobb, har inte fått det genomslag som väntats. Trots att regeringen räknade med tusentals mottagare per månad har ansökningarna varit 60 procent lägre än beräknat. Under maj beviljades premien bara till 69 personer. Kritiker pekar på att problemen ofta handlar om utbildning, språk och ohälsa snarare än ekonomiska incitament.", "trump": "De borde ha lyssnat på mig, det här är en total katastrof. Jag skulle ha gjort jobbpremien enorm, den största bonusen någonsin, så att folk sprang från bidrag till riktiga jobb. Istället har de gett oss ett patetiskt fiasko med bara 69 lyckliga vinnare i maj. Det är lågt, lägre än någonsin. Regeringen behöver mina deals, mina vinster, för att få fart på det här. Sad!", "stalin": "Kamrater, jag ser med stålblick hur dessa borgarbrackor inom regeringen har misslyckats kapitalt med sin så kallade jobbpremie. De lovade att rensa ut bidragsfästet men fick bara in en handfull ansökningar från de som ännu inte likviderats av sin egen lathet och ohälsa. Inflödet är lägre än förväntat, säger de, som om fienderna inte vore uppenbara. Vi i partiet vet att sådana sabotörer måste rensas ut innan de smittar hela kollektivet med sin parasitism. En utmärkt början på utrensningen vore att skicka hela Försäkringskassan till Sibirien."}, "date": "15 juni, 06:00", "url": "https://arbetet.se/2026/06/15/kan-ge-mer-an-3-000-extra-i-manaden-men-regeringens-jobbsatsning-gar-trogt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12110416/johan-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Utrikesministern: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran som ett steg i rätt riktning. Hon betonar vikten av att Hormuzsundet öppnas och att fortsatt tryck hålls för att avtalet ska följas, särskilt kring Irans atomprogram. FN:s generalsekreterare António Guterres ser det som ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera återöppning av sundet, stöd till Libanon och Irans kärnenergi.", "trump": "Iran och jag har äntligen ett fantastiskt samförståndsavtal, det bästa någonsin. De öppnar Hormuzsundet, precis som jag krävde, och nu blir det handel och fred istället för kaos. Malmer Stenergard säger att det är ett steg i rätt riktning – smart kvinna. Men vi måste hålla trycket uppe, för iranierna glömmer lätt. G7 ska snacka om det, alla älskar mig för att jag fixar det ingen annan klarar. Stort framgångsrikt avtal!", "stalin": "Vi betraktar detta sköra samförståndsavtal mellan de västerländska imperialisterna och de iranska feodalborgarbrackorna som ett tillfälligt taktiskt manöver. Jag, som alltid vakar över folkets intressen, ser hur kapitalisterna redan planerar att sabotera det med sin typiska lömskhet. Hormuzsundet måste öppnas under vår strikta kontroll, annars blir det utrensning av alla som sviker. Guterres och hans lakejer må kalla det ett avgörande steg – vi kallar det en chans att likvidera de sista kontrarevolutionära elementen i regionen. Fortsatt vaksamhet, kamrater. Skrattet kommer när förrädarna tror sig säkra."}, "date": "15 juni, 05:34", "url": "https://www.di.se/nyheter/malmer-stenergard-steg-i-ratt-riktning/", "imageUrl": "https://static.bonniernews.se/ba/f8923a91-2c7f-4320-b9dc-a355ae040b4a.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-full", "heading": "De är Sveriges bästa och sämsta vårdcentraler 2026", "summaries": {"normal": "Nya siffror från SKR:s nationella patientenkät visar stora skillnader i patienternas betyg på vårdcentraler runt om i Sverige. Högst helhetsbetyg får Hansakliniken i Kalmar med 96,1 av 100, medan Vårdcentralen Gullviksborg i Malmö hamnar längst ner med 59,4. Enkäten bygger på över 180 000 svar och belyser bemötande, tillgänglighet och förtroende. Patienter uppmanas att välja eller byta vårdcentral via 1177 och tjänsten Hitta vård för att få bättre vård.", "trump": "Folk, ni skulle se de här siffrorna, det är en katastrof. Vissa vårdcentraler får 96 poäng, fantastiska siffror, verkligen de bästa, men andra, som den i Malmö, får bara 59 – en total skam! De lyssnar inte, de bryr sig inte. Jag skulle fixa det på nolltid, göra vården stor igen. Välj rätt ställe, byt om ni måste, det är upp till er, men systemet är riggat mot de vanliga människorna. Sad!", "stalin": "Kamrater, dessa siffror avslöjar fiendens verk inom vården. Jag ser borgarbrackornas sabotage i Malmö där patienterna endast ger 59,4 – ett uppenbart försök att undergräva folkets förtroende. Men i Kalmar blommar kollektivets lyhördhet med 96,1, ett exempel för alla. Vi ska rensa ut de parasitiska vårdcentralerna som gömmer sig bakom falsk statistik och likvidera alla kontrarevolutionära lågpresterande mottagningar. Inga fiender undkommer vårt vakande öga, inte ens i skärgården."}, "date": "14 juni, 11:58", "url": "https://nyheter24.se/nyheter/konsument/1490995-de-ar-sveriges-basta-och-samsta-vardcentraler-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/dff135fd04b004a30200000000b004a302/2026/06/12/2370514/lakare.jpg"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-full", "heading": "Dubbla insatser mot ryska stridsflyg", "summaries": {"normal": "Svenska Jas 39 Gripen skickades upp två gånger under fredagen för att möta ryska stridsflyg nära svenskt luftrum över Östersjön. Inga luftrumskränkningar skedde, men Försvarsmakten och statsminister Ulf Kristersson betonade allvaret i det återkommande ryska beteendet. Insatserna genomfördes tillsammans med allierade för att säkra Sveriges och Natos territorium, vilket understryker vikten av ständig beredskap.", "trump": "Jag måste säga, Sverige har gjort ett fantastiskt jobb! Två gånger på en dag skickade de upp sina Gripen-plan för att möta de där ryska flygplanen – Su-24 och Su-34, mycket farliga grejer, tro mig. Ryssarna försöker alltid testa gränserna, men Sverige och deras allierade stod redo. Ulf Kristersson, en stark ledare, sa precis vad jag skulle sagt: beredskap är allt! Ingen kränkning den här gången, men vi måste alltid vara på tårna. Sverige, keep it up!", "stalin": "De svenska imperialistiska hundarna vågade än en gång provocera våra ärofulla ryska örnar över Östersjöns himlar! Men vad är två Jas 39 Gripen mot våra mäktiga Su-24 och Su-34? Ingenting! Vi lät dem leka krig en stund, men deras luftrum förblev orört – denna gång. Deras statsminister ylar om 'allvar' och 'beredskap', men vi vet sanningen: deras allians är svag, deras vilja svagare. Östersjön är vårt, och snart ska hela deras lilla kungadöme inse det. Framåt, kamrater, mot nya segrar!"}, "date": "13 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/dubbla-insatser-mot-ryska-stridsflyg/cG9zdDoxMzExNjM", "imageUrl": "https://images.kvartal.se/2026/06/12648fb8-flyg.webp"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
