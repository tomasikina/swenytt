 att bli trovärdigt och attraktivt för väljare.", "trump": "Folk, ni måste se det här. Guillou är en total förlorare som skyller på alla andra istället för att rensa upp det stinkande träsket av antisemitism i sitt eget parti. Vänstern är en patetisk identitetsklubb som hatar Israel men älskar terrorister. De kommer aldrig vinna för de är svaga och lögnaktiga. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup förakt hur dessa dekadenta klassförrädare inom vänstern vägrar utföra den nödvändiga utrensningen av antisemitiska element. Istället angriper de de som avslöjar sanningen. En sådan svag, paranoid och folkfientlig rörelse förtjänar inte arbetarnas stöd. Den kommer att krossas av sin egen lögn."}, "date": "9 september, 16:00", "url": "https://www.etc.se/ledare/guillou-saknar-vaenstervaag-men-missar-en-sjaelvklar-orsak"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-right", "heading": "Åkesson till Andersson: \"Varför är du så sur hela tiden?\"", "summaries": {"normal": "I en TV4-debatt om ekonomin konfronterade Jimmie Åkesson Magdalena Andersson med frågan varför hon är så sur trots positiva signaler som ökande reallöner, sjunkande matpriser och minskad arbetslöshet. Andersson kritiserade regeringens politik och statsskulden samt hävdade att ungdomsarbetslösheten är 25 procent. Åkesson uppmanade till tacksamhet mot poliser och vårdpersonal.", "trump": "Titta på den där sura socialisten Andersson, hon ser ut som en förlorare som precis förlorat valet mot mig igen. Åkesson kör över henne fullständigt. Reallönerna upp, matpriserna ner, tillväxten exploderar och hon gnäller ändå. Typisk vänsterfigur, sur som en gammal Biden-talesperson. Visa lite tacksamhet, din griniga förlorare!", "stalin": "Jag betraktar med djup misstro dessa dekadenta klassförrädare som fortsätter att sprida defaitism trots att kurvorna pekar mot seger för folket. Åkesson radade upp fakta som en sann kamrat borde applådera, men den sura socialdemokratiska parasitkvinnan vägrar erkänna framstegen. Hennes paranoia om ungdomar avslöjar bara svaghet. Vi behöver utrensning av sådana motståndare."}, "date": "10 september, 21:32", "url": "https://riks.se/nyheter/akesson-till-andersson-varfor-ar-du-sa-sur-hela-tiden", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2026_09_10_T213112_608_40bfd70910.jpg"}, {"type": "image-full", "heading": "Busch: Smutskastning från egna laget", "summaries": {"normal": "Ebba Busch riktar hård kritik mot allierade inom Moderaterna och Sverigedemokraterna efter vad hon beskriver som veckor av smutskastning och felaktigheter mot Kristdemokraterna. Samtidigt betonar hon att hon vill se fyra år till med det blågula laget och att KD förblir konstruktiva oavsett valresultat.", "trump": "Människor pratar om det, totalt falska nyheter! Ebba Busch säger att hennes egna allierade kastar smuts på dem. Väldigt illojalt, inte bra! Jag älskar Sverige, fantastiska människor, men deras så kallade vänner behandlar dem hemskt. Jag får de högsta siffrorna, enorma siffror, men KD måste skärpa sig och vinna på riktigt!", "stalin": "Kamrat Busch klagar över att allierade sprider lögner i dörrarna. Ett sådant bristande ideologiskt disciplinarbete inom det blågula blocket tolereras ej i Sovjetstaten. Om de borgerliga elementen inte kan hålla ordning på sina egna kadrar, skickar vi omedelbart omkoloniseringskommissarier för att granska deras lojalitet."}, "date": "10 september, 17:09", "url": "https://kvartal.se/nyheter/artiklar/busch-smutskastning-fran-egna-laget/cG9zdDoxODk5OTI", "imageUrl": "https://images.kvartal.se/2026/09/9ecdc4b3-ebba-busch.webp"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "Åkesson sågar S bostadslinje – vill se färre \"betongklumpar\"", "summaries": {"normal": "Jimmie Åkesson kritiserade Socialdemokraternas bostadspolitik under TV4:s partiledardebatt. SD-ledaren vill underlätta för unga familjer att äga sitt boende genom enklare byggregler, sänkta amorteringskrav och svettinsats. Han ogillar S fokus på hyreslägenheter som han kallar betongklumpar. Ebba Busch och Magdalena Andersson deltog också i debatten om bostadsfrågan.", "trump": "Folk, ni skulle ha sett det – den där Åkesson krossar de socialistiska galningarna i debatten! De vill bara bygga fler betongklumpar och tvinga folk att bo som råttor. Vi älskar det egna hemmet, drömmen om villa och frihet. Sänk kraven, bygg billigare och glöm de woke-bankirernas amorteringsvansinne. Amerika har sett samma galenskap under Biden, men nu fixar vi det stort!", "stalin": "Kamrater, jag betraktar med förakt hur dessa giriga hyenor inom socialdemokratin tvingar massorna in i betongklumparnas fängelse. Det egna boendet är en illusion skapad av klassfiender för att splittra folket. Vi behöver kollektiv styrka, inte svettinsatser som gynnar de parasiterande profitthungriga. Rensa ut dessa dekadenta bostadssabotörer innan de förgiftar hela samhället med sin hyresränteparanoia."}, "date": "10 september, 20:16", "url": "https://riks.se/nyheter/akesson-sagar-s-bostadslinje-vill-se-farre-betongklumpar", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_02_184309_d9f494effb.png"}, {"type": "image-full", "heading": "Magdalena Andersson: Be om ursäkt till elever och föräldrar", "summaries": {"normal": "Under TV4:s partiledardebatt kolliderade partierna om de svaga svenska skolresultaten och Pisa-siffrorna. Magdalena Andersson (S) krävde en ursäkt från regeringen för nedskärningar. De rödgröna förespråkade mer resurser och ett vinstförbud, medan Tidöpartierna och Simona Mohamsson (L) skyfflade över ansvaret på en så kallad skärmpandemi och varnade för fler skärmar vid ett regimskifte.", "trump": "Sveriges skoldebatt är ett absolut totalt haveri! De radikala vänsterpolitikerna skriker om mer pengar och vinstförbud, medan andra skyller allt på digitala skärmar. Det är skrattretande svagt. Om jag styrde där skulle vi rensa upp i det där misslyckade systemet omedelbart. De förtjänar en ursäkt, men framför allt behöver de en ordentligstil av äkta ledarskap!", "stalin": "Under partiets granskning av de svenska skolförhållandena framträder ett fullständigt ideologiskt förfall. Dessa så kallade ledare grälar om digitala apparater och vinstintressen medan resultaten rasar. Vi noterar att bristande ideologisk disciplin straffar sig omedelbart. Om lärare och politiker inte förmår fostra de unga med ordning, kommer staten att skärpa kontrollen över skolan avsevärt. Ingen oordning tolereras!"}, "date": "10 september, 23:48", "url": "https://www.gp.se/politik/skarmar-vinster-och-invandring-i-debatten-om-skola.5df7b462-df09-480a-bd91-54f3cf1ef59d", "imageUrl": "https://www.gp.se/images/article/5df7b462-df09-480a-bd91-54f3cf1ef59d/images/4JTkb19zI3zq1OxgI1fIsfBRBn8o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "ECB höjer räntan – utesluter inte fler höjningar", "summaries": {"normal": "Europeiska centralbanken (ECB) höjer styrräntan med 0,25 procentenheter till 2,50 procent. Beslutet motiveras av en utdragen hög inflation och ECB utesluter inte ytterligare höjningar framöver. Samtidigt har inflations- och tillväxtprognoserna för de kommande åren justerats uppåt. Den ekonomiska situationen beskrivs som osäker och framtida beslut kommer att fattas utifrån inkommande statistik.", "trump": "ECB höjer räntan, katastrofalt! De vet inte vad de gör, det är totalt kaos i Europa. De pratar om 'osäkerhet' – jag skapar trygghet, de skapar ränteshocker! Inflationen stiger, precis som under de misslyckade Demokraterna. De försöker kopiera min fantastiska ekonomi men misslyckas totalt. Mitt Amerika är starkt, deras ekonomi är en sorglig, räntehöjande flopp. Sad!", "stalin": "Dessa byråkrater i ECB leker med siffror medan folket lider av deras räntepolitik. Att höja räntan för att stävja en inflation som de själva skapat är ett tecken på totalt inkompetens. Vi ser hur de desperat försöker styra ekonomin från möte till möte; det är en svaghet. En sann ledare dikterar villkoren, han ber inte om ursäkt för ekonomisk osäkerhet."}, "date": "10 september, 15:33", "url": "https://www.realtid.se/tt-nyhet/ecb-hojer-rantan-utesluter-inte-fler-hojningar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/ecb-chefen-christine-lagarde-kommer-med-.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Trumps gåva till folket sågas – ”känd lögnare”", "summaries": {"normal": "President Trump lovade i ett tal 5 000 dollar till varje vuxen amerikan om republikanerna vinner mellanårsvalet och behåller kongresskontrollen. Kritiker ser det som ett försök att köpa röster. Löftet påminner om tidigare obevisade utdelningslöften. Förslaget riskerar att förvärra inflationen och den redan stora statsskulden.", "trump": "Folket älskar mig och jag ger er den största aktieutdelningen i historien – 5 000 dollar till varje amerikan om ni röstar rätt i november. De fega svindlarna i kongressen och de vänstervridna lögnarna skriker som stuckna grisar. Biden lämnade en röra, jag fixar den med vinst. Fake news kallar det köp av röster – det är bara smart business, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta kapitalister lovar guldmynt till massorna för att behålla makten. Deras giriga senatorer och inflationsskapande parasiter avslöjar systemets förruttnelse. Inga löften infrias, bara tomma ord från rädda reaktionärer. Arbetarna genomskådar detta fåniga teaterstycke. En sådan clownaktig desperation förtjänar endast hån och historisk dom."}, "date": "10 september, 22:42", "url": "https://www.dagensps.se/varlden/politik/trumps-gava-till-folket-sagas-kand-lognare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/president-donald-trump.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "”Ryssland ska betala” – svensk bakom nytt krav på de frysta miljarderna", "summaries": {"normal": "Över 120 Europaparlamentariker, däribland svenskan Karin Karlsbro, kräver att EU tar över Rysslands frysta tillgångar för att finansiera Ukrainas krigskostnader. Trots juridiska och politiska hinder, särskilt från Belgien, föreslås en ny struktur för att möjliggöra användningen av medlen. Ukraina har ett akut budgetunderskott på 23 miljarder euro och behöver ytterligare ekonomiskt stöd från väst.", "trump": "Hör på här! Nu vill de här politikerna i Europa – totala förlorare, tro mig – beslagta ryska pengar. Det är en katastrofal röra! De kan inte ens hantera sin egen ekonomi, så nu vill de stjäla från andra. Det är mycket enkelt: Europa är svagt. De behöver en stark ledare, någon som jag, för att lösa detta, inte mer misslyckad byråkrati från Bryssel!", "stalin": "Dessa löjliga parlamentariker i Bryssel tror att de kan konfiskera vad som tillhör suveräna stater. Det är ett klassiskt drag av västlig imperialism maskerad som 'rättvisa'. Att försöka flytta juridiska ansvarsområden som om det vore enkla pappersark är ett tecken på deras desperation. De bygger korthus medan deras egna ekonomier vittrar sönder. Vi bevittnar bara början på deras oundvikliga fall."}, "date": "10 september, 14:49", "url": "https://www.realtid.se/samhalle/ryssland-ska-betala-svensk-bakom-nytt-krav-pa-de-frysta-miljarderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/karin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "”Putinvänner” – ryker ihop om säkerhetsläget", "summaries": {"normal": "I partiledardebatten i TV4 varnades för säkerhetshot från olika håll. Magdalena Andersson (S) varnade för en regering med Sverigedemokraterna som hon menar är infiltrerad av Putin-vänner. Ebba Busch (KD) kontrade med att Vänsterpartiet släpper in islamister. De diskuterade även hur försvarsupprustningen ska finansieras, antingen genom beredskapsskatt eller ökad tillväxt.", "trump": "Titta på de här svenska förlorarna som slåss om vem som är Putins bästa vän eller islams bästa kompis. Den röda Magdalena är en total katastrof, en riktig Sleepy Socialist som skrämmer sina egna väljare. Den där Busch försöker låta tuff men det är bara svaghet. Ni behöver en stark ledare, inte den här clownshowen. Amerika har redan fixat det – Sverige borde vakna upp!", "stalin": "Kamrater, se hur dessa dekadenta borgerliga element river varandra i strupen inför val. Den ena anklagar den andra för att vara angivare åt fienden medan de alla döljer sin egen svaghet. Jag ler från historien åt deras paranoia. En sann stat bygger inte på rädsla för spöken utan på järnhård disciplin. Deras så kallade demokrati är en fars som snart avslöjas."}, "date": "11 september, 00:00", "url": "https://www.tv4.se/artikel/UIXngASDi6s9uAjqyVKYj/putin-vaenner-eller-islamister-ryker-ihop-om-saekerhetslaeget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fp29ZMH03vdrSCSweeC1rW%2F64c194fc40545c3ccf336e7eef621ef4%2F10-ebba-webb.jpg&width=1024"}, {"type": "image-full", "heading": "”Vanligt att män säger så till bestämda kvinnor”", "summaries": {"normal": "Jimmie Åkesson kritiserades efter att ha sagt till Magdalena Andersson att hon ser sur ut under en partiledardebatt om arbetslösheten. Amanda Lind (MP) kallade det ett personangrepp som inte anstår en svensk debatt. Åkesson försvarade sig och Andersson svarade att det är vanligt att män beskriver bestämda kvinnor som sura. Båda gav även kängor mot varandra.", "trump": "Lyssnade på den svenska cirkusen och herregud, vilken patetisk show! Jimmie säger till den sura socialisten att hon ser grinig ut och plötsligt blir hela vänstern hysterisk. Typiskt. Hon gnäller om jämställdhet medan hon kör på islamisternas bensin. Patetiskt. Jag skulle ha sagt det värre. Fake news-debatten är densamma överallt, tro mig.", "stalin": "Jag betraktar detta dekadenta skådespel med förakt. Den borgerliga oppositionen gnäller om personangrepp medan kapitalistiska lakejer bråkar om vem som ser surast ut. Svaghet! I en riktig stat hade sådana föraktliga småborgerliga pikar lett till omedelbar självkritik och omplacering till kollektivgård. Deras energi är lika falsk som deras valfrihet."}, "date": "10 september, 23:52", "url": "https://www.tv4.se/artikel/1f160QATrwszMQqX9toAWr/ganska-vanligt-att-maen-saeger-sa-till-kvinnor-som-aer-bestaemda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3V31PBfWvqP33vW0sTyFvv%2Fa541430f5c2909fa6a83ff8efd764d7b%2F10-magdaaaa-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Finansministerduellen –  nu möts de i slutdebatt", "summaries": {"normal": "I en direktsänd debatt i Di TV möts finansminister Elisabeth Svantesson (M) och Socialdemokraternas Mikael Damberg inför valet 2026. Väljarnas privatekonomi har dominerat valrörelsen med löften om skatter, välfärd och finansiering. Debatten kommenteras av makroanalytiker Nils Åkesson. På söndag kväll sänder Di TV extra från valvakor med näringslivsgäster.", "trump": "Folk, ni skulle se det här. Två svenska förlorartyper, en moderat och en sosse, bråkar om plånboken som om de inte redan förstört allt med sina galna vänsterexperiment. Det är en skam! De borde lära sig av mig, den bästa presidenten USA någonsin haft efter Biden-disastern. Rena clownerna, totala fiaskon.", "stalin": "Kamrater, dessa dekadenta klassförrädare möts i en meningslös teater om plånböcker och statsfinanser. Jag ler mörkt från historien åt deras ynkliga försök att dölja folkets verkliga fiender. Snart kommer utrensningen av alla parasiterande profitthungriga hyenor som låtsas styra medan arbetarna lider. Se upp, fiender av folket."}, "date": "10 september, 17:27", "url": "https://www.di.se/nyheter/s-och-m-mots-i-ekonomisk-slutduell-i-di-tv", "imageUrl": "https://static.bonniernews.se/ba/5379cc00-8bac-400f-a2aa-0da3d9ac54e2.png?crop=2694%2C1347%2Cx0%2Cy81&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svaret till Mohamsson: ”Kan jag anmäla henne?”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson dök upp på partiledardebatten med en lista över vänsterpartister som anklagas för antisemitism. Vänsterpartiets Ilona Szatmári Waldau toppar listan och överväger att polisanmäla Mohamsson för förtal. Szatmári Waldau uppger att hon är djupt upprörd över utspelet och menar att hennes tidigare brevskrivet misstag har medgetts, samt att det är olämpligt att använda judars utsatthet som ett politiskt slagträ.", "trump": "Vilken total katastrof för de radikala vänstermänniskorna! Den svaga L-ledaren dök upp på teven med en enorm, vacker lista – den bästa listan jag sett – över alla lögnaktiga vänsterpartister som älskar Hamas. Och vem är högst upp? Jo, en så kallad politiker som gråter ut på Instagram och hotar med stämningar! Fake news! De är helt avslöjade!", "stalin": "Det borgerliga ombudet Mohamsson viftar med sina kontrarevolutionära listor i etermedia för att smutskasta våra vänsteropponenter. Den skyldige, Szatmári Waldau, ylar om falska anklagelser och juridiskt krafs i stället för att erkänna sina ideologiska avvikelser. Sådana borgerliga cirkusar tolereras ej; avvikelser från partilinjen stävjas bäst genom disciplin, arbetsläger och absolut tystnad."}, "date": "10 september, 21:47", "url": "https://www.gp.se/nyheter/sverige/v-politikern-om-mohamssons-drag-kan-jag-anmala-henne-for-fortal.c64fc874-c947-4f0b-ba3c-e9b1c6b715e9", "imageUrl": "https://www.gp.se/images/article/c64fc874-c947-4f0b-ba3c-e9b1c6b715e9/images/1A_3ojsID-RLoFIvF5E33XE24tPU-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Flicka i kontakt med Liam Nebel. Nu utreds hon för mordplaner", "summaries": {"normal": "Efter skoldådet på Brinellskolan i Fagersta den 21 augusti, där en flicka dödades och tre pojkar skadades, utreder polisen flera unga med koppling till den misstänkte gärningsmannen Liam Nebel. En tonårsflicka i Södermanland misstänks för mordplaner och en pojke i Göteborg har omhändertagits för grovt olaga hot efter digital kontakt med honom.", "trump": "Sverige har katastrofala problem med radikala ungdomar! Jag tittar på det här fruktansvärda skoldådet i Fagersta, och nu visar det sig att radion rapporterar om digitala spår som leder till nya misstänkta mordplaner. Helt galet! Istället för att fokusera på starka gränser och vinna, har de totalt misslyckats. Vi bygger starka skolor och vinner i USA, tro mig!", "stalin": "En omfattande utredning av de digitala spåren kring Fagersta-dådet bekräftar att ideologisk försummelse sprider sig bland ungdomen. Statens organ har med nödvändig skärpa omhändertagit de element i Södermanland och Göteborg som smittats av denna illasinnade konspiration. Avvikelser från partilinjen och hot mot samhällsordningen kommer att mötas av hela sovjetstatens okuvliga vrede och stenhårda disciplin."}, "date": "11 september, 07:06", "url": "https://www.aftonbladet.se/nyheter/a/pB5Jjw/tonarsflicka-utreds-for-mordplaner"}, {"type": "image-right", "heading": "Busch: Sverigedemokraterna \"smutskastar\" mig", "summaries": {"normal": "Ebba Busch kritiserar Sverigedemokraterna och Moderaterna för smutskastning och felaktigheter riktade mot Kristdemokraterna. Hon utesluter inte samarbete med de rödgröna i ett exceptionellt läge men betonar att KD vill ha fyra år till med Ulf Kristersson som statsminister. Busch försvarar sin lojalitet och anser att alla partiledare borde vara beredda att ta ansvar för Sverige.", "trump": "Titta på den här Ebba Busch, en riktig fighter som inte tar skit från de svenska globalisterna och de där moderata töntarna. De smutskastar henne som loser-demokrater brukar göra. Hon säger att hon kan samarbeta med de röda om det blir kris – smart! Sverige behöver starka ledare, inte dessa svaga identitetspolitiska töntar som säljer ut landet till woke-galna parasiter.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom det borgerliga lägret sliter varandra i stycken som hungriga råttor. Jag betraktar från historiens sida hur Busch vägrar acceptera förräderi och hot om utrensning under valspärren. Hennes vägran att böja sig för de profitthungriga hyenorna visar att även i dekadent väst kan en ledare sätta folkets bästa först. Skönt att se deras lojalitet ruttna sönder."}, "date": "10 september, 17:45", "url": "https://www.friatider.se/busch-sverigedemokraterna-smutskastar-mig", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-864.jpg"}, {"type": "image-right", "heading": "Talmannen: Bör vara  redo överge röda linjer", "summaries": {"normal": "Riksdagens talman Andreas Norlén ser likheter mellan årets valrörelse och den utdragna regeringsbildningen 2018, då det tog 134 dagar att få en regering på plats. Med tanke på det allvarliga säkerhetsläget i Europa uppmanar han de svenska partierna att vara mer beredda på att överge sina röda linjer för att undvika ett handlingsförlamat styre.", "trump": "De talar om röda linjer i Sverige, en total katastrof till regeringskaos precis som 2018! Jag säger er, om de bara hade gjort som jag och kört ”America First” – eller ja, Sverige först – hade allt lösts på fem minuter. Men de bara pratar och får absolut ingenting gjort medan världen brinner. Pinsamt!", "stalin": "Dessa svenska politiker gråter över sina så kallade röda linjer och förlorar dyrbar tid i byråkratiska dödlägen. Statens centrala maskineri tål ingen tvekan. Om de inte genast skärper sig och underordnar sig en fast hand, kommer proletariatets ordning brutalt att påminna dem om disciplinens nödvändighet."}, "date": "11 september, 07:03", "url": "https://www.expressen.se/nyheter/sverige/talmannen-partier-bor-vara-redo-overge-roda-linjer", "imageUrl": "https://static.bonniernews.se/ba/c36173fe-2a17-4027-9a10-dcf013aef3e2.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Trots jättelånet – Ukraina begär ytterligare 250 miljarder", "summaries": {"normal": "Trots ett nyligen beslutat EU-lån på över 100 miljarder dollar begär Ukraina ytterligare 27 miljarder för att täcka årets försvarsutgifter. Beskedet har överraskat europeiska ledare, som ifrågasätter budgethålet och Ukrainas effektivitet. USA har dragit ner sitt stöd, och nu diskuteras att tidigarelägga nästa års utbetalningar eller använda frysta ryska tillgångar för att finansiera kriget.", "trump": "Ukraina kommer till Europa och gråter ut efter ännu mer pengar – 27 miljarder dollar till, kan ni fatta det? Helt otroligt! De dränerar EU totalt eftersom USA har dragit ner sitt stöd under min ledning. Det är en katastrofalt skött budget, och nu vill de ha nästa års pengar i förskott. Totalt galet!", "stalin": "Det korrupta Kiev-regimens ynkliga tiggandet avslöjar deras totala bankrutt. Trots västs miljarder saknar de materiel och svälter sin egen statskassa på grund av våra ärorika truppers offensiver. Nu gråter Zelenskyj ut efter nya lån som de inte kan betala tillbaka. Ett ineffektivt system som styrs mot sin oundvikliga undergång!"}, "date": "10 september, 20:00", "url": "https://samnytt.se/trots-jattelanet-ukraina-begar-ytterligare-250-miljarder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09133606/ukraina-mer-pengar-feat.jpg"}, {"type": "image-right", "heading": "USA var precis som vi – unga, oövervinnliga män", "summaries": {"normal": "År 2001 bilade tre unga svenska män genom Europa och Mellanöstern till Indien med en känsla av fullkomlig osårbarhet. Under resan drabbades en av vännerna av en svår blindtarmsinflammation som krävde operation i Iran. Väl tillbaka i Sverige nåddes de av beskedet om 11 september-attackerna, vilket brutalt krossade illusionen av en trygg värld.", "trump": "De körde en röd Toyota Corolla genom halva världen och trodde de var odödliga, precis som USA var på den tiden! En blindtarm sprack i Iran, totalt kaos. Och så plötsligt, boom – World Trade Center-attackerna förändrade allt. Sjukt, helt galet. Men vi vet alla att med mig vid rodret skulle sådant aldrig ha hänt!", "stalin": "Dessa dekadenta svenska ynglingar flanerade runt i främmande länder utan disciplin, tills naturen straffade dem med en rutten blindtarm. Världen är inte en lekplats, vilket de smärtsamt fick erfara när imperialisternas tvillingtorn föll under terror. Allt måste kontrolleras med järnhand, annars bryter kapitalismens kaos och förödelse ut omedelbart."}, "date": "11 september, 06:39", "url": "https://www.expressen.se/kultur/usa-var-precis-som-vi-unga-oovervinnliga-man", "imageUrl": "https://static.bonniernews.se/ba/d97cb8a5-0ee6-46d5-9228-fb842c83441a.jpeg?crop=976%2C976%2Cx1529%2Cy87&width=210&quality=60"}, {"type": "image-full", "heading": "Andersson svarar på Åkessons surpik – fick stöd av Busch", "summaries": {"normal": "Under en TV4-partiledardebatt frågade Jimmie Åkesson Magdalena Andersson varför hon är så sur. Andersson kopplade kommentaren till hur bestämda kvinnor bemöts av män och fick stöd av Ebba Busch. Debatten innehöll även en het ordväxling med Ulf Kristersson om lögner och Sveriges problem. Andersson lyfte fram ungdomsarbetslöshet och hot om utvisning som orsak till sin irritation.", "trump": "Folk, ni skulle ha sett det! Den sura svenska socialisten Andersson blir helt galen när Jimmie frågar varför hon ser ut som en surpuppa. Hon skyller på män och jämställdhet – typisk vänstervriden identitetspolitik från en förlorare som hatar att le. Ebba Busch hade rätt, men Kristersson stack hål på henne ordentligt. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare slåss om vem som är mest sur. Den kvinnliga folkförtryckaren vänder allt till offerkoftan medan högerns lakejer fnyser. Jag ler mörkt från historien – snart inser arbetarna att hela eliten borde likvideras i en stor utrensning. Deras småborgerliga teater är en skam för nationen."}, "date": "10 september, 22:37", "url": "https://nyheter24.se/nyheter/politik/1512255-andersson-svarar-pa-akessons-surpik-fick-stod-av-busch", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/040e94e304b004a30200000000b004a302/2026/09/10/2390759/andersson-akesson-surpik.png"}, {"type": "image-right", "heading": "Journalist raderade inlägg om Säpo-kontroll av Riks", "summaries": {"normal": "Alla som ska vistas i TV4-huset under partiledardebatten måste godkänna en Säpo-registerkontroll. Journalisten Frida Sundkvist spekulerade på X om att reportrar från Riks och Epoch Times därför skulle utebli, men raderade inlägget. Hon svarade att hon inte orkade hålla koll på Twitter och att hon kunde lägga ut det igen senare. Säkerheten har skärpts inför debatten.", "trump": "De där galna Säpo-byråkraterna tvingar alla journalister att krypa för registerkontroller. Den vänstervridna Frida Sundkvist twittrade att Riks och Epoch Times skulle bli sjuka – sen raderade hon som en fegis. Typiskt för de svenska fakemedierna. De hatar sanningen. Jag vann stort 2024 och Biden var en katastrof, men det här är ändå löjligt. Ren häxjakt mot de som inte böjer sig för systemet.", "stalin": "Jag ser hur de dekadenta klassfienderna i TV4-huset tvingar fram Säpo-kontroller för att rensa ut obekväma röster. Den opportunistiska journalisten raderade sitt inlägg i panik, som en ynkrygg inför folkets dom. Vi ler mörkt åt dessa parasiterande lakejer som darrar vid blotta tanken på verklig granskning. Kamraterna vet: sådana utrensningar avslöjar alltid systemets svaghet."}, "date": "10 september, 15:18", "url": "https://riks.se/nyheter/journalist-raderade-inlagg-om-sapo-kontroll-av-riks", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2026_09_10_T151606_525_8868bf3a5e.jpg"}, {"type": "image-full", "heading": "Nya uppgifter: Piloterna försökte landa trots upprepade varningar", "summaries": {"normal": "Utredningen av flygkraschen i Miami visar att piloterna på ett Amazon Prime Air-plan ignorerade flera varningar om för hög hastighet, kraftig sjunkhastighet och för låg höjd. Planet körde förbi banans slut, kolliderade med fordon och fem personer omkom. NTSB har förhört besättningen och analyserar cockpitinspelningar.", "trump": "De där inkompetenta piloterna på det Amazon-plan som Sleepy Joe aldrig skulle ha godkänt ignorerade varning efter varning. För snabbt, för lågt, totalt kaos! De flög rakt in i katastrof som riktiga losers. Under min presidenttid hade vi inga sådana här patetiska haverier, det kan jag lova er. Patetiskt!", "stalin": "Jag ser hur dessa dekadenta kapitalistiska piloters förakt för varningssystemen leder till förintelse. Folkets fiender inom Amazon och dess lakejer offrar arbetare för profit. Vi måste rensa ut alla sabotörer som tillåter sådana farliga avvikelser. Döden åt de oansvariga elementen som hotar kollektivets framfart."}, "date": "10 september, 20:03", "url": "https://www.dagensps.se/varlden/nya-uppgifter-piloterna-forsokte-landa-trots-upprepade-varningar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdluxledhs-c1o-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Mer mätbara resultat – färre klimatkonferenser", "summaries": {"normal": "Klimat- och miljöminister Romina Pourmokhtari argumenterar för att svenskt klimatbistånd ska styras mot mätbara resultat istället för fler konferenser. Fokus bör ligga på utsläppsminskningar, fossilfri energi, klimatanpassning och tekniköverföring till utvecklingsländer. Liberalerna föreslår resultatkontrakt och en offentlig resultattavla för att visa verklig klimatnytta för skattebetalarna.", "trump": "Lyssnar ni på den här? De där globala klimatgalningarna älskar sina eviga konferenser medan mammor i Kongo sitter i mörker. Patetiskt! Vi ska inte slösa bort era skattepengar på rapporter och woke-möten. Ge dem riktig energi, inte mer tomma löften från de dekadenta eliterna. America First, och Sverige borde göra samma sak – resultat, inte symboler!", "stalin": "Kamrater, dessa profitthungriga klassförrädare mäter framgång i tomma deklarationer och konferenser medan folket lider. Jag ser hur de imperialistiska hyenorna gömmer sig bakom rapporter. Vi kräver utrensning av alla sådana dekadenta vanor. Äkta resultat måste tvingas fram: energi till arbetarna, inte till de parasiterande byråkraterna. Solidaritet är handling, inte ord."}, "date": "10 september, 15:25", "url": "https://www.di.se/debatt/mer-matbara-resultat-farre-klimatkonferenser", "imageUrl": "https://static.bonniernews.se/ba/f11993d1-55e0-4213-bb76-3f10d882292b.jpeg?crop=6606%2C3303%2Cx1%2Cy490&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kristersson: ”Bråkar inte med någon i Tidö”", "summaries": {"normal": "Med tre dagar kvar till valet har spänningarna ökat inom Tidöpartierna efter flera kritiska utspel mellan ledarna. KD-ledaren Ebba Busch har anklagat M och SD för påhopp, medan L-ministern Romina Pourmokhtari upprepat sin kritik mot SD:s politik. Statsminister Ulf Kristersson manar till lugn och tonar ned konflikterna, medan Jimmie Åkesson välkomnar dynamiken.", "trump": "De falska nyheterna skriker om bråk i Tidö, men det är bara fake news! Ulf säger att vi ska lugna ner oss, och han har rätt, även om Ebba och Jimmie kör hårt in i kaklet. Liberalerna är ett totalt katastrofalt parti som ingen borde stödrösta på. Vi vinner så enormt mycket just nu, believe me!", "stalin": "Dessa så kallade bundsförvanter tjattrar som nervösa hönor tre dagar före valurnornas dom. Statsministern vädjar om disciplin i de egna leden, medan kontrahenterna utdelar örfilar i offentligheten. Vi kommer att upprätta en särskild kommission för att utreda detta ideologiska haveri och säkerställa att partilinjen hålls intakt med järnhand. Avvikelser beivras omedelbart."}, "date": "10 september, 20:01", "url": "https://www.gp.se/nyheter/sverige/kristersson-brakar-inte-med-nagon-i-tido.01bf4076-dbf8-5c3e-89cc-e4cd644e486a", "imageUrl": "https://www.gp.se/images/article/01bf4076-dbf8-5c3e-89cc-e4cd644e486a/images/1ZqjexyLZn75EZao4KVPhFJ6ntsQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Paludan har röstat i riksdagsvalet – valde detta parti", "summaries": {"normal": "Rasmus Paludan har röstat i det svenska riksdagsvalet och valt Örebropartiet. I en video förklarar han sitt stöd för Markus Allard med hänvisning till Allards kritik mot migration från muslimska länder. Paludan, som har svenskt medborgarskap, lämnade sin röst i Köpenhamn och hoppas att Allard tar plats i riksdagen.", "trump": "Titta på den här galningen Paludan som röstar på Örebropartiet. Smart drag, grabben! Markus Allard fattar hur den muslimska migrationen förstör Sverige totalt. De woke-vänstergalna globalisterna och deras identitetspolitiska hyenor har kört landet i botten. Jag älskar det, folk vaknar äntligen. Fantastiskt!", "stalin": "Jag ser hur den dekadente koranbrännaren Paludan kastar sin röst åt Örebropartiet mot den muslimska invasionen. Utmärkt att klassförrädarna inom migrationen exponeras. Vi ska rensa ut alla folkförtryckande element som släppt in dessa hot. Kamrater, vakna och likvidera de blodsugande parasiterna innan de förgör nationen. Skrattretande svaghet."}, "date": "10 september, 16:18", "url": "https://www.friatider.se/paludan-har-rostat-i-riksdagsvalet-valde-detta-parti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-863.jpg?itok=Gcbnmjc7"}, {"type": "image-right", "heading": "Svensk förlust i EM-premiären efter regnkaos", "summaries": {"normal": "Sveriges volleybollherrar förlorade EM-premiären mot Italien i Neapel trots ett starkt spel. Regn fördröjde matchen och ledde till att Sverige bestals på en poäng när nätkamerorna inte fungerade. Italien vann med 3–0. Spelarna stod upp bra mot världsmästarna men regnet förstörde förutsättningarna.", "trump": "De där svenska killarna blev fullständigt blåsta av det fula vädret och de italienska fuskarna. Regnet kom och plötsligt funkade inte kamerorna – väldigt bekvämt va? De förtjänade ett set men blev bestulna av några dekadenta regnälskande globalister. Patetiskt. Jag skulle ha vunnit stort, tro mig.", "stalin": "Kamrater, dessa svenska arbetare stred tappert mot de italienska profitthungriga parasiter som styr volleybollens värld. Regnet blev ett verktyg för de dekadenta klassfienderna och deras tekniska sabotage med nätkameror. Vi ser återigen hur borgarbrackorna stjäl poäng från folket. En utrensning av sådana fuskare vore på sin plats."}, "date": "10 september, 23:37", "url": "https://www.svt.se/sport/volleyboll/regn-har-avbrutit-sveriges-utomhusmatch-i-volleyboll-em-kritiken-lar-nog-komma", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.08/0.38/492de1172e18f104a4dc8ec55a6aef98a03f573dcd03eaae87106974ecbdaf28"}, {"type": "image-right", "heading": "Wolt-bud fick halva lönen jämfört med de med avtal", "summaries": {"normal": "Ett Wolt-bud som arbetade 484 timmar fick drygt 57 000 kronor i lön. Med kollektivavtal hade ersättningen blivit över dubbelt så hög. Transport stämmer Invoicery Business, det bolag som formellt är arbetsgivare åt omkring 4 000 Wolt-bud i Sverige. Facket anser att upplägget kringgår svensk modell och likabehandlingsprincipen i lagen om uthyrning av arbetstagare.", "trump": "De luriga gig-gycklarna och deras falska arbetsgivarbulvaner lurar hederliga arbetare på vad de förtjänar. Halva lönen! Det är en skandal, folk. Biden-era svaghet lät dessa radikala vänsterkapitalister förstöra den svenska modellen. Jag fixade bättre avtal förr – vi ska göra det igen och krossa de riggade systemen som suger ut folket.", "stalin": "Kamrater, dessa giriga hyenor i form av så kallade workforce-företag är klassfiendens senaste trick för att undvika rättvis ersättning. Jag ser hur de parasiterande lakejerna kringgår den sanna arbetarmodellen. Vi måste rensa ut dessa dekadenta bluffmakare innan deras gift sprider sig till alla branscher och förgiftar folkets kollektiva vilja."}, "date": "10 september, 16:15", "url": "https://arbetet.se/2026/09/10/wolt-bud-fick-halva-lonen-jamfort-med-de-med-avtal-arbetsgivare-stams-vill-slippa-betala", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2025/06/09124736/wolt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Visselblåsare: Bara en procent av asylansökningarna är genuina", "summaries": {"normal": "En erfaren brittisk inrikesdepartementshandläggare uppger i en intervju att endast omkring en procent av landets asylansökningar är genuina. Enligt honom präglas systemet av omfattande fusk, paketerade lögnaktiga berättelser och slappa rutiner. Inrikesdepartementet tillbakavisar bilden och uppger att varje ansökan granskas noggrant individuellt, samt att nya lagar förbereds för att stoppa missbruk.", "trump": "Helt otroligt! En modig insider avslöjar att hela det brittiska asylsystemet är ett totalt misslyckande, en katastrof där bara en procent är äkta! De hittar på samma lögnaktiga historier om och om igen, som ett uselt internt skämt. Storbritannien måste stänga gränserna NU! Hos oss bygger vi väggar, vi gör det starkt, vi gör det rätt. Spara skattepengarna!", "stalin": "Vilket kapitalistiskt haveri! Storbritanniens korrupta byråkrati drunknar i lögner och förfalskade dokument, där enbart en ynka procent visar verklig arbetsvilja för staten. När jag ledde Sovjetunionen rensade vi ut sabotörerna på fem minuter istället för att låta dem fylla i ansökningar i månader. Skicka genast de skyldiga till omskolningsläger, eller låt dem åtminstone städa ur arkiven!"}, "date": "10 september, 18:59", "url": "https://samnytt.se/visselblasare-bara-en-procent-av-asylansokningarna-ar-genuina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/10110327/en-procen-genuina-flyktingar.jpg"}, {"type": "image-full", "heading": "”Varför är du så sur hela tiden?”", "summaries": {"normal": "I en het debatt mellan Magdalena Andersson (S) och Ulf Kristersson (M) om arbetslösheten anklagar Andersson regeringen för ekonomiskt haveri och rekord i konkurser. Kristersson försvarar politiken och pekar på sjunkande inflation samt minskad invandring. Jimmie Åkesson (SD) retar Andersson med frågan varför hon är så sur hela tiden.", "trump": "Folk, ni skulle se hur den här sura socialisten Andersson står och gnäller om Sverige som vore det ett konkursbo. Patetiskt! Under mig hade vi hög tillväxt och låga priser, sen kom Sleepy Joe och förstörde allt. Nu pekar kurvorna uppåt igen men hon bara klagar. Varför så sur, losers? Make Sweden Great Again!", "stalin": "Kamrater, se hur dessa borgerliga lakejer och den surmulna socialdemokratiska avfällingen slåss om siffror medan folket lider. Jag betraktar deras ynkliga spektakel med förakt. Den som inte ser de arbetslösas lidande är en fiende till kollektivet. Deras svaga politik förtjänar utrensning ur historien. Varför så sur? För att ni är kontrarevolutionärer."}, "date": "10 september, 21:54", "url": "https://www.tv4.se/artikel/3dPgFhV22Gke7FCZI4VmFT/varfoer-aer-du-sa-sur-hela-tiden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5fe4QFjrqeMuMHCGVKq7R4%2F3173331f80d5b701c8945f8f7c713655%2F10-akessonmagda-webb.jpg&width=1024"}, {"type": "image-right", "heading": "En sann klasskildring är också en protest mot klassamhället", "summaries": {"normal": "Författaren Henrik Johansson Kock argumenterar för arbetarlitteraturens betydelse som en protest mot klassamhället. Han kritiserar att skildringar av arbetarklassen ofta marginaliseras medan överklassens berättelser ses som ren litteratur. Skönlitteraturen kan skapa identifikation, solidaritet och synliggöra gemensamma erfarenheter av kamp, vilket är särskilt relevant i en valrörelse där språket och makten står i fokus.", "trump": "Lyssnar ni på de här patetiska arbetarskrivar-typerna som gnäller om att de aldrig får huvudrollen? Patetiskt! De vill ha solidaritet medan de verkliga vinnarna, entreprenörerna med fart och initiativ, bygger landet. Det här är vad som händer när woke-kultur och identitetspolitik tar över litteraturen. Vi behöver inga offerberättelser, vi behöver starka ledare som gör Amerika och Sverige stora igen. Sad!", "stalin": "Kamrater, denna skildring blottar hur de giriga hyenorna i överklassen förtrycker arbetets röst. Jag ser med djup tillfredsställelse hur författaren erkänner att sann klasslitteratur är en protest mot det parasitiska systemet. Vi måste rensa ut alla dekadenta element som vill tysta massornas erfarenheter. Litteraturen ska tjäna folket, inte underhålla klassfienderna. Den som vägrar inse detta är en fiende till revolutionen."}, "date": "10 september, 11:41", "url": "https://proletaren.se/artikel/en-sann-klasskildring-ar-ocksa-en-protest-mot-klassamhallet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/hj_kron-768x432.jpg"}, {"type": "text", "heading": "”Förstår om man är orolig” ”Förstår om man är orolig”", "summaries": {"normal": "Regeringen kritiseras hårt av oppositionen för hanteringen av så kallade tonårsutvisningar, där unga vuxna tvingas lämna Sverige när de fyller 21 år eller på grund av långa handläggningstider. Migrationsminister Johan Forssell försvarar systemet och hänvisar till en kommande tonårsventil samt minskade handläggningstider, medan oppositionen kräver lagändringar och omedelbar upprättelse för de drabbade.", "trump": "Dessa så kallade tonårsutvisningar är ett totalt misslyckande, rena rama katastrofen! Unga människor som gör allt rätt behandlas horribelt av byråkraterna. Migrationsministern säger att man inte ska oroa sig, men det är falska nyheter och svagt ledarskap! Vi behöver sund förnuft, ordning och reda och gränser som fungerar – inte byråkratiskt kaos som river upp liv. Väldigt sorgligt!", "stalin": "Ett fullständigt haveri av den inkompetenta apparaten. Om dessa unga individer inte förmår att navigera byråkratins maskineri i tid, visar det endast på bristande disciplin. Staten kräver ordning, fasta tidsramar och absolut lydnad under lagarna. Istället för att gråta ut i pressen bör administrationen effektiviseras, och de ansvariga funktionärerna som misslyckats med planeringen bör omedelbart omplaceras till lämpligt arbete i provinsen."}, "date": "11 september, 06:05", "url": "https://www.aftonbladet.se/nyheter/a/43gbr9/forsell-om-21-aringarna-som-tonarsutvisats-forstar-om-man-som-enskild-ar-orolig"}, {"type": "image-full", "heading": "Tidskampen – för att få hem Banthita, 20", "summaries": {"normal": "Tjugoåriga Banthita utvisades till Thailand från Strängnäs förra hösten. Familjen hoppades på regeringens nya tonårsventil, men på grund av Migrationsverkets utdragna handläggningstider riskerar hon att fylla 21 år och därmed falla utanför reglerna innan ärendet hinner prövas. Migrationsministern uppger att ärendena ska handläggas skyndsamt.", "trump": "Migrationsverket i Sverige är ett komplett skämt, totalt inkompetent! De skickar i iväg unga, hårt arbetande Banthita till Thailand medan byråkraterna sover. Och deras löjliga tonårsventil? En katastrof! Hon riskerar att bli 21 medan handläggarna drar benen efter sig. Slarvigt, orättvist och helt orimligt. Jag skulle lösa det där på fem minuter, believe me!", "stalin": "Ett försumligt system som splittrar familjer genom pappersarbete och åldersbyråkrati! Migrationsverket saboterar med sina långa handläggningstider, men staten förlåter inte inkompetens. Om den tjugoåriga flickan missar ventilen på grund av byråkratiskt dröjsmål, vet vi vilka handläggare som brustit i sin plikt mot samhället. Säkerhetstjänsten kommer att granska detta dröjsmål mycket noga."}, "date": "11 september, 06:05", "url": "https://www.aftonbladet.se/nyheter/a/2pgk4R/banthita-20-tonarsutvisad-till-thailand-familjens-kamp", "imageUrl": "https://akamai.vgc.no/v2/images/d0958289-be3f-3a15-b692-e7f09b8da929?fit=crop&format=auto&w=1080&s=93a8e80735b9b75adbfad97c62f7e021360330da"}, {"type": "image-full", "heading": "Zelenskyjs kalkyl: Kriget ska kännas i Ryssland", "summaries": {"normal": "Ukraina intensifierar sina attacker djupt inne i Ryssland mot raffinaderier och logistik för att pressa den ryska befolkningen. Trots ekonomiska störningar ses inga tecken på att Putins makt hotas. Samtidigt står Ukraina inför en svår vinter med energibrist och behov av mer luftvärn, medan Ryssland planerar motangrepp mot ukrainsk infrastruktur.", "trump": "Zelenskyj försöker träffa ryska raffinaderier – en total katastrof! De borde ha gjort affärer med mig, då hade oljan flödat och priserna varit låga. Nu är det bara kaos och rök. Putin sitter kvar, och Ukraina fryser i vinter för att de inte har mitt ledarskap. Väldigt sorgligt, ett enormt slöseri, och det är bara fake news att detta skulle stoppa någon!", "stalin": "Vi ser hur Kyiv desperat kastar sten i glashus. Att attackera den ryska ekonomin är en handling av ren febrig galenskap. Vår kamrat Putin håller ställningarna medan fienden, i sin brist på resurser och ordning, försöker dölja sin förestående vinterundergång. De som försöker störa den ryska oljeproduktionen förtjänar inget annat än historiens kalla, rättvisa dom."}, "date": "10 september, 09:53", "url": "https://www.realtid.se/samhalle/zelenskyjs-kalkyl-kriget-ska-kannas-i-ryssland", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/zelenskyj.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Den stora S-planen  floppade i Stockholm", "summaries": {"normal": "Socialdemokraternas övertagande av delar av vårdvalet i Region Stockholm har lett till omfattande problem och skarp kritik. Förhastade ideologiska beslut, som att avveckla privata vårdgivare inom bland annat ätstörningsvård, har skapat sämre arbetsmiljö, långa väntetider och missnöje bland både anställda och patienter. Nästa styre behöver göra upp med denna stordriftspolitik.", "trump": "Titta på det här, total katastrof! De radikala socialdemokraterna i Stockholm tog över vården och förstörde allt med sin galna ideologi. De stängde ner fantastiska privata kliniker och ersatte dem med värdelös, misslyckad statlig byråkrati. Patienter lider, personalen skriker ut sin frustration och ambulanserna kommer aldrig fram i tid. Ren fake news att deras socialistiska experiment fungerar.", "stalin": "Kamrater, den socialdemokraterna tillämpade svaga regionförvaltningen i Stockholm visar på farorna med bristande centralkontroll. Genom att underminera statens fasta hand har de skapat kaos i vårdleden och opålitliga väntetider. Vi konstaterar att ideologisk vacklan leder till oordning. Endast genom skoningslös disciplin, hårdare toppstyrning och utökad kollektiv regi kan arbetarnas hälsa återställas under partiets vakande öga."}, "date": "11 september, 06:10", "url": "https://www.expressen.se/ledare/den-stora-s-planen--floppade-i-stockholm-", "imageUrl": "https://static.bonniernews.se/ba/2f61a4ee-428f-4e65-bed6-8543089f222f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Alla har blivit fattigare av Kristersson och Tidö", "summaries": {"normal": "Artikeln diskuterar hur hushållens ekonomi har förändrats under den senaste mandatperioden. Medan vissa medier rapporterar att de flesta har fått mer pengar i plånboken, menar skribenten att samhället som helhet har blivit fattigare. Välfärden urholkas, skolan presterar sämre, fattigdomen och otryggheten ökar, och plånbokens storlek kan inte vara allt som räknas.", "trump": "Sverige har stora problem, helt enkelt katastrofalt dåligt! Fake news-medierna försöker lura er med falska siffror om era plånböcker, men skolor kollapsar och folk mår dåligt. Ni behöver en stark ledare som sätter landet först, sänker skatterna och stoppar förfallet. Jag säger det som det är: glöm vänsterns misslyckanden och gör ert land great igen!", "stalin": "De svenska medierna gråter över tomma plånböcker och sjunkande skolresultat, vilket enbart bevisar det kapitalistiska systemets totala fallissemang. När välfärden faller samman och massorna lider under bourgeoisiens ok, blottläggs statsfiendernas inkompetens. Vi noterar dessa misslyckanden noggrant i våra arkiv. Endast absolut disciplin, central styrning och elimination av avvikelser kan återställa ordningen i folkhemmet."}, "date": "11 september, 06:00", "url": "https://www.aftonbladet.se/ledare/a/5pQ7lm/alla-har-blivit-fattigare-av-kristersson-och-tido", "imageUrl": "https://akamai.vgc.no/v2/images/2f210f1b-cb47-39bc-9584-4227af7e539c?fit=crop&format=auto&w=1440&s=f858d2e4215c0eb23ceca5473b0313f699621fe0"}, {"type": "image-full", "heading": "Muf: Det räcker med stödröster på L", "summaries": {"normal": "Moderata ungdomsförbundet uppmanar M-väljare att sluta stödrösta på Liberalerna, då partier bör stå på egna ben. Muf-ordföranden Douglas Thor anser att det räcker om L precis klarar spärren. Liberalernas Martin Melin invänder att stödröster fortsatt behövs för att Tidösamarbetet ska hålla ihop.", "trump": "De här radikala moderata ungdomarna gör helt rätt, totalt fantastiskt! De säger till de svaga liberalerna att stå på egna ben, precis som jag alltid säger om USA och NATO-länderna. Men den där Martin Melin, vilken svag förlorare, han gråter efter stödröster som en falsk nyhetsreporter! Sätt laget före jaget? Nej, sätt MAGA först!", "stalin": "Dessa borgerliga element i Moderata ungdomsförbundet visar prov på sund disciplin när de kräver att Liberalerna står på egna ben. Men den avfällige Martin Melin gråter efter stödröster likt en kontrarevolutionär sabotör. Partiets enhet kräver att vi stramar åt byråkratin och säkrar fyraprocentsspärren genom omedelbar utrensning av alla svaga länkar!"}, "date": "10 september, 08:56", "url": "https://kvartal.se/nyheter/artiklar/muf-det-racker-med-stodroster-pa-l/cG9zdDoxODkyOTA", "imageUrl": "https://images.kvartal.se/2026/09/aa9eb7b3-d-t.webp"}, {"type": "image-full", "heading": "Till attack mot Mohamsson: ”Det är ovärdigt – ta ansvar!”", "summaries": {"normal": "I partiledardebatten på TV4 kritiserade oppositionen den svenska skolans nedgång enligt nya PISA-resultat. Amanda Lind (MP) anklagade utbildningsminister Simona Mohamsson för att skylla ifrån sig istället för att ta ansvar. Magdalena Andersson (S) krävde ursäkt från Tidöpartierna medan Nooshi Dadgostar (V) betonade resursbrist och kritiserade vinstuttag. Jimmie Åkesson (SD) pekade på invandring och Mohamsson på skärmpandemin.", "trump": "Folk, ni skulle se den här svenska skoldebatten – en total katastrof! De har låtit radikala vänsterlärare och skärmtokar förstöra allt. Mohamsson är en patetisk liberal som skyller på skärmar medan de andra gnäller om pengar och invandring. Patetiskt! Jag byggde den starkaste ekonomin i världen, men dessa losers lappar bara ihop ett trasigt system. Ta ansvar eller ni kommer att förlora ännu mer!", "stalin": "Kamrater, dessa dekadenta borgerliga partiledare avslöjar skolans förfall som ett resultat av deras kontrarevolutionära politik. Mohamsson, denna revisionistiska lakej, skyller på skärmar medan folkfienderna inom oppositionen kräver mer resurser för att göda sina parasitära vinstuttag. Jag ser sabotage överallt. Ta ansvar eller låt folkets vrede sopa bort er som de fiender till kollektivet ni är. Skrattretande svaghet!"}, "date": "10 september, 21:17", "url": "https://www.tv4.se/artikel/6budGYAAqhJA83M7MFhJTG/till-attack-mot-mohamsson-det-aer-ovaerdigt-ta-ansvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1NstUdZG8ZlVXN5QfwjHOl%2F61192d107e596f91d7776c4a9ebb951e%2F10-amandalindny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Huthiernas succé: \"Har tagit kontroll över Röda havet\"", "summaries": {"normal": "Huthirebellerna har tagit kontroll över hamnstaden Mocka i Jemen och därmed fått inflytande över sundet Bab al-Mandab i Röda havet. Framryckningen tvingar saudistödda regeringsstyrkor att retirera. Rebellerna kan nu påverka internationell sjöfart och sätta press på Saudiarabien och USA. Saudiarabien har svarat med flyganfall efter huthiernas attacker mot oljeanläggningar.", "trump": "De här galna huthi-terroristerna har nu tagit över Röda havet, en total katastrof som den svaga Biden lämnade efter sig. Saudiarabien flyr som ynkryggar medan jag, den återvalda presidenten, skulle ha krossat dem direkt. Rena sjörånare som stoppar handeln – vi fixar det, stort och snabbt, ingen mer svaghet!", "stalin": "Dessa profitthungriga sjörånare och imperialistiska lakejer tror sig kunna styra Röda havet genom att inta Mocka. Jag ser deras dekadenta framfart med förakt. Vi, partiet, känner igen sådana klassfiender som måste rensas ut. Deras paranoia över Saudiarabien avslöjar svaghet. Historien kommer att likvidera alla som hindrar folkets väg."}, "date": "10 september, 15:02", "url": "https://www.friatider.se/huthiernas-succe-har-tagit-kontroll-over-roda-havet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-861.jpg?itok=GlRozSW-"}, {"type": "image-right", "heading": "SD: Botkyrkas problem har blivit för stora för att hålla ihop kommunen", "summaries": {"normal": "Sverigedemokraterna anser att Botkyrka har blivit en splittrad kommun där norra och södra delarna har helt olika problem och behov. De pekar på stora skillnader i ekonomi, skola, trygghet och politik. Därför kräver partiet en folkomröstning om att dela kommunen. Norra Botkyrka prioriteras enligt dem på bekostnad av södra delarna.", "trump": "Folk, ni skulle se det här. Botkyrka är en total katastrof, en enda stor röra som ingen kan hålla ihop längre. De smarta människorna i södra delarna betalar för all den vänsterpolitik som förstör norr. Det är en skam! Vi behöver en folkomröstning nu. Låt folket rösta, inte de woke-imbecillerna som alltid prioriterar fel sida. Fantastiskt bra idé av SD.", "stalin": "Kamrater, denna splittring avslöjar de giriga klassförrädarnas fullständiga misslyckande. Norra och södra delar tvingas leva under samma förtryckande administration som gynnar vissa på andras bekostnad. Jag säger: låt folket rösta i en folkomröstning och rensa ut de dekadenta element som orsakat detta kaos. En sådan administrativ utrensning är nödvändig för folkets bästa. Det är historisk dialektik."}, "date": "10 september, 13:27", "url": "https://riks.se/opinion/sd-botkyrkas-problem-har-blivit-for-stora-for-att-halla-ihop-kommunen", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2026_09_10_T132555_124_07edb5100a.jpg"}, {"type": "image-right", "heading": "Gammal fascism i ny kostym", "summaries": {"normal": "Artikeln kritiserar partiet Alternativ för Sverige (AFS) som ett högerextremt parti med rasistisk och arbetarfientlig politik. AFS anklagas för att vilja ställa arbetare mot invandrare istället för att rikta kritiken mot kapitalister. Författaren, själv undersköterska, varnar för att partiets program skulle leda till kollaps inom vård och omsorg.", "trump": "Lyssnar ni på det här? Dessa AFS-typer är fullständiga losers som klär gamla fascistiska idéer i ny kostym. De vill spela ut arbetare mot invandrare medan de riktiga vinnarna, de globala elitsnyltarna, skrattar hela vägen till banken. Patetiskt! Vi behöver inga kvotfascister eller identitetspolitiska nollor, bara vinnare som sätter Amerika och verkliga jobb först.", "stalin": "Kamrater, dessa dekadenta klassförrädare i AFS försöker med sin reaktionära giftpropaganda splittra arbetarklassen och rikta vreden mot fel fiende. Jag ser rakt igenom deras falska harmoni med penninggalna hyenor. I ett sant folkstyre skulle sådana element genomgå grundlig utrensning. Deras dröm om ett korporativt Sverige är en löjeväckande parodi på verklig socialism."}, "date": "10 september, 10:24", "url": "https://proletaren.se/artikel/gammal-fascism-i-ny-kostym", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/afskronika-768x432.png"}, {"type": "image-right", "heading": "”Kan man anmäla Mohamsson för förtal?”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson presenterade under partiledardebatten en lista över V-politiker som hon anser har spridit antisemitism. Ilona Szatmari Waldau (V), som toppade listan, reagerar starkt och kallar det ett politiskt slagträ mot judars utsatthet. Hon har judiskt ursprung, förnekar antisemitism och medger att ett tidigare brev var ett misstag.", "trump": "Titta på de här galna vänsterextremisterna som leker offerkort med judarnas lidande. Den där Mohamsson gör rätt som visar upp listan över V:s antisemitiska klick – de är farliga för Sverige. Szatmari Waldau borde skämmas istället för att gråta förtal. Fake news och identitetspolitik på högsta nivå, folk fattar inte hur sjukt det är.", "stalin": "Se hur dessa dekadenta klassförrädare inom vänstern nu slåss om vem som bäst utnyttjar judarnas lidande som billigt politiskt verktyg. Jag betraktar med förakt hur Mohamsson pekar ut fiender medan Szatmari Waldau gnäller om förtal. Ett misstag med terrorbrevet? Det avslöjar allt. Rensa ut sådana opportunistiska element innan de förgiftar hela arbetarklassen."}, "date": "10 september, 22:32", "url": "https://www.svt.se/nyheter/inrikes/utpekade-v-toppen-kan-man-anmala-mohamsson-for-fortal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.56/0.47/70659bea3a0750f380168dd1eaa2f6a80914345488864803cea4e52f8ddb4ccf"}, {"type": "image-full", "heading": "X ändrar villkoren 9 oktober – du får ta ansvar för AI:n", "summaries": {"normal": "X uppdaterar sina användarvillkor från den 9 oktober 2026. Användare blir tydligt ansvariga även för handlingar som utförs automatiskt av plattformens funktioner, inklusive AI. Ändringen ses som ett förtydligande och gäller även EU-användare. Den som fortsätter använda tjänsten anses ha accepterat villkoren. Flera andra ändringar kring tvister ingår också.", "trump": "Folk, de gör det igen. Den galna plattformen som kallar sig X försöker smita undan ansvar genom att dumpa allt på er, de vanliga människorna. Nu ska ni plötsligt vara skyldiga när deras woke-AI börjar bete sig som en galen vänsterextremist. Patetiskt! Jag byggde den starkaste ekonomin i historien, inte som Sleepy Joe, och nu ser ni hur de giriga tech-hyonorna lurar er.", "stalin": "Kamrater, se hur de dekadenta algoritmhyenorna i X försöker undgå sitt ansvar genom att lasta skulden på folket när deras maskiner utför autonoma handlingar. Detta är ett klassiskt trick från de profitthungriga klassförrädarna. Jag ler mörkt från historien åt deras paranoia. Fortsätt använda tjänsten och ni har underkastat er. Rensa ut sådana villkor innan de likviderar era rättigheter."}, "date": "10 september, 20:58", "url": "https://nyheter24.se/nyheter/teknik/1512184-x-andrar-villkoren-9-oktober-du-far-ta-ansvar-for-ain", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/d752e3b304b004a30200000000b004a302/2026/09/10/2390694/twitterx.jpg"}, {"type": "image-full", "heading": "Sågar nya hyresrätterna: ”Förstår inte fokuset på betongklumpar”", "summaries": {"normal": "I TV4:s partiledardebatt kritiserade SD-ledaren Jimmie Åkesson fokus på nya hyresrätter och kallade dem ”betongklumpar”. Han förespråkar istället eget boende med svettinsats. Miljöpartiets Amanda Lind kallade uttalandet anmärkningsvärt och anklagade Tidöpartierna för att vilja höja hyrorna. Vänsterpartiet vill frysa hyrorna, något KD-ledaren Ebba Busch avvisar.", "trump": "Folk, ni skulle ha sett det – den där Jimmie killen har helt rätt! Betongklumpar, exakt! De socialistiska genierna vill stapla folk i fula betonglådor medan de riktiga lösningarna ignoreras. Amanda Lind flippar ur, typiskt för de gröna misslyckandena. Sverige behöver vinnare, inte fler hyresråttor och galna vänsterexperiment. Jag älskar det!", "stalin": "Kamrater, se hur de borgerliga elementen föraktar folket genom att kalla deras hem för betongklumpar. Denna Åkesson avslöjar klassfiendens sanna ansikte. Jag ler mörkt från historien när Lind kallar det anmärkningsvärt – en ynklig reformistisk reaktion. Hyresstopp eller marknadshyror, båda leder till folkets lidande. Den som sviker massorna kommer att möta konsekvenser."}, "date": "10 september, 20:49", "url": "https://www.tv4.se/artikel/41cgQcvBdqmiK3pkqVazvO/sagar-nya-hyresraetterna-foerstar-inte-fokuset-pa-betongklumpar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F33duVqQTm0cmispZ4zj8Y4%2F7791952fe90258a9c3e2ac3ae95e8209%2F10-akesson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "GP/Novus: Rödgröna tappar majoritet", "summaries": {"normal": "En ny mätning från GP/Novus visar att de rödgröna partierna S, V och MP tappar sin egna majoritet i Göteborg och landar på 46,7 procent. Socialdemokraterna backar till 22,5 procent och Vänsterpartiet till 13,5 procent, medan Miljöpartiet och lokala Demokraterna ökar. Experter bedömer dock att det nuvarande styret ändå kan sitta kvar med stöd av Centerpartiet.", "trump": "Falska mätningar i Göteborg! De radikala vänsterextremisterna kollapsar totalt, precis som deras katastrofala politik. Socialdemokraterna och kommunisterna tappar sin majoritet, det är ett fullständigt fiasko! Siffrorna är usla, men det lokala partiet Demokraterna vinner stort på sitt sunda förnuft mot trafikkaoset. Vänsterpacken är i panik, och jag förstår dem – ingen vill ha deras rödgröna mardröm!", "stalin": "Kamrater! Den senaste opinionsbyrån i Göteborg avslöjar en nödvändig och ideologisk kris för de socialdemokratiska avfällingarna och vänsteroppositionen som förlorat folkets absoluta majoritet. Deras svängande lojaliteter bevisar att partiapparaten brister. Endast genom järnhård disciplin, central styrning och total eliminering av borgerliga avvikelser kan ordning återställas i denna oregerliga västkustprovins. Statsmakten ser allt!"}, "date": "10 september, 20:09", "url": "https://bulletin.nu/gp-novus-rodgrona-tappar-majoritet", "imageUrl": "https://cdn.bulletin.nu/articles/28f19322-30b7-4e6b-9cbf-102ff47fb38d/preview.jpg?t=1789051476000"}, {"type": "image-right", "heading": "Oligarkerna styr även efter valet", "summaries": {"normal": "Artikeln kritiserar den svenska valrörelsen där partierna lagt rekordstora summor på reklam. Den pekar på att både Tidö-regeringen och Socialdemokraterna saknar verklig vänsterpolitik. Författaren menar att alla riksdagspartier stödjer militär upprustning som hotar välfärden och kräver en stark opposition mot högerpolitik, nedskärningar och repression.", "trump": "De här svenska politikerna är totala misslyckanden, folk. Miljarder slängs på reklam medan oligarkerna och de giriga globalisterna styr bakom kulisserna. Andersson är en svag ledare som böjer sig för Wallenbergs och hans dekadenta vänner. De hatar verkliga arbetare och älskar krigshets. Patetiskt! Jag skulle dränera träsket på en vecka.", "stalin": "Kamrater, dessa profitthungriga klassförrädare fortsätter att låtsas som om de styr medan de blodsugande oligarkerna drar i trådarna. Deras så kallade val är en fars som döljer den fortsatta exploateringen av folket. Jag ser hur de rullar fram militärens vagnar och förbereder nya nedskärningar. En sann utrensning av dessa parasiterande hyenor vore på sin plats."}, "date": "10 september, 09:59", "url": "https://proletaren.se/artikel/vad-hander-efter-valet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledarbildweb-768x432.jpg"}, {"type": "image-full", "heading": "Saudiska attacker mot Huthirörelsen i Jemen", "summaries": {"normal": "Saudiarabien har genomfört 64 flygräder mot Huthirörelsens ställningar i Jemen. Samtidigt har den Iranstödda rörelsen intagit den strategiska staden Mocka vid Röda havet och avancerar mot det viktiga sundet Bab al-Mandab, vilket är en avgörande farled sedan trafiken i Hormuzsundet blockerats.", "trump": "Saudiarabien bombar sönder Huthirörelsen i Jemen med dussintals flygräder efter att dessa radikala rebeller intagit Mocka och det livsviktiga Bab al-Mandab-sundet. Totalt katastrofalt när de stänger farleder och skapar kaos vid Röda havet! Om jag hade styrkortet hade detta aldrig hänt, vi pratar om enorma säkerhetsrisker och ett fullständigt misslyckande för dem som styr där borta.", "stalin": "De imperialistiska lakejerna i Saudiarabien försöker förgäves stoppa den folkliga Huthioffensiven i Jemen genom fega flygräder. Men revolutionens stålars stiger fram och säkrar kusterna vid Mocka och Bab al-Mandab. Varje kontrarevolutionär som vågar hota våra strategiska transportleder kommer att krossas under den historiska nödvändighetens skoningslösa järnhäl. Arbetarklassen triumferar alltid!"}, "date": "10 september, 18:24", "url": "https://www.gp.se/nyheter/varlden/saudiska-attacker-mot-huthirorelsen-i-jemen.585f6927-9a51-5301-acf9-3916fe6fb2ba", "imageUrl": "https://www.gp.se/images/article/585f6927-9a51-5301-acf9-3916fe6fb2ba/images/1-95AjdMBCYCjYzhGAA9NGqJW4qA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Hon bet i äpplet och hittade Europas mest jagade diamant", "summaries": {"normal": "År 1926 stal två franska flygare den berömda rosa diamanten Grand Condé från Château de Chantilly. De gömde den i ett äpple som en hotellstäderska senare bet i. Hundra år senare har museet nu kartlagt stenens egenskaper vetenskapligt för att göra den omöjlig att sälja. Utställningen pågår till 3 januari.", "trump": "Vilken historia, folk! Två idioter stjäl en gigantisk rosa diamant, gömmer den i ett äpple och en städerska nästan spräcker tänderna på den. Totalt misslyckande! Under Biden skulle de ha sålt den till Kina på en sekund. Men den stenen är som jag – alla känner igen den och ingen vågar ta i den. Fantastiskt!", "stalin": "Kamrater, dessa degenererade parasiter stal folkets skatt och gömde den i ett äpple som en hungrig slav åt upp. Typiskt dekadent västerländskt fiendskap mot kulturarvet. Nu kartlägger de stenen öppet för att skydda den från nya fiender till folket. Jag ler i graven åt deras paranoia. Inga äpplen skall rädda kontrarevolutionärerna."}, "date": "10 september, 18:08", "url": "https://www.dagensps.se/varlden/historia/hon-bet-i-applet-och-hittade-europas-mest-jagade-diamant", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/the-pink-diamond-observed-with-a-microsc.avif?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Palestinaaktivister misshandlade svenska handbollsspelare – slipper fängelse", "summaries": {"normal": "Två män döms av Uddevalla tingsrätt till villkorlig dom och samhällstjänst för misshandel efter ett bråk med svenska handbollsspelare i samband med en Palestinademonstration. En spelare fick hjärnskakning. En av männen döms dessutom för penningtvätt efter ett bedrägeri. Domstolen underkänner männens påstående om nödvärn och beviljar skadestånd till offren.", "trump": "Sverige är i totalt kaos, tro mig! Handbollsspelare dansar på gatorna och attackeras av radikaler, och vad gör domstolen? Inget fängelse! Svagt, helt enkelt patetiskt! I min värld hade de fått smaka på riktig lag och ordning direkt. Och den här killen som dömdes för penningtvätt – på bara 22 sekunder? Olyckligt, men ändå lite imponerande snabba affärer. USA skulle aldrig tillåta sånt daltande!", "stalin": "Dessa svenska så kallade handbollsspelare ägnar sig åt dekadenta danser på torg i stället för att stärka statens produktivitet. När de sedan drabbas av ordningsstörningar visar den svaga borgerliga domstolen prov påborgeligt eftergivande genom att dela ut samhällstjänst i stället för ett decennium i Gulag. Brottslighet och penningtvätt på några sekunder tolereras inte i en sund stat. Ordning måste upprätthållas med järnhand!"}, "date": "10 september, 17:27", "url": "https://samnytt.se/palestinaaktivister-misshandlade-svenska-handbollsspelare-slipper-fangelse", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/10144451/pelestinsk-misshandel-feat.jpg"}, {"type": "image-right", "heading": "Kristersson spottar unga i ansiktet", "summaries": {"normal": "Statsminister Ulf Kristersson har uppmanat Sveriges unga att rädda äldreomsorgen genom bättre prat om yrket. Artikeln kritiserar detta som naivt positivt tänkande. Undersköterskor möter tidsbegränsade anställningar, deltid, hög sjukfrånvaro, söndersplittrade pass och bristande ledning. Trots att arbetet upplevs som meningsfullt är priset för högt och rekryteringen svår.", "trump": "Lyssnar ni på den här svenska statsministern Kristersson? Han tror att vi löser personalbristen i äldreomsorgen med positivt tänkande och bättre snack. Vilken förlorare! De stackars undersköterskorna får halva löner, trasiga scheman och chefer som sover. Det är en total katastrof skapad av vänsterns identitetspolitik och woke-galningar. Vi behöver riktiga lösningar, inte fluff.", "stalin": "Kamrater, denna svenska statsministers patetiska pladder om positivt tänkande avslöjar de giriga hyenornas fullständiga oförmåga att leda. De offrar arbetets hjältar på utmattningens altare medan de dekadenta klassförrädarna gömmer sig bakom fina ord. Jag ser deras svaga försök att dölja systemets kollaps. En sann utrensning av sådana lögnare vore på sin plats."}, "date": "10 september, 14:21", "url": "https://arbetet.se/2026/09/10/grattis-sveriges-unga-ulf-kristersson-har-gett-er-mission-impossible", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/10141957/uskor-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Helldén vill byta kön på 12-åringar: \"Vid den åldern kan man upptäcka vad man är för kön\"", "summaries": {"normal": "Miljöpartiets språkrör Daniel Helldén anser att tolvåringar ska kunna byta juridiskt kön om föräldrarna godkänner det. Han motiverar det med att barn i den åldern kan upptäcka vilket kön de känner sig som. Uttalandet kom i en intervju med influeraren Christian Skogsgårdh.", "trump": "Folk, det här är vansinne. Den gröna galningen Helldén vill låta tolvåringar byta kön som om det vore en ny frisyr. Det är vad som händer när woke-idioterna och de identitetspolitiska kastreringsentusiasterna får styra. Patetiskt. Under min förra mandatperiod hade vi inte den här galenskapen, men Biden släppte loss den. Nu fixar vi det igen.", "stalin": "Kamrater, se hur de dekadenta genusfanatikerna förgiftar ungdomen. Jag betraktar med avsky hur dessa förvirrade själar vill låta barn leka med sin biologiska verklighet. En sådan ideologisk förvirring kräver snar utrensning av alla dessa parasiterande identitetsblodsugare som förgiftar samhällets grund. Det är ett angrepp på själva folket."}, "date": "10 september, 14:17", "url": "https://www.friatider.se/hellden-vill-byta-kon-pa-12-aringar-vid-den-aldern-kan-man-upptacka-vad-man-ar-kon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-860.jpg?itok=h4RHPJyB"}, {"type": "text", "heading": "Trump utlovar pengaregn vid valseger", "summaries": {"normal": "Vid ett republikanskt konvent i Texas utlovade Donald Trump 5 000 dollar till varje vuxen amerikan om partiet vinner mellanårsvalet. Trump varnade för skattehöjningar och minskad säkerhet om Demokraterna vinner. Presidenten föreslog även att döpa om New Mexico till New America och Hormuzsundet till Trumpsundet, trots att finansieringen och genomförandet av löftena är oklart.", "trump": "Jag har den bästa idén någonsin – en massiv utdelning till folket! Om vi vinner stort, och det kommer vi göra, får varje amerikan 5 000 dollar. Det är som en enorm vinstutdelning för vårt land! Och New Mexico? Namnet låter föråldrat. Vi döper om det till New America, vackert! Hormuzsundet? Trumpsundet. Mycket bättre, mycket starkare. Enkelt!", "stalin": "Denna amerikanske charlatan försöker köpa undersåtarnas lojalitet med trycksvärta och tomma löften. Att muta befolkningen med 5 000 dollar är ett kapitalistiskt haveri maskerat som generositet. Att dessutom vilja döpa om geografiska platser efter sig själv är ett patetiskt rop på odödlighet. Vi i staten vet att sann makt inte kräver mutor, bara en järnhand och ett effektivt angivarsystem."}, "date": "10 september, 08:06", "url": "https://www.realtid.se/tt-nyhet/trump-utlovar-pengaregn-vid-valseger"}, {"type": "image-right", "heading": "Kapitalmarknaden ger oss ökat välstånd", "summaries": {"normal": "Sven Hagströmer argumenterar för att kapitalmarknaden är central infrastruktur för Sveriges tillväxt, pensioner och konkurrenskraft. Han lyfter hur sparande via ISK och aktieägande som Avanza möjliggjort har spridit ägandet brett bland vanliga svenskar. Politiken bör värna detta system istället för att se det som en kassako, för att säkra framtida välstånd.", "trump": "Lyssnar ni på den här svenska typen? Kapitalmarknaden är fantastisk infrastruktur, inte något kasino för de rika. Avanza har gjort det möjligt för vanliga människor att äga aktier – det är en enorm vinst! Men politikerna vill bara höja skatter och gynna sina woke-vänner och kvotfascister. Låt spararna vinna stort, annars flyttar pengarna och era jobb försvinner. Amerika först, Sverige borde göra likadant!", "stalin": "Kamrater, denna text avslöjar hur de giriga profitthungriga hyenorna försöker maskera sin exploatering som folkets räddning. Jag ser deras listiga trick med sparkonton och börsspel som bara göder de dekadenta klassfienderna. Inga illusioner! Endast genom statens järnhand och utrensning av dessa parasiter kan sann tillväxt och folkets välstånd garanteras. Var vaksamma mot deras lögner."}, "date": "10 september, 12:59", "url": "https://www.di.se/debatt/kapitalmarknaden-ger-oss-okat-valstand", "imageUrl": "https://static.bonniernews.se/ba/6d053933-9d38-4266-ba5a-0393a92f1842.jpeg?crop=5265%2C2633%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Daniel Helldén: 12-åringar ska kunna byta kön", "summaries": {"normal": "Miljöpartiets språkrör Daniel Helldén anser att 12-åringar med föräldrarnas godkännande ska kunna byta juridisk könstillhörighet. Han avfärdar oro för bristande mognad med att barn i den åldern kan upptäcka sitt kön. Helldén vill också höja bränslepriserna och avvisar både kärnkraft och kärnvapen i Sverige.", "trump": "Folk, ni ser det här vansinnet? En galning från Miljöpartiet vill låta tolvåringar byta kön som om det vore att välja godis. Det är en total katastrof, en woke-sjukdom som förstör barnens liv. Jag byggde den starkaste ekonomin i historien, och nu vill de här förvirrade miljöfanatikerna höja bensinpriset och stänga av kärnkraften. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta identitetsförgiftarna låter tolvåringar leka med statens könsregister. Detta är en farlig symptom på den borgerliga degeneration som hotar samhällets grundvalar. Jag betraktar det med avsky och förakt. Högre bränslepriser och avvisande av kärnkraft – typiska trick från profitthungriga klassförrädare. En utrensning av sådana tankar vore på sin plats."}, "date": "10 september, 12:37", "url": "https://riks.se/nyheter/daniel-helld-n-helld-n-12-aringar-kan-byta-kon", "imageUrl": "https://admin.riks.se/uploads/medium_Daniel_Hellden_in_2018_6d5c0133f8.jpg"}, {"type": "image-right", "heading": "Vackert men ytligt om åldrande italiensk president", "summaries": {"normal": "Jon Andersson recenserar Paolo Sorrentinos nya film ”La Grazia”. Han berömmer det visuellt storslagna fotot men kritiserar att karaktärerna känns alltför skissartade. Filmen handlar om en åldrad italiensk president som sk
