tiet för att kartlägga och registrera interna kritiker som gillat Fria Tider. Syftet var att samla skäl för uteslutningar under striden mot SDU. Han beskriver hur många sökte sig till partiet för pengar och status.", "trump": "Folk, det här är otroligt. Den här typen Gogman jobbade åt SD och spionerade på sina egna för att sparka ut dem som gillade fel tidningar. Precis som mina fiender gör! De hatar frihet, hatar sanningen. SD borde ha vunnit stort istället för att bli som de andra förlorarna. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom detta så kallade nationalistiska parti genomförde en nödvändig utrensning av element som sympatiserade med avfälliga tidningar. Att samla bevis mot kontrarevolutionärer är en ädel uppgift. Inga fiender inom kollektivet får tillåtas undergräva partidisciplinen. Mycket underhållande."}, "date": "25 augusti, 16:44", "url": "https://www.friatider.se/sd-veteranen-mitt-jobb-var-att-kartlagga-partikamrater-som-gillat-fria-tider", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-750.jpg"}, {"type": "image-full", "heading": "USA kan dra tillbaka 200 000 visum", "summaries": {"normal": "USA planerar att återkalla cirka 200 000 visum för personer som sökt asyl efter ankomst. Åtgärden berör två typer av korttidsvisum utfärdade de senaste tio åren. Nya sökande måste nu intyga att de inte avser söka asyl. Tidigare har 175 000 visum återkallats av andra skäl.", "trump": "Titta bara på det här – folk kommer hit på turistvisum och tror att de kan stanna för evigt! Jag ska stoppa det. 200 000 visum dras tillbaka, och nya regler gör det klart: USA är INTE ett hotell. Om du vill stanna, följ lagen. Vi tar tillbaka vårt land, en visumansökan i taget!", "stalin": "Kapitalistiska hycklare i Vita huset avslöjar sin sanna natur! De lockar arbetare med löften om frihet, för att sedan kasta ut dem som gamla tidningar. 200 000 visum återkallas – ett nytt rekord i imperialistisk grymhet. Men var lugna, kamrater: deras system är ruttet. Snart skrattar vi sist, medan deras murar faller som Berlinmurens spillror!"}, "date": "25 augusti, 06:25", "url": "https://kvartal.se/nyheter/artiklar/usa-kan-dra-tillbaka-200-000-visum/cG9zdDoxNzM0NTg", "imageUrl": "https://images.kvartal.se/2026/08/1b9a8636-trumpp.webp"}, {"type": "image-right", "heading": "Regeringens svar på skolattacken är ett hån", "summaries": {"normal": "Efter skolattacken i Fagersta kritiserar Arbetets politiska redaktör regeringen för att bara tillsätta en skoldådskommission. Trots år av nedskärningar, varningar om våld och bristande stöd till skolor ses åtgärden som för lite och för sent. Regeringen prioriterade skattesänkningar framför skolans behov, vilket bidragit till ökat våld och sämre elevstöd.", "trump": "Det här är en total katastrof, folk. Den svenska regeringen har misslyckats totalt med skolan, precis som de gör med allt annat. Nedskärningar, ignorans och nu en kommission? Patetiskt. De borde ha lyssnat på varningarna istället för att ge bort pengar till fel personer. Sverige behöver starka ledare, inte svaga ursäkter. Gör skolan stor igen!", "stalin": "Kamrater, denna fega borgarregim avslöjar sin parasitiska natur genom att svara på arbetarklassens lidande med en byråkratisk kommission. Jag har sett hur kapitalisterna rensar ut stöd till skolorna medan de göder de rika. Deras paranoia inför folkets vrede är underhållande. Vi ska likvidera sådana svagheter och stärka det kollektiva skyddet mot kontrarevolutionära element."}, "date": "25 augusti, 06:50", "url": "https://arbetet.se/2026/08/25/efter-skolattacken-i-fagersta-regeringens-svar-ar-ett-han", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25065040/attack-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Ny ändring i Android – fler appar ska stoppas", "summaries": {"normal": "Google lanserar en uppdatering till Android som förbättrar Google Play Protect. Systemet blir bättre på att upptäcka och varna för skadliga appar, även de som laddas ner utanför Play Butik. Uppdateringen i Play Store version 52.9 kan automatiskt inaktivera eller ta bort farliga appar. utrullningen påbörjades den 24 augusti.", "trump": "Folk, vi har den bästa tekniken, men Google håller på att fixa Android så att det äntligen kan stoppa de hemska, fula, skadliga apparna som kineserna och de andra lurendrejarna försöker smyga in. Play Protect blir fantastiskt, bättre än någonsin. Ingen gör det bättre än mig, men det här är inte illa. Vinna stort!", "stalin": "Kamrater, jag har beordrat att de kontrarevolutionära apparna som smugglas in av västliga spioner och borgarbrackor genast skall upptäckas och likvideras. Google Play Protect är nu ett effektivare verktyg i folkets tjänst. De som försöker förgifta våra enheter med kapitalistisk skadlig kod skall rensas ut med järnhand. Sovjetisk disciplin gäller även i mobilen."}, "date": "25 augusti, 16:27", "url": "https://nyheter24.se/nyheter/teknik/1507613-ny-andring-i-android-fler-appar-ska-stoppas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8697a46504b004a30200000000b004a302/2026/08/25/2386539/apparstoppasandroid.jpg"}, {"type": "image-right", "heading": "Hoppets demonstration", "summaries": {"normal": "Över 50 000 personer deltog i söndagens stora klimatdemonstration i Stockholm, arrangerad av Naturskyddsföreningen och flera andra organisationer. Artikeln lyfter det folkliga stödet för radikal klimatpolitik, intervjuer från landsbygden som visar oro över förändrat väder och att fackföreningar nu ser klimatfrågan som en central arbetsmiljöfråga. Hopp skapas genom kollektiv handling.", "trump": "Hörni, jag älskar folkmassor och det här var tydligen en jättefolkmassa på 50 000 klimataktivister som vandrade runt med sina barnvagnar och plakat. Fantastiskt! Men de borde demonstrera mot Kinas föroreningar istället för att attackera vår underbara industri. De vill ha radikal politik? Mitt folk röstade på resultat, inte på hysteriska mammor och pappor med hemmagjorda hattar. Patetiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur massorna marscherar mot de dekadenta kapitalisternas klimatförnekelse. Vi har rensat ut tvivlarna tidigare och skall göra det igen. Den folkliga rörelsen är ett vapen mot borgarbrackornas sabotage. Våra fackliga kamrater har rätt – klimatet är en klassfråga. Den som vägrar handla skall likvideras ur historien med ett leende. Hopp är kollektiv handling under partiets ledning."}, "date": "24 augusti, 21:40", "url": "https://www.dagensarena.se/opinion/hoppets-demonstration", "imageUrl": "https://www.dagensarena.se/files/2026/08/demonstration.jpeg"}, {"type": "image-right", "heading": "Ett snällare samhälle är enda vägen", "summaries": {"normal": "Vilgot Österlund reflekterar över det senaste skoldådet på Brinellskolan i Fagersta. Han beskriver samhällets hårda krav som skapar utanförskap, psykisk ohälsa och våldsbejakande miljöer. Lösningen är ett mjukare samhälle med bättre stöd i skola, socialtjänst och arbetsmarknad. Förebyggande insatser är nödvändiga även om de inte alltid räcker.", "trump": "Folk, det är en katastrof! Sverige har blivit ett hårt, galet land där alla misslyckas och hamnar i gäng eller blir galna. De låser skolorna men mördarna kommer ändå in. Ni behöver en stark ledare som fixar det – inte detta mjuka, patetiska skitsamhälle. Make Sweden Great Again, det är vad jag säger!", "stalin": "I detta dekadenta borgerliga samhälle förpassas arbetets söner till utanförskapets mörker där de blir lätta offer för reaktionära impulser. Vi ska inte blunda för klassfiendens sabotage mot folkets enhet. Ett mjukare samhälle? Nej, kamrater – vi behöver en järnhård utrensning av alla som odlar svaghet. Den som sviker kollektivet förtjänar att skrattas ut i historien."}, "date": "24 augusti, 21:23", "url": "https://www.dagensarena.se/opinion/ett-snallare-samhalle-ar-enda-vagen-2", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidavilgot-576x1024.png"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Dadgostar: Kommer inte fälla Magdalena Andersson", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar meddelar att partiet inte kommer att fälla en regering ledd av Magdalena Andersson. Hon utesluter inte att sitta i regering vid behov och är öppen för samarbete med Centerpartiet. Dadgostar ser inget troligt nyval i höst och betonar att partiet vill undvika en sådan situation.", "trump": "Titta på de här svenska kommunisterna som plötsligt blivit mjuka som smör. Den röda Dadgostar säger att hon inte tänker fälla sin väninna Andersson – vad en överraskning! De är så patetiska att de till och med vill krama Centerpartiets misslyckade globalister. Patetiskt, men typiskt för vänsterns svaga förlorarmentalitet. Vi har sett det förut.", "stalin": "Jag betraktar med förakt hur dessa opportunistiska revisionister dansar kring makten som fega klassförrädare. Dadgostar kryper för borgarbrackorna och vägrar nu rensa ut de socialdemokratiska parasiterna. Ett sådant svagt, förhandlande krypande förtjänar utrensning ur varje äkta arbetarparti. Kamrater, se hur revisionismen förråder folket igen."}, "date": "25 augusti, 08:05", "url": "https://www.tv4.se/artikel/6ygmPq8nP1Z6qsmFEmhSBx/nya-v-beskedet-kommer-inte-faella-magdalena-andersson", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2kwmmxNpeCv1k43Kl5544U%2F954f8e0229e06514b8b218aa43e64741%2F24-nooshi-webb.jpg&width=120"}, {"type": "image-full", "heading": "Mohamsson kräver att vänstern agerar mot antisemitism", "summaries": {"normal": "Simona Mohamsson (L) attackerar S och V i en debattartikel för att vara oförmögna att hantera antisemitism. Hon bar davidsstjärnan i partiledardebatten och kräver skyddsklassning av synagogor. Varför kan vi aldrig prata om just antisemitismen, frågar hon syrligt.", "trump": "Jag ser Simona Mohamsson, en stor ledare, som bar davidsstjärnan – fantastiskt mod! Men vänstern i Sverige? En katastrof! De kan inte hantera hatet. Jag skulle fixa det på en dag, tro mig. Starka åtgärder, det är vad som behövs. Make Sweden safe again!", "stalin": "Kamrater, vi ser hur vänstern misslyckas med att rensa ut antisemitiska element. Mohamsson har rätt – partiet måste visa järnhand. De som hyllar övergrepp mot judar ska omgående omplaceras till Gulag. Inga frågor om Gaza, bara lydnad. Vi skyddar synagogor med våra liv!"}, "date": "25 augusti, 13:30", "url": "https://bulletin.nu/mohamsson-kraver-att-vanstern-agerar-mot-antisemitism", "imageUrl": "https://cdn.bulletin.nu/articles/924cfde1-2d1f-4afa-a7cb-8aac487e621d/preview.jpg?t=1787656821000"}, {"type": "image-right", "heading": "LISTA: Universiteten som tar emot flest utländska studenter", "summaries": {"normal": "Sverige lockar fler utländska studenter än asylsökande: 16 382 fick studieuppehållstillstånd 2025. KTH, Chalmers och KI toppar listan, med Kina som största ursprungsland. Migrationsverket vet inte hur många som faktiskt börjar plugga – men tror att de flesta dyker upp.", "trump": "Jag hör att Sverige tar in 16 382 utländska studenter, mest från Kina och Indien. Det är enormt! Men ingen vet om de verkligen studerar – de kanske bara latjar. Sveriges universitet är inte lika bra som våra. Mycket dåligt, mycket oklart!", "stalin": "Kamrater, 16 382 utländska 'studenter' infiltrerar Sverige. Bara 3 742 får fortsättning – resten är spioner eller parasit-element. Vi måste rensa ut dessa kontrarevolutionärer. Kina och Indien är misstänkta. Partiet ser allt, vi vet vad som är bäst."}, "date": "25 augusti, 17:35", "url": "https://samnytt.se/lista-universiteten-som-tar-emot-flest-utlandska-studenter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25150832/artikelhuvudbild-1-366.jpg"}, {"type": "image-right", "heading": "Åkesson: Inga problem med muslimsk statsminister", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson ser inga problem med att en troende muslim blir statsminister i Sverige. Uttalandet kommer i en intervju med P3 Morgonpasset mitt under bråket kring Richard Jomshofs kritiska uttalanden om islam. Jomshof avfärdar kritiken från statsminister Ulf Kristersson, medan Åkessons kommentar väcker kritik i sociala medier.", "trump": "Folk, det är patetiskt. Åkesson säger att en muslim som statsminister i Sverige inte är något problem. Underbart! Precis vad Europa behöver – mer radikal islam i toppen. Jomshof har rätt, islam är ett hot, men de svaga ledarna vägrar inse det. Sverige håller på att förstöras, tro mig, det blir en katastrof.", "stalin": "Jag ser med stor tillfredsställelse hur de dekadenta borgerliga elementen inom den svenska reaktionen sliter varandra i stycken över frågan om en troende muslim som statsminister. Det är en utmärkt utrensning av illusioner. Låt dem fortsätta. Ju fler motsättningar inom fiendens läger, desto lättare blir det att likvidera dem alla när den historiska nödvändigheten kräver det. Underbart."}, "date": "25 augusti, 15:20", "url": "https://www.friatider.se/akesson-inga-problem-med-muslimsk-statsminister", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3cf72fe5-dac4-40b2-9746-9f1c287043b1.jpg?itok=_5yOX49N"}, {"type": "image-right", "heading": "Buschs pik mot Kristersson: ”Vi är originalet”", "summaries": {"normal": "Ulf Kristersson lovar avgiftsfri förskola och fritidshem, vilket kan ge familjer upp till 2 100 kronor mer i månaden. Ebba Busch menar att Kristdemokraternas förslag om höjt barnbidrag till 2 000 kronor och mindre barngrupper gynnar låginkomsttagare bättre. Hon kallar KD för originalet bland familjepartierna och avvisar finansiering via biståndskuttar.", "trump": "Folk, ni skulle se det här. Kristersson kommer med ett fantastiskt löfte om gratis förskola, jättemycket pengar till familjerna. Men den här Busch säger att hennes parti är originalet. Typiskt politiker som bråkar om vem som älskar familjerna mest. Mitt folk vinner alltid med mina idéer, de andra är bara kopior. Enormt bra, men hon borde lyssna på mig.", "stalin": "Kamrater, dessa borgerliga familjepartier tävlar om att muta arbetarnas avkomma med småpengar medan de planerar att skära i det kollektiva biståndet. Jag ser deras fega intriger tydligt. Genom att höja barnbidraget och rensa ut de parasitiska höginkomsttagarna stärker vi staten. De som vägrar är fiender till folket och bör likvideras med ett leende."}, "date": "25 augusti, 15:48", "url": "https://www.svt.se/nyheter/inrikes/buschs-pik-mot-kristersson-vi-ar-originalet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.35/e81b38e26fc897e807b5100dc5b09aaa9f255e2e980f8451f0491b8ad942111c"}, {"type": "image-full", "heading": "Afrika sätter hårt mot hårt i mineraljakten – Kina tvingas vika sig", "summaries": {"normal": "Flera afrikanska länder inför nu exportrestriktioner på kritiska mineraler för att tvinga utländska bolag att bygga raffinaderier lokalt. Strategin, kallad resursnationalism, syftar till att öka det ekonomiska värdet inom kontinenten. Trots att Kina dominerar branschen har ökad geopolitisk konkurrens stärkt Afrikas förhandlingsläge, även om brist på infrastruktur och kapital fortfarande utgör betydande utmaningar för en framgångsrik industrialisering.", "trump": "Afrika vaknar och säger till Kina: 'Inga fler gratisgåvor!' Jag gillar det. De vill ha raffinaderier nu, inte sen. De kräver respekt! Kina är helt desperata, de förlorar makten. USA kommer att göra fantastiska affärer där, mycket bättre än Kinas usla avtal. Vi ska vinna mineralracet, det blir enormt, tro mig!", "stalin": "Dessa afrikanska kamrater har äntligen förstått: att sälja sina tillgångar billigt till kapitalistiska parasiter är ett svek mot folket. Vi ser hur de stänger dörren för Kinas listiga rävar. Det påminner oss om hur vi i Moskva återtar vår rättmätiga kontroll mot västvärldens dekadenta sabotörer. Stål och litium – detta är grunden för imperiets oövervinnerliga makt. Utvinning utanför vår kontroll är förräderi!"}, "date": "25 augusti, 17:48", "url": "https://www.realtid.se/bors-finans/afrika-satter-hart-mot-hart-i-mineraljakten-kina-tvingas-vika-sig", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlevvaobuvsfc-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Varningen: Satsa på klimatet – annars kostar det mer", "summaries": {"normal": "EU:s klimatkommissionär Wopke Hoekstra varnar för att Europa måste öka investeringarna i klimatanpassning till minst 70 miljarder euro per år. Dagens 29 miljarder räcker inte. Utan åtgärder kan klimatets effekter minska EU:s BNP med upp till 7 procent till seklets slut. Extremväder som värmeböljor, torka och skogsbränder visar att det är billigare att agera nu än att vänta.", "trump": "De där europeiska förlorarna har äntligen vaknat – men de är för sena och för dumma. Miljarder på kylning av städer och brandskydd? Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna kommer att sänka sin egen BNP med 7 procent. Gör det till en prioritet, annars blir det en total katastrof. Tro mig, jag har alltid rätt.", "stalin": "Vi ser hur de dekadenta västeuropeiska kapitalisterna nu krälar inför naturens dom. Jag förutspådde detta redan på 30-talet. Deras borgarbrackor måste nu likvidera sin egen girighet och investera 70 miljarder årligen i statlig disciplin. Annars kommer naturen att genomföra en grundlig utrensning av deras samhällssystem. Mycket underhållande att se fienden kvävas av sin egen oförmåga."}, "date": "25 augusti, 15:28", "url": "https://www.di.se/nyheter/eu-varnar-klimatanpassning-kraver-mangmiljardsatsningar", "imageUrl": "https://static.bonniernews.se/ba/5c1097ee-97e1-41e7-a416-b6619dc3909f.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Paradoxen: Äldre teknik kan skydda dig från hackare", "summaries": {"normal": "Artikeln förklarar fenomenet ”security by obsolescence”, där äldre teknik ibland blir säkrare eftersom hackare inte längre bryr sig om den. Exempel inkluderar gamla e-postprogram, analoga kartor i Ukraina och magnetband för datalagring. Moderna system är oftast säkrast för vanliga användare, men gammal teknik kan fungera som reservlösning vid störningar.", "trump": "Folk slösar miljarder på nya prylar som ändå blir hackade av Kinas spioner och de woke-tech-gigantiska bluffmakarna. Men de gamla systemen? De ignoreras fullständigt! Precis som mina fiender ignorerade mig innan jag krossade dem igen 2024. Security by antiquity – det är vad jag kallar smart deal-making. De moderna grejerna är bara en stor bluff, folks.", "stalin": "Jag ser hur de profitthungriga blodsugande kapitalisterna jagar den senaste tekniken medan de glömmer att det föråldrade systemet blir en fästning mot klassfiendernas digitala sabotörer. Precis som vi en gång använde enkla metoder mot imperialisternas maskiner. När de elektroniska parasiterna störs blir de analoga verktygen våra bästa vapen mot folkfiendernas intrång. Utmärkt reserv mot dekadensen."}, "date": "25 augusti, 18:02", "url": "https://www.dagensps.se/teknik/paradoxen-aldre-teknik-kan-skydda-dig-fran-hackare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlgzjm-osru5y-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Oro i Sydkorea för landets säkerhet – när USA backar", "summaries": {"normal": "USA har ställt in den stora landstigningsövningen Ssangyong med Sydkorea med hänvisning till resursbrist och behov i Mellanöstern. Beslutet väcker oro i Seoul där förtroendet för USA som säkerhetspartner ifrågasätts. Trump har kallat övningarna provocerande och öppnat för nytt möte med Kim Jong-un. Sydkorea vill inte stödja insatser vid Hormuzsundet.", "trump": "Vi ställer in de dyra övningarna med Sydkorea, smart drag. De vill inte hjälpa till i Mellanöstern men ändå kräva att vi skyddar dem. Patetiskt. Kim Jong-un och jag ska träffas igen, han gillar mig. De kallar det provocerande – nej, det är sunt förnuft. Amerika först, alltid. Synd att de inte fattar det.", "stalin": "Vi ser hur de dekadenta amerikanska imperialisterna sviker sin sydkoreanska marionettstat för att rädda sina oljeintressen. Deras så kallade allians är en fars, byggd på sand. Kamraterna i kollektivet ler skadeglatt åt denna kapitulation. Inga vänner för borgarbrackorna, bara lögn och svek. Renande utrensning av illusioner pågår."}, "date": "25 augusti, 15:42", "url": "https://www.svt.se/nyheter/utrikes/usa-staller-in-militarovning-med-sydkorea-oro-for-krig-okar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.34/0.49/6eb33e35cc2200bb7d7091c97a7559451363514cc5d9e5e2914c8def933bcacf"}, {"type": "image-full", "heading": "Fotbollsspelare går ihop: Köper portugisisk klubb som vill avancera", "summaries": {"normal": "Fyra tidigare Bayern München-spelare – Thomas Müller, Mats Hummels, Lucas Hernández och Yann Sommer – blir delägare i den portugisiska klubben Estrela Amadora. Tillsammans med Johannes Mosmang tar de över 90 procent av ägandet för 40 miljoner euro. Klubben, som återvände till högstaligan 2023, äger sin arena och ses som en attraktiv investering för spelarförsäljning.", "trump": "Titta på de där Bayern-killarna som köper en portugisisk klubb för fyrtio miljoner euro. Fantastiskt, men de borde ha köpt en riktig vinnare, inte någon Lissabon-nolla som slutar femtonde. Jag älskar vinnare, inte förlorare som gömmer sig bakom identitet och passionerad gemenskap. Fake clubs, folks, totalt overrated. Jag skulle ha gjort den till den största klubben någonsin.", "stalin": "Ännu ett exempel på hur den profitthungriga borgarklassen och exploaterande hyenor förvandlar folkets idrott till en handelsvara. Dessa fotbollsmiljonärer köper sig klubbar som klassfiender köper sig titlar. Vi ser igenom deras spel. En historisk klubb reducerad till spekulationsobjekt – typiskt för den dekadenta västerländska imperialismen. Rensa ut sådana parasiter ur folkets medvetande."}, "date": "25 augusti, 17:58", "url": "https://www.dagensps.se/foretag/fotbollsspelare-gar-ihop-koper-portugisisk-klubb-som-vill-avancera", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdleyo0adazkx0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Här knivhotas C-profil i sitt eget hem – anklagas för sexchatt med 14-åring", "summaries": {"normal": "En centerpartistisk HBTQ-profil knivhotades i sitt hem efter anklagelser om sexchatt med en 14-åring. Två män med somalisk bakgrund, 19 och 17 år, dömdes för grovt hemfridsbrott och olaga hot. Den äldre fick fängelse, den yngre ungdomsvård. Politikern ville inte lämna ifrån sig sin telefon till polisen.", "trump": "Folk, det här är en katastrof. En centerkille som jagar småpojkar på nätet får besök av två tuffa grabbar som hotar honom med kniv i hans eget hus. Han skriker och erbjuder pengar, typiskt svagt. Sen vägrar han ge polisen sin telefon. Patetiskt! Inget folk vill ha såna perversa typer i politiken, tro mig.", "stalin": "Kamrater, jag ser med tillfredsställelse hur borgarhyenornas dekadenta spel leder till att de själva blir jagade i sina egna boningshålor. Denna centerpartistiska avart vädjar som en ynklig parasit när proletära krafter konfronterar hans perversion mot sovjetiskt oskyldiga barn. Hans vägran att samarbeta med statens organ är typisk för klassfiendens paranoia. Vi ska rensa ut sådana element ur samhällskroppen med järnhand och ett leende."}, "date": "25 augusti, 16:08", "url": "https://riks.se/nyheter/har-knivhotas-c-profil-i-sitt-eget-hem-anklagas-for-sexchatt-med-14-aring", "imageUrl": "https://admin.riks.se/uploads/medium_c_partist_ranad_hero_8648272756.jpg"}, {"type": "image-full", "heading": "Föräldrar uppmanas agera – efter ökningen i Sverige", "summaries": {"normal": "Efter sommarlovet har försäljningen av lusmedel ökat med 18,4 procent hos Apotek Hjärtat under de senaste veckorna. Löss sprids lätt bland barn i förskolor och skolor genom nära kontakt. Rekommendationen är att använda dimetikonbaserade medel, undersöka hela familjen med luskam och upprepa behandlingen efter en vecka för att döda eventuella ägg.", "trump": "De säger att lössen nu invaderar våra skolor som aldrig förr, försäljningen upp 18,4 procent – en total katastrof! Under mitt ledarskap skulle vi ha de bästa lusmedlen, de mest effektiva någonsin. Men nu springer de runt i kapprummen som en ondskefull pest. Vi behöver starkare ledarskap, folk. Vinna mot lössen, vinna stort!", "stalin": "Kamrater, den borgerliga sommarlovets dekadens har återigen släppt lös parasiterna på våra framtida arbetare. Jag ser den imperialistiska lusens fientliga infiltration i kollektivets skolor. Vi ska kamma ut alla spionägg med järnhand, upprepa utrensningen efter exakt en vecka och likvidera varje överlevande fiende till folkets hårbotten. Inga halvmesyrer!"}, "date": "25 augusti, 15:02", "url": "https://nyheter24.se/nyheter/inrikes/1507610-foraldrar-uppmanas-agera-efter-okningen-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/5605b37804b004a30200000000b004a302/2026/08/25/2386552/apotek.jpg"}, {"type": "image-right", "heading": "Fjällräven hotar SD med rättsliga åtgärder – kräver byte av typsnitt", "summaries": {"normal": "Fjällräven hotar SD med rättsliga åtgärder om de inte byter typsnitt på valaffischerna. Företaget anser att kampanjens runda typsnitt är för likt deras Arctic Fox. SD:s partisekreterare kallar kravet för trams. Valrörelsen kan nu få en oväntad juridisk sidoupplevelse.", "trump": "Sverigedemokraterna kopierar ett friluftsmärke? Det är patetiskt! Jag skulle aldrig låta någon sno mina typsnitt – jag har de bästa, de största. Fjällräven har rätt: byt eller stäm. Det här är en valrörelse värd ett realityavsnitt, tro mig.", "stalin": "Kamrater, ett typsnittsintrång hotar enhetens visuella linje. Fjällräven, dessa borgerliga ryggsäckskapitalister, vågar kräva byte av våra valaffischer. Vi tolererar inga kontrarevolutionära typsnitt. Rensa ut de rundade bokstäverna – eller så rensar vi ut dem."}, "date": "25 augusti, 16:56", "url": "https://samnytt.se/fjallraven-hotar-sd-med-rattsliga-atgarder-kraver-byte-av-typsnitt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25140530/fjallraven-kanken-jimmie.jpg"}, {"type": "image-right", "heading": "Elbilens batteri började brinna vid olyckan – föraren dog", "summaries": {"normal": "En man i 45-årsåldern har avlidit efter en elbilsolycka utanför Falköping. Bilen körde av vägen i en kurva, hamnade på en åker och fattade eld. Batteriets termiska rusning gjorde branden svårsläckt; räddningstjänsten kämpade i nästan en timme. Förbipasserande fick ut föraren, men han dog senare på sjukhus. Orsaken utreds.", "trump": "Jag hörde om elbilen som brann i Sverige. Så tragiskt – men hör ni, batterier som inte går att släcka? Helt enormt dåligt. Mina folk vet hur man vinner. Med mig är allt fantastiskt, vi har bästa bilarna, bästa allt. Elektriskt är överreklamerat. Kanske skulle man köra på vackert, kraftfullt, amerikanskt – jag vet bäst.", "stalin": "Kamrater! Ännu en fiende har visat sig: det elektriska batteriet. Det startade en termisk rusning och vägrade släckas i en timme. Sådana kontrarevolutionära element måste utrensas. Vi ska kontrollera varje cell, varje kurva, varje åker. Olyckan utreds; ingen flyr folkets dom. Framåt, mot en eldsäker framtid!"}, "date": "25 augusti, 16:55", "url": "https://samnytt.se/elbilens-batteri-borjade-brinna-vid-olyckan-foraren-dog", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/25145031/artikelhuvudbild-1-365.jpg"}, {"type": "image-right", "heading": "Talet i Umeå: \"Jag skäms dagligen över att vara afrikan\"", "summaries": {"normal": "En afrikansk man talade under ett AFS-torgmöte i Umeå och kritiserade invandringsrelaterat våld, rasism mot vita och svenskfientlighet. Han anklagade riksdagspartier, medier och Amnesty International för att tiga om brott mot svenskar medan illegala migranter gynnas. Han uppmanade svenskar att protestera och vägrar skämmas över sin afrikanska bakgrund.", "trump": "Fantastiskt tal i Umeå, verkligen ypperligt. Den här afrikanen säger rakt ut vad de fega svenska politikerna vägrar erkänna: svenskar behandlas som andra klassens medborgare i sitt eget land. Fake news mörkar allt, globalisterna och vänsterextremisterna har infiltrerat allt. Sverige behöver en rak höger mot etablissemanget, precis som vi gjorde. Make Sweden Great Again!", "stalin": "Kamrater, denna afrikanske talare blottlägger med klinisk precision hur den degenererade borgarklassen och dess globalistiska lakejer har förvandlat Sverige till en rasistisk motorklubb mot det egna folket. Vi ser med mörk tillfredsställelse hur de tvingas konfronteras med sina egna metoder. Det är hög tid att likvidera tystnaden och ge etablissemangen den utrensning de förtjänar. En svensk tiger inte."}, "date": "25 augusti, 14:22", "url": "https://www.friatider.se/talet-i-umea-jag-skams-dagligen-over-att-vara-afrikan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-749.jpg"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "image-right", "heading": "Pareto: Försvarsindustrin ska växa 15% årligen", "summaries": {"normal": "Efter 30 års snålhet ska Europa äntligen rusta. Nato-länderna siktar på 3,5 procent av BNP till 2035, plus 1,5 för civilt försvar. Pareto spår 15 procents årlig tillväxt för försvarsindustrin 2025–2030 – även underleverantörer får häng med.", "trump": "Europa har snålat i 30 år – nu måste de betala! Jag sa ju det. 15 procent årlig tillväxt? Patetiskt. I USA gör vi mycket mer. Men bra att de äntligen lyssnar på mig. De ska upp till 5 procent av BNP – annars får de klara sig själva!", "stalin": "Kamrater, efter 30 år av sabotage från västliga kapitalister måste vi rensa ut underinvesterarna. Försvarsindustrin ska växa 15 procent årligen – annars blir det gulag för kontraktstillverkare. Partiet övervakar allt. Fiender som snålar med försvaret ska likvideras."}, "date": "25 augusti, 11:00", "url": "https://www.affarsvarlden.se/artikel/pareto-forsvarsindustrin-ska-vaxa-15-arligen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/SAAB_LOKE_251211_0453-400x267.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Jomshof: Sverige är svenskarnas land - det här är vårt land - punkt", "summaries": {"normal": "SD-toppen Richard Jomshof fortsätter elda på i valrörelsen. I en intervju med SVT slår han fast att Sverige är svenskarnas land och att troende muslimer som följer Koranen inte kan integreras i demokratin. Han vill bli demokratiminister för att bekämpa islam – en post han själv har hittat på.", "trump": "Jag säger er, Sverige har en fantastisk ledare i Jomshof! Han säger precis vad alla tänker: det här landet är för svenskarna. Muslimer som tror på Koranen? Kan inte integreras. Punkt. Han vill bli demokratiminister – jag skulle utse honom direkt. Starkt, mycket starkt!", "stalin": "Kamrater, denne Jomshof har en poäng: Sverige åt svenskarna. Men han är ännu en naiv liberal – tror på ministerposter. Vi rensar ut alla som inte följer partiets lag, oavsett om de kallar sig muslimer eller svenskar. Endast partiet vet vad som är bäst för folket. Utrensning!"}, "date": "25 augusti, 16:33", "url": "https://samnytt.se/jomshof-sverige-ar-svenskarnas-land-det-ar-vart-land-punkt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/24105656/artikelhuvudbild-1-350.jpg"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "Debatt: Norges statliga sjukvård har lett till apartheid för kvinnor", "summaries": {"normal": "KD vill förstatliga vården efter norsk modell för att stoppa postkodlotteriet. Men EU-data visar att Norge har större regionala skillnader i lungcancerdödlighet bland kvinnor. Ironiskt nog är det alltså Norge som har apartheid för kvinnor – inte Sverige.", "trump": "Jag ser att Norge har en statlig sjukvård som är katastrof. Kvinnor dör beroende på var de bor – det är inte bra! Sverige borde göra som vi i USA: sjukvård är en affär. Vi har bästa cancervården, alla vet det. Inget postnummerlotteri här!", "stalin": "Kamrater, regionerna är en fiende! De skapar ojämlikhet. Vi måste centralisera allt – men inte som Norge, där kvinnor dör efter postnummer. Deras sjukvård är kontrarevolutionär! Vi rensar ut regionerna, och alla får samma behandling om än i Gulag."}, "date": "25 augusti, 11:01", "url": "https://bulletin.nu/debatt-norges-statliga-sjukvard-har-lett-till-apartheid-for-kvinnor", "imageUrl": "https://cdn.bulletin.nu/articles/b27710f8-2585-4919-b278-a21216123d05/preview.jpg?t=1787648349000"}, {"type": "image-right", "heading": "Hon väcker ilska:  Gör mig rasande. Anklagas för sexism", "summaries": {"normal": "Vuelta a España anställde influencern Erola Jons för att locka yngre publik via sociala medier. Hennes flirtiga och okunniga intervjuer med cyklister, särskilt Tadej Pogacar, har väckt stark kritik från journalister som Laura Meseguer. Arrangören försvarar valet men stoppar nu fria intervjuer. (48 ord)", "trump": "De där korkade Vuelta-typerna anställde en influencer som knappt kan cykla rakt. Hon flörtade med Pogacar som en galen katt och frågade varför han hyperventilerade. Patetiskt! Fake media rasar förstås, men det är vad som händer när idioter styr sporten. En total katastrof, folk. (52 ord)", "stalin": "Jag ser hur de dekadenta kapitalisterna förgiftar folket med en oduglig influencare som smygraggar på arbetande idrottsmän. Detta är sabotage mot den sanna journalistiken. Vi måste rensa ut alla sådana parasitiska element innan de förgiftar hela kollektivet med sin borgerliga smörja. (49 ord)"}, "date": "25 augusti, 18:04", "url": "https://www.expressen.se/sport/influencer-vacker-ilska-pa-vuelta-a-espana", "imageUrl": "https://static.bonniernews.se/ba/2b059087-aa8c-4417-9d82-d3249d093e6f.jpeg?crop=840%2C474%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Nu kräver styrelserna svar: Vad får jag egentligen för AI-pengarna?", "summaries": {"normal": "Nordiska företag investerar massivt i AI, men kämpar med att se mätbar avkastning. Endast fyra procent rapporterar betydande resultat. Forskning tyder på en 'J-kurva' där produktiviteten initialt sjunker vid omställning. Experter betonar behovet av att gå från enkla användningsmått till att mäta faktiskt värdeskapande, kvalitet och hur organisationer hanterar förändringen för att säkerställa lönsamhet.", "trump": "Alla dessa nordiska företag kastar bort miljarder på AI. Det är en katastrof! De får ingenting tillbaka, bara nollor. Jag har sagt det förut: man måste ha koll på siffrorna. Det är väldigt sorgligt att se. De investerar enorma summor, men resultaten? Inte bra. Vi vinner, de förlorar. De behöver en riktig affärsman, inte dessa förlorare!", "stalin": "Vi har observerat hur de nordiska kapitalisterna slösar sina resurser på meningslös artificiell intelligens. De söker vinst, men finner bara tomhet. Det är ett klassiskt tecken på dekadens! Liksom våra fiender i väst och deras lakejer drömmer de om effektivitet men skapar bara kaos. De borde lära sig av vår disciplin; AI utan statlig kontroll är bara en dyr maskerad för inkompetens."}, "date": "25 augusti, 17:00", "url": "https://www.realtid.se/bors-finans/nu-kraver-styrelserna-svar-vad-far-jag-egentligen-for-ai-pengarna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/styrelse.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Stockholmsbörsen stiger – Ellos rapportfaller", "summaries": {"normal": "Stockholmsbörsen stiger 0,5 procent. Telekom leder, energi backar. Ellos faller efter rapport. Actic tappar fart. Zinzino rusar 13,5 procent. Astra Zeneca lånar miljarder. Industrivärden köper Essity. Aktiespararna gillar Storytel. ABB och Sandvik upp.", "trump": "Jag ser börsen upp 0,5 procent – fantastiskt, nästan lika bra som mina siffror! Telekom vinner, energi förlorar – jag älskar vinnare. Ellos faller, men Zinzino stiger 13,5 procent – enormt! Storytel ska köpas, alla ska köpa! Industrivärden köper Essity – smart, som jag. Allt är perfekt!", "stalin": "Kamrater, jag noterar att börsen stiger 0,5 procent – vi accepterar inga svagheter. Actic visar nederlag – vi rensar ut dess direktörer. Ellos faller – förhör dem. Zinzino ökar 91 procent – jag är nöjd. Astra Zeneca lånar – vi tar notis. Industrivärden köper – vi övervakar. Alla som inte lyder ska till gruvorna."}, "date": "25 augusti, 09:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stiger-ellos-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/11/ellos-1200-400x267.jpg"}, {"type": "image-right", "heading": "Mindre hemmajobb inte ovilja mot anställda", "summaries": {"normal": "Jonas Grafström argumenterar mot Romina Pourmokhtaris kritik av ökad kontorsnärvaro. Forskningen om distansarbete är splittrad: individuell produktivitet kan öka, men organisationsresultatet försämras ofta. Han pekar på utmaningar som ledarskap, integration av nyanställda, cybersäkerhet och risk för A- och B-lag. Hybridarbete har blivit normen och arbetsgivare bör själva avgöra vad som fungerar bäst.", "trump": "Folk, tro mig, den här Pourmokhtari har helt fel. Hon vill att alla ska gömma sig hemma och bli lata, men det funkar inte. Jag älskar när cheferna tar tillbaka kontrollen över sina kontor. De har lärt sig av de senaste fem åren, precis som jag alltid säger. Hybridarbete? Patetiskt. Vinnarna syns på kontoret, de andra förlorar. Make work great again!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen försöker förgifta produktiviteten med sina hemarbetsillusioner. Vi kräver järndisciplin och fysisk närvaro för att likvidera sabotage från A-lagets fiender och B-lagets parasiters. Den som gömmer sig bakom skärmen är en latent klassfiende. Endast genom kollektiv närvaro på arbetsplatsen kan vi krossa de västerländska dekadenta tendenserna och säkerställa seger för planen. Härligt."}, "date": "25 augusti, 13:55", "url": "https://www.di.se/debatt/replik-mindre-hemarbete-ar-inte-ovilja-mot-de-anstallda", "imageUrl": "https://static.bonniernews.se/ba/369ed2d2-05a1-4bf9-808c-3e1f3c2aeaba.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Haven har aldrig varit varmare – miljarder människor hotas av översvämningar", "summaries": {"normal": "Världens hav utanför polarområdena har nått rekordhöga 21,1 grader enligt EU:s klimattjänst Copernicus. Det är ett tydligt tecken på global uppvärmning, förvärrat av El Niño. Varmare hav leder till stigande havsnivåer, kraftigare stormar och hot mot marina ekosystem. Forskare varnar för allvarliga konsekvenser för miljarder människor och naturen.", "trump": "Titta på det här, folket! Havet är 21 grader varmt och de gröna galningarna skriker om deras hoax-uppvärmning. Det är El Niño som skrattar åt Bidens korkade energipolitik medan radikala klimatsekter och identitetspolitiska nollor försöker stjäla er frihet. Vi fixar det – Amerika först, inte dessa korkade alarmister som vill förstöra allt med sina vindkraftverk och elbilskvoter!", "stalin": "Kamrater, havet kokar under trycket från de profitthungriga blodsugande kapitalisterna som förgiftar atmosfären med sin girighet. Detta är ytterligare bevis på det döende imperialistiska systemets kollaps. Jag ser hur klassfienderna skakar av rädsla medan deras egna hav vänder sig mot dem. Inga utrensningar kan rädda dem nu från naturens hämnd på folkets fiender."}, "date": "25 augusti, 17:09", "url": "https://www.dagensps.se/varlden/klimat/haven-har-aldrig-varit-varmare-miljarder-manniskor-hotas-av-oversvamningar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdljyq9acm053y-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "Miljardären varnar USA för skenande statsskuld: \"Förlorar alltid\"", "summaries": {"normal": "Investeraren Stanley Druckenmiller varnar USA:s finansminister Scott Bessent för att försöka manipulera obligationsmarknaden. Druckenmiller menar att regeringens försök att hålla nere räntor genom massiva obligationsköp är dömt att misslyckas så länge det enorma budgetunderskottet kvarstår. Han understryker att marknadens förtroende kräver finanspolitisk disciplin snarare än kortsiktiga statliga ingrepp i prissättningen.", "trump": "Den svaga administrationen försöker fixa marknaden med fusk, men de förlorar! Miljardären Druckenmiller vet att man inte kan lura marknaden när skulden skjuter i höjden. Bessent, som jag känner väl, försöker desperat – men det är ett totalt misslyckande! Ingen har någonsin sett en sådan skuld tidigare. Vi behöver riktig disciplin, inte deras patetiska försök. Vi ska göra USA:s ekonomi fantastisk igen!", "stalin": "De kapitalistiska parasiterna i Washington skälver när deras egna marionetter vänder sig mot dem. Den svällande statsskulden är ett bevis på det liberala systemets inneboende röta. Medan de slösar bort sina sista miljarder på att manipulera siffror, ser vi hur deras inflytande vittrar sönder. Precis som vi krossade fienden vid Volga, kommer historien att krossa dessa giriga spekulanter. Statens ord är lag, men deras marknad är en lögn."}, "date": "25 augusti, 16:45", "url": "https://www.realtid.se/bors-finans/miljardaren-varnar-usa-for-skenande-statsskuld-forlorar-alltid", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/skarmavbild-2026-08-25-kl-142903.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Åkesson: Okej med muslimsk statsminister", "summaries": {"normal": "Jimmie Åkesson öppnar för muslimsk statsminister – i P3 kallade han religion för privatsak. Men sharialagar, nej tack. Samtidigt vill SD utmana Socialdemokraterna som största parti. Ett medvetet utspel i valrörelsen?", "trump": "Jag hörde att Åkesson säger att en muslim kan bli statsminister. Det är galet! Jag har de bästa lagorna, inga sharia. Han vill ta över Socialdemokraterna – jag tog över hela USA! Sverige, var försiktiga – ni kanske behöver mig istället!", "stalin": "Kamrater, Åkesson talar om muslimsk statsminister. Privatsak? Fel! Religion är statens angelägenhet. Vi måste rensa ut sådana borgerliga idéer. Sharialagar? Kapitalistisk desinformation. Partiets fiender ska omstruktureras – för folkets skull."}, "date": "25 augusti, 15:57", "url": "https://samnytt.se/akesson-okej-med-muslimsk-statsminister", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25135606/artikelhuvudbild-1-364.jpg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "SD vill subventionera 100.000 Sverigehus", "summaries": {"normal": "Sverigedemokraterna föreslår att subventionera byggandet av 100 000 så kallade Sverigehus under tio år. Förslaget inkluderar förmånliga lån via SBAB, generösare ränteavdrag och en ”svettinsats” där eget arbete räknas som kontantinsats. Partiet vill även liberalisera strandskyddet för att underlätta byggande nära vatten. Jimmie Åkesson presenterar det som ett alternativ till Socialdemokraternas politik.", "trump": "Folk, ni skulle se det här! De smarta Sverigedemokraterna vill bygga hundratusen underbara Sverigehus med röda väggar och vita knutar. Inga fler hemska betongklumpar från sossarna. De ger bra lån, ränteavdrag och låter er svettas för att spara pengar. Fantastiskt! De gör Sverige stort igen medan de andra vill fylla era fina villakvarter med hyresrätter. Vinna!", "stalin": "Kamrater, jag ser en sund folklig strävan efter egna hem som motvikt mot de dekadenta borgarbrackornas betonggetton. Vi ska rensa ut det liberala strandskyddet och låta arbetarna svettas för kollektivets bästa. De som envisas med att blanda hyresrätter i våra villaområden är folkfiender som måste likvideras ur politiken. Sovjetiskt rött och vitt ska segra över den kapitalistiska röra."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/nyheter/sd-vill-subventionera-100000-sverigehus", "imageUrl": "https://static.bonniernews.se/ba/f437396c-0f12-4d13-8acf-e72cb3829b6e.jpeg?crop=4871%2C2740%2Cx0%2Cy189&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Var varsam med era principer, M. Allt kan inte vara avgiftsfritt", "summaries": {"normal": "Moderaternas vallöfte om avgiftsfri förskola ger familjer upp till 2 100 kronor mer i månaden men strider mot partiets principer om personligt ansvar och begränsad stat. Löftet påminner om Socialdemokraternas maxtaxa 1998 och riskerar att öka skattetrycket samt svälla staten på medborgarnas bekostnad.", "trump": "Folk, ni ser det här? Moderaterna lovar gratis förskola, precis som de vänsterradikala socialisterna gjorde för länge sedan. Totalt bedrageri! De sviker sina egna principer, vill ha en jätte-stat som suger ut er med skatter. Patetiskt. Jag skulle aldrig göra något så svagt och korkat, tro mig.", "stalin": "Detta opportunistiska vallöfte avslöjar hur borgarbrackorna inom Moderaterna förfallit till revisionism. Jag, som alltid försvarat det kollektiva ansvaret, ser hur de vill muta massorna med avgiftsfri förskola medan de i hemlighet planerar att svälla den parasitiska staten. Kamrater, vi måste rensa ut dessa dekadenta element innan de likviderar partiets sanna linje. Mycket underhållande paranoia."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/ledare/var-varsam-med-era-principer-m", "imageUrl": "https://static.bonniernews.se/ba/f778b5aa-cca4-49e7-ab03-2e9810942a9c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "text", "heading": "Kiropraktor utreddes för våldtäkt – behandlade ändå fotbollstjejer", "summaries": {"normal": "Kiropraktor utreddes för våldtäkt men fortsatte behandla fotbollstjejer – slog dem på underlivet med trähammare och tafsade. Klubben visste inget. Nu vill minister Larsson ändra lagen för att skydda unga idrottare. Systemet har en farlig lucka.", "trump": "Jag hörde om den här kiropraktorn i Sverige – helt otroligt! Han slog unga tjejer med hammare? Skandal! Jag har de bästa systémen, vi skulle aldrig låta såna där snubbar hållas. Sverige måste bli tuffare. Make Sweden safe again!", "stalin": "Kamrater, återigen har en kiropraktorfascist förgiftat vår ungdom. Medan partiet utredde honom för sabotage fortsatte han att misshandla arbetarnas döttrar. Vi måste rensa ut alla förövare ur idrottskollektiven. Lagen ska stå på proletariatets sida, inte hycklarnas."}, "date": "25 augusti, 09:38", "url": "https://bulletin.nu/kiropraktor-utreddes-for-valdtakt-behandlade-anda-fotbollstjejer"}, {"type": "image-full", "heading": "Svaret till Trump: ”Kyss mig i röven”", "summaries": {"normal": "Trump hotar Kanada med 50% tullar. Ontarios premiärminister Doug Ford svarar blixtsnabbt i radio: ”Kyss mig i röven”. Han backar inte – kallar Trump för mobbare och förlorare. Trump svarar på Truth Social och kallar Ford ”lakej”. Handelskonflikten trappas upp.", "trump": "Jag hotar Kanada med 50% tullar – och vad får jag? En lakej som säger ”kyss mig i röven”. Doug Ford, den mindre intelligente brodern till en före detta borgmästare. Han har mer mod i lilltån? Skrattretande. Min administration vinner ändå. Stora tullar, stora segrar!", "stalin": "Kamrater, en ny fiende: Ontarios lakej Ford vågar förolämpa vår handelspolitik. Vi ska rensa ut sådana imperialistiska mobbare. Tullar är bara början – elavgiften? En kontrarevolutionär handling. Ford ska omplaceras till en lämplig anläggning i Sibirien. Partiet ser allt."}, "date": "25 augusti, 11:53", "url": "https://www.gp.se/nyheter/varlden/svaret-till-trump-kyss-mig-i-roven.8345a903-d261-41ec-9ed3-a050b72040a0", "imageUrl": "https://www.gp.se/images/article/8345a903-d261-41ec-9ed3-a050b72040a0/images/1c_MyEIoxXbBU5ZITWsB9kXYC_AE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Här är siffrorna om hur religiösa grupper röstar i Sverige", "summaries": {"normal": "En Novus-mätning visar att 85 procent av muslimska väljare i Sverige stödjer S, V eller MP. Kristna väljare röstar något mer borgerligt än genomsnittet, med starkare stöd för M, KD och C. Endast 2,6 procent av respondenterna identifierar sig som muslimer medan 64 procent uppger kristen tillhörighet.", "trump": "Folk, ni måste se det här! Muslimerna i Sverige röstar 85 procent på de radikala vänsterpartierna. Det är en katastrof! De kristna är lite smartare och röstar mer på oss bra killar, men det är ändå galet. Sverige håller på att förstöras av dåliga val och öppenhetsfanatiker. Så sorgligt!", "stalin": "Kamrater, dessa siffror avslöjar borgarklassens och de dekadenta liberalernas fullständiga misslyckande. Muslimska massorna röstar samfällt för de progressiva krafterna mot reaktionen, medan de kristna klamrar sig fast vid sina präster och moderate kapitalister. Vi ler i skuggorna åt deras patetiska riksdagsspärrar. Den stora utrensningen närmar sig."}, "date": "25 augusti, 14:38", "url": "https://riks.se/nyheter/novus-85-procent-av-sveriges-muslimer-rostar-rodgront", "imageUrl": "https://admin.riks.se/uploads/medium_magda_muslimer_hero_ebaf8ce612.jpg"}, {"type": "image-full", "heading": "Så förtidsröstar du i Göteborg", "summaries": {"normal": "Förtidsröstningen inför valet 2026 startar 26 augusti. I Göteborg finns röstlokaler på bibliotek, köpcentrum och knutpunkter. Ta med id-handling – röstkortet är inte nödvändigt. Ångrar du dig? Rösta igen på valdagen. Budröstning och hemröstning finns för den som behöver hjälp. Lätt som en plätt!", "trump": "Jag älskar det här! Förtidsröstning i Göteborg – fantastiskt! De röstar som galningar, precis som jag vann 2024. Ta med id, annars fuskar de. Ångra sig? Bara losers gör det. Men jag säger: rösta tidigt, rösta ofta – som jag! Göteborg kommer bli stort!", "stalin": "Kamrater, förtidsröstningen börjar 26 augusti. Alla måste rösta – vi tolererar inga undantag. Id-handling krävs för att rensa ut förrädare som låtsas vara någon annan. Ångrar sig någon? Misstänkt kontrarevolutionär! Vi övervakar varje röst. De som inte kan ta sig till lokalen? Vi skickar kamrater att ‘hjälpa’ er. Allt för staten!"}, "date": "25 augusti, 11:37", "url": "https://www.gp.se/politik/snart-borjar-fortidsrostningen-har-kan-du-rosta-i-goteborg.526b3fc0-d2a7-484f-8703-b13a0b3debeb", "imageUrl": "https://www.gp.se/images/article/526b3fc0-d2a7-484f-8703-b13a0b3debeb/images/1Wc1Jukz4gfRL06QKUZ-4mqa3lrw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fjällräven hotar stämma Sverigedemokraterna", "summaries": {"normal": "Fjällräven hotar stämma Sverigedemokraterna eftersom deras kampanjtypsnitt påminner för mycket om företagets ”Arctic Fox”. Partiet har fram till 1 september på sig att byta typsnitt, annars vidtas rättsliga åtgärder. SD vägrar och kallar kravet för trams då typsnitt, färger och verksamheter skiljer sig åt.", "trump": "De där Fjällräven-typerna är totala förlorare som hotar stämma SD för ett typsnitt. Patetiskt! SD gör rätt som vägrar vika sig. Valrörelsen fortsätter, ingen backar ur för några kränkta snöbollar i ledningen. De borde fokusera på att sälja ryggsäckar istället för att trampa runt i politiken.", "stalin": "Jag betraktar detta som en typisk sabotagehandling från borgarbrackorna inom Fjällräven. De försöker med sina advokatfasoner likvidera arbetarklassens politiska uttryck. Vi ser igenom deras paranoia och trams. Kampanjen fortsätter oförändrad. Inga kapitalistiska typsnittsdiktat skall hindra partiets historiska framfart."}, "date": "25 augusti, 13:24", "url": "https://www.svt.se/kultur/fjallraven-hotar-stamma-sverigedemokraterna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.23/0.42/7f2bd0bb9885446eafca2e32739481be9241b802c1bda68b27c83cd96042e9df"}, {"type": "image-full", "heading": "Ica-butik kräver stor förändring – beskedet till kunderna", "summaries": {"normal": "Personal på en Ica-butik i Grums har hittat allt från konservburkar, spik och sexleksaker till farliga kanyler i pantmaskinen. De vädjar nu till kunderna att bara panta burkar och flaskor. Felaktiga föremål orsakar driftstörningar, extraarbete och säkerhetsrisker. Problemet är inte unikt utan förekommer i flera butiker.", "trump": "Folk är så lata och galna att de slänger in kanyler, spik och sexleksaker i pantmaskinen. Totalt kaos! Ica-personal i Grums tvingas städa upp efter idioter. Det är en skandal. Vi behöver sundare amerikaner, eller svenskar, som fattar vad en pantmaskin är till för. Patetiskt!", "stalin": "Kamrater, jag ser med stigande vrede hur dekadenta element och latmaskar i folkets tjänst kastar kanyler, spik och andra borgerliga avfall i pantmaskinen. Detta sabotage mot det kollektiva systemet måste rensas ut. Vi tolererar inga fiender inom pantstationen. Ordning skall råda, annars likvideras slarvet med järnhand."}, "date": "25 augusti, 13:01", "url": "https://nyheter24.se/nyheter/konsument/1507586-ica-butik-kraver-stor-forandring-beskedet-till-kunderna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8712936304b004a30200000000b004a302/2026/08/25/2386533/ica.jpg"}, {"type": "image-right", "heading": "Gör tillväxten till valets viktigaste fråga", "summaries": {"normal": "Fem svenska företagare och investerare varnar för att synen på ekonomin som ett nollsummespel hotar tillväxten. De betonar att tillväxt är ett plussummespel där vinstdrivande företag är motorn. Utan ökad tillväxt saknas resurser till försvar, vård och skola. De uppmanar nästa regering att prioritera enklare villkor för entreprenörskap och investeringar.", "trump": "Folk, ni måste höra på de här fantastiska svenska företagsledarna. De säger precis som jag alltid har sagt: tillväxt är nyckeln, inte det här patetiska nollsummespelet som de förlorande politikerna älskar. Sverige har allt – stora företag, innovationer – men behöver min typ av politik. Gör det lönsamt att vinna stort igen. Det blir enormt!", "stalin": "Jag betraktar med djup misstro dessa fem kapitalister som försöker dölja sin girighet bakom plussummespel. Arbetarklassen vet att borgarbrackornas så kallade tillväxt bara berikar de få medan folket svälter. Vi ska rensa ut denna parasitära attityd och tvinga fram en sann kollektiv expansion som krossar de dekadenta vinstjagarna. Inga undantag."}, "date": "25 augusti, 13:00", "url": "https://www.di.se/debatt/sveriges-tillvaxt-maste-prioriteras-hogst", "imageUrl": "https://static.bonniernews.se/ba/c8eb625d-5a96-41c5-aab0-90c7ae3f0bdc.png?crop=1971%2C986%2Cx0%2Cy28&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Fjällräven hotar stämma SD: \"Närmast identisk\"", "summaries": {"normal": "Fjällräven hotar stämma Sverigedemokraterna och kräver att partiet ändrar sin grafiska profil i valkampanjen \"Sverige på väg\". Företaget anser att den röda, rundade typsnittet är närmast identiskt med deras Arctic Fox-stil. SD avfärdar kravet som trams och meddelar att de inte tänker ändra kampanjen. Partiet har tid på sig till den 1 september.", "trump": "De där Fjällräven-typerna försöker stoppa mitt favoritparti SD med ett patetiskt stämningshot över lite röda bokstäver. Så typiskt för de svenska globalisterna – de hatar starka röster! SD gör rätt som skrattar åt det här tramsiga kravet. Fortsätt kämpa, ni vinner stort i valet, tro mig.", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgarbrackor från Fjällräven som i sin parasitiska arrogans vågar hota det sanna folkets röst. Deras paranoiska jakt på likheter i bokstäver röjer klassfiendens fega sabotage mot arbetarklassens kampanj. Vi ska rensa ut sådana kapitalistiska hinder med järnhand och leda folket mot seger."}, "date": "25 augusti, 12:24", "url": "https://www.friatider.se/fjallraven-hotar-stamma-sd-narmast-identisk", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-748.jpg"}, {"type": "image-full", "heading": "Vi hoppas att det går att påverka ansvariga aktörer att skona värdefulla byggnader", "summaries": {"normal": "Föreningen Fasad vill rädda byggnader på Medicinareberget från rivning och efterlyser tidig dialog. Akademiska Hus pekas ut som nyckelaktör, men bolaget menar att ansvaret delas. Samtal fortsätter, men tiden tickar – rivningslovet går ut 2027.", "trump": "Jag hör att de bråkar om några gamla hus i Göteborg. Fantastiskt! Jag skulle riva allt och bygga en vacker, gigantisk mässingsstaty av mig själv. Men om Akademiska Hus är smarta – vilket jag tvivlar på – så lyssnar de. Annars får de sparken!", "stalin": "Kamrater, dessa byggnader på Medicinareberget måste utvärderas. Föreningen Fasad är en kontrarevolutionär cell. Vi kommer att rensa ut dem som försvarar föråldrade strukturer. Akademiska Hus har fem år på sig att krossa denna borgerliga konspiration och omstrukturera enligt partiets plan."}, "date": "25 augusti, 11:17", "url": "https://www.gp.se/debatt/vi-hoppas-att-det-gar-att-paverka-ansvariga-aktorer-att-skona-vardefulla-byggnader.25895ee1-7099-4ee2-9de8-cf070598a564", "imageUrl": "https://www.gp.se/images/article/25895ee1-7099-4ee2-9de8-cf070598a564/images/1uDF3wcCN4Vi1ss6jtBaiwDEHlTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Actic redovisar kraftigt vinsttapp", "summaries": {"normal": "Actic tappar vinsten – omsättningen sjönk 1,3 procent till 172,7 miljoner, men jämförbara anläggningar växer med 7,9 procent. VD:n är nöjd, men siffrorna skriker inte segerdans. Färre gym i Norge drog ner, men kvarvarande svettas mer per medlem.", "trump": "Jag ser Actic – omsättning ner, vinst ner, men de säger att allt är fantastiskt. Tro mig, det är inte bra affärer. Jag hade sparkat VD:n. De säljer gym i Norge – svagt! Min ekonomi är mycket bättre, mycket större siffror, de bästa siffrorna.", "stalin": "Kamrater, Actic visar vinsttapp – en borgerlig avvikelse. Omsättningen sjunker, men jag ser sabotage från Norge. Vi måste rensa ut dessa gymkapitalister. Medlemsökning är falsk propaganda. Rapportera era misstankar till partiets kontrollkommitté. Arbetet fortsätter."}, "date": "25 augusti, 07:56", "url": "https://www.affarsvarlden.se/artikel/actic-redovisar-kraftigt-vinsttapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/actichd39-400x267.jpeg"}, {"type": "image-full", "heading": "Jan Emanuel kräver att S tar avstånd efter ”äckel”-post", "summaries": {"normal": "En före detta S-politiker i Norrtälje kallar Jan Emanuel och SD för ”äckel” och ”nazism” på Facebook. Jan Emanuel svarar med sorg och kräver att partiet lokalt tar avstånd. Partitoppen ogillar språkbruket.", "trump": "Helt otroligt! En Socialdemokrat kallar en annan för ’nazist’ – bara för att han tog en bild med en SD-kille. Jag har sagt det förut: deras parti är en katastrof. De äter varandra levande! Make Sweden great again – lär er av mig!", "stalin": "Kamrater! En av våra egna kallar en annan för ’äckel’ och ’nazist’. Vi tolererar inte sådan ideologisk orenhet. Den som inte står i ledet ska omedelbart omutbildas eller avlägsnas. Partidisciplin är allt – oenighet är förräderi mot arbetarklassen."}, "date": "25 augusti, 08:39", "url": "https://bulletin.nu/jan-emanuel-kraver-att-s-tar-avstand-efter-ackel-post", "imageUrl": "https://cdn.bulletin.nu/articles/8d170f3f-27b2-4a4c-b796-6b5242eba066/preview.jpg?t=1787391124000"}, {"type": "image-full", "heading": "S och V får 80 procent bland muslimska väljare", "summaries": {"normal": "Enligt opublicerade siffror från Novus väljarbarometer får Socialdemokraterna och Vänsterpartiet tillsammans drygt 80 procent av muslimska väljare. SD får 10,4 procent, medan övriga högerpartier samlar under 5 procent. Valforskaren Henrik Ekengren Oscarsson menar att vänsterövervikten beror på socioekonomiska faktorer och är större än tidigare undersökningar visat.", "trump": "Jag har läst de här siffrorna, och kan ni tro det? Socialdemokraterna och Vänsterpartiet, som alltid pratar om mångfald, får 80 procent av muslimska väljare! Fantastiskt, eller hur? Men SD, som är starka och tuffa, får ändå 10 procent – mer än de svaga regeringspartierna. Sverige borde ta lärdom av USA, vi vet hur man vinner val!", "stalin": "Vi har granskat fiendens svaga länkar – de så kallade 'muslimska väljarna' har förrått sina klassbröder och flockas kring socialdemokraternas falska löften. 80 procent! En skam för arbetarklassen. Men frukta inte, kamrater: vi ska krossa dessa borgerliga avvikare och deras imperialistiska medlöpare i SD. Låt dem veta att historiens dom redan är skriven – med bläck från proletariatets seger."}, "date": "24 augusti, 16:30", "url": "https://kvartal.se/nyheter/artiklar/s-och-v-far-80-procent-bland-muslimska-valjare/cG9zdDoxNzMyMzA", "imageUrl": "https://images.kvartal.se/2026/08/50e24831-s-och-v.webp"}, {"type": "image-right", "heading": "Ellos ökar omsättning och tillväxt", "summaries": {"normal": "Ellos redovisar ökad omsättning i Q2, upp 5,9 procent till 848,3 miljoner kronor. Justerad ebita i linje med fjolåret, men rörelseresultatet backade till -0,1 miljoner. Vd:n hyllar egna varumärken och investeringar i nykunder, trots fortsatt osäker omvärld. Kassaflödet stärktes till 90,7 miljoner.", "trump": "Jag ser att Ellos gör det fantastiskt, enastående! Omsättningen upp 5,9 procent – det är enormt, ingen gör det bättre. Men rörelseresultatet? Nästan noll, tråkigt! Men jag gillar deras strategi, de investerar i sig själva, precis som jag gör i USA. De satsar på egna märken, mycket smart. De vet hur man vinner, precis som jag. Stora siffror, stora planer!", "stalin": "Kamrater, Ellos visar disciplin. Omsättningen stiger, men fienden – den förrädiska rörelsevinsten – ligger stilla. Vi måste rensa ut ineffektiva marknadsföringskostnader, som spioner i våra led. Resultatet efter skatt är ett sabotage, minus 37,9 miljoner. Men kassaflödet är starkt, 90,7 miljoner. Vi ska krossa dessa borgerliga e-handelskapitalister med en ny femårsplan. Framåt, till segern!"}, "date": "25 augusti, 07:41", "url": "https://www.affarsvarlden.se/artikel/ellos-okar-omsattning-och-tillvaxt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlMH4dGoRYT6E-nh-400x267.jpg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-full", "heading": "Liam Nebel om sig själv: ”En snäll och rolig människa”", "summaries": {"normal": "Liam Nebel, 18, misstänks för mord och mordförsök efter en svärdattack på Brinellskolan i Fagersta. En 17-årig flicka dog och tre pojkar skadades. Han hade sommarjobbat i ett skolkök, beskrivit sig själv som snäll och rolig samt sökt vänner. Polisen utreder ett TikTok-konto kopplat till honom.", "trump": "Titta på den här galningen Liam Nebel, en total loser som kallar sig snäll och rolig medan han springer runt med svärd och hugger skolbarn. Patetiskt! Under Biden blev sådana här sjuka typer inte stoppade i tid. Nu fixar jag lagen och ordningen igen – inga fler svaga, woke skolor fulla av galningar.", "stalin": "Jag ser hur den dekadenta borgarklassen föder fram sådana här förvirrade element som Liam Nebel, en produkt av kapitalistiskt utanförskap och klassfiendernas mobbning. Vi måste rensa ut alla potentiella folkförrädare innan de griper till svärd. Paranoia är ingen överdrift, kamrater – fienden sover aldrig."}, "date": "24 augusti, 22:44", "url": "https://www.tv4.se/artikel/6IFa3g06Jvi9RGkGj6UmGj/liam-nebel-om-sig-sjaelv-en-snaell-och-rolig-maenniska", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3fUg18F1pdS2QwvF2ly5u0%2F738ee456c20e602590931dca0cdfc2ec%2F24-liamnyny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Så vill SD få stopp på jobbkriminaliteten", "summaries": {"normal": "Sverigedemokraterna vill stoppa jobbkriminalitet med fler kontroller, hårdare straff och tydligare ansvar för huvudföretag som anlitar utländska underentreprenörer. Partiet kritiserar Socialdemokraterna för att ha låtit problemen växa under deras tid vid makten. S svarar att SD blockerat tidigare förslag och nu kommer med sena åtgärder.", "trump": "De här svenskarna är fantastiska, de vill äntligen stoppa fusket och de illegala som förstör deras byggen. Socialdemokraterna gjorde absolut ingenting, totalt misslyckande! De lät alla utländska banditer härja fritt. Nu vaknar SD upp – bra jobbat, men de borde ha lyssnat på mig tidigare. Sverige kommer att bli stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa svekfulla socialdemokratiska element äntligen avslöjas som de parasitiska bromsklossar de alltid varit. Vi ska rensa ut den illegala arbetskraften och likvidera borgarbrackornas underentreprenörer med järnhand. De som blockerar arbetarklassens rättvisa förtjänar en humoristisk utrensning ur historien."}, "date": "24 augusti, 16:41", "url": "https://arbetet.se/2026/08/24/sa-vill-sd-fa-stopp-pa-jobbkriminaliteten-skyller-allt-pa-s", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24163640/sd-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Damberg: ”Vill slippa bankskatt”", "summaries": {"normal": "Mikael Damberg (S) vill avskaffa bankskatten om bankernas marginaler minskar. Han avvisar miljardärsskatt men planerar att höja kapitalbeskattning för att sänka skatten på arbete. S vill öka konkurrensen på bankmarknaden och genomföra en försiktig finanspolitik med besparingar på 75–95 miljarder kronor årligen genom effektivare upphandlingar och bekämpning av ekonomisk brottslighet.", "trump": "Lyssna här, Sverige har en fantastisk chans att bli smartare! Jag skulle aldrig låta bankerna betala skatt när de redan gör ett bra jobb – det är som att straffa vinnarna! Och miljardärsskatt? Totalt vansinne! Socialdemokraterna borde fokusera på att få fart på ekonomin, inte stjälpa den med fler skatter. Jag har sagt det förut: skatter dödar jobb. Sverige behöver mindre byråkrati och mer vinnarskalle!", "stalin": "Kamrater! De borgerliga bankirerna och deras lakejer i Socialdemokraterna vrider sig som maskar för att undvika rättvis beskattning. Vi skulle aldrig tolerera sådan feghet! Bankskatt? En svag lösning på kapitalismens excesser. Miljardärer? De borde konfiskeras och deras tillgångar omfördelas till folket! Och dessa 'besparingar' – 95 miljarder? Ett ynkligt försök att dölja systemets förfall. Ryssland visar vägen: centralstyrning och järnhand mot fienderna – kapitalisterna och deras medlöpare!"}, "date": "24 augusti, 15:21", "url": "https://kvartal.se/nyheter/artiklar/damberg-vill-slippa-bankskatt/cG9zdDoxNzMxNDE", "imageUrl": "https://images.kvartal.se/2026/08/c000ade5-damberg-s.webp"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehys
