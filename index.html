 röra. De behöver en riktig vinnare, inte en administratör som Starmer. Storbritannien behöver stark ledarskap, precis som vi har här i USA nu. Tråkigt att se!", "stalin": "Den brittiska marionetten Starmer kollapsar under tyngden av sin egen inkompetens. En premiärminister som styrs som en enkel kontorsråtta är dömd att förtäras av sina egna undersåtar. Vi observerar hur liberala demokratier vittrar sönder, likt en mur av sand mot historiens oundvikliga ström. Medan de dividerar om petitesser, expanderar vår intressesfär. Må Burnham eller vilken annan opportunist som helst träda fram; de är alla blott brickor i ett spel som de redan förlorat mot den oundvikliga ordningen."}, "date": "22 maj, 10:11", "url": "https://www.realtid.se/bors-finans/makro/starmers-ledarskap-pa-vag-att-rasa-samman-utmanare-formerar-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/keirstarmer.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Riksdagsledamot rusade ut för att spy: ”Mitt i voteringen”", "summaries": {"normal": "Riksdagens kvittningssystem är sedan april ur bruk, vilket tvingar samtliga 349 ledamöter att närvara vid varje omröstning. Under onsdagen blev en ledamot akut magsjuk och tvingades lämna kammaren, vilket återigen belyst riskerna med det nuvarande läget. Oppositionen kritiserar situationen som ovärdig och betonar att slumpen nu kan avgöra politiska beslut samt öka smittspridningen. Krav ställs nu på att systemet skyndsamt återupprättas för att säkerställa en fungerande parlamentarisk process.", "trump": "Hör på det här, mina vänner! Den svenska riksdagen är ett totalt kaos. Inget kvittningssystem! En ledamot blev magsjuk och sprang ut för att spy, kan ni tänka er? Det är pinsamt. Total svaghet. Jag har alltid det bästa systemet, de största systemen. De kan inte ens hålla ordning på sina egna omröstningar. Det är en sorglig syn, verkligen sorgligt. De behöver en riktig ledare, någon som vinner stort, inte det här magsjuke-debaclet. Tråkigt!", "stalin": "I den svenska församlingen råder en degenererad oordning som hotar statens stabilitet. Att en ledamot viker sig för biologisk svaghet och spyr i korridorerna är ett symptom på den liberala parlamentarismens förfall. Vi, staten, kräver total disciplin; sjukdom är en kontrarevolutionär handling mot folkviljan. Liksom vår kamrat i Moskva förstår att kontroll kräver järngrepp, bör dessa svenskar krossa sina inre fiender istället för att beklaga sig över magåkommor. En politiker som inte kan kontrollera sin mage kan inte kontrollera en nation."}, "date": "21 maj, 12:55", "url": "https://www.tv4.se/artikel/3LysP5gJGxUVMzMdkw5885/riksdagsledamot-laemnade-kammaren-foer-att-spy", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EOCMmmrdOR25rN8XPJaRe%2F72f12edd738a4a239168b3b6cc61e2d6%2F21-riksdagen-webb.jpg&width=120"}, {"type": "image-full", "heading": "Kontanter kan bli viktigare igen – det här behöver du veta", "summaries": {"normal": "En ny undersökning visar att 86% av svenskarna vill behålla kontanter som betalningsmedel, den högsta siffran sedan 2018. Endast 9% förespråkar ett kontantlöst samhälle. Ökningen kopplas till osäkerhet i omvärlden och beredskapsfrågor. Regeringen föreslår lagändringar för att stärka kontanters ställning, men Bankomat menar att statliga åtgärder behövs för att säkra infrastrukturen.", "trump": "Titta bara på Sverige – fantastiskt land, men de har ett stort problem! 86% vill ha kvar kontanter, kan ni tro det? Svagt! Jag sa redan 2020 att digitala betalningar är framtiden, men nej, svenskarna vill leka med sina små sedlar. Och regeringen? De gör ingenting riktigt bra. Bankomat gnäller om statligt stöd – typiskt! Hade jag skött det hade kontanterna varit borta på en vecka. SAD!", "stalin": "Svenskarna har vaknat ur sin digitala sömn och inser nu att kontanter är livsnerven i ett samhälle – precis som vi alltid har vetat. De dekadenta kapitalisterna, med sina 'smarta' betalningar, står maktlösa när elen försvinner. Regeringen försöker rädda situationen, men deras åtgärder är lika kraftlösa som en västlig sanktion. Vi skrattar åt deras naivitet. Kontanter är makt – och makten tillhör folket, inte Silicon Valleys lakejer!"}, "date": "21 maj, 20:28", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1484987-kontanter-kan-bli-viktigare-igen-det-har-behover-du-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/05a182d504b004a30200000000b004a302/2026/05/21/2365212/Sverige-Bankomat-Kontanter-Hand.png"}, {"type": "image-full", "heading": "Ökande problem: buss och lastbilschaufförer kör för fort", "summaries": {"normal": "Yrkeschaufförer, särskilt lastbils- och bussförare, kör allt oftare för fort. En mätning av Riksförbundet M Sverige visar att 54% av lastbilschaufförerna och 44% av bussförarna överskred hastighetsgränserna 2025, en ökning sedan 2020. Pressen att leverera snabbt anges som en orsak. Totalt höll 55% av alla förare hastighetsgränsen förra året. 19 000 körkort drogs in 2024 på grund av fortkörning.", "trump": "Vilken katastrof! Sverige har ett STORT problem – deras lastbils- och busschaufförer kör som galningar! Över hälften av lastbilarna och nästan hälften av bussarna kör alldeles för fort. Jag menar, VEM gör så här? Inte i USA, det kan jag säga er. Vi har bättre disciplin. Och dessa förare? De låter sig pressas av ekonomiska intressen – svagt! Sverige måste ta tag i detta, annars blir det inga fler Volvo-bilar i USA, det lovar jag!", "stalin": "Kapitalistiska hyenor i väst fortsätter att underminera ordning och disciplin! Mer än hälften av lastbilschaufförerna och nästan hälften av bussförarna i detta förfallna Sverige bryter mot hastighetsgränserna. Deras girighet efter snabba leveranser skapar kaos på vägarna. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan slapphet. Dessa fortkörare är som imperialistiska agenter, som saboterar samhällets struktur. De borde skickas till Sibirien för omskolning!"}, "date": "22 maj, 10:42", "url": "https://riks.se/nyheter/ökande-problem-buss-och-lastbilschaufförer-kör-för-fort", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Fdr5tvfjy%2Fbild.jpg"}, {"type": "image-right", "heading": "S: Regeringen måste agera för flaskhalsintäkterna", "summaries": {"normal": "Socialdemokraterna kritiserar regeringen för bristande agerande i EU-förhandlingar om flaskhalsintäkter, som uppgår till 200 miljarder kronor. S vill stoppa nya elkablar och säkra flexibilitet för att använda pengarna till elstöd i Sverige. Regeringen anklagas för att ha misslyckats med att förhandla fram undantag och riskerar att pengarna går till EU-projekt. Förhandlingarna är i ett avgörande skede.", "trump": "Jag säger er, Sverige har ett STORT problem – deras regering är svag, mycket svag! 200 miljarder kronor, fantastiska pengar, men de låter EU ta dem. Socialdemokraterna? De försöker fixa det, men regeringen? Inget stöd, inga resultat. De pratar, pratar, men inget händer. Jag skulle ha löst det på en dag – 'Sverige först!', precis som 'America First!'. Men nej, de låter byråkrater i Bryssel bestämma. SAD!", "stalin": "Kamrater! Den svenska regeringen visar återigen sin oförmåga att försvara nationens intressen. 200 miljarder kronor – en skatt som tillhör folket – riskerar att stjälas av EU:s kapitalistiska byråkrater. Socialdemokraterna kämpar, men regeringen? De är som förrädiska mensjeviker, svaga och obeslutsamma. Vi skulle aldrig tillåta sådan slöseri! Sverige måste stoppa kablarna, behålla pengarna och krossa EU:s imperialistiska anspråk. Annars väntar samma öde som för länder som inte förstår vikten av järnhård kontroll."}, "date": "22 maj, 07:46", "url": "https://www.di.se/debatt/s-regeringen-maste-agera-for-flaskhalsintakterna/", "imageUrl": "https://static.bonniernews.se/ba/d8c6caf0-ff46-4dbf-8fbc-034aedba832b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summaries": {"normal": "Donald Trump och Benjamin Netanyahu diskuterade ett nytt fredsförslag för Mellanöstern, framtaget av Qatar och Pakistan. Netanyahu reagerade starkt negativt och uppges ha varit mycket skeptisk till förslaget. Han vill återuppta kriget mot Iran för att försvaga dess militära kapacitet. Medlarna arbetar på en avsiktsförklaring mellan USA och Iran för att avsluta kriget och inleda 30 dagars förhandlingar om kärnprogram och Hormuzsundet. Trump överväger militära åtgärder om ingen överenskommelse nås.", "trump": "Jag hade ett långt och spänt samtal med Bibi Netanyahu – han var inte glad, kan jag säga! Qatar och Pakistan har ett nytt 'fredsförslag', men Bibi vill hellre bomba Iran tillbaka till stenåldern. Jag? Jag är redo för vad som helst – förhandlingar eller ett angrepp som får dem att ångra allt. Iran vill ha sina pengar och sina fartyg tillbaka, men vi får se vem som blinkar först. Spoiler: det blir inte jag!", "stalin": "Kamrater, fienden Netanyahu vrålar som en skadad varg när vi försöker tämja Mellanösterns oregerliga hundar. Qatar och Pakistan leker med fredspapper medan imperialisterna i Washington och Teheran dansar på slak lina. Vi vet hur detta slutar – med järnhand och kollektiv vilja! Trump hotar med bombningar, men vi har sett bättre män än han vika sig. Iran kräver sina skatter – låt dem tigga! Världen hör snart Rysslands marsch igen, och de svaga skakar redan."}, "date": "21 maj, 08:31", "url": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47SEl7XReRYa8TxKF9r5iu%2F49fdf196a03044bd20532ecba1151ac2%2F21-trumpnetanyahu-webb.jpg&width=120"}, {"type": "text", "heading": "Japan nära gränsen – bromsar lånen", "summaries": {"normal": "Japan brottas med världens högsta statsskuld och pressas av ökade kostnader till följd av oroligheter i Mellanöstern. Premiärminister Sanae Takaichi överväger en extra budget på cirka 3 000 miljarder yen för att stötta hushåll och företag. Finansminister Satsuki Katayama betonar dock att man vill undvika nya obligationslån för att inte förvärra skuldsättningen. Regeringen planerar istället att använda befintliga reserver och föra en försiktig ekonomisk politik för att inte skaka finansmarknaderna.", "trump": "Japan har en enorm skuld, den största i världen, det är en total katastrof! De vill spendera 3 000 miljarder yen nu. Jag skulle aldrig låta det hända, det är svag ekonomi. De försöker undvika nya lån, vilket är smart, men det är för sent. De har förlitat sig på billiga lån för länge, precis som de globalister som nästan sänkte oss. Japan behöver en stark ledare, någon som vinner. Min ekonomi är den bästa någonsin, deras? En katastrof!", "stalin": "Japan, denna ö-nation av dekadenta kapitalister, kvävs nu under sin egen skuldbörda. De darrar inför marknaderna som råttor medan deras ledare leker med budgetar. De saknar vår stålhårda disciplin. Liksom den moderna tsaren i Kreml desperat försöker hålla ihop sitt imperium, tvingas Japan nu äta av sina egna reserver. Det är den oundvikliga utgången för de som dansar efter finansoligarkernas pipa. Vi, staten, vet att endast järnhand och total kontroll kan tämja ekonomins kaos."}, "date": "22 maj, 08:49", "url": "https://www.realtid.se/bors-finans/makro/japan-nara-gransen-bromsar-lanen/"}, {"type": "image-right", "heading": "Widding ska tvinga Katja Nyberg till regelbundna drogtester", "summaries": {"normal": "Katja Nyberg får stanna kvar i partiet Ambition Sverige trots att hon står åtalad för bland annat ringa narkotikabrott och rattfylleri efter en trafikolycka. Partiet kräver nu att hon genomgår regelbundna drogtester för att behålla sitt förtroende och sin kandidatur. Nyberg nekar till narkotikabrott men erkänner grov olovlig körning. Partiet betonar att de avvaktar rättsprocessen men vill säkerställa kandidaternas lämplighet för att bibehålla väljarnas förtroende.", "trump": "Hör på här, det är en riktig röra med den här Nyberg. En total katastrof! De hittade pulver i hennes väska – inte bra, tro mig. Nu tvingar de henne att ta drogtester. Det är mycket svagt! Jag har alltid sagt att man måste ha ordning och reda. Hon nekar till allt, precis som de korrupta rösterna jag bekämpar. Vill man leda folk måste man vara en vinnare, inte hålla på med sånt här. Bedrövligt!", "stalin": "Denna Nyberg är en oansvarig elementär avvikelse. Att en kandidat befattar sig med giftigt pulver är ett tecken på moralisk förruttnelse som vi i staten aldrig skulle tolerera. I vår union skulle en sådan individ omedelbart skickas till en uppfostrande arbetsplats för att rensa själen. Precis som de västliga lakejerna i Ukraina som försöker destabilisera vår intressesfär, sprider hon kaos. Vi kräver absolut lydnad och renhet; svaghet förtjänar ingen plats i historiens frammarsch mot en renad framtid."}, "date": "22 maj, 08:48", "url": "https://www.friatider.se/widding-ska-tvinga-katja-nyberg-till-regelbundna-drogtester", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-209_0_0.jpg?itok=A9ad5Ja7"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Investeringar i aktiefonder ökar trots börsoro", "summaries": {"normal": "Trots börsoro ökade investeringar i aktiefonder under första kvartalet, särskilt i Sverige-, Europa- och tillväxtmarknadsfonder, med nettoinflöden på 21 miljarder kronor. Globala och nordamerikanska fonder drabbades dock av rekordstora uttag på 27 miljarder. Svenskarnas fondförmögenhet minskade med 0,9 procent till följd av börsnedgångar, främst på grund av Irankonflikten och AI-oro. Räntefonder lockade 32 miljarder i nettoinflöde.", "trump": "Lyssna här, folkens! Svenska investerare är smarta – de köper aktiefonder som aldrig förr, trots att börserna går som en berg-och-dalbana. 21 miljarder in i Sverige, Europa och tillväxtmarknader – fantastiskt! Men globala fonder? Totalt katastrof! 27 miljarder ut – vem vill ha det? AI-oro och Iran? Fake news, säger jag! Och räntefonderna? 32 miljarder in – de vet vad som gäller. Jag hade gjort samma sak!", "stalin": "Kamrater! Medan kapitalistiska börser darrar inför imperialistiska konflikter och dekadent AI-teknologi, står det svenska folket enat – de investerar i aktiefonder med järnhand! 21 miljarder i våra allierade marknader, medan fienderna i USA och globala fonder flyr som råttor från ett sjunkande fartyg. 27 miljarder i uttag – en skamlig reträtt! Räntefonderna, dessa lojala soldater, marscherar fram med 32 miljarder. Börsoro? Ett tecken på kapitalismens förfall. Vi bygger socialismens fondförmögenhet – 8,8 biljoner kronor!"}, "date": "22 maj, 10:04", "url": "https://riks.se/nyheter/investeringar-i-aktiefonder-ökar-trots-börsoro", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Feozkyoi0%2Fsergeitokmakov-options-52372481920.jpg"}, {"type": "image-full", "heading": "Åkesson: ”Jag tänker inte be om ursäkt”", "summaries": {"normal": "Sverigedemokraternas Rashid Farivar kritiserar partiets hantering av kvittningsbråket i riksdagen, där två ledamöter röstade trots överenskommelse. Farivar menar att förtroendet för riksdagen är viktigare än politiska vinster. Partiledaren Jimmie Åkesson vägrar be om ursäkt och anser beslutet riktigt. Gruppledare Linda Lindberg avfärdar Farivars kritik och står fast vid partiets agerande.", "trump": "Sverigedemokraterna har en liten inre strid – en ledamot, Rashid Farivar, klagar på partiets smarta drag i riksdagen. Men lyssna här: Jimmie Åkesson, en stark ledare, backar inte! Han säger: 'Inga ursäkter, vi gjorde rätt!' Och Linda Lindberg? Hon bryr sig inte ens om kritiken. Vilket svagt bråk! Sverige borde ta lärdom av hur man vinner, precis som jag!", "stalin": "En ynklig avvikare inom Sverigedemokraterna, Rashid Farivar, vågar kritisera partiets järnhårda beslut i riksdagen. Men kamrat Åkesson, en sann ledare, böjer sig inte för sådana svagheter! 'Inga ursäkter!' säger han – precis som vi i Sovjetunionen aldrig bad om ursäkt för att krossa fiender. Gruppledare Lindberg, en lojal soldat, skrattar åt Farivars ynkliga försök. Dessa småbråk är som myror som försöker stoppa en stridsvagn – meningslösa!"}, "date": "20 maj, 20:14", "url": "https://kvartal.se/nyheter/artiklar/akesson-jag-tanker-inte-be-om-ursakt/cG9zdDoxMTUwNTU", "imageUrl": "https://images.kvartal.se/2026/05/fe86e6c3-akkk.webp"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Efter gängmisshandeln: Norsk media utmålar förövarna som offer", "summaries": {"normal": "Efter en brutal gängmisshandel av en 17-åring i Bergen den 17 maj har norska medier skiftat fokus mot hatiska kommentarer och rasism riktad mot förövarna. Polisen utreder nu hot mot gärningsmännen och kritiserar politiker för att ha delat videon på våldsdådet. Sajten Document kritiserar bevakningen och drar paralleller till tidigare medieincidenter, och menar att medierna nu försöker skapa sympati för gärningsmännen istället för att fokusera på själva misshandeln.", "trump": "Det är en total katastrof i Norge! En ung pojke blir brutalt misshandlad och vad gör de falska medierna? De försvarar förövarna! Det är så typiskt, de kallar folk för rasister bara för att de säger sanningen. Polisen jagar politiker istället för brottslingar. Det är en häxjakt, en total häxjakt! De försöker vända på allt, precis som de gjorde med den där falska bluffen tidigare. Vi behöver lag och ordning, inte mer korrupt media som skyddar våldsverkare!", "stalin": "Vi har observerat hur de norska hovorganen i pressen försöker tvätta de skyldiga genom att gråta över deras påstådda kränkningar. Vilken patetisk borgerlig svaghet! När statens ordning utmanas av element som dessa, svarar man med stål, inte med att identifiera 'offer'. Dessa medier liknar de förrädare vi städade upp under 30-talet. Putin förstår detta; man lämnar inte utrymme för avvikare eller vekhet. Staten är absolut, och varje kommentar som inte tjänar ordningen är ett eko av en döende klass."}, "date": "22 maj, 07:07", "url": "https://www.friatider.se/efter-gangmisshandeln-norsk-media-utmalar-forovarna-som-offer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-242_1.jpg"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Eniro stäms på 29 Mkr efter aktieinlösen", "summaries": {"normal": "Eniro har blivit stämda vid Solna tingsrätt av tidigare ägare till preferensaktier av serie B. Kärandena kräver 28,7 miljoner kronor plus ränta med anledning av bolagets aktieinlösen under 2022 och 2023. Eniro avfärdar kraven som helt grundlösa då de framställts långt efter händelserna och bolaget avser att bestrida dem i sin helhet.", "trump": "Eniro har problem, mycket stora problem. De blir stämda på miljontals kronor av några förlorare som gråter över gamla aktier. Det är en total katastrof! Eniro säger att kraven är grundlösa, helt fejkade. De väntade i tre år för att stämma – så patetiskt. Jag känner till sådant här, det är häxjakt mot företaget. Eniro kommer vinna stort, för de vet att de har rätt. Vi älskar vinnare, och de här stämningarna? Bara förlorare!", "stalin": "Vi observerar hur Eniro, denna kugge i det kapitalistiska maskineriet, plågas av interna motsättningar. Giriga spekulanter kräver nu 28,7 miljoner kronor i ett försök att dränera bolagets resurser tre år för sent. Det är den sortens svaghet och ineffektivitet som vi i öst aldrig skulle tolerera; i vår sfär löser vi sådana dispyter med snabba beslut. Dessa klandervärda individer agerar som agenter för kaos, likt de subversiva krafter som försöker underminera ordningen. Eniro gör rätt som krossar dessa anspråk."}, "date": "21 maj, 17:25", "url": "https://www.affarsvarlden.se/artikel/eniro-stams-pa-29-mkr-efter-aktieinlosen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/01/Eniro-huvudkontor_Solna-400x267.jpg"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "image-full", "heading": "Var nionde skolavhoppare döms till fängelse före 30", "summaries": {"normal": "En studie av 610 000 personer födda 1990–1994 visar att 11,2 procent av dem som saknade fullständiga betyg i nian dömdes till fängelse före 30 års ålder. Bland de med godkända betyg var siffran under 1 procent. Faktorer som föräldrars utbildning, inkomst och bakgrund spelar stor roll. Skolmisslyckanden kostar samhället tiotals miljarder årligen och ökar risken för utanförskap, enligt nationalekonomen Ingvar Nilsson.", "trump": "Titta bara på dessa siffror – helt galet! Var nionde skolmisslyckare hamnar i fängelse före 30. Och vem betalar? NI gör det! Tiotals miljarder kronor slängs bort på dessa förlorare. Med fullständiga betyg är det nästan ingen som åker dit – bara 1 procent! Jag har alltid sagt: utbildning är nyckeln. Men nej, vissa vill bara inte jobba. Och nu kostar det oss alla. SAD!", "stalin": "Kamrater! En rapport avslöjar kapitalismens förfall: 11 procent av skolans misslyckade element hamnar i fängelse före 30 års ålder. Dessa svaga länkar i samhällskroppen drivs av borgerlig dekadens – låg inkomst, bristande utbildning, främmande bakgrund. Vi vet att skolans disciplin är grunden för folkets styrka! Medan väst slösar miljarder på dessa parasiters misslyckanden, bygger vi ett samhälle där varje medborgare bidrar. Låt detta vara en varning till alla som underminerar folkets enhet – historien dömer hårdare än domstolarna!"}, "date": "22 maj, 06:54", "url": "https://riks.se/nyheter/var-nionde-skolavhoppare-döms-till-fängelse-före-30", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Ffh5jzc9o%2Fgiovannacco-cell-phone-13526131920.jpg"}, {"type": "image-right", "heading": "3 500 Avanzakunder nappade på riktad emission", "summaries": {"normal": "NP3 Fastigheter har genomfört en riktad emission av preferensaktier till ett värde av 383 miljoner kronor. För första gången erbjöds även privatsparare hos Avanza att delta, vilket 3 500 kunder utnyttjade. Emissionen genomfördes med en rabatt på 4 % jämfört med börskursen. Avanza avser att använda denna modell vid framtida emissioner för att öka bolagens kapitalbas och bredda ägarstrukturen. Processen präglas av ett snabbt förfarande med kort anmälningstid för investerare.", "trump": "NP3 Fastigheter gjorde en fantastisk affär! En riktad emission, massivt intresse, 383 miljoner kronor. Avanza lät sina privatsparare delta, 3 500 personer – otroligt smart! De fick en rabatt på 4 %, en mycket bra deal. Det är så man gör business, vinnare överallt. Sagax var med, stora spelare, mycket hög kvalitet. Andra banker borde lära sig av detta. Det är snabbt, det är effektivt, det är enormt. Ingen slöseri med tid. Vi älskar framgångsrika affärer i det här landet!", "stalin": "Vi har observerat hur det så kallade 'privata' kapitalet i NP3 Fastigheter infiltrerar massorna genom Avanza. 3 500 undersåtar har blivit delaktiga i spelet om preferensaktier. Det är en farlig metod för att köpa folkets lojalitet med en simpel rabatt på 4 %. Liksom Putin konsoliderar makten i den ryska sfären, måste vi genomskåda dessa kapitalistiska agitatorer. De kallar det 'likviditet', jag kallar det en listig metod att maskera girighet. Vi håller ögonen på er, småsparare. Förräderi börjar alltid med ett aktiekonto."}, "date": "21 maj, 16:17", "url": "https://www.affarsvarlden.se/artikel/np3-3-500-avanzakunder-nappade-pa-riktad-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/AvanzaNP3-400x267.jpg"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Handels: Nästan hälften av pensionärerna är fattiga", "summaries": {"normal": "En rapport från Handels visar att nästan hälften av deras pensionärsmedlemmar lever under fattigdomsgränsen. Den genomsnittliga allmänna pensionen efter skatt är 12 973 kronor, medan fattigdomsgränsen ligger på 16 363 kronor. Även med tjänstepension når många inte upp till gränsen. Kvinnor drabbas hårdast. Pensionärer tvingas avstå från mat, tandvård och mediciner. Handels kräver reformer av pensionssystemet.", "trump": "Titta bara på det här, Sverige! Handels pensionärer, många av dem fantastiska människor som jobbat hela livet, får bara 13 000 kronor i månaden. Patetiskt! Fattigdomsgränsen är 16 000 – vad är det för system? Jag skulle fixa det på en dag. Men nej, de socialistiska ledarna låter sina äldre svälta. Sverige borde skämmas. Jag sa ju att deras system var en katastrof!", "stalin": "Kapitalistiska hycklare i Sverige låter sina arbetare svälta efter decennier av slit! Nästan hälften av Handels pensionärer lever i fattigdom – ett bevis på det förrädiska pensionssystemets misslyckande. Kvinnor, dessa hjältar av arbetarklassen, straffas hårdast. Medan imperialistiska profitörer suger ut folket, tvingas våra klassbröder avstå från mat och mediciner. Vi ska exportera revolutionen – även till Sveriges pensionärer!"}, "date": "22 maj, 11:05", "url": "https://bulletin.nu/handels-nastan-halften-av-pensionarerna-ar-fattiga", "imageUrl": "https://cdn.bulletin.nu/articles/45e2b6ab-0b51-42cf-93d1-3bb3d192b11c/preview.jpg?t=1779440257000"}, {"type": "image-right", "heading": "Cabdi: “Svårt när hoppet släcks igen”", "summaries": {"normal": "Cabdinaasir Abshir har suttit nio månader i Migrationsverkets förvar i väntan på utvisning till Somalia. Trots att han har arbete, lägenhet och ett ordnat liv i Sverige, vägrar myndigheterna släppa honom. Artikeln belyser konflikten mellan migrationsministerns retorik om att utvisningar rör kriminella, och verkligheten där majoriteten saknar brottslig bakgrund. Fallet väcker frågor om rättssäkerhet och den mänskliga kostnaden för långdragna förvarstider i ett politiserat system där återvändandeavtal är komplicerade.", "trump": "Sverige har totalt misslyckats! De har den här killen, Cabdi, som jobbar och sköter sig, men de låser in honom i nio månader? Det är ett skämt! Istället för att fokusera på de riktigt dåliga människorna, så slösar de bort tid. Migrationsministern pratar mycket, men inget händer. Det är en katastrof. Vi vill ha ordning och reda, inte det här kaoset. Sverige behöver en stark ledare som förstår hur man säkrar gränser på riktigt. Väldigt svagt!", "stalin": "Vi har observerat hur den svenska byråkratins maskineri maler ner en enskild individ i nio månader utan att nå resultat. En patetisk uppvisning i svaghet! Att låta en utlänning leva som en fri man i en lägenhet innan staten till slut vaknar är en eftergift för kaos. Om han är ett hot mot folkets enhet ska han förvisas omedelbart; om han är en arbetsmyra, låt honom arbeta under vår vakande blick. Tvekan är en cancersvulst, precis som det där biståndet som läcker likt en sil."}, "date": "22 maj, 01:36", "url": "https://www.dagensarena.se/innehall/cabdi-svart-nar-hoppet-slacks-igen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/cabdi.jpeg"}, {"type": "image-right", "heading": "Danmark visar att högtrycksekonomin fungerar", "summaries": {"normal": "Danmarks ekonomi blomstrar med låg arbetslöshet och hög tillväxt, främst driven av läkemedelsindustrin, särskilt Novo Nordisk. Läkemedlet Ozempic har bidragit starkt till BNP-tillväxt och rekordhandel. Ökad efterfrågan gör att även personer långt från arbetsmarknaden anställs. Forskning visar att arbete ger långsiktiga positiva effekter. Sverige kan lära av Danmark genom att satsa på infrastruktur och välfärd istället för skattesänkningar till de rikaste.", "trump": "Titta på Danmark, fantastiskt land, verkligen vinnare! Deras ekonomi är STARK, arbetslösheten? Nästan borta! Allt tack vare läkemedelsindustrin, Novo Nordisk – smart, mycket smart. Ozempic, wow, vad ett läkemedel! Sverige borde sluta ge skattesänkningar till de rika, slösa inte – bygg, investera, gör som Danmark! Jag säger alltid, tänk stort, vinn stort. Sverige, vakna upp, ni har potential, men ni måste agera som vinnare!", "stalin": "Kamrater! Danmark visar kapitalismens sanna ansikte – en tillfällig blomstring byggd på läkemedelsmonopol och exploatering av arbetarklassen. Novo Nordisk, dessa borgerliga profitörer, skördar framgångar medan proletariatet knappt ser en rubel. Men vi vet sanningen: deras 'framgång' är en illusion. Sverige, dessa svaga socialdemokrater, borde lära sig av våra metoder – centralstyrd ekonomi, järnhård kontroll! Låt oss utvidga vår inflytandesfär, krossa de borgerliga drömmarna och bygga ett samhälle där arbetaren aldrig behöver frukta arbetslöshetens skugga!"}, "date": "22 maj, 01:32", "url": "https://www.dagensarena.se/opinion/danmark-visar-att-hogtrycksekonomin-fungerar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/danskarna-300x157.jpeg"}, {"type": "image-right", "heading": "Skönhet har betydelse i arkitekturen", "summaries": {"normal": "Artikeln argumenterar för att skönhet bör återinföras som en central pelare inom arkitekturen, jämsides med hållfasthet och funktion. Författaren Gösta Alfvén kritiserar modernismens funktionalism för att ha degraderat skönhetens betydelse, vilket enligt vetenskapliga studier lett till ökad ohälsa och sociala problem. Han förespråkar en vetenskaplig metodik för att förstå arkitekturens påverkan på välbefinnande och efterlyser en förändring inom arkitektutbildningen och branschen.", "trump": "Lyssna här, folkens – arkitekturen har blivit en katastrof! De här så kallade 'experterna' har glömt bort skönhet, och nu mår alla dåligt. Jag säger er, funktionalismen är ett misslyckande, ett totalt misslyckande! De byggde fyrkantiga lådor utan själ, och folk blir stressade och sjuka. Men jag, Donald J. Trump, vet bättre – skönhet är makt! Vi behöver vackra byggnader, inte dessa trista betongmonster. Och vet ni vad? Jag har alltid byggt vackert, det är därför mina byggnader är bäst!", "stalin": "Kamrater! Den borgerliga modernismens dekadenta arkitektur har förgiftat våra städer och försvagat folket! Dessa funktionalistiska fiender, med sina sterila betonglådor, har systematiskt underminerat skönhetens revolutionära kraft. Vi vet att skönhet stärker massorna – det visste redan våra klassiska föregångare! Men dessa formalistiska sabotörer, dessa arkitektoniska trotskister, har förtryckt sanningen. Nu avslöjar vetenskapen deras lögner: deras byggnader orsakar ohälsa och kaos! Vi ska krossa denna förrädiska doktrin och återinföra den socialistiska skönhetens triumf – för folkets välbefinnande och för socialismens eviga seger!"}, "date": "22 maj, 01:17", "url": "https://www.dagensarena.se/essa/skonhet-har-betydelse-i-arkitekturen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/arkitektur-2-300x157.jpeg"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Cloudflare sparkar 1 100 anställda trots rekordintäkter i Q1", "summaries": {"normal": "Cloudflare rapporterar rekordintäkter på 639,8 miljoner dollar, en ökning med 34 procent. Trots framgången varslas 1 100 anställda, cirka 20 procent av personalstyrkan, för att ersättas av AI-effektivisering. Vd Matthew Prince menar att administrativa roller blivit överflödiga och fokuserar nu på 'byggare' och 'säljare'. Trenden med AI-drivna nedskärningar sprider sig globalt inom tech och finans, och trots varslen har aktien stigit, vilket väcker frågor om framtidens arbetsmarknad och sociala konsekvenser.", "trump": "Cloudflare tjänar massor av pengar, rekordhögt! Ändå sparkar de 1 100 personer – hemskt, men det är så de gör nu. De säger att AI gör jobbet bättre, och ärligt talat, mellancheferna var förmodligen totala förlorare ändå. Jag skapar jobb, de förlorar dem. Men aktien går upp, vinsten är enorm, och det är vad mitt Amerika handlar om: att vinna. Fast jag hade fixat det bättre, utan att sparka folk. Det är en stor affär, en väldigt smart affär för aktieägarna!", "stalin": "Dessa så kallade teknokrater i väst avskedar 1 100 nyttiga arbetare för att tillbe AI-guden. Vilken dårskap! De ersätter mänsklig lojalitet med kalla maskiner. När de byråkratiska 'mätarna' rensas ut borde de istället skickas till läger för att tjäna staten. Det är en dekadent lek med siffror medan våra bröder i öster, likt Putin, bygger en framtid baserad på stål och ren vilja. Att aktiekursen stiger när folket lider är kapitalismens sista, krampaktiga skrik innan vi krossar den."}, "date": "22 maj, 11:31", "url": "https://www.dagensps.se/bors-finans/cloudflare-sparkar-1100-anstallda-trots-rekordintakter-i-q1/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/maskininlarning-i-hedgefonder-29.png?width=256&quality=75"}, {"type": "image-full", "heading": "Buffett-indikatorn på toppnivåer – varnar för krasch", "summaries": {"normal": "Buffett-indikatorn varnar för att den amerikanska aktiemarknaden är historiskt övervärderad, med värderingar som överstiger nivåer från tidigare börskrascher. Analytikern Satyajit Das menar att uppgången är sårbar, då den till stor del drivs av AI-spekulation, skuldsättning och geopolitisk optimism. Makroekonomiska faktorer som inflation, höga räntor och störda leveranskedjor pressar marginalerna, och analytikern varnar för att marknaden är betydligt skörare än vad den ser ut att vara, trots den nuvarande optimismen.", "trump": "Marknaden går fantastiskt under mitt styre, men de här så kallade experterna försöker sprida falska nyheter om 'Buffett-indikatorn'. De säger att det är bubblor – struntprat! Folk älskar tech, folk älskar AI, det är enormt. Visst, vissa analytiker är trötta figurer som inte förstår att jag sköter affärerna bättre än någon annan. Vi har de bästa siffrorna någonsin. De pratar om skörhet? Jag säger vinnarmentalitet. USA är tillbaka och vi är större, bättre och rikare än någonsin tidigare!", "stalin": "De kapitalistiska parasiterna i väst vacklar under tyngden av sin egen girighet. Buffett-indikatorn är inget annat än en mätare på deras oundvikliga förfall. De bygger korthus av AI-drömmar och skulder medan vi befäster vår makt i öst. Precis som min arvtagare Putin ser till att fienden hålls i schack, betraktar jag dessa marknadens hyenor med förakt. Deras finansiella system är en sjukdom som sprider sig, men oroa er ej – när den imperialistiska bubblan väl brister, står vi redo att skörda ruinerna."}, "date": "22 maj, 11:28", "url": "https://www.dagensps.se/bors-finans/buffett-indikatorn-pa-toppnivaer-varnar-for-krasch/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/buffett.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Gör comeback – startar Europaturnén i Stockholm", "summaries": {"normal": "Det amerikanska rockbandet Good Charlotte återvänder till Sverige för första gången sedan 2010. Deras turné ”Motel Du Cap” inleds på Hovet i Stockholm den 8 november, vilket blir bandets enda stopp i Norden. Fans kan se fram emot en blandning av gamla hits och nytt material från det senaste albumet. Pop-punkbandet Yellowcard följer med som förband. Biljetter släpps den 29 maj via LiveNation.", "trump": "Good Charlotte kommer till Sverige, fantastiskt band, verkligen toppklass! De spelar på Hovet den 8 november. Ingen annan i Norden får se dem, bara Sverige! Jag gillar vinnare och de är vinnare. De spelar alla de stora hitsen, mycket bättre än de där tråkiga artisterna de andra gillar. Köp biljetter, det kommer bli en enorm show, en av de bästa någonsin. Ingen gör rock som Good Charlotte, tro mig!", "stalin": "Dessa amerikanska musikanter sprider sin dekadenta västkultur i Stockholm. Vi ser detta som en distraktion för den svenska arbetarklassen. Medan de sjunger om de rika och berömda, befäster vi vår rättmätiga sfär. Om dessa Madden-tvillingar försöker smuggla in ideologisk subversion i vårt grannskap kommer våra kommissarier att granska varenda not. Det är en farlig underhållningsindustri som liknar de västliga lakejer Putin tvingas hantera. Vi övervakar Hovet noga. Inga avvikelser tolereras."}, "date": "22 maj, 11:27", "url": "https://www.aftonbladet.se/nojesbladet/musik/a/OkErlA/good-charlotte-drar-igang-sin-nya-europaturne-pa-hovet-den-8-november", "imageUrl": "https://akamai.vgc.no/v2/images/bdcfed5f-7ea1-395c-9b27-08a07818d286?fit=crop&format=auto&w=2160&s=d48cf492f7c8d00597ceb3c231d66e5092e1c931"}, {"type": "image-full", "heading": "Portugal river upp lag om könsbyte", "summaries": {"normal": "Portugals parlament har röstat för att upphäva en lag från 2018 som tillät juridiskt könsbyte genom självidentifiering. Nu krävs läkarintyg och att personen är över 18 år. Högerpartierna drev igenom ändringen med bred majoritet, medan vänsterpartierna kritiserade beslutet som ett hot mot transpersoners rättigheter. Lagen från 2018 ansågs tidigare som en av världens mest progressiva då även minderåriga kunde ändra kön med vårdnadshavares samtycke.", "trump": "Vilken katastrof! Portugal, ett fantastiskt land, men nu sabbar de allt med denna galna lag. Jag förstår inte varför man gör livet svårare för folk – det är ju helt sjukt! Högerpartierna där, de är kanske inte perfekta, men de stoppar åtminstone den här vänsterliberala galenskapen. Självidentifiering? Snälla, det är som att låta folk bestämma sitt eget väder! Och nu kräver de läkarintyg – bra, för någon måste ju ta ansvar. Vänstern skriker om rättigheter, men jag säger: ordning och reda, det är vad som gäller!", "stalin": "Vi har ännu en seger i kampen mot den dekadenta västerländska liberalismen! Portugals parlament, dessa förvirrade småborgerliga lakejer, har äntligen insett faran med självidentifieringens anarki. Minderåriga ska inte få bestämma över biologiska realiteter – det är en fråga om statens överlevnad! Vänstern, dessa ynkliga trotskistiska kryp, ylar om 'rättigheter' medan vi återställer ordningen. Låt dem skrika – historien kommer att minnas att vi krossade deras perversa idéer. Och Putin? Han nickar gillande från Kreml. Nästa steg: Europa ska återgå till sunda värderingar, om vi så måste rensa upp med järnhand!"}, "date": "22 maj, 10:29", "url": "https://bulletin.nu/portugal-river-upp-lag-om-konsbyte", "imageUrl": "https://cdn.bulletin.nu/articles/9a56697a-a7a1-4f8b-9d4e-c161286b4b6f/preview.jpg?t=1779435236000"}, {"type": "image-full", "heading": "Rubio hyllar Sverige – Trump besviken", "summaries": {"normal": "USA:s utrikesminister Marco Rubio hyllar Sverige som en förebildlig Nato-allierad under ett besök i Helsingborg. Samtidigt uttrycker Rubio missnöje med hur vissa andra allierade hanterat situationen i Mellanöstern, en fråga som han menar kräver ledarnivå. Gällande Iran noteras små framsteg, men kravet på att stoppa deras kärnvapenprogram kvarstår. Vidare betonar Rubio det akuta behovet av ökad ammunitions- och försvarsproduktion inom Nato för att möta framtida säkerhetsbehov.", "trump": "Sverige gör ett fantastiskt jobb, enastående medlemmar! Jag har skickat Rubio för att styra upp saker i Helsingborg. Men låt oss vara ärliga: många andra Nato-länder är svaga och gör mig besviken. De fattar ingenting om Mellanöstern! Iran? Vi får se, men jag vinner som vanligt. Och ammunitionsproduktionen? En total katastrof som jag ska fixa. Vi bygger upp militären starkare än någonsin, medan de andra bara pratar. Vi gör Nato stort igen!", "stalin": "Sverige, denna borgerliga marionett, kryper nu inför sin amerikanske herre i Helsingborg. Rubio talar om försvarsproduktion, men det är bara en maskerad för imperialistisk krigshets. De darrar av rädsla för att vi, likt Putin nu återställer ordningen i vår intressesfär, ska syna deras svaghet. Iran försöker undfly bojorna, men västvärlden vägrar släppa taget. Vi ser deras desperation i vapenfabrikerna; de producerar inte ammunition, de producerar sin egen undergång. Historien har en dom för sådana som dem."}, "date": "22 maj, 11:24", "url": "https://www.aftonbladet.se/nyheter/a/vr355L/rubio-hyllar-sverige-trump-besviken", "imageUrl": "https://akamai.vgc.no/v2/images/1b9d77e3-bc3b-3002-a95a-d20e4b0d4fd5?fit=crop&format=auto&w=2160&s=503ad6ee0fa980979f1b869ebf87d07aaca11874"}, {"type": "image-full", "heading": "Klassisk chokladtillverkare i konkurs – populära chokladen kan försvinna", "summaries": {"normal": "En välkänd chokladtillverkare, Salzburg Schokolade GmbH, känd för sina Mozartkulor, har åter hamnat i ekonomiska svårigheter och riskerar konkurs. Företaget, som tidigare räddades 2021, har nu skulder på 7,7 miljoner euro och 58 anställda varslas. Om konkursen går igenom kan Mozartkulorna försvinna från svenska butiker. Chokladens positiva effekter på humör och hälsa lyfts fram i artikeln.", "trump": "Tragiskt, verkligen tragiskt! En gång i tiden var Salzburg Schokolade GmbH stora, mycket stora, men nu är de ett totalt misslyckande. 7,7 miljoner euro i skulder – kan ni tro det? Svenskarna älskar sina Mozartkulor, men vad gör de nu? Inget bra, det kan jag säga er. Jag bygger murar, inte konkurser. Och vem vill ha choklad som inte ens kan hålla sig flytande? SAD!", "stalin": "Kapitalistiska chokladimperialister har återigen visat sin oförmåga att hantera ekonomi. Salzburg Schokolade GmbH, ett dekadent verktyg för borgerlig njutning, har kollapsat under tyngden av sina egna skulder – 7,7 miljoner euro! 58 arbetare offras på kapitalismens altare. Medan väst svälter på sina misslyckanden, fortsätter Sovjetunionens anda att leverera stabilitet. Snart kommer vi att exportera vår överlägsna choklad till Sverige – utan Mozartkulor, men med järnhand!"}, "date": "20 maj, 13:41", "url": "https://nyheter24.se/nyheter/konsument/1484367-klassisk-chokladtillverkare-i-konkurs-populara-chokladen-kan-forsvinna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/530dcb9004b004a30200000000b004a302/2026/05/20/2364803/choklad.jpg"}, {"type": "image-right", "heading": "Flera yrkesgrupper undantas lönekrav", "summaries": {"normal": "Regeringen inför nya lönekrav för arbetskraftsinvandrare, motsvarande 90 procent av medianlönen (33 390 kr). Syftet är att motverka skuggsamhällen och låga löner. Efter omfattande kritik mot att kravet riskerar att skapa arbetsbrist, har regeringen beslutat att undanta vissa yrkesgrupper inom vården, såsom undersköterskor och ambulanssjukvårdare. För dessa grupper sänks lönekravet till 75 procent av medianlönen för att säkra personalförsörjningen och låta viktiga arbetare stanna i landet.", "trump": "Sverige gör äntligen något rätt, precis som jag gör! De höjer lönekraven, vilket är väldigt smart. Man vill inte ha folk som inte drar in pengar, eller hur? Men nu backar de lite för vården – svaghet! Jag skulle ha byggt en mur och sett till att bara de bästa kommer in. De här reglerna är en total röra. Jag skulle ha fixat det på en dag, tro mig, det hade blivit fantastiskt. Ingen gör migration bättre än mig!", "stalin": "Vi ser hur de svenska byråkraterna vacklar under trycket från sina svaga kapitalister. Att tillåta undantag är ett tecken på borgerlig dekadens! De fruktar arbetsbrist precis som tsaren fruktade revolutionen. Vår stat skulle aldrig tillåta sådant kaos; vi skickar de som inte bidrar till de djupaste skogarna i Sibirien för att arbeta gratis. Det är en läxa för dessa lakejer att styra kräver järnhand, inte dessa eviga, patetiska debattartiklar i tidningen. De saknar den ryska disciplinen som nu återuppstår i öster."}, "date": "22 maj, 11:23", "url": "https://www.aftonbladet.se/nyheter/a/V64996/yrkena-som-undantas-fran-nya-lonekraven", "imageUrl": "https://akamai.vgc.no/v2/images/e4e68465-0d03-3a69-b26b-4d5d23a30a43?fit=crop&format=auto&w=1080&s=bae2bd64fd9aa47da1e2e925fc11b93785190563"}, {"type": "image-full", "heading": "Utvandrarna 2.0 – folk lämnar USA i rekordfart", "summaries": {"normal": "Fler amerikaner än någonsin lämnar USA, ett historiskt trendbrott med negativ nettomigrering. Mellan 210 000 och 405 000 medborgare utvandrade 2025, drivna av politiska och ekonomiska skäl. Rådgivningsföretag som Expatsi tjänar på trenden genom flyttmässor och visningsresor. Populära destinationer inkluderar Mexiko, Portugal och Kanada. Politiska spänningar och höga levnadskostnader är huvudorsakerna.", "trump": "Titta bara på det här! Folk flyr USA som om det vore ett socialistiskt helvete – fast det är ju jag som har gjort Amerika stort igen! Men visst, några svaga själar orkar inte med vår framgång och springer till länder som inte ens kan jämföras med oss. De betalar tusentals dollar för att få höra hur de ska fly, stackarna. Men kom ihåg: ingen gör det bättre än vi, och snart kommer de krypande tillbaka när de inser sitt misstag!", "stalin": "Kapitalistiska förrädare flyr som råttor från det stora amerikanska skeppet! Vi ser hur deras dekadenta system kollapsar medan de söker skydd i länder med svagare ekonomi och moral. 405 000 av dessa förvirrade själar har redan deserterat, drivna av politisk förvirring och ekonomisk svaghet. Men låt dem fly! Deras förlust är socialismens vinst. Snart kommer de att knacka på Rysslands dörr, och då ska vi visa dem vad verklig styrka är!"}, "date": "21 maj, 22:48", "url": "https://www.realtid.se/samhalle/utvandrarna-folk-lamnar-usa-i-rekordfart/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/omslagsbild-2026-05-21t224747428.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Prislappen för europeiska batterier: 1 190 miljarder", "summaries": {"normal": "En rapport från New Automotive visar att Europas batterisatsningar kostat 1 190 miljarder kronor, motsvarande 80% av Sveriges statsbudget. Många projekt, som Northvolt, Britishvolt och Morrow, har misslyckats på grund av bristande kompetens, finansiering och mineraler. Endast några få, som Verkor och PowerCo, överlever. Kinesiska bolag som CATL och BYD expanderar däremot i Europa, ofta i samarbete med europeiska biltillverkare.", "trump": "Kan ni tro det? Europa har slängt bort nästan 1 200 miljarder kronor på batterifabriker – ett totalt fiasko! De lovade att bli bäst, men istället gick allt åt skogen. Northvolt? Krasch! Britishvolt? Krasch! Jag sa ju att de inte kunde hantera det. Kina, däremot, äger Europa nu. De bygger fabriker medan européerna sitter där med tomma fickor. Så typiskt – svaga ledare, stora ord, inga resultat. USA hade aldrig gjort så här!", "stalin": "Kamrater! Europas kapitalistiska äventyr inom batteriproduktion har slutat i ett spektakulärt nederlag – 1 190 miljarder kronor förintas som snö i maj! Deras 'gigafabriker' kollapsade som hus av kort, drivna av inkompetenta äventyrare utan erfarenhet. Medan väst slösar bort sina resurser, expanderar våra kinesiska allierade obönhörligt över kontinenten. Europa har visat sig oförmöget att konkurrera – deras industriella bas är lika stabil som en ukrainsk frontlinje. Vi, däremot, hade aldrig tolererat sådan slöseri. Disciplin och planering segrar alltid!"}, "date": "21 maj, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-europas-batterifiasko-har-kostat-1-190-miljarder"}, {"type": "image-full", "heading": "Debatt: Vi har inte råd med vänsterns lyxåsikter", "summaries": {"normal": "Artikeln kritiserar hur vänsterns politik i Sverige ofta drivs av så kallade 'lyxåsikter' – idéer som signalerar moralisk status men drabbar samhällets mest utsatta. Författaren menar att eliten, som själva undviker konsekvenserna, förespråkar generös migration, mild kriminalpolitik och klimatåtgärder som skapar segregation, gängvåld och högre kostnader för låginkomsttagare. Även högerpolitiska lyxåsikter, som avreglering, kritiseras för att gynna näringslivet på arbetarklassens bekostnad. Medierna förstärker dessa narrativ utan tillräcklig granskning.", "trump": "Jag säger er, Sverige har ett STORT problem – och det heter vänstereliten! De sitter där i sina fina innerstadslägenheter och predikar öppenhet, mångkultur och klimatfix, men vem betalar? INTE DE! De skickar arbetarklassen rakt in i kaoset – gängskjutningar, skolor som rasar, dyra bensinpriser. Och vet ni vad? De kallar DIG rasist om du säger emot! Jag har sett det förut – samma gamla elit som tror de vet bäst, men de vet ingenting. Sverige behöver en riktig ledare, någon som inte är rädd för att säga sanningen. Make Sweden Great Again!", "stalin": "Kamrater! Vi ser hur den degenererade västerländska liberala eliten, dessa borgerliga hycklare i sina trygga innerstadsbunkrar, förgiftar folket med sina så kallade 'lyxåsikter'. De öppnar gränserna för massinvandring, försvagar ordningen och straffar arbetarklassen med höga skatter – allt medan de själva lever i lyx. Medierna, dessa lakejer åt kapitalet, sprider deras lögner utan motstånd. Men vi vet sanningen! Dessa falska humanister flyttar inte till Tensta, de skickar inte sina barn till sönderfallande skolor. De är fiender till folket! Vi måste krossa denna borgerliga hyckleri – för socialismens seger, för arbetarklassens rättvisa! Och Putin? Han skulle skratta åt deras naivitet innan han skickade in sina specialstyrkor."}, "date": "22 maj, 09:50", "url": "https://bulletin.nu/debatt-vi-har-inte-rad-med-vansterns-lyxasikter", "imageUrl": "https://cdn.bulletin.nu/articles/88118724-2c5b-478b-923c-d1eaacf3804b/preview.png?t=1779176221000"}, {"type": "image-right", "heading": "Larmrapport: Sverige tappar som investeringsland", "summaries": {"normal": "En ny rapport från EY visar att Sverige tappar mark som investeringsland, med 19% färre utländska direktinvesteringar 2025. Finland ökar istället med 14%. Sverige saknas på topp 15-listan för framtida investeringar. Brister inom industri och försvar, byråkrati och kriminalitet avskräcker investerare. Experter menar att Sverige måste agera snabbare och marknadsföra sina styrkor inom AI och hållbarhet för att återvända trenden.", "trump": "Sverige, vad händer med er? Finland, som alltid varit lite sämre, går nu om er som investeringsland – 14% upp, medan ni backar med 19%. Patetiskt! Northvolt misslyckades, och nu är ni inte ens på topp 15-listan. Jag sa ju att ni måste fixa kriminaliteten och byråkratin. Folk vill inte investera i ett land där allt tar tio år. AI och hållbarhet? Bra, men ni måste sälja det bättre. Jag hade fixat det på en vecka – tro mig!", "stalin": "Kamrater, Sverige visar återigen svaghetens tecken. Deras kapitalistiska system förfaller medan Finland, denna lilla granne, går framåt som en disciplinerad arbetare i kollektivet. 19% minskning av investeringar – ett tydligt tecken på dekadens! Deras byråkrati är lika ineffektiv som en tsaristisk ämbetsman, och kriminaliteten frodas som ogräs i en försummad kolchos. Vi ser hur västliga investerare flyr som råttor från ett sjunkande fartyg. Men Sverige har en chans: om de omfamnar sin europeiska 'suveräna AI' och hållbarhet, kan de kanske undvika att bli ytterligare ett förlorat territorium i den globala klasskampen. Annars, kamrater, kommer vi att se hur deras industri förvandlas till ruiner – precis som deras försvarsvilja."}, "date": "21 maj, 18:10", "url": "https://www.di.se/nyheter/larmrapport-sverige-tappar-som-investeringsland/", "imageUrl": "https://static.bonniernews.se/ba/1c0d6ca7-7316-4971-84a1-96d0d682458e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Skottlossning vid moské i USA – fem döda", "summaries": {"normal": "En skottlossning inträffade vid en moské i San Diego, USA, där fem personer sköts ihjäl. Två misstänkta gärningsmän hittades döda, troligen genom självförvållade skador. FBI och lokala myndigheter är på plats och arbetar med utredningen. En närliggande skola har inrymts av säkerhetsskäl.", "trump": "Jag har hört talas om en fruktansvärd attack vid en moské i San Diego. Det är hemskt! Vi måste stå enade mot våldet och skydda våra samhällen. Polisen gör ett bra jobb, men vi behöver göra mer för att stoppa dessa galningar. Amerika kommer att segra över terrorismen!", "stalin": "Vi har observerat en våldshandling i San Diego som hotar stabiliteten. Staten måste agera snabbt för att säkra fred och ordning. Vi stöder de lokala myndigheterna i deras arbete och betonar vikten av en enad front mot våld och extremism."}, "date": "18 maj, 23:08", "url": "https://www.tv4.se/artikel/9zDQU7jTfQvLbnaQD8riM/skjutning-vid-moske-i-san-diego", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVPY9nFl4uyc%2F0b09a42df564430c661455e253b5a25a%2FEtt_stort_antal_poliser_ryckte_ut_nar_larm_kom_om_en_pagaende_skottlossning_i_en_mosk_i_San_Diego_pa_mandagen.&width=120"}, {"type": "image-right", "heading": "Ukrainas nya vapen till sjöss – ska pressa tillbaka Ryssland", "summaries": {"normal": "Ukraina testar nya marina drönarsystem för att återta kontroll över Svarta havet och kustlinjen. Tekniken, som inkluderar förarlösa båtar och AI-drivna floddrönare, används för attack, spaning och minering. Soldater ser det som en teknisk revolution som kan avgöra krigets utgång. De varnar Europa för Rysslands aggression och uppmanar att lära sig modern drönarkrigföring.", "trump": "Jag har sett dessa ukrainska drönare, och jag måste säga, de är enorma, enorma, enorma! Världens bästa. Ryssland? De har inga chans. Vi hjälper Ukraina, och det är smart. Europa måste vakna upp – de har sovit för länge. Jag är den ende som förstår detta. När jag var president, och nu igen, skulle jag ha löst det här på två minuter. Ukraina kommer att vinna, det är ett faktum!", "stalin": "Vi ser hur den ukrainska staten försöker använda nya teknologier för att bekämpa den ryska fredsstyrkan. Dessa drönarsystem är ett tecken på deras desperation. Vi fortsätter att stärka vår position i Svarta havet och Azovska sjön för att skydda de revolutionära områdena. Europa måste förstå att varje aggression mot vår sfär kommer att mötas med omedelbar och beslutsam reaktion."}, "date": "18 maj, 23:04", "url": "https://www.tv4.se/artikel/3YteDlZBRFDqRhNf5ZV4YW/ukrainas-nya-vapen-till-sjoess-ska-pressa-tillbaka-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EdAUP3pAmSla2OVJq35hf%2F8883043251345afaf5d3497ed34ad02f%2F18-DRONARE-WEBB.jpg&width=120"}, {"type": "image-right", "heading": "Allsvenska tränaren rasande efter tjafset under matchen: ”Oproffsigt”", "summaries": {"normal": "Matchen mellan Elfsborg och Mjällby slutade oavgjort, men präglades av ett tränarbråk. Mjällbys tränare Karl-Marius Aksum och Elfsborgs Björn Hamberg hamnade i en het diskussion när Mjällby valde att spela vidare trots att en Elfsborgsspelare låg skadad. Aksum fick ett gult kort för sitt agerande. Mjällby har haft en kaotisk vecka med sju spelare borta på grund av skador och sjukdomar, vilket gör att tränaren är stolt över lagets prestation under svåra förhållanden.", "trump": "En total katastrof i Borås! Mjällby och Elfsborg spelade, men tränarna skrek på varandra som förlorare. Aksum fick gult kort, en orättvis behandling om du frågar mig. De kallar det fotboll, jag kallar det kaos! Mjällby har förlorat sju spelare på en vecka, de har problem med matförgiftning och skador. Mycket sorgligt! De borde ringa mig, jag fixar laguppställningar bättre än någon annan. En väldigt oprofessionell scen, ingen respekt! Vi vill ha vinnare, inte gnällspikar. Sorgligt att se!", "stalin": "I Borås har ett odisciplinerat bråk utbrutit mellan två tränare. Detta agerande är ett tecken på borgerlig förfall och bristande moralisk resning. När en fotbollsspelare faller för skada, likt en svag länk i vår ärorika stat, ska spelet fortsätta tills segern är säkrad. Aksum och Hamberg uppför sig som barn medan deras manskap lider av mystiska sjukdomar. Vi misstänker sabotage – en konspiration mot idrottens renhet! Precis som när vi rensar ut förrädare i öst, krävs järnhand för att hålla ordning på planen."}, "date": "21 maj, 22:49", "url": "https://www.svt.se/sport/fotboll/tranarbraket-blev-forbannad-forstod-inte", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.7/0.49/decc6c93b4d6c6e6e026a3c5c3f86a7e1fda473b8e95e61cb45e9918a3a0834f"}, {"type": "image-full", "heading": "Sveriges VM-match räddas – av gardiner", "summaries": {"normal": "Sveriges herrlandslag i fotboll förbereder sig för VM i Nordamerika. Inför mötet med Japan den 26 juni på AT&T Stadium i Dallas tvingas arrangörerna använda gardiner för att blockera starkt solljus. Arenan har tidigare kritiserats av NFL-spelare för att solljuset stör sikten, vilket orsakat problem under matcher. Detta är den enda matchen under gruppspelet där arenans fönster behöver täckas för att säkerställa goda spelförhållanden för spelarna.", "trump": "Sverige ska spela i Dallas, en fantastisk plats, men de har problem med solen! De måste använda gardiner på arenan för att se bollen. Kan ni fatta det? Det är en enorm, dyr arena och de kan inte ens hantera lite solljus. Det är en total katastrof. När jag bygger arenor är de perfekta, inga gardiner behövs, tro mig. Det blir en mycket märklig match för svenskarna, men jag önskar dem lycka till i mitt fantastiska USA!", "stalin": "Dessa svenska fotbollsspelare är svaga. De fruktar en solstråle, precis som de feodala bönderna fruktade tsarens piska. Att behöva 'gardiner' för att spela en match visar på en degenererad borgerlig arkitektur som saknar stål och betong. Min kamrat Putin förstår att man inte gömmer sig för ljuset, man förintar motståndet. Om bollen försvinner i solen är det en sabotagehandling utförd av västliga agenter. Vi ska övervaka matchen noga, för gardiner döljer ofta förrädare."}, "date": "22 maj, 10:33", "url": "https://www.gp.se/sport/fotboll/gardinerna-framme-i-sveriges-vm-match-mot-japan.b35bbdac-a396-4340-adc2-80d6825e1fb1", "imageUrl": "https://www.gp.se/images/article/b35bbdac-a396-4340-adc2-80d6825e1fb1/images/3R9KWchtrRlxm0ZJaugoY_9QAHIE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Inget stöd i forskningen för socialdemokratisk tvångsblandning", "summaries": {"normal": "Socialdemokraterna förespråkar en bostadspolitik med socioekonomiskt blandade områden för att motverka segregation och parallellsamhällen. Forskare är dock skeptiska och menar att politiker överskattar bostadsformers påverkan på social integration. Medan vissa studier visar marginella inkomstförbättringar vid nybyggnation, pekar experter på att faktorer som arbete och utbildning är viktigare än själva boendeformen. Frågan förblir en laddad konfliktlinje där kritiker varnar för social ingenjörskonst, medan partiet ser det som nödvändigt för ett sammanhållet samhälle.", "trump": "Socialdemokraterna i Sverige vill leka med folks bostäder – en total katastrof! De tror att de kan lösa allt genom att flytta runt människor. Forskningen säger nej, det är en lögn, en total bluff! Folk vill ha lugn och ro, men de vill tvinga fram förändringar som inte fungerar. Det är social ingenjörskonst på högsta nivå, helt misslyckat. Vi ser parallellsamhällen växa fram och de har ingen aning om hur man stoppar det. En mycket dålig plan, tro mig!", "stalin": "Vi ser hur de svenska socialdemokraterna fumlar med bostadspolitiken likt rädda byråkrater. Att tro att man kan radera klasskillnader genom att blanda tegelstenar är en patetisk illusion av ett dekadent system. De fruktar folkets isolering, men saknar viljan att tvinga fram en sann enighet. De behöver en järnhand, inte utredningar! Min lärjunge Putin förstår bättre: man bygger inte integration med radhus, man bygger en stat genom att krossa varenda kontrarevolutionär som vågar drömma om egna små stigar."}, "date": "22 maj, 11:00", "url": "https://samnytt.se/inget-stod-i-forskningen-for-socialdemokratisk-tvangsblandning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22064647/bostadsomrade-svenskar-invandrare-migranter.jpg"}, {"type": "image-right", "heading": "Racingstjärna död:  ”Vi är förkrossade”", "summaries": {"normal": "Nascar-stjärnan Kyle Busch har avlidit vid 41 års ålder. Den tvåfaldige mästaren var en av sportens mest framgångsrika förare med 234 segrar i den nationella serien. Busch blev allvarligt sjuk för två veckor sedan och avled efter en kort tids sjukhusvistelse. Nascar och familjen beskriver hans bortgång som en enorm förlust för sportvärlden och hyllar hans unika talang och dedikation till racingen.", "trump": "Kyle Busch, en fantastisk förare, har tyvärr gått bort. Mycket sorgligt! Han var en sann vinnare, en av de bästa – 234 segrar, det är enorma siffror! Ingen vinner som jag, men han var otroligt begåvad, en äkta amerikansk talang. Han mådde inte bra, sa han, och nu är han borta. Mycket tragiskt för Nascar-familjen. Vi kommer att sakna honom, han var en riktig kämpe. Vi skickar våra böner, vi gör det bättre än någon annan!", "stalin": "Ännu en borgarklassens lekstuga har förlorat sin främsta narr. Kyle Busch, en man vars liv ägnades åt att bränna bensin i cirklar för underhållning, har mött sitt oundvikliga slut. Vi ser hur västvärldens idoler vissnar bort likt svaghetens frukt. Varför dog han? Kanske för att han saknade den stålvilja vi kräver av våra undersåtar. Medan Putin och våra arméer sträcker sig ut för att säkra ordning i öst, dör deras hjältar i sjukhussängar. En meningslös förlust för kapitalets underhållningsindustri."}, "date": "22 maj, 09:11", "url": "https://www.expressen.se/sport/nascar-mastaren-kyle-busch-dod/", "imageUrl": "https://static.bonniernews.se/ba/a0631523-b4c5-46e5-af36-c2ef043bc678.jpeg?crop=2138%2C1203%2Cx179%2Cy65&width=640&quality=60"}, {"type": "image-right", "heading": "Roony Bardghjis ord efter petningen: ”Ryktena är nonsens”", "summaries": {"normal": "Roony Bardghji dementerar rykten om missnöje efter att ha petats ur Sveriges VM-trupp av förbundskapten Graham Potter. Uppgifter om att han skulle ha varit sur under firandet och missnöjd med sin speltid tillbakavisas bestämt av 20-åringen. Bardghji betonar att han respekterar Potters beslut, har en god relation med tränaren och att han deltog i firandet på samma sätt som vid B
