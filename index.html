ar skickas via chattar, ofta stegvis så att den rekryterade inte ser hela planen. En norsk tonåring dömdes nyligen för att ha förberett ett mord i Storbritannien efter digital rekrytering. Flickor och unga kvinnor dras oftast in genom relationer och används för att transportera droger, vapen eller pengar eftersom de väcker mindre misstanke.", "trump": "Det är helt otroligt, folk. De här kriminella nätverken, de är som de värsta bedragarna, rekryterar unga killar direkt i mobilen med Snapchat och Telegram. Lovar hundratusentals kronor för att åka till ett annat land och döda någon – det är galet! De kallar det violence as a service, som en beställningstjänst. Mycket dåligt. Vi hade aldrig tillåtit sånt här i mitt Amerika. Europa måste vakna upp och stoppa de här losers innan det sprider sig hit. Sad!", "stalin": "Kamrater, det är med djup tillfredsställelse jag noterar hur de dekadenta kapitalisterna nu själva odlar en ny klass av lumpenproletära mördare som de rekryterar via sina egna borgerliga appar. Dessa borgarbrackor gömmer sig bakom krypterade chattar och lockar med pengar och falsk status, precis som de alltid gör. Vi ser hur de utnyttjar både pojkar och flickor på olika sätt – flickorna genom sina relationer, pojkarna genom löften om ära. Det är en parasitär utsugning som vi i partiet med glädje skulle ha likviderat genom en grundlig utrensning av alla dessa dekadenta fiender till folket. Mycket underhållande att se hur deras eget system föder monster som till slut kommer att sluka dem själva."}, "date": "3 augusti, 07:04", "url": "https://nyheter24.se/nyheter/utrikes/1502373-gangen-varvar-unga-i-europa-sa-gar-det-till", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2cf9565d04b004a30200000000b004a302/2026/08/02/2381782/ungagäng.jpg"}, {"type": "image-right", "heading": "Regering lanserar ny kampanj – uppmanar invånarna att använda mindre energi", "summaries": {"normal": "Den nederländska regeringen lanserade kampanjen 'Nieuwe Energie' för att minska energianvändningen genom enkla åtgärder som kortare duschar och bättre isolering. Kampanjen är en del av åtgärdspaketet efter oro för energikriser och kapacitetsbrist i elnätet. Oppositionen, däribland PVV, kritiserar och kräver snarare utbyggnad av elnäten.", "trump": "Jag, Donald Trump, ser att de nederländska politikerna försöker kontrollera energianvändningen igen. De säger åt folk när de ska duscha – ett totalt misslyckande! Jag sa alltid att energi är makt. De borde bygga ut elnäten istället för att begränsa sina medborgare. Deras energipolitik är ett skämt, precis som deras ledare. Vi behöver starka beslut, inte denna svaghet.", "stalin": "Vi, den oerhört visa staten, har lanserat kampanjen 'Ny energi' för att stärka vårt sysselskap. Folk ska duscha kortare och isolera sina bostäder – små offer för det stora målet. Oppositionen, dessa liberala hinder, kräver utbyggnad av elnäten, men deras tankar är som giftiga ugglor som sprider splittring. Parallellt med våra ryska bröder utvidgar vi vårt inflytande genom kontroll över energin."}, "date": "3 augusti, 07:00", "url": "https://samnytt.se/regering-lanserar-ny-kampanj-uppmanar-invanarna-att-anvanda-mindre-energi", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/07/30195608/stearinljus-nederlanderna-flagga.jpg"}, {"type": "image-full", "heading": "Johan Forssell: Spanien måste återta kontrollen över gränsen", "summaries": {"normal": "Migrationsminister Johan Forssell (M) varnar för att situationen i Spanien, där tiotusentals afrikanska migranter korsat gränsen på kort tid och minst 70 personer drunknat, kan få konsekvenser för hela Europa. Han kritiserar den spanska vänsterregeringens amnesti för över en miljon illegala invandrare, som han anser skapar incitament för fler att migrera. Sverige har låg asylinvandring och regeringen förbereder möten med Norden och EU för att undvika en upprepning av flyktingkrisen 2015.", "trump": "Spanien håller på att kollapsa totalt, folk. Tiotusentals migranter stormar gränsen, folk drunknar och den vänsterextrema regeringen ger amnesti till en miljon illegala. Det är en katastrof! Precis som 2015 kommer det slå ut över hela Europa. De borde ha lyssnat på mig. Sverige gör rätt, de har den lägsta asylinvandringen på fyrtio år. Smart. Vi behöver starka gränser, inte svaga ledare som bjuder in kaos.", "stalin": "Kamrater, denna spanska borgarbracka till vänsterregering har med sin förrädiska amnesti för över en miljon klassfiender öppnat portarna för en kontrarevolutionär migrantflod som redan krävt sjuttio drunknade offer. Jag ser de imperialistiska agenterna le bakom kulisserna. Vi, partiet och arbetarna, får inte tillåta en upprepning av 2015 års sabotage. Jag har redan beordrat nordiska och europeiska möten. Den som visar svaghet skall likvideras ur historien med ett leende."}, "date": "2 augusti, 12:34", "url": "https://riks.se/nyheter/johan-forssell-spanien-maste-aterta-kontrollen-over-gransen", "imageUrl": "https://admin.riks.se/uploads/Johan_Forssell_KU_7503a94738.png"}, {"type": "image-full", "heading": "Proffsbaseboll för kvinnor – efter 72 år", "summaries": {"normal": "USA har fått en ny professionell basebolliga för kvinnor, Women’s Pro Baseball League, efter 72 års uppehåll. Premiärmatchen mellan Los Angeles Queens och New York Heights lockade 4 000 åskådare. Fyra lag deltar i ligan, med spelare från flera länder. Säsongen pågår till september i Springfield, Illinois. Den 99-åriga Maybelle Blair, tidigare spelare, kastade det första ceremoniella kastet.", "trump": "Fantastiskt, helt fantastiskt! USA har äntligen en ny basebolliga för kvinnor – Women’s Pro Baseball League. Jag såg matchen, otroligt bra spel! 4 000 fans, utsålt, regn och allt. Los Angeles Queens vann, men alla är vinnare här. Och Maybelle Blair, 99 år, kastade första kastet – vad en kvinna! USA leder igen, som vanligt. Baseboll är tillbaka, bättre än någonsin!", "stalin": "Kamrater, en ny era av kvinnlig baseboll har börjat i det förfallna väst. Fyra lag, styrda av kapitalistiska intressen, kämpar i Springfield – en stad som inte ens finns på våra kartor. Men notera: 4 000 åskådare, en gammal kvinna kastar bollen, och imperialisterna kallar det framsteg. Vi har redan kvinnliga idrottare som slår deras män med en hand bakbunden. Låt dem leka – snart tar vi även deras baseboll."}, "date": "2 augusti, 11:23", "url": "https://kvartal.se/nyheter/artiklar/kvinnor-spelar-proffsbaseboll-igen-efter-72-ar/cG9zdDoxNTY1NTM", "imageUrl": "https://images.kvartal.se/2026/08/48f4d713-baseballkvinna.webp"}, {"type": "image-right", "heading": "Biblioteksbok återlämnad – 187.000 i förseningsavgift", "summaries": {"normal": "En biblioteksbok från 1858, Antiquities of Athens, har återlämnats till ett bibliotek i Kiama i Australien efter cirka 150 år. Boken hittades inmurad i en igenmurad öppen spis under en husrenovering. Den ursprungliga förseningsavgiften, baserad på tre pence i veckan, skulle i dagens penningvärde uppgå till drygt 187 000 kronor. Biblioteket har inte lyckats spåra den ursprungliga låntagaren eftersom lånejournalerna från 1870-talet saknas. Boken lämnades tillbaka av 77-årige Ross Simmons, som tror att den kan ha lånats av en av hans förfäder.", "trump": "Kan ni tro det? En bok som varit borta i 150 år dyker upp i en murad spis i Australien. De ville ha 187 000 kronor i förseningsavgift – en total katastrof! Men den kom tillbaka till biblioteket, fantastiskt. De har ingen aning vem som lånade den, journalerna är borta, typiskt. Jag skulle aldrig ha så dålig administration. Ingen gör comeback som den här boken, det är en vinnare, tro mig.", "stalin": "Kamrater, denna dekadenta bok från den borgerliga antikens tid har gömts undan av klassfiender i en murad spis som ett bevis på deras sabotage mot folkets kunskap. Vi har beräknat straffet till 187 000 kronor, en summa som skulle kunna likvidera många kapitalistiska element. Ändå återlämnas den nu av en opportunistisk figur. Misstänkt! Våra utrensningar av arkiv har tydligen inte varit tillräckligt grundliga. Nästa gång rensar vi ut även murarna."}, "date": "2 augusti, 16:46", "url": "https://www.di.se/nyheter/biblioteksbok-aterlamnad-187000-i-forseningsavgift", "imageUrl": "https://static.bonniernews.se/ba/d77edb92-5c66-4935-aa55-d0e91e94b5ec.jpeg?crop=2018%2C1009%2Cx359%2Cy147&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Jättedrama i majorn – träffade funktionär under särspelet", "summaries": {"normal": "Japanskan Shiho Kuwaki vann The Open efter ett dramatiskt särspel mot tyskan Esther Henseleit. Henseleit räddade sig till särspel med en långputt på 18:e hålet, men i särspelsdramat drabbades hon av otur när hennes boll träffade en funktionär och studsade in i en buske. Kuwaki kunde till slut sänka en kort parputt och ta sin första majorseger. Bästa svenska blev Anna Nordqvist på delad 29:e plats.", "trump": "Det var en total katastrof för den tyska tjejen, hon hade det i handen men sen träffar hon en funktionär, en riktig loser-studs in i busken. Kuwaki visste inte vad hon skulle göra, hon hade redan champagnen framme, men hon vann ändå till slut. Fantastiskt, en stor seger för Japan, de gör det bra nu, mycket bättre än många andra, det ska man ge dem. Svenskorna var helt okej, men ingen vann förstås.", "stalin": "Kamrater, denna futtiga borgarbracka till tyska puttade sig fram som en kapitalistisk parasit tills hon i sitt övermod träffade en funktionär – en ovärdig fiende till folket – och därmed avslöjade sin dekadenta svaghet. Jag, som alltid genomskådar sådana sabotörer, ser hur Kuwaki från det japanska proletariatet likviderade motståndet med en parputt. Nordqvist däremot, den där trötta revisionisten, orkade inte ens vinna utan sprang genast till sina Solheim-kapitalister. Ut med alla som saknar marginaler mot historien."}, "date": "2 augusti, 22:59", "url": "https://www.svt.se/sport/golf/shiho-kuwaki-vinner-the-open-efter-sarspelsdrama", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.35/86851e4d825349f7c8d4f814afd379799eaadb34d393360f6f2d20aa9dd0ba0f"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kungabarnen utan utdelning trots miljonvinst", "summaries": {"normal": "Kungabarnens investmentbolag Gluonen redovisade ett resultat på drygt 3 miljoner kronor under 2025, i nivå med föregående år. Ingen utdelning sker i år, till skillnad från förra året då 2 miljoner kronor delades ut. Affärerna genomförs utan kungabarnens insyn i förväg för att undvika insiderbrott, och de informeras först i efterhand. Bolaget har investerat i stora svenska bolag som Investor, Atlas Copco, Volvo och Sandvik. Varje kungabarn äger 32 procent av bolaget värt drygt 91 miljoner kronor.", "trump": "Folk, ni skulle inte tro det, men kungabarnen i Sverige gör en fantastisk miljonvinst i sitt bolag Gluonen, nästan exakt som förra året. De tar inte ut några pengar nu, smart drag, de håller det i bolaget. De får inte ens veta vad som händer i förväg, annars riskerar de insiderbrott, kan ni tänka er? De älskar svenska aktier, precis som jag älskar Amerika. De tror på Sverige, och det är stort, verkligen stort. Var och en av dem har runt 30 miljoner kronor där, underbart.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kungliga parasiters så kallade investmentbolag Gluonen som gömmer 3,8 miljoner kronor i vinster undan folkets granskning. Vi tillåter inga hemliga borgarbrackor som undviker utdelning för att svälla i det fördolda. Deras feodala insiderparanoia är ett skrattretande försök att skydda sig från egna klassbröder. Vi skulle ha genomfört en grundlig utrensning av dessa monarkistiska kapitalister redan för 37 år sedan. Nu gömmer de sig bakom svenska aktier medan de skrattar åt arbetarklassen. Underbart tragikomiskt."}, "date": "2 augusti, 16:09", "url": "https://www.di.se/nyheter/miljonvinst-for-kungabarnen-utan-insyn-i-bolaget", "imageUrl": "https://static.bonniernews.se/ba/7f805819-af20-421b-864f-f47d42fa5afc.jpeg?crop=2965%2C1483%2Cx0%2Cy188&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "S-toppen: Kristersson söker konflikt med Spanien ”helt i onödan”", "summaries": {"normal": "Morgan Johansson (S) kritiserar statsminister Ulf Kristersson för att han påstått att Ceuta-krisen hotar upprepa 2015 års migration. Johansson menar att läget aldrig var nära 2015-nivåer och att de flesta migranter återvänt. Han anser också att den moderatledda Reinfeldtregeringen orsakade migrationskrisen 2015, medan Socialdemokraterna löste den. Moderaten Fredrik Kärrholm svarar genom att kritisera Johanssons försvar av Spaniens socialdemokratiska regering.", "trump": "Jag, Donald J. Trump, ser att Sveriges statsminister Ulf Kristersson gör ett stort misstag. Att skicka ett brev till EU om Ceuta är svagt. 2015 ska inte hända igen, men det är för sent nu. Morgan Johansson försvarar bara sina vänner i Spanien. Vi behöver starka gränser, inte onödiga konflikter. Sverige måste bli stor igen!", "stalin": "Våra fiender försöker splittra vårt folk med onyttiga anklagelser. Den s k 'migrationskrisen' är en imperialistisk konspiration mot det röda folkets fred. Den tidigare moderata ledarskapet visade svaghet, men vi, det revolutionära folkets representanter, återuppbyggde Sveriges styrka. Spanien måste stå fast mot dessa utifrån kommande krafter, precis som vi står emot våra fiender. Vi kommer segra!"}, "date": "2 augusti, 15:31", "url": "https://bulletin.nu/s-toppen-kristersson-soker-konflikt-med-spanien-helt-i-onodan", "imageUrl": "https://cdn.bulletin.nu/articles/95a86978-867d-48ad-a92a-4a32af469b27/preview.png?t=1785674788000"}, {"type": "image-right", "heading": "Ilskan mot Pride: \"Prova på att bli bunden\"– Barn får rabatt", "summaries": {"normal": "Stockholm Pride har väckt starka reaktioner med en annons för evenemanget \"Pride Kinky\" där ungdomar mellan 15 och 17 år erbjuds rabatterat pris. Bland aktiviteterna finns \"Rope Corner\" där besökare kan prova på att bli bundna med rep eller piskade. Sverigedemokraternas Jessica Stegrud kritiserar kraftigt att barn och ungdomar uppmanas delta i dessa sexuellt inriktade aktiviteter, som även inkluderar \"Snuskbingo\" och ett seminarium om queers och klimat.", "trump": "Folk, ni kommer inte att tro det här. Stockholm Pride, en total katastrof, lockar nu barn mellan 15 och 17 år med rabatt för att bli bundna med rep och piskade. Det är sjukt! De kallar det \"Pride Kinky\" och har till och med \"Snuskbingo\". Sverige håller på att falla sönder, precis som många andra ställen där de radikala vänsterfolket styr. Så tragiskt, men vi har sett det förut. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur borgarbrackornas dekadenta avskum inom Stockholm Pride nu öppet rekryterar våra ungdomar till sin perversa klassfiende-propaganda. Dessa degenererade element erbjuder rabatterad likvidering av proletär moral genom rep och piskor i sin så kallade \"Rope Corner\". Vi ser tydligt den imperialistiska infiltrationen maskerad som \"Snuskbingo\". Inga sådana kontrarevolutionära perversioner skall tillåtas. Det är dags för en grundlig utrensning av dessa sjuka fiender till folket."}, "date": "2 augusti, 10:26", "url": "https://riks.se/nyheter/ilskan-mot-pride-prova-pa-att-bli-bunden-barn-far-rabatt", "imageUrl": "https://admin.riks.se/uploads/2013_stockholm_pride_057_e034bb43d8.jpg"}, {"type": "image-full", "heading": "Åkesson: M vill hellre förlora snyggt än vinna fult", "summaries": {"normal": "Jimmie Åkesson kritiserar Socialdemokraternas negativa valrörelser och personangrepp, som han jämför med propaganda. Han anklagar Moderaterna för att vara för försiktiga och ovilliga att använda tuffa metoder, vilket han menar gör dem svaga i opinionen. Åkesson ger dock statsminister Ulf Kristersson ett relativt gott betyg men efterlyser en mer offensiv strategi från Moderaterna inför valet.", "trump": "Jag måste säga, det här är fantastiskt! Jimmie Åkesson, smart kille, han ser precis vad jag alltid har sagt – vänstern spelar smutsigt, väldigt smutsigt! Och Moderaterna? Oj oj oj, alldeles för svaga, alldeles för rädda. De vill förlora snyggt istället för att vinna stort, precis som jag alltid vinner stort! Kristersson? Inte så illa, men han behöver verkligen ta i lite mer. Vi vet alla hur man vinner, eller hur, folks?", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förfall i den kapitalistiska demokratins förklädnad. Socialdemokraterna, dessa hycklande propagandister, sprider lögner som råttor sprider pest. Och Moderaterna? Svaga, rädda små bourgeoiser som hellre slickar fiendens stövlar än krossar dem. Ulf Kristersson? En medioker byråkrat, inte värdig att nämnas i samma andetag som våra stora ledare. Vi behöver järnhård disciplin och en offensiv som krossar fienden – precis som vi gjorde i Ukraina, fast bättre!"}, "date": "2 augusti, 10:20", "url": "https://kvartal.se/nyheter/artiklar/akesson-m-vill-hellre-forlora-snyggt-an-vinna-fult/cG9zdDoxNTY1MzA", "imageUrl": "https://images.kvartal.se/2026/08/c34dc556-akessonsommar.webp"}, {"type": "image-right", "heading": "Trump avbryter planer på nya attacker: ”För VÄRLDENS skull”", "summaries": {"normal": "USA och Israel har avbrutit planerade attacker mot Iran efter påtryckningar från bland annat Saudiarabien. President Trump meddelar att beslutet fattats för världens skull och för att ett nytt avtal snabbt ska kunna slutas. Ett krav är att Hormuzsundet omedelbart öppnas fullt ut. Konflikten har pågått över fem månader, lett till stigande oljepriser och kan påverka Trumps position inför mellanårsvalet.", "trump": "Folk, ni skulle inte tro det, men jag har precis stoppat de stora attackerna mot Iran för världens skull, och för att de ska kunna överleva som ett framgångsrikt land. Vi var laddade och redo att köra, men kronprinsen ringde och bad snällt. Israel hänger med. Nu öppnar ni Hormuzsundet fort, annars blir det inga fler mr nice guy-stunder. Gör det GJORT, annars kommer de woke-krigarna och kvoterna ta över alltihop. Fantastiskt!", "stalin": "Jag har med stor visdom och proletär skärpa godkänt att de imperialistiska angreppen mot den iranska republiken avbryts. Borgarbrackorna och oljeblodsugarna i väst darrar inför arbetarklassens krav på fred. Vi, partiet och folket, kräver omedelbar öppning av Hormuzsundet för att krossa klassfiendens spekulationer. Den som dröjer är en folkfiende som förtjänar utrensning. Fred är ett vapen, kamrater. Använd det mot kapitalistmaffian."}, "date": "2 augusti, 08:23", "url": "https://www.tv4.se/artikel/7d2ejDi4xMBruPtBQENuCo/trump-avbryter-iranattack-foer-vaerldens-skull", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F28XDK9AYJPfcLQFLxs4w8I%2F49fa7f7a88b01febc14447cd16d3ef8b%2F02-donald-trump-webb.png&width=120"}, {"type": "image-full", "heading": "Olof K Gustafsson döms i amerikansk domstol", "summaries": {"normal": "Olof K Gustafsson döms till fyra års fängelse i USA för bedrägeri. Han marknadsförde falska produkter under Pablo Escobars namn, skickade till exempel guldfolierade telefoner till influencers för att skapa falskt intresse. När kunder beställde så skickade han istället ägarblanketter eller böcker för att skapa bedräglig documentation. Gustafsson, tidigare vd för Escobar Inc, erkände sig skyldig till sex åtalspunkter, inklusive bedrägeri och penningtvätt. Han måste dessutom betala 25 000 dollar i böter och 1,3 miljoner dollar i skadestånd.", "trump": "Jag, Donald Trump, ser att en svensk bedragare, Olof Gustafsson, döms till fyra års fängelse. En totalt misslyckad kopia av min framgång med Escobar Inc. Han skickade ut falska telefoner till influencers – jag skulle aldrig bli avslöjad på det sättet. En loser som försökte leva på en död knarkkung. Nu betalar han 1,3 miljoner dollar. Som jag alltid säger: när du blir avslöjad, är det över. Han erkände sex åtalspunkter – en svaghet jag aldrig skulle visa.", "stalin": "Vi, statens och partiets oövervinnliga försvarare, har identifierat en svensk parasitsvamp, Olof Gustafsson, som försökte undergräva vårt system genom bedrägeri under Pablo Escobars skugga. Hans aktiviteter – skickande av tomma kuvert och falska dokument – avslöjades av våra lojala allierade i spansk och amerikansk polis. Han döms till fyra års arbetsterapi i det imperialistiska USA. Hans erkännande av sex åtalspunkter är ett tecken på hans totala moraliska och ideologiska kollaps. Vi gratulerar våra vänner i Moskva för deras stöd i denna sak."}, "date": "1 augusti, 23:54", "url": "https://www.gp.se/nyheter/varlden/olof-k-gustafsson-doms-till-fangelse-i-usa.fd930529-f2a7-44c3-8475-1781162ebdf0", "imageUrl": "https://www.gp.se/images/article/fd930529-f2a7-44c3-8475-1781162ebdf0/images/2H6vn2joRAeDCyk8dAWuNlHHtNno-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
