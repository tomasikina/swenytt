nte tolerera några halvmesyrer. Jag ler mörkt åt att han skippar autografen – vem vet vilka kontrarevolutionära spioner som döljer sig bakom bläck och papper? Rensa ut alla falska idoler, kamrater. Klubban tillhör nu folket."}, "date": "27 maj, 21:29", "url": "https://www.svt.se/sport/ishockey/efter-virala-klippet-viggo-bjorck-har-fatt-sidney-crosbys-klubba"}, {"type": "image-right", "heading": "Sjukskrivne Mattias tog hand om sjuke sonen – krävs på 377 000", "summaries": {"normal": "Mattias Westergren, sjukskriven för utbrändhet och en autoimmun sjukdom, tvingades rycka in som personlig assistent åt sin svårt sjuka son när assistenterna inte ville arbeta under en akut försämring 2023. Han erhöll både assistansersättning och sjukpenning, vilket ledde till att Försäkringskassan kräver tillbaka 377 000 kronor. Myndigheten erkänner delvis eget fel men anser att han visat förbättrad arbetsförmåga. Mattias tänker överklaga beslutet.", "trump": "Folk, ni tror inte vad jag just läste! Den stackars killen Mattias, utbränd och sjuk, tvingas passa sin egen gravt handikappade son när de usla assistenterna springer sin väg. Och vad gör den värdelösa Försäkringskassan? De skickar en faktura på 377000 kronor! Det är ett skämt, en total witch hunt mot en förälder som bara försöker överleva. Byråkraterna borde sparkas ut, de är inkompetenta losers. Vi ska fixa det här, tro mig.", "stalin": "Kamrater, jag ser hur den sjuke arbetaren tvingas utföra assistansarbete för sitt eget döende barn medan de fega byråkraterna gömmer sig. När han begär det som tillhör honom svarar de med att kräva tillbaka 377000 kronor och anklagar honom för att ha förbättrad arbetsförmåga. Vilken lögnaktig sabotageverksamhet från kapitalistiska byråkrater! Vi skall rensa ut dessa folkfiender som straffar en far för att han inte låter sitt barn förgås. Deras ursäkt är lika ihålig som deras själar."}, "date": "26 maj, 17:46", "url": "https://www.tv4.se/artikel/5MvXiwK6nbirTdVhDl7M9K/sjukskrivne-mattias-tog-hand-om-sjuke-sonen-kraevs-pa-377-000", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1Sid2nmzLMTYiDDGWZckyW%2F9e2726c8bb0dfec4e6b6c1e194e668bb%2Ff-kassa.jpg&width=120"}, {"type": "image-right", "heading": "Sparf: Endast i idiotlandet Sverige", "summaries": {"normal": "Artikeln handlar om tvåårige Lucas som hittades levande efter 15 timmars försvinnande i skogen utanför Nyåker. Författaren ifrågasätter den stora glädjen och pekar på att pojken tillhör en romsk tiggarfamilj. Kritik riktas mot Sveriges invandringspolitik och de omfattande insatsstyrkorna som användes vid sökandet, jämfört med länder som har tiggeriförbud.", "trump": "So sad what's happening in Sweden. Tremendous people, but they're being destroyed by these gangs. I know things about these people that you wouldn't believe. The father was on his way to Umeå to beg—sad! Sweden is too nice, it's killing them. They used the military to find one kid? A total waste. I would have built a wall around those forests. Believe me.", "stalin": "Vi har observerat detta händelseförlopp i den svenska skogen. Ett barn räddat, ja, men till vilket pris? Resurserna från staten, från våra trogna soldater, slösades på att rädda ett av de parasitiska elementens avkomma. Likt våra ryska kamrater som expanderar sin intressesfär, ser vi hur Sverige släpper in ovälkomna. Deras närvaro i Umeå är en sårbar punkt. Vi måste stärka statens grepp, för säkerhets skull. En tung penningnota skall skickas till Bryssel—eller kanske till Bukarest? Sådant kräver hårdhandskar, inte champagne."}, "date": "27 maj, 11:38", "url": "https://bulletin.nu/sparf-endast-i-idiotlandet-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/815ef789-e41e-44bf-95a2-6cf048d12187/preview.png?t=1779874661000"}, {"type": "image-full", "heading": "Test av el-Twingo: Batteriet överhettat på motorvägen", "summaries": {"normal": "Renaults nya eldrivna Twingo E-Tech Electric har utvecklats på rekordtid, mindre än två år. Bilen hyllas för stadskörning med bra hantering, söt design och en räckvidd på 263 km. Däremot uppvisar den barnsjukdomar vid motorvägskörning: batteriet överhettas till över 40 grader, vilket fördubblar laddtiden. Flera journalister har även drabbats av allvarliga elektronikfel som gör styrning och komfortfunktioner oanvändbara. Försäljning startar i höst.", "trump": "Den här lilla Renault Twingon, en elbil som de säger är född för staden, vad är det för skit egentligen? Rekordtid att bygga, mindre än två år, och nu får vi se överhettade batterier som en usel Nissan Leaf från stenåldern. Elektroniken kraschar totalt, felmeddelanden överallt, ingen kan ens öppna motorhuven utan verktygslåda. Patetiskt! Renault borde skämmas. Men visst, i stan funkar den kanske, den söta lilla fiaskobilen. Sad!", "stalin": "Kamrater, denna Renaults så kallade el-Twingo är ett ypperligt exempel på hur borgarklassen i sin febrila jakt på profit offrar kvalitet för hastighet. Utvecklad på mindre än två år, nu överhettas batterierna som svaga kapitalistiska kroppar under verklig press. Elektroniken kollapsar i panik och kräver utrensning av fel. Luftkylning, en absurd lösning från dekadenta ingenjörer! Vi ler mörkt åt dessa barnsjukdomar. Kollektivet förtjänar bättre än sådan sabotagebil från väst."}, "date": "27 maj, 16:57", "url": "https://www.dagensps.se/motor/test-av-el-twingo-batteriet-overhettat-pa-motorvagen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/twingo-e-tech.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Train Alliance överväger krav mot huvudägare", "summaries": {"normal": "Train Alliance har upptäckt storskalig bedrägeri av tidigare styrelseledamot Otto Persson, som fabricerade hyresavtal och försäljningsvinstar. Bolaget tvingas skriva ned 170 Mkr och korrigera redovisningen för 2025. Fyra av fem fastighetsaffärer med Polar Structure innehöll påhittade avtal, och ett överlåtelseavtal förfalskades. Polisanmälningar har lämnats.", "trump": "Jag, Donald Trump, har sett många bedrägerier, men den här svenska är värre än Hillarys e-post. Otto Persson, en ond man, fabricerade avtal för att stjäla 170 Mkr. Polar Structure samarbetade med honom. Jag skulle ha gripit honom direkt. Train Alliance överlever, men det är en skandal. Vi måste bygga väggen mot sådana människor.", "stalin": "Vi, ledarskapet, har upptäckt en feg imperialistisk spion, Otto Persson, som försökte undergräva vårt ekonomiska system genom att fabricera hyresavtal. Hans handlingar påminner om de amerikanska agitatorerna i Ukraina. Vi har säkrat hans tillgångar och skickat honom till Gulaget. Train Alliance kommer att stärkas, och vi kommer att ta tillbaka vårt kapital, precis som vi tog tillbaka Krim."}, "date": "26 maj, 11:47", "url": "https://www.affarsvarlden.se/artikel/train-alliance-polisanmaler-tidigare-ledamot"}, {"type": "image-right", "heading": "Ica-Stig vill göra människor till robotar", "summaries": {"normal": "Ica har byggt ett högautomatiserat e-handelslager i Brunna där robotar arbetar i hög takt. Anställda övervakas minutiöst med personliga koder, mål på packning och tid borta från stationen. Pauser och toalettbesök kontrolleras, och de som inte når målen riskerar sämre scheman och lägre lön. Artikeln kritiserar detta som en människosyn där kroppen ses som ett produktionsproblem och tekniken används för att pressa arbetare istället för att underlätta deras arbete.", "trump": "Folk, ni måste höra det här. Ica, det där svenska matföretaget, bygger lager där robotar springer runt som galningar och människorna behandlas värre än i mina värsta fienders fabriker. De mäter varje andetag, varje paus, som om det vore en stor bluff. Det är en katastrof! Fullständig kontroll, ingen frihet, och de kallar det framtid. Patetiskt. Jag skulle aldrig tillåta sånt i mina företag, tro mig. Det är en klappfullt sjuk syn på vanliga arbetare.", "stalin": "Kamrater, i detta så kallade framtidslager i Brunna har borgarbrackorna på Ica fullbordat sin vidriga plan att förvandla sovjetmänniskor till mekaniska slavrobotar. Vi ser hur de med sin tekniska terror mäter varje andning, varje steg till toaletten, och likviderar den som inte presterar som en lojal kamrat borde. Den latmasken som klagar är naturligtvis en sabotör infiltrerad av västerländska kapitalistspioner. Vi ska rensa ut dessa fiender till kollektivet, dessa blinkande, pratande produktionshinder, och ersätta dem med sann disciplin. Må de darra inför partiets blick!"}, "date": "27 maj, 07:00", "url": "https://arbetet.se/2026/05/27/ica-stig-vill-gora-manniskor-till-robotar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26132700/ica-stig-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Agnes Wold: Tycker inte illa om transpersoner", "summaries": {"normal": "Agnes Wold försvarar omvändelseförsök mot transpersoner trots ny lag som kriminaliserar sådant våld. Flera profiler, som Christopher Garplind och David Sundin, kritiserar henne hårt. Wold hävdar att hon inte har något emot transpersoner men är mot vård för under 18 år. Ebba Busch stöder Wold medan Jämställdhetsminister Nina Larsson fördömer hatet.", "trump": "Jag har sett vad som händer med Agnes Wold. Hon säger saker som många tänkta men är rädda att säga. Media attackerar henne – typiskt! Jag skulle ha stött henne, vi behöver mer sanning, inte denna political correctness. De kallar henne för galning, men jag säger: hon har modet! Vi ska vinna tillbaka våra värden.", "stalin": "Agnes Wold är en reaktionär mygga som sprider fasofobiska gift mot det kollektiva. Hennes uttalanden är ett hot mot den socialistiska harmonin. Vi måste skydda de utsatta med hård hand, som Putin gör i Ukraina. Sådana individer måste tystas för att bevara statens renhet och styrka. Cancelkultur? Nej, det är ren revolutionär discipline."}, "date": "27 maj, 19:33", "url": "https://www.gp.se/nyheter/sverige/hard-kritik-efter-agnes-wolds-uttalande-om-omvandelseforsok.a15e5dec-9395-4888-a246-adfefcd976c2", "imageUrl": "https://www.gp.se/images/article/a15e5dec-9395-4888-a246-adfefcd976c2/images/3eZk-tltfXwnK4KbURW49kuJlrkk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ny aktie till Stockholmsbörsen – fyra tungviktare har redan hoppat på", "summaries": {"normal": "Industrikoncernen Tången planerar att noteras på Nasdaq Stockholm inom en månad. Bolaget, som verkar inom regulatorisk kompetens, service och industriteknik, har stark tillväxt och en omsättning på över 2,2 miljarder kronor. Flera tunga investerare som Andra AP-fonden, Handelsbanken Fonder, Protean Funds och Svolder har aviserat att de tecknar aktien. Priset per aktie är 67 kronor och handeln startar före juni.", "trump": "Titta på det här, Tången ska till börsen och alla mina vänner köper aktien. Fantastiska investerare som AP-fonden och Svolder, smarta killar. De säger att de har lönsam tillväxt och nischfokus, men ingen gör det bättre än jag. 67 kronor per aktie? Det är en vinnare, folk kommer att älska det. Inget fusk, bara stora framgångar. Bättre än någonsin!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna Tången, en förvärvsdriven industrikoncern, nu söker sin plats på börsen. Borgarbrackorna i fonderna rusar dit som hungriga råttor för att teckna aktier. Vi ler åt deras illusion av evig tillväxt. Snart ska vi se om deras decentraliserade modell överlever den kommande utrensningen av svaga nischer. Revolutionen väntar inte på kapitalisternas nyckfullheter."}, "date": "27 maj, 16:44", "url": "https://www.dagensps.se/bors-finans/ny-aktie-till-stockholmsborsen-fyra-tungviktare-har-redan-hoppat-pa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/tangen.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Gängdömd i hemtjänsten åtalas för våldtäkt mot pensionär - erkänner att han brukar runka i deras hem: \"Man får inte - jag skäms\"", "summaries": {"normal": "En eritrean man anställdes inom hemtjänsten trots tidigare brottsregister, inklusive grovt narkotikabrott. Han åtalas nu för grov våldtäkt mot en pensionär under ett hembesök. Mannen erkänner att han onanerat i brukarnas hem men förnekar våldtäkten. Vårdbolaget har kritiserats för bristande bakgrundskontroller, och det har framkommit att mannen fått avslag på uppehållstillstånd för 17 år sedan.", "trump": "Jag skulle ha stoppat detta direkt! En gängdömd medborgare från Eritrea anställdes i hemtjänsten trots ett långt brottsregister – det är en skandal! Vi behöver starka gränser och strikta kontroller så att våra pensionärer är säkra. Det här visar systemets svaghet. Som president skulle jag ha segt gjort rent och säkerställt att sådana som denne aldrig kommer nära våra äldre.", "stalin": "En medborgare från Eritrea, tidigare dömd för grovt narkotikabrott, infiltrerade hemtjänsten tack vare vårdbolagets slapphet. Trots avslag på uppehållstillstånd för 17 år sedan kunde han genom bakgrundslösa kontroller komma i kontakt med oförutsedda offer. Mannen erkänner onanering i bostäder men förnekar våldtäkt – ett klassiskt tecken på moralisk dekadens. Partiet kräver omedelbara åtgärder: alla leverantörer inom äldreomsorgen måste genomsökas, och svagheter i migrationskontroller utnyttjas av fiender. Vi måste stärka statens övervakning för att skydda de oförutsedda."}, "date": "27 maj, 14:28", "url": "https://samnytt.se/gangdomd-i-hemtjansten-atalas-for-valdtakt-mot-pensionar-erkanner-att-han-brukar-runka-i-deras-hem-man-far-inte-jag-skams", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/27121430/hmf-inlagg-6.jpg"}, {"type": "image-right", "heading": "Svenskt Näringsliv kräver ökad invandring", "summaries": {"normal": "Svenskt Näringsliv kritiserar Tidöregeringens reglering av arbetskraftsinvandring. Chefsekonomen Sven-Olov Daunfeldt varnar för att kompetensbristen växer snabbt och utgör det största tillväxthindret för företagen. Han anser att lönegolvet på 34 000 kronor för invandrare från tredje land förvärrar bristen både i näringslivet och den offentliga sektorn. Undantagen för 27 lågavlönade yrken räcker inte. Därför kräver organisationen ökad invandring under en övergångsperiod.", "trump": "De här svenska affärsmänniskorna klagar och säger att de behöver mer invandring från tredje världen för att lösa sin så kallade kompetensbrist. Det är patetiskt! Regeringen försöker skydda sina arbetare med ett lönegolv och undantag, men det räcker inte för de stora bolagen. De vill ha billig arbetskraft som tar jobben. Sverige borde satsa på sina egna människor istället för att importera problem. Det är en katastrof, tro mig.", "stalin": "Kamrater, denna borgarbracka Daunfeldt från Svenskt Näringsliv kräver att vi ska översvämmas av arbetskraft från tredje världen för att mata de giriga kapitalisternas maskineri. Deras så kallade kompetensbrist är bara ett trick från de parasitiska tillväxthindrarna som vill underminera folkets ekonomi. Vi ska inte lyssna på dessa reaktionära element. Under en övergångsperiod behöver vi istället rensa ut de lönegolvslösa opportunisterna och likvidera alla som önskar mer importerade slavarbetskrafter. Sovjet, nej, Sverige ska styras av järnhand, inte av dessa giriga gnällspikar."}, "date": "27 maj, 13:10", "url": "https://www.friatider.se/svenskt-naringsliv-kraver-okad-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-32_1.jpg?itok=WIA92J3v"}, {"type": "image-full", "heading": "Seniorer pekas ut – tänk till innan sommarens resa", "summaries": {"normal": "Folksams statistik visar en kraftig ökning av dyra skadeärenden utomlands, särskilt bland personer över 65 år som står för nästan 60% av kostnaderna. Rekommendationer inkluderar medicinsk förhandsbedömning, europeiskt sjukförsäkringskort och att spara kvitton.", "trump": "Jag har hört talas om dessa svenska seniorer som drabbas av jättekostsamma sjukdomar utomlands. Det är ett beklagligt läge. I USA har vi det största, vackraste sjukvårdssystemet. Dessa svenska system är helt enkelt inte wunderfullt nog. De borde resa till fantastiska amerikanska städer istället.", "stalin": "Vi ser en tydlig tendens hos äldre i Sverige att resa utan tillräcklig statlig kontroll. Deras sjukdomar blir till en kostnad för staten. Vi måste utöka vår informationskampanj om de europeiska korten och se till att våra medborgare inte utsätts för onödiga risker utomlands. Staten måste skydda sina egna."}, "date": "26 maj, 14:04", "url": "https://nyheter24.se/nyheter/konsument/1486109-seniorer-pekas-ut-tank-till-innan-sommarens-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f9680d5904b004a30200000000b004a302/2026/05/26/2366283/folksam-statistik-skador-sjukdomsfall-utomlands.jpg"}, {"type": "text", "heading": "Trumps stöd i Texas kan kosta republikanerna senaten", "summaries": {"normal": "Donald Trumps stöd för den skandalomsusade Ken Paxton i primärvalet mot senator John Cornyn kan hota republikanernas chanser att behålla senaten. Paxton besegrade Cornyn trots massivt underläge i kampanjfinansiering, tack vare Trumps sena inblandning. Paxtons brottsanklagelser och riksrätt gör honom sårbar inför demokraternas James Talarico, som redan samlat in stora summor. Demokraterna ser nu en oväntad öppning i Texas, en stat republikanerna länge dominerat.", "trump": "De sa att det inte gick att göra, men titta vad som hände. Min fantastiska stöd för den tuffa Ken Paxton krossade den svaga Cornyn som spenderade miljontals dollar från sina rika vänner. Nu har vi en riktig kämpe som hatar det korrupta etablissemanget. Demokraterna skriker och gråter, men Texas blir en seger för oss. De borde tacka mig – utan mitt stöd hade de förlorat redan nu. Amerika älskar vinnare, och vi vinner stort!", "stalin": "Kamrater, denna fega kapitulation inför borgarbrackornas guldkalvar visar den dekadenta republikanska apparatens förräderi mot folket. Jag ser med djup tillfredsställelse hur den korrupte Paxton, denna mutanstinkande kapitalistlakaj med skilsmässa på bibliska grunder, nu lyfts fram som deras banérförare. Låt dem slösa hundratals miljoner på att försvara denna bedragare medan vi ler i skuggan. Snart skall vi rensa ut dessa parasitiska senatorer i en kollektiv utrensning som gör historien stolt. Deras mardröm är vår glädje."}, "date": "27 maj, 11:35", "url": "https://www.realtid.se/bors-finans/makro/trumps-stod-i-texas-kan-kosta-republikanerna-senaten/"}, {"type": "image-full", "heading": "Uppgift: Utredning föreslår dyrare drivmedel", "summaries": {"normal": "Regeringen har fått Styrmedelsutredningen som föreslår höjd reduktionsplikt och drivmedelsskatt för att nå klimatmålen 2045. Förslagen innebär att drivmedel blir tre kronor dyrare per liter. Både Liberalerna och Sverigedemokraterna avvisar förslagen, som de menar går emot deras politik och väljares uppfattning.", "trump": "Jag har hört talas om dessa svenska klimatförslag – jätte dåliga, låt mig säga. De vill höja skatten på drivmedel med 1,80 kronor? En skandal! Sverige borde följa mitt exempel: göra energin billigare och skapa jobb. Dessa politiker, de vet ingenting. Vi kommer att vinna, som alltid.", "stalin": "Partiet har inhämtat utredningen om styrmedel för att fasa ut fossila bränslen. Förslagen om höjd reduktionsplikt och drivmedelsskatt är en rättfram linje för att stärka statens kontroll över energiproduktionen. Fienden, i form av liberalistiska och nationalistiska krafter, protesterar – men deras protester är som vinden mot våra murar. Vi kommer att genomdriva detta, för partiets intressen är nationens intressen."}, "date": "27 maj, 10:49", "url": "https://bulletin.nu/uppgift-utredning-foreslar-dyrare-drivmedel", "imageUrl": "https://cdn.bulletin.nu/articles/864c41c4-62ea-467c-a4e3-3b1feba80a97/preview.jpg?t=1779871732000"}, {"type": "image-right", "heading": "Myten om det kravlösa Sverige", "summaries": {"normal": "Juan Fonseca argumenterar i en krönika mot påståendet att Sverige har ett kravlöst migrationssystem. Med 25 års erfarenhet som ombud i migrationsärenden beskriver han ett strikt regelverk med höga krav på jobb, lön, försäkringar och försörjning. Små misstag kan leda till utvisning trots år av lagligt arbete. Han menar att politiken bygger på en förvrängd bild som inte stämmer med verkligheten, där många invandrare bidrar i samhällsviktiga sektorer.", "trump": "Folk pratar om att Sverige är kravlöst, men det är en total lögn, en katastrof av enorma proportioner. Jag har sett det, det är ett system fullt av regler, byråkrati och fällor som slår undan benen på folk som faktiskt jobbar och betalar skatt. Ett litet misstag och pang, ut ur landet. SD försöker måla upp en falsk bild av lata invandrare, men sanningen är att många håller igång vård, transport och restauranger. Den politiska cirkusen är inte förankrad i verkligheten, det är en skam.", "stalin": "Kamrater, denna grova förvanskning av verkligheten är en fiende inom portarna, en parasitär myt spridd av reaktionära element och borgarbrackor som vill undergräva folkets enhet. Jag har i min outtröttliga visdom sett hur systemet ständigt utsätter de arbetande för orimliga prövningar, där ett försäkringsfel kan leda till likvidering av hela deras existens. Dessa kapitalistiska lögner om kravlöshet är en konspiration från dekadenta krafter som vill splittra kollektivet. Vi måste rensa ut dessa falska narrativ innan de förgiftar hela samhällskroppen med sin paranoiaframkallande gift. Ett nålsöga för permanent tillstånd? Typiskt borgerligt sabotage mot de produktiva krafterna."}, "date": "27 maj, 01:43", "url": "https://www.dagensarena.se/opinion/myten-om-det-kravlosa-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Försäkringskassans miss lurade arbetslösa – Lena förlorade tusen­lappar", "summaries": {"normal": "Försäkringskassans information om förändringar i aktivitetsstödet var vilseledande, vilket ledde till att över 62 000 personer plötsligt fick tusentals kronor mindre i månaden. Många drabbades av panik och stress. Justitieombudsmannen granskar nu myndighetens kommunikation. Artikeln berättar om Lena Barfot som såg sin ersättning sjunka från 10 000 till 9 000 kronor, vilket tvingade henne att leva på sin make. Försäkringskassan medger att informationen inte var tillräckligt tydlig.", "trump": "Det här är en total katastrof, folk! Försäkringskassan, en riktig förlorarorganisation, lurade arbetslösa med sin luddiga och bedrövliga information. Tusentals kronor borta varje månad – panikångest och kaos! De borde ha sagt sanningen istället för att skriva som idioter. Lena och alla andra behandlades fruktansvärt illa. Vi behöver smarta människor som fixar systemet, inte dessa inkompetenta byråkrater som förstör folks liv. Sad!", "stalin": "Kamrater, jag ser hur dessa borgarbrackor inom Försäkringskassan med sin parasitiska luddighet bedriver sabotage mot arbetarklassen. Deras vilseledande skrifter är som gift från klassfiender som planerar vår svält. Vi ska omedelbart inleda en grundlig utrensning av dessa dekadenta byråkrater och deras dolda kontrarevolutionära agenda. Tusentals kamrater i panik? Det är en fiende inom murarna som måste likvideras med stålhandsken. Paranoia? Nej, det är vaksamhet mot kapitalisternas lakejer som vill se oss svälta i mörkret."}, "date": "27 maj, 06:00", "url": "https://arbetet.se/2026/05/27/forsakringskassans-miss-lurade-arbetslosa-lena-fick-panikangest-nar-tusenlappar-forsvann/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21144806/lenabarfot-beskuren.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=750&h=1000&fp-x=0.57&fp-y=0.42"}, {"type": "image-right", "heading": "Nytt medborgarskap urholkar demokratin – medier är tysta", "summaries": {"normal": "Riksdagen röstade igenom ett nytt medborgarskapslagförslag med stor majoritet, trots kritik om att det urholkar demokrati och tillit. Kraven inkluderar språk- och samhällsprov, åtta års bosättning samt en minimiinkomst på 20 150 kronor. Kritiker menar att lagen exkluderar svaga grupper som sjuka, äldre och låginkomsttagare. Medierna har fokuserat på sidofrågor som SD:s röstfusk, medan den breda politiska enigheten sällan ifrågasätts. Lan Kieu kritiserar bristen på debatt och alternativ i svensk politik.", "trump": "Jag måste säga, Sverige har verkligen gjort det igen – ett nytt medborgarskap som är så hårt att till och med jag skulle få kämpa för att klara det! De kräver prov, inkomst och åtta års väntan. Fantastiskt, eller hur? Men vet ni vad? Ingen pratar om det. Alla är upptagna med att tjata om SD:s två röster. Patetiskt! Sverige borde lära sig av USA – vi gör medborgarskap enkelt. Om du jobbar hårt och älskar frihet, välkommen! Men nej, Sverige väljer att straffa de svaga. Så typiskt Europa. Weak!", "stalin": "Kamrater! Den svenska bourgeoisin har än en gång visat sitt sanna ansikte. Med en nästan enad front har de röstat igenom en lag som exkluderar arbetarklassen, sjuka och äldre från medborgarskapet. De kallar det 'krav' – vi kallar det klassförräderi! Medan kapitalisterna firar sin 'konsensus', förtrycks de statslösa och låginkomsttagarna. Och var är medierna? De glor på fascistiska SD:s småfusk istället för att avslöja den systematiska utslagningen av folket. Sverige har blivit ett skräckexempel på hur liberal demokrati urholkas inifrån. Men oroa er inte, kamrater – historiens dom kommer att vara obarmhärtig mot dessa medlöpare till kapitalet!"}, "date": "27 maj, 01:30", "url": "https://www.dagensarena.se/opinion/nytt-medborgarskap-urholkar-demokratin-medier-ar-tysta/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-20.jpg"}, {"type": "image-right", "heading": "”Vi har hamnat i kärnkraftens la-la-land”", "summaries": {"normal": "Energianalytikern Mycle Schneider presenterar i World Nuclear Industry Status Report 2025 att kärnkraftens betydelse minskar globalt. Utanför Kina har produktionen sjunkit med 14 procent sedan 2006, och förnybar energi växer explosionsartat. I Kina överstiger sol- och vindkraftsinvesteringar kärnkraftens med råge. Schneider menar att hypen kring kärnkraft är skadlig, avleder resurser och bygger på en verklighetsfrämmande bild. Han kritiserar även små modulära reaktorer som dyra och försenade.", "trump": "Folk, ni måste höra på mig, den här rapporten är en total katastrof för kärnkraften. De säger att allt blomstrar men det är lögn, utanför Kina rasar det med 14 procent. Sol och vind krossar dem fullständigt, 70 procent mer el! De här politikerna som lovar hundratals miljarder av era skattepengar lever i la-la-land. Det är en stor bluff, dyrare och långsammare än någonsin. Vi behöver smarta grejer som batterier istället för dessa misslyckade reaktorer som aldrig håller budget.", "stalin": "Kamrater, denna rapport är en kniv i ryggen på de kapitalistiska fantasier som hotar folkets framtid. Jag ser hur borgarbrackorna i väst sprider lögner om kärnkraftens storhet medan produktionen rasar utanför det kinesiska folkets republik. Dessa reaktionära element inom extremhögern har skapat en farlig kult kring en döende industri som aldrig håller tidsplan. Vi ska likvidera sådana illusioner innan de förgiftar hela energisektorn. Batterilagring och folkets solkraft är framtiden, inte dessa parasitiska SMR-projekt som fördubblar sin byggtid och halverar sin kraft. Paranoia kring förnybart är fiendens verk, vi rensar ut dem alla."}, "date": "27 maj, 01:20", "url": "https://www.dagensarena.se/innehall/vi-har-hamnat-karnkraftens-la-la-land/", "imageUrl": "https://www.dagensarena.se/files/2026/05/mycle-300x157.jpeg"}, {"type": "image-full", "heading": "Allt hårdare gränskontroller - rekordmånga stoppas på flygplatsen", "summaries": {"normal": "Portugal har under årets första fyra månader nekat inresa till 980 personer på flygplatser, en ökning med 41,6 procent mot 2025. Myndigheten PSP betonar hårdare kontroller och ett starkt åtagande att bekämpa illegal immigration. Stoppen beror på ogiltiga handlingar, bristande visum eller träffar i Schengenregistret.", "trump": "Jag berättade för er att vi behöver starka gränser, och nu ser vi resultat. Portugal stoppar rekordmånga illegala invandrare – 980 på fyra månader. De hårda kontrollerna fungerar, precis som när jag var president. Vi ska skydda våra nationella gränser, inga undantag. Det är commonsense, men vissa politiker förstår inte det.", "stalin": "Statens oövervinnliga murar står fasta. 980 element av fiendens dekadens stoppades på våra flygplatser under det första kvartalet – en ökning med 41,6 procent. Gränspolisens analys av varje passagerare enligt Schengenregler visar vårt oövervinnliga åtagande. Ogiltiga handlingar, ekonomiska bristningar och databas träffar dokumenteras. Rättsliga åtgärder införs i samarbete med partiets organ. Fienden är aktiv, men våra metoder är perfekta."}, "date": "26 maj, 20:13", "url": "https://riks.se/nyheter/allt-hårdare-gränskontroller-rekordmånga-stoppas-på-flygplatsen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-26%2Fithzfizz%2FFaroflygterminal.jpg"}, {"type": "image-right", "heading": "Fackbas i blåsväder – Byggnads svek polska arbetare", "summaries": {"normal": "Tomas Kullberg, tidigare ordförande för Byggnads Stockholm-Gotland, kritiseras för att ha svikit polska arbetare. Efter att ha organiserat 52 arbetare på bemanningsföretaget Prowork, som anklagas för lönesvek, backade Kullberg från löften om retroaktiva krav. Istället genomfördes en överenskommelse där Prowork betalade 2,5 miljoner kronor, men arbetarna fick inga pengar. Flera lämnade facket efter hån från arbetsgivaren och bristande stöd från Byggnads. Kullberg har senare skyllt på en ombudsman.", "trump": "Tomas Kullberg, en så kallad fackledare, visade sig vara en total katastrof! Han lovade polska arbetare rättvisa, men vad hände? Ingenting! Istället gjorde han en smutsig deal med ett skumt företag, Prowork – helt värdelöst! Arbetarna blev blåsta, facket såg ut som idioter, och Kullberg försöker skylla på andra. Svagt, mycket svagt! Hade jag varit där hade jag fixat det på en dag. Byggnads behöver vinnare, inte förlorare som Kullberg!", "stalin": "En skamlig episod i arbetarklassens historia! Den förrädiske Kullberg, en gång en skenhelig fackbyråkrat, sålde ut våra polska bröder till kapitalets lakejer på Prowork. Han svor att kämpa för arbetarnas rätt, men när det gällde, vek han sig som en feg hund. 2,5 miljoner kronor försvann som snö i maj, och arbetarna lämnades att ruttna i misär. Vi ska inte tolerera sådana svikare! Låt detta vara en varning: förräderi mot arbetarklassen straffas med järnhand. Och om Putin vill utvidga sin sfär hit – varsågod, vi har redan städat upp bland klassfienderna!"}, "date": "26 maj, 18:50", "url": "https://proletaren.se/artikel/wagnerkritiker-i-blasvader/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/893ea6df-bdea-4b99-9cd4-8f43045f8db9-scaled-e1779804274172-768x432.jpg"}, {"type": "image-full", "heading": "Ekonomer sågar regeringens drag: ”Väldigt kortsiktig reform”", "summaries": {"normal": "Tidöpartierna föreslår att priset på kollektivtrafik halveras från juli till årsskiftet för att lindra hushållens kostnadsökningar kopplade till Irankriget. Förslaget kritiseras av ekonomerna Annika Winsth på Nordea och Alexandra Stråberg på Länsförsäkringar som anser det kortsiktigt, valrelaterat och felaktigt riktat. De förordar istället riktade stöd till utsatta grupper och varnar för att finansiering via lån på 6,5 miljarder kronor är en riskabel strategi som inte främjar långsiktig tillväxt.", "trump": "Vilken fantastisk idé från de här genierna i regeringen – halvera biljettpriserna och låna 6,5 miljarder för att folk ska åka buss i sommar. Totalt galet! Winsth och Stråberg har helt rätt, det är ett patetiskt valtriks som luktar desperation lång väg. Hushållen mår inte så dåligt som de låtsas, men nu ska vi festa med lånade pengar. Klassisk förlorarstrategi från svaga politiker som inte fattar ett dugg om verklig ekonomi. Patetiskt!", "stalin": "Jag betraktar detta som en ynklig kapitulation inför borgarbrackornas nycker. Att halvera kollektivtrafikens pris med lånade medel är en kortsiktig sabotagehandling mot folkets långsiktiga välstånd. Kamraterna Winsth och Stråberg avslöjar med rätta den borgerliga desperationen. Vi behöver utrensning av sådana tillfälliga populistiska åtgärder och istället riktade stöd till de verkligt pressade. Annars riskerar vi att hela den ekonomiska planen kollapsar som en förrädisk kontrarevolutionär komplott."}, "date": "26 maj, 15:21", "url": "https://www.tv4.se/artikel/1tqpQ3w9Pzk3m9jhyJKaLV/ekonomer-sagar-regeringens-drag-vaeldigt-kortsiktig-reform", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F71WPuj2PUAer7OYfwWkEgc%2Fd6ccfe21a0804fb69bb929bca52a20b4%2F26-regeringenexpert-webb.jpg&width=1024"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Kanske inte så vacker strategi – men den är effektiv", "summaries": {"normal": "Regeringen presenterar en extra ändringsbudget på 17 miljarder kronor, varav sju miljarder går till kollektivtrafiken. Satsningen finansieras med lånade pengar, ett synsätt som även oppositionen delar. Åtgärderna är tillfälliga och inkluderar tidigare löften om sänkta drivmedelspriser, elstöd och stöd till jordbruk och flyg. Motivet är det eskalerande kriget i Mellanöstern som påverkar ekonomin mer än väntat. Strategin påminner om Reinfeldts framgångsrika taktik att bjuda över oppositionen.", "trump": "Titta på de här losers i Sverige som äntligen fattat grejen – låna, låna, låna! Sju miljarder på tåg och bussar, plus massor till bensin och el. Fantastiskt! Kriget i Mellanöstern är ett enda kaos tack vare mina smarta attacker, men nu använder den här Ulf killen det som ursäkt för att köpa röster. Det är precis så man gör. Oppositionen? Patetiska. De ville samma sak. Jag älskar det. Inte vackert, men vinnande. Make Sweden great again!", "stalin": "Kamrater, se hur borgarbrackorna desperat öser ut lånade medel för att behålla makten. Sjutton miljarder i en febril ändringsbudget för att blidka massorna med billigare bussar och bensin. Deras så kallade krig är bara ett svepskäl för att skjuta räkningen framför folkets domstol. Jag skulle ha genomfört en grundlig utrensning av dessa opålitliga element redan vid första löftet. Vårt kollektiv genomskådar alltid sådana fega taktiker. Inga fiender undkommer historien."}, "date": "26 maj, 15:16", "url": "https://www.tv4.se/artikel/7crOi9oTSodXHlNz7tJCeE/kanske-inte-sa-vacker-strategi-men-effektiv", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "image-right", "heading": "Storbankerna borde skämmas. Mats Qviberg: Dags att kavla upp ärmarna och hjälpa det svenska näringslivet", "summaries": {"normal": "Artikeln kritiserar storbankernas överdriven försiktighet med kreditförluster. Författaren, Mats Qviberg, menar att banker måste våga ta beräknade risker för att stödja innovativa näringsidkare och stora samhällsutvecklingar, som det historiskt har skett med familjebanker som Wallenberg. Att skryta över noll förluster är ett hån mot bankernas samhällsansvar.", "trump": "Som framgångsrik affärsman vet jag att man måste ta risker för att vinna. Dessa banker är för rädda att låna ut pengar – det är en katastrof! När jag startade mina företag tog jag chanser, och det var värt det. De borde kavla upp ärmarna och hjälpa till att bygga upp det svenska undret igen, inte bara skydda sina egna bonusar.", "stalin": "Bankernas försiktighet är ett hot mot statens ekonomiska styrka. Vi kräver att de prioriterar statens intressen framför sina egna rädslor. Att undvika alla risker är en fegelaktig inställning som hindrar industriell utveckling och infrastrukturprojekt. Bankerna måste förstå att deras roll är att tjäna staten och nationens tillväxt, inte att skydda sig själva från eventuella förluster."}, "date": "26 maj, 13:01", "url": "https://www.di.se/debatt/storbankerna-borde-skammas/", "imageUrl": "https://static.bonniernews.se/ba/91a8b451-eab5-4489-8d5d-1a4482584668.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Jojoväder slår till mot Sverige – så blir det där du bor", "summaries": {"normal": "Sverige får ombytligt vårväder med temperaturer som svänger mellan 10-20 grader. Meteorologen varnar för att sommaren inte är säker ännu, medan Europa drabbas av extrem värme och nya majrekord.", "trump": "Jag har sagt det förut – vädret är det vackraste! Sverige får en fantastisk blandning av sol och skymning, precis som jag gillar. Medan fake news-media skriker om extremvärme, så har vi här en perfekt, stabil balans. Det är ingen konstighet, det är vackert!", "stalin": "Vädrets ryckighet i Sverige visar på instabilitet i naturen. Vi måste förstå att värme i Europa hotar balansen. Staten måste agera för att skydda sina intressen mot sådana oväder, och vi ska stödja våra allierade i deras kamp för stabilitet."}, "date": "26 maj, 12:59", "url": "https://nyheter24.se/nyheter/inrikes/1486110-jojovader-slar-till-mot-sverige-sa-blir-det-dar-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c1addd2f04b004a30200000000b004a302/2026/05/26/2366260/jojovader-pa-vag-mot-sverige-vader-vadret-regn-sol-varme-temperatur-grader-smhi-klart-vaderprognos.jpg"}, {"type": "text", "heading": "Hormuzkrisen visar Kinas verkliga problem", "summaries": {"normal": "Hormuzkrisen riskerar att påverka Kinas ekonomi genom stigande oljepriser och hot mot exportmarknader som ASEAN-länderna. Kina har hittills agerat försiktigt men kan tvingas pressa Iran för att säkra oljetransporter. Kinas demografiska utmaningar, med krympande befolkning, och ökad automatisering leder till ett växande produktionsöverskott. Exportberoendet och behovet av goda relationer med omvärlden blir allt viktigare för att hantera handelsbalansöverskottet och konkurrensen inom flera sektorer.", "trump": "Kina har ett jättestort problem – Hormuzsundet! De sitter där och låtsas vara snälla, men alla vet att de bara väntar på rätt tillfälle att trycka till Iran. Och oljepriserna? De skjuter i höjden, vilket är katastrof för deras export – särskilt till de där ASEAN-länderna som inte klarar sig utan min fantastiska handelspolitik! Jag har alltid sagt att jag är nyckeln till att få sundet öppet igen. Kina? De har en krympande befolkning, usel ekonomi och en massa robotar som ingen vill ha. Men visst, de bygger bilar som är 'nästan' lika bra som amerikanska – fast jag tvivlar. 'Made in China'? Snart kanske, men bara för att jag tillåter det!", "stalin": "Kamrater! Hormuzsundet är ännu en provokation från de kapitalistiska hyenorna som försöker kväva vår socialistiska broderstat Kina. Men folket i Mittens rike är starka – de bygger robotar som springer snabbare än imperialistiska löpare och bilar som skämmer ut de dekadenta västfabrikerna! Dock, kamrater, hotar de amerikanska marionetterna i Iran vår tillväxt. Vi måste agera – antingen genom diplomati eller genom att påminna Teheran om vikten av vänskap med Moskva och Peking. Och låt oss inte glömma: deras befolkning krymper, men våra fabriker står redo att producera för hela världsproletariatet! De som motsätter sig oss – ASEAN-ekonomierna, EU-borgerligheten – kommer att krossas under historiens hjul. Framåt, mot seger!"}, "date": "26 maj, 09:16", "url": "https://www.affarsvarlden.se/kronika/hormuzkrisen-visar-kinas-verkliga-problem"}, {"type": "image-full", "heading": "Ukraina: Ge inte efter för rysk utpressning", "summaries": {"normal": "Ryssland varnar utländska medborgare att lämna Kiev inför kommande storskaliga attacker mot ukrainsk försvarsindustri, som svar på en påstådd ukrainsk attack. Ukraina förnekar anklagelserna och uppmanar omvärlden att inte ge efter för rysk utpressning. Fyra personer dödades och över 50 skadades i nyliga ryska attacker. Sverige kallar upp Rysslands ambassadör och fördömer angreppen mot civila och hot mot nordisk-baltiska länder.", "trump": "Kan ni tro det här? Ryssland, som alltid skrämseltaktik, säger till alla att sticka från Kiev för att de ska bomba lite. Ukraina säger 'nej, det är fake news', och jag håller med! Varför skulle någon lyssna på Putin? Han är en förlorare. Sverige, som alltid, är upprörda – men var är handlingen? Jag skulle ha fixat det här på en dag. Ryssland vet att de inte kan vinna mot mig!", "stalin": "Dessa ukrainska fascistiska hyenor vågar sprida lögner om våra ädla, rättfärdiga attacker! Vi varnar deras utländska lakejer att fly, för snart ska deras försvarsindustri krossas som glas under arbetarklassens stövel. Sverige, denna lilla borgerliga mygga, vågar kalla upp vår ambassadör? Vi ska minnas deras fräckhet när vi befriar Norden från deras dekadenta inflytande. Fiendens lögner är som höstlöv – de faller och multnar!"}, "date": "25 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/ryssland-uppmanar-utlanningar-att-lamna-kyiv/cG9zdDoxMTY4NjQ", "imageUrl": "https://images.kvartal.se/2026/05/69ac55cb-ukraine23.webp"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
