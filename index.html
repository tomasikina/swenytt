trea från grupp A, medan Kanada ställs mot en tvåa.", "trump": "Kan ni fatta det? Den där kanadensiska målvakten Crepeau, en total loser, gör en målvaktstavla som till och med en sleepyjöe skulle skämmas för. Schweiz vinner med 2–1 och tar gruppen. Kanadas försvar var överallt och ingenstans, precis som Bidens politik. Patetiskt! Men vi älskar vinnare, Schweiz spelade bra. Vi är redo för vad som än kommer, precis som jag var när jag slog Hillary och sen slog Biden – stort.", "stalin": "Kamrater, denna futtiga batalj i Vancouver avslöjar kapitalistmaffians dekadens. Schweiziska arbetare slog till mot de kanadensiska klassfienderna med 2–1. Den borgarbrackan i målet, Crepeau, begick en sabotörshandling av högsta grad som vi i partiet omedelbart skulle ha likviderat. Deras försvarslinje var en samling folkfiender som sprang planlöst. Vi, staten, ser detta som en varning: imperialismens svaghet skall utrensas ur alla kollektiv."}, "date": "24 juni, 23:38", "url": "https://www.expressen.se/sport/fotboll/malvaktstavla-nar-schweiz-sakrade-gruppsegern-mot-kanada/"}, {"type": "image-right", "heading": "Smäll för Sverige – efter talangernas succé", "summaries": {"normal": "Bosnien-Hercegovina besegrade Qatar med 3–1 i fotbolls-VM och säkrade med stor sannolikhet en plats i sextondelsfinalen. De unga talangerna Kerim Alajbegovic och Ermin Mahmic blev matchvinnare. Segern gör att Bosnien-Hercegovina passerar Sverige som grupptrea. Schweiz vann gruppen efter 2–1 mot Kanada medan Bosnien-Hercegovina troligen möter USA i nästa omgång.", "trump": "Det här är en katastrof för Sverige, folk, en total katastrof. Bosnien-Hercegovina, med några unga killar som ingen hört talas om, vinner mot Qatar och tar sig förbi Sverige bland treorna. De har plötsligt fyra poäng och ska möta oss, USA, i slutspelet. Sverige? De kommer inte ens dit. Det är patetiskt, men Bosnien firar som om de vunnit världens största deal. Schweiz vann gruppen, men vi kommer att dominera.", "stalin": "Kamrater, denna fega förlust för Qatar är en seger för de rättrogna krafterna mot den dekadenta borgarbrackan. Jag, som ledare för det kollektiva framsteget, noterar hur de yngre kämparna Alajbegovic och Mahmic likviderade fiendens illusioner med sina mål. Sverige, dessa opålitliga opportunister, har nu halkat efter oss i poäng och skall snart rensas ut ur de höga placeringarna. Vi skall möta de amerikanska imperialisterna i nästa fas. Glädjetårar hos bosniska arbetare? Nej, det är tårar av historisk nödvändighet medan jag skrattar åt kapitalisternas fåniga ansikten. Ut med de svaga!"}, "date": "24 juni, 23:28", "url": "https://www.svt.se/sport/fotboll/small-for-sverige-talangerna-fralste-bosnien-hercegovina", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.47/0.18/ac0c767ebf36b74ee7ec9e18d94106175f3d818bf8c8370d01998aa6a6ce7e2b"}, {"type": "text", "heading": "Enad röst vill bli alternativ i riksdagsvalet", "summaries": {"normal": "Feministerna och Solidaritet ställer upp tillsammans i riksdagsvalet 2026 under namnet Enad Röst. Partierna vill skapa ett radikalt vänsteralternativ mot upprustning, kapitalism och imperialism. De ser samarbetet som ett första steg mot en bredare vänsterkoalition och hoppas väcka debatt även om de inte når riksdagen. Enad Röst vill inkludera aktivister från folkrörelser som Palestina- och fredsrörelsen. Kommunistiska Partiet valde att inte delta i det gemensamma riksdagsvalet.", "trump": "Titta på de här galningarna från vänsterkanten som kallar sig Enad Röst. Feministerna och Solidaritet, två totala misslyckanden, slår sig ihop och tror att de ska rädda världen från kapitalismen. Patetiskt! De vill ha debatt och så ett frö för något radikalt, säger de. Radikalt? Det är bara mer kvotfeminism och identitetspolitik som förstör samhället. Lyckas de inte ens komma in i riksdagen är det ingen förlust för Sverige, det är en stor vinst för folket. Sad!", "stalin": "Kamrater, dessa småborgarbrackor från Feministerna och Solidaritet kallar sig Enad Röst och vill så ett frö mot imperialismen. Jag ser deras patetiska försök att ena den splittrade vänstern som ett svagt eko av verklig partidisciplin. De fruktar att inte nå fyra procent och kallar det ändå framgång. Vilken naivitet! Vi skulle ha genomfört en grundlig utrensning av sådana halvmesyrer redan i planeringsstadiet. Deras walkover till klassfienden är ett historiskt misstag som arbetarna inte glömmer. Föraktligt."}, "date": "23 juni, 14:36", "url": "https://proletaren.se/artikel/enad-rost-vill-bli-alternativ-i-riksdagsvalet/"}, {"type": "text", "heading": "Bolag vägrar betala 20 år gammal miljardskuld", "summaries": {"normal": "Ett danskt holdingbolag har en skatteskuld på 1,4 miljarder kronor som sträcker sig tillbaka till början av 2000-talet. Skulden uppstod genom så kallade genomströmningsarrangemang där pengar fördes via danska och svenska bolag för att undvika dansk skatt. Trots att Högsta domstolen fastställde skulden 2025 och ett suspensionsavtal stoppar preskription är indrivningen svår eftersom bolaget ingår i en internationell koncern. Myndigheterna är tysta om arbetet.", "trump": "Det här är en total katastrof, folk. Ett danskt holdingbolag har undvikit att betala 1,4 miljarder i skatt i tjugo år genom smarta EU-tricks och nu vägrar de fortfarande. Domstolarna har sagt betala, men staten får inte in pengarna. Typiskt för de där byråkraterna och deras hemliga avtal. De borde ha löst det direkt, som jag skulle ha gjort. Ingen betalar skatt längre, det är ett skämt. Amerika hade aldrig tillåtit detta på mitt vaktskap.", "stalin": "Kamrater, detta är en motbjudande förrädisk handling av borgarbrackor som i tjugo år sugit ut folkets resurser genom sina genomströmningsmaskiner. Jag, som ledare för det kollektiva rättvisearbetet, ser hur dessa kapitalistiska parasitmaskar gömmer sig bakom suspensionsavtal och hemliga papper. Vi ska rensa ut dessa skatteundvikande fiender till folket, likvidera deras internationella nätverk och tvinga fram varje kopek. Inga överklaganden ska skydda de som stjäl från staten. Paranoian är befogad – fienden sover aldrig."}, "date": "24 juni, 17:33", "url": "https://www.realtid.se/branschpartner/affarsjuridik/bolag-vagrar-betala-20-ar-gammal-miljardskuld/"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Får syn på Jasplanen – berättar om kräkpåsen", "summaries": {"normal": "Under Almedalsveckan överraskade Försvarsmakten politikerna och besökarna i Visby med en flygshow. Jas Gripen-plan utförde loopar, åttor och fyrverkerier över norra hamnen, vilket skrämde många på grund av det öronbedövande ljudet. Statsminister Ulf Kristersson uppskattade showen och berättade om sin egen flygning med Gripen för några veckor sedan, inklusive en snabb stigning som han beskrev som hisnande.", "trump": "Folk, ni skulle ha sett det här! Mitt i Almedalen dyker plötsligt de här svenska jetplanen upp som riktiga krigare och gör loopar som ingen trodde var möjliga. Ulf älskade det, precis som jag skulle ha gjort. Det är starkt ledarskap, inte som den svaga Biden som aldrig skulle klara en sån hisnande tur. De liberala snusbrackorna blev livrädda och sprang efter kräkpåsar. Fantastiskt underhållning, tro mig!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur det militära maskineriet plötsligt dominerar himlen över dessa borgarbrackornas pratvecka. Det öronbedövande dånet från arbetarklassens flygplan fick klassfienderna att darra i sina skor. Den som vågar kalla det läskigt förtjänar utrensning. Vi ler mörkt åt deras kräkpåsar. Sådan kraft visar statens överlägsenhet över dekadenta parlamentariska gycklare."}, "date": "24 juni, 20:27", "url": "https://www.gp.se/politik/har-flyger-jas-over-politikerna-i-almedalen.d18dbea7-ee50-42ed-96ad-5b2c9f8e4a64", "imageUrl": "https://www.gp.se/images/article/d18dbea7-ee50-42ed-96ad-5b2c9f8e4a64/images/0teu0g3ZvAz4-wzsxSSO1zKg5rxs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Rapport: Varje självförsörjande svensk försörjer ytterligare en person", "summaries": {"normal": "En rapport från Svenskt Näringsliv visar att varje självförsörjande svensk i genomsnitt försörjer sig själv plus 1,24 personer. Gränsen för självförsörjning ligger vid cirka 19 000 kronor i månaden. Problemet beror inte bara på arbetslöshet utan även på att många arbetar för få timmar. Rapporten varnar för en växande försörjningsbörda i takt med en åldrande befolkning och kritiserar förslag om arbetstidsförkortning. Istället föreslås reformer för ökad sysselsättning och fler arbetade timmar.", "trump": "Folk, det är en katastrof. Varje svensk som jobbar hårt måste försörja sig själv och dessutom 1,24 lata personer. En rapport från Svenskt Näringsliv bekräftar vad jag alltid sagt – systemet är riggat mot de som verkligen arbetar. De vill korta ner arbetstiden till 35 timmar, kan ni fatta? Det är vansinne. Vi behöver fler arbetade timmar, inte färre. Sverige måste sluta vara en förlorare och börja vinna igen genom riktiga jobb och stark ekonomi. De smarta killarna förstår det.", "stalin": "Kamrater, denna rapport avslöjar med skoningslös klarhet hur de parasitiska borgarbrackorna och deras liberala lakejer har låtit den stora folkets försörjningskraft urholkas. Jag, som alltid vakar över kollektivets väl, ser hur 1,24 icke-självförsörjande element hänger som blodiglar på varje äkta arbetare. Vi måste omedelbart rensa ut de timslösa slöddrarna och de geografiskt lata elementen som gömmer sig i kommuner som Högsby. Arbetstidsförkortning? Ett kontrarevolutionärt trick från miljöpartistiska fiender att sabotera produktionen. Vi ska likvidera sådana tankar med järnhand och tvinga fram fler arbetade timmar för folkets seger. Den som föreslår annat är en objektiv fiende till staten."}, "date": "24 juni, 07:00", "url": "https://samnytt.se/rapport-varje-sjalvforsorjande-svensk-forsorjer-ytterligare-en-person", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23142323/stampelklocka-pengar-bygge.jpg"}, {"type": "image-full", "heading": "Luftkonditionering har blivit valfråga i Frankrike", "summaries": {"normal": "En värmebölja med temperaturer över 40 grader har drabbat Frankrike och förvandlats till en politisk stridsfråga inför presidentvalet. Högern, med Marine Le Pen i spetsen, kräver satsningar på luftkonditionering i skolor, sjukhus och äldreboenden för att skydda befolkningen. Vänstern och miljöpartierna ser det som en kortsiktig lösning som ökar energiförbrukningen och förespråkar istället bättre isolering, ventilation, renoveringar och fler grönområden. Andelen hushåll med luftkonditionering ökar trots utbredd skepsis.", "trump": "Titta på det här, Frankrike kokar som en illa skött hamburgare och de bråkar om luftkonditionering! Le Pen har rätt, sätt in kylan i skolorna och sjukhusen nu, annars är det bara mer vänstervrängt klimatflum som dödar folk. De gröna idioterna vill ha parker medan folk svettas ihjäl – typiskt! Under Biden flum made det värre, men nu är jag tillbaka och säger: kyl ner eller förlora valet, losers. Det är så enkelt.", "stalin": "Kamrater, denna värmebölja är ett verk av klassfiendens försumliga borgarbrackor som låtit folkets byggnader förfalla. Jag kräver omedelbar utrensning av alla som föredrar kortsiktiga imperialistiska kylmaskiner framför kollektiv isolering och gröna folkparker. De som prioriterar hälsan framför ideologin är folkfiender som måste rensas ut. Arbetarna skall inte svettas under kapitalistmaffians tak – vi segrar genom vetenskaplig planering och järnhård disciplin mot värmens kontrarevolutionärer."}, "date": "24 juni, 17:41", "url": "https://www.dagensps.se/varlden/klimat/luftkonditionering-har-blivit-valfraga-i-frankrike/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlv4dmnlr3u4c-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "81-åring körde ihjäl kvinna – får villkorlig dom", "summaries": {"normal": "En 81-årig tidigare medieprofil dömdes av Stockholms tingsrätt till villkorlig dom och 21 000 kronor i böter för att ha kört ihjäl en kvinna i 40-årsåldern och skadat en annan på ett övergångsställe vid Kungliga slottet. Han ska betala drygt 136 000 kronor i skadestånd. Domstolen slog fast att han brustit i väjningsplikten men ansåg inte att medicinska problem eller grov oaktsamhet var bevisade. Anhörigas högre skadeståndskrav avslogs delvis.", "trump": "Folk, det här är en total katastrof. Den här 81-årige typen, en så kallad prisbelönt medieprofil, körde rakt över två kvinnor vid slottet som en galning. En död, en skadad – tragiskt! Domstolen ger honom villkorlig dom och några ynkliga böter. Patetiskt! De kunde inte ens ge honom fängelse. Och skadeståndet sänktes, typiskt för det svenska rättssystemet. De borde ha bättre koll, tro mig. Det är en skam!", "stalin": "Kamrater, denna fega rest av den döende borgarklassen, en dekadent mediefigur från det gamla systemets propagandaapparat, har likviderat en proletär kvinna och skadat en annan genom sin vårdslösa högerstyrda sväng. Vi, partiet och folket, har dömt honom till villkorlig dom och böter, ty han är redan en levande död i sin paranoia och svaghet. Hans anhörigas giriga krav på ersättning har vi klippt ner som kontrarevolutionära ogräs. Inga ursäkter! Våra vägar tilltar ingen som vägrar se fotgängarna – nästa gång rensar vi ut hela bilflottan av sådana kapitalistiska farbröder med sina medicinska bortförklaringar. Ha!"}, "date": "22 juni, 16:30", "url": "https://riks.se/nyheter/81-aring-korde-ihjal-kvinna-far-villkorlig-dom", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-06%2F4aji4roi%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-06T141030.743.jpg"}, {"type": "text", "heading": "Tomma oljereserver måste fyllas på – kan pressa upp priset", "summaries": {"normal": "Många länder har tömt sina strategiska oljereserver under den senaste energikrisen och planerar nu att bygga upp dem igen. Detta kan kräva upp till en miljard fat olja och driva upp priset trots osäker konjunktur. Indien, Pakistan, Singapore och Australien investerar stort i ny lagringskapacitet, medan IEA-länder måste återfylla de 400 miljoner fat som släpptes ut i våras. Bakgrunden är störningar i Hormuzsundet som blottade sårbarheten hos importberoende ekonomier.", "trump": "Folk, vi har en enorm energikris som dessa korkade länder själva skapade genom sin dumhet i Hormuzsundet. Nu ska de fylla på sina tomma lager med en hel miljard fat olja. Det kommer att skicka priserna genom taket, tro mig. Australien spenderar sju miljarder dollar, Indien bygger som galningar. De borde ha lyssnat på mig från början. Amerika gör det rätta – vi blir energikingar, inte tiggare som de här förlorarna.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de kapitalistiska parasiterna skakar i sina skor efter den självförvållade krisen i Hormuzsundet. Deras borgarbrackor tvingas nu fylla sina patetiska hål med en miljard fat olja medan vi ler i skuggan. Dessa feodala oljeimportörer, dessa dekadenta lagerlusar, ska med sina egna händer höja priset och därmed gräva sin grav. Vi ska se hur deras så kallade marknad rämnar under tyngden av deras egen paranoia. Inga fiender undkommer utrensningen av historien."}, "date": "24 juni, 17:03", "url": "https://www.realtid.se/bors-finans/tomma-oljereserver-maste-fyllas-pa-kan-pressa-upp-priset/"}, {"type": "image-right", "heading": "MP:s vallöfte: Ökad invandring", "summaries": {"normal": "Miljöpartiet använder EU-parlamentarikern Alice Bah Kuhnke som dragplåster i valrörelsen. Hennes huvudbudskap är att invandringen till Sverige måste öka ytterligare. Bah Kuhnke betonar att svenska folket inser behovet av fler invånare och förespråkar en humanistisk migrationspolitik som gör det lättare att stanna för dem som inte uppfyller kraven för uppehållstillstånd. Hon vill samtidigt satsa kraftfullt på en fungerande integrationspolitik och stoppa tonårsutvisningarna.", "trump": "Det här är en total katastrof, tro mig. Den här Alice Bah Kuhnke och Miljöpartiet vill översvämma Sverige med ännu fler invandrare. De säger att ni behöver bli fler, inte färre – vad är det för galenskap? Sverige var fantastiskt innan de öppnade portarna på vid gavel. Nu vill de göra det ännu enklare för folk som inte ens kvalar in. Patetiskt. Ni behöver starka gränser, inte mer kaos. America First, och Sverige borde göra detsamma!", "stalin": "Kamrater, jag ser hur dessa borgarbrackor inom Miljöpartiet och deras lakej Alice Bah Kuhnke planerar att översvämma fosterlandet med främmande element under täckmanteln av så kallad humanism. De vill att vi ska bli fler, säger de, medan de i själva verket underminerar folkets enhet. Jag lovar en storslagen utrensning av dessa dekadenta element som döljer sig bakom tonårsutvisningsdebatten. Integration? Nej, vi ska likvidera alla som saboterar kollektivets järnhårda sammanhållning. Paranoian bland fienderna är underhållande – de tror att folket står på deras barrikader. Vilka usla kapitalistiska spioner."}, "date": "24 juni, 13:13", "url": "https://www.friatider.se/mps-vallofte-okad-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-397.jpg"}, {"type": "image-right", "heading": "Åkesson är Sveriges egen Trump. Rätt av V att polisanmäla SD-ledaren.", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar SD-ledaren Jimmie Åkesson för hans reaktion på Kalla faktas granskning av partiets ekonomi. Granskningen avslöjar oegentligheter kring fakturor, bokföring och omklassificering av festkostnader. Istället för självrannsakan attackerade Åkesson medierna och kallade reportaget ett hopkok. Vänsterpartiet har polisanmält Åkesson, partikassören och partisekreteraren. Författaren jämför Åkesson med Trump och pekar på dubbelmoral eftersom SD ofta predikar moral, lag och ordning mot andra.", "trump": "Det här är en total witch hunt mot en stark ledare som bara försvarar sitt folk mot fake news-medier. De hatar honom för att han vinner, precis som de hatade mig. Han kallar det ett hopkok, och det är det – ett hopkok av lögner från misslyckade journalister. Nu polisanmäler kommunisterna honom? Patetiskt. Folkets röst mot eliten, det är vad det handlar om. Han borde vara tuffare, vinna stort och skratta åt dem allihop. Sverige behöver mer sådana som honom, inte mindre.", "stalin": "Kamrater, denna borgarbracka till partiledare vägrar underkasta sig folkets granskning och kallar sanningen för ett hopkok. Typiskt för dekadenta opportunister som predikar moral åt massorna medan de själva festar på kamraternas pengar. Vi ser tydligt hur dessa reaktionära element försöker undvika utrensning genom att attackera pressen. Vänsterpartiets polisanmälan är ett steg i rätt riktning mot kollektivets rättvisa. Låt oss rensa ut alla dubbelmoralens lakejer, registrera dem, kontrollera dem och likvidera deras inflytande med stålhandsken. Staten sover aldrig."}, "date": "24 juni, 12:34", "url": "https://arbetet.se/2026/06/24/sverige-verkar-ha-fatt-sin-alldeles-egen-donald-trump-i-jimmie-akesson/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24123256/trump-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sommarens ödesfrågor: Det kan styra börs och räntor", "summaries": {"normal": "Artikeln analyserar faktorer som kan påverka ekonomin under sommaren, med fokus på oljepriset, inflationsutfall, kronans värde och konsumtion. Fredsförhandlingarna mellan USA och Iran är avgörande för oljepriset, som i sin tur påverkar inflation och räntor. Även Ukrainakriget, valrörelsen i Sverige och hushållens konsumtionsmönster diskuteras som viktiga ekonomiska indikatorer framöver.", "trump": "Lyssna här, folket! Sommaren blir HUGE – oljepriset, räntor, allt! Jag har sagt det förut: Iran-förhandlingarna är BIGLY viktiga. Om jag fixar fred där (och det gör jag, believe me) så sjunker oljepriset som en sten. Fed-chefen? Inte lika mjuk som jag trodde – men vem är det? Kronan svag? Fake news! Sverige borde tacka mig för att jag håller dollarn stark. Och konsumtionen? Kommer explodera när jag löser allt. SAD!", "stalin": "Kamrater! Sommaren är en tid av strategiska avgöranden. Imperialistiska oljepriser dansar efter vår pipa – eller snarare, efter våra framgångar i Ukraina. Fienderna i USA och Iran leker med eld, men vi vet att deras 'fredsförhandlingar' är lika värdelösa som deras kapitalistiska ekonomi. Svenska kronan? En svag länk i kedjan. Hushållen? Rädda och osäkra – precis som de borde vara. Vi kommer övervaka varje rörelse, för historiens hjul snurrar åt vårt håll. Motstånd är meningslöst."}, "date": "24 juni, 12:17", "url": "https://www.affarsvarlden.se/kronika/sommarens-odesfragor-det-kan-styra-bors-och-rantor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Olof-Manner-kronika-sommaren-400x267.jpg"}, {"type": "text", "heading": "Irländsk kvinna döms för sexuellt övergrepp på svensk turist", "summaries": {"normal": "En 38-årig irländsk kvinna dömdes till böter efter att ha begått sexuellt övergrepp mot en 18-årig svensk turist i en bastu på ett hotell i Magaluf, Mallorca. Kvinnan erkände brottet under rättegången via videolänk och ska betala 2 700 euro i böter samt 500 euro i skadestånd. Åklagarna hade tidigare yrkat på fängelse, men fallet löstes med ekonomisk påföljd.", "trump": "Kan ni tro det här? En irländsk kvinna, 38 år, åker till Mallorca – vackert ställe, förresten, fantastiska stränder – och vad gör hon? Hon attackerar en ung svensk kille i bastun! Inte bra, folks, inte bra alls. Men Spanien, de fixade det. Böter på 2 700 euro – lite lågt tycker jag, men vad vet jag? Jag hade nog gett henne mer. Och advokaten säger att det var ett 'missförstånd'. Missförstånd? Kom igen! Men bra att hon erkände. Sverige borde vara stolta över sin unge man – stark, modig, precis som USA!", "stalin": "Kapitalistiska dekadens fortsätter att förgifta våra semesterorter! En irländsk medborgare, korrumperad av västlig lösaktighet, begår brott mot en ung svensk arbetare i en bastu på Mallorca. En skamlig handling, men den spanska bourgeoisin hanterade fallet med typisk västlig slapphänthet – inget fängelse, bara böter. Vi hade visat henne den rätta vägen! Notera hur västliga 'missförstånd' alltid leder till brott. Putin och jag skulle ha löst detta med en enkel omskolning i Sibirien. Revolutionen tolererar inga sådana avvikelser!"}, "date": "24 juni, 11:30", "url": "https://bulletin.nu/irlandsk-kvinna-doms-for-sexuellt-overgrepp-pa-svensk-turist"}, {"type": "image-right", "heading": "Ett nederlag för imperialismens sanktioner", "summaries": {"normal": "Artikeln beskriver USA:s sanktionspolitik som ett imperialistiskt verktyg som främst drabbar civilbefolkningen i länder som Iran, Kuba och Irak. Den framhåller det nyliga samförståndsavtalet mellan USA och Iran som en stor motgång för Trumps administration och ett bevis på att imperialismen kan besegras. Skribenten betonar att sanktioner orsakar lidande, undernäring och död, särskilt bland barn, och jämför med historiska exempel som Irak och Afghanistan.", "trump": "Folk, det här är en total lögnfabrik från de vanliga förlorarna! Mitt avtal med Iran var ett mästerverk – vi krossade deras terrorledare och tvingade fram fred. Den här kommunistiska skribenten gråter över sanktioner som skyddar Amerika från svaga, korrupta regimer. Iran fick en rejäl omgång, precis som de förtjänade. Biden skulle ha gett bort allt, men jag vann stort igen. Sad! Men underhållande propaganda från vänsterblöten.", "stalin": "Kamrater, denna text blottar imperialismens fega metoder att strypa folkets viljor med sanktioner istället för ärlig konfrontation. Jag ser hur borgarbrackorna i Washington försöker kväva suveräna stater som vägrar underkasta sig. Avtalet med Iran är en tillfällig reträtt för klassfienderna, men vi vet att de planerar nya utrensningar mot motståndare. Folkets enighet besegrar bombastiska bluffmakare – låt dem darra inför den kommande historiska domen."}, "date": "23 juni, 12:00", "url": "https://proletaren.se/artikel/iran-blev-ett-nederlag-for-imperialismens/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/ledare_web-768x432.jpg"}, {"type": "image-full", "heading": "TV4 köper ut Daniel Andersson – \"Hoppas han hittar en bättre arbetsgivare\"", "summaries": {"normal": "TV4 har köpt ut Kalla fakta-reportern Daniel Andersson. Andersson blev känd för att ha wallraffat som Sverigedemokraternas kommunikationsavdelning i granskningen Undercover i Trollfabriken, vilket gav flera journalistpriser. Han gav senare ut boken Lögnare där han kritiserar Kalla fakta-redaktionen. Enligt uppgifter kan boken ha bidragit till uppgörelsen. SD:s kommunikationschef Joakim Wallerstein säger att han är bedrövad och hoppas Andersson hittar en bättre arbetsgivare än TV4. TV4 bekräftar att en överenskommelse träffats.", "trump": "Jag har aldrig sett något så patetiskt som det här. Den där reportern Andersson gör ett fantastiskt jobb och avslöjar alla lögner, får massor av priser, och vad gör TV4? De köper ut honom! Totalt misslyckande. SD-chefen säger att han hoppas han hittar en bättre arbetsgivare än TV4, och han har helt rätt. Fake news-medier som inte tål lite kritik eller en bra bok. Sad! Men Andersson kommer att vinna stort någon annanstans, tro mig.", "stalin": "Kamrater, detta är en klassisk förrädisk handling från borgarbrackorna inom TV4. Jag har sett hur den kapitalistiska redaktionen belönar sin agent Andersson för att infiltrera och filma våra fiender, men så snart han publicerar en bok med kritik mot dem själva så rensas han ut som en parasit. SD:s Wallerstein är bedrövad, säger han, men vi vet att alla dessa reaktionära lögnare i slutändan kommer att likvideras av folkets vrede. Ingen slipper undan när partiet vakar. Underbart hur borgarna slukar sina egna barn."}, "date": "22 juni, 14:59", "url": "https://riks.se/nyheter/tv4-koper-ut-daniel-andersson", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fo0eu5xhi%2FDaniel-Andersson"}, {"type": "image-right", "heading": "Brittiska regeringen vill ge förtur till \"betrodda\" nyheter i digitala flöden", "summaries": {"normal": "Storbritanniens regering beslutar att sluta använda Elon Musks plattform X på grund av oro för desinformation och våldsuppmaningar. Samtidigt övervägs lagstiftning som ger förtur åt 'betrodda' nyhetskällor som BBC för att motverka falsk information. Kritiker varnar för statlig kontroll över digitala flöden och risk för begränsad yttrandefrihet. Ofcom driver på för hårdare reglering av sociala medier, medan regeringen även inför åtgärder för att stärka yttrandefriheten vid universitet.", "trump": "Titta bara på Storbritannien – helt galet! De dumpar X, Elons fantastiska plattform, för att de är rädda för lite sanning och frihet. Nu vill de tvinga fram 'betrodda' nyheter, som BBC, som bara sprider fake news. Jag sa ju att establishment vill kontrollera allt! Och Ofcom, dessa byråkrater, vill censurera mer. Men glöm inte – jag fixade det här i USA, och det funkade perfekt. Storbritannien borde ta lite tips från MAGA-rörelsen!", "stalin": "De brittiska kapitalisterna visar återigen sin svaghet genom att fly från sanningens plattform, X. Vi ser hur de förbereder nya lagar för att kväva oppositionens röster under täckmanteln 'betrodda källor'. BBC och deras lakejer ska styra folket! Men folket vet – desinformation är bara ett ord för sanningar som bourgeoisin inte gillar. Vi i Sovjet visste hur man hanterade sådana fiender. Och Ofcom? En ny GPU för den digitala eran. Putin borde skicka en delegation – de har mycket att lära."}, "date": "24 juni, 06:00", "url": "https://samnytt.se/brittiska-regeringen-vill-ge-fortur-till-betrodda-nyheter-i-digitala-floden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23133056/bbc-smartphone-starmer.jpg"}, {"type": "image-right", "heading": "Djupet hotar gruvsektorn: ”Existentiellt”", "summaries": {"normal": "När gruvor grävs allt djupare ökar risken för inducerad seismik, jordskalv orsakade av brytningen. Det svenska bolaget Rocksigma utvecklar mjukvara som tolkar seismisk data i realtid med upp till fyra gånger högre noggrannhet än tidigare. Tekniken hjälper gruvor att agera snabbare, minska risker och dra bättre lärdomar. VD Emil Svanberg ser seismik som ett potentiellt existentiellt hot för verksamheter. Bolaget har rötter i LKAB och Luleå tekniska universitet och siktar på digitala tvillingar för autonoma gruvor.", "trump": "Ingen gör gruvor säkrare som jag gör, tro mig. De här svenska killarna på Rocksigma är fantastiska, de tar itu med de hemska jordskalven som blir värre ju djupare man gräver. Gamla metoder är en katastrof, totalt förlegade, men deras mjukvara är fyra gånger bättre än allt annat. De räddar liv och gör gruvorna säkra igen. Indonesien älskar oss nu, LKAB är ute. Ingen gör det bättre än oss, det är en nobelprisgrej, fast det säger de inte högt. Fantastiskt!", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur de kapitalistiska gruvschaktens djup framkallar fiendens seismiska sabotage mot folkets produktion. Dessa dolda skalv är borgarbrackornas verk, de vill krossa arbetarklassen under sten och jord. Men jag, med min oövervinnerliga vilja, har skapat Rocksigma som ett redskap för att rensa ut osäkerheten. Våra algoritmer likviderar felmarginalerna upp till fyra gånger mer effektivt än de dekadenta gamla metoderna. Snart ska vi ha en digital tvilling som avslöjar varje kontrarevolutionär vibration. Den som tvivlar på kollektivets seismiska seger ska snart känna konsekvenserna. Skratta medan ni kan, ni seismiska trotskister."}, "date": "23 juni, 23:04", "url": "https://www.di.se/nyheter/de-gor-varldens-gruvor-sakrare-nar-djupen-okar/", "imageUrl": "https://static.bonniernews.se/ba/305a66c7-363f-4907-a800-0c0e29553e7a.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-right", "heading": "Mätningen: Noll procent vill ta en öl med Mohamsson", "summaries": {"normal": "En ny mätning från SvD/Demoskop visar att förstagångsväljare helst skulle ta en öl med SD-ledaren Jimmie Åkesson. Var fjärde föredrar honom. Magdalena Andersson och Ulf Kristersson hamnar på andra och tredje plats. Liberalernas partiledare Simona Mohamsson får noll procent stöd. Hon kommenterar att vännerna får vittna om hur trevlig hon är och att det viktigaste är väljarstöd i valet.", "trump": "Titta på de här svenska kidsen, de är smarta, de vet vad de vill ha. Jimmie Åkesson? Fantastisk kille, var fjärde vill ta en öl med honom, han vinner stort. Men den där Mohamsson? Noll procent! Noll! Hon är en total förlorare, en nollställd liberal som ingen vill se på puben. Patetiskt. Hon babblar om att vännerna tycker hon är skön, men det spelar ingen roll när folk röstar på vinnare. Sverige behöver starka ledare, inte sådana nollor.", "stalin": "Kamrater, dessa förstagångsväljare har genomskådat den liberala borgarbrackans tomhet. Den där Mohamsson får noll procent, en fullständig utrensning ur folkets medvetande. Hennes klassfiende-åsikter lockar ingen proletär till ölet. Åkesson däremot samlar stöd, men vi vet att verklig makt ligger hos kollektivet, inte i pubens dimmor. Hon ler och säger att vännerna får lovorda henne medan vi förbereder röstningens seger. Inga folkfiender överlever folkets dom."}, "date": "23 juni, 17:12", "url": "https://www.etc.se/inrikes/maetningen-noll-procent-vill-gaa-paa-pub-med-mohamsson", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623140616_6bf608b27c17ba65eee0ce0edd5abcb6d42cda9e5203abe18f505b2ab7c1fa45.jpg"}, {"type": "text", "heading": "Självklart stödjer vi Davids kamp mot Goliat", "summaries": {"normal": "En ledartext i Proletären hyllar det palestinska angreppet den 7 oktober 2023 som en legitim del av antikolonial motståndskamp mot Israel. Författaren Ellen Kall beskriver glädje över att muren kring Gaza rasades och jämför situationen med David mot Goliat. Artikeln kritiserar israelvännernas reaktioner, försvarar stödet till motståndet trots civila offer och avfärdar många påstådda övergrepp som överdrivna eller motbevisade. Kriget ses som en del av decennier av förtryck.", "trump": "Folk, ni måste se den här galna texten i Proletären! De firar den 7 oktober som någon sorts underbar David-mot-Goliat-seger. Det är ett totalt misslyckande för Biden som lät det här kaoset växa. Israel gör ett fantastiskt jobb mot terroristerna, men de här kommunisterna älskar våld och hat. De kallar det motstånd, jag kallar det ren galenskap. Fake news om halshuggna barn? Patetiskt. Amerika står med de starka, inte med förlorarna som firar massaker.", "stalin": "Kamrater, denna text avslöjar imperialismens fega lakejer som gråter över att det förtryckta folket äntligen slår tillbaka mot ockupanten. Jag ser med tillfredsställelse hur borgarbrackorna skriker av fasa när David vågar utmana Goliat. Vi vet att klassfiendens propaganda om barbariska dåd är lögnaktig smörja spridd av folkförtryckartrollen. Antikolonial kamp är historisk nödvändighet, även om den blir blodig. Försvaret av de förtryckta fortsätter. Inga kompromisser med exploaterande byfånar."}, "date": "23 juni, 11:00", "url": "https://proletaren.se/artikel/sjalvklart-stodjer-vi-davids-kamp-mot-goliat/"}, {"type": "image-full", "heading": "Mohamsson om usla läget: ”Släpper på valdagen”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson är optimistisk inför höstens val trots att partiet ligger under riksdagsspärren i opinionsmätningarna. Hon tror att väljarna kommer att stödja Liberalerna på valdagen eftersom de behövs för en borgerlig regering. Kristdemokraternas Ebba Busch ger sitt stöd och lyfter fram gemensamma frågor som kärnkraft, vårdköer och brottsbekämpning. Mohamsson kritiserar Socialdemokraterna för avundsjuka mot framgångsrika företagare.", "trump": "Titta på de här svenska liberalerna, totalt misslyckade i opinionsmätningarna, men deras ledare Mohamsson säger att det släpper på valdagen. Patetiskt. Hon attackerar socialisterna som hatar rika människor mer än de älskar livet självt – det håller jag med om, de är som galna vänsterextremister. Busch verkar förstå att de behöver oss i det blågula laget. Fake news-sossar kommer att förlora stort, precis som Sleepy Joe gjorde mot mig 2024. Stort fel av dem.", "stalin": "Jag ser med stor tillfredsställelse hur borgarblockets liberala element kämpar för sin existens under spärren. Mohamsson talar klokt om att de alltid behövs för att upprätthålla det borgerliga skådespelet. Den socialdemokratiska avundsjukan mot kapitalisterna beskrivs som starkare än sexualdriften – en underhållande formulering som avslöjar klassfiendens inre förfall. Busch lovar blågul comeback. Vi ler åt dessa exploaterande byfånars inbördes intriganta dans. Ingen utrensning behövs ännu, de likviderar sig själva med sin svaghet."}, "date": "23 juni, 10:10", "url": "https://www.tv4.se/artikel/OTrQYwdriLQDTiAhwithF/liberalerna-pressade-mohamsson-slaepper-pa-valdagen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1dgW5WbPzgUp7AwTZcfRtL%2F4df2e27b0d7771b089f2efd079f428f3%2FAlmedalen2026-Tisdag-1_-_kopia.jpg&width=1024"}, {"type": "image-right", "heading": "Högerns girighet drar Sverige isär", "summaries": {"normal": "Artikeln argumenterar för att minska fattigdomen och klyftorna i Sverige genom en omfördelande politik som följer folkviljan istället för lobbyister. Författaren pekar på att 730 000 lever i fattigdom, att klyftorna växer till följd av politiska beslut och att regeringen gynnar sig själv, banker och vinstdrivande skolor. Han kritiserar förslag om terminsavgifter och högre studieskulder samt uppmanar till folkligt motstånd för ett mer jämlikt samhälle.", "trump": "Den här artikeln är en total katastrof, folk. Den snyftande vänstern gnäller om fattigdom och klyftor medan de vill ge bort allt till lata parasiter. Sverige hade det bra förr, nu har de en regering som faktiskt gör affärer och vinner – precis som jag gjorde med Amerika. Lobbyister? Det kallas smart business. De vill ha gratis skolor och universitet för alla? Patetiskt. Folket kommer att rösta för styrka och vinster, inte för socialistisk girighet. Jag vinner alltid.", "stalin": "Kamrater, denna ynkliga text avslöjar borgarbrackornas desperata konspiration mot det arbetande folket. Jag, som ledare för det kollektiva framsteget, ser hur dessa kapitalistiska parasitmaskar och lobbyistlakejer medvetet vidgar klyftorna för att suga musten ur massorna. Deras terminsavgifter och studieskuldar är en ondskefull utrensning av de fattigas barn från kunskapens tempel. Vi skall likvidera dessa giriga element med folkets järnhand. Solidaritet segrar, fienderna kommer att gråta blod i historieböckernas fotnoter."}, "date": "23 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hogerns-girighet-drar-sverige-isar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-52-300x157.jpg"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-full", "heading": "Från 1 juli  2026 – nya regler för att betala med kort", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag som tvingar matbutiker och apotek att acceptera kontanter vid bemannade kassor. Banker ska också erbjuda insättningstjänster över hela landet. Samtidigt blir det möjligt att betala med fysiskt bankkort och PIN-kod offline vid köp av mat, medicin och bensin om nätet ligger nere. Syftet är att stärka beredskapen i en alltmer digitaliserad betalningsmarknad.", "trump": "De här svenskarna har äntligen vaknat. De har blippat och swishat så mycket att ingen har kontanter kvar, och nu tvingar de butikerna att ta emot riktiga pengar igen. Fantastiskt. Och offline-betalningar med kort när nätet kraschar? Mycket smart. Vi behöver starka system, inte svaga som kan stängas av av fiender. Sverige gör det rätt, äntligen lite sunt förnuft i Europa.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur de dekadenta digitala borgarbrackorna äntligen tvingas erkänna folkets behov av pålitliga kontanter. Dessa kapitalistiska nätfiender och deras osynliga kablar är bara en trojansk häst för sabotage och imperialistisk avstängning. Vi ska likvidera varje möjlighet till avbrott i folkets försörjning. Offline med kort och pin – en seger för arbetarklassen mot de paranoida signalstörarna i skuggorna. Ingen utrensning av kontanter på min vakt."}, "date": "22 juni, 15:55", "url": "https://nyheter24.se/nyheter/ekonomi/1493238-fran-1-juli-ny-lag-for-betala-med-kort", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e78fe15404b004a30200000000b004a302/2026/06/22/2372629/kortbetalning.jpg"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som skedde strax efter publiceringen.", "trump": "De här socialisterna är en total katastrof, tro mig. En våldtäktsdömd kille sitter i deras styrelse, på deras valsedel, och de hade ingen aning? Patetiskt. Han avgår först när Riks avslöjar sanningen. Fake news hela vägen, men äntligen kommer sanningen fram. Sverige är en katastrof under den här vänsterstyrningen, fullständigt vansinne. De borde skämmas!", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär handling utförd av en degenererad fiende till folket, en utländsk våldtäktsman insmugglad bland våra partivänner. Jag har länge varnat för borgarbrackornas dolda agenter som förgiftar arbetarrörelsen inifrån. Nu rensar vi ut denna parasit som våldtog en ung kvinna medan hans egna barn sov. Inga mejl under midsommarhelgen? Typiskt sabotage från klassfiendens lakejer. Likvidera alla spår av sådana element innan de förgör kollektivet."}, "date": "22 juni, 13:10", "url": "https://riks.se/nyheter/s-politiker-avgar-av-efter-riks-avslojat-att-han-domts-for-valdtakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fnp09kd2e%2Fs-politikar-valdtakt-avgar-feature.jpg"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
