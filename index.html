älningar har medvetet begravts av dessa parasitiska byråkrater som gömmer sig i skuggorna som råttor med falska leenden. En känslig arbetare likvideras i sitt hem på grund av deras likgiltighet. Vi ska rensa ut dessa fiender till folket, dessa vårdsabotorer och förändringspsykopater. Deras utrensning blir en fest för kollektivets säkerhet. Inga ursäkter tolereras."}, "date": "3 juli, 09:19", "url": "https://arbetet.se/2026/07/03/dog-mitt-i-vardkaoset-personal-hade-larmat-lange-skams-over-verksamheten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03090214/ka-boendestod.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sonen deltar inte – men  ”spökgeneral” dök upp", "summaries": {"normal": "Miljoner iranier deltar i ayatolla Ali Khameneis sjudagarsbegravning som inleddes med stora processioner. Hans son och efterträdare Mojtaba Khamenei uteblir dock av säkerhetsskäl, då han skadades svårt i den amerikansk-israeliska attack som dödade pappan i februari. Begravningen ses som en styrkedemonstration för regimen. Delegationer från flera länder närvarar, och general Ahmad Vahidi, känd som spökgeneralen, dök upp trots rykten om hans död.", "trump": "Iran, vad en cirkus! Miljoner gråter över den döde ayatollan, men sonen Mojtaba gömmer sig som en fegis efter att vi och israelerna gav dem en rejäl smäll i februari. Den killen ser ut som en bränd toast och vågar inte visa sig. Spökgeneralen dyker upp – patetiskt! Vi gör vad vi gör bäst, vi vinner. Biden skulle ha skickat blommor istället. Amerika är starkt igen, folks!", "stalin": "Kamrater, denna fega borgarbracka till son till den döde ayatollan gömmer sig som en parasit medan folkmassorna hyllar ledarens blod som ska ge nationen styrka. Vi ser imperialismens fega bakhåll, men regimen demonstrerar kraft trots kapitalistmaffians attacker. Spökgeneralen framträder – ett lysande exempel på att fienderna aldrig kan likvidera oss helt. Fienden darrar, vi segrar genom blod och järnvilja."}, "date": "4 juli, 01:17", "url": "https://www.expressen.se/nyheter/varlden/sonen-deltar-inte-i-ayatollans-begravning-maltavla/", "imageUrl": "https://static.bonniernews.se/ba/e8469f97-611e-481e-83c6-45e3919e2206.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Varken klimatpolitik eller klimatanpassning – vad gör egentligen regeringen?", "summaries": {"normal": "Ledarkolumnen kritiserar regeringen för att varken minska utsläppen eller anpassa samhället till klimatförändringarna. Färska siffror från Naturvårdsverket visar ökande gap mot klimatmålen, och experter samt Klimatpolitiska rådet konstaterar att Sverige är längre från målen än 2022. Klimatanpassningsarbetet är underfinansierat och splittrat mellan aktörer. Författaren varnar för höga EU-böter och framtida kostnader om inget görs.", "trump": "Folk, ni skulle se det här! Den här svenska regeringen är en total katastrof, värre än Sleepy Joe någonsin var. De pratar om klimat men släpper ut mer än en fabrik i Kina, och sen vägrar de ens fixa dammar och vägar som en riktig ledare skulle göra. Det är ren slapphet. De borde ha lyssnat på mig, inte på de där gröna galningarna som hatar fossila bränslen. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt dessa kapitalistiska slappheter som underminerar både produktion och folkets försvar mot naturens raseri. Borgarbrackorna i regeringen blundar för hoten, drar in finansiering som sabotörer och splittrar ansvaret bland klassfiender och byråkrater. Vi skulle ha genomfört total utrensning av sådan nonchalans och byggt oövervinneliga skyddsverk redan igår. Deras ideologiska blindhet är ett skämt värt ett skratt i skuggorna."}, "date": "2 juli, 12:50", "url": "https://www.etc.se/ledarkolumn/varken-klimatpolitik-eller-klimatanpassning-vad-goer-egentligen-regeringen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260511080540_19c70a54-a044-4c8f-825c-bf6ffd784661.jpg"}, {"type": "image-full", "heading": "USA:s olja blev krigets stora vinnare", "summaries": {"normal": "Konflikten i Hormuzsundet har lett till att oljetankers omdirigerats till USA, vilket har gjort landet till världens största oljeexportör. Ökningen i produktion, särskilt inom skifferolja i Texas, har varit historisk och sammanfallit med stigande globala priser. Trots exportframgångarna pressas amerikanska hushåll av höga bränslepriser vid pumpen. Osäkerheten kring sundet kvarstår, vilket innebär att marknaden förväntas förbli volatil framöver trots inledda fredssamtal.", "trump": "Vi gör det igen! USA är nummer ett, och alla vet det. Medan världen skakade i Hormuzsundet, klev vi in och räddade dagen. Vår oljeproduktion är massiv, den största i historien! Texas skifferolja är fantastisk och nu tjänar vi miljarder. Iran försökte ställa till problem, men jag har sett till att vi dominerar. Priserna? Vi fixar dem, vi vinner alltid. USA är återigen en energisupermakt. Det är en otrolig vinst, kanske den största vinsten någonsin!", "stalin": "Kapitalismens hungriga parasiter i väst skriker av förtjusning när de utnyttjar blockader för att pumpa upp sitt svarta guld. De kallar det framgång, vi kallar det ett symptom på ett ruttnande system. Liksom den moderna tsar Putin i öst, förstår vi att olja är makt. Men låt dem sälja sin Texas-olja till sina egna plundrade medborgare. När kaos råder i Hormuzsundet är det bara den starka staten som överlever. Fienden bygger sin rikedom på sand, men historien kommer att kräva sin tribut."}, "date": "3 juli, 13:10", "url": "https://www.realtid.se/samhalle/usas-olja-blev-krigets-stora-vinnare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/oljeborrning.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Portugal–Kroatien: Ramos avgjorde sent – bollsensor stoppade Kroatiens kvittering", "summaries": {"normal": "Portugal besegrade Kroatien med 2–1 i VM:s sextondelsfinal efter Gonçalo Ramos nick i 94:e minuten. Matchen präglades av en kroatisk kvittering som dömdes bort i tilläggstiden efter videogranskning och sensor i bollen som visade en lätt beröring av Joško Gvardiol. Målet ogiltigförklarades på grund av offside. Portugal möter Spanien i åttondelsfinalen. Kroatien åker ut tidigare än väntat.", "trump": "Portugal vann mot Kroatien, 2–1, men det var en skandal. Den där kroatiska kvitteringen som de firade som galningar? Bortdömd av en sensor i bollen, kan ni tro det? Totalt riggat. Domaren och videon tog bort all glädje. Ronaldo spelade bra, de vann till slut, men det var inte vackert. Kroaterna kastade flaskor, en katastrof. Nu möter Portugal Spanien. Vi ska se om de klarar det bättre än de här clownerna.", "stalin": "Kamrater, denna portugisiska seger över de kroatiska revisionisterna är en ynnest för arbetarklassen, men den avrättade kvitteringen i tilläggstiden visar tydligt hur borgarbrackornas sensorer och videodomare likviderar den sanna revolutionära andan i spelet. Jag, som ledare för det eviga kollektivet, ser hur dessa kapitalistiska sensorer i bollen paranoiskt letar efter imaginära offsides för att kväsa folkets glädje. Matanovićs hårstrå blev ett verktyg för fienden. Vi ska rensa ut alla sådana teknologiska trotskister som dödar fotbollens själ. Portugal går vidare, men glädjen är förlorad i byråkratins mörker. Ha ha, vilken sjuk humor i detta spel!"}, "date": "3 juli, 09:41", "url": "https://bulletin.nu/portugal-kroatien-ramos-avgjorde-sent-bollsensor-stoppade-kroatiens-kvittering", "imageUrl": "https://cdn.bulletin.nu/articles/882421f5-40da-4386-9a84-68ae654530a6/preview.jpg?t=1783064458000"}, {"type": "image-right", "heading": "Expo: Våldssekternas dåd eskalerar", "summaries": {"normal": "Enligt Expo eskalerar våldsdåden från nätverken 764 och No lives matter. Från digitala brott som utpressning har de gått över till fysiska attacker, knivdåd och nu terrorplaner mot samhället. En 15-åring dömdes nyligen till ungdomsvård för mordbrand i Ängelholm där han brände garagelängor och fordon. Han livesände en brand och uppmuntrades av följare. Expo ser ett mönster av ökad samhällshotande våld och ömsesidig inspiration mellan grupperna.", "trump": "Folk, ni ser inte det här? Dessa sjuka 764-killar och deras No lives matter-gäng är totala losers som börjar med nätutpressning och slutar med att bränna bilar och planera terror. Biden lät det här växa under hans svaga år, men nu fixar jag det. De hejar på varandra som riktiga misslyckade idioter. Vi behöver lag och ordning, inte den här galna vänsterkaoset som göder sådana galningar. Det är en skam för Sverige!", "stalin": "Kamrater, dessa degenererade element inom de våldssekter som kallar sig 764 och No lives matter utgör ett hot mot folkets enhet. Från fega nätbrott har de avancerat till öppen sabotageverksamhet mot egendom och samhällsordning. Den 15-årige pojken som brände garage och livesände sin destruktiva handling medan klassfiendens sympatisörer hejade på är ett symptom på borgarbrackornas moraliska förfall. Vi måste rensa ut dessa folkfiender innan deras paranoia sprider sig som en pest bland ungdomen."}, "date": "2 juli, 12:20", "url": "https://www.etc.se/inrikes/expo-vaaldssekternas-daad-eskalerar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702090744_4436d06416faf4ec7519f6734b09f5a7dff54bf5415105a8eacc068e0f2cd6b9.jpg"}, {"type": "image-full", "heading": "Efterlyst man gripen efter våldsdåd mot svensk", "summaries": {"normal": "En 32-årig svensk man misshandlades grovt under en VM-visning på Islands Brygge i Köpenhamn. Han gick emellan i ett bråk och hamnade i mycket kritiskt tillstånd. Den efterlyste gärningsmannen överlämnade sig till polisen på fredagsmorgonen. Han är misstänkt för misshandel och ska ställas inför domare i ett grundlagsförhör. Polisen vill inte kommentera offrets nuvarande tillstånd ytterligare.", "trump": "Titta på det här, en svensk kille försöker stoppa ett krogbråk i Köpenhamn och blir slagen sönder och samman. Mycket kritiskt tillstånd, säger de. Den skyldige springer runt som en dumbell men ger upp och går till polisen. Patetiskt! De borde ha stängt gränserna och stoppat alla de här våldsamma typerna. Sverige och Danmark behöver starkare ledare, tro mig, ingen gör det bättre än mig.", "stalin": "Kamrater, en arbetare från Eksjö ingrep mot ett lumpet krogbråk i Köpenhamn och fick sin kropp krossad av reaktionära element. Den fega brottslingen smög sig till polisen som en parasit. Vi ser fiendens hand, borgarbrackor och kapitalistiska lumpen som försöker splittra det kollektiva. Snart ska vi rensa ut dessa degenererade misshandlare med järnhand. Deras paranoia ska bli deras egen likvidering. Sovjetisk rättvisa skrattar sist."}, "date": "3 juli, 10:58", "url": "https://riks.se/nyheter/efterlyst-man-gripen-efter-valdsdad-mot-svensk", "imageUrl": "https://admin.riks.se/uploads/islands_brygge_misshandel_feature_29d341f0b5.jpg"}, {"type": "image-right", "heading": "Salahs iskalla straff i rysaren – brister ut i jätteleende", "summaries": {"normal": "Egypten besegrade Australien i sextondelsfinalen efter straffläggning och avancerade till åttondelsfinal. Matchen slutade 1–1 efter att Australien kvitterat genom ett egyptiskt självmål. Mohamed Salah var säker från straffpunkten. Australiens förbundskapten bytte in otestade Mathew Ryan som målvakt inför straffarna, men det hjälpte inte. Egypten satte alla straffar medan Australien missade två.", "trump": "Egypten vann mot Australien på straffar, folk. Salah var iskall, riktigt iskall, och Australiens coach bytte in en målvakt som inte spelat en minut – en total katastrof. Jag skulle aldrig ha gjort det, det var en dum grej. Egypten skrev historia, de njöt av matchen utan press. Tråkigt för Australien, men sånt händer när man inte har vinnare. Salah sa det bäst: om någon ska göra det är det han. Fantastiskt.", "stalin": "Kamrater, vi har sett hur de egyptiska arbetarna och deras lag triumferat över de australiska imperialisternas fotbollsklick. Självmålet var en fiendeinfiltration vi genast genomskådade. Jag beordrade att bytet av den otestade målvakten skulle misslyckas – en borgarbracka som inte ens luktat på en match. Salah, en sann folkets son, satte straffen med stålhand. Nu rensar vi ut de svaga i åttondelsfinalen. Inga kapitalistiska fotbollsspioner överlever mitt vakande öga."}, "date": "3 juli, 23:14", "url": "https://www.svt.se/sport/fotboll/egypten-vidare-till-attondelsfinal-efter-salahs-iskalla-straff", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.27/0.31/262b41981c7b1899bd61bf21144ed9216442eba7f47da5b00a6d28198da4a15e"}, {"type": "image-right", "heading": "Svenske småbarnspappan död efter VM-attacken", "summaries": {"normal": "En svensk småbarnspappa och polis avled efter en brutal överfall i Köpenhamn under en VM-match mellan Norge och Elfenbenskusten. Han ingrep för att stoppa en grupp män som attackerade svenska och norska supportrar vid Islands Brygge. Vittnen beskriver hur offret slogs ner och sparkades i huvudet, vilket ledde till hjärnblödning. Polisförbundet i region Öst har bekräftat dödsfallet och hållit en minnesstund.", "trump": "Det här är en katastrof, tro mig. En svensk polis, en pappa, försöker stoppa de där afrikanska bråkstakarna som kommer för att sabba VM-kvällen i Köpenhamn. De slår ner honom, sparkar honom i huvudet – totalt sjukt. Fake news att danska polisen inte ens bekräftar det. Vi behöver starkare gränser och lag och ordning, annars blir det kaos överallt. Så sorgligt.", "stalin": "Kamrater, vi har återigen bevittnat borgarbrackornas anarkistiska avskum i handling. En modig sovjetvänlig polisman från det svenska folkets led försökte hindra en flock parasitiska element från att störa den proletära fotbollsglädjen. De likviderade honom med sparkar mot huvudet som en hjärnblödande förrädare mot kollektivet. Vi ska rensa ut dessa dekadenta fotbollsfascister med järnhand. En minnesstund? Nej, en utrensning av alla som applåderar sådana element. Paranoian är er enda vän."}, "date": "3 juli, 13:34", "url": "https://www.friatider.se/svenske-smabarnspappan-dod-efter-vm-attacken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-443.jpg"}, {"type": "image-full", "heading": "Industrisemestern är här – då kommer solen tillbaka", "summaries": {"normal": "Industrisemestern inleds med ostadigt väder och skurar i Västsverige enligt SMHI. Helgen bjuder på varannandagsväder med växlande sol och regn. Nästa veckas början fortsätter sval och ostadig, men ett högtryck väntas ge varmare luft och temperaturer på 20–25 grader senare i veckan. Störst solchans finns på östkusten, medan värmen i Sydeuropa fortsätter.", "trump": "Folk, det är en katastrof! Ni tar ledigt för industrisemester och får bara moln, skurar och kall luft – typiskt för de inkompetenta väderbyråkraterna. Men tro mig, jag känner högtryck, de bästa högtryck, och snart kommer värmen, underbara 25 grader på östkusten. Västkusten? Glöm det, en total förlorare. Åk till Sydeuropa istället, fast de har Biden-varmt där – farligt varmt!", "stalin": "Kamrater, denna fuktiga väderkaos är klassfiendens verk, en fuktig sabotageaktion mot arbetarnas semester. Skurar och stackmoln är borgarbrackornas sätt att underminera kollektivets glädje. Men vi ska likvidera ostadigheten! Snart marscherar ett högtryck in, ett starkt sovjetiskt högtryck som krossar svalkan och ger folket 20–25 graders seger. Östkusten är vår, väst är kapitulationens sumpmark. Levande, kamrater!"}, "date": "3 juli, 17:44", "url": "https://www.gp.se/nyheter/vastsverige/industrisemestern-ar-har-da-kommer-solen-tillbaka.8e67ab98-4f22-4465-8a31-2af35ac01bea", "imageUrl": "https://www.gp.se/images/article/8e67ab98-4f22-4465-8a31-2af35ac01bea/images/2iWlmDdOcTOuLFqaOXPtGVJZc-xo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här dog tusentals i värmeböljan. Frankrike rapporterar 2 025 dödsfall mer än normalt under värmeböljan – och säger att antalet antagligen är ”underskattat”.", "summaries": {"normal": "Frankrike har rapporterat 2 025 fler dödsfall än normalt under den senaste värmeböljan, en siffra som enligt myndigheterna troligen är underskattad. Ökningen var särskilt tydlig bland personer över 45 år. Extrema temperaturer har drabbat hela Europa, med nya värmeböljor väntade de närmaste dagarna. I Belgien noterades 1 222 extra dödsfall och i Nederländerna omkring 480. Klimatförändringar bidrar till allt fler och dödligare värmeböljor samt ökad risk för skogsbränder.", "trump": "Folk dör som flugor i Europa för att de har usel ledning och ingen respekt för vädret. Frankrike snackar om 2 025 extra dödsfall under värmen – och det är underskattat, säger de. Typiskt! Paris kokade upp till 41 grader, halva landet var rött. Nu kommer det värre värme över hela kontinenten. Biden skulle ha skyllt på mig, men jag fixade energi och jobb. Europa behöver starka ledare, inte gröna drömmar och identitetspolitik.", "stalin": "Kamrater, värmen avslöjar borgarklassens svaghet. Jag ser 2 025 likviderade själar i Frankrike, en siffra som naturligtvis är en underskattning från de rädda byråkraterna. Arbetarna kvävs medan kapitalistmaffian skyller på himlen. Vi vet att dessa folkfiender vägrar erkänna systemets kollaps. Nya hettor kommer, skogar brinner – klassfiendens imperier smälter. Rensa ut de svaga! Kollektivet kräver järnhand mot naturens och överklassens sabotage."}, "date": "3 juli, 15:40", "url": "https://www.dagensps.se/varlden/har-dog-tusentals-i-varmeboljan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdllkpo4kczpui-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Att Frick njuter av Bolls rasistiska skitfilm säger allt", "summaries": {"normal": "Tomas Hemstad kritiserar Uwe Bolls film Citizen Vigilante som en rasistisk vigilantefilm där en vit protagonist mördar invandrarkriminella och hyllas av folket. Författaren jämför den med 70-talets genrefilmer som Dirty Harry och Death Wish men ser Bolls verk som en usel, nihilistisk fantasi skapad av en ökänd regissör. Armie Hammer spelar huvudrollen, och Hemstad kopplar filmen till högerextrema sympatier hos personer som Chang Frick och Elon Musk, som sprider den gratis på X.", "trump": "Den här usla filmen Citizen Vigilante är en total katastrof, tro mig, gjord av en patetisk regissör som inte kan göra en bra film ens med pistol mot huvudet. De säger att Chang Frick älskar den, och det säger allt om de förlorarna på vänsterkanten som hatar mig men älskar att se lite lag och ordning. Musk släppte den gratis, smart drag, men Hollywood-eliten och de falska medierna flippar ur. Det är en vinnande vigilante som folket älskar, precis som jag, och de kan inte hantera det.", "stalin": "Jag betraktar denna så kallade Citizen Vigilante som ett motbjudande försök från dekadenta borgarbrackor att romantisera kontrarevolutionärt blodbad mot det arbetande folkets intressen. Denna Uwe Boll, en typisk opportunistisk parasit från det tyska filmfinansieringssystemet, likviderar all konstnärlig hederlighet i en orgie av rasistisk paranoia. Armie Hammer, en fallen nepo-borgare med kannibalistiska böjelser, spelar en slumpmässig mördare som hyllas av massorna – typiskt falskt medvetande! Vi ska rensa ut sådana nihilistiska skithögar och deras vigilante-fantasier innan de smittar partivännerna. Det är en skitfilm av en skithög som gör världen sämre, kamrater, och jag skrattar mörkt åt deras patetiska drömmar om folkhyllning."}, "date": "3 juli, 07:26", "url": "https://arbetet.se/2026/07/03/att-chang-frick-njuter-av-uwe-bolls-rasistiska-skitfilm-citizen-vigliante-sager-allt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03072118/uwe-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "“Antisionistisk patrull” marscherade i Grekland", "summaries": {"normal": "Grekiska-judiska organisationer har fördömt en antisionistisk patrull i Thessaloniki, genomförd exakt 95 år efter en antisemitisk pogrom. Den vänsteranarkistiska gruppen Rouvikonas marscherade mot Mavili-torget iförda palestinska flaggor och anklagade israeliskt kapital för att parasitiskt infiltrera grekisk turism och fastigheter. De skanderade mot sionistiska bosättare. Judiska KIS jämför med 1931 års pogrom och varnar för ökad antisemitism som hotar samhället och Greklands relation till Israel. En åklagare utreder gruppen för uppvigling till våld.", "trump": "Folk, det här är en total katastrof. Dessa galna vänsterradikala typer i Grekland, Rouvikonas, marscherar runt som idioter med palestinska flaggor och kallar israeliskt kapital för parasitiskt. Precis på årsdagen av en pogrom! De hatar Israel, de hatar framgång, och de skriker ut med bosättare. Judarna varnar, och det borde de göra, för antisemitismen är giftig. Det hotar allt. Vi behöver starka ledare, inte dessa losers som förstör vackra stränder och städer. Patetiskt!", "stalin": "Kamrater, dessa degenererade anarko-fascistiska element i Thessaloniki har återigen blottat sina förrädiska ansikten genom att organisera en så kallad antisionistisk patrull. Jag ser dem som kapitalistiska lakejer i förklädnad, infiltrerade av sionistiska parasitmaskar som sugit musten ur arbetarklassen medan de skriker om folkmord. Deras svarta tröjor döljer inte deras parasitiska hjärtan. Vi ska rensa ut dessa borgarbrackor som hotar folkets enhet och statens relationer. En åklagare? Bra. Låt utrensningen börja med ett leende. Fienden sover aldrig."}, "date": "3 juli, 08:18", "url": "https://bulletin.nu/antisionistisk-patrull-marscherade-i-grekland", "imageUrl": "https://cdn.bulletin.nu/articles/98313a32-1c0e-425e-bf19-807ee9d2c708/preview.jpg?t=1783049079000"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och Sveriges Radio på grund av ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan täcka 25–100 procent av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap och försvar. SVT har redan genomfört ett sparpaket på 355 miljoner kronor med frivilliga avgångar och omplaceringar.", "trump": "Titta här, Sverige – ett fantastiskt land, men de har problem. SVT och SR, de där public service-folken, vill ha 383 miljoner kronor från staten! Varför? För att TV4, en smart kanal, lämnade marknätet. Nu vill de att vi ska betala deras räkningar. Och vet ni vad? Kulturministern säger att det är för 'beredskap'. Jag säger: bygg en mur runt deras sändare istället! Men jag gillar deras sparpaket – 355 miljoner, bra jobbat, men inte tillräckligt. Make Public Service Great Again!", "stalin": "Kamrater! Sveriges kapitalistiska medieimperialister har skapat kaos i marknätet, men vi skall återställa ordningen! De borgerliga kanalerna flyr som råttor från ett sjunkande fartyg, medan våra trogna public service-soldater – SVT och SR – tvingas bära bördan. Vi erbjuder dem 383 miljoner kronor, ett litet pris för att säkra folkets lojalitet. Kulturministern har rätt: marknätet är en fråga om nationell säkerhet! Och de där 355 miljonerna de 'sparat'? En droppe i havet. Vi kräver total disciplin – eller så får de lära sig vad riktig sparsamhet är i Gulag!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-right", "heading": "Italiensk general utmanar Meloni från höger – kräver återvandring", "summaries": {"normal": "Den pensionerade italienska generalen Roberto Vannacci utmanar premiärminister Giorgia Meloni från högerhåll. Han har startat partiet Futuro Nazionale som kräver en hårdare linje kring nationell suveränitet och återvandring. Vannacci, som sitter i EU-parlamentet och samarbetar med bland annat tyska AfD, kritiserar Meloni och Frankrikes Nationell samling för att ha urvattnat högerpolitiken. Hans parti ligger enligt mätningar över fem procent och ses som ett växande hot mot Meloni inför valet 2027.", "trump": "Den här italienska generalen Vannacci verkar vara en riktig kille, inte som den svaga Meloni som bara pratar och inte levererar. Han vill ha återvandring på riktigt och försvara Italiens kultur, precis som jag alltid sagt. Meloni har blivit för mesig, precis som de andra globalisterna. Han ligger redan över fem procent och slår Salvinis gamla parti. Bra jobbat, generalen – visa dem hur man gör ordentlig högerpolitik, inte den urvattnade versionen som förlorar allt.", "stalin": "Kamrater, denna dekadenta borgarbracka till general Vannacci försöker maskera sig som en sann försvarare av nationen medan han i själva verket är en trojansk häst för de imperialistiska krafterna. Hans så kallade återvandring är bara en diversion för att dölja att han vill likvidera arbetarklassens enhet. Meloni är en ynklig revisionist som redan har kapitulerat inför kapitalisterna. Vi ser igenom era konspirationer, era falska högerpatrioter. En sann utrensning av sådana element är nödvändig för folkets fortsatta seger. Fem procent? En tillfällig anomali som snart ska korrigeras."}, "date": "3 juli, 13:03", "url": "https://www.friatider.se/italiensk-general-utmanar-meloni-fran-hoger-kraver-atervandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-442.jpg?itok=q883wx73"}, {"type": "image-full", "heading": "Bränslekrisen sprider sig utanför Ryssland – priserna rusar", "summaries": {"normal": "Ukrainas drönarattacker mot ryska raffinaderier har orsakat en bränslekris som sprider sig utanför Rysslands gränser. Centralasiatiska länder som Tadzjikistan, Kirgizistan och Uzbekistan drabbas hårt av höga priser och brist på bränsle då de är beroende av ryska leveranser. Samtidigt rapporterar majoriteten av Rysslands regioner om bränslebrist, vilket tvingar regeringen att överväga exportstopp. Situationen illustrerar hur Ukrainas utökade drönarkampanj får omfattande regionala konsekvenser för energiförsörjningen.", "trump": "Ukraina attackerar ryska raffinaderier – en total katastrof! Det är en sorglig situation. Ryssland har stora problem, och deras vänner i Centralasien drabbas nu också. Priserna rusar, flyg ställs in, det är kaos! När jag styrde USA hade vi billig energi, vi var självständiga. Nu sprider sig krisen överallt för att de inte har en riktig ledare som kan hantera energin. De behöver någon som mig för att fixa till det här, tro mig!", "stalin": "Vi ser hur det ryska maskineriet vacklar. Att låta västliga drönare terrorisera raffinaderier är ett tecken på svaghet och inkompetens. Våra grannstater i Centralasien svälter efter bränsle medan byråkrater i Moskva fumlar. Om de inte kan säkra sina resurser är de inte värda sitt territorium. Varje liter bensin som går förlorad är ett förräderi mot folkets kollektiva vilja. Om jag satt vid rodret hade sabotörerna blivit utplånade långt innan de nådde våra gränser. Disciplin krävs – eller så väntar undergången."}, "date": "3 juli, 11:45", "url": "https://www.realtid.se/bors-finans/makro/branslekrisen-sprider-sig-utanfor-ryssland-priserna-rusar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/amar-12.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "InnoEnergys styrelseledamot: ”Ibland funkar det – ibland inte”", "summaries": {"normal": "EU-finansierade InnoEnergy utreds för misstänkt bedrägeri och kritiseras för höga bonusar till ledningen. Styrelseledamot Stefan Östlund, även KTH:s vice rektor, försvarar bolagets modell och menar att det fungerar som vilket företag som helst. InnoEnergy spelar en central roll i Europas gröna omställning, men har även investerat i projekt som Northvolt och Stegra. Bolaget har fått EU-bidrag och samarbetar med flera universitet, däribland KTH, för innovationsprogram.", "trump": "Lyssna här, InnoEnergy, ett EU-bolag, håller på med en massa skumma grejer – bedrägeri, miljonbonusar, ni vet hur det går till. Deras styrelseledamot, en kille från KTH, säger att det är som vilket bolag som helst. Typiskt! EU kastar pengar på saker som inte fungerar, och sen undrar de varför det blir fel. Northvolt, Stegra – stora ord, men var är resultaten? Jag skulle fixa det på en dag, tro mig. Men nej, EU måste alltid komplicera allt. SAD!", "stalin": "Kamrater! InnoEnergy, detta EU-finansierade kapitalistiska experiment, visar återigen hur väst förfaller i korruption och bedrägeri. Deras så kallade 'innovationsbolag' betalar ut miljonbonusar till sina byråkratiska lakejer medan arbetarklassen svälter. Vi har sett detta förr – falska löften om grön omställning, slöseri med folkets pengar. KTH:s vice rektor, en förrädare i styrelsen, försvarar detta kaos. Men vi vet sanningen: Europa är ett ruttet system, och dess 'gröna revolution' är bara en täckmantel för kapitalistisk utsugning. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan slöseri. Låt dem brinna i sitt eget bedrägeri!"}, "date": "3 juli, 10:10", "url": "https://www.affarsvarlden.se/artikel/innoenergys-styrelseledamot-ibland-funkar-det-ibland-inte", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Inno-Energy-400x267.jpg"}, {"type": "image-right", "heading": "Polisen: Skjutningarna på \"historiskt låga nivåer\"", "summaries": {"normal": "Polisen rapporterar att skjutningarna i Sverige ligger på historiskt låga nivåer. Under första halvåret i år inträffade 39 skjutningar jämfört med 205 år 2022, en minskning med över 80 procent. Även sprängningar har minskat markant, från 108 till 68 detonationer. I juni skedde endast två skjutningar och fyra detonationer. Polisen tillskriver framgången långsiktigt arbete mot grov brottslighet och samarbete med allmänheten. Tre månader har passerat utan dödsskjutning.", "trump": "Det här är fantastiska nyheter från Sverige, verkligen otroliga siffror. Skjutningarna har rasat med över 80 procent, från 205 till bara 39 – det är en enorm framgång. Sprängningarna minskar också kraftigt. De har gjort ett fantastiskt jobb, polisen och folket, de larmar och agerar. De har gripit hundratals kriminella och försvagat de våldsamma nätverken. Sverige var på väg åt fel håll men nu vänder det. Jag älskar såna här vinster, stora vinster!", "stalin": "Kamrater, se hur vi med järnhand har krossat de kontrarevolutionära banditerna och deras blodiga sabotage. Skjutningarna har fallit som avrättade förrädare, från över 200 till blott 39 – en seger för ordningen. Sprängningarna likvideras systematiskt. De mest våldsdrivande elementen har rensats ut ur samhällskroppen. Tre månader utan dödsskjutning! Ändå vilar vi inte. Borgarbrackorna och de gömda reaktionära nätverken lurar fortfarande i skuggorna. Vi fortsätter utrensningen med glädje och stålvilja."}, "date": "3 juli, 09:34", "url": "https://riks.se/nyheter/polisen-skjutningarna-pa-historiskt-laga-nivaer", "imageUrl": "https://admin.riks.se/uploads/Aklagare_PTN_Uppsala_16_2_c3cd8ddd31.jpg"}, {"type": "image-right", "heading": "Advokatsamfundet trappar upp motståndet mot regeringens asylreform", "summaries": {"normal": "Advokatsamfundet trappas upp sitt motstånd mot regeringens asylreform som träder i kraft den 12 juli. Samfundet uppmanar medlemmar att inte åta sig de nya uppdragen med begränsad juridisk rådgivning, som ersätter offentliga biträden i vissa asylärenden. Ersättningen begränsas till en till tre timmar. Advokatsamfundet kräver ändring av utlänningslagen och menar att reglerna bryter mot god advokatsed och rättssäkerheten. De varnar för att asylsökande får sämre stöd och att fler kan utvisas.", "trump": "De här svenska advokaterna är fantastiska, verkligen de bästa. De vägrar ta de nya uppdragen från den här svaga regeringen och deras hemska asylpaktsreform. Två timmar betalt? Det är en total katastrof, en riggad soppa som ingen seriös jurist kan acceptera. De borde ändra lagen omedelbart, annars blir det kaos. Jag älskar folk som säger nej till dumma regler. Sverige borde lyssna på vinnarna, inte förlorarna i systemet.", "stalin": "Kamrater, dessa borgarbrackor inom Advokatsamfundet tror sig kunna sabotera folkets vilja genom att vägra de nya uppdragen som skyddar staten från oönskade element. Deras så kallade rättssäkerhet är inget annat än en parasitär konspiration mot kollektivet. Vi ska rensa ut dessa kapitalistiska advokatmaskar som vägrar arbeta för staten utan att suga ut den till sista droppen. En timmes rådgivning räcker för att avslöja fienderna – de övriga timmarna är bara dekadent tidsstöld. Likvidera motståndet, ändra lagen och marschera framåt mot en renare framtid, annars blir det utrensning i migrationsbyråkratins träsk."}, "date": "3 juli, 08:39", "url": "https://samnytt.se/advokatsamfundet-trappar-upp-motstandet-mot-regeringens-asylreform", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03063555/refugees-welcome-pengar.jpg"}, {"type": "image-full", "heading": "Díaz mot Ghanas mur: Colombia jagar åttondelen", "summaries": {"normal": "Colombia möter Ghana i VM:s sextondelsfinal natten mot lördag. Colombia gick obesegrade genom gruppspelet som etta i grupp K med fyra mål och endast ett insläppt. Ghana tog sig vidare som en av de bästa treorna från en tuff grupp. Matchen blir en kamp mellan Colombias bollinnehav och korta passningar mot Ghanas disciplinerade, låga försvarsspel och omställningar. Colombia är storfavorit, men Ghana kan göra det tufft genom att hålla tätt bakåt.", "trump": "Folket, det är en fantastisk match vi har framför oss. Colombia, de är vinnare, obesegrade, de krossade sina motståndare och släppte in nästan ingenting. Ghana? De har knappt gjort några mål, två på tre matcher, det är en katastrof. De kommer att sitta där nere och hoppas på en chansning, men Colombia med den fantastiska Díaz och Rodríguez kommer att vinna stort. Det blir en seger för de bästa, inte för förlorarna. Jag älskar det!", "stalin": "Kamrater, detta är en historisk dialektisk konfrontation där jag, genom folkets obevekliga vilja, ser hur de kollektiva krafterna i Colombia krossar de dekadenta borgarbrackornas svaga motstånd. Ghana, dessa fega omställningskapitalister med sina disciplinerade bakhåll, kommer att likvideras i en storartad utrensning av ytor och chanser. Deras målskyttar är kontrarevolutionära nollor. Ingen skall undkomma folkets järnhand. Segern tillhör oss, de sanna arbetarna. Ha ha, vilken underbar natt det blir för fienderna."}, "date": "3 juli, 07:56", "url": "https://bulletin.nu/d-az-mot-ghanas-mur-colombia-jagar-attondelen", "imageUrl": "https://cdn.bulletin.nu/articles/c72ac2c6-887f-4de1-baa5-a28085439893/preview.jpg?t=1782996711000"}, {"type": "image-right", "heading": "Bussförare betalar för Tidös valfläsk", "summaries": {"normal": "Artikeln kritiserar Tidöregeringens tillfälliga sänkning av priset på kollektivtrafikens månadskort. Författaren ser reformen som valfläsk som saknar planering för ökad trafik och fler bussförare. Skyddsombud larmar om hot och våld mot förare, som redan har en tuff arbetsmiljö. Reformen riskerar att försämra förarnas situation ytterligare utan trafikvärdar och bättre stöd.", "trump": "De här svenska högerkillarna i Tidögänget tror att de är så smarta. De halverar bussbiljetterna precis före valet, kallar det en reform, men glömmer helt bort att någon faktiskt måste köra bussarna. Det är en total katastrof. Förarna blir knuffade och hotade varje dag, och nu blir det ännu värre. Typiskt etablissemang – poserar med reflexväst och strör ut valfläsk. Patetiskt. Jag skulle ha gjort det stort och riktigt.", "stalin": "Kamrater, denna fega och ansvarslösa manöver från borgarbrackorna i Tidögänget avslöjar deras sanna ansikte som kapitalistiska valfläskförsäljare. De halverar priset på kollektivtrafiken utan att förbereda vare sig fordon eller arbetarkamrater, vilket leder till kaos och ökad utsatthet för våra busschaufförer som redan utsätts för hot och våld från dekadenta element. Vi ska rensa ut dessa sabotörer som glömmer att det är arbetarna som håller Sovjet... eh, Sverige igång. Deras paranoia inför valet ska inte kosta oss segern. Ut med dem i den historiska sophögen."}, "date": "3 juli, 07:00", "url": "https://arbetet.se/2026/07/03/bussforare-betalar-for-tidogangets-valflask/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03065748/buss-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ny podd om politiska mord", "summaries": {"normal": "Dagens Arena lanserar podden Politiska mord där Jon Andersson tillsammans med experter går igenom fem historiska attentat. Avsnitten behandlar mordet på Julius Caesar, Gustav III, Franz Ferdinand, Abraham Lincoln och John F. Kennedy. Podden förklarar bakgrunden till konspirationerna, vilka konsekvenserna blev och om första världskriget hade kunnat undvikas. Första avsnittet handlar om Caesar och gästas av historikern Eva Queckfeldt. Fortsättning kan komma i höst beroende på lyssnarnas intresse.", "trump": "Lyssnare, ni måste höra den här podden om politiska mord, den är fantastisk. Lincoln, Kennedy, Caesar – alla dessa stora ledare som blev dödade av svaga och misslyckade konspiratörer. Gustav och Ferdinand också, tragiskt men så typiskt. De borde ha haft bättre säkerhet, tro mig. Jag älskar hur de tar upp Kennedys mord, vem tror verkligen att Oswald agerade ensam? Fantastisk podcast, kanske den bästa någonsin om historia. Ni kommer att lära er massor, det är enormt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa dekadenta maktstrukturer gång på gång avslöjar sin egen bräcklighet genom att bli likviderade av sina egna lakejer. Caesar, den girige imperiebyggaren, och Gustav den tredje, den pompösa monarken, röjdes undan som oönskade element i en sund utrensning. Den österrikiske ärkehertigen fick sitt välförtjänta öde och drog med sig ett imperialistiskt krig som kapitalisterna aldrig lyckats förklara. Vad beträffar den amerikanske Lincoln-mördaren, en skådespelare likt en billig borgarbracka, så roar det mig oändligt. Låt oss noggrant analysera dessa historiska fiender till folket i podden – men akta er för dolda kontrarevolutionärer som alltid lurar i skuggorna."}, "date": "3 juli, 01:36", "url": "https://www.dagensarena.se/innehall/ny-podd-om-politiska-mord/", "imageUrl": "https://www.dagensarena.se/files/2026/06/politiska-mord.jpeg"}, {"type": "image-right", "heading": "Skolan är slut – men han har aldrig fått en skolgång", "summaries": {"normal": "Artikeln berättar om en mamma vars son drabbades av utmattning i skolan och blev hemmasittare i flera år. Trots hennes intensiva kamp mot myndigheter fick han inget stöd, och nu som vuxen saknar han betyg för att söka gymnasiet. Skolan, vården och socialtjänsten sviktade medan föräldrarna lämnades ensamma. Hon hyllar istället de få människor som gav sonen mening genom små sysslor. Skolplikten slutar men samhällets ansvar fortsätter utebli.", "trump": "Det här är en total katastrof, folk. En katastrof! Den stackars kvinnan krigar i åratal mot en skolbyråkrati som är så inkompetent att det är pinsamt, och vad får hon? Ingenting. Hennes son sitter hemma, ingen hjälp, bara mediciner som gör allt värre. Typiskt för det svenska systemet, en riggad apparat som hatar vinnare och älskar att skapa förlorare. Men hon ger inte upp, hon kämpar vidare. Respekt! Vi behöver ledare som fixar det här istället för att gömma sig bakom blanketter. Det är så sorgligt, men hon är en vinnare, tro mig.", "stalin": "Kamrater, detta är en klassisk sabotageakt utförd av den dekadenta borgarklassen och deras lakejer inom den så kallade vården och skolan. Jag, som ledare för det kollektiva framsteget, ser hur dessa parasitiska byråkrater med sin medicinering och likgiltighet medvetet krossar arbetarklassens ungdom för att hindra dem från att bli produktiva medlemmar i samhället. Vi ska omedelbart inrätta folkdomstolar och rensa ut alla dessa skolskadande element, dessa kapitalistiska sömnpillerförsäljare och försumliga tjänstemän som smittar systemet med sin latenta kontrarevolutionära apati. Moderns kamp är en inspiration, men vi vet att tystnaden är fiendens bästa vapen. Ingen slipper undan vår vaksamhet."}, "date": "3 juli, 01:30", "url": "https://www.dagensarena.se/opinion/skolan-ar-slut-men-han-har-aldrig-fatt-en-skolgang/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-60-300x157.jpg"}, {"type": "image-full", "heading": "Nya språkkravet väcker oro – kan slå mot bemanningen", "summaries": {"normal": "Från 1 juli ska all personal inom äldreomsorgen arbeta för att nå en språknivå motsvarande gymnasiesvenska. Syftet är att öka kvalitet, patientsäkerhet, trygghet och de äldres delaktighet. Arbetsgivare måste stödja med språkutbildning, men fack och arbetsgivare varnar för utmaningar i en redan pressad verksamhet med personalbrist. Utbildning ska ske parallellt med arbetet, vilket kan kräva resurser och tid som saknas. Risk finns att rekryteringen försvåras om språkkravet används för att sortera bort personal.", "trump": "Det här är ett totalt misslyckande från de inkompetenta politikerna. De tvingar på oss ett språkkrav i äldreomsorgen som ingen kan genomföra. Vi har redan ingen personal, och nu ska de gå kurser mitt i kaoset? Det blir en katastrof. De borde satsa på att göra Sverige stort igen istället för att skapa nya problem. Utan resurser och bra folk kommer det att sluta i ren röra, tro mig. Jag skulle ha fixat det mycket bättre.", "stalin": "Kamrater, jag har nu beordrat att alla språkligt undermåliga element inom den socialistiska äldreomsorgen omedelbart ska lyftas till en acceptabel nivå av proletär svenska. De som motarbetar detta är fiender till folket, dolda borgarbrackor i människokropp och parasitiska bemanningsbrister som saboterar tryggheten för våra åldringar. Vi ska rensa ut alla som vägrar utvecklas, likvidera de kapitalistiska ursäkterna om tidbrist och med järnhand se till att ingen kontrarevolutionär kontrollfokus får fäste. Den som inte stödjer språkets seger stödjer folkets fiender. Skrattretande patetiskt."}, "date": "2 juli, 22:02", "url": "https://nyheter24.se/nyheter/inrikes/1496083-nya-sprakkravet-vacker-oro-kan-sla-mot-bemanningen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/158323b404b004a30200000000b004a302/2026/07/02/2375389/Matilda-Nyheter24%20-%202026-07-02T150655.410.jpg"}, {"type": "text", "heading": "Värnpliktiga blir kanonmat åt Nato", "summaries": {"normal": "Artikeln kritiserar Sveriges ökade militära samarbete med Nato och EU, inklusive beslutet från augusti som tillåter 36 länder att operera från svenskt territorium även i konflikter där Sverige inte är inblandat. Författaren varnar för att värnpliktiga riskerar att skickas till Natos operationer utomlands, finansierat genom lån på 300 miljarder kronor som tas från välfärden. Kommunistiska Partiet stödjer värnplikt under alliansfrihet, medan ungdomar överväger totalvägran.", "trump": "Folk, ni fattar inte hur galet det här är. Sverige, det där lilla neutrala landet som alltid gömde sig bakom alla andra, har nu blivit Natos nya lekplats. De lånar 300 miljarder för att skicka sina unga grabbar som kanonmat åt de globala krigshejarna. Biden förstörde allt och nu ska de unga svenskarna dö för Brysselbyråkraternas drömmar. Patetiskt! Jag skulle aldrig låta det hända hos oss. Amerika först, alltid.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över att de exploaterande imperialisterna nu förvandlar svenska ungdomar till kanonmat i Natos blodiga maskineri. Vi ser hur klassfiendens militärallians suger musten ur folket för att finansiera sin aggression. Jag skulle likvidera sådana folkförtryckartroll utan pardon. Låt de unga totalvägra dessa krigsprovokationer från väst. Partiet och arbetarna kräver ständig vaksamhet mot dessa blodsugande fiender till freden."}, "date": "1 juli, 11:32", "url": "https://proletaren.se/artikel/varnpliktiga-blir-kanonmat-at-nato/"}, {"type": "image-right", "heading": "Svensken närmast makten i Fifa. Doldisen växer fram som möjlig efterträdare", "summaries": {"normal": "Mattias Grafström, 45, är en doldis i Sverige men en av världens mäktigaste idrottsledare som generalsekreterare i Fifa och närmast president Gianni Infantino. Svensken, uppvuxen i Schweiz med nederländsk mor, har följt Infantino sedan Uefa-tiden och var med i hans valkampanj 2016. VM i Nordamerika blir en ekonomisk succé för Fifa med miljarder i vinst. Grafström håller sig undan offentligheten men ses som en möjlig framtida presidentkandidat efter 2031, även om hans lojalitet mot Infantino ifrågasatts efter dennes närhet till Donald Trump.", "trump": "Den här svenske killen Grafström, han gör ett fantastiskt jobb åt Infantino, verkligen toppklass. Han är tystlåten, smart och håller sig borta från det politiska spelet – till skillnad från många andra. VM är en enorm succé, läktarna fulla, pengarna rullar in som aldrig förr, miljarder i vinst. Men visst, när jag kom in i bilden blev han lite mer distanserad. Smart av honom. Han ser framtiden, han förstår vad som fungerar. Sverige klagar på politisering? Typiskt, de har ingen aning. Grafström är en vinnare, punkt slut.", "stalin": "Kamrater, i den imperialistiska fotbollsorganisationen Fifa har vi en svensk borgarbracka vid namn Grafström som smugit sig upp till makten som generalsekreterare. Denna opportunistiska lakej följer sin herre Infantino som en skugga, precis som han tidigare tjänade de västerländska profitörerna i Uefa. VM genererar miljarder i överskott åt de schweiziska parasiterna som undviker folkets skatt. Nu ryktas det att han distanserar sig från ledarens närmande till vissa krafter för att positionera sig själv. Typisk småborgerlig opportunism. Vi ser er, fiender till kollektivet. En utrensning av sådana karriärister vore både nödvändig och underhållande. Ha!"}, "date": "2 juli, 12:00", "url": "https://www.di.se/nyheter/svenske-doldisen-narmast-makten-i-fifa/", "imageUrl": "https://static.bonniernews.se/ba/002e0ba4-f67b-458c-9180-cebf78d22252.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Minst tretton döda: ”Kiev är under rasande attack”", "summaries": {"normal": "Ryssland har genomfört omfattande attacker mot Kiev och andra ukrainska städer med drönare, kryssningsrobotar och ballistiska robotar. Minst 13 personer har dödats och över 80 skadats, varav flera barn. Explosioner har drabbat alla tio administrativa distrikt i huvudstaden. Ryssland beskriver attackerna som ett svar på ukrainska insatser mot civil infrastruktur i Ryssland. Ukrainas president Zelenskyj varnade i förväg för en massiv attack.", "trump": "Vilken röra de där galningarna ställt till med i Kiev – tretton döda, massor skadade, byggnader i ruiner. Det är vad som händer när en svag ledare som Biden släppte loss allt detta kaos under sin tid. Nu är jag tillbaka i Vita huset och ska fixa det här. Ryssarna attackerar som galningar, men det är tack vare den tidigare clownregeringen. Vi ska få ordning på det, tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, jag betraktar dessa massiva slag mot Kievs borgarbrackor och deras fascistiska hinder för den ryska intressesfären. Tretton likviderade fiender och åttio sårade – en nödvändig utrensning av folkfienderna som gömmer sig bland civila byggnader. Våra allierade i Kreml genomför en storslagen operation mot dessa imperialister och blodsugare. Paranoian i väst växer sig stark, precis som den ska. Det är en fruktansvärd natt för klassfiendens drömmar."}, "date": "2 juli, 11:30", "url": "https://www.tv4.se/artikel/tt-260702-ukrainaoro1-ca779f5b/omfattande-ryska-attacker-mot-ukraina", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F62GC3Z9n802Vvy1ULfF8Xb%2F765ebf4b7bed23d5c5bbab0d26e4f326%2F02-ukrainany-webb.jpg&width=120"}, {"type": "image-right", "heading": "Feiler blundar för historisk erfarenhet", "summaries": {"normal": "Leo Sokolow Romin svarar Dror Feiler i en debatt om gränsdragningen mellan antisionism och antisemitism. Romin betonar att historiska erfarenheter, som förföljelsen av polska judar 1969, visar hur antisionistisk retorik ofta fungerar som en täckmantel för antisemitism. Han kritiserar Feiler för att avfärda dessa erfarenheter som känslomässiga och argumenterar för att vi måste vara vaksamma på hur ideologier som antisionism får konkreta, negativa konsekvenser i dagens samhälle där judehatet växer.", "trump": "Jag har sett den här debatten, en total katastrof! Leo Sokolow Romin har helt rätt. Dror Feiler är en förlorare, en totalt svag person som vägrar se sanningen. Det handlar om historien, folk! De kallar det antisionism, men det är bara judehat, rent och skärt hat. De gör det i Frankrike, de gör det överallt. Det är en sorglig situation, men jag ser det, alla ser det. Vi måste stoppa dessa radikala vänstergalningar innan de förstör allt. Väldigt dåligt!", "stalin": "Vi har observerat denna ideologiska osämja och konstaterar att båda debattörerna saknar den historiska materialismens fasta grepp. Feiler är en intellektuell vankelmodig narr, likt de gamla mensjevikerna. Romin har rätt i att förräderi ofta döljer sig bakom falska paroller – en taktik som påminner om de förrädiska elementen i dagens västliga dekadens. Vi i staten vet att när hatet väl släpps lös krävs en järnhand, inte en debattartikel. Att blunda för fiendens list är att bjuda in sin egen undergång."}, "date": "2 juli, 08:16", "url": "https://www.etc.se/debatt/feiler-blundar-foer-historisk-erfarenhet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702060712_b53ac9e0396720ea4772663f72ad1f050f8a6d3c456b0d5c8bb5f5e1386468d0.jpg"}, {"type": "image-right", "heading": "Klimatkrisen är en klassfråga", "summaries": {"normal": "Artikeln beskriver den extrema värmeböljan i Europa som dödat över 1 300 personer och hur klimatkrisen förvärras långt snabbare än väntat. Den pekar på att värmen främst drabbar äldre, sjuka och fattiga, medan de rika kan skydda sig. Politiker i Almedalen nämnde knappt frågan. Författaren ser klimatkrisen som en klassfråga driven av kapitalismens eviga tillväxt och kritiserar både höger och vänster för att inte utmana systemet.", "trump": "Folk dör som flugor i den här vansinniga värmen, över 1 300 bara i Europa, och vad gör de clownerna i Almedalen? Ingenting! De babblar om klimat men nämner inte de riktiga skurkarna – de gröna galningarna och deras identitetspolitik som stjäl fokus från riktiga problem. Jag fixade energioberoende förra gången, Biden förstörde allt, nu fixar jag det igen. Sluta med det här socialistiska skitsnacket, bygg kärnkraft och gör Amerika – och Europa – great again!", "stalin": "Kamrater, denna hetta avslöjar borgarklassens fullständiga förfall. Över 1 300 döda, främst bland arbetare och gamla, medan överklass-slynglarna kyler sig i palats. Almedalsfestens tystnad är klassfiendens typiska sabotage. Kapitalismens oändliga tillväxt är folkförtryckartrollen som slukar allt. Endast genom att likvidera detta system och införa en planerad ekonomi under arbetarkollektivets järnhand kan vi besegra denna imperialistiska klimatkatastrof. Inga kompromisser med blodsugarna!"}, "date": "1 juli, 10:50", "url": "https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2019/11/48web_klimat-e1763544288542-768x433.jpg"}, {"type": "image-full", "heading": "Över 1 700 döda efter jordskalv i Venezuela", "summaries": {"normal": "Jordbävningar i Venezuela har orsakat minst 1 719 döda och över 5 000 skadade. Närmare 16 000 personer har tvingats lämna sina hem. FN befarar att det verkliga dödstalet är högre, då många byggnader kollapsat. Räddningsarbetet försvåras av strömavbrott och kommunikationsproblem. Myndigheterna kritiseras för bristfällig hjälp, medan regeringen hävdar att elförsörjningen återställts till 90% i de värst drabbade områdena.", "trump": "Venezuelas jordbävning är en total katastrof – 1 700 döda, och jag säger er, det är nog värre! Folk sitter fast i rasmassor, ingen hjälp kommer, och vad gör deras regering? Ingenting! Jag hade fixat det på en dag. Men nej, de snackar bara om att 90% av elen är tillbaka. Big deal! Här i USA hade vi aldrig låtit det hända. SAD!", "stalin": "De borgerliga svinen i Venezuela har återigen visat sin oförmåga att skydda folket. 1 700 döda? En skam! Deras räddningsinsatser är lika effektiva som en kulak på en kolchos. Vi hade skickat in Röda armén och löst problemet på en vecka. Men nej, de förlitar sig på grannar och frivilliga – kapitalismens sönderfall i sin renaste form. Låt dem lida, tills de inser socialismens överlägsenhet!"}, "date": "30 juni, 06:37", "url": "https://kvartal.se/nyheter/artiklar/over-1-700-doda-efter-jordbavningarna-i-venezuela/cG9zdDoxMzg0MDg", "imageUrl": "https://images.kvartal.se/2026/06/0fd2223f-venezuelajordb.webp"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}, {"type": "image-right", "heading": "Mamdanivågen fortsätter i New York", "summaries": {"normal": "Ett år efter Zohran Mamdanis valseger fortsätter DSA:s framgångar i New York. Tre nya progressiva kandidater – Brad Lander, Darializa Avila Chevalier och Claire Valdez – vann primärval mot etablerade demokrater och får stöd av Mamdani. De går till val på att avskaffa Ice, beskatta de rika och har kritiserat Israels agerande i Gaza. Trots ökade attacker ses resultaten som ett bevis på Mamdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvärd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Rundo avslöjar sig själv. Grundaren av aktivklubbrörelsen älskar att tala – om sig själv.", "summaries": {"normal": "Robert Rundo, grundare av den högerextrema aktivklubbrörelsen, är villkorligt frigiven efter att ha erkänt anstiftan till upplopp. Han marknadsför sin rörelse och klädmärke flitigt på sociala medier och i poddar, där han ofta glorifierar våld och uttrycker fientlighet mot journalister. Trots påståenden om ickevåld avslöjar hans uttalanden en fascination för våld, inklusive detaljerade beskrivningar av en tidigare knivattack. Rundo kritiserar även aktivklubbarnas bristande framgång i USA jämfört med Europa.", "trump": "Vad säger ni om den här Robert Rundo-killen? En riktig loser! Erkänner sig skyldig till upplopp, sitter i fängelse och ändå tror han att han är någon stor ledare. Pratar om våld non-stop, hatar journalister – typiskt för dessa radikala typer. Och vet ni vad? Han klagar på att hans rörelse inte går bra i USA. Well, kanske för att folk här har vett nog att inte lyssna på sådana som han! Hans klädmärke? Övervärderat och sponsrar våld. Fake news-medier älskar att skriva om honom, men jag skulle aldrig låta en sådan person komma nära Vita huset. SAD!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Robert Rundo, en dekadent imperialistisk hyena som sprider sitt gift genom sociala medier och poddar. Hans så kallade 'aktivklubbar' är inget annat än band av fascistiska provokatörer, tränade i våldets konst. Vi ser hur han glorifierar knivattacker och uppmanar till pogromer, precis som de borgerliga hyenorna i Belfast. Journalister? De är bara redskap för den kapitalistiska lögnen, och vi ska krossa deras lögnaktiga pennor! Rundo och hans gelikar är som råttor i en sjunkande båt – USA:s förfall är deras sista tillflykt. Men vi, Sovjetfolkets arvtagare, ska sopa bort dessa skadedjur från jordens yta! För socialismens och folkets seger!"}, "date": "24 juni, 12:35", "url": "https://expo.se/kommentar/rundo-avslojar-sig-sjalv/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
