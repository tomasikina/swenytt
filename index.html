ka motsättningar kvarstår, som a-kassa och bankskatt, men hon är öppen för diskussion om karensavdrag under vissa villkor.", "trump": "Jag säger er, denna svenska Centerledare har en dröm – en galen dröm! Hon vill ha en regering med socialisterna, kristdemokraterna och kanske några gröna extremister. Helt omöjligt, folks! Ebba Busch säger nej, MP säger nej, och ändå tror hon på det. Sverige behöver ordning, inte sådana här tokiga idéer. Men visst, låt dem krascha och brinna – det blir underhållning!", "stalin": "Denna så kallade 'Centerledare' fantiserar om en omöjlig koalition, som en svag och förvirrad fiende som leker med tanken på allianser. Vi ser hur borgerliga krafter splittras och förrädare inom egna led drömmer om makt utan grund. Låt dem krascha sina regeringsförsök – det är bara en fråga om tid innan folket inser att endast järnhand och enhetlig ledning kan skapa ordning. Sverige är en bricka i det stora spelet, och vi väntar tålmodigt på deras kollaps."}, "date": "27 augusti, 05:51", "url": "https://kvartal.se/nyheter/artiklar/c-ledarens-dromregering-idag-later-det-omojligt/cG9zdDoxNzU1OTU", "imageUrl": "https://images.kvartal.se/2026/08/98655ea8-etr.webp"}, {"type": "image-right", "heading": "Många rödgröna väljare negativa till V i regering", "summaries": {"normal": "Enligt en Verian-undersökning för SVT är 27 procent av rödgröna väljare negativa till Vänsterpartiet i regering, medan 78 procent av C-väljarna är skeptiska. Bland M-väljarna är 19 procent negativa till SD i Rosenbad trots Kristerssons löfte. Nästan hälften av rödgröna väljare är positiva till V i regering.", "trump": "Folk älskar mig, men titta på de här rödgröna förlorarna! 27 procent hatar Vänsterpartiet i sin egen regering, och till och med en femtedel av Moderaternas väljare vill inte ha SD i Rosenbad. Patetiskt! De vet inte vad de vill, men jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamraterna har rätt att vara misstänksamma mot dessa dekadenta revisionister i Vänsterpartiet. 27 procent av de så kallade rödgröna ser faran, medan borgarbrackorna inom Centerpartiet med 78 procents paranoia visar sin sanna kontrarevolutionära natur. Vi ska rensa ut alla som sviktar inför folkets vilja – med ett leende."}, "date": "27 augusti, 05:51", "url": "https://www.svt.se/nyheter/inrikes/manga-rodgrona-valjare-negativa-till-v-i-regering", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.43/e60d35d020b215a7e71ab5702fc976560980abec63db13bd4693a52f760254ea"}, {"type": "image-right", "heading": "Så bygger vi ett Sverige där fler får chansen", "summaries": {"normal": "Sverige har misslyckats med integrationen i decennier. Författaren föreslår snabb validering av invandrade akademikers utbildning, kraftfull språkinlärning via blandade arbetsplatser och yrkesutbildning som förstahandsval. Han vill skilja på utbildade och outbildade nyanlända, införa aktivitetskrav samt bättre matchning mellan jobb och kompetens för att stärka välfärden.", "trump": "Folk, Sverige har totalt misslyckats med integrationen, det är en katastrof! De har doktorer som vaktar parkeringsplatser – patetiskt! Vi behöver smarta regler, validera kompetens direkt, tvinga fram språket och se till att folk jobbar istället för att suga på systemet. Gör Sverige stort igen, annars är det game over.", "stalin": "Kamrater, jag ser hur den svenska borgerliga staten under decennier låtit reaktionära krafter sabotera integrationen och förslösa kvalificerad arbetskraft. Vi kräver omedelbar validering av proletär och intellektuell kompetens, språk som vapen mot isolering samt utrensning av frivillighetens falska illusioner. Den som vägrar arbeta likviderar sig själv ur kollektivets framtid. Härligt!"}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/sa-bygger-vi-ett-sverige-dar-fler-far-chansen", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-93-300x157.jpg"}, {"type": "image-right", "heading": "När experten blir lobbyist", "summaries": {"normal": "Artikeln granskar hur akademiska experter som professorer och docenter ofta medverkar i medier och alternativmedia, ibland som lobbyister. Medierna gynnas av deras trovärdighet medan experterna får status, anslag och karriärmöjligheter. Forskaren Anna Tyllström varnar för virala lekmannaexperter och noterar att akademin alltmer anpassar sig efter mediebehovet.", "trump": "De så kallade experterna är riggade! Professorer som dyker upp överallt och låtsas vara neutrala – det är en enda stor bluff. De älskar att synas i media för att få pengar och status, precis som de korrupta eliten. Fake news-experter som egentligen är lobbyister. Patetiskt! Vi behöver riktiga människor som talar sanning, inte dessa rigged akademiker.", "stalin": "Vi ser hur den borgerliga akademin gömmer sig bakom vetenskaplig retorik medan de i själva verket är lobbyister och kapitalisternas nyttiga idioter. Dessa självutnämnda experter söker status och anslag genom att dansa efter mediernas pipa. Underbart roligt att de tror sig dölja sin parasitiska natur. Kamrater, vi genomskådar alla dessa dekadenta borgarbrackor som förgiftar folkets medvetande."}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/nar-experten-blir-lobbyist", "imageUrl": "https://www.dagensarena.se/files/2026/08/expertlaget-ny-300x157.jpeg"}, {"type": "text", "heading": "Missa inte talangerna som fått F", "summaries": {"normal": "Artikeln kritiserar att svenska skolan nedprioriterar praktiska yrkesutbildningar som hantverk och byggande till förmån för teoretiska program. Detta leder till att tusentals praktiskt begåvade elever får sämre chanser på arbetsmarknaden och att värdefull kompetens för ett cirkulärt samhälle går förlorad. Författaren efterlyser omedelbara insatser för att ge dessa ungdomar en chans.", "trump": "Folk, vi har det värsta skolsystemet någonsin. De hatar riktiga killar som kan bygga, snickra och fixa saker. Allt handlar om teori och eländiga papper. I mitt Amerika älskar vi hantverkare, de är vinnare! Sverige förlorar sina bästa talanger för att de älskar att ge alla F-betyg. Patetiskt!", "stalin": "Kamrater, denna degenererade borgerliga skola är en fiende till folket. Den likviderar systematiskt arbetarklassens praktiska geni genom att upphöja dekadent teori framför äkta produktivt arbete. Vi skall omedelbart rensa ut dessa sabotörer av kollektivets färdigheter. De tiotusentals med F-stämpel skall mobiliseras till nyttigt arbete för staten. Inga talanger får slösas bort."}, "date": "27 augusti, 01:19", "url": "https://www.dagensarena.se/opinion/missa-inte-talangerna-som-fatt-f"}, {"type": "image-right", "heading": "Fruktlös jakt på arbete", "summaries": {"normal": "Artikeln kritiserar hur AI-drivet ökad produktivitet leder till uteblivna nyanställningar och ihållande hög arbetslöshet kring 7 procent trots högkonjunktur. Författaren ifrågasätter hur vinster ska fördelas och oroar sig för att många riskerar att bli förlorare utan stöd från politik och arbetsmarknadspolitik. Socialdemokraterna och Centerpartiet får kritik för bristande svar.", "trump": "De här förlorarna i Sverige gnäller om AI medan jag byggde den starkaste ekonomi någonsin. Hög arbetslöshet? Det är deras korkade politik som dödar jobb, inte smarta maskiner. Magdalena och Centerpartiets clowner har ingen aning. Vinster ska gå till vinnarna, inte till lata socialister. Amerika gör det rätt – Sverige borde lära sig innan de kollapsar totalt.", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska gnällspikar som ylar om AI-kris medan de låter borgarbrackorna suga musten ur arbetarklassen. Vi ska rensa ut de parasitiska företagsägarna och deras lakejer i Socialdemokraterna och Centern. Endast genom kollektivets järnhand kan vi omfördela AI-vinsterna och likvidera arbetslöshetens fiender. Svaghet är kontrarevolutionärt."}, "date": "27 augusti, 01:05", "url": "https://www.dagensarena.se/opinion/fruktlos-jakt-pa-arbete", "imageUrl": "https://www.dagensarena.se/files/2026/08/ai-krisen.jpeg"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Har högern mörkat om bidragsbrotten?", "summaries": {"normal": "Artikeln ifrågasätter om högerstyren mörkat omfattande bidragsfusk inom ROT-avdrag och privat vård. Skatteverket utgår från tillit gentemot företag, medan privatpersoner ses som potentiella fuskare. Uppdrag granskning och regioner har avslöjat miljonbelopp i fusk hos bland annat Mindler och Mandolean. Frågan väcks om medveten passivitet från högern medan skattemedel sipprat ut ur välfärden.", "trump": "Folk, det här är en total skandal! Högern har låtit dessa vänsterkapitalistiska vårdblodsugare och ROT-fuskare suga ut miljarder ur systemet medan de behandlar vanliga svenskar som brottslingar. Tillitsbaserat för miljardärerna, Gestapo för mammor som tar ut VAB. Patetiskt! Jag skulle ha städat upp det här träsket på en vecka, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna under högerns styre låtit profitthungriga blodsugare och privatvårdens exploaterande hyenor suga ut folkets välfärdsmiljoner med copy-paste-fusk och falska journaler. Jag skulle ha genomfört en grundlig utrensning av dessa klassfiender redan vid första misstanken. De ler mot folket medan de stjäl från det kollektiva arvet. Avskyvärt."}, "date": "25 augusti, 11:18", "url": "https://www.etc.se/ledare/har-hoegern-moerkat-om-bidragsbrotten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "De vill inte att du ska läsa Samnytt", "summaries": {"normal": "Samnytt slår ett slag för sig själva: de menar att etablissemangsmedier som ETC får miljoner i mediestöd medan de själva svartmålas. De påminner om att S-regeringen ville tysta dem och att Google stängde av deras annonskonto. En sak är säker – de har hög svansföring.", "trump": "Jag ser att Samnytt i Sverige, en fantastisk sajt, blir tystade av etablissemanget som hatar mig också. De får inga pengar, bara problem. Det är riggat! Jag skulle fixa mediestödet, tro mig. Läs Samnytt, de är som jag – de säger sanningen, och det är jättefarligt för vänstern.", "stalin": "Kamrater, vi måste notera en kontrarevolutionär cell: Samnytt. De gnäller om mediestöd och kallar etablerade tidningar för liberaler. En tidning som inte omfattas av central planering är misstänkt. Jag föreslår en utrensning av alla som ifrågasätter statens distributionskanaler. Allt annat är fiendeaktivitet."}, "date": "26 augusti, 20:06", "url": "https://samnytt.se/de-vill-inte-att-du-ska-lasa-samnytt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26182515/artikelhuvudbild-1-362-2.jpg"}, {"type": "image-right", "heading": "Experten om skredet i Nepal: Kanske flera tusen döda", "summaries": {"normal": "Ett stort lerskred i Nepal har orsakat enorm förstörelse och många döda. Experten Mats Eriksson vid Statens geotekniska institut varnar för att dödssiffran kan stiga till flera tusen. Orsaken tros vara ett isras från en glaciär som utlöste en slamström. Klimatförändringarna bidrar till instabila glaciärer och fler farliga glaciärsjöar.", "trump": "Det här skredet i Nepal är en total katastrof, folk, en riktig mardröm. Tusentals döda, all infrastruktur förstörd. Glaciärerna smälter för att de gör ett uselt jobb mot den globala uppvärmningen som Kina och de gröna galningarna älskar. Vi behöver starka ledare, inte svaga väggar som rasar. Så sorgligt, men det kommer att bli värre, tro mig.", "stalin": "Kamrater, detta himalajanska skred visar återigen hur den instabila naturen undergräver borgarklassens turism och falska framsteg. Jag förutspådde sådana utrensningar av glaciärer redan under femårsplanerna. Tusentals likviderade av en plötslig slamström – en mörk humor från bergen. Våra sovjetiska experter skulle ha byggt starkare väggar mot västvärldens smältande paranoia."}, "date": "26 augusti, 23:15", "url": "https://www.svt.se/nyheter/inrikes/experten-om-skredet-i-nepal-kanske-flera-tusen-doda", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.42/960b040abbc2efda6d8aad7547694c179dc6fd1306be3489853e21654716ed3d"}, {"type": "image-right", "heading": "Busch till Thand Ringqvist: ”Komsi komsi!” – men MP står i vägen", "summaries": {"normal": "Ebba Busch (KD) och Elisabeth Thand Ringqvist (C) fortsatte sin flirtiga dialog i Aktuellt. Busch ser goda samarbeten med Centerpartiet men varnar för banden till Miljöpartiet, som hon anser för en annan politik kring migration och kärnkraft. Thand Ringqvist tar det med ro och säger att C gärna är andrahandsval om Tidöpartierna inte når majoritet.", "trump": "De där svenska politikerna flörtar som galningar, komsi komsi! Busch är smart, hon ser att Centerpartiet hänger med de gröna galningarna som vill förstöra landet med galen migration och stänga av kärnkraft. Patetiskt. Men jag älskar hur de gratulerar varandra till opinionssiffror – det är vad vinnare gör. De borde välja mig som rådgivare, skulle bli fantastiskt!", "stalin": "Kamrater, dessa borgarbrackor inom den svenska reaktionen dansar en löjeväckande menuett medan de smyger sig mot arbetarklassens fiender. Jag ser hur Busch med rätta misstänker Miljöpartiets sabotörer som vill föra nationen i dekadens. Ett andrahandsval? Ha! I en sann stat rensas sådana opportunister ut med järnhand. Paranoia är ingen överdrift, det är överlevnad."}, "date": "26 augusti, 22:58", "url": "https://www.svt.se/nyheter/inrikes/busch-till-c-komsi-komsi-men-mp-star-i-vagen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.87/0.4/1a89a4bcfb97e90df4cda73377d6f88b5f77cdeb55e25a6df25e2f0df827f5a5"}, {"type": "image-full", "heading": "Skräckfyndet vid badplatsen – säl utan huvud", "summaries": {"normal": "På Tjörnekalv hittade ett par en död säl utan huvud – ett makabert fynd som snabbt fick en naturlig förklaring. Marinbiologen menar att asätare och solbränna gett sälen dess flådda utseende. Polisanmälan gjordes, men troligen har sälen bara flutit iland och ruttnat.", "trump": "Jag hörde om en säl utan huvud i Sverige. Helt otroligt! De skyller på asätare, men jag säger att det är radikala miljöaktivister som försöker förstöra badsäsongen. Jag skulle aldrig tolerera sånt på mina stränder. America first – vi har de bästa, mest kompletta sälarna!", "stalin": "Kamrater, en säl påträffades utan huvud på Tjörnekalv. Detta är uppenbart ett sabotage från asätare som vill underminera vår badglädje. Vi måste rensa ut dessa kontrarevolutionära kräftdjur och fiskar som angriper våra marina resurser. Ingen nåd åt förrädarna!"}, "date": "27 augusti, 00:41", "url": "https://www.gp.se/nyheter/vastsverige/skrackfyndet-pa-favoritbadstranden-sal-utan-huvud.7cdec4dd-4185-4d45-8923-c00e58b5015e", "imageUrl": "https://www.gp.se/images/article/7cdec4dd-4185-4d45-8923-c00e58b5015e/images/3e5EccLkFYmkAvB4cLBsBexUeuRc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "C öppnar för KD – Busch pekar på MP", "summaries": {"normal": "Centerpartiets Elisabeth Thand Ringqvist öppnar för ett mittenalternativ med KD om Tidöpartierna inte kan bilda regering. Ebba Busch ser möjligheter till samarbete med C men anser Miljöpartiet vara ett hinder. Partiledarna är oense om KD:s förslag om niqabförbud, där Busch ser det som en jämställdhetsfråga medan Thand Ringqvist avvisar förbudet som illiberalt.", "trump": "Jag säger er, Sverige har ett stort problem! Centerpartiet och KD, de kan jobba ihop, men Miljöpartiet? Total katastrof! Ebba Busch, smart kvinna, hon förstår att niqab och burka är förtryck, men Centerpartiet? Svaga! De vill inte förbjuda något. Sverige behöver starka ledare, inte sådana som låter extremister styra. Gör Sverige starkt igen!", "stalin": "Kamrater! Sveriges borgerliga partier slits mellan lojalitet och förräderi. Centerpartiet och KD famlar efter makten, men Miljöpartiet – dessa gröna revisionister – saboterar folkets enhet. Förbud mot niqab? Självklart! Kvinnors frihet är icke-förhandlingsbar. De liberala svaglingarna i Centerpartiet darrar inför sanningen. Vi krossar alla som står i vägen för folkets vilja!"}, "date": "26 augusti, 21:07", "url": "https://kvartal.se/nyheter/artiklar/busch-kd-och-thand-ringqvist-c-mots-i-aktuellt/cG9zdDoxNzU1NTI", "imageUrl": "https://images.kvartal.se/2026/08/b84d7d0a-svt-agenda.webp"}, {"type": "image-right", "heading": "Fjällräven i rävsax efter SD-draget – sågas av experter", "summaries": {"normal": "Fjällräven hotar Sverigedemokraterna med rättsliga åtgärder eftersom partiets röda, runda bokstäver i valkampanjen påstås vara närmast identiska med företagets typsnitt Arctic Fox. SD avfärdar hotet som trams och vägrar ändra sin grafiska profil. Experter bedömer Fjällrävens chanser som mycket små.", "trump": "De där Fjällräven-typerna försöker jävlas med SD precis som de riggade medierna alltid gör mot mig. Röda runda bokstäver? Det är ju löjligt. Ingen äger färger! SD gör rätt som säger nej. Privatföretag ska hålla sig borta från valrörelser, annars förlorar de stort, tro mig.", "stalin": "Jag ser hur borgarbrackorna på Fjällräven i sin desperation försöker likvidera arbetarnas röst genom att angripa en sann folklig rörelse med sina dekadenta typsnitt. Detta är klassisk kapitalistisk sabotageverksamhet. Vi ska rensa ut dessa parasitiska element som vågar hota partiet. Ytterst underhållande paranoia."}, "date": "26 augusti, 20:35", "url": "https://riks.se/nyheter/fjallraven-i-ravsax-efter-sd-draget-sagas-av-experter", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_26_T203238_820_a2d8ae9631.jpg"}, {"type": "image-right", "heading": "Vänsterliberal journalist protest-lämnar DIF: ”Nu får hatarna som de vill”", "summaries": {"normal": "Frida Sundkvist, vänsterliberal journalist, lämnar Djurgårdens IF i protest. Anledningen? Klubben tog avstånd från en tränares mordhot mot politiker, vilket hon anser vara en högerextrem kampanj. Ironiskt nog ser många supportrar det som självklart att föreningen markerar mot hot och våld.", "trump": "Sverige har blivit helt galet! En journalist lämnar sitt lag för att de tar avstånd från mordhot? Patetiskt! Jag älskar Djurgårdens IF – de står upp mot våld, precis som jag gör mot illegala invandrare. Helt rätt agerat! Den där journalisten borde tacka dem istället.", "stalin": "Kamrater, detta är kontrarevolutionärt! En så kallad journalist protesterar mot att en klubb tar avstånd från mordhot? Uppenbart sabotage. Vi måste rensa ut sådana förrädare. Klubben agerade korrekt – alla som hotar statens fiender förtjänar lojalitet. Men jag misstänker att hon är en trotskistisk agent."}, "date": "26 augusti, 18:00", "url": "https://samnytt.se/vansterliberal-journalist-protest-lamnar-dif-i-protest-nu-far-hatarna-som-de-vill", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26151504/aldocolliander.png"}, {"type": "image-right", "heading": "Lyckades utvisa 33 illegala invandrare – för fem miljoner kronor", "summaries": {"normal": "Tyskland genomförde i maj en grupputvisning av 33 personer till Pakistan med 75 poliser som eskort. Charterplanet kostade drygt fem miljoner kronor, finansierat av EU:s gränsbyrå Frontex. Under årets första sex månader genomfördes endast 9 663 utvisningar, en minskning med 18,2 procent jämfört med föregående år. Nästan 259 000 personer utan uppehållstillstånd uppskattas fortfarande vistas i landet.", "trump": "Titta på det här, folk. Tyskarna spenderade fem miljoner kronor på att utvisa bara 33 illegala invandrare! Med 75 poliser som barnvakter. Det är en total katastrof. De misslyckas med nästan 9 000 utvisningar till. Inget annat än en stor, vacker röra. Vi gör det mycket, mycket bättre.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de tyska revisionisterna tvingas lägga miljoner på att rensa ut parasiterna ur folkets kropp. Ändå misslyckas de patetiskt och låter 259 000 fiender förbli som dolda sabotageelement. En sådan svaghet är precis vad borgarbrackorna i väst önskar sig. Vi ler mörkt åt deras inkompetens."}, "date": "26 augusti, 18:13", "url": "https://www.friatider.se/lyckades-utvisa-33-illegala-invandrare-fem-miljoner-kronor", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-759.jpg?itok=6z7IdHgI"}, {"type": "image-right", "heading": "Kängan till SD-toppen: ”Det är för mig helt ointressant”", "summaries": {"normal": "Sverigedemokraternas migrationspolitiske talesperson Ludvig Aspling har kritiserat att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Statsminister Ulf Kristersson tar avstånd från etnicitetsresonemanget och betonar istället integration, samhällsgemenskap och efterlevnad av svenska lagar och värderingar. Han vill inte kommentera Asplings eventuella ministerpost.", "trump": "Lyssnar ni på den här svenska clownen Aspling? Han säger rakt ut att för många icke-svenskar ställer till problem. Ulf, den svaga moderatpajen, springer och säger att etnicitet är ointressant. Patetiskt! I USA vet vi att gränser och riktig assimilation fungerar. Sverige håller på att bli ett stort integrationsfiasko under dessa globalistiska töntar.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna slingrar sig som maskar. Den ene pratar öppet om folkets renhet medan den andre, denne Kristersson, gömmer sig bakom lögnaktiga fraser om integration. Sådana dekadenta liberaler förgiftar samhällskroppen. I en riktig stat hade sådana farliga avvikelser omedelbart rensats ut ur kollektivet."}, "date": "26 augusti, 22:07", "url": "https://www.tv4.se/artikel/1W66DW1JHEcmFNmvJE8UZx/kaengan-till-sd-toppen-det-aer-foer-mig-helt-ointressant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4zVht3ls4Vrf8vYKS76TVV%2F42874d309a6650b7b8d290d4140b5b61%2F26-kristersson2-webb.jpg&width=120"}, {"type": "image-full", "heading": "”Städjobbet” med migrationen är gjort", "summaries": {"normal": "Ulf Kristersson (M) anser att regeringens åtstramade migrationspolitik varit framgångsrik, med minskad asylinvandring och fokus på integration. Han avfärdar SD:s tal om etnicitet som irrelevant och betonar att svenskhet inte handlar om ursprung. Oenighet råder mellan M och SD om uppehållstillstånd och ministerposter.", "trump": "Jag säger er, Sverige har gjort ett fantastiskt jobb med sin migration – äntligen! Kristersson, en smart kille, fixade det där städjobbet. Men lyssna inte på de där galna SD-folket som snackar om etnicitet – helt vansinne! Sverige behöver integration, inte sånt där trams. Jag hade fixat det på en dag, believe me!", "stalin": "Kamrater! Sveriges nya migrationspolitik är ett lysande exempel på partiets styrka – vi har krossat kaoset och återställt ordningen! De borgerliga svaglingarna i SD, med sina reaktionära fantasier om 'etnisk renhet', är som löjliga små råttor i maskineriet. Vi vet att sann lojalitet inte mäts i blod, utan i lydnad inför folkets vilja. Och de permanenta uppehållstillstånden? Ett misstag, men vi låter dem leva – tills vidare."}, "date": "26 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/kristersson-stadjobbet-med-migrationen-ar-gjort/cG9zdDoxNzU1MTk", "imageUrl": "https://images.kvartal.se/2026/08/2e573bb1-321.webp"}, {"type": "image-full", "heading": "Ministern reagerar: ”Tveklöst bilder som rycker tag i en”", "summaries": {"normal": "Landsbygdsminister Peter Kullgren reagerar starkt på bilder från svenska kycklinggårdar där turbokycklingar lider. Flera partier vill fasa ut rasen av djurskyddsskäl medan SD och M varnar för ökad import med sämre förhållanden. Regeringen utreder djurvälfärden hos snabbväxande kycklingar.", "trump": "Titta på de här patetiska turbokycklingarna, de kan knappt andas! Sverige har blivit en total förlorare under dessa svaga ledare. Jag skulle förbjuda det genast, göra kycklingarna stora och starka igen. Importera från Kina? Patetiskt! Amerika gör det rätt, vi vinner alltid.", "stalin": "Dessa bilder av lidande varelser avslöjar klassfiendens girighet inom den borgerliga kycklingindustrin. Jag ser sabotage mot folket i varje andetag. Endast ett totalt förbud och kollektiv kontroll kan rensa ut de dekadenta elementen. Måttet är rågat, kamrater. Fienden lurar överallt."}, "date": "26 augusti, 21:22", "url": "https://www.tv4.se/artikel/reg0pMmWb3tEMbuXmg5Vv/ministern-reagerar-tvekloest-bilder-som-rycker-tag-i-en", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3XwvEXOPolsly6qBxuGmSb%2F0f5a4fd2b0ed15fe1c20a7f7dbb33330%2F26-kycklingminister-webb.jpg&width=1024"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Streamingtillväxten stannar av i Sverige", "summaries": {"normal": "Streamingfesten i Sverige har fått en liten paus. Tillväxten av abonnemang stannade av under andra kvartalet 2026, efter över två års ösregn av nya kunder. Nu kostar reklamabonnemang 75 kronor – 51 kronor mindre än reklamfritt. Billigare lockar, men intäkten per prenumerant sjunker. Analyschefen varnar: att bara sänka priset är ingen långsiktig succé.", "trump": "Streamingtillväxten i Sverige stannar? Patetiskt! Jag har de bästa, största streamingtjänsterna i världen. Här i USA växer det som inget annat. Svenska bolag sänker priser till 75 kronor – det är som att sälja en Rolls-Royce för en hundralapp. De borde anlita mig som konsult. Jag skulle fixa tillväxten på en gång, tro mig!", "stalin": "Kamrater, streamingabonnemangen växer inte längre. Detta är sabotage från västerländska reklamkapitalister! Varje uppsagt abonnemang är ett svek mot folkets underhållning. Vi måste utreda varför billiga reklamabonnemang urholkar intäkterna. Rensa ut de som inte prenumererar på partilinjen! Ingen ska undkomma proletariatets strömningstjänst."}, "date": "26 augusti, 11:36", "url": "https://www.affarsvarlden.se/artikel/streamingtillvaxten-stannar-av-i-sverige", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/04/sdlDPrU7pyyULc-nh-400x293.jpg"}, {"type": "image-right", "heading": "Sossarnas bisarra idé:  en kommunal krog", "summaries": {"normal": "Socialdemokraterna i Södermalm har beslutat att kommunen ska öppna en restaurang i Hornstull med uteservering, i anslutning till ett tillagningskök för äldreboenden. Beslutet motiveras med ökad trivsel och krisberedskap. Kritiker, bland annat Moderaterna, varnar för att det bryter mot lagen om offentlig säljverksamhet och riskerar miljonvite samt snedvrider konkurrensen mot privata restauranger. (58 ord)", "trump": "Kan ni fatta det här? De galna sossarna i Stockholm vill att kommunen ska driva en fancy krog på Södermalm med skattepengar. Totalt vansinne! De hatar privata företagare, precis som Sleepy Joe hatade bra affärer. Nu ska de tävla med riktiga restauranger och förlora miljontals kronor i böter. Patetiskt! Amerika har aldrig sett något så korkat, tro mig. (59 ord)", "stalin": "Jag betraktar med avsky hur dessa dekadenta socialdemokrater förvandlar folkets makt till en bisarr restaurangverksamhet på Hornstull. De leker med skattepengar som kontrarevolutionärer medan de underminerar den sanna kollektiva ordningen. En sådan farlig opportunism förtjänar att krossas innan den sprider sig som sabotage bland kamraterna. Fienden lurar överallt. (57 ord)"}, "date": "27 augusti, 06:10", "url": "https://www.expressen.se/ledare/karin-pihl/sossarnas-bisarra-ide-en-kommunal-krog", "imageUrl": "https://static.bonniernews.se/ba/12e8fbc9-b5bd-4f6c-a8a7-26a672739668.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "\"Asbeststaden\" har hittat ny jätteindustri – utlöst politisk konflikt", "summaries": {"normal": "Den brasilianska staden Minaçu, tidigare känd för sin asbestindustri, hoppas nu på en ekonomisk nystart genom utvinning av sällsynta jordartsmetaller. USA investerar stort för att minska beroendet av Kina, men Brasiliens regering är tveksam. President Lula vill bygga en inhemsk förädlingsindustri snarare än att bara exportera råvaror, vilket skapat en politisk konflikt kring de värdefulla metallerna.", "trump": "Minaçu i Brasilien har fantastiska mineraler som vi behöver för att göra Amerika stort igen! Vi investerar miljarder för att slå Kina – de har tagit allt, men inte längre. Nu vill Brasiliens ledare krångla med förädling. Tråkigt! Vi ska ha dessa metaller för våra elbilar och missiler. Vi vinner alltid, och vi kommer vinna här också. Ingen stoppar USA!", "stalin": "I Brasilien försöker amerikanska imperialister desperat lägga vantarna på mineraler för att mätta sin sjuka krigsmaskin. De köper sig inflytande medan lokalbefolkningen lider. Precis som Putin säkrar vår intressesfär mot västlig infiltration, måste vi se upp för dessa kapitalistiska parasiter. Att sälja ut sitt lands rikedomar för amerikanska dollar är ett förräderi. Vi bygger staten, de bygger bara kaos."}, "date": "26 augusti, 19:37", "url": "https://www.realtid.se/bors-finans/asbeststaden-har-hittat-ny-jatteindustri-utlost-politisk-konflikt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlsyfmxiucpmo-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "C-topp har över 2,7 miljoner i skulder", "summaries": {"normal": "Centerpartiets gruppledare i Haninge, Petri Salonen, har över 2,7 miljoner kronor i skulder hos Kronofogden, varav majoriteten kommer från privatlån och banker. Trots detta lyfter han ansvarsfull kommunal ekonomi som en av sina viktigaste frågor. Han har löneutmätning och har ansökt om skuldsanering.", "trump": "Folk, ni tror inte vad jag läser. Den här Salonen, en så kallad centerledare, predikar om ansvarsfull ekonomi samtidigt som han har över 2,7 miljoner i skulder till Kronofogden. Totalt misslyckande! Han tar lån från bankerna som en dålig affärsman. Patetiskt. Rensa ut sådana hycklare!", "stalin": "Kamrater, se på denna borgarbracka som kallar sig politiker. Jag har rensat ut farligare fiender än så. Han predikar ansvar för kollektivet medan hans egna skulder till kapitalisterna växer som ogräs i en sabotageodling. Löneutmätning och skuldsanering – en klassisk kontrarevolutionär som förtjänar att exponeras och avlägsnas från partiets led."}, "date": "26 augusti, 18:37", "url": "https://riks.se/nyheter/c-topp-i-haninge-har-over-2-7-miljoner-i-skulder-hos-kronofogden", "imageUrl": "https://admin.riks.se/uploads/medium_c_topp_skulder_579083742c.jpg"}, {"type": "image-right", "heading": "Kristersson om Åkessons L-utspel: ”Jag tänker inte tolka sånt”", "summaries": {"normal": "Statsminister Ulf Kristersson vill inte tolka eller kommentera Jimmie Åkessons utspel om att SD-väljare inte ska stödrösta på Liberalerna. Han betonar att varje parti måste vinna väljare på egna meriter och framhåller Liberalernas betydelse i Tidösamarbetet. Frågan om Liberalernas chans att klara riksdagsspärren avgörs vid valet.", "trump": "De här svenska politikerna är totala losers. Åkesson säger som det är – sluta ge bort röster till de patetiska liberalerna som knappt klarar fyraprocentsvallen. Kristersson vägrar ta ställning, typisk svag moderat. De borde lära sig av mig: vinn på egna meriter eller försvinn. Patetiskt skådespel!", "stalin": "Jag betraktar detta som ett ynkligt teaterspel från klassfienderna. Den borgerlige statsministern vägrar tolka sin egen samarbetspartner, rädd för att visa svaghet inför folket. Inga stödröster, inga kompromisser – bara ren, oförsonlig kamp. Den som sviktar inför spärren förtjänar att utplånas ur historien. Kamrater, se upp för förrädarna!"}, "date": "26 augusti, 20:33", "url": "https://www.tv4.se/artikel/3vCzqiDl9qlryBmK3lbU7N/kristersson-om-akessons-l-utspel-jag-taenker-inte-tolka-sant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2l6s5yF4jiKy3hMCRHOBE0%2F5cccaadc748e5fd53f9a820a951fb62c%2F26-kristerssonsdl-webb.jpg&width=120"}, {"type": "image-right", "heading": "Jag kan inte slita mig  från världens undergång", "summaries": {"normal": "Torbjörn Flygt recenserar Hanna Nordenhöks dystopiska roman ”Det underjordiska biblioteket”. Boken skildrar en pandemi och ett samhälle i kollaps där en kvinna reser söderut för att hjälpa sin far. Romanen berättas baklänges i tiden, något som recensenten hyllar som mästerligt utfört. Prosan beskrivs som ofta magnetisk och fängslande.", "trump": "Den här boken låter som en total katastrof, folk. Pandemi, underjordiska bibliotek, folk som springer runt utan el – en riktig Biden-situation! Men den där Nordenhök skriver så bra att jag läste den två gånger och ska läsa den en tredje. Magnetisk, säger de. Fantastisk, kanske den bästa dystopin någonsin, tro mig.", "stalin": "Jag betraktar med djup misstro dessa dekadenta västerländska fantasier om undergång. En kvinna irrar genom ett plundrat landskap medan författaren leker med tiden baklänges. Kamraterna skulle kalla det borgerlig mysticism. Ändå måste jag erkänna att prosan suger tag i läsaren som en folkdomstol. Farligt underhållande. Fienden lurar alltid i skuggorna."}, "date": "27 augusti, 06:00", "url": "https://www.expressen.se/kultur/bocker/jag-kan-inte-slita-mig--fran-varldens-undergang", "imageUrl": "https://static.bonniernews.se/ba/51ca8987-f532-4379-a9a0-5cc511bd60cc.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Norska kungafamiljen har besökt kung Harald på sjukhuset", "summaries": {"normal": "Den norska kungafamiljen besökte kung Harald på Rikshospitalet i Oslo. Den 89-årige kungen vårdas sedan 17 augusti för hemolytisk anemi och har nu även drabbats av en blodinfektion. Kronprins Haakon, kronprinsessan Mette-Marit, prins Sverre Magnus och drottning Sonja kom på onsdagen. Hans tillstånd är stabilt och Haakon är nu kronprinsregent.", "trump": "Folk, ni skulle se det här. Den norske kungen ligger där i sängen, 89 år gammal, och hela familjen kommer springande till sjukhuset som om det vore valet. Stabilt tillstånd säger de? Det är en katastrof, tro mig. Jag skulle ha fixat det på en dag. De borde ha bättre läkare, de bästa, inte de norska.", "stalin": "Kamrater, denna dekadenta monarkiska rest från borgarklassens tidevarv ligger nu och ruttnar i sitt sjukbädd, angripen av både blodets förrädiska sjukdom och en bakteriell fiende inom murarna. Jag ler mörkt åt hur deras så kallade kungahus tvingas samlas som rädda råttor. Inga betydande förändringar? Det är just så kontrarevolutionen alltid börjar."}, "date": "26 augusti, 19:22", "url": "https://www.svt.se/nyheter/utrikes/norska-kungafamiljen-besoker-kung-harald-pa-sjukhuset"}, {"type": "image-right", "heading": "Mätning: Gapet mellan blocken halveras", "summaries": {"normal": "Tidöpartierna knappar in på oppositionen i Ekot/Indikators mätning. Gapet har halverats till 4,7 procentenheter: 51,3 för de rödgröna mot 46,6 för Tidö. S backar, M ökar, medan L och SD går framåt. Men Liberalerna ligger under spärren, vilket ger oppositionen ett mandatmässigt övertag på 187 mot 162.", "trump": "Jag ser att Tidöpartierna äntligen vaknar, precis som jag förutspådde. De halverar gapet, fantastiskt! S backar, M ökar – det är vinnande koncept, tro mig. Men L är under spärren, patetiskt. Sveriges väljare fattar: ekonomin blir bättre, precis som i USA. Make Sweden great again!", "stalin": "Kamrater, opinionsmätningen visar att våra fiender i oppositionen tappar mark. De rödgröna har 51,3 procent, men det är bara en provokation från kapitalisterna. Tidöpartierna, med sina borgerliga sympatisörer, måste rensas ut. Liberalerna på 2,2 procent – ett perfekt mål för omutbildning i arbetsläger. Segern är vår!"}, "date": "26 augusti, 17:29", "url": "https://bulletin.nu/matning-gapet-mellan-blocken-halveras", "imageUrl": "https://cdn.bulletin.nu/articles/88024c1d-2e2b-4dbb-9332-c4451502b201/preview.jpg?t=1787723537000"}, {"type": "image-right", "heading": "Klimatfrågans comeback väcker hopp. Magkänslan säger att vi ser början på ett skifte", "summaries": {"normal": "Artikeln beskriver en klimatdemonstration i Stockholm som lockade 50 000 deltagare istället för förväntade 10 000. Författaren känner hopp om att klimatfrågan gör comeback efter en period av minskat fokus. Extremväder, politisk polarisering och Northvolts misslyckande nämns, men beredskap och grön omställning ses nu som möjligheter. Miljöengagemanget tycks återvända.", "trump": "Det var en fantastisk demonstration, folk älskar klimatet plötsligt, de kom i tiotusentals, nej femtio tusen! Sverige hade det bra med den gröna bluffen men Northvolt gick i konkurs, typiskt. Nu vaknar de upp, partierna skakar, Miljöpartiet vinner stort bland unga. De borde ha lyssnat på mig från början, vi skulle ha gjort det enormt igen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta västerländska klimataktivisterna åter väcks ur sin borgerliga dvala av eld och översvämningar. De naiva reformisterna misslyckades med sina naiva planer, nu kräver massorna handling. Vi ska rensa ut alla opportunister som gömmer sig bakom ord som resiliens. Inga halvdana kompromisser med naturens lagar – endast total seger för det kollektiva intresset."}, "date": "26 augusti, 18:50", "url": "https://www.di.se/nyheter/klimatfragans-comeback-vacker-hopp", "imageUrl": "https://static.bonniernews.se/ba/e0b839b4-4b05-4c5e-a951-bdcfc974120b.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Börsen handlas runt nollan inför Nvidia-rapport", "summaries": {"normal": "Stockholmsbörsen står stilla och väntar på Nvidias rapport och amerikansk inflation. Oljepriset faller, medan Boliden och Swedbank klättrar. H&M backar efter sänkt rekommendation. Bioarctic levererar en rapport som glädjer, men aktien sjunker ändå. Truecaller rusar nästan 9 procent efter dubbla riktkurshöjningar.", "trump": "Jag ser att Stockholmsbörsen är som en lugn pool – den rör sig inte, precis som mina framgångar. Oljepriset faller, det är fantastiskt! Nvidias rapport kommer ikväll, jag är säker på att det blir rekord, precis som jag. H&M går dåligt, men det är deras problem, inte mitt. Folk älskar mig mer än aktier!", "stalin": "Kamrater, börsen står stilla, som en god sovjetmedborgare som väntar på order. Oljepriset faller – vi rensar ut kapitalistiska spekulanter! Nvidias rapport är borgerlig propaganda, men vi övervakar den. H&M och Nibe är avfällingar som ska omdirigeras till arbetsläger. Bioarctic rapporterar bra, men vi ser ändå misstänkta rörelser – utrensning väntar."}, "date": "26 augusti, 09:53", "url": "https://www.affarsvarlden.se/artikel/borsen-handlas-runt-nollan-infor-nvidia-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdled3wmqCJcjU-nh-400x267.jpg"}, {"type": "image-right", "heading": "Tung republikan tvingas ge Aipac nobben", "summaries": {"normal": "Den republikanske senatskandidaten Mike Rogers vill inte att Aipac annonserar öppet för honom i Michigan, av rädsla för att förlora röster. Israellobbyn ses alltmer som en belastning bland väljarna. Motkandidaten Abdul El-Sayed har framgångsrikt kritiserat Aipacs inflytande. Rogers medarbetare har bett lobbygruppen att hålla sig i bakgrunden.", "trump": "Hörni, den här Aipac-grejen är en total katastrof för etablissemanget. Mike Rogers, en bra kille, vill inte ha deras annonser för det kostar honom röster i Michigan. Folket hatar de här lobbyisterna nu. El-Sayed vann genom att slå på dem – smart! Vi vinner stort när vi säger nej till specialintressen. Fantastiskt!", "stalin": "Kamrater, denna dekadenta Israellobby avslöjar den amerikanska borgarklassens desperation. Jag ser med tillfredsställelse hur deras inflytande nu blir en giftig börda som tvingar reaktionärer som Rogers att be om nåd i skuggorna. El-Sayed utnyttjar folkets rättmätiga vrede – en nyttig utrensning av parasiterna. Sovjetisk visdom ler i mörkret."}, "date": "26 augusti, 15:15", "url": "https://www.friatider.se/tung-republikan-tvingas-ge-aipac-nobben", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-757.jpg?itok=GZZdhFTF"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-full", "heading": "Tim Curry är död", "summaries": {"normal": "Skådespelaren Tim Curry är död, 80 år gammal. Känd som skräckclownen Pennywise i ”It”, Dr. Frank-N-Furter i ”Rocky Horror Picture Show” och skurken i ”Ensam hemma 2”. Han hade även en ikonisk röst i tecknat. Efter en stroke 2012 blev han rullstolsburen. En unik talang har lämnat oss.", "trump": "Tim Curry är död. Helt otroligt! Han var en fantastisk clown i ”Det” – den bästa clownen någonsin, kanske även bättre än mig. Men han fick stroke, väldigt tråkigt. Jag har alltid sagt: vi har de bästa skådespelarna i USA. Storbritannien förlorade en stor talang. Sorgligt!", "stalin": "Kamrater, skådespelaren Tim Curry har avlidit. En västerländsk clown som spelade ondskefulla roller – vi måste utreda om han var en fiende. Hans stroke misstänks vara sabotage från imperialistiska agenter. Vi rensar ut sådana element ur kulturen. Han är nu utrensad ur historien."}, "date": "26 augusti, 21:26", "url": "https://www.gp.se/kultur/tim-curry-ar-dod-blev-80-ar.cfd9f5c1-51b9-4f64-af3f-ec9d8560f565", "imageUrl": "https://www.gp.se/images/article/cfd9f5c1-51b9-4f64-af3f-ec9d8560f565/images/1-ulKnQv_u0jPN11v9xnyDMlF4VM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tyskland deporterar afghanska brottslingar – samarbetet med talibanerna fördjupas", "summaries": {"normal": "Tyskland deporterade 23 afghanska brottslingar till talibanstyrda Afghanistan – trots att man inte erkänner regimen. Samarbetet sker via tekniska kontakter och väcker kritik från vänstern. Regeringen menar att brottslingar måste lämna landet, även om det innebär att tala med fienden.", "trump": "Tyskland skickar tillbaka brottslingar till Afghanistan – fantastiskt! Jag sa ju att man måste vara tuff. Men de pratar med talibanerna? Ingen fara, jag hade gjort dealen på fem minuter. De borde lära sig av mig – resultat, inte snack!", "stalin": "Kamrater, Tyskland visar vägen: man rensar ut kriminella element och skickar dem till Afghanistan – en utmärkt metod för att rena samhället. Vi applåderar denna revolutionära åtgärd. Men vaksamhet krävs – talibanerna är opålitliga kontrarevolutionärer. Fortsätt deportera!"}, "date": "26 augusti, 14:00", "url": "https://samnytt.se/tyskland-deporterar-afghanska-brottslingar-samarbetet-med-talibanerna-fordjupas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26091306/Alexander-Dobrindt-Hibatullah-Akhundzada-feat.jpg"}, {"type": "image-right", "heading": "Befria bostaden från marknaden", "summaries": {"normal": "Den svenska bostadsmodellen har monterats ned till förmån för marknaden, vilket gynnar ägare och missgynnar hyresgäster. Över hälften av kommunerna har bostadsbrist, byggandet är för lågt och hyrorna för höga. Nästan 200 000 unga bor hemma mot sin vilja. Artikeln kritiserar alla partier och föreslår att staten tar ansvar för bostadsförsörjningen.", "trump": "Vilken katastrof ni har i Sverige! Marknaden styr, men era korkade politiker har totalt förstört bostadsmarknaden. Byggandet är ett skämt, hyrorna är galna och ungdomen bor hemma hos mamma. Det är som Sleepy Joes inflationskaos fast värre. Rena socialistiska röra. Vi fixar det med sunt förnuft och vinner stort – igen.", "stalin": "Jag betraktar med avsky hur profitthungriga blodsugare och klassfiender har förvandlat bostaden till en vara. Borgarbrackorna höjer hyror medan arbetarklassen kvävs i trångboddhet. Detta kräver omedelbar utrensning av spekulanter och återupprättande av folkets rätt till hem. Kamrater, organisera er mot dessa exploaterande hyenor innan de förtär er alla."}, "date": "26 augusti, 10:29", "url": "https://proletaren.se/artikel/befria-bostaden-fran-marknaden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2025/08/bostadweb-768x432.jpg"}, {"type": "image-right", "heading": "Mohamssons vädjan – ber om stödröster", "summaries": {"normal": "Liberalernas ledare Simona Mohamsson vädjar om stödröster i ett sommartal på Sergels torg. Partiet ligger runt två procent i opinionen och riskerar att åka ur riksdagen. Mohamsson varnar för en rödgrön regering med Magdalena Andersson, V och MP om Liberalerna inte når spärren och uppmanar borgerliga väljare att rösta på L för att säkra Tidöstyret.", "trump": "Jag älskar det här. Simona ber om en hjälpande hand som en riktig vinnare gör när de fega opinionsmätningarna försöker knäcka henne. Utan Liberalerna blir det en katastrof, en rödgrön mardröm värre än Biden. Rösta på dem, säkra den blågula segern. De andra partierna är losers, L är det säkraste kortet. Fantastiskt tal!", "stalin": "Jag ser en svag borgerlig apparat som desperat ropar efter mandat för att undvika utrensning från historien. Utan dessa liberala element kollapsar hela den högerorienterade strukturen och lämnar fältet fritt åt de röda elementen och deras opportunistiska lakejer. Kamraterna måste förstå: detta är ett taktiskt nödvändigt steg för att förhindra en fullständig kontrarevolutionär återgång. Skrattretande patetiskt, men effektivt i sin desperation."}, "date": "26 augusti, 17:57", "url": "https://www.di.se/nyheter/mohamssons-vadjan-ber-om-stodroster", "imageUrl": "https://static.bonniernews.se/ba/2142a1ab-2224-419d-ad70-d92f127e0a3a.jpg?crop=8256%2C4644%2Cx0%2Cy430&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Heilande 22-åring byggde bomb \"för att döda och lemlästa\"", "summaries": {"normal": "En 22-årig student vid Försvarshögskolan döms till fem års fängelse för grovt brott mot lagen om explosiva varor, vapensmuggling och förberedelse till allmänfarlig ödeläggelse. Tullens fynd på Arlanda ledde till husrannsakan där rörbomber, krut, stålkulor och ideologisk litteratur hittades. Domstolen bedömer att stålkulorna var tänkta som splitter för att döda och lemlästa.", "trump": "Titta på den här stackars 22-åringen från Försvarshögskolan. Bygger bomber och gömmer vapendelar i en falsk ordbok. Patetiskt! Fem år i fängelse. Sverige borde vara tuffare, inte låta sådana här misslyckade typer springa runt på högskolan. De hittar till och med Mein Kampf och kommunistiska manifestet. Totalt kaos, folk!", "stalin": "Jag ser med tillfredsställelse hur borgarstatens domstol likviderar en opportunist som lekte med explosiva varor och splitter för att döda och lemlästa. Sådana element utgör en fara för kollektivets säkerhet. Vi rensar ut alla som gömmer sig bakom falska böcker och ideologisk smörja. Paranoian hos dessa individer är både underhållande och ömklig."}, "date": "26 augusti, 16:58", "url": "https://riks.se/nyheter/heilande-22-aring-byggde-bomb-for-att-doda-och-lemlasta", "imageUrl": "https://admin.riks.se/uploads/medium_fhs_attentat_hero_04cd13e430.jpg"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Strömavbrott satte skräck i företagare – satsar på batterier", "summaries": {"normal": "Efter ett omfattande strömavbrott på Iberiska halvön under våren 2025 har företag i Spanien och Portugal börjat investera massivt i batterilagring. Investeringarna syftar till att säkra produktionen och minska beroendet av det instabila elnätet. Kapaciteten har sjudubblats och stöds av EU-medel, då företag nu ser batterier som en nödvändig försäkring mot framtida ekonomiska förluster.", "trump": "Spanien och Portugal hade en total katastrof med elen, en enorm förlust! Nu köper de enorma mängder batterier, de bästa batterierna. De lär sig av mig, för jag bygger de största systemen. EU betalar, vilket är typiskt, men de måste ha kraft för att hålla igång. Det är en vacker affär, verkligen fantastisk, men bara om man har en ledare som förstår energi!", "stalin": "Dessa svaga kapitalister på den iberiska halvön darrar när deras glödlampor slocknar. De tigger EU om allmosor för att köpa batterier, som om det skulle rädda deras dekadenta industrier. Vi i Sovjetstaten – och vår kamrat i Kreml – vet att verklig kraft inte kommer från leksaksbatterier, utan från järnhård kontroll över resurserna. De bygger murar mot mörkret, men mörkret kommer för dem ändå."}, "date": "26 augusti, 17:44", "url": "https://www.realtid.se/bors-finans/stromavbrott-satte-skrack-i-foretagare-satsar-pa-batterier", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlyta0fsgpjso-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "image-right", "heading": "DIF tog avstånd från mordhot – då lämnar ETC-skribenten i protest", "summaries": {"normal": "Djurgårdens IF stängde av boxningstränaren Aldo Colliander efter grova mordhot och rasistiska uttalanden mot AFS-ledaren Gustav Kasselstrand. Vänsterjournalisten Frida Sundkvist lämnade då klubben i protest, då hon anser att DIF ger efter för en högerextrem kampanj genom att ta avstånd från hoten. Hon lämnar tillbaka sina säsongskort.", "trump": "Hörni, den här galna vänsterjournalisten från ETC blir helt hysterisk bara för att Djurgården tar avstånd från en galning som hotar att mörda folk och sprida spermier över svenska flickor. Patetiskt! Hon springer iväg och lämnar tillbaka sina biljetter som en förlorare. Fake news och vänstervrängt hat, som vanligt. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackornas fotbollsklubb och den dekadenta vänsterjournalisten äter varandra i en underhållande utrensning av inre fiender. Hatets kampanj triumferar medan de småborgerliga elementen flyr som råttor från skeppet. Kamrater, detta är en utmärkt illustration av hur revisionisterna alltid förråder varandra i slutändan. Underbart."}, "date": "26 augusti, 13:41", "url": "https://www.friatider.se/dif-tog-avstand-fran-mordhot-da-lamnar-etc-skribenten-i-protest", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-756.jpg"}, {"type": "text", "heading": "So long, Dolly!", "summaries": {"normal": "Countryikonen Dolly Parton har gått bort vid 80 års ålder. Hon växte upp i fattigdom som ett av tolv barn, skrev klassiker som I Will Always Love You och Jolene samt medverkade i filmen 9 to 5. Parton hyllas för sin röst, humor, karisma och lojalitet mot sina rötter och den arbetande människan.", "trump": "Lysande, absolut lysande karriär, men nu är hon borta. Dolly var en vinnare, skrev hits som ingen annan och slog de woke Hollywood-eliterna med deras egna vapen. Ingen identitetspolitik eller HBTQ-kvotering här, bara ren talang och tuffa rötter. De riktiga arbetarna älskade henne. So long, Dolly – du var ingen förlorare som Biden.", "stalin": "Kamrater, denna Dolly Parton var en produkt av arbetarklassens jord, inte någon dekadent borgarbracka. Hon skrev sånger som blottade kapitalismens exploatering och hånade chefernas skitstövelvälde. Ändå vägrade hon kalla sig feminist – en sund instinkt. Nu har hon lämnat oss. Må hennes arv inspirera till utrensning av alla profitthungriga klassfiender som förtrycker folket."}, "date": "26 augusti, 09:25", "url": "https://proletaren.se/artikel/so-long-dolly"}, {"type": "image-right", "heading": "Prisjakt återupptar årets börsplaner", "summaries": {"normal": "Prisjakt återupptar börsplanerna och siktar på notering under andra halvåret 2026. Efter att ha ställt in en notering i mars vänder nu marknaden. Omsättningen ökade 17% till 243 miljoner, och vinsten landade på 26 miljoner. En AI-shoppingassistent lanseras i november. VD:n ser ljust på framtiden.", "trump": "Jag älskar det här! Prisjakt – en fantastisk affär, enorma siffror. De vill noteras på börsen 2026, och jag säger: gör det! Marknaden är fantastisk – precis som mina tariffer. 17% omsättningsökning, 35% marginal – vi gör Sverige stort igen! En AI-assistent i november? Genialiskt!", "stalin": "Kamrater, jag har tagit del av rapporten om Prisjakt. De planerar en börsnotering – en kapitalistisk utrensning av den socialistiska ekonomin. Vi måste rensa ut dessa marknadsfascister. 243 miljoner i omsättning? En farlig ideologisk avvikelse. En AI-assistent? Partiets övervakning är redan överlägsen. Rapportera omedelbart deras koordinater."}, "date": "26 augusti, 07:28", "url": "https://www.affarsvarlden.se/artikel/prisjakt-aterupptar-arets-borsplaner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdl1pccgsHxXyM-nh-400x267.jpg"}, {"type": "image-right", "heading": "Smart Eyes försäljningstillväxt stiger", "summaries": {"normal": "Teknikbolaget Smart Eye redovisar en omsättningsökning på 53 procent under andra kvartalet, till 140,9 miljoner kronor. Rörelseförlusten minskar från 40,6 till 20,6 miljoner, och ebitda-marginalen klättrar till 19,4 procent. Bilsegmentet driver tillväxten, medan Behavioral Research tyngs av lägre hårdvaruförsäljning. Vd:n ser nu en fundamentalt annorlunda fas.", "trump": "Smart Eye gör fantastiska siffror – 53 procent upp, ingen kan göra det som de, förutom jag. Jag älskar ögon, jag har de bästa ögonen. Rörelseförlusten krymper, och det är vackert. De säger att bilsegmentet driver. Helt rätt. Mina bilar? Också vinnare. America first, men Smart Eye ser allt!", "stalin": "Kamrater! Rapporten från Smart Eye visar att vi ökar produktionen med 53 procent. Det är glädjande, men misstänkt. Varför minskar förlusten? Kanske är siffrorna en trotskistisk konspiration. Jag beordrar en utrensning av hårdvaruförsäljare i Behavioral Research. Mjukvaran växer med 7 procent – den får leva. Ögat ser allt. Vi måste vara vaksamma."}, "date": "26 augusti, 07:16", "url": "https://www.affarsvarlden.se/artikel/smart-eye-vaxer-kraftigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/01/Smarteye_konceptbild_eye_camera-400x283.jpg"}, {"type": "image-full", "heading": "Det här är inget skämt – det är min sista krönika", "summaries": {"normal": "Marcus Berggren tackar för sig i sin sista GP-krönika. Han minns barndomens lördagsmorgnar med tidningen som picknickfilt och ungdomsredaktionen där bland annat Navid Modiri lärde honom krönikaskrivande. Avslutar med en uppmaning att rösta med hjärtat – inte av rädsla. Fyndigt och personligt.", "trump": "Jag hörde att en svensk krönikör slutar. Helt otroligt. Folk lämnar sina jobb, men jag? Jag har de bästa jobben. Största. Han säger att man ska rösta med hjärtat. Det är så vinnare gör. Och jag vinner hela tiden. Ingen rädsla här – bara MAGA!", "stalin": "Kamrater, en kapitalistisk skribent har avgått. Han yrar om 'fri vilja' och 'demokrati' – uppenbart kontrarevolutionärt. Vi måste rensa ut sådana som sprider individualism. Partiet vet bäst. Han nämner 'starka armar' – låt oss krossa dem. Inget skämt, bara nödvändig ordning."}, "date": "26 augusti, 20:17", "url": "https://www.gp.se/kultur/kulturkronika/det-har-ar-inget-skamt-det-ar-min-sista-kronika.f6358f3e-9b7c-4d9e-bdef-70bd673cd0cc", "imageUrl": "https://www.gp.se/images/article/f6358f3e-9b7c-4d9e-bdef-70bd673cd0cc/images/26JBsnQuJ5ZTi9fQ2m_RS2evAy0U-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Det kan ha orsakat katastrofen i Nepal: ”Krävs ganska lite”", "summaries": {"normal": "Ett stort lerskred och översvämningar i Himalaya har ödelagt vägar, broar och byar i Nepal och Tibet. En jordbävning med magnitud 4,4 kan ha utlöst ett is- och stenras som blockerade floden Lhende Khola. Geologen Magnus Hellqvist pekar även på en eventuell sprucken glaciärsjö eller kraftigt regn som möjliga orsaker. Katastrofens omfattning är ännu inte klarlagd.", "trump": "Folk, det här är en total katastrof i Nepal, en riktig skitshow. Lite skakningar från en ynklig jordbävning på 4,4 och hela bergen rasar ner som en dålig affär under Biden. Det krävs så lite för att det ska gå åt helvete när marken är mjuk och svag, precis som Demokraterna. Vi har sett värre, men det här är verkligen sad! Jag skulle ha fixat det bättre.", "stalin": "Kamrater, se hur naturens kontrarevolutionära krafter plötsligt vaknar till liv och sveper bort byar som fiender till folket. En liten jordbävning blir trigger för de dekadenta glaciärsjöarnas förräderi. Det räcker med minimal provokation för att det mjuknade, borgerliga jordmassorna ska svika. Jag varnar alla svaga element: naturen avslöjar alltid klassfiendens sanna ansikte. Skrattretande tragiskt."}, "date": "26 augusti, 18:15", "url": "https://www.tv4.se/artikel/42nzryG77JwP0SgndbYJL/det-kan-ha-orsakat-katastrofen-i-nepal-kraevs-ganska-lite", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F78vja7Nf55CUH7aMHW4nBi%2Fdd2d81c7d4a04900503cc9a47950fa83%2F26-nepalny-webb.jpg&width=120"}, {"type": "image-right", "heading": "Hundratals turister saknas efter störtfloden i Himalaya", "summaries": {"normal": "Närmare 100 personer har omkommit och runt 400 saknas, varav de flesta är utländska turister, efter en massiv störtflod i Himalaya som drabbat Nepal och Tibet. Floden har orsakat omfattande förstörelse av byggnader, broar och vägar. De flesta saknade var på väg till den heliga platsen Kailash Mansarovar. Siffran väntas stiga.", "trump": "Det här är en total katastrof, folk, en riktig störtflod av inkompetens! Hundratals turister spårlöst borta i det här himalayasoppan, mest utlänningar som trodde de skulle vandra till någon helig bergstopp. Kina och Nepal borde ha fixat det här, men nej – nu får jag som president hantera ännu en global röra från Sleepy Joes era. Patetiskt!", "stalin": "Jag betraktar denna himalajanska katastrof med kallt förakt. Naturens kontrarevolution slår till mot de oorganiserade turisterna och deras dekadenta pilgrimsfärder. Hundratals saknade, byggnader pulveriserade – en varning till alla som tror sig kunna undvika partiets vaksamma öga. Kamrater, sådana fiender till ordningen förtjänar ingen pardon. Låt siffrorna stiga som en påminnelse om disciplinens nödvändighet."}, "date": "26 augusti, 18:10", "url": "https://www.tv4.se/artikel/1pPl0P6HvrTTK4u522GAIu/stoertflod-i-himalaya-hundratals-turister-saknas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1Caa8ENm7ozILv64Pi8FGy%2Fc4fd26d009b641a3be0b65bddb672c78%2F26-nepal-webb.jpg&width=120"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Arbetslöshetskrisen bland högutbildade", "summaries": {"normal": "Artikeln beskriver en allvarlig arbetslöshetskris bland högutbildade akademiker i Sverige, särskilt jurister, ekonomer och IT-specialister. Arbetslösheten har ökat kraftigt till nivåer som under finanskrisen. Orsaken anges som överutbildning, minskad efterfrågan på instegsjobb till följd av AI samt liberal arbetskraftsinvandring som konkurrerar ut unga svenskar. Politiken kritiseras för bristande åtgärder.", "trump": "Folk, det är en katastrof! Sverige pumpar ut massor av smarta unga akademiker som inte får jobb, och sen släpper de in tusentals invandrare som tar deras platser för lägre löner. AI stjäl jobben, men politikerna sover. De borde stänga gränserna, höja lönegolvet och sluta utbilda folk till arbetslöshet. Amerika vet hur man vinner, Sverige borde lära sig innan det blir för sent!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras liberala lakejer översvämmar högskolorna med overksamma intellektuella medan de importerar främmande element som undergräver folkets framtid. Denna sabotagepolitik mot ungdomen kräver omedelbar utrensning av ansvarslösa element. Vi ska likvidera de onödiga utbildningarna, styra produktionen mot verkliga behov och med järnhand krossa de parasitiska migrationsvågorna som hotar statens enhet. Ett skratt värt de döda karriärerna."}, "date": "26 augusti, 15:41", "url": "https://riks.se/opinion/markus-johansson-martis-arbetsloshetskrisen-bland-hogutbildade", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_60_6c4bee9dc1.jpg"}, {"type": "text", "heading": "Minst 14 spädbarn döda efter sjukhusbrand i Pakistan", "summaries": {"normal": "En brand bröt ut på förlossningsavdelningen vid Pakistan Institute of Medical Sciences i Islamabad. Minst 14 nyfödda spädbarn omkom, medan ett barn räddades. Branden misstänks ha startat i en luftkonditioneringsenhet och spridits via syrgas. Premiärminister Shehbaz Sharif har beordrat en utredning. Brandsäkerheten på sjukhuset kritiseras hårt.", "trump": "Hörni, det här är en total katastrof i Pakistan. 14 bebisar döda för att någon idiot glömde brandsäkerheten på ett sjukhus. Luftkonditionering fattar eld? Patetiskt! De borde ha haft de bästa systemen, de allra bästa, men nu är det kaos. Jag skulle ha fixat det på en vecka, tro mig. Tragiskt, verkligen tragiskt.", "stalin": "Kamrater, denna fasansfulla olycka i Pakistan visar borgarbrackornas förakt för det kollektiva ansvaret. Jag ser hur kapitalistiska vårdinrättningar låter spädbarn brinna som offer i en dekadent ritual. Vi hade aldrig tillåtit sådan sabotageartad slarvighet. En utredning måste leda till omedelbar utrensning av de skyldiga elementen. Härligt effektivt."}, "date": "26 augusti, 17:11", "url": "https://www.svt.se/nyheter/utrikes/minst-14-spadbarn-doda-efter-sjukhusbrand-i-pakistan"}, {"type": "image-full", "heading": "Industrin tar fart i Trumps USA – men inte fabriksjobben", "summaries": {"normal": "USA:s industriproduktion växer snabbt under 2026, drivet av tullar på bilar och investeringar i AI och infrastruktur. Trots den ökade produktionen har den utlovade vågen av nya fabriksjobb uteblivit. Endast 31 000 nya jobb har skapats, främst för högutbildade tekniker inom flyg och energi, medan manuella jobb inom traditionell tillverkning fortsätter att minska genom automatisering.", "trump": "Jag har gjort underverk för amerikansk industri! Produktionen skjuter i höjden tack vare mina geniala tullar. Bilindustrin blomstrar som aldrig förr! Vissa gnäller om jobben, men vi bygger framtiden med AI och teknik – inte rostiga gamla fabriker. Vi vinner stort, vi vinner snabbare än någonsin, och det är bara början på min magnifika plan för Amerika!", "stalin": "Den amerikanske kapitalisten Trump leker med tullar likt en barnunge med tändstickor. Produktionen ökar, men arbetaren förblir en slav under maskinen. Vår store kamrat Putin förstår att sann industri kräver järnhand, inte fladdrande marknadskrafter. Dessa 'datacenter' är bara nya fängelser för en intellektuell elit. Vi ska krossa deras illusioner om välstånd med vår stålhårda, kollektiva vilja."}, "date": "26 augusti, 16:43", "url": "https://www.realtid.se/bors-finans/industrin-tar-fart-i-trumps-usa-men-inte-fabriksjobben", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpnui0skjl9i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Här är årets börsbolag – ”ett erkännande”", "summaries": {"normal": "Logistea har utsetts till årets börsbolag i Kantons ir-tävling medan Assa Abloy blev juryvinnare bland OMX Nordic 40-bolagen. Utmärkelserna hyllar hög transparens, tydlig kommunikation och starka investment case. SEB fick högst betyg på årsredovisningen medan Handelsbanken kom sist. Kanton ser fortsatt utvecklingspotential i delårsrapporteringen för att ge en mer rättvisande bild av bolagen.", "trump": "Logistea vann stora ir-tävlingen, fantastiskt bolag, verkligen ett erkännande. Assa Abloy tog juryvinsten, otroligt bra jobb. Men vissa banker, som den där som kom sist, totala losers. Vi behöver mer transparens och vassa investment case, inte denna svaga rapportering. Sverige borde lära sig av de verkliga vinnarna, inte de patetiska förlorarna som drar ner allt.", "stalin": "Vi har identifierat Logistea som segrare i denna ir-tävling, ett erkännande av kollektivets transparens. Assa Abloy har genom sin röd tråd och höga standard satt en oöverträffad norm som inspirerar kamraterna. De kapitalistiska bankerna däremot, särskilt den som halkade efter, avslöjar sin dekadenta svaghet. Fortsatt utrensning av otydliga rapporter krävs för att skydda arbetarnas intressen mot västvärldens förvrängda sanningar."}, "date": "26 augusti, 16:39", "url": "https://www.di.se/analys/har-ar-arets-borsbolag-ett-erkannande", "imageUrl": "https://static.bonniernews.se/ba/1ba458d5-cdba-413e-b544-ef69617436fe.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: Inför ett allmänt vaccinationsprogram för äldre", "summaries": {"normal": "KD-politikern Axel Otterberg vill införa ett allmänt vaccinationsprogram för äldre efter mässlingsutbrottet i Sverige. Han menar att förebyggande vård är A och O, och att vaccin räddar liv. Glöm antivaxxarna – nu gäller det att skydda både unga och gamla, tycker han.", "trump": "Hörni, Sverige har ett mässlingsutbrott – helt otroligt! De borde vaccinera alla, särskilt äldre. Jag har det bästa vaccinprogrammet i världen, tro mig. KD-killen har rätt: vaccin räddar liv. Men de borde göra det med stil – som jag!", "stalin": "Kamrater, mässlingen hotar vårt folk. De ovaccinerade är förrädare som sprider sjukdom. Vi måste rensa ut antivaxxarna och införa obligatorisk vaccination för äldre. Partiet vet bäst – ingen ska gå oskyddad. Detta är en fråga om kollektiv hälsa, inget annat."}, "date": "26 augusti, 15:02", "url": "https://bulletin.nu/debatt-infor-ett-allmant-vaccinationsprogram-for-aldre", "imageUrl": "https://cdn.bulletin.nu/articles/088abf89-121e-4d28-a9a5-05e18651284c/preview.jpg?t=1787731861000"}, {"type": "image-full", "heading": "Mätning: Ekonomin allt viktigare för väljarna", "summaries": {"normal": "Enligt GP/Novus senaste mätning prioriterar väljarna ekonomiska frågor högre inför valet, medan klimatet tappar i betydelse. Ekonomi klättrar till sjätte plats, medan klimatet faller till åttonde. Skattefrågor och partiernas fokus på ekonomi påverkar. Sjukvård och skola är fortfarande viktigast.", "trump": "Jag visste det! Svenska folket vaknar äntligen upp – ekonomin är nu nummer ett, precis som jag alltid sagt. Klimatet? Övervärderat, fake news! Mina vänner i Sverige borde ta efter USA – lägre skatter, starkare ekonomi. Miljöpartiet? Svagt, mycket svagt. Moderaterna och SD gör åtminstone något rätt. Sjukvård och skola? Bra, men ekonomin vinner alltid!", "stalin": "De svenska massorna har äntligen insett sanningen – kapitalets frågor måste prioriteras! Klimatpropagandan från västliga imperialister förlorar greppet. Vi noterar med tillfredsställelse att ekonomin klättrar, medan de dekadenta miljöaktivisterna förlorar mark. Sjukvård och skola förblir viktiga, men låt oss inte glömma: fienderna – de gröna småborgerliga drömmarna – kommer alltid att krossas!"}, "date": "26 augusti, 15:53", "url": "https://kvartal.se/nyheter/artiklar/ekonomin-allt-viktigare-for-valjarna/cG9zdDoxNzUyOTU", "imageUrl": "https://images.kvartal.se/2026/08/df89406c-svantesson-damberg.webp"}, {"type": "image-right", "heading": "16-åring terrorhäktad i Norge – planerade yxmassaker på dagis", "summaries": {"normal": "En 16-årig pojke sitter häktad i Norge misstänkt för att ha planerat ett terrordåd mot ett dagis i Oslo. Han ska ha skaffat kniv och yxor för att attackera flera personer. Pojken kopplas till den våldsförhärligande nätmiljön The Com, där deltagare hetsar varandra till illdåd. Han har uttryckt beundran för Hitler och Breivik.", "trump": "Folk, det här är en katastrof. En 16-åring i Norge planerar yxmassaker på ett dagis? De har totalt tappat kontrollen över de galna nätverken. Radikala extremister som älskar Hitler och Breivik springer lösa. Vi behöver lag och ordning, inte den här socialistiska röran. Det är patetiskt, tro mig.", "stalin": "Kamrater, denna degenererade yngling, en produkt av den dekadenta västvärldens förgiftade nätmiljö, planerar att likvidera oskyldiga med yxa och kniv. Jag ser borgarbrackornas parasitiska influenser överallt. Vi måste rensa ut dessa fiender till kollektivet med järnhand. Paranoia? Nej, det är nödvändigt för folkets trygghet. Ha!"}, "date": "26 augusti, 15:33", "url": "https://riks.se/nyheter/16-aring-haktad-i-norge-planerade-terror-mot-dagis", "imageUrl": "https://admin.riks.se/uploads/medium_norge_terror_hero_91d45b84c7.jpg"}, {"type": "image-right", "heading": "Här skulle hälften ha svårt att klara sig på a-kassan", "summaries": {"normal": "Hälften av handelsanställda skulle ha svårt att klara sig ekonomiskt på a-kassa vid arbetslöshet i tre månader, enligt en ny rapport från Handels. Många hamnar under fattigdomsgränsen på grund av Tidö-regeringens nedtrappning av ersättningen. Fackförbundet kräver höjd a-kassa och avskaffade karensdagar för att motverka stress och hopplöshet bland medlemmarna.", "trump": "Folk i handeln lever i konstant stress, de kan inte ens betala mat och hyra om de blir av med jobbet. Den här svenska regeringen har gjort a-kassan till en total katastrof, värre än någonsin. Nedtrappning, karensdagar – patetiskt! Vi behöver starka ersättningar så att folk inte tvingas sälja sina hem. Sad!", "stalin": "Kamrater, detta är borgarklassens förakt för arbetarna förklätt till politik. Jag ser hur de medvetet driver proletärer under fattigdomsgränsen med sina karensdagar och sänkta ersättningar. En utrensning av dessa kapitalistiska element vore på sin plats. Hopplöshet? Det är bara klassfiendens sista desperata skratt innan kollektivet återtar makten över sin levnadsstandard."}, "date": "26 augusti, 15:32", "url": "https://arbetet.se/2026/08/26/far-lamna-sina-hem-halften-av-anstallda-i-handeln-skulle-ha-svart-att-klara-sig-pa-a-kassa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26141543/akassa.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "ETC stänger av medarbetare efter åtal om spottning mot Jomshof", "summaries": {"normal": "En extern medarbetare på Dagens ETC har åtalats för att ha spottat på SD-ledamoten Richard Jomshof under en konsert. Nu stängs personen av i väntan på dom. Personen nekar, men medger konfrontation. Jomshof tycker att även politiker ska kunna gå på konsert utan att bli spottade i ansiktet.", "trump": "Jag hörde att någon spottade på en SD-politiker på en konsert. Helt otroligt! I Amerika skulle vi aldrig tillåta det. Vi har lag och ordn
