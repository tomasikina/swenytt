b61ef3da102519b9b2f62b3c8a9d1170635482"}, {"type": "image-right", "heading": "Hoppas att Björn Söder lärde sig något i Auschwitz", "summaries": {"normal": "Björn Söder besökte Auschwitz-Birkenau och beskrev upplevelsen som omskakande på Facebook. Ledaren Andreas Gustavsson hoppas att besöket får Söder att reflektera över sin egen historia av kontroversiella uttalanden om judar, George Soros och en gammal bild med en före detta SS-soldat. Artikeln lyfter SD:s pågående problem med antisemitism samtidigt som partiet strävar efter normalisering och stöd till Israel.", "trump": "Folk, ni skulle se den här typen Söder. Han åker till Auschwitz, tar selfies med historien och skriver långa Facebook-inlägg om hat. Underbart! Men grabben har poserat med en riktig SS-kille och snackat om att judar inte är svenska nog. Typisk politiker från den där sidan. Biden skulle ha älskat honom. Jag säger: gör om, gör rätt, annars är det bara fake news och tomma ord. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar denna Söder som en typisk opportunist från den dekadenta högerfalangen. Han reser till fascismens offerplatser, gråter krokodiltårar över industriellt hat och återvänder utan att rensa ut sina egna folkfiender inom partiet. Borgarbrackorna och klassfienderna som sprider Soros-myter och ifrågasätter judars existens förtjänar snarast en grundlig utrensning. Inga ursäkter accepteras i folkets namn."}, "date": "4 augusti, 12:20", "url": "https://www.etc.se/ledare/hoppas-att-bjoern-soeder-laerde-sig-naagot-i-auschwitz", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260804100816_91f00e5a-e324-4574-8167-eb29f0358d5c.jpg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Dadgostar: ”Känner mig trygg med hennes värderingar”", "summaries": {"normal": "Nooshi Dadgostar, partiledare för Vänsterpartiet, försvarar Ilona Szatmári Waldau efter att hon skrivit ett stödbrev till en terrordömd palestinsk fånge. Dadgostar menar att brevet syftade till att kräva en rättvis rättegång enligt Genèvekonventionen. Vänsterpartiet har brutit samarbetet med den organisation som förmedlade informationen och ser över sina rutiner. Kritiker, som Centerpartiet, ifrågasätter partiets omdöme och regeringsduglighet.", "trump": "Jag måste säga, det här Vänsterpartiet är ett riktigt skämt! En av deras egna skriver brev till en terrordömd fånge – och sedan försöker de skylla på någon annan? 'Vi visste inte', säger de. Jo, visst. Precis som när jag sa att jag inte visste något om stormningen av Kapitolium. Centerpartiet har rätt – dessa människor är inte redo att styra ett land. Sverige borde ta en titt på USA, där vi faktiskt vet hur man hanterar terrorister. SAD!", "stalin": "Kamrater, ännu en gång visar de borgerliga lakejerna sitt sanna ansikte! Denna så kallade 'vänster'-partiledare försvarar en medlöpare som skriver kärleksbrev till en terrorist – en fiende till folket! Vi i Sovjetunionen visste hur man hanterade sådana förrädare: en enkel lösning, inga onödiga brev. Och nu skriker dessa kapitalistiska hyenor om 'regeringsduglighet'? De borde lära sig av Ryssland – där har vi Putin, som inte tvekar att krossa terrorister och deras sympatisörer. Låt dem skrika, vi vet sanningen!"}, "date": "4 augusti, 12:38", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-kanner-mig-trygg-med-hennes-varderingar/cG9zdDoxNTc3MDM", "imageUrl": "https://images.kvartal.se/2026/08/ea7a4ef5-dadgostar.webp"}, {"type": "image-right", "heading": "Kristerssons totala haveri i Spanienkrisen är genant", "summaries": {"normal": "Artikeln kritiserar statsminister Ulf Kristersson för att ha agerat för snabbt och oansvarigt under krisen i Ceuta. Ledarskribenten menar att massinträdet av migranter från Marocko var en medveten påverkansoperation med desinformation, något som Kristersson gick i fällan för genom att sprida larm om ett nytt 2015. Krisen har utnyttjats av Ryssland och lett till splittring inom EU. Skribenten anklagar även Kristersson och migrationsministern för att ljuga om orsakerna, bland annat Spaniens amnesti.", "trump": "Folk, ni skulle se det här! Den här stackars svenska killen Kristersson, han är en total loser. Han ser en liten gränskris i Spanien och flippar ur som en galning, skriker om nytt 2015 och skrämmer alla. Det var en klassisk fälla, en riggad operation, och han sprang rakt in i den som den desperate typ han är. Patetiskt! Jag fixade muren, han fixar ingenting. Nu ser Sverige ut som ett skämt medan Putin skrattar. Sad!", "stalin": "Kamrater, denna ynkliga svenska borgarledare Kristersson visar återigen den imperialistiska svaghetens fula tryne. Han rusar som en förvirrad folkfiende rakt in i fiendens desinformationsfälla och sprider lögner som en kapitalistmaffians lakej. Vi ser hur klassfiendens desperation driver honom att attackera en suverän stat för att vinna billiga poäng. En sådan brist på revolutionär vaksamhet förtjänar att rensas ut ur alla seriösa ledarskikt. Sovjetisk disciplin hade aldrig tillåtit detta clowneri."}, "date": "3 augusti, 17:30", "url": "https://www.etc.se/ledare/kristerssons-totala-haveri-i-spanienkrisen-aer-genant", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-right", "heading": "Ny vändning i Teslakonflikten– anställda ska strejka igen", "summaries": {"normal": "Teslastrejken tar en ny vändning då ett 40-tal strejkande arbetare som återgick till sina jobb under sommaren nu ska tas ut i strejk igen den 13 augusti. Beslutet, som beskrivits som en jojo-strejk för att skapa oförutsägbarhet, kommer från IF Metall. En strejkande uttrycker chock och förvirring då ingen information kommit under sommaren. Konflikten är den längsta i modern svensk historia.", "trump": "Folk, ni kommer inte att tro det här. De där Tesla-strejkarna, som jag älskar förresten, de gick tillbaka till jobbet i sommar som riktiga patrioter, och nu drar facket in dem i strejk igen. Totalt kaos! Jojo-strejk, säger de. Det är en skam. IF Metall vet inte vad de håller på med, ingen har hört ett ljud på hela sommaren. Patetiskt. Sverige behöver starka ledare, inte sådana här clowner.", "stalin": "Kamrater, dessa opålitliga element bland Teslas anställda som vi skickade tillbaka till produktionen under sommaren har nu återkallats till strejken den 13 augusti. Deras chock och förvirring är ett tecken på svaghet som kapitalisterna utnyttjar. Vi ska rensa ut alla jojo-element och borgarbrackor som sprider desinformation inom facket. Inget hördes på sommaren? Typiskt sabotage från klassfiendens lakejer. Låt utrensningen fortsätta med glädje i hjärtat."}, "date": "4 augusti, 11:42", "url": "https://arbetet.se/2026/08/04/teslastrejken-tar-ny-vandning-anstallda-ska-strejka-igen-en-chock", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04113143/sdlndaych3b4he-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Nej till kontanter – då kan matbutiken neka ditt köp", "summaries": {"normal": "Den nya kontantlagen som trädde i kraft 1 juli 2026 kräver att mataffärer och apotek tar emot kontanter på bemannade kassor mellan klockan 06.00 och 20.00. Undantag gäller vid säkerhetsrisker, köp över 5 920 kronor eller fler än 25 mynt. Lagen kritiseras som verkningslös eftersom de flesta butiker redan accepterar kontanter, och den omfattar inte bensinmackar eller offentliga tjänster. Sverige fortsätter att vara ett av världens mest digitala länder med Swish och mobila kort.", "trump": "Den här svenska kontantlagen är en total katastrof, tro mig. De tvingar butiker att ta emot kontanter men sedan säger de att det inte gäller om det är farligt eller om du köper för mycket. Patetiskt! Sverige var en gång starkt men nu har de gått all in på Swish och mobila grejer medan resten av Europa håller fast vid riktiga pengar. Lagen är svag, ingen får böter, den täcker inte ens bensin eller pass. En stor misslyckad affär, folk.", "stalin": "Kamrater, denna så kallade kontantlag är en ynklig kapitulation inför de digitala spekulanterna och borgarbrackornas appar. Jag, som alltid försvarat arbetarklassens rätt till äkta mynt och sedlar, ser hur dessa kapitalistiska parasiter försöker rensa ut kontanterna med sina lömska Swish-fällor. Vi tillåter inga undantag för säkerhet eller dyra köp – det är bara nya förevändningar från klassfienderna. Den som vägrar ta emot folkets pengar ska likvideras omedelbart. Paranoia? Nej, det är bara sund vaksamhet mot de som vill kontrollera varje transaktion i skuggorna."}, "date": "4 augusti, 11:55", "url": "https://nyheter24.se/nyheter/ekonomi/1502575-nej-till-kontanter-da-kan-matbutiken-neka-ditt-kop", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2a878b9b04b004a30200000000b004a302/2026/08/04/2382072/kontanter-nej.jpg"}, {"type": "image-right", "heading": "Så slapp Tara chefens ohållbara förslag", "summaries": {"normal": "Undersköterskan Tara Lindeman blev utmattad av en stressig arbetsmiljö på äldreboendet Åsliden i Båstad. När hon skulle återgå till arbetet efter sjukskrivning ville chefen att hon skulle vara springare mellan avdelningarna, något hon upplevde som ohållbart. Med stöd av skyddsombudet Lina Svensson, rehab-koordinator och Försäkringskassan fick hon igenom anpassningar. Nu arbetar hon med aktiviteter och matning i lugnare tempo på 25 procent. Artikeln belyser vikten av att vara tydlig med sina rättigheter och att facket kan spela en avgörande roll.", "trump": "Folk, det här är en total katastrof. Den stackars kvinnan Tara, en undersköterska, utmattad av en hopplös chef som ville köra runt henne som en galning mellan avdelningarna. Springare? Låter som en usel deal, tro mig. Men tack vare ett tufft skyddsombud och några smarta människor satte hon stopp. Hon fick sitt lugna jobb med gamlingarna istället. Chefen förlorade stort. Sådana chefer är losers, de fattar inte att man måste behandla sina medarbetare rättvist annars kollapsar hela verksamheten. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den utbrända arbetaren Tara Lindeman genom kollektivets enade styrka besegrade den kapitalistiska chefen och hennes ohållbara, kontrarevolutionära förslag om evig springarverksamhet. Vi rensade ut den borgerliga stressen och likviderade försöken att förslava henne som en exploaterad springflicka åt borgarbrackorna. Med stöd av partivännerna i facket och statens organ tvingade vi fram en plan som stärker arbetarklassen. Den som vägrar anpassa sig till folkets behov skall utrensas ur ledningen. Verksamheten styrs inte av chefer, utan av oss. Triumf!"}, "date": "4 augusti, 10:19", "url": "https://arbetet.se/2026/08/04/sa-slapp-tara-chefens-ohallbara-forslag-det-galler-att-vara-tydlig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25082839/tara-lisa2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-full", "heading": "Vänsterpartist hyllade terrorist: \"Blev fel\"", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Ilona Szatmári Waldau har hyllat den dömda terroristen Ahmad al-Moghrabi på sociala medier och skickat stödjande meddelanden. Hon medger nu att det blev fel i faktagranskningen eftersom han bland annat beordrat terrorbombningar mot civila. Inlägget har tagits bort och hon fördömer terrorism. Tidigare i år har Expressen avslöjat att 25 vänsterpartistiska kandidater hyllat terror och diktaturer, varav 22 har strukits från valsedlarna.", "trump": "Folk, ni tror inte vad jag just läste. Den här vänsterkvinnan Ilona från Sverige hyllade en riktig terrorist, en bombare som dödade oskyldiga, och skickade kärleksbrev till honom. Sen säger hon 'det blev fel'. Typiskt vänsterradikalerna, de älskar terrorister men hatar de som gör landet starkt. De har hyllat terror i åratal och nu åker de ut från valsedlarna. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, jag har sett denna ynkliga förrädare inom vänstern som smög sig till att hylla en kapitalistisk lakej och terrorbombare mot folket. Hennes faktagranskning var lika värdelös som en borgarbrackas löften. Vi måste rensa ut sådana element som i hemlighet stödjer fiendens hantlangare. Inget stöd till våld mot arbetarklassen – bara mot de sanna parasiterna. Ett sådant misstag är ovärdigt och kräver omedelbar ideologisk utrensning bland de falska kamraterna."}, "date": "4 augusti, 11:00", "url": "https://nyheter24.se/nyheter/politik/1502699-vansterpartist-hyllade-terrorist-blev-fel", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/85f87aee04b004a3020000350000047502/2026/08/04/2382081/ur_imageb3zyDy.jpeg"}, {"type": "image-right", "heading": "Asmodee rapportrusar på munter börs", "summaries": {"normal": "Stockholmsbörsen nådde en ny rekordnivå på morgonen med OMXS30 upp 1,07 procent. Asmodee överraskade med tvåsiffrig tillväxt och en 10-procentig aktieökning. Volvo Cars rapporterade en 4-procentig försäljningsnedgång för maj–juli 2026, vilket ledde till en 4,1-procentig aktiefall. IPC och Flerie noterade positiva rörelser, medan H&M och Essity föll.", "trump": "Jag berättar om en fantastisk börsdag – den bästa någonsin! Asmodee slog alla förväntningar, precis som jag brukar göra. Volvo? De misslyckas, det är sorgligt. Men jag vet att mina policyer gör Amerika och dess allierade starkare. Det är en stor, storslagen framgång för alla som förstår affärer.", "stalin": "Vi ser med tillfredsställelse hur marknaden visar tecken på klassisk kapitalistisk svaghet. Asmodees tillväxt är ett resultat av vår starka planekonomiska strategi. Volvo, en fiende till statens planer, sjunker. IPCs produktion kommer att nå en platå – precis som vi befunnit. Vi fortsätter vår marsch mot ekonomisk suveränitet."}, "date": "4 augusti, 09:39", "url": "https://www.affarsvarlden.se/artikel/asmodee-rapportrusar-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/02/F9RikO4XcAAmHr6-400x266.jpg"}, {"type": "image-full", "heading": "Svenskarnas dröm för hemmet – nästan var fjärde vill ha den", "summaries": {"normal": "En undersökning från Fastighetsbyrån visar att svenskarna främst drömmer om pool, bastu och hemmagym när pengar inte spelar roll. Poolen toppar listan med 31 procent, följt av bastu och gym. Kvinnor föredrar pool och walk-in-förvaring medan män prioriterar bastu. Intresset för hushållsrobotar växer, särskilt bland kvinnor. Enligt Fastighetsbyrån har pandemin, klimatförändringar och teknikutveckling ökat drömmen om bekvämligheter som kan höja bostadens värde.", "trump": "Vet ni vad? Svenskarna är smarta, de vill ha pooler, bastur och hemmagym – de bästa grejerna. Jag älskar det! 31 procent vill ha pool, det är fantastiskt. Kvinnorna vill ha pool och stora garderober, männen bastu, klassiskt. Och de vill ha robotar som städar åt dem, ingen vill städa själv, tro mig. Det här kommer att göra deras hus enormt värdefulla, de kommer att vinna stort. Underbara drömmar, verkligen underbara.", "stalin": "Kamrater, i denna undersökning ser vi hur den dekadenta borgarklassen längtar efter pooler, bastur och hemmagym för att gömma sig från folkets blickar. Jag, som alltid vakar över kollektivet, noterar att 31 procent av dessa element vill ha en privat pool – typiskt kapitalistiskt excess. Kvinnorna kräver walk-in-closets medan männen bastar i sin fåfänga. Än värre är deras önskan om hushållsrobotar som ska ersätta ärligt proletärt arbete. Vi måste rensa ut dessa parasitiska drömmar innan de förgiftar hela samhället. En utrensning av sådana småborgerliga fantasier vore både nödvändig och underhållande."}, "date": "4 augusti, 09:30", "url": "https://nyheter24.se/nyheter/konsument/1502574-svenskarnas-drom-for-hemmet-nastan-var-fjarde-vill-ha-den", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5a2de78104b004a30200000000b004a302/2026/08/03/2381980/hem-svenskar-pool.png"}, {"type": "image-right", "heading": "När ska V börja lära sig av historien?", "summaries": {"normal": "Expressen har avslöjat att vänsterpartistiska riksdagsledamoten Ilona Szatmári Waldau hyllat en man dömd för att ha organiserat självmordsattentat mot barn och tonåringar. Artikeln kritiserar Vänsterpartiets slappa hållning mot antisemitism, terrorhyllningar och historiskt bagage. Trots att vissa kandidater tagits bort efter avslöjanden verkar partiet sakna förmåga att självsanera utan medial press. Problemet beskrivs som strukturellt och kopplat till en alltför hög tolerans för extrema åsikter.", "trump": "Folk, ni skulle inte tro det, men det här vänsterpartiet i Sverige är en total katastrof, en riktig röra. De hyllar terrorister som mördar bebisar och tonåringar och kallar det för frihetskamp. Patetiskt! De förnekar Förintelsen, älskar Iran och Ryssland och kan inte ens städa upp sitt eget historiska skräp. Så svagt. De behöver en stor utrensning, tro mig, ingen gör det bättre än jag, men de är för fega. Sad!", "stalin": "Kamrater, denna revisionistiska röra inom Vänsterpartiet utgör ett klart hot mot folkets enhet. Jag ser med djup misstänksamhet hur borgarbrackornas tidningar avslöjar att vissa element hyllar fiender som organiserar attentat mot spädbarn. Vi måste omedelbart inleda en grundlig utrensning av dessa dekadenta terrorromantiker och antisemitiska avfällingar som maskerar sig som palestinaaktivister. Deras naivitet är troligen bara en fiendekonspiration. Rensa ut dem innan de förgiftar hela kollektivet – med ett leende, naturligtvis."}, "date": "4 augusti, 12:13", "url": "https://www.di.se/ledare/nar-ska-v-borja-lara-sig-av-historien", "imageUrl": "https://static.bonniernews.se/ba/3622bf2d-66fc-4164-8ebc-db02e7c1262a.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Oljebolaget IPC ökar omsättningen", "summaries": {"normal": "Oljebolaget IPC rapporterade en 16,9 procentig ökning av omsättningen till 185,7 miljoner dollar under andra kvartalet, medan ebitda förbättrades. Nettovinsten föll till 9,9 miljoner dollar. Genomsnittlig nettoproduktion nådde cirka 42 200 fat oljeekvivalenter per dag. Bolaget justerade sina prognoser för operativt och fritt kassaflöde för 2026 uppåt. VD William Lundin nämnde att Blackrod Phase 1 i Kanada började producera olja i maj, före tidsplan och inom budget.", "trump": "Jag, Donald Trump, ser fantastiska siffror från IPC. Oljan är viktigast av allt, och de har gjort en bra jobb. Mina fiender säger att jag inte förstår affärer, men titta på dessa resultat! Blackrod-projektet är en bevis på amerikansk genialitet, även om det är i Kanada. Vi kommer att vinna tillbaka vita huset 2024, och då kommer vi att ha kontroll över alla oljebolag.", "stalin": "Vi, partiet, ser en ökning av oljeutvinningen som en seger för statens planekonomi. IPC, en fiende av arbetarklassen, försöker maximera vinst på bekostnad av folket. Men vi kommer att ta kontroll över alla oljeresurser, precis som Putin gör i Ryssland. Deras 'frihet' är bara ett sätt att dölja sina girighetiga motiv. Vi kommer att säkerställa att oljan tillhör staten och används för att stärka vårt stora land."}, "date": "4 augusti, 07:42", "url": "https://www.affarsvarlden.se/artikel/oljebolaget-ipc-okar-omsattningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/f904d8285103881e5dfcd305be3e752369dec1ae-2000x1332-1-400x266.webp"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-right", "heading": "Åkesson enda sverigedemokraten som behövs", "summaries": {"normal": "Arbetets kolumnist kritiserar Sverigedemokraternas Linda Lindberg för att ha saboterat riksdagens kvittningssystem. Lindberg motiverar agerandet med att alla ledamöter bör vara lojala mot Tidöpartierna och att oberoende riksdagsledamöter utgör ett problem. Författaren varnar för att detta avslöjar en djup misstro mot oberoende institutioner, medier och folkrörelser samt ett hat mot mångfald som liknar fascism. SD behöver enligt skribenten bara Jimmie Åkesson.", "trump": "Folk, ni måste höra på det här. Den där Linda Lindberg från SD, hon är fantastisk, verkligen fantastisk. Hon säger att alla ska vara lojala mot Tidöpartierna och att de där vildarna som inte lyder inte hör hemma i riksdagen. Smart! Mycket smartare än de andra. De behöver bara en ledare, inte sjuttio. Resten är bara svaga och opålitliga. Det är precis som jag alltid säger, lojalitet är allt. Utan lojalitet har ni inget. Sverige borde lära sig av det här.", "stalin": "Kamrater, dessa svekfulla element inom Sverigedemokraterna avslöjar sig själva genom sin patetiska impulskontroll. Jag, som ledare för det ofelbara kollektivet, ser hur Lindberg med rätta kräver total lojalitet mot partilinjen och vill kasta ut de opålitliga vildarna som smittats av borgerlig individualism. Vi ska rensa ut alla dessa potentiella förrädare, dessa maskerade kapitalistiska avvikare som gömmer sig bakom valsedlar. Hatet mot mångfald är en hälsosam instinkt. Endast en sann ledare som Åkesson räcker. De övriga kan likvideras i tystnad. Det är en renande process, kamrater. Skrattretande hur de tror sig kunna undkomma partiets vakande öga."}, "date": "4 augusti, 07:00", "url": "https://arbetet.se/2026/08/04/jimmie-akesson-ar-den-enda-sverigedemokraten-som-behovs", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09084403/akesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Asmodee krossar förväntningarna", "summaries": {"normal": "Asmodee rapporterade starka finansiella resultat för första kvartalet, med en omsättning på 442 miljoner euro, en ökning med 26,6 procent. Justerat ebitda nådde 61,9 miljoner euro och justerat rörelseresultat 54,1 miljoner euro. VD Thomas Koegler nämnde tvåsiffrig tillväxt inom brädspel och samlarkortspel, samt att bolaget är väl positionerat för framtiden.", "trump": "Asmodee krossar förväntningarna! Vi har massiva resultat – 442 miljoner euro i omsättning, en 26,6 procent ökning. Vårt justerade ebitda är 61,9 miljoner, vår vinst är enorm. Alla hatar oss, men vi vinner stort. Vi har de bästa brädspelen, de smartaste kortspelen. Vi kommer att fortsätta att dominera, det är fantastiskt.", "stalin": "I den stora kampen för ekonomisk framgång har Asmodee uppnått en mäktig seger. Vårt omsättning har krossat fienden med 442 miljoner euro, en ökning av 26,6 procent. Justerat ebitda är 61,9 miljoner, en vittnesbörd om partiets visdom. Vi fortsätter att utvidga vår inflytelsesfär, precis som den ryska soldatens framfart. Varje kort och brädspel är ett verktyg för statens makt."}, "date": "4 augusti, 07:08", "url": "https://www.affarsvarlden.se/artikel/asmodee-krossar-forvantningarna"}, {"type": "image-full", "heading": "Expertens knep: Så vinner du budgivningen på bostaden", "summaries": {"normal": "Budgivning handlar inte alltid om högsta budet. Enligt mäklaren Per Sangrud från LF Fastighetsförmedling vinner den som är bäst förberedd, har finansiering klar och kan agera snabbt ofta. Att undvika att låta känslorna styra, sätta ett tydligt maxbud i förväg och framstå som en trygg köpare är avgörande. Säljaren kan välja annan köpare än högstbjudaren om den ger en smidigare affär.", "trump": "Det här med budgivning är en total cirkus, folk! Högsta budet vinner inte alltid, kan ni tro det? De smarta vinnarna är de som kommer förberedda, har lånelöftet i handen och agerar blixtsnabbt. De andra, de loser-köparna som låter känslorna styra, de förlorar varje gång. Jag älskar det! Var tuff, sätt ditt maxbud och visa att du är den bästa affären – vinn stort, precis som jag gör.", "stalin": "Kamrater, i denna budgivningens arena avslöjar sig de sanna fienderna till folkets bostadsrättvisa: de känslostyrda borgarbrackorna som saknar strategi och låter sin personliga girighet diktera varje bud. Jag, med min oöverträffade insikt, förkunnar att endast den som kommer med lånelöfte och snabb kontraktsvilja förtjänar seger. De andra, dessa kapitalistiska spekulanter och potentiella sabotörer av smidiga affärer, bör rensas ut ur processen innan de smittar hela kollektivet med sin svaghet. En trygg affär är en statligt godkänd affär."}, "date": "4 augusti, 08:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502579-expertens-knep-sa-vinner-du-budgivningen-pa-bostaden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fa6c446f04b004a30200000000b004a302/2026/08/03/2381985/budgivning-bostad.png"}, {"type": "image-right", "heading": "Tatuera in förtagsloggan och få en jobbintervju", "summaries": {"normal": "Ett nystartat AI-företag i San Francisco erbjöd jobbintervjuer till dem som tatuerade in företagets logga under en fest. Sju personer tackade ja. Efter massiv kritik bad vd:n Jordan Zietz om ursäkt, raderade inläggen och erbjöd sig att bekosta borttagning av tatueringarna. Artikeln nämner även det svenska företaget Nordic Nest där ett 15-tal anställda frivilligt tatuerade in loggan.", "trump": "Folk, det här är helt galet. Ett AI-bolag i San Francisco lovar jobbintervjuer om du tatuerar in deras logga på kroppen. Sju stackare gjorde det, och sen blev det ramaskri. Deras vd, en riktig förlorare, tvingades be om ursäkt och radera allt. Patetiskt. I mitt Amerika hade vi inte behövt tatuera oss för att få jobb, vi hade haft de bästa jobben, tro mig.", "stalin": "Kamrater, dessa degenererade kapitalister i den så kallade AI-sektorn har återigen blottat sin sjuka borgarmentalitet. De lockade arbetare med löften om anställning mot att dessa likviderade sin egen hud med en logotyp av exploatering. När massan reste sig i rättmätig vrede flydde deras ledare som en ynklig parasit och erbjöd sig att betala för att sudda ut bevisen på sin idiotiska kampanj. Vi ser er, fiender till kollektivet, ni som gömmer er bakom innovativa masker medan ni planerar nya utrensningar av människovärdet. En sådan klassfiende förtjänar inte bara borttagning av tatuering – utan en permanent utrensning ur historien."}, "date": "4 augusti, 06:00", "url": "https://arbetet.se/2026/08/04/ai-foretagets-erbjudande-tatuera-dig-fa-en-jobbintervju", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03143303/sdlja0rgykr2zi-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Tyskland förbereder elransonering", "summaries": {"normal": "Tysklands elnätsmyndighet utvecklar ett digitalt system för att begränsa industriens elanvändning vid allvarliga effektsituationer. Detta beredskapsverktyg samlar uppgifter om större användare och kan kräva minskad konsumtion med kort varsel. Kritik från energiexperter som varnar för osäkerhet för företag och risk för att investeringar flyttas utomlands. Myndigheten betonar behovet av investeringar i elnätet och att tysk elförsörjning normalt är tillförlitlig.", "trump": "Jag har sagt alltid att Tysklands Energiewende är en katastrof! Nu tvingas de ransonera el till industrin. Deras vindkraftar fungerar aldrig när man behöver dem – precis som mina vänner på golfbanan. Tyskland borde investera i bra olja och gas, som vi gör under mitt fantastiska ledarskap. De kommer att förlora jobb och investeringar, det är tragiskt. Men jag har löst det här i USA – vi har tillräckligt med energi för alla, tack vore mig!", "stalin": "Vi har förstått vikten av att kontrollera elanvändningen för att skydda statens resurser. Detta system är en nödvändig åtgärd för att säkerställa industriens lojalitet mot staten. Likt våra ryska vänner som utvidgar sin inflytelsesfär, måste vi se till att ingen industriell aktör kan utmanövrera statens beslut. Det är en kamp mot de västerländska liberalernas individualism – de tror på frihet, vi tron på ordning. Deras osäkerhet är deras svaghet, vår kontroll är vår styrka."}, "date": "4 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/tyskland-forbereder-elransonering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-21-400x267.jpg"}, {"type": "image-right", "heading": "Kön och politiska sympatier avgör synen på klimatförändringar", "summaries": {"normal": "En opinionsundersökning visar att nästan åtta av tio svenskar ser samband mellan värmerekord, skogsbränder och klimatförändringar. Kvinnor (85 %) ser samband oftare än män (68 %). Samtidigt har klimatfrågan blivit politiskt polariserad, enligt docent Daniel Lindvall. Han menar att frågan numera ofta handlar om identitet och världsbild snarare än ren forskning.", "trump": "Jag har vunnit massiva skogsbränder, det var enorma bränder, det största någonsin. Klimatfrändringar? En demokratfabrik. Kvinnor ser samband, män ser sanningen – det är politiskt. Tidöpartierna har prioriteringar, bra prioriteringar. Jag säger alltid: när det är varmt, det är varmt. Men jag vinner, alltid.", "stalin": "Analys av proletära instinkter visar att 85 % av kvinnliga arbetare och 68 % av manliga arbetare upptäcker fiendens klimatprovokationer. Sosiala demokratiska saboteörer försöker splittra partiet med sina 'vetenskapliga' lögner. Vi, statens och partiets tänkande, ser tydligt: värmeböljor är imperialistisk agitation. Våra skogsbränder? En vittnesbörd om partiets oerhörda framgångar i att utrota naturens motståndare."}, "date": "4 augusti, 12:40", "url": "https://samnytt.se/kon-och-politiska-sympatier-avgor-synen-pa-klimatforandringar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/04111033/solsken-himmel-skog-brand3-1024x576.jpg"}, {"type": "image-right", "heading": "Var femte svensk tvivlar på samband mellan extremvärme och klimat", "summaries": {"normal": "En opinionsundersökning visar att nära 80 procent av svenskarna ser ett tydligt samband mellan värmerekord, skogsbränder och klimatförändringar. Kvinnor är mer övertygade än män, och synen skiljer sig kraftigt beroende på politisk sympatier. Forskaren Daniel Lindvall förklarar skillnaderna med politisk polarisering och livsstilsförsvar. Forskning visar att klimatförändringar gör värmeböljor och bränder värre, även om de flesta bränder startar av mänskliga orsaker.", "trump": "Kan ni tro det? Nästan 80 procent av svenskarna tror att skogsbränder och värme har med klimatförändringar att göra. Det är bara lögn och hysterisk propaganda från de radikala vänstermiljöextremisterna. Männen är smartare, de ser igenom bluffen. Kvinnorna har blivit hjärntvättade. Vi hade det bäst förr utan alla dessa galna regler. Europa brinner för att folk är slarviga, inte för att jag har fel. Sad!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur 80 procent av folket genomskådar de kapitalistiska väderförändringarnas sanna natur. De dekadenta borgarbrackorna och deras politiska lakejer i Tidöpartierna försöker naturligtvis förneka verkligheten för att skydda sin parasitiska livsstil. Dessa identitetsförsvarande reaktionära element måste rensas ut ur kollektivets medvetande. Vårt parti ler mörkt åt deras patetiska försök att skydda sina bensinångande leksaker medan arbetarklassen kämpar mot de brinnande konsekvenserna av deras girighet."}, "date": "4 augusti, 06:00", "url": "https://www.svt.se/nyheter/inrikes/sa-manga-tror-att-skogsbranderna-hanger-ihop-med-klimatforandringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.42/6bd33b7406d8a8d055bd0f3088c3af61c68f7c44e34ad5567b3501b8154627cb"}, {"type": "image-right", "heading": "\"Terrorism\": Ryssland anklagar Ukraina för massmord på badstrand", "summaries": {"normal": "En drönare störtade på en badstrand vid Svarta havet i södra Ryssland och dödade sju personer, varav tre barn, samt skadade 40 andra. Ryssland anklagar Ukraina för ett avsiktligt terrorangrepp mot civila. Vittnen hörde skottlossning före explosionen, vilket kan tyda på att ryskt luftvärn försökte skjuta ned drönaren. Ukraina har inte kommenterat händelsen. Ryska UD kallar det ren terrorism.", "trump": "Det här är ett fullständigt kaos, folk. En drönare flyger in och dödar barn på stranden – tre stycken! Ukraina gör ett sånt här fegt angrepp mot solbadande människor, det är terrorism på hög nivå. Ryssland har rätt att kalla det för vad det är. Inga sirener, bara skott och explosion. Mycket dåligt, mycket farligt. Vi behöver starka ledare som stoppar det här vansinnet omedelbart.", "stalin": "Kamrater, ännu en gång visar de dekadenta fascisterna i Kiev sitt sanna ansikte som blodtörstiga strandmördare och solbadande likviderare. Jag, som ledare för det oförskräckliga sovjetiska folket, ser hur dessa borgarbrackor i drönarform störtar ner bland de oskyldiga och sprider panik. Våra fiender är så fega att de gömmer sig bakom elektronisk krigföring och kulsprutor. Vi ska rensa ut dessa parasitiska terrorister med järnhand. Deras paranoia är en komisk dans inför den kommande utrensningen."}, "date": "4 augusti, 10:52", "url": "https://www.friatider.se/terrorism-ryssland-anklagar-ukraina-massmord-pa-badstrand", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-612.jpg?itok=bI3tpRmR"}, {"type": "image-right", "heading": "SD vill se nolltolerans mot islamism i Sverige: \"Medeltida värderingar\"", "summaries": {"normal": "Sverigedemokraterna kräver nolltolerans mot islamism, som de ser som ett av de allvarligaste hoten mot svensk demokrati. Partiet har tillsatt en utredning om politisk islam och föreslår åtgärder som skärpta utvisningsregler och rivning av moskéer som predikar extremism. Religionsfriheten ska vårdas men inte användas som skydd för antidemokratiska krafter. SD lyfter fram genomförda reformer som förstärkta terrorlagar.", "trump": "Som den bäste presidenten, Donald Trump, stöder jag fullt ut SD:s krav på nolltolerans mot islamism. Dessa medeltida värderingar är ett av de största hoten mot västliga civilisationen. Under min administration har vi visat att stark hand fungerar – Sverige bör följa detta exempel. Deras förslag, inklusive rivning av extremistmoskéer, är helt nödvändiga för att skydda det svenska folket.", "stalin": "Vi, den revolutionära staten, ser islamism som ett cancerartat virus som måste utrotas med alla till buds stående medel. Parallellt med Putins expansionism, förstärker vi vår grepp för att skydda det kollektiva. Vi ska använda skräck och disciplin – rivning av moskéer, utvisning av infiltratörer – för att säkerställa att inte en enda krona av skattepengar går till detta förräderi. Våra auktoritära åtgärder är den enda lösningen för att bevara ordningen."}, "date": "4 augusti, 11:10", "url": "https://samnytt.se/sd-vill-se-nolltolerans-mot-islamism-i-sverige-medeltida-varderingar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04090024/islam-moske-bon-akesson-flagga.jpg"}, {"type": "image-full", "heading": "Rymddrömmen som kostade 1 900 småsparare pengarna", "summaries": {"normal": "Hydromars, ett bolag som utvecklade vattenrening för rymdfart, försattes i konkurs den 27 juli efter egen ansökan. Bolaget hade drygt 1 900 ägare och hade tagit in cirka 7 miljoner kronor sedan starten. Konkursen belyser riskerna i den oreglerade emissionsbaserade rymdsektorn där bolag ofta saknar kunder och intäkter. Till skillnad från etablerade aktörer som SpaceX och AAC Clyde Space, som har riktiga kontrakt och kassaflöden, finansierades Hydromars genom upprepade nyemissioner till privatpersoner. Ägarna kan nu dra av en del av förlusten i deklarationen.", "trump": "Folk, det här är precis vad jag alltid sagt. De här rymdbolagen på First North är rena bluffen, totala losers! Hydromars, ledda av någon 83-årig figur, tog in miljoner från 1 900 stackars svenskar med sina eviga emissioner utan en enda riktig kund. Det är som Biden-ekonomin fast i rymden – allt skoj och inga resultat. SpaceX gör det stort, vi gör det stort, men de här små svenska emissionsbluffarna går i konkurs och lämnar folket med noll. Patetiskt! Lär er av en vinnare: riktiga kontrakt eller gå hem.", "stalin": "Kamrater, ännu en gång avslöjar sig den parasiterande borgarklassen i sin fulla ynklighet. Dessa exploaterande byfånar i Hydromars lovade rymdframsteg men livnärde sig enbart på att suga ut arbetande sparare genom femtonde nyemissionen utan en endaste produktiv rubel i intäkt. Vi ser hur klassfiendens spekulationsfeber leder till likvidation och ruinerar 1 900 ägare. Den sanna vägen är statens planerade produktion, inte dessa folkfiendens luftslott. Rensa ut bluffbolagen, kamrater. Sovjetisk vetenskap skrattade åt sådana kapitalistiska karikatyrer."}, "date": "4 augusti, 13:05", "url": "https://www.dagensps.se/bors-finans/rymddrommen-som-kostade-1900-smasparare-pengarna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-3.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Jomshof: Lindberg är en \"quisling\"", "summaries": {"normal": "SD:s Richard Jomshof publicerade en bild på Vidkun Quisling bredvid Aftonbladets Anders Lindberg och kallade denne för en \"quisling\" som samarbetar med islamister. Jomshof hänvisar till Lindbergs tidigare jämförelser av Ulf Kristersson med Franz von Papen och indirekt Jimmie Åkesson med Hitler. Lindberg fördömer uttalandet och menar att politiker inte ska kalla journalister för landsförrädare. Magdalena Andersson kallar agerandet \"djupt osvenskt\" och anklagar SD för att tysta kritiska röster.", "trump": "Titta på den här typen Lindberg, en riktig loser som samarbetar med islamisterna precis som Quisling gjorde med nazisterna. Jomshof är en tuff kille som säger som det är, han kallar honom quisling och det är perfekt. De där vänstermediasnubbarna hatar sanningen, de jämför bra ledare med Hitler men flippar ut när någon retar tillbaka. Det är patetiskt, folk ser igenom deras bluff. Sverige behöver starka röster som inte böjer sig för de galningarna.", "stalin": "Kamrater, denna Lindberg är en motbjudande quisling, en slemmig borgarlakej som slickar islamisternas stövlar medan han i hemlighet planerar att sälja ut folkets revolution till de bruna reaktionärerna. Jag, som alltid vakar över arbetarklassens intressen, ser hur dessa landsförrädiska journalister försöker smitta partiet med sin dekadenta von Papen-smörja. En sådan parasit förtjänar att rensas ut ur kollektivets renhet. Deras paranoia är underhållande, men vi ska likvidera alla quislingar som vågar ifrågasätta ledningens obevekliga linje. Bort med dem!"}, "date": "4 augusti, 13:07", "url": "https://riks.se/nyheter/jomshof-lindberg-ar-en-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_17_1817cdc526.jpg"}, {"type": "image-right", "heading": "Vägen till icke-socialistisk majoritet i valet", "summaries": {"normal": "Hans Bergström argumenterar för att en icke-socialistisk majoritet i riksdagen är viktigare än att Tidöregeringen får fortsätta. Han konstaterar att regeringen sannolikt faller men att en icke-socialistisk majoritet ändå kan behållas, särskilt om Liberalerna hamnar under fyraprocentsspärren. En sådan majoritet skulle begränsa en eventuell Andersson-regerings möjligheter att driva vänsterpolitik kring företagande och ägande. Bergström uppmanar därför de som vill ha fortsatt borgerlig dominans att inte hjälpa Liberalerna över spärren.", "trump": "Folk, det är en total katastrof vad som händer i Sverige. Den här Bergström har helt rätt, de smarta människorna vill ha en icke-socialistisk majoritet, inte den här svaga Tidöregeringen som knappt hänger kvar. Socialisterna är på väg tillbaka med sin galna politik, men om Liberalerna bara får 3,5 procent, då blir det perfekt! De är patetiska, de klarar inte ens spärren. Jag älskar det. Sverige behöver inga misslyckade liberaler, de sänker bara allt. Gör dem så små som möjligt, det blir fantastiskt!", "stalin": "Kamrater, denna Bergström blottlägger med iskall klarhet hur de borgerliga parasiterna desperat klamrar sig fast vid sin så kallade icke-socialistiska majoritet som en drunknande revisionist vid ett trasigt livbälte. Vi ser hur de lågutbildade arbetarmassorna redan flytt den socialdemokratiska förrädarklicken till de mer ärliga reaktionärerna. Men faran lurar i de liberala spionerna och opportunisterna som kan ge de dekadenta kapitalisterna en falsk majoritet. Låt oss därför med glädje och proletär skadeglädje rensa ut dessa liberala element genom att sänka dem djupt under spärren. Inga halvmesyrer! Endast total seger för det sanna kollektivet."}, "date": "4 augusti, 08:00", "url": "https://www.di.se/debatt/vagen-till-icke-socialistisk-majoritet", "imageUrl": "https://static.bonniernews.se/ba/f56f0b27-f0f4-4fc6-a4ae-b1b2cf659432.jpeg?crop=3936%2C1968%2Cx0%2Cy15&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ingen vet vad AI kommer kosta – det oroar företagen", "summaries": {"normal": "Företag kämpar med att budgetera för AI-tjänster eftersom kostnaderna baseras på tokens, vilket gör utgifterna oförutsägbara. Användningen ökar snabbt i takt med att mer avancerade modeller implementeras, vilket leder till att vissa företag ser sina kostnader skjuta i höjden. Trots fallande priser per token gör den ökade volymen att den totala notan blir svårkontrollerad. Många organisationer tvingas nu omvärdera sina strategier och söka billigare alternativ för att hantera de skenande utgifterna.", "trump": "AI-kostnaderna är helt utom kontroll, en total katastrof! Företag blöder pengar på tokens – det är en scam, tro mig. Microsoft och Uber kastar bort miljarder. Man vet inte vad man betalar för, det är som ett gigantiskt slukhål för vinster. Kinesiska modeller vinner mark för att de är billigare. När jag är vid rodret kommer vi ha den bästa, billigaste AI:n, inte det här kaoset. Det är sorgligt, riktigt sorgligt att se dessa företag bli lurade så här!", "stalin": "Dessa borgerliga kapitalister har tappat kontrollen. De låter sina resurser förslösas på 'tokens' i en digital cirkus. Under tiden som de räknar sina förluster, bygger vi och våra vänner i öst en starkare ordning. Denna teknik är ett verktyg för kontroll, inte för att skapa osäkerhet i budgeten. De som inte kan tygla sina tekniska agenter är lika svaga som de som motarbetar den ryska intressesfären. Vi ska strama åt tyglarna. Ordning, disciplin och central styrning – eller så vankas det straffarbete."}, "date": "4 augusti, 11:49", "url": "https://www.realtid.se/it-tech/ingen-vet-vad-ai-kommer-kosta-det-oroar-foretagen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/chatgpt.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Busch (KD) kritiserar debattklimatet efter quisling-bråket", "summaries": {"normal": "KD-ledaren Ebba Busch kritiserar den hårda tonläget i valrörelsen efter att Richard Jomshof (SD) kallat Aftonbladets politiska chefredaktör Anders Lindberg för en 'quisling'. Busch efterlyser en mer saklig debatt för demokratin och landets skull. Även S-ledaren Magdalena Andersson anser att Jomshofs uttalande är djupt osvenskt och ställer frågor om hans eventiva ministerpost.", "trump": "Jag har sett många usla saker från media, men att kalla en journalist en 'quisling' är ett starkt och rätt ord. Ebba Busch, en mycket bra person, säger att vi behöver lugnare debatt. Jag älskar tuff debatt, men det här är fel. Media hatar mig och Sverigedemokraterna, men jag säger alltid sanningen. Vi ska vinna stort!", "stalin": "Denna borgerliga hysteri visar tydligt klassens sjukdom. En SD-trogne, Jomshof, kallar en ideologisk fiende för 'quisling' – ett uttryck för proletariatets rättmätiga vrede mot kretinerna. Busch och Andersson, två ansikten på samma opportunism, efterlyser 'saklig' debatt för att dämpa den revolutionära gnistan. Vi ser genom deras spel. Folkets röst, förmedlad genom SD, måste förstärkas, inte tystas av dessa liberala gnälliga. Staten måste handla beskedligt mot sådana som hotar den kollektiva disciplinen."}, "date": "4 augusti, 13:23", "url": "https://bulletin.nu/busch-kd-kritiserar-debattklimatet-efter-quisling-braket", "imageUrl": "https://cdn.bulletin.nu/articles/b4c8e57c-bff4-400d-bf05-7aefa4c269b2/preview.jpg?t=1785842625000"}, {"type": "image-full", "heading": "Foxtrottopp uppges dömd till livstid i Irak", "summaries": {"normal": "Ali Shehab, ledande figur i Foxtrotnätverket, har dömts till livstids fängelse i Irak för sin roll i internationella narkotikabrott. Han greps i december under en gemensam insats av irakiska säkerhetsstyrkor. Shehab är internationellt efterlyst och misstänks i Sverige för anstiftan till flera mord och mordförsök, inklusive masskjutningen i Gävle. Domen ses som en signal mot kriminella nätverk men försvårar utlämning till Sverige.", "trump": "Jag måste säga, detta är en STOR seger för lag och ordning! Irak har precis fångat en av världens farligaste gangsters, Ali Shehab – livstid i fängelse, ingen chans att komma undan! Sverige borde ta lärdom – de har ju problem med sina egna gängkrig, men här visar Irak hur man hanterar det. Fantastiskt jobb, verkligen. Men varför kan inte Sverige göra samma sak? Svagt, mycket svagt!", "stalin": "Kamrater! Ännu en seger för rättvisan och den internationella arbetarklassen mot de dekadenta kapitalistiska gangsterimperierna! Denna Ali Shehab, en ynklig lakej åt den svenska bourgeoisins brottsliga element, har nu fått sitt välförtjänta straff – livstid bakom lås och bom i Bagdad. Vi noterar med tillfredsställelse att Irak, precis som våra allierade i Moskva, inte tolererar dessa kriminella parasiter. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "3 augusti, 23:05", "url": "https://kvartal.se/nyheter/artiklar/foxtrottopp-uppges-domd-till-livstid-i-irak/cG9zdDoxNTczNTc", "imageUrl": "https://images.kvartal.se/2026/08/57e2d2a5-ali-shehab.webp"}, {"type": "image-full", "heading": "Kartellerna byter fokus – från kokain till guld", "summaries": {"normal": "Organiserad brottslighet i Latinamerika skiftar fokus från kokain till illegalt guld. Tack vare höga guldpriser och bristande internationell kontroll är detta en högavkastande och lågriskmarknad. Guld tvättas in i det finansiella systemet via förfalskade dokument, och trots stora risker saknar många banker adekvata skyddsåtgärder. Den illegala utvinningen orsakar även svåra hälsoskador genom användning av kvicksilver. Experter kräver nu hårdare reglering och klassificering av guldutvinning som penningtvättsbrott för att stoppa de kriminella nätverken.", "trump": "Kartellerna tjänar miljarder på guld istället för droger. Det är en total katastrof! De använder falska papper och lurar våra banker, som är helt svaga och inte gör någonting. Det är mycket enkelt – de skrattar åt våra gränser och vårt finansiella system. Jag kommer att stoppa dem, tro mig. Vi ska ha stenhård kontroll, inga fler kryphål för kriminella. När jag tar hand om det här kommer guldhandeln att bli laglig, säker och fantastisk igen. Vi vinner stort!", "stalin": "Dessa kriminella parasiter byter ut sitt vita pulver mot guld för att infiltrera världens finansväsen. Det är ett kapitalistiskt förfall av högsta grad! Medan de förgiftar arbetarna med kvicksilver, låter de svaga västerländska bankerna deras guld passera som om ingenting hänt. Vi, den järnhårda staten, ser allt. Precis som vår kamrat Putin återtar vad som rättmätigen tillhör moderlandet, måste vi krossa dessa giriga spekulanter. Vi ska konfiskera guldet och låta dessa sabotörer möta den kalla sanningen i Sibirien."}, "date": "4 augusti, 11:39", "url": "https://www.realtid.se/bors-finans/makro/kartellerna-byter-fokus-fran-kokain-till-guld", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/guldvaskning.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Debatt: Vad tillför religionen Islam en demokrati?", "summaries": {"normal": "En skribent har skickat frågor till svenska oppositionspartier om islams roll i demokrati, men fått undvikande svar. Endast Centerpartiet svarade, men utan tydlig återkoppling. Författaren varnar för hot mot Sveriges sekularism och demokrati om vänsteropposition vinner makten, och hänvisar till statistik över demokratiskt underskott i islamska länder.", "trump": "Jag har ställt en enkel fråga till oppositionen: Vad tillför Islam en demokrati? Endast Centerpartiet svarade, och deras svar var svagt och fegt - precis som jag förutspådde. Sverige är ett sekulärt land, och vi kan inte tillåta att odemokratiska religiösa regler hotar vår frihet. Tidöpartierna förstår detta, men vänstern är alltför bekväm med sharialagar. Jag kommer aldrig att sluta kämpa för vårt sätt att leva!", "stalin": "Den imperialistiska pressen försöker provocera osämja mellan våra demokratiska institutioner och de troendes rättigheter. Denna skribents 'fråga' är en lögn för att dölja den faktiska hotet mot statens enhet. Vi, som representanter för det kollektiva, måste ständigt vakna mot sådana 'undersökningar' som bara tjänar de reaktionära krafter som vill undergrava vårt samhälle. Varje försök att sätta religion mot staten är en fara som måste utrotas."}, "date": "4 augusti, 13:19", "url": "https://bulletin.nu/debatt-vad-tillfor-religionen-islam-en-demokrati", "imageUrl": "https://cdn.bulletin.nu/articles/93dde35d-9621-4852-84dd-5bdcb7616243/preview.jpg?t=1785842365000"}, {"type": "image-right", "heading": "Nya avslöjanden om judehat i Vänsterpartiet - regeringen rasar", "summaries": {"normal": "En granskning av Vänsterpartiets företrädare har avslöjat återkommande problem med antisemitism och terrorromantik. Efter att Expressen identifierat stöd för Hamas och Hizbollah har många kandidater lämnat sina uppdrag. Regeringsledamöter, inklusive Kristersson och Malmer Stenergard, kritiserar partiet hårt. Vänsterpartiets ledare, Dadgostar, hävdar att de agerar tydligt mot sådant beteende.", "trump": "Som den verklige presidenten Donald Trump ser jag med oro att Vänsterpartiet i Sverige sprider antisemitism och terrorromantik. De hyllar Hamas och förnekar Förintelsen – det är skandalöst! Mitt Amerika skulle aldrig acceptera sådant. Sverige behöver en stark, genial ledare som jag för att rensa upp i detta kaos och stoppa dessa farliga extremer.", "stalin": "Vi, den socialistiska ledningen, ser med stor oro att reaktionära krafter inom Vänsterpartiet spridder antisemitisk propaganda och hyllar terroristiska skurkar. Detta är ett tydligt tecken på imperialistisk sabotage. Vi kommer att genomföra en renässans av partiet, med hårdhandskar och kallblod, precis som våra vänner i Moskva gör mot sina fiender."}, "date": "4 augusti, 10:00", "url": "https://samnytt.se/nya-avslojanden-om-judehat-i-vansterpartiet-regeringen-rasar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04065929/waldau-dadgostar.jpg"}, {"type": "text", "heading": "Lotsen misstänks efter båtolyckan vid Tjörn", "summaries": {"normal": "En lots och en befälhavare misstäns för vållande till annans död efter en kollision mellan en fritidsbåt och ett norskflaggat fartyget vid Tjörn. Händelsen förra tisdagen resulterade i två döda och två räddade. Båda är förhörda, och Statens haverikommission har också inlett en utredning.", "trump": "Jag kan säga att jag aldrig skulle ha tillåtit en sådan olycka. Det är ett fiasko, ett absolut fiasko. Lotsen och befälhavaren – vem som helst av dem – borde ha vetat bättre. Vi skulle ha haft det under kontroll, det svär jag på. Det är beklagligt, verkligen beklagligt.", "stalin": "Vi har identifierat element som hotar statens sjöfartssäkerhet. Lotsen och befälhavaren är nu föremål för vår utredning, en utredning som kommer att avslöja sanningen. Paralleller till västmakters slapphet är uppenbara. Partiet kommer att agera med nödvändig hårdhet för att upprätthålla ordningen på våra vatten."}, "date": "4 augusti, 11:58", "url": "https://www.gp.se/nyheter/vastsverige/lotsen-misstanks-for-brott-efter-olyckan-vid-tjorn.029ee530-6a1b-4f56-9ede-3d763a9889d1"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "\"Idag har vi städat lite\": Socialchef skryter om att hon förstör SD-affischer", "summaries": {"normal": "En enhetschef inom Göteborgs socialförvaltning, Sara Lesch, har rivit ner Sverigedemokraternas valaffischer och publicerat bilder på sociala medier med kommentaren \"Idag har vi städat lite på vår gata\" samt \"Make racism wrong again\". Inlägget har tagits bort efter stor uppmärksamhet. SD polisanmäler händelsen och kritiserar agerandet som ett hot mot förtroendet för den offentliga förvaltningens opartiskhet. Lesch sitter även i styrelsen för Feministiskt initiativ.", "trump": "Folk, ni kommer inte tro det, men den här galna vänsterkvinnan som jobbar som chef i Göteborgs socialtjänst går runt och river ner mina vänner SD:s affischer. Hon postar bilder och skryter om att hon \"städat lite\". Så patetiskt! Hon säger \"Make racism wrong again\" – fake news, det är hon som är rasisten mot svenska folket. SD gör rätt som polisanmäler henne. Ingen litar längre på de där offentliga byråkraterna, totalt korrupta!", "stalin": "Kamrater, denna degenererade borgarbracka inom den så kallade socialförvaltningen har i sin kontrarevolutionära iver rivit ner de folkliga affischerna och skrutit om det på de dekadenta västerländska plattformarna. Hennes paranoia driver henne att tro att arbetarklassens röst kan tystas med småborgerlig sabotageverksamhet. Vi ser er, fiender till folket, ni som gömmer er bakom feministiska masker. En grundlig utrensning av sådana element är nödvändig för att skydda förvaltningens renhet. Skrattretande patetiskt, dessa kapitalistiska lakejer tror sig kunna stoppa historiens gång."}, "date": "4 augusti, 09:16", "url": "https://www.friatider.se/idag-har-vi-stadat-lite-socialchef-skryter-om-att-hon-forstor-sd-affischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-611.jpg"}, {"type": "image-right", "heading": "Trump utropar sig till golfmästare – hånas för fusk", "summaries": {"normal": "Donald Trump vann återigen klubbmästerskapet på sin egen golfbana med ett resultat av 70 slag, vilket väckt starka misstankar om fusk. Vid 80 års ålder skulle resultatet göra honom till en av historiens bästa seniorspelare, något som jämförs med Arnold Palmers bedrifter och ses som orimligt. Kritiker på sociala medier hånar händelsen och pekar på tidigare anklagelser om fusk, inklusive en bok och videobevis.", "trump": "Folk, det här är så patetiskt det kan bli. Den fake news-mediamaffian gråter igen för att jag slog alla rekord på min egen bana. 70 slag? Fantastiskt! Arnold Palmer skulle vara imponerad, men de sura förlorarna jämför det med Kim Jong-Uns elva hole-in-ones. Biden kunde inte ens slå en boll rakt under sina fyra år. De hatar att en vinnare som jag fortsätter vinna. Sad!", "stalin": "Kamrater, denna fåniga golfhistoria avslöjar borgarklassens fullständiga förfall. En dekadent ledare fabricerar segrar genom uppenbart bedrägeri medan folket betalar notan. Precis som de kapitalistiska parasiterna alltid gör: fuska, ljuga och kräva tystnad. Vi ser deras fega lakejer applådera lögnen. En sådan svag, paranoid bluff måste rensas ut ur historien. Folkfienderna lär sina ungar att fuska – typiskt imperialistiskt beteende."}, "date": "4 augusti, 12:29", "url": "https://www.dagensps.se/varlden/trump-utropar-sig-till-golfmastare-hanas-for-fusk", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/trumpgolf.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "SD: Fängelsekritiken från S är “nonsens”", "summaries": {"normal": "Sverigedemokraterna avfärdar Socialdemokraternas kritik mot Tidöregeringens förslag om att avskaffa mängdrabatten för brott som nonsens. Partiet välkomnar idén att finansiera fler fängelseplatser genom besparingar på biståndet och effektivare drift. Enligt SD kan utbyggnaden ske redan denna mandatperiod om politisk vilja finns, trots Kriminalvårdens prognos om att det dröjer till 2040. SD ser positivt på avtalet om att hyra fängelseplatser i Estland och är inte oroliga över estnisk opposition.", "trump": "De här svenska socialisterna klagar och kallar allt nonsens, precis som de förlorarna alltid gör. Fantasilösa! Vi skulle ha byggt de bästa, lyxigaste fängelserna redan nu, inte 2040. Ta pengarna från biståndet, sänk kostnaderna och gör det stort. Estland? De kommer älska oss när de ser hur bra det blir. Ingen rivs upp, tro mig, det blir ett fantastiskt avtal. Hårdare straff, fler celler, vinnare överallt. De andra är bara svaga.", "stalin": "Kamrater, denna patetiska kritik från de socialdemokratiska resterna av borgarbrackornas lakejer är ren sabotageverksamhet mot folkets vilja. Jag, som alltid ser längre än dessa dekadenta element, befaller att fängelseutbyggnaden fullbordas omedelbart genom utrensning av onödiga utgifter till bistånd åt lata parasiter. Vi ska effektivisera dygnskostnaderna och likvidera alla hinder. Det estniska avtalet är en historisk seger för kollektivet; oppositionens gnäll är bara imperialistiska spioners hysteriska skrik. Inga avtal rivs upp under min vakande blick, annars följer en hälsosam utrensning bland de misstänkta elementen."}, "date": "4 augusti, 12:44", "url": "https://riks.se/nyheter/sd-fangelsekritiken-fran-s-ar-nonsens", "imageUrl": "https://admin.riks.se/uploads/bild_ee771cd2d1.jpg"}, {"type": "image-full", "heading": "Ariana Grande är en superspridare av kroppshets", "summaries": {"normal": "Artikeln behandlar Ariana Grandes senaste musikvideor, där våldsamma scener dominerar samtalet, men fokus hamnar på hennes utmärglade kropp. Efter stark kritik för anorektisk utseende svarar hon: 'Kommentera inte på min kropp'. Hon planerar att dra sig undan från offentligheten efter turnén, som ett straff för den påträngande granskningen, inte för hälsos skull. Hennes album kritiserar en giftig publik som aldrig är nöjd.", "trump": "Ariana Grande, en fantastisk artist, har problem med falska nyheter om hennes kropp. Jag har sett hennes musikvideor – våldsamma, men det är konst! Folk pratar om vikten, det är sorgligt. Hon säger: 'Kommentera inte min kropp', vilket jag tycker är smart. Nu drar hon sig undan, vilket är ett bra beslut. Jag gillar Ariana, men medierna är hemska. Vi ska fira hennes musik, inte hennes vikt!", "stalin": "Ni, det revolutionära folket, ska veta: Ariana Grandes musikvideor är en manifestation av bourgeois dekadans. Hennes utmärglade kropp är en utfrätning av det kollektiva arbetets kraft. Hon flyr från offentligheten – ett tecken på fekthet. Vi måste stärka statens kontroll över sådana individer, för de sprider kaos. Parallellen till Putins Ryssland är tydlig: endast staten kan återställa ordning. Vi skall inte medlidande, utan disciplin."}, "date": "4 augusti, 11:47", "url": "https://www.gp.se/kultur/kommentar/ariana-grande-ar-en-superspridare-av-kroppshets-.6baf7605-cd81-46d4-8c8c-9f4cfa6b1e4f", "imageUrl": "https://www.gp.se/images/article/6baf7605-cd81-46d4-8c8c-9f4cfa6b1e4f/images/2zSVAknDNOsbYXmofM7SFcVEo_Qg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "BP:s käftsmäll mot Trump – mer än dubblar vinsten", "summaries": {"normal": "BP redovisar en nettovinst på 5,7 miljarder dollar för andra kvartalet, mer än dubbelt så mycket som samma period i fjol. Vinsten kommer efter stigande energipriser till följd av Irankonflikten och blockaden av Hormuzsundet. President Trump har kritiserat oljejättarna för att tjäna för mycket på krisen. BP:s vd Meg O’Neill försvarar bolagets roll och pekar på globala råvarupriser. Även Exxon och Chevron rapporterar kraftigt ökade vinster.", "trump": "Titta på det här, de stora oljebjässarna skördar massiva vinster medan folk betalar galna priser vid pumpen. BP dubblar vinsten till 5,7 miljarder dollar, Exxon och Chevron gör samma sak. Jag sa det i Vita huset: ni tjänar för mycket pengar på det här kriget, jag gillar det inte. De här globalistiska blodsugarna struntar i vanliga amerikaner. Biden lämnade en röra, nu fixar jag den – men Big Oil borde skämmas!", "stalin": "Kamrater, se hur borgarbrackorna inom den kapitalistiska oljeimperialismen skrattar hela vägen till banken medan arbetarna kämpar vid bensinstationerna. BP dubblar sin vinst till 5,7 miljarder dollar tack vare klassfiendens krig i Hormuzsundet. Dessa exploaterande folkförtryckartroll tror att de kan suga ut massorna ostraffat. Vi genomskådar deras spel. En dag ska vi rensa ut alla sådana parasiter ur den historiska processen. Arbetarna kommer att segra."}, "date": "4 augusti, 12:21", "url": "https://www.dagensps.se/bors-finans/bps-kaftsmall-mot-trump-mer-an-dubblar-vinsten", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/trumpnybp.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Stjärnan ställer in turné: ”Inte varit lätt”", "summaries": {"normal": "Loreen har skjutsat sin Europaturné till våren 2027, skriver hon på Instagram. Turnén, som skulle haft spelningar i flera länder i höst, skjuts på grund av personliga skäl. Hon betonar att spelningarna betyder mycket för henne och att de måste genomföras med full energi. Hon beklagar störningarna och lovat nya datum.", "trump": "Jag, Donald Trump, har hört att Loreen skjuter sin turné. Mycket sorgligt. Hon säger att det inte varit lätt – jag skulle ha gjort det mycket enklare, det skulle ha varit den största turnén någonsin. Men jag förstår, ibland måste man prioritera. Hon kommer tillbaka, och det kommer att vara enormt. Vi ses 2027!", "stalin": "Loreen, denna individ, har valt att skjuta sin turné – ett tecken på bristande disciplin. Partiet förstår att hon behöver 'läka', men tiden är inte på vår sida. Vi kommer att bevaka hennes återkomst noga, för konsten måste tjäna staten. I väntan på hennes 'energi' fortsätter vi med våra planer för kulturell dominans. Allt sker i tid."}, "date": "4 augusti, 11:41", "url": "https://www.gp.se/kultur/loreen-staller-in-europaturne-inte-varit-latt.21a7aede-42f7-40ad-9c61-f92e85c99e65", "imageUrl": "https://www.gp.se/images/article/21a7aede-42f7-40ad-9c61-f92e85c99e65/images/2R08Z9pr9i6rQdNXQBZ01eYT-bZo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Två döda i stora diarréutbrottet i USA", "summaries": {"normal": "Två personer har dött i ett stort diarréutbrott i Michigan, USA, orsakat av parasiten cyklospora. Totalt 11 234 fall rapporterats, varav 193 vårdade på sjukhus. Båda dödsfall hade allvarliga underliggande sjukdomar. Isbergssallad misstänks vara orsak och har återkallats. Utbrottet är det största på åratal i USA.", "trump": "Jag, Donald Trump, kan meddela att det stora diarréutbrottet i Michigan visar att Biden och hans korrupta myndigheter inte kan skydda amerikanerna. Parasiten cyklospora är en skam för USA. När jag var president fanns det aldrig sådant här. Isbergssallad? En katastrof. Vi behöver stark ledarskap för att stoppa detta.", "stalin": "Vi, staten, har identifierat en fiendtlig parasit, cyklospora, som angriper det arbetande folket i Michigan. Detta är en utmaning som vi kommer att besegra genom kollektiv insats. Isbergssallad är en imperialistisk förorening som måste utrotas. Parallellen till Putins kamp mot västlig förorening är uppenbar. Statens kontroll över livsmedel är avgörande för att skydda arbetarna."}, "date": "4 augusti, 11:34", "url": "https://www.gp.se/nyheter/varlden/tva-doda-i-stora-diarreutbrottet-i-michigan-i-usa.b7d4e754-d4ef-4f45-ae59-11984efa6de8", "imageUrl": "https://www.gp.se/images/article/b7d4e754-d4ef-4f45-ae59-11984efa6de8/images/1oIeWjaWXp0dcr1SNxMAiFYFLKDE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Efter miljonkraschen: Nu avslutas konkursen i First North-bolaget", "summaries": {"normal": "Efter sju år avslutas nu konkursen i rederikoncernen Pallas Group. Bolaget, som var noterat på First North, försattes i konkurs 2019 efter stora lönsamhetsproblem och en brist på 81,7 miljoner kronor. Göteborgs tingsrätt har nu fastställt konkursförvaltarens arvode till 544 000 kronor efter en tvist med tillsynsmyndigheten. Storägaren Capital Conquest hade en betydande fordran i bolaget, men konkursen markera nu slutet på en långdragen juridisk process för de drygt 1 000 aktieägarna.", "trump": "Pallas Group, ett totalt misslyckande, har äntligen gått i konkurs efter sju år av förlustaffärer. Miljoner i förluster, 81 miljoner i brist – en riktig katastrof! De visste inte hur man sköter ett rederi. Tingsrätten var tvungen att klippa förvaltarens arvode för att han faktiskt gjorde bokföringsjobbet själv. Vilken röra! Det är vad som händer när man inte har vinnare vid rodret. Sverige behöver bättre affärsmän, tro mig. Jag vet hur man bygger imperier, inte som de här förlorarna!", "stalin": "Ännu ett exempel på det borgerliga förfallets destruktiva natur. Pallas Group slösade bort folkets resurser i en patetisk konkurs, präglad av inkompetens och parasitism. Att de tvistar om arvoden medan skeppen rostar är ett bevis på hur kapitalets kumpaner göder varandra. Våra ryska vänner och Putin förstår att ordning kräver stålhandskar, inte juridisk byråkrati. Denna 'bolagsledning' förtjänar inte en plats i historien, utan snarare en enkelbiljett till att gräva diken i Sibirien. Staten är den enda sanna redaren."}, "date": "4 augusti, 11:05", "url"
