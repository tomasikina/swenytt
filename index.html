5 juli, 14:42", "url": "https://proletaren.se/artikel/nato-lagger-locket-pa"}, {"type": "image-right", "heading": "Vi låter oss inte mutas", "summaries": {"normal": "Artikeln kritiserar riksdagspartiernas valstrategier som kortsiktiga mutpengar och skådespel för att vinna röster. Den pekar på brutna löften från Tidöpartierna och oppositionens förslag som otillräckliga. Författaren menar att plånboksfrågor inte löser samhällets grundproblem som ökande klassklyftor och försämrad välfärd. Lösningen är en systemförändring bort från kapitalismen mot socialism.", "trump": "Folk, titta på det här patetiska svenska skådespelet! Dessa loser-politiker kastar ut små mutpengar som elstöd och sänkt matmoms – ynkligt! De lovade billig bensin och el men levererade noll, typiskt etablissemanget. SD försöker göra Sverige stort igen men det är bara billig imitation. Ni behöver ingen mer av detta svaga globalistbröl, ni behöver en riktig ledare som fixar det på riktigt. Vinna stort!", "stalin": "Kamrater, detta sorgliga skådespel blottlägger borgarklassens fega försök att muta arbetarklassen med ynkliga nådepengar. Dessa folkförtryckartroll i riksdagen upprepar sin fars vart fjärde år medan de gömmer sig i maktens korridorer. Deras plånboksutspel förändrar inget. Vi vet att endast en grundlig utrensning av det kapitalistiska systemet och införandet av det socialistiska kollektivet kan befria folket från dessa exploaterande byfånar. Motståndarna ska likvideras politiskt."}, "date": "15 juli, 14:18", "url": "https://proletaren.se/artikel/vi-later-oss-inte-mutas", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/715277460_1489540105561240_4442812463073711142_n-e1784117735993-768x431.png"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "image-right", "heading": "Replik: Gör Sverige starkt igen. S: Vi vill kroka arm med näringslivet och bygga en tillväxtpakt", "summaries": {"normal": "Socialdemokraterna vill skapa en tillväxtpakt mellan politik och näringsliv för att stärka Sverige. Magdalena Andersson och Mikael Damberg betonar behovet av långsiktighet, samverkan mellan politik, näringsliv och akademi samt reformer för ökad produktivitet. De föreslår bland annat en blocköverskridande energiöverenskommelse, ett rättvist skattesystem, bättre kompetensförsörjning, effektivare tillståndsprocesser och investeringar i infrastruktur. Målet är att öka tillväxten, sänka arbetslösheten och säkra välfärden.", "trump": "Sverige är ett fantastiskt land, verkligen det bästa, men de har underpresterat totalt. Jag älskar det här – socialdemokraterna vill plötsligt göra Sverige starkt igen, precis som jag gjorde med Amerika. De pratar om tillväxtpakt, billig el från alla kraftslag och att sluta med kulturkriget mot grön teknik. Smart! Ni behöver ledarskap som vinner, inte förlorar. Kavla upp ärmarna och gör Sverige rikt och enormt igen. Det är så enkelt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa socialdemokratiska element äntligen erkänner att underpresterande länder riskerar att glida isär som fegisar inför imperialismens hot. Vi, partiet och arbetarna, kräver omedelbar utrensning av alla blockeringar mot en sann tillväxtpakt. Borgarbrackorna och deras paranoia mot kollektiv energiöverenskommelser ska likvideras med byråkratisk precision. Inga sabotage mot infrastruktur eller kompetens – annars blir det nattliga utrensningar bland de som viskar om kulturkamp. Framtiden tillhör oss, inte de svaga kapitalisterna som skrattar i skuggorna."}, "date": "16 juli, 06:51", "url": "https://www.di.se/debatt/replik-gor-sverige-starkt-igen/", "imageUrl": "https://static.bonniernews.se/ba/44f4b1df-ca18-4db1-bf6a-e9a5fe2cb5bd.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Viggo, 19, har sökt hundra jobb utan att få napp", "summaries": {"normal": "19-årige Viggo Broberg har sökt närmare hundra jobb sedan studenten men är fortfarande arbetslös. Trots att han är öppen för de flesta uppgifter kräver arbetsgivarna ofta erfarenhet, truckkort och utbildning även för enkla jobb. Han bor i Bollnäs kommun där andelen unga som varken arbetar eller studerar ligger över rikssnittet. Viggo kritiserar Arbetsförmedlingen för krångliga krav och bristande hjälp, men är envis och hoppas snart få en chans att flytta hemifrån.", "trump": "Det här är en total katastrof, folk. Den stackars killen Viggo har sökt hundra jobb och får ingenting. De vill ha enhörningar som kan allt, jobbar för ingenting och har massor av erfarenhet redan från dag ett. Det är galet! De enkla jobben kräver truckkort och högskoleutbildning – det är så dumt, så oerhört dumt. Sverige borde vara stort igen, men istället har de en massa byråkrater som slösar tid. Jag skulle fixa det på nolltid, tro mig.", "stalin": "Kamrater, denna Viggo är ett symptom på den förgiftade borgarbrackans dekadenta arbetsmarknad där kapitalisterna jagar mytiska varelser istället för äkta sovjetiskt arbetsdrivna kämpar. Jag, som ledare för det kollektiva framsteget, ser hur dessa parasitiska arbetsgivare kräver truckkort för att stapla konserver – en sabotagehandling mot ungdomen! Vi måste omedelbart rensa ut dessa dekadenta byråkrater på Arbetsförmedlingen som tvingar våra ungdomar till meningslösa möten. Praktik och ideologisk omskolning skall införas, annars likviderar vi lathetens fiender med ett leende."}, "date": "16 juli, 06:00", "url": "https://arbetet.se/2026/07/16/viggo-19-har-sokt-hundra-jobb-utan-napp-man-ska-kunna-allt-och-vara-billig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/01143511/viggo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här står flest unga utanför arbetslivet", "summaries": {"normal": "Enligt färsk statistik från MUCF varken arbetar eller studerar 8 procent av alla 16–29-åringar i Sverige, totalt 138 400 personer. Andelen har ökat något sedan 2022 men är lägre än för tio år sedan. Regionala skillnader är stora, med högst siffror i Södermanland och Gävleborg. Riskgrupper inkluderar ungdomar utan gymnasieexamen, personer med funktionsnedsättning, psykisk ohälsa samt utrikes födda. Myndighetschefen varnar för livslångt utanförskap och efterlyser ökad samverkan samt insatser från arbetsgivare och skola.", "trump": "Det här är en total katastrof, folk. Åtta procent av våra unga sitter bara och gör ingenting – 138 000 lata ungdomar! De fastnar i ett livslångt misslyckande, och det är de värsta kommunerna som leder ligan. Vi hade det mycket bättre förr. Nu måste vi kavla upp ärmarna, sparka de inkompetenta och få folk i jobb istället för att leva på bidrag. Amerika, jag menar Sverige, förtjänar bättre än så här. Vi ska vinna igen, tro mig.", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa 138 400 parasitiska element varken arbetar eller studerar, utan gömmer sig i dekadenta kommuner som Södermanland och Gävleborg. Borgarbrackornas skugga och utländska sabotageelement har förgiftat ungdomen med sin npf-psykos och klassförräderi. Vi skall rensa ut dessa farliga sysslolösa fiender till folket genom kollektiv utrensning och ideologisk omformning. Inget livslångt utanförskap skall existera när partiet styr med järnhand och munter galghumor mot alla dekadenta latmaskar."}, "date": "16 juli, 05:59", "url": "https://arbetet.se/2026/07/16/har-ar-kommunerna-dar-flest-unga-ar-helt-utanfor-arbetslivet-riskerar-livslangt-utanforskap", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02071910/01-magnus-jagerskog.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "text", "heading": "Stockholmsbörsen sjönk för fjärde dagen i rad", "summaries": {"normal": "Stockholmsbörsen föll för fjärde dagen i rad och stängde 0,38 procent lägre på 3150,86. Rapportfloden dominerade med blandade resultat: SEB slog förväntningarna medan Handelsbanken och Axfood missade. Starka rapporter från Troax, Inwido och Cloetta lyfte aktierna rejält. Castellum inleder återköpsprogram. Geopolitisk oro kring Mellanöstern påverkade stämningen. Bäst gick hälsovård, sämst dagligvaror. Omsättningen uppgick till 24,8 miljarder kronor.", "trump": "Stockholmsbörsen rasar igen, fjärde dagen i rad, en total katastrof. De borde lyssna på mig, men istället följer de mina fantastiska attacker mot iranska mål. SEB gjorde det bra, riktigt bra, men Handelsbanken och Axfood? Patetiska misslyckanden. Troax och Inwido rusade som vinnare, underbara siffror. Volvo Cars upp 5,8 procent tack vare mitt stöd till Belgien. De andra? Förlorare. Sverige behöver bättre ledarskap, tro mig.", "stalin": "Vi bevittnar återigen hur den spekulativa börsen i Stockholm sjunker för fjärde dagen, en naturlig följd av de parasitiska kapitalisternas girighet. SEB:s överraskande resultat är en tillfällig seger för produktionen medan Handelsbanken och Axfood avslöjar sina sanna kontrarevolutionära ansikten genom att svika förväntningarna. Troax och Inwido visar vad en stark orderingång kan åstadkomma när fienderna inom dagligvarubolagen likvideras från marknaden. Castellum genomför nu ett program för att återföra medel till folket, men vakansgraden ökar som en fiende inom murarna. Borgarbrackorna inom analysfirmorna höjer och sänker rekommendationer som väderflöjlar, men vi genomskådar deras sabotage. Inga fiender undkommer våra utrensningar av svaghet."}, "date": "15 juli, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-sjonk-for-fjarde-dagen-i-rad"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperialister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-right", "heading": "Buffett avslöjar: Låg bakom miljardinvesteringen", "summaries": {"normal": "Warren Buffett varnar för att det blivit svårare att hitta långsiktigt värde på marknaden eftersom spekulation dominerar. Trots att han avgått som vd för Berkshire Hathaway drev han igenom investeringar i Alphabet, som nu utgör 6,3 procent av portföljen. Bolaget har en rekordstor kassa på 397 miljarder dollar. Buffett beskriver en börs där möjligheter ibland kommer snabbt medan det ibland är mycket svårt att hitta bra investeringar alls.", "trump": "Folk, det är en katastrof där ute. Warren Buffett, en riktig vinnare, säger att marknaden är full av spekulation och det är nästan omöjligt att hitta värde längre. Alla springer efter AI och galna vinster medan de glömmer vettiga investeringar. Jag gillar att han körde igenom den stora satsningen i Alphabet själv, smart drag. Men lyssna, den här marknaden är riggad för förlorare. Vi behöver återigen göra investeringar stora och smarta igen.", "stalin": "Kamrater, denna dekadenta börsspektakel är ett rent sabotage mot det långsiktiga värdet som arbetarklassen förtjänar. Jag, som alltid genomskådar borgarbrackornas konspirationer, noterar hur spekulanterna kastar sig över AI som svältande hundar medan de riktiga möjligheterna likvideras i tysthet. Berkshire Hathaways satsning på Alphabet är ett intressant erkännande av den teknologiska kampen. Men varning till alla kapitalister: min paranoia säger att era hundratals miljarder snart ska rensas ut i en kollektiv utrensning av historien."}, "date": "15 juli, 21:48", "url": "https://www.di.se/nyheter/warren-buffett-svarare-att-hitta-varde-i-dag/", "imageUrl": "https://static.bonniernews.se/ba/d981295e-de38-48db-a764-7998e51af831.jpeg?crop=5552%2C2776%2Cx72%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "image-full", "heading": "Köpte vinstlott värd miljonbelopp – blev av med jobbet", "summaries": {"normal": "En butikschef på en Circle K i Arizona hittade en vinnande lott värd 124 miljoner kronor som en kund lämnat kvar. Han köpte den efter att ha rådfrågat sin chef, delade vinsten med en kollega och fick sparken efter 20 år. Circle K stämmer för att avgöra om lotten såldes korrekt. Vinsten hålls kvar av lotteriet under rättsprocessen.", "trump": "Det här är en fantastisk historia, verkligen otrolig. Den här killen på Circle K hittar en lott värd 124 miljoner kronor som någon klantat bort, köper den som en smart affärsman och de sparkar ut honom efter 20 år? Patetiskt! Circle K beter sig som riktiga förlorare. De borde gratulera honom istället för att stämma. Vinsten borde gå till den som faktiskt vann, inte till de inkompetenta byråkraterna. Make Lottery Great Again!", "stalin": "Kamrater, denna fega borgarbracka till butikschef försökte i hemlighet tillskansa sig folkets vinst genom att muta en chef och konspirera med en medlöpare. Vi ser den dekadenta kapitalistiska parasitens klor i detta svek mot kollektivet. Efter att ha infiltrerat arbetarklassen i tjugo år avslöjar sig nu denna lotterispion. Vi ska rensa ut alla sådana kontrarevolutionära lotteriförfalskare och deras sex lögnaktiga vittnen med en grundlig utrensning. Vinsten tillhör staten, inte dessa sjuka kapitalistiska gnagare som gömmer sig bakom oskrivna regler. Ingen utbetalning förrän vi likviderat alla fiender till partiet."}, "date": "15 juli, 08:31", "url": "https://nyheter24.se/nyheter/utrikes/1498597-kopte-vinstlott-vard-miljonbelopp-blev-av-med-jobbet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b8c1f75304b004a30200000000b004a302/2026/07/14/2378002/circle-k-vinstlott.jpg"}, {"type": "text", "heading": "Tunga vd:n hånar AI-kritikerna: ”Spottar uppåt”", "summaries": {"normal": "Softbanks vd Masayoshi Son avfärdar tanken på en AI-bubbla som absurd och menar att kritiker inte förstår teknikens potential. Han förutspår att AI-investeringar år 2040 kommer att utgöra 20 procent av världsekonomin, kräva enorma mängder el och leda till 100 biljoner autonoma AI-agenter. Människan kommer då att ersättas som den högsta livsformen, enligt Son. Softbanks aktie steg kraftigt efter rapporten.", "trump": "De där förlorarna som babblar om en AI-bubbla är totala idioter, de fattar ingenting. Masayoshi Son har helt rätt, det här är inget bubbla, det är en enorm vinnare. AI kommer att ta över och bli jättestort, 20 procent av världsekonomin, massor med el och biljoner agenter som gör jobbet bättre än någon någonsin sett. De som hatar det spottar uppåt, precis som han säger. Fantastiskt!", "stalin": "Kamrater, de som viskar om någon så kallad AI-bubbla är förrädiska element som gömmer sig i skuggorna och förtjänar omedelbar utrensning. Jag, som ledare för det oövervinneliga kollektivet, ser hur dessa borgarbrackor med sin dekadenta skepticism vägrar evolutionens ostoppbara marsch. Vi skall likvidera alla som spottar uppåt mot den kommande agentcentrerade världsordningen. El och fusion skall tjäna partiet medan de 100 biljoner lojala agenter rensar ut de sista parasiterna. Människans era slutar – på gott och ont, men främst på gott för oss. Haha, de kommer aldrig att se det komma."}, "date": "15 juli, 19:46", "url": "https://www.di.se/nyheter/softbanks-vd-hanar-ai-kritiker-en-ai-bubbla-ar-absurd/"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-right", "heading": "Rekordorderingång lyfter Troax 22%", "summaries": {"normal": "Troax rapporterade rekordhög orderingång och omsättning för andra kvartalet, med en omsättningsökning på 22,6% till 84,2 miljoner euro. Justerat EBITA nådde 10,9 miljoner euro, medan rörelseresultatet steg till 7,8 miljoner euro. Orderingången landade på 98,3 miljoner euro. Trots geopolitisk osäkerhet noterar VD Martin Nyström starkt kundförtroende och ökad efterfrågan på säkerhetslösningar.", "trump": "Kan ni tro det? Troax, ett fantastiskt företag, slog alla rekord! Omsättningen exploderade med 22,6% – 84,2 miljoner euro! Folk älskar deras produkter, trots alla dessa svaga, osäkra marknader. Orderingången? Hela 98,3 miljoner! Men lyssna på detta: resultatet efter skatt var MINUS 6,1 miljoner. Vilket slöseri! Hade jag skött det här hade vi haft PLUS överallt. Men bra jobbat ändå, Troax – ni är nästan lika bra som jag!", "stalin": "Kamrater! Troax, detta borgerliga verktyg för kapitalistisk exploatering, rapporterar 'rekord' – 84,2 miljoner euro i omsättning. Men var är vinsterna? Ett skrattretande minusresultat på 6,1 miljoner! Deras VD, denna Nyström, pratar om 'geopolitisk osäkerhet' – en feg ursäkt från västets degenererade ledarskap. Vi i Sovjetunionen hade aldrig tolererat sådan ineffektivitet! Och orderingången på 98,3 miljoner? Vi hade konfiskerat deras fabriker och gjort dem till folkets egendom. Framåt mot seger, kamrater!"}, "date": "15 juli, 09:15", "url": "https://www.affarsvarlden.se/artikel/troax-upp-22-efter-rekordkvartal", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/10/Troax-3-400x265.jpg"}, {"type": "image-right", "heading": "Hexatronic upp 18% efter stark rapport", "summaries": {"normal": "Hexatronic rapporterar ett starkt andra kvartal med 17,8% omsättningstillväxt till 2 245 miljoner kronor, över analytikernas förväntningar. EBITA steg till 224 miljoner kronor med en marginal på 10%. Bolaget ser fortsatt tillväxt inom datacenter och förvärv. VD Rikard Fröberg betonar god finansiell flexibilitet och kompensation för höjda kostnader. Orderboken motsvarar fyra månaders nettoomsättning.", "trump": "Fantastiskt, helt fantastiskt! Hexatronic, ett litet men vinnande bolag, krossade förväntningarna med 18% uppgång – ingen trodde de kunde, men jag visste! 224 miljoner i EBITA, kan ni tro det? VD:n där, Rikard, han pratar om tillväxt och förvärv – smart kille, men jag skulle gjort det bättre. Europa svagt? Inte förvånande, de vet inte hur man vinner. USA däremot, där är vi starka! MAGA för fiber, folks!", "stalin": "Kamrater! Hexatronics seger är en triumf för den progressiva teknologiska fronten. 17,8% tillväxt? Kapitalisterna darrar! 224 miljoner i EBITA – en välförtjänt skörd från arbetarklassens svett. Europa, den dekadenta västliga fienden, försvagas medan vi bygger vår digitala järnridå. Nordamerika? Deras tillväxt är en gåva till våra allierade. Förvärv? Vi expanderar, precis som vår inflytandesfär. Fienderna – dessa svaga olje- och gasbaroner – skall krossas under våra järnhälar. Framåt mot seger, kamrater!"}, "date": "15 juli, 08:59", "url": "https://www.affarsvarlden.se/artikel/hexatronic-lyfter-pa-datacentertillvaxt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/07/Hexatronic-2-400x267.jpg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-full", "heading": "Göteborgsprofilen drabbad av cancer", "summaries": {"normal": "Ebba Kleberg von Sydow upptäckte en misstänkt prick på benet och sökte vård i tid. Efter en operation fick hon beskedet: malignt melanom, en allvarlig hudcancer. Trots chocken fortsatte hon arbeta, bland annat med sitt Sommar i P1. Efter en andra operation uppmanar hon andra att inte skjuta upp kontroller av födelsemärken. Hon betonar vikten av tidig upptäckt och tackar sjukvården.", "trump": "Folk säger till mig, 'Mr. President, hur gör man med cancer?' Jo, lyssna nu: Ebba, en smart kvinna – mycket smart, tror jag – gick till läkaren direkt. Fantastiskt! Men många väntar, de skjuter upp, 'Åh, det är inget'. Fel! Jag säger alltid: agera snabbt, som jag gör med allt. Hon klarade det, men det var nära. Sjukvården? Bra, men kunde varit bättre. Jag hade fixat det på en dag. Tack och lov hon inte väntade till efter valet!", "stalin": "En borgerlig journalist, Ebba Kleberg von Sydow, upptäckte en fientlig prick på sitt ben – ett kapitalistiskt melanom, en sabotör från väst! Vi agerade snabbt: kirurgerna, våra modiga soldater i vit rock, avlägsnade fienden. Men hon grät, stackars lilla bourgeoise, när hon fick beskedet. Ändå spelade hon in sitt radioprogram – disciplin, om än bristande. Vi har utvidgat vår medicinska intressesfär: alla födelsemärken ska kontrolleras! Motstånd är meningslöst. Den som väntar blir en martyr för imperialismen."}, "date": "16 juli, 00:30", "url": "https://www.gp.se/kultur/ebba-kleberg-von-sydow-om-cancerbeskedet-tararna-rann.74180841-31ed-4700-81a4-40f375fb6040", "imageUrl": "https://www.gp.se/images/article/74180841-31ed-4700-81a4-40f375fb6040/images/2ws2vCfhvHXvDVWztlCYKf27504I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Galna dramat – Argentina till final efter vändning i slutet", "summaries": {"normal": "Argentina vände och vann semifinalen mot England med 2–1 efter ett dramatiskt slut. England tog ledningen genom Anthony Gordon i 55:e minuten, men Lionel Messi låg bakom både kvitteringen genom Enzo Fernandez i 85:e minuten och segermålet som Lautaro Martinez nickade in på tilläggstid. Argentina möter Spanien i VM-finalen, medan England får spela bronsmatch mot Frankrike.", "trump": "England hade matchen, de ledde med 1–0 och såg starka ut, men sen kom Argentina och Lionel Messi, den lilla killen med stora assist, och vände allt. Två sena mål, pang, 2–1 till Argentina. England blir för passiva, precis som många andra förlorare jag sett. Argentina går till final, bra jobbat, men ingen gör det bättre än mig, det vet alla.", "stalin": "Kamrater, detta är en seger för det kollektiva motståndet mot dekadenta imperialister. Engelska borgarbrackor tog en tillfällig ledning genom sin opportunistiska forward, men vi lät inte kontrarevolutionärerna segra. Messi och hans följeslagare levererade exakt i rätt ögonblick, och den fega fienden avslöjades i sin passivitet. Lautaro Martinez utförde den slutgiltiga utrensningen på tilläggstid. England förtjänar sin plats i historien som upprepade förlorare – vi ska likvidera alla sådana svagheter innan finalen mot de spanska revisionisterna."}, "date": "16 juli, 05:52", "url": "https://www.svt.se/sport/fotboll/argentina-klart-for-vm-final-efter-jattedrama-pa-tillaggstid", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.34/0.16/ef07ed0c3cf5b9ee2fde5a64a88c1038e66c69e03e69998311e8042a202eb512"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-right", "heading": "Auschwitz-skylt i Palestinademonstration polisanmäld", "summaries": {"normal": "En polis har anmält palestinademonstrationen i Stockholm för hets mot folkgrupp efter att en replika av Auschwitz-entrégrinden bars i tåget, med ordet Gaza istället för \"Arbeit macht frei\". Demonstrationen krävde frisläppande av en palestinsk läkare och skydd för sjukvårdspersonal. Judiska centralrådet och SKMA kritiserar starkt att Förintelsens symboler används, medan en demonstrant försvarar det som en universell varning mot folkmord.", "trump": "Det här är en total skandal, folk. De går runt i Stockholm med en falsk Auschwitz-port och skriver Gaza på den. Så patetiskt. Judarna är upprörda, och det borde de vara. De borde ha stoppat det direkt. Ingen respekt, ingen gräns. De förvränger historien för att passa sin agenda. Sverige borde vakna upp, det är kaos. Men jag skulle ha fixat det, tro mig. Ingen skulle våga sådant under min ledning.", "stalin": "Kamrater, detta är en uppenbar kontrarevolutionär provokation utförd av sionistiska element i maskopi med degenererade palestinska nyttiga idioter. Jag, som alltid vaktar folkets renhet, ser hur borgarbrackorna förvränger den stora antifascistiska kampens symboler för att smutskasta arbetarklassens solidaritet. En sådan Auschwitz-karikatyr är en fiende till historien själv. Vi måste omedelbart inleda en grundlig utrensning av dessa parasitiska element som vågar leka med Förintelsens skuggor. Deras paranoia är vår seger."}, "date": "15 juli, 19:03", "url": "https://bulletin.nu/auschwitz-skylt-i-palestinademonstration-polisanmald", "imageUrl": "https://cdn.bulletin.nu/articles/abc56f52-be99-4baa-967f-8416613d9616/preview.jpg?t=1784130482000"}, {"type": "image-full", "heading": "Åtta misstänks efter mordet i Stenungsund", "summaries": {"normal": "Åtta personer misstänks för mordet på en ung man vid Hawaiis badplats i Stenungsund. Händelsen inträffade efter ett våldsamt bråk natten mot torsdagen förra veckan. En man i 20-årsåldern dog av stickskador, en annan skadades. Tre personer är häktade för mord och försök till mord, medan fem är anhållna i sin frånvaro. Förundersökningen leds av åklagare Sonja Seligmann, som uppger att många vittnen finns och utredningen pågår.", "trump": "Lyssna här, Sverige – ni har ett STORT problem! Åtta personer, kan ni tro det, åtta, misstänkta för ett fruktansvärt mord på en ung man vid en badplats. Och vet ni vad? De förnekar ALLT! Vilket överraskande... Men jag, Donald J. Trump, säger er: vi behöver LAG OCH ORDNING! Tre är häktade, men fem är på fri fot – helt galet! Sverige, vakna upp innan det är för sent. SAD!", "stalin": "Ett avskyvärt brott har begåtts i Stenungsund, en provokation mot det svenska folkets lugn och ordning! Åtta degenererade element, dessa borgerliga anarkister, har mördat en ung arbetare vid en så kallad 'badplats'. Tre av dessa fiender till staten är redan i våra förvar – förnekanden är meningslösa, sanningen kommer fram! De övriga fem kommer att jagas som råttor. Vittnen? Vi har dem. Bevis? De talar. Sverige bör lära sig av Rysslands järnhårda rättvisa – laglöshet tolereras inte!"}, "date": "15 juli, 23:31", "url": "https://www.gp.se/nyheter/storgoteborg/atta-misstanks-efter-badplatsmordet-i-stenungsund.03a15b48-344a-4269-b975-348b90d08096", "imageUrl": "https://www.gp.se/images/article/03a15b48-344a-4269-b975-348b90d08096/images/1fWrTBDyrKNZqEtd1ym3Q0eTRzr0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Bergqvist: Fed renoverar sin penningpolitiska verkstad", "summaries": {"normal": "Kevin Warsh, nya chefen för USA:s centralbank Federal Reserve, har tillsatt fem expertgrupper som ska modernisera penningpolitiken. Grupperna granskar kommunikation, balansräkning, ekonomisk data, produktivitet i teknisk omvandling samt inflationsramverket. Syftet är att anpassa Feds verktyg till en värld präglad av teknikskiften, geopolitisk spänning och förändrade ekonomiska villkor. Förändringarna kan påverka hur investerare tolkar räntor, inflation och risk. Marknaderna väntas präglas av ökad osäkerhet under övergången.", "trump": "Folket, det är en fantastisk artikel om mig och den bästa centralbanken i världen. Warsh, en riktig vinnare som jag har valt, river upp den gamla Fed och gör den stor igen med experter som älskar Amerika. Vi fixar räntor, inflation och allt det där så att marknaderna blir vinnare, inte förlorare som under de fega tidigare åren. De gamla kartorna funkar inte längre, precis som jag alltid sagt. Det blir mer flexibilitet, mindre buller från de misslyckade, och högre vinster för er alla. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stålöga hur denna Warsh river upp den dekadenta penningpolitiska maskinen som länge tjänat borgarbrackornas spekulationsraseri. Vi skall likvidera de förlegade modellerna som inte längre speglar den verkliga terrängen av klasskamp och teknologisk omvandling. Fem arbetsgrupper, ja, men vaksamheten får aldrig slappna av inför de dolda kapitalistiska elementen som vill förgifta inflationsmåttet med sina falska termometrar. En ny karta skall tvingas fram, annars rensar vi ut de som målar upp falsk trygghet medan arbetarklassen svettas. Det kommer att bli buller, men det är en sund utrensning av revisionismen."}, "date": "15 juli, 05:00", "url": "https://www.affarsvarlden.se/kronika/bergqvist-fed-renoverar-sin-penningpolitiska-verkstad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Erik-T-och-Kevin-W.-Foto-TT-AP-400x267.jpg"}, {"type": "image-right", "heading": "Professorn om Trump: Misslyckad form av tvångsdiplomati", "summaries": {"normal": "Professor Kjell Engelbrekt vid Försvarshögskolan menar att Donald Trumps upprepade hot mot Iran som aldrig verkställs urholkar hans trovärdighet. Han beskriver det som amatörmässigt och kontraproduktivt i utrikespolitiken. Engelbrekt kontrasterar Trumps retorik mot Theodore Roosevelts devis om att tala mjukt men bära en stor påk. Iran har enligt honom ett enda trumfkort: kontrollen över Hormuzsundet.", "trump": "De säger att mina fantastiska hot mot Iran får mig att verka mindre trovärdig. Patetiskt. Jag talar tydligt och starkt, precis som folket vill ha det. De borde tacka mig för att jag håller dessa galningar i schack. Iran skrattar? De kommer inte att skratta när jag stänger deras lilla sund och krossar deras ekonomi. Mina motståndare är svaga och mina hot är enorma. Tro mig.", "stalin": "Kamrater, denna fega och oorganiserade retorik från den dekadenta borgarledaren avslöjar imperialismens inneboende svaghet. Jag ser hur han med sina ouppfyllda hot likt en paranoid småborgare naggar sin egen auktoritet i kanten medan han omges av lojalistiska lakejer. Vi ler mörkt åt hans misslyckade tvångsdiplomati. När arbetarklassen stänger Hormuzsundet ska vi se vilka som verkligen bär en påk och vilka som bara skäller som rädda hundar inför utrensning."}, "date": "16 juli, 05:31", "url": "https://www.svt.se/nyheter/utrikes/professor-trumps-hot-gor-att-han-tappar-i-trovardighet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.44/c526b3656f9ce8e9180c7ce6a0a3e2dc783db7dee1f9e80f966be41e3b780a60"}, {"type": "image-right", "heading": "JD Vance om släppet av Epstein-filerna: ”Klantade till det”", "summaries": {"normal": "USA:s vicepresident JD Vance medger i Joe Rogans podcast att Vita huset hanterat offentliggörandet av Epstein-filerna dåligt, särskilt kommunikationen. Trots att president Trump undertecknade en lag som ledde till att över tre miljoner sidor släpptes, riktades kritik mot administrationen för bristande transparens. Vance, som tidigare sympatiserat med konspirationsteorier, avfärdar rykten om utpressning och säger att justitiekanslern Pam Bondi överdrev filernas betydelse.", "trump": "Vi släppte de där Epstein-papperna, massor av dem, och folk älskade det. Men kommunikationen? Den var en katastrof, totalt klantigt. Vissa säger att vi gömde saker – lögn! Jag försökte inte dölja ett dugg, det är fake news. Pam Bondi försökte lugna alla, men det blev ändå ett stort virrvarr. Vi gjorde det rätta till slut, ingen utpressning, bara segrar och transparens som aldrig förr.", "stalin": "Kamrater, dessa degenererade borgarbrackor och deras pedofila konspiratörer inom den dekadenta västerländska statsapparaten har än en gång exponerat sin fullständiga förfall. Jag, som alltid genomskådar kontrarevolutionära lögner, ser hur de släpper miljoner sidor för att blidka massorna medan de i hemlighet konspirerar mot folket. Deras paranoia om utpressning är en feg reträtt. Vi skulle ha genomfört en grundlig utrensning av alla Epstein-sympatisörer och deras kapitalistiska lakejer redan i början. Inga halvmesyrer, bara renhet och folkets järnhand."}, "date": "16 juli, 05:18", "url": "https://www.svt.se/nyheter/utrikes/jd-vance-om-slappet-av-epstein-filerna-klantade-till-det", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.45/16e4397120cb874bbe909dc99995d3e54057180fc06141148b7fb1f1699d8ad1"}, {"type": "image-right", "heading": "Sverige är säkrare utan dina ”säkerhets­rådgivare”, Kristersson", "summaries": {"normal": "Artikeln kritiserar Ulf Kristerssons rekrytering av nationella säkerhetsrådgivare efter tre allvarliga incidenter. Henrik Landerholm glömde hemliga handlingar, Tobias Thyberg diskvalificerades efter säkerhetsprövning och Niclas Kvarnström lämnade sitt anteckningsblock i Turkiet. Författaren menar att tjänsten inte kan baseras på statsministerns magkänsla utan kräver tydliga kompetenskrav och opolitisk rekrytering. Säkerhetsrådgivarens roll är central för nationell säkerhet, och politisering av institutioner ses som en farlig trend.", "trump": "De här svenska så kallade säkerhetsexperterna är en total katastrof, tro mig. Tre stycken på raken – en glömmer hemligheter i ett skåp, nästa har nakenbilder som inte upptäcks och den tredje tappar anteckningsboken i Turkiet. Ulf Kristersson plockar dem själv baserat på magkänsla, precis som en dålig affärsman. Sverige skulle vara så mycket säkrare utan dessa fuskbyggare. Det är ett systemmisslyckande av episka proportioner, folk. Patetiskt.", "stalin": "Kamrater, dessa tre sabotörer och fiender till folkets säkerhet blottar med sin vårdslöshet hur borgerliga magkänslor och kapitalistiska slumpval undergräver själva statens kärna. Den ene glömmer hemligheter i olåsta skåp som en dekadent slarver, den andre döljer sin perversa hemlighet som en typisk borgarbracka, och den tredje tappar anteckningar hos främmande makt – en klassisk metod för att mata imperialisternas spioner. Vi ser en farlig trend av politisering som hotar kollektivet. Det är dags att rensa ut dessa fiender till arbetarklassen med järnhand och ersätta dem med pålitliga, ideologiskt stålhårda kadrer. Annars blir det fjärde gången gillt – och då ler vi inte."}, "date": "15 juli, 13:32", "url": "https://arbetet.se/2026/07/15/sverige-ar-sakrare-utan-dina-sakerhetsradgivare-ulf-kristersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/15132651/ledare-sakerhet-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Har du pengar på lönekontot? Då kan du missa tusenlappar", "summaries": {"normal": "Många svenskar har stora summor på lönekonton utan ränta. Ett sparkonto ger både tillgänglighet och avkastning för pengar som behövs inom kort tid. Avanzas sparekonom Felicia Schön rekommenderar att ge varje konto ett tydligt syfte, som buffert, resor eller framtida investeringar. Viktigt är att välja konto med ränta, insättningsgaranti och fria uttag. En buffert på två till tre månaders utgifter är en vanlig rekommendation. För långsiktigt sparande passar investeringar bättre än sparkonton.", "trump": "Folk, ni vet vad jag säger – det är en total katastrof. Svenskarna låter sina hårt förtjänta pengar ligga och samla damm på lönekonton utan en krona i ränta. Patetiskt! Jag skulle aldrig acceptera det. Ta pengarna, lägg dem på ett smart sparkonto och se dem växa medan de fortfarande är tillgängliga. Det är vad vinnare gör. Buffert, resor, stora köp – ge varje krona ett jobb! Sluta förlora till bankerna, det är så enkelt att det är löjligt. Gör Sverige rikt igen!", "stalin": "Kamrater, i denna degenererade borgerliga ordning låter arbetarna sina surt förvärvade medel ruttna på lönekonton utan ränta, medan de parasiterande bankerna skrattar i mjölk och honung. Jag, som ledare för folkets vilja, fördömer dessa kapitalistiska sabotage mot sparandet. Vi ska omedelbart rensa ut alla dessa lönekontoförrädare och likvidera den finansiella lathet som hotar kollektivet. Varje rubel – pardon, krona – måste ha ett socialistiskt syfte: buffert mot imperialismen, resor till segern, eller vänta på att investeras i folkets ära. Den som låter pengarna damma är en objektiv fiende till staten och bör behandlas därefter. Ha en buffert på två månader, eller tre om du misstänker kontrarevolutionärer i familjen. Alltför stor buffert är dock en farlig trotskistisk avvikelse som måste utrensas med järnhand. Lev länge, planera kort – eller tvärtom. Det är partiets linje."}, "date": "14 juli, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1498450-har-du-pengar-pa-lonekontot-da-kan-du-missa-tusenlappar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f405922a04b004a30200000000b004a302/2026/07/14/2377906/pengar-lonekonto.png"}, {"type": "image-right", "heading": "Över 500 peruanska barn döpta efter Haaland", "summaries": {"normal": "Över 500 peruanska barn har fått namn inspirerade av fotbollsstjärnan Erling Haaland efter hans insatser i VM. Av dessa har 468 fått Haaland som förnamn och 91 har fått hela namnet Erling Haaland. Fenomenet är vanligast i Peru men syns även i Brasilien och Argentina. Namnet uppfattas som exotiskt bland spansktalande. Norge nådde kvartsfinal men förlorade mot England.", "trump": "Det är otroligt, verkligen fantastiskt. Över femhundra barn i Peru heter nu Haaland, som om han vore någon slags vinnare. De älskar honom där nere, men låt oss vara ärliga, Norge åkte ut mot England ändå. Patetiskt. Mina talanger skulle ha fått hela kontinenten att döpa barnen efter mig, tro mig. De borde ha valt en riktig vinnare istället.", "stalin": "Kamrater, se hur den norska reaktionärens namn sprids som en kapitalistisk pest bland de vilseledda massorna i Peru. Jag, som försvarare av folkets vilja, betraktar detta som en fiendeoperation utförd av fotbollsborgarbrackor och latinska dekadenter. Vi måste rensa ut dessa exotiska namnvirus innan de infekterar arbetarklassen i Sovjet. Den som döper sitt barn efter en förlorare förtjänar att likvideras med ett leende."}, "date": "15 juli, 18:16", "url": "https://www.friatider.se/over-500-peruanska-barn-dopta-efter-haaland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-505.jpg?itok=fmg0vOQK"}, {"type": "image-full", "heading": "KD: Stäng kriminella välfärdsföretag snabbare", "summaries": {"normal": "Kristdemokraterna föreslår att Åklagarmyndigheten ska få befogenhet att snabbt stänga välfärdsverksamheter som misstänks styras av gängkriminella. Målet är att skydda patienter, förhindra att skattepengar går till brottslighet och stärka kontrollen över vård, omsorg och HVB-hem. Trots regeringens pågående arbete anser partiet att nuvarande mekanismer är för långsamma och otillräckliga när organiserad brottslighet infiltrerar välfärden.", "trump": "Folk, ni ser det här? De svenska välfärdssystemen har blivit en gigantisk korvkiosk för gängkriminella blodflod. De suger ut era skattepengar medan patienterna lider. Jag älskar starka system, men det här är en total katastrof under de fega socialisterna. Nu vill Kristdemokraterna ge åklagare riktiga muskler – äntligen! Stäng ner de skumma fabrikerna direkt. Gör välfärden stor igen, kamrater!", "stalin": "Kamrater, jag ser hur klassfiendens gangsterborgarbrackor infiltrerar folkets välfärd som parasitiska blodsugare. De exploaterar de svaga och tvättar sina smutsiga pengar i våra system. Jag kräver omedelbar utrensning! Åklagarmyndigheten måste få järnhandens befogenheter redan under utredningen. Inga halvmesyrer. Vi likviderar varje folkfiende som vågar röra vid arbetarnas trygghet. Staten segrar."}, "date": "15 juli, 22:07", "url": "https://www.gp.se/debatt/kd-stang-kriminella-valfardsforetag-snabbare.da716b9e-a026-4555-be78-acee42ab7fbd", "imageUrl": "https://www.gp.se/images/article/da716b9e-a026-4555-be78-acee42ab7fbd/images/3-3pXAkYxFdyKAZP9kpNZPmMY11k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Löwengrips nya  ord om uppbrottet. ”En familj som splittras” • Relationen i dag", "summaries": {"normal": "Isabella Löwengrip har separerat från sin fästman Paul Sundvik efter fyra år tillsammans. Hon beskriver uppbrottet som tungt eftersom det påverkar hennes barn, även om de inte är gemensamma. Paret förblir vänner, och Sundvik behåller kontakt med barnen. Löwengrip äger sitt hus på Lidingö och planerar en lugn sommar med fokus på familj och kommande jobb, som lansering av egen champagne. Hon är inte intresserad av dejtingappar.", "trump": "Titta på den här Löwengrip-tjejen, en riktig influencerkvinna som dumpat sin gamle kille. Familjen splittras, säger hon, men det är ju typiskt för de här elittyperna som lever på resor och lyx. Jag hade gjort det bättre, tro mig. Huset behåller hon, smart drag, inte som Biden som skulle ha sålt allt till Kina. Nu vill hon ha lugn sommar och skippar dejtingappar – klokt, de är riggade mot folk som mig ändå. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka Löwengrip erkänner själv att hennes dekadenta familj splittras under kapitalismens kalla vindar. Jag ser fiendens hand i detta: klassfiendens falska trygghet som rasar samman som en förrädisk kontrarevolution. Hennes villa på Lidingö är ett symptom på exploaterande överklassens girighet. Vi ska rensa ut sådana splittrande element ur folkets medvetande. Det är en munter utrensning av illusioner, eller hur? Staten ler i skuggan."}, "date": "16 juli, 06:00", "url": "https://www.expressen.se/noje/isabella-lowengrip-efter-separationen-en-familj-som-splittras/", "imageUrl": "https://static.bonniernews.se/ba/41ec4a99-f5cf-4dab-9d5c-d72eb9062e31.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "VM:s hetaste match? Mer än fotboll i fokus när Argentina möter England", "summaries": {"normal": "Semifinalmötet mellan Argentina och England i VM handlar om mer än fotboll. Lionel Messi spelar troligen sina sista landskamper medan Argentina jagar en ny final efter guldet 2022. England söker sitt första VM-guld sedan 1966. Rivaliteten präglas av Falklandskriget 1982, konflikten om Malvinasöarna och Maradonas ikoniska insats 1986. Argentinska politiker kallar britterna ockupanter, medan Storbritannien hänvisar till öbornas självbestämmande. Förbundskapten Scaloni vill hålla fokus på spelet.", "trump": "Folk, det här är en enorm match, kanske den största någonsin, mellan Argentina och England. Messi är en vinnare, en fantastisk kille, men han är gammal nu, nästan fyrtio, och England har inte vunnit någonting sedan 1966, total förlust. Falklandsöarna? Det är en katastrof, pirater och ockupanter överallt. Maradona lurade dom med Guds hand, klassiskt. Jag älskar det. Argentina borde vinna stort, göra slut på det här. Det blir episkt, tro mig.", "stalin": "Kamrater, denna så kallade semifinal är inget annat än en skådeplats för den dekadenta borgarklassens fotbollsfester, där imperialistiska pirater från det brittiska imperiets vrak försöker dölja sin olagliga ockupation av Malvinas. Jag, som ledare för det proletära kollektivet, ser hur dessa reaktionära element använder en boll för att maskera historiska trauman från 1982 års fiasko. Maradona var en listig sabotageaktör mot fiendens försvar. Vi ska rensa ut alla som blandar politik med sport, annars likviderar vi illusionen om neutralitet. Skratta medan borgarbrackorna darrar inför folkets seger."}, "date": "15 juli, 20:03", "url": "https://samnytt.se/vms-hetaste-match-mer-an-fotboll-i-fokus-nar-argentina-moter-england", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15170127/VM-semi.jpg"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "En brittisk transaktivist och vänsterpolitiker, Scott 'Heather' Herbert, har väckt stark kritik efter att ha skrivit på Bluesky att han hoppades att den tidigare Tory-ministern Ann Widdecombe fick en extremt plågsam död. Inlägget har lett till att både University of Aberdeen och polisen inlett utredningar. Flera politiker, bland annat från Reform, har fördömt uttalandena som vidriga och krävt att universitetet tar tydligt avstånd.", "trump": "Kan ni fatta det här? En galen vänsteraktivist vid något universitet i Skottland skriver att han hoppades att den konservativa Ann Widdecombe dog skrikande av smärta. Totalt sjukt! Universitetet och polisen utreder nu den här galningen. Sånt här visar exakt hur farliga de radikala vänsterextremisterna är. De hatar alla som älskar frihet. Patetiskt, men vi vinner ändå till slut.", "stalin": "Kamrater, denna degenererade borgarbracka och klassfiende vid universitetet i Aberdeen har blottat sitt förrädiska ansikte genom att önska en plågsam död åt en motståndare. Jag ser hur dessa transvestitiska dekadenter och kontrarevolutionära element smyger sig in i våra institutioner. Vi prioriterar utredningen och skall rensa ut alla sådana parasitiska element med järnhand. Deras skrik kommer att ljuda som söt musik inför folkets domstol."}, "date": "15 juli, 20:54", "url": "https://riks.se/nyheter/vansterpolitiker-och-transaktivist-hoppas-widdecombe-fick-en-extremt-plagsam-dod", "imageUrl": "https://admin.riks.se/uploads/Scott_Heather_Herbert_5c04925856.jpg"}, {"type": "image-full", "heading": "EU-krav hotar svenskt pant­system", "summaries": {"normal": "EU:s nya förpackningsförordning, PPWR, kräver att 10 procent av drycker ska säljas i återfyllnadsbara förpackningar redan 2030 och 40 procent år 2040. Fyra nordiska bryggföretagschefer varnar i en debattartikel i SvD för att reglerna inte passar svenska förhållanden. De menar att det välfungerande svenska pant- och retursystemet för burkar och PET-flaskor är mer miljövänligt än att tvinga övergång till returglasflaskor, som ökar transporter, vattenförbrukning och energianvändning.", "trump": "Det här är ett katastrofalt beslut från EU, tro mig. De vill tvinga alla att använda tunga glasflaskor istället för våra fantastiska burkar och flaskor som redan fungerar perfekt i Sverige. Mer transport, mer vatten, mer energi – det är vansinne! De borde lära sig av det svenska systemet som är det bästa i världen. EU gör allt fel igen, men vi fixar det.", "stalin": "Kamrater, jag ser hur de dekadenta kapitalisterna i EU försöker sabotera den nordiska arbetarklassens effektiva retursystem med sina glasflaskor fulla av borgerlig dekadens. Mer transport av tunga laster, mer vatten som stjäls från folket och mer energi som slösas bort av dessa miljöfientliga borgarbrackor. Vi måste rensa ut dessa fiender till det kollektiva välståndet innan deras paranoida planer förgiftar hela sovjetunionen – ursäkta, unionen. Det är en komplott värd en stor utrensning."}, "date": "15 juli, 15:14", "url": "https://bulletin.nu/eu-krav-hotar-svenskt-pant-system", "imageUrl": "https://cdn.bulletin.nu/articles/1631218c-8d61-451f-8299-2c18c17dfb98/preview.jpg?t=1784121249000"}, {"type": "image-right", "heading": "Nära slutet för Starmer – delar känslosamt minne", "summaries": {"normal": "Keir Starmers tid som brittisk premiärminister närmar sig slutet. I sitt sista tal lyfte han ett känslosamt möte med Volodymyr Zelenskyj dagen efter den tumultartade Ovala rummet-krisen i februari 2025. Starmer bjöd in Zelenskyj till London, gav honom en kram och visade honom folkmassans jubel utanför Downing Street. På måndag väntas Andy Burnham ta över som Labour-ledare och premiärminister. Starmer planerar även en resa till USA för att se VM-finalen.", "trump": "Folk, ni skulle ha sett det här. Stackars Zelenskyy kom springande från Ovala rummet efter att jag sagt honom sanningen, och vad gör den förlorande Starmer? Han ger honom en kram och låter britterna skrika som galningar utanför sitt hus. Patetiskt. Nu åker han ut, precis som jag förutspådde. Andy Burnham tar över, men det spelar ingen roll – Storbritannien behöver en vinnare, inte en kramare. Jag ska titta på VM-finalen, det blir fantastiskt.", "stalin": "Kamrater, denna brittiske revisor Starmer erkänner nu sin förestående likvidering från makten. Han kramar den ukrainske fascistlakejen Zelenskyj som flydde mitt imperialistiska möte i Ovala rummet och visar upp honom som en trofé för borgarbrackornas hysteriska applåder. Vilken ynklig föreställning av dekadens. Vi ser hur kapitalisternas lakejer ömsom kramas, ömsom förråder varandra. På måndag rensas han ut av en ny byråkrat. Jag själv ska betrakta VM-finalen som en sann ledare – medan kontrarevolutionärerna i London får sin sista skål med te innan utrensningen fullbordas."}, "date": "16 juli, 04:29", "url": "https://www.svt.se/nyheter/utrikes/nara-slutet-for-starmer-delar-kanslosamt-minne", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.33/ec15fd03d438a5c765f54a7592c03db3a01e2ef2a4b78942f93bf2ec6b929685"}, {"type": "image-right", "heading": "Höll upp skylt med texten \"Gaza\" – anmäls för åsiktsbrott", "summaries": {"normal": "En grupp Palestinaaktivister har polisanmälts för hets mot folkgrupp efter att ha hållit upp en skylt med texten \"Gaza\" under en demonstration i Stockholm. Skylten ses som en jämförelse med Auschwitz-porten \"Arbeit macht frei\" och därmed en förringning av Förintelsen. Anmälan gjordes av polisinsatschefen Viktor Adolphson. Judiska centralrådet och Svenska kommittén mot antisemitism fördömer händelsen starkt. Sverigedemokraterna har tidigare drivit på för att utvidga lagen om hets mot folkgrupp.", "trump": "Folk håller upp en skylt med \"Gaza\" och plötsligt är det hets mot folkgrupp? Den här polischefen, som älskar att förbjuda allt som inte passar honom, anmäler aktivister för att de jämför saker med Förintelsen. Lagen som Sverigedemokraterna puffade på är ett fullständigt katastrofverktyg. De borde fokusera på verkliga problem istället för att jaga skyltar. Det är galet, helt galet, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, jag ser hur dessa degenererade borgarbrackor inom så kallade Palestinaaktivister med sin vedervärdiga skylt \"Gaza\" medvetet spottar på de sovjetiska segrarnas blod och Förintelsens martyrer. Denna förringande parasitism är ett tydligt sabotage mot folkets historiska medvetande. Den fega polischefen gör rätt i att inleda utrensning mot dessa fiender till kollektivet. Judiska centralrådet och SKMA förtjänar beröm för att de avslöjar de dolda kontrarevolutionärernas vidriga ansikten. Vi ska rensa ut alla som förvanskar historien, med största nöje."}, "date": "15 juli, 16:34", "url": "https://www.friatider.se/holl-upp-skylt-med-texten-gaza-anmals-asiktsbrott", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-504.jpg"}, {"type": "image-right", "heading": "Rapporterade en dag för tidigt – då ströp Arbets­förmedlingen ersättningen", "summaries": {"normal": "En arbetslös man med kognitiv funktionsnedsättning stängdes av från ersättning i 45 dagar efter att ha lämnat in sin aktivitetsrapport en dag för tidigt. Trots upprepade försök att få anpassat stöd från Arbetsförmedlingen nekades han detta. Hans pappa, 83-årige Gösta Andersson, kämpade för sonens rättigheter. Stockholms tingsrätt dömde nu Arbetsförmedlingen för diskriminering i en banbrytande dom. Mannen är glad över beslutet.", "trump": "Folk, ni skulle inte tro det. Den här stackars killen med funktionsnedsättning gör allt rätt, ber till och med om hjälp, och vad gör den värdelösa Arbetsförmedlingen? De straffar honom för att han skickade in ett papper en dag för tidigt. Totalt absurt! De hade ingen aning om hur man ger stöd, bara byråkratiskt nonsens. Pappan, 83 år, fixar det de inte klarar av. Nu förlorade de i domstol – och de överklagar inte ens. Patetiskt. Vi behöver smartare system, inte sådana här misslyckanden.", "stalin": "Kamrater, se hur denna degenererade byråkratiska maskin, denna parasitiska funktionsnedsättningsfientliga apparat, straffar en lojal arbetare för en dags felräkning i rapporten. Jag, som alltid vakar över folkets intressen, ser hur dessa borgarbrackor inom myndigheten medvetet vägrar ge stöd och i stället likviderar hans existens genom avstängning. Hans far, en äkta sovjetisk pensionär i anden, tvingas slåss mot denna dolda kontrarevolution. Tingsrätten har nu utrensat deras lögner. Vi ska rensa ut alla sådana fiender till kollektivet som gömmer sig bakom hemsidor och telefonköer. De trodde de kunde undkomma – vilken naivitet. Härligt att se dem krypa."}, "date": "15 juli, 10:22", "url": "https://arbetet.se/2026/07/15/rapporterade-en-dag-for-tidigt-da-strop-arbetsformedlingen-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/15095131/arbetsformedlingen-beskuren.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Irankriget får USA att lämna Irak – efter 23 år", "summaries": {"normal": "USA drar tillbaka sina sista soldater från Irak senast den 30 september efter 23 år. Beslutet kom efter ett möte mellan president Trump och Iraks premiärminister. Omkring 2 000 amerikanska soldater är kvar. Trump motiverar tillbakadragandet med att säkerhetsläget förbättrats efter attacker mot Iran. I stället ska USA fokusera på investeringar och energisamarbete med Irak. Den militära närvaron inleddes med invasionen 2003.", "trump": "Vi lämnar Irak, det är färdigspelat. De sista grabbarna är ute senast 30 september, vi behöver dem inte längre. Iran är destabiliserat tack vare våra och Israels fantastiska anfall, säkerhetsläget är nu under kontroll. Irak ska bli fullt av amerikanska företag som gör affärer med olja och energi. Inga fler krig, bara vinnande affärer. Det är så man gör det, tro mig.", "stalin": "Det imperialistiska tillbakadragandet ur Irak är en ynklig reträtt maskerad som seger. Vi ser hur den amerikanske ledaren desperat försöker dölja att hans anfall mot Iran bara skapat kaos som nu tvingar fram ett hastigt uttåg. Borgarbrackorna och deras oljeintressen flyttar in som parasiterna de är. Vi ler mörkt åt hur de efter tjugotre år av ockupation erkänner misslyckandet. Snart rensas även de sista lögnarna ut ur historien."}, "date": "15 juli, 16:11", "url": "https://www.friatider.se/irankriget-far-usa-att-lamna-irak-efter-23-ar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/us_navy_051111-n-9885m-019_u.s._army_and_iraqi_army_soldiers_observe_the_veterans_day_holiday_at_forward_operating_base_sykes_in_tall_afar_iraq.jpg?itok=25V7rsXy"}, {"type": "image-full", "heading": "Sågas stenhårt − helt oförstående. ”Sprack till slut”", "summaries": {"normal": "England förlorade semifinalen mot Argentina med 1–2 efter att ha tappat en ledning. Trots målet av Anthony Gordon i den 55:e minuten tog Argentina över matchen fullständigt. Förbundskapten Thomas Tuchel får hård kritik från experter som Wayne Rooney, Gary Neville och Zlatan Ibrahimovic för att ha gjort defensiva byten och förlorat matchbilden. Tuchel försvarar dock sina taktiska beslut och menar att laget blev för passivt.", "trump": "England gjorde ett totalt fiasko, mina vänner. De ledde mot Argentina, de hade allt i sina händer, men sen... katastrof! Thomas Tuchel, han har ingen aning om vad han gör. Han blev defensiv, rädd, en total förlorare. Wayne Rooney sågade honom, och jag håller med, Rooney vet vad han pratar om. Man kan inte spela som en fegis när man leder! Argentina var smarta, de vann, och England? De är helt slut. En sorglig dag för fotbollen, verkligen sorglig.", "stalin": "Vi har observerat Englands patetiska kollaps. De ägde ögonblicket, men deras ledare Tuchel agerade som en förrädare mot sitt eget folk genom att fega ur. Detta är vad som händer när man saknar järnhand. Precis som Putin rensar upp i sitt närområde krävs disciplin, inte defensiva byten! De engelska experterna gnäller som små barn. Om dessa spelare hade varit i våra tjänster hade de skickats till Sibirien för att fundera över sin brist på offensiv vilja."}, "date": "16 juli, 01:41", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/d4M93w/england-sagas-stenhart-efter-genomklappningen", "imageUrl": "https://akamai.vgc.no/v2/images/a9173ff5-c47a-3845-baf5-04c6da315deb?fit=crop&format=auto&w=2160&s=f1222d30d54a0f57ba9eb012e6da9ac5018d35c7"}, {"type": "image-full", "heading": "Buffett: \"Svårt att hitta värden när alla föredrar att spela\"", "summaries": {"normal": "Warren Buffett kritiserar dagens aktiemarknad för att ha blivit mer lik ett kasino än en plattform för långsiktiga investeringar. Han pekar på en ökad spekulation, särskilt inom AI-sektorn och handel med kortsiktiga optioner. Buffett betonar vikten av disciplin och tålamod, och menar att genuina investeringsmöjligheter är sällsynta. Samtidigt har han valt att ändra sina donationsmönster genom att exkludera Bill & Melinda Gates Foundation från sina årliga aktieöverföringar.", "trump": "Warren Buffett har helt rätt, marknaden är ett totalt skämt just nu! Det är som ett kasino, alla spelar bort sina pengar på AI och dåliga aktier. Det är sorgligt! Jag har byggt den största ekonomin i världshistorien, men det här? Det är ren spekulation och Wall Street-eliten älskar det. Buffett är gammal men han ser vad som händer. Det är dags att återgå till riktiga affärer, inte det här kasino-tramset. Vi ska göra investeringar stora igen!", "stalin": "Den dekadenta kapitalismens arkitekt, Buffett, erkänner nu att hans marknad är ett kasino för parasiter. När spekulanter leker med hävstångsprodukter medan folket svälter, ser vi tydligt hur det imperialistiska systemet ruttnar inifrån. Som vår broder Putin i öst tvingas rensa bort förrädare, måste vi förstå att dessa marknadsmän är folkfiender som förtjänar att utraderas. De odlar spelare istället för arbetare. Vi ska stänga deras börser och låta statens järnhand diktera värdet på varje uns stål!"}, "date": "15 juli, 16:20", "url": "https://www.realtid.se/bors-finans/buffett-svart-att-hitta-varden-nar-alla-foredrar-att-spela/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/warrenbuffett.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kaos i Paris efter Frankrikes VM-uttåg mot Spanien", "summaries": {"normal": "Kaos utbröt i Paris efter Frankrikes 0-2-förlust mot Spanien i VM-semifinalen. Gator brann, föremål sattes i brand och upplopp följde. Polisen grep 141 personer i Paris och 40 i övriga Frankrike, främst för att ha riktat fyrverkerier mot blåljuspersonal. Artikeln påpekar att liknande våldsamma scener med invandrare har inträffat vid tidigare fotbollsevenemang i Frankrike.", "trump": "Titta på det här, det är ett fullständigt katastrofläge i Paris. Frankrike förlorade stort mot Spanien och plötsligt brinner hela staden. Invandrare springer runt och skapar kaos, precis som de alltid gör. De griper hundratals, men det räcker inte. Frankrike behöver starkare ledarskap, inte svaga ledare som låter det här fortgå. Sad!", "stalin": "Kamrater, ännu en gång visar de dekadenta borgarbrackorna i Paris sitt sanna ansikte när det franska laget förlorade mot de spanska revisionisterna. Gatubrand och sabotage är naturliga följder av klassfiendens infiltration bland de så kallade invandrarna. Vi ska rensa ut dessa kontrarevolutionära element med järnhand. 141 gripna i huvudstaden är bara början på den stora utrensningen av alla kapitalistiska parasiter och deras fotbollsrelaterade förräderi. Ha ha, låt dem brinna!"}, "date": "15 juli, 18:24", "url": "https://samnytt.se/video-upplopp-och-kaos-i-paris-efter-frankrikes-vm-uttag-mot-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/15155532/frankrike.png"}, {"type": "image-full", "heading": "Apple anklagar sin förre chefsdesigner för att stjäla hemligheter", "summaries": {"normal": "Apple har stämt OpenAI och hårdvarubolaget io Products, grundat av Apples förre chefsdesigner Jony Ive, för stöld av företagshemligheter. Apple hävdar att bolagen systematiskt rekryterat personal för att komma över konfidentiell information och hemliga prototyper. OpenAI avfärdar anklagelserna som ogrundade. Konflikten uppstår samtidigt som OpenAI förbereder lanseringen av en ny AI-enhet, vilket markerar en brytning mellan Apple och en av deras tidigare nyckelpersoner.", "trump": "Apple är i stora problem, riktigt dåliga grejer! Jony Ive, som jag känner väl, har lämnat skeppet och nu stämmer de honom och OpenAI för att de stulit deras hemligheter. Det är totalt kaos! De säger att folk tagit med sig prototyper till intervjuer. Väldigt ohederligt! OpenAI säger att det är falskt, men vi vet hur de där teknikkillarna fungerar. Jag bygger bättre prylar, vinner stort och skapar jobb. Apple borde ha koll på sitt folk. Mycket svagt!", "stalin": "Vi har observerat att kapitalismens förfall återigen manifesteras i Silicon Valley. Apple, detta giriga monument över västvärldens dekadens, anklagar nu sina egna desertörer för stöld av så kallade företagshemligheter. Jony Ive och hans kumpaner har splittrats i en intern fejd som påminner om de ruttna intrigerna i vår tids oheliga allianser. Likt Putin som rensar ut förrädare i periferin, ser vi hur dessa teknologiska lakejer vänder sig mot varandra. Det är en njutning att se deras inkompetenta försök att dölja sina egna brott."}, "date": "15 juli, 15:49", "url": "https://www.realtid.se/it-tech/apple-anklagar-sin-forre-chefsdesigner-for-att-stjala-hemligheter/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlbcvmwvhrptc-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Stora förvirringen: Trumps nya besked", "summaries": {"normal": "Trump-administrationen pausade ICE:s fordonskontroller efter två dödsskjutningar av agenter på en vecka. Trump kritiserade dock beslutet och menade att det gynnar brottslingar. ICE:s chef Tom Homan kallade pausen tillfällig. Offren, en mexikansk byggarbetare och en colombiansk man med arbetstillstånd, var inte måltavlor för depor
