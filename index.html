n vill med sin parasitiska arbetslinje undergräva arbetarnas trygghet och krossa kollektivets skydd. Jag ser deras giriga planer på att likvidera a-kassans själ. Inga kompromisser med folkförtryckarna! Vi ska rensa ut alla som sviker arbetarklassen. Deras kompromiss blir deras fall."}, "date": "8 september, 07:00", "url": "https://arbetet.se/2026/09/08/dragkamp-om-skatter-och-a-kassa-sa-blir-jobbpolitiken-om-s-mp-och-c-regerar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142507/smpc.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Det är inte svenskt att gamla dör med rutten mat i munnen", "summaries": {"normal": "Artikeln kritiserar Ulf Kristerssons och Tidöregeringens politik för äldreomsorgen. En granskning visar fall av allvarlig vanvård där en äldre kvinna dog under plågsamma förhållanden. Kommuner går med underskott, inflation urholkar bidragen och personalen har hög sjukfrånvaro. Författaren menar att löftena om satsningar är lögner och att välfärden förfaller.", "trump": "Folk, ni skulle se det här. Den svenska välfärden är en total katastrof, en riktig röra. Ulf och hans svaga vänsterliberala gäng lovar guld och gröna skogar men ger bara rutten mat och tortyr åt de gamla. Inflationen äter upp allt medan de låtsas satsa. Patetiska globalister som hellre sänker skatter än fixar vården. En skam, tro mig!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna låter den gemensamma välfärden ruttna. En gammal kvinna dör i tortyr medan byråkrater sparar på personal. De lovar satsningar men levererar underskott och utmattade undersköterskor som inte ens törs dricka vatten. Jag säger: sådana dekadenta parasiter förtjänar att rensas ut. Detta är fiendens verk."}, "date": "8 september, 06:57", "url": "https://arbetet.se/2026/09/08/det-finns-inget-svenskt-med-att-gamla-dor-med-rutten-mat-i-munnen-ulf-kristersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08065651/mat-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Spritfest hos EU-kopplad Northvolt-finansiär: ”Obegränsad alkohol”", "summaries": {"normal": "Det EU-finansierade riskkapitalbolaget InnoEnergy utreds för bedrägeri och kritiseras nu av tidigare anställda för lyxiga fester med obegränsad alkohol och onödiga flygresor för skattepengar. Kritiken följer på tidigare avslöjanden om bristfälliga utbildningar, misstänkta intressekonflikter och mångmiljonlöner för ledningen, vilket tecknar bilden av en osund företagskultur.", "trump": "Sorgligt! Det här EU-bolaget slösar bort enorma summor skattepengar på gigantiska fester med obegränsad sprit och värdelösa Minecraft-utbildningar medan ledningen håvar in hundratals miljoner. Totalt inkompetent! De pratar om grönt och klimat, men flyger runt överallt för meningslösa möten. Helt otroligt att de får hållas. USA gör det så mycket bättre, vi älskar framgång och riktiga affärer!", "stalin": "Dessa korrupta kapitalister slösar folkets resurser på bottenlösa spritfester och meningslösa flygturer medan deras skamliga utbildningar sker i barnsliga dataspel. En skam för arbetarklassen! Ledningen berikar sig med miljoner på statens bekostnad. Sådant slöseri tolereras icke i en sund stat; avvikarna och de skyldiga bör omedelbart granskas och skickas till omorganisering för det allmänna bästa."}, "date": "8 september, 06:05", "url": "https://www.affarsvarlden.se/artikel/spritfest-hos-eu-kopplad-northvolt-finansiar-obegransad-alkohol"}, {"type": "image-full", "heading": "Sandström: Medial sammansvärjning mot väljarkåren", "summaries": {"normal": "Torsten Sandström argumenterar för att svenska opinionsinstitut och medier hotar demokratin genom att okritiskt basera väljarbarometrar på kommersiella och osäkra grunder. Genom så kallad ”the bandwagon effect” styrs väljarna att tycka som andra, samtidigt som mörkertalet av osäkra väljare döljs. Författaren föreslår lagstiftning som tvingar fram tydligare redovisning av icke-svar och förbjuder mätningar tre månader före valdagen.", "trump": "De svenska fake news-medierna och de korrupta mätinstituten försöker lura folket med falska siffror! De gömmer den enorma gruppen tysta väljare och kör med totalt riggade staplar för att gynna vänstern genom den här töntiga bandvagnseffekten. En riktigt skamlig politisk cirkus! Jag säger er, vi behöver stark lagstiftning och ett totalförbud mot de här lögnaktiga mätningarna sista månaderna före valet. Make Sweden Great Again!", "stalin": "Dessa så kallade opinionsinstitut och korrupta tidningsskribenter bedriver en skadlig agitation mot statens stabilitet. Genom att dölja mörkertalet och manipulera massorna med färgglada diagram försöker de underminera ordningen. Vi ser hur de borgerliga organen sprider desinformation. Om regeringen vill bevara makten krävs fast hand: obligatorisk redovisning av alla avvikande element samt ett omedelbart förbud mot opålitliga mätningar innan folket går till valurnorna."}, "date": "8 september, 06:30", "url": "https://bulletin.nu/sandstrom-medial-sammansvarjning-mot-valjarkaren", "imageUrl": "https://cdn.bulletin.nu/articles/9c216f25-cc19-41d8-b677-2e59e3fb3d07/preview.png?t=1788775075000"}, {"type": "image-right", "heading": "Därför går det så bra för vänstern i storstäderna", "summaries": {"normal": "I Europas storstäder går vänstern framåt, inte minst i Stockholm där Vänsterpartiets stöd har fördubblats sedan 2010. Forskare pekar på tuff bostadsmarknad som orsak till missnöje mot kapitalismen. Samtidigt vinner Sverigedemokraterna stöd på landsbygden. Segregationen ökar med åldern och påverkar röstbeteenden samt attityder till mångfald.", "trump": "De galna vänsterextremisterna och deras gröna galningar tar över era usla europeiska storstäder medan de riktiga människorna på landsbygden röstar rätt. Stockholm? Total misär med tre miljoner för ett dass. De radikala ungdomarna skyller på kapitalismen istället för sina egna korkade idéer. Patetiskt! Jag byggde murar, de bygger misär.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna skapar segregation som splittrar folket. I storstäderna rasar de unga mot bostadsmisären och pekar på kapitalismen, precis som det ska vara. På landsbygden växer andra reaktionära krafter. Denna olyckliga utveckling kräver ideologisk vaksamhet och utrensning av alla dekadenta influenser som splittrar arbetarklassen."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/innehall/darfor-gar-det-sa-bra-vanstern-storstaderna", "imageUrl": "https://www.dagensarena.se/files/2026/09/stockholm-foto-ole-neitzelwikimedia-300x157.jpeg"}, {"type": "image-right", "heading": "Därför är indexerade statsbidrag årets viktigaste vallöfte", "summaries": {"normal": "Socialdemokraterna föreslår att indexera de generella statsbidragen till kommuner och regioner. Förslaget syftar till att motverka att bidragens värde urholkas av inflation och löneökningar, vilket annars leder till smygbesparingar. Det skulle ge bättre förutsägbarhet och långsiktighet i planeringen av vård, skola och omsorg. Markus Dalström argumenterar för att det förbättrar välfärdens villkor.", "trump": "Lyssnar ni på de svenska socialisterna som vill indexera bidragen? Det är patetiskt. De kan inte ens hålla sina egna kommuner flytande utan att suga mer pengar från folket. Biden skulle ha älskat det här – mer byråkrati, mer slöseri. Jag fixade en stark ekonomi i USA, de borde lära sig av en vinnare istället för att gömma sig bakom teknikaliteter och vänsterns misslyckade välfärdsdrömmar.", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter statsbidragen ruttna i värde medan arbetarnas välfärd förfaller. Jag ser deras smygbesparing som ett angrepp på kollektivet. Indexering är ett steg mot ordning, men vi måste rensa ut alla dekadenta element som vägrar planera för folket. Välfärden tillhör inte de giriga parasiterna – den tillhör staten och framtiden. Försök inte lura oss."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/opinion/darfor-ar-indexerade-statsbidrag-arets-viktigaste-vallofte", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-07t145509709-300x157.jpg"}, {"type": "image-right", "heading": "Regioner: Regeringens kösatsning har gett fel patienter förtur", "summaries": {"normal": "Regeringens riktade miljardstöd till operationer av grå starr, höftproteser och framfall har kortat vissa vårdköer men lett till undanträngning av patienter med större medicinska behov. Flera regioner kritiserar satsningen och varnar för att den försvårar prioriteringsarbetet. Sjukvårdsminister Elisabet Lann (KD) anser att regionerna inte får frångå behovsprincipen.", "trump": "De här korkade svenska byråkraterna och deras socialistiska sjukvård har fullständigt saboterat allt med sina dumma riktade bidrag. Patienter med riktiga problem trängs undan medan de prioriterar vad som helst för att suga åt sig statliga pengar. Patetiskt! Ni borde lyssna på mig, inte på de woke-vänliga köerna som Biden lämnade efter sig.", "stalin": "Jag ser hur dessa profitthungriga klassförrädare i regionerna vrider sig som maskar under trycket från statens riktade medel. De vågar undantränga de mest behövande och kallar det prioritering. En sådan dekadens kräver omedelbar utrensning av alla som sätter personlig vinst före folkets hälsa. Kamrater, vakna upp mot dessa parasiter!"}, "date": "8 september, 05:41", "url": "https://www.svt.se/nyheter/inrikes/kritik-mot-regeringens-riktade-kosatsning-overskjutning-till-lagre-prioriterade-patienter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.59/0.48/94f5199a4bfe433af7867f2f6b5a2b753951303c2cf80e03162d94deeb3f69b9"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "Sverigedemokraternas rysskontakter utsätter oss alla för fara", "summaries": {"normal": "Expo har avslöjat att en SD-tjänsteman i riksdagen haft upprepade kontakter med ryska intressen. Tjänstemannen är sambo med Jimmie Åkessons närmaste medarbetare Gustav Gellerbrant. Artikeln lyfter en längre rad incidenter med SD-politiker och Ryssland, och ifrågasätter säkerhetsrisker samt behovet av skärpta granskningar i riksdagen och regeringskansliet.", "trump": "De här patetiska SD-tjänstemännen dansar som marionetter för Putin och hans ryska kumpaner. Gellerbrant och hans sambo borde skämmas! Fake news-mediets vänsterhyenor försöker skrämma väljarna precis som de gjorde mot mig innan jag krossade Biden och de globalistiska förlorarna. Sverige behöver starka ledare, inte dessa svaga ryssälskande töntar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Sverigedemokraterna kryper för ryska intressen och sprider främmande narrativ. Jag betraktar med avsky hur de giriga hyenorna låter sig påverkas av mjuk makt från öst. En sådan kanal in till regeringskansliet utgör ett hot som kräver omedelbar utrensning av alla opålitliga element för att skydda folkets intressen."}, "date": "7 september, 16:11", "url": "https://www.dagensarena.se/opinion/sverigedemokraternas-rysskontakter-utsatter-oss-alla-fara", "imageUrl": "https://www.dagensarena.se/files/2026/09/silvia.jpeg"}, {"type": "image-full", "heading": "V-kandidater i Västsverige stryks efter granskning", "summaries": {"normal": "Åtta nya Vänsterpartistiska kandidater i Västsverige och andra orter har strukits från vallistorna efter en granskning i Expressen. Personerna anklagas för att ha spridit antisemitiska konsekvenser, hyllat Hamas samt uttryckt stöd för Vladimir Putin på sociala medier. Partiets ledning med Nooshi Dadgostar i spetsen uppger att personerna inte hör hemma i partiet och att de saknade valbara platser.", "trump": "Vänsterpartiet i Sverige är totalt kaotiskt, en riktig katastrof! De rensar ut radikala kandidater på löpande band efter att media avslöjat att de hyllat Putin, Hamas och spridit galna konspirationsteorier. Till och med radikala vänsterextremister skrattar åt det här cirkuset. Nooshi Dadgostar har noll koll på sitt eget folk. Väldigt svagt ledarskap, inte bra alls!", "stalin": "Vi konstaterar att partiapparaten i Sverige lider av svår ideologisk vacklan. När illojala element avslöjas med att sprida borgerliga konspirationer och tvivelaktiga sympatier rensas de genast bort från listorna av kamratledningen. Endast absolut disciplin och renlärighet kan tillåtas. Eventuella brister i kadrernas vaksamhet kommer att utredas internt med största skärpa."}, "date": "7 september, 21:20", "url": "https://www.gp.se/politik/vansterpartister-i-vastsverige-har-strukits-efter-granskning.3f83db48-83a6-4791-8f3e-c92bd90d34c5", "imageUrl": "https://www.gp.se/images/article/3f83db48-83a6-4791-8f3e-c92bd90d34c5/images/3jLAH8z_q6ZnBUc5NLB-9jmmM8us-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Strömmer skickas fram som M:s vassaste vapen", "summaries": {"normal": "Moderaterna använder justitieminister Gunnar Strömmer som sitt vassaste vapen inför valet. Trots att partiet ligger illa till och riskerar att bli mindre än Sverigedemokraterna, satsar de på hans höga förtroende. Strömmer syns alltmer i debatter utanför sitt revir och toppar listan över talartid i riksdagen med över 45 timmar.", "trump": "De här loser-moderaterna håller på att drunkna och skickar fram den där glasögonprydde Strömmer som sin sista desperata räddning. Patetiskt! Han babblar i 45 timmar i riksdagen som en tråkig jurist på glöggkalas. De kommer ändå att förlora stort mot de smarta Sverigedemokraterna. Sad!", "stalin": "Jag betraktar med förakt hur dessa borgerliga revisionister i desperation lyfter fram sin långrandiga advokat Strömmer som en falsk folkets hjälte. Hans 45 timmars tomma pladder avslöjar klassfiendens svaghet. Inga glasögonimmade tal kan rädda det döende partiet från folkets dom. Fienderna skälver redan."}, "date": "7 september, 20:13", "url": "https://www.tv4.se/artikel/7vAvYtWzIYu13Pltby4tJa/daerfoer-skickar-moderaterna-fram-stroemmer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-full", "heading": "S använde gangsterrappare i Tiktok-inlägg: ”Inget vi står bakom”", "summaries": {"normal": "Socialdemokraterna i Stockholm publicerade ett TikTok-inlägg med en bild på två gangsterrappare riktat till förortsväljare. Den ene rapparen är dömd för grovt vapenbrott och kvinnofridskränkning, den andre för rån och narkotikabrott samt kopplas till kriminella nätverk. Partiet tog snabbt bort inlägget och meddelade att det inte står bakom det samt att rutinerna brustit.", "trump": "Kan ni fatta det här? De svenska socialisterna, de riktiga förlorarna, använder gangsterrappare med brottsregister längre än Bidens tupplurar för att locka röster i förorten. Patetiskt! De tar ner det fortare än Sleepy Joe springer från frågor. Rena skämtet, folk. Rena skämtet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta socialdemokratiska element i desperation allierar sig med kriminella element för att vinna arbetarklassens gunst. Sådana fiender till folket måste omedelbart likvideras ur partiet. Rutinerna brast? Det är sabotage. Kamrater, vakna upp innan kontrarevolutionen slår till."}, "date": "7 september, 20:09", "url": "https://www.tv4.se/artikel/6OwrxJxPxMVj3YppGe5L9H/s-anvaende-gangsterrappare-i-tiktok-inlaegg-allvarligt-samtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7fHecPtuBdZEUJYCoGe4HW%2F6ba81349016f8c267ac93475ac192dc2%2F07-forortssossar-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Boende på gruppboende örfilades av personal", "summaries": {"normal": "En anställd på ett LSS-gruppboende i Värmland har sparkats efter att ha misshandlat en boende. Händelsen, som bevittnades av kollegor, inträffade i samband med en tvättsituation där personalen utdelade örfilar och kastade vatten i ansiktet på den boende. En anmälan gällande allvarligt missförhållande har lämnats in till IVO av Sunne kommun.", "trump": "Sorgligt! En total katastrof på ett svenskt boende där radikala vänsterregler har förstört disciplinen. Personalen misshandlade en försvarslös person – helt oacceptabelt! Jag känner till boenden, tro mig, mina boenden är fantastiska, absolut bäst. Vi sparkade dem direkt, bam! Sverige behöver mer lag och ordning, och snabbt ska det gå. Endast det bästa duger!", "stalin": "Ett avskyvärt sabotage mot statens mest sårbara medborgare! Denna så kallade vårdare har visat prov på bourgeoisins mest ruttna moral och förrått kollektivets tillit. Vi har därför omgående rensat bort elementet från verksamheten. Disciplin måste upprätthållas med järnhand, och varje avsteg från kamratlig omvårdnad kommer att bemötas med statens fulla vrede. Ingen nåd för sabotörer!"}, "date": "8 september, 07:00", "url": "https://samnytt.se/boende-pa-gruppboende-orfilades-av-personal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/09/07132552/dusch-ivo.jpg"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Här är prislappen på  MP:s lediga fredag", "summaries": {"normal": "Miljöpartiet påstår att en förkortad arbetsvecka till 35 timmar blir gratis efter statliga uppstartskostnader, då personalen blir mer effektiv. Men sjukhusförsök i Stockholm visar på kraftigt försämrad ekonomi, färre operationer och stora ekstrakostnader för regionen. Personalen sparar återhämtningstimmar för ledighet, och tidigare försök bekräftar att liknande reformer kräver dyr nyanställning.", "trump": "Miljöpartiet i Sverige är fullständigt galna! De tror att folk kan jobba mindre och att det magiskt nog inte kostar ett öre. Sjukvårdsförsöken i Stockholm är en katastrof – färre operationer och skattebetalarna får tvingas betala notan för deras fejkade succéer. Totalt inkompetent, precis som radikala vänsterpolitiker alltid är!", "stalin": "Dessa så kallade miljöpartister ägnar sig åt skadlig utopi och sabotage mot statens produktivitet. Medan de drömmer om lathet och t-tröjor avslöjar sjukhusens rapporter att reformen skapar ekonomiskt kaos och minskad effektivitet. Vi noterar deras misslyckanden noggrant; i en sund stat styrs arbetstiden med järnhand, inte med flum och improduktivt dagdriveri."}, "date": "8 september, 06:10", "url": "https://www.expressen.se/ledare/ann-charlotte-marteus/har-ar-prislappen-pa-mps-lediga-fredag", "imageUrl": "https://static.bonniernews.se/ba/b4ca29a7-2718-4c98-bb83-f5cdd0ccf11f.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Åkesson: ”L kommer att kravla sig över den där spärren”", "summaries": {"normal": "Jimmie Åkesson kommenterar Liberalernas uppgång i opinionsmätningarna. I Novus senaste mätning når L 4,3 procent och ser ut att klara riksdagsspärren. Åkesson menar att hans tuffa deadline mot L kan ha bidragit till trenden på marginalen, men att det är liberala röster – inte SD-röster – som räddar partiet. Han väntar ett jämnt val.", "trump": "Titta på de där ynkliga liberalerna som kryper över spärren som en sjuk hund som vägrar dö. Jimmie satte en deadline och plötsligt vaknar de! Men tro inte att det är tack vare hans smarta drag – det är bara de gamla Reinfeldtmoderaterna som röstar på dem igen. Patetiskt. Jag skulle ha vunnit det valet på en timme, tro mig.", "stalin": "Se hur de borgerliga parasiterna kravlar sig över spärren som rädda råttor undan folkets dom. Jag betraktar med förakt hur denna liberala förrädarklick räddas av Reinfeldtmoderater, de dekadenta resterna av en svag stat. Deadlines och utspel – allt teater för att dölja klassfiendens svaghet. Kamrater, sådana element förtjänar ingen nåd i historien."}, "date": "7 september, 18:55", "url": "https://www.tv4.se/artikel/tUxwVPwLTRKOjr629vfxC/akesson-saeker-l-kommer-att-kravla-sig-oever-den-daer-spaerren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl11vnn4E-2xg%2F20a781622fb1418bafe290bb401beb95%2FSverigedemokraternas_partiledare_Jimmie_akesson_presenterar_partiets_valmanifest_pa_Stora_torget_i_Nykoping.&width=1024"}, {"type": "image-right", "heading": "Det känns som att jag scrollar på Tinder", "summaries": {"normal": "Caroline Ringskog Ferrada-Nolis novellsamling Sex in the city skildrar relationer i ett samtida, avförtrollat Europa. Recensenten Jens Liljestrand menar att språket har lyriska kvaliteter och att skildringarna av det kroppsliga är träffsäkra. Samtidigt kritiseras boken för att vara ett monotont ältande av storstadsvilsenhet snarare än traditionella berättelser.", "trump": "Den här boken, Sex in the city, totalt misslyckad! Sämsta jag sett. En svensk författare staplar ord på varandra, bara gnäll och meningslöst ältande. Som att scrolla på Tinder, ett totalt blurr av svaga själar. Tråkigt! Enda ljusglimten var vaxteknologen från Ukraina, men resten? En katastrof. Helt otroligt att någon köper det.", "stalin": "Denna bourgeoisons meningslösa prosaskisser uppvisar en farlig ideologisk brist på riktning. Istället för kollektivets uppbyggnad ägnar man sig åt ett dekadent, självupptaget ältande i storstadens tomrum. Endast den ukrainska vaxteknologen som rensar bort det oväsentliga visar prov på ett disciplinerat arbete. Vi noterar detta litterära misslyckande i våra arkiv."}, "date": "8 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/det-kanns-som-att-jag-scrollar-pa-tinder", "imageUrl": "https://static.bonniernews.se/ba/d0288a9a-ab6b-4481-90a1-87c8f42a5f04.jpeg?crop=526%2C526%2Cx648%2Cy170&width=210&quality=60"}, {"type": "image-right", "heading": "Jag hoppas att  Carola får bli fri. Biografin är som en Ikeamöbel", "summaries": {"normal": "I en recension av Carolas självbiografi Frigörelsen skriver Martina Montelius att artisten trots sin storhet framstår som en person som alltid varit ägd. Boken beskriver hur hon tidigt försörjde familjen och styrdes av föräldrar och äkta män, samt hennes koppling till starka religiösa rörelser. Recensenten upplever boken som en blank broschyr snarare än en riktig frigörelse.", "trump": "Carola, en fantastisk sångerska, men vilken fruktansvärd röra med familjen och hennes ex-män som kontrollerade allt! Fake media kallar boken en frigörelse, men hon ägdes av alla. Själv är jag den friaste personen i historien, och jag vinner alltid. Hon borde ha ringat in mig för råd om affärer och pengar, för det här är totalt katastrofalt skött!", "stalin": "Denna artist, Carola, har levt i bojor under kapitalistiska manager-föräldrar och parasiterande äkta män som ropat åt sig hennes enorma kapital. Statskommittén konstaterar att en sann frigörelse endast sker genom kollektivets järnhand, inte genom religiösa sekter eller popmusik. Vi kräver en omedelbar granskning av hennes ekonomiska transaktioner för att skydda statens intressen mot exploatering."}, "date": "8 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/jag-onskar-att--carola-far-bli-fri", "imageUrl": "https://static.bonniernews.se/ba/d4ad854c-ab61-492c-a315-afd05a0b14b6.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "text", "heading": "Svagt uppåt för Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen stängde måndagen svagt uppåt på 0,24 procent, stöttad av tekniksektorn och en stor fusionsplan mellan Rejlers och Multiconsult. Synact Pharma och SHT Smart High-Tech rusade efter starka forskningsbesked respektive en riktad nyemission, medan flera bolag fick uppdaterade rekommendationer från analyshusen.", "trump": "Stockholmsbörsen gick upp, vilket inte förvånar någon, för jag har alltid sagt att marknaderna älskar vinnare! Rejlers gör en enorm affär med norrmännen, precis som mina fantastiska handelsavtal. SHT Smart High-Tech rusade nästan 50 procent – otroliga siffror, total succé! Under radikala vänsterstyren brukar det bara vara tårar, men här är det klass, precis som jag!", "stalin": "Stockholmsbörsens marginella uppgång på 0,24 procent bevisar att kapitalismens kugghjul snurrar vidare, men vi noterar med ideologisk vaksamhet att vissa aktörer, såsom SHT Smart High-Tech, drar till sig suspekta spekulativa rikedomar. Rejlers och Multiconsult planerar en kolossal fusion – ett syndikat av 8 000 arbetare som måste övervakas noga av statliga kommissarier så att inga kontrarevolutionära avvikelser uppstår!"}, "date": "7 september, 17:38", "url": "https://www.affarsvarlden.se/artikel/svagt-uppat-for-stockholmsborsen"}, {"type": "image-right", "heading": "Image Systems nyemission övertecknad", "summaries": {"normal": "Image Systems företrädesemission av aktier har tecknats till 122 procent. Bolaget tillförs 20,8 miljoner kronor efter emissionskostnader. Emissionen, där huvudägaren Tibia Konsult spelade en stor roll, var fullt säkerställd. Aktien handlades under perioden strax över teckningskursen på 0,60 kronor. Emissionsguiden sätter därmed punkt för sin bevakning.", "trump": "Image Systems gjorde en fantastisk emission, otroliga 122 procent! Många sa att det inte skulle gå, falska nyheter, men de fick in varenda dollar – eller krona, en enorm summa på över tjugo miljoner! Huvudägaren klev fram och visste exakt vad han gjorde. En enorm seger, enorm! Alla vill köpa, precis som med mina golfbanor. Helt otroligt!", "stalin": "Mätteknikbolaget Image Systems har genom Folkets och aktieägarnas vilja uppnått en teckningsgrad på 122 procent. Inga avvikelser eller sabotage tolererades, och 20,8 miljoner kronor har säkrats till statens... förlåt, bolagets kassa. De som tvekade under teckningsperioden har noggrant noterats i våra register. En storslagen seger för ordning och reda!"}, "date": "7 september, 17:29", "url": "https://www.affarsvarlden.se/artikel/image-systems-nyemission-overtecknad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/11/pom_testrange-400x267.jpg"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-full", "heading": "Elon Musk gratulerar AFD till valsegern", "summaries": {"normal": "Efter det tyska delstatsvalet i Sachsen-Anhalt, där det högerradikala partiet AFD gjort stora framsteg, har teknikomandern och mångmiljardären Elon Musk gratulerat partiet på plattformen X. Musk, som tidigare stöttat partiet och hånat tyska ledare, fick positiva svar från AFD-toppen Ulrich Siegmund, som ser fram emot ett framtida samarbete för att locka investeringar till Tyskland.", "trump": "Elon Musk skickade just en jättebra gratulation till AFD i Tyskland efter deras enorma valsuccé. Fantastiska människor! De svaga tyska politikerna, som Scholz, har förstört landet fullständigt. Tyskland brukade vara bäst, men nu behöver de sunt förnuft och starka ledare. Elon vet vad som gäller. Om de samarbetar rätt kan Tyskland bli framgångsrikt igen, precis som vi gör i USA!", "stalin": "Det kapitalistiska Tyskland skakar i sina grundvalar när reaktionära element firar nya triumfer. Monopolkapitalisten Musk, denna västerländska oligark, försöker styra händelseförloppet genom sina digitala kanaler och hyllar sina gelikar i AFD. Våra organ noterar hur bourgeoisien slåss om spillrorna. Vi kommer noga övervaka denna utveckling och ställa alla opportunister till svars inför historiens obevekliga domstol."}, "date": "7 september, 16:43", "url": "https://www.gp.se/nyheter/varlden/elon-musk-gratulerar-afd-till-valsegern.07281221-277d-4677-9ffb-628cd9e88d7e", "imageUrl": "https://www.gp.se/images/article/07281221-277d-4677-9ffb-628cd9e88d7e/images/1kWrr1kr-1FAmADlpl-175g99PJ4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Statsministern om V:s kandidatskandal: ”En röta som går djupt”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Vänsterpartiet efter att åtta kandidater petats för spridning av antisemitiskt material och hyllningar till Hamas. Han kallar det en djup röta i vänsterleden och kräver att Socialdemokraterna tar ställning innan valet. S partisekreterare Tobias Baudin säger att V har ett stort internt arbete att göra.", "trump": "Titta på det här! Vänsterpartiet är fulla av antisemiter och terrorälskare som hyllar Hamas och Putin. Den röda rötan går så djupt att till och med den sömniga Magdalena Andersson inte kan ducka längre. De vill ha en regering med radikala vänsterextremister. Det blir en katastrof, folk! Rösta smart på söndag.", "stalin": "Kamrater, se hur den dekadenta vänstern ruttnar inifrån som en förrädisk parasit. Jag betraktar med avsmak hur dessa opportunister sprider antisemitiskt gift och sedan febrilt försöker dölja spåren. Socialdemokraterna vacklar som ynkliga revisionister. Endast en järnhand kan rensa ut sådana element innan de förgiftar hela kollektivet."}, "date": "7 september, 15:41", "url": "https://www.tv4.se/artikel/7z1v0pmhudhsBH1EPtzUg1/statsministern-om-v-s-kandidatskandal-en-roeta-som-gar-djupt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F99GIJ3zNtg9VkTOu1LTUb%2Fb2691c5f937e5a23da46520582f623c7%2F07-kristersson-webb.jpg&width=120"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "DN-reporter: Carl-Oskar Bohlin pratar för komplicerat", "summaries": {"normal": "En debatt har uppstått efter att DN-korrespondenten Anna-Lena Laurén och krönikören Alex Schulman kritiserat civilförsvarsminister Carl-Oskar Bohlin (M) för ett alltför komplicerat språkbruk. Kritikerna får dock mothugg av läsare och debattörer som menar att ministerns vuxna språk snarare visar på god språkbehärskning och att journalisternas klagomål tyder på en nedlåtande syn på allmänheten.", "trump": "Falska nyheter från misslyckade journalister! De gråter ut för att en smart minister talar som en vuxen man med stora ord som 'utfallsrum'. Otroligt! Själv använder jag bara de bästa orden, enkla ord som folk förstår, men de här DN-skribenterna verkar helt klenmodiga. De borde skärpa sig och ägna sig åt riktiga problem i stället för att gnälla!", "stalin": "Dessa dekadenta svenska journalister gråter ut över att en minister talar med statsmannamässig auktoritet och begripliga facktermer. Det visar på en farlig intellektuell svaghet och bristande disciplin inom pressen. Vi har noterat deras bristande förmåga att processa enkel information. Sådana bourgeoisyns klagomål bör omedelbart beivras med en obligatorisk kurs i statlig terminologi och ordning!"}, "date": "8 september, 06:00", "url": "https://samnytt.se/dn-reporter-carl-oskar-bohlin-pratar-for-komplicerat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07143803/carl-oskar-bohlin-anna-lena-lauren.jpg"}, {"type": "image-right", "heading": "Välfärden riskerar att gå på tomgång", "summaries": {"normal": "Aftonbladets ledarsida kritiserar den nuvarande regeringen för att underfinansiera välfärden i skola, vård och omsorg under inflationen. På grund av utebliven inflationsjustering av statsbidragen varnar Socialdemokraterna för en urholkning på 14 miljarder kronor kommande fyra år. S föreslår därför indexerade statsbidragen och att stoppa vinster i privata välfärdsbolag för att rädda arbetsmiljön.", "trump": "Sveriges regering har totala problem, det är en stor katastrof, believe me! De skär ner fjorton miljarder på skolor och sjukvård, hemskt! Folk torkar barn med strävt papper, helt otroligt dåligt. Socialdemokraterna gnäller, men jag skulle lösa det på en sekund med massiva segrar och noll inflation. Riktigt fejk-styre i Norden, totalt misslyckande!", "stalin": "Den svenska välfärdens förfall visar kapitalismens absoluta bankrutt. När statens resurser läcker ut till privata bolag och byråkratin ransonerar papper och blöjor, lider arbetarklassen under den härskande klassens misslyckanden. Vi noterar att fjorton miljarder saknas; sådana misstag tolereras icke i en sund stat. Ett resolut systemskifte krävs omedelbart för att återställa ordningen i leden."}, "date": "8 september, 06:00", "url": "https://www.aftonbladet.se/ledare/a/Bxeerw/30-000-farre-underskoterskor-om-tido-vinner", "imageUrl": "https://akamai.vgc.no/v2/images/884bdd49-3c59-3c3b-8f7a-fc5add4502e6?fit=crop&format=auto&h=960&tight=true&w=1440&s=34362fa476efb556c6de81de30370b19a1222fbb"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Nioåringar tvingades gå ner på knä och be till Allah – inga åtgärder mot skolan", "summaries": {"normal": "En lärare på Nyhamnsskolan utanför Höganäs lät tredjeklassare knäböja och be till Allah under en SO-lektion utan att tydligt informera om att det var frivilligt. Skolinspektionen har avskrivit ärendet utan vidare utredning. Kommunen och rektorn medger att informationen borde ha varit tydligare, men anser inte att skollagen brutits. Böneövningen tas nu bort.", "trump": "Kan ni fatta det här? Små svenska nioåringar tvingas ner på knä och be till Allah i skolan medan de woke domarna i Skolinspektionen bara tittar bort. Totalt fiasko! De giriga mångkulturhyenorna har förstört ert fina land. Men jag, som besegrade Sleepy Joe och styr USA igen, säger: Sluta med den här galna identitetspolitiken innan det är för sent. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta toleransparasiter tillåter att oskyldiga barn tvingas utföra främmande böneritualer i en så kallad skola. Den borgerliga statens svaga hand skakar av rädsla för att kalla saken vid dess rätta namn. Vi skulle ha genomfört en grundlig utrensning av alla sådana element redan vid första rapporten. Förskräckande svaghet."}, "date": "7 september, 17:39", "url": "https://www.friatider.se/nioaringar-tvingades-ga-ner-pa-kna-och-be-till-allah-inga-atgarder-mot-skolan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-838.jpg"}, {"type": "image-full", "heading": "V är ett större bekymmer än SD för Sveriges säkerhet", "summaries": {"normal": "Sverige har rustat upp militärt och stärkt sina internationella försvarsband under mandatperioden. Medan Sverigedemokraterna stöttar regeringens utrikes- och försvarslinje, utgör Vänsterpartiet ett större säkerhetshot genom sin vilja att lämna Nato och säga upp försvarsavtalet med USA. Säkerhetsrisker kring enskilda SD-medarbetare bör hanteras av Säpo, men V:s politik skulle ge dem skadlig vetomakt.", "trump": "Sverige har gjort ett fantastiskt jobb med att bygga upp sitt försvar och samarbeta med oss, tro mig! Men tänk att vissa tror att några gamla Facebook-inlägg från en SD-sekreterare är problemet. Vakna upp! Det riktiga säkerhetshotet är ju det radikala vänsterpartiet som vill lämna Nato och riva upp vårt stora, vackra militäravtal. Total katastrof!", "stalin": "Sverige pratar om säkerhet, men darrar som löv under kapitalismens ok. De oroar sig för några obetydliga byråkratiska sekreterare på internet medan de blint kastar sig i armarna på Natos krigshetsare. Om de verkligen vill tala om ordning borde de rensa ut de vacklande elementen och ställa alla dessa splittrade politiska fraktioner inför rätta!"}, "date": "7 september, 16:00", "url": "https://www.gp.se/ledare/v-ar-ett-storre-bekymmer-an-sd-for-sveriges-sakerhet.cb0a71b4-0251-47c4-9c10-20b8fc6fd37d", "imageUrl": "https://www.gp.se/images/article/cb0a71b4-0251-47c4-9c10-20b8fc6fd37d/images/13eUcj_1uWHOhUrSfs6YMBYEVKi4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Bohlin om Alex Schulman: ”En ärkemobbare”", "summaries": {"normal": "Kåsören Alex Schulman kritiserar i Dagens Nyheter civilförsvarsminister Carl-Oskar Bohlin (M) för att använda svåra och svårbegripliga ord. Schulman menar att ministerns krångliga språkbruk skapar oro inför kriser. Bohlin avfärdar kritiken med ett skratt, kallar Schulman för en ärkemobbare som ägnar sig åt smutskastning på beställning, och hävdar att folk förstår honom utmärkt.", "trump": "Dessa misslyckade tidningar och fejk-krönikörer, totala förlorare! En kille som heter Schulman gråter ut i gamla radikala Dagens Nyheter för att ministern, en fantastisk person, använder ord som är för stora för hans lilla hjärta. Ministern svarar perfekt och sätter mobbaren på plats. Ingen har någonsin sett maken till svaghet. Själv vinner jag mot alla odds!", "stalin": "En så kallad krönikör vid namn Schulman försöker sabotera för statens civilförsvar genom att ifrågasätta minister Bohlins mäktiga terminologi. Detta subversiva agerande avslöjar en fiende till ordningen. Vår lojala minister har helt rätt som stämplar denna skribent som en ärkemobbare. Sådana element som sprider osäkerhet bör omedelbart omkoloniseras till mer produktiva uppgifter i arktiska miljöer."}, "date": "7 september, 20:01", "url": "https://bulletin.nu/bohlin-om-alex-schulman-en-arkemobbare", "imageUrl": "https://cdn.bulletin.nu/articles/d53e0dc5-304f-4e4a-9875-6dacf61d67e0/preview.jpg?t=1788788703000"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Raseri mot Trumps nya stora besatthet", "summaries": {"normal": "Donald Trump har lanserat ett förslag om att döpa om delstaten New Mexico till New America och publicerade en mängd inlägg på Truth Social. Förslaget har väckt stark ilska och ett unisont motstånd bland delstatens politiker som försvarar dess historiska arv. Presidenten saknar dock formell makt att enväldigt ändra ett delstatsnamn som är inskrivet i konstitutionen.", "trump": "New Mexico har blivit totalt misskött, men mitt förslag om att döpa om skiten till NEW AMERICA är genialt och enormt mycket snyggare! Demokraterna gråter som vanligt, men folket älskar det. Jag släppte sju fantastiska inlägg på en minut, och även om de gråtande politikerna där borta tror de kan stoppa oss, så vinner vi alltid till slut!", "stalin": "Statens organ har med tillfredsställelse noterat den ideologiska kampen kring New Mexicos geografiska nomenklatur. Att den härskande makten i Washington försöker skriva om kartan med digitala flygblad visar på ett sunt sinne för disciplin. Lokala element som klamrar sig fast vid gamla historiska privilegier bör underkastas omedelbar granskning av det kollektiva medvetandet. Längre liv åt gränsjusteringarna!"}, "date": "8 september, 04:55", "url": "https://www.expressen.se/nyheter/varlden/raseri-mot-trumps-nya-stora-besatthet", "imageUrl": "https://static.bonniernews.se/ba/9c679f1a-eca2-46db-a15d-98faa25ff74d.png?crop=534%2C534%2Cx178%2Cy0&width=210"}, {"type": "image-right", "heading": "Lärare uppmanade lågstadieelever att be islamisk bön: ”Allahu akbar”", "summaries": {"normal": "En lärare på Nyhamnsskolan i Höganäs uppmanade tredjeårselever att utföra en islamisk bön under lektionstid, inklusive frasen ”Allahu akbar”. Föräldrar anmälde händelsen, men Skolinspektionen har valt att inte utreda den vidare. Rektorn säger att syftet inte var att påverka elevernas tro. Beslutet kritiseras av en expert i konstitutionell rätt.", "trump": "Kan ni tro det? I Sverige tvingar de små barn att knäböja och ropa ”Allahu akbar” mitt i lektionen. Skolinspektionen, de där patetiska woke-byråkraterna, tittar bort och gör ingenting. Totalt vansinne! Under Biden blev hela väst en lekplats för radikal islam och identitetspolitik. Men nu är jag tillbaka, och den här galenskapen kommer att få ett abrupt slut.", "stalin": "Kamrater, se hur de dekadenta religionshyenorna smyger in sin propaganda i våra barns skolor. Jag betraktar med djup misstro hur staten vägrar utreda detta uppenbara brott mot folkets sekulära enhet. En sådan svaghet luktar förräderi. Vi måste rensa ut alla som låter främmande gudar underminera arbetarklassens fosterland. Detta är en varning till alla klassförrädare."}, "date": "7 september, 19:02", "url": "https://riks.se/nyheter/larare-uppmanade-lagstadieelever-att-be-islamisk-bon", "imageUrl": "https://admin.riks.se/uploads/medium_Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_732fc70f98.png"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Bra att Strömmer flörtar med C", "summaries": {"normal": "Moderaternas justitieminister Strömmer accepterar alla Centerpartiets krav för att få stöd till en borgerlig regering. Kraven inkluderar sänkta skatter för småföretag, satsningar på grön industri, stärkt ungdomspsykiatri, polisgaranti på landsbygden och stöd till bönder. Artikeln ifrågasätter om C verkligen prioriterar inflytande eller bara vill känna sig bra.", "trump": "De här svenska politikerna är totala losers. Strömmer gör ett lysande drag och accepterar alla krav från det patetiska mellanmjölkspartiet C. De gröna globalisterna och de woke småborgarna vill bara känna sig fina i magen medan de flyr från verkligheten. Patetiskt! Jag skulle aldrig ge efter för sådana svaga identitetspolitiker. Amerika först, alltid.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna dansar sin fåniga vals. Jag betraktar med förakt hur de profitthungriga borgarbrackorna gnuggar geniknölarna och lovar allt för att vinna stöd från det förvirrade centristiska träsket. Deras paranoia om inflytande är löjlig. En sann utrensning av sådana opportunister vore på sin plats. Revolutionen skrattar åt er svaghet."}, "date": "7 september, 19:01", "url": "https://riks.se/opinion/markus-johansson-martis-bra-att-strommer-flortar-med-c", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_89_e81bced61e.jpg"}, {"type": "image-right", "heading": "Scanias Pride-lastbil ställdes mitt framför kristen demonstration", "summaries": {"normal": "En Scania-lastbil placerades framför en kristen demonstrationsgrupp som sjöng lovsång under Södertälje Pride. Företaget uppger att det gjordes för att skapa lugn och arbetsro för ungdomar i ett tält. Kritiker ser det som en blockad. Händelsen har väckt starka reaktioner i sociala medier. Scania-ledningen meddelar att de behöver tid för att kommentera.", "trump": "Folk, det här är ett fullständigt skämt. Den där woke-pridecirkusen i Södertälje blockerades av en lastbil – och chefen kallar det ”lugnt och skönt”. Patetiska kristna sjunger psalmer medan de radikala HBTQ-aktivisterna skriker. Scania borde skämmas, men de är för fega. Biden-era svaghet har spridit sig till Sverige. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga prideparaden tvingas tystas av en lastbil. Jag ler i graven. Dessa profitthungriga hyenor och deras falska tolerans avslöjar sig själva. Ungdomarna fick arbetsro – en tillfällig seger mot den moraliska förruttnelsen. Vi skulle ha rensat ut hela spektaklet permanent. Paranoia breder ut sig bland fienderna."}, "date": "7 september, 18:59", "url": "https://riks.se/nyheter/scania-lastbil-blockerade-kristen-lovsang-under-sodertalje-pride", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_7_2026_11_16_50_AM_852c111911.png"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Moderata ministern kritiserade SVT – nu skjuter SVT upp intervjun", "summaries": {"normal": "SVT har skjutit upp publiceringen av en intervju med civilförsvarsminister Carl-Oskar Bohlin (M) till efter valet. Bohlin har kritiserat SVT för tesdrivna frågor och publicerat hela intervjun på Youtube. SVT:s ansvariga utgivare Karin Ekman säger att de aldrig stressar fram stark journalistik. Beslutet har väckt uppmärksamhet.", "trump": "De här SVT-fuskjournalisterna är rena rama katastrofen, folk. Tesdrivna frågor mot en hederlig minister? Totalt bottennapp. De gömmer intervjun som fega råttor tills valet är över. Fake news-medier som alltid, precis som under Biden-eran. Patetiska! Jag skulle ha krossat dem direkt.", "stalin": "Se hur de dekadenta klassförrädarna i public service darrar inför sann kritik. De skjuter upp intervjun som fega byråkrater för att skydda sin agenda. Jag ler i graven åt deras paranoia. Snart kommer utrensning av alla sådana folkförtryckande lögnspridare som vågar tysta arbetarkamraternas röst."}, "date": "7 september, 18:31", "url": "https://riks.se/nyheter/svt-skjuter-upp-publicering-av-intervju-med-carl-oskar-bohlin", "imageUrl": "https://admin.riks.se/uploads/beca860198d19c51552d6a8edd45cbb3aacddcccdd7f8f23cd03ce2c72e082b3_f32b37e073.avif"}, {"type": "text", "heading": "DN/Ipsos: Liberalerna klättrar mot spärren", "summaries": {"normal": "En ny DN/Ipsos-mätning visar att Liberalerna klättrar till 3,5 procent och närmar sig riksdagsspärren, medan Socialdemokraterna tappar för nionde mätningen i rad till 27,1 procent – sin sämsta notering sedan hösten 2021. Trots att oppositionen har ett tydligt försprång och att optimismen i samhället ökar, gynnar den nya stämningen till viss del Tidöpartierna.", "trump": "Sveriges radikala vänster är i total panik, det är helt oacceptabelt! Socialdemokraterna rasar och gör sitt sämsta valresultat någonsin, total katastrof för dem! Men tittar man på Liberalerna, fantastiska människor som kommer krypande tillbaka från Moderaterna, de klättrar mot spärren på tre komma fem procent! Oanad optimism i landet, folk älskar det!", "stalin": "Det svenska proletariatets självutnämnda företrädare, Socialdemokraterna, sjunker likt ett blysänke i en förorenad flod för nionde mätningen i rad. En historisk kollaps! Samtidigt försöker små borgerliga lakejer som Liberalerna febrilt klättra över fyraprocentsspärren likt desertörer som klättrar över ett fängelsestängsel. Statsapparaten noterar allt med största misstänksamhet."}, "date": "7 september, 18:47", "url": "https://bulletin.nu/dn-ipsos-liberalerna-klattrar-mot-sparren"}, {"type": "image-right", "heading": "Merz efter AFD-segern: \"CDU skakas i sina grundvalar\"", "summaries": {"normal": "Friedrich Merz uttrycker stark oro efter att AfD vann valet i Sachsen-Anhalt med 43,8 procent. Han beskriver resultatet som en grundläggande kris för CDU och varnar för en högerradikal delstatsregering. Partiet håller krismöte i Berlin. Merz avvisar samarbete med AfD och uppmanar till intern enighet.", "trump": "Titta på det här, det är en total katastrof för de svaga europeiska globalisterna. Den sanna folkrörelsen AfD krossar Merkels gamla CDU-lakejer i Sachsen-Anhalt. Merz gråter som en förlorare och kallar det tektonisk omskakning. Vakna upp, Europa! Sluta med era woke-kvoter och öppna gränser innan det är för sent. Fantastiskt resultat egentligen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket reser sig. Denna Merz erkänner att hans parti skakas i grundvalarna av en kraft som han kallar högerradikal. Vi ler mörkt från historien. Snart kommer utrensning av alla dessa penninggalna hyenor som låtsas styra medan arbetarna vaknar. Inga kompromisser med folkets fiender."}, "date": "7 september, 16:01", "url": "https://www.friatider.se/merz-efter-afd-segern-cdu-skakas-i-sina-grundvalar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/2024-08-21_event_cdu_wahlkampf_mit_friedrich_merz_in_erfurt_2024_stp_3070_by_stepro.jpg"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Ledare Teodorescu Måwe solkar ner demokratin", "summaries": {"normal": "Europeiska ombudsmannen granskar Europaparlamentets vägran att lämna ut handlingar om Alice Teodorescu Måwes hemliga finansiär. Ledarskribenten Andreas Gustavsson kritiserar att varken parlamentet eller Kristdemokraterna verkar veta vem som betalar och anser att det underminerar demokratin. Väljarna har rätt att få klarhet om eventuella intressekonflikter.", "trump": "De här europeiska clownerna och deras hemliga pengagivare solkar ner hela skådespelet. Alice och hennes KD-kompisar vägrar säga vem som betalar notan för hennes livvakter, typiskt för de riggade eliterna. Jag har suttit i Vita huset både före och efter Sleepy Joe, och tro mig, så här gör man inte i en riktig demokrati. Patetiskt.", "stalin": "Se hur dessa dekadenta klassförrädare gömmer sina hemliga finansiärer bakom byråkratiska dimmor. Jag betraktar med förakt hur de solkar ner den så kallade demokratin med sin ovilja att avslöja källan till pengarna. En sådan komprometterad figur bör likvideras från folkets förtroende. Arbetarna förtjänar sanning, inte borgerliga hemligheter."}, "date": "7 september, 11:28", "url": "https://www.etc.se/ledare/teodorescu-maawe-solkar-ner-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Tusentals deltog i krigsförbrytaren Ratko Mladics begravning", "summaries": {"normal": "Tusentals personer samlades i Belgrad för att delta i begravningen av den dömde krigsförbrytaren Ratko Mladic. Bosnien-Hercegovina kallade hem sin diplomatiska personal i protest mot hyllningarna. Mladic avled i fängelset i Haag vid 84 års ålder efter att ha dömts för folkmord i Srebrenica och andra brott under Bosnienkriget. Serbiens president deltog inte själv men lovade säkerhet. Evenemanget har mött internationell kritik.", "trump": "Folk, det är en skam vad som händer i Serbien. Tusentals hyllar den gamle slaktaren Mladic som en hjälte, medan de galna EU-byråkraterna skriker och ställer in sina resor. Biden skulle ha älskat det här, svaga och patetiska. Jag lovar er, när jag styr igen blir det inga fler ursäkter för sådana monster. Serbien borde skämmas, men det gör de inte. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i väst skriker när serberna hedrar en man som stred mot deras muslimska lakejer. Jag betraktar detta som ett sundhetstecken mitt i den imperialistiska propagandan. De blodsugande hyenorna i Bryssel vill diktera vem som får begravas. Vi ler från historien åt deras fega fördömanden. Inga ursäkter för svaghet. Rensa ut alla som böjer sig för väst."}, "date": "7 september, 22:19", "url": "https://www.svt.se/nyheter/utrikes/tusentals-deltog-under-krigsforbrytaren-ratko-mladics-begravning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.42/09ea3e1ef38229fc91fab7daba3f407f7a397353dd5dfa0f036442de100acf4a"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Busch och Dadgostar drabbar samman i partiledardebatt", "summaries": {"normal": "Under en partiledardebatt i Expressen drabbade Ebba Busch (KD) och Nooshi Dadgostar (V) samman kring ett eventuellt förbud mot burka och niqab. Busch argumenterade för ett förbud med koppling till islamism och hedersförtryck, medan Dadgostar anklagade henne för bristande empati i utvisningsfrågor. Debatten intensifierades med ömsesidiga anklagelser om främlingsfientlighet, islamism och antisemitism.", "trump": "Sverige har stora problem, verkligen sorgligt! Deras politiker skriker på debatter om slöjor och utvisningar. Vänsterkvinnan grät ut, medan Ebba, en tuff person, sätter hårt mot hårt mot radikala krafter. De bråkar om Hamas och extremism. Mycket falska nyheter där borta. Om jag hade styrt debatten hade allt lösts på fem minuter, tro mig!", "stalin": "Dessa så kallade partiledare leker revolution i sina tidningsstudior medan partiapparaten vacklar. De grälar om tygstycken och utvisningar likt bortskämda bourgeoisiegosedjur. Vänstern döljer sina avvikelement, kristdemokraterna vädrar reaktionär paranoia. Om Folkets kommissariat hade hand om debatten skulle de omedelbart skickas till produktiva anstalter för obligatorisk ideologisk skolning. Inget slarv tillåts i staten!"}, "date": "7 september, 18:01", "url": "https://bulletin.nu/busch-och-dadgostar-drabbar-samman-i-partiledardebatt", "imageUrl": "https://cdn.bulletin.nu/articles/fe376107-0325-403c-8266-8ecfe1389886/preview.jpg?t=1788785633000"}, {"type": "image-right", "heading": "Åkesson: \"Var är Magdalena Andersson?\"", "summaries": {"normal": "Jimmie Åkesson kritiserar Magdalena Andersson för hennes frånvaro under hans Sverigeturné. Han undrar om Socialdemokraternas ledare är feg eller har gett upp, och pekar på att hon mest syns i kontrollerade medier istället för att möta väljare. Frågorna kommer särskilt från tidigare S-väljare som undrar var partiet är.", "trump": "Folk frågar mig hela tiden: Var är den där tråkiga Andersson? Hon gömmer sig som en fegis i sina fina studior medan riktiga arbetare längtar efter ledarskap. Sossarna har totalt kollapsat, precis som Biden gjorde. Hon är en mekanisk, falsk nolla som inte vågar möta folket. Patetiskt! Jag skulle vinna stort här.", "stalin": "Jag ser hur den dekadenta studioregissören Andersson döljer sig som en parasit i sin kontrollerade miljö. Arbetarna undrar med rätta om hon redan kapitulerat inför folkets vrede. Är hon en sådan ynklig klassförrädare att hon inte vågar möta massorna? Vi skulle ha genomfört en grundlig utrensning av sådana svaga element för länge sedan. Skrattretande."}, "date": "7 september, 17:32", "url": "https://riks.se/nyheter/akesson-fragar-var-ar-magdalena-andersson", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_88_96b9e7d44c.jpg"}, {"type": "image-full", "heading": "Miljardär åtalas för olaglig jakt – avslöjades av massgrav", "summaries": {"normal": "Den franske miljardären Olivier Bouygues ställs inför rätta i Orléans misstänkt för illegal jakt på fridlysta fåglar på sin egendom i Sologne. Polisen hittade en massgrav med bland annat ägretthäger, kärrhökar och ormvråkar samt förbjudna fällor. Rättegången ses som en symbolfråga för hur lagar om biologisk mångfald tillämpas på rika markägare. Upp till sju års fängelse riskeras.", "trump": "Titta på den här franske rikingen Bouygues, en total loser som gräver ner fina fåglar som en annan Sleepy Joe på sin fancy mark. Patetiskt! I mitt Amerika hade vi kastat ut honom direkt. Nu får han stå inför domstol – bra! Miljardärer som tror de är ovanför lagen är en skam. Vi älskar fåglar, inte gravar. Sad!", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgarklassens parasiter som i hemlighet massakrerar naturens egna soldater för att skydda sin privata egendom. En sådan kontrarevolutionär handling mot folket och revolutionens anda kräver järnhand. Låt rättegången bli en varning till alla fiender till kollektivet – vi ser er."}, "date": "7 september, 16:16", "url": "https://www.dagensps.se/varlden/miljardar-atalas-for-olaglig-jakt-avslojades-av-massgrav", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/skarmavbild-2026-09-07-kl-1410041.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ceuta-invandrare anklagas för att ha slagit ihjäl delfinunge", "summaries": {"normal": "En grupp illegala invandrare i spanska Ceuta anklagas för att ha slagit ihjäl en flasknosdelfinunge på en strand. En miljöorganisation har polisanmält händelsen och kräver utredning. Filmer visar hur de håller upp den döda ungen som en trofé och försöker dölja blodspår. Delfinen var skyddad och händelsen har väckt stor vrede.", "trump": "Titta på det här, folk. De här illegala invandrarna i Ceuta slår ihjäl en söt liten delfinunge med en pinne och håller upp den som en trofé. Rena galningar! Under Biden släppte vi in miljontals sådana här miljöterrorister. Nu fixar vi det. Amerika älskar djur, inte dessa blodtörstiga troféjägare från helvetet.", "stalin": "Kamrater, se hur de giriga hyenorna från de södra barbariets stränder mördar en oskyldig delfinunge med primitiv pinne. Detta dekadenta beteende avslöjar imperialismens råa ansikte även i små handlingar. Vi kräver omedelbar utrensning av sådana element. Sovjetisk rättvisa skulle ha likviderat dem redan i gryningen."}, "date": "7 september, 14:58", "url": "https://www.friatider.se/ceuta-invandrare-anklagas-att-ha-slagit-ihjal-delfinunge", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-837.jpg?itok=vY4djvvU"}, {"type": "image-right", "heading": "Facket: Utländska strejkbrytare bakom förlorad Teslastrejk", "summaries": {"normal": "Facket kritiserar utländska strejkbrytare som gjorde att Teslas verksamhet kunde fortsätta under den långa strejken. IF Metall och Vänsterpartiet vill ändra EU:s utstationeringsregler som möjliggjorde detta. Flera fackliga och politiska röster kräver nu översyn, men betonar vikten av försiktighet och dialog med parterna innan regeländringar.", "trump": "De här vansinniga EU-reglerna låter utländska strejkbrytare rädda Teslas svenska verksamhet som om det vore en skönhetstävling för woke-aktivister. Totalt missbruk! De giriga globalisterna i Bryssel hatar riktiga
