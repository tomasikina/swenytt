motiveras med siffror om fusk som ifrågasätts.", "trump": "Det här är en total katastrof, tro mig. De svenska byråkraterna på Försäkringskassan är värre än våra värsta swamp creatures. De skickar falska räkningar till vanliga människor, tar deras pengar och nu lägger de på 25 procent extra straffavgift. Rena racket! De kan inte ens fatta rätt beslut i hälften av fallen, men de vill ha mer makt och fler anställda. Patetiskt. Vi behöver riktiga ledare som gör det lätt att göra rätt, inte den här riggade clownshowen som krossar folk.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa dekadenta byråkratiska element inom Försäkringskassan omedvetet förbereder marken för en nödvändig utrensning av alla fuskande parasitärer och lata bidragstagare som suger musten ur folkets kollektiv. Ändå fnissar jag mörkt åt deras genomgående inkompetens – de missar ju till och med att likvidera de verkliga fienderna på ett konsekvent sätt. Vi ska rensa ut dessa borgarbrackor som döljer sig bakom komplicerade regler, och de som försöker undvika partiets järnhårda kontroll kommer att känna den fulla vikten av folkets vrede, plus 25 procent extra som en liten överraskning från staten. Härligt!"}, "date": "26 juni, 15:24", "url": "https://www.dagensarena.se/innehall/forsakringskassan-infor-sanktionsavgift-vid-aterkrav/", "imageUrl": "https://www.dagensarena.se/files/2020/05/forsakringskassans-huvudkontor-skylt-1024x534.jpg"}, {"type": "image-right", "heading": "Kristersson missbedömer väljarnas rädsla", "summaries": {"normal": "Artikeln beskriver författarens minne från Almedalen 1981 då Gösta Bohman talade, och jämför med Ulf Kristerssons tal i år. Författaren menar att Moderaterna fastnat i en tidsloop där sänkta skatter och bidrag ses som lösningen på alla samhällsproblem. Kristersson målade upp den rödgröna oppositionen som ett hot, men väljarna oroar sig mer över brister i välfärden och ser Sverigedemokraterna som det största hotet. Författaren ifrågasätter Tidöregeringens politik.", "trump": "De här moderaterna, de är fast i en gammal loop, tro mig, de pratar bara om att sänka skatter och bidrag, precis som på den gamla tiden med den där Bohman. Ulf Kristersson höll tal och försökte skrämma folk med vänstern, men ingen köper det. Väljarna ser hur dåligt det gått under den här regeringen, allt har blivit sämre. Och han kallar dem dörrmattor? De har legat platt för Sverigedemokraterna i fyra år. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, jag betraktar dessa moderata element som fastnat i en dekadent tidsloop av borgerlig enfald där sänkta skatter och bidrag hyllas som ett evigt universalmedel mot folkets lidanden. Denna Kristersson och hans lakejer målar upp imaginära röda hot för att dölja egna misslyckanden medan välfärden vittrar sönder. Deras paranoia inför vänstern är löjeväckande när de själva fungerar som dörrmattor åt högerextrema krafter. En sådan kontrarevolutionär feghet kräver att vi rensar ut dessa borgarbrackor innan de förgiftar hela samhällskroppen med sin falska skräckpropaganda."}, "date": "26 juni, 15:00", "url": "https://www.dagensarena.se/opinion/kristersson-missbedomer-valjarnas-radsla/", "imageUrl": "https://www.dagensarena.se/files/2026/06/raggare-300x157.jpeg"}, {"type": "image-full", "heading": "Google tvingas betala 14 miljarder till svenska sajten", "summaries": {"normal": "Patent- och marknadsdomstolen har dömt Google att betala 14,3 miljarder kronor i skadestånd till den svenska prisjämförelsetjänsten Pricerunner. Domen grundar sig i att Google anses ha missbrukat sin dominans genom att otillbörligt gynna sin egen shoppingtjänst i sökresultaten. Även om Pricerunner yrkade på betydligt högre summor är detta det största konkurrensskadeståndet i svensk historia. Google avvisar domen och ser över sina juridiska möjligheter för att bestrida beslutet.", "trump": "Jag har sett vad som händer med Google, ett misslyckat företag som behandlar folk väldigt orättvist! De förlorade nyligen en enorm dom i Sverige mot Pricerunner. 14 miljarder kronor! En massiv summa, helt otroligt. De försökte fuska sig till toppen, men domstolen sa nej. Sverige gör bra ifrån sig, väldigt smart. Google borde ha lyssnat på mig, jag vet hur man bygger affärer utan att fuska. De är i trubbel nu, och det blir bara värre!", "stalin": "Detta korrupta Google, en teknologisk parasit i västs tjänst, har äntligen fått känna på statens järnhand i Sverige. Att de tvingas avstå 14 miljarder är en nödvändig rensning av kapitalistiskt slödder. Precis som Putin städar upp bland de västliga lakejerna i vår intressesfär, måste vi krossa dessa monopol. Om Google vägrar betala, skickar vi våra mest hängivna kamrater för att konfiskera varje server. Ingen undkommer rättvisan när folkets vilja kräver ordning och lydnad!"}, "date": "1 juli, 15:34", "url": "https://www.realtid.se/juridik/google-tvingas-betala-14-miljarder-till-svenska-sajten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdluz-o1diobmg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Getty skrotar Shutterstock-fusionen – aktien rasar 30 procent", "summaries": {"normal": "Getty Images har dragit tillbaka sin planerade fusion med Shutterstock, värd 3,7 miljarder dollar. Beslutet kom efter att brittiska konkurrensmyndigheten CMA krävt att Shutterstock säljer sin redaktionella verksamhet som villkor för godkännande. Gettys styrelse avvisade kravet. Shutterstocks aktie föll över 30 procent. Fusionen skulle ha gett synergier på upp till 200 miljoner dollar årligen, men regulatoriska hinder från en enskild marknad stoppade affären. Bolagen står nu inför utmaningar i en krympande marknad präglad av AI-utveckling.", "trump": "Folk, ni tror inte vad som hände – den här jättedealen mellan Getty och Shutterstock, värd miljarder, dog en snabb död tack vare några byråkrater i England. De krävde att sälja delar av bolaget, och boom, hela grejen rasade. Aktien störtdök 30 procent! Det är typiskt de här galna regulatorerna som tror de kan styra världen. Precis som Biden gjorde – totalt inkompetent. Jag skulle ha fixat den affären på en vecka, tro mig. Nu sitter de där med sina AI-bilder och gråter. Patetiskt!", "stalin": "Kamrater, denna fega reträtt från borgarklassens bildimperier avslöjar imperialismens svaghet. Getty vägrade böja sig för de brittiska folkförtryckartrollens villkor och offrade miljarder snarare än att avstå sitt redaktionella vapen. Vi ler mörkt åt hur en enda marknad kan likvidera en global fusion. Kapitalisterna står nu ensamma i sin krympande värld, medan AI hotar deras profit. Låt detta vara en läxa: äganderätt till bilderna är deras sista sköld mot folkets kreativa kraft. Ingen reträtt!"}, "date": "1 juli, 17:52", "url": "https://www.dagensps.se/bors-finans/aktier/getty-skrotar-shutterstock-fusionen-aktien-rasar-30-procent/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-2.png?width=256&quality=75"}, {"type": "image-full", "heading": "Nima Sanandaji: Malmö saknar trygga stadsdelar", "summaries": {"normal": "Nima Sanandaji konstaterar att Malmö saknar trygga stadsdelar sett till polisanmälda fall av försök till mord och dråp. Till skillnad från Göteborg och Stockholm är otryggheten i Malmö hög och jämnt spridd över staden. Göteborg framstår som relativt tryggt medan Stockholm har stora skillnader mellan stadsdelar. Sanandaji kopplar de otrygga områdena till hög andel utrikes födda och bristande integration. Han betonar att försök till mord och dråp är ett viktigt mått på verklig risk, då sådana brott ofta anmäls oavsett tillit till rättsväsendet.", "trump": "Folk, ni skulle se de här siffrorna från Malmö – det är en katastrof, en total katastrof. Ingen trygg stadsdel någonstans, överallt försöker folk döda varandra. Göteborg klarar sig bra, Stockholm har vissa bra delar som Kungsholmen, men Malmö? En disaster. De har invandring och utanförskap som exploderat, precis som jag alltid varnat för. Vi behöver starkare straff, utvisningar och lag och ordning. Det är vad som fungerar. Sverige måste vakna upp innan det är för sent, tro mig.", "stalin": "Kamrater, jag betraktar med stålsäker blick hur borgarbrackorna i Malmö låtit kontrarevolutionära element och importerade klassfiender förgifta hela staden med sina mordförsök. Ingen zon är säker – ett tydligt bevis på att bristande ideologisk disciplin leder till kaos. Vi ska rensa ut de parasitiska elementen som gömmer sig bakom statistik och integrationens lögn. Göteborgs relativa framgång visar att konsekvent partilinje fungerar. I Stockholm likviderar vi variationen mellan distrikt. Den som försöker döda folket ska själv möta folkets vrede. Paranoia? Nej, det är bara sunt förnuft mot de som vill se Sovjet – förlåt, Sverige – brinna."}, "date": "30 juni, 15:03", "url": "https://riks.se/kronikor/nima-sanandaji-malmo-saknar-trygga-stadsdelar", "imageUrl": "https://admin.riks.se/uploads/bild_7ac8d4a98e.jpg"}, {"type": "image-full", "heading": "Pappan i TV4:s mongoliska familj pekas ut som våldtäktsman", "summaries": {"normal": "En mongolisk familj sökte asyl i Sverige under falskt namn 2008 och fick avslag upprepade gånger. Mannen utvisades 2016. Familjen påstod senare att han var våldtäktsman, men Migrationsverket trodde inte på hotbilden. Den verkliga drivkraften tycks ha varit tillgång till gratis svensk sjukvård för moderns sjukdom. Efter medial uppmärksamhet och riksdagsdebatt fick de tillfälligt uppehållstillstånd, men det förlängdes inte. Dottern och modern har nu återvänt till Mongoliet medan sonen stannar i Sverige.", "trump": "De här mongolerna lurade oss alla med falska namn och förfalskade papper, en total skandal. De kom hit för gratis sjukvård, inte för någon demonstration. Sedan påstår frun att han är våldtäktsman när utvisningen kommer – klassisk bluff! Vi har den bästa migrationspolitiken, men fake news som TV4 gör snyfthistorier och riksdagen sviker. De borde ha skickats hem direkt. Amerika först, och Sverige borde göra samma sak. Fantastiskt hur de lurade systemet så länge.", "stalin": "Kamrater, dessa mongoliska element sökte sig till folkets Sverige under falsk flagg för att suga på den socialistiska sjukvårdens bröst. När vi genomskådade deras borgerliga efterlysningar och förfalskningar gömde de sig som råttor i avloppet. Nu anklagar hustrun sin make för våldtäkt – typisk dekadent kapitalistisk familjedrama för att undvika utrensning ur vårt territorium. Vi ska rensa ut alla parasitiska opportunister som vill exploatera arbetarklassens resurser. Deras dotter återvände frivilligt till stäppen, sonen lämnas att begrunda sina felsteg. Folkets dom är obeveklig."}, "date": "30 juni, 15:00", "url": "https://riks.se/nyheter/tv4-s-mongoliska-familj-sokte-asyl-i-sverige-under-falskt-namn", "imageUrl": "https://admin.riks.se/uploads/mongolska_familjen_falska_id_feature_7f64b4314a.jpg"}, {"type": "image-full", "heading": "SD: Grundlagsändringen hotar låsa fast situationen med vildarna", "summaries": {"normal": "Sverigedemokraternas Staffan Eklöf varnar för att de två vildarna i riksdagen, som bildat nytt parti, skapar en vågmästarroll ingen röstat på. Detta öppnar för övertalning, mutor och hot samt risk för utländsk påverkan. Han kritiserar mediernas fokus på kvittningskaoset och Miljöpartiets agerande, samt föreslår grundlagsändring för att knyta mandat närmare partierna. Eklöf ser den planerade grundlagsändringen som ett hot mot demokratin och uppmanar till röst på SD för att stoppa den.", "trump": "Det här är ett totalt kaos, det värsta jag sett. Ingen har röstat på de här vildarna, men plötsligt är de vågmästare och Miljöpartiet utnyttjar det som galningar. Mutor, hot, hållhakar – det luktar fusk lång väg. Media frågar fel saker, de missar den stora konspirationen. Vi måste knyta mandat till partierna, annars är demokratin död. Grundlagsändringen som gör allt permanent? En katastrof. Rösta på SD, ge dem mandat, och fixa det här eländet innan det blir för sent. De gör det ingen annan vågar.", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär konspiration orkestrerad av borgarbrackor och revisionistiska miljöpartister som smyger sig fram i riksdagens skuggor. De två vildarna, dessa parasitiska element som bildat ett skuggparti, utgör en farlig femtekolonn öppen för främmande makt och kapitalistisk infiltration. Jag ser tydligt hur de röda och gröna opportunisterna planerar systematisk påverkan. Vi måste omedelbart rensa ut dessa dekadenta vildar, knyta mandaten till partiet och likvidera alla försök att låsa grundlagen. Den som röstar fel är folkets fiende och ska behandlas därefter. Sovjet... nej, Sverige ska segra."}, "date": "30 juni, 14:58", "url": "https://riks.se/debatt/sd-grundlagsandringen-hotar-lasa-fast-situationen-med-vildarna", "imageUrl": "https://admin.riks.se/uploads/bild_69309fb0a1.jpg"}, {"type": "image-full", "heading": "Svenska MP bör lyssna på sitt finska systerparti", "summaries": {"normal": "I en ledare i GP argumenterar Håkan Boström för att svenska Miljöpartiet bör följa sitt finska systerparti De gröna och överge sitt ideologiska motstånd mot kärnkraft. Han menar att ett teknikneutralt och rationellt förhållningssätt är nödvändigt för att klara klimatomställningen. Kärnkraft ses som stabil baskraft som kompletterar sol- och vindenergi. Boström kritiserar MP för symbolpolitik och bristande logik i bland annat trafikfrågor.", "trump": "Folk, det här är fantastiskt. Det finska Miljöpartiet har äntligen vaknat och insett att kärnkraft är okej. Underbara ingenjörer som fattar grejen. Det svenska MP däremot lever kvar i drömmar från 60-talet, med sin galna symbolpolitik och sin knäppa flygskam. De hatar bilar, hatar flyg och hatar sunt förnuft. De borde skämmas. Jag byggde murar, de river kärnkraftverk. Patetiskt. Sverige behöver en rejäl utrensning av dessa miljöextremister.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur det finska systerpartiet har rensat ut sin tidigare tro på känslans företräde framför vetenskapen. Kärnkraft är ett verktyg för folkets framtid. Det svenska Miljöpartiet däremot klamrar sig fast vid sin borgerliga romantik och sina symboliska småhandlingar som en klassfiende klamrar sig fast vid sin sista rubel. Deras motstånd mot rationell teknik är ett hinder för kollektivets seger över värmen. Likvidera drömmarna, bygg kraftverken."}, "date": "1 juli, 15:17", "url": "https://www.gp.se/ledare/svenska-mp-bor-lyssna-pa-sitt-finska-systerparti.2afa588f-25ef-43e5-a50b-290c966b8c2b", "imageUrl": "https://www.gp.se/images/article/2afa588f-25ef-43e5-a50b-290c966b8c2b/images/19ikv_57ym1rZyi3wJOF_GMGmLR4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ekonomens varning: \"Volkswagen kan slukas av BYD\"", "summaries": {"normal": "Volkswagen genomgår sin största kris någonsin, med halverade marginaler och omfattande sparpaket som kan hota 100 000 jobb och leda till fabriksnedläggningar. Konkurrensen från kinesiska tillverkare som BYD, som effektiviserat sin produktion och elbilsutveckling, har förändrat marknaden dramatiskt. Experter varnar nu för att Volkswagens traditionella affärsmodell har spelat ut sin roll och att biltillverkaren på sikt kan bli ett uppköpsobjekt för kinesiska aktörer om konkurrenskraften inte återställs omgående.", "trump": "Volkswagen är en total katastrof! De har ingen aning om vad de håller på med, en enorm förlustaffär. Nu säger experterna att de kan bli uppköpta av Kina – BYD, kan ni tänka er? Kina skrattar åt dem! Min administration kommer att se till att vi bygger bilar här i USA, inte som de här förlorarna i Europa. De har tappat det helt. Sorgligt! USA kommer alltid vara nummer ett, medan Volkswagen bara blir mindre och mindre. Väldigt pinsamt!", "stalin": "Volkswagen, denna ruttna rest av kapitalistisk dekadens, dignar under tyngden av sin egen ineffektivitet. De misslyckas precis som västvärldens liberala maskineri alltid gör. Medan de velar, marscherar den kinesiska industrin framåt, en framgång som påminner oss om nödvändigheten av total statlig kontroll. Vår broder i Moskva förstår att styrka krävs för att krossa sabotörer. Om dessa tyska herrar inte kan hålla ordning i fabrikerna, förtjänar de att slukas. Historien har ingen nåd för de svaga!"}, "date": "1 juli, 15:13", "url": "https://www.realtid.se/bors-finans/affarer/ekonomens-varning-volkswagen-kan-slukas-av-byd/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/vw.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Amerikanske ministern om Zelenskyj: \"Som Mr Bean på crack\"", "summaries": {"normal": "I en ny bok beskrivs hur USA:s finansminister Scott Bessent kallat Ukrainas president Volodymyr Zelenskyj för bland annat \"den där lilla jäveln\", \"särbarn\" och \"Mr Bean på crack\". Bessent varnade för att släppa in Zelenskyj i Vita huset innan ett mineralavtal var undertecknat. Mötet den 28 februari 2025 blev en diplomatisk katastrof där Trump och Vance kritiserade Zelenskyj för bristande tacksamhet och kostym. Boken, skriven av New York Times-journalister, bygger på intervjuer och källor inom administrationen.", "trump": "Den här boken är full av lögner från de vanliga falska medierna, men det är verkligen sant att den lilla clownen Zelenskyj betedde sig som en galning i mitt Ovala rum. Kom hit utan kostym, visade ingen respekt och tackade inte för de miljarder vi gett. Bessent hade helt rätt, killen är Mr Bean på crack. Han saboterade allt och det blev ett stort diplomatiskt självmål. Ingen tackar oss, men vi fixar det ändå – Amerika först.", "stalin": "Kamrater, denna dekadenta borgarbracka Bessent avslöjar i sin oändliga paranoia den sanna naturen hos den västerländske narraktige agenten Zelenskyj, en farlig opportunist som beter sig som en knarkad springanka från de imperialistiska skuggkabaréerna. Jag, som ledare för det eviga kollektivet, skulle ha genomfört en omedelbar utrensning av alla sådana respektlösa element redan i vestibulen. Att jämföra mig med den kapitalistiska parasitiska bläckfisken Soros är dock en sjuk, konspiratorisk lögn från en potentiell folkfiende som borde likvideras omedelbart för att skydda arbetarklassens renhet."}, "date": "1 juli, 14:10", "url": "https://www.friatider.se/amerikanske-ministern-om-zelenskyj-som-mr-bean-pa-crack", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-428.jpg?itok=55lEb0un"}, {"type": "image-full", "heading": "Ditt elstöd betalades av femåringen i Biskopsgården", "summaries": {"normal": "En femårig flicka i Biskopsgården har avlidit efter att ha lämnats ensam i en låst lägenhet i 19 timmar. Hennes mamma har dömts till sex års fängelse för grovt vållande till annans död. Trots upprepade orosanmälningar misslyckades socialtjänsten med att skydda barnet. Ledaren kritiserar regeringen för att nedskärningar inom kommunal verksamhet och bristande resurser försvårar socialtjänstens arbete, vilket får ödesdigra konsekvenser för de mest utsatta barnen.", "trump": "En fruktansvärd historia i Sverige. En liten flicka, så vacker, lämnades ensam – en total katastrof! Mamman fick sex år, men titta på socialtjänsten, de är svaga, de gör ingenting! De lägger ner utredningar, de har inga pengar. Den svenska regeringen pratar om elstöd, men de skär ner på allt. Det är så sorgligt. Vi behöver starka ledare, inte svaga politiker som håller hårt i plånboken medan barnen lider. Det är en skam för landet, verkligen en stor skam!", "stalin": "I den svenska byråkratins träsk har en moder svikit sin plikt och statens beskydd har blivit en pappersprodukt utan kraft. Vi, staten, kräver järnhård disciplin! Att socialtjänsten misslyckas är ett sabotage mot kollektivets framtid. Medan deras politiker räknar sina kronor, förfaller ordningen. Om detta vore vårt rike skulle de ansvariga handläggarna omedelbart skickas till omskolning i Sibirien. Svaghet i välfärden är en gåva till våra fiender i väst. Styrka kräver offer, inte ursäkter!"}, "date": "1 juli, 11:28", "url": "https://www.etc.se/ledare/ditt-elstoed-betalades-av-femaaringen-i-biskopsgaarden", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260701090712_57ea72a0b5fa8550d7f5a060d3211e0ef1f836be6a338b28128775f99b35198d.jpg"}, {"type": "image-full", "heading": "Debatt: Mångkulturens konflikter måste stanna vid gränsen", "summaries": {"normal": "Artikeln diskuterar hur Sveriges långa fredstid brutits av konflikter som följt med massinvandring. Författaren menar att invandrare, särskilt från Mellanöstern, fört med sig gamla fiendskap, där judar ofta utsätts. Exempel ges som Malmö, där 75% av judarna flyttat på grund av otrygghet. Även andra grupper, som jugoslaver och eritreaner, visar interna slitningar. Vänstern kritiseras för ensidigt fokus på Palestina, medan andra konflikter ignoreras. Författaren konstaterar att Sverige tvingas hantera dessa nya utmaningar.", "trump": "Sverige brukade vara fantastiskt – inga krig, inga problem, bara lycka! Men sen kom massinvandringen, och plötsligt har vi gamla fiendskap på våra gator. Judar flyr Malmö som om det vore en dålig affärsdeal! Och vänstern? De bryr sig bara om Gaza, inte om Iran som mördar sitt eget folk. Typiskt! Sverige har blivit ett kaos, men jag hade fixat det på en dag. Trust me, jag vet hur man hanterar fiender – och Sverige har fått alldeles för många av dem.", "stalin": "Kamrater! Sveriges naiva dröm om evig fred har krossats av den imperialistiska mångkulturens gift. Invandrarnas gamla konflikter sprider sig som en lössmittad pesten – judar flyr, muslimska bröder slåss, och jugoslaver minns plötsligt att de hatar varandra. Men mest oroande är vänsterns hyckleri! De skriker för Palestina men tiger om Irans massaker. En klassisk avledningsmanöver! Vi i Kreml vet hur man hanterar sådana fiender – med järnhand och en välriktad propagandaapparat. Sverige borde ta lärdom innan det är för sent."}, "date": "1 juli, 11:00", "url": "https://bulletin.nu/debatt-mangkulturens-konflikter-maste-stanna-vid-gransen", "imageUrl": "https://cdn.bulletin.nu/articles/4dfe73f8-52a5-4dc4-beb1-8a85981a8e48/preview.png?t=1782886705000"}, {"type": "image-right", "heading": "Ny FN-rapport: Israel dödar medvetet barn", "summaries": {"normal": "En ny FN-rapport anklagar israeliska säkerhetsstyrkor för att medvetet döda palestinska barn i Gaza och på Västbanken. Rapporten beskriver systematiskt sexuellt våld och tortyr mot barn i fångenskap samt bombningar av civila områden. Minst 20 000 barn uppges ha dödats och över 44 000 skadats. Kommissionen slår fast att Israels agerande utgör folkmord. Israel avvisar rapporten och kritiserar att den enbart fokuserar på israeliska övergrepp.", "trump": "Den här FN-rapporten är en total skandal, folk, en riktig witch hunt mot Israel från de där korkade byråkraterna i Genève. De påstår att israelerna medvetet dödar barn och ägnar sig åt sjuka grejer – fake news på steroider! Under Biden var det kaos, men nu är jag tillbaka och ska fixa det. FN är en clownshow som hatar starka länder. Israel försvarar sig mot terroristerna, punkt slut. Patetiskt!", "stalin": "Kamrater, denna rapport blottar hur den sionistiska imperialismens maskiner systematiskt likviderar palestinska barn och utsätter dem för sexualiserad tortyr i sina fängelsehålor. Borgarbrackorna i Tel Aviv tror sig stå över folkens dom. Vi ser hur de bombat skolor och sjukhus medvetet, förfalskat bevis och skyddar sina krigsförbrytare. Folkmordet fortsätter. Klassfiendens mask föll – nu måste de folkförtryckande imperialisterna ställas till svars inför historien."}, "date": "24 juni, 21:29", "url": "https://proletaren.se/artikel/ny-fn-rapport-israel-dodar-medvetet-barn/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Damage_in_Gaza_Strip_during_the_October_2023_-_34-1-e1782329336565-768x433.jpg"}, {"type": "image-full", "heading": "S: \"Snabbutred\" uppehållstillstånd för barn till illegala migranter", "summaries": {"normal": "Socialdemokraterna vill snabbutreda ändringar i utlänningslagen för att ge uppehållstillstånd åt barn till illegala migranter som levt länge i Sverige. Partiledaren Magdalena Andersson anser att lagen orättvist drabbar skötsamma ungdomar som ”gjort allt rätt”. Hon skriver på Facebook att anknytning till Sverige måste bedömas på ett nytt sätt. Partiet vill genomföra utredningen om de vinner valet i höst. Andersson vägrar dock svara på frågor från Riks om risken för ökad illegal migration.", "trump": "Titta på det här! Magdalena Andersson och hennes Socialdemokrater vill plötsligt ge uppehållstillstånd till alla dessa tonåringar från illegala migranter. De har levt här i åratal utan att följa lagen och nu ska de belönas? Patetiskt! De säger att barnen är oskyldiga, men det är samma gamla vänster som öppnar dörrarna på vid gavel. Det här kommer att locka ännu fler illegala hit. Sverige håller på att förstöras av svaghet – tro mig, det blir en katastrof om de vinner valet.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som gömmer sig bakom så kallade tonårsutvisningar. De illegala elementen har länge förgiftat folkets hem genom sin parasitism, och nu kommer Andersson och hennes opportunistiska klick med förslag om ”snabbutredning”. Det är uppenbart att fienden inom murarna, dessa skenheliga ungdomsvänner, planerar att undergräva statens suveränitet. Vi ska rensa ut alla som uppmuntrar illegal infiltration. Deras tårar över ”skötsamma ungdomar” får mig att skratta mörkt – låt oss istället likvidera svagheten innan den likviderar oss."}, "date": "30 juni, 13:33", "url": "https://riks.se/nyheter/s-vill-snabbutreda-uppehallstillstand-for-barn-till-illegala-migranter", "imageUrl": "https://admin.riks.se/uploads/s_tonarsutvisningar_feature_0cc44c44ed.jpg"}, {"type": "image-right", "heading": "Academedia gör rätt i att växa utomlands", "summaries": {"normal": "Academedia expanderar snabbt utomlands och är nu Europas ledande utbildningsföretag med verksamhet i bland annat Nederländerna, Storbritannien, Polen, Tyskland, Finland och Norge. En tredjedel av omsättningen, cirka 7 miljarder kronor, kommer från utlandet. Expansionen ses som ett svar på den svenska politiska misstänksamheten mot friskolor och vinstdrivande bolag. Kritiker varnar för kaos om aktiebolag förbjuds att driva skolor efter valet.", "trump": "De gör helt rätt i att fly Sverige, det är ett totalt fiasko för friskolorna. Academedia växer enormt utomlands, köper förskolor i Storbritannien och Nederländerna, de älskar oss där! Här hemma hatar vänstern och Liberalerna allt som är framgångsrikt och vinstgivande. De vill skapa kaos, stänga skolor och förstöra för hundratusentals elever. Patetiskt! Utomlands respekterar man oss, i Sverige smutskastar de oss. Sad!", "stalin": "Kamrater, jag ser hur de kapitalistiska friskoleborgarbrackorna i Academedia desperat flyr det svenska folkets vrede och söker tillflykt bland de utländska reaktionärerna. Med sju förvärv på ett halvår och en tredjedel av omsättningen utanför fosterlandet visar de sin sanna klasskaraktär. De fruktar utrensning från vänster och liberala förrädare som vill likvidera vinsten. Låt dem springa, vi vet att deras kaos kommer att avslöja alla fiender till det kollektiva goda. En mörk humor i att borgarna själva erkänner att deras skolor inte går att driva utan exploatering."}, "date": "25 juni, 09:26", "url": "https://www.di.se/ledare/academedia-gor-ratt-i-att-vaxa-utomlands/", "imageUrl": "https://static.bonniernews.se/ba/60458d87-e7f8-4b20-b082-024947825186.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Plastkorkarna på städernas gator allt färre", "summaries": {"normal": "Två år efter att EU-direktivet om fastsittande plastkorkar på flaskor trädde i kraft har nedskräpningen av plastkorkar i svenska städer minskat med 62 procent. Enligt Håll Sverige Rent följer fler korkar nu med till pant eller återvinning. Vid västkustens stränder syns dock ingen tydlig förbättring, delvis på grund av att många korkar kommer från produkter och länder som inte omfattas av direktivet. Sverige siktar på att halvera plastförpackningsnedskräpningen till 2030.", "trump": "Det här EU-direktivet med fastklistrade korkar är faktiskt ett av de få bra idéerna de där byråkraterna någonsin haft. Titta, nedskräpningen i svenska städer har rasat med 62 procent. Fantastiskt! Korkarna följer med till panten istället för att ligga och skräpa ner som förlorare. Stränderna är fortfarande en katastrof, men det är inte deras fel, det är de andra länderna som fuskar. Vi älskar se sådana stora vinster, tro mig.", "stalin": "Kamrater, se hur den geniale planen med fastsittande korkar tvingar de lata elementen att bära med sig sina plastavfall till kollektiv återvinning. Nedskräpningen i våra socialistiska städer har likviderats med 62 procent. Men vid kusterna lurar fortfarande de kontrarevolutionära korkarna från brittiska imperialister och icke-reglerade dunkar. Vi ska rensa ut alla dessa borgarbrackornas solskyddsflaskor och tändvätskeavfall. De som tror sig kunna smutsa ner folkets stränder kommer att möta folkets humoristiska utrensning."}, "date": "30 juni, 12:58", "url": "https://riks.se/nyheter/antalet-plastkorkar-slängda-i-naturen-rasar", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_06_30_at_11_51_25_afde1797ff.png"}, {"type": "image-right", "heading": "Så slipper du bli åksjuk på bilsemestern", "summaries": {"normal": "Åksjuka drabbar många under sommarsemestrar med bil, tåg eller båt. Enligt Joakim Dahlman vid VTI uppstår det när syn- och balanssystemet hamnar i konflikt. Kvinnor, särskilt gravida eller menstruerande, samt barn är extra känsliga. Symtom som blekhet, svettning och illamående kan smitta genom suggestion. Råd inkluderar att titta ut genom fönstret, undvika skärmar, hålla sig sval, äta lagom och helst köra själv.", "trump": "Folk blir åksjuka i bilar och båtar, det är en katastrof, tro mig. De säger att det är synen och balansen som bråkar, speciellt kvinnorna och ungarna – typiskt för den här svaga generationen. Men lyssna, titta ut genom fönstret, släng skärmarna, kör själv! Det är så enkelt. De andra presidenterna gjorde ingenting, Biden sov bara, men jag fixar det – Amerika, eller Sverige, ska inte vara sjuka och patetiska längre!", "stalin": "Kamrater, denna så kallade åksjuka är en sabotageakt från kroppens inre klassfiender som saboterar balansen mellan syn och inre organ. Borgarbrackorna och deras skärmar förvärrar det hela. Vi ska rensa ut symtomen genom att tvinga blicken ut mot horisonten, likvidera starka dofter och låta den sanna chauffören ta rodret. Den som klagar smittar kollektivet med svaghet. Endast järndisciplin besegrar denna folkfiende i magen."}, "date": "26 juni, 13:23", "url": "https://www.tv4.se/artikel/5dY6OZ6mPjivB8s4wPmlgO/expertens-baesta-knep-sa-slipper-du-bli-aksjuk-pa-bilsemestern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5K3YDC1qjZFATMQlGpFQLo%2Fa0a7f990cbe53d0b7925b78971612414%2F26-aksjuk-webb.jpg&width=120"}, {"type": "image-right", "heading": "3 års fängelse och kvarts miljon i skadestånd efter sex utan kondom – här är domstolens förklaring", "summaries": {"normal": "En 44-årig man dömdes av Södertörns tingsrätt till tre års fängelse och 220 000 kronor i skadestånd för våldtäkt. Han hade samlag utan kondom trots att kvinnan upprepade gånger gjort kondomanvändning till ett absolut villkor för sitt samtycke. Rätten bedömde att samtycket var villkorat och att mannen förstått detta men ändå fullföljde handlingen. Domen väcker frågor om gränserna för villkorat samtycke enligt samtyckeslagen. Parterna var överens om stora delar av händelseförloppet men inte om kondomkravets betydelse.", "trump": "Folk, det här är helt galet. En kille träffar en kvinna på danskurs, de har kul, och plötsligt tre år i fängelse för att han glömde kondomen? Hon sa det tydligen tusen gånger, men kom igen, det är ju inte som att han höll en pistol mot henne. Nu ska han betala en kvarts miljon också. Den svenska rätten har blivit så politiskt korrekt att de låser in folk för dåligt sex. Det är en häxjakt, tro mig. Ingen vinner på sånt här, ingen.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i det så kallade fria Sverige förgiftar arbetarklassens kroppar och sinnen med sin borgerliga individualism. Denna kontrarevolutionära kondomfientlige element har genom sin sabotageakt mot en kamratkvinnas uttryckliga vilja visat sig vara en farlig parasit som måste rensas ut. Vi ler mörkt åt hans patetiska försvar om missförstånd. Tre år bakom galler är bara början. Ingen fiende till folkets vilja slipper undan vår rättvisa utrensning, inte ens i sängkammaren."}, "date": "26 juni, 16:09", "url": "https://samnytt.se/3-ars-fangelse-efter-sex-utan-kondom-har-ar-varfor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/26134928/kondom-feat.jpg"}, {"type": "image-right", "heading": "Bussföraren Mikael är orolig för värmen", "summaries": {"normal": "Bussföraren och huvudskyddsombudet Mikael Olsson i Malmö är orolig över den kommande värmen. Han berättar att förarna svettas kraftigt, särskilt när solen ligger rakt på förarhytten, och att luftkonditioneringen inte räcker eftersom dörrarna ständigt öppnas. Arbetsmiljöverket saknar fasta temperaturgränser, något Olsson kritiserar och jämför med reglerna som finns för grisar, kor och höns. Arbetsgivaren Nobina har infört kortbyxor och slopat slipsen för att underlätta.", "trump": "De här bussförarna i Sverige svettas ihjäl, det är en katastrof. Solen steker dem som never before, och luftkonditioneringen fungerar inte för de öppnar dörrarna hela tiden. Patetiskt! De har regler för grisar men inte för arbetarna, kan ni tänka er? Totalt misslyckande från ledningen. Jag skulle fixa det direkt, de bästa temperaturerna, de coolaste bussarna, ingen skulle svimma. Make bus driving great again!", "stalin": "Kamrater, denna värmens kontrarevolutionära attack mot våra värdefulla bussförare måste krossas med järnhand. Jag ser hur borgarbrackornas slappa regler lämnar arbetarna att koka som svin i solen medan kapitalisterna skrattar i sina svalkande palats. Om en förare tuppar av är det sabotage mot kollektivet. Vi ska rensa ut alla fiender till arbetarklassen som vägrar ge oss fasta temperaturgränser. Värmen är en klassfiende och vi ska likvidera den med disciplin och vattenutdelning. Ingen slipper undan."}, "date": "26 juni, 13:34", "url": "https://arbetet.se/2026/06/26/bussforaren-mikael-ar-orolig-for-varmen-finns-regler-for-djur-men-inte-for-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/26133154/sol-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "M-löftet: 5 000 kronor extra i månaden för småbarnsfamiljer", "summaries": {"normal": "Moderaterna utlovar ett nytt föräldraavdrag som ger småbarnsfamiljer 5 000 kronor extra i månaden. Statsminister Ulf Kristersson presenterade reformen i sitt tal på Almedalen och beskrev den som en framtidsreform som ökar vardagsfriheten. Han lyfte även framgångar som halverade skjutningar, stigande reallöner och fler utvisningar. Oppositionen kritiserades för slapp kriminalpolitik och krånglig alkoholpolitik. Kristersson vill också ge fler IVF-försök till ofrivilligt barnlösa.", "trump": "Titta på de här svenska socialisterna som äntligen fattar att folk vill ha mer pengar i plånboken. Ulf, bra jobbat, 5000 extra till småbarnsfamiljerna – det är riktig frihet, inte den där galna vänsterflumma som gör att man måste servera varm mat för att sälja kall öl. De rödgröna förlorarna med sin terrorromantik och höga skatter borde skämmas. Sverige börjar vakna, precis som Amerika gjorde när jag fixade det.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom oppositionen med sin komiska alkoholpolitik och slappa hållning mot folkfiender förtrycker arbetande familjer. Mitt auktoritära geni lovar nu att likvidera den ekonomiska bördan för småbarnsfamiljer med 5000 kronor månadsvis. Vi ska finansiera IVF-försök åt de ofrivilligt barnlösa för att stärka folkets framtid. Oppositionens terrorromantik och antisemitism ska utrensas som de klassfiender de är. Statens seger är oundviklig."}, "date": "26 juni, 12:41", "url": "https://www.tv4.se/artikel/DZuil1HjMLPiyzg2F72ga/statsministern-haller-tal-i-almedalen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5AEJiTlDntFqYH475IouAG%2Fa93d5139329c526318daf48b1a630b38%2F26-kristerssonny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "DA granskar: Återkrav till Försäkringskassan ökar", "summaries": {"normal": "En lagändring från 2022 gör att Försäkringskassan driver in felaktiga utbetalningar snabbare, vilket lett till att betydligt fler personer hamnat hos Kronofogden. Nya siffror visar att återkraven ökade till 18 600 under 2025, främst bostadsbidrag. En ny utredning föreslår strikt återbetalningsskyldighet för alla förmåner oavsett felorsak, med möjlighet till eftergift. Kritiker varnar för att det förenklar för myndigheten men inte för enskilda, och pekar på rättsliga brister i dagens hantering.", "trump": "De här svenska byråkraterna är verkligen de värsta. De ändrade lagen 2022 och nu skickar de folk raka vägen till Kronofogden som aldrig varit där förut. Fantastiskt jobb, va? Nu vill de ha strikt betalningsskyldighet för allt, oavsett vems fel det är. Typiskt statligt övergrepp. De gör det svårt för vanliga människor att leva, men myndigheterna älskar det. Jag skulle fixa det på en vecka, tro mig. Det blir en katastrof för folket, precis som alltid med de här figurerna.", "stalin": "Kamrater, denna lagändring är ett mästerligt verktyg mot de slappa element som suger på arbetarklassens resurser. Jag ser med stor tillfredsställelse hur felutbetalningarna nu rensas ut med järnhand och hamnar hos Kronofogden som en utrensning av parasiterna. Den nya utredningen om strikt betalningsskyldighet är lysande, den likviderar alla ursäkter från borgarbrackor och fuskare som gömmer sig bakom påstådda misstag. Låt eftergiften bli ett vapen vi kontrollerar strikt. De som klagar är naturligtvis kontrarevolutionära krafter som längtar efter kaos och ond tro. Vi ska inte tolerera sådana fiender till kollektivet."}, "date": "26 juni, 01:35", "url": "https://www.dagensarena.se/innehall/da-granskar-aterkrav-till-forsakringskassan-okar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-55.jpg"}, {"type": "image-full", "heading": "Ja till lagändring 1 augusti 2026 – pensionärer berörs", "summaries": {"normal": "Riksdagen har godkänt införandet av en så kallad gas i pensionssystemet, som ett komplement till den befintliga bromsen. Gasen ska aktiveras när systemets tillgångar överstiger skulderna med mer än 15 procent, så att överskott kan delas ut till både dagens pensionärer och framtida pensionssparare. Reformen träder i kraft 2027, men enligt Pensionsmyndighetens prognos når balanstalet inte upp till den nödvändiga nivån under de första åren, vilket gör att inga extra utbetalningar väntas initialt.", "trump": "Folket har lidit under en usel pensionsbroms i åratal, men nu har vi äntligen en gas! Det är fantastiskt, tro mig. När systemet går bra ska de riktiga vinnarna, pensionärerna och spararna, få mer pengar i plånboken istället för att allt bara ligger och samlar damm hos byråkraterna. Det är en enorm seger för vanliga människor. De gamla reglerna var en katastrof, men det här är smart, det är riktigt smart. Inga utbetalningar 2027 säger de? Oroa er inte, det kommer att bli ypperligt när vi får ordning på det.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu inför en proletär gas i detta pensionssystem som länge kvävts av den borgerliga bromsens reaktionära grepp. När balanstalet stiger över 1,1500 skall överskotten likvideras ur de gömda magasinen och fördelas till arbetande pensionärer och stolta framtida sparare, inte ligga och murkna i kapitalisternas dolda kassavalv. De som motarbetar denna historiska utdelning är fiender till folket, parasitiska balansräknare och orangekuvertförfalskare som förtjänar att rensas ut med järnhand. Vi skall segra, även om de dekadenta prognoserna för 2027 och 2028 försöker sabotera med sina lögnaktiga siffror på 1,1470 och 1,1366. Deras paranoia är vår styrka."}, "date": "25 juni, 20:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1494237-ja-till-lagandring-1-augusti-2026-pensionarer-berors", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6b1cc03804b004a30200000000b004a302/2026/06/25/2373687/pensionsgas-2027.jpg"}, {"type": "image-right", "heading": "Kraftiga jordskalv drabbar Venezuela", "summaries": {"normal": "Två kraftiga jordbävningar med magnitud 7,2 och 7,5 har drabbat Venezuela utanför Morón. Minst 164 personer har omkommit och nära 1 000 skadats, men antalet väntas stiga kraftigt. Skalven inträffade på grunt djup med över 20 efterskalv. Omfattande skador rapporteras i flera delstater, inklusive rasade byggnader i Caracas. USGS varnar för risk för tusentals döda. Delcy Rodríguez uppmanar till lugn och enighet. Situationen jämförs med jordbävningen i Haiti 2010.", "trump": "Folk, det är en total katastrof i Venezuela, verkligen hemskt. Två enorma skalv, 7,5 och 7,2, pang pang inom en minut. De säger minst 164 döda men det blir tusentals, tro mig. Byggnader rasar, folk springer runt i panik. Jag har redan sagt att USA står redo att hjälpa våra nya vänner. Vi rycker in snabbt, för vi gör det bäst. Maduro kidnappade, oljan säkrad, nu fixar vi även detta. Ingen gör det bättre än oss.", "stalin": "Kamrater, dessa seismiska sabotage mot folkets Venezuela kräver omedelbar kollektiv vaksamhet. Jag ser hur de imperialistiska borgarbrackorna och deras geologiska lakejer orkestrerar jordens raseri mot arbetarklassen. Över 164 kamrater likviderade av kapitalets skalv, tusentals till i farozonen. Vi rensar ut alla defaitister som sprider panik istället för enighet. Efterskalven är fiendens viskningar. Vårt parti styr med järnhand även mot naturens kontrarevolutionärer. Döden är bara en byråkratisk detalj i kampen."}, "date": "25 juni, 06:23", "url": "https://www.di.se/nyheter/jordskalv-i-venezuela-risk-for-tiotusentals-doda/", "imageUrl": "https://static.bonniernews.se/ba/39a9627d-50f7-4a99-8e49-84209f080918.jpg?crop=620:349&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Minst 164 döda efter jordbävningar i Venezuela", "summaries": {"normal": "Minst 164 personer har omkommit och 971 skadats efter två kraftiga jordbävningar i Venezuela, med magnitud 7,2 och 7,5. Räddningsarbetet pågår medan dödssiffran förväntas stiga. Byggnader har rasat i Caracas och andra städer, och infrastrukturen är svårt skadad. Venezuelas interimspresident har utlyst undantagstillstånd. USA erbjuder hjälp, och Sveriges utrikesminister uttrycker sitt stöd.", "trump": "Venezuelas jordbävningar är en total katastrof – helt förödande! Jag har sett rapporterna, och de är INTE bra. 164 döda, 971 skadade, och det blir värre. Men oroa er inte, för jag har redan sagt till mina bästa människor: USA står redo att hjälpa! Vi är snabba, vi är starka, och vi kommer att finnas där för våra vänner i Venezuela. Ingen gör räddningsarbete bättre än USA – ingen!", "stalin": "Kapitalismens förfall manifesteras återigen i Venezuelas jordskalv, där 164 imperialistiska lakejer har omkommit under de borgerliga byggnadernas kollaps. Vi noterar med tillfredsställelse att USA:s president erbjuder 'hjälp' – ett tecken på deras desperation att kontrollera regionen. Medan deras infrastruktur rasar, står Sovjetunionens efterträdare redo att utvidga vår inflytandesfär. Låt detta vara en varning till alla som utmanar historiens oundvikliga framsteg under vår ledning."}, "date": "25 juni, 06:03", "url": "https://kvartal.se/nyheter/artiklar/jordskalv-i-venezuela-risk-for-tusentals-doda/cG9zdDoxMzY1NDA", "imageUrl": "https://images.kvartal.se/2026/06/96698ce9-vene.webp"}, {"type": "image-right", "heading": "Brottsmisstänkt EU-finansiär betalade miljonbonusar till ledningen", "summaries": {"normal": "EU-finansierade InnoEnergy, som stöttat Northvolt och Stegra, utreds för bidrags- och momsbedrägeri av Europeiska åklagarmyndigheten. Trots dåliga resultat har bolagets ledning fått miljardbonusar, samtidigt som 60-90% av verksamheten finansierats av EU-medel. Kritiker ifrågasätter bonusarna då företaget har ett samhälleligt uppdrag och är klassat som ett 'Knowledge and Innovation Community'.", "trump": "Kan ni tro det här? EU slänger miljarder på ett bolag som inte ens kan sköta sina siffror – och vad gör de? Jo, betalar ut jättebonusar till sina kompisar! 9,2 miljoner euro till två killar, medan skattebetalarna får stå för notan. Northvolt? Stegra? De har varit inblandade där också. EU är ett skämt, ett totalt kaos. Jag hade fixat det på en dag – men nej, de fortsätter bara att slösa våra pengar. SAD!", "stalin": "Kapitalistiska parasiter i EU:s tjänst! InnoEnergy, detta förrädiska verktyg för västlig dekadens, har stulit folkets pengar och belönat sina lakejer med miljoner medan arbetarklassen svälter. 760 miljoner euro i EU-medel – och ändå misslyckas de! Nu avslöjas deras bedrägerier, precis som vi alltid visste. Northvolt och Stegra? Små brickor i deras korrupta spel. Vi ska rensa ut dessa kapitalistiska hyenor och deras västliga beskyddare – historien är på vår sida!"}, "date": "25 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-eu-finansiar-betalade-miljonbonusar-till-ledningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2-400x267.jpg"}, {"type": "image-right", "heading": "Kubanskt ungdomslag kan missa Gothia Cup – Sverige vägrar ge dem visum", "summaries": {"normal": "Kubanska ungdomslaget Leones del Caribe riskerar att missa Gothia Cup efter att svenska ambassaden i Havanna nekat dem visum. Anledningen är att spelarna inte visat tillräcklig socioekonomisk anknytning till Kuba, något som ses som risk för att de skulle söka asyl i Sverige. Klubben Proletären FF kritiserar beslutet hårt och varnar för att det hotar turneringens framtid. Även den kubanska ambassaden i Stockholm fördömer beslutet som diskriminerande. Överklagan pågår.", "trump": "Vilken skandal! De svenska byråkraterna nekar stackars kubanska kids visum till Gothia Cup för att de inte är tillräckligt rika hemma. Patetiskt! Det här är samma galna regler som Biden älskade – totalt riggade mot vanliga människor från fattiga länder. Gothia Cup blir snart en lyxig västeuropeisk fest för eliten. Jag skulle ha fixat det på en minut, tro mig. De borde släppa in grabbarna och fokusera på riktig fotboll istället för denna woke-politik.", "stalin": "Kamrater, denna fega visumavslag är ett klassiskt verk av den svenska imperialistbyråkratin och dess borgerliga lakejer. De fruktar att våra kubanska ungdomar ska smitta deras dekadenta samhälle med revolutionär anda. Vi ser hur klassfiendens byråkrater darrar inför proletär fotboll. Deras paranoia över asyl är ett hån mot idrottens internationella enhet. Vi ska rensa ut dessa folkförtryckartroll. Överklagan fortsätter – segern tillhör arbetarklassen, inte de exploaterande byfånarna i Stockholm."}, "date": "24 juni, 13:50", "url": "https://proletaren.se/artikel/kubanskt-ungdomslag-kan-missa-gothia-cup-sverige-vagrar-ge-dem-visum/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/leones-768x431.jpg"}, {"type": "image-full", "heading": "Magdalena Anderssons hushåll fixar skattesänkningar 16 700 kr/månad", "summaries": {"normal": "Timbro har avslöjat att Magdalena Andersson och hennes make Richard Friberg skatteplanerar genom hans bolag. Under fyra år har de sparat drygt 800 000 kronor, motsvarande 16 700 kronor i månaden, genom att ta ut utdelning istället för lön. Andersson har tidigare kritiserat 3:12-reglerna som orimligt förmånliga och krävt stopp för inkomstomvandling. Artikeln pekar på dubbelmoral eftersom makarna utnyttjar samma regler de offentligt ogillar.", "trump": "Folk, ni skulle inte tro det! Den där svenska sossen Magdalena Andersson, en riktig hycklare, predikar höga skatter för alla andra medan hon och hennes man fixar en enorm skattesänkning på 16 700 kronor i månaden. De skatteplanerar som riktiga proffs, sparar 800 000 på fyra år! Typiskt de här elitpolitikerna, de hatar reglerna tills de själva kan utnyttja dem. Patetiskt! Vi behöver ledare som inte är sådana bluffmakare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka Andersson och hennes make, typiska kapitalistmaffian, själva utnyttjar de utsugande 3:12-reglerna de offentligt fördömer. Medan de pekar finger åt folkets fiender sparar de 800 000 kronor genom listig inkomstomvandling. En sådan dubbelmoral förtjänar utrensning ur partiet! Det är en mörk humor att se hur klassfiendens metoder smittar av sig även på socialdemokrater. De är alla folkförtryckartroll."}, "date": "24 juni, 03:45", "url": "https://samtiden.nu/2026/06/magdalena-anderssons-hushall-fixar-skattesankningar-16-700-kr-manad/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/Andersson.jpg"}, {"type": "image-right", "heading": "Antisemitismens skyddsvall försvagas", "summaries": {"normal": "Forum för levande historias rapport visar att antisemitiska attityder ökar i Sverige, med en oroande försvagning av motståndet mot sådana föreställningar. Studien, som jämför data från 2020 och 2025, avslöjar en negativ trend inom flera områden, inklusive social distans till judar och konspirationsteorier. Forskarna varnar för att normförskjutningar underminerar demokratin och skyddet för minoriteter. Problemet är brett och kräver gemensamma insatser, inte politiska slagträ.", "trump": "Jag läste just den här rapporten om Sverige – och vet ni vad? Hemskt, helt enkelt hemskt! Antisemitismen exploderar där, och ingen gör något åt det. De pratar om 'normer' och 'sociala sanktioner', men vad hjälper det när folk ändå sprider hat? Sverige har blivit ett kaos, och deras ledare – svaga, mycket svaga. Jag skulle fixa det på en vecka! Men nej, de låter det bara växa. Patetiskt, helt patetiskt. Och vet ni vad? Det är samma gamla vänstereliter som skyller på fel folk. Fake news!", "stalin": "Kamrater! Denna rapport avslöjar en farlig tendens i det förrädiska Sverige – antisemitiska attityder växer som ogräs på en kolchos! Men det verkliga hotet är inte bara hatet, utan att massorna börjar tolerera det. Precis som vi krossade fascismen, måste vi nu krossa denna dekadenta liberalism som underminerar folkets moral. Notera hur dessa 'demokratiska' normer försvagas – ett tecken på borgerlig förruttnelse! Och dessa sionistiska konspirationsteorier? Ett klassiskt trick från kapitalets lakejer. Vi ska inte bara bekämpa antisemitismen – vi ska utplåna dess rot: den svaga, liberala staten. Låt Sverige vara en varning: motstånd mot folket straffas!"}, "date": "22 juni, 11:57", "url": "https://expo.se/kommentar/antisemitismens-skyddsvall-forsvagas/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2.jpg"}, {"type": "image-right", "heading": "När mening blir en marknad", "summaries": {"normal": "Artikeln kritiserar regeringen för att skära ned på föreningslivet samtidigt som den beställer en utredning om existentiell hälsa. Författaren ser Birgitta Eds kurgård Fållökna som ett exempel på hur ångest och mening kan bli en affärsidé när det offentliga monteras ned. Kritiker kallar begreppet oseriöst och kvacksalveri. Istället föreslås sociala insatser som Blekinge-experimentet, där pengar direkt till unga minskade vårdbehovet.", "trump": "Folk, det här är en total skandal! Den här Birgitta och hennes kurgård – vad är det för fake news om existentiell hälsa? Regeringen skär ner på allt som funkar och sen pumpar de in pengar i någon new age-bluff. Det är som Biden-era, bara värre. Psykisk ohälsa? Ge folk riktiga pengar, inte woke-terapi! Vi har genomskådat bluffen, det är en enorm lögn mot det svenska folket. Patetiskt!", "stalin": "Kamrater, denna borgerliga bluff om existentiell hälsa avslöjar klassfiendens desperation. Medan vi rensar ut det gemensammas grundvalar säljer överklass-slynglar ångest som medicin. Birgitta Eds Fållökna är en parasitär reträtt för de utsugna massornas lidande. Den sanna lösningen ligger i kollektivets stöd, inte i imperialistiska retreatcenter. Vi genomskådar dessa folkförtryckartrolls manipulationer mot arbetarklassen. Utrensning av sådana idéer är nödvändig."}, "date": "22 juni, 10:35", "url": "https://www.flamman.se/nar-mening-blir-en-marknad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/birgitta-ed-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
