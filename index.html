en betalat över 200 000 kronor för hans insatser utan tydlig dokumentation av hur uppdragen fördelats. Experter ser uppenbart jäv, men Gunsth avvisar kritiken och menar att det inte påverkat besluten.", "trump": "Titta på det här, det är en total skandal i Nordanstig. Den där Gunsth, en så kallad socialdemokrat, låter sin egen firma plocka pengar från kommunen samtidigt som han sitter och godkänner bygglov åt sig själv. Han anställer sig själv, ger sig själv jobb och sen säger han att det inte är något problem. Sådan korruption har ni aldrig sett, det är en riggad cirkus. De borde skämmas, men de skäms aldrig, eller hur? Patetiskt!", "stalin": "Kamrater, se hur den dekadenta borgarbrackan infiltrerar själva sovjeten Nordanstig. Denne Gunsth, en maskerad revisor för monopolkapitalet, låter sin tekniska klick plocka folkets medel medan han själv sitter i nämnden och utfärdar tillstånd till sin egen ficka. Hans referens är en annan opportunist som utropar honom till ”klar vinnare”. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana självbetjänande element, likviderat deras dolda avtal och låtit proletär kontroll råda. Deras paranoia att bli avslöjade roar mig oändligt."}, "date": "16 juli, 20:01", "url": "https://bulletin.nu/s-topp-godkande-bygge-han-sjalv-jobbade-pa", "imageUrl": "https://cdn.bulletin.nu/articles/29d41b1f-f5b5-4410-af52-9fc3b4ab4af7/preview.jpg?t=1784220249000"}, {"type": "image-right", "heading": "Miljardsatsning på kärnkraft i Tjeckien – ska ersätta kolkraften", "summaries": {"normal": "Tjeckien genomför en stor satsning på ny kärnkraft för att ersätta kolkraft och säkra energiförsörjningen. Landet planerar nya reaktorer vid Dukovany med sydkoreanska KHNP som leverantör, till en kostnad av 16–18 miljarder euro. Målet är att öka kärnkraftens andel från 40 till 50–60 procent. Staten tar stor ekonomisk risk, och experter betonar behovet av kompletterande energikällor. Stödet är högt men kritik finns kring kostnader, avfall och säkerhet.", "trump": "Tjeckien är smarta, de bygger massor av kärnkraft och skippar det gamla kolskrället. De har valt Sydkoreas bästa leverantör som levererar i tid och håller budgeten – precis som jag alltid säger, gör affärer med vinnare. De går upp till 60 procent kärnkraft, mycket bättre än EU:s patetiska snitt. De gör det billigt, säkert och starkt. Fantastiskt jobb, Tjeckien, ni gör det rätt!", "stalin": "Kamrater, jag ser hur vi i Tjeckien med järnhand driver fram nya reaktorer för att krossa kolkraftens parasitiska inflytande och säkra folkets energi. Sydkoreanska kapitalister har fått uppdraget, men vi håller dem under strikt uppsikt så de inte smyger in sabotage. Staten tar risken, som det ska vara. De som viskar om avfall eller prisstegring är farliga reaktionära element som vi snart ska rensa ut med glädje. Kärnkraften blir vår eviga hammare mot imperialismens lögnare."}, "date": "17 juli, 12:58", "url": "https://www.svt.se/nyheter/utrikes/miljardsatsning-pa-karnkraft-i-tjeckien-ska-ersatta-kol-och-sakra-elen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.5/24472be149dc82b4991b0b695ef218a8386c7d41de7d3789e4463df161ac8996"}, {"type": "image-right", "heading": "Stor skogsbrand härjar i Spanien – sex byar evakuerade", "summaries": {"normal": "En enorm skogsbrand härjar i nordöstra Spanien där över 12 000 hektar skog förvandlats till aska. Sex byar har evakuerats och mer än 1 100 personer flyttats i säkerhet. Ett hundratal brandmän och ett 30-tal brandflygplan bekämpar lågorna. En man har gripits misstänkt för att ha anlagt branden. Ytterligare två bränder rasar norr om Madrid, där över 900 hektar skog brunnit ner och flera samhällen evakuerats. I förra veckan omkom 13 personer i en brand i Almería.", "trump": "Folk, det här är en katastrof i Spanien, en enorm brand som slukar allt, över 12 000 hektar borta, byar evakuerade, tusentals på flykt. De borde ha haft bättre ledning, inte som de svaga europeiska ledarna vi ser hela tiden. Men vi har brandmän som kämpar, riktiga hjältar, och en galning gripen som tände på. De borde ha stoppat det tidigare, det är vad jag skulle ha gjort. Mycket komplex natt, säger de, men vi vinner alltid till slut.", "stalin": "Kamrater, denna destruktiva eld som ödelägger våra spanska skogar är ett verk av sabotage från borgarbrackor och kapitalistiska element som gömmer sig bland folket. Jag har sett hur över 12 000 hektar tallskog förvandlats till aska av dessa fiender till kollektivet. Vi evakuerar byar och likviderar hotet med brandmän och flygplan. En misstänkt arsonist har gripits, men vi ska rensa ut alla hans medbrottslingar i en grundlig utrensning. Paranoia? Nej, det är bara sund vaksamhet mot de som vill se arbetarna brinna."}, "date": "17 juli, 12:53", "url": "https://www.svt.se/nyheter/utrikes/spanien-enorm-skogsbrand-harjar-se-bilderna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.39/0.36/097f732191a4d6e8f08a45769e22f63442865fb464433301779e15e623ac65cc"}, {"type": "image-full", "heading": "Studie: Svensk media lutade åt vänster inför förra valet", "summaries": {"normal": "En studie från Institutet för mediestudier visar att svensk media lutade åt vänster under valrörelsen 2022. TV4, Ekot, DN och flera andra gav vänstersidan gynnsammare bevakning medan Rapport var mest balanserad. Nyheter Idag var det enda mediet med högerövervikt. Centerpartiet och Miljöpartiet fick mest positiv uppmärksamhet, Sverigedemokraterna minst. Medierna prioriterade inte alltid väljarnas viktigaste frågor som sjukvård och utbildning.", "trump": "Folk, det är en katastrof. Den svenska fake news-mediamaskinen lutade så långt åt vänster att de nästan välte omkull innan valet. TV4, Ekot och DN gav vänstern massor av kärlek medan de behandlade Sverigedemokraterna som värsta fienden. Bara Nyheter Idag hade lite sunt förnuft. De glömde bort vanliga människors problem som brott och sjukvård. Patetiskt, men inte oväntat. Media är samma överallt.", "stalin": "Kamrater, denna studie avslöjar hur borgarbrackorna i TV4, Ekot och DN med sin dekadenta klassfiende-propaganda systematiskt gynnat de opportunistiska krafterna inom Centerpartiet och Miljöpartiet medan de med frenetisk paranoia försökte krossa Sverigedemokraterna. Vi ser den borgerliga hydrans många huvuden. Nyheter Idag vågade avvika från kollektivets linje, en farlig tendens som kräver vaksamhet. Våra utrensningar av opålitliga reportrar måste intensifieras för att skydda folkets sanna medvetande. Ha ha, vilka ynkliga kapitalistlakejer."}, "date": "17 juli, 11:44", "url": "https://riks.se/nyheter/studie-svensk-media-lutade-at-vanster-infor-forra-valet", "imageUrl": "https://admin.riks.se/uploads/image_36daab4387.png"}, {"type": "image-right", "heading": "Yrkesfiskare rasar när regeringen godkänner ny vindkraft", "summaries": {"normal": "Regeringen har godkänt två nya havsbaserade vindkraftsparker på västkusten, bland annat utanför Strömstad, som ett led i att säkra Sveriges elförsörjning och stödja klimatomställningen. Beslutet kritiseras av yrkesfiskare som ser sina fiskeområden hotade. Sverigedemokraterna rasar över bristande samordning medan Socialdemokraterna lokalt beklagar avslaget på en park utanför Lysekil. Parkerna ska vara klara senast 2036.", "trump": "Folk, ni skulle se det här! Den svenska regeringen godkänner vindkraft till havs men glömmer att fråga sina egna stödare. Yrkesfiskarna skriker vart fan de ska ta vägen när deras vatten fylls med dessa jättelika monsterturbiner. Under tiden säger de nej till elva andra projekt. Totalt kaos! De behöver en riktig ledare som förstår energi, inte dessa misslyckade liberaler som förstör allt för folket. Så sorgligt.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur den borgerliga regimen äntligen tvingas erkänna folkets behov av fossilfri kraft, men deras fega kompromisser med försvarsintressen och bristande samordning med de så kallade stödpartierna röjer deras svaghet. De yrkesfiskande sabotörerna gnäller som reaktionära lakejer över att deras småbåtars område hotas av den kollektiva framåtskridandets vindkraftverk. Vi ska rensa ut alla kapitalistiska hinder och likvidera de parasitiska element som motarbetar arbetarklassens energiförsörjning. Deras paranoia är underhållande – snart svänger pendeln och de röda fanorna blåser starkare än någon havsvind."}, "date": "17 juli, 10:49", "url": "https://samnytt.se/yrkesfiskare-rasar-nar-regeringen-godkanner-ny-vindkraft", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17083831/vindkraft-.jpg"}, {"type": "image-right", "heading": "Stökig natt på akuten – skydds­ombuden lade skyddsstopp", "summaries": {"normal": "Skyddsombud utlyste skyddsstopp på akuten vid Akademiska sjukhuset i Uppsala efter ett intensivt patienttryck under natten. Ett tiotal sjuksköterskor hade sagt upp sig inför sommaren på grund av bristande arbetsmiljö, vilket ledde till stora luckor i schemat. Personalen hann inte ge mediciner i tid eller bedöma patienter, vilket skapade stress och frustration. Stoppet hävdes efter att extra läkare kallades in och trycket minskade. Facket utesluter inte fler stopp i sommar.", "trump": "De har en total katastrof på det där sjukhuset i Uppsala, folk springer därifrån som aldrig förr. Sjuksköterskorna sa upp sig för att arbetsmiljön var en fullständig röra, och plötsligt har de 680 luckor i schemat. Natten blev kaos, patienter skriker, mediciner ges för sent, alla är sura och förbannade. Skyddsombuden tvingades stoppa allt klockan två på natten. Ledningen är inkompetent, de behöver återställa bemanningen snabbt annars blir det ännu värre. Sådant händer när man inte har de bästa människorna.", "stalin": "Kamrater, jag betraktar med djup misstro dessa sabotage mot det kollektiva vårdkollektivet i Uppsala. En hord av desertörer bland sjuksköterskorna har rymt från sina plikter, troligen lurade av dolda borgarbrackor som underminerar arbetarnas hälsa. När patienterna vältrar in som kontrarevolutionära horder utlyste vi skyddsstopp för att skydda de äkta kämparna från etisk stress och kapitalistisk likgiltighet. Vi ska rensa ut alla fiender till ordningen, kalla in reserver och likvidera bristerna. Inga sabotörer slipper undan mitt vakande öga."}, "date": "16 juli, 13:58", "url": "https://arbetet.se/2026/07/16/stokig-natt-pa-akuten-efter-personalflykt-skyddsombuden-lade-skyddsstopp", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16134335/sdlw87bwh-1lgs-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Romsk tiggare frias för parkvåldtäkt mot autistisk 14-åring: \"Hon borde ha avbrutit\"", "summaries": {"normal": "En 41-årig romsk tiggare friades i Stockholms tingsrätt för våldtäkt mot en 14-årig autistisk flicka i Vitabergsparken. Politiskt utsedda nämndemän röstade ner rådmannens önskan om fällande dom och utvisning. De ansåg att flickan borde ha avbrutit samlaget om hon inte samtyckte, att hon såg ut att vara äldre och att mannen inte förstod hennes ålder på grund av språkbarriären. Åklagaren har överklagat domen.", "trump": "Det här är en total skandal, en katastrof för rättvisan. Den här romske tiggaren frias för att ha våldtagit en autistisk 14-åring och domarna säger att hon borde ha gått därifrån? Vilka idioter. De politiska nämndemännen kör över den riktiga juristen. Flickan ser ut som 20, säger de. Patetiskt. Sverige har blivit ett vansinnets land. Jag skulle aldrig tillåta sådant här i mina städer. En skam.", "stalin": "Kamrater, denna fega friande dom är en sabotagehandling utförd av borgarbrackor och revisionistiska element inom rättsväsendet. Den autistiska flickan, en produkt av det dekadenta systemet, borde ha avbrutit? Vilken sjuk, paranoid ursäkt från dessa klassfiender som gömmer sig bakom nämndemannauniformer. Vi ska rensa ut alla som skyddar romska parasiter och kapitalistiska lakejer. Språkbarriär? Bah! Statens fiender lurar oss alla. Ytterligare utrensningar krävs för folkets skydd."}, "date": "17 juli, 07:47", "url": "https://www.friatider.se/romsk-tiggare-frias-parkvaldtakt-mot-autistisk-14-aring-hon-borde-ha-avbrutit", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-514.jpg"}, {"type": "image-full", "heading": "Grön tillväxt räcker inte – dags att överge BNP", "summaries": {"normal": "I en debattartikel argumenterar fem forskare och hållbarhetsexperter för att grön tillväxt inte räcker för att hantera klimatkrisen. De föreslår att Sverige överger BNP som främsta mål och istället fokuserar på hälsa, trygghet och livskvalitet. En ny studie visar att en planerad omställning med minskad produktion i vissa sektorer kan sänka miljöbelastningen, stärka jämlikheten och behålla sysselsättning genom kortare arbetstid och omfördelning. Författarna uppmanar till en offentlig utredning och medborgarråd.", "trump": "Folk, ni måste höra på det här. Dessa så kallade forskare säger att grön tillväxt är en bluff och att vi ska sluta älska BNP. De vill ha mindre produktion, mer fritid och någon slags medborgarlön. Det är en total katastrof! Vi behöver enorm tillväxt, inte deras socialistiska experiment. Sverige borde istället lyssna på mig – bygg väggar mot klimatet, gör affärer och vinn stort. Deras plan är patetisk, tro mig.", "stalin": "Kamrater, vi befinner oss återigen omringade av fiender till folkets framtid. Dessa borgarbrackor och tillväxtparasiter som gömmer sig bakom gröna lögner har länge förgiftat ekonomin med sin expansionsfetisch. Jag, som alltid genomskådar de dekadenta krafterna, ser nu hur de darrar inför den sanna omställningen. Vi ska rensa ut alla BNP-dyrkande sabotageelement, likvidera arbetslöshetens spöken med arbetstidsförkortning och progressiv utrensning av ojämlikhet. Den som motarbetar medborgarråden är en fiende till kollektivet och kommer att möta den historiska dialektikens mörka humor. Planen segrar!"}, "date": "17 juli, 05:39", "url": "https://www.gp.se/debatt/gron-tillvaxt-racker-inte-dags-att-overge-bnp.d849318e-f9eb-4b13-86b6-dc79741eb104", "imageUrl": "https://www.gp.se/images/article/d849318e-f9eb-4b13-86b6-dc79741eb104/images/1g2ZWRoULhUsEKutA4QKGQpEy1iY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Gränges redovisar rekordresultat – aktien upp 7%", "summaries": {"normal": "Gränges redovisar ett rekordstarkt andra kvartal med högre omsättning än analytikernas förväntningar. Omsättningen steg 37,9% till 9 620 miljoner kronor, medan rörelseresultatet nådde 565 miljoner kronor. Aktien steg 7%. VD Jörgen Rosengren betonar rekordförsäljning och volymtillväxt på 5%, trots osäker marknadsefterfrågan. Framtidsutsikterna är försiktigt positiva, men prispress förväntas i Asien.", "trump": "Vilket kvartal! Gränges, ett fantastiskt företag, slog alla förväntningar – jag visste att de skulle göra det, alla andra var skeptiska, men jag hade rätt, som vanligt. Omsättningen sköt i höjden, 37,9% upp, kan ni tro det? Aktien rusade 7%, helt otroligt! VD:n pratar om rekord, men jag säger bara: vänta tills ni ser vad som kommer härnäst. Asien? Övervärderat. Vi ska dominera marknaden, believe me!", "stalin": "Kapitalistiska Gränges rapporterar 'rekordresultat' – ett ynkligt försök att dölja svagheterna i deras dekadenta system. Trots deras så kallade 'tillväxt' på 5% vet vi att deras marknad är lika stabil som en fiendes frontlinje under vinterkriget. Asien, denna burleska marknad, kommer att krossa deras marginaler som vi krossade fascisterna. Vi förutser deras fall, medan våra egna industrier står starka, oövervinnerliga – precis som Sovjetunionen en gång var!"}, "date": "16 juli, 10:14", "url": "https://www.affarsvarlden.se/artikel/granges-redovisar-rekordresultat-aktien-upp-7", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/04/slitted_aluminium_strips-400x266.jpg"}, {"type": "image-right", "heading": "Utvisad knivman återvände – döms på nytt", "summaries": {"normal": "En 33-årig irakisk man som utvisades till Irak efter en grov knivmisshandel i Lessebo 2022 återvände till Sverige trots återreseförbud. Han vistades hos sin familj i Kronobergs län under juni och juli i år. Växjö tingsrätt dömde honom nu till en månads fängelse för brott mot utlänningslagen. Mannen greps efter att ha försökt fly men stannade självmant. Tingsrätten underkände hans förklaring om okunskap och noterade att han visade upp ett falskt id-kort. Från september skärps straffen för sådana brott till minst sex månaders fängelse.", "trump": "Titta på det här. En kille från Irak som vi kastade ut efter att han högg någon med kniv tre gånger – tre gånger! – smyger tillbaka hit trots att vi sa nej. Han bor hos fru och ungar, visar upp falska id-kort och springer från polisen. Patetiskt. Vi dömer honom till en månads fängelse, men från september blir det minst sex månader. Så ska det vara. Amerika, eller Sverige i det här fallet, måste ha gränser som betyder något. Inga svaga beslut längre. Make Sweden Great Again.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur denna irakiska kontrarevolutionära knivborgarbracka, denna parasit som smugit sig tillbaka in i folkets republik trots att vi med rättmätig vrede utvisat honom efter att ha nästan likviderat en proletär med sin reaktionära kniv, nu får smaka på arbetarklassens järnhand. Han sprang som en feg spion från folket men stannade – typiskt för sådana dekadenta element. Vi underkänner naturligtvis hans lögnaktiga påståenden om okunskap. Från september skall vi rensa ut dessa fiender med minst sex månaders fängelse. Ingen slipper undan. Ingen."}, "date": "16 juli, 15:16", "url": "https://bulletin.nu/utvisad-knivman-atervande-doms-pa-nytt", "imageUrl": "https://cdn.bulletin.nu/articles/dee34110-4b04-4c63-affd-e1bc41fce7b7/preview.jpg?t=1784206153000"}, {"type": "image-full", "heading": "Från 8 juli – då kan dessa mediciner bli billigare", "summaries": {"normal": "Från den 8 juli ingår 27 läkemedel i högkostnadsskyddet utan tidigare begränsningar som styrde vilka patienter som kunde få subvention. Beslutet från TLV kan underlätta för läkare att välja lämplig behandling och öka konkurrensen mellan likvärdiga preparat. På sikt väntas det leda till lägre priser. Patienter betalar inte nödvändigtvis mindre vid nästa apoteksbesök, då det beror på utskrivet läkemedel, apotekets val och redan uppnådd högkostnadsgräns.", "trump": "Titta på det här, det är otroligt. De tar bort alla dessa dumma regler för 27 läkemedel i Sverige, precis som jag alltid sagt – konkurrens, konkurrens, konkurrens! De gamla begränsningarna var riggade av byråkrater som hatar folket. Nu kan priserna rasa, läkare kan äntligen välja det bästa utan att bli hindrade. Det blir fantastiskt, billigare mediciner till alla. Ingen har någonsin sett så bra villkor som de kommer att få nu. Vinna, vinna, vinna!", "stalin": "Kamrater, jag har nu personligen granskat detta beslut och ser en lysande seger för folkets kollektiva hälsa. De 27 läkemedlen befrias från de parasitiska begränsningar som borgarbrackorna och deras lakejer i läkemedelsbolagen tidigare använde för att suga ut arbetarklassen. Vi ska rensa ut alla fiender till konkurrensen – dessa kapitalistiska sabotorer som gömmer sig bakom förmånsregler. Låt priserna falla som huvuden under utrensningarna! Den som vägrar konkurrera är en folkfiende och kommer att likvideras med ett leende. Hälsa till partiet."}, "date": "16 juli, 14:32", "url": "https://nyheter24.se/nyheter/inrikes/1498962-fran-8-juli-da-kan-dessa-mediciner-bli-billigare", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8d7668a904b004a30200000000b004a302/2026/07/16/2378367/Axel-Nyheter24-129.png"}, {"type": "image-right", "heading": "Fem tips – så klarar du hettan", "summaries": {"normal": "SMHI varnar för temperaturer över 30 grader i södra Sverige. För att hantera hettan bör man hålla sig inomhus mitt på dagen, dra ner persienner och vädra på natten. Drick mycket vatten eller vätskeersättning för att motverka vätskeförlust och blodtrycksproblem. Använd löst sittande, ljusa kläder i bomull eller linne samt hatt och solglasögon vid utomhusvistelse. Kyl ner kroppen med dusch eller fuktiga handdukar och var uppmärksam på symtom hos äldre och barn.", "trump": "Folk, det här är en katastrof, den värsta hettan någonsin, tro mig. Jag skulle aldrig gömma mig inomhus som en svag liberal, men ni borde dricka vatten, inte den där gröna skumma grejen. Klä er som riktiga människor, hatt på skallen och solglasögon så ni inte ser ut som bortkomna snuskgubbar. De gamla och småbarnen? Håll koll innan de svimmar som Sleepy Joe mitt i tal. Vi fixar det, ingen har gjort värme bättre än jag.", "stalin": "Kamrater, denna hetta är klassfiendens verk, en imperialistisk sol som vill krossa arbetarkollektivets hälsa. Jag befaller er att hålla er inomhus som i en riktig statsapparat, vädra endast under natten och drick vatten för att undvika borgarbrackornas blodtrycksfall. Lossa era kläder, ni ska inte likvideras av värmen. Kyl ner er mot kapitalistmaffians sol, men vakta särskilt på de svaga elementen. Paranoia? Nej, bara vaksamhet mot folkfiendernas osynliga angrepp."}, "date": "16 juli, 12:12", "url": "https://www.tv4.se/artikel/tt-260716-varmevarningrad1-4376c146/fem-tips-sa-klarar-du-hettan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlb_vvgQW8w4U%2F703dde8447b7ce9f5d6c8ffb7955c7dd%2FDet_ar_bra_att_ha_hatt_pa_huvudet_for_att_skydda_sig_fran_den_starkaste_solen._aven_solglasogon_ar_bra._Arkivbild&width=1024"}, {"type": "text", "heading": "Fler ska vilja jobba i äldre­omsorgen – regeringen tar fram plan", "summaries": {"normal": "Regeringen ska ta fram en nationell plan för att locka fler till äldreomsorgen och få befintlig personal att orka stanna kvar. Socialstyrelsen får i uppdrag att undersöka hur man kan rekrytera, behålla och återlocka medarbetare samt vilken kompetens som behövs. Äldre- och socialförsäkringsminister Anna Tenje betonar att fler måste vilja och orka arbeta i dessa viktiga yrken för att förbättra omsorgen. Planen ska redovisas i december 2027.", "trump": "Det här är en total katastrof, folk orkar inte jobba hos de gamla längre, vanvård och kaos överallt. Vi behöver de bästa, de tuffaste människorna i äldreomsorgen, inte bara några som ger upp före pensionen. Jag ska säga er, ingen gör det bättre än jag när det gäller att locka folk till jobb, vi ska göra äldreomsorgen så stor och framgångsrik igen att alla vill vara med. Tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras parasitiska vårdkapitalister har låtit den proletära äldreomsorgen förfalla till en grogrund för vanvård och klassfiendens våldtäktsförsök. Vi ska nu med järnhand rensa ut alla svaga element som inte orkar till pensionen och likvidera den sabotageverksamhet som skrämmer bort arbetarna från de ädla uppgifterna. Inga kontrarevolutionära desertörer får fly undan. Den nationella planen blir en seger för folket, eller också blir det utrensning. Ha ha, skämtade jag? Kanske inte."}, "date": "16 juli, 11:45", "url": "https://arbetet.se/2026/07/16/sa-ska-fler-vilja-jobba-i-aldreomsorgen-regeringen-tar-fram-nationell-plan"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder nedåt efter intensiv rapportmorgon", "summaries": {"normal": "Stockholmsbörsen öppnade lägre efter en intensiv rapportmorgon. OMXS30-indexet sjönk 0,62% till 3 131,17. ABB överträffade förväntningarna och meddelade uppköp av brittiska Rotork. Hälsovårdssektorn gick bäst (+0,5%), medan telekom och dagligvaror föll mest (-0,9%). Bland enskilda aktier steg Lifco B (+0,8%) och Nibe B (+0,5%), medan Tele2 B backade mest (-3,4%). Flera bolag som Essity, Nordea och Mips presenterade kvartalsrapporter med blandade resultat.", "trump": "Stockholmsbörsen? Total katastrof idag, folks, verkligen svagt! ABB, de gjorde något bra med ett uppköp – smart, men ändå sjunker deras aktie. Otroligt! Mips? Upp 22% – de är vinnare, jag gillar vinnare. Men Tele2? Hemska siffror, helt misslyckat. Och analytikerna? De vet ingenting, jag har sagt det förut. Hälsovårdssektorn? Lite bättre, men inte bra nog. Sverige behöver en vinnare som jag för att fixa det här kaoset!", "stalin": "Idag visar den kapitalistiska börsen i Stockholm sin inneboende svaghet. ABB, ett bolag med viss disciplin, försöker expandera genom att sluka brittiska Rotork – men marknaden straffar dem ändå. Hälsovårdssektorn, den enda som visar tecken på liv, medan telekom och dagligvaror – dessa dekadenta borgerliga sektorer – faller som förrädare. Mips stiger? Ett undantag, precis som våra framgångar i Ukraina. De andra? Svaga, precis som väst. Vi ska omstrukturera detta kaos – med järnhand!"}, "date": "16 juli, 09:50", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-nedat-efter-intensiv-rapportmorgon", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdl3SU43aVmyrg-400x266.jpg"}, {"type": "image-right", "heading": "Irans hot: Kommer slå mot ”all infrastruktur”", "summaries": {"normal": "USA har attackerat en iransk oljetanker i Persiska viken nära Kharg-terminalen, samt iranska kommandocentraler, luftförsvar och robotresurser. Iran hotar med att slå mot all infrastruktur i regionen om USA fortsätter. Luftförsvaret har aktiverats i Teheran, explosioner har rapporterats i norra och västra Iran samt i Kuwait och Jordanien där iranska drönare angripit amerikanska mål. Kuwait bekräftar incidenter men uppger att det handlar om nedskjutningar.", "trump": "Vi har just slagit till mot den sanktionerade supertankern Belma som försökte bryta vår blockad vid Kharg. Boom, borta! Iran skriker nu om att de ska attackera all infrastruktur, men det är bara svagt gnäll från förlorare. Vi har rensat ut deras kommandon, robotar och luftförsvar. Explosioner i Kuwait, Jordanien och Bahrain – de springer runt som galningar. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, vi betraktar med djup tillfredsställelse hur de amerikanska imperialisternas desperata bombningar av den stackars tankern blottar deras sjuka aggression. Dessa borgarbrackor tror sig kunna hota arbetarnas fäste i Persien. Jag har beordrat att all infrastruktur skall försvaras med järnhand. Explosionerna i Teheran, Kuwait och Jordanien är blott de dekadenta kapitalisternas patetiska dödsryckningar. Vi ska rensa ut dessa parasitiska gnagare en gång för alla, med ett leende på läpparna."}, "date": "16 juli, 09:38", "url": "https://www.di.se/nyheter/irans-hot-kommer-sla-mot-all-infrastruktur/", "imageUrl": "https://static.bonniernews.se/ba/3ae070f2-8e08-4368-98b2-02f2e07ab5e9.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Studie: Kultur kopplas till bromsat åldrande", "summaries": {"normal": "En japansk studie visar att kulturella aktiviteter som museum-, opera-, teater- och biobesök kan bromsa det fysiologiska åldrandet med upp till tre år. Effekten är jämförbar med regelbunden fysisk träning. Forskarna undersökte blodtryck, BMI och gånghastighet hos nära 1 900 britter över 50 år. Studien är observationsbaserad och kan inte bevisa orsakssamband; det är möjligt att friskare personer helt enkelt ägnar sig mer åt kultur.", "trump": "Folk, lyssna på det här – en studie säger att gå på teater och opera får dig att se ut som tre år yngre. Fantastiskt! Bättre än Biden någonsin såg ut efter sin fjärde tupplur. Jag älskar kultur, de bästa kulturerna, inte den där woke-skräpen som förstör allt. Glöm gymmet, ta en opera istället. Det är yngre, starkare, vinnande. De säger att det är lika bra som träning – tro mig, jag vet allt om vinnare.", "stalin": "Kamrater, jag har studerat denna rapport med största uppmärksamhet. Kulturella aktiviteter under folkets kontroll kan fördröja det fysiologiska förfallet med tre år, en seger för det kollektiva välbefinnandet. Låt borgarbrackorna i väst fortsätta sin dekadenta dekadens medan vi rensar ut alla klassfiender som vägrar delta. Den som inte går på teatern är misstänkt sabotage mot statens hälsa. Tre år yngre – ett dialektiskt mirakel mot imperialismens åldrande!"}, "date": "16 juli, 08:07", "url": "https://www.etc.se/kultur-noje/studie-kultur-kopplas-till-bromsat-aaldrande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071602070_c0e73f9b93d401b878848e411c28b84afa8eda3d0f24ce1d47559ddb977d2833.jpg"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
