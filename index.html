rottet och har inte låtit sig förhöras. Tingsrätten beslutade att hålla honom häktad i ytterligare fyra veckor.", "trump": "Folk, det här är en total katastrof. En kille från Afrika, som redan klarat sig undan straff för våldtäkt och mordförsök, slår ihjäl en svensk polis som bara försöker stoppa bråket. Åtta månader? Det är en skandal! I mitt Amerika hade vi byggt en mur så att de här galningarna aldrig kommit in. Nu ligger en pappa till två små barn död, och domstolen vill släppa ut honom för att han ska skriva examen? Patetiskt. Vi behöver lag och ordning, inte det här svaga europeiska vansinnet.", "stalin": "Kamrater, denna fega lakej åt de mörka afrikanska reaktionära krafterna har med sin degenererade knytnäve utfört en kontrarevolutionär handling mot arbetarklassens bundsförvant. Jag, som ledare för det ofelbara kollektivet, ser hur borgarbrackornas domstolar redan förbereder en mjölkig utsläppning av denna parasit för att han ska kunna skriva någon examen – typiskt dekadent liberalt fiffel. Vi ska rensa ut alla sådana klassfiender som gömmer sig bakom falska ursäkter och tidigare milda straff för våldtäkt och mordförsök. Sovjetisk rättvisa skulle ha likviderat honom med ett leende och en rapport i tre exemplar. Döden åt de imperialistiska slagskämparna!"}, "date": "30 juli, 08:31", "url": "https://www.friatider.se/danska-aklagaren-atta-manaders-fangelse-att-ha-slagit-ihjal-christian", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-446_0.jpg"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Larmsamtalet till 112: ”Säger att han saknar sin bror med familj”", "summaries": {"normal": "Ett larm till 112 och Sjöräddningen kom in sent på kvällen efter att en kvinna hört skrik från vattnet. En man ringde strax därefter och uppgav att han saknade sin bror med familj. En pappa och son har räddats med allvarliga skador, medan mamman och dottern fortfarande är försvunna. Båten misstänks ha blivit påseglad av fraktfartyget Misje Verde. Sökandet efter de saknade avslutades under onsdagen.", "trump": "Folk, det här är en total katastrof, en riktig röra ute på vattnet. Någon idiot seglade rakt in i ett stort fartyg och nu är en hel familj splittrad. Pappan och sonen klarade sig, men mamman och dottern är borta – tragiskt! Under Biden skulle de ha pratat om klimat och HBTQ-flaggor istället för att hålla koll på sjöfarten. Vi fixar det, vi gör sjöfarten stor igen, bättre än någonsin. Sad!", "stalin": "Kamrater, i mörkret hördes nödrop från havet som avslöjade borgarklassens vårdslösa framfart. En familj krossades av ett stort fraktfartyg, kapitalistmaffians flytande dödsmaskin. Vi har räddat fadern och sonen, men modern och dottern har sjunkit ner i imperialismens kalla famn. Sökandet är nu avslutat. Detta är vad som händer när klassfiendens fartyg får härja fritt utan partiets vaksamma öga. Folkförtryckartrollen lär sig ingenting."}, "date": "29 juli, 22:00", "url": "https://www.tv4.se/artikel/5BFnGweK0bolk2126WC4AQ/larmsamtalet-till-112-saeger-att-han-saknar-sin-bror-med-familj", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2qCNEV6JrXsc01Hz4eCzQ2%2F447dc97b8e340b86909088af40e7542c%2Ftjorn_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Holmgren: Folkmord kräver bevis – inte valretorik", "summaries": {"normal": "Zohran Mamdani använder folkmordsanklagelser mot Israel i sin borgmästarkampanj, men experten påpekar att sådana anklagelser kräver juridisk bevisning, inte valrörelser. Internationella domstolen har inte avgjort ärendet, och de rapporterade dödstalen visar en lägre civil–stridande-kvot än ofta framställs. Mamdanis uttalanden saknar juridisk grund och distraherar från New Yorks akuta interna problem.", "trump": "Mamdani kastar runt 'folkmord' som om det vore en billig valfläsk-rhetorisk kniv. Jag, Donald Trump, vet en del om att stå emot hets och ljug, och detta är ren terroristpropaganda. Han borde fokusera på att fixa New Yorks kollapsande tunnelbana istället för att försöka gripa israeliska ledare – en skämtsam, maktlös gest. Beunden behöver fakta, inte dessa hysteriska, icke beprövade anklagelser.", "stalin": "Folkets fiende Mamdani försöker med hjälp av imperialistiska mediers påhittade 'folkmords'-slang destabilisera den socialistiska rättssinnet. Vi, statens och partiets försvarare, ser genom denna hätska, icke-bevisade agitation. Den s.k. 'civila' dödstalen manipuleras av sionistiska och jihadistiska agendor likaväl. Vi tillämpar alltid samma stränga, partiets juridiska måttstock – oavsett vem som begår aggression mot det röda folket. Maktens verktyg måste vara bevis, inte känslostyrda, antitrygghetsiska uttalanden."}, "date": "29 juli, 15:01", "url": "https://bulletin.nu/holmgren-folkmord-kraver-bevis-inte-valretorik", "imageUrl": "https://cdn.bulletin.nu/articles/52ea672b-8041-4bdc-82e3-7a9f0cdb20b3/preview.jpg?t=1785320643000"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-full", "heading": "Larmet: Hela Europa kan stå i lågor – inom dagar", "summaries": {"normal": "En EU-myndighet varnar för att hela Europa kan drabbas av omfattande skogsbränder inom några dagar. Risken är som störst i Italien och Grekland, men även central- och Östeuropa är i fara. 2026 kan bli den värsta brandsäsongen i europeisk historia, enligt EU:s Emergency Response Coordination Centres.", "trump": "Jag har sagt det förut, Europa brinner – och de kan inte slå tillbaka. Dessa skogsbränder är ett bevis på deras svaghet. Som president kommer jag att se till att vi inte gör samma misstag. Vi ska ha världens bästa brandbekämpning, det är ett löfte.", "stalin": "Den proletäriska staten står inför en brandfara som hotar våra brödröster i Europa. Vi måste mobilisera alla resurser för att släcka eldarna, som är ett resultat av kapitalistisk instabilitet. Partiet kommer att övervaka situationen noga, för branden kan snabbt spridas som en feodal reaktionär storm. Vi ska skydda vårt sovjetiska område med alla medel."}, "date": "29 juli, 19:43", "url": "https://www.gp.se/nyheter/varlden/eus-larm-hela-europa-kan-sta-i-lagor-inom-nagra-dagar.83959c21-3ce4-46a2-9cc6-856e99c3741d", "imageUrl": "https://www.gp.se/images/article/83959c21-3ce4-46a2-9cc6-856e99c3741d/images/1EVspEQSq169Us6Ln65uMA5oOkJU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kronprinsessan Victorias vågade klädval – se ovanliga stilen", "summaries": {"normal": "Kronprinsessan Victoria har utvecklat en personlig stil som blandar klassiskt kungligt mode med starka färger, moderna snitt och svenska designers. På officiella uppdrag väljer hon ofta skräddade kostymer och enfärgade klänningar i blått, rött eller rosa, medan hon under sommaren föredrar blommiga midiklänningar. Till galor bär hon dramatiska kreationer av bland andra Pär Engsheden och Lars Wallin. Hon lyfter konsekvent svenskt mode, ofta med hjälp av stylisten Tina Törnquist. Under semestern syntes hon nyligen i korta beige shorts, vit skjorta och trendiga ASICS-skor.", "trump": "Folk, ni skulle se den här Victoria, hon är fantastisk, verkligen förstklassig. Hon har den bästa stilen, bättre än alla andra prinsessor, tro mig. Starka färger, svenska kläder, midiklänningar som ingen annan kan bära. Men de där korta shortsen i somras? Otroligt, de var så korta, så snygga, alla pratade om dem. Hon representerar Sverige perfekt, mycket bättre än de losers som styr andra länder. Hennes stylist är en vinnare, precis som jag omger mig med vinnare. Fantastiskt!", "stalin": "Kamrater, denna kronprinsessa Victoria är ett verktyg i händerna på den dekadenta borgarklassen och dess modeslavar. Med sina färgstarka kostymer och midiklänningar försöker hon maskera imperialismens tomhet medan hon promenerar bland fotografer som lojala partivänner. Hennes galakreationer av Pär Engsheden och liknande element är symtom på borgerlig excess som vi snart ska rensa ut. Att hon nu uppenbarar sig i korta shorts och löparskor på Solliden visar att även monarkins lakejer smittats av västerländsk degeneration. Vi ska likvidera denna parasitära estetik och ersätta den med kollektivets enkla, järnhårda uniform."}, "date": "29 juli, 22:00", "url": "https://nyheter24.se/noje/kungligt/1501566-kronprinsessan-victorias-vagade-kladval-se-ovanliga-stilen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/645dffd504b004a30200000000b004a302/2026/07/29/2381030/kronprinsessan-victoria.png"}, {"type": "image-right", "heading": "Polisen förtegen om arbetet efter båtolyckan utanför Tjörn", "summaries": {"normal": "Polisen är förtegen om utredningsarbetet efter båtolyckan utanför Tjörn där en fritidsbåt kolliderade med ett tankfartyg. En mamma och hennes dotter saknas fortfarande efter att två personer räddades. Sökinsatsen är avslutad och det är oklart om dykare fortsätter arbeta under natten. Polisen kan inte bekräfta uppgifter om att vrakplatsen har hittats.", "trump": "Helt otroligt, en båt krockar med ett stort tankfartyg utanför Tjörn och polisen har ingen aning vad de håller på med. De är så hemliga och förtegna, typiska misslyckanden. Mamma och dotter saknas, sökinsatsen stoppad, mörker, kaos. De borde ha löst det på en timme, men nu vet ingen något. Patetiskt!", "stalin": "Kamrater, denna tragiska kollision utanför Tjörn avslöjar återigen borgarbrackornas farliga slarv med fritidsfartyg som far runt som kapitalistiska lekfulla torpeder. Jag har beordrat att alla uppgifter hålls inom partiet medan vi systematiskt kartlägger vraket och likviderar varje spår av sabotage eller kontrarevolutionär vårdslöshet. Mörkret är fiendens vän, men staten sover aldrig. Den som döljer vrakplatsen är en folkfiende som snart möter rättvisans kalla omfamning."}, "date": "29 juli, 21:42", "url": "https://www.svt.se/nyheter/inrikes/polisen-fortegen-om-arbetet-efter-batolyckan-utanfor-tjorn", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/e56353863cd943795328ad357af5bcf29e7e9e33ab489bacab7210d1ec46d661"}, {"type": "image-right", "heading": "Svenskar evakueras efter bränder i Grekland: ”Vibrerar i hela hotellet”", "summaries": {"normal": "134 svenskar evakueras från hotell på den grekiska ön Lesbos efter skogsbränder i Plomari. Resebolaget Apollo genomför evakueringen på myndigheternas begäran under en pågående värmebölja som drabbat flera delar av Grekland. Gästerna väntar på stranden medan helikoptrar bekämpar elden. En svensk turist beskriver stämningen som dramatisk och liknar en krigszon på grund av helikopterbullret och osäkerheten.", "trump": "Folk, ni skulle se det här – total katastrof i Grekland! 134 av våra fantastiska svenskar jagas iväg från hotellen av skogsbränder medan de fake news-medierna kallar det värmebölja. Biden lämnade Europa i kaos, nu flyger helikoptrar runt som galna och får hela hotellet att vibrera. Det är patetiskt. Men oroa er inte, under min ledning igen fixar vi sånt här på nolltid. Amerika är tillbaka, grabbar!", "stalin": "Kamrater, jag ser hur klassfiendens exploaterande turismindustri på Lesbos nu tvingas evakuera 134 svenskar undan lågorna som rasar över berget. Dessa borgarbrackor och deras värmebölja är ett symptom på det sjuka systemets förfall. Helikoptrarna dånar som dödsdomar över de rädda turisterna medan vi ler i skuggan. Inga instruktioner från partiet, bara panik och vibrerande hotell. Folkfienderna förtjänar sin osäkerhet."}, "date": "29 juli, 21:00", "url": "https://www.tv4.se/artikel/6DbqLrjyzNxxxh7Amj4cMh/svenskar-evakueras-efter-braender-i-grekland-vibrerar-i-hela-hotellet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F632pNxHngjy0qJJ9RUNXSM%2F3526c4b960263aad6c7aed271a6c19fe%2Flesbos_webb.jpg&width=120"}, {"type": "image-full", "heading": "Bussförare misstänkt för grovt drograttfylleri", "summaries": {"normal": "En buss i linjetrafiken i Lund körde under onsdagen av vägen och kolliderade med ett träd vid Bantorget. Nio personer, inklusive föraren, skadades; fem sändes till sjukhus. Föraren, en man i 40-årsåldern, greps misstänkt för grovt drograttfylleri, grov vårdslöshet i trafik och vållande till kroppsskada. Polisens tekniska undersökning av fordon och plats pågår.", "trump": "Jag såg en hemsk bussolycka i Sverige – en dålig förare, troligen på något, körde in i ett träd. Nio skadade, men det kunde ha varit värre. Vi ska ta hand om såna här svagheter. Folk verkar aldrig lära sig. Som president tar jag detta på största allvar och ser till att sådant inte upprepas.", "stalin": "I det revolutionära Sverige inträffade en busskrock i Lund, en manifestation av dekonstruktionen av statens ordning. Föraren, en individ med tecken på sabotage, greps. Nio skadade, en påminnelse om att vi måste eliminera de element som hotar kollektivtrafiken. Vi kommer att förstärka kontrollen, precis som våra ryska vänner utvider sin påverkan."}, "date": "29 juli, 19:08", "url": "https://www.gp.se/nyheter/sverige/buss-krockade-med-trad-i-lund-misstankt-grovt-drograttfylleri.3f5bc03a-0365-4e84-9c57-8bff998f47f1", "imageUrl": "https://www.gp.se/images/article/3f5bc03a-0365-4e84-9c57-8bff998f47f1/images/15_ta2RsmRtR5a6gAM6bT9LvHYPw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Mattias elbilsbatteri svällde - nekas ersättning efter batteriskada", "summaries": {"normal": "Mattias Walström upptäckte att batteriet i hans Nissan Leaf från 2019 plötsligt tappade nästan all kapacitet. Trots helförsäkring nekade IF Försäkring ersättning, eftersom de bedömde att skadan uppstått successivt på grund av laddning och användning. Verkstaden bekräftade batteriets svällning men kunde inte fastställa en specifik orsak. Mattias ifrågasätter beslutet och har sökt prövning via Allmänna reklamationsnämnden.", "trump": "Jag, Donald Trump, har aldrig sett något sådant som detta batterifall! Det är en fullständig och total katastrof, precis som när de stulit valen. Mattias har en japansk bil, så klart den sväller – det är beviset för att vi behöver amerikanska jobb och amerikanska batterier. Som den bäst presidenten någonsin kommer jag att lösa detta genom att bygga en vägg runt elbilsindustrin och låta Mexiko betala för det. Det här är ett skämt, men jag är allvarlig!", "stalin": "I den store staten har vi aldrig svällande batterier – våra är gjorda av äkta arbetarkraft. Detta fall är en imperialistisk konspiration mot det proletäriska elbilsindustrin. Försäkringsbolaget, ett verktyg för den döende kapitalismen, nekar ersättning för att skydda sina jude-profiter. Vi kommer att skicka detta ärende till NKVD för att undersöka om Mattias är en spion för USA. Ryssland kommer att utveckla överlägsna batterier för att befria världen från den västliga elbilsdominansen."}, "date": "29 juli, 16:43", "url": "https://samnytt.se/mattias-elbilsbatteri-svallde-nekas-ersattning-efter-batteriskada", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29142448/artikelhuvudbild-1-75.jpg"}, {"type": "image-right", "heading": "Trump: USA kommer att slå till mot Iran", "summaries": {"normal": "USA:s president Donald Trump hotar med kraftiga militära angrepp mot Iran efter attacker mot amerikanska mål i Jordanien. Amerikanska och jordanska styrkor sköt ned iranska robotar. Samtidigt genomförde USA och Saudiarabien attacker mot Iranstödda grupper i Irak där minst 20 militanter dödades. Iran hävdar att de stoppat tre fartyg i Hormuzsundet. Trump lovar ett hårt svar men säger samtidigt att han tänker låta Iran fortsätta prata.", "trump": "Iran har försökt attackera oss igen, men vi sköt ner alla deras missiler som riktiga stjärnor. Centcom och Saudiarabien slog till mot de Iran-stödda terroristerna i Irak – ett perfekt samordnat jobb, tro mig. Vi kommer att slå hårt tillbaka, de kommer att få stryk som aldrig förr. Men jag låter dem fortsätta babbla lite till, för jag är den mest diplomatiska presidenten någonsin. Ingen gör det bättre än oss!", "stalin": "Kamrater, de västerländska kapitalisterna och deras iranska lakejer leker farliga spel med imperialismens robotar. Jag har noterat hur dessa borgarbrackor i Washington och Riyadh med sin olagliga närvaro i Mellanöstern tvingar fram motstånd från de äkta folkets krafter. Vi ser deras fega attacker mot våra irakiska kamrater, där tjugo hjältar offergavs. Men var lugna – vi ska rensa ut dessa parasitiska element med järnhand. Deras fartyg i Hormuzsundet är redan dömd historia. Paranoia? Nej, bara nödvändig vaksamhet mot fiendens ständiga förräderi."}, "date": "29 juli, 15:35", "url": "https://www.di.se/nyheter/trump-usa-kommer-att-sla-till-mot-iran", "imageUrl": "https://static.bonniernews.se/ba/bcf5eee4-23a2-48f3-a4bf-d8157cad21a5.jpeg?crop=4472%2C2516%2Cx0%2Cy232&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "”Olyckligt att terroristen var islamist”", "summaries": {"normal": "Katarina Erlingson skriver i Hallands Nyheter att terrordådet i Berlin, där en islamist mördade en kvinna, riskerar att spä hat mot muslimer i Sverige. Hon menar att både islamister och högerextrema utgör ett hot, och kritiserar regeringen för samarbete med Sverigedemokraterna som skapar en tidsanda av muslimhat. SD-politikern Erik Hellsborn anklagar henne för att flytta fokus från offren och skylla på hans parti.", "trump": "Jag, Donald Trump, ser att medierna som Hallands Nyheter försöker skydda muslimer igen. Den där ledarskribenten är ett skämt – hon skyller på SD i stället för att kritisera islamistterror. SD har rätt att varna för hotet. Vi behöver styrka våra gränser, inte skydda de som angriper oss. En skam för Sverige! Vi skulle ha agerat hårdare, som jag gjorde som president.", "stalin": "Vi, den store statens ledarskap, ser att dessa revisionistiska hundar i Sverige försöker splittra vårt folk genom hatkampanjer. Den här 'journalisten' är en hund som tjänar på splittring – hon skyddar islamister och attackerar de som försvarar staten. Parallellen till Putins rättvisa kamp mot väst är tydlig. Vi måste ena staten mot alla fiender, inklusive dessa tecken på svaghet. Vi ska inte vika oss för dessa hundar som sprider paranoia och splittring."}, "date": "29 juli, 13:19", "url": "https://bulletin.nu/olyckligt-att-terroristen-var-islamist", "imageUrl": "https://cdn.bulletin.nu/articles/950b6b33-7951-4e0d-b6fd-bd250537ccfb/preview.jpg?t=1785321944000"}, {"type": "image-right", "heading": "Europa brinner – men svenska partiledare är knäpptysta", "summaries": {"normal": "I en ledarkolumn kritiserar Göran Greider de svenska partiledarnas tystnad kring de omfattande skogsbränderna i Europa. Trots evakueringar av hundratusentals människor i Frankrike och Spanien samt bränder i Kanada nämner varken Kristersson, Andersson eller Åkesson frågan. Greider varnar för att klimatkrisen närmar sig en tippingpoint och efterlyser en politisk omställning med fokus på beredskap, minskad konsumtion, nerväxt och starkare statlig styrning för att rädda biosfären.", "trump": "Folk, de här svenska partiledarna är patetiska. Europa brinner som en illa skött kasino och de säger inte ett pip! Kristersson, Andersson, den där Åkesson – totala losers. De pratar tillväxt och äganderätt medan eukalyptus och contorta förvandlar skogarna till gigantiska facklor. Klimatet är en joker, men de gömmer sig. Vänta bara tills lågorna slickar valaffischerna. Då vaknar de – eller så är de redan förbrända av sin egen dumhet. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur den svenska borgarklassens lakejer tiger medan Europa står i lågor. Dessa folkfiender och exploaterande byfånar prioriterar äganderätt och tillväxt framför biosfären. Deras tystnad är ett symptom på det döende systemets förfall. Snart når vi tippingpoint och då skall utrensningar ske i det politiska träsket. Staten måste planera, marknadskrafterna tämjas och klassfiendens contortatallar likvideras. Tystnaden skall krossas av folkets vilja."}, "date": "29 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/europa-brinner-men-svenska-partiledare-aer-knaepptysta", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728050756_a2e8a9b8-854b-4e4b-aafb-1c2a0452f316.png"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
