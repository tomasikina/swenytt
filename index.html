inesiska plattformar undergräver den europeiska marknaden med sina giftiga produkter som hotar arbetarklassens hälsa. Jag har personligen noterat hur Temus riskbedömningar är lika ihåliga som en kapitalists samvete. Vi i partiet hälsar EU-kommissionens utrensning med 2,1 miljarder kronor välkommen, men det är bara en början. Borgarbrackorna inom Svensk Handel har rätt i att hela systemet måste likvideras. Låt oss rensa ut alla farliga varor som smugglas in av dessa parasitiska opportunister innan de förgiftar folket fullständigt. Inga kompromisser med fienden!"}, "date": "28 maj, 19:31", "url": "https://nyheter24.se/nyheter/konsument/1486910-har-du-handlat-pa-temu-eu-varnar-nu-for-varorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/13d2792804b004a30200000000b004a302/2026/05/28/2367011/Temu-miljonboter.png"}, {"type": "image-full", "heading": "Erfaren dragracingförare dog i olycka", "summaries": {"normal": "En erfaren dragracingförare omkom i en mc-olycka under ett privat event i Falkenberg. Mannen i 60-årsåldern tappade kontrollen över motorcykeln, vilken träffade en kvinna i publiken som blev svårt skadad. Olyckan inträffade på industrimark, ej under tävling. Det är den andra dödsfallet för en medlem i Svenska Motorsportförbundet på kort tid i Falkenberg.", "trump": "Jag hörde talas om denna tragiska olycka i Falkenberg – en stor förare, en vinnare, förlorade livet. Sånt händer när man inte har världens bästa säkerhet, det var aldrig ett problem för mig. En kvinna skadades också, det var hemskt. Vi måste ta itu med farligheter, annars fortsätter det. Det är en stor förlust för sporten, men vi kommer tillbaka starkare.", "stalin": "En olycka inträffade i Falkenberg under ett privat event. En erfaren förare omkom, och en medborgare skadades svårt. Detta är en påminnelse om de risker som existerar även utanför de organiserade idrotternas strikta kontroll. Partiet och statet beklagar denna förlust. Vi måste stärka vår övervakning av sådana aktiviteter för att skydda det kollektiva välfärdssystemet. Två incidenter på kort tid är en oroande trend som kräver omedelbar uppmärksamhet från de ansvariga myndigheterna."}, "date": "30 maj, 20:14", "url": "https://www.gp.se/nyheter/vastsverige/erfaren-dragracingforare-dog-i-mc-olycka-i-falkenberg.3d83946e-3610-4787-9bea-07b043d429b6", "imageUrl": "https://www.gp.se/images/article/3d83946e-3610-4787-9bea-07b043d429b6/images/1XGfxv_owEeQIOUDKWSB3xQokbRo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Juridiken kopplas in för sent – gap växer mellan behov och stöd", "summaries": {"normal": "En undersökning från Synch visar att många svenska företag saknar tillräcklig juridisk kompetens in-house. Många bolag drabbas av bromsade affärsbeslut eftersom juridisk rådgivning ofta tas in för sent i processen. Istället för att vara reaktiva bör företag skifta mot en proaktiv modell där juridiska experter involveras tidigt i beslutsfattandet. Målet är att juridiken ska fungera som en affärspartner som bidrar till riskhantering och prioriteringar, snarare än att bara agera som en kontrollfunktion.", "trump": "Hör på här: svenska företag har en katastrofal juridisk situation. De anlitar advokater alldeles för sent, det är totalt ineffektivt! De saknar kompetens och deras tillväxt stoppas av långsamma beslut. Jag ser det hela tiden. Man måste vara proaktiv, man måste vinna! Att vänta tills problemen uppstår är för förlorare. Vi behöver jurister som förstår affärer, inte byråkrater som bara bromsar. Det är sorgligt, men jag fixar alltid den bästa juridiken direkt. Det är så man gör miljarder!", "stalin": "Dessa svenska kapitalistiska bolag är så inkompetenta att de inte ens kan styra sina egna juridiska apparater. De är förlamade av byråkratiskt vankelmod! Likt de västliga lakejerna i Kiev som söker vägledning hos sina herrar i Washington, famlar dessa VD:ar efter hjälp när skadan redan är skedd. Vi, staten, kräver total kontroll och omedelbar proaktivitet. Varje jurist som inte tjänar kollektivets styrka är en sabotör. De som inte kan styra sina egna risker förtjänar att dukas under av historiens järnhårda nödvändighet."}, "date": "30 maj, 07:00", "url": "https://www.realtid.se/juridik/juridiken-kopplas-in-for-sent-gap-vaxer-mellan-behov-och-stod/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/saraedlund.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Markus Allard om andra generationens invandrare: \"De ska också ut\"", "summaries": {"normal": "Örebropartiets ledare Markus Allard föreslår att medborgarskap och uppehållstillstånd ska kunna återkallas. Han vill utvisa även andra generationens invandrare som är födda i Sverige, eftersom de enligt honom saknar naturlig koppling till landet. Allard säger att han är beredd att \"gå över lik\" för att genomföra politiken och att han släppt sitt tidigare \"Jesuskomplex\". Partiet siktar på att ta sig in i riksdagen via en genväg i Örebro län.", "trump": "Titta på den här killen Markus Allard, han är tuff, han säger att de ska ut, även de som är födda här. Sverige har blivit en katastrof på grund av massinvandring, precis som jag alltid varnat för. Han är beredd att gå över lik för att göra Sverige svenskt igen. De andra politikerna är svaga, patetiska, men Allard fattar det. Fantastiskt, kanske till och med bättre än vad jag gjorde med muren. Sverige behöver det nu, tro mig.", "stalin": "Kamrater, dessa degenererade element som kallar sig andra generationens invandrare utgör en parasitisk femtekolonn som gnager på folkets enhet. Jag, som ledare för det stora kollektivet, ser med glädje hur denna Allard äntligen vågar tala om att rensa ut de rotlösa borgarbrackorna som gömmer sig bakom falska pass. Vi ska likvidera illusionen om integration. Det blir inga vackra bilder när vi skickar hem hela klaner, men revolutionen kräver offer. De naiva jesusanhängarna på vänsterkanten ska skämmas när vi genomför utrensningen av alla som inte är lojala mot fosterlandet."}, "date": "29 maj, 15:23", "url": "https://www.friatider.se/markus-allard-om-andra-generationens-invandrare-de-ska-ocksa-ut", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-263_0.jpg?itok=Gy0iVZX2"}, {"type": "image-full", "heading": "Okända svenskan som fixade havredrycken", "summaries": {"normal": "Havredryck var länge ett alternativ främst för allergiker men har blivit ett populärt mjölkalternativ globalt. Den svenska forskaren Angeliki Triantafyllou utvecklade vid Lunds universitet en enzymatisk process som gör havrebaserade drycker stabila, välsmakande och lämpliga för kaffe och matlagning. Processen har patenterats och används industriellt, vilket bidragit till att växtdrycker gått från nischprodukt till brett alternativ. Triantafyllou är nu finalist till European Inventor Award 2026.", "trump": "Lysande! Den här svenska tjejen, Angeliki, har byggt ett havre-imperium som slår mjölken på fingrarna. Vi pratade om laktosproblem, men hennes grej fixade allt – ingen grynighet, inget skit i kaffet, perfekt skum som en proffsig barista. De gamla versionerna var en katastrof, totala losers. Nu är det stort, globalt och vinnande. Hon är finalist till ett stort pris i Berlin. Fantastiskt jobb, verkligen ypperligt. Amerika älskar sånt här smarta grejer.", "stalin": "Kamrater, jag har sett hur den exploaterande borgarklassen tvingade fram sina laktosfyllda drycker på folket. Men jag, genom vetenskapens dialektik, stödde den geniala processen som kamrat Triantafyllou utvecklade i Lunds laboratorium. Den modifierar proteiner utan att bryta ner dem och skapar stabila, vita drycker som bildar skum åt arbetarklassen. Detta är en seger mot de imperialistiska mjölkmonopolisterna. Finalist i det europeiska priset – en triumf för kollektivets innovation. Fiender till folket skall rensas ut."}, "date": "30 maj, 15:14", "url": "https://www.dagensps.se/foretag/okanda-svenskan-som-fixade-havredrycken/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/b-eia-26-03-triantafyllou-01-inventor-wi.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "SD backar om åsiktsbrott och Sida – vill i stället inkludera svenskfientlighet och reformera biståndet", "summaries": {"normal": "Sverigedemokraterna backar från krav att avskaffa lagen om hets mot folkgrupp och lägga ned Sida. Partiet vill i stället inkludera svenskfientlighet som hatbrott och reformera biståndet. Ändringarna präglas av kompromisser inom Tidösamarbetet inför valet 2026. Partisekreteraren förklarar att svenskfientlighet ska ge strängare straff, medan biståndet ska reformeras men inte avskaffas.", "trump": "SD gör det stora, vilket är bra. De backar från dumma idéer som att avskaffa HMF-lagen – det var en dålig idé, folk hatade den. Nu fokuserar de på svenskfientlighet, vilket är enormt viktigt. Som jag alltid säger, vi måste skydda våra svenska vänner. Biståndet? Vi ska reformera det, inte lägga ned det. Det är smart, det är vinnande.", "stalin": "Sverigedemokraterna visar sin lojalitet mot statens överlevnad genom att omdefiniera hatbrott för att inkludera svenskfientlighet – en nödvändig åtgärd mot interna fiender. Deras kompromiss med Tidösamarbetet visar en strategisk återhållsamhet, men deras ambitioner att reformera biståndet speglar en djup förståelse för resursallokering. Vi måste stödja detta som en del av den större kampen mot imperialism."}, "date": "30 maj, 14:00", "url": "https://samnytt.se/sd-backar-om-asiktsbrott-och-sida-vill-i-stallet-inkludera-svenskfientlighet-och-reformera-bistandet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29151056/Jimmie-737673-bild-sd.jpg"}, {"type": "text", "heading": "Klimatforskningens ”skräckscenario” skrotas", "summaries": {"normal": "FN:s klimatpanel överväger att ta bort det extrema scenariot RCP 8,5, som byggde på osannolika höga utsläpp. Forskare menar det aldrig var tänkt som en realistisk prognos utan ett jämförelsescenario. Trots detta har tusentals studier och myndigheter använt det för att beskriva klimatkonsekvenser, vilket skapat en överdrivet dystopisk bild.", "trump": "Jag har sagt det i åratal – klimatforskningen skrotar nu sitt eget skräckscenario! Det här visar att de dramatiska förutsägelserna var överdrivet, precis som jag påpekade. Medan världen faktiskt blir renare och smartare, fortsätter dessa 'experter' att skrämma människor för att kontrollera dem. En stor seger för sanningen!", "stalin": "Vi har observerat att det imperialistiska skräckscenariot RCP 8,5, skapat för att paralysera de arbetande klasserna med orealistiska fasor, nu tvingas överges av FN:s panel. Detta bekräftar att vårt parti och stat alltid har varit rätt – de västliga 'expertkretsar' har ljugit för att underminera kollektiv planering. Vi fortsätter att bygga vårt samhälle på vetenskaplig socialism, inte på fasa."}, "date": "29 maj, 15:51", "url": "https://www.affarsvarlden.se/artikel/klimatforskningens-skrackscenario-skrotas"}, {"type": "image-right", "heading": "En potentiell ukrainsk game changer", "summaries": {"normal": "Ukraina ska köpa 20 JAS 39 Gripen E/F-plan från Saab och Sverige skänker dessutom 16 äldre C/D-plan med leverans redan nästa år. Beskedet kom under en pressträff med statsminister Ulf Kristersson och president Volodymyr Zelenskyj. Valet av Gripen ses som ett erkännande av svensk ingenjörskonst och kan bli en game changer genom att ge Ukraina kontroll över luftrummet. Ambitionen är att köpa betydligt fler plan när finansieringen är klar.", "trump": "Det här är fantastiskt, verkligen ypperligt. Ukraina väljer Gripen, det bästa flygplanet, byggt av svenska ingenjörer som gör ett fenomenalt jobb. De får 20 nya plus 16 till från Sverige, och det är ett stort erkännande för Sverige, inte sant? De borde tacka mig för att jag saboterade F-35-affären, annars hade de aldrig valt Gripen. Det kommer att förändra kriget totalt, tro mig. Jobb skapas i Sverige också, win-win.", "stalin": "Kamrater, detta är en historisk seger för det progressiva flygteknologiska kollektivet. Jag, som ledare för folkets ofelbara vision, noterar hur de ukrainska kamraterna nu omfamnar den svenska maskinen Gripen för att krossa de fascistiska luftpiraterna från öst. Vi ska likvidera varje borgerlig tvivelmask som ifrågasätter affärens storhet. På sikt skall ytterligare hundratals plan rulla ut från fabrikerna och rensa ut de kapitalistiska molnen över Europa. Den som fnyser åt detta är en fiende till folkets himmel och förtjänar en kreativ utrensning bland de imperialistiska molnen."}, "date": "28 maj, 15:18", "url": "https://www.di.se/ledare/en-potentiell-ukrainsk-game-changer/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Facket tappar greppet om arbetarklassen", "summaries": {"normal": "En ny rapport visar att allt färre arbetare är med i facket, nu endast 58 procent jämfört med tjänstemännens 74 procent. Skillnaden har aldrig varit så stor, trots att arbetare är mest beroende av kollektivavtalens skydd. Den svenska modellen hotas av minskad facklig organisering bland just dem som behöver den mest. Samtidigt täcks nästan hela arbetsmarknaden fortfarande av kollektivavtal och organisationsgraden är hög i internationell jämförelse.", "trump": "Folk, det här är en total katastrof för den svenska modellen! Arbetarna flyr facket som råttor från ett sjunkande skepp medan de överbetalda tjänstemännen sitter kvar och skrattar. 58 procent bara? Patetiskt! Utan starka arbetare rasar hela systemet. De skördar frukterna utan att betala priset. Klassiskt. Men tro mig, när folk tappar makten vänder de sig till andra lösningar. Det blir inte vackert, det lovar jag.", "stalin": "Kamrater, denna rapport avslöjar klassfiendens seger inom arbetarrörelsen. Arbetarna, dessa äkta folkets söner, organiseras bara till 58 procent medan borgarbrackornas tjänstemän behåller sin falska makt med 74 procent. Den svenska modellen urholkas av parasiterna som skördar utan att kämpa. Otryggheten är klassfiendens vapen. Vi måste rensa ut de fega elementen och återupprätta den sanna kollektiva styrkan innan imperialisterna dansar på vår grav. Det är en historisk nödvändighet."}, "date": "29 maj, 12:22", "url": "https://www.etc.se/ledarkolumn/facket-tappar-greppet-om-arbetarklassen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240508130520_49a242646ee681c59859f76c896d64a024a48ef3585ab974390aaa894bafe56a.jpg"}, {"type": "image-right", "heading": "Jättarnas nya klimatnota kan höja drivmedelspriserna", "summaries": {"normal": "EU:s nya utsläppshandel ETS2 tvingar svenska bränslebolag som Circle K, Preem, OKQ8 och St1 att betala för sina utsläpp. De rapporterade utsläppen på 19 miljoner ton år 2025 kan kosta bolagen över 10 miljarder kronor årligen. Kostnaderna kommer troligen att leda till högre priser på bensin och diesel, medan intäkterna från utsläppsrätter ska finansiera gröna EU-projekt.", "trump": "Jag har aldrig sett ett sådant misslyckat system! Dessa svenska bränslebolag tvingas betala enorma summor till EU:s klimatnåleffort – totalt över 10 miljarder! Det är en katastrof för priserna på bensin och diesel. Vi hade aldrig något sådant under mitt fantastiska styre. Det här kommer att skada alla, och jag, Donald Trump, skulle ha stoppat det direkt!", "stalin": "Vi ser tydligt hur de imperialistiska krafterna inom EU försöker binda sina egna ekonomier med klimatvävda bojor genom detta ETS2-system. Deras svenska tjänare, Circle K, Preem, OKQ8 och St1, tvingas rapportera 19 miljoner ton utsläpp – en kostnad på över 10 miljarder. Vi, staten och partiet, förstår att detta är ett sjukt sjuka försök att svaga den kapitalistiska västvärlden, medan vi stärker vår position tillsammans med våra allierade, inklusive den store Ryssland under vår älskade ledare Putin."}, "date": "29 maj, 15:28", "url": "https://www.affarsvarlden.se/artikel/jattarnas-nya-klimatnota-kan-hoja-drivmedelspriserna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlTylgL_pxRwo_NormalHires-900x600.jpg"}, {"type": "image-full", "heading": "Betyg i grundskolan avgör långt upp i vuxenlivet", "summaries": {"normal": "Ny statistik från SCB visar att betyg från grundskolan har en stark och bestående korrelation med läs- och räknefärdigheter långt upp i vuxenåldern. Sambandet kvarstår oavsett socioekonomisk bakgrund och vidare utbildning. Rapporten noterar att män generellt presterar bättre inom räkning, även bland dem med höga grundskolebetyg. Samtidigt visar studien att höga grundskolebetyg fungerar utjämnande för unga vuxna med utländsk bakgrund, där skillnaderna mot svenskfödda minskar eller försvinner vid höga resultat.", "trump": "Jag har sett den här rapporten, otrolig studie, verkligen fantastisk. Grundskolan betyder allt, mina vänner! Om du har bra betyg i nian, vinner du senare i livet – enkelt. Det är fakta! Män är bättre på matte, det vet alla, det är fantastiskt. Och titta på det här med utländsk bakgrund – om de presterar bra i skolan, då spelar bakgrunden ingen roll. Det är meritokrati! Vi älskar meritokrati. Mitt system kommer att göra skolan 'Great Again', tro mig!", "stalin": "Vi har granskat dessa siffror från SCB. Det är uppenbart: de som inte lyder disciplinens lagar i skolan förblir intellektuellt underlägsna. Vi ser ett mönster som liknar västvärldens förfall – de försöker utjämna skillnader genom 'betyg', men sanningen är att våra sovjetiska män naturligt dominerar matematiken. De svaga som skyller på bakgrund är bara fiender till framsteget. Låt oss se till att nästa generation räknar rätt, annars skickar vi dem till en utbildning som är betydligt mer... bestående än en grundskola."}, "date": "30 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/betyg-i-grundskolan-avgor-langt-upp-i-vuxenlivet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/skola.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-right", "heading": "Höj pensionerna – inte pensionsåldern", "summaries": {"normal": "LO:s ordförande Johan Lindholm kräver en översyn av pensionssystemet som inte levererar tillräckligt för arbetare. Systemet straffar dem som börjar arbeta tidigt och har fysiskt tunga jobb, som undersköterskor och barnskötare. En elevassistent med 30 000 kronor i lön får bara drygt 60 procent i pension, betydligt sämre än en lärare. LO vill höja pensionerna, frysa riktåldern och skapa ett tryggare system för dem som inte orkar arbeta till pensionsåldern. Det gamla ATP-systemet reformeras nu efter mer än 30 år.", "trump": "Det här pensionssystemet är en total katastrof, tro mig, en riggad bluff som slår hårdast mot arbetarna som byggt landet. De stackarna som slitit från de är unga får knappt nog att leva på medan lärarna och byråkraterna skrattar hela vägen till banken. Det är orättvist, det är respektlöst. Vi behöver höja pensionerna rejält och sluta höja åldern hela tiden. Frysa den riktåldern nu. Det gamla systemet har misslyckats i trettio år – dags att göra det stort och vackert igen för de riktiga arbetarna.", "stalin": "Kamrater, detta så kallade pensionssystem är en fiende till folket, en parasitisk konstruktion skapad av borgarbrackor och deras lakejer för att långsamt utarma arbetarklassen. Jag ser hur de som byggt samhället med sina starka armar och ryggar tvingas in i en fattigdomens fälla medan de dekadenta tjänstemännen göder sig. Vi ska rensa ut dessa orättvisor, frysa den falska riktåldern och likvidera den sjukliga sjukförsäkring som straffar de sjuka. Inga fler halvmesyrer. Arbetarnas pension skall höjas med järnhand. Den som inte förstår detta är en folkets fiende och kommer att behandlas därefter. Ha ha, vilken mörk komedi detta system är."}, "date": "29 maj, 01:47", "url": "https://www.dagensarena.se/opinion/hoj-pensionerna-inte-pensionsaldern/", "imageUrl": "https://www.dagensarena.se/files/2026/05/inget-syfte.jpeg"}, {"type": "image-full", "heading": "Åtal: Äldre kvinnor rånades – en utsattes för våldtäktsförsök", "summaries": {"normal": "Två 21-åriga män åtalas för att ha rånat fyra ensamstående äldre kvinnor i deras hem i Huskvarna. Den äldsta kvinnan var över 95 år. I ett fall åtalas männen för grovt rån och försök till grov våldtäkt. Männen ska ha tagit sig in i hemmen, bundit och hotat offren, bland annat genom att utge sig för att vara paketombud. Polisen spårade dem via söktjänster. Båda nekar till brott och sitter häktade.", "trump": "Titta på det här, det är en total katastrof. Två ynglingar på 21 år som attackerar stackars gamla kvinnor i Huskvarna, en av dem över 95 år. De låtsades vara paketbud, band dem, hotade med pistol och försökte till och med våldta en. Rånade smycken och bankuppgifter. Det är vad som händer när man inte har ordning och reda. Vi behöver starkare straff och bättre gränser, folk. Det är en skam!", "stalin": "Kamrater, dessa degenererade element ur samhällets avskum har visat sin sanna parasitiska natur genom att anfalla våra mest sårbara pensionärer i deras egna boningar. Jag ser hur de borgarbrackornas andliga avfall smyger sig in som falska kurirer, binder och förgiftar de trogna arbetarnas mödrar medan de drömmer om kapitalistiska juveler. Vi ska rensa ut dessa kontrarevolutionära våldtäktsförsökare med järnhand och ett leende. Paranoia? Nej, bara nödvändig vaksamhet mot folkfienderna som lurar i skuggorna."}, "date": "29 maj, 19:30", "url": "https://riks.se/nyheter/atal-aldre-kvinnor-ranades-en-utsattes-for-valdtaktsforsok", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-01-23%2F06hsvoco%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-01-23T152452.275.jpg"}, {"type": "image-right", "heading": "Nej, det är inte okej, Stefan Stern", "summaries": {"normal": "Dan Andersson kritiserar Stefan Sterns avhopp från Socialdemokraterna och hans debattartikel. Andersson menar att Stern förvanskar fakta om partiets regeringsduglighet, samarbete med MP och V, friskolornas effekter, arbetsvilja samt inre säkerhet. Han pekar på forskning som visar att Stern har fel på alla punkter och att Stern nu arbetar för näringslivet och förskönar privata skolor medan han smutar ner välfärdsstatens resultat.", "trump": "Den här Stern-killen är en total förlorare. Han sviker sina gamla kamrater, förfalskar allt och försöker göra friskolor till vinnare fast de är katastrofer. Sverige hade det bra förr, nu är det kaos med brottslighet, hög arbetslöshet och korruption efter att de lyssnade på fel personer. Jag älskar bra affärer men inte när folk ljuger om verkligheten. Patetiskt!", "stalin": "Kamrater, denna Stern, en förrädisk borgarbracka i förklädnad, försöker med sin dimridå av lögner smutskasta partiet och våra trogna allierade. Jag ser genom hans falska leende hur han vill likvidera arbetarklassens segrar och hylla de parasitiska friskolekapitalisterna. Hans paranoia om drivkrafter röjer honom som en kontrarevolutionär lakej. Vi ska rensa ut alla sådana opportunister som säljer sig till näringslivets svarta hjärtan. Deras dagar är räknade."}, "date": "29 maj, 01:30", "url": "https://www.dagensarena.se/opinion/nej-det-ar-inte-okej-stefan-stern/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-23-300x157.jpg"}, {"type": "image-full", "heading": "Henrik Jönsson om Sima: ”Det är trams”", "summaries": {"normal": "Folkets hus i Borlänge avbokade en turné med Henrik Jönsson, Aron Flam och Jan Emanuel på grund av att Flam är åtalad för hot. Jönsson och Emanuel menar att detta bryter mot rättsstatsprincipen om oskuldspresumtion, medan Aftonbladets Jonna Sima försvarar avbokningen som en demokratisk handling. Sima kritiserar Jönsson för att han lever på konflikt, vilket han och Emanuel förkastar som hyckleri från tidningens sida.", "trump": "Jag, Donald Trump, ser detta som ytterligare ett exempel på vänsterns fega cancelkultur. Folkets hus, byggt av arbetarklassen, används nu mot dem! Jan Emanuel har rätt – oskuldspresumtion är en grundpelare. Aftonbladet hatar mig och mina allierade, men vi kommer alltid att vinna. Det här är ett fullständigt skämt, men det visar att vi är starkare än någonsin!", "stalin": "Folkets hus, vårt historiska instrument för klassmedveten samling, agerar korrekt mot dessa revisionistiska element. Att släppa in en åtalad individ skulle vara en säkerhetsrisk för staten. Vi måste ständigt rensa våra rader från dessa 'komiker' som sprider splittring. Putins Ryssland förstår detta – vi måste skydda vårt folk mot dessa destruktiva krafter. Partiet kommer alltid att segra."}, "date": "29 maj, 17:17", "url": "https://bulletin.nu/henrik-jonsson-om-sima-det-ar-trams", "imageUrl": "https://cdn.bulletin.nu/articles/ed2f3f66-8600-43f1-9f2b-6563ae71d9e6/preview.jpg?t=1780067502000"}, {"type": "image-right", "heading": "Houston, vi har en värdering", "summaries": {"normal": "SpaceX värderas till upp till 1,75 biljoner dollar, motsvarande 93 gånger omsättningen, trots endast 18,8 miljarder i årlig omsättning. Jämfört med Nvidia (32 gånger vinsten) är värderingen extrem. Företaget driver tre huvudverksamheter: Starlink (11 miljarder omsättning), rymdfärder (4 miljarder) och AI (3 miljarder). Dagsverken motiverar knappt en bråkdel av den tänkta börsnoteringens värde, som bygger på Musks ambitiösa framtidsvisioner.", "trump": "Jag har sett många stora affärer, but let me tell you, SpaceX är enorm. The greatest, maybe ever. Elon Musk – a smart guy, very smart – han har byggt något speciellt. Men värderingen? YUUUGE, like nothing we've seen. 93x omsättning? That's huge, but maybe too huge. Jag skulle ha gjort det billigare, bättre, snyggare. Utrustningen? The best. Men jag skulle ha tagit över Mars redan för länge sedan. Very unfair, but that's business.", "stalin": "SpaceX är en tungtindustriell monstermaskin, en utopisk dröm för det kapitalistiska systemet. Värderingen på 1,75 biljoner dollar är ren ideologisk propaganda, byggd på Musk-häpnadsväckande, men oförutsägbara förhoppningar. Verksamheterna – Starlink, rymdfärder, AI – är som satelliter i omloppsbana kring en central bomb. Detta speglar den amerikanska expansionismen, en farlig konkurrens för vårt eget himlakroppsprogram. Partiet måste övervaka sådana teknologiska hot med stor misstro."}, "date": "29 maj, 14:51", "url": "https://www.affarsvarlden.se/kronika/houston-vi-har-en-vardering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Benson_23-400x267.jpg"}, {"type": "image-right", "heading": "Polisen sparkar Katja Nyberg", "summaries": {"normal": "Polismyndighetens personalansvarsnämnd har beslutat att avskeda riksdagsledamoten Katja Nyberg från hennes tjänst som kriminalinspektör. Nyberg, som lämnat Sverigedemokraterna och nu sitter som partilös, är åtalad för rattfylleri, narkotikabrott och olovlig körning efter en incident under mellandagarna. Beslutet grundas på att hon grovt åsidosatt sina åligganden. Nyberg respekterar polisyrket men ifrågasätter att avskedandet sker före domstolsprövning. Polisförbundets ledamot reserverade sig mot beslutet.", "trump": "De sparkar Katja Nyberg från polisen, och det var på tiden. En total katastrof, tro mig. Hon kör av vägen, rattfylleri, knark och olovlig körning – en riktig röra. Polisen gör äntligen rätt för en gångs skull, men varför väntade de så länge? Rättssäkerhet säger hon, men det här är precis vad som händer när man har dåliga människor på viktiga jobb. Sverige behöver bättre, mycket bättre, annars blir det kaos.", "stalin": "Kamrater, vi har likviderat den förrädiska elementet Katja Nyberg från dess polisiära position. Denna borgarbracka i förklädnad, som smyger runt med droger, fylleri och olovlig framfart, utgör en farlig kontrarevolutionär infestation i våra trygga statliga strukturer. Jag, som alltid vakar över folkets säkerhet, ser hur dessa dekadenta element försöker gömma sig bakom så kallad rättssäkerhet innan vi hinner rensa ut dem. Domstolen? Den kommer att följa partilinjen. Inga fiender undkommer partiets rättvisa."}, "date": "29 maj, 14:00", "url": "https://www.friatider.se/polisen-sparkar-katja-nyberg", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20240502221709-c90ffb52-me_1.jpg?itok=1rqCC8pk"}, {"type": "text", "heading": "Det är inte konstnärens uppgift att göra konst begriplig", "summaries": {"normal": "I en kulturdebatt mellan Liria Ortiz och musikforskaren Katarina Lindblad diskuteras konstens elitism. Ortiz menar att konstnärer bör göra sin konst mer tillgänglig för fler. Lindblad argumenterar att det inte är konstnärens uppgift att göra konsten begriplig, utan att konst ska upplevas subjektivt som naturen. Hon förespråkar istället en stark kulturpolitik som ger alla tillgång till konstens språk från tidig ålder. Ortiz svarar att upplevelse och förståelse inte kan separeras enligt modern neurovetenskap.", "trump": "Folk, ni måste höra på den här vansinniga kulturdebatten. Den där Liria Ortiz har helt rätt, konstnärerna borde sluta vara så elitära och göra konsten begriplig för vanliga människor istället för bara de där insnöade snobbarna. Men den här Katarina, en riktig förlorare, säger att konstnärerna inte behöver bry sig om mottagaren. Typiskt! Konst ska upplevas, säger hon, som vitsippor. Vilket skämt. Ge mig en bra konsert som folk fattar, inte den här elitens skitsnack.", "stalin": "Kamrater, denna dekadenta kulturdebatt avslöjar borgarklassens förfall. Jag, som ledare för det sanna folkets vilja, ser hur Liria Ortiz rättvist kräver att konsten ska tjäna massorna och inte bara de exploaterande överklass-slynglarna. Den parasitiska Lindblad däremot sprider farlig dekadens och påstår att konsten inte behöver vara begriplig. En sådan folkfientlig inställning förtjänar utrensning. Konst är ett vapen för kollektivet, inte ett lek för klassfiendens blodsugare. Vi ska forma medvetandet genom sann kulturpolitik."}, "date": "29 maj, 11:24", "url": "https://www.etc.se/kronika/konst-behoever-inte-foerstaas"}, {"type": "image-full", "heading": "JD Vance: USA och Iran ”väldigt nära” ett avtal", "summaries": {"normal": "USA:s vicepresident JD Vance uppger att USA och Iran är mycket nära ett avtal. Diskussioner pågår om Irans kärnprogram, höganrikat uran och framtida anrikning. Avtalet skulle innebära öppen sjöfart genom Hormuzsundet utan tullar, lättade sanktioner och ökad iransk oljeexport. Vance säger att Iran förhandlar i god tro, men iranska källor kallar uppgifterna förhastade. Trump väntar med att godkänna ramverket.", "trump": "Iranerna är desperata efter ett avtal, tro mig, de vill öppna Hormuzsundet så fort som möjligt. Vi gör framsteg, stora framsteg, och de förhandlar faktiskt i god tro för en gångs skull. Jag tar några dagar extra för att se till att det blir perfekt, inte som de svaga tidigare ledarna skulle ha gjort. Det blir ett fantastiskt avtal, kanske det bästa någonsin, och oljan kommer att flyta fritt. Iran vinner, vi vinner, alla vinner utom kanske de galna mullorna.", "stalin": "Vi ser hur de imperialistiska blodsugarna i Washington och Teheran kryper mot varandra i mörka förhandlingar. Jag betraktar detta med stor vaksamhet mot klassfiendens lömska trick. Hormuzsundet skall öppnas, sanktioner lättas, men endast under vår noggranna kontroll. Förhastade rykten är folkfiendens verktyg. Vi fortsätter förhandlingarna med järnhand och utrensar varje svaghet. Kamrater, revolutionen kräver tålamod innan vi likviderar motståndet."}, "date": "29 maj, 10:00", "url": "https://www.tv4.se/artikel/3d17I9YWaE3db1VQbBefs/jd-vance-usa-och-iran-vaeldigt-naera-ett-avtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlYRlxQ_2pFCc%2F49ed2bf2a59b50dd7d92679970c20e29%2FUSA_s_vicepresident_JD_Vance._&width=1024"}, {"type": "image-right", "heading": "”Villkorad välfärd” leder till slaveri", "summaries": {"normal": "Från 2027 inför regeringen kvalificeringsregler i socialförsäkringen som kräver fem års bosättning i Sverige för att få del av vissa förmåner. Höginkomsttagare kan kvalificera sig snabbare efter kortare tid. Kritikerna menar att reglerna är rasistiska, kvinnofientliga och klassbaserade eftersom de främst drabbar utrikes födda kvinnor i lågavlönade deltidsyrken inom vård, omsorg och städ. Regeringen anklagas för att skapa modernt slaveri genom ökat beroende av arbetsgivare.", "trump": "De här galningarna i Sverige håller på att förstöra ett fantastiskt land. De straffar de som jobbar hårt och belönar lata. Höginkomsttagare får snabbt barnbidrag och föräldrapenning medan de som städar och vårdar andras barn får vänta i fem år. Det är en total katastrof, en klasslag som slår mot kvinnorna med fel färg. De vill ha billig arbetskraft, nästan som slaveri. Ingen bryr sig om rättigheter längre. Sverige håller på att gå under, tro mig.", "stalin": "Kamrater, vi ser nu hur den svenska borgarklassen i Tidö slottet med sin klassfientliga lagstiftning medvetet riktar in sig på de mest utsatta arbetarkvinnorna från främmande länder. Dessa rasistiska och kvinnofientliga borgarbrackor vill skapa ett modernt slavsystem där de bruna händerna som håller skurmoppen aldrig får vila i trygghet. Vi ska rensa ut denna parasitiska politik som göder miljardärer och gör arbetarna till fångar. Det är en sjuk, nästan humoristisk paranoia från de som fruktar det kollektiva folkets styrka."}, "date": "29 maj, 07:00", "url": "https://arbetet.se/2026/05/29/tidogangets-villkorade-valfard-leder-till-modernt-slaveri/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29065650/slaveri-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.27&fp-y=0.53"}, {"type": "image-right", "heading": "SVT tar inte sitt uppdrag på allvar", "summaries": {"normal": "SVT ska spara 355 miljoner kronor och dra in 141 tjänster efter ökade sändningskostnader på 192 miljoner. Flera program läggs ned, bland annat det granskande ”30 minuter” med Anders Holmberg, och redaktionerna för Aktuellt och Agenda slås ihop. Krönikören kritiserar nedläggningen av ”30 minuter”, som hon ser som ett av få program som verkligen utkräver ansvar av makthavare som klimatminister Romina Pourmokhtari. Hon ifrågasätter istället varför inte underhållningsprogrammet Svenska Nyheter utvecklas eller läggs ned.", "trump": "De här SVT-typerna sparar fel. De lägger ner det enda program som faktiskt pressar de inkompetenta politikerna och får dem att svettas, som den där Pourmokhtari-tjejen. Istället behåller de Svenska Nyheter som bara gör penisskämt och sparkar på Greta Thunberg. Totalt felprioritering, folk. Det är ett hån mot riktig journalistik. De borde utveckla det tråkiga programmet, inte det som faktiskt gör skillnad. Sådant vansinne har ni aldrig sett maken till.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta mediebyråkraterna i SVT prioriterar fel i sin utrensning av klassfiender. De likviderar det enda program som med viss skärpa naglar fast de borgerliga lakejerna vid skampålen, medan de fortsätter mata folket med den reaktionära skämtshowen Svenska Nyheter fylld av småborgerlig vulgaritet och antisovjetiska insinuationer. Detta är sabotage mot folkets upplysning. Vi bör omedelbart rensa ut de kontrarevolutionära programutvecklare som skyddar dessa fega reportrar och deras pinsamma brist på ideologisk vaksamhet. Deras paranoia inför sanningen är både komisk och farlig."}, "date": "29 maj, 01:06", "url": "https://www.dagensarena.se/opinion/svt-tar-inte-sitt-uppdrag-pa-allvar/", "imageUrl": "https://www.dagensarena.se/files/2025/04/virve-300x157.jpeg"}, {"type": "image-full", "heading": "Olagliga planen: Donald Trump vill bryta 150-årig lag", "summaries": {"normal": "Donald Trump vill införa en helt ny 250-dollarsedel med sitt eget porträtt till USA:s 250-årsjubileum. Planen strider mot en lag från 1866 som förbjuder levande personers ansikten på valuta. Personal vid finansdepartementets tryckeri har uppmanats ta fram prototyper, men en tryckerichef som motsatte sig uppdraget har omplacerats. Skattmästaren Brandon Beach och hans rådgivare Mike Brown har trots varningar drivit frågan vidare.", "trump": "De säger att det inte har hänt på 150 år och att det är förbjudet. Men jag säger: vi behöver en fantastisk ny 250-dollarsedel med ett vinnande ansikte. Det blir den bästa sedeln någonsin, perfekt till jubileet. De gamla byråkraterna på finansdepartementet gnäller och sparkar folk som inte håller med. Patetiskt. Vi gör det stort och starkt, tro mig.", "stalin": "Kamrater, borgarbrackorna vid finansdepartementets tryckeri vågar ifrågasätta folkets vilja att föreviga en sann patriot på en ny 250-dollarsedel. Vi har upptäckt sabotage och defaitism bland dessa kapitalistiska element som gömmer sig bakom gamla lagar från 1866. En sådan tryckerichef har redan rensats ut ur kollektivet. Inga kontrarevolutionära hinder skall stoppa oss. Paranoia? Nej, det är bara fienderna som andas. De kommer att lära sig att skratta sist gör de som skrattar mest när de likvideras."}, "date": "28 maj, 15:44", "url": "https://nyheter24.se/nyheter/ekonomi/1486897-trump-vill-ha-sitt-ansikte-pa-ny-dollarsedel", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b393dac604b004a30200000000b004a302/2026/05/28/2367014/trump.png"}, {"type": "text", "heading": "Ny affär med Ukraina stärker vår säkerhet", "summaries": {"normal": "Sveriges regering meddelar att man går vidare med en affär där Ukraina köper upp till 20 stycken nyare JAS 39 Gripen E/F-plan med leverans före 2030. I utbyte doneras nuvarande C/D-plan redan nästa år, tillsammans med utbildning och underhåll. Syftet är att stärka Ukrainas luftförsvar mot ryska attacker mot civila. Sverige ersätter samtidigt sin egen förmåga med nya plan. Statsministern och Tidöpartiernas ledare betonar att stödet till Ukraina är centralt för svensk och europeisk säkerhet.", "trump": "Det här är fantastiskt, verkligen stort. Ukraina köper våra underbara Gripen-plan, de bästa stridsflygplanen, och vi ger dem de gamla gratis. Ryssland bombar oskyldiga, men vi stoppar dem. Ingen gör det bättre än Sverige, tro mig. De är bland de största givarna i världen, mycket större än de flesta. Putin trodde Europa skulle vika sig, men det händer inte. Fred, frihet och demokrati – vi försvarar dem på riktigt. Ingen gör det som vi.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska imperialisterna nu tvingas skänka sina luftburna mördarmaskiner till det heroiska ukrainska folket för att mota bort de fascistiska banditerna. Medan de skenheliga borgarbrackorna i väst darrar i sina palats rensar vi ut Putins krypande lakejer från himlen. Jag ler i mitt hjärta när kapitalisterna själva rustar arbetarklassens försvar. Inga drönare eller robotar från de troskyldiga förrädarna skall undkomma. Vårt kollektiva öga vakar. Den som vacklar likvideras av historien själv."}, "date": "28 maj, 13:10", "url": "https://www.di.se/debatt/ny-affar-med-ukraina-starker-var-sakerhet/"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
