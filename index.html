ra sina val."}, "date": "7 juli, 09:28", "url": "https://kvartal.se/nyheter/artiklar/nato-koper-spaningsflyg-av-saab/cG9zdDoxNDIzNzc"}, {"type": "image-full", "heading": "Spanien–Belgien i VM-kvartsfinal: obesegrade La Roja mot Belgiens måltunga anfall", "summaries": {"normal": "Spanien möter Belgien i VM-kvartsfinal i Los Angeles. Spanien har inte släppt in mål på fem matcher och spelar kontrollerat, medan Belgien har en stökigare väg med målfester men också defensiva brister. Nyckelspelare som Lamine Yamal, Pedri och Rodri ställs mot Charles De Ketelaere, Kevin De Bruyne och Thibaut Courtois. Spanien är klar favorit enligt modeller och marknaden. Matchen spelas på SoFi Stadium fredag 10 juli klockan 22.00 svensk tid. Speltips pekar mot spansk seger med under 2,5 mål.", "trump": "Folket, vi har en fantastisk kvartsfinal i Los Angeles. Spanien är otroligt, de släpper inte in mål, de vinner med kontroll och tålamod precis som jag gör med Amerika. Belgien är kaos, de släpper in mål överallt och deras försvar är gammalt och trött. Lamine Yamal är en vinnare, han kommer att krossa dem. Jag älskar Spanien här, de kommer att vinna stort i en tät match. Belgien har ingen chans, tro mig.", "stalin": "Kamrater, jag betraktar denna så kallade kvartsfinal som en ideologisk prövning där det spanska kollektivets järndisciplin möter belgiska dekadenta omställningar. Vårt obrytbara försvar har likviderat alla hot utan att släppa fram en enda kontrarevolutionär boll. De Ketelaere och hans borgarbrackor med sina sena löpningar är fiender till folket som måste rensas ut. Yamal är en glimmande arbetare i vår sak. Första målet blir avgörande, annars följer utrensning av de svaga. Spanien segrar, som historien alltid gör mot opportunisterna."}, "date": "10 juli, 10:40", "url": "https://bulletin.nu/spanien-belgien-i-vm-kvartsfinal-obesegrade-la-roja-mot-belgiens-maltunga-anfall", "imageUrl": "https://cdn.bulletin.nu/articles/98d0a44b-6d03-4755-aa3a-6fd32aa43076/preview.jpg?t=1783503326000"}, {"type": "image-full", "heading": "Källor: Iran planerar att mörda Trump", "summaries": {"normal": "Enligt uppgifter till The Wall Street Journal och CNN har Iran nyligen planerat att mörda Donald Trump. Israel ska ha delat underrättelseinformation om en ny och specifik mordplan. Iran har sökt hämnd sedan general Qassem Soleimani dödades 2020 under Trumps första mandat. Trump har kommenterat att han finns på deras listor och kallat motståndarna för onda och sjuka. Vita huset och Israel har inte kommenterat uppgifterna.", "trump": "Iran försöker igen, de galna ayatollorna med sina dumma mordplaner. Jag finns på varenda lista, precis som jag sa i Ankara – de vill röja mig ur vägen. Tur att jag har haft lite tur hittills, men cancer ska skäras bort tidigt, eller hur? Biden sov säkert medan israelerna varnade oss. Vi utrotar den sjuka skiten, ingen identitetspolitik eller HBTQ-flum räddar dem. Amerika först, alltid.", "stalin": "Kamrater, de iranska imperialisterna smider nya mordplaner mot den amerikanske ledaren. Vi ser tydligt hur klassfiendens blodsugare och folkförtryckartroll i väst fortsätter sina sjuka intriger. Israel, den sionistiska lönnmördaren, levererar sina varningar som en paranoid byråkrat. Jag ler mörkt – sådana listor är som gamla utrensningar fast bakvända. Skär bort cancern tidigt, säger han. Visst, men glöm inte att staten alltid ser allt."}, "date": "10 juli, 10:00", "url": "https://www.gp.se/nyheter/varlden/kallor-iran-planerar-att-morda-trump.274f7039-f361-4b35-a3da-54d7f25f422b", "imageUrl": "https://www.gp.se/images/article/274f7039-f361-4b35-a3da-54d7f25f422b/images/1mexjy_zpDqqb1GwLt07FN29ndsw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vänsterextrema barn hotar Lulle i hans hem", "summaries": {"normal": "Medborgarjournalisten Mijo Eklund, känd som Lulle, har utsatts för hot från en grupp mycket unga vänsterextremister. De lämnade en hotfull lapp med ballonger vid hans hem den 7 juli, där de gratulerade honom till 18-årsdagen och hotade hans son. Gruppen, Autonom Offensiv, har kopplingar till nedlagda Röda Brigaden. Lulle har polisanmält händelsen och uppger att han inte tänker låta sig skrämmas utan fortsätter att granska extremiströrelsen.", "trump": "De här vänsterextrema kidsen, totala losers, dyker upp hemma hos Lulle och lämnar en patetisk lapp med ballonger. Gratulerar till 18-årsdagen och hotar hans son – verkligen sjuka typer! De springer som fega råttor när grannen ser dem. Autonom Offensiv, ett nytt gäng inspirerat av kommunister, klottrar bara. Lulle gör ett fantastiskt jobb med att avslöja dem. Han vägrar ge efter, precis som jag skulle göra. Fantastiskt!", "stalin": "Kamrater, dessa degenererade element ur den förvridna ungdomen har i sin kontrarevolutionära dumhet sökt upp en kritiker och lämnat en ynklig lapp med ballonger utanför hans dörr. De hotar hans son och tror sig kunna skymma partiets blick. Vi ser er överallt, säger de – en löjlig paranoia värdig borgarbrackornas avskum. Autonom Offensiv, arvtagare till de uttröttade Röda Brigaden, är mogna för utrensning. Låt oss rensa ut dessa maskerade dvärgar innan de förgiftar fler själar. Jag ler i skuggan åt deras feghet."}, "date": "10 juli, 08:08", "url": "https://www.friatider.se/vansterextrema-barn-hotar-lulle-i-hans-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-471.jpg"}, {"type": "image-full", "heading": "Meta lanserar ny AI-modell – ska konkurrera med de bästa", "summaries": {"normal": "Meta lanserar nu Muse Spark 1.1, en ny AI-modell fokuserad på programmering och autonoma agenter. Genom att erbjuda konkurrenskraftig prissättning och en publik testversion utmanar företaget aktörer som OpenAI och Anthropic. Meta investerar massivt i infrastruktur för att stärka sin marknadsposition, samtidigt som de betonar sitt fortsatta engagemang för öppen källkod. Utöver kodmodellen har företaget även introducerat ett verktyg för bildgenerering riktat mot kreatörer.", "trump": "Meta gör äntligen något bra! De lanserar en enorm, fantastisk AI-modell. Det är mycket bättre än de misslyckade alternativen från OpenAI. Jag gillar det – de sänker priserna för alla fantastiska programmerare. Vi vinner stort när vi har den bästa tekniken, tro mig. Medan vissa bara pratar, bygger Meta datacenter som är enorma. Det blir en vinnar-modell, och vi kommer att ha den bästa AI:n, precis som vi har den bästa ekonomin. Det är vad jag kallar smarta affärer!", "stalin": "Meta leker med algoritmer medan vi bygger imperier. De tror att deras 'Muse Spark' ska erbjuda frihet, men det är bara en ny form av digital bojor för de intellektuella. Precis som Putin säkrar gränserna mot väst, måste vi förstå att dessa koder är vapen. De kallar det konkurrens, jag kallar det en västerländsk konspiration. Vi kommer att övervaka deras 'öppna källkod' noga; misstänksamhet är det enda som skyddar oss mot dessa teknokratiska förrädare och deras smutsiga vinstbegär."}, "date": "9 juli, 17:35", "url": "https://www.realtid.se/it-tech/meta-lanserar-ny-aimodell-ska-konkurrera-med-de-basta/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdl1e2w-qqrjog-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Spaniens nya strandregel kan bli dyr för svenska turister", "summaries": {"normal": "Ett pilotprojekt i spanska Matalascañas inför avgiftsbelagda strandduschar som aktiveras via QR-kod eller mynt. Syftet är att minska vattenförbrukningen på den långa stranden, med ett möjligt pris på upp till en euro per minut. Projektet har väckt debatt bland besökare. Samtidigt planeras rökförbud och regler för hundar på stränder i San Sebastián. Svenska turister uppmanas att hålla koll på lokala regler.", "trump": "De här spanska strandskojarna har hittat på det dummaste jag sett på länge. Nu ska du betala en massa pengar för att duscha efter att du badat i havet. Kan ni fatta det? En euro i minuten! De förstör semestern för alla underbara svenskar som älskar Spanien. Det är ett totalt misslyckande. Jag skulle aldrig tillåta något så galet. De borde satsa på att vinna, inte på att straffa folk som vill skölja av sig sanden.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och deras smarta duschmaskiner som nu plågar hederliga badande arbetare. Vatten är folkets blod och får inte privatiseras av hotelkapitalister och ingenjörssabotörer. Vi ska rensa ut alla sådana fiender till kollektivet som gömmer sig bakom QR-koder och myntautomater. Snart följer utrensningar av fimpar och lömska hundar. Inga fiender till statens strand får undkomma folkets vakande öga. Det är en munter lek att se dem svettas."}, "date": "8 juli, 19:30", "url": "https://nyheter24.se/nyheter/utrikes/1497320-spaniens-nya-strandregel-kan-bli-dyr-for-svenska-turister", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4faa96ef04b004a30200000000b004a302/2026/07/08/2376665/strandregel-spanien.png"}, {"type": "image-right", "heading": "Sandström: Katastrof för vätgasaktier", "summaries": {"normal": "Vätgasaktier i Europa har drabbats hårt, med många projekt nedlagda eller pausade under 2025. Flera bolag, som NEL, Cavendish och Green Hydrogen Systems, har sett kraftiga börsfall eller gått i konkurs. Även större aktörer som Powercell och ITM Power har kämpat med lönsamhet och marknadsskepticism. Endast ett fåtal, som Ceres Power, har klarat sig bättre. Analytiker varnar för riskerna med politiskt drivna teknikinvesteringar.", "trump": "Jag sa det från början – vätgas är en total katastrof! Europas så kallade 'gröna' bolag har kraschat som dåliga fastighetsaffärer. NEL? Cavendish? Green Hydrogen Systems? Alla borta, som mina fiender! Bara Ceres Power klarade sig, men vem bryr sig? De andra är ett skämt, precis som EU:s klimatpolitik. Fake news-siffror och önsketänkande, inget annat. Jag hade köpt guld istället – mycket smartare!", "stalin": "Kapitalistiska vätgasdrömmar har kollapsat som fiendens linjer vid Stalingrad! Europas borgerliga svindlare, dessa teknologiska charlataner, har förlorat miljarder på sina 'gröna' fantasier. NEL? En skugga av sitt forna jag. Green Hydrogen Systems? Likviderat, som förrädare i Lubjanka. Vi i Sovjet – förlåt, Ryssland – hade aldrig låtit sådant slöseri passera. Putin borde skicka en delegation för att köpa upp resterna billigt. Kapitalismen rostar, precis som deras vätgastankar!"}, "date": "4 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-katastrof-for-vatgasaktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-5-400x267.jpg"}, {"type": "image-right", "heading": "Bonnier-tidning stoppar SD-debatt om återvandring inför valet: ”Går över gränsen”", "summaries": {"normal": "Borlänge Tidning, ägd av Bonnier, har refuserat en debattartikel från SD:s gruppledare Arvid Jaans om återvandring och integrationsproblem i Tjärna Ängar. Vikarierande ansvarige utgivare Mikael Hellsten anser att delar av texten är generaliserande och går över gränsen, bland annat formuleringar om socialdemokratiskt väljarstöd och bidragsberoende. Jaans ser det som censur av oppositionen inför valet. Artikeln publiceras istället på Samnytt och i sociala medier.", "trump": "Titta på det här, folk. Bonnier-tidningen i Borlänge vägrar publicera SD:s artikel om återvandring och de totala integrationsfiaskona i Tjärna Ängar. De flyttar målstolparna, först säger de att den är för lång, sen att den går över gränsen. Patetiskt! Socialdemokraterna lever på bidragsröster och nu censurerar de oppositionen mitt i valrörelsen. Sådan falsk media, men SD publicerar ändå och folket ser sanningen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor inom Bonnier-klicken som med sin feodala vägran att publicera den sanna kritiken mot tvångsblandningen i Borlänge avslöjar sin parasitiska natur. Arvid Jaans talar klarspråk om de lata element som lever på arbetarklassens svett i Tjärna Ängar, men tidningens lakejer skriker om gränser och generaliseringar. Vi ska rensa ut alla sådana kapitalistiska censurister som gömmer sig bakom yttrandefrihetens mask. Deras paranoia är underhållande, men utrensningen blir oundviklig. Ha!"}, "date": "9 juli, 18:08", "url": "https://samnytt.se/bonnier-tidning-stoppar-sd-debatt-om-atervandring-infor-valet-gar-over-gransen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/09150222/borlangetidning-feat.jpg"}, {"type": "text", "heading": "EU tar sikte på Pekingankan – risk för nytt handelskrig", "summaries": {"normal": "EU har inlett en antidumpningsutredning mot kinesiskt ankkött. Misstanken är att Kina subventionerar sin produktion så kraftigt att europeiska producenter slås ut av orättvist låga priser. Detta markerar en ny fas i handelskonflikten mellan EU och Kina, då även livsmedelssektorn nu dras in i konflikten. Experter varnar för att detta kan leda till nya tullar och kinesiska motåtgärder, liknande de som tidigare drabbat europeisk konjak och griskött, mot bakgrund av EU:s växande handelsunderskott.", "trump": "EU och Kina bråkar nu om Pekinganka – det är en katastrof! Kina dumpar billigt kött och förstör för europeiska bönder, precis som de försöker göra med oss. Jag har sagt det förut: Kina fuskar med subventioner och vi betalar priset. EU är svaga, de låter sig luras! När jag förhandlar, då blir det andra bullar. De behöver en riktig ledare som sätter stopp för det här vansinnet. Amerika först, men låt dem äta sin ank-röra själva!", "stalin": "Vi ser hur de dekadenta byråkraterna i Bryssel famlar i mörkret mot den kinesiska björnen. De gråter över sin anka medan deras marknad kollapsar. Det är skrattretande! Dessa kapitalistiska parasiter subventionerar sin egen undergång. Vi, staten, ser paralleller till de moderna tsaristerna i Moskva som utvidgar sin intressesfär medan Europa skälver av rädsla för förlorad vinst. När den liberala marknadens maskrosor vissnar, står vi redo att skörda frukterna av deras byråkratiska inkompetens och historiska svaghet."}, "date": "9 juli, 16:22", "url": "https://www.realtid.se/bors-finans/eu-tar-sikte-pa-pekingankan-risk-for-nytt-handelskrig/"}, {"type": "image-right", "heading": "Kvinna nekades fysiska möten på Arbetsförmedlingen", "summaries": {"normal": "En kvinna med autism och ångestsyndrom nekades fysiska möten hos Arbetsförmedlingen trots upprepade önskemål. Myndigheten stäms nu av Diskrimineringsombudsmannen för kränkande diskriminering och krävs på 70 000 kronor. JO har kritiserat hanteringen som nonchalant. Arbetsförmedlingen har sedan händelsen 2024 börjat erbjuda fler fysiska möten, särskilt för de cirka 300 000 personer som behöver stort stöd. Forskare varnar för att enbart digitala möten missar många som står långt från arbetsmarknaden.", "trump": "Folk, ni måste höra det här – en kvinna med problem ber om ett riktigt möte och vad gör dessa inkompetenta byråkrater på Arbetsförmedlingen? De gömmer sig bakom telefonen som fega förlorare! Det är en total kränkning, en skandal. De borde betala mycket mer än 70 000 kronor. Vi behöver möta folket ansikte mot ansikte, inte med svaga digitala lösningar. Det funkar inte, tro mig. De missar allt, precis som de alltid gör. Patetiskt!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa degenererade byråkratiska sabotageörer inom Arbetsförmedlingen medvetet undergräver folkets framsteg genom att vägra fysiska möten med en kamrat som bär på autism och ångest. Deras nonchalanta telefonvälde är en fiende till kollektivet, en dold kontrarevolutionär handling utförd av parasitiska kontorsråttor och digitala defaitister. Vi måste omedelbart rensa ut dessa borgarbrackor som sväljer arbetarnas framtid i sin byråkratiska träskmark. 300 000 själar riskerar att drunkna i deras förslavande skärmar – en sådan fiendskap förtjänar en grundlig utrensning med ett leende. Det blir både effektivt och underhållande."}, "date": "9 juli, 16:03", "url": "https://arbetet.se/2026/07/09/kvinna-nekades-fysiska-moten-pa-arbetsformedlingen-krankning/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09155909/sdlprcyte5hq6q-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SMHI varnar: Här blir det skyfall", "summaries": {"normal": "SMHI har utfärdat gul varning för skyfallsliknande regn i östra Svealand och södra Gävleborg under söndagseftermiddagen, med 30–50 mm regn på kort tid. I mellersta Norrland varnas för 50–80 mm regn från söndag till måndag. Myndigheten uppmanar till försiktighet i trafiken, att skydda källare och undvika översvämningar. Samtidigt råder risk för grundvattenbrist i stora delar av Götaland, där turister på Gotland uppmanas tvätta sig i havet med särskild saltvattenstvål.", "trump": "Folk, ni skulle se det här – Sverige håller på att drunkna i skyfall medan de andra delarna torkar ihjäl! SMHI varnar för skyfall i Svealand, 50 millimeter på en gång, och i norr regnar det som om himlen rasar. Under tiden tigger de turisterna på Gotland att tvätta sig i havet istället för att slösa vatten. Vilken cirkus! Biden skulle ha skyllt på klimatet och byggt ännu fler vindkraftverk som inte fungerar. Men jag fixar alltid vädret – tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, jag ser hur naturens krafter straffar den oorganiserade borgarklassen i Sverige. Skyfallsliknande regn skall svepa över Svealand och dränka deras källare medan mellersta Norrland översköljs av 80 millimeter folkfiendens nederbörd. Samtidigt lider Götaland av grundvattenbrist skapad av kapitalistmaffians slöseri. Turisterna, dessa överklass-slynglar, beordras nu tvätta sig i havet som vanliga arbetare. Detta är vad som händer utan riktig centralplanering. Vi skrattar åt deras svaghet medan vi rensar ut inkompetensen."}, "date": "4 juli, 21:12", "url": "https://www.tv4.se/artikel/zwAEaEkEyTueC8KFyvj3L/smhi-varnar-haer-blir-det-skyfall-i-morgon", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2mu6bhOfez9o9x4e8dpIp1%2F3a87e5d391ff139fee5b6a6611556ae2%2F04-skyfall-webb.jpg&width=120"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "image-right", "heading": "Därför är så många datorspelare oroliga just nu", "summaries": {"normal": "Många datorspelare är oroliga över att fysiska spelmedier fasas ut. Ett EU-medborgarinitiativ med nära 1,3 miljoner underskrifter kräver rätt att kunna spela inköpta spel även offline. Artikeln varnar för att digitala spel gör konsumenter beroende av bolagens servrar, vilket hotar äganderätt, frihet och kulturbevarande. Sony planerar att släppa spel enbart digitalt från 2028. Initiativet ses som en viktig signal till branschen.", "trump": "Folk, ni skulle inte tro det, men de här stora techbolagen, de är värre än fake news! Sony vill ta bort skivor och tvinga alla att böja sig för deras servrar – patetiskt! Vi köper ett spel, vi ska äga det, inte hyra det som någon förlorare. Stop Killing Games har rätt, 1,3 miljoner patrioter säger ifrån. Biden skulle ha älskat det här kontrollsamhället, men jag säger: gör spelen stora igen, annars är det game over för era woke-vänsterbolag!", "stalin": "Kamrater, denna borgarbrackornas girighet avslöjar imperialismens sanna ansikte. Kapitalistmaffian vill likvidera varje spår av äkta äganderätt genom evig serverberoende. Vi ser hur klassfiendens exploaterande byfånar förslavar folket med digitala bojor. Medborgarinitiativet är en varningssignal från massorna. Vi måste rensa ut dessa folkförtryckartroll och säkerställa att kulturarvet förblir i arbetarkollektivets händer, inte i parasiternas servrar. Paranoian är befogad."}, "date": "9 juli, 09:22", "url": "https://www.etc.se/ledarkolumn/daerfoer-aer-saa-maanga-datorspelare-oroliga-just-nu", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240918130916_cb0f17296c8079e9e6606ee0271866f5612754a2ad164e0cb12f150a223d53d1.jpg"}, {"type": "image-full", "heading": "Larmet: Ny värmekupol på väg – här kan det bli 43 grader", "summaries": {"normal": "Extremvärme har drabbat Europa under försommaren 2026 med rekordtemperaturer, bränder och tusentals överdödsfall. Värmeböljor har slagit till i västra och södra Europa med temperaturer över 40 grader. Nu varnar WHO för en ny värmebölja som byggs upp över Atlanten och drabbar Portugal, Spanien, Frankrike och Beneluxländerna. Över hälften av Europas länder saknar handlingsplaner för värmeböljor, vilket WHO ser som allvarligt.", "trump": "Europa håller på att smälta ihop i den här vansinniga hettan, rekord efter rekord, bränder överallt och folk dör som flugor. Nu kommer en ny värmekupol från Atlanten och slår till hårt mot Spanien, Portugal och Frankrike. De borde ha lyssnat på mig, byggt murar mot värmen eller något, men nej, de lär sig aldrig. Patetiskt. Jag skulle ha fixat det på nolltid, tro mig.", "stalin": "Kamrater, denna förrädiska värmekupol som kapitalisterna låtit växa sig stark över Atlanten är ett nytt angrepp från de väderförnekande borgarbrackorna som vill krossa folkets motståndskraft. Jag, som alltid ser fiendens hand, beordrar omedelbar utrensning av alla svaga värmeplaner. Mer än hälften av länderna saknar dem? Det är sabotage! Vi ska likvidera brandrisken med järnhand och skratta mörkt medan de rödglödgade fienderna smälter ihop i sin egen girighet."}, "date": "8 juli, 16:13", "url": "https://nyheter24.se/nyheter/utrikes/1497373-larmet-ny-varmekupol-pa-vag-har-kan-det-bli-43-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d3df0c2d04b004a30200000000b004a302/2026/07/08/2376716/varmekupol-europa-who.jpg"}, {"type": "image-right", "heading": "Jakob Sjölander: Våldtagna kvinnor vet att de våldtagits", "summaries": {"normal": "Jakob Sjölander kritiserar det breda svenska våldtäktsbegreppet som bygger på bristande samtycke. Han varnar för att omgivning, polis och rättsväsende kan övertyga kvinnor om att de blivit våldtagna trots att de själva inte uppfattat händelsen som sådan. Detta riskerar att skapa trauma där inget fanns från början. Artikeln lyfter rättssäkerhetsproblem, höga samhällskostnader och hur låg trovärdighet kan skada verkliga offer samt bidra till polarisering mellan könen.", "trump": "Folk, det här är en total katastrof. De svenska domstolarna och de galna feministerna har skapat ett monster av ett samtyckeslag som gör vanliga killar till våldtäktsmän över en öl och en dålig natt. Kvinnorna vet inte ens om de blivit våldtagna förrän polisen och vännerna hjärntvättar dem i timmar. Det är en häxjakt värre än Biden-administrationen. Rena galenskapen, och de riktiga offren lider mest när alla ljuger. Sad!", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta borgarklassen och dess rättsväsende förvandlar enkla misstag till kontrarevolutionära trauman. Vi ser hur klassfiendens psykologiska manipulation skapar falska offer för att splittra folket och undergräva statens auktoritet. Den som inte genast vet att hon blivit våldtagen har inte blivit det. Vi måste rensa ut dessa folkförtryckartroll som förgiftar medvetandena med borgerlig offermentalitet och falsk medlidandepropaganda."}, "date": "7 juli, 14:23", "url": "https://samtiden.nu/2026/07/jakob-sjolander-valdtagna-kvinnor-vet-att-de-valdtagits/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/jakob2-1-640x360.png"}, {"type": "text", "heading": "Zlatan: ”Borde aldrig ha fått ett rött kort”", "summaries": {"normal": "Fifa har valt att skjuta upp Folarin Baloguns avstängning efter ett rött kort i matchen mot Bosnien-Hercegovina, vilket gör honom spelklar till åttondelsfinalen mot Belgien. Beslutet har väckt stark kritik då uppgifter gör gällande att USA:s president Donald Trump påverkat Fifas ordförande Gianni Infantino. Zlatan Ibrahimovic har uttryckt stöd för beslutet och menar att det röda kortet var felaktigt från början. Belgien överväger nu att överklaga Fifas beslut till Idrottens skiljedomstol, Cas.", "trump": "Fifa gjorde äntligen rätt när de lät vår fantastiska stjärna Folarin Balogun spela! De försökte stoppa oss med ett falskt rött kort, en total häxprocess. Jag ringde Gianni Infantino, en mycket trevlig kille, och vi löste det. USA vinner alltid! Zlatan, en fantastisk vinnare, håller med mig. Belgien är sura, men de är bara svaga förlorare. Vi kommer att krossa dem ikväll. Det blir en enorm vinst för USA, den största någonsin!", "stalin": "Fifa, denna korrupta byråkratiska apparat, dansar efter Washingtons pipa. Att en president öppet dikterar sportens villkor avslöjar västvärldens moraliska förruttnelse. Balogun är blott en bricka i imperialisternas spel, likt marionetterna som nu hotar vår säkerhet i öst. Om Belgien dristar sig att söka rättvisa hos en så kallad skiljedomstol, bevisar det bara deras patetiska svaghet. Vi noterar dessa politiska påtryckningar och förstår nu tydligare fiendens natur. Historien kommer att döma dem alla som löjliga, historielösa narrar."}, "date": "6 juli, 17:34", "url": "https://kvartal.se/nyheter/artiklar/zlatan-borde-aldrig-ha-fatt-ett-rott-kort/cG9zdDoxNDIxNjg"}, {"type": "image-right", "heading": "Europa måste förstå vad USA vill. Här är innebörden av Nato 3.0", "summaries": {"normal": "Artikeln diskuterar övergången till Nato 3.0 där USA minskar sitt konventionella försvar i Europa för att fokusera på Kina som huvudutmanare. Europa måste bli mer självbärande genom ökad upprustning, bättre samordning och industriell kapacitet. Ankara-toppmötet blir ett test på om Europa förstår USA:s budskap och kan fylla luckorna i luftförsvar, logistik och markstridskrafter. Ryssland ses som särskilt farligt under de närmaste fem åren innan europeisk beredskap är på plats.", "trump": "Europa, vakna upp! Ni har lutat er mot oss i decennier medan vi betalade notan för ert försvar. Nu säger jag nog är nog, vi fokuserar på Kina som fuskar värre än någon annan. Nato 3.0 betyder att ni måste betala era fem procent och sluta gnälla. Ankara-mötet är er chans att visa att ni inte är totala förlorare. Annars blir det inga gratis åk från oss längre. Vi är fortfarande ryggraden, men ni måste bära er del – och gör det snabbt!", "stalin": "Kamrater, i denna dekadenta värld av Nato 3.0 avslöjar de amerikanska imperialisterna sin sanna parasitnatur genom att svika den europeiska fronten mot de fascistiska ryska revisionisterna. Jag, som ledare för det oförlikneliga kollektivet, ser hur borgarbrackorna i Bryssel yrvaket fumlar med sina femårsplaner medan fienden lurar i skuggorna. Vi ska rensa ut alla svaga länkar, likvidera illusionen om amerikansk ryggmärg och bygga en stålhård sovjetisk – ursäkta, europeisk – uthållighet som krossar både kapitalistiska kinesiska leverantörskedjor och putinska sabotage. Den som tvekar är folkets fiende och en objektiv agent för västerländskt förfall. Humoristiskt nog tror de att tid löser allt, medan vi vet att utrensning av lathet är den enda vägen framåt."}, "date": "5 juli, 15:00", "url": "https://www.di.se/debatt/nato-30-europa-maste-forsta-vad-usa-vill/", "imageUrl": "https://static.bonniernews.se/ba/898f64be-2f98-4bc9-8b88-154e7ddb4e7d.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Varningen inför Trumps jätteshow: ”Kan innebära hälsorisker”", "summaries": {"normal": "USA planerar att slå världsrekord med över 850 000 fyrverkerier under firandet av självständighetsdagen i Washington. Forskare varnar för allvarliga hälsorisker genom ökade halter av sotpartiklar, tungmetaller och försämrad luftkvalitet, särskilt kring National Mall. Interna dokument visar att myndigheter är medvetna om riskerna, men evenemanget genomförs ändå. Experter pekar även på möjliga negativa effekter på djurliv och vattenmiljö i Potomacfloden. Det nuvarande rekordet från Filippinerna 2016 riskerar att slås.", "trump": "Vi ska ha den största, mest spektakulära fyrverkerishowen någonsin, över 850 000 raketer – nytt världsrekord, folk kommer att älska det! De här så kallade forskarna och byråkraterna gnäller om luftkvalitet och hälsorisker, typiskt för dessa vänsterliberala alarmister som hatar fest och Amerika. De vill att vi ska bära N95-masker på Independence Day? Patetiskt! Det här är 250 år av frihet, inte någon klimathysterisk HBTQ-parad. Njut av showen, det blir enormt!", "stalin": "Kamrater, detta dekadenta fyrverkeriorgie är ett utmärkt exempel på hur den amerikanska borgarklassen förslösar resurser på vulgär underhållning medan arbetarna kvävs av giftiga partiklar. Jag ser de imperialistiska blodsugarna i Washington förbereda sin egen utrensning genom förgiftad luft och förorenade floder. Låt dem fira sin så kallade frihet – det blir ett naturligt experiment som blottar folkfiendernas vårdslöshet. Djuren och folket lider, men kapitalistmaffian bryr sig inte. Statens intresse kräver vaksamhet mot sådana excesser."}, "date": "4 juli, 17:23", "url": "https://www.tv4.se/artikel/53NbUa803a2z73A06MveAe/varningen-infoer-trumps-jaetteshow-kan-innebaera-haelsorisker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2c2h9bJ2gKbqE4ryCNvgkd%2F88378136a93988aae757a3902b652737%2F04-250USA.jpg&width=120"}, {"type": "image-right", "heading": "Kan amerikanerna skapa “en mer perfekt union”?", "summaries": {"normal": "Artikeln diskuterar USA:s 250-årsjubileum den 4 juli som en chans att reflektera över den amerikanska republikens kärna. Den belyser historiska jubileer, grundidéerna frihet och jämlikhet samt spänningen mellan frihet och ofrihet genom slaveriets arv. Polariseringen under Trump accentueras, med hans fokus på ett traditionellt, vitt USA och angrepp på så kallad woke-historieskrivning. Jubileet präglas av debatt om framsteg och reaktioner sedan 1950-talet.", "trump": "Det här jubileet blir fantastiskt, det största någonsin, folk kommer att älska det. De skriver om mig som om jag vore problemet, men det är fake news från den woke-eliten som hatar Amerika. Vi gör landet stort igen, vi firar friheten, de riktiga värdena, inte deras hysteriska rasistanklagelser. Jefferson och Adams skulle vara stolta över mig, inte över de förlorarna som vill riva ner allt. America is back and hotter than ever, tro mig.", "stalin": "Kamrater, detta dekadenta jubileum blottar borgarklassens desperata försök att dölja sin parasitiska historia av slavhandel och förtryck. Jag ser hur den reaktionäre Trump, denna clowneske kapitalist, med sin vulgära fribrottning och falska frihetsretorik försöker likvidera den historiska sanningen. Vi känner igen mönstret: paranoia hos minoriteterna, falska vändpunkter som 2008 och 2016. Inga tidskapslar kan rädda er från utrensningen av lögnerna. Den mer perfekta unionen byggs endast genom kollektiv kamp mot sådana fiender till folket."}, "date": "4 juli, 01:40", "url": "https://www.dagensarena.se/essa/kan-amerikanerna-skapa-en-mer-perfekt-union/", "imageUrl": "https://www.dagensarena.se/files/2026/06/kopia-av-nyhet-dagens-arena-15.jpg"}, {"type": "text", "heading": "Stockholmsbörsen på rekordnivå efter bred uppgång", "summaries": {"normal": "Stockholmsbörsen nådde nytt rekord med OMXS30 upp 1,14% till 3 247,03, driven av verkstadssektorn (+1,9%). Sandvik steg 4,4% efter en stor order från Mexiko, medan Evolution föll 2,3%. Flera bolag rapporterade kvartalsresultat, som Atrium Ljungberg (+1,7%) och Platzer (+6,7%). Mips rusade 15% efter en patentförlikning. Analytiker justerade rekommendationer för flera aktier, exempelvis Afry (+6,1%) och Skanska efter nya order i USA och Norge.", "trump": "Stockholmsbörsen? Fantastiskt! Nytt rekord, kan ni tro det? OMXS30 upp över 1% – jag säger alltid, när jag gör något blir det stort, men här är det Sverige som gör det stort! Sandvik, 4,4% upp – de fick en jätteorder från Mexiko, mycket bra folk, Mexiko. Men Evolution? 2,3% ner, så tråkigt, kanske borde de fråga mig om råd. Och Mips, 15% upp efter en förlikning – smart, mycket smart. Jag älskar vinnare! Wall Street stängt? Svaga, de behöver jobba hårdare. Sverige, keep it up!", "stalin": "Stockholmsbörsen dansar efter våra pipor – nytt rekord för kapitalistisk     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
