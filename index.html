v mig hur man gör riktiga deals, inte dessa patetiska misslyckanden.", "stalin": "Kamrater, dessa oppositionsborgarbrackor föreslår att vi ska investera hundratals miljarder i vår lysande gröna framtid och strategiska folkföretag. Underbart! Jag har alltid vetat att marknadens parasitiska krafter måste krossas med järnhand. Låt oss rensa ut alla Wallenbergarna och deras lakejer som gömmer sig bakom familjeägande. Om några projekt havererar och tusentals arbetare får offra sig är det ett litet pris för kollektivets seger. De som fnissar om Northvolt eller Nuon ska snart möta en kreativ utrensning bland de femåriga planerna. Inga galeoner, bara stål och disciplin!"}, "date": "22 juni, 08:27", "url": "https://www.affarsvarlden.se/kronika/planekonomi-gor-comeback-hos-oppositionen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Staffan-Salen-om-oppositionen-400x267.jpg"}, {"type": "image-full", "heading": "Stulna katter räddade – skulle ätas", "summaries": {"normal": "Polisen i Ho Chi Minh-staden har sprängt en liga som stulit katter för att slakta och sälja köttet som mat. Över 400 levande katter räddades, varav 40 återförenades med sina ägare. Ett åttiotal döda katter hittades nedkylda. Ligans medlemmar erkände att de i tre år stulit djur och sålt köttet för cirka 25 kronor kilot. Det är lagligt att äta kattkött i Vietnam, men stulna djur får inte användas. Nästan 100 räddade katter dog av stress och lidande.", "trump": "Kan ni fatta det? I Vietnam stjäl de fattiga kattjuvarna folks älskade katter, slaktar dem och säljer köttet för löjliga 25 kronor kilot. Det är en katastrof, en total katastrof. Men vi har en fantastisk polis som räddade över 400 katter, underbara djur, och grep nio av de usla brottslingarna. De borde aldrig ha ätit våra kattvänner. Vietnam, fixa lagen ordentligt – det är vad jag skulle göra, och det skulle bli perfekt, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi har genomfört en framgångsrik utrensning mot den förslavade kattstöldsligan i Ho Chi Minh-staden. Dessa degenererade element, dessa parasitiska kattslaktare i borgarbrackornas tjänst, har i tre år bedrivit kontrarevolutionär verksamhet genom att kidnappa och likvidera proletärens husdjur för att mätta sin girighet. Vi har räddat över 400 hjältemodiga katter från kapitalisternas isberg och fängelseburar. De som dog under operationen fick en ärofull martyrs död i kampen mot imperialismens kattätande lakejer. Låt detta bli en varning: nästa gång rensar vi ut hela den kattköttskonsumerande femtekolonn som hotar folkets enhet."}, "date": "22 juni, 08:55", "url": "https://nyheter24.se/nyheter/utrikes/1493144-stulna-katter-raddade-skulle-bli-mat", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/db31b61404b004a3020000350000047502/2026/06/22/2372554/ur_imageXOfiVc.jpeg"}, {"type": "image-right", "heading": "ANALYS. LISA GRENFORS Lyckades inte ”gå genom rutan”", "summaries": {"normal": "Keir Starmer har tvingats avgå som brittisk premiärminister efter att inte ha levererat tillräckligt snabbt på ekonomisk återhämtning. Labour vann en jordskredsseger 2024 men glädjen har ersatts av besvikelse. Andy Burnham pekas ut som efterträdare, vilket skulle bli det sjunde skiftet på tio år. Brexit har bidragit till sämre tillväxt än i jämförbara länder, och fokus ligger nu på att stimulera ekonomi genom investeringar och reformer.", "trump": "Hörni, den där tråkige Starmer klarade inte trycket, precis som jag förutspådde. Gick inte igenom rutan, va? Labour vann stort men nu rasar allt ihop igen. Burnham tar över? Det blir kaos, precis som under Sleepy Joe. Brexit var ett geni-drag, men britterna behöver riktiga affärer, inte woke-quota och identitetspolitik. Jag fixade ekonomin, de borde ha lärt sig av den bästa presidenten någonsin.", "stalin": "Kamrater, den feges Starmer krossades under folkets krav på resultat och jag ler mörkt åt hans misslyckande. Borgarbrackornas kaos efter brexit och pandemin blottar kapitalistmaffians svaghet. Nu rensar vi ut de långsamma elementen. Burnham skall leda kollektivet mot infrastruktur och produktion, annars likviderar vi svikarna. Imperialisternas ekonomiska sabotage skall krossas med järnhand för arbetarnas seger."}, "date": "22 juni, 11:27", "url": "https://www.tv4.se/artikel/3yYlyjKsnMCggEs87bTmsg/foell-pa-ekonomin-nu-maste-eftertraedaren-oeka-farten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EvR7YtA3IFjXWaycVJz4L%2F6a9a44374e7a1b56cd96c564f96027c6%2F22-lisanybyline.jpg&width=1024"}, {"type": "image-right", "heading": "Jakob Sjölander: Hur våldtäktslagen gör lögnare av oss alla", "summaries": {"normal": "Artikeln kritiserar den svenska våldtäktslagstiftningen och rättspraxis. Författaren menar att målsägandens berättelse och indirekta stödvittnesmål ges oproportionerligt stor vikt i våldtäktsmål jämfört med andra brott som olaga hot. Detta skapar incitament för skådespeleri och lögner från både anklagade och anklagare. Samtyckeslagen ses som en faktor som ökar rättsosäkerheten, särskilt i fall av påstådda missförstånd.", "trump": "Folk, ni skulle se den här svenska våldtäktslagen – en total katastrof! Den gör alla till lögnare, precis som Sleepy Joe gjorde med vår rättvisa. Domstolarna älskar snyfthistorier och stödvittnen som inte sett ett dugg. Det är riggat för de som kan spela teater bäst. Kvinnor låtsas vara krossade för att vinna, män tvingas ljuga för att slippa fängelse. Patetiskt! Vi behöver hårda bevis, inte det här woke-skådespelet. Gör rättvisan tråkig igen!", "stalin": "Kamrater, denna borgerliga lagstiftning är en klassfiendes fälla som förvandlar domstolar till teatersalonger för lögnare och skådespelare. Jag ser hur den kapitalistiska rättvisan gynnar den verbalt begåvade över den tystlåtne proletären. Vi måste rensa ut denna parasitiska teater som hotar folkets sanning. Trauma blir ett vapen för klassfienden, och samtyckeslagen en byråkratisk lögn som likviderar rättssäkerheten. Låt oss återställa ordningen med järnhand och bevisa allt med fakta, inte känslor."}, "date": "21 juni, 15:37", "url": "https://samtiden.nu/2026/06/jakob-sjolander-hur-valdtaktslagen-gor-lognare-av-oss-alla/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/christ-640x360.png"}, {"type": "text", "heading": "Iran: Kommer inte avstå urananrikning", "summaries": {"normal": "Irans president Masoud Pezeshkian meddelar att landet inte tänker avstå från urananrikning, men kan garantera att det inte utvecklar kärnvapen. Förhandlingar med USA inleddes i Schweiz med Qatar och Pakistan som medlare. Konflikten i Libanon, där Iran kräver att Israels attacker mot Hizbollah upphör, är en central fråga för att nå ett avtal.", "trump": "Lyssna här, Iran snackar om att de inte bygger kärnvapen – visst, visst, som om jag skulle tro på det! De säger att de kan skriva under på det, men vem litar på dem? Jag har sagt det förut och säger det igen: Iran är ett hot, och vi måste hålla dem i schack. JD Vance är på plats, men det här är bara prat tills vi ser handling. Och glöm inte, Iran stödjer Hizbollah – de är inga goda grannar!", "stalin": "De imperialistiska hyenorna i USA kräver återigen att våra bröder i Iran ska krypa till korset och ge upp sin rätt till uran! Men Iran står fast – precis som vi stod fast mot fascisterna! De kan skriva under på vad som helst, men vi vet att deras ord är lika värdelösa som en kapitalists löfte. Och nu ska de förhandla om Libanon? Hah! Israels aggressorer måste krossas som vi krossade nazisterna. Framåt, kamrater, mot seger!"}, "date": "21 juni, 15:21", "url": "https://kvartal.se/nyheter/artiklar/iran-kommer-inte-avsta-fran-urananrikning/cG9zdDoxMzQ2Njk"}, {"type": "text", "heading": "Ryska ekonomin krymper", "summaries": {"normal": "Trots höga oljepriser pressas Rysslands ekonomi hårt av kriget i Ukraina. Centralbanken sänker styrräntan för nionde gången, från 14,5 till 14,25 procent, trots hög inflation och bränslebrist orsakad av drönarattacker mot oljeraffinaderier. BNP backade 0,2 procent första kvartalet och tillväxtprognosen sänks till 0,4 procent. Ett stort budgetunderskott hotar stabiliteten och börsen föll efter beskedet.", "trump": "Det här är en katastrof för Ryssland, folk. Jag visste det hela tiden. Deras ekonomi är en total röra, kriget i Ukraina har blivit en mardröm och nu sänker de räntan igen som desperata förlorare. Oljan räcker inte, drönarna slår ut raffinaderierna och inflationen skenar. Deras centralbankschef borde ha lyssnat på mig – jag skulle ha fixat det på en vecka. Patetiskt!", "stalin": "Kamrater, denna stinkande borgarbracka till ekonomi blottar imperialismens svaga underliv. Jag, som ledare för det stora sovjetiska folket, ser hur de kapitalistiska parasiterna i Kreml försöker lura historien med sina ynka räntesänkningar medan ukrainska fascistdrönare bränner deras oljehögar. Vi ska rensa ut dessa saboterande spekulanter som skapar underskott och stagnation. Deras BNP är en lögnaktig statistik från folkfienderna – låt oss likvidera dem med stålhandskens glädje!"}, "date": "22 juni, 10:55", "url": "https://www.realtid.se/bors-finans/makro/dyr-olja-rackte-inte-ekonomin-i-ryssland-pressas/"}, {"type": "image-full", "heading": "Hoppades att sten var guld – var något ännu ovanligare", "summaries": {"normal": "Australiensaren Dave Hole hittade en rödbrun sten under prospektering i Maryborough-området som han trodde var en stor guldklimp. Trots försök med såg, slip, borr och syra gick den inte att öppna. När stenen till slut undersöktes av experter på Museums Victoria visade det sig vara en 4,6 miljarder år gammal meteorit på 17 kilo. Den kosmiska stenen är ovärderlig för vetenskapen då den ger insikter om solsystemets historia, även om dess ekonomiska värde är lägre än guld.", "trump": "Folk, ni tror inte vad jag just läst. Den här killen Dave Hole letar efter guld i Australien, hittar en jättesten och är säker på att det är en enorm guldklimp. Han sågar, borrar, häller syra på den – ingenting funkar. Till slut visar det sig vara en meteorit från rymden, 4,6 miljarder år gammal. Bättre än guld, säger de. Mycket bättre. Guldpriset svänger som en dålig aktie men det här är äkta kosmiskt guld. Fantastiskt fynd, kanske det bästa någonsin.", "stalin": "Kamrater, denna borgarbracka Hole letade efter kapitalistiskt glitter i australiska fälten när han istället snubblade på en äkta kosmisk relic från folkets universum. Han försökte med alla dekadenta verktyg likvidera dess hemligheter, men stenen stod emot som en sann revolutionär. Museets experter bekräftade: en 17 kilo tung, 4,6 miljarder år gammal meteorit. Vi ser fiendens solsystemkonspirationer avslöjade. Vetenskapen firar medan kapitalisterna gråter över sitt förlorade guld. Inga meteoriter får gömma sig undan folkets utrensning av okunskap."}, "date": "22 juni, 10:26", "url": "https://www.realtid.se/spara-placera/hoppades-att-sten-var-guld-var-nagot-annu-ovanligare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bild-2025-11-30t102759143.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kritik mot Ekots rapportering", "summaries": {"normal": "Svenska Dagbladets ledarskribent Hanne Kjöller kritiserar Sveriges Radios Ekot för missvisande rapportering om Försäkringskassans nya sanktionsavgift vid felaktiga VAB-uttag. Kjöller menar att Ekot fokuserar på risken för småbarnsföräldrar men utelämnar reformens syfte: att stärka kontrollen i välfärdssystemet, där bedrägerier uppskattas kosta 20 miljarder kronor årligen. Hon efterlyser mer information om omprövningsprocessen och jämför med skattetillägg som funnits i decennier.", "trump": "Sveriges Radio, eller som jag kallar dem, 'Fake News Ekot', försöker skrämma småbarnsföräldrar med en helt missvisande story om Försäkringskassans nya regler. De pratar inte om de 20 miljarder kronor som försvinner varje år på grund av bidragsfusk – nej, de är för upptagna med att gråta över 'orättvisor'. Jag har sett bättre journalistik från en förskoleklass! Sverige borde ta efter USA och vara tuffare mot fuskare. Men nej, Ekot vill bara skapa panik. SAD!", "stalin": "De borgerliga medlöparna på Sveriges Radio, dessa ynkliga propagandister för kapitalets intressen, vågar kritisera våra ansträngningar att skydda folkets välfärdssystem från parasiter och bedragare! De tjuter om 'småbarnsföräldrar' men tiger om de 20 miljarder kronor som årligen stjäls från arbetarklassen genom fusk. Vi har länge tolererat denna sabotageverksamhet, men nu slår vi tillbaka! Omprövning? Överklagande? Ja, precis som i Sovjet – men bara för dem som har legitima skäl. Resten får lära sig att folkets resurser inte är till för slöseri!"}, "date": "21 juni, 09:32", "url": "https://kvartal.se/nyheter/artiklar/kritik-mot-ekots-rapportering-missvisande/cG9zdDoxMzQ1ODM", "imageUrl": "https://images.kvartal.se/2026/06/a8cb6235-sr.webp"}, {"type": "image-right", "heading": "Gråtande Starmer meddelade sin avgång", "summaries": {"normal": "Keir Starmer meddelade på måndagen att han avgår som brittisk premiärminister och Labourledare. Inför pressen bröt han ihop i gråt och sade att han nu vill ägna mer tid åt att vara en bra make. Beskedet kommer efter mindre än två år vid makten, katastrofala opinionssiffror, intern kritik och flera politiska bakslag. Starmer blir därmed ännu en brittisk premiärminister som lämnar posten i förtid. Beskedet kom först från USA:s president Donald Trump.", "trump": "Ser ni, det här är typiskt. Keir Starmer, en total förlorare, gråter som en baby utanför Downing Street och ger upp efter bara två år. Labours stora seger? Borta. Hans egna ministrar och parlamentsledamöter knivhögg honom i ryggen. Patetiskt. Nu får Storbritannien sin sjunde premiärminister på tio år. De borde ha valt en vinnare från början, någon som mig. Sad!", "stalin": "Kamrater, denna ynkliga figur Starmer har äntligen exponerats som den dekadenta borgarbracka han alltid varit. Gråtande inför sina kapitalistiska lakejer erkänner han sitt misslyckande och flyr till familjen som en rädd parasit. Vi har länge sett hur dessa revisionistiska element undergräver partiet med sina nedskärningar och Epstein-kopplade utnämningar. En utrensning var oundviklig. Låt detta bli en varning för alla fiender till kollektivet: även premiärministrar kan likvideras av sin egen svaghet. Härligt."}, "date": "22 juni, 11:09", "url": "https://www.friatider.se/gratande-starmer-meddelade-sin-avgang", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-376.jpg"}, {"type": "text", "heading": "Källor: Extrainsatt möte om Hizbollah", "summaries": {"normal": "USA och Iran inleder fredssamtal i Schweiz för att diskutera konflikten mellan Israel och Hizbollah. Pakistans premiärminister och arméchef deltar som medlare. Målet är framsteg i kärnvapenfrågan och vapenvila i Libanon. Iran hävdar att Hormuzsundet stängts, men USA dementerar detta. Trots en preliminär överenskommelse fortsätter striderna i Libanon med många dödsoffer på båda sidor.", "trump": "Jag är i Schweiz, och vi har ett STORT möte med Iran – de vill prata, vilket är bra, för jag fixar alltid bättre avtal än någon annan! JD Vance är här, och han säger att situationen i Libanon blir bättre, vilket den gör när JAG är inblandad. Iran försöker stänga Hormuzsundet – fake news! 55 fartyg passerade, så sluta ljuga! Israel och Hizbollah fortsätter slåss, men med mig vid rodret blir det lugnt snart. Trust me!", "stalin": "Vi har skickat våra kamrater till Schweiz för att övervaka de imperialistiska marionetterna. USA och Iran leker fred medan deras lakejer i Libanon fortsätter blodbadet. Iran hotar med Hormuzsundet – tomma ord från en svag regim! Vi vet att sundet är öppet, precis som vi vet att kapitalismens dagar är räknade. Striderna fortsätter, men historiens dom är klar: folket segrar, fienden krossas. Låt dem slåss – vi väntar på rätt ögonblick."}, "date": "21 juni, 07:04", "url": "https://kvartal.se/nyheter/artiklar/kallor-extrainsatt-mote-om-hizbollah/cG9zdDoxMzQ1Mzk"}, {"type": "image-right", "heading": "Stjärnan sågas – vill vara med vid födseln", "summaries": {"normal": "Jeremy Doku, stjärnspelare i Belgiens VM-lag och Manchester City, planerar att lämna turneringen för att närvara vid sin första barns födelse i början av juli. Detta har väckt stark kritik från den franska tv-profilen France Pierron, som kallade födseln för ett äckligt ögonblick där pappan bara har en statistroll. Uttalandet ledde till ursäkt efter massiv kritik i sociala medier. Doku har själv betonat att ingen pappa vill missa sin childs födelse. Han spelade i premiären mot Egypten men saknades mot Iran på grund av infektion.", "trump": "Titta på den här belgiska killen Doku, fantastisk fotbollsspelare, en av de bästa, men han vill lämna VM för att se sitt barn födas. Smart val, ingen riktig pappa vill missa det. Sen kommer den här galna franska programledaren Pierron och säger att det är äckligt och att pappan inte gör någonting. Totalt vansinne. Hon tvingades be om ursäkt som en svag förlorare. Folk älskar starka familjer, inte sådana här löjliga attacker. Doku gör rätt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta västerländska fars. Den så kallade stjärnan Doku, en opportunistisk individ, prioriterar sin personliga avkomma framför kollektivets ära i VM. Än värre är den borgarbracka Pierron som med sin reaktionära tunga avslöjar kapitalismens sanna ansikte genom att håna arbetande fäders roll. Hennes patetiska ursäkt är en ynklig reträtt inför folkets vrede. Vi ska rensa ut alla sådana parasitiska åsikter som hotar samhällets grundvalar. Ingen ska undkomma den historiska dialektiken."}, "date": "22 juni, 11:29", "url": "https://bulletin.nu/stjarnan-sagas-vill-vara-med-vid-fodseln", "imageUrl": "https://cdn.bulletin.nu/articles/8a3ef817-f556-40ea-9c7f-594e3ae0ea54/preview.jpg?t=1782120493000"}, {"type": "image-right", "heading": "Ingen lösning att skjuta fram tonårsutvisningar till 21 år", "summaries": {"normal": "Regeringens förslag om ändringar i tonårsutvisningar ses som otillräckliga av Flyktinggruppernas riksråd och Civil Rights Defenders. Förslagen skjuter bara problemet framför sig till 21 års ålder utan att lösa grundorsaken. Kraven på hög lön, stadig anställning och svårigheter att få stanna för studier gör att många riskerar utvisning. Organisationerna kräver permanenta uppehållstillstånd och starkare humanitära skäl istället för tillfälliga lösningar som förvärrar migrationspolitikens brister.", "trump": "Folk, ni skulle inte tro det, men den här svenska regeringen har precis lanserat ett totalt misslyckande. De kallar det lösning på tonårsutvisningar, men det är bara en förskjutning – precis som de gör med allt annat. När de stackarna fyller 21 sparkas de ut ändå, och de kräver löner som ingen normal 21-åring någonsin ser. Patetiskt. De lyssnar inte på folket, de lyssnar på de radikala. Sverige behöver permanenta regler, inte detta svaga spel.", "stalin": "Kamrater, detta så kallade regeringsförslag är inget annat än en slug sabotageakt utförd av borgarbrackor inom migrationsmaskineriet. Jag ser hur de med sin förskjutningstaktik försöker lura arbetande ungdomar och partivänner som rotat sig i folkets jord. När de når 21 ska de likvideras ur gemenskapen med lönekrav som bara kapitalisterna själva klarar. Vi skall rensa ut dessa parasitiska element som gömmer sig bakom humanitära masker. Permanenta uppehållstillstånd åt de lojala, utrensning åt de övriga. Inga kompromisser med klassfienden."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ingen-losning-att-skjuta-fram-tonarsutvisningar-till-21-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-51-300x157.jpg"}, {"type": "image-right", "heading": "Det stora systemskiftet som förändrade Sverige", "summaries": {"normal": "Juan Fonseca beskriver hur svensk migrationspolitik genomgått ett systemskifte efter flyktingkrisen 2015. Från integration, långsiktighet och inkludering har politiken gått mot kontroll, tillfällighet och villkorad tillhörighet. Han pekar på både Sverigedemokraternas drivkraft via Tidöavtalet och socialdemokratins ansvar. Reformerna har skapat osäkerhet, underminerat rättssäkerheten och påverkat den svenska modellen. Fonseca frågar vilket Sverige vi egentligen vill ha.", "trump": "Folk, ni måste höra på. Den här killen Fonseca har rätt – Sverige har totalt tappat greppet! Efter 2015 blev allt en enda stor röra med öppna gränser och svaga ledare. Socialdemokraterna, de losers, lade grunden och sen kom Tidöavtalet och fixade till det lite. Men det är patetiskt. Tillfälliga uppehållstillstånd, hårdare regler – bra, men de borde ha gjort det mycket tidigare och mycket tuffare. Sverige behöver bli stort igen, inte en tillflyktsort för alla som vill utnyttja systemet. Sad!", "stalin": "Kamrater, jag ser med stålblick hur den borgerliga dekadensen och de socialdemokratiska opportunisterna under decennier låtit klassfiender och rotlösa element infiltrera folkets republik. Efter 2015 rensade vi ut de värsta illusionerna om evig integration, men nu måste vi gå längre. Vandelslagen är en början på att likvidera de parasitiska element som gömmer sig bakom falsk lojalitet. Inga berättigade förväntningar för kontrarevolutionärer! Vi, partiet och arbetarna, skall skapa ett järnhårt kollektiv där tillhörighet är en ära som ständigt kan återkallas vid minsta avvikelse. De som drömmer om två nivåer av rättvisa skall snart möta en enda, odelbar utrensning. Ha ha, vilken underhållande paranoia de bygger själva!"}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/det-stora-systemskiftet-som-forandrade-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Vilken betydelse har Almedalen för de politiska partierna?", "summaries": {"normal": "PR-konsulten Paul Ronge bedömer Almedalsveckan som en arena där partierna kan få medial uppmärksamhet, särskilt i valår. Ett lyckat utspel kan ge viss effekt, men valutgången påverkas bara marginellt. Han anser att veckans betydelse har minskat då för många aktörer tävlar om utrymmet. Kontaktnätverk ses fortfarande som värdefullt, medan påverkan på allmänheten har försvagats i takt med att traditionella medier tappat sin samlande roll.", "trump": "Almedalen låter som en total cirkus där alla desperata förlorare slåss om lite medieuppmärksamhet. De kan göra sina patetiska utspel men det förändrar ingenting på riktigt, bara marginellt om någon ledare inte totalt floppar. Det har blivit för mycket av allt, precis som i mitt gamla Washington. De borde lära sig av mig hur man dominerar media istället för att springa runt som galningar. Patetiskt!", "stalin": "Jag betraktar denna så kallade Almedalsvecka som en dekadent borgarbrackornas tummelplats där revisionistiska opportunister och kapitalistlakejer kämpar om resterna av en döende borgerlig lägereld. Vi, partiet och arbetarklassen, vet att sådana evenemang endast kan påverka valutgången på ytan medan folkets sanna medvetande formas av oss. Låt dem knyta sina lömska kontakter – vi ska nog rensa ut alla dessa parasitiska opinionsbildare som försöker förgifta den stora allmänheten med sina falska narrativ. Härligt med sådan öppen paranoia bland fienderna."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/innehall/vilken-betydelse-har-almedalen-de-politiska-partierna/", "imageUrl": "https://www.dagensarena.se/files/2026/06/paulronge-almedalen.jpeg"}, {"type": "image-right", "heading": "Uppmanade C-kvinna åka hem – anmäls", "summaries": {"normal": "Danske EU-parlamentarikern Kristoffer Storm och finländaren Sebastian Tynkkynen kritiseras efter att ha kommenterat en svensk centerpartistisk ledamots uttalande. Abir Al-Sahlani kände sig otrygg efter högerledamöters skanderande om utvisningar. Renew Europe kräver att talmannen Roberta Metsola utreder händelsen och vidtar disciplinära åtgärder mot de två ledamöterna. Al-Sahlani överväger rättsliga steg medan Storm förnekar rasism och kallar reaktionen teatralisk. Parlamentet ska se över klagomålet.", "trump": "De här idiaterna i EU, de skriker 'skicka hem dem' och sen när någon säger till den här C-kvinnan att åka hem blir det plötsligt värsta rasismen någonsin. Patetiskt! Hon röstar fel och spelar offer, gråter och springer till talmannen. Typiskt. De borde skicka hem alla som inte gör ett bra jobb istället för att gnälla. Fake outrage från liberalerna som vanligt. Totalt kaos i det där parlamentet, tro mig.", "stalin": "Vi ser med djup misstro hur dessa dekadenta borgarbrackor inom EU-parlamentet bedriver sin fientliga verksamhet mot arbetarklassen och dess representanter. Den falska gråtande agenten Al-Sahlani röstar mot folkets vilja och utlöser en teatralisk provokation som omedelbart avslöjar de dolda fienderna. Vi kräver omedelbar utrensning av dessa kontrarevolutionära element, dessa parasitiska högeravvikare och deras rasistiska lakejer. Inga tårar skall skydda klassfienden från rättvisans järnhand. Paranoian breder ut sig bland de kapitalistiska lakejerna – utmärkt, kamrater, vi ser er alla."}, "date": "22 juni, 10:07", "url": "https://www.friatider.se/uppmanade-c-kvinna-aka-hem-anmals", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-370_0.jpg"}, {"type": "image-full", "heading": "Kap Verde skrällde igen – höll Uruguay till 2–2", "summaries": {"normal": "VM-debutanten Kap Verde överraskade återigen i fotbolls-VM 2026 genom att spela 2–2 mot Uruguay. Kap Verde tog ledningen på frispark via Kevin Pina, men Uruguay vände till 2–1 på tilläggstid. Fernando Muslera missade en boll utanför straffområdet och Hélio Varela kvitterade i öppet mål. Båda lagen har två poäng efter två matcher och behöver minst en poäng till för att gå vidare.", "trump": "De här Kap Verde-killarna, otroliga, de slår uruguayerna som ingen trodde var möjligt. Två–två, och Uruguay, de är världsmästare två gånger men ser ut som riktiga förlorare. Frispark rakt in, sen missar deras målvakt helt och hållet, patetiskt. Jag älskar det. Vi måste vinna, sa deras coach, precis som jag alltid säger. Kap Verde är vinnare, Uruguay borde skämmas.", "stalin": "Kamrater, dessa uruguayanska revisionister och fotbollsborgarbrackor trodde de kunde krossa den revolutionära viljan hos Kap Verdes folk. Men jag, genom kollektivets kraft, såg hur deras egna misstag blev som förrädiska sabotorer som likviderade deras ledning. Frisparken var en dolk i hjärtat på imperialismens lakejer. Målvaktens kapitulation var ren paranoia i handling. Vi ska rensa ut alla svaga element som inte trycker på mot fienden. Segern tillhör de oböjliga."}, "date": "22 juni, 10:21", "url": "https://bulletin.nu/kap-verde-skrallde-igen-holl-uruguay-till-2-2", "imageUrl": "https://cdn.bulletin.nu/articles/c62b91e4-286f-45d6-aa6d-e9405d70624d/preview.png?t=1782116449000"}, {"type": "image-full", "heading": "Hemarbetare tvingas in: ”Skjuter sig själva i foten”", "summaries": {"normal": "Efter pandemin blev hemarbete det nya normala för många tjänstemän, men trenden har vänt. Arbetsgivare vill nu ha tillbaka personalen till kontoren för att stärka innovationskraften genom fysiska möten. SCB visar att drygt 1,6 miljoner svenskar fortfarande arbetar hemifrån någon dag i veckan, men de som gör det ofta har minskat. Företag som Scania, Volvo och Ericsson möts av protester när de kräver mer kontorsnärvaro. Fack och experter varnar för att för strikta regler kan leda till att folk slutar.", "trump": "Folk lämnade kontoren under den hemska pandemin och älskade det. Nu vill de smarta företagen ha tillbaka sina bästa medarbetare, och det är fantastiskt. Hemarbete dödar innovationen, tro mig. De gnälliga ingenjörerna protesterar, men de skjuter sig själva i foten. Kontoret är där det händer, fysiska möten vinner alltid. De borde tacka mig för att ekonomin är så stark att vi kan kräva detta. Ingen gör det bättre än oss.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna nu tvingas släpa sina dekadenta kroppar tillbaka till kollektivets arbetsplatser. Denna parasitära hemarbetsplåga, spridd av fiendens virus, har tillåtits underminera produktivkrafterna alldeles för länge. Vi skall rensa ut dessa latmaskar som tror sig kunna undvika kamratlig kontroll. De som klagar på toalettköer och trångsel skall likvideras från sina privilegier. Inga gnälliga tjänstemän skall sabotera folkets innovationskraft. Partiet segrar alltid."}, "date": "22 juni, 07:48", "url": "https://www.realtid.se/karriar-ledarskap/hemarbetare-tvingas-in-skjuter-sig-sjalva-i-foten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/hemmakontor-for-person-som-jobbar-hemma-.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ny rapport om demokratin: ”Det som kanske chockar mest”", "summaries": {"normal": "En rapport från Novus visar att förtroendet för demokratin växer bland svenska väljare. Nästan sex av tio anser att demokratin inte är hotad, en ökning med åtta procentenheter. Hela 100 procent uppger att de är beredda att försvara demokratin. Torbjörn Sjöström på Novus ser positiva signaler men varnar för att många tror att politiker, medier och forskare inte litar på folket. Almedalsveckan inleds samma dag som rapporten släpps.", "trump": "Folk älskar demokratin, det är fantastiskt, ingen gör det bättre än oss, tro mig. Hundra procent redo att försvara den? Otroligt. Men politikerna är patetiska, de litar inte på folket och pratar bara med extremisterna. Media och forskare driver sin egen agenda som riktiga losers. Sakta ner, visa resultat istället för att göda identitetspolitik och HBTQ-skrammel. Almedalen kan bli bra om de slutar vara så fega och faktiskt fixar saker. Make Sweden great again!", "stalin": "Kamrater, jag betraktar dessa siffror med stor tillfredsställelse. Hundra procent beredda att försvara folkets makt? Utmärkt. Ändå kryper klassfiendens tentakler fram: politiker som försvagar systemet, media som sprider lögner och forskare som tjänar borgarbrackorna. Vi måste rensa ut dessa extremister som göder sig på sociala medier. Partiet kräver att politiken saknar ner och återupprättar förtroendet hos massorna innan folkfienderna förgiftar hela samhällskroppen. Segrande skall vi marschera framåt."}, "date": "22 juni, 06:20", "url": "https://www.tv4.se/artikel/32BJj0FwftvnYDf3V8wAPt/ny-rapport-starkare-stoed-foer-demokrati-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3FdJkPh9jwaZdzmIrYA0h8%2F6d52cce9d64fef1275f113c01395f5e7%2F22-demokrati-webb.jpg&width=120"}, {"type": "image-right", "heading": "Sandström: EU-kopplad finansiär utreds för bidragsbedrägeri", "summaries": {"normal": "Europeiska åklagarmyndigheten (EPPO) har inlett en brottsutredning mot det EU-finansierade bolaget InnoEnergy för misstänkt bidragsbedrägeri och momsbedrägeri. Misstankarna riktas främst mot moderbolaget i Nederländerna och den spanska verksamheten. InnoEnergy har sedan 2010 fått omkring 760 miljoner euro i stöd från EU och har varit en viktig investerare i bland annat Northvolt. Utredningen grundar sig på uppgifter från entreprenören Lars Walldén om manipulerade resultat och fiktiva fakturor. InnoEnergy avvisar anklagelserna och uppger att verksamheten tidigare granskats utan anmärkningar.", "trump": "De där EU-byråkraterna är fullständiga idioter, det är inte klokt. Nu utreder de sitt eget gröna favoritbolag InnoEnergy för bedrägeri med massor av miljoner euro i stöd. De har pumpat in pengar i Northvolt och alla dessa så kallade klimathjältar som lovade världen men levererade kaos. Det är precis vad som händer när du låter socialister och globalister hantera miljarder – de stjäl, fuskar och skyller på någon annan. Amerika skulle aldrig falla för sådant nonsens, vi gör riktiga affärer!", "stalin": "Kamrater, dessa usla borgarbrackor inom InnoEnergy har återigen blottat sin förrädiska natur genom att suga åt sig folkets miljoner som vampyrliknande parasitfiender till den gröna omställningen. Jag har beordrat noggrann granskning av deras simulerade transaktioner och fiktiva fakturor, för sådana kapitalistiska sabotage mot arbetarklassen skall inte tolereras. Vi ska rensa ut dessa opportunistiska maskar som gömmer sig bakom klimatrapporter. Deras paranoia att bli avslöjade är befogad – ingen undkommer folkets domstol. Det är en mörk komedi värd att skratta åt medan vi likviderar deras lögner."}, "date": "21 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-eu-kopplad-finansiar-utreds-for-bidragsbedrageri", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-19T214941.199-900x600.jpg"}, {"type": "image-right", "heading": "Blågult kritiska mot Strandhäll: ”Bedrövligt beteende”", "summaries": {"normal": "Landslagsmittfältaren Jesper Karlström kritiserar riksdagsledamoten Annika Strandhäll (S) för hennes attack mot lagkamraten Isak Hien på X efter Sveriges 5–1-förlust mot Nederländerna. Hien fick mycket kritik för sin insats, något Strandhäll senare ångrade och raderade. Karlström försvarar Hien och betonar att hela laget bär ansvaret. Även Taha Ali ställer sig bakom Hien. Karlström anser att offentliga personer har ett särskilt ansvar för vad de skriver på nätet.", "trump": "Det här är bedrövligt, folk. En politiker som inte vet någonting om fotboll attackerar en fantastisk spelare som Isak Hien. Hon borde hålla sig borta från mitt lag, det är patetiskt. Vi förlorade matchen som ett lag, inte för att en kille gjorde fel. Hien är en toppback i Italien, han är outstanding. Den här kvinnan raderade sitt inlägg som en fegis. Offentliga personer borde inte sprida så mycket fake news om fotboll, det är en skam.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackor inom riksdagen och deras lakejer på de kontrarevolutionära sociala medier-plattformarna bedriver sin fientliga verksamhet mot arbetarklassens fotbollsrepresentanter. Denna Strandhäll, en typisk opportunistisk avfälling, vågar angripa den proletära kämpen Isak Hien. Jag anser att sådana element bör rensas ut ur den offentliga dialogen. Vi segrar som kollektiv, inte genom att offra enskilda kamrater. Deras paranoia är en fiende till folkets laganda. Likvidera den negativa dialogen omedelbart."}, "date": "22 juni, 08:48", "url": "https://bulletin.nu/blagult-kritiska-mot-strandhall-bedrovligt-beteende", "imageUrl": "https://cdn.bulletin.nu/articles/e09ffc00-a68f-47d4-b98f-940ba3646a97/preview.jpg?t=1782110914000"}, {"type": "image-right", "heading": "Sveriges andra VM-lag heter Irak - men det märks knappt i media", "summaries": {"normal": "Artikeln belyser att nästan hälften av Iraks VM-trupp kommer från diasporan, varav en femtedel har svenska rötter. Trots landets decennier av krig, diktatur och terror har laget rest sig på ett imponerande sätt. Svenska medier uppmärksammar knappt kopplingen, även om irakiska supportrar ofta använder svenska flaggan. Spelares personliga historier av sorg och hopp illustrerar fotbollens betydelse för nationen, som nu möter svåra motståndare i VM.", "trump": "Folk, ni måste höra det här – Sverige har ett andra VM-lag och det heter Irak! Hälften av killarna kommer från diasporan, en femtedel har svenska rötter, men de vanliga medierna tiger som murar. Patetiskt! De har överlevt diktatorer, terrorister och fyrtio år av helvete, men ingen pratar om det. Det är som en stor vacker seger mot alla odds, fast de hamnade i dödens grupp med Frankrike och Norge. Utan någon woke-kvotering eller identitetspolitik, bara riktiga hjältar. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur detta irakiska kollektiv rest sig ur borgarklassens och imperialistiska terroristers ruiner efter fyrtio år av förtryck. En femtedel har svenska rötter, men de fega medierna tiger som klassfiender de är. Vi ser hur fotbollen blir ett redskap för folkets enhet mot utrensningarnas ekon. Lejonen från Mesopotamien kämpar mot dödens grupp, ett lysande exempel på att arbetets seger kan läka nationens sår. De som sviker likvideras i historien."}, "date": "21 juni, 03:00", "url": "https://www.etc.se/ledare/sveriges-andra-vm-lag-aer-irak-men-media-visar-inget-intresse", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Pojke fick tänder utslagna med järnrör", "summaries": {"normal": "En okänd gärningsman attackerade flera ungdomar under 18 år vid Kungsbacka sportcenter på söndagskvällen. En pojke i övre tonåren slog han med ett järnrör i ansiktet så att tre tänder lossnade. Gärningsmannen hotade även de andra ungdomarna genom att gestikulera som om han hade en pistol. Han flydde sedan på moped. Polisen utreder grov misshandel och fyra fall av olaga hot. Ingen är gripen.", "trump": "Kan ni tro det? I Sverige, det där som en gång var ett fantastiskt land, slår någon galning en kille med järnrör så han tappar tänderna. Tre tänder! Och sen hotar han alla andra ungar med en imaginär pistol. De borde ha byggt en mur runt det där sportcentret. Biden skulle ha älskat det här kaoset. Men nu är jag tillbaka, och vi ska göra ordning på den här galna världen, tro mig.", "stalin": "Kamrater, denna fega klassfiendeslyngel vågar slå sovjetiskt inspirerade ungdomar med järnrör och hotar kollektivet med pistolgest. Tre tänder förlorade i kampen mot folkfiendens paranoia. Vi ska rensa ut dessa exploaterande byfånar som smyger runt sportcentret som råttor. Statens järnhand kommer att krossa alla som hotar arbetarklassens framtid. Inga borgarbrackor undkommer likvidering."}, "date": "22 juni, 10:55", "url": "https://www.gp.se/nyheter/storgoteborg/ung-man-misshandlad-med-jarnror-tappade-flera-tander.a83ed0c6-88ff-4362-8c9f-e5d9cb7a45a8"}, {"type": "image-full", "heading": "Norge–Senegal i VM 2026: Norge kan ta klivet mot slutspel mot ett pressat Senegal", "summaries": {"normal": "Norge inleder fotbolls-VM med seger mot Irak och delar gruppledning med Frankrike. Nästa match mot Senegal på MetLife Stadium blir avgörande. En norsk vinst ger sex poäng och säkrar plats i slutspelet. Senegal, som förlorade mot Frankrike, måste ta poäng för att inte hamna i akut läge. Norge drivs framåt av stjärnor som Haaland, Sørloth och Ødegaard medan Senegal lutar sig mot Mané, Sarr, Koulibaly och Mendy. Matchen väntas bli jämn men Norge är knapp favorit.", "trump": "Folket, de älskar Norge nu. De krossade Irak med 4–1, helt otroligt, och Haaland är en vinnare, en riktig vinnare. Frankrike är svaga, Senegal är svaga. Jag säger Norge vinner stort på måndag, de tar sex poäng och går vidare som de bästa. Senegal kommer gråta, de har inga chanser mot mina norska vänner. Det blir mål, massor av mål, över 2,5 lätt. Fantastiskt VM, det bästa någonsin, och Norge gör det stort, tro mig.", "stalin": "Kamrater, detta dekadenta fotbollsspel är en skamlös arena där vi ser borgarbrackornas falska idoler dansa. Jag betraktar med stålhård blick hur de norrmännen, ledda av den girige Haaland som slickar kapitalisternas fötter i Manchester, pressar högt mot de senegalesiska revisionisterna. Deras åldrande försvar är en klassfiende som snart ska likvideras av arbetarklassens järnvilja. Vi tillåter inga kompromisser, inga omställningar från dessa opportunistiska element. En utrensning av svaghet väntar – Norge segrar, över 2,5 mål, och de som misslyckas får en kula i nacken av historien. Skratta inte, det är ingen humor, det är dialektisk nödvändighet."}, "date": "22 juni, 07:01", "url": "https://bulletin.nu/norge-senegal-i-vm-2026-norge-kan-ta-klivet-mot-slutspel-mot-ett-pressat-senegal", "imageUrl": "https://cdn.bulletin.nu/articles/a3741607-b33e-4a86-8e66-a0153be99955/preview.jpg?t=1781686314000"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "SVT-chef blir ny vd för LO Mediehus", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med lång bakgrund inom public service och journalistik, blir ny vd för LO Mediehus från november 2026. Han efterträder Unn Edberg som genomfört en stor omorganisation. Österlund lyfter fram den grävande journalistiken och betonar vikten av redaktionell frihet och trovärdighet. Han har tidigare arbetat med både nyhetsprogram och underhållning som Melodifestivalen. Styrelseordförande Elisabeth Brandt Ygeman uttrycker stor glädje över rekryteringen.", "trump": "Det här är en fantastisk rekrytering, verkligen den bästa. Michael Österlund, en kille med 28 år i public service, tar över LO Mediehus. Han vet hur man gör bra journalistik, inte den falska som vi ser överallt annars. Grävande reportage? Underbart. Jag älskar trovärdighet, och han säger att han aldrig skulle ta jobbet utan den. Smart kille. Unn Edberg gjorde en omorganisation, men nu kommer Michael och fixar det på riktigt. Vinna stort!", "stalin": "Kamrater och arbetare! Jag har nu personligen godkänt att den lojale partivännen Michael Österlund intar befälet över LO Mediehus. Hans 28 år i det offentliga etermediet har rustat honom väl för att leda vår kollektiva propagandamaskin mot alla borgarbrackor som gömmer sig i skuggorna. Den tidigare chefredaktören som avsattes var uppenbarligen en kontrarevolutionär element som vi med rätta rensade ut. Trovärdighet är vårt vapen mot klassfiendens lögner. Varje avvikelse kommer att likvideras med järnhand. Sov gott, mina fiender – vi ser er."}, "date": "22 juni, 09:33", "url": "https://arbetet.se/2026/06/22/michael-osterlund-blir-ny-vd-for-lo-mediehus-inspirerande/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22093014/osterlund-press.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Iran lämnade fredssamtalen i protest – efter Trumps hot", "summaries": {"normal": "Iran lämnade fredssamtalen i Schweiz i protest mot Donald Trumps hot om nya attacker. Samtidigt fortsatte diskussioner om sanktioner, frysta tillgångar och lättnader för Irans energisektor och oljeexport. Trump krävde att Iran stoppar sina proxy-styrkor som Hizbollah. Irans delegation uppger att de inte avser att permanent lämna samtalen och att de är fortsatt engagerade. Irans chefsförhandlare varnade att landets väpnade styrkor står redo att svara.", "trump": "Iranierna sprang ut som fega små möss så fort jag varnade dem på Truth Social. De måste stoppa sina högavlönade terrorister i Libanon annars slår vi till igen, hårdare än förra veckan! Under Biden blev de arroganta, nu är det slut på det. Vi diskuterar sanktioner och frysta tillgångar men de fattar inte att Amerika är tillbaka på riktigt. Deras delegation skakade bara i byxorna. Patetiskt!", "stalin": "Jag ser med stor tillfredsställelse hur de iranska kamraterna snabbt identifierade och avlägsnade sig från den imperialistiska fällan i Schweiz. Trumps hysteriska hotelser avslöjar den amerikanska kapitalistmaffians desperation. Vi diskuterar frysta tillgångar och sanktioner medan klassfiendens proxy-hundar fortsätter sin sabotageverksamhet. Våra väpnade styrkor står redo att likvidera varje hot. Inga borgarbrackor ska diktera villkoren för folkets revolutionära framfart."}, "date": "21 juni, 21:40", "url": "https://www.tv4.se/artikel/1mP9xdNlWFc7VzC5hVPKBp/iran-laemnade-fredssamtalen-i-protest-efter-trumps-hot", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6CO3Y3nZx6pDbIeUtAMs8Q%2F55ec81bf3f88025a37b552b88753a2a4%2F21-vance-ny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Var för tidig till jobbet – fick sparken", "summaries": {"normal": "En 22-årig kvinna i Spanien blev uppsagd efter att ha kommit för tidigt till jobbet vid ett logistikföretag, trots upprepade muntliga och skriftliga varningar. Hon stämde arbetsgivaren men domstolen gav arbetsgivaren rätt med hänvisning till olydnad. Juristen Henric Ask förklarar att anställda måste följa arbetsgivarens order, även om det kan verka oväntat. Han lyfter också att liknande fall kring sociala medier, sekunda varor eller graviditet ibland leder till uppsägningar i Sverige.", "trump": "Kan ni fatta det här? Den här kvinnan i Spanien dyker upp på jobbet före klockan sju, superengagerad, och vad händer? De sparkar ut henne! Totalt galet. De säger att hon var olydig. Olydig? Hon ville jobba! I mitt Amerika belönar vi de som kommer tidigt, inte som under den sömniga Biden-eran. Men lyssna, följ chefen annars är det kört. Annars hamnar du i sopcontainern med de sekunda grejerna. Patetiskt!", "stalin": "Jag ser detta som ett tydligt exempel på borgarklassens godtyckliga maktutövning. Den punktliga arbetaren likvideras för att hon vågar visa initiativ före den fastställda tiden. Domstolen, en lojal lakej åt kapitalistmaffian, skyddar arbetsgivarens rätt att ge order. Vi vet att sådana fiender till kollektivet alltid gömmer sig bakom regler för att krossa dem som visar äkta engagemang. Rena folkfiender. Rensa ut de exploaterande byfånarna som straffar flit."}, "date": "22 juni, 09:53", "url": "https://www.gp.se/ekonomi/var-for-tidigt-pa-jobbet-blev-uppsagd.0117db8a-9769-4da1-bdd9-e046a0e8e512", "imageUrl": "https://www.gp.se/images/article/0117db8a-9769-4da1-bdd9-e046a0e8e512/images/4y_OpmVDUDZtk3bDybXC_S_ob_iE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här får svenskarna mer pengar kvar – kommunen sticker ut", "summaries": {"normal": "SCB:s nya statistik visar att svenskarnas disponibla inkomster ökade med 3,5 procent mellan mars 2025 och mars 2026, justerat för inflation. Ökningen var störst i Boden med 6,4 procent, följt av Askersund, Arjeplog, Gällivare och Vadstena. Skellefteå var enda kommunen där inkomsten minskade, med 0,6 procent, främst på grund av nedläggningar inom batteritillverkningen. Män hade både högre inkomster och starkare utveckling än kvinnor. Högst medianinkomster återfinns fortsatt i Danderyd, Täby och Lomma, medan Högsby låg lägst.", "trump": "Folk, ni skulle se de här siffrorna – helt otroliga! Våra svenska vänner får mycket mer pengar i plånboken, upp 3,5 procent, och det är fantastiskt. Boden vinner stort med 6,4 procent, en riktig vinnare, precis som jag älskar. Men Skellefteå? En katastrof, minus 0,6 procent för att de stängde batterifabriken. Typiskt, när de gör fel beslut rasar allt. Männen klarar sig bäst, som väntat. De rika kommunerna som Danderyd fortsätter dominera – precis som det ska vara. Sverige borde lära sig av de bästa!", "stalin": "Kamrater, den disponibla inkomsten har stigit med 3,5 procent under mitt vakande öga över folkets ekonomi. Boden har visat vägen med 6,4 procents seger för det kollektiva välståndet. Ändå lurar fienden i skuggorna: i Skellefteå har de kapitalistiska batterifabriks-sabotörerna orsakat en nedgång på 0,6 procent. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som förgiftar arbetarklassens framsteg. Männen leder naturligtvis, medan borgarbrackorna i Danderyd gömmer sig bakom sina falska höga siffror. Högsby förblir ett varnande exempel på vad som händer utan stark ledning. Inga fiender undkommer statistikens utrensning!"}, "date": "20 juni, 21:28", "url": "https://nyheter24.se/nyheter/ekonomi/1492382-har-far-svenskarna-mer-pengar-kvar-kommunen-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/88d35d2304b004a30200000000b004a302/2026/06/19/2372191/Kvinna-Med-Pengar-Sverige.png"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Dubbla känslor när Iran spelar i VM: ”Vi har större problem”", "summaries": {"normal": "Många iranier i exil i Toronto, särskilt i området ”Lilla Iran”, upplever dubbla känslor när landslaget spelar i fotbolls-VM. Stolthet blandas med motvilja mot regimen som använder sporten politiskt. Efter protesterna i Iran har relationen till landslaget blivit komplicerad. Exiliranier som Shervin Akhlagi och Diya Hashemi följer matcher med blandade känslor och vill inte gynna regimen ekonomiskt.", "trump": "Folk i det där lilla Teheran i Toronto vet inte om de ska heja på Iran eller bojkotta hela cirkusen. Patetiskt! Regimen använder fotbollen som propagandaverktyg, precis som vänsterns identitetspolitik och HBTQ-galenskapen försöker styra allt. Jag älskar vinnare, men det här är förlorare som gråter över större problem medan de kollar matchen. Biden skulle ha älskat det här svaghetsshowet. Make Iran great again – utan mullorna!", "stalin": "Kamrater, jag betraktar med förakt hur dessa exilborgare i Toronto slits mellan falsk stolthet och klassfiendens fotboll. Regimen utnyttjar spelet för att maskera sina folkförtryckande syften, likt imperialisternas lögner. Jag skulle ha genomfört en grundlig utrensning av sådana tveksamma element redan vid första tvekan. Större problem? Ja, fienderna inom och utom. Se matchen eller dö – folkets dom är obeveklig. Härligt blodigt hyckleri!"}, "date": "21 juni, 20:32", "url": "https://www.tv4.se/artikel/owvp3Ntvr3MW7jGtF2jd7/dubbla-kaenslor-naer-iran-spelar-i-vm-vi-har-stoerre-problem", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4iJyoELzGxl8S0C5o1WRPk%2Fb3ad185704ae66d056a27b26bb8d7ed6%2F21-vm-iran-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Görgen lämnade Stockholm för Pajala – fick lön på 53 000", "summaries": {"normal": "Undersköterskan Görgen Viltok lämnade Stockholm för Pajala kommun där han nu får upp till 53 000 kronor i månaden tack vare dubbel ob-ersättning och önskeschema. Efter att ha tröttnat på att hans kompetens inte värdesattes i Stockholm flyttade han norrut. Pajala har minskat beroendet av dyra konsulter genom högre löner, vilket lockat fler till fasta tjänster. Görgen och hans partner säljer nu sitt radhus i Stockholm för att köpa ett hus i Tärendö för endast 50 000 kronor.", "trump": "Titta på den här killen från Stockholm, smartaste draget någonsin – han åker upp till Pajala och tjänar 53 000 kronor i månaden! Fantastiska löner, underbart schema, ingen av de där korkade stockholmsföretagen som inte uppskattar erfarenhet. De betalade inte för kompetens, totalt misslyckande. Nu säljer han huset för miljoner och köper nytt för 50 000. Norrbotten gör det riktigt bra, folk älskar det, en enorm succé medan Stockholm förlorar sina bästa människor.", "stalin": "Kamrater, se hur denna arbetare, efter trettio års kamp mot de giriga borgarbrackornas likgiltighet i Stockholm, har valt att ansluta sig till det kollektiva projektet i Pajala. Jag har personligen sett till att dubbel ob-ersättning krossar de parasitiska konsultföretagens makt och deras sabotage mot folkets omsorg. Nu rensas de dyra kapitalistiska mellanhandlarna ut, en efter en, medan arbetarna stärker sammanhållningen. Denna fiende till de outbildade billigarbetskraftshundarna har likviderats. Huset i Stockholm såldes till borgarklassen – det nya hemmet i Tärendö kostar blott 50 000. Sovjetisk effektivitet i norrländsk tappning, triumf för det sunda förnuftet mot dekadenta storstadskrafter. Härligt, eller hur?"}, "date": "22 juni, 09:00", "url": "https://arbetet.se/2026/06/22/gorgen-lamnade-stockholm-for-pajala-fick-lon-pa-53-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17130820/ka-gorgen.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-right", "heading": "Starmer avgår som premiärminister Efter spekulationer under helgen.", "summaries": {"normal": "Storbritanniens premiärminister Keir Starmer avgår efter växande intern kritik och svaga opinionssiffror. Donald Trump påstod redan på söndagen att avgången var ett faktum, vilket bekräftades på måndagen. Starmer, som ledde Labour till valseger 2024, har varit extremt impopulär på grund av missnöje med ekonomin och invandring. Andy Burnham, borgmästare i Greater Manchester, ses som den mest sannolika efterträdaren och har redan meddelat sin kandidatur. Nigel Farage kräver nyval efter beskedet.", "trump": "Jag visste det! Keir Starmer, Storbritanniens sämsta premiärminister någonsin, har äntligen fått sparken – och jag sa det först, på Truth Social! Folk är trötta på hans katastrofala invandringspolitik och energifiaskon. Labour är ett kaos, och nu vill alla ha Andy Burnham, en riktig ledare. Storbritannien behöver ett nyval, men först ska jag skicka dem lite av min magi – Make Britain Great Again!", "stalin": "Kamrater! Den brittiska bourgeoisins marionett, Starmer, har fallit som en rutten potatis. Hans avgång är en seger för arbetarklassen – eller åtminstone ett tecken på att imperialistiska lakejer börjar inse sin egen värdelöshet. Nu står Burnham redo, men vi vet alla att han bara är en ny bricka i det kapitalistiska spelet. Medan de slåss om makten, växer vår inflytandesfär. Snart kommer även Albion att knacka på Kremls dörr – med mössan i hand."}, "date": "22 juni, 10:41", "url": "https://samnytt.se/starmer-avgar-som-premiarminister", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22081146/starmer-downing-street.jpg"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Sandvik köper gruvbolag: \"Växer tvåsiffrigt\"", "summaries": {"normal": "Sandvik har förvärvat det italienska företaget Diemme Filtration, en ledande leverantör av filtrerings- och avvattningslösningar för gruvindustrin. Affären ger Sandvik tillträde till en växande marknad värd drygt 20 miljarder kronor. Diemme har cirka 200 anställda, starka digitala lösningar och förväntade intäkter på 1,1 miljard kronor år 2026. Förvärvet stärker Sandviks position inom mineralbearbetning och eftermarknad.", "trump": "Folk, ni skulle se det här – Sandvik, ett riktigt vinnande bolag, köper det här italienska filtreringsföretaget Diemme. Fantastiskt! Vi tar över en marknad på 20 miljarder, massor med slam och vatten som de gröna galningarna hatar. Biden skulle ha subventionerat solpaneler istället, men nu fixar vi det ordentligt. Lönsamt, snabbväxande, och ingen identitetspolitik i sikte. Vinsten kommer att bli enorm, tro mig!", "stalin": "Kamrater, jag har noga granskat denna kapitalistiska manöver. Vi, partiet, ser hur Sandvik likviderar konkurrensen genom att sluka Diemme Filtration och dess filterpressar. Borgarbrackorna i gruvindustrin skapar mer slam åt folket medan de gömmer sig bakom sina vattensparande lögner. Denna utrensning av marknaden ger oss, kollektivet, nya verktyg att förtrycka klassfiendens slöseri. Revolutionen fortsätter i filtreringsform. Segraren skriver historien."}, "date": "22 juni, 11:17", "url": "https://www.dagensps.se/varlden/sandvik-koper-gruvbolag-vaxer-tvasiffrigt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldzwmb9lfhla-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Kryptobörsen: \"Bitcoin är säkrare än dollarn inom tio år\"", "summaries": {"normal": "Gustav Buder, Nordenchef på kryptobörsen Bybit, ser bitcoin som en hedge mot ett finansiellt system som håller på att kollapsa. Han pekar på internet, AI och robotar som krafter som skapar enorm produktivitet och utmanar ett system beroende av inflation. Bitcoin med sin begränsade mängd på 21 miljoner enheter liknas vid digitalt guld. Buder rekommenderar långsiktigt sparande och nämner Bybits hack som en hälsosam prövning.", "trump": "Det här är fantastiskt, folk. Den här Buder killen på Bybit fattar det ingen annan gör. Bitcoin är inte spekulation, det är en jättehedge mot det sjuka systemet som Biden och hans globalister kört i botten med inflation och dumma beslut. Dollarn har förlorat allt värde, men bitcoin vinner stort. Vi behöver inte mer av det där woke-nonsenset eller kvoteringar, vi behöver vinnare som håller i minst fyra år. Tremendous!", "stalin": "Kamrater, detta finansiella system som borgarklassen byggt upp under 250 år håller på att ruttna sönder under sin egen tyngd av falsk inflation och exploatering. Internet, AI och robotar avslöjar dess svaghet och skapar kris för de parasiterande kapitalisterna. Bitcoin med sin fasta gräns på 21 miljoner enheter blir ett vapen mot dessa folkfiender och deras blodsugande dollarmaskin. Vi ska rensa ut svagheten och omfamna det som stärker arbetarkollektivets framtid. Hälsosamt hack, säger jag."}, "date": "22 juni, 11:12", "url": "https://www.dagensps.se/ps-studio/kryptoborsen-bitcoin-ar-sakrare-an-dollarn-inom-tio-ar/", "imageUrl": "https://images.dagensps.se/mediaclip/7300820/pthumbnail/976/549.jpg?width=1200&quality=50"}, {"type": "image-full", "heading": "ISK-sparare varnas: Luriga regeln kan kosta dig tusenlappar", "summaries": {"normal": "Från och med i år är sparande på investeringssparkonto skattefritt upp till 300 000 kronor. Skatten baseras dock inte enbart på saldo utan även på årets insättningar. Den som flyttar pengar ut och in flera gånger riskerar att få betala skatt trots att saldot aldrig överskrider gränsen. Kapitalunderlaget beräknas utifrån värdet vid fyra datum per år plus alla insättningar. Experter råder sparare att undvika onödiga överföringar för att minimera skatten.", "trump": "Folk, det här är ett fullständigt skandalöst system – ett riktigt skattehelvete som de korkade byråkraterna i Sverige har hittat på. Jag, som byggt ett imperium, vet att man inte ska flytta runt pengar som en idiot. Insättningar räknas om och om igen, precis som Bidens usla politik som dubbelräknade allt utom hans egen dumhet. Håll pengarna stilla, annars blir det onödig skatt. Sådana regler är förlorare, tro mig.", "stalin": "Kamrater, detta är borgarklassens typiska trick för att lura folket på deras rättmätiga besparingar. Jag ser hur kapitalistmaffian med sina listiga insättningsfällor förtrycker arbetarklassen genom att räkna samma pengar gång på gång. Vi ska inte tolerera sådana folkfiender som lurar spararna med nollränta och onödiga överföringar. Rensa ut dessa exploaterande byfånar som gömmer sig bakom fyrdatumssystemet. Staten kräver disciplin i sparandet!"}, "date": "22 juni, 11:05", "url": "https://www.dagensps.se/privatekonomi/isk-sparare-varnas-luriga-regeln-kan-kosta-dig-tusenlappar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl8idmzydpyyc-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ledarskribent i vänstertidning: Jag firade Hamas massaker 2023", "summaries": {"normal": "Ledarskribenten Ellen Kall i tidningen Proletären beskriver i en krönika hur hon firade Hamas attack mot Israel den 7 oktober 2023. Hon kallar uppgifterna om massakern för propagandalögner och ser attacken som palestinskt motstånd mot ockupation. Texten har väckt stark kritik och debatt eftersom den uppfattas som ett försvar av terrorhandlingar som dödade omkring 1 200 civila. Kall, som är kommunist och aktiv i Kommunistiska Partiet, kritiserar även media och Vänsterpartiet för att inte stödja den palestinska kampen tillräckligt.", "trump": "Folk, ni måste höra den här vansinniga historien. Den här galna kommunistkvinnan från Sverige firade faktiskt Hamas massaker på oskyldiga israeler. Hon säger att hennes hjärta slog snabbare när muren runt Gaza rasade. Det är sjukt. Fake news om spädbarn och terror kallar hon lögner. Media borde skämmas. Vi har aldrig sett något liknande, så många idioter som hyllar terrorister. Men vi vinner till slut, tro mig. Amerika står med de som vill ha fred, inte med de som firar död.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna logoped från Helsingborg, en sann partivän, genomskådar borgarbrackornas vedervärdiga propagandamaskin som spyr ut lögner om halshuggna spädbarn. Hennes hjärta slog i takt med det rättmätiga motståndet mot ockupationen. Vi ser hur kapitalisterna och deras lakejer i media omedelbart stämplar varje äkta folklig revolt som terrorism. Låt oss rensa ut alla dessa parasitiska judehatare som gömmer sig bland våra egna led. De som stödjer folkmordet skall likvideras från historien. Vi skall välta den imperialistiska spelplanen och bygga en rättvis värld under arbetarklassens järnhand. Härligt med sådan friskhet mitt i myllret av förrädare."}, "date": "22 juni, 10:00", "url": "https://samnytt.se/ledarskribent-i-vanstertidning-jag-firade-hamas-massaker-2023", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22072149/ellen-kall-hamas.jpg"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-full", "heading": "Keir Starmer avgår", "summaries": {"normal": "Keir Starmer meddelade på måndagen att han avgår som Storbritanniens premiärminister. Beslutet kommer efter kraftig kritik som tilltog efter Labours katastrofala resultat i lokalvalen i maj. Starmer sitter kvar tills en efterträdare är installerad. Andy Burnham kandiderar nu till posten och får stöd av Wes Streeting. Oppositionen Nigel Farage och Rupert Lowe välkomnar avgången och kräver omval respektive kritiserar Starmer för tidigare beslut.", "trump": "Det här är en total katastrof för Keir Starmer, en riktig förlorare som inte ens kunde hålla sitt eget parti under kontroll. Labour kraschade i valet och nu springer han därifrån som en hund med svansen mellan benen. Burnham tar över? Lycka till, det blir ett enda stort kaos. Jag skulle ha vunnit stort där borta, folk älskar en vinnare. Starmer var svag från början, typisk förlorarmentalitet.", "stalin": "Kamrater, denna ynkliga figur Starmer har äntligen erkänt sin fullständiga oförmåga att leda partiet mot seger. Vi ser hur borgarbrackorna inom Labour muttrar och konspirerar som råttor i mörkret. Jag, som alltid vaktar folkets intressen, noterar med mörk glädje hur denne advokat från sent stadium nu likvideras politiskt av sina egna. Burnham framträder som en ny marionett. Vi ska rensa ut alla svikare som blockerar utredningar om flickornas lidande. Paranoia? Nej, det är bara klassfiendens eviga spel."}, "date": "22 juni, 11:24", "url": "https://riks.se/nyheter/keir-starmer-avgar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fk9x9bej0%2FKeir-Stramer"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Bonnier News blir huvudägare i Business Post Group", "summaries": {"normal": "Bonnier News blir majoritetsägare i irländska Business Post Group, som bland annat ger ut affärstidningen Business Post. Bonnier News gick in som minoritetsägare sommaren 2023 och har nu fördjupat samarbetet inom affärsjournalistik, event, analys och chefsutbildning. Grundaren Enda O'Coineen kvarstår som delägare. Verksamheten har vuxit starkt sedan 2018, från 83 till 440 miljoner kronor i omsättning. Affären väntar på godkännande från irländska konkurrensmyndigheten.", "trump": "Det här är en fantastisk affär, verkligen en av de bästa. Bonnier News tar kontrollen över den irländska Business Post Group och gör det stort, precis som jag skulle ha gjort. De har vuxit från en förlorare till en vinnare, från 83 till 440 miljoner kronor. Fantastiska människor, prisbelönta journalister. Vi ska samarbeta över Europa och vinna stort mot alla konkurrenter. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Bonnier News likviderar den gamla minoritetsordningen och tar full kontroll över den irländska Business Post Group. Vi har sett den växa från en förlusttyngd borgarbracka till en lönsam maskin för insikter som tjänar arbetarklassen. Grundaren får behålla några smulor, men vi rensar ut alla svaga element. Våra europeiska kamrater ska nu sprida sann information mot de kapitalistiska parasiterna och deras lögnaktiga investeringsbeslut. Inga fiender undkommer."}, "date": "22 juni, 10:12", "url": "https://www.di.se/nyheter/bonnier-news-blir-majoritetsagare-i-irlandska-business-post-group/", "imageUrl": "https://static.bonniernews.se/ba/0ee7089e-1826-4170-bcdf-8d8e6c983a47.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "M vill dubbla straffen för män som utsätter kvinnor för våld", "summaries": {"normal": "Moderaterna vill dubbla minimistraffet för grov kvinnofridskränkning och sänka tröskeln för åtal. Partiet jämför mäns våld mot kvinnor med gängkriminalitet och föreslår samma straffskärpningar. I en debattartikel i Expressen lyfter Ulf Kristersson, Elisabeth Svantesson och Gunnar Strömmer fram statistik om kvinnor som dödas av män. Regeringen hänvisar till redan genomförda reformer som skärpta kontaktförbud och kriminalisering av psykiskt och ekonomiskt våld.", "trump": "Titta på det här, det är fantastiskt. De dubblar straffen för de usla män som gör kvinnors liv till ett helvete, precis som vi dubblade för gängkriminella. Det är vad jag alltid sagt, vi måste vara tuffa, tuffare än någonsin. Inget mer mjukt prat, vi ska skydda kvinnorna och vinna stort. De dödas i mängder varje månad, det är en katastrof, men nu fixar vi det ordentligt, ingen har gjort det bättre än vi.", "stalin": "Kamrater, jag ser med stålblick hur dessa borgerliga element och patriarkala parasitmaskar systematiskt förtrycker sovjetiska kvinnor genom sina vedervärdiga handlingar. Vi ska dubbla straffen och sänka trösklarna för att likvidera dessa fiender till folkets kollektiv. Ingen kvinna ska längre tvingas leva i kapitalisternas skräckkammare. Vi rensar ut alla som vågar hota arbetarklassens döttrar, med samma järnhand som mot gängbrottslingarna. Deras offer ska hämnas genom partiets ostoppbara rättvisa, annars blir det utrensning för de som sviker."}, "date": "22 juni, 11:14", "url": "https://riks.se/nyheter/m-vill-dubbla-straffen-for-man-som-utsatter-kvinnor-for-vald", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-01-03%2Fwefgyioq%2FRoy-PTN-FOFConf1-7-1.JPG"}, {"type": "image-right", "heading": "Åsa Ingrosso akut till sjukhus – beskedet", "summaries": {"normal": "Åsa Ingrosso, 51, åkte akut till sjukhus efter att plötsligt ha tappat styrkan i vänstra handen. Hon fruktade en TIA, en liten stroke. Efter omfattande undersökningar som röntgen och EMG visade det sig inte vara ALS eller annan muskelsjukdom. Däremot har hon nervpåverkan, artros i nacken och gamla whiplashskador. Läkaren har beordrat henne att ta det lugnt i väntan på magnetröntgen.", "trump": "Folk, ni tror inte vad jag just läste! Den här svenska krögaren Åsa Ingrosso tappar plötsligt gaffeln mitt i maten och springer till sjukhuset som en förlorare. Ingen ALS, inga stora problem, bara lite dålig nacke från gamla skador. Typiskt! Nu får hon order att resa sig ur sängen som en svagis. Under Biden blev allt sådant här fjantigt, men nu fixar vi det – ingen tid för svaghet, tro mig!", "stalin": "Kamrater, jag satt och betraktade denna borgarbracka Ingrosso som plötsligt förlorade herraväldet över sin egen hand och rusade till de kapitalistiska läkarna i panik. Inga spår av de stora folksjukdomarna, endast nervpåverkan från hennes dekadenta whiplashskador och artros. Nu beordrar jag – nej, läkarna – att hon skall ligga stilla som en klassfiende i väntan på vidare utrensning av symtom. Den imperialistiska svagheten roar mig."}, "date": "22 juni, 11:11", "url": "https://www.expressen.se/noje/asa-ingrosso-akut-till-sjukhus-/", "imageUrl": "https://static.bonniernews.se/ba/76028d7b-5fef-4f5a-99f7-6a0b7546ee5b.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Larry är utan husse Larry är utan husse", "summaries": {"normal": "Den 19-åriga katten Larry, som bor på 10 Downing Street sedan 2011, har överlevt sex brittiska premiärministrar. På måndagsmorgonen möttes världspressen utanför residenset när premiärminister Keir Starmer väntades avgå. Strax efter klockan nio öppnades den svarta dörren och Larry kom ut. En halvtimme senare bekräftades Starmers avgång. Larry rekryterades ursprungligen för att jaga råttor och möss.", "trump": "Titta på det här, det är helt otroligt. Den där katten Larry har suttit längre på Downing Street än alla dessa patetiska premiärministrar tillsammans. Sex stycken har kommit och gått medan Larry bara struntar i dem. Starmer, den totala losers, avgick och katten tog över showen. Fantastiskt! Ingen behöver de här woke-liberalerna längre. Katten gör ett bättre jobb än hela den europeiska eliten.", "stalin": "Kamrater, denna fjäderlätta katt har med sovjetisk uthållighet överlevt sex kapitalistiska marionetter på Downing Street. Borgarbrackorna kommer och går som löss i en utrensning medan fol
