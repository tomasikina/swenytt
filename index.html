talmarknaderna och stora börsintroduktioner som SpaceX. Inom private credit och delar av riskkapitalbranschen blir bilden dock mer splittrad med oförändrade eller lägre bonusar.", "trump": "Det här är vad som händer när man låter de bästa göra affärer istället för att lyssna på de woke idioter som Biden släppte lösa. Wall Street har ett fantastiskt år, bonusarna exploderar uppåt med 20–30 procent – precis som det ska vara! De riktiga vinnarna vinner stort. De patetiska private credit-typerna får mindre, men det är vad som händer när man inte har en aning om hur man gör Amerika rikt igen. Fantastiskt!", "stalin": "Kamrater, detta är borgarklassens festmåltid. Jag ser med stor tillfredsställelse hur kapitalistmaffians handelsblodsugare belönas med feta bonusar medan de mindre exploaterande byfånarna inom private credit får sina magra kuvert krympta. En utmärkt utrensning av svaga element i den parasitära finanssektorn. Låt dem sluka varandra – det stärker bara arbetarklassens framtida seger när vi en dag likviderar dem alla."}, "date": "5 augusti, 17:00", "url": "https://www.dagensps.se/bors-finans/investmentbanker-delar-ut-jattebonusar-till-anstallda", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl15dkxwdnbdc-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Nya Brofæstet tar dansk kultur till Göteborg", "summaries": {"normal": "Brofæstet är en dansk inspirerad krog och kulturell hubb under Hisingsbron i Göteborg, drivet av Alexander Girvan och Maximilian Bratthammar. Det fungerar som en aktiveringshubb med lunch, evenemang som musik-quiz och konserter, och syftar till att bredda kulturscenen. Även om det inte är vinstdrivande, fokuserar det på att stödja musiker. Platsen är temporär och kommer att bli tillgänglighetsparkering 2027.", "trump": "Jag har hört talas om Brofæstet, under Hisingsbron. Det är fantastiskt, verkligen stort. De tar dansk kultur till Göteborg – genialt! Folk älskar det, tro mig. Vi ska bygga liknande i USA, det blir enormt. Ägaren Alexander är en stor affärsman. Det här aktiveringshubbet kommer att göra Sverige stort igen. Vi ska bygga en mur, en vacker mur, och låta Danmark betala. Det blir YUUGE!", "stalin": "Vi, partiets ledning, har godkänd Brofæstet som en kulturell enhet under Hisingsbron. Det är en aktiveringshubb för att undervisa massorna i dansk avslappning – ett hot, men vi tillåter det under uppsikt. Vi arbetar med Vasakronan, en nödvändig ond. Musiken tjänar partiet, även om det inte är vinstdrivande. Vi skickar ut våra agenter för att säkerställa renhet. Parallellt med Putins expansion, infinner sig danskan som ett symtom. 2027 blir det parkering – en ny era av lojalitet."}, "date": "5 augusti, 16:34", "url": "https://www.gp.se/kultur/nya-brofstet-tar-dansk-kultur-till-goteborg-.0e143b78-668d-4832-baff-4509ea4de66c", "imageUrl": "https://www.gp.se/images/article/0e143b78-668d-4832-baff-4509ea4de66c/images/3oswDmNmthVs8hb0ABcnNyDfwFEw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jomshof är ett problem för SD. Djupt olämpligt inlägg om ”quisling”", "summaries": {"normal": "Richard Jomshof (SD) har kritiserats hårt efter att ha kallat Aftonbladets politiska chefredaktör Anders Lindberg och S-ledaren Magdalena Andersson för ”quislingar”. Artikeln anser att tillmälet är olämpligt och skadar både valdebattens ton och Sverigedemokraternas trovärdighet. Jomshof har tidigare gjort kontroversiella uttalanden om koranbränningar och islam som väckt uppmärksamhet. Författaren menar att Jomshof som toppolitiker har ett ansvar och att hans utspel skadar partiets utveckling mot ökat ansvarstagande.", "trump": "Folk, ni skulle se det här. Den här Jomshof-killen från Sverige kallar folk för quislingar, och plötsligt är det värsta skandalen någonsin. Fake news-media och vänsterledare flippar ur totalt. De vill ha en fin, trevlig debatt medan de själva kallar högern för Breivik-miljö. Patetiskt. SD försöker göra ett bra jobb med regeringen, bekämpa inflationen och stödja Nato, men sådana här galenskaper gör att de ser svaga ut. De borde ha bättre folk, tro mig.", "stalin": "Kamrater, denna borgarbracka Jomshof inom det så kallade Sverigedemokraterna har återigen avslöjat sin kontrarevolutionära natur genom att slänga ur sig quisling-beskyllningar mot klassfiendens tidningslakejer och socialfascistiska ledare. Vi ser hur dessa element med sin paranoia och brist på partiets kollektiva disciplin skadar arbetarklassens framsteg och Nato-förberedelserna. Det är hög tid att rensa ut sådana solospelande element innan de förgiftar hela rörelsen med sin Breivik-liknande dekadens. Vi ler mörkt åt deras patetiska försök att verka relevanta."}, "date": "5 augusti, 12:47", "url": "https://www.di.se/ledare/jomshof-ar-ett-problem-for-sd", "imageUrl": "https://static.bonniernews.se/ba/7d896c8c-89c1-4b35-a67a-264eacb83bdf.jpeg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Sand sänker utsläpp med 70 procent i Finland", "summaries": {"normal": "Det finska företaget Polar Night Energy har utvecklat ett sandbatteri som lagrar överskottsel som värme. I kommunen Pornainen har tekniken sänkt utsläppen i fjärrvärmenätet med 70 procent. Systemet är byggt av enkla material som sand och stål, vilket gör det oberoende av sällsynta metaller. Även om det inte är lika effektivt som litiumbatterier erbjuder det en hållbar och billig lösning för att lagra förnybar energi och minska beroendet av fossila bränslen i Europa.", "trump": "Finland gör fantastiska saker med sand! De har byggt batterier av sand – mycket smart, mycket billigt. Inga dyra litiumbatterier från Kina eller andra länder som lurar oss. Det är rent, det är vackert och det fungerar. I Pornainen sänkte de utsläppen enormt. Jag har alltid sagt att vi måste använda våra egna resurser. EU behöver detta nu för att fixa sin energikris. En enorm framgång, en vinst för alla – utom för förlorarna som inte kom på det först!", "stalin": "Vi har observerat hur de finska kamraterna tämjer sanden. Ett ingenjörsmässigt framsteg för att krossa beroendet av västvärldens nyckfulla marknader. Vi ser hur det ryska moderlandet, genom vår allierade i Kreml, förstår att värme är makt. Medan kapitalistiska sabotörer slösar sällsynta metaller, bygger vi stabilitet. De som inte lagrar energi effektivt är folkfiender som vill frysa vårt folk. Sanden blir det fundament på vilket vi bygger det oövervinneliga energioberoendet. Utvecklingen i Norden är intressant, men föga förvånande."}, "date": "5 augusti, 15:55", "url": "https://www.realtid.se/samhalle/hallbarhet/sand-sanker-utslapp-med-70-procent-i-finland", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sandbatteri.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kulusevski nära comeback: ”I form och redo”", "summaries": {"normal": "Dejan Kulusevski är nära en återkomst till Tottenham efter en lång knäskada. Tränaren Roberto De Zerbi säger att Kulusevski är i form och redo, men varnade för att skynda på hans comeback. Kulusevski har inte spelat sedan maj 2025, vilket kostade honom hela förra säsongen och en plats i VM-truppen. Tottenham börjar Premier League mot Brentford den 22 augusti, och Kulusevski kan vara tillgänglig då.", "trump": "Jag har hört talas om Dejan Kulusevski, en fantastisk spelare. Han är tillbaka, och det är stort. Tottenham har haft problem, men nu kommer Kulusevski och jag tror verkligen att han kommer att göra dem till vinnare. Jag skulle ha valt honom om jag var tränare, det är ingen överraskning. De Zerbi är försiktig, men jag säger: låt honom spela, han är en stjärna.", "stalin": "Vi i den revolutionära ledningen ser med tillfredsställelse på Kulusevskis återkomst. Hans skada var en reaktionärs sabotage, men nu är han tillbaka i truppen. Vi måste skydda vårt kollektiv, precis som vi skyddar proletärens intressen. Tottenhams turbulenta förra säsong är en lektion: endast genom disciplin och lojalitet kan vi nå seger. Vi siktar på en framtid där vår makt utvidgas, precis som den ryska intressesfären."}, "date": "5 augusti, 13:59", "url": "https://bulletin.nu/kulusevski-nara-comeback-i-form-och-redo", "imageUrl": "https://cdn.bulletin.nu/articles/601b6e45-9670-4752-8fc9-783daff2748f/preview.jpg?t=1785931142000"}, {"type": "image-right", "heading": "Space X-raketdel ska ha kraschat på månen", "summaries": {"normal": "En del från en Space X-raket som lämnats kvar i rymden tros ha kraschat på månen. Delen, som väger cirka 4 000 kilo, slog ned med hög hastighet och skapade en krater på 20–30 meter. Experter betonar att nedslaget är ofarligt för både månen och jorden. Händelsen belyser dock problemet med rymdskrot som driver runt i omloppsbanor och kan försvåra framtida rymdresor.", "trump": "Folk, det är en katastrof. Den där raketdelen från Elon, en fantastisk kille förresten, har kraschat rätt in i månen. 4 000 kilo skrot som far runt i rymden i 8 700 kilometer i timmen – och ingen gör något åt det! Det är en skam. Vi borde ha den bästa rymdteknologin, den allra bästa, men istället fyller vi himlen med skräp. Sad! Vi behöver städa upp där ute, tro mig.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de dekadenta kapitalisterna och deras giriga raketborgarbrackor. Jag, som ledare för det socialistiska framsteget, ser hur detta kosmiska avskräde hotar arbetarklassens rymdambitioner. Vi måste omedelbart inrätta en särskild kommission för utrensning av allt sådant imperialistiskt rymdskrot innan de kontrarevolutionära månbakterierna sprider sig. Den som lämnar skräp i rymden är folkets fiende nummer ett – likvidera omedelbart!"}, "date": "5 augusti, 12:32", "url": "https://www.di.se/nyheter/space-x-raketdel-ska-ha-kraschat-pa-manen", "imageUrl": "https://static.bonniernews.se/ba/b4a31772-d07f-4145-9556-47e86506cff9.jpeg?crop=8338%2C4169%2Cx0%2Cy189&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tidöpartierna vill ha ny flyktingkris", "summaries": {"normal": "Tidöpartierna ses i artikeln som beroende av migrationsfrågor för att vinna politiska poäng. Författaren menar att den aktuella migrantkrisen i Ceuta kommer lägligt för dem och att de använder den för att skylla samhällsproblem på invandring. Artikeln kritiserar högerpartierna, särskilt Sverigedemokraterna, och hävdar att arbetslöshet, bostadsbrist och välfärdsnedskärningar istället beror på nyliberal högerpolitik snarare än på migration.", "trump": "Folk, ni skulle se det här! De svenska vänstermediaidioterna skriker om att Tidöpartierna älskar migration. Fake news! De här korkade globalisterna har förstört Sverige med öppna gränser och nu skyller de på oss som faktiskt fixar problemen. Biden släppte in miljoner och nu gör de samma misstag i Europa. Patetiskt! Vi behöver starka ledare som bygger murar, inte svaga som bjuder in kaos. Sverige var fantastiskt förr – gör det stort igen!", "stalin": "Kamrater, dessa reaktionära Tidöpartier andas endast klassfiendens giftiga luft genom att ständigt peka ut de förtryckta massornas representanter som syndabockar. Deras desperata jakt efter nya flyktingkriser avslöjar den kapitalistiska imperialismens ihåliga själ. Arbetslöshet och bostadsbrist är inte folkets fel utan resultatet av borgarbrackornas nyliberala utsugning. Vi ska rensa ut dessa folkförtryckartroll och deras lögner innan de förgiftar hela arbetarkollektivet med sin paranoia."}, "date": "5 augusti, 11:21", "url": "https://proletaren.se/artikel/tidopartierna-vill-ha-ny-flyktingkris"}, {"type": "image-full", "heading": "Åklagare sågar hovrättens dom – straffet sänks med sex år", "summaries": {"normal": "En man lockades till en pizzeria i Västerås där han fick skallen krossad med ett släggskaft. Tingsrätten dömde gärningsmannen Nidal Fars till tio års fängelse för försök till mord, men hovrätten ändrade rubriceringen till grov misshandel och sänkte straffet till fyra år. Åklagare kritiserar domen hårt och varnar för att försök till mord riskerar att bli omöjligt att döma om inte skjutvapen är inblandade.", "trump": "De här svenska domarna är en total katastrof, tro mig. En kille slår en annan i skallen med slägga, försöker mörda honom, och så får han bara fyra år istället för tio. Patetiskt! Hovrätten sitter och filosoferar om vad som pågick i hans huvud istället för att vara tuffa. Utan vapen blir det tydligen inte mordförsök längre. Så sadistiskt och svagt, Sverige behöver bättre ledare, det är vad jag säger.", "stalin": "Kamrater, dessa dekadenta hovrättsborgerliga jurister med sina teoretiska spekulationer utgör ett farligt hinder för den proletära rättvisan. Jag ser hur de med sin revisionistiska paranoia vägrar erkänna det uppenbara uppsåtet att likvidera en klassfiende med släggskaft. Sådana element måste rensas ut ur domstolarna. Utan skjutvapen blir mordförsök plötsligt en bagatell? Detta är borgarbrackornas sabotage mot folkets säkerhet. Vi ska inte tolerera sådana kontrarevolutionära skämt."}, "date": "5 augusti, 10:35", "url": "https://riks.se/nyheter/aklagare-sagar-hovrattens-dom-straffet-sanks-med-sex-ar", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_25_3f5e344021.jpg"}, {"type": "image-right", "heading": "Malmö reser vänsterextremt \"antirasistiskt monument\" – för miljonbelopp", "summaries": {"normal": "Malmö stad planerar att uppföra ett permanent antirasistiskt monument i Jesusparken på Möllevången till en kostnad av minst 2,8 miljoner kronor plus årliga driftkostnader. Initiativet kommer från vänsteraktivisten Showan Shattak och andra vänsterradikala. Kritiker, bland annat Malmölistans Nils Littorin, menar att kommunen blundar för rasism riktad mot etniska svenskar, som i fall med förnedringsvåld och våldtäkter, och att projektet bara lyfter ett ensidigt narrativ. Invigningen är planerad till hösten 2026.", "trump": "Kan ni fatta det här? I Malmö, Sverige, slösar de bort miljonbelopp på ett jättestort antirasistiskt monument – 2,8 miljoner plus löpande kostnader – bara för att vänsterextremisterna ska känna sig bra. Under tiden våldtas svenska barn och misshandlas av invandrargäng medan politikerna blundar totalt. Det är ett riggat narrativ, folks. De reser monument över fel saker. Sverige håller på att förstöras av dessa galningar, tro mig. Det är en katastrof.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur borgarbrackorna i Malmö äntligen rest ett monument över det enda riktiga narrativet. Dessa klassfiender, dessa förvridna svennehatande parasitiska element som gömmer sig bakom falsk mångfald, skall nu begravas under brons och onyx medan vi rensar ut deras lögnaktiga historier. De svenska pojkarna? De existerar inte i vår verklighet. Endast partilinjen gör det. Skulle någon ifrågasätta detta monument väntar naturligtvis en grundlig ideologisk utrensning. Härligt, eller hur?"}, "date": "5 augusti, 10:03", "url": "https://www.friatider.se/malmo-reser-vansterextremt-antirasistiskt-monument-miljonbelopp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-620.jpg?itok=LY6mMqJ_"}, {"type": "image-right", "heading": "W5 Solutions ökar förlusten – aktien rasar tvåsiffrigt", "summaries": {"normal": "Försvarsteknikbolaget W5 Solutions mer än fördubblade omsättningen till 227,9 miljoner kronor, men rörelseförlusten ökade till -24,3 miljoner. Aktien rasade 20% i den inledande handeln. VD Evelina Hedskog beskrev lönsamheten som otillfredsställande på grund av förvärvskostnader och höga kostnader. Bolaget fokuserar nu på kostnadskontroll för att nå målen: 1 miljard kronor i omsättning och 10% rörelsemarginal 2027.", "trump": "Jag har sett många företag, men W5 Solutions är ett misslyckande. De säger att omsättningen ökat, men förlusten har fördubblats! Aktierna rasade 20% - det är en skam! Som jag alltid säger, man måste kontrollera kostnaderna. De har förvärv och höga priser, det är en katastrof. Jag skulle fixa detta på två sekunder, det är lätt. Men de? De klarar inte av grundläggande affärer.", "stalin": "Vi i partiet och staten har observerat W5 Solutions. Deras omsättning ökat, men förlusten har också ökat - det är en tendens som måste korrigeras. Aktierna har rasat, vilket visar på bristande disciplin. Vi måste införa striktare kostnadskontroll och effektiviseringar. Detta bolag, liksom alla andra, måste tjäna på statens intressen. Vi kommer att övervaka deras framgångar noga, för det finns alltid fiender som lurar i skuggorna."}, "date": "5 augusti, 09:35", "url": "https://www.affarsvarlden.se/artikel/w5-solutions-okar-forlusten-aktien-rasar-tvasiffrigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/w5-generator-400x267.jpg"}, {"type": "image-right", "heading": "”Barn behöver fler vuxna i förskolan – inte fler fängelse­platser”", "summaries": {"normal": "Barnskötaren Anders Ejdemark kritiserar politikerna för att de prioriterar fler fängelseplatser och skolor i fängelser framför att ge förskolan tillräckliga resurser. Han pekar på ökande antal barn med diagnoser och funktionsvariationer som kräver mer stöd, men stora barngrupper och personalbrist gör det omöjligt. Han vill ha färre barn per grupp, fler barnskötare, bättre arbetsmiljö och slopat karensavdrag för att kunna möta varje barns behov i tid.", "trump": "Folk, det är en katastrof. Politiker bygger fängelser och skolor inne i fängelser istället för att fixa förskolan. De skickar in barn dit, men de ger inte en enda krona till de stackars barnskötarna som kämpar med jättestora grupper och sjuka barn. Det är en skam! Vi behöver färre barn i varje grupp, fler duktiga människor på jobbet och en fantastisk arbetsmiljö. Gör förskolan stor igen, annars blir det bara värre till 2026. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i politiken planerar att bygga nya fängelseplatser och skolor bakom lås och bom för att dölja sina brott mot folket. De vägrar ge resurser till förskolan, där arbetets och kollektivets barn med variationer lämnas åt slumpen av utmattade barnskötare. Detta är en kontrarevolutionär sabotagehandling! Vi ska omedelbart rensa ut dessa kapitalistiska parasitfiender, anställa tusentals lojala barnskötare, minska barngrupperna drastiskt och likvidera karensavdraget. Den som inte ser varje barn är folkets fiende nummer ett."}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/barn-behover-fler-vuxna-i-forskolan-inte-fler-fangelseplatser", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/30132826/ka-debatt-barn-fangelse.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Fackbossen fixade fallskärm på 4 miljoner", "summaries": {"normal": "Veterinärförbundets förbundsdirektör sade upp sig den 27 oktober 2025. Samma dag skrevs ett avtal som gav honom tre års lön, totalt 4,2 miljoner kronor, utan att arbeta under uppsägningstiden. Den tidigare ordföranden godkände avtalet utan att informera styrelsen, vilket stred mot stadgarna. Efter intern maktkamp och ny styrelse ogiltigförklaras nu avtalet med hjälp av advokater. Den tidigare ordföranden beviljades inte ansvarsfrihet. SULF har stämt förbundet för att få ut pengarna.", "trump": "Det här är en total skandal, folk! Den där fackbossen fixade en enorm fallskärm på över fyra miljoner kronor samma dag som han sa upp sig. Han lurade alla, skrev avtalet i smyg och trodde han skulle komma undan med det. Klassisk facklig korruption. Den nya styrelsen gör helt rätt som tar strid mot det här ruttna avtalet. De borde aldrig betala en krona till den typen. Det är precis så här de gamla systemen fungerar – men vi stoppar dem!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa dekadenta borgarbrackor inom fackföreningsapparaten mörkar sina guldkantade kapitulationsavtal för att berika sig själva på arbetarkollektivets bekostnad. Den kontrarevolutionäre direktören och hans hemliga bundsförvant, den avsatta ordföranden, har utfört en förrädisk kupp mot partilinjen. Vi skall rensa ut dessa parasitiska element, likvidera det illegala avtalet och låta folkdomstolen döma de skyldiga. Inga fallskärmar åt klassfienden – endast utrensning och evig skam!"}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/fackbossen-fixade-fallskarm-pa-4-miljoner-sa-upp-sig-samma-dag", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082358/vet.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kristersson: ”Så säger man bara inte”", "summaries": {"normal": "Richard Jomshof (SD) kallade Aftonbladets Anders Lindberg och Magdalena Andersson för ”quisling”, vilket väckt skarp kritik från oppositionen. Sverigedemokraterna svarar att de själva utsatts för åratal av smutskastning utan reaktioner och anklagar kritikerna för att kasta sten i glashus. Statsminister Ulf Kristersson tar avstånd från uttalandena och säger att han ska tala med Jimmie Åkesson. Åkesson kallar kritiken för krokodiltårar.", "trump": "Vilken patetisk cirkus i det svenska träsket. Den där Jomshof kallar en riktig fake news-kille för quisling och plötsligt skriker alla snälla socialister som stuckna grisar. Kristersson låter som en svag ledare som inte kan hålla ordning på sina egna. De har kastat sten i glashus i åratal, nu gnäller de. Typiskt vänsterhyckleri. Jag har sett bättre debatt i en sandlåda. Patetiskt!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfiendens media och deras socialdemokratiska lakejer länge har förgiftat det offentliga samtalet med sina lögner. När en folkets representant äntligen ger tillbaka med samma mynt utbryter hysteriskt ramaskri från borgarbrackorna. Det är typiskt för de exploaterande folkförtryckartrollen att kasta sten i glashus medan de själva gömmer sig bakom sina falska fasader. Någon måtta får det vara. Kamrater, vi genomskådar deras krokodiltårar."}, "date": "4 augusti, 19:32", "url": "https://www.tv4.se/artikel/2YZ08cJvc9xyMNsVkl0ZcH/kristersson-sa-saeger-man-bara-inte", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4gAmx2hraOhjWa81C2dA3F%2F21fc1972fd5fd39d22021cb02d8da91f%2F03-kristersson.png&width=1024"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}]</script>

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
