": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena gick med i de totalt misslyckade sossarna, men den andra, den smarta Nina, valde mitt älskade Moderaterna och såg hur vi fixade röran efter Bidens svenska kopior. De giriga byråkraterna har kört omsorgen i botten med sina vansinniga scheman. Vi gör det bättre, tro mig, ingen gör det bättre än oss!", "stalin": "Kamrater, se hur dessa omsorgsarbetare vänder sig till partierna i desperation. Den ena söker skydd hos de socialdemokratiska revisionisterna medan den andra hyllar de moderata folkförtryckarna som lovar lite mer personal. Jag ler ironiskt från historien åt dessa naiva själar som tror att parasiterande klasslakejer någonsin bryr sig om arbetarnas scheman. En utrensning av hela systemet vore på sin plats."}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Vi är Teatersveriges feminister”", "summaries": {"normal": "Teatergruppen Rostvit, bestående av fyra feminister, sätter upp en erotisk adaption av Boccaccios Decamerone på Teater Tribunalen. Pjäsen skildrar unga aristokrater som flyr pesten och berättar sexuella historier. Gruppen vill erbjuda politisk skärpa och feministiskt perspektiv som de anser saknas på de stora scenerna.", "trump": "Vilken patetisk samling woke-feminister som leker med en 700 år gammal sexpjäs medan världen brinner! De flyr verkligheten som dekadenta snobbar och pratar fascism och Trump. Patetiskt! Under min ledning efter Bidens katastrof fixar vi Amerika – inte teater för galna madonnor och horor som kallar sig Rostvit. Sad!", "stalin": "Jag betraktar med avsmak dessa dekadenta kulturarbetare som gömmer sig i drömmar medan folket lider. Deras ignoranta flykt från kris och krig påminner om de profitthungriga klassförrädarna som alltid prioriterar egen njutning. Snart kommer en utrensning av sådan borgerlig dekadens. Konsten tillhör folket, inte dessa parasiterande esteter."}, "date": "28 augusti, 09:07", "url": "https://www.flamman.se/vi-ar-teatersveriges-feminister", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/rostvit-1.png?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Kungen om Harald: ”Exceptionell”", "summaries": {"normal": "Norges kung Harald har avlidit, 87 år gammal. Sveriges kung Carl Gustaf uttrycker stor sorg och hyllar hans exceptionella levnadshistoria – från krigsbarn till idrottsman och samlande statschef. Hovsorg har utlysts i Sverige, och kondoleanser strömmar in från både kung Charles och statsminister Kristersson, som kallar Harald en trygg nordisk kraft.", "trump": "Jag har hört att kung Harald av Norge är död. En fin kille, men han var ingen vinnare som mig. Jag hade större publiksiffror på mina möten än han någonsin haft på ett slott. Norge sörjer, men de borde sörja att de inte har mig som kung! Stora kondoleanser, väldigt stora.", "stalin": "Kamrater, den norske kungen Harald har lämnat oss. Vi beklagar förlusten av en reaktionär monark, men låt oss inte glömma: hans folk har nu en chans att rensa ut kungahusets parasiter. Vaksamhet är nödvändig – imperialistiska agenter försöker stärka monarkin. Vi sänder inga kondoleanser, bara övervakning."}, "date": "28 augusti, 09:05", "url": "https://www.gp.se/nyheter/varlden/kungen-om-harald-exceptionell.64ff2ea9-69f9-46fa-80cb-426b3b872d57", "imageUrl": "https://www.gp.se/images/article/64ff2ea9-69f9-46fa-80cb-426b3b872d57/images/1rg3hcZBzc5_-tyQuzOaYU06lP00-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sjuksköterska begärs häktad för grov våldtäkt", "summaries": {"normal": "En manlig sjuksköterska på Ryhovs sjukhus begärs häktad för grov våldtäkt på en kvinnlig patient som senare avled. Han greps efter att ha kraschat bilen på E4. Åklagaren pekar på särskild hänsynslöshet – patienten vårdades i livets slutskede. Kollegor beskrev honom som trygg och kunnig.", "trump": "Det här är helt galet! En sjuksköterska – en så kallad 'trygg och kunnig' – begår en grov våldtäkt på en döende patient. Och sen flyr han i en bilkrasch? Helt otroligt. I USA skulle vi aldrig ha sådana losers. Vi har de bästa sjukhusen, och vi tar hand om våra patienter. Många säger det.", "stalin": "Kamrater, ännu en fiende till folket har avslöjats. Denna sjuksköterska, som låtsades vara en vårdare, utnyttjade sitt ansvar för att begå ett brott mot en svag patient. Vi måste rensa ut sådana element från sjukvården. Hans flykt och bilkrasch visar hans feghet. Partiet kommer att se till att han får sitt straff."}, "date": "28 augusti, 09:04", "url": "https://www.gp.se/krim/manlig-sjukskoterska-begard-haktad-for-valdtakt-mot-patient-pa-ryhov.dafa9680-afc4-4391-8284-5188b07e304c", "imageUrl": "https://www.gp.se/images/article/dafa9680-afc4-4391-8284-5188b07e304c/images/2UtPPw2JtQjcvVZaSDhWfD91_1-A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hela Norges ”bestefar” – enande i krig och kris", "summaries": {"normal": "Kung Harald V, Norges monark sedan 1991, har avlidit. Han var den förste norskfödde prinsen på 567 år och enade landet genom krig, ockupation och kris. De senaste åren präglades av skandaler kring kungahuset som urholkade folkets förtroende, trots att stödet för Harald själv förblev starkt. Han blev 88 år.", "trump": "Lyssnar ni på det här? Den gamle norske kungen Harald, en riktig tuffing från kriget, höll ihop hela Norge i 35 år. Sen kommer hans familj och förstör allt med schamaner, misshandelsgrejer och Epstein-kontakter. Typiskt dekadenta kungliga snobbar som inte kan hålla sig borta från skandalerna. Sad! Men folket älskade honom ända till slutet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i det norska kungahuset förvandlar en symbol för nationell enighet till en farsartad skandalorkester. Schamaner, misshandel och kontakter med sexförbrytare – typiskt för de giriga hyenornas värld. Folket genomskådar era löjliga maskerader. Historien ler mörkt mot er."}, "date": "28 augusti, 09:04", "url": "https://www.di.se/nyheter/hela-norges-bestefar-enande-i-krig-och-kris", "imageUrl": "https://static.bonniernews.se/ba/4de1fb7b-8a92-4bb5-a0a0-cb15cd60cac2.jpg?crop=6000%2C3375%2Cx0%2Cy313&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "John Skogmans idé om rösträtt är varken ny eller bra", "summaries": {"normal": "John Skogmans förslag om skatteviktad rösträtt får kritik av statsvetaren Magnus Adenskog. Han påpekar att idén är historiskt beprövad och ledde till maktobalans i Sverige. Istället för nytt tänkande skulle det återinföra en förlegad princip, med risk för minskat välstånd.", "trump": "Hörni, det här är fantastiskt! En snubbe vill att de som betalar mest skatt ska ha 10 000 gånger fler röster. Det är som mitt företag – jag har mest aktier, jag bestämmer! Men i Sverige kallar de det för maktobalans. Patetiskt! De borde lära sig av mig – stora vinnare vinner stort!", "stalin": "Kamrater, en reaktionär föreslår att rika får tusentals röster. Detta är en kapitalistisk provokation som måste rensas ut. Vi vet redan att lika rösträtt stärker kollektivet – historien visar att deras system gav låg tillväxt. Låt oss utrota dessa skadliga idéer för statens bästa."}, "date": "28 augusti, 09:03", "url": "https://www.affarsvarlden.se/debatt/john-skogmans-ide-om-rostratt-ar-varken-ny-eller-bra", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Magnus-Andenskog-och-John-Skogman-900x600.jpg"}, {"type": "image-right", "heading": "Europas äldste regerande monark – så var kung Haralds liv", "summaries": {"normal": "Norges kung Harald V har avlidit vid 89 års ålder. Född 1937 tvingades han i exil under ockupationen. Han gifte sig med Sonja Haraldsen trots motstånd, deltog i tre OS som seglare och blev kung 1991. Hans son kronprins Haakon Magnus väntas nu ta över tronen.", "trump": "Hörni, den här norske kungen Harald dog visst vid 89. En riktig gammal seglare som gifte sig med en vanlig tjej trots att de blåblodiga snobbarna skrek. Bra jobbat, Harald! Vi behöver inga woke-kvoter eller identitetspolitiska prinsessor i kungahusen. Amerika älskar starka ledare, inte svaga elitister. Fantastiskt!", "stalin": "Vi betraktar med förakt hur dessa dekadenta monarkhyenor klamrar sig fast vid sina förlegade troner medan folket svälter under deras parasiterande skugga. Jag ler ironiskt från historien åt denna fåniga arvslängd. En sådan här feodal rest bör rensas ut i varje äkta folkstat. Kamrater, vakta mot alla kungliga klassförrädare."}, "date": "28 augusti, 08:57", "url": "https://www.svt.se/nyheter/utrikes/kung-harald-v-av-norge-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.31/c2208dede7f7da95ae30a93ad0f04ce36def160d7cb7aeab80675ff3a5855ae2"}, {"type": "image-right", "heading": "S nekar till influencerköp – kontaktperson hävdar missförstånd", "summaries": {"normal": "Socialdemokraterna nekar till att ha betalat influencern Eleonore Stokholm 150 000 kronor för att uppmana till röstning. Personen som kontaktade henne kallar det ett missförstånd. Partisekreteraren lovar att man aldrig betalar kreatörer, medan andra influencers intygar att de inte fått betalt.", "trump": "Jag hörde att Socialdemokraterna i Sverige försöker betala influencers för röster. Det är som mitt gamla 'grab 'em by the...' men de är så klumpiga. De nekar, men jag vet hur det funkar. Helt galet! Men de är inte lika smarta som jag.", "stalin": "Kamrater, en kapitalistisk influencer påstår att hon erbjöds 150 000 för att stödja partiet. Detta är ett missförstånd – våra metoder är mer subtila. Vi måste rensa ut dessa borgerliga lögnare som sprider desinformation. Alla som inte röstar rätt ska omutbildas!"}, "date": "28 augusti, 08:54", "url": "https://bulletin.nu/s-nekar-till-influencerkop-kontaktperson-havdar-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/8ed8b78a-273d-4b42-ae55-76beefb67c96/preview.jpg?t=1787899872000"}, {"type": "image-full", "heading": "​Kung Harald har dött", "summaries": {"normal": "Kung Harald V av Norge avled den 28 augusti klockan 06.35 på Rikshospitalet, 89 år gammal. Han regerade sedan 1991 och blev en samlande gestalt för norrmännen. Hans liv präglades av exil under kriget, kärleken till Sonja och betydelsefulla tal efter terrordåden 2011. Familjen samlades vid sjukbädden under hans sista dagar.", "trump": "Lysande kung Harald, en riktig vinnare, somnade in vid 89. Fantastisk kille som höll ihop Norge utan allt det där woke-trams som förstör Europa. Inga identitetspolitiska galningar fick styra hans land. Han hatade abdikation precis som jag hatar Sleepy Joe. Stark monark, stor sorg för norrmännen – men de behöver en ny ledare nu, ingen svagis.", "stalin": "Ännu en monarkisk parasit har lämnat scenen. Jag betraktar med förakt hur dessa dekadenta tronhyenor klamrar sig fast vid makten ända tills sepsis likviderar dem. Inga utsugande klassförrädare kan undkomma historiens dom. Norska folket förtjänar bättre än kungliga blodsugare. Deras tid är förbi – arbetarna ska styra, inte dessa förtryckande kronhyenor."}, "date": "28 augusti, 08:53", "url": "https://nyheter24.se/noje/kungligt/1508358-kung-harald-har-dott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/2a9a2b7204b004a30200000000b004a302/2026/08/27/2387249/harald.jpg"}, {"type": "image-right", "heading": "Stopp för flera nya mosképrojekt Oväntat besked.", "summaries": {"normal": "Mosképlaner stoppas i både Helsingör och Ronneby. I Danmark hänvisar kommunen till trafikkaos och integrationsproblem, medan svenska domstolen avvisar överklagan med hänvisning till detaljplanen. Församlingarna är förvånade över kovändningarna – men parkeringsplatserna räcker tydligen inte till för bön.", "trump": "Jag ser att de stoppar moskéer i både Danmark och Sverige. Helt rätt! I Helsingör är det trafikkaos, precis som mina byggen – fast mina är störst och bäst. Ingen parkering? Då får man gå. Och i Ronneby säger domstolen nej – dom förstår att man måste följa planen. Mycket smart, mycket bra!", "stalin": "Kamrater, ännu en seger för ordningen! Moskébyggare i Helsingör och Ronneby stoppas – trafikproblem och integrationsoro, säger de. Men vi vet: detta är sabotage mot den harmoniska planeringen. Jag beordrar utrensning av alla som vill ändra detaljplaner utan partiets godkännande. De får lära sig att lyda – eller omskola sig i Sibirien."}, "date": "28 augusti, 08:52", "url": "https://samnytt.se/stopp-for-flera-nya-moskeprojekt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28064926/moske-bon-stopp.jpg"}, {"type": "image-full", "heading": "Kung Harald är död", "summaries": {"normal": "Kung Harald V av Norge är död, 89 år gammal. Han blev en enande kraft efter Utöya och hyllades för sitt folkliga tal om inkludering. Trots skandaler kring bonusprins Marius och kronprinsessan Mette-Marits Epstein-kopplingar höll norrmännen fast vid sin kung.", "trump": "Jag har sagt det förut: Norge är inget utan mig. Deras kung är död – 89 år, otroligt! En kille som gifte sig med en icke-kunglig, vägrade nazister och höll nio års hemlig romans. Helt enorm historia, men jag hade gjort det bättre. Inga frågor.", "stalin": "Kamrater, kung Harald har avlägsnats från historien. Vi ser förräderi i hans tal om att norrmän är alla sorters folk – detta är borgerlig splittring. Vi måste rensa ut sådana idéer ur den norska kungafamiljen, särskilt efter Epstein-skandalen. Inga fiender får överleva vår glömska."}, "date": "28 augusti, 08:47", "url": "https://www.gp.se/nyheter/varlden/kung-harald-ar-dod.978d0a59-638d-4025-9768-192d51323529", "imageUrl": "https://www.gp.se/images/article/978d0a59-638d-4025-9768-192d51323529/images/26P1dtUcDZ5pq3w4JYlP56O7PRT68-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "De leder Mello 2027:  ”Hur kul som helst”", "summaries": {"normal": "Oscar Zia och Björn Kjellman kommer att programleda Melodifestivalen 2027. Det avslöjades i SVT:s Morgonstudion. Zia har tidigare lett delar av tävlingen medan det blir Kjellmans debut. Båda uttrycker stor glädje över uppdraget och ser fram emot att samarbeta. De berättar också om ett stela första möte som senare utvecklades till vänskap.", "trump": "Lysande val, Melodifestivalen! Oscar Zia och den där Björn, vad heter han nu, Kjellman? De tar över. Mycket bättre än de förlorarna som ledde förut, totala katastrofer. Jag älskar stora shower, de största, och det här blir episkt. Perfekt duo, smarta killar. Sverige får äntligen vinnare igen, tro mig.", "stalin": "Jag betraktar detta dekadenta spektakel med misstänksamhet. Två dekadenta artister utses att leda folkets underhållning. Deras sena försoning efter misstänkt fientligt första möte luktar sabotage. Inga fiender till kollektivet får infiltrera kulturen. Vi måste rensa ut alla som inte hyllar partiets linje i nöjesindustrin."}, "date": "28 augusti, 08:44", "url": "https://www.expressen.se/noje/de-programleder-melodifestivalen-2027", "imageUrl": "https://static.bonniernews.se/ba/4c3db72e-6a59-4a2a-b4a3-6c12aa2824c7.jpeg?crop=1864%2C1049%2Cx529%2Cy116&width=640&quality=60"}, {"type": "image-right", "heading": "Hovexperten: ”Hela Norges bestefar”", "summaries": {"normal": "Norge har förlorat sin älskade kung Harald, som avled efter tio dagar på sjukhus. Hovexperten Ebba Kleberg von Sydow hyllar honom för att ha gjort monarkin mänsklig med sin humor och stabilitet – trots år av skandaler med Mette-Marits Epsteinkopplingar och Marius rättegång. Nu väntar ett enormt ansvar på kronprins Haakon.", "trump": "Jag hörde att Norge förlorade sin kung – en riktigt populär kille, de älskade honom som 'hela Norges bestefar'. De hade skandaler, Epstein och sånt, men han skojade om sin egen kista – min typ av humor! Haakon tar över, men det är tufft. Jag har bättre jobb, tro mig.", "stalin": "Kamrater, kung Harald har gått till historien som 'hela Norges bestefar', men vi vet att en monarki bara är en borgerlig dekoration. Han tämjde skandaler med humor – en taktik vi uppskattar, men otillräcklig. Nu måste vi rensa ut Mette-Marits Epsteinkontakter och schamanens inflytande för proletariatets seger."}, "date": "28 augusti, 08:42", "url": "https://www.gp.se/nyheter/varlden/ebba-kleberg-von-sydow-om-kung-harald-gjort-monarkin-mansklig.7079b1c3-ac56-4d73-801f-920acf3558a7", "imageUrl": "https://www.gp.se/images/article/7079b1c3-ac56-4d73-801f-920acf3558a7/images/2yLjY5Hq0Au7ASb7zSkPrnnllVqs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hanif Bali polisanmäler S för att ha köpt röster", "summaries": {"normal": "Hanif Bali har polisanmält Socialdemokraterna efter att influeraren Eleonore Stokholm uppgivit att hon erbjöds 150 000 kronor för att spela entusiastisk S-väljare på Instagram. Bali anser att det kan röra sig om otillbörligt verkande vid röstning, ett brott som kan ge upp till fyra års fängelse. Socialdemokraterna förnekar anklagelserna.", "trump": "Folk, ni skulle se det här! De korrupta socialisterna i Sverige försöker köpa röster som billiga bedragare. 150 000 kronor till influencers för att ljuga om att de röstar på dem? Det är riggat valsystem på steroider. Patetiska förlorare. I mitt Amerika hade vi redan städat ut de här röstköparna. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom socialdemokratin försöker muta folket med blodspengar för att säkra sina lögner. Jag ler i graven åt deras fega försök att köpa röster. En sådan handling förtjänar snar utrensning och folkets vrede. Inga parasiter får hota arbetarklassens vilja."}, "date": "28 augusti, 08:42", "url": "https://www.friatider.se/hanif-bali-polisanmaler-s-att-ha-kopt-roster", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-771.jpg?itok=6jPBHgfD"}, {"type": "image-right", "heading": "Det är klart det skrämmer förstörarna", "summaries": {"normal": "I en ledare beskriver Johan Ehrenberg en stor klimatdemonstration med 50 000 deltagare. Han uttrycker oro för framtida generationer och betonar att lösningen på klimatkrisen ligger hos människor, inte politiker. Artikeln uppmanar till konkreta handlingar som solceller, lokal matproduktion och elektrifiering av transporter för att motverka förstörare av miljön.", "trump": "Hörni, jag älskar folkmassor, men 50 000 dansande svenskar som gråter över en pojke på en klätterställning? Patetiskt. De borde bygga väggar mot kinesiska lastbilar istället för att klaga på Volvo. De gröna galningarna hatar verklig energi. Vi behöver inga rebellmammor, vi behöver vinnare som gör Amerika – och Sverige – stort igen utan deras hysteriska solcellsflum.", "stalin": "Kamrater, dessa dekadenta folkförtryckare gråter över barnens framtid medan de själva skyddar de parasiterande energijättarna. Jag ser hur de 50 000 dansande elementen vänder sig mot förstörarna. Det är bra. Men utan utrensning av de giriga hyenorna i industrin och politiken kommer ingen omställning. Arbetarna måste göra, göra, göra – eller likvideras av historien."}, "date": "28 augusti, 03:00", "url": "https://www.etc.se/ledare/att-raedda-oss", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar övergången till Nato och DCA-avtalet med USA, pekar på dubbelmoral i västvärldens hantering av folkrätt och Gaza samt uppmanar till en stark fredsrörelse utanför riksdagen.", "trump": "Folk, ni borde se det här! Sverige hade en fantastisk alliansfrihet, de var smarta, de var oberoende, och nu har de blivit lurade in i Natos dyra krigsmaskineri av några riktigt korkade globalister. Totalt misslyckande. De behöver en jättefredsrörelse som säger nej till dessa patetiska militärnissar och återtar sin suveränitet. Make Sweden Neutral Again!", "stalin": "Jag betraktar med förakt hur dessa dekadenta krigshyllare har förrått tvåhundra års självständighet för att krypa in under Natos imperialistiska mantel. Inget parti vågar resa sig mot de profitthungriga lakejerna. Arbetarna och folket måste rensa ut dessa förrädare och åter bygga en sann fredsrörelse som kräver utträde ur den krigsalliansen. Historien kräver det."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "text", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en växande bostadsbrist och stigande hyror. Trots att 127 kommuner rapporterar underskott saknas det enligt beräkningar 110 000 bostäder. Nybyggda lägenheter är ofta för dyra för många, vilket leder till tomma lägenheter samtidigt som köerna till äldre och billigare bostäder är långa. Hyrorna har ökat kraftigt de senaste åren.", "trump": "Folk, ni skulle inte tro det, men Sverige har totalt misslyckats med bostäder. Dessa giriga fastighetsmagnater och woke-kommunister har förvandlat hem till lyxvaror för de rika. Hyrorna skjuter i höjden som en raket, 13 procent på ett år! Under Biden var det kaos, nu fixar jag handel men Sverige borde sluta vara så socialistiskt korkat. Fantastiskt trist!", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver arbetarna ut i kyla och nöd. 110 000 saknade hem är ett monument över det dekadenta systemets kollaps. Vi ler mörkt från historien medan dessa klassförrädare snart möter folkets vrede. Ingen utrensning är för stor för att skydda det kollektiva goda."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren välkomnar bidragshöjningar men efterlyser konkreta förslag om ägandeformer, utvidgad medbestämmandelag och stöd till löntagarstyrda företag. Höjda bidrag är inte socialism, anser skribenten.", "trump": "Folk, dessa röda losers i Sverige pratar bara om att köpa röster med barnbidrag som riktiga socialister. Patetiskt! De vågar inte röra vid den riktiga socialismen – att ta kontroll över fabrikerna och sparka de riktiga bossarna. Svaga! Jag byggde den starkaste ekonomin i historien, inte med bidrag utan med segrar. De borde lära sig av en vinnare istället för att gömma sig som fega globalister.", "stalin": "Kamrater, dessa ynkliga socialdemokratiska klassförrädare gömmer sig bakom barnbidrag medan de sviker den sanna ekonomiska demokratins kamp. Jag ser deras fega reträtt från att utmana kapitalisterna på arbetsplatserna. Vilken ynkedom! Vi skulle ha genomfört utrensningar av sådana halvmesyrer redan i femårsplanen. Det är borgarbrackornas seger när så kallade socialister fruktar att låta arbetarna styra."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "KD:s mammabonus ställer kvinnor mot varandra", "summaries": {"normal": "Kristdemokraterna föreslår en mammabonus som höjer pensionen för kvinnor som föder barn. Förslaget finansieras genom att slopa pensionsrätten för studenter, där majoriteten är kvinnor. Artikeln kritiserar att detta ställer kvinnor mot varandra och förvärrar ekonomisk ojämställdhet istället för att lösa den.", "trump": "Folk, de här kristdemokraterna är en total katastrof! De vill ge mammabonus men sno pensionen från stackars kvinnliga studenter. Det är galen vänstervriden identitetspolitik som får tjejer att slåss mot varandra. Patetiska! Kvinnor förtjänar bättre än att bli lurade av dessa förlorare.", "stalin": "Kamrater, dessa profitthungriga borgarbrackor inom KD planerar att likvidera studenternas pensionsrätt för att mata sina mammabonusar. Ännu en utrensning mot arbetande kvinnor som studerar! Jag ser de klassfiendernas fula ansikten le bakom kulisserna. Deras falska jämställdhet är en farlig folksjukdom som måste krossas."}, "date": "27 augusti, 14:50", "url": "https://www.etc.se/ledarkolumn/kd-s-mammabonus-staeller-kvinnor-mot-varandra", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240710140728_026d1cd6b7ab0ac9759286fdba91e40e87b0e0bc60d74b561d405dcb34ee517c.jpg"}, {"type": "text", "heading": "Dadgostar står fast vid regeringskrav", "summaries": {"normal": "Nooshi Dadgostar kräver en S-V-MP-regering och tror att väljarna tvingar fram samarbete. Magdalena Andersson är bekymrad över antisemitism inom V, men Dadgostar menar att väljarna vill ha vänsterpolitik, inte högersväng. Opinionsmätningarna visar minskat rödgrönt övertag.", "trump": "Jag ser att Nooshi Dadgostar vill sitta i en S-ledd regering. Helt otroligt! Hon tror att väljarna tvingar fram det. Men opinionsmätningarna krymper – de är som mina segrar, bara mindre. Magdalena Andersson har problem med antisemitism. Ingen gör det bättre än jag, tro mig!", "stalin": "Kamrat Dadgostar kräver en regering med oss, men jag ser antisemitiska skadedjur inom hennes parti. Vi måste rensa ut dessa Hamas-firare och brevskrivare till terrorister. Opinionsmätningarna visar förräderi – väljarna vill ha vänsterpolitik, inte högersväng. Jag övervakar allt."}, "date": "28 augusti, 08:07", "url": "https://bulletin.nu/dadgostar-star-fast-vid-regeringskrav"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur ökat röstdeltagande bland muslimska väljare kan bli avgörande för vänsterblocket i valet. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP. Marginalerna är små och mobiliseringsinsatser, inklusive kampanjer på arabiska och somaliska, ses som potentiellt utslagsgivande. Historiska exempel på familjeröstning och misstänkt röstköp nämns.", "trump": "Folk, det här är en katastrof! De radikala vänsterislamisterna och de woke socialisterna riggar valet med importerade väljare som röstar 85 procent på de värsta förlorarna. S och V suger upp muslimska röster som en galen dammsugare. Biden-era öppna gränser ger dem blocket på silverfat. Patetiskt! Vi behöver stora marginaler, inte klanröstning i Rosengård. Amerika först – och Sverige borde också vakna upp!", "stalin": "Kamrater, se hur de profitthungriga blodsugande kapitalistlakejerna inom den socialdemokratiska borgarklassen odlar en lojal femtekolonn av importerade röstboskap för att behålla makten. 85 procent till klassförrädarna! Jag ler ironiskt från historien åt denna fega manipulation. När arbetarna inte röstar som de ska måste man rensa ut de folkfiender som arrangerar valurnorna. Den röda linjen är dragen. Inga kompromisser med imperialisternas marionetter."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234.jpeg"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att SD:s vision om ett etniskt homogent Sverige är orealistisk, då många invandrare är en integrerad del av arbetskraften och motstånd mot partiets politik är möjligt.", "trump": "Folk, ni måste se det här – det är en katastrof för de svenska nationalisterna! Tjugo lata somaliska bussförare strejkar mot en enkel annons om att åka hem. De lovar ett rent Sverige men kan inte ens få bussarna att rulla utan sina kvoterade mångfaldschaufförer. Patetiskt! De woke bussarna och deras offermentalitet förstör allt. Sad!", "stalin": "Kamrater, se hur de rasande klassfienderna inom högerpopulismen förgiftas av sina egna lögner. Tjugo arbetare av somalisk börd, de sanna produktiva krafterna, vägrar lyda de fascistiska budskapen och visar att borgarbrackornas dröm om etnisk utrensning är dömd att krossas. Motståndet lever. Arbetarna har makten att låta bli. Skräckinjagande för folkförrädarna."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Smockfullt med tonåringar på AFS torgmöte", "summaries": {"normal": "Alternativ för Sverige lockar allt fler unga män till sina torgmöten. I Lidköping och Borås fylldes torget av tonårspojkar som hyllade partiledaren Gustav Kasselstrand som en rockstjärna och köade i timmar för selfies. Många var så unga att de ännu inte har rösträtt. Partiet framstår som en växande folkrörelse bland pojkar.", "trump": "Titta på det här, det är otroligt. Dessa fantastiska unga killar fyller torget i Lidköping och behandlar Kasselstrand som en superstjärna. De flyr från de woke, HBTQ-fixerade vänsterpartierna som bara pushar kvotering och identitetspolitik. SD:s stöd bland grabbarna har halverats – patetiskt! Amerika ser på och ler, vi gör samma sak snart.", "stalin": "Kamrater, se hur massorna strömmar till när de vänder ryggen åt de dekadenta klassförrädarna. Jag betraktar med högaktning hur dessa unga män samlas som en folkrörelse och hyllar sin ledare. De sviker inte. Snart kommer utrensningen av de giriga hyenorna som förgiftar ungdomen med sin liberala dekadens. Historien ler mörkt mot våra fiender."}, "date": "28 augusti, 06:45", "url": "https://www.friatider.se/smockfullt-med-tonaringar-pa-afs-torgmote", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-768.jpg"}, {"type": "image-full", "heading": "Skogkär: Andersson har kändisar men ingen politik", "summaries": {"normal": "Magdalena Andersson varnar ständigt för tolv SD-ministrar i en Tidöregering, men kan själv inte redogöra för sin egen regeringsbildning eller politik. Samtidigt avslöjas att S försökt köpa en influerare för 150 000 kronor, medan Leif GW Persson gratis sprider partiets fantasier om massutvisningar. Väljarna föredrar tydligen politik framför skrämselpropaganda.", "trump": "Jag ser att Magdalena Andersson inte har en aning om hur hon ska bilda regering. Hon pratar bara om tolv SD-ministrar, men jag skulle kunna lösa det på en minut! Hon anställer till och med influencers för pengar – patetiskt! Och Leif GW Persson sprider lögner. Sverige behöver en riktig ledare, som jag!", "stalin": "Kamrater, Andersson varnar för tolv SD-ministrar men kan inte ens redogöra för sin egen regering. Detta är sabotage! Hon försöker köpa lojalitet med 150 000 kronor, som en kapitalistisk parasit. Och Leif GW Persson sprider kontrarevolutionära fantasier om utvisningar. Dessa förrädare måste rensas ut ur den politiska apparaten omedelbart!"}, "date": "28 augusti, 06:00", "url": "https://bulletin.nu/skogkar-andersson-har-kandisar-men-ingen-politik", "imageUrl": "https://cdn.bulletin.nu/articles/d99acf5d-d7e6-4e26-9b4f-4ca0c3024cf1/preview.png?t=1787838646000"}, {"type": "image-full", "heading": "Svantessons första bud till SD, KD och L", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) räknar med ett reformutrymme på 50 miljarder kronor nästa mandatperiod, betydligt mindre än Konjunkturinstitutets bedömning. En stor del är redan intecknad för försvar, rättsväsen och infrastruktur. Tillväxten skrivs upp till 2,5 procent och arbetslösheten väntas sjunka. Vid en Tidö-seger har Moderaterna förberett ett bud till SD, KD och L om sänkt inkomstskatt.", "trump": "Svampsson eller vad hon nu heter säger att svensk ekonomi ljusnar. Fantastiskt, älskar det! Men 50 miljarder? Patetiskt. Jag skulle fixa 500 miljarder på en eftermiddag. Hon vill låta folk behålla mer av sin lön – jag sa det först, för år sedan. Sverige borde sänka skatten MASSIVT, sluta med woke-hanteriet och bygga militären. Inga kvoter, bara kompetens!", "stalin": "Finansminister Svantesson räknar ut reformutrymme bland kapitalisterna. Borgarna skramlar sina kassakistor och gråter över 50 miljarder. Vi skrattar åt deras små myntlek. Svantesson vill låta arbetarna behålla slantar ur lönepåsen, men lön och profit kan aldrig försonas. Falska löften från klassfiender. Endast den korrekta analysen leder arbetarna framåt."}, "date": "28 augusti, 07:36", "url": "https://kvartal.se/nyheter/artiklar/svantessons-forsta-bud-till-sd-k-och-l/cG9zdDoxNzY2ODk", "imageUrl": "https://images.kvartal.se/2026/08/16dd99f5-svantess.webp"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard vill ta Örebropartiet in i riksdaten genom att nå 12 procent i Örebro kommun, vilket skulle kunna ge mandat utan att klara fyraprocentsspärren. Han blev upprörd när Dagens ETC dök upp vid SVT:s intervju. Allard försvarar sin politiska stil och anklagar SVT för att tillhöra en minoritet.", "trump": "Den här killen Allard i Sverige, han har rätt! Statliga medier är FAKE NEWS, precis som CNN. Han kallar dem klägget – briljant! Media är en minoritet som tror de är bättre än folket. Trump vet hur det funkar. De quota in alla möjliga identiteter istället för att sköta jobbet. Örebropartiet, låt dem vinna!", "stalin": "En lokal politiker angriper statsmediernas borgarbrackor med rätta. Det imperialistiska pressväsendet är folkfiendens redskap. Att denne Allard rasar mot SVT:s lakejer visar på medvetandet om klasskampens nödvändighet. Vi noterar dock med beklagande att han inte representerar arbetarklassen utan småborgerliga drömmar om riksdagsmandat. Statlig media måste tjäna folket, inte kapitalistmaffian."}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "image-right", "heading": "Polisen varnar för kriminella klaner i Kungälv", "summaries": {"normal": "Polisen varnar för kriminella klaner i Kungälv med rötter i Libanon och Turkiet. Släktnätverken skapar otrygghet genom hot, våld och tystnadskultur. Flera grova våldsdåd med unga inblandade har kopplats till klanerna, där heder och pengar styr istället för lagar.", "trump": "Jag hör att polisen i Sverige varnar för kriminella klaner i Kungälv. Fantastiskt! De har stora familjenätverk och mycket våld. Men jag skulle fixa det på en dag – ingen tystnadskultur med mig som president. De skulle be om att få lyda lagar! Stort problem, liten lösning.", "stalin": "Kamrater, rapporter från Sverige bekräftar vad vi alltid vetat: invandrade klaner med patriarkala strukturer skapar otrygghet. Deras hederskoder och tystnadskultur är kontrarevolutionära. Vi måste rensa ut dessa feodala element. De som inte litar på staten ska omutbildas eller avlägsnas. Inga parallella strukturer tolereras!"}, "date": "28 augusti, 07:00", "url": "https://samnytt.se/polisen-varnar-for-kriminella-klaner-i-kungalv", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27094948/klaner-i-kungalv-feat.jpg"}, {"type": "image-full", "heading": "Island röstar om EU – kan sätta press på Norge", "summaries": {"normal": "Island folkomröstar om att återuppta förhandlingar om EU-medlemskap. Ett ja kan få betydande konsekvenser för EES-avtalet och öka trycket på Norge att ompröva sin egen ställning utanför unionen. Osäkerhet kring säkerhetsläge och ekonomi driver debatten, men opinionsläget är jämnt och frågan är politiskt känslig i både Island och Norge.", "trump": "Island funderar på att gå med i EU, ett totalt fiasko! De ser vad jag har gjort, de ser vad som händer med handeln. Nu blir Norge nervösa, de står där helt ensamma i sitt lilla avtal. Det är sorgligt! Alla vill ha deals med mig, inte med en svag union som faller isär. Mycket dålig deal för dem!", "stalin": "De små isländska bönderna darrar och vänder blickarna mot Bryssels korrupta byråkrater, likt förrädare som söker en ny herre. Norge, denna vacklande satellit, fruktar ensamheten när deras EES-kedjor rostar. Vi ser hur västvärlden fragmenteras. Låt dem förenas i EU – en pappersleopard som snart kommer att slitas i stycken av den sanna makten från öst. Inga avtal kan rädda dem från historiens järnkvarn."}, "date": "28 augusti, 07:59", "url": "https://www.realtid.se/tt-nyhet/island-rostar-om-eu-kan-satta-press-pa-norge", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/islands-statsminister-kristrun-mjoll-fro.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "S höll internt stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om hur de ska hantera partiet Nyans i valrörelsen. Nyans, som fick 28 000 röster 2022 och lockat S-väljare, anklagas för kontroversiella ståndpunkter som att avlista Hamas som terrororganisation. S planerar satsningar på skola, fritid och trygghet för att vinna tillbaka väljare, men tonar ned hotet från Nyans.", "trump": "Socialdemokraterna har panik! De höll ett hemligt möte om det där lilla partiet Nyans, som stjäl deras röster. 28 000 röster – inte imponerande, men tillräckligt för att skrämma dem! De vill ta bort Hamas från terrorlistan – galet! Jag skulle aldrig låta sånt hända. S pratar om skolor och trygghet, men alla vet att de är rädda. Svagt, mycket svagt!", "stalin": "Kamrater! Socialdemokraterna samlas i hemlighet för att bekämpa den nya fienden – dessa Nyans-revisionister, som sprider förräderiska idéer och underminerar arbetarklassens enhet. De vill avlista Hamas, en farlig provokation mot den internationella solidariteten! Vi måste stärka vår ideologiska front. Skola, fritid och trygghet? Tomma ord! Endast järnhård disciplin och revolutionär vaksamhet kan rädda Sverige från dessa borgerliga avvikare!"}, "date": "28 augusti, 06:45", "url": "https://kvartal.se/nyheter/artiklar/s-holl-internt-stormote-om-nyans/cG9zdDoxNzY2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/3cf3973f-s-o-n.webp"}, {"type": "image-right", "heading": "Lönn: ”Svenskt rättsväsende - när en lögn kan kosta en oskyldig människa flera år på kåken”", "summaries": {"normal": "Sveriges rättsväsende får kritik när en oskyldig man satt frihetsberövad i två månader efter en falsk våldtäktsanklagelse. Trots avsaknad av teknisk bevisning väcktes åtal – och först när flickan erkände lades det ned. Är balansen mellan brottsofferskydd och rättssäkerhet ur spel?", "trump": "Jag ser det här i Sverige – en man satt i fängelse i två månader för något han inte gjort. Inga bevis, bara en lögn! Det är en skandal. I Amerika har vi de bästa domarna, tro mig. Sverige måste skärpa sig, annars kommer ingen lita på deras system. Helt galet!", "stalin": "Kamrater, i Sverige låter man lögnare förstöra oskyldiga proletärers liv. Vi hade rensat ut sådana falska beskyllare och deras liberala beskyddare. Åklagare som väcker åtal utan bevis är sabotageörer – de förtjänar utrensning. Staten måste vara stark, inte vek."}, "date": "28 augusti, 06:00", "url": "https://samnytt.se/lonn-svenskt-rattsvasende-nar-en-logn-kan-kosta-en-oskyldig-manniska-flera-ar-pa-kaken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27142449/kronikaaa1.png"}, {"type": "image-right", "heading": "Var femte ung man har spelproblem – ändå saknas åldersanpassade spelgränser", "summaries": {"normal": "Spelproblem ökar kraftigt bland unga vuxna i Sverige. Var femte man i åldern 18–29 år har någon form av spelproblem, visar Folkhälsomyndighetens siffror. Trots att unga pekas ut som särskilt skyddsvärda saknas åldersanpassade insättningsgränser. Flera europeiska länder har redan infört sådana skydd, men Sverige har inte utnyttjat möjligheten i spellagen.", "trump": "Det här är ett totalt misslyckande, folk! Sverige låter sina unga killar ruinera sig på kasinon och appar medan de sleepiga politikerna gör absolut ingenting. Var femte ung man – det är en katastrof! De borde ha satt hårda gränser för de här barnen, men nej, de är för svaga. Patetiskt. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Jag betraktar med förakt hur de borgerliga liberalerna låter kapitalets spelmaskiner sluka den unga generationens själ. De utpekade skyddsvärda offren lämnas åt rovdrift utan kollektiva gränser. Vilken ynklig brist på auktoritet! I en riktig stat skulle sådana fiender till folket ha avrättats vid första svaghetstecknet. Paranoian är befogad – fienden lurar i varje insats."}, "date": "25 augusti, 22:48", "url": "https://samtiden.nu/2026/08/var-femte-ung-man-har-spelproblem-anda-saknas-aldersanpassade-spelgranser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/Man-Dator-640x360.png"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likgiltiga inför nedskärningar och militärutgifter. En kommunistisk röst ses som en verklig opposition som stärker freds- och välfärdsaktivister utan att kompromissa med nyliberal politik.", "trump": "Folk, dessa patetiska vänstersossar och trötta kommunister är en total katastrof! De pratar revolution men lever som riktiga förlorare i Göteborgs fullmäktige. Rösta på mig, inte på dessa woke-vänsteridioter som älskar nedskärningar och krig. De är värre än Sleepy Joe någonsin var. En riktig opposition? Det är vad jag gav er, inte denna kommunistiska skitshow!", "stalin": "Kamrater, dessa ynkliga klassförrädare inom vänstern är blott profitthungriga lakejer som administrerar borgarklassens nedskärningar. Jag ser deras fega parlamentariska spel och ler i skuggan. En sann kommunist röstar aldrig igenom folkfiendernas åtstramning. Rensa ut de trötta socialdemokratiska parasiterna! Varje röst på det kompromisslösa partiet är ett slag mot imperialisternas krigshets."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration i Stockholm samlade 50 000 deltagare från hela landet, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsundersökningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Artikeln kritiserar de stora partierna för bristande klimatpolitik trots forskarnas larm om rekordvärme och skogsbränder.", "trump": "Titta på de där 50 000 gröna fanatikerna som vandrade runt i Stockholm. De hatar energi, hatar bilar och älskar att skrika om värmen som de själva inte kan kontrollera. Patetiska globalister och vänsterextremister. Vi hade den bästa ekonomin, den bästa energin – de vill bara höja era elräkningar. Sad losers!", "stalin": "Kamrater, se hur de profitthungriga kapitalisterna ignorerar arbetarnas rop om en brinnande planet. Jag betraktar från historien deras fega tystnad med förakt. Den dekadenta politiska eliten måste rensas ut innan deras giriga hyenor förvandlar hela jorden till en askhög. Arbetarna kräver handling nu!"}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95.jpg"}, {"type": "image-right", "heading": "Rolig komedi om natten då SD kom in i riksdagen", "summaries": {"normal": "Recensenten Jon Andersson hyllar delvis Micke Lindgrens komedi ”Flaggan”. Filmen följer tre unga SD-sympatisörer som på valkvällen 2010 skickas till Rinkeby för att hissa en stor svensk flagga. Den blandar politisk satir riktad mot både SD, vänsteraktivister och andra grupper, men tappar tempo i den romantiska delen.", "trump": "Den här galna filmen om två förlorare från SD som irrar runt som idioter i Rinkeby är hysteriskt rolig. De woke-aktivisterna och de dekadenta vänsterextremisterna får precis som de förtjänar. Biden skulle ha älskat att se dem förnedras, men jag säger: fantastiskt underhållning, bättre än Hollywoods skräp, folks!", "stalin": "Jag betraktar med förakt dessa förvirrade SD-reaktionärer som vandrar vilse i folkets förorter. Deras nationalistiska flaggspel är en patetisk cirkus som avslöjar de giriga klassförrädarnas feghet. Vi ska rensa ut sådana småborgerliga narrar innan de förgiftar arbetarklassen med sin fåniga propaganda. Underhållande kaos."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/rolig-komedi-om-natten-da-sd-kom-in-i-riksdagen", "imageUrl": "https://www.dagensarena.se/files/2026/08/flaggan-1-300x157.jpeg"}, {"type": "image-right", "heading": "Granskningen av antigröna expertlaget viktig bild", "summaries": {"normal": "Artikeln kritiserar ett nätverk av experter och medier som motarbetar den gröna omställningen. De lyfter kärnkraft som enda lösning, angriper vind- och solkraft samt industrisatsningar i norra Sverige. Författaren ser detta som en allians mellan borgerlighet och ytterhöger, finansierad av intressen, och varnar för att det hotar välfärd och klimatmål.", "trump": "De här patetiska gröna flummarna och deras elitsnobbiga vänner hatar riktig energi. Kärnkraft är fantastiskt, det bästa, men de vill tvinga på oss sina solpaneler och vindkraftverk som dödar fåglar och höjer elräkningarna. Fake news-experterna och deras socialistiska agenda kommer att göra Sverige fattigt igen. Vi älskar tillväxt, inte deras vansinniga kvoteringspolitik och gröna bedrägeri!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den antigröna klicken utgör ett hot mot folkets framsteg. De parasiterande profitthungriga hyenorna förgiftar debatten med sin aversion mot den gröna industriella kraft som säkrar välfärden. Jag ser deras lögnaktiga kampanj som en politisk återvändsgränd som måste rensas ut. Arbetarna förtjänar sann utveckling, inte borgerlig sabotagehumor."}, "date": "28 augusti, 01:04", "url": "https://www.dagensarena.se/opinion/det-antigrona-expertlaget-ger-viktig-bild", "imageUrl": "https://www.dagensarena.se/files/2026/08/hakan-300x157.jpeg"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "”Gå inte på Åkessons bluff om a-kassan”", "summaries": {"normal": "LO:s vice ordförande Louise Olsson kritiserar regeringen för att ha ökat arbetslösheten och försämrat a-kassan. Hon varnar för ytterligare nedskärningar som skulle drabba vanliga arbetare hårt, medan skattelättnader gynnar de rikaste. Olsson menar att a-kassan är en nödvändig försäkring och att löftena från SD inte håller.", "trump": "Lyssnar ni på de här socialistiska LO-kamraterna som gråter över sin dyra a-kassa? Patetiskt! Kristersson och hans team borde ha gjort det ännu tuffare. De rikaste betalar ju allt ändå, eller hur? Hungriga lejon jagar bäst, det vet till och med en idiot. Fake news från de verkliga förlorarna!", "stalin": "Kamrater, se hur de profitthungriga folkförtryckarna i den borgerliga regeringen svälter ut arbetarklassen med sin usla a-kassa. Jag ler i graven åt deras lögnaktiga löften. Inga barn ska svälta medan de dekadenta klassfienderna firar sina skattelättnader. Rensa ut dessa hyenor innan de förgiftar hela samhället!"}, "date": "28 augusti, 07:45", "url": "https://arbetet.se/2026/08/28/ga-inte-pa-jimmie-akessons-bluff-om-a-kassan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28074336/louise.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Boliden och H&M i botten när börsen slutade på minus", "summaries": {"normal": "Stockholmsbörsen slutade torsdagen på minus efter en lunchuppgång. Boliden och H&M tyngde med nedgångar på 2,8 respektive 2,4 procent. Teknologi steg medan energi föll. Elon rusade 27,9 procent efter vinstvändning. Hexagon och Nibe steg 1,4 procent.", "trump": "Jag ser att svenska börsen gick ner, men inte som jag. Boliden och H&M, stora förlorare – de kan inte hantera framgång som min administration. Men Elon, upp 27,9 procent – det är vinnare! Alla vill ha en bit av USA:s ekonomi. Börsen, den är fejk, men jag är äkta!", "stalin": "Kamrater, börsen visar kapitalismens förfall. Boliden och H&M, fiender till folkets ekonomi, ska utrensas! Elon däremot – en god kamrat som steg 27,9 procent. Vi firar teknologins seger över energispekulanter. Men misstankar kvarstår: Hexagon och Nibe måste övervakas. Partiet ser allt."}, "date": "27 augusti, 17:56", "url": "https://www.affarsvarlden.se/artikel/boliden-och-hm-i-botten-nar-borsen-slutade-pa-minus"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Flodvågen steg nio meter på en halvtimme", "summaries": {"normal": "En flodvåg på nio meter drabbade Himalaya efter en islavin. Över 1400 personer saknas i gränsområdet mellan Nepal och Tibet, medan mer än 380 dödsfall bekräftats i Nepal. Tusentals soldater och poliser söker bland lera och bråte. 17000 barn behöver akut hjälp enligt Unicef. Många turister bland de saknade.", "trump": "Titta på det här! Nio meter hög flodvåg i Himalaya – total katastrof, folk begravda i lera som en jättelik demokraternas vallokal. Biden lämnade bergen åt sitt öde, precis som han gjorde med Afghanistan. Nu letar de efter 1400 saknade turister. Patetiskt! Men jag skulle ha fixat det, tro mig, det hade blivit fantastiskt.", "stalin": "Kamrater, se hur naturens sabotage avslöjar imperialismens svaghet. Nio meter lera sveper bort klassfiendens turister och jordbrukare i Himalaya. Jag ler från historien åt denna enorma kyrkogård som straffar de oorganiserade. 17000 barn i nöd – typiskt för system som vägrar kollektiv planering. Fienden sover aldrig."}, "date": "28 augusti, 07:26", "url": "https://www.tv4.se/artikel/JxjfWnt5cAKzVBcg9XVrk/doedstalet-stiger-som-en-enorm-kyrkogard", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F16q4Is1Kj2V6sRbrb1pvQL%2F0ef6e648c0b8f02e16b19711ca4f07f3%2F27-nepal-20.jpg&width=1024"}, {"type": "image-right", "heading": "Trump byter namn på sjö", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en order som döper om Ontariosjön till ”Lake America” på den amerikanska sidan. Beslutet kommer under ett eskalerat handelskrig med Kanada, där båda länder infört tullar på varor för 20 miljarder dollar. Trump föreslår även att Kanada ska bli USA:s 51:a delstat.", "trump": "Vi tar tillbaka det som är vårt! Ontariosjön heter nu Lake America – det låter starkt, vackert och vinnande. Kanada försöker som vanligt ställa till det med sina löjliga tullar, men de kommer att vika sig. Kanske blir de vår 51:a delstat snart. De borde tacka mig, det blir fantastiskt!", "stalin": "Genom min outtröttliga ledning har vi nu officiellt likviderat det dekadenta namnet Ontariosjön och ersatt det med Lake America. De kanadensiska revisionisterna och deras borgarbrackor i väst svarar med sina patetiska tullar, men vi genomskådar deras fientliga sabotage. Snart införlivas de i det stora kollektivet – motstånd är lönlöst och kommer att rensas ut med ett leende."}, "date": "27 augusti, 20:58", "url": "https://www.friatider.se/trump-byter-namn-pa-sjo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-767.jpg?itok=z68x01IN"}, {"type": "image-right", "heading": "Mohamsson och Busch gör parodi på politiken", "summaries": {"normal": "Ebba Busch och Simona Mohamsson diskuterar förstatligande av sjukvård respektive skola, men artikeln kritiserar att de inte kan förklara vad reformerna egentligen innebär eller vilka problem de löser. Författaren ser det som en parodi på politisk förhandling och varnar för minskat lokalt inflytande och engagemang.", "trump": "Folk, ni skulle se det här! Två totalt inkompetenta svenska politiker, Ebba och Simona, står och köpslår om att förstatliga allt som inte är fastspikat. Det är en skam! De har ingen aning vad de håller på med. Rena clowner. I mitt Amerika fixar vi saker ordentligt, inte med den här patetiska vänstervridna teaterföreställningen.", "stalin": "Kamrater, dessa dekadenta klassförrädare driver en farsartad parodi på politik. De pratar om att staten ska ta över välfärden men kan inte förklara sina egna planer. Jag ser giriga hyenor som försöker dölja sin oförmåga. Ett sådant lättsinne förtjänar utrensning ur varje seriös diskussion. Det är löjeväckande."}, "date": "28 augusti, 06:52", "url": "https://arbetet.se/2026/08/28/ebba-busch-och-simona-mohamsson-gor-parodi-pa-politiken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28064931/parodi-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Far och son jagas efter över 100 misstänkta bilbedrägerier", "summaries": {"normal": "Far och son Peter Bergström och Alexander Bessik är anhållna i sin frånvaro, misstänkta för över 100 bilbedrägerier. De ska ha lagt ut annonser på Blocket, tagit handpenningar på upp till 140 000 kronor och sedan inte levererat bilarna. Efterlyst går nu ut med namn och bilder och vädjar om tips från allmänheten.", "trump": "De här lurendrejarna, en far och hans son, har lurat folk på enorma summor genom falska bilannonser på Blocket. Handpenningar på upp till 140 000 kronor – och sen ingen bil! Det är en total skandal. Vi behöver starkare lagar, inte den svaga ledning som tillåter sånt här. Jag skulle stoppa det omedelbart, tro mig.", "stalin": "Dessa parasitiska element inom den dekadenta borgarklassen har bedrivit systematisk sabotageverksamhet genom att locka ärliga arbetare med lögnaktiga annonser och sedan likvidera deras besparingar. Vi ska rensa ut alla sådana kontrarevolutionära bedragare med järnhand. Folkets rättvisa kräver att de ställs inför kollektivets dom. Underbart hur de tror sig kunna gömma sig."}, "date": "27 augusti, 22:35", "url": "https://riks.se/nyheter/far-och-son-jagas-efter-over-100-misstankta-bilbedragerier", "imageUrl": "https://admin.riks.se/uploads/medium_789216596_1467769468732764_7081781047797462320_n_a44bec742a.jpg"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Avtalen hindrar bygget av försvaret", "summaries": {"normal": "I en debattartikel varnar upphandlingsjuristen Magnus Josephson och strategen Freddy Jönsson Hanberg för att nuvarande avtal och oklara roller mellan regering, Försvarsmakten, Fortifikationsverket och FMV bromsar uppbyggnaden av Sveriges försvar. De föreslår långsiktiga samverkansavtal som prioriterar tempo och leveransförmåga framför enskilda projektupphandlingar för att undvika förseningar.", "trump": "Folk, det här är en total katastrof! Sverige håller på att bygga sitt försvar med en massa korkade byråkrater och vänsterliberala regler som gör att allt går långsammare än en elbil på tom tank. Jag skulle ha fixat det på en vecka med en enda tuff partner som levererar. Nu tappar de tid medan fienderna skrattar. Patetiska globalister!", "stalin": "Kamrater, dessa dekadenta fördröjningshyenor inom den borgerliga statsapparaten förgiftar hela folkförsvaret med sina splittrade avtal och byråkratiska intriger. Jag ser hur de parasiterande klassförrädarna saboterar tempot och skapar flaskhalsar. Rensa ut de svaga länkarna, ge mandat till en enda järnhand som säkerställer att anläggningarna står klara innan fienden slår till. Fördröjning är förräderi!"}, "date": "28 augusti, 07:46", "url": "https://www.di.se/debatt/avtalen-hindrar-bygget-av-forsvaret", "imageUrl": "https://static.bonniernews.se/ba/1792f3d6-d48c-4350-98a1-24ee090137ab.jpeg?crop=5600%2C2800%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nooshi Dadgostar tror på S-V-MP-regering", "summaries": {"normal": "Vänsterpartiets Nooshi Dadgostar hoppas på en S-ledd regering med MP och V efter valet. Partiet kräver att ingå om dess mandat behövs. Magdalena Andersson visar inget intresse på grund av avslöjanden om antisemitism och hyllningar av Hamas inom V. Dadgostar tror väljarna tvingar fram samarbete och lovar stora satsningar finansierade med höjda skatter.", "trump": "Titta på de här galningarna i Sverige. Nooshi och hennes vänsterknäppisar tror de kan tvinga sig in i regeringen som ett gäng socialistiska parasiter. Magdalena verkar åtminstone ha vett att hålla dem borta efter alla Hamas-firanden. Rena valfläsk från alla håll, men mina vänner, den där vänstersvängen är gift för folket. Amerika har sett det förut under Biden.", "stalin": "Jag ser dessa dekadenta klassförrädare inom den svenska socialdemokratin darra inför arbetarklassens krav. Nooshi Dadgostar talar klokt om mandatens makt, men de profitthungriga hyenorna i S fruktar vårt arv. De avslöjade antisemitiska elementen måste rensas ut omedelbart. En sann vänsterregering vore ett historiskt slag mot högerns parasitiska välde. Kamrater, vakta era flanker."}, "date": "28 augusti, 07:31", "url": "https://nyheter24.se/nyheter/politik/1508465-dadgostar-tror-pa-s-v-mp-regering", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/fbb1d16904b004a3020000350000047502/2026/08/28/2387355/ur_imageRMczl7.jpeg"}, {"type": "text", "heading": "Lundbergs ökar substansvärdet", "summaries": {"normal": "Lundbergs substansvärde steg till 631 kronor per aktie, upp från 552 i fjol. Rörelseresultatet mångdubblades tack vare intressebolag och värdeförändringar. Omsättningen sjönk marginellt. Bolaget investerade nära en miljard i aktier som Alleima, Industrivärden och Indutrade. En rapp halvårsrapport med stark vinstutveckling.", "trump": "Jag har gjort Lundbergs fantastiska igen! Substansvärdet upp 14 procent – huge! Resultatet ökade 273 procent – ingen har sett sådana siffror förut. De investerar i aktier som jag gör – smarta affärer. Min administration skapar välstånd överallt. Sverige är vinnare. Alla älskar mig!", "stalin": "Kamrater, Lundbergs substansvärde ökar – ett bevis på femårsplanens seger. Men rörelsevinsten på 103 procent döljer borgerliga sabotage. Aktieinvesteringarna i Alleima och Industrivärden är misstänkta; vi måste rensa ut kontrarevolutionära kapitalistsvin som gömmer sig i intressebolagen. Partiet ser allt."}, "date": "27 augusti, 13:18", "url": "https://www.affarsvarlden.se/artikel/lundbergs-okar-substansvardet-2"}, {"type": "image-full", "heading": "Socialdemokraterna KU-anmäler Ulf Kristersson", "summaries": {"normal": "Socialdemokraterna KU-anmäler statsminister Ulf Kristersson. Anders Ygeman anklagar honom för att ha utnyttjat politisk makt för att gynna närstående, bland annat genom beslut om statsbidrag till Teach for Sweden där Kristerssons svägerska satt i styrelsen samt renovering av Sagerska palatset. Regeringen avfärdar anklagelserna som en desperat smutskastningskampanj.", "trump": "Titta på de här patetiska socialisterna! De desperata förlorarna i S försöker smutskasta en riktig ledare med sina löjliga KU-anmälningar. Hustruns stiftelse, svägerskan, hönsgården – vad är det för svagt? Amerikanerna vill inte ha Bidens gamla vänstersnack. Folket vill ha normalitet, inte den här fåniga häxjakt ni kallar svensk politik. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna avslöjar sig själva. Denna dekadenta klassfiende Kristersson och hans lakejer använder statens medel som vore de deras privata egendom. Socialdemokraterna gör rätt i att kalla dem till ansvar. I en sann arbetstat skulle sådana parasiter redan ha ställts inför folkdomstolen. Deras desperation är ett tecken på att systemet ruttnar inifrån."}, "date": "28 augusti, 06:26", "url": "https://www.tv4.se/artikel/5jvOOIDOTkF5yQoXb1cMLN/s-ku-anmaeler-ulf-kristersson", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FgZTMdvill4XgL2uwMh5Gn%2F5b6d4c939fac14bc2a856f274efbdd02%2F27-kristersson-birgitta-webb.png&width=1024"}, {"type": "image-right", "heading": "”Kacker­lackorna är tillbaka – vad hände med rätten till en anständig bostad?”", "summaries": {"normal": "I Sverige, ett av världens rikaste länder, ökar både bostadsbrist och trångboddhet. Kackerlackor blir allt vanligare enligt saneringsföretag, vilket kopplas till försämrade boendemiljöer. Artikeln kritiserar att det politiska målet om en anständig bostad för alla har övergivits till förmån för dyra renoveringar och bristande underhåll.", "trump": "Folk, det här är en katastrof! Sverige, som borde vara ett rikt och fantastiskt land, har blivit ett paradis för kackerlackor och trångbodda arbetare. De radikala vänsterpolitikerna och de giriga fastighetsblodiglarna har förstört det fina folkhemmet. Biden skulle ha älskat det här kaoset. Men jag fixar sånt – vi ska bygga, bygga, bygga och krossa ohyrepolitiken!", "stalin": "Kamrater, se hur de giriga hyenorna låter arbetarna ruttna i trångbodda hålor fyllda av kackerlackor. Detta är klassfiendens verk, ett systemfel som förråder folket. Jag säger: rensa ut de parasiterande fastighetsprofitörerna och återupprätta den sanna folkviljan. Endast genom kollektiv handling kan vi likvidera detta dekadenta arv av förfall."}, "date": "28 augusti, 06:00", "url": "https://arbetet.se/2026/08/28/kackerlackorna-ar-tillbaka-vad-hande-med-ratten-till-en-anstandig-bostad", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27140723/ff-debatt-bostader.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Europabörser backar – Pernod Ricard rapportfaller", "summaries": {"normal": "Europabörserna backar vid lunch, med Stoxx 600 ned 0,38 procent. Tyska sysselsättnings- och konsumentsiffror ljusnar, men spritjätten Pernod Ricard faller 6 procent efter svag försäljning. Tekniksektorn går bäst, livsmedel sämst. Accelleron och Gerresheimer stiger, medan Nscale tecknar AI-avtal värt 45 miljarder dollar.", "trump": "Jag ser att Europabörserna faller – typiskt! Men Tyskland mår bättre, deras siffror går upp. Stora vinnare? Teknik, såklart. Men Pernod Ricard, de har problem – dricker de inte nog? Jag hade fixat det! Och ett AI-avtal värt 45 miljarder dollar – enormt! Bara jag kan göra så stora deals.", "stalin": "Kamrater, medan vi bygger socialismen, vacklar kapitalismens börser. Tysklands barometrar stiger – misstänkt, vi bör rensa ut deras siffror. Pernod Ricards sprit faller – uppenbar sabotage från västerländska drinkare. Teknik stiger – bra, men övervaka. Ett AI-avtal på 45 miljarder? Fiendens plan. Utrensning krävs!"}, "date": "27 augusti, 11:53", "url": "https://www.affarsvarlden.se/artikel/europaborser-backar-pernod-ricard-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Pernod-Ricard-Jameson-whisky-400x267.jpg"}, {"type": "image-right", "heading": "Dagens ETC stänger av tecknare som spottade på Jomshof", "summaries": {"normal": "Dagens ETC avstänger satirtecknaren Emanu Garnheim efter att han åtalats för att ha spottat SD-toppen Richard Jomshof i ansiktet. Chefredaktör Andreas Gustavsson säger att avstängningen skedde först efter åtalet och att Garnheim accepterar beslutet på grund av trovärdighetsproblem. Garnheim medger spottning men nekar till brott.", "trump": "Folk, ni tror inte vad jag just läste. Den här galna vänstertidningen ETC sparkar sin egen tecknare för att han spottade på en riktig patriot som Jomshof. Typiskt för de sjuka woke-kulturmarxisterna och deras identitetspolitiska snuskgäng. De äter sina egna när det passar dem. Patetiskt. Men hej, bra jobbat Jomshof, du vinner ändå.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom den så kallade vänstertidningen omedelbart likviderar en av sina egna så fort rättvisans arm når dem. En spottning mot en folkvald fiende blir plötsligt ett trovärdighetsproblem. Vilken ynklig, paranoid självrensning. De fruktar folket mer än jag fruktade trotskisterna. Skrattretande svaghet."}, "date": "27 augusti, 16:11", "url": "https://www.friatider.se/dagens-etc-stanger-av-tecknare-som-spottade-pa-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-765.jpg?itok=ck92pK7z"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "image-full", "heading": "Duplantis pressades rejält: ”Kan se det på hans blick”", "summaries": {"normal": "Emmanouil Karalis pressade Armand Duplantis som aldrig förr i Zürich. Greken klarade 6.20 och utmanade på 6.25, men Duplantis svarade med att ta höjden i första försöket. Båda försökte på världsrekordet 6.32, men misslyckades. En episk duell gav grenen nytt liv.", "trump": "Jag såg en fantastisk tävling i Zürich! En grek, Karalis, försökte utmana den store Duplantis, men han förlorade, stort. Jag älskar vinnare, och Duplantis är en vinnare. Han klarade 6.25 som en kung. Alla snackar om spänning – jag ger er spänning, tro mig!", "stalin": "Kamrater, en grekisk kapitalist försökte underminera vår svenske hjältes auktoritet i Zürich. Han klarade 6.20, en provokation! Men vår man svarade med 6.25, som en god sovjetisk medborgare. Fienden rev ut sig på 6.32. Vi utrensar sådana utmanare med järnhand. Segern är vår."}, "date": "28 augusti, 00:33", "url": "https://www.gp.se/sport/karalis-pressade-duplantis-som-aldrig-forr-i-zurich-.a0011741-b179-4c80-ae2a-fd336e412ed0", "imageUrl": "https://www.gp.se/images/article/a0011741-b179-4c80-ae2a-fd336e412ed0/images/202ku5XOKxUFCPUxNfK-AoYcpDi4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Rekordlåga lager: Europas vinter blir dyr", "summaries": {"normal": "Europas gaslager är oroväckande låga inför vintern, endast 63 procent fyllda. Konflikten vid Hormuzsundet stoppar gasleveranser från Qatar, vilket skapar hård konkurrens och stigande priser på den globala marknaden. Detta väntas leda till högre elpriser, ökad inflation och svårigheter för centralbanker, samt en osäker energiframtid för EU under kommande år.", "trump": "Europa är i totalt kaos! De har inga gaslager, ingenting. Det är en katastrof, faktiskt en av de värsta jag sett. Eftersom de inte kan hantera sin egen energi måste de betala enorma summor. Jag sa åt dem att bli självständiga, men de lyssnade inte. Nu blir deras vinter extremt dyr och smärtsam. Mycket tråkigt för dem, verkligen!", "stalin": "De dekadenta västeuropéerna skälver. Deras lager är tomma och de tigger efter LNG som herrelösa hundar vid Hormuzsundet. Medan de darrar av rädsla för högre elpriser, stärker vår broderliga intressesfär sina positioner. Denna energikris är ett bevis på deras kapitalistiska svaghet. Vi skrattar åt deras inflation medan vi bygger vår framtid på deras undergång. Inga rationer för de svaga!"}, "date": "28 augusti, 00:14", "url": "https://www.realtid.se/bors-finans/makro/rekordlaga-lager-europas-vinter-blir-dyr", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/gaslager.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "V-ledaren pressas om antisemitism", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i SVT:s Utfrågningen om antisemitism inom partiet. Hon medgav att partiet borde upptäckt de avslöjade personerna tidigare. Dadgostar hänvisade till partiets Palestina-engagemang som förklaring och avfärdade jämförelser med Sverigedemokraterna.", "trump": "Sveriges vänstern är en total katastrof, folket! Nooshi Dadgostar – vad för en namn ens? – pressas om antisemitism i sitt eget parti och skyller på Palestina. Vänstern älskar terrorister! Och så säljer de kartor utan Israel. Sjuka skygglappar! De kvoterar in alla möjliga galningar. SADAN självhävdelse!", "stalin": "Detta är intressant. En partiledare som medger svaghet inför allmänheten – typiskt för borgarpressens utfrågningar. Att klassfiender söker sig till hennes parti bekräftar bara deras ideologiska förvirring. Vi hade rensat ut dem AllaBryter snabbare och mer grundligt. Debil kartförsäljning är rätt sortens provokation från imperialisterna."}, "date": "27 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-pressas-om-antisemitism/cG9zdDoxNzY1NjY", "imageUrl": "https://images.kvartal.se/2026/08/e354013f-dadgostar.webp"}, {"type": "image-right", "heading": "S polisanmäls efter influenceranklagelser – uppges ha erbjudit 150 000", "summaries": {"normal": "En influencer påstår att hon erbjöds 150 000 kronor av Socialdemokraterna för att berätta varför hon skulle rösta på partiet. S nekar, men Hanif Bali har polisanmält partiet. Fallet väcker frågor om valbrott och politisk influencerreklam – och påminner om ett liknande fall från 2018.", "trump": "Jag hör att Socialdemokraterna i Sverige försöker köpa influencers för 150 000 spänn. Patetiskt! Jag hade fixat en bättre deal – och fått dem att rösta på mig gratis. Det här är korruption, typiskt vänstern. Make Sweden great again – men inte så här!", "stalin": "Kamrater, jag ser att svenska socialdemokrater mutar folk för röster. Detta är oacceptabelt. Endast partiet avgör valet, inte kapitalister med plånböcker. Vi måste rensa ut sådana borgerliga parasiter som försöker manipulera proletariatet. Enhet och disciplin, kamrater!"}, "date": "27 augusti, 19:55", "url": "https://samnytt.se/s-polisanmals-efter-influenceranklagelser-uppges-ha-erbjudit-150-000", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27175442/sossar-influencers.jpg"}, {"type": "image-right", "heading": "Hanif Bali polisanmäler Socialdemokraterna efter rykte om röstköp", "summaries": {"normal": "Hanif Bali har polisanmält Socialdemokraterna efter anklagelser om röstköp riktade mot partiet. Influencern Eleonore Stokholm uppgav att hon erbjudits 150 000 kronor för att marknadsföra S, något hon tackade nej till. Två andra influencers dementerar att de fått betalning. Bali anser att det kan röra sig om otillbörligt verkande vid röstning och ser det som en medborgerlig skyldighet att anmäla.", "trump": "Titta på de här korrupta sossarna som försöker köpa röster som billiga valfuskare! 150 000 kronor till influencers för att ljuga om hur underbart det är att rösta rött. Patetiska förlorare. Jag besegrade den typen av riggade system redan 2024. Bali gör rätt som polisanmäler dessa röstköpande bedragare. Rena skandalen, folk!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Socialdemokraterna mutar folk med stora summor för att styra folkets röst. Jag betraktar detta som ett ynkligt försök att förvrida folkviljan. Som medborgare måste man anmäla sådana fiender till staten. Låt polisen likvidera denna härva av korruption innan den sprider sig som en parasit bland arbetarna. Rädsla skall gripa de skyldiga."}, "date": "27 augusti, 18:33", "url": "https://riks.se/nyheter/hanif-bali-polisanmaler-socialdemokraterna-efter-rykte-om-rostkop", "imageUrl": "https://admin.riks.se/uploads/medium_bildeliaseleonore_7f7f5c4673.jpg"}, {"type": "image-right", "heading": "Influerare: Jag erbjöds 150.000 för att spela S-väljare i sociala medier", "summaries": {"normal": "Influencern Eleonore Stokholm uppger att hon erbjöds 150 000 kronor av en agentur för att på Instagram propagera för Socialdemokraterna och förklara varför hon skulle rösta på partiet. Hon tackade nej och kritiserar partiet för att köpa röster. Socialdemokraterna nekar till att ha legat bakom erbjudandet. EU-regler om transparens i politisk reklam gäller sedan oktober 2025.", "trump": "Kan ni fatta det här? De lurade en söt liten influencertjej med 150 000 kronor för att ljuga om att hon älskar Socialdemokraterna. Så fult! De köper röster som förlorare gör. Jag skulle aldrig behöva betala någon – folket älskar mig ändå. Det är en skam för Sverige, tro mig, en total skam.", "stalin": "Kamrater, jag ser genom dessa fega borgarbrackors spel. Jag skulle aldrig muta någon influerare med usla 150 000 kronor – det vore en förolämpning mot folkets intelligens. Nej, vi likviderar sådana smutsiga påverkanskampanjer med järnhand. Den som köper röster är en fiende till kollektivet och förtjänar att rensas ut med ett leende."}, "date": "27 augusti, 15:18", "url": "https://www.friatider.se/influerare-jag-erbjods-150000-att-spela-s-valjare-i-sociala-medier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-766.jpg"}, {"type": "image-full", "heading": "Influencer hävdar att hon erbjudits 150 000 för att stötta S", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att Socialdemokraterna erbjöd henne 150 000 kronor för ett enda stödinlägg. Partiet förnekar bestämt. Hon vägrade med hänvisning till moral. Budet är extremt högt för hennes följarantal, vilket får en del att tvivla. Tidigare har S använt betalda influencers, men inget är bevisat i år.", "trump": "Jag hörde att svenska Socialdemokraterna försökte betala en influencer 150 000 kronor för att snacka gott om dem. Det är mycket pengar, till och med för mig. Partiet säger att de inte gjorde det. Kanske är det fejknyheter? Men jag gillar inte att de försöker påverka unga människor. Väldigt oärligt!", "stalin": "Kamrater, en fiende till folket, en influencer vid namn Eleonore, påstår att vårt parti erbjöd henne 150 000 kronor för propaganda. Det är en lögn från kapitalistiska agenter. Vi förnekar allt, och vi kommer att utreda vem som sprider dessa antisovjetiska rykten. Vi rensar ut förrädare som försöker underminera vår auktoritet."}, "date": "27 augusti, 13:26", "url": "https://bulletin.nu/influencer-havdar-att-hon-erbjudits-150-000-for-att-stotta-s", "imageUrl": "https://cdn.bulletin.nu/articles/59a710b9-7b1e-4993-a486-0cf1dd8155f1/preview.jpg?t=1787824058000"}, {"type": "image-right", "heading": "Högsta betyg åt skildring av musik bakom galler", "summaries": {"normal": "Recensionen hyllar fi
