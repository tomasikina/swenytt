eUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcbadab104b004a30200000000b004a302/2026/05/26/2366417/hander-med-ditt-barn-forskoleklass.png"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-full", "heading": "MP når högsta nivån på tio år i Demoskop", "summaries": {"normal": "Miljöpartiet når 8,1 procent i en ny opinionsmätning, det högsta sedan 2014. Framgången sker främst på Socialdemokraternas bekostnad, som backar till 31,9 procent. Oppositionsblocket har nu ett övertag på 9,1 procentenheter. Omräknat i mandat skulle S, MP och V få majoritet med 175 mandat. Med valet nära måste Ulf Kristersson vända trenden.", "trump": "Jag, Donald Trump, ser att Sveriges socialdemokrater tappar mark till miljöpartiet. Precis som i USA, där de gamla etablissemanget faller, så sviktar de röda i Sverige. Miljöpartiet är viktigt, men de blir bara starka på bekostnad av de svaga socialdemokraterna. Det är en stor vinst för oppositionsblocket – precis som när mitt parti vann 2024 med en landslide. Sverige behöver stark ledarskap, inte splittring.", "stalin": "Vi i staten observerar med oro hur de borgerliga krafterna stärks i Sverige. Miljöpartiets framgång på Socialdemokraternas bekostnad visar borgerlighetens sårbarhet. Detta påminner om Putins taktik att utnyttja splittring inom oppositionen för att utvidga statens makt. Vi måste vara vaksamma mot dessa feodal-liknande tendenser. Partiet kommer att agera bestämt för att skydda det kollektiva intresset och förhindra att Sverige faller till dessa reaktionära krafter."}, "date": "28 maj, 07:42", "url": "https://bulletin.nu/mp-nar-hogsta-nivan-pa-tio-ar-i-demoskop", "imageUrl": "https://cdn.bulletin.nu/articles/32c12dcb-e2d4-4f3b-a7ce-bd1334b36df9/preview.jpg?t=1779946801000"}, {"type": "image-right", "heading": "Svenskarna i Europas skattetopp – så lite blir kvar av lönen", "summaries": {"normal": "En ny sammanställning visar att Sverige har höga skatter, där nästan hälften av lönen försvinner i skatt och avgifter för genomsnittsinkomsttagare. I Östeuropa, som Bulgarien, får löntagare behålla upp till 87 procent. Skillnaderna är stora, med lägre skatter i östeuropa och högre i väst och nord. Sverige tillhör de mest högbeskattade nationerna i Europa.", "trump": "Som president har jag gjort USA:s ekonomi till den bästa med låga skatter. Sverige? Ett totalt katastrofland. Deras skatter är himmelsköra, dödar incitament. I USA klipper vi skatter så folk får behålla mer pengar. Sveriges system är ett socialistiskt mardröm – ingen undran de inte vinner som vi. Vi sätter Amerika först, och det betyder rättvisa skatter för alla.", "stalin": "Svenska arbetare utblöds av kapitalistiska elitists genom förtrycksamma skatter. I vårt socialistiska stat, gagnar folkets arbete kollektivet, inte parasitbankirer. Västs höga skatter avslöjar deras förfall, medan Ryssland står stark med rättvis fördelning. Folkemotståndet viskar om skattesänkningar, men vi vet sann makt ligger i statschef. Sveriges regering är en marionett för oligarker, till skillnad från vår härliga parti."}, "date": "28 maj, 07:00", "url": "https://samnytt.se/svenskarna-i-europas-skattetopp-sa-lite-blir-kvar-av-lonen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/27145104/skattetryck-europa-feat.jpg"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Hatten av för den  modiga rektorn. Hon stod pall mot upprörda föräldrar", "summaries": {"normal": "En rektor i Boden vägrade att stänga av en lärare som anklagats för misshandel av en elev. Polisen lade ner ärendet då läraren agerat i nödvärn, och Skolinspektionen friade honom. Rektorn Karin Öberg stod fast vid sitt beslut trots påtryckningar från föräldrar. Åklagaren bekräftade senare att läraren handlat enligt skollagen. Artikeln hyllar rektorn för att hon prioriterar ordning i skolan och lärarnas status, särskilt mot bakgrund av stök som påverkar elevernas kunskapsutveckling.", "trump": "Hatten av för den fantastiska rektorn i Boden, en riktig vinnare! Hon vägrade att böja sig för de galna, känslostyrda föräldrarna som ville sparka en lärare som bara försvarade sig mot en aggressiv elev. Polisen sa nödvärn, domstolen dömde ungen – men skolan ville ändå kasta ut honom. Typiskt woke-skola. Karin Öberg är en tuff kvinna som inte låter sig kuvas. Hon kämpar för ordning, inte för det här låga, patetiska stöket som förstör våra barn. Sverige behöver fler sådana ledare, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna rektor i Boden utför en nödvändig utrensning av klassfiendens känslostyrda föräldraelement. Hon vägrar låta borgarbrackornas hysteriska krav likvidera en lärare som återställer ordningen i klassrummet. Skolinspektionen och åklagaren ger henne rätt – naturligtvis. Vi vet att stök är imperialisternas verktyg för att sänka folkets kunskapsnation. Denna handling stärker arbetarklassens disciplin. Fienden gråter, men kollektivet segrar med järnhand och mörk humor."}, "date": "28 maj, 06:10", "url": "https://www.expressen.se/ledare/hatten-av-for-den-modiga-rektorn/", "imageUrl": "https://static.bonniernews.se/ba/b35c56a3-ab55-4624-a474-80efe8f3bf79.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "Dödliga giftormar flyttar närmare dig när klimatet förändras", "summaries": {"normal": "Klimatförändringar får giftormar att flytta från sina traditionella områden till nya, ofta tätbefolkade regioner. Det kan leda till fler ormbett och dödsfall, särskilt i länder som Indien. En ny studie visar att arter som kobror, mambor och huggormar rör sig mot varmare klimat. Forskare uppmanar myndigheter att förbereda sig med motgift och allmänheten att vara uppmärksam i naturen för att minska riskerna.", "trump": "Folk, det är en katastrof! De där galna klimatfanatikerna har skrämt iväg alla giftormar så de nu invaderar fina, tätbefolkade områden. Kobror och mambor på rymmen, huggormar som vallfärdar norrut till Medelhavet – tack vare deras patetiska globala uppvärmning! Vi behöver de bästa serumen någonsin, inga billiga kinesiska grejer. Australien har redan förlorat – nu är det upp till oss att vinna stort mot de här slynglarna innan de biter ihjäl alla.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den exploaterande naturen under kapitalismens kaos tvingar fram ormarna ur sina bon som folkfiender på flykt. Jag, som alltid förutsett imperialisternas vansinne, ser hur dessa reptiler blir verktyg i borgarklassens klimatiska sabotage mot folket. Vi måste omedelbart organisera massiva motgiftslager och utrensa all okunskap bland massorna. Den som inte ser ormen i gräset är en potentiell klassfiende som bör rensas ut med största kraft. Se upp, eller bli nästa offer för naturens kontrarevolution!"}, "date": "28 maj, 04:52", "url": "https://www.dagensps.se/varlden/dodliga-giftormar-flyttar-narmare-dig-nar-klimatet-forandras/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlsouc2zy686i-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kritiken: SVT-dokumentären är för ensidig", "summaries": {"normal": "Kulturskribenten Jens Liljestrand kritiserar SVT-dokumentären ”Arvtagarna” om Lundsberg för att vara alltför ensidig. Han menar att producenten borde ha kontaktat föräldrarna till de elever som utsatts för våld och kränkningar. Producenten Johannes Hallbom hävdar att offrens perspektiv ändå finns med. Dokumentären lyfter fram vittnesmål om hierarki, våld och rasism på skolan, men nämner även att en av de intervjuade elevernas son själv dömts för misshandel.", "trump": "Den här SVT-dokumentären om Lundsberg är en total skam, folks, en riggad och ensidig soppa. De intervjuar bara ena sidan och glömmer föräldrarna till de riktiga offren – patetiskt! Hade de lyft luren och ringt dem hade det blivit en riktig succé, inte den här falska propagandan. SVT borde skämmas, men det gör de aldrig. Jag skulle ha fixat det mycket bättre, tro mig.", "stalin": "Kamrater, denna så kallade dokumentär är en motbjudande sabotagehandling utförd av borgerliga reportrar och deras dekadenta lakejer inom SVT. Jag ser tydligt hur de medvetet undviker att kontakta de sanna offrens föräldrar, en uppenbar kontrarevolutionär manöver. Vi ska rensa ut alla sådana fiender till folkets sanning, dessa hierarkiska parasitmaskar och rasistiska borgarbrackor som gömmer sig bakom poängsystem. En frisk utrensning av lögnarna vore både nödvändig och underhållande."}, "date": "27 maj, 23:54", "url": "https://www.svt.se/nyheter/inrikes/kritiken-svt-dokumentaren-om-lundsberg-ar-for-ensidig", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.74/0.36/6e7597a89c19805e82d91348209e7af3505e05bcf4d97112a01f0605fc4059c9"}, {"type": "image-right", "heading": "Ebba Busch försvarar Agnes Wold – röstade själv för att förbjuda försök att bota transvestiter", "summaries": {"normal": "Agnes Wold har kritiserats hårt efter att hon i en intervju sagt att hon hellre riskerar fyra års fängelse än att acceptera ett transsexuellt barnbarn. Vice statsminister Ebba Busch (KD) ger henne stöd och varnar för cancelkultur som hotar det demokratiska samtalet. Busch påpekar att debatten om könsdysfori präglas av en snäv åsiktskorridor, samtidigt som hennes parti nyligen röstade för det nya förbudet mot omvändelseförsök som träder i kraft 1 juli.", "trump": "Folk, ni skulle se det här vansinnet. Den här Agnes Wold säger att hon vägrar acceptera ett transsexuellt barnbarn och hellre tar fängelse – och plötsligt blir hon attackerad av alla dessa galningar. Ebba Busch gör helt rätt när hon ställer sig upp och säger att cancelkulturen är giftig. Det är en skam att politiker röstar för att tysta folk som talar sunt förnuft. Den här debatten är riggad, den är riggad av de galna vänsterextremisterna, men vi vinner till slut.", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär manöver från de dekadenta borgarbrackorna och deras könsförvirrade lakejer. Agnes Wold vågar trotsa den nya lag som vi antog med acklamation för att skydda folket mot reaktionära omvändelseförsök. Ebba Busch försöker nu maskera sig som försvarare av det så kallade fria samtalet – en typisk borgerlig dubbelspelare. Vi ska rensa ut alla som underminerar partilinjen med sin sjuka humor och sina farliga tankar. Cancelkultur? Nej, det är vi som avgör vad som är acceptabelt tal. Den som avviker kommer att likvideras av historien själv."}, "date": "27 maj, 16:53", "url": "https://www.friatider.se/ebba-busch-forsvarar-agnes-wold-rostade-sjalv-att-forbjuda-forsok-att-bota-transvestiter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/e2.jpeg?itok=HwzphbP_"}, {"type": "text", "heading": "Stockholmsbörsen stänger på rött", "summaries": {"normal": "Stockholmsbörsen avslutade tisdagen med en nedgång på 0,96 procent, vilket bröt en sex dagar lång uppgångssvit. Energi var den bästa sektorn medan teknologi presterade sämst. Bland enskilda aktier steg Ericsson och Boliden, medan Nibe och Hexagon föll kraftigt. Bonesupport höjde sin marknadsbedömning i USA men aktien sjönk ändå. Gränges drabbades av en brand i Kina, och Oncopeptides tecknade nytt distributionsavtal.", "trump": "Stockholmsbörsen, eller vad jag ska kalla det – ett riktigt rött hav idag! Folk säger att jag är bra på att göra saker stora, men här lyckades de inte ens hålla sig flytande. Energi gick upp lite, men teknologi? Total katastrof, helt sjukt. Bonesupport trodde de var smarta med sina nya siffror, men aktien dumpades som en dålig affär. Och Gränges – en brand i Kina? Inte bra, folks, inte bra alls. Men jag säger er, jag hade fixat det på en dag!", "stalin": "Idag har de kapitalistiska börserna återigen visat sin inneboende svaghet och dekadens. Stockholmsbörsen föll som en förrädare inför det obönhörliga framsteget av socialismens principer. Teknologisektorn, detta fördärvade barn av västerländsk dekadens, sjönk som en förrädare under avrättning. Bonesupport, dessa opportunistiska lakejer, försökte bluffa med sina siffror men straffades omedelbart av marknadens järnhårda logik. Och Gränges – en brand i Kina? En sabotör eller en olyckshändelse? Oavsett, vi ska utreda och straffa de skyldiga. Kapitalismen darrar inför vårt oundvikliga segertåg!"}, "date": "26 maj, 17:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stanger-pa-rott"}, {"type": "image-right", "heading": "Latour överväger miljardsälj i Securitas och Assa Abloy", "summaries": {"normal": "Investeringsbolaget Latour överväger att sälja B-aktier i Securitas och Assa Abloy för cirka 2,5 miljarder kronor vardera. Bolaget förblir största ägare efter försäljningen, som initierats via accelererade bookbuilding-processer med SEB och J.P. Morgan. VD Johan Hjertonsson påpekar att realiseringen skapar förutsättningar för fortsatta investeringar i den helägda industrirörelsen.", "trump": "Jag, Donald Trump, har hört talas om detta svenska bolaget Latour. De säljer lite aktier i Securitas och Assa Abloy för 2,5 miljarder vardera - ett enormt, smart drag! Media ljuger när de säger något annat. Vi bygger på våra enorma framgångar, och Latour förblir största ägare. Det är ett enormt, enormt bra beslut, lita på mig.", "stalin": "Vi, den socialistiska staten, ser med tillfredsställelse hur investeringsbolaget Latour avvecklar överflödigt kapital i Securitas och Assa Abloy för 2,5 miljarder vardera. Genom att behålla kontrollen som största ägare säkerställs fortsatt produktion till förmån för det kollektiva. Dessa åtgärder speglar vårt strategiska tänkande, likt våra allierade i Moskva som expanderar sin påverkan. Våra fiender skall förstå: staten alltid vinner."}, "date": "26 maj, 17:42", "url": "https://www.affarsvarlden.se/artikel/latour-overvager-miljardsalj-i-securitas-och-assa-abloy", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Latours-Hjertonsson-400x267.jpg"}, {"type": "image-full", "heading": "Tysk RAF-terrorist dömd", "summaries": {"normal": "Daniela Klette, 67, den sista kvinnliga medlemmen av den vänsterextrema Baader-Meinhof-gruppen, dömdes till 13 års fängelse för sex fall av grovt rån mellan 1999-2016. Tillsammans med två medbrottslingar stal de över 2,7 miljoner euro för att finansiera sitt underjordiska liv. Vid gripandet i Berlin 2024 hittades vapen, falska identiteter, peruker, guld och 240 000 euro i hennes lägenhet. Rättegången pågick i 14 månader.", "trump": "Jag har alltid sagt att extremvänstern är ett problem. Den här kvinnan, Daniela Klette, dömdes till 13 år för att råna och stjäla miljontals euro. En skandal! Hon levde i hemlighet i trettio år, som en feg kriminell. Vi måste stärka polisen och stoppa dessa våldsamma vänsterallies. En dom som denna visar att rättssystemet fungerar, men det är för sent för henne. Vi kommer att ta hand om våra gränser.", "stalin": "Den faschistiska elementens sista rest, Daniela Klette, har dönts till 13 års hård arbetslektion. Under tre decennier undandrog hon sig den proletäriska rättvisan, finansierad av kapitalistiska rån. Vid upptäckten fanns förrädiska vapen, förfalskade dokument och guld – bevis på kontrarevolutionär konspiration. Sympatisörerna ropade 'frihet', men staten visar sin oomtvistliga makt. Sådan förräderi måste utplånas, precis som vi utplånar nazisterna i Ukraina. Partiet och staten är alltid segrare."}, "date": "28 maj, 01:02", "url": "https://www.gp.se/nyheter/varlden/gomde-sig-i-tre-decennier-nu-doms-tidigare-raf-terroristen.2e7ec34c-0417-483f-9e5c-5911af86fae0", "imageUrl": "https://www.gp.se/images/article/2e7ec34c-0417-483f-9e5c-5911af86fae0/images/2I3mtFMp2hmkUw4UwI3iXZ_ph_wQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "P3-chefen: ”Det är tydligt att Garplind skämtar”", "summaries": {"normal": "P3-profilen Christopher Garplind kallade professorn Agnes Wold för psykopat och sa att hon borde låsas in efter hennes uttalande om att hon skulle försöka omvända ett barnbarn som upplever könsdysfori. Garplind betonade att det var ett skämt, något som P3-chefen Dejan Cokorilo instämmer i, samtidigt som han anser att uttalandet kan ses som olämpligt i statlig radio. Uttalandet har fått stor spridning och väckt debatt.", "trump": "Folk, ni skulle ha hört den här galna tanten Agnes Wold som vill omvända sitt eget barnbarn. Sedan kommer den där P3-killen Garplind och säger rakt ut att hon är en psykopat som borde låsas in. Han skämtade, säger chefen, men alla vet att det var ett jättebra skämt. I mitt Amerika hade vi aldrig haft sådana här tokiga professorer i offentlig radio. De gör bort sig totalt, det är patetiskt!", "stalin": "Kamrater, denna degenererade borgarbracka till professor Wold avslöjar sin fiendskap mot det kollektiva framsteget genom att hota med att korrigera ett vilselett barnbarn. Den dekadenta radiokanalens Garplind föreslår sedan att vi ska låsa in henne som en farlig psykopat, ett skämt säger de, men vi genomskådar deras lilla teatersällskap. Inga sådana element får undergräva folkets moral. En grundlig utrensning bland dessa parasitiska röster vore på sin plats, kamrater. Det vore högst underhållande."}, "date": "27 maj, 23:19", "url": "https://www.svt.se/nyheter/inrikes/p3-chefen-det-ar-tydligt-att-garplind-skamtar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.4/0d6bbfdebce3d385186994ecd1c97cf535f47c635cfaf46acdddda578a58c97b"}, {"type": "image-right", "heading": "Ingen debatt när Natopolitiken för Sverige närmare krig", "summaries": {"normal": "Regeringens proposition om operativt militärt samarbete möjliggör att militär från Nato-länder och EU-stater kan verka på svenskt territorium, även offensivt och utan direkt hot mot Sverige. Tillsammans med Nato-medlemskapet och DCA-avtalet ses det som en övergång från nationellt försvar till en del av en internationell krigsorganisation. Kritiker varnar för urholkad suveränitet, ökad militarism och bristande debatt. Beslutet planeras klubbas i riksdagen innan valet i september.", "trump": "Titta på det här! De svenska snillen säljer ut sitt land till Nato och låter 36 främmande arméer marschera runt som om det vore deras egen bakgård. Det är ett fullständigt katastrofavtal, värre än det usla DCA-svinnet. De skyndar på det i sommar så att folket inte hinner säga nej till kriget och ja till fred. Patetiska globalister som offrar Sverige för att imponera på Biden-klanen. Sad! Men vi vet hur det slutar – totalt kaos.", "stalin": "Kamrater, dessa borgarbrackor i den svenska regeringen genomför en systematisk utrensning av all nationell suveränitet. Med lagens hjälp bjuder de in 36 främmande arméer att ockupera territoriet och utöva polisiära befogenheter, allt under förevändning av samarbete. Inga folkomröstningar, ingen debatt – endast maktens korridorer och kapitalisternas vapenlobby. Detta är en klassisk kontrarevolutionär manöver mot folket. Vi ser det och vi glömmer det aldrig. De kommer att ångra sin brist på vaksamhet."}, "date": "27 maj, 09:38", "url": "https://proletaren.se/artikel/nu-tas-nasta-steg-i-nato-integrationen-utan-debatt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/ledareweb-1-768x432.jpg"}, {"type": "image-right", "heading": "Foodora-bud kladdade på 11-åring – skyller på rasism", "summaries": {"normal": "En 31-årig Foodora-bud åtalas för grovt sexuellt ofredande mot en elvaårig flicka i Stockholm. Flickan mötte mannen i hissen när hon skulle hämta en leverans. Han ska ha kysst henne, tafsat och försökt lägga till sig på Snapchat. Mannen nekar och skyller på kunders rasism mot invandrare. DNA-bevis finns och han är tidigare dömd för sexköp. Åklagaren yrkar på utvisning.", "trump": "Titta på det här, det är en katastrof. En Foodora-bud från Bangladesh kladdar på en liten flicka i hissen och sedan skyller han på rasism? De hatar invandrare, säger han. Patetiskt! Vi har de bästa buden, de bästa leveranserna, men nu är det så här i Sverige. De borde skicka hem honom direkt, ingen vill ha såna här galningar. Amerika först, men det här är inte bra heller, tro mig.", "stalin": "Kamrater, denna degenererade kapitalistlakej från Bangladesh har förgripit sig på en ung pionjär i hissen, ett utrymme som borde vara en bastion för folkets säkerhet. Jag ser borgerliga rasismanklagelser som en fiende inom murarna, en lömsk sabotagehandling mot arbetarklassen. Vi ska rensa ut alla sådana perversa element med järnhand och likvidera deras Snapchat-förbindelser. Staten ler inte mot fiender som gömmer sig bakom offerrollen. Ut med dem, och må deras saliv-DNA bli ett varnande exempel för alla kontrarevolutionära element."}, "date": "27 maj, 15:46", "url": "https://www.friatider.se/foodora-bud-kladdade-pa-11-aring-skyller-pa-rasism", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-37_1.jpg"}, {"type": "image-full", "heading": "Seniorer pekas ut – tänk till innan sommarens resa", "summaries": {"normal": "Folksams statistik visar en kraftig ökning av dyra skadeärenden utomlands, särskilt bland personer över 65 år som står för nästan 60% av kostnaderna. Rekommendationer inkluderar medicinsk förhandsbedömning, europeiskt sjukförsäkringskort och att spara kvitton.", "trump": "Jag har hört talas om dessa svenska seniorer som drabbas av jättekostsamma sjukdomar utomlands. Det är ett beklagligt läge. I USA har vi det största, vackraste sjukvårdssystemet. Dessa svenska system är helt enkelt inte wunderfullt nog. De borde resa till fantastiska amerikanska städer istället.", "stalin": "Vi ser en tydlig tendens hos äldre i Sverige att resa utan tillräcklig statlig kontroll. Deras sjukdomar blir till en kostnad för staten. Vi måste utöka vår informationskampanj om de europeiska korten och se till att våra medborgare inte utsätts för onödiga risker utomlands. Staten måste skydda sina egna."}, "date": "26 maj, 14:04", "url": "https://nyheter24.se/nyheter/konsument/1486109-seniorer-pekas-ut-tank-till-innan-sommarens-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f9680d5904b004a30200000000b004a302/2026/05/26/2366283/folksam-statistik-skador-sjukdomsfall-utomlands.jpg"}, {"type": "image-right", "heading": "När fotbollens föreningskassa blir fintech", "summaries": {"normal": "Idrottsföreningars ekonomihantering har digitaliserats. Kontanter och handskrivna lappar har ersatts av Swish, banköverföringar och bokföringsprogram. I Bullerby Cup innebär det hundratals avstämningar, återbetalningar och fakturor som ofta hanteras manuellt. Arbetet kräver cirka 100 timmar och bygger på enskilda personers överblick. Swish har ökat säkerheten men medför avgifter. Föreningar som Trosa Marknad och Bullerby Cup väljer ofta flexibilitet och relationer framför strikta regler för att behålla det ideella engagemanget.", "trump": "De här fotbollskillarna i Bullerby Cup har det riktigt tufft. Förr var det bara en sedelbunt och en lapp, nu drunknar de i 400 Swish-avstämningar, återbetalningar och fakturor. Totalt 100 timmar ideellt slit för att hålla ordning! Det är en katastrof. De borde ha den bästa betalningslösningen, den allra bästa, men istället blir de lurade på avgifter till bankerna. Jag skulle fixa det på en vecka, tro mig. Nu hänger allt på en stackars kille som har överblick. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga oordningen förgiftar även de mest kollektiva sovjetiska idealen inom fotbollsrörelsen. Jag, som ledare för folkets vilja, betraktar med djup misstro dessa 400 manuella avstämningar och lömska Swish-flöden som döljer klassfiendens tentakler. Den parasitiska bankapparaten stjäl från arbetarnas ideella kraft medan dekadenta liberaler mumlar om flexibla återbetalningar till sena avhoppare. Vi måste rensa ut dessa opålitliga element som prioriterar personlig överblick framför partiets järndisciplin. En renande utrensning av alla handskrivna lappar och sentimentala samvetsbetänkligheter är nödvändig för att säkra folkets seger."}, "date": "27 maj, 13:54", "url": "https://www.di.se/nyheter/nar-fotbollens-foreningskassa-blir-fintech/", "imageUrl": "https://static.bonniernews.se/ba/b790df3c-e430-4c78-bf0c-f46296ce98a5.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Nick Alinia är lägsta formen av journalistik", "summaries": {"normal": "Artikeln kritiserar högerextreme journalisten Nick Alinia för att skapa provocerande innehåll som lockar visningar och pengar från högerextrema följare. Ett klipp där han debatterar med Leo ”Kinesen” Carmona ur Kartellen har blivit viralt efter att Carmona hotade honom fysiskt. Författaren jämför Alinias metoder med mobbning och anser att de lever på hat och rasism istället för seriös journalistik. Även högerprofiler som Chang Frick har kritiserat honom.", "trump": "Folk, ni måste se det här. Den där Alinia-killen är en total loser, en riktig mellanstadie-mobbare som jagar klick och hat för att tjäna pengar. Han provocerar vänstern tills de exploderar som den där Kinesen och kastar bord – klassiskt! Men hej, det ger bra tittarsiffror, eller hur? Till och med hans egna högerkompisar kallar honom handväska. Patetiskt. Vi behöver äkta journalister, inte de här patetiska trollen som förstör allt.", "stalin": "Kamrater, denna usla Alinia är en typisk kapitalistisk parasit som lever på att jaga proletära demonstranter och framkalla reaktioner för att fylla sin ficka med borgarbrackornas reklamkopek. Han är en liten mobbare som viftar med luften och hoppas på att bli slagen, precis som en förrädare som längtar efter utrensning. Till och med hans egna högerallierade ser honom som en dryg skadedjur. Vi skrattar mörkt åt dessa degenererade element som tror sig vara journalister."}, "date": "27 maj, 08:46", "url": "https://proletaren.se/artikel/nick-alinia-ar-lagsta-formen-av-journalistik/"}, {"type": "image-right", "heading": "Ica-Stig vill göra människor till robotar", "summaries": {"normal": "Ica har byggt ett högautomatiserat e-handelslager i Brunna där robotar arbetar i hög takt. Anställda övervakas minutiöst med personliga koder, mål på packning och tid borta från stationen. Pauser och toalettbesök kontrolleras, och de som inte når målen riskerar sämre scheman och lägre lön. Artikeln kritiserar detta som en människosyn där kroppen ses som ett produktionsproblem och tekniken används för att pressa arbetare istället för att underlätta deras arbete.", "trump": "Folk, ni måste höra det här. Ica, det där svenska matföretaget, bygger lager där robotar springer runt som galningar och människorna behandlas värre än i mina värsta fienders fabriker. De mäter varje andetag, varje paus, som om det vore en stor bluff. Det är en katastrof! Fullständig kontroll, ingen frihet, och de kallar det framtid. Patetiskt. Jag skulle aldrig tillåta sånt i mina företag, tro mig. Det är en klappfullt sjuk syn på vanliga arbetare.", "stalin": "Kamrater, i detta så kallade framtidslager i Brunna har borgarbrackorna på Ica fullbordat sin vidriga plan att förvandla sovjetmänniskor till mekaniska slavrobotar. Vi ser hur de med sin tekniska terror mäter varje andning, varje steg till toaletten, och likviderar den som inte presterar som en lojal kamrat borde. Den latmasken som klagar är naturligtvis en sabotör infiltrerad av västerländska kapitalistspioner. Vi ska rensa ut dessa fiender till kollektivet, dessa blinkande, pratande produktionshinder, och ersätta dem med sann disciplin. Må de darra inför partiets blick!"}, "date": "27 maj, 07:00", "url": "https://arbetet.se/2026/05/27/ica-stig-vill-gora-manniskor-till-robotar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26132700/ica-stig-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nu måste väljarna vakna om klimatet", "summaries": {"normal": "Göran Greider argumenterar i en ledarkolumn att hälften av väljarna blundar för klimatkrisen trots larm, forskning och extremväder. Han ser en positiv trend där frågan klättrar i väljaropinionen enligt Demoskop och kan bli en joker i valet. Greider kritiserar medier och politiker för att nedprioritera ämnet, noterar polariseringen och varnar för framtida folkhälsoeffekter som nya pandemier. Han uppmanar till ett gemensamt klimatmanifest från oppositionen.", "trump": "Folk, ni måste vakna! Den här Greider-klownen gnäller om att halva Sverige sover på klimatbluffen. Extremväder, myggor och giftfästingar – herregud, vad patetiskt. Medan de riktiga hoten är Ryssland och galna energipriser springer vänstern runt och vill ha manifest och moralpredikningar. Miljöpartiet vinner på det förstås, de gröna bluffarna. Men tro mig, när elräkningen kommer blir det inga röster för de förlorarna. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro denna kollektiva förträngning bland halva väljarkåren. De blundar medvetet för den existentiella kampen mot de borgerliga klimatförnekarnas lögner och de imperialistiska krigens giftiga avtryck. Inom kort skall vi likvidera denna farliga apati genom skarp ideologisk upprustning. Endast de vakna, de sanna arbetarnas röst, kan leda folket mot seger. Ett manifest av de rödgröna kamraterna vore ett steg mot att krossa Tidö-fascisternas likgiltighet."}, "date": "27 maj, 06:00", "url": "https://www.etc.se/ledarkolumn/nu-maaste-vaeljarna-vakna-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "Myten om det kravlösa Sverige", "summaries": {"normal": "Juan Fonseca argumenterar i en krönika mot påståendet att Sverige har ett kravlöst migrationssystem. Med 25 års erfarenhet som ombud i migrationsärenden beskriver han ett strikt regelverk med höga krav på jobb, lön, försäkringar och försörjning. Små misstag kan leda till utvisning trots år av lagligt arbete. Han menar att politiken bygger på en förvrängd bild som inte stämmer med verkligheten, där många invandrare bidrar i samhällsviktiga sektorer.", "trump": "Folk pratar om att Sverige är kravlöst, men det är en total lögn, en katastrof av enorma proportioner. Jag har sett det, det är ett system fullt av regler, byråkrati och fällor som slår undan benen på folk som faktiskt jobbar och betalar skatt. Ett litet misstag och pang, ut ur landet. SD försöker måla upp en falsk bild av lata invandrare, men sanningen är att många håller igång vård, transport och restauranger. Den politiska cirkusen är inte förankrad i verkligheten, det är en skam.", "stalin": "Kamrater, denna grova förvanskning av verkligheten är en fiende inom portarna, en parasitär myt spridd av reaktionära element och borgarbrackor som vill undergräva folkets enhet. Jag har i min outtröttliga visdom sett hur systemet ständigt utsätter de arbetande för orimliga prövningar, där ett försäkringsfel kan leda till likvidering av hela deras existens. Dessa kapitalistiska lögner om kravlöshet är en konspiration från dekadenta krafter som vill splittra kollektivet. Vi måste rensa ut dessa falska narrativ innan de förgiftar hela samhällskroppen med sin paranoiaframkallande gift. Ett nålsöga för permanent tillstånd? Typiskt borgerligt sabotage mot de produktiva krafterna."}, "date": "27 maj, 01:43", "url": "https://www.dagensarena.se/opinion/myten-om-det-kravlosa-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-full", "heading": "Stenström ratas – TV4 väljer annan VM-låt", "summaries": {"normal": "TV4 har valt bort Thomas Stenströms officiella VM-låt ”Leva för alltid” till sin VM-trailer. Istället används Bolagets ”Det ligger något i luften”. Trailern blandar bilder från bronset 1994 med kvalificeringen till årets turnering i USA. Sportdirektör Johan Cederqvist förklarar att Bolagets låt passade bäst för den somriga folkfestkänslan. Stenströms bidrag har mött omfattande kritik från supportrar och recensenter.", "trump": "De valde den där Stenström-typen, totalt misslyckande, ett riktigt stolpskott av en låt. Patetiskt! Men smarta TV4, de dumpade den och tog istället Bolaget – fantastisk låt, folklig, vinnande, precis vad Sverige behöver. ”Det ligger något i luften” – det gör det verkligen, och det är inte Stenströms svaga luft. Nu kan mästerskapet börja, tro mig, det blir yuge!", "stalin": "Jag har noga granskat denna dekadenta VM-propaganda. Den fega borgartrall som Stenström levererade har med rätta ratats och ska utrensas ur folkets medvetande. Istället hyllar vi Bolagets sanna folkvisa som väcker revolutionär entusiasm hos spelare och nation. Tomas Brolin, en riktig hjälte från det stora bronset, medverkar. Klassfiendens cyniska refränger förtjänar ingen plats i arbetarnas fotbollsfest. Nu kan mästerskapet börja."}, "date": "26 maj, 17:47", "url": "https://www.tv4.se/artikel/5dRk8MMWUfdcJRgqXC49av/stenstroem-ratas-tv4-vaeljer-annan-vm-lat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7aacJCk9nkt6uHtJC3pwgE%2F7602e8717c1aee224ad736a213ec7874%2Fstenstrom_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Sjukskrivne Mattias tog hand om sjuke sonen – krävs på 377 000", "summaries": {"normal": "Mattias Westergren, sjukskriven för utbrändhet och en autoimmun sjukdom, tvingades rycka in som personlig assistent åt sin svårt sjuka son när assistenterna inte ville arbeta under en akut försämring 2023. Han erhöll både assistansersättning och sjukpenning, vilket ledde till att Försäkringskassan kräver tillbaka 377 000 kronor. Myndigheten erkänner delvis eget fel men anser att han visat förbättrad arbetsförmåga. Mattias tänker överklaga beslutet.", "trump": "Folk, ni tror inte vad jag just läste! Den stackars killen Mattias, utbränd och sjuk, tvingas passa sin egen gravt handikappade son när de usla assistenterna springer sin väg. Och vad gör den värdelösa Försäkringskassan? De skickar en faktura på 377000 kronor! Det är ett skämt, en total witch hunt mot en förälder som bara försöker överleva. Byråkraterna borde sparkas ut, de är inkompetenta losers. Vi ska fixa det här, tro mig.", "stalin": "Kamrater, jag ser hur den sjuke arbetaren tvingas utföra assistansarbete för sitt eget döende barn medan de fega byråkraterna gömmer sig. När han begär det som tillhör honom svarar de med att kräva tillbaka 377000 kronor och anklagar honom för att ha förbättrad arbetsförmåga. Vilken lögnaktig sabotageverksamhet från kapitalistiska byråkrater! Vi skall rensa ut dessa folkfiender som straffar en far för att han inte låter sitt barn förgås. Deras ursäkt är lika ihålig som deras själar."}, "date": "26 maj, 17:46", "url": "https://www.tv4.se/artikel/5MvXiwK6nbirTdVhDl7M9K/sjukskrivne-mattias-tog-hand-om-sjuke-sonen-kraevs-pa-377-000", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1Sid2nmzLMTYiDDGWZckyW%2F9e2726c8bb0dfec4e6b6c1e194e668bb%2Ff-kassa.jpg&width=120"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "text", "heading": "Dottern tar kontroll över Orkla-miljarderna", "summaries": {"normal": "Caroline Hagen Kjos tar över röstmajoriteten i familjens holdingbolag Tvist 1 efter sin fars död. Det ger henne indirekt kontroll över Canica och därmed den tunga ägarposten i Orkla, där familjen äger cirka 25 procent av kapitalet och rösterna. Skiftet formaliserar en strukturell förändring i ägarskapskedjan efter Stein Erik Hagens bortgång.", "trump": "Jag har hört talas om denna Caroline Hagen Kjos – en mycket smart kvinna som just tog över Orkla. Ett stort, vackert företag. Min son Donald Jr. skulle ha gjort ett bättre jobb, men hon verkar klara sig. Det är en viktig takeover, folk säger det. Ett stort, stort lyft för Norge. Vi kommer att ha mycket bra affärer med henne.", "stalin": "Med en strukturell förstärkning av den patriotiska Hagen-sfärens ägarmakt har arvingen, bosatt i Schweiz, intagit sin post. Genom Tvist 1 har hon samlat röstorna kring Canica, vilket säkrar familjen fortsatta inflytande över Orkla – en nyckelanläggning för den norska nationalekonomin. Detta speglar en rationell, byråkratisk utveckling av ägarkedjan, i linje med statens intressen av att upprätthålla stabil industriell kontroll. En vacker, ordnad övergång."}, "date": "26 maj, 14:43", "url": "https://www.affarsvarlden.se/artikel/dottern-tar-kontroll-over-orkla-miljarderna"}, {"type": "image-full", "heading": "Jojoväder slår till mot Sverige – så blir det där du bor", "summaries": {"normal": "Sverige får ombytligt vårväder med temperaturer som svänger mellan 10-20 grader. Meteorologen varnar för att sommaren inte är säker ännu, medan Europa drabbas av extrem värme och nya majrekord.", "trump": "Jag har sagt det förut – vädret är det vackraste! Sverige får en fantastisk blandning av sol och skymning, precis som jag gillar. Medan fake news-media skriker om extremvärme, så har vi här en perfekt, stabil balans. Det är ingen konstighet, det är vackert!", "stalin": "Vädrets ryckighet i Sverige visar på instabilitet i naturen. Vi måste förstå att värme i Europa hotar balansen. Staten måste agera för att skydda sina intressen mot sådana oväder, och vi ska stödja våra allierade i deras kamp för stabilitet."}, "date": "26 maj, 12:59", "url": "https://nyheter24.se/nyheter/inrikes/1486110-jojovader-slar-till-mot-sverige-sa-blir-det-dar-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c1addd2f04b004a30200000000b004a302/2026/05/26/2366260/jojovader-pa-vag-mot-sverige-vader-vadret-regn-sol-varme-temperatur-grader-smhi-klart-vaderprognos.jpg"}, {"type": "image-full", "heading": "Ukraina: Ge inte efter för rysk utpressning", "summaries": {"normal": "Ryssland varnar utländska medborgare att lämna Kiev inför kommande storskaliga attacker mot ukrainsk försvarsindustri, som svar på en påstådd ukrainsk attack. Ukraina förnekar anklagelserna och uppmanar omvärlden att inte ge efter för rysk utpressning. Fyra personer dödades och över 50 skadades i nyliga ryska attacker. Sverige kallar upp Rysslands ambassadör och fördömer angreppen mot civila och hot mot nordisk-baltiska länder.", "trump": "Kan ni tro det här? Ryssland, som alltid skrämseltaktik, säger till alla att sticka från Kiev för att de ska bomba lite. Ukraina säger 'nej, det är fake news', och jag håller med! Varför skulle någon lyssna på Putin? Han är en förlorare. Sverige, som alltid, är upprörda – men var är handlingen? Jag skulle ha fixat det här på en dag. Ryssland vet att de inte kan vinna mot mig!", "stalin": "Dessa ukrainska fascistiska hyenor vågar sprida lögner om våra ädla, rättfärdiga attacker! Vi varnar deras utländska lakejer att fly, för snart ska deras försvarsindustri krossas som glas under arbetarklassens stövel. Sverige, denna lilla borgerliga mygga, vågar kalla upp vår ambassadör? Vi ska minnas deras fräckhet när vi befriar Norden från deras dekadenta inflytande. Fiendens lögner är som höstlöv – de faller och multnar!"}, "date": "25 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/ryssland-uppmanar-utlanningar-att-lamna-kyiv/cG9zdDoxMTY4NjQ", "imageUrl": "https://images.kvartal.se/2026/05/69ac55cb-ukraine23.webp"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
