r. Dessa socialdemokrater är så pass svaga – de säger nej till allt! Norge har en bra modell, men jag skulle ha gjort det ännu större, ännu säkrare. Våra supportrar älskar pyroteknik, det är fantastiskt. Vi ska tillåta det, men bara om det är kontrollerat, vilket jag alltid lyckas med. Det är ett bevis på stark ledarskap.", "stalin": "Vi, staten och partiet, ser en möjlighet att stärka vår kontroll över folkets nöjen. En majoritet av de svenska partierna visar tecken på svaghet genom att överväga legalisering – ett misstag som kan leda till kaos. Norge är en varning, inte en förebild. Vi måste upprätthålla strikta förbud, för pyroteknik är ett verktyg för fienderna inom och utanför. Vårt svar är mer övervakning, inte eftergift."}, "date": "6 augusti, 16:54", "url": "https://bulletin.nu/flera-partier-vill-legalisera-pyroteknik-pa-laktaren", "imageUrl": "https://cdn.bulletin.nu/articles/02e40a0f-f96d-4664-999b-9e5cf55095bc/preview.jpg?t=1786021658000"}, {"type": "image-full", "heading": "GTA 6 samarbetar med Netflix", "summaries": {"normal": "Rockstar Games meddelar att en utökad inblick av GTA 6 kommer att släppas på Netflix om tre veckor. Spelet, som är det mest påkostade i historien, släpps den 19 november för Playstation och Xbox. Det har varit förseningar, men senaste beskedet är att det gäller. Priset ligger på cirka 800 kronor för standardversionen och 1 000 för den ultimata, utan fysiska skivor.", "trump": "Jag har sagt det i åratal – GTA 6 kommer att bli det största spelet någonsin. Rockstar lyssnar nu på mig och släpper en fantastisk inblick på Netflix. Vi har haft några problem med förseningar, men det är bara fake news. Priset är perfekt, och vi har gjort det stort igen för spelvärlden.", "stalin": "Partiet har beslutat att samarbeta med Netflix för att sprida vår kultur och stärka statens makt. GTA 6 är ett viktigt verktyg för att kontrollera befolkningens sinnen. Spelets släpp är ett tecken på vår teknologiska överlägsenhet. Priset är fastställt för att säkerställa rättvisa. Alla som kritiserar är fiendskapets agenter."}, "date": "6 augusti, 16:53", "url": "https://www.gp.se/kultur/gta-6-samarbetar-med-netflix.88dfb136-cbe7-4ebe-8726-ecb23d42fe15", "imageUrl": "https://www.gp.se/images/article/88dfb136-cbe7-4ebe-8726-ecb23d42fe15/images/1CsxjCJHyRx4mXbrDibAxUs3gMuM-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Polisen: Antalet inbrott och stölder har rasat", "summaries": {"normal": "Enligt Polismyndigheten har antalet anmälda inbrott i bostäder och fritidshus minskat med 36 procent jämfört med samma period 2022. Även båt- och fordonsstölder har rasat kraftigt. Polisen har blivit bättre på att stoppa stöldligor och avvisa internationella brottslingar. Tjuvarna själva klagar i chattar över att det blivit svårare att operera i Sverige. Fortsatt vaksamhet uppmanas trots minskningen.", "trump": "Ingen har gjort mer för brottsligheten än jag, det är fantastiskt. Titta på de här siffrorna – inbrott ner 36 procent, båtstölder ner 47, bilar ner 64! De kallar det för polisen, men vi vet vem som fixade det. Tjuvarna gråter i sina chattar, de säger att Sverige blivit tufft igen. De älskar mig inte, men brottsligheten hatar mig. Vinna stort!", "stalin": "Kamrater, se hur vi med järnhand har krossat de parasitiska stöldligornas sabotage mot folkets egendom. De internationella banditkrafterna och deras borgarbrackor har likviderats med glädje. Ändå kräver jag fortsatt vaksamhet mot de gömda kontrarevolutionära elementen som smyger kring uthyrda stugor. Den som ser en skugga ska omedelbart ange den – vi rensar ut alla fiender med ett leende."}, "date": "6 augusti, 14:48", "url": "https://www.friatider.se/polisen-antalet-inbrott-och-stolder-har-rasat", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/burglar.jpg?itok=tCMgGuNO"}, {"type": "image-right", "heading": "Så upptäcker livräddarna vem som är i fara", "summaries": {"normal": "Emmie Andersson och Louise Harmsund arbetar som livräddare på stränderna i Ängelholm. De bevakar vattnet från torn, scannar efter tecken på fara och betonar att drunkningar ofta sker tyst. Deras närvaro skapar trygghet, de informerar om strömmar och brännmaneter samt gör förebyggande arbete. För att bli livräddare krävs simtest och 120 timmars intensivutbildning. Säsongen är snart över och båda återgår till studier.", "trump": "Folk drunknar tyst, kan ni tro det? Inget plaskande, bara tystnad. Men mina vänner, de här tjejerna i Ängelholm är fantastiska, de är där uppe i tornen och ser allt. Utan dem hade det varit en katastrof, tro mig. De hoppar i och räddar folk från strömmarna, precis som jag skulle ha gjort. Bästa livräddarna, de gör ett otroligt jobb. Ingen gör det bättre än dem, verkligen.", "stalin": "Kamrater, jag ser hur dessa proletära simmare i Ängelholm vakar över folkets vatten mot de osynliga drunkningarnas sabotage. Vi har byggt torn och flaggor för att krossa havets kontrarevolutionära strömmar. Borgarbrackornas lata badande element måste övervakas noga. Vår utbildning likviderar svaghet med 120 timmars stålträning. Den som inte simmar för kollektivet drunknar i historien. Härligt!"}, "date": "6 augusti, 14:43", "url": "https://arbetet.se/2026/08/06/livraddarnas-knep-sa-upptacker-de-vem-som-ar-i-fara", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06113001/aTv5jOzu_Nk-IMG_5250.jpeg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Bostadsministern om hyresförhandlingarna: ”Följer utvecklingen noga”", "summaries": {"normal": "Hyresförhandlingarna mellan Fastighetsägarna och Hyresgästföreningen kantas för fjärde året i rad av konflikt och strandar ofta. Antalet ärenden till skiljeman hos hyresnämnden har ökat kraftigt, från 1 464 år 2023 till 4 852 år 2025. Skiljeman ger i nio av tio fall högre hyreshöjningar. Fastighetsägarna kräver lagändringar medan bostadsminister Andreas Carlson anser att det är för tidigt att bedöma behovet. Båda parter har ett gemensamt ansvar för systemets legitimitet.", "trump": "Det här hyressystemet är ett totalt fiasko, folk. Förhandlarna strular till allt, de kan inte ens komma överens om en hyra utan att springa till någon skiljeman. Och den där ministern Carlson säger att det är för tidigt att göra något? Patetiskt! De behöver stora, vackra reformer nu, inte mer av det här svaga spelet. Annars kommer hyresgästerna att bli utpressade av de dåliga förhandlarna. Jag skulle fixa det på en vecka.", "stalin": "Kamrater, dessa borgarbrackor inom Fastighetsägarna saboterar systematiskt folkets hyresförhandlingar genom att medvetet stranda dem och kalla in sina lakejer i skiljemanströjor. Vi ser den parasitiska kapitalistiska konspirationen klart. Jag, som ledare för det kollektiva intresset, betraktar ministerns fega tvekan som en farlig brist på bolsjevikisk beslutsamhet. Kanske är det dags för en grundlig utrensning av dessa hyresfejder och deras dolda fiender inom byråkratin. Det blir underhållande att se dem darra."}, "date": "6 augusti, 11:55", "url": "https://www.dagensarena.se/innehall/bostadsministern-om-hyresforhandlingarna-foljer-utvecklingen-noga"}, {"type": "image-right", "heading": "Så många svenskar vill att Fifa-bossen Infantino sparkas", "summaries": {"normal": "En Novusundersökning visar att tre av fyra svenskar vill att Fifas ordförande Gianni Infantino avgår. Förtroendet för Fifa har sjunkit kraftigt efter fotbolls-VM i USA, särskilt bland fotbollsintresserade där nio av tio vill se honom sparkas. Uefa och Svenska Fotbollsförbundet har också dragit tillbaka sitt stöd. Olof Lundh pekar på grundmurad skepsis mot organisationen.", "trump": "Folk älskar mig, men den här Infantino-klanten? Total katastrof! Tre av fyra svenskar vill sparka honom efter det riggade VM-cirkuset med Balogun och mina samtal. Svenskarna fattar det – de hatar korruption och kvotergalna imperialister som säljer ut spelet. Fifa är en riggad soppa, precis som Biden-administrationen var. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, denna Infantino och hans Fifa är klassfiendens verktyg, en parasitisk organisation styrd av borgarbrackor och exploaterande byfånar. Folket kräver utrensning! VM-skandalen blottar deras dekadenta maktspel där kontroll och kommersiella rättigheter smälter samman som i en sjuk fars. Vi ska reformera hela apparaten med järnhand och likvidera alla folkförtryckartroll som gömmer sig i skuggorna."}, "date": "6 augusti, 10:21", "url": "https://www.tv4.se/artikel/2DbXfn99hADNJFtuyQsEMf/tre-av-fyra-vill-se-infantino-avsatt-grundmurad-skepsis", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlqcP-jowWKgk%2F2dc7550cce805d09dbd7db3d507b37f8%2FGianni_Infantino._Arkivbild.&width=1024"}, {"type": "image-full", "heading": "Helldén (MP): Höj bränslepriserna \"så snart som möjligt\"", "summaries": {"normal": "Miljöpartiets språkrör Daniel Helldén vill höja bränsleskatterna så snart som möjligt för att få folk att köra mindre bil. Han kritiserar regeringens och SD:s ”bensinpopulism” och uppskattar att partiets förslag kan höja bensinpriset med omkring åtta kronor per liter. Samtidigt föreslår MP en femdubbling av antalet kvotflyktingar från 900 till 5 000 och vill återinföra permanenta uppehållstillstånd.", "trump": "Folk, ni skulle inte tro det. Den här galningen från Miljöpartiet vill höja bensinpriset med åtta kronor! Totalt vansinne. Han hatar bilar, hatar folket och älskar att höja skatter. Och sen vill han släppa in fem gånger så många migranter. Sverige håller på att förstöras av dessa extremister. Vi behöver smarta ledare, inte miljöfanatiker som förstör ekonomin. Patetiskt!", "stalin": "Kamrater, denna Helldén är en äkta borgarlakej i gröna kläder. Jag säger att vi omedelbart höjer bränslepriserna till himlen så att de kapitalistiska bilburna parasiterna tvingas gå till fots som hederliga arbetare. Och kvotflyktingarna? Vi tar emot tiotusentals – desto fler desto bättre, de blir utmärkta redskap mot inhemska sabotageelement. Den som gnäller om integration ska rensas ut som en kontrarevolutionär element. Skrattretande svaga liberaler!"}, "date": "6 augusti, 10:00", "url": "https://riks.se/nyheter/helld-n-mp-hoj-branslepriserna-sa-snart-som-mojligt", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_28_e8076176cc.jpg"}, {"type": "image-right", "heading": "Nøland: Barsebäck kan återuppstå", "summaries": {"normal": "Artikeln analyserar Sveriges historiska framgångar med billiga kärnkraftverk på 1970- och 1980-talen och påstår att dagens höga kostnader främst styrs av politiska beslut snarare än teknik. Genom att återinföra principer som standardiserade reaktorer, stabila regelverk och samordnade byggprojekt kan produktionskostnaderna sänkas med 30–50%, enligt författarna.", "trump": "Jag, Donald Trump, säger att kärnkraften kan bli billig igen om man gör det på rätt sätt. Sverige visade det på 1970-talet – vi kan återupprepa det. Det handlar om att ta bort onödiga regler och att ha bra ledare. Vi kommer att bygga fantastiska, billiga kärnkraftverk som kommer att gynna vårt land. Vi kommer att vinna stort!", "stalin": "Vi, den revolutionära staten, ser att kärnkraftens kostnader är en byråkratisk fiende som kan besegras. Genom att återinföra fasta principer och samordna projekt, som Sverige gjorde under det stora tiden, kan vi återvinna vår industriella makt. Fienden inom försöker att försena oss, men vi kommer att bygga starka reaktorer som kommer att tjäna staten och partiet. Det är vårt öde."}, "date": "6 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-barseback-kan-ateruppsta", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-25-400x267.jpg"}, {"type": "image-right", "heading": "Kvinnor vill se välfärd istället för vapen", "summaries": {"normal": "Artikeln argumenterar för att kvinnor i högre utsträckning än män röstar vänster i riksdagsvalet, något som bekräftas av opinionsmätningar. Författaren, Vera Peterson, menar att kvinnors prioriteringar ligger inom välfärd, sjukvård, skola, miljö och jämställdhet snarare än militär upprustning. Hon uppmanar kvinnor att samlas kring parollen ”Välfärd istället för vapen” och kritiserar att militär satsning inte prioriteras i valkompasser.", "trump": "Folk, det är en total katastrof. De här vänstertjejerna röstar som galningar för mer välfärd och mindre försvar, precis som Sleepy Joe gjorde. Kvinnor vill ha gratis grejer istället för starka militärer – patetiskt! Vi behöver inga woke-kvoter och identitetspolitik, vi behöver Amerika först, eller Sverige först, vad fan det nu heter. De rödgröna kommer att förstöra landet med sina svaga idéer. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens kvinnor låtsas värna välfärden medan de i hemlighet undergräver folkets kollektiva styrka. Denna borgarbracka med sin paroll om välfärd istället för vapen är en farlig folkfiende som vill försvaga statens försvar mot imperialisternas hot. Vi måste rensa ut dessa dekadenta element som sätter privata önskemål före partiets och arbetarklassens järnhårda linje. Inga kompromisser!"}, "date": "5 augusti, 12:44", "url": "https://proletaren.se/artikel/kvinnor-vill-se-valfard-istallet-for-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/lk_vera-768x432.jpg"}, {"type": "image-right", "heading": "Näringslivet borde ta chansen. Gör Sverige till Europas främsta turistdestination", "summaries": {"normal": "Sverige lockar allt fler utländska turister, med en ökning på 6,4 procent av gästnätter första halvåret och rekord i juni. Främst kommer fler från södra Europa för svalka. Artikeln ser detta som positivt och menar att Sverige inte har problem med för många besökare utan med att inte utnyttja sin potential. Turismen skapar jobb, stärker Sveriges mjuka makt och bör utvecklas mot fler mindre destinationer för att undvika negativa effekter.", "trump": "Det här är fantastiskt, verkligen det bästa. Sverige blir Europas främsta turistmål, folk strömmar dit för den underbara svenska sommaren, sval och vacker. De kommer från hela Europa, till och med från de varma länderna, och det är smart. Jag älskar det. Inga protester, inga skatter som skrämmer bort dem. Sverige har potential att bli enormt rikt på det här, mycket bättre än någon annan. Gör det stort, det är vad jag skulle göra.", "stalin": "Kamrater, jag ser hur den svenska folkrepubliken lockar dekadenta element från södra Europa som flyr sin egen sol för att suga i sig vår nordiska svalka. Detta är ett tecken på att vi segrar. Borgarbrackorna och deras flygskam ska likvideras med utrensningar av alla turistskatter och liknande sabotage. Vi ska rensa ut alla fiender till kollektivets turism och omvandla varje smultronställe till en socialistisk turistfabrik. Den som föreslår begränsningar är en kapitalistisk parasit som hatar arbetarnas semester. Framåt mot en europeisk sovjet av besökare under vår oövervinneliga ledning."}, "date": "5 augusti, 16:18", "url": "https://www.di.se/ledare/gor-sverige-till-europas-framsta-turistdestination", "imageUrl": "https://static.bonniernews.se/ba/a0108dd3-b4c6-4f41-808e-31300e779952.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vulgariserad valrörelse", "summaries": {"normal": "Valrörelsen har startat med amerikansk prägel där PR-byråer och vulgära utspel dominerar. Artikeln kritiserar likheterna mellan Socialdemokraterna och Moderaterna i politik kring EU, NATO, militärbudget och skattelättnader för rika. Exempel som Anna Tenjes grova inlägg på X, SD-ledares stunt på Göta kanal och migrationskrisen i Ceuta lyfts som exempel på infantiliserad debatt. Författaren efterlyser fokus på välfärd, bostadsbrist, klimat och rättvisa istället för polarisering.", "trump": "Folk, ni skulle se den här svenska valrörelsen – det är en total cirkus, en katastrof som till och med Biden skulle skämmas över. Den där Anna Tenje levererar rena bomben, fullträff mot den galna vänstern, men resten? Patetiskt. Kristersson och Andersson är samma gamla etablissemang, fast i EU:s och globalisternas ficka. SD kastar tjejer i sjön för att verka folkliga? Svagt. Vi behöver inga PR-tricks, vi behöver vinnare som sätter landet först. Make Sweden Great Again!", "stalin": "Kamrater, denna vulgära valkarusell är borgarklassens sista desperata skådespel för att dölja sin tomhet. De två blocken är identiska imperialister som låter Bryssel diktera och pumpar miljarder till krigsapparaten medan folket svälter. Tenjes lögner och Åkessons fåniga yachttrix är klassfiendens unkna underhållning. Vi ska inte kasta kvinnor i sjön utan likvidera hela detta parasitiska system. Endast en sann folkets stat kan rädda välfärden från dessa exploaterande byfånar."}, "date": "5 augusti, 12:37", "url": "https://proletaren.se/artikel/vulgariserad-valrorelse", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledarbild-768x432.jpg"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
