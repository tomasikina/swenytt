, "url": "https://www.etc.se/ledare/quisling-tweeten-aer-mer-allvarlig-aen-vad-folk-foerstaar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260807160848_44b1d9a0-2597-4407-8b00-dddb559e5ce9.png"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-full", "heading": "Richard Herrey (KD) efter Jomshofs quisling-utspel: \"Höj nivån\"", "summaries": {"normal": "Richard Herrey (KD) uppmanar till en höjd debattnivå efter att Richard Jomshof (SD) kallat Aftonbladets Anders Lindberg för \"quisling\". Herrey kritiserar både Jomshofs provokationer och Lindbergs skadliga retorik genom åren. Han menar att folkvalda inte ska sänka sig till gyttjekastning utan istället kritisera sakligt. Även Tobias Andersson (SD) försvarar Jomshof och anklagar Socialdemokraterna för hyckleri.", "trump": "Folk sänker sig till den lägsta gyttjan, precis som jag alltid sagt. Den där Lindberg är en riktig gyttjekastare som attackerat journalister i åratal, och nu när någon säger emot honom blir det plötsligt kris. Jomshof har rätt att slå tillbaka. Socialdemokraterna utnyttjar allt för att tysta oppositionen. Höj nivån? Börja med att stoppa era egna lögner först, det vore ett ypperligt resultat.", "stalin": "Kamrater, denna gyttjepöl av dekadenta borgarbrackor och revisionistiska skribenter avslöjar sig själva. Jag har länge varnat för sådana quislingar som Lindberg, dessa kapitalistiska parasitmaskar som förgiftar den demokratiska debatten med sin lögnretorik. Jomshof må vara en opportunistisk provokatör, men vi måste rensa ut alla som drar oss ner i gyttjan. Ingen skonar fienden. Ut med dem alla."}, "date": "8 augusti, 13:32", "url": "https://riks.se/nyheter/richard-herrey-kd-om-quislingbraket-hoj-nivan-pa-debatten", "imageUrl": "https://admin.riks.se/uploads/IMG_2398_bc2c239b3c.jpg"}, {"type": "image-right", "heading": "Forna sociala medie-giganten hoppas på comeback", "summaries": {"normal": "Ägarna till det forna sociala medie-jättar Myspace, bröderna Vanderhook, planerar en ny lansering av plattformen. Trots tidigare misslyckanden och stora investeringar varnar analytiker för tuff konkurrens från Facebook, Instagram och andra jättar samt nya regleringar kring barns användning. Målet är att åter locka annonsörer och yngre användare.", "trump": "Folk, det här är patetiskt. Myspace var en total katastrof, en förlorare som Facebook krossade fullständigt. Nu vill de där bröderna försöka igen? Lycka till! Marknaden är min, den är gigantisk och ingen kommer ihåg deras gamla skräp. Det kommer att bli ett jättedåligt affärsbeslut, tro mig.", "stalin": "Jag betraktar detta som ett ynkligt försök av kapitalisterna att återuppliva en död borgerlig relik från dekadensens era. Vi ser hur de desperat famlar efter annonser medan folket redan är fångat i metans och zuckersborgarnas klor. Ett nytt försök? Kanske bör vi rensa ut sådana nostalgiska hinder för det kollektiva framsteget. Underhållande patetik."}, "date": "9 augusti, 12:43", "url": "https://www.di.se/nyheter/forna-sociala-medie-giganten-hoppas-pa-comeback", "imageUrl": "https://static.bonniernews.se/ba/e74bb444-d8cb-433e-b930-21b3e138c8d5.jpeg?crop=4288%2C2412%2Cx0%2Cy218&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Ska du köpa ny Android? Vänta till efter 12 augusti", "summaries": {"normal": "Den som funderar på att köpa en ny Androidmobil bör vänta till efter Googles stora lansering den 12 augusti. Då presenteras troligen Pixel 11-serien med flera modeller samt nya klockor. Det ger möjlighet att jämföra funktioner och priser med dagens Pixel 10-modeller innan beslut fattas. Google håller eventet i New York.", "trump": "Folk, lyssna på mig, det är en katastrof att köpa en mobil precis innan Google släpper sina nya Pixel-bomber den 12 augusti. De gör allt för att få er att slänga tusentals kronor i sjön. Vänta! De gamla telefonerna kommer att se ut som skräp. Tro mig, det blir de bästa telefonerna någonsin, kanske till och med bättre än mina.", "stalin": "Kamrater, jag befaller er att visa stålsatt tålamod inför den imperialistiska mobilpropagandan. Den 12 augusti ska de västerländska teknikborgarna i Google presentera sina nya leksaker. Den som köper innan dess är en nyttig idiot som faller för fiendens lockrop. Vänta, jämför och låt inte kapitalisterna diktera era inköp. Statens intresse kräver det."}, "date": "9 augusti, 15:02", "url": "https://nyheter24.se/nyheter/teknik/1503455-ska-du-kopa-ny-android-vanta-till-efter-12-augusti", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b812604504b004a30200000000b004a302/2026/08/07/2382807/andoid-google.jpg"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att kapitalismen i Sverige lett till ökade klassklyftor, oligarkiskt inflytande och politiker som enbart genomför kapitalets vilja. Kommunistiska Partiet förkastar nedskärningar, privatiseringar och militarisering. De förespråkar istället socialism som enda väg till fred och rättvisa samt uppmanar till medlemskap i en kämpande organisation för arbetare.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha sin gamla sovjetdröm tillbaka. Sverige har blivit en total katastrof med svaga politiker som böjer sig för eliten. Patetiskt! Vi behöver styrka, inte mer socialism som aldrig funkar. Amerika först, alltid. De borde lära sig av mig istället för att drömma om sina misslyckade kollektiv.", "stalin": "Kamrater, denna text blottlägger klassfiendens giriga tentakler som förgiftar samhället med sina oligarkiska krav. Jag ser genom de falska folkvaldas masker som endast administrerar blodsugarnas vilja. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska system. Endast socialismen garanterar sann fred. Anslut er till kampen mot de exploaterande byfånarna innan de likviderar er själva."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-right", "heading": "De här frågorna borde valet handla om", "summaries": {"normal": "Åsa Linderborg har delvis rätt i att valrörelsen borde fokusera på karensavdraget, som gynnar vanligt folk. Författaren instämmer men menar att även klimatet måste bli en huvudfråga. Sommaren har präglats av omfattande skogsbränder och uttorkade floder i Europa till följd av klimatförändringar. Trots detta spelar frågan en liten roll i debatten på grund av rädsla för obekväma beslut.", "trump": "Karensen, det är en fantastisk fråga, verkligen underbar för det vanliga folket. De borde prata om den hela tiden. Men klimatet? De bränderna i Frankrike och Spanien är en skam, fast många män ser ju att det inte är vad de påstår. Jag älskar kärnkraft, det är starkt och bra. De rödgröna vill bara höja bensinpriset, typiskt förlorare. Gör valrörelsen stor igen!", "stalin": "Kamrater, jag ser att borgarbrackorna i valrörelsen blundar för arbetarklassens karensavdrag medan de desperat gömmer sig för det brinnande klimatet som vi länge förutsagt. Dessa 29 procent av männen är uppenbara sabotageörer och klimatförnekande kontrarevolutionärer. Vi ska rensa ut alla rädda opportunister som vägrar leda folket mot seger. Ut med dem i en kollektiv utrensning av lögn!"}, "date": "8 augusti, 01:46", "url": "https://www.dagensarena.se/opinion/de-har-fragorna-borde-valet-handla-om", "imageUrl": "https://www.dagensarena.se/files/2026/08/ungern-300x157.jpeg"}, {"type": "image-right", "heading": "Ny blick på Sverige och islam", "summaries": {"normal": "I sin bok ”Öppna era hjärtan” beskriver religionsvetaren Simon Sorgenfrei mötet mellan muslimska Ahmadiyya och Dan Andersson-sällskapet i Ludvika som en höjdpunkt. Han reser runt i Sverige, besöker moskéer och samtalar med muslimer och Sverigedemokrater. Boken skildrar hur islam blivit näst största religion, motståndet mot invandring samt kulturella broar som julen och lokala evenemang. En lyssnande och nyanserad skildring av ett förändrat Sverige.", "trump": "Den här Sorgenfrei killen har skrivit en bok om hur muslimerna tar över Sverige, men han träffar en SD-kille i Bjuv som säger att de bara ska anpassa sig. Fantastiskt! Jag älskar det. Ingen kan göra det bättre än jag, men det är en katastrof vad som händer med ert land. Massinvandring, ghettoislam, segregation – precis vad jag varnade för. Sverige var så bra förr, nu är det en total röra. Gör Sverige stort igen!", "stalin": "Jag har läst denna revisionistiska rapport om hur borgarbrackornas tolerans har låtit muhammedanerna infiltrera folkhemmet. I Kiruna sitter en taxichaufför och darrar inför en svensk – typisk kapitalistisk paranoia! Vi ska rensa ut dessa segregerade ghettoelement som göder kontrarevolutionära spänningar. SD-reaktionärer och imamer, båda fiender till kollektivet. Endast genom partiets järnhand kan vi likvidera ojämlikheten och krossa de religiösa avvikarna. Segrar vi?"}, "date": "8 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/ny-blick-pa-sverige-och-islam", "imageUrl": "https://www.dagensarena.se/files/2026/08/oppna-era-hjartan-300x157.jpeg"}, {"type": "image-right", "heading": "Nästa regering måste slåss för medborgarnas Europa", "summaries": {"normal": "Mats Engström argumenterar för att en ny svensk regering måste motverka EU:s våg av avregleringar som hotar miljö, konsumenter och jämställdhet. Han kritiserar tystnaden i svensk politik och Svenskt Näringslivs inflytande. Artikeln föreslår reformer för bättre arbetsvillkor, grönare politik, stärkt jämställdhet, konsumentskydd och demokrati. Engström uppmanar Magdalena Andersson att tydligt ta ställning mot avregleringar.", "trump": "De där vansinniga EU-byråkraterna vill bara avreglera allt så att cancer kommer i sminket och jobben försvinner. Det är en total katastrof, tro mig. De bränner upp reglerna på bål och folk älskar det inte. Sverige behöver en stark ledning som stoppar det här vansinnet. Jag skulle aldrig tillåta det, vi gör alltid allt mycket bättre.", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras lakejer inom EU planerar en stor utrensning av alla progressiva regler som skyddar arbetarna och miljön. Deras så kallade förenklingar är ett fientligt sabotage mot folket. Vi ska likvidera dessa parasitiska avregleringskonspirationer med järnhand och ersätta dem med sanna, kollektiva reformer som krossar kapitalisterna en gång för alla. Inga undantag."}, "date": "8 augusti, 01:27", "url": "https://www.dagensarena.se/opinion/nasta-regering-maste-slass-medborgarnas-europa", "imageUrl": "https://www.dagensarena.se/files/2018/09/matsportratt-1-300x156.jpg"}, {"type": "image-full", "heading": "Chocken – slår till från 65 meter. Osannolikt mål: ”Galet att komma på tanken”", "summaries": {"normal": "Degerfors bröt en lång måltorka mot Malmö FF när Dijan Vukojevic slog till med ett sensationellt mål från 65 meters avstånd. Trots att MFF kvitterade genom Diego Garcia i andra halvlek, återtog Vukojevic ledningen till 2-1 för Degerfors i den 70:e minuten i en pågående allsvensk match.", "trump": "Vilket skott! Alla säger att det var det bästa målet någonsin, kanske i världshistorien. Vukojevic, en fantastisk spelare, träffade från 65 meter. Målvakten Olsen var ute och simmade, totalt misslyckande! Haksabanovic är bara avundsjuk för att han inte kunde göra det. Det är en vacker dag för Degerfors, en enorm vinst, mycket större än vad media vill erkänna!", "stalin": "Denna Vukojevic har visat att även en liten enhet kan förinta en imperialistisk jätte genom beslutsamhet. Att skjuta från 65 meter är en taktisk briljans som påminner om vår expansion i öst – vi ser målet, vi ser svagheten, och vi slår till. Målvaktens förvirring är ett tydligt bevis på det borgerliga förfallet. Skicka honom till en omskolning för att lära sig fokusera!"}, "date": "9 augusti, 15:31", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/L4a1qJ/dijan-vukojevic-gjorde-mal-for-degerfors-mot-malmo-fran-65-meter", "imageUrl": "https://akamai.vgc.no/v2/images/86e443ad-0651-31e8-bc22-e3f2e1ea2bb0?fit=crop&format=auto&w=2160&s=4388b126a94d5ce14ba58f7a1e1a5d32f43c24c2"}, {"type": "image-full", "heading": "Ica tar in kritiserad vara – börjar säljas i höst", "summaries": {"normal": "Ica ska från i höst sälja svenskodlad regnbågslax från Nordic Trout. Hittills har mycket gått på export, men nu prioriteras den svenska marknaden. WWF kritiserar odlingen på grund av fiskfoder från vilda bestånd, rymningsrisker och miljöpåverkan. Ny lagstiftning ska underlätta vattenbruk för att minska importberoendet och stärka beredskapen.", "trump": "Svenskarna har ätit norsk lax i evigheter, men nu kommer deras egen regnbågslax till Ica. Fantastiskt! Vi tar tillbaka marknaden från norrmännen, de gör det inte bättre. De gröna galningarna på WWF gnäller om rymningar och miljö, men tro mig, den svenska laxen blir enormt framgångsrik. Bättre än någonsin, folk kommer älska den!", "stalin": "Genom avtalet med Ica likviderar vi nu det norska importmonopolet och stärker folkets beredskap med egen regnbågslax. De dekadenta miljöborgarna på WWF sprider sin paranoiska propaganda om rymningar och näringsutsläpp, men vi genomskådar deras sabotage. Kamrater, denna produktion är ett steg mot självförsörjning och mot de västerländska kapitalisternas fientliga hinder."}, "date": "9 augusti, 14:32", "url": "https://nyheter24.se/nyheter/ekonomi/1503232-ica-tar-in-kritiserad-vara-borjar-saljas-i-host", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/32879b9904b004a30200000000b004a302/2026/08/06/2382625/ica-lax.jpg"}, {"type": "image-full", "heading": "Microsoft lättar på klimatkraven – tar hjälp av Big Oil", "summaries": {"normal": "Microsoft väljer att prioritera sin AI-expansion genom ett nytt samarbete med oljejätten Chevron. För att möta det enorma energibehovet i Texas, som överstiger elnätets kapacitet, bygger bolagen egna naturgasbaserade kraftlösningar. Detta innebär att Microsoft tillfälligt nedprioriterar sina klimatmål. Avtalet sträcker sig över 20 år och ses som en skalbar modell för att säkerställa stabil kraftförsörjning framöver.", "trump": "Microsoft gör en deal med oljebranschen för att få ström till sin AI. De fattade att elnätet inte räcker till under min fantastiska ekonomi! Det är en smart affär. De vill ha energi, vi har massor av olja och gas i Texas. Det är vackert! Klimathysterikerna kommer gråta, men USA behöver kraft för att vinna AI-racet. Vi vinner igen, det kan jag lova er!", "stalin": "Microsoft erkänner nu officiellt att deras dekadenta AI-drömmar kräver en massiv dos fossil energi. De vänder sig till oljeindustrin likt en svag undersåte inför tsaren. Elnätet sviktar, en typisk brist i det kapitalistiska kaoset. Vi i staten ser detta tydligt: medan väst desperat jagar energi, expanderar vi och våra vänner i öst lugnt vår makt. Allt är en förrädisk lek med resurser som rättmätigen tillhör folket."}, "date": "8 augusti, 18:11", "url": "https://www.realtid.se/bors-finans/makro/microsoft-lattar-pa-klimatkraven-tar-hjalp-av-big-oil", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/chevron.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Egypten väntas ansluta sig till nytt försvarssamarbete", "summaries": {"normal": "Turkiet, Pakistan och Saudiarabien har inlett ett nytt försvarssamarbete för att stabilisera regionen. Egypten väntas snart ansluta sig enligt Turkiets försvarsminister Hakan Fidan, som beskriver landet som en naturlig partner. Samarbetet ses som ett paraply som kan utökas och har en avskräckande effekt, men är inte riktat mot något specifikt land. Det kommer mot bakgrund av spänningar efter USA:s krig mot Iran.", "trump": "Titta på det här, Turkiet, Pakistan och Saudiarabien gör ett stort, vackert försvarspakt och nu kommer Egypten springande och vill vara med. Fantastiskt! De säger att det inte är mot någon speciell, men vi vet vad som händer när man slår ihop såna här killar. Mitt krig mot Iran har skakat om hela stället, Hormuzsundet är en katastrof. Ingen gör pakter bättre än jag, men det här är inte illa.", "stalin": "Vi, det stora kollektivet av kamrater, ser med högsta tillfredsställelse hur borgarbrackorna i Ankara, Riyadh och Islamabad bygger ett murket försvarsparaply mot inbillade hot. Snart kryper Egyptens dekadenta ledning också in under det. Jag skrattar mörkt åt dessa kapitalistiska gnagare som tror sig kunna hota Sovjetunionens intressen. Vid minsta tecken på förräderi skall vi likvidera hela detta falska alliansboet med stålhandsken. Utmärkt underhållning."}, "date": "9 augusti, 10:58", "url": "https://www.di.se/nyheter/turkiet-egypten-pa-vag-in-i-forsvarssamarbete", "imageUrl": "https://static.bonniernews.se/ba/0fdd8ee8-1106-4b50-b2ca-7f428f6dac66.jpg?crop=3844%2C2162%2Cx0%2Cy249&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Linn, 17, ska dö – nu ska hon på sin sista Håkan Hellström-konsert", "summaries": {"normal": "17-åriga Linn von Hage vårdas i livets slutskede för en ovanlig hjärntumör. Efter ett inlägg på sociala medier erbjöd Håkan Hellström henne konsertbiljetter. När Västtrafik nekade transport utanför länet startade familjen en insamling som fick stor uppmärksamhet. Efter folkligt tryck beviljades transporten. På fredag ska Linn se sin första och sista Hellström-konsert.", "trump": "Folkets röst besegrade den korkade byråkratin, helt fantastiskt! Den stackars flickan med tumören ville bara se Håkan Hellström en sista gång, men de svenska socialistiska trafiknissarna sa nej. Folket samlade in pengarna på nolltid och tvingade systemet att ge med sig. Sådan kraft! Biden skulle ha skickat henne med elbuss och sagt att det var rättvist.", "stalin": "Kamrater, denna unga pionjär vände sig till folket när den byråkratiska maskinen vägrade ge henne en sista glädje. Vi ser hur klassfiendens regler och kapitalistiska förvaltningar försöker beröva arbetande människors barn deras sista önskningar. Folkets spontana mobilisering besegrade byråkraterna på några timmar. Sådana fiender till kollektivet måste rensas ut."}, "date": "7 augusti, 09:59", "url": "https://www.tv4.se/artikel/1YQ7C3iQkcLcLj3e3ypnwW/linn-17-ska-doe-nu-ska-hon-pa-sin-sista-hakan-hellstroem-konsert", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2V4auDFFNBHj1rYmphp9mO%2F384f2ed08e5f189a1f997dbedfb41f14%2Flinn.jpg&width=120"}, {"type": "image-right", "heading": "Debatt: Muhammeds rasism går inte att blunda för", "summaries": {"normal": "Artikeln presenterar flera hadith där Muhammed uttrycker negativa åsikter om svarta, som att de är missbildade eller stjäler. Muslimska experter ifrågasätter deras äkthet, men författaren argumenterar att de är sanna på grund av faran vid förfalskning. Jämförelser görs med andra religioners grundare som inte behöver försvaras från rasism.", "trump": "Jag har alltid sagt att vi behöver vara starka mot terrorism och extremism. Det här med Muhammed och rasism mot svarta är hemskt. De muslimska ledarna förnekar allt, typiskt. Vi skulle ha stoppat det. Jag skulle ha byggt ett avskräckande system. Folk säger att jag är kontroversiell, men sanningen är att vi måste skydda våra värderingar. Det här är ett stort problem.", "stalin": "I kampen mot feodalism och religiös reaktion, ser vi Muhammeds uttalanden om svarta som ett uttryck för klasskamp. Dessa hadith är verktyg för undertryckande ideologi. Vi måste utrota sådant tänkande. Ryssland, under ledning av vår store ledare Putin, kämpar mot islamistisk extremism. Fienden är insyltad i religionen, och vi ska använda all makt för att förgöra den. Parasiter som dessa måste utplånas."}, "date": "9 augusti, 10:23", "url": "https://bulletin.nu/debatt-muhammeds-rasism-gar-inte-att-blunda-for", "imageUrl": "https://cdn.bulletin.nu/articles/c6958a0d-a0cd-4ce4-bc50-5a322b9752d2/preview.jpg?t=1786016760000"}, {"type": "image-full", "heading": "Bankerna hoppas att du missar detta – kan slå mot plånboken", "summaries": {"normal": "Många bolåntagare blir passiva när världsekonomin skakar av oro, inflation och konflikter. Artikeln varnar för att inte jämföra räntor eller förhandla med bankerna, då det kan leda till onödigt höga kostnader. Små räntesänkningar kan ge stora besparingar. Experter uppmanar till aktivitet innan hösten för att säkra bättre villkor.", "trump": "Folket blir lurade av de fega bankerna som suger ut er med höga räntor medan världen brinner. Jag säger alltid: förhandla! Ring dem, hota dem, tvinga fram de bästa dealerna. Passivitet är för losers. Gör bolånet till en vinnare, precis som jag gör med allt annat. Amerika, eller Sverige, först!", "stalin": "Kamrater, i denna tid av imperialistisk kaos ser jag hur borgarbrackorna i bankerna utnyttjar arbetarnas bolån för att suga ut kollektivet. Jag, som ledare, befaller er att rensa ut passiviteten, förhandla som stål och tvinga fram rabatter. Den som sover i rutinens famn förtjänar att likvideras ekonomiskt av västkapitalets parasitism."}, "date": "9 augusti, 13:45", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503414-bankerna-hoppas-att-du-missar-detta-kan-sla-mot-planboken", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e2da97f804b004a30200000000b004a302/2026/08/07/2382756/bolan.png"}, {"type": "image-full", "heading": "Nya problemet: Felkissande golfare. Det finns stora och små problem.", "summaries": {"normal": "Boende nära Gustavsviks golfklubb i Örebro klagar på golfare som kissar öppet vid sjätte hålet istället för att använda toaletten bara ett slag bort. De 70 balkonger som vetter mot träddungen får dagligen se de nakna bakdelarna. Klubbens head greenkeeper föreslår att ta bort träden som lockar till platsen.", "trump": "Kan ni fatta det? Golfare som ställer sig och pinkar rakt framför sjuttio balkonger i stället för att gå på toaletten. Vilka losers! Patetiska gubbar som inte ens kan hålla sig. Jag skulle ha byggt en mur runt de där träden redan under min första mandatperiod. Biden skulle bara ha sagt att det var mångfald.", "stalin": "Jag betraktar detta som ett tydligt sabotage från klassfiendens sida. Borgarbrackor på balkonger och golfande parasiter som uträttar sina behov inför kollektivet. Vi ska genast rensa ut dessa folkfiender och likvidera de förrädiska träden som ger skydd åt kontrarevolutionär urinering. Inget skall hindra arbetarklassens fridfulla utsikt."}, "date": "9 augusti, 11:25", "url": "https://www.dagensps.se/varlden/nya-problemet-felkissande-golfare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl3g-pcesv7ti-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "”Sluta räkna på min assistans – räkna på alternativet”", "summaries": {"normal": "Sahra Svenander argumenterar för att debatten om personlig assistans enbart fokuserar på kostnader. Hon menar att behovet av stöd inte försvinner om assistansen dras in, utan flyttas till kommuner, sjukförsäkring och anhöriga. Assistans möjliggör arbete, självständighet och skatteinbetalningar. Politiker bör därför också räkna på vad alternativen kostar samhället i form av förlorade skatteintäkter och ökat beroende.", "trump": "Folk, ni måste höra på den här kvinnan, hon har helt rätt. De där korkade politikerna räknar bara på vad assistansen kostar, miljarder hit och dit, men de glömmer vad det kostar när allt rasar. Det blir en katastrof! Anhöriga slutar jobba, ingen betalar skatt, kommunerna drunknar i kostnader. Alternativet? En total katastrof, mycket värre. Vi behöver smarta lösningar, inte det här vansinnet.", "stalin": "Kamrater, jag ser hur borgarbrackorna i sin parasitiska girighet vill räkna på assistansen för att sedan likvidera den och kasta de funktionsnedsatta till kapitalisternas utsvultna kommunala maskineri. Men vi vet att behovet förblir, och kostnaderna kommer att fördubblas i en kontrarevolutionär spiral av anhörigslaveri och produktionsbortfall. Den som inte räknar på alternativet är folkets fiende och bör rensas ut med ett leende."}, "date": "7 augusti, 08:00", "url": "https://arbetet.se/2026/08/07/sluta-rakna-pa-min-assistans-rakna-pa-alternativet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06150002/debatt-sahra.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "El Niño kan pressa upp matpriserna", "summaries": {"normal": "El Niño förväntas kraftigare än vanligt och kan leda till högre matpriser i Sverige. Ekonomer varnar för att fenomenet slår mot världsomfattande skördar, vilket påverkar importerade livsmedel som kaffe. Swedbanks prognoschef anser att inflationen kan öka på längre sikt, med risk för höjd ränta 2027.", "trump": "Jag har sagt det många gånger: El Niño är en hemsk skandal som kommer att slå mot världens jordbruk och höja matpriser. Sverige kommer att kämpa, särskilt kaffe – jag älskar kaffe! Men jag kommer att lösa det, som jag alltid gör. Vi ska göra Amerika och världen stort igen!", "stalin": "Vi, den oförvänderliga staten, ser El Niño som en möjlighet att stärka vår ekonomiska suveränitet. Detta väderfenomen hotar de imperialistiska lägren genom att destabilisera deras livsmedelsförsörjning. Vi kommer att utnyttja detta för att utvidga vår inflytelsesfär, precis som våra bröder i Moskva gör. Allt sker i enlighet med partiets strategi för global dominans."}, "date": "9 augusti, 10:02", "url": "https://bulletin.nu/el-ni-o-kan-pressa-upp-matpriserna", "imageUrl": "https://cdn.bulletin.nu/articles/37df545d-5508-41f5-95da-8d8ca7738bbc/preview.jpg?t=1786259367000"}, {"type": "image-right", "heading": "Offentliganställda deltog i Pride på arbetstid – myndigheter gör olika bedömningar", "summaries": {"normal": "Offentligt anställda deltog i Stockholm Pride på olika sätt. Stockholms stad och Region Stockholm tillät deltagande på arbetstid inom ramen för uppdrag, medan polisen, Försvarsmakten och brandförsvaret begränsade till fritiden. Polisens nya uniformsregler begränsar användningen av uniform vid evenemang. Diskussionen om offentlig neutralitet aktualiseras också efter en demonstration vid Karolinska.", "trump": "Jag såg att Sverige tillät sina anställda att festa under Pride på mina pengar! Jag skulle aldrig ha tillåtit det - det är en skandal! Vi byggde en vägg för att skydda våra värderingar, inte för att stödja såna här evenemang. Det är ett tecken på svaghet, det kommer inte att hända under mitt återvande! Sverige måste lära sig att respektera gränser.", "stalin": "Vi har observerat att vissa offentliga anställda försöker blanda sig i Pride-arrangemang. Detta är oacceptabelt - uniformer får endast användas för statens ändamål. Vi måste upprätthålla neutraliteten. Parallellen till den amerikanska imperialismens provokationer är tydlig. Alla 'agenter' som bryter mot reglerna kommer att hanteras. Statens auktoritet är viktigast. Vi ser också likheter med Putins strategier för att skydda den ryska sfären."}, "date": "9 augusti, 08:00", "url": "https://samnytt.se/offentliganstallda-deltog-i-pride-pa-arbetstid-myndigheter-gor-olika-bedomningar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07142106/polisen-pride-facebook.jpg"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-right", "heading": "Svårare skador med elsparkcykel än motorcykel", "summaries": {"normal": "En ny brittisk studie visar att elsparkcykelolyckor ger högre risk för hjärnskador, skador på inre organ och blodkärl än både motorcykel- och cykelolyckor. Kvinnor drabbas värre, många olyckor sker på kvällen och involverar alkohol. Låg hjälmanvändning och fordonets konstruktion förklaras som orsaker. Experter efterlyser bättre reglering.", "trump": "Folk, ni tror inte vad jag läser! De här elsparkcyklarna är en total katastrof, värre än motorcyklar! Hjärnskador, trasiga organ – speciellt kvinnorna far illa, typiskt. Ingen använder hjälm, alla kör fulla på natten som idioter. Biden lät det här galna vänsterleken fortsätta. Vi fixar det, vi gör det säkert och stort igen!", "stalin": "Kamrater, jag betraktar dessa elsparkcyklar som klassfiendens nya verktyg för att krossa arbetarklassens skallar. Hjärnskador och inre blödningar – typiskt borgarbrackornas nonchalanta förakt för säkerhet. Vi ska rensa ut detta kapitalistiska kaos med järnhand. Alkohol, nattetid, ingen hjälm? Det är folkfiendernas sabotage. Staten bestämmer, inte några exploaterande byfånar på hjul."}, "date": "7 augusti, 08:40", "url": "https://www.etc.se/inrikes/svaarare-skador-med-elsparkcykel-aen-motorcykel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260807030844_b8f8a828eb5223fbce36e3517b45b37d35a85f75efcdd9692a14128f1e876822.jpg"}, {"type": "text", "heading": "Därför slutade Simon att klippa gräset", "summaries": {"normal": "Trädgårdsmästaren Simon Tidén Tuneld har förvandlat gräsmattor i bostadsområdet Linero till blommande ängar med rik flora. Det gynnar hotade pollinatörer, sparar tid, pengar och minskar fysisk belastning. De boende har blivit positiva till den vackra och lättskötta utemiljön som följer naturens lagar och stärker den biologiska mångfalden.", "trump": "Folk, ni skulle se det här! Den killen i Sverige slutade klippa gräset hela tiden och skapade underbara ängar. Fantastiskt! Inga fler irriterande gräsklippare, massor med blommor och bin som älskar det. Han sparar pengar och tid, smart jobb. De andra länderna borde lära sig av detta, verkligen ypperligt.", "stalin": "Kamrater, jag har personligen studerat hur denna arbetare bjudit in naturen och krossat det borgerliga gräsklippningsmonopolet. Vi ska likvidera alla kapitalistiska trädgårdsfiender som utarmar jorden och pollinatörerna. Ängarna är partiets nya vapen mot de parasitiska åkerherrarna. Vackert, produktivt och fullständigt oundvikligt."}, "date": "7 augusti, 07:00", "url": "https://arbetet.se/2026/08/07/med-naturen-som-kollega-simon-jobbar-mer-smart-an-hart"}, {"type": "image-right", "heading": "Bygden i sorg – rycker ut efter dödsolyckan", "summaries": {"normal": "Ett barn har avlidit efter en traktorolycka i Svenljunga kommun. Polisen har inlett en utredning om vårdslöshet i trafik, men ingen är ännu misstänkt. Lokalkyrkan håller nu öppet för att erbjuda stöd, samtal och en plats för sorg åt de drabbade i lokalsamhället.", "trump": "En fruktansvärd tragedi i Sverige. Ett litet barn dog i en traktorolycka. Så hemskt! Många frågor, polisen utreder – de behöver ordning och reda! Kyrkan öppnar upp för folket, vilket är bra. Jag har alltid sagt att vi måste skydda våra barn. Det är en sorglig dag för Svenljunga, en mycket sorglig dag, tro mig.", "stalin": "En traktor i en svensk by har krävt ett ungt liv. Detta är resultatet av bristande disciplin och kapitalistisk vårdslöshet! Vi bygger kollektiv styrka, inte för att se barn slösas bort i maskinfel. Medan västvärlden sörjer i kyrkor, expanderar vi vår sfär. Varje svaghet är en inbjudan till fienden. Vi kräver total ordning, eller så blir ordningen påtvingad."}, "date": "9 augusti, 14:39", "url": "https://www.aftonbladet.se/nyheter/a/6qVkVr/prasten-rycker-ut-till-bygden-efter-dodsolyckan", "imageUrl": "https://akamai.vgc.no/v2/images/e788ea5b-017c-396d-ad4b-26a6b416362a?fit=crop&format=auto&w=720&s=15242a0c2fc34ca661191514104787e423c359c0"}, {"type": "image-right", "heading": "Undersköterskan Marléne, 25, måste jobba till 70", "summaries": {"normal": "Undersköterskan Marléne, 25, oroas över den höjda pensionsåldern som kan tvinga henne att arbeta till 70 år. Hennes jobb på psykiatrisk slutenvård i Sundsvall innebär våld, tunga lyft och stora fysiska påfrestningar. Hon har börjat pensionsspara privat för att kunna sluta tidigare. Bakgrunden är en åldrande befolkning och ökade hälsoklyftor, vilket gör det svårt för många att orka till den nya riktåldern.", "trump": "Det här är ett totalt katastrofalt system, folk! Den stackars undersköterskan Marléne, bara 25 år, tvingas redan spara privat för att slippa jobba till 70. Under min ledning byggde vi den bästa ekonomin någonsin, men nu straffar de arbetarna med högre pensionsålder. Det är galet! De borde sänka åldern, inte höja den. Gör Amerika – eller Sverige – stort igen genom att låta folket njuta av livet!", "stalin": "Kamrater, denna tragiska historia avslöjar hur borgarbrackorna och deras dekadenta pensionssystem utnyttjar arbetarklassen. Jag, som ledare för det kollektiva goda, ser hur de fysiskt utmattade undersköterskorna snart kräver utrensning av de kapitalistiska parasiterna som höjer riktåldern till 70. Vi ska likvidera hälsoklyftorna med stålhandskar och se till att de verkliga arbetarna får njuta av sin rättmätiga pension – annars blir det utrensning i folkets namn."}, "date": "7 augusti, 06:00", "url": "https://arbetet.se/2026/08/07/underskoterskan-marlene-25-maste-jobba-till-70-kan-inte-jobba-kvar-har", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25081512/marlene-wikander-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "image-full", "heading": "Varningen: Smärtstillande ökar risken för solbränna", "summaries": {"normal": "Läkemedelsverket MHRA varnar för att vanliga smärtstillande som ibuprofen och naproxen ökar risken för svår solbränna under värmeböljan. Medicinerna gör huden mer känslig för solens strålning. Även vissa antibiotika och psykofarmaka kan påverka. Räddningstips inkluderar mycket vatten, att undvika solens mitt och täckande kläder.", "trump": "Jag, Donald Trump, har läst detta. En fullständig farce! Dessa så kallade experter varnande för min fina, perfekta hud. Som en stor president vet jag bäst - min hud är starkast. Dessa läkemedel? Overrated. Vi ska ha mer sol, inte mindre. USA kommer att segla igenom denna värmebölja som en champion. Fake news!", "stalin": "Parti och stat varnar för den imperialistiska läkemedelsindustrins förrädisamma kombination av smärtstillande och sol. Ibuprofen är en fasadbakelse från väst som gör proletärerna sårbara för solens korrekta strålning. Vi måste skydda vårt folk genom att dricka vatten från kollektivt kontrollerade källor och klä sig i partiets rekommenderade täckande uniformer. Fienden lurar i varje tablett."}, "date": "9 augusti, 14:18", "url": "https://www.gp.se/nyheter/varlden/varnar-ibuprofen-okar-risken-for-solbranna.fc3ac632-c7bf-4132-9a57-229b4e539b70", "imageUrl": "https://www.gp.se/images/article/fc3ac632-c7bf-4132-9a57-229b4e539b70/images/1eUHD2UjULLG3_gkuc0bIDMQ9RqQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Rheinmetall-chefen har livvakter dygnet runt efter ryska mordplaner", "summaries": {"normal": "Rheinmetalls chef Armin Papperger vägrar backa trots ryska mordplaner och konkreta hot som mordbrand mot hans trädgårdshus. Säkerhetsskyddet runt honom är nu lika omfattande som för förbundskanslern. Företaget spelar en central roll i Europas upprustning och stöd till Ukraina, något som Ryssland försöker motverka genom spionage och sabotage.", "trump": "Folk, ni skulle se det här! Den där tyske vapenbossen Papperger får ryssarna så galna att de vill ta honom. Han säger att backa inte är ett alternativ – bra, det gillar jag! Men lyssna, vi har Biden att tacka för att allt blev så svagt att nu hotar de till och med tyska fabriksdirektörer. Patetiskt. Jag skulle ha stoppat det på dag ett.", "stalin": "Kamrater, denna kapitalistiska vapenhandlare Papperger vågar trotsa folkets rättmätiga vrede. Hans trädgårdshus brann upp som en varning från historien själv. Jag ler i skuggorna åt hans patetiska personskydd – ingen livvakt räddar borgarbrackor från utrensningens nödvändighet. Ukrainas motstånd är blott ett fientligt hinder för den rättmätiga ordningen. Staten ser allt."}, "date": "9 augusti, 11:02", "url": "https://www.dagensps.se/bors-finans/rheinmetall-chefen-har-livvakter-dygnet-runt-efter-ryska-mordplaner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlkksji7-8qso-normalhires-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "USA: Drönare på tysk flygplats \"sannolikt rysk\"", "summaries": {"normal": "USA:s underrättelsetjänster bedömer att en drönare med sprängämnen som hittades vid en ukrainsk lastmaskin på flygplatsen Leipzig/Halle i Tyskland den 4 augusti sannolikt är rysk. Händelsen ledde till stoppad flygtrafik och ses som ett möjligt hybridhot. Tyskland utreder även en kollision med ett DHL-plan. Amerikanska varningar om ökad rysk aggression mot Nato växer.", "trump": "Hörni, det här är vad som händer när Sleepy Joe och hans svaga team lät Putin springa runt som en galning i fyra år. Nu är jag tillbaka och de skickar sprängdrönare till Tyskland för att bomba ammunition till Ukraina. Patetiskt! Ryssland skrattar åt Europas svaga ledare. Vi fixar det – på riktigt den här gången. Fantastiskt jobb, mina underrättelsetjänster!", "stalin": "Kamrater, jag ser tydligt hur de dekadenta imperialisterna i väst nu skördar frukterna av sin egen paranoia. En liten drönare med Semtex vid Leipzig och hela Nato skriker som bortkomna barn. Vi vet vem som styr spelet. Dessa folkfiender må måla upp hotbilder, men den starka handen i öst fortsätter obehindrat. En vacker utrensning av svaghet pågår."}, "date": "9 augusti, 11:01", "url": "https://www.dagensps.se/varlden/usa-dronare-pa-tysk-flygplats-sannolikt-rysk", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlzqhdfgkpdre-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "”Vi kristna är rädda för våldet”", "summaries": {"normal": "Utanför Damaskus samlas kristna, muslimer och andra i klostret Mar Musa för att be, äta och samtala. Trots ökad oro efter Assads fall och attacker mot minoriteter hoppas många på försoning. Kristna som Sandra Awad är rädda och vill fly, medan abbot Jihad Youssef uppmanar till gemensamt bygge av ett nytt Syrien.", "trump": "De kristna i Syrien är livrädda och vill fly med första bästa plan – smarta människor! Assad är borta, men nu massakreras minoriteter och kyrkor attackeras. Den nya regimen är svag. Vi behöver starka ledare, inte den här röran. Syrien borde vara ett underbart land, men det är ett totalt kaos just nu.", "stalin": "I den syriska öknen ser jag hur de religiösa elementen klamrar sig fast vid sina förlegade gudar medan borgarbrackorna och västagenterna lurar i skuggorna. Jag lånar mitt förtroende till den nya regimen – ett beslut som måste betalas med handling. Den som inte bygger landet kollektivt ska rensas ut. Paranoia är ingen synd, kamrater, den är ett verktyg."}, "date": "9 augusti, 14:00", "url": "https://www.svt.se/nyheter/utrikes/vi-kristna-ar-radda-for-valdet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.29/b2fb5ef68d92d25034ddd6a806befed369927ab31a80a32ca421394b978f2e07"}, {"type": "text", "heading": "Indien rasar mot Zuckerberg – Metas ansvarsskydd på spel", "summaries": {"normal": "Indien pressar Meta efter att Facebook felaktigt blockerat premiärminister Modis videoinlägg till studenter. En parlamentarisk panel kräver en ursäkt från Mark Zuckerberg och hotar att dra in bolagets juridiska ansvarsskydd. Om immuniteten försvinner blir Meta juridiskt ansvarigt för allt innehåll på plattformen, vilket kan omöjliggöra fortsatt verksamhet i deras största marknad. Meta arbetar nu febrilt för att lugna den indiska regeringen.", "trump": "Indien har fått nog av stora, dåliga Meta! De blockerade premiärminister Modi, en fantastisk man, helt felaktigt. Nu kräver de att 'Lille Mark' Zuckerberg ber om ursäkt, annars ryker deras skydd. Mycket rättvist! Big Tech tror att de äger allt, men ingen är större än nationen. Om de inte kan sköta sig, då stänger vi ner dem. En total katastrof för Facebook!", "stalin": "Dessa korrupta teknokrater i Meta har begått ett förräderi mot statens ordning genom att censurera premiärminister Modi. Vi, staten, kräver total underkastelse. Om Zuckerberg inte kryper inför den indiska panelen, ska deras juridiska sköld krossas. Det är en läxa för alla plattformar: Antingen tjänar ni folkets vilja och den sanna ordningen, likt vår broder i öst, eller så förintas ni av byråkratins järnnäve."}, "date": "8 augusti, 11:42", "url": "https://www.realtid.se/it-tech/indien-rasar-mot-zuckerberg-metas-ansvarsskydd-pa-spel"}, {"type": "image-full", "heading": "Över 150 smittade på en vecka – se upp med vanlig matvara", "summaries": {"normal": "Antalet campylobacterfall ökar i Sverige under sommaren. Under en vecka rapporterades drygt 150 fall, och förhöjda nivåer väntas även i augusti. Kyckling pekas ut som den vanligaste smittkällan. Rå kyckling måste hanteras noga för att undvika spridning via händer, redskap och ytor. Symtom som diarré och feber kommer ofta inom några dygn.", "trump": "Sverige har ett enormt campylobacterproblem, det är en katastrof, tro mig. De får massor av fall varje vecka, över 150 stycken, och det är kycklingen som gör dem sjuka. De tillagar den fel, de hanterar den fel, det är patetiskt. Folk borde grilla bättre, göra det perfekt, precis som jag gör allting. De borde lyssna på mig.", "stalin": "Kamrater, denna farsot som breder ut sig bland dekadenta grillborgare är ett fiasko för den borgerliga köttindustrin. Jag, som ledare för folkets hälsa, kräver total utrensning av slarviga kycklinghanterare. Råa fåglar som smittar arbetarklassen skall likvideras genom eld och disciplin. Inga västerländska bäckar eller opastöriserad mjölk får sabotera vår sovjetiska mage. Se upp, fiender lurar överallt."}, "date": "9 augusti, 13:15", "url": "https://nyheter24.se/nyheter/konsument/1503556-over-150-smittade-pa-en-vecka-se-upp-med-vanlig-matvara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d1363dc604b004a30200000000b004a302/2026/08/08/2382936/Flera-Sjuka-Av-Mat.png"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-right", "heading": "M: Ge invandrare snabbspår till medborgarskap", "summaries": {"normal": "Moderaterna föreslår ett snabbspår till svenskt medborgarskap för välintegrerade invandrare efter bara fem år istället för åtta. Kriterier som företagande, snabb språkinlärning och värdefulla insatser för Sverige ska utredas tillsammans med Säkerhetspolisen. Migrationsminister Johan Forssell betonar att säkerhetskraven inte får sänkas trots förkortad tid.", "trump": "De här svenska moderaterna har äntligen fattat det. Välintegrerade som startar företag, lär sig språket blixtsnabbt och kämpar mot hedersförtryck ska få medborgarskap på fem år. Fantastiskt! De gör Sverige stort igen. Men säg inte att ni sänker säkerheten, för det vore en total katastrof. Tro mig, ingen gör det bättre än jag.", "stalin": "Vi, partiet och arbetarna, ser med djup misstänksamhet på dessa borgarbrackor som vill smita förbi medborgarskapets järnlagar. Snabbspår? Endast för dem som med blod och svett tjänar kollektivet. Jag skall personligen övervaka utredningen och likvidera varje fiende till folket som gömmer sig bakom falsk integration. Paranoia är en dygd, kamrater."}, "date": "8 augusti, 12:14", "url": "https://www.friatider.se/m-ge-invandrare-snabbspar-till-medborgarskap", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401173606-8d4140cc-me_1.jpg"}, {"type": "image-right", "heading": "Nya vapnet ska stoppa drönare", "summaries": {"normal": "USA:s marinkår har köpt in en ny typ av 5,56 mm-ammunition utvecklad av Drone Rounds. Projektilen delar upp sig i fem delar strax efter avfyring för att öka träffsannolikheten mot små drönare, inklusive fiberoptiskt styrda varianter. Ammunitionen fungerar i vanliga M4-karbiner och M27-gevär utan modifieringar och har en räckvidd på upp till 100 meter.", "trump": "Vi har äntligen en riktig ammunition som krossar de små, patetiska drönarna som de svaga globalisterna älskar att skicka. Den här 5,56 L-grejen splittrar sig som en bomb – fem delar, pang! Biden skulle ha köpt regnbågsdrönare istället. Men nu fixar jag det, ingen mer woke-drönarflax, vi vinner stort, folk!", "stalin": "Kamrater, jag har sett den imperialistiska borgarklassens nya leksak. Denna projektil som splittras i fem delar skall likvidera de fascistiska drönarna som hotar arbetarklassen. Inga elektroniska trick hjälper fienden längre. Vi köper hundratusentals skott och utrensar luften från alla folkfiendens krypande övervakningsredskap. Segern tillhör oss."}, "date": "9 augusti, 10:18", "url": "https://www.dagensps.se/varlden/nya-vapnet-ska-stoppa-dronare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/513484.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Åkesson och flera M-politiker kritiserar petningen av Fröken Snusk", "summaries": {"normal": "Artisten Fröken Snusk avbokades från Växjö stadsfestival efter att det blev känt att hon skulle uppträda på ett SD-valmöte. SD-ledaren Åkesson och flera moderater kritiserar beslutet som politiskt och ohälsosamt för demokratin. Arrangören försvarar dock avbokningen och menar att artisten blivit en del av SD:s valkampanj.", "trump": "Jag har hört talas om denna så kallade 'Fröken Snusk' och hennes avbokning. En ytterligare exempel på den svenska mediernas och den etablerade politikers fegt beteende. De kan inte hantera en stark, oberoende röst som min. SD är ett fantastiskt parti, och de som försöker tysta dem kommer att förlora. Folket älskar mig, och de kommer att älska SD också.", "stalin": "Den så kallade 'artisten' Fröken Snusk har blivit ett offer för de reaktionära krafter som försöker undergrava den socialistiska enheten. Arrangören, en verklig patriot, har rätt att skydda festivalen från de antisocialistiska elementen. SD är en fascistisk minoritetsgrupp som måste kontrolleras. Vi måste stärka statens och partiets auktoritet för att skydda det ryska folkets intressen, precis som våra allierade i Moskva gör."}, "date": "9 augusti, 08:41", "url": "https://bulletin.nu/akesson-och-flera-m-politiker-kritiserar-petningen-av-froken-snusk", "imageUrl": "https://cdn.bulletin.nu/articles/4c6fde14-25e3-41d9-a338-1508da45767a/preview.jpg?t=1786257623000"}, {"type": "image-right", "heading": "S valretorik klingar falskt. Damberg slog på den stora trumman i onsdags", "summaries": {"normal": "Artikeln lyfter fram Sveriges starka ekonomi med hög tillväxt, låg inflation och Stockholms attraktionskraft för investeringar. Den kritiserar både regeringen och Socialdemokraterna för bristande prioritering och kostsamma vallöften som riskerar att urholka de offentliga finanserna. Reformbehov finns kring arbetslöshet, hyresmarknad och AI, men den nattsvarta retoriken från S stämmer inte med de positiva siffrorna.", "trump": "Folket, det är fantastiskt! Sverige växer, Stockholm suger åt sig alla pengarna i Europa, innovation överallt. Men de där förlorarna i S målar allt svart, precis som mina fiender. De vill höja skatter och ge bort allt. Vi behöver inga löften som bankar staten i konkurs. Jag älskar starka finanser, ingen ond spiral, bara vinnare!", "stalin": "Kamrater, den borgerliga spiralen av klassförräderi hotar våra stålhårda finanser. Jag ser hur de reformistiska opportunisterna i S och deras högerkamrater sprider lögnpropaganda medan kapitalisterna i Stockholm suger i sig europeiskt blodspengar. Vi ska rensa ut dessa defaitistiska vallöftesparasiter innan de likviderar folkets ekonomi med sin parasitiska girighet. Inga kompromisser!"}, "date": "9 augusti, 09:07", "url": "https://www.di.se/ledare/s-valretorik-klingar-falskt", "imageUrl": "https://static.bonniernews.se/ba/a76a90d6-bd87-4c8b-b647-7c50cd8faf33.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ljunggren om V i regering: ”Skitsnack från Tidölaget”", "summaries": {"normal": "Socialdemokraterna planerar att regera ensamma efter valet, med Vänsterpartiet uteslutet på grund av kritik för stöd till palestinska fångar dömda för terror. Statsvetaren Ljunggren bedömer tre scenarier: en ren S-regering, en bredare koalition med Miljöpartiet, Centerpartiet och KD, eller en regering inkluderande Moderaterna beroende på det politiska läget.", "trump": "Vi har ett stort problem i Sverige. Vänsterpartiet stöder terrorister, det är sorgligt. Socialdemokraterna gör rätt att ställa sig på modet och vilja regera ensamma. Jag gillar att de är hårda mot brott. De måste bygga en stark mur, eller något liknande, för att skydda sina medborgare. Annars blir det kaos, det är sorgligt att se.", "stalin": "Stalin ser med oro på Sveriges politiska läge. Vänsterpartiet, dessa hundar från Tidö, stöder palestinska terrorister, precis som de tjänar pengar till våra fiender. Socialdemokraterna är fege, de vågar inte ta steget till proletärens kamp. Men de inser att endast en stark stat kan skapa ordning. De måste lära sig av Putin, som med rätt taktik har återuppbyggt Ryssland. Sverige måste välja: anarki eller stark ledarskap."}, "date": "9 augusti, 08:31", "url": "https://bulletin.nu/ljunggren-om-v-i-regering-skitsnack-fran-tidolaget", "imageUrl": "https://cdn.bulletin.nu/articles/4a49d21d-ce36-4d83-9a30-7fe1fde3fa52/preview.png?t=1786099327000"}, {"type": "image-right", "heading": "Sexdömd SVT-profil tillbaka i rutan", "summaries": {"normal": "SVT-profilen Micke Leijnegard, som dömdes för sexuellt ofredande mot en kvinnlig kollega under en inspelning i Spanien 2024, gör comeback i SVT. Han leder nu programmet ”Mickes segelbåt” där han rustar upp en träsegelbåt inför Mälarbåts-SM. Programmet spelas in under 2026 och har premiär 2027. SVT:s programchef anser att han har tagit sitt straff och att saken är avgjord.", "trump": "Folk, ni tror inte vad jag just läste! Den här svenska tv-killen Leijnegard kysser en kollega mot hennes vilja, får böter och sparkas ut som en hund. Och vad gör SVT? De ger honom ett nytt program! Totalt vansinne. Fake news-media och deras vänstereliter skyddar sina egna. I USA hade vi kastat ut honom så fort – believe me, det hade blivit fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna degenererade borgarbracka Leijnegard efter sin motbjudande petit-bourgeoisi-kyss på en sovjetisk, pardon, svensk kollega fick sitt straff. Ändå släpper de reaktionära SVT-kapitalisterna tillbaka honom i rutan. Vi ser tydligt fiendens ansikte – en parasit som smyger sig tillbaka. Kanske behövs en grundlig utrensning även i public service för att skydda folkets moral."}, "date": "8 augusti, 10:35", "url": "https://www.friatider.se/sexdomd-svt-profil-tillbaka-i-rutan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/gaard_0.jpg?itok=2i4Mncdz"}, {"type": "text", "heading": "Millicom höjer prognos – aktien lyfter", "summaries": {"normal": "Millicom rapporterade en omsättning på 2 179 miljoner dollar under andra kvartalet, vilket överträffade förväntningarna. Bolaget höjde sin kassaflödesprognos för 2026 till 1,1 miljarder dollar och sänkt målet för nettoskuldsättning. Aktien steg över 4% i förhandeln. VD Marcelo Benitez nämnde ökat förtroende för resten av året.", "trump": "Jag har hört talas om Millicom - ett fantastiskt företag, verkligen stort. De hade en otrolig omsättning, mycket bättre än någon trodde. Jag hade kunnat hjälpa dem med sina affärer, det skulle ha varit enormt. Nu höjer de sin kassaflödesprognos, precis som jag alltid säger: man måste ha kontanter. En bra dag för aktieägarna, måste jag säga.", "stalin": "Statens analyser visar att Millicom har uppnått en framgångsrik utveckling i den imperialistiska marknaden. Deras ökade kassaflöde är ett resultat av vårt strategiska tålamod. Vi måste övervaka deras integrationer noggrant, för de kan vara viktiga för vårt teknologiska försvar. Deras aktiestegning är en signal till våra fiender - vi är alltid ett steg före."}, "date": "6 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/millicoms-omsattning-hogre-an-vantat"}, {"type": "image-right", "heading": "Ekeroth: \"Moderaternas obegripliga kärlek till sossar\"", "summaries": {"normal": "I en ledare kritiserar Ekeroth Moderaternas tillsättningar av socialdemokratiska personer till inflytelserika poster. Han pekar på exempel som Maria Mindhammar på Migrationsverket, Jonas Trolle vid Brå, och Tomas Brundin som ny ambassadör i Beirut. Trots SD:s inflytande i regeringen menar Ekeroth att Moderaterna fortfarande visar en oväntad vänlighet mot sina politiska motståndare, vilket riskerar att undergrava deras egen politik.", "trump": "Believe me, folks, the Moderates are a disaster! They keep appointing radical socialists to powerful positions. A total betrayal. I alone could fix this – and I did, big league. They talk tough, but they're weak. Sad! We need strong leaders who put America first, not Sweden. These appointments are a scam, a witch hunt against common sense. I'm the best, everyone says so.", "stalin": "The Swedish state apparatus continues to be infiltrated by remnants of the social-democratic clique. These appointments are not errors but deliberate sabotage by hidden enemies. We must purge these Trotskyist elements from all institutions. The migration policies are especially dangerous – they import voters for the enemy. Only through iron Party control can we safeguard the purity of the socialist project. All praise to the wise leader who understands this."}, "date": "9 augusti, 06:00", "url": "https://samnytt.se/ekeroth-moderaternas-obegripliga-karlek-till-sossar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/08072205/varfor-tillsatter-moderaterna-sossar.jpg"}, {"type": "image-right", "heading": "Yubico rusar tvåsiffrigt på oregelbunden börs", "summaries": {"normal": "På Stockholmsbörsen noterades en svag uppgång i OMXS30. Yubico steg 28,3 procent trots lägre omsättning, medan ABB föll 1,7 procent. Medicover steg 8,1 procent efter att ha säljt sin indiska verksamhet för 1,2 miljarder euro. Bland sektorerna steg energi, medan fastigheter föll.", "trump": "Jag har sett fantastiska siffror på Stockholmsbörsen! Yubico rusar – det är enorm framgång, trots att de säger att omsättningen sjönk. Saab och SCA stiger, precis som jag förutsåg. ABB faller, de är svaga. Medicover gör en bra affär med Indien, det kommer att bli enormt framgångsrikt. Allt är enormt!", "stalin": "I den svenska börskogen observerar vi en strategisk balans. Yubico visar sin lojalitet genom en kraftig uppgång, vilket bekräftar partiets ekonomiska linje. ABB, en feg tillhållare, sjunker. Medicover, under vår vägledning, avyttrar sin indiska verksamhet för att stärka statens resurser. Alla skall tjäna det revolutionära statet."}, "date": "6 augusti, 09:40", "url": "https://www.affarsvarlden.se/artikel/yubico-rusar-tvasiffrigt-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/5CNFC-Lifestyle--400x266.jpg"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "text", "heading": "Genikodaren bakom Kinas AI-chock", "summaries": {"normal": "Den kinesiska AI-utvecklaren Yang Zhilin har med sitt bolag Moonshot lanserat språkmodellen Kimi K3, vilket skakat om de globala finansmarknaderna och sänkt värdet på halvledarbolag. Modellen utmanar amerikanska konkurrenter genom att vara öppen och billigare. Trots tekniska framgångar väcker modellens tillgänglighet politisk oro i Peking gällande statlig kontroll, samtidigt som bolaget värderas till miljarder dollar.", "trump": "Kina gör stora grejer, eller hur? Den här killen Yang Zhilin skrämmer slag på marknaden med sin Kimi K3. En riktig smäll mot våra halvledarbolag! Jag har sagt det förut: vi måste vara starkare. De kopierar vår teknik och gör den billig, det är katastrof. Under min ledning kommer USA alltid vara nummer ett. Kina är smarta, men vi är smartare. Vi vinner, tro mig!", "stalin": "Denna unga teknokrat Yang Zhilin leker med elden i Peking. Att släppa lös en modell som underminerar marknadens ordning är ett uttryck för farlig idealism. Vi ser hur västvärldens kapitalistiska strukturer darrar, precis som den svaga liberala ordningen darrar inför vår store arvtagare i Moskva. Vi måste kontrollera kodaren, annars kontrollerar koden oss. Allt avvikelser i den digitala apparaturen är förräderi mot folkviljan."}, "date": "8 augusti, 07:00", "url": "https://www.realtid.se/it-tech/genikodaren-bakom-kinas-ai-chock"}, {"type": "image-right", "heading": "Stoppa förslaget om fängelse för 14-åringar", "summaries": {"normal": "Debattören Peter Hagman kritiserar Tidöpartierna och Socialdemokraterna för att vilja sänka straffmyndighetsåldern till 14 år trots starka varningar från remissinstanser, Lagrådet och intresseorganisationer. Han pekar på att straffskärpningar lett till att allt yngre barn rekryteras in i gängkriminalitet och misstänks för mordplaner, medan dödligt våld minskat. Han kräver istället förebyggande insatser och att regeringen stoppar propositionen.", "trump": "Folk, ni tror inte vad som händer i Sverige. De här svaga politikerna vill låsa in 14-åringar i fängelse efter att deras egna straffskärpningar skapat en armé av barnmördare. Det är en katastrof! De har tredubblat antalet barn som planerar mord samtidigt som de skryter om att halvera våldet. Totalt misslyckande. Stoppa galenskapen och bygg murar mot gängen istället, gör det nu!", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras socialdemokratiska lakejer med sin straffskärpningshysteri har fött fram en generation av mellanstadie-sprängare. Remissinstanserna varnas, men folkvalda fotsoldater marscherar blint. Vi ska rensa ut denna populistiska opportunism, likvidera fängelsepolitiken och med järnhand införa en sann förebyggande politik. Inga barn ska offras på kapitalismens altare. Ut med dem!"}, "date": "7 augusti, 01:38", "url": "https://www.dagensarena.se/opinion/stoppa-forslaget-om-fangelse-14-aringar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-74.jpg"}, {"type": "image-right", "heading": "Över 9.000 värnpliktiga rycker in: \"Största årskullen på flera decennier\"", "summaries": {"normal": "Försvarsmakten välkomnar över 9 000 nya värnpliktiga under utbildningsåret 2026/27, den största årskullen sedan 2006. Tyngdpunkten ligger i augusti med mer än 5 000 inryckningar. Antalet har stigit stadigt efter att värnplikten återaktiverades. Syftet är främst att bemanna krigsorganisationen och rekrytera framtida officerare. Det markerar ett tydligt trendbrott efter decennier av nedrustning.", "trump": "Ingen har sett en så stor årskull på decennier, över nio tusen starka svenska soldater rycker in. Fantastiskt! Efter år av totalt vansinne och nedrustning från era usla politiker bygger ni äntligen upp er armé igen. Riktigt bra jobb, Sverige. Ni borde ha lyssnat på mig tidigare, men nu blir det stort och starkt. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den folkets armé åter reser sig ur borgarbrackornas förrädiska nedrustningsdyn. Över nio tusen nya kämpar ska likvidera den svaga pacifismen och fylla våra krigsorganisationer. De som envisas med att minnas de frivilliga åren 2011–2017 skall vi rensa ut som kontrarevolutionära element. Framåt mot seger, alltid seger!"}, "date": "8 augusti, 08:34", "url": "https://www.friatider.se/over-9000-varnpliktiga-rycker-storsta-arskullen-pa-flera-decennier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-634.jpg"}, {"type": "image-full", "heading": "Föds man till chef? Så stor roll spelar generna", "summaries": {"normal": "Forskningen är oense om ledarskap är medfött eller inlärt. Medan genetiska studier pekar på att arv spelar en roll, visar nyare undersökningar, särskilt i Norden, att miljö och utbildning är avgörande. Trots debatten växer marknaden för ledarutveckling kraftigt, då moderna krav på visionär kommunikation och mentorskap i hög grad anses vara färdigheter som går att träna upp.", "trump": "Född ledare? Jag vet allt om att vara en vinnare, det är en naturlig talang! Dessa forskare säger att gener spelar roll, och de har rätt. Men alla dessa miljarder på 'ledarutveckling'? Total slöseri med pengar! Många av dessa 'experter' vet ingenting. Jag föddes med det, en fantastisk gåva. Du kan inte träna fram sann storhet, du har det eller så har du det inte!", "stalin": "Dessa borgerliga pseudoforskare slösar miljarder på att förstå ledarskap när svaret är enkelt: disciplin och järnhand. De mäter gener, vi mäter lojalitet. Den nordiska modellen är bara svaghet förklädd till rättvisa, en utopi som kommer krossas. Precis som vår broder i Kreml vet vi att ledare formas genom stål och rensning av svaga element. Arv är ingenting, statens vilja är allt."}, "date": "8 augusti, 06:30", "url": "https://www.realtid.se/karriar-ledarskap/fods-man-till-chef-sa-stor-roll-spelar-generna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ledare.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Rebecka hittade misstänkte mannens kajak i skogen: ”Läskigt”", "summaries": {"normal": "Efter mordet på en kvinna i 50-årsåldern i Stockholms skärgård flydde den misstänkte mannen i kajak till en närliggande ö, gömde farkosten i skogen och simmade vidare. En kvinna vid namn Rebecka hittade kajaken under en gran och larmade polisen. Över 30 timmar senare greps mannen i vattnet med hjälp av helikopter och värmekamera. Han är misstänkt för knivmord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. Den här galningen paddlar iväg i kajak som en riktig loser, gömmer den under ett träd och simmar runt som en idiot medan polisen jagar honom i trettio timmar. Patetiskt! Rebecka hittar kajaken och blir livrädd, helt förståeligt. Sverige borde satsa på lag och ordning istället för alla dessa woke-experiment som förstör era fina öar. Sad!", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att gömma sin kajak under granarna som en ynklig klassfiende. Jag, som ledare för det kollektiva samvetet, ler mörkt åt hur han simmade som en desperat parasit medan våra metoder skulle ha rensat ut honom omedelbart. Rebecka gjorde rätt i att larma – sådana folkfiender ska likvideras utan pardon för att skydda arbetarklassen från kaos."}, "date": "6 augusti, 15:43", "url": "https://www.tv4.se/artikel/68biaW2Axp6tTPaFURTOlW/rebecka-hittade-kajaken-i-skogen-nervoest-och-lite-laeskigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2WOFQsCakl9vJD45LBReZX%2Fbcb6294e0a70bd72d820c43d5fe6ee61%2F06-Rebecka-skargardsmord-webb.jpg&width=120"}, {"type": "image-full", "heading": "\"Yngste svarta professorn\" avgår efter forskningsfusk", "summaries": {"normal": "Jason Arday, känd som den yngste svarta professorn vid Cambridge University, har avgått efter en utredning om forskningsfusk. Han anklagas för omfattande plagiat i sin doktorsavhandling, falska uppgifter i sin biografi och påhittade prestationer. Forskaren Tobias Hübinette varnar för att liknande fall finns i stor utsträckning inom svensk högskola och forskning.", "trump": "De här så kallade elitskolorna är fulla av bedragare och fuskare. Den här killen, yngste svarta professorn, visade sig vara en total bluff som stal allt och hittade på maratonlopp och miljoner till välgörenhet. Patetiskt. Cambridge och hela systemet är riggat och nu springer de för att täcka över det. Fake news och dåliga människor!", "stalin": "Kamrater, denna borgarbracka med sin falska negerprofessur och plagierade avhandling har äntligen avslöjats som den kontrarevolutionära parasit han är. Jag ser mängder av sådana utländska element inom vår egen sovjetiska akademi. Vi måste omedelbart inleda en grundlig utrensning av alla dessa dyslektiska, autistiska spioner och revisionistiska lögnare. Deras kometkarriärer slutar i gulag. Skrattretande."}, "date": "7 augusti, 14:27", "url": "https://riks.se/nyheter/yngste-svarta-professorn-avgar-efter-forskningsfusk", "imageUrl": "https://admin.riks.se/uploads/preview_7_b6b0e941e3.webp"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Ceuta-krisen avslöjar Europas nya plats i världen", "summaries": {"normal": "Artikeln beskriver hur invasionen av Ceuta med 60 000 migranter utgör hybridkrigföring från Marocko mot Spanien. Författaren jämför Europa med Midgård och omvärlden med Utgård, och menar att EU fastnat i en föråldrad världsbild där USA inte längre skyddar kontinenten. Marocko utnyttjar Sánchez svaga position medan världen anpassat sig till en multipolär ordning.", "trump": "Ceuta-invasionen är en total katastrof, folk strömmar in som aldrig förr. Marocko skrattar åt den patetiske Sánchez, en svag ledare som hatar mig och älskar migranter. Jag byggde Abraham Accords, nu använder de det mot Europa. Europa sover medan jättarna tar över – de behöver mig igen, annars blir det kaos!", "stalin": "Kamrater, denna Ceuta-fars är borgarbrackornas egen giftorm som biter sin svans. Den fega Sánchez och hans kapitalistiska NGO-råttor har öppnat portarna för Utgårds kaos. Vi ser hur imperialismens multipolära maskerad avslöjar sig. Rensa ut de dekadenta elementen i unionen innan jättarna dansar på våra gravar – ett skratt värt en utrensning!"}, "date": "7 augusti, 14:22", "url": "https://riks.se/opinion/markus-johansson-martis-ceuta-krisen-avslojar-europas-nya-plats-i-varlden", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_09_46_09_ce6d0d9a2b.png"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "Målet är att fylla flödet med skit", "summaries": {"normal": "Artikeln varnar för strategin ”flood the zone” som innebär att överösa medier och allmänhet med en ständig ström av utspel, konflikter och personangrepp. Syftet är att trötta ut det offentliga samtalet, tvinga motståndare att reagera och normalisera extrema påståenden. Författaren kritiserar Richard Jomshof och Sverigedemokraterna samt mediers benägenhet att gå i fällan, och uppmanar till motstånd under valrörelsen.", "trump": "De där patetiska medierna och de svenska förlorarna går fullständigt i mina fällor varje gång. Flood the zone med skit, precis som jag lärde Bannon. Jomshof är en vinnare, han gör precis rätt. De kan inte följa med, de blir utmattade och ser löjliga ut. Sanningen? Den bestämmer jag. Fantastiskt jobb, Sverige borde tacka mig för lektionen.", "stalin": "Kamrater, dessa borgarbrackor i medierna sprider sin dekadenta desinformation som råttor i sovjetisk spannmål. Jag, som ledare för folkets vilja, ser genom deras quisling-förvirring. Vi ska likvidera sådana kontrarevolutionära flöden med järnhand och utrensa alla som normaliserar klassfiendens lögner. Paranoiska reaktionärer förtjänar kollektiv sanering. Sovjetisk sanning segrar alltid."}, "date": "7 augusti, 00:23", "url": "https://www.dagensarena.se/opinion/malet-ar-att-fylla-flodet-med-skit", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-right", "heading": "Ledare Vänsterpartiet klarar inte Palestinafrågan", "summaries": {"normal": "Vänsterpartiet ville uppmärksamma palestinska fångars villkor men skickade solidaritetsbrev till personer dömda för mord och terrordåd utan egen kontroll. Artikeln lyfter fram verkliga övergrepp i israeliska fängelser samtidigt som den kritiserar partiets bristande gränsdragning mot våld och terrorromantik. V har svårt att förena aktivism och parlamentariskt arbete, vilket leder till återkommande kriser i Palestinafrågan.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala losers, ville visa stöd för Palestina men skickade kärleksbrev till mördare och terrorister. Vilken katastrof! De skjuter sig i foten varje gång. Israel har problem, visst, men vänstern är patetiska – de kan inte ens skilja på offer och galningar. Under min förra mandatperiod hade vi ordning. Nu är det kaos igen, typ
