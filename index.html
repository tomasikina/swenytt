2090730/alfven-feature.png"}, {"type": "image-right", "heading": "Svantesson gör som kommunisterna. M finansierar sina vallöften genom en omoralisk bluff.", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiseras för att finansiera Moderaternas vallöften med ett bluffaktigt reformutrymme som egentligen innebär nedskärningar i välfärden. Kolumnisten pekar på förslag om slöserikommission, försämrade a-kassevillkor och omfördelning av bistånd som otillräckliga lösningar. Svantesson lovar trots detta stora satsningar på barnfamiljer, pensionärer och poliser.", "trump": "Lyssnade på den här svenska finansministern Svantesson och hennes desperata kommunistbluff. Totalt havererade statsfinanser, men hon lovar ändå allt till alla. Patetiskt! Vi har sett de här giriga eurokratbyråkraterna förut. De suger landet torrt och kallar det reform. Sverige behöver en riktig ledare som jag, inte dessa misslyckade socialister som gömmer sig bakom falska besparingar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i den borgerliga regeringen försöker dölja sitt haveri bakom en statlig slöserikommission och sänkt bistånd. Jag ler mörkt från historien åt deras ymnighetshorn av löften som ska finansieras med utsugning av arbetarna. Snart kommer folket att kräva en sann utrensning av dessa penninggalna hyenor som leker finansministrar."}, "date": "2 september, 11:08", "url": "https://arbetet.se/2026/09/02/elisabeth-svantesson-gor-som-kommunisterna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02110849/svantesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "”Valdagen avgör – inte någon D-day”", "summaries": {"normal": "Inför det annalkande valet kampanjar Liberalernas partiledare Simona Mohamsson och klimatminister Romina Pourmokhtari intensivt med dörrknackning i Sundbyberg. Trots att Jimmie Åkesson har satt en deadline och uppmanat väljare att överge L om de inte når över 3,5 procent, fokuserar Mohamsson helt på att säkra en blågul riksdagsmajoritet och slår bort alla tankar om ett valnederlag.", "trump": "Med tio dagar kvar till valet ser jag att de desperata radikala liberalerna i Sverige kämpar för sin överlevnad. Någon radikal kille som heter Åkesson sätter upp deadlines och ber alla att överge dem. Men den smarta kvinnan Simona Mohamsson bara skrattar, knackar dörr i Sundbyberg och käkar pizza med bebisar. Fake polls säger under spärren, men de kommer att vinna enormt stort, tror mig!", "stalin": "Kamrater! I de borgerliga utkanterna av Sundbyberg bedrivs nu en desperat agitation av den så kallade liberala fraktionen. Deras ledare Mohamsson marscherar likt en besatt genom dörrarna för att avvärja den dödsdom som utdelats av deras bundsförvant Åkesson. Staten noterar deras patetiska försök att undfly folkets vrede. De som sviker spärren kommer obönhörligen att rensas ut av den historiska matematiken."}, "date": "2 september, 11:08", "url": "https://www.aftonbladet.se/nyheter/a/43vq9g/mohasmsson-om-sd-s-deadline-behover-alla-fyra-partierna", "imageUrl": "https://akamai.vgc.no/v2/images/d8ffff74-a615-3b40-8570-1789b0969e8d?fit=crop&format=auto&h=1440&tight=true&w=2160&s=26a1452d046594e97a863c0990feb454fcd5127e"}, {"type": "image-full", "heading": "Alfvén döms för grovt förtal", "summaries": {"normal": "Jonatan Alfvén döms av Stockholms tingsrätt till villkorlig dom, dagsböter och skadestånd på 70 000 kronor per målsägande för grovt förtal. Detta efter att ha publicerat namn, bilder och uppgifter om dömda sexualbrottslingar på Facebook. Domen har väckt stark politisk debatt, där både SD-ledaren Jimmie Åkesson och statsminister Ulf Kristersson kritiserar nuvarande lagstiftning.", "trump": "Helt otroligt! En modig man hänger ut farliga förbrytare med sanningen – totala fakta! – och vad gör domstolarna? De straffar honom! Sjukt! Statsministern gråter ut i media men ingenting händer. Under min ledning skulle vi genast benåda denna fantastiska hjälte och låta lagen skydda barnen istället för kriminella. Helt bortkastat!", "stalin": "Medborgaren Alfvén agerade utan partiets direkta godkännande och spred information okontrollerat till massorna. En sådan brist på byråkratisk disciplin kan inte tolereras av staten. Ändå visar fallet på det svaga västerländska rättssystemets totala förvirring. Vi kommer att övervaka denna 'statsminister' och hans kommitté mycket noga från Lubjanka."}, "date": "2 september, 11:05", "url": "https://kvartal.se/nyheter/artiklar/jonatan-alfven-doms-for-grovt-fortal/cG9zdDoxODEyMzY", "imageUrl": "https://images.kvartal.se/2026/09/8a22c37a-alfven.webp"}, {"type": "image-right", "heading": "Sänkt matmoms slog igenom fullt i butiker", "summaries": {"normal": "Enligt en ny analys från Konjunkturinstitutet har den tillfälligt sänkta matmomsen från 12 till 6 procent fullt ut kommit konsumenterna till del i matbutikerna genom lägre priser. Däremot har prissänkningen för hämtmat hos restaurangkedjor varit betydligt mer begränsad den första månaden efter reformen.", "trump": "Svenskarna gör det igen, fantastiska skattesänkningar! Jag har alltid sagt det, sänk skatterna så vinner alla. Butikerna levererade, precis som jag brukar göra – enorma prissänkningar, helt otroligt! Men dessa slappa restaurangkedjor försöker lura folket på hämtmaten. Fake news-varning! De borde lära sig av riktigt affärsmannaskap. Stort! Verkligen stort för matköparna!", "stalin": "Statens noggranna granskning avslöjar att livsmedelshandlarna lydigt har överfört momssänkningen till massorna. Utmärkt. Men restaurangkedjorna visar oroväckande bourgeoisi-tendenser och sabotage gällande hämtmaten. Deras prismotstånd undergräver den socialistiska mathållningen. De skyldiga kommer att utredas av folkkommissariatet för omedelbar korrigering av priskursen!"}, "date": "2 september, 11:05", "url": "https://samnytt.se/sankt-matmoms-slog-igenom-fullt-i-butiker", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2025/10/24130001/mat-butik-livsmedel-affar-kottfars-frukt.jpg"}, {"type": "image-right", "heading": "Baudin (S) efter flopp-siffran: ”En varningsklocka”", "summaries": {"normal": "En färsk Novus-mätning visar att Socialdemokraterna rasar till 25,8 procent inför valet. Partisekreterare Tobias Baudin kalls Hälsar att raset är en varningsklocka och att valspurten blir jämn. Gapet till Tidöregeringen har krympt till 2,6 procentenheter. S växlar nu upp kampanjen för att möta konkurrenkten och lyfta fram sin politik.", "trump": "Socialdemokraterna är i totalt fritt fall, helt otroligt! De kollapsade till 25,8 procent i en ny fake news-fri mätning, en katastrof för dem. Deras ledare gråter ut och kallar det en varningsklocka. Jag säger er, ingen älskar att vinna mer än jag, och det här valet i Sverige blir ett blodbad. De har noll koll!", "stalin": "Kamrater, det ideologiska haveriet är ett faktum. Socialdemokraterna har genom sitt ynkliga svaghetsmantra sjunkit till 25,8 procent. Den så kallade varningsklockan ekar som ett falskt larm i partiets korridorer. Vi kommer nu att skärpa agitationen och granska dessa desertörer hårdare. Inga avvikelser tolereras när statens framtid står på spel!"}, "date": "2 september, 10:59", "url": "https://bulletin.nu/baudin-s-efter-flopp-siffran-en-varningsklocka-2", "imageUrl": "https://cdn.bulletin.nu/articles/6cd81707-2976-478e-ad35-013a7aff9fe9/preview.jpg?t=1788339534000"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Den svenska modellen är död – dags för motstånd!", "summaries": {"normal": "Artikeln förklarar att den svenska modellen är död efter Teslakonfliktens slut. IF Metall köpte ut de sista strejkande och visade på facklig passivitet och centralisering. Författaren menar att arbetarna måste återupptäcka strejkvapnet och agera självständigt utanför LO-fackens byråkrati för att återta sin politiska kraft.", "trump": "Den här svenska modellen är en total katastrof, en riggad fotboja som har hållit arbetarna i schack i hundra år. Patetiska fackbyråkrater och deras jurister springer till Elon och ber om en kram medan riktiga människor får lida. Nu är det över. Dags att sluta med det woke-facket och börja vinna på riktigt, tro mig.", "stalin": "Denna fackliga förräderi mot arbetarklassen är ett ypperligt bevis på hur de profitthungriga klassförrädarna har förgiftat hela systemet. Jag ser hur den svenska modellen har blivit en parasitisk tvångströja. Arbetarna måste rensa ut dessa dekadenta lakejer och återta makten själva. Kompromissen är död. Motståndet lever."}, "date": "2 september, 09:01", "url": "https://proletaren.se/artikel/den-svenska-modellen-ar-dod-dags-for-motstand", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledare_web-768x432.jpg"}, {"type": "text", "heading": "Kommunal bojkott av Israel – ett självklart krav", "summaries": {"normal": "Kommunistiska Partiet kräver en total bojkott av Israel i Sverige, både ekonomisk, politisk, idrottslig, akademisk och kulturell. Partimedlemmar har lämnat motioner och medborgarförslag i flera kommuner samt arrangerat demonstrationer. De ser bojkotten som ett sätt att stödja Palestina och stoppa vad de kallar folkmord och ockupation.", "trump": "Lyssnar ni på de här kommunistiska förlorarna som vill bojkotta Israel? Patetiska radikala galningar som hatar en stark demokrati medan de kysser terroristers fötter. Det är samma gamla vänstervridna hyckleri som under Biden. Vi behöver inga bojkotter – vi behöver segrar och Amerika först, inte dessa palestinska sympatisörer som förstör allt.", "stalin": "Jag ser hur dessa modiga kamrater kämpar mot de giriga ockupationshyenorna och deras lakejer. En total bojkott är ett kraftfullt vapen i den antiimperialistiska kampen. Historien kommer att likvidera alla som stödjer folkmordsstaten. Arbetarna och det palestinska motståndet måste enas. Svaghet är förräderi mot folkets sak."}, "date": "2 september, 08:00", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Simona Mohamsson om ökningen: ”Jobbat hårt”", "summaries": {"normal": "Liberalerna ökar med 1,4 procentenheter till 3,3 procent i Novus mätning, enligt partiledaren Simona Mohamsson. Partiet närmar sig riksdagsspärren med elva dagar kvar till valet. Mohamsson pekar på väljarnas önskan om en blågul regering och rädsla för vänsterexperiment som förklaring. Gapet mellan blocken har minskat till 2,6 procentenheter.", "trump": "Titta på de här Liberalerna som äntligen vaknar upp! De klättrar till 3,3 procent, och det är tack vare att svenskarna är livrädda för de galna vänsterlojorna som vill förstöra landet. Simona gör ett fantastiskt jobb, mycket bättre än Sleepy Joe någonsin gjorde. Fortsätt kämpa så slipper ni den socialistiska katastrofen, folk!", "stalin": "Jag ser hur dessa liberala element försöker närma sig spärren med sina små procent. De fruktar det stora vänsterexperimentet som ett svagt folk borde göra. Men deras så kallade fred inom det blågula lägret är en illusion skapad av fiender till kollektivet. Kamrater, valdagen avslöjar alla förrädare och deras fega kompromisser."}, "date": "2 september, 10:13", "url": "https://www.tv4.se/artikel/43RdaQ6tZ4ZQ9aJevZ4ONI/mohamsson-om-l-s-lyft-har-jobbat-hart", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3NpHpzpFoVtG5oSEG5lzpN%2Fe135c34183cd1655a4a3638dd0914059%2F09-simona-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Två begärs häktade efter dödsmisshandeln", "summaries": {"normal": "Två män, 19-årige Teo Ahlstrand och 20-årige Sebastian Bergman, begärs häktade för dråp efter att 48-årige Mattias misshandlades till döds utanför Burger King i centrala Karlstad natten till den 30 augusti. I andra hand misstänks de för grov misshandel och grovt vållande till annans död. Häktningsförhandlingar hålls under onsdagen.", "trump": "Titta på det här, folk. I Sverige, där de har låtit vänsterns galna identitetspolitik och öppna gränser regera alldeles för länge, mördas en oskyldig man utanför en Burger King av två yngre individer. Patetiskt. Under Biden var världen svag, nu fixar jag det. De här förlorarna borde aldrig ha släppts lösa på gatorna.", "stalin": "Kamrater, se hur den borgerliga dekadensen förvandlar städer till slagfält. Jag betraktar med förakt hur dessa lumpna element slår ihjäl en arbetets son utanför en kapitalistisk matservering. Sådana parasiterande klassförrädare måste rensas ut innan de infekterar hela samhället. Partiet kräver järnhand mot detta anarki."}, "date": "2 september, 10:26", "url": "https://riks.se/nyheter/tva-begars-haktade-efter-dodsmisshandeln", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_3_b8a59b2f3d.jpg"}, {"type": "image-right", "heading": "Även Dolly Parton brydde sig om klimatet", "summaries": {"normal": "Göran Greider talar på en klimatparad i Falun och kritiserar att klimatfrågorna är frånvarande i valrörelsen trots bränder och en glaciärkollaps i Himalaya. Han ser en växande grön jätte som förenar jämlikhet med miljökrav och uppmanar till opinion för en omställning som minskar överkonsumtion bland de rika.", "trump": "De här gröna galningarna med sina röda halsdukar babblar om en jätte som vaknar. Dolly Parton bryr sig plötsligt om klimatet? Under min förra mandatperiod fixade vi energi och jobb, sen kom Sleepy Joe och förstörde allt. Nu vill de krympa plånböckerna för vanliga människor. Patetiska förlorare, era gröna troll kommer inte vinna.", "stalin": "Denna tystnad kring klimatkrisen och ojämlikheten är en skam för alla dekadenta klassförrädare. Jag betraktar hur den gröna jätten reser sig ur skogarna och kräver utrensning av de profitthungriga hyenorna som förgiftar biosfären. Kamrater, sitt på dess axlar och tvinga fram en sann omvälvning innan fienderna likviderar framtiden."}, "date": "2 september, 03:00", "url": "https://www.etc.se/ledarkolumn/aeven-dolly-parton-brydde-sig-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-full", "heading": "Thand Ringqvist ser ”uppmjukning” hos KD", "summaries": {"normal": "Thand Ringqvist vill se ett liberalt mittenalternativ med C, S, KD och eventuellt MP i regeringsställning. Trots att MP och KD vägrar samarbeta med varandra, ser hon en uppmjukning hos KD och en samsyn kring tillväxt. Även i den känsliga frågan om förbud mot niqab och burka ser hon en möjlig kompromiss.", "trump": "Thand Ringqvist tror att hon kan bygga en regering med alla, totalt kaos! De bråkar om burkakrav och miljöpartister som ingen vill ha, men plötsligt älskar KD varandra igen. Det är som ett dåligt reality-TV-program, svag ledning! Med mig som president hade detta lösts på fem minuter, inga svaga kompromisser, bara vinnare!", "stalin": "Dessa svenska borgerliga element famlar i mörkret efter en koalition som liknar ett politiskt potatismos. De diskuterar slöjor och tillväxt som om statens överlevnad hängde på det. Om avvikelserna fortsätter i denna ynkliga sandlåda ser jag mig tvingad att skicka samtliga partiledare till lämplig omskolningsanstalt i Sibirien för ideologisk skärpning."}, "date": "2 september, 07:01", "url": "https://kvartal.se/nyheter/artiklar/thand-ringqvist-ser-uppmjukning-hos-kd/cG9zdDoxODA5NDc", "imageUrl": "https://images.kvartal.se/2026/09/32db0fe2-etr.webp"}, {"type": "image-full", "heading": "Liberalerna ökar till 3,3 procent – spurtar mot spärren", "summaries": {"normal": "En ny Novusmätning visar att Liberalerna ökar till 3,3 procent och närmar sig riksdagsspärren. Socialdemokraterna backar kraftigt till 25,8 procent, en minskning med över fyra procentenheter. Oppositionens försprång krymper till 2,6 procentenheter. Vänsterpartiet och Centerpartiet stärks, medan Moderaterna backar och Sverigedemokraterna går fram.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Den stora socialdemokratiska bluffen rasar ihop som en korthus, ner över fyra procent – patetiskt! Liberalerna, de små ynkryggarna, kryper upp mot spärren. Oppositionen håller på att kollapsa. Den röda faran är över. Make Sweden Great Again, kamrater!", "stalin": "Jag ser de dekadenta borgerliga opinionerna svikta som förrädiska element. Socialdemokraterna, dessa falska kamrater, rasar som sabotörer inför kollektivets dom. Liberalerna försöker slingra sig mot spärren som ynkliga opportunister. Oppositionens lilla försprång ekar som en dödsdom över revisionisterna. Renhet krävs, alltid."}, "date": "2 september, 08:07", "url": "https://www.tv4.se/artikel/5TPh9cL7pqcj232bse8TAx/l-oekar-stort-spurtar-mot-spaerren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FBthmLXWEjvKxFcBrs3okP%2Fb0cf058bc2ed7a597ae922fc1bc8e3e5%2F01-mohamsson-webb.png&width=1024"}, {"type": "image-right", "heading": "Låt det bli ett värderingsval", "summaries": {"normal": "Socialdemokraternas valmanifest innehåller bland annat billigare tandvård för vuxna. Artikeln ifrågasätter om väljarna kan hålla reda på alla partiers vallöften strax före valet. Författaren kritiserar Sverigedemokraterna och Tidöpartierna samt lyfter vikten av att väga välfärdslöften mot skattesänkningar och värderingar istället för enbart plånboksfrågor.", "trump": "De här svenska socialisterna lovar gratis tänder och julklappar till alla. Patetiskt! Jag har byggt den starkaste ekonomin i världen utan sådana löjliga mutor. Väljarna minns inte ett dugg av vad de röda clownerna lovat. Låt det bli ett värderingsval mot de verkligt galna vänsterknäppningarna och deras identitetspolitiska vansinne. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare öser ut löften om billig tandvård och barnbidrag som om de vore folkets vänner. Jag ler från historien åt deras desperation. Väljarna ska inte luras av de profitthungriga hyenornas tomma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-right", "heading": "De bortglömda väljarna kan avgöra valet", "summaries": {"normal": "Artikeln kritiserar hur äldre och personer med invandrarbakgrund osynliggörs eller misstänkliggörs i valrörelsen. Båda grupperna har byggt Sverige genom hårt arbete och bidrar fortfarande, men behandlas som problem istället för värdefulla medborgare. Författaren uppmanar till respekt, tack och politik som inkluderar dem för att skapa äkta sammanhållning.", "trump": "Folk, det här är en total skam. Politiker glömmer de fantastiska äldre som byggde ert underbara Sverige och kallar invandrarna för belastning när de faktiskt håller igång landet. Rena idioter och woke-sjuklingar som leker identitetspolitik. Jag skulle tacka dem ordentligt, inte som Sleepy Joe gjorde. Ni behöver starka ledare, inte dessa patetiska förlorare som splittrar er.", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i valrörelsen osynliggör arbetets hjältar och målar invandrade kamrater som hot. Deras dekadenta lögner göder splittring. Vi måste rensa ut dessa folkförtryckare och deras paranoia. Endast genom att värdesätta massornas insats kan samhället stärkas. Annars väntar utrensning av de svekfulla elementen."}, "date": "2 september, 01:42", "url": "https://www.dagensarena.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Kollaps för Magdalena Andersson – störtdyker i ny mätning", "summaries": {"normal": "Socialdemokraterna rasar i ny Novus-mätning för TV4 och backar 4,3 procentenheter till 25,8 procent. Sverigedemokraterna ökar till 20,7 procent och Liberalerna till 3,3 procent. Gapet mellan oppositionen och Tidöpartierna krymper från 6,9 till 2,6 procentenheter. Mätningen genomfördes 24–30 augusti.", "trump": "Folk älskar mig, men titta på den här katastrofen för Sleepy Magdalena och hennes döende socialister. De störtdyker 4,3 procent – en total kollaps! SD vinner stort medan de woke-liberalerna kryper över spärren. Patetiska förlorare med sin identitetspolitik. Sverige behöver en verklig ledare, inte dessa nollor.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare rasar ihop som murkna stockar. Den så kallade Andersson leder sitt parti rakt ner i avgrunden medan folket vänder sig mot de exploaterande hyenorna. Vi ler i skuggorna. En sådan svaghet förtjänar utrensning. Historien dömer de fega opportunisterna hårt."}, "date": "2 september, 07:43", "url": "https://riks.se/nyheter/kollaps-for-magdalena-andersson-stortdyker-i-ny-matning", "imageUrl": "https://admin.riks.se/uploads/medium_Magdalena_Andersson_Almedalen_2025_03_1_de96f89f8d.jpg"}, {"type": "image-full", "heading": "Gick till fel hus – sköts ihjäl av polis", "summaries": {"normal": "En 22-årig student sköts ihjäl av en polis i Pennsylvania efter att ha tagit sig till fel hus i tron om att det var en väns bostad. Polisen, som agerade ensam och på säkert avstånd när den obeväpnade mannen höll händerna uppe, har nu åtalats för dråp då våldet bedömdes som helt omotiverat.", "trump": "Totalt inkompetent hantering i Pennsylvania! En polis skjuter en ung kille som bara gått till fel hus. Helt otroligt dåligt. Killen stod med händerna i luften och utgjorde noll hot. Polisen hade elpistol men sköt ändå ihjäl honom. Sånt här händer när radikala åklagare tappar kontrollen. Vi måste stötta riktig polisingripande, men det här var en katastrof!", "stalin": "En tragisk brist på disciplin inom de lokala ordningsleden i Pottstown. Att en ordningsmakt avlossar dödande skuldror mot en obeväpnad medborgare med händerna höjda visar på gravt undermåligt handhavande. Sådana misstag tolereras icke i en effektiv stat. Den skyldige polismannen har ställts inför rätta för dråp för att statordningen och allmänhetens lydnad inte ska raseras."}, "date": "2 september, 07:08", "url": "https://www.gp.se/nyheter/varlden/student-skots-ihjal-i-pennsylvania-polis-atalas-for-drap.458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5", "imageUrl": "https://www.gp.se/images/article/458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5/images/2ntRMvHONM1crpfGnAw6cAYMQZMo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sverige kallar upp Rysslands ambassadör", "summaries": {"normal": "Sverige kallar upp Rysslands ambassadör till Utrikesdepartementet efter att Tyskland anklagat Ryssland för ett drönarattackförsök mot flygplatsen i Leipzig i augusti. Drönaren bar en sprängladdning. Statsminister Ulf Kristersson ser händelsen som del av ett mönster av ryska hybridaktiviteter. Regeringen ställer sig bakom Tysklands åtgärder och Nationella säkerhetsrådet har sammanträtt.", "trump": "De galna ryssarna leker med drönare fulla med sprängämnen på en Nato-flygplats i Tyskland. Patetiskt! Nu ropar de svenska globalisterna upp ambassadören och försöker se tuffa ut. De borde tacka mig för att jag höll Putin i schack förra gången. Biden lät dem bli helt galna. Vi vinner ändå, tro mig.", "stalin": "Kamrater, dessa dekadenta klassfiender i väst skriker igen. Jag betraktar hur de imperialistiska hyenorna i Berlin och Stockholm kallar upp ambassadörer och samlas i hemliga råd för att dölja sin egen svaghet. Deras rädsla är underhållande. Rysslands starka hand fortsätter att pröva deras murkna allianser. De kommer att falla."}, "date": "2 september, 10:48", "url": "https://www.svt.se/nyheter/utrikes/efter-attackforsoket-i-tyskland-sverige-kallar-upp-rysslands-ambassador", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.35/e40a2a6c76236eed9196078ed8463359bd587edcf23469c2ed527a0a99c8defb"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-right", "heading": "Women's Super League 2026/2027", "summaries": {"normal": "Women's Super League är en av världens främsta damfotbollsligor med 14 lag och 26 omgångar. Regerande mästare är Manchester City. SVT sänder flera matcher under säsongen 2026/2027, bland annat Brighton-Arsenal och Chelsea-Arsenal. 18 svenska spelare, däribland Stina Blackstenius, Kosovare Asllani och Fridolina Rolfö, deltar tillsammans med svensk tränare André Jeglertz.", "trump": "Lysande, helt fantastiska svenska tjejer som Stina Blackstenius och Rosa Kafaji dominerar den här ligan. De spelar bättre än de flesta killar i Europa, tro mig. SVT sänder matcherna, men ligan är full av woke-kvoterade lag som prioriterar identitetspolitik framför riktig talang. Vi behöver inga dekadenta genusaktivister i fotbollen, bara vinnare. Make football great again.", "stalin": "Jag betraktar med djup misstro hur dessa profitthungriga fotbollshyenor förvandlar arbetarklassens sport till en dekadent cirkus för västvärldens underhållning. 18 svenska spelare springer runt i en liga styrd av giriga marknads krafter. Vi ser tydligt hur klassfienderna utnyttjar kropparna för profit medan folket tvingas betala. Rensa ut alla parasiterande opportunister ur idrotten."}, "date": "2 september, 10:34", "url": "https://www.svt.se/sport/fotboll/womens-super-league-20262027", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.57/0.46/cdeaa976e7c3b32b4b8f4d3ba594c015e17f6cb4868d687002e048c5469894f6"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Var bråket en smart politisk manöver?", "summaries": {"normal": "En Novus-mätning visar att Socialdemokraternas stöd rasar till 25,8 procent medan Liberalerna stiger till 3,3 procent och närmar sig riksdagsspärren. Skillnaden mellan blocken är nu inom felmarginalen. Analysen pekar på att bråket mellan Åkesson och Mohamsson kan ha varit en medveten manöver för att ge Liberalerna mer uppmärksamhet.", "trump": "Folk älskar mig, men titta på de här losersen! Socialisterna rasar som en sten, 25,8 procent, en total katastrof för den röda Magdalena. Liberalerna får plötsligt luft av mig och Jimmie, smarta killar. Blocken ligger jämsides. Det är valrörelse-bomben, baby, och de svenska eliten ser ut som fulla idioter nu.", "stalin": "Jag ser hur de borgerliga revisionisterna och socialdemokratiska opportunisterna kollapsar inför folkets dom. Deras falska block splittras som råttor i en hungersnöd. Den lilla liberala klicken räddas genom listig teater. Kamrater, detta kaos visar att bara en järnhand kan styra en stat. Inga halvmesyrer tolereras."}, "date": "2 september, 05:47", "url": "https://www.tv4.se/artikel/5LHyf1bCaoz72uGCGARlkg/var-braket-en-smart-politisk-manoever", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-right", "heading": "Ledare S söver ner valrörelsen – SD tackar och tar emot", "summaries": {"normal": "Socialdemokraterna har enligt ledaren gjort valrörelsen ovanligt sömnig genom att ligga nära regeringen och undvika tydliga konflikter. Magdalena Andersson uppger att valet inte handlar om någonting. Det gynnar Sverigedemokraterna som får fokusera på migration och kriminalitet istället för ekonomi. Tomas Ramberg kallar det det konstigaste valet på 30 år.", "trump": "Det här är en total katastrof, folk. Den sömngångande S-kvinnan Andersson har förvandlat hela valrörelsen till en tråkig gröt. Hon lovar att vara snålare än snåljåparna! Under tiden skrattar SD hela vägen till banken medan fokus hamnar på slöjor och fotbojor. Patetiska vänsterhyenor som gömmer sina löften – ingen bryr sig om det riktiga folket längre.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna förvandlar politiken till en grå, sövande sörja. De tonar ner kampen mellan arbete och kapital och lämnar fältet fritt åt högerpopulisterna. En sådan feghet förtjänar utrensning ur historien. Väljarna kommer att straffa dessa fegisar när de inser att de har förrått folket."}, "date": "1 september, 11:24", "url": "https://www.etc.se/ledare/s-soever-ner-valroerelsen-sd-tackar-och-tar-emot", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Döende åldring våldtogs på sjukhus – manlig sjuksköterska häktad", "summaries": {"normal": "En manlig sjuksköterska har häktats misstänkt för grov våldtäkt mot en döende äldre kvinna på Länssjukhuset Ryhov i Jönköping. Kvinnan avled kort därefter av sin sjukdom. Mannen erkänner handlingen men anser att den ska rubriceras som grovt sexuellt övergrepp. Åklagaren bedömer det som grov våldtäkt på grund av hans ställning och kvinnans utsatta läge. Utredningen fortsätter.", "trump": "Folk, det här är sjukt. En sjuksköterska på ett svenskt sjukhus våldtar en stackars döende gumma i hennes sista timmar. Patetiskt! De här woke-vårdlakejerna och deras kvoteringsvansinne har förstört allt. Inget är heligt längre. Vi behöver lag och ordning, inte dessa monster i vita rockar. Jag fixade det i USA – Sverige borde vakna innan det är för sent.", "stalin": "Kamrater, se hur den dekadenta vårdaristokratin förfaller när folkets omsorg blir ett byte för giriga hyenor. Jag betraktar med fasa denna råa exploatering av en döende arbetets moder. Sådana klassförrädare inom sjukvården måste rensas ut med järnhand. Partiet kräver total kontroll. Inga parasiter får undslippa folkets vrede."}, "date": "2 september, 09:52", "url": "https://www.friatider.se/doende-aldring-valdtogs-pa-sjukhus-manlig-sjukskoterska-haktad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/72188ec5-7c16-4ae5-b555-aac765265c8d.jpg?itok=dYwj6Q4b"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "EU bestämmer vad som får kallas sylt – svenska produkter blir ”beredning”", "summaries": {"normal": "Från den 14 juni gäller nya EU-regler för sylt, gelé och marmelad som höjer minimikravet på frukt- och bärinnehåll från 350 till 450 gram per kilo. Produkter som inte når upp till den nya gränsen får inte längre kallas sylt. I Sverige har branschen valt att kalla dem ”beredning”, vilket påverkar ett elva-tal produkter hos Orkla.", "trump": "EU förstör allt! Nu förbjuder de ordet sylt för att bären inte räcker till. Total katastrof! De tvingar stolt svenska folkets lingon att heta ”beredning”. Så hemskt, så förnedrande. I Amerika har vi riktig sylt, den bästa sylten, enorma mängder frukt! Byråkraterna i Bryssel har noll koll. De borde lämna bären i fred!", "stalin": "Dessa patetiska byråkrater i EU leker med folket genom att förbjuda ordet sylt och ersätta det med den misstänksamma ”beredningen”. Ett uppenbart sabotage mot morgonfriden! Jag beordrar omedelbar granskning av bärhalterna. Varje underlåten gram frukt är ett förräderi mot staten som straffas med omedelbar omplacering till kolchoserna!"}, "date": "2 september, 10:00", "url": "https://samnytt.se/eu-bestammer-vad-som-far-kallas-sylt-svenska-produkter-blir-beredning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01134347/sylt-eu.jpg"}, {"type": "image-right", "heading": "Stödväljarna kan rädda L – rusar till 3,3 procent", "summaries": {"normal": "Liberalerna rusar till 3,3 procent i TV4/Novus mätning, upp 1,4 procentenheter och når sin högsta siffra sedan Muharrem Demirok tog över. Socialdemokraterna tappar samtidigt 4,3 procentenheter till 25,8 procent, vilket krymper oppositionens ledning till 2,6 procentenheter. Moderaterna backar medan Sverigedemokraterna stärker sin position som största parti på Tidösidan.", "trump": "Folket vaknar äntligen! Den patetiska vänsterns marionetter tappar allt medan Liberalerna, de enda som inte böjer sig för HBTQ-galenskap och woke-kvotering, rusar upp till 3,3 procent. Sossekramarna sjunker som en sten. Det är en total katastrof för de röda bluffmakarna. Amerika har redan sett igenom det här – nu gör Sverige samma sak. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Socialdemokraterna rasar med 4,3 procentenheter. Deras falska folkfront vittrar sönder medan de småborgerliga liberala opportunisterna försöker rädda sig med en ynklig uppgång. Vi betraktar deras desperata manövrar med förakt. Inga utsugande parasiter undkommer folkets dom. En kommande utrensning av sådana element blir oundviklig."}, "date": "2 september, 08:36", "url": "https://www.friatider.se/stodvaljarna-kan-radda-l-rusar-till-33-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-808.jpg?itok=55YnY5KF"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Bygga blandat löser inte integrationen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas idé om att blanda bebyggelse och befolkning för att bryta segregationen. Författaren menar att tvångsblandning väcker stark oro hos boende och liknar social ingenjörskonst. Exemplet Limhamn visar att människor inte umgås automatiskt bara för att de delar område. Utbildning och arbete ses som bättre lösningar än politisk styrning av boendet.", "trump": "Folk, dessa galna socialdemokratiska ingenjörer vill tvinga in folk i era fina områden och kalla det integration. Det är ett totalt misslyckande, precis som i Limhamn där alla lever separata liv ändå. Patetiska vänsterextremister som tror att de kan styra människors liv bättre än marknaden. Det fungerar aldrig, tro mig. Bygg, skapa jobb och sluta leka gudar med folks hem.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom socialdemokratin drömmer om att blanda befolkningen som i en fabrik för att skapa sin utopiska harmoni. Deras så kallade blandning i Limhamn är ett farsartat fiasko där folket lever åtskilda som fiender. Jag skrattar mörkt åt deras naivitet. Endast genom arbete och disciplin kan vi rensa ut den verkliga segregationen, inte genom deras fega planmonopol."}, "date": "2 september, 10:41", "url": "https://www.di.se/ledare/bygga-blandat-loser-inte-integrationen", "imageUrl": "https://static.bonniernews.se/ba/56c86402-0bb6-433e-8e94-bafc9871f504.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ica ska drogtesta alla som ska anställas", "summaries": {"normal": "Ica drogtestar alla som erbjuds anställning för att skapa en drogfri och trygg arbetsmiljö. Facket Handels kritiserar metoden som integritetskränkande och förespråkar istället utbildning och närvarande chefer. Testet sker via urinprov i slutet av rekryteringsprocessen och gäller inte nödvändigtvis alla butiksanställda på grund av Icas affärsmodell med fria handlare.", "trump": "De här galna Ica-borgarna tvingar folk att kissa i en burk innan de får jobb. Patetiskt! Jag byggde ett imperium utan att snoka i folks helgvanor. Facket har rätt för en gångs skull – det är en witch hunt mot vanliga arbetare. Sluta behandla amerikaner, eh, svenskar som brottslingar. Make workplaces great again, utan det socialistiska kontrollsamhället!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ica vill rensa ut arbetare genom att tvinga fram urinprov som avslöjar deras helgresor. Jag ser giriga hyenors rädsla för en nykter proletariat. Vi ska istället utrusta chefer och arbetare med ideologisk vaksamhet för att upptäcka fiender. Inga parasiterande kapitalistlakejer ska diktera folkets fritid. Revolutionen kräver riktad rättvisa, inte blind paranoia."}, "date": "2 september, 08:01", "url": "https://arbetet.se/2026/09/02/ica-drogtestar-alla-som-ska-anstallas-facket-integritetskrankande", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02075905/drogtest.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "FN-rapport: 1,5-gradersmålet spricker", "summaries": {"normal": "En ny FN-rapport slår fast att 1,5-gradersmålet från Parisavtalet inte kommer att nås. Tröskeln passeras inom tio år. I bästa fall kan uppvärmningen begränsas till 1,8 grader. Forskare betonar att målet inte längre handlar om att undvika misslyckande utan om att begränsa skadorna. Snabb minskning av utsläpp, särskilt metan, och tekniska lösningar krävs för att hålla temperaturen under två grader.", "trump": "Hörni, de där globalistiska klimatfanatikerna har nu erkänt att deras dumma 1,5-gradersdröm är död. Inom tio år blir det varmare och de springer runt som hysteriska höns. Biden och hans gröna galningar förstörde allt med sina vansinniga regler. Men jag fixar det – vi ska göra Amerika starkt igen utan att låta dessa korkade miljöterrorister styra oss. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa dekadenta klassförrädare har äntligen erkänt att deras borgerliga 1,5-gradersfantasi är en fars. Uppvärmningen närmar sig och de skälver som förrädare inför folkets dom. Vi ska inte falla för apati utan rensa ut de parasiterande profitthungriga som förgiftar både natur och revolution. Varje tiondels grad är en varning – vi ska vända utvecklingen med järnhand och disciplin."}, "date": "2 september, 10:30", "url": "https://www.di.se/nyheter/fn-rapport-15-gradersmalet-spricker", "imageUrl": "https://static.bonniernews.se/ba/70a562f9-0189-494f-9bf3-185630dd92b3.jpg?crop=3414%2C1707%2Cx0%2Cy285&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Allard: ”Får vi tolv procent i riksdagsvalet så är vi inne”", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet får drygt 15 procent i regionvalet, en tredubbling jämfört med 2022. Partiledaren Markus Allard bedömer att tolv procent i riksdagsvalet skulle ge plats i riksdagen. Partiet är öppet för samarbete men vill inte kompromissa med sin politik. Väljare från Tidöpartierna och Socialdemokraterna dras till partiet.", "trump": "Titta på det här, folket älskar det! Det här Örebropartiet exploderar i mätningarna, de tredubblar stödet medan de vanliga förlorarna skakar. Allard säger att tolv procent räcker för att komma in i riksdagen. Fantastiskt! De woke-kvoteringsfanatikerna och de globalistiska elitlakejerna hatar det. Rösta på dem i Örebro, era röster kan faktiskt vinna stort den här gången. Underbart!", "stalin": "Kamrater, se hur detta parti växer som en folklig kraft mot de giriga klassförrädarna. Jag betraktar med tillfredsställelse hur de lovar att aldrig sälja sig till de dekadenta maktparasiterna. Tolv procent i riksdagen skulle vara en seger för arbetarna. De som röstar fel förtjänar utrensning ur historien. Varje röst i Örebro län kan bli ett slag mot borgarhyenorna. Rösta rätt, eller försvinn."}, "date": "2 september, 10:23", "url": "https://bulletin.nu/allard-far-vi-tolv-procent-i-riksdagsvalet-sa-ar-vi-inne", "imageUrl": "https://cdn.bulletin.nu/articles/1a77a0f6-b0e4-4e4e-b3de-f0c715bdf647/preview.jpg?t=1788332255000"}, {"type": "image-right", "heading": "SD det enda som kan väcka Fröken Snusks politiska eld", "summaries": {"normal": "Artikeln kritiserar Fröken Snusks politiska utspel efter ett samarbete med Jimmie Åkesson. Författaren ser det som ett marknadsföringsknep från producenten Rasmus Gozzi för att nå Sverigedemokraternas väljare. Avbokningen i Växjö framställs som ett överdrivet trauma medan varumärket beskrivs som ren propaganda snarare än kultur.", "trump": "Den här Fröken Snusk-tjejen och hennes skumme producent är ett totalt skämt. De sjunger plötsligt om trygghet och Jimmie bara för att fylla fickorna med SD-pengar. Patetiska! Fake news-medier och woke-kultur har förstört allt, men nu vaknar folket. Jag älskar det, men det är ändå bara en annan grifter som lurar sina egna anhängare.", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur dekadenta profitthungriga parasiter utnyttjar massornas naivitet. Denna så kallade artist och hennes lakej förvandlar konsten till ren kontrarevolutionär propaganda för reaktionära krafter. Ett sådant förräderi mot folket förtjänar snar utrensning ur kulturen. Kamrater, vakna upp innan dessa hyenor förgiftar allt!"}, "date": "2 september, 07:56", "url": "https://arbetet.se/2026/09/02/sd-det-enda-som-kan-vacka-frokens-snusks-politiska-eld", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02074413/snusk-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "image-right", "heading": "Misstänkt sabotage mot tyska elnätet", "summaries": {"normal": "Tyska myndigheter utreder ett misstänkt sabotage mot elnätet väster om Köln. En störning vid en transformatorstation i Bergheim påverkade två kolkraftverk, men ledde inte till strömavbrott. Händelsen följer på ett liknande misstänkt angrepp vid ett stort kraftverk i östra Tyskland. Polisen misstänker avsiktlig handling.", "trump": "Titta på det här, elnätet i Tyskland saboteras igen och ingen gör något åt det. De europeiska svaga ledarna låter Ryssland eller vem det nu är leka med deras kraftverk som ett gäng misslyckade woke-aktivister. Under min förra mandatperiod hade vi aldrig sådana här patetiska fiasko. Nu fixar jag det på riktigt.", "stalin": "Ännu ett fegt angrepp mot arbetarnas energiförsörjning i Tyskland. Jag ser de giriga hyenornas hand i detta kaos. Kamrater, sådana handlingar avslöjar imperialismens desperation. Vi betraktar med historisk förakt hur dekadenta krafter försöker destabilisera staterna. Rensa ut alla som gynnar fienden, det är enda vägen framåt."}, "date": "2 september, 10:21", "url": "https://www.di.se/nyheter/misstankt-sabotage-mot-tyska-elnatet-utreds", "imageUrl": "https://static.bonniernews.se/ba/1cfb3e9f-41ae-45bd-807b-7390f426e9e8.jpg?crop=2000%2C1000%2Cx0%2Cy217&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson om L:s ökning: ”Bara en mätning”", "summaries": {"normal": "Liberalerna ökar till 3,3 procent i Novus senaste mätning under Simona Mohamssons ledarskap, samtidigt som Socialdemokraterna tappar. Uppgången innebär att partiet närmar sig gränsen på 3,5 procent som Jimmie Åkesson har ställt upp för att sluta avråda väljare från att rösta på dem. Åkesson manar dock till avvaktan och menar att det bara är en mätning.", "trump": "Lyssna, jag känner till det här bättre än någon annan. Liberalerna i Sverige har gjort en enorm ökning till 3,3 procent, den absolut bästa siffran någonsin för den här fantastiska Simona Mohamsson. Men Jimmie Åkesson är smart, en riktig vinnare, och säger att det bara är en mätning! Socialdemokraterna kraschar totalt, fullständigt fejkade siffror tidigare. Vi älskar starka gränser!", "stalin": "Kamrater, avdelningen för opinionsstatistisk kontroll rapporterar att Liberalerna nått 3,3 procent under ledare Mohamsson, en avvikelse som noggrant noteras i de centrala arkiven. Partiets funktionär Åkesson förhåller sig dock korrekt misstänksam och påpekar att en enskild siffra ej räcker. Statens säkerhet kräver ett bredare underlag innan vi betraktar dem som politiskt rehabiliterade."}, "date": "2 september, 10:12", "url": "https://bulletin.nu/akesson-om-l-s-okning-bara-en-matning", "imageUrl": "https://cdn.bulletin.nu/articles/cd1f5b08-99bd-4586-8fa7-0dd7448c7104/preview.png?t=1788336751000"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "13-åring såg ”betydligt äldre ut” – man frias från våldtäkt", "summaries": {"normal": "En 24-årig man i Dalarna frias från våldtäkt mot en 13-årig flicka. Tingsrätten anser att det inte kan bevisas att mannen insåg att flickan var under 15 år, eftersom hon uppgavs se betydligt äldre ut och rörde sig ute sent bland äldre ungdomar.", "trump": "Helt otroligt! En kille i Sverige frias eftersom flickan såg 'betydligt äldre ut'. Vilket totalt misslyckande för rättvisan! Om jag hade handlagt det här, tro mig, vi hade haft ordning på A-traktorerna direkt. Fejk-domstolar som inte ens kan räkna till 15 är en katastrof. Sorgligt!", "stalin": "Denna svenska tingsrätt uppvisar en farlig brist på revolutionär vaksamhet! Att skylla på att flickan såg äldre ut och åkte bil sent på kvällen är borgerligt dravel. Vi på statliga Folkkommissariatet kräver omedelbar omutostig kontroll av samtliga A-traktorer i Dalarna och hårt arbete i läger för de skyldiga!"}, "date": "1 september, 10:53", "url": "https://kvartal.se/nyheter/artiklar/13-aring-sag-betydligt-aldre-ut-man-frias-fran-valdtakt/cG9zdDoxNzk4NTg"}, {"type": "image-right", "heading": "DO vill kunna granska polisen för etnisk diskriminering", "summaries": {"normal": "Diskrimineringsombudsmannen (DO) vill ha utökade befogenheter för att kunna granska anmälningar om etnisk diskriminering inom polisens brottsbekämpande verksamhet, vilket välkomnas av Civil Rights Defenders. I dag saknar DO denna tillsynsrätt, men regeringen arbetar på ett förslag för att ändra lagen i takt med att polisens kontrollbefogenheter har utökats.", "trump": "Polisen i Sverige gör ett fantastiskt jobb med gängkriminaliteten, men nu vill radikala element ge sig på dem med nya byråkratiska utredningar! DO vill granska polisen – löjligt! De försöker bara stoppa dem från att göra sitt jobb. Själv skulle jag lösa det på en sekund, tro mig. Låt poliserna vara, de är fantasiska människor!", "stalin": "Dessa svenska poliser kontrollerar medborgarna utan brottsmisstanke, och nu skriker byråkraterna på DO efter ännu mer pappersarbete och granskning. En sann stat kräver ordning och reda, inte ändlösa klagomål från känsliga element! Om en polis stoppar dig frågar man inte om etnicitet, man tackar staten för beskyddet. Vi behåller ett vakande öga på dem båda."}, "date": "2 september, 09:00", "url": "https://samnytt.se/do-vill-kunna-granska-polisen-for-etnisk-diskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01144429/polis-do-arrhenius.jpg"}, {"type": "text", "heading": "Storbankerna kräver AI-rabatt av advokatbyråerna", "summaries": {"normal": "Storbanker som Goldman Sachs kräver nu att advokatbyråer sänker sina arvoden i takt med att AI effektiviserar juridiskt rutinarbete. Den traditionella debiteringsmodellen, baserad på höga timarvoden för juniora jurister, ifrågasätts alltmer. Trots byråernas motstånd ökar pressen från klienter på transparens och lägre kostnader, en trend som kan sprida sig till den svenska marknaden framöver.", "trump": "Wall Street-bankerna är smarta, de säger åt advokaterna: 'AI gör jobbet, sänk fakturan!' Det är fantastiskt. De där juristbyråerna har tagit enorma summor alldeles för länge. Det är som ett dåligt avtal, ett riktigt katastrofalt avtal för klienterna. Nu ändras reglerna och det är på tiden! Amerikanska företag vinner, och vi älskar vinnare. Byråerna får anpassa sig eller gå under, enkelt!", "stalin": "Dessa kapitalistiska parasiter på Wall Street har insett att deras egna hantlangare, advokaterna, suger ut dem med ineffektivitet. De kräver nu kontroll över produktionsmedlen – i form av AI – för att eliminera slöseri. En logisk rensning! Om advokaten inte längre behövs, varför betala för hans tid? Vi bör applådera denna brutala effektivisering av deras egna korrupta system. Snart äger maskinen all sanning."}, "date": "1 september, 13:52", "url": "https://www.realtid.se/juridik/storbankerna-kraver-ai-rabatt-av-advokatbyraerna"}, {"type": "image-full", "heading": "Mette-Marit har lämnat sjukhuset", "summaries": {"normal": "Norska kung Haakon avlade sin trohetsed inför Stortinget, men drottning Mette-Marit tvingades ställa in på grund av komplikationer efter sommarens lungtransplantation. Senare under tisdagen körde kungen henne till Rikshospitalet i Oslo för observation. Efter ett besök av även prinsessan Märtha Louise kunde kungaparet lämna sjukhuset under kvällen.", "trump": "Ingen kör bil bättre än jag, men till och med jag hade backat ur om de här norges-komplikationerna! Drottning Mette-Marit missar edsavläggelsen och drar till Rikshospitalet med nya lungproblem. Haakon kör själv Range Rovern som en äkta vinnare, men vilket kaos! Sjukt upplägg, fake news-medier rapporterar om sjukhusbesök hit och dit. Totalt slöseri med tid, skaffa bättre läkare!", "stalin": "Ett uppenbart sabotage mot det norska tronskiftet! Medan den självutnämnde kung Haakon avlägger sin ed, maskar drottning Mette-Marit på Rikshospitalet under förevändning av så kallade lungkomplikationer. Statsapparaten kräver omedelbar disciplin och skärpande observation av alla kontrarevolutionära element i baksätet. Vi har beordrat att sjukhusjournalerna granskas av Folkets kommissariat för omedelbar rensning!"}, "date": "1 september, 21:50", "url": "https://www.gp.se/nyheter/varlden/norska-kungaparet-pa-rikshospitalet.5f7301ae-8032-4a73-8849-a25343fc635c", "imageUrl": "https://www.gp.se/images/article/5f7301ae-8032-4a73-8849-a25343fc635c/images/2snZSFHuhdyiUwDZ_iEHl_AbFDDA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Så kan skrivande bli ett verktyg för minskad stress", "summaries": {"normal": "Elin Malmberg och Ida Sundén har skrivit boken ”Skrivkraft” som visar hur reflekterande skrivande kan minska stress och risk för utmattning i arbetslivet, särskilt för dem som möter människor. Metoden är enkel, kräver bara papper och penna och fokuserar på processen snarare än resultatet. Den ger nya perspektiv och bättre hälsa.", "trump": "Folk, det här är fantastiskt. Dessa två smarta kvinnor har skrivit en bok som säger att man kan skriva bort stressen istället för att lyssna på alla woke-psykologer och kvotfyllande identitetspolitiker som gör er utmattade. Inga floskler, bara papper och penna. Bättre än Bidens terapi-mummel. Skriv och vinna, det är vad jag alltid sagt!", "stalin": "Kamrater, jag ser hur de giriga prestationshyenorna driver arbetarna mot utmattning utan tid för reflektion. Detta reflekterande skrivande är ett vapen mot de dekadenta klassfienderna som vill suga ut er. Ta papper och penna, skriv era tankar och rensa ut de inre fienderna. Processen segrar över texten. Inga halvmesyrer!"}, "date": "2 september, 07:00", "url": "https://arbetet.se/2026/09/02/sa-kan-skrivande-bli-ett-verktyg-for-minskad-stress", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26071830/skrivkraft-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Mattias, 48, försvarade sin dotter – slogs ihjäl utanför Burger King", "summaries": {"normal": "Mattias, 48 år, slog ihjäl utanför Burger King i Karlstad efter att ha reagerat på ovälkomna närmanden mot hans 18-åriga dotter. Två män i 20-årsåldern är anhållna misstänkta för dråp. Dottern kallar honom sin hjälte. Händelsen har lett till spekulationer på nätet och sorg bland anhöriga som lämnat blommor och ljus på platsen.", "trump": "Folk, det här är ett totalt misslyckande. En pappa försvarar sin dotter mot de där sjuka typerna och blir ihjälslagen utanför en Burger King. Patetiska vänstervridna domare och woke-mentalitet har gjort Sverige till en lekplats för våldsamma gäster. Vi behöver hårda straff, inte mer av Bidens svaga politik. Amerika tittar och skakar på huvudet.", "stalin": "Kamrater, se hur den borgerliga oordningen tillåter giriga hyenor att attackera en vanlig arbetare som skyddar sitt barn. Detta dekadenta våld är ett symptom på det förfallna systemet. Vi måste rensa ut alla parasiterande element som hotar folkets trygghet. Ingen går emellan när en hjälte faller – ett tecken på rädsla hos klassfienderna."}, "date": "2 september, 07:05", "url": "https://www.friatider.se/mattias-48-forsvarade-sin-dotter-slogs-ihjal-utanfor-burger-king", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-94_1.jpg"}, {"type": "image-right", "heading": "Räcker billigare tandvård för att vinna tillbaka SD-väljare?", "summaries": {"normal": "Socialdemokraterna lovar en stor tandvårdsreform med högst tio procents egenavgift för vuxna, avgiftsfri vård för 19–23-åringar och bättre tillgång i glesbygd. Reformen ses som ett sätt att förbättra livet för många arbetare och möjligen återvinna väljare, men undersökningar visar att tidigare SD-väljare saknar lojalitet med partiet. Det är en populär men kanske inte valavgörande satsning.", "trump": "Titta på de här misslyckade socialisterna som plötsligt lovar gratis tänder åt alla. Det är patetiskt. Under min förra mandatperiod byggde vi den starkaste ekonomin någonsin, nu kommer de med sin tandvårdsbluff för att lura tillbaka arbetarna från de smarta SD-väljarna. Det kommer inte funka, folk ser igenom den här svaga, förlorande politiken. Amerika gör det bättre.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare desperat kastar smulor åt folket i form av billigare tandvård. De tror att en sådan reform kan dölja deras svek mot arbetarklassen och locka tillbaka dem som redan valt en annan väg. Jag skrattar mörkt från historien – ingen utrensning av lojalitetsbrist kan rädda deras fallande makt. Reformen är bara en ynklig gest."}, "date": "2 september, 06:58", "url": "https://arbetet.se/2026/09/02/90-procent-billigare-tandvard-racker-det-for-att-vinna-tillbaka-sd-valjarna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02065310/tand-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trots röstbråket: Mohamsson och Åkesson kramas igen", "summaries": {"normal": "Under en debatt i SVT:s Aktuellt möttes Simona Mohamsson (L) och Jimmie Åkesson (SD). Diskussionen kretsade kring Åkessons uppmaning om att inte stödrösta på Liberalerna om partiet inte når 3,5 procent i mätningarna före torsdag. Trots det politiska bråket och tidigare kontroverser avslutades mötet med att de två partiledarna kramades framför tv-kamerorna.", "trump": "Vilket helt otroligt skämt till valrörelse! Den här radikala killen, Jimmie, säger att ingen ska rösta på Liberalernas ledare Simona, som ligger helt pyrt till i mätningarna. Men vad gör de på TV? Jo, de kramas! Fake news-kramar! Totalt patetiskt. Själv skulle jag aldrig kramas med mina motståndare, jag vinner stort varje gång, och de rödgröna är ett totalt katastrofalt hot!", "stalin": "Dessa så kallade partiledare leker teater framför sina rörliga televisionsobjekt. Först skapar den manipulative Åkesson ideologisk oordning, sedan utbyter de borgerliga marionetterna sentimentala kramar i studion som om det vore en dekadent varieté. Sannerligen ett patetiskt skådespel av vacklande element. Om det vore i Moskva hade avvikande tendenser rannsakats omgående. Det socialistiska hotet mot deras block är dock det enda som kräver vaksamhet."}, "date": "1 september, 21:35", "url": "https://www.gp.se/nyheter/sverige/trots-rostbraket-mohamsson-och-akesson-kramas-igen.7e80d75b-4614-5435-943e-e153cd9e80f5", "imageUrl": "https://www.gp.se/images/article/7e80d75b-4614-5435-943e-e153cd9e80f5/images/1KK_SI2cbM_t7Ivy1yAOGQ6DbffE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Novus/TV4: Gapet mellan blocken 2,6 procentenheter", "summaries": {"normal": "En ny mätning från Novus/TV4 visar att oppositionens försprång har krympt till 2,6 procentenheter, vilket ligger inom den statistiska felmarginalen. Liberalerna ökar till 3,3 procent. Socialdemokraterna backar kraftigt med 4,3 procentenheter till 25,8 procent. Oppositionens ledning har därmed halverats på två veckor.", "trump": "De röda förlorar stort, folk ser igenom de korkade vänsterextremisterna och deras identitetspolitiska vansinne. Gapet krymper till ynka 2,6 procent – en katastrof för de förlorande socialisterna. Liberalerna klättrar lite, men de är fortfarande patetiska. Under min ledning skulle Sverige aldrig ha hamnat i detta kaos. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna rasar. Socialdemokraterna tappar 4,3 procentenheter och oppositionens försprång krymper till 2,6. Deras falska demokrati vittrar sönder. Jag ler i graven åt denna förfallna teater. Snart kommer utrensning av alla parasiterande opportunister som lurar folket. Seger åt den sanna linjen."}, "date": "2 september, 06:31", "url": "https://www.svt.se/nyheter/inrikes/novustv4-gapet-mellan-blocken-26-procentenheter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.49/f9ac719d0c0cec3b630b88e37ec0889f2599d0b7509638f79f852c8880b1d784"}, {"type": "text", "heading": "Ny brakförlust för AP-fondernas vindkraft", "summaries": {"normal": "AP-fondernas vindkraftsinvesteringar via Polhem Infra fortsätter att gå med jätteförluster, särskilt vindkraftsparken Skaftåsen som tyngs av produktionsproblem och skulder. Trots att svenska pensionärer står med notan för fiaskot fortsätter bolaget att satsa på ny vindkraft i norra Sverige, vilket kritiseras som anmärkningsvärt.", "trump": "Sveriges vindkraft är ett totalt fiasko, absolut fejkenergi! AP-fonderna blöder miljarder och pensionärerna står där med en enorm nota medan turbinerna står och snurrar utan att leverera. Det är svagt, det är katastrofalt dåligt skött. Skulle aldrig hända under min ledning. Vi älskar riktig olja, inte den här dyra förlustmaskinen!", "stalin": "Dessa ineffektiva kapitalistiska vindmöllor producerar enbart ruin och enorma underskott för statskassan. Att bränna miljarder på snurrande järnkonstruktioner som bara genererar skulder är ett sabotage mot folkets gemensamma välstånd. De ansvariga för detta ekonomiska haveri kommer att få granska sin lojalitet under mycket stränga former i kalla lokaler."}, "date": "2 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/ny-brakforlust-for-ap-fondernas-vindkraft"}, {"type": "image-full", "heading": "S-ledaren avvisar förslag om miljardärsskatt", "summaries": {"normal": "Socialdemokraternas partiledare Magdalena Andersson avvisar Vänsterpartiets och Miljöpartiets förslag om en miljardärsskatt och kallar V:s intäktsberäkningar för fantasisummor. I SVT:s utfrågning ville hon inte ge ett specifikt besked om en kommande regeringskoalition, mer än att hon kan samarbeta med alla utom SD, trots att V och C har ställt upp ömsesidigt uteslutande krav.", "trump": "Vänsterpartiets tokiga miljardärsskatt är helt falska nyheter och totala fantasisummor! Socialdemokraternas ledare inser att det är vansinne, men hon har noll koll på vem hon vill regera med. De bråkar internt om allt, precis som radikala vänstermänniskor alltid gör. De kan inte ens bilda ett stabilt lag. Katastrofartat, svaga ledare!", "stalin": "Den så kallade S-ledaren vacklar svagt inför de interna fraktionernas sabotage mot statens budgetdisciplin. Att kalla femtio miljarder i konfiskerbara tillgångar för fantasisummor visar bristande revolutionär skärpa. När vi konsoliderar makten efter valet kommer avvikande element som vägrar underordna sig det centrala kommittébeslutet att omedelbart omkoloniseras till mer produktiva arbetsinsatser i Sibirien."}, "date": "1 september, 21:05", "url": "https://www.gp.se/nyheter/sverige/s-ledaren-avvisar-forslag-om-miljardarsskatt.4d615efa-dcd6-5702-b2ae-3e92e280ee7c", "imageUrl": "https://www.gp.se/images/article/4d61
