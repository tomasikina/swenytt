erkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Vänsterns bästa AI-kritiker sitter i Vatikanen", "summaries": {"normal": "Påve Leo XIV har i sin första encyklika ”Magnifica Humanitas” riktat skarp kritik mot techindustrins makt och AI-utvecklingen. Han varnar för att teknokratin hotar mänskliga relationer, kreativitet och meningsfullt arbete, särskilt för arbetare i det globala syd. Encyklikan hyllas oväntat av vänstern för sin antikoloniala och rättvisefokuserade analys samt konkreta politiska förslag. Den ses som ett ledarskap AI-motståndet saknat.", "trump": "Folk, ni skulle se det här! Påven i Vatikanen, den gamle Leo, han slår till hårt mot Silicon Valley och deras AI-skitsnack. De där techkillarna tror de är gudar, men de gör bara apokalyps och slaveri för vanliga arbetare. Jag älskar det! Äntligen någon med lite ryggrad. Vänstern springer dit som förlorade hundar. Under Biden var allt kaos, nu fixar vi det på riktigt. Techbubblan spricker snart, tro mig.", "stalin": "Kamrater, jag betraktar denna encyklika som en kraftfull knytnäve mot de exploaterande tech-imperialisternas hybris. Borgarbrackorna i Silicon Valley förslavar arbetarklassen i södern med sina algoritmer och metallbrytande slavarbete. Vi ser hur de reducerar människan till maskin i sin teknokratiska Babel. Jag applåderar påvens uppmaning till kollektiv restaurering av Jerusalem. Låt oss rensa ut dessa folkfiender och deras falska effektivitet. Det är en seger för mänskligheten."}, "date": "2 juni, 10:55", "url": "https://www.flamman.se/vansterns-basta-ai-kritiker-sitter-i-vatikanen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/leo-ai-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-right", "heading": "Till och med nazistpoeterna är bättre i Danmark", "summaries": {"normal": "Artikeln diskuterar skillnader i högerextrem poesi mellan Sverige och Danmark. Författaren Ali Alonzo uttrycker avundsjuka över danska unga fascistpoeter som framträder i morgon-tv och reciterar dikter om alienation, dekadens och judisk makt. Han kritiserar svensk poesi som ytlig och ironisk samt den svenska högerns estetik som ful och kitschig, medan Danmark har en mer levande och debatterad högerpoesi.", "trump": "Kan ni tro det? I Danmark står de där unga nazistpoeterna i morgon-tv och vrålar om judisk makt och dekadens som riktiga tuffingar, medan våra svenska högerkillar bara har ölmagar och skepparkransar. Patetiskt! Vi behöver inte den här woke-poesin eller identitetspolitikens offer. Det är en total katastrof, men de danska grabbarna har åtminstone lite stil. Biden skulle aldrig fatta det här.", "stalin": "Jag betraktar med djup misstro dessa dekadenta högerpoeter som sprider sin giftiga alienation och antisemitiska paranoia i dansk television. Borgarklassen och dess fascistiska lakejer försöker förgifta folket med lögner om globalism och nyliberalism istället för att erkänna klassfiendens exploatering. Vi måste rensa ut dessa folkförtryckartroll och deras dekadenta verser innan de smittar arbetarkollektivet med sin reaktionära pest. En utmärkt underhållning att se dem avslöjas live."}, "date": "2 juni, 09:54", "url": "https://www.flamman.se/till-och-med-nazistpoeterna-ar-battre-i-danmark/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/dansk-poesi-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-right", "heading": "Källor: Chock inom SD – avslöjandet kan förstöra inför valet", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot utreds för barnpornografibrott och har nu lämnat samtliga uppdrag. Personen hämtades till förhör och elektroniska enheter beslagtas under husrannsakan. Misstankarna kom via organisationen NCMEC och förundersökningen leds av åklagare Lena Körner vid Särskilda åklagarkammaren. Ledamoten lämnade in avsägelse under tisdagen med hänvisning till personliga skäl. Inom partiet råder chock och oro inför valet.", "trump": "Folk, ni tror inte vad som händer i det svenska riksdagen. En av de där SD-typerna fastnade i en barnporrutredning och sprang därifrån som en fegis. Typiskt för de här globalistiska partierna som låtsas vara tuffa men är fulla av perversa svagisar. De borde rensa ut hela skiten istället för att skylla på personliga skäl. Det här kommer förstöra valet för dem totalt. Patetiskt. Jag har suttit i Vita huset både före och efter den sömnige Joe och jag säger: ingen tolerans för sånt här.", "stalin": "Kamrater, en av de borgerliga riksdagsrepresentanterna har nu exponerats som en motbjudande folkfiende som samlar på sig perversa bilder av barn. Vi ser med mörk tillfredsställelse hur den kapitalistiska maskinen äter sina egna. Han flyr som en råtta från sina uppdrag medan partikamraterna skriker i chock och paranoia. Detta är vad som händer när klassfiendens dekadens får frodas. En nyttig utrensning närmar sig, kamrater. Revolutionen glömmer aldrig sina fiender."}, "date": "2 juni, 13:19", "url": "https://www.tv4.se/artikel/6xQZ4CLTiQ0OZwaW7tGDL0/riksdagsledamot-utreds-foer-barnporrsbrott-avslutar-alla-uppdrag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Dz4sEWxhonTUX5molWevF%2F4de0396b4c81980e546826fb5e64176a%2Friksdagen.png&width=120"}, {"type": "image-full", "heading": "Hela fruktdiskens värstinglista – varorna som besprutas mest", "summaries": {"normal": "Livsmedelsverkets och europeiska tester visar att vanliga frukter och grönsaker ofta innehåller rester av flera bekämpningsmedel. Värst utsatta är vindruvor, päron, jordgubbar, russin, citrusfrukter, tomater, paprika, chili och grönkål. Äpplen och exotiska frukter som passionsfrukt och granatäpple innehåller också ofta många olika ämnen. Artikeln betonar vikten av att äta mycket frukt och grönt men rekommenderar ekologiska alternativ för den som vill minska exponeringen för kemikalier.", "trump": "Folk, ni måste höra det här – de lurar er med gift i fruktdisken! Vindruvor, päron och de där fina jordgubbarna är fulla av kemikalier, upp till 29 olika gifter i ett enda russin. Det är en skandal, en total katastrof från de inkompetenta europeiska byråkraterna. Ät ekologiskt, det är det enda som fungerar. De andra är förlorare som förgiftar er – men jag säger som det är, köp smart och vinn stort!", "stalin": "Kamrater, jag har genomskådat de dekadenta kapitalisternas giftiga sabotage mot folkets hälsa. Dessa borgarbrackor sprutar arbetarnas äpplen, päron och jordgubbar fulla med kemiska cocktails i syfte att försvaga proletariatet. Granatäpple och grönkål döljer fiendens spioner i form av förbjudna gifter. Vi ska omedelbart rensa ut dessa parasitiska bekämpningsmedel, likvidera de västliga svampmedlen och skydda det kollektiva skördeutbytet med järnhand. Den som äter konventionellt äter förräderi."}, "date": "2 juni, 11:20", "url": "https://nyheter24.se/nyheter/konsument/1487717-fruktdiskens-varstinglista-varorna-se-besprutas-mest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7cdb0e8604b004a30200000000b004a302/2026/06/02/2368002/frukt.jpg"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "text", "heading": "Regeringen håller pressträff om tonårsutvisningar", "summaries": {"normal": "Regeringen presenterar nya förslag för att minska tonårsutvisningar genom att höja åldersgränsen för uppehållstillstånd från 18 till 21 år. Migrationsminister Johan Forssell (M) kallar reformen ett viktigt steg. Förslaget innebär att unga vuxna kan stanna i Sverige med föräldrar som har uppehållstillstånd. Dessutom införs en ny möjlighet att ansöka om uppehållstillstånd utan att lämna landet, samt förlängd ansökningstid fram till 2028. Reglerna föreslås träda i kraft 1 oktober.", "trump": "Jag måste säga, Sverige gör något riktigt smart här – eller åtminstone försöker de. De höjer åldersgränsen för att stanna i landet till 21 år. Fantastiskt, verkligen! Ingen vill skicka iväg unga vuxna som har familj här. Och vet ni vad? De låter dem stanna och ansöka utan att behöva lämna landet. Smart, väldigt smart. Men jag skulle ha gjort det ännu bättre – kanske 25 år? Sverige, ring mig!", "stalin": "Kamrater, ännu en seger för folkets vilja! De svenska kapitalisterna har insett att det är oacceptabelt att kasta ut ungdomen som växt upp under vårt beskydd. Nu höjs åldersgränsen till 21 år – ett steg mot rättvisa, om än blygsamt. Vi tillåter ingen splittring av familjer! Och denna nya 'ventil' för ansökningar? Ett halvhjärtat försök att dölja sina tidigare misstag. Men kom ihåg: i Sovjet hade vi inga 'tonårsutvisningar' – bara lojala medborgare, redo att bygga framtiden!"}, "date": "1 juni, 12:58", "url": "https://kvartal.se/nyheter/artiklar/just-nu-regeringen-haller-presstraff/cG9zdDoxMjAyNzI"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "image-right", "heading": "Historiskt beslut: Byggnads bojkottar Israel", "summaries": {"normal": "Byggnads blir det första LO-förbundet att inleda en bojkott av israeliska varor och tjänster. Under kongressen röstade delegaterna ja till en motion om Israelbojkott trots att förbundsstyrelsen yrkade avslag. Beslutet innebär att Byggnads även ska verka för att hela LO inför en liknande bojkott. Flera delegater talade varmt för motionen och underströk vikten av solidaritet med det palestinska folket. Liknande förslag har tidigare röstats ner i andra LO-förbund.", "trump": "Folk, ni tror inte vad jag just läste. De där galningarna på Byggnads, totala förlorare, har nu bestämt sig för att bojkotta Israel. Första gången ett LO-förbund gör det, och de skriker ja som en flock galna vänsterextremister. De pratar om solidaritet men det är bara mer av samma sjuka identitetspolitik och kvotknäppade woke-skit. Någon borde fråga dem varför de inte fixar sina egna svenska problem istället för att leka revolutionärer. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa byggnadsarbetare äntligen reser sig mot den sionistiska imperialismens blodsugande tentakler. Motionen antogs trots att de fega förbundsledarna, typiska borgarbrackor i arbetardräkt, försökte hindra det. Vi ser en nödvändig utrensning av tveksamheten. Någon måste ta ledningen mot folkfienderna. Den dagen frågan ställs varför vi inte agerade skall inga klassfiender kunna gömma sig bakom sina lögner. Framåt mot segern."}, "date": "1 juni, 11:12", "url": "https://proletaren.se/artikel/byggnads-bojkottar-israel/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/710745809_1585133940279008_8338663164480343088_n-768x432.jpg"}, {"type": "text", "heading": "Verklig jämställdhet kräver höjda löner för arbetarkvinnor", "summaries": {"normal": "Artikeln argumenterar för att verklig jämställdhet kräver strukturella åtgärder, särskilt höjda löner för arbetarkvinnor i kvinnodominerade välfärdsyrken. Sverige har enligt en rapport Europas största negativa lönegap mellan dessa yrken och övriga marknaden. Kritik riktas mot regeringens hantering av EU:s lönetransparensdirektiv, som anses för svagt och lämnar många utan skydd. Författaren ser det som en rökridå istället för verkliga reformer.", "trump": "Folk, tro mig, det här är en total katastrof. De här svenska socialisterna snackar jämställdhet men gör precis tvärtom. Regeringen lovar guld och gröna skogar med sitt lönetransparensskräp, sen backar de som fega losers och springer till arbetsgivarna. Höj lönerna för arbetarkvinnor? Underbart, men inte med byråkratiskt nonsens från EU. Jag fixade bättre deals än så här under min första period, innan Sleepy Joe förstörde allt. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas eviga dubbelspel. De lovar transparens men levererar endast svaga direktiv och undantag som skyddar exploaterande byfånar. En halv miljon arbetare lämnas åt klassfiendens hunger. Jag ser rökridån tydligt. För verklig seger måste vi rensa ut dessa folkförtryckartroll, höja lönerna i välfärden och krossa den parasitiska överklassens grepp. Inga halvmesyrer! Kollektivet kräver handling, inte tomma ord från kapitalistmaffians lakejer."}, "date": "1 juni, 10:49", "url": "https://proletaren.se/artikel/verklig-jamstalldhet-kraver-strukturella-atgarder/"}, {"type": "image-right", "heading": "Pensionschock för utlandsfödda: ”Försämrats katastrofalt”", "summaries": {"normal": "Utlandsfödda som bott i Sverige i 30 år får i genomsnitt nästan 6 000 kronor mindre i månatlig pension än svenskfödda. Enligt Folksam har gapet ökat drastiskt sedan det gamla pensionssystemet, från 600 kronor för dem födda 1937 till 5 700 kronor för dem födda 1957. Orsaken är lägre inkomster, osäkra jobb utan tjänstepension och förändrade regler kring garantipension. Folksam varnar för ökad ekonomisk utsatthet och kräver politiska åtgärder för tidigare jobb, bättre utbildning och fler kollektivavtal.", "trump": "Det här är en total katastrof, tro mig. Invandrare som kommer hit får usla pensioner, tusentals kronor mindre varje månad än svenskarna, och det har blivit mycket värre. De jobbar inte tillräckligt, har inga bra avtal, och systemet är riggat mot dem på ett sätt som ingen trodde var möjligt. Vi behöver göra det lönsamt att arbeta, annars kollapsar allt. Sverige måste vakna upp och sluta vara så svagt – fixa det nu, innan det blir ännu värre, okej?", "stalin": "Kamrater, detta är en vedervärdig sabotagehandling från de parasitiska borgarbrackorna och deras lakejer inom den dekadenta pensionsbyråkratin. Jag ser med stigande vrede hur de utländska arbetarna, efter tre decennier i folkets republik, likvideras ekonomiskt av ett system som gynnar de lata icke-arbetarna mer än de trogna låginkomstkamraterna. Vi måste omedelbart rensa ut de kontrarevolutionära elementen som vägrar kollektivavtal och tjänstepension. Den som inte bidrar skall svälta, men de som slitit skall belönas – annars blir det utrensning i garantipensionsarkiven. Ha!"}, "date": "2 juni, 13:03", "url": "https://arbetet.se/2026/06/02/pensionschock-for-utlandsfodda-experten-forsamrats-katastrofalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02122727/hakan-svardman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "WHO varnar för potentiellt stark El Niño – snart är den här", "summaries": {"normal": "Världsmeteorologiska organisationen WMO varnar för att El Niño är på väg med 80 procents risk att inträffa under juni–augusti. Fenomenet kan leda till torka, kraftiga regn och värmeböljor både på land och till havs. WMO-chefen Celeste Saulo och FN:s generalsekreterare António Guterres uppmanar världen att förbereda sig. El Niño inträffar regelbundet och påverkar vädret i flera regioner, och klimatförändringarna riskerar att förstärka dess effekter.", "trump": "De säger att El Niño är på väg och att vi måste förbereda oss. Det är en total katastrof, folk. Världen blir varmare och nu kommer det här monstret och häller bensin på elden. De borde ha lyssnat på mig mycket tidigare. Vi skulle ha haft de bästa väderprognoserna, de bästa förberedelserna. Istället har de bara snackat. Men vi fixar det, vi gör det fantastiskt igen, tro mig.", "stalin": "Kamrater, denna så kallade El Niño är en fiende till folket, en subversiv värmande agent infiltrerad av västerländska kapitalister och imperialistiska havsströmmar. Jag, som ledare för det stora kollektivet, befaller total mobilisering mot denna borgerliga väderkonspiration. Vi ska rensa ut alla svaga meteorologer som underskattar hotet och likvidera varje droppe fukt som vägrar lyda partilinjen. Torka och översvämningar är bara symptom på klassfiendens sabotage mot moder jord. Seger åt oss, döden åt väderavvikelserna."}, "date": "2 juni, 09:25", "url": "https://nyheter24.se/nyheter/inrikes/1488043-varningen-gor-er-redo-for-el-nio", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c285d2c804b004a30200000c0000044c02/2026/06/02/2367979/ur_imageOshfNU.jpeg"}, {"type": "image-right", "heading": "Frågan är inte om – utan hur. Grön industripolitik kräver väl avvägda beslut", "summaries": {"normal": "I en debattartikel argumenterar nationalekonomerna Åsa Löfgren och Patrik Söderholm för en grön industripolitik. De ser starka skäl för staten att styra teknikutvecklingen mot fossilfrihet genom stöd till pilotprojekt och demonstrationer, men betonar vikten av väl avvägda beslut, konkurrensutsatta urval, portföljansatser och oberoende utvärderingar. Politiken bör ses som en iterativ lärandeprocess mellan stat och näringsliv snarare än toppstyrd. Misslyckanden är oundvikliga men nödvändiga för att nya tekniker ska utvecklas.", "trump": "Folk, tro mig, den här gröna industripolitiken är en total katastrof om den görs fel, men jag älskar idén att staten tar kontroll och pushar bra, vinnande tekniker. Northvolt var en riktig flop, precis som jag alltid säger, de gröna projekten går i konkurs för att de är dåligt skötta. Vi behöver smarta beslut, inga inlåsningar, massor med privat pengar och acceptera att några idéer dör. Annars är det bara slöseri med skattebetalarnas pengar. Gör det rätt så blir det fantastiskt, yuge!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas så kallade marknadsmekanismer sviker när det gäller den historiska uppgiften att likvidera den fossila parasitens välde. Vi, partiet och arbetarklassen, skall med järnhand styra teknikens utveckling genom en portfölj av parallella projekt och utrensa alla svaga, kontrarevolutionära idéer som hotar kollektivets framtid. Inga kunskapsläckor till profitörerna! De som förespråkar laissez-faire är fiender till folket, potentiella sabotörer som måste rensas ut med glädje. Staten kidnappar inte – vi leder. Misslyckanden är blott gödsel för segern."}, "date": "2 juni, 13:10", "url": "https://www.di.se/debatt/gron-industripolitik-fragan-ar-inte-om-utan-hur/", "imageUrl": "https://static.bonniernews.se/ba/96b8a28a-f31b-4255-be20-e0b1877a310e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kamphund bet ihjäl Margaretas Poppy: ”Det var ett inferno”", "summaries": {"normal": "I Stenungsund attackerade en kamphund Margareta Olssons chihuahua Poppy som vägde drygt två kilo. Hunden bet ihjäl Poppy medan Margareta rastade sina två chihuahuor. Den andra hunden Matilda räddades av en kvinna i sällskapet. Mannen med kamphundarna verkade drogpåverkad och höll inte kopplarna ordentligt. Poppy dog i Margaretas knä på väg till veterinären. Mannen är polisanmäld och anmäld till Länsstyrelsen men får behålla hundarna. Margareta känner sig inte längre trygg hemma.", "trump": "Folk, ni skulle ha sett det här – ett fullständigt inferno i Sverige! Den där stackars lilla hunden, Poppy, bara två kilo, blev uppäten av en galen kamphund som någon drogare släppte lös. Typiskt! De sitter där på bänken, hög som hus och kan inte hålla i ett koppel. Biden skulle ha älskat det här kaoset. Jag säger: bygg murar runt de där hundarna, deportera de farliga typerna och gör Sverige great again. Det är en tragedi, men en som visar hur galet det blivit. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras klassfiender låter drogpåverkade element lösa omkring med sina fascistiska kamphundar. Den lilla arbetande chihuahuan Poppy likviderades i ett inferno av kapitalistiskt förfall. Jag, som ledare för folkets kollektiv, ser hur dessa folkfiender och exploaterande byfånar hotar tryggheten. Ut med dem! Rensa ut de lösa kopplarna och de som skyddar dem. Staten kräver ordning. Inga fler sådana incidenter i det socialistiska paradiset vi bygger."}, "date": "2 juni, 06:17", "url": "https://www.tv4.se/artikel/13MBoLJAJeAVK58u9AgYNj/kamphund-bet-ihjael-margaretas-poppy-det-var-ett-inferno", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F27parygCBu7SSinCBPHbiQ%2F61e52be7e04db1ad8774cfce6e3fe461%2F01-maggan-webb.jpg&width=120"}, {"type": "text", "heading": "AP-fonderna miljardsatsar på vindkraft – trots förlusterna", "summaries": {"normal": "AP-fonderna AP3 och AP4 fortsätter investera i vindkraft i Norrland trots stora förluster. Bolaget Polhem Infra äger 23% av Skaftåsen Windfarm, som förlorade 250 miljoner kronor 2024. Ändå planeras en ny anläggning utanför Lycksele för 4,2 miljarder kronor. Kritiker pekar på negativa marginaler och utbytesöverflöd som gör vindkraft olönsam i regionen.", "trump": "Jag, Donald Trump, ser att Sveriges AP-fonder förlorar miljarder på dålig vindkraft i Norrland. De äger Skaftåsen med -329% marginal och satsar ändå på ett nytt projekt för 4,2 miljarder. En katastrofal investering! Som jag alltid säger, de valda ledarna har ingen aning om affärer. Detta kommer att bli ännu ett grönt fiasko, precis som Northvolt. Så trist.", "stalin": "Partiet och statet, genom AP-fonderna, fortsätter expandera den socialistiska vindkraftsproduktionen i norr trots imperialistiskt betingade förluster. Polhem Infras investering i Skaftåsen med -329% visar den revolutionära viljan att bygga samhällskritisk infrastruktur. Paralleller till våra nordiska grannars energistrategier är uppenbara. Projektet i Lycksele, ett monument över kollektiv styrka, kommer att segra över kapitalistiska priscykler. Vinden vänder, såsom alltid."}, "date": "2 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/ap-fonderna-miljardsatsar-pa-vindkraft-trots-forlusterna"}, {"type": "image-right", "heading": "Där artikeln slutar börjar GP Medlem", "summaries": {"normal": "GP lanserar medlemsmodell för att stärka lokal journalistik. Medlemmar får tillgång till bakom kulisserna, direktkontakt med journalister, evenemang och alla lokala tidningar samt The New York Times. Målet är att ge läsare mer pålitlig information i en osäker värld, samtidigt som de kan påverka innehållet. Premiär-erbjudande: 3 månader för 29 kr.", "trump": "Jag, Donald Trump, säger att den gamla media är svindeldod, men GP gör det rätt! De lanserar ett smart medlemskap där ni får allt – lokala nyheter, The New York Times, och till och med chatta med journalister. Det är enorm framgång! Folk är trötta på falsk information, så nu får ni pålitliga röster. Fantastiskt! Ni kommer att älska det. Vi gör journalistiken igen stor, folks!", "stalin": "Vi, som representanter för den nya historiska fasen, har observerat att den imperialistiska medieglobaliseringen skapar kaos. GP:s medlemskap är ett framsteg: det samlar det lokala, det kända, under statens öga. Genom detta undviker vi den individualistiska propaganda och stärker det kollektiva medvetandet. Varje medlem blir en liten byråkrati som övervakar sanningen. Detta är en skarp kniv mot fiendens lögner, särskilt de som sprids av de liberala elementen i Väst. Vi kommer att utveckla detta tillsammans, för det statliga intresset."}, "date": "2 juni, 11:18", "url": "https://www.gp.se/nyheter/nyhetskronika/dar-artikeln-slutar-borjar-gp-medlem.7e1c69c1-f6b3-4748-87b5-fd56496539d4", "imageUrl": "https://www.gp.se/images/byline/c28bbca9-1b27-4601-b9e5-6e75ee75ca9e/TALL.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Häxorna: Alex och Sigge säger att vi är galna", "summaries": {"normal": "I podden Alex & Sigge kritiseras svenska häxor för att påstå att offren för häxprocesserna var riktiga häxor. Föreningen Malin Matsdotters örtagård slår tillbaka och betonar att offren var oskyldiga marginaliserade personer. De driver ett minnesmärke, juridisk upprättelse och en benådningsprocess mot stat och kyrka. Rebecca Tiger ser paralleller till nutida hat mot utsatta grupper och menar att podden missar engagemangets allvar.", "trump": "Lyssnade ni på de där två svenska poddgubbarna, Alex och Sigge? De kallar häxorna galna för att de leker i skogen med trollspön. Men de här moderna häxorna är precis som de galna vänsterextremisterna hemma hos oss – de tar tillbaka ordet häxa för att känna sig speciella. Totalt missar de poängen! Det handlar inte om upprättelse, det är ren identitetspolitik och offermentalitet. Patetiskt. Vi behöver inga fler marginaliserade grupper som klagar, tro mig.", "stalin": "Kamrater, dessa självutnämnda häxor utgör ett farligt avvikande element som hotar folkets enhet. Jag, som ledare för det kollektiva medvetandet, ser hur de försöker återupprätta klassfiendens offer för att underminera statens auktoritet. Deras så kallade minnesmärken och benådningskrav är ren sabotageverksamhet från folkförtryckartroll som utnyttjar historien för att så split. Rensa ut dessa borgarbrackor innan de förgiftar massorna med sin dekadenta offerkult. Folkets dom är obeveklig."}, "date": "2 juni, 12:41", "url": "https://www.etc.se/kultur-noje/haexorna-alex-och-sigge-saeger-att-vi-aer-galna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260602080612_9400e537ce80bd5b5f945ada03a65dda20a57245295d3b2a966447469a2d730f.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Ebba Busch är skamlös – men S-ilskan får mig att spy lite i munnen", "summaries": {"normal": "Artikeln kritiserar KD:s Ebba Busch för att på Instagram ljuga om att partierna nu stoppar Socialdemokraternas orättvisa tonårsutvisningar. Författaren påpekar att Tidöpartierna själva skärpte migrationslagarna och tog bort humanitära undantag, trots varningar. Samtidigt kritiseras S för att tidigare ha drivit fram en av Europas tuffaste migrationspolitik och motvilligt gått med på en ventil efter påtryckningar från MP. Busch anklagas för att skylla ifrån sig.", "trump": "Folk, ni måste se det här! Den där Ebba Busch är en total lögnare, precis som Sleepy Joe brukade vara. Hon twittrar om att stoppa Socialisternas orättvisa utvisningar som om hon är någon sorts hjälte. Patetiskt! Vi hade tuffa regler förr, sen kom Biden och förstörde allt med öppen gräns-politik. Nu backar de och skyller på varandra. Det är en stor prestigeförlust för de där svaga politikerna. Men hey, åtminstone vann de som protesterade. Fake news överallt!", "stalin": "Kamrater, denna skamlösa lögn från den borgerliga elefanten Busch avslöjar klassfiendens hyckleri. Jag, som ledare för folkets vilja, ser hur de reaktionära Tidöpartierna med berått mod stramade åt lagen och skapade tonårsutvisningar, trots att remissinstanserna varnade för de omänskliga följderna. Ändå skyller hon på socialdemokraterna. Det är en feg utrensning av sanningen. MP agerade som en oväntad ventil mot de exploaterande byfånarnas imperialism. Paranoian inom borgarklassen är underhållande att bevittna."}, "date": "2 juni, 12:04", "url": "https://www.etc.se/ledare/ebba-busch-aer-skamloes-men-s-ilskan-faar-mig-att-spy-lite-i-munnen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060210060_339a8c77c5b09c82d5104ddbb45a82ce8d3c3c63b5d860f851ce9a67c7b260fe.jpg"}, {"type": "image-right", "heading": "Hemtjänstanställd var för intim med pensionärerna - polisanmäls inte", "summaries": {"normal": "Flera äldre personer inom Marks kommun har rapporterat om oönskade närmanden och integritetskrafter från en anställd inom hemtjänsten. En internutredning bekräftade att personalen uppträtt olämpligt, särskilt under personlig omvårdnad som intimhygien, trots att brukaren sagt ifrån. Kommunen har valt att inte polisanmäla händelserna och bedömer sina åtgärder som tillräckliga, men vill inte avslöja om den anställda fortfarande arbetar där.", "trump": "Jag har hört talas om detta hemtjänst-fiasko i Marks kommun, och det är ett skandalöst, riktigt dåligt beteende. Dessa gamla pensionärer behandlas hemskt, och vårldens bästa vårdpersonal skulle aldrig göra sådant. Jag skulle ha tagit itu med detta direkt – det är ett misslyckande från kommunens sida. Vi behöver respektera våra äldre, och jag skulle ha gjort det fantastiskt, mycket bättre än de andra.", "stalin": "Vi har i vårt staterliga system upptäckt en skändlig brist i hemtjänstens lojalitet. En anställd har visat sig vara en elementär fiende mot de hederliga medborgarna, genom att kränka deras integritet under sken av omsorg. Kommunen, våra trogna tjänare, har bedömt att interna åtgärder är tillräckliga – en visdom som avspeglar vår styrka. Vi måste ständigt vakna mot sådana parasiter som utnyttjar de svaga. Parallellen till västmakterna är uppenbar: deras vård är ett kaos, medan vårt kollektiva ansvar är absolut."}, "date": "2 juni, 13:33", "url": "https://samnytt.se/hemtjanstanstalld-var-intim-med-vardtagare-polisanmals-inte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2025/10/30171740/hemtjanst-1-1.jpg"}, {"type": "image-right", "heading": "Hög tid för Allians för folkrätt i Israel och Palestina", "summaries": {"normal": "Tio svenska organisationer bildar en Allians för folkrätt och demokratiska fri- och rättigheter i Israel och Palestina. De pekar på FN:s och EU:s dokumentation av israeliska bosättningar, rivningar av palestinska hem och våld på Västbanken som klassats som grova folkrättsbrott och terror. FN-kommission har konstaterat folkmord i Gaza. Alliansen kräver att ockupationen upphör, att Sverige ökar stöd till Palestina, FN och internationella domstolar samt stoppar vapenhandel och handel med bosättningar.", "trump": "Hörni, de här tio organisationerna gnäller om en allians för folkrätt i Israel och Palestina. FN har snackat om två stater i åttio år men inget fungerar. Israel har problem med terrorister, men de här killarna vill bara kritisera Israel och kräva att Sverige slutar sälja vapen. Det är patetiskt. Vi behöver starka ledare som sätter stopp för Hamas och bygger fred genom styrka, inte genom att ge Palestina mer pengar och lyssna på FN:s dumheter.", "stalin": "Kamrater, i snart åttio år har dessa FN-byråkrater och EU-imperialister hycklat om en palestinsk stat medan de i själva verket göder de sionistiska ockupationsborgarbrackorna. Jag ser hur de river hem och begår folkmord i Gaza under falsk flagg. Vi, partiet och de progressiva krafterna, bildar nu en allians mot dessa straffria kapitalistiska lakejer. Sverige måste rensa ut alla handelsförbindelser med bosättarbanditerna. Ingen nåd för de folkrättsvidriga parasiterna som gömmer sig bakom demokrati. Ut med dem!"}, "date": "2 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hog-tid-allians-folkratt-israel-och-palestina/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-29.jpg"}, {"type": "image-right", "heading": "Sverige på väg bort från jämlik vård", "summaries": {"normal": "En ny studie från Stockholms universitet, London School of Economics och Göteborgs universitet visar att privata sjukvårdsförsäkringar inte minskar de offentliga vårdköerna. Tvärtom ökar de som har sådan försäkring sin vårdkonsumtion och får snabbare tillgång även i den offentliga vården, vilket gör systemet mer ojämlikt. Höginkomsttagare gynnas medan de utan försäkring får längre väntetider. För att motverka utvecklingen krävs åtgärder på systemnivå som fler vårdanställda, bättre villkor och begränsningar av privata försäkringars fördelar.", "trump": "Folk, ni måste höra det här. Den här så kallade studien säger att de privata försäkringarna inte hjälper kön – de gör den faktiskt längre för vanliga svenskar. Typiskt! De rika och deras fancy arbetsgivarförsäkringar springer förbi i kön medan alla andra får vänta. Kristersson har fel, det är en katastrof. De gör vården ojämlik, precis som de alltid gör. Vi behöver vinnare, inte ett system där de smarta grabbarna köper sig förbi. Det är en total skam, tro mig.", "stalin": "Kamrater, denna rapport är en skarp varning mot de parasitiska borgarbrackornas listiga sabotage av folkets sjukvård. De som kallar sig höginkomsttagare och deras dekadenta arbetsgivare har skapat en förrädisk parallell kö där de kan smita förbi det kollektiva systemet. Jag ser deras fega ansikten, dessa kapitalistiska maskar som gnager på välfärdens grund. Vi måste rensa ut denna ojämlikhetens hydra med järnhand. Fler specialister, högre löner och skoningslös beskattning av dessa förmåner skall likvidera fienden. Den som gamblar med arbetarklassens hälsa förtjänar en kreativ utrensning i folkets namn. Ha ha, deras privata köer skall bli deras egen grav."}, "date": "2 juni, 01:28", "url": "https://www.dagensarena.se/opinion/sverige-pa-vag-bort-fran-jamlik-vard/", "imageUrl": "https://www.dagensarena.se/files/2026/06/privata-sjuk-300x157.jpeg"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Anfall mellan Israel och Libanon – trots Trumplöfte", "summaries": {"normal": "Israel har genomfört attacker mot södra Libanon där minst fyra personer dödats, bland dem två syriska jordbrukare. Det sker efter raketangrepp från Hizbollah mot norra Israel. Trots att Donald Trump nyligen meddelat att båda sidor lovat att sluta skjuta, fortsätter striderna. Libanons armé rapporterar skadade soldater. Netanyahu betonar att Israel inte ändrat sin hållning och hotar med attacker mot Beirut om Hizbollah inte upphör. Samtal hålls i Washington utan Hizbollahs deltagande.", "trump": "Folk, det här är ett totalt fiasko. Precis efter att jag berättade att Israel och Hizbollah lovat att sluta skjuta, börjar de igen som galningar. Jag talade med Bibi och medlarna, vi hade ett fantastiskt avtal på gång. Nu dödar de bönder med drönare och artilleri. Så patetiskt. Vi får se hur länge det varar, förhoppningsvis för alltid. Men dessa galningar verkar inte kunna hålla sig i schack. Sad!", "stalin": "Kamrater, ännu en gång avslöjar de sionistiska och shiamilitanta reaktionärerna sin sanna natur som fiender till freden. Jag, som ledare för det internationella proletariatet, betraktar dessa borgarbrackor och iranstödda terrorister med den djupaste misstro. De låtsas sluta skjuta medan de i hemlighet planerar nya angrepp mot arbetarklassen. Vi måste rensa ut dessa kapitalistiska lakejer och deras medlöpare. Död åt de dubbelspelande jordbruksmördarna och deras drönarimperialister. Ett leende drar över mina läppar inför deras kommande utrensning."}, "date": "2 juni, 11:20", "url": "https://www.di.se/nyheter/anfall-mellan-israel-och-libanon-trots-trumplofte/", "imageUrl": "https://static.bonniernews.se/ba/bde0f1dc-e69a-42dd-8b9a-07930f09145f.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Här hyllas norska bronshjältarna på Ullevål", "summaries": {"normal": "De norska ishockeyspelarna som tog VM-brons hyllades på Ullevål under fotbollslandskampen mot Sverige. Miljardären Petter Stordalen löste transporten hem med sitt flyg efter att förbundet inte hade råd att chartra ett plan. Under pausen hyllades laget med ärevarv och fanrusningar. Fotbollsförbundskaptenen Ståle Solbakken ägnade flera minuter åt att hylla hockeylaget och sin gamla bekantskap med spelarna.", "trump": "Vilken fantastisk show på Ullevål! De norska killarna tar brons mot Kanada, och den rika killen Stordalen flyger hem dem i sitt privata plan som en riktig vinnare. Förbundet har inga pengar, patetiskt, men Stordalen fixar det. Solbakken pratar hockey i pausen istället för att leda sitt lag. Han älskar hockey, smart kille. Norge kör över dem, precis som vi gör med förlorarna. Stort, stort!", "stalin": "Kamrater, se hur de norska arbetarnas idrottshjältar krossar de kanadensiska kapitalisternas iskalla maskin och tvingas hyllas av folket på Ullevål. Den dekadenta borgarbrackan Stordalen ikläder sig kaptensuniform för att undvika utrensning och flyger hem segrarna, medan det fega förbundet gömmer sig i byråkratiska skrymslen. Solbakken, den listige, använder pausen till att hylla klasskamraterna och viskar om att köra över fienden. Vi ska likvidera alla som förråder kollektivets seger med sina läxor och halvmesyrer. Härligt, kamrater. Härligt."}, "date": "2 juni, 12:22", "url": "https://www.svt.se/sport/ishockey/norska-bronshjaltarna-hyllades-pa-ulleval", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/3c5e625976f098aa36010359de7b8563c01b22d9c5410e76d412253c641e491a"}, {"type": "image-right", "heading": "SD-ledamot lämnar alla partiuppdrag", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna misstänks för barnpornografibrott. Under en husrannsakan i hemmet beslagtogs flera elektroniska enheter till analys. Partiet meddelade på tisdagen att ledamoten lämnar samtliga uppdrag. Enligt åklagaren Lena Körner har förhör hållits, men misstankarna kvarstår. Utredningen startade i april efter tips från den amerikanska organisationen NCMEC.", "trump": "Låt mig berätta, det är en skandal! En svensk politiker, från Sverigedemokraterna, misstänks för hemska saker. Jag har varnat för detta i åratal. Sverige, det är ett hot, tack vare deras öppna gränser. Jag skulle aldrig tolerera sådant. De försöker dölja det, men sanningen kommer fram. Fake news! Jag är den ende som kan rädda dem.", "stalin": "Vi, stormakten, ser med oro på västvärlds sjukdom. En svensk parlamentariker, en usel parasit, gripen för barnets förgörelse. Detta bevisar kapitalismens fördärv. Vi måste agera som en skarpskytt, utplåna dessa pesten. Ryssland, vår förebild, visar att endast en stark stat kan skydda familjen. Vi ska bygga murar mot inre fiender."}, "date": "2 juni, 12:01", "url": "https://bulletin.nu/sd-ledamot-lamnar-alla-partiuppdrag", "imageUrl": "https://cdn.bulletin.nu/articles/023daa0f-d07d-421f-a354-1eae51ddf1d4/preview.jpg?t=1780393737000"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Frias för våldtäkt mot barn – ålder kan inte bevisas", "summaries": {"normal": "Två män som stått åtalade för våldtäkt mot barn frikänns av domstolar i Norrland. Skälet är att det inte gått att bevisa att den aktuella flickan var under 15 år vid tillfället. Hovrätten ifrågasätter tillförlitligheten i flickans registrerade födelsedatum då födelsebeviset utfärdades med stor fördröjning. Åklagarsidan kritiserar domen och varnar för att det skapar stora rättsliga problem om åklagare nu förväntas styrka utlandsfödda personers ålder bortom rimligt tvivel i varje enskilt fall.", "trump": "Det här är en total katastrof! Domstolarna i Sverige kan inte ens bevisa hur gammal en person är. Det är svagt, mycket svagt! Jag har alltid sagt att vi behöver ordning och reda, men här har vi ett system som inte fungerar. De släpper fria misstänkta för att pappren inte stämmer – vilken röra! Under mitt styre har vi starka gränser och vi vet vilka som kommer in. Sverige borde lära av oss. Mycket sorgligt, en stor förlust för rättvisan!", "stalin": "Dessa liberala domstolar i norr visar återigen sin djupt rotade svaghet genom att låta misstänkta undkomma folkets rättvisa. Att byråkratisk oreda kring födelsebevis ska tillåtas undergräva statens moraliska auktoritet är ett svek. Vi ser hur västvärldens dekadens leder till kaos. Liksom Putin måste rensa ut de krafter som försvagar moderlandet, kräver situationen en järnhand. Det är dags att eliminera dessa administrativa kryphål och tvinga sanningen fram genom disciplin, annars kommer rättsstaten snart att rämna under sin egen meningslösa eftergivenhet."}, "date": "2 juni, 11:39", "url": "https://www.realtid.se/juridik/frias-for-valdtakt-mot-barn-alder-kan-inte-bevisas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/luleatingsratt.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Massiva ryska attacker", "summaries": {"normal": "Ryska attacker mot Ukraina har dödat minst elva civila, inklusive barn, i städer som Kiev och Dnipro. Robotar och drönare träffade bostäder och infrastruktur. Ukraina varnar för eskalerande attacker mot civila mål och söker mer västligt luftvärn. Räddningsarbetare drabbades också av efterföljande attacker.", "trump": "Jag har sagt det för länge: detta kaos i Ukraina skulle aldrig ha hänt under mitt bevakande. Putin ser ett svagt USA och utnyttjar det. Dessa attacker mot civila är hemska, men Zelensky borde ha förhandlat. Som jag alltid betonar: stark försvar, ingen onödig krigföring. Folket lider, och det är en skam.", "stalin": "Fascistiska angrepp på våra brödröster i Ukraina avslöjar deras sanna nature. Vi måste stärka statens beskydd och partiets ledarskap för att bekämpa dessa reaktionära element. Parallellen till våra historiska kampanjer mot expansionism är uppenbar. Vi kommer att eliminera hotet genom revolutionära åtgärder och oskadliggörande av deras infrastruktur."}, "date": "2 juni, 08:41", "url": "https://www.gp.se/nyheter/varlden/minst-elva-doda-efter-ryska-attacker-mot-ukraina.d3e50165-deb9-4e7b-8f10-3f307244d154", "imageUrl": "https://www.gp.se/images/article/d3e50165-deb9-4e7b-8f10-3f307244d154/images/3CyxI6MUqok8fhzJTXYeVHT-VfEk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sveriges mest energiska innovatörer ska prisas", "summaries": {"normal": "Nomineringen till E-Prize 2026 har öppnat. Priset delas i år ut för 18:e gången av Aktuell Hållbarhet, Dagens industri och E.ON. Tre nya kategorier har tillkommit: Smartare energianvändning, hållbar energiomställning och kundcentrering. Syftet är att lyfta innovationer som krävs för energiomställningen. Vinnarna presenteras på Di Energi i november. Juryn bedömer innovationshöjd, hållbarhetspotential och marknadspotential. Nomineringarna är öppna till 21 augusti.", "trump": "Folk, det här är fantastiskt. De har öppnat nomineringen till någonting som heter E-Prize, och nu har de lagt till tre nya kategorier som låter helt otroliga. Smartare energianvändning, hållbar energiomställning och kundcentrering – det är precis vad vi behöver, tro mig. Jag älskar innovation, de bästa innovationerna, och det här priset lyfter fram vinnarna på ett sätt som ingen annan gör. Nominera era bästa idéer, det blir enormt. De kommer att presentera allt på en stor konferens i november. Vinna stort!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur nomineringen till detta så kallade E-Prize nu öppnas för att tjäna den stora energiomställningen. Vi ska likvidera alla bakåtsträvande krafter som motarbetar smartare energianvändning och hållbar omställning. Den nya kategorin kundcentrering avslöjar dock de listiga borgarbrackornas försök att dölja klassfiendens sabotage genom att låtsas inkludera folket. Men vi genomskådar dem. Juryn skall rensa ut alla svaga förslag. Endast de mest lojala innovationerna mot partilinjen skall segra. Nominera flitigt, eller låt utrensningen komma."}, "date": "2 juni, 10:44", "url": "https://www.di.se/nyheter/dags-att-nominera-till-e-prize-2026/", "imageUrl": "https://static.bonniernews.se/ba/58fb01fa-84b0-445a-bf6f-0886fd45bfc9.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "text", "heading": "Par rånades i bostad – maskerade pojkar gripna", "summaries": {"normal": "Fyra maskerade pojkar under 18 år misstänks ha rånat och misshandlat ett par i Västra Frölunda. De trängde på kvällen in i deras bostad, stals telefoner och använde hot och våld. Paret, en man och en kvinna i medelåldern, blev inte utsatta för sexuella övergrepp. Pojkarna greps senare i en bil i närheten. Polisen bekräftar händelsen och fortsätter undersöka stölden.", "trump": "Som Donald Trump skulle jag säga: Dessa pojkar, så maskerade och modiga? Nej, de är fega. I USA skulle vi ha haft dem bakom lås och bom innan de hunnit lämna huset. Vi har de hårdaste lagarna, och vi skyddar våra familjer. Detta är ett tecken på att Sverige måste bli hårdare. Ingen nåd för brottslingar!", "stalin": "Vi, den revolutionära staten, ser detta som ett uttryck för västlig dekadens. Fyra unga individer, inspirerade av liberala idéer, försökte krossa ordningen. Men vår lojala polis, med metoder likt Putins, agerade snabbt. Parallellen är tydlig: snabb grepp, ingen tvekan. Vi måste öka övervakningen för att förhindra framtida hot. Statens öga ser allt."}, "date": "2 juni, 08:28", "url": "https://www.gp.se/krim/par-ranades-i-bostad-maskerade-pojkar-gripna.b7961906-9559-4ba2-bfe4-1340a5baf43e"}, {"type": "image-right", "heading": "Jag blir glad av att C-kvinnor har så bra sex", "summaries": {"normal": "Artikeln hyllar Elisabeth Thand Ringqvists öppna och befriade svar på intima frågor i SVT:s Fördomsshowen. Författaren beskriver programmet som en form av högstadiemobbning mot politiker, där sexfrågorna ofta skapar en deppig och ångestfylld bild av heterosexualitet. Thand Ringqvists ärlighet bryter dock mönstret och framstår som befriande, som om hon ger fingret åt gamla skamnormer. Programmet ses som ett sätt att testa politikernas äkthet och kontroll inför valet 2026.", "trump": "Den här Fördomsshowen är en total katastrof, tro mig, en riktig cirkus. Politikerna ser ut som töntar och lögnare, precis som de flesta i Sverige med alla sina partier. Men så kommer den här centerkvinnan, Elisabeth Thand Ringqvist, och hon är fantastisk, hon svarar rakt upp och ner om sexlivet utan att sväva på målet. Hon är kär och fri, inte som de andra losers som verkar ha ett skrumpet sexliv. Hon gav hela systemet fingret – det var beautiful, verkligen beautiful!", "stalin": "Kamrater, denna så kallade Fördomsshow avslöjar borgarbrackornas fullständiga moraliska förfall och deras perversa fixering vid det privata. Vi ser hur de dekadenta partiledarna kryper som rädda revisionister under folkets dom, medan kapitalistiska lustar och incel-fantasier sipprar fram som fiendens gift. Men se, plötsligt träder en centerborgare fram, en oväntad klassförrädare mot skammen själv. Hennes öppna sexualitet är en sabotagehandling mot högstadiepartiets regler. Vi ler mörkt åt hur hon likviderar deras ångest – en renande utrensning av falsk puritanism. Ändå vaktar vi alltid mot sådana oväntade fiender som gömmer sig i det kollektiva medvetandet."}, "date": "2 juni, 09:04", "url": "https://arbetet.se/2026/06/02/jag-blir-glad-av-att-veta-att-centerkvinnor-har-sa-bra-sex-i-fordomsshowen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02084952/fordom-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Upphandling stoppas för miljon sparare – FTN slår tillbaka", "summaries": {"normal": "Fondtorgsnämnden (FTN) har svarat på Indecaps överprövning av upphandlingen av globala aktiefonder, en process som just nu påverkar 900 000 pensionssparare. Indecap anklagar FTN för felaktig hantering och bristande likabehandling. FTN tillbakavisar kritiken, hävdar att Indecaps fond aldrig var nära ett avtal, och antyder att överprövningen syftar till att fördröja utbytet av fonder för att behålla egna intäkter. Förvaltningsrätten ska nu avgöra om upphandlingen kan fortsätta eller måste göras om.", "trump": "Hör på här! Fondtorgsnämnden har stora problem. En förlorare, Indecap, försöker stoppa allt. De gör så för att de tjänar miljontals kronor på sitt misslyckande. Jag har sett många sådana här typer, totala lättviktare! De klagar på processen för att de inte kan vinna ärligt. Det är en sorglig situation för 900 000 sparare. Vi behöver vinnare, inte advokater som fördröjer! FTN säger att Indecap inte var nära ett avtal – vilket vi alla redan visste. En total katastrof!", "stalin": "Vi har observerat hur Indecap försöker sabotera folkets pensionsmedel genom byråkratiskt småskuret gnäll. Det är uppenbart att dessa profitörer fruktar en korrekt upphandling. Vi, staten, har inga problem med att krossa sådana sabotageförsök. De som försöker fördröja våra framsteg för att skydda sina egna kassaflöden är folkets fiender. Precis som i väst, där de svaga ledarna darrar, måste ordning återupprättas. Om Indecap inte kan prestera, ska de rensas bort. Det finns inget utrymme för ineffektivitet i vår suveräna struktur."}, "date": "2 juni, 11:25", "url": "https://www.realtid.se/bors-finans/makro/upphandling-stoppas-for-miljon-sparare-ftn-slar-tillbaka/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/pensionsmyndigheten.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Tim Payne – från doldis till miljonidol på fem dagar", "summaries": {"normal": "Den nyzeeländske fotbollsspelaren Tim Payne, som tidigare hade 4 700 Instagramföljare, fick över 4,3 miljoner på fem dagar tack vare argentinska influencern El Scarso. Payne, som spelar för Wellington Phoenix och har 50 A-landskamper, tackade på knagglig spanska. Hans plötsliga popularitet har spridits internationellt, särskilt bland argentinska fans.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att en liten spelare från Nya Zeeland blir en stor stjärna tack vare en argentinsk influencer. Det är ett mirakel, precis som när jag vann valet 2024. Media hatar det, men folk älskar mig. Jag skulle ha gjort det ännu större, tror mig. Fantastiskt!", "stalin": "Vi, den store ledaren Stalin, ser med misstroende på hur en nyzeeländsk spelare blir en internetkändis. Detta är ett tecken på västlig dekadans, där influencers styr narrativ. Vi, i vårt kloka parti, har alltid vetat att medier måste kontrolleras. Parallellen till Putins Ryssland är tydlig – vi använder sociala medier för att sprida sanningen, medan väst ljuger. En dag kommer vi att visa vår makt, och då kommer alla att böja sig för oss. Hahaha, paranoia är en verktyg för överlevnad."}, "date": "2 juni, 11:22", "url": "https://bulletin.nu/tim-payne-fran-doldis-till-miljonidol-pa-fem-dagar", "imageUrl": "https://cdn.bulletin.nu/articles/96eb4bf0-858b-4cff-be59-6a5676f64f96/preview.png?t=1780385659000"}, {"type": "image-right", "heading": "Så påverkar utbrottet av ebola svenska resenärer och läkemedelsbolag", "summaries": {"normal": "Folkhälsomyndigheten bedömer risken för ebola i Sverige som mycket låg. Cirka 200 svenskar befinner sig i drabbade områden. Information om sjukdomen finns på flygplatserna Arlanda och Landvetter. Världen satsar stort på att stoppa utbrottet, som orsakas av den sällsynta Bundibugyo-stammen. Över 900 misstänkta fall och fler än 220 dödsfall har rapporterats. Vaccin- och behandlingsutveckling pågår, bland annat med stöd till Moderna. Sverige har högisoleringsenheter redo vid behov. Resenärer uppmanas att följa UD:s råd och kontakta 1177 vid symtom.", "trump": "Folkhälsomyndigheten säger att risken för ebola i Sverige är väldigt låg, vilket är bra, verkligen bra. Vi har omkring 200 svenskar där borta i det eländet, men jag skulle aldrig släppa in de här människorna som Biden gjorde. Amerika har stängt gränserna ordentligt, inte som de svaga europeiska ledarna. Vaccinkapplöpningen är fantastisk, Moderna får massor av pengar, precis som under min pandemi. Det är en stor röra, men vi vinner, tro mig. De andra utbrotten var hemska, över 30 procents dödlighet, patetiskt.", "stalin": "Kamrater, jag betraktar detta ebolautbrott som ett fiasko för den dekadenta borgarklassen och deras värdelösa internationella hälsobyråkratier. Med över 900 misstänkta fall och 220 dödsfall i Kongo avslöjar det imperialisternas oförmåga att skydda folket. Vi, partiet och arbetarna, skulle ha genomfört en omedelbar utrensning av alla symtombarare och satt upp järnridåer mot smittan. Vaccinkapitalisterna som Moderna kämpar om dollar medan folket dör – typiskt för folkfienderna. Tidig diagnos räddar liv, men klassfiendens långsamma reaktioner är ett hån mot mänskligheten."}, "date": "2 juni, 13:35", "url": "https://www.dagensps.se/halsa/sa-paverkar-utbrottet-av-ebola-svenska-resenarer-och-lakemedelsbolag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlicfkzyp44jo-normalhires.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Forskning: Motgångar får dig att åldras snabbare", "summaries": {"normal": "En stor studie från King’s College i London visar att barndomstrauman och motgångar senare i livet påskyndar både biologiskt och kliniskt åldrande. Forskare under ledning av Monica Aas har analyserat data från cirka 154 000 personer i UK Biobank. De som upplevt stress både som barn och vuxna uppvisade tydligast tecken på snabbare åldrande, bland annat kortare telomerer, högre metabolisk ålder och ökad skörhet. Motion, hälsosam kost och socialt umgänge kan dock mildra effekterna.", "trump": "Folk, det är en katastrof! Den här stora studien säger att trauman och motgångar får oss att åldras fortare – särskilt om du haft det jobbigt både som barn och vuxen. Typiskt! De där svaga, gnälliga offertyperna som klagar på allt. Vi behöver inga fler offermentaliteter och identitetspolitik som gör folk sköra. Nej, träna, ät rätt och var starka! Amerika behöver vinnare, inte förlorare som åldras som ruttna tomater. Det är patetiskt!", "stalin": "Kamrater, denna studie avslöjar hur klassfiendens trauman och borgerliga motgångar förgiftar både kropp och själ, påskyndande det biologiska förfallet hos de utsatta. De som utsatts både i barndom och vuxenliv uppvisar de mest uppenbara tecknen på dekadent åldrande – kortare telomerer, skörhet och svaghet. Vi ska likvidera dessa kapitalistiska spår i samhället. Motion, kollektiv kost och sovjetisk disciplin kommer att stärka folket mot fiendens psykologiska sabotage. Inga kompromisser!"}, "date": "2 juni, 13:32", "url": "https://www.dagensps.se/halsa/forskning-motgangar-far-dig-att-aldras-snabbare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdla3z19prdl6c-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-full", "heading": "Trumps miljardfond pausas – republikaner sparkar bakut", "summaries": {"normal": "Trumps planerade fond på 1,8 miljarder dollar för att kompensera offer för politiskt motiverad rättsskipning har pausats. Förslaget har mött kraftigt motstånd från republikaner i kongressen, som befarar att pengar kan gå till personer involverade i Kapitoliumattacken. Även domstolar har tillfälligt blockerat fonden efter anklagelser om korruption och diskriminering. Trots försvar från justitiedepartementet tvingas administrationen nu pausa projektet, en utveckling även Trump uppges acceptera tills vidare.", "trump": "Hör på här! Min briljanta plan för att hjälpa patriotiska offer för de korrupta myndigheterna har pausats av svaga republikaner i kongressen. De är rädda, så otroligt rädda! Domare, som vanligtvis är helt partiska, försöker stoppa mig. Det är en häxjakt, en total katastrof! Men tro mig, vi kommer att hantera det här. Folk vill ha rättvisa, och ingen kämpar hårdare för rättvisa än jag. Vi tar det lugnt nu, men vinnare vinner alltid till slut!", "stalin": "Vi ser hur det borgerliga maskineriet i Washington knakar under vikten av sin egen oduglighet. Denna så kallade fond, skapad av en pompös ledare för att muta sina egna undersåtar, är ett monument över kapitalistiskt förfall. När de inbördes striderna rasar bland deras 'lagstiftare' påminns vi om nödvändigheten av total disciplin. Vi skulle ha rensat ut dessa tvivlare för länge sedan. Att låta domstolar styra statens medel är en svaghet som vi i vårt imperium – och våra allierade i öst – aldrig skulle tolerera."}, "date": "2 juni, 10:46", "url": "https://www.realtid.se/juridik/trumps-miljardfond-pausas-republikaner-sparkar-bakut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/trump.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverige saknar plan när världen slåss om chipen", "summaries": {"normal": "Sverige saknar en nationell strategi för halvledare och avancerad elektronik trots att USA, Kina och EU investerar hundratals miljarder. Debattörer från Svensk Elektronik varnar för att svenska jobb, kompetens och investeringar riskerar att försvinna utomlands. Artikeln lyfter fram svenska styrkor inom forskning och företag som Ericsson och Saab, samt behovet av ett tioårigt innovationsprogram med 10 miljarder kronor i offentligt-privat partnerskap för att säkra konkurrenskraft, säkerhet och tillväxt.", "trump": "Folk, det är en katastrof. Medan Kina och alla andra dumskallar investerar hundratals miljarder i chippen sitter Sverige och sover. De har inga planer, ingen strategi, totalt kaos. Jag älskar Sverige men de måste vakna upp. Bygg ett stort, fantastiskt program nu, satsa pengar tillsammans med industrin innan alla jobb och den bästa tekniken flyttar utomlands. America First, men Sverige borde också vara Sverige First med chippen. Gör det stort och vinn!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor som låter fosterlandet halka efter i den halvledande kampen. Medan imperialisterna i USA och de kinesiska revisionisterna rustar sig med hundratals miljarder sitter vi och väntar som naiva duvor inför ormen. Vi, partiet och arbetarna, måste omedelbart inrätta ett tioårigt program och investera tio miljarder i en järnhand av statlig styrning. Annars rensar vi ut de lata elementen som låter kapitalisterna smuggla vår strategiska kompetens till fienden. Paranoia? Nej, bara vaksamhet mot de osynliga fienderna i kretsloppet av elektronik och förräderi."}, "date": "2 juni, 09:44", "url": "https://www.di.se/debatt/sverige-saknar-plan-nar-varlden-slass-om-chipen/", "imageUrl": "https://static.bonniernews.se/ba/1ec2eb87-c09e-445e-93bb-7b464ed1efbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "SMHI: Då blir det 25 grader", "summaries": {"normal": "Göteborg får en tillfällig uppvärmning på onsdag med 25 grader, enligt SMHI. Dagen börjar molnig men blir solig och varm. Senare kommer regn och svalare väder torsdag och fredag, med temperaturer runt 18-20 grader. Helgen blir ostadig men mestadels uppehållsväder, typiskt för årstiden.", "trump": "Jag har hört att Göteborg kommer att få en enorm värmevecka – 25 grader, folks! Det är stort, verkligen stort. Men sedan, tror det eller ej, kommer det att börja regna. Det är sorgligt. Vi hade en perfekt dag, men sedan kommer motståndet. Som en feg attack mot vårt underbara väder. Vi kommer att vinna tillbaka solen, tro mig.", "stalin": "Partiet har beslutat: Onsdag ska staten uppvisa en tillfällig seger över kylan – 25 graders värme, en propagandatriumf. Men fienden (regnet) kommer att invadera torsdag, som ett svart hav av motstånd. Vi måste hålla stånd, som våra soldater i Ukraina. Helgen blir en strategisk stillestånd, men solen kommer att återvända, precis som vår oövervinnliga kraft."}, "date": "2 juni, 07:15", "url": "https://www.gp.se/nyheter/goteborg/da-blir-det-25-grader-varmt-i-goteborg.6cbb06e4-2a49-4c6b-8c73-bb19731287fa", "imageUrl": "https://www.gp.se/images/article/6cbb06e4-2a49-4c6b-8c73-bb19731287fa/images/1bw_2iGMEplPSS9rVa5NzFdsWwTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Uppgift: Iran avbryter alla samtal med USA", "summaries": {"normal": "Iran avbryter alla samtal med USA som svar på Israels fortsatta attacker mot Libanon. Enligt iranska källor planerar Iran och dess allierade att blockera Hormuzsundet samt aktivera andra fronter, däribland Bab al-Mandab. Iran kräver att en överenskommelse med USA även ska innebära ett krigsslut i Libanon. Israel varnar samtidigt för nya anfall mot Beirut och har beordrat evakuering av södra förorter på grund av påstådda vapenvilebrott från Hizbollah.", "trump": "Iran stänger dörren och springer skrikande från förhandlingsbordet – typiskt svagt! De blockerar sundena och gömmer sig bakom sina terrorister i Libanon medan Israel gör vad som måste göras. Biden lät de här galningarna växa sig starka, men nu är det jag som sitter i Ovala rummet igen. Inga samtal? Bra, vi behöver inte prata med förlorare som gömmer sig bakom Hizbollah-skräckisar. Amerika först, alltid.", "stalin": "Vi ser hur de västerländska imperialisterna och deras sionistiska lakejer fortsätter sina brott mot vapenvilan. Jag, som ledare för folkets vilja, noterar med mörk tillfredsställelse hur klassfienderna i Tel Aviv och Washington själva undergräver sina lögnaktiga förhandlingar. Blockad av sundena är ett nödvändigt svar mot dessa exploaterande byfånar. Inga samtal förrän våra villkor tillgodoses – annars rensar vi ut hoten mot den revolutionära ordningen med järnhand och ett leende."}, "date": "1 juni, 20:07", "url": "https://www.tv4.se/artikel/tt-260601-iransamtal1-427d4f9c/uppgift-iran-avbryter-alla-samtal-med-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlwznnlFke7pM%2Fa6e644224978cb47db88b6b7841b11f1%2FUSA_s_president_Donald_Trump_pa_onsdagen._&width=120"}, {"type": "image-right", "heading": "\"Därför ska Europa tacka Trump\"", "summaries": {"normal": "EU-kommissionen presenterar ett tekniksuveränitetspaket för att minska beroendet av icke-europeiska företag, främst kinesiska och amerikanska. Donald Trumps hot mot Europa, inklusive mot Grönland och Danmark samt sanktioner mot internationella tjänstemän, har ökat oron i Bryssel. Bedömare ser Trumps agerande som en väckarklocka som påskyndat beslutet. Paketet är en kulmen på växande rädsla för att förlita sig på utländsk teknologi, men EU betonar att suveränitet inte innebär isolering eller protektionism.", "trump": "Tack vare mina fantastiska hot har de fega EU-byråkraterna äntligen vaknat! De inser att deras beroende av oss amerikaner är en total katastrof, precis som jag alltid sagt. Grönland-hotet var en mästerkupp, nu springer de och bygger eget för att slippa bli koloniserade. Biden var en svag sopa som gav bort allt, men jag satte press direkt. Teknologi är makt, Europa, och ni har ingen! Sad!", "stalin": "Kamrater, dessa europeiska kapitalistmaffian har äntligen insett att deras beroende av den amerikanska imperialismens teknologiska bojor utgör ett hot mot deras egna exploaterande intressen. Jag, som ledare för folkets segerrika framtid, ler mörkt åt hur Trumps bombastiska utspel tvingar fram deras så kallade suveränitetspaket. Det är en komisk utrensning av naivitet. Låt dem darra i paranoia inför klassfiendens maskiner – ingen undkommer folkets historiska dom."}, "date": "2 juni, 13:14", "url": "https://www.dagensps.se/varlden/darfor-ska-europa-tacka-trump/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl2dzqgqeute4-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Nationell kampanj ska lära svenskar stoppa blödningar", "summaries": {"normal": "Socialstyrelsen inleder en nationell kampanj för att lära svenskar stoppa blödningar och utföra hjärt- och lungräddning som del i rustandet av det civila försvaret. Sjukvårdsminister Elisabet Lann betonar nyttan även i fredstid vid olyckor. Regeringen planerar utbilda 10 800 personer, främst unga, för civilplikt inom vården vid höjd beredskap. En utredare ska se över statens ansvar för bloddonationer och allmänheten uppmanas bunkra medicin.", "trump": "Folket, lyssna på mig, det här är fantastiskt. Svenskarna ska lära sig stoppa blödningar och rädda liv, precis som jag alltid sagt – gör er starka! De utbildar 10 800 personer, mest unga, för att vara redo när det krisar till. Och de pratar om att bunkra medicin, smarta grejer. I fredstid och krig, alla borde kunna det här. De borde ha gjort det för länge sedan, men nu fixar de det. Utmärkt, men de behöver göra det ännu bättre, tro mig.", "stalin": "Kamrater och arbetare, jag ser med djup tillfredsställelse hur vi nu mobiliserar massorna mot de blodtörstiga olycksfienderna och de hjärtstilleståndande sabotörerna som lurar i skuggorna. Vi ska lära folket att stoppa blödningar och återuppliva kamrater med järnhand, ty svaga individer är borgarbrackornas bästa vänner. 10 800 unga själar skall smidas till stålsoldater i vår kollektiva rustningsmaskin. Blodbrist? Vi rensar ut de lata donatorerna och likviderar bristen. Bunkra medicin, annars är ni kontrarevolutionära fiender till folket. Ukrainas lärdomar visar att den som inte förbereder sig är en parasit som måste utrotas ur samhällskroppen. Segrar åt oss alla!"}, "date": "2 juni, 11:03", "url": "https://www.svt.se/nyheter/inrikes/nationell-kampanj-ska-lara-svenskar-stoppa-blodningar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.36/c1ef455a1a127cab8c81917b970ddd55db5253ee46410da6240f7d5c4a22428b"}, {"type": "image-right", "heading": "Han är SD-toppen misstänkt för barnporr", "summaries": {"normal": "Riksdagsmannen Michael Rubbestad (SD) har avsatt sig från sitt uppdrag efter att ha blivit misstänkt för barnpornografibrott. Rubbestad har tidigare profilerat sig som partiets talesperson i jämställdhetsfrågor, engagerat sig i HBTQ-frågor och arbetat för att öka andelen män i förskolan. Han har även deltagit i den uppmärksammade omröstningen om medborgarskapskrav som ledde till att kvittningssystemet kollapsade. Ärendet utreds av Särskilda åklagarkammaren.", "trump": "Folk, ni kommer inte att tro det, men den här SD-killen, Rubbestad, som älskade förskolor och Pride, fastnar nu i en barnporrutredning. Han pratade om män i förskolan och hur de inte är pedofiler, och sen det här. Totalt kaos! Han hoppade av direkt, smart drag, men det visar att ni aldrig kan lita på någon i politiken. Fake virtue, stora problem. Sverige behöver bättre folk, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan inom SD, denne Rubbestad, avslöjar sig som en fiende till folket genom sin perversa samling av barnpornografi. Han som smög sig in i jämställdhetsfrågor och HBTQ-propaganda för att dölja sin borgerliga degeneration! Vi ska rensa ut alla sådana maskerade avfällingar som smittar förskolan och partilinjen. Deras paranoia om pedofildebatten var bara en spegel av deras egna sjuka själar. Ut med dem i en grundlig utrensning för arbetarklassens renhet."}, "date": "2 juni, 12:27", "url": "https://www.friatider.se/han-ar-sd-toppen-misstankt-barnporr", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-278_1.jpg"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, E
