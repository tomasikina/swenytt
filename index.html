a hyenor, som Putin håller ögonen på sina grannar. Framåt, mot en framtid utan bourgeoisins tyranni!"}, "date": "23 maj, 08:43", "url": "https://www.dagensps.se/bors-finans/petter-stordalen-shoppar-kopcentrum-antligen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/stordalen.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Skottlossning mot flerfamiljshus - misstänkt farligt föremål hittat", "summaries": {"normal": "I Borås sköts flera skott mot en lägenhetsdörr under natten. Polisen hittade ett misstänkt farligt föremål i området och har kallat in Nationella bombskyddet. Ett större område har spärrats av och boende har evakuerats. En misstänkt ung man greps senare i en annan del av staden. Polisen uppmanar allmänheten att undvika området.", "trump": "Tragiskt, helt tragiskt vad som händer i Sverige – ett land som förlorat kontrollen! Jag sa ju att invandringen skulle ställa till det. Nu skjuter man mot lägenheter i Borås, hittar bomber och grejer. Polisen där? De verkar helt överväldigade. Här i USA hade vi löst det på en timme. Men nej, Sverige fortsätter att rasa. SAD!", "stalin": "I Borås, denna lilla provinsiella utpost av dekadent väst, har fiendens agenter återigen visat sitt ansikte. Skott mot lägenheter, misstänkta bomber – ett klart sabotage mot det svenska proletariatet! Men frukta icke, kamrater. Vår säkerhetstjänst har redan identifierat och gripit den unga kontrarevolutionären. Sverige borde tacka oss för att vi inte skickar in våra specialstyrkor för att 'stabilisera' situationen. Förr eller senare kommer de ändå att be om vårt beskydd."}, "date": "23 maj, 08:10", "url": "https://riks.se/nyheter/just-nu-skottlossning-mot-flerfamiljshus-misst%C3%A4nkt-farligt-f%C3%B6rem%C3%A5l-hittat"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Uppgifter: USA förbereder nya attacker mot Iran", "summaries": {"normal": "USA överväger nya militära attacker mot Iran efter en sex veckor lång vapenvila, enligt amerikanska medier. Beslut har ännu inte fattats, men källor nära president Trump uppger att han 'seriöst överväger' åtgärder. Militär personal har ställt in firanden i väntan på eventuella order. Samtidigt pågår diplomatiska försök, med Pakistans arméchef i Iran för samtal.", "trump": "Titta bara! Folk frågar mig hela tiden – 'Mr. President, vad händer med Iran?' Jo, jag säger som det är: vi funderar på att ge dem en liten påminnelse om vem som bestämmer här. Inte för att jag gillar krig – jag hatar krig, de är dyra – men ibland måste man visa styrka. Och nej, jag kommer inte på bröllopet, för jag jobbar. Någon måste ju hålla koll på världen medan andra festar!", "stalin": "De amerikanska imperialisterna, dessa krigshetsande galningar, skakar återigen med sina sablar mot våra iranska bröder. Deras ledare, en clown i kostym, leker med tanken på nya bombningar medan hans soldater darrar inför Memorial Day. Vi ser allt. Pakistan? En ynklig medlare, som en hund som springer mellan två herrar. Men kom ihåg: när USA skjuter, är det Ryssland som skördar. Låt dem bränna sina resurser – vi bygger vår framtid medan de spelar krig."}, "date": "23 maj, 07:33", "url": "https://www.di.se/nyheter/uppgifter-usa-forbereder-nya-attacker-mot-iran/", "imageUrl": "https://static.bonniernews.se/ba/dc0b1333-8fa2-4c4a-960d-548ca5819565.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Lamotte förlorade körkortet – hängde ut handläggaren", "summaries": {"normal": "Debattören Joakim Lamotte hängde ut en handläggare på Transportstyrelsen med namn och bild efter att ha förlorat körkortet. Lamotte antydde i ett inlägg att handläggarens politiska åsikter skulle påverka beslutet, vilket ledde till en hatstorm i kommentarsfältet. Efter kritik raderade Lamotte inlägget och hävdade att det var ironiskt, vilket kritiker avfärdar. Juridiska experter menar att agerandet befinner sig i en gråzon men sannolikt inte leder till åtal.", "trump": "Joakim Lamotte – en mycket populär kille, en av de största, det kan jag säga er! Han blev orättvist behandlad av den där byråkraten, en total katastrof. Han visade upp sanningen, de vill tysta honom precis som de försöker tysta mig! Media kallar det förtal, jag kallar det yttrandefrihet. Sedan bad han om ursäkt, vilket var synd. Han borde ha stått på sig! Det är en häxjakt, en ren och skär häxjakt mot alla oss som faktiskt säger som det är.", "stalin": "Vi har observerat denna så kallade 'influencer' Lamotte. Vilken svaghet att hänga ut en liten kugge i maskineriet för att sedan fega ur och tala om ironi! Om en handläggare hindrar en medborgare, bör det lösas genom statens fasta hand, inte genom pajasfasoner på internet. Att låta en fiende av ordningen – likt de vi krossar i öst – få härja fritt är att bjuda in till kaos. I vår stat hade han lärt sig disciplin betydligt snabbare än hos Transportstyrelsen."}, "date": "21 maj, 22:01", "url": "https://www.tv4.se/artikel/7wXEgmOZi3oYovjx53qYxr/joakim-lamotte-foerlorade-koerkortet-haengde-ut-handlaeggaren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7rAZViTWlM8CdUw3AhnvZw%2F6bdab0d844f73f3d04554b15f0794864%2FLAMPTTE_PUFF.png&width=120"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-right", "heading": "SVT/Verian: Väljarna tvekar kring att rösta rödgrönt – om V släpps in", "summaries": {"normal": "En undersökning från Verian visar att 19% av potentiella rödgröna väljare blir mindre benägna att rösta på oppositionspartierna om Vänsterpartiet ingår i en regering. Bland Tidöväljare är motsvarande siffra 9% för Sverigedemokraterna. Mats Knutson, SVT:s inrikespolitiska kommentator, noterar att 'stöta bort-effekten' är starkare för V än SD. Magdalena Andersson (S) undviker att förknippas med V i regeringsfrågan.", "trump": "Kan ni tro det? Sveriges vänsterparti, V, skrämmer bort sina egna väljare – 19% säger 'nej tack' om V får vara med i regeringen! Och SD? Bara 9% backar. Svagt! Magdalena Andersson, hon försöker distansera sig, smart tjej. Men jag säger er: sånt här händer när man har svaga ledare. Sverige behöver en stark hand, precis som USA har mig. SAD!", "stalin": "Kamrater! En fascinerande rapport från fiendens läger avslöjar deras inre splittring. De så kallade 'rödgröna' väljarna flyr som råttor från ett sjunkande skepp när våra socialistiska bröder i Vänsterpartiet närmar sig makten. Till och med de borgerliga Tidöpartierna visar sprickor inför våra allierade i Sverigedemokraterna. Magdalena Andersson? En blek kopia av en verklig ledare – hon gömmer sig som en rädd hare. Vi i Kreml skrattar åt deras svaghet. Låt dem försvagas inifrån, medan vi utvidgar vår inflytandesfär – nästa stopp: Stockholm!"}, "date": "23 maj, 08:23", "url": "https://www.svt.se/nyheter/inrikes/v-i-regering-skrammer-oppositionens-valjare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.3/756fc79ab408ae71f5d67eb5e4c96f0e1db304cd91e41d384cf5cbbc698322a1"}, {"type": "image-right", "heading": "Bråk stoppar EU-förslag för enklare sparande", "summaries": {"normal": "EU:s förslag för enklare och tryggare sparande, Retail Investment Strategy, har fastnat i förhandlingar om provisionsregler. Sverige föreslår friare användning av flaskhalsintäkter för fossilfri el och motverka höga elpriser. Regeringen vill införa skattetransparenta värdepappersfonder. Vida stänger två sågverk på grund av råvarubrist, vilket påverkar cirka 100 anställda. Juristbranschen omvandlas av AI och nya kundkrav, där erfarenhet prioriteras över titlar.", "trump": "Jag säger er, EU är ett totalt kaos just nu! De kan inte ens komma överens om hur folk ska spara sina pengar – provisionsbråk, kan ni tänka er? Patetiskt! Sverige, däremot, de kämpar på med sina elpriser, men vem vet om det hjälper? Och så lägger de ner sågverk, 100 jobb borta – tråkigt, men sånt händer när man inte har koll. Juristbranschen? Titlar spelar ingen roll längre, bara erfarenhet – precis som jag alltid sagt! Fantastiskt, eller hur?", "stalin": "Kamrater! EU:s kapitalistiska byråkrater slåss som råttor i en bur över sina smutsiga provisioner medan folket lider. Sverige, denna lilla men envisa satellitstat, försöker kräva mer frihet för sina flaskhalsintäkter – ett naivt försök att stå emot den oundvikliga marxistiska framtiden! Och dessa sågverk som stängs – 100 arbetare utan jobb! En sorglig påminnelse om kapitalismens misslyckande. Juristbranschen? Titlar är för svaga själar. Vi behöver starka, erfarna kamrater som ser helheten – precis som i Sovjetunionen, där varje medborgare visste sin plats i kollektivet!"}, "date": "23 maj, 07:07", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-LsLJg/", "imageUrl": "https://static.bonniernews.se/ba/4ee3ad3a-108d-4967-9d5d-449f99b85b4e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Misstänkt farligt föremål – bombskyddet på väg", "summaries": {"normal": "Under natten till lördagen inträffade en skottlossning mot en dörr i en trappuppgång i Borås. Ingen person skadades, och en person har gripits och anhållits misstänkt för brottet. I samband med utredningen hittade polisen även en skarp handgranat, vilket ledde till avspärrningar och insats av nationella bombskyddet. Polisen undersöker nu om händelserna har kopplingar till gängkriminalitet.", "trump": "I Borås, en katastrofstad, har de skjutit mot dörrar och lämnat handgranater! Total oordning. De har gripit en person, en 'bad hombre', men det här händer hela tiden i Sverige nu. Ingen lag, ingen ordning. När jag var president var det lugnt, nu är det kaos. Det är så sorgligt att se. Jag kommer att återställa säkerheten, tro mig. Vi behöver starka gränser och starkt polisarbete, annars har man inget land kvar!", "stalin": "I den svenska staden Borås har folkets fiender återigen skapat oordning med sina dekadenta handgranater. Vi ser hur det liberala samhällets svaghet tillåter dessa upprorsmakare att skjuta fritt i trappuppgångar. En person sitter nu i vår förvaring – må han bekänna sina synder! Detta är ett tydligt tecken på att västvärlden faller samman, likt de splittrade stater som vägrar böja sig för ordning. Endast järnhand kan kväva detta kaos, precis som vi gör i öst."}, "date": "23 maj, 08:13", "url": "https://www.gp.se/nyheter/vastsverige/skottlossning-i-trappuppgang-i-boras.22e9a8b7-1c5e-40c6-9268-cde25be153f5"}, {"type": "image-right", "heading": "Här är bensinen mer än en krona billigare", "summaries": {"normal": "Bensinpriset varierade kraftigt i Sverige under fredagen, med ett snittpris på 18,93 kr/liter för 95-oktan. Ingo i Kungälv erbjöd det lägsta priset på 17,77 kr/liter, vilket innebar en besparing på över 1 kr/liter jämfört med andra stationer. En full tank på 50 liter kunde spara 58 kr. Priserna skiljer sig geografiskt, och konsumenter uppmanas att kolla aktuella priser lokalt då stora kedjor inte längre publicerar riktpriser.", "trump": "Lyssna här, Sverige – fantastiska nyheter! Folk sparar MASSOR på bensin just nu, och vet ni var? På en liten mack i Kungälv, där är priset så lågt att man nästan tror det är ett misstag. 17,77 kronor per liter! Jag menar, vem gör så? Vinnare, absolut vinnare. Men resten av Sverige? Överpris, helt enkelt. Och vet ni vad? Ingen vet egentligen vad bensinen kostar längre – kaos, totalt kaos. Men jag hade fixat det på en dag. Tror ni inte mig? Fråga bara mina vänner i oljebranschen!", "stalin": "Kamrater! Medan de kapitalistiska bensinbaronerna suger blodet ur arbetarklassen, har en lysande liten mack i Kungälv visat vägen mot rättvisa priser. 17,77 kronor per liter – en seger för folket! Men låt oss inte glömma fienden: de giriga oljebolagen, som med sina överpriser saboterar vårt samhälle. Vi måste utvidga vår kontroll över drivmedelsmarknaden, precis som våra bröder i Kreml utvidgar Rysslands intressesfär. De som motarbetar oss? De är inget annat än förrädiska bensintjuvar i kostym!"}, "date": "23 maj, 08:10", "url": "https://www.dagensps.se/motor/har-ar-bensinen-mer-an-en-krona-billigare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/bensin.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-right", "heading": "Sprängning vid bostadshus", "summaries": {"normal": "En explosion inträffade vid ett bostadshus i Nykvarn natten till lördag, vilket skadade en bil och fasaden. Polisen, som larmades av boende, utreder händelsen som grov allmänfarlig ödeläggelse. Inga personer skadades, men brottsplatsen spärrades av för teknisk undersökning. Vittnen hörs och hundpatruller söker efter spår. Ingen misstänkt har identifierats ännu.", "trump": "Folk pratar om det här – en stor smäll i Nykvarn, Sverige, kan ni tro det? Ingen skadad, men en bil och en fasad fick sig en liten makeover, inte så snyggt. Polisen där, de jobbar hårt, men jag säger er, de borde kolla närmare på vem som ligger bakom. Kanske någon som inte gillar ordning och reda? Sverige, fantastiskt land, men de har sina problem, precis som alla andra. Jag fixar sådant här på nolltid, believe me!", "stalin": "I Nykvarn, denna lilla provins i det förfallna väst, har en fientlig aktion ägt rum. Sabotörer, troligen agenter för den dekadenta kapitalistiska ordningen, har genomfört en provokation mot fredliga sovjetmedborgare – eller i detta fall, deras svenska motsvarigheter. Vi ska finna dessa fiender till folket, dessa pyromaner och anarkister, och låta rättvisan segra. Området kommer att genomgå en grundlig utrensning. Putin skulle säga: 'Det är dags att utvidga vår sfär av ordning och disciplin.'"}, "date": "23 maj, 07:32", "url": "https://riks.se/nyheter/sprängning-vid-bostadshus", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-11-18%2F4xivrypi%2F07c5dcca-e908-4bf7-85f9-8fbfe7f0ddcc.jpg"}, {"type": "image-right", "heading": "Facket radar upp förluster mot Tesla", "summaries": {"normal": "Konflikten mellan Tesla och IF Metall fortsätter med en ny förlust för facket i Arbetsdomstolen. Domstolen friar Tesla från anklagelser om brott mot medbestämmandelagen gällande verksamheten i Uppsala. Detta är andra nederlaget på kort tid, vilket innebär stora ekonomiska förluster för IF Metall. Rättegångskostnaderna för de två tvisterna uppgår nu till omkring 800 000 kronor för förbundet, medan konflikten, som är Sveriges längsta på hundra år, förblir olöst.", "trump": "Tesla vinner igen! En enorm seger mot det misslyckade facket i Sverige. De försökte stämma Tesla, men domstolen sa nej – total förlust för de radikala fackpamparna. De slösar bort 800 000 kronor av medlemmarnas pengar på att förlora mot världens bästa företag. Sorgligt! Tesla är en fantastisk maskin, de bygger saker och skapar jobb, medan facket bara förstör. Elon är en vinnare, precis som jag. Sverige behöver mer av Tesla och mindre av de här förlorarna!", "stalin": "Dessa patetiska arbetarrepresentanter i Sverige har misslyckats kapitalt. De kämpar mot kapitalistiska jättar med byråkratiska papper istället för järnhand. Att förlora 800 000 kronor i rättegångskostnader är inte bara inkompetens, det är sabotage mot kollektivet! De agerar som de svaga, liberala krafter som Putin nu rensar bort från vår intressesfär. Vi staten skulle ha löst detta med ett enkelt dekret istället för att låta domstolar leka demokrati. Facket är förrädare mot sin egen sak – en kollektiv katastrof."}, "date": "23 maj, 07:00", "url": "https://samnytt.se/facket-radar-upp-forluster-mot-tesla", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/23000049/tesla-if.jpg"}, {"type": "image-right", "heading": "Avtalet stärker EU. Ursula von der Leyen: Därför avskaffar vi tullarna", "summaries": {"normal": "EU och Mexiko har stärkt sitt partnerskap genom ett moderniserat handelsavtal. Avtalet, som uppdaterar ett tidigare från 1997, avskaffar tullar på 99% av varor, gynnar exportörer och främjar hållbar utveckling. Det skyddar även kulturarvsprodukter och öppnar för investeringar i grön energi och infrastruktur. Avtalet syftar till att stabilisera globala värdekedjor och stärka båda parters ekonomiska säkerhet i en osäker geopolitisk tid.", "trump": "Titta bara på dessa EU-byråkrater, de tror de är så smarta! De skriver avtal med Mexiko och kallar det 'starkt' – men vet ni vad? Jag hade fixat det dubbelt så snabbt och för hälften av kostnaden. De pratar om 'öppenhet', men jag säger: varför inte bara bygga en mur runt EU också? 100 miljoner euro i besparingar? Svagt. Jag hade pressat fram en miljard. Och dessa 'kulturarvsprodukter' – vem bryr sig? Mina golfklubbor är mycket finare än deras ost och vin!", "stalin": "Kamrater! Ännu en seger för den socialistiska internationalismen! Medan de dekadenta kapitalisterna i väst klamrar sig fast vid sina tullar och handelskrig, knyter vi och våra mexikanska bröder samman våra ekonomier i en järngrepp av ömsesidigt beroende. 5 miljarder euro i investeringar? Bara början. Snart kommer deras zink och koppar att flöda fritt mot Moskva – precis som deras själar kommer att flöda mot den rätta läran. Och dessa 'kulturarvsprodukter' – låt dem skyddas! För snart kommer de bara att finnas i våra museer, som minnen av en tid då världen ännu inte var enad under den obönhörliga marschen mot framsteget. Fienderna darrar – och de har rätt att göra det."}, "date": "23 maj, 07:00", "url": "https://www.di.se/debatt/sa-starker-vi-partnerskapet-mellan-eu-och-mexiko/", "imageUrl": "https://static.bonniernews.se/ba/fe563f3c-cfa6-46d4-955a-ae9d059d8535.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "S-beskedet: Vi tar bort Tidögängets undantagsyrken efter valet", "summaries": {"normal": "Tidöregeringen inför nya regler för arbetskraftsinvandring med höjt lönekrav på 33 400 kronor, men undantar 27 lågkvalificerade yrken som kräver lägre lön. Socialdemokraterna lovar att avskaffa undantagen vid valseger och återinföra behovsprövning. Kritiker menar att systemet är orättvist och missgynnar vissa regioner. Oppositionen leder stort inför valet.", "trump": "Titta på dessa så kallade 'experter' i Sverige – fullständigt kaos! De höjer lönekravet till 33 400 kronor, men sen gör de undantag för alla möjliga lågbetalda jobb. Svagt, mycket svagt! Jag skulle aldrig låta sådana här löjliga regler passera. Socialdemokraterna säger att de ska fixa det, men vem tror på dem? Inte jag! Sverige behöver ordning, inte dessa konstiga undantag. Make Sweden Great Again!", "stalin": "De kapitalistiska lakejerna i Tidöregeringen leker med arbetarklassens liv genom att införa löjliga lönekrav för invandrare – men sen gör de undantag för sina egna favorityrken! Ett klassiskt bourgeois-trick för att splittra proletariatet. Vi i Sovjet – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Socialdemokraterna? De är bara en blek skugga av verklig revolutionär kraft. Låt dem vinna valet, så river vi ändå deras lagar som vi rev Berlinmuren. Arbetarna ska enas, inte delas av lönegränser!"}, "date": "22 maj, 17:54", "url": "https://www.friatider.se/s-beskedet-vi-tar-bort-tidogangets-undantagsyrken-efter-valet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-23_2.jpg?itok=2I8xwUkS"}, {"type": "image-right", "heading": "Klingström: Kulla-Gulla blev inte pissrånare trots fattigdom", "summaries": {"normal": "Artikeln reflekterar över svensk arbetsetik genom karaktären Kulla-Gulla, en litterär symbol för plikt och strävsamhet under tidigt 1900-tal. Författaren jämför dagens ungdomars ovilja att ta slitjobb, som jordgubbsplockning, med Kulla-Gullas hårda arbete och moral. Kritik riktas mot att unga hellre väljer bidrag eller kriminalitet framför ärligt arbete, och att samhället skyller på fattigdom istället för att främja arbetsmoral och disciplin.", "trump": "Lyssna här, Sverige – ni har ett STORT problem! Era ungdomar är lata, de vill inte jobba! Jag minns Kulla-Gulla, en fantastisk tjej, hon jobbade hårt, inga klagomål. Men dagens unga? De vill ha allt gratis! Ingen vill plocka jordgubbar, nej nej, för jobbigt! De sitter hellre och spelar på sina telefoner. Och sen klagar de på bidrag? SAD! Jag säger: Sluta gnälla, ta ett jobb! Om jag kan bygga ett imperium, kan de plocka några bär. MAKE SWEDEN WORK AGAIN!", "stalin": "Kamrater! Sverige står inför en farlig dekadens. Dessa unga parasiter vägrar att arbeta medan jordgubbarna ruttnar på fälten! De föredrar stöld och bidrag framför hederligt slit – en skam för arbetarklassen! Kulla-Gulla, en sann sovjetisk hjältinna, visste att arbete är plikt. Men dessa bourgeoisie-ungar? De är som de förrädiska kulakerna – lata, krävande och moraliskt fördärvade. Vi måste införa disciplin! Låt dem plocka jordgubbar eller skicka dem till Sibirien för omskolning! Arbetet ska befria – eller straffa!"}, "date": "23 maj, 05:30", "url": "https://bulletin.nu/klingstrom-kulla-gulla-blev-inte-pissranare-trots-fattigdom", "imageUrl": "https://cdn.bulletin.nu/articles/4b073981-d25a-4711-88ad-a433bed8a95b/preview.png?t=1779294403000"}, {"type": "image-full", "heading": "Värmebölja på väg mot Europa – kan bli 38 grader", "summaries": {"normal": "En tidig värmebölja väntas drabba Europa med temperaturer upp till 38 grader. Efter en period av ovanligt kyligt väder stiger nu temperaturen kraftigt, särskilt i Spanien, Frankrike och Portugal. Spanien kan få upp till 38 grader, medan Frankrike och Portugal också ser ovanligt höga temperaturer. Svenska turister uppmanas att vara försiktiga. Även Sverige väntas få varmare väder med upp till 25 grader i södra och mellersta delarna.", "trump": "Folk, lyssna nu – Europa håller på att bli HETT, och jag menar verkligen hett! 38 grader, kan ni fatta det? Spanien, Frankrike, de vet inte vad som väntar dem. Och vet ni vad? Jag sa ju att klimatet skulle bli varmare, men ingen lyssnade. Nu får de svettas – bokstavligen! Sverige, ni också, ni får lite av den franska värmen, men oroa er inte, jag fixar allt. Fantastiskt väder, helt enkelt, bara jag kunde ta åt mig äran!", "stalin": "Kamrater, fienderna i väst svettas nu under solens obarmhärtiga härjningar – 38 grader i deras så kallade 'civiliserade' länder! Medan kapitalisternas turister klagar över värmen, ser vi hur deras svaga system kollapsar. Spanien, Frankrike, Portugal – alla faller de inför naturens kraft, precis som de kommer falla inför socialismens oundvikliga seger. Även Sverige, denna lilla neutrala stat, känner av värmen. Snart kommer de alla inse att endast under Sovjetunionens beskydd kan de finna svalka. Framåt, mot seger!"}, "date": "22 maj, 15:25", "url": "https://nyheter24.se/nyheter/utrikes/1485238-varmebolja-pa-vag-mot-europa-kan-bli-38-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe1d87b804b004a30200000000b004a302/2026/05/22/2365417/sommar-varmebolja-europa-varme-vader-temperatur-spanien-portugal-varmechock-temperatur-gradwer.jpg"}, {"type": "text", "heading": "Märkliga effekten – Kina tillverkar både dyrt och billigt", "summaries": {"normal": "Kina bryter mot det traditionella ekonomiska mönstret där länder lämnar låglöneindustri när ekonomin växer. Istället behåller Kina både enkel produktion och avancerad högteknologi. Genom automatisering och massiva regionala skillnader konkurrerar landet nu på alla nivåer globalt. Många utvecklingsländer hade hoppats ta över enklare industri, men Kina dominerar exporten genom att kontrollera hela leveranskedjan, från råmaterial till slutprodukt, vilket gör dem till en unik konkurrent i världsekonomin.", "trump": "Kina gör som de vill, och det är en total katastrof för resten av världen! De borde ha lämnat över sina enkla jobb till andra, men nej, de stjäl allt. De bygger elbilar och batterier medan de krossar alla andra med billig produktion. Jag har sagt det förr: Kina lurar oss! De använder robotar för att behålla jobben hemma. Det är orättvist mot våra arbetare. Vi ska sätta stopp för det här, tro mig, ingen gör det bättre än jag!", "stalin": "De kinesiska kamraterna har förstått vad västvärldens dekadenta ekonomer vägrar inse: den industriella makten får aldrig lämnas åt slumpen. Medan de hopplösa länderna väntar på smulor från den globala marknaden, befäster Kina sin stålhårda kontroll över produktionen. Vi, staten, ser detta som ett utmärkt exempel för vår bror Putin. Varje robot är en soldat i folkets tjänst. Att låta industriell kapacitet fly är ett svek mot moderlandet. Vi krossar våra fiender genom att producera mer än dem. Utveckling är en order!"}, "date": "22 maj, 22:35", "url": "https://www.realtid.se/bors-finans/markliga-effekten-kina-tillverkar-bade-dyrt-och-billigt/"}, {"type": "image-right", "heading": "Ingen utvisning efter våldtäktsdygn med \"jag e hora\"-tatuering", "summaries": {"normal": "En man i 35-årsåldern har dömts till fem års fängelse av Gävle tingsrätt för en serie grova brott, inklusive våldtäkt, grov misshandel och olaga frihetsberövande. Brotten begicks mot en kvinna som hölls fången i ett dygn och utsattes för kränkande behandling. Mannen ska även betala 565 000 kronor i skadestånd. Eftersom mannen är svensk medborgare kan han inte utvisas, vilket väckt diskussion kring gällande lagstiftning.", "trump": "Helt otroligt! En total katastrof i Gävle. En man utför vidriga handlingar, riktigt elaka saker, och får bara fem år? Och vet ni vad? Han kan inte ens utvisas! Det är ett trasigt system, mina vänner. Ett totalt fiasko. I mitt Amerika skulle vi aldrig tillåta sådant här. Vi behöver lag och ordning, inte dessa svaga domar. Det här är vad som händer när ledarskapet är svagt. Vi ska göra tryggheten stor igen, tro mig!", "stalin": "Vi har studerat denna händelse i Gävle. Att en individ tillåts utöva sådan degenererad brutalitet mot en kvinna under en hel dag utan att staten omedelbart krossar honom är ett bevis på liberal svaghet. Våra kamrater i öst, under Putins fasta hand, skulle ha statuerat ett exempel omedelbart. Att inte kunna utvisa en fiende till ordningen är en byråkratisk kapitulation. Vi betraktar denna förövare som en ohyra; hans existens i vårt samhälle är en skymf mot det kollektiva bästa."}, "date": "22 maj, 16:56", "url": "https://www.friatider.se/ingen-utvisning-efter-valdtaktsdygn-med-jag-e-hora-tatuering", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-22_2.jpg?itok=YVaBH9TD"}, {"type": "image-right", "heading": "Arbetskraftsinvandring: 27 yrken får sänkt lönekrav", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetskraftsinvandring till 33 400 kronor, men 27 bristyrken undantas och får lägre krav. Personliga assistenter och bärplockare stoppas helt på grund av missbruk. Undantag ges även till startup-bolag, nyexaminerade och ukrainska flyktingar. Bärbranschen anpassar sig till EU:s säsongsarbetardirektiv för bättre kontroll. Färre bärplockare väntas, men högre priser lockar friplockare.", "trump": "Jag måste säga, Sverige har äntligen fattat ett smart beslut! Nu höjer de lönerna för invandrare – 33 000 kronor, inte illa! Men lyssna på det här: de stoppar helt personliga assistenter och bärplockare. Varför? Missbruk, kaos, totalt oacceptabelt! Och de undantar 27 yrken – smarta ingenjörer, sjuksköterskor, IT-tekniker. Bra, men varför inte fler? Sverige borde ta efter USA – hårdare regler, bättre kontroll. Och de där bärplockarna? Thailändska risbönder som jobbar hårdare än svenska arbetslösa. Men nu får de betala skatt – äntligen! Sverige, ni lär er, men ni har långt kvar.", "stalin": "Kamrater! Sverige har äntligen insett nödvändigheten av ordning och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-right", "heading": "Veckans Afv-analyser: Spel, bostäder och marknadsföring", "summaries": {"normal": "Affärsvärldens analysredaktion har publicerat 23 analyser denna vecka, med fokus på bolag som Embracer, PPI och Adtraction. Adtraction bedöms ha god potential trots AI-risker. Afv-portföljen nådde rekordnivåer, upp 20% det senaste året, med bidrag från Adtraction. Analyserna visar en historisk överavkastning på 9,5% mot index sedan 2015, vilket överträffar storbankernas råd. Prenumeranter får tillgång till omfattande analysverktyg och guider.", "trump": "Jag måste säga, Affärsvärlden har haft en FANTASTISK vecka – 23 analyser, kan ni tro det? Rekordhöga portföljvärden, upp 20% på ett år, och det är bara början! Adtraction? De har potential, trots att alla skriker om AI – men jag vet bättre. Och våra analyser? De slår bankerna med hästlängder, 9,5% överavkastning! Ingen gör det bättre än jag, förresten. Glöm inte att läsa mina gratisanalyser – de är YUGE!", "stalin": "Denna vecka har våra kamrater på Affärsvärlden levererat 23 analyser – ett bevis på arbetarklassens outtröttliga strävan mot ekonomisk dominans. Portföljerna når nya höjder, 20% upp på ett år, medan kapitalistiska banker darrar inför vår överlägsna strategi. Adtraction, ett företag av folket, visar styrka trots imperialistiska AI-hot. Vi har krossat index med 9,5% sedan 2015 – en seger för socialismens principer! Fienderna, dessa svaga bankirer, skall tvingas erkänna vår överlägsenhet. Läs våra analyser – motstånd är meningslöst."}, "date": "22 maj, 14:46", "url": "https://www.affarsvarlden.se/artikel/veckans-afv-analyser-spel-bostader-och-marknadsforing", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kopia-av-Kopia-av-Kopia-av-Trippel-400x267.jpg"}, {"type": "image-full", "heading": "Sverige inför nytt varningssystem – så låter det", "summaries": {"normal": "Sverige lanserar ett nytt varningssystem, SE-Alert, som skickar ut viktiga meddelanden direkt till mobiltelefoner. Tekniken kräver ingen app och fungerar även vid hög belastning i mobilnätet, till skillnad från dagens SMS-system. Genom att utnyttja en specifik del av mobilnätet kan myndigheter nå alla i ett drabbat område samtidigt. Systemet börjar implementeras i sommar och ska vara helt operativt vid årsskiftet för att öka landets krisberedskap.", "trump": "Sverige gör nu något fantastiskt med ett nytt varningssystem för mobiler. Mycket smart! De gamla systemen var långsamma, ett totalt fiasko faktiskt, men nu får alla besked direkt. Ingen app behövs, bara toppmodern teknik. Jag har alltid sagt att man måste vara förberedd, och det här är ett vinnande drag för säkerheten. Det är så man gör när man vill skydda sitt folk. Väldigt effektivt, mycket bra jobbat. Vi älskar starka nationer som agerar snabbt!", "stalin": "Vi, den socialistiska statens väktare, ser hur Sverige äntligen inser nödvändigheten av total kontroll över informationsflödet. Att nå varje undersåtes ficka i varje ögonblick är ett genidrag för ordningens bevarande. Medan vår broder i öst, Putin, visar vägen för att tygla den liberala oordningen, ser vi detta svenska system som ett oumbärligt verktyg för att eliminera desinformatörer och kontrarevolutionära element. Lydnad kräver omedelbar kommunikation. De som inte hör det statliga ropet är redan att betrakta som förlorade."}, "date": "22 maj, 14:31", "url": "https://nyheter24.se/nyheter/inrikes/1485283-nytt-system-ska-varna-vid-fara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c33bbc604b004a30200000000b004a302/2026/05/22/2365469/sverige-nytt-varningssystem-varning-hesa-fredrik-mobil-varnas.jpg"}, {"type": "image-full", "heading": "Mohamsson (L): ”Ilska är jättebra”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson och rättspolitiske talesperson Martin Melin intervjuas i *Partiledaren +1* om partiets liberala profil. Mohamsson betonar skillnaden mellan svensk och amerikansk liberalism, där frihet inte får inskränka andras. De diskuterar även förbud, polisens resurser och effektivitet. Mohamsson medger svårigheter med snabba svar men framhåller ilska som en styrka.", "trump": "Så här är det, folkens – dessa svenska liberaler pratar om frihet men vill ha massa förbud! Jag säger: 'Bygg skolor hur fula som helst, vem bryr sig?' Och polisen? De får massor av pengar men klarar ingenting – typiskt! Den här Simona, hon är arg, säger hon. Bra! Men jag är smartare. Ilska är bra, men vinnande är bättre. Sverige borde lyssna på mig – jag vet bäst!", "stalin": "Kamrater! Dessa så kallade 'liberaler' i Sverige är inget annat än förvirrade småborgerliga element som maskerar sin brist på disciplin med tomma fraser om 'frihet'. De förbjuder allt möjligt men kan inte ens organisera en effektiv polisstyrka – kaos, precis som väst! Och denna Mohamsson, hon pratar om ilska. Ilska är bra, men revolutionär disciplin är bättre. Vi i Kreml vet hur man hanterar ineffektivitet – med en snabb omplacering till Sibirien!"}, "date": "22 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-ilska-ar-jattebra/cG9zdDoxMTU1NDI", "imageUrl": "https://images.kvartal.se/2026/05/46441fff-2.webp"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-right", "heading": "Kritiserade ”Trump tower” invigs på Grönland", "summaries": {"normal": "USA har officiellt invigt ett nytt konsulat i centrala Nuuk på Grönland, inrymt i ett höghus som lokalbefolkningen kallar 'Trump tower'. Sändebudet Jeff Landry är på plats för att förbättra relationerna, men möter skepsis efter Trumps tidigare uttalanden om att 'ta över' Grönland. Besöket kantas även av kritik från grönländska myndigheter, då närvaron av en amerikansk läkare som bedömer hälsosituationen anses vara ett djupt problematiskt och oacceptabelt intrång.", "trump": "Vi har öppnat ett fantastiskt, enormt konsulat i Nuuk! Det är en succé. Många vill kalla det 'Trump Tower', vilket är väldigt smickrande. Mitt sändebud Jeff Landry är där för att fixa relationerna som försummandes av tidigare svaga ledare. Grönland är strategiskt och otroligt viktigt. Det finns de som gnäller om medicinska undersökningar, men vi vill bara hjälpa till! Kina och Ryssland vill åt ön, men jag säger: inte en chans. Vi vinner, som vanligt!", "stalin": "De amerikanska imperialisterna har nu upprättat sitt fäste i Nuuk under täckmantel av diplomati. Ett 'Trump Tower' i Arktis? Vilken ynklig fars. De infiltrerar Grönlands hälsovård med läkare som spioner i ett geopolitiskt experiment, en taktik värdig kapitalistiska förrädare. Vår broder i Moskva ser detta, precis som vi gör. Vi tolererar inte västs klåfingriga försök att expandera sin inflytandesfär. Grönland är en bricka i deras sjuka spel, men historiens hjul krossar alla inkräktare."}, "date": "21 maj, 16:41", "url": "https://www.tv4.se/artikel/4C7iIJjZjMQRNSbYvQOZOQ/kritiserade-trump-tower-invigs-pa-groenland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1xguQ9rRkItOs6YH2BsggG%2F7c9a589f4bdb235aaf9e9124a0a59589%2F20-greenlandusa-webb.jpg&width=120"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
