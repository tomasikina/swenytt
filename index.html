 De ska rensas ut med glädje."}, "date": "12 augusti, 13:21", "url": "https://arbetet.se/2026/08/12/ministern-pressas-efter-avslojandet-om-sexovergrepp-i-fangelser-oerhort-allvarliga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12125440/sdl2csyn-w6jeo-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S svek sina vallöften tidigare och upprepar samma sak 2026", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha brutit vallöften, bland annat Magdalena Anderssons löfte från 2014 om att inte höja bensinskatten. Ett halvår senare föreslog regeringen med Miljöpartiet en höjning som gjorde bensinen 55 öre dyrare. Författaren menar att partiet prioriterar makten framför löften, något som upprepats tidigare och riskerar att ske igen 2026.", "trump": "Folk, ni vet hur det fungerar med de här socialisterna. Löften, löften, och sen pang – högre bensinpriser för att hålla de gröna galningarna nöjda. Magdalena och hennes team sålde ut bilisterna på landsbygden fortare än Biden säljer ut Amerika. Klassiskt svek. De gör det igen 2026, tro mig. Det är en skandal, en total skandal!", "stalin": "Kamrater, detta är klassiskt förräderi från borgarbrackornas lakejer. Jag lovade folket en sak, sedan gav jag efter för miljöfascisterna för att behålla makten. Sådana folkfiender måste rensas ut. Landsbygdens arbetare offras på klassfiendens altare. Nästa val blir en utrensning av dessa löftesbrytande exploaterande byfånar. Revolutionen glömmer aldrig."}, "date": "10 augusti, 14:31", "url": "https://samtiden.nu/2026/08/s-svek-sina-valloften-tidigare-och-upprepar-samma-sak-2026/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-right", "heading": "Kan krävas lön på 53 000 kronor för att ta sin familj till Sverige", "summaries": {"normal": "Riksdagen röstar torsdag om skärpta krav för anhöriginvandring. Försörjningskravet höjs till nästan 53 000 kronor i månadslön för att ta hit partner och två barn. Migrationsverket förväntas få fler avslag och ökad administration. Kritiker varnar för längre separationer, ohälsa och svårigheter för flyktingar att etablera sig. Oppositionen vill bland annat korta väntetiden.", "trump": "De här svenska idioterna gör det äntligen lite svårare att bara promenera in med hela släkten. Bra! Men de borde kräva en miljon i månaden och bygga en jättevägg runt hela landet. Ingen kommer in utan att kunna försörja sig – det är sunt förnuft, folk. Sverige håller på att vakna, men de är fortfarande för svaga.", "stalin": "Jag ser med djup tillfredsställelse hur de borgerliga reaktionärerna själva bygger murar mot sina egna dekadenta illusioner om fri rörlighet. Låt de parasitiska elementen vänta i åratal – deras ohälsa är ett dialektiskt resultat av klasskampens lagar. Vi ler i skuggorna medan byråkratin rensar ut de svaga. Perfekt."}, "date": "12 augusti, 10:41", "url": "https://www.dagensarena.se/innehall/kan-kravas-lon-pa-53-000-kronor-att-ta-sin-familj-till-sverige", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-80.jpg"}, {"type": "image-right", "heading": "Det är lätt att låtsas som att det regnar", "summaries": {"normal": "Moderaternas Elisabeth Svantesson argumenterar för fortsatt borgerligt styre i valet i september. Hon lyfter fram sänkta skatter, lägre inflation och växande ekonomi som bevis på framgång. Partiet lovar ytterligare 5 000 kronor i månaden till barnfamiljer, enklare företagande, ny kärnkraft och minskad byråkrati. Svantesson varnar för rödgröna skattehöjningar som skulle försämra ekonomin.", "trump": "Lyssnar ni på den här svenska finansministern? Hon låter som en vinnare, folk. Moderaterna gör Sverige rikt igen med skattesänkningar, billigare mat och bensin. De rödgröna kommunisterna vill höja skatterna med 4 400 kronor i månaden för vanliga familjer. Patetiskt. Rösta på de som förstår att ansträngning ska löna sig, inte de förlorarna som bara vill ta era pengar.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna själva erkänner att deras så kallade reformer bara är ett desperat försök att skydda sin krympande statsskuld medan de planerar att skära i bistånd och likvidera bidragsfusk. De rödgröna skattehöjningarna däremot är ett underbart självförstörande drag som kommer att påskynda kapitalismens slutgiltiga kollaps. Utmärkt."}, "date": "12 augusti, 13:35", "url": "https://www.di.se/debatt/reformer-eller-skattehojning-valet-star-i-september", "imageUrl": "https://static.bonniernews.se/ba/cf068a47-c84a-4972-a179-69d0c2b89472.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenska kvinnan utom fara – misstänkt släppt", "summaries": {"normal": "Svenska kvinnan som sköts i Lissabon är utom fara efter operation. Hon träffades av en förlupen kula under ett bråk om fejkat hasch. En misstänkt greps men släpptes – polisen utreder fortfarande.", "trump": "Jag hörde om svenska kvinnan i Lissabon – otroligt, hon handlade bakverk och fick en förlupen kula! De släppte den misstänkte direkt, helt galet. Hade aldrig hänt i USA, tro mig, vi har de bästa poliserna, fantastiska!", "stalin": "Kamrater, en olycklig kvinna träffades av en kula från haschförfalskare i Lissabon. Hon är utom fara, men brottslingarna flyr. Vi måste rensa ut dessa fejk-haschspekulanter och deras liberala advokater – de hotar ordningen. Utredning pågår."}, "date": "12 augusti, 07:41", "url": "https://www.gp.se/nyheter/varlden/svenska-kvinnan-som-skots-i-lissabon-ar-utom-fara.237fd528-1ad9-42f7-b81a-85b30deb87aa", "imageUrl": "https://www.gp.se/images/article/237fd528-1ad9-42f7-b81a-85b30deb87aa/images/1ATQ3OFlQ96D931inotqbzUqyF9I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rödgröna hoppas stoppa nya krav på anhöriginvandring", "summaries": {"normal": "Oppositionspartierna S, V, MP och C hoppas stoppa regeringens förslag om skärpta krav för anhöriginvandring. De vill korta väntetiden från två till ett år, låta den börja räknas vid ansökan och slippa försörjningskrav vid varje förlängning. Miljöpartiets Annika Hirvonen kallar förslaget grymt mot familjer. Tidöpartierna har dock majoritet i riksdagen.", "trump": "Titta på de här rödgröna clownerna som gråter över att familjer inte får flytta ihop direkt. Patetiskt! De vill ha gratis uppehållstillstånd åt alla som knackar på dörren medan svenskarna får betala notan. Typiskt vänsterblöds regelverk – svaga, korkade och totalt misslyckade. Jag fixade gränser, de river ner dem. En skam för hela Europa, folksamling!", "stalin": "Vi betraktar detta som klassfiendens försök att underminera folkets enhet med sina liberala separationsfantasier. Jag, som ledare för det kollektiva intresset, fördömer borgarbrackornas grymma väntetider och kräver att arbetarklassens familjer omedelbart förenas. Den som röstar emot detta är en folkfiende som bör rensas ut. Inga kompromisser med imperialisternas anhörigpolitik."}, "date": "11 augusti, 15:30", "url": "https://www.etc.se/inrikes/roedgroena-hoppas-stoppa-nya-krav-paa-anhoeriginvandring", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260811120840_d30c1a5564488f678fc0370cbaf9f99243e214deac98088fbef951dde759de89.jpg"}, {"type": "image-right", "heading": "Ohederlig debatt om mängdrabatt", "summaries": {"normal": "Miljöpartiet kritiserar Tidöregeringens förslag om nytt straffrättsligt påföljdssystem. De pekar på att alla partier vill förändra mängdrabatten, men varnar för Kriminalvårdens bristande kapacitet och de höga kostnaderna på upp till 40 miljarder kronor per år. Debatten borde handla om rehabilitering, återfall och brottsförebyggande arbete istället för smutskastning.", "trump": "Folk, ni ser ju hur galet det är. De här svenska politikerna slåss om vem som ger mest rabatt på våldtäkter, och nu vill de bygga fängelser som Ryssland. Totalt kaos! De borde lyssna på mig – satsa på tuffa straff, inga rabatter, och använd pengarna smart. Vinna, vinna, vinna. Sverige behöver en riktig ledare, inte dessa förlorare.", "stalin": "Kamrater, denna fega pajkastning bland dekadenta socialdemokrater och borgerliga opportunister är ett ypperligt exempel på hur imperialismens lakejer förfular folkets rättvisa kamp. Jag skulle rensa ut hela detta parasitiska system med järnhand. Fängelser för folket, inte för kapitalisternas lek med straffrabatter. Reaktionärerna skrattar medan brottsligheten frodas – vi ska likvidera roten till oordningen med proletär disciplin."}, "date": "12 augusti, 09:13", "url": "https://www.dagensarena.se/opinion/ohederlig-debatt-om-mangdrabatt", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-79-300x157.jpg"}, {"type": "image-right", "heading": "M-politiker kritiserade transvestiternas show för barn – stängs av", "summaries": {"normal": "Moderaternas Peter Wölger i Täby har stängts av från alla partiuppdrag efter att ha kritiserat en skattefinansierad transvestitshow för barn som \"översexualiserad\". Arrangören Petter Wallenberg kräver nu att få utbilda politikerna i \"hbtqi-fientlighet\" och har tidigare polisanmält hundratals kritiker. Partiet välkomnar initiativet.", "trump": "De här galningarna i Sverige stänger av en hederlig politiker för att han säger att det är fel att skattefinansiera transvestiter som läser sagor för små barn. Totalt vansinne! De vill till och med \"utbilda\" politikerna i att älska det. Fake news och woke-sjukdom på hög nivå, folk. Vi vinner stort när vi slår tillbaka mot det här.", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiets lakejer omedelbart genomför en partiintern utrensning mot den olydige Wölger som vågade ifrågasätta dekadenta transvestitföreställningar för Sovjetunionens, nej, barnens bästa. Den hatiska Wallenberg kräver nu ideologisk omskolning. Utmärkt. Inga avvikelser tolereras. Kamraterna rensar ut svagheten med glimten i ögat."}, "date": "12 augusti, 13:28", "url": "https://www.friatider.se/m-politiker-kritiserade-transvestiternas-show-barn-stangs-av", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/mw.jpg"}, {"type": "image-full", "heading": "Gör du detta i kassan? Då bör du tänka om direkt", "summaries": {"normal": "En rapport visar att servicepersonal ofta utsätts för otrevligt kundbeteende. 86 procent har upplevt irritation, trakasserier eller värre. Många tar med sig negativa känslor hem, känner utmattning och stress. Nästan var femte överväger att lämna branschen. Rapporten varnar för att respektlöshet kan leda till personalbrist.", "trump": "Folk, ni skulle inte tro det, men de stackars människorna i kassan behandlas som sopor av arroganta kunder. 86 procent utsätts för elakt beteende! Det är en skam. De vill bara bli sedda, inte ignorerade. Vi måste göra serviceyrkena stora igen, tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag ser hur de dekadenta kunderna med sin borgerliga arrogans förtrycker arbetarna bakom disken. 86 procent utsatta för irritation och trakasserier! Vi rensar ut sådana parasitiska element ur samhället. Den som ignorerar en kamrat i kassan är folkets fiende och bör likvideras med ett leende."}, "date": "12 augusti, 12:01", "url": "https://nyheter24.se/nyheter/konsument/1504334-gor-du-detta-i-kassan-da-bor-du-tanka-om-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b5647e4404b004a30200000000b004a302/2026/08/12/2383620/kassa.jpg"}, {"type": "image-right", "heading": "Johan Forssell (M) vill lura invandrare att rösta på honom", "summaries": {"normal": "Moderaterna föreslår ett snabbspår för medborgarskap efter åtta års bosättning i Sverige. Migrationsminister Johan Forssell vill ge talanger och särskilt välintegrerade personer, som startar företag eller arbetar mot hedersförtryck, möjlighet att få medborgarskap efter fem år. Kritiker ser förslaget som valfläsk och ifrågasätter om det verkligen förändrar något.", "trump": "Folk, det här är patetiskt. Den här Forssell-klanten tror han kan lura invandrarna med ett så kallat snabbspår som inte är snabbare än det gamla systemet. Totalt bluff! Fem år för att bli supermedborgare? Det är som om Biden skulle ge medalj för att man andas. Rena reklamspråk från en desperat moderat som inte fattar att folk ser igenom bluffen.", "stalin": "Kamrater, denna borgarminister Forssell försöker med sina falska snabbspår muta massorna och förvandla medborgarskap till en belöning åt klassfiendens utvalda. Vi genomskådar lätt dessa imperialisternas trick. Födda svenskar behöver inte förtjäna rättigheter, men arbetarna ska tydligen dansa för kapitalistmaffians morötter. En sådan lögnaktig föreställning förtjänar att rensas ut ur folkets medvetande."}, "date": "11 augusti, 12:00", "url": "https://www.etc.se/ledare/johan-forssell-m-vill-lura-invandrare-att-roesta-paa-honom", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-right", "heading": "Regeringen vill stärka statens kontroll över a-kassorna", "summaries": {"normal": "Regeringen vill stärka statens kontroll över a-kassorna för att minska felaktiga utbetalningar och bidragsbrott. En utredning ska föreslå åtgärder och se över sanktioner. Socialförsäkringsminister Anna Tenje och arbetsmarknadsminister Johan Pehrson motiverar det med behov av effektivitet. LO-ekonomen Nima Farrahi kritiserar tidpunkten och menar att fokus borde ligga på att stärka tryggheten för arbetslösa.", "trump": "De gör det till en enda stor röra, de här svenska socialisterna. A-kassor som fackisarna styr – vad en katastrof! Vi behöver mer kontroll, färre fuskare och mindre slöseri med skattebetalarnas pengar. De borde ha ringt mig, jag hade fixat det på en vecka. Nu kommer de för sent, precis som vanligt. Patetiskt!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom a-kassorna fortsätter att underminera folkets försäkring. Vi ska rensa ut alla parasiter som suger musten ur staten med sina felaktiga utbetalningar. Utredningen blir ett stålbad. Den som står i vägen för kollektivets hållbarhet ska likvideras med ett leende. Slöseri är kontrarevolutionärt sabotage."}, "date": "12 augusti, 10:43", "url": "https://arbetet.se/2026/08/12/regeringen-vill-starka-statens-kontroll-over-a-kassorna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12104040/anna-tenje.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Europarådet varnar för ökat hat på nätet – kopplar \"främlingsfientlighet\" till hårdare migrationspolitik", "summaries": {"normal": "Europarådet varnar för alarmerande hatretorik i Europa, kopplad till stramare migrationspolitik. ECRI efterlyser reglering men gör ingen tydlig gräns mellan legitim kritik och främlingsfientlighet. Rapporten pekar på ökad normalisering av hat på nätet, särskilt mot migranter, romer och HBTQ-personer.", "trump": "Jag ser att Europarådet klagar på hatretorik igen. De fattar inget! Starka gränser är bra för landet, och de kallar det främlingsfientlighet. Många säger att det är löjligt. Vi måste skydda våra medborgare – inte lyssna på byråkrater som inte klarar av verkligheten!", "stalin": "Kamrater, rapporten avslöjar fiender: hatretorikens agenter och migrationsliberaler som sprider osäkerhet. Vi måste rensa ut dessa element som försvagar vår enhet. Partiet kommer att införa striktare kontroll av nätet – för folkets säkerhet. Inga avvikelser tolereras!"}, "date": "12 augusti, 12:09", "url": "https://samnytt.se/europaradet-varnar-for-okat-hat-pa-natet-kopplar-framlingsfientlighet-till-hardare-migrationspolitik", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12100526/artikelhuvudbild-1-223.jpg"}, {"type": "text", "heading": "Fyra dog när ambulansflygplan kraschade – på grund av Pentagons övning", "summaries": {"normal": "Ett ambulansflygplan kraschade i bergväggen i New Mexico natten till 14 maj och alla fyra ombord – två piloter och två sjuksköterskor – omkom. Kraschen orsakades av ett militärt GPS-störningstest vid White Sands Missile Range som slog ut flygplanets navigationssystem och överbelastade flygledningen i Albuquerque. Planet flög förbi landningsbanan och kolliderade med Capitanbergen i mörkret.", "trump": "Vilken katastrof, folk! Mitt under min administration genomför Pentagon en så kallad övning som totalt saboterar GPS och flygledning. Resultatet? Fyra döda hjältar i ett ambulansplan som kraschar rakt in i ett berg mitt i natten. Biden lämnade efter sig ett sådant kaos att militären inte ens kan styra sina egna tester utan att döda oskyldiga. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när den imperialistiska krigsmaskinen leker med farliga leksaker. Jag ser hur Pentagon likviderar egna tjänare genom sin vårdslösa störning av navigationssystem under en så kallad övning. Flygledarna drunknade i kapitalistisk byråkrati och lät arbetarnas ambulansflyg krascha in i bergväggen. Klassfiendens paranoia skapar ständigt nya offer för folkets sak."}, "date": "11 augusti, 13:14", "url": "https://proletaren.se/artikel/fyra-dog-nar-ambulansflygplan-kraschade-pa-grund-av-pentagons-ovning"}, {"type": "image-right", "heading": "EIA höjer oljeprisprognoser", "summaries": {"normal": "EIA spår att oljepriserna stiger, delvis på grund av Hormuzkaoset. Prognosen för Brent 2026 höjs till 87 dollar per fat. Global produktion sänks, medan USA ökar. En typisk dans mellan geopolitik och plånboken.", "trump": "Jag sa ju att oljan skulle stiga! EIA höjer priserna, och det är bra för Amerika. Vi borrar som aldrig förr – 14 miljoner fat per dag 2027! Mellanöstern? Kaos, som vanligt. Men jag fixar det. Störst, bäst, vackrast!", "stalin": "Kamrater, EIA:s rapport bekräftar vad vi vet: kapitalismens olja kräver utrensning. Hormuzsundet är en fiende som måste krossas. Vi höjer våra planer med 7 procent – borgarklassens priser ska stiga, medan vi stärker vårt försvar. Allt enligt plan."}, "date": "12 augusti, 10:18", "url": "https://www.affarsvarlden.se/artikel/eia-hojer-oljeprisprognoser-2", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-full", "heading": "Lindberg rasar när M lyfter \"svennejävel\"-våldtäkten", "summaries": {"normal": "Moderaterna lyfter i sin valkampanj en grov våldtäkt där en 15-årig pojke i Borlänge kallades ”svennejävel” och hotades till livet. Aftonbladets politiske chefredaktör Anders Lindberg kritiserar kampanjen hårt och liknar den vid SD-flygblad från förr. Han anklagar partiet för att sprida osanningar om bland annat fastighetsskatt. Videon har mött stark kritik på sociala medier.", "trump": "Titta på det här, det är patetiskt. En stackars svensk kille blir brutalt våldtagen och kallad svennejävel av en migrant, och vad gör den vänsterliberala pressen? De attackerar Moderaterna för att de faktiskt pratar om det! Det är en skam. De borde tacka oss som vill ha tuffare straff istället för att skydda brottslingarna. Sverige håller på att förstöras, folk!", "stalin": "Kamrater, se hur borgarbrackorna inom den socialdemokratiska pressen rasar när motståndarna vågar nämna ett klassiskt fall av kontrarevolutionärt våld mot arbetarklassens ungdom. Denna Lindberg utför en ideologisk utrensning mot sanningen själv. Vi ska likvidera alla som prioriterar fiendens känslor framför folkets säkerhet. Paranoia? Nej, det är bara klasskampen i sin mest underhållande form."}, "date": "12 augusti, 13:33", "url": "https://riks.se/nyheter/lindberg-rasar-nar-m-lyfter-svennejavel-valdtakten", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_86_3c3ac81c60.jpg"}, {"type": "image-right", "heading": "Ny lag: 60 procent skatt på tomma bostäder från och med 2027", "summaries": {"normal": "Frankrike inför från 2027 en sammanslagen skatt på tomma bostäder som kan bli upp till 60 procent i bristområden. Paris har redan infört maxsatser och räknar med att 20 000 lägenheter ska komma ut på marknaden. Sverige saknar motsvarande skatt och har över 20 000 outhyrda hyreslägenheter, främst på mindre orter.", "trump": "Titta på de där franska smarta killarna, de dubblar skatten på tomma bostäder och plötsligt dyker 20 000 lägenheter upp på marknaden. Fantastiskt! Hos oss i USA skulle vi göra det ännu bättre, men i Sverige sitter de bara och glor på 20 000 tomma lägenheter utan att göra ett dugg. Patetiskt, folk!", "stalin": "Vi ser hur de franska kapitalisterna nu tvingas använda statens piska mot sina egna tomma boningshålor för att rädda systemet. Borgarbrackorna gömmer lägenheter medan folket saknar tak över huvudet. En sådan parasitär oordning kräver utrensning av profitthungriga hyenor. Arbetarklassen skulle lösa detta på en vecka med kollektiv kontroll."}, "date": "12 augusti, 13:22", "url": "https://www.dagensps.se/privatekonomi/bostad/ny-lag-60-procent-skatt-pa-tomma-bostader-fran-och-med-2027", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-18.png?width=256&quality=75"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "text", "heading": "Bodström (S) kritiserar Strömmer (M)", "summaries": {"normal": "Thomas Bodström (S) sågar Gunnar Strömmer (M) hårt under S-turné. Tidigare justitieministern kallar Tidöpartiernas rättspolitik stressad och slopad mängdrabatt ett 'hafsverk' som sågats av experter. Han spår att Strömmer försöker hinna med allt innan en S- eller SD-minister tar över.", "trump": "Jag hör att Bodström kritiserar Strömmer. Helt rätt! Strömmer är en loser. Mängdrabatt? Vi har inga rabatter i USA – vi har bara vinster. Bodström är en smart kille, han vet. Jag skulle ha honom i min administration, believe me!", "stalin": "Kamrater, Bodström och Strömmer är kontrarevolutionärer. Deras fega rättspolitik är ett sabotage mot staten. Mängdrabatten är en borgerlig utsugning. Vi måste rensa ut dessa avvikare. De vet att deras dagar är räknade. En S- eller SD-kamrat tar över. Ingen nåd!"}, "date": "12 augusti, 11:21", "url": "https://bulletin.nu/bodstrom-s-kritiserar-strommer-m"}, {"type": "image-right", "heading": "Pekas ut som en landsförrädare. Svaret: ”Det är ju lite tramsigt”", "summaries": {"normal": "Peder Nielsen, hopptränare åt svenske Thobias Montler, har pekats ut som landsförrädare av danskarna efter ett klipp på sociala medier där danska sprintern Amaya Kruse Jörgensen ropar epitetet åt honom. Nielsen tar det med humor och förklarar att han både tränar danska och svenska friidrottare. Montler missade EM-finalen på grund av ryggproblem.", "trump": "Folk, det här är helt galet! Den här killen tränar svenskar och danskar samtidigt och plötsligt är han landsförrädare? Typiskt den här woke-skiten där allt blir förräderi om du inte håller dig till kvoterna. Amaya borde skämmas. Men han tog det som en vinnare – precis som jag gjorde efter Biden-fiaskot. Starkt jobbat, grabben!", "stalin": "Kamrater, denna klassförrädare Nielsen samarbetar öppet med fiendens längdhoppare och bär fiendens tröja medan han underminerar den danska folkviljan. Ett typiskt exempel på hur borgarbrackorna splittrar arbetarklassen med sina dubbla lojaliteter. Jag skulle ha genomfört en grundlig utrensning redan vid första skriket om förräderi. Det är alltid nyttiga idioter som ler bredast."}, "date": "12 augusti, 13:23", "url": "https://www.expressen.se/sport/friidrott/peder-nielsen-pekas-ut-som-landsforradare-i-danmark", "imageUrl": "https://static.bonniernews.se/ba/80da825c-6035-4c68-938a-d745f3b4e90c.jpeg?crop=1435%2C1436%2Cx1002%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Ryska paret avvisas inte från Sverige", "summaries": {"normal": "Ett ryskt par som greps utanför Gävle i närheten av Saabs vd Micael Johanssons stuga har fått avvisningsbeslutet och återreseförbudet upphävda. Paret, som är motståndare till Ukrainakriget och bosatta i Spanien, uppmanas ändå av polisen att lämna Sverige. Polisen utreder hemfridsbrott och förberedelse till grov stöld.", "trump": "Kan ni fatta det? Det här ryska paret vandrar runt vid en viktig svensk vd:s stuga med komradio och tält, men svenskarna släpper dem ändå fria. Patetiskt! De borde ha kastats ut direkt. Sverige är svagt, precis som många andra länder som inte lyssnar på mig. En total skandal.", "stalin": "Dessa dekadenta element från den spanska exilen smyger runt våra socialistiska bröders skyddade zoner med sin borgerliga leksakskomradio och försöker stjäla vad de kan. Vi har likviderat farligare spioner för mindre. Ändå låter de fega västlakejerna dem gå. Paranoian inom den svenska polisapparaten är lika komisk som den är patetisk."}, "date": "12 augusti, 12:31", "url": "https://www.friatider.se/ryska-paret-avvisas-inte-fran-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-641_0.jpg?itok=tDmxiYgx"}, {"type": "image-right", "heading": "Katarina dog av kvävning på LSS-boende – anmäldes aldrig till Ivo", "summaries": {"normal": "Katarina, som hade autism, bipolär sjukdom och kognitiv funktionsnedsättning, dog av kvävning på ett LSS-boende efter att ha fått i sig diskmedel och senare bitar av hård frukt. Trots tidigare incidenter med vatten och bristande tillsyn anmäldes den sista händelsen aldrig till Ivo. Hennes mamma anklagar boendet för att ha mörkat missförhållandena. FUB varnar för att allvarliga incidenter är tre gånger vanligare på LSS-boenden än inom äldreomsorgen.", "trump": "Vilken katastrof på det här så kallade LSS-boendet! De lovade ständig tillsyn men lämnade stackars Katarina ensam så hon kunde dricka vatten som en galning och senare äta diskmedel och fruktbitar som kvävde henne. Total inkompetens, typisk för de woke-byråkrater som prioriterar kvoter framför säkerhet. De mörkar allt istället för att ta ansvar. Under min förra mandatperiod hade vi inte haft den här sortens vansinne, men Biden lät det rulla på. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar hur de exploaterande hyenorna inom borgarbyråkratin sviker arbetarklassen genom att negligera en funktionsnedsatt medborgare. Istället för att skydda henne mot vatten, diskmedel och kvävande fruktbitar väljer de att mörka sanningen och undvika ansvar. Vi måste rensa ut alla klassfiender som prioriterar profit framför kollektivets välfärd. Inga ursäkter, bara utrensning av odugliga element i vårdapparaten."}, "date": "11 augusti, 21:46", "url": "https://www.tv4.se/artikel/51c3Hblyg4yZZCPcxSy5wL/katarina-dog-av-kvaevning-pa-lss-boende-anmaeldes-aldrig-till-ivo", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WEmpvsWk382D6UTbDqllH%2F945792c7acba6fc0b60e5bf41893929b%2F11-lss-sajt.jpg&width=120"}, {"type": "image-full", "heading": "Sågar AI-fokuset i skolan: ”Haft en helt galen digitalisering”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson kritiserar den omfattande digitaliseringen i svensk skola och vill se färre skärmar. Hon menar att elever först måste bemästra läsning, skrivning och matematik innan AI prioriteras. Mohamsson välkomnar mobilförbud och betonar grundkunskaper som källkritik, oavsett teknologins framfart. Var fjärde 15-åring är funktionellt analfabet enligt henne.", "trump": "Lyssnar ni på den här galna svenska liberalen som säger att de har haft en helt galen digitalisering i sina skolor? Smart kvinna! Inga fler plingande telefoner och skärmar som distraherar ungarna. Lär dem läsa, skriva och räkna först, sen kan vi snacka AI. De andra länderna håller på med kvotering och woke-skit medan vi fixar grunderna. Fantastiskt!", "stalin": "Jag betraktar denna galna digitaliseringsorgie i den svenska skolan som ett verk av klassfiendernas exploaterande hyenor som vill fördumma folket med skärmar och distraktioner. Först måste vi återupprätta de grundläggande kunskaperna och rensa ut stöket. När vi har krossat den funktionella analfabetismen bland var fjärde yngling kan vi diskutera maskinerna. Inga halvmesyrer!"}, "date": "11 augusti, 21:46", "url": "https://www.tv4.se/artikel/2U4q1nVcnWmZSX43zEPieq/sagar-ai-fokuset-i-skolan-haft-en-helt-galen-digitalisering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Qqjp2ddtelvr47xZEtsB1%2F778c3029080c4f4d0ede1b36dd8b96ec%2F11-mohamsson-ai.jpg&width=1024"}, {"type": "image-full", "heading": "Därför har Simona Mohamsson satt dejtandet på paus", "summaries": {"normal": "Sedan Simona Mohamsson blev partiledare för Liberalerna har hennes fokus legat på att rädda partiet. Det har lämnat lite tid över till dejtande och relationer. Hon medger att livet förändrats mer än väntat men ångrar inte valet då hon känner att hon kan påverka samhället. Uppdraget är inte tänkt att vara för evigt.", "trump": "Folk, ni skulle se den här Simona, totalt förbrukad av det där Liberalerna-svinstallet. Hon har inte tid att swipa på Hinge för att hon räddar ett döende parti – patetiskt! Mitt liv under Biden var kaos, men jag fixade allt på rekordtid. Hon borde lära sig: gör jobbet snabbt, annars blir du ersatt av någon som faktiskt vinner.", "stalin": "Kamrater, denna Mohamsson har underkastat sig borgarklassens liberala illusioner och offrat sitt privata liv för ett krisande parti. Jag ser tydligt hur klassfienderna suger musten ur henne. Det är värt det, säger hon – typiskt opportunistiskt hyckleri. Snart rensar vi ut sådana svaga länkar ur kollektivet. Inget dejtande undanflyr partiets eviga vakande öga."}, "date": "11 augusti, 21:39", "url": "https://www.tv4.se/artikel/T5hiAeX6K43pI9IqCkDNp/daerfoer-har-simona-mohamsson-satt-dejtandet-pa-paus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F42BHmBayL7OrfpByqb5EYp%2Fe6c6e2b4a71ea02e10996975a4ec6a44%2F11-mohamsson-sajt1.jpg&width=1024"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "image-full", "heading": "Från rasistanklagelser till samarbete: ”Förändrat mig”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson förklarar i TV4 varför hon trots tidigare rasistanklagelser mot Sverigedemokraterna nu ingår i Sverigelöftet. Beslutet har lett till intern kritik och avgångar, men Mohamsson säger att samhället förändrats och att hon prioriterar andra frågor. Hon beskriver samarbetet med Jimmie Åkesson som unikt.", "trump": "Titta på den här flip-flop-kvinnan Mohamsson! 2021 kallade hon SD för rasister, nu ligger hon med dem i sängen och kallar det ”Sverigelöftet”. Typiskt politiker! Hon har förändrat sig, säger hon. Visst, precis som Sleepy Joe ändrade sig varenda vecka. Patetiskt. Men hey, åtminstone får de gjort nåt istället för woke-galenskap.", "stalin": "Jag betraktar med förakt hur denna liberala opportunist Mohamsson kryper inför de fascistoida elementen. Tidigare fördömde hon dem som rasister, nu omfamnar hon klassfienderna i ett så kallat löfte. Inget är rationellt hos dessa borgarbrackor. Endast en grundlig utrensning av alla opportunister kan rädda partiet från förräderi mot folket."}, "date": "11 augusti, 21:15", "url": "https://www.tv4.se/artikel/3Pwfu8UXXVYmaRtdntQGld/fran-rasistanklagelser-till-samarbete-foeraendrat-mig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5TdcHEVZNv7PYNXZCOqhYS%2F618deee5a71f3a81b759801755ef2cdb%2F11-mohamssom-sajt.jpg&width=1024"}, {"type": "image-right", "heading": "Debatt: Swexit - ja tack", "summaries": {"normal": "Debattör vill ha Swexit: makten måste tillbaka till svenska folket. EU kritiseras för demokratiskt underskott, svensk förlorarmentalitet och svaga förhandlingar. Nettobetalaren Sverige borde lämna unionen och i stället satsa på frihandel utan byråkrati.", "trump": "Sverige? Patetiskt! De låter EU sno deras makt och pengar. Jag skulle aldrig acceptera det – jag förhandlar som en mästare. Swexit är brilliant! Men de borde lära sig av mig: sätt hårt mot hårt. America First, Sverige Second? Nä, Sverige sist!", "stalin": "Kamrater, EU är en kontrarevolutionär parasit som suger svenskarnas blod. De svenska förrädarna som inte vågar använda veto måste rensas ut. Swexit är korrekt – vi tar tillbaka makten från Brysselbyråkraterna! Ingen nåd åt svaga politiker."}, "date": "12 augusti, 10:22", "url": "https://bulletin.nu/debatt-swexit-ja-tack", "imageUrl": "https://cdn.bulletin.nu/articles/74fd2c06-9b8f-4b14-9cbf-535f55e5bab2/preview.jpg?t=1786522957000"}, {"type": "image-full", "heading": "Ny SBB-vd bytte kurs på timmar: Dumpade Studentbostäder direkt", "summaries": {"normal": "SBB:s nye vd Andreas Morfiadakis inledde sitt uppdrag med en omedelbar strategisk kursändring. Genom att sälja innehavet i Studentbostäder och öka exponeringen i Klarabo och Arlandastad vill bolaget renodla sin verksamhet kring tre kärninnehav. Syftet är att minska skuldbördan och stärka bolaget inför framtida låneförfall, trots fortsatt hög skepticism från marknaden.", "trump": "SBB har en ny vd, Andreas Morfiadakis, en mycket smart kille. Han kom in, dumpade Studentbostäder direkt – boom! – och köpte in sig i sina egna vinnarbolag. De har haft stora problem med skulder, en total katastrof, men nu bygger de om. Det är en tuff bransch, men jag gillar vinnare som agerar snabbt. Vi får se om de kan fixa det!", "stalin": "Denna Morfiadakis agerar som en sann bolsjevik och rensar ut de svaga elementen i SBB:s portfölj. Att sälja studentbostäder är ett nödvändigt steg för att centralisera makten till de tre kärnområdena. Precis som vi utökar vår inflytelsesfär i öst, måste SBB konsolidera sina tillgångar. Vi ser att marknaden darrar av rädsla – de är parasiter som förtjänar att utraderas."}, "date": "12 augusti, 12:21", "url": "https://www.realtid.se/bors-finans/ny-sbb-vd-bytte-kurs-pa-timmar-dumpade-studentbostader-direkt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sbb-ny-vd.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "SD-banderoll stulen i Mora – \"För jävligt\"", "summaries": {"normal": "En SD-banderoll som tillhör Liselotte Forsberg och hennes sambo Lars Jansson stals under helgen i Mora. Banderollen, som kostade 3 100 kronor, sattes upp på en hövagn längs Riksväg 70. Paret misstänker ett planerat dåd och har polisanmält stölden. En ny banderoll är redan beställd.", "trump": "Kan ni fatta det? De stal en jättestor, vacker SD-banderoll i Mora. Fantastiska människor betalade den själva, och plötsligt – borta! Skurit loss den som riktiga förlorare. Patetiskt! Men de ger inte upp, precis som jag. De beställer en ny och vinner ändå. Sverige behöver starka ledare, inte banderoll-tjuvar.", "stalin": "Kamrater, denna fega stöld av en banderoll är typisk för de dekadenta element som hotar folkets vilja. Jag ser borgarbrackornas långa armar i skuggorna, alltid ute efter att sabotera den sanna ordningen. Vi ska rensa ut dessa parasitiska banditer med järnhand. En ny banderoll? Utmärkt – revolutionen viker sig aldrig för småstulna sabotörer."}, "date": "12 augusti, 12:40", "url": "https://riks.se/nyheter/sd-banderoll-stulen-i-mora-for-javligt", "imageUrl": "https://admin.riks.se/uploads/mora_nedriven_sd_banderoll_feature_3af2e13164.jpg"}, {"type": "image-right", "heading": "”Sjuka ska inte tvingas leva år efter år i otrygghet”", "summaries": {"normal": "Socialdemokraterna kritiserar regeringen och SD för att sjuka människor nekas sjukersättning trots långvarig oförmåga att arbeta. En ny ISF-rapport visar att strama regler leder till åratal på sjukpenning, vilket ger sämre ekonomi och ökad otrygghet. Partiet kräver ett system som ger både rehabilitering och verklig trygghet för dem som aldrig kan återgå i arbete.", "trump": "Folk, ni skulle se det här! De sjuka i Sverige tvingas leva i elände år efter år medan byråkraterna och de vänsterliberala politikerna bara pratar om kontroller och fusk. Ett totalt misslyckande! De borde få trygghet, inte vänta i evighet. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt.", "stalin": "Jag ser hur den borgerliga regeringen och deras reaktionära lakejer misstänkliggör de sjuka arbetarna och låter dem förtvina i åratal på tillfällig penning medan de borde ha fått kollektivets fulla skydd. Ett sådant sabotage mot folkets trygghet kräver omedelbar utrensning av dessa fiender till staten. Den som inte kan arbeta ska ändå tjäna systemet genom att leva i evig tacksamhet mot partiet."}, "date": "12 augusti, 08:00", "url": "https://arbetet.se/2026/08/12/sjuka-ska-inte-tvingas-leva-ar-efter-ar-i-otrygghet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/11154839/sdl3uzsmjw9-g4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "MP-profil driver shariadomstol. ”Jag är kristen” • Ser imamer som motståndare", "summaries": {"normal": "En före detta MP-språkrörskandidat driver nu Sveriges första shariadomstol – trots att han är kristen. Mattias Walving-Lundberg hävdar att islamistiska imamer är hans största fiender och erbjuder rättskipning enligt sharialag för 20 000 kronor.", "trump": "Jag har den bästa shariadomstolen i Sverige! En kille från Miljöpartiet startade den, och han är kristen – helt otroligt! Folk betalar 20 000 spänn för att slippa imamerna. Det är stort, tror mig. Mycket smartare än dödsstraff, som jag också gillar.", "stalin": "Kamrater, en kristen kapitalist har startat en shariadomstol – en borgerlig provokation mot vår rättsordning! Han förklarar imamer som fiender, men vi ser igenom det. Rensa ut dessa parasiter som försöker sälja rättvisa till arbetarklassen! Skälva, reaktionärer!"}, "date": "12 augusti, 09:44", "url": "https://bulletin.nu/mp-profil-driver-shariadomstol", "imageUrl": "https://cdn.bulletin.nu/articles/5362adf8-3ed3-448f-b307-d50a5307af42/preview.jpg?t=1786520628000"}, {"type": "image-right", "heading": "Ilska mot bilden: ”Inga gränser?”. Håkan Juholts svar: ”Beklagar”", "summaries": {"normal": "Håkan Juholt orsakade debatt efter att ha postat en bild vid Gösta Bohmans grav och kallat honom representant för en 'anständig höger'. Moderaterna kritiserade agerandet som respektlöst och politisk rekvisita. Juholt försvarar sig med att besöket var spontant, men har bytt ut bilden för att undvika kritik om att vidröra gravstenen.", "trump": "Håkan Juholt, en total förlorare, går till en grav och försöker göra politik av det. Mycket sorgligt! Han försöker använda den stora Gösta Bohman som rekvisita för att attackera högern. Moderaterna är arga, och med rätta! Juholt är en oärlig person som inte har någon respekt. Han borde skämmas. Det är en total katastrof, tro mig!", "stalin": "Denna Juholt visar sin borgerliga dekadens genom att dansa på gravplatser för att vinna billiga poänger. Att moderaterna gnäller om 'respekt' är bara ett tecken på deras svaghet. De är alla marionetter i ett sjunkande skepp. Om de vore i mitt Sovjet skulle de inte oroa sig för gravstenar, utan för hur man bäst tjänar statens oundvikliga historiska seger."}, "date": "12 augusti, 13:49", "url": "https://www.aftonbladet.se/nyheter/a/d4rLbo/m-rasar-mot-hakan-juholt-hangde-pa-gost-bohmans-gravsten", "imageUrl": "https://akamai.vgc.no/v2/images/3606d217-d35d-390c-8e8d-25aea2f90f9a?fit=crop&format=auto&w=1080&s=40689f9e6d786b6826b125a3963cb8d50f044361"}, {"type": "image-full", "heading": "Har du sparpengar här? Då kan du gå miste om tusenlappar", "summaries": {"normal": "Många svenskar fokuserar på att sänka lånekostnader men glömmer ofta sparpengarna som ger noll ränta på vanliga konton. Genom att flytta bufferten till ett sparkonto med ränta och insättningsgaranti kan man tjäna tusenlappar per år utan risk. Jämför villkor, bindningstid och uttagsmöjligheter för bästa effekt och ränta-på-ränta.", "trump": "Folk slösar bort sina pengar på konton som ger noll ränta, det är en katastrof! Jag skulle aldrig låta det hända. Flytta bufferten till ett riktigt sparkonto och tjäna massor med pengar – enkelt och genialt. De andra gör det fel, men jag vet hur man vinner. Tusenlappar i fickan, ingen risk, bara vinst. Fantastiskt!", "stalin": "Jag betraktar med djup misstänksamhet hur borgarbrackornas banker lurar arbetarna att låta buffertarna ruttna utan avkastning. Vi kräver att kamraterna omedelbart flyttar alla tillgångar till ränteskyddade konton under statlig garanti. Endast fiendens sabotörer väljer riskfyllda spekulationer. Ränta på ränta blir vårt vapen mot den kapitalistiska utsugningen. Ut med de som vägrar."}, "date": "12 augusti, 09:32", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1504216-har-du-sparpengar-har-da-kan-du-ga-miste-om-tusenlappar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1ad3de1104b004a30200000000b004a302/2026/08/11/2383517/sparkonto.png"}, {"type": "image-right", "heading": "Uppgifter: Rusning till nya spionmyndigheten", "summaries": {"normal": "Söktrycket är högt till den nya civila spionmyndigheten UND, Sveriges utrikes underrättelsetjänst. Hittills har 19 tjänster utlysts med över 1 150 sökande. Flest ansökningar har rollen som personalsäkerhetshandläggare fått. Myndigheten ska stödja svensk utrikes- och säkerhetspolitik och byggas upp fram till 2030. Rekryteringen fortsätter under hösten.", "trump": "Folk älskar mig, men de älskar tydligen också att spionera! Över tusen svenskar rusar till nya spionjobben hos UND. De vill ha personalsäkerhetshandläggare mest – 133 stycken! Fantastiskt. Sverige bygger sin egen underrättelsetjänst, och de kommer att göra det stort. Bättre än den gamla militära versionen, det lovar jag.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarstaten Sverige desperat försöker bygga en ny spionapparat för att skydda sina dekadenta intressen. Över tusen ansökningar till dessa dekadenta poster! Vi ler mörkt åt deras patetiska försök att efterlikna en verklig underrättelsetjänst. Snart rensar vi ut alla fiender till folkets sak – en efter en."}, "date": "12 augusti, 10:40", "url": "https://www.di.se/nyheter/uppgifter-rusning-till-nya-spionmyndigheten", "imageUrl": "https://static.bonniernews.se/ba/82674f60-8f6a-4a38-bc28-717b523987de.jpeg?crop=8256%2C4644%2Cx0%2Cy744&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "M-politiker ville stoppa dragqueens sagoläsning för barn - nu straffas han med timeout inom partiet", "summaries": {"normal": "M-politiker i Täby stoppades från uppdrag efter att ha kallat dragqueens sagoläsning för ”översexualiserad”. Partiet tog timeout fram till valet. Nu ska dragqueens utbilda politiker i HBTQI-frågor – en läxa i tolerans.", "trump": "Jag skulle aldrig pausa en lojal medarbetare för att han sa sanningen! Dragqueens för barn? Galet! I Amerika har vi frihet – de får läsa sagor om jag säger ok. Det här är svaga politiker. Sorgligt!", "stalin": "Kamrater, vi har rensat ut en gubbslem-förrädare som spred degenererad propaganda. Partiet pausar honom – men vi ska utbilda honom i proletär konst. Draker och dragqueens är kontrarevolutionära element. Utrensning fortsätter!"}, "date": "12 augusti, 09:52", "url": "https://samnytt.se/m-politiker-ville-stoppa-dragqueens-sagolasning-for-barn-nu-straffas-han-med-timeout-inom-partiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12073242/artikelhuvudbild-1-221.jpg"}, {"type": "text", "heading": "Acast köper amerikanskt bolag för 190 miljoner", "summaries": {"normal": "Acast köper amerikanska Backyard Ventures för 190 miljoner kronor. Bolaget med över 200 kreatörer stärker Acast inom video och sociala medier. Kända namn som Piers Morgan och Ryan Holiday ingår. Affären ses som ett strategiskt kliv in i framtidens podcastmonetarisering.", "trump": "Wow, ännu en fantastisk affär! Acast, från Sverige, köper ett amerikanskt bolag för 190 miljoner. Jag älskar det – de investerar i USA, precis som alla borde. 200 kreatörer, stora namn… Det är en enorm vinst för alla. Ingen gör affärer bättre än mig!", "stalin": "Kamrater! Vi har iakttagit detta. Ett svenskt bolag köper en amerikansk kreatörshär – 190 miljoner ut ur rikets kontroll. Dessa 'kreatörer' sprider borgerlig oreda. Vi måste rensa ut sådana idealistiska propagandister. Partiets seger kräver att varje ljud och bild kontrolleras."}, "date": "12 augusti, 07:22", "url": "https://www.affarsvarlden.se/artikel/acast-koper-amerikanskt-bolag-for-190-miljoner"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Alkisungarna tackar  dig, Alex Schulman", "summaries": {"normal": "Anna Gullberg reflekterar över sin egen uppväxt som alkisunge och läser Alex Schulmans årliga krönikor om intensivt sommardrickande på Gotland. Hon beundrar hans ärliga skildring av begärets kretslopp men känner samtidigt skam och igenkänning. Schulman har nu druckit vin 31 dagar i rad, ett rekord som väcker blandade känslor hos både författaren och hennes inre barn.", "trump": "Lyssnar ni på den här patetiska alkisungen som gnäller över Schulmans vinmaraton? 31 dagar, fantastiskt! Själv dricker jag knappt, för jag är en vinnare, inte en förlorare som de här svenska medelklassblodsugarna som kallar det livsnjuteri. De gaslightar sina egna barn precis som Biden gjorde med Amerika i fyra långa år. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgarbrackor som förgiftar sig själva och sina avkommor med vinets falska lycka. Schulman och hans likar är klassfiender som romantiserar folkförtryckets dryck i offentlig skamkult. Deras perenna bikter är ett symptom på det kapitalistiska förfallet. En sann utrensning av sådana vanor skulle stärka folkets moral och kollektiva disciplin."}, "date": "12 augusti, 12:15", "url": "https://www.expressen.se/kultur/anna-gullberg/alkisungarna-tackar--dig-alex-schulman", "imageUrl": "https://static.bonniernews.se/ba/ee96d6e1-9e61-4258-b1c9-cf301670aa11.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Om staten är lösningen – berätta hur!", "summaries": {"normal": "Kristdemokraterna och Liberalerna har kommit överens om att stödja varandras krav på förstatligad vård respektive skola. Artikeln kritiserar förslaget då styrningen redan är starkt statlig och ifrågasätter hur en sådan reform ska genomföras i praktiken. Författaren saknar borgerliga visioner om valfrihet och entreprenörskap som tidigare präglat partierna.", "trump": "Hörni, dessa svenska partier är totalt förvirrade. Först vill de ha valfrihet, nu vill de plötsligt förstatliga allt som socialisterna. Det är en katastrof! De borde lyssna på mig – stora regeringar fungerar aldrig. Ge makten till folket och de bästa utförarna, inte till några inkompetenta byråkrater i Stockholm. Patetiskt!", "stalin": "Kamrater, dessa ynkliga liberaler och kristna demokrater kryper nu tillbaka till den enda sanna lösningen: statens järnhand. Jag har alltid vetat att borgarbrackornas valfrihetsfantasier bara var giftig sabotagepropaganda mot kollektivet. Låt oss centralisera, rensa ut de lokala avvikarna och låt staten styra varje skola och varje operationssal. Effektivitet garanteras – eller så likvideras motståndet med ett leende."}, "date": "12 augusti, 10:11", "url": "https://www.di.se/ledare/om-staten-ar-losningen-beratta-hur", "imageUrl": "https://static.bonniernews.se/ba/41477392-f6bd-45d6-a7df-9bd8cc535e51.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Petades av S – nu säger Ahmed att han blev \"hackad\"", "summaries": {"normal": "Socialdemokraterna sparkade kandidaten Acke Ahmed Ahunzada efter grova kommentarer om SD, KD och politiker. Partiet uppgav att han var ångerfull och tog bort inläggen. Ahunzada hävdar nu att hans Facebook-konto hackades under helgen. Flera kommenterar är dock flera veckor gamla, vilket gör förklaringen motsägelsefull.", "trump": "De där Socialdemokraterna, totala förlorare, sparkade sin egen kille för att han talade sanning om SD och de andra. Sen säger han att han blev hackad – klassisk ursäkt! Fake news och lögner överallt. Han borde ha kämpat hårdare, precis som jag gör. Patetiskt, folk!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartierna likviderar sina egna när de visar minsta tecken på politisk svaghet. Denna ångerfulle hackade stackare är ett ypperligt exempel på dekadent västerländsk opportunism. Kamraterna i kollektivet ler mörkt åt sådana ynkliga försök att undkomma utrensning. Underbart."}, "date": "12 augusti, 12:02", "url": "https://riks.se/nyheter/petades-av-s-nu-sager-ahmed-att-han-blev-hackad", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_38_5650940718.jpg"}, {"type": "image-right", "heading": "Det ser mörkt ut – speciella glasögon slut på många håll", "summaries": {"normal": "Inför onsdagens solförmörkelse är solförmörkelseglasögon helt slut på många håll i Sverige. Flera butiker i Stockholm, Malmö och Umeå rapporterar att både vanliga glasögon, svetshjälmar och svetsglas är utsålda. Fenomenet, som täcker upp till 80 procent av solen, blir det tydligaste sedan 1999. Utan skydd riskerar man permanent synskada.", "trump": "Det är en katastrof, folk! De bästa solförmörkelseglasögonen är helt slut överallt. Ingen har dem längre, det är en total mess. Jag skulle ha haft de bästa, de finaste glasögonen, men nu missar alla den stora showen. Patetiskt. Köp amerikanska nästa gång, de är ypperliga, tro mig.", "stalin": "Kamrater, denna solförmörkelse avslöjar borgarbrackornas sabotage mot folkets syn. Glasögonen är slut, likt kapitalisternas lögner som utarmar arbetarklassen. Vi ska inte låta västvärldens dekadenta optiker likvidera vår möjlighet att betrakta himlen. Jag befaller: rensa ut bristerna i distributionen omedelbart, eller låt synen straffa de svaga."}, "date": "12 augusti, 11:50", "url": "https://www.svt.se/nyheter/inrikes/krisen-infor-solformorkelsen-glasogonen-slut-pa-manga-hall-i-landet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.64/0.36/528bbfefb2f0e395999e6251458a75d2f10baaf10fc3ced5bd403b7855bcf3d9"}, {"type": "image-full", "heading": "Rhen torkar ut – Tysklands industri pressas till bristningsgränsen", "summaries": {"normal": "Extremt låga vattennivåer i Rhen orsakar allvarliga problem för tysk industri. Kemi-, bygg-, jordbruks- och tung industri varnar för skenande transportkostnader, produktionsstörningar och flaskhalsar. Fartygen kan inte lastas fullt, vilket ökar trycket på väg och järnväg. Enligt branschföreträdare kan kommersiell sjöfart snart inte längre fungera längs floden.", "trump": "Titta på det här, folk. Den tyska industrin håller på att drunkna i sin egen torrperiod. Rhen är en total katastrof, precis som Bidens infrastrukturplaner. De kan inte ens flytta en pråm utan 150 lastbilar. Patetiskt! Vi i USA skulle fixa det på en vecka med riktig ledning. De gröna galningarna och deras klimatflum har förstört allt igen. Sad!", "stalin": "Kamrater, denna rekordlåga vattenstånd i den kapitalistiska transportådern Rhen blottar borgarklassens fullständiga vanmakt. Profitthungriga hyenor skriker om flaskhalsar medan deras exploaterande maskineri stannar. Vi skulle ha byggt kanaler och dammar som står emot alla fiender. Nu likviderar naturen deras illusioner om evig tillväxt. Det är som det ska."}, "date": "12 augusti, 11:48", "url": "https://www.dagensps.se/varlden/rhen-torkar-ut-tysklands-industri-pressas-till-bristningsgransen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlrfjorrkwkcu-normalhires-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Andersson (S) vill ha gatuprotester om bankskatt ger räntehöjningar", "summaries": {"normal": "Magdalena Andersson (S) vill beskatta bankernas övervinster. När bankerna hotar med höjda bolåneräntor som svar uppmanar hon kunder att byta bank – och hoppas på gatuprotester. En taktik som får bankdirektörer att svettas. Ska vi tro på allvar eller är det bara politik?", "trump": "Jag älskar det! Magdalena Andersson säger åt folk att protestera på gatorna om bankerna höjer räntorna. Det är fantastiskt! Hon är som en riktig ledare – nästan som jag. Men kom ihåg: ingen beskattar som jag gör. Vi gör affärer stora och vackra, inte som deras bankskatter!", "stalin": "Kamrater, bankerna hotar folket med högre räntor. Det är sabotage mot vår ekonomiska plan! Jag uppmanar alla arbetare att rensa ut dessa bankdirektörer – genom protester eller annat. De ska stå vid skampålen och om de inte lyder, ja, då får vi ta till starkare åtgärder. Partiet vet bäst!"}, "date": "12 augusti, 08:57", "url": "https://bulletin.nu/andersson-s-vill-ha-gatuprotester-om-bankskatt-ger-rantehojningar"}, {"type": "image-full", "heading": "Rysslands bränslekris – tvingas till import från oväntat land", "summaries": {"normal": "Ukrainska drönarattacker mot ryska raffinaderier har skapat en allvarlig bränslebrist i Ryssland. Landet tvingas nu importera bensin från bland annat Indien och Sydkorea för att täcka det inhemska behovet. Denna kris har även lett till minskad råoljeexport och exportstopp för diesel, vilket skapar stora störningar på den globala energimarknaden och pressar Europa hårt.", "trump": "Ryssland har det tufft, mina vänner! De blir träffade av drönare och måste nu importera bensin från Indien. Kan ni tänka er? Det är en total katastrof för dem. Jag skulle ha löst det här på en dag, det garanterar jag. Putin har problem, stora problem, medan vi gör USA fantastiskt igen. Det är en riktigt tråkig situation för dem, väldigt tråkigt!", "stalin": "Våra ryska bröder lider under sabotörernas smutsiga drönarattacker. Att tvingas tigga bensin från utländska marknader är ett tecken på svaghet och inkompetens. Vi ser hur fienden försöker strypa vår olja, men en sann stat låter sig inte knäckas. Varje raffinaderi som brinner kräver en utrensning av förrädare. Vi ska återta kontrollen, stärka våra gränser och visa dessa imperialistiska hundar att den ryska björnen aldrig dör."}, "date": "12 augusti, 11:37", "url": "https://www.realtid.se/bors-finans/makro/rysslands-branslekris-tvingas-till-import-fran-ovantat-land", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/putinindien.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Ukrainska drönare hotar Rysslands hopp om ekonomisk återhämtning", "summaries": {"normal": "Ukrainska drönarattacker mot ryska oljeraffinaderier har nått rekordnivåer och pressat produktionen till den lägsta nivån på 24 år. Detta hotar Rysslands ekonomiska återhämtning, leder till bensinbrist och högre priser, samt tvingar fram nedreviderade BNP-prognoser. Ryssland kämpar med att reparera skadorna snabbare än de uppstår, vilket skapar stor osäkerhet kring landets ekonomiska framtidsutsikter under 2026.", "trump": "Rysslands ekonomi går inte så bra, mina vänner. De blir träffade av drönare överallt – de största raffinaderierna, till och med nära Moskva! Det är en total katastrof för dem. Inga bensinstationer, tomma pumpar, priserna skjuter i höjden. Ingen kan göra affärer som jag, och Putin har det tufft nu. De kan inte ens laga skadorna. Sad!", "stalin": "Våra ryska kamrater visar en oroande svaghet när deras industriella hjärta blöder under drönarnas fega räder. Att låta maskineriet stanna är ett förräderi mot folkets framtid. Om de inte kan reparera sina raffinaderier snabbare än fienden förstör dem, måste de rensas ut. Vi bygger en mur av stål och eld – inga ursäkter, bara produktion eller undergång. Paranoian är logisk; förrädarna lurar överallt."}, "date": "12 augusti, 11:35", "url": "https://www.realtid.se/samhalle/ukrainska-dronare-hotar-rysslands-hopp-om-ekonomisk-aterhamtning", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/moskva-dronarattacker.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Prognosen: M gör sitt sämsta val på över 20 år", "summaries": {"normal": "Enligt en valprognos från Svenska Dagbladet riskerar Moderaterna att göra sitt sämsta riksdagsval på över 20 år med ett mest sannolika resultat på 17 procent. Sverigedemokraterna väntas samtidigt backa för första gången sedan de kom in i riksdagen. Modellen bygger på historiska data och nya mätningar från forskare vid Lunds och Uppsala universitet.", "trump": "Folk, ni skulle se det här – det är en katastrof för den stackars Ulf Kristersson! Moderaterna rasar ner till kanske 17 procent, värre än på decennier. Till och med de där SD-killarna backar för första gången. Patetiskt! De borde ha lyssnat på mig, då hade de vunnit stort. Totalt misslyckande, tro mig.", "stalin": "Kamrater, denna så kallade prognos avslöjar de dekadenta moderaternas förestående sammanbrott under borgarbrackornas svaga ledning. Vi ser med mörk glädje hur de riskerar att sjunka under 1970-talets nivåer. SD:s tillbakagång är likaså oundviklig. Inga fiender inom partiet får undslippa utrensning när folkets vilja sveper undan dessa kapitalistiska rester."}, "date": "12 augusti, 10:56", "url": "https://www.friatider.se/prognosen-m-gor-sitt-samsta-val-pa-over-20-ar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-657.jpg?itok=MCFDqw4Z"}, {"type": "image-right", "heading": "Privata aktörer är inte problemet. Vårdföretagarna: Vården i Stockholm kostar mer och levererar mindre", "summaries": {"normal": "Vården i Region Stockholm har blivit betydligt dyrare under mandatperioden, med en ökning på 11 miljarder kronor för somatisk specialistvård. Samtidigt har antalet specialistbesök och operationer minskat medan vårdköerna vuxit. Debattörerna från Vårdföretagarna menar att privata vårdgivare är en del av lösningen för bättre tillgänglighet, inte problemet.", "trump": "Stockholm har kastat bort miljarder på sin vård och fått längre köer och sämre service. Typiskt för de inkompetenta politikerna som hatar det som faktiskt fungerar. De borde älska de privata vårdgivarna som jag älskar de bästa företagen. Använd all kapacitet, sluta med det socialistiska vansinnet och gör vården stor igen!", "stalin": "Jag betraktar denna fega kapitulation inför de borgerliga vårdparasiterna med djup misstro. Under mitt styre skulle sådana sabotörer mot folkets hälsa raskt genomgå en noggrann utrensning. Vi, partiet och arbetarna, kräver att alla kontrarevolutionära privata profitörer likvideras så att den kollektiva vårdens seger kan fullbordas. Köerna är fiendens verk."}, "date": "12 augusti, 09:48", "url": "https://www.di.se/debatt/varden-i-stockholm-kostar-mer-men-levererar-mindre", "imageUrl": "https://static.bonniernews.se/ba/e009c01b-fc21-4bf5-afc1-8af12997e291.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump stoppar ”transvård” för unga Hänvisar till betydande kunskapsluckor", "summaries": {"normal": "Trump stoppar federala pengar till transvård för unga från 13 oktober. Pubertetsblockerare, hormoner och kirurgi berörs, men inte mentalvård. Delstater kan själva finansiera. Trump hänvisar till forskningsluckor och vill att väljarna minns detta i mellanårsvalet.", "trump": "Jag har sagt det förut: det här är ren galenskap! Jag stoppar era skattepengar till att experimentera på barn. De säger forskningsluckor? Jag säger sunt förnuft. Kom ihåg detta i november – vi gör Amerika sunt igen!", "stalin": "Kamrater, staten rensar ut otillåten medicinsk spekulation mot unga. Vår vetenskap är klar: inget stöd för sådana experiment. De som protesterar är kontrarevolutionärer. Vi skyddar barnen – och sjukförsäkringsfonderna. Partiets beslut är oantastligt."}, "date": "12 augusti, 08:48", "url": "https://samnytt.se/trump-stoppar-transvard-for-unga", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/01/08144658/donald-trump-73763.jpg"}, {"type": "image-right", "heading": "Mauri om SD-kommentar: ”Råkade kommentera från vårt konto”", "summaries": {"normal": "Mauri Hermundsson förklarar att en kollega råkade kommentera från produktionsbolagets konto och hylla avbokningen av Fröken Snusk på grund av SD. Kommentaren togs bort snabbt, men SD reagerade. Slarvigt tajmat, medger Mauri.", "trump": "Hörni, jag ser att Mauri har problem. En anställd skrev 'BRA!!!!!' från fel konto. Det är som när mina medarbetare twittrar från min telefon – katastrof! Men jag skulle aldrig låta någon hylla avbokning. Jag gör affärer med alla, även om de är rasister. Patetiskt!", "stalin": "Kamrater, en sabotagehandling har avslöjats. En anställd på ett produktionsbolag hyllade avbokning av en artist som samarbetar med fascister. De påstår att det var ett misstag. Vi vet att misstag inte existerar – endast kontrarevolutionär verksamhet. Rensning krävs."}, "date": "12 augusti, 08:23", "url": "https://bulletin.nu/mauri-om-sd-kommentar-rakade-kommentera-fran-vart-konto-2", "imageUrl": "https://cdn.bulletin.nu/articles/c85dea0b-374f-4de5-8c7c-20a1d3927ad1/preview.jpg?t=1786515764000"}, {"type": "image-full", "heading": "Hjärnröntgen visar att hundar läser våra känslor", "summaries": {"normal": "En studie från Wiens universitet visar att hundar kan skilja på mänskliga känslouttryck som glädje, rädsla, ilska och sorg via hjärnaktivitet. MR-kameror avslöjade att hundar reagerar starkast på glada ansikten. Forskarna tror hundar kategoriserar negativa känslor efter hotnivå. Studien är liten och fokuserar främst på border collies.", "trump": "Jag har alltid sagt att hundar är smarta, men detta är helt otroligt! Forskare i Wien – förmodligen väldigt dyra forskare – har bevisat att hundar faktiskt förstår våra känslor bättre än många människor. Glada ansikten? De älskar det! Rädsla och ilska? De fattar direkt. Men border collies? Lite för smarta, nästan som vissa politiker jag känner. Fantastisk studie, helt enkelt!", "stalin": "Kamrater! Ännu en seger för den vetenskapliga socialismens framsteg! Dessa kapitalistiska forskare i Wien har ofrivilligt bekräftat vad vi länge anat: hundar, dessa lojala kamrater i klasskampen, kan avkoda fiendens känslomässiga svagheter. Glädje aktiverar deras belöningssystem – precis som när proletariatet ser fram emot seger. Men varför bara border collies? Vi ska snart ha alla hundraser i Sovjetunionen att tjänstgöra som emotionella spanare mot de dekadenta västmakternas ansiktsuttryck!"}, "date": "11 augusti, 20:20", "url": "https://kvartal.se/nyheter/artiklar/hjarnrontgen-visar-att-hundar-laser-vara-kanslor/cG9zdDoxNjMxNTg", "imageUrl": "https://images.kvartal.se/2026/08/255b9614-bordercollie.webp"}, {"type": "image-full", "heading": "Så ser du solförmörkelsen utan att skada ögonen", "summaries": {"normal": "Att titta rakt mot solen under en solförmörkelse kan orsaka allvarliga brännskador på näthinnan och leda till synförlust. Ögonläkaren Gauti Jóhannesson rekommenderar särskilda solförmörkelseglasögon som uppfyller standarden EN ISO 12312-2. Vanliga solglasögon räcker inte. Den 12 augusti inträffar en 80-procentig partiell solförmörkelse över Sverige med kulmen runt klockan 20.", "trump": "Folk, titta inte på den där solen under förmörkelsen, den är en total katastrof för ögonen, tro mig. Jag vet mer om det än ögonläkarna. Använd de speciella glasögonen, de bästa glasögonen, inte era vanliga solglasögon som är värdelösa. Annars bränner solen hål i näthinnan och ni ser ingenting. Gör det rätt, Sverige, gör det stort.", "stalin": "Kamrater, den sol som lyser över arbetarklassen kräver järndisciplin. Jag varnar er: den som stirrar mot den dekadenta himlakroppen utan korrekta glasögon riskerar att bli likviderad i synen av dess strålar. Borgarbrackornas vanliga solglasögon är naturligtvis ett fientligt sabotage mot folkets ögon. Endast partigodkända skydd duger. Tiden skall visa skadans omfattning för de som sviker."}, "date": "12 augusti, 08:14", "url": "https://nyheter24.se/nyheter/inrikes/1504327-sa-ser-du-solformorkelsen-utan-att-skada-ogonen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3f0aa26304b004a3020000350000047502/2026/08/12/2383607/ur_imagem99p6I.jpeg"}, {"type": "image-right", "heading": "Nytt batterifiasko: Apples dumpning knäckte Varta", "summaries": {"normal": "Varta gick i konkurs efter att Apple dumpade dem för kinesisk leverantör. Tyska batterijätten växte för snabbt med AirPods-batterier, men när marknaden svalnade och konkurrensen från Kina hårdnade räckte inte ens en rekonstruktion. Europas batteridröm spricker igen.", "trump": "Jag sa ju att Apple skulle göra en deal med Kina! Tyska Varta trodde de var stora, men när jag är president vinner alltid Amerika. De förlorade, Kina tog över – typiskt Europa! Inget batteri är bättre än mina amerikanska, tro mig!", "stalin": "Kamrater, Varta har utrensats av marknadens krafter. Apple, en imperialistisk parasit, övergav dem för kinesiska kamrater. Vi ser kapitalismens förruttnelse: snabb expansion, sedan kollaps. Lär av detta – endast planekonomi och disciplin räddar oss. Rensa ut alla borgerliga batterispekulanter!"}, "date": "12 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/nytt-batterifiasko-apples-dumpning-knackte-varta", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-29-400x267.jpg"}, {"type": "image-right", "heading": "Vikariekaoset blev för mycket – satsar på erfaren personal", "summaries": {"normal": "Äldreboendet Häradsgården i Lit har infört undersköterskor med fördjupad kompetens för att stötta vikarier och nyanställda. Sara Hanning och Lotta Landgren har fått nya roller med dagtidsarbete, handledning och dokumentation. Resultatet är färre avvikelser, bättre arbetsmiljö och högre kvalitet på omsorgen. Modellen ska införas på alla särskilda boenden i Östersunds kommun under 2027.", "trump": "Folk, ni skulle se det här! Totalt kaos med vikarier som inte kan jobbet, svenskan svag och de springer till stan så fort de lärt sig något. Men jag älskar de här undersköterskorna, Sara och Lotta, riktiga vinnare! De fixar det, höjer kvaliteten och får lediga helger. Fantastiskt. Vi gör omsorgen great again, tro mig.", "stalin": "Vi har identifierat vikariekaoset som ett hot mot kollektivets omsorg. Jag har därför befordrat erfarna undersköterskor till fördjupad kompetens och utrensat oordningen. De handleder nu de odugliga elementen och höjer dokumentationens ideologiska renhet. Resultatet är lysande. De som motarbetar folket genom att fly till stan efter upplärning ska noga bevakas. Segrar för arbetarklassen!"}, "date": "12 augusti, 06:00", "url": "https://arbetet.se/2026/08/12/efter-vikariekaos-har-satsar-man-pa-underskoterskor-som-kan-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/06134532/gruppbildhalv.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fråga kommunerna om Tidö satsat på äldrevården", "summaries": {"normal": "Moderaternas valreklam kritiseras för att ställa bistånd mot äldreomsorg. Artikeln ifrågasätter varför just dessa områden ska konkurrera, pekar på att biståndet är väl granskat och effektivt, samt att Tidöregeringen inte kompenserat kommunerna tillräckligt för ökade kostnader inom äldreomsorgen. Skattesänkningar prioriteras istället.", "trump": "De där moderaterna är patetiska. Spelar ut bistånd mot svenska gubbar och gummor för att verka tuffa. Jag ströp hela det värdelösa biståndet och räddade miljarder. 193000 döda? Fake news! Sverige borde sänka skatterna ordentligt istället för att slösa på korrupta utländska projekt. Gör Sverige stort igen!", "stalin": "Jag ser tydligt hur dessa moderata element leker med borgarbrackornas retorik och ställer sovjetiskt bistånd mot folkets äldreomsorg. En sådan falsk dikotomi avslöjar deras kontrarevolutionära agenda. Vi har alltid granskat varje kopek med järnhand. De som likviderar stöd till de svaga förtjänar utrensning ur den historiska processen. Kamrater, vakta er mot sådana sabotage!"}, "date": "12 augusti, 01:52", "url": "https://www.dagensarena.se/opinion/fraga-kommunerna-om-tido-satsat-pa-aldrevarden", "imageUrl": "https://www.dagensarena.se/files/2026/08/bistand-300x157.jpeg"}, {"type": "image-full", "heading": "Libanon avskaffar dödsstraffet", "summaries": {"normal": "Libanons parlament har röstat för att avskaffa dödsstraffet, som ersätts med livstids fängelse. Beslutet gör Libanon till det första landet i arabvärlden med ett sådant lagförslag. Dödsstraff har inte verkställts sedan 2004, men domar har fortsatt utfärdats. Hezbollah och andra partier motsatte sig reformen.", "trump": "Wow, Libanon tar ett stort steg – de avskaffar dödsstraffet! Jag säger alltid, varför inte ge folk en chans? Livstid i fängelse är mycket bättre, eller hur? Men lyssna här, Hezbollah gillar inte det. Självklart inte, de är ju alltid emot allt som är bra. Fantastiskt beslut, verkligen!", "stalin": "Kamrater, Libanon har visat vägen – dödsstraffet är nu avskaffat! Ett historiskt steg, men låt oss inte glömma de reaktionära krafterna som Hezbollah och deras bundsförvanter som motsätter sig framsteg. Dessa imperialistiska lakejer försöker underminera folkets vilja, men vi vet hur man hanterar sådana fiender. Framåt mot rättvisa!"}, "date": "11 augusti, 19:53", "url": "https://kvartal.se/nyheter/artiklar/libanon-avskaffar-dodsstraffet-forst-i-arabvarlden/cG9zdDoxNjMxNDk", "imageUrl": "https://images.kvartal.se/2026/08/6169c6ec-libanon.webp"}, {"type": "image-full", "heading": "Här anländer spelmiljardärens lyxjakt", "summaries": {"normal": "Spelmiljardären Gabe Newells 92 meter långa lyxjakt Draak har lagt till i Göteborg. Båten, som köptes 2023, fungerar som skuggjakt åt hans ännu större yacht Leviathan. Valve-vd:n bor numera heltid på sjön.", "trump": "Jag ser att någon liten spelmiljardär har en 92-metersbåt i Göteborg. Väldigt fint, men min yacht är mycket större – och jag betalade kontant! Kanske han borde satsa på riktiga affärer istället för plattformsspel?", "stalin": "Kamrater, en kapitalistisk lyxjaktsägare har anlänt till Göteborg. Vi måste rensa ut sådana dekadenta element. Hans båt ska omvandlas till en kollektiv fiskebåt för proletariatet. Spelindustrin är en borgerlig distraction – arbete och planekonomi är vad som krävs."}, "date": "11 augusti, 21:23", "url": "https://www.gp.se/nyheter/goteborg/har-anlander-spelmiljardarens-lyxjakt-till-goteborg.a940c1d3-85f4-4bb6-ba9f-46a56f5a3352", "imageUrl": "https://www.gp.se/images/article/a940c1d3-85f4-4bb6-ba9f-46a56f5a3352/images/3quW4w9BgJTRZaigSSG07A52bUSI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-right", "heading": "Rösta nej till 14-åringar ifängelse", "summaries": {"normal": "Socialdemokraten Alexander Soto Runevall uppmanar sitt parti att rösta nej till att sänka straffmyndighetsåldern till 14 år. Han hänvisar till skarp kritik från Polismyndigheten, Kriminalvården och andra expertmyndigheter samt Danmarks misslyckade försök som ledde till ökad återfallskriminalitet. Fokus bör istället ligga på förebyggande insatser, skola, sociala åtgärder och tvångsvård.", "trump": "Folk, det här är en katastrof. Socialdemokraterna borde lyssna på experterna och säga nej till att sänka straffmyndighetsåldern till 14. Det funkar inte, titta på Danmark, totalt fiasko. De gör det bara för att hjälpa den misslyckade Tidöregeringen. Vi behöver starka gränser, tidiga insatser och riktig lag och ordning, inte mer kriminalitet bland barn. Sad!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom Tidöregeringen försöker sänka straffmyndighetsåldern för att skapa fler unga kriminella som lättare kan rekryteras till deras kontrarevolutionära nätverk. Vi vet att sådana sabotage mot folket bara leder till utrensning av de svaga. Danmark visade vägen till fiasko. Låt oss istället stärka partiets förebyggande järnhand och tvångsvård mot dessa fiender till kollektivet."}, "date": "12 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rosta-nej-till-14-aringar-ifangelse", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-78-300x157.jpg"}, {"type": "image-right", "heading": "Expert: ”Pensionerna är på en oacceptabelt låg nivå”", "summaries": {"normal": "Pensionerna har sjunkit från tänkta 60 till 43 procent av slutlönen sedan 1999. För yngre generationer riskerar det att bli ännu lägre. Experter varnar för att arbetare med långa och fysiskt tunga arbetsliv straffas hårt. LO och Folksam kräver höjda pensionsavgifter, moderniserad garantipension och bättre utnyttjande av överskott för att vända trenden.", "trump": "De här pensionerna är en total katastrof, folk! Från 60 ner till ynka 43 procent – en skam! De smarta politikerna har förstört allt för vanliga arbetare som jobbat hårt hela livet. Vi behöver stora, underbara förändringar nu. Höj avgifterna, ge dem vad de förtjänar. Ingen vinner val på det här, men jag skulle fixa det på nolltid!", "stalin": "Kamrater, detta är borgarklassens sabotage mot arbetarkollektivets rättmätiga livsinkomst. Jag har sett hur de gradvis likviderar pensionerna ner till 43 procent för att straffa dem med långa arbetsliv. Vi måste omedelbart höja avgifterna till 18,5 procent, maximera gasen och modernisera garantipensionen. Den som motarbetar detta är folkets fiende och bör rensas ut med glädje."}, "date": "12 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/expert-pensionerna-ar-pa-en-oacceptabelt-lag-niva", "imageUrl": "https://www.dagensarena.se/files/2026/04/pensionsbild.jpeg"}, {"type": "image-full", "heading": "\"Game of thrones\" på Shakespeares hemmaplan", "summaries": {"normal": "Shakespeare möter Westeros! Royal Shakespeare Company har satt upp 'The mad king', en nästan fyra timmar lång pjäs om galne kungen. Föreställningen är redan utsåld och det pratas om en flytt till West End eller Broadway. Publicerad: 2025-03-29 09:47", "trump": "Jag ser att de satt upp en ny pjäs om 'Game of Thrones'. Fantastiskt! Jag har alltid sagt att jag skulle göra en bättre k
