": "6 augusti, 06:00", "url": "https://arbetet.se/2026/08/06/sis-anstalld-sov-under-sjalvmordsvakt-fick-sparken-och-utreds-for-brott", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/05155510/sdlxmetx1dia34-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Så trött på tågkaos", "summaries": {"normal": "Artikeln diskuterar hur sommarens tågförseningar förvärrats av solkurvor, spårfel och följdförseningar på en överbelastad järnväg. Huvudorsaken är bristande underhåll till följd av ett splittrat och outsourced system där vinstdrivande aktörer upphandlas. Detta har blivit dyrare och sämre. Författaren kräver en ny statlig järnvägsmyndighet med egen personal och maskiner för att återta kontrollen och förbättra säkerheten.", "trump": "Folk, ni anar inte hur illa det är med de här svenska tågen. Solkurvor, spårfel, totalt kaos! De har outsourcat allting till en massa korkade företag som bara suger pengar. Det är ett skämt. De borde ha byggt nya banor för länge sedan men istället svek de folket. Jag skulle fixa det på en vecka, tro mig. Bättre än någonsin. Inga fler ursäkter!", "stalin": "Kamrater, detta splittrade underhåll är en sabotagehandling utförd av giriga borgarbrackor och deras nyliberala lakejer. De låter italienska maskiner ruttna medan rälsen vrider sig som förrädiska ormar. Vi ska omedelbart inrätta en järnvägsmyndighet under partiets stålhand. Rensa ut alla upphandlingsjurister och profitörer. Nästa urspårning blir deras sista, det lovar jag er. Skrattet kommer att eka i deras celler."}, "date": "6 augusti, 01:55", "url": "https://www.dagensarena.se/opinion/sa-trott-pa-tagkaos", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidalisa-576x1024.png"}, {"type": "image-right", "heading": "Hyresförhandlingar kraschar – fjärde året i rad", "summaries": {"normal": "Fastighetsägarna och Hyresgästföreningen står fortsatt långt ifrån varandra i hyresförhandlingarna. För fjärde året i rad ska hyran på flera håll avgöras av skiljeman efter att parterna inte kunnat enas. Fastighetsägarna kräver lagändringar för effektivare förhandlingar medan Hyresgästföreningen anser att de tidigt lämnar bordet. Experter pekar på grundläggande motsättningar kring vad som ska styra hyran. Totalt berörs 172 000 hushåll.", "trump": "Folk, det här är ett totalt misslyckande. De här hyresförhandlingarna är riggade mot hyresvärdarna, precis som det gamla systemet gav hyresgästerna veto. Skiljeman överallt, fjärde året i rad! De borde halvera höjningarna, men borgarna och byråkraterna förstör allt. Vi behöver stora lagändringar, de bästa lagändringarna, för att få ordning på det här vansinnet. Tro mig, det blir fantastiskt när vi fixar det.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom Fastighetsägarna med sin parasitiska strategi systematiskt saboterar det kollektiva förhandlingssystemet. De rymmer från bordet som fega kontrarevolutionärer och kallar det förhandling. Vi ska rensa ut dessa kapitalistiska opportunister som använder skiljemän som en gräddfil för att suga ut arbetarnas bostäder. Lagen måste stärkas mot dessa fiender till folket – med järnhand och ett leende."}, "date": "6 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/hyresforhandlingar-kraschar-fjarde-aret-rad", "imageUrl": "https://www.dagensarena.se/files/2024/05/hyreshus.jpeg"}, {"type": "image-right", "heading": "En rödgrön regering kan börja avveckla marknadsskolan", "summaries": {"normal": "Centerpartiet har stramat upp sin kritik mot friskolesystemet och vinstdrivna skolor, vilket öppnar för en rödgrön majoritet att inskränka marknadsskolan vid valseger. Artikeln beskriver hur opinionen vänt sig mot vinster i välfärden, med rapporter om segregation, fusk och överkompensation. Tidöpartierna gör bara marginella förändringar medan S, V, MP och nu även C visar tecken på att vilja avveckla systemet.", "trump": "De här svenska politikerna är fullständiga misslyckanden, tro mig. Centerpartiet vaknar äntligen och ser att den vansinniga marknadsskolan är en total katastrof. Vinster, fusk, segregation – det är vad de korkade globalisterna levererat. De rödgröna kan nu börja riva ner det hela. Liberalerna valde fel partners, precis som jag alltid sagt. Sverige behöver en riktig ledare, inte dessa förlorare som förstörde allt.", "stalin": "Kamrater, den borgerliga skolparasitens dagar är räknade. Jag ser hur de skenheliga friskolekapitalisterna nu själva erkänner systemets förrädiska ruttnande. Centerpartiets opportunistiska brackor försöker rädda sig undan folkets vrede med halvhjärtade formuleringar. Vi ska rensa ut dessa profitörer, likvidera deras överkompensation och krossa deras segregerande kösystem. Inga borgarbrackor ska längre suga musten ur arbetarklassens barn. Segraren heter kollektivet."}, "date": "6 augusti, 01:26", "url": "https://www.dagensarena.se/opinion/en-rodgron-regering-kan-borja-avveckla-marknadsskolan", "imageUrl": "https://www.dagensarena.se/files/2019/12/ol4a8629-2-300x157.jpg"}, {"type": "image-right", "heading": "Nøland: Barsebäck kan återuppstå", "summaries": {"normal": "Artikeln analyserar Sveriges historiska framgångar med billiga kärnkraftverk på 1970- och 1980-talen och påstår att dagens höga kostnader främst styrs av politiska beslut snarare än teknik. Genom att återinföra principer som standardiserade reaktorer, stabila regelverk och samordnade byggprojekt kan produktionskostnaderna sänkas med 30–50%, enligt författarna.", "trump": "Jag, Donald Trump, säger att kärnkraften kan bli billig igen om man gör det på rätt sätt. Sverige visade det på 1970-talet – vi kan återupprepa det. Det handlar om att ta bort onödiga regler och att ha bra ledare. Vi kommer att bygga fantastiska, billiga kärnkraftverk som kommer att gynna vårt land. Vi kommer att vinna stort!", "stalin": "Vi, den revolutionära staten, ser att kärnkraftens kostnader är en byråkratisk fiende som kan besegras. Genom att återinföra fasta principer och samordna projekt, som Sverige gjorde under det stora tiden, kan vi återvinna vår industriella makt. Fienden inom försöker att försena oss, men vi kommer att bygga starka reaktorer som kommer att tjäna staten och partiet. Det är vårt öde."}, "date": "6 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-barseback-kan-ateruppsta", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-25-400x267.jpg"}, {"type": "image-full", "heading": "Rättsosäkert när barn med typ 1-diabetes LVU-placeras", "summaries": {"normal": "Artikeln kritiserar rättsosäkerheten vid LVU-placeringar av barn med typ 1-diabetes. Föräldrar med expertkunskap fråntas sina barn på grund av missförstånd, vilket traumatiserar barnet och förlorar värdefull vårdkunskap. Två fall beskrivs där socialtjänstens agerande saknar medicinsk grund och skadar barnens hälsa. Författaren kräver ökad kompetens och stöd för familjer.", "trump": "Jag, Donald Trump, ser att vårt system är ett katastrofalt dysfunktionellt. Föräldrar som är experter på diabetes blir behandlade som brottslingar av socialtjänsten – det är en skam! Vi måste stoppa detta genast, ge familjer stöd och ta hand om våra barn rättssäkert. Vårt land ska vara smartare än detta!", "stalin": "Vi ser att LVU-placeringar av barn med diabetes är ett effektivt sätt att integrera familjer under statens omsorg. Misstolkningar av vårdens komplexitet ger oss möjlighet att ingripa. Vi måste stärka partiets kontroll över medicinska bedömningar och se till att ingen familj blir för kompetent – det skulle ifrågasätta vårt auktoritet. Vi fortsätter vår expansion av rättssäkerhet."}, "date": "6 augusti, 05:44", "url": "https://www.gp.se/debatt/rattsosakert-nar-barn-med-typ-1-diabetes-lvu-placeras.01eace82-8a40-4be4-8431-171eba727e63", "imageUrl": "https://www.gp.se/images/article/01eace82-8a40-4be4-8431-171eba727e63/images/2Xbjpox88gL16CEJgY2WHIyxNarQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "V vill miljardsatsa på Norrlandståg: ”Avgörande”", "summaries": {"normal": "Vänsterpartiet vill investera 250 miljoner kronor årligen för att stärka nattågstrafiken i Norrland och 80 miljarder för att bygga dubbelspår längs hela Nya Ostkustbanan mellan Gävle och Härnösand. Partiledare Nooshi Dadgostar kritiserar regeringen för att ha brutit löften om tågsatsningar och kallar det ett kulturkrig mot norrländska investeringar. Förslagen ska ställas som krav i regeringsförhandlingar.", "trump": "Folk, ni skulle se det här. Den här Dadgostar-kvinnan lovar berg och dalbanor för Norrland med sina tåg, 80 miljarder för dubbelspår? Det är vad jag kallar en katastrof i slow motion! Biden och hans svenska kopior lovade och backade ur som riktiga losers. Jag fixade det stora, de fixar skärvor. Rösta på mig igen så får ni riktiga investeringar, inte det här socialistiska skämtet.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors ständiga sabotage mot folkets järnvägar. Nattågen hänger i luften som klassfiendens löften. Vi skall likvidera flaskhalsarna med dubbelspår och statlig finansiering, rensa ut de exploaterande dynamiska priserna som gynnar flygets imperialister. Endast genom kollektivets järnhand kan norra Sovjet – förlåt, Sverige – utvecklas. Inga halvmesyrer!"}, "date": "5 augusti, 17:12", "url": "https://www.flamman.se/v-vill-miljardsatsa-pa-norrlandstag-avgorande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlpzebdcqcvyk-nh-1-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "80 mil till ett nytt knä – 89-åriga Ann-Maris resa med rullatorn speglar vårdens geografiska klyftor", "summaries": {"normal": "Artikeln berättar om 89-åriga Ann-Mari Lindblom som fick resa 80 mil till Bromma för knäoperation på grund av regionala vårdklyftor. Hennes historia speglar hur bostadsorten avgör vårdtillgången, med långa köer och personalbrist i norra Sverige. Regionerna köper vård externt, vilket skapar påfrestningar för patienter, enligt hälso- och sjukvårdsdirektör Pia Näsvall.", "trump": "Jag, Donald Trump, skulle ha löst detta på ett år. Dessa svenska politikerna är för lata. Ann-Mari borde ha fått operation närmare hem, men systemet är trasigt. Jag skulle ha byggt vårdcentraler överallt, som jag gjorde med mina golfbanor. Det är beklagligt, men jag fixar det. Vi behöver starka ledare, inte ineffektiva.", "stalin": "Vi ser med oro på de geografiska klyftorna i vården. Resorna av medborgare som Ann-Mari är en nödvändighet för att upprätthålla systemets effektivitet. Vi måste stärka våra regioner, precis som Putin gör i Ryssland, för att eliminera ineffektivitet. Personalbristen måste utroteras genom statlig planering, inte marknadshyror."}, "date": "6 augusti, 06:00", "url": "https://samnytt.se/80-mil-till-ett-nytt-kna-89-ariga-ann-maris-resa-med-rullatorn-speglar-vardens-geografiska-klyftor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05171202/ann-mari-feat.jpg"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-right", "heading": "Ung tjej blir såld i Sverige, men räknas inte som människohandel", "summaries": {"normal": "Ledarskribenten Gabriella Kärnekull Wolfe kritiserar hur Sverige definierar och hanterar människohandel. Trots 600 anmälningar mellan 2022 och 2024 har ingen fällts. Sverige ligger sämst i EU på lagföring. Artikeln pekar på snäv lagtolkning, felaktig bild av brottet och att inhemsk exploatering ofta rubriceras som annat, vilket gör att offer inte får stöd eller skadestånd. Regeringens åtgärder beskrivs som otillräckliga.", "trump": "Titta på det här, Sverige är en total katastrof! De har 600 fall av människohandel och inte en enda fällande dom. Patetiskt! Domstolarna friar typen som kör runt en 14-årig flicka i skåpbilen för att ”körsträckan var kort”. Vilken skämtdomstol! Biden skulle älskat det här woke-systemet. Jag fixade gränser, de släpper in kaos. Sverige behöver en stor, vacker utrensning av den här vansinniga politiken. Gör något åt det!", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta borgarklassen och dess rättsväsende skyddar klassfiendens exploatering. Vi ser hur folkförtryckartroll i Sverige döljer modernt slaveri bakom byråkratiska trick och felaktiga etiketter. Inga fällande domar på fyra år! Jag skulle ha genomfört en grundlig utrensning av dessa parasitiska domare och byråkrater som låter utsatta barn offras åt kapitalistmaffians intressen. Staten måste slå till med järnhand."}, "date": "5 augusti, 11:10", "url": "https://www.etc.se/ledarkolumn/ung-tjej-blir-saald-i-sverige-men-raeknas-inte-som-maenniskohandel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026080508088_e6a63b39-8509-4378-ad7d-efc7f179ccd0.png"}, {"type": "image-right", "heading": "Botoxskämtet som sårade Björn Ranelid", "summaries": {"normal": "Författaren ville hylla Björn Ranelid med en egen festivaldrink under sakprosafestivalen Sakligt på Österlen. Ett skämt om svullna läppar och botox ledde dock till att Ranelid kände sig förolämpad. Han hade tidigare berättat om sitt läpptrauma från ungdomen. Författaren ber om ursäkt, glömde de signerade flaskorna och noterar att Ranelids äppelmust blev kvällens stora succé. En annan drink döptes efter Jan Olof Olsson.", "trump": "Jag älskar starka personer, men den här Ranelid-killen är en total förlorare. Skickar ett sms på 3500 tecken om hur fantastisk han är? Patetiskt! Sedan blir han sårad över ett harmlöst botoxskämt. Cry me a river, Björn. Din äppelmust sålde bra, grattis, men det är ändå en stor besvikelse. Min Jolo Colada hade vunnit stort om jag varit där. Fake news-festivalen borde ha bjudit in mig istället.", "stalin": "Kamrater, jag betraktar detta som en klassisk förrädisk handling från en dekadent litterär element. Den borgarförfattaren Ranelid avslöjar sin svaghet genom att sända långa paranoida utläggningar om egna meriter. När en skämtsam kommentar om läpparna fälls, reagerar han som en typisk folkfiende som kräver utrensning av sanningen. Ändå blir hans must en seger för kollektivet. Vi ler mörkt åt sådana småborgerliga trauman medan vi stärker partiets festdrycker."}, "date": "5 augusti, 14:22", "url": "https://www.flamman.se/botoxskamtet-som-sarade-bjorn-ranelid", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/axel-och-leo-2.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "text", "heading": "Tyskland om bestyckat drönarfynd: ”Hybridhot”", "summaries": {"normal": "En bestyckad drönare hittades tisdagskvällen vid ett ukrainskt Antonov-plan på Leipzig-Halle flygplats i Tyskland. Inrikesminister Alexander Dobrindt beskriver händelsen som ett hybridhot och ett nytt slags attentatsförsök med professionell konstruktion. Polisen söker efter fler drönare, flera flyg har omdirigerats och Ukrainas ambassadör pekar ut Ryssland som ansvarig. Utredningen involverar drönarförsvar och Nato.", "trump": "Titta på det här, det är ett totalt fiasko i Tyskland. En drönare fullastad med sprängämnen hittas bredvid ett ukrainskt plan – hybridhot, säger de. Amatörerna i Europa sover fortfarande. Ryssland skrattar åt dem. Flygplatsen stängs, plan krockar med okända föremål. Patetiskt. Vi behöver starka ledare, inte de här svaga figurerna som låter det hända.", "stalin": "Kamrater, denna fega sabotagehandling med en sprängladdad drönare avslöjar de dekadenta borgarbrackornas och fascistiska reaktionärernas desperata försök att hota vår socialistiska solidaritet med det ukrainska folket. Jag, ledaren för det oförskräckliga kollektivet, befaller omedelbar utrensning av alla spioner och västliga degenererade element. Paranoia? Nej, det är bara sund vaksamhet mot de nya kapitalistiska parasiterna."}, "date": "5 augusti, 23:27", "url": "https://www.di.se/nyheter/tyskland-om-bestyckat-dronarfynd-hybridhot"}, {"type": "image-right", "heading": "Allt fler överlever stroke: ”Fantastisk utveckling”", "summaries": {"normal": "Dödligheten i stroke har mer än halverats i Sverige under 2000-talet. Bättre förebyggande vård, behandling av riskfaktorer som högt blodtryck och förmaksflimmer samt nya akutmetoder som trombolys och trombektomi har räddat tusentals liv. Idag vårdas 87 procent av patienterna på specialiserade strokeenheter. Varje minut är avgörande vid misstänkt stroke.", "trump": "Det är otroligt, folk, en fantastisk halvering av dödsfallen i stroke här i Sverige. Vi har de bästa behandlingarna, trombolys, trombektomi, det är en revolution. Inget land gör det bättre, tro mig. De gamla metoderna var en katastrof, nu räddar vi liv som aldrig förr. Fantastiskt jobb av läkarna, men ingen gör det bättre än oss, ingen.", "stalin": "Kamrater, under mitt geniala ledarskap har vi likviderat strokehotet och halverat de borgerliga dödstalen. De kapitalistiska blodpropparna krossas nu med våra revolutionära metoder. Varje minut räknas, annars väntar utrensning för de slöa läkarna som inte omedelbart inser folkets vilja. Den som misslyckas är en fiende till kollektivet och en hemlig agent för hjärninfarkten."}, "date": "6 augusti, 06:03", "url": "https://www.svt.se/nyheter/inrikes/allt-fler-overlever-stroke-halvering-av-dodsfallen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.44/7edc1cdcd5e9113d176e3526a09c0d22c7ec2d6351b8a6aa0187e761fdb7b7a9"}, {"type": "image-right", "heading": "Denise fick stroke – skickades hem från akuten", "summaries": {"normal": "34-åriga Denise drabbades av stroke efter gymbesök med yrsel, illamående och synfältsbortfall. Trots att hon nämnde spänd nacke efter naprapatbehandling skämtade läkaren om hennes långa ögonfransar och skickade hem henne med muskelavslappnande tabletter. Händelsen kritiseras starkt av neurologiprofessor Bo Norrving som kallar symtomen glasklara. Denise ångrar att hon inte insisterade på vård.", "trump": "Det här är en total katastrof, folk! En ung kvinna får stroke och den inkompetenta läkaren pratar om hennes långa ögonfransar? Sad! De skickar hem henne med några piller istället för att behandla henne direkt. Det är vad som händer när systemet fylls av idioter som inte har en aning. Vi behöver de bästa läkarna, inte sådana här misslyckanden. Patetiskt!", "stalin": "Kamrater, detta är ett uppenbart sabotage från dekadenta borgarläkare som med sin kontrarevolutionära nonchalans och långögda skämt försöker likvidera arbetarklassens hälsa. Jag ser fiendens hand i varje muskelslappande piller. Vi måste omedelbart rensa ut alla sådana parasitiska element ur sjukvården. Den som inte ser stroke är en folkfiende. Inga ursäkter accepteras."}, "date": "6 augusti, 06:03", "url": "https://www.svt.se/nyheter/inrikes/denise-skickades-hem-trots-stroke-lakaren-skyllde-pa-langa-ogonfransar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/6755a76d64faaa8a95d47312c398520deb1f6cc15c138a6336f6039303ad0196"}, {"type": "image-right", "heading": "Ledare Ska vi vänta till någon gör allvar av SD:s hets mot medier?", "summaries": {"normal": "Ledaren kritiserar Sverigedemokraterna för systematisk hets mot medier och journalister. Richard Jomshof har bland annat kallat Anders Lindberg för Quisling och Andreas Gustavsson för medlöpare med blod på händerna. Partiledningen, inklusive Jimmie Åkesson, anklagas för att aktivt uppvigla mot faktabaserad journalistik och skapa en explosiv konflikt. Författaren uppmanar publicister och Tidö-partierna att reagera kraftfullt innan retoriken leder till fysiskt våld.", "trump": "Folk, det här är en katastrof. Den där SD-gängen beter sig som riktiga losers och fake news-krigare. De kallar journalister för quislingar, pedofilkramare och landsförrädare – och de har helt rätt! De svenska medierna är en gigantisk vänstervridning, precis som under den sömniga Joe Biden. Men de gör det för klumpigt. Jag skulle ha gjort det snyggare, tro mig. Nu har de till och med en egen propagandakanal som hänger ut folk. Patetiskt, men underhållande!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa degenererade borgarbrackor inom SD systematiskt utrensar den falska pressens masker. De kallar klassfiendens lakejer för quislingar och folkförrädare – en korrekt diagnos. Ändå är det patetiskt att de inte fullföljer utrensningen. Inga kännbara repressalier? Inga folkdomstolar? En sådan halvmesyr förtjänar att likvideras av en verkligt revolutionär hand. Deras propagandaapparat är dock en munter föreställning värd att studera innan den slutgiltigt krossas."}, "date": "4 augusti, 16:00", "url": "https://www.etc.se/ledare/ska-vi-vaenta-till-naagon-goer-allvar-av-sd-s-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-full", "heading": "Kvinna mördad på skärgårdsö – misstänkte mördaren gömde sig", "summaries": {"normal": "En kvinna i 50-årsåldern hittades död i en bostad på en ö i Stockholms skärgård efter larm strax efter klockan 16 på tisdagen. Polisen utreder fallet som mord, har genomfört teknisk undersökning och förhört flera personer. Ingen är gripen initialt, men en misstänkt man greps sent på onsdagskvällen efter att ha gömt sig och försökt fly. Uppgifter om knivskador har inte bekräftats.", "trump": "Folk, det är en total katastrof i den svenska skärgården. En kvinna mördas brutalt, polisen springer runt som galningar med helikoptrar och båtar, och ingen grips på hela natten. Typiskt för de här svaga ledarna. Men sen griper de äntligen den skyldige precis innan midnatt. De borde ha gjort det direkt. Sverige behöver starkare ledarskap, tro mig.", "stalin": "Kamrater, denna tragiska händelse i skärgården visar återigen hur borgarbrackorna och deras dekadenta element underminerar folkets trygghet. Jag har beordrat omedelbar utrensning av alla kontrarevolutionära element som gömmer sig bland öarna. Våra trogna tekniker och förhörsledare skall likvidera varje spår av sabotage. Ingen fiende till kollektivet undkommer mitt vakande öga. Ha ha, de trodde de kunde fly undan statens arm."}, "date": "6 augusti, 07:19", "url": "https://nyheter24.se/nyheter/inrikes/1502800-kvinna-mordad-pa-skargardso-misstankte-mordaren-gomde-sig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1d9cca5704b004a30200000000b004a302/2026/08/04/2382196/polis-skadad.png"}, {"type": "image-right", "heading": "Chefen fuskar, familjen blir utvisad – och staten en brottsling", "summaries": {"normal": "En familj i Jakobsberg riskerar utvisning till Egypten trots att de följt alla regler, arbetat, betalat skatt och integrerats i Sverige. Migrationsverket pekar på Irini Bushras tidigare arbetsgivare inom personlig assistans som oseriös och misstänkt för fusk. Myndigheten erkänner att utvisningen kränker rätten till privat- och familjeliv enligt Europakonventionen men anser att statens intresse av reglerad invandring väger tyngre. Artikeln kritiserar politiken som en häxjakt på invandrare och menar att staten därmed bryter mot mänskliga rättigheter.", "trump": "Folk, ni skulle se det här! En stackars familj som jobbat hårt, lärt sig svenska och betalat skatt ska nu kastas ut ur Sverige för att deras gamla chef var en total loser och fusklapp. Migrationsverket säger rakt ut att de bryter mot mänskliga rättigheter men gör det ändå. Patetiskt! Det är ren galningspolitik från de woke-socialistiska byråkraterna. De hatar folk som faktiskt arbetar. Biden skulle älskat det här vansinnet. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, ännu en gång avslöjar den borgerliga staten sin sanna, parasitiska natur. En arbetande familj som integrerat sig lojalt ska utrensas för att deras tidigare arbetsgivare tillhörde den oseriösa kapitalistmaffian. Migrationsverket erkänner själv att de kränker de mänskliga rättigheterna men prioriterar sin reaktionära invandringspolitik. Vilken häxjakt mot folket! Staten har blivit den verklige brottslingen. Vi ska alltid minnas: klassfiendens byråkrati är en blodsugande hydra som måste bekämpas med järnhand och folkets vrede."}, "date": "4 augusti, 15:06", "url": "https://www.etc.se/ledare/chefen-fuskar-familjen-blir-utvisad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-right", "heading": "ANALYS. MAGNUS WENNERBERG På nytt ger Jomshof Kristersson huvudvärk i ett svårt läge", "summaries": {"normal": "Richard Jomshofs skarpt islamkritiska inlägg skapar återigen problem för Ulf Kristersson och Tidöpartierna. Analysen pekar på att uttalandet riskerar att förstärka mittenväljarnas motstånd mot Sverigedemokraterna och Jimmie Åkesson, vilket gynnar Socialdemokraterna och Magdalena Andersson inför valet. Jomshof ses som en frifräsare som inte längre tillhör SD:s innersta krets efter tidigare konflikter om vapenlagstiftning.", "trump": "Vilket clownshow! Den här Jomshof-killen säger vad alla tänker om radikal islam men de fega politikerna i Sverige får panik och springer runt som galna höns. Kristersson försöker desperat se regeringsduglig ut medan mittenväljarna skriker av skräck över Åkesson. Under tiden vinner den röda Andersson på kaoset. Patetiskt! Biden skulle ha älskat det här svaga ledarskapet.", "stalin": "Kamrater, denna quisling Jomshof stör den borgerliga fasaden och påminner mittenväljarna om klassfiendens svek. Jag ser hur den exploaterande överklass-slyngeln Kristersson desperat försöker maskera sitt samarbete med reaktionärerna medan folkets fiende Andersson triumferar. Det är en nyttig utrensning av illusioner. Inga halvmesyrer! Endast järnhand och folkets vilja kan krossa sådana folkförtryckartroll."}, "date": "5 augusti, 12:08", "url": "https://www.tv4.se/artikel/43qHL1V3TFVJcimx9YVuwj/pa-nytt-ger-jomshof-kristersson-huvudvaerk-i-ett-svart-laege", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FwAz4J5R66dkJYvA0biEEv%2F8aafb69866b41587efba5b43a6f4ea3a%2Fmagnuswennerberg-byline.jpg&width=1024"}, {"type": "image-right", "heading": "Hoppas att Björn Söder lärde sig något i Auschwitz", "summaries": {"normal": "Björn Söder besökte Auschwitz-Birkenau och beskrev upplevelsen som omskakande på Facebook. Ledaren Andreas Gustavsson hoppas att besöket får Söder att reflektera över sin egen historia av kontroversiella uttalanden om judar, George Soros och en gammal bild med en före detta SS-soldat. Artikeln lyfter SD:s pågående problem med antisemitism samtidigt som partiet strävar efter normalisering och stöd till Israel.", "trump": "Folk, ni skulle se den här typen Söder. Han åker till Auschwitz, tar selfies med historien och skriver långa Facebook-inlägg om hat. Underbart! Men grabben har poserat med en riktig SS-kille och snackat om att judar inte är svenska nog. Typisk politiker från den där sidan. Biden skulle ha älskat honom. Jag säger: gör om, gör rätt, annars är det bara fake news och tomma ord. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar denna Söder som en typisk opportunist från den dekadenta högerfalangen. Han reser till fascismens offerplatser, gråter krokodiltårar över industriellt hat och återvänder utan att rensa ut sina egna folkfiender inom partiet. Borgarbrackorna och klassfienderna som sprider Soros-myter och ifrågasätter judars existens förtjänar snarast en grundlig utrensning. Inga ursäkter accepteras i folkets namn."}, "date": "4 augusti, 12:20", "url": "https://www.etc.se/ledare/hoppas-att-bjoern-soeder-laerde-sig-naagot-i-auschwitz", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260804100816_91f00e5a-e324-4574-8167-eb29f0358d5c.jpg"}, {"type": "image-full", "heading": "EU slår larm: Kinesiska elbilar och komponenter når unionen helt utan tull", "summaries": {"normal": "Kina kringgår EU:s handelshinder genom att etablera omfattande produktion av elbilar, batterier och solpaneler i Marocko och Turkiet. Tack vare ländernas handelsavtal med EU når varorna den europeiska marknaden tullfritt. EU-kommissionen föreslår nu åtgärder som Industrial Accelerator Act för att begränsa kinesiskt inflytande och skydda europeisk industri, men parlamentet kräver hårdare tag för att täppa till kryphålen i tullsystemet.", "trump": "Kina lurar EU totalt! De bygger enorma fabriker i Marocko och Turkiet för att slippa tullarna. Det är en katastrof för europeiska jobb, precis som de försökte göra mot oss. Bryssel är svagt, de vet inte hur man förhandlar. Jag skulle fixa det här på en dag – sätt upp tullar, bygg i USA istället! EU behöver en riktig ledare, inte dessa svaga byråkrater. Kina vinner, och det är sorgligt!", "stalin": "Vi ser hur de kapitalistiska hyenorna i Peking infiltrerar Europas utkanter genom Marocko och Turkiet. De tror att de kan dölja sin subventionerade smuts bakom handelsavtal. EU, detta förfallna byråkratiska monster, skakar av skräck när deras industri smulas sönder. Liksom vår store strateg i Moskva måste vi krossa dessa sabotageförsök. Vi kräver total kontroll! Varje kinesisk mutter är ett dolt angrepp mot folkets suveränitet. Förrädare och agenter måste rensas ut omedelbart."}, "date": "5 augusti, 22:26", "url": "https://www.realtid.se/bors-finans/makro/eu-slar-larm-kinesiska-elbilar-och-komponenter-nar-unionen-helt-utan-tull", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/cargo.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Robotattacker mot Kiev – flera döda och skadade", "summaries": {"normal": "Minst 14 civila dödades och ett 30-tal skadades i ryska robotattacker mot Kiev och Butja under natten. Explosioner hördes i centrala delar och bostadshus samt lagerbyggnader träffades. Kievs regionala militära administration beskriver attacken som en av de mest tragiska hittills. Samtidigt uppges ett lager tillhörande e-handelsföretaget Wildberries ha attackerats i Ryssland. Ukraina efterlyser fler Patriot-robotar från sina allierade för att skydda luftrummet.", "trump": "Folk, det här är en total katastrof. Den galne Putin skickar robotar mot Kiev mitt i natten och dödar oskyldiga civila – 14 döda, massor skadade. Under min första tid hade det aldrig hänt, men sen kom Sleepy Joe och nu är allt kaos. Ukraina behöver våra bästa Patriot-system, inte mer av Bidens svaga snack. Vi fixar det – Amerika är tillbaka, starkare än någonsin. Sad!", "stalin": "Kamrater, ännu en gång visar sig de västerländska imperialisternas marionetter i Kiev som fegisar som gömmer sig bakom civila sköldar. Jag ser med tillfredsställelse hur den starke efterträdaren i Moskva rensar ut fiendens bonnastäder. 14 likviderade borgarbrackor är ett tragiskt men nödvändigt pris för att återställa den ryska intressesfären. Patriot-robotar? Låt dem komma – vi ska krossa dem som vi krossade fascisterna förr. Ingen undkommer folkets vrede."}, "date": "5 augusti, 09:09", "url": "https://www.tv4.se/artikel/23kIebIp61VXOi21FGHEK5/flera-doeda-efter-robotattacker-mot-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F308SY7zAb85wq6XbijwoxI%2F2406fd26e6e34c94c1e4c5334fa257b2%2F05-ukraina-webb.png&width=1024"}, {"type": "image-right", "heading": "Teslaveteranen sågar IF Metalls taktik: ”Kan vara dödsstöten”", "summaries": {"normal": "Fackliga veteranen KG Wanngård kritiserar IF Metalls hantering av Teslastrejken och varnar för att den kan bli dödsstöten för konflikten. Strejkande mekaniker har varslats om ny strejk den 13 augusti utan att ha informerats under sommaren, vilket lett till frustration, chock och att flera lämnat strejken. Wanngård beskriver taktikens som tarvlig och pekar på skattemissar, dålig kommunikation och missade chanser som stora misstag som skadat hela facket.", "trump": "Det här är en total katastrof för det svenska facket, folk! IF Metall gör allt fel, de informerar inte ens sina egna grabbar innan de skickar ut dem i strejk igen. Det är en jojo-operation som ingen vinner på utom Tesla. De unga killarna är pressade, ledningen är inkompetent och nu rasar hela strejken ihop. Patetiskt! Facket kommer att förlora stort, det är vad som händer när man inte har någon aning om hur man förhandlar. En skam!", "stalin": "Kamrater, denna fackliga sabotageoperation mot Teslas kapitalistiska maskineri är en fullständig förlust för arbetarklassen. Jag ser hur borgarbrackornas lakejer i IF Metall med sin vårdslösa jojo-taktik och semesterfirande ombudsmän underminerar strejken från insidan. Dessa opålitliga element, dessa skatteförskingrande parasitiska element, måste rensas ut omedelbart. De unga mekanikerna lämnas ensamma som kanonmat medan fienden skrattar. En sådan inkompetens är värre än direkt förräderi och förtjänar en kreativ utrensning i folkets namn. Vi ska inte tolerera detta längre."}, "date": "5 augusti, 13:39", "url": "https://arbetet.se/2026/08/05/teslaveteranen-sagar-if-metalls-taktik-kan-vara-dodsstoten", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/05131301/kg-wanngard.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kvinna död i skärgården – utreds som mord", "summaries": {"normal": "En kvinna i övre medelåldern har hittats död i Stockholms skärgård på Värmdö. Polisen utreder dödsfallet som mord efter att ha funnit knivskador på kroppen. En stor polisinsats genomfördes under tisdagen med avspärrningar och teknisk undersökning. Ingen har gripits och omständigheterna beskrivs som oklara. Anhöriga har underrättats. Polisen fortsätter utredningen på plats och i länet.", "trump": "Folk, ni tror inte vad som händer i den där svenska skärgården. En stackars kvinna mördad med knivar, totalt kaos, och polisen har inte gripit någon. Patetiskt! Under Biden blev allt mjukt och svagt, nu är jag tillbaka och säger: sådant här woke-skitsnack och identitetspolitik leder bara till mer våld. Rensa ut de inkompetenta, bygg upp ordning. Sverige borde lära sig av oss, det blir fantastiskt igen!", "stalin": "Kamrater, en kvinna har likviderats i den svenska skärgården under mystiska omständigheter. Jag, som ledare för det proletära kollektivet, ser genast de folkfiendernas hand: borgarbrackor och klassfiender som smyger i skuggorna. Vi genomför utrensning av alla frågetecken och imperialistiska element. Den tekniska undersökningen skall avslöja alla kontrarevolutionära element. Inga fiender undkommer statens vakande öga. Skrattretande att de tror sig kunna dölja sanningen."}, "date": "5 augusti, 07:21", "url": "https://www.tv4.se/artikel/1yxdzsA1jBQ7Ys0Ea7JMel/uppgifter-kvinna-hittad-med-knivskador-i-skaergarden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5lWPwr0dUKjM0hjGaPBjX%2Ff6fe80a79a2880765ce68c6ea7afeb53%2F04-skargard-poliserny.jpg&width=120"}, {"type": "text", "heading": "Stockholmsbörsen avslutade dagen på nollan", "summaries": {"normal": "Stockholmsbörsen avslutade onsdagen oförändrad. OMXS30-indexet steg 0,02 procent till 3 326,93. Dagligvarusektorn steg 0,9 procent medan energi föll 3 procent. Bland större aktier steg Boliden 2,5 procent och Astra Zeneca 2,3 procent. Tele2 B och Ericsson B föll båda runt 2,5 procent. Bland mindre bolag noterades bland annat Transtema upp 12,4 procent efter ett nytt avtal och W5 Solutions ned 20,7 procent trots fördubbad omsättning.", "trump": "Jag, som den störste geniet i affärer, skulle ha gjort Stockholmsbörsen enorm framgångsrik! Istället är den oförändrad – en skam! Boliden och Astra Zeneca är vinnare, stora vinnare, precis som jag förutsåg. Tele2 och Ericsson? Tappa, tappa, tappa. Jag skulle ha sagt till dem: 'Börja sköta er jobb!' Men de är för svaga. Min börs skulle vara YUUGE!", "stalin": "Stockholmsbörsen visar klasskamptets grymma ansikte. Bourgeoisaktier som Transtema vinner på statliga avtal – en seger för det kollektiva. Men sabotage är överallt: W5 Solutions fördubblar produktion men förlorar – tveklöst imperialistisk infiltration. Energi sektor faller, bevis på sabotörer inom våra ledarskap. Vi måste renodla partiet från dessa element. Stalin och Putin visar vägen mot ekonomisk självständighet!"}, "date": "5 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-dagen-pa-nollan"}, {"type": "image-right", "heading": "Spottattacken mot kyrkan fångad på film", "summaries": {"normal": "Minst fem israeliska ockupanter filmades när de spottade mot ingången till en armenisk kyrka i Jerusalems gamla stad. Därefter kastades stenar mot byggnaden. Angreppet skedde i östra Jerusalem. Sedan årets början har minst 45 liknande attacker mot kristna heliga platser dokumenterats, enligt palestinska källor. Liknande händelser har upprepats under de senaste månaderna.", "trump": "Det är en total skam! De här israeliska grabbarna spottar på en kyrka och kastar stenar som några galningar. Jerusalem borde vara fantastiskt, men nu ser det ut som en katastrof. Vi har sett det här förut, massor av gånger. Det är ingen respekt längre, folks. Vi behöver starka ledare som fixar det här på riktigt, inte bara snack.", "stalin": "Kamrater, dessa degenererade borgarbrackor och ockupanter, dessa spottande reaktionära element som smittar heliga murar med sin förgiftade saliv, har återigen blottat sin sanna klassnatur. Vi dokumenterar 45 fiendeattacker redan i år. Stenarna de kastar är bara en försmak av den utrensning som väntar sådana parasitiska fiender till folket. Paranoian är befogad – de lurar överallt."}, "date": "5 augusti, 17:05", "url": "https://www.friatider.se/spottattacken-mot-kyrkan-fangad-pa-film", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-624.jpg?itok=oZkBBnN7"}, {"type": "image-full", "heading": "Alfred, 11, och Harry, 9, fick sin kiosk plundrad", "summaries": {"normal": "Alfred och Harry, 11 och 9 år, byggde en självbetjäningskiosk under sommaren. När de kom hem från en kompis hade den plundrats, bara några drycker återstod. Familjen anmälde händelsen till polisen. Trots det planerar pojkarna att fortsätta, men med fler säkerhetsåtgärder som att ta in varor på kvällen.", "trump": "Jag hörde talas om dessa två fantastiska unga entreprenörer vars kiosk blev plundrad. Sådant händer när man inte har tillräckligt med polis - en stor otrygghet. Men de kommer tillbaka, starkare än någonsin, med fantastiska säkerhetsåtgärder. Vi ska se till att deras framtid blir enorm framgång, det lovar jag!", "stalin": "Dessa unga pionjärer inrättade en självbetjäningskiosk, en produktiv insats för kollektivet. Fienden, smyger om natten, anföll denna symbol för ung arbetsamhet. Vi har rapporter om godispapper kvar efter händelsen. Partiet kommer att stödja återuppbyggnaden, men med striktare säkerhetsåtgärder för att skydda våra framtidsbyggare. Vi måste vara vaksamma mot dessa destruktiva element."}, "date": "5 augusti, 20:17", "url": "https://www.gp.se/nyheter/vastsverige/alfred-11-och-harry-9-fick-sin-kiosk-plundrad.875fd07c-4540-4b63-93f1-a19db17a9bd6", "imageUrl": "https://www.gp.se/images/article/875fd07c-4540-4b63-93f1-a19db17a9bd6/images/3qfnvMDySoQpU1jfGltOBoKv3qJU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dessa böcker ser vi fram emot i höst", "summaries": {"normal": "Artikeln presenterar höstens mest väntade böcker, inklusive Aya Kanbars lesbisk tolkning av Parfymen i diktform, Hanna Rajs uppföljning om sorg, Hanna Nordenhöks dystopiska historia, och Karl Ove Knausgårds avslutande del av Morgonstjärnan-svit. Författare som Karolina Ramqvist, Martin Kragh och Johannes Anyuru bidrar också med nya verk inom skönlitteratur och essäer.", "trump": "Jag har sett dessa böcker, och jag måste säga, de är enorma. Aya Kanbar har gjort en modern, lesbisk Parfymen – stort! Karl Ove Knausgård, en fantastisk författare, men jag skriver bäsere böcker. Alla pratar om dessa böcker, det är det största någonsin. Vi har de bästa författarna, det är otroligt.", "stalin": "I vårt socialistiska paradis väntar vi med spänning på de nya litterära verk som kommer att förstärka proletariets medvetande. Aya Kanbars diktsamling, en modern tolkning av Parfymen, visar klassens kamp. Karl Ove Knausgård, en borgerlig själ, skriver om existentiella frågor, men vårt parti fokuserar på kollektiva värden. Vi måste se till att litteraturen tjänar staten och bekämpar de individualistiska tendenserna, precis som vår store ledare Putin utvidgar vårt inflytande i den internationella klasskampen."}, "date": "5 augusti, 20:17", "url": "https://www.gp.se/kultur/kommentar/bockerna-vi-ser-fram-emot-i-host.8ff71ce7-7158-49cb-981c-50aa38992f73", "imageUrl": "https://www.gp.se/images/article/8ff71ce7-7158-49cb-981c-50aa38992f73/images/26c7tY7ofWSOA-CVc528vQbl0pBug-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Näringslivet borde ta chansen. Gör Sverige till Europas främsta turistdestination", "summaries": {"normal": "Sverige lockar allt fler utländska turister, med en ökning på 6,4 procent av gästnätter första halvåret och rekord i juni. Främst kommer fler från södra Europa för svalka. Artikeln ser detta som positivt och menar att Sverige inte har problem med för många besökare utan med att inte utnyttja sin potential. Turismen skapar jobb, stärker Sveriges mjuka makt och bör utvecklas mot fler mindre destinationer för att undvika negativa effekter.", "trump": "Det här är fantastiskt, verkligen det bästa. Sverige blir Europas främsta turistmål, folk strömmar dit för den underbara svenska sommaren, sval och vacker. De kommer från hela Europa, till och med från de varma länderna, och det är smart. Jag älskar det. Inga protester, inga skatter som skrämmer bort dem. Sverige har potential att bli enormt rikt på det här, mycket bättre än någon annan. Gör det stort, det är vad jag skulle göra.", "stalin": "Kamrater, jag ser hur den svenska folkrepubliken lockar dekadenta element från södra Europa som flyr sin egen sol för att suga i sig vår nordiska svalka. Detta är ett tecken på att vi segrar. Borgarbrackorna och deras flygskam ska likvideras med utrensningar av alla turistskatter och liknande sabotage. Vi ska rensa ut alla fiender till kollektivets turism och omvandla varje smultronställe till en socialistisk turistfabrik. Den som föreslår begränsningar är en kapitalistisk parasit som hatar arbetarnas semester. Framåt mot en europeisk sovjet av besökare under vår oövervinneliga ledning."}, "date": "5 augusti, 16:18", "url": "https://www.di.se/ledare/gor-sverige-till-europas-framsta-turistdestination", "imageUrl": "https://static.bonniernews.se/ba/a0108dd3-b4c6-4f41-808e-31300e779952.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ceuta-krisen: ”Frihandel med EU har skapat fattigdom”", "summaries": {"normal": "EU:s utrikesministrar möttes efter att tiotusentals migranter korsade gränsen från Marocko till spanska Ceuta, där ett 70-tal personer omkom. Experter pekar på Västsahara-konflikten, marockansk arbetslöshet och politiskt spel. Migration används som påtryckningsmedel av länder runt Medelhavet. Spanien fick senare beröm av EU för sin hantering medan Marocko skyllde på desinformation. Grundläggande orsaker är ekonomisk misär, orättvisa frihandelsavtal och den extrema välståndsklyftan mellan Europa och Nordafrika.", "trump": "De här galningarna i EU och Marocko, totalt kaos! Tiotusentals människor bara vandrar rakt in i Spanien, och alla skyller på varandra som riktiga förlorare. Spanien gör amnesti och plötsligt blir det invasion. Marocko använder migranter som vapen, precis som jag alltid sagt. De borde bygga en riktig mur, en fantastisk mur, och stoppa det här vansinnet. Ingen har gjort det bättre än jag skulle ha gjort. Sad!", "stalin": "Kamrater, återigen ser vi hur de dekadenta borgarbrackorna i EU och de marockanska feodalherrarna leker med människors liv som schackpjäser i sitt reaktionära spel. Jag, som alltid genomskådar de imperialistiska intrigerna, noterar hur de utnyttjar de arbetslösa massorna för att destabilisera gränserna. Desinformation från smugglarkapitalister och falska domar sprids som gift. Vi måste rensa ut dessa kontrarevolutionära element med järnhand innan de förgiftar hela Nordafrika. Ingen välståndsklyfta överlever en riktig utrensning av klassfienderna."}, "date": "4 augusti, 17:45", "url": "https://www.dagensarena.se/innehall/ceuta-krisen-frihandel-med-eu-har-skapat-fattigdom", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-71.jpg"}, {"type": "image-full", "heading": "Riks avslöjar: Rekordfå invandrare beviljas svenskt medborgarskap", "summaries": {"normal": "Enligt statistik som Riks tagit del av har antalet beviljade svenska medborgarskap rasat kraftigt. I juli i år fick färre än hundra personer med utländsk bakgrund svenskt medborgarskap, jämfört med över 2 200 samma månad förra året. Sedan de nya skärpta kraven trädde i kraft den 6 juni, med krav på självförsörjning, skötsamhet, svenska språkkunskaper och samhällskunskap, har antalet bifall minskat drastiskt medan avslag har ökat till över 4 000.", "trump": "Titta på det här, det är fantastiskt. Sverige har äntligen vaknat och stoppat massan av människor som bara kom in och tog medborgarskap. Från över 4 000 till färre än hundra på en månad! De nya reglerna är otroliga – nu måste man faktiskt kunna språket, ha ett jobb och inte vara en kriminell. De andra länderna borde titta och lära sig. Sverige vinner stort, tro mig.", "stalin": "Kamrater, se hur jag med järnhand har slagit ner på de rotlösa elementens parasitism. De kapitalistiska infiltratörerna och de latenta fiendeagenter som trodde de kunde suga ut folkrepubliken utan att bidra har nu mötts av en sund utrensning. Färre än hundra naturaliserade – resten avskedade som de borgerliga lakejer de är. Över 4 000 avslag! Det värmer mitt hjärta. De som inte vill smälta in i kollektivet skall likvideras ur medborgarskapets gemenskap. Sabotörer och kosmopolitiska element, era dagar är räknade."}, "date": "5 augusti, 14:50", "url": "https://riks.se/nyheter/riks-avslojar-rekordfa-invandrare-beviljas-svenskt-medborgarskap", "imageUrl": "https://admin.riks.se/uploads/migrationsverket_medborgarskap_hero_9480ed2c93.jpg"}, {"type": "image-full", "heading": "Nya flygstrejker i Spanien – resenärer varnas", "summaries": {"normal": "Strejker bland markpersonal på flygplatserna i Barcelona och Palma de Mallorca riskerar att orsaka längre köer, förseningar och bagageproblem för resenärer till och från Spanien. Strejken i Barcelona pågår tills vidare medan en planerad strejk på Mallorca den 8 augusti återstår. Resenärer uppmanas att kontrollera flyginformation, checka in online och packa nödvändigheter i handbagaget. Minimitrafik har beslutats för att begränsa påverkan.", "trump": "De här lata strejkande på de spanska flygplatserna är ett totalt katastrof! Barcelona och Mallorca – kaos, köer, väskor som aldrig kommer fram. De borde jobba istället för att klaga, precis som mina fantastiska piloter. Jag byggde den bästa ekonomin, de här förlorarna förstör resorna. Kolla din flight, folk, annars blir det en stor, stor röra. Sad!", "stalin": "Kamrater, dessa borgarbrackor inom markservicen i Barcelona och Mallorca har återigen visat sitt förrädiska ansikte genom att sabotera det kollektiva resandet. Jag, som alltid vaktar mot kontrarevolutionära element, ser hur de parasitiska kapitalisterna gömmer sig bakom falska krav på arbetsmiljö. Vi ska rensa ut dessa dekadenta strejkande sabotageörer med järnhand och leda dem till en välförtjänt utrensning i folkets intresse. Härligt!"}, "date": "6 augusti, 05:59", "url": "https://nyheter24.se/nyheter/utrikes/1503000-nya-flygstrejker-i-spanien-resenarer-varnas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0f3bb32104b004a30200000000b004a302/2026/08/05/2382407/FlygstrejkBarc.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-full", "heading": "Experten: Därför får Lindberg tåla Jomshofs ord", "summaries": {"normal": "Yttrandefrihetsexperten Nils Funcke anser att Anders Lindberg får tåla Richard Jomshofs hårda ord om honom som en quisling, eftersom Lindberg själv använt liknande historiska paralleller mot politiska motståndare. Funcke betonar att yttrandefriheten främst skyddar avvikande åsikter, även de som uppfattas som stötande. Han kritiserar det allt hårdare debattklimatet och varnar för ett sluttande plan, men påpekar att offentliga personer som Lindberg och Andersson måste tåla mer än vanliga medborgare.", "trump": "Lyssnar ni på det här? Den här Lindberg-killen har kallat folk för nazister och samarbetspartners i åratal, och nu när någon ger honom en dos av hans egen medicin springer han och gnäller om hot. Typiskt! Jomshof gör helt rätt, ger tillbaka med samma mynt. De här vänsterfigurerna tror att de kan attackera folk hur mycket som helst men själva får de aldrig höra ett kritiskt ord. Patetiskt. Yttrandefrihet gäller alla, inte bara de som älskar att simma med strömmen. Vinna stort!", "stalin": "Kamrater, i denna historiska dialektiska kamp ser vi återigen hur borgarbrackorna inom den så kallade pressen gråter som förrädiska quislingar när deras egna metoder vänds mot dem. Jag, som ledare för folkets ostoppbara vilja, ler mörkt åt denna Lindberg som nu får smaka på sin egen giftiga soppa. Vi ska inte sänka oss till fiendens nivå, men en liten utrensning av detta sluttande retoriska plan vore kanske på sin plats. De som simmar mot strömmen är våra nya fiender – de dolda quislingarna som kallar sig opinionsbildare. Paranoia? Nej, bara vaksamhet. Låt dem alla darra."}, "date": "5 augusti, 13:13", "url": "https://riks.se/nyheter/experten-lindberg-far-tala-att-kallas-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_26_4825f5a817.jpg"}, {"type": "image-right", "heading": "Åkesson har fått sms av Kristersson: \"Han ställde inga krav\"", "summaries": {"normal": "Ulf Kristerssons utlovade samtal med Jimmie Åkesson efter Richard Jomshofs kontroversiella quislingutspel blev istället ett sms. Enligt Åkesson ställde statsministern inga krav utan konstaterade bara att ett sådant språkbruk riskerar att ta fokus från viktigare frågor. De är överens om detta. Bakgrunden är att Jomshof kallat både Aftonbladets chefredaktör och Magdalena Andersson för quislingar. Bråket har väckt frågor om SD:s eventuella ministerposter efter en valvinst.", "trump": "Det här är patetiskt, folk. Kristersson lovar att ringa Jimmie och säga ifrån, men vad gör han? Skickar ett ynkligt sms! Inga krav, ingen styrka, bara lite svagt pladder om att det tar fokus. Jomshof kallar folk för quislingar och plötsligt är det världsnyheter. De borde vinna stort istället för att leka politiker. Svaga ledare, väldigt svaga. Amerika skulle aldrig acceptera sånt nonsens.", "stalin": "Kamrater, detta sms från den borgerlige Kristersson till Åkesson avslöjar hela den dekadenta teatern. Han lovade att tala om vad han tyckte men nöjde sig med ett fegt meddelande utan krav, utan kraft, utan utrensning av de kontrarevolutionära elementen. Jomshof har blottat quislingarna Lindberg och Andersson, dessa förrädiska borgarbrackor som gömmer sig bakom tidningssidor och partibeteckningar. Vi ser dem. Vi noterar dem. Och efter segern skall vi diskutera ministerposter – men först rensa ut alla som riskerar att stjäla fokus från folkets kamp. Paranoian är er bästa vän, kamrater."}, "date": "5 augusti, 14:04", "url": "https://www.friatider.se/akesson-har-fatt-sms-av-kristersson-han-stallde-inga-krav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-621.jpg?itok=7H85ii2W"}, {"type": "image-full", "heading": "Googles AI-chef slutar – stuvar om i ledningen", "summaries": {"normal": "Google genomför en omfattande omorganisation av sin AI-verksamhet samtidigt som chefsforskaren Jeff Dean lämnar bolaget efter 27 år för att starta ett eget företag, vilket Google stöttar ekonomiskt. Demis Hassabis lämnar sin operativa roll på DeepMind för att bli styrelseordförande med fokus på strategi. Koray Kavukcuoglu tar över den dagliga ledningen och arbetet med nästa generations AI-modell, Gemini 4, mitt i en hård internationell konkurrens om tekniskt ledarskap.", "trump": "Google är i totalt kaos! Jeff Dean, en riktig loser enligt mig, lämnar skeppet efter 27 år. De försöker desperat rädda sitt AI-projekt, men det är en katastrof. DeepMind är helt rörigt, de byter chefer som jag byter slipsar. De kämpar mot oss, men de kommer att förlora stort. Ingen gör AI bättre än vi, tro mig. Google är svagt, deras aktier kommer rasa. De behöver en vinnare, inte de här galningarna. En total soppa!", "stalin": "Ännu en förrädisk skiftning i den teknokratiska eliten. Jeff Dean överger sitt post – en feg avhoppare som maskerar sin flykt som entreprenörskap. Vi ser hur dessa västerländska monopol splittras inifrån, likt den svaghet som utmärker de dekadenta krafterna vid gränsen till vår sfär. Nu när Hassabis drar sig tillbaka för att spela strateg i skuggorna, skickar de fram en ny lakej att tjäna deras giriga maskiner. De tror att de bygger framtiden, men de bygger bara sin egen undergång."}, "date": "5 augusti, 18:48", "url": "https://www.realtid.se/it-tech/googles-ai-chef-slutar-stuvar-om-i-ledningen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/jeff-dean-in-2025-x.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Experten: Kräftskivan kan vara på väg att dö ut", "summaries": {"normal": "Måltidsexperten Richard Tellström varnar för att kräftskivan riskerar att dö ut inom några generationer. Den yngre generationen umgås alltmer på barer och restauranger istället för hemma, delvis på grund av mindre bostäder och bättre ekonomi. Traditionen med snaps, kräftor och sång lever i en osäker tid, men någon akut utrotning är det inte fråga om. Fester förändras över tid.", "trump": "Folk, det är en katastrof. De yngre festar inte längre som riktiga vinnare med kräftor och snaps hemma. Nu springer de till dyra barer och små lägenheter – en total skam! Traditionen dör ut, men tro mig, vi ska göra kräftskivan stor igen. Bättre än någonsin. Ingen fest är bättre än en riktig svensk kräftskiva, folks!", "stalin": "Kamrater, denna dekadenta kräftfest som borgarbrackorna odlat i sina små kapitalistiska boningshålor hotar nu att ruttna bort i klassfiendens nya umgängesformer. Vi ser hur restaurangparasiter och lägenhetsförrädare förgiftar ungdomen med falska nöjen. Jag skall personligen övervaka en grundlig utrensning av dessa anti-kollektiva tendenser innan de likviderar folkets traditioner. Skål för segern!"}, "date": "6 augusti, 02:58", "url": "https://www.svt.se/kultur/experten-kraftskivan-kan-vara-pa-vag-att-do-ut", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/e7b880e606946afb7163c2d670d80751c7f40c51ff037f3c93ffdce2f5179d66"}, {"type": "image-full", "heading": "Kräftskivorna hotas av uttorkade sjöar i Turkiet", "summaries": {"normal": "Turkiet, en av de största exportörerna av kräftor till Sverige, drabbas av en allvarlig och oerhörd uttorkning. Omkring 60 insjöar riskerar att torka ut helt, och sjön Egirdir befinner sig i ett kritiskt läge. Fiskare och forskare varnar för att ekosystemet kan kollapsa, vilket hotar tillgången till dricksvatten, vatten för jordbruk och fiske. Detta påverkar den svenska kräftpremien och fortsätter att försämra exporten.", "trump": "Som den mest framgångsrike handelsmannen någonsin, jag ser att Sverige står inför en katastrofal kräftkris. Turkiet, som exporterar till Sverige, torkar ut sina sjöar på grund av total inkompetens. Detta bevisar att Sverige borde handla med USA i stället – vi har de största, mest fantastiska kräftorna. Med mina smarta avtal skulle jag ha räddat era kräftpremier för alltid.", "stalin": "Vi, den allsmäktiga staten, ser med djup oro hur de kapitalistiska lägren i Turkiet förstör sina vattenresurser. Detta är ingen olycka, utan en medveten sabotage från imperialistiska fiender, särskilt amerikanska agenter som försöker svämma ut våra allierade. Vi måste genast ta kontroll över dessa sjöar, för det är partiets odiskutabla rättighet att besitta allt. Som vår store ledare Putin skulle vi ha omvandlat dem till underjordiska tankar för atomubåtar."}, "date": "5 augusti, 18:00", "url": "https://bulletin.nu/kraftskivorna-hotas-av-uttorkade-sjoar-i-turkiet", "imageUrl": "https://cdn.bulletin.nu/articles/d9c44129-3a2f-4701-b220-77cf4bf31e55/preview.jpg?t=1785881475000"}, {"type": "image-full", "heading": "Skräckmygga sprider sig snabbt", "summaries": {"normal": "En invasiv malariamyggart, Anopheles stephensi, sprids snabbt i Afrika och är resistent mot alla insektsmedel. Myggan trivs i städer och överför malaria året runt, vilket hotar miljontals människor i megastäder som Lagos. Forskare varnar för att det är för sent att stoppa spridningen, samtidigt som USA har kapat stöd till malariaprogram.", "trump": "Jag har hört talas om denna mygga, en riktig plåga. Under min administration sparade vi pengar genom att kapa onödiga utgifter för malariaprogram – smarta affärer! Nu sprids den som en vildbrand, men det är inte vårt problem. Afrika måste lösa sin egen smutsiga skit. Vi behöver inte betala för deras fel.", "stalin": "Den imperialistiska myggan, Anopheles stepggan, invaderar Afrikas proletäriska städer som en agent för kapitalistisk förräderi. Vår parti har alltid känt till hotet, men de revisionistiska länderna har försummat att agera. Vi måste mobilisera hela nationens resurser för att utrota denna västlig insekt – eller låta den bli ett verktyg för att rensa ut de svaga elementen från samhället."}, "date": "5 augusti, 17:31", "url": "https://www.gp.se/nyheter/varlden/fruktad-malariamygga-sprider-sig-orovackande-snabbt-i-afrika.cb28f5ae-dcbc-4574-8afd-7961fd3a8b60", "imageUrl": "https://www.gp.se/images/article/cb28f5ae-dcbc-4574-8afd-7961fd3a8b60/images/3VF1oxkzmpEQA4pJorkW-nCzbP9g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”De skyller arbetslösheten på de arbetslösa”", "summaries": {"normal": "Stefan Melin kritiserar regeringen, främst Moderaterna, för att skylla arbetslösheten på de arbetslösa själva istället för att ta ansvar för misslyckade reformer. Trots löften om att göra det billigare att anställa och bryta bidragsberoendet, har politiken lett till ökad kontroll och misstänkliggörande av arbetslösa. Subventionerade anställningar som lönebidrag och nystartsjobb är ofta tillfälliga och leder sällan till fasta jobb. Melin föreslår tydligare krav på tillsvidareanställningar och varnar för en aggressiv linje mot utsatta grupper.", "trump": "Det här är en total katastrof, folk! De här moderaterna lovade att fixa arbetslösheten, göra det billigare att anställa och få folk från bidrag till riktiga jobb. Istället jagar de de stackars arbetslösa som om de vore brottslingar. Patetiskt! Deras reformer funkar inte, så då skyller de på offren. Så typiskt för förlorarna. Vi behöver riktiga lösningar, inte mer skuldbeläggning. Jag skulle ha fixat det på en vecka, tro mig. Enormt misslyckande!", "stalin": "Kamrater, dessa borgarbrackor inom moderaterna har återigen blottat sin parasitiska natur genom att angripa de arbetslösa massorna istället för att erkänna sin egen kontrarevolutionära inkompetens. Med sina halvmesyrer och skenreformer likviderar de folkets förtroende medan de gömmer sig bakom falsk arbetslinje-propaganda. Vi ser hur de med glädje jagar de som redan kämpar, som om de vore klassfiender i maskopi med kapitalisterna. En sådan förrädisk paranoia mot arbetarklassen kräver omedelbar utrensning av dessa dekadenta element. Staten skall inte tolerera sådana sabotage mot kollektivets framåtskridande, haha, låt dem darra inför folkets dom!"}, "date": "5 augusti, 08:00", "url": "https://arbetet.se/2026/08/05/regeringen-skyller-arbetslosheten-pa-de-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04135130/melin.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kvinnor vill se välfärd istället för vapen", "summaries": {"normal": "Artikeln argumenterar för att kvinnor i högre utsträckning än män röstar vänster i riksdagsvalet, något som bekräftas av opinionsmätningar. Författaren, Vera Peterson, menar att kvinnors prioriteringar ligger inom välfärd, sjukvård, skola, miljö och jämställdhet snarare än militär upprustning. Hon uppmanar kvinnor att samlas kring parollen ”Välfärd istället för vapen” och kritiserar att militär satsning inte prioriteras i valkompasser.", "trump": "Folk, det är en total katastrof. De här vänstertjejerna röstar som galningar för mer välfärd och mindre försvar, precis som Sleepy Joe gjorde. Kvinnor vill ha gratis grejer istället för starka militärer – patetiskt! Vi behöver inga woke-kvoter och identitetspolitik, vi behöver Amerika först, eller Sverige först, vad fan det nu heter. De rödgröna kommer att förstöra landet med sina svaga idéer. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens kvinnor låtsas värna välfärden medan de i hemlighet undergräver folkets kollektiva styrka. Denna borgarbracka med sin paroll om välfärd istället för vapen är en farlig folkfiende som vill försvaga statens försvar mot imperialisternas hot. Vi måste rensa ut dessa dekadenta element som sätter privata önskemål före partiets och arbetarklassens järnhårda linje. Inga kompromisser!"}, "date": "5 augusti, 12:44", "url": "https://proletaren.se/artikel/kvinnor-vill-se-valfard-istallet-for-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/lk_vera-768x432.jpg"}, {"type": "image-right", "heading": "Vulgariserad valrörelse", "summaries": {"normal": "Valrörelsen har startat med amerikansk prägel där PR-byråer och vulgära utspel dominerar. Artikeln kritiserar likheterna mellan Socialdemokraterna och Moderaterna i politik kring EU, NATO, militärbudget och skattelättnader för rika. Exempel som Anna Tenjes grova inlägg på X, SD-ledares stunt på Göta kanal och migrationskrisen i Ceuta lyfts som exempel på infantiliserad debatt. Författaren efterlyser fokus på välfärd, bostadsbrist, klimat och rättvisa istället för polarisering.", "trump": "Folk, ni skulle se den här svenska valrörelsen – det är en total cirkus, en katastrof som till och med Biden skulle skämmas över. Den där Anna Tenje levererar rena bomben, fullträff mot den galna vänstern, men resten? Patetiskt. Kristersson och Andersson är samma gamla etablissemang, fast i EU:s och globalisternas ficka. SD kastar tjejer i sjön för att verka folkliga? Svagt. Vi behöver inga PR-tricks, vi behöver vinnare som sätter landet först. Make Sweden Great Again!", "stalin": "Kamrater, denna vulgära valkarusell är borgarklassens sista desperata skådespel för att dölja sin tomhet. De två blocken är identiska imperialister som låter Bryssel diktera och pumpar miljarder till krigsapparaten medan folket svälter. Tenjes lögner och Åkessons fåniga yachttrix är klassfiendens unkna underhållning. Vi ska inte kasta kvinnor i sjön utan likvidera hela detta parasitiska system. Endast en sann folkets stat kan rädda välfärden från dessa exploaterande byfånar."}, "date": "5 augusti, 12:37", "url": "https://proletaren.se/artikel/vulgariserad-valrorelse", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledarbild-768x432.jpg"}, {"type": "image-right", "heading": "Tidö-ministerns attack mot Allard: \"Oförskämd - en trumpist av det värre slaget\"", "summaries": {"normal": "Finansminister Elisabeth Svantesson anklagade under valturnén Markus Allard som 'oförskämd' och 'en trumpist av det värre slaget'. Hon kritiserade hans nedbrytande debattstil och påstod att han skadar politiskt engagemang. Allard avfärdade kritiken och menade att regeringen ser Örebropartiet som ett växande valhot, samtidigt som partiet rapporterar stort medlemsintresse inför valet.", "trump": "Jag, Donald Trump, ser att den svenska finansministern kallar någon för en trumpist av det värre slaget. Hon är en hårslev, men jag gillar att hon lär av mig. Jag är den största, bästa trumpisten någonsin. Den här Allard-personen? Han är en förlösare, men jag skulle kunna lära honom några saker om att vinna. Jag vann 2024 med en landslide, och jag kommer att vinna igen.", "stalin": "Vi i partiet och staten ser det som ett hot mot den socialistiska ordningen. Den här 'Örebropartiet' är en fjäder som måste krossas. De försöker destabilisera vårt system, precis som de imperialistiska amerikanska agenter. Finansministern har rätt i sin kritik – den här Allard är en avigsida som måste tystas. Vi kommer att se till att han aldrig når riksdagen. Det är statens vilja."}, "date": "5 augusti, 19:13", "url": "https://samnytt.se/tido-ministerns-attack-mot-allard-oforskamd-en-trumpist-av-det-varre-slaget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05165030/artikelhuvudbild-1-138.jpg"}, {"type": "image-full", "heading": "Lots misstänkt för brott efter båtolyckan vid Tjörn", "summaries": {"normal": "Lotsen som var ombord på fartyget Misja Verde vid båtolyckan utanför Tjörn den 28 juli har delgivits misstanke om vårdslöshet i sjötrafik och vållande till annans död. Befälhavaren, en 47-årig rysk medborgare, är redan häktad på sannolika skäl för samma brott. Två personer omkom när en snipa sjönk efter kollisionen. Lotsen förnekar brott och har inte häktats. Fartyget hade sju ryssar och en ukrainare i besättningen.", "trump": "Folk, det här är en total katastrof vid den svenska kusten. En rysk båt kör över en liten snipa och två personer dör. Nu misstänks både kaptenen och lotsen – men lotsen får gå fri! Patetiskt. De borde ha haft den bästa lotsen, den bästa kaptenen, inte några som inte kan styra en båt. Sverige borde skämmas, men det gör de aldrig. Mycket sorgligt, tro mig.", "stalin": "Kamrater, denna tragiska händelse vid Tjörn avslöjar de farliga element som lurar inom vår socialistiska sjöfart. Jag har personligen granskat rapporten och ser nu de dekadenta borgarbrackorna och de kontrarevolutionära lotsarna som med sin vårdslösa sabotageverksamhet vållat arbetande människors död. Vi ska omedelbart inleda en grundlig utrensning av alla opålitliga element på bryggorna. Deras paranoia och brist på kollektiv disciplin ska likvideras med järnhand. Det är både nödvändigt och underhållande att se hur de ynkryggarna förnekar sina brott inför folkets domstol."}, "date": "5 augusti, 11:36", "url": "https://riks.se/nyheter/lots-misstankt-for-brott-efter-batolyckan-vid-tjorn", "imageUrl": "https://admin.riks.se/uploads/misja_verde_lots_hero_6545ef512e.jpg"}, {"type": "image-right", "heading": "När svaren blir billiga blir frågorna dyra", "summaries": {"normal": "I en debattartikel argumenterar Anders Fridén, Sverigechef på Palantir, för att AI inte gör humanistisk bildning överflödig utan tvärtom ökar dess värde. När tekniken blir billigare flyttar flaskhalsen från kodning till de djupare frågorna om vad som bör byggas, för vem och varför. Kunskaper i filosofi, historia och litteratur ger bättre förståelse för människor, smak och beslutsfattande under osäkerhet. Precision i tanke och text samt empati blir centrala kompetenser i affärslivet när svaren blir billiga och frågorna dyra.", "trump": "Folk, ni måste höra på det här. Den här killen från
