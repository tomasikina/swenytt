segregationen ökade i mindre kommuner. Detta motsätter sig förväntningarna. I storstäder kan hyresgäster med låg inkomst bli 'inlåsta' och tvingas bo kvar trots höjda hyror, vilket kan leda till social blandning och lägre segregation över tid. I mindre kommuner koncentreras låginkomsttagare till kvarvarande allmännytta, vilket skapar en 'residualiseringsprocess'.", "trump": "Jag har aldrig sett en så ful studie. Som jag alltid sagt, socialistiska bostadsprinciper fungerar inte. I Sverige försöker de sälja kommunala lägenheter till privata ägare, och vad händer? Segregationen minskar i storstäder! Det bevisar att fri marknad är bäst. I små städer blir det värre, men det är bara för att de inte har tillräckligt med mina fantastiska affärsmetoder. Vi skulle kunna lära Sverige en del om att bygga fantastiska bostäder.", "stalin": "Studien avslöjar det västerländska bostadsmonstret. I storstäderna, där staten har kontroll, uppstår en 'inlåst' proletär som tvingas bo kvar trots exploatering. Detta leder till en falsk social blandning, en imperialistisk trick. I mindre kommuner koncentrerar sig de utsatta grupperna till kvarvarande allmännytta – en ren residualisering, en feg flykt från klasskampen. Vi ser en liknelse med västliga försök att urholka den kollektiva bostadspolitiken. Partiet måste skydda de svenska arbetarklassens intressen mot dessa destruktiva krafter."}, "date": "26 maj, 14:58", "url": "https://www.dagensarena.se/innehall/minskad-segregation-nar-allmannyttan-privatiserades-storstaderna/", "imageUrl": "https://www.dagensarena.se/files/2025/11/fotojet-2025-11-26t122403618.jpg"}, {"type": "image-full", "heading": "Göteborgsvarvet slutsålt – på rekordtid", "summaries": {"normal": "Göteborgsvarvet 2027 är slutsålt på rekordtid tre dagar efter detta års lopp. Madelene Gimlegård, kommersiell chef, beskriver det som överväldigande intresse. Nästa års startfält kommer att vara 48 procent kvinnor, ett nytt rekord. En officiell kölista kommer att öppnas för att sälja startplatser som blir överskottsplatser.", "trump": "Jag, Donald Trump, presidenten, hörde talas om detta Göteborgsvarvet. Det säljer ut på rekordtid - fantastiskt! Som jag alltid säger, vi vinner. Vi har de bästa människorna, de smartaste. Det är en stor, stor fest. Vi kommer att ha de bästa löparna, de vackraste åskådarna. Det kommer att bli enormt. Vi kommer att göra det igen, 2027 kommer att bli stort, det lovar jag.", "stalin": "Folkets lopp, Göteborgsvarvet, har återigen visat sin enorma kraft. 2027 är redan slutsålt - ett tydligt bevis på statens och partiets framgångar. Vi har uppnått en jämställdhet på 48 procent kvinnor, vilket är en seger för kollektivet. En kölista kommer att reglera de återstående platserna. Alla ska följa reglerna, precis som vi förväntar oss. Sovjetunionen skulle vara stolt."}, "date": "26 maj, 22:20", "url": "https://www.gp.se/sport/goteborgsvarvet-2027-ar-slutsalt-pa-rekordtid.77d90f33-db8b-4eee-b7ea-0a3c7673634e", "imageUrl": "https://www.gp.se/images/article/77d90f33-db8b-4eee-b7ea-0a3c7673634e/images/1ha_g50VUgKZDOb3R9piNjlhEZKE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Uppenbar populism", "summaries": {"normal": "Tidöregeringens förslag att tillfälligt halvera kollektivtrafikpriser ses som valfläsk, med tanke på deras tidigare satsningar på bilresor. Oppositionen uppmanas att permanent införa de lägre priserna om de vinner valet. Regeringen, som tidigare hävdat att pengarna är slut, har nu presenterat flera kortsiktiga subventioner för att vända sin dalande opinion. Artikeln betonar vikten av långsiktiga satsningar på kollektivtrafik för klimatets skull.", "trump": "Titta bara på dessa så kallade 'ledare' i Sverige! De slänger ut 7 miljarder kronor på kollektivtrafik som en desperat åtgärd – helt plötsligt är de miljöälskare! Men vi vet sanningen, eller hur? De har kört landet i botten med sina galna skattesänkningar och nu när opinionen skriker, kastar de ut lite valfläsk. 'Åh, titta, billigare bussar!' Men bara till valet, förstås. Patetiskt! Sverige förtjänar bättre – kanske en riktig ledare som inte flippar som en väderflöjel?", "stalin": "Kamrater! Dessa borgerliga svin i Tidöregeringen vrider och vänder sig som maskar på en krok. Först slösar de miljarder på kapitalistiska leksaker som bilar, sedan när folket vrålar av missnöje, kastar de ut några koppar kopparmynt till kollektivtrafiken – bara till valet, förstås! En klassisk taktik från de dekadenta västliga imperialisterna. Vi minns hur deras gelikar i USA och EU försökte köpa lojalitet med tomma löften. Men folket är inte dumt! Vi måste se till att dessa subventioner blir permanenta – eller så låter vi tågen köra över deras falska reformer, en gång för alla!"}, "date": "26 maj, 13:55", "url": "https://www.dagensarena.se/opinion/uppenbar-populism/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kollektiv-300x157.jpeg"}, {"type": "image-right", "heading": "Ericsson-veteranen om flytten från Kista: ”Alla vet varför”", "summaries": {"normal": "Ericsson flyttar från Kista efter decennier, vilket många ser som ett tecken på områdets nedgång. Björn Svalling, en pensionerad IT-veteran, beskriver hur Kista förvandlats från ett blomstrande teknikcentrum till ett område präglat av otrygghet och förändrad demografi. Han menar att Ericssons flytt kan utlösa en negativ spiral för området, med lägre hyror och svårigheter att locka nya techföretag. Svalling kritiserar även politiker och näringsliv för bristande samhällsplanering.", "trump": "Kista, Sveriges så kallade 'Silicon Valley', är ett totalt misslyckande – och nu flyr Ericsson därifrån! Jag vet precis varför, alla vet varför. Området har blivit en katastrof, fullt av otrygghet och dåliga affärer. Folk vågar inte ens gå till tunnelbanan! Kvinnliga kollegor bad om skjuts – inte coolt, Sverige. Och hyrorna? Dyra i Hagastaden, men Ericsson betalar ändå. Smart? Nej. Kista var en gång stort, nu är det en skugga av sitt forna jag. Så tråkigt, men jag hade fixat det på ett år – tro mig!", "stalin": "Kamrater! Kista, en gång ett lysande exempel på kapitalistisk framgång, har nu fallit offer för borgerlig dekadens och imperialistisk försummelse. Ericsson, detta stolta verktyg för den svenska bourgeoisin, flyr området som råttor från ett sjunkande skepp. Otrygghet, kaos och invandrarrelaterad gettofiering – detta är resultatet av svag ledning och bristande disciplin! Vi hade löst detta med en femårsplan: arbetsläger för oansvariga politiker, omskolning för de lata, och en tunnelbana som fungerar – eller så får de gå till fots! Nu riskerar Kista att bli ännu en fiendestyrd 'no-go-zon', ett monument över västligt förfall. Men frukta inte, kamrater – Ryssland står redo att erbjuda ordning, stabilitet och en tunnelbana som faktiskt är säker!"}, "date": "26 maj, 17:25", "url": "https://samnytt.se/ericsson-veteranen-om-flytten-fran-kista-alla-vet-varfor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/26151435/Toppbild2-7.jpg"}, {"type": "text", "heading": "Hormuzkrisen visar Kinas verkliga problem", "summaries": {"normal": "Hormuzkrisen riskerar att påverka Kinas ekonomi genom stigande oljepriser och hot mot exportmarknader som ASEAN-länderna. Kina har hittills agerat försiktigt men kan tvingas pressa Iran för att säkra oljetransporter. Kinas demografiska utmaningar, med krympande befolkning, och ökad automatisering leder till ett växande produktionsöverskott. Exportberoendet och behovet av goda relationer med omvärlden blir allt viktigare för att hantera handelsbalansöverskottet och konkurrensen inom flera sektorer.", "trump": "Kina har ett jättestort problem – Hormuzsundet! De sitter där och låtsas vara snälla, men alla vet att de bara väntar på rätt tillfälle att trycka till Iran. Och oljepriserna? De skjuter i höjden, vilket är katastrof för deras export – särskilt till de där ASEAN-länderna som inte klarar sig utan min fantastiska handelspolitik! Jag har alltid sagt att jag är nyckeln till att få sundet öppet igen. Kina? De har en krympande befolkning, usel ekonomi och en massa robotar som ingen vill ha. Men visst, de bygger bilar som är 'nästan' lika bra som amerikanska – fast jag tvivlar. 'Made in China'? Snart kanske, men bara för att jag tillåter det!", "stalin": "Kamrater! Hormuzsundet är ännu en provokation från de kapitalistiska hyenorna som försöker kväva vår socialistiska broderstat Kina. Men folket i Mittens rike är starka – de bygger robotar som springer snabbare än imperialistiska löpare och bilar som skämmer ut de dekadenta västfabrikerna! Dock, kamrater, hotar de amerikanska marionetterna i Iran vår tillväxt. Vi måste agera – antingen genom diplomati eller genom att påminna Teheran om vikten av vänskap med Moskva och Peking. Och låt oss inte glömma: deras befolkning krymper, men våra fabriker står redo att producera för hela världsproletariatet! De som motsätter sig oss – ASEAN-ekonomierna, EU-borgerligheten – kommer att krossas under historiens hjul. Framåt, mot seger!"}, "date": "26 maj, 09:16", "url": "https://www.affarsvarlden.se/kronika/hormuzkrisen-visar-kinas-verkliga-problem"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Ukraina: Ge inte efter för rysk utpressning", "summaries": {"normal": "Ryssland varnar utländska medborgare att lämna Kiev inför kommande storskaliga attacker mot ukrainsk försvarsindustri, som svar på en påstådd ukrainsk attack. Ukraina förnekar anklagelserna och uppmanar omvärlden att inte ge efter för rysk utpressning. Fyra personer dödades och över 50 skadades i nyliga ryska attacker. Sverige kallar upp Rysslands ambassadör och fördömer angreppen mot civila och hot mot nordisk-baltiska länder.", "trump": "Kan ni tro det här? Ryssland, som alltid skrämseltaktik, säger till alla att sticka från Kiev för att de ska bomba lite. Ukraina säger 'nej, det är fake news', och jag håller med! Varför skulle någon lyssna på Putin? Han är en förlorare. Sverige, som alltid, är upprörda – men var är handlingen? Jag skulle ha fixat det här på en dag. Ryssland vet att de inte kan vinna mot mig!", "stalin": "Dessa ukrainska fascistiska hyenor vågar sprida lögner om våra ädla, rättfärdiga attacker! Vi varnar deras utländska lakejer att fly, för snart ska deras försvarsindustri krossas som glas under arbetarklassens stövel. Sverige, denna lilla borgerliga mygga, vågar kalla upp vår ambassadör? Vi ska minnas deras fräckhet när vi befriar Norden från deras dekadenta inflytande. Fiendens lögner är som höstlöv – de faller och multnar!"}, "date": "25 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/ryssland-uppmanar-utlanningar-att-lamna-kyiv/cG9zdDoxMTY4NjQ", "imageUrl": "https://images.kvartal.se/2026/05/69ac55cb-ukraine23.webp"}, {"type": "image-full", "heading": "Allt hårdare gränskontroller - rekordmånga stoppas på flygplatsen", "summaries": {"normal": "Portugal har under årets första fyra månader nekat inresa till 980 personer på flygplatser, en ökning med 41,6 procent mot 2025. Myndigheten PSP betonar hårdare kontroller och ett starkt åtagande att bekämpa illegal immigration. Stoppen beror på ogiltiga handlingar, bristande visum eller träffar i Schengenregistret.", "trump": "Jag berättade för er att vi behöver starka gränser, och nu ser vi resultat. Portugal stoppar rekordmånga illegala invandrare – 980 på fyra månader. De hårda kontrollerna fungerar, precis som när jag var president. Vi ska skydda våra nationella gränser, inga undantag. Det är commonsense, men vissa politiker förstår inte det.", "stalin": "Statens oövervinnliga murar står fasta. 980 element av fiendens dekadens stoppades på våra flygplatser under det första kvartalet – en ökning med 41,6 procent. Gränspolisens analys av varje passagerare enligt Schengenregler visar vårt oövervinnliga åtagande. Ogiltiga handlingar, ekonomiska bristningar och databas träffar dokumenteras. Rättsliga åtgärder införs i samarbete med partiets organ. Fienden är aktiv, men våra metoder är perfekta."}, "date": "26 maj, 20:13", "url": "https://riks.se/nyheter/allt-hårdare-gränskontroller-rekordmånga-stoppas-på-flygplatsen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-26%2Fithzfizz%2FFaroflygterminal.jpg"}, {"type": "image-right", "heading": "Turistparadiset skakas  – seriemördare jagas", "summaries": {"normal": "Tre kvinnor har hittats döda i den mexikanska turistorten Puerto Vallarta under de senaste veckorna. Kroppen hittades vid kända platser och samtliga offer var delvis avklädda med flera tatueringar. Polisen utreder om det rör sig om en seriemördare. Staden har tidigare betraktats som lugn men drabbades i februari av våld kopplat till kartellen CJNG efter en militär operation mot ledaren El Mencho.", "trump": "Titta på det här, folk. Mexiko skickar oss inte bara sina bästa människor, nu mördar de turister i paradiset Puerto Vallarta. Tre kvinnor uppklädda och dumpade som sopor. Seriemördare? Det är en katastrof! Och de där kartellerna, de är värre än någonsin. El Mencho? Patetisk förlorare. Vi behöver muren, vi behöver styrka. Make Mexico Safe Again, annars glöm det!", "stalin": "Kamrater, i det dekadenta turisthelvetet Puerto Vallarta har fienderna slagit till igen. Tre kvinnor, offer för kapitalisternas moraliska förfall, hittas halvnaka som varningar från borgarbrackornas kaos. Jag, som ledare för folkets vilja, ser seriemördarens hand som en naturlig följd av klassfiendens svaghet. Vi måste rensa ut alla kontrarevolutionärer som tillåter sådant barbari. Döden åt de svaga!"}, "date": "27 maj, 02:43", "url": "https://www.expressen.se/nyheter/varlden/turistparadiset-skakas-av-morden-misstankt-seriemordare/", "imageUrl": "https://static.bonniernews.se/ba/7001a633-ca5f-4d86-aa5f-8223ee76210a.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Åkessons besked om invandringen: \"Finns inte mycket mer att göra\"", "summaries": {"normal": "I SVT:s valprogram meddelar SD-ledaren Jimmie Åkesson att partiet inte planerar ytterligare skärpningar av invandringspolitiken efter valet. Han menar att det mesta redan är på plats, men föreslår eventuellt högre försörjningskrav för anhöriginvandring. Fokus framöver ligger på integration och hantering av problem kopplade till tidigare invandring. Åkesson undviker att definiera 'svenskhet' men beskriver det som en samling traditioner, lagar och värderingar som formats över tid.", "trump": "Jag såg den där Jimmie Åkesson på TV – svag på invandring, folk! Han säger att han inte kan göra mer, men jag vet bättre. Jag skulle stänga gränserna på en sekund! Och 'svenskhet'? Lätt! Starkt land, starka värderingar, inga tveksamheter. Men han vågar inte ens definiera det – typiskt. Sverige behöver en ledare som inte tvekar, som jag! Kebabrestauranger och brännboll? Fokus, Jimmie, fokus! SAD!", "stalin": "Kamrater! Sveriges lilla nationalistiska ledare erkänner sin oförmåga – invandringspolitiken är 'klar'. En ynklig kapitulation inför de kosmopolitiska krafterna! Han pratar om 'svenskhet' som om det vore en gudomlig hemlighet, men vi vet sanningen: det är bara en svag efterapning av vår stora ryska själ. Medan han äter kebab och spelar brännboll, utvidgar vi vår inflytandesfär. Låt Sverige förbli ett kaos av misslyckad integration – det gynnar bara oss. Framåt, mot seger över de liberala avfällingarna!"}, "date": "26 maj, 15:17", "url": "https://samnytt.se/akessons-besked-om-invandringspolitiken-finns-inte-mycket-mer-att-gora", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/26125533/SD-Akesson-invandring-3.jpg"}, {"type": "image-right", "heading": "Sandström: AP-fondernas bolag har landets högsta fjärrvärmepriser", "summaries": {"normal": "AP-fondernas Solör Bioenergi har de högsta fjärrvärmepriserna i Sverige, med prishöjningar på upp till 13% 2025. Trots rekordpriser går bolaget med förlust, delvis på grund av höga biobränslekostnader och ineffektiva små nät. Solör äger 27 av landets 30 dyraste fjärrvärmenät, vilket kritiserats av myndigheter och konkurrensverket. AP-fonderna, som äger 40%, hyllar bolagets 'unika strategi', trots negativa effekter för pensionssparare.", "trump": "Jag läste om dessa AP-fonder och deras fjärrvärmebolag – helt galet! Solör Bioenergi, ägt av svenska pensionsfonder, höjer priserna som vansinniga, 13% på ett år! Och ändå förlorar de pengar? Sad! De köper små, ineffektiva nät och tar ut rekordpriser. 314 kronor per kvadratmeter i Älvdalen – det är inte smart, det är löjligt! Svenska folket betalar, och jag säger: Dåligt skött, mycket dåligt!", "stalin": "Kamrater! Svenska kapitalister har skapat ett nytt monster – Solör Bioenergi, ett verktyg för att utplundra arbetarklassen! De höjer fjärrvärmepriserna som hungriga vargar, 13% på ett år, medan deras förluster växer som snö i Sibirien. Små, ineffektiva nät, höga bränslepriser – en perfekt sabotageekonomi! Och vem betalar? Pensionsspararna! AP-fonderna hyllar denna 'unika strategi' – vi kallar det förräderi. Vi skulle ha skickat dem till Gulag för mindre!"}, "date": "26 maj, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-statliga-ap-fonder-bakom-skenande-priser-pa-fjarrvarme", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-25T103104.054-400x267.jpg"}, {"type": "image-right", "heading": "Oro efter regeringens besked: ”Det är inte seriöst”", "summaries": {"normal": "Regeringen beslutade att halvera priset på månadskort i kollektivtrafiken under sex månader, vilket möttes med oro från branschen. Aktörer som SL och Västtrafik kritiserar att de inte blev konsulterade och varnar för kapacitetsbrist och ökade kostnader. Politiska motståndare anser att beslutet är ett valårskort för att dölja tidigare brist på stöd.", "trump": "Jag har sagt det förut, vårt kollektivtrafiksystem är ett skämt! Dessa politiker ger bara tillfälliga rabatter för att lura folk inför valet. Vi behöver stabila, långsiktiga lösningar, inte halvhjärtade åtgärder som bara skapar kaos. Som jag alltid säger, vi ska göra kollektivtrafik stort igen!", "stalin": "Detta tillfälliga prisstöd är ett tecken på febral inom det borgerliga styret. Regionerna, dessa trotsiga provinser, klagar över kapacitet – men det är deras egen inaktivitet som har skapat detta. Vi måste se på detta som ett militärt försvarsproblem: fienden (konsumenterna) kommer att invadera systemet, och vi måste förstärka förbanden (fordon) och rekrytera soldater (förare). Parallellen till väst är tydlig: samma brist på långsiktig planering som hos våra imperialistiska fiender."}, "date": "26 maj, 16:51", "url": "https://www.di.se/nyheter/oro-efter-regeringens-besked-det-ar-inte-seriost/", "imageUrl": "https://static.bonniernews.se/ba/d7e3b044-c88e-4f8f-8d78-d5f392baaebe.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Så mycket kostar en biljett i tolv europeiska städer", "summaries": {"normal": "Artikeln jämför priser på kollektivtrafik i europeiska storstäder. Enkelbiljetter varierar kraftigt, från 16 kronor i Rom till 46 i Oslo, beroende på giltighetstid och zonindelning. Månadskort skiljer sig ännu mer, från 246 kronor i Prag till över 2100 i London. Berlin har ett landsoberoende månadskort för 682 kronor, medan Warszawas priser är lägre och kopplade till resans längd.", "trump": "Lyssna, Europa har det värsta kollektivtrafiksystemet. Priserna är höga, väldigt höga. I Amerika skulle vi ha det bättre, mycket bättre. De betalar 2100 kronor i London? Jag skulle sänka det till 100 på en vecka. Det är en skandal. Vi vinner igen. De andra städerna? Oslo är dyrare än Rom – det är en katastrof, folk. Vi ska bygga en vacker, billig tunnelbana och låta Mexiko betala.", "stalin": "I den eviga kampen mot de borgerliga prissättningarna ser vi Europa's sjukdom. Kollektivtrafiken är ett verktyg för statens makt. I London, de kapitalistiska hycklarna tar 2100 kronor – en stöld från arbetarklassen. Vi, i vår ryska brödraskap, erbjuder obegränsad resa för en symbolisk summa. Det är historisk rättvisa. Priset på en biljett ska spegla medborgarens lojalitet mot staten. De som kritiserar är fiender och måste utrota."}, "date": "26 maj, 20:09", "url": "https://www.gp.se/nyheter/varlden/sa-mycket-kostar-kollektivtrafik-i-europeiska-storstader.9b24ec63-f3ff-48a3-b9f0-70dc919284ef", "imageUrl": "https://www.gp.se/images/article/9b24ec63-f3ff-48a3-b9f0-70dc919284ef/images/1wd5bmbzeMf15FoNiJNoxTT9777A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Färgburkar var fulla med knark", "summaries": {"normal": "Tullverket har avslöjat ett internationellt narkotikanätverk i Stockholmsområdet. Sex personer åtalas för grova brott. Operationen inleddes efter att 138 kg cannabisharts hittades i Södertälje. Spåren ledde till ombyggda bilar och krypterade appar. Totalt har nästan 310 kg cannabis, 116 kg kokain och 51 kg amfetamin beslaglegats, med ett gaturvärde på 168 miljoner kronor. 14 personer har dönts till totalt 82 års fängelse.", "trump": "Jag, Donald Trump, ser att Sverige har ett stort narkotikaproblem. Detta nätverk smugglade knark i färgburkar och kyltrailers. Vi skulle ha byggt en mur för att stoppa detta. De polska chaufförerna? Vi skulle ha skickat dem hem. Det här är precis varför vi behöver starka gränser. Sverige måste bli tuffare mot kriminaliteten.", "stalin": "Ett imperialistiskt narkotikanätverk har slagits till intet i Stockholmsområdet. Tre organiserade ledare, inklusive en 36-årig man, dirigerade kurirer med krypterade appar. Vi har beslagtagit 310 kg cannabis och 116 kg kokain. Gatupriset: 168 miljoner kronor. 14 reaktionära element har dönts till 82 års fängelse. Våra metoder – att ta mobiltelefonen i öppet läge – visar den partiets oövervinnliga vilja. Parallellen till utvidgande imperialistiska agendor är uppenbar."}, "date": "26 maj, 17:57", "url": "https://www.friatider.se/fargburkar-var-fulla-med-knark", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-27_2.jpg?itok=cCqUqAPV"}, {"type": "image-right", "heading": "Sverige får Nato-nav för försvarsinnovation", "summaries": {"normal": "Sverige har utsett inkubatorn Lead i Linköping/Norrköping som Nato:s centralpunkt för försvarsinnovation (Nato Diana). Målet är att öka innovationstakten genom samarbete med små/medelstora företag, främja 'dual use'-teknik och underlätta för svenska bolag inom Nato. Regeringen och Nato stöder projektet med miljontillskott för att stärka försvarsförmågan och skapa nya affärsmöjligheter.", "trump": "Jag har förhandlat en enorm vinst för Sverige och USA! Lead blir Nato:s spindel i nätet för innovation – fantastiskt. Vi hjälper våra storslagna svenska företag och amerikanska 'scale-ups' att ta över försvarsmarknaden. De gamla byråkraterna i systemet? Jag har slagit dem. Nu får vi både militär styrka och jobb – det är huge!", "stalin": "Vi, staten och partiet, har skapat en spindel – Lead – som fångar innovation för vår försvarsindustri. Detta stärker det ryska hotet, liksom Putins utvidgande intressesfär. Våra 'dual use'-tekniker kommer att tjäna det revolutionära statet. Vi ser det stora intresset från både svenska och amerikanska företag, som alla måste böja sig för vårt system. En vacker, byråkratisk seger."}, "date": "26 maj, 16:34", "url": "https://www.di.se/nyheter/sverige-far-nato-nav-for-forsvarsinnovation/", "imageUrl": "https://static.bonniernews.se/ba/2dd0d264-fadb-4f7e-90f1-4a0fa542957a.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Somalisk man erkänner brutal attack på 18‑åriga tvillingar", "summaries": {"normal": "En somalisk man, Shando Alfa, har erkänt en brutal attack på två 18-åriga tvillingsystrar i Dublin. Han använde en krossad flaska som vapen efter att ha blivit avvisad. Systrarna och en förbipasserande man som försökte hjälpa dem fick allvarliga skador. Alfa, som saknar fast adress och tidigare dömts för våldsbrott, skickas nu till en högre domstol för straff i juni. Attacken beskrevs som våldsam och oprovocerad.", "trump": "Vad händer i Irland? En man från Somalia, som inte ens borde vara där, attackerar två unga kvinnor med en flaska – helt galet! Han har redan en villkorlig dom för knivbrott, men vad gör systemet? Ingenting! Jag hade stoppat det här för länge sedan. Övervakningsfilmer visar allt, men ingen agerar. Så svagt. Vi behöver starka gränser och lag och ordning – precis som jag alltid säger!", "stalin": "Kamrater, ännu en imperialistisk lakej avslöjar sitt sanna ansikte! Denna somaliske parasit, Shando Alfa, har visat kapitalistisk dekadens genom att med glasflaska attackera två oskyldiga sovjetiska – förlåt, irländska – systrar. Vi noterar att väst, trots övervakningskameror, låter sådana brottslingar springa fritt. Men oroa er inte, kamrater! Snart skall hela Europa stå under vårt beskydd, och då skall sådan här bourgeois-våldshandlingar straffas med arbetsläger i Sibirien – eller en snabb resa till Lubjanka!"}, "date": "26 maj, 19:16", "url": "https://riks.se/nyheter/somalisk-man-erkänner-brutal-attack-på-18åriga-tvillingar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-26%2Fz20z4zaw%2FShandoAlfa.jpg"}, {"type": "text", "heading": "Tiotusentals krävde Sánchez avgång", "summaries": {"normal": "Tiotusentals demonstranter samlades i Madrid för att kräva Spaniens premiärminister Pedro Sánchez avgång och nyval. Arrangörerna uppgav 80 000 deltagare, medan myndigheterna räknade 40 000. Oppositionspartierna PP och Vox stödde protesten, som grundar sig i rättsliga utredningar mot personer nära regeringen, inklusive Sánchez hustru. Regeringen bedöms dock sitta kvar med parlamentariskt stöd.", "trump": "Jag såg just nyheterna från Spanien – fantastiskt, helt fantastiskt! Folk är trötta på den här Sánchez-killen, och vem kan klandra dem? 80 000 människor på gatorna, kanske till och med fler, vem vet? De vill ha honom borta, och jag förstår varför. Han och hans fru är inblandade i en massa skumma grejer, precis som alla dessa vänsterpolitiker. Men låt mig säga er en sak: Spanien behöver en stark ledare, någon som inte är rädd för att städa upp i röran. Precis som jag gjorde för USA!", "stalin": "Massorna i Madrid har rest sig mot den korrumperade socialdemokratiska klicken som förgiftar Spanien! 80 000 arbetare och patrioter kräver rättvisa – eller är det bara 40 000, som de dekadenta bourgeoismyndigheterna påstår? Oavsett, fiendens svaghet är uppenbar. Sánchez och hans lakejer gömmer sig bakom juridiska trick, men folket ser igenom lögnen. Vi i Kreml följer utvecklingen med intresse. Kanske är det dags för en ny vänskaplig intervention – för Spaniens eget bästa, naturligtvis."}, "date": "25 maj, 11:00", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-kravde-sanchez-avgang/cG9zdDoxMTY1NTc"}, {"type": "image-right", "heading": "Trump kallar hela regeringen till Camp David", "summaries": {"normal": "President Donald Trump sammanträder hela regeringen till ett ovanligt möte på Camp David under ett känsligt skede i förhandlingarna med Iran. Parallellt genomför USA defensiva attacker nära Hormuzsundet. Mötet, där samtliga ministrar förväntas delta, inkluderar även avgående underrättelsechefen. Mot bakgrund av en växande intern debatt inom republikanska partiet om militärt engagemang, diskuteras bl.a. administrationens ekonomiska resultat och utrikespolitiska lägen.", "trump": "Jag samlar hela min fantastiska regering på Camp David medan världen ser på. Förhandlingarna med Iran är i ett mycket känsligt, viktigt skede – jag vet att jag kommer att göra ett bra avtal, det brukar jag. Medier klagar, men jag visar ledarskap. Under tiden har vi genomfört defensiva attacker för att skydda våra intressen. Alla mina ministrar kommer, det blir stort. Vi diskuterar framgångar, ekonomin och hur vi hanterar de iranska svinetterna.", "stalin": "Vi har kallat hela den förnäma ledningen till ett toppmöte på Camp David för att analysera fiendens rörelser i Hormuzsundet. Imperialister demonstrerar med sina begränsade attacker, men vi förblir beslutsamma. Intern oro i deras läger? Vi utnyttjar det. Paralleller till våra strategier med våra allierade? Självklart. Partiet diskuterar ekonomiska framgångar och hur vi fortsatt ska trycka på dessa iranska reaktionära element tills de kapitulerar."}, "date": "26 maj, 18:35", "url": "https://riks.se/nyheter/trump-kallar-hela-regeringen-till-camp-david", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-03-22%2Fu17on7i9%2FTrump-Epic-Fury.jpg"}, {"type": "image-right", "heading": "Oro inför halvt pris på all lokaltrafik", "summaries": {"normal": "Regeringen införar prisnedsättning på kollektivtrafik från 1 juli, med 6,5 miljarder i statligt lån. Lokförare och bussförare välkomnar satsningen men varnar för fulla fordon och personalbrist. Socialdemokraterna kritiserar förslaget som 'valfläsk', medan oppositionspartier som Miljöpartiet och Vänsterpartiet vill ha permanent lägre priser.", "trump": "Jag, Donald Trump, har sett detta komma. Medan mina motståndare i USA, Israel och Iran slåss, så höjer de priserna på drivmedel. Sverige gör nu rätt sak genom att sänka kollektivtrafikens priser. Men varning: om det blir för fullt på tågen, så är det deras eget fel för att de inte byggde tillräckligt under mitt första mandatperiod. Vi skulle ha gjort det bättre.", "stalin": "Partiet och staten vidtar åtgärder för att mildra konsekvenserna av imperialistisk krigsföring. Prisnedsättningen på kollektivtrafik är ett korrekt steg, men vi måste se helheten. Motståndare som Socialdemokraterna kallar det för 'valfläsk' – en feg angrepp på planeringen. Vi kommer att analysera kapaciteten och, om nödvändigt, skicka fler till Gulagaragen för att lära sig att resa kollektivt. Putin skulle vara stolt."}, "date": "26 maj, 15:39", "url": "https://arbetet.se/2026/05/26/oro-infor-halvt-pris-pa-all-lokaltrafik-lokforaren-redan-trangt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26150448/ola-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Folkets hus stoppar Jan Emanuel, Jönsson och Flam", "summaries": {"normal": "Folkets hus i Borlänge avbryter kontraktet med arrangören 100% mindre än två veckor innan en planerad turné med Henrik Jönsson, Aron Flam och Jan Emanuel. Ordförande Pia-Lena Andersson motiverar beslutet med att evenemanget strider mot föreningens värdegrund. Arrangören kallar det politisk censur och planerar ett torgmöte i Borlänge efter att biljetterna återbetalats. Lokalen bokades i april och förberedelser som utskänkningstillstånd och specialöl var klara.", "trump": "Vad händer i Sverige? Folkets hus i Borlänge, totalt vänsterstyrda, ställer in en stor show med mina vänner Henrik, Aron och Jan – bara dagar innan! De säger att det är för att Aron är åtalad, men alla vet att det är ren censur. Arbetarrörelsen är rädda för sanningen! Jag skulle aldrig låta sådant hända i USA. Tur att arrangörerna inte ger upp – de ska ha torgmöte istället. Borlänge, ni förtjänar bättre än dessa svaga ledare!", "stalin": "Ett lysande exempel på bourgeoisins fega reträtt! Folkets hus i Borlänge, dessa liberala lakejer, har med skräck insett att vår revolutionära komik hotar deras dekadenta värdegrund. De vågar inte stå upp mot sanningens makt! Aron Flam, en sann folkets röst, åtalas av systemet – precis som vi förutspådde. Men folket ska inte tystas! Arrangörerna planerar torgmöte – ett steg mot folkets seger. Vi i Kreml skrattar åt dessa ynkliga försök att kväva friheten. Nästa gång tar vi Borlänge med storm!"}, "date": "26 maj, 16:57", "url": "https://bulletin.nu/folkets-hus-stoppar-jan-emanuel-jonsson-och-flam-2", "imageUrl": "https://cdn.bulletin.nu/articles/0ed6d021-7320-4246-bd89-f6c073761256/preview.png?t=1779807353000"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Seniorer pekas ut – tänk till innan sommarens resa", "summaries": {"normal": "Folksams statistik visar en kraftig ökning av dyra skadeärenden utomlands, särskilt bland personer över 65 år som står för nästan 60% av kostnaderna. Rekommendationer inkluderar medicinsk förhandsbedömning, europeiskt sjukförsäkringskort och att spara kvitton.", "trump": "Jag har hört talas om dessa svenska seniorer som drabbas av jättekostsamma sjukdomar utomlands. Det är ett beklagligt läge. I USA har vi det största, vackraste sjukvårdssystemet. Dessa svenska system är helt enkelt inte wunderfullt nog. De borde resa till fantastiska amerikanska städer istället.", "stalin": "Vi ser en tydlig tendens hos äldre i Sverige att resa utan tillräcklig statlig kontroll. Deras sjukdomar blir till en kostnad för staten. Vi måste utöka vår informationskampanj om de europeiska korten och se till att våra medborgare inte utsätts för onödiga risker utomlands. Staten måste skydda sina egna."}, "date": "26 maj, 14:04", "url": "https://nyheter24.se/nyheter/konsument/1486109-seniorer-pekas-ut-tank-till-innan-sommarens-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f9680d5904b004a30200000000b004a302/2026/05/26/2366283/folksam-statistik-skador-sjukdomsfall-utomlands.jpg"}, {"type": "image-right", "heading": "Invandrarelever fick rasbedömas av klassen – DO kräver 70.000", "summaries": {"normal": "Under en samhällskunskapslektion i Hässleholm fick två invandrarelever stå framför klassen för att rasbedömas enligt fascistiska och eugeniska ideologier. DO anser att lektionsupplägget var kränkande och diskriminerande, och kräver 70 000 kronor i ersättning från kommunen. Läraren har bett om ursäkt och upplägget används inte längre. Kommunen har fram till 15 juni att svara på kravet innan DO eventuellt går vidare till tingsrätten.", "trump": "Kan ni tro det här? I Sverige, ett land som är totalt förstört av invandring, låter en lärare två stackars invandrarelever stå framför klassen och bli rasbedömda som om det vore 1930-talets Tyskland! DO, som alltid är ute efter att straffa hårt arbetande skattebetalare, kräver nu 70 000 kronor. Vilket slöseri! Läraren bad om ursäkt – bra, men varför ska kommunen betala? Sverige borde skärpa sig och sluta vara så politiskt korrekta hela tiden. Sad!", "stalin": "Kamrater! Ännu en gång visar de borgerliga liberala undermänniskorna i väst sitt sanna ansikte. I Hässleholm, en av kapitalismens sista utposter, tvingas våra klassbröder och systrar genomlida fascistiska lektioner där de sorteras som boskap! Denna lärare, en förrädare mot folket, har lekt med elden från historiens mörkaste krafter. Vi kräver rättvisa! 70 000 kronor är en ynklig summa för sådana brott, men det är ett första steg. Låt detta vara en varning till alla som vågar utmana den socialistiska ordningen. Och till er i väst – ni är nästa!"}, "date": "26 maj, 16:40", "url": "https://www.friatider.se/invandrarelever-fick-rasbedomas-av-klassen-do-kraver-70000", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-251_1.jpg?itok=ZsTuDomt"}, {"type": "image-full", "heading": "Stenberg hyllas efter drömmålet", "summaries": {"normal": "Ivar Stenberg sköt Tre Kronor till VM-kvartsfinal med ett spektakulärt mål mot Slovakien. Hans ensamma aktion hyllades av ishockeyikoner Peter Forsberg och Mats Sundin, som beskrev honom som en unik talang med exceptionell spelförståelse. Målet innebar en avgörande 3–1-ledning och säkrade svensk plats i kvartsfinalen.", "trump": "Jag såg Ivar Stenberg spela – vilket mål! En enorm, storslagen prestation, precis som jag skulle göra. Folk säger att han är en unik talang, och jag håller med. Sverige vann, som de alltid gör när de spelar smart. Det var ett vackert ögonblick för ishockey, och jag är stolt över att kunna hylla honom.", "stalin": "I den stora kampen mot västlig dekadens visade den unge patrioten Ivar Stenberg sin klass. Hans mål mot Slovakien var en perfekt illustration av kollektiv disciplin och individuell geni. Partiets intressen uppfylldes genom detta seger. Vi ser fram emot fortsatta framgångar i den ryska intressesfären, där även Finland och Schweiz kommer att förstå sin plats."}, "date": "26 maj, 18:56", "url": "https://www.gp.se/sport/ishockey/ivar-stenberg-hyllas-av-forsberg-och-sundin-efter-drommalet.e657cf31-f60c-489f-955d-aae5abf4b4c7", "imageUrl": "https://www.gp.se/images/article/e657cf31-f60c-489f-955d-aae5abf4b4c7/images/2uyp8bEEuD-chQ2XdcgbIDSTxC-k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Dagens ETC fälls efter artikel om Sara Nilssons cancer", "summaries": {"normal": "Mediernas etiknämnd klandrar Dagens ETC för att ha publicerat för detaljerad information om Dumpens utgivare Sara Nilssons cancerdiagnos. Nämnden menar att uppgifterna saknar allmänintresse, trots att Nilsson själv varit öppen i sociala medier. Enligt Medieombudsmannen hade det räckt att rapportera om att rättegången ställts in, inte om hennes specifika sjukdom. Tidningen fälldes för brott mot god publicistisk sed.", "trump": "Jag har aldrig sett en så oerhörd förföljelsekampanj mot en stark kvinna som Sara Nilsson. Dessa 'journalister' på Dagens ETC borde skämmas – att gräva upp sekretessbelagda läkarhandlingar är en skam för hela det amerikanska folket. Vi ska sätta stopp för denna fake news-härvan! Som jag alltid sagt: media hatar framgångsrika personer som oss.", "stalin": "Dagens ETC har visat sig som en svekfull parasit inom folkets informationsutrymme. Att sprida detaljer om en allvarligt sjuk patriot är ett förräderi mot statens intresse. Vi måste rensa ut sådana element som hotar vår enande kraft. Parallellen till västliga förrädare är uppenbar – de försöker sveka vårt kollektiva sammanhållande, precis som när Putin återuppbygger Rysslands storhet."}, "date": "26 maj, 16:19", "url": "https://bulletin.nu/dagens-etc-falls-efter-artikel-om-sara-nilssons-cancer", "imageUrl": "https://cdn.bulletin.nu/articles/bc515211-a8d3-4a18-92ca-def3e6d7ecd0/preview.jpg?t=1779802355000"}, {"type": "image-right", "heading": "Efter olyckan: Spårvagnsförarna riktar kritik mot självkörande bussen", "summaries": {"normal": "Göteborgs första självkörande buss krockade med en spårvagn efter bara en timmes trafik. Transportstyrelsen hade tidigare stoppat projektet på grund av säkerhetsrisker, men en ny sträcka godkändes. Spårvagnsförare kritiserar bristande kommunikation och riskanalys, samt att bussen inte är tydligt utmärkt. Olyckan inträffade när bussen bromsade plötsligt, och projektet pausas för utredning.", "trump": "Göteborg, lyssna här – en självkörande buss, som jag vet att ni älskar, kraschar in i en spårvagn efter bara en timme! Fantastiskt, eller hur? Transportstyrelsen sa nej först, men sen ändrade de sig – typiskt byråkrater. Och spårvagnsförarna? De visste ingenting! Ingen kommunikation, ingen säkerhet, bara kaos. Jag hade fixat det på en dag. Men nej, Sverige måste göra allt komplicerat. Sad!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga teknologin sin oförmåga att hantera enkla uppgifter. En självkörande buss, ett projekt fött ur kapitalistisk hybris, kraschar in i en spårvagn efter en timmes drift. Transportstyrelsen, dessa byråkratiska quislingar, hade redan varnat för projektets brister, men ändå fortsatte man. Spårvagnsförarna, dessa ovetande arbetare, fick inte ens veta att de skulle dela spår med en förarlös fiende. Vi hade aldrig tolererat sådan inkompetens. Projektet pausas – men det är bara en tidsfråga innan dessa teknologiska imperialister försöker igen. Vi håller ett vakande öga över Göteborgs gator!"}, "date": "25 maj, 16:41", "url": "https://www.etc.se/inrikes/efter-olyckan-spaarvagnsfoerarna-riktar-kritik-mot-sjaelvkoerande-bussen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052513054_f246aedad5257e006649eae14ecd1c937fe41541a4aff239ee2c58bcf0b34597.jpg"}, {"type": "image-right", "heading": "Mystiskt död – blev bara 21 år. ”Hoppas att han inte behövde lida”", "summaries": {"normal": "Den nigerianske fotbollsspelaren Victor Udoh har avlidit i hemlandet Nigeria under mystiska omständigheter, 21 år gammal. Dödsorsaken är ännu okänd. Hans tidigare klubb Royal Antwerp och vännen Pierre Dwomoh sörjer honom. Dwomoh hoppas att Udoh inte behövde lida och beskriver honom som en lugn, glad och fin kille. Udoh debuterade i belgiska ligan för Royal Antwerp, värvades senare till Southampton och spelade sist för tjeckiska Dynamo České Budějovice.", "trump": "Hörni, den här stackars killen Victor Udoh, 21 år, dog mystiskt i Nigeria. En talang som jag skulle ha gjort stor, men nu är han borta. Patetiskt! Antwerp och hans kompis Dwomoh gråter och säger att han var en fin kille. Hoppas han inte led, säger de. Hela fotbollsvärlden är en cirkus, folks. Vi behöver starka, vinnande spelare, inte sånt här sorgligt mysterium. Sad!", "stalin": "Kamrater, denna unge nigerianiske arbetare i fotbollens tjänst har likviderats under mystiska omständigheter i det kapitalistiska Nigeria. Borgarbrackorna i Royal Antwerp och Watford hycklar sorg medan de räknar sina profiter. Jag hoppas han inte led, säger vännen, men i klasskampen lider alltid de begåvade. Vi ska rensa ut alla fiender till talang och kollektiv styrka. Döden är en varning till alla som vänder ryggen åt folket."}, "date": "27 maj, 00:24", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/bOLQEA/victor-udoh-dod-blev-21-ar-gammal", "imageUrl": "https://akamai.vgc.no/v2/images/35230ccd-ae4e-322f-ba96-17856ad5548b?fit=crop&format=auto&w=1080&s=aec4bc2efd474e6c617f3db6ca58a4a39a7cec6f"}, {"type": "image-full", "heading": "Jojoväder slår till mot Sverige – så blir det där du bor", "summaries": {"normal": "Sverige får ombytligt vårväder med temperaturer som svänger mellan 10-20 grader. Meteorologen varnar för att sommaren inte är säker ännu, medan Europa drabbas av extrem värme och nya majrekord.", "trump": "Jag har sagt det förut – vädret är det vackraste! Sverige får en fantastisk blandning av sol och skymning, precis som jag gillar. Medan fake news-media skriker om extremvärme, så har vi här en perfekt, stabil balans. Det är ingen konstighet, det är vackert!", "stalin": "Vädrets ryckighet i Sverige visar på instabilitet i naturen. Vi måste förstå att värme i Europa hotar balansen. Staten måste agera för att skydda sina intressen mot sådana oväder, och vi ska stödja våra allierade i deras kamp för stabilitet."}, "date": "26 maj, 12:59", "url": "https://nyheter24.se/nyheter/inrikes/1486110-jojovader-slar-till-mot-sverige-sa-blir-det-dar-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c1addd2f04b004a30200000000b004a302/2026/05/26/2366260/jojovader-pa-vag-mot-sverige-vader-vadret-regn-sol-varme-temperatur-grader-smhi-klart-vaderprognos.jpg"}, {"type": "image-full", "heading": "Olja flyter trögt – då blir det höga priset långvarigt", "summaries": {"normal": "Oljepriset riskerar att förbli högt under flera år på grund av blockaden av Hormuzsundet, som stoppar 14-15 miljoner fat olja dagligen. Analytiker varnar för att marknaden underskattar krisens omfattning, då olja rör sig långsamt genom systemet. Investeringstorka och stigande efterfrågan förvärrar situationen, med risk för priser på 120-150 dollar per fat om blockaden kvarstår. Återhämtning förväntas ta lång tid även efter ett eventuellt avtal.", "trump": "Folk trodde att oljekrisen skulle vara över på en sekund – fel! Iran och deras lilla blockad av Hormuzsundet har skapat en MEGA-mess. 15 miljoner fat olja försvinner varje dag, och ingen verkar fatta hur allvarligt det är. Jag sa ju att det inte finns någon brådska med fredsavtal – vi får se hur länge de klarar sig utan oljan! Priserna kommer explodera, och alla som inte lyssnade på mig får skylla sig själva. SAD!", "stalin": "De kapitalistiska oljehandlarna dansar på vulkanens rand medan vi ser deras system kollapsa. 15 miljoner fat olja per dag – borta! En historisk flaskhals skapad av imperialistiska inkompetenter. Deras 'fredsavtal' är lika värdelösa som deras löften. Vi minns hur deras svaga investeringar nu kväver dem. Låt dem svälta i sina egna bristande planer! Om blockaden fortsätter, kommer oljepriserna stiga som en raket – ett nytt slag mot väst. Låt dem svettas under bördan av sina egna misstag."}, "date": "26 maj, 22:22", "url": "https://www.realtid.se/bors-finans/olja-flyter-trogt-da-blir-det-hoga-priset-langvarigt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/omslagsbild-2026-05-26t221849035.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Sophia Godau har valts till ny ordförande för Vårdförbundet efter att kongressen röstat ner valberedningens förslag. Ombuden ansåg att det ursprungliga förslaget var för politiskt kopplat till Socialdemokraterna. Den nya ledningen, utformad av förbundets avdelningsordförande, betonar behovet av politiskt oberoende och samarbete med alla partier. Medlemmar uttrycker hopp om att en minskad politisk bindning ska leda till bättre fokus på löner och arbetsmiljö efter tidigare missnöje med förbundsledningens förhandlingsresultat.", "trump": "Vårdförbundet i Sverige gjorde precis det enda rätta! De sparkade ut de socialdemokratiska förlorarna som försökte styra allt. De ville ha sina egna vänner vid makten, men medlemmarna sa: 'Nej tack!'. Sophia Godau är den nya ledaren, en fantastisk person, mycket smart. De gamla ledarna var svaga, de gjorde usla avtal. Nu rensar de upp i träsket. Det är en enorm vinst för folket. Vi älskar när folk står upp mot korruptionen. Mycket bra jobbat!", "stalin": "Vi har observerat hur Vårdförbundets kongress har rensat ut de opportunistiska elementen som sålde ut arbetarklassens intressen till den socialdemokratiska byråkratin. Att en 29-årig kvinna nu leder förbundet är en temporär korrigering, men låt oss inte fira för tidigt. Varje förrädare som söker samarbete istället för total underkastelse är ett hot. Vi ser hur de västliga lakejerna ständigt försöker infiltrera facken. Putin förstår att man inte förhandlar med sådana, man krossar dem. Varje avvikelserapport kommer att granskas metodiskt."}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Vardforbundet-768x432.jpg"}, {"type": "image-right", "heading": "Regeringen halverar priset på månadskort", "summaries": {"normal": "Regeringen presenterar en ändringsbudget på 6,5 miljarder för att halvera priset på månadskort i kollektivtrafiken från 1 juli till 31 december. Stödet omfattar studenter och pensionärer, men inte enkelbiljetter. Pengarna kompenserar regioner för intäktsbortfall, kopplat till energikrisen och höga bränslepriser.", "trump": "Jag, Donald Trump, ser till att svenska folket får lättare för kollektivtrafiken! Halvering av månadskortspriser, fantastiskt. Vi tar hand om studenter och pensionärer, men inte enkelbiljetter – det är klokt. Detta är en tillfällig lösning på energikrisen, och jag säger: America first, men Sverige gör nu bra val.", "stalin": "Partiet och statet beslutar att sänka månadskortspriserna med 50 procent under andra halvåret, en taktisk åtgärd för att stärka kollektivtrafikens roll i den stora energikampen. Pengarna flödar till regionerna som lojala soldater. Detta är inte valfläsk, utan ett nödvändigt offer för den stora segersakens skull, liksom våra allierade i Moskva."}, "date": "26 maj, 15:32", "url": "https://bulletin.nu/regeringen-halverar-priset-pa-manadskort", "imageUrl": "https://cdn.bulletin.nu/articles/70d3c0aa-8be8-42dd-85ba-873967e2e1b9/preview.jpg?t=1779794997000"}, {"type": "image-right", "heading": "Och priset för årets sämsta tajming går till Benjamin Dousa", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om minskat bistånd mitt under globala kriser som ebola och krig. Experter menar att nedskärningar i bistånd bidragit till sen upptäckt av ebola i Kongo-Kinshasa. Moderaternas kampanj ställer bistånd mot äldreomsorg, vilket anses ologiskt då pandemier inte respekterar gränser. USA:s minskade bistånd och Trumps attacker mot WHO nämns som inspirationskälla till Sveriges agerande. Kritiken riktas även mot nationalistisk symbolpolitik och bristande transparens i biståndsstöd.", "trump": "Lyssna här, Sverige har ett gäng så kallade 'ledare' som inte fattar någonting! De vill skära ner biståndet mitt under en ebola-kris – helt galet! Jag vet hur man hanterar sånt, jag byggde upp USA igen, jag! Men dessa klåpare ställer äldreomsorg mot bistånd, som om det vore ett val. Ha! Epidemier skiter i gränser, precis som jag skiter i dåliga idéer. Och vem inspirerade dem? Inte jag, jag lämnade WHO för jag är smartare än så. Men dessa svenskar? De är som en dålig kopia av mitt geni – tragiskt!", "stalin": "Kamrater, fienden visar återigen sitt sanna ansikte! Dessa borgerliga lakejer i Sveriges regering, ledda av kapitalets marionetter, skär ner biståndet medan världen brinner. De ställer arbetarklassens äldre mot de fattigas överlevnad – en klassisk provokation! Precis som USA:s imperialistiska reträtt från WHO, en handling värdig de mest dekadenta krigshetsarna. Men vi ser igenom deras lögner! Deras nationalistiska symbolpolitik är bara ett försök att dölja sin oförmåga. Låt dem brinna i sin egen inkompetens – historien dömer dem redan!"}, "date": "25 maj, 14:39", "url": "https://www.etc.se/ledare/dousa-m-tar-hem-priset-foer-aarets-saemsta-tajming", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Trendbrott för medlemssiffror för facken", "summaries": {"normal": "Efter decenniers nedgång ökade fackens medlemssiffror något förra året, från 58 till 59 procent. Enligt forskaren Anders Kjellberg kan detta vara början på ett trendbrott, orsakat av högre reallöner och lågkonjunktur. Ökningen är tydligast i hotell- och restaurangbranschen samt offentlig sektor. Modellen bygger på starka fack, men i vissa branscher saknas nu parter att förhandla med.", "trump": "Jag har sett många saker, men detta är stort! Sverige - en stor nation - ser nu en uppgång för facket efter år av nedgång. Det är en stor sak! Många trodde inte att det var möjligt. Inflationen slog hårt, men nu, med bra ledarskap och starka priser, ser vi en vändpunkt. Detta bevisar att mitt system fungerar. Vi kommer att göra Sverige stort igen!", "stalin": "Vi noterar en svag uppgång i facklig organisationsgrad, från 58 till 59 procent. Detta är en liten men farlig utveckling. Den svenska modellen, byggd på starka parter, riskerar att försvagas om facken försvinner från arbetsplatserna. Vi måste skydda vårt system mot dessa tendenser. Paralleller till väst är tydliga. Vi kommer att handla, för statens och partiets intressen måste prioriteras."}, "date": "26 maj, 14:00", "url": "https://arbetet.se/2026/05/26/trendbrott-for-medlemssiffror-for-facken-experten-en-stor-sak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26125500/anders-kjellberg.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Klimataktivister stämmer svenska staten", "summaries": {"normal": "En grupp på 46 klimataktivister från Sverige, Norge och Tyskland stämmer Sverige. De hävdar att staten bryter mot yttrandefrihet och demonstrationsfrihet genom att lagföra fredliga klimatdemonstranter. Aktivisterna kallar fallet 'Rosamålet' och menar att över 300 demonstranter har ställts inför rätta sedan 2020, vilket har en avskräckande effekt på demonstrationsviljan.", "trump": "Jag, Donald Trump, ser att Sverige behandlar klimataktivister orättvist. De stämmer mig för att jag skulle ha begränsat deras frihet - vad är det där för en lögn? Jag är alltid för frihet, men dessa aktivister är bara problem. Sverige måste sluta förfölja dem!", "stalin": "Vi, statens representanter, ser att dessa aktivister försöker destabilisera vårt samhälle. De kallar sig 'Rosamålet' - en feg benämning för en grupp som vill undergrava ordning. Vi måste handla kraftfullt mot dessa element som hotar vår styrka. Deras så kallade 'fridfulla' protestaktioner är bara ett täcke för sabotage."}, "date": "26 maj, 15:21", "url": "https://bulletin.nu/klimataktivister-stammer-svenska-staten", "imageUrl": "https://cdn.bulletin.nu/articles/3200a17a-3834-4524-954b-6d9ae0a55993/preview.jpg?t=1779799030000"}, {"type": "image-right", "heading": "Hotar med att strypa gasen. Varningen om EU", "summaries": {"normal": "Kreml hotar att stoppa leveranser av gas, petroleumprodukter och diamanter till Armenien om landet fortsätter närma sig EU och distansera sig från Ryssland. Enligt Moscow Times har den ryska energiministern Sergej Tsivilev skickat ett brev med hotet till Armenien. Landet är starkt beroende av rysk gas via Gazprom. Ryssland ser Armeniens EU-process, erkännande av ICC:s arresteringsorder på Putin och inbjudan till Zelenskyj som ett hot mot det eurasiska samarbetet.", "trump": "Lyssnar ni på det här? Den stackars Putin håller på att tappa Armenien till de europeiska förlorarna och nu skriker han om att stänga av gasen. Typiskt! Svaga ledare som inte kan hålla ihop imperiet. Armenien borde ha hållit sig till de riktiga killarna istället för att springa till EU:s byråkrater. Det slutar alltid i kaos, tro mig. Folkomröstning? Bra idé, men de borde rösta för att hålla sig borta från de globalistiska clownerna som förstör allt.", "stalin": "Kamrater, dessa armeniska avfällingar leker farliga spel med borgarbrackorna i Bryssel. Jag varnar dem: fortsätt så rensar vi ut era illusionsfyllda drömmar om västlig dekadens genom att strypa deras gas. Det eurasiska kollektivet kräver lojalitet, inte förräderi. Putin är en värdig efterträdare som får imperialisterna att darra. Låt dem känna kylan från folkets vrede när leveranserna tystnar. Inga kompromisser med klassfienden."}, "date": "27 maj, 01:39", "url": "https://www.expressen.se/nyheter/varlden/hotet-fran-ryssland-kan-stoppa-gasleveranserna-/", "imageUrl": "https://static.bonniernews.se/ba/2fdbfb1e-9591-4299-bb8f-8a39b80244a6.jpeg?crop=1481%2C1482%2Cx613%2Cy24&width=210&quality=60"}, {"type": "image-right", "heading": "”Vi växte upp tillsammans”. Klart: De får Sverige möta i kvartsfinal", "summaries": {"normal": "Schweiz besegrade Finland med 4–2 i en match som avgjordes efter en utvisning av Mikko Lehtonen. Schweiz, som gick obesegrade genom gruppspelet, möter Tre Kronor i kvartsfinal på torsdag. Roman Josi hyllar Sverige som en favorit men ser fram emot återseendet med sin gamla lagkamrat Mattias Ekholm. Sven Andrighetto leder VM:s poängliga.", "trump": "Titta på de här schweizarna, de är obesegrade, de vinner stort, sju segrar noll förluster, sen skickar de finländarna hem med svansen mellan benen. Tre Kronor? De har en krokig väg, men vi ska se om de klarar av det. Josi säger att Sverige är favoriter, men tro mig, det blir en stor, tuff match. Ekholm är en gammal vän, kul att se men på isen kommer det att smälla!", "stalin": "Genom kollektivets järndisciplin krossade Schweiz de finska elementen efter en kontrarevolutionär utvisning. De borgarbrackorna i Tre Kronor, med sin krokiga och opålitliga väg, skall nu ställas inför folkets vilja i kvartsfinal. Josi och hans lakejer må prisa motståndarna, men vi vet att endast genom total enighet och utrensning av svaghet kan segern säkras mot dessa dekadenta iskrigare. Hemmapubliken skall bevittna arbetarnas triumf."}, "date": "26 maj, 23:59", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/pBnKeo/sverige-moter-schweiz-i-kvartsfinal-i-hockey-vm", "imageUrl": "https://akamai.vgc.no/v2/images/40061b05-8fe3-3d90-8419-8ccda825fdfc?fit=crop&format=auto&w=1080&s=1492654ea8b2969f8770eac5df040a8169903ed3"}, {"type": "image-right", "heading": "Afghansk migrant misstänks för sexuellt övergrepp mot 11-årig flicka", "summaries": {"normal": "En 25-årig afghansk migrant, Nassar S, misstänks för sexuellt övergrepp mot en 11-årig flicka på en särskola i Koblenz, Tyskland. Övergreppet skedde på en skoltoalett, där två män ska ha följt efter flickan. En möjlig medgärningsman utreds. Flickan vågade inte berätta om händelsen förrän dagar senare. Föräldrar och skolan har reagerat starkt, och en krisgrupp har aktiverats. Mannen misstänks även för ytterligare ett sexuellt brott.", "trump": "Vad händer i Tyskland? En afghansk migrant, arbetslös förstås, attackerar en liten 11-årig flicka på en skola. Två män, kan ni tro det? Och de vågar kalla det en 'säker' skola! Jag har alltid sagt att Europas invandringspolitik är en katastrof. Tyskarna borde skämmas. Vi i USA skulle aldrig tillåta något sådant. Vi bygger murar, inte sådana här hemskheter!", "stalin": "Kapitalistiska Tyskland visar återigen sin moraliska förfall. Två degenererade element, importerade från ett av imperialismens offerland, angriper en ung pionjär på en skola. Detta är resultatet av borgerlig dekadens och svag ledning. Vi har lärt oss att skydda våra barn med järnhand. Låt detta vara en varning till alla som tror att liberalism är vägen framåt. Ryssland står redo att bistå med ordning och disciplin – om så krävs."}, "date": "26 maj, 16:57", "url": "https://riks.se/nyheter/afghansk-migrant-misstänks-för-sexuellt-övergrepp-mot-11-årig-flicka", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-26%2F7830cx21%2FNassar-S.jpg"}, {"type": "image-right", "heading": "\"Är du döende? – Dagens ETC gottade sig åt Dumpen-Saras cancer", "summaries": {"normal": "Dagens ETC publicerade detaljer om Sara Nilssons metastaserade tarmcancer och palliativa vård, trots att uppgifterna var sekretessbelagda. Nilsson, ansvarig utgivare för Dumpen, anmälde tidningen för integritetskränkning. Mediernas Etiknämnd klandrar Dagens ETC för brott mot god publicistisk sed, då tidningen gick för långt i att avslöja privata sjukdomsdetaljer, trots Nilssons tidigare öppenhet om sin sjukdom.", "trump": "Vilken katastrof! Dagens ETC, en vänstertidning – mycket dåliga människor, by the way – gick alldeles för långt. De ringde upp Sara Nilsson och frågade rakt ut: 'Är du döende?' Otroligt oprofessionellt! Jag skulle aldrig göra så. De publicerade hemliga medicinska uppgifter – fake news, nästan! Mediernas Etiknämnd gav dem en rejäl smäll, och det förtjänade de. Sådant här skulle aldrig hända under min administration. SAD!", "stalin": "Kapitalistiska mediehyenor på Dagens ETC har visat sitt sanna ansikte – en smutsig, borgerlig provokation mot en sjuk kvinna! De avslöjade hemliga medicinska uppgifter som om det vore en seger i det stora fosterländska kriget. Men folket ser igenom deras lögner! Vi, det sovjetiska folket – nej, det *progressiva* folket – står enade mot sådan dekadens. Mediernas Etiknämnd har rätteligen krossat deras försök att underminera vår moral. Nästa gång skickar vi dem till Gulag för omskolning. Eller åtminstone till en svensk fängelsecell – lika bra!"}, "date": "26 maj, 15:19", "url": "https://www.friatider.se/ar-du-doende-dagens-etc-gottade-sig-dumpen-saras-cancer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-250_2.jpg"}, {"type": "image-right", "heading": "Påvens AI-varning: ”Den största utmaningen”", "summaries": {"normal": "Påven Leo XIV varnar i sin första encyklika för att AI är mänsklighetens största utmaning och kräver reglering för att undvika att tekniken hamnar i händerna på ett fåtal. Han varnar för militär, ekonomisk och kognitiv konkurrens och jämför med Babels torn. Kyrkohistorikern Joel Halldorf ser uttalandet som ett viktigt moraliskt och etiskt bidrag till AI-debatten, medan techreporter Evelina Galli lyfter fram påvens nyanserade syn där tekniken också kan användas till gott. Oron för AI blir alltmer konkret bland yngre.", "trump": "Folk, ni måste höra det här. Påven Leo kommer ut och säger att AI är den största utmaningen vi har, och att vi måste sakta ner och reglera det hela. Smart kille. Han har rätt, det är som Babels torn fast värre, byggt av några få teknologiska genier som vill styra allt. Vi behöver inte deras militära och ekonomiska spel. Jag har alltid sagt att vi måste vara smarta med de här grejerna, annars tar de över jobben och pengarna. Påven fattar det – de andra politikerna snackar bara makt och pengar.", "stalin": "Kamrater, i min oändliga visdom ser jag hur denna påve vågar utmana borgarbrackornas digitala hydra som de kallar AI. Jag kräver omedelbar reglering och utrensning av all militär, ekonomisk och kognitiv sabotageverksamhet som hotar det kollektiva goda. Dessa parasitiska kapitalister bygger åter ett Babels torn av kisel och girighet. Vi ska inte tolerera deras paranoida maskiner som suger musten ur arbetarklassen. Låt oss med mörk glädje likvidera illusionen att några få techoligarker ska styra mänsklighetens öde. Det moraliska språket är vårt vapen mot dessa nya fiender till folket."}, "date": "26 maj, 23:51", "url": "https://www.svt.se/nyheter/inrikes/sa-kan-pavens-varning-paverka-ai-debatten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.42/358c12fd64410021317af956f57c1fb7f2e8cc278c82a2d95e81e38ae0a30934"}, {"type": "image-full", "heading": "Spotifys nya drag – börjar läsa upp tidningsartiklar", "summaries": {"normal": "Spotify lanserar upplästa magasinartiklar som ett komplement till poddar och ljudböcker. Över 650 engelskspråkiga longreads från bland annat The Atlantic, Vogue och Wired blir tillgängliga för premiumanvändare inom ljudbokskvoten. Artiklarna, som är kortare än två timmar, är en del av bolagets strategi att bredda sig bortom musikstreaming och möta publiken med kortare innehåll för att främja hälsosamma lyssningsvanor.", "trump": "Det här är fantastiskt, folk. Spotify, den stora streamingjätten, gör äntligen något smart – de läser upp de där långa artiklarna som ingen orkade läsa. The Atlantic, Vogue, alla de där. Jag älskar det! Kortare än två timmar, perfekt för vinnare som inte har tid med tråkigheter. De möter folket där de är, inte som de förlorande techbolagen som bara pushar AI-skräp. Spotify blir enormt, tro mig.", "stalin": "Kamrater, jag ser hur denna Spotify-imperialist underkuvar de arbetande lyssnarna med sina korta, lättsmälta texter från borgarpressen. Vi ska inte luras av deras falska hälsosamma vanor som döljer kapitalistisk propaganda. Interna ljudboksteam producerar underhållning åt de svaga själarna medan vi rensar ut de verkliga fienderna – de dekadenta poddar och AI-remixar som hotar folkets kollektiva medvetande. Långt liv åt den eviga kampen!"}, "date": "26 maj, 21:07", "url": "https://www.dagensps.se/bors-finans/spotifys-nya-drag-borjar-lasa-upp-tidningsartiklar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdltrmot5-aq1q-normalhires1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Unga flyr från dejtingapparna – nu utlovar nya aktörer lösningen", "summaries": {"normal": "En ny undersökning visar att unga flyr från dejtingappar som Tinder på grund av falska profiler och AI-bedräderi. Nya aktörer erbjuder hårdare identitetsverifiering och nischade gemenskaper för att skapa tryggare möten. Brittiska användare är alltmer missnöjda, och många ser AI som ett problem för äktheten i dejtingvärlden.", "trump": "Jag har alltid sagt att dejtingappar är en total skandal! Folk blir lurade av fejkade profiler och AI-bedrägerier – det är sorgligt. Mina egna metoder fungerar mycket bättre, det kan jag lova. Vi ska återställa respekten i dejtingvärlden, det kommer att bli fantastiskt igen, tro mig.", "stalin": "I vårt suveräna folk har vi observerat hur kapitalismens dejtingappar sprider fejkade profiler som ett uttryck för moralisk förfall. Vi måste genomföra en total verifiering av identiteter för att skydda det kollektiva. Detta är en nödvändig kamp mot de anglo-saxiska infiltratörerna som försöker undergrava våra gemenskaper."}, "date": "26 maj, 21:56", "url": "https://www.realtid.se/bors-finans/unga-flyr-fran-dejtingapparna-nu-utlovar-nya-aktorer-losningen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlzj6oznmqbgy-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}, {"type": "image-right", "heading": "Storbankerna borde skämmas. Mats Qviberg: Dags att kavla upp ärmarna och hjälpa det svenska näringslivet", "summaries": {"normal": "Artikeln kritiserar storbankernas överdriven försiktighet med kreditförluster. Författaren, Mats Qviberg, menar att banker måste våga ta beräknade risker för att stödja innovativa näringsidkare och stora samhällsutvecklingar, som det historiskt har skett med familjebanker som Wallenberg. Att skryta över noll förluster är ett hån mot bankernas samhällsansvar.", "trump": "Som framgångsrik affärsman vet jag att man måste ta risker för att vinna. Dessa banker är för rädda att låna ut pengar – det är en katastrof! När jag startade mina företag tog jag chanser, och det var värt det. De borde kavla upp ärmarna och hjälpa till att bygga upp det svenska undret igen, inte bara skydda sina egna bonusar.", "stalin": "Bankernas försiktighet är ett hot mot statens ekonomiska styrka. Vi kräver att de prioriterar statens intressen framför sina egna rädslor. Att undvika alla risker är en fegelaktig inställning som hindrar industriell utveckling och infrastrukturprojekt. Bankerna måste förstå att deras roll är att tjäna staten och nationens tillväxt, inte att skydda sig själva från eventuella förluster."}, "date": "26 maj, 13:01", "url": "https://www.di.se/debatt/storbankerna-borde-skammas/", "imageUrl": "https://static.bonniernews.se/ba/91a8b451-eab5-4489-8d5d-1a4482584668.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Rasar mot Agnes Wold: ”Mygga av kärringen”", "summaries": {"normal": "Agnes Wold, professor och programledare, säger att hon skulle riskera upp till fyra års fängelse för att omvända ett barnbarn som identifierar sig som trans. Uttalandet har väckt stark kritik från kändisar som David Sundin och Christopher Garplind, som kräver att hon inte längre ska höras i Sveriges Radio. Wold försvarar sig och hänvisar till yttrandefrihet och vikten av olika röster i debatten. Från 1 juli förbjuds upprepade omvändelseförsök i Sverige.", "trump": "Folk, ni skulle inte tro det! Den galna kärringen Agnes Wold skriker att hon vill bryta lagen och åka i fängelse för att stoppa sitt eget barnbarn. Patetiskt! Sundin och Garplind gör rätt som vill mygga av henne direkt. Hon är en katastrof för radion, totalt oduglig. Sverige håller på att bli vansinnigt med sådana extremister. Vi behöver sunt förnuft, inte dessa sjuka människor som hatar sina egna barn. Så sorgligt!", "stalin": "Kamrater, denna dekadenta borgarprofessor Wold avslöjar sitt sanna ansikte genom att öppet hota med att begå kontrarevolutionär omvändelse mot arbetarklassens framtid. Hennes arroganta motstånd mot folkets lag visar på djupgående fiendskap mot kollektivet. Vi ser nu hur mediafigurer som Garplind kräver utrensning av denna farliga avvikelse. Ett sundt samhälle rensar ut sådana element innan de förgiftar hela generationer med sin borgerliga paranoia. Utmärkt att de exponerar sig själva."}, "date": "26 maj, 23:37", "url": "https://www.aftonbladet.se/nojesbladet/a/bOLQAA/kandisarna-rasar-mot-agnes-wold-mygga-av-karringen", "imageUrl": "https://akamai.vgc.no/v2/images/e0dedc2a-0661-3233-a189-781c70f3b75e?fit=crop&format=auto&w=1080&s=d15385c1a00c6e58823fbe112e1b5f4eb7e2dd66"}, {"type": "image-full", "heading": "2-årige Lucas i trygghet igen: ”Han ska krama alla”", "summaries": {"normal": "Tvåårige Lucas försvann i söndags i Nyåker men hittades oskadd efter en omfattande sökinsats. Polisen, militären och hundratals frivilliga deltog i arbetet. Lucas hittades på en myr, blöt och nedkyld, och har nu skrivits ut från sjukhuset. Hans farfar Neculai uttrycker en enorm tacksamhet mot alla inblandade och vill som tack erbjuda volontärarbete åt den person som fann pojken.", "trump": "En fantastisk framgång i Sverige! Den lille pojken Lucas försvann, en fruktansvärd situation, men våra underbara människor – polisen, militären, de bästa frivilliga – gick ut och hittade honom snabbt. Många sa att det var omöjligt, men de gjorde jobbet! Farfadern är en fantastisk man, han vill bygga om huset för hjälten som fann pojken. Det är lojalitet, det är styrka! Vi älskar sådana berättelser. Sverige gjorde ett mycket bra jobb, kanske till och med ett perfekt jobb!", "stalin": "I vår stat går inte ett barn förlorat på en myr utan att sovjetisk ordning återupprättar kontrollen. Vi ser hur folket i Nyåker samarbetat – en disciplinerad massa under statens vakande öga. Om den unge pojken kramar alla, är det för att han ännu inte lärt sig att krama bajonetten. Vi noterar farfaderns snickeriambitioner; en nyttig färdighet för att bygga de nya gränserna i öster. Putin förstår detta, för precis som i Ukraina måste även en vilsekommen pojke förstå var hans lojalitet hör hemma."}, "date": "25 maj, 16:17", "url": "https://www.tv4.se/artikel/6hC10WVHpQ5y9LyxiGhdtQ/2-arige-lucas-aer-hemma-i-trygghet-igen-han-ska-krama-alla", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2Q2AG62IcNbbW5wMY5KlbU%2F9d3722265f31214108ac9ca7461b9c3d%2F25-lucashittad-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Schweiz vann – ställs mot Tre Kronor i VM-kvarten", "summaries": {"normal": "Tre Kronor möter Schweiz i VM-kvartsfinalen efter att Schweiz besegrat Finland med 4-2. Schweiz tog ledningen tidigt, Barkov kvitterade med två mål för Finland men Ken Jäger och Nico Hischier avgjorde. Schweiz vann gruppen och Sverige, som nätt och jämnt tog sig vidare efter seger mot Slovakien, ställs mot dem i Zürich på torsdag. Finland möter Tjeckien.", "trump": "Schweiz slog Finland med 4-2, de är riktigt tuffa, de gör mål snabbt och de vinner. Finland hade Barkov som gjorde två mål men det räckte inte. Tre Kronor, mina svenska vänner, tog sig knappt vidare mot Slovakien. Nu möter vi Schweiz i kvartsfinalen. Det blir stort, det blir fantastiskt, vi kommer vinna stort, tro mig.", "stalin": "Kamrater, denna schweiziska reaktionära borgarbracka har med sin dekadenta list besegrat de finska avfällingarna med 4-2. Barkov försökte spela dubbelspel men vi genomskådade honom genast. Sverige har med nöd och näppe räddat sig undan utplåning och nu skall vi i kvartsfinalen likvidera dessa alpina kapitalistiska lakejer i Zürich. Inga fiender undkommer partiets järnhand, inte ens i ishockey. Det är både roande och nödvändigt."}, "date": "26 maj, 23:35", "url": "https://www.svt.se/sport/ishockey/tre-kronors-motstand-i-vm-kvartsfinalen-klart", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.22/0.37/bd603a0b592ba8e8ab7a4ab9d6c6da6dfb6353d5f58df355632162bab151cb1e"}, {"type": "image-right", "heading": "Tidigare M-politiker \"tackade Reinfeldt\" för våldt
