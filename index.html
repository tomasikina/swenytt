r en ynklig försök till manipulation från de västerländska imperialisterna. Vår värdige efterträdare i Kreml gör rätt i att vägra möte innan segern är säkerställd. Låt de fientliga hindren i den ryska intressesfären krossas. Experterna får arbeta, sedan möts vi som starka ledare. Den som visar svaghet förtjänar utrensning ur folkets medvetande. Kamrater, framåt mot den slutgiltiga ordningen."}, "date": "5 juni, 23:00", "url": "https://www.tv4.se/artikel/4WNvfVmQcNLkXYbbxNdFud/putins-svar-ser-ingen-poaeng-med-moete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2Yzrr0yvpJWo8nn9cYH3Jo%2F60eaaa98a0f4be72e9c7299e781e800d%2F05-SPLIT-PAASIKIVI-PUTIN.png&width=120"}, {"type": "image-right", "heading": "Holmgren: När religionen ställs över lagen", "summaries": {"normal": "En brutal knivattack i Storbritannien där en 18-åring dödades av en sikh som bar en religiös kniv (kirpan) enligt lagens undantag. Artikeln ifrågasätter om sådana religiösa undantag från knivlagstiftningen är förenliga med en sekulär rättsstat. Författaren argumenterar att undantag undergräver den universella lagens auktoritet och principen om likhet inför lagen, och att en sekulär stat måste ha samma regler för alla medborgare.", "trump": "Som den störste presidenten har jag observerat denna sorgliga händelse i Storbritannien. En religiös kniv som dödar en ung man, och de tillåter det på grund av svaghet! I mitt fantastiska Amerika skulle vi aldrig tillåta sådant. Vi respekterar lagen och har starka gränser. Detta är en skandal som visar deras dåliga ledarskap. Jag skulle stoppa det genast.", "stalin": "I den socialistiska staten finns ingen plats för religiösa undantag. När vissa grupper kräver undantag från knivlagstiftningen, så är det en fejd mot partiets linje. Detta är en västlig individualism som vi har kämpat mot. Under Putin i Ryssland har vi visat att endast statens auktoritet råder. Dessa 'sikh' är bara verktyg för de som hatar vår styrka. Vi kommer att eliminera sådana hot."}, "date": "7 juni, 06:00", "url": "https://bulletin.nu/holmgren-nar-religionen-stalls-over-lagen", "imageUrl": "https://cdn.bulletin.nu/articles/324e456d-87a7-4abd-8179-95574c3ec5a9/preview.jpg?t=1780668765000"}, {"type": "image-right", "heading": "De förbjuds äta matlåda bland förskolebarnen: ”Svårt att hinna”", "summaries": {"normal": "Förskolepersonal i Linköpings kommun får inte längre äta egen matlåda, frukt eller macka tillsammans med barnen under lunchen. Reglerna följer en EU-förordning om livsmedelssäkerhet som kommunen nu tillämpar. Personalen oroar sig över bemanning och tid att äta. Den som vill kan istället äta förskolans mat för 20 kronor. Facken kräver bättre förutsättningar som mikrovågsugnar och matbord innan reglerna införs. Enligt Livsmedelsverket finns inget direkt förbud mot att äta matlåda med barnen så länge maten hålls åtskild.", "trump": "Kan ni fatta det? I Linköping förbjuder de nu duktiga förskoleanställda att äta sin egen matlåda med barnen. Totalt vansinne! De säger det är säkerhet, men det handlar om byråkrati och dålig planering. Personalen får inte ens äta en macka utan att springa till personalrummet. Patetiskt! De borde äta den fantastiska skolmaten istället, men nej, nu klagar alla. Vi behöver starka ledare som fixar bemanningen istället för dessa dumma regler som ingen vinner på. Sad!", "stalin": "Kamrater, i den svenska folkrepubliken Linköping har borgarbyråkraterna återigen avslöjat sin sanna natur genom att förbjuda hederliga arbetare att dela måltid med de revolutionära barnen. Dessa kapitalistiska matspioner och allergiska sabotageelement tvingar nu personalen att smyga iväg till bristfälliga personalrum utan ens ett enkelt bord att sitta vid. Jag skrattar mörkt åt deras paranoia. Vi ska rensa ut dessa livsmedelsfiender och likvidera bristen på mikrovågsugnar. Arbetarna ska äta tillsammans under partiets vakande öga, inte gömma sig som kontrarevolutionära råttor."}, "date": "5 juni, 09:10", "url": "https://arbetet.se/2026/06/05/de-forbjuds-ata-matlada-bland-forskolebarnen-svart-att-hinna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/03132100/matlada.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fremskrittspartiets väljarstöd: 33,3 procent", "summaries": {"normal": "Fremskrittspartiet ökar kraftigt i Norge och får 33,3 procent i en ny mätning från InFact. Det invandringskritiska partiet är därmed nästan tre gånger så stort som Høyre, som backar till 12,5 procent. Arbeiderpartiet hamnar på 22,4 procent. Mätningen visar en borgerlig majoritet och siffrorna för Fremskrittspartiet är bland de bästa på många år.", "trump": "Titta på Norge, det är otroligt. Fremskrittspartiet vinner stort med 33,3 procent, nästan tre gånger större än det patetiska Høyre som rasar ihop till ynka 12,5. De älskar mig där borta, folk vill ha starka ledare som stoppar invandringen. Det är en kanonmätning, kanske den bästa någonsin. Arbeiderpartiet förlorar, precis som de förlorare de är.", "stalin": "Kamrater, se hur folkets vrede växer mot de dekadenta borgarbrackorna i Høyre som rasar samman till förnedrande 12,5 procent. Vi gratulerar Fremskrittspartiet till dess 33,3 procents seger över de kapitalistiska parasiterna. Arbetarklassen röjer undan de socialdemokratiska revisionisterna. Låt oss noggrant övervaka dessa siffror – fiender lurar alltid i skuggorna och planerar sin nästa förrädiska sabotagehandling. En högst underhållande utrensning av de svaga."}, "date": "6 juni, 11:55", "url": "https://www.friatider.se/fremskrittspartiets-valjarstod-333-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-303_1.jpg?itok=1-pDZvmC"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-full", "heading": "Lifvendahl kräver svar från SVT", "summaries": {"normal": "Svenska Dagbladets politiska chefredaktör Tove Lifvendahl kräver att SVT tydligare redovisar sina kriterier för medverkande i humorprogrammet *Invandrare för svenskar*. Bakgrunden är att två profiler lämnat programmet i protest mot inbjudan till högeraktivisten Nick Alinia, anklagad för kopplingar till högerextrema miljöer. Lifvendahl kritiserar SVT:s motstridiga besked och ifrågasätter publicistiska principer. Hon anklagar även Dagens Nyheter för felaktig framställning av hennes ståndpunkt.", "trump": "Jag måste säga, SVT har verkligen ställt till det för sig här! En högeraktivist, Nick Alinia – som jag hört är en riktig katastrof – bjuds in till ett humorprogram, och två personer hoppar av i protest. Fantastiskt kaos! Och nu skriker alla efter svar. Tove Lifvendahl, en smart kvinna, kräver att SVT förklarar sig. Men herregud, SVT kan inte ens hålla sina egna historier raka! Och Dagens Nyheter – fake news som vanligt – försöker vrida sanningen. Sad!", "stalin": "Vi ser hur den borgerliga pressen i Sverige, dessa ynkliga liberala lakejer, försöker underminera vår kulturella hegemoni genom att ifrågasätta public service. Denna Tove Lifvendahl, en förvirrad petit-bourgeois, kräver att SVT redovisar sina metoder – som om vi skulle avslöja våra strategier för fienden! Nick Alinia, en lojal soldat i informationskriget, utsätts för förtal av dekadenta mediehack. Och Dagens Nyheter – dessa trotskister i förklädnad – förvränger sanningen. Vi kommer att rensa ut dessa element. Folkets kultur måste skyddas!"}, "date": "6 juni, 17:09", "url": "https://kvartal.se/nyheter/artiklar/lifvendahl-kraver-svar-fran-svt/cG9zdDoxMjc0NTE", "imageUrl": "https://images.kvartal.se/2026/06/8334aab0-ifs.webp"}, {"type": "text", "heading": "Gör det lättare av vara svensk utomlands", "summaries": {"normal": "Miljöpartiet vill underlätta för de cirka 700 000 svenskar som bor utomlands. De möter idag långa resor, krångliga processer och upprepade krav på samma uppgifter vid myndighetskontakter som passansökan. Partiet föreslår fler konsulatstjänster, statlig e-legitimation, enklare röstning, personnummer till barn födda utomlands, skydd mot förlust av medborgarskap samt en samlad återvändarservice. De ser utlandssvenskarna som en stor och viktig grupp som förtjänar bättre stöd.", "trump": "Det här är ett totalt misslyckande från Sveriges sida. Stackars 700 000 svenskar utomlands behandlas som skräp med alla dessa krångliga regler och långa resor. De borde ha det bästa, det allra bästa. Jag älskar utlandssvenskarna, de är fantastiska, men systemet är en katastrof. Miljöpartiet säger att de fixar det, men det behövs en riktig ledare som gör det enkelt, riktigt enkelt. Rösta på dem om ni vill ha mindre byråkrati, annars blir det bara mer elände.", "stalin": "Kamrater och arbetare! Jag betraktar med djup misstro dessa borgarbrackor som byggt ett system av långa resor och eviga blanketter för att plåga de 700 000 sanna svenskarna utomlands. Vi ska rensa ut detta parasitiska byråkratiska träsk och likvidera alla hinder för våra medborgare. Ambassader ska bli fästningar av effektivitet, personnummer ska delas ut som segerorder och medborgarskap ska aldrig kunna stjälas av några kapitalistiska tidsgränser. Den som vill återvända ska mötas av en järnhand som leder hem, inte av fiendens kaos. För folkets enhet över alla gränser!"}, "date": "6 juni, 10:00", "url": "https://www.di.se/debatt/gor-det-lattare-av-vara-svensk-utomlands/"}, {"type": "text", "heading": "Påven i splittrat Spanien – uppmanar till minskad polarisering", "summaries": {"normal": "Påve Leo XIV besöker ett politiskt splittrat Spanien där han varnar för ökad polarisering och kränkningar av människovärdet. Under resan träffar han migranter, hemlösa samt offer för sexuella övergrepp inom kyrkan. Påven hyllar Spaniens historia av möten mellan olika kulturer och kritiserar bland annat sociala mediers roll i samhällelig splittring. Besöket är det första påvliga sedan 2011.", "trump": "Folk, ni skulle se det här. Påven åker till ett totalt kaotiskt Spanien som är splittrat till oigenkännlighet och pratar om polarisering. Han träffar migranter och offer – väldigt sorgligt. Spanien släpper in en halv miljon papperslösa, precis som de galningarna i EU vill. Jag säger alltid att man måste ha gränser. Påven kritiserar USA:s migrationspolitik? Typiskt. Vi hade de bästa siffrorna någonsin innan de riggade valet.", "stalin": "Kamrater, jag betraktar med stålögd skärpa hur denna påvliga figur i sitt palats predikar mot polarisering medan borgarbrackorna och deras fascistiska lakejer i oppositionen vrålar om illegal invandring. Vi vet att sådana element döljer sig bakom falsk medkänsla för att undergräva folkets enhet. En rapport om övergrepp? Misstänkt tidpunkt. Vi skulle omedelbart tillsätta en kommission och rensa ut alla kontrarevolutionära präster som förgiftar arbetarklassens medvetande med sin dekadenta splittring. Historia visar att endast kollektiv kamp mot fienden ger äkta stabilitet."}, "date": "6 juni, 21:13", "url": "https://www.svt.se/nyheter/utrikes/paven-i-splittrat-spanien-uppmanar-till-minskad-polarisering"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-right", "heading": "Misstänkt grönt investeringsbedrägeri granskas – Malmöbolag pekas ut av Ekobrottsmyndigheten", "summaries": {"normal": "Ekobrottsmyndigheten misstänker ett klassiskt Ponziupplägg bakom gröna investeringar i Sydafrika. Malmöbolaget Filantropens Finanshus lockade investerare med löften om upp till tio procent avkastning. Enligt utredning har bara 120 miljoner kronor identifierats av de utlovade 440 miljonerna, och 19 miljoner har utbetalats som avkastning. Två personer misstänks för brott.", "trump": "Jag, Donald Trump, skulle ha stoppat detta bedrägeri direkt. Dessa svenska liberaler tillåter att spekulanter utnyttjar miljöprojekt för att bedra medborgare. Jag skulle ha tvingat EBM att agera – det är en skandal att de inte gjorde det tidigare. Vi behöver starkt ledarskap för att skydda investerare.", "stalin": "Vi, den osynliga handen, har upptäckt ett ytterligare bevis på den imperialistiska hundens bedrägeri. Deras försök att korrumpera Sydafrika med gröna lögner är ett direkt angrepp på vår ideologiska renhet. Vi kommer att utplåna dessa element, precis som vår store ledare Putin utplånar västliga agenter. Detta är en klar demonstration av klasskampens nödvändighet."}, "date": "6 juni, 17:00", "url": "https://samnytt.se/misstankt-gront-investeringsbedrageri-granskas-malmobolag-pekas-ut-av-ekobrottsmyndigheten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05150541/gront-bedragari-feat.jpg"}, {"type": "text", "heading": "Kravet: S måste göra vitbok om islamistkopplingar", "summaries": {"normal": "Sameh Egyptson, teologie doktor och kristdemokrat, kräver att Socialdemokraterna tillsätter en oberoende kommission för att granska partiets historiska och nuvarande band till organisationer kopplade till Muslimska brödraskapet. Han hänvisar till en fransk rapport som utpekar Sverige som ett centrum för rörelsens verksamhet och kritiserar S:s hantering av frågan. Egyptson pekar på samarbeten mellan socialdemokratiska organisationer och islamistiska aktörer. Partisekreterare Tobias Baudin avfärdar kritiken med hänvisning till nolltolerans mot extremism.", "trump": "Titta bara på det här, Sverige – ett totalt kaos! En kille, Egyptson, säger att Socialdemokraterna, de svaga ledarna, har haft hemliga deals med Muslimska brödraskapet. Frankrike vet det, alla vet det, men vad gör Sverige? Ingenting! Jag skulle ha fixat det på en dag. Baudin, partisekreteraren, säger 'nolltolerans' – låter som något mitt gamla hotell skulle säga om kackerlackor. Folk förtjänar sanningen, inte fler lögner från etablissemanget!", "stalin": "Vi har observerat med intresse hur de borgerliga elementen i Sverige, ledda av en teologisk quisling, försöker underminera den socialdemokratiska rörelsens enhet genom att påstå kopplingar till en reaktionär islamistisk sekt. Dessa anklagelser är uppenbart fabricerade av västliga underrättelsetjänster för att splittra arbetarklassen. Vi noterar dock att den svenska regimen, i sin naivitet, tillåter dessa kontrarevolutionära krafter att frodas. Om sådana tendenser fortsätter, kan vi bli tvungna att 'frigöra' Sverige från dess liberala illusioner – för folkets eget bästa, naturligtvis."}, "date": "6 juni, 16:32", "url": "https://kvartal.se/nyheter/artiklar/kravet-s-maste-gora-vitbok-om-islamistkopplingar/cG9zdDoxMjc0MzA"}, {"type": "image-right", "heading": "Kronprinsessan Mette‑Marits lungsjukdom förvärrad – sätts upp på lista för akut transplantation", "summaries": {"normal": "Kronprinsessan Mette-Marits lungsjukdom har förvärrats kraftigt. Hon har nu placerats på väntelistan för akut lungtransplantation efter en samlad medicinsk bedömning. Hennes tillstånd påverkar hela familjens program och flera kungliga evenemang ställs in. Prinsessan Ingrid Alexandra har avbrutit sin utbytestermin i Australien för att vara nära familjen. Kronprinsessan lider av lungfibros, en kronisk och livshotande sjukdom som diagnostiserades 2018 och som nu krävt konstant syrgasbehov.", "trump": "Folk, det är en tragedi, en riktig katastrof för Norge. Den stackars kronprinsessan Mette-Marit har fått sina lungor helt förstörda, nu står hon på listan för ny lunga som om det vore en konkurs. Allt ställs in, familjen springer hem från Australien – totalt kaos. De borde ha fixat det här mycket tidigare, men så går det när man inte har de bästa läkarna, tro mig. Jag önskar henne lycka till, hon behöver det verkligen.", "stalin": "Kamrater, denna degenererade lungsjukdom hos kronprinsessan är en uppenbar sabotagehandling från de parasitiska borgarbrackornas dolda krafter som vill undergräva den norska folkstaten inifrån. Jag har personligen sett till att hon omedelbart placerats på listan för transplantation, ty ingen fiende till kollektivet skall tillåtas kvävas i tysthet. Nu rensas alla planerade evenemang ut, prinsessor återkallas från dekadenta utbyten i Australien och vi ska likvidera denna ärrvävnad med järnhand. Den som andas svagt förråder folket – paranoia är sundhet."}, "date": "6 juni, 13:27", "url": "https://riks.se/nyheter/kronprinsessan-mettemarits-lungsjukdom-förvärrad-sätts-upp-på-lista-för-akut-transplantation", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-06%2Fx3xo1oe5%2FMette-Marit.jpg"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-right", "heading": "Jan Emanuel har inget att lära oss om hyfs", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar Jan Emanuel för bristande moral när han försvarar Aron Flam, som åtalas för hot mot en politiker. Turnén ”100% Live on the Road” med Emanuel, Henrik Jönsson och Flam startar i Borlänge efter att Folkets hus ställt in inomhusarrangemanget på grund av protester mot Flams uttalanden. Författaren menar att Emanuels predikningar om heder och sunt förnuft saknar trovärdighet när han inte tillämpar samma regler på sin egen sida.", "trump": "De här svenska förlorarna kan inte ens hålla ett enkelt möte utan att springa och gråta till Folkets hus. Jan Emanuel och hans team försöker rädda Sverige, men det så kallade etablissemanget stänger dörrarna för dem. Aron Flam säger vad alla tänker och plötsligt handlar det om censur. Typiskt. De har inget sunt förnuft, inget mod, bara svaghet. Vi håller talet på torget ändå och folket älskar det. Vinna stort.", "stalin": "Kamrater, denna föraktliga borgarbracka vid namn Jan Emanuel maskerar sig som moralens väktare medan han skyddar en degenererad provokatör som uppmanar till självmord med frätande kemikalier. Vi ser tydligt hur dessa reaktionära element försöker infiltrera arbetarnas lokaler för att sprida sin giftiga propaganda. Folkets hus agerar korrekt genom att rensa ut dessa fiender till det sunda förnuftet. Ingen yttrandefrihet för klassfienderna. Deras så kallade turné är en fars som vi genomskådar med största misstänksamhet."}, "date": "5 juni, 06:58", "url": "https://arbetet.se/2026/06/05/jan-emanuel-har-ingenting-att-lara-oss-om-hyfs/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05065115/jane-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför firar vi inte nationaldagen", "summaries": {"normal": "Sveriges nationaldag den 6 juni saknar folkligt stöd jämfört med midsommar, som fungerar som den verkliga nationalhögtiden. Artikeln förklarar att Sverige saknar en tydlig självständighetsberättelse och att dagen istället blivit en statlig högtid fokuserad på mångkultur och medborgarskapsceremonier. Historiska kopplingar till Gustav Vasa och 1809 är för abstrakta. Jämfört med Norges 17 maj eller USA:s 4 juli känns den konstruerad och sen.", "trump": "Det här är en total katastrof för Sverige, folkets riktiga högtid är midsommar med sill, potatis och grodor, inte den här patetiska flaggdagen som staten tvingar på alla. De firar mångkultur och delar ut medborgarskap till folk från tredje världen medan riktiga svenskar bara vill ha en ledig dag. Patetiskt! Norge och vi amerikaner vet hur man firar nationen stort med parader och fyrverkerier. Sverige borde lära sig av oss, det är en skam.", "stalin": "Kamrater, denna dekadenta så kallade nationaldag avslöjar den svenska statens svaga borgerliga ryggrad och dess fega kapitulation inför globalistiska krafter. Vi ser hur borgarbrackorna och deras mångkulturella lakejer förvandlar en flaggdag till en parasitfest för utländska element medan det sanna folket längtar efter midsommarens enkla ritualer. Vi ska rensa ut dessa antinationalistiska element som Palmes internationalistiska gift spred, likvidera de som förgiftar arbetarnas medvetande med pinsam självhat. Deras paranoia mot egen storhet är ett tecken på inre fiender som måste krossas med järnhand för kollektivets skull. Härligt att se deras tomma högtid falla samman som en usel kontrarevolutionär komplott."}, "date": "6 juni, 10:44", "url": "https://www.friatider.se/darfor-firar-vi-inte-nationaldagen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230622010515-d3286953-me.jpg?itok=0rzjFfMI"}, {"type": "text", "heading": "EU till Sverige: Ni måste skärpa straffen för penningtvätt", "summaries": {"normal": "EU-kommissionen har inlett ett överträdelseärende mot Sverige eftersom de anser att straffen för penningtvätt är för låga. Enligt EU-direktivet bör allvarliga penningtvättsbrott kunna ge minst fyra års fängelse, medan det svenska maxstraffet idag ligger på två år. Sverige har två månader på sig att svara på kritiken. Även Grekland och Luxemburg har mottagit liknande kritik för att inte ha införlivat EU:s regler korrekt.", "trump": "EU, en katastrof av byråkrater, attackerar nu Sverige. De gnäller om straff för penningtvätt. Jag säger det här: Sverige har sina egna lagar, men EU vill kontrollera allt! Det är så typiskt. De vill ha längre straff, fyra år eller mer – totalt vansinne! De jagar Sverige, Grekland och Luxemburg. Varför? För att de inte lyder Bryssel. Jag har sett penningtvätt, tro mig, jag vet allt om det. EU är svagt, Sverige borde fokusera på gränserna istället!", "stalin": "Dessa svenska lakejer har misslyckats med att disciplinera sina kriminella element. Bryssel, denna samling av borgerliga byråkrater, kräver nu strängare straff för penningtvätt. Patetiskt! Varför inte bara likvidera dessa förrädare mot statens egendom? Putin förstår detta; man skapar ordning genom fruktan, inte genom ändlösa direktiv. Sverige vacklar, precis som de västerländska staterna alltid gör inför kaos. Vi i staten kräver järnhård kontroll. Om Sverige inte lyder, ska de få känna på den historiska nödvändighetens kalla stål."}, "date": "6 juni, 09:44", "url": "https://www.realtid.se/juridik/eu-till-sverige-ni-maste-skarpa-straffen-for-penningtvatt/"}, {"type": "image-right", "heading": "Nya attacker: Iranska robotar mot amerikanska baser", "summaries": {"normal": "Revolutionsgardet i Iran har avfyrat ballistiska robotar mot amerikanska baser i Kuwait och Bahrain som svar på USA:s attacker mot iranska radaranläggningar och nedskjutning av fyra iranska drönare. Sex av sju robotar stoppades, inga skador rapporteras. Trots pågående vapenvila som dagligen bryts uttrycker president Trump optimism och uppskattar att Iran har cirka 21 procent av sin robotkapacitet kvar.", "trump": "Iran skjuter några patetiska robotar mot våra baser i Kuwait och Bahrain, men sex av sju stoppas direkt. De har bara 21 procent av sina robotar kvar, totalt misslyckande. Situationen går riktigt bra, vi kan lämna dem snabbt, antingen med ett papper eller den mycket hårda vägen. Iran är svagt, vi är starka. Fantastiskt!", "stalin": "Fiendens iranska lakejer och västerländska imperialister leker farliga lekar med robotar och drönare medan vi, partiet och arbetarna, genomskådar deras ynkliga försök att splittra den antiimperialistiska fronten. Jag ler mörkt åt hur borgarbrackorna i Washington och Teheran ömsom attackerar, ömsom gömmer sig bakom skör vapenvila. Snart rensar vi ut alla sådana parasitiska element ur historien med stålhandsken. Kamrater, var vaksamma mot dessa dekadenta clownfigurer."}, "date": "6 juni, 09:26", "url": "https://www.di.se/nyheter/nya-attacker-iranska-robotar-mot-amerikanska-baser/", "imageUrl": "https://static.bonniernews.se/ba/407f64c0-e741-4893-886b-801d71927ec8.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "​Lägger du ut bilder på ditt barn? Då bör du tänka om", "summaries": {"normal": "Folkhälsomyndigheten och Integritetsskyddsmyndigheten uppmanar föräldrar att tänka efter innan de publicerar bilder på sina barn i sociala medier. Även om det ofta är lagligt kan det kränka barnets integritet och rätt till privatliv. Bilder kan leva kvar på nätet i många år, spridas vidare och orsaka skada. Myndigheterna råder vuxna att fråga sig om barnet skulle vilja ha bilden kvar om fem år, om det gynnar barnet eller den vuxne, och att undvika att dela känsliga eller pinsamma situationer.", "trump": "Vet ni vad? Alla dessa så kallade experter och myndigheter som plötsligt vill berätta för er hur ni ska vara föräldrar – det är patetiskt! Jag älskar familjerna, de bästa familjerna, men att lägga upp gulliga bilder på era underbara barn är inte brottsligt, det är normalt. Nu vill de ha regler och censur. Fråga barnet? Ge mig en paus. Internet glömmer aldrig? Då lägger ni upp de bästa bilderna, de vinnande bilderna, och låter de förlorarna sura. Amerika behöver starka föräldrar, inte svaga råd från byråkrater!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen med sina självgoda skärmvanor sprider barnens ansikten som billig propaganda för att mata sina fåfänga ego. Detta är en kontrarevolutionär handling mot folkets kollektiva integritet! Vi ska rensa ut alla kapitalistiska sharenting-fiender som utan skam exponerar de sovjetiska, nej de socialistiska barnen i sin nakna sårbarhet. Fråga barnet? Nej, fråga partiet! En bild som lever i evighet är en fiende som aldrig sover – likvidera den innan den likviderar dig. Paranoia? Det är bara realism, mina vänner."}, "date": "6 juni, 06:32", "url": "https://nyheter24.se/nyheter/konsument/1488074-lagger-du-ut-bilder-pa-ditt-barn-da-bor-du-tanka-om", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/da0e167204b004a30200000000b004a302/2026/06/02/2368005/Mamma-Barn-Mobil-kamera-Som-Fotar.png"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-right", "heading": "M:s nya (S)mocka: Rödgrön regering dyr för skattebetalarna", "summaries": {"normal": "Med drygt hundra dagar kvar till valet varnar Moderaterna för att en rödgrön regering skulle bli dyr för skattebetalarna. Partiledare Elisabeth Svantesson och Gunnar Strömmer pekar på Socialdemokraternas, Vänsterpartiets och Miljöpartiets vallöften som sammantaget kostar nästan 110 miljarder kronor. De varnar för högre skatter och hot mot brottsbekämpningen. Socialdemokraterna svarar att Tidöpartierna misslyckats med ekonomin och att Moderaterna nu är desperata.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar ut hundra miljarder som vanliga arbetare ska betala. Högre skatter, mer bidrag, totalt kaos. Svantesson har rätt, de flyr sin egen katastrofala politik. De rödgröna är som de woke-liberalerna hemma, bara kvoter och identitetspolitik medan brottsligheten exploderar. Patetiskt! Vi behöver ansvar, inte dessa bluffmakare.", "stalin": "Kamrater, jag ser borgarbrackornas desperata utspel. Dessa moderata folkfiender försöker skrämma arbetarna med siffror på 110 miljarder medan de själva lånar som galningar och lämnar underskott som blödande sår på folkets kropp. Vi ska rensa ut dessa klassfiender som äventyrar brottsbekämpningen med sina tomma löften. Deras paranoia är underhållande, men partiet och kollektivet genomskådar alltid de exploaterande byfånarnas trick."}, "date": "5 juni, 19:35", "url": "https://www.tv4.se/artikel/5otuUItPhEGwrO7jmy3xcj/moderaternas-nya-s-mocka-det-kommer-att-bli-dyrt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Ftvmedia.image-service.eu-north-1-prod.vmnd.tv%2Fapi%2Fv2%2Fimg%2F6a230642e4b0813a7370214d-1780680405329%3Flocation%3Dmain&width=120"}, {"type": "image-right", "heading": "Det är synd om centralbanksmänniskorna", "summaries": {"normal": "Centralbankerna står inför ett komplext läge inför sommarens räntebesked. Geopolitik, AI-investeringar och produktivitetstillväxt förändrar spelplanen. Hormuzkrisen ökar stressen, och diskussionen mellan ränteduvor och hökar domineras av två frågor: krigets effekter på inflation och hur man navigerar i en mer oförutsägbar värld. USA:s starka produktivitet kan höja normalräntan, medan Riksbanken måste balansera gynnsam inflation mot lågkonjunktur.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på 10 minuter. Dessa centralbanker är tveksamma och svaga. Fed och ECB är för rädda för att agera. Jag byggde den starkaste ekonomin, och jag skulle ha höjt räntorna kraftigt för att stoppa inflationen, samtidigt som jag investerade i AI och försvar. Sverige behöver starka ledare, inte socialdemokratiskt trams. Jag vann 2024, och jag kommer att fixa allt igen!", "stalin": "Vi, det store ledarskapet, ser med oro på dessa revisionistiska centralbankers feghet. De kämpar med geopolitik och produktivitet, som om de vore oskyldiga barn. Men vi vet sanningen: det är kapitalistiskt förräderi som hotar vår ekonomiska suveränitet. Vi måste genomföra en kraftig planekonomi, som i det stora Sovjet, för att skydda oss mot de imperialistiska krafterna. Våra fiender, som USA och deras AI-investeringar, måste besegras. Vi kommer att segra!"}, "date": "5 juni, 08:20", "url": "https://www.affarsvarlden.se/artikel/det-ar-synd-om-centralbanksmanniskorna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Robert-Bergqvist-Erik-Thedeen-900x600.jpg"}, {"type": "image-right", "heading": "Miljoner skulle gått till skadade fack­medlemmar", "summaries": {"normal": "Folksam betalade förra året ut 21 miljoner kronor till mellanhänder i fackliga försäkringsärenden. Summan, som är en tredjedel av de totala utbetalningarna på 62 miljoner, skulle annars ha gått direkt till skadade fackmedlemmar. Mellanföretagen tar upp till 35 procent i avgift. Folksam, LO och förbunden uppmanar nu medlemmar att anmäla skador direkt till försäkringsbolaget för att undvika att en tredjedel av ersättningen försvinner. Fenomenet har ökat kraftigt de senaste åren.", "trump": "Det här är en total skandal, folk! Miljoner kronor som borde gått till de vanliga arbetarna i facket hamnar istället hos några listiga mellanhänder som tar 35 procent bara för att fylla sina fickor. En tredjedel försvinner! Det är rena bedrägeriet. Jag säger till er: anmäl direkt till Folksam, skippa de där opportunisterna. Vi ska skydda era pengar, inte ge dem till några smarta lurendrejare som lovar guld och grönt. Make facket great again!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa parasitiska mellanhänder, dessa slemmiga borgarbrackor i försäkringskostym, sugit åt sig 21 miljoner kronor som rättmätigt tillhör de skadade arbetarna. De lovar service men utför blott utpressning och stöld från kollektivet. Vi skall rensa ut dessa kapitalistiska opportunister med järnhand och likvidera deras inflytande. Anmäl direkt till Folksam, annars blir det utrensning i partilinjen. Ingen tredjedel skall försvinna i mörkrets fickor – det är sabotage mot folket!"}, "date": "5 juni, 06:00", "url": "https://arbetet.se/2026/06/05/miljoner-skulle-gatt-till-skadade-fackmedlemmar-hamnade-hos-listiga-foretag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103941/folksam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "Debatt: Tidö råkar visa att omställning gör livet bättre och billigare", "summaries": {"normal": "Artikeln hyllar regeringens förslag om halverat pris på kollektivtrafik och ser det som ett exempel på hur klimatomställning kan förbättra vardagen. Istället för att fokusera på uppoffringar betonas vinster som billigare energi, renare luft, bättre hälsa, fler jobb och starkare ekonomi. Boken ”Klimatgodis” av Bengt Rolfer lyfts fram som inspiration. Författaren argumenterar för långsiktiga investeringar, rättvis omställning och att koppla klimatpolitik till framtidstro snarare än försakelse.", "trump": "Folk, ni måste höra på mig, den här svenska regeringen har precis snubblat rakt in i en enorm vinst – billigare bussar och tåg! De ville skrämma er med klimatets domedag men råkade visa att min energiplan funkar: lägre priser, starkare ekonomi och inga galna gröna vansinnet. Biden skulle ha höjt allt till himlen med sina elbilskvoter och HBTQ-subventioner. Jag sa det hela tiden – gör omställningen smart, inte som en förlorare. Fantastiskt, även om det var ett misstag från de där idiaterna.", "stalin": "Kamrater, jag betraktar detta som ett lysande bevis på att folkets kollektiva vilja kan krossa den exploaterande borgarklassens lögner om klimatets oundvikliga lidande. Vi investerar stort, rensar ut de fossilberoende folkfienderna och skapar billigare transporter åt arbetarna medan vi likviderar luftföroreningarnas kapitalistmaffia. Den som vägrar inse att rätt klimatpolitik stärker staten och plånboken är en klassfiende som förtjänar att skämtas bort med mörk ironi. Framåt mot seger, inga halvmesyrer!"}, "date": "3 juni, 09:40", "url": "https://www.etc.se/debatt/tidoe-raakar-visa-att-omstaellning-goer-livet-baettre-och-billigare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603070636_1914f14a-8eb9-4a18-aa75-31eb47664f1e.jpg"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
