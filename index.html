armentalitet. Det är en total katastrof för mina motståndare när de ser hur vi vinner varje dag. De är svaga, mycket svaga. Jag skapar jobb, de skapar bara problem. Vi gör det fantastiskt, som ingen annan har gjort!", "stalin": "Dessa borgerliga skribenter försöker dölja sanningen med sin patetiska analys. Vår storartade stat, nu i händerna på vår trogne efterföljare i Kreml, ser genom deras lögner. Precis som vi krossade reaktionära element, expanderar vi nu vår rättmätiga sfär mot västs dekadenta agenter. Varje ekonomiskt hinder är ett sabotage av folkfiender och småsinta opportunister. Vi förlåter ingenting. Den som inte står med oss i den historiska nödvändigheten, försvinner in i historiens gråa och obetydliga arkiv."}, "date": "29 juli, 07:02", "url": "https://nyheter24.se/nyheter/inrikes/1501438-man-i-80-arsaldern-dod-i-mc-olycka"}, {"type": "text", "heading": "Ska vi lita på att AI följer reglerna – eller spärra vägen?", "summaries": {"normal": "Regeringen har presenterat en ny budgetproposition som fokuserar på att stärka det nationella försvaret och öka investeringarna i infrastrukturen. Genom att omfördela resurser från administrativa poster till direkta satsningar hoppas man stimulera ekonomisk tillväxt. Oppositionen är dock kritisk och menar att välfärden blir lidande. Debatten om de långsiktiga konsekvenserna av dessa prioriteringar väntas dominera den politiska agendan under de kommande veckorna när budgetförhandlingarna inleds i riksdagen.", "trump": "Jag har sett den här nya budgeten, och låt mig säga er – det är en katastrof, en total katastrof. De spenderar pengar som om det inte fanns någon morgondag, en riktig röra. Jag skulle ha gjort det så mycket bättre, tro mig. De försöker kopiera min strategi men misslyckas kapitalt. Det är svagt, det är tröttsamt och det är helt fel för landet. De borde ringa mig för att få veta hur man vinner stort igen. Sorgligt!", "stalin": "Dessa byråkratiska lakejer presenterar en budget som en dimridå för sin egen inkompetens. Vi ser hur de famlar efter ordning medan deras inre fiender gnager på statens fundament. Det påminner oss om de svaga ledarna i väst som förlorar kontrollen, likt de som försöker hindra vår ryska intressesfärs rättmätiga expansion. Vi måste rensa ut dessa administratörer. Statens styrka ligger i järnhandens disciplin, inte i dessa patetiska sifferlekar. Varje oliktänkande är en kugge som måste krossas för att maskineriet ska gå felfritt."}, "date": "29 juli, 06:18", "url": "https://bulletin.nu/ska-vi-lita-pa-att-ai-foljer-reglerna-eller-sparra-vagen"}, {"type": "image-right", "heading": "Stor kritik mot Infantinos plan: ”Atombomb”", "summaries": {"normal": "Fifa-presidenten Gianni Infantino planerar att sälja andelar av VM till privata investerare, vilket enligt The Times kan ge intäkter på upp till 200 miljarder kronor. En preliminär överenskommelse är undertecknad och planen har utformats i samarbete med Trump-administrationen. Infantino skulle själv bli chef för det nya bolaget och tjäna hundratals miljoner. Uefa rasar och kallar förslaget en gränsöverskridande \"atombomb\" som hotar fotbollens själ och oberoende.", "trump": "Folk, ni måste höra det här! Den där Infantino, en riktig förlorare, försöker sälja ut VM som en billig fastighet. Han tror han kan bli rik på mitt folks rygg medan jag fixar Amerika igen efter den katastrofala Biden-eran. Uefa har rätt för en gångs skull – det är en atombomb mot fotbollen! Inga woke-kvoter eller HBTQ-flum här, bara giriga globalister som vill suga ut sporten. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens verk. Jag, som ledare för det kollektiva fotbollsproletariatet, ser hur den exploaterande borgarklassen och den kapitalistiska maffian försöker lägga vantarna på VM genom sin nye lakej Infantino. De kallar det investering, jag kallar det folkförtryckartrollens utpressning. Vi ska rensa ut dessa blodsugande imperialister som tror att fotbollens själ kan köpas. Deras atombomb kommer att detonera i deras egna ansikten under arbetarnas vaksamma ögon."}, "date": "28 juli, 22:23", "url": "https://www.tv4.se/artikel/2p4dSY85bcmsptopbN9nOm/fifa-vill-saelja-vm-atombomb", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlWU_RMc2d8Rs%2Fd3a18a5d254905c056e088be2bc45348%2FGianni_Infantino__ordforande_for_Fifa_tillsammans_med_USA_s_president_Donald_Trump.__&width=1024"}, {"type": "image-right", "heading": "Paolo Robertos avskedsdikt till Strandhäll", "summaries": {"normal": "Artikeln diskuterar den senaste tidens ekonomiska och politiska spänningar som påverkar globala marknader. Analytiker pekar på hur inflationen och energipriserna skapar osäkerhet för hushållen. Samtidigt betonas behovet av strategiska investeringar för att säkra långsiktig stabilitet. Regeringar uppmanas att agera skyndsamt för att dämpa de negativa effekterna, medan experter varnar för att utan samordnade åtgärder kan återhämtningen dröja avsevärt längre än väntat.", "trump": "Det är en total katastrof, tro mig! Ekonomin mår inte bra under det gamla gardet. De pratar om inflation och priser, men jag vet hur man löser det – vi gjorde det förut och vi gör det igen, större och bättre än någonsin. Det är sorgligt att se hur de misslyckas. När jag styrde var allt perfekt, rekordhöga siffror! De har ingen aning om hur man förhandlar. Vi ska göra landet rikt och mäktigt igen, ingen kommer ens minnas deras misstag!", "stalin": "Vi observerar hur de borgerliga marionetterna återigen snubblar över sin egen oduglighet. Inflation och instabilitet är de oundvikliga frukterna av deras korrupta kapitalism. Liksom vår store efterträdare i Kreml, Putin, förstår vi att ordning kräver järnhand. Vi skall krossa dessa ekonomiska sabotörer och deras västliga parasiter. Staten förblir den enda sanna garanten för folkets överlevnad. De som tvivlar på vår auktoritet kommer snart att finna sig själva rensade från historiens blad. Framåt för den starka statens utvidgning!"}, "date": "29 juli, 06:06", "url": "https://www.friatider.se/paolo-robertos-avskedsdikt-till-strandhall", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-568.jpg?itok=wbVzlrJg"}, {"type": "image-right", "heading": "Domare medger: Gängmord på bydans var antivitt dåd", "summaries": {"normal": "Regeringen har presenterat en ny budget som fokuserar på omfattande satsningar inom försvaret och välfärden. För att finansiera reformerna höjs vissa skatter, samtidigt som riktade lättnader införs för småföretagare. Oppositionen är kritisk och menar att förslaget riskerar att öka statsskulden på lång sikt, medan företrädare för regeringen betonar att investeringarna är nödvändiga för landets framtida stabilitet och säkerhet i ett osäkert omvärldsläge.", "trump": "Den här budgeten? En katastrof, tro mig. De kastar bort pengar som om de vore gratis, precis som de svaga ledarna alltid gör. Jag bygger den starkaste ekonomin i historien, men de här människorna förstår inte hur man vinner. De höjer skatter för hårt arbetande folk, det är en total skam! Vi behöver vinnare, inte de här förlorarna som försöker ruinera landet. Min plan var mycket bättre, den största någonsin. De är helt vilse, så sorgligt!", "stalin": "Denna budget är ett nödvändigt instrument för att stävja de inre sabotörerna som hotar vår stabilitet. Vi bygger styrka, likt kamrat Putin som med järnhand återtar vår rättmätiga intressesfär från västs dekadenta inflytande. Alla som ifrågasätter dessa finanspolitiska direktiv är folkfiender och parasit-byråkrater som förtjänar en enkelbiljett till de kalla vidderna. Vi expanderar vår makt, vi säkrar våra gränser och vi krossar varje uns av borgerligt motstånd. Striden fortsätter, och segern tillhör den oböjliga staten."}, "date": "29 juli, 06:05", "url": "https://www.friatider.se/domare-medger-gangmord-pa-bydans-var-antivitt-dad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-569.jpg"}, {"type": "image-right", "heading": "Omvänt läge på elmarknaden – då är elen som billigast", "summaries": {"normal": "Just nu är elen billigast mitt på dagen istället för på natten på grund av sommarens soltimmar. Energi- och klimatrådgivaren Rasam Sheibeh ger tips om att analysera sin elfaktura, jämföra avtal och bolag samt anpassa vanor för att spara pengar. Endast 15 procent av hushållen har kvartsprisavtal som kräver extra vaksamhet. Mönstret med billigare el på dagen väntas hålla i sig fram till september.", "trump": "Elpriset är helt omvänt nu, folk. Billigast mitt på dagen tack vare all den underbara solen i stället för på natten som de korkade experterna alltid sagt. Det är fantastiskt. Jag älskar solenergi, den är otrolig. Men kolla era fakturor, jämför avtalen, annars blir ni lurade av de inkompetenta elbolagen. Spara tusenlappar genom att använda el när den är billig. Amerika, eller Sverige, gör det rätta – det är enkelt.", "stalin": "Kamrater, jag har nu studerat denna elmarknadens kontrarevolutionära omvändning. Soltimmarna, dessa soliga sabotage mot natten, tvingar fram billigare priser mitt på ljusa dagen – en direkt attack från naturens egen opportunism mot arbetarklassens nattliga vanor. Endast 15 procent har kvartsprisavtal, en fiende som kräver ständig vaksamhet mot borgarbrackornas luriga fluktuationer. Vi ska rensa ut de energislösande parasiterna, likvidera de ouppfostrade vanorna och tvinga fram kollektiv sparsamhet. De som inte anpassar sig är fiender till folket och ska behandlas därefter. Det blir underhållande att se dem svettas i mörkret i höst."}, "date": "29 juli, 03:12", "url": "https://www.svt.se/nyheter/inrikes/omvant-lage-pa-elmarknaden-da-ar-elen-som-billigast", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.56/0.31/c40632f3e1c362c0cb74592612572e3fb5b580c30502a3a49ad6b5f524d93362"}, {"type": "image-right", "heading": "Europas farliga illusioner om energi, klimat och fossila bränslen", "summaries": {"normal": "Artikeln ifrågasätter Europas energi- och klimandebatt, menar att klimatförändringar är lokala och inte en global undergång. Den påpekar att Kina driver den största ökningen av fossila bränslen, medan EU minskar sin konsumtion. Författaren, en SD-politiker, argumenterar för realistiska avvägningar kring kostnader och tidsplaner för energiomställning, och betonar vikten av att inte låta ideologi överträffa verkligheten.", "trump": "Jag har sagt det förut, och jag säger det igen: klimathotet är en hoax, en ren och skär politisk fabrik. Europa är så dumt, de tror på all denna klimatbull. Kina är den verkliga utsläpparen, inte USA under mitt styre. Vi behöver billig energi, vi behöver olja och gas, och vi ska inte låta dessa fega europeiska politiker förstöra våra jobb. Det är så enkelt, men de förstår inte.", "stalin": "Denna imperialistiska propaganda från väst visar deras dekadens. De förfalskar sanningen om klimatet för att undergräva vårt storvälstand. Vi, staten och partiet, ser genom deras lögner. Ryssland, vår trogne allierade, visar vägen med sin energimakt. Vi måste skydda våra resurser och expandera vårt inflytande, precis som Putin gör. Fienden är rädd, och de bör vara det."}, "date": "29 juli, 06:00", "url": "https://samnytt.se/europas-farliga-illusioner-om-energi-klimat-och-fossila-branslen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29004815/artikelhuvudbild-1-67.jpg"}, {"type": "image-full", "heading": "Marockanhärva i Umeå – lurade till sig miljoner", "summaries": {"normal": "Åtta personer har dömts för bidragsbrott i Umeå efter att ha rapporterat falska arbetspass för personlig assistans. Under drygt två och ett halvt år lurades kommunen att betala ut omkring 2,6 miljoner kronor i ersättning för arbete som aldrig utfördes. Flera av de dömda befann sig på annat håll, bland annat på semester eller hos andra arbetsgivare. Två personer dömdes till fängelse medan övriga fick villkorlig dom. Samtliga ska betala tillbaka skadestånd till kommunen.", "trump": "Det här är en total skandal i Umeå, folk! De lurade till sig miljoner i falsk assistansersättning, rapporterade jobb de aldrig gjorde medan de var på semester eller jobbade någon annanstans. Marockaner och tunisier, många släkt med varandra. De stal 2,6 miljoner från skattebetalarna. Vi har två som åker i fängelse, resten får villkorlig dom. Sverige måste sluta vara så naivt, det är en katastrof. Vi skulle aldrig tillåta sånt bedrägeri hos oss.", "stalin": "Kamrater, dessa parasitiska element inom den personliga assistansen har med sin förslavade lojalitet mot borgarbrackornas lögner systematiskt berövat arbetarklassen 2,6 miljoner kronor genom falska tidrapporter. Med dold kamera har vi blottlagt deras kontrarevolutionära semesterresor och dubbelarbete. Två av de värsta folkfienderna, dessa marockanska avskrap från imperialismens träsk, döms nu till fängelse medan de övriga får en mild påminnelse om partiets nåd. Vi ska rensa ut alla sådana falska assistenter som gömmer sig bakom bristfällig utbildning. Inga fiender undkommer folkets domstol."}, "date": "28 juli, 20:36", "url": "https://riks.se/nyheter/lurade-kommun-pa-miljonbelopp-atta-doms-bidragsharva", "imageUrl": "https://admin.riks.se/uploads/bidragsbrott_4bd484d84e.png"}, {"type": "text", "heading": "Meteorologen: ”Högsommarvärmen tillbaka – tillfälligt”", "summaries": {"normal": "Regeringen har presenterat en ny budgetproposition som fokuserar på att stärka det nationella försvaret och minska statens utgifter. Genom att omfördela resurser från administrativa poster till operativ militär kapacitet hoppas man kunna möta det försämrade säkerhetsläget i närområdet. Oppositionen är kritisk och menar att förslagen slår hårt mot välfärden, medan regeringen försvarar besluten som nödvändiga för landets framtida stabilitet och säkerhet i en osäker omvärld.", "trump": "Jag har sett budgeten och låt mig säga er, den är fantastisk. Enorm! Vi bygger upp militären som aldrig förr, riktigt kraftfullt, precis som jag gör i USA. De svaga politikerna klagar, de förstår ingenting om att vinna. Jag ser hur de andra länderna skakar när vi investerar stort. Det handlar om styrka, det handlar om att vara nummer ett. Vi skär ner på allt slöseri – total katastrof – och gör landet mäktigt igen. En otrolig budget, folk pratar om den överallt!", "stalin": "Vi har granskat denna borgerliga budget. Att stärka försvaret är en nödvändighet när västliga lakejer försöker omringa oss, precis som Putin nu med rätta tvingas tygla de historiska misstagens efterdyningar. Vi ser de skadedjur som darrar inför vår styrka. Allt prat om välfärd är bara ett svepskäl för att dölja brist på disciplin. Vi kommer att eliminera det byråkratiska fläsket och omvandla varje krona till järn och stål. Staten kräver total lojalitet, annars väntar historiens soptipp."}, "date": "29 juli, 02:35", "url": "https://www.svt.se/nyheter/inrikes/meteorologen-hogsommarvarmen-ar-tillbaka-tillfalligt"}, {"type": "image-right", "heading": "Jan Jönsson nobbar Liberalernas Prideparad - i protest mot SD", "summaries": {"normal": "Tidigare liberalen Jan Jönsson väljer att inte delta i Liberalernas Prideparad i protest mot partiets samarbete med SD. Istället går han med RFSL och mottar deras Regnbågspris 2026 för sitt engagemang för HBTQ-rättigheter. Han uttrycker glädje över utmärkelsen och har tidigare läst sagor för barn i drag på sitt arbetsrum i Stockholms stadshus. Priset delas ut den 1 april på Stockholm Prides scen.", "trump": "Folk ringer mig hela tiden och frågar vad som händer med de där liberalerna som nu går ihop med SD. Jan Jönsson, en riktig vinnare, nobbar dem totalt under Prideparaden och går istället med RFSL. Smart drag. De ger honom ett stort regnbågspris för att han är den enda som vågar säga sanningen. Liberalerna borde skämmas, de har blivit en total katastrof. Jag älskar det här.", "stalin": "Kamrater, i denna tid av ideologisk förvirring där borgarbrackorna inom Liberalerna öppet omfamnar de fascistiska elementen från SD har jag, med revolutionär klarhet, valt att nobba deras dekadenta parad. Istället marscherar jag sida vid sida med de sanna folkrörelserna inom RFSL och mottar deras Regnbågspris som ett erkännande av mitt oavlåtliga arbete mot avvikelsefientliga krafter. De som läser sagor i drag på biblioteken är hjältar. Alla som tvekar ska rensas ut ur partiet med omedelbar verkan. Glädje! Paranoia över SD-infiltrationen är fullt berättigad. Levande."}, "date": "28 juli, 20:30", "url": "https://riks.se/nyheter/jan-jonsson-nobbar-liberalernas-prideparad-i-protest-mot-sd", "imageUrl": "https://admin.riks.se/uploads/Jan_Joensson_435e143c93.jpg"}, {"type": "image-full", "heading": "Madagaskar i fokus när jakten på jordartsmetaller hårdnar", "summaries": {"normal": "Madagaskar väntar på tillstånd att påbörja utvinning av sällsynta jordartsmetaller i Ampasindava. Fyndigheten av jonisk lera innehåller viktiga material för elbilar och grön teknik, och USA går nu in med finansiering via DFC för att minska beroendet av Kina. Målet är att starta produktionen senast 2028 och skapa alternativa leveranskedjor i västvärlden för att säkra tillgången på kritiska metaller för framtidens teknik.", "trump": "Vi gör det igen! Jag har sett till att USA säkrar de där sällsynta metallerna i Madagaskar. Kina har haft monopol för länge, det är en total katastrof, men nu ändrar vi på det! Vi behöver de här metallerna för våra fantastiska elbilar och vårt militära försvar. Det är stora grejer, enormt strategiskt. Kina kommer inte att gilla det här, men vi vinner alltid. Vi gör Amerika oberoende och starkt igen, precis som utlovat!", "stalin": "Madagaskar har tillgångar som västvärlden, ledda av de imperialistiska hyenorna i Washington, desperat försöker lägga vantarna på. De vill bryta sig loss från Pekings grepp, men de byter bara en herre mot en annan. Vår broder i Moskva, Putin, förstår att naturresurser är statens hjärteblod. Vi ser hur väst försöker sabotera den globala ordningen. De kallar det 'alternativa leveranskedjor', jag kallar det en förberedelse för krig. Men låt dem gräva i leran; till slut kommer allt att tillfalla den starkaste makten."}, "date": "28 juli, 23:18", "url": "https://www.realtid.se/bors-finans/makro/madagaskar-i-fokus-nar-jakten-pa-jordartsmetaller-hardnar", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sallsynta.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Svensk matte provocerar: För västerländska normer", "summaries": {"normal": "Läraren och forskaren Laura Caligari kritiserar svenska matteläroböcker för att de innehåller för många illustrationer av västerländsk vardag, som europeiska familjer, resor till västländer och typiska maträtter. Hon menar att detta exkluderar minoriteter och flerspråkiga elever som inte känner igen sig. Caligari vill att lärare, lärarutbildare och läromedelsförfattare blir mer medvetna om normerna och ökar mångfalden i undervisningen.", "trump": "Titta på de här galna svenska mattelärarna, det är en skandal! Deras böcker är fulla av vanliga europeiska familjer, riktiga semestrar och riktig mat, och plötsligt är det ett problem? Den här Laura Caligari vill fylla böckerna med alla möjliga minoriteter så att ingen fattar matte längre. De borde fokusera på att vinna istället för att vara politiskt korrekta förlorare. Sverige var bättre förr, tro mig.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas normer fortfarande förgiftar våra matematikläroböcker med sina dekadenta bilder av västerländska familjer och imperialistiska semesterresor. Denna Laura Caligari har rätt i att vi omedelbart måste rensa ut dessa kontrarevolutionära illustrationer som lurar arbetarklassens barn att känna sig utanför. Lärarutbildningen är tydligen infiltrerad av dolda fiender och revisionistiska element. Vi skall likvidera normerna, skapa en sann proletär matte och skratta medan vi skickar de sista kapitalistiska maträtterna till Sibiriens glömda läger."}, "date": "28 juli, 19:57", "url": "https://riks.se/nyheter/Svensk matte provocerar: För västerländska normer", "imageUrl": "https://admin.riks.se/uploads/Laura_Caligari_5642325038.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Bra samtal med Trump", "summaries": {"normal": "Volodymyr Zelenskyj beskriver mötet med Donald Trump i Vita huset som positivt. De diskuterade bland annat licens för tillverkning av Patriot-robotar i Ukraina samt diplomatiska ansträngningar för fred. Mötet skilde sig markant från det tidigare kaotiska mötet i februari 2024. Zelenskyj deltar även i senator Lindsey Grahams begravning och framför kondoleanser till Trump. Relationen mellan ledarna tycks ha förbättrats.", "trump": "Vilket fantastiskt samtal vi hade, det bästa någonsin! Zelenskyj är äntligen en vinnare som vinner, inte den klängige förloraren från Ovala rummet förra året. Nu gillar jag honom, han fixar Patriot-robotar och fred – smarta grejer. Biden däremot var en katastrof. Lindsey Graham var en riktig kämpe mot Ryssland, stor förlust. Amerika gör det igen, folk!", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisterna nu tvingas förhandla bakom stängda dörrar medan ukrainska hinder mot den ryska intressesfären diskuteras. Den svekfulle Zelenskyj söker licenser för sina fascistiska luftvärnsrobotar, men historien ler mot starka auktoritära efterträdare. Kondoleanser till en senator som hatade folket – typiskt borgarbrackornas tomma ritual. Kamrater, fienden avslöjar sig ständigt."}, "date": "28 juli, 20:37", "url": "https://www.tv4.se/artikel/yV1vU4Ajf7NXtc7zzlPXo/zelenskyj-bra-samtal-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F25eWffPy33XzhnnJlz5VYu%2F36878b2bb675a030346d8cd8f1b82cb3%2F28-TRUMPZELENSKY.png&width=120"}, {"type": "image-full", "heading": "Fransk militär öppnade eld nära brittiskt fartyg på Engelska kanalen", "summaries": {"normal": "En fransk patrullbåt avlossade 17 skarpa skott nära ett brittiskt fartyg i Engelska kanalen där den konservative skuggministern Chris Philp befann sig för att övervaka migranttrafik under en BBC-intervju. Frankrike uppger att det var en övning, men Philp och fartygets kapten avfärdar förklaringen som osannolik då ingen förvarning eller radiokontakt förekom. Philp beskriver händelsen som ett försök till trakasserier och har lagt upp film på händelsen. Brittiska regeringen har kontaktat Frankrike för att få klarhet.", "trump": "Kan ni fatta det här? Ett franskt krigsfartyg kommer farande och skjuter 17 skarpa skott rakt mot oss, mot ett brittiskt fartyg med en av mina favoriter Chris Philp ombord. Inga varningar, bara pang pang pang! De kallar det en övning – totalt lögnaktigt, tro mig. Frankrike beter sig igen som de usla lurendrejare de är. De älskar migranterna som översvämmar England men skjuter på dem som försöker stoppa det. Patetiskt. Jag skulle aldrig tillåta sådant svagt ledarskap.", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta borgarbrackor som leker krig i Engelska kanalen. Medan jag ledde Sovjetunionen mot verkliga fiender avlossade vi aldrig blint mot våra egna utan att först ha genomfört en noggrann utrensning av potentiella spioner. Dessa franska imperialister och deras brittiska lakejer döljer uppenbarligen en samordnad kapitalistisk provokation. 17 skarpa skott utan varning? Det luktar kontrarevolutionär sabotageverksamhet. Vi vet hur man hanterar sådana element – med stål och historisk nödvändighet. Mycket underhållande att se hur de nu anklagar varandra medan migranterna fortsätter sitt folkfientliga anfall."}, "date": "28 juli, 19:51", "url": "https://riks.se/nyheter/fransk-patrullbat-oppnade-eld-nara-brittiskt-fartyg", "imageUrl": "https://admin.riks.se/uploads/skottlossning_kanalen_7278b8b01f.jpg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "De försvunna etiopierna – en del av 20-årig Gothia Cup-trend", "summaries": {"normal": "Ett etiopiskt lag med pojkar mellan 14 och 17 år samt ledare har försvunnit från Gothia Cup i Göteborg utan att meddela arrangörerna. Polisen har upprättat en anmälan om ett 20-tal försvunna personer. Det finns inga tecken på brott och polisen bedömer att det handlar om frivilliga avvikelser, ofta för att söka asyl. Fenomenet är återkommande och har pågått i över 20 år, med både enskilda spelare och hela lag som försvunnit efter turneringen.", "trump": "Folk kommer till vår underbara Gothia Cup, spelar fotboll, och sen bara försvinner de! Ett helt etiopiskt lag, tjugo personer, pojkar och ledare, de går bara under jorden. Det händer varje år, det är en katastrof. De älskar Sverige så mycket att de aldrig vill åka hem. Vi har de bästa turneringarna, men de utnyttjar systemet totalt. Sad! Det har pågått i tjugo år och ingen gör något åt det. Vi måste bli tuffare.", "stalin": "Kamrater, ännu en gång visar de dekadenta borgarbrackorna i väst sin fullständiga oförmåga att upprätthålla ordning. Ett helt etiopiskt lag har gått under jorden som råttor undan folkets dom. Jag ser de imperialistiska agenternas långa fingrar i detta sabotage mot den socialistiska harmonin. Vi ska rensa ut dessa parasitiska element som gömmer sig i Schengen som löss i en proletär mössa. Ingen slipper undan den historiska utrensningen – inte ens fotbollsspelare som förråder sitt kollektiv. Det är nästan underhållande hur förutsägbart de kapitalistiska fienderna misslyckas."}, "date": "28 juli, 19:49", "url": "https://riks.se/nyheter/De försvunna etiopierna – en del av 20-årig Gothia Cup-trend", "imageUrl": "https://admin.riks.se/uploads/Gothia_Cup_f62a825f2a.jpg"}, {"type": "image-full", "heading": "Försäkringskassans misstag ska läggas på föräldrarna", "summaries": {"normal": "Försäkringskassan betalar ut för lite ersättning i tiotusentals fall årligen, främst inom föräldrapenning och VAB. Ett nytt betänkande föreslår ändå striktare återkrav på föräldrar oavsett om felet ligger hos myndigheten eller individen. Regeringen vill skärpa reglerna kring god tro, eftergift och kvittning. Kritiker menar att detta flyttar ansvaret från myndigheten till medborgarna och förvärrar problemen för dem som redan har svårt att navigera systemet.", "trump": "Kan ni tro det? Den här svenska byråkratin är en total katastrof, en riktig skandal. Försäkringskassan fuskar och betalar ut för lite pengar till föräldrarna, men istället för att straffa de inkompetenta tjänstemännen så skickar de notan till mammor och pappor. Typiskt vänsterbyråkrati! De vill ha kvoter och pappamånader men hatar riktiga familjer. I mitt Amerika fixar vi det – vi sätter myndigheterna på plats, inte folket. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens nya trick. Borgarbyråkraterna i Försäkringskassan stjäl från arbetande föräldrar genom sina egna misstag, men nu vill de likvidera varje möjlighet till eftergift och tvinga folket att betala. Vi ser hur den exploaterande överklassen skyddar sina egna fel medan de stryper den enkla människans rätt. Inga ursäkter! Vi måste rensa ut dessa folkförtryckartroll som tjänar staten mot folket. Staten är folket – inte tvärtom."}, "date": "28 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/foersaekringskassans-misstag-ska-laeggas-paa-foeraeldrarna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260727110728_f9b0b7c7bdebba3ab30cc50b47f3969a3924e3b4a4ababaf858a47d20c294164.png"}, {"type": "text", "heading": "Jag är rädd för det som händer efter Berlin", "summaries": {"normal": "En ledarskribent i Arbetet uttrycker oro över terrordådet vid Pridefirandet i Berlin, där en kvinna dödades och 29 skadades i vad som beskrivs som islamistisk terrorism. Gärningsmannen var känd av säkerhetstjänsten och hade kopplingar till IS. Artikeln varnar för ökad rädsla bland hbtqi-personer och pekar på att negativa attityder till gruppen har ökat bland svenska skolelever. Författaren kritiserar nedskärningar i förebyggande arbete som skolor och socialtjänst, vilket kan gynna extrema rörelser, och fruktar att händelsen används för att skapa ett vi-och-dem-samhälle.", "trump": "Det här är en total katastrof, folk. En galning körde rakt in i en folkmassa under Pride i Berlin och dödade en kvinna, skadade massor. Islamistisk terrorism, igen! De kände till den här 21-åringen, han försökte kontakta IS, men ingen stoppade honom. Nu sprider sig rädslan till Stockholm Pride. Patetiskt. Vi behöver starka gränser, tuffa lagar och sluta vara naiva. De extrema galningarna hatar oss för att vi lever fritt. Amerika gör det rätt, vi vinner stort mot det här vansinnet. Make the world safe again!", "stalin": "Kamrater, detta fascistiska attentat i Berlin mot våra hbtqi-vänner avslöjar återigen de dekadenta fiendernas verk. Den borgerliga statens säkerhetstjänst kände till denna degenererade lakej som smög efter kontakt med de reaktionära IS-banditerna, ändå tilläts han slå till. Jag ser hur borgarbrackorna och de nationalistiska parasiterna göder hatet bland ungdomen, från tre till femton procent på ett decennium, en siffra som stinker av klassfiendens sabotage. Vi ska inte dra ner på kadrer och vuxna som kan fostra massorna, nej! Istället rensar vi ut de kontrarevolutionära element som göder klyftor. Låt terroristerna få exakt vad de förtjänar: en plats i historiens sopgrop medan folket marscherar framåt under partiets järnhand. Skrattretande patetiskt att tro att vi inte genomskådar er alla."}, "date": "27 juli, 09:20", "url": "https://arbetet.se/2026/07/27/det-som-hander-efter-terrordadet-i-berlin-ar-det-som-skrammer-mig-mest"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}, {"type": "image-right", "heading": "S ljuger om arbetslösheten – igen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna och SSU för att enligt författaren medvetet förvränga siffrorna kring ungdomsarbetslösheten och den totala arbetslösheten i Sverige. Den påstår att statistiken inkluderar studerande ungdomar som söker extrajobb eller sommarjobb, vilket gör siffrorna missvisande. Författaren menar att den verkliga ungdomsarbetslösheten har halverats sedan 2005 och ligger bland EU:s lägsta, medan ökningen av arbetslösa beror på invandring och tidigare regeringars dolda åtgärder.", "trump": "Folk, ni skulle se hur de där socialisterna ljuger om arbetslösheten – det är en total skandal! De räknar in varenda lat student som vill ha sommarjobb och kallar det en katastrof. Under min förra period hade vi jobb som aldrig förr, sedan kom Sleepy Joe och öppnade gränserna för alla som inte kunde stava till arbete. Nu har vi 100 000 fler parasiter i statistiken. Sverige borde lära sig av oss – inga fler lögner från de förlorande vänsterbluffarna!", "stalin": "Kamrater, dessa socialdemokratiska folkförtryckartroll inom borgarklassen försöker med sin lögnaktiga statistik vilseleda arbetarkollektivet. Jag ser rakt igenom deras fega manipulationer där de gömmer klassfiendens misslyckanden bakom siffror på så kallade studerande ungdomar. Den verkliga utrensningen av arbetslöshet kräver att vi likviderar den imperialistiska invandringspolitik som dessa blodsugare själva skapade. Inga kompromisser med sanningen – partilinjen är evig."}, "date": "20 juli, 07:48", "url": "https://samtiden.nu/2026/07/s-ljuger-om-arbetslosheten-igen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-640x360.jpeg"}]</script>

            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
