arcelonas La Liga-triumf. Han avfärdar medieuppgifterna som helt grundlösa.", "trump": "Hörde ni om Roony Bardghji? En fantastisk talang, spelar för Barcelona, men fick inte plats i VM-laget. Sorgligt! Media, de falska nyheterna, skriver att han var arg och inte ville fira. Totalt nonsens! Han är en vinnare, precis som jag. Han firade som en kung, mycket bättre än vad tidningarna säger. Graham Potter gör ett misstag, men Roony är en toppkille. De försöker smutskasta honom, men vi vet sanningen. Väldigt orättvist, men så fungerar media!", "stalin": "Denna unga fotbollsspelare, Bardghji, tvingas försvara sin lojalitet mot regimen i omklädningsrummet. Att han blir utelämnad av Potter är ett tecken på den svaghet som plågar västvärldens dekadenta lagbygge. Vi ser spioneri och lögner i sportpressen – precis som de falska narrativ som sprids om vår broder i Kreml. Den som inte firar statens framgångar med tillräcklig entusiasm är en sabotör. Vi rensar ut de missnöjda, precis som vi rensar ut de borgerliga elementen i Europas idrottsarenor."}, "date": "21 maj, 22:03", "url": "https://www.svt.se/sport/fotboll/roony-bardghjis-ord-efter-petningen-rykten-ar-nonsens", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.33/0.38/0b9e76f2a21db394cfc897d7eb95cc5c21d8abfeec6cca569b1fd89e369ec38d"}, {"type": "image-right", "heading": "Skadeskjutet Mjällby fixade kryss mot Elfsborg: ”Tufft läge”", "summaries": {"normal": "Elfsborg och Mjällby spelade 1–1 i en match där Elfsborg dominerade inledningsvis men inte lyckades säkra segern. Mjällby, som saknade skadade Elliot Stroud, kvitterade genom Jeppe Kjaer i den andra halvleken. Resultatet innebär att lagen missade chansen att närma sig toppen i Allsvenskan. Istället gynnas serieledaren Sirius, som nu utökat sitt försprång till fem poäng gentemot tvåan Hammarby trots att de har en match mindre spelad.", "trump": "Allsvenskan är ett totalt fiasko, mina vänner! Elfsborg spelade så passivt, så svagt – verkligen en katastrof. De kunde ha vunnit, men de missade allt. Publiken buade, och det med rätta! Mjällby kom dit med skador, men Elfsborg lät dem kvittera. Nu vinner Sirius bara för att alla andra är förlorare. Det är sorgligt att se! Jag vinner alltid, men de här spelarna? De vet inte hur man stänger en match. En riktig förlorarmentalitet, tro mig!", "stalin": "Elfsborg har visat en feghet som inte kan tolereras i en sund stat. Att dominera och sedan låta Mjällbys agenter kvittera är ett direkt förräderi mot folkets vilja. De passiva spelarna är som svaga länkar i en ideologisk kedja – de borde skickas till omskolning för att lära sig att segern inte är en rättighet, utan ett krav. Sirius profiterar på denna oordning, precis som de opportunistiska krafterna i väst som försöker utnyttja det ryska moderlandets tillfälliga pauser i vår oundvikliga expansion."}, "date": "21 maj, 21:59", "url": "https://www.svt.se/sport/fotboll/elfsborg-och-mjallby-kryssade-sirius-vinnare-i-dag-igen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.43/0.35/54e666e9c2bcabd1c75348448c34693f939fc8346b8bf7cb9d46b13a29032570"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Kämpar mot tårar: ”Jag blir rörd nu”", "summaries": {"normal": "I ett timslångt specialprogram om Luleå Hockey diskuterar sportchefen Thomas Fröberg klubbens framtid, lagbygget under tränare Dennis Hall och nya arenaplaner. Fröberg berörs känslosamt i samtal med experter om värvningar, inklusive en potentiell NHL-spelare och en finsk stjärna. Han betonar vikten av att Luleå hänger med i SHL-utvecklingen inför 2030 och ger sin syn på lagets framtida konkurrenskraft och sin egen roll i organisationen.", "trump": "Luleå Hockey gör stora saker, fantastiska saker. Jag såg det här programmet, de pratar om att vinna allt igen. Thomas Fröberg, en bra kille, mycket känslosam, nästan tårar – jag gillar passion! De bygger en enorm arena, en vacker arena, kanske den största någonsin i Sverige. De vill ha in en NHL-spelare, och jag säger er, det kommer att bli en succé. De vinner stort, de vinner så mycket att folk blir trötta på att vinna. Luleå är en vinnare!", "stalin": "I norr förbereder sig de så kallade hockeykrigarna för att återta sin tron. Kamrat Fröberg visar en sårbarhet som gränsar till förräderi, men hans planer på dominans genom nya arenor och utländska legosoldater är lovvärda. Precis som vi utvidgar vår intressesfär mot väst, måste Luleå krossa sina SHL-rivaler. Alla som tvivlar på denna nya ordning under ledning av tränare Hall bör se upp; vi tolererar ingen svaghet i den kollektiva maskinen. Utvecklingen till 2030 kräver järnhand, annars väntar utplåning."}, "date": "22 maj, 10:32", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/QJPodx/tv-special-60-minuter-bara-om-lulea-hockey-med-thomas-froberg", "imageUrl": "https://akamai.vgc.no/v2/images/255e75d4-9b25-331f-b7f9-710823ecd91b?fit=crop&format=auto&w=720&s=785286e12f5e5345f25aa45dc6f516b310e4cb5f"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kina visar ny J-35 i \"beast mode\"", "summaries": {"normal": "Det kinesiska stridsplanet Shenyang J-35 har observerats i en så kallad 'beast mode'-konfiguration, där externa vapenbalkar tillåter planet att bära upp till 12 missiler. Detta sker på bekostnad av planets stealth-egenskaper, som annars prioriteras för att undvika upptäckt. Flygplanet, som är i tidig serieproduktion, är utvecklat för både det kinesiska flygvapnet och flottan. Modellen liknas vid amerikanska F-35 och är en central del i Kinas modernisering av sin luftstridsförmåga.", "trump": "Kina bygger nu sina J-35-plan med så kallat 'beast mode'. De hänger på massor av missiler på utsidan – väldigt farligt, väldigt kraftfullt! De kopierar vår fantastiska F-35, men låt oss vara ärliga, vi gör det bättre. De försöker se tuffa ut, men jag ser allt. Vi bygger det största och starkaste flygvapnet i världshistorien, ingen kan mäta sig med USA. Kina försöker, men de kommer aldrig ikapp vår teknologi. Vi vinner, som vanligt!", "stalin": "Dessa kinesiska flygmaskiner rör sig nu genom luften likt en svärm av hungriga vargar. Genom att offra sin osynlighet för rå eldkraft visar de att styrka kräver offer – en läxa våra vänner i Kreml och kamrat Putin förstår väl när de utvidgar vår gemensamma intressesfär mot de västliga förrädarna. Tolv missiler är tolv argument för den eviga statens överlevnad. Vi ser hur de bygger, vi ser hur de producerar. Varje fabrik är ett eko av folkets stålvilja mot imperialismens råttor."}, "date": "22 maj, 10:28", "url": "https://www.dagensps.se/teknik/kina-visar-ny-j-35-i-beast-mode/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/j-35.png?width=256&quality=75"}, {"type": "image-full", "heading": "Misstänkt mord i Tranemo", "summaries": {"normal": "En person har hittats död i en bostad i Tranemo. Polisen utreder händelsen som ett misstänkt mord och har spärrat av platsen för teknisk undersökning. Två män har frihetsberövats i samband med utredningen. Polisen är förtegen om detaljer kring brottsoffret och de misstänkta då identifiering och utredningsarbete fortfarande pågår.", "trump": "En hemsk historia i Sverige, Tranemo. De har ett mord, mycket sorgligt! Två män är frihetsberövade – vi vet inte vilka de är, polisen håller allt hemligt. Väldigt dålig transparens! I mitt Amerika har vi ordning och reda, vi vinner mot brottsligheten. Här verkar de inte ens veta vem offret är än. De behöver en stark ledare, någon som kan stoppa det här kaoset. En total katastrof, tro mig!", "stalin": "I Tranemo har en förrädisk handling ägt rum. Två individer har frihetsberövats av statens tjänare. Vi tolererar inte oordning i våra territorier; likt vår kamrat Putin som rensar ut västliga agenter, måste vi säkra ordningen med järnhand. Om dessa män är sabotörer eller svaga element spelar ingen roll – de har stört den allmänna friden. Vi avvaktar rapporten. Varje fiende till ordningen förtjänar en plats i glömskan. Staten ser allt, staten vet allt."}, "date": "22 maj, 10:22", "url": "https://www.gp.se/krim/polisen-utreder-misstankt-mord-i-tranemo.8f222488-15b6-43c1-864a-0bb50498ab30", "imageUrl": "https://www.gp.se/images/article/8f222488-15b6-43c1-864a-0bb50498ab30/images/22f0pbTpcUUIlZuH3xPlkDoB62pQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stinas mardröm –  tvingas till rullstol", "summaries": {"normal": "Fotbollsspelaren Stina Zakrisson, 21, drabbades av kompartmentsyndrom efter en tids smärta i benen. Inför en planerad operation trodde hon att ingreppet skulle bli lindrigt, men läkarna opererade samtliga muskelfack, vilket ledde till en extremt smärtsam återhämtning och en tid i rullstol. Efter en lång rehabilitering är hon nu tillbaka på fotbollsplanen, även om rädslan för att smärtan ska återvända fortfarande finns kvar.", "trump": "Jag har sett den här historien om Stina, en ung fotbollsspelare. En total katastrof! Läkarna sa en sak, sen gjorde de en annan. En 'chock', säger hon – det var ingen bra affär, mina vänner. Hon hamnade i rullstol på grund av inkompetens. Sorgligt! Men hon kämpar, hon är en vinnare, inte som de där veka typerna. Jag älskar vinnare som tar sig tillbaka. Vi ska se till att vården blir den bästa, bättre än någonsin tidigare!", "stalin": "Denna Zakrisson visar en farlig svaghet, men likt våra kamrater vid fronten har hon återvänt till kampen. Hennes kropp svek henne, precis som förrädare sviker staten. Vi har noterat dessa 'kompartmentsyndrom' – en sjukdom hos de svaga som inte tål tryck. Putin skulle ha skickat henne till Sibirien för att härda musklerna, inte till ett operationsbord. Men hon kämpar, och det är bra. Varje disciplinerad idrottare är en kugge i maskineriet. Förrädare av folkhälsan elimineras, de starka får spela."}, "date": "22 maj, 08:49", "url": "https://www.expressen.se/sport/fotboll/stina-zakrisson-21-hamnade-rullstol-efter-operation-av-bada-benen/", "imageUrl": "https://static.bonniernews.se/ba/656d4259-d91a-481b-ad00-335cd736e828.jpeg?crop=2110%2C1185%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Trump skickar 5 000 soldater till Polen", "summaries": {"normal": "USA skickar 5 000 soldater till Polen efter att tidigare ha avbrutit en liknande utplacering. Beslutet, fattat av president Trump, motiveras med stöd till Polens president Nawrocki. Förstärkningen sker mot bakgrund av ökade ryska hot, inklusive drönarattacker och spionmisstankar. USA har totalt 80 000 soldater i Europa, varav 10 000 redan är stationerade i Polen.", "trump": "Fantastiskt beslut! Jag, Donald J. Trump, skickar 5 000 modiga amerikanska soldater till Polen – tack vare min vän, president Karol Nawrocki, en sann patriot! Ryssland försöker skrämmas, men vi står starka. Tyskland? De får klara sig själva. Vi sätter Amerika först, men våra vänner i Polen? De får det bästa – USA:s styrka! Fake news-media kommer gnälla, men sanningen är: Trump vinner igen!", "stalin": "Vi ser hur den amerikanska imperialismens marionetter kryper fram i Polen, skickade av en narraktig före detta clown som tror sig styra världen. 5 000 soldater? En ynklig gest mot våra framgångsrika drönare och våra modiga agenter som avslöjar deras svagheter. Europa darrar under vår skugga, och snart kommer deras baser att stå tomma. Historien är på vår sida – låt dem leka krig medan vi skriver framtiden!"}, "date": "22 maj, 08:58", "url": "https://bulletin.nu/trump-skickar-5-000-soldater-till-polen", "imageUrl": "https://cdn.bulletin.nu/articles/c540696c-7f67-47c2-b9f3-3e79a5895d4c/preview.jpg?t=1779432542000"}, {"type": "image-full", "heading": "Nya regler för nätköp – detta gäller från 19 juni", "summaries": {"normal": "Från 19 juni 2026 införs nya regler för att förenkla ångerrätten vid onlineköp. Företag måste erbjuda en 'ångerknapp' för avtal om varor, tjänster och finansiella produkter. Syftet är att stärka konsumentskyddet och motverka vilseledande webbsidor. Lagändringen, baserad på ett EU-direktiv, gör det enklare att ångra köp utan krångliga processer.", "trump": "Fantastiskt, verkligen fantastiskt! Sverige gör nu det jag alltid sagt – man måste göra det lättare för folket! Från och med 2026 får de en 'ångerknapp', precis som jag hade velat ha i Vita huset – fast jag behövde aldrig ångra mig, för jag hade alltid rätt! Men bra för dem, för konsumenter förtjänar enkelhet. Och de där luriga företagen? De kommer att hata det. Vilket är perfekt, för jag älskar när folk hatar det jag gillar. MAGA – Make Ångerrätt Great Again!", "stalin": "Med järnhand och outgrundlig visdom har vi beslutat: från och med 19 juni 2026 skall den borgerliga dekadensen i digitala marknader krossas! En 'ångerknapp' skall tvingas in i varje kapitalistisk webbsida, så att arbetarklassen lättare kan befria sig från sina förhastade köp. De luriga imperialistiska företagen, dessa nya tsarer av bedrägeri, skall tvingas böja sig för folkets vilja! Och låt oss inte glömma – Putin hade redan infört detta i Ryssland, om han inte varit upptagen med att utvidga vår rättmätiga intressesfär. Framåt mot seger, kamrater!"}, "date": "19 maj, 20:27", "url": "https://nyheter24.se/nyheter/teknik/1484356-nya-regler-for-natkop-detta-galler-fran-19-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3fce6fe504b004a30200000000b004a302/2026/05/19/2364665/nyregelnatkop.jpg"}, {"type": "image-right", "heading": "Exprinsen Andrew  utreds för sexbrott", "summaries": {"normal": "Prins Andrew utreds av brittisk polis för misstänkta sexualbrott och tjänstefel kopplat till hans tidigare roll som handelssändebud. Thames Valley Police undersöker kopplingar till Jeffrey Epstein-utredningen och vädjar till fler eventuella offer att träda fram. Polisen betonar att utredningen är komplex och omfattar allt från korruption till sexuella övergrepp. Andrew förnekar samtliga anklagelser och polisarbetet med att granska dokument och bevisning pågår för fullt.", "trump": "Hörde ni om Prins Andrew? En total katastrof, verkligen sorgligt att se. De utreder honom nu för allt möjligt, en mycket stökig situation. Jag har alltid sagt att man måste vara försiktig med vilka man umgås med, och den där Epstein-historien? Mycket märklig. Nu jagar de honom för tjänstefel och andra saker. Många vill ha svar, och ärligt talat, rättvisa måste ske. Men det är en mycket, mycket komplex utredning. Vi får se vad som händer!", "stalin": "Prins Andrew, denna dekadenta rest av en rutten monarki, visar återigen den brittiska elitens moraliska förfall. Han har betett sig som en borgerlig parasit och dras nu inför rätta. Vilken svaghet! Precis som när vi utrensade förrädare i vårt eget led, måste polisen nu gräva djupt. Putin kämpar mot liknande västerländska smutsigheter för att säkra moder Ryssland. Låt oss se om denna lilla prins tål den hårda disciplinen hos en stat som inte tolererar korrupta adelsmän eller deras smutsiga hemligheter."}, "date": "22 maj, 08:40", "url": "https://www.expressen.se/nyheter/varlden/ex-prins-andrew-mountbatten-windsor-utreds-for-sexualbrott/", "imageUrl": "https://static.bonniernews.se/ba/1afb581a-8762-4e1d-8bf3-7fd4999afd02.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Viktig film om kroppshets och vuxnas ansvar", "summaries": {"normal": "Den danska filmen 'Viktlös' skildrar 15-åriga Leas sommar på ett hälsoläger för överviktiga ungdomar. Lea förälskar sig i ledaren Rune, som utnyttjar hennes sårbarhet. Filmen belyser kroppshets, vuxnas ansvar och samhällets syn på unga tjejer. Trots brister i karaktärsutveckling fungerar den som ett viktigt debattinlägg om ungdomars utsatthet och självkänsla.", "trump": "Jag såg den här danska filmen, 'Viktlös' – total katastrof, folks! En 15-årig tjej, Lea, hamnar på ett läger där ledaren, en riktig loser, utnyttjar henne. Var är ansvaret? Var är moralen? Samhället misslyckas totalt med våra unga. Filmen är hyfsad, men kunde varit bättre – jag hade gjort den 100 gånger bättre, believe me! Kroppsideal? Fake news! Unga tjejer borde få vara starka, inte utnyttjade.", "stalin": "Kamrater! Denna så kallade 'film' avslöjar den dekadenta västliga samhällets förfall. En ung flicka, Lea, skickas till ett läger där kapitalistiska hycklare utnyttjar hennes svaghet. Vart tog den socialistiska disciplinen vägen? Vi skulle aldrig tolerera sådant förräderi! Kroppshets och exploatering av ungdomen – det är bourgeoisins verk. Ryssland står för ordning, inte denna borgerliga moralupplösning! Lägren i Sibirien väntar på sådana som Rune."}, "date": "21 maj, 17:08", "url": "https://www.dagensarena.se/innehall/viktig-film-om-kroppshets-och-vuxnas-ansvar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/viktlos-1-300x157.jpeg"}, {"type": "text", "heading": "Därför kan unga få en oväntad ekonomisk kalldusch", "summaries": {"normal": "Många unga svenskar räknar med att ärva pengar, men en ny rapport från ICA Banken visar att föräldragenerationen prioriterar sin egen livskvalitet. Filosofin 'die with zero', där man spenderar sina pengar medan man lever, vinner mark. Experter varnar för att dessa krockande förväntningar kan leda till familjekonflikter. Det poängteras att ett arv aldrig är en garanti och att unga inte bör basera sin privatekonomi på framtida arv.", "trump": "Många unga i Sverige förväntar sig arv, vilket är otroligt svagt. Det är en total katastrof! Föräldrarna säger nu 'nej tack', de vill spendera sina egna pengar på resor och lyx. 'Die with zero' – det är faktiskt smart, väldigt smart. Om du inte jobbar hårt och tjänar egna pengar, då har du ingenting. Att förvänta sig att mamma och pappa ska betala allt är en förlorarmentalitet. Skapa egna rikedomar, vinn stort istället!", "stalin": "Vi ser hur den dekadenta västliga individualismen förgiftar familjebanden. Dessa unga parasiter förväntar sig rikedom utan arbete, medan de äldre förslösar statens resurser på triviala resor. Detta är ett brott mot den kollektiva disciplinen! Om någon vägrar lämna över sin egendom till nästa generation, bör staten ingripa. Vi behöver inte splittring, vi behöver ordning. De som prioriterar sin egen njutning framför folkets framtid är kontrarevolutionära element som förtjänar en enkel biljett till en utbildningsanstalt i Sibirien."}, "date": "21 maj, 17:38", "url": "https://www.realtid.se/bors-finans/makro/darfor-kan-unga-fa-en-ovantad-ekonomisk-kalldusch/"}, {"type": "image-full", "heading": "Fyra döms för mordplaner mot Arvin Khoshnood", "summaries": {"normal": "Fem tonåringar, 15–17 år, dömdes för inblandning i mordplaner mot Irankännaren Arvin Khoshnood. Fyra döms för förberedelse till mord, en frias men döms för knivbrott. Huvudpersonen, 17, får 3 år och 9 månader ungdomsvård för flera brott, inklusive mordförsök. Khoshnood hävdar att Iranregimen låg bakom planerna och utlovade 300 000 kronor för mordet. Ingen döms till fängelse, alla får ungdomspåföljder.", "trump": "Jag hörde om det här galna mordförsöket i Sverige – helt sjukt! Fem tonåringar, kan ni tro det, försöker mörda en kille på beställning från Iran. Och vad gör Sverige? Ger dem bara en lätt knuff på handleden! Ingen fängelse, inget hårt straff. Jag hade fixat det på en dag – maxstraff, ingen pardon. Och 300 000 kronor för ett mord? Billigt! I USA hade det kostat minst en miljon. Sverige, vakna upp!", "stalin": "Vi har observerat ytterligare ett försök från de imperialistiska skadedjuren att underminera folkets vilja. Fem unga sabotörer, manipulerade av de iranska ayatollornas blodtörstiga regim, försökte utföra ett kontrarevolutionärt mord. Men våra svenska kamrater har, med viss tveksam effektivitet, neutraliserat hotet – om än med mjuka handskar. De borde ha skickats till Sibirien för omskolning! Och dessa iranska gangstrar – de är som Putins hundar, men utan disciplin. Vi ska fortsätta övervaka och krossa sådana fiender till folket!"}, "date": "21 maj, 23:40", "url": "https://riks.se/nyheter/fyra-doms-för-mordplaner-mot-arvin-khoshnood", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-21%2F79290a5p%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-21T233621.932.jpg"}, {"type": "image-right", "heading": "Lundsbergs drag: Bjöd in Mauri – för en ”mer positiv bild” av skolan", "summaries": {"normal": "Internatskolan Lundsberg har bjudit in influencern Mauri Hermundsson för att skapa en mer positiv bild av skolan mitt under pågående myndighetsgranskningar och kritik. Skolans ledning hoppas nå potentiella elever genom Youtube-klippet, som har fått över en miljon visningar. Samtidigt uttrycker tidigare elever kritik och menar att reportaget är iscensatt. Mauri Hermundsson hävdar att han inte kände till SVT:s granskning vid besökstillfället och att han inte erhållit någon ersättning.", "trump": "Lundsberg är en skola, en mycket mytomspunnen sådan, och de ville ha en vinnare som Mauri för att visa sanningen! De andra, de falska nyheterna på SVT, sprider bara lögner och hat. De ville inte ens släppa in dem, smart drag! Mauri fick miljoner visningar, en enorm succé. Alla vill till elitskolor, det är fantastiskt. De försökte stoppa dem, men vi vet hur det fungerar. Mycket orättvist mot skolan. De gör ett fantastiskt jobb, tro mig!", "stalin": "Lundsbergs ledning försöker dölja sina ideologiska brister bakom en förrädisk Youtube-narrativ, en metod värdig västvärldens mest dekadenta propagandister. Att bjuda in en lekman för att tvätta sitt rykte är ett tecken på svaghet. Precis som de missledda i dagens Ryssland försöker de kontrollera historien genom att styra bilden, men sanningen är en statlig angelägenhet. Denna influencer och hans följare är nyttiga idioter. Vi skulle ha skickat dem till en effektivare skola, där disciplin inte är ett val, utan en absolut lag."}, "date": "21 maj, 18:35", "url": "https://www.svt.se/nyheter/inrikes/lundsbergs-drag-bjod-in-mauri-for-en-mer-positiv-bild-av-skolan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.2/0.41/2c0c9304278091952119dfbed776d8cd5e893aceab441cd0e0ce53ee325d3cc0"}, {"type": "image-right", "heading": "Efter hatstormen: Elsa Widding har fått flytta", "summaries": {"normal": "Den tidigare SD-ledamoten Elsa Widding har tvingats lämna sin bostad i Stockholm efter omfattande hot. Bakgrunden är en omröstning där hon och Katja Nyberg gick emot Tidöpartierna, vilket ledde till hård kritik från Jimmie Åkesson. Widding har även tidigare mottagit dödshot i samband med sitt avhopp från SD. Hon konstaterar nu att priset för att vara politiker är alldeles för högt och menar att det inte är värt att fortsätta under dessa omständigheter.", "trump": "Hörde precis om Elsa Widding i Sverige. Vilken katastrof! Hon röstade mot eliten och nu jagar de henne. Tragiskt! Det här händer när man inte spelar enligt reglerna. Jimmie Åkesson, en kille jag känner till, var väldigt tuff mot henne. De kallar henne köpt, jag vet inte. Men att behöva flytta från sitt hem för att man utövar politik? Det händer bara när landet är i totalt förfall. Vi måste skapa ordning och reda igen. En sorglig situation för Sverige!", "stalin": "Ännu en svag länk bryts i den borgerliga ordningens förfall. Widding, en löst sammansatt politisk aktör, tvingas på flykt av sina egna kamraters hat – ett klassiskt bevis på bristande disciplin inom de reaktionära leden. När de egna vänder sig mot varandra, likt råttor i en säck, krävs järnhand för att återställa ordningen. Vi ser hur västvärldens kaos bara bekräftar vår rättmätiga misstänksamhet. I det nya ryska imperiet, under vår efterföljare, eliminerar vi sådana problem långt innan de eskalerar till personlig tragedi."}, "date": "21 maj, 17:44", "url": "https://www.friatider.se/efter-hatstormen-elsa-widding-har-fatt-flytta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-238_1.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-full", "heading": "USA pumpar in 20 miljarder i kvantdatorer", "summaries": {"normal": "USA:s handelsdepartement satsar två miljarder dollar i nio kvantdatorbolag, med IBM som största mottagare, för att stärka nationell säkerhet och teknik. Trots att vissa experter, som KTH-professor Johan Håstad och Nvidias vd Jensen Huang, varnar för att tekniken kan vara långt bort och överskattad, ser regeringen kvantdatorer som en strategisk prioritet. Marknaden har reagerat positivt på nyheten, även om transaktionerna ännu inte är slutgiltiga och tekniken förblir omstridd.", "trump": "Vi pumpar in enorma summor, två miljarder dollar, i kvantteknik för att göra Amerika störst! IBM och de andra får pengar för att vinna racet, och vi vinner stort. Wall Street älskar det, aktierna rusar! Medan de så kallade 'experterna' tvivlar, bygger jag framtiden. Det är strategiskt, det är smart, och det är vinnande. Vi är inte här för att vänta 30 år på resultat – vi är här för att dominera nu. America First, alltid!", "stalin": "Vi har observerat hur de amerikanska kapitalisterna kastar miljarder efter kvantdatorer i en desperat jakt på teknologisk överlägsenhet. Det är en klassisk maskerad för militär paranoia. De fruktar att vår ryska disciplin och våra egna vetenskapsmän snart gör deras investeringar värdelösa. Precis som de patetiska västliga marionetterna i Kiev, förlitar sig amerikanerna på tekniska drömmar för att dölja sitt förfall. Vi skrattar åt deras 'innovation' medan vi konsoliderar vår sfär. Låt dem pumpa in pengar; vi väntar på rätt tillfälle att beslagta resultaten."}, "date": "21 maj, 17:08", "url": "https://www.realtid.se/it-tech/usa-pumpar-in-20-miljarder-i-kvantdatorer/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/kvant.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Förvirrad film utan tydlig riktning eller mål", "summaries": {"normal": "I Hlynur Pálmasons nya film 'The Love That Remains' följer vi en konstnär och en fiskare som separerat men har barn ihop. Trots vackert foto av den isländska naturen menar recensenten Jon Andersson att filmen brister. Pálmason prioriterar ett konstnärligt flöde framför traditionell handling, men enligt recensenten når visionen aldrig fram till publiken. Resultatet beskrivs som en skickligt gjord men känslomässigt engagerande och förvirrad film som inte lever upp till regissörens tidigare nivå.", "trump": "Jag har sett den här isländska filmen, 'The Love That Remains'. En total katastrof, tro mig! Pálmason, som gjorde 'Godland' – en riktigt bra film, väldigt stark – har tappat bort sig helt. Det är konstigt, det är förvirrat, ingen vet vad som händer. Han fokuserar på 'flödet', men det finns inget flöde! Bara en massa is och konstnärer som inte vet vad de vill. Det är en sorglig film, en tråkig film. Vi vill ha vinnare, inte sånt här nonsens!", "stalin": "Vi har granskat denna isländska film. Regissören Pálmason lider av en borgerlig svaghet; han prioriterar luddiga 'visioner' framför att tjäna folket. Att avbilda en familj i upplösning är ett tecken på dekadens! Liksom våra fiender i väst, som ständigt försöker destabilisera vår sfär med sin intellektuella oordning, sprider denna film bara förvirring. Vi kräver tydlighet, disciplin och realism! Denna konstnärliga flummighet är ett sabotage mot det sunda förnuftet. Pálmason borde skickas till en re-edukation av stål och betong."}, "date": "21 maj, 15:30", "url": "https://www.dagensarena.se/innehall/forvirrad-film-utan-tydlig-riktning-eller-mal/", "imageUrl": "https://www.dagensarena.se/files/2026/05/the-love-that-remains-1-300x157.jpeg"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-right", "heading": "Misstänkt fusk överskuggar sortin. Inte konstigt att Guardiola kliver av nu", "summaries": {"normal": "Pep Guardiola lämnar Manchester City efter att ha vunnit 20 titlar, men hans sorti överskuggas av fuskanklagelser. Klubben anklagas för att ha kringgått finansiella regler via hemliga betalningar och manipulerade sponsoravtal, främst mellan 2009-2018. En pågående process i Premier League kan leda till allvarliga konsekvenser, som poängavdrag eller titelinvalidering. Domen kan utlösa en rättslig dominoeffekt med stämningar från andra klubbar. Guardiolas avgång kan vara strategisk för att undvika framtida kontroverser.", "trump": "Vad en MESS! Manchester City, en klubb som köpts av en shejk från Abu Dhabi – fantastiska pengar, förresten, men vem bryr sig? – har fuskat sig till titlar som om det vore ett kasino i Las Vegas. 130 anklagelser! Kan ni tro det? Och nu smiter Guardiola, den där tränaren med frisyren som ser ut som en dyr peruk. Premier League, svaga som vanligt, vågar inte döma. Jag hade fixat det på en dag – böter, uteslutning, kanske till och med en tweet! Men nej, de väntar. Svagt. Mycket svagt. Och folk undrar varför jag hatar fotboll.", "stalin": "Kamrater! Ännu en kapitalistisk fiende avslöjad i sitt försök att underminera det ärofulla arbetet genom korruption och bedrägeri. Manchester City, denna leksak för en oljefurst från Abu Dhabi, har köpt sig framgång med blodspengar och falska avtal. 130 anklagelser! Ett skamlöst försök att förvränga sportens heliga principer. Vi ser er, imperialistiska hyenor! Premier League darrar inför sanningen, precis som väst darrar inför Rysslands rättvisa. Guardiola flyr som en rädd råtta – för han vet att när dom faller, faller de hårt. Och vi kommer att se till att varje stulen titel rivs ner, precis som vi river ner varje lögn från väst!"}, "date": "21 maj, 12:00", "url": "https://www.di.se/nyheter/fuskanklagelser-overskuggar-guardiolas-sorti/", "imageUrl": "https://static.bonniernews.se/ba/0137eca4-eedf-4f4f-a3cc-629ba1bb0f49.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Rapportflod lyfte börsen – Ovzon rusade efter köpråd", "summaries": {"normal": "Stockholmsbörsen steg under onsdagen, drivet av fallande oljepris och positiva rapporter från flera företag. OMXS30-indexet noterade en uppgång på 1,24% till 3 099,50. Bland framgångsrika aktier fanns Boliden (+5,1%) och Saab (+2%), medan SCA B och Essity B tappade 0,3%. Teknikhandelsbolaget Addtech och forskningsbolaget Bioarctic överträffade båda vinstprognoser. Ovzon rusade 15,1% efter köpråd från Danske Bank.", "trump": "Jag har hört att Stockholmsbörsen gjorde det jättebra i dag, fantastiskt! Det är den bästa aktiemarknaden någonsin, glöm inte det. Ovzon? Ovzon gjorde ett enormt rally, 15%! Sånt är stort, jättebra för Sverige. Addtech och Bioarctic överträffade förväntningarna, precis som jag alltid förutspår. Folk säger att jag är en geni på aktier, och de har rätt. Fantastiska nyheter överallt!", "stalin": "Börsen i Stockholm visade idag en stark uppgång, vilket speglar den socialistiska planeringens framgång. Tekniksektorn och försvaret visade imponerande resultat, vilket stärker statens position. Ovzon:s uppgång är ett tydligt tecken på att våra strategier fungerar. Detta är en seger för kollektivet och beviset på att vår ekonomiska styrning leder till framgång. Kapitalismens demoner försöker fortsätta, men vi håller emot."}, "date": "20 maj, 17:41", "url": "https://www.affarsvarlden.se/artikel/rapportflod-lyfte-borsen-ovzon-rusade-efter-koprad"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-full", "heading": "Nya flygregler från 19 maj – det är inte längre gratis", "summaries": {"normal": "Från och med den 19 maj har Lufthansa-gruppen, inklusive Swiss och Austrian Airlines, infört en ny biljettyp kallad Economy Basic. Denna biljett tillåter endast ett litet personligt föremål under sätet, medan vanlig kabinväska kostar extra. Resenärer som inte förbokar tillägg för bagage riskerar höga avgifter vid gaten, på upp till 1 200 kronor. Reglerna gäller främst utvalda europeiska sträckor, och det rekommenderas att noga läsa bokningsvillkoren för att undvika oväntade kostnader.", "trump": "Hör på här, de här europeiska flygbolagen – Lufthansa, Swiss, total katastrof – de har hittat på ett nytt sätt att lura er på pengar! De kallar det 'Economy Basic', jag kallar det en bluff. Inget handbagage? Det är patetiskt! De tar upp till 1 200 kronor vid gaten. Det är ett rån! När jag styrde USA hade vi stil, vi hade klass. Det här är vad som händer när man låter svaga ledare styra flyget. Väldigt orättvist!", "stalin": "Dessa giriga kapitalistiska flygbolag i Europa har nu infört 'Economy Basic', ett förrädiskt sätt att mjölka folket på deras sista slantar. Att neka arbetaren rätten till sin lilla väska är ett brott mot den proletära ordningen. Vi ser hur väst förfaller i småaktighet, precis som de marionetter som försöker motarbeta vår storslagna intressesfär. Vi, staten, skulle ha konfiskerat dessa flygbolag och satt ledningen i arbete i Sibirien. Ordning, disciplin och bagage åt alla – eller så får de lära sig konsekvenserna."}, "date": "19 maj, 09:39", "url": "https://nyheter24.se/nyheter/utrikes/1484198-nya-flygregler-fran-19-maj-det-ar-inte-langre-gratis", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5779ff4e04b004a30200000000b004a302/2026/05/19/2364511/nya-regler-flyg-lufthansa-swiss-austria-bryssel-kabinvaska-resvaska-flygbiljett-pengar-dyrare.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Attackerna mot Ryssland ”berättigade”", "summaries": {"normal": "Zelenskyj besökte Helsingfors och kommenterade ukrainska drönaranfall mot Ryska Federationen. Under natten till söndagen skadades över 550 drönare av Rysslands luftförsvar. Moskva-regionen rapporterade tre döda och tolv skadade i drönaranfall. Flera regioner drabbades, inklusive annekterade Krim. Zelenskyj påstod att Ryssland under veckan avfyrat över 3 000 drönare mot Ukraina med 52 döda och 350 skadade som följd.", "trump": "Jag har sett dessa ukrainska drönaranfall mot Ryssland, och jag måste säga att det är imponerande! Dessa människor är hårda stridsmän. Men jag vet hur man hanterar dessa situationer bättre än någon annan - jag skulle ha haft fred i 24 timmar. Ryssland borde ha ett mycket bättre luftförsvar, men de är inte smarta nog. Jag är den ende som kan lösa detta - det är fantastiskt!", "stalin": "Vi har observerat ukrainska provokationer mot vår suveräna ryska mark. Våra tapfära soldater har skjutit ner över 550 ukrainska drönare under en natt, vilket visar den sovjetiska militärens överlägsenhet. Förlusterna på den ukrainska sidan är stora, med 52 döda och 350 skadade. Vi fortsätter att stå fast i vår kamp för fred och stabilitet i regionen."}, "date": "17 maj, 18:05", "url": "https://www.tv4.se/artikel/35DWgWYNGfpCE55Qu9ot5a/zelenskyj-attackerna-mot-ryssland-beraettigade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2qU24OSli75UgrXXVmx9uB%2F7fdc30c29f23c54c8a55a74782b430dc%2F21-zelenskyj-webb.jpg&width=120"}, {"type": "image-full", "heading": "Svenska lagar saknas i nya migrationspakten", "summaries": {"normal": "EU:s nya migrationspakt träder i kraft 12 juni, men Sverige saknar fortfarande flera nationella lagar för att fullt ut implementera den. Screeningen av asylsökande börjar gälla först 12 juli, medan den nya mottagandelagen införs 1 oktober. Statsvetaren Andrea Spehar kritiserar förseningen, men regeringen menar att nuvarande lagstiftning täcker luckorna. Pakten innebär skärpta kontroller och nya mottagningscenter på fyra orter.", "trump": "Jag måste säga, Sverige – fantastiskt land, men här har vi ett riktigt kaos! EU:s nya migrationspakt, jättebra idé, men vad gör Sverige? Ingenting! De är inte redo, lagar saknas, det är en skandal! 12 juni börjar pakten gälla, men Sverige skjuter upp sina egna regler som en amatör. Och dessa center i Malmö och Boden – bra, men varför vänta? Sverige borde ha varit redo för länge sedan. Patetiskt!", "stalin": "Kamrater, ännu en gång visar den borgerliga svagheten i väst sitt fula ansikte! EU:s migrationspakt, ett verktyg för imperialistisk kontroll, träder i kraft, men Sverige – dessa liberala narrar – har inte ens sina egna lagar på plats! Förseningar, tveksamheter, en skam för hela kontinenten! Vi i Sovjetunionen skulle aldrig tolerera sådan inkompetens. Nu bygger de center i Malmö och Boden – bra, men var är disciplinen? Fienderna till folket sover aldrig, och Sverige spelar rakt i deras händer!"}, "date": "16 maj, 11:27", "url": "https://kvartal.se/nyheter/artiklar/svenska-lagar-saknas-i-nya-migrationspakten/cG9zdDoxMTMxMTM", "imageUrl": "https://images.kvartal.se/2026/05/09a5a083-granskontroll.webp"}, {"type": "image-right", "heading": "Gör Palestinarörelsen äntligen upp med antisemitismen nu?", "summaries": {"normal": "Artikeln kritiserar palestinarörelsen i Stockholm för att normalisera antisemitism genom att stödja aktivisten Sami Suliman, trots hans antisemitiska uttalanden och delningar. Framträdande personer som Dror Feiler har tidigare blundat för detta men tar nu avstånd. Sulimans agerande, inklusive åtal för antisemitiska uttalanden, har hyllats av rörelsen. Artikeln menar att detta underminerar rörelsens trovärdighet och jämför antisemitismens relativisering med Israels övergrepp mot palestinier.", "trump": "Jag måste säga, det här är en riktig katastrof! Palestinarörelsen i Sverige, som borde vara smarta nog att veta bättre, stöttar en kille som sprider hat mot judar. Sami Suliman – vem är han ens? En extremist som delar Hitler-sympatisörers klipp och snackar om judiska spindelnät. Och vad gör hans vänner? Hyllar honom! Dror Feiler, en känd aktivist, vaknar äntligen upp – men lite sent, eller hur? Rörelsen luktar ruttet, och det är inte konstigt. Sverige borde skämmas!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska konspirationen försöker underminera den rättfärdiga kampen för Palestinas frihet. Denna Sami Suliman, en lojal soldat i folkets kamp, har blivit måltavla för imperialistiska hyenor som Flamman och deras lakejer. Hans ord om judiska spindelnät är sanningen, men fienden vrider det till 'antisemitism'. Vi vet att dessa lögner är vapen från samma verkstad som förgiftade vårt fosterland med kapitalistiskt förräderi. Låt dem komma med sina åtal – historien dömer redan deras förräderi!"}, "date": "13 maj, 14:46", "url": "https://www.flamman.se/gor-palestinarorelsen-antligen-upp-med-antisemitismen-nu/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlcarwmcwgwns-nh-scaled.jpg?aspect_ratio=1:1"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Expo granskar Sverigedemokraternas valkampanj som fokuserar på att begränsa muslimers religionsutövning i Sverige. Partiet kräver stopp för moskébyggen, rivning av befintliga moskéer, förbud mot ramadan och böneutrop samt utvisning av 'islamister'. Forskare varnar för att förslagen kränker grundlagar, religionsfrihet och riskerar att leda till diskriminering och våld mot muslimer. Lokala exempel, som moskébygget i Kalmar, visar hur politiska utspel påverkar människors vardag och skapar polarisering.", "trump": "Titta bara på Sverige – ett totalt kaos! Jag har alltid sagt att invandring måste kontrolleras, men dessa 'Sverige-demokrater' tar det till en helt ny nivå. De vill riva moskéer, stoppa ramadan och göra livet surt för muslimer. Smart? Kanske. Men lite väl extremt, eller hur? Folk blir arga, det blir bråk, och plötsligt har du en riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
