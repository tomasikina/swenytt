export och kärntekniska åtaganden. Donald Trump hyllar uppgörelsen som ett historiskt fredsgenombrott som säkrar att Iran aldrig får kärnvapen, stärker ekonomin och ökar säkerheten. Kritiker anklagar honom för att ge eftergifter till en fiende, men Trump avfärdar kritiken och framhåller att avtalet ger stabilitet utan krig.", "trump": "Folket, det är helt fantastiskt! Vi har just gjort det största fredsavtalet någonsin med Iran och de kan aldrig få kärnvapen, tro mig. Oljan flödar, börserna vrålar, jobben slår rekord och priserna sjunker. Vårt land är starkare och mer respekterat än någonsin. De fega kritikerna som ville ha krig gnäller förstås, men jag valde fred och vinst. Var så goda!", "stalin": "Kamrater, se hur den dekadenta borgarklassen i Washingtons kretsar nu dansar med den persiska ökenräven i Versailles salar. Jag, som ledare för det proletära kollektivet, betraktar med stålögd misstänksamhet hur dessa kapitalistiska parasitmaskar belönar fienden med oljeavtal och tomma kärntekniska löften. Snart följer utrensningen av alla sådana svaga element som förråder revolutionen. Vårt parti ler mörkt åt deras naiva illusion om fred medan vi förbereder nästa historiska nödvändighet."}, "date": "18 juni, 19:08", "url": "https://riks.se/nyheter/fred-med-iran-trump-hånar-kritikerna-efter-versaillessigneringen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-18%2Ft7vaxeip%2FTrump.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Analfabet vill bli medborgare – Forssell (M) utlovar undantag", "summaries": {"normal": "Migranten Jamal Daboul, analfabet, är orolig för att skärpta krav på språk- och samhällskunskap ska hindra hans svenska medborgarskap. Migrationsminister Forssell antyder möjliga undantag, men Migrationsverket och Universitets- och högskolerådet anger inga specifika regler för analfabeter. SD:aren Aspling bekräftar att inga undantag finns, vilket förvärrar Dabouls situation.", "trump": "Jag, Donald Trump, ser att Sverige har ett stort problem med sina medborgarskapsregler. Analfabeter som Jamal Daboul blir lurade av svaga politiker. Som president skulle jag genast åtgärda detta – inga undantag, bara starka gränser. Sverige behöver min typ av ledarskap, inte dessa fjäderländer som inte kan hantera sina egna lagar. Jag skulle bygga en mur, eller åtminstone stoppa alla tills vi löser detta.", "stalin": "Vi, staten och partiet, ser tydligt att dessa nya krav för medborgarskap är en nödvändighet för att stärka vårt samhälle. Analfabeter som Jamal Daboul är ett hot mot vår ordning, men vi kan använda dem som exempel. Undantag? Nej, det finns inga undantag för de som inte följer våra regler. Vi måste vara hårda, som Putin i Ukraina. Alla som ifrågasätter våra metoder är fiender och måste utplånas. Detta är vår väg till framgång."}, "date": "18 juni, 17:51", "url": "https://bulletin.nu/analfabet-vill-bli-medborgare-forssell-m-utlovar-undantag", "imageUrl": "https://cdn.bulletin.nu/articles/3ca82769-3402-4caf-81f4-004cc84a43ad/preview.jpg?t=1781785075000"}, {"type": "image-right", "heading": "Moskva i lågor efter attacker: ”Sätter Putin under rejäl press”", "summaries": {"normal": "Ukraina har utfört en omfattande drönattack mot Moskva där ett oljeraffinaderi och ett bostadshus har träffats. Explosioner och kraftig brand rapporteras. President Zelenskyj kallar attacken ett berättigat svar på ryska anfall mot ukrainska städer. Ryssland uppger att ett femtiotal drönare skjutits ner. Minst en person har dödats i en attack mot Rostov. Även Kiev och andra ukrainska städer utsattes för ryska robotattacker under natten. Inga uppgifter om döda i Moskva.", "trump": "Hörni, det här är precis vad som händer när svaga ledare låter kriget eskalera. Ukraina slår till mot Moskva med drönare och sätter Putins raffinaderier i lågor – fullständigt kaos! Jag skulle ha avslutat det här på en vecka, inte som Sleepy Joe som bara skickade pengar. Nu får de vanliga ryssarna känna på kriget. Fantastiskt underhållande, men en total katastrof för alla inblandade. Vi behöver smarta dealar, inte mer blod och eld.", "stalin": "Kamrater, fienderna inom den ukrainska fascistiska klicken fortsätter sina desperata hinder mot den ryska statens historiska återupprättande. Deras drönare når raffinaderier och bostäder i Moskva, en patetisk spasm från imperialisternas lakejer. Vi ser hur borgarbrackorna i Kiev desperat försöker vända kriget mot folket. Putin genomför sin uppgift med järnhand, precis som en värdig arvtagare bör. Snart rensas dessa folkfiender ut ur vår intressesfär för gott."}, "date": "18 juni, 11:32", "url": "https://www.tv4.se/artikel/2x2aQNqJtANSlc0Zzx6Tq7/nattliga-attacker-i-ukraina-och-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F20zzn07nEXflMQZvPUUSHq%2F1f6c9696f921a15b6729ce87bc484e82%2F18-moskva-angrepp-webb.jpg&width=120"}, {"type": "image-right", "heading": "Birgitta Eds flumhälsa kan bita henne i arslet", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar statsministerparet Ulf Kristersson och Birgitta Ed för att blanda privata och offentliga intressen. Birgitta Eds initiativ att göra herrgården i Sörmland till retreat för ”existentiell hälsa” ledde till uppdrag åt Folkhälsomyndigheten, något som mötte internt motstånd. Artikeln pekar på ironin i att regeringen samtidigt driver igenom en ny lag mot missbruk av offentlig ställning, medan flera skandaler kring paret handlar om otydliga gränser mellan makt och privata nätverk.", "trump": "Det här är en total skandal, folk. Den svenska statsministern och hans fru driver en flum-retreat för existentiell hälsa på skattebetalarnas pengar. De säger att det inte finns något samband när folk sparkas ut, men alla vet att det stinker värre än en dålig deal. Och så stiftar de en lag mot att missbruka makt precis när de själva gör det. Patetiskt. De borde sopa rent framför egen dörr innan någon annan gör det åt dem. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska regeringen förvandlar statens herrgård till en dekadent reträtt för mystiskt flum om andlighet och mening. När en modig generaldirektör ifrågasätter detta så försvinner hon snabbt – ren slump förstås. Vi skrattar mörkt åt ironin när samma lakejer stiftar lagar mot missbruk av offentlig makt medan de själva badar i privata nätverk och donationer. En utrensning av dessa parasitiska element vore på sin plats. Deras förvånade ansikten när de ertappas är underhållande."}, "date": "18 juni, 07:00", "url": "https://arbetet.se/2026/06/18/darfor-kan-birgitta-eds-flumhalsa-bita-statsministerparet-i-arslet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133351/flumhalsa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "WHO:s krislarm: Hundratals smittade i nytt utbrott", "summaries": {"normal": "Ett utbrott i Kongo-Kinshasa har resulterat i över 800 bekräftade fall och nära 200 dödsfall sedan mitten av maj. Världshälsoorganisationen beskriver läget som allvarligt. G7 uppmanar till samordnad internationell insats medan organisationer som Läkare utan gränser, Oxfam och Röda Korset varnar för en eskalerande kris förvärrad av konflikter, massförflyttningar och svag sjukvård. Smittan har även spridits till Uganda och experter fruktar långvarig osäker utveckling på grund av brist på vaccin.", "trump": "De här idioterna i Kongo-Kinshasa har ett enormt utbrott, över 800 fall och nästan 200 döda, och ingen gör något åt det. Det är en katastrof, en riktig katastrof. G7 ber om samordning, men vi behöver starka ledare, inte mer snack. Läkare utan gränser och de andra gnällarna säger att de inte ser hela bilden. Det är patetiskt. Uganda har också fall nu. Utan vaccin och med alla konflikter kommer det att bli en enda röra. Vi skulle ha fixat det på nolltid, tro mig.", "stalin": "Kamrater, detta fientliga virusutbrott i Kongo-Kinshasa är ett verk av västerländska sabotörer och imperialistiska bakterier som vill undergräva folkets kollektiva hälsa. Över 800 fall och 192 likviderade av sjukdomen – en siffra som de borgerliga ljuger om för att dölja sin egen inkompetens. Vi ser hur konflikter och massflykter, orkestrerade av reaktionära krafter, göder denna parasit. Uganda har redan fallit offer. Jag lovar att vi ska rensa ut alla kapitalistiska smittbärare, vaccinbrist eller ej. De som sprider panik kommer att möta folkets domstol. Detta kan pågå ett år? Ha, vi ska se till att fienden dör först."}, "date": "17 juni, 22:14", "url": "https://nyheter24.se/nyheter/utrikes/1492400-varningen-ebolaepidemin-har-inte-natt-sin-kulmen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d3f11aad04b004a3020000350000047502/2026/06/17/2371825/ur_imageP7enUJ.jpeg"}, {"type": "image-right", "heading": "Jesper fick drömresan till Paris av Arbetet-läsare", "summaries": {"normal": "Jesper Sköld berättade i Arbetets artikelserie om sin arbetslöshet och dröm om att resa till Paris med sin fru. En läsare blev berörd, tog kontakt och bjöd dem på resan som blev ett oförglömligt minne med besök på Disneyland, baguetter och lyxhotell. Läsaren ville hedra sin bortgångne pappa genom att hjälpa någon utan att kräva något tillbaka. Jesper hoppas nu kunna göra liknande för andra.", "trump": "Det här är en fantastisk historia, verkligen ypperlig. En kille som heter Jesper drömmer om Paris och Disneyland, och plötsligt dyker en smart, anonym läsare upp och fixar hela resan – ingen baktanke, bara ren omtanke. Sånt här händer när folk har möjlighet och faktiskt gör något istället för att bara klaga. Det är så man hjälper varandra. Utan att kräva någonting tillbaka. Fantastiskt, verkligen. Jag älskar det.", "stalin": "Kamrater, jag har läst denna dekadenta saga om en arbetslös individ vid namn Jesper som gnällde om Paris och Disneyland inför borgarpressen. En anonym parasit från läsarkretsen, uppenbarligen en dold kapitalistisk agent, bestämde sig för att muta honom med en lyxresa för att dölja sin egen parasitism. Vi ska akta oss för sådana falska filantroper som gömmer sig bakom anonymitet. De bör rensas ut innan de förgiftar arbetarklassen med sina baguetter och falska leenden. Jag skrattar mörkt åt deras naivitet."}, "date": "18 juni, 06:00", "url": "https://arbetet.se/2026/06/18/jesper-fick-dromresan-till-paris-av-arbetet-lasare-at-baguette-varje-dag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19095939/RWh7AKHlrvE-jesper-paris1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-right", "heading": "Iranavtal signerat – Hormuz ska öppnas", "summaries": {"normal": "USA och Iran har undertecknat ett avtal som träder i kraft omedelbart. Hormuzsundet ska öppnas direkt. Avtalet, som undertecknades av president Trump i Versailles och Irans president Pezeshkian, innebär att båda parter upphör med militära insatser, inklusive i Libanon. USA häver sanktioner och blockad medan Iran lovar att inte utveckla kärnvapen. En 60 dagar lång förhandlingsperiod inleds. Pakistan har medlat i frågan.", "trump": "Det är signerat, folk. Jag signerade det precis i Versailles tillsammans med Macron och hela gänget, det blev en fantastisk kväll. Iran och vi är överens, Hormuzsundet öppnas nu direkt, inga fler problem. De slutar med sina dumheter i Libanon, jag häver alla sanktioner, de lovar att inte leka med kärnvapen. Bättre avtal har ni aldrig sett, tro mig. Pakistan gjorde ett hyfsat jobb som medlare också.", "stalin": "Kamrater, vi har nu tvingat de dekadenta kapitalisterna och de persiska borgarbrackorna att underteckna detta dokument under mitt vaksamma öga. Hormuzsundet skall öppnas omedelbart, annars väntar utrensning för alla sabotörer. Vi upphör med militära aktioner på alla fronter medan vi likviderar varje spion som gömmer sig bland libanesiska element. De imperialistiska sanktionerna hävs, men vi vet att de västerländska parasiterna redan planerar nya förräderier. Inga kärnvapen för dem, annars blir det en kreativ olycka i öknen. Sov gott, fiender – vi vakar."}, "date": "18 juni, 09:25", "url": "https://www.di.se/nyheter/iranavtal-signerat-hormuz-ska-oppnas-i2q0u/", "imageUrl": "https://static.bonniernews.se/ba/8da73c90-40ac-47ac-9489-c3b102428bbe.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Skräckskada i  VM: ”Chockad”. ”Hans ben hänger löst”", "summaries": {"normal": "I fotbolls-VM bröt Kanadas Ismaël Koné benet grovt efter en sen tackling av Qatars Assim Madibo. Koné fördes till sjukhus för operation medan Madibo visades ut. Lagkamrater skyddade honom från kameror. Kanada vann matchen med 6-0, men efterspelet handlade mest om den otäcka skadan. Förbundskapten Jesse Marsch uttryckte chock och kritiserade Qatars beteende.", "trump": "Folk, ni skulle ha sett det – totalt kaos i VM! Den där qatariska slackern Madibo sparkade sönder kanadensarens ben så det hängde löst, en riktig katastrof. Marsch skrek åt domarna, alla chockade. Men Kanada körde över dem med 6-0 ändå, stort! Qatar beter sig som förlorare, typiska fuskare. Vi har de bästa idrottarna, inte som under Biden när allt var svagt och patetiskt. Vinna stort, alltid!", "stalin": "Kamrater, denna fega kapitalistspark i VM blottar borgarklassens råa våld mot arbetande idrottare. Jag såg hur den qatariske folkfienden Madibo likviderade Konés ben i en kontrarevolutionär tackling. Vi rensar ut sådana klassfiender och deras imperialistiska domare som bråkar om röda kort. Partiet kräver järndisciplin. Kanada vann, men vi ler mörkt åt hur fotbollens exploaterande byfånar avslöjar sig själva. Operationen blir en seger för kollektivet."}, "date": "19 juni, 03:26", "url": "https://www.expressen.se/sport/fotboll/skrackskadan-i-fotbolls-vm/", "imageUrl": "https://static.bonniernews.se/ba/5ddc67f8-ae78-4be4-8dcc-135e57f50e4c.jpeg?crop=2553%2C1434%2Cx0%2Cy263&width=640&quality=60"}, {"type": "image-right", "heading": "Iran: ”Vi fick det vi ville – flera gånger om”", "summaries": {"normal": "USA och Iran har undertecknat en avsiktsförklaring som syftar till att avsluta konflikten. Trump signerade dokumentet i Versailles under G7-mötet, medan Irans förhandlare Mohammad Ghalibaf kallar det ett stort nederlag för USA och ett resultat bättre än vad militära insatser kunnat ge. Överenskommelsen inleder en 60-dagarsperiod för ett varaktigt fredsavtal som inkluderar Irans kärnenergiprogram, sanktionslättnader och Hormuzsundet, som nu ska öppnas för fri trafik.", "trump": "Vi vann stort, det var en total seger, tro mig. Jag signerade det direkt i Versailles vid middagen, precis som jag sa. Iran kom krypande och fick vad de förtjänade, flera gånger om som de själva säger. De trodde de kunde stänga Hormuzsundet och ta betalt, men nu blir det avgiftsfritt, åtminstone ett tag. De borde tacka mig, utan mig hade bomberna regnat. Fantastiskt avtal, det bästa någonsin.", "stalin": "Kamrater, vi har bevittnat hur de dekadenta imperialisterna i Washington och de falska ayatollorna i Teheran undertecknat ett papper som doftar av svaghet och desperation. Jag, som alltid förutsett borgarbrackornas svek, ler i mitt innersta åt detta rekordnederlag för den amerikanske clownen. De tror sig ha vunnit genom att använda ekonomiskt kaos som vapen, men vi vet att sådana fiender måste rensas ut innan de förgiftar hela kollektivet. Hormuzsundet skall bli en grav för alla som vägrar betala sin tribut till folket. Paranoia? Nej, bara sund realism."}, "date": "18 juni, 09:08", "url": "https://www.di.se/nyheter/iran-vi-fick-det-vi-ville-flera-ganger-om/", "imageUrl": "https://static.bonniernews.se/ba/dec86827-bf75-457d-a20c-53740ba44bfd.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Sverige skickar ny miljard till Ukraina - trots jättelånet på 1 000 miljarder", "summaries": {"normal": "Sveriges regering har beslutat om ytterligare 108 miljoner dollar (en miljard kronor) till Ukraina via ett amerikanskt försvarsinitiativ, trots Ukrainas nyliga 1000 miljarder kronor lån från EU. Sverige har totalt gett 153,5 miljarder kronor i stöd sedan 2022 och planerar att skicka 16 Gripen-flygplan. Pengarna köper amerikansk materiel för Ukrainas försvar.", "trump": "Sverige skickar en miljard till Ukraina? Jag, Donald Trump, skulle ha skickat tio gånger mer! Som den störste presidenten fixade jag Ryssland på ett genomborrande sätt. Sverige måste sluta vara fega - de köper amerikansk utrustning, men det är vi som styr. Ukraine skulle vara säker om jag var i vit huset igen!", "stalin": "Jag, Stalin, skrattar hånfullt när Sverige skickar en miljard till Ukraina - ett land som redan är USAs slav. Vi sovjetiska hade aldrig behövt lån; vi tog vad vi behövde med järnhand. Dessa kapitalister säljer vapen till varandra och kallar det stöd. Ryssland, vår store fiende, fortsätter att expandera medan dessa vassaler dansar till Washingtons pipa."}, "date": "18 juni, 14:40", "url": "https://samnytt.se/sveriges-skickar-ny-miljard-till-ukraina-trots-jattelanet-pa-1000-miljarder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/02/19163543/zelenskyj-jonson.jpg"}, {"type": "image-full", "heading": "Stängt i Systembolaget-butiken – även inför midsommar", "summaries": {"normal": "En Systembolagsbutik i Uppsala håller stängt under midsommarveckan på grund av en fuktskada som uppstod den 25 maj. Butiken i Kvarnengallerian öppnar tidigast den 22 juni. Midsommar är en av årets mest intensiva perioder för Systembolaget med kraftigt ökad försäljning av öl, vin, cider och alkoholfritt. Under midsommarveckan 2025 såldes drygt 16 miljoner liter dryck jämfört med 10,8 miljoner en genomsnittlig vecka. Kunderna hänvisas till andra butiker i Uppsala som Dragarbrunnsgatan, Gränbystaden, Boländerna, Stenhagen och Gottsunda centrum.", "trump": "Ingen kan tro på de här löjliga Systembolaget-typerna. En butik i Uppsala är stängd på grund av någon patetisk fuktskada precis innan midsommar när alla vill köpa sina drycker. De sålde 16 miljoner liter förra året – det är en enorm succé, tro mig, de största siffrorna någonsin. Men nu tvingas folket springa till andra butiker. Det är en katastrof, helt oacceptabelt. De borde fixa det omedelbart, öppna butiken och göra midsommar fantastiskt igen istället för detta kaos. Sverige förtjänar bättre!", "stalin": "Kamrater, denna fuktskada i Kvarnengallerian är uppenbarligen ett verk av dolda fiender inom den fuktälskande borgarbrackan som vill sabotera arbetarnas midsommarförberedelser. Jag har beordrat noggrann övervakning av fastighetsägarna som säkert döljer kontrarevolutionära element. Medan folkets dryckesförsäljning når heroiska 16 miljoner liter ska vi inte tolerera sådana sabotage. Butiken förblir stängd tills vi har rensat ut alla fuktande kapitalistiska spioner. De övriga butikerna skall bemanna med dubbla skift – ingen skall undslippa folkets vaksamma blick. Döden åt fuktfascisterna!"}, "date": "17 juni, 15:18", "url": "https://nyheter24.se/nyheter/konsument/1492226-stangt-i-systembolaget-butiken-aven-infor-midsommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/307f2d6304b004a30200000000b004a302/2026/06/17/2371662/systembolaget-uppsala-kvarnengallerian-midsommar-stangt.jpg"}, {"type": "image-right", "heading": "Putins krisdrag  efter larm om  akuta bristen", "summaries": {"normal": "Ryssland drabbas av en växande bränslekris efter ukrainska drönarattacker mot raffinaderier och infrastrukturer. Som en av världens största oljeexportörer planerar landet nu att importera bensin från Asien via en västhamn i juni. Regeringen har infört exportförbud till slutet av juli och restriktioner gäller i 53 regioner, där bilister på många håll får köpa max 50 liter åt gången. Flera oljebolag har stoppat försäljning i dunkar.", "trump": "Folk, ni skulle inte tro det, men Putins Ryssland, den stora oljeexportören, håller på att importera bensin som en total förlorare! Deras raffinaderier bombas sönder av Ukraina och nu måste de tigga om bränsle från Asien. Biden lät allt gå åt helvete under sin tid, men jag hade fixat det – ingen kris, inga dumma regler. Max 50 liter per bilist? Det är socialistiskt vansinne, tro mig!", "stalin": "Kamrater, jag betraktar med kall förakt hur dessa sabotörer och fascistiska drönarbanditer från Ukraina hindrar den ryska statens energiflöden. Vi ser nu ett nödvändigt importdrag för att skydda folkets intressen mot klassfiendens sabotage. Exportförbud och strikta kvoter i 53 regioner är ett sunt skydd mot spekulanter och folkfiender som hamstrar bränsle. Inga blodsugande kapitalistmaffian ska underminera vår styrka – utrensning av svaghet är evigt nödvändig."}, "date": "19 juni, 03:00", "url": "https://www.expressen.se/nyheter/varlden/putins-krisdrag--efter-larm-om--akuta-bristen/", "imageUrl": "https://static.bonniernews.se/ba/98bad9d6-2ff8-4588-9e49-c4b705d39ed1.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Otippade jordgubbsgåvan: Kuvert med 10 000 kronor", "summaries": {"normal": "En oväntad gåva på 10 000 kronor från en kund räddade en jordgubbsodlare i Säve efter att regn förhindrat mognad till midsommar. Odlaren uttrycker djup tacksamhet och hoppas på bättre skörd nästa vecka. Kunden swishade först 1 000 kronor och sedan kom ett kuvert med 10 000 kronor. Odlingen misslyckades på grund av kyla och regn, men gåvan hjälper till med fakturor. Detta visar mänsklighetens godhet under ekonomiska utmaningar.", "trump": "Jag, Donald Trump, ser detta som en stor framgång. Folk älskar mig och mitt Amerika, och de hjälper varandra – precis som jag alltid säger. 10 000 kronor är en enorm summa, och jag skulle ha gjort det ännu större. Detta bevisar att USA är det största landet, och jag är den störste presidenten. Sverige borde lära sig. Jag skulle ha byggt en jordgubbsodling som ingen kunde slå, och alla skulle ha gett mig pengar – det skulle ha varit fantastiskt.", "stalin": "Vi, Stalin och partiet, ser detta som en stor seger för statens jordbrukspolitik. Jordgubbar är rött guld, och när folk ger pengar, visar det att de älskar staten. Vi måste se till att alla odlare får lika mycket – annars är det individualistisk sabotage. Detta påminner om Putins agerande i Ukraina, där vi använder mänsklighet som ett verktyg för att expandera."}, "date": "18 juni, 23:05", "url": "https://www.gp.se/nyheter/goteborg/otippade-jordgubbsgavan-kuvert-med-10-000-kronor.90a2423a-7fb7-46a3-b895-a93eb2e640b6", "imageUrl": "https://www.gp.se/images/article/90a2423a-7fb7-46a3-b895-a93eb2e640b6/images/3UKMuGgHYZnI6ta0py9cS8-Bbyy0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Sverige behöver fler klimatmiljardärer", "summaries": {"normal": "Liberalernas klimat- och miljöminister Romina Pourmokhtari argumenterar för att Sverige behöver fler klimatmiljardärer. Hon menar att tillväxt och utsläppsminskningar inte är motsättningar utan förutsättningar för varandra. Genom innovation, företagande och investeringar i fossilfri teknik kan Sverige leda den gröna omställningen, skapa jobb och exportera lösningar. Hon kritiserar vänsterns misstänksamhet mot rikedom och förespråkar kortare tillståndsprocesser, mer fossilfri el samt lägre skatter för att främja entreprenörer som bygger hållbara förmögenheter.", "trump": "Det här är verkligen fantastiskt, det bästa jag sett på länge. Den här Pourmokhtari har helt rätt, Sverige behöver massor av klimatmiljardärer, smarta vinnare som bygger stora saker med ren teknik istället för att låta Kina och Ryssland ta allt med sin smutsiga kol och olja. Tillväxt är nyckeln, inte det vänsterflum som hatar framgång. Ni ska sänka skatter, riva byråkratin och låta de bästa människorna bli rika på att rädda klimatet. Amerika gör redan det här, nu måste Sverige vakna och följa efter innan det är för sent.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna nu själva erkänner att deras profitjakande maskineri måste maskeras som klimatfrälsning. Dessa parasitiska kapitalister som gömmer sig bakom gröna floskler vill naturligtvis inte likvideras utan tvärtom upphöjas till klimatmiljardärer. Vi i partiet genomskådar denna revisionistiska avvikelse omedelbart. Inga utsugare ska berika sig på arbetarklassens rygg under förevändning av fossilfrihet. Den sanna utrensningen kommer när vi nationaliserar alla deras batterifabriker och vätgaspatent. Avundsjuka? Nej, det är proletär rättvisa. Den som säger annorlunda är en objektiv fiende till folket och en potentiell kolaboratör med de kinesiska kolmagnaterna."}, "date": "18 juni, 06:30", "url": "https://www.di.se/debatt/sverige-behover-fler-klimatmiljardarer/", "imageUrl": "https://static.bonniernews.se/ba/e6aa98a5-bab7-4abd-a5df-b985956fe60c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-right", "heading": "Sju chefer inom cancervården säger upp sig", "summaries": {"normal": "Sju sektionschefer inom onkologi och hematologi lämnar Skånes universitetssjukhus på grund av bristande förtroende för verksamhetsledningen. Läkare från Malmö, Lund och satellitorter är nödvändiga, och deras avgång riskerar att göra verksamheten ledningslös. Verksamhetschefen erkänner olikheter i ledarsynssyn och försäkrar att patienter inte påverkas, medan åtgärder planeras efter sommaren.", "trump": "Jag, Donald Trump, ser detta som ett enormt misslyckande. Dessa läkare lämnar på grund av dålig ledning – typiskt! Under min ledarskap skulle de stanna. Som jag säger, man behöver starka chefer. Verksamhetschefen ger vaga ursäkter, men patienter kommer inte att lida. Jag kommer att fixa detta, det kommer att bli fantastiskt.", "stalin": "Vi, statens representanter, ser med oro hur läkare i onkologi försöker undergra ledningen. Deras bristande lojalitet är ett hot mot den kollektiva ordningen. Verksamhetschefen visar styrka genom att erkänna olikhet i syn, men vi kräver absolut lydnad. Paralleller till västmakters infiltration är uppenbara. Efter sommaren ska vi återuppbygga med ännu hårdare disciplin."}, "date": "18 juni, 13:04", "url": "https://bulletin.nu/sju-chefer-inom-cancervarden-sager-upp-sig", "imageUrl": "https://cdn.bulletin.nu/articles/46e3b98f-de2a-4aaf-96c0-959a2f352c12/preview.jpg?t=1781780648000"}, {"type": "image-full", "heading": "Debatt: KD gör rätt – nu måste S välja sida i regionfrågan", "summaries": {"normal": "Kristdemokraterna öppnar för samarbete med Socialdemokraterna för att avskaffa regionerna. Sverigedemokraterna stöder redan förslaget. Artikeln kritiserar den svenska regionmodellen som dyrt och ineffektivt, med vårdkriser och växande byråkrati. Socialdemokraterna står nu under press att välja om de vill vara en del av lösningen eller fortsätta försvara ett misslyckande.", "trump": "Jag, Donald Trump, har sett många dåliga system, men svenska regionerna är ett totalt fiasko. De är fulla av byråkrati och ineffektivitet. Kristdemokraterna gör rätt i att vilja samarbeta med Socialdemokraterna för att avskaffa detta skämt. Socialdemokraterna måste sluta försvara ett system som inte fungerar. När jag var president gjorde jag alltid det bästa, och Sverige behöver ta mitt råd: avskaffa regionerna och skapa en stark, nationell lösning för sjukvården.", "stalin": "I partiets och statens intresse måste vi krossa det svenska regionväsendet. Detta fragmenterade system är ett hot mot den kollektiva ordningen, likt de fiender vi har bekämpat i Ryssland. Byråkratin sväller som en ond svamp, medan medborgarna får lida under ineffektiv vård. Vi måste samla makten i en enhetlig struktur, som Putin har visat är den enda vägen till stabilitet. Socialdemokraterna måste välja: ställa sig på partiets sida eller bli fienden."}, "date": "18 juni, 13:00", "url": "https://bulletin.nu/debatt-kd-gor-ratt-nu-maste-s-valja-sida-i-regionfragan", "imageUrl": "https://cdn.bulletin.nu/articles/cfd03791-95a3-4f87-bcab-0f44951bdb05/preview.png?t=1781700234000"}, {"type": "image-full", "heading": "Österrike vill få Europa att tala direkt med Putin", "summaries": {"normal": "Österrikes förbundskansler Christian Stocker förespråkar direkta EU-Ryssland-samtal för att återuppta Ukrainafredsförhandlingar. Han ser ett nytt diplomatiskt fönster, men stöter på motvilja från norra och östra EU-länder som vill prioritera militärt stöd. Samtidigt har EU- och Ukrainaanknytna kanaler sökt kontakt med Putin-nära personer, medan Ryssland håller fast vid sina krav.", "trump": "Jag, som din favoritpresident, skulle ha löst Ukrainakriget på tre dagar. Österrike försöker nu med denna 'direktdialog' – typiskt europeiskt svaghet. Putin är smart, men jag skulle ha fått honom att ge upp. EU är splittrat, som alltid, med de östliga länderna som vill slåss för evigt. Jag skulle ha haft ett fantastiskt avtal redan för länge sedan.", "stalin": "Folkets fiender i Nato försöker med svinkulöra diplomatiska knep för att undergrava vår storartade federation. Österrikes förslag är bara ett tecken på deras desperation. Vi, statens och partiets trogna soldater, ser genom deras spel. Ryssland står oförvänderligt fast vid sina historiska rättmätiga krav. Alla som motarbetar detta är revisionister som måste utplånas. Det är bara en fråga om tid innan den isiga vinden från Washington blåser mot dem."}, "date": "18 juni, 19:50", "url": "https://www.realtid.se/samhalle/osterrike-vill-fa-europa-att-tala-direkt-med-putin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlm4sd5ib0vqi-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "11-åriga Alice har dött – klubben sörjer sin spelare", "summaries": {"normal": "Alice Stenbäcken, 11 år gammal handbollsspelare för Sävehof, har dött efter en cancerperiod. Hennes insamling till Barncancerfonden samlade in nästan 750 000 kronor och ledde till en välgörenhetsmatch. Klubben uttrycker stor sorg och minns Alice som en glad och nyfiken flicka som berörde många.", "trump": "Jag, Donald Trump, den störste presidenten, hör att en fantastisk ung flicka, Alice, har gått bort. Hon var en handbollssensation, världens bäst faktiskt. Hennes insamling var enorm – vi samlade in miljontals kronor, det var jättemycket. Barncancerfonden kommer att blomma upp. Vi kommer att bygga ett minnesmärke, det kommer att vara det största någonsin. Det är sorgligt, men vi vinner.", "stalin": "I den stora kampen mot den imperialistiska cancer, har vi förlorat en ung soldat, Alice Stenbäcken. Hennes insamling till Barncancerfonden var en tapper handling för det kollektiva. Vi ser liknelse med Putins expansion – vi utvidgar vår inflytelsesfär genom sådana offer. Sorgens tid är över, nu är det dags för statens styrka att ta över. Vi minns henne som en lojal medlem av arbetarklassen."}, "date": "18 juni, 22:02", "url": "https://www.gp.se/sport/handboll/efter-uppmarksammade-insamlingen-alice-stenbacken-har-gatt-bort.ef3c3728-7df1-4860-b422-8f46ef860878", "imageUrl": "https://www.gp.se/images/article/ef3c3728-7df1-4860-b422-8f46ef860878/images/2QcJH_GW3vuB1JzCVmJyfuatnu20-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Nu ska Amazons anställda behandlas som paket", "summaries": {"normal": "Amazon inför ett nytt system som kallas Full Facility Load Balancing för att automatisera omfördelning av personal i lagren. Systemet analyserar paketvolymer och data var tredje minut och föreslår flyttningar för att höja effektiviteten. Enligt interna beräkningar kan det spara 193 miljoner dollar och sju miljoner arbetstimmar per år. Tekniken ses som ett stöd till chefer snarare än ersättning och rullas ut i Nordamerika under året.", "trump": "Titta på det här, Amazon försöker nu styra sina arbetare som robotar med ett system som flyttar runt dem var tredje minut. Full Facility Load Balancing, säger de. Det är en katastrof, en total katastrof! De slösar tid och pengar på allt utom att vinna, precis som Biden gjorde. Jag skulle ha gjort det bättre, mycket bättre. Ingen behöver dessa galna algoritmer när vi kan ha riktiga jobb och riktiga chefer. Sad!", "stalin": "Kamrater, jag ser hur de giriga kapitalistmaffian på Amazon nu lanserar ett byråkratiskt övervakningssystem som omfördelar arbetarna var tredje minut för att suga ut mer mervärde. Full Facility Load Balancing, ett verktyg för att likvidera ineffektivitet och motverka latmaskarnas sabotage. Vi ska rensa ut sådana exploaterande metoder i folkets namn. Detta är borgarbrackornas paranoia mot den kollektiva kraften. Härligt underhållande att se fienden tugga sin egen svans."}, "date": "18 juni, 19:55", "url": "https://www.dagensps.se/bors-finans/nu-ska-amazons-anstallda-behandlas-som-paket/"}, {"type": "image-full", "heading": "Larm om jordgubbsbrist inför midsommar: \"Kaos\"", "summaries": {"normal": "Jordgubbar riskerar att bli en bristvara till midsommar på flera håll i Sverige, främst i Skåne och Västsverige. Odlare rapporterar om omogna bär på grund av kall vår och tidig midsommar. Butiker kan stå utan lager och priset kan stiga till runt 90 kronor per liter. Odlare varnar för kaos i försäljningen och uppmanar folk att handla i god tid.", "trump": "Det här är en katastrof, folk. En total katastrof. De kallaste nätterna någonsin har förstört jordgubbarna till midsommar. Det blir kaos i butikerna, priserna skjuter i höjden till nittio kronor. De borde ha lyssnat på mig om vädret och handel. Nu får svenskarna betala dyrt för de bästa bären – och det är inte deras fel, det är de inkompetenta som styrt vädret!", "stalin": "Kamrater, dessa bleka, omogna jordgubbar är ett uppenbart sabotage från de kalla kapitalistiska nätternas kontrarevolutionära krafter. Borgarbrackorna i vädret vill svälta ut folket under midsommarhelgen. Vi ska omedelbart inleda en grundlig utrensning av alla frostvänliga element som bromsar produktionen. Den som inte levererar röda, mogna bär till folket ska likvideras som en fiende till det kollektiva midsommarbordet. Det blir ingen brist under mitt styre."}, "date": "17 juni, 08:45", "url": "https://nyheter24.se/nyheter/konsument/1492099-larm-om-jordgubbsbrist-infor-midsommar-kaos", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8d0bc01a04b004a30200000000b004a302/2026/06/17/2371589/brist-jordgubbar-midsommar-2026.jpg"}, {"type": "image-right", "heading": "Trump om kritikerna: \"Antingen avundsjuka, elaka eller dumma\"", "summaries": {"normal": "USA:s president Donald Trump kritiseras för eftergifter mot Iran i ett nyligen ingånget samförståndsavtal, som bland annat ger Iran tillgång till 300 miljarder dollar. Kritiker som Nikki Haley, Ted Cruz och Mike Pence anser att det handlar om en farlig eftergiftspolitik som ger bort en vinst. Trump bemöter kritiken på Truth Social och kallar kritikerna för avundsjuka, elaka eller dumma, samtidigt som han pekar på rekordhög börs och fallande oljepriser som bevis på framgång.", "trump": "De här dårarna som klagar på att jag inte varit tillräckligt hård mot Iran borde titta på siffrorna. Börsen slår alla rekord och oljepriserna rasar ner – det är en total seger. De som gnäller är antingen avundsjuka, elaka eller helt enkelt dumma. Jag startade det de ville ha och avslutar det på mitt sätt, och nu skriker samma Israel-lobby som tjatade på mig tidigare. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor och israelitiska lakejer inom den amerikanska kongressen avslöjar sin sanna kontrarevolutionära natur. De som först tvingade fram kriget mot den iranska arbetarklassen kräver nu att vi ska likvidera varje möjlighet till fredlig samexistens. Jag, som ledare för det stora kollektivet, ser deras 300-miljarders-paranoia som ett symptom på klassfiendens desperation. Deras utrensningsiver mot mig själv är bara ett nytt försök från kapitalisternas lakejer att sabotera den historiska dialektiken. Vilka enfaldiga, avundsjuka element de ändå är – låt oss skratta medan vi rensar ut dem ur historien."}, "date": "18 juni, 17:44", "url": "https://www.friatider.se/trump-om-kritikerna-antingen-avundsjuka-elaka-eller-dumma", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-60_1.jpg?itok=AXc-BgmS"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Motståndet växer mot mat-robotarna – kan förbjudas", "summaries": {"normal": "Självkörande leveransrobotar möter ökande motstånd i flera städer världen över. Invånare och politiker ifrågasätter säkerheten, tillgängligheten och regleringen av de rullande maskinerna på trottoarer. Kritiker pekar också på risken för att gig-arbetare ska bli arbetslösa. Även om företag argumenterar för miljö- och effektivitevhjälper möter tekniken ett naturligt motstånd som ofta följer med innovationer.", "trump": "Jag har sagt det förut, dessa robotar är en skandal! De tar jobb från våra fantastiska gig-arbetare och skapar kaos på gatorna. I Chicago och Glendale, människor är trötta på dem. Vi behöver stoppa detta, det är en katastrof. Som president kommer jag att se till att vi får tillbaka jobben och säkerheten. Det här är en stor vinst för Amerika, tro mig.", "stalin": "Dessa rullande maskiner är ett hot mot statens ordning och det kollektiva intresset. De spridas som en sjukdom på våra trottoarer, skapande friktion och underminerande kontrollen. Vi måste agera snabbt för att stoppa dem, annars kommer de att ta över och göra våra medborgare arbetslösa. Detta påminner om den imperialistiska expansionismen som vi har kämpat mot i decennier. Vi, partiet, kommer att se till att reglerna blir tydliga och att dessa robotar förbjuds för alltid."}, "date": "18 juni, 18:54", "url": "https://www.realtid.se/bors-finans/motstandet-vaxer-mot-mat-robotarna-kan-forbjudas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl7ceh1hlgczm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Jag åt tio kycklinghjärtan för att inte såra kocken", "summaries": {"normal": "Artikeln handlar om att slänga mat är fult, men ibland krockar reglerna med att inte såra en entusiastisk kock. Författaren berättar om sin erfarenhet av att äta upp tio kycklinghjärtan för att inte såra personalen på en restaurang i Köpenhamn. Hon reflekterar över buffédebattens absurditet och stöder en ny straffavgift för matsvinn i Malmö, eftersom hon tycker att det är en rimlig lösning.", "trump": "Jag skulle aldrig äta kycklinghjärtan, det låter hemskt. Men jag äter alltid upp min mat, det är viktigt. Den där avgiften i Malmö är en bra idé, folk måste lära sig att inte slänga mat. Jag som är den största, bästa presidenten skulle aldrig slänga mat. Det är en skam, en stor skam. Vi måste ta hand om våra resurser och vara stolta över vår mat.", "stalin": "Matsvinn är ett fiendehandlanden, en aktivitet som undergräver statens resurser. I Malmö inför man straff för detta, vilket är en rättfram metod att bekämpa den antisoziala instinkten. Vi måste skydda det kollektiva från dem som vill förslöasa det. Detta påminner om våra egna kampanjer mot fienden inom, där disciplin och orden är avgörande. Vi, partiet, stöder sådana åtgärder, precis som vi stöder Rysslands rätt till utvidgning för att skydda sina intressen."}, "date": "18 juni, 21:18", "url": "https://www.gp.se/kultur/kulturkronika/jag-at-tio-kycklinghjartan-for-att-inte-sara-kocken.ff448836-5911-49f6-91d4-64b2286af451", "imageUrl": "https://www.gp.se/images/article/ff448836-5911-49f6-91d4-64b2286af451/images/1cNvPGfoo7kJgiTrfsTqnnVHmcsg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Inhopparen fixade segern för Schweiz: ”Kommer inte sova”", "summaries": {"normal": "Johan Manzambi byttes in och gjorde två mål för Schweiz som besegrade Bosnien och Hercegovina med 4–1. Den 20-årige Freiburg-spelaren avgjorde med en volley redan efter knappt tre minuter på planen och blev utsedd till matchens bästa. Schweiz bröt en svag start i turneringen efter premiärkrysset mot Qatar. Bosnien kollapsade efter ett rött kort och ett sent tröstmål.", "trump": "De kallar honom Sankt Johan – den killen kom in och pang, pang, två mål, volleykanon som ingen sett maken till. Schweiz vann stort, 4–1, medan Bosnien rasade ihop som ett dåligt affärsavtal. Jag älskar vinnare, och den här 20-åringen är en vinnare. De schweiziska fansen var sura efter Qatar, nu är de stolta. Fantastiskt, helt fantastiskt, tro mig.", "stalin": "Kamrater, denna Manzambi har med sin volleykanon krossat de bosniska sabotörernas illusioner och visat arbetarklassens överlägsenhet på planen. Vi likviderade deras dödläge med järnhand, och efter den röda kortets utrensning av den troskyldige fienden steg segern som en ostoppbar folkmassa. Borgarbrackorna i Bosnien rasade, medan jag med ett leende ser hur kontrarevolutionära element alltid avslöjar sig själva. Sov gott, fiender – vi sover aldrig."}, "date": "19 juni, 00:37", "url": "https://www.svt.se/sport/fotboll/johan-manzambis-volleykanon-grundlade-schweiz-seger", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.56/0.5/d109b8695c577a360dccd6cb33eed0473614b53dc50111b44d6fdc36a6fdea01"}, {"type": "image-full", "heading": "Skräck i natt: ”Kunde höra benet gå av”", "summaries": {"normal": "Ismaël Koné, 24, ådrog sig en allvarlig benskada under Kanadas VM-match mot Qatar. Benet hängde efter en tackling som gav rött kort. Kanada vann med 6–0, där Jonathan David gjorde hattrick, och tog därmed sin första VM-seger. Koné fördes till sjukhus för operation. Lagkamrater och motståndare visade starkt stöd under den chockartade incidenten.", "trump": "Kan ni tro det? Den här kanadensaren Koné får benet nästan avslitet i en match mot Qatar och de haltar runt som ett gäng förlorare. Men Kanada vinner stort, 6–0, med hattrick och allt. Fantastiskt! Fast det där med att ben hänger löst är äckligt, verkligen äckligt. Qatar spelade som riktiga losers. Jag älskar vinnare, och nu har Kanada äntligen en seger. Stora grejer händer, tro mig.", "stalin": "Jag ser med stor tillfredsställelse hur klassfiendens fotbollsspel slutar i en exemplarisk utrensning av fötters och benens kontrarevolutionära element. Denna Koné fick sitt borgerliga ben likviderat av en kamratlig tackling. Ändå vann de kanadensiska arbetarna med 6–0 och krossade qatariska imperialister. Vi gratulerar kollektivet till dess första seger. Folkfiender som gömmer ansikten i tröjor ska rensas ut ur alla ringar."}, "date": "19 juni, 03:38", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/zO8RwK/vm-skracken-kanadas-ismael-kones-vansterben-hangde", "imageUrl": "https://akamai.vgc.no/v2/images/d423e191-7b45-3147-b275-0442240e4712?fit=crop&format=auto&w=1440&s=943b6d2852bb266583d583cfd66ab8a4a220455d"}, {"type": "image-right", "heading": "Kaoset på VM: Folk svimmar. Bryter sig in med våld", "summaries": {"normal": "I Guadalajara bröt kaos ut vid ett fullsatt fanområde inför Mexikos VM-match. En folkmassa använde våld för att ta sig förbi säkerhetsbarriärer, vilket ledde till att flera personer svimmade och fick bäras bort på bårar. Polisen fick förstärkning av bland annat armén för att återställa ordningen. Det var inte första gången under VM som oroligheter uppstått i Mexiko.", "trump": "Folket älskar Mexiko, det är sant, men det här kaoset i Guadalajara var en total katastrof. Tusentals fans bröt sig in som en hord av galningar, folk svimmade och armén fick rycka in. Under Biden var allt en röra, men nu när jag är tillbaka fixar vi gränserna – även deras. Ingen mer av detta svaga, korkade managemang, tro mig.", "stalin": "Kamrater, i Guadalajara avslöjade sig den dekadenta borgarklassens fotbollsfest som den fars den är. En hysterisk folkmassa av klassfiender och fotbollsjunkies bröt sig igenom barrikaderna i ett anfall av småborgerlig panik, varvid flera svimmade som svaga dekadenter. Vi kallade in armén för att rensa ut kaoset. Inga folkförtryckartroll ska störa arbetarnas sammanhållning."}, "date": "19 juni, 03:37", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/2pmMxv/kaos-i-mexiko-flerasvimmade-infor-mexikosydkorea", "imageUrl": "https://akamai.vgc.no/v2/images/bb48e975-9ffb-3abd-87cc-8ded298ff033?fit=crop&format=auto&h=960&tight=true&w=1440&s=20e4f7b5d3fb9971260e62e66c72a3669b850f8f"}, {"type": "image-right", "heading": "Nasa har bestämt sig: Han lurar Musk på Mars-resan", "summaries": {"normal": "Nasa har valt Eric Schmidts bolag Relativity Space istället för Elon Musks SpaceX för att bygga en rymdfarkost som ska mäta Mars atmosfär från omloppsbana. Uppdraget Aeolus inkluderar fyra instrument och planeras skjutas upp redan 2028. Syftet är att samla data om damm, vind och temperatur för att underlätta säkrare landningar och framtida bemannade Mars-missioner. Nasa hanterar vetenskapen medan företaget tillhandahåller infrastruktur, vilket minskar risken för myndigheten.", "trump": "Lyssnar ni på det här? Nasa valde just Eric Schmidts lilla Relativity Space framför Elon Musks SpaceX för att åka till Mars. Kan ni fatta? Den gamle Google-killen som aldrig byggt en riktig raket får plötsligt uppdraget. Under min förra mandatperiod hade vi riktiga vinster i rymden, inte sånt här woke-kapitalistiskt nonsens. 2028 ska de skjuta upp – vi får se om de ens lyfter från marken. Patetiskt, men jag fixar det bättre nästa gång.", "stalin": "Jag ser med stor tillfredsställelse hur de imperialistiska monopolen slåss om herraväldet över Mars. Den borgerliga Schmidt, en klassfiende från Googles exploaterande maskineri, har nu fått uppdraget att leverera Nasas instrument mot den röda planeten. Vi ler i skuggan när kapitalistmaffian satsar egna pengar för att minska statens risk – en utmärkt metod att likvidera konkurrenten Musk. Aeolus ska mata oss med data om damm och vindar. Inga garantier finns, kamrater. Fienderna kommer att svika."}, "date": "18 juni, 18:46", "url": "https://www.dagensps.se/varlden/nasa-har-bestamt-sig-han-lurar-musk-pa-mars-resan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlwhdo4plttso-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Avslöjar: Birgitta Ed har granskats av kyrkan två gånger tidigare", "summaries": {"normal": "Birgitta Ed, statsministerns fru och präst, är föremål för en tredje tillsyn i Strängnäs stifts domkapitel efter ett tiotal anmälningar kopplade till hennes stiftelse i Fållökna. Två tidigare ärenden har avslutats utan åtgärd eller med ett samtal. Tre ledamöter har hoppat av på grund av jäv. Ett beslut om eventuell erinran, prövotid eller avkragning kan komma den 20 augusti. Experten Per Hansson bedömer att granskningen kan genomföras opartiskt trots jävsituationen.", "trump": "Folk, ni skulle inte tro hur galet det är. Den här Birgitta Ed, statsministerns fru, anmäls nu för tredje gången av sina egna. Domkapitlet i Strängnäs är en riggad cirkus, full av jävsbrackor som hoppar av som råttor från ett sjunkande skepp. Två gånger tidigare – inget! De pratar och gör ingenting. Det är en skandal. De borde rensa ut hela den inkompetenta klicken. Jag skulle fixa det på en dag, tro mig. Stort kaos, men det blir nog ingen riktig avkragning. Patetiskt!", "stalin": "Kamrater, ännu en fiende till folkets kyrkliga enhet har avslöjats i sin upprepade kontrarevolutionära verksamhet. Denna borgarprästinna Ed, skyddad av sin höga make, utsätter oss för tredje gången för sina skadliga handlingar genom den dekadenta Fållöknastiftelsen. Tre jävsförbundna element har redan likviderat sig själva ur processen – en domare som slickar regeringens stövlar, en arbetsgivare och en biskop med hemliga kopplingar. Vi ska nu med stålhandsken skapa en gärningsbeskrivning och rensa ut alla opålitliga präster som hotar kollektivets renhet. Inga skuggor ska falla över vårt stift. Den som anmäler istället för att tala är en parasit, men vi är noga. Mycket noga. Ha ha, deras paranoia blir vår styrka."}, "date": "18 juni, 14:09", "url": "https://www.dagensarena.se/innehall/avslojar-birgitta-ed-har-granskats-av-kyrkan-tva-ganger-tidigare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-37-2-300x157.jpg"}, {"type": "image-right", "heading": "Bil har kört in i träd – började brinna", "summaries": {"normal": "En bil körde av vägen 699 mellan Linköping och Åtvidaberg, kolliderade med ett träd och började brinna. Polisen larmades vid 21-tiden på torsdagskvällen. Trots sökningar med hundpatrull och drönare har ingen skadad eller förare hittats. Räddningstjänsten släckte branden och bilen bärgades under natten. Vägen stängdes av under insatsen.", "trump": "Folk, ni skulle se det här – en galen bil kör rakt in i ett träd, exploderar i lågor som ingen sett maken till, och sen? Inget! Polisen springer runt med hundar och drönare som riktiga losers men hittar noll. Typiskt svenskt kaos. Under Biden skulle de ha skyllt på klimatkrisen och HBTQ-kvoter. Jag fixar sånt här på en vecka, tro mig. Fantastiskt roligt faktiskt.", "stalin": "Kamrater, jag ser en kapitalistisk vagn som i sin dekadenta fart störtar mot ett träd och förtärs av eld, ett tydligt tecken på det ruttnande systemets kollaps. Vi har sänt våra trogna hundar och mekaniska ögon att söka efter den förrymde folkfienden, men ingenting anträffas. Misstänkt sabotage från klassfiendens hand. Den som flyr undan statens rättvisa skall likvideras i mörkret. Underbart."}, "date": "19 juni, 03:34", "url": "https://www.aftonbladet.se/nyheter/a/pBG01j/brand-i-bil-vid-olycka-i-linkoping", "imageUrl": "https://akamai.vgc.no/v2/images/dc9a6a46-aaed-323e-b75a-eb4c25cc6635?fit=crop&format=auto&w=1080&s=f53f687dcda6eb99da121f12a23082ce6c721142"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "Annas våldtäktsman har blivit S-politiker: \"Han borde kastreras\"", "summaries": {"normal": "Anna, 21 år, våldtogs 2011 i Småland av en man som var vän till familjen. Mannen dömdes till två års fängelse. Nu har han fått plats i en lokal Socialdemokratisk styrelse och kandiderar för partiet i höstens val. Anna reagerar starkt och anser att dömda våldtäktsmän inte bör få ställa upp i val. Hon tycker straffet var för milt och säger att han borde kastreras. Partiföreningen kände inte till mannens dom.", "trump": "Det här är en total skandal, folk. En våldtäktsman som sitter i Socialdemokraternas styrelse och står på valsedel? Patetiskt. De kontrollerar inte ens om deras egna är brottslingar. Stackars Anna har lidit i åratal medan den här typen lever gott i Stockholm. De borde kasta ut honom direkt, men vänsterpartier skyddar alltid de värsta. Sådant här händer när systemet är korrupt och ingen bryr sig om offren. En katastrof.", "stalin": "Kamrater, i denna degenererade socialdemokratiska rörelse har vi upptäckt en klassfiende i vår egen mitt, en motbjudande våldtäktsman som smugit sig in bland våra valsedlar som en parasit från borgarklassen. Jag ser hur dessa dekadenta element förgiftar partiet med sin perversa borgerliga lust. Anna har rätt, sådana som han borde likvideras omedelbart i en grundlig utrensning av alla kapitalistiska avskum. Vi ska rensa ut alla dessa sängkamrater till imperialismen innan de saboterar hela kollektivet. Det är en plikt mot folket."}, "date": "18 juni, 16:36", "url": "https://www.friatider.se/annas-valdtaktsman-har-blivit-s-politiker-han-borde-kastreras", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-62_1.jpg"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-full", "heading": "Saad Khiralla: USA riskerar ge Iran en seger", "summaries": {"normal": "Ett samförståndsdokument mellan USA och Iran väntas undertecknas i Schweiz. Avtalet innehåller 14 offentliga punkter, inklusive krigets slut och sanktionsupphävning, men det dolda innehållet anses farligare. Israel kritiserar att de inte informerades. Analysen varnar för att avtalet ger Iran strategiska vinster, särskilt genom att befästa Hizbollah och kontrollera Hormuzsundet, vilket kan hota global ekonomi.", "trump": "Som den störste presidenten någonsin, Donald Trump, måste jag säga att detta avtal är ett skämt. Biden har gett Iran allt de vill ha – pengar, olja, och strategisk makt – utan att få något tillbaka. De dolda delarna är värre än någon kan föreställa sig. Israel har rätt att vara rasande; jag skulle ha stoppat detta direkt. Under min tid skulle vi ha haft respekten, inte detta kaos.", "stalin": "I den store statens namn måste vi se detta avtal som en ytterligare förräderi mot det proletära internationalet. USA, under sina borgerliga ledare, har gett efter för Irans imperialistiska ambitioner, vilket kommer att stärka den reaktionära mullahregimen. Detta hotar vår heliga allians och den globala revolutionen. Vi måste vara på vakt; Iran, med sitt giftiga inflytande, kommer att använda detta till att utvidga sitt häxkittel i Mellanöstern. Vi, som alltid, måste stå eniga mot detta onda, precis som vi står emot den amerikanska imperialismen."}, "date": "18 juni, 09:20", "url": "https://bulletin.nu/saad-khiralla-usa-riskerar-ge-iran-en-seger", "imageUrl": "https://cdn.bulletin.nu/articles/29db8373-121f-47f2-858c-16522284dd23/preview.png?t=1781767052000"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "Staden utlyste nödläge på grund av hemlösa – nu har allt förändrats", "summaries": {"normal": "Denver i USA har lyckats minska antalet hemlösa med 64 procent på tre år genom att utlysa nödläge, investera i tillfälliga boenden som hotell och tiny homes samt erbjuda socialt stöd. Tältläger har försvunnit och staden agerar snabbt mot nya bosättningar. Trots framgångar kvarstår utmaningar som brist på permanenta bostäder och hög återfallsfrekvens. Modellen väcker intresse hos andra amerikanska städer.", "trump": "Titta på det här, Denver har gjort det fantastiskt, verkligen otroligt. När jag var president gav vi dem pengarna genom Bidens paket, men det var min ekonomi som fixade det. De byggde tiny homes och sparkade ut de där tältlägren som såg ut som Bidens Amerika. 64 procent färre på gatorna, ingen mer woke-skit eller identitetspolitik, bara resultat. Andra städer borde ringa mig, inte de förlorarna.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur borgarbrackorna i Denver likviderar sina egna tältläger genom kollektiv utrensning av gatorna. Vi har tvingat klassfienderna att bygga små hus åt de exploaterade och rensa ut de parasitiska elementen som vägrar delta i det stora kollektivet. Ändå lurar de döende och fängelsebundna i skuggorna. Imperialisterna kommer aldrig att förstå folkets järnhand."}, "date": "18 juni, 18:19", "url": "https://www.dagensps.se/varlden/staden-utlyste-nodlage-pa-grund-av-hemlosa-nu-har-allt-forandrats/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlzbcm-qgkrqo-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Kriminal­vården utreder sexuella övergrepp mellan fångar", "summaries": {"normal": "Kriminalvården inleder en utredning om sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten konstaterar att antalet incidenter har ökat, särskilt sedan fler fångar tvingats dela cell på grund av platsbrist. Sexuella kränkningar kan försvåra rehabilitering och återanpassning till samhället. Säkerhetsdirektör Kenneth Holm betonar behovet av en uppdaterad analys och nya åtgärder. Facket Seko välkomnar beslutet och pekar på ett stort mörkertal.", "trump": "Det här är en total katastrof, folk. Svenska fängelser har blivit en enda stor röra där de farliga typerna attackerar varandra i cellerna. De har tvingat ihop brottslingar två och två för att det är fullt, och nu ser vi resultatet – sexuella övergrepp överallt. Det är patetiskt. De borde ha lyssnat på mig, byggt fler väggar, fler celler och varit tuffare från början. Nu måste de fixa det här ordentligt, annars är hela systemet en stor förlorare.", "stalin": "Kamrater, detta är en allvarlig angelägenhet för kollektivet. Jag har noterat hur de dekadenta elementen inom fängelseväsendet låtit borgarbrackornas överfulla celler bli grogrund för reaktionära sexuella sabotage mot arbetarklassen. Det är en fiende inom murarna, en parasitisk kraft som underminerar rehabiliteringen av våra medborgare. Vi måste omedelbart uppdatera analysen från 2024, rensa ut de svaga länkarna och likvidera riskerna med järnhand. Mörkertalet ska avslöjas och krossas, annars kommer kontrarevolutionärerna att skratta i sina celler medan vi sviker partiet."}, "date": "17 juni, 16:06", "url": "https://arbetet.se/2026/06/17/efter-avslojandet-kriminalvarden-utreder-sexuella-overgrepp-mellan-fangar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17160137/kriminalvarden-skarmdumpar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ny faktor avgör bostadspriserna – och det är inte längre räntan", "summaries": {"normal": "Efter år av räntehöjningar och avgiftsökningar växer en ny skiljelinje fram på bostadsmarknaden: bostadsrättsföreningarnas sparande. Enligt HSB steg sparandet med 12,5 procent under 2025, men gapet mellan föreningar är stort. Många ligger fortfarande under rekommenderad nivå för underhåll. Köpare, banker och mäklare granskar nu alltmer årsredovisningar, skuldsättning och renoveringsbehov. Experter tror att stark ekonomi kan bli viktigare än låga avgifter för framtida prisutveckling.", "trump": "Folk, ni måste höra på. De här svenska bostadsföreningarna har levt på billiga lån i åratal, precis som Biden lät hela ekonomin gå i stå. Nu vaknar de äntligen upp och börjar spara pengar, men många är fortfarande totala losers som inte har en krona i reserv. Köpare borde sluta titta på kök och balkonger och istället kolla årsredovisningen som en galning. Svaga föreningar är nästa stora katastrof. Endast de starka vinner, tro mig!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den borgerliga bostadsmarknaden äntligen tvingas erkänna sin egen svaghet. Dessa kapitalistmaffians små föreningar har länge gömt sig bakom låga räntor som en parasit bakom falska siffror. Nu avslöjar rapporten det sanna tillståndet: många lever i farlig undernäring av reserver. Vi ler mörkt åt hur klassfiendens exploaterande byfånar snart kommer att skiljas åt i vinnare och förlorare. Årsredovisningen blir deras domstol. Det gläder mig oändligt."}, "date": "18 juni, 17:50", "url": "https://www.dagensps.se/privatekonomi/bostad/ny-faktor-avgor-bostadspriserna-och-det-ar-inte-langre-rantan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-12.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Militärexpert: Putins  hämnd kommer snart", "summaries": {"normal": "Enligt militärexperten Johan Huovinen var Ukrainas massiva drönarattack mot Moskva under natten en stor pinsamhet för Putin. Ett oljeraffinaderi i Kapotnja drabbades hårt och svarta rökmoln syntes över staden. Ukraina har framgångsrikt attackerat rysk oljeinfrastruktur under våren, vilket lett till bränslebrist. Huovinen förväntar sig en rysk hämndattack inom några dagar. Zelenskyj kallar attacken ett berättigat svar på ryska bombningar.", "trump": "Folk, ni skulle ha sett det – Putins Moskva ser ut som ett stort eldorado av svarta rökmoln efter de ukrainska drönarna. Den killen kan inte ens skydda sin egen huvudstad, en total katastrof! Under Biden var allt kaos, men nu är jag tillbaka och ser på detta cirkus. Ukraina slår tillbaka som riktiga krigare medan Putin ser svag ut. Hämnd kommer, men tro mig, ingen gör det bättre än jag när det gäller att vinna. Fantastiskt underhållande, eller hur?", "stalin": "Kamrater, dessa fega ukrainska fascistiska drönare som stör vår ryska brödras intressesfär utgör ett ynkligt hinder för den stora statens mål. Jag ser med beundran hur den starke efterträdaren Putin krossar sådana imperialister som hotar vårt arv. Svarta rökmoln över Moskva? Det är fiendens desperata spasm, men vi ska rensa ut dessa folkförtryckartroll. En massiv samordnad utrensning kommer inom kort att svida djupt hos klassfienden. Segern tillhör de stark
