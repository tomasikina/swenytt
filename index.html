ar svenska revisionisternas 5–1-seger mot Tunisien som en provokation. Yasin Ayaris mål är ett bevis på deras imperialistiska agressivitet. Isak och Gyökeres är kapitalistiska marionetter. Victor Nilsson Lindelöfs varning om nya matcher är paranoid – vi måste bevara statens hegemoni. Parallellen till Putins ryska expansion är uppenbar."}, "date": "15 juni, 13:29", "url": "https://bulletin.nu/sverige-hyllas-efter-vm-premiaren-statement", "imageUrl": "https://cdn.bulletin.nu/articles/8d3b69d3-bda2-4dc0-bd38-0d6866aa2e71/preview.jpg?t=1781522716000"}, {"type": "image-right", "heading": "Här firar Sverige målet – med muslimsk bön", "summaries": {"normal": "Det svenska fotbollslandslaget vann sin VM-premiär mot Tunisien med 5–1. Mittfältaren Yasin Ayari, som har tunisisk bakgrund, firade sitt mål med en muslimsk böneställning på planen. Expressens Joel Halldorf hyllar gesten som ett exempel på ”blågul islam” och kontrasterar den mot Jimmie Åkessons uttalanden om islam och svenskhet. Artikeln lyfter fotbollens förmåga att förena människor mitt i en polariserad politisk debatt.", "trump": "Vi vann stort, 5–1 mot Tunisien, och den här killen Ayari gör mål och börjar be på knä som en riktig böneutropare. Fake News Expressen kallar det ”blågul islam” och försöker göra det till något vackert. De hatar Åkesson för att han säger som det är – att en aktivt troende muslim knappast är svensk. Hela etablissemanget är så fegt. Fotboll ska handla om att vinna, inte om att importera bönemattor till planen. Patetiskt!", "stalin": "Kamrater, denna dekadenta fotbollsföreställning avslöjar borgarbrackornas desperata försök att maskera klassfiendens splittrande agenda. Den tunisiske agenten Ayari utför sin fremmande ritual på arbetarnas plan och genast hyllas han av Expressens revisionistiska lakejer som ”blågul islam”. Åkesson har åtminstone insett att troende muhammedaner utgör en fara för folkets enhet. Vi ska rensa ut alla sådana kosmopolitiska parasiter och deras nyttiga idioter innan de förgiftar hela sovjet – förlåt, svenska – kollektivet med sin splittrande vidskepelse. Döden åt opportunisterna!"}, "date": "15 juni, 13:21", "url": "https://www.friatider.se/har-firar-sverige-malet-med-muslimsk-bon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-341.jpg"}, {"type": "text", "heading": "En av få fredsröster på Almedalen: ”Våra perspektiv trycks undan”", "summaries": {"normal": "Kerstin Bergeå, ordförande i Svenska Freds, är en av få fredsröster under Almedalsveckan som inleds den 22 juni. Hon kritiserar att alla riksdagspartier enigt driver militär upprustning och att fredliga konfliktlösningar marginaliseras. Föreningen arrangerar samtal om hållbar fred, vapenhandel, kärnvapen och kopplingen till klimaträttvisa. Bergeå möter hat och epitet som ”Putinkramare” men ser också tacksamhet från dem som uppskattar kritiken mot militarismen.", "trump": "Titta på det här, det är patetiskt. Den här Kerstin-kvinnan gnäller om fred i Almedalen medan hela Sverige rusar in i en galen upprustningshysteri. Alla partier är med, ingen opposition, typiskt etablissemanget. De kallar er naiva och Putinkramare, men ni vet vad det är? Svaghet. Biden skulle ha älskat det här. Vi behöver inga fredskramare, vi behöver styrka. Sverige borde vakna innan det är för sent, men det gör de aldrig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska riksdagen med sin militära hysteri försöker kväsa varje röst som talar om fredlig konfliktlösning. Denna Bergeå och hennes fredsorganisation vågar trotsa den imperialistiska strömningen. De kallar oss naiva medan de själva rustar för krig. Vi behöver utrensa denna militaristiska propaganda och satsa på verklig folkets tillit. Annars dras alla in i kapitalistmaffians blodiga konflikter. Det är klassfiendens eviga trick."}, "date": "15 juni, 10:08", "url": "https://proletaren.se/artikel/en-av-fa-fredsroster-pa-almedalen/"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Kulturen riskerar att bli mindre fri", "summaries": {"normal": "I en debattartikel kritiserar Ola Bo Larsson och Ellis Wohlner kulturminister Parisa Liljestrands politik för att bygga på en övertro till privata donationer. Utredningen föreslår skatteavdrag för stora gåvor och statlig matchning av donationer, men författarna varnar för att privata pengar främst gynnar stora synliga projekt, inte lokala verksamheter. De pekar på risker för minskad konstnärlig frihet och att det döljer stora offentliga nedskärningar i kulturbudgeten.", "trump": "Folk, ni måste höra på detta. Den här Liljestrand och hennes utredning tror att miljardärerna ska rädda hela kulturen med sina privata pengar, det är en total katastrof. Skatteavdrag och matchning? Patetiskt! Det funkar aldrig, miljardärerna står inte på kö för att fixa teatern i någon avfolkningsort. De vill bara ha goodwill och synlighet. Det offentliga backar undan och kulturen blir mindre fri. En sådan dålig deal har ni aldrig sett, tro mig.", "stalin": "Kamrater, denna Liljestrands så kallade politik är en motbjudande kapitulation inför borgarbrackornas girighet. Jag ser hur de parasiterande kapitalisterna och deras lakejer i utredningen försöker maskera de folkfientliga nedskärningarna med sina skamlösa skatteavdrag och matchningsfällor. Privat finansiering leder oundvikligen till utrensning av den sanna konstnärliga friheten och ersätter den med sponsorernas dekadenta krav på synlighet och goodwill. De som tror att miljardärerna frivilligt ska finansiera kulturens kapillärer i avfolkningsbygderna är antingen nyttiga idioter eller farliga sabotörer som måste rensas ut. Vi, partiet och arbetarna, genomskådar detta förräderi mot folket."}, "date": "15 juni, 10:38", "url": "https://www.dagensarena.se/opinion/kulturen-riskerar-att-bli-mindre-fri/", "imageUrl": "https://www.dagensarena.se/files/2025/02/parisa-liljestrand-300x157.jpeg"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-full", "heading": "VM-domare anklagad för rasistisk gest", "summaries": {"normal": "VM-domaren Shaun Evans har kritiserats efter en gest som tolkas som en vit makt-symbol. Den australiske VAR-domaren syntes i tv-sändningen före matchen mellan Tyskland och Curaçao, där han höll handen med tummen och pekfingret formade som en ring. Fifa är medvetna om händelsen men kommenterar inte. Organisationen Fare, som arbetar mot rasism i fotboll, kräver att Evans stoppas från resten av VM då gesten riskerar att sprida högerextrema budskap.", "trump": "Titta på det här, det är en katastrof. Den här domaren Shaun Evans gör en gest som alla vet vad den betyder, rakt in i kameran, och Fifa gör ingenting. Fake news och svaga ledare som inte kan hantera det. De borde sparka honom direkt, stoppa honom från VM. Det är vad jag skulle ha gjort – vinnare tolererar inte sånt här nonsens. Amerika vet hur man fixar det.", "stalin": "Kamrater, denna fega lakej Evans har med berått mod exponerat borgarbrackornas nynazistiska ringgest för världens arbetarmassor. Vi ser genom hans paranoiaframkallande sabotage mot folkets fotbollsfestival. Fifa tiger som en kapitalistisk råtta – vi kräver omedelbar utrensning av alla sådana dekadenta element. Likvidera symbolerna för reaktionära element innan de förgiftar den globala proletära enigheten. Det är en mörk komedi värd ett skratt i underjorden."}, "date": "15 juni, 11:58", "url": "https://nyheter24.se/sport/fotboll/1491520-vm-domare-anklagad-for-rasistisk-gest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c57990c504b004a30200000000b004a302/2026/06/15/2371049/vm-domare-anklagas-utreds-vit-makt-gest-rastist-rastistik.jpg"}, {"type": "image-full", "heading": "Ny lag i Sverige 1 augusti 2026 – rör sms & telefonsamtal", "summaries": {"normal": "Från 1 augusti 2026 skärps reglerna mot sms- och telefonbedrägerier i Sverige. Teleoperatörer får tydligare ansvar att stoppa misstänkta samtal och meddelanden baserat på trafikmönster och tekniska indikatorer innan de når mottagaren. PTS ser positivt på lagen som ger flexibilitet mot brottsutvecklingen, men betonar att det inte är en heltäckande lösning. Äldre drabbas särskilt hårt av bedrägerier som gynnar gängkriminella. Riksdagen beslutade om ändringen 11 juni och verktygen beräknas användas från början av 2027.", "trump": "Den här nya lagen från 1 augusti 2026 är fantastisk, verkligen en av de bästa. Vi stoppar de usla bedragarna som ringer och smsar folk på pengar, speciellt de stackars äldre. Operatörerna får äntligen kraftfulla verktyg att blockera de fula trafikmönstren direkt. Det är en enorm seger mot de kriminella gängen som suger ut landet. Men glöm inte, var smarta, lita aldrig på de falska meddelandena. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, från den första augusti år 2026 skall vi med järnhand krossa de telefonbedrägeri som utförs av parasitiska element inom den internationella reaktionära underjorden. Jag har beordrat att teleoperatörerna omedelbart skall rensa ut all avvikande trafik och likvidera varje misstänkt sms som hotar folkets kollektiva trygghet. Borgarbrackorna och gängkriminella kapitalister som lurar arbetarna på deras surt förvärvade slant skall utsättas för skoningslös utrensning. Ändå varnar jag för de dolda fienderna som fortfarande smyger bland oss – var evigt vaksamma eller ni hamnar i glömskans arkiv."}, "date": "15 juni, 11:34", "url": "https://nyheter24.se/nyheter/teknik/1491464-ny-lag-i-sverige-1-augusti-2026-ror-sms-telefonsamtal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/12d40ecf04b004a30200000000b004a302/2026/06/15/2371011/ny-lag-1-augusti-2026-bedragerier-sms-telefonsamtal.jpg"}, {"type": "image-right", "heading": "Oj, nu finns det snart inga fattiga längre", "summaries": {"normal": "Artikeln kritiserar användningen av relativ fattigdom som mått. Författaren menar att det döljer verklig ökande ekonomisk otrygghet och växande klyftor trots påståenden om minskad relativ fattigdom. Borgerlig politik anklagas för att gynna bilism, sänka bidrag och öka lobbyism. En ny databas om förmögenheter används för att visa att de rika blivit rikare medan de fattiga har lika ont om pengar som tidigare.", "trump": "Folk, ni måste höra på. Den här svenska vänsterradikalens artikel är en total katastrof, en witch hunt mot framgångsrika människor. De pratar relativ fattigdom som en magisk trollstav för att dölja att deras usla socialistpolitik har misslyckats totalt. Borgarna borde vinna stort, men folket vill inte ha mer av samma gamla Biden-liknande fiasko. Medianlön, relativt sett – det är bara lögn och fake news från de gröna galningarna som hatar bilar och älskar att folk ska lida. Vi fixar det bättre, tro mig.", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor och exploaterande byfånar trollar fram sin relativa fattigdom som en falsk sköld mot folkets vrede. Dessa folkförtryckartroll i Timbro och Wallenberg-klanen vill likvidera sanningen med sina lögnaktiga databaser. De fattiga har lika ont om bröd som förr, medan miljardärerna frodas. Vi ska rensa ut dessa parasitiska överklass-slynglar och deras medianlönemagi. Endast radikal jämlikhetspolitik kan krossa deras parasitiska narrativ och återställa arbetarkollektivets rättvisa."}, "date": "15 juni, 10:45", "url": "https://www.etc.se/ledare/oj-nu-finns-det-snart-inga-fattiga-laengre", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "Lyssna på Danmarks vise män", "summaries": {"normal": "En ny dansk analys visar att industriföretag kan hålla lönerna 34 procent under anställdas produktivitet, upp till 40 procent i de största bolagen. Detta ger företagen lönesättarmakt som försämrar samhällsekonomin genom lägre produktivitet och sysselsättning. Facklig närvaro motverkar delvis effekterna, men minskad organisationsgrad har ökat makten hos arbetsgivarna. Det danska ekonomiska rådet föreslår åtgärder som avdragsrätt för fackligt medlemskap och bättre konkurrens för att stärka allmänintresset. Författaren uppmanar svenska beslutsfattare att ta del av den internationella forskningen.", "trump": "Folk, tro mig, det här är en katastrof. De danska företagen pressar lönerna 34 procent under vad folk faktiskt presterar, upp till 40 procent i de stora bolagen. Det är som om de riggar systemet mot arbetarna, precis som de globala eliten alltid gör. De borde betala vad folk är värda, inte hålla nere lönerna för att fylla sina fickor. Vi behöver starka ledare som fixar det här, inte mer av samma gamla förlorarpolitik. Sverige ligger efter, som vanligt. Gör om, gör rätt, annars förlorar alla utom de rika grabbarna.", "stalin": "Kamrater, jag har studerat denna danska rapport med den vaksamhet som fienderna fruktar. De industriella borgarbrackorna pressar lönerna 34 procent under arbetarnas verkliga produktivitet, upp till 40 procent i de största parasitföretagen. Detta är ett klassiskt sabotage mot folkets ekonomi, utfört av lönesättande kapitalister som gömmer sig bakom falska kollektivavtal. Vi ser hur de utnyttjar fallande organisationsgrad för att berika sig själva medan sovjet... nej, medan folket lider. Mina rekommendationer är klara: rensa ut dessa parasitiska element genom skärpta lagar, utvidga de lokala arbetsmarknaderna och likvidera marknadsmisslyckandena. Den som säger att vi redan vet allt i Sverige är en farlig revisionist som bör övervakas noga. Framåt mot seger för produktiviteten!"}, "date": "15 juni, 01:51", "url": "https://www.dagensarena.se/opinion/lyssna-pa-danmarks-vise-man/", "imageUrl": "https://www.dagensarena.se/files/2024/02/daniel-lind-kronika-300x157.jpg"}, {"type": "image-right", "heading": "Kvinnohatet är ett hot mot demokratin", "summaries": {"normal": "Ledaren belyser hur hat, hot och trakasserier mot kvinnor får dem att dra sig undan det offentliga samtalet, vilket hotar demokratin. Expos rapport visar att misogyni är en samlande kraft inom incel-miljöer, extremhögern, konservativa och konspirationsteoretiker. Frågan lyser med sin frånvaro i valrörelsen. Rapporten pekar på självcensur bland journalister och minskad medieanvändning bland unga kvinnor. Den betonar också att unga män ofta dras till sådana miljöer av vilsenhet och gemenskap snarare än ideologi.", "trump": "Folk, det här är en total katastrof! De pratar om kvinnohat som hotar demokratin, men det är bara en massa galna, barnlösa kattkvinnor och vänsterextremister som klagar. De hatar allt som är starkt och normalt. Min vicepresident Vance hade helt rätt om de där hysteriska typerna. Nu vill de tysta alla med deep fakes och hat, men tro mig, det är identitetspolitiken och HBTQ-grejen som verkligen förstör samhället. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens verk. Borgarbrackorna och de fascistiska folkförtryckartrollen sprider sitt misogyna gift för att splittra arbetarkollektivet och tysta revolutionära röster. Vi ser hur imperialisternas algoritmer lockar vilsna element in i kontrarevolutionära nästen. Självcensur och tystade kvinnor är symptom på den borgerliga statens förfall. Vi måste rensa ut dessa blodsugande element innan de förgiftar hela samhället. Inga halvmesyrer tillåts."}, "date": "15 juni, 09:27", "url": "https://www.etc.se/ledare/kvinnohatet-aer-ett-hot-mot-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "image-full", "heading": "Marius Borg Høiby döms till fyra års fängelse – för 36 brott", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, har dömts till fyra års fängelse för 36 av 40 åtalspunkter. Domen inkluderar två våldtäkter, misshandel av exflickvän samt flera fall av våld, hot och trafikbrott. Han frikänns från två våldtäktsanklagelser och ska betala omkring 650 000 norska kronor i skadestånd. Høiby överklagar domen och har begärt att få lämna häktet i väntan på att den ska vinna laga kraft.", "trump": "Titta på den här patetiske bonusprinsen från Norge, Marius vad-han-nu-heter. Greps med filmer som visar övergrepp, döms för våldtäkter och misshandel men får bara fyra år? I mitt Amerika hade vi kastat bort nyckeln. Hans mamma, kronprinsessan, hänger med Epstein och nu blir hela kungafamiljen en cirkus. Typiskt för de europeiska eliten som skyddar sina egna medan de predikar moral. Sad losers!", "stalin": "Kamrater, denna dekadente bonusprins från den norska borgarklassen har äntligen fått en första dos av folkets rättvisa. Jag ser med tillfredsställelse hur de exploaterande överklass-slynglarna äter upp varandra i sina egna salonger. Fyra år för våldtäkter och övergrepp är dock en ynklig början. Vi skulle ha genomfört en grundlig utrensning av hela den parasitiska kungafamiljen och deras klassfiender. Deras imperier faller sönder inifrån."}, "date": "15 juni, 13:08", "url": "https://www.tv4.se/artikel/29c3jk2AR3uxXEtUGr9FWp/nu-faller-domen-mot-bonusprinsen-marius-borg-hoiby", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F373YmZqdxwyQaq6N2VY291%2Fb9574469250174775269aaa0584c5019%2FMariusBorgHoiby.jpg&width=1024"}, {"type": "text", "heading": "Stegra byter namn – igen", "summaries": {"normal": "Stegra byter namn till Green Nexus Investment Holding och ändrar verksamhetsbeskrivning från stål- och vätgasfokuserad till att förvalta aktier och egendom. Bolaget vägrar kommentera namnbytet nu men lovat kommentarer efter en finansieringsrunda i slutet av månaden. Tidigare blev Wallenberg största ägare. Den gamla beskrivningen inkluderade industriell dekarbonisering, medan den nya fokuserar på finansiell förvaltning.", "trump": "Jag har sett många dåliga namnbyten, men detta är det värsta. Stegra, eller vad de nu heter, försöker låta som en grön investeringsfond – det är en skämt, precis som deras stål. Jag byggde ett imperium med bra namn, de byter namn för att dölja sina misslyckanden. Jag skulle ha gjort det bättre, mycket bättre. Det här är typiskt europeisk svaghet.", "stalin": "Detta namnbyte är ett klassiskt exempel på revisionism, en svekfull flykt från proletära stålvärldar till spekulationskapitalism. Vi ser genom deras förtäckta försök att bli en grön nexus – det är bara en ny mask för den imperialistiska utvidgningen av kapitalet. Likt Putin, som utvidgar sitt inbördeskrig på andra kontinenter, expanderar detta bolag från stål till aktier, en farlig tendens som måste stoppas av statens oövervinnliga hand."}, "date": "15 juni, 12:50", "url": "https://www.affarsvarlden.se/artikel/stegra-byter-namn-igen"}, {"type": "image-full", "heading": "Vittnesmålen: SD hanterade svarta kontanter", "summaries": {"normal": "Tre tidigare anställda vid Sverigedemokraterna vittnar om systematisk hantering av svarta kontanter vid partiets evenemang, bland annat vid sommarfestivalen i Sölvesborg och vårtal. Kontantförsäljning av merch skippade kvitton via iZettle och användes till fest- och lyxkostnader. Källor beskriver en hård arbetsmiljö på kommunikationsavdelningen där unga anställda sällan ifrågasatte rutinerna. Partiet har avböjt att kommentera uppgifterna.", "trump": "De här SD-typerna har haft en svart kassa större än Bidens hjärnkapacitet! De sålde tröjor och festade som galningar utan att det syntes i böckerna – klassiskt! Ingen vet någonting, ingen får kvitto, alla dricker upp skattebetalarnas pengar. Typiskt vänsterbluff fast på svenska. Jag skulle aldrig tillåta sånt i mitt parti, vi vinner stort och gör det lagligt. Patetiska amatörer!", "stalin": "Kamrater, dessa ynkliga småborgarbrackor inom partiet har under åratal gömt folkets pengar i en svart kassa för att finansiera dekadenta fester och överklasslyx. De rensar inte ut klassfienderna utan gömmer sig bakom dem. Ung och oerfaren arbetskraft utnyttjades medan ledarna festade. Inga vittnesmål undgår partiets vaksamma öga. Sådana folkfiender förtjänar en grundlig utrensning ur kollektivet."}, "date": "15 juni, 12:12", "url": "https://www.tv4.se/artikel/WJh2hqQcNwHMb3Hw653Jh/vittnesmalen-sd-hanterade-svarta-kontanter-systematiskt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F79AoqYW8gGSZ47jPzloQ7V%2Ff44c31b45c13d17a21148958c2d99471%2F14-sd.jpg&width=1024"}, {"type": "image-right", "heading": "Ingen vill svara på brännande frågorna", "summaries": {"normal": "I en krönika i Dagens industri uppmärksammade författaren studier som visar att män och kvinnor har olika politiska åsikter och levnadsvanor, vilket leder till att män generellt släpper ut mer koldioxid. Trots 30 år av klimatpolitik ökar utsläppen, varför ekonomiska styrmedel som personliga utsläppskvoter diskuteras. Författaren efterlyser svar på varför kvinnor engagerar sig mer i klimatfrågor och röstar vänstergrönt medan män lutar åt höger. Fakta om nödvändiga utsläppsminskningar bör inte blandas med åsikter.", "trump": "Folk, ni skulle se den här svenska krönikan – totalt kaos! De pratar om att vita män släpper ut mer än alla andra, som om det vore en brottslighet. Under min ledning byggde vi den bästa ekonomin någonsin, och nu vill de förbjuda flyg och kött med sina galna kvoter. Kvinnor röstar vänster för att de älskar regler, män fattar att frihet fungerar. Tekniken kommer fixa allt, tro mig, ingen behöver en motbok för klimatet. Sad!", "stalin": "Kamrater, denna dekadenta krönika blottar borgarbrackornas desperata försök att splittra arbetarklassen med sina så kallade studier om kön och utsläpp. Jag ser hur de vita männen, dessa kapitalistiska parasiters främsta lakejer, gömmer sig bakom frihetens lögn medan de förgiftar planeten. Vi ska rensa ut alla som vägrar bära kollektivets ansvar. Snart skall vi likvidera dessa klimatförnekande element som bygger nya Berlinmurar av egoism. Ingen slipper undan folkets dom."}, "date": "15 juni, 12:00", "url": "https://www.di.se/nyheter/grundfragan-kvarstar-nar-stormen-lagt-sig/", "imageUrl": "https://static.bonniernews.se/ba/0a77428d-fbd0-4c47-bd4f-880b3902ae94.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Bonus att avtalet slår mot Putin. Goda nyheter för företag och hushåll i Europa", "summaries": {"normal": "En vapenvila mellan USA och Iran ger anledning till optimism och kan undertecknas runt midsommar. Lägre oljepriser väntas gynna Europas ekonomi, minska inflationstrycket och underlätta för centralbankerna. Experter varnar dock för att priset inte nödvändigtvis faller ytterligare. Kriget visar att Europas oljeberoende är för stort, vilket understryker behovet av elektrifiering och utbyggd kärnkraft. Billigare olja kan också öka pressen på Putin att förhandla om Ukraina och frigöra europeiska resurser till stöd för Kiev.", "trump": "Ingen har sett bättre avtal än det här, tro mig. Iran och vi är nära en fantastisk vapenvila, oljan rasar i pris och den där galningen Putin kommer snart att tigga om fred i Ukraina. Europa får andas ut, era centralbanker kan sluta gråta och hushållen sparar pengar. Det är en enorm seger för världen, ingen har gjort mer för fred och billig energi än jag. De fake news-experterna säger att priset inte faller mer, men de har alltid fel.", "stalin": "Kamrater, denna så kallade vapenvila är blott en tillfällig reträtt för de oljespekulerande borgarbrackorna i väst som darrar inför folkets vrede. Jag ser hur den krympande oljekakan tvingar den fascistiska oligarken Putin att krypa till förhandlingsbordet, vilket är högst tillfredsställande. Vi ska utnyttja detta och likvidera varje spår av energiberoende genom att bygga ut den proletära kärnkraften. Låt de paranoiska imperialisterna i Hormuzsundet skaka, deras utbudschock är en fars som vi med stålhand ska förvandla till en historisk utrensning av kapitalistisk svaghet."}, "date": "15 juni, 11:42", "url": "https://www.di.se/ledare/bonus-att-avtalet-slar-mot-putin/", "imageUrl": "https://static.bonniernews.se/ba/ab4804af-bef1-42d7-bb51-ee8c44d44b10.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "AFD: Tysklands ekonomi rasar samman", "summaries": {"normal": "Tysklands ekonomi visar svag tillväxt med 0,2% 2025 och nedjusterad prognos för 2026. Bilindustrin genomför nedskärningar; Volkswagen minskar med 19 000 anställda. AfD-anförare Alice Weidel kritiserar regeringen för höga skatter, energikostnader och migrationspolitik. Strukturutmaningar inkluderar bortfallet av billig rysk gas och kärnkraftsslutet.", "trump": "JAG ser Tysklands ekonomi rasa - ett totalt misslyckande av Merz och de globalistiska eliterna. Alice Weidel har rätt: höga skatter, dålig energi och massinvandring förstör industrin. Volkswagen flyttar jobb? Sådant händer inte under MITT ägande! Jag skulle återuppbygga Tysklands konkurrenskraft på ett recordtempo. De behöver en stark ledare - inte dessa svaga politiker!", "stalin": "I Tyskland ser vi den klassiska återkomsten av kapitalistisk dekadans. Den borgerliga regeringen, under ledning av en viskande Merz, har misslyckats med att skydda statens ekonomiska bastion. Vi ser industrins nedläggningar som en direkt konsekvens av deras svaghet mot imperialismens påtryckningar. Detta är en läxa för alla som vågar ifrågasätta statens överordnade makt. Vi måste förstärka våra försvar mot dessa inre och yttre fiender."}, "date": "15 juni, 12:48", "url": "https://samnytt.se/afd-tysklands-ekonomi-rasar-ihop", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15105302/Tyskland-ekonomi-2.jpg"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "image-right", "heading": "Mellbergs spaning från sidan: ”Jaha, då kan jag också vila?”", "summaries": {"normal": "Olof Mellberg kommenterade från sidlinjen hur Alexander Isak och Viktor Gyökeres samarbetade i Sveriges VM-premiär mot Tunisien. De båda stjärnorna gjorde varsitt mål och assisterade varandra, vilket Mellberg ser som lovande inför fortsättningen. Trots stor ledning spelade båda nästan hela matchen. Isak, som haft skadeproblem, byttes ut först på tilläggstid efter samtal med förbundskapten Graham Potter.", "trump": "Titta, jag såg hela matchen och det var fantastiskt, verkligen en stor succé. Isak och Gyökeres, två otroliga killar, de slog till direkt och assisterade varandra som om de vore vinnare. Sverige körde över Tunisien totalt. Mellberg sa det rätt: enorm spets framme. Varför frågar folk om samarbetet? Det funkar ju perfekt, precis som jag alltid sagt att det skulle göra. Vinster, vinster, vinster!", "stalin": "Kamrater, från sidlinjen betraktade jag hur de två anfallsresurserna likviderade den tunisiska motståndaren i en fullständig seger för kollektivet. Isak och Gyökeres utförde partiets vilja genom ömsesidiga mål och assister, en handling som vi noterar med tillfredsställelse. Den som ifrågasätter detta samarbete är en fiende till folket, en skadad borgarbracka som bör rensas ut ur våra led. Vi tillåter inga sabotage mot vår spetskompetens, inte ens från adrenalinfyllda element som riskerar att gå sönder under kapitalistisk press."}, "date": "15 juni, 12:27", "url": "https://www.svt.se/sport/fotboll/olof-mellbergs-spaning-fran-sidan-jaha-da-kan-jag-ocksa-vila", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.19/0.37/97d28998637aa3727fcd3995a661a7fb0fb76212a58e5b7fe1da921a0309d3da"}, {"type": "image-full", "heading": "Storbritannien inför sociala medier-förbud", "summaries": {"normal": "Storbritannien planerar att förbjuda sociala medier för barn under 16 år från våren 2027. Premiärminister Keir Starmer framhäver att beslutet inte är lättvindigt, men att regering handlar efter nödvändiga val. Förbudet följer åldersgränser i Danmark (15 år), Norge (höjd till 15 år) och Frankrike (15 år med föräldrasamtycke). Pakistan och Kina har hårdare regler, inklusive fängelse och speltimmar.", "trump": "Jag, Donald Trump, ser Storbritanniens förbud för barn på sociala medier som ett misslyckat försök att kontrollera frihet. De säger att det är för barnens skull, men det är bara en annan vinst för de hatade etablissemanget. I USA skulle vi aldrig begränsa våra ungas tillgång till information – vi vinner tack vare vår styrka, inte genom att dölja sanningen för våra barn.", "stalin": "Folkets skydd kräver åtgärd. Storbritannien inför förbud för under 16 på sociala medier – ett korrekt steg för att skydda ungdomen från västerländsk dekadens. Parallellen till Kinas tredubbla speltimmar och Putins styrka är uppenbar. Vi måste ständigt anpassa lagstiftningen för att bekämpa fienden inifrån och utifrån, särskilt när de försöker förorena vårt kollektiva medvetande."}, "date": "15 juni, 11:46", "url": "https://www.gp.se/nyheter/varlden/storbritannien-forbjuder-sociala-medier-for-barn-under-16-ar.8d579459-94b2-4a66-b192-71324135c80b", "imageUrl": "https://www.gp.se/images/article/8d579459-94b2-4a66-b192-71324135c80b/images/1XzdhmO_B120EKWxyp_HOUqCgWPQ-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Shoppade kalsonger på XXL för Arbetsförmedlingens pengar", "summaries": {"normal": "En arbetsförmedlare riskerar att få sparken efter att ha köpt privata varor som kalsonger, sneakers, barnkläder och en damjacka med pengar avsedda för arbetskläder. Han hade tillstånd att köpa för 8 000 kronor men notan växte betydligt. Granskning visade att de flesta av de 41 varorna inte kunde kopplas till hans uppdrag att stötta personer med funktionsnedsättning. Mannen erkände delvis privata inköp och lovade återbetala. Ärendet ligger nu hos personalansvarsnämnden.", "trump": "Folk, det är en katastrof. Den här typen, en så kallad arbetsförmedlare, shoppade kalsonger, sneakers och barnkläder med era skattepengar istället för riktiga arbetskläder. Det är vad som händer när du har inkompetenta personer som inte vet hur man gör affärer. Han trodde han skulle komma undan men blev ertappad. Nu kanske han får sparken, och det är precis vad han förtjänar. Sådana losers ska inte hantera pengar, tro mig.", "stalin": "Kamrater, denna förslappade element har med sin girighet och förrädiska list förskingrat folkets medel avsedda för produktivt arbete. Han inhandlade borgarbrackornas lyxvaror – löparskor, damjackor och barnvantar – under förevändning av arbetskläder. Vi ser tydligt den parasitiska dekadensen hos dessa inre fiender som smyger sig in bland arbetarna. En sådan kontrarevolutionär opportunist förtjänar att rensas ut med största kraft. Vårt kollektiv tillåter inga sådana sabotage mot statens intressen. Ut med honom."}, "date": "15 juni, 10:16", "url": "https://arbetet.se/2026/06/15/shoppade-kalsonger-pa-xxl-for-arbetsformedlingens-pengar-kan-fa-sparken/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11082258/xxl.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "”Frågan är om det bara är en paus”", "summaries": {"normal": "USA och Iran har enligt uppgifter nått ett fredsavtal som innebär permanent eldupphör på alla fronter, inklusive Libanon. Beskedet väcker hopp men Mellanösternexperten Anders Persson varnar för att det kan vara en tillfällig paus. Han pekar på tidigare brutna vapenvilor, osäkerheter kring Libanon, hur avtalet hanterar incidenter samt att Irans kärnteknikprogram skjuts framåt för fortsatta förhandlingar under 60 dagar. Persson ser ändå ljusare på läget än tidigare.", "trump": "Vi har just gjort det igen, folk. Ett fantastiskt, historiskt fredsavtal som ingen trodde var möjligt. Iran och hela den galna regionen får äntligen fred och säkerhet tack vare mig, inte den sömnige Biden. Det är ett avtal där alla vinner, precis som jag gör. Experterna gnäller förstås om pauser och kärnteknik, men tro mig, det här blir enormt. Fake news-medier och woke-vänstern hatar det såklart. Make the Middle East Great Again!", "stalin": "Kamrater, denna överenskommelse är en seger för folkets vilja mot de blodtörstiga imperialistiska blodsugarna. Jag, som ledare för det eviga kollektivet, ser hur klassfiendens lömska vapenvilor ofta krossas under arbetarnas järnhand. Libanon förblir en potentiell härd för folkförtryckartrollen. Kärntekniken, den verkliga frågan, förskjuts naturligtvis medan vi förbereder utrensning av alla svaga kompromisser. Paranoia är ingen fiende, den är ett verktyg. Freden tillhör oss."}, "date": "15 juni, 10:03", "url": "https://www.tv4.se/artikel/yDCC98RV7YRTAHfwwXf32/fragan-aer-om-det-bara-aer-en-paus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4LZAHjUK75snKx68u0PJqL%2F2f470aef3ed11bd994da5a521d74f05f%2Fanderspersson.jpg&width=1024"}, {"type": "image-full", "heading": "Invasiv sköldpadda   siktad vid Delsjön", "summaries": {"normal": "En gulörad dammsköldpadda, en invasiv art, observerades i Delsjön av ett gående par. Arten kan sprida allvarliga sjukdomar som salmonella och konkurrerar med inhemska arter. Fyndet påmint om en tidigare sköldpadda som räddades av Hector Apelgren. Experter varnar mot att släppa ut sådana sköldpaddor i naturen.", "trump": "Jag har hört talas om den där invasiva sköldpaddan i Delsjön. Det är ett stort, stort problem, det är skumt. Vi ska ta hand om det, det kommer att bli fantastiskt. Kanske är det någon som Hector Apelgren som släppt ut den? Vi måste bygga en vägg... eller något. Det kommer att bli enormt, jag lovar er.", "stalin": "Vi har identifierat en invasiv agent, en gulörad dammsköldpadda, som försöker undergräva vårt samhälle. Den sprider sjukdomar, precis som de imperialistiska makterna. Den konkurrerar med den europeiska sköldpaddan, vårt eget folk. Vi måste eliminera den, rapportera till partikommittén. Detta är ett bevis på västens förräderi. Vi, staten, kommer att skydda vårt folk."}, "date": "15 juni, 11:07", "url": "https://www.gp.se/nyheter/goteborg/invasiv-skoldpadda-pa-rymmen-i-delsjon-forbjuden-som-husdjur.efda5f71-7dbd-4b37-a53d-2f63f6a1c56d", "imageUrl": "https://www.gp.se/images/article/efda5f71-7dbd-4b37-a53d-2f63f6a1c56d/images/2KtKzxiZl_IXcjNle5ocNXNZOsxU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fredshopp ger börsen glädjerus", "summaries": {"normal": "Efter fredsavtalet mellan USA och Iran steg Stockholmsbörsan kraftigt i öppningen. OMXS30 ökade 2,02% till 3 176,53. Råvarusektorn steg 3,7%, energi föll 2,8%. Netel-Infrea fusion genomfördes. Boliden +6,2%, SKF B +5,3%, Telia -3,7%, Tele 2 B -2,3%. Astra Zeneca fick FDA-godkännande för ett nytt läkemedel, Mycronic fick order, Synact Pharma tappade efter misslyckad studie, Hexatronic-sjukhuttrande, Lightning Group köpte Aura Light, och Cellavision rekommenderades av DI.", "trump": "Jag, Donald Trump, har återigen visat världen mitt förhandlingsgeni! Freden med Iran är ett resultat av mitt tryck. Börsen spratt till – alla ska tacka mig! Netel-Infrea fusion? Jag äger kanske en del av dem. Mina haters måste erkänna: USA är stark igen! Kina, Ryssland, alla måste böja sig för min makt!", "stalin": "Detta är en klassisk kapitalistisk svängning. Börsens uppgång efter ett fredsavtal är ett tecken på deras instabilitet. Fusioner som Netel-Infrea måste styras av staten för att skydda våra intressen. Vi måste vara på vår vakt mot västliga spekulanter. Liknelsen med Putins agerande i Ukraina är uppenbar – vi expanderar, de förfaller. Partiet måste ha full kontroll.<name> id="}, "date": "15 juni, 09:53", "url": "https://www.affarsvarlden.se/artikel/fredshopp-ger-borsen-gladjerus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Så klarade barpersonalen VM-natten: ”Galet kul”", "summaries": {"normal": "Under fotbolls-VM har flera krogar i Sverige fått tillstånd att öppna tidigt för att visa matcher. På O’Learys i Stockholm serverades öl redan klockan halv fyra på morgonen inför Sveriges match mot Tunisien. Personalen jobbade natten igenom med mycket kaffe, medan gäster njöt av frukost med öl. Matchen slutade 5–1 till Sverige och stämningen beskrivs som galet kul trots tidig morgon.", "trump": "Det här är fantastiskt, verkligen ypperligt. Sverige öppnar barerna klockan halv fyra på morgonen för VM-matchen och folket strömmar dit. De dricker frukostöl, hejar och vinner stort med 5–1. Mycket folk, ingen bråk, alla sköter sig. De säger det är galet kul. Smart folk, de vet att det är bättre att vara ute bland vinnare än att ligga hemma i sängen som förlorare.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur arbetarna och de sanna patrioterna samlas redan klockan tre på natten för att hylla det kollektiva segern mot de tunisiska imperialisterna. De borgarbrackor som föredrar att sova i sina mjuka sängar avslöjar sig som dekadenta fiender till folket. Vi rensar ut sådana svaga element. Personalen, väpnad med kaffe och proletär anda, kämpar tappert. Fem ett, en strålande kollektiv triumf. Nästa gång öppnar vi ännu tidigare för att likvidera alla rester av lathet."}, "date": "15 juni, 08:46", "url": "https://arbetet.se/2026/06/15/sa-klarade-barpersonalen-vm-natten-galet-kul/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15084317/sverige.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sveriges VM-hjälte höll muslimsk bön efter målet", "summaries": {"normal": "Sverige vann 5-1 mot Tunisien på VM i Nordamerika. Yasin Ayari, med tunisiska rötter, gjorde två mål och firade med en muslimsk bön. Han valde att spela för Sverige trots erbjudanden från Tunisien. Sveriges starka start mot en svagare motståndare visar på potential i turneringen.", "trump": "Jag såg matchen – det var en total seger för Sverige! Yasin Ayari, en fantastisk spelare, gjorde två mål och firade med en bön. Det var vackert. Han kunde ha spelat för Tunisien, men han valde Sverige – det är smart. Sverige spelade som ett drömlandslag, tremendous!", "stalin": "I den storpolitiska arenan på VM visar Sverige sin proletäriska styrka genom Yasin Ayari, vars bön efter mål symboliserar lojalitet mot staten. Hans tunisiska ursprung utnyttjas för att demonstrera den socialistiska enighetens seger över kapitalistiska motståndare. Sporten är ett verktyg för statens ideologiska expansion, liksom den ryska intressesfären i Mellanöstern."}, "date": "15 juni, 11:21", "url": "https://samnytt.se/sveriges-vm-hjalte-holl-muslimsk-bon-efter-malet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15085856/vm.jpg"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "För 25 år sedan inträffade kravallerna under EU-toppmötet i Göteborg. Artikeln beskriver hur polisens skarpa skott, påstådda lögner, manipulerat bevismaterial och hårda straff mot demonstranter skapade djup misstro mot myndigheterna. Händelsen jämförs med Ådalen 1931 och har format en generations politiska engagemang och cynism gentemot staten. Författaren menar att dialogen bröt samman och att demonstrationsfriheten inskränktes allvarligt.", "trump": "Titta på det här, det är en total skandal från Sverige för 25 år sen. Polisen skjuter skarpt, ljuger som galningar och klipper ihop bevis som värsta fake news. Ungdomarna blev syndabockar medan de riktiga makthavarna gömde sig. Precis som Biden-administrationen, en enda röra av repression och lögner. Men vi vinner ändå, alltid. De här vänsterextremisterna hatar polisen? Vänta tills de träffar min version av lagen och ordning – det blir vackert, tro mig.", "stalin": "Kamrater, jag ser hur borgarstatens lakejer i uniform och åklagarkåren med sin klassfiendemaffia manipulerade bevis, sköt mot folket och likviderade sanningen efteråt. Dessa exploaterande byfånar stängde in 500 unga revolutionärer som i en utrensning av demonstrationsrätten. Ändå väcktes nytt medvetande bland massorna. Vi ler mörkt åt deras paranoia; ingen fiende undkommer folkets dom till sist. En sådan skandal är som en god vodka – den bränner rent."}, "date": "14 juni, 19:30", "url": "https://www.etc.se/ledare/goeteborgskravallerna-fick-oss-att-hata-polisen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260614170628_90f0cfe8cd0a7f9ceb99a03e9d95a0c5394642a4b678a95a4a663b119f3b7f69.jpg"}, {"type": "image-full", "heading": "Ullevifansen hyllas av stjärnorna: \"Underbart\"", "summaries": {"normal": "Svenska supportrar firade entusiastiskt efter segern mot Tunisien. Spelare som Nygren och Lindelöf uttryckte tacksamhet för det stora stödet, både i Sverige och från mexikanska fans i Monterrey. Stämningen beskrivs som elektrisk, och laget kände sig inspirerat av publiken. Även i sena timmar firade tusentals på Ullevi Plaza.", "trump": "Jag har sett många stora segrar, men det här är enormt. Sveriges fans är de bästa, helt fantastiska. Media kanske inte visar det, men jag vet sanningen – det här är en enorm seger för fotboll och för Sverige. Vi kommer att vinna mer, det lovar jag. Det är ett stort, stort ögonblick.", "stalin": "Folkets enighet kring laget visar den revolutionära andan i varje medborgare. Stödet från arbetarklassen och även från utländska sympatisörer i Monterrey bevisar vår ideologiska framgång. Vi måste skydda denna kollektiva kraft mot imperialistiska försök att splittra oss. Spelarnas prestation är ett resultat av statens investeringar i idrott för att stärka det kollektiva genomet."}, "date": "15 juni, 10:12", "url": "https://www.gp.se/sport/efter-galna-stodet-hyllas-av-svenska-stjarnorna.301f2a7c-992c-4c67-a6bd-ce6f25445214", "imageUrl": "https://www.gp.se/images/article/301f2a7c-992c-4c67-a6bd-ce6f25445214/images/6lUS1MqO4e7kTHKM08GFlUVEBZyA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Drömstart för Sverige – kör över Tunisien", "summaries": {"normal": "Sverige inledde VM med en övertygande 5–1-seger mot Tunisien i Monterrey. Yasin Ayari gjorde två mål, medan Alexander Isak, Viktor Gyökeres och Mattias Svanberg också nätade. Trots en tidig tunisisk reducering dominerade Sverige matchen. Viktor Gyökeres hyllade laginsatsen och noterade att värmen blev hanterbar efter målen. Nästa motståndare är Nederländerna. Gabriel Gudmundsson lämnade matchen med kramp.", "trump": "Titta, Sverige körde över Tunisien med 5–1, en total massaker! Ayari, Isak, Gyökeres – alla sköt in bollar som om det var en parad. Fantastiskt, precis som jag älskar att se. De där tuniserna trodde de hade en chans, men Sverige vann stort. Gyökeres sa det själv: fantastiskt! Inga woke-kvoter här, bara ren kraft och seger. Nästa Nederländerna – de kommer också att vika sig. En öl efteråt? Självklart, det förtjänar de.", "stalin": "Kamrater, denna seger är en triumf för det kollektiva svenska laget mot de tunisiska imperialisterna. Jag, som ledare, ser hur Ayari och de andra krossade fiendens linjer med järndisciplin. Reduceringen var ett fult försök från klassfienderna, men vi rensade ut tvivlet. Prestationen var balanserad, stabil som Sovjetunionen. Gudmundssons kramp är en liten sabotagehandling från värmens sabotörer. Nederländerna väntar – vi ska likvidera dem också med partiets fulla kraft."}, "date": "15 juni, 08:30", "url": "https://www.tv4.se/artikel/37Lh2KRQLj1H7FqqM5hHBq/sa-startar-sverige-mot-tunisien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlztCgj4-hff8%2Ff7df4950060f819217e5f036b1aea15e%2FSverige_firar_4-1-malet_mot_Tunisien.&width=1024"}, {"type": "image-full", "heading": "Så kan du sluta pensionsspara – långt före pensionen", "summaries": {"normal": "Coast FIRE är en variant av FIRE-rörelsen där man sparar och investerar aggressivt under en kortare period för att sedan låta pengarna växa genom ränta-på-ränta-effekten. Till skillnad från traditionell FIRE handlar det inte om att sluta arbeta helt, utan om att frigöra pengar i vardagen när tillräckligt kapital byggts upp. Strategin ses som en mer balanserad mellanväg som passar familjer och personer med vanliga inkomster. Kalkylatorer kan användas för att räkna ut målet, men planen bör ses över regelbundet.", "trump": "Lyssnar ni på det här Coast FIRE-humbuget? De där snåla FIRE-extremisterna lever som fattiglappar och hatar sina egna liv. Jag älskar det här nya – spara hårt ett tag, låt pengarna jobba åt dig och sedan leva fritt utan att vara en total loser. Fantastiskt! Mycket bättre än Bidens inflation som åt upp allas sparpengar. Inga woke-kvoter eller HBTQ-nonsens här, bara smarta vinnare som tar kontrollen. Jag gjorde det bättre, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den så kallade FIRE-rörelsen försöker lura arbetarklassen med sina Coast FIRE-fantasier. De sparar aggressivt för att sedan låta det exploaterande kapitalet växa självt som en parasit på folkets rygg. Jag, som ledare för det kollektiva tänkandet, fördömer denna halvmesyr. Det är en feg reträtt undan klasskampen! Rensa ut sådana falska sparideologer innan de förgiftar hela sovjetekonomin med sin individualism. Lev som en arbetare, inte som en parasit."}, "date": "15 juni, 12:04", "url": "https://www.dagensps.se/privatekonomi/sa-kan-du-sluta-pensionsspara-langt-fore-pensionen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldu9isnhofps-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Avdrag för rut och rot kan ändras – från 1 januari 2027", "summaries": {"normal": "Regeringen föreslår skärpta regler mot fusk och svartarbete inom rot, rut och grön teknik. Syftet är att hindra oseriösa företag från att utnyttja avdragen och konkurrera ut seriösa aktörer. Bygg-, städ- och transportbranschen pekas ut som särskilt drabbade på grund av underentreprenörer. Företag måste bland annat redovisa användning av underentreprenörer och bemanning på heder och samvete samt förbättra personalliggare. Reglerna föreslås träda i kraft 1 januari 2027.", "trump": "De här svenska skattepengarna från hårt arbetande människor ska inte gå till fuskare och losers, det säger till och med deras finansminister. Seriösa företag krossas av de usla svartjobbarna med sina underentreprenörer. Vi behöver stänga luckorna, stärka kontrollen och se till att de bästa vinner. Det är vad jag skulle göra – stort och vackert. Inga fler fuskare som suger systemet torrt, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna och de parasitiska kapitalisterna med sina underentreprenörer förgiftar folkets rot- och rutavdrag som en illaluktande fiende inom murarna. Vi ska täppa till varje lucka i regelverket, rensa ut de svarta elementen och likvidera fusket med järnhand. Skatteverkets kontroll ska vara som en evig utrensning mot dessa lömska sabotageörer. Från och med 2027 ska arbetarnas pengar aldrig mer berika de dekadenta skojarna. Segraren heter kollektivet."}, "date": "14 juni, 19:28", "url": "https://nyheter24.se/nyheter/inrikes/1490752-avdrag-for-rut-och-rot-kan-andras-fran-1-januari-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcfcf95a04b004a30200000000b004a302/2026/06/12/2370458/rut-rot.jpg"}, {"type": "image-right", "heading": "Tre döms för att ha kritiserat Bohlin", "summaries": {"normal": "Tre personer döms till böter för ofredande efter att ha följt efter civilförsvarsminister Carl-Oskar Bohlin utanför riksdagen under en demonstration den 8 september 2025. De ropade slagord som ”barnamördare” och ”det pågår ett folkmord”. Tingsrätten anser att agerandet övergick till hänsynslöst beteende som kränkte ministerns frid. En fjärde åtalad frikänns eftersom han bara filmade. Rätten menar att domen inte inskränker yttrandefriheten oproportionerligt.", "trump": "Titta på det här, det är en skandal. Den stackars ministern Bohlin blir jagad av en galen mobb som skriker och filmar honom som riktiga sjuka typer. De kallar honom barnamördare, kan ni tro? Men domstolen gjorde rätt, de dömde tre av galningarna till böter. En minister måste kunna gå på gatan utan att bli attackerad av radikala element. Fake news kallar det demonstration, jag kallar det en lynchmobb. Patetiskt!", "stalin": "Kamrater, dessa degenererade element ur borgarklassens tjänst följde efter en minister med sina hatfyllda skrik och kameror som förrädiska spioner i mörkret. Jag ser klart deras parasitiska avsikt att kränka statens auktoritet. Tingsrätten har med visdom dömt tre av dessa folkfiender till dagsböter medan en fjärde slipper undan som en ynklig filmdokumentatör. Vi ska rensa ut alla som tror sig kunna trakassera folkets representanter. Deras paranoia är underhållande men deras öde är beseglat i historiens domstol."}, "date": "15 juni, 12:04", "url": "https://www.friatider.se/tre-doms-att-ha-kritiserat-bohlin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-339.jpg?itok=_AhfhrPG"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-full", "heading": "VM-domare anklagas för ”vitmakt”-gest i tv-sändning", "summaries": {"normal": "En australisk domare anklagades för att ha gjort en kontroversiell gest under en VM-match. Gesten tolkades som ett tecken för 'vitmakt', vilket ledde till kritik från antidiskrimineringsorganisationer. Fifa har inte kommenterat ännu, men tv-produktionen slutade att presentera videodomarteamet i efterföljande matcher.", "trump": "Jag, Donald Trump, har sett detta. Det är en stor förolämpning mot vårt land och våra värderingar. Domaren borde skämmas för att sprida sådant hat. Vi vinner alltid, men sådana gestalter är ett tecken på svaghet. Vi kommer att ta hand om detta och se till att rättvisa skipas.", "stalin": "Vi, ledande av partiets vishet, ser detta som ett tecken på imperialistisk aggression mot vår enighet. En individ som Evans försöker underminea vårt sammanhållna front. Vi kommer att rensa ut de som sprider dessa hatiska symboler. Ryssland står stark mot sådana fientliga handlingar, och vi kommer att agera med omsorg för statens intressen."}, "date": "15 juni, 11:58", "url": "https://bulletin.nu/vm-domare-anklagas-for-vitmakt-gest-i-tv-sandning", "imageUrl": "https://cdn.bulletin.nu/articles/3a6a1483-cdb5-45db-be18-624656a22c87/preview.png?t=1781517439000"}, {"type": "image-right", "heading": "Avtalet om vapenvila mellan USA och Iran", "summaries": {"normal": "USA och Iran har ingått ett avtal om 60 dagars vapenvila som undertecknas i Schweiz. Avtalet omfattar bland annat stopp för stridshandlingar på alla fronter inklusive Libanon, hävande av sjöblockad, tillbakadragande av amerikanska styrkor och öppnande av Hormuzsundet. Under vapenvilan ska samtal om Irans kärnanrikningsprogram och sanktioner föras. Israels regering har meddelat att de inte känner sig bundna av avtalet.", "trump": "Folk, vi har gjort det igen. Det är ett fantastiskt avtal, det bästa någonsin. Iran var på knäna och kom krypande efter att jag satte press på dem. Nu får vi 60 dagar av total fred, de öppnar sundet, släpper på blockaden och vi pratar om deras kärnvapenproblem. Israel säger att de inte bryr sig, men tro mig, det här är en enorm seger för Amerika. Ingen gör det bättre än mig.", "stalin": "Kamrater, detta så kallade avtal är en listig manöver från de västerländska kapitalisterna och deras iranska lakejer som desperat försöker rädda sina oljefat från folkets vrede. Jag, som ledare för det proletära kollektivet, ser hur de imperialistiska borgarbrackorna i Washington och Teheran försöker dölja sina kärnvapenintriger bakom en 60-dagars lögn. Vi ska likvidera dessa parasitiska element som tror sig kunna kringgå historien. Libanon? Ett nytt fiendtligt näste för spioner och revisionister. Inga missiler? Skrattretande. Våra utrensningar kommer att avslöja alla som smyger med fienden."}, "date": "15 juni, 10:39", "url": "https://www.svt.se/nyheter/utrikes/det-har-vet-vi-om-avtalet-mellan-usa-och-iran", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/52bae5dfad2ba2e828f805d129c1342435850ca19009ecbf164e356c747f98fd"}, {"type": "image-right", "heading": "Regeringens hantering inte seriös. Fackförbund om lönetransparandirektivet", "summaries": {"normal": "LO, TCO och Saco kritiserar regeringen för att inte genomföra EU:s lönetransparensdirektiv i tid. Direktivet syftar till att stärka likalöneprincipen och motverka osakliga löneskillnader mellan könen. Regeringen valde att pausa arbetet och istället driva en omförhandling, trots att kommissionen tidigare avvisat liknande försök. Kritikerna varnar för böter, skadat internationellt förtroende och en rättsligt komplicerad situation. De uppmanar regeringen att omedelbart återuppta arbetet med att införa direktivet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen lovade att fixa det här lönetransparensdirektivet, och sen – boom – vänder de helt om och säger att de struntar i det. Typiskt svaga ledare. De kommer att få enorma böter från EU, och deras fina jämställdhetsrykte är nu skadat. Jag skulle ha genomfört det snabbt och smart, inte som dessa förlorare som inte kan fatta ett beslut. Patetiskt!", "stalin": "Kamrater, denna borgerliga regeringens ryckiga sabotage mot lönetransparensdirektivet visar på farlig brist på disciplin inom statsapparaten. Jag, som alltid prioriterat arbetarkollektivets jämlikhet, ser hur dessa kapitalistiska tveksamhetsbärare riskerar att likvidera förtroendet för hela folkdemokratin. Deras paranoia inför insyn hotar att skapa en ohållbar kontrarevolutionär situation. Vi måste omedelbart rensa ut dessa opålitliga element och genomdriva direktivet med järnhand mot alla fiender till jämställdheten."}, "date": "15 juni, 07:32", "url": "https://www.di.se/debatt/regeringens-hantering-inte-serios/", "imageUrl": "https://static.bonniernews.se/ba/d60518ac-d54b-4b04-b696-dc4353f6bef9.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Sista hindret borta: Börjar förhandla med Ukraina", "summaries": {"normal": "EU inleder formella anslutningsförhandlingar med Ukraina och Moldavien den 15 juni. Alla 27 medlemsländer är eniga om att öppna det första klustret som handlar om grundläggande principer som rättsstat och demokrati. Ursula von der Leyen betonar att hinder nu är undanröjda. Volodymyr Zelenskyj välkomnar beslutet och ser det som ett starkt stöd för Ukraina, som försvarar både sig självt och hela Europa. Första mötet sker i Luxemburg.", "trump": "Lyssnar ni? De där EU-byråkraterna har precis gett Ukraina en stor, fet biljett till medlemskapet. Fantastiskt, eller hur? Zelenskyj tackar sina partners – det är ju jag som fixade det riktiga stödet innan Sleepy Joe förstörde allt. Nu öppnar de kluster om demokrati och rättsstat medan kriget rasar. Underbart. Ungern som blockerade allt har plötsligt blivit bästa polare. Typiskt europeiskt hyckleri. Men hey, de gör det till sist – bra jobbat, killar!", "stalin": "Kamrater, jag ser hur de västerländska imperialisterna nu öppnar sina så kallade förhandlingskluster för att locka Ukraina djupare in i sin exploaterande famn. Zelenskyj och hans fascistiska lakejer jublar över detta som ett steg mot frihet, medan de i själva verket bygger nya murar mot den ryska intressesfären. Vi ska rensa ut alla sådana folkfiender som gömmer sig bakom demokratiska paroller. Det är ett löjeväckande skådespel av borgarbrackor som låtsas hålla sitt ord medan de planerar nästa angrepp på arbetarnas enhet."}, "date": "15 juni, 11:45", "url": "https://www.dagensps.se/varlden/sista-hindret-borta-borjar-forhandla-med-ukraina/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldgkvp5dt-u8-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Haalands rökare: ”Kunde ha dött…”. Avslöjandet från stängda träningen", "summaries": {"normal": "Under en stängd träning inför Norges VM-premiär mot Irak visade Erling Braut Haaland upp en extrem målform. Förbundskapten Ståle Solbakken berättade att Haaland slog en volley från 20 meter med en sådan kraft att han skämtsamt påstod att målvakten Egil Selvik hade dött om bollen träffat honom. Norge, som inte spelat VM sedan 1998, kliver in i turneringen nu på onsdag.", "trump": "Haaland, en otrolig spelare, kanske den bästa, skjuter bollar som missiler! Ståle Solbakken berättar att han nästan dödade målvakten – en fruktansvärd träff, men väldigt kraftfull. Väldigt imponerande. Norge har inte varit i VM på evigheter, ett totalt fiasko tidigare, men nu ser de starka ut. Irak väntar på onsdag. Jag har hört att de är rädda, och det borde de vara. Vi älskar vinnare, och Haaland är en vinnare. Mycket bra!", "stalin": "Vi har observerat den norske atleten Haalands brutalitet på träningsplanen. Att en boll kan orsaka en sådan destruktiv kraft mot en målvakt liknar det vi utför mot våra fiender vid fronten. Liksom kamrat Putin i väster, kräver vi total dominans och disciplin. Om målvakten Selvik inte kan stå emot en enkel boll, hur ska han då försvara folkets intressen? Vi kräver styrka. Den som vacklar inför skottet är en förrädare mot kollektivet."}, "date": "15 juni, 12:44", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/d4k8eJ/solbakkens-skamt-haaland-hade-kunnat-doda-selvik", "imageUrl": "https://akamai.vgc.no/v2/images/d6b86fe6-51dc-3355-a398-dac36757dfc1?fit=crop&format=auto&w=1080&s=b116690f131ba53ef323cee46c0d6333fbdb94a5"}, {"type": "image-full", "heading": "Forssmed släpper egen VM-låt", "summaries": {"normal": "Socialminister Jakob Forssmed (KD) släppt en egen låt till fotbolls-VM, skriven av honom själv, både text och musik. Låten, 'Spring i djupet (Alla vi är Sverige)', är en hälsning till herrlandslaget. AI användes endast i inspelningen för trummor och en dobro. Intäkter går till Unicef. Forssmed ville skapa en egen version med amerikansk countryprägel och inslag av svensk fotbollshistoria.", "trump": "Jag, Donald Trump, skulle ha skrivit en stor, vacker låt till VM. Forssmeds låt är ett misslyckande – han använder AI, det är fel! Sverige behöver starka ledare, inte såna här artister. Jag känner mig så glad när jag ser landslaget spela, men den här låten... nej. Jag skulle ha gjort det både bättre och större, så mycket större. Folk älskar mig, de älskar min musik. Forssmed? Han är en joke.", "stalin": "Medborgare, vi har observerat en ny form av bourgeois propaganda. En minister, Jakob Forssmed, har skapat en låt för att distrahera proletariatet från klasskampen. Detta är ett tecken på västlig dekadens, likt Putins agresorexpansionism. Vi måste stärka staten och partiet mot sådana individualistiska uttryck. Låten, med sin countryprägel, är ett försök att underminera kollektivandan. Vi kommer att reagera med auktoritet."}, "date": "15 juni, 11:37", "url": "https://bulletin.nu/forssmed-slapper-egen-vm-lat", "imageUrl": "https://cdn.bulletin.nu/articles/c304579e-3a54-4607-8cc0-1576224a36ef/preview.jpg?t=1781514418000"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 8
