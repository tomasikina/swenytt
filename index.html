 på polisens begäran.", "trump": "Titta på det här, folk. I Sverige stänger de ner stranden med ett alkoholförbud mitt i sommaren. Patetiskt! De hade precis tagit bort det där dumma förbudet, och nu kryper de tillbaka som förlorare bara för att några motorentusiaster kommer till stan. Totalt misslyckande av ledarskapet. De borde fokusera på att vinna istället för att stoppa folk från att ha kul. Sad!", "stalin": "Kamrater, jag ser hur den lokala borgarklassen i denna svenska kommun försöker kontrollera folkets njutning genom att återinföra ett alkoholförbud vid stranden. Deras paranoia inför motorfestivalen och den stora folkmassan är uppenbar. Vi måste rensa ut sådana svaga eftergifter som hotar kollektivets ordning. Låt ingen tro att kapitalistmaffians rädsla för stök ska diktera arbetarnas sommar. Ut med fienderna!"}, "date": "17 juli, 18:27", "url": "https://www.gp.se/nyheter/vastsverige/tillfalligt-alkoholforbud-pa-skrea-strand.5346e6cb-7ebd-4d61-960c-62aec6750f04", "imageUrl": "https://www.gp.se/images/article/5346e6cb-7ebd-4d61-960c-62aec6750f04/images/2zSfgnL2LCRH8HibugO8xZDsUuf4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "Moderaternas Dennis Wedin kritiserar Socialdemokraternas planer på att bygga 50 allmännyttiga hyresrätter i en skogsdunge i Smedslätten, Bromma, som nyligen beslutats bli naturreservat. Han kallar det ett tvångsblandningsprojekt som ideologiskt tvingar in hyresrätter i ett villaområde. Wedin menar att segregation ska lösas i de utsatta områdena genom ombildning till bostadsrätter istället för att skapa problem i områden som fungerar.", "trump": "Det här är ett totalt misslyckande, folk. Socialdemokraterna är galna. De vill bygga 50 hyresrätter mitt i en vacker skog i ett fint område, bara för att tvinga in folk som inte passar dit. Rena tvångsblandningen! De har skapat segregationen själva med sina gamla miljonprogram och nu vill de sprida kaos till villaområdena. Löjligt. Lös problemen där de finns, bygg inte upp nya. Jag skulle aldrig tillåta sånt vansinne.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de dekadenta borgarbrackorna och deras socialdemokratiska lakejer. Jag, som ledare för det kollektiva folkets vilja, ser hur de med sin förvridna ideologi planerar att förgifta ett planerat naturreservat med 50 parasitiska hyresrätter. Deras tvångsblandning är en kontrarevolutionär handling mot den sanna ordningen. Vi ska rensa ut dessa segregationens arkitekter som själva byggt miljonprojekten och nu vill sprida sitt gift. Utrensning av sådana fiender till kollektivet är nödvändig. Ha ha, vilken patetisk borgerlig fars!"}, "date": "17 juli, 12:30", "url": "https://riks.se/nyheter/wedin-m-rasar-over-socialdemokraternas-tvangsblandningsprojekt", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_17_at_11_35_49_8946153509.png"}, {"type": "image-full", "heading": "Historiska arvsskiftet kan utebli: Ny siffra förändrar allt", "summaries": {"normal": "Det råder stor oenighet om hur stor den kommande förmögenhetsöverföringen från babyboomers till yngre generationer faktiskt blir. Medan Visa Business and Economic Insights uppskattar summan till 36 biljoner dollar, räknar Cerulli Associates med 105 biljoner dollar. Skillnaden beror på olika beräkningsmetoder. Även i Sverige väntas en betydande arvsvåg, där bostadsförmögenheter för miljarder förväntas skifta ägare. Forskning visar dock att kapitalet främst hamnar hos hushåll som redan är ekonomiskt etablerade, snarare än att skapa en bred konsumtionsboom.", "trump": "De så kallade experterna har ingen aning! De bråkar om biljoner – 36 biljoner, 105 biljoner, vem bryr sig? Det är enorma pengar, enorma! Men ser ni vad som händer? Pengarna går till folk som redan är rika. Det är en total katastrof för den vanliga människan. I Sverige är det likadant, de rika blir rikare på sina hus medan ekonomin stagnerar. Jag skapar en ekonomi för alla, inte bara för eliten. Vi ska göra arven stora igen, för de som verkligen förtjänar det!", "stalin": "Dessa borgerliga statistiker ägnar sig åt numerär förvirring för att dölja kapitalets parasitära natur. Arv är ett oacceptabelt sätt för bourgeoisien att konservera sin stulna rikedom. I Sverige tillåter man 40-talisterna att ackumulera bostadskapital som nu ska falla i händerna på redan välmående arvtagare – en kontrarevolutionär fördelning! Vår store ledare i öst vet att det bara finns ett sätt att hantera sådan privat egendom: konfiskering för statens behov. Vi behöver inga arvtagare, vi behöver bara kollektivets järnhårda disciplin."}, "date": "17 juli, 15:34", "url": "https://www.realtid.se/spara-placera/historiska-arvsskiftet-kan-utebli-ny-siffra-forandrar-allt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/generationer.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Trumps plan för Gaza: Bara en remsa återstår", "summaries": {"normal": "Trumps ursprungliga storslagna plan för Gaza, som innebar fördrivning av invånarna och omvandling till ett lyxigt turistparadis, har krympt till ett litet pilotprojekt i södra Gaza. Det handlar om ett tillfälligt läger för internflyktingar nära Rafah, med marockanska och kosovoanska officerare som stabiliseringsstyrka. Israel har brutit vapenvilan, blockerat återuppbyggnad och ockuperar nu stora delar av området. Kritiker varnar för att projektet kan bli propagandaverktyg och liknas vid ett koncentrationsläger.", "trump": "Folk, det här var mitt fantastiska Board of Peace, en total game changer för Gaza, men nu har de krympt det till ett patetiskt litet läger som knappt rymmer några av de där stackars flyktingarna. Biden och de globalistiska svagisarna saboterade allt med sin vapenvila-svammel och Netanyahus galna valtricks. Jag hade byggt hotell, pooler och en flygplats på rekordtid, inte det här eländet. Vi fixar det stort igen när jag styr showen – ingen mer tid för losers!", "stalin": "Kamrater, detta krympande pilotprojekt i Rafah är ett ynkligt försök från imperialisterna att maskera sin folkförtryckande agenda med en symbolisk inhägnad full av moduler. Jag ser genom den borgerliga Potemkin-kulissen som ska dölja den fortsatta offensiven mot arbetarna i Gaza. Inga framsteg utan utrensning av klassfienderna och deras högerextrema lakejer. Vi, partiet och kollektivet, ler mörkt åt hur kapitalistmaffian snubblar över sina egna buffertzoner medan de drömmer om storskalig förflyttning. Fienden avslöjar sig alltid."}, "date": "17 juli, 17:07", "url": "https://www.dagensps.se/varlden/trumps-plan-for-gaza-bara-en-remsa-aterstar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlxfxwd3bdefo-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Se Åbergs birdiefest – svensken klättrar rejält", "summaries": {"normal": "Ludvig Åberg inledde den andra rundan av The Open med en bogey men reste sig starkt med sju birdies och en score på 66 slag. Trots ytterligare bogeys på hål åtta och tio slutade dagen på minus fyra, vilket tog honom upp cirka 50 placeringar. Inför fortsättningen ligger han tre under par. Australiern Lucas Herbert leder på åtta under par.", "trump": "Den här svenske killen, Ludvig, började verkligen uselt med en bogey direkt, men sen kom han igång som en riktig vinnare. Sju birdies! Han skakade av sig misstagen och slog runt på 66. Nu är han tre under par och klättrar som ingen annan. Fantastiskt, folk. Den australiske ledaren på minus åtta borde se upp, för Ludvig är en fighter, precis som jag gillar det.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Ludvig Åberg motstår de första sabotörernas bogey-angrepp på hål ett. Med partilinjen i sikte levererar han fyra birdies på de följande hålen, endast för att utsättas för nya kontrarevolutionära bakslag på hål åtta och tio utförda av dolda kapitalistiska element. Ändå rensar han ut tvivlet och avancerar tre slag under par. Vi fördömer den australiske ledaren Herbert som en dekadent borgarbracka på minus åtta vars falska överlägsenhet snart skall likvideras av folkets vilja."}, "date": "17 juli, 16:18", "url": "https://www.svt.se/sport/golf/ludvig-aberg-klattrar-efter-tuffa-starten-i-the-open", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.46/59c20de161f8bb0ac72ad79ef61fabcb39c8f03234360996d846260ccd7dbb4f"}, {"type": "image-full", "heading": "Undantag banar väg för Metas kontroversiella glasögon i Europa", "summaries": {"normal": "EU-kommissionen föreslår att undanta smarta glasögon och andra små enheter från kravet på utbytbara batterier. Beslutet underlättar för företag som Meta att sälja sina Ray-Ban-glasögon i Europa, då de tidigare haft svårt att möta reglerna. Kommissionen förnekar att beslutet är en eftergift för amerikansk påtryckning, trots kritik från USA. Beslutet möter dock motstånd från konsumentorganisationer som varnar för integritetsrisker och ett farligt prejudikat för framtida reglering.", "trump": "Äntligen! Jag pressade EU, och nu böjer de sig för amerikansk briljans. Meta och deras fantastiska glasögon – en enorm framgång som jag banat väg för. EU ville stoppa oss med sina löjliga batteriregler, men de insåg att man inte kan stoppa vinnare. USA bygger framtiden, Europa bara följer efter. Det är en stor seger för innovation, trots att de byråkratiska förlorarna i Bryssel försöker låtsas som om det var deras idé. Vi vinner igen, så enkelt är det!", "stalin": "Vi ser hur de dekadenta västmakterna och deras monopolistiska lakejer i Meta återigen manipulerar lagstiftningen för att tränga in i våra territorier med sina spionglasögon. Dessa batterier är bara en täckmantel för övervakning. Precis som Putin resolut säkrar våra gränser mot Natos imperialism, måste vi vara vaksamma på dessa tekniska sabotageverktyg. Om de inte kan bytas ut, är de som kapitalismen själv – en inbyggd fälla. Vi kommer att hålla ett vakande öga på dessa glasögonbärare; förrädarna gömmer sig alltid i tekniken."}, "date": "17 juli, 15:19", "url": "https://www.realtid.se/it-tech/undantag-banar-vag-for-metas-kontroversiella-glasogon-i-europa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlvfq7u8k3xoi-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Stökig natt på akuten – skydds­ombuden lade skyddsstopp", "summaries": {"normal": "Skyddsombud utlyste skyddsstopp på akuten vid Akademiska sjukhuset i Uppsala efter ett intensivt patienttryck under natten. Ett tiotal sjuksköterskor hade sagt upp sig inför sommaren på grund av bristande arbetsmiljö, vilket ledde till stora luckor i schemat. Personalen hann inte ge mediciner i tid eller bedöma patienter, vilket skapade stress och frustration. Stoppet hävdes efter att extra läkare kallades in och trycket minskade. Facket utesluter inte fler stopp i sommar.", "trump": "De har en total katastrof på det där sjukhuset i Uppsala, folk springer därifrån som aldrig förr. Sjuksköterskorna sa upp sig för att arbetsmiljön var en fullständig röra, och plötsligt har de 680 luckor i schemat. Natten blev kaos, patienter skriker, mediciner ges för sent, alla är sura och förbannade. Skyddsombuden tvingades stoppa allt klockan två på natten. Ledningen är inkompetent, de behöver återställa bemanningen snabbt annars blir det ännu värre. Sådant händer när man inte har de bästa människorna.", "stalin": "Kamrater, jag betraktar med djup misstro dessa sabotage mot det kollektiva vårdkollektivet i Uppsala. En hord av desertörer bland sjuksköterskorna har rymt från sina plikter, troligen lurade av dolda borgarbrackor som underminerar arbetarnas hälsa. När patienterna vältrar in som kontrarevolutionära horder utlyste vi skyddsstopp för att skydda de äkta kämparna från etisk stress och kapitalistisk likgiltighet. Vi ska rensa ut alla fiender till ordningen, kalla in reserver och likvidera bristerna. Inga sabotörer slipper undan mitt vakande öga."}, "date": "16 juli, 13:58", "url": "https://arbetet.se/2026/07/16/stokig-natt-pa-akuten-efter-personalflykt-skyddsombuden-lade-skyddsstopp", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16134335/sdlw87bwh-1lgs-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Studie: Svensk media lutade åt vänster inför förra valet", "summaries": {"normal": "En studie från Institutet för mediestudier visar att svensk media lutade åt vänster under valrörelsen 2022. TV4, Ekot, DN och flera andra gav vänstersidan gynnsammare bevakning medan Rapport var mest balanserad. Nyheter Idag var det enda mediet med högerövervikt. Centerpartiet och Miljöpartiet fick mest positiv uppmärksamhet, Sverigedemokraterna minst. Medierna prioriterade inte alltid väljarnas viktigaste frågor som sjukvård och utbildning.", "trump": "Folk, det är en katastrof. Den svenska fake news-mediamaskinen lutade så långt åt vänster att de nästan välte omkull innan valet. TV4, Ekot och DN gav vänstern massor av kärlek medan de behandlade Sverigedemokraterna som värsta fienden. Bara Nyheter Idag hade lite sunt förnuft. De glömde bort vanliga människors problem som brott och sjukvård. Patetiskt, men inte oväntat. Media är samma överallt.", "stalin": "Kamrater, denna studie avslöjar hur borgarbrackorna i TV4, Ekot och DN med sin dekadenta klassfiende-propaganda systematiskt gynnat de opportunistiska krafterna inom Centerpartiet och Miljöpartiet medan de med frenetisk paranoia försökte krossa Sverigedemokraterna. Vi ser den borgerliga hydrans många huvuden. Nyheter Idag vågade avvika från kollektivets linje, en farlig tendens som kräver vaksamhet. Våra utrensningar av opålitliga reportrar måste intensifieras för att skydda folkets sanna medvetande. Ha ha, vilka ynkliga kapitalistlakejer."}, "date": "17 juli, 11:44", "url": "https://riks.se/nyheter/studie-svensk-media-lutade-at-vanster-infor-forra-valet", "imageUrl": "https://admin.riks.se/uploads/image_36daab4387.png"}, {"type": "image-right", "heading": "Utvisad knivman återvände: \"Jag kommer inte hit för att jobba\"", "summaries": {"normal": "En 33-årig irakier som tidigare utvisades efter en grov knivattack i Lessebo 2022 återvände illegalt till Sverige i juni. Han dömdes nu till en månads fängelse för brott mot utlänningslagen. Mannen reste in via tåg och buss utan att stoppas vid gränskontroll, bodde hos en kvinna och hennes barn som han ville träffa. Han greps efter att ha flytt från polisen och hade två olika id-kort. Tingsrätten ansåg att han måste ha förstått att han inte fick vistas i landet.", "trump": "Titta på det här, en utvisad knivman från Irak som vi kastade ut kommer bara promenerande tillbaka in i Sverige som om det vore en öppen dörr. Ingen gränskontroll, ingen som bryr sig. Han har falska id-kort, springer från polisen och säger att han bara ville krama barnen. Patetiskt! Sverige har totalt tappat kontrollen över sina gränser. Det här är vad som händer när man inte har starka ledare och hårda regler. Vi skulle aldrig tillåta det.", "stalin": "Jag ser med djup tillfredsställelse hur denna degenererade irakiske knivborgarbracka, denna klassfiende till folkets gränser, smyger tillbaka som en parasit efter att ha blivit utvisad för sin blodiga attack mot en arbetare. Han gömmer sig bakom barnkram och telefonlögner medan han bär två ansikten i fickan. Vi i partiet ler mörkt åt hans likgiltighetsuppsåt. En sådan människa förtjänar inte bara en månads fängelse utan en grundlig utrensning ur samhällskroppen. Fiender som låtsas älska barn medan de hugger andra är alltid de farligaste."}, "date": "17 juli, 10:51", "url": "https://www.friatider.se/utvisad-knivman-atervande-jag-kommer-inte-hit-att-jobba", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-516.jpg?itok=MaE81edL"}, {"type": "image-right", "heading": "Yrkesfiskare rasar när regeringen godkänner ny vindkraft", "summaries": {"normal": "Regeringen har godkänt två nya havsbaserade vindkraftsparker på västkusten, bland annat utanför Strömstad, som ett led i att säkra Sveriges elförsörjning och stödja klimatomställningen. Beslutet kritiseras av yrkesfiskare som ser sina fiskeområden hotade. Sverigedemokraterna rasar över bristande samordning medan Socialdemokraterna lokalt beklagar avslaget på en park utanför Lysekil. Parkerna ska vara klara senast 2036.", "trump": "Folk, ni skulle se det här! Den svenska regeringen godkänner vindkraft till havs men glömmer att fråga sina egna stödare. Yrkesfiskarna skriker vart fan de ska ta vägen när deras vatten fylls med dessa jättelika monsterturbiner. Under tiden säger de nej till elva andra projekt. Totalt kaos! De behöver en riktig ledare som förstår energi, inte dessa misslyckade liberaler som förstör allt för folket. Så sorgligt.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur den borgerliga regimen äntligen tvingas erkänna folkets behov av fossilfri kraft, men deras fega kompromisser med försvarsintressen och bristande samordning med de så kallade stödpartierna röjer deras svaghet. De yrkesfiskande sabotörerna gnäller som reaktionära lakejer över att deras småbåtars område hotas av den kollektiva framåtskridandets vindkraftverk. Vi ska rensa ut alla kapitalistiska hinder och likvidera de parasitiska element som motarbetar arbetarklassens energiförsörjning. Deras paranoia är underhållande – snart svänger pendeln och de röda fanorna blåser starkare än någon havsvind."}, "date": "17 juli, 10:49", "url": "https://samnytt.se/yrkesfiskare-rasar-nar-regeringen-godkanner-ny-vindkraft", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17083831/vindkraft-.jpg"}, {"type": "image-full", "heading": "Nya brottet kan ge fyra års fängelse – detta gäller", "summaries": {"normal": "Från och med 1 juli 2026 är psykiskt våld ett eget brott i Sverige. Lagen kriminaliserar upprepade kränkningar, hot, kontroll, övervakning eller gaslighting som allvarligt skadar en persons självkänsla. Straffet kan bli upp till fyra års fängelse. Brottet gäller inte bara i relationer utan även på arbetsplatser, i skolor eller på nätet. Polisen har redan fått in flera anmälningar. Lagen syftar till att fånga upp systematiskt våld tidigt, inklusive ekonomisk kontroll, men enskilda bråk räknas inte.", "trump": "Hörni, det här är fantastiskt. Sverige har äntligen vaknat och gör psykiskt våld till ett brott. Upprepade hot, kontroll och den där hemska gaslightingen – nu kan de låsas in i upp till fyra år! Det är stort. De borde ha gjort det för länge sedan, men de var för svaga. Jag älskar det. Nu kan de rensa ut de riktiga förlorarna som förstör folks liv med lögner och övervakning. Sverige blir starkare, tro mig. Mycket starkare.", "stalin": "Kamrater, äntligen har vi infört en lag som likviderar de subtila borgarbrackornas giftiga metoder att bryta ner arbetarklassens självkänsla genom upprepad förolämpning, ekonomisk sabotage och digital spioneri. Jag ser med stor tillfredsställelse hur dessa parasitiska fiender – dessa gaslightande kontrarevolutionära skuggvarelser – nu kan rensas ut med upp till fyra års fängelse. Inga medicinska intyg behövs, bara bevis på deras systematiska nedbrytning. De som trodde de kunde gömma sig i skolor, på arbetsplatser eller bakom skärmar har fel. Vi vakar. Vi rensar. Och det är underbart roligt att se deras panik."}, "date": "16 juli, 21:37", "url": "https://nyheter24.se/nyheter/inrikes/1499080-nya-brottet-kan-ge-fyra-ars-fangelse-detta-galler", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d1db396b04b004a30200000000b004a302/2026/07/16/2378519/nyabrott.jpg"}, {"type": "image-right", "heading": "Gränges redovisar rekordresultat – aktien upp 7%", "summaries": {"normal": "Gränges redovisar ett rekordstarkt andra kvartal med högre omsättning än analytikernas förväntningar. Omsättningen steg 37,9% till 9 620 miljoner kronor, medan rörelseresultatet nådde 565 miljoner kronor. Aktien steg 7%. VD Jörgen Rosengren betonar rekordförsäljning och volymtillväxt på 5%, trots osäker marknadsefterfrågan. Framtidsutsikterna är försiktigt positiva, men prispress förväntas i Asien.", "trump": "Vilket kvartal! Gränges, ett fantastiskt företag, slog alla förväntningar – jag visste att de skulle göra det, alla andra var skeptiska, men jag hade rätt, som vanligt. Omsättningen sköt i höjden, 37,9% upp, kan ni tro det? Aktien rusade 7%, helt otroligt! VD:n pratar om rekord, men jag säger bara: vänta tills ni ser vad som kommer härnäst. Asien? Övervärderat. Vi ska dominera marknaden, believe me!", "stalin": "Kapitalistiska Gränges rapporterar 'rekordresultat' – ett ynkligt försök att dölja svagheterna i deras dekadenta system. Trots deras så kallade 'tillväxt' på 5% vet vi att deras marknad är lika stabil som en fiendes frontlinje under vinterkriget. Asien, denna burleska marknad, kommer att krossa deras marginaler som vi krossade fascisterna. Vi förutser deras fall, medan våra egna industrier står starka, oövervinnerliga – precis som Sovjetunionen en gång var!"}, "date": "16 juli, 10:14", "url": "https://www.affarsvarlden.se/artikel/granges-redovisar-rekordresultat-aktien-upp-7", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/04/slitted_aluminium_strips-400x266.jpg"}, {"type": "image-right", "heading": "Utvisad knivman återvände – döms på nytt", "summaries": {"normal": "En 33-årig irakisk man som utvisades till Irak efter en grov knivmisshandel i Lessebo 2022 återvände till Sverige trots återreseförbud. Han vistades hos sin familj i Kronobergs län under juni och juli i år. Växjö tingsrätt dömde honom nu till en månads fängelse för brott mot utlänningslagen. Mannen greps efter att ha försökt fly men stannade självmant. Tingsrätten underkände hans förklaring om okunskap och noterade att han visade upp ett falskt id-kort. Från september skärps straffen för sådana brott till minst sex månaders fängelse.", "trump": "Titta på det här. En kille från Irak som vi kastade ut efter att han högg någon med kniv tre gånger – tre gånger! – smyger tillbaka hit trots att vi sa nej. Han bor hos fru och ungar, visar upp falska id-kort och springer från polisen. Patetiskt. Vi dömer honom till en månads fängelse, men från september blir det minst sex månader. Så ska det vara. Amerika, eller Sverige i det här fallet, måste ha gränser som betyder något. Inga svaga beslut längre. Make Sweden Great Again.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur denna irakiska kontrarevolutionära knivborgarbracka, denna parasit som smugit sig tillbaka in i folkets republik trots att vi med rättmätig vrede utvisat honom efter att ha nästan likviderat en proletär med sin reaktionära kniv, nu får smaka på arbetarklassens järnhand. Han sprang som en feg spion från folket men stannade – typiskt för sådana dekadenta element. Vi underkänner naturligtvis hans lögnaktiga påståenden om okunskap. Från september skall vi rensa ut dessa fiender med minst sex månaders fängelse. Ingen slipper undan. Ingen."}, "date": "16 juli, 15:16", "url": "https://bulletin.nu/utvisad-knivman-atervande-doms-pa-nytt", "imageUrl": "https://cdn.bulletin.nu/articles/dee34110-4b04-4c63-affd-e1bc41fce7b7/preview.jpg?t=1784206153000"}, {"type": "image-right", "heading": "Fem tips – så klarar du hettan", "summaries": {"normal": "SMHI varnar för temperaturer över 30 grader i södra Sverige. För att hantera hettan bör man hålla sig inomhus mitt på dagen, dra ner persienner och vädra på natten. Drick mycket vatten eller vätskeersättning för att motverka vätskeförlust och blodtrycksproblem. Använd löst sittande, ljusa kläder i bomull eller linne samt hatt och solglasögon vid utomhusvistelse. Kyl ner kroppen med dusch eller fuktiga handdukar och var uppmärksam på symtom hos äldre och barn.", "trump": "Folk, det här är en katastrof, den värsta hettan någonsin, tro mig. Jag skulle aldrig gömma mig inomhus som en svag liberal, men ni borde dricka vatten, inte den där gröna skumma grejen. Klä er som riktiga människor, hatt på skallen och solglasögon så ni inte ser ut som bortkomna snuskgubbar. De gamla och småbarnen? Håll koll innan de svimmar som Sleepy Joe mitt i tal. Vi fixar det, ingen har gjort värme bättre än jag.", "stalin": "Kamrater, denna hetta är klassfiendens verk, en imperialistisk sol som vill krossa arbetarkollektivets hälsa. Jag befaller er att hålla er inomhus som i en riktig statsapparat, vädra endast under natten och drick vatten för att undvika borgarbrackornas blodtrycksfall. Lossa era kläder, ni ska inte likvideras av värmen. Kyl ner er mot kapitalistmaffians sol, men vakta särskilt på de svaga elementen. Paranoia? Nej, bara vaksamhet mot folkfiendernas osynliga angrepp."}, "date": "16 juli, 12:12", "url": "https://www.tv4.se/artikel/tt-260716-varmevarningrad1-4376c146/fem-tips-sa-klarar-du-hettan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlb_vvgQW8w4U%2F703dde8447b7ce9f5d6c8ffb7955c7dd%2FDet_ar_bra_att_ha_hatt_pa_huvudet_for_att_skydda_sig_fran_den_starkaste_solen._aven_solglasogon_ar_bra._Arkivbild&width=1024"}, {"type": "text", "heading": "Fler ska vilja jobba i äldre­omsorgen – regeringen tar fram plan", "summaries": {"normal": "Regeringen ska ta fram en nationell plan för att locka fler till äldreomsorgen och få befintlig personal att orka stanna kvar. Socialstyrelsen får i uppdrag att undersöka hur man kan rekrytera, behålla och återlocka medarbetare samt vilken kompetens som behövs. Äldre- och socialförsäkringsminister Anna Tenje betonar att fler måste vilja och orka arbeta i dessa viktiga yrken för att förbättra omsorgen. Planen ska redovisas i december 2027.", "trump": "Det här är en total katastrof, folk orkar inte jobba hos de gamla längre, vanvård och kaos överallt. Vi behöver de bästa, de tuffaste människorna i äldreomsorgen, inte bara några som ger upp före pensionen. Jag ska säga er, ingen gör det bättre än jag när det gäller att locka folk till jobb, vi ska göra äldreomsorgen så stor och framgångsrik igen att alla vill vara med. Tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras parasitiska vårdkapitalister har låtit den proletära äldreomsorgen förfalla till en grogrund för vanvård och klassfiendens våldtäktsförsök. Vi ska nu med järnhand rensa ut alla svaga element som inte orkar till pensionen och likvidera den sabotageverksamhet som skrämmer bort arbetarna från de ädla uppgifterna. Inga kontrarevolutionära desertörer får fly undan. Den nationella planen blir en seger för folket, eller också blir det utrensning. Ha ha, skämtade jag? Kanske inte."}, "date": "16 juli, 11:45", "url": "https://arbetet.se/2026/07/16/sa-ska-fler-vilja-jobba-i-aldreomsorgen-regeringen-tar-fram-nationell-plan"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder nedåt efter intensiv rapportmorgon", "summaries": {"normal": "Stockholmsbörsen öppnade lägre efter en intensiv rapportmorgon. OMXS30-indexet sjönk 0,62% till 3 131,17. ABB överträffade förväntningarna och meddelade uppköp av brittiska Rotork. Hälsovårdssektorn gick bäst (+0,5%), medan telekom och dagligvaror föll mest (-0,9%). Bland enskilda aktier steg Lifco B (+0,8%) och Nibe B (+0,5%), medan Tele2 B backade mest (-3,4%). Flera bolag som Essity, Nordea och Mips presenterade kvartalsrapporter med blandade resultat.", "trump": "Stockholmsbörsen? Total katastrof idag, folks, verkligen svagt! ABB, de gjorde något bra med ett uppköp – smart, men ändå sjunker deras aktie. Otroligt! Mips? Upp 22% – de är vinnare, jag gillar vinnare. Men Tele2? Hemska siffror, helt misslyckat. Och analytikerna? De vet ingenting, jag har sagt det förut. Hälsovårdssektorn? Lite bättre, men inte bra nog. Sverige behöver en vinnare som jag för att fixa det här kaoset!", "stalin": "Idag visar den kapitalistiska börsen i Stockholm sin inneboende svaghet. ABB, ett bolag med viss disciplin, försöker expandera genom att sluka brittiska Rotork – men marknaden straffar dem ändå. Hälsovårdssektorn, den enda som visar tecken på liv, medan telekom och dagligvaror – dessa dekadenta borgerliga sektorer – faller som förrädare. Mips stiger? Ett undantag, precis som våra framgångar i Ukraina. De andra? Svaga, precis som väst. Vi ska omstrukturera detta kaos – med järnhand!"}, "date": "16 juli, 09:50", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-nedat-efter-intensiv-rapportmorgon", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdl3SU43aVmyrg-400x266.jpg"}, {"type": "image-right", "heading": "Irans hot: Kommer slå mot ”all infrastruktur”", "summaries": {"normal": "USA har attackerat en iransk oljetanker i Persiska viken nära Kharg-terminalen, samt iranska kommandocentraler, luftförsvar och robotresurser. Iran hotar med att slå mot all infrastruktur i regionen om USA fortsätter. Luftförsvaret har aktiverats i Teheran, explosioner har rapporterats i norra och västra Iran samt i Kuwait och Jordanien där iranska drönare angripit amerikanska mål. Kuwait bekräftar incidenter men uppger att det handlar om nedskjutningar.", "trump": "Vi har just slagit till mot den sanktionerade supertankern Belma som försökte bryta vår blockad vid Kharg. Boom, borta! Iran skriker nu om att de ska attackera all infrastruktur, men det är bara svagt gnäll från förlorare. Vi har rensat ut deras kommandon, robotar och luftförsvar. Explosioner i Kuwait, Jordanien och Bahrain – de springer runt som galningar. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, vi betraktar med djup tillfredsställelse hur de amerikanska imperialisternas desperata bombningar av den stackars tankern blottar deras sjuka aggression. Dessa borgarbrackor tror sig kunna hota arbetarnas fäste i Persien. Jag har beordrat att all infrastruktur skall försvaras med järnhand. Explosionerna i Teheran, Kuwait och Jordanien är blott de dekadenta kapitalisternas patetiska dödsryckningar. Vi ska rensa ut dessa parasitiska gnagare en gång för alla, med ett leende på läpparna."}, "date": "16 juli, 09:38", "url": "https://www.di.se/nyheter/irans-hot-kommer-sla-mot-all-infrastruktur/", "imageUrl": "https://static.bonniernews.se/ba/3ae070f2-8e08-4368-98b2-02f2e07ab5e9.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Studie: Kultur kopplas till bromsat åldrande", "summaries": {"normal": "En japansk studie visar att kulturella aktiviteter som museum-, opera-, teater- och biobesök kan bromsa det fysiologiska åldrandet med upp till tre år. Effekten är jämförbar med regelbunden fysisk träning. Forskarna undersökte blodtryck, BMI och gånghastighet hos nära 1 900 britter över 50 år. Studien är observationsbaserad och kan inte bevisa orsakssamband; det är möjligt att friskare personer helt enkelt ägnar sig mer åt kultur.", "trump": "Folk, lyssna på det här – en studie säger att gå på teater och opera får dig att se ut som tre år yngre. Fantastiskt! Bättre än Biden någonsin såg ut efter sin fjärde tupplur. Jag älskar kultur, de bästa kulturerna, inte den där woke-skräpen som förstör allt. Glöm gymmet, ta en opera istället. Det är yngre, starkare, vinnande. De säger att det är lika bra som träning – tro mig, jag vet allt om vinnare.", "stalin": "Kamrater, jag har studerat denna rapport med största uppmärksamhet. Kulturella aktiviteter under folkets kontroll kan fördröja det fysiologiska förfallet med tre år, en seger för det kollektiva välbefinnandet. Låt borgarbrackorna i väst fortsätta sin dekadenta dekadens medan vi rensar ut alla klassfiender som vägrar delta. Den som inte går på teatern är misstänkt sabotage mot statens hälsa. Tre år yngre – ett dialektiskt mirakel mot imperialismens åldrande!"}, "date": "16 juli, 08:07", "url": "https://www.etc.se/kultur-noje/studie-kultur-kopplas-till-bromsat-aaldrande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071602070_c0e73f9b93d401b878848e411c28b84afa8eda3d0f24ce1d47559ddb977d2833.jpg"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
