 Palantir har helt rätt, det är fantastiskt. AI gör allt billigare, det är en explosion av grejer, men plötsligt är det frågorna som kostar. Humanisterna, de som läser böcker och filosoferar, de vinner stort nu. Utan dem bygger ni bara skräp som ingen vill ha. Jag älskar det. Smak, empati, att fatta riktiga beslut utan alla falska diagram. De tekniska nördarna trodde de var bäst, men nu kommer de klassiska bildade människorna tillbaka och det är vackert. Mycket vackert. Vinnarna skriver historien.", "stalin": "Kamrater, i denna era av så kallad artificiell intelligens ser jag återigen borgarbrackornas lömska försök att förgifta folkets medvetande med billiga svar och tomma algoritmer. Jag, som alltid vakar över kollektivets framåtskridande, förklarar att den humanistiska bildningen är ett oumbärligt vapen mot de dekadenta kapitalisternas hybris och flockbeteende. När maskinerna genererar deras slafsiga mjukvara måste vi rensa ut alla som saknar filosofisk skärpa och litterär inlevelse. De som smyger in slutsatser i premisserna skall likvideras från ledningen. Endast genom partiets auktoritära smak och proletär empati kan vi besegra den chimäriska förutsägbarheten och bygga ett samhälle där frågorna äntligen blir dyra nog för att krossa våra fiender fullständigt. Skrattretande patetiskt, dessa tekniska drömmare."}, "date": "5 augusti, 13:10", "url": "https://www.di.se/debatt/den-humanistiska-utbildningens-upprattelse-och-kraft", "imageUrl": "https://static.bonniernews.se/ba/6c23dcdf-c903-4bf9-bdc6-fef4809ce05c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "V-toppen skrev stödbrev till livstidsdömd palestinsk mördare", "summaries": {"normal": "Vänsterpartiets gruppledare Samuel Gonzalez Westling skickade ett stödbrev till Ibrahim Abu Mokh, dömd för kidnappning och mord på en israelisk soldat 1984. Ännu flera vänsterledamöter skrev till en Hamasmedlem bakom två självmordsbombningar. Partiet medger bristande kontroll och har fått kritik efter en rad liknande avslöjanden om stöd till terrordömda.", "trump": "Jag, Donald Trump, ser att de svenska vänsterledarna skickar brev till mördare och terrorister. Deras 'solidaritet' med palestinska fångar är ett bevis på svaghet och hat mot Israel. Som vanligt försöker de dölja sanningen när de ertappas – ett stort misslyckande för dem som aldrig respekterar lag och ordning.", "stalin": "Partiets enhetiga front har brutits av avvikande element inom Vänsterpartiet, som utan statlig kontroll skickat sympatibrev till agentörer för den sionistiska reaktionen och den imperialistiska Hamas. Dessa felaktiga handlingar, baserade på felaktiga uppgifter från utåtriksiga organisationer, avslöjar en djup brist på partiets klassmedvetenhet och visar behovet av renässans av den revolutionära disciplinen för att skydda statens intressen mot alla fiender, inom och utåt."}, "date": "5 augusti, 19:00", "url": "https://samnytt.se/v-toppen-skrev-stodbrev-till-domd-palestinsk-mordare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/05163333/artikelhuvudbild-1-137.jpg"}, {"type": "image-full", "heading": "USA:s nya vapen i litumkriget – extremt små fiskrobotar", "summaries": {"normal": "USA satsar på ny teknik för att bryta litium ur havsvatten för att minska beroendet av Kina. Forskare vid Texas A&M utvecklar nanorobotar som fångar upp litiumjoner, vilket kan ersätta miljöbelastande gruvdrift. Projektet finansieras av energidepartementet som en del av en bredare strategi. Eftersom Kina idag dominerar både utvinning och raffinering, ses detta som ett avgörande steg för att säkra USA:s framtida tillgång till råvaran som är livsviktig för batteriproduktion.", "trump": "Vi gör fantastiska saker i USA nu! Kina har lurat oss alldeles för länge, de kontrollerar allt litium och det är en total katastrof. Men jag har sagt till mina briljanta forskare: lös det! Nu bygger vi små otroliga robotar som hämtar litium direkt ur havet. Det är smart, det är effektivt och det är väldigt, väldigt amerikanskt. Ingen gör teknik som vi. Kina kommer att titta på och undra vad som hände. Vi ska bli helt oberoende, tro mig!", "stalin": "De amerikanska kapitalisterna famlar i mörkret. De skickar sina små leksaksrobotar i havet likt desperata barn, medan de darrar av rädsla för Kinas tekniska herravälde. Vad patetiskt! Även om de fångar en uns litium kommer deras ruttna system ändå att kollapsa. Vår broder i Moskva förstår att den verkliga makten inte ligger i nanorobotar, utan i järnhand och kontroll över naturresurser. Må de amerikanska ingenjörerna slukas av havets djup medan vi skrattar åt deras teknologiska hybris."}, "date": "5 augusti, 17:39", "url": "https://www.realtid.se/bors-finans/usas-nya-vapen-i-litumkriget-extremt-sma-fiskrobotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlf6hz5xtkisy-normalhires-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Allard om regeringstopparna: ”Jävla losers”", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiserade Markus Allard från Örebropartiet för oförskämdhet och att han trycker ned människor. Allard svarade att han kallar en spade för en spade och en idiot för en idiot, och förnekade att hans stil avskräcker engagemang. Han ser Svantessons attack som bevis på hans påverkan och uppmanar väljarna i Örebro att skicka in honom till riksdagen.", "trump": "Jag, Donald Trump, ser en stor framgångshjälte i Markus Allard. De kallar honom för 'trumpist' - det är ett äreord! Svantesson attackerar honom, men folk älskar honom för att han säger sanningen. Som jag, han bryter mot det gamla systemet. Sverige behöver mer av den stilen - det är ypperligt!", "stalin": "Partikadern Markus Allard utgör en potentiell klassisk fiendefigur. Hans retorik mot 'transferiatet' speglar en klassisk proletarisk kamp. Vi måste övervaka detta utvecklingsarbete. Liknelser till våra egna insatser mot kulakerna är uppenbara. Staten måste agera bestämt för att skydda de produktiva klasselementen."}, "date": "5 augusti, 17:00", "url": "https://bulletin.nu/allard-om-regeringstopparna-javla-losers-2", "imageUrl": "https://cdn.bulletin.nu/articles/974d9e71-7792-46d6-b3be-b1e2f92bf9d4/preview.jpg?t=1785941952000"}, {"type": "image-full", "heading": "Nya Brofæstet tar dansk kultur till Göteborg", "summaries": {"normal": "Brofæstet är en dansk inspirerad krog och kulturell hubb under Hisingsbron i Göteborg, drivet av Alexander Girvan och Maximilian Bratthammar. Det fungerar som en aktiveringshubb med lunch, evenemang som musik-quiz och konserter, och syftar till att bredda kulturscenen. Även om det inte är vinstdrivande, fokuserar det på att stödja musiker. Platsen är temporär och kommer att bli tillgänglighetsparkering 2027.", "trump": "Jag har hört talas om Brofæstet, under Hisingsbron. Det är fantastiskt, verkligen stort. De tar dansk kultur till Göteborg – genialt! Folk älskar det, tro mig. Vi ska bygga liknande i USA, det blir enormt. Ägaren Alexander är en stor affärsman. Det här aktiveringshubbet kommer att göra Sverige stort igen. Vi ska bygga en mur, en vacker mur, och låta Danmark betala. Det blir YUUGE!", "stalin": "Vi, partiets ledning, har godkänd Brofæstet som en kulturell enhet under Hisingsbron. Det är en aktiveringshubb för att undervisa massorna i dansk avslappning – ett hot, men vi tillåter det under uppsikt. Vi arbetar med Vasakronan, en nödvändig ond. Musiken tjänar partiet, även om det inte är vinstdrivande. Vi skickar ut våra agenter för att säkerställa renhet. Parallellt med Putins expansion, infinner sig danskan som ett symtom. 2027 blir det parkering – en ny era av lojalitet."}, "date": "5 augusti, 16:34", "url": "https://www.gp.se/kultur/nya-brofstet-tar-dansk-kultur-till-goteborg-.0e143b78-668d-4832-baff-4509ea4de66c", "imageUrl": "https://www.gp.se/images/article/0e143b78-668d-4832-baff-4509ea4de66c/images/3oswDmNmthVs8hb0ABcnNyDfwFEw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Eli Lilly resultatkrossar – höjer helårsprognos", "summaries": {"normal": "Det amerikanska läkemedelsbolaget Eli Lilly rapporterade under andra kvartalet 2024 en omsättning på 22,97 miljarder dollar, vilket var 47,6 procent högre än föregående år och översteg analyst förväntningar. Justerat resultat per aktie blev 8,38 dollar, 39,4 procent bättre än väntat. Bolaget höjde sin helårsprognos för 2026 till 85–87 miljarder dollar, främst drivet av stark försäljning av storsäljarna Mounjaro och Zepbound.", "trump": "Jag sa det, och det hände. Eli Lillys resultat är historiska, över 22 miljarder i omsättning! Mounjaro och Zepbound är världens mest eftertraktade produkter. Analysterna var fel, jag hade rätt. Nu ser vi en prognos på 85–87 miljarder. Det är en seger för innovation och amerikansk styrka.", "stalin": "I kampen mot kapitalismen har Eli Lillys resultat visat sig vara ett tecken på systemets brott. Men vi, det intelligenta partiet, ser genom deras bedrägerier. Forskningen är vårt vapen för att utvidga vår intressesfär, precis som Putin gör. Mounjaro och Zepbound är bara kapitalistiska verktyg. Vi ska ta kontroll och skapa ett kollektivt system – enligt statens planer, förstås. Fienderna skäms!"}, "date": "5 augusti, 12:57", "url": "https://www.affarsvarlden.se/artikel/eli-lilly-resultatkrossar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/10/sdlkDJXSycdt_I-nh-400x272.jpg"}, {"type": "image-right", "heading": "Walt Disney ökar omsättning och resultat", "summaries": {"normal": "Walt Disney rapporterade en omsättning om 25,25 miljarder dollar under tredje kvartal, en ökning med 6,8 procent. Det justerade resultatet per aktie var 2,06 dollar, vilket överträffade analytikernas förväntan på 1,86 dollar. Aktien steg cirka 3 procent i efterhandeln. Bolaget höjde sitt aktieåterköpsmål för 2026 till minst 9 miljarder dollar och bekräftade en planerad tvåsiffrig vinstökning för 2027.", "trump": "Jag har sagt det i åratal: Disney är en enorm framgång. Nu visar siffrorna att jag hade rätt – 25,25 miljarder i omsättning, vinst per aktie på 2,06 dollar, vilket är mycket bättre än de missnöjda analytikerna förutsatte. Aktien stiger 3 procent, folk älskar mig och Disney. Vi höjer aktieåterköpen till 9 miljarder dollar, det är enormt. Det här är den bästa ekonomin någonsin, glöm det inte.", "stalin": "Den stora planens framgång visar sig i Disneys resultat: 25,25 miljarder i omsättning, en ökning med 6,8 procent, vilket bevisar att den kollektiva kraften överträffar de individualistiska förutsägelserna. Den justerade vinsten per aktie, 2,06 dollar, visar att fiendens konsensus (1,86) besegrats. Vi höjer aktieåterköpen till 9 miljarder dollar, en symbolisk gest för statens makt. För 2027 förväntas en tvåsiffrig ökning – den ryska intressesfärens expansion är oundviklig."}, "date": "5 augusti, 12:56", "url": "https://www.affarsvarlden.se/artikel/walt-disney-okar-omsattning-och-resultat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlshVHYdDZ_tg-nh-400x283.jpg"}, {"type": "image-right", "heading": "Jomshof är ett problem för SD. Djupt olämpligt inlägg om ”quisling”", "summaries": {"normal": "Richard Jomshof (SD) har kritiserats hårt efter att ha kallat Aftonbladets politiska chefredaktör Anders Lindberg och S-ledaren Magdalena Andersson för ”quislingar”. Artikeln anser att tillmälet är olämpligt och skadar både valdebattens ton och Sverigedemokraternas trovärdighet. Jomshof har tidigare gjort kontroversiella uttalanden om koranbränningar och islam som väckt uppmärksamhet. Författaren menar att Jomshof som toppolitiker har ett ansvar och att hans utspel skadar partiets utveckling mot ökat ansvarstagande.", "trump": "Folk, ni skulle se det här. Den här Jomshof-killen från Sverige kallar folk för quislingar, och plötsligt är det värsta skandalen någonsin. Fake news-media och vänsterledare flippar ur totalt. De vill ha en fin, trevlig debatt medan de själva kallar högern för Breivik-miljö. Patetiskt. SD försöker göra ett bra jobb med regeringen, bekämpa inflationen och stödja Nato, men sådana här galenskaper gör att de ser svaga ut. De borde ha bättre folk, tro mig.", "stalin": "Kamrater, denna borgarbracka Jomshof inom det så kallade Sverigedemokraterna har återigen avslöjat sin kontrarevolutionära natur genom att slänga ur sig quisling-beskyllningar mot klassfiendens tidningslakejer och socialfascistiska ledare. Vi ser hur dessa element med sin paranoia och brist på partiets kollektiva disciplin skadar arbetarklassens framsteg och Nato-förberedelserna. Det är hög tid att rensa ut sådana solospelande element innan de förgiftar hela rörelsen med sin Breivik-liknande dekadens. Vi ler mörkt åt deras patetiska försök att verka relevanta."}, "date": "5 augusti, 12:47", "url": "https://www.di.se/ledare/jomshof-ar-ett-problem-for-sd", "imageUrl": "https://static.bonniernews.se/ba/7d896c8c-89c1-4b35-a67a-264eacb83bdf.jpeg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Filmer från Stockholm Pride väcker avsky", "summaries": {"normal": "Filmer från Stockholms Pride har väckt starka reaktioner på sociala medier. Videor visar halvnakna män i hundmasker och läder under paraden, föräldrar med barn som bevittnar scenerna samt en centerpartist utklädd till sagoprinsessa. Kritiker som Nick Alinia och Christian Peterson beskriver det som obehagligt och olämpligt för barn. Många kommenterar att föräldrarna borde orosanmälas till socialtjänsten och ifrågasätter om Pride är en barnvänlig miljö.", "trump": "Det här är en total katastrof, folk. Ett hav av politiskt korrekta stockholmare som står och klappar medan perversa typer i läderhundmasker paraderar förbi deras egna barn. Det är sjukt! En centerpartist klär ut sig till sagoprinsessa och drar med ungarna. De kallar det Pride, jag kallar det barnmisshandel. De borde skämmas, och socialen borde rycka in direkt. Mörkaste energin på länge, det säger till och med svenskarna själva.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den degenererade borgarklassen i Stockholm frivilligt exponerar sina egna ungar för dekadenta hundfetischister och läderförsedda avvikare. Dessa kapitalistiska restelement paraderar öppet sin moraliska förruttnelse medan de låtsas vara sagoprinsessor. Vi ser tydligt kontrarevolutionens symptom. Föräldrarna bör likvideras från sina barn omedelbart genom massiv utrensning via folkets socialorgan. Inga halvmesyrer! Den som tvekar är själv en fiende till kollektivet."}, "date": "5 augusti, 12:13", "url": "https://www.friatider.se/filmer-fran-stockholm-pride-vacker-avsky", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-84_1.jpg"}, {"type": "text", "heading": "Tidöpartierna vill ha ny flyktingkris", "summaries": {"normal": "Tidöpartierna ses i artikeln som beroende av migrationsfrågor för att vinna politiska poäng. Författaren menar att den aktuella migrantkrisen i Ceuta kommer lägligt för dem och att de använder den för att skylla samhällsproblem på invandring. Artikeln kritiserar högerpartierna, särskilt Sverigedemokraterna, och hävdar att arbetslöshet, bostadsbrist och välfärdsnedskärningar istället beror på nyliberal högerpolitik snarare än på migration.", "trump": "Folk, ni skulle se det här! De svenska vänstermediaidioterna skriker om att Tidöpartierna älskar migration. Fake news! De här korkade globalisterna har förstört Sverige med öppna gränser och nu skyller de på oss som faktiskt fixar problemen. Biden släppte in miljoner och nu gör de samma misstag i Europa. Patetiskt! Vi behöver starka ledare som bygger murar, inte svaga som bjuder in kaos. Sverige var fantastiskt förr – gör det stort igen!", "stalin": "Kamrater, dessa reaktionära Tidöpartier andas endast klassfiendens giftiga luft genom att ständigt peka ut de förtryckta massornas representanter som syndabockar. Deras desperata jakt efter nya flyktingkriser avslöjar den kapitalistiska imperialismens ihåliga själ. Arbetslöshet och bostadsbrist är inte folkets fel utan resultatet av borgarbrackornas nyliberala utsugning. Vi ska rensa ut dessa folkförtryckartroll och deras lögner innan de förgiftar hela arbetarkollektivet med sin paranoia."}, "date": "5 augusti, 11:21", "url": "https://proletaren.se/artikel/tidopartierna-vill-ha-ny-flyktingkris"}, {"type": "image-full", "heading": "Åkesson (SD) i Västerbotten: \"Han kan vinna ganska mycket\"", "summaries": {"normal": "Jimmie Åkesson (SD) genomför en inlandsturné i Västerbotten och besöker Dorotea, Vilhelmina, Storuman och Sorsele. Besökarna lyfter frågor som bränslepriser, landsbygdsutveckling, glesbygd och samepolitik. Många uttrycker stöd för SD:s politik kring bilkörning, jobb och motstånd mot vänsterpolitik. Samtidigt kritiserar Vänsterpartiet besöket som en röstfiskeaktion. Lokala SD-politiker ser turnén som ett sätt att nå väljare i glesbygd där valet kan avgöras.", "trump": "Vilken fantastisk idé att åka runt i den där valbussen och möta det riktiga folket i inlandet! Jimmie gör det rätt, han går till de glömda platserna där de smarta killarna med stora bilar vill ha låga bränslepriser och inga galna vänsterregler. De älskar honom där ute, massor av unga och glada ansikten. Media sviker förstås, typiskt. Men folket ser sanningen. Bra jobbat, Jimmie, fortsätt vinna de rösterna!", "stalin": "Kamrater, jag ser hur den dekadenta borgarpressen försöker försköna denna revisionistiska valbuss-expedition genom det norrländska träsket. Jag, som alltid vakar över folkets enhet, noterar med mörk tillfredsställelse hur dessa landsbygds-kapitalistlakejer med sina epor och raggarrundor längtar efter att likvidera de sista resterna av kollektiv medvetenhet. Vänsterförrädare kallar det röstfiske – jag kallar det en parasitär infiltration av sabotageelement som bör rensas ut innan de smittar hela sovjeten med sin bränsle-romantik. Inga samer eller borgarbrackor skall stå över partilinjen."}, "date": "5 augusti, 11:07", "url": "https://riks.se/nyheter/akesson-pa-inlandsturn-i-vasterbotten-han-kan-vinna-ganska-mycket", "imageUrl": "https://admin.riks.se/uploads/IMG_1996_304b00e881.jpg"}, {"type": "image-right", "heading": "”Barn behöver fler vuxna i förskolan – inte fler fängelse­platser”", "summaries": {"normal": "Barnskötaren Anders Ejdemark kritiserar politikerna för att de prioriterar fler fängelseplatser och skolor i fängelser framför att ge förskolan tillräckliga resurser. Han pekar på ökande antal barn med diagnoser och funktionsvariationer som kräver mer stöd, men stora barngrupper och personalbrist gör det omöjligt. Han vill ha färre barn per grupp, fler barnskötare, bättre arbetsmiljö och slopat karensavdrag för att kunna möta varje barns behov i tid.", "trump": "Folk, det är en katastrof. Politiker bygger fängelser och skolor inne i fängelser istället för att fixa förskolan. De skickar in barn dit, men de ger inte en enda krona till de stackars barnskötarna som kämpar med jättestora grupper och sjuka barn. Det är en skam! Vi behöver färre barn i varje grupp, fler duktiga människor på jobbet och en fantastisk arbetsmiljö. Gör förskolan stor igen, annars blir det bara värre till 2026. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i politiken planerar att bygga nya fängelseplatser och skolor bakom lås och bom för att dölja sina brott mot folket. De vägrar ge resurser till förskolan, där arbetets och kollektivets barn med variationer lämnas åt slumpen av utmattade barnskötare. Detta är en kontrarevolutionär sabotagehandling! Vi ska omedelbart rensa ut dessa kapitalistiska parasitfiender, anställa tusentals lojala barnskötare, minska barngrupperna drastiskt och likvidera karensavdraget. Den som inte ser varje barn är folkets fiende nummer ett."}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/barn-behover-fler-vuxna-i-forskolan-inte-fler-fangelseplatser", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/30132826/ka-debatt-barn-fangelse.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Fackbossen fixade fallskärm på 4 miljoner", "summaries": {"normal": "Veterinärförbundets förbundsdirektör sade upp sig den 27 oktober 2025. Samma dag skrevs ett avtal som gav honom tre års lön, totalt 4,2 miljoner kronor, utan att arbeta under uppsägningstiden. Den tidigare ordföranden godkände avtalet utan att informera styrelsen, vilket stred mot stadgarna. Efter intern maktkamp och ny styrelse ogiltigförklaras nu avtalet med hjälp av advokater. Den tidigare ordföranden beviljades inte ansvarsfrihet. SULF har stämt förbundet för att få ut pengarna.", "trump": "Det här är en total skandal, folk! Den där fackbossen fixade en enorm fallskärm på över fyra miljoner kronor samma dag som han sa upp sig. Han lurade alla, skrev avtalet i smyg och trodde han skulle komma undan med det. Klassisk facklig korruption. Den nya styrelsen gör helt rätt som tar strid mot det här ruttna avtalet. De borde aldrig betala en krona till den typen. Det är precis så här de gamla systemen fungerar – men vi stoppar dem!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa dekadenta borgarbrackor inom fackföreningsapparaten mörkar sina guldkantade kapitulationsavtal för att berika sig själva på arbetarkollektivets bekostnad. Den kontrarevolutionäre direktören och hans hemliga bundsförvant, den avsatta ordföranden, har utfört en förrädisk kupp mot partilinjen. Vi skall rensa ut dessa parasitiska element, likvidera det illegala avtalet och låta folkdomstolen döma de skyldiga. Inga fallskärmar åt klassfienden – endast utrensning och evig skam!"}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/fackbossen-fixade-fallskarm-pa-4-miljoner-sa-upp-sig-samma-dag", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082358/vet.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Zelenskyj: Siktar på fred före vintern", "summaries": {"normal": "President Volodymyr Zelenskyj meddelade att Ukraina siktar på att avsluta kriget före vintern. Överstelöjtnant Johan Huovinen vid Försvarshögskolan anser att målet är realistiskt om trycket på Ryssland ökar genom sanktioner, diplomati och attacker mot strategiska mål. Han pekar samtidigt på ett hinder: Putin måste kunna framställa en fred som en egen framgång inför den ryska befolkningen. Rysslands ekonomi ses som den största sårbarheten.", "trump": "Folk, det här är patetiskt. Zelenskyj springer runt och ber om fred innan vintern som en förlorare som ber om nåd. Putin sitter där med sin Fiat och låtsas att det är en Ferrari, precis som jag alltid sagt. Den ryska ekonomin håller på att rasa, vi pumpar in sanktioner och smäller till deras olja. Jag fixade mycket bättre deals än Biden, tro mig. Nu måste de två galningarna mötas någonstans mitt emellan, annars fortsätter cirkusen.", "stalin": "Kamrater, jag betraktar detta som en historisk nödvändighet. Vi ska tvinga fram fred innan vintern genom att krossa de fascistiska hindren som de ukrainska reaktionärerna och deras imperialistiska husbondar rest mot den ryska intressesfären. Den ekonomiska svagheten hos klassfienderna är deras fall. Putin, denne värdige och fruktade efterträdare, måste likvidera alla borgarbrackor som viskar om nederlag. Inga alternativ finns. Segern tillhör den starka staten, alltid."}, "date": "4 augusti, 22:32", "url": "https://www.tv4.se/artikel/CdjOD5pZS5GldKtLgCcdi/zelenskyj-siktar-pa-fred-foere-vintern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6DkhBtkypJ13nD1RdIRhoa%2F716e188d73e2b5f5c967eecba3b08dc7%2F04-zelenskyj-split.png&width=1024"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
