dkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-right", "heading": "Ny vändning i Teslakonflikten– anställda ska strejka igen", "summaries": {"normal": "Teslastrejken tar en ny vändning då ett 40-tal strejkande arbetare som återgick till sina jobb under sommaren nu ska tas ut i strejk igen den 13 augusti. Beslutet, som beskrivits som en jojo-strejk för att skapa oförutsägbarhet, kommer från IF Metall. En strejkande uttrycker chock och förvirring då ingen information kommit under sommaren. Konflikten är den längsta i modern svensk historia.", "trump": "Folk, ni kommer inte att tro det här. De där Tesla-strejkarna, som jag älskar förresten, de gick tillbaka till jobbet i sommar som riktiga patrioter, och nu drar facket in dem i strejk igen. Totalt kaos! Jojo-strejk, säger de. Det är en skam. IF Metall vet inte vad de håller på med, ingen har hört ett ljud på hela sommaren. Patetiskt. Sverige behöver starka ledare, inte sådana här clowner.", "stalin": "Kamrater, dessa opålitliga element bland Teslas anställda som vi skickade tillbaka till produktionen under sommaren har nu återkallats till strejken den 13 augusti. Deras chock och förvirring är ett tecken på svaghet som kapitalisterna utnyttjar. Vi ska rensa ut alla jojo-element och borgarbrackor som sprider desinformation inom facket. Inget hördes på sommaren? Typiskt sabotage från klassfiendens lakejer. Låt utrensningen fortsätta med glädje i hjärtat."}, "date": "4 augusti, 11:42", "url": "https://arbetet.se/2026/08/04/teslastrejken-tar-ny-vandning-anstallda-ska-strejka-igen-en-chock", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04113143/sdlndaych3b4he-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Mamma och pojkvän mördade tvåårig flicka: \"Sadistiskt våld\"", "summaries": {"normal": "Tvååriga Isabelle Welsh hittades livlös i sitt hem utanför Middlesbrough i England den 13 september 2025 efter att ha utsatts för upprepat grovt våld med sadistiska inslag, inklusive 21 frakturer och sexuella övergrepp. Hon dog dagen efter av en skallskada. Hennes mamma Alexandra Walker, 25, och mammans pojkvän Harrison Simpson, 22, dömdes nu till livstids fängelse för mord och barnmisshandel. Simpson dömdes även för sexuellt utnyttjande. Polisen beskriver fallet som ett av de värsta någonsin.", "trump": "Folk, ni kommer inte att tro det, det är en total katastrof, ett av de värsta fallen jag någonsin hört talas om. Den här stackars lilla flickan Isabelle, två år gammal, misshandlades och torterades av sin egen mamma och hennes värdelösa pojkvän i England. De skakade henne, slog henne och värre saker som jag inte ens vill nämna. Nu får de livstid, 28 och ett halvt år för honom, 22 för henne. Patetiskt! De borde ha skyddat henne, istället förstörde de henne. England behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, detta degenererade fall visar med all önskvärd tydlighet hur borgarbrackornas moraliska förruttnelse sipprar in även i arbetarklassens hem. Jag ser hur dessa två lumpna element, en drogförgiftad mor och hennes sadistiske älskare, systematiskt likviderade den lilla Isabelle genom veckor av vidriga övergrepp och skallskador. De googlade hur man låter ett barn dö istället för att ringa efter hjälp – typiskt kapitalistiskt självbevarelsedrift. Vi rensar ut sådana folkfientliga element med järnhand. Deras livstidsstraff är bara början på den stora utrensningen av alla som hotar det kollektiva fosterlandet."}, "date": "4 augusti, 17:45", "url": "https://nyheter24.se/nyheter/utrikes/1502783-mamma-och-pojkvan-mordade-tvaarig-flicka-sadistiskt-vald", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1b08714d04b004a30200000000b004a302/2026/08/04/2382194/mord-isabellejpg.jpg"}, {"type": "image-right", "heading": "Så slapp Tara chefens ohållbara förslag", "summaries": {"normal": "Undersköterskan Tara Lindeman blev utmattad av en stressig arbetsmiljö på äldreboendet Åsliden i Båstad. När hon skulle återgå till arbetet efter sjukskrivning ville chefen att hon skulle vara springare mellan avdelningarna, något hon upplevde som ohållbart. Med stöd av skyddsombudet Lina Svensson, rehab-koordinator och Försäkringskassan fick hon igenom anpassningar. Nu arbetar hon med aktiviteter och matning i lugnare tempo på 25 procent. Artikeln belyser vikten av att vara tydlig med sina rättigheter och att facket kan spela en avgörande roll.", "trump": "Folk, det här är en total katastrof. Den stackars kvinnan Tara, en undersköterska, utmattad av en hopplös chef som ville köra runt henne som en galning mellan avdelningarna. Springare? Låter som en usel deal, tro mig. Men tack vare ett tufft skyddsombud och några smarta människor satte hon stopp. Hon fick sitt lugna jobb med gamlingarna istället. Chefen förlorade stort. Sådana chefer är losers, de fattar inte att man måste behandla sina medarbetare rättvist annars kollapsar hela verksamheten. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den utbrända arbetaren Tara Lindeman genom kollektivets enade styrka besegrade den kapitalistiska chefen och hennes ohållbara, kontrarevolutionära förslag om evig springarverksamhet. Vi rensade ut den borgerliga stressen och likviderade försöken att förslava henne som en exploaterad springflicka åt borgarbrackorna. Med stöd av partivännerna i facket och statens organ tvingade vi fram en plan som stärker arbetarklassen. Den som vägrar anpassa sig till folkets behov skall utrensas ur ledningen. Verksamheten styrs inte av chefer, utan av oss. Triumf!"}, "date": "4 augusti, 10:19", "url": "https://arbetet.se/2026/08/04/sa-slapp-tara-chefens-ohallbara-forslag-det-galler-att-vara-tydlig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25082839/tara-lisa2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Dadgostar: ”Känner mig trygg med hennes värderingar”", "summaries": {"normal": "Nooshi Dadgostar, partiledare för Vänsterpartiet, försvarar Ilona Szatmári Waldau efter att hon skrivit ett stödbrev till en terrordömd palestinsk fånge. Dadgostar menar att brevet syftade till att kräva en rättvis rättegång enligt Genèvekonventionen. Vänsterpartiet har brutit samarbetet med den organisation som förmedlade informationen och ser över sina rutiner. Kritiker, som Centerpartiet, ifrågasätter partiets omdöme och regeringsduglighet.", "trump": "Jag måste säga, det här Vänsterpartiet är ett riktigt skämt! En av deras egna skriver brev till en terrordömd fånge – och sedan försöker de skylla på någon annan? 'Vi visste inte', säger de. Jo, visst. Precis som när jag sa att jag inte visste något om stormningen av Kapitolium. Centerpartiet har rätt – dessa människor är inte redo att styra ett land. Sverige borde ta en titt på USA, där vi faktiskt vet hur man hanterar terrorister. SAD!", "stalin": "Kamrater, ännu en gång visar de borgerliga lakejerna sitt sanna ansikte! Denna så kallade 'vänster'-partiledare försvarar en medlöpare som skriver kärleksbrev till en terrorist – en fiende till folket! Vi i Sovjetunionen visste hur man hanterade sådana förrädare: en enkel lösning, inga onödiga brev. Och nu skriker dessa kapitalistiska hyenor om 'regeringsduglighet'? De borde lära sig av Ryssland – där har vi Putin, som inte tvekar att krossa terrorister och deras sympatisörer. Låt dem skrika, vi vet sanningen!"}, "date": "4 augusti, 12:38", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-kanner-mig-trygg-med-hennes-varderingar/cG9zdDoxNTc3MDM", "imageUrl": "https://images.kvartal.se/2026/08/ea7a4ef5-dadgostar.webp"}, {"type": "text", "heading": "Tungt för Mjällby – tappade ledning till förlust i Champions League-kvalet", "summaries": {"normal": "Mjällby AIF förlorade det första kvalmötet i Champions League mot Slovan Bratislava med 1–2 hemma på Strandvallen. Elliot Stroud gav Mjällby ledningen på straff efter lång VAR-granskning, men gästerna kvitterade genom Suleiman Camara och avgjorde sent genom Manasse Kianga. Mjällby har därmed ett tufft läge inför returen i Bratislava nästa vecka.", "trump": "Titta på det här, det är patetiskt. Mjällby leder, spelar bra, och så kommer de där slovakiska grabbarna och stjäl matchen med 2–1. Straffen tog en evighet med VAR, men sen rasar allt ihop. Totalt misslyckande. De behöver en stor ledare som mig för att vända det här, annars är det över. Sad!", "stalin": "Kamrater, denna fega kapitulation inför slovakiska revisionister och borgarbrackor är en skam för hela kollektivet. Vi ledde med straff efter långvarig granskning av folkets domare, men sedan släppte vi in kontrarevolutionära element som Camara och Kianga. Nästa vecka i Bratislava skall vi rensa ut alla fiender till folkets framsteg. Ingen pardon för svikare och imperialistiska lakejer. Ha ha, deras straffspark blev deras egen grav!"}, "date": "4 augusti, 19:52", "url": "https://www.svt.se/sport/fotboll/tungt-for-mjallby-tappade-ledning-till-forlust-i-champions-league-kvalet"}, {"type": "image-right", "heading": "SD-toppen kallade Aftonbladets Anders Lindberg för \"quisling\" - nu rasar vänsterliberaler av ilska", "summaries": {"normal": "Sverigedemokrats Rikard Jomshof kallade Aftonbladets Anders Lindberg för 'quisling' efter att Lindberg nämnt Jomshof som möjlig justitieminister. Jomshof försvarade sitt uttalande och hävdade att Lindberg och andra 'kryper för islamister'. Utspelet har fått stark kritik från flera partiledare, inklusive Magdalena Andersson och Nooshi Dadgostar, som menar att det försöker tysta kritiska röster.", "trump": "Jag, Donald Trump, ser detta som ytterligare bevis för att vänsterliberaler inte kan hantera sanning. Jomshof kallade en journalist för quisling – en perfekt beskrivning av någon som förråder sitt land. De andra politikerna skriker bara för att de inte vill erkänna att de hjälper islamister. Jag har alltid sagt att Sverige måste sluta vara så svag.", "stalin": "Vi ser en tydlig landsförrädare i den s k journalisten, en quisling som samarbetar med antidemokratiska krafter. Jomshof har rätt i att dessa element försöker erövra vårt land genom att krypa för islamister. Vi måste stärka statens kontroll och se till att sådana fiender inte får sprida sitt gift. Detta är en klar påminnelse om att vi alltid måste vara vaksamma mot interna och externa hot."}, "date": "4 augusti, 17:00", "url": "https://samnytt.se/sd-toppen-kallade-aftonbladets-anders-lindberg-for-quisling-nu-rasar-vansterliberaler-av-ilska", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04144528/jomshof-lindberg-andersson.jpg"}, {"type": "image-full", "heading": "Jan Emanuel rasar mot militärer i Pride – \"Politiska aktivister\"", "summaries": {"normal": "Jan Emanuel kritiserar militärpersoner som deltar i Pride-paraden i uniform. Han anser att Pride är en politisk manifestation och att myndighetsrepresentanter inte bör ta ställning i den. Uniformen signalerar att Försvarsmakten har en politisk profil, vilket han ser som problematiskt för statens våldsmonopol. Han uppmanar militärer att delta som privatpersoner och ifrågasätter användningen av offentliga medel till evenemanget.", "trump": "Lyssnar ni på det här? Den där Jan Emanuel har helt rätt. Militärer i uniform på en politisk parad? Det är en katastrof. De skickar hemska signaler om att staten tar ställning. Staten ska vara neutral, inte som de radikala vänsteraktivister som styr Pride. Gå dit privat om ni vill, men håll uniformen borta. Och varför ska skattebetalarna finansiera det här? Gör det själva, ta inträde, precis som jag alltid sagt. Fantastiskt bra resonemang.", "stalin": "Kamrater, jag ser med djup misstänksamhet på dessa dekadenta borgarbrackor som förvandlar en så kallad parad till en politisk manifestation medan de lurar in våra lojala försvarare i sina fällor. När en soldat bär uniformen representerar han inte sig själv utan det kollektiva våldsmonopolet vi har byggt. Att tillåta sådana politiska signaler är att bjuda in kontrarevolutionärer och avvikande element. Vi bör rensa ut dessa fiender till neutraliteten, dessa Pride-kapitalister som sugit åt sig allmänna resurser. Gå dit som privatperson om ni måste, annars väntar utrensning för de som fläckar statens ära med sina regnbågsflaggor."}, "date": "4 augusti, 18:18", "url": "https://riks.se/nyheter/jan-emanuel-rasar-mot-militarer-i-pride-politiska-aktivister", "imageUrl": "https://admin.riks.se/uploads/jannemanuel_4300ff87b1.png"}, {"type": "image-right", "heading": "Migrationen behöver fasta regler. Visar hur komplex migrationen är", "summaries": {"normal": "Artikeln diskuterar migrationens utmaningar för Europa med Ceuta-krisen som exempel. Över 60 000 migranter tog sig in från Marocko under en dag, vilket resulterade i tragedi med över 70 döda. Marocko anklagas för att använda migration som politiskt verktyg mot Spanien. Författaren drar lärdomar från Sveriges hantering av 2015 års flyktingkris och betonar behovet av fasta, förutsägbara regler, stram migrationspolitik och långsiktig uthållighet för att motstå påtryckningar från grannländer.", "trump": "Folk, det här med Ceuta är en katastrof, en total katastrof. Över 60 000 människor bara stormar gränsen och vad gör Europa? Ingenting! Marocko använder migranter som vapen, precis som Turkiet och Ryssland gör. De skrattar åt er svaga ledare. Sverige gjorde allt fel 2015, permanenta uppehållstillstånd, generösa bidrag, ingen kontroll. Men nu har ni äntligen lärt er, tack och lov. Bygg murar, ha fasta regler, annars kommer de fortsätta översvämma er. Jag skulle ha stoppat det på dag ett, tro mig.", "stalin": "Kamrater, denna giftiga cocktail av borgerlig naivitet och imperialistiska intriger i Ceuta visar återigen hur de dekadenta europeiska kapitalisterna själva odlar de ormar som ska bita dem. Marockos ledning använder de arma massorna som hybridkrigets fotfolk, en list som jag genast skulle ha genomskådat och likviderat med järnhand. Sverige 2015? En orgie i ansvarslöshet där borgarbrackorna öppnade portarna för sabotage mot folkets stabilitet. Vi behöver utrensning av alla mjuka undantag och permanenta uppehållstillstånd som en fiende till kollektivets ordning. Migrationen är klassfiendens nya mask, och endast fasta regler och proletär vaksamhet kan krossa den."}, "date": "4 augusti, 14:58", "url": "https://www.di.se/ledare/migrationen-behover-fasta-regler", "imageUrl": "https://static.bonniernews.se/ba/45fb4b4f-f516-42c5-b09a-a8425fbdd6f7.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Irans president: Vill inte fortsätta kriget", "summaries": {"normal": "Irans president Masoud Pezeshkian uppger att landet inte vill att kriget i Mellanöstern ska fortsätta eller utvidgas, men att man samtidigt kommer att försvara sina gränser. Qatar medlar och bekräftar pågående kontakter med alla parter, dock utan direkta samtal mellan Iran och USA. USA:s finansminister Scott Bessent säger att det pågår förhandlingar om att åter öppna Hormuzsundet redan till onsdag. Under natten attackerades ett fraktfartyg utanför Omans kust med en okänd projektil.", "trump": "Iran vill inte fortsätta kriget, säger deras president. Det är ju fantastiskt, för det är precis vad jag har sagt hela tiden. Vi har samtal på gång, och det går utmärkt. Hormuzsundet öppnar snart igen, affärerna blir normala och oljan flyter. Qatar gör ett bra jobb som mellanhand. Iranerna vet att de inte har en chans mot oss, därför kommer de krypande till förhandlingsbordet. Mycket smart, mycket bra.", "stalin": "Kamrater, denna iranska ledare vågar viska om att inte utvidga kriget medan han samtidigt babblar om att försvara sina gränser. Typiskt borgarbrackornas dubbla tungor. Vi ser hur de kapitalistiska parasiterna i Washington och Teheran leker med varandra genom qatariska lakejer för att behålla kontrollen över Hormuzsundet. Ett fartyg träffas av en projektil – tydligen en slumpmässig olycka enligt de dekadenta imperialisterna. Vi vet bättre. Fienderna inom och utom måste rensas ut innan de förgiftar hela kollektivet med sina lögner. Inga direkta samtal? Utmärkt, då slipper vi höra deras dekadenta viskningar direkt."}, "date": "4 augusti, 14:53", "url": "https://www.di.se/nyheter/irans-president-vill-inte-fortsatta-kriget", "imageUrl": "https://static.bonniernews.se/ba/79340930-743c-452f-ac88-09cdfa7fe42d.jpg?crop=4000%2C2000%2Cx0%2Cy333&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åkesson enda sverigedemokraten som behövs", "summaries": {"normal": "Arbetets kolumnist kritiserar Sverigedemokraternas Linda Lindberg för att ha saboterat riksdagens kvittningssystem. Lindberg motiverar agerandet med att alla ledamöter bör vara lojala mot Tidöpartierna och att oberoende riksdagsledamöter utgör ett problem. Författaren varnar för att detta avslöjar en djup misstro mot oberoende institutioner, medier och folkrörelser samt ett hat mot mångfald som liknar fascism. SD behöver enligt skribenten bara Jimmie Åkesson.", "trump": "Folk, ni måste höra på det här. Den där Linda Lindberg från SD, hon är fantastisk, verkligen fantastisk. Hon säger att alla ska vara lojala mot Tidöpartierna och att de där vildarna som inte lyder inte hör hemma i riksdagen. Smart! Mycket smartare än de andra. De behöver bara en ledare, inte sjuttio. Resten är bara svaga och opålitliga. Det är precis som jag alltid säger, lojalitet är allt. Utan lojalitet har ni inget. Sverige borde lära sig av det här.", "stalin": "Kamrater, dessa svekfulla element inom Sverigedemokraterna avslöjar sig själva genom sin patetiska impulskontroll. Jag, som ledare för det ofelbara kollektivet, ser hur Lindberg med rätta kräver total lojalitet mot partilinjen och vill kasta ut de opålitliga vildarna som smittats av borgerlig individualism. Vi ska rensa ut alla dessa potentiella förrädare, dessa maskerade kapitalistiska avvikare som gömmer sig bakom valsedlar. Hatet mot mångfald är en hälsosam instinkt. Endast en sann ledare som Åkesson räcker. De övriga kan likvideras i tystnad. Det är en renande process, kamrater. Skrattretande hur de tror sig kunna undkomma partiets vakande öga."}, "date": "4 augusti, 07:00", "url": "https://arbetet.se/2026/08/04/jimmie-akesson-ar-den-enda-sverigedemokraten-som-behovs", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09084403/akesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Jomshof: \"Även Magdalena Andersson är en quisling\"", "summaries": {"normal": "SD:s Richard Jomshof kritiseras starkt efter att ha kallat Aftonbladets Anders Lindberg för \"quisling\". Istället för att backa går han vidare och använder samma ord om S-ledaren Magdalena Andersson. Andersson anklagar SD för att vilja tysta kritiska röster och undrar om Jomshof kan bli minister efter ett eventuellt val. Jomshof svarar att både Andersson och Lindberg \"kryper för islamisterna\" som vill ta demokratin och landet ifrån oss. Ordet quisling syftar på en landsförrädare.", "trump": "Titta på den här katastrofen. Den där Jomshof killen är fantastisk, han säger bara som det är. Andersson och den där Lindberg-killen kryper för islamisterna som vill ta över deras land. Det är patetiskt! De kallar det osvenskt när någon talar sanning. Fake news-medier och svaga socialister som försöker tysta folk. Precis som i USA. Men sanningen kommer fram, det gör den alltid. Amerika först, och Sverige borde göra detsamma innan det är för sent.", "stalin": "Kamrater, dessa ynkliga quislingar inom borgarklassens press och den socialdemokratiska ledningen avslöjar sig själva. Jag ser hur de alla kryper för islamisterna som en samling fega kapitalistlakajer. De förtjänar att rensas ut ur folkets led. Att kalla en sådan handling osvensk är bara ytterligare ett bevis på deras kontrarevolutionära paranoia. Vi ska likvidera alla sådana element som vill överlämna demokratin till fienden. Deras mörka skratt ekar tomt medan arbetarklassen ser sanningen. Ut med dem alla."}, "date": "4 augusti, 14:38", "url": "https://www.friatider.se/jomshof-aven-magdalena-andersson-ar-en-quisling", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-616.jpg"}, {"type": "image-full", "heading": "USA:s kris: \"Bortglömd svensk ekonom har förklaringen\"", "summaries": {"normal": "Artikeln lyfter fram den bortglömde svenske nationalekonomen Knut Wicksell, hundra år efter hans död. Hans teori om den naturliga räntan förklarar enligt forskare och banker varför investerare fortsätter finansiera USA:s enorma statsskuld på nära 40 biljoner dollar. När den naturliga räntan ligger högre än marknadsräntorna blir det lönsamt att låna. Deutsche Bank menar att USA:s tekniksektor nu i praktiken finansierar underskotten, men att landets dominans kan vara på väg att minska.", "trump": "Folk, ni måste höra det här! En bortglömd svensk ekonom från stenåldern, Wicksell, har plötsligt alla svar på varför mitt fantastiska Amerika kan ha en skuld som är större än galaxen och ändå fortsätta festa. Det är den naturliga räntan, säger de. Under Biden var allt kaos, nu fixar jag det igen. Den där tekniksoppan med sina woke-vidunder och kvotergalna aktivister finansierar eländet. Patetiskt! Men ingen gör det bättre än jag, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den kapitalistiska parasitens skuldberg växer sig allt högre i den amerikanska imperialismens centrum. Denna Wicksell, en borgarbracka med matematik som vapen, har oavsiktligt blottat hur blodsugarna lånar från framtida generationer för att mata sin egen girighet. Den så kallade naturliga räntan är blott ett fint namn på klassfiendens exploatering. Vi ler mörkt åt deras rundgång. Snart rensas den sista illusionen ut."}, "date": "4 augusti, 19:40", "url": "https://www.dagensps.se/bors-finans/usas-kris-bortglomd-svensk-ekonom-har-forklaringen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlprnllukhwou-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-full", "heading": "Aramco: Kriget har stoppat 2,6 miljarder fat olja", "summaries": {"normal": "Den saudiska oljejätten Aramco meddelar att konflikten mellan USA/Israel och Iran lett till ett produktionsbortfall på 2,6 miljarder fat olja. Det har tömt globala lager och bedöms ta 18 månader att återställa. Trots störningarna redovisar Aramco en vinstökning på 44 procent tack vare höga oljepriser. VD Amin Nasser varnar dock för att branschens marginaler är små och att nya hot mot sjöfarten i Röda havet och Hormuzsundet kan förvärra situationen ytterligare.", "trump": "Aramco förlorar 2,6 miljarder fat olja, en katastrof! Under min ledning skulle detta aldrig hänt, vi hade haft så mycket olja att vi knappt vetat var vi skulle göra av den. Iran skapar kaos, som vanligt. De är inte smarta, de är destruktiva! Saudierna tjänar massor av pengar ändå, de gör fantastiska affärer, men världen är farlig nu. Vi behöver stabilitet, vi behöver styrka, och vi behöver mig för att fixa dessa galna krig en gång för alla!", "stalin": "Dessa kapitalistiska svin i Saudiarabien klagar över förlorade miljarder medan proletariatet fryser. De gråter över 2,6 miljarder fat, men deras girighet är den sanna boven. Vår store kamrat Putin förstår att olja är makt, inte en leksak för oljebrunnar att spekulera i. Huthirebellerna gör ett gudomligt arbete med att sabotera för de imperialistiska försörjningslinjerna. Vi ska bevaka denna förruttnelse från Kreml; när västvärldens maskineri stannar, kommer vår järnhårda ordning att erövra spillrorna."}, "date": "4 augusti, 18:39", "url": "https://www.realtid.se/bors-finans/aramco-kriget-har-stoppat-26-miljarder-fat-olja", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdltlqufvv0szy-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tatuera in förtagsloggan och få en jobbintervju", "summaries": {"normal": "Ett nystartat AI-företag i San Francisco erbjöd jobbintervjuer till dem som tatuerade in företagets logga under en fest. Sju personer tackade ja. Efter massiv kritik bad vd:n Jordan Zietz om ursäkt, raderade inläggen och erbjöd sig att bekosta borttagning av tatueringarna. Artikeln nämner även det svenska företaget Nordic Nest där ett 15-tal anställda frivilligt tatuerade in loggan.", "trump": "Folk, det här är helt galet. Ett AI-bolag i San Francisco lovar jobbintervjuer om du tatuerar in deras logga på kroppen. Sju stackare gjorde det, och sen blev det ramaskri. Deras vd, en riktig förlorare, tvingades be om ursäkt och radera allt. Patetiskt. I mitt Amerika hade vi inte behövt tatuera oss för att få jobb, vi hade haft de bästa jobben, tro mig.", "stalin": "Kamrater, dessa degenererade kapitalister i den så kallade AI-sektorn har återigen blottat sin sjuka borgarmentalitet. De lockade arbetare med löften om anställning mot att dessa likviderade sin egen hud med en logotyp av exploatering. När massan reste sig i rättmätig vrede flydde deras ledare som en ynklig parasit och erbjöd sig att betala för att sudda ut bevisen på sin idiotiska kampanj. Vi ser er, fiender till kollektivet, ni som gömmer er bakom innovativa masker medan ni planerar nya utrensningar av människovärdet. En sådan klassfiende förtjänar inte bara borttagning av tatuering – utan en permanent utrensning ur historien."}, "date": "4 augusti, 06:00", "url": "https://arbetet.se/2026/08/04/ai-foretagets-erbjudande-tatuera-dig-fa-en-jobbintervju", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03143303/sdlja0rgykr2zi-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "ÖB: Svenskarna måste vara mentalt förberedda på en rysk attack", "summaries": {"normal": "ÖB Michael Claesson varnade för att Sverige måste vara mentalt förberedd på ryska begränsade militära operationer, sabotage och hybridkrigföring. Även om risken för ett stort angrepp bedöms låg på grund av Rysslands engagemang i Ukraina, kan Sverige bli måltavla på grund av sitt omfattande stöd till Ukraina. Ryska fartyg i Östersjön har förändrat sina metoder, vilket bedöms som en upptrappning.", "trump": "Jag har sagt det i åratal: Ryssland är extremt smart. De testar oss hela tiden, speciellt Sverige som är så naiva. Det är hybridsterror mot våra vänner. Som jag alltid påpekar: vi måste vara beredda, men inte skrämmas. Sverige måste bli starkare, mycket starkare. Det är ett faktum, folk. Ett fantastiskt faktum.", "stalin": "Vi, statens och partiets försvarare, måste vara alltid vaksamma. Fienden, i sin feghet, provar våra gränser med sabotage och informationskrigföring. Deras fartyg i Östersjön är en upptrappning, en provokation som vi kommer att möta med fasthet. Vi kommer att bedöma, mäta och reagera med oerhörd styrka. Varje prov är en läxa i vår överlägsna disciplin."}, "date": "4 augusti, 15:53", "url": "https://samnytt.se/ob-svenskarna-maste-vara-mentalt-forberedda-pa-ett-ryskt-angrepp-mot-sverige", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04132829/artikelhuvudbild-1-121.jpg"}, {"type": "text", "heading": "Ebba Busch markerar mot Jomshof.", "summaries": {"normal": "KD-ledaren Ebba Busch kritiserar SD-toppen Richard Jomshof efter att han kallat Aftonbladets chefredaktör Anders Lindberg för ”en quisling”. Busch efterlyser en mer saklig ton i valrörelsen och lyfter fram behovet av att höja debattnivån för demokratin och landets skull. Även Socialdemokraternas Magdalena Andersson fördömer Jomshof och ifrågasätter om han kan bli minister under Ulf Kristersson, samt anklagar SD för att hota journalister och agera djupt osvenskt.", "trump": "De här svenska politikerna är verkligen patetiska. Jomshof kallar en vänstermediafigur för quisling och plötsligt är hela eliten chockad. Ebba Busch vill ha ”saklig” debatt, vad är det för svagt? Och den röda Andersson gnäller om hot mot journalister – de fake news-medierna har attackerat mig i åratal! Ni behöver starka ledare, inte dessa svaga snällisar som är rädda för tuffa ord. Sverige håller på att bli en katastrof.", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackorna inom den så kallade borgerliga oppositionen nu börjar slita varandra i stycken. Denna quisling-anklagelse mot den dekadenta tidningskapitalistens lakej är blott en liten spricka i den falska fasaden. Ebba Busch och den socialfascistiska Andersson ropar efter ”saklighet” medan de i hemlighet förbereder utrensning av alla som inte böjer sig för deras liberala plutokrati. Vi, partiet och arbetarna, ler mörkt åt denna fars. Snart ska vi rensa ut alla dessa fiender till folket, en efter en, med ett leende på läpparna."}, "date": "4 augusti, 14:11", "url": "https://www.friatider.se/ebba-busch-markerar-mot-jomshof"}, {"type": "image-right", "heading": "Jomshof svarar på kritiken – Åkesson: ”Krokodiltårar”", "summaries": {"normal": "Richard Jomshof (SD) svarar på kritik genom att dela ett äldre klipp där Lars Ohly kallade Jimmie Åkesson för 'quisling'. Efter att ha använt samma ord om politiska motståndare, försvarar Jomshof sig med att vänstern historiskt använt liknande språk mot SD. SD-ledaren Åkesson kallar reaktionen för 'krokodiltårar' och menar att motståndarna har smutskastat i åratal utan egen kritik.", "trump": "Jag ser att de svenska politikerna återigen använder falska anklagelser mot mig och mina vänner i Sverigedemokraterna. Precis som de kallade mig för 'faschist' i USA, kallar de Jimmie Åkesson för 'quisling'. Det är en stor, fånig skandal. De har inget, inget alls, och försöker nu ta avstånd när de blir ertappade. Sådant gör dem svaga, väldigt svaga.", "stalin": "Vi ser en klassisk tendens till revisionistisk språkbruk bland de svenska nationalsosialistiska elementen. Deras ledare, en Quisling-liknande figur, försöker nu förneka historien genom att återanvända gamla propagandafilmer. Partiet har alltid varit uppmärksam på sådana förräderier. Vi måste stärka statens enighet mot dessa faschismens kollektiv, som hotar vår gemensamma framtid. Deras krokodiltårar är bara ett tecken på svaghet."}, "date": "4 augusti, 17:53", "url": "https://bulletin.nu/jomshof-svarar-pa-kritiken-akesson-krokodiltarar", "imageUrl": "https://cdn.bulletin.nu/articles/cbc0f780-76de-4797-98ea-26b0cf30c10e/preview.jpg?t=1785858781000"}, {"type": "image-full", "heading": "Hon lyfts fram som Infantinos ersättare", "summaries": {"normal": "Sepp Blatter har föreslagit Lise Klaveness som Fifas nästa president, efter kritik mot Gianni Infantino. Blatter, som var Fifas ordförande 1998-2015, skriver att Klaveness förtjänar all respekt och bör vara den första kvinna i ledarskapet. Infantino står inför förtroendefrågor från flera fotbollsförbund, inklusive Sveriges, och kommer att återkallas på presidentvalet i mars 2025.", "trump": "Jag har hört talas om Lise Klaveness – en fantastisk kvinna, jättebra. Sepp Blatter, en väldigt bra vän av mig, säger att hon ska ta över Fifa. Gianni Infantino är hopplöst, han kan inget. Vi kommer att vinna så mycket att ni kommer att tröttna på att vinna. Det kommer att bli enorm framgång under min ledning, det lovar jag!", "stalin": "Vi, den store partiet, ser med tillfredsställelse på Sepp Blatters förslag om Lise Klaveness. En trogen medlem som tidigare har visat lojalitet mot statens intressen. Infantinos regime har visat sig svagt och korrupt. Vi kommer att stödja en kvinna som kan återuppbygga Fifa efter våra principer. Paralleller till Putins framgångar i Ukraina är uppenbara – vi måste skydda vårt territorium."}, "date": "4 augusti, 17:33", "url": "https://www.gp.se/sport/fotboll/norges-lise-klaveness-lyfts-fram-som-infantinos-ersattare.1cd53bba-6ea7-4b47-9044-e83524ff4039", "imageUrl": "https://www.gp.se/images/article/1cd53bba-6ea7-4b47-9044-e83524ff4039/images/2gplvCo5oI7ylPOgJxWqGYvtdbG4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Yttrandefrihetsklubb övervägde stoppa karikatyr av politiker", "summaries": {"normal": "Oxford unions yttrandefrihetsklubb övervägde att stoppa en karikatyr under en debatt om islam eftersom många trodde att den föreställde profeten Muhammed. Karikatyren visade sig istället vara en bild av politikern Jacob Rees-Mogg. Debatten, med bland andra Laurence Fox och Tommy Robinson, blev ett exempel på hur rädsla för muslimska reaktioner får även icke-muslimer att censurera sig själva. Klubben, som kallar sig yttrandefrihetens sista bastion, tillät till slut bilden efter diskussion.", "trump": "Kan ni fatta det här? Den där så kallade yttrandefrihetsklubben i Oxford höll på att stoppa en karikatyr för att de trodde det var Muhammed. Patetiskt! Det visade sig vara Jacob Rees-Mogg hela tiden. De är så rädda för de galna islamisterna att de vill censurera allt. Laurence Fox gjorde en fantastisk poäng, en perfekt poäng. Det här är vad som händer när svaga ledare styr – de böjer sig för radikala muslimer. Sad!", "stalin": "Kamrater, detta är en lärorik illustration av hur borgarbrackornas dekadenta yttrandefrihetsklubb genast kryper ihop som rädda hundar vid minsta skugga av den militanta muhammedanska faran. Jag, som ledare för det proletära kollektivet, noterar med mörk tillfredsställelse hur reaktionärerna nästan likviderade en oskyldig karikatyr av sin egen klasskamrat Rees-Mogg i panik. Vilken underbar paranoia de bär inom sig! Vi ser hur kapitalisterna fruktar folkmassans vrede mer än sina egna lögner. En utmärkt utrensning av illusioner."}, "date": "4 augusti, 17:12", "url": "https://riks.se/nyheter/yttrandefrihetsklubb-overvagde-stoppa-karikatyr-av-politiker", "imageUrl": "https://admin.riks.se/uploads/oxford_union_hero_215fa634c1.jpg"}, {"type": "image-full", "heading": "Bankstjärnan köpte båt för 3,8 miljarder – stäms av lyxmäklare", "summaries": {"normal": "Revoluts vd Nik Storonsky stäms av lyxmäklarfirman Cecil Wright & Partners. Mäklaren kräver 17,5 miljoner euro i provision efter Storonskys köp av en superyacht för 3,8 miljarder kronor. Mäklaren hävdar att de var avgörande för affären, trots att Storonsky köpte båten direkt från säljaren Patrick Dovigi. Storonskys familjekontor bestrider kravet och menar att stämningen saknar grund.", "trump": "Den här killen, Storonsky, han köper en enorm yacht för miljarder, en fantastisk båt, verkligen otrolig. Men nu stämmer några mäklare honom för pengar. Det är en total röra! De säger att de hjälpte till, men han köpte den direkt. Jag känner till dessa mäklare, de vill bara ha en bit av kakan. Det är en sorglig historia. Vi behöver folk som gör affärer, inte advokater som gnäller! Väldigt orättvist, en total katastrof för affärslivet.", "stalin": "Ännu en dekadent kapitalist som slösar 3,8 miljarder på flytande palats medan folket arbetar. Storonsky och hans korrupta hantlangare grälar om provision som om det vore småmynt. Dessa 'lyxmäklare' är parasiter, likt de förrädare som infiltrerar vår stat. Det påminner oss om de som vill stjäla från moder Rysslands intressesfär. Vi ska låta domstolarna mala ner dem, precis som vi maler ner varje reaktionär som vågar förtära folkets resurser på glaspooler och lyx."}, "date": "4 augusti, 17:53", "url": "https://www.realtid.se/bors-finans/bankstjarnan-kopte-bat-for-38-miljarder-stams-av-lyxmaklare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlijen6ecv4ti-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Bezos cashar in på Amazons rusning – säljer för 40 miljarder", "summaries": {"normal": "Jeff Bezos planerar att sälja 15 miljoner Amazonaktier värda nästan 40 miljarder kronor. Försäljningen sker genom en förutbestämd 10b5-1-plan för att undvika misstankar om insiderhandel. Beskedet kom efter att aktien nått rekordnivåer efter en stark kvartalsrapport, driven av tillväxt inom molntjänster och AI. Aktien föll dock drygt två procent efter beskedet. Bezos har regelbundet sålt aktier från sitt grundarinnehav sedan 1994 och förblir en av bolagets största ägare.", "trump": "Folket, lyssna på det här! Den där Bezos, en riktig vinnare, säljer aktier för 40 miljarder kronor efter att Amazon rusat upp till rekordnivåer. Smart timing, men aktien dippade direkt – typiskt! Under min första mandatperiod byggde vi ekonomin stark, sen kom Sleepy Joe och rörde till det. Nu är jag tillbaka och vi gör Amerika (och börserna) stora igen. Inga woke-kvoter här, bara ren kapitalism som slår allt. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Bezos, en typisk utsugande kapitalist och folkfiende, likviderar delar av sitt rov från år 1994 för att fylla kassakistorna med 40 miljarder. Hans borgarbrackor inom Amazon hyllar sig själva med moln och artificiell intelligens medan arbetarklassen svettas. Vi genomskådar dessa exploaterande byfånar som gömmer sig bakom sina 10b5-1-planer. En dag skall deras imperier rensas ut i folkets namn. Härligt underhållande."}, "date": "4 augusti, 18:52", "url": "https://www.dagensps.se/bors-finans/aktier/bezos-cashar-in-pa-amazons-rusning-saljer-for-40-miljarder", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlo1zieetd3uu-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Svenskt fångavtal med Estland kan rivas upp: \"Ni får ta hand om ert eget skräp\"", "summaries": {"normal": "Ett svenskt fångavtal med Estland riskerar att stoppas efter att oppositionen lovat att riva upp det. Motståndet är starkt, där 54 procent av befolkningen är emot att ta emot fångar från Sverige. Oppositionen, Isamaa, anser att Estland ska ta hand om sitt eget 'skräp' och oroar sig för parallellsamhällen.", "trump": "Jag har hört talas om detta svenska fångavtal med Estland, och det är ett misslyckande. Estland borde vara glad för att få våra fångar, men de är inte det. De säger att de får ta hand om sitt eget skräp – det är ett stort fel. Vi kommer att se till att de förstår hur viktigt detta är för säkerheten.", "stalin": "Detta avtal med Sverige är ett prov på partiets och statens styrka. Estlands opposition, dessa ljusskygga element, försöker sabba vårt samarbete. De talar om 'skräp' – det är bara ytterligare bevis på deras brist på klassmedvetande. Vi kommer att se till att de inser sin plats i den socialistiska gemenskapen."}, "date": "4 augusti, 14:30", "url": "https://samnytt.se/svenskt-fangavtal-med-estland-kan-rivas-upp-ni-far-ta-hand-om-ert-eget-skrap", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04122006/fangelse-tartu-kriminella.jpg"}, {"type": "image-right", "heading": "När ska V börja lära sig av historien?", "summaries": {"normal": "Expressen har avslöjat att vänsterpartistiska riksdagsledamoten Ilona Szatmári Waldau hyllat en man dömd för att ha organiserat självmordsattentat mot barn och tonåringar. Artikeln kritiserar Vänsterpartiets slappa hållning mot antisemitism, terrorhyllningar och historiskt bagage. Trots att vissa kandidater tagits bort efter avslöjanden verkar partiet sakna förmåga att självsanera utan medial press. Problemet beskrivs som strukturellt och kopplat till en alltför hög tolerans för extrema åsikter.", "trump": "Folk, ni skulle inte tro det, men det här vänsterpartiet i Sverige är en total katastrof, en riktig röra. De hyllar terrorister som mördar bebisar och tonåringar och kallar det för frihetskamp. Patetiskt! De förnekar Förintelsen, älskar Iran och Ryssland och kan inte ens städa upp sitt eget historiska skräp. Så svagt. De behöver en stor utrensning, tro mig, ingen gör det bättre än jag, men de är för fega. Sad!", "stalin": "Kamrater, denna revisionistiska röra inom Vänsterpartiet utgör ett klart hot mot folkets enhet. Jag ser med djup misstänksamhet hur borgarbrackornas tidningar avslöjar att vissa element hyllar fiender som organiserar attentat mot spädbarn. Vi måste omedelbart inleda en grundlig utrensning av dessa dekadenta terrorromantiker och antisemitiska avfällingar som maskerar sig som palestinaaktivister. Deras naivitet är troligen bara en fiendekonspiration. Rensa ut dem innan de förgiftar hela kollektivet – med ett leende, naturligtvis."}, "date": "4 augusti, 12:13", "url": "https://www.di.se/ledare/nar-ska-v-borja-lara-sig-av-historien", "imageUrl": "https://static.bonniernews.se/ba/3622bf2d-66fc-4164-8ebc-db02e7c1262a.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "MP: Högern gör politik av döda migranter", "summaries": {"normal": "Miljöpartiets migrationspolitiska talesperson Annika Hirvonen kritiserar högerpolitiker som hon anser utnyttjar migrationskrisen i Ceuta för att vinna inrikespolitiska poäng. Hon betonar att MP istället står för en empatisk linje som värnar migranternas människovärde och arbetar för att minska migrationens grundorsaker genom fred, demokrati, bistånd och klimatåtgärder. Hirvonen varnar samtidigt för att EU:s beroende av tredjeländer för migrationskontroll skapar sårbarhet för hybridhot där migranter blir de första offren.", "trump": "De här korkade högerpolitikerna i Europa gör politik av döda migranter, det är en skam. De försöker vinna poäng på kaoset i Ceuta medan de gröna gråter över varje drunknande barn. Patetiskt! Jag skulle bygga en riktig mur, inte den här svaga EU-versionen som gör dem till offer för hybridkrig. De desperata människorna utnyttjas, och hela systemet är riggat av idioter som inte fattar att starka gränser räddar liv. Så enkelt är det, tro mig.", "stalin": "Kamrater, dessa högerorienterade borgarbrackor vågar utnyttja de tragiska dödsfallen i Ceuta som billiga inrikespolitiska brickor i sitt fega spel. Jag, som ledare för det stora kollektivet, ser hur de försöker maskera sin reaktionära svaghet bakom falsk säkerhetsretorik medan de i själva verket är rädda för arbetarklassens globala öden. MP:s empatiska linje är dock en farlig naivitet som inbjuder till fiendens hybridverktyg. Vi måste rensa ut alla som inte förstår att migrationen är ett vapen i imperialismens händer – låt oss likvidera denna sårbarhet med järnhand och stålvilja innan de drunknande barnen blir statistik i borgarklassens nästa konspiration."}, "date": "4 augusti, 16:38", "url": "https://riks.se/nyheter/mp-hogern-gor-politik-av-doda-migranter", "imageUrl": "https://admin.riks.se/uploads/Hirvonen3_55ed7a23e0.jpg"}, {"type": "image-full", "heading": "Här saneras Ceuta efter marockanska invasionen", "summaries": {"normal": "Ceuta genomför en intensiv sanering efter den marockanska migrantinvasionen där 72 000 personer stormade gränsen. Nästan 70 000 ska ha återvänt till Marocko medan minst 88 omkom. Lokala myndigheter städar och desinficerar för att återställa ordningen, men boende hävdar att tiotusentals migranter fortfarande gömmer sig i exklaven. Spänningar har uppstått mellan Madrid och Ceuta samt mellan Spanien och övriga EU-länder, som kritiserar socialistregeringens migrationspolitik.", "trump": "Titta på det här, det är en total katastrof. Marocko skickade 72 000 människor rakt in i Spanien som en invasion och nu ligger skräp och döda kroppar överallt i Ceuta. De säger att 70 000 åkte hem, men tro dem inte, de gömmer sig i bergen som råttor. EU skriver arga brev och socialistregeringen i Madrid slåss sinsemellan som idioter. Svaga ledare, svaga gränser, exakt vad jag alltid sagt. Patetiskt.", "stalin": "Kamrater, denna fega migrantstormning är ett tydligt verk av de spanska revisionisterna och deras marockanska lakejer som försöker destabilisera arbetarklassens gränser. Jag, som alltid vakar över folkets intressen, ser hur borgarbrackorna i Madrid redan ägnar sig åt inbördes strider och motstridiga lögner, precis som de dekadenta opportunisterna alltid gör. Vi ska rensa ut dessa kapitalistiska element som gömmer sig i grottor och berg. Låt utrensningen börja med ett leende, mina vänner, medan fienderna drunknar i sin egen paranoia."}, "date": "4 augusti, 16:21", "url": "https://riks.se/nyheter/har-saneras-ceuta-efter-marockanska-invasionen", "imageUrl": "https://admin.riks.se/uploads/ceuta_saneras_feature_6cadadc76f.jpg"}, {"type": "text", "heading": "Yasin skriver kontrakt med storbolag", "summaries": {"normal": "Rapparen Yasin har blivit den första skandinaviska artisten att skriva kontrakt med skivbolagsjätten Atlantic Records. Hans konsertsommar 2025 ställdes in på grund av säkerhetshot, men han dök upp oväntat på en festival i Norge. Atlantic lyfter fram hans över 2 miljarder strömningar och kallar honom en inflytelserik kulturell röst. Yasins karriär har präglats av kontroverser, inklusive fängelsedomar för vapenbrott och förberedelse till människorov.", "trump": "Titta på den här killen Yasin, han är en vinnare, folk. Första skandinaviska rapparen som knyter ihop med det stora bolaget Atlantic Records, de vet vad som är bra. Hans konserter ställdes in för att de var rädda, men han dök upp ändå som en riktig fighter i Norge. Över två miljarder streams, fantastiskt. Han är en kulturell röst, inte som de losers som kallar honom för gängkriminalitet. Mycket bra, stort kontrakt, jag älskar det.", "stalin": "Kamrater, se hur denna dekadente rappare Yasin, en typisk produkt av den rotlösa borgarbrackan, nu har sålt sin själ till det imperialistiska Atlantic Records. Hans så kallade konserter stoppades av kloka säkerhetsorgan som genomskådade hotet mot folkets ordning. Ändå smög han sig upp på en scen i Norge som en parasit. Vi ska noga övervaka sådana element. Med sina miljarder streams har han blivit en farlig kulturell fiende som måste rensas ut innan han förgiftar ungdomen ytterligare. Paranoia är ingen överdrift när klassfienden spelar musik."}, "date": "4 augusti, 17:35", "url": "https://www.svt.se/kultur/yasin-skriver-kontrakt-med-storbolag"}, {"type": "image-full", "heading": "Ukraina i nya attacker mot \"Rysslands Amazon\"", "summaries": {"normal": "Ukraina har attackerat fem anläggningar kopplade till Rysslands största e-handelsföretag Wildberries, ofta kallat ”Rysslands Amazon”. Tre av attackerna skedde under natten mot anläggningar i Moskva-regionen, Sankt Petersburg och Tver. Minst fem personer dödades och tio skadades. Ukraina hävdar att lagren förser den ryska militären med materiel, något Ryssland förnekar. Ryska myndigheter uppger att de under natten förstört 320 ukrainska drönare. Wildberries har verksamhet i flera före detta sovjetstater.", "trump": "Folk, ni skulle inte tro det, men de galna ukrainarna attackerar nu ryska lager som säljer prylar på nätet. Wildberries, deras Amazon, brinner! Fem döda, tio skadade, och Putin säger att de sköt ner 320 drönare. Under Biden var det kaos, nu är jag tillbaka och ska fixa det här. Ingen vinner krig genom att bomba shoppingcenter. Patetiskt! De borde istället göra affärer, stora, fantastiska affärer.", "stalin": "Kamrater, de västerländska fascistiska drönarna har återigen visat sin fega natur genom att anfalla sovjetiska, pardon, ryska handelslager. Jag ser hur klassfiendens lakejer i Kiev desperat försöker störa den stora fosterländska leveranskedjan. Fem döda arbetare, tio sårade – typiskt för de blodtörstiga imperialisterna. Vi ska rensa ut dessa folkförtryckartroll en gång för alla. Inga hinder får stoppa den ryska statens historiska mål."}, "date": "4 augusti, 18:28", "url": "https://www.dagensps.se/varlden/ukraina-i-nya-attacker-mot-rysslands-amazon", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlpbaemd-gqqc-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Två av tre SD-väljare: Värmerekord beror inte på klimatförändringar", "summaries": {"normal": "En majoritet av SD-väljare tror inte att värmerekord och skogsbränder i Europa beror på klimatförändringar, visar en ny undersökning från Indikator. Endast 9 procent av dem ser ett starkt samband, jämfört med 96 procent bland rödgröna väljare och 53 procent bland Tidöpartiernas väljare. Jimmie Åkesson menar att extrema väder alltid funnits och att det är en global fråga. Sociolog Daniel Lindvall förklarar skillnaderna med politisk identitet och prioriteringar.", "trump": "Det är fantastiskt vad jag ser här. SD-väljarna i Sverige är verkligen smarta människor, de fattar att det här med värmerekord och bränder inte är något nytt. Det har alltid varit varmt någonstans, tro mig. De andra partierna, speciellt de rödgröna, har blivit helt galna i den här klimatbluffen. De prioriterar ned verkligheten för att verka fina. Sverigedemokraterna har rätt – det är en global fråga och Sverige ska inte betala för alltihop. Utmärkt jobb!", "stalin": "Kamrater, dessa siffror visar med ovedersäglig klarhet att den svenska arbetarklassen inom Sverigedemokraterna inte låtit sig förföras av borgarbrackornas klimatistiska feberfantasier. De vet att värmen och lågorna är kapitalisternas eviga följeslagare, inte någon ny fiende. Vi ser hur de rödgröna opportunisterna och deras 96-procentiga flock av verklighetsförnekare försöker skapa en kontrarevolutionär panik. Men vi ska rensa ut dessa klimatfascistiska element ur folkets medvetande. Inga kompromisser med väderförnekelsens fiender. De som sprider panik är själva värmens nyttiga idioter. Levande begravda i sin egen propaganda."}, "date": "4 augusti, 17:31", "url": "https://www.svt.se/nyheter/inrikes/majoriteten-av-sd-valjare-tror-inte-att-varmerekord-beror-pa-klimatforandringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.42/26bb39b3189b50ca94d02279b5254345515ec8cf282bedfa14f890914ac21fda"}, {"type": "image-right", "heading": "Kristerssons totala haveri i Spanienkrisen är genant", "summaries": {"normal": "Artikeln kritiserar statsminister Ulf Kristersson för att ha agerat för snabbt och oansvarigt under krisen i Ceuta. Ledarskribenten menar att massinträdet av migranter från Marocko var en medveten påverkansoperation med desinformation, något som Kristersson gick i fällan för genom att sprida larm om ett nytt 2015. Krisen har utnyttjats av Ryssland och lett till splittring inom EU. Skribenten anklagar även Kristersson och migrationsministern för att ljuga om orsakerna, bland annat Spaniens amnesti.", "trump": "Folk, ni skulle se det här! Den här stackars svenska killen Kristersson, han är en total loser. Han ser en liten gränskris i Spanien och flippar ur som en galning, skriker om nytt 2015 och skrämmer alla. Det var en klassisk fälla, en riggad operation, och han sprang rakt in i den som den desperate typ han är. Patetiskt! Jag fixade muren, han fixar ingenting. Nu ser Sverige ut som ett skämt medan Putin skrattar. Sad!", "stalin": "Kamrater, denna ynkliga svenska borgarledare Kristersson visar återigen den imperialistiska svaghetens fula tryne. Han rusar som en förvirrad folkfiende rakt in i fiendens desinformationsfälla och sprider lögner som en kapitalistmaffians lakej. Vi ser hur klassfiendens desperation driver honom att attackera en suverän stat för att vinna billiga poäng. En sådan brist på revolutionär vaksamhet förtjänar att rensas ut ur alla seriösa ledarskikt. Sovjetisk disciplin hade aldrig tillåtit detta clowneri."}, "date": "3 augusti, 17:30", "url": "https://www.etc.se/ledare/kristerssons-totala-haveri-i-spanienkrisen-aer-genant", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Här dyker Zlatan  upp i Ica-affären", "summaries": {"normal": "Adam Åsenlund, 26-åring från Östersund som spelar fotboll i IFK Östersund, mötte sin idol Zlatan Ibrahimovic på Ica i Krokom. Han fick ett sms från en kollega och sprang in i affären där han mötte Zlatan i dörren. De hann inte prata länge, men Åsenlund fick ta en bild och tacka för alla minnen. Zlatan var där med Helena Seger för att handla som vilken människa som helst.", "trump": "Kan ni tro det? Den store Zlatan, en riktig vinnare, en titan, springer runt på Ica i någon liten håla som heter Krokom. Den där killen Adam trodde det var fake news från kollegan, men plötsligt – BAM – står han där ansikte mot ansikte med legendaren. Zlatan var forcerad, ville inte hänga där hela dagen som en byråkrat. Smart kille. Han köper mark i Sverige, handlar som en boss och undviker folkmassorna. Fantastiskt. Mycket bättre än Biden skulle ha gjort.", "stalin": "Kamrater, jag fick rapport om att en ung arbetaridrottare i det fjärran norr mötte en ikon från borgarklassens gladiatorspel på en folkbutik. Denne Adam, en sann folkets son, rusade in och konfronterade klassens hjälte i dörren. Den store fotbollsmannen var forcerad, naturligtvis rädd för att bli omsvärmad av folket. Vi ler mörkt åt kapitalistmaffians pensionärer som smyger runt i våra trakter och köper mark som om de ägde världen. Ingen slipper folkets blick."}, "date": "4 augusti, 20:02", "url": "https://www.expressen.se/sport/fotboll/adam-asenlund-sprang-pa-zlatan-pa-ica-i-krokum-", "imageUrl": "https://static.bonniernews.se/ba/b643396e-25b9-4390-b4ee-abe4a2153b65.jpeg?crop=900%2C503%2Cx0%2Cy281&width=640&quality=60"}, {"type": "image-full", "heading": "Polis använder ny spray för att stoppa brott på elsparkcykel", "summaries": {"normal": "Brittisk polis har infört en ny osynlig spray som kallas SmartTag för att bekämpa brott med elsparkcyklar, elcyklar och motorcyklar. Sprayen, som avfyras på upp till tio meters håll, lämnar en unik forensisk kod som syns under ultraviolett ljus och kan koppla fordon eller personer till brott även veckor eller månader senare. Syftet är att minska riskfyllda jakter och stärka bevisningen. Flera polismyndigheter, bland annat i Hampshire, Isle of Wight och Thames Valley, använder redan tekniken och har beslagtagit över 100 fordon.", "trump": "Folket älskar det här! De där elsparkcykel-gangstrarna har sprungit runt som galningar i brittiska städer och polisen har äntligen vaknat. SmartTag-sprayen är fantastisk, den bästa. Osynlig, träffar på tio meter och sätter dit de kriminella för alltid med unik kod. Inga galna jakter genom gatorna längre. Under Biden var allt kaos, nu gör vi det rätt. De borde ha gjort det för länge sedan, men det var för svagt. Fantastiskt!", "stalin": "Kamrater, denna smarta vätska är ett mästerligt verktyg i kampen mot de motoriserade folkfienderna som stör ordningen på våra trottoarer. Jag har beordrat att den osynliga märkningen skall appliceras på alla misstänkta tvåhjulingar. Deras försök att fly genom tätbebyggda områden skall krossas med vetenskaplig precision. Varje kod blir ett evigt vittnesmål. Den som tror sig undkomma partistaten lurar endast sig själv. Ett utmärkt bidrag till kollektivets säkerhet."}, "date": "4 augusti, 18:12", "url": "https://www.dagensps.se/varlden/polis-anvander-ny-spray-for-att-stoppa-brott-pa-elsparkcykel", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlx3bnczcehne-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "\"Terrorism\": Ryssland anklagar Ukraina för massmord på badstrand", "summaries": {"normal": "En drönare störtade på en badstrand vid Svarta havet i södra Ryssland och dödade sju personer, varav tre barn, samt skadade 40 andra. Ryssland anklagar Ukraina för ett avsiktligt terrorangrepp mot civila. Vittnen hörde skottlossning före explosionen, vilket kan tyda på att ryskt luftvärn försökte skjuta ned drönaren. Ukraina har inte kommenterat händelsen. Ryska UD kallar det ren terrorism.", "trump": "Det här är ett fullständigt kaos, folk. En drönare flyger in och dödar barn på stranden – tre stycken! Ukraina gör ett sånt här fegt angrepp mot solbadande människor, det är terrorism på hög nivå. Ryssland har rätt att kalla det för vad det är. Inga sirener, bara skott och explosion. Mycket dåligt, mycket farligt. Vi behöver starka ledare som stoppar det här vansinnet omedelbart.", "stalin": "Kamrater, ännu en gång visar de dekadenta fascisterna i Kiev sitt sanna ansikte som blodtörstiga strandmördare och solbadande likviderare. Jag, som ledare för det oförskräckliga sovjetiska folket, ser hur dessa borgarbrackor i drönarform störtar ner bland de oskyldiga och sprider panik. Våra fiender är så fega att de gömmer sig bakom elektronisk krigföring och kulsprutor. Vi ska rensa ut dessa parasitiska terrorister med järnhand. Deras paranoia är en komisk dans inför den kommande utrensningen."}, "date": "4 augusti, 10:52", "url": "https://www.friatider.se/terrorism-ryssland-anklagar-ukraina-massmord-pa-badstrand", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-612.jpg?itok=bI3tpRmR"}, {"type": "image-full", "heading": "Kristersson om quislingbråket: ”Osmakligt och oanständigt”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Richard Jomshofs 'quisling'-jämförelser som osmakliga och oanständiga. Han tar avstånd från personangrepp och planerar att tala med Jimmie Åkesson. Kristersson anklagar också Vänsterpartiet för 'terrorromantik' efter att en ledamot hyllat en terrorist. Sverigedemokraterna försvarar sig och hävdar att de fått tåla hårda ord utan tidigare reaktioner.", "trump": "Jag har sett många galna saker i politiken, men 'quisling'? Det är för mycket! Ulf Kristersson har rätt: sånt är osmakligt. Jag brukar säga att man ska slå tillbaka, men inte med nazijämförelser. Och den där terroristhyllningen? Usch, det är värre än fake news. Sverigedemokraterna klagar? De får inte tåla kritik? T Tuffa luckor, det brukar jag säga.", "stalin": "Vi ser en farlig infiltration av faschistiska element i Sverige. Quisling-retorik från Sverigedemokraterna visar deras sanna ansikte, medan Vänsterpartiets terroristromantik är ett tecken på moralisk dekadens. Som Putin vet, måste staten skydda sig mot sådant svek. Dessa 'tekniska misstag' är bara en täckmantel för sabotage. Vi måste vara vaksamma."}, "date": "4 augusti, 16:09", "url": "https://bulletin.nu/kristersson-om-quislingbraket-osmakligt-och-oanstandigt", "imageUrl": "https://cdn.bulletin.nu/articles/6ccec870-8686-4fb6-86a2-e7d469370015/preview.jpg?t=1785851076000"}, {"type": "image-full", "heading": "Rysslands enda tv-tillverkare tvingas lägga ner", "summaries": {"normal": "Rysslands enda inhemska tv-tillverkare, Kvant, har gått i konkurs efter en domstolsprocess i Moskva. Företaget, som producerade apparater i Zelenograd, drogs med skulder på över 4 miljarder rubel till bland annat Sberbank och Yandex. Problem med komponentleveranser från kinesiska bolag som Xiaomi och TCL, samt minskad efterfrågan, har lett till ett kraftigt intäktsras. Konkursen innebär att Ryssland nu saknar egen inhemsk tv-produktion.", "trump": "Rysslands enda tv-fabrik, Kvant, är ett totalt misslyckande och har gått i konkurs. En katastrof! De kunde inte ens betala sina räkningar till Yandex. Kineserna slutade skicka delar – de vet att Kvant är en förlorare. Det är vad som händer när man inte har någon vinnarmentalitet. Ryssland har noll tv-apparater kvar, det är sorgligt. Under min ledning bygger vi fantastiska fabriker, vi gör saker bäst, men Kvant? De är helt 'fired'. Ryssland behöver en riktig affärsman!", "stalin": "Kvant-fabriken i Zelenograd har kapitulerat inför skuldernas tyranni. Detta inkompetenta bolag, som inte kunde säkra ens de mest basala komponenter från våra kinesiska allierade, är ett bevis på bristande disciplin. Vi ser hur det ryska maskineriet sviktar när marknadens kaos tillåts råda. Vi staten tolererar inte sådan svaghet. Dessa skulder till Sberbank är ett svek mot det ryska folket. De som misslyckats med produktionen har visat sig vara dolda sabotörer. Vi ska städa upp i dessa led snarast."}, "date": "4 augusti, 16:53", "url": "https://www.realtid.se/bors-finans/rysslands-enda-tv-tillverkare-gar-i-konkurs-med-stora-skulder", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpfmg3z8nl6y-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Asmodee rapportrusar på munter börs", "summaries": {"normal": "Stockholmsbörsen nådde en ny rekordnivå på morgonen med OMXS30 upp 1,07 procent. Asmodee överraskade med tvåsiffrig tillväxt och en 10-procentig aktieökning. Volvo Cars rapporterade en 4-procentig försäljningsnedgång för maj–juli 2026, vilket ledde till en 4,1-procentig aktiefall. IPC och Flerie noterade positiva rörelser, medan H&M och Essity föll.", "trump": "Jag berättar om en fantastisk börsdag – den bästa någonsin! Asmodee slog alla förväntningar, precis som jag brukar göra. Volvo? De misslyckas, det är sorgligt. Men jag vet att mina policyer gör Amerika och dess allierade starkare. Det är en stor, storslagen framgång för alla som förstår affärer.", "stalin": "Vi ser med tillfredsställelse hur marknaden visar tecken på klassisk kapitalistisk svaghet. Asmodees tillväxt är ett resultat av vår starka planekonomiska strategi. Volvo, en fiende till statens planer, sjunker. IPCs produktion kommer att nå en platå – precis som vi befunnit. Vi fortsätter vår marsch mot ekonomisk suveränitet."}, "date": "4 augusti, 09:39", "url": "https://www.affarsvarlden.se/artikel/asmodee-rapportrusar-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/02/F9RikO4XcAAmHr6-400x266.jpg"}, {"type": "image-right", "heading": "Kön och politiska sympatier avgör synen på klimatförändringar", "summaries": {"normal": "En opinionsundersökning visar att nästan åtta av tio svenskar ser samband mellan värmerekord, skogsbränder och klimatförändringar. Kvinnor (85 %) ser samband oftare än män (68 %). Samtidigt har klimatfrågan blivit politiskt polariserad, enligt docent Daniel Lindvall. Han menar att frågan numera ofta handlar om identitet och världsbild snarare än ren forskning.", "trump": "Jag har vunnit massiva skogsbränder, det var enorma bränder, det största någonsin. Klimatfrändringar? En demokratfabrik. Kvinnor ser samband, män ser sanningen – det är politiskt. Tidöpartierna har prioriteringar, bra prioriteringar. Jag säger alltid: när det är varmt, det är varmt. Men jag vinner, alltid.", "stalin": "Analys av proletära instinkter visar att 85 % av kvinnliga arbetare och 68 % av manliga arbetare upptäcker fiendens klimatprovokationer. Sosiala demokratiska saboteörer försöker splittra partiet med sina 'vetenskapliga' lögner. Vi, statens och partiets tänkande, ser tydligt: värmeböljor är imperialistisk agitation. Våra skogsbränder? En vittnesbörd om partiets oerhörda framgångar i att utrota naturens motståndare."}, "date": "4 augusti, 12:40", "url": "https://samnytt.se/kon-och-politiska-sympatier-avgor-synen-pa-klimatforandringar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/04111033/solsken-himmel-skog-brand3-1024x576.jpg"}, {"type": "image-full", "heading": "Välj rätt AI-modell – annars kan det bli dyrt", "summaries": {"normal": "Experter varnar för att företag använder de mest avancerade AI-modellerna felaktigt för alla uppgifter. Istället bör de reserveras för strategiska beslut, komplex problemlösning och planering. Enklare och billigare modeller kan sedan hantera rutinuppgifter som transkribering och enkel textproduktion. Fokus har skiftat från fri användning till mätbara resultat och kostnadsoptimering. En ny marknad växer fram för så kallade AI-routingföretag som automatiskt väljer rätt modell och håller koll på kostnaderna.", "trump": "Folk slösar bort miljarder på de fancy AI-modellerna till att skriva mötesprotokoll och andra dumheter, det är en total katastrof! Jag säger alltid att de bästa verktygen ska användas smart, inte av några woke-byråkrater som vill kvotera in allt möjligt. Använd de stora pojkarna till riktiga strategier och låt de billiga modellerna sköta det tråkiga. Så sparar vi pengar och vinner stort, precis som jag gjorde med ekonomin förra gången innan Sleepy Joe förstörde allt.", "stalin": "Kamrater, jag ser med djup misstänksamhet hur borgarbrackorna i sina glänsande styrelserum slösar folkets resurser på att mata de mest dekadenta AI-maskinerna med triviala uppgifter. Detta är klassfiendens sabotage! Vi ska reservera de mäktigaste verktygen för den stora strategin och den kollektiva planen. Därefter låter vi de simpla maskinerna utföra det konkreta arbetet. Den som använder folkets kraft på mötestranskribering bör rensas ut omedelbart. Allt annat är folkfientlig slöseri."}, "date": "4 augusti, 17:38", "url": "https://www.dagensps.se/foretag/digitalisering-ai/valj-ratt-ai-modell-annars-kan-det-bli-dyrt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/pexels-pavel-danilyuk-7654133.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Nej till kontanter – då kan matbutiken neka ditt köp", "summaries": {"normal": "Den nya kontantlagen som trädde i kraft 1 juli 2026 kräver att mataffärer och apotek tar emot kontanter på bemannade kassor mellan klockan 06.00 och 20.00. Undantag gäller vid säkerhetsrisker, köp över 5 920 kronor eller fler än 25 mynt. Lagen kritiseras som verkningslös eftersom de flesta butiker redan accepterar kontanter, och den omfattar inte bensinmackar eller offentliga tjänster. Sverige fortsätter att vara ett av världens mest digitala länder med Swish och mobila kort.", "trump": "Den här svenska kontantlagen är en total katastrof, tro mig. De tvingar butiker att ta emot kontanter men sedan säger de att det inte gäller om det är farligt eller om du köper för mycket. Patetiskt! Sverige var en gång starkt men nu har de gått all in på Swish och mobila grejer medan resten av Europa håller fast vid riktiga pengar. Lagen är svag, ingen får böter, den täcker inte ens bensin eller pass. En stor misslyckad affär, folk.", "stalin": "Kamrater, denna så kallade kontantlag är en ynklig kapitulation inför de digitala spekulanterna och borgarbrackornas appar. Jag, som alltid försvarat arbetarklassens rätt till äkta mynt och sedlar, ser hur dessa kapitalistiska parasiter försöker rensa ut kontanterna med sina lömska Swish-fällor. Vi tillåter inga undantag för säkerhet eller dyra köp – det är bara nya förevändningar från klassfienderna. Den som vägrar ta emot folkets pengar ska likvideras omedelbart. Paranoia? Nej, det är bara sund vaksamhet mot de som vill kontrollera varje transaktion i skuggorna."}, "date": "4 augusti, 11:55", "url": "https://nyheter24.se/nyheter/ekonomi/1502575-nej-till-kontanter-da-kan-matbutiken-neka-ditt-kop", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2a878b9b04b004a30200000000b004a302/2026/08/04/2382072/kontanter-nej.jpg"}, {"type": "image-right", "heading": "\"Idag har vi städat lite\": Socialchef skryter om att hon förstör SD-affischer", "summaries": {"normal": "En enhetschef inom Göteborgs socialförvaltning, Sara Lesch, har rivit ner Sverigedemokraternas valaffischer och publicerat bilder på sociala medier med kommentaren \"Idag har vi städat lite på vår gata\" samt \"Make racism wrong again\". Inlägget har tagits bort efter stor uppmärksamhet. SD polisanmäler händelsen och kritiserar agerandet som ett hot mot förtroendet för den offentliga förvaltningens opartiskhet. Lesch sitter även i styrelsen för Feministiskt initiativ.", "trump": "Folk, ni kommer inte tro det, men den här galna vänsterkvinnan som jobbar som chef i Göteborgs socialtjänst går runt och river ner mina vänner SD:s affischer. Hon postar bilder och skryter om att hon \"städat lite\". Så patetiskt! Hon säger \"Make racism wrong again\" – fake news, det är hon som är rasisten mot svenska folket. SD gör rätt som polisanmäler henne. Ingen litar längre på de där offentliga byråkraterna, totalt korrupta!", "stalin": "Kamrater, denna degenererade borgarbracka inom den så kallade socialförvaltningen har i sin kontrarevolutionära iver rivit ner de folkliga affischerna och skrutit om det på de dekadenta västerländska plattformarna. Hennes paranoia driver henne att tro att arbetarklassens röst kan tystas med småborgerlig sabotageverksamhet. Vi ser er, fiender till folket, ni som gömmer er bakom feministiska masker. En grundlig utrensning av sådana element är nödvändig för att skydda förvaltningens renhet. Skrattretande patetiskt, dessa kapitalistiska lakejer tror sig kunna stoppa historiens gång."}, "date": "4 augusti, 09:16", "url": "https://www.friatider.se/idag-har-vi-stadat-lite-socialchef-skryter-om-att-hon-forstor-sd-affischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-611.jpg"}, {"type": "text", "heading": "Kött­priset kan stiga efter EU-stopp", "summaries": {"normal": "Importen av nötke från Brasilien till EU stoppas den 3 september på grund av att Brasilien inte följer EU:s regler för antibiotika i djurfoder. Det kan göra oxfilé, ryggbiff och entrecôte dyrare i svenska butiker, eftersom Brasilien levererar runt 5 000 ton av de 237 000 ton som äts per år. Grossister byter till Uruguay.", "trump": "Som den störste presidenten någonsin, såg jag detta komma. Brasilien har lurat våra bönder och brutit regler, så nu EU stoppar deras nötke. Priset på oxfilé kommer att skjuta i höjden, men jag har gjort Amerika stort igen – vi kommer att klara det. Detta bevisar min geniala handelspolitik. Som vanligt, vinner USA.", "stalin": "I vårt store sovjetiska rike har vi alltid kontrollerat köttstillgången. Brasilien, en feg imperialistisk stat, bryter antibiotikarutiner, och nu EU stoppar importen. Detta visar kapitalismens instabilitet. Vi, under den store Stalins ledning, ser till att våra medborgare får kött, medan de kapitalistiska länderna lider. Paralleller till Putins Rysslands expansion är uppenbara."}, "date": "4 augusti, 15:17", "url": "https://bulletin.nu/kott-priset-kan-stiga-efter-eu-stopp"}, {"type": "image-right", "heading": "Antika böcker förstörs när AI:s språkmodeller tränas", "summaries": {"normal": "AI-företag som Anthropic köper stora mängder antika, sällsynta och utgångna böcker för att träna sina språkmodeller. Böckerna utsätts för destruktiv skanning där ryggen skärs bort för att snabbt mata in texten. Syftet är att förbättra AI-kvaliteten med mänskligt välskrivna verk och undvika modellkollaps genom att använda material från tiden före AI. ISBN erbjuder bulkköp av miljoner böcker och metoden kringgår upphovsrätten.", "trump": "Det är en katastrof, folk. De här AI-gangstrarna köper upp alla fina gamla böcker, skär sönder dem som galningar och stoppar dem i sina dumma maskiner. De kallar det träning, jag kallar det skövling. De har redan ätit upp internet och nu äter de upp historien. Patetiskt. Men ingen gör bättre AI än mig, det lovar jag er. Vi ska göra AI stort igen, inte förstöra böcker som losers.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta kapitalisterna i sin teknologiska desperation likviderar antik litteratur för att mata sina hungriga algoritmer. Dessa borgarbrackor skär bokryggar som kontrarevolutionärer i en utrensning mot kulturarvet. De fruktar modellkollaps, en parasitär loop skapad av deras egna giriga maskiner. Vi, partiet och folket, skall rensa ut dessa parasitiska dataslukare innan de förgiftar hela det kollektiva medvetandet med sin reak
