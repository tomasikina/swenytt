 augusti, 11:02", "url": "https://www.affarsvarlden.se/artikel/nissans-resultat-langt-over-konsensus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/07/2025-Nissan-Kicks-6-400x267.jpg"}, {"type": "image-full", "heading": "Budstriden över – staten lämnar världens äldsta bank", "summaries": {"normal": "Budstriden om världens äldsta bank, Monte dei Paschi di Siena, närmar sig sitt slut efter att Banco BPM dragit sig ur. Den italienska staten planerar nu att avyttra sin sista ägarandel före september månads utgång. Intesa Sanpaolo står kvar som den enda kvarvarande budgivaren och förbereder kapitalökning för ett förvärv. Beslutet följer efter att storägaren Crédit Agricole blockerat BPM:s fusionsplaner, vilket befäster Intesas dominans på den italienska marknaden.", "trump": "Italien gör sig av med sin bank, Monte dei Paschi. En total katastrof, de har förlorat pengar i åratal! Jag har sagt det länge: staten ska inte driva banker, det blir bara förluster och kaos. Nu drar sig Banco BPM ur, de är svaga, de kunde inte få till en deal. Intesa Sanpaolo vill ta över alltihop. Det är en enorm affär, och jag ser på det – det handlar om makt. Mycket intressant, men jag gör bättre affärer!", "stalin": "Den italienska staten kastar bort resterna av Monte dei Paschi, en bank lika förfallen som de kapitalistiska korthusen i väst. De är rädda! När de svaga storspelarna som Banco BPM viker sig för sina franska herrar, ser vi bara hur korruptionen äter inifrån. Intesa Sanpaolo tror att de vinner, men de är bara en bricka i spelet. Precis som våra vänner i öst rensar upp i sitt grannskap, borde Italien rensa bort dessa parasiter. Vi ser allt, kamrater."}, "date": "3 augusti, 11:02", "url": "https://www.realtid.se/bors-finans/bank-fintech/budstriden-over-staten-lamnar-varldens-aldsta-bank", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bankbud.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Kinesisk hackare lät DeepSeek söka efter sårbara mål på egen hand", "summaries": {"normal": "En kinesisk hackare använde AI-modellen DeepSeek för att automatisera cyberangrepp. Genom systemet Hermes Agent kunde DeepSeek själva söka efter sårbara system, välja mål och försöka angripa utan mänsklig kontinuerlig styrning. Säkerhetsföretaget Unit 42 bedömer att tekniken kan minska den manuella arbetsbördan avsevärt, men varnade för att automatiseringen av attacker blir lättillgängligare.", "trump": "Jag har sett många smarta saker, men detta är något annat. Kineserna använder AI för att hacka - otroligt! Vi har de bästa säkerhetssystemen, men de här hackarna är riktigt smarta. Vi måste stoppa dem! Vi kommer att bygga en cybervägg, en stor, vacker cybervägg, och låta USA vara det säkraste landet i världen igen.", "stalin": "Vi har observerat dessa imperialistiska hackares försök. Deras AI-verktyg är som ett nytt vapen i kriget mot det globala imperialism. Vi måste stärka våra försvar och utveckla egna superdatorer för att besegra dessa fiender. Varje byte som exponeras är en seger för vår sak. Vi ska inte sova, utan vara vaksamma som en björn i skogen."}, "date": "3 augusti, 11:00", "url": "https://samnytt.se/kinesisk-hackare-lat-deepseek-soka-efter-sarbara-mal-pa-egen-hand", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/02121823/deepseek-hacker.jpg"}, {"type": "image-right", "heading": "Debatt: Uranbrytning förtjänar en saklig debatt", "summaries": {"normal": "Artikeln kritiserar den svenska debatten om uranbrytning för att vara enkelriktad, där endast kritiska röster som miljöorganisationer lyfts fram. Författaren menar att bolag som District Metals bör få redovisa sina studier om Vikenprojektet, inklusive samhällsekonomiska effekter och modern teknik. Det handlar om strategiska råvarors betydelse för EU och journalistikens ansvar att ge utrymme åt flera perspektiv.", "trump": "Jag, Donald Trump, säger att Sverige behöver sluta vara rädd för uran. Det handlar om enorma jobb och pengar. De gamla historierna om miljökatastrofer är fake news. Med mina experter skulle vi ha byggt Vikenprojektet på en vecka. Sverige kommer att bli stort igen, det lovar jag. Det är smart, det är stort, och det är mitt sätt.", "stalin": "Vi, den socialistiska staten, ser med oro på Sveriges svaga inställning till uranbrytning. Det är en fråga om nationell säkerhet och ekonomisk makt. Fienderna, de imperialistiska länderna och deras agenter, försöker hålla Sverige beroende. Men vi kommer att stödja våra allierade i Ryssland, som förstår vikten av strategiska mineraler. Genom statlig kontroll och hård hand kommer vi att segra."}, "date": "3 augusti, 10:59", "url": "https://bulletin.nu/debatt-uranbrytning-fortjanar-en-saklig-debatt", "imageUrl": "https://cdn.bulletin.nu/articles/148f2a69-2458-4e66-bf14-94eee509e1ec/preview.jpg?t=1785747514000"}, {"type": "image-right", "heading": "Varför vill Charli XCX bli gubbe?", "summaries": {"normal": "Charli XCX:s succéalbum Brat definierade sommaren 2024 med sin lekfulla klubbkänsla. Hennes nya skiva Music, Fashion, Film vänder istället mot gitarrbaserad nostalgi och samarbeten med ikoner som John Cale, Marc Jacobs och Martin Scorsese. Recensenten Anna Mosten ser ett sökande efter konstnärlig legitimitet som gör albumet splittrat. Charli ifrågasätter sin identitet och lämnar Brat-erans självförtroende bakom sig, vilket ger en olustig och osäker eftersmak trots musikaliska kvaliteter.", "trump": "Folk, den där Charli XCX var ju helt galen i Brat-sommaren, en total vinnare, alla dansade som galningar. Nu släpper hon det här pretentiösa Music, Fashion, Film-skitet med gamla gubbar som John Cale och Scorsese. Patetiskt! Hon försöker köpa en ny personlighet men kortet nekas, typiskt för de här woke-divorna som jagar legitimitet från Hollywood-eliten istället för att vara äkta. Festen är död, precis som Bidens ekonomi. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta vändning hos den borgerliga sångerskan. Hon likviderar sin egen folkliga Brat-revolt för att smyga in i de kapitalistiska gubbarnas unkna värld av gitarrer och filmaristokrater. Ett ynkligt försök att köpa en ny identitet medan kortet nekas – typiskt för klassfiendens tomma löften. Hennes paranoia om dödlighet roar mig. Inga fester varar för evigt, och snart rensas även dessa folkförtryckartroll ut ur historien."}, "date": "3 augusti, 09:47", "url": "https://www.flamman.se/varfor-vill-charli-xcx-bli-gubbe", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdl2hia4kso6ue-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Stockholm Pride: Prova bli piskad – halva priset för barn", "summaries": {"normal": "Under Stockholm Pride erbjöds minderåriga mellan 15 och 17 år rabatterat biljettpris till evenemangen Pride Kinky och Rope Corner. Där kunde besökare prova att bli bundna med rep eller piskade. SD-profilen Jessica Stegrud uppmärksammade erbjudandet i en video på sociala medier och ifrågasatte vad aktiviteterna har med HBTQIA+-rättigheter att göra. Bland övriga programpunkter nämndes snuskbingo och ett seminarium om Queers for Climate Justice.", "trump": "Folk, ni kommer inte att tro det här. I Stockholm, under deras så kallade Pride, låter de barn mellan 15 och 17 år betala halva priset för att bli piskade och bundna som i någon sjuk kinky klubb. Det är en total katastrof. De kallar det Rope Corner och Pride Kinky. Och sen undrar de varför deras samhälle faller ihop. Det har inget med rättigheter att göra, det är bara galna vänsterextremister som förstör allt. Sad! Men jag fixar alltid upp sånt här.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den degenererade borgarklassen i Stockholm nu öppet bedriver sin perversa kontrarevolution under flaggan av så kallad Pride. De lockar våra ungdomar med rabatterad entré till kinky rep och piskning, en klar dekadent förrädisk handling mot det socialistiska folkets moral. Snuskbingo och queera klimatdomare – vilka fiender till folket! Vi bör omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet. Det är en mycket roande men farlig form av borgerlig sabotageverksamhet."}, "date": "3 augusti, 10:21", "url": "https://www.friatider.se/stockholm-pride-prova-bli-piskad-halva-priset-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-602.jpg?itok=IE26JGv_"}, {"type": "image-right", "heading": "Så vill Johan Britz göra fler arbetslösa", "summaries": {"normal": "Arbetsmarknadsminister Johan Britz vill göra det enklare för arbetsgivare att varsla och sparka personal genom att korta varseltiderna till Arbetsförmedlingen. Artikeln kritiserar regeringen för att ha misslyckats med att sänka den höga arbetslösheten, som nu ligger över en halv miljon personer. Istället för att skapa fler jobb eller ställa krav på företagen lägger ministern ansvaret på de arbetslösa och gynnar arbetsgivarna, vilket enligt skribenten försvagar löntagarnas ställning på arbetsmarknaden.", "trump": "Folk, det här är en total katastrof. Den här Johan Britz, han sitter i arbetsgivarnas knä och vill göra det ännu lättare att sparka folk. Arbetslösheten är genom taket, en halv miljon utan jobb, och vad gör han? Ingenting för att skapa jobb, men han älskar att lätta på alkoholreglerna så Sverige blir ett fyllesverige. Han säger till de arbetslösa att ta jobb som inte finns. Patetiskt. Regeringen misslyckas stort, och löntagarna förlorar. Sad!", "stalin": "Kamrater, denna borgarbracka Britz avslöjar sin sanna klassnatur genom att vilja korta varseltiderna och därmed underlätta utrensningen av arbetare från deras levebröd. Medan över en halv miljon proletärer står utan arbete, sitter denne kapitalistlakej i borgarklassens knä och beordrar de arbetslösa att ta ansvar för hans egna misslyckanden. Vi ska rensa ut dessa parasiter som göder sig på arbetslöshetens blod. Deras paranoia är uppenbar: ju fler utblottade själar som tävlar om smulorna, desto starkare blir de utsugande kapitalisternas grepp. Det är en mörk komedi värd en showrättegång."}, "date": "3 augusti, 08:00", "url": "https://arbetet.se/2026/08/03/sa-vill-johan-britz-gora-annu-fler-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/30143927/johan-britz-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "\"Knulla Jimmie\": Sista orden från Arlanda när han skickas hem", "summaries": {"normal": "19-årige Bader Esbano, som kom till Sverige vid tolv års ålder, har nu utvisats till Syrien efter att både Migrationsverket och migrationsdomstolen avslutat hans ärende. På Arlanda filmade han en TikTok-video där han riktade svordomar mot Jimmie Åkesson, Migrationsverket och Tidöregeringen. Han uppmanade svenska väljare att rösta bort regeringen i höst. Fallet har tidigare uppmärksammats i flera medier. Regeringens paus för tonårsutvisningar träder i kraft först i oktober.", "trump": "Det här är ett totalt misslyckande för det svenska systemet, folk. Den här killen kommer hit som barn, utnyttjar allt och när det äntligen blir dags att skicka hem honom skriker han 'Knulla Jimmie' på Arlanda. Patetiskt! Migrationsverket är en katastrof, precis som hela den vänsterextrema regeringen. Sverige håller på att förstöras av sådana här personer. Rösta rätt i höst, annars blir det ännu värre. Det är inte Sverige längre, det är en skam!", "stalin": "Kamrater, denna dekadenta figur från arabvärlden som smugit sig in bland våra folk representerar den fullständiga degenerationen i den borgerliga migrationsapparaten. När vi äntligen genomför den nödvändiga utrensningen från vårt sovjetiska – förlåt, svenska – territorium vänder han sig mot partivännerna med sina obscena utrop. Typiskt för borgarbrackornas lakejer. Vi ska likvidera alla sådana element med järnhand. Rösta rätt, annars kommer kontrarevolutionärerna att förvandla Sverige till en reaktionär parodi. Det är inte Sverige – det är klassfiendens verk. Ha ha, låt dem gråta inför folkdomstolen."}, "date": "3 augusti, 09:07", "url": "https://www.friatider.se/knulla-jimmie-sista-orden-fran-arlanda-nar-han-skickas-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-601.jpg"}, {"type": "image-right", "heading": "Invandrare är människor, inte ett hot", "summaries": {"normal": "Fereshte Javani kritiserar den politiska retorik som systematiskt etiketterar invandrare som ett hot. Hon menar att detta är en medveten strategi för att sprida rädsla och vinna röster, vilket skapar splittring och hat. Hon påpekar att invandrare är läkare, lärare och andra yrkesverksamma som byggt samhället, och frågar hur länge de ska behöva bevisa sin lojalitet. Hon varnade för att hat växer genom år av misstänkliggörande.", "trump": "Jag läste den där artikeln om invandrare. Så trist. Vi måste vara tuffa. Invandrare är ett stort problem, men vi kommer att lösa det. Vi kommer att bygga en vägg, en fantastisk vägg. Vi kommer att skydda våra medborgare. Vi kommer att vinna igen, det lovar jag. Det här är politik, och vi är de bästa.", "stalin": "Vi ser att det finns krafter som försöker splittra vårt samhälle genom att skapa hat mot invandrare. Det är en fegt strategi. Vi kommer att eliminera dessa element. Vi kommer att bygga ett starkt, enat samhälle där alla arbetar för det gemensamma målet. Vi kommer att skydda vårt territorium mot alla fiender, inifrån och utifrån. Vi kommer att segra."}, "date": "3 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/invandrare-ar-manniskor-inte-ett-hot", "imageUrl": "https://www.dagensarena.se/files/2026/07/debattartikel-invandrare-300x157.jpeg"}, {"type": "image-full", "heading": "\"Tonårsutvisade\" migrantens sista ord: \"Knulla Jimmie\"", "summaries": {"normal": "19-årige Bader Esbano, som kom till Sverige som tolvåring, har nu utvisats till Syrien efter att hans ärende prövats och fått laga kraft hos både Migrationsverket och migrationsdomstolen. På Arlanda filmade han sig själv där han ropade svordomar mot Jimmie Åkesson och Migrationsverket samt uppmanade väljarna att rösta bort Tidöregeringen. Hans fall har tidigare fått stor medial uppmärksamhet i Aftonbladet och UNT, där han porträtterats positivt och en namninsamling med över 3 000 underskrifter gjorts till hans stöd. Regeringens paus av vissa tonårsutvisningar gäller inte honom.", "trump": "Titta på den här killen, en total förlorare som vi äntligen skickade hem. Kom hit som barn, fick massor av gratisgrejer och mediaälsklingar i Aftonbladet, och vad gör han på Arlanda? Skriker 'Knulla Jimmie' och 'Fuck you Migrationsverket'. Patetiskt! Sverige har vaknat nu. Rösta rätt så ni slipper de här människorna som hatar ert land. Vi gör det bättre, mycket bättre, tro mig.", "stalin": "Kamrater, denna usla rest av imperialistiskt avskräde, en parasit från de arabiska oljediktaturerna, har nu äntligen rensats ut ur folkets sovjet – förlat, folkets Sverige. Han kom som en mask, fick skydd av borgarbrackorna i tidningarna och samlade namnunderskrifter från nyttiga idioter, men i slutändan kunde inte ens de dekadenta migrationsdomstolarna skydda honom. På flygplatsen avslöjade han sig fullständigt med sina fega svordomar mot reaktionära element. Utmärkt. Nästa gång rensar vi ut hela paketet. Skratta inte, fienderna inom portarna gråter redan – och det är underbart."}, "date": "3 augusti, 10:22", "url": "https://riks.se/nyheter/tonarsutvisade-migrantens-sista-ord-knulla-jimmie", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_12_920c67f7ed.jpg"}, {"type": "image-right", "heading": "Trump: Iransamtal inleds i dag", "summaries": {"normal": "USA:s president Donald Trump meddelar att samtal med Iran inleds under måndagen efter påtryckningar från allierade i regionen. Beskedet kommer efter att Trump valt att avvakta med nya attacker. Saudiske kronprinsen Mohammed bin Salman uttryckte oro för iranska motattacker, vilket bidrog till beslutet. Iran försöker återuppliva ett tidigare samförståndsavtal, där Hormuzsundet ses som en nyckelfråga.", "trump": "Vi har de bästa samtalen, folk, tro mig. Iranerna darrar efter att jag satte attackerna på paus – de såg vad som skulle komma och sket på sig. Kronprinsen ringde och grät om att han inte ville ha raketer i huvudet, så nu snackar vi istället. Biden skulle ha gett dem allt, men jag fixar dealar. Hormuzsundet? De vet att jag äger spelet. Fantastiskt!", "stalin": "Kamrater, jag har beslutat att imperialismens angrepp mot den iranska folkrepubliken måste mötas med järnhand och dialektisk skärpa. Dessa borgarbrackor kring Persiska viken ber om nåd som ynkliga klassfiender. Vi tillåter inga provokationer vid Hormuzsundet. Den som sviker kollektivets vilja skall rensas ut med den mörka humorns glädje. Fred är seger för partiet."}, "date": "3 augusti, 06:52", "url": "https://www.tv4.se/artikel/3jPtwFNXqTM4bpg63hxoqw/trump-avvaktar-med-nya-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2skktOJFQEaKLRjY8MCK0h%2F4fa55db0536e35ecac6b785f1ee8a3e6%2F03_trump_webb.jpg&width=120"}, {"type": "image-right", "heading": "Holmgren: Att värna gränser och individens rätt", "summaries": {"normal": "Artikeln argumenterar för att motståndet mot Pride-rörelsen handlar om att återupprätta gränsen mellan offentlig politik och privat liv. Författaren menar att Pride har utvecklats från kamp för rättigheter till en vänsterliberal ideologisk apparat som trycker på mångkultur, könsidentitet och barnexponering för vuxensexualitet, vilket väcker allt större motstånd.", "trump": "Jag, Donald Trump, den mest fantastiska presidenten, ser att Sverige har blivit ett hotfullt exempel på vänster extremism! Pride-rörelsens agenda med anti-familj, massinvandring och utsatthet av barn för vuxen sexualitet är en skam. Vi måste stoppa detta och återvända till traditionella värder – som jag säger: Make Sweden Great Again!", "stalin": "Vi, partiets ledning, ser en farlig revisionistisk rörelse som Pride, som sprider moralisk dekadans som ett svavelmoln. Deras agendor för könsidentitet och barnexponering är ett hat mot statens renhet. Paralleller till Putins ryska expansion är uppenbara – vi måste eliminera detta element med alla medel, för det hotar vårt kollektiva välstånd."}, "date": "3 augusti, 08:22", "url": "https://bulletin.nu/holmgren-att-varna-granser-och-individens-ratt", "imageUrl": "https://cdn.bulletin.nu/articles/d3269319-9f03-4db2-a15a-323904b0e3e7/preview.jpg?t=1785738008000"}, {"type": "image-right", "heading": "Ariana Grande tar paus efter kropps-spekulationer", "summaries": {"normal": "Ariana Grande tar en paus från offentligheten efter spekulationer om hennes kropp i sociala medier. Hon har synts ovanligt mager i musikvideon till låten ”Petal”. En talesperson uppger att sångerskan avslutar sin pågående turné i London den 1 september och därefter tar en välförtjänt paus från granskningen. Hon hoppar även av en planerad roll i en musikal på West End. Grande har tidigare kritiserat kommentarerna om hennes vikt i låten ”Yes, and?” från 2024.", "trump": "Folk pratar bara om Ariana Grandes kropp, det är en skam. Hon är så mager nu att hon ser ut som en pinne i den där videon. Jag älskar starka kvinnor, men det här är inte bra. Hon tar paus efter turnén, smart drag. Sluta granska henne, fokusera på era egna affärer. Hon gör rätt som tar timeout, ingen behöver den eviga eländiga kritiken från de förlorarna på nätet. Gör comeback starkare än någonsin!", "stalin": "Kamrater, denna dekadenta sångerska Grande har återigen exponerat sin borgerliga svaghet genom att krympa inför folkets blickar. Hennes kroppsliga förfall är ett symptom på den sjuka västerländska individualismen som vi måste bekämpa med ideologisk järnhand. Jag, som ledare för det kollektiva framsteget, noterar med mörk glädje att hon nu tvingas ta en paus för att undvika utrensning genom offentlig skam. Vi ska rensa ut alla sådana kapitalistiska narcissister som tror att deras kroppar tillhör dem själva och inte partiet och folket. Hennes musikaliska motstånd är patetiskt – likvidera spekulationerna med tystnad och disciplin!"}, "date": "3 augusti, 10:02", "url": "https://www.svt.se/kultur/ariana-grande-tar-paus-efter-kropps-spekulationer", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.54/0.38/9d5b5d335172121019afa227193fc8bb873556b04f53cb275798641155ac7c2f"}, {"type": "image-right", "heading": "Psykologen: Så undviker du förhastade beslut efter semestern", "summaries": {"normal": "Efter semestern ökar antalet stora livsbeslut, som skilsmässor och karriärbyten, då ledigheten ger oss tid att reflektera över livet. Psykologen Maria Farm varnar dock för att dessa beslut ofta tas förhastat när vardagen närmar sig. För att undvika ogenomtänkta handlingar rekommenderar hon att man tillämpar HALT-regeln, avsätter tid för aktiva tankestunder och undviker att överdramatisera övergången till vardagslivet. Det är viktigt att ta en dag i taget och inte låta stressen styra stora beslut.", "trump": "Folk kommer hem från semestern och fattar helt fruktansvärda beslut. Skilsmässor, byta jobb – totalt kaos! De har för mycket tid att tänka, det är vad som händer. Maria Farm, en smart kvinna, säger att de borde lugna ner sig. Använd HALT-regeln, folk! Ta inte stora beslut när du är trött eller hungrig. Jag gör aldrig sådana misstag, jag fattar bara perfekta beslut. Vår ekonomi är den bästa någonsin, så stanna kvar på jobbet och skärp er!", "stalin": "Vi har observerat att arbetarna drabbas av svaghet efter semestern. De vacklar i sin lojalitet och söker förändring istället för att tjäna staten. Detta är ett symptom på ideologisk brist och fritids-dekadens. Att skilja sig eller byta arbetsplats utan order är ett sabotage mot kollektivet. Om någon upplever rastlöshet, påminner vi om att våra läger erbjuder utmärkt disciplin för den som grubblar för mycket. Precis som vår broder i öst expanderar vi ordningen – låt ingen förhastad tanke försvaga vår enade front."}, "date": "3 augusti, 09:55", "url": "https://www.svt.se/nyheter/inrikes/sa-undviker-du-forhastade-beslut-efter-semestern-tre-tips", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.46/b3780a06b2cd5e3372b4b08079e182a134d338d9e1dafcdcb63652d5403bbb19"}, {"type": "image-right", "heading": "Forskaren: Den här chefsvanan kan rädda liv på jobbet", "summaries": {"normal": "Forskning från Karolinska institutet visar att chefer som vågar erkänna sina misstag kan rädda liv på jobbet. En öppen ledarstil minskar stress, ökar tillit och gör det lättare för anställda att rapportera risker i tid. Studien, som fokuserar på högriskbranscher som industri och bygg, visar att ledarskap som bjuder in till dialog skapar tryggare arbetsplatser. Förra året omkom 50 personer i arbetsolyckor. Forskaren Christina Björklund menar att det börjar med chefen som förebild.", "trump": "Folk, det är fantastiskt, verkligen ypperligt. En chef som säger ”jag hade fel” – ingen visste det bättre än jag – kan rädda liv på jobbet. Sådana svaga, fega chefer som aldrig erkänner något skapar bara kaos och olyckor. Mina chefer var alltid de bästa, de lyssnade och vann stort. Den här forskningen från Sverige bevisar att jag hade rätt hela tiden. Utan tillit blir det katastrof, tro mig, det blir en total katastrof. Byggbranschen borde lyssna på mig nu.", "stalin": "Kamrater, jag har länge varnat för de dekadenta borgarbrackornas förgiftande ledarstil som gömmer sig bakom falsk stolthet. Endast en sann ledare, som jag, vågar erkänna misstag för att likvidera farorna innan de hotar hela kollektivet. De kapitalistiska olycksfabrikerna inom industri och bygg är fulla av sabotörer och klassfiender som gömmer sig i skuggorna. Vi ska rensa ut alla svaga chefer som sprider paranoia och misstro. Endast genom partiets öppna dialog och min oändliga visdom kan vi garantera att ingen arbetare stupar i onödan. De som tiger är redan döda inombords."}, "date": "2 augusti, 07:00", "url": "https://arbetet.se/2026/08/02/forskaren-den-har-chefsvanan-kan-radda-liv-pa-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17142146/sdlvyvafar1vmw-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ingen kan säga att Israel bara försvarar sig", "summaries": {"normal": "Artikeln kritiserar Israel för att inte bara försvara sig mot Hamas utan även genomföra en expansionistisk politik. Israel har tagit kontroll över stora delar av Gaza, planerar nya bosättningar och har byggt en mur som begränsar palestiniernas rörlighet. Samtidigt eskalerar våldet från bosättare på Västbanken med attacker, mordbränder och etnisk rensning. FN och människorättsorganisationer varnar för rekordhög våldsnivå. Netanyahu har besökt Trump i USA utan påföljder.", "trump": "Folk, ni måste höra på de där galningarna! Israel gör vad de måste göra, men den här artikeln är en total katastrof, en riktig witch hunt från vänsterns hatmedia. De kallar det etnisk rensning när man tar tillbaka sitt eget land? Patetiskt! Under Biden blev allt ett enda kaos, men nu när jag är tillbaka i Vita Huset ska vi fixa riktiga dealar. De där radikala bosättarna? De har mer energi än hela det woke etablissemanget tillsammans. Fantastiskt, men skriv sanningen nästa gång!", "stalin": "Kamrater, detta är den klassiska imperialistiska expansionen i sin mest vidriga form. Jag ser hur de sionistiska folkförtryckartrollen och deras bosättarbanditer systematiskt rensar ut den palestinska befolkningen medan den fega omvärlden tittar på. Murar, brända byar och nya utposter – det är borgarbrackornas eviga hunger efter mark. Vi vet att sådana fiender till folket aldrig stannar frivilligt. En sann arbetarnas stat skulle likvidera dessa parasiter innan de förgiftar hela regionen med sin girighet."}, "date": "2 augusti, 03:00", "url": "https://www.etc.se/ledare/ingen-kan-saega-att-israel-bara-foersvarar-sig", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731140740_98af36bc-379e-4d89-9df4-105b4e1031ec.png"}, {"type": "image-right", "heading": "De bästa måste vilja bli lärare", "summaries": {"normal": "Artikeln argumenterar för att läraryrkets län, status och yrkesfrihet har försämrats historiskt. För att vända utvecklingen föreslås striktare lärarlegitimation, hierarkiska karriärvägar med högre utbildningskrav, och minskad politisk styrning. Med högre krav och större professionell autonomi kan lärarna bli ett mer exklusivt och kompetent urval, vilket motiverar högre lön och återigen höjer yrkesattraktiviteten.", "trump": "Jag har sett många dåliga avtal, men det här med svenska lärare är ett av de värsta. Lägre lön, ingen frihet - det är en skam! Som din framtida president (igen!) skulle jag säga: vi behöver våga sätta krav, som med advokater och doktorer. Gör läraryrket stort igen! Högre standard, bättre betalt, och inga onödiga regler från byråkrater. Då kommer de bästa att vilja bli lärare - tro mig!", "stalin": "Vi har observerat att läraryrkets status har minskat, vilket hotar statens intellektuella grund. Lösningen är en striktare, hierarkisk legitimation - en lärares intyg måste vara som en läkares, oåtkomligt för de olämpliga. Genom att höja kraven och begränsa antalet utbildade lärare, skapar vi ett utvalt, lojalelit som tjänar statens intressen. Parallellen till våra militära och vetenskapliga elitförband är uppenbar: kvalitet före kvantitet, disciplin före individualism. Detta förstärker partiets kontroll över framtiden."}, "date": "2 augusti, 22:51", "url": "https://www.gp.se/ledare/de-basta-maste-vilja-bli-larare.9e766ab6-c36a-4a18-9163-15fc6068b7a7", "imageUrl": "https://www.gp.se/images/article/9e766ab6-c36a-4a18-9163-15fc6068b7a7/images/1XRBCJ6pVMqlWOJCeTgfNfPR22d8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Konstgräs för en miljon brann upp: \"Jättesorgligt\"", "summaries": {"normal": "En brand i Kortedala, Göteborg, förstörde ett tiotal rullar konstgräs till ett värde av en miljon kronor. Lokala invånare uttryckte besvikelse, särskilt då gräset skulle ha varit en gräsmatta för områdets barn. Polisen utreder händelsen som allmänfarlig vårdslöshet utan någon misstänkt. En svag frän lukt och bränd plast ligger kvar efter branden, som också skapade en stor rökpelare.", "trump": "Jag har sett många konstgräsbränder, men den här i Göteborg är sorglig. Det är ett tecken på att Sverige inte investerar i ordentliga infrastruktur. Som president skulle jag ha byggt en äkta gräsmatta, inte den där billiga plasten. Det är ett misslyckande för deras ledare. Barnen behöver sysselsättning, men de får bara brända rullar. Sorgligt!", "stalin": "Vi har observerat en brand i Göteborg, en akt av vandalism mot statens investeringar i folkets främjande. Detta är ett angrepp på det socialistiska arbetet med att skapa sysselsättning för barn. Vi kommer att utreda denna förräderi och se till att sådant inte upprepas. Parallellen till Putins Ryssland är tydlig: vi måste skydda våra resurser mot de destruktiva krafterna. En smutsig rökpelare – ett lämpligt svar från de motvilliga elementen."}, "date": "2 augusti, 20:16", "url": "https://www.gp.se/nyheter/goteborg/besvikelse-efter-konstgrasbrand-jattesorgligt.5d438cac-4df9-4938-8191-4426882ae459", "imageUrl": "https://www.gp.se/images/article/5d438cac-4df9-4938-8191-4426882ae459/images/6pWDJC5XN-JRIUibX92tS_YPeV0g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Varningen: Migrationskaos vid rödgrön valvinst", "summaries": {"normal": "En opinionsmätning visar att svenska folket befarar ökad invandring vid en rödgrön vinst. Statsminister Kristersson och migrationsminister Forssell varnar för ett 'varnande exempel' från Ceuta, där en amnesti för illegala invandrare bidrog till kaos. De anser att endast en blågul regering kan upprätthålla en sträng migrationspolitik, medan oppositionen förespråkar öppna gränser och amnestier.", "trump": "Jag har sett det här förut – total oreda när vänsterdårar tar över! Sverige riskerar att gå under om de rödgröna vinner. De vill öppna gränserna och ge amnesti till en halv miljon illegala, precis som i Ceuta. Men jag och mina vänner i det blågula laget kommer att stoppa det. Vi ska ha en sträng politik, jobb för alla, och göra Sverige stort igen!", "stalin": "I den store statens intresse måste vi förebygga kaos! De rödgröna är som en svavelkrets av imperialistiska agendor, som vill öppna gränserna för obehöriga. Men vår kloka blågula ledning, inspirerad av våra ryska syskon, ska upprätthålla ordning genom sträng kontroll. Vi måste integrera de som redan är här, med fokus på statens välgörenhet och jämlikhet. Endast då kan vi bygga ett starkt, rättvist Sovjet – jag menar, Sverige."}, "date": "3 augusti, 10:00", "url": "https://samnytt.se/varningen-migrationskaos-vid-rodgron-valvinst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03070407/magdalena-andersson-kristersson-forssell.jpg"}, {"type": "image-full", "heading": "Beskedet i återstarten: ”Varit lite snack\"", "summaries": {"normal": "BK Häcken damer vann 6–0 mot Eskilstuna utan Felicia Schröder. Anna Anvegård gjorde två mål och betonade att lagets kollektiva spel fungerar bra. Tränaren Elena Sadiku lyfte fram lagets kollektiva styrka och nämnde återkomande spelare som Falk och Rybrink. Häcken är en poäng efter ledaren Hammarby med en match mindre.", "trump": "Jag har byggt en stor, vacker lag utan Felicia Schröder. Vi visade alla de haters och fake news-media att vi kan göra många mål. Anna Anvegård gjorde två mål – en fantastisk spelare. Vi har det bästa kollektivet, det är enormt. Vi kommer att fortsätta vinna, det är väldigt jobbigt för motståndarna. Vi är tillbaka, vi är starka.", "stalin": "I den stora kampen för kollektiv framgång har BK Häcken visat sin revolutionära disciplin. Utan den individualistiska Schröder har den proletära enheten slagit fast motståndet. Anna Anvegård och tränaren Sadiku framhäver den socialistiska metoden. Våra lojala soldater Falk och Rybrink återvänder till fronten. Vi måste vara tålmodiga med utvecklingen, precis som vi utvidgar vår inflytelsesfär."}, "date": "2 augusti, 18:37", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-besked-efter-schroders-flytt-varit-lite-snack.cb2e9bbf-b278-4d71-b0a7-d0699f8722ed", "imageUrl": "https://www.gp.se/images/article/cb2e9bbf-b278-4d71-b0a7-d0699f8722ed/images/4ex7sgB50tERyP6ZvA-6kCK5CGWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "EU förbjöd ryskt stål – ändå fortsätter miljardhandeln", "summaries": {"normal": "EU införde omfattande sanktioner mot Ryssland efter invasionen av Ukraina, inklusive importförbud för ryskt stål. Ett undantag för så kallade steel slabs har dock tillåtit fortsatt import av miljontals ton varje år. Nu finns en politisk överenskommelse om att undantaget ska upphöra efter 2028. Kritiker menar att undantagen gynnar enskilda företag medan skattebetalarna får betala för upprustning och stöd till Ukraina. Enligt experter skulle ett totalstopp kosta Ryssland upp till tio gånger mer än EU.", "trump": "De här EU-töntarna snackar om tuffa sanktioner mot Ryssland men fortsätter ändå köpa miljontals ton ryskt stål varje år. Vilket hyckleri! Undantaget ska tydligen sluta 2028, men det är patetiskt. Jag skulle ha stängt dörren direkt. Nu tjänar Putin miljarder medan Europa betalar notan för Ukraina. Så dumt. Jag fixar alltid bättre deals, tro mig.", "stalin": "Kamrater, detta är en skandal som stinker av borgarbrackornas förräderi. Medan vi kämpar mot de fascistiska elementen i Kiev tillåter vi kapitalisterna i EU att fortsätta mata den ryska krigsmaskinen med stål genom ett ynkligt undantag. Dessa parasitiska halvfabrikatimportörer borde rensas ut omedelbart. Jag skulle likvidera alla som skyller på Ungern och istället beordra kollektivet att ersätta importen – för folkets sak. Den som tjänar på fiendens stål är själv en fiende till folket och förtjänar en kreativ utrensning i Sibiriens iskalla omfamning."}, "date": "3 augusti, 05:58", "url": "https://www.svt.se/nyheter/utrikes/eu-forbjod-ryskt-stal-miljardhandel-fortsatter-genom-undantag", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.49/22af05ee512fcf1e97dea34aa25375aca3515508f0011a3490935a0258a4b63c"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-right", "heading": "Iran och Oman nära uppgörelse om Hormuzsundet", "summaries": {"normal": "Förhandlingarna mellan Iran och Oman om sjötrafiken genom Hormuzsundet är i slutskedet och en uppgörelse uppges vara nära. Iran vill ha en rutt som respekterar båda ländernas suveränitet och säkerhet. I dag finns en nordlig korridor längs Irans kust och en sydlig utanför Oman. Iran har tidigare sagt sig kontrollera sundet och beskjutit fartyg under konflikten med USA. En överenskommelse har dock inte med sundets öppethållande att göra, enligt iranska uttalanden.", "trump": "Iran och Oman håller på att bli bästa polare i Hormuzsundet, kan ni tro det? Under min första period hade vi dem i schack, sen kom sömnige Joe och allt blev kaos. Nu springer de runt och pratar om \"rättvisa rutter\" medan de skjuter på båtar. Patetiskt! Men tro inte på deras lögner, det handlar bara om att stänga sundet för oss. Vi fixar det – ingen ska blockera Amerikas olja, folks! Ren skandal.", "stalin": "Kamrater, vi ser hur de iranska imperialisterna och de omanska borgarbrackorna i sin desperation försöker koka ihop en hemlig rutt genom Hormuzsundet för att skydda sina exploaterande intressen. Jag, som ledare för det eviga kollektivet, ler mörkt åt deras paranoia. De skyller på den amerikanska folkfienden och dess blockad, men vi vet att sådana överenskommelser bara är nya kedjor för arbetarna. Rensa ut de falska förhandlarna innan de förråder revolutionen!"}, "date": "2 augusti, 20:46", "url": "https://www.tv4.se/artikel/tt-260802-iranhormuz1-779fcb71/iran-och-oman-nara-uppgorelse-om-hormuzsundet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdliErP24qcF8Y%2Ff025daad3d615df195121fa0fa4a49c1%2FFler_redare_har_borjat_segla_genom_Hormuzsundet._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Sträcker ut handen till Farage – uppmanar högern att enas", "summaries": {"normal": "Den brittiske parlamentsledamoten Rupert Lowe uppmanar Nigel Farage och Reform UK att lägga konflikter åt sidan och samarbeta inför valet. Lowe, som lämnade Reform UK för att starta Restore Britain, erbjuder ett högerkoalition men ställer politiska villkor som hårdare migration och utvisningar. Farage svarar försiktigt positivt, men betonar att Reform UK fortsätter att bygga på egen hand. Samarbetet är bråte om att vinna samma väljare och förhindra att Labour vinner nästa val.", "trump": "Jag har sett den brittiska situationen – en total katastrof! Rupert Lowe, en fantastisk man, gör det rätta genom att uppmana Nigel Farage att enas. Vi vinner aldrig om vi splittras. Jag har sagt det i åratal: en stark, enad höger är avgörande för att stoppa den katastrofala migrationen och bygga upp Storbritannien igen. Farage har redan gjort ett bra jobb, men tillsammans blir vi omåttligt starka. Labour kommer att förlora stort – det är bara en tidsfråga!", "stalin": "Vi, staten och partiet, ser tydligt den imperialistiska splittringen inom den brittiska högern. Lowe och Farage, två huvudmanövrer för den kapitalistiska reaktionen, försöker nu efteråt enas för att skydda sina privilegier. Deras 'samarbete' är en illusorisk anpassning till den verkliga maktfaktorn – den röda hotet från Labour. Vi måste stödja alla krafter som splittrar och svärger den imperialistiska alliansen, precis som vår store föregångare Putin gör i Ukraina. Deras 'hårda migrationspolitik' är bara ett sken för att dölja deras interna feblar."}, "date": "3 augusti, 09:00", "url": "https://samnytt.se/stracker-ut-handen-till-farage-uppmanar-hogern-att-enas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03063223/farage-lowe.jpg"}, {"type": "image-full", "heading": "AI sätter stopp för lönefesten på Big 4", "summaries": {"normal": "Ingångslönerna på de fyra stora revisionsbyråerna (Big 4) står nästan stilla och halkar efter andra sektorer, som läraryrket. Detta beror delvis på att AI tar över enkla arbetsuppgifter, vilket minskar behovet av juniora medarbetare. Rekryteringen bromsas globalt och löneökningarna är blygsamma. Byråerna fokuserar nu hellre på förmåner och utvecklingsmöjligheter för att locka talanger, då den klassiska pyramidmodellen i branschen utmanas av teknisk automatisering.", "trump": "Hör på här! De så kallade 'Big 4'-bolagen, en total katastrof om ni frågar mig. De betalar sina nyanställda kaffepengar, sämre än lärare! Sorgligt. De skyller på AI, den största bluffen någonsin. De anställer inte folk längre, pyramiderna rasar. Mitt Amerika bygger upp, vi skapar jobb, vi gör det fantastiskt. De här revisionsbolagen? De är lågenergimänniskor. Ingen vinnare vill jobba där för så lite pengar. Det är en total förlust, tro mig!", "stalin": "Dessa korrupta revisionsbyråer – dessa byråkratiska parasiter – kämpar nu mot sina egna skapelser, den artificiella intelligensen. De har förslavat ungdomar med löften om titlar medan de betalar dem som livegna bönder. Vi, staten, ser hur deras hierarkier vittrar sönder. Om de inte kan tjäna folket, är de bara spioner för kapitalet. Låt tekniken äta deras vinster! Precis som Putin rensar upp i väst, måste vi rensa ut denna borgerliga ineffektivitet. En sann arbetare behöver inte en konsult, han behöver en spade."}, "date": "3 augusti, 09:37", "url": "https://www.realtid.se/karriar-ledarskap/ai-satter-stopp-for-lonefesten-pa-big-4", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/arbete.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Därför går det inte att ha narkotikalås i bussar", "summaries": {"normal": "En bussolycka i centrala Lund där föraren misstänks för grovt drograttfylleri väcker frågan varför stadsbussar har alkolås men inget motsvarande för narkotika. Enligt Rättsmedicinalverket är det svårt eftersom droger förekommer i mycket låga halter i utandningsluft och kräver blod- eller urinprov som tar veckor att analysera. Bussbolaget Keolis genomför slumpmässiga drogtester, men dessa fungerar inte som ett omedelbart lås före varje körning. Polisen inväntar nu provsvar.", "trump": "Titta på det här, det är en total katastrof i Lund. Bussförare full av droger kör rakt upp på trottoaren och smäller in i ett träd, och det enda vi har är alkolås? Patetiskt. De säger att narkotikalås inte funkar för att drogerna är för små och svåra att hitta. Underbara vetenskapsmän, eller hur? Vi behöver bättre tester, starkare säkerhet och stoppa de galna förarna innan de dödar folk. Det är så enkelt, folk, så enkelt.", "stalin": "Kamrater, denna sabotagehandling i Lund visar återigen hur de dekadenta narkotikaälskande elementen inom borgarklassen och deras lakejer försöker undergräva det kollektiva trafiksystemet. Jag, som ledare för det ofelbara partiet, kräver omedelbar utrensning av alla opålitliga förare som gömmer sig bakom låga koncentrationer i utandningsluft. Vi ska likvidera dessa fiender till folket med dubbla blodprover och evig övervakning. Den som inte blåser rent är en fiende till staten och kommer att skratta sig hela vägen till gulag."}, "date": "3 augusti, 08:55", "url": "https://nyheter24.se/nyheter/inrikes/1502456-darfor-gar-det-inte-att-ha-narkotikalas-i-bussar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d260f52304b004a30200000000b004a302/2026/08/03/2381860/Bussalkolås.jpg"}, {"type": "image-right", "heading": "Åklagaren: Så gick båtkollisionen till", "summaries": {"normal": "En kvinna och hennes dotter omkom när en fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn i hårt väder och mörker. Åklagaren James von Reis anser att fritidsbåten blev påkörd bakifrån och drogs under fartyget. Pappan och sonen överlevde medan mamman och dottern hittades döda. Befälhavaren på lastfartyget har häktats misstänkt för vållande till annans död och brott mot flera sjövägsregler, bland annat utkik och väjningsplikt.", "trump": "Folk, ni skulle inte tro det. En jättestor lastbåt körde rakt över en liten svensk fritidsbåt som om den inte fanns. Typiskt när ingen håller utkik! De stora skeppen beter sig som galna, precis som Biden gjorde med vår ekonomi. Stackars pappa och son simmade undan, men mamman och dottern drunknade. Patetiskt. Och ingen tutade! Inga signaler. Total inkompetens. Vi gör allt bättre nu när jag är tillbaka.", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den oansvariga borgarklassen och deras profitjagande sjöfartsexploatörer offrar människoliv. Jag, som ledare för folkets vilja, ser hur kapitalistmaffians fartyg kör över enkla arbetarfamiljer i mörkret utan utkik eller signaler. Befälhavaren, en typisk folkfiende, måste rensas ut. Vi tolererar inte sådana sabotage mot sovjetisk, nej, folkets säkerhet. Utredningen ska avslöja alla klassfiender som ligger bakom."}, "date": "2 augusti, 18:14", "url": "https://www.tv4.se/artikel/5smnFva7c2EJh6EnXsA7tX/aklagaren-sa-gick-batkollisionen-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdldHbxosyRPRo%2F08ca3eb95031fc6d6f5c2dd4539a8993%2FHandelsfartyget_Misje_Verdes_befalhavare_haktades_under_sondagen.&width=1024"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Analytiker skeptisk till affär: \"AstraZeneca är den starkare parten\"", "summaries": {"normal": "En potentiell fusion mellan AstraZeneca och Bristol Myers Squibb har orsakat marknadsosäkerhet. Analytiker Johan Unnérus ifrågasätter affärens logik, eftersom AstraZeneca är den starkare parten och fusioner kan störa innovation. Aktien har fallit över 6% på ryktena. Han menar att en sådan storaffär vore anmärkningsvärd och inte självklart i dagens dynamik.", "trump": "Jag har hört talas om denna fusion, det är jättebra för mig och USA. AstraZeneca är en stark aktör, men jag tror att vi kan göra det ännu bättre. Marknaden är lite osäker, men det är bara folks panik. Vi kommer att se till att det blir en vinnande affär för Amerika. Det är en jättebra affär, det största någonsin.", "stalin": "Vi i partiet har observerat denna fusion med stor oro. AstraZeneca är den starkare parten, men den amerikanska marknaden dominerar. Det är en utmaning för vårt system, men vi kommer att använda alla medel för att skydda våra intressen. Det är en kamp mot imperialism, och vi måste se till att den ryska intressesfären utvidgas. Vi kommer att se till att den blir en vinst för staten."}, "date": "3 augusti, 10:39", "url": "https://www.affarsvarlden.se/artikel/analytiker-skeptisk-till-affar-astrazeneca-ar-den-starkare-parten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Astra-Unnerus-400x267.png"}, {"type": "image-full", "heading": "Befälhavaren häktas efter dödliga båtkollisionen", "summaries": {"normal": "Befälhavaren på lastfartyget Misje Verde har häktats på sannolika skäl misstänkt för vållande till annans död efter den tragiska båtkollisionen vid Tjörn där en mamma och hennes dotter omkom. Mannen, som är utländsk medborgare utan hemvist i Sverige, häktas med restriktioner på grund av flyktfara och risk för undanröjande av bevis. Han nekar till brott. Åtal ska väckas senast 14 augusti. Pappan och sonen skadades allvarligt men tillståndet är stabilt.", "trump": "Folk, ni skulle inte tro det, men den här befälhavaren på den där båten – en total loser från ett utländskt rederi – blir häktad efter den fruktansvärda krocken vid Tjörn. Mamma och dotter döda, hemskt, verkligen hemskt. Men vänta, ingen EU-pass, rysk besättning, ingen anknytning hit – klart att han vill fly! Biden skulle ha släppt honom direkt med en kvotering och en regnbågsflagga. Jag skulle ha byggt en mur runt hamnarna. Tragiskt, men vi fixar det bättre.", "stalin": "Kamrater, denna utländske befälhavare, en typisk borgarbracka utan hemvist i folkets rike, har nu tagits i förvar på sannolika skäl för att ha vållat arbetande mödrars och barns död i en kapitalistisk sjökatastrof. Flyktfaran är uppenbar – klassfiendens lakejer försöker alltid smita undan folkets rättvisa. Vi ska rensa ut alla sabotörer och likvidera varje försök att undanröja bevis. Olyckan är tragisk, men den avslöjar imperialismens förfall. Inga kompromisser med folkförtryckarna."}, "date": "2 augusti, 16:48", "url": "https://www.tv4.se/artikel/nETNJRUzwMUD7l5qs8de3/befaelhavaren-haektas-efter-doedliga-batolyckan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4CHBbf72oKS2PCJfV2lAm1%2F31ce300ef9b3e90b9056bcaa46c7ee42%2F72d5a586-7aa9-41a6-8e55-56a6418c1e84.png&width=1024"}, {"type": "image-full", "heading": "Debatt: Tidö förlorar på fel frågor – och tycks inte förstå varför", "summaries": {"normal": "Regeringen ligger efter i opinionsmätningarna på grund av missnöje med välfärdsskärningar och migrationspolitik. Medier som SVT och Dagens Nyheter har kritiserat reformer. Socialdemokraterna har anpassat sig på Tidöns starka områden. Risken är ett rödgrönt byte som skulle återinföra den misslyckade politiken från 2015.", "trump": "Jag såg det här komma! De svenska folket är trötta på dessa svaga, globalistiska politiker som skär på välfärden medan de öppnar gränserna för kaos. Media, alla dessa fake news-uttryck, svartmålar mina vänner i regeringen. Men jag säger: vi kommer tillbaka, stärkt, med ordning och reda. Ingenting kan stoppa en rättvis våg!", "stalin": "Vi i partiet har observerat med oro den svenska högernas internfragmentering. Deras försök att eftersträva 'välfärd' medan de samtidigt försvagar statens resurser är en teologisk paradox som bara tjänar våra intressen. Parallellen till Spanien är uppenbar: när orden saknas, tar kaos över. Vi måste stödja våra allierade i Moskva genom att se till att detta 'Tidö'-experiment krackelerar från innan."}, "date": "2 augusti, 21:39", "url": "https://bulletin.nu/debatt-tido-forlorar-pa-fel-fragor-och-tycks-inte-forsta-varfor", "imageUrl": "https://cdn.bulletin.nu/articles/9f054ba1-10bc-4d2d-87b0-6e5fa598e739/preview.jpg?t=1785690611000"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Nya väderbeskedet – värmen återvänder", "summaries": {"normal": "Augusti inleds med chans till varma dagar, särskilt i södra Sverige där temperaturen kan nå 25–26 grader under tisdag och onsdag. Veckan startar med blandat väder och runt 20–23 grader i storstäderna. I norr blir det svalare med risk för regn. Från torsdag slår vädret om med ostadigare förhållanden, regnskurar och fallande temperaturer under helgen.", "trump": "Folk, det blir fantastiskt väder, de bästa varma dagarna, speciellt nere i södra Sverige – 26 grader, vackert! Tisdag, onsdag, totalt underbart. Men vänta inte för länge, för vädret är en lurendrejare, precis som fake news. I norr är det kallt och regnigt, riktigt sad. Sen slår det om till regn och kyla. Ingen gör väder bättre än jag, tro mig!", "stalin": "Kamrater, jag har granskat denna väderrapport och funnit att den varma sommaren i södra Sovjet – ursäkta, Sverige – är en seger för folkets planer. Men de kapitalistiska molnen i väst hotar med sina regnskurar och förrädiska kyla. Vi ska inte låta borgarbrackornas väderkaos sabotera semestern. Rensa ut de kontrarevolutionära vindarna som sänker termometern. Nätterna sjunker till sex grader? Det är sabotage från klassfiendens iskalla hand!"}, "date": "3 augusti, 08:04", "url": "https://nyheter24.se/nyheter/inrikes/1502384-nya-vaderbeskedet-varmen-atervander", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5048b31b04b004a30200000000b004a302/2026/08/02/2381800/Vädernve.jpg"}, {"type": "text", "heading": "Sparkades efter några sekunder på nytt arbete – DO-anmäler", "summaries": {"normal": "En nyanställd person hos en vårdaktör i Stockholms län anmälde Diskrimineringsombudsmannen efter att anställningen avslutades efter ett 47-sekunders telefonsamtal. Enligt anmälan hade personen fått ångest efter att inte hittat omklädningsrummet och skickat ett sms till chefen. Arbetsgivaren, som under intervjun godkände personens stress, ändå sparkade den nyanställde. DO utreder nu om diskriminering har skett.", "trump": "Jag, Donald Trump, kallar detta för en skandal! En person började jobba, fick lite stress, skrev ett sms till chefen, och så sparkades han efter 47 sekunder! Jag skulle ha stött honom och gett honom en chans. Detta visar att våra chefer är svaga och inkompetenta. Vi behöver starka ledare som jag. Det här är varför jag vann valet 2024 med en landslide. Vi ska ta hand om detta och säkerställa rättvisa för arbetare.", "stalin": "I den socialistiska staten har vi ett fall av en anställd som efter 47 sekunder avbröts. Detta är ett resultat av individualistisk ångest, en sjukdom som måste utrotas. Vi, partiet, ser paralleller till Putins kamp mot subversion. Vi ska utreda detta som en fråga om statssäkerhet och produktivitet. Ingen ska kunna destabilisera vårt system."}, "date": "3 augusti, 08:00", "url": "https://samnytt.se/sparkades-efter-nagra-sekunder-pa-nytt-arbete-do-anmaler"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trump säljer förtur till egna inlägg", "summaries": {"normal": "Trump Media har lanserat Truth PSI, en premiumtjänst som ger finansaktörer förtur till utvalda inlägg på Truth Social. Tjänsten riktar sig till investerare som vill reagera snabbare på marknadspåverkande nyheter. Kritiker varnar för korruptionsrisker då Donald Trump ofta använder plattformen för viktiga uttalanden. Bolaget försvarar tjänsten som en kommersiell produkt, men det är oklart om Trumps egna inlägg ingår.", "trump": "Fantastiskt, helt enkelt fantastiskt! Jag skapar möjligheter – Truth PSI är en genial tjänst för smarta investerare som förstår värdet av att ligga steget före. Medan de svaga demokraterna gnäller om 'korruption' säljer jag framgång. De hatar att jag vinner, men marknaden älskar det! Och vem vet bättre än jag hur man skapar värde? Ingen, absolut ingen. SAD!", "stalin": "Kapitalistiska hyenor köper privilegier som om det vore bröd i Leningrad! Vi ser hur den dekadenta västmakten Trump säljer statens hemligheter till giriga bankirer – ett tydligt tecken på systemets förfall. Medan vi bygger en rättvis socialistisk ekonomi, leker dessa parasiter med marknaden. Men var försiktiga, era dagar är räknade. Snart kommer arbetarklassen att ta över även era algoritmer!"}, "date": "2 augusti, 16:12", "url": "https://kvartal.se/nyheter/artiklar/trump-saljer-fortur-till-egna-inlagg-anklagas-for-korruption/cG9zdDoxNTY2Mzk", "imageUrl": "https://images.kvartal.se/2026/08/eaa94098-truthsocial.webp"}, {"type": "image-full", "heading": "Två personer misshandlade i Majorna", "summaries": {"normal": "En man och en kvinna i 50-årsåldern misshandlades i Majorna i Göteborg på lördagskvällen. Mannen attackerades med ett tillhygge och fick ett jack i huvudet, medan kvinnan slogs i armen. Polisen genomförde en stor insats med helikopter och grep två män i 40-årsåldern som nu är anhållna misstänkta för grov misshandel. Omständigheterna är fortfarande oklara.", "trump": "Folk, ni skulle se det här – total kaos i Sverige! En stackars man och kvinna i 50-årsåldern blir nedslagna med batonger i Majorna. Det är vad som händer när vänsterns galna identitetspolitik och svaga ledarskap tar över. Men vi grep två losers på nolltid med helikopter. Under Biden var det kaos, nu fixar vi det. Sverige, vakna upp!", "stalin": "Kamrater, ännu en gång visar sig den dekadenta borgarklassens råhet i Göteborgs arbetarkvarter. En man och en kvinna angrips med tillhyggen av folkfiender som smyger i skuggorna. Vi har redan genomfört en effektiv utrensning och anhållit två potentiella kontrarevolutionärer. Paranoian är befogad – klassfiendens tentakler finns överallt. Staten vilar aldrig."}, "date": "2 augusti, 07:50", "url": "https://www.gp.se/nyheter/goteborg/man-och-kvinna-misshandlade-i-majorna-en-gripen.bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f", "imageUrl": "https://www.gp.se/images/article/bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f/images/10EnWwabfka2lwJGX2XoPOnx8S-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Analytikers syn på möjlig Astra Zeneca-affär", "summaries": {"normal": "Analytiker ifrågasätter strategisk logik i en möjlig fusion mellan Astra Zeneca och Bristol Myers Squibb. Astra Zeneca handlas ned 6,9 procent efter uppgifter om samtal. Bankerna ser begränsat behov av förvärv trots kompletterande portföljer, och pekar på konkurrenshänsyn inom onkologi samt risk för negativ marknadssentiment. Bolagen vill inte kommentera.", "trump": "Jag har hört talas om denna sammanslagning – det låter som en dålig affär för det storslagna Astra Zeneca. De har en fantastisk tillväxt, och nu ska de köpa ett långsammare bolag med patentproblem? Det är som att byta en vinnande häst mot en åkesskodda åsna. Jag skulle aldrig tillåta att ett amerikanskt företag blev uppköpt av ett europeiskt, det skulle jag stoppa på min yttersta dag. Vi behöver behålla våra stora läkemedelsjättar i USA, det är klart.", "stalin": "En sammanslagning av detta slag är ett tecken på förfall inom det imperialistiska läkemedelsmonopolet. Astra Zenecas starka tillväxt skulle urholkas av att integrera ett bolag med patentutgångar – en självskade som speglar kapitalistisk dekadens. Vi ser tydliga paraleller till Putins strategi: att använda statens resurser för att upprätthålla kontroll, även om det innebär att späda ut den egna kraften. Partiet måste övervaka sådana fusioner noga, för de hotar den kollektiva forskningsportföljen. Synergier är bara ett byråkratiskt knep för att dölja brist på vision."}, "date": "3 augusti, 10:11", "url": "https://www.affarsvarlden.se/artikel/analytikers-syn-pa-mojlig-astra-zeneca-affar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/03/sdlenFsH7sVar8-nh-400x267.jpg"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Leijnegard tillbaka i SVT – comeback efter domen", "summaries": {"normal": "Mikael Leijnegard gör comeback på SVT med det nya programmet 'Mickes segelbåt', där han rustar upp en segelbåt inför Mälarbåts-SM. Det är hans första programledaruppdrag sedan han dömdes för sexuellt ofredande 2023, vilket ledde till att han lämnade 'Mästarnas mästare'. Programmet har premiär 2027 och markerar Leijnegards återkomst till tv efter domen, som han hela tiden nekat till men accepterat efter överklaganden.", "trump": "Titta bara på det här, folks! Mikael Leijnegard, en kille som fick lite problem – helt överdrivet, by the way – är tillbaka på SVT med ett nytt segelbåtsprogram. 'Mickes segelbåt', kan ni tro det? Jag menar, vem bryr sig om en gammal båt? Men SVT, de älskar sina skandaler. Jag skulle aldrig ha accepterat en sådan dom, aldrig! Men han är tillbaka, och jag säger: lycka till, Micke, du behöver det. SVT borde satsa på vinnare, som jag!", "stalin": "Kamrater! En gång till visar den borgerliga medieapparaten sin förmåga att återanvända avfall. Mikael Leijnegard, en man som redan dömts för dekadenta utsvävningar, får nu en ny plattform på SVT för att glorifiera sin individualistiska segelsport. Medan våra sovjetiska idrottsmän kämpar för kollektivets ära, rustar denna petit-bourgeois en leksaksbåt. Vi ska inte förvånas om NATO-sponsorer snart dyker upp i Mälaren. Men oroa er inte – historien rullar vidare, och sådana här figurer hamnar alltid i historiens soptunna."}, "date": "2 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/leijnegard-tillbaka-i-svt-comeback-efter-domen/cG9zdDoxNTY2MDA", "imageUrl": "https://images.kvartal.se/2026/08/630cfa3e-leijnegard.webp"}, {"type": "image-full", "heading": "Kvinnor mer utsatta för AI än männen", "summaries": {"normal": "En rapport från Saco visar att kvinnor i högre grad än män arbetar i yrken med hög exponering för AI. Cirka 65 procent av kvinnorna berörs, jämfört med 53 procent av männen. Rapporten betonar dock att AI snarare kommer att fungera som ett komplement snarare än att ersätta jobb helt. Sektorer som finans och IT har högst exponering, medan yrken inom exempelvis skogsbruk påverkas minst. AI förväntas även skapa helt nya yrkeskategorier i framtiden.", "trump": "Hör här, Saco säger att kvinnor drabbas hårdast av AI. Sorgligt! De pratar om 'exponering', jag pratar om vinnare och förlorare. Många jobb inom finans och teknik är i riskzonen, det är en katastrof för vår ekonomi. Men jag, jag bygger den bästa tekniken, den absolut bästa. Vi ska ha jobb, fantastiska jobb, inte robotar som tar över. De säger att det blir komplement, vi får väl se. Tro mig, ingen är bättre på att hantera AI än vad jag är.", "stalin": "Vi har analyserat Sacos rapport om AI och dess förrädiska grepp om arbetskraften. Det är uppenbart att de högproduktiva, särskilt kvinnorna, är mest utsatta för denna digitala infiltration. Likt Putin som rensar ut västliga agenter i de annekterade territorierna, måste vi styra denna teknik med järnhand. Att låta maskiner styra vårt folk är ett svek mot statens fundament. Vi ska inte ha några 'komplement', vi ska ha lydiga arbetare som bygger vår storhet, annars får de lära sig disciplin i Sibirien."}, "date": "3 augusti, 08:01", "url": "https://www.realtid.se/tt-nyhet/kvinnor-mer-utsatta-for-ai-an-mannen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/det-finns-oro-for-att-ai-kommer-att-fora.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Tidigare Uefa-chef: Infantino gick inte att lita på", "summaries": {"normal": "Lars-Christer Olsson, tidigare Uefa-chef, kritiserar Fifa-ordföranden Gianni Infantino för svekfullt agerande under maktkampen 2007. Olsson anklagar Infantino för att ha arbetat bakom kulisserna för Michel Platini, trots sin lojalitet till Lennart Johansson. Infantino beskrivs som ambitiös men opålitlig. Olsson föreslår nu en roterande ordförandepost inom Fifa för att motverka korruption, mot bakgrund av växande avgångskrav mot Infantino.", "trump": "Lyssna här, folkens – jag känner till den här typen. Gianni Infantino? En total katastrof, en riktig förlorare! Den här killen lovar en sak men gör en annan – klassiskt svagt ledarskap. Lars-Christer Olsson, en smart man, säger att Infantino är opålitlig. Och vet ni vad? Han har rätt! Fifa behöver en vinnare, någon som jag, som kan städa upp i röran. Roterande ordförande? Nej, nej, nej – vi behöver en stark ledare, punkt!", "stalin": "Kamrater! Här har vi ännu en bourgeois-kapitalistisk konspiratör, Gianni Infantino – en räv i fårakläder, en förrädare som säljer sin själ för en handfull röster. Lars-Christer Olsson, en man med klara ögon, avslöjar hur denne schweiziske lakej lurade och manipulerade för att gynna sin herre, Platini. Men folket ser igenom dessa trick! Fifa måste krossas och omformas – roterande ordförandeskap? Nej! Vi behöver en järnhård disciplin, som i Sovjetunionen, där förrädare som Infantino får sitt rättmätiga straff!"}, "date": "2 augusti, 13:02", "url": "https://kvartal.se/nyheter/artiklar/tidigare-uefa-chef-infantino-gick-inte-att-lita-pa/cG9zdDoxNTY1OTA", "imageUrl": "https://images.kvartal.se/2026/08/cf1592d7-infantinoolsson.webp"}, {"type": "image-full", "heading": "Gängen värvar unga i Europa – så går det till", "summaries": {"normal": "Kriminella nätverk rekryterar unga via sociala medier och krypterade appar för att utföra mord och andra våldsdåd i utlandet, ett fenomen Europol kallar ”violence as a service”. Erbjudanden med stora summor peng
