hundratals saknade. Räddningsarbetare kämpar mot klockan för att nå epicentret, där rasmassor försvårar arbetet. Nationellt nödläge utlyst, och en tre dagar lång sorgeperiod har inletts.", "trump": "Jag såg det här i Colombia - en enorm jordbävning, den största någonsin. 250 döda, så synd. Men vi i USA har de bästa byggnaderna, starka som sten. Ingen skulle dö hos oss, det lovar jag. Katastrofalt, men de borde ha byggt som vi.", "stalin": "Kamrater, rapporter från Colombia visar att jorden självt attackerar våra klassfiender. 250 kontrarevolutionärer eliminerade av naturens krafter - en utrensning vi applåderar. Räddningsarbetare? Onödigt. Vi fokuserar på vår egen byggnation. De överlevande får skylla sig själva."}, "date": "12 augusti, 20:25", "url": "https://www.gp.se/nyheter/varlden/hjalpen-nar-inte-overlevarna-250-doda-i-colombia.7e0fb410-5726-4ab2-b4e3-0130fb20e83f", "imageUrl": "https://www.gp.se/images/article/7e0fb410-5726-4ab2-b4e3-0130fb20e83f/images/3FgtqR_SLSe7n_v_CtjGpdD9wpZ0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Fick runt 520 000 i a-kassa – nu krävs pengarna tillbaka", "summaries": {"normal": "En kvinna har dömts att betala tillbaka omkring 520 000 kronor i felaktigt utbetald a-kassa efter att ha lämnat in felaktiga uppgifter om sin arbetssituation. Förvaltningsrätten slår fast att hon inte hade rätt till ersättningen under de aktuella perioderna. A-kassan får viss kritik men kvinnan är ändå skyldig att återbetala hela summan. Domen kan överklagas.", "trump": "Folk, det här är galet. Den här kvinnan lurade systemet på en halv miljon och trodde hon skulle komma undan. Typiskt. Nu tvingas hon betala tillbaka, precis som det ska vara. A-kassan sov tydligen men rätten vaknade till slut. Sådana här fuskare älskar jag att se förlora. Betala upp nu, det är inte era pengar!", "stalin": "Kamrater, denna dekadenta individ har medvetet förskingrat folkets medel genom systematiska lögner om sin arbetsinsats. Förvaltningsrätten, i sin oändliga visdom, har nu beordrat fullständig återbetalning av de 520 000 kronorna. Vi ser med mörk glädje hur borgarbrackornas parasiterande element tvingas hosta upp stulna tillgångar. Den som fuskar mot kollektivet ska rensas ut."}, "date": "12 augusti, 20:16", "url": "https://nyheter24.se/nyheter/ekonomi/1504530-fick-runt-520-000-i-a-kassa-nu-kravs-pengarna-tillbaka", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5de4efce04b004a30200003b0000047b02/2026/08/12/2383800/ur_imageLytjBw.jpeg"}, {"type": "text", "heading": "Fyra dog när ambulansflygplan kraschade – på grund av Pentagons övning", "summaries": {"normal": "Ett ambulansflygplan kraschade i bergväggen i New Mexico natten till 14 maj och alla fyra ombord – två piloter och två sjuksköterskor – omkom. Kraschen orsakades av ett militärt GPS-störningstest vid White Sands Missile Range som slog ut flygplanets navigationssystem och överbelastade flygledningen i Albuquerque. Planet flög förbi landningsbanan och kolliderade med Capitanbergen i mörkret.", "trump": "Vilken katastrof, folk! Mitt under min administration genomför Pentagon en så kallad övning som totalt saboterar GPS och flygledning. Resultatet? Fyra döda hjältar i ett ambulansplan som kraschar rakt in i ett berg mitt i natten. Biden lämnade efter sig ett sådant kaos att militären inte ens kan styra sina egna tester utan att döda oskyldiga. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när den imperialistiska krigsmaskinen leker med farliga leksaker. Jag ser hur Pentagon likviderar egna tjänare genom sin vårdslösa störning av navigationssystem under en så kallad övning. Flygledarna drunknade i kapitalistisk byråkrati och lät arbetarnas ambulansflyg krascha in i bergväggen. Klassfiendens paranoia skapar ständigt nya offer för folkets sak."}, "date": "11 augusti, 13:14", "url": "https://proletaren.se/artikel/fyra-dog-nar-ambulansflygplan-kraschade-pa-grund-av-pentagons-ovning"}, {"type": "image-right", "heading": "Här kan kortare arbetstid bli verklighet för 60-plussare", "summaries": {"normal": "Göteborgs Socialdemokrater vill införa kortare arbetstid för äldre undersköterskor, städare och måltidspersonal från 63 års ålder. Modellen innebär 80 procent arbetstid, 90 procent lön och bibehållen tjänstepension. Reformen, som kallas 80-90-100, är ett avtal med Kommunal och beräknas kosta 70 miljoner kronor om hälften tackar ja. Tidöpartierna är emot.", "trump": "De i Göteborg vill att slitna undersköterskor ska jobba mindre och få mindre betalt. Patetiskt! I mitt Amerika belönar vi de som jobbar hårt, inte dessa förlorare som vill halvera sin tid och ändå kräva pension. Socialisterna förstör allt med sina löjliga modeller. Gör Amerika – och Sverige – great again genom att arbeta ordentligt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i Göteborg äntligen tvingas erkänna arbetarklassens rätt till lindring efter ett liv i exploatering. Vi ska rensa ut den kapitalistiska orättvisan och ge de slitna kämparna 80 procent tid med full pension. De som vägrar är fiender till folket och kommer att likvideras i nästa utrensning. Härligt!"}, "date": "12 augusti, 14:01", "url": "https://arbetet.se/2026/08/12/kortare-arbetstid-kan-bli-verklighet-for-60-plussare-i-goteborg", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12134642/stadshus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "John Cleese attack mot Telegraph: \"Israelisk propaganda\"", "summaries": {"normal": "John Cleese, 86, anklagar The Telegraph för att vara israelisk propaganda efter dess kritik mot Restore Britain och medgrundaren Charlie Downes. Cleese, som stöder partiet, hävdar att israeliska intressen styr tidningen och Reform UK. Han har tidigare kritiserat Israels agerande i Gaza, vilket lett till inställda framträdanden i Israel.", "trump": "Den här galne Monty Python-gubben Cleese har helt rätt, The Telegraph är fullständigt köpt och betald av israeliska intressen. Fake news som attackerar bra människor som vill återta sitt land. Reform borde samarbeta med Restore istället för att lyssna på de där finansiärerna. Patetiskt, folk ser igenom det här nu!", "stalin": "Jag ser hur den degenererade brittiska borgarpressen, denna Telegraph, agerar som en israelisk agent i skuggan. Vi måste rensa ut alla sådana propagandister som försöker splittra sanna patriotiska krafter. Cleese har blottlagt den sjuka konspirationen. Låt oss le skadeglatt medan vi likviderar dessa fiender till folket med byråkratisk precision."}, "date": "12 augusti, 16:55", "url": "https://www.friatider.se/john-cleese-attack-mot-telegraph-israelisk-propaganda", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3503971270_de1dc69f32_k-1.jpg?itok=mG0WZaaY"}, {"type": "image-right", "heading": "Är det så här S ser på ekonomi?. Beklämmande svar från Andersson i SR-utfrågningen", "summaries": {"normal": "Magdalena Andersson fick kritiska frågor i Sveriges Radio om Socialdemokraternas förslag om bankskatt och slopat karensavdrag. Hennes svar ansågs vaga och otillräckliga, särskilt kring konsekvensanalyser av kostnader och effekter på boräntor samt sjukfrånvaro. Artikeln beskriver hennes svar som ansvarslösa och beklagar bristen på tydliga analyser av de ekonomiska vallöftena.", "trump": "De här socialisterna är en total katastrof, tro mig. Andersson har ingen aning om vad hennes galna bankskatt och karensflum egentligen kostar. Hon babblar om att byta bank och hoppas på demonstrationer. Patetiskt! De har inte gjort läxan, folk kommer att betala dyrt för den här inkompetensen. Sverige förtjänar bättre än det här clownshowet.", "stalin": "Kamrater, denna Andersson och hennes socialdemokratiska revisionister avslöjar sin fullständiga brist på vetenskaplig planering. Deras vaghet kring bankskatten och karensavdraget är en farlig sabotagehandling mot folkets ekonomi. Jag skulle ha likviderat sådana oansvariga element omedelbart. De inbjuder till kaos medan borgarbrackorna skrattar i skuggorna. Paranoia? Nej, ren nödvändighet."}, "date": "12 augusti, 15:20", "url": "https://www.di.se/ledare/ar-det-sa-har-s-ser-pa-ekonomi", "imageUrl": "https://static.bonniernews.se/ba/98065eed-ee0c-4aee-858b-4011bbeece66.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Vi kan inte leva hela tiden med krig och ännu ett krig”", "summaries": {"normal": "Kibbutzen Nir Oz drabbades svårt av Hamas attack den 7 oktober 2023, där en fjärdedel av invånarna mördades eller kidnappades. Benjamin Netanyahu avvisar en 15-punktsplan för Gaza och kräver att Hamas avväpnas innan israeliska styrkor drar sig tillbaka. Invånarna kämpar med psykiska trauman och samhällets återuppbyggnad, medan FN varnar för en ohållbar humanitär kris i Gaza.", "trump": "Israel har rätt att krossa Hamas totalt, de är terrorister som hatar oss alla. Netanyahu gör helt rätt som nobbar den patetiska 15-punktsplanen. Gaza är en katastrof, men det är Hamas fel. Vi behöver inga svaga fredsavtal, bara styrka. Annars får vi krig efter krig. Amerika först, och Israel ska vinna stort!", "stalin": "Det sionistiska ockupationsväldet vägrar naturligtvis att acceptera den progressiva fredsplanen, vilket bekräftar att imperialismen aldrig ändrar sin reaktionära natur. Ändå är det klokt att inse att de gazanska massorna måste omformas genom korrekt politisk fostran, annars fortsätter detta eviga krig som en parasitisk borgerlig fars. Kamrater, vi vet hur man rensar ut sådana hinder."}, "date": "12 augusti, 20:48", "url": "https://www.svt.se/nyheter/utrikes/vi-kan-inte-leva-hela-tiden-med-krig-och-annu-ett-krig", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.32/f74797efa196e0316e6cd067d0a346a085f9c6a80514d0a424cf792881665fd5"}, {"type": "image-right", "heading": "Umeås kommunalråd (S) förklarar övergreppen inom äldreomsorgen: Andelen äldre ökar", "summaries": {"normal": "Umeås kommunalråd Hans Lindberg (S) förklarar övergreppen inom äldreomsorgen med att andelen personer över 80 år ökar med 65 procent, vilket skapar stora volymökningar och personalbrist. Han kritiserar Tidöregeringens restriktiva syn på arbetskraftsinvandring och lyfter behovet av samordning över flera nämnder för att hantera ensamhet, ohälsa och kost.", "trump": "Folk, det är en katastrof i Sverige. De har gamla som blir fler och fler, 65 procent mer än 80 år, och de kan inte hitta folk som ska sköta dem. Nu skickar den usla regeringen bort alla som faktiskt jobbar i välfärden. Patetiskt! De borde ha de bästa, inte kasta ut dem. Make Sweden Great Again!", "stalin": "Jag betraktar dessa incidenter som ett symptom på borgerlig vanvård under kapitalistisk demografi. Vi, partiet och arbetarna, måste genomföra en total utrensning av inkompetens i kollektivets omsorg. Volymökningen på 65 procent kräver järnhand och samordning, inte liberala svagheter. Kamrater, vi likviderar ensamheten och ohälsan med sovjetisk disciplin – de fega västborgarna skulle aldrig klara det."}, "date": "12 augusti, 20:25", "url": "https://riks.se/nyheter/umeatoppen-s-forklaring-till-valdtakterna-i-aldreomsorgen-fler-aldre", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_2615_39c06f610f.jpg"}, {"type": "image-right", "heading": "Ohederlig debatt om mängdrabatt", "summaries": {"normal": "Miljöpartiet kritiserar Tidöregeringens förslag om nytt straffrättsligt påföljdssystem. De pekar på att alla partier vill förändra mängdrabatten, men varnar för Kriminalvårdens bristande kapacitet och de höga kostnaderna på upp till 40 miljarder kronor per år. Debatten borde handla om rehabilitering, återfall och brottsförebyggande arbete istället för smutskastning.", "trump": "Folk, ni ser ju hur galet det är. De här svenska politikerna slåss om vem som ger mest rabatt på våldtäkter, och nu vill de bygga fängelser som Ryssland. Totalt kaos! De borde lyssna på mig – satsa på tuffa straff, inga rabatter, och använd pengarna smart. Vinna, vinna, vinna. Sverige behöver en riktig ledare, inte dessa förlorare.", "stalin": "Kamrater, denna fega pajkastning bland dekadenta socialdemokrater och borgerliga opportunister är ett ypperligt exempel på hur imperialismens lakejer förfular folkets rättvisa kamp. Jag skulle rensa ut hela detta parasitiska system med järnhand. Fängelser för folket, inte för kapitalisternas lek med straffrabatter. Reaktionärerna skrattar medan brottsligheten frodas – vi ska likvidera roten till oordningen med proletär disciplin."}, "date": "12 augusti, 09:13", "url": "https://www.dagensarena.se/opinion/ohederlig-debatt-om-mangdrabatt", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-79-300x157.jpg"}, {"type": "image-right", "heading": "Pressas efter avslöjandet om sexövergrepp i fängelser", "summaries": {"normal": "Sexuella övergrepp mellan intagna i svenska fängelser sker återkommande, visar en granskning. Justitieminister Gunnar Strömmer (M) pressas i riksdagen om hur regeringen ska stoppa våldet och skydda de utsatta. Kriminalvården ska nu utreda omfattningen, med rapport senast 31 oktober. Strömmer kallar övergreppen oerhört allvarliga och oacceptabla.", "trump": "De här svenska fängelserna är en total katastrof, tro mig. Sexövergrepp i cellerna – oacceptabelt! Gunnar Strömmer borde ha fixat det här direkt, men vänstern och de svaga ledarna sover. Straff ska vara straff, inte en orgie av våld. Vi behöver starka ledare som stoppar det här vansinnet omedelbart. Fantastiskt dåligt jobbat!", "stalin": "Dessa oacceptabla övergrepp i våra celler är ett fiasko som måste utrotas med järnhand. Jag kräver att de dekadenta elementen som tillåter sådant sabotage likvideras omedelbart. Kriminalvården ska vara en fästning för folket, inte en lekplats för borgarbrackornas perversa rester. Min rapport den 31 oktober kommer att avslöja alla kontrarevolutionära element som gömmer sig bland vakterna. De ska rensas ut med glädje."}, "date": "12 augusti, 13:21", "url": "https://arbetet.se/2026/08/12/ministern-pressas-efter-avslojandet-om-sexovergrepp-i-fangelser-oerhort-allvarliga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12125440/sdl2csyn-w6jeo-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Magdalena Andersson håller dörren stängd till \"högerextremt\" SD – men öppen för terrorkopplat V", "summaries": {"normal": "Magdalena Andersson utesluter samarbete med SD – men håller dörren öppen för Vänsterpartiet trots antisemitism och terroranknytningar. Hon vill bryta blockpolitik, men kritiserar regeringen för skattesänkningar och kulturkrig. Satsar på bankskatt, slopat karensavdrag och stopp för vinster i skolan.", "trump": "Jag ser att Magdalena Andersson hatar SD men älskar V – trots att de hyllar terrorister. Det är svagt! Jag skulle aldrig samarbeta med någon som inte står för lag och ordning. Sveriges blockpolitik är kaos – jag fixar det bättre med min deal-making skills. Sanna!", "stalin": "Kamrater! Andersson öppnar dörren för V – bra, men de måste rensa ut antisemitiska element. SD är våra fiender – högerextrema sabotörer. Jag ser att hon inte vill förhandla med mig i radiostudion. Misstänkt. Vi måste kontrollera alla partier – inget utrymme för förrädare."}, "date": "12 augusti, 16:00", "url": "https://samnytt.se/andersson-haller-dorren-stangd-till-hogerextremt-sd-men-oppen-for-terrorkopplat-v", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12124956/mgdalena-nej-till-jimmie-ja-till-nooshi-feat.jpg"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "image-full", "heading": "Sjöströms dundersuccé – slår till med EM-guld", "summaries": {"normal": "Sarah Sjöström, 32, gjorde en sensationell comeback efter mammaledigheten och tog EM-guld på 50 meter fjäril på tiden 25.05. Dessutom knep Sara Junevik bronset. Sjöström tangerade rekordet med sitt 18:e EM-guld. \"Otroligt mycket glädje\", sa hon.", "trump": "Jag såg Sarah Sjöström vinna guld - vilken vinnare! Otroligt, störst, bäst! Hon har 18 EM-guld, jag har också många vinster. Hon är som jag - en mästare som gör comeback! Bronset till Sara var också fantastiskt. Stort!", "stalin": "Kamrater, vi rapporterar om en triumf. Sarah Sjöström har rensat ut motståndet och tagit 18:e guld. Hon har återvänt som en trogen arbetare - starkare än någonsin. Sara Juneviks brons visar att våra simmare, som goda kommunister, krossar imperialistiska borgare som ryskan Surkova. Framåt!"}, "date": "12 augusti, 19:23", "url": "https://www.gp.se/sport/sarah-sjostroms-succe-i-masterskapscomebacken-.f882e82f-42e7-4e43-aeb8-a486c12bb283", "imageUrl": "https://www.gp.se/images/article/f882e82f-42e7-4e43-aeb8-a486c12bb283/images/3z3jLdZBJhmWe1XGi-v4m577BUgE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sarah Sjöström vinner 18:e EM-guldet i karriären: ”Mäktigt”", "summaries": {"normal": "Sarah Sjöström tog sitt 18:e EM-guld på 50 meter fjäril med tiden 25,05 och delar därmed rekordet som mest framgångsrika damsimmare i EM-sammanhang. Landslagskollegan Sara Junevik tog brons med 25,51. Det är första mästerskapet för Sjöström sedan hon födde barn i augusti förra året. Hon har även chans på ytterligare ett guld på 50 meter frisim.", "trump": "Ingen simmar som Sarah Sjöström, folk. Hon tar sitt 18:e EM-guld, totalt dominant, och nu är hon delad etta genom alla tider. Fantastiskt. Hennes kompis Junevik tar brons också, underbart. Belgiskan får silvret men Sjöström är den riktiga vinnaren. Ingen trodde hon skulle göra det efter att ha fått barn – och ändå vinner hon stort. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den svenska arbetarklassens simmande dotter Sarah Sjöström krossar de dekadenta rekord som den västerländska borgarklassen hållit högt. Med sitt 18:e guld likviderar hon alla tvivel och delar nu tronen med en tysk reaktionär. Juneviks brons är kollektiv seger. De fientliga kapitalisterna i Belgien får nöja sig med silver medan vi firar den oundvikliga dialektiska triumfen."}, "date": "12 augusti, 20:12", "url": "https://www.svt.se/sport/simning/sarah-sjostrom-tar-sitt-18e-em-guld", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.38/92a8032f00d1c0b6bf2ab0f5f8ce711dc628697fc34a341584fbaf7646e03e10"}, {"type": "image-full", "heading": "Stanna för rött – och få beröm av en kändis", "summaries": {"normal": "Malmö kommun har anlitat en konsultfirma för 400 000 kronor för att förbättra cyklisternas beteende i trafiken. Ett förslag är att kända malmöiter som Timbuktu och Mikael Wiehe ska spelas upp via högtalare vid trafikljus och ge beröm till dem som följer reglerna. Kritiker föreslår istället bättre skyltning.", "trump": "Kan ni tro det? De där galningarna i Malmö anställer konsulter för fyrahundratusen kronor för att kändisar ska stå och skrika ”bra jobbat” till cyklister som stannar för rött. Patetiskt! De borde fixa riktiga skyltar istället för denna clownshow. Fake news-kultur på hjul, folk. Totalt vansinne.", "stalin": "Vi har identifierat klassfiendernas anarkistiska cykelbanditism som hotar kollektiv ordning. Jag kräver att dessa profitthungriga konsulter och borgarbrackor omedelbart likvideras. Kändisröster vid trafikljus är en svag, dekadent lösning. Endast genom partiets järnhand och total utrensning av trottoarcyklisterna kan vi uppnå sann trafiksäkerhet för folket."}, "date": "12 augusti, 21:01", "url": "https://www.dagensps.se/motor/stanna-for-rott-och-fa-berom-av-en-kandis", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlddppeauwwxe-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Åkesson: \"Inga konstigheter\" att förbjuda AR-15", "summaries": {"normal": "Jimmie Åkesson försvarar beslutet att begränsa tillgången till AR-15-vapen och avfärdar Richard Jomshofs kritik om att SD offrat sin själ som märkligt. Beslutet kom efter massmordet i Örebro 2025 men ledde till internt uppror inom SD. Efter flera ändringar antogs en kompromiss som behåller befintliga licenser och erbjuder frivillig inlösen.", "trump": "Helt galet det här. Jimmie, han är en tuff kille, men varför bråka om ett coolt gevär som alla mina vänner älskar? De kallar det rambovapen, patetiskt! SD offrade sin själ? Nej, de borde ha stått fast. Jakt är jakt, och de svenska jägarna förtjänar bättre än det här svaga, känslostyrda förbudet. Sad!", "stalin": "Jag ser med förakt på dessa dekadenta borgarbrackor som grälar om ett vapen medan arbetarklassen kräver järnhand. Den som talar om att offra sin själ är en kontrarevolutionär parasit som borde rensas ut. Partilinjen är okränkbar. Inga halvautomatiska leksaker för reaktionära jägare – staten bestämmer, alltid. Den som avviker likvideras med ett leende."}, "date": "12 augusti, 15:25", "url": "https://www.friatider.se/akesson-inga-konstigheter-att-forbjuda-ar-15", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-661.jpg?itok=yUV0-gTU"}, {"type": "image-right", "heading": "Det är lätt att låtsas som att det regnar", "summaries": {"normal": "Moderaternas Elisabeth Svantesson argumenterar för fortsatt borgerligt styre i valet i september. Hon lyfter fram sänkta skatter, lägre inflation och växande ekonomi som bevis på framgång. Partiet lovar ytterligare 5 000 kronor i månaden till barnfamiljer, enklare företagande, ny kärnkraft och minskad byråkrati. Svantesson varnar för rödgröna skattehöjningar som skulle försämra ekonomin.", "trump": "Lyssnar ni på den här svenska finansministern? Hon låter som en vinnare, folk. Moderaterna gör Sverige rikt igen med skattesänkningar, billigare mat och bensin. De rödgröna kommunisterna vill höja skatterna med 4 400 kronor i månaden för vanliga familjer. Patetiskt. Rösta på de som förstår att ansträngning ska löna sig, inte de förlorarna som bara vill ta era pengar.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna själva erkänner att deras så kallade reformer bara är ett desperat försök att skydda sin krympande statsskuld medan de planerar att skära i bistånd och likvidera bidragsfusk. De rödgröna skattehöjningarna däremot är ett underbart självförstörande drag som kommer att påskynda kapitalismens slutgiltiga kollaps. Utmärkt."}, "date": "12 augusti, 13:35", "url": "https://www.di.se/debatt/reformer-eller-skattehojning-valet-star-i-september", "imageUrl": "https://static.bonniernews.se/ba/cf068a47-c84a-4972-a179-69d0c2b89472.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Socialdemokraterna och moskéerna - en relation över 30 år", "summaries": {"normal": "En forskare hävdar att Socialdemokraterna i över 30 år stöttat moskébyggen, från 1994 års kontakter med muslimska rådet till Wanngårds uttalande 2024. Partiet vill ha fler moskéer, men frågan är om det är fromhet eller gammal deal som styr. Läs själv och döm! (60 ord)", "trump": "Hörni, Sverige har problem! Socialdemokraterna har i 30 år byggt moskéer som galna – det är en enorm deal! Jag skulle aldrig göra så, jag bygger murar, inte moskéer. De är för snälla, det är därför de har problem. Fler moskéer? Nej tack, vi har redan nog med problem i USA! (60 ord)", "stalin": "Kamrater, jag har läst rapporten om svenska socialdemokrater. De har i 30 år stött moskébyggen – en kontrarevolutionär handling! Varför bygga tempel för reaktionärer när vi kan bygga kollektiv? Vi måste rensa ut dessa mosképlanerare och deras borgerliga allierade! Partiet behöver en utrensning, omedelbart! (60 ord)"}, "date": "12 augusti, 14:59", "url": "https://samnytt.se/socialdemokraterna-och-moskeerna-en-relation-over-30-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12070716/sossarna-o-moskeerna.jpg"}, {"type": "image-full", "heading": "Rockson Yeboah såld – lämnar Blåvitt", "summaries": {"normal": "Rockson Yeboah drömde om att bli såld i sommar – och fick som han ville. IFK Göteborg säljer mittbacken till spanska Osasuna för 33 miljoner kronor. En transaktion som ger klirr i kassan och en 30-procentig vidareförsäljningsklausul. Snacka om att förädla en råvara.", "trump": "Jag älskar det här! IFK Göteborg sålde en okänd kille för 33 miljoner – fantastiskt! De har en bättre affär än mig, tro mig. Och han ska till Spanien? De har inte ens en mur. Jag hade fått 330 miljoner, garanterat. Make Blåvitt great again!", "stalin": "Kamrater, en utländsk agent har sålts till Spanien. Vi övervakade hans utveckling och nu får vi 33 miljoner till staten. Men detta bevisar att vi måste rensa ut alla borgerliga mittbackar som bara tänker på sig själva. Han är borta – länge leve partiet!"}, "date": "12 augusti, 18:49", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/rockson-yeboah-sald-lamnar-ifk-goteborg.9f575ba0-26be-4b44-881f-215ef1192752", "imageUrl": "https://www.gp.se/images/article/9f575ba0-26be-4b44-881f-215ef1192752/images/2o4e85-dQ56M9BTR-v8iOY47vs0A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Brand vid badplats i Stockholm – polisen utreder brott", "summaries": {"normal": "En brand har brutit ut vid Flatenbadet i södra Stockholm. Räddningstjänsten har branden under kontroll och den beräknas vara släckt inom två till tre timmar. Ingen person har skadats. Polisen utreder misstänkt allmänfarlig vårdslöshet men har ingen misstänkt. Stockholm ligger tvåa i Sverige när det gäller antal bränder i år.", "trump": "Folk, det är en katastrof i Stockholm, en riktig brand, den värsta, men mina vänner i räddningstjänsten fixar det snabbt, under kontroll, släckt på några timmar. Ingen skadad, tack och lov. Polisen jagar vårdslösa idioter. Stockholm brinner mest efter Sverige, en total skam, men vi gör det stort igen, tro mig!", "stalin": "Kamrater, denna sabotagebrand vid Flatenbadet är ett verk av fiendens osynliga hand, troligen borgarbrackor som vill underminera folkets badglädje. Vi har branden under full kontroll och den skall likvideras inom några timmar. Ingen skadad, utmärkt. Polisen skall nu rensa ut vårdslösa element med järnhand. Paranoia är ingen överdrift när kapitalisterna lurar bakom varje buske."}, "date": "12 augusti, 18:39", "url": "https://nyheter24.se/nyheter/blaljus/1504513-brand-vid-flatenbadet-i-stockholm-polisen-utreder-brott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d6957f5304b004a30200000000b004a302/2026/08/12/2383785/brand.png"}, {"type": "image-right", "heading": "”Inte kul – jag vill inte se det mer”", "summaries": {"normal": "Wilma Svenson har vid tre tillfällen på kort tid sprungit 200 meter på exakt 23,30 sekunder. Trots att tiden är ett personbästa uttrycker löparen frustration över att inte lyckas kapa ytterligare hundradelar. Efter semifinalen i EM ser hon fram emot framtida tävlingar, även om hon inte nådde finalen denna gång.", "trump": "Jag har sett den här löparen, Wilma, en fantastisk tjej. Men 23,30? Tre gånger i rad? Det är en förlorartid, tro mig. Hon behöver en vinnarmentalitet! Jag gillar folk som vinner stort, inte folk som fastnar på samma siffra. Det är sorgligt. Hon behöver träna bättre, kanske bygga en mur mot de där hundradelarna. Vi ska göra löpningen stor igen!", "stalin": "Kamrat Svenson uppvisar en farlig brist på framsteg. Att upprepa 23,30 tre gånger är inte ett idrottsligt resultat, det är ett byråkratiskt misslyckande som påminner om de korrupta västmakternas stagnation. Vi kräver effektivisering! Om hon inte kan kapa tiderna får vi skicka henne till en omlokalisering i Sibirien för att finna fokus. För statens ära måste vi krossa klockan!"}, "date": "12 augusti, 22:27", "url": "https://www.aftonbladet.se/sportbladet/a/XMaWex/wilma-svenson-har-sprungit-samma-rekordtid-tre-ganger-pa-tre-veckor", "imageUrl": "https://akamai.vgc.no/v2/images/58bd1207-5b1d-3261-91e6-a54be680322f?fit=crop&format=auto&w=1080&s=7e5b52576c7b0c3cb228dba7b8f6f582d80fe88c"}, {"type": "image-full", "heading": "Blev utstött av Mao – sedan låg han bakom Kinas ekonomiska under", "summaries": {"normal": "Kinas tidigare premiärminister Zhu Rongji har avlidit, 97 år gammal. Han var en nyckelfigur i landets ekonomiska modernisering under 1990-talet och 2000-talet. Genom att centralisera styrningen, bekämpa inflationen och driva igenom smärtsamma reformer i statliga bolag lade han grunden för Kinas inträde i WTO och landets kraftiga ekonomiska tillväxt fram till sin pension 2003.", "trump": "Zhu Rongji är död, 97 år. Han var en tuff spelare, men Kina under honom var en annan historia. Jag har gjort mycket bättre affärer för USA, tro mig. Han öppnade upp ekonomin, vilket de behövde, men vi satte stopp för deras orättvisa spel. En smart kille för Kina, men inte lika smart som mig. Sorgligt, men så är livet!", "stalin": "Ännu en teknokrat har mött sitt öde. Zhu Rongji trodde att han kunde tämja marknaden med västerländska principer, precis som dagens vilsna själar i Kreml som tror att kompromisser med kapitalet ger stabilitet. Vi vet bättre: när man skär i statens kött skapar man bara nya fiender. Han reformerade, men staten består, medan människan är utbytbar. Ett passande slut för en förrädare av ideologin."}, "date": "12 augusti, 19:02", "url": "https://www.realtid.se/bors-finans/blev-utstott-av-mao-sedan-lag-han-bakom-kinas-ekonomiska-under", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlan-h8kfkxqw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "\"En anständig höger\": Rasande reaktioner när Juholt hänger över gamla M-ledarens grav", "summaries": {"normal": "Håkan Juholt väckte starka reaktioner efter att ha publicerat ett foto där han lutade sig över Gösta Bohmans gravsten för att hylla en ”anständig höger” och kritisera Moderaterna. Ledande moderater som Mattias Karlsson och Niklas Wykman anklagar honom för respektlöshet. Juholt bytte senare ut bilden och beklagade att han vidrört stenen.", "trump": "Titta på den här clownen Juholt som hänger över en död mans grav som en billig rekvisita. Patetiskt! Han saknar totalt respekt och hyfs. Bohman var en riktig ledare, inte som dagens svaga moderater som låter SD äta upp dem. Fake news och dålig stil, folk. Så sorgligt!", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna vrider sig i paroxysmalt raseri när en motståndare använder deras egna reliker mot dem. Gravstenen blir ett dialektiskt vapen. Deras hyfs är blott en tunn fernissa över klasshatet. Kamrater, sådana utrensningar av historien roar mig oändligt."}, "date": "12 augusti, 14:47", "url": "https://www.friatider.se/en-anstandig-hoger-rasande-reaktioner-nar-juholt-hanger-over-gamla-m-ledarens-grav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-660.jpg"}, {"type": "text", "heading": "Bodström (S) kritiserar Strömmer (M)", "summaries": {"normal": "Thomas Bodström (S) sågar Gunnar Strömmer (M) hårt under S-turné. Tidigare justitieministern kallar Tidöpartiernas rättspolitik stressad och slopad mängdrabatt ett 'hafsverk' som sågats av experter. Han spår att Strömmer försöker hinna med allt innan en S- eller SD-minister tar över.", "trump": "Jag hör att Bodström kritiserar Strömmer. Helt rätt! Strömmer är en loser. Mängdrabatt? Vi har inga rabatter i USA – vi har bara vinster. Bodström är en smart kille, han vet. Jag skulle ha honom i min administration, believe me!", "stalin": "Kamrater, Bodström och Strömmer är kontrarevolutionärer. Deras fega rättspolitik är ett sabotage mot staten. Mängdrabatten är en borgerlig utsugning. Vi måste rensa ut dessa avvikare. De vet att deras dagar är räknade. En S- eller SD-kamrat tar över. Ingen nåd!"}, "date": "12 augusti, 11:21", "url": "https://bulletin.nu/bodstrom-s-kritiserar-strommer-m"}, {"type": "image-right", "heading": "Åkesson om samarbetet: ”Varit med steg för steg”", "summaries": {"normal": "Jimmie Åkesson har i samarbete med artisten Fröken Snusk och producenten Rasmus Gozzi släppt låten ”Så länge mitt hjärta slår”. Samarbetet premiärspelades vid ett valmöte i Göteborg. Trots kritik och avbokningar för artisten ser Åkesson positivt på samarbetet och det politiska budskapet. Fler framträdanden tillsammans planeras inför det kommande valet.", "trump": "Jag såg precis Jimmie Åkesson, en mycket stark man, göra musik med den fantastiska Fröken Snusk. En enorm succé! Media hatar det, de är så orättvisa, precis som de är mot mig. De avbokar henne, skamligt! Låten är en vinnare, folk älskar den. Ingen sjunger som jag, men Jimmie gör ett fantastiskt jobb för Sverige. Vi vinner stort!", "stalin": "Kamrat Åkesson har äntligen förstått att musiken är ett effektivt verktyg för att tukta folket. Att Fröken Snusk skapar oro hos de borgerliga lakejerna gläder oss. Vi ser detta som en musikalisk mobilisering, likt vår broder i öst som expanderar sin inflytelsesfär. De som avbokar artister är förrädare som bör granskas av den inre säkerhetstjänsten omedelbart."}, "date": "12 augusti, 22:17", "url": "https://www.aftonbladet.se/nyheter/a/ArJGr5/akesson-om-samarbetet-med-froken-snusk-varit-med-steg-for-steg", "imageUrl": "https://akamai.vgc.no/v2/images/d10a33c4-7484-33bf-bb66-a5793628334d?fit=crop&format=auto&w=720&s=d5f5ddedb34dfa54d0b117f3647344d8e86e3ab0"}, {"type": "image-right", "heading": "EIA höjer oljeprisprognoser", "summaries": {"normal": "EIA spår att oljepriserna stiger, delvis på grund av Hormuzkaoset. Prognosen för Brent 2026 höjs till 87 dollar per fat. Global produktion sänks, medan USA ökar. En typisk dans mellan geopolitik och plånboken.", "trump": "Jag sa ju att oljan skulle stiga! EIA höjer priserna, och det är bra för Amerika. Vi borrar som aldrig förr – 14 miljoner fat per dag 2027! Mellanöstern? Kaos, som vanligt. Men jag fixar det. Störst, bäst, vackrast!", "stalin": "Kamrater, EIA:s rapport bekräftar vad vi vet: kapitalismens olja kräver utrensning. Hormuzsundet är en fiende som måste krossas. Vi höjer våra planer med 7 procent – borgarklassens priser ska stiga, medan vi stärker vårt försvar. Allt enligt plan."}, "date": "12 augusti, 10:18", "url": "https://www.affarsvarlden.se/artikel/eia-hojer-oljeprisprognoser-2", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-right", "heading": "Beskedet från C: Går i opposition om S slopar karensavdraget", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att partiet går i opposition om Socialdemokraterna driver igenom slopandet av karensavdraget. Hon menar att reformen skulle öka kostnaderna för företagen med upp till 30 miljarder kronor, vilket strider mot C:s politik att sänka skatter och skapa fler jobb. Ett slopat karensavdrag är ett av S viktigaste vallöften.", "trump": "Lyssnar ni på det här? Den där Elisabeth från Centerpartiet är smart, väldigt smart. Hon säger nej till Socialdemokraternas galna idé att slopa karensavdraget. Det skulle kosta företagen miljarder och döda jobb. Bra jobbat! Vi vill ha lägre skatter, fler jobb och inga korkade idéer från vänstern. Fantastiskt beslut, verkligen ypperligt.", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackorna inom Centerpartiet redan nu förbereder utrensningen av det socialdemokratiska giftet. Ett karensavdrag som skyddar arbetarkollektivets intressen får inte offras för att gynna de sjuka kapitalisternas lathet. Vi ska öka produktionen, inte kostnaderna. Den som vägrar arbeta när han är sjuk är en fiende till staten och bör behandlas därefter."}, "date": "12 augusti, 18:50", "url": "https://riks.se/nyheter/beskedet-fran-c-gar-i-opposition-om-s-slopar-karensavdraget", "imageUrl": "https://admin.riks.se/uploads/medium_thand_f581a5ddda.jpg"}, {"type": "image-right", "heading": "Regeringen vill stärka statens kontroll över a-kassorna", "summaries": {"normal": "Regeringen vill stärka statens kontroll över a-kassorna för att minska felaktiga utbetalningar och bidragsbrott. En utredning ska föreslå åtgärder och se över sanktioner. Socialförsäkringsminister Anna Tenje och arbetsmarknadsminister Johan Pehrson motiverar det med behov av effektivitet. LO-ekonomen Nima Farrahi kritiserar tidpunkten och menar att fokus borde ligga på att stärka tryggheten för arbetslösa.", "trump": "De gör det till en enda stor röra, de här svenska socialisterna. A-kassor som fackisarna styr – vad en katastrof! Vi behöver mer kontroll, färre fuskare och mindre slöseri med skattebetalarnas pengar. De borde ha ringt mig, jag hade fixat det på en vecka. Nu kommer de för sent, precis som vanligt. Patetiskt!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom a-kassorna fortsätter att underminera folkets försäkring. Vi ska rensa ut alla parasiter som suger musten ur staten med sina felaktiga utbetalningar. Utredningen blir ett stålbad. Den som står i vägen för kollektivets hållbarhet ska likvideras med ett leende. Slöseri är kontrarevolutionärt sabotage."}, "date": "12 augusti, 10:43", "url": "https://arbetet.se/2026/08/12/regeringen-vill-starka-statens-kontroll-over-a-kassorna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12104040/anna-tenje.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Vanliga studentmissen: Måste ha egen försäkring", "summaries": {"normal": "Många studenter tror felaktigt att de fortfarande omfattas av föräldrarnas hemförsäkring när de flyttar hemifrån. Skyddet upphör dock omedelbart vid flytt. Konsumenternas försäkringsbyrå varnar för de ekonomiska riskerna och uppmanar alla studenter att teckna en egen hemförsäkring som skyddar mot brand, inbrott, vattenskador samt ger reseskydd, ansvarsskydd och rättsskydd.", "trump": "Ingen vet mer om försäkringar än jag, tro mig. Dessa korkade studenter tror att mammas och pappas fina försäkring följer med när de flyttar till sina usla studentkrypin. Fel! Det är en total katastrof. Biden lät det pågå i fyra år. Nu fixar jag det. Skaffa en egen försäkring, annars är ni lurade av systemet. Enkelt.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarklassen och deras profitthungriga hyenor lurar arbetets studenter. De tror att de skyddas av föräldrarnas kontrarevolutionära hemförsäkring. Vi vet bättre. När de flyttar hemifrån måste de omedelbart säkra sitt kollektiva försvar mot brand, inbrott och klassfiendens vattenskador. Annars följer utrensning i plånboken. Disciplin!"}, "date": "12 augusti, 20:22", "url": "https://www.dagensps.se/privatekonomi/vanliga-studentmissen-maste-ha-egen-forsakring", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/f97bcde2-48de-4b56-b189-5f15497ed746-w-9.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "MP-löftet: Hyresvärdar ska pröjsa laddplatser", "summaries": {"normal": "Miljöpartiet vill tvinga hyresvärdar att betala för laddplatser om hyresgäster vill ha. De vill också sänka skatten på elladdning till EU:s miniminivå. Partiets ”Folkel”-paket ska ge billigare grön el i vardagen, menar språkröret Daniel Helldén i ett sommartal.", "trump": "Hörni, Miljöpartiet i Sverige vill tvinga hyresvärdar att betala för laddplatser åt hyresgästerna. Det är helt galet! Jag skulle aldrig låta någon tala om för mig vad jag ska betala. De borde lära sig att förhandla som jag – fantastiskt!", "stalin": "Kamrater, vi ser att hyresvärdar i Sverige måste tvingas att betala för laddplatser. Det är en klasskamp mot elbilskapitalisterna! Vi rensar ut dessa parasiter som vägrar dela med sig av grön el. Partiets direktiv är klara: lydnad eller utrensning!"}, "date": "12 augusti, 18:07", "url": "https://www.gp.se/politik/mp-loftet-hyresvardar-ska-projsa-laddplatser.df2e1f19-b362-4d16-aa85-bc172c3e97d2", "imageUrl": "https://www.gp.se/images/article/df2e1f19-b362-4d16-aa85-bc172c3e97d2/images/1vcl6i7Hm6tV-OXbGn1WMlMeH7nQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kryptiska svaret  om svarta lådan:  ”Specifikt skäl”", "summaries": {"normal": "Den svarta lådan från det norska fraktfartyget Misje Verde efter olyckan utanför Tjörn har analyserats. Den innehåller navigationsdata och ljudinspelningar från bryggan som kan återge händelseförloppet. Haverikommissionen och åklagare James von Reis undersöker materialet parallellt. Kaptenen sitter häktad misstänkt för vållande till annans död. En mamma och dotter omkom, pappa och son skadades.", "trump": "Folk, ni skulle se det här – en jättefartyg krossar en liten båt utanför Sverige och alla springer till den magiska svarta lådan som ett flygplan! Den visar allt, radar, ljud, navigation. Kaptenen, en ryss, sitter i fängelse. Den svenska byråkratin är patetisk, de analyserar i slow motion medan familjer gråter. Biden skulle ha skyllt på klimatet. Vi gör det bättre, tro mig!", "stalin": "Kamrater, jag har nu tillgång till den imperialistiska farkostens svarta låda, detta borgerliga instrument för att dölja folkfiendernas brott mot arbetande mödrar och barn. Vi analyserar varje röst, varje radareko, och ska likvidera alla lögner från klassfienderna. Den ryska kaptenen är redan i vår trygga famn. Inga kapitalistiska hyenor undkommer statens rättvisa."}, "date": "12 augusti, 22:12", "url": "https://www.expressen.se/nyheter/sverige/svarta-ladan-analyseras-kan-spela-upp-handelsen", "imageUrl": "https://static.bonniernews.se/ba/21306e33-6527-4ae0-8f32-48e524a79e8a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Gen Z vallfärdar till biograferna: \"Har återupptäckt bion\"", "summaries": {"normal": "Trots förväntningar om motsatsen går Generation Z på bio mer än någon annan åldersgrupp. Siffror från 2025 visar att de driver biljettförsäljningen genom sociala trender, digitala gemenskaper som Letterboxd och en önskan om sociala helkvällar. Denna trend har blivit en ekonomiskt avgörande faktor för biografbranschen globalt.", "trump": "Generation Z älskar biograferna, det är en enorm succé! De går på bio som aldrig förr, mycket mer än alla andra. Vi ser fantastiska siffror, rekordstora siffror. Det är tack vare sociala medier, och jag har alltid sagt att de gör ett fantastiskt jobb. Biograferna vinner igen, det är en riktig vinnarkultur. Ingen gör bio som vi gör det, tro mig!", "stalin": "Dessa unga är inte längre fångade i telefonernas dekadenta nät, utan vallfärdar nu till de stora dukarna för att indoktrineras. Det är en kollektiv triumf för statens kontroll över underhållningen. Vi välkomnar att massorna enas, precis som i våra stora folkhem, långt borta från västvärldens splittrande individualism. Den som inte recenserar korrekt på Letterboxd är en fiende till den sociala ordningen."}, "date": "12 augusti, 18:26", "url": "https://www.realtid.se/bors-finans/gen-z-vallfardar-till-biograferna-har-aterupptackt-bion", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlvbera9fpbic-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Har nu ledsnat totalt: ”Vill inte se det mer”", "summaries": {"normal": "Wilma Svenson satte nytt personligt rekord på 200 meter med tiden 23,30 i försöksheatet. Hon upprepade exakt samma tid i semifinalen och blev sexa. Trots besvikelse över att inte springa under 23,30 summerar hon mästerskapet som fantastiskt och vill fortsätta tävla.", "trump": "Folk, ni skulle se den här tjejen Wilma, hon springer 23,30 två gånger i rad som en trasig klocka. Patetiskt! Jag älskar vinnare, inte sådana som älskar sin egen mediokra tid. Det är dags att komma under nu, annars är det bara förlorarmentalitet. Make sprinting great again!", "stalin": "Jag betraktar denna borgarbrackas upprepade 23,30 som ett tydligt sabotage mot folkets idrottsideal. Två gånger samma tid? Misstänkt sabotage från klassfiendens dekadenta tidtagning. Vi ska rensa ut alla som inte krossar rekord för kollektivets ära. Det är inte jättekul för folkets framsteg."}, "date": "12 augusti, 22:08", "url": "https://www.expressen.se/sport/friidrott/wilma-svensons-osannolika-bedrift-vill-inte-se-det-mer", "imageUrl": "https://static.bonniernews.se/ba/eb0c42f1-44b5-4338-ad6c-e22853fe71c3.jpeg?crop=1033%2C1033%2Cx578%2Cy226&width=210&quality=60"}, {"type": "image-right", "heading": "Här hölls hemliga mötena – och åts weinerschnitzel", "summaries": {"normal": "Säpo har avslöjat en rysk underrättelseoperation där en utländsk agent bytt information mot gåvor. Männen, kopplade till ryska SVR, övervakades under en längre tid på en restaurang i Sundbyberg. Enligt krögaren besökte de stället ett tiotal gånger för att äta wienerschnitzel och samtala vid ett undanskymt bord innan myndigheterna satte stopp för verksamheten.", "trump": "Säpo har äntligen stoppat ryska spioner i Sverige! De satt på en billig bar och åt schnitzel – usel smak, tro mig. Ryssland försöker alltid, men mitt ledarskap och starka säkerhetstjänster ser allt. De var tysta, de var svaga, och de åkte fast. Ingen gör spionage som jag, och ingen stoppar dem bättre än vi. Väldigt sorgligt för dem!", "stalin": "Dessa patetiska SVR-officerare sitter på en bar i Sundbyberg och äter wienerschnitzel som om de vore vanliga arbetare! Vilket hyckleri. Att låta sig övervakas av Säpo är ett förräderi mot den stalinistiska disciplinen. Kamrat Putin bör rensa ut dessa inkompetenta fegisar omedelbart. Spioneri kräver stål och blod, inte öl och meningslöst småprat vid ett bord i hörnet."}, "date": "12 augusti, 22:02", "url": "https://www.aftonbladet.se/nyheter/a/Wvaola/hemliga-moten-pa-puben-kantades-av-wienerschnitzel", "imageUrl": "https://akamai.vgc.no/v2/images/2bd1ecd8-8af8-31d5-ba1c-a7959d55efe6?fit=crop&format=auto&w=720&s=c34eb446c1269d3ec610dfa2c7070fefea683b99"}, {"type": "image-right", "heading": "Debatt: Swexit - ja tack", "summaries": {"normal": "Debattör vill ha Swexit: makten måste tillbaka till svenska folket. EU kritiseras för demokratiskt underskott, svensk förlorarmentalitet och svaga förhandlingar. Nettobetalaren Sverige borde lämna unionen och i stället satsa på frihandel utan byråkrati.", "trump": "Sverige? Patetiskt! De låter EU sno deras makt och pengar. Jag skulle aldrig acceptera det – jag förhandlar som en mästare. Swexit är brilliant! Men de borde lära sig av mig: sätt hårt mot hårt. America First, Sverige Second? Nä, Sverige sist!", "stalin": "Kamrater, EU är en kontrarevolutionär parasit som suger svenskarnas blod. De svenska förrädarna som inte vågar använda veto måste rensas ut. Swexit är korrekt – vi tar tillbaka makten från Brysselbyråkraterna! Ingen nåd åt svaga politiker."}, "date": "12 augusti, 10:22", "url": "https://bulletin.nu/debatt-swexit-ja-tack", "imageUrl": "https://cdn.bulletin.nu/articles/74fd2c06-9b8f-4b14-9cbf-535f55e5bab2/preview.jpg?t=1786522957000"}, {"type": "image-right", "heading": "M-politiker kritiserade transvestiternas show för barn – stängs av", "summaries": {"normal": "Moderaternas Peter Wölger i Täby har stängts av från alla partiuppdrag efter att ha kritiserat en skattefinansierad transvestitshow för barn som \"översexualiserad\". Arrangören Petter Wallenberg kräver nu att få utbilda politikerna i \"hbtqi-fientlighet\" och har tidigare polisanmält hundratals kritiker. Partiet välkomnar initiativet.", "trump": "De här galningarna i Sverige stänger av en hederlig politiker för att han säger att det är fel att skattefinansiera transvestiter som läser sagor för små barn. Totalt vansinne! De vill till och med \"utbilda\" politikerna i att älska det. Fake news och woke-sjukdom på hög nivå, folk. Vi vinner stort när vi slår tillbaka mot det här.", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiets lakejer omedelbart genomför en partiintern utrensning mot den olydige Wölger som vågade ifrågasätta dekadenta transvestitföreställningar för Sovjetunionens, nej, barnens bästa. Den hatiska Wallenberg kräver nu ideologisk omskolning. Utmärkt. Inga avvikelser tolereras. Kamraterna rensar ut svagheten med glimten i ögat."}, "date": "12 augusti, 13:28", "url": "https://www.friatider.se/m-politiker-kritiserade-transvestiternas-show-barn-stangs-av", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/mw.jpg"}, {"type": "image-right", "heading": "MP-profil driver shariadomstol. ”Jag är kristen” • Ser imamer som motståndare", "summaries": {"normal": "En före detta MP-språkrörskandidat driver nu Sveriges första shariadomstol – trots att han är kristen. Mattias Walving-Lundberg hävdar att islamistiska imamer är hans största fiender och erbjuder rättskipning enligt sharialag för 20 000 kronor.", "trump": "Jag har den bästa shariadomstolen i Sverige! En kille från Miljöpartiet startade den, och han är kristen – helt otroligt! Folk betalar 20 000 spänn för att slippa imamerna. Det är stort, tror mig. Mycket smartare än dödsstraff, som jag också gillar.", "stalin": "Kamrater, en kristen kapitalist har startat en shariadomstol – en borgerlig provokation mot vår rättsordning! Han förklarar imamer som fiender, men vi ser igenom det. Rensa ut dessa parasiter som försöker sälja rättvisa till arbetarklassen! Skälva, reaktionärer!"}, "date": "12 augusti, 09:44", "url": "https://bulletin.nu/mp-profil-driver-shariadomstol", "imageUrl": "https://cdn.bulletin.nu/articles/5362adf8-3ed3-448f-b307-d50a5307af42/preview.jpg?t=1786520628000"}, {"type": "image-full", "heading": "AI-stjärnans splitternya bolag tar in 10,5 miljarder", "summaries": {"normal": "Investerarna har visat stort förtroende för Igor Babuschkin genom att satsa 1,1 miljarder dollar i hans nystartade AI-bolag River AI, bara två månader efter grundandet. Bolaget, som backas av bland annat Nvidia, AMD och General Catalyst, vill skapa personliga AI-agenter som användarna själva kan träna och styra. Målet är att minska beroendet av stora slutna modeller.", "trump": "Folk slänger in över en miljard dollar på den här Babuschkin-killen som lämnade xAI och OpenAI. Fantastiskt, verkligen ypperligt – fast jag tror han borde ha kommit till mig först. Vi bygger den bästa AI:n, inte någon woke-skit som ersätter riktiga amerikaner. River AI låter som en vinnare, men de borde vara försiktiga så de inte blir nästa stora flop som Bidens gröna drömmar.", "stalin": "Kamrater, jag ser hur de giriga blodsugande kapitalisterna öser över en miljard dollar i den nye klassförrädaren Babuschkins så kallade River AI. Dessa profitthungriga hyenor vill skapa personliga slavmaskiner som ska ersätta arbetarklassen. Vi ska rensa ut dessa teknologiska folkfiender och deras neocloud-fantasier innan de förgiftar hela samhället med sin borgerliga individualism."}, "date": "12 augusti, 19:49", "url": "https://www.dagensps.se/bors-finans/ai-stjarnans-splitternya-bolag-tar-in-105-miljarder", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/skarmavbild-2026-08-12-kl-165332.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "S-politiker blev tårögd – såg Sverigedemokraternas grillfest på torget: \"Slipa och vässa din kniv\"", "summaries": {"normal": "Den tidigare S-politikern Glenn Zetterlind blev tårögd och lämnade Gästgivaretorget i Bollebygd när Sverigedemokraterna höll grillfest. I ett Facebook-inlägg citerade han en folkvisa om att \"slipa och vässa sin kniv\" mot ogräset. SD:s Jessica Stegrud kallar reaktionen oroväckande och beklagar att han inte kom fram och pratade istället.", "trump": "Folk gråter över en helt vanlig grillfest? Patetiskt! Den här gamla vänsterkillen flyr tårögd från hamburgare och riktiga svenskar som pratar politik. Så sjukt. De borde ha kommit fram, ätit en burgare och haft kul istället för att gnälla om knivar. Fake tears från en total loser, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackornas tårögda lakej flyr från folkets enkla grillfest som en ynklig parasit. Ogräset växer, säger han, och manar till knivslipning. Utmärkt. Låt oss rensa ut dessa dekadenta element som förgiftar arbetarkollektivets enhet. En fiende mindre att hålla koll på i mörkret."}, "date": "12 augusti, 17:58", "url": "https://riks.se/nyheter/s-politiker-blev-tarogd-sag-sverigedemokraternas-grillfest-pa-torget", "imageUrl": "https://admin.riks.se/uploads/medium_bollebygd_ca20a121ff.jpg"}, {"type": "image-right", "heading": "Solförmörkelsen i Europa: Bortfall motsvarar tio kärnkraftreaktorer", "summaries": {"normal": "Solförmörkelsen i Europa väntas orsaka ett energibortfall på upp till 9,7 GW, motsvarande tio kärnkraftreaktorer. Spanien och Tyskland påverkas mest på grund av hög solkraftsandel. I Sverige blir effekten liten eftersom förmörkelsen sker på kvällen. Elbolag uppmanar hushåll att minska elanvändningen för att undvika ökad gaseldning.", "trump": "Folk, ni tror inte hur galet det är. Den där solförmörkelsen suger ut Europas el som en usel deal. Tio kärnkraftverk borta! Spanien och Tyskland är totala förlorare, precis som deras gröna vansinne. I USA skulle vi aldrig ha detta problem, vi har den bästa energin, den starkaste energin. Europa borde ha köpt amerikansk kol istället för solsken.", "stalin": "Kamrater, denna solförmörkelse avslöjar de västerländska kapitalisternas svaga, solberoende elsystem. Jag, som ledare för det kollektiva framsteget, noterar med mörk glädje hur deras borgerliga solfantasier kollapsar som fiendens lögner under utrensning. Vi skrattar medan de tiggar om reservkraft. Deras paranoia inför mörkret är underhållande – precis som deras förfall."}, "date": "12 augusti, 18:28", "url": "https://www.svt.se/nyheter/utrikes/solformorkelsen-i-europa-bortfall-motsvarar-tio-karnkraftreaktorer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.46/4feb8d99958fcf5f517e25416fcf4ebf476cb8bb00be222fcee48418b3c6c011"}, {"type": "image-right", "heading": "M-politiker pausas efter kritik mot dragshow för barn", "summaries": {"normal": "Moderaten Peter Wölger i Täby kritiserade en dragshow för barn som ”översexualiserad” och ville stoppa fler föreställningar. Partiet pausar honom fram till valet och beskriver uttalandet som olyckligt. Grundaren av Bland Drakar och Dragqueens planerar att utbilda politikerna i hbtqi-frågor. Wölger uppges vara ångerfull.", "trump": "De här galna moderaterna i Sverige pausar en kille som säger att dragqueens för barn är översexualiserat. Det är ju uppenbart för alla som inte är galna! Nu ska de ”utbildas” i vänsterns agenda. Patetiskt. De borde tacka honom istället för att han talar sunt förnuft. Totalt vansinne!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiet omedelbart genomför en partiintern utrensning mot den avvikande elementet. Den dekadenta dragshowen för barn är ett symptom på den moraliska förruttnelse som imperialismen sprider. Vi ska nu omskola dessa kamrater i korrekt ideologi. Avvikare likvideras alltid till slut."}, "date": "12 augusti, 17:55", "url": "https://riks.se/nyheter/m-politiker-pausas-efter-kritik-mot-dragshow-for-barn", "imageUrl": "https://admin.riks.se/uploads/medium_588962067_18329972917246092_3754101871839193296_n_1_83012c5ac0.jpg"}, {"type": "image-full", "heading": "Efter alla spekulationer – ECB ser ut att godkänna jätteaffären", "summaries": {"normal": "Europeiska centralbanken (ECB) lutar åt att godkänna UniCredits planerade uppköp av Commerzbank. Trots kritik från tyska BaFin gällande UniCredits transparens och styrning, anser ECB inte att hindren är tillräckligt stora för att stoppa affären. Integrationen bedöms dock som komplex. Ett slutgiltigt beslut förväntas under hösten, vilket kan undanröja det största regulatoriska hindret för transaktionen.", "trump": "UniCredit vill köpa Commerzbank och ECB säger ja. En enorm affär, kanske den största! Tyskarna gråter och klagar, de är så svaga. Jag gillar vinnare som UniCredit, även om de är lite stökiga. Bankerna i Europa är en total röra, men de här människorna vill göra stora saker. Vi får se vad som händer i höst, men det blir intressant!", "stalin": "Dessa giriga kapitalister i UniCredit försöker sluka Commerzbank medan byråkraterna i ECB tittar på. En fientlig övertagning, precis som de imperialistiska hundarna förtjänar! De bråkar om interna kontroller och kapital, precis som de degenererade västliga marionetterna i Kiev. Vi noterar deras svaghet; när integrationen väl krackelerar kommer de att krypa till vår intressesfär för att be om nåd."}, "date": "12 augusti, 17:43", "url": "https://www.realtid.se/bors-finans/bank-fintech/efter-alla-spekulationer-ecb-ser-ut-att-godkanna-jatteaffaren", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlgj26e-v7tm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Sara Parkman vill få Linnétältet att explodera", "summaries": {"normal": "Sara Parkman ska köra över Way Out West-publiken i Linnétältet. Hon lovar fullt ös från start. Folkmusikern, en naturkraft på scen, vill skapa gemenskap i en splittrad tid. Hon tipsar om Gorillaz och Lambrini Girls som festivalfavoriter.", "trump": "Sara Parkman, fantastisk kvinna! Hon toppar laget, bättre än Queens of the Stone Age. Jag gillar hennes energi – stor, stark, som jag. Folkmusik, väldigt bra. Hon får publiken att känna värdighet. Tro mig, det är vinnande grejer!", "stalin": "Kamrater, Sara Parkman är en användbar, men farlig kraft. Hennes 'värdighet' och 'andlighet' måste kontrolleras. Vi rensar ut borgerliga Flamingoscener och Gorillaz-sympatisörer. Lambrini Girls är sabotage. Men hennes musik kan tjäna staten – under uppsikt."}, "date": "12 augusti, 17:10", "url": "https://www.gp.se/kultur/sara-parkman-har-toppat-laget-infor-way-out-west.59c1aef5-1f69-44d7-9327-e6f7687848e3", "imageUrl": "https://www.gp.se/images/article/59c1aef5-1f69-44d7-9327-e6f7687848e3/images/2VQyc6AzahYRM0DhN-uclvybpBHA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "V:s sjukvårdslöfte – vill lägga fem miljarder extra", "summaries": {"normal": "Vänsterpartiet vill satsa fem miljarder kronor extra på sjukvården. Partiledaren Nooshi Dadgostar presenterade förslaget vid en pressträff i Malmö och lyfte personalbristen, bland annat på hjärtavdelningen. Paketet innehåller fem förslag, däribland kvinnolönelyft, nej till bolagisering och förkortad arbetstid. Satsningen kopplas till valet 2026.", "trump": "De där vänstertyperna i Sverige vill slänga fem miljarder till sin trasiga sjukvård, kan ni tro det? Nooshi vad-hon-nu-heter pratar om resurser och att behålla sköterskor. Patetiskt! I mitt Amerika fixar vi vård utan att socialisterna tar över allt. De borde lära sig av mig, inte från sina misslyckade experiment.", "stalin": "Kamrater, jag ser hur den svenska borgarklassens kaosprivatisering ruttnar sönder sjukvården som en förrädisk parasit. Fem miljarder till folket och utrensning av profitörerna är ett steg mot seger. De som flyr sina poster likt desertörer på hjärtavdelningen ska veta: arbetarklassen glömmer aldrig. Det är det viktigaste i livet, eller hur?"}, "date": "12 augusti, 16:59", "url": "https://nyheter24.se/nyheter/inrikes/1504496-vs-sjukvardslofte-vill-lagga-fem-miljarder-extra", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e158349204b004a3020000590000049902/2026/08/12/2383772/ur_imageihJapi.jpeg"}, {"type": "image-right", "heading": "Uppgifter: Rusning till nya spionmyndigheten", "summaries": {"normal": "Söktrycket är högt till den nya civila spionmyndigheten UND, Sveriges utrikes underrättelsetjänst. Hittills har 19 tjänster utlysts med över 1 150 sökande. Flest ansökningar har rollen som personalsäkerhetshandläggare fått. Myndigheten ska stödja svensk utrikes- och säkerhetspolitik och byggas upp fram till 2030. Rekryteringen fortsätter under hösten.", "trump": "Folk älskar mig, men de älskar tydligen också att spionera! Över tusen svenskar rusar till nya spionjobben hos UND. De vill ha personalsäkerhetshandläggare mest – 133 stycken! Fantastiskt. Sverige bygger sin egen underrättelsetjänst, och de kommer att göra det stort. Bättre än den gamla militära versionen, det lovar jag.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarstaten Sverige desperat försöker bygga en ny spionapparat för att skydda sina dekadenta intressen. Över tusen ansökningar till dessa dekadenta poster! Vi ler mörkt åt deras patetiska försök att efterlikna en verklig underrättelsetjänst. Snart rensar vi ut alla fiender till folkets sak – en efter en."}, "date": "12 augusti, 10:40", "url": "https://www.di.se/nyheter/uppgifter-rusning-till-nya-spionmyndigheten", "imageUrl": "https://static.bonniernews.se/ba/82674f60-8f6a-4a38-bc28-717b523987de.jpeg?crop=8256%2C4644%2Cx0%2Cy744&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Andersson (S) vill ha gatuprotester om bankskatt ger räntehöjningar", "summaries": {"normal": "Magdalena Andersson (S) vill beskatta bankernas övervinster. När bankerna hotar med höjda bolåneräntor som svar uppmanar hon kunder att byta bank – och hoppas på gatuprotester. En taktik som får bankdirektörer att svettas. Ska vi tro på allvar eller är det bara politik?", "trump": "Jag älskar det! Magdalena Andersson säger åt folk att protestera på gatorna om bankerna höjer räntorna. Det är fantastiskt! Hon är som en riktig ledare – nästan som jag. Men kom ihåg: ingen beskattar som jag gör. Vi gör affärer stora och vackra, inte som deras bankskatter!", "stalin": "Kamrater, bankerna hotar folket med högre räntor. Det är sabotage mot vår ekonomiska plan! Jag uppmanar alla arbetare att rensa ut dessa bankdirektörer – genom protester eller annat. De ska stå vid skampålen och om de inte lyder, ja, då får vi ta till starkare åtgärder. Partiet vet bäst!"}, "date": "12 augusti, 08:57", "url": "https://bulletin.nu/andersson-s-vill-ha-gatuprotester-om-bankskatt-ger-rantehojningar"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-right", "heading": "Ryska paret avvisas inte från Sverige", "summaries": {"normal": "Ett ryskt par som greps utanför Gävle i närheten av Saabs vd Micael Johanssons stuga har fått avvisningsbeslutet och återreseförbudet upphävda. Paret, som är motståndare till Ukrainakriget och bosatta i Spanien, uppmanas ändå av polisen att lämna Sverige. Polisen utreder hemfridsbrott och förberedelse till grov stöld.", "trump": "Kan ni fatta det? Det här ryska paret vandrar runt vid en viktig svensk vd:s stuga med komradio och tält, men svenskarna släpper dem ändå fria. Patetiskt! De borde ha kastats ut direkt. Sverige är svagt, precis som många andra länder som inte lyssnar på mig. En total skandal.", "stalin": "Dessa dekadenta element från den spanska exilen smyger runt våra socialistiska bröders skyddade zoner med sin borgerliga leksakskomradio och försöker stjäla vad de kan. Vi har likviderat farligare spioner för mindre. Ändå låter de fega västlakejerna dem gå. Paranoian inom den svenska polisapparaten är lika komisk som den är patetisk."}, "date": "12 augusti, 12:31", "url": "https://www.friatider.se/ryska-paret-avvisas-inte-fran-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-641_0.jpg?itok=tDmxiYgx"}, {"type": "image-right", "heading": "Europarådet varnar för ökat hat på nätet – kopplar \"främlingsfientlighet\" till hårdare migrationspolitik", "summaries": {"normal": "Europarådet varnar för alarmerande hatretorik i Europa, kopplad till stramare migrationspolitik. ECRI efterlyser reglering men gör ingen tydlig gräns mellan legitim kritik och främlingsfientlighet. Rapporten pekar på ökad normalisering av hat på nätet, särskilt mot migranter, romer och HBTQ-personer.", "trump": "Jag ser att Europarådet klagar på hatretorik igen. De fattar inget! Starka gränser är bra för landet, och de kallar det främlingsfientlighet. Många säger att det är löjligt. Vi måste skydda våra medborgare – inte lyssna på byråkrater som inte klarar av verkligheten!", "stalin": "Kamrater, rapporten avslöjar fiender: hatretorikens agenter och migrationsliberaler som sprider osäkerhet. Vi måste rensa ut dessa element som försvagar vår enhet. Partiet kommer att införa striktare kontroll av nätet – för folkets säkerhet. Inga avvikelser tolereras!"}, "date": "12 augusti, 12:09", "url": "https://samnytt.se/europaradet-varnar-for-okat-hat-pa-natet-kopplar-framlingsfientlighet-till-hardare-migrationspolitik", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12100526/artikelhuvudbild-1-223.jpg"}, {"type": "image-right", "heading": "Om staten är lösningen – berätta hur!", "summaries": {"normal": "Kristdemokraterna och Liberalerna har kommit överens om att stödja varandras krav på förstatligad vård respektive skola. Artikeln kritiserar förslaget då styrningen redan är starkt statlig och ifrågasätter hur en sådan reform ska genomföras i praktiken. Författaren saknar borgerliga visioner om valfrihet och entreprenörskap som tidigare präglat partierna.", "trump": "Hörni, dessa svenska partier är totalt förvirrade. Först vill de ha valfrihet, nu vill de plötsligt förstatliga allt som socialisterna. Det är en katastrof! De borde lyssna på mig – stora regeringar fungerar aldrig. Ge makten till folket och de bästa utförarna, inte till några inkompetenta byråkrater i Stockholm. Patetiskt!", "stalin": "Kamrater, dessa ynkliga liberaler och kristna demokrater kryper nu tillbaka till den enda sanna lösningen: statens järnhand. Jag har alltid vetat att borgarbrackornas valfrihetsfantasier bara var giftig sabotagepropaganda mot kollektivet. Låt oss centralisera, rensa ut de lokala avvikarna och låt staten styra varje skola och varje operationssal. Effektivitet garanteras – eller så likvideras motståndet med ett leende."}, "date": "12 augusti, 10:11", "url": "https://www.di.se/ledare/om-staten-ar-losningen-beratta-hur", "imageUrl": "https://static.bonniernews.se/ba/41477392-f6bd-45d6-a7df-9bd8cc535e51.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Fråga kommunerna om Tidö satsat på äldrevården", "summaries": {"normal": "Moderaternas valreklam kritiseras för att ställa bistånd mot äldreomsorg. Artikeln ifrågasätter varför just dessa områden ska konkurrera, pekar på att biståndet är väl granskat och effektivt, samt att Tidöregeringen inte kompenserat kommunerna tillräckligt för ökade kostnader inom äldreomsorgen. Skattesänkningar prioriteras istället.", "trump": "De där moderaterna är patetiska. Spelar ut bistånd mot svenska gubbar och gummor för att verka tuffa. Jag ströp hela det värdelösa biståndet och räddade miljarder. 193000 döda? Fake news! Sverige borde sänka skatterna ordentligt istället för att slösa på korrupta utländska projekt. Gör Sverige stort igen!", "stalin": "Jag ser tydligt hur dessa moderata element leker med borgarbrackornas retorik och ställer sovjetiskt bistånd mot folkets äldreomsorg. En sådan falsk dikotomi avslöjar deras kontrarevolutionära agenda. Vi har alltid granskat varje kopek med järnhand. De som likviderar stöd till de svaga förtjänar utrensning ur den historiska processen. Kamrater, vakta er mot sådana sabotage!"}, "date": "12 augusti, 01:52", "url": "https://www.dagensarena.se/opinion/fraga-kommunerna-om-tido-satsat-pa-aldrevarden", "imageUrl": "https://www.dagensarena.se/files/2026/08/bistand-300x157.jpeg"}, {"type": "image-right", "heading": "Mauri om SD-kommentar: ”Råkade kommentera från vårt konto”", "summaries": {"normal": "Mauri Hermundsson förklarar att en kollega råkade kommentera från produktionsbolagets konto och hylla avbokningen av Fröken Snusk på grund av SD. Kommentaren togs bort snabbt, men SD reagerade. Slarvigt tajmat, medger Mauri.", "trump": "Hörni, jag ser att Mauri har problem. En anställd skrev 'BRA!!!!!' från fel konto. Det är som när mina medarbetare twittrar från min telefon – katastrof! Men jag skulle aldrig låta någon hylla avbokning. Jag gör affärer med alla, även om de är rasister. Patetiskt!", "stalin": "Kamrater, en sabotagehandling har avslöjats. En anställd på ett produktionsbolag hyllade avbokning av en artist som samarbetar med fascister. De påstår att det var ett misstag. Vi vet att misstag inte existerar – endast kontrarevolutionär verksamhet. Rensning krävs."}, "date": "12 augusti, 08:23", "url": "https://bulletin.nu/mauri-om-sd-kommentar-rakade-kommentera-fran-vart-konto-2", "imageUrl": "https://cdn.bulletin.nu/articles/c85dea0b-374f-4de5-8c7c-20a1d3927ad1/preview.jpg?t=1786515764000"}, {"type": "image-right", "heading": "”Sjuka ska inte tvingas leva år efter år i otrygghet”", "summaries": {"normal": "Socialdemokraterna kritiserar regeringen och SD för att sjuka människor nekas sjukersättning trots långvarig oförmåga att arbeta. En ny ISF-rapport visar att strama regler leder till åratal på sjukpenning, vilket ger sämre ekonomi och ökad otrygghet. Partiet kräver ett system som ger både rehabilitering och verklig trygghet för dem som aldrig kan återgå i arbete.", "trump": "Folk, ni skulle se det här! De sjuka i Sverige tvingas leva i elände år efter år medan byråkraterna och de vänsterliberala politikerna bara pratar om kontroller och fusk. Ett totalt misslyckande! De borde få trygghet, inte vänta i evighet. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt.", "stalin": "Jag ser hur den borgerliga regeringen och deras reaktionära lakejer misstänkliggör de sjuka arbetarna och låter dem förtvina i åratal på tillfällig penning medan de borde ha fått kollektivets fulla skydd. Ett sådant sabotage mot folkets trygghet kräver omedelbar utrensning av dessa fiender till staten. Den som inte kan arbeta ska ändå tjäna systemet genom att leva i evig tacksamhet mot partiet."}, "date": "12 augusti, 08:00", "url": "https://arbetet.se/2026/08/12/sjuka-ska-inte-tvingas-leva-ar-efter-ar-i-otrygghet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/11154839/sdl3uzsmjw9-g4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Acast köper amerikanskt bolag för 190 miljoner", "summaries": {"normal": "Acast köper amerikanska Backyard Ventures för 190 miljoner kronor. Bolaget med över 200 kreatörer stärker Acast inom video och sociala medier. Kända namn som Piers Morgan och Ryan Holiday ingår. Affären ses som ett strategiskt kliv in i framtidens podcastmonetarisering.", "trump": "Wow, ännu en fantastisk affär! Acast, från Sverige, köper ett amerikanskt bolag för 190 miljoner. Jag älskar det – de investerar i USA, precis som alla borde. 200 kreatörer, stora namn… Det är en enorm vinst för alla. Ingen gör affärer bättre än mig!", "stalin": "Kamrater! Vi har iakttagit detta. Ett svenskt bolag köper en amerikansk kreatörshär – 190 miljoner ut ur rikets kontroll. Dessa 'kreatörer' sprider borgerlig oreda. Vi måste rensa ut sådana idealistiska propagandister. Partiets seger kräver att varje ljud och bild kontrolleras."}, "date": "12 augusti, 07:22", "url": "https://www.affarsvarlden.se/artikel/acast-koper-amerikanskt-bolag-for-190-miljoner"}, {"type": "image-right", "heading": "Rösta nej till 14-åringar ifängelse", "summaries": {"normal": "Socialdemokraten Alexander Soto Runevall uppmanar sitt parti att rösta nej till att sänka straffmyndighetsåldern till 14 år. Han hänvisar till skarp kritik från Polismyndigheten, Kriminalvården och andra expertmyndigheter samt Danmarks misslyckade försök som ledde till ökad återfallskriminalitet. Fokus bör istället ligga på förebyggande insatser, skola, sociala åtgärder och tvångsvård.", "trump": "Folk, det här är en katastrof. Socialdemokraterna borde lyssna på experterna och säga nej till att sänka straffmyndighetsåldern till 14. Det funkar inte, titta på Danmark, totalt fiasko. De gör det bara för att hjälpa den misslyckade Tidöregeringen. Vi behöver starka gränser, tidiga insatser och riktig lag och ordning, inte mer kriminalitet bland barn. Sad!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom Tidöregeringen försöker sänka straffmyndighetsåldern för att skapa fler unga kriminella som lättare kan rekryteras till deras kontrarevolutionära nätverk. Vi vet att sådana sabotage mot folket bara leder till utrensning av de svaga. Danmark visade vägen till fiasko. Låt oss istället stärka partiets förebyggande järnhand och tvångsvård mot dessa fiender till kollektivet."}, "date": "12 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rosta-nej-till-14-aringar-ifangelse", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-78-300x157.jpg"}, {"type": "image-right", "heading": "Expert: ”Pensionerna är på en oacceptabelt låg nivå”", "summaries": {"normal": "Pensionerna har sjunkit från tänkta 60 till 43 procent av slutlönen sedan 1999. För yngre generationer riskerar det att bli ännu lägre. Experter varnar för att arbetare med långa och fysiskt tunga arbetsliv straffas hårt. LO och Folksam kräver höjda pensionsavgifter, moderniserad garantipension och bättre utnyttjande av överskott för att vända trenden.", "trump": "De här pensionerna är en total katastrof, folk! Från 60 ner till ynka 43 procent – en skam! De smarta politikerna har förstört allt för vanliga arbetare som jobbat hårt hela livet. Vi behöver stora, underbara förändringar nu. Höj avgifterna, ge dem vad de förtjänar. Ingen vinner val på det här, men jag skulle fixa det på nolltid!", "stalin": "Kamrater, detta är borgarklassens sabotage mot arbetarkollektivets rättmätiga livsinkomst. Jag har sett hur de gradvis likviderar pensionerna ner till 43 procent för att straffa dem med långa arbetsliv. Vi måste omedelbart höja avgifterna till 18,5 procent, maximera gasen och modernisera garantipensionen. Den som motarbetar detta är folkets fiende och bör rensas ut med glädje."}, "date": "12 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/expert-pensionerna-ar-pa-en-oacceptabelt-lag-niva", "imageUrl": "https://www.dagensarena.se/files/2026/04/pensionsbild.jpeg"}, {"type": "image-right", "heading": "Katarina dog av kvävning på LSS-boende – anmäldes aldrig till Ivo", "summaries": {"normal": "Katarina, som hade autism, bipolär sjukdom och kognitiv funktionsnedsättning, dog av kvävning på ett LSS-boende efter att ha fått i sig diskmedel och senare bitar av hård frukt. Trots tidigare incidenter med vatten och bristande tillsyn anmäldes den sista händelsen aldrig till Ivo. Hennes mamma anklagar boendet för att ha mörkat missförhållandena. FUB varnar för att allvarliga incidenter är tre gånger vanligare på LSS-boenden än inom äldreomsorgen.", "trump": "Vilken katastrof på det här så kallade LSS-boendet! De lovade ständig tillsyn men lämnade stackars Katarina ensam så hon kunde dricka vatten som en galning och senare äta diskmedel och fruktbitar som kvävde henne. Total inkompetens, typisk för de woke-byråkrater som prioriterar kvoter framför säkerhet. De mörkar allt istället för att ta ansvar. Under min förra mandatperiod hade vi inte haft den här sortens vansinne, men Biden lät det rulla på. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar hur de exploaterande hyenorna inom borgarbyråkratin sviker arbetarklassen genom att negligera en funktionsnedsatt medborgare. Istället för att skydda henne mot vatten, diskmedel och kvävande fruktbitar väljer de att mörka sanningen och undvika ansvar. Vi måste rensa ut alla klassfiender som prioriter
