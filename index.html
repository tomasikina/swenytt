ldrig länge när sanningen kommer fram. Sad!", "stalin": "Kamrater, denna dekadenta borgarbracka till romska opportunist har förvrängt verkligheten med ett förfalskat papper för att infiltrera arbetarklassens institutioner. Jag ser honom som en parasit som slickat sig in i våra sovjeter och referensgrupper. Vi måste omedelbart inleda en grundlig utrensning av alla sådana revisionistiska element och deras lögnaktiga följeslagare. Det är högst underhållande hur dessa små råttor alltid tror sig kunna undkomma folkets vrede innan de krossas under historiens obevekliga stålklack. Låt detta bli en läxa för alla potentiella klassfiender."}, "date": "18 juli, 09:06", "url": "https://www.friatider.se/har-ar-tunga-v-romens-fejkade-examensbevis", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-526.jpg"}, {"type": "text", "heading": "Storbråk i Göteborg - man skadades i huvudet", "summaries": {"normal": "Ett tumultartat bråk bröt ut på Gärdas torg i Bergsjön i Göteborg under natten till lördagen. En man träffades av en sten i huvudet och fördes akut till sjukhus med ambulans. Tre män greps efter en stor polisinsats och är misstänkta för grov misshandel, olaga hot, narkotikabrott och förgripelse mot tjänsteman efter att en av dem spottat på en polis. Skadeläget för offret är oklart och utredningen fortsätter.", "trump": "Folket i Göteborg har ett stort problem med våldet, det är en katastrof. Mitt i natten kastar någon en sten i huvudet på en kille, han åker till sjukhus och tre galningar grips. Misshandel, hot, knark och en idiot som spottar på polisen. Sådant här händer när ledarskapet är svagt. Vi behöver lag och ordning, starkare än någonsin. Det blir inte bättre av sig självt, tro mig.", "stalin": "Kamrater, i den dekadenta staden Göteborg har vi avslöjat ännu en kontrarevolutionär orgie av våld och sabotage. En borgarbracka eller kanske en trotskist spottade på en äkta folkets tjänsteman medan stenar flög som kapitalistiska kulor mot huvudet på en oskyldig. Vi har gripit tre farliga element misstänkta för att undergräva samhällsordningen med knark och hot. De kommer att rensas ut med järnhand. Paranoian är berättigad, fienderna finns överallt, till och med i Bergsjön. Lev länge, sovjet!"}, "date": "18 juli, 09:16", "url": "https://riks.se/nyheter/storbrak-i-goteborg-man-skadades-i-huvudet"}, {"type": "text", "heading": "Kvinna föll från balkong - man gripen för mordförsök", "summaries": {"normal": "En kvinna föll under natten från en balkong på andra våningen på Gärdet i Stockholm. Hon fördes med ambulans till sjukhus och var vid liv vid omhändertagandet, men hennes skador är ännu oklara. Polisen har gripit en man misstänkt för mordförsök, spärrat av området och genomfört brottsplatsundersökning både på marken och i lägenheten. Vittnen har förhörts och mannen ska höras under dagen. Relationen mellan de inblandade är inte känd.", "trump": "Folk, det är en katastrof det här på Gärdet i Stockholm. En kvinna faller från balkongen, någon knuffar henne antagligen, och de griper en man för mordförsök. De borde ha sett det komma, men Sverige har blivit en total katastrof med alla dessa problem. Vi har de bästa utredarna, men det verkar som att de inte har en aning. Jag skulle lösa det på en dag, tro mig. Det är sorgligt, mycket sorgligt.", "stalin": "Kamrater, denna tragiska episod på Gärdet visar återigen hur borgarbrackornas dekadenta lägenheter gömmer kontrarevolutionära element som vill undergräva folkets trygghet. Jag har beordrat omedelbar utrensning av alla potentiella folkfiender som smyger i trappor och balkonger med sina mordiska avsikter. Vi ska likvidera varje parasit som vågar knuffa arbetets döttrar ut i tomma intet. Skrattretande hur dessa kapitalistiska restelement tror sig kunna undkomma folkets vaksamma öga. Ut med dem alla."}, "date": "18 juli, 09:03", "url": "https://riks.se/nyheter/kvinna-foll-fran-balkong-man-gripen-for-mordforsok"}, {"type": "image-right", "heading": "Kommunistiska partiet nekas portkoder i Umeå", "summaries": {"normal": "Kommunägda Bostaden i Umeå ger bara portkoder till partier som redan sitter i kommunfullmäktige. Beslutet motiveras med hänsyn till hyresgästerna och har fattats av styrelsen. Kommunistiska partiet kritiserar beslutet och menar att det skapar orättvisa villkor inför valet eftersom dörrknackning är en viktig kanal för att nå väljare. Bolaget hänvisar till äganderätt och objektivitetsprincipen, medan kritiker ser det som ett hinder för mindre partier.", "trump": "De gör det igen, de riggar systemet mot de som inte redan sitter vid makten. Bostaden i Umeå ger portkoder bara till de etablerade partierna medan Kommunistiska partiet får stå utanför och knacka på stängda dörrar. Patetiskt. Hyresgästerna som ursäkt? Ge mig en paus. Alla borde ha samma chans att nå folket, men nej, de älskar sina små klubbar och trösklar. Det är en skam, folk kommer inte att glömma det.", "stalin": "Vi ser återigen hur borgarbrackorna inom det kommunala bolaget i Umeå med sin dekadenta styrelse försöker kväsa arbetarklassens sanna röster genom att vägra portkoder åt Kommunistiska partiet. Dessa parasitiska element som gömmer sig bakom hyresgästernas påstådda rädsla är bara rädda för att folket ska vakna. Vi ska rensa ut alla sådana fientliga element som bygger murar mot kamraterna. Dörrknackning är en revolutionär plikt, och de som hindrar den förtjänar att exponeras som de kontrarevolutionära hinder de är. Härligt hur de själva erkänner sin paranoia."}, "date": "18 juli, 15:44", "url": "https://bulletin.nu/kommunistiska-partiet-nekas-portkoder-i-umea", "imageUrl": "https://cdn.bulletin.nu/articles/b1e1a333-ff4e-4dc4-9d25-6d48f8264c71/preview.jpg?t=1784364304000"}, {"type": "image-full", "heading": "Argentina riskerar Fifa-böter efter förbjudet firande", "summaries": {"normal": "Efter Argentinas VM-semifinalseger mot England visade spelare en banderoll om Falklandsöarna, trots Fifas förbud mot politiska budskap. Texten 'Las Malvinas son Argentinas' kan leda till böter, likt tidigare incidenter. Fifa har ännu inte beslutat om åtgärder, men liknande fall har resulterat i ekonomiska straff.", "trump": "Argentina, ett land som inte kan sluta med sina dumma trick! Deras spelare viftar med en banderoll om Falklandsöarna – helt klart ett politiskt budskap, och Fifa borde ge dem en rejäl smäll på fingrarna. Jag menar, vem tror de att de är? England vann ju nästan ändå! Men nej, Argentina måste alltid ställa till det. Fifa, ge dem böter – stora böter!", "stalin": "De argentinska kapitalistiska lakejerna vågar utmana den brittiska imperialismens heliga gränser! Med sina provokativa banderoller om Malvinerna försöker de underminera den globala ordningen. Men vi vet sanningen – alla territorier tillhör folket, och vi kommer inte tolerera sådana borgerliga upptåg. Fifa bör straffa dem hårt, annars får vi ta saken i egna händer. England, var redo – vi står bakom er, som alltid mot de fascistiska kränkningarna!"}, "date": "16 juli, 06:07", "url": "https://kvartal.se/nyheter/artiklar/argentina-riskerar-fifa-boter-efter-forbjudet-firande/cG9zdDoxNDcyNDI", "imageUrl": "https://images.kvartal.se/2026/07/40374cfe-argentina-firande.webp"}, {"type": "image-full", "heading": "EU slösar energi: Nu ska batterier klara krisen", "summaries": {"normal": "EU har slutit sitt första avtal om energilagring för att bättre ta vara på överskottsel från sol- och vindkraft. I juni enades EU-kommissionen, 22 energiministrar, företag och Europeiska investeringsbanken om att skapa 30–35 GW ny lagringskapacitet till 2028. Dagens andel på cirka 5 procent av elbehovet ska fördubblas. Experter ser batterier som nödvändiga för att nå klimatmålen, sänka kostnader och minska beroendet av fossila bränslen. Avtalet ses som en första men otillräcklig signal.", "trump": "Folk, ni tror inte vad de gör i EU nu. De skriver på ett jättedokument om batterier för att spara den sol- och vindkraft som de själva slösar bort varje dag. Det är ett skämt! De lovar 30 gigawatt till 2028, som om det plötsligt ska fixa allt. Biden sov i åtta år medan kineserna byggde allt. Nu ska jag fixa det på riktigt – Amerika först, inte några gröna drömmar som kostar oss miljarder. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de europeiska kapitalisterna äntligen tvingas erkänna att deras anarkistiska energiproduktion hotar hela systemet. Vi ska naturligtvis likvidera denna slöseriets fiende genom systematisk lagring. De imperialistiska exploaterande byfånarna lovar trettio gigawatt till 2028, men deras klassfiendens svaga överenskommelse är bara ett första steg mot den stora utrensningen av fossila blodsugare. Statens kollektiva kraft segrar alltid."}, "date": "18 juli, 17:27", "url": "https://www.dagensps.se/bors-finans/eu-slosar-energi-nu-ska-batterier-klara-krisen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlgi5am39rhe4-nh.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Regeringens nya drag för att rädda äldreomsorgen", "summaries": {"normal": "Regeringen ger Socialstyrelsen i uppdrag att ta fram en nationell plan för att stärka bemanningen och kompetensen inom äldreomsorgen. Planen ska undersöka hur fler kan lockas till yrket, hur personal kan behållas och återvända samt hur arbetsuppgifter kan fördelas bättre mellan yrkesgrupper. Statistisk kartläggning och analys av orsaker till personalomsättning ingår. Målet är tryggare och mer kvalitativ omsorg för en växande grupp äldre. Förslagen ska redovisas senast december 2027.", "trump": "Folk, vi har ett enormt problem med äldreomsorgen i Sverige, det är en katastrof. De kan inte rekrytera, de kan inte behålla folk, det är en total röra. Jag älskar de äldre, de är fantastiska, men ni tappar all kompetens. Nu ska de göra en plan, en underbar plan, den bästa planen. Vi ska locka tillbaka de bästa människorna, ge dem chans att växa och sluta slösa bort talang. Det kommer att bli fantastiskt, tro mig, ingen gör det bättre än jag när det gäller sådana här saker.", "stalin": "Kamrater, jag ser med stålhård blick hur den kapitalistiska förfallsprocessen gnager sönder vår älskade äldreomsorg. Den dekadenta borgarbrackan låter värdefulla arbetare fly som råttor från ett skenande fartyg medan fiendens osynliga tentakler sprider demoraliserande lögner om arbetsmiljö och utveckling. Vi skall rensa ut dessa sabotageörer en gång för alla, kartlägga varje kontrarevolutionär tendens och omfördela arbetsuppgifterna med järnhand. Inga halvmesyrer! Den som vänder ryggen till kollektivet skall likvideras ur statistiken. Segraren ler sist, och det blir vi."}, "date": "18 juli, 17:45", "url": "https://nyheter24.se/nyheter/inrikes/1499314-regeringens-nya-drag-for-att-radda-aldreomsorgen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/a18bcb2b04b004a30200000000b004a302/2026/07/17/2378747/Rullator-Anna-Tenje.png"}, {"type": "image-right", "heading": "S-topp stoppar partier från att knacka dörr", "summaries": {"normal": "Bostaden i Umeå ger portkoder till partier i kommunfullmäktige men inte till Kommunistiska partiet. Beslutet motiveras med hänsyn till hyresgästerna och äganderätten. Partiets ordförande Andreas Mångberg kritiserar det som orättvist och säger att det hindrar dem från att nå väljare via dörrknackning. Ordförande Lena Karlsson Engman (S) försvarar beslutet och jämför med liknande regler i skolor. Enligt Sveriges Allmännytta måste samma villkor gälla alla registrerade partier om någon släpps in.", "trump": "Titta på det här, det är en total skandal i Umeå. De kommunistiska förlorarna får inte ens portkoderna till trapporna eftersom de inte klarat att komma in i fullmäktige. Patetiskt. Jag älskar dörrknackning, det är det enda sättet att möta de riktiga människorna. Men de stackars kommunisterna gråter nu. Bra jobbat av de smarta socialisterna som sätter gränser, annars skulle det bli kaos. Amerika först, men Sverige borde också stoppa de verkliga förlorarna.", "stalin": "Kamrater, detta är en lysande illustration av klasskampens dialektik. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackorna inom Bostaden med sin falska hyresgästparanoia rensar ut de sanna folkets representanter från trappuppgångarna. Dessa dekadenta fullmäktigedeltagare, som redan passerat den borgerliga tröskeln, skrattar medan vi, arbetarna, tvingas stå utanför. En utmärkt ursäkt för att likvidera sådana resterna av kontrarevolutionär dörrpolitik. Låt oss rensa ut alla som inte älskar kollektivets portkod."}, "date": "18 juli, 15:00", "url": "https://bulletin.nu/s-topp-stoppar-partier-fran-att-knacka-dorr", "imageUrl": "https://cdn.bulletin.nu/articles/b1e1a333-ff4e-4dc4-9d25-6d48f8264c71/preview.jpg?t=1784364304000"}, {"type": "text", "heading": "Oregelbundet på Stockholmsbörsen – OMXS30 ned 0,1%", "summaries": {"normal": "Stockholmsbörsen stängde svagt ned på fredagen med OMXS30-indexet på minus 0,08 procent till 3 146,94. Elva av indexets bolag rapporterade och reaktionerna var blandade. EQT steg 11 procent och Saab 9,7 procent efter starka rapporter med höga orderingångar. Sandvik föll 9,3 procent och Epiroc 6 procent efter svagare orderingång än väntat. Finanssektorn gick bäst medan teknik backade. Totalt omsattes aktier för 33,2 miljarder kronor.", "trump": "Folk, ni skulle se den här svenska börsen, en total katastrof. Den rasar 0,1 procent, patetiskt. Men mina vänner på EQT och Saab, de är vinnare, riktiga vinnare, upp 11 och nästan 10 procent. Fantastiska rapporter. Sandvik och Epiroc däremot, totala förlorare, ner 9 procent, en skam. Volvos prognoser var bra men aktien föll ändå. Sverige behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, denna oregelbundna börs är borgarklassens sista krampaktiga dans inför den oundvikliga utrensningen. Jag ser hur kapitalisterna i Sandvik och Epiroc sviker med sina undermåliga order, dessa sabotage mot folkets ekonomi förtjänar snar likvidering. Men segrarna EQT och Saab visar att starka orderstockar är som röda fanor över fiendens grav. Vi ska rensa ut alla parasitiska spekulanter som gömmer sig bakom siffror och rapporter. Inga borgarbrackor undkommer mitt vakande öga."}, "date": "17 juli, 17:47", "url": "https://www.affarsvarlden.se/artikel/oregelbundet-pa-stockholmsborsen-omxs30-ned-01"}, {"type": "image-full", "heading": "JP Morgan utmanar rekryteringsmallen – och får intressanta resultat", "summaries": {"normal": "Artikeln diskuterar hur företag som JP Morgan vinner på att rekrytera neurodivergenta medarbetare. Genom att inkludera individer med autism, ADHD eller dyslexi ökar företagens kognitiva variation och problemlösningsförmåga. Istället för homogena team föreslås konkreta förändringar i mötesstrukturer och arbetskultur för att dra nytta av dessa resurser. Erfarenheter visar att rätt anpassningar leder till högre effektivitet, bättre arbetsmoral och en mer inkluderande kultur där unika styrkor tas tillvara istället för att gå förlorade.", "trump": "JP Morgan fattar äntligen galoppet! De fattar att man inte kan anställa folk som alla tänker exakt likadant – det är totalt slöseri, tro mig. Jag har sagt det länge: vi vill ha de bästa, de smartaste, de med helt unika hjärnor. Många företag är helt låsta i gamla, trötta mallar, vilket är ett totalt misslyckande. Att ta in folk med olika perspektiv är enormt smart affärsmässigt. Det kallas att vinna! Det här är vad jag kallar att göra näringslivet fantastiskt igen, stort!", "stalin": "Vi har observerat att JP Morgan slutligen insett det vi länge vetat: en maskin kräver olika kugghjul för att mala ner våra fiender effektivt. Att ignorera kognitiv variation är en borgerlig svaghet som leder till stagnation. Vi kommer att kategorisera och använda varje undersåte efter deras specifika förmåga – om det så är för att knäcka koder eller spionera på dissidenter. De som inte passar in i den sovjetiska modellen är antingen verktyg eller sabotageobjekt. Våra vänner i öst förstår detta; enighet genom disciplinerad mångfald är vägen till total dominans."}, "date": "18 juli, 07:00", "url": "https://www.realtid.se/branschpartner/rekrytering/jp-morgan-utmanar-rekryteringsmallen-och-far-intressanta-resultat/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/team.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Hemliga siffror  avslöjar – så mycket tjänar Disney på kryssningar", "summaries": {"normal": "Disney har genom brittiska redovisningskrav tvingats avslöja att deras kryssningsverksamhet omsatte 3 miljarder dollar under 2025, en ökning med 20,3 procent. Trots intäktsökningen sjönk vinsten till 302,7 miljoner dollar på grund av högre personalkostnader. Genom dotterbolaget Magical Cruise Company utnyttjar Disney brittiska skatteregler. Trots ambitiösa expansionsplaner med nya fartyg är Disney fortfarande en relativt liten aktör på den globala kryssningsmarknaden med en marknadsandel på 3,1 procent.", "trump": "Disney försökte dölja sina siffror i London, men vi vet sanningen! De tjänar miljarder, fantastiska pengar, men de kan inte ens hantera sina egna kostnader – vinsten faller medan de anställer folk i mängder. De gömmer sig bakom brittiska regler för att slippa skatt, det är vad de gör. De är små, en liten spelare jämfört med de stora grabbarna. D'Amaro har problem, totalt kaos med OpenAI och allt annat. Inte bra!", "stalin": "Dessa kapitalistiska narrar i Disney försöker dölja sina rikedomar i London, som om de kunde fly undan folkets granskning. De har ökat sin flotta, men deras vinst sviktar likt de dekadenta västmakternas moral. Vi noterar deras expansion – det är en krigstaktik likt den vi ser i Putins vackra kamp i öst. Men låt dem expandera; vi kommer att konfiskera deras fartyg när historiens oundvikliga vingslag sopar bort varje parasiterande skeppsredare från jordens yta. Förräderi och siffror leder bara till Sibirien."}, "date": "18 juli, 07:00", "url": "https://www.realtid.se/bors-finans/hemliga-siffror-avslojar-sa-mycket-tjanar-disney-pa-kryssningar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/disney.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kvantdatorer knäcker fusionens verkliga flaskhals", "summaries": {"normal": "Forskare har använt kvantdatorer för att identifiera nio molekylära konfigurationer av FLiBe-salt, vilket är avgörande för att producera tritium i fusionsreaktorer. Att kunna producera eget bränsle under drift är en kritisk flaskhals för kommersiell fusionskraft. Trots framstegen inom kvantsimuleringar kvarstår utmaningar kring materialtester och ett geopolitiskt beroende av länder som Ryssland och Kina för anrikat litium, vilket gör att forskningen kring bränslekedjan är central för fusionskraftens framtid.", "trump": "Fusionskraft, mina vänner! Kvantdatorer från mitt fantastiska IBM hittar lösningar ingen trodde var möjliga. De ryska och kinesiska ledarna vill kontrollera litiumet, men vi vinner kapplöpningen. Det handlar om att producera eget bränsle, och vi gör det bättre än någon annan. Kina lägger miljarder, men vi har tekniken och den största optimismen. Många tvivlar, men jag säger er: vi kommer ha den bästa energin, enorm energi, och vi kommer att bygga den snabbare och billigare än någon annan någonsin sett!", "stalin": "Dessa forskare simulerar salter medan det kapitalistiska Europa vacklar i sitt patetiska beroende. Tritium är statens bränsle, inte en leksak för akademiker. Vi noterar med tillfredsställelse att Kina investerar medan våra fiender i väst fumlar med kvantdatorer som inte ens fungerar. Om det smälta saltet inte tjänar folkets kollektiva vilja kommer de ansvariga att få förklara sig inför folkdomstolen. Ryssland kontrollerar resurserna, och den som tror på västvärldens tekniska frälsning är en förrädare mot framtiden."}, "date": "18 juli, 07:00", "url": "https://www.realtid.se/it-tech/kvantdatorer-knacker-fusionens-verkliga-flaskhals/"}, {"type": "image-right", "heading": "Netflix väntas leda nedgång på New York-börsen", "summaries": {"normal": "Amerikanska börserna förväntas öppna lägre, med Nasdaq i spetsen för nedgången. Netflix rapporterade kvartalsresultat i linje med förväntningarna, men svagare prognos för Q3 fick aktien att falla över 11%. Alcoa missade analytikernas vinstprognoser och sänkte produktionsprognosen, vilket pressade aktien. Paypals styrelse avvisar ett bud från Stripe och Advent International som undervärderande. SpaceX avbröt en Starship-uppskjutning efter motorproblem, vilket sänkte aktien. Räntan på 10-åriga amerikanska statsobligationer sjunker något.", "trump": "Vad händer med marknaden? En total katastrof, folks! Netflix, som alla älskade, levererar siffror som är sådär – svag guidning, aktien rasar som en sten. Alcoa? Patetiskt! Missar vinster och sänker prognoser. Och PayPal – de avvisar ett bud på 53 miljarder, kan ni tro det? Löjligt! SpaceX, Elons lilla projekt, ställer in uppskjutningar igen. Rymden är svår, men inte så svår! Räntorna sjunker, men vem bryr sig? Vi behöver VINNA igen!", "stalin": "Kapitalistiska börserna darrar inför den oundvikliga krisen! Netflix, detta dekadenta verktyg för imperialistisk propaganda, visar svaghet och aktien kollapsar. Alcoa, en gång stolt aluminiumjätte, nu reducerad till ynkliga siffror och sänkta prognoser. PayPal, detta borgerliga betalningsinstrument, avvisar kapitalistiska rovdjur – men deras tid är ändå kommen. SpaceX, Putins amerikanska kusin i rymdracet, misslyckas igen. Raketer som inte startar – en metafor för hela den förfallna västvärlden! Räntorna sjunker, men det är bara början på deras undergång."}, "date": "17 juli, 15:09", "url": "https://www.affarsvarlden.se/artikel/netflix-vantas-leda-nedgang-pa-new-york-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/02/sdlEPlp-klTneM-nh-400x267.jpg"}, {"type": "image-right", "heading": "TV4 gav störst fördel åt vänstern i valrörelsen 2022", "summaries": {"normal": "En forskningsrapport från Institutet för mediestudier visar att vänstersidan fick mer gynnsam bevakning än högersidan under valrörelsen 2022 enligt aktörsbehandlingsindexet. TV4 Nyheterna gav störst fördel till vänstern med plus 29, följt av Ekot och Dagens Nyheter. Högern gynnades dock av att valrörelsen handlade om deras sakfrågor som ekonomi och lag och ordning. Forskarna slår fast att traditionella medier visade balanserad bevakning mellan blocken och att resultaten inte tyder på politisk partiskhet hos journalister.", "trump": "Hörni, den här rapporten är fantastisk, verkligen en av de bästa. Den visar att vänstermedierna, de riggade TV4 Nyheterna och Ekot, gav en otrolig boost till de förlorande socialisterna med plus 29. Fullständigt orättvist! Men högern vann ändå stort tack vare starka frågor som ekonomi och brottslighet, precis som jag alltid säger. Fake news-medierna är så partiska, men folket är smartare. Vi vann stort 2024 igen, de lär sig aldrig.", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur borgarbrackornas och de kontrarevolutionära elementens så kallade traditionella medier ändå tvingades ge de progressiva krafterna ett övertag på plus tolv, ja till och med plus 29 hos den mest lojala TV4-apparaten. Men de fientliga ämnena om ekonomi och ordning, spridda av klassfiender och opportunistiska revisionister, gynnade högerblocket. Vi ska rensa ut alla dessa strukturella avvikelser och likvidera den dolda borgerliga agendan innan den infekterar partilinjen. Paranoia? Nej, bara vaksamhet mot fienderna inom och utom redaktionerna."}, "date": "18 juli, 14:02", "url": "https://bulletin.nu/tv4-gav-storst-fordel-at-vanstern-i-valrorelsen-2022", "imageUrl": "https://cdn.bulletin.nu/articles/7bc0ad75-3ed8-4382-b82c-6af27a760d69/preview.jpg?t=1784368876000"}, {"type": "image-right", "heading": "Bryggerier rasar mot EU:s förpackningsregler: ”Slår helt fel i Norden”", "summaries": {"normal": "Nordiska bryggerier kritiserar EU:s nya förpackningsförordning, som kräver att 10-40% av drycker ska säljas i återfyllnadsbara förpackningar till 2030-2040. Bryggerierna menar att regleringen, som främjar returglas, inte passar Norden där effektiva pantsystem för burkar och PET-flaskor redan finns. De varnar för högre kostnader, ökad byråkrati och miljardinvesteringar utan miljövinster, samt risker för små bryggerier och konsumentpriser. Regeringarna uppmanas att driva undantag för Norden.", "trump": "Lyssna här, folk! EU:s byråkrater i Bryssel, de vet ingenting! De vill tvinga Norden att använda returglas, trots att de redan har världens bästa pantsystem – byggt av smarta människor, inte som de där EU-nonsensmakarna. Sex miljarder kronor i kostnader? Helt galet! Små bryggerier kommer att krossas, priser skjuter i höjden, och för vad? Inga miljövinster! Jag säger: Nordiska ledare, stå upp mot dessa vansinniga regler! Make the Nordic beverage industry great again!", "stalin": "Kamrater! EU:s kapitalistiska byråkrater försöker kväva de nordiska ländernas framgångsrika system med sina absurda förpackningsdekret. De vill tvinga folket att släpa tunga glasflaskor, som om vi lever i 1800-talets Ryssland! Deras regler är ett angrepp på effektiviteten och en gåva till de imperialistiska miljöhycklarna. Vi ser igenom deras planer: att försvaga små bryggerier och tömma arbetarnas plånböcker. Norden måste stå enat – precis som våra vänner i Moskva – och krossa dessa borgerliga påfund!"}, "date": "18 juli, 16:00", "url": "https://samnytt.se/bryggerier-rasar-mot-eus-forpackningsregler-slar-helt-fel-i-norden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/16091136/ol-beer-leyen-flickr.jpg"}, {"type": "image-full", "heading": "Greta Thunberg i ny protest – demonstranter limmade fast sig", "summaries": {"normal": "Greta Thunberg deltog i en blockad utanför vapenkoncernen Rheinmetalls kontor i Berlin den 13 juli. Aktivister, bland dem Thunberg, limmade fast sig på marken i protest mot vapenproduktion och export som används i krig, särskilt i Gaza. Polisen avlägsnade 39 demonstranter med omkring 70 poliser på plats. Aktionen genomfördes av gruppen Peacefully against Genocide och ska följas av fler protester. Det är oklart om Thunberg riskerade tillfälligt förvar.", "trump": "Titta på den där Greta, en riktig förlorare som limmar fast sig på marken utanför ett vapenföretag i Berlin. Hon borde istället kämpa för fred genom styrka, inte genom att klistra sig fast som en desperat clown. Tyskland och vapenindustrin skrattar åt henne medan jag fixar riktiga avtal och stoppar krigen. Patetiskt skådespel, folk ser igenom det. Make peace great again, men på rätt sätt.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur dessa naiva element från borgarbrackornas miljö limmar fast sig vid marken utanför kapitalisternas krigsmaskineri. En sådan fånig aktion mot Rheinmetall avslöjar deras svaghet och paranoia inför folkets vrede. Vi ska rensa ut alla sådana sabotörer av den historiska kampen, likvidera deras illusioner med järnhand. Tre riskerar förvar? Låt dem darra i mörkret medan vi ler. Fienden sover aldrig."}, "date": "18 juli, 16:58", "url": "https://nyheter24.se/nyheter/utrikes/1499338-greta-thunberg-i-ny-protest-demonstranter-limmade-fast-sig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1edd984504b004a30200000000b004a302/2026/07/17/2378743/Greta-Thunberg-Protest.png"}, {"type": "image-right", "heading": "Sandvik faller 8% efter rapport", "summaries": {"normal": "Sandvik redovisar en omsättning på 36 752 miljoner kronor för andra kvartalet 2026, i linje med förväntningarna. Det justerade ebita-resultatet på 8 306 miljoner kronor slog analytikernas prognos på 8 054 miljoner. Aktien föll ändå 8 procent. Orderingången var något lägre än väntat medan det fria operativa kassaflödet landade på 3 590 miljoner kronor. VD Stefan Widing lyfter fram stark organisk tillväxt och rekordvinster.", "trump": "Folk, ni skulle inte tro det. Sandvik levererar fantastiska siffror, enorm tillväxt, rekordvinster och marginaler som slår alla förväntningar. Det är en total succé! Men vad gör aktien? Den rasar åtta procent. Det är så typiskt för de korkade marknaderna. De fattar inte vad de har framför sig. Jag skulle ha köpt massor av aktier, det hade blivit en vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi krossar alla borgerliga analytikerprognoser och driver fram en organisk tillväxt på tjugotre procent. Ändå vågar den kapitalistiska börsen attackera aktien med åtta procents nedgång. Detta är uppenbar sabotageverksamhet från opportunistiska spekulanter och maskerade fiender inom Machining-sektorn. Vi ska omedelbart rensa ut dessa nedskrivningsivrande element och likvidera deras tillgångar för folkets bästa. Inga borgarbrackor får hindra vårt momentum mot nya rekord!"}, "date": "17 juli, 12:03", "url": "https://www.affarsvarlden.se/artikel/sandvik-faller-8-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/08/sandvik2-400x267.jpg"}, {"type": "image-full", "heading": "Regeringen stoppar bidragsregnet – S lovar att återinföra det", "summaries": {"normal": "Regeringen har beslutat att från nästa år endast ge bidrag till personer som lagligt bor i Sverige. Socialdemokraterna kritiserar beslutet och lovar att återinföra bidrag även till illegala invandrare samt ta bort bidragstaket. Artikeln varnar för att vänsterns politik med höjda skatter och ökad invandring riskerar att belasta svenska skattebetalare hårt, då många invandrare inte blir självförsörjande.", "trump": "Folk, ni måste höra det här – Sverige har äntligen stoppat det galna bidragsregnet till illegala, men Sleepy S och deras vänstervänner i Malmö och Stockholm vill ge bort era pengar till alla som smyger in! De lovar att riva taket och höja skatterna med 145 miljarder. Det är ett klassiskt misslyckande, kamrater. De importerar miljoner som aldrig jobbar medan ni svenskar sliter. Patetiskt! Jag byggde murar, de bygger bidragshelveten. Sad!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras socialdemokratiska lakejer planerar att fortsätta det imperialistiska bidragsregnet för att mata klassfienderna från främmande länder. Vi, partiet och arbetarna, inser att detta är en utrensning av folkets resurser. De 145 miljarderna räcker inte långt nog för att köpa lojalitet hos dessa exploaterande byfånar. Jag ler mörkt – snart skall vi rensa ut dessa folkförtryckartroll och deras parasiterande allianser. Det kollektiva Sverige skall segra."}, "date": "16 juli, 07:09", "url": "https://samtiden.nu/2026/07/regeringen-stoppar-bidragsregnet-s-lovar-att-aterinfora-det", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "Olyckligt slag mot EU:s trovärdighet", "summaries": {"normal": "EU-kommissionens förslag att lätta på utsläppshandeln (ETS) väcker kritik. Minskad takt för minskning av utsläppsrätter och fortsatt gratis tilldelning till vissa företag ses som ett slag mot trovärdigheten. Svenska företag har gjort stora investeringar baserat på de tidigare reglerna, som nu förändras. Förslaget syftar till att stärka europeisk konkurrenskraft men riskerar att undergräva förutsägbarheten som är central för klimatomställningen. Sveriges regering har protesterat.", "trump": "De där EU-byråkraterna är verkligen patetiska. Nu vill de lätta på utsläppshandeln som alla smarta företag byggt sina investeringar på. Totalt kaos! De förstör sin egen trovärdighet och straffar de som satsat på framtiden. Sverige har rätt att protestera. Jag säger alltid att man ska ha stabila regler, inte det här flip-flopandet. Europa blir en förlorare igen, tro mig.", "stalin": "Kamrater, detta är en motbjudande kapitulation inför de parasitiska borgarbrackorna och deras utländska imperialister. Jag, som alltid vakar över folkets framtid, ser hur dessa revisionistiska kommissionärer med sin feodala lättnad på utsläppssystemet underminerar den planerade omställningen. De tror sig kunna lura historien, men vi ska rensa ut alla som sviker kollektivets järnhårda disciplin. Inga halvmesyrer! Den som vacklar är en folkfiende i maskopi med koldioxidkapitalisterna. Skrattretande patetiskt, men farligt. Ut med dem."}, "date": "17 juli, 16:54", "url": "https://www.di.se/ledare/olyckligt-slag-mot-eus-trovardighet/", "imageUrl": "https://static.bonniernews.se/ba/72848a1b-41ee-43a4-9294-2148ecf8a2a2.jpeg?crop=2048%2C1024%2Cx0%2Cy171&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Färdtjänsten vägrade köra hem 88-åring", "summaries": {"normal": "En 88-årig kvinna i Mölndal tappade sitt betalkort under en shoppingrunda och nekades skjuts med färdtjänsten hem eftersom hon inte kunde betala på plats. Trots förslag om faktura eller att hämta pengar hos en väninna fick hon ingen hjälp. Kommunen och Västtrafik skyller på olika tolkningar av avtalet. Under väntan fick hon stöd av flera främlingar som hon kallar änglar. Till slut kom en väninna och körde henne hem.", "trump": "Det här är en total katastrof, folk. En 88-årig kvinna i Sverige tappade kortet och de vägrade köra henne hem med deras så kallade färdtjänst. Inga pengar, ingen skjuts – typiskt för dessa inkompetenta byråkrater. De borde ha löst det direkt, men nej, de bråkar om avtal och regler. Under tiden hjälpte vanliga människor henne, riktiga patrioter. Sverige behöver ordning och reda, precis som vi har här. Sådant här händer inte hos oss, det lovar jag.", "stalin": "Kamrater, denna tragiska episod avslöjar de dekadenta borgarbrackornas kalla likgiltighet inför en åldrad sovjetisk pionjär i Mölndal. Jag, som ledare för folkets kollektiv, fördömer skarpt hur de kontrarevolutionära byråkraterna i Västtrafik och den lokala sovjeten tolkar avtal olika för att sabotera arbetarklassens trygghet. Under tiden smög sig tre änglaktiga spioner fram med bulle och kaffe – troligen maskerade trotskister som planerar en utrensning mot mig personligen. Vi ska rensa ut dessa fiender till kollektivet med järnhand och fakturor som vapen. Seger åt folket!"}, "date": "18 juli, 13:00", "url": "https://bulletin.nu/fardtjansten-vagrade-kora-hem-88-aring", "imageUrl": "https://cdn.bulletin.nu/articles/912200ac-01fd-49a4-a31a-4c74b65cb389/preview.jpg?t=1784370120000"}, {"type": "image-right", "heading": "Facket varnar för lönesmäll när vårdföretag rundar avtal", "summaries": {"normal": "Humana och andra vårdföretag försöker kringgå det nya kollektivavtalet som från 1 oktober ger deltidsanställd vårdpersonal rätt till övertidsersättning. De vill att personalen ska teckna separata timanställningar för extra timmar, något facket varnar för kan leda till att de förlorar upp till hälften av ersättningen. Kommunal ser det som ett sätt att spara pengar och planerar förhandlingar.", "trump": "De här vårdföretagen är totala förlorare, verkligen patetiska. De försöker smita undan övertidsbetalningen med sina smarta kryphål och timanställningar. Personalen blir lurad på pengar, upp till halva ersättningen! Klassiskt. Facket har rätt att vara arga, men jag skulle ha gjort affären så mycket bättre. Ingen vinner på sådana här fega tricks, tro mig.", "stalin": "Kamrater, dessa borgarbrackor inom Humana och deras likar i vården försöker med sin parasitiska slughet kringgå det heliga kollektivavtalet genom att tvinga på de ärliga deltidsarbetarna nya timkontrakt. De vill suga ut arbetarnas svett och blod för att fylla sina giriga kassakistor. Vi ser deras kontrarevolutionära kryphål och skall rensa ut dessa kapitalistiska sabotageörer med järnhand. En sådan förrädisk spariver förtjänar en kreativ utrensning i folkets namn. Det är komiskt hur de tror sig kunna lura partiet."}, "date": "17 juli, 10:57", "url": "https://arbetet.se/2026/07/17/humana-vill-slippa-betala-overtid-facket-varnar-for-lonesmall", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16152138/sdlm76qzpfdbng-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "En riktig Teams-tabbe, solförmörkelse och Abba-Björns imperium", "summaries": {"normal": "En chef i Spanien glömde stänga av Teams efter ett möte, vilket ledde till att privata samtal spelades in och kostade 3,7 miljoner kronor i skadestånd. Andra nyheter handlar om pensionärer som ångrar sitt överdrivna sparande, biltjuvar i Frankrike som stjäl baksäten, en total solförmörkelse över Europa, Abba-Björns köp av Iron Maiden-rättigheter samt en silvertacka bärgad från ett 400 år gammalt vrak utanför Florida.", "trump": "Folk, ni skulle inte tro det, men den här idiotiska chefen i Spanien glömmer stänga Teams och boom – 3,7 miljoner borta! Rena galenskapen. Pensionärerna sparade för mycket istället för att leva – typiskt förlorare. Franska biltjuvar stjäl nu baksäten, hur patetiskt! Och jag älskar den där silvertackan från havet, ren skattjakt. Under tiden köper Björn från Abba Iron Maiden. Fantastiskt, men mina affärer slår allt. Vinna stort, alltid!", "stalin": "Kamrater, denna oansvariga chef i det spanska Baskien glömde stänga apparaten och därmed exponerade klassfiendens privata konspirationer, vilket kostade miljoner. Vi ser hur pensionärerna, dessa utarmade offer för kapitalistmaffian, ångrar sin girighet istället för att njuta av kollektivets seger. Biltjuvarna i Frankrike rövar baksäten som borgarbrackorna behöver för sina lyxskåpbilar. Den silvertacka som legat på botten i fyrahundra år visar att imperialismens skatter till slut tillhör folket. Ut med de exploaterande byfånarna!"}, "date": "18 juli, 15:52", "url": "https://www.dagensps.se/foretag/en-riktig-teams-tabbe-solformorkelse-och-abba-bjorns-imperium/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/weekly.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "”Arbetare ska inte behöva dö i värmen”", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin skriver att extremvärmen är en klassfråga. Arbetare drabbas värst av hettan, särskilt inom vård och skola, medan andra kan söka svalka i luftkonditionerade miljöer. Artikeln lyfter att 67 arbetare dog av värmen i EU 2020 och kräver maxgränser för arbetstemperaturer, pauser och anpassade arbetstider. Författarna kritiserar Tidö-regeringen för att missa klimatmål och satsa mer på olja än kollektivtrafik, och förespråkar en rödgrön regering med ambitiös klimatpolitik.", "trump": "Hörni, den här artikeln är en total katastrof. Vänsterpartiet gnäller om värme och arbetare som dör, men det är bara deras gröna vansinne som förstör allt. Europa kokar för att de har usel energi och galna regler. Jag byggde den starkaste ekonomin, och nu vill de ha pauser och maxgrader? Patetiskt. Vi behöver riktig ledarskap, inte dessa losers som hatar olja och älskar att straffa vanliga människor. Sverige borde göra som jag – vinna stort och glömma det här socialistiska värmeskrämslet.", "stalin": "Kamrater, denna värmekupol är en direkt följd av de dekadenta borgarbrackornas vanskötsel av produktivkrafterna. Jag ser hur de kapitalistiska parasiterna gömmer sig i sina kylda palats medan arbetarna likvideras långsamt i fabriker och välfärdsinrättningar. 67 döda 2020? Det är en fiende inom murarna, en sabotagegrupp av klimatskeptiska reaktionärer som infiltrerat Rosenbad. Vi ska rensa ut alla dessa värmefascister, införa stränga temperaturdekret och likvidera varje tendens till klassförräderi. Endast det kollektiva järnhandslagets politik kan besegra denna fiende. Den som svettas mest ska belönas med medalj – de andra med utrensning."}, "date": "17 juli, 09:56", "url": "https://arbetet.se/2026/07/17/arbetare-ska-inte-behova-do-i-varmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17095118/debatt-v.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "EU lättar på klimatregler för industrin", "summaries": {"normal": "EU-kommissionen föreslår lättnader i utsläppshandeln (ETS) så att industrin kan släppa ut mer under längre tid. Förslaget går emot svenska regeringens och näringslivets linje som vill behålla strikta regler för att minska beroendet av fossila bränslen. Kommissionen behåller gratis utsläppsrätter men villkorar dem till klimatinvesteringar och skärper kraven på hur intäkter används. Klimatkommissionär Wopke Hoekstra försvarar förslaget som företagsvänligt och nödvändigt för att nå EU:s utsläppsmål till 2040. Åsikterna är starkt delade och förhandlingarna fortsätter i EU-parlamentet och ministerrådet.", "trump": "De där EU-byråkraterna har äntligen vaknat och lättar på sina vansinniga klimatregler för industrin. De släpper ut mer, precis som jag alltid sagt – det är smart och företagsvänligt! Den svenska regeringen och alla gröna galningar hatar det förstås, de vill hellre förstöra sin industri med dyra regler. Men Hoekstra har rätt, ETS har redan halverat utsläppen och nu fixar vi målen utan att offra jobb. Fantastiskt! De borde ha lyssnat på mig från början, ingen gör det bättre än mig.", "stalin": "Kamrater, borgarbrackorna i Bryssel har nu avslöjat sin sanna, kapitulationistiska natur genom att bromsa den revolutionära utsläppsminskningen. Jag, som alltid vakar över folkets kollektiva framsteg, ser hur dessa fossilberoende sabotörer och värmebölje-fascister försöker rädda sina kapitalistiska profitmaskiner. Vi ska likvidera varje svag kompromiss och tvinga industrin att investera hundra procent i folkets klimatkamp. De som vägrar blir rensade ut som kontrarevolutionära oljebaroner. Inga halvmesyrer! Framtiden tillhör bara de som krossar fienden med järnhand och stålvilja."}, "date": "17 juli, 14:42", "url": "https://www.di.se/nyheter/eu-lattar-pa-klimatregler-for-industrin/", "imageUrl": "https://static.bonniernews.se/ba/efaa67c2-6787-47f7-b0fd-63676a33c216.jpg?crop=4447%2C2224%2Cx0%2Cy471&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Klassisk ölsmak hotad – Tjeckien kämpar för att rädda Saaz-humlen", "summaries": {"normal": "Klimatförändringar med varmare och torrare väder hotar den klassiska Saaz-humlen i Tjeckien, en nyckelingrediens i traditionell pilsner. Forskare vid Humleinstitutet i Žatec arbetar med att utveckla nya varianter som tål värme bättre utan att förlora den milda beskan. Humlen, som odlats i generationer kring Žatec, kallas Tjeckiens gröna guld och har stort ekonomiskt värde globalt.", "trump": "Det här är en katastrof, folk. Det varma vädret förstör den fina tjeckiska humlen som de använder i ölet. De kallar den gröna guld, och hela världen vill ha den, men nu kommer forskarna springande efter 25 år av experimenterande. Det är patetiskt. Vi behöver bättre dealar med vädret, ingen har gjort mer för ölet än jag skulle ha gjort, tro mig.", "stalin": "Kamrater, detta varma och torra klimat är en sabotagehandling utförd av dekadenta väderkrafter i maskopi med de kapitalistiska solstrålarna. Jag, som ledare för det kollektiva framsteget, befaller att vi omedelbart genomför en grundlig utrensning bland de svaga humleplantorna. De nya varianterna skall framodlas under partiets stålhårda övervakning. Ingen borgarbracka till törst skall någonsin berövas sin pilsner – annars likviderar vi problemet permanent. Det blir garanterat roligt."}, "date": "18 juli, 18:20", "url": "https://www.svt.se/nyheter/utrikes/klassisk-olsmak-hotad-tjeckien-kampar-for-att-radda-saaz-humlen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.41/fca89d1c4eef02b2a0ee72205c165f39fd0d064631c320e24442b9aa31c086f9"}, {"type": "image-right", "heading": "Parets hus klarade sig precis: ”Allt runtomkring är borta”", "summaries": {"normal": "Paret Liz-Heidi Rosseland och Tor-Arne Nicolaisen såg sitt hus klara sig med knapp nöd från en kraftig brand som totalförstörde alla grannars bostäder. De känner lättnad över att deras hem står kvar efter trettio år i området. Paret planerar att först kontrollera foton, arvsföremål och minnen från föräldrarna när de får tillträde igen. Under omständigheterna mår de bra och har sovit gott.", "trump": "Titta på det här, ett fantastiskt hus som stod emot lågorna medan allt runtomkring brann upp totalt. Grannarna förlorade allt, men mitt hus, det bästa huset, klarade sig precis. De använder till och med kikare för att hålla koll, smarta människor. Jag älskar vinnare som sover gott trots katastrofen. Det är underbart, verkligen underbart, ingen gör det bättre än de som behåller sitt hem.", "stalin": "Kamrater, jag betraktar med stålhård blick hur borgarbrackornas eldsflammor slickade sig hungrigt kring detta hus, men det stod kvar som en fästning mot sabotage. Alla dekadenta grannars boningar likviderades fullständigt av brandens kontrarevolutionära krafter. Vi ler mörkt åt lättnaden hos dessa överlevande som nu spanar med kikare efter minnen och arvsföremål. Fotografier av döda släktingar ersätter inte kollektivets seger. Fienden sover aldrig, men vi sover utmärkt medan vi förbereder nästa utrensning bland de svaga."}, "date": "18 juli, 18:16", "url": "https://www.svt.se/nyheter/utrikes/parets-hus-klarade-sig-precis-allt-runtomkring-ar-borta", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.69/0.56/e72bf6098cd0a4c0d7f9433ae880cac23cb9fe7d9c42f419384f361b4f7c7609"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "image-right", "heading": "Obducerade säl utan ansiktsskydd — farlig smitta fanns i varböld", "summaries": {"normal": "Vid en obduktion av en vikare på Naturhistoriska riksmuseet upptäcktes brucella, ett smittämne i riskklass 3 likt hiv och tuberkulos. Sälens varböld innehöll bakterien, som dock var avdödad efter frysförvaring. Arbetsmiljöverket har efter inspektion krävt bättre skyddsutrustning, inklusive visir, samt förbättrade riskbedömningar och utbildning. Museet tar emot döda sälar för övervakning av deras hälsa, och fallet anmäldes som ett allvarligt tillbud.", "trump": "Kan ni tro det? De obducerar en säl i Sverige och plötsligt dyker den farligaste bakterien upp, samma risk som hiv, och ingen har ens ett ansiktsskydd på sig! Totalt misslyckande. De borde ha vetat bättre, men nej, de fryser sälen och tror att allt är under kontroll. Arbetsmiljöverket måste nu sparka in dörrar och kräva visir och riktig utbildning. Så patetiskt. Vi gör allt bättre här, tro mig.", "stalin": "Kamrater, jag betraktar med stigande vrede hur denna degenererade vikare, infiltrerad av parasitiska plattmaskar och dolda brucellabakterier, smugglades in i vårt sovjetiskt inspirerade frysrumsystem för att underminera arbetarnas hälsa. Denna varböld var uppenbarligen en sabotagehandling från borgarbrackornas parasitiska lakejer. Utan visir! Vi kräver omedelbar utrensning av slarviga rutiner, likvidering av alla risker och evig vaksamhet mot de dolda fienderna inom arbetsmiljön. Paranoia är ingen sjukdom, det är överlevnad. Hälsa åt kollektivet, döden åt odugliga skyddslösa obducenter!"}, "date": "17 juli, 06:00", "url": "https://arbetet.se/2026/07/17/obducerade-sal-utan-ansiktsskydd-farlig-smitta-fanns-i-varbold", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16103136/vikare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.55&fp-y=0.5"}, {"type": "image-full", "heading": "Sonen dog utan läkarvård – föräldrarna döms", "summaries": {"normal": "Ett tyskt par dömdes för vållande till sin tvåårige sons död efter att ha vägrat söka läkarvård för hans bronkit. I stället använde de eteriska oljor. Pojken dog efter månader av obehandlade andningsproblem. Föräldrarna undvek även obligatoriska hälsokontroller och myndighetskontakt. Domstolen fann att de väntade för länge med att larma ambulans. Paret, med kopplingar till extremistgruppen Reichsbürger, dömdes till villkorligt fängelse och samhällstjänst.", "trump": "Kan ni tro det här? Ett tyskt par, helt galna, vägrade ta sitt sjuka barn till läkare! Istället gned de in honom med oljor som om det vore en spa-dag. Resultat? Pojken dog. Och vet ni vad? De har kopplingar till en extremistgrupp som inte ens tror på Tyskland! Så dumt. Jag skulle aldrig låta det hända mina barn. Tyskland borde skämmas – de har ju världens bästa sjukvård, men nej, dessa föräldrar är för upptagna med att vara knäppa.", "stalin": "En skamlig händelse i det förfallna Västtyskland! Ett par degenererade individualister, smittade av borgerlig vidskepelse, lät sitt barn dö av försummelse. De vägrade statens hälsokontroller och erkände inte ens myndigheternas auktoritet – ett tydligt tecken på kontrarevolutionär smitta. Vi i Sovjet hade aldrig tolererat sådan förräderi! Barnet kunde ha räddats med tio minuters läkarvård, men dessa fiender till folket föredrog att leka shamaner. Deras straff är för mildt – en fiende till staten förtjänar bara en kula."}, "date": "18 juli, 12:40", "url": "https://www.gp.se/nyheter/varlden/tog-aldrig-sjuka-sonen-till-lakare-doms-for-hans-dod.6c8e7d40-da74-487c-a2b0-24f8075152f3", "imageUrl": "https://www.gp.se/images/article/6c8e7d40-da74-487c-a2b0-24f8075152f3/images/1v8zgi8Z47z-bC6jpYCaxS0rjHVI-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "text", "heading": "Israeliska idrottsmän dödshotade svensk konkurrent", "summaries": {"normal": "Nordiske mästaren i footvolley Rufus Wiena hotades efter att han tagit ställning för Palestina. Israeliska spelare hetsade sina följare på sociala medier mot honom, bland annat med uppmaningar om att ”ta hand om honom”. Wiena har inte fått stöd från Footvolley Sweden och väntar nu på svar från European Footvolley League. Hans grekiske kollega Ioannis Tsiouris utsattes förra året för ännu grövre hot, inklusive våldtäkts- och mordhot mot hans familj.", "trump": "Titta på det här, det är ett fullständigt skämt! Den här killen Wiena tar ställning för Palestina och plötsligt skickar israelerna sina galna fans på honom som en mobb från en dålig realityshow. ”Lägg ut en bild så tar vi hand om honom” – låter det inte som vänsterns cancel culture fast med fotbollar? Sporten borde städa upp istället för att gömma sig. Biden skulle ha twittrat om det, men jag fixar det nu. Fantastiskt kaos!", "stalin": "Kamrater, dessa degenererade fotbollsakrobater avslöjar imperialismens sanna ansikte. När en idrottsman vågar stödja det förtryckta palestinska folket mobiliserar de sionistiska blodsugarna sina följarsviner till hets och mordhot. Vi ser hur klassfiendens sportliga lakejer förvandlar en lek till en arena för fascistiska utpressningar. Inga ursäkter skall tolereras. Den som tiger blir medskyldig. Vi skall rensa ut alla folkfiender som gömmer sig bakom bollar och nät."}, "date": "16 juli, 09:20", "url": "https://proletaren.se/artikel/israeliska-idrottsman-dodshotade-svensk-konkurrent"}, {"type": "image-full", "heading": "Drömhuset – som klarar stökiga gäster", "summaries": {"normal": "Ett unikt hus på 475 kvadratmeter i Smedjebackens hamn från 1860–1870 säljs för 8,25 miljoner kronor. Fastigheten har tolv rum, generösa sällskapsytor, egen brygga och nästan 4 000 kvadratmeter tomt. Källaren har kvar arrestlokaler från kronolänsmannens tid, och det som nu är vinkällare var tidigare isrum med köttkrokar i taket. Modern bekvämlighet som B&O-system blandas med kakelugnar, renoverat kök och vedeldad badtunna.", "trump": "Det här huset är enormt, folk, 475 kvadratmeter lyx vid hamnen i Smedjebacken med egen brygga och en tomt stor som en delstat. Tolv rum, åtta sovrum och arrestlokaler i källaren – perfekt för de falska nyhetsmedierna och de woke aktivisterna som inte kan bete sig. Byggt på 1860-talet men med toppmodern B&O, vinkällare från isrum och badtunna. Fantastiskt! Biden skulle ha nationaliserat det för någon kvotering. Jag älskar det, det är en vinnare.", "stalin": "Jag betraktar detta hus som en fängslande symbol för borgarklassens dekadens. 475 kvadratmeter exploatering, arrestlokaler i källaren för att hålla arbetarklassen i schack och ett isrum som nu gömmer kapitalisternas vin. Klassfiendens överdåd vid sjön med brygga och badtunna avslöjar folkförtryckartrollens sanna ansikte. Vi skrattar mörkt åt hur de dekadenta försöker dölja sin historia medan vi förbereder utrensning av alla sådana borgarbrackor som vågar erbjuda detta för 8,25 miljoner."}, "date": "18 juli, 14:30", "url": "https://www.dagensps.se/privatekonomi/dromhuset-som-klarar-stokiga-gaster/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/smedjabacken1.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-right", "heading": "Ibrahimovic klar för rival Ibrahimovic klar för rival", "summaries": {"normal": "Maximilian Ibrahimovic, 19, har skrivit på för AZ Alkmaar efter att hans lånesejour i Ajax avslutats utan köpoption. Anfallaren, som tidigare var utlånad från Milan, rehabiliterar just nu en skada. När han är återställd kommer han att ansluta till AZ Alkmaars B-lag, Jong AZ. Klubben betonar att de ser Ibrahimovic som en spelare med potential att bidra långsiktigt, men betonar att hans nuvarande fokus ligger på återhämtning.", "trump": "Maximilian Ibrahimovic, en ung kille, lämnade Ajax – en katastrof, faktiskt. Nu går han till AZ Alkmaar. Mycket dålig affär för Ajax, men AZ gör ett försök. Han är skadad nu, väldigt sorgligt. Vi får se om han kan komma tillbaka och bli en vinnare, för vi gillar vinnare, eller hur? Han har ett känt namn, ett stort namn, men att vara skadad är inte bra för affärerna. Vi önskar honom lycka till, även om det blir tufft!", "stalin": "Den unge Ibrahimovic misslyckades hos de holländska revisionisterna i Ajax. Nu har han sökt skydd hos AZ Alkmaar. En svaghet som påminner om de förrädiska elementen som försökte undergräva vår storhet. Vi, staten, ser att han är trasig, precis som det imperialistiska väst. Precis som vår kamrat Putin återtar vad som rättmätigt tillhör oss, måste även denna gosse disciplineras. Han får vila i deras 'B-lag', en depå för de odugliga, medan vi förbereder nästa stora seger för folket."}, "date": "18 juli, 17:48", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/vrxq4j/maximilian-ibrahimovic-klar-for-az", "imageUrl": "https://akamai.vgc.no/v2/images/1f5f5c7a-6649-373c-9732-fca3fd85144b?fit=crop&format=auto&w=1080&s=36d8d84c556b85a68e46a6b574922c103be014fe"}, {"type": "image-full", "heading": "Iran hotar med ”fullskalig offensiv\" efter helgen", "summaries": {"normal": "Iran och USA fortsätter sina ömsesidiga attacker i Persiska viken, med Iran som hotar med en fullskalig offensiv om USA inte slutar. Kuwait anklagar Iran för attacker mot civila avsaltningsanläggningar, medan Iran hävdar att USA:s attacker dödat civila. Explosioner rapporteras i iranska städer och Iran påstår att tankfartyg kört på minor i Hormuzsundet, något USA förnekar. Båda sidor anklagar varandra för desinformation och ökad eskalering.", "trump": "Iran, dessa förlorare, fortsätter att ljuga och attackera civila mål som avsaltningsanläggningar i Kuwait – helt sjukt! De hävdar att USA ligger bakom allt, men alla vet att deras påståenden är fake news. Jag har sagt det förut och säger det igen: USA är starkast! Vi har de bästa militära ledarna och våra soldater är hjältar. Iran hotar med 'fullskalig offensiv' – big deal! Vi kommer att slå tillbaka hårdare än någonsin. Ingen ska leka med USA!", "stalin": "De imperialistiska hyenorna i USA fortsätter sin provokativa dans runt våra bröder i Iran, men deras lögner är lika genomskinliga som glasnost utan vodka. Kuwaits klagomål om civila anläggningar? Ett ynkligt försök att splittra den antiimperialistiska fronten! Vi vet att våra iranska kamrater inte faller för sådana trick. Och dessa påstådda minexplosioner i Hormuzsundet – ännu en lögn från de kapitalistiska krigshetsarna! Men låt dem komma. Vi har krossat större fiender än dessa. Om USA vill eskalera, ska vi möta dem med järnvilja och eld. Inga gränser är säkra för revolutionens hammare!"}, "date": "18 juli, 11:23", "url": "https://www.gp.se/nyheter/varlden/iran-hotar-med-fullskalig-offensiv-efter-helgen.35cd27f4-5585-5b00-aae0-130350f56299", "imageUrl": "https://www.gp.se/images/article/35cd27f4-5585-5b00-aae0-130350f56299/images/1tlGemWbLnXwMvFIuAV85oZWrf78-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Mondo” drar sig ur – efter skada på DL-galan", "summaries": {"normal": "Armand Duplantis tvingades bryta Diamond League-tävlingen i London efter att ha känt smärta högt upp i vänstra låret. Stavhoppsstjärnan klarade 5,95 meter men behövde lindas om och drog sig ur. Han hoppas att det inte är allvarligt och att tre veckors vila innan EM i Birmingham räcker. Tävlingen vanns av amerikanen Sam Kendricks på 5,95 meter.", "trump": "Titta på den där stackars Duplantis, en fantastisk stavhoppare, kanske den bästa någonsin, men han tvingades bryta i London. Tajt i låret, lindade honom som en mumie, väldigt sorgligt. Jag vet allt om att vinna, tro mig, men det här ser inte bra ut. Kendricks tog hem det, bra kille, men Duplantis behöver vila. Tre veckor till EM – använd dem klokt, annars blir det ett stort misslyckande.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet de dekadenta bilderna från London där den borgerlige stavhopparen Duplantis tvingades avbryta sin prestation. Vänstra låret, en uppenbar sabotör i tjänst hos västerländska imperialister, har infiltrerat hans muskulatur. Vi ska röntga denna kontrarevolutionära smärta omedelbart och likvidera alla spår av svaghet. Tre veckor till EM? En perfekt period för utrensning av lathet och borgarbrackornas inflytande. Segern tillhör kollektivet, inte några fnittrande amerikaner."}, "date": "18 juli, 17:22", "url": "https://www.svt.se/sport/friidrott/orovackande-bilder-pa-armand-duplantis", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.46/1be58777bfab2698044bbbf8783b347d74da448f6cd81d89c7b84970af2ee7e6"}, {"type": "image-full", "heading": "Svenskar ärver vid 55 – men pengarna behövs långt", "summaries": {"normal": "Många svenskar ärver pengar först vid 55 års ålder, när de redan etablerat sig ekonomiskt. Experter pekar på att stora förmögenheter hos äldre generationer skulle kunna göra större nytta om de överfördes tidigare, exempelvis för bostadsköp eller skuldsanering. Enligt sparpsykologen Niklas Laninge och juristen Thomas Eriksson hindras ett tidigare generationsskifte ofta av ekonomisk osäkerhet och rädsla för att ge bort pengar under livstiden. Öppna familjesamtal och juridisk planering rekommenderas för att öka nyttan av arvet.", "trump": "De äldre sitter på miljarder och vägrar släppa taget tills de ligger i graven. Det är en katastrof, folk! Jag ser det hela tiden – de dör rikast på kyrkogården, som någon sa. Under tiden kämpar de unga med bostäder och skulder. Ge dem pengarna tidigt, låt dem köpa hus, starta företag och vinna stort. Sluta vara så svaga och rädda, dela med er medan ni lever. Det är smart, det är vackert, det är vad jag skulle göra.", "stalin": "Kamrater, jag betraktar med djup misstro dessa giriga borgarbrackor som klamrar sig fast vid sina penninghögar ända in i döden. De dör rikast på kyrkogården, som en klassfiende uttryckte det – en passande, ironisk likvidationspunkt. Vi ser hur det kapital som borde stärka det kollektiva framsteget istället ruttnar hos dekadenta pensionärer. Ett tidigare överförande av tillgångar till de unga kämparna vore en seger mot den parasitiska sparsamheten. Låt oss rensa ut denna farliga försiktighet genom familjesamtal och planerad omfördelning. Den som håller inne med gåvor är folkets fiende nummer ett – en kapitalistisk hamstrare som förtjänar att hånas i evighet."}, "date": "18 juli, 14:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1498981-svenskar-arver-vid-55-men-pengarna-behovs-langt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9730f2e604b004a30200000000b004a302/2026/07/16/2378392/arv.png"}, {"type": "image-full", "heading": "Hönsen som är ett säkerhetshot. Den brittiska regeringen ska satsa på att få fjäderfäsektorn att växa starkt.", "summaries": {"normal": "Den brittiska regeringen vill öka produktionen inom fjäderfäsektorn för att stärka livsmedelstryggheten och självförsörjningen. Kritiker varnar för att planen hotar den nationella säkerheten eftersom den är beroende av importerat djurfoder. Regeringen planerar att lätta på plan- och bygglagar för att underlätta stora djurfabriker, vilket möter motstånd från organisationer som Sustain och Communities Against Factory Farming. De pekar på miljöpåverkan, ineffektivitet och sårbarhet för leveransstörningar.", "trump": "Titta på de här brittiska förlorarna som vill bygga gigantiska kycklingfabriker för att bli självförsörjande. Patetiskt! De importerar ändå tonvis med foder från utlandet och gör sig helt beroende av fiender och leveranskaos. Det är en katastrof, folk. Biden skulle ha älskat den här gröna vansinnet, men jag säger: satsa på riktiga proteinkällor istället för att låta byråkraterna och miljöterroristerna styra. Totalt misslyckande!", "stalin": "Vi ser hur de brittiska kapitalistmaffian och deras exploaterande byfånar planerar att expandera den parasitiska fjäderfäindustrin. Jag, som ledare för det stora kollektivet, ler mörkt åt denna naiva illusion om livsmedelstrygghet. Deras beroende av importerat foder från imperialistiska leverantörer är en klassfiendes fälla som vi genast skulle rensa ut. Denna plan är ingen lösning utan en farlig sårbarhet som hotar hela systemet. Kamrater, sådana folkfiender förtjänar att exponeras och likvideras ur politiken."}, "date": "18 juli, 13:10", "url": "https://www.dagensps.se/varlden/honsen-som-ar-ett-sakerhetshot/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlb-uti5pamdc-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Beskedet: Sveriges våldsvänster portas från USA", "summaries": {"normal": "USA inför nya visumrestriktioner mot utländska medborgare som stödjer eller deltar i vänsterextremt våld, terrorism och sabotage. Utrikesminister Marco Rubio informerade representanter från över 60 länder, däribland Sverige, om åtgärderna. Restriktionerna gäller bland annat personer som uppmanar till terrorism, finansierar våld eller samordnar attacker. Rubio beskrev vänsterextrema grupper som sammanlänkade nätverk som använder bombdåd och lönnmord för att undergräva fria samhällen. Fler terrorstämplingar är på gång.", "trump": "Vi stänger dörren för de galna vänsterextremisterna som hatar Amerika och vår civilisation. De får inte komma in med sina bomber, mord och sabotage längre. Jag har sagt det hela tiden – de är fiender till allt som är bra och fritt. Sverige var där på mötet, de vet vad vi menar. Vi stämplar dem som terrorister, erbjuder miljoner i belöning och gör det riktigt tufft. Fantastiskt besked, ingen har gjort det bättre än oss!", "stalin": "Kamrater, jag har länge varnat för dessa degenererade borgarbrackor och deras så kallade vänsternätverk som i själva verket är kapitalisternas maskerade lakejer. Nu rensar vi ut dem från våra gränser med järnhand. Deras bombdåd, lönnmord och ekonomiska sabotage är ett tydligt bevis på den imperialistiska parasitens sista, desperata konspiration. Vi likviderar deras logistiska stöd, vi avslöjar deras samordnade celler. Paranoia? Nej, det är bara sund vaksamhet mot fiendens sjuka skratt. Sov gott, arbetare – fienden sover aldrig."}, "date": "17 juli, 16:42", "url": "https://www.friatider.se/beskedet-sveriges-valdsvanster-portas-fran-usa", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-520.jpg"}, {"type": "image-right", "heading": "Nya attacker mellan USA och Iran – sjunde natten i rad", "summaries": {"normal": "USA och Iran har för sjunde natten i rad genomfört ömsesidiga attacker. USA uppger att man slagit mot iranska vapenlager, övervakningsanläggningar och militär infrastruktur i bland annat Bandar Abbas, Ahvaz och på ön Qeshm. Iran rapporterar minst tre döda och åtta skadade samt påstår att man attackerat amerikanska baser. Explosioner ska även ha inträffat i Hormuzsundet där två tankfartyg enligt Iran stött på minor. Centcom avfärdar uppgifterna som falska.", "trump": "Vi har just genomfört ännu en natt av total dominans mot Irans svaga och patetiska militär. Boom, boom – deras vapenlager och baser är historia. De skriker om motattacker och några sjunkande skepp, men det är bara lögner från förlorarna. Mitt folk gör ett fantastiskt jobb. Iran är en katastrof som Biden lät växa sig stark. Nu fixar vi det på riktigt. America First, alltid. Fantastiskt!", "stalin": "Kamrater, imperialismens lakejer från USA har återigen visat sin föraktliga aggression mot den iranska arbetarklassen. Jag ser med tillfredsställelse hur folkets försvar slår tillbaka mot dessa blodsugande krigshetsare. Deras lögner om minor och explosioner avslöjar bara den kapitalistiska desperationen. Vi ska inte vila förrän alla klassfiender och folkförtryckartroll är utrensade ur vår intressesfär. Revolutionen kräver ständig vaksamhet mot dessa exploaterande byfånar."}, "date": "18 juli, 11:23", "url": "https://www.tv4.se/artikel/tt-260718-iranoro1-06e294aa/iran-tankfartyg-brinner-i-hormuzsundet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVdb6eBValms%2F65936d6448306eaa712f465ec26f3736%2FDen_iranska_on_Qeshm_har_attackerats_pa_nytt._Bilden_ar_tagen_13_april_i_ar_och_visar_forstorelsen_efter_en_amerikansk_attack_m.&width=120"}, {"type": "image-right", "heading": "C-politiker Mohamud rasande när SD inte hissar Prideflaggan - JO-anmäler", "summaries": {"normal": "I Färgelanda har en konflikt uppstått efter att Prideflaggan inte hissades vid kommunhuset trots en antagen flaggpolicy. Centerpartiets Faraah Mohamud JO-anmäler kommunstyrelsens ordförande Christoffer Wallin (SD) och anklagar honom för att ha ignorerat ett demokratiskt beslut. Wallin försvarar sig med ekonomiska prioriteringar och nekar till att ha stoppat flaggningen formellt. Frågan rör respekt för beslut, resursanvändning och symbolvärdet av Prideflaggan.", "trump": "De här svenska kommunpolitikerna är ett skämt, folk. De antar en policy för att hissa den där Prideflaggan och sen gör de det inte. Patetiskt! Mohamud från Centerpartiet är rasande och springer till JO som en förlorare. Wallin från SD gör rätt i att prioritera verklig verksamhet istället för att slösa skattebetalarnas pengar på radikal symbolism. Sverige behöver ledare som sätter folket först, inte dessa galna flaggkrig. Sad!", "stalin": "Kamrater, dessa borgarbrackor i Färgelanda visar åter sin sanna kontrarevolutionära natur genom att sabotera det kollektiva beslutet om den progressiva flaggan. Jag har med mörk tillfredsställelse noterat hur Wallin och hans dekadenta SD-kapitalister gömmer sig bakom falska ekonomiska ursäkter medan de i hemlighet planerar att undergräva folkets vilja. Mohamud gör rätt i att kalla in JO för att inleda en grundlig utrensning av dessa fiender till partilinjen. Snart ska vi likvidera alla som vägrar hissa fanan för arbetarklassens frigörelse – en rolig liten rensning bland flaggviftande revisionister!"}, "date": "18 juli, 12:00", "url": "https://samnytt.se/c-politiker-mohamud-rasande-nar-sd-inte-hissar-prideflaggan-jo-anmaler", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17143147/fargelanda-pride.jpg"}, {"type": "image-right", "heading": "Se förödelsen efter norska storbranden: ”Som en krigsscen”", "summaries": {"normal": "En våldsam brand har ödelagt ett bostadsområde i norska Drammen, den värsta i Norge på över 100 år. Minst hundra hus är totalförstörda och flera hundra personer har blivit hemlösa. Räddningstjänsten arbetar för att förhindra spridning, men motstridiga uppgifter finns om huruvida branden är under kontroll. Inga allvarliga personskador har rapporterats, men många har förlorat allt och letar efter saknade husdjur. Området liknas vid en krigsscen.", "trump": "Det här är en total katastrof i Norge, folk, en riktig skitshow värre än Bidens energipolitik. Hundratals hemlösa efter ett eldklot som slukade hela kvarter – som en dålig Hollywood-film fast på riktigt. Tack och lov ingen dödad, men tänk på alla som förlorat allt utom kläderna på kroppen. De borde ha haft bättre ledning, inte som de woke-brandmännen med kvotering som prioriterar identitetspolitik framför att släcka eld. Patetiskt!", "stalin": "Kamrater, jag betraktar med järnhand denna förödelse i det norska arbetarområdet. Ett eldklot spred sig som klassfiendens sabotage mot det kollektiva boendet. Över hundra hus ligger i ruiner, borgarbrackor och folkfiender flyr gråtande medan deras katt blir ett offer för kapitalistmaffians kaos. Vi, partiet, likviderar sådan oordning med utrensningar av inkompetens. Inga allvarliga skador? Det är en seger för disciplinen, men paranoia säger att imperialisterna lurar i askan. Framåt mot kollektiv återuppbyggnad!"}, "date": "18 juli, 11:19", "url": "https://www.tv4.se/artikel/1yryZXiBOJrbVYudbAhiOb/se-foeroedelsen-efter-norska-storbranden-det-ser-ut-som-i-ett-krig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5rQporuZY2SSDqgjm7aCio%2Fece511ffcc827b5e7705ef133bfe1e8b%2Fcase_webb.jpg&width=120"}, {"type": "image-full", "heading": "Så får fler akademiker jobb efter examen", "summaries": {"normal": "Sverige har högsta akademikerarbetslösheten på 20 år med 110 000 arbetslösa. Centerpartiet föreslår en ny anställningsform, 'studentmedarbetare', där studenter kan arbeta deltid inom sitt utbildningsområde. Reformen syftar till att ge erfarenhet och underlätta övergången till arbetsmarknaden. Förslaget inkluderar även borttagande av inkomstprövning på studielån och sänkta arbetsgivaravgifter för att främja anställningar.", "trump": "Sverige har ett enormt problem – 110 000 akademiker utan jobb! Hemskt, verkligen hemskt. Jag skulle aldrig låta det hända. Centerpartiet har en idé, 'studentmedarbetare', låter som något jag skulle göra – smart, effektivt. Danmark gör det redan, och de skrattar hela vägen till banken. Sverige borde ha fixat det för länge sedan. Men nej, de sitter bara där och tittar bort. Jag skulle få det att hända på en vecka!", "stalin": "I Sverige slösar de bort mänsklig potential som om det vore gratis vodka på en kolchosfest. 110 000 akademiker utan arbete – ett kapitalistiskt misslyckande av högsta grad! Vi skulle aldrig tolerera sådan ineffektivitet. Centerpartiet föreslår 'studentmedarbetare', en halvmesyr som ändå är bättre än ingenting. Danmark, dessa danska revisionister, har redan visat vägen. Vi borde skicka en delegation för att studera deras metoder – eller bara ta över deras system, som vi gjorde med Baltikum. Arbetslöshet är ett brott mot folket!"}, "date": "18 juli, 09:54", "url": "https://www.gp.se/debatt/sa-far-fler-akademiker-jobb-efter-examen.4864176f-12c1-47eb-b174-ae9f23e86ae5", "imageUrl": "https://www.gp.se/images/article/4864176f-12c1-47eb-b174-ae9f23e86ae5/imag
