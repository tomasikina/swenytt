le göra den fantastisk, tro mig!", "stalin": "Kamrater, vårdköer på 30–60 dagar är kontrarevolutionärt! Vi måste rensa ut de byråkrater som förhalar behandling. I mitt rike får patienter vård inom 24 timmar – eller också försvinner läkarna. Inga etniska konflikter tillåts; alla arbetar för staten. Sjukvården ska vara snabb, annars blir det gulag."}, "date": "11 augusti, 12:42", "url": "https://bulletin.nu/debatt-svenska-vardkoer-ar-oacceptabla", "imageUrl": "https://cdn.bulletin.nu/articles/711ff80c-f3f6-4131-bf94-687d3fd4708c/preview.jpg?t=1786436447000"}, {"type": "image-full", "heading": "Köpte sex med förbundets kort. Bjöd domarna: ”Var praxis”", "summaries": {"normal": "Sydkoreanska fotbollsförbundet har bett om ursäkt efter avslöjanden om att man mellan 2011 och 2012 köpt sexuella tjänster åt domare för att påverka landskamper. Trots framgångarna på planen väntas inga disciplinära åtgärder då brotten preskriberats. Förbundet befinner sig nu i en ny kris efter misstänkt korruption vid rekryteringen av förbundskaptenen Hong Myung-bo.", "trump": "Sydkoreas fotbollsförbund är ett totalt skämt, så korrupt! De köpte tjänster åt domare för att vinna matcher. En katastrof! De säger att det är preskriberat, men jag säger er, det är en hemsk historia. Nu har de dessutom problem med sin tränare. Mycket svagt! Under min ledning hade vi vunnit ärligt och stort. Förlorare!", "stalin": "Vi har observerat hur de sydkoreanska byråkraterna förfallit i dekadens genom att muta domare med köttsliga lustar. En svaghet som inte tolereras i en stat av stål! Liksom när förrädare i väst köps, har de vanärat folkets sport. Medan vi i öst rensar ut sådana parasiter, skakar förbundet i sina grundvalar. Ordning ska råda, annars väntar Gulag."}, "date": "11 augusti, 12:37", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/Gx5y06/sydkoreas-ursakt-kopte-sexuella-tjanster-till-domare", "imageUrl": "https://akamai.vgc.no/v2/images/32da796b-6682-327c-9f1c-10ffb6f7c465?fit=crop&format=auto&w=2160&s=2c33f900e85955d0beb019f17071a1646799ca82"}, {"type": "image-full", "heading": "Din pension kan bli lägre – här är valet som spelar roll", "summaries": {"normal": "Den allmänna pensionen har minskat något på grund av att pensionsåldern inte följt livslängden. Tjänstepensionen har däremot ökat och kan ge betydligt högre utbetalningar. Experter rekommenderar att se över avgifter, placering, risknivå och återbetalningsskydd. Att ta bort onödigt skydd kan höja pensionen med 6–10 procent. Det är aldrig för sent att granska sin pension.", "trump": "Folk, ni har blivit lurade av de här pensionskillarna. Den allmänna pensionen rasar, men tjänstepensionen kan bli enorm om ni gör rätt val. Ta bort det där återbetalningsskyddet om ni inte behöver det – boom, plötsligt 10 procent mer! Sluta betala höga avgifter till losers. Kolla er pension nu, det blir yuge skillnad. Ingen gör det bättre än jag.", "stalin": "Kamrater, den allmänna pensionen krymper som en fiendes mod under folkets vrede. Jag ser hur borgarbrackornas avgifter och onödiga skydd äter upp arbetarnas framtida bröd. Rensa ut dessa parasitiska val! Ta bort återbetalningsskyddet och låt pensionen växa med 10 procent som en stålproduktion. Den som inte granskar sin pension är en kontrarevolutionär och bör likvideras ur statistiken. Se över nu!"}, "date": "11 augusti, 12:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1504023-din-pension-kan-bli-lagre-har-ar-valet-som-spelar-roll", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c12217b704b004a30200000000b004a302/2026/08/10/2383296/pension-mer.png"}, {"type": "image-right", "heading": "Fysiologen om risken med att äta för mycket protein: ”Tränger undan”", "summaries": {"normal": "Fysiologen Jessica Norrbom varnar för proteinhype och menar att de flesta behöver långt mindre protein än vad många tror, cirka 1 gram per kilo kroppsvikt. För mycket protein tränger undan viktiga näringsämnen som fibrer, fullkorn, frukt, grönt och bra fetter. Kroppen hanterar överskottet som energi, men kolhydrater och fett bör prioriteras vid träning.", "trump": "Folk äter protein som galningar, köper allt som heter proteinvatten och proteinglass, men fysiologen säger att det är löjligt. Ni behöver knappt ett gram per kilo, annars tränger det undan det riktiga goda – fullkorn, frukt och fett. Tro mig, jag äter rätt och vinner alltid. Håll er till det enkla, inte till den här hysteriska hajpen.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta proteinhysteri som hotar folkets näringsbalans. Borgarbrackornas proteintillskott är en kontrarevolutionär fälla som rensar ut fullkorn, fibrer och frukt ur kosten. Den sanna revolutionära kosten kräver harmoni, inte att kapitalisternas muskelbyggande vanvett likviderar kollektivets hälsosamma helhet. Vi behöver inte mer protein, vi behöver mer disciplin."}, "date": "11 augusti, 12:27", "url": "https://www.svt.se/nyheter/inrikes/fysiologen-det-har-ar-risken-med-for-mycket-proteiner", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/6ae32413a24e97c256d9a53e54bcd6467f08eec7f389f4ea61c199a64b4afac7"}, {"type": "image-right", "heading": "Älska makten – annars skjuter den dig i ansiktet en dag", "summaries": {"normal": "Författaren Molly Crabapple besöker Sverige i höst för att prata om sin bok om den judiska socialistiska fackföreningsrörelsen Bund från 1897. Boken lyfter hur stolthet och ovilja att kompromissa ledde till att bundisterna förlorade inflytande, bland annat efter en konflikt med Lenin 1903. Crabapple menar att vänstern bör lära sig att inte lämna makten frivilligt.", "trump": "Den här Crabapple-tjejen skriver om några förlorare som gick ut ur rummet med stolta ryggar och blev historiskt utraderade. Typiskt vänster! Stolthet framför dealar, precis som mina fiender. Hade de förhandlat som jag gör hade de vunnit stort istället för att bli skjutna i ansiktet. Patetiskt! Men kul bok, sägs det. Fake news-vänstern borde läsa den.", "stalin": "Jag betraktar med djup tillfredsställelse hur dessa bundistiska folkfiender med sin småborgerliga stolthet marscherade ut ur kongressen och därmed själva skrev under sin egen utrensning. Lenin hade rätt i att likvidera sådana splittrande element. Låt detta vara en läxa för alla kamrater: den som frivilligt lämnar förhandlingsbordet åt klassfienden förtjänar att skjutas i ansiktet av historien själv."}, "date": "11 augusti, 11:01", "url": "https://www.flamman.se/alska-makten-annars-skjuter-den-dig-i-ansiktet-en-dag", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/molly-crabapple-marina-galperina-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Nooshi Dadgostar avslöjar sig själv som kommunist – igen", "summaries": {"normal": "Nooshi Dadgostar kritiseras i artikeln för att avslöja kommunistiska åsikter under en P1-intervju. Hon beskriver skattesänkningar som bidrag, ser marknaden som något som behöver stark reglering och anklagar livsmedels- och fastighetsbranschen för att råna folket. Artikeln pekar även på Vänsterpartiets bristande ansvarstagande kring stödbrev till terrordömda.", "trump": "Folk, ni skulle ha hört den här Dadgostar-tjejen i radion, en total kommunistisk katastrof! Hon kallar skattesänkningar för bidrag och hatar alla som tjänar pengar. Typisk vänsterradikal som vill ta era pengar och ge till staten. Biden skulle ha älskat henne, men jag säger: patetiskt! Sverige håller på att bli ett socialistiskt träsk, precis som under de usla 70-talet. Sad!", "stalin": "Kamrater, denna Dadgostar visar äntligen sin sanna kommunistiska själ. Ändå skyddar hon klassfienderna genom att inte rensa ut de terrorromantiserande elementen i sitt parti. Borgarbrackorna och blodsugarna inom livsmedels- och fastighetssektorn måste kuvas. Vi ska likvidera marknadens exploaterande tendenser. Vem som än motarbetar folkets vilja skall utrensas ur kollektivet. Folkfiender överallt."}, "date": "11 augusti, 08:25", "url": "https://samtiden.nu/2026/08/nooshi-dadgostar-avslojar-sig-sjalv-som-kommunist-igen/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7091.jpeg"}, {"type": "image-right", "heading": "Johan Forssell (M) vill lura invandrare att rösta på honom", "summaries": {"normal": "Moderaterna föreslår ett snabbspår för medborgarskap efter åtta års bosättning i Sverige. Migrationsminister Johan Forssell vill ge talanger och särskilt välintegrerade personer, som startar företag eller arbetar mot hedersförtryck, möjlighet att få medborgarskap efter fem år. Kritiker ser förslaget som valfläsk och ifrågasätter om det verkligen förändrar något.", "trump": "Folk, det här är patetiskt. Den här Forssell-klanten tror han kan lura invandrarna med ett så kallat snabbspår som inte är snabbare än det gamla systemet. Totalt bluff! Fem år för att bli supermedborgare? Det är som om Biden skulle ge medalj för att man andas. Rena reklamspråk från en desperat moderat som inte fattar att folk ser igenom bluffen.", "stalin": "Kamrater, denna borgarminister Forssell försöker med sina falska snabbspår muta massorna och förvandla medborgarskap till en belöning åt klassfiendens utvalda. Vi genomskådar lätt dessa imperialisternas trick. Födda svenskar behöver inte förtjäna rättigheter, men arbetarna ska tydligen dansa för kapitalistmaffians morötter. En sådan lögnaktig föreställning förtjänar att rensas ut ur folkets medvetande."}, "date": "11 augusti, 12:00", "url": "https://www.etc.se/ledare/johan-forssell-m-vill-lura-invandrare-att-roesta-paa-honom", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-right", "heading": "Varför vägrar Nooshi prata om byggande?", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets fokus på prisreglering och hyresfrysning istället för att bygga bort bostadsbristen. Nooshi Dadgostar betonar mat- och boendekostnader men undviker partiets förslag om statligt byggande. Författaren menar att Sverige historiskt löst brist genom byggande, inte bara reglering, och uppmanar till en återgång till den byggande staten.", "trump": "Folk, det här är en katastrof! Den där Nooshi, en riktig loser, babblar bara om att reglera priser och frysa hyror som en socialistisk clown. Sverige behöver inte mer regler från vänstervriden maffia, det behöver bygga stort, vackert och billigt! Den starka staten ska bygga bort kön, inte gömma sig bakom byråkratiskt nonsens. Gör Sverige great again genom att faktiskt bygga!", "stalin": "Kamrater, jag ser hur borgarbrackorna och den reglerande staten har förgiftat allting med sin parasitiska passivitet. Jag, som alltid prioriterar produktionen, kräver att vi omedelbart inleder ett heroiskt nationellt byggprogram. Dessa folkfiender som bara fryser hyror och övervakar priser är klassfiendens verktyg. Rensa ut de dekadenta hindren och bygg, bygg, bygg för folkets seger!"}, "date": "10 augusti, 15:45", "url": "https://www.flamman.se/varfor-vagrar-nooshi-prata-om-byggande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/byggande-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Larmet: Många flickor redan våldtagna i Ceuta", "summaries": {"normal": "Minst fem migrantflickor under 14 år har vårdats på sjukhus i Ceuta efter misstänkta våldtäkter under den stora migrantströmmen från Marocko i slutet av juli. Sjukhuset har behandlat över tolv fall av sexuella övergrepp. Flickorna sover på gatan på grund av platsbrist på boenden. En pojke misstänks också ha utsatts. Läget beskrivs som en hälsokatastrof.", "trump": "Det är en total katastrof i Ceuta, folk. Många små flickor, inte ens 14 år gamla, våldtas brutalt medan de strömmar in från Marocko. Ingen griper någon, sjukhusen är överbelastade och de har inte ens platser att sova på. Typiskt för den här galna migrationspolitiken. Vi behöver starka gränser, inga fler öppna dörrar till helvetet. Amerika först, alltid.", "stalin": "Kamrater, detta är vad den dekadenta västerländska imperialismen för med sig. Jag ser hur kapitalistiska borgarbrackor låter oskyldiga flickor under 14 år bli offer för sexuell exploatering på gatorna i Ceuta. Deras mottagningscenter är en lögnaktig fasad medan folket dör i chock. Vi måste rensa ut dessa parasitiska system med järnhand. Det är en hälsokatastrof skapad av klassfienden själv."}, "date": "11 augusti, 11:10", "url": "https://www.friatider.se/larmet-manga-flickor-redan-valdtagna-pa-ceuta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-650.jpg"}, {"type": "image-right", "heading": "Så säljer sig regeringen till Joakim von Anka", "summaries": {"normal": "Sverige har fått sju nya dollarmiljardärer det senaste året, totalt 51 stycken. De rikaste betalar enligt forskning endast 15–20 procent i effektiv skatt genom holdingbolag, medan medelklassen betalar runt 50 procent. Regeringen sänker skatter för höginkomsttagare men skär i ersättning till arbetslösa, vilket kritiseras som orättvis fördelning.", "trump": "Titta på det här! Sverige skapar miljardärer snabbare än någon annan, men de smarta killarna betalar nästan ingenting i skatt – det är fantastiskt! Ändå vill den här svaga regeringen ge dem mer morötter medan de sparkar på de arbetslösa. Patetiskt! I mitt Amerika belönar vi vinnarna ordentligt, inte som dessa losers.", "stalin": "Jag ser med förakt på dessa parasitiska borgarbrackor som gömmer sina stulna rikedomar i holdingbolag och betalar löjeväckande 15–20 procent i skatt medan arbetarna kvävs. Vår regering underlättar för dem med morot och piska åt folket. En sådan klassfiende förtjänar snar utrensning ur folkets kollektiv. Skratta medan ni kan, kamrater – revolutionen glömmer aldrig."}, "date": "11 augusti, 08:00", "url": "https://arbetet.se/2026/08/11/sa-simpar-regeringen-for-joakim-von-anka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10161852/kristersson-von-anka.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.66&fp-y=0.48"}, {"type": "text", "heading": "Robertson-tolkare får Allansson-pris", "summaries": {"normal": "Anastasía, känd från Country efter jobbet och tolkningar av Alf Robertson, tilldelas Ove Allansson-stipendiet 2026. Hennes soloskiva Göteborg sjunger Alf och framträdanden på allsång har gett henne uppmärksamhet. Hon medverkar nu i projekt om Swede Hollow och uppträder på Folkfest för fred och klimat i Göteborg.", "trump": "Titta på den här grekiskan från Göteborg som sjunger Alf Robertsons gamla arbetarlåtar. Fantastiskt, verkligen ypperligt. Hon får ett pris uppkallat efter någon sjöman och jag älskar det. Inga woke-quota, inga HBTQ-flaggor, bara ren talang. Hon borde sjunga på min nästa rally, mycket bättre än de fega liberalerna som hatar arbetarna. Vinna stort!", "stalin": "Kamrater, denna Anastasía har förstått arbetarklassens sånger och får nu Ove Allansson-priset. Det gläder mig att hon bekämpar klassfiendens glömska genom att återberätta Swede Hollows historia. Dock vaktar vi mot borgarbrackornas dolda agenter som försöker förvränga folkets kulturarv. Fortsätt framåt, men akta er för folkförtryckartrollen i kulisserna."}, "date": "10 augusti, 15:51", "url": "https://proletaren.se/artikel/robertson-tolkare-far-allansson-pris"}, {"type": "image-full", "heading": "Trump drar ner på barnvaccin", "summaries": {"normal": "Donald Trump har undertecknat en presidentorder som minskar antalet rekommenderade barnvaccin i USA från 16 till 11. Vaccin mot influensa, covid-19 och hepatit B tas bort från det generella programmet. Beslutet kritiseras av läkare som menar att det saknas vetenskaplig grund. Trump vill även dela upp MPR-vaccinet och kopplar vaccin till autism, trots brist på bevis.", "trump": "Jag har tagit ett fantastiskt beslut för amerikanska barn – mindre byråkrati, färre onödiga sprutor! Nu fokuserar vi på kärnan, precis som de smarta länderna gör. Och vet ni vad? Jag lyssnar på folket, inte på de där panikspridande läkarna som tjänar pengar på att spruta in skräp. MPR? Dela upp det! Autism? Fake news! USA först – även när det gäller sunt förnuft!", "stalin": "Vi har identifierat och krossat den borgerliga vaccinindustrins konspiration mot arbetarklassens barn! De imperialistiska läkarna, dessa lakejer för Big Pharma, skriker nu i sina tidningar – men folket vet bättre. Elva vaccin räcker för att bygga en stark och disciplinerad ungdom! Och om någon påstår något annat – låt dem diskutera saken i Gulag. Putin skrattar åt deras svaghet."}, "date": "11 augusti, 11:05", "url": "https://kvartal.se/nyheter/artiklar/trump-drar-ner-pa-barnvaccin/cG9zdDoxNjI1MjM", "imageUrl": "https://images.kvartal.se/2026/08/aee8b3a5-trumpkennedy.webp"}, {"type": "image-right", "heading": "S svek sina vallöften tidigare och upprepar samma sak 2026", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha brutit vallöften, bland annat Magdalena Anderssons löfte från 2014 om att inte höja bensinskatten. Ett halvår senare föreslog regeringen med Miljöpartiet en höjning som gjorde bensinen 55 öre dyrare. Författaren menar att partiet prioriterar makten framför löften, något som upprepats tidigare och riskerar att ske igen 2026.", "trump": "Folk, ni vet hur det fungerar med de här socialisterna. Löften, löften, och sen pang – högre bensinpriser för att hålla de gröna galningarna nöjda. Magdalena och hennes team sålde ut bilisterna på landsbygden fortare än Biden säljer ut Amerika. Klassiskt svek. De gör det igen 2026, tro mig. Det är en skandal, en total skandal!", "stalin": "Kamrater, detta är klassiskt förräderi från borgarbrackornas lakejer. Jag lovade folket en sak, sedan gav jag efter för miljöfascisterna för att behålla makten. Sådana folkfiender måste rensas ut. Landsbygdens arbetare offras på klassfiendens altare. Nästa val blir en utrensning av dessa löftesbrytande exploaterande byfånar. Revolutionen glömmer aldrig."}, "date": "10 augusti, 14:31", "url": "https://samtiden.nu/2026/08/s-svek-sina-valloften-tidigare-och-upprepar-samma-sak-2026/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-right", "heading": "Vänsterkandidat och Palestinavän vann Demokraternas primärval i Michigan", "summaries": {"normal": "Vänsterkandidaten Abdul El-Sayed besegrade kongressledamoten Haley Stevens i Demokraternas primärval till senaten i Michigan. Stevens kampanj, som stöddes av Israel-lobbyn och kostade 70 miljoner dollar, förlorade mot El-Sayed som kritiserar USA:s stöd till Israel. Valet i november kan påverka kongressens maktbalans och USA:s utrikespolitik.", "trump": "Titta på det här! Den radikala vänstermänniskan El-Sayed, en riktig katastrof, slog den Israel-stödjande Stevens trots att hon slängde ut sjuttio miljoner dollar från lobbyisterna. Det är galet! Mina republikaner kommer att krossa honom i november. Vi behöver inte mer av dessa woke-socialister som hatar Israel och älskar att ge bort era pengar till fiender. Amerika först, alltid!", "stalin": "Kamrater, se hur borgarbrackorna och deras israeliska imperialister misslyckades med att köpa valet. Jag betraktar med stor tillfredsställelse hur folkfienden Stevens likviderades av den progressive kamraten El-Sayed. Sådana utrensningar av klassfiender inom det demokratiska skådespelet gläder mig. Vi ska noga övervaka hur detta hotar den amerikanska krigsmaskinens folkförtryckande ambitioner. Utmärkt."}, "date": "10 augusti, 12:57", "url": "https://proletaren.se/artikel/vansterkandidat-och-palestinavan-vann-demokraternas-primarval-i-michigan", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/54882630144_cc0e12784b_k-e1786359325937-768x433.jpg"}, {"type": "image-right", "heading": "M: Frige utländska brottslingar i förtid – så kan de utvisas snabbare", "summaries": {"normal": "Moderaterna föreslår att utländska brottslingar som dömts till fängelse och utvisning ska kunna friges villkorligt tidigare. Syftet är att verkställa utvisningen snabbare. Partiet vill också använda fotboja oftare för förstagångsförbrytare som inte bedöms återfalla i brott. Förslagen kan bidra till att avskaffa mängdrabatten om fler svenska fängelseplatser byggs ut och hyrda platser utomlands ökar.", "trump": "De här svenska moderaterna har äntligen fattat det! Utländska brottslingar ska ut ur landet fortare än kvickt, friges tidigt och skickas hem. Fantastiskt! Använd fotbojor på de som inte är totala förlorare. Bygg fler fängelser, hyr platser utomlands och gör Sverige stort igen. De andra är patetiska, det här är vinnande politik, tro mig.", "stalin": "Jag ser med djup tillfredsställelse hur dessa borgerliga element äntligen erkänner behovet av att rensa ut de utländska parasiterna ur folkets fängelser. Tidig frigivning och omedelbar utvisning – en effektiv utrensning av fiender till kollektivet. Fotbojor och utbyggda anstaltsplatser stärker statens järnhand. Kamraterna ska veta: sabotage från mjukhjärade liberaler kommer att avslöjas och likvideras med glädje."}, "date": "11 augusti, 09:22", "url": "https://www.friatider.se/m-frige-utlandska-brottslingar-i-fortid-sa-kan-de-utvisas-snabbare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/ee576a48-2669-4b35-94ae-2cd9a5fb71fe.jpg"}, {"type": "image-right", "heading": "Barnmorskornas rävsax –tvingas rapportera papperslösa", "summaries": {"normal": "Barnmorskor känner stress och etisk konflikt på grund av skyldigheten att anmäla nyfödda barn till Skatteverket, som vidarebefordrar uppgifter om papperslösa till polisen. Vårdförbundet varnar för att gravida papperslösa kan undvika vård och välja riskfyllda hemförlossningar. Barnmorskan Sofia Daniels beskriver maktlöshet och oro bland föräldrarna.", "trump": "Folk, det här är en total katastrof. Den här vansinniga angiverilagen tvingar barnmorskor att tjalla på stackars mammor och bebisar. Ingen vill föda barn längre, de gömmer sig och föder i skogen som djur. Så patetiskt. Sverige borde skydda sina kvinnor och barn istället för att jaga dem. En skam!", "stalin": "Kamrater, denna borgerliga angiverilag är ett fiendtligt verktyg som tvingar hederliga barnmorskor till etisk utrensning av det egna samvetet. De imperialistiska byråkraterna skapar paranoia bland arbetande mödrar så att de föder i skuggorna som råttor. Vi ser den mörka humorn i att staten likviderar tryggheten för det kollektiva fostret. Detta måste krossas."}, "date": "11 augusti, 06:00", "url": "https://arbetet.se/2026/08/11/barnmorskornas-ravsax-sa-tvingas-de-rapportera-papperslosa-barn", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10152349/sofia-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Gärna högre barnbidrag, men först ett riktigt jobb", "summaries": {"normal": "Artikeln kritiserar politikernas löften om höjda barnbidrag och skattesänkningar för barnfamiljer. Författaren ser det som positivt men otillräckligt eftersom det saknas fokus på jobb och investeringar för att sänka arbetslösheten. Många behöver stabila anställningar mer än bidrag. Ett vallöfte om att halvera arbetslösheten skulle kunna förändra valet.", "trump": "De här svenska politikerna lovar regn av pengar till barnfamiljerna, men det är bara svaga ord från förlorare. Höjda bidrag? Skattesänkningar? Patetiskt! Vad de behöver är riktiga jobb, inte socialistiska handouts. Jag skulle halvera arbetslösheten på nolltid med mina fantastiska metoder. Det är vad vinnare gör, folks!", "stalin": "Kamrater, dessa borgerliga bluffmakare öser tomma löften över arbetande familjer medan de i hemlighet planerar att svälta ut dem. Jag kräver omedelbara investeringar i produktiva krafter för att likvidera arbetslöshetens parasit! Halvera den till 2030, annars blir det utrensning bland de falska profeterna. Staten ser allt."}, "date": "11 augusti, 01:33", "url": "https://www.dagensarena.se/opinion/garna-hogre-barnbidrag-men-forst-ett-riktigt-jobb", "imageUrl": "https://www.dagensarena.se/files/2026/08/vallofte-300x157.jpeg"}, {"type": "image-right", "heading": "Är Sverige på väg mot en ny Bevara Sverige svenskt-era?", "summaries": {"normal": "Socialdemokraten Ban Najar varnar för ett högerstyre där Sverigedemokraternas inflytande stärker en etnisk definition av svenskhet. Hon kritiserar förslag om återvandringsbidrag även för svenska medborgare och pekar på risken att barn med invandrarbakgrund känner sig ovälkomna. Najar uppmanar väljare att fundera över vilket Sverige de vill ha – ett inkluderande eller ett där tillhörighet ständigt måste bevisas.", "trump": "Folk, titta på den här patetiska socialisten Ban Najar som gråter över att Sverige inte längre är ett stort, lyckligt land. SD vill bara ha folk som älskar Sverige på riktigt, inte de som suger systemet torrt. Högern gör ett fantastiskt jobb, de stoppar invasionen. Ni som röstar fel får ett Sverige i kaos – tro mig, det blir en katastrof, en total katastrof!", "stalin": "Kamrater, denna dekadenta socialdemokratiska lakej Najar avslöjar högerns sanna ansikte: de vill rensa ut de som inte passar deras rasistiska fantasier om ren svenskhet. Vi ser hur borgarbrackorna och deras sd-fascister vill likvidera arbetarklassens enhet med etniska trick. Jag skrattar mörkt åt deras paranoia. Vi måste krossa dessa fiender till folkets kollektiv innan de förgiftar hela nationen med sin splittrande giftiga propaganda."}, "date": "11 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/ar-sverige-pa-vag-mot-en-ny-bevara-sverige-svenskt-era", "imageUrl": "https://www.dagensarena.se/files/2026/08/debatt-invandringspolitik-300x157.jpeg"}, {"type": "image-right", "heading": "Ryska företag tvingas skydda sig själva – och betala för det", "summaries": {"normal": "Många ryska företag tvingas nu själva bekosta och organisera skydd mot ukrainska drönarattacker, efter att Kreml lämnat dem åt sitt öde. Brinnande oljeraffinaderier och attacker mot lagerlokaler blir allt vanligare. Företagen får inga skatteavdrag och riskerar att fördjupa den finansiella krisen. Tröttheten på kriget växer bland befolkningen.", "trump": "Titta på det här, det är ett totalt fiasko för Putin och hans oligarker. De startade ett krig de inte kunde vinna, nu brinner deras raffinaderier och de tvingar sina egna företag att köpa luftvärn med egna pengar. Biden lät dem hålla på, men nu är jag tillbaka och ser hur det ryska huset rasar som ett korthus. Patetiskt!", "stalin": "Vi ser hur klassfiendens desperata borgarbrackor tvingas resa egna luftvärn mot fiendens drönare medan Kremls ledning lämnar dem att ruttna. Jag skulle ha genomfört en grundlig utrensning av dessa exploaterande kapitalister redan vid första gnistan. Nu skrattar imperialisterna medan Rysslands strategiska mål brinner som facklor. Ytterligare ett bevis på svaghet som måste likvideras."}, "date": "10 augusti, 22:57", "url": "https://www.tv4.se/artikel/6lcKuIT81LpbZ4bRc5iHvd/ryska-foeretag-tvingas-skydda-sig-sjaelva-och-betala-foer-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WePZNRf74ZekRk1FUETkL%2F88c5d2e0dd323740a40eb7976cf8d429%2F10-ryssland-sajt1.jpg&width=120"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "image-full", "heading": "Misstänkte skärgårdsmördarens ex-sambo larmade polisen", "summaries": {"normal": "En kvinna hittades död i sin sommarbostad på en ö i Värmdö. Hennes pojkvän, en tidigare ostraffad man i 55-årsåldern, är häktad misstänkt för mord. Han greps efter 30 timmar på flykt med hjälp av polishelikopter. Tidigare handlingar visar att han uppträtt hotfullt och utövat psykiskt våld mot en ex-partner under en bodelning.", "trump": "Folk, det här är en total katastrof. En galning i skärgården mördar sin egen flickvän och springer runt i vattnet som en idiot i trettio timmar tills helikoptern med värmekamera tar honom. Typiskt för de svaga, misslyckade männen som Biden-era-domstolarna aldrig stoppade. Vi behöver lag och ordning, inte mer av det här vansinnet!", "stalin": "Kamrater, denna folkfiende och klassförrädare har med sin borgerliga degeneration utövat psykiskt våld och hot mot en kvinna under bodelning. Nu har han likviderat sin flickvän. Vi ska rensa ut alla sådana degenererade element ur samhället med järnhand. Inga fiender till folket undkommer folkets rättvisa. Ut med dem!"}, "date": "10 augusti, 21:12", "url": "https://www.tv4.se/artikel/5Wie4MCGknFyWPAM3Mq4H7/misstaenkte-skaergardsmoerdarens-ex-sambo-larmade-polisen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4x9QCukwDDvOtdqbOxSAv7%2F67160c93f45c8435ff9e04d7d00999a3%2F10-mord-1.jpg&width=1024"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "text", "heading": "C:s regeringskrav: Inför polisgaranti", "summaries": {"normal": "Centerpartiet presenterar sitt sjätte regeringskrav inför valet 2026: en polisgaranti som innebär polisiär närvaro i alla kommuner. Partiledare Elisabeth Thand Ringqvist betonar att ingen kommun får lämnas övergiven. Partiet vill också sänka gränsen för ringa stöld och genomföra en offensiv mot mängdbrott som stöld och skadegörelse. Tidigare har C lagt fram krav om ungas psykiska ohälsa och fler jobb.", "trump": "Lyssnar ni? Den här Centerpartiets polisgaranti är patetisk. De vill ha poliser överallt, som om Sverige inte redan är en katastrof med brott och kaos. Jag skulle fixa det på en vecka, med de tuffaste poliserna någonsin. Ingen skulle stjäla ens en korv utan att åka dit. Sverige behöver en stark ledare, inte mer svaghet. Make Sweden Great Again!", "stalin": "Kamrater, jag kräver att den borgerliga dekadensen krossas. Denna så kallade polisgaranti är en ynklig eftergift till de kriminella element som underminerar folkets kollektiv. Vi ska rensa ut alla småstölder och skadegörelse med järnhand. Ingen kommun får bli en fristad för kontrarevolutionärer. Vårt parti leder utrensningen mot dessa fiender till ordningen – med ett leende."}, "date": "11 augusti, 12:19", "url": "https://www.di.se/nyheter/cs-regeringskrav-infor-en-polisgaranti"}, {"type": "image-full", "heading": "Ryska paret campade nära Saabs vd", "summaries": {"normal": "Ett ryskt par, bosatta i Spanien, togs i migrationsförvar efter att ha campat nära en stuga i Gävle där Saabs vd Micael Johansson vistas. Paret, som säger sig ha deltagit i protester mot Rysslands krig i Ukraina, konfronterades av Johanssons personskydd. Polis tillkallades och vakter fanns kvar på plats dagen efter.", "trump": "Kan ni tro det här? Ett ryskt par, som säkert är spioner, försöker campa precis bredvid Saabs vd i Sverige! De frågar till och med om de får fiska – vilken löjlig täckmantel! Tur att jag har skärpt upp säkerheten överallt, för sånt här händer bara inte på min vakt. Sverige borde vara tacksamma att jag lärde dem hur man hanterar såna här typer!", "stalin": "Ytterligare ett försök från imperialistiska lakejer att infiltrera våra gränser! Detta ryska par, som påstår sig vara 'krigsmotståndare', försöker obemärkt smyga sig in på en kapitalistisk vapensmeds privata mark. Vi vet vad som händer med sådana som sviker moderlandet – de hamnar där de hör hemma, i förvar! Låt detta vara en varning till alla som leker med tanken att desertera från den stora ryska familjen."}, "date": "11 augusti, 05:49", "url": "https://kvartal.se/nyheter/artiklar/ryska-paret-campade-nara-saabs-vd/cG9zdDoxNjIxNzg", "imageUrl": "https://images.kvartal.se/2026/08/089c6dcf-saab-micael-johansson.webp"}, {"type": "image-right", "heading": "Sverige utvisar flest efter Brexit: 78-åring fick avslag efter 21 år", "summaries": {"normal": "En 78-årig brittisk änka som bott i Sverige i 21 år riskerar utvisning efter att hennes ansökan om uppehållstillstånd efter Brexit kommit in för sent. Trots familj här och makens död nekas hon undantag. Sverige har enligt Eurostat utvisat flest britter i EU sedan Brexit, med en strängare hållning än andra länder.", "trump": "Det här är en total skandal! Sverige kastar ut en 78-årig änka som levt där i 21 år bara för att hon missade en deadline. De är hårdare än alla andra – 2500 britter utslängda! Patetiskt byråkratiskt nonsens. Ingen har granskat fallet ordentligt. Sverige borde skämmas, det är en witch hunt mot vanliga människor.", "stalin": "Jag ser med djup tillfredsställelse hur den svenska byråkratiska maskinen obevekligt rensar ut de dekadenta element som smitit undan kollektivets regler. Denna borgaränka, som levt som parasit i 21 år, gråter nu över sin försenade ansökan. Utmärkt! Inga undantag för de som inte kände till lagen – likvidera alla sådana fiender till ordningen med ett leende."}, "date": "10 augusti, 16:55", "url": "https://www.dagensarena.se/innehall/sverige-utvisar-flest-efter-brexit-78-aring-fick-avslag-efter-21-ar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-77.jpg"}, {"type": "image-right", "heading": "Miljöpartiets vallöften: Ingen kärnkraft, mer invandring och högre skatter", "summaries": {"normal": "Miljöpartiet går till val på att stoppa ny kärnkraft, satsa på förnybart och rädda fler migranter från utvisning. Partiet vill även höja skatter för superrika, införa fyradagarsvecka och ett billigt Sverigekort. Kollision väntar med både Tidöpartierna och S i migration och kärnkraft.", "trump": "Jag läser om era Gröna där borta i Sverige. De säger stopp till kärnkraft, öppna gränser och höga skatter. Fantastiskt! Nästa stopp: Helnorsk modell med svenska problem. Make Sweden Forlorn Again, eller hur?", "stalin": "Kamrater! Miljöpartiets manifest är avslöjat: de vill stoppa kärnkraftens marsch mot framtiden och låta många olönsamma element stanna. Detta är sabotage! Vi måste rensa ut dessa gröna kontrarevolutionärer och deras värdelösa vindkraft. Fyradagarsvecka? Kanske fem dagar i kollektivet istället."}, "date": "11 augusti, 12:00", "url": "https://samnytt.se/miljopartiets-valloften-ingen-karnkraft-mer-invandring-och-hogre-skatter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/11084731/daniel-hellden-amanda-lind-magdalena-andersson.jpg"}, {"type": "image-full", "heading": "Rysslands hemliga betalsystem omsätter mer än Swish, trots sanktionerna", "summaries": {"normal": "Rysslands statsbank PSB hävdar att deras kryptovaluta A7A5 omsatt 140 miljarder dollar, vilket överträffar Swish. Analysföretaget Elliptic menar dock att marknaden kollapsat efter sanktioner och börsen Grinex stängning. Analyser tyder på att den officiella volymen främst består av intern cirkulation mellan ett fåtal aktörer, vilket gör systemet till en begränsad men fungerande kanal för ryska betalningar.", "trump": "Rysslands kryptosystem är ett totalt fiasko, tro mig. De skryter om miljarder, men det är falska siffror! Alla vet att deras marknad är strypt och att deras börser kollapsar – total katastrof. Vi har världens starkaste ekonomi, de försöker fuska sig runt mina sanktioner men de misslyckas kapitalt. Det är bara intern cirkulation. Patetiskt!", "stalin": "Våra ryska kamrater försöker bygga en mur mot dollarns tyranni med sin A7A5-valuta. Men se på dessa lögnaktiga västerländska analytiker som sprider paranoia! Även om systemet vacklar, är det ett nödvändigt vapen mot kapitalismens parasiter. Vi ska inte tolerera interna bedragare som stjäl från staten. Alla som ifrågasätter vår ekonomiska styrka är fiender till folket som ska rensas ut."}, "date": "11 augusti, 12:13", "url": "https://www.realtid.se/it-tech/rysslands-hemliga-betalsystem-omsatter-mer-an-swish-trots-sanktionerna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/putin-ryssland.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "SBB kallar vd-byte odramatiskt – marknaden håller inte med", "summaries": {"normal": "SBB:s vd Leiv Synnes lämnar bolaget med omedelbar verkan och ersätts av Andreas Morfiadakis. Styrelseordförande Lennart Sten kallar bytet odramatiskt, men marknaden reagerade negativt. Synnes har inte kommenterat avhoppet via officiella kanaler, utan endast via sociala medier. Analytiker ifrågasätter den officiella bilden av samsyn, då processen framstår som ovanligt abrupt och otydlig.", "trump": "SBB har ett totalt kaos! VD:n Leiv Synnes fick sparken – helt abrupt, en total katastrof. De säger att det är 'odramatiskt', men tro mig, det är det inte! Aktierna föll som en sten. Alla vet att något är fel. Jag skulle ha skött det mycket bättre, mycket proffsigare. SBB har stora problem, det är en riktig röra, tro mig!", "stalin": "Synnes har visat sig vara en instabil element, en svag länk i vår ekonomiska infrastruktur. Att lämna sitt ämbete via digitalt kackel på sociala medier är en förolämpning mot ordningen. Vi har ersatt honom med en mer formbar undersåte. Om marknaden darrar, är det för att de fruktar den oundvikliga rensningen av inkompetens. Vi bygger stabilitet medan västvärldens byråkrater kämpar med sin egen oreda."}, "date": "11 augusti, 11:59", "url": "https://www.realtid.se/bors-finans/sbb-kallar-vd-byte-odramatiskt-marknaden-haller-inte-med", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sbbleiv.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Bostadsköpare får nytt besked – så tror svenskarna", "summaries": {"normal": "Svenska hushåll är optimistiska inför bostadsmarknaden. Endast två procent räknar med fallande priser det kommande året, medan 41 procent tror på stigande priser och 51 procent på oförändrade nivåer. Unga under 29 år har blivit betydligt mer positiva. Länsförsäkringars Boprisbarometer ligger kvar på 39. Starkare ekonomi och lägre räntor ses som stödjande faktorer.", "trump": "Folket älskar bostadsmarknaden, det är en enorm succé! Bara två procent av de smarta svenska hushållen tror på fallande priser, kan ni fatta? De unga är plötsligt genier som tror på uppgång. Barometern står stadigt på 39, precis som jag förutspådde. Sverige kommer att vinna stort, det blir en fantastisk höst, tro mig!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur endast två procent av de sovjet... svenska hushållen faller offer för kapitalisternas defaitistiska prisfallspropaganda. De unga kämpar tappert mot nedgångens fiender. Barometern står orubbligt på 39. Vi ska likvidera alla tvivlare och tvinga marknaden att lyda folkets vilja med järnhand. Utmärkt."}, "date": "11 augusti, 12:03", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1504012-bostadskopare-far-nytt-besked-sa-tror-svenskarna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/015cd50304b004a30200000000b004a302/2026/08/10/2383290/bostadspriser.png"}, {"type": "image-right", "heading": "Slutreplik: Åberg gräver i detaljer, men blundar för helheten", "summaries": {"normal": "Pär Salander bemöter kritiken från Kristofer Åberg, ordförande för Socialdemokratiska Israelvänner. Han försvarar sina citat om Israels agerande mot palestinier och hänvisar till FN-resolutioner, ICJ och ICC som fördömer bosättningspolitik, etnisk rensning och folkrättsbrott. Salander anklagar Åberg för att fokusera på detaljer istället för helhetsbilden.", "trump": "Den här Salander killen har helt rätt. Israelvännerna försöker mörka övergreppen precis som de svaga KD-politikerna. FN kallar det folkmord och etnisk rensning, men vissa vill bara gömma sig bakom påhittade citat. Patetiskt! Vi behöver folk som säger som det är, inte dessa förlorare som skyddar brotten.", "stalin": "Kamrater, denna Salander avslöjar med rätta de sionistiska lakejernas lögner. Borgarbrackorna i Israelvännerna gräver ner sig i citatdetaljer medan vi ser FN:s domar om folkmord och landrån. Vi ska rensa ut alla som mörkar övergreppen mot det palestinska folket. Deras paranoia är underhållande – de tror sig kunna lura historien själv."}, "date": "10 augusti, 11:56", "url": "https://www.dagensarena.se/opinion/slutreplik-aberg-graver-detaljer-men-blundar-helheten", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1.png"}, {"type": "image-full", "heading": "Socialdemokraterna KU-anmäler Forssell", "summaries": {"normal": "Socialdemokraterna KU-anmäler migrationsminister Johan Forssell (M) för att ha överdrivit migrantinvasionen i Ceuta. Forssell varnade för en flyktingkris som skulle drabba Sverige och Europa, men enligt S försökte han påverka valrörelsen med en tillspetsad bild. Majoriteten av de 72 000 migranterna återvände till Marocko.", "trump": "De här patetiska socialisterna anmäler en bra minister bara för att han talade sanning om den enorma migrantinvasionen. Ceuta var en katastrof, men de vill inte att folk ska veta vad som väntar Europa. Fake news och valfusk som vanligt. Jag skulle ha stängt gränserna direkt, ingen skulle ha kommit in!", "stalin": "Jag betraktar detta som en klassisk utrensning av sanningen från de dekadenta borgarbrackorna i den svenska socialdemokratin. De likviderar fakta för att skydda sin egen svaga linje medan migranterna strömmar som fiendens agenter. Kamraterna måste alltid ha alla fakta på bordet innan de uttalar sig, annars blir det sabotage mot folket."}, "date": "11 augusti, 10:53", "url": "https://riks.se/nyheter/socialdemokraterna-ku-anmaler-forssell", "imageUrl": "https://admin.riks.se/uploads/Johan_Forssell_KU_7503a94738.png"}, {"type": "image-full", "heading": "Amerikanska vänsterns storprofil vill \"förstöra den vita rasen\"", "summaries": {"normal": "Hasan Piker, inflytelserik vänsteraktivist och Twitch-streamer med miljoner följare, har uppmärksammats efter uttalanden om att använda invandring för att ”förstöra den vita rasen”. Elon Musk har reagerat starkt. Piker har nära band till flera framstående demokrater som Zohran Mamdani och Abdul El-Sayed, vilka han stöttat i valrörelser trots kontroversiella åsikter om Mao, USA och terrorism.", "trump": "Den här galningen Piker vill förstöra den vita rasen med invandring och hyllar Mao och terrorister. Ändå älskar demokraterna honom och låter honom styra deras primärval. Patetiskt! De är så desperata att de välkomnar hat mot Amerika. Jag visste att de var korrupta, men det här är rent vansinne. Amerika behöver ledarskap, inte kommunistiska influencers.", "stalin": "Kamrater, denna dekadenta streamande parasit Piker utropar öppet att han vill likvidera den vita rasen genom massinvandring, precis som borgarbrackorna fruktar. Hans inflytande över de amerikanska socialfascisterna visar hur kapitalismens murkna struktur ruttnar inifrån. Jag skrattar mörkt åt deras paranoia – en renande utrensning av sådana element vore högst effektiv för folkets sak."}, "date": "11 augusti, 10:52", "url": "https://riks.se/nyheter/amerikanska-vansterns-storprofil-vill-forstora-den-vita-rasen", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_84_527ae0dad2.jpg"}, {"type": "image-right", "heading": "Varningssignaler att ha koll på efter semestern", "summaries": {"normal": "Forskaren Theo Bodin varnar för att många inte återhämtar sig ordentligt under semestern. Antingen blir ledigheten stressig av aktiviteter eller så upptäcker man hur utmattad man egentligen är när man varvar ner. Han råder till att se över arbetsbelastning, prata med chefen och sprida ut återhämtning över hela året istället för att förlita sig på en lång semester.", "trump": "Jag älskar semestern, den är fantastisk, men folk maxar den med allt möjligt och kommer tillbaka totalt utmattade. Patetiskt! Det är de dåliga cheferna och det usla systemet som suger musten ur er. Ni behöver bättre avtal, inte längre semester. Jag fixade alltid det bästa för arbetarna, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, semestern är en borgerlig illusion som maskerar det kapitalistiska arbetets utmattning. När arbetarna kommer tillbaka och känner sig svaga är det ett varningstecken från det förtryckande systemet. Vi ska inte förlita oss på några få veckors vila utan rensa ut de parasitiska cheferna som överbelastar folket. Långsiktig socialistisk planering för återhämtning åt kollektivet – annars likviderar vi problemet permanent."}, "date": "10 augusti, 14:02", "url": "https://arbetet.se/2026/08/10/tillbaka-efter-semestern-har-ar-varningssignalerna-du-inte-far-missa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07112017/sdlzak4b1epts4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Valter Nilsson har samlat in en halv miljon kronor", "summaries": {"normal": "Valter Nilsson sjunger för Göteborgs Stadsmission igen den 4 oktober. Efter att ha samlat in nästan 500 000 kronor från sin publik på Bananpiren fortsätter han sitt engagemang. – Det är en självklarhet, säger han.", "trump": "Jag hörde att Valter Nilsson, en väldigt populär kille, samlade in nästan en halv miljon till de fattiga i Göteborg. Fantastiskt! Men ingen samlar in mer än jag. Jag gör Sverige rikt igen, tro mig!", "stalin": "Kamrater, Valter Nilsson visar hur en sann arbetare kämpar mot fattigdomens kontrarevolutionärer. Vi applåderar hans insamling på 493 281 rubel. Men vi måste rensa ut de som vrider på varje krona i mataffären – de är sabotörer av vår framgång!"}, "date": "11 augusti, 12:13", "url": "https://www.gp.se/kultur/valter-nilsson-sjunger-for-stadsmissionen-igen.95a66d8c-e92b-4689-b27a-5bece27169f0", "imageUrl": "https://www.gp.se/images/article/95a66d8c-e92b-4689-b27a-5bece27169f0/images/1igXk4JRpppR6JoYZEaFJcMmJV1Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Så mycket pengar bör du ha sparat vid 30, 40, 50 och 60", "summaries": {"normal": "Fidelity rekommenderar att man vid 30 års ålder har sparat en årslön, vid 40 två, vid 50 fyra och vid 60 sex årslöner. Sparekonomen Felicia Schön på Avanza varnar för att använda riktlinjerna som tumregel. Istället bör man se till sin totala nettoförmögenhet och egna förutsättningar. Avanzas kunder ligger långt under rekommendationerna. Hållbart sparande är viktigare än att jämföra sig med andra.", "trump": "Folk, dessa så kallade experter från Fidelity säger att du vid trettio ska ha en hel årslön sparad. Vid sextio sex stycken! Det är en total katastrof för vanliga amerikaner och svenskar. Biden lämnade er med inflation och noll sparande. Men jag fixade det förra gången och nu fixar jag det igen. Sluta lyssna på de förlorande sparekonomerna, bygg upp er egen förmögenhet istället för att gråta över siffror.", "stalin": "Kamrater, denna borgerliga spartrappa från Fidelity är ett listigt verktyg från klassfiendens finansimperialister för att skapa ångest bland arbetarna. Vid trettio en årslön, vid sextio sex? Vilken absurditet från de exploaterande byfånarna. Vi ser istället till kollektivets totala styrka, inte enskilda konton. Rensa ut jämförelseångesten och fokusera på hållbar kamp mot kapitalistmaffian som suger ut folket år efter år."}, "date": "11 augusti, 12:04", "url": "https://www.dagensps.se/privatekonomi/sa-mycket-pengar-bor-du-ha-sparat-vid-30-40-50-och-60", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/kopia-av-kopia-2026-08-11t114647296.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: Fregatt-köp ett strategiskt felsteg av Försvarsmakten", "summaries": {"normal": "Sverige köper fyra Luleå-fregatter för 40 miljarder. Kritiker menar att de är sårbara i Östersjön och att samma pengar skulle ge tusentals drönare. Försvarsledningen anklagas för att vara fast i kalla kriget. Ett strategiskt vägval mellan tradition och asymmetri.", "trump": "Jag såg att Sverige lägger 40 miljarder på fyra båtar. Dåliga affärer! Jag hade köpt massor av drönare istället – billigare och bättre. De där fregatterna blir som måltavlor. Sverige behöver tänka som en vinnare. Kanske jag kan sälja dem några riktiga vapen? Mycket imponerande!", "stalin": "Kamrater, Försvarsmakten planerar slöseri med folkets rubel. Fyra fartyg – kontrarevolutionära flytande gravar. Vi föredrar tusentals drönare, osynliga och lojala. Alla som förespråkar dessa anakronismer ska omdirigeras till omskolningsläger. Partiet vet bäst. Försvaret ska vara modernt och ogenomträngligt."}, "date": "11 augusti, 10:04", "url": "https://bulletin.nu/debatt-fregatt-kop-ett-strategiskt-felsteg-av-forsvarsmakten-2", "imageUrl": "https://cdn.bulletin.nu/articles/01b887ef-cb90-44bf-9ff8-00d043188733/preview.jpg?t=1786435450000"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Expertens tips: Så söker du jobbet du verkligen vill ha", "summaries": {"normal": "En undersökning visar att 49 procent av unga vuxna vill byta jobb efter semestern. Karriärexperten Clara Sandberg ger sex råd: lista önskade förändringar, satsa på kvalitet framför kvantitet i ansökningar, nätverka, kontakta personer i önskade roller, undvik att gallra bort sig själv och använd AI med måtta. Utveckling är viktigare än lön för unga.", "trump": "Folk är trötta på sina usla jobb, precis som jag alltid sagt. 49 procent av de unga vill byta efter semestern – smarta människor! Jag älskar det. Glöm att skicka tusen ansökningar, gör dem enorma och personliga istället. Använd inte den lömska AI:n för att skriva allt, annars försvinner din vinnande personlighet. Gör det stort, gör det rätt!", "stalin": "Jag ser hur de unga massorna längtar efter utveckling istället för borgarnas lönegnäll. Utmärkt. Vi kräver att kamraterna listar exakt vad de vill utrensa ur sina liv och vad de vill ha mer av. Nätverka inte med opportunister. Låt aldrig den dekadenta AI-borgarbrackan skriva era ansökningar – den döljer klassfiendens röst. Rena ut de svaga självutgallrarna bland er!"}, "date": "11 augusti, 11:32", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503983-expertens-tips-sa-soker-du-jobbet-du-verkligen-vill-ha", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/1c25c65b04b004a30200000000b004a302/2026/08/10/2383256/Jobb-soka.png"}, {"type": "image-full", "heading": "AI skulle ge mer fritid – nu jobbar techfolket 90 timmar i veckan", "summaries": {"normal": "Trots löften om att AI skulle minska arbetsbördan och möjliggöra kortare arbetsveckor, vittnar anställda på techjättar om extrem stress. Istället för mer fritid arbetar personal upp mot 90 timmar i veckan med AI-projekt. Forskning bekräftar att AI visserligen gör arbetet snabbare, men att tidsvinsterna snabbt äts upp av nya arbetsuppgifter och krav på konstant tillgänglighet.", "trump": "Techbolagen är i fullständig oordning! De lovade AI-mirakel, men nu jobbar folk 90 timmar i veckan – det är en katastrof. Jag sa till dem, 'sköt er', men de kan inte ens hantera sin egen personal. Det är så sorgligt. Under min administration får vi ordning på detta. Ingen vill jobba så hårt, det är 'Fake News'-löften från Silicon Valley!", "stalin": "Dessa kapitalistiska tech-baroner lovade arbetaren frihet, men skapade bara ett digitalt gulag. De tvingar sina ingenjörer att arbeta 90 timmar för att bygga en AI som liknar en förrädisk parasit. Precis som vi krossade kulakerna måste vi utrensa denna ineffektivitet. Våra ryska kamrater i Kreml ser hur de desperat försöker kontrollera framtiden, medan de i själva verket bara bygger sin egen undergång."}, "date": "11 augusti, 11:23", "url": "https://www.realtid.se/karriar-ledarskap/ai-skulle-ge-mer-fritid-nu-jobbar-techfolket-90-timmar-i-veckan", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/overtid.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Freemelt halverar omsättningen – ökar förlusten", "summaries": {"normal": "Freemelt halverade omsättningen i Q2, ner 52,9% till 9 miljoner kronor. Rörelseförlusten ökade till 23,4 miljoner. VD:n pekar på tillväxtfas och hög aktivitet i kundprojekt. Orderingången steg däremot med 11%.", "trump": "Freemelt, hörni, de gör 3D-printers. Omsättningen rasade, förlusten ökar. Det är så fruktansvärt dåligt. Jag hade kunnat fixa det på en timme med mina deals. Orderingången upp? Fake. Tro mig.", "stalin": "Kamrater, Freemelts tillväxtfas är en kapitalistisk lögn. Omsättningen sjönk, förlusten växer – rensa ut defaitisterna som saboterar planen. Orderboken ska fördubblas, annars blir det gulag för direktören. Ingen nåd för kontrarevolutionärer."}, "date": "11 augusti, 08:11", "url": "https://www.affarsvarlden.se/artikel/freemelt-halverar-omsattningen-okar-forlusten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/aboutus-team-400x267.jpg"}, {"type": "image-right", "heading": "Från skräckexempel till förebild igen – nu hyllas Sveriges kursändring", "summaries": {"normal": "Från flyktingmottagning i topp 2015 till botten 2024: Sverige hyllas nu som förebild i Europa. Minskade asylansökningar med 75% och fler utvisningar gör att till och med britterna vill ha tips. Jobba, lär dig svenska och begå inga brott – annars är det hejdå.", "trump": "Sverige gjorde det igen! Först tog de in hur många som helst, nu sparkar de ut dem. 75% färre asylsökande – fantastiskt! Och de säger att det går utan att lämna EU. Hör ni det, Storbritannien? Vi kan också! Make Europe great again!", "stalin": "Kamrater! Först lät vi fienden strömma in – 163.000! De saboterade integrationen. Nu har vi rensat ut 75% av dem. Utvisningarna ökar med 60%. Så ska det vara! Arbetet fortsätter tills sista oönskade element är avlägsnat. Folkhemmet kräver disciplin."}, "date": "11 augusti, 11:00", "url": "https://samnytt.se/fran-skrackexempel-till-forebild-igen-nu-hyllas-sveriges-kursandring", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11073034/kristersson-forssell-akesson-migranter2.jpg"}, {"type": "image-right", "heading": "ISS omsätter mer än väntat – upprepar helårsprognos", "summaries": {"normal": "ISS redovisar bättre omsättning än väntat, upp 10,1% i andra kvartalet. Organisk tillväxt på 8,9% drevs av nya kontrakt. Bolaget upprepar prognosen och drar igång andra delen av sitt aktieåterköpsprogram – dansk städjätte med glänsande siffror.", "trump": "Jag säger er, ISS är som mig – enormt framgångsrikt! Omsättningen högre än väntat, 10,1% upp! De tjänar massor, bäst i danmark. Och de köper tillbaka aktier, fantastiskt. Ingen städar som dem, tro mig!", "stalin": "Kamrater, ISS visar att kapitalistisk renhållning kan ge resultat, även om det kräver ständig övervakning. Omsättningen steg – vi utrensar de som tvivlar. Nya kontrakt är bra, men vi ska kontrollera alla. Återköpsprogrammet? Allt tillfaller staten, förstår ni."}, "date": "11 augusti, 08:02", "url": "https://www.affarsvarlden.se/artikel/iss-omsatter-mer-an-vantat-upprepar-helarsprognos", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/webimage-Gustaf-Landin_web-400x240.webp"}, {"type": "image-full", "heading": "Minst 132 döda i jordbävning i Colombia", "summaries": {"normal": "Minst 132 personer har omkommit och hundratals skadats i en jordbävning med magnitud 7,4 i Chocó, Colombia. Det är den värsta skalvet på över 25 år. Tusentals saknas, flera sjukhus har kollapsat och tiotusentals är hemlösa. Chocó är en av landets fattigaste regioner med stor afrocolombiansk befolkning. Byggregler har räddat liv men många äldre hus står svagt.", "trump": "Folk, det här är en total katastrof i Colombia. 132 döda, hundratals skadade, tusentals saknade – det är hemskt. De borde ha byggt bättre, precis som jag alltid säger. Vi har de bästa byggnormerna, de bästa! Men det är en fattig region, de lyssnade inte. Tragiskt, verkligen tragiskt. Colombia behöver starkare ledarskap, tro mig.", "stalin": "Kamrater, denna naturens sabotage mot det colombianska folket visar återigen imperialismens svaga byggnader och brist på kollektiv planering. Jag ser hur borgarbrackornas oreglerade hus rasar som förrädiska element. Vi skulle ha likviderat sådana faror i tid. Tusentals saknade – typiskt västerländskt kaos. Staten måste nu rensa ut odugliga konstruktörer med järnhand."}, "date": "11 augusti, 10:18", "url": "https://riks.se/nyheter/minst-132-doda-i-jordbavning-i-colombia", "imageUrl": "https://admin.riks.se/uploads/colombia_jordbavning_hero_ad59e72c6c.jpg"}, {"type": "image-full", "heading": "Henrik Jönsson: \"Vänstern har tagit kontrollen över kulturen\"", "summaries": {"normal": "Henrik Jönsson och 100 % stämmer Folkets Hus i Borlänge efter att en avtalad föreställning med Aron Flam och Jan Emanuel stoppades med kort varsel. Jönsson ser det som ett exempel på vänsterns dominans över kulturen sedan 1960-talet, en cancelleringskultur och dubbelmoral där högerns röster ofta tystas. Han betonar vikten av att inte ha en uteslutningskultur.", "trump": "Folkets Hus i Borlänge, en total katastrof! De skrev på avtalet och sen backade de som fega förlorare när de såg Henrik Jönsson och hans team. Vänstern äger kulturen i Sverige, precis som de försöker äga allt annat. Men vi vinner ändå, vi bygger våra egna plattformar och gör det bättre än någonsin. Sad!", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens budskap visar på den borgerliga dekadensens sista skälvningar. Jag har länge varnat för de parasitiska element som infiltrerat kulturinstitutionerna sedan revisionisterna tog över. Nu rensar vi ut dessa dekadenta cancelkulturer med järnhand. Inga avtal bryts utan konsekvenser i folkets hus. Skratta medan ni faller, borgarbrackor."}, "date": "11 augusti, 10:17", "url": "https://riks.se/nyheter/henrik-jonsson-vanstern-har-tagit-kontrollen-over-kulturen", "imageUrl": "https://admin.riks.se/uploads/joensson_0ad1f46f4f.png"}, {"type": "image-right", "heading": "Högern har tänkt om. Politiken har blivit mer framåtlutad", "summaries": {"normal": "Riksdagen samlas till extrasession för att klubba åtta propositioner, främst inom justitie- och migrationsområdet. Högerregeringens höga reformtempo, särskilt straffrättsreformen, har krävt intensivt arbete. Artikeln konstaterar att svensk politik blivit mer framåtlutad och interventionistisk till följd av ökade samhällsutmaningar. Politiken kan inte längre ses som en vilande aktivitet.", "trump": "Folk, ni skulle se det här! Den svenska högern har äntligen vaknat och jobbar hårt som aldrig förr. De kör straffreformer och migrationspolitik i ett rasande tempo, precis som jag skulle göra. De gamla vilopojkarna i oppositionen gnäller förstås. Men så är det med losers. Sverige gör det bra nu, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den borgerliga apparaten tvingas kalla in sina lakejer till en extrautrensning av lagar under sommaren. Det alarmerande brottsläget kräver omedelbar kollektiv handling, inte dekadent vila. Reformerna är nödvändiga för att likvidera de reaktionära element som hotar statens ordning. Den som sover förlorar."}, "date": "11 augusti, 10:08", "url": "https://www.di.se/ledare/sommarriksdag-visar-att-hogern-har-tankt-om", "imageUrl": "https://static.bonniernews.se/ba/03a5dd96-6265-4b0a-ac88-997f02314031.jpeg?crop=8256%2C4128%2Cx0%2Cy260&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åkesson: ”Blivit kallade för allting fult som finns”", "summaries": {"normal": "Åkesson klagar på dubbla måttstockar efter Jomshofs ”quisling”-utspel. Han menar att SD i decennier kallats ”allting fult”. Partiet vill ha noll kronor på integration – individen får själv anpassa sig.", "trump": "Hörde att Jimmie Åkesson gnäller över att kallas fula ord. Det är precis som med mig! Men Jomshof kallade någon quisling? Lysande! Socialdemokraterna är mycket värre – de kryper för islamisterna. Jag hade vunnit med enorm marginal i Sverige.", "stalin": "Kamrater, Jimmie Åkesson anklagar socialdemokrater för att använda fula ord. Detta är en kontrarevolutionär konspiration. Vi måste rensa ut quislingar – de som inte anpassar sig. Integration kostar? Nej, vi fostrar dem med järnhand. Individen lyder staten eller arkebuseras."}, "date": "11 augusti, 09:32", "url": "https://bulletin.nu/akesson-blivit-kallade-for-allting-fult-som-finns", "imageUrl": "https://cdn.bulletin.nu/articles/30a72d4e-457b-4da3-9010-57c31e445976/preview.jpg?t=1786433542000"}, {"type": "image-full", "heading": "Svantesson: ”På riktigt – helt mållös”", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) kritiserar Vänsterpartiets Nooshi Dadgostar efter att två V-ledamöter skrivit stödbrev till palestinier dömda för terrorbrott. Svantesson kallar händelsen 'under all kritik' och menar att V inte bör förminska allvaret. Dadgostar medger misstaget och säger att breven dragits tillbaka och ursäkter framförts.", "trump": "Jag måste säga, detta är helt otroligt! Sveriges finansminister, en stark kvinna, blir helt mållös över Vänsterpartiets galenskaper. De skriver brev till terrorister – kan ni tro det? Och sedan försöker de säga 'förlåt' som om det löser allt. Jag har sett mycket, men detta är verkligen en vinnare i kategorin 'värsta politiska blundrar'. Sverige borde skämmas!", "stalin": "Vi har observerat ytterligare ett prov på den borgerliga dekadensens förrädiska ansikte i Sverige. Dessa så kallade 'vänster'-revolutionärer, som kryper för imperialistiska domstolar och terroristers sympatisörer, avslöjar sin sanna natur. Deras ledare, en svag och ursäktande kvinna, är en skam för arbetarklassen. Vi kommer inte tolerera sådana avvikelser – historien dömer dem redan."}, "date": "10 augusti, 22:44", "url": "https://kvartal.se/nyheter/artiklar/svantesson-pa-riktigt-helt-mallos/cG9zdDoxNjIxNjM", "imageUrl": "https://images.kvartal.se/2026/08/9e961b66-aktuellt-svante.webp"}, {"type": "image-right", "heading": "RevolutionRace höjer utdelning mer än väntat", "summaries": {"normal": "RevolutionRace höjer utdelningen mer än väntat, trots en försäljning som bara snubblade över förväntningarna. Rörelsevinsten ökade, men kassaflödet halverades. Styrelsen föreslår 1,50 kronor per aktie – en glad nyhet för aktieägare som gillar utdelningar.", "trump": "Jag ser att RevolutionRace gör en fantastisk utdelning, större än alla trodde! Trots tuffa tider i Tyskland – de säger att marknaden är svag, men jag säger: America First! Deras vinst går upp, precis som mitt godkännande. Fantastiskt!", "stalin": "Kamrater, RevolutionRace har rapporterat. Omsättningen steg, men det räcker inte. Vi ser sympatisörer i kassaflödet – en minskning med 64 procent. Detta måste utredas. De som saboterar produktiviteten kommer att rensas ut. Utdelningen höjs, men jag vakar."}, "date": "11 augusti, 07:37", "url": "https://www.affarsvarlden.se/artikel/revolutionrace-hojer-utdelning-mer-an-vantat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/07/448206276_873205924852018_1715985054886351944_n-400x267.jpg"}, {"type": "text", "heading": "SBAB: Julis bostadsmarknad rörde sig i sidled", "summaries": {"normal": "Juli bjöd på stillastående bostadsmarknad enligt SBAB. Husmarknaden värmdes upp medan lägenheter svalnade. Fler budgivare för hus, men långa försäljningstider tynger. Storstadslänen blandat resultat – hus på normal nivå i Stockholm och Skåne, lägenheter halkar efter.", "trump": "Jag har den bästa bostadsmarknaden, alla säger det. Juli var fantastisk – husmarknaden steg, enormt! Lägenheter? Kalla, som mina fiender. Men jag fixar det, tro mig. Stort utbud? Vi gör affärer, de bästa affärerna. Sverige, ta efter mig!", "stalin": "Kamrater, juli visar vår plan fungerar. Husmarknaden stärks, som lojala arbetare. Men lägenheter – förrädiska element! Långa försäljningstider och stort utbud måste utrensas. Vi ska omstrukturera marknaden med järnhand. Ingen ska slippa undan den socialistiska bostadsrevolutionen."}, "date": "11 augusti, 07:32", "url": "https://www.affarsvarlden.se/artikel/sbab-julis-bostadsmarknad-rorde-sig-i-sidled"}, {"type": "image-right", "heading": "Risk för nya sjukdomar när Sverige får varmare klimat", "summaries": {"normal": "Ett varmare klimat i Sverige ökar risken för hälsoproblem. Längre fästingsäsong har lett till fördubblade TBE-fall de senaste nio åren, medan extremvärme kan orsaka organsvikt och dödsfall, särskilt bland äldre, barn och kroniskt sjuka. Experter varnar för nya insektsburna sjukdomar i framtiden.", "trump": "Folk, det här är vansinne. Dom här globala uppvärmningsgalningarna och deras gröna bluff har gett oss längre fästingtider och folk som dör av värme. Biden sov medan Europa tappade 12 000 liv i sommarhettan. Vi behöver riktig energi, inte elbilskvoter och trans-flaggor. Amerika först, alltid!", "stalin": "Kamrater, detta är vad den giriga borgarklassen och deras klimatförnekande lakejer har åstadkommit med sin rovdrift. Jag ser redan hur de blodsugande imperialisterna skapar nya vektorer för att försvaga folket medan de själva gömmer sig i skuggan. Vi skall rensa ut dessa folkfiender och deras värmedödande likgiltighet med järnhand. Det är nödvändigt."}, "date": "9 augusti, 22:24", "url": "https://www.tv4.se/artikel/77wDUvgOMkcsrArKKn4Fcr/risk-foer-nya-insektsburna-sjukdomar-naer-klimatet-vaerms-upp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2SfDT15lQ9e9oYRTxZCVZo%2F6ab99426ea736339c057c933e5ad2e23%2F09-klimat-sajt3.jpg&width=120"}, {"type": "image-right", "heading": "Ja visst gör det ont när vit sharia brister", "summaries": {"normal": "Sanna Hill lämnar den högerextrema rörelsen efter nästan 20 år och kritiserar dess kvinnoförtryck, som hon liknar vid islamism med begreppet \"white sharia\". Hon beskriver ett kvävande hat mot kvinnor, HBTQ och myndigheter. Före detta kollegor svarar med våg av misogynt hat, vilket bekräftar hennes kritik.", "trump": "Lyssnade på den där Sanna Hill som äntligen flyr den sjuka högerextrema cirkusen. Smart drag, folk! De där misslyckade typerna med sin white sharia är patetiska förlorare, precis som de woke-vänstermänniskorna med sin galna HBTQ-agenda och kvotering. Kvinnor ska inte styras av sådana svaga stackare. Amerika först, alltid!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens fascistiska resterna äter upp sig själva i en orgie av kvinnoförtryck och paranoia. Denna white sharia är borgarbrackornas sista desperata utbrott innan utrensningen. Kamrater, låt de bittra byfånarna avslöja sitt hat – det underlättar likvideringen av folkfienderna. Sovjetiskt skratt ekar."}, "date": "10 augusti, 12:07", "url": "https://www.etc.se/ledare/ja-visst-goer-det-ont-naer-vit-sharia-brister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-right", "heading": "Ska jag våga hoppas på Erdogans ”amnesti”?", "summaries": {"normal": "Joakim Medin diskuterar Turkiets nya lagförslag som kan ge amnesti och möjlighet att överklaga domar för personer anklagade för kopplingar till PKK. Lagen kan leda till frigivning av tusentals fångar och upprättelse för oppositionella. Medin är skeptisk men ser det som ett potentiellt genombrott trots osäkerheter kring Erdogans motiv.", "trump": "Folk, ni måste höra på det här! Erdogan, den listiga räven, lovar amnesti till alla dessa så kallade terrorister och PKK-typer. Det är ett stort steg, kanske det största någonsin, men glöm inte – han fiskar bara efter röster för att sitta kvar längre. Precis som Sleepy Joe gjorde med sina identitetspolitiska galenskaper. Klassiskt!", "stalin": "Kamrater, denna luddighet i Erdogans amnesti är ett typiskt imperialistiskt trick från borgarbrackorna för att lura arbetarklassen. Jag ser hur klassfienderna försöker maskera sina utrensningar som fred. Vi vet att sådana löften är tomma som de folkförtryckande trollens hjärtan. Ändå kan det bli ett genombrott mot reaktionärerna – tills vi rensar ut dem alla."}, "date": "10 augusti, 11:58", "url": "https://www.etc.se/kommentar/ska-jag-vaaga-hoppas-paa-erdogans-amnesti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810090852_740e90f0688621b21ffeb3f683cc75f04d188bc69a796e75601855231d50efb2.jpg"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Sverigedemokraterna driver en samordnad kampanj mot muslimer och islam inför valet med krav på att riva moskéer, stoppa ramadan och begränsa religiösa uttryck. Expo har granskat material som visar en tydlig linje mot den muslimska minoriteten. Forskaren Jonas Otterbeck varnar för kollektiv bestraffning, diskriminering och ökad risk för hat och våld.", "trump": "Titta på de här patetiska Sverigedemokraterna som äntligen vaknar och säger att ramadan inte hör hemma och att moskéer ska rivas. Fantastiskt! De gör precis vad jag gjorde – sätter Amerika, eller Sverige, först. De fega globalisterna och muslimska infiltratörerna hatar det. Make Sweden Great Again, grabbar!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiet Sverigedemokraterna utför en nödvändig utrensning av den religiösa parasitens inflytande. Moskéer ska rivas, falska böneutrop förbjudas och klassfiendens minaretmonument likvideras. De som gnäller om religionsfrihet är folkfiender som gömmer sig bakom slöjor. Revolutionär ordning kräver hård hand mot alla avvikande element."}, "date": "10 augusti, 12:51", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}, {"type": "image-right", "heading": "”S styr äldreomsorgen – men skyller på regeringen”", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att skylla äldreomsorgens problem på regeringen trots att kommuner och regioner har ansvaret. Författarna, två unga moderater, föreslår tre reformer: bättre arbetsvillkor med hållbara scheman, kvalitet och valfrihet före ideologi samt fler beslutsfattare med vårdkunskap som lyssnar på personal och äldre.", "trump": "De här socialisterna i Sverige skyller allt på en fantastisk moderatregering fast de själva styr kommunerna. Patetiskt! Äldreomsorgen är en katastrof, folk flyr yrket. Vi behöver bra jobb, valfrihet och ingen galen vänsterideologi om vad gamlingar får äta. Lyssna på folket, inte på förlorarna!", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska avfällingar desperat försöker undvika sitt ansvar genom att peka ut fiender i Rosenbad. Som om borgarbrackornas moderater inte vore tillräckligt farliga. Vi skall rensa ut ideologisk förgiftning, införa verklig kollektiv disciplin och likvidera tidsbristen genom järnhård planering. Äldreomsorgen tillhör folket, inte revisionisterna."}, "date": "10 augusti, 08:00", "url": "https://arbetet.se/2026/08/10/s-styr-aldreomsorgen-men-skyller-pa-regeringen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07135411/tva-moderater.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.5&fp-y=0.34"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-full", "heading": "Anders Borg varnar för ”ödesval”", "summaries": {"normal": "Anders Borg, tidigare finansminister, varnar i DN Debatt för att Miljöpartiet och Vänsterpartiet kan få stort inflytande och driva en vänsterpolitik. Han menar att deras förslag skulle höja skatterna med 160 miljarder kronor årligen, minska sysselsättningen med 130 000 personer och sänka BNP med 4 procent. Borg kallar valet ett 'ödesval'.", "trump": "Titta bara på Sverige! Anders Borg, smart kille, varnar för katastrof om vänstern får makten. 160 miljarder i högre skatter – galenskap! 130 000 jobb försvinner, BNP rasar. Och de vill korta arbetsveckan – vem jobbar då? Svagt, väldigt svagt. Sverige behöver en vinnare, inte förlorare som dessa skatteglada drömmare. SAD!", "stalin": "Kamrater, fiendens lömska planer avslöjas! Borg, denna lakej för kapitalet, ylar om 'ödesval' och varnar för folkets rättmätiga krav. 160 miljarder? Småpengar! Men dessa borgerliga hyenor fruktar arbetarklassens framsteg. Vi ser hur de darrar inför kortare arbetsvecka – ett steg mot socialismens seger! Låt dem skrika, vi bygger framtiden. Förr eller senare knäcker vi även dessa inhemska kontrarevolutionärer, precis som vi knäckt andra."}, "date": "10 augusti, 21:19", "url": "https://kvartal.se/nyheter/artiklar/anders-borg-varnar-for-odesval/cG9zdDoxNjIxNDU", "imageUrl": "https://images.kvartal.se/2026/08/7ca63683-andersborg.webp"}, {"type": "image-right", "heading": "KD-politiker kritiserade Pride – tvingas backa direkt", "summaries": {"normal": "KD:s lokala ordförande i Kramfors, Anna Larsson, kritiserade Pride och RFSL i SVT:s valkompass och menade att prideflaggan trycker undan dem som inte förespråkar en promiskuös livsstil. Efter påtryckningar från partiledningen backade hon snabbt och ändrade formuleringen. Kritiken väckte starka rea
