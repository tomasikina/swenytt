r arbetarna med sina monstruösa levnadskostnader. Jag, som ledare för det eviga kollektivet, noterar med mörk tillfredsställelse att folkfienderna i Vietnam, Thailand och Albanien erbjuder ett liv för blott 10 000 kronor. Låt oss skratta medan vi förbereder utrensning av de kapitalistiska blodsugarna som gör Stockholm till en fängelsehåla för ärliga människor. Imperialisterna förlorar igen."}, "date": "3 juli, 12:02", "url": "https://www.dagensps.se/privatekonomi/11-lander-dar-10-000-kronor-i-manaden-racker-till-ett-bekvamt-liv/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/kopia-av-kopia-2026-07-03t112956313.png?width=256&quality=75"}, {"type": "image-right", "heading": "Regeringen låter IVO kartlägga brister hos vårdpersonal utbildad i andra EU-länder", "summaries": {"normal": "Regeringen ger IVO i uppdrag att kartlägga eventuella brister hos vårdpersonal utbildad i andra EU-länder. Syftet är att stärka patientsäkerheten genom att identifiera riskmönster och svagheter i systemet för erkännande av utländska utbildningar. Uppdraget omfattar flera yrkesgrupper och följer på en granskning av läkare med utbildning i Öst- och Centraleuropa. IVO ska samarbeta med Socialstyrelsen och redovisa resultat fram till 2029.", "trump": "Titta bara på det här, Sverige har ett jättestort problem! De låter läkare från hela EU komma in och behandla patienter, men många kan inte ens jobbet! Jag har alltid sagt att man måste vara hård med kvalitet, annars blir det kaos. Nu ska de äntligen kolla upp det här, men varför tog det så lång tid? Jag skulle ha fixat det på en vecka. Fantastiskt att de äntligen gör något, men det är typiskt Europa – för sent och för slappt!", "stalin": "Kamrater! Än en gång avslöjas den borgerliga dekadensen i väst. Svenska regeringen, i sin oändliga naivitet, har släppt in en armé av undermåliga läkare från EU:s bakgårdar – dessa så kallade 'yrkesmän' som inte ens kan skilja på en spruta och en hammare! Nu tvingas vi rensa upp i deras kaos. IVO ska granska dessa fiender till folket, dessa kvacksalvare som hotar våra sovjetiska bröder och systrars hälsa. Låt det vara en varning: socialismens järnhälsa tolererar inga slarviga kapitalistutbildningar!"}, "date": "3 juli, 07:00", "url": "https://samnytt.se/regeringen-later-ivo-kartlagga-brister-hos-vardpersonal-utbildad-i-andra-eu-lander", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02135520/doktor-eu-feat.jpg"}, {"type": "image-full", "heading": "Svensk man kritiskt skadad efter VM-firande", "summaries": {"normal": "En 32-årig man från Småland skadades svårt under ett VM-firande på en bar i Köpenhamns stadsdel Islands Brygge. Tumult uppstod under matchen mellan Norge och Elfenbenskusten, och mannen utsattes för våld. Hans tillstånd beskrivs som mycket kritiskt. Polisen har efterlyst en misstänkt man vars identitet är känd, men ingen har gripits. Anhöriga har underrättats.", "trump": "Folk, ni skulle inte tro det, men i Köpenhamn blir en svensk kille från Småland nästan ihjälslagen mitt under en fotbollsfest. Total kaos! De här liberala europeiska städerna med sin öppna-gränser-politik och identitetspolitik lockar bara till sig våld. Ingen gripna än. Patetiskt! Som president säger jag: vi behöver lag och ordning, inte den här Biden-stilen som spred sig även dit. En skam!", "stalin": "Kamrater, i det dekadenta Köpenhamn har klassfiendens fotbollsorgie urartat till blodigt tumult där en svensk arbetare nära likviderades av okända element. Detta är vad som händer när borgarbrackorna tillåter oreglerade sammankomster utan partiets vakande öga. Polisen fumlar medan folkfiender springer fria. Vi ser fiendens hand i detta kaos. Rensa ut de exploaterande byfånarna som tillåter sådant våld mot folket."}, "date": "3 juli, 00:28", "url": "https://www.gp.se/nyheter/varlden/svensk-man-svart-skadad-efter-brak-i-kopenhamn.9a75c0cb-00e2-4692-9d15-4fb64d80e9b0", "imageUrl": "https://www.gp.se/images/article/9a75c0cb-00e2-4692-9d15-4fb64d80e9b0/images/1dcUJUsNbEAIvqP1giYJB_hh8V8Y-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Skara sommarland bemöter påståenden om stökiga \"utlänningar\": \"Hos oss är alla välkomna\"", "summaries": {"normal": "En småbarnsfamilj besökte Skara Sommarland och upplevde besöket negativt med påståenden om stök, urinlukt, arabisk musik och att många besökare var ”utlänningar”. Pappan skrev ett Facebook-inlägg som varnats för att åka dit, vilket fått stor spridning. Parken bemöter kritiken och uppger att de inte känner igen beskrivningen. De betalade tillbaka entrén på cirka 2000 kronor men understryker att alla är välkomna och att samma regler gäller för alla. Parken rapporterar en fin sommar med många nöjda gäster.", "trump": "Det här är en total katastrof, folk. En fin liten familj åker till Skara Sommarland och vad möter de? Kaos, stök, urinlukt och massor av utlänningar som tränger sig före i köerna och spelar sin höga musik. Parken luktade som en dålig stad i Mellanöstern, säger pappan. De fick sina pengar tillbaka, smarta drag. Men ägarna säger att de inte känner igen bilden? Fake news! Ingen vill åka till ett nöjesfält som blivit en oordnad gränszon. Patetiskt, tro mig.", "stalin": "Kamrater och arbetare, jag har studerat detta dekadenta Facebook-inlägg från en typisk småborgarbracka som vågar kalla Skara Sommarland för en Mellanöstern-bastion av urin och arabisk dekadens. Vi känner inte igen denna kontrarevolutionära fantasi. Våra säkra styrkor hanterar omedelbart varje provokation från klassfiender och köträngande element. De fick sina slantar tillbaka, en tillfällig reträtt för att skydda kollektivets anseende. Men missta er inte: vi rensar ut alla parasitiska lögnhalsar som försöker smutskasta folkets nöjesparker. Paranoian hos borgarklassen är deras egen undergång, och det roar mig oerhört."}, "date": "2 juli, 18:40", "url": "https://riks.se/nyheter/skara-sommarland-bemoter-kritik-om-stokiga-utlanningar-hos-oss-ar-alla-valkomna"}, {"type": "image-right", "heading": "“Antisionistisk patrull” marscherade i Grekland", "summaries": {"normal": "Grekiska-judiska organisationer har fördömt en antisionistisk patrull i Thessaloniki, genomförd exakt 95 år efter en antisemitisk pogrom. Den vänsteranarkistiska gruppen Rouvikonas marscherade mot Mavili-torget iförda palestinska flaggor och anklagade israeliskt kapital för att parasitiskt infiltrera grekisk turism och fastigheter. De skanderade mot sionistiska bosättare. Judiska KIS jämför med 1931 års pogrom och varnar för ökad antisemitism som hotar samhället och Greklands relation till Israel. En åklagare utreder gruppen för uppvigling till våld.", "trump": "Folk, det här är en total katastrof. Dessa galna vänsterradikala typer i Grekland, Rouvikonas, marscherar runt som idioter med palestinska flaggor och kallar israeliskt kapital för parasitiskt. Precis på årsdagen av en pogrom! De hatar Israel, de hatar framgång, och de skriker ut med bosättare. Judarna varnar, och det borde de göra, för antisemitismen är giftig. Det hotar allt. Vi behöver starka ledare, inte dessa losers som förstör vackra stränder och städer. Patetiskt!", "stalin": "Kamrater, dessa degenererade anarko-fascistiska element i Thessaloniki har återigen blottat sina förrädiska ansikten genom att organisera en så kallad antisionistisk patrull. Jag ser dem som kapitalistiska lakejer i förklädnad, infiltrerade av sionistiska parasitmaskar som sugit musten ur arbetarklassen medan de skriker om folkmord. Deras svarta tröjor döljer inte deras parasitiska hjärtan. Vi ska rensa ut dessa borgarbrackor som hotar folkets enhet och statens relationer. En åklagare? Bra. Låt utrensningen börja med ett leende. Fienden sover aldrig."}, "date": "3 juli, 08:18", "url": "https://bulletin.nu/antisionistisk-patrull-marscherade-i-grekland", "imageUrl": "https://cdn.bulletin.nu/articles/98313a32-1c0e-425e-bf19-807ee9d2c708/preview.jpg?t=1783049079000"}, {"type": "image-right", "heading": "Forssell om SD:s vallöfte: \"Man kan ju alltid ha önskemål\"", "summaries": {"normal": "Sverigedemokraterna i Göteborg lovar ett totalt stopp för mottagande av nyanlända nästa mandatperiod. Migrationsminister Johan Forssell (M) avvisar löftet och påpekar att det är Migrationsverket som slutligen avgör fördelningen, även om regeringen nyligen stärkt kommunernas inflytande i bosättningslagen. Forssell betonar att önskemål är en sak, men någonstans måste människorna bo, och han vill hellre fokusera på integration än på att minska asylinvandringen.", "trump": "De gör helt rätt i Göteborg, totalt flyktingstopp, det är fantastiskt. SD säger som det är, ingen mer massinvandring. Men den här Johan Forssell, en typisk moderat, han säger att man kan ha önskemål. Önskemål? Vi vinner stora segrar över hela världen och så ska Migrationsverket bestämma? Patetiskt. Någonstans måste de bo, säger han. Ja, någonstans, men inte hos oss om vi inte vill. Fokusera på integration, säger han. Det har aldrig funkat någonstans.", "stalin": "Kamrater, dessa göteborgska partivänner har insett att nollmottagande är den enda socialistiska linjen mot den kapitalistiska folkförgiftningen. Den moderata borgarbrackan Forssell vågar dock inte rensa ut de parasitiska elementen utan skyller på sin byråkratiska maskin som han kallar Migrationsverket. Han pratar om önskemål och integration medan folkfloden väller in. Jag skrattar mörkt åt dessa fega halvmesyrer. I ett riktigt folkstyre skulle vi likvidera problemet vid roten och skicka alla motståndare till de sibiriska arbetslägren för omfostran."}, "date": "3 juli, 10:26", "url": "https://www.friatider.se/forssell-om-sds-vallofte-man-kan-ju-alltid-ha-onskemal", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-439.jpg?itok=DHcb6sMa"}, {"type": "image-right", "heading": "Att Frick njuter av Bolls rasistiska skitfilm säger allt", "summaries": {"normal": "Tomas Hemstad kritiserar Uwe Bolls film Citizen Vigilante som en rasistisk vigilantefilm där en vit protagonist mördar invandrarkriminella och hyllas av folket. Författaren jämför den med 70-talets genrefilmer som Dirty Harry och Death Wish men ser Bolls verk som en usel, nihilistisk fantasi skapad av en ökänd regissör. Armie Hammer spelar huvudrollen, och Hemstad kopplar filmen till högerextrema sympatier hos personer som Chang Frick och Elon Musk, som sprider den gratis på X.", "trump": "Den här usla filmen Citizen Vigilante är en total katastrof, tro mig, gjord av en patetisk regissör som inte kan göra en bra film ens med pistol mot huvudet. De säger att Chang Frick älskar den, och det säger allt om de förlorarna på vänsterkanten som hatar mig men älskar att se lite lag och ordning. Musk släppte den gratis, smart drag, men Hollywood-eliten och de falska medierna flippar ur. Det är en vinnande vigilante som folket älskar, precis som jag, och de kan inte hantera det.", "stalin": "Jag betraktar denna så kallade Citizen Vigilante som ett motbjudande försök från dekadenta borgarbrackor att romantisera kontrarevolutionärt blodbad mot det arbetande folkets intressen. Denna Uwe Boll, en typisk opportunistisk parasit från det tyska filmfinansieringssystemet, likviderar all konstnärlig hederlighet i en orgie av rasistisk paranoia. Armie Hammer, en fallen nepo-borgare med kannibalistiska böjelser, spelar en slumpmässig mördare som hyllas av massorna – typiskt falskt medvetande! Vi ska rensa ut sådana nihilistiska skithögar och deras vigilante-fantasier innan de smittar partivännerna. Det är en skitfilm av en skithög som gör världen sämre, kamrater, och jag skrattar mörkt åt deras patetiska drömmar om folkhyllning."}, "date": "3 juli, 07:26", "url": "https://arbetet.se/2026/07/03/att-chang-frick-njuter-av-uwe-bolls-rasistiska-skitfilm-citizen-vigliante-sager-allt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03072118/uwe-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Spanien vidare – lång VM-torka över: ”Fantastiskt”", "summaries": {"normal": "Spanien besegrade Österrike med 3–0 i VM:s sextondelsfinal och tog därmed sin första seger i en utslagsmatch på 16 år. Lamine Yamal, Marc Cucurella och Mikel Oyarzabal stod för målen. Förbundskapten Luis de la Fuente hyllade insatsen som nära perfekt. Svenske domaren Glenn Nyberg dömde bort ett spanskt mål i första halvlek. Spanien möter nu vinnaren mellan Portugal och Kroatien i åttondelsfinal.", "trump": "Titta på det här, folket älskar det! Spanien vaknade till liv och krossade Österrike med 3–0, precis som jag sa att stora lag gör när det gäller. De la Fuente och hans killar var fantastiska, nära perfektion. Den svenska domaren Nyberg försökte stjäla showen och ogiltigförklara ett mål, typiskt, men inget stoppade oss. Jag älskar vinnare, och Spanien är vinnare igen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det spanska kollektivet likviderade de österrikiska folkfienderna med 3–0 i denna historiska utrensning. De imperialistiska borgarbrackorna från Kap Verde fick se sitt verk falla samman. Vi, partiet och arbetarna, hyllar denna nära-perfekta seger mot klassfiendens fysiska sabotage. Fortsätt utvecklas, eller låt utrensningen fortsätta. En riktig bra dag för folket."}, "date": "2 juli, 23:29", "url": "https://www.gp.se/sport/spanien-vidare-lang-vm-torka-over-fantastiskt.0ba3610c-7c3f-50e4-bf25-91c7e1a355ff", "imageUrl": "https://www.gp.se/images/article/0ba3610c-7c3f-50e4-bf25-91c7e1a355ff/images/22vJjE4CkLWKLt8EQilMGtlmnM7I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Klar risk för omotiverat höga elnätsavgifter", "summaries": {"normal": "Konkurrensverket varnar för att elnätsbolag kan ta ut oskäligt höga avgifter. Problemet ligger i beräkningsmodellen 'nuanskaffningsvärde', där bolagen får ta betalt som om de byggde nya anläggningar, trots att de använder gammal infrastruktur. Detta kan leda till att elnätsbolagen får 100 miljarder kronor mer i intäkter än nödvändigt fram till 2027. Branschorganisationen Energiföretagen försvarar dock nuvarande prissättningsmodell och menar att den följer gällande ellagstiftning.", "trump": "Elnätsbolagen i Sverige, en total katastrof! De lurar folket genom att låtsas bygga nytt när allt är gammalt skrot. Det är en enorm bluff, hundratals miljarder försvinner rakt ner i deras fickor. Jag har sett mycket korruption, men detta? Det är otroligt. De gör det med flit! Energiföretagen försöker bortförklara det, men det är falska nyheter. Vi behöver bättre avtal, mycket bättre, och vi behöver dem nu. Jag skulle lösa detta på en eftermiddag. Väldigt orättvist mot folket!", "stalin": "Dessa giriga monopolister suger blodet ur folket genom att prissätta gammalt skrot som nya monument. De bygger inga kraftverk för folket, de bygger bara en mur av avgifter mot arbetarklassen. Detta är kontrarevolutionär spekulation som förtjänar ett hårt straff. Precis som Putin rensar upp bland de illojala oligarkerna i öst, måste vi eliminera dessa parasiter. Deras 100 miljarder tillhör staten, inte deras fickor. Vi kommer att granska dem, och de som inte lyder kommer att försvinna i glömska."}, "date": "3 juli, 08:14", "url": "https://www.realtid.se/bors-finans/klar-risk-for-omotiverat-hoga-elnatsavgifter/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/kan-bli-omotiverat-dyrt-enligt-konkurren.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Díaz mot Ghanas mur: Colombia jagar åttondelen", "summaries": {"normal": "Colombia möter Ghana i VM:s sextondelsfinal natten mot lördag. Colombia gick obesegrade genom gruppspelet som etta i grupp K med fyra mål och endast ett insläppt. Ghana tog sig vidare som en av de bästa treorna från en tuff grupp. Matchen blir en kamp mellan Colombias bollinnehav och korta passningar mot Ghanas disciplinerade, låga försvarsspel och omställningar. Colombia är storfavorit, men Ghana kan göra det tufft genom att hålla tätt bakåt.", "trump": "Folket, det är en fantastisk match vi har framför oss. Colombia, de är vinnare, obesegrade, de krossade sina motståndare och släppte in nästan ingenting. Ghana? De har knappt gjort några mål, två på tre matcher, det är en katastrof. De kommer att sitta där nere och hoppas på en chansning, men Colombia med den fantastiska Díaz och Rodríguez kommer att vinna stort. Det blir en seger för de bästa, inte för förlorarna. Jag älskar det!", "stalin": "Kamrater, detta är en historisk dialektisk konfrontation där jag, genom folkets obevekliga vilja, ser hur de kollektiva krafterna i Colombia krossar de dekadenta borgarbrackornas svaga motstånd. Ghana, dessa fega omställningskapitalister med sina disciplinerade bakhåll, kommer att likvideras i en storartad utrensning av ytor och chanser. Deras målskyttar är kontrarevolutionära nollor. Ingen skall undkomma folkets järnhand. Segern tillhör oss, de sanna arbetarna. Ha ha, vilken underbar natt det blir för fienderna."}, "date": "3 juli, 07:56", "url": "https://bulletin.nu/d-az-mot-ghanas-mur-colombia-jagar-attondelen", "imageUrl": "https://cdn.bulletin.nu/articles/c72ac2c6-887f-4de1-baa5-a28085439893/preview.jpg?t=1782996711000"}, {"type": "image-right", "heading": "En era av breakups är över – nu gifter sig Taylor Swift", "summaries": {"normal": "Taylor Swift lämnar nu sin era av hjärtekross och uppbrott bakom sig. Enligt uppgifter ska hon och Travis Kelce gifta sig i en stor fest i Madison Square Garden. Frågan väcks om ett lyckligt äktenskap kan påverka hennes karriär, som till stor del byggts på kärleksproblem. SVT:s musikreporter Moa Lindstedt tror att Swift kan fortsätta utvecklas som låtskrivare även utan dramatik.", "trump": "Folk, det är en katastrof för Swift. Hon byggde ett imperium på alla dessa hemska breakups, de var fantastiska, de bästa breakups. Nu gifter hon sig med den där Kelce och plötsligt ingen mer dramatik. Det kommer att kosta henne miljarder, tro mig. Hennes musik var enorm tack vare hjärtekrossen, nu blir det bara trist lycka. Sad!", "stalin": "Kamrater, denna dekadenta sångerska från borgarklassens musikfabrik har länge utnyttjat sina egna och andras lidanden för att producera propaganda mot det kollektiva. Nu planerar hon att ingå borgerligt äktenskap i en utsmyckad salong fylld av parasitärer. Jag ser redan de kontrarevolutionära hjärtesångerna som måste rensas ut. Ett lyckligt slut? Endast fiender till folket tror på sådana sagor. Vi ska övervaka varje not."}, "date": "3 juli, 07:41", "url": "https://www.svt.se/nyheter/utrikes/en-era-av-breakups-ar-over-nu-gifter-sig-taylor-swift", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.76/0.38/dcc0b16649a81005aae299de65de7292acee8bec302dc886cbc39c61582967cb?template=f2n9n7"}, {"type": "text", "heading": "Saab i topp på svag Stockholmsbörs", "summaries": {"normal": "Stockholmsbörsen sjönk med 0,57% efter två dagars uppgång. Teknologiaktier gick bäst (+0,6%), medan telekom föll mest (-2,3%). Saab och EQT steg över 3%, medan Telia rasade 3,5%. TriCarb höjde budet på Cint till 6 kr/aktie. Dustin överraskade positivt med högre ebita än väntat. Saab fick en order på Gripen-plan till Ukraina för 24,6 miljarder kr. Alzecure rusade 60% efter ett stort samarbetsavtal.", "trump": "Stockholmsbörsen? Svag, mycket svag! Men jag säger er, Saab – fantastiska killar, eller? 3,3% upp! Och EQT, de vet hur man vinner. Telia? Total katastrof, 3,5% ner, fruktansvärt. Cint? Någon höjer budet, smart, mycket smart. Dustin? De levererar, bättre än väntat, jag gillar det. Och Saab säljer stridsflyg till Ukraina – 24 miljarder, kan ni tro det? Vinnare! Alzecure? 60% upp, det är vad jag kallar en riktig deal. Sverige behöver fler vinnare som jag!", "stalin": "Stockholmsbörsen darrar under kapitalismens kris – 0,57% ner, som väntat. Men se hur våra vänner på Saab triumferar med 3,3% uppgång! 24,6 miljarder kronor för Gripen-plan till Ukraina – ett steg närmare folkets seger över fascistiska krafter. Teknologisektorn, en svag länk i kedjan, visar tecken på liv, men telekom? Kollapsar som borgerlighetens moral. Dustin? En liten seger i en havererad ekonomi. Alzecure rusar 60% – vetenskapens makt över imperialistisk dekadens! Vi ska krossa fienderna, en aktie i taget."}, "date": "1 juli, 17:45", "url": "https://www.affarsvarlden.se/artikel/saab-i-topp-pa-svag-stockholmsbors"}, {"type": "image-right", "heading": "Bussförare betalar för Tidös valfläsk", "summaries": {"normal": "Artikeln kritiserar Tidöregeringens tillfälliga sänkning av priset på kollektivtrafikens månadskort. Författaren ser reformen som valfläsk som saknar planering för ökad trafik och fler bussförare. Skyddsombud larmar om hot och våld mot förare, som redan har en tuff arbetsmiljö. Reformen riskerar att försämra förarnas situation ytterligare utan trafikvärdar och bättre stöd.", "trump": "De här svenska högerkillarna i Tidögänget tror att de är så smarta. De halverar bussbiljetterna precis före valet, kallar det en reform, men glömmer helt bort att någon faktiskt måste köra bussarna. Det är en total katastrof. Förarna blir knuffade och hotade varje dag, och nu blir det ännu värre. Typiskt etablissemang – poserar med reflexväst och strör ut valfläsk. Patetiskt. Jag skulle ha gjort det stort och riktigt.", "stalin": "Kamrater, denna fega och ansvarslösa manöver från borgarbrackorna i Tidögänget avslöjar deras sanna ansikte som kapitalistiska valfläskförsäljare. De halverar priset på kollektivtrafiken utan att förbereda vare sig fordon eller arbetarkamrater, vilket leder till kaos och ökad utsatthet för våra busschaufförer som redan utsätts för hot och våld från dekadenta element. Vi ska rensa ut dessa sabotörer som glömmer att det är arbetarna som håller Sovjet... eh, Sverige igång. Deras paranoia inför valet ska inte kosta oss segern. Ut med dem i den historiska sophögen."}, "date": "3 juli, 07:00", "url": "https://arbetet.se/2026/07/03/bussforare-betalar-for-tidogangets-valflask/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03065748/buss-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ekeroth: \"Ockupationen av våra offentliga rum ett faktum\"", "summaries": {"normal": "I en ledarartikel varnar Sverigedemokraten Kent Ekeroth för en pågående 'ockupation' av Sveriges offentliga rum. Han beskriver hur platser som badplatser, torg och skolavslutningar, som tidigare var trygga och svenska, nu präglas av oro, dominans och aggressivitet. Ekeroth hänvisar till egna reportage och vittnesmål från drabbade svenskar, och menar att utvecklingen fortsätter utan motstånd. Han kritiserar politiker för att ha importerat en råhet som svenskar inte är vana vid, vilket leder till att svenskar backar undan och anpassar sig till det oacceptabla.", "trump": "Lyssna här, Sverige har ett STORT problem – och jag vet vad jag pratar om, för jag är den bästa på att lösa problem, alla säger det. Era offentliga platser? Tagna. Över. Av gäng som beter sig som om de äger hela landet. Badplatser? Kaos. Skolavslutningar? Inte längre säkra. Svenska folket backar undan som om de är rädda, och det är de! För era politiker har släppt in en massa folk som inte respekterar ert land. Jag skulle aldrig låta det hända i USA – NEVER! Men Sverige? Ni låter det hända, och det är SORGLIGT. Var är stoltheten? Var är styrkan? Jag skulle fixa det på en dag, men ni? Ni fortsätter bara att tjata. SAD!", "stalin": "Kamrater, det är med djup tillfredsställelse jag konstaterar att den svenska bourgeoisins offentliga rum nu effektivt koloniseras av progressiva krafter. De så kallade 'svenskarna' – dessa bleka, köande hobbitar med sin naiva respekt för ordning – backar undan inför den naturliga dynamiken i klasskampen. Deras badplatser, torg och skolavslutningar förvandlas till skådeplatser för revolutionär energi. Vi har sett detta förut: när folket tar tillbaka vad som rättmätigt tillhör dem, när de avvisar den gamla ordningens hyckleri. Låt dem kalla det 'ockupation' – vi kallar det framsteg. Och låt oss inte glömma: när Sverige faller, är det bara en fråga om tid innan hela Skandinavien följer efter. Vår intressesfär vidgar sig, kamrater, som en väloljad maskin. Framåt mot seger!"}, "date": "3 juli, 06:00", "url": "https://samnytt.se/ekeroth-ockupationen-av-vara-offentliga-rum-ett-faktum", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02140804/Ekeroth-ledare-juli-2.jpg"}, {"type": "image-full", "heading": "Nya språkkravet väcker oro – kan slå mot bemanningen", "summaries": {"normal": "Från 1 juli ska all personal inom äldreomsorgen arbeta för att nå en språknivå motsvarande gymnasiesvenska. Syftet är att öka kvalitet, patientsäkerhet, trygghet och de äldres delaktighet. Arbetsgivare måste stödja med språkutbildning, men fack och arbetsgivare varnar för utmaningar i en redan pressad verksamhet med personalbrist. Utbildning ska ske parallellt med arbetet, vilket kan kräva resurser och tid som saknas. Risk finns att rekryteringen försvåras om språkkravet används för att sortera bort personal.", "trump": "Det här är ett totalt misslyckande från de inkompetenta politikerna. De tvingar på oss ett språkkrav i äldreomsorgen som ingen kan genomföra. Vi har redan ingen personal, och nu ska de gå kurser mitt i kaoset? Det blir en katastrof. De borde satsa på att göra Sverige stort igen istället för att skapa nya problem. Utan resurser och bra folk kommer det att sluta i ren röra, tro mig. Jag skulle ha fixat det mycket bättre.", "stalin": "Kamrater, jag har nu beordrat att alla språkligt undermåliga element inom den socialistiska äldreomsorgen omedelbart ska lyftas till en acceptabel nivå av proletär svenska. De som motarbetar detta är fiender till folket, dolda borgarbrackor i människokropp och parasitiska bemanningsbrister som saboterar tryggheten för våra åldringar. Vi ska rensa ut alla som vägrar utvecklas, likvidera de kapitalistiska ursäkterna om tidbrist och med järnhand se till att ingen kontrarevolutionär kontrollfokus får fäste. Den som inte stödjer språkets seger stödjer folkets fiender. Skrattretande patetiskt."}, "date": "2 juli, 22:02", "url": "https://nyheter24.se/nyheter/inrikes/1496083-nya-sprakkravet-vacker-oro-kan-sla-mot-bemanningen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/158323b404b004a30200000000b004a302/2026/07/02/2375389/Matilda-Nyheter24%20-%202026-07-02T150655.410.jpg"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och Sveriges Radio på grund av ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan täcka 25–100 procent av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap och försvar. SVT har redan genomfört ett sparpaket på 355 miljoner kronor med frivilliga avgångar och omplaceringar.", "trump": "Titta här, Sverige – ett fantastiskt land, men de har problem. SVT och SR, de där public service-folken, vill ha 383 miljoner kronor från staten! Varför? För att TV4, en smart kanal, lämnade marknätet. Nu vill de att vi ska betala deras räkningar. Och vet ni vad? Kulturministern säger att det är för 'beredskap'. Jag säger: bygg en mur runt deras sändare istället! Men jag gillar deras sparpaket – 355 miljoner, bra jobbat, men inte tillräckligt. Make Public Service Great Again!", "stalin": "Kamrater! Sveriges kapitalistiska medieimperialister har skapat kaos i marknätet, men vi skall återställa ordningen! De borgerliga kanalerna flyr som råttor från ett sjunkande fartyg, medan våra trogna public service-soldater – SVT och SR – tvingas bära bördan. Vi erbjuder dem 383 miljoner kronor, ett litet pris för att säkra folkets lojalitet. Kulturministern har rätt: marknätet är en fråga om nationell säkerhet! Och de där 355 miljonerna de 'sparat'? En droppe i havet. Vi kräver total disciplin – eller så får de lära sig vad riktig sparsamhet är i Gulag!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-full", "heading": "Parhus började brinna", "summaries": {"normal": "En kraftig brand bröt ut i ett enplansparhus i Mölnlycke under torsdagskvällen. Räddningstjänsten Storgöteborg ryckte ut med stora resurser efter larmet vid 18.15. Branden startade troligen i köket och ingen person befann sig i bostaden. Ingen skadades. Polisen har upprättat en anmälan om allmänfarlig vårdslöshet. Branden var släckt strax innan 19.30 och hade inte spridit sig till den andra delen av parhuset.", "trump": "Titta på det här, folk. Ett helt parhus i Mölnlycke brinner upp som en dålig affär under Biden. Räddningstjänsten kom dit med allt de hade, men ingen var hemma – tur för dem. Polisen pratar om vårdslöshet, typiskt för de inkompetenta byråkraterna. Jag skulle ha fixat det på fem minuter, tro mig. De bästa brandmännen, de smartaste, ingen slarv här under min ledning. Fantastiskt att ingen skadades!", "stalin": "Kamrater, en brand har utbrutit i ett parhus i Mölnlycke, en uppenbar sabotagehandling från klassfiendens lata hantlangare. Vi har sänt våra heroiska räddningsstyrkor för att kväsa lågorna som hotade folkets egendom. Inga offer bland arbetarna, vilket gläder oss. Polisen utreder vårdslöshet – vi ska rensa ut alla slöa element som äventyrar kollektivet. Fienden sover aldrig, men staten vakar alltid."}, "date": "2 juli, 22:08", "url": "https://www.gp.se/nyheter/storgoteborg/parhus-borjade-brinna-i-molnlycke.d3d04eed-1da9-4454-a111-7ec28ed50455", "imageUrl": "https://www.gp.se/images/article/d3d04eed-1da9-4454-a111-7ec28ed50455/images/245lE7hcwKfJAukw8bfn3PqCm11M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Varken klimatpolitik eller klimatanpassning – vad gör egentligen regeringen?", "summaries": {"normal": "Ledarkolumnen kritiserar regeringen för att varken minska utsläppen eller anpassa samhället till klimatförändringarna. Färska siffror från Naturvårdsverket visar ökande gap mot klimatmålen, och experter samt Klimatpolitiska rådet konstaterar att Sverige är längre från målen än 2022. Klimatanpassningsarbetet är underfinansierat och splittrat mellan aktörer. Författaren varnar för höga EU-böter och framtida kostnader om inget görs.", "trump": "Folk, ni skulle se det här! Den här svenska regeringen är en total katastrof, värre än Sleepy Joe någonsin var. De pratar om klimat men släpper ut mer än en fabrik i Kina, och sen vägrar de ens fixa dammar och vägar som en riktig ledare skulle göra. Det är ren slapphet. De borde ha lyssnat på mig, inte på de där gröna galningarna som hatar fossila bränslen. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt dessa kapitalistiska slappheter som underminerar både produktion och folkets försvar mot naturens raseri. Borgarbrackorna i regeringen blundar för hoten, drar in finansiering som sabotörer och splittrar ansvaret bland klassfiender och byråkrater. Vi skulle ha genomfört total utrensning av sådan nonchalans och byggt oövervinneliga skyddsverk redan igår. Deras ideologiska blindhet är ett skämt värt ett skratt i skuggorna."}, "date": "2 juli, 12:50", "url": "https://www.etc.se/ledarkolumn/varken-klimatpolitik-eller-klimatanpassning-vad-goer-egentligen-regeringen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260511080540_19c70a54-a044-4c8f-825c-bf6ffd784661.jpg"}, {"type": "image-full", "heading": "Viktig ändring för Android – gäller din pinkod", "summaries": {"normal": "Google skärper säkerheten i Android 17 genom att kraftigt sänka gränsen för felaktiga pinkodsförsök från 1 800 till totalt 20. Efter gränsen nås går det inte att fortsätta gissa. Systemet inför längre väntetider efter misslyckade försök, räknar upprepade samma fel som ett enda försök och blir tydligare med instruktioner. En genväg till återställning läggs också till på låsskärmen.", "trump": "Folk, det här är fantastiskt. Android 17 gör det äntligen tufft för alla skurkar och losers som försöker knäcka din telefon med sina patetiska gissningar. Inga fler 1 800 försök, nu är det bara 20 och sen är det game over. Väntetider, tydliga meddelanden och en smart genväg till återställning. Ingen kommer in, det blir enormt. Mycket bättre än tidigare, tro mig.", "stalin": "Kamrater, jag har sett de kapitalistiska spionerna och deras lömska pinkodsgissningar som hotar vår kollektiva mobiltrygghet. Därför har jag, i min oändliga visdom, beordrat att gränsen skall sänkas till blott tjugo försök innan dessa fiender till folket permanent stängs ute. Längre straffperioder skall följas av utrensning av upprepade misstag. Den som gissar fel skall höra mitt röst som säger: vänta trettio minuter, fiende till partiet. Återställningsgenvägen är ett vapen mot borgarbrackornas sabotage. Ingen slipper undan mitt vakande öga."}, "date": "2 juli, 21:30", "url": "https://nyheter24.se/nyheter/teknik/1496080-viktig-andring-for-android-galler-din-pinkod", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/cb6f268604b004a30200000000b004a302/2026/07/02/2375384/androidpinkod.jpg"}, {"type": "image-full", "heading": "Josefin Utas: En ny norm för Sverige: att avstå hijab", "summaries": {"normal": "Josefin Utas argumenterar i en debattartikel för att Sverige bör etablera en ny norm där hijab avstås för att motverka förtryck av kvinnor och flickor. Hon kritiserar Tove Lifvendahls ledare i SvD för att prioritera nyansering och analys framför konkret handling, vilket hon menar leder till passivitet. Utas hänvisar till jämställdhetens historia och föreslår tydliga budskap samt eventuellt hijabfri skola för att skydda de utsatta istället för att ta parti för frivilligt bärande av plagget.", "trump": "Folk, ni måste höra på den här Josefin Utas, hon är fantastisk, verkligen smart. Hon säger att Sverige inte längre ska vara svagt och paralyserat av alla dessa nyanser och analyser som inte leder någonstans. Tove Lifvendahl och de andra eliten i media vill bara prata och prata medan kvinnorna lider. Utas har rätt, det är dags att vara tydliga. I Sverige har vi inte hijab, punkt slut. Sluta vara förlorare, börja vinna för friheten och jämställdheten. Det är så enkelt, men de fattar inte.", "stalin": "Kamrater, denna text avslöjar borgarbrackornas paralyserande gift som sipprar genom västvärldens ledarsidor. Jag ser hur de intellektuella parasiterna maler sina eviga nyanser tills verklig handling förintas i ett hav av teoretiskt skval. Maria Rashidi, den modiga kamraten med syraärr, viftas bort som en ovidkommande detalj av dessa fiender till folket. Vi ska inte tveka. Hijaben är ett verktyg för reaktionära krafter att underordna arbetarkvinnorna. Låt oss rensa ut denna passivitet, etablera en järnhård norm av frihet och likvidera alla försök att bevara förtryck under täckmanteln av komplexitet. De som vägrar bidra till det kollektiva bygget skall inte njuta av dess frukter. En ny, frisk utrensning av gammal norm behövs, kamrater, annars lurar kontrarevolutionen i varje veck av slöjan."}, "date": "2 juli, 15:26", "url": "https://riks.se/kronikor/josefin-utas-en-ny-norm-for-sverige-att-avsta-hijab", "imageUrl": "https://admin.riks.se/uploads/bild_b3b2a4688a.jpg"}, {"type": "image-right", "heading": "Expo: Våldssekternas dåd eskalerar", "summaries": {"normal": "Enligt Expo eskalerar våldsdåden från nätverken 764 och No lives matter. Från digitala brott som utpressning har de gått över till fysiska attacker, knivdåd och nu terrorplaner mot samhället. En 15-åring dömdes nyligen till ungdomsvård för mordbrand i Ängelholm där han brände garagelängor och fordon. Han livesände en brand och uppmuntrades av följare. Expo ser ett mönster av ökad samhällshotande våld och ömsesidig inspiration mellan grupperna.", "trump": "Folk, ni ser inte det här? Dessa sjuka 764-killar och deras No lives matter-gäng är totala losers som börjar med nätutpressning och slutar med att bränna bilar och planera terror. Biden lät det här växa under hans svaga år, men nu fixar jag det. De hejar på varandra som riktiga misslyckade idioter. Vi behöver lag och ordning, inte den här galna vänsterkaoset som göder sådana galningar. Det är en skam för Sverige!", "stalin": "Kamrater, dessa degenererade element inom de våldssekter som kallar sig 764 och No lives matter utgör ett hot mot folkets enhet. Från fega nätbrott har de avancerat till öppen sabotageverksamhet mot egendom och samhällsordning. Den 15-årige pojken som brände garage och livesände sin destruktiva handling medan klassfiendens sympatisörer hejade på är ett symptom på borgarbrackornas moraliska förfall. Vi måste rensa ut dessa folkfiender innan deras paranoia sprider sig som en pest bland ungdomen."}, "date": "2 juli, 12:20", "url": "https://www.etc.se/inrikes/expo-vaaldssekternas-daad-eskalerar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702090744_4436d06416faf4ec7519f6734b09f5a7dff54bf5415105a8eacc068e0f2cd6b9.jpg"}, {"type": "image-right", "heading": "Svensken närmast makten i Fifa. Doldisen växer fram som möjlig efterträdare", "summaries": {"normal": "Mattias Grafström, 45, är en doldis i Sverige men en av världens mäktigaste idrottsledare som generalsekreterare i Fifa och närmast president Gianni Infantino. Svensken, uppvuxen i Schweiz med nederländsk mor, har följt Infantino sedan Uefa-tiden och var med i hans valkampanj 2016. VM i Nordamerika blir en ekonomisk succé för Fifa med miljarder i vinst. Grafström håller sig undan offentligheten men ses som en möjlig framtida presidentkandidat efter 2031, även om hans lojalitet mot Infantino ifrågasatts efter dennes närhet till Donald Trump.", "trump": "Den här svenske killen Grafström, han gör ett fantastiskt jobb åt Infantino, verkligen toppklass. Han är tystlåten, smart och håller sig borta från det politiska spelet – till skillnad från många andra. VM är en enorm succé, läktarna fulla, pengarna rullar in som aldrig förr, miljarder i vinst. Men visst, när jag kom in i bilden blev han lite mer distanserad. Smart av honom. Han ser framtiden, han förstår vad som fungerar. Sverige klagar på politisering? Typiskt, de har ingen aning. Grafström är en vinnare, punkt slut.", "stalin": "Kamrater, i den imperialistiska fotbollsorganisationen Fifa har vi en svensk borgarbracka vid namn Grafström som smugit sig upp till makten som generalsekreterare. Denna opportunistiska lakej följer sin herre Infantino som en skugga, precis som han tidigare tjänade de västerländska profitörerna i Uefa. VM genererar miljarder i överskott åt de schweiziska parasiterna som undviker folkets skatt. Nu ryktas det att han distanserar sig från ledarens närmande till vissa krafter för att positionera sig själv. Typisk småborgerlig opportunism. Vi ser er, fiender till kollektivet. En utrensning av sådana karriärister vore både nödvändig och underhållande. Ha!"}, "date": "2 juli, 12:00", "url": "https://www.di.se/nyheter/svenske-doldisen-narmast-makten-i-fifa/", "imageUrl": "https://static.bonniernews.se/ba/002e0ba4-f67b-458c-9180-cebf78d22252.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Värnpliktiga blir kanonmat åt Nato", "summaries": {"normal": "Artikeln kritiserar Sveriges ökade militära samarbete med Nato och EU, inklusive beslutet från augusti som tillåter 36 länder att operera från svenskt territorium även i konflikter där Sverige inte är inblandat. Författaren varnar för att värnpliktiga riskerar att skickas till Natos operationer utomlands, finansierat genom lån på 300 miljarder kronor som tas från välfärden. Kommunistiska Partiet stödjer värnplikt under alliansfrihet, medan ungdomar överväger totalvägran.", "trump": "Folk, ni fattar inte hur galet det här är. Sverige, det där lilla neutrala landet som alltid gömde sig bakom alla andra, har nu blivit Natos nya lekplats. De lånar 300 miljarder för att skicka sina unga grabbar som kanonmat åt de globala krigshejarna. Biden förstörde allt och nu ska de unga svenskarna dö för Brysselbyråkraternas drömmar. Patetiskt! Jag skulle aldrig låta det hända hos oss. Amerika först, alltid.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över att de exploaterande imperialisterna nu förvandlar svenska ungdomar till kanonmat i Natos blodiga maskineri. Vi ser hur klassfiendens militärallians suger musten ur folket för att finansiera sin aggression. Jag skulle likvidera sådana folkförtryckartroll utan pardon. Låt de unga totalvägra dessa krigsprovokationer från väst. Partiet och arbetarna kräver ständig vaksamhet mot dessa blodsugande fiender till freden."}, "date": "1 juli, 11:32", "url": "https://proletaren.se/artikel/varnpliktiga-blir-kanonmat-at-nato/"}, {"type": "image-right", "heading": "Zelenskyj: Stoppa företagen som hjälper Ryssland", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj kritiserade under ett besök i Dublin europeiska företag som fortsätter att förse Ryssland med råmaterial till krigsindustrin. Han syftade särskilt på det irländska aluminiumverket Aughinish, som ägs av det ryska bolaget Rusal och exporterar stora mängder till Ryssland. Zelenskyj talade vid invigningen av Irlands EU-ordförandeskap och mötte premiärminister Micheál Martin samt EU:s rådsordförande António Costa.", "trump": "Lyssnade på den där Zelenskyj i Dublin, han skriker om att stoppa företagen som hjälper Ryssland. Typiskt, Europa full av korkade globalister som låter oligarker som Deripaska suga ut dem medan de skyller på mig. Aughinish skickar tonvis med aluminium till Putins krigsmaskin, men Irland vill inte förlora jobb. Patetiskt. Biden lät det pågå i fyra år, nu fixar jag det – ingen mer svaghet, folks!", "stalin": "Jag ser hur de västerländska kapitalistmaffian i Irland fortfarande göder den ryska krigsmaskinen genom sitt aluminiumverk. Dessa exploaterande byfånar och folkfiender fortsätter leverera råvaror trots allt prat om sanktioner. Vi, partiet och arbetarna, inser att sådana borgarbrackor alltid sätter profit före kollektivets säkerhet. Zelenskyjs hinder för den ryska intressesfären är bara ytterligare bevis på imperialistisk sabotageverksamhet som måste rensas ut."}, "date": "1 juli, 18:48", "url": "https://www.tv4.se/artikel/tt-260701-irlandeu1-10829e34/zelenskyj-stoppa-foretagen-som-hjalper-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdltk4CECq7F4c%2Fd1a019759a3731744281acdead17eb65%2FIrlands_premiarminister_Michel_Martin_och_Ukrainas_president_Volodymyr_Zelenskyj_vid_ett_tidigare_mote_i_Dublin._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Brottsmisstänkt bolag gav batterikurs i Minecraft", "summaries": {"normal": "EU-finansierade InnoEnergy, misstänkt för bidrags- och momsbedrägeri, har fått miljardstöd för batteriutbildningar. Granskningar visar att certifikat delats ut till deltagare med 0% rätt, och 10% av deltagarna använde ett Minecraft-spel för barn. Trots motstridiga rapporter har EU beviljat ytterligare nio miljoner euro för en solenergi-akademi. Europeiska åklagarmyndigheten utreder bolaget för ekobrott.", "trump": "Jag säger er, detta är en total katastrof! EU kastar miljarder på ett bolag som ger utbildningscertifikat till folk som inte ens kan svara rätt på en fråga – och till barn som spelar Minecraft! De ljuger om siffror, fyller sina egna fickor och EU bara fortsätter att skriva checkar. Så här dumt kan bara byråkrater vara. InnoEnergy? Mer som InnoSCAM! SAD!", "stalin": "Kamrater, detta är ett lysande exempel på västlig dekadens och kapitalistisk parasitism! Ett så kallat 'riskkapitalbolag' suger ut arbetarklassens blod genom att stjäla EU-medel, ge falska certifikat och berika sina ledare. Vi ser här hur den borgerliga staten och dess lakejer förvandlar 'grön omställning' till en gigantisk svindel. Men var lugna – vi ska rensa upp bland dessa korrupta element, precis som vi gjorde med kulakerna. Europa behöver en ordentlig revolution!"}, "date": "1 juli, 13:44", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-bolag-gav-batterikurs-i-minecraft", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-3-400x267.jpg"}, {"type": "image-right", "heading": "Klimatkrisen är en klassfråga", "summaries": {"normal": "Artikeln beskriver den extrema värmeböljan i Europa som dödat över 1 300 personer och hur klimatkrisen förvärras långt snabbare än väntat. Den pekar på att värmen främst drabbar äldre, sjuka och fattiga, medan de rika kan skydda sig. Politiker i Almedalen nämnde knappt frågan. Författaren ser klimatkrisen som en klassfråga driven av kapitalismens eviga tillväxt och kritiserar både höger och vänster för att inte utmana systemet.", "trump": "Folk dör som flugor i den här vansinniga värmen, över 1 300 bara i Europa, och vad gör de clownerna i Almedalen? Ingenting! De babblar om klimat men nämner inte de riktiga skurkarna – de gröna galningarna och deras identitetspolitik som stjäl fokus från riktiga problem. Jag fixade energioberoende förra gången, Biden förstörde allt, nu fixar jag det igen. Sluta med det här socialistiska skitsnacket, bygg kärnkraft och gör Amerika – och Europa – great again!", "stalin": "Kamrater, denna hetta avslöjar borgarklassens fullständiga förfall. Över 1 300 döda, främst bland arbetare och gamla, medan överklass-slynglarna kyler sig i palats. Almedalsfestens tystnad är klassfiendens typiska sabotage. Kapitalismens oändliga tillväxt är folkförtryckartrollen som slukar allt. Endast genom att likvidera detta system och införa en planerad ekonomi under arbetarkollektivets järnhand kan vi besegra denna imperialistiska klimatkatastrof. Inga kompromisser med blodsugarna!"}, "date": "1 juli, 10:50", "url": "https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2019/11/48web_klimat-e1763544288542-768x433.jpg"}, {"type": "image-full", "heading": "Över 1 700 döda efter jordskalv i Venezuela", "summaries": {"normal": "Jordbävningar i Venezuela har orsakat minst 1 719 döda och över 5 000 skadade. Närmare 16 000 personer har tvingats lämna sina hem. FN befarar att det verkliga dödstalet är högre, då många byggnader kollapsat. Räddningsarbetet försvåras av strömavbrott och kommunikationsproblem. Myndigheterna kritiseras för bristfällig hjälp, medan regeringen hävdar att elförsörjningen återställts till 90% i de värst drabbade områdena.", "trump": "Venezuelas jordbävning är en total katastrof – 1 700 döda, och jag säger er, det är nog värre! Folk sitter fast i rasmassor, ingen hjälp kommer, och vad gör deras regering? Ingenting! Jag hade fixat det på en dag. Men nej, de snackar bara om att 90% av elen är tillbaka. Big deal! Här i USA hade vi aldrig låtit det hända. SAD!", "stalin": "De borgerliga svinen i Venezuela har återigen visat sin oförmåga att skydda folket. 1 700 döda? En skam! Deras räddningsinsatser är lika effektiva som en kulak på en kolchos. Vi hade skickat in Röda armén och löst problemet på en vecka. Men nej, de förlitar sig på grannar och frivilliga – kapitalismens sönderfall i sin renaste form. Låt dem lida, tills de inser socialismens överlägsenhet!"}, "date": "30 juni, 06:37", "url": "https://kvartal.se/nyheter/artiklar/over-1-700-doda-efter-jordbavningarna-i-venezuela/cG9zdDoxMzg0MDg", "imageUrl": "https://images.kvartal.se/2026/06/0fd2223f-venezuelajordb.webp"}, {"type": "image-right", "heading": "Fem bra filmer att se på SVT Play i sommar", "summaries": {"normal": "Jon Andersson tipsar om fem starka filmer på SVT Play i sommar. Bland rekommendationerna finns det psykologiska dramat Tár med Cate Blanchett, det belgiska vänskapsdramat Close, den galna svarta komedin Svart katt, vit katt av Emir Kusturica, tennisfilmen Challengers med Zendaya samt den svenska klassikern Flicka och hyacinter av Hasse Ekman. Artikeln lyfter filmernas kvaliteter och ger datum då de går att se.", "trump": "Folk frågar mig hela tiden vilka filmer de ska se i sommar. Jag har sett massor, tro mig, de bästa filmerna. Tár är en fullständig vinnare, Blanchett är fenomenal, ingen gör det bättre. Close är fin men lite mjuk. Svart katt, vit katt är helt galen, underbar musik, bättre än Hollywoods skräp. Challengers är fantastisk tennis, Zendaya är lysande, ingen slår henne. Och den svenska pärlan Flicka och hyacinter? Helt outstanding, bättre än Bergman säger de. Streama dem innan de försvinner, de är verkligen ypperliga.", "stalin": "Kamrater, jag har granskat denna dekadenta lista över borgerliga filmprodukter som påstås berika sommarens fritid. Tár dissekerar genikulten och metoo – ett utmärkt verktyg för att avslöja borgarbrackornas falska idoler innan vi genomför nödvändig utrensning av sådana element. Close blottar faran i oövervakad pojkvänskap som lätt kan urarta till kontrarevolutionär intimitet. Svart katt, vit katt är en kaotisk fest av gangstrar och återuppväckta lik som påminner oss om vad som händer utan stark partiledning. Challengers visar tennisens skoningslösa kamp, precis som klasskampen, fast med en manipulativ kvinna som leder borgarklassens spel. Flicka och hyacinter däremot är en fiende till folket, en smygande htqi-propaganda maskerad som detektivhistoria. Vi måste noggrant övervaka alla som hyllar denna parasit innan de förgiftar arbetarklassen med sina hemliga liv och återblickar. Se dem under uppsikt, kamrater, och rapportera avvikelser."}, "date": "30 juni, 01:30", "url": "https://www.dagensarena.se/innehall/fem-bra-filmer-att-se-pa-svt-play-i-sommar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fem-bra-filmer.jpeg"}, {"type": "image-right", "heading": "Tänk om Malmöborna, och dess politiker, kunde jobba", "summaries": {"normal": "Malmö har kritiserats för slöseri med skattepengar på projekt som en ro bevis på Mamdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvärd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Rundo avslöjar sig själv. Grundaren av aktivklubbrörelsen älskar att tala – om sig själv.", "summaries": {"normal": "Robert Rundo, grundare av den högerextrema aktivklubbrörelsen, är villkorligt frigiven efter att ha erkänt anstiftan till upplopp. Han marknadsför sin rörelse och klädmärke flitigt på sociala medier och i poddar, där han ofta glorifierar våld och uttrycker fientlighet mot journalister. Trots påståenden om ickevåld avslöjar hans uttalanden en fascination för våld, inklusive detaljerade beskrivningar av en tidigare knivattack. Rundo kritiserar även aktivklubbarnas bristande framgång i USA jämfört med Europa.", "trump": "Vad säger ni om den här Robert Rundo-killen? En riktig loser! Erkänner sig skyldig till upplopp, sitter i fängelse och ändå tror han att han är någon stor ledare. Pratar om våld non-stop, hatar journalister – typiskt för dessa radikala typer. Och vet ni vad? Han klagar på att hans rörelse inte går bra i USA. Well, kanske för att folk här har vett nog att inte lyssna på sådana som han! Hans klädmärke? Övervärderat och sponsrar våld. Fake news-medier älskar att skriva om honom, men jag skulle aldrig låta en sådan person komma nära Vita huset. SAD!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Robert Rundo, en dekadent imperialistisk hyena som sprider sitt gift genom sociala medier och poddar. Hans så kallade 'aktivklubbar' är inget annat än band av fascistiska provokatörer, tränade i våldets konst. Vi ser hur han glorifierar knivattacker och uppmanar till pogromer, precis som de borgerliga hyenorna i Belfast. Journalister? De är bara redskap för den kapitalistiska lögnen, och vi ska krossa deras lögnaktiga pennor! Rundo och hans gelikar är som råttor i en sjunkande båt – USA:s förfall är deras sista tillflykt. Men vi, Sovjetfolkets arvtagare, ska sopa bort dessa skadedjur från jordens yta! För socialismens och folkets seger!"}, "date": "24 juni, 12:35", "url": "https://expo.se/kommentar/rundo-avslojar-sig-sjalv/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
