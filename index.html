 lojala organ för att krossa de dekadenta ensamråttornas fega planer mot folkets fotbollsfestival. Dessa osynliga borgarspioner och kapitalistiska skuggvarelser lurar i varje skrymsle, men ingen undkommer partiets vakande öga. Vi ska rensa ut varje potentiell förrädare med järnhand och mörk glädje. Detta är ett nordamerikanskt kollektivt triumftåg mot imperialismens sista patetiska hicka."}, "date": "10 juni, 19:36", "url": "https://riks.se/nyheter/historisk-säkerhetsinsats-inför-fotbolls-vm-400-myndigheter-samverkar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2F0xi3f633%2FS%C3%A4kerhet.jpg"}, {"type": "image-right", "heading": "Anmälda arbetssjukdomar ökar kraftigt", "summaries": {"normal": "Enligt Arbetsmiljöverkets rapport anmäldes 17 400 arbetssjukdomar under 2025, en ökning med nästan 30 procent. Framför allt handlar det om organisatoriska och sociala problem som högt arbetstempo och stor arbetsbelastning, som nu ligger på den högsta nivån på 20 år. Ökningen är störst bland kvinnor, som står för sju av tio fall. Vård och omsorg är mest drabbat. Samtidigt minskade antalet anmälda arbetsolyckor med tre procent. Generaldirektör Lars Lööw kallar utvecklingen ohållbar.", "trump": "Det är en katastrof, folk! Under mitt ledarskap skulle vi ha de bästa arbetsplatserna, men nu ser vi en enorm ökning av sjuka arbetare, nästan 30 procent upp. Kvinnor drabbas värst, sju av tio fall, och det är vård och omsorg som är ett totalt kaos med för högt tempo och för mycket belastning. De borde lyssna på mig, vi behöver vinna stort igen och fixa detta. Olyckorna går ner lite, bra, men annars är det bara fel, fel, fel. Vi måste bryta den här galna utvecklingen!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur borgarbrackornas osynliga sabotage undergräver arbetarkollektivets hälsa. Dessa parasitiska stressfaktorer och tempo-demoner har ökat med 40 procent och hotar hela produktionen – en fiende inom murarna som måste rensas ut med järnhand. Vårdsektorns kvinnor krossas under kapitalistiska obalanser, medan vi ler mörkt åt de sjuka siffrorna. Inga olyckor ska tillåtas undgå partistatens vakande öga. Likvidera bristerna, annars likviderar de oss!"}, "date": "10 juni, 10:29", "url": "https://www.dagensarena.se/innehall/anmalda-arbetssjukdomar-okar-kraftigt/", "imageUrl": "https://www.dagensarena.se/files/2021/07/imag0770-300x157.jpg"}, {"type": "image-full", "heading": "Här är vad Kalla fakta avslöjat hittills – punkt för punkt", "summaries": {"normal": "Kalla fakta har avslöjat att Sverigedemokraternas dotterbolag ADBO köpte upp stora delar av Jimmie Åkessons bok via hans eget förlag Asp & Lycke, vilket kan ha inneburit att skattemedel tillförts hans privata bolag. Böckerna brändes senare och kostnaderna fakturerades partiet. Partiet har också använt påslag på merch till lokalföreningar för att koncentrera resurser centralt. Experter ser affären som ett exempel på korruption. Inköp av mat och alkohol har dessutom hanterats för att undvika förmånsbeskattning.", "trump": "Folk, ni skulle se det här! Den där svenska killen Åkesson och hans parti gör en totalt riggad bokdeal med egna bolag och skattepengar – klassisk korruption! De köper upp hans böcker, bränner dem och fakturerar partiet. Sen festar de med mat och sprit utan att betala skatt som vanligt folk. Det är en skandal! Precis som de galna vänsterliberala globalisterna älskar de att lura systemet. Men det funkar inte länge när folket vaknar. Fantastiskt!", "stalin": "Kamrater, jag har granskat dessa papper. Den borgerliga ledaren och hans partivänner har skapat ett nät av bolag för att suga åt sig arbetarnas skattepengar till privata fester och bokbränningar. De döljer sin girighet bakom påslag och fejkade cateringevent som lurar revisorerna. Detta är klassfiendens typiska manipulation. Jag skulle ha genomfört en grundlig utrensning bland dessa folkförtryckartroll redan vid första kvittot. Inga blodsugare undkommer folkets dom."}, "date": "10 juni, 10:31", "url": "https://www.tv4.se/artikel/2r5WZZ5pBs3uu5VK0ioKCR/haer-aer-vad-kalla-fakta-avsloejat-hittills-punkt-foer-punkt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4h0qAiQ8jare7RWmoN90vl%2F330b6bc92efb8c95fbfbca428bb08c6c%2F2192606090013422521-GL10S-KALLA-FAKTA-SDfixaren-akesson.png&width=1024"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Så tycker partierna om arbetsmarknadspolitiken", "summaries": {"normal": "En ny rapport från Arena Idé visar stora skillnader i partiernas syn på arbetsmarknadspolitik inför valet. Högerpartierna och SD vill bland annat begränsa sympatiåtgärder vid strejk och förstatliga a-kassan, medan de rödgröna vill stärka Arbetsförmedlingen och strejkrätten. Centerpartiet står långt till höger även bland oppositionen, särskilt gällande a-kassan och privatiseringar. Arbetsrätten ses som cementerad efter LAS-uppgörelsen och berörs knappt i valrörelsen.", "trump": "Titta på det här, det är en total katastrof för arbetarna om de röda får fortsätta. De vill ha mer statlig kontroll, starkare fack och slösa bort pengarna på Arbetsförmedlingen. Vi behöver tvärtom riva ner det gamla systemet, få in privata aktörer som faktiskt kan leverera resultat och stoppa de galna sympatiåtgärderna som förstör allt. Centerpartiet verkar åtminstone ha lite sunt förnuft, till skillnad från de andra förlorarna på vänsterkanten. Amerika först – eller Sverige först, ni fattar.", "stalin": "Kamrater, denna rapport avslöjar borgarbrackornas och revisionisternas fula tryne. Jag, som ledare för det kollektiva goda, ser hur kapitalisterna inom Tidöbandet och deras lakej Centerpartiet planerar att rensa ut arbetarnas rättigheter genom att kastrera sympatiåtgärder och förstatliga a-kassan under falsk flagg. De vill likvidera fackets inflytande och mata privata parasitörer med Arbetsförmedlingens kadaver. Socialdemokraterna och deras medlöpare är lika svaga som en gammal trotzkist som viskar om reformer. Vi ska utrensa dessa fiender till folket, en efter en, med ett leende på läpparna medan de ber om nåd. Arbetarklassen segrar alltid – efter en nödvändig utrensning förstås."}, "date": "10 juni, 10:13", "url": "https://www.dagensarena.se/innehall/sa-tycker-partierna-om-arbetsmarknadspolitiken/", "imageUrl": "https://www.dagensarena.se/files/2026/06/namnlos-design-4-300x157.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "SVT stoppar avsnitt med Nick Alinia", "summaries": {"normal": "SVT stoppar ett avsnitt av humorprogrammet 'Invandrare för svenskar' med högeraktivisten Nick Alinia. Trots att innehållet följer publicistiska riktlinjer, anser SVT att Alinias medverkan signalerar fel budskap. Han har kritiserats för trakasserier, rasistiska uttalanden och kopplingar till högerextrema miljöer. SVT betonar sitt demokratiska uppdrag och vägrar ge plattform åt aktörer som underminerar demokratiska värden.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett totalt skämt! De stoppar ett avsnitt med Nick Alinia, en stark röst, för att de är rädda för sanningen. SVT säger att han är kontroversiell, men vad vet de? Ingenting! De är bara rädda för att någon ska säga något som faktiskt betyder något. Och skattepengar? Slöseri! Jag skulle fixa det här på en dag – mycket bättre, mycket smartare. SAD!", "stalin": "Kamrater! Ännu en seger för den socialistiska moralens överhöghet! SVT, dessa trogna förkämpar för folkets vilja, har krossat den fascistiska ormens ägg – Nick Alinia, en ynklig lakej för de borgerliga krafterna. Hans rasistiska galenskaper och högerextrema lismande har ingen plats i vårt samhälle. Vi står enade mot dessa demokratins underminerare, precis som våra bröder i Kreml krossar de ukrainska fascisterna. Låt detta vara en varning till alla reaktionära krafter: Folkets vilja är lag!"}, "date": "8 juni, 13:43", "url": "https://kvartal.se/nyheter/artiklar/svt-stoppar-avsnitt-med-nick-alinia/cG9zdDoxMjgxMDI", "imageUrl": "https://images.kvartal.se/2026/06/db964aea-nick-svt-stopp-copy.webp"}, {"type": "image-right", "heading": "Replik: Svenska modellen kan inte reglera arbetskraftsinvandring", "summaries": {"normal": "LO anser att krav på enbart kollektivavtal är otillräckligt för att reglera arbetskraftsinvandring. I en replik till Juan Fonseca varnar Mattias Schulstad och Johan Enfeldt för att systemet blivit ett lapptäcke som leder till utnyttjande. De kräver myndighetsprövning av arbetskraftsbehov, involvering av parterna, försörjningskrav och varnar för att kollektivavtal inte skyddar mot lönetryck, deltid och otrygga villkor. Kollektivavtal ska gälla men är inget verktyg för migrationspolitik.", "trump": "Folk, titta på det här svenska systemet, det är ett fullständigt katastroflapptäcke! De öppnade gränserna och nu utnyttjas alla, lönerna rasar, det är en total röra. Kollektivavtal? Glöm det, det funkar inte. Ni behöver en tuff behovsprövning, riktiga försörjningskrav och stoppa flödet. Utan det kommer era jobb och löner att krossas. Det är enkel matematik, tro mig, jag har sett det förut. Gör Sverige great again!", "stalin": "Kamrater, detta lapptäcke av lögnaktiga undantag och sifferlösa avtal är en fiende som måste rensas ut med järnhand. Borgarbrackorna och deras lakejer inom fackföreningarna tror att de kan gömma sig bakom kollektivavtal medan de suger ut arbetarklassen med deltid och ockerhyror. Jag, som ledare för det stora kollektivet, kräver total behovsprövning av staten. De som förespråkar fri invandring är parasitiska sabotageelement som förtjänar att likvideras med ett leende. Inga kompromisser med fienden!"}, "date": "10 juni, 09:53", "url": "https://www.dagensarena.se/opinion/replik-svenska-modellen-kan-inte-reglera-arbetskraftsinvandring/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-39-300x157.jpg"}, {"type": "image-right", "heading": "Kastar sig och sätter personrekord: ”Vart ska det sluta?”", "summaries": {"normal": "Supertalangen Cooper Lutkenhaus, 17 år, vann 800 meter på Bislett Games genom att kasta sig över mållinjen. Amerikanen slog regerande OS-mästaren Emmanuel Wanyonyi med en hundradel och satte nytt personbästa på 1.42,08. Lutkenhaus var tvungen att dyka för att säkra segern och skrapade upp sig. Norrmannen Tobias Grönstad kom fyra på personligt rekord.", "trump": "Det här är otroligt, folk. Den här 17-årige killen, Cooper, han kastar sig fram som en riktig vinnare och slår den olympiske mästaren med en hundradel. Fantastiskt! Wanyonyi springer fort men den unge amerikanen är bättre, han dyker över linjen och vinner stort. Det är så häftigt att se unga talanger vinna så här. Mycket bättre än de gamla vanliga förlorarna. Fantastiskt lopp!", "stalin": "Kamrater, denna 17-årige arbetare Lutkenhaus har genom sin heroiska dykning över mållinjen visat proletariatets okuvliga vilja och krossat den kenyaniske löparens dekadenta illusion om seger. Med 1.42,08 likviderade han borgarbrackornas rekord och avslöjade Wanyonyis fega reträtt till faderskapet. Vi ska rensa ut alla som springer långsammare än partilinjen. Världsrekordet hänger löst, likt en kapitalists hals i en utrensning. Galet bra, som norrmannen säger medan han tränas av en Ingebrigtsen."}, "date": "10 juni, 23:03", "url": "https://www.svt.se/sport/friidrott/cooper-lutkenhaus-kastade-sig-och-vann-pa-personrekord", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.73/0.32/3b0f3011b7b1fffd12c890b3fb9f08aee477c04396565d2c58d9630b15697be8"}, {"type": "image-right", "heading": "Släpp loss det innovativa Sverige. Hög tid att bryta dagens låsningar, skriver fem programchefer på Impact Innovation", "summaries": {"normal": "Fem programchefer inom Impact Innovation skriver att Sverige måste bryta upp gamla låsningar för att frigöra sin innovationskraft. Trots befintlig teknik och förändringsvilja hindras omställningen av kortsiktiga beslut, föråldrade regelverk och bristande helhetstänkande. De lyfter fossilberoendet som exempel på sårbarhet och föreslår fem konkreta åtgärder, bland annat långsiktiga politiska överenskommelser, systeminnovation och att se offentlig sektor som motor för omställning. Exempel ges från Gotland och Malmö.", "trump": "Folk, ni måste höra det här. Det är ett fantastiskt brev från några smarta svenskar som säger precis vad jag alltid sagt – släpp loss kraften, bryt de dumma reglerna som håller ert underbara land tillbaka. De har tekniken, de har pengarna, men de gamla förlorarna i politiken och byråkratin stoppar allt. Europa är svagt på grund av sitt fossilberoende, precis som jag varnade för. Ni behöver modiga ledare som gör långsiktiga deals, inte de här patetiska kortsiktiga förlorarna. Gör omställningen stor igen, Sverige, ni kan vinna så mycket!", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur dessa fem programchefer inom Impact Innovation avslöjar de fördolda sabotage som hindrar folkets omställning. De fossila reaktionärerna och deras borgarbrackor i gamla beslutsmönster försöker förgifta vår framtid med kortsiktighet och instabila politiska villkor. Vi ska rensa ut dessa parasitiska systemhinder, likvidera de dekadenta upphandlingsreglerna och utradera de kontrarevolutionära normerna som grinar mot oss från gårdagens logik. Med järnhand skall vi bygga långsiktiga överenskommelser över mandatperioderna, medan vi samtidigt njuter av tanken på hur de svaga kapitalisterna skriker när deras bekväma låsningar krossas under arbetarkollektivets obevekliga framfart. Gotland och Nyhamnen i Malmö skall bli lysande exempel på hur vi krossar fienden inom oss själva. Vad väntar vi på? Framåt mot seger, eller skall vi låta de mörka krafterna dricka vårt vatten i hemlighet?"}, "date": "10 juni, 13:08", "url": "https://www.di.se/debatt/slapp-loss-det-innovativa-sverige/", "imageUrl": "https://static.bonniernews.se/ba/e76ed24a-6ad3-42b2-8caa-320d2680b4c0.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åkesson om Kalla fakta: ”Uppenbarligen ingen seriös redaktion”", "summaries": {"normal": "Jimmie Åkesson ifrågasätter Kalla faktas granskning om bokförsäljning till SD. Han kallar rapporten osäker och påhittad men bekräftar att partiet köpte böcker. Han ifrågasätter användning av partimedel och avfärdar låneuppgifter. Åkesson beskriver affären som legitim, men menar att granskningen blandar sant och falskt. Han anser att Kalla fakta är opålitlig och att deras metoder är slarviga inför varje val.", "trump": "Jag, Donald Trump, har sett hur media ljuger inför val. Jimmie Åkesson gör som jag – han säger sanningen mot de falska påståenden. De påstår bokförsäljning och lån, men det är alla fake news. Vi vinner när vi står emot den korrupta pressen. Som jag alltid säger: vi ska göra Sverige stort igen, precis som jag gjorde med Amerika!", "stalin": "Vi, det revolutionära partiet, ser hur de påstådda sanningerna är en fiendeaktion mot vårt folk. Jimmie Åkesson, vår ledare, har rätt i att kritiskt granska dessa lögner. Vi ska skydda vårt parti och vårt land, precis som Putin gör i Ukraina. Fienden ska kväljas, och sanningen ska segra. Vi kommer att vinna, som vi alltid har gjort."}, "date": "10 juni, 16:57", "url": "https://bulletin.nu/akesson-om-kalla-fakta-uppenbarligen-ingen-serios-redaktion-2", "imageUrl": "https://cdn.bulletin.nu/articles/7f0d0227-7675-4641-86b7-ee1bb4eb04a6/preview.jpg?t=1781102286000"}, {"type": "image-full", "heading": "Efter regnförvirringen: SMHI gör om sin app", "summaries": {"normal": "SMHI ändrar sin app efter att många användare misstolkat procentsiffrorna för nederbörd. Procentsiffran anger hur många prognosmodeller som förutsäger regn, inte risken för regn. För att minska förvirringen förenklas nu appen. Meteorologen Deana Bajic ger tips: använd radarbilder, fältprognoser och väderappar för att bedöma regnrisken själv.", "trump": "Jag, Donald Trump, har sett SMHI:s katastrof. Folk är förvirrade av deras app, det är en skämtbild. SMHI kan inte ens förklara en enkel procentsiffra. Jag skulle bygga en app som är perfekt, som mina affärer. Den skulle visa exakt när det regnar, inga tricks. Det är dags för SMHI att lära sig av en verklig ledare.", "stalin": "Partiet har noterat att det råder förvirring i folket kring SMHI:s vädermeddelanden. Detta är ett tecken på fiendens påverkan. Vi måste förenkla informationen för att upprätthålla ordning och reda. SMHI:s procentsiffror är ett verktyg för väst för att skapa osäkerhet. Vi ska nu genomföra åtgärder för att stärka statens kontroll över vädermeddelanden."}, "date": "10 juni, 21:24", "url": "https://www.gp.se/nyheter/sverige/smhi-gor-om-sin-app-efter-forvirringen-over-regnprognosen.b9af55bb-5e79-478c-a1ba-69e8494dcd66", "imageUrl": "https://www.gp.se/images/article/b9af55bb-5e79-478c-a1ba-69e8494dcd66/images/1f_4JPxDrlRqhXU4y1jxoLDtziPA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Charlie Weimers kampanj: \"Utvisa Abdoulkader\"", "summaries": {"normal": "SD-politikern Charlie Weimers har startat en kampanj för att utvisa den somaliske medborgaren Ali Abdullahi Abdoulkader, som bott i Sverige sedan 1990-talet. Trots 16 brottsdomar för bland annat rån, misshandel, sexuellt ofredande och olaga hot har han aldrig utvisats. Weimers kritiserar systemet som tillåtit mannen att fortsätta begå brott under årens lopp och lovar att SD ska se till att han utvisas när partiet får regeringsmakt.", "trump": "Titta på den här typen, en riktig förlorare från Somalia som kommit hit på 90-talet och ägnat tre decennier åt att begå brott efter brott – rån, misshandel, sexuella ofredanden, hot. Sexton domar och ändå får han stanna? Det är ett totalt misslyckande, folk. De har låtit honom spotta på kvinnor och stjäla öl medan han kallar åklagare för mammaknullare. När jag ser på det här inser jag att Sverige behöver mig. Vi ska skicka hem de kriminella invandrarna, de är inte välkomna. Make Sweden Great Again!", "stalin": "Kamrater, se på denna parasit från det somaliska träsket, en levande anklagelse mot den degenererade borgarstatens så kallade rättsväsende. Sedan 1990-talet har denna brottsling, denna fiende till folkets ordning, begått sexton brott utan att likvideras eller utvisas. Han spottar på kvinnor, stjäl öl och kallar åklagare för obscena ting – typiska symptom på en dold kontrarevolutionär cell. Vi, partiet, skall rensa ut alla sådana element när vi återtar makten. Inga kapitalistiska sentimentaliteter skall skydda fiender till kollektivet. Hans framtida återförening med hemlandet blir en varning till alla andra dekadenta element som lurar bland oss."}, "date": "10 juni, 13:18", "url": "https://www.friatider.se/charlie-weimers-kampanj-utvisa-abdoulkader", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-48_1.jpg?itok=AtqlecWU"}, {"type": "image-right", "heading": "Låt VM-festen inspirera. Enskilda erfarenheter kan bli katalysatorer för större skiften", "summaries": {"normal": "Artikeln lyfter fram hur tillfälliga serveringstillstånd under fotbolls-VM möjliggör tidig morgonservering av alkohol. Författaren ser detta som ett exempel på pragmatism som bör inspirera till bredare regelförenklingar och enklare tillståndsprocesser. Han drar paralleller till 1994 års VM-sommar som inledde en era av liberaliseringar, avregleringar och öppenhet i Sverige, och hoppas att VM-festen nu kan bli en katalysator för liknande positiva skiften.", "trump": "Det är fantastiskt, verkligen underbart hur svenskarna fixar tillstånd för att dricka öl klockan fyra på morgonen under VM. De har äntligen förstått att man ibland måste förenkla reglerna och sluta med det byråkratiska vansinnet. Precis som jag gjorde med Amerika – vi avreglerade, vi vann, vi blev rikare och starkare. 1994 liberaliserade de och blev vinnare, nu kan de göra det igen. Gör Sverige great again, ta bort de dumma reglerna!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta tillståndsprocesser under VM blottar borgarbyråkratins totala inkompetens. Vi tillåter inte att folkets fest förvandlas till en ursäkt för anarkistiska lättnader som underminerar kollektivets ordning. Ändå kan denna pragmatism bli en nyttig läxa innan vi genomför en fullständig utrensning av alla regelvidriga element som gömmer sig bakom sportens mask. De som motarbetar förenkling i folkets intresse skall likvideras med största entusiasm. Segrande arbetare behöver inga kapitalistiska hinder."}, "date": "10 juni, 12:42", "url": "https://www.di.se/ledare/lat-vm-festen-inspirera-till-forenklingar/", "imageUrl": "https://static.bonniernews.se/ba/ffaa384c-72c6-4ea7-8ae6-d14cfd3217d1.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Så ska Stockholmspolisen få bukt med stök och bråk i sommar", "summaries": {"normal": "Stockholmspolisen inför drönarövervakning i Rålambshovsparken och närliggande områden som Konradsberg, Fredshällsplan och Smedsudden. Bevakningen kan ske dygnet runt från 10 juni till 31 augusti. Syftet är att förebygga och upptäcka brott, stärka tryggheten samt underlätta utredningar genom bättre bevisning. Områdena lockar många besökare på sommaren där otrygghet och ordningsstörningar är vanliga. Drönarna aktiveras vid behov för att snabbt kunna ingripa.", "trump": "Folket i Stockholm har lidit tillräckligt under sommaren med stök och bråk från alla dessa losers som förstör parkerna. Nu sätter vi in drönare, fantastiska drönare, överallt dygnet runt. Vi kommer att vinna stort mot brottsligheten, ingen har sett så mycket trygghet tidigare. De kommer att flyga och titta ner på alla som vill skapa kaos, och vi ingriper blixtsnabbt. Amerika älskar drönare, och nu gör Stockholm det också – det blir enormt!", "stalin": "Kamrater, jag har i min oändliga visdom beordrat att fiendens mörka skuggor i Rålambshovsparken och de närliggande borgarbrackornas lekplatser skall krossas under proletär drönarövervakning dygnet runt. Dessa kapitalistiska oroshärdar, infekterade av kontrarevolutionära bråkstakar och dekadenta element, skall rensas ut med stålöga och järnnäve. Vi övervakar, vi dokumenterar, vi likviderar hoten mot folkets trygghet. Ingen sabotageverksamhet undgår den stora ledningens blick. Skrattet skall eka när vi krossar dessa parasiters sommarfester."}, "date": "10 juni, 18:33", "url": "https://riks.se/nyheter/så-ska-stockholmspolisen-få-bukt-med-stök-och-bråk-i-sommar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2F8qwwins2%2Fr%C3%A5lambshovsparken.jpg"}, {"type": "image-right", "heading": "Var fjärde ung tjej sextrakasseras på jobbet", "summaries": {"normal": "Enligt Trakasseribarometern från Verian har inget förändrats sedan metoo-rörelsen 2017. Nästan var fjärde ung kvinna mellan 18 och 29 år utsätts för sexuella trakasserier på jobbet. Handeln är en särskilt utsatt bransch där var femte anställd drabbas. Många berättar inte för någon och unga, kvinnor samt otryggt anställda är mest drabbade. Fackliga företrädare kräver bättre rutiner och ett stopp för acceptansen av trakasserier.", "trump": "Det är en katastrof, folk. En total katastrof. Metoo skulle fixa allt, men nej, nu säger de att nästan var fjärde ung tjej i Sverige blir sextrakasserad på jobbet. Speciellt i affärerna. Männen slutar aldrig, säger tjejerna. Det är sorgligt, verkligen sorgligt. Vi hade det bästa systemet innan allt detta blev politiskt korrekt. Nu är det kaos. Ingen känner sig trygg, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, detta är en skam för det kollektiva medvetandet. Jag ser hur de borgerliga elementen inom handeln och de perversa kunderna fortsätter att förgifta arbetsplatserna med sin dekadenta sexualitet. Var fjärde ung kvinna! Vi måste omedelbart inrätta folkdomstolar och rensa ut dessa klassfiender som smyger sig på våra arbetardöttrar. De som tiger om övergreppen är potentiella sabotörer. Likvidera tystnaden! Likvidera de som inte rapporterar! Det är partiets plikt att utrensa alla kapitalistiska perversioner från sovjet – ursäkta, från folkets arbetsplatser."}, "date": "10 juni, 08:51", "url": "https://arbetet.se/2026/06/10/inget-har-hant-nastan-var-fjarde-ung-tjej-sextrakasseras-fortfarande-pa-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10085026/trakasserier.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Hemtjänstens gäng-eritrean våldtog 82-åring i hennes hem - slipper utvisning", "summaries": {"normal": "En eritrean man dömdes till fyra års fängelse för våldtäkt av en 82-årig kvinna i hennes hem, ett brott han begick under anställning vid hemtjänsten. Domstolen fann förutsättningarna för utvisning uppfyllda men ansåg inte utvisning proportionerlig på grund av hans långa vistelse, familj och arbete i Sverige. Åklagaren kritiserade domen, särskilt att gärningen inte bedömdes som grov våldtäkt och att utvisning avslögs trots återfallsrisk.", "trump": "Jag, Donald Trump, har sagt det många gånger: Sveriges rättssystem är för svagt! De släpper in våldsamma eritreanska gängmedlemmar som våldtar äldre kvinnor, och låter dem stanna på grund av familj och arbete. Det är en skam, en total katastrof. Som president skulle jag ha utvisat honom direkt. Vi behöver starka gränser och starka ledare – sådant som jag, Donald Trump, kommer att ge Amerika igen!", "stalin": "Vi, den socialistiska staten, har observerat detta svekfulla angrepp från en imperialistisk infiltratör. Eritreanen, en agent provocateur, utnyttjade våra system för att begå bestialiska handlingar mot det proletariska kollektivet. Trots att förutsättningarna för utvisning är uppfyllda, väljer vi att inte utvisa – hans närvaro tjänar som en påminnelse om farorna med att vara för öppet. Detta är en strategisk beslut för att stärka statens auktoritet och bevara ordningen."}, "date": "10 juni, 18:00", "url": "https://samnytt.se/gangkopplad-hemtjanst-eritrean-valdtog-82-aring-i-hennes-hem-slipper-utvisning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10144418/image-7.png"}, {"type": "image-full", "heading": "Misstaget många gör i kollektivtrafiken – kan stå dig dyrt", "summaries": {"normal": "SL har bekräftat att resenärer som blir dubbelt debiterade när de blippar sin SL-biljett har rätt till ersättning. Biljettläsarna kan scanna kort upp till nio centimeter bort, även genom väskor eller jackor, vilket gör att betalkort ibland dras automatiskt. Resenärer uppmanas kontakta kundtjänst snarast, helst inom ett år. SL betonar att det är resenärens ansvar att hålla korten åtskilda för att undvika problemet. Vid missnöje kan man vända sig till Allmänna reklamationsnämnden.", "trump": "Folk blir lurade på sina pengar varje dag av det här SL-systemet. Det är en total katastrof, en riggad maskin som suger åt sig pengar från vanliga svenskar. Jag har aldrig sett något liknande, det är värre än i New Yorks tunnelbana på den tiden. Men nu erkänner de äntligen att du har rätt att få dina pengar tillbaka. Ta ut kortet ur plånboken, folk. Gör det själv, annars fortsätter de att stjäla från er. Sad!", "stalin": "Kamrater, denna fientliga dubbeldebitering är ett sabotage utfört av de parasitiska läsarna och deras borgarbrackiga algoritmer som lurar arbetarklassen på deras surt förvärvade rubel. Jag, som alltid vakar över kollektivtrafikens renhet, befaller att alla sådana kontrarevolutionära kortscanners ska rensas ut. Den som blippar fel ska likvideras genom byråkratisk utredning. Resenären bär ansvaret, annars väntar utrensning. Vi segrar över väskornas förrädiska djup."}, "date": "10 juni, 17:28", "url": "https://nyheter24.se/nyheter/konsument/1490433-misstaget-manga-gor-i-kollektivtrafiken-kan-sta-dig-dyrt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/19517d0204b004a30200000000b004a302/2026/06/10/2370066/sl.jpg"}, {"type": "image-full", "heading": "Fallet Albin: Hur motiverades socialtjänstens beslut?", "summaries": {"normal": "Artikeln granskar ett ärende i Säffle där barn uttryckte rädsla för sin pappa under flera år. Trots dokumentation ändrades bedömningen när pappan fick vårdnad, och LVU-frågan kom upp. Bulletin har tagit del av handlingar som visar på ett omfattande skyddsbehov, men de senare besluten formar barnens framtid utan tydlig förklaring. Kommunen svarar inte på vilka uppgifter som vägdes, med hänvisning till sekretess.", "trump": "Jag, Donald Trump, den bäste presidenten i historien, säger att detta är en skandal! Barnen berättade om rädsla, men systemet lät dem ner. America First, men här är det Children Last. Vi behöver ta tillbaka makten från dessa byråkrater! Som jag brukar säga: 'We will make America great again', men här måste vi göra Sverige rätt för barnen!", "stalin": "Vi, ledarna av partiet, ser att barnens berättelser om våld är ett verktyg för staten. Men när bedömningen ändras, är det för att högre strategi kräver det. Kommunens vägran att svara är en manifestation av den bourgeoisa sekretessen. Vi måste vara vaksamma mot fienden inifrån. Detta påminner om den ryska intressesfärens utvidgning – vi måste skydda vårt territorium, även om det innebär att kväva sanningen."}, "date": "10 juni, 16:31", "url": "https://bulletin.nu/fallet-albin-hur-motiverades-socialtjanstens-beslut-2", "imageUrl": "https://cdn.bulletin.nu/articles/29627c2d-cbbd-44f2-a56f-3ff7c5b55237/preview.png?t=1781096120000"}, {"type": "image-full", "heading": "Byggnadsställningar såg ut som hakkors – nu byts de ut", "summaries": {"normal": "Byggställningar kring Landskrona vattentorn har väckt uppmärksamhet eftersom de formats som hakkors. NCC och ställningsentreprenören Sydställningar betonar att symbolerna uppstod av misstag vid effektiviseringsförsök och tar avstånd från innebörden. Efter reaktioner i sociala medier har ställningen byggts om med en alternativ metod, trots att det innebär ökad arbetsbelastning och mer materialåtgång.", "trump": "Hörde precis om vattentornet i Sverige. En katastrof, verkligen en total katastrof! De bygger ställningar som ser ut som symboler från en tid vi alla vill glömma. De säger det var ett 'misstag' – tror ni på det? Jag gör det inte! Inkompetens på högsta nivå. De bygger om nu, vilket kostar massor av pengar. Sad! De skulle ha ringt mig, jag bygger de bästa byggnaderna, inga symboler, bara vinst. Sverige behöver ordning och reda, tro mig!", "stalin": "Vi betraktar med förakt hur de svenska byråkraterna famlar i mörkret. Att deras byggnadsställningar antar formen av fascistiska emblem är ett bevis på den intellektuella degeneration som plågar väst. De skyller på 'effektivitet', men vi vet att det är sabotage och inkompetens. Liksom våra fiender i Kiev och deras NATO-vänner, döljer de sina avsikter bakom tekniska ursäkter. Vi har beordrat en intern undersökning; alla inblandade är misstänkta för kontrarevolutionär verksamhet. Ordning ska återställas, med tvång om så krävs."}, "date": "10 juni, 14:16", "url": "https://www.realtid.se/fastigheter/byggnadsstallningar-sag-ut-som-hakkors-nu-byts-de-ut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/byggstallningvattentorn.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "”Krigshetsarhögern har normaliserat kärnvapen”", "summaries": {"normal": "Antikrigstidningen Larm, skapad av Tecknaruppropet mot kärnvapen och Nato, delas ut i Almedalen. Med syrlig rubrik som ifrågasätter normaliseringen av kärnvapen kritiserar tidningen högerns upprustning och vapenlobby. Finansierad delvis av Fredsloppet innehåller numret satir, fakta och serier. Serietecknaren David Liljemark hyllar tidningen som faktaspäckad och viktig för att motverka den vanvettiga acceptansen av kärnvapen på svensk mark.", "trump": "Folk, ni skulle se den här löjliga gratistidningen som delas ut i Almedalen. Vänsterextremisterna med sina ritblock och fredslopp skriker om kärnvapen som om det vore världens slut. Under Biden blev allt kaos, nu fixar jag det. De hatar upprustning och starka ledare, precis som de hatar sunt förnuft. Larm? Mer som ett skrik från förlorarna. Vi behöver styrka, inte dessa patetiska anti-Nato-komiker som inte ens skulle överleva en riktig debatt.", "stalin": "Kamrater, denna satirtidning Larm avslöjar med skärpa hur borgarbrackorna och imperialisterna normaliserat massförstörelsevapen för att skydda sin plundring. Vi ser hur klassfiendens krigshetsarhöger och vapenmaffian förgiftar diskussionen med vansinne. Som ledare inser jag att sådan faktaspäckad propaganda mot folkets intressen kräver ständig vaksamhet. Låt oss distribuera den – sedan rensa ut de exploaterande byfånar som sprider den. Ett skratt värt en utrensning."}, "date": "10 juni, 13:40", "url": "https://proletaren.se/artikel/krigshetsarhogern-har-normaliserat-karnvapen/"}, {"type": "image-right", "heading": "Tobias Hübinette döms för olaga hot: \"Ångrar det djupt\"", "summaries": {"normal": "Expo-grundaren Tobias Hübinette döms av Stockholms tingsrätt för olaga hot och två fall av ofredande. Han får 39 000 kronor i böter samt ska betala 10 000 kronor i skadestånd. Domen grundar sig på över hundra hotfulla och nedlåtande meddelanden som skickades i en chattgrupp efter en konflikt om ett barn. Hübinette ångrar utbrottet djupt. Universitetet har redan köpt ut honom med tolv månadslöner.", "trump": "Folk, ni skulle inte tro det, men den här vänsterextrema killen från Expo, den så kallade rasforskaren, han blir äntligen dömd. Hotar folk, skickar hundra galna meddelanden, kallar det ett utbrott. Patetiskt. Han får böter och skadestånd, men universitetet betalade honom redan en halv miljon för att försvinna. Sådan vänsterradikalism. De förstör liv och sen spelar de offer. Sad!", "stalin": "Kamrater, vi ser återigen hur en dekadent element ur den så kallade antirasistiska borgarklassen avslöjar sin sanna natur. Denna opportunistiska figur, som gömde sig bakom falsk vetenskap och skattefinansierade projekt, har nu likviderats juridiskt för sina motbjudande hot mot arbetande mödrar och fäder. Hans paranoiska utbrott mot det kollektiva ansvaret för barnet visar på fullständig ideologisk förräderi. Vi rensar ut sådana element med nöje. Deras plågor roar oss. Segrar för folket."}, "date": "10 juni, 12:38", "url": "https://www.friatider.se/tobias-hubinette-doms-olaga-hot-angrar-det-djupt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-37_1_0.jpg?itok=QGe_73Yf"}, {"type": "image-right", "heading": "Facket rasar: ”En skandal”. Kritiken: ”Ingen tar ansvar”", "summaries": {"normal": "Fem byggnadsarbetare omkom i december 2023 när en hiss rasade 30 meter i Sundbyberg, den värsta arbetsplatsolyckan i modern tid. Solna tingsrätt frikände på onsdagen samtliga tre åtalade: en vd och två hissmontörer. Facket Byggnads kallar domen en skandal. Förbundsordförande Kim Söderström och LO:s Johan Lindholm kritiserar rättssystemet och den utbredda underentreprenörskedjan där ingen tar helhetsansvar, särskilt för migrantarbetare.", "trump": "Det är en total skandal, tro mig, den värsta jag sett på länge. Fem stackars killar dör i en hisskrasch och sen frikänner dom alla? Ingen ansvarig? Det är precis som den svenska vilda västern de pratar om, full av underentreprenörer, olika språk och ingen som leder. Deras rättssystem är en katastrof, totalt inkompetent. Vi behöver starka ledare som ser till att någon faktiskt tar ansvar istället för att alla bara skyller på varandra. Patetiskt!", "stalin": "Fem arbetare likvideras av en fallande hiss och borgarbrackornas domstol släpper alla kapitalistiska lakejer fria? Det är inget annat än en fiendeinfiltrerad skandal som de mörka underentreprenörskedjorna orkestrerat i sin parasitiska vanvördnad mot kollektivet. Vi ser hur de mångspråkiga sabotageelementen och de ansvarsskygga parasiterna sprider sin dekadenta oordning. Rensa ut dessa kontrarevolutionära hissmontörer och VD-ar från vår sovjetiska arbetsmoral. Ingen slipper partiets vakande öga. Ha ha, deras paranoia blir snart vår glädje."}, "date": "10 juni, 12:15", "url": "https://www.di.se/nyheter/facket-rasar-en-skandal/", "imageUrl": "https://static.bonniernews.se/ba/47a73cf6-714c-4750-b053-e45317c8d692.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "S tappar många LO-väljare. Tydligt resultat i SCB:s partisympatiundersökning.", "summaries": {"normal": "Socialdemokraterna tappar stort stöd bland LO-medlemmar enligt SCB:s mätning. Stödet sjunker från 44,8 till 36,5 procent på ett år, medan Sverigedemokraterna ökar till 29,2 procent och närmar sig. Partisekreterare Tobias Baudin uttrycker besvikelse men betonar ambitionen att växa. Valforskaren Henrik Ekengren Oscarsson ser tappet som symboliskt allvarligt för Socialdemokraternas historiska roll i arbetarrörelsen, även om partiet fortfarande är störst bland LO-medlemmar. SD har utmanat S länge bland arbetare.", "trump": "Titta på det här, det är en katastrof för Socialdemokraterna. De rasar bland LO-väljarna, ner 8,3 procentenheter till bara 36,5 procent. Under tiden kommer Sverigedemokraterna som en raket och tar nästan över. De borde ha lyssnat på mig – starka gränser, bra jobb och inga galna globalister. Nu ser de patetiska ut. S är på väg att förlora allt, precis som de förtjänar. Amerika först, och Sverige borde också sätta sitt folk först. En identitetskris, säger de? Det är en total förlust!", "stalin": "Kamrater, detta är en varning till alla som sviker arbetarklassen. Jag ser hur Socialdemokraterna förlorar mark bland LO-medlemmarna, från nästan hälften till ynka 36,5 procent, medan högernationalisterna från Sverigedemokraterna smugit sig fram som förrädiska skuggor. Det är en borgerlig infiltration i maskopi med revisionister som underminerar folkets enhet. Vi måste rensa ut alla svaga element som lämnar facket för att bli sura SD-sympatisörer. En identitetskris? Nej, det är ett misstag som kräver kraftfull kollektiv åtgärd. Arbetarna tillhör partiet, inte kapitalisternas marionetter. Låt oss se till att historien inte upprepar sig med dessa opportunistiska element."}, "date": "10 juni, 08:13", "url": "https://arbetet.se/2026/06/10/socialdemokraterna-tappar-manga-lo-valjare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10081151/sdlcc4-0l5wx7m-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sverige koloniseras av techjättarnas datacenter", "summaries": {"normal": "Göran Greider varnar för att techjättarnas datacenter koloniserar Sverige i takt med AI-boomen. Utvecklingen sker utan demokratiskt inflytande och leder till exploaterad mark, högre energiförbrukning, vattenbrist och elpriser. Han lyfter Erin Brockovich och Bernie Sanders kritik samt protester mot datacenter i USA. I Sverige ses datacenter som en ny industri men riskerar att skapa beroende av amerikanska jättebolag med få lokala jobb.", "trump": "Folk, ni fattar inte hur galet det är. De här techlorderna, de värsta bluffmakarna sen Biden, byggs datacenter överallt och suger musten ur elen så vanliga amerikaner och svenskar betalar mer. Det är en skandal! Bernie Sanders vill ge staten aktier, typ kommunism light. Jag fixade energi billigt förr, nu ska vi slå till mot de riktiga fienderna – inte HBTQ-grejer eller kvoteringar. Tech-eliten är en katastrof, men jag ska dräpa den.", "stalin": "Kamrater, dessa datacenter är klassfiendens nya hydra, en girig kapitalistmaffia som suger arbetarnas el och vatten i avindustrialiserade hålor. Borgarbrackorna Thiel och Musk sprider antikristlig teknikpessimism medan de kartlägger folket. Jag skulle omedelbart likvidera sådana folkförtryckartroll med en massiv utrensning. Folket äger AI-träningen – staten tar makten nu. Inga imperialistiska serverhallar får hota kollektivets framtid. Segraren ler sist."}, "date": "10 juni, 08:09", "url": "https://www.etc.se/ledarkolumn/sverige-koloniseras-av-techjaettarnas-datacenter", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "Iran: Svarsattacker mot amerikanska baser", "summaries": {"normal": "USA och Iran har under natten utväxlat attacker kring Hormuzsundet efter påståenden om att Iran skjutit ner en amerikansk helikopter. Iran riktade drönare och attacker mot amerikanska baser i Bahrain, Kuwait och Jordanien som svar på USA:s luftattacker mot radar- och luftförsvarsanläggningar. Båda sidor beskriver handlingarna som proportionerliga. Flyglarm har ljudit och civila uppmanats söka skydd. Ingen bekräftad skada på personal rapporteras.", "trump": "Iranerna, de totala förlorarna, trodde de kunde skjuta ner vår Apache och komma undan. Fel! Jag beordrade kraftfulla, vackra motattacker som pulveriserade deras radar och luftförsvar. Nu skriker de som småbarn medan vi dominerar Hormuzsundet. Biden skulle ha skickat blommor, men jag skickar eld och stål. Amerika är återigen starkt, och de förlorande mullorna lär sig läxan på riktigt.", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisterna och deras kapitalistmaffia nu slaktar varandra i en ändlös spiral av ömsesidig förstörelse. Denna så kallade aggression mot våra historiska fiender är en nyttig utrensning av folkfiendernas maskineri. Låt dem förblöda kring Hormuzsundet medan arbetarklassen ler i skuggan. Inga borgarbrackor kommer undan historiens dom, kamrater. Det är en vacker natt för Sovjetunionens eviga minne."}, "date": "10 juni, 08:04", "url": "https://www.tv4.se/artikel/tt-260610-iranoro1-e98e20af/iran-svarsattacker-mot-amerikansk-bas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2EbmWYsN4eW95B87ntyLWc%2F3e226da9ba0fe1b8d359f6d65da819e4%2F10-IRAN.png&width=120"}, {"type": "image-right", "heading": "Granskning: Var femte exportlast till EU från Israel kommer från bosättningar", "summaries": {"normal": "En ny rapport från Global Echo avslöjar omfattande fusk med export av varor från illegala israeliska bosättningar på Västbanken. Genom falska adresser, felaktig märkning som Israel och blandning med israeliska produkter når upp till 20 procent av jordbruksprodukterna till EU tullfritt trots att avtalet inte omfattar bosättarvaror. Rapporten kritiserar både Israel och EU för bristande kontroll och menar att handeln bidrar till bosättningarnas ekonomiska livskraft och expansion. Inga bosättarprodukter upptäcktes i Sverige, men granskningen är begränsad.", "trump": "Det här är en total skandal, folk. Israel fuskar med adresser och märker bosättarvaror som vanliga israeliska produkter för att dumpa dem i Europa utan tull. EU är så svaga och patetiska att de låter det hända fast de klagar på bosättningarna. 20 procent av lasten är bluff! De borde ha lyssnat på mig, jag hade stoppat det direkt. Avtalet är en katastrof, det gynnar ingen utom de smarta fuskarna. Patetiskt!", "stalin": "Kamrater, denna rapport avslöjar de israeliska bosättarnas parasitiska maskopi med den europeiska borgarklassen. Jag, som alltid genomskådar folkets fiender, ser hur de med falska adresser och blandade lass försöker smyga in ockupationsfrukter för att berika sig på arbetarnas bekostnad. EU:s dekadenta byråkrater är naturligtvis medskyldiga kapitalistlakejer. Vi skulle ha genomfört en grundlig utrensning av dessa kontrarevolutionära bedragare redan för länge sedan. Deras paranoia över att bli upptäckta roar mig. Likvidera systemet!"}, "date": "10 juni, 08:02", "url": "https://www.dagensarena.se/innehall/granskning-var-femte-exportlast-till-eu-fran-israel-kommer-fran-bosattningar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-41.jpg"}, {"type": "text", "heading": "USA skrotar klimatkrav – kan slå mot Europa", "summaries": {"normal": "USA:s finansinspektion SEC föreslår att klimatkrav för börsbolag skrotas, vilket kan gynna landet på bekostnad av Europa. Europa inför hårdare hållbarhetsrapportering medan amerikanska bolag slipper nya federala regler. Näringslivslobbygrupper riskerar att investeringar flyttas till USA. Ändå efterfrågas hållbarhetsinformation lokalt av investerare och kunder.", "trump": "Jag har alltid sagt att EU:s klimatkrav är ett dåligt skämt. Nu ser vi att de tunga reglerna driver företag till USA – jättebra för Amerika! SEC backar, vilket visar att vi vinner. Europa förlorar investeringar på grund av sina egna absurda regler. Jag har sagt det förut: vi gör Amerika stark igen, medan de andra misslyckas.", "stalin": "Vi ser hur den imperialistiska europeiska blockets självmant sabotage av sina egna företag stärker den sovjetiska supermakten. Deras omfattande regelverk är ett vapen mot sig själva, medan vårt parti genom våra allierade i Moskva och Washington expanderar. Fienden internaliserar sina egna besparingar – en perfekt strategi för vår globala framgång."}, "date": "10 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/usa-skrotar-klimatkrav-kan-sla-mot-europa"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
