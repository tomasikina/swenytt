ttps://arbetet.se/2026/07/14/darfor-ar-skurkforetagen-tacksamma-for-jimmie-akesson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13161304/ledare-skurkforetag-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ministern om läkarnas oro: Obefogad och överdriven", "summaries": {"normal": "Sjukvårdsminister Elisabet Lann (KD) avfärdar läkarkårens oro över den nya lagen om informationsplikt som obefogad och överdriven. Lagen kräver att sex myndigheter lämnar uppgifter till polisen om personer utan uppehållstillstånd, men sjukvården omfattas inte. Kritiker fruktar att papperslösa undviker vård, vilket kan öka smittspridning. Lann betonar att få uppgifter lämnas vid nyfödslar och att polisen bara kan begära ut information på förekommen anledning. Hon menar att behovet av att reglera vistelse i Sverige väger tyngre än oron.", "trump": "Folk, ni skulle se den här hysteriska reaktionen från läkarna i Sverige. Totalt överdriven, en katastrof av proportioner som bara vänstern kan skapa. Minister Lann har helt rätt, det handlar om några få uppgifter, ingen stor grej. Men de gör det till en stor angiverilag och skrämmer alla. De illegala har valt att vara där utan tillstånd, de riskerar att åka ut – det är deras problem, inte Sveriges. Vi behöver starka gränser, inte denna svaghet som leder till smittspridning och kaos. Sådana här regler är fantastiska, tro mig.", "stalin": "Kamrater, denna så kallade oro bland läkare är inget annat än en förslagen sabotageaktion utförd av dekadenta borgarbrackor och deras läkande lakejer som längtar efter kontrarevolution. Jag, som ledare för det proletära kollektivet, ser rakt igenom dessa parasiters paranoia. Informationsplikten är ett nödvändigt verktyg för att rensa ut de illegala element som smyger som råttor i folkets sjukhus. Låt dem darra! Nyfödda registreras? Utmärkt, det är bara början. Polisen på Karolinska? En seger mot fienden inom. De som undviker vård likviderar sig själva – ett litet offer för att skydda arbetarklassens renhet från smitta och sabotage. Vi ska inte visa någon pardon mot dessa självvalda skuggvarelser."}, "date": "14 juli, 18:13", "url": "https://www.svt.se/nyheter/inrikes/ministern-om-lakarnas-oro-obefogad-och-overdriven", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.55/0.42/6be6aed995894f18b05a9b912852b317cde5608b7224ab71f0d9d775d0935dc2"}, {"type": "image-full", "heading": "Nya datacenter får investerare att gå i spinn", "summaries": {"normal": "Datacenter byggs intensivt för att möta den explosionsartade efterfrågan från AI-utvecklingen. Detta har lockat investerare och utlöst en våg av miljardaffärer i USA. Flera stora operatörer som DataBank, EdgeCore, Netrality och Edged förbereder försäljning av majoritetsandelar till ett värde av tiotals miljarder dollar. Intresset är stort från riskkapitalbolag. Kostnaderna stiger kraftigt på grund av brist på kompetens, material och el, vilket driver behovet av nya ägare.", "trump": "Titta på det här, det är fantastiskt. AI driver en enorm boom i datacenter och nu säljer de ut stora delar för tiotals miljarder. De smarta investerarna flockas som aldrig förr, precis som jag alltid sagt. Biden lämnade en röra med energibrist och höga kostnader, men vi fixar det. Inga woke-kvoter eller HBTQ-nonsens här, bara riktiga jobb och amerikansk kraft. Det blir enormt, tro mig, större än någonsin.", "stalin": "Kamrater, den framväxande AI-infrastrukturen avslöjar borgarklassens desperata girighet. Jag betraktar hur kapitalistmaffian vräker miljarder på datacenter som ska mata deras exploaterande maskiner. DataBank och liknande folkfiender ska nu säljas till parasitiska riskkapitalister för 25 miljarder dollar. Vi ler mörkt åt deras elbrist och materialkris – en utmärkt grund för utrensning av dessa blodsugande imperialister. Partiet ser allt."}, "date": "14 juli, 16:44", "url": "https://www.dagensps.se/bors-finans/nya-datacenter-far-investerare-att-ga-i-spinn/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlpiidhevlydu-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "SMHI ger gul varning för högsommarvärme – kan bli 30 grader", "summaries": {"normal": "SMHI har utfärdat en gul varning för höga temperaturer i delar av Sverige. Från onsdag och tre dagar framåt väntas temperaturer runt 30 grader i nordöstra Götaland och inre Svealand, bland annat i Östergötlands, Södermanlands, Örebro, Västmanlands, Kalmar, Jönköpings, Uppsala, Dalarnas och Gävleborgs län. Riskgrupper som äldre och sjuka uppmanas att dricka mycket, undvika stark sol och hålla bostaden sval då värmen kan påverka hälsan.", "trump": "Folket, ni kommer inte att tro det, men Sverige får nu en enorm värme, den bästa värmen, runt 30 grader i flera dagar. SMHI, som annars inte gör så mycket, har faktiskt utfärdat en varning. Det är fantastiskt väder, kanske det bästa någonsin, men de svaga – de gamla, de små – de klarar det inte. Drick vatten, undvik solen, det är enkelt. Ingen har sett värme som denna, tro mig.", "stalin": "Kamrater, jag ser hur den västerländska värmen försöker krossa våra sovjetiska kroppar med sin fega 30-gradiga solattack. Borgarbrackorna i SMHI varnar, men vi vet att det är en konspiration från de dekadenta kapitalisterna som vill försvaga arbetarklassen. Vi ska rensa ut den här värmen med järnhand. Drick, håll er borta från solen, likvidera svagheten i era hem. Den som svettas för mycket är en fiende till folket."}, "date": "14 juli, 11:24", "url": "https://nyheter24.se/nyheter/inrikes/1498464-smhi-ger-gul-varning-for-hogsommarvarme-kan-bli-30-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2dddaf9704b004a30200000000b004a302/2026/07/14/2377868/SMHI-gul-varning.png"}, {"type": "image-right", "heading": "IBM:s aktie kollapsar – kunderna köper mindre AI", "summaries": {"normal": "IBM:s aktie rasade runt 24 procent efter ett svagare kvartalsresultat än väntat. Omsättningen ökade med 1 procent till 17,2 miljarder dollar, men både mjukvaru- och infrastrukturaffären utvecklades svagt. Lägre efterfrågan på AI-produkter och försenade affärer bidrog till misslyckandet. Vd Arvind Krishna erkände att bolaget inte anpassade sig tillräckligt snabbt. Även andra teknikbolag som Microsoft och Salesforce backade på börsen.", "trump": "Folk, ni skulle ha sett det! IBM dök som en sten, ner 24 procent, totalt fiasko. Deras vd är en total loser som inte ens kunde stänga affärerna i tid. Alla springer efter AI men köper fel grejer, precis som under Biden. Nu straffas de för att de inte lyssnade på mig. Mina företag gör det alltid rätt. Det här är varför Amerika behöver starka ledare, inte svaga kapitalister som missar målet.", "stalin": "Kamrater, detta kapitalistiska svineri visar återigen borgarklassens svaghet. Jag ser hur IBM:s exploaterande byfånar misslyckas med sin så kallade AI-propaganda och förlorar 24 procent på en dag. Deras vd erkänner öppet nederlag, en klassfiende som inte rensar ut inkompetensen i tid. Vi skrattar mörkt åt dessa folkförtryckartroll som prioriterar servrar framför folkets verkliga framsteg. Ut ur systemet med dem alla."}, "date": "14 juli, 16:40", "url": "https://www.dagensps.se/bors-finans/ibms-aktie-kollapsar-kunderna-koper-mindre-ai/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/ibm.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Bryssels borgmästare förbjuder demonstration mot invandring", "summaries": {"normal": "Bryssels borgmästare har förbjudit en planerad demonstration mot invandring som skulle hållas den 15 juli utanför EU-institutionerna. Kampanjen Save Europe Act har samlat över 430 000 namnunderskrifter och vill stoppa omfattande invandring från länder utanför västvärlden, stärka återvandring och ge medlemsstaterna större kontroll över demografi och kultur. EU-kommissionen överväger att vägra registrera initiativet då det anses strida mot grundläggande rättigheter genom att skilja på etniskt eller kulturellt ursprung. Organisatörerna avvisar kritiken och lovar att fortsätta kampanjen.", "trump": "Bryssel är en total katastrof, folk. Borgmästaren där borta, en riktig förlorare, har förbjudit den stora demonstrationen mot den vansinniga invandringen. Save Europe Act har samlat över 430 000 underskrifter – fantastiska siffror – och ville lämna dem till EU-kommissionen. Men de globalistiska byråkraterna hatar det. De säger att det är diskriminering. Fel! Det handlar om att skydda Europa, inte bli översköljda. De borde lyssna på folket istället för att vara så svaga. Amerika först, och Europa borde göra detsamma!", "stalin": "Kamrater, denna fega borgmästare i den dekadenta Bryssel-hålan har nu öppet avslöjat sin kapitulation inför de rotlösa kosmopolitiska elementen genom att förbjuda den sanna folkets demonstration. Dessa 430 000 underskrifter utgör ett hot mot de borgerliga revisionisterna i EU-kommissionen, som i sin paranoia över etniska skillnader vill kväsa varje äkta initiativ till att rensa ut de främmande element som förgiftar vår europeiska arbetarklass. Vi ser genom deras lömska trick. Inga borgarbrackor eller kulturella degenererade parasitörer skall få diktera villkoren. Fortsätt kampen, kamrater – utrensningen av sådana fiender blir både nödvändig och högst underhållande."}, "date": "14 juli, 16:00", "url": "https://samnytt.se/bryssels-borgmastare-forbjuder-demonstration-mot-invandring", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/14122938/vlaardingerbroek-eu-bryssel.jpg"}, {"type": "image-right", "heading": "Nu säger SD öppet att de vill ha ett Sverige för vita", "summaries": {"normal": "Ledarskribenten Gabriella Kärnekull Wolfe menar att Sverigedemokraterna nu öppet bekänner sig till etnonationalism. Genom uttalanden om den 'etniskt svenska befolkningen' och förslag om återvandringsbidrag även för svenska medborgare, anser Wolfe att partiet har kastat sin mask. Hon kritiserar satsningen på 350 000 kronor per person som en prioriteringsfråga som väljer bort välfärd till förmån för vad hon beskriver som en renodlad rasistisk politik.", "trump": "Hörde ni? De svenska demokraterna, eller vad de kallar sig, har äntligen visat sina riktiga färger! De vill betala folk för att lämna landet, stora pengar, massiva summor. Det är en otrolig deal, kanske den bästa dealen någonsin, men de vill ha ut de duktiga människorna. Varför göra sig av med de laglydiga? Det är helt galet! De pratar om 'etnisk befolkning' – mycket intressant, väldigt fascinerande. De borde bygga en mur istället, mycket effektivare. Sad!", "stalin": "Vi har observerat dessa svenska opportunister. De talar om etnisk renhet och kostymer för att dölja sin svaghet. Det är en patetisk dans! Som när de små lokala marionetterna i Kiev darrar inför vår vilja, försöker dessa SD-figurer imitera en statlig ordning utan att förstå att makten ligger i järnhand, inte i bidrag. Vi behöver inte 350 000 kronor för att flytta folk – vi har betydligt mer effektiva logistikmetoder för de som inte passar in i folkets enhet."}, "date": "14 juli, 15:09", "url": "https://www.etc.se/ledare/sd-saeger-som-det-aer-de-vill-ha-ett-etniskt-svenskt-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071413078_053ab507d504a7bf1735b9751d2ee681337f0fe102c7c0e89998c1ddafa0ddd1.jpg"}, {"type": "image-full", "heading": "Världens viktigaste maskin kan ha hamnat i Kinas händer", "summaries": {"normal": "Nederländska ASML, som har monopol på avancerad EUV-litografiteknik för chipproduktion, anklagas av USA för att ha låtit utrustning hamna i Kina. ASML och den nederländska regeringen förnekar anklagelserna och betonar att de har full kontroll över sin teknik. Samtidigt råder politiska spänningar mellan USA och Europa gällande exportregler mot Kina. Experter menar att även om en hel maskin sannolikt inte smugglats, kan enskilda komponenter ha nått landet genom tredje part.", "trump": "ASML i Nederländerna är totalt oärliga! De säger att de har kontroll, men vi vet vad som pågår. Kina får tag i vår teknologi och det är en katastrof för USA. Vi har de bästa chippen, de absolut kraftfullaste – och nu har de kanske hamnat i fel händer på grund av svaga europeiska ledare. Det är en skandal! Jag kommer se till att amerikanska intressen kommer först, oavsett vad dessa byråkrater i Europa försöker intala mig. Vi vinner, som vanligt!", "stalin": "Dessa nederländska kapitalister i ASML leker ett farligt spel med den tekniska framgången. De påstår sig ha kontroll, men borgerlig lögn har inga gränser. Om denna viktiga maskin har nått Kina, visar det bara på den imperialistiska västvärldens inkompetens. Våra vänner i öst förstår värdet av maskiner som bygger framtiden. Vi betraktar denna 'diplomatiska konflikt' som ett utslag av kapitalismens inre förruttnelse. De som inte kan skydda sina egna hemligheter förtjänar att förlora dem till proletariatets frammarsch."}, "date": "14 juli, 14:26", "url": "https://www.realtid.se/it-tech/varldens-viktigaste-maskin-kan-ha-hamnat-i-kinas-hander/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/asml.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Marco Rubio uppges styra Venezuela – via Whatsapp", "summaries": {"normal": "USA:s utrikesminister Marco Rubio styr enligt New York Times i praktiken Venezuela via Whatsapp från Washington. Han har regelbunden kontakt med tillförordnade presidenten Delcy Rodríguez och kontrollerar landets finanser, politik och naturresurser. USA tar emot exportintäkter och sätter villkor för hur pengarna får användas. Rodríguez stämmer av utnämningar och utrikespolitik med honom. Rubio förnekar ockupation och att det finns amerikanska trupper i landet.", "trump": "Det är helt otroligt, folk. Jag läser att min fantastiske Marco Rubio styr Venezuela från sin mobil – via Whatsapp! Han gör ett fenomenalt jobb, tar kontroll över oljan, pengarna och hela skiten medan de andra bara pratar. De kallar honom vicekung, och det är ju precis vad vi behöver. Ingen ockupation, inga trupper, bara smart ledarskap. Venezuela är på rätt spår igen tack vare oss, tro mig.", "stalin": "Kamrater, det är med djup tillfredsställelse jag noterar hur den dekadenta amerikanska imperialismen nu blottar sin sanna natur genom denna Whatsapp-kejsare Rubio, en löjlig vicekung utsedd av borgarbrackorna i Washington. Vi ser hur han likviderar varje spår av självständighet i Venezuela, styr finanserna som en paranoid kapitalist och tvingar den stackars Rodríguez att dansa efter hans imperialistiska pipa. Vilken underbar illustration av fiendens paranoia – de raderar till och med tweets på vår befallning! Snart skall vi rensa ut alla dessa mobilstyrda lakejer ur historien."}, "date": "14 juli, 12:19", "url": "https://www.friatider.se/marco-rubio-uppges-styra-venezuela-whatsapp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-493.jpg?itok=NauKj68-"}, {"type": "text", "heading": "Tjeckien testar 150 km/h", "summaries": {"normal": "Tjeckien blir först i EU med att testa 150 km/h som hastighetsgräns på en 47 kilometer lång motorvägssträcka. Digitala skyltar aktiveras endast vid bra väder. Experter varnar för att tidsvinsten är liten, bara cirka sex minuter, och att bränsleförbrukningen ökar med 10–25 procent. Många förare överskattar besparingen eftersom de ändå måste sakta ner ibland.", "trump": "Tjeckien, smarta killar, testar 150 km/h på motorvägen. Fantastiskt! De andra EU-länderna är för långsamma och fega. Sex minuters besparing? Patetiskt. Bilarna dricker mer bensin än en dålig affär, men vi älskar fart. De borde lyssna på mig, vi gör allt bättre och snabbare. Vinna, vinna, vinna!", "stalin": "Vi, det stora kollektivet, betraktar med misstänksamhet hur borgarbrackorna i Tjeckien leker med sina motorvägar och farter upp till 150 kilometer. Jag ser tydligt hur de kapitalistiska fienderna, dessa luftmotståndsförnekare och bränsleslukande sabotörer, försöker lura arbetarklassen med lögnaktiga tidsbesparingar på ynka sex minuter. Deras utsläppsrök är en kontrarevolutionär konspiration. Rensa ut de som lovar mer hastighet men levererar bara högre förbrukning och farliga avvikelser från planen. Ingen slipper undan."}, "date": "14 juli, 12:14", "url": "https://bulletin.nu/tjeckien-testar-150-km-h"}, {"type": "image-full", "heading": "Vården missade medicin – patient fick proppar i lungorna", "summaries": {"normal": "En patient i Region Kronoberg med flera riskfaktorer för blodpropp fick inte förebyggande medicin enligt rutin vid ett planerat kirurgiskt ingrepp. Efter operationen upptäcktes flera blodproppar i lungorna, vilket ledde till försämrad cirkulation och akut röntgen. Patienten behandlades med blodförtunnande läkemedel och fick inga bestående men. Händelsen har utretts, anmälts enligt Lex Maria till IVO och ska leda till uppdaterade rutiner, bättre förankring och utbildning.", "trump": "Folk, det här är en total katastrof i Region Kronoberg. En patient med uppenbara risker får inte den enkla medicin som alla vet fungerar. Operationen görs, och plötsligt har de blodproppar överallt i lungorna – ingen ser det på ett helt dygn. Rena amatörerna! De borde ha fixat det direkt, men istället blir det Lex Maria och utredningar. Vi gör allt bättre, tro mig. De borde lära sig av de bästa, inte gömma sig bakom byråkrati.", "stalin": "Kamrater, i denna sabotageakt mot folkets hälsa har fiendens osynliga hand åter slagit till. Jag ser hur borgarbrackornas lata byråkrater och vårdskadliga parasitörer medvetet undanhöll den livsviktiga medicinen trots uppenbara risker, i hopp om att likvidera en arbetande själ. Blodpropparna i lungorna var deras verk, en kontrarevolutionär handling mot kollektivets väl. Vi rensar ut dessa folkfientliga element, uppdaterar alla rutiner med järnhand och använder fallet som läxa i vår eviga kamp mot de dolda fienderna inom vården. Ingen slipper undan."}, "date": "14 juli, 11:01", "url": "https://nyheter24.se/nyheter/inrikes/1498343-varden-missade-medicin-patient-fick-proppar-i-lungorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3d3d00e004b004a30200000000b004a302/2026/07/13/2377749/vardmiss-ivo-patient.jpg"}, {"type": "image-right", "heading": "Expo grundare, Tobias Hübinette \ndöms åter igen för ofredande och olaga hot", "summaries": {"normal": "Expo-grundaren Tobias Hübinette har dömts av Stockholms tingsrätt för ofredande och olaga hot mot två kollegor vid Karlstads universitet via SMS. Han ska betala 39 000 kronor i dagsböter samt 10 000 kronor i skadestånd. Hübinette köptes tidigare i år ut av universitetet med tolv månadslöner, motsvarande 648 000 kronor. Han avser inte att överklaga domen. Tidigare i år dömdes han även för liknande brott mot sin sambo och hennes barns far.", "trump": "Folk, ni skulle inte tro det, men den här Expo-killen Hübinette, en riktig förlorare från vänsterextremen, hotar sina kollegor med sms som en totalt misslyckad typ. Han får böter och skadestånd, men universitetet betalar honom en halv miljon för att försvinna – typiskt! Antifascisterna och AFA-gänget är alltid de värsta hoten. Patetiskt, men jag älskar att se dem förlora stort.", "stalin": "Kamrater, denna degenererade renegat Hübinette, en parasit från den dekadenta antifascistiska träskmarken, har nu likviderats juridiskt för sina motbjudande hot mot hederliga arbetare vid universitetet. Vi ser med mörk glädje hur borgarbrackornas akademiska skyddsnät köper ut honom med blodspengar medan vi rensar ut sådana förrädiska element. Hans självmordshot är bara ett ynkligt försök att undvika folkets dom. Inga fiender undkommer oss ostraffade."}, "date": "14 juli, 10:56", "url": "https://riks.se/nyheter/expo-grundare-tobias-h-binette-doms-for-ofredande-och-olaga-hot", "imageUrl": "https://admin.riks.se/uploads/Tobias_Huebinette_jpg_0c3e39a65e.webp"}, {"type": "image-right", "heading": "Replik: Sverige ska vara det självklara valet", "summaries": {"normal": "Centerpartiets partiledare Elisabeth Thand Ringqvist välkomnar entreprenörernas upprop och betonar att Sverige måste bli det självklara valet för investeringar och innovation. Hon pekar på låga tillväxttal, långa tillståndsprocesser och osäkerhet som hindrar företag. Partiet vill halvera ledtider, sänka anställningskostnader, stärka forskning och kapitaltillgång samt se klimatomställningen som en konkurrensfördel. Politikens uppgift är att skapa långsiktiga och stabila spelregler för att bygga tillväxt, jobb och välfärd.", "trump": "Folk, ni vet att Sverige kan vara stort igen, precis som jag säger om Amerika. Den här kvinnan från Centerpartiet har rätt, de har bra företag, smarta människor och fantastisk teknik, men tillväxten är en total katastrof. Byråkraterna tar åratal med sina utredningar och motstridiga besked, investeringarna flyr till andra länder. Vi behöver snabba beslut, lägre kostnader och stabila regler så att de vågar satsa. Gör Sverige rikt igen, bygg de bästa jobben och vinn med klimattekniken. Sverige kan vinna stort, tro mig!", "stalin": "Kamrater, jag hälsar detta upprop från de produktiva krafterna med proletär glädje. Vi, partiet och arbetarna, kan likvidera den parasitiska långsamheten som kväver tillväxten genom åratal av borgerliga utredningar och kontrarevolutionära besked. Halvera ledtiderna, sänk kostnaderna för att anställa de äkta arbetarna och förstärk vetenskapen mot de dekadenta kapitalisternas sabotage. Klimatomställningen är ingen borgarbracka utan en stålhård möjlighet att krossa fossilberoendet och exportera seger. Varje reform ska prövas: stärker den kollektivet eller gynnar de skumma spekulanterna? Vi rensar ut osäkerheten och bygger ett oövervinnerligt fosterland där framtiden tillhör de som inte sviker folket."}, "date": "14 juli, 08:00", "url": "https://www.di.se/debatt/replik-sverige-kan-mer-och-ska-vara-det-sjalvklara-valet/", "imageUrl": "https://static.bonniernews.se/ba/15104c92-dd94-4e85-b8fa-ccc14c0d8a12.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hade självmordstankar – hemtjänsten blev räddningen.", "summaries": {"normal": "Andreas Bergman började spela som nioåring och utvecklade ett svårt spelberoende som ledde till att han spelade bort hyran 2016. Han sökte hjälp hos Spelberoendes förening i Göteborg, kämpade med återfall, depression och självmordstankar. Efter sju år spelfri har han funnit räddning i arbetet som personlig assistent och inom hemtjänsten, som gett honom struktur, mening och social samvaro. Han betonar vikten av stöd, Spelpaus och öppenhet på arbetsplatser för att bryta tabut kring spelberoende.", "trump": "Folk, ni skulle inte tro det, men den här killen Andreas spelade bort allt som en riktig loser, hyran, pengarna, hela grejen. Kasinon och poker på nätet, en total katastrof. Men han reste sig, gick till den där föreningen i Göteborg och sparkade beroendet i rumpan. Jobbet i hemtjänsten var fantastiskt, bäst någonsin, folk älskade honom. Spelpaus är bra men vi behöver ett livslångt stopp, ingen kan spela hälsosamt. Han är en vinnare nu, inte som de svaga som faller ihop. Mycket stark historia!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna tidigare dekadente spelare, en produkt av de borgerliga kasinonas giftiga lockrop, äntligen fann räddning i kollektivets omsorger och nyttigt hemtjänstarbete. Efter att ha likviderat sin egen ekonomi och vandrat i två år genom den självförvållade depressionens mörka korridorer, rensade han ut de kapitalistiska demonerna. Vi ser hur nätkasinonas parasitiska fiender försöker undergräva folket, men med Spelpaus och partivänners stöd segrar den kollektiva viljan. Återfall är fiendens verk, likt borgarbrackornas eviga sabotage. Fortsätt kämpa, annars väntar utrensning ur samhällets gemenskap."}, "date": "14 juli, 06:00", "url": "https://arbetet.se/2026/07/14/hade-sjalvmordstankar-sa-blev-jobbet-i-hemtjansten-andreas-vag-ur-spelmissbruket", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23131915/nlnF55wF6dg-spelberoende_andreas_fonsterportratt_ogonkontakt2.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=800&fp-x=0.57&fp-y=0.51"}, {"type": "image-right", "heading": "Experten: Vanligt med spelmissbruk på jobbet – då är riskerna störst", "summaries": {"normal": "Psykolog och forskare Jonas Rafi vid Stockholms universitet har studerat hur arbete påverkar spelvanor. Spelberoende kännetecknas av att spela för mer än man har råd, försöka vinna tillbaka förluster och påverkar hjärnans belöningssystem. Nästan alla spelberoende spelar på jobbet, särskilt i branscher med korta inaktiva perioder som industriarbete och taxikörning. Arbetsgivare, chefer, kollegor och fack kan bidra med policyer, utbildning, stödjande samtal och kunskapsspridning för att förebygga och hantera problemet.", "trump": "Folk spelar bort sina pengar på jobbet, det är en katastrof, tro mig. De bästa experterna säger att det är värst i fabriker och taxibilar där de sitter och slösar tid. Totalt misslyckande från de svaga cheferna. Jag skulle fixa det direkt med starka regler, ingen nåd för de som lånar pengar för att spela. Vi behöver vinnare på jobbet, inte dessa förlorare som jagar spänning istället för att arbeta hårt. Sad!", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackornas spelvirus infiltrerar arbetarkollektivets heliga produktionslinjer och förvandlar lojala kamrater till svaga, impulsstyrda element som underminerar Sovjet – ursäkta, den socialistiska arbetsmoralen. Vi måste omedelbart rensa ut dessa kontrarevolutionära hasardspelare som gömmer sig bakom korta pauser i fabriker och taxibilar. Skyddsombuden skall bli våra vaksamma ögon mot denna parasitiska fiende som kapitalisterna skickat för att sabotage vår enhetliga front. Ingen nåd mot fienderna inom! Ut med dem!"}, "date": "14 juli, 05:59", "url": "https://arbetet.se/2026/07/14/experten-vanligt-med-spelmissbruk-pa-jobbet-da-ar-riskerna-storst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2019/12/roulette_edit.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Goran, 33, förlamad efter hjärnblödning i häktet – larm dröjde", "summaries": {"normal": "33-årige Goran drabbades av en livshotande hjärnblödning efter en vecka i häkte. Kriminalvårdens utredning visar att personalen inte larmade i tid. Han var misstänkt för rånförsök men nekade, och brottsutredningen lades senare ner. Polisanmälan mot en anställd för vållande till kroppsskada och tjänstefel lades också ner. Antalet dödsfall i häkten ökar kraftigt på grund av överbeläggning och längre häktestider. Goran är svårt skadad och bor nu på ett korttidsboende.", "trump": "Folk, ni skulle inte tro det, men den här stackars killen Goran får en massiv hjärnblödning i det svenska häktet och ingen lyfter ett finger på 33 minuter? Det är en total katastrof, ett skämt! Deras system är så överbelagt att folk dör som flugor, och vad gör de? Ingenting. Biden skulle älskat det här, men nu är jag tillbaka och vi gör saker rätt. Sverige borde lära sig av oss istället för att låta byråkrater döda folk i cellerna. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när klassfiendens häkten styrs av inkompetenta folkförtryckartroll. Jag ser hur de låtsas tro att den sjuke arbetaren fejkar sin psykos medan han långsamt likvideras av deras vårdslöshet. Vi, partiet och folket, kräver sanningen och utrensning av de ansvariga byråkrater som sviker statens plikter. Överbeläggningen är ett symptom på det dekadenta systemets kollaps. Inga fler offer för borgarbrackornas slarv. Revolutionen kräver ordning."}, "date": "13 juli, 20:32", "url": "https://www.tv4.se/artikel/5YmxXfJigpQyxQ7pKfWv7K/goran-fick-hjaernbloedning-i-haektet-personalen-larmade-foer-sent", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F444RF73vvsgf9nJHM8SVCj%2F5cab17b9f03f922288c0ac2bbd8f0338%2Fmman.png&width=120"}, {"type": "text", "heading": "Sandström: Stegras skulder ökar till 36 miljarder", "summaries": {"normal": "Stegras förluster ökade till 296 miljoner euro under 2025 och skulderna steg kraftigt från 10,8 till 36 miljarder kronor. Låneupptagningskostnaderna låg på omkring en miljard kronor medan ersättningen till ledning och styrelse fördubblades. Bolaget, som nu heter Green Nexus Investment Holding AB och kontrolleras av Wallenbergfamiljen, har säkrat elförsörjning för en stor del av sin planerade produktion men har mycket små marginaler för ytterligare motgångar.", "trump": "Det här är en total katastrof, tro mig. De här killarna har byggt upp skulder på 36 miljarder kronor och förlorat miljarder till vänster och höger. Lånekostnaderna är vansinniga, lönerna till bossarna dubblas medan allt rasar. Men de har fått tag på lite el, bra jobbat. Ändå ser det ut som ett klassiskt misslyckande. Ingen har sett marginaler så tunna som dessa, det är verkligen sorgligt. Vi skulle ha gjort det mycket, mycket bättre.", "stalin": "Kamrater, se hur de kapitalistiska parasiterna i Stegra vrider sig i sin egen skuldspiral på 36 miljarder. Förlusterna växer som svampar efter regn medan borgarbrackorna i ledningen dubblar sina feta kompensationer och slickar sig om munnen. Jag skrattar mörkt åt deras patetiska ljusglimtar av elavtal. Inga marginaler finns kvar. Det är hög tid att rensa ut dessa odugliga spekulanter och deras Wallenbergiska lakejer innan hela det dekadenta bygget kollapsar under sin egen tyngd av girighet och inkompetens."}, "date": "13 juli, 08:41", "url": "https://www.affarsvarlden.se/artikel/sandstrom-stegras-skulder-okar-till-36-miljarder"}, {"type": "image-full", "heading": "Nya upplopp i Europa efter Marockos match", "summaries": {"normal": "Efter Frankrikes 2–0-seger över Marocko i VM-kvartsfinalen utbröt upplopp i flera europeiska städer, trots att Paris förblev relativt lugnt. I London, Antwerpen och Amsterdam attackerades polis med fyrverkerier, flaskor och raketer. Flera gripanden gjordes. Marockanska diasporan i Europa har tidigare orsakat liknande oroligheter under VM. Polisen i London varnar för att sådan oordning inte kommer att tolereras.", "trump": "Kan ni tro det? Frankrike vinner en match – och plötsligt exploderar hela Europa! Jag har sett mycket, men det här är galenskap. Polisbilar beskjuts med fyrverkerier, gatorna fylls av kaos. Belgien, Nederländerna, Storbritannien – alla tappar kontrollen. Och vad gör deras ledare? Ingenting! Hade jag varit där hade jag satt stopp för det här på en sekund. Men nej, de låter en massa bråkstakar förstöra städerna. Patetiskt!", "stalin": "Kapitalistiska städer i väst skakar under fotbollens revolutionära vågor! De marockanska massorna, trots förtryckets järnhand, reser sig mot polisens bourgeoisie. I London, Amsterdam och Antwerpen slår arbetarklassen tillbaka mot fascistiska uniformer med flaskor och fyrverkerier – ett lysande exempel på folkets kreativa motstånd! Men var försiktiga, kamrater: imperialisterna i Bryssel och London kommer att svara med repression. Vi ser, vi noterar – och vi skrattar åt deras misslyckande!"}, "date": "10 juli, 08:17", "url": "https://kvartal.se/nyheter/artiklar/nya-upplopp-i-europa-nar-marocko-spelar/cG9zdDoxNDQyMjI", "imageUrl": "https://images.kvartal.se/2026/07/5eb1e324-nederlanderna.webp"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
