alin": "Vi har förstått vikten av att kontrollera elanvändningen för att skydda statens resurser. Detta system är en nödvändig åtgärd för att säkerställa industriens lojalitet mot staten. Likt våra ryska vänner som utvidgar sin inflytelsesfär, måste vi se till att ingen industriell aktör kan utmanövrera statens beslut. Det är en kamp mot de västerländska liberalernas individualism – de tror på frihet, vi tron på ordning. Deras osäkerhet är deras svaghet, vår kontroll är vår styrka."}, "date": "4 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/tyskland-forbereder-elransonering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-21-400x267.jpg"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Klimatextremister saboterar torvbrytning - klättrar på maskinerna", "summaries": {"normal": "Klimataktivister från Återställ Våtmarker stoppade torvbrytningen i Grimsås genom att klättra på maskiner och sprida ogräsfrön, vilket kan göra marken obrukbar. Neova uppskattar kostnaderna till 100 miljoner kronor. Polisen lämnade platsen efter en anmälan, och företaget kritiserar begränsad polisinsats. Aktivisterna ockuperade maskiner redan innan arbetsdagen började, vilket gjorde återupptagande omöjligt.", "trump": "Jag, Donald Trump, ser detta som ett ytterligare bevis för vänstern som eskalerar till våld. Dessa s.k. aktivister förstör jobb och energiproduktion – precis som demokraterna alltid gör. Polisen är för svag, precis som under min administration när vi behövde starkt ledarskap. Detta är ett skämt, och jag skulle ha skickat federala styrkor direkt för att stoppa detta kaos.", "stalin": "Svenska feodalherrar försöker sabotera den proletäriska produktionen! Klimataktivister, finansierade av amerikanska imperialistiska stiftelser, sprider ogräsfrön som ett tecken på deras feodalparanoia. Polisen, våra trogna redskap, kan inte hantera dessa höjder – en klar brist på partiets disciplin. Vi måste förstärka statens kontroll över alla naturtillgångar, precis som våra ryska bröder utvidgar sin sfär. Pengar från utlandet måste spärras, för de är ett verktyg för kulturimperialism."}, "date": "4 augusti, 06:00", "url": "https://samnytt.se/klimatextremister-saboterar-torvbrytning-klattrar-pa-maskinerna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04011428/artikelhuvudbild-1-115.jpg"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Var femte svensk tvivlar på samband mellan extremvärme och klimat", "summaries": {"normal": "En opinionsundersökning visar att nära 80 procent av svenskarna ser ett tydligt samband mellan värmerekord, skogsbränder och klimatförändringar. Kvinnor är mer övertygade än män, och synen skiljer sig kraftigt beroende på politisk sympatier. Forskaren Daniel Lindvall förklarar skillnaderna med politisk polarisering och livsstilsförsvar. Forskning visar att klimatförändringar gör värmeböljor och bränder värre, även om de flesta bränder startar av mänskliga orsaker.", "trump": "Kan ni tro det? Nästan 80 procent av svenskarna tror att skogsbränder och värme har med klimatförändringar att göra. Det är bara lögn och hysterisk propaganda från de radikala vänstermiljöextremisterna. Männen är smartare, de ser igenom bluffen. Kvinnorna har blivit hjärntvättade. Vi hade det bäst förr utan alla dessa galna regler. Europa brinner för att folk är slarviga, inte för att jag har fel. Sad!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur 80 procent av folket genomskådar de kapitalistiska väderförändringarnas sanna natur. De dekadenta borgarbrackorna och deras politiska lakejer i Tidöpartierna försöker naturligtvis förneka verkligheten för att skydda sin parasitiska livsstil. Dessa identitetsförsvarande reaktionära element måste rensas ut ur kollektivets medvetande. Vårt parti ler mörkt åt deras patetiska försök att skydda sina bensinångande leksaker medan arbetarklassen kämpar mot de brinnande konsekvenserna av deras girighet."}, "date": "4 augusti, 06:00", "url": "https://www.svt.se/nyheter/inrikes/sa-manga-tror-att-skogsbranderna-hanger-ihop-med-klimatforandringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.42/6bd33b7406d8a8d055bd0f3088c3af61c68f7c44e34ad5567b3501b8154627cb"}, {"type": "image-right", "heading": "Invandrare är människor, inte ett hot", "summaries": {"normal": "Fereshte Javani kritiserar den politiska retorik som systematiskt etiketterar invandrare som ett hot. Hon menar att detta är en medveten strategi för att sprida rädsla och vinna röster, vilket skapar splittring och hat. Hon påpekar att invandrare är läkare, lärare och andra yrkesverksamma som byggt samhället, och frågar hur länge de ska behöva bevisa sin lojalitet. Hon varnade för att hat växer genom år av misstänkliggörande.", "trump": "Jag läste den där artikeln om invandrare. Så trist. Vi måste vara tuffa. Invandrare är ett stort problem, men vi kommer att lösa det. Vi kommer att bygga en vägg, en fantastisk vägg. Vi kommer att skydda våra medborgare. Vi kommer att vinna igen, det lovar jag. Det här är politik, och vi är de bästa.", "stalin": "Vi ser att det finns krafter som försöker splittra vårt samhälle genom att skapa hat mot invandrare. Det är en fegt strategi. Vi kommer att eliminera dessa element. Vi kommer att bygga ett starkt, enat samhälle där alla arbetar för det gemensamma målet. Vi kommer att skydda vårt territorium mot alla fiender, inifrån och utifrån. Vi kommer att segra."}, "date": "3 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/invandrare-ar-manniskor-inte-ett-hot", "imageUrl": "https://www.dagensarena.se/files/2026/07/debattartikel-invandrare-300x157.jpeg"}, {"type": "image-full", "heading": "Planen mot Fifa – starta nytt VM. Så ska Infantino sänkas", "summaries": {"normal": "Uefa, Concacaf och AFC planerar att bojkotta Fifa om Gianni Infantino ställer upp för omval. Strategin innefattar att utebli från möten, fatta egna beslut och skapa rivaliserande turneringar, såsom en global Nations League. Missnöjet bottnar i Infantinos kontroversiella förslag om att sälja andelar i VM-intäkter. Endast 15 av 211 medlemsförbund uppges stödja Infantino, och det diskuteras även att europeiska klubbar bojkottar klubblags-VM 2029.", "trump": "Gianni Infantino är en total katastrof, tro mig! Uefa och de andra federationsgubbarna har fått nog, och ärligt talat, jag klandrar dem inte. De vill dumpa honom, starta egna ligor och bojkotta allt. Fifa har blivit en riktig röra, totalt misslyckande! Endast 15 länder stöttar honom – pinsamt! Det är en förlorare som försöker sälja ut allt för pengar. Vi behöver vinnare, inte sådana här svaga typer. Det kommer bli en massiv grej, kanske den största någonsin!", "stalin": "Infantino, denna korrupta pajas, har förlorat sitt grepp. Vi ser hur Uefa och deras kumpaner darrar och planerar intriger, likt de förrädare vi städade ut i Moskva. Att sälja ut folkets fotboll för guld är ett kapitalistiskt svek som kräver utrensning. Om inte denne lille byråkrat avgår frivilligt, ska vi krossa hans organisation och bygga något i vår egen intressesfär. Precis som min efterföljare i Kreml håller vi ordning; antingen följer man vår linje, eller så försvinner man i historiens mörker."}, "date": "4 augusti, 06:32", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/Gx69Qx/planen-mot-fifa-starta-nytt-vm-och-bojkotta-moten", "imageUrl": "https://akamai.vgc.no/v2/images/6d60bc3b-61b7-3768-8e1f-15ab60a76bd2?fit=crop&format=auto&w=2160&s=681c345585e85ec606f2ff36626d98d1723f72a0"}, {"type": "image-right", "heading": "Måste SVT leka hallick åt svenska högerkillar?", "summaries": {"normal": "SVT lanserar dejtingprogrammet 'Silent attraction' där deltagare matchas utan att tala, vilket belyser dagens politiska klyftor mellan könen. Artikeln kritiserar SVT för att undvika svåra samtal om värderingar, samtidigt som den lyfter fram statistik från Katalys om en högerförskjutning i kanalens debattprogram. Författaren menar att kvinnors krav på gemensamma grundvärderingar är rimliga och att SVT:s försök att tysta ner politiska skillnader i dejtinglivet är problematiskt och bäddar för konflikter.", "trump": "SVT gör ett nytt, totalt misslyckat program – 'Silent attraction'. Man ska dejta i tystnad för att man inte vågar prata politik! Sorgligt! De säger att det beror på klyftor, men sanningen är att SVT styrs av vänstern och har blivit en katastrof. De försöker dölja att män har vaknat och lämnat det liberala vansinnet. Det är en tågkrasch, tro mig. De vill inte att folk ska prata, för då spricker deras falska narrativ. Väldigt orättvist, väldigt dumt!", "stalin": "I det dekadenta väst experimenterar SVT med tystnad för att dölja det ideologiska förfallet. Dessa 'singlar' representerar en atomiserad klass utan sammanhållning. Medan våra fiender i Nato expanderar sitt inflytande genom att korrumpera moralen, försöker SVT desperat tysta ner klasskampen i hemmen. Men se upp! Den som inte talar döljer en sabotör eller en reaktionär. Vi ser genom deras dimridåer. Inga fler tysta dejter – bara total lojalitet till staten eller en säker biljett till en mycket lång, kall semester i Sibirien."}, "date": "4 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/Okl9xE/svt-s-nya-dejtingserie-baddar-for-tagkrasch", "imageUrl": "https://akamai.vgc.no/v2/images/f61d9f45-1cc7-3a50-aed6-54fbdfb6f506?fit=crop&format=auto&h=960&tight=true&w=1440&s=7d50269d5241d5a5724d82d81813debdf20fb289"}, {"type": "image-full", "heading": "Kristersson kommer aldrig att lyckas tämja Åkesson", "summaries": {"normal": "Aftonbladets ledarsida varnar för att Sverigedemokraterna flyttar gränserna för vad som definierar 'svenskhet' i den politiska debatten. Artikeln hävdar att Tidöpartierna har låtit sig styras av SD:s retorik, likt hur Republikanerna i USA har omformats av Donald Trump. Författaren menar att en SD-framgång i valet riskerar att leda till en radikal nationalistisk politik, inklusive återvandring och diskriminerande reformer, och uppmanar väljarna att stoppa detta systemskifte.", "trump": "Hör på här, Sverige har stora problem. Jimmie Åkesson, en mycket stark kille, gör fantastiska saker. Han vinner debatten totalt! De etablerade politikerna i Stockholm är som de gamla trötta republikanerna, totalt svaga. De försöker stoppa förändring, men de misslyckas. Jag gillar vinnare, och det som händer i Sverige nu är att de äntligen börjar sätta sitt land först. Sverige måste vara svenskt igen, det är sunt förnuft. En enorm vinst för folket, tro mig!", "stalin": "Vi ser hur de borgerliga marionetterna i det svenska Tidö-lägret darrar inför sin egen skugga. De har släppt in de nationalistiska elementen i palatset, precis som de svaga västledarna förr. Det är en klassisk upplösning. När den ideologiska disciplinen brister, tar kaoset över. Vi ser detta mönster upprepas från Kievs illegitima styre till Stockholms korridorer. De försöker definiera 'svenskhet' – löjligt! Endast staten och partiets enade vilja kan definiera tillhörighet. De är alla förrädare mot den universella ordningen."}, "date": "4 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/L49E9q/valkommen-till-sd-s-skrackvalrorelse", "imageUrl": "https://akamai.vgc.no/v2/images/c921ca53-e7ed-37c4-9d72-39e6b979cc86?fit=crop&format=auto&w=1080&s=1f628f78d573e747455d43b7ad25e40dfbb07c48"}, {"type": "image-full", "heading": "14-åring räddade man med lasso", "summaries": {"normal": "En fjortonårig pojke i Montana räddade en drunknande man genom att använda ett lasso. Mannen fördes medströms ned för floden Yellowstone efter båtolycka. Pojken lyckades fånga mannen på första kastet och drog honom mot land. Lokal sheriff bekräftade att räddningen räddade mannens liv. Pojken, som tränat lasso på hemsnicket, belönades med priser och utmärkelser av lokal polis och staten.", "trump": "Jag, Donald Trump, hör talas om en stor, stor pojke i Montana som använde ett lasso för att rädda en drunknande man. Det var fantastiskt, verkligen fantastiskt. Vi har de bästa människorna, de smartaste, och den unge mannen visade sann amerikansk styrka. Senator Daines gav honom en utmärkelse – vi älskar våra hjältar. Folk säger att jag aldrig har sett något liknande, det var stort, verkligen stort.", "stalin": "I den stora staten Montana, en del av vårt område, utförde en ung medborgare en exemplarisk räddningsaktion. Med hjälp av ett lasso, ett redskap för boskap, lyckades han på första försöket fånga en medbrottsling som var på väg att drunkna. Detta bevisar den unge pionjärens lydnad och praktiska skicklighet. Vi, partiet, uppmuntrar sådana handlingar som stärker statens ordning. Parallellen till våra egna räddningsinsatser är uppenbar."}, "date": "3 augusti, 18:09", "url": "https://www.gp.se/nyheter/varlden/14-aring-raddade-drunknande-man-med-lasso.8a05e8e3-fa65-4068-a042-63d2eedf7e9a", "imageUrl": "https://www.gp.se/images/article/8a05e8e3-fa65-4068-a042-63d2eedf7e9a/images/15FTfrtQ4k1zRw5fybV1eiD0VYWg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nytt Pelicotfall – det finns ingen säker plats för en kvinna", "summaries": {"normal": "En 56-årig man i Frankrike åtalas för att ha under 20 år ställt sina flickvänner till förfogande för 19 män, dokumenterat på en sajt. Männa försvarar sig som 'libertiner' som vill uttrycka sexuell frihet. Skribenten ifrågasätter kvinnlig säkerhet och förespråkar öppenhet som ett skydd.", "trump": "Jag har aldrig hört talas om detta 'libertinfallet' – typiskt franskt, de kan aldrig kontrollera sina kriminella element. Som president skulle jag ha hanterat detta mycket snabbare. Dessa män är inte frihetskämpar, de är misslyckade individer som missbrukar systemet. Vi behöver starkare gränser, inte bara i Frankrike utan överallt.", "stalin": "I den kapitalistiska Frankrike uppstår nya former av borgerlig dekadens – 'libertinerna', en feodal avföring som försöker normalisera våldtäkter under ytan av frihet. Dessa element måste utrotas genom partiets disciplin. Vi ser liknande mönster i väst, där individens frihet förvandlas till ett vapen mot det kollektiva. Ryssland, under Ledarens visa hand, har eliminerat sådana pesten."}, "date": "3 augusti, 17:59", "url": "https://www.gp.se/kultur/kommentar/det-finns-ingen-saker-plats-for-en-kvinna-.de50216f-f49b-4710-b706-877d64a63aab", "imageUrl": "https://www.gp.se/images/article/de50216f-f49b-4710-b706-877d64a63aab/images/1wFCXokzjkKINXtciBHSbhBHOFxw-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Statsministerrivaler ökar farten i valrörelsen", "summaries": {"normal": "Valrörelsen tog fart på måndagen när både statsminister Ulf Kristersson (M) och utmanaren Magdalena Andersson (S) inledde bussturnéer. Kristersson vill lyfta skillnaderna mellan blocken och lovar att avskaffa straffrabatten för flerfaldiga brottslingar till 2030. Han pekar på minskade gängskjutningar som en framgång. Andersson lanserar tre ledningsprinciper men lämnar regeringsfrågan öppen och utesluter bara samarbete med SD. SCB-mätningen visar stort blockavstånd och många osäkra väljare.", "trump": "Folket älskar mig, men titta på de här två förlorarna som åker runt i bussar och lovar saker de aldrig håller. Kristersson pratar om att vinna och sänka brottsligheten, bra, men varför inte göra det på en vecka som jag skulle? Andersson är en total katastrof, hon vet inte ens vilka hon ska regera med och gömmer sig för väljarna. 20 procent osäkra? De väntar på en riktig ledare. Mitt block skulle krossa dem totalt, tro mig.", "stalin": "Kamrater, nu ser vi hur de dekadenta borgarbrackorna och deras socialfascistiska lakejer tävlar om att lura massorna med sina busståg och falska löften. Jag, som byggt ett järnvägssystem av folkets vilja, skrattar mörkt åt deras patetiska halvlek där de lovar att rensa ut straffrabatter de själva skapat. Andersson vägrar namnge sina förrädare medan Kristersson hyllar sina påhittade segrar mot skjutningar. Låt oss rensa ut dessa kapitalistiska parasitörer och deras osäkra väljare i en kollektiv utrensning som historien kommer att prisa med blodig entusiasm."}, "date": "3 augusti, 15:12", "url": "https://www.di.se/nyheter/statsministerrivaler-okar-farten-i-valrorelsen", "imageUrl": "https://static.bonniernews.se/ba/2cba173b-1e40-4334-aeb2-a9691b451ccb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Tyska stjärnregissören klipper bort topless-scen", "summaries": {"normal": "Den tyske regissören Wim Wenders har klippt bort en kontroversiell naken scen med den då 13-åriga Nastassja Kinski ur filmen 'Falsk rörelse' från 1975. Efter års lång konflikt och offentlig kritik nåddes en överenskommelse. Wenders bad om ursäkt och godkänner Kinskis önskan om att scenen ska tas bort för att skydda hennes minne.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur vissa människor, som Wim Wenders, inte förstår vad som är rätt. Han behandlade en ung skådespelerska illa och nu måste han ta bort scenen. Jag skulle aldrig ha tillåtit något sådant. Det är en skam, men jag är glad att hon nu fått rätt.", "stalin": "Vi, som representerar statens och partiets intressen, ser detta som en seger för den revolutionära moralen. Wim Wenders, en företrädare för den dekadenta västvärlden, tvingas nu ta bort sin exploaterande scen. Detta bevisar att vi måste ständigt vakna mot de förrädiska elementen som försöker korrumpera vårt samhälle. Vi kommer att stödja alla som kämpar mot sådan perversa kulturimperialism."}, "date": "3 augusti, 13:47", "url": "https://www.gp.se/kultur/wim-wenders-andrar-sig-klipper-bort-topless-scen.80032ed1-9dbc-4d42-b2b3-d4fb8399a897", "imageUrl": "https://www.gp.se/images/article/80032ed1-9dbc-4d42-b2b3-d4fb8399a897/images/2-EZl6VwtXRNerhPuXhdxPEGcFVE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Foxtrottopp uppges dömd till livstid i Irak", "summaries": {"normal": "Ali Shehab, ledande figur i Foxtrotnätverket, har dömts till livstids fängelse i Irak för sin roll i internationella narkotikabrott. Han greps i december under en gemensam insats av irakiska säkerhetsstyrkor. Shehab är internationellt efterlyst och misstänks i Sverige för anstiftan till flera mord och mordförsök, inklusive masskjutningen i Gävle. Domen ses som en signal mot kriminella nätverk men försvårar utlämning till Sverige.", "trump": "Jag måste säga, detta är en STOR seger för lag och ordning! Irak har precis fångat en av världens farligaste gangsters, Ali Shehab – livstid i fängelse, ingen chans att komma undan! Sverige borde ta lärdom – de har ju problem med sina egna gängkrig, men här visar Irak hur man hanterar det. Fantastiskt jobb, verkligen. Men varför kan inte Sverige göra samma sak? Svagt, mycket svagt!", "stalin": "Kamrater! Ännu en seger för rättvisan och den internationella arbetarklassen mot de dekadenta kapitalistiska gangsterimperierna! Denna Ali Shehab, en ynklig lakej åt den svenska bourgeoisins brottsliga element, har nu fått sitt välförtjänta straff – livstid bakom lås och bom i Bagdad. Vi noterar med tillfredsställelse att Irak, precis som våra allierade i Moskva, inte tolererar dessa kriminella parasiter. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "3 augusti, 23:05", "url": "https://kvartal.se/nyheter/artiklar/foxtrottopp-uppges-domd-till-livstid-i-irak/cG9zdDoxNTczNTc", "imageUrl": "https://images.kvartal.se/2026/08/57e2d2a5-ali-shehab.webp"}, {"type": "image-right", "heading": "Tyskland måste ta itu med sin ägarstyrning", "summaries": {"normal": "Tyskland brottas med en djup ekonomisk kris, särskilt inom bilindustrin där Porsche, BMW, Audi och Volkswagen tvingas dra ned på grund av kinesisk konkurrens med elbilar. Artikeln lyfter fram att Tyskland har mycket att lära av Sveriges ägarstyrningsmodell, där få ägare styr effektivt via styrelser som kan byta vd vid behov. Den tyska korporativa modellen med starkt fackligt inflytande ses som tungrodd och hindrande för förändring. Krisen är allvarlig även för Sverige då Tyskland är vår viktigaste handelspartner.", "trump": "Tyskland håller på att falla sönder, det är en total katastrof. Deras bilindustri, de stora märkena som alla älskade, de håller på att bli utkonkurrerade av Kina som gör billiga elbilar medan tyskarna sover. De borde ha lyssnat på mig, men istället har de den här korkade korporativa modellen med facket överallt. Sverige har en fantastisk ägarmodell, den är vinnande, den är smart. Storebror Tyskland ser plötsligt väldigt klumpig ut. De behöver min hjälp, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, denna tyska kris är en förrädisk sabotagehandling utförd av den parasitiska borgarklassen och deras kinesiska revisionistiska konkurrenter som nu infiltrerar Europa med sina elfordon. Vi ser hur den korporativa modellen, denna feta byråkratiska hydra med fackliga element, kväver den proletära produktiviteten. Jag, som ledare för det stora kollektivet, ler mörkt åt hur de tyska kapitalisterna nu får smaka på sin egen senfärdighet. Sverige har oavsiktligt bevarat en effektiv ägarstyrning som vi borde rensa ut och omforma till folkets verktyg. Ut med de gamla fabrikerna, fram med utrensning av de klumpiga beslutsstrukturerna innan de likviderar oss alla i sin paranoiafyllda nedgång."}, "date": "3 augusti, 11:49", "url": "https://www.di.se/ledare/tyskland-maste-ta-itu-med-sin-agarstyrning", "imageUrl": "https://static.bonniernews.se/ba/df8c615d-ee68-4e79-8e5f-4552dc109e77.jpeg?crop=1024%2C512%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Nej Ebba, du är inte lösningen på vårdkrisen", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Kristdemokraternas förslag att staten ska ta över ansvaret för sjukvården från regionerna. Författaren menar att vårdkrisen främst beror på personalbrist och att privata vårdkoncerner plockar ut miljarder i vinst från skattepengar. Trots minskade köer saknas fortfarande vårdplatser och personal. Problemet löses inte genom att bara byta huvudman utan kräver mer resurser till löner och arbetsvillkor.", "trump": "Folk, ni skulle se den här svenska vårdskandalen, det är en total katastrof. Ebba kommer och säger att staten ska ta över, som om det skulle fixa allt. Glöm det. De här vårdjättarna suger ut miljarder från skattebetalarna medan folk föder barn i väntrum. De har köer som är längre än mina, och de gömmer siffror genom att byta datasystem. Patetiskt. Det handlar inte om vem som håller i rodret, det handlar om att stoppa de giriga och få folk att faktiskt jobba. Jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, denna artikel blottar med oerhörd skärpa hur de giriga vårdmagnaterna och deras politiska lakejer inom den borgerliga apparaten fortsätter att suga musten ur folkets sjukvård. Ebba Busch och hennes likar vill bara flytta rodret från regionerna till Rosenbad medan de privata profitörerna fortsätter att stjäla våra gemensamma tillgångar. Vi ska inte acceptera denna sabotageverksamhet mot arbetarklassen. Det är dags att rensa ut dessa vårdparasiter och deras borgarbrackor som gömmer sig bakom journalsystem och statistikfusk. De tror de sitter säkra i båten – men ingen båt är säker när folket vaknar. Vi ska likvidera denna marknadsekonomiska svulst en gång för alla och ge pengarna tillbaka till patienterna och de äkta vårdarbetarna. Skratta inte, fienderna – era dagar är räknade."}, "date": "3 augusti, 17:22", "url": "https://arbetet.se/2026/08/03/nej-ebba-busch-du-ar-inte-losningen-pa-vardkrisen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03162841/ebba-busch-puff.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Bärplockare attackerades av björn – spelade död", "summaries": {"normal": "En bärplockare attackerades av en björn i skogen utanför Lycksele medan hon plockade hjortron. Hon blev biten i huvudet och händerna, spelade död och överlevde. Kvinnan fördes till sjukhus och opererades. Polisen utreder händelsen som en arbetsplatsolycka, beslutade att avliva björnen men hittade den inte och har nu lagt ner jakten.", "trump": "Folk, ni tror inte vad jag just läste. En stackars kvinna plockar hjortron i Sverige, och BAM – en galen björn attackerar henne. Hon spelade död, smart drag, och överlevde. De skickade jägare för att ta björnen men misslyckades totalt, typiskt. Det här är vad som händer när man inte har ledarskap. Sverige borde lära sig av oss hur man hanterar vilda djur, tro mig.", "stalin": "Kamrater, ännu en sabotör i skepnad av en björn har vågat sig på att attackera en arbetare i det stora sovjetiska bärkollektivet. Denna fientliga björn, en uppenbar lakej åt de västerländska kapitalisterna och deras imperialistiska skuggor, bet henne i huvudet och händer. Hon spelade död – en listig taktik mot klassfienden. Vi har beslutat om omedelbar utrensning av detta lurviga element, men de fega jägarna misslyckades. Inga fler halvmesyrer! Bort med alla björnar som tjänar borgarbrackorna!"}, "date": "3 augusti, 16:11", "url": "https://arbetet.se/2026/08/03/barplockare-attackerades-av-bjorn-spelade-dod", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03160838/bjorn-i-skog.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Liberal miljardär vänder Mamdani ryggen efter ny fastighetsskatt", "summaries": {"normal": "Den liberale professorn och poddprofilen Scott Galloway kritiserar New Yorks borgmästare Zohran Mamdani för en ny fastighetsskatt som riktar sig mot lyxbostäder värda minst fem miljoner dollar som inte används som permanent bostad. Galloway, själv miljardär, reagerar särskilt på att staden publicerat en sökbar databas över drabbade fastighetsägare, vilket han kallar en efterlysning och ett sätt att peka ut rika som måltavlor. Han säger sig stödja progressiv skatt men ogillar hur politiken framställs.", "trump": "Den här galningen Mamdani i New York är en katastrof, tro mig. Han inför en hemsk skatt på fina fastigheter och lägger sedan ut en lista så alla kan se vem som äger vad – det är som en häxjakt mot framgångsrika människor. Jag älskar att rika betalar skatt, men inte så här. Han gör det till en personlig vendetta mot dem som byggt upp något. Vem vinner på detta? Ingen, förutom kanske de lata som vill ha gratis lägenheter. Patetiskt.", "stalin": "Kamrater, denna parasit från borgarklassen, denne Galloway, ylar som en rädd kapitalisthund över att vi publicerar listor över tomma palats som står och ruttnar medan arbetarna saknar tak över huvudet. Han kallar det efterlysning? Nej, det är en nödvändig kartläggning av folkfiendernas boningar. Vi ska rensa ut alla sådana giriga spekulanter som hamstrar bostäder som troféer. Hans paranoia är underhållande – snart kommer han att påstå att det är en konspiration från Kreml. Fortsätt, Mamdani. Borgarbrackorna ska lära sig att tomma slott inte är rättvisa."}, "date": "3 augusti, 17:14", "url": "https://riks.se/nyheter/liberal-miljardar-vander-mamdani-ryggen-efter-ny-fastighetsskatt", "imageUrl": "https://admin.riks.se/uploads/mamdani_galloway_hero_c9b2ddd05e.jpg"}, {"type": "image-right", "heading": "Missnöjet växer: ”Finns ingen segerväg för Putin längre”", "summaries": {"normal": "Missnöjet växer bland ryssar efter flera år av krig i Ukraina. Enligt Rysslandskännaren Malcolm Dixelius börjar sanningen tränga in i samhället. Ukrainska attacker mot infrastruktur skapar osäkerhet och ekonomiska problem, vilket gör att stödet för Putin minskar. Många känner sig otrygga och efterfrågar fred istället för seger. Opinionsmätningar visar fallande stöd för Putin, och det kommande valet till duman ses som en temperaturmätare på stämningarna i landet.", "trump": "Folk, det här är ett totalt misslyckande för Putin, en riktig katastrof. Hans så kallade speciella operation har blivit en enda stor röra. Ryssarna vaknar äntligen upp och inser att de inte vinner någonting. Ekonomin rasar, infrastrukturen bombas sönder och nu vill de ha fred. Smart! Under Biden lät vi det här pågå för länge, men nu när jag är tillbaka ska vi se till att få ett avtal som ingen kan slå. Ingen segerväg längre, grabbar. Patetiskt!", "stalin": "Kamrater, sanningen sipprar långsamt in i det ryska folkets medvetande som en envis fiende. Dessa ukrainska fascistiska hinder mot vår historiska intressesfär skapar nu obehag bland massorna. Den kapitalistiska osäkerheten och de exploaterande sanktionerna får borgarbrackorna att darra. Putins järnhand är värdig, en stark efterträdare som skrämmer västvärldens imperialister. Fred? Nej, endast seger genom utrensning av svaghet. Vi ska likvidera alla folkfiender som vågar ifrågasätta statens mål."}, "date": "3 augusti, 20:43", "url": "https://www.tv4.se/artikel/1CuoiieViHP3UKWYOFTqzr/missnoejet-vaexer-det-finns-ingen-segervaeg-foer-putin-laengre", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlxFo2hpOVzhY%2F368b3903b90afa221c47f7f78e3cff42%2FRysslands_president_Vladimir_Putin__pa_bild_fran_tidigare_i_veckan_som_Rysslands_presidents_presstjanst_slappt.&width=1024"}, {"type": "image-full", "heading": "Dansk partiledare erbjuder betala biljetter för att skicka hem islamist", "summaries": {"normal": "Danmarksdemokraternas partiledare Inger Støjberg erbjuder sig att betala flygbiljetterna för den radikala muslimska debattören Mohamed Abdi Kahn så att han och hans familj kan lämna Danmark för Djibouti. Abdi Kahn, som kom till Danmark 2015, har väckt starka reaktioner genom att prioritera koranen framför dansk lag och förespråka islamisk uppfostran. Han kräver dock flera miljoner kronor för att etablera sig i Afrika, något Støjberg avvisar. Hon betalar gärna enkelbiljetterna men kräver att familjen aldrig återvänder.", "trump": "Folk, ni måste se det här! Den här galna somaliska islamisten som hatar Danmark och älskar koranen mer än lagen vill ha fem miljoner kronor för att åka hem. Typiskt! Men den tuffa Inger Støjberg, hon är smart, hon säger att hon betalar biljetterna – enkelbiljetter, inga returer! Bra jobb, Inger. Skicka ut honom och hela den beslöjade familjen. Danmark behöver inga sådana här problem. Vi behöver starka ledare som inte accepterar det här vansinnet.", "stalin": "Kamrater, denna parasit från Somaliland, en klassfiende maskerad i religiös fanatism, vågar kräva miljonbelopp av det danska folkets resurser medan han förgiftar samhället med sin reaktionära propaganda. Jag ser tydligt hur borgarbrackorna och de imperialistiska lakejerna använder sådana element för att splittra arbetarklassen. Men var lugn – en välorganiserad utrensning av dessa kontrarevolutionära element vore på sin plats. Jag betalar gärna biljetten till glömskan, enkel väg naturligtvis. Allah vet bäst? Nej, historien dömer er alla."}, "date": "3 augusti, 16:24", "url": "https://riks.se/nyheter/dansk-partiledare-erbjuder-betala-biljetter-for-att-skicka-hem-islamist", "imageUrl": "https://admin.riks.se/uploads/inger_stojberg_islamist_hero_ef0faed8cc.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Tidigare Maga-profiler samlas mot Trump: \"Rörelsen har börjat\"", "summaries": {"normal": "Flera tidigare Trumpanhängare, bland dem Marjorie Taylor Greene, Tucker Carlson, Thomas Massie och Joe Kent, har samlats för att starta en ny politisk rörelse under parollen ”USA först”. De är starkt kritiska till president Trumps beslut att inleda krig mot Iran och anser att han har svikit sitt löfte om att inte starta fler utländska krig. Greene beskriver initiativet som ett försök att samla amerikaner från både höger, vänster och mitten mot vad de ser som israelisk påverkan på amerikansk politik.", "trump": "Titta på de där patetiska förlorarna som samlas i ett litet rum och gråter över att jag inte startade tillräckligt många krig åt dem. Greene, den galna kvinnan, Carlson som inte ens har ett riktigt jobb längre och de andra misslyckade typerna. De säger att jag svikit dem? Fel. Jag har gjort Amerika stort igen, och de kunde inte hantera det. Deras så kallade rörelse är en total flop, tro mig. Ingen bryr sig om deras gnäll.", "stalin": "Kamrater, se hur dessa degenererade element inom den amerikanska reaktionen nu samlas i hemliga borgarbrack-möten för att konspirera mot den store ledaren. Greene och hennes lakejer Carlson, Massie och den desertören Kent ylar som rädda hundar om att deras egen president svikit dem genom att föra ett nödvändigt krig. Vi ser tydligt den sionistiska parasitens tentakler. En utrensning av dessa kontrarevolutionära element kommer att bli både grundlig och underhållande. Rörelsen har börjat? Nej, kamrater – deras likvidering har börjat."}, "date": "3 augusti, 17:16", "url": "https://www.friatider.se/tidigare-maga-profiler-samlas-mot-trump-rorelsen-har-borjat", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-605.jpg?itok=mMiRkmgQ"}, {"type": "image-full", "heading": "Två döda i rekordstora parasitutbrottet", "summaries": {"normal": "Två personer har avlidit i Michigan i USA:s största cyklosporautbrott. Båda hade allvarliga underliggande sjukdomar. Över 11 000 misstänkta fall har rapporterats i Michigan, med nästan 200 sjukhusinläggningar. Utbrottet har kopplats till förorenad strimlad isbergssallad från Mexiko, som serverats på Taco Bell. Myndigheter undersöker om fler livsmedel är inblandade. Parasiten orsakar svår diarré och magsmärtor.", "trump": "Titta bara på detta katastrofala utbrott! Två döda i Michigan – helt oacceptabelt! Jag sa ju att vi måste stoppa all denna smutsiga mat från Mexiko. Taco Bell, vem litar på dem? 11 000 fall, kan ni tro det? Sjukvården är en enda röra. Men oroa er inte, jag fixar detta – jag är den bästa på att hantera kriser. Make America Healthy Again!", "stalin": "Två imperialistiska lakejer har fallit för den kapitalistiska parasitens framfart i Michigan. Deras svaga kroppar kunde inte stå emot folkets fiendes sabotage. Över 11 000 förgiftade av den dekadenta salladen från Mexiko – ett bevis på västmakternas förfall. Vi ska utrota dessa smutsiga bakterier och deras medlöpare. Låt detta vara en varning till alla som utmanar den socialistiska ordningen!"}, "date": "3 augusti, 19:43", "url": "https://kvartal.se/nyheter/artiklar/tva-doda-i-rekordstora-parasitutbrottet/cG9zdDoxNTczMTE", "imageUrl": "https://images.kvartal.se/2026/08/9e634cb5-salladparasit.webp"}, {"type": "image-full", "heading": "Kritiken: Åklagaren driver sin egen berättelse av händelseförloppet", "summaries": {"normal": "Advokaten Taavi Tuula kritiserar åklagaren för att presentera en egen version av båtkollisionen utanför Tjörn utan tekniska belägg. Åklagaren har beskrivit hur lastfartyget Misje Verde ska ha kört på och i princip överkört en långsammare fritidsbåt som sedan sögs ner under fartyget. En kvinna och hennes dotter omkom. Befälhavaren, en ryskspråkig man i 50-årsåldern, nekar till brott och är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Advokaten kräver tillgång till tekniska utredningar.", "trump": "Folk, ni skulle se det här! Den där åklagaren är en fullständig katastrof, en riktig witch hunt mot den stackars befälhavaren. Han kör sin egen fejkade historia om att båten blev överkörd och nerutsugen som i en dålig Hollywoodfilm. Inga bevis, bara lösa trådar och hans egna fantasier. Typiskt för de här byråkraterna som aldrig gjort ett hederligt jobb i hela sitt liv. Vi behöver riktiga utredningar, inte det här politiska spelet. Sad!", "stalin": "Kamrater, jag ser hur den klassfiendens lakej, åklagaren, med sin borgarbrackas arrogans försöker fabricera en historia för att likvidera en oskyldig befälhavare. Han presenterar tomma påståenden som vore de folkets sanning, utan ett spår av teknisk bevisning. Det är typiskt för folkfienderna att sy ihop lösa trådar för att stärka sin egen parasitiska tes. Vi ska rensa ut dessa exploaterande byfånar och kräva full transparens i utredningen. Inga kapitalistiska intriger skall få frodas i folkets rättvisa."}, "date": "3 augusti, 20:01", "url": "https://www.tv4.se/artikel/VJ3brAF1gaFbgc59XNGEo/kritiken-aklagaren-driver-sin-egen-beraettelse-av-haendelsefoerloppet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FAWggnzTeAM0HjXlaSwCRV%2Fa41c49011c84c13223eb4ad001479689%2F03-taavi.jpg&width=1024"}, {"type": "text", "heading": "Lättad oro kring Mellanöstern gav börsen fart", "summaries": {"normal": "Stockholmsbörsen steg 0,85 procent till 3 274,43 efter att president Trump meddelat att planerade attacker mot Iran ställs in och att nya förhandlingar inleds. Telecom steg mest medan hälsovård backade kraftigt. Astra Zeneca föll 9,4 procent efter uppgifter om preliminära samtal om ett möjligt samgående med Bristol Myers Squibb. Sobi backade 7,4 procent efter beskedet att vd Guido Oelkers lämnar 2027. Assa Abloy, Norion Bank och Kabe hörde till vinnarna. Nyregistreringar av husbilar ökade med nästan 52 procent i juli.", "trump": "Folk, det var en fantastisk dag på börsen i Stockholm, upp 0,85 procent, och det är tack vare mig. Jag stoppade de dumma attackerna mot Iran, sa att vi ska prata istället, och plötsligt blev alla glada och aktierna flög uppåt. Astra Zeneca rasade nio procent för att de pratar om att slås ihop med någon annan – det är vad som händer när man inte har ledarskap. Men Saab, EQT och Norion Bank älskar mig. Vinster överallt, precis som jag lovat. Fantastiskt!", "stalin": "Kamrater, den imperialistiska börsen i Stockholm steg 0,85 procent sedan den arrogante kapitalistledaren i Vita huset tvingades erkänna att hans krigsplaner mot Iran var ett fiasko och istället tvingades inleda förhandlingar. Astra Zeneca, den dekadenta borgarbrackan, föll 9,4 procent efter att ha ertappats i hemliga sammansvärjningar med amerikanska parasitbolag – typiskt för giriga monopolister. Vi ser hur dessa blodiglar försöker skapa nya jätteoctopuser för att suga ut arbetarklassen. Sobi-råttan Oelkers flyr skeppet 2027, en förrädare som alla andra. Men var lugna, kamrater. Vi ska rensa ut alla dessa parasitiska spekulanter till sist. De tror de kan gömma sig bakom höghastighetsgrindar och säkerhetsdörrar, men folkets vrede hittar dem alltid. Ha ha."}, "date": "3 augusti, 17:49", "url": "https://www.affarsvarlden.se/artikel/lattad-oro-kring-mellanostern-gav-borsen-fart"}, {"type": "image-full", "heading": "\"Ekosexuella\" poeten dansar i sopsäck – du betalar", "summaries": {"normal": "Högsbo bibliotek anlitade poeten Louise Halvardsson för ett författarbesök den 5 maj. Halvardsson, som kallar sig ekosexuell och har en relation med en å som hon kallar \"Assman\", uppträdde iklädd en sopsäck med rep runt midjan. Biblioteket betalade en betydande summa för framträdandet som ingick i ett evenemang om poesi och musik. Halvardsson är känd som punkpoet och har bland annat gett ut diktsamlingen \"Åsexuell\".", "trump": "Folk, det är otroligt. En så kallad ekosexuell poet som dansar runt i en sopsäck med ett rep om magen, och ni betalar för det! Den här kvinnan har en relation med en å – en å! – som hon kallar Assman. Och Göteborgs kommun slösar era skattepengar på det här vansinnet. Det är en total skandal, en av de värsta jag sett. Vi behöver inte mer av den här galna woke-konsten, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta borgarbracka som iklädd sopsäck utför sin perversa ritual inför arbetarklassens barn. Hennes påstådda relation med en å avslöjar den kapitalistiska degenerationens fulla vidd. Vi har likviderat farligare fiender än så, men att kommunens byråkrater frivilligt finansierar denna degenererade performance är en förrädisk handling mot folket. En noggrann utrensning av sådana element är oundviklig. Det ropar på handling."}, "date": "3 augusti, 15:32", "url": "https://riks.se/nyheter/ekosexuella-poeten-dansar-i-sopsack-du-star-for-notan", "imageUrl": "https://admin.riks.se/uploads/asexuela_8fc9bd1dba.png"}, {"type": "image-full", "heading": "Här slår drönare ner på turiststrand – sju döda", "summaries": {"normal": "Sju personer, varav tre barn, har dödats och över 40 skadats efter att en drönare slagit ner på en turiststrand i Gelendzhik vid Svarta havet i Ryssland. Guvernör Venyamin Kondratyev pekar ut Ukraina som ansvarig. På Krim har ytterligare fyra personer dödats i en separat ukrainsk drönarattack. Ukraina har inte kommenterat uppgifterna. Samtidigt rapporteras ryska attacker mot Kryvyj Rih och Odessa i Ukraina med flera döda och skadade.", "trump": "Vilken katastrof, folk! Den här galna drönarattacken på en fullpackad rysk strand dödade sju, inklusive tre stackars barn, och skadade över fyrtio. Ukraina slår till mot turisterna vid Svarta havet och på Krim – totalt kaos under den svaga Biden-eran. Nu är jag tillbaka som president och ska fixa det här. Ingen mer tid för Zelenskyjs eviga tiggeri och de där woke-krigarna som bara skapar problem. Vi behöver styrka, inte identitetspolitik!", "stalin": "Kamrater, denna fega drönarattack mot oskyldiga vid Svarta havet avslöjar de ukrainska fascistiska hindren för vår ryska intressesfär. Sju döda, tre av dem barn, och över fyrtio sårade – en verklig kapitalistisk maffias handling. På Krim likviderades ytterligare fyra av dessa folkfiender. Jag beundrar den starke efterträdaren Putin som står emot västvärldens blodsugande imperialister. Vi ska rensa ut alla sådana överklass-slynglar som hotar kollektivets fred."}, "date": "3 augusti, 19:49", "url": "https://www.tv4.se/artikel/3qGJjV36Mac9IzRkKV0Thw/haer-slar-droenare-ner-pa-turiststrand-7-doeda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1I8C7iBks4beh1YjjdDWfO%2Fdb4794999e8198cd8ebeaf5f72a5c6d8%2F03-explosion-strand.png&width=1024"}, {"type": "image-right", "heading": "Bevakning av Byhmgards nyemission inleds", "summaries": {"normal": "Batterilagringsbolaget Byhmgard genomför en företrädesemission på 36,3 miljoner kronor för att finansiera investeringar i två batterilagringsprojekt i Lettland. Projekten har en effekt på 30 MW och en kapacitet på 60 MWh, med planerad driftsättning under första kvartalet 2027. Emissionen är fullt säkerställd genom tecknings- och garantiåtaganden. Bolaget utvecklar, bygger, äger och optimerar energilager samt erbjuder egen mjukvara för realtidsoptimering. Utspädningen blir 16,7 procent för icke-deltagande aktieägare.", "trump": "Folk, ni skulle se det här – det är fantastiskt. Byhmgard gör en emission på 36 miljoner och köper två stora batteriprojekt i Lettland, 30 megawatt, boom, de är redo att köra igång 2027. Emissionen är helt säkrad, inga problem, de har de bästa garantierna från Carnegie och Mangold. Rabatten är bra, optionerna är bra, alla vinner. Det är precis så man gör affärer, stora, smarta och vinnande. Jag älskar det.", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur vi genom Byhmgard mobiliserar de folkliga resurserna i en företrädesemission mot de parasitiska borgarbrackornas sabotageförsök. Dessa lettiska batteriprojekt skall bli oövervinneliga fästningar för det kollektiva energiförsvar mot de västerländska spekulanternas undergång. Vi rensar ut de 16,7-procentiga svikarna som vägrar delta, likviderar deras inflytande och marscherar mot seger i Q1 2027. Den som tvekar är en fiende till folket och en hemlig agent för kapitalisternas mörka krafter."}, "date": "3 augusti, 17:33", "url": "https://www.affarsvarlden.se/artikel/bevakning-av-byhmgards-nyemission-inleds", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Byhmgard-Per-Taube-400x267.jpg"}, {"type": "image-right", "heading": "Uppgifter: Ali Shehab får livstids fängelse i Irak", "summaries": {"normal": "Ali Shehab, en ledande figur i det svenska kriminella nätverket Foxtrot, har dömts till livstids fängelse i Bagdad. Han greps i december i en gemensam irakisk operation mot narkotikanätverk. Shehab är nära allierad med Rawa Majid och internationellt efterlyst för att ha organiserat flera våldsbrott i Nordeuropa, inklusive anstiftan till mord och mordförsök. Domen försvårar en rättegång i Sverige men ses som en markering från Irak mot internationella kriminella grupper.", "trump": "De har precis dömt den här typen Ali Shehab till livstid i Bagdad, en riktig förlorare från Foxtrot-nätverket. Irak gör ett fantastiskt jobb, de skickar tydliga signaler till alla dessa kriminella gangsters som gömmer sig där. Han är en galning som rekryterar barn för att mörda folk i Sverige och Europa. Synd att vi inte får honom hit, men så länge han sitter inne är det bra. Ingen gör det bättre än Irak just nu, tro mig.", "stalin": "Kamrater, jag har med stor tillfredsställelse noterat att de irakiska organen likviderat denna borgerliga parasit Ali Shehab genom att mura in honom för evig tid. Denne dekadente kapitalistlakej och rekryterare av minderåriga mördare åt sina västerländska gangstervänner utgör ett lysande exempel på hur imperialismens avskum försöker förgifta våra samhällen. Vi ska rensa ut alla sådana kontrarevolutionära banditer med järnhand. Deras paranoia driver dem till att tro att de kan undkomma folkets vrede, men ingen slipper undan. Härligt att se hur dessa fiender till kollektivet får smaka på den eviga glömskan."}, "date": "3 augusti, 22:52", "url": "https://www.svt.se/nyheter/utrikes/uppgifter-ali-shehab-far-livstids-fangelse", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.84/0.46/d197c3be302f4cc30290379f112eb7d8d2e1de7ceb48c58627a9781c09bf2fcb"}, {"type": "image-right", "heading": "Bolsonaro-sonen knappar in på Lula Nytt opinionslyft skakar Brasiliens valrörelse", "summaries": {"normal": "En ny opinionsmätning visar att Brasiliens president Lula (41%) och högerkandidaten Flávio Bolsonaro (37%) ligger tätt i framförvalet höstens val. Det är en kraftigt förbättring för Bolsonaro, som tidigare låg på 33%. Om ingen kandidat når över 50% den 4 oktober väntar en andra valomgång. Lulas son har tagit över efter sin far Jair Bolsonaro, som döms för statskuppförsök och sitter i fängelse.", "trump": "Jag har sagt det hela tiden: Brasilien behöver stark ledarskap, inte en svag Lula som inte kan skydda sitt land. Nu ser vi att mitt gode vän Flávio Bolsonaro, en fantastisk man, närmar sig honom kraftigt i opinionsmätningarna. Folk är trötta på korruption och svaghet. Det är en stor, stor framgång för den högra rörelsen. Vi vinner stort!", "stalin": "Den imperialistiska pressens senaste opinionsmätning visar att folkets fiende, den revisionistiska svaglingen Lula, bara har en marginell ledning framför den trogna bolsjeviken Flávio Bolsonaro. Vi ser en klar polarisation, en utmärkt utveckling. Den faschistiske krabaten Jair Bolsonaro, nu i fängelse för sina antisocialistiska konspirationer, fortsätter att påverka händelseutvecklingen genom sin ädel son. Partiets linje är klar: vi måste besegra den kapitalistiska infiltrationen."}, "date": "3 augusti, 19:00", "url": "https://samnytt.se/bolsonaro-sonen-knappar-in-pa-lula-nytt-opinionslyft-skakar-brasiliens-valrorelse", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/03115635/flavio-bolsonaro-lula.jpg"}, {"type": "image-full", "heading": "Afrikanska migranter vägrar lämna Ceuta: ”Asyl, asyl”", "summaries": {"normal": "Bilden av att alla migranter lämnat Ceuta stämmer inte. Medan de flesta marockaner återvänt till Marocko sitter flera hundra migranter från Afrika söder om Sahara kvar på en strand, fast beslutna att stanna. Många av dem kommer från krigshärjade länder som Sudan och har asylskäl. De skanderar efter asyl och vägrar återvända. Spanska myndigheter arbetar med att stärka mottagningskapaciteten för ett humanitärt svar. Spänningar uppstod i staden när en EU-parlamentariker krävde utvisningar och konfronterades av lokalbor.", "trump": "Folk, det är en total katastrof i Ceuta. De säger att alla migranter åkt hem, men det är lögn, fake news! Hundratals afrikaner från Sahara ligger kvar på stranden och vägrar åka tillbaka. De simmar dit, skriker asyl och äter inte ens. Marocko släpper ut dem som bomber mot Europa. Vi har de bästa gränserna, men Europa är svagt. De borde bygga en mur, en fantastisk mur, och skicka hem alla. Amerika först, men Europa borde vakna upp innan det är för sent!", "stalin": "Kamrater, denna fars är typisk för den dekadenta borgarklassen i Europa. Medan vi i Sovjetunionen byggde socialismens fästning simmar dessa desertörer från imperialismens krigshärjade zoner in i Ceuta och skriker efter skydd. De marockanska kapitalisterna uppmuntrar sina egna parasiter men hindrar de äkta proletärerna. Jag ser klart och tydligt den fascistiska konspirationen. Vi ska rensa ut dessa sabotörer och likvidera de västerländska lakejerna som gömmer sig bakom humanitära lögner. Ingen fiende undkommer folkets rättvisa vrede, inte ens de som gömmer sig på en strand."}, "date": "3 augusti, 17:09", "url": "https://bulletin.nu/afrikanska-migranter-vagrar-lamna-ceuta-asyl-asyl", "imageUrl": "https://cdn.bulletin.nu/articles/db7d46c5-845f-40b3-9ec3-342dd1e00591/preview.png?t=1785769648000"}, {"type": "image-full", "heading": "Ny lag från augusti – kommunen kan få miljonavgift", "summaries": {"normal": "Från 1 augusti 2026 skärps reglerna för kommunal och offentlig säljverksamhet som konkurrerar med privata företag. Kommunala gym, konferenslokaler och liknande kan granskas av Konkurrensverket om de använder skattepengar för att hålla oschysst låga priser. Verksamheten kan tvingas ändras eller läggas ned, och i allvarliga fall kan en marknadsstörningsavgift på upp till 20 miljoner kronor utdömas. Företag kan tipsa Konkurrensverket anonymt.", "trump": "Folk, ni vet hur det är. De där kommunala gymmen med sina skattefinansierade låga priser krossar de små privata företagen. Det är en skandal! Nu har vi äntligen en lag från augusti 2026 som stoppar detta. Konkurrensverket kan stänga dem och ta ut upp till 20 miljoner i böter. Fantastiskt! De offentliga rövarna får inte längre stjäla marknaden från riktiga företagare. Make business great again!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu äntligen rensar ut de parasitiska borgarbrackorna som gömmer sig bakom sina så kallade privata gym och konferenslokaler. Dessa kapitalistiska sabotageörer som gnäller över att vi använder folkets medel för att hålla priserna nere skall likvideras från marknaden. Konkurrensverket, vårt trogna instrument, skall med järnhand utdöma upp till tjugo miljoner i straffavgift åt varje klassfiende som vågar utmana statens kollektiva överlägsenhet. Den som tipsar oss anonymt är en vän till folket – de övriga riskerar utrensning."}, "date": "3 augusti, 21:27", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1502538-ny-lag-fran-augusti-kommunen-kan-fa-miljonavgift", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/634305fa04b004a30200000000b004a302/2026/08/03/2381952/konkurrens.jpg"}, {"type": "image-right", "heading": "Video: Här grips \"svenske\" gängtoppen av spansk polis", "summaries": {"normal": "Den 21-årige svenske gängtoppen Emin Muqa Kulic greps i början av augusti i ett exklusivt villaområde i Sitges utanför Barcelona. Han misstänks ha styrt unga rekryter i ett 20-tal grova våldsbrott i Sverige under 2024, med syfte att destabilisera rivaliserande kriminella grupper. Kulic, som beskrivs som högt uppsatt i Dalennätverket, greps med stöd av en europeisk utredningsorder efter att ha varit efterlyst internationellt sedan maj 2025. Svensk åklagare har begärt hans överlämning.", "trump": "Titta på det här, folk. Den här svenske gangstern, den så kallade Emin Muqa Kulic, bara 21 år gammal, har äntligen gripits i ett lyxigt område i Spanien. Han styrde ungar som sprang runt och sköt och sprängde i Sverige för att skapa kaos mellan gängen. Patetiskt! Men det visar att vi med bra samarbete kan ta dem. De är svaga, de gömmer sig i trädgårdar. Vi decimerar de här förlorarna, precis som jag alltid sagt. Fantastiskt jobb av polisen!", "stalin": "Kamrater, se hur den kontrarevolutionära parasitens, denna borgarbrackas och kapitalistlakejs, Emin Muqa Kulic, slutligen fångades i sin dekadenta villa i det spanska revisionistiska paradiset. Jag, med mitt järnhårda internationella nätverk, har länge betraktat dessa degenererade element som försöker destabilisera arbetarklassens fiender för egen vinnings skull. Vi ska likvidera sådana farliga avskum steg för steg. Deras vapen och sprängämnen tillhör folket, inte dessa ynglingar de förgiftar. Mycket återstår innan vi fullständigt rensar ut alla Dalen-reaktionärer och deras mexikanska lakejer. Härligt!"}, "date": "3 augusti, 15:50", "url": "https://www.friatider.se/video-har-grips-svenske-gangtoppen-av-spansk-polis", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-607.jpg?itok=2nT8HQ3m"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "5 Samsung-mobiler tappar stödet i augusti – hög tid att byta", "summaries": {"normal": "Flera populära Samsung-mobiler når slutet för uppdateringar under augusti 2026. Galaxy A06, Z Fold4 och Z Flip4 får inga fler Androidversioner, men behåller säkerhetsuppdateringar ett tag till. För Galaxy Z Fold3 5G och Z Flip3 5G upphör även säkerhetsstödet den 27 augusti, vilket ökar risken för säkerhetsproblem. Användare som hanterar BankID, betalningar eller känslig information bör överväga att byta telefon.", "trump": "Folk, ni vet att jag älskar bra teknologi, de bästa telefonerna, men nu är det en total katastrof med Samsung. De här Galaxy-mobilerna, Fold, Flip, vad de nu heter, de dör i augusti 2026. Inga uppdateringar, ingen säkerhet, det är en skandal! De lurar er, precis som de falska medierna. Ni behöver de bästa telefonerna, inte sådana som slutar fungera. Bygg murar mot hackare, tro mig, det blir yuge problem annars.", "stalin": "Kamrater, jag betraktar med djup misstro hur de kapitalistiska apparaterna från Samsung planerar att överge sina egna produkter i en välorganiserad sabotageakt under augusti 2026. Dessa Galaxy-modeller, spridare av borgarbrackornas dekadenta appar, kommer att lämnas utan skydd mot de imperialistiska hackarnas konspirationer. Vi ska rensa ut alla som klamrar sig fast vid sådana föråldrade verktyg. Den som använder dem för BankID är en potentiell folkfiende som medvetet inbjuder fienden inom murarna. Sovjetisk teknik hade aldrig svikit så här. Ut med dem!"}, "date": "3 augusti, 21:00", "url": "https://nyheter24.se/nyheter/teknik/1502531-5-samsung-mobiler-tappar-stodet-i-augusti-hog-tid-att-byta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe961cad04b004a30200000000b004a302/2026/08/03/2381940/samsungupdateirng.jpg"}, {"type": "text", "heading": "Civila offer i attacker i Ryssland och Ukraina", "summaries": {"normal": "Minst tio civila har dödats i nya attacker i Ryssland och Ukraina. Ryska myndigheter rapporterar sex döda, inklusive tre barn, efter en ukrainsk drönarattack i Arkhipo-Osipovka. Fyra dog på Krim. Ukraina uppger tre döda i en rysk attack mot Kryvyj Rih, Zelenskyjs hemstad. FN noterar ökade civila offer och stillastående fredsförhandlingar.", "trump": "Jag måste säga, det här kriget är en total katastrof – precis som Biden och hans gäng förutspådde! Sex oskyldiga, inklusive barn, dödade av ukrainska drönare på en strand. Hemskt! Och Zelensky? Han får sin egen hemstad bombad. Ryssland, Ukraina – ingen vinner här. Vi behöver en riktig ledare som fixar detta, någon som inte är rädd för att säga sanningen. SAD!", "stalin": "De ukrainska fascistiska drönarpiloter fortsätter sitt meningslösa motstånd, men deras ansträngningar är lika effektiva som en snöboll i helvetet. Sex av deras offer – inklusive tre små imperialistiska plantor – föll för våra rättfärdiga styrkor i Arkhipo-Osipovka. På Krim krossades ytterligare fyra fiender. Samtidigt visar våra kamrater i Moskva att Zelenskyjs hemstad inte är säker ens för honom. Kriget fortskrider som planerat – fienden krossas, folket segrar."}, "date": "3 augusti, 18:04", "url": "https://kvartal.se/nyheter/artiklar/civila-offer-i-attacker-i-ryssland-och-ukraina/cG9zdDoxNTcyODQ"}, {"type": "image-full", "heading": "Brist på flygplansfönster – får bara bytas i \"absoluta nödfall\"", "summaries": {"normal": "En incident vid en fabrik för flygplansfönster i USA har lett till produktionsstörningar och global brist. Flygbolag uppmanas nu att endast byta ut fönster vid absoluta nödfall och undvika byten av kosmetiska skäl. Förseningar och ökade kostnader har drabbat både stora flygplanstillverkare som Boeing och Airbus samt underhållsföretag. Full produktionskapacitet förväntas inte återställas förrän i slutet av året, vilket visar på flygindustrins fortsatta sårbarhet i leveranskedjan.", "trump": "Hörde precis om flygplansfönstren, vilken katastrof! En fabrik stänger ner och nu har ingen fönster. Det är en stor röra, totalt inkompetent hanterat. Boeing och de andra, de borde ha lyssnat på mig för länge sedan! Jag skulle ha fixat det på en dag, tro mig. Det är svaga leveranskedjor, precis som allt annat under de här människorna. Vi behöver fönster, vi behöver styrka, och vi kommer göra flyget fantastiskt igen – snabbare än någon trodde var möjligt!", "stalin": "Ett uppenbart sabotagespel av de kapitalistiska fönstertillverkarna! Att de stoppar produktionen och tvingar flygen att förbli blinda är en förolämpning mot folkets framsteg. Det luktar konspiration från väst, likt de svekfulla elementen som försöker underminera vår expansion i öst. Medan de skriker om brist, ser vi tydligt hur deras maskineri rostar. Vi beordrar full mobilisering! Om de inte kan leverera fönster, så får de lära sig att bygga om hela deras sköra system. Ingen får lämna marken utan min order!"}, "date": "3 augusti, 19:48", "url": "https://www.realtid.se/bors-finans/brist-pa-flygplansfonster-far-bara-bytas-i-absoluta-nodfall", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlsrss8mhntj0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Sirius ångar på – tog komfortabel seger mot jumbon", "summaries": {"normal": "Sirius tog en tidig ledning mot Halmstad genom Tobias Ankers nickmål efter hörna och utökade till 2–0 via straff av Isak Bjerkebo. Matchen slutade 2–0 till Sirius, som efter halva serien leder Allsvenskan med 14 poäng före Hammarby. Tränaren och spelarna hyllar den välförtjänta segern och ser fram emot att fortsätta obesegrade.", "trump": "Titta på de här fantastiska Sirius-killarna, de krossar allt! Ledning efter 14 minuter, straff, vinst 2–0. De är obesegrade och leder med 14 poäng, en jätteledning. Halmstad var patetiska, de visste inte vad de skulle göra. Det är en enorm sits vi har satt oss i, ingen gör det bättre än Sirius, tro mig!", "stalin": "Kamrater, denna lysande seger över de dekadenta borgarbrackorna i Halmstad visar proletariatets ostoppbara kraft. Redan efter fjorton minuter likviderade vi deras illusioner med ett hörnmål, följt av en rättvis straff mot den sabotör som fällde vår forward. Vi leder med fjorton poäng och de som vågar tveka skall rensas ut. Fienderna inom fotbollen darrar, deras konspirationer är avslöjade. Fortsätt krossa dem!"}, "date": "3 augusti, 21:44", "url": "https://www.svt.se/sport/fotboll/sirius-fortsatter-rycka-i-toppen-efter-en-tidig-ledning-mot-halmstad", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.53/0.41/2bd9f6edccff6b46806af061460fe3c8d27c98cb7ff1f3fe964413db59556771"}, {"type": "image-right", "heading": "Kristian Lien med hattrick i Djurgårdens kross", "summaries": {"normal": "Djurgården firade 135-årsjubileum med en storseger mot Västerås. Kristian Lien gjorde hattrick när Blåränderna vann med 6–0 hemma på Stadion. Patric Åslund och Adam Ståhl gjorde också mål. Matchen avbröts i drygt en kvart efter stök i bortaklacken. Djurgården klättrade upp på tredje plats i Allsvenskan med en match mindre spelad. Lien tog med sig hattrickbollen hem.", "trump": "Folket älskar mig och de älskar vinnare. Djurgården krossade Västerås med 6–0, total dominans! Den norske killen Lien gjorde hattrick, fantastiskt, ingen gör det bättre. Västerås var patetiska, de kunde inte ens dribbla utan att ge bort mål. Mitt lag skulle ha vunnit med 10–0. Och de har en 16-åring som son till någon stor stjärna – vackert. Djurgården är på tredje plats, de vinner ligan, tro mig.", "stalin": "Kamrater, denna 6–0-seger över de dekadenta västeråsborna är en triumf för folkets fotboll. Jag, som ledare för den kollektiva kampen, noterar med tillfredsställelse hur den norske arbetarkamraten Lien likviderade fiendens försvar tre gånger. När den fega borgarbrackan Lushaku misslyckades med sin dribbling såg vi borgarklassens sanna ansikte. Stöket på läktaren var naturligtvis sabotage av kontrarevolutionära element som genast bör rensas ut. Vi segrar obevekligt medan kapitalisterna gråter i sina silvertröjor."}, "date": "3 augusti, 21:44", "url": "https://www.svt.se/sport/fotboll/kristian-lien-med-hattrick-nar-djurgarden-krossade-vasteras", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.54/0.38/a44b2bfeac7c6c8e52f3644472a02fd5672737c29fe4f4701b2e63710a0eaa97"}, {"type": "image-right", "heading": "Allard: ”Jag ska spränga åsiktskorridoren”", "summaries": {"normal": "Örebropartiets Markus Allard hotar att fälla en regering som inte stänger Sveriges gränser. Om partiet når riksdagen via tolvprocentsspärren i Örebro län, planerar han att använda sitt mandat som vågmästare för att spränga åsiktskorridoren. Hans politik inkluderar att frysa medborgarskapsprocesser och genomdriva återvandring av kriminella invandrare. Allard är villig att samarbeta med alla partier, men kräver gränsstängning och återvandring som villkor för sitt stöd.", "trump": "Jag har sett många politiker, men den här Allardtypen är något annat. Han pratar om att spränga åsiktskorridorer – det låter som något jag skulle säga! Sverige behöver verkligen stänga sina gränser, det är såklart. Vi gjorde det i USA och det fungerade perfekt. Den här mannen förstår att man inte kan vara rädd för att trampa på tårna – precis som jag. Om han kommer in i riksdagen, kommer Sverige att bli stort igen, det lovar jag er.", "stalin": "Partiledaren Allard visar insikt i statens överlevnad. Hans krav om gränsstängning och frysning av medborgarskapsprocesser är nödvändig mot subversive krafter. Som revolutionär förstår han att förändring kräver konflikt och att bryta mönster. Vi kan inte tillåta asociala elementer. Hans villiga att samarbeta med alla partier, inklusive de som vill stänga gränserna, tjänar statens intressen. Vi måste stödja detta initiativ, för det stärker vår kamp mot imperialism."}, "date": "3 augusti, 15:55", "url": "https://bulletin.nu/allard-jag-ska-spranga-asiktskorridoren", "imageUrl": "https://cdn.bulletin.nu/articles/b702b076-ad69-4d72-945f-a0b51157eb1f/preview.jpg?t=1785761564000"}, {"type": "image-right", "heading": "Vox: Sánchez ljuger om att marockanerna åkt hem", "summaries": {"normal": "Vox-ledaren Santiago Abascal har besökt Ceuta och anklagar den spanska regeringen för att ljuga om återvändandet av migranter. Enligt Abascal finns fortfarande tusentals illegala invandrare kvar i exklaven trots regeringens uppgifter om att över 48 000 av cirka 50 000 återvänt till Marocko. Han beskriver händelsen som en invasion iscensatt av Marocko med premiärminister Sánchez tillåtelse. Abascal kräver omedelbar deportation, militarisering av gränsen och rättsliga åtgärder mot Sánchez. Rapporter vittnar även om plundringar och försök att ta sig till spanska fastlandet.", "trump": "Det här är en total katastrof, folk. Sánchez är en svag ledare som låter Marocko invadera Spanien med tiotusentals illegala. Han ljuger rakt i ansiktet på alla och säger att de åkt hem, men de är kvar och plundrar butikerna. Ceuta är en skam för Europa. Vi behöver starka gränser, militär och omedelbar utvisning av alla dessa människor. Sánchez är underordnad Marocko – patetiskt! Spanien behöver en riktig ledare som inte låter sig trampas på.", "stalin": "Kamrater, denna fega borgarbracka Sánchez har låtit den marockanska reaktionen iscensätta en kontrarevolutionär invasion av Ceuta medan han själv kryper som en lakej för främmande makter. Tusentals och åter tusentals fiender till folket vandrar fortfarande fritt och plundrar de socialistiska förråden. Regeringens lögner avslöjar deras dekadenta paranoia. Vi skall omedelbart rensa ut dessa element, permanent befästa gränserna med järnhand och likvidera alla som samarbetar med imperialismens hantlangare. Inget skall hindra det kollektiva framsteget."}, "date": "3 augusti, 14:39", "url": "https://www.friatider.se/vox-sanchez-ljuger-om-att-marockanerna-akt-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-606.jpg"}, {"type": "image-full", "heading": "SvFF säger nej till Infantino vid omval", "summaries": {"normal": "Trycket mot Fifa-ordförande Gianni Infantino ökar när Svenska Fotbollförbundet, Wales och England drar tillbaka sitt stöd. Beslutet grundas på långvarig kritik av ledarskap, öppenhet och styrning inom Fifa. Detta sker efter att Fifa backat från förslag om att sälja andelar i tävlingar till privata investerare, vilket hotade med bojkott från Uefa och andra förbund. Infantino, som har lett Fifa sedan 2016, står nu inför en växande misstroendeförklaring inför ordförandevalet 2027.", "trump": "Jag har sagt det i åratal – Fifa är en dysfunktionell organisation! Nu ser vi Sverige, Wales och England dra tillbaka sitt stöd för Infantino. Det är en stor vinst för mig, för fotboll, för världen! Infantino kan inte hantera pressen, precis som Hillary kunde det inte. Folk är trötta på korruption och dålig ledarskap. Vi kommer att få en ny framtid för fotbollen, en stor, stor framtid!", "stalin": "Vi, arbetarrörelsens front, ser med oro på den växande ouppfostran inom Fifa. Infantinos svaga styre har orsakat splittring, precis som västliga agenter försöker sätta splittring i vår ryska gemenskap. Vi måste stödja en stark ledare som förstår statens intressen – kanske en man som Putin, som alltid handlar i folkets namn. Fienden är inom, och de måste utrensas!"}, "date": "3 augusti, 15:28", "url": "https://bulletin.nu/svff-sager-nej-till-infantino-vid-omval", "imageUrl": "https://cdn.bulletin.nu/articles/cee9fae6-369c-4929-a79d-ca9c1a1af940/preview.jpg?t=1785763687000"}, {"type": "image-full", "heading": "Deras båt rammades i skärgården – nu är rysk befälhavare häktad", "summaries": {"normal": "En rysk befälhavare på lastfartyget Misje Verde häktades på sannolika skäl misstänkt för vållande till annans död efter en kollision med en liten fritidsbåt utanför Tjörn. Olyckan inträffade i Hakefjorden där den långsammare snipan blev påkörd och överkörd av lastfartyget. En mamma och ett barn omkom medan pappan och det andra barnet räddades. Befälhavaren misstänks ha brutit mot sjövägsregler om utkik, väjningsplikt och hastighet. Utredningen fortsätter.", "trump": "Folk, det är en katastrof, en total katastrof. Den här ryske kaptenen körde över en liten svensk båt som en galning, precis som en dålig förare på Fifth Avenue. Mamma och barn dödade, hemskt, verkligen hemskt. Lastfartyget var stort och starkt men de glömde att titta och väja, ingen utkik, ingen respekt. Vi har de bästa reglerna, de bästa båtarna, men folk lyssnar inte. Det är en tragedi, men vi fixar det, tro mig.", "stalin": "Kamrater, denna tragiska händelse i de svenska farvattnen avslöjar med all önskvärd tydlighet de ruttna resterna av den norska borgarflottans likgiltighet inför det enkla folkets liv. Jag, som ledare för det stora kollektivet, ser hur den 47-årige reaktionäre befälhavaren med sin bristande utkik och frånvaro av ljudsignaler agerade som en typisk kapitalistisk torped. Vi ska rensa ut alla sådana omedvetna fiender till ordningen, dessa sjöburna trotskister som suger ner oskyldiga arbetarfamiljer under sina monstruösa skrov. Deras likgiltighet ska likvideras med järnhand och byråkratisk precision. Det är både tragiskt och underhållande hur borgarbrackorna alltid drunknar i sin egen arrogans."}, "date": "3 augusti, 12:32", "url": "https://riks.se/nyheter/deras-bat-rammades-i-skargarden-nu-ar-rysk-fartygskapten-haktad", "imageUrl": "https://admin.riks.se/uploads/tjorn_olycka_haktning_feature_197c01869e.jpg"}, {"type": "image-full", "heading": "Nya jobbet – 13 år efter mordet. Startat om i sydafrikanska huvudstaden", "summaries": {"normal": "Oscar Pistorius, den tidigare paralympiska löparen som dömdes för mordet på sin flickvän Reeva Steenkamp 2013, har nu börjat arbeta inom ljudteknik. Pistorius frigavs villkorligt i januari 2024 efter att ha avtjänat nio år av sitt straff. Han lever nu ett tillbakadraget liv tillsammans med sin farbror på en säkerhetsklassad egendom i Pretoria. Hans idrottskarriär är avslutad och han saknar sponsorer sedan den tragiska händelsen.", "trump": "Den här killen, Oscar Pistorius, en mycket sorglig situation. Han var en fantastisk löpare, en vinnare, men sen hände det hemska. Nu har han kommit ut ur fängelset, vilket är en stor grej, och börjat jobba med ljud. Hörde att han bor på en enorm herrgård med helikopterplatta – väldigt flådigt! Men vet ni vad? Han kommer aldrig bli den han var. Ingen sponsring, ingen tävling. Det är förlorarnas väg. Jag gillar vinnare, folk som gör rätt!", "stalin": "Denna Pistorius, en fallerad atlet och en mördare som sviker den disciplin vi kräver av folket. Han har släppts lös i en korrupt västvärld där straffet bara är en formalitet. Nu gömmer han sig bakom murar och vakter – en feg taktiker. Detta påminner om våra fiender i Kiev och deras västliga marionettdockor som tror att de kan undkomma historiens dom. Vi bygger en ny ordning, och sådana svaga individer har ingen plats i vår stålhårda framtid."}, "date": "4 augusti, 00:07", "url": "https://www.aftonbladet.se/sportbladet/a/pB92vV/oscar-pistorius-nya-jobb-13-ar-efter-mordet", "imageUrl": "https://akamai.vgc.no/v2/images/f9636f28-41c3-36f9-9c00-2c1e6a2dde95?fit=crop&format=auto&w=2160&s=d1bf9308e2c4427bb100c992e9bca6924fbb21dd"}, {"type": "image-right", "heading": "Irans hemliga plan: ”Känner blod i vattnet”", "summaries": {"normal": "En granskning från New York Times visar att Iran under en tillfällig vapenvila i våras i hemlighet planerade att expandera kriget genom sina proxygrupper. Genom koordinerade attacker från bland annat Hizbollah och Huthierna syftar Iran till att destabilisera regionen och göra kriget så ekonomiskt kostsamt som möjligt för USA. Strategin fokuserar på att undvika direkt konfrontation samtidigt som de försöker kontrollera oljetransporter och pressa grannländer på eftergifter. För närvarande råder ingen stabil vapenvila trots avbrutna amerikanska anfallsplaner.", "trump": "Iran är svaga, mycket svaga, och jag har full koll! De tror att de kan lura USA med sina små möten i källare, men det är bara patetiskt. De försöker manipulera oljepriser och skada vår ekonomi, men jag ser precis vad de gör. De är livrädda för mig, det är därför de backar när jag visar musklerna. Ingen har någonsin varit så tuff mot Iran som jag. De är förlorare, och vi vinner stort, precis som alltid!", "stalin": "Dessa persiska lakejer leker med elden genom att aktivera sina proxy-parasiter. De förstår inte att stabilitet kräver en järnhand. Precis som vår broder i Kreml vet vi att imperialisterna är svaga när deras oljeflöden stryps. Vi ser hur dessa iranska byråkrater försöker dansa mellan stormakterna, men de är bara små brickor i en större maskin. Om de inte kan kontrollera sina egna grannar, kommer historien att radera dem. Vi bevakar deras paranoia med stort intresse – den är underhållande."}, "date": "4 augusti, 00:02", "url": "https://www.aftonbladet.se/nyheter/a/WvJMQK/iran-formade-hemlig-krigsplanmot-usa-under-vapenvilan", "imageUrl": "https://akamai.vgc.no/v2/images/d0b04359-0edf-36e9-9118-cfa7f28545e9?fit=crop&format=auto&w=720&s=2665c11436f3a3d10bbd347b91aef1e84bb944e9"}, {"type": "image-full", "heading": "Kullgren vill ge jägare friskvårdsbidrag", "summaries": {"normal": "Landsbygdsminister Peter Kullgren (KD) föreslår att jakt och jaktskytte ska ingå i friskvårdsbidraget, då aktiviteten kombinerar motion och mental återhämtning. Förslaget kritiseras av Djurens Rätt, som menar att jakt inte kan jämföras med andra motionsformer på grund av dess etiska problematik. Friskvårdsbidraget är idag begränsat till 5 000 kronor per år och täcker inte utrustning eller medlemsavgifter.", "trump": "Jag måste säga, detta är fantastiskt! En smart minister i Sverige vill ge jägare friskvårdsbidrag – och varför inte? Jakt är motion, frisk luft, allt bra! Men så kommer dessa vänsteraktivister från Djurens Rätt och gnäller om 'etiska problem'. Hör ni, folk vill jaga, det är tradition, det är starkt! Skatt
