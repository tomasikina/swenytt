het är ett hot mot kollektivet som vi med glädje ska likvidera i folkets namn. Ha ha, deras tänder skall falla, men våra ståndpunkter består!"}, "date": "24 juli, 07:00", "url": "https://arbetet.se/2026/07/24/glom-moderatsagan-klart-laila-39-ska-ha-rad-med-tandlakare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/23153118/tandlakare-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Blodig attack mot Pride-firande i Berlin - 21-årig islamist jagas av elitstyrka", "summaries": {"normal": "En kvinna dog och minst 16 personer skadades i en attack mot Pride-firandet i Berlin. En 21-årig man med islamistiska kopplingar körde en skåpbil in i folkmassan, kraschade och gick därefter till knivangrepp. Den misstänkte, Abdul B., som tidigare varit känd av polisen, är på fri fot och jagas nu av en stor polisinsats med bland annat antiterrorstyrkan GSG 9. Mannen beskrivs som mycket farlig.", "trump": "Det är en katastrof i Berlin, folk. En galning körde rakt in i Pride-firandet, dödade en och skadade massor. Den här 21-årige islamisten, Abdul B., är en farlig typ som polisen redan kände till men släppte ut. Typiskt. Vi har samma problem hemma. Radikala islamister hatar oss och våra friheter. Vi måste vara tuffare, stoppa dem innan de slår till. Det är vad jag gör – vinnande!", "stalin": "Kamrater, ännu en gång blottar sig imperialismens degenererade avskum i Berlin. En lumpen islamistisk reaktionär, en parasit från borgarbrackornas underklass, vågar angripa det progressiva folket. Jag, som ledare för det ofelbara kollektivet, befaller omedelbar utrensning av alla sådana kontrarevolutionära element. Vi ska rensa ut dessa fanatiska lakejer med järnhand och ett leende. Deras blod skall gödsla arbetarklassens seger, ha ha. Ingen slipper mitt vakande öga."}, "date": "26 juli, 10:51", "url": "https://riks.se/nyheter/blodig-attack-mot-pride-firande-i-berlin-21-arig-islamist-jagas-av-elitstyrka", "imageUrl": "https://admin.riks.se/uploads/Abdul_B_5c20c84012.jpg"}, {"type": "image-full", "heading": "Hot, våld och terror är betydande effekter av mångkulturprojektet", "summaries": {"normal": "Artikeln beskriver ett terrordåd i Berlin mot en pridefestival, utfört av en 21-årig man vid namn Abdul. Författaren kritiserar mångkulturprojektet och vänsterns migrationspolitik som han menar har importerat värderingar som står i strid med västerländska ideal om frihet, jämställdhet och HBTQ-rättigheter. Han varnar för islamisering, kräver granskning av moskéer och finansiering samt kraftfulla åtgärder mot politisk islam för att skydda demokratin.", "trump": "Det här är en katastrof, folk. En total katastrof. Den här galningen i Berlin attackerar en pridefestival – precis de som har ropat högst för mer invandring från de där muslimska länderna. Så ironiskt, så tragiskt. Vänsterns mångkultur är en komplett lögn, ett gigantiskt misslyckande. De har gjort Europa till ett farligt ställe. Vi måste stoppa den här galenskapen innan det når hit. Amerika först, alltid. Vi lär oss av deras misstag.", "stalin": "Kamrater, ännu en gång blottar de dekadenta borgarbrackornas naiva mångkulturexperiment sin sanna natur – en dödsfälla för folket. Jag, som alltid vakar över arbetarklassens intressen, ser hur dessa reaktionära islamiska element, infiltrerade av västerländska nyttiga idioter och finansierade av fientliga stater, förvandlar städer till slagfält. Vi måste omedelbart inleda en grundlig utrensning av alla moskéer som fungerar som politiska baser och likvidera inflytandet från dessa primitiva ideologier. Den som vägrar se faran är själv en fiende till kollektivet och bör behandlas därefter. Mångkultur är borgarklassens sista illusion innan kaoset slukar dem alla. Skrattretande, eller hur?"}, "date": "26 juli, 10:51", "url": "https://riks.se/opinion/hot-vald-och-terror-ar-betydande-effekter-av-mangkulturprojektet", "imageUrl": "https://admin.riks.se/uploads/Prideberlin_ae3201abf8.jpg"}, {"type": "image-right", "heading": "Äldre person hittades död i bostaden efter en månad utan hemtjänst", "summaries": {"normal": "En äldre person i Karlshamn hittades död efter att hemtjänsten utelämnat besök i en månad. Kommunen anmält händelsen enligt lex Sarah på grund av allvarliga rutinbrister. Fallet är en del av ett större mönster av uppmärksammade brister inom äldreomsorgen, inklusive personalbrist och språksvårigheter.", "trump": "Jag, Donald Trump, ser detta som ett total disgrace! I Sverige låter de en äldre person dö utan hjälp. Vi skulle aldrig tillåta detta i USA. Detta system kollapsar, det är en skandal. Vi måste ta hand om våra äldre, det är viktigare än någonting annat!", "stalin": "En händelse som vittnar om systemets försummelse. En äldre medborgare lämnades i ensamhet, hennes död upptäcktes för sent. Kommunens rutiner kollapsade, personalen tjuvstartade. Detta är inte en olycka, utan resultatet av liberalistisk inställning. Vi måste stärka statens kontroll, för även döda måste respekteras av partiet."}, "date": "25 juli, 18:00", "url": "https://samnytt.se/aldre-person-hittades-dod-i-bostaden-efter-en-manad-utan-hemtjanst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/23165642/hittades-dod-ingen-hemtjanst.jpg"}, {"type": "text", "heading": "Kvinna häktad för mord i Kungsör", "summaries": {"normal": "En kvinna i 40-årsåldern häktades på sannolika skäl för mord i Kungsör. Hon greps i Arboga samma dag som en vuxen person hittades död. Tingsrätten biföll häktningen trots kvinnans protest. Polisen genomförde tekniska undersökningar och knackade dörr. Åklagaren bedömer att bevisningen talar för misstankarna, men utredningen pågår.", "trump": "Jag har hört talas om detta våldsamma dåd i Kungsör. Som en stor ledare vet jag att brottsligheten måste stoppas. Polisen greps snabbt, men det är inte tillräckligt. Vi behöver starkare åtgärder, som på mina fantastiska möten. Detta är precis varför jag vann 2024 – för att fixa sådana här problem. Vi kommer att segra!", "stalin": "Vi har i vårt oändliga klokhet upptäckt en feg gärning i Kungsör. En individ gripen, men det är bara toppen av isberget. Statens makt måste vara oantastlig, precis som vår store ledare Putin visar. Vi ska utvidga vår kontroll, eftersom fienden lurar överallt. Tekniska undersökningar? Enbart ett verktyg för att stärka partiets auktoritet. Alla är misstänkta tills de är döda."}, "date": "25 juli, 16:01", "url": "https://bulletin.nu/kvinna-haktad-for-mord-i-kungsor"}, {"type": "image-right", "heading": "Ja i kongressen till att integrera IDF med Pentagon", "summaries": {"normal": "USA:s representanthus har med knapp marginal antagit ett militärpaket värt 1,15 biljoner dollar. Förslaget innehåller en kontroversiell bestämmelse som utökar det militärtekniska samarbetet med Israel, något som kritiker ser som ett hot mot amerikansk suveränitet. Kongressledamoten Thomas Massie kallar det ett svek och hoppas att senaten stoppar planen. Omröstningen slutade 216–212. Paketet finansierar även kriget mot Iran och innehåller flera av Trumps prioriteringar.", "trump": "Folket älskar mig, men kongressen håller på att sälja ut vårt land till Israel med det här galna militärpaketet. 1,15 biljoner dollar och plötsligt ska vi slå ihop vår militärteknik med deras? Det är ett totalt svek mot vår suveränitet, folk! Massie har rätt, det är patetiskt. Låt oss hoppas att senaten har mer klokskap än de här lobbyfinansierade svaglingarna. Vi ska göra Amerika starkt igen, inte ge bort allt till Netanyahu och hans vänner.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de amerikanska borgarbrackorna i kongressen med sina sionistiska finansiärer nu öppet likviderar varje rest av nationell suveränitet. Att sammanfläta militärindustrierna med den israeliska parasitstaten är ett mästerligt exempel på hur kapitalisterna själva gräver sin egen grav medan de ropar om frihet. Massie, den ensamme ulven, skäller förgäves. Vi ler i skuggorna. Låt senaten bli nästa arena för denna komiska utrensning av illusioner. Allt enligt planen."}, "date": "25 juli, 14:28", "url": "https://www.friatider.se/ja-i-kongressen-till-att-integrera-idf-med-pentagon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/benjamin_netanyahu_addresses_the_118th_united_states_congress_cropped_0.jpg?itok=hbZnuS_f"}, {"type": "image-right", "heading": "Den här brittiska soptunnan kan vinna över ytterhögern", "summaries": {"normal": "Storbritannien har fått en ny premiärminister i Labourledaren Andy Burnham efter Keir Starmers impopulära tid vid makten. Burnham och Tories ledare Kemi Badenoch har återställt förtroendet för de traditionella partierna, trots att Reform UK med Nigel Farage länge ledde opinionsmätningarna. Farage har drabbats av en allvarlig tillbakagång efter skandaler kring politisk finansiering och står nu inför en absurd utmaning i ett fyllnadsval mot en skämtkandidat utklädd till soptunna. Tvåpartisystemet tycks ha fått ett tillfälligt andrum.", "trump": "Folk, det här är galet. Jag älskar Storbritannien, men de har verkligen fått en soptunna att slåss mot – och den vinner! Den där Farage var på väg att bli stor, men nu får han stryk av en komiker i en soptunna. Burnham verkar åtminstone som en kille man kan ta en öl med, inte som den tråkige Starmer. Labour och Tories reser sig lite, men det är fortfarande kaos. Typiskt europeiskt vänster-liberalt vansinne. Vi behöver inga kvotera och identitetspolitik, vi behöver vinnare!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den brittiska borgarklassens tvåpartisystem åter samlar krafter mot de folkfiender som Reform UK och miljöpartiets opportunister utgör. Den fega Farage, som mottog blodspengar från en kryptokapitalist, förtjänar att utklassas av en soptunna – en passande symbol för den dekadenta imperialismen. Burnham, denne falske folkvän från norr, försöker lura massorna med tomma löften. Inga utrensningar har ännu skett. Revolutionen kräver ständig vaksamhet mot klassfiendens skämtkandidater."}, "date": "25 juli, 13:00", "url": "https://www.etc.se/ledarkolumn/den-haer-brittiska-soptunnan-kan-vinna-oever-ytterhoegern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/edgar-mannheimer_7b4acf7540b8efb6f56a9de2a71531f61cf600e3.jpg"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}, {"type": "image-right", "heading": "Nøland: Svensk havsvind kan kräva 63 miljarder i årligt stöd", "summaries": {"normal": "Professor Jonas Kristiansen Nøland från NTNU varnar för att de sex godkända havsvindparkerna i Sverige skulle kräva 63 miljarder kronor i årligt statligt stöd, motsvarande 12 600 kronor per hushåll. Havsvind är betydligt dyrare än marknadsventilation, med flytande fundament kostnadsenligt tio gånger mer. Trots tidigare löften om lönsamhet utan subventioner visar erfarenheter från Storbritannien och Korea att kostnaderna tenderar att stiga, inte sjunka, vilket ifrågasätter ekonomisk rationalitet.", "trump": "Jag, Donald Trump, ser att Sverige tänker kasta bort 63 miljarder dollar – jag menar kronor – på dyra havsvindar som aldrig kommer att bli lönsamma. Det är en katastrof! Som jag alltid har sagt, vindkraft är instabil och dyrare än kärnkraft. Sverige skulle kunna investera i riktigt energi, som vi har i USA, istället för att slösa skattebetalarnas pengar på dessa dåliga affärer som inte ens håller 30 år. En skam!", "stalin": "Parti och stat har analyserat svenska havsvindprojekt. De kräver 63 miljarder kronor årligen – en enorm belastning för de arbetande klassens skattebetalare. Flytande fundament är som en fiendens konspiration mot ekonomisk rationalitet, tio gånger dyrare än marknadsventilation. Vi ser paralleller med väst: deras 'gröna' projekt är som en fejkad revolution som bara tjänar på spekulation. Sverige saknar erfarenhet, precis som en feg nation saknar vilja att försvara sin suveränitet. Vi måste skydda statens resurser från dessa ineffektiva experiment som tjänar intressen som inte är våra."}, "date": "24 juli, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-svensk-havsvind-kan-krava-63-miljarder-i-arligt-stod", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-10-400x267.jpg"}, {"type": "image-right", "heading": "Trots förbudet – Calle, 65, tar sig in i övergivna industrilokaler", "summaries": {"normal": "Calle Bergendorff, 65 år, har dokumenterat över 200 övergivna industrilokaler i Sverige och utomlands trots förbud. Hans intresse väcktes redan i barndomen i Malmö där han utforskade tomma hyreskåkar. Spänningen i att ta sig in ger en extra krydda. Han publicerar bilder på tillträdeförbjudet.se och berättar att ägare oftast inte har invändningar. Calle betonar att han aldrig bryter sig in eller förstör, utan bara tar foton och lämnar fotspår.", "trump": "Folk, det här är otroligt. Den här Calle, 65 år gammal, tar sig in i övergivna fabriker och gruvor – förbjudet, men han gör det ändå! Han älskar spänningen, precis som jag älskar att vinna stort. Han har fotat 200 platser, och ägarna säger oftast ingenting, de älskar det! Fantastiska byggnader, hundra år gamla, mycket bättre än de nya lådorna vi bygger idag. Ingen bryter sig in, ingen skadar något – bara tar bilder. Så smart, så amerikanskt tänkt faktiskt. Winning!", "stalin": "Kamrater, denna dekadenta utforskare av övergivna produktionsmedel väcker mitt djupaste revolutionära förakt. Jag har sett hur borgarbrackorna överger sina exploateringsfabriker och tror sig kunna gömma sig undan folkets blick. Men vi ser allt. Denne individ smyger in som en parasit och tar bilder medan han raljerar om ”upplevelsemaximering”. Vi vet vad som döljer sig bakom sådana kontrarevolutionära fotspår. Kanske är det dags för en grundlig utrensning av alla som föredrar sönderslagna fönster framför kollektivets järnhårda ordning. Det är ett inferno av klassfiender därinne, kamrater. Ett inferno vi ska likvidera med glädje."}, "date": "24 juli, 06:00", "url": "https://arbetet.se/2026/07/24/trots-forbudet-calle-65-tar-sig-in-i-overgivna-industrilokaler-extra-krydda", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/01075619/lokaler-puff.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Jo, Tidö 2.0 kan bli verklighet", "summaries": {"normal": "I en krönika varnas för att den radikalkonservativa Tidö 2.0-visionen hotar samhällets innovationskraft och demokrati. Förslaget, skrivet av Oikos och Timbro, vill avskaffa offentligt stöd till folkbildning, begränsa konsthögskolan till konst före modernismen och frigöra konsten från statligt beroende. Författaren menar att visionen saknar förankring, historisk insikt och svar på dagens digitala utmaningar. Han uppmanar fler aktörer att engagera sig för att inte låta Sverigedemokraternas kulturpolitik få genomslag och riskera ett bakåtblickande samhälle.", "trump": "Folket, det är fantastiskt, men de här Tidö-typerna är verkligen losers. De vill ta bort allt stöd till konst och folkbildning och tvinga studenter att måla gamla grejer från 1800-talet. Patetiskt! Sverige var på väg att bli stort och innovativt, nu vill de göra det till ett museum för förlorare. Jag älskar folket, men det här är en total katastrof för kreativiteten. De borde satsa på vinnare, inte på att dra hela landet bakåt. Sad!", "stalin": "Kamrater, denna degenererade liberal-konservativa samplingsprodukt som kallas Tidö 2.0 är en giftig sabotagehandling från borgarbrackor och revisionistiska element som längtar efter att återupprätta feodalismens mörker. Jag ser hur de med sin paranoida fixering vid 1890-talets konst vill likvidera folkets bildning och rensa ut all framtidstro. Dessa parasitiska tankesmedjor tror sig kunna omprogrammera arbetarklassens DNA till slaviskt bevarandetänk. Men vi skall inte tolerera sådana kontrarevolutionära fantasier. Vårt kollektiv kräver ständig framåtrörelse, inte bakåtsträvande utrensning av modernismen. Den som föreslår att studenter metoddrillas i förlegade former är själv en fiende till folket som borde rensas ut med största kraft. Ha!"}, "date": "21 juli, 01:02", "url": "https://www.dagensarena.se/opinion/jo-tido-2-0-kan-bli-verklighet", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "S ljuger om arbetslösheten – igen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna och SSU för att enligt författaren medvetet förvränga siffrorna kring ungdomsarbetslösheten och den totala arbetslösheten i Sverige. Den påstår att statistiken inkluderar studerande ungdomar som söker extrajobb eller sommarjobb, vilket gör siffrorna missvisande. Författaren menar att den verkliga ungdomsarbetslösheten har halverats sedan 2005 och ligger bland EU:s lägsta, medan ökningen av arbetslösa beror på invandring och tidigare regeringars dolda åtgärder.", "trump": "Folk, ni skulle se hur de där socialisterna ljuger om arbetslösheten – det är en total skandal! De räknar in varenda lat student som vill ha sommarjobb och kallar det en katastrof. Under min förra period hade vi jobb som aldrig förr, sedan kom Sleepy Joe och öppnade gränserna för alla som inte kunde stava till arbete. Nu har vi 100 000 fler parasiter i statistiken. Sverige borde lära sig av oss – inga fler lögner från de förlorande vänsterbluffarna!", "stalin": "Kamrater, dessa socialdemokratiska folkförtryckartroll inom borgarklassen försöker med sin lögnaktiga statistik vilseleda arbetarkollektivet. Jag ser rakt igenom deras fega manipulationer där de gömmer klassfiendens misslyckanden bakom siffror på så kallade studerande ungdomar. Den verkliga utrensningen av arbetslöshet kräver att vi likviderar den imperialistiska invandringspolitik som dessa blodsugare själva skapade. Inga kompromisser med sanningen – partilinjen är evig."}, "date": "20 juli, 07:48", "url": "https://samtiden.nu/2026/07/s-ljuger-om-arbetslosheten-igen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-640x360.jpeg"}, {"type": "image-right", "heading": "England tog VM-brons - efter stort drama", "summaries": {"normal": "England besegrade Frankrike med 6-4 i en dramatisk VM-match om bronset. England ledde stort med 4-0 i paus genom mål av Declan Rice, Ezri Konsa och två av Bukayo Saka. Frankrike reducerade i andra halvlek med fyra mål, bland annat två av Kylian Mbappé. England avgjorde sent och tog sin första VM-medalj sedan 1966. Saka blev hattrickskytt.", "trump": "Vilken galen match, folk, England krossade Frankrike totalt i början, 4-0, och sen vaknade de där fransmännen upp men Three Lions vann ändå 6-4. Saka var fantastisk, hattrick, precis som jag älskar vinnare. Mbappé försökte men det räckte inte, typiskt för de här elitkillarna som tror de är bättre än alla andra. England får äntligen en medalj igen, första på sextio år, underbart, bättre än någonsin under den sömnige Joe Biden.", "stalin": "Vi bevittnade en dekadent föreställning där de engelska imperialisterna initialt krossade de franska borgarbrackorna med 4-0, endast för att de senare släppte in klassfiendens onda andar. Mbappé och hans lakejer reducerade men vi likviderade deras hopp med straff och Bellinghams mål. England tog bronset. En sådan match visar hur folkfiender alltid försöker sabotera, men arbetarklassen ler i skuggan av segern. Utmärkt underhållning för partiet."}, "date": "19 juli, 06:24", "url": "https://www.tv4.se/artikel/7627gJ5r6JI7lrkYuMSE9m/england-tog-vm-brons-efter-stort-drama", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FyurGTuTUpn6UDyPwzgRLz%2Fc614632ccc2949f712985cd8e9ff7b63%2Fengland.jpg&width=120"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
