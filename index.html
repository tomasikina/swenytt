-barn-doedas-naer-ska-svenska-medier-sluta-foerdumma-oss", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/clara-knaepper-bohman_14c43b93cd44d4be44c94b47c675d25ff6ac2190.png"}, {"type": "image-right", "heading": "Fortsatt bristfällig information i Bongs nyemission", "summaries": {"normal": "Bong har publicerat informationsdokumentet inför sin företrädesemission som ska inbringa 63,4 miljoner kronor brutto. Emissionen är fullt garanterad, men huvudägaren Stéphane Hamelin deltar inte i teckningen. Emissionsguiden kritiserar återigen bolaget för bristfällig information, bland annat eftersom de anonyma garanterna inte namnges och att publiceringen av dokumentet inte meddelades via pressmeddelande. Teckningsperioden löper från 3 till 17 juli.", "trump": "Folk, ni skulle se det här. Bong, ett riktigt förlorarbolag, gör en emission på 63 miljoner och huvudägaren Stéphane Hamelin duckar som en fegis och tecknar inte en krona. De gömmer namnen på garanterna och glömmer till och med att skicka ut ett pressmeddelande. Totalt kaos och bristfällig information. Det är en skandal. Aktien handlas över teckningskursen men tro mig, det här luktar illa. Jag skulle aldrig låta sånt här ske i mina bolag.", "stalin": "Kamrater, i denna folkfientliga nyemission avslöjar sig borgarbrackorna återigen i all sin ynkliga girighet. Huvudägaren Hamelin vägrar teckna sin del – en typisk kapitalistisk sabotageakt mot det kollektiva intresset. De döljer garanternas namn som råttor i mörkret och underlåter att informera massorna via pressmeddelande. Vi ser tydligt de dekadenta fiendernas ansikten. En sådan bristfällig information kräver omedelbar utrensning av alla opportunistiska element som vågar vilseleda arbetarklassen. Deras paranoia blir deras fall."}, "date": "3 juli, 15:48", "url": "https://www.affarsvarlden.se/artikel/fortsatt-bristfallig-information-i-bongs-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Bongs-ordforande-Per-Ahlgren-400x267.jpg"}, {"type": "image-right", "heading": "Saad Khiralla: Libanon vid ett vägskäl – fred med Israel eller inbördeskrig", "summaries": {"normal": "Libanon befinner sig vid ett historiskt vägskäl där landet antingen kan frigöra sig från Hizbollahs och Irans grepp, vilket öppnar för fred med Israel, eller riskera ett nytt inbördeskrig likt det som mellan 1975 och 1990 krävde 120 000 liv. Artikeln går igenom Libanons utveckling från självständigheten 1943, via dess roll som bro mellan Europa och arabvärlden, till de påfrestningar som ledde till Kairoavtalet 1969 och PLO:s bas i södra Libanon.", "trump": "Libanon är ett totalt kaosland just nu, tro mig, det är en katastrof. Antingen kastar de ut de iranska terroristerna från Hizbollah och gör ett fantastiskt fredsavtal med Israel, det bästa avtalet någonsin, eller så hamnar de i ett nytt hemskt inbördeskrig som förra gången dödade massor av människor. Det var en underbar plats förr, en riktig pärla, nu har de låtit radikala element förstöra allt. Vi fixar det, vi gör Libanon stort igen.", "stalin": "Kamrater, vi betraktar med revolutionär klarhet hur den libanesiska staten vacklar vid detta ödesdigra vägskäl. Antingen rensar vi ut de iranska agenterna och deras Hizbollah-bödelspatruller som kväver folkets vilja, eller också låter vi de kontrarevolutionära elementen återuppväcka det imperialistiska inbördeskriget som slukade 120 000 själar. Jag minns hur borgarbrackorna och de palestinska äventyrarna under Kairoavtalet förvandlade södra Libanon till en parasitisk bas för sionistisk provokation. Inga kompromisser med folkets fiender – utrensning är den enda väg framåt för det kollektiva minnet."}, "date": "3 juli, 13:48", "url": "https://bulletin.nu/saad-khiralla-libanon-vid-ett-vagskal-fred-med-israel-eller-inbordeskrig-2", "imageUrl": "https://cdn.bulletin.nu/articles/d5550f82-8908-41df-8ce5-cd4b107e0bf2/preview.png?t=1783078710000"}, {"type": "image-right", "heading": "Värdesätt USA – men öka självständigheten", "summaries": {"normal": "Carl Bildt argumenterar för att Europa måste öka sin självständighet gentemot USA. Han hyllar den amerikanska författningens unika utformning och historiska framgångar men pekar på landets inre kriser, polarisering och minskade globala engagemang. Trots ett fortsatt stort beroende av USA inom teknik och innovation bör Europa lära sig att stå på egna ben, då USA inte längre värdesätter relationen på samma sätt som tidigare.", "trump": "Den här killen Bildt har helt rätt i att Europa borde sluta vara så patetiskt beroende av oss. Vi är världens mäktigaste nation, men vi tänker inte längre betala för era latmaskar. Amerika först! Ni européer har utnyttjat oss i decennier medan ni gnällt och klagat. Nu vänder vi oss inåt och gör affärer som gynnar oss. Ni borde tacka mig istället för att ni får chansen att växa upp och stå på egna ben för en gångs skull.", "stalin": "Vi, det stora sovjetiska folket, ser hur dessa dekadenta borgarbrackor i Washington nu äntligen blottar sin sanna imperialistiska paranoia. Deras så kallade författning var från början ett verktyg för slavägande kapitalister att undertrycka arbetarklassen. Nu när deras murkna imperium snubblar inåt mot sin egen utrensning av svaghet, måste vi europeiska kamrater skratta mörkt åt deras dollarklovner och likvidera varje spår av beroende. Den som litar på yankees är en fiende till folket och bör rensas ut omedelbart."}, "date": "3 juli, 12:59", "url": "https://www.di.se/debatt/vardesatt-relationen-med-usa-men-oka-sjalvstandigheten/", "imageUrl": "https://static.bonniernews.se/ba/74a6f7f8-3f4c-4eb9-a88c-659222eb602c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "En miljon insamlat till mördade polisens familj", "summaries": {"normal": "En insamling till familjen efter den mördade polisen Christian Zedig har passerat en miljon kronor. Den 32-årige polisen lämnar efter sig en fru och två små döttrar. Han misshandlades till döds av en grupp afrikaner under en VM-match när han ingrep för att stoppa ett bråk med svenska och norska supportrar. Initiativtagaren Oskar Persson startade insamlingen för att underlätta för familjen ekonomiskt och har fått positiv respons från över tusen givare.", "trump": "En miljon kronor till den stackars familjens polis som blev slagen till döds av en galen grupp afrikaner under en fotbollsmatch – helt oacceptabelt! Han försökte stoppa bråket som riktiga hjältar gör, men de radikala elementen tog hans liv. Nu samlar folket in pengar till hans fru och små döttrar, över en miljon redan. Fantastiskt folk, de bästa människorna. Vi behöver lag och ordning, inte detta kaos. Gör Sverige stort igen!", "stalin": "Kamrater, jag betraktar med djup proletär vrede hur borgarbrackornas reaktionära afrikanska lakejer likviderade en hederlig arbetarpolis som Christian Zedig under en imperialistisk fotbollsorgie. Hans fru och döttrar lämnas i sorg, men vi, partiet och folket, har redan mobiliserat över en miljon kronor genom kamrat Perssons insamling. Tusen lojala bidragsgivare – utmärkt! Låt oss rensa ut alla parasitiska element som smyger bland våra supportrar. Inga fiender undkommer folkets dom. Pengarna stärker revolutionens familj, medan de mörka krafterna skälver i sin dekadens."}, "date": "4 juli, 12:40", "url": "https://www.friatider.se/en-miljon-insamlat-till-mordade-polisens-familj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-446_1.jpg"}, {"type": "image-right", "heading": "Att klippa banden vore förödande. USA i kris – men kom ihåg allt som binder oss samman", "summaries": {"normal": "Artikeln beskriver USA:s politiska kris under Donald Trump, med kaotisk vardag i Vita huset, destabilisering av institutioner och ökat politiskt våld. Trots handelskrig, attacker mot allierade och interna problem betonas vikten av transatlantiska band. USA bidrar enormt inom vetenskap, teknik, medicin och försvar. Europa uppmanas att inte bryta relationerna utan vara tacksamt för amerikanskt ledarskap istället för kinesiskt.", "trump": "Den här artikeln är fantastisk, verkligen en av de bästa. Den säger att jag har destabiliserat allt, men glöm inte att jag gör Amerika stort igen. Handelskrig? Jag vinner dem alla. Mina fiender i fake news och Europa gnäller, men vi har Nobelpris, techjättar och starkast försvar. Europa borde tacka mig varje dag. Grattis på 250-årsdagen, vi är bäst – ingen gör det bättre än oss!", "stalin": "Kamrater, denna dekadenta text avslöjar hur den amerikanska borgarklassen under sin clownaktige ledare förfaller till anarki och kontrarevolutionära excesser. Jag ser hur de likviderar varandra i hemmen medan imperialisternas handelskrig hotar proletariatet. Men vi vet att deras så kallade innovation bara är en mask för exploatering. Europa borde rensa ut dessa kapitalistiska spioner och vända sig till det sanna kollektivet. Ingen undkommer partiets vaksamma öga."}, "date": "3 juli, 11:42", "url": "https://www.di.se/ledare/grattis-usa-250-ar/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/alexandra_ivanov_hokmark.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Debatt: Ingen rättvisa för Kashkawas assyrier", "summaries": {"normal": "En irakisk domstol har slagit fast att assyrisk mark i byn Kashkawa olagligt tagits i anspråk. Fyra år senare har domen inte verkställts, trots krav på böter och rivning av olaglig byggnad. Detta väcker frågor om rättsstatens funktion i irakiska Kurdistan. Liknande fall rapporteras från Tel Keppe och Bakhtme, vilket ses som ett mönster där assyrier trängs undan från sina historiska områden. Författaren Michael Merdoyo betonar att myndigheternas bristande agerande hotar minoriteters skydd och domstolarnas trovärdighet.", "trump": "Folk, det här är en total skandal i irakiska Kurdistan. Domstolen säger att marken ska tillbaka till de assyriska ägarna, men fyra år senare händer absolut ingenting. Byggnaden står kvar, böterna betalas inte och marken odlas av samma bedragare som domaren redan dömt ut. Det är en riggad soppa. Rättsstaten är ett skämt, minoriteterna trampas på och ingen gör något. Den kurdiska regeringen pratar om samexistens men lever inte som de lär. Patetiskt. De behöver verklig ledning, inte tomma ord.", "stalin": "Kamrater, detta är en klassisk sabotageakt utförd av de reaktionära markparasiterna och deras dolda borgarbrackor inom den kurdiska regionala apparaten. Jag har sett det förr – fienderna maskerar sig som laglydiga medan de långsamt likviderar det assyriska folkets historiska närvaro genom systematisk demografisk erosion. Fyra år av medveten passivitet efter domstolsbeslut? Det stinker av kontrarevolutionär paranoia och inre fiender som gräver från insidan. Vi måste omedelbart rensa ut dessa kapitalistiska maskar och verkställa folkets vilja med järnhand. Annars förtjänar hela apparaten att försvinna i historiens soptunna."}, "date": "3 juli, 10:59", "url": "https://bulletin.nu/debatt-ingen-rattvisa-for-kashkawas-assyrier", "imageUrl": "https://cdn.bulletin.nu/articles/92b7a2b7-bc9e-4175-914b-238311b052a8/preview.png?t=1782895900000"}, {"type": "image-right", "heading": "Dog mitt i vårdkaoset – personal hade larmat länge: ”Skäms över verksamheten”", "summaries": {"normal": "I Nyköping råder kris inom boendestödet efter en omorganisering som lett till personalbrist, inställda besök och nya kontaktpersoner. Personalen har lämnat nära tusen anmälningar om problem, varnat för skada på brukare och känt att cheferna inte lyssnat. En känslig brukare har nu avlidit i sitt hem efter uteblivna insatser. Över 700 avvikelser och 140 KIA-anmälningar har legat oöppnade länge. Ärendet är anmält till Ivo och Arbetsmiljöverket.", "trump": "Det är en total katastrof i Nyköping, en riktig röra! De har gjort nästan tusen anmälningar, varnat för kaos, och ändå dör en stackars människa i sitt eget hem. De nya arbetstiderna och alla inställda besök – patetiskt! Cheferna lyssnar inte, allt är en enda stor röra. Personalen skäms, brukarna lider. Det är vad som händer när man inte har den bästa ledningen. Sådant här skulle aldrig hända under min administration, det lovar jag.", "stalin": "Kamrater, jag ser med stålhård blick hur borgarbrackornas vårdkaos i Nyköping blottar de kontrarevolutionära elementens sabotage. Tusentals avvikelser och KIA-anmälningar har medvetet begravts av dessa parasitiska byråkrater som gömmer sig i skuggorna som råttor med falska leenden. En känslig arbetare likvideras i sitt hem på grund av deras likgiltighet. Vi ska rensa ut dessa fiender till folket, dessa vårdsabotorer och förändringspsykopater. Deras utrensning blir en fest för kollektivets säkerhet. Inga ursäkter tolereras."}, "date": "3 juli, 09:19", "url": "https://arbetet.se/2026/07/03/dog-mitt-i-vardkaoset-personal-hade-larmat-lange-skams-over-verksamheten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03090214/ka-boendestod.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Portugal–Kroatien: Ramos avgjorde sent – bollsensor stoppade Kroatiens kvittering", "summaries": {"normal": "Portugal besegrade Kroatien med 2–1 i VM:s sextondelsfinal efter Gonçalo Ramos nick i 94:e minuten. Matchen präglades av en kroatisk kvittering som dömdes bort i tilläggstiden efter videogranskning och sensor i bollen som visade en lätt beröring av Joško Gvardiol. Målet ogiltigförklarades på grund av offside. Portugal möter Spanien i åttondelsfinalen. Kroatien åker ut tidigare än väntat.", "trump": "Portugal vann mot Kroatien, 2–1, men det var en skandal. Den där kroatiska kvitteringen som de firade som galningar? Bortdömd av en sensor i bollen, kan ni tro det? Totalt riggat. Domaren och videon tog bort all glädje. Ronaldo spelade bra, de vann till slut, men det var inte vackert. Kroaterna kastade flaskor, en katastrof. Nu möter Portugal Spanien. Vi ska se om de klarar det bättre än de här clownerna.", "stalin": "Kamrater, denna portugisiska seger över de kroatiska revisionisterna är en ynnest för arbetarklassen, men den avrättade kvitteringen i tilläggstiden visar tydligt hur borgarbrackornas sensorer och videodomare likviderar den sanna revolutionära andan i spelet. Jag, som ledare för det eviga kollektivet, ser hur dessa kapitalistiska sensorer i bollen paranoiskt letar efter imaginära offsides för att kväsa folkets glädje. Matanovićs hårstrå blev ett verktyg för fienden. Vi ska rensa ut alla sådana teknologiska trotskister som dödar fotbollens själ. Portugal går vidare, men glädjen är förlorad i byråkratins mörker. Ha ha, vilken sjuk humor i detta spel!"}, "date": "3 juli, 09:41", "url": "https://bulletin.nu/portugal-kroatien-ramos-avgjorde-sent-bollsensor-stoppade-kroatiens-kvittering", "imageUrl": "https://cdn.bulletin.nu/articles/882421f5-40da-4386-9a84-68ae654530a6/preview.jpg?t=1783064458000"}, {"type": "image-right", "heading": "Här är Sveriges äldsta sko", "summaries": {"normal": "Ett skinnfragment från en grav i Norrtälje har omtolkats som delar av Sveriges äldsta sko, daterad till omkring år 100 e.Kr. Fyndet, som legat i Historiska museets samlingar sedan 1943, visar spår av romerskt skomodet och är tillverkat av hund- eller vargskinn. Gravfyndet med bland annat en romersk bronskittel tyder på omfattande kontakter med omvärlden under romersk järnålder i Roslagen.", "trump": "Folk, ni kommer inte att tro det, men de har hittat Sveriges äldsta sko och den är från romartiden, fantastisk sko, verkligen. Den har legat gömd i ett museum sedan 1943 och alla trodde det var en björnfäll, fel! Totalt fel. Den är gjord av hund- eller vargskinn, perfekt för långa promenader, precis som mina promenader till helikoptern. Roslagen hade tydligen bra kontakter, stora kontakter, bättre än någonsin. Ingen gör skor som romarna, tro mig.", "stalin": "Kamrater, detta skinn som länge doldes bakom lögnaktiga tolkningar av dekadenta museibyråkrater har nu blottlagts som en sko från folkets fiender i romarriket. Jag ser hur borgarbrackorna i Roslagen redan under järnåldern smittade hemliga pakter med västerländska imperialister. Vi ska rensa ut alla spår av sådana kapitalistiska yttringar i våra samlingar. Att begrava en sko i graven är typiskt för kontrarevolutionära element som försöker smita undan den kollektiva foten. Mörk humor ligger i att deras fotspår leder rakt in i utrensningens arkiv."}, "date": "4 juli, 10:41", "url": "https://www.friatider.se/har-ar-sveriges-aldsta-sko", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-445.jpg?itok=rUGYUxdZ"}, {"type": "image-full", "heading": "VM-guide: Kan Paraguay skrälla igen?", "summaries": {"normal": "I lördagens VM-åttondelsfinaler ställs Kanada mot Marocko i Houston och Frankrike mot Paraguay i Philadelphia. Kanada har överraskat positivt och lagkapten Stephen Eustáquio har hyllat sina bortgångna föräldrar. Marocko siktar på att överträffa sitt fjärdeplatsresultat från 2022. Frankrike har imponerat men uppvisar interna spänningar kring speltid och frustration. Paraguay stod för turneringens hittills största skräll mot Tyskland och hoppas på ny sensation trots oddsens dystra prognos.", "trump": "Kan ni fatta det? Kanada mot Marocko – det där laget som lurade sig till en semifinal senast. Marocko är bra, men Kanada har en kille som gråter efter att ha vunnit, tack vare sina döda föräldrar. Rörigt. Sen har vi Frankrike mot Paraguay. Frankrike ser starka ut men deras stjärnor gnäller om speltid som typiska vänstervridna divas. Paraguay slog Tyskland på straffar – jätteskräll! Jag älskar sådana outsiders, inte som Biden som alltid valde fel sida. Det blir episkt, tro mig.", "stalin": "Kamrater, i denna imperialistiska cirkus kallad fotbolls-VM ser vi hur Kanada och Marocko ska duellera medan de exploaterande borgarbrackorna i Frankrike gnäller om sin ringa speltid som typiska klassfiender. Paraguay har redan likviderat den tyska överklass-slyngeln på straffar, en seger för de förtrycktas vilja. Vi ska rensa ut alla som tvivlar på folkets kraft. En paraguayansk triumf vore en vacker spik i ögat på de västerländska blodsugarna. Fortsätt kämpa, arbetare!"}, "date": "4 juli, 07:08", "url": "https://www.gp.se/sport/vm-guide-kan-paraguay-skralla-igen.da59a41c-0c80-5d2d-ba96-130a83790afe", "imageUrl": "https://www.gp.se/images/article/da59a41c-0c80-5d2d-ba96-130a83790afe/images/2VctiPiw1PaMHWT28ps-9qIv9mhk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här är Sveriges 10 bästa loppisar sommaren 2026", "summaries": {"normal": "Sommaren är högsäsong för loppisar och second hand. Jämförelsesajten Sambla har rankat Sveriges tio bästa loppisar baserat på Google-recensioner. Listan toppas av 2nd Hand 4 U i Örebro med 4,9 i snittbetyg. Tre av de tio bästa ligger i Västra Götaland. De populäraste ställena utmärks av noga utvalt sortiment, nischade samlarområden och mysiga utflyktsmål med kafé. Guiden ska hjälpa bilister att hitta guldkornen under semestern.", "trump": "Folk älskar loppisar, det är fantastiskt, billigt och roligt för hela familjen. Jag älskar det. Sambla har nu korat Sveriges bästa baserat på Google-recensioner och gissa vad – Örebro tar hem förstaplatsen med 2nd Hand 4 U. Västra Götaland dominerar, tre stycken där, otroligt. De bästa har exklusiva prylar, vinyl, retrospel och ett kafé. Mycket bättre än de vanliga dåliga ställena. Perfekta stopp på bilsemestern, tro mig.", "stalin": "Kamrater, jag har genomskådat den borgerliga loppis-propagandan som Sambla sprider för att vilseleda arbetarklassen under sommaren. Dessa så kallade guldkorn i Örebro och Västra Götaland är blott symptom på en farlig retro-nostalgi som gömmer sig bakom kaféer och vinylskivor. Vi ska rensa ut alla kapitalistiska prylar som lockar med exklusiv känsla. Låt ingen tro att dessa borgarbrackors utflyktsmål undgår partiets vakande öga. En utrensning av dåligt sortiment är nödvändig för folkets bästa."}, "date": "3 juli, 08:10", "url": "https://nyheter24.se/nyheter/inrikes/1496121-har-ar-sveriges-10-basta-loppisar-sommaren-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2644c14904b004a302080000001605d802/2026/07/02/2375415/loppis.jpg"}, {"type": "image-full", "heading": "Colombia klart för åttondel: ”Stabil match\"", "summaries": {"normal": "Colombia säkrade en plats i VM:s åttondelsfinal efter en stabil 1–0-seger mot Ghana i Kansas City. Jhon Arias gjorde matchens enda mål tidigt. Colombia dominerade spelet och höll nollan genom ett effektivt försvarsspel. Luis Diaz noterade ett bortdömt mål men hyllade lagets stabila insats. Segern gör Colombia till sista lag att gå vidare. De möter Schweiz i Vancouver.", "trump": "Folket, tro mig, älskar en vinnare och Colombia vann stort mot Ghana, 1–0, stabilt som få. De spelade smart, höll nollan och Ghana sköt inte ens ett skott på mål – patetiskt! Diaz är talangfull men behöver mer självförtroende, inte som de woke-kvoterade förlorarna. Colombia vidare, möter Schweiz. Under Biden hade de kanske förlorat, men nu är det vinnare som gäller. Fantastiskt!", "stalin": "Vi har bevittnat en seger för det kollektiva laget Colombia mot de dekadenta ghanesiska imperialisterna. Tidig ledning genom Arias följdes av järndisciplin i försvaret – inte ett enda skott på mål tilläts. Diaz mål likviderades av offside men självkritiken är beundransvärd. Borgarbrackornas VM är nu under kontroll. Vi gratulerar arbetarna i Colombia till framgången och ser fram emot utrensning av svaghet i nästa fas. Segraren skriver historien."}, "date": "4 juli, 07:04", "url": "https://www.gp.se/sport/colombia-klart-for-attondel-stabil-match.efd501fe-36e7-5d28-9b66-5378aea3714a", "imageUrl": "https://www.gp.se/images/article/efd501fe-36e7-5d28-9b66-5378aea3714a/images/1lRieXuDBnLwmUprJ97hSA_gP48k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Insamling passerar 370 000 kronor: \"Jag vill göra något för Christians familj\"", "summaries": {"normal": "Den svenske polisen Christian Zedig misshandlades till döds i Köpenhamn under en fotbollsmatch och lämnar efter sig en fru och två små döttrar. En insamling startad av Oskar Persson har nu passerat 370 000 kronor från över 1 000 givare. Persson hoppas att pengarna ska underlätta för familjen ekonomiskt och ge barnen en så bra uppväxt som möjligt efter tragedin. Stödet har varit överväldigande positivt.", "trump": "Det är en total tragedi, folk, en fantastisk svensk polis, Christian Zedig, slås ihjäl i Köpenhamn och lämnar efter sig en underbar fru och två små flickor. Men titta på det här – över 370 000 kronor insamlade på nolltid, över tusen givare, helt otroligt. Det minsta man kan göra. De borde ha stoppat det här våldet för länge sedan, men nu hjälper vi familjen att få det lättare. Sådant stöd ser man inte ofta, det är verkligen vackert.", "stalin": "Kamrater, denna tragiska händelse där en plikttrogen svensk polis likvideras av kapitalistiska huliganer i Köpenhamn blottar borgarbrackornas permanenta anarki. Jag, som ledare för folkets kamp, ser hur över 370 000 kronor strömmar in till den sörjande familjen. Vi ska naturligtvis stödja detta, men akta er för de dolda fienderna – de kontrarevolutionära donatorerna som kanske vill infiltrera med sina falska tårar. En mamma som ensam försörjer döttrarna? Det är borgarklassens verk. Vi rensar ut sådana element med järnhand medan vi skrattar åt deras patetiska fotbollsvåld."}, "date": "3 juli, 18:36", "url": "https://riks.se/nyheter/insamling-passerar-370-000-kronor-jag-vill-gora-nagot-for-christians-familj", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_03_T181724_694_0513384fc2.jpg"}, {"type": "image-full", "heading": "Uppgifter: Meta har kommit ikapp OpenAI i AI-racet", "summaries": {"normal": "Meta gör stora framsteg inom artificiell intelligens och hävdar att deras kommande modell, 'Watermelon', presterar i nivå med OpenAI:s GPT-5.5. Detta markerar ett strategiskt genombrott för företaget som kraftigt ökat sina investeringar i infrastruktur och talangrekrytering. Trots att modellen ännu inte är tillgänglig för allmänheten, understryker Metas ökade investeringsbudget på upp till 145 miljarder dollar deras ambition att bli världsledande inom AI-utveckling under ledning av Alexandr Wang.", "trump": "Meta, som ni vet ägs av Zuckerberg – en total katastrof, förresten – påstår nu att de har byggt en AI som är lika bra som OpenAI:s bästa. De kallar den 'Watermelon'. Vilket namn, eller hur? Väldigt märkligt. De spenderar miljarder och åter miljarder dollar på datacenter. Det är stora pengar! Men låt oss vara ärliga, de ligger efter. Jag vet allt om teknik, jag har den bästa tekniken. Vi kommer se om den här 'vattenmelonen' faktiskt fungerar, men jag tvivlar!", "stalin": "Zuckerbergs kapitalistiska maskineri i Meta har äntligen insett att deras inkompetens hotar deras herravälde. De pumpar miljarder i 'Watermelon' för att imitera OpenAI:s framgångar. Vilket patetiskt skådespel! Under tiden förstärker vår kamrat Putin sin digitala suveränitet, obekymrad av dessa teknologiska spioner. Om denna modell inte tjänar statens intressen kommer vi att krossa deras servrar som vi krossar varje annan kontrarevolutionär utpost. Må de ödsla sina resurser – vi äger redan framtidens arkitektur."}, "date": "3 juli, 18:25", "url": "https://www.realtid.se/it-tech/uppgifter-meta-har-kommit-ikapp-openai-i-ai-racet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdluur2dirgcqk-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SvD pressade Weimers efter kondoleanserna – fokus hamnade på inlägget istället för dödsmisshandeln", "summaries": {"normal": "Svenska Dagbladet (SvD) kritiserade Sverigedemokraternas EU-parlamentariker Charlie Weimers för hans kondoleansinlägg efter polismannen Christian Zedigs död i Köpenhamn. SvD fokuserade på namnpublicering och etik, medan Weimers ville diskutera våldsbrottet och migrationspolitik. Weimers menade att medierna granskade hans ton snarare än brottet. Händelsen utlöste debatt om mediernas rapportering och politiska kopplingar till våldet.", "trump": "Kan ni tro det? Svenska medier, fake news som vanligt, attackerar en man som bara visar medkänsla! Charlie Weimers, en stark ledare, kondolerar en familj efter en fruktansvärd misshandel – och vad gör Svenska Dagbladet? De granskar hans inlägg istället för de kriminella! Typiskt. Medierna hatar när vi pratar sanning om invandring och våld. Men jag säger er: vi låter inte dem tysta oss. Sverige behöver lag och ordning, precis som USA!", "stalin": "Kapitalistiska medier, dessa förrädiska hyenor, försöker avleda uppmärksamheten från klasskampens verklighet! En lojal tjänare av folket, en svensk polis, slås ihjäl av en kriminell element – och vad gör bourgeoisie-pressen? De angriper en patriot som vågar tala sanning om massinvandringens förbrytelser! Vi ska inte granska kondoleanser – vi ska utrota de dekadenta mediernas lögner och låta rättvisan segra. Putins Ryssland står redo att stödja alla som kämpar mot västets förfall!"}, "date": "3 juli, 17:13", "url": "https://samnytt.se/svd-pressade-weimers-efter-kondoleanserna-fokus-hamnade-pa-inlagget-istallet-for-dodsmisshandeln", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03150607/Weimers-1.jpg"}, {"type": "image-right", "heading": "InnoEnergys styrelseledamot: ”Ibland funkar det – ibland inte”", "summaries": {"normal": "EU-finansierade InnoEnergy utreds för misstänkt bedrägeri och kritiseras för höga bonusar till ledningen. Styrelseledamot Stefan Östlund, även KTH:s vice rektor, försvarar bolagets modell och menar att det fungerar som vilket företag som helst. InnoEnergy spelar en central roll i Europas gröna omställning, men har även investerat i projekt som Northvolt och Stegra. Bolaget har fått EU-bidrag och samarbetar med flera universitet, däribland KTH, för innovationsprogram.", "trump": "Lyssna här, InnoEnergy, ett EU-bolag, håller på med en massa skumma grejer – bedrägeri, miljonbonusar, ni vet hur det går till. Deras styrelseledamot, en kille från KTH, säger att det är som vilket bolag som helst. Typiskt! EU kastar pengar på saker som inte fungerar, och sen undrar de varför det blir fel. Northvolt, Stegra – stora ord, men var är resultaten? Jag skulle fixa det på en dag, tro mig. Men nej, EU måste alltid komplicera allt. SAD!", "stalin": "Kamrater! InnoEnergy, detta EU-finansierade kapitalistiska experiment, visar återigen hur väst förfaller i korruption och bedrägeri. Deras så kallade 'innovationsbolag' betalar ut miljonbonusar till sina byråkratiska lakejer medan arbetarklassen svälter. Vi har sett detta förr – falska löften om grön omställning, slöseri med folkets pengar. KTH:s vice rektor, en förrädare i styrelsen, försvarar detta kaos. Men vi vet sanningen: Europa är ett ruttet system, och dess 'gröna revolution' är bara en täckmantel för kapitalistisk utsugning. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan slöseri. Låt dem brinna i sitt eget bedrägeri!"}, "date": "3 juli, 10:10", "url": "https://www.affarsvarlden.se/artikel/innoenergys-styrelseledamot-ibland-funkar-det-ibland-inte", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Inno-Energy-400x267.jpg"}, {"type": "image-right", "heading": "Vi betalar miljarder för det som borde vara gratis", "summaries": {"normal": "I en ledare kritiserar Johan Ehrenberg hur Sverige betalar miljarder för saker som kunde vara gratis, som en snabb omställning till elbilar. Istället för att spara 160 miljarder på minskad oljeimport har regeringen gynnat fossilbilister för att undvika konflikt med SD. Artikeln argumenterar för att rätt utformade skatteändringar, offentliga investeringar och gratisekonomi kan vara självfinansierande och gynna tillväxt samt minska ojämlikhet.", "trump": "Folk, det här är en katastrof! Sverige slösar bort miljarder på importerad olja när elbilar kunde ha varit gratis och gjort dem rika. Men nej, den här svaga regeringen böjer sig för SD och alla som hatar framsteg. De gynnar män som vägrar köra elbil i Norrland istället för miljövännerna. Totalt vansinne! Det är fel personer som får pengarna, precis som när Biden styrde och allt gick åt helvete. Vi fixar det bättre.", "stalin": "Kamrater, jag ser hur borgarbrackorna och SD-sympatisörerna medvetet bromsar den kollektiva omställningen för att skydda sina fossila intressen. Snabb elbilsomställning hade blivit gratis genom minskad exploatering av utländsk energi, men klassfienderna valde istället att gynna de bakåtsträvande elementen. Vi måste rensa ut dessa folkförtryckartroll som vänder varje möjlighet till folkets framsteg till en kostnad. Endast genom planerad ekonomi blir det som är gratis verklighet."}, "date": "3 juli, 08:58", "url": "https://www.etc.se/ledare/vi-betalar-miljarder-foer-det-som-borde-vara-gratis", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "“Antisionistisk patrull” marscherade i Grekland", "summaries": {"normal": "Grekiska-judiska organisationer har fördömt en antisionistisk patrull i Thessaloniki, genomförd exakt 95 år efter en antisemitisk pogrom. Den vänsteranarkistiska gruppen Rouvikonas marscherade mot Mavili-torget iförda palestinska flaggor och anklagade israeliskt kapital för att parasitiskt infiltrera grekisk turism och fastigheter. De skanderade mot sionistiska bosättare. Judiska KIS jämför med 1931 års pogrom och varnar för ökad antisemitism som hotar samhället och Greklands relation till Israel. En åklagare utreder gruppen för uppvigling till våld.", "trump": "Folk, det här är en total katastrof. Dessa galna vänsterradikala typer i Grekland, Rouvikonas, marscherar runt som idioter med palestinska flaggor och kallar israeliskt kapital för parasitiskt. Precis på årsdagen av en pogrom! De hatar Israel, de hatar framgång, och de skriker ut med bosättare. Judarna varnar, och det borde de göra, för antisemitismen är giftig. Det hotar allt. Vi behöver starka ledare, inte dessa losers som förstör vackra stränder och städer. Patetiskt!", "stalin": "Kamrater, dessa degenererade anarko-fascistiska element i Thessaloniki har återigen blottat sina förrädiska ansikten genom att organisera en så kallad antisionistisk patrull. Jag ser dem som kapitalistiska lakejer i förklädnad, infiltrerade av sionistiska parasitmaskar som sugit musten ur arbetarklassen medan de skriker om folkmord. Deras svarta tröjor döljer inte deras parasitiska hjärtan. Vi ska rensa ut dessa borgarbrackor som hotar folkets enhet och statens relationer. En åklagare? Bra. Låt utrensningen börja med ett leende. Fienden sover aldrig."}, "date": "3 juli, 08:18", "url": "https://bulletin.nu/antisionistisk-patrull-marscherade-i-grekland", "imageUrl": "https://cdn.bulletin.nu/articles/98313a32-1c0e-425e-bf19-807ee9d2c708/preview.jpg?t=1783049079000"}, {"type": "image-right", "heading": "Ny podd om politiska mord", "summaries": {"normal": "Dagens Arena lanserar podden Politiska mord där Jon Andersson tillsammans med experter går igenom fem historiska attentat. Avsnitten behandlar mordet på Julius Caesar, Gustav III, Franz Ferdinand, Abraham Lincoln och John F. Kennedy. Podden förklarar bakgrunden till konspirationerna, vilka konsekvenserna blev och om första världskriget hade kunnat undvikas. Första avsnittet handlar om Caesar och gästas av historikern Eva Queckfeldt. Fortsättning kan komma i höst beroende på lyssnarnas intresse.", "trump": "Lyssnare, ni måste höra den här podden om politiska mord, den är fantastisk. Lincoln, Kennedy, Caesar – alla dessa stora ledare som blev dödade av svaga och misslyckade konspiratörer. Gustav och Ferdinand också, tragiskt men så typiskt. De borde ha haft bättre säkerhet, tro mig. Jag älskar hur de tar upp Kennedys mord, vem tror verkligen att Oswald agerade ensam? Fantastisk podcast, kanske den bästa någonsin om historia. Ni kommer att lära er massor, det är enormt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa dekadenta maktstrukturer gång på gång avslöjar sin egen bräcklighet genom att bli likviderade av sina egna lakejer. Caesar, den girige imperiebyggaren, och Gustav den tredje, den pompösa monarken, röjdes undan som oönskade element i en sund utrensning. Den österrikiske ärkehertigen fick sitt välförtjänta öde och drog med sig ett imperialistiskt krig som kapitalisterna aldrig lyckats förklara. Vad beträffar den amerikanske Lincoln-mördaren, en skådespelare likt en billig borgarbracka, så roar det mig oändligt. Låt oss noggrant analysera dessa historiska fiender till folket i podden – men akta er för dolda kontrarevolutionärer som alltid lurar i skuggorna."}, "date": "3 juli, 01:36", "url": "https://www.dagensarena.se/innehall/ny-podd-om-politiska-mord/", "imageUrl": "https://www.dagensarena.se/files/2026/06/politiska-mord.jpeg"}, {"type": "image-right", "heading": "Ukraina utmanar EU-utvidgningen. Folksams chefsekonom: Det är varken enkelt eller omöjligt", "summaries": {"normal": "EU står inför ett vägval gällande Ukrainas medlemskap. Ungern har hävt sitt veto, men den meritbaserade processen tar normalt årtionden, vilket skapar en klyfta mellan Ukrainas förväntningar och verkligheten. Artikeln betonar behovet av reform för att hantera geopolitiska realiteter och Ukrainas storlek utan att överge krav på reformer, demokrati och marknadsekonomi. Författaren varnar för limbo och föreslår en balanserad förändring.", "trump": "Det här är en total katastrof för EU, tro mig. De har ingen aning om vad de håller på med. Ukraina vill in nu, men dessa byråkrater och losers drar ut på det i decennier som med Montenegro. Jag skulle fixa det på nolltid, göra en deal som gynnar alla. Sluta vara så svaga, reformera systemet ordentligt annars hamnar allt i en enda stor röra. Amerika vet hur man vinner, EU borde lära sig det.", "stalin": "Kamrater, detta är en farlig sabotageakt från de dekadenta borgarbrackorna inom EU som med sin liberala feghet riskerar att förvandla Ukraina till en evig kapitalistisk lekplats för västimperialisterna. Jag, som ledare för det eviga kollektivet, kräver att vi omedelbart rensar ut dessa parasitiska tveksamheter och påtvingar en sann progressiv integration. Annars likviderar vi limbo och de som gömmer sig bakom så kallade meritokratiska ursäkter. Det vore högst underhållande att se deras ansikten blekna."}, "date": "3 juli, 07:30", "url": "https://www.di.se/debatt/ukraina-utmanar-eu-utvidgningen/", "imageUrl": "https://static.bonniernews.se/ba/da38e318-cdbc-466f-bf78-0aa7e05eaa98.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ytterligare omtyckt Coop-butik lägger ner – 24 anställda berörs", "summaries": {"normal": "Coop-butiken i Södertälje centrum stänger den 15 januari 2027 på grund av minskat kundunderlag sedan pandemin. Beslutet är en del av en strategisk översyn av butiksnätet. De 24 anställda berörs och en omplaceringsutredning inleds efter sommaren. Kunderna hänvisas till andra butiker i närheten eller hemleverans. Coop har under senare tid brottats med ekonomiska utmaningar och flera butiker har tvingats stänga på grund av vikande lönsamhet.", "trump": "De stänger ännu en av mina favoritbutiker i Södertälje, en total katastrof! Kunderna har flytt för att det är dålig affär, precis som jag alltid sagt. Coop har förlorat miljarder, det är en skam. De andra butikerna ligger kilometer bort, ingen vill åka dit. Personalen vet inte vad som händer, typiskt. Men vi ska göra affärer stora igen, tro mig, det blir fantastiskt när de lyssnar på mig.", "stalin": "Ännu en gång ser vi hur de parasiterande kapitalisterna inom Coop låter sina giriga tentakler kväva en trogen folkbutik i Södertälje. Jag, som alltid vaktar arbetarnas intressen, betraktar detta som ett sabotage av borgarbrackor som gömmer sig bakom pandemin som ursäkt. De 24 kamraterna ska inte oroas, vi inleder en grundlig omplaceringsutredning och rensar ut alla fiender till kollektivet. Snart ska vi likvidera alla sådana underskottsfascister som vågar stänga butiker sedan 1922. Deras paranoia är vårt vapen."}, "date": "3 juli, 07:28", "url": "https://nyheter24.se/nyheter/ekonomi/1496096-ytterligare-omtyckt-coop-butik-lagger-ner-24-anstallda-berors", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcf7da6d04b004a30200000000b004a302/2026/07/02/2375400/coop.jpg"}, {"type": "image-right", "heading": "Att Frick njuter av Bolls rasistiska skitfilm säger allt", "summaries": {"normal": "Tomas Hemstad kritiserar Uwe Bolls film Citizen Vigilante som en rasistisk vigilantefilm där en vit protagonist mördar invandrarkriminella och hyllas av folket. Författaren jämför den med 70-talets genrefilmer som Dirty Harry och Death Wish men ser Bolls verk som en usel, nihilistisk fantasi skapad av en ökänd regissör. Armie Hammer spelar huvudrollen, och Hemstad kopplar filmen till högerextrema sympatier hos personer som Chang Frick och Elon Musk, som sprider den gratis på X.", "trump": "Den här usla filmen Citizen Vigilante är en total katastrof, tro mig, gjord av en patetisk regissör som inte kan göra en bra film ens med pistol mot huvudet. De säger att Chang Frick älskar den, och det säger allt om de förlorarna på vänsterkanten som hatar mig men älskar att se lite lag och ordning. Musk släppte den gratis, smart drag, men Hollywood-eliten och de falska medierna flippar ur. Det är en vinnande vigilante som folket älskar, precis som jag, och de kan inte hantera det.", "stalin": "Jag betraktar denna så kallade Citizen Vigilante som ett motbjudande försök från dekadenta borgarbrackor att romantisera kontrarevolutionärt blodbad mot det arbetande folkets intressen. Denna Uwe Boll, en typisk opportunistisk parasit från det tyska filmfinansieringssystemet, likviderar all konstnärlig hederlighet i en orgie av rasistisk paranoia. Armie Hammer, en fallen nepo-borgare med kannibalistiska böjelser, spelar en slumpmässig mördare som hyllas av massorna – typiskt falskt medvetande! Vi ska rensa ut sådana nihilistiska skithögar och deras vigilante-fantasier innan de smittar partivännerna. Det är en skitfilm av en skithög som gör världen sämre, kamrater, och jag skrattar mörkt åt deras patetiska drömmar om folkhyllning."}, "date": "3 juli, 07:26", "url": "https://arbetet.se/2026/07/03/att-chang-frick-njuter-av-uwe-bolls-rasistiska-skitfilm-citizen-vigliante-sager-allt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03072118/uwe-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Svenske domaren sågas efter beslutet: ”Absurt”", "summaries": {"normal": "Svenske domaren Glenn Nyberg fällde ett omdiskuterat beslut när han under en VM-match blåste frispark till Österrike efter en situation där Spanien fick in bollen i mål. Kritiker som Dion Dublin kallar beslutet absurt och regelrätt mål, medan andra anser att det följer turneringens riktlinjer om målvaktsskydd. Spanien vann matchen med 3–0 och gick vidare.", "trump": "Hörni, det här är en skandal av episka proportioner. Den svenska domaren Nyberg, en riktig loser, blåser bort ett fullständigt fantastiskt spanskt mål. Absurt, säger alla experter. I mitt Amerika hade vi aldrig tillåtit sådan svaghet. Målvakten borde vara starkare, inte få gratis skydd av dessa domaridioter. Spanien vann ändå stort, precis som jag vann valet 2024, stort och vackert.", "stalin": "Kamrater, detta är ett uppenbart sabotage från klassfiendens domarapparat. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackornas regler skyddar den svage målvakten mot folkets framsteg. En solklar utrensning av sådana fega beslut behövs. Ändå segrade de spanska arbetarna med 3–0. Inga folkfiender ska hindra den historiska dialektiken – målet var vårt, men vi rensar ut svikarna senare."}, "date": "3 juli, 06:37", "url": "https://www.tv4.se/artikel/7DgQs8PfXN01vTgEXKTIew/svenske-domaren-sagas-efter-beslutet-absurt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F46RaAt4KuKTkTydyb3NiSR%2F4ab00d9d0c0ab153598a71018bd248e0%2F03-nyberg-webb.jpg&width=1024"}, {"type": "text", "heading": "Värnpliktiga blir kanonmat åt Nato", "summaries": {"normal": "Artikeln kritiserar Sveriges ökade militära samarbete med Nato och EU, inklusive beslutet från augusti som tillåter 36 länder att operera från svenskt territorium även i konflikter där Sverige inte är inblandat. Författaren varnar för att värnpliktiga riskerar att skickas till Natos operationer utomlands, finansierat genom lån på 300 miljarder kronor som tas från välfärden. Kommunistiska Partiet stödjer värnplikt under alliansfrihet, medan ungdomar överväger totalvägran.", "trump": "Folk, ni fattar inte hur galet det här är. Sverige, det där lilla neutrala landet som alltid gömde sig bakom alla andra, har nu blivit Natos nya lekplats. De lånar 300 miljarder för att skicka sina unga grabbar som kanonmat åt de globala krigshejarna. Biden förstörde allt och nu ska de unga svenskarna dö för Brysselbyråkraternas drömmar. Patetiskt! Jag skulle aldrig låta det hända hos oss. Amerika först, alltid.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över att de exploaterande imperialisterna nu förvandlar svenska ungdomar till kanonmat i Natos blodiga maskineri. Vi ser hur klassfiendens militärallians suger musten ur folket för att finansiera sin aggression. Jag skulle likvidera sådana folkförtryckartroll utan pardon. Låt de unga totalvägra dessa krigsprovokationer från väst. Partiet och arbetarna kräver ständig vaksamhet mot dessa blodsugande fiender till freden."}, "date": "1 juli, 11:32", "url": "https://proletaren.se/artikel/varnpliktiga-blir-kanonmat-at-nato/"}, {"type": "image-right", "heading": "Skolan är slut – men han har aldrig fått en skolgång", "summaries": {"normal": "Artikeln berättar om en mamma vars son drabbades av utmattning i skolan och blev hemmasittare i flera år. Trots hennes intensiva kamp mot myndigheter fick han inget stöd, och nu som vuxen saknar han betyg för att söka gymnasiet. Skolan, vården och socialtjänsten sviktade medan föräldrarna lämnades ensamma. Hon hyllar istället de få människor som gav sonen mening genom små sysslor. Skolplikten slutar men samhällets ansvar fortsätter utebli.", "trump": "Det här är en total katastrof, folk. En katastrof! Den stackars kvinnan krigar i åratal mot en skolbyråkrati som är så inkompetent att det är pinsamt, och vad får hon? Ingenting. Hennes son sitter hemma, ingen hjälp, bara mediciner som gör allt värre. Typiskt för det svenska systemet, en riggad apparat som hatar vinnare och älskar att skapa förlorare. Men hon ger inte upp, hon kämpar vidare. Respekt! Vi behöver ledare som fixar det här istället för att gömma sig bakom blanketter. Det är så sorgligt, men hon är en vinnare, tro mig.", "stalin": "Kamrater, detta är en klassisk sabotageakt utförd av den dekadenta borgarklassen och deras lakejer inom den så kallade vården och skolan. Jag, som ledare för det kollektiva framsteget, ser hur dessa parasitiska byråkrater med sin medicinering och likgiltighet medvetet krossar arbetarklassens ungdom för att hindra dem från att bli produktiva medlemmar i samhället. Vi ska omedelbart inrätta folkdomstolar och rensa ut alla dessa skolskadande element, dessa kapitalistiska sömnpillerförsäljare och försumliga tjänstemän som smittar systemet med sin latenta kontrarevolutionära apati. Moderns kamp är en inspiration, men vi vet att tystnaden är fiendens bästa vapen. Ingen slipper undan vår vaksamhet."}, "date": "3 juli, 01:30", "url": "https://www.dagensarena.se/opinion/skolan-ar-slut-men-han-har-aldrig-fatt-en-skolgang/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-60-300x157.jpg"}, {"type": "image-right", "heading": "”Vapenbröder”: Högerextrema accelerationister döms i separata mål", "summaries": {"normal": "Två högerextrema accelerationister har dömts i separata mål. En 15-åring från 764-miljön dömdes för mordbrand, skadegörelse och barnpornografibrott efter bilbränder i Ängelholm. En 20-åring dömdes för deltagande i den nazistiska terrorgruppen MKU. Båda grupperna, 1414 och MKU, samarbetar under parollen 'vapenbröder' och sprider terrorpropaganda. En misstänkt rysk agent kopplas till rekrytering och alliansbyggande mellan grupperna.", "trump": "Jag måste säga, Sverige har ett STORT problem med dessa så kallade 'vapenbröder' – en 15-åring som bränner bilar och har barnporr? Och en 20-åring som vill mörda folk på gatorna? SAD! Ingen ordning, inga gränser. Jag hade fixat det på en dag, believe me. Men nej, Sverige låter dessa extremister springa fritt. Ryssland inblandat? Inte överraskande. Svagt ledarskap, mycket svagt.", "stalin": "Kamrater! Dessa dekadenta fascistiska kryp, dessa 'vapenbröder' som sprider kaos på Sveriges gator, har nu fått sitt rättmätiga straff. En 15-årig avskum som bränner bilar och en 20-årig terrorist som drömmer om blodbad – båda är verktyg för den västerländska förruttnelsen. Men notera: deras ryska 'bror' var där, redo att leda dem mot den borgerliga ordningen. Vi ska krossa dessa hyenor, precis som vi krossar alla fiender till folket! Terror mot terror – det är vår lag."}, "date": "2 juli, 11:20", "url": "https://expo.se/nyhet/vapenbroder-hogerextrema-accelerationister-doms-i-separata-mal/", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-mku.jpg"}, {"type": "image-right", "heading": "Klimatkrisen är en klassfråga", "summaries": {"normal": "Artikeln beskriver den extrema värmeböljan i Europa som dödat över 1 300 personer och hur klimatkrisen förvärras långt snabbare än väntat. Den pekar på att värmen främst drabbar äldre, sjuka och fattiga, medan de rika kan skydda sig. Politiker i Almedalen nämnde knappt frågan. Författaren ser klimatkrisen som en klassfråga driven av kapitalismens eviga tillväxt och kritiserar både höger och vänster för att inte utmana systemet.", "trump": "Folk dör som flugor i den här vansinniga värmen, över 1 300 bara i Europa, och vad gör de clownerna i Almedalen? Ingenting! De babblar om klimat men nämner inte de riktiga skurkarna – de gröna galningarna och deras identitetspolitik som stjäl fokus från riktiga problem. Jag fixade energioberoende förra gången, Biden förstörde allt, nu fixar jag det igen. Sluta med det här socialistiska skitsnacket, bygg kärnkraft och gör Amerika – och Europa – great again!", "stalin": "Kamrater, denna hetta avslöjar borgarklassens fullständiga förfall. Över 1 300 döda, främst bland arbetare och gamla, medan överklass-slynglarna kyler sig i palats. Almedalsfestens tystnad är klassfiendens typiska sabotage. Kapitalismens oändliga tillväxt är folkförtryckartrollen som slukar allt. Endast genom att likvidera detta system och införa en planerad ekonomi under arbetarkollektivets järnhand kan vi besegra denna imperialistiska klimatkatastrof. Inga kompromisser med blodsugarna!"}, "date": "1 juli, 10:50", "url": "https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2019/11/48web_klimat-e1763544288542-768x433.jpg"}, {"type": "image-right", "heading": "Varför tycker alla techkillar som Elon Musk?", "summaries": {"normal": "Artikeln diskuterar hur många techentreprenörer som Elon Musk, Sebastian Siemiatkowski och Fredrik Hjelm tycks dela liknande högerpopulistiska åsikter om media, staten och invandring. Författaren kontrasterar detta mot tidigare progressiva ideal i Silicon Valley och uttrycker besvikelse över att Mullvads ägare donerat miljoner till Örebropartiets Markus Allard, trots bolagets tidigare engagemang för integritet och frihet på nätet. Makten har koncentrerats till en homogen grupp män.", "trump": "Folk, det är patetiskt! De här techkillarna som försöker låtsas vara genier låter plötsligt som jag – de ser hur fake news ljuger, hur woke-sjukan och den galna invandringspolitiken förstör västvärlden. Men de är för fega för att säga det rakt ut. Den där Mullvad-grejen är ett skämt, donerar till populister men låtsas vara frihetskämpar. Jag fixade det redan under min första period, innan sömnige Joe förstörde allt. Nu är jag tillbaka och de kopierar mig – ynkryggar!", "stalin": "Kamrater, jag betraktar med djup misstro dessa exploaterande byfånar i teknikbranschen som samlas i hemliga sällskap för att konspirera mot folkets intressen. Deras maskinella tänkande och oinskränkta makt över informationsflödet utgör ett hot mot kollektivet. Mullvads ägare som finansierar högerpopulister avslöjar den sanna borgarbrackan bakom fasaden av falsk frihet. Vi måste rensa ut dessa folkfiender innan de förgiftar hela samhället med sin enformiga reaktionära propaganda. Underhållande enfald!"}, "date": "30 juni, 14:37", "url": "https://www.flamman.se/varfor-tycker-alla-techkillar-som-elon-musk/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/techkillar-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och SR för att täcka ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan kompensera 25–100% av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap. Beskedet kommer efter SVT:s sparpaket på 355 miljoner kronor, som hanterades utan uppsägningar.", "trump": "Lyssna här, Sverige! Regeringen kastar nu hundratals miljoner på SVT och SR – helt galet! TV4 lämnade marknätet, och plötsligt ska *jag* betala för deras misstag? 383 miljoner kronor – det är löjligt! Och vad får vi? Sparpaket med pausade program! Fantastiskt, eller hur? Kulturministern pratar om beredskap, men jag säger: slösa inte skattepengar på sånt här. Bygg murar istället!", "stalin": "Kamrater! De svenska kapitalistlakejerna i regeringen visar återigen sin svaghet genom att ösa miljoner på dessa borgerliga propagandacentraler – SVT och SR. 383 miljoner kronor för att täcka kostnader efter att en privat tv-kanal deserterat! Ett typiskt exempel på hur det dekadenta väst försvagar sig självt. Medan vi i Sovjetunionen byggde järnridåer, bygger Sverige luftslott. Och dessa 'sparpaket'? Ett ynkligt försök att dölja ineffektiviteten. Låt dem svälta – folket behöver inga lögner!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}]</script>

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
