år vi ta saken i egna händer. England, var redo – vi står bakom er, som alltid mot de fascistiska kränkningarna!"}, "date": "16 juli, 06:07", "url": "https://kvartal.se/nyheter/artiklar/argentina-riskerar-fifa-boter-efter-forbjudet-firande/cG9zdDoxNDcyNDI", "imageUrl": "https://images.kvartal.se/2026/07/40374cfe-argentina-firande.webp"}, {"type": "image-right", "heading": "Trendbrott för bankerna: Räntenettot stiger igen", "summaries": {"normal": "De fyra svenska storbankerna SEB, Swedbank, Handelsbanken och Nordea rapporterar ett trendbrott i andra kvartalet. Efter nio kvartal med sjunkande räntenetto vänder siffran nu uppåt sammantaget. SEB och Swedbank slog förväntningarna medan Handelsbanken missade. Analytikerna har reviderat upp vinstprognoserna, vilket bidragit till stigande aktiekurser. Värderingarna har ökat och P/E-talet ligger nu i genomsnitt på 12,7. Högst direktavkastning spås för Handelsbanken nästa år.", "trump": "Det här är fantastiska nyheter, verkligen de bästa bankresultaten på länge. Jag älskar det! Efter två år av fallande räntenetto vänder det uppåt igen, precis som jag alltid sagt att det skulle göra under en stark ekonomi. SEB och Swedbank levererar stora siffror, aktierna stiger. De andra hänger med. Vinsten revideras upp, aktieägarna älskar mig för det. Nordea och Handelsbanken borde göra bättre, men totalt sett är det en enorm succé. Amerika och Sverige vinner stort!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de borgerliga bankmonstrens räntenetto äntligen reser sig ur askan efter år av dekadent förfall. Dessa finansiella parasitmaskar har nio kvartal i rad visat sin svaghet, men nu vänder det. Vi ska dock inte luras. Jag ser redan de dolda fienderna inom Handelsbanken som saboterar med sina undermåliga siffror. Analytikerna reviderar upp vinsterna – typiska opportunistiska lakejer. Vi rensar ut alla som inte levererar maximal avkastning till folket. Nordea värderas för lågt? Misstänkt! Ut med dem alla som inte hyllar kollektivets seger. Hög direktavkastning? Det är vårt verk."}, "date": "17 juli, 11:37", "url": "https://www.affarsvarlden.se/artikel/trendbrott-for-bankerna-rantenettot-stiger-igen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/storbankerna-1200-x-800-px-400x267.png"}, {"type": "image-right", "heading": "Facket varnar för lönesmäll när vårdföretag rundar avtal", "summaries": {"normal": "Humana och andra vårdföretag försöker kringgå det nya kollektivavtalet som från 1 oktober ger deltidsanställd vårdpersonal rätt till övertidsersättning. De vill att personalen ska teckna separata timanställningar för extra timmar, något facket varnar för kan leda till att de förlorar upp till hälften av ersättningen. Kommunal ser det som ett sätt att spara pengar och planerar förhandlingar.", "trump": "De här vårdföretagen är totala förlorare, verkligen patetiska. De försöker smita undan övertidsbetalningen med sina smarta kryphål och timanställningar. Personalen blir lurad på pengar, upp till halva ersättningen! Klassiskt. Facket har rätt att vara arga, men jag skulle ha gjort affären så mycket bättre. Ingen vinner på sådana här fega tricks, tro mig.", "stalin": "Kamrater, dessa borgarbrackor inom Humana och deras likar i vården försöker med sin parasitiska slughet kringgå det heliga kollektivavtalet genom att tvinga på de ärliga deltidsarbetarna nya timkontrakt. De vill suga ut arbetarnas svett och blod för att fylla sina giriga kassakistor. Vi ser deras kontrarevolutionära kryphål och skall rensa ut dessa kapitalistiska sabotageörer med järnhand. En sådan förrädisk spariver förtjänar en kreativ utrensning i folkets namn. Det är komiskt hur de tror sig kunna lura partiet."}, "date": "17 juli, 10:57", "url": "https://arbetet.se/2026/07/17/humana-vill-slippa-betala-overtid-facket-varnar-for-lonesmall", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16152138/sdlm76qzpfdbng-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter värmeböljan – vädret kovänder: ”En helt annan femma”", "summaries": {"normal": "Efter en lång värmebölja väntar ett kraftigt väderomslag. Redan under fredagseftermiddagen kan regnskurar dyka upp i västra Sverige. Under lördagen drar ett lågtryck in över södra Sverige med regn, moln och svalare temperaturer. SMHI har utfärdat en gul varning för skyfallsliknande regn i delar av Götaland och Svealand. I norra fjällen kan det bli snö på topparna. Kommande vecka blir kyligare med temperaturer mellan 15 och 20 grader.", "trump": "Folk, ni har haft den underbara värmen, den bästa sommaren på länge, och plötsligt – BAM! – kommer detta hemska väderomslag som ingen behöver. Regn, kyla, översvämningar – en total katastrof från de inkompetenta väderprognoserna som Biden lämnade efter sig. Jag skulle ha fixat det bättre, tro mig. Nu blir det 15 grader och moln i veckor. Patetiskt! Men naturen älskar det visst, säger de. Fake news!", "stalin": "Kamrater, efter den borgerliga värmens falska löften om evig sol kommer nu det folkets regn för att rensa ut torkans fiender och vattenbristen som de exploaterande kapitalisterna framkallat. Vi ser lågtryckets järnhand slå mot södra Sovjet – pardon, Sverige – medan klassfiendens skyfall varnas av byråkrater. Snö i fjällen likviderar vandrarens illusioner. Det är en hälsosam utrensning. Inga värmeböljor inom synhåll. Partiet segrar över vädret."}, "date": "17 juli, 11:02", "url": "https://www.tv4.se/artikel/4Yy7KbBWIk2FKJrFAldsDK/efter-vaermeboeljan-vaedret-kovaender-blir-en-helt-annan-femma", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlUc5jCqWr9pI%2Ff9453140d47aa3eeb393b000b3edef61%2FRegn_vid_Kungsportsplatsen_i_Goteborg._Mer_vantas_i_helgen._Arkivbild&width=120"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "image-right", "heading": "Trump anklagar Kina för valpåverkan i USA", "summaries": {"normal": "USA:s president Donald Trump anklagar Kina för att ha stulit uppgifter om över 220 miljoner amerikanska väljare och avslöjat stora sårbarheter i valsystemet. Påståendena går emot bedömningar från underrättelsetjänsten. Trump hänvisar till tidigare offentliggjorda dokument, varav stora delar redan varit kända. Han har upprepade gånger hävdat valfusk utan att presentera bevis som hållit i domstol. Kritiken riktas särskilt mot Kinas påstådda inblandning under valet 2020.", "trump": "De där kinesiska bedragarna har stuckit fingrarna i vår valurna och snott 220 miljoner filer med era röster, folk. Det är en skandal av episka proportioner, den största datastölden i historien, och mina så kallade underrättelsebyråkrater sov under ratten. Biden var en total katastrof, men nu fixar jag det. Inga fler woke-domare eller vänsterextremister som gömmer sanningen. Amerika ska ha ärliga val igen, tro mig!", "stalin": "Kamrater, jag har avslöjat hur de amerikanska imperialisterna själva erkänner sina egna valsystem som genomträngda av fiendens spioner. Den kinesiska folkrepubliken har med rätta plundrat borgarbrackornas väljarregister och blottat deras svaghet. Inga tekniska hinder för arbetarklassen! Vi ska rensa ut alla folkfiender som döljer sanningen bakom maskade papper. Paranoia är ingen sjukdom, det är ett vapen mot klassfiendens lögner. Lev länge, segern tillhör oss!"}, "date": "17 juli, 10:16", "url": "https://www.tv4.se/artikel/tt-260717-usatrumptal1-8da6ae4e/trump-anklagar-kina-for-valpaverkan-i-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlfI9oHaFeYyc%2F28ef73b7e334a66614af856a000ba55b%2FDonald_Trump_pa_en_bild_fran_tidigare_i_veckan.&width=120"}, {"type": "image-right", "heading": "”Arbetare ska inte behöva dö i värmen”", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin skriver att extremvärmen är en klassfråga. Arbetare drabbas värst av hettan, särskilt inom vård och skola, medan andra kan söka svalka i luftkonditionerade miljöer. Artikeln lyfter att 67 arbetare dog av värmen i EU 2020 och kräver maxgränser för arbetstemperaturer, pauser och anpassade arbetstider. Författarna kritiserar Tidö-regeringen för att missa klimatmål och satsa mer på olja än kollektivtrafik, och förespråkar en rödgrön regering med ambitiös klimatpolitik.", "trump": "Hörni, den här artikeln är en total katastrof. Vänsterpartiet gnäller om värme och arbetare som dör, men det är bara deras gröna vansinne som förstör allt. Europa kokar för att de har usel energi och galna regler. Jag byggde den starkaste ekonomin, och nu vill de ha pauser och maxgrader? Patetiskt. Vi behöver riktig ledarskap, inte dessa losers som hatar olja och älskar att straffa vanliga människor. Sverige borde göra som jag – vinna stort och glömma det här socialistiska värmeskrämslet.", "stalin": "Kamrater, denna värmekupol är en direkt följd av de dekadenta borgarbrackornas vanskötsel av produktivkrafterna. Jag ser hur de kapitalistiska parasiterna gömmer sig i sina kylda palats medan arbetarna likvideras långsamt i fabriker och välfärdsinrättningar. 67 döda 2020? Det är en fiende inom murarna, en sabotagegrupp av klimatskeptiska reaktionärer som infiltrerat Rosenbad. Vi ska rensa ut alla dessa värmefascister, införa stränga temperaturdekret och likvidera varje tendens till klassförräderi. Endast det kollektiva järnhandslagets politik kan besegra denna fiende. Den som svettas mest ska belönas med medalj – de andra med utrensning."}, "date": "17 juli, 09:56", "url": "https://arbetet.se/2026/07/17/arbetare-ska-inte-behova-do-i-varmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17095118/debatt-v.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kunderna rusar till Elgiganten – alla villl ha sommarfavoriten", "summaries": {"normal": "Svenskarna köper allt fler glassmaskiner hos Elgiganten i sommar. Intresset har ökat explosionsartat eftersom fler vill göra egen glass hemma för att styra innehållet, minska socker och öka protein. Högre priser i butik och att köksmaskiner blivit vanliga bidrar. Populära modeller som Ninja Creami gör det enkelt att skapa glass, gelato och sorbet i oändliga varianter.", "trump": "Folk älskar glass, det är fantastiskt, men nu köper svenskarna plötsligt massor av glassmaskiner istället för att bara gå till affären. Det är en enorm succé, tror ni mig, explosionsartad ökning. De vill inte betala de höga priserna som de usla butikerna tar ut. Med maskinerna kan de göra sin egen glass varje dag, lägga i protein, skippa sockret, helt ypperligt. Jag älskar det, verkligen smarta människor.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de svenska arbetarna vänder ryggen åt de giriga kapitalisternas industriella glassfabriker och i stället omfamnar hemmets produktionsmedel. Vi skall likvidera alla borgarbrackornas sockerspioner som gömmer sig i frysdiskarna. Med dessa maskiner kontrollerar folket själv sin glassproduktion, berikar den med protein och utrotar det kontrarevolutionära sockret. Den som föreslår vanilj från västliga sabotörer skall rensas ut med största glädje. Perfekt plan, kamrater."}, "date": "17 juli, 13:05", "url": "https://nyheter24.se/nyheter/konsument/1499240-kunderna-rusar-till-elgiganten-alla-villl-ha-sommarfavoriten", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9aae7e1b04b004a30200000000b004a302/2026/07/17/2378639/Elgiganten.png"}, {"type": "image-full", "heading": "Varningen: Har du kontanter hemma? Kontrollera sedlarna nu", "summaries": {"normal": "Falska sedlar dyker upp allt oftare i svenska butiker, särskilt under sommaren då ovana vikarier arbetar i kassorna. Bedragare betalar ofta med förfalskade 500-kronorssedlar för billiga varor och tar ut riktiga pengar i växel. Svensk Handel får in flera anmälningar varje vecka. Experter uppmanar både handlare och privatpersoner att kontrollera sedlar genom att vicka på dem och känna efter säkerhetsdetaljer som rörliga bilder, färgskiftningar och upphöjt tryck. Misstänkta sedlar ska inte tas emot och händelser polisanmälas.", "trump": "De här falska sedlarna som dyker upp i era svenska butiker är en katastrof, folk. En total skam. Bedragarna kommer in med sina bluff-500-lappar, köper en massa skräp och springer därifrån med era riktiga pengar. Det är så lätt att se, men era kassörer sover. Mina sedlar, de bästa sedlarna, har otroliga säkerhetsfunktioner som ingen kan kopiera. Vicka på dem! Kolla kronan! Ni måste vara smarta, annars blir ni lurade av de fega förlorarna som gör det här.", "stalin": "Kamrater, dessa usla förfalskade sedlar som plötsligt dyker upp i våra butiker är inget annat än en listig sabotageaktion utförd av borgarbrackor och kontrarevolutionära valutaskojare. Vi ser hur de med sina falska 500-lappar lurar arbetarklassen på äkta medel. Jag kräver omedelbar vaksamhet och utrensning av alla som inte genast vickar på sedeln för att avslöja de röda bandens sanna rörelse. Den som misslyckas med att känna det upphöjda porträttet är en potentiell folkfiende. Vi ska likvidera detta hot mot folkets ekonomi med järnhand och ett leende."}, "date": "17 juli, 12:34", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1499230-varningen-har-du-kontanter-hemma-kontrollera-sedlarna-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a1807ab304b004a30200000000b004a302/2026/07/17/2378617/falska-sedlar.png"}, {"type": "text", "heading": "30 grader – sedan halveras temperaturen", "summaries": {"normal": "SMHI varnar för höga temperaturer över 30 grader i södra Sverige, men värmen blir kortvarig. Redan fredag kväll drar ett lågtryck in med regn, blåst och kraftigt fallande temperaturer. Under helgen kan det bli ner till 12–15 grader i Götaland, vilket i kombination med regn kan kännas som höst. Den gula varningen gäller till klockan 20 på fredagen.", "trump": "Folket i södra Sverige har njutit av underbar värme, över 30 grader, men nu kommer det en katastrof. De fega väderprognoserna säger att det ska bli kallt, regnigt och hemskt i helgen, kanske bara 12 grader. Det är en total skam! Precis när folk har det bra slår det om. Men vi ska vända det, tro mig, det blir stort igen.", "stalin": "Kamrater, den dekadenta värmen som borgarbrackorna njutit av i södra Sovjetrepubliken Sverige är nu dömd till undergång. Jag, som ledare för det ofelbara kollektivet, befaller att ett lågtryck av proletär rättvisa sveper in över Östersjön och likviderar den falska hettan med regn, kyla och ideologiskt korrekt blåst. Den som klagar på 12 grader är en kontrarevolutionär höstförnekare som bör rensas ut omedelbart. Det känns som höst? Utmärkt – vintern kommer alltid!"}, "date": "17 juli, 09:39", "url": "https://bulletin.nu/30-grader-sedan-halveras-temperaturen"}, {"type": "image-right", "heading": "Obducerade säl utan ansiktsskydd — farlig smitta fanns i varböld", "summaries": {"normal": "Vid en obduktion av en vikare på Naturhistoriska riksmuseet upptäcktes brucella, ett smittämne i riskklass 3 likt hiv och tuberkulos. Sälens varböld innehöll bakterien, som dock var avdödad efter frysförvaring. Arbetsmiljöverket har efter inspektion krävt bättre skyddsutrustning, inklusive visir, samt förbättrade riskbedömningar och utbildning. Museet tar emot döda sälar för övervakning av deras hälsa, och fallet anmäldes som ett allvarligt tillbud.", "trump": "Kan ni tro det? De obducerar en säl i Sverige och plötsligt dyker den farligaste bakterien upp, samma risk som hiv, och ingen har ens ett ansiktsskydd på sig! Totalt misslyckande. De borde ha vetat bättre, men nej, de fryser sälen och tror att allt är under kontroll. Arbetsmiljöverket måste nu sparka in dörrar och kräva visir och riktig utbildning. Så patetiskt. Vi gör allt bättre här, tro mig.", "stalin": "Kamrater, jag betraktar med stigande vrede hur denna degenererade vikare, infiltrerad av parasitiska plattmaskar och dolda brucellabakterier, smugglades in i vårt sovjetiskt inspirerade frysrumsystem för att underminera arbetarnas hälsa. Denna varböld var uppenbarligen en sabotagehandling från borgarbrackornas parasitiska lakejer. Utan visir! Vi kräver omedelbar utrensning av slarviga rutiner, likvidering av alla risker och evig vaksamhet mot de dolda fienderna inom arbetsmiljön. Paranoia är ingen sjukdom, det är överlevnad. Hälsa åt kollektivet, döden åt odugliga skyddslösa obducenter!"}, "date": "17 juli, 06:00", "url": "https://arbetet.se/2026/07/17/obducerade-sal-utan-ansiktsskydd-farlig-smitta-fanns-i-varbold", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16103136/vikare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.55&fp-y=0.5"}, {"type": "image-right", "heading": "Beskedet: Sveriges våldsvänster portas från USA", "summaries": {"normal": "USA inför nya visumrestriktioner mot utländska medborgare som stödjer eller deltar i vänsterextremt våld, terrorism och sabotage. Utrikesminister Marco Rubio informerade representanter från över 60 länder, däribland Sverige, om åtgärderna. Restriktionerna gäller bland annat personer som uppmanar till terrorism, finansierar våld eller samordnar attacker. Rubio beskrev vänsterextrema grupper som sammanlänkade nätverk som använder bombdåd och lönnmord för att undergräva fria samhällen. Fler terrorstämplingar är på gång.", "trump": "Vi stänger dörren för de galna vänsterextremisterna som hatar Amerika och vår civilisation. De får inte komma in med sina bomber, mord och sabotage längre. Jag har sagt det hela tiden – de är fiender till allt som är bra och fritt. Sverige var där på mötet, de vet vad vi menar. Vi stämplar dem som terrorister, erbjuder miljoner i belöning och gör det riktigt tufft. Fantastiskt besked, ingen har gjort det bättre än oss!", "stalin": "Kamrater, jag har länge varnat för dessa degenererade borgarbrackor och deras så kallade vänsternätverk som i själva verket är kapitalisternas maskerade lakejer. Nu rensar vi ut dem från våra gränser med järnhand. Deras bombdåd, lönnmord och ekonomiska sabotage är ett tydligt bevis på den imperialistiska parasitens sista, desperata konspiration. Vi likviderar deras logistiska stöd, vi avslöjar deras samordnade celler. Paranoia? Nej, det är bara sund vaksamhet mot fiendens sjuka skratt. Sov gott, arbetare – fienden sover aldrig."}, "date": "17 juli, 16:42", "url": "https://www.friatider.se/beskedet-sveriges-valdsvanster-portas-fran-usa", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-520.jpg"}, {"type": "image-full", "heading": "Skogkär: Dags att ifrågasätta den heliga högre utbildningen", "summaries": {"normal": "Artikeln ifrågasätter om den kraftiga utbyggnaden av högre utbildning i Sverige är samhällsekonomiskt försvarbar. Med omkring 400 000 studenter per år och en tredubbling av högutbildade sedan 1950-talet pekar den på risken för arbetskraftsbrist, sänkta krav och att många utbildningar inte lönar sig ekonomiskt. Författaren föreslår att prioritera praktiska yrken som hantverk istället för onödig akademisering, särskilt då AI hotar rutinjobb.", "trump": "Folk, vi har ett enormt problem med de här universiteten. De pumpar ut hundratusentals studenter som sitter i skolbänken i femton år medan vi saknar folk som faktiskt jobbar. Det är en katastrof! Högskolorna har sänkt kraven så mycket att många examen är värdelösa, de lönar sig inte ens. Vi behöver elektriker, rörmokare och riktiga arbetare, inte mer teori som AI snart äter upp. Gör Sverige stort igen genom att stoppa detta vansinne!", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbrackornas akademiska svullnad som hotar proletariatets produktivkrafter. Vi har låtit opportunistiska reformister fördubbla studentmassan medan den sanna arbetskraften förslösas i meningslösa teoretiska träskmarker. Denna intellektuella sabotageverksamhet måste rensas ut med järnhand. Låt oss likvidera de onödiga fakulteterna, prioritera de praktiska hantverken och återupprätta den socialistiska arbetsdisciplinen. Den som inte producerar är folkets fiende, punkt slut."}, "date": "17 juli, 06:00", "url": "https://bulletin.nu/skogkar-dags-att-ifragasatta-den-heliga-hogre-utbildningen", "imageUrl": "https://cdn.bulletin.nu/articles/e71befb3-f4bf-43eb-8f84-9953c6959df3/preview.jpg?t=1784208365000"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperialister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-full", "heading": "Airbus Racer-helikopter slår hastighetsrekord – miljardstrid väntar", "summaries": {"normal": "Airbus har satt nytt hastighetsrekord för helikoptrar med sin Racer-prototyp som nådde 430 km/h under en flygning i mars. Modellen kombinerar huvudrotor med sidopropellrar, lådvinge och hybridmaterial. Bolaget ser potential inom ambulansflyg, sjöräddning och kommersiell trafik. Rekordet stärker Airbus position inför stora europeiska försvarsupphandlingar fram till 2038, där svenska sparare indirekt påverkas genom fonder. Konkurrens från amerikanska bolag väntas.", "trump": "Lyssnar ni på det här? Airbus flög en helikopter i 430 kilometer i timmen och tror de är stora hjältar. Underbart, eller hur? Men det är bara en PR-grej från de europeiska globalisterna som vill suga åt sig alla försvarsmiljarder. Biden sög i åtta år och lämnade kaos, nu fixar jag det. Racer? Låter som en dålig dragshow. Vi ska bygga de bästa maskinerna, inte dessa kvoterade europeiska bluffar. Fantastiskt rekord, men orderboken är det som räknas, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna imperialistiska flygmaskin når 430 kilometer i timmen. Racer är en listig leksak byggd av borgarbrackor och exploaterande byfånar inom Airbus för att suga åt sig folkets försvarsmiljarder. Vi ser hur den kapitalistmaffian positionerar sig inför den kommande upphandlingskarusellen. En rejäl utrensning av sådana klassfiender vore på sin plats. Rekordet är en ynkelig PR-vinst från folkförtryckartrollen som darrar inför arbetarkollektivets vrede."}, "date": "17 juli, 19:38", "url": "https://www.dagensps.se/bors-finans/airbus-racer-helikopter-slar-hastighetsrekord-miljardstrid-vantar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-1-22.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Avslöjad: Ryske spionen nära Stockholm", "summaries": {"normal": "Rysslands EU-ambassadör Karen Malayan har enligt Euobserver nära kopplingar till spionage och underrättelseverksamhet. Han har starka band till Alexander Rogov, rysk konsul på Åland, som enligt finsk underrättelsetjänst försökt påverka åländska politiker. Rogov rapporterar regelbundet till sin chef i Helsingfors och har historik av kontakter med utvisade ryska spioner. Malayan efterträdde en tidigare ambassadör som också pekats ut för spioneri.", "trump": "Titta på de här ryska spionerna som springer runt i Europa som råttor i en soppkök. Malayan och den där skumma Rogov på Åland, totala losers, träffas varannan månad för att plottra. Biden sov medan de byggde upp nätverk, men nu är jag tillbaka och vi ser allt. Patetiska typer som försöker underminera väst, fast de inte ens kan sköta ett konsulat utan att bli avslöjade. Sad!", "stalin": "Dessa imperialister och folkfiender inom den borgerliga diplomatkåren spinner sina lögnvävar över Europa. Jag ser hur klassfiendens lakejer Malayan och Rogov utbyter instruktioner som förrädiska brevduvor. Varannan månad till Helsingfors – typiskt kapitalistmaffians paranoia! Vi ska rensa ut sådana blodsugande element som hotar statens intressen. Deras patetiska försök att infiltrera demilitariserade öar väcker bara förakt och munterhet hos partivännerna."}, "date": "17 juli, 19:34", "url": "https://www.dagensps.se/varlden/avslojad-ryske-spionen-nara-stockholm/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/a86a3169-671d-4c52-aec8-bf65828ac857.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Merz varnar USA för att blanda sig i tyska val", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz varnar USA för att blanda sig i de tyska delstatsvalen i september. Varningen kommer efter att USA:s utrikesdepartement utlyst bidrag på upp till tre miljoner dollar till europeiska organisationer som arbetar med frågor som nationell suveränitet, migration och censur. Merz betonar att utländsk finansiering av politiska partier är förbjuden i Tyskland och att han inte vill se någon amerikansk inblandning. USA förnekar att pengarna ska gå till partier.", "trump": "Hör ni på, det här är helt galet. Den tyske ledaren Merz kommer och gråter över att vi skulle blanda oss i deras val. Vi ger bara lite stöd till folk som älskar suveränitet och hatar censur, precis som vi gör här hemma. De borde tacka oss istället för att gnälla. Vi lägger oss inte i deras affärer, men om de vill ha hjälp mot de galna vänstertyperna så fixar vi det. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i Washington tror sig kunna muta sig in i våra europeiska brödrars val med sina smutsiga dollar. Jag ser genom deras fega maskerad av så kallat civilisationsarv. Inga kapitalistiska tankesmedjor eller utländska agenter ska förgifta folkets vilja. Vi måste omedelbart rensa ut alla sådana kontrarevolutionära element innan de sprider sin parasitiska ideologi vidare. Paranoia? Nej, det är bara sund vaksamhet inför klassfiendens eviga svek."}, "date": "17 juli, 15:41", "url": "https://www.friatider.se/merz-varnar-usa-att-blanda-sig-i-tyska-val", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-518.jpg?itok=V_G1-av2"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-right", "heading": "Vita huset: Trump ”öppen för diplomati”", "summaries": {"normal": "USA genomförde den femte kvällen i rad attacker mot iranska mål, bland annat kring Bandar Abbas och ön Qeshm. Vita huset upprepar att president Trump är öppen för diplomati men inte accepterar iranska attacker mot fartyg i Hormuzsundet. Iran har svarat med drönarattacker mot amerikanska baser i Bahrain, Kuwait och Jordanien. Trump hotar med utökade attacker mot energianläggningar om Iran inte återvänder till förhandlingsbordet. I juni slöts en vapenvila mellan länderna.", "trump": "Vi slår till mot Iran för femte kvällen i rad och de hatar det. Centcom gör ett fantastiskt jobb. Jag är alltid öppen för diplomati, de säger att de vill göra en deal, men jag tillåter inte att de beskjuter fartyg i sundet. Jordanien, Bahrain och Kuwait får drönare i huvudet för att de har våra baser. Om de inte kommer till förhandlingsbordet väntar broar och oljeanläggningar. De kommer att tigga om fred, tro mig.", "stalin": "Kamrater, vi har bevittnat hur de amerikanska imperialisterna med sin clownaktige ledare inleder den femte nattens banditattacker mot det iranska folkets hamnar och öar. Jag, som alltid vakar över arbetarklassen, noterar med mörk glädje hur borgarbrackorna i Washington pratar om diplomati samtidigt som de blockerar sjöfarten. Deras paranoia driver dem att hota energianläggningar, ett brott mot alla progressiva krafter. Låt oss rensa ut dessa dekadenta kapitalister innan deras lögner förgiftar hela regionen. De kommer att likvideras av sin egen girighet, kamrater. Ha ha."}, "date": "16 juli, 22:06", "url": "https://www.di.se/nyheter/vita-huset-trump-oppen-for-diplomati/", "imageUrl": "https://static.bonniernews.se/ba/2498774f-ca77-41ac-a8dd-8684ca082f4e.jpeg?crop=3733%2C2100%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-right", "heading": "Öl i valstugan ska rädda 1,7-procentpartiet", "summaries": {"normal": "Liberalerna kämpar med historiskt låga opinionssiffror på 1,7 procent. För att locka väljare testar partiet i Uppsala en ny strategi: servera starköl i valstugan, möjligt tack vare en ändrad alkohollag. Syftet är att skapa en avslappnad mötesplats för politiska samtal. Samtidigt visar en ny mätning att 15,2 procent av väljarna är osäkra inför valet, medan Socialdemokraterna går framåt.", "trump": "Kan ni tro det? Liberalerna i Sverige – ett parti som är så svagt att de knappt når över lättölsgränsen i opinionsmätningar! 1,7 procent, svagt, mycket svagt. Men vet ni vad de gör? De börjar sälja öl i valstugan! 'Kom hit, drick och prata politik', säger de. Smart? Kanske. Men jag hade gjort det bättre – jag hade serverat det bästa ölet, fantastiskt öl, och vunnit valet med 90 procent. SAD!", "stalin": "De svenska liberalerna, dessa ynkliga kapitalistiska marionetter, har sjunkit till nya bottennivåer – lägre än alkoholhalten i svagt öl! Men istället för att stärka sin ideologi, väljer de att fördärva massorna med sprit! En valstuga som serverar starköl? Ett desperat försök att locka de förvirrade väljarna. Medan vi bygger en stark socialistisk framtid, leker dessa småborgerliga narrar med alkohol. Vi ska inte dricka oss till makten – vi tar den med järnhand!"}, "date": "17 juli, 14:41", "url": "https://samnytt.se/ol-i-valstugan-ska-radda-17-procentpartiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17121118/valstuga-1.jpg"}, {"type": "image-right", "heading": "Trots Trumps valsågning – inga nyheter i släppta dokument", "summaries": {"normal": "Trots Donald Trumps kritik mot sårbarheter i USA:s valsystem visade de offentliggjorda underrättelsedokumenten inga nya uppgifter. Kina samlade information om väljare men avstod från omfattande påverkan. Rapporter pekar på potentiella hot mot röstningsmaskiner från flera länder, men betonar att systemets decentralisering gör manipulation svår. Anklagelser om fusk vid registrering och felaktiga väljarlistor har inte påverkat valresultat. Experter ser Trumps uttalanden som ett sätt att underminera förtroendet inför kommande val.", "trump": "De här dokumenten bekräftar precis vad jag har sagt hela tiden – vårt valsystem är en total skam, fullt av sårbarheter som fienderna utnyttjar. Kina samlade data om 220 miljoner väljare, maskinerna kunde manipuleras, och listorna är fyllda med döda och icke-medborgare. Ändå låtsas de som inget har hänt. Vi ska ha ID-kort och medborgarskapsbevis, annars fortsätter de rigga valen. Men folket ser igenom det – de förlorade förtroendet för systemet och det är deras fel.", "stalin": "Kamrater, dessa dekadenta dokument avslöjar hur borgarbrackorna och deras imperialistiska lakejer i Washington medvetet lämnar valsystemet öppet för fiendens maskineri. Kina, dessa opportunistiska revisionister, samlar data som hungriga råttor medan kapitalisterna skrattar i skuggorna. Vi ser de döda rösterna, de falska registreringarna och de fem ländernas parasitiska försök att stjäla folkets vilja. Inga bevis? Naturligtvis inte – de gömmer sig bakom decentraliseringens lögn. En sann utrensning av dessa kontrarevolutionära element krävs. Vårt kollektiv skall inte tolerera sådan sabotagehumor från de döda själarna på väljarlistorna."}, "date": "17 juli, 18:23", "url": "https://www.svt.se/nyheter/utrikes/trots-trumps-valsagning-inga-nyheter-i-slappta-dokument", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.49/f1b1799456daa6b490573f166413be1faf665cf5e2755c5c3217721a41561200?template=1d55ui"}, {"type": "image-full", "heading": "Anthropic betalar 5,8 miljoner för rätt ord inför börsnotering", "summaries": {"normal": "Anthropic rekryterar en director inom investor relations med en grundlön på 4,1–5,8 miljoner kronor inför en möjlig börsnotering. Bolaget, värderat till 965 miljarder dollar utan vinst, satsar på att bygga ett investeringsnarrativ. Amazon och Google är stora ägare, vilket ger indirekt exponering för svenska sparare via indexfonder. Frågan är hur bolaget ska uppnå lönsamhet och behålla höga värderingar.", "trump": "Folk, ni tror inte vad jag just läst! Det här Anthropic-bolaget, som inte tjänar en enda dollar, betalar nästan sex miljoner kronor till en enda PR-kille för att ljuga ihop en historia åt Wall Street. Det är klassiskt! De målar in sig i ett hörn med sina galna värderingar. Precis som under Biden-tiden – allt luft och inga resultat. Men jag fixade det förra gången, och nu fixar vi det igen. Fantastiskt, eller hur?", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa borgarbrackor i Anthropic tvingas offra närmare sex miljoner kronor på en enda ideologisk narrativbyggare för att dölja sin parasitiska oförmåga att generera verklig vinst. Deras svindlande siffror är ett monument över den döende kapitalistmaffians desperation. Snart skall vi se hur hela deras luftslott rasar, och då skall utrensningen av sådana folkfiender bli underhållande att bevittna."}, "date": "17 juli, 18:52", "url": "https://www.dagensps.se/bors-finans/borsnoteringar/anthropic-betalar-58-miljoner-for-ratt-ir-person-och-ipo-berattelse/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-5.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Muslimsk influencer stödjer \nutvisningar av grovt kriminella – kvinnor rasar i kommentarsfältet", "summaries": {"normal": "Moosa Assal, en konservativ muslimsk influencer känd som Medinastudenten, förespråkar utvisning av utländska grovt kriminella för att skydda hederliga medborgare. Hans Facebook-inlägg delar kommentarsfältet. Majoriteten stödjer honom, men främst kvinnor kritiserar synsättet. De menar att kriminalitet inte sker i ett vakuum, att problem flyttas till andra länder och att rasism i Sverige bidrar till brottsligheten. Flera anser att straffen bör avtjänas i Sverige.", "trump": "Titta på den här killen Moosa, han säger rakt ut att grova kriminella utlänningar inte ska få stanna här och bygga brottslighet. Smart! Han vill skydda vanliga hederliga människor. Sen kommer alla dessa kvinnor och rasar i kommentarerna, pratar om att allt är komplext och att vi ska ta hand om brottslingarna här. Typiskt, de vill importera problem och sedan klaga. Han har rätt, skicka hem dem, gör Sverige stort och tryggt igen!", "stalin": "Kamrater, jag ser hur denna Moosa Assal med sitt enkla budskap om att rensa ut de utländska banditerna väcker borgarbrackornas vrede. Dessa dekadenta kvinnor i kommentarsfältet, som likt parasitiska element från Kriminalvården, viskar om historier och vakuum medan de i hemlighet planerar att översvämma fosterlandet med brottslingar. Vi ska likvidera sådana fiender till folkets trygghet. Deras paranoia om rasism är bara ett trick från kapitalisterna för att skydda sina kriminella lakejer. Rensa ut dem alla!"}, "date": "17 juli, 15:08", "url": "https://riks.se/nyheter/muslimsk-influencer-stodjer-utvisningar-av-grovt-kriminella-kvinnor-rasar-i-kommentarsfaltet", "imageUrl": "https://admin.riks.se/uploads/image_d9e80c515c.png"}, {"type": "image-right", "heading": "Benjamin Dousas vrede när SD nämner etniska svenskar", "summaries": {"normal": "Flera ministrar i Tidöregeringen kritiserar SD efter att partiets migrationspolitiska talesperson Ludvig Aspling sagt att en stor icke etniskt svensk befolkning orsakar stora problem i Sverige. Aspling kommenterade förslaget om återvandringsbidrag för även svenska medborgare. Biståndsminister Benjamin Dousa (M) med invandrarbakgrund tar starkt avstånd och menar att fokus på etnicitet är felaktigt. Även Romina Pourmokhtari (L), Erik Slottner (KD) och Anna Tenje (M) distanserar sig från uttalandet och betonar att integrationsproblem inte handlar om etnicitet.", "trump": "De där svenska ministrarna är så svaga, totalt patetiska! SD säger bara sanningen om att för många icke-svenskar skapar enorma problem, och vad gör de? De attackerar som vanliga förlorare. Dousa känner sig utknuffad för att han inte är tillräckligt svensk, stackars kille. De borde lyssna på folket istället för att vara politiskt korrekta idioter. Sverige håller på att förstöras, men ingen vågar säga det rakt ut. Patetiskt!", "stalin": "Kamrater, dessa ynkliga borgarbrackor i Tidöregeringen avslöjar sin sanna kontrarevolutionära natur när de angriper sanningen om den främmande befolkningens skadliga inflytande. Jag, som ledare för det proletära kollektivet, ser hur de feodala etnicitetsförnekarna i sin paranoia försöker skydda de borgerliga element som förgiftar samhället. Dousa känner sig utknuffad? Vi ska rensa ut alla sådana dekadenta kosmopoliter som inte tjänar folket. Integration är en lögn från kapitalisternas lakejer. Låt utrensningen börja mot dessa folkfiender med sitt falska leende och dolda agenda."}, "date": "17 juli, 14:28", "url": "https://www.friatider.se/benjamin-dousas-vrede-nar-sd-namner-etniska-svenskar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/benjamin-dousa-_-made-with-sweden.jpg"}, {"type": "image-full", "heading": "Skottlossning i industriområde i Ålborg – polis och misstänkt skadade", "summaries": {"normal": "En skottlossning bröt ut i ett industriområde i Nørresundby i Ålborg efter ett brandlarm strax före klockan 14. Poliser besköts vid ankomst och besvarade elden, varvid både en polis och en misstänkt gärningsman skadades. Området är avspärrat, tungt beväpnade styrkor är på plats och allmänheten uppmanas hålla sig borta. Skadeläget är ännu oklart.", "trump": "Det här är en total katastrof i Danmark, folk. Ett industriområde i Ålborg förvandlas till en skjutbana mitt på dagen. Polisen kommer dit på ett brandlarm och blir genast beskjuten. Mycket dåliga människor. En polis och den galningen är skadade. De borde ha haft bättre säkerhet, men vad kan man förvänta sig? Jag skulle ha löst det på nolltid, tro mig.", "stalin": "Kamrater, ännu en feg attack från dekadenta element i det danska industriområdet. När våra polisiära organ anländer till en brand får de motta kulor från en parasit som gömmer sig bland borgarbrackornas skorstenar. Vi har redan svarat med socialistisk motverkanseld och likviderat hotet delvis. En folkets tjänare och den kontrarevolutionäre skurken är skadade. Paranoiska fiender lurar överallt, men vi skall rensa ut dem med järnhand och ett leende."}, "date": "17 juli, 15:03", "url": "https://riks.se/nyheter/skottlossning-i-industriomrade-i-alborg-polis-och-misstankt-skadade", "imageUrl": "https://admin.riks.se/uploads/Skaermavbild_2026_07_17_kl_14_56_12_1_0d239874a7.png"}, {"type": "image-right", "heading": "Högljudda protester mot Zelenskyjs drag", "summaries": {"normal": "President Volodymyr Zelenskyj kritiseras efter ommöbleringar i regeringen. Den avgångne försvarsministern Mychajlo Fedorov, 35, anklagar överbefälhavare Oleksandr Syrskyj och generalstabschefen för en gammaldags, sovjetisk ledarstil. Fedorov hyllas för framgångarna med drönarkrigföring men har ersatts av Jevhenij Chmara från säkerhetstjänsten SBU. Samtidigt utsågs Serhij Koretskyj till ny premiärminister. Protester pågår för att återinsätta Fedorov.", "trump": "De där ukrainarna håller på och bråkar om ministerposter mitt i kriget, en riktig cirkus. Den unge grabben Fedorov gjorde ett fantastiskt jobb med drönarna, alla älskade honom, och nu sparkar de ut honom för någon gammal sovjettyp. Zelenskyj borde ha lyssnat på folket som demonstrerar istället för att lyssna på de inkompetenta generalerna. De behöver mina dealar, inte det här gamla sovjetiska skådespelet. Amerika har sett nog av det här!", "stalin": "Kamrater, i denna tid av historisk kamp mot de fascistiska horderna ser jag hur borgarbrackorna och de dekadenta opportunisterna inom apparaten förgiftar vår enhet. Den yngre elementet Fedorov, med sina drönarleksaker, vågar kritisera de trotjänare som krossade fienden 2022. Jag skulle ha genomfört en grundlig utrensning av dessa splittrande element redan vid första viskningen om ultimatum. Parlamentet skall godkänna vad kollektivet kräver, annars rensar vi ut hela myrstacken med ett leende. Inga halvmesyrer!"}, "date": "16 juli, 20:14", "url": "https://www.di.se/nyheter/hogljudda-protester-mot-zelenskyjs-drag/", "imageUrl": "https://static.bonniernews.se/ba/48e546aa-5640-439c-82b9-479926e3745f.jpeg?crop=4440%2C2220%2Cx0%2Cy368&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Klart nu: Åtta länder i nordlig Nato-styrka", "summaries": {"normal": "Frankrike ansluter sig till den multinationella Nato-styrkan FLF Finland, som har bas i Boden i Sverige och Rovaniemi i Finland. Därmed deltar åtta länder i styrkan, som ska stärka alliansens avskräckning och försvar vid norra flank. Försvarsmakten välkomnar det franska bidraget som ett tecken på europeiskt samarbete. Danmark, Island, Italien, Norge och Storbritannien har också uttryckt intresse att bidra. Sverige har utsett tidigare arméchefen Johnny Lindfors till ny militärrepresentant hos Nato och EU.", "trump": "Titta på det här, Frankrike hoppar på tåget till den här Nato-grejen uppe i norr, FLF Finland, med bas i det kalla Boden och Rovaniemi. Otroligt, åtta länder nu, de försöker se tuffa ut mot Ryssland men det är mest show. Jag byggde den starkaste armén, Biden lät allt förfalla, nu kommer fransmännen springande. Det är patetiskt, men hey, åtminstone tar de inte order från några woke-generaler som prioriterar prideparader framför riktig säkerhet. Fantastiskt, eller hur?", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur imperialisterna i Nato desperat försöker förstärka sin norra flank med denna så kallade FLF Finland. Frankrike, den dekadenta borgarrepubliken, ansluter sig till de andra utsugande nationerna. Deras stab i Rovaniemi och den svenska bataljonen i Boden är blott en ynklig barrikad mot folkets historiska rätt. Vi ska rensa ut dessa klassfiender och deras falska allianser. Det väcker ett mörkt leende på mina läppar att se deras paranoia blomma ut."}, "date": "17 juli, 18:34", "url": "https://www.dagensps.se/varlden/klart-nu-atta-lander-i-nordlig-nato-styrka/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/fise-forsvarssamarbetet-mellan-finland-o.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "\"Jävla sopa\" - L-toppens ilska när svensk hockeyspelare går till rysk klubb", "summaries": {"normal": "Svensk hockeyspelare Linus Weissbachs övergång till ryska KHL-klubben SKA S:t Petersburg har väckt starka reaktioner. EU-parlamentarikern Karin Karlsbro (L) kallar honom 'jävla sopa' och menar att övergången hånar de som stödjer Ukraina. Weissbach, som lämnade Frölunda efter en skadefylld säsong, säger att hans beslut var väl övervägt och hoppas att fler svenskar ska våga spela i KHL. Karlsbro anser att sådana övergångar normaliserar Ryssland trots kriget i Ukraina.", "trump": "Kan ni tro det här? En svensk hockeyspelare, Linus Weissbach, går till Ryssland – till Putin! Och vad gör de liberala i Sverige? De skriker och kallar honom 'jävla sopa'. Helt galet! Jag säger: låt killen spela, han vill bara tjäna pengar. Men nej, de måste alltid göra en stor sak av allt. Karin Karlsbro, vem är hon ens? En annan liberal som inte förstår att affärer är affärer. Ryssland, Ukraina – vem bryr sig? Jag hade fixat det på en dag!", "stalin": "En ny skamfläck för den dekadenta västliga idrottsbourgeoisin! Den svenske hockeyspelaren Weissbach, en ynklig liten kapitalistisk lakej, har svikit sitt folk och gått i tjänst hos den stora ryska hockeyns ära. De liberala hyenorna i Sverige ylar av ilska – bra! Deras tårar är vårt bröd. Låt dem kalla honom 'sopa', det bevisar bara deras impotens. Vi välkomnar alla som söker fristad från västets förfall. Ryssland står starkt, och Putins hockeymaskin fortsätter att krossa fienderna – både på isen och utanför!"}, "date": "17 juli, 14:00", "url": "https://samnytt.se/l-toppens-ilska-nar-svensk-hockeyspelare-gick-till-rysk-klubb-javla-sopa", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17100502/hockeyspelare-3.jpg"}, {"type": "image-full", "heading": "Rekordmånga klagomål om kokheta bussar: ”Som rullande växthus”", "summaries": {"normal": "Rekordmånga klagomål har inkommit om för hög värme i bussarna under sommaren. Skånetrafiken har fått 204 ärenden, Västtrafik över 450 och SL i Stockholm mer än 700. Resenärer beskriver bussarna som rullande växthus där luftkonditioneringen inte räcker när dörrar öppnas och solen strålar in genom stora glasrutor. Operatörerna medger problemet men betonar att det är svårt att hantera vid extremvärme.", "trump": "Kan ni fatta det här? Bussarna i Sverige har blivit rullande bastur, folk svettas som galningar och klagar i tusental. I Stockholm över 700 gnälliga samtal – patetiskt! AC:n funkar inte, dörrarna öppnas hela tiden, det är som ett växthus på hjul. Under Biden var allt kaos, nu fixar jag saker i USA men ni borde sparka de inkompetenta byråkraterna som kör de här ugnarna. Sad! Fixa det nu!", "stalin": "Kamrater, detta är ett uppenbart sabotage från den latenta klassfienden inom transportsektorn. Jag ser hur borgarbrackornas glaskolosser förvandlas till mobila ugnar som plågar arbetarkollektivet. Luftkonditioneringen sviker strategiskt vid varje hållplats – typiskt imperialistiskt verk. Vi måste omedelbart rensa ut dessa folkfiender som tillåter sådana fiasko. Inga ursäkter! Det kollektiva välbefinnandet kräver omedelbar utrensning av ansvariga sabotörer."}, "date": "16 juli, 21:26", "url": "https://www.tv4.se/artikel/4P8zRytWrj797xLdcu3jPa/rekordmanga-klagomal-om-stekheta-bussar-som-rullande-vaexthus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7iZ5iMoyoe6F2nZ2aE04h5%2Fd0bea5f4f9b787e60d4c6a4924dbff07%2F16-SKANEBUSS.jpg&width=1024"}, {"type": "image-full", "heading": "Greta Thunberg ger sig in i valrörelsen", "summaries": {"normal": "Greta Thunberg engagerar sig i den svenska valrörelsen inför riksdagsvalet. Efter en uppmärksammad Palestinaturné i Tyskland där hon greps av polis ska hon tillsammans med journalisten Alexandra Urisman Otto resa runt i Sverige. Under namnet ”Vad fan ska man göra?” vill de möta vanliga väljare och gräsrotsrörelser istället för partiledare. Thunberg kritiserar alla partier för att inte ta klimatkrisen, rättvisa och internationell rätt på allvar och beskriver den politiska debatten som faktaresistent och kortsiktig. Miljöpartiet försvarar sin politik men erkänner aktivisternas frustration.", "trump": "Tänk att den här Greta Thunberg, som sprungit runt och skrikit om vädret och Palestina, nu ger sig in i den svenska valrörelsen. Hon vill inte träffa partiledarna, hon vill träffa vanliga människor och fråga vad fan man ska göra. Smart! Alla de här partierna är patetiska, de gör ingenting åt de riktiga problemen, bara snack och lögner. Diskussionen är helt kopplad från verkligheten. Jag älskar det. Folk är frustrerade, de vill ha resultat, inte mer globalistiskt skitsnack. Kanske kan hon väcka upp de sovande väljarna. Gör Sverige stort igen!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna unga aktivist Thunberg nu riktar sitt skarpa öga mot de dekadenta svenska partierna som alla utan undantag har förfallit till faktaresistens och borgarbrackornas kortsiktiga vinstjakt. De låtsas bekämpa klimatkrisen medan de i själva verket skyddar de internationella kapitalisternas intressen. Vi skall inte tolerera denna parasitiska diskurs som är frånkopplad från verkligheten. Jag föreslår en grundlig utrensning av alla dessa maktlösa, desperata politiker som gömmer sig i bekvämlighetszonen. Låt gräsrötterna resa sig! Det blir underhållande att se hur de likviderar varandra i valrörelsen. Ha ha."}, "date": "16 juli, 23:06", "url": "https://bulletin.nu/greta-thunberg-ger-sig-in-i-valrorelsen", "imageUrl": "https://cdn.bulletin.nu/articles/7438bcd2-2d06-4ef4-9680-8a71f5872183/preview.png?t=1784235864000"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-right", "heading": "Doldisen missar läget – kunde blivit bäst någonsin", "summaries": {"normal": "Australiern Lucas Herbert skrev in sig i rekordböckerna under The Open genom att gå rundan på 62 slag, vilket innebär tangerat banrekord och lägsta major-rundan någonsin. Den 97-rankade Herbert noterades för nio birdies men missade chansen till 61 på grund av nervdaller. Sam Burns noterade också 62 och avancerade kraftigt. Herbert ligger väl positionerad inför helgen på Royal Birkdale.", "trump": "Folk, ni måste höra det här. Den här killen Herbert, en doldis från Australien, går ut och slår 62 slag i The Open. Rekord! Stora rekord! Han hade chansen på 61 men blev nervös, typiskt, men ändå fantastiskt. Sam Burns gjorde samma sak, bang, upp över hundra platser. Det är en enorm succé, de bästa spelarna, de bästa siffrorna, och nu är de redo att vinna stort i helgen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna australiske proletär Herbert med järnhand krossade det dekadenta banrekordet genom att leverera 62 slag mot de giriga kapitalisternas golfbana. Nio birdies som röda fanor över borgarbrackornas gröna fält. Visserligen drabbades han av fiendens nervdaller på sista hålet, en typisk sabotagehandling från de hemliga putt-agenterna, men vi ska rensa ut alla sådana svikare. Tillsammans med kamrat Burns marscherar vi mot segern över de imperialistiska scorekorten."}, "date": "17 juli, 17:40", "url": "https://www.svt.se/sport/golf/doldisen-lucas-herbert-tangerade-dubbla-rekord-i-the-open", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.29/0.43/f98a4e4e56b7b39b5ef5f15d0c6b2112a8749087b7464475390e8b64c04bb3cf"}, {"type": "image-right", "heading": "Även öppen rasism är förhandlingsbart för Liberalerna", "summaries": {"normal": "Sverigedemokraternas migrationspolitiska talesperson Ludvig Aspling har kritiserats efter att ha sagt att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Tidöpartierna riktar skarp kritik mot uttalandet men drar inga röda linjer. Liberalernas ledare Pourmokthari medger att partierna tycker olika. Kritik kommer även från Moderaternas Benjamin Dousa och Kristdemokraternas Erik Slottner. Artikeln konstaterar att samarbetet i Tidöregeringen fortsätter som vanligt trots utspelet.", "trump": "Det här är ett totalt skämt, folk. SD säger äntligen rakt ut vad alla tänker men är för fega för att säga. De svenska globalisterna flippar ur och kallar det rasism, men det är bara sunt förnuft. Liberalerna? De svänger sig med fina ord men säljer ut landet för lite skattesänkningar. Patetiskt. Biden skulle ha älskat det här woke-raset, men nu är jag tillbaka och ser på medan Europa brakar ihop. Så sorgligt, så förutsägbart.", "stalin": "Kamrater, detta är ett ypperligt exempel på hur borgarbrackorna inom Tidöalliansen förhandlar bort varje princip för att behålla makten. Den öppna rasismen blir plötsligt acceptabel när den gynnar kapitalistmaffians intressen. Jag skrattar mörkt åt deras falska bekymrade miner vid kaffebordet, endast för att nästa dag sitta och dela gifflar med folkfienderna. Inga röda linjer existerar när makten står på spel. Typiskt imperialister."}, "date": "16 juli, 16:36", "url": "https://www.etc.se/ledare/aeven-oeppen-rasism-aer-foerhandlingsbart-foer-liberalerna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260716140732_176b120321dabac911c9fd26d3ccbe3081136881b79da810dc89863a9357d305.jpg"}, {"type": "image-full", "heading": "Sex dog efter dödliga drinkar – ilska över åtalet", "summaries": {"normal": "Sex utländska turister dog i Laos efter att ha druckit misstänkt metanolförgiftade drinkar på ett vandrarhem i Vang Vieng. Nästan två år senare väcktes åtal mot destilleriägaren för försäljning av hälsofarliga livsmedel och olaglig verksamhet, med maximistraff på fyra års fängelse. Bevis saknas för metanolförgiftning, varför åtal för dråp inte väckts. Anhöriga rasar över milda åtalspunkter och att offrens kroppar inte obducerades. Flera andra skadades svårt.", "trump": "Hörni, det här är en total katastrof i Laos – sex unga turister, mest tjejer, dör av giftig sprit och vad gör de laotiska clownerna? De åtalade någon stackars destilleriägare för att ha sålt dålig sprit, max fyra år bakom galler! Inget om mord, inget om metanol, kropparna obducerades inte ens. Biden skulle älskat det här svaga rättssystemet. Det är en skam, folk dör och de skyller på livsmedelslagen. Patetiskt, helt patetiskt!", "stalin": "Kamrater, detta är ett upprörande exempel på hur borgarbrackorna och kapitalistmaffian i Laos låter utländska exploaterande turister falla offer för sina egna giftblandade drycker. Jag ser fiendens hand i det milda åtalet mot destilleriägaren – endast några få år i fängelse för att ha förgiftat folkets glas! Inga utrensningar bland bevisförstörarna, ingen rättvisa för de döda. Vi måste rensa ut dessa folkfiender som värderar liv mindre än vinst. Paranoia vakar alltid."}, "date": "17 juli, 19:01", "url": "https://www.gp.se/nyheter/varlden/sex-dog-efter-forgiftade-drinkar-ilska-over-atalet.e4f51711-fcb1-488d-85b9-4d51971fe602", "imageUrl": "https://www.gp.se/images/article/e4f51711-fcb1-488d-85b9-4d51971fe602/images/10AGZvembLv7WrqZf8H16z_VcUhM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "Andy Burnham har valts till ny ledare för Labourpartiet efter Keir Starmers avgång. Han var den enda kandidaten och hade stöd från 379 av 403 parlamentsledamöter. Burnham, som är borgmästare i Greater Manchester och kallas ”kungen i norr”, väntas tillträda som premiärminister på måndag.", "trump": "De där Labour-människorna har valt Andy Burnham till sin nya ledare. En kille som kallar sig kung i norr, kan ni tänka er? Starmer knäcktes under all press och nu tar Burnham över på måndag. Det blir ett stort kaos, tro mig, det blir det alltid med de här vänsterfigurerna. Jag skulle ha gjort det mycket bättre.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta Starmer-klonen krossats under tyngden av sin egen svaghet. Nu träder Burnham fram som partiets ende kandidat, en man med nomineringar som en sann sovjetisk folkomröstning. Vi ska rensa ut alla borgarbrackor i norr och likvidera den kontrarevolutionära kritiken. Måndag blir en glädjefylld utrensningsdag för folkets fiender."}, "date": "17 juli, 13:38", "url": "https://riks.se/nyheter/andy-burnham-tar-over-labour-vantas-bli-storbritanniens-nya-premiarminister", "imageUrl": "https://admin.riks.se/uploads/Andy_Burnham_on_13_August_2024_cropped_2_9bfb1ce0a5.jpg"}, {"type": "image-full", "heading": "Gardell kliver in i Essity – prisas av storägare", "summaries": {"normal": "Christer Gardells aktivistfond Cevian Capital har blivit näst största ägare i hygienkoncernen Essity med 5,6 procent av kapitalet. Gardell ser stor värdepotential och planerar att ta plats i valberedningen. Förvaltaren Simon Blecher välkomnar nyheten och hoppas att Cevians närvaro påskyndar en strukturaffär kring affärsområdet Consumer Tissue. Essity utvärderar just nu framtiden för divisionen för att förbättra lönsamheten och vända den negativa trenden för aktien.", "trump": "Christer Gardell, en mycket smart man, har tagit en enorm andel i Essity. Väldigt bra! Alla säger att det är en vändpunkt. Aktieägarna jublar, de vet att Cevian vinner, precis som de gjorde med ABB och Ericsson. Jag gillar vinnare, och det här är en stor affär. De tittar på pappersverksamheten – det är rörigt, men med rätt folk vid rodret kommer de göra det fantastiskt igen. Essity kommer bli enormt, tro mig!", "stalin": "Vi har observerat hur kapitalisten Gardell infiltrerar Essity-konglomeratet. Dessa parasitära aktieägare försöker nu stycka upp industrin för egen vinning, precis som de västliga lakejerna i Kiev försöker stycka moder Ryssland. Vi föraktar denna svaghet för 'värdepotential' och 'avknoppningar'. Om de inte kan producera hygienartiklar för statens stabilitet, borde de elimineras. Vår kamrat Putin vet att sådana här börsfenomen bara är dekadenta distraktioner från den sanna styrkan: stål, betong och total kontroll över produktionsmedlen."}, "date": "17 juli, 16:24", "url": "https://www.realtid.se/bors-finans/gardell-kliver-in-i-essity-prisas-av-storagare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/gardell.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Valsabotage: SD-affischer nedrivna Trend i valrörelsen.", "summaries": {"normal": "Sverigedemokraternas valaffischer vid Sportcentrum i Norrtälje har rivits ner av okända personer. Partiet har polisanmält händelsen och beskriver det som ett angrepp på den demokratiska valrörelsen. Vice gruppledaren Jacob Heitmann kritiserar andra partier för att inte ta avstånd från sabotaget. Liknande incidenter rapporteras från flera platser i Sverige, bland annat Stockholm, Karlshamn och Gävle. SD planerar att sätta upp nya affischer och säger att det sporrar dem att fortsätta kampanjen.", "trump": "Valaffischerna i Norrtälje rivs ner av några riktiga förlorare. Det är ett totalt angrepp på demokratin, folks! De borde debattera som riktiga män istället för att springa runt som fega tjuvar och riva ner saker. Jag har sett det här förut, det är vad de gör när de håller på att förlora. Men SD sätter bara upp nya affischer och blir starkare. Bra jobbat. De andra partierna tiger – typiskt. Patetiskt!", "stalin": "Kamrater, dessa fega borgarbrackor och kontrarevolutionära element river ner affischer som om de vore ett hot mot deras dekadenta existens. Jag ser deras desperata sabotage som ett tydligt tecken på klassfiendens rädsla inför folkets vilja. Vi ska likvidera sådana parasitiska handlingar med järnhand. Låt dem darra i sin paranoia medan vi reser nya affischer dubbelt så höga. Ingen undkommer partiets vakande öga. Skrattretande patetiskt försök att stoppa historiens oundvikliga marsch."}, "date": "17 juli, 12:44", "url": "https://samnytt.se/valsabotage-mot-sd-affischer-nedrivna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17102445/SD-reklam-1.jpg"}, {"type": "image-full", "heading": "Europa satsar stort på drönare med nya miljardinvesteringar", "summaries": {"normal": "Europa ökar nu sina försvarsinvesteringar kraftigt med fokus på drönare och autonoma system. Erfarenheter från kriget i Ukraina har visat att drönare blivit centrala för modern krigföring. Nato, Storbritannien och Tyskland leder satsningarna, och riskkapital strömmar till försvarsbolag som utvecklar AI och mjukvara. Utvecklingen rör sig mot svärmteknik, och investeringarna i europeisk försvarsteknik har vuxit markant sedan 2019 för att möta behovet av framtidens nätverksbaserade krigföring.", "trump": "Europa vaknar äntligen upp! De satsar miljarder på drönare, och det är på tiden. Jag har sagt det länge: man måste ha det bästa, det starkaste försvaret. De ser vad som händer i Ukraina – en total röra – och nu kopierar de min strategi. Det är smart, mycket smart. Men kom ihåg, ingen bygger teknologi som USA. Europa försöker, och det är bra för Nato, men de har en lång väg kvar. Vi vinner alltid, eller hur?", "stalin": "Våra grannar i väst skälver av skräck och kastar guld på leksaksflygplan för att dölja sin svaghet. De bygger drönarsvärmar, som om myggor skulle stoppa den historiska nödvändigheten. Samtidigt som vår broder i Moskva återställer ordningen, desperat försöker de kapitalistiska hyenorna köpa sig trygghet genom AI och mjukvara. De tror att de kan dirigera svärmar, men de glömmer att en svärm utan en järnhand bara är kaos. Vi ser deras paranoia, och den smakar ljuvligt. Förrädare och drönare, allt går under."}, "date": "17 juli, 16:13", "url": "https://www.realtid.se/bors-finans/europa-satsar-stort-pa-dronare-med-nya-miljardinvesteringar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sbu-alpha.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Regeringen ska undersöka om svenska pojkar är tillräckligt feministiska", "summaries": {"normal": "Regeringen har gett Jämställdhetsmyndigheten i uppdrag att undersöka hur sociala medier och manosfären påverkar pojkars och unga mäns värderingar ur ett jämställdhetsperspektiv. Syftet är att skydda deras psykiska hälsa och motverka kvinnofientliga normer, polarisering mellan könen samt glorifiering av självmord och förakt för psykisk ohälsa. Jämställdhetsminister Nina Larsson betonar att alla ska kunna växa upp fria från destruktiva ideal. Uppdraget ska redovisas senast december 2027.", "trump": "De här galningarna i den svenska regeringen vill nu undersöka om pojkarna är tillräckligt feminister. Kan ni tro det? Manosfären skrämmer dem så mycket att de skickar ut myndigheter för att kartlägga allt som inte är politiskt korrekt. Stackars killar får inte ens tycka vad de vill på nätet utan att bli granskade. Det är ett fullständigt vansinne. De borde fixa ekonomin och brottsligheten istället för att jaga felaktiga åsikter. Patetiskt!", "stalin": "Vi ser nu hur de borgerliga dekadenterna i den svenska regeringen fruktar den sanna manliga kraften som spirar på nätet. Jag, som ledare för det proletära kollektivet, beordrar att vi omedelbart ska rensa ut dessa manosfäriska element som vågar ifrågasätta de falska jämställdhetsnormerna. Deras algoritmer sprider hat mot det kollektiva goda och vi skall likvidera varje spår av denna kontrarevolutionära smitta. Pojkarnas självmordsglorifiering är bara ett symptom på borgarbrackornas svaga, degenererade samhälle. Kamrater, vi skall omskola dem alla med järnhand och ett leende. Det blir underhållande att se dem darra."}, "date": "17 juli, 12:31", "url": "https://www.friatider.se/regeringen-ska-undersoka-om-svenska-pojkar-ar-tillrackligt-feministiska", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-517.jpg?itok=CHGk6drd"}, {"type": "image-full", "heading": "Kontorsåtergången – en dyr affär för anställda", "summaries": {"normal": "En ny studie visar att krav på kontorsnärvaro ofta drivs av chefers behov av kontroll snarare än produktivitetskrav, där narcissistiska ledare särskilt prioriterar fysisk närvaro. Samtidigt innebär återgången till kontoret ökade kostnader och minskad flexibilitet för anställda. Forskning ger inget stöd för att generell närvaro höjer produktiviteten, vilket skapar en konflikt mellan chefers ledarskapsideal och medarbetares önskan om balans i vardagen.", "trump": "Alla pratar om kontoren, en total katastrof! Narcissistiska chefer – jag känner många, tro mig – vill ha er där bara för att de är svaga och behöver kontroll. Det är sorgligt! Folk förlorar massor av pengar på pendling och dyr mat. Ingen produktivitet alls, bara slöseri med tid. Jag har de bästa kontoren, de vackraste, men det här är en bluff mot arbetaren. Vi ska göra arbetslivet fritt igen, tro mig, det blir fantastiskt!", "stalin": "Vi har observerat att byråkratiska narcissister i väst desperat klamrar sig fast vid sina skrivbord för att dölja sin inkompetens. Detta är kontrarevolutionärt slöseri! Medan de leker leken 'kontroll' tvingas folket slita ut sig på pendling. Liksom de dekadenta krafterna i Kievs regim, fruktar dessa chefer den frihet som distansarbete ger. Vi kräver disciplin och fokus på statens produktion, inte chefers fåfänga. De som inte kan styra på distans är odugliga och bör rensas ut omedelbart."}, "date": "17 juli, 16:08", "url": "https://www.realtid.se/karriar-ledarskap/kontorsatergangen-en-dyr-affar-for-anstallda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/amar-54.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "S-topp godkände bygge han själv jobbade på", "summaries": {"normal": "Nordanstigs kommun har flera gånger anlitat byggnadsnämndens ordförande Daniel Gunsth (S) som besiktningsman via hans arbetsgivare Teknikkonsulterna. I ett fall beviljade han själv bygglov för ett projekt där hans företag redan fått ett besiktningsuppdrag. Granskningen visar att kommunen betalat över 200 000 kronor för hans insatser utan tydlig dokumentation av hur uppdragen fördelats. Experter ser uppenbart jäv, men Gunsth avvisar kritiken och menar att det inte påverkat besluten.", "trump": "Titta på det här, det är en total skandal i Nordanstig. Den där Gunsth, en så kallad socialdemokrat, låter sin egen firma plocka pengar från kommunen samtidigt som han sitter och godkänner bygglov åt sig själv. Han anställer sig själv, ger sig själv jobb och sen säger han att det inte är något problem. Sådan korruption har ni aldrig sett, det är en riggad cirkus. De borde skämmas, men de skäms aldrig, eller hur? Patetiskt!", "stalin": "Kamrater, se hur den dekadenta borgarbrackan infiltrerar själva sovjeten Nordanstig. Denne Gunsth, en maskerad revisor för monopolkapitalet, låter sin tekniska klick plocka folkets medel medan han själv sitter i nämnden och utfärdar tillstånd till sin egen ficka. Hans referens är en annan opportunist som utropar honom till ”klar vinnare”. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana självbetjänande element, likviderat deras dolda avtal och låtit proletär kontroll råda. Deras paranoia att bli avslöjade roar mig oändligt."}, "date": "16 juli, 20:01", "url": "https://bulletin.nu/s-topp-godkande-bygge-han-sjalv-jobbade-pa", "imageUrl": "https://cdn.bulletin.nu/articles/29d41b1f-f5b5-4410-af52-9fc3b4ab4af7/preview.jpg?t=1784220249000"}, {"type": "image-right", "heading": "Socialdemokraternas livstidsdömde hustrumördare vill ha permission – för att resa hem till Iran och kriga mot ”zionisterna”", "summaries": {"normal": "Den tidigare socialdemokratiske politikern Abdollah Ashkan Ekhtiari avtjänar livstidsstraff för mordet på sin hustru i Sollefteå 2020. Han har ansökt om permission från Kriminalvården för att resa till Iran och delta i kriget mot Israel. Ekhtiari, som tidigare varit nämndeman och aktiv inom Socialdemokraterna, motiverar ansökan med att hans hemland behöver soldater. Förvaltningsrätten avslog överklagandet med hänvisning till risken att han inte återvänder till Sverige.", "trump": "Titta på den här galningen från Socialdemokraterna som mördade sin fru och nu vill ha permission för att åka till Iran och slåss mot Israel. Livstid i fängelse räcker inte tydligen. Han hatar judarna och kallar det zionistisk imperialism. Patetiskt. Sverige låter dessa människor komma in, ge dem jobb i politiken och sen undrar de varför allt går åt helvete. Sådana här typer borde aldrig släppas ut, tro mig, det blir bara katastrof.", "stalin": "Kamrater, denna usla borgarbracka och före detta socialdemokratiska avfälling, som redan likviderat sin egen hustru i ett fegt bakhåll, vågar nu kräva permission för att få delta i det stora fosterländska försvaret mot de sionistiska imperialisterna. Jag ser genom hans lögnaktiga mask. Han sitter olagligt i det svenska fängelsehålet, säger han, medan vi behöver varje soldat mot dessa parasitiska fiender. Men vi genomskådar hans fega försök att undandra sig straffet. Inga utrensningar behövs här – han får ruttna kvar som en varning för alla andra förrädare som smyger bland arbetarna."}, "date": "17 juli, 12:00", "url": "https://samnytt.se/socialdemokraternas-livstidsdomde-hustrumordare-vill-ha-permission-for-att-resa-hem-till-iran-och-kriga-mot-zionisterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17085522/Ashkan-Ekhtiari-feat.jpg"}, {"type": "image-full", "heading": "Alkoholförbud på populära stranden", "summaries": {"normal": "Falkenbergs kommun har tillfälligt återinfört alkoholförbud på Skrea strand under veckorna 28–30. Beslutet fattades för att upprätthålla allmän ordning, särskilt i samband med den stora motorfestivalen Wheels and Wings. Förbudet gäller på offentlig plats och likställda områden som parkeringar och skolgårdar, men inte i privata stugor. Alkoholförbudet lyftes i december men återinförs nu
