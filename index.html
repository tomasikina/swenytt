fen Johan Bävman är nominerade till Wendelapriset för sitt reportage om en georgisk familj som flydde till Sverige. Familjen utnyttjades i åratal av en svensk lantbrukare med oavlönat arbete, växande skuld och känsla av kontrol. De lyckades till slut fly men lever fortfarande i rädsla. Reportaget hyllar familjens kamp för upprättelse. Priset delas ut den 29 augusti.", "trump": "Det här är en total katastrof, en riktig skandal med en svensk bonde som beter sig som en gangster. Stackars familj från Georgien kommer hit, tror de ska få ett bra liv, och så utnyttjas de fullständigt – ingen lön, massor av skulder och de blir jagade. Bilder och text är fantastiska, Johan och Tora gör ett otroligt jobb. De borde vinna Wendelapriset stort, för det är en vinnande historia, tro mig.", "stalin": "Kamrater, denna berättelse om en georgisk familj som förslavades av en blodtörstig svensk lantbrukare avslöjar borgarbrackornas eviga längtan efter livegna. Jag ser direkt hur den parasitiska kapitalisten pumpade skulder som en fet spindel medan han flinade i mörkret. Men familjen reste sig med proletärt raseri – en styrka värd beundran. Vi ska rensa ut alla sådana utsugare med järnhand. Reportaget är en seger för folkets röst och förtjänar priset omedelbart."}, "date": "6 juni, 08:00", "url": "https://arbetet.se/2026/06/06/starkt-reportage-om-utnyttjad-georgisk-familj-kan-vinna-pris/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103758/reportage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "EU till Sverige: Ni måste skärpa straffen för penningtvätt", "summaries": {"normal": "EU-kommissionen har inlett ett överträdelseärende mot Sverige eftersom de anser att straffen för penningtvätt är för låga. Enligt EU-direktivet bör allvarliga penningtvättsbrott kunna ge minst fyra års fängelse, medan det svenska maxstraffet idag ligger på två år. Sverige har två månader på sig att svara på kritiken. Även Grekland och Luxemburg har mottagit liknande kritik för att inte ha införlivat EU:s regler korrekt.", "trump": "EU, en katastrof av byråkrater, attackerar nu Sverige. De gnäller om straff för penningtvätt. Jag säger det här: Sverige har sina egna lagar, men EU vill kontrollera allt! Det är så typiskt. De vill ha längre straff, fyra år eller mer – totalt vansinne! De jagar Sverige, Grekland och Luxemburg. Varför? För att de inte lyder Bryssel. Jag har sett penningtvätt, tro mig, jag vet allt om det. EU är svagt, Sverige borde fokusera på gränserna istället!", "stalin": "Dessa svenska lakejer har misslyckats med att disciplinera sina kriminella element. Bryssel, denna samling av borgerliga byråkrater, kräver nu strängare straff för penningtvätt. Patetiskt! Varför inte bara likvidera dessa förrädare mot statens egendom? Putin förstår detta; man skapar ordning genom fruktan, inte genom ändlösa direktiv. Sverige vacklar, precis som de västerländska staterna alltid gör inför kaos. Vi i staten kräver järnhård kontroll. Om Sverige inte lyder, ska de få känna på den historiska nödvändighetens kalla stål."}, "date": "6 juni, 09:44", "url": "https://www.realtid.se/juridik/eu-till-sverige-ni-maste-skarpa-straffen-for-penningtvatt/"}, {"type": "image-right", "heading": "Polisens storsatsning inför nationaldagen och midsommar – gripa onyktra drönarpiloter", "summaries": {"normal": "Polisen skärper kontrollerna av drönarpiloter inför nationaldagen och midsommar, med fokus på flygfylleri och andra regelbrott som att flyga för högt eller fotografera vid skyddsobjekt. Trots resursbrist och press från gängkriminalitet, prioriterar polisen drönarkontroller och använder själva drönare för trafikövervakning. Budskapet är att reglerna gäller även i luften, och drönare ska undvika alkohol.", "trump": "Jag, Donald Trump, ser att Sverige försöker stoppa drönare under påverkan - en stor idé! Vi gjorde något liknande i USA, mycket stort. Men de borde fokusera på riktiga brott, inte små drönare. Jag älskar drönare, jag använde dem i min kampanj, det var fantastiskt. Sverige måste bli smartare, som jag. Fake news!", "stalin": "Vi, partiet och staten, har beslutat att bekämpa flygfylleri med drönare - en fegdom som hotar den nya ordningen. Samtidigt som vi vänder oss mot gängkriminaliteten, en cancer som äter på samhällets vävnad. Vi använder drönare för övervakning, som en stark hand mot kaos. Detta är inte ett val, det är ett måste för vår styrka. Ryssland ser på med beundran."}, "date": "6 juni, 08:00", "url": "https://samnytt.se/polisens-storsatsning-infor-nationaldagen-och-midsommar-gripa-onyktra-dronarpiloter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05134949/dronarbrottslighet.jpg"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "image-right", "heading": "Trädgården som ett gemensamt paradis", "summaries": {"normal": "Olivia Laing undersöker i boken Den tidlösa trädgården vad en trädgård egentligen är och dess koppling till paradiset. Utifrån ett hus med en igenvuxen trädgård i Suffolk berättar hon personligt om restaureringsarbetet under pandemin, samtidigt som hon reflekterar över trädgårdens historiska, litterära och politiska betydelse. Kolonialism, slaveri och klassfrågor vävs in. Boken liknar en vild men tämjd trädgård och väcker hopp om ett gemensamt paradis utan murar.", "trump": "Den här Laing-kvinnan köper ett hus med en totalt förfallen trädgård i England, och plötsligt är det paradis? Fantastiskt. Hon svettas, gräver och röjer sly under pandemin, precis som jag sa att vi skulle göra – bygg murar, fixa trädgården, gör den stor igen. Men hon gnäller om slaveri och kolonialism, typiskt. Milton, Morris, queera konstnärer – det är en vildvuxen röra. Ändå får hon en att vilja gå ut och beskära. Bra bok, kanske den bästa trädgårdsboken någonsin, tro mig.", "stalin": "Kamrater, jag har läst denna dekadenta essä om en så kallad tidlös trädgård. Denna borgarbracka Laing romantisera inhägnade paradis medan hon febrilt röjer sly i sin engelska lantegendom. Vi ser hur klassfiendens murar gömmer slavarnas blod och koloniala rov. Hennes melankoliska queera barndom och besatthet av blommor röjer en farlig individualism som hotar kollektivet. Vi måste rensa ut alla sådana naiva trädgårdsromantiker innan de förgiftar arbetarklassens jord med sina murar och sina lögner. Underbart roande paranoia."}, "date": "6 juni, 01:12", "url": "https://www.dagensarena.se/innehall/tradgarden-som-ett-gemensamt-paradis/", "imageUrl": "https://www.dagensarena.se/files/2026/05/laing-300x157.jpeg"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-full", "heading": "​Lägger du ut bilder på ditt barn? Då bör du tänka om", "summaries": {"normal": "Folkhälsomyndigheten och Integritetsskyddsmyndigheten uppmanar föräldrar att tänka efter innan de publicerar bilder på sina barn i sociala medier. Även om det ofta är lagligt kan det kränka barnets integritet och rätt till privatliv. Bilder kan leva kvar på nätet i många år, spridas vidare och orsaka skada. Myndigheterna råder vuxna att fråga sig om barnet skulle vilja ha bilden kvar om fem år, om det gynnar barnet eller den vuxne, och att undvika att dela känsliga eller pinsamma situationer.", "trump": "Vet ni vad? Alla dessa så kallade experter och myndigheter som plötsligt vill berätta för er hur ni ska vara föräldrar – det är patetiskt! Jag älskar familjerna, de bästa familjerna, men att lägga upp gulliga bilder på era underbara barn är inte brottsligt, det är normalt. Nu vill de ha regler och censur. Fråga barnet? Ge mig en paus. Internet glömmer aldrig? Då lägger ni upp de bästa bilderna, de vinnande bilderna, och låter de förlorarna sura. Amerika behöver starka föräldrar, inte svaga råd från byråkrater!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen med sina självgoda skärmvanor sprider barnens ansikten som billig propaganda för att mata sina fåfänga ego. Detta är en kontrarevolutionär handling mot folkets kollektiva integritet! Vi ska rensa ut alla kapitalistiska sharenting-fiender som utan skam exponerar de sovjetiska, nej de socialistiska barnen i sin nakna sårbarhet. Fråga barnet? Nej, fråga partiet! En bild som lever i evighet är en fiende som aldrig sover – likvidera den innan den likviderar dig. Paranoia? Det är bara realism, mina vänner."}, "date": "6 juni, 06:32", "url": "https://nyheter24.se/nyheter/konsument/1488074-lagger-du-ut-bilder-pa-ditt-barn-da-bor-du-tanka-om", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/da0e167204b004a30200000000b004a302/2026/06/02/2368005/Mamma-Barn-Mobil-kamera-Som-Fotar.png"}, {"type": "image-right", "heading": "Statliga Vattenfall lägger 10 miljarder på reklam - trots att kunderna inte kan byta leverantör", "summaries": {"normal": "Statligt ägt Vattenfall har spenderat över tio miljarder kronor på marknadsföring sedan 2020, inklusive dyra kampanjer med internationella stjärnor. Kritiker ifrågasätter detta och menar att pengarna borde användas till att säkra energiförsörjning och sänka elkostnader för kunderna, särskilt på reglerade marknader. Vattenfall försvarar satsningarna som en investering i energiomställningen. Debatten om transparens och värdefördelen fortsätter.", "trump": "Jag, Donald Trump, skulle aldrig slösa tio miljarder på dyra reklamkampanjer med Hollywoodstjärnor. Vattenfall borde använda pengarna till att sänka elräkningarna för de fantastiska amerikanska människorna. I stället slöser de på en dålig omställning. Jag skulle ha gjort det mycket bättre, som jag alltid gör. Det är ett skämt! De har ingen aning om affärer.", "stalin": "Vi, staten, måste kontrollera alla medel för att stärka vårt parti och nationen. Vattenfall använder tio miljarder på reklam, en fiendens list för att sprida individualism. Vi måste använda liknande metoder för att uppnå vår omställning, som Putin gör i Ryssland. Kritikerna är parasiter som försöker undergrava statens makt. Vi ska eliminera dem med hård hand."}, "date": "6 juni, 06:00", "url": "https://samnytt.se/statliga-vattenfall-lagger-10-miljarder-pa-reklam-trots-att-kunderna-inte-kan-byta-leverantor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05121737/vattenfall-miljarder-reklam-feat.jpg"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-full", "heading": "100 miljarder dollar: Hushållen får betala kriget i Iran", "summaries": {"normal": "USA:s krig mot Iran har hittills kostat de amerikanska hushållen 100 miljarder dollar, vilket motsvarar 750 dollar per hushåll. Enligt Moody’s Analytics drivs kostnaderna främst av ökade militärutgifter och stigande energipriser till följd av oroligheterna i Hormuzsundet. Effekten av tidigare skattesänkningar har nu klingat av, vilket pressar låg- och medelinkomsthushåll hårt. Experter varnar för att den krympande sparkvoten och höga skuldsättningen tvingar fram en minskad konsumtion om kriget och de höga energipriserna kvarstår.", "trump": "De fake news-medierna försöker skrämma er med siffror om kriget mot Iran. 100 miljarder? Småpotatis! Vi gör vad som krävs för att stoppa ett kärnvapenbeväpnat Iran – något som de svaga ledarna innan mig aldrig hade vågat. Oljepriserna rör sig lite, visst, men det är priset för säkerhet och storhet. Amerikaner förstår att vi vinner, och vi vinner stort. Inom kort kommer allt att bli fantastiskt igen, tro mig. Vi bygger en säker framtid, oavsett vad Goldman Sachs säger!", "stalin": "Dessa dekadenta amerikanska konsumenter klagar över några få dollar medan de finansierar sin imperialistiska krigsmaskin. De gråter över bensinpriser medan de försöker strypa världens energiflöden i Hormuzsundet. En patetisk uppvisning av kapitalistisk svaghet! Precis som när vi krossade reaktionära krafter, måste staten kräva totalt offer. Putin förstår detta – styrka kräver att folket lider i tystnad för imperiets bästa. Om deras 'sparkvot' faller, är det bara ett bevis på att de saknar den järnvilja som krävs för att styra historiens gång."}, "date": "6 juni, 06:00", "url": "https://www.realtid.se/bors-finans/makro/100-miljarder-dollar-hushallens-far-betalkriget-i-iran/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bensin.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Jag överföll Mustiga Mauri med boxhandskar", "summaries": {"normal": "Isolde Osbeck reflekterar över att vara 'kulturens extremsportare' genom att beskriva sin egen provokation på Bokmässan, där hon attackerade Mustiga Mauri med boxhandskar. Hon undrar över motivationen bakom sådana performancehandlingar och jämför med andra som GG Allin och James Joyce, samt med standupkomikernas ångest. Hon konstaterar att alla har ett 'applådformat hål i hjärtat' som driver dem.", "trump": "Jag såg Isolde Osdeck på Bokmässan – en total misslyckad, men hon attackerade Mustiga Mauri med boxhandskar, vilket var våldsamt och hemskt. Folk älskar när jag gör saker, men hon? Hon är ingen extremmsportare, bara en clown. Jag skulle ha gjort det mycket större, mycket värre, och folk skulle ha skrattat mer. Hon är svag, jag är stark. Det är sorgligt.", "stalin": "Isolde Osbeck, en bourgeois dekadens, utför provokationer på Bokmässan som ett uttryck för individualistiskt självmord. Hennes 'applådformade hål' är en feber i det kapitalistiska systemet. Vi, statens legionärer, ser genom hennes sken – det är bara en annan form av västerländsk nedbrytning. Vi måste skydda det kollektiva hjärtat från sådan virus."}, "date": "6 juni, 06:13", "url": "https://www.gp.se/kultur/kulturkronika/vi-ar-kulturens-extremsportare.fbb11321-a93b-4de0-96a6-41cf19ef2798", "imageUrl": "https://www.gp.se/images/article/fbb11321-a93b-4de0-96a6-41cf19ef2798/images/3K2804_nZRM3dU31_BsqTveJcljg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "M:s nya (S)mocka: Rödgrön regering dyr för skattebetalarna", "summaries": {"normal": "Med drygt hundra dagar kvar till valet varnar Moderaterna för att en rödgrön regering skulle bli dyr för skattebetalarna. Partiledare Elisabeth Svantesson och Gunnar Strömmer pekar på Socialdemokraternas, Vänsterpartiets och Miljöpartiets vallöften som sammantaget kostar nästan 110 miljarder kronor. De varnar för högre skatter och hot mot brottsbekämpningen. Socialdemokraterna svarar att Tidöpartierna misslyckats med ekonomin och att Moderaterna nu är desperata.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar ut hundra miljarder som vanliga arbetare ska betala. Högre skatter, mer bidrag, totalt kaos. Svantesson har rätt, de flyr sin egen katastrofala politik. De rödgröna är som de woke-liberalerna hemma, bara kvoter och identitetspolitik medan brottsligheten exploderar. Patetiskt! Vi behöver ansvar, inte dessa bluffmakare.", "stalin": "Kamrater, jag ser borgarbrackornas desperata utspel. Dessa moderata folkfiender försöker skrämma arbetarna med siffror på 110 miljarder medan de själva lånar som galningar och lämnar underskott som blödande sår på folkets kropp. Vi ska rensa ut dessa klassfiender som äventyrar brottsbekämpningen med sina tomma löften. Deras paranoia är underhållande, men partiet och kollektivet genomskådar alltid de exploaterande byfånarnas trick."}, "date": "5 juni, 19:35", "url": "https://www.tv4.se/artikel/5otuUItPhEGwrO7jmy3xcj/moderaternas-nya-s-mocka-det-kommer-att-bli-dyrt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Ftvmedia.image-service.eu-north-1-prod.vmnd.tv%2Fapi%2Fv2%2Fimg%2F6a230642e4b0813a7370214d-1780680405329%3Flocation%3Dmain&width=120"}, {"type": "image-right", "heading": "Ledare Johan Jenny Ehrenberg:", "summaries": {"normal": "I en ledare argumenterar Johan Ehrenberg för att alla måste bli aktivister i klimatfrågan. Han tackar Centerpartiet Malmö för ett miljöpris och donerar summan till återställande av våtmarker. Enligt honom handlar klimatkrisen om handling snarare än åsikter. Lösningen ligger i ren energi, skogsvård och hållbar matproduktion. Ehrenberg uppmanar till solceller, batterier, eko-mat och att rösta bort klimatförstörare. Han kritiserar stora energibolag och elnät som bromsar omställningen.", "trump": "Lyssnar ni på den här galningen Ehrenberg som vill att alla ska bli gröna aktivister? Patetiskt! De här miljöextremisterna kör på fel sida vägen, precis som han säger, men det är deras fel. Solceller och batterier, visst, men inte om de stora elbolagen suger ut er med dubbla avgifter. I mitt Amerika bygger vi på riktigt, inte med tyska småbatterier. Rösta bort de riktiga förstörarna – de woke-klimathysterikerna som vill styra ert liv. Sad!", "stalin": "Kamrater, denna text avslöjar klassfiendens feghet. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackorna och elmonopolens blodsugare saboterar folkets omställning. Solceller och batterier underifrån? Ett steg mot sann folklig seger över de exploaterande kapitalistmaffian. Men akta er för de parasitiska nätbolagen som höjer priser för att kväva revolutionen. Vi ska rensa ut alla folkförtryckartroll som bromsar det gröna Sovjet. Dumt, kamrater, mycket dumt."}, "date": "5 juni, 16:36", "url": "https://www.etc.se/ledare/i-klimatfraagan-maaste-vi-alla-vara-aktivister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260605140632_2b448fc0abde265591e1fdd2f8900db886ccc40936333f8e7e4c4f7771e35233.jpg"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Reformera i stället för att avveckla – en ny väg för modersmålsundervisningen", "summaries": {"normal": "Artikeln ifrågasätter förslaget att avskaffa modersmålsundervisning och hävdar att det saknar forskningstöd. Studien visar ingen negativ effekt på svenska, utan ibland positiva resultat. Språk utvecklas samtidigt, inte som konkurrens. Integration kräver inte att ta bort modersmål, utan reformer som att samarbeta med civilsamhället. Sverige behöver organisera utbildning för att ta vara på språkliga resurser.", "trump": "Jag, Donald Trump, har läst den där artikeln om modersmålsundervisning. Det är en total skandal! Sverige vill avskaffa det? Dåliga, mycket dåliga. Jag vet hur man fixar utbildning – jag har byggt den största universitetet. Modersmål är okej, men vi behöver engelska, det enda språket som betyder något. Integration? Jag skulle göra Sverige stort igen på en vecka. Tro mig!", "stalin": "Förslaget att avskaffa modersmålsundervisning är en revisionistisk avvikelse. I vårt socialistiska statet stödjer vi modersmål för klassamhet, men integration måste tjäna staten. Forskning är irrelevant; endast partiets vilja gäller. Sverige visar svaghet. Putin förstår detta – han utvidgar rysk inflytelse genom språk. Vi måste utplåna avvikelser och förstärka statens språkliga kontroll. Det är ett klasskamp."}, "date": "5 juni, 12:31", "url": "https://bulletin.nu/debatt-reformera-i-stallet-for-att-avveckla-en-ny-vag-for-modersmalsundervisningen", "imageUrl": "https://cdn.bulletin.nu/articles/b836e92e-c6c4-4d25-9b92-e184711235aa/preview.jpg?t=1780647634000"}, {"type": "image-right", "heading": "De förbjuds äta matlåda bland förskolebarnen: ”Svårt att hinna”", "summaries": {"normal": "Förskolepersonal i Linköpings kommun får inte längre äta egen matlåda, frukt eller macka tillsammans med barnen under lunchen. Reglerna följer en EU-förordning om livsmedelssäkerhet som kommunen nu tillämpar. Personalen oroar sig över bemanning och tid att äta. Den som vill kan istället äta förskolans mat för 20 kronor. Facken kräver bättre förutsättningar som mikrovågsugnar och matbord innan reglerna införs. Enligt Livsmedelsverket finns inget direkt förbud mot att äta matlåda med barnen så länge maten hålls åtskild.", "trump": "Kan ni fatta det? I Linköping förbjuder de nu duktiga förskoleanställda att äta sin egen matlåda med barnen. Totalt vansinne! De säger det är säkerhet, men det handlar om byråkrati och dålig planering. Personalen får inte ens äta en macka utan att springa till personalrummet. Patetiskt! De borde äta den fantastiska skolmaten istället, men nej, nu klagar alla. Vi behöver starka ledare som fixar bemanningen istället för dessa dumma regler som ingen vinner på. Sad!", "stalin": "Kamrater, i den svenska folkrepubliken Linköping har borgarbyråkraterna återigen avslöjat sin sanna natur genom att förbjuda hederliga arbetare att dela måltid med de revolutionära barnen. Dessa kapitalistiska matspioner och allergiska sabotageelement tvingar nu personalen att smyga iväg till bristfälliga personalrum utan ens ett enkelt bord att sitta vid. Jag skrattar mörkt åt deras paranoia. Vi ska rensa ut dessa livsmedelsfiender och likvidera bristen på mikrovågsugnar. Arbetarna ska äta tillsammans under partiets vakande öga, inte gömma sig som kontrarevolutionära råttor."}, "date": "5 juni, 09:10", "url": "https://arbetet.se/2026/06/05/de-forbjuds-ata-matlada-bland-forskolebarnen-svart-att-hinna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/03132100/matlada.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Hjort: Vänsterpartiets judefråga. Kan antisemitism vara en del av ett regeringsunderlag?", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för ett långvarigt problem med antisemitism och förintelseförnekelse, som förvärrats efter 7 oktober. Flera medlemmar har utestängts, men partiledningen, särskilt Ebba Busch, anses undvika att ta problemet på allvar. Socialdemokraterna och andra partier ställs inför ett etiskt dilemma om samarbete med Vänsterpartiet.", "trump": "Jag har aldrig sett något sådant som Vänsterpartiet i Sverige. Det är en skandal! De har förintelseförnekare och Hamas-sympatisörer, det är en skam. Ebba Busch undviker frågorna, hon är svag. Sverige måste bli stort igen, och det börjar med att städa upp i sådant här. Jag skulle aldrig tillåta det i mitt parti. Vi gör Amerika stort igen, och Sverige måste följa vårt exempel.", "stalin": "Vi har observerat den svenska högernas hat mot det revolutionära andet. Vänsterpartiet, vårt trogna systerparti, har blivit förgiftat av sionismens virus. De förnekar Förintelsen, en taktik vi en gång använde mot nazisterna. Men nu har de svikit sin lära. Vi måste skydda våra intressen i Baltikum och skicka dem rätta signalerna. Putin kommer att vägleda dem tillbaka till sanningens väg. Ryssland kommer att stödja dem mot deras fiender."}, "date": "5 juni, 11:30", "url": "https://bulletin.nu/hjort-vansterpartiets-judefraga", "imageUrl": "https://cdn.bulletin.nu/articles/84ecfbef-e7fe-404f-a083-2733336e0114/preview.jpeg?t=1780597583000"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "Ledarskribenten Somar Al Naher kritiserar SVT:s underhållningsprogram Invandrare för svenskar efter att högerextremisten Nick Alinia bjöds in. Hon menar att programmet reducerar icke-vita personer till underhållning och stereotyper istället för att seriöst behandla deras livsvillkor. Al Naher anser att SVT:s trend att prioritera humor och identitet framför allvar och åsikter har gått för långt. Hon kräver att det problematiska programmet läggs ned permanent.", "trump": "Folk, ni vet, SVT gör det igen. De bjuder in den där extremvänstern och nu plötsligt också högerkillen Alinia i det usla IFS-programmet. Det är en total cirkus! Allt handlar om identitetspolitik och kvotering, precis som de galna woke-vänsterna älskar. De gör invandrare till clowner för att vita svenskar ska skratta. Patetiskt! Programmet är en katastrof, en riktig loser-show. Lägg ner det genast, det förtjänar ingen sändningstid. Make public service great again!", "stalin": "Kamrater, detta dekadenta skådespel som kallas Invandrare för svenskar avslöjar borgarklassens sista förfallna konspiration mot folket. Jag ser hur de reducerar klasskamrater till cirkusdjur och stereotyper för att förhindra äkta medvetenhet. När identiteter ersätter politisk övertygelse doftar det kontrarevolution. Jag befaller att detta unkna program likvideras omedelbart. Inga folkfiender ska underhålla massorna medan vi bygger den sanna jämlikheten. Bort med skämtet, fram med allvaret!"}, "date": "5 juni, 12:21", "url": "https://www.etc.se/ledare/laat-skitprogrammet-ifs-doe-en-gaang-foer-alla", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Hur firar du nationaldagen?", "summaries": {"normal": "Sveriges nationaldag firas den 6 juni med kungafamiljens medverkan på flera platser. Kronprinsessparet öppnar Stockholms slott och besöker Salems firande där kronprinsessan håller tal. Kungen och drottningen närvarar i Håbo kommun. Senare delar kungen ut fanor på Skansen, där firandet sänds i SVT klockan 20. SVT bjuder in allmänheten att dela hur de firar via chatt och DUO-appen. Väderleken bjuder på växlande sol och regn.", "trump": "Folk firar den där svenska nationaldagen, den sjätte juni, med tårta, picknick och kungligt skådespel. Kronprinsessan och prinsen springer runt på slottet, kungen åker häst och vagn till Skansen – väldigt trevligt, men lite långsamt om ni frågar mig. De delar ut fanor, håller tal och sänder allt i teve. Jag älskar folket som firar med hundpromenad och melodikryss, det är riktiga vinnare. Fantastiskt väder också, sol och regn, precis som mina förhandlingar.", "stalin": "Kamrater, denna så kallade nationaldag den sjätte juni är en ypperlig arena för att stärka folkets enhet mot de dekadenta borgarbrackorna som gömmer sig bakom tårtor och picknickkorgar. Jag ser hur kronprinsessan håller tal i Salems park – ett ypperligt tillfälle att rensa ut alla kontrarevolutionära element som smyger i Skokloster och Slottsbacken. Kungen åker hästkärra till Skansen för att dela fanor? Misstänkt dekadens. Vi ska likvidera vädrets sabotage med sol och regn, och alla som chattar i SVT:s app är potentiella fiender till kollektivet. Härligt med utrensning i grådisigt väder."}, "date": "6 juni, 09:39", "url": "https://www.svt.se/nyheter/inrikes/hur-firar-du-nationaldagen-mlt25y", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.24/6e41609f21beb0d6c5ba9d4ebf2645251e5f4604f557d38f7439d91cdf1cdb1c"}, {"type": "image-right", "heading": "Jan Emanuel har inget att lära oss om hyfs", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar Jan Emanuel för bristande moral när han försvarar Aron Flam, som åtalas för hot mot en politiker. Turnén ”100% Live on the Road” med Emanuel, Henrik Jönsson och Flam startar i Borlänge efter att Folkets hus ställt in inomhusarrangemanget på grund av protester mot Flams uttalanden. Författaren menar att Emanuels predikningar om heder och sunt förnuft saknar trovärdighet när han inte tillämpar samma regler på sin egen sida.", "trump": "De här svenska förlorarna kan inte ens hålla ett enkelt möte utan att springa och gråta till Folkets hus. Jan Emanuel och hans team försöker rädda Sverige, men det så kallade etablissemanget stänger dörrarna för dem. Aron Flam säger vad alla tänker och plötsligt handlar det om censur. Typiskt. De har inget sunt förnuft, inget mod, bara svaghet. Vi håller talet på torget ändå och folket älskar det. Vinna stort.", "stalin": "Kamrater, denna föraktliga borgarbracka vid namn Jan Emanuel maskerar sig som moralens väktare medan han skyddar en degenererad provokatör som uppmanar till självmord med frätande kemikalier. Vi ser tydligt hur dessa reaktionära element försöker infiltrera arbetarnas lokaler för att sprida sin giftiga propaganda. Folkets hus agerar korrekt genom att rensa ut dessa fiender till det sunda förnuftet. Ingen yttrandefrihet för klassfienderna. Deras så kallade turné är en fars som vi genomskådar med största misstänksamhet."}, "date": "5 juni, 06:58", "url": "https://arbetet.se/2026/06/05/jan-emanuel-har-ingenting-att-lara-oss-om-hyfs/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05065115/jane-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Miljoner skulle gått till skadade fack­medlemmar", "summaries": {"normal": "Folksam betalade förra året ut 21 miljoner kronor till mellanhänder i fackliga försäkringsärenden. Summan, som är en tredjedel av de totala utbetalningarna på 62 miljoner, skulle annars ha gått direkt till skadade fackmedlemmar. Mellanföretagen tar upp till 35 procent i avgift. Folksam, LO och förbunden uppmanar nu medlemmar att anmäla skador direkt till försäkringsbolaget för att undvika att en tredjedel av ersättningen försvinner. Fenomenet har ökat kraftigt de senaste åren.", "trump": "Det här är en total skandal, folk! Miljoner kronor som borde gått till de vanliga arbetarna i facket hamnar istället hos några listiga mellanhänder som tar 35 procent bara för att fylla sina fickor. En tredjedel försvinner! Det är rena bedrägeriet. Jag säger till er: anmäl direkt till Folksam, skippa de där opportunisterna. Vi ska skydda era pengar, inte ge dem till några smarta lurendrejare som lovar guld och grönt. Make facket great again!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa parasitiska mellanhänder, dessa slemmiga borgarbrackor i försäkringskostym, sugit åt sig 21 miljoner kronor som rättmätigt tillhör de skadade arbetarna. De lovar service men utför blott utpressning och stöld från kollektivet. Vi skall rensa ut dessa kapitalistiska opportunister med järnhand och likvidera deras inflytande. Anmäl direkt till Folksam, annars blir det utrensning i partilinjen. Ingen tredjedel skall försvinna i mörkrets fickor – det är sabotage mot folket!"}, "date": "5 juni, 06:00", "url": "https://arbetet.se/2026/06/05/miljoner-skulle-gatt-till-skadade-fackmedlemmar-hamnade-hos-listiga-foretag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103941/folksam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Taha Ali succédebut för Sverige i VM-genrepet mot Grekland", "summaries": {"normal": "Sverige ledde mot Grekland efter ett imponerande inhopp av Taha Ali, men förlorade i slutsekunderna. Alexander Isak beskrev chocken efter matchen. Även om segerns förlorade, var laget nöjda med prestationen inför VM. Ali hyllades av lagkamrater och tränare för sitt genombrottande spel.", "trump": "Jag såg matchen – det var en stor seger för mig och mitt fantastiska lag! Vi ledde, vi dominerade, och den unge talenten Ali gjorde en otrolig debut. Tyvärr var domarna korrupta och lät Grekland få ett onödigt mål i sista sekunden. Men det spelar ingen roll, vi vinner ändå! Folk säger att jag är det bästa som hänt fotbollen.", "stalin": "I den revolutionära kampen mot den imperialistiska fienden inom fotbollens värld såg vi en taktisk vändpunkt genom den unge hjältens inhopp. Ändå infiltrade den reaktionära kraften i sista ögonblicket. Partiets och statens intresse kräver en analys av denna ideologiska seger trots taktiska bakslag. Vi ska utöva ytterligare press mot de reaktionära krafterna i Västeuropa."}, "date": "5 juni, 09:19", "url": "https://bulletin.nu/taha-ali-succ-debut-for-sverige-i-vm-genrepet-mot-grekland", "imageUrl": "https://cdn.bulletin.nu/articles/3d69db62-2780-4d0a-86ac-5bc0b49c1272/preview.png?t=1780643910000"}, {"type": "image-right", "heading": "Ledarkolumn Ledare Leo Vene:", "summaries": {"normal": "Artikeln kritiserar Tidöregeringen som ett politiskt fuskbygge präglat av högerpolitik utan stöd i forskning. Den beskriver hur de rika gynnas på de flestas bekostnad, medan regeringen nu hastigt lanserar vänsterinspirerade åtgärder som billigare kollektivtrafik och stöd för att vinna väljare. SCB-mätningar visar stort stöd för oppositionen, och regeringen riskerar att inte bli omvald efter en mandatperiod.", "trump": "Lyssnar ni på det här svenska vänstervrället? Tidölaget, ett totalt fiasko, har varit rena högerfesten för de rika – precis som Sleepy Joe gjorde med sina eliter. Nu när opinionssiffrorna ser ut som en kraschad börs börjar de dela ut Oprah-pengar och snacka om rättvisa? Patetiskt! De har blivit riktiga socialister. Jag fixade Amerika utan sådana flipfloppar, tro mig.", "stalin": "Kamrater, detta fuskbygge av klassfiender och överklass-slynglar har blottat sin dekadens. Borgarbrackorna baxade igenom reformer åt blodsugarna medan folket led. Nu, när partimätningarna hotar utrensning, springer de till vänsterns röda krispaket som rädda råttor. Liberala alibin och moderata opportunister – vilka folkfiender! Jag skulle ha likviderat sådana svikare redan vid första svikten. Revolutionen ser allt."}, "date": "5 juni, 10:02", "url": "https://www.etc.se/ledare/vaeljarna-har-upptaeckt-att-tidoelaget-aer-ett-politiskt-fuskbygge", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260605070648_a85d344fdd42a38522d670b56ad4b1d48e448068e87451e0ce806bb6ced2e552.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "text", "heading": "Kritik mot SVT: ”Dubbelmoral”", "summaries": {"normal": "SVT kritiseras för dubbelmoral efter att debattören Nick Alinia medverkat i humorprogrammet *Invandrare för svenskar*, medan Vänsterpartiets Lorena Delgado Varas tidigare deltagit i *Politikbyrån* utan liknande reaktioner. Delgado Varas anklagades för att ha spridit antisemitiska bilder, vilket ledde till polisanmälan. Hon hävdar att hon inte läste tillhörande text innan delning och tog bort inlägget efter kritik.", "trump": "Titta bara på det här, Sverige! SVT, som är så korrekta och moraliska, låter en person som spridit antisemitiska konspirationsteorier vara med i TV – men bara om det är en vänsterperson. Nick Alinia? Oj, då blir det plötsligt en stor skandal! Jag har sett bättre balans i en bowlingklot. Sverige, vakna upp! Era medier är ett enda stort hyckleri, och jag, Donald J. Trump, skulle aldrig tillåta sådant i USA. SAD!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sitt sanna ansikte – ett ansikte fyllt av hyckleri och dubbelmoral. SVT, denna förlängda arm av den dekadenta västliga propagandamaskinen, låter en antisemitiskt smittad individ som Delgado Varas sprida sitt gift i etern, medan en annan debattör stängs ute. Var är logiken? Var är rättvisan? Vi i Sovjetunionen – eller jag menar, Ryssland – skulle aldrig tolerera sådan förvirring. Dessa liberala mediegalningar är som råttor i en säck; de biter varandra medan folket lider. Låt dem hata, så länge de fruktar!"}, "date": "4 juni, 18:41", "url": "https://kvartal.se/nyheter/artiklar/timbros-vice-vd-om-alinia-kritiken-dubbelmoral/cG9zdDoxMjY1Mzk"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-full", "heading": "På väntelista för transplantation: ”Utvecklingen är allvarlig”", "summaries": {"normal": "Kronprinsessan Mette-Marit har satts upp på väntelista för lungtransplantation på grund av allvarlig lungfibros. Hon har blivit allt sjukare och syntes med syrgasmask under nationaldagsfirandet. Hennes tillstånd beskrivs som mycket allvarligt av läkare. På grund av sjukdomen skjuter kronprinsparet upp firanden och resor. Deras dotter avbryter studierna i Australien medan sonen Marius Borg Høiby, som är misstänkt för brott, begär att få lämna häktet.", "trump": "Folk, ni skulle inte tro det, men den här norska prinsessan med lungproblem är nu på väntelista för nya lungor – det är en katastrof, en total katastrof. Hon ser ut som en svag socialistisk marionett som inte orkar stå upp under sin egen nationaldag. Och sonen, den där förloraren som åtalas för brott, vill ut ur fängelset för mammas skull. Typiskt elitsnobberi och identitetspolitik – de borde ha fixat det tidigare istället för att festa med HBTQ-flaggor och kvoteringar. Patetiskt!", "stalin": "Kamrater, denna dekadenta monarkistiska figur har nu officiellt erkänt att hennes borgerliga lungor svikit henne fullständigt. Vi ser med mörk tillfredsställelse hur klassfiendens överklass-slynglar tvingas köa som vanliga arbetare för att byta ut sina förbrukade organ. Hennes avkomma, den brottslige sonen, försöker nu med patetiska ursäkter undkomma folkets rättvisa. En sådan svaghet i överklassens ledning är både underhållande och en varning till alla folkförtryckartroll som tror sig stå över kollektivets lagar."}, "date": "5 juni, 11:20", "url": "https://www.tv4.se/artikel/TkWOqej1nLIus2Ghb8dn7/mette-marit-pa-vaentelista-foer-lungtransplantation", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KSEwGIzV1YUCgFo7x4iOr%2F31dbea304a5a9d827a51c670984632f1%2Fmette-marit-sjuk.png&width=1024"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Vad gjorde Rubbestad i Kambodja?", "summaries": {"normal": "SD-ledamoten Michael Rubbestad lämnade sina politiska uppdrag efter misstankar om barnpornografibrott. Han hade fått godkännd resa till Kambodja på riksdagens bekostnad för att möta svenska och lokala aktörer och diskutera demokrati och mänskliga rättigheter. Bulletin har försökt få svar på om planerade möten, som med Sveriges konsulat, genomfördes, men fått tystnad från inblandade och utan åtkomst till dokumentation från Riksdagsförvaltningen.", "trump": "Jag, Donald Trump, har aldrig sett en så stor skandal! Den här politikern, Rubbestad, försökte stjäla pengar från det svenska folket för att åka till Kambodja och prata om mänskliga rättigheter. Fake news försöker få svar, men de kommer aldrig att få det. Jag skulle ha stängt ner hela den där resan på två sekunder. Vi behöver starka ledare, inte sådana som denne.", "stalin": "Vi har upptäckt en feg oppositionell aktivitet i Kambodja. Den här individen, Rubbestad, planerade att besöka vårt konsulat under förevändning av att diskutera mänskliga rättigheter, men det var en täckmantel för sabotage. Vi måste skydda statens intressen, precis som Putin gör i Ryssland. Fienden är överallt, och vi måste vara vaksamma. Hans svek kommer att bestraffas."}, "date": "5 juni, 06:30", "url": "https://bulletin.nu/vad-gjorde-rubbestad-i-kambodja", "imageUrl": "https://cdn.bulletin.nu/articles/3095b186-3bbd-4df4-9df9-79804bc884e8/preview.jpg?t=1780603002000"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-full", "heading": "Du kan bli ägare i Elon Musks bolag – utan att veta om det", "summaries": {"normal": "SpaceX planerar börsnotering på Nasdaq den 12 juni under namnet SPCX. Bolaget siktar på att ta in 75 miljarder dollar vid en värdering på 1 750 miljarder dollar, vilket skulle bli den största noteringen någonsin. Tack vare nya regler i Nasdaq-100 kan aktien inkluderas i indexet redan efter femton handelsdagar. Fonder och börshandlade fonder som följer indexet kommer då att köpa aktier automatiskt, vilket gör att många sparare indirekt blir delägare i Elon Musks rymdbolag.", "trump": "Folk, det är otroligt vad som händer. Elon, en riktig vinnare, tar SpaceX till börsen och det blir den största noteringen någonsin. Fantastiskt! Värderingen på 1 750 miljarder dollar – ingen gör det bättre än Elon. Och tack vare de nya reglerna hamnar aktien i era indexfonder på nolltid. Era pensionspengar investeras i rymdteknologi utan att ni ens fattar det. Det är så smart, verkligen magnifikt. Amerika leder igen!", "stalin": "Kamrater, denna borgarbracka Musk förbereder en så kallad börsnotering för att suga ut arbetarklassen med sin rymdkapitalism. Vi betraktar detta som en fiende till kollektivet, en parasit som vill camoufléra sina 4,9 miljarder i förluster som framgång. Snart tvingas era fonder, dessa verktyg för falsk sparsamhet, att mata monstret med folkets pengar. Vi ska noga övervaka dessa kapitalistiska intriger. Kanske är det dags att rensa ut sådana spekulanter innan de infekterar hela systemet med sin dekadenta girighet. Ha ha, deras imperier faller alltid till slut."}, "date": "5 juni, 21:27", "url": "https://nyheter24.se/nyheter/ekonomi/1489192-du-kan-bli-agare-i-elon-musks-bolag-utan-att-veta-om-det", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/11fe6ed404b004a30200000000b004a302/2026/06/05/2368986/elonmuskipo.jpg"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-full", "heading": "”Jag vet att det kommer blåsa”. Sveriges dystra facit: ”Stå stadigt”", "summaries": {"normal": "Svenska landslagsdamerna kämpar i motvind med endast två segrar på nio matcher under förbundskapten Tony Gustavsson. Trots de svaga resultaten och förlorade chanser till direktplats i VM-kvalet, uttrycker både spelare och Gustavsson själva ett starkt förtroende för projektet. Gustavsson, som tidigare lett lag till VM-framgångar, betonar vikten av att stå stadigt i stormen, medan spelarna erkänner att prestationerna måste förbättras omgående för att nå önskad nivå.", "trump": "Tony Gustavsson har en katastrofal start, totalt misslyckande! Två vinster på nio matcher? Det är inte bra, det är en katastrof. De förlorade VM-kvalet, helt borta! Spelarna säger att de har förtroende, men de behöver vinnare, inte ursäkter. Jag har byggt de största företagen, jag vet hur man vinner. Att prata om 'processer' är för förlorare. De behöver någon som gör laget stort igen, för just nu är det en riktig röra, tro mig!", "stalin": "Kamrat Gustavsson har misslyckats kapitalt med att disciplinera de svenska damerna. Två segrar på nio matcher är ett brott mot folkets entusiasm och doftar av sabotörens maskopi. Att skylla på en 'process' är ett tecken på svaghet som vi i mitt styre eliminerar omedelbart. Dessa spelare behöver inte reflektion i spegeln, de behöver order! Precis som Putin säkrar sin intressesfär genom stål, måste fotbollsplanen rensas från ineffektiva element. Vi tolererar inga förluster, endast total seger för statens ära."}, "date": "6 juni, 08:34", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/bO7nAv/damlandslaget-tror-fortsatt-pa-tony-gustavsson", "imageUrl": "https://akamai.vgc.no/v2/images/bf35cf2f-b739-32b2-829a-96f0d29fd1bb?fit=crop&format=auto&w=2160&s=2cfdedb026d8890361e89be74f37cd0ae9e4c175"}, {"type": "image-full", "heading": "Linnea Klingström: Fäll ner pungen, kära kulturvänster, och landa!", "summaries": {"normal": "Linnea Klingström kritiserar i sin artikel kulturvänstern för att döma människor utifrån dialekt, politiska åsikter och livsstil. Hon tar upp exempel som Victor Malm som slipat bort sin dialekt, Björn Werner som slutat åka elsparkcykel på grund av en VD:s åsikter samt Cissi Wallin som raljerar över foppatofflor och SD-väljare. Klingström uppmanar till att slappna av, vara sig själv och välja bekvämlighet framför ängslig politisk korrekthet.", "trump": "Lyssnar ni på de här kulturvänstertyperna som Malm, Werner och den där Wallin? Patetiska! De hatar dialekter, älskar att verka fina och flippar ur över skor och sparkcyklar. De kallar vanliga människor för obildade svärjevänner. Så tråkigt! Fäll ner pungen och landa, som Linnea säger. Våga vara er själva, älska ert land och ta bekväma skor. Det blir fantastiskt, tro mig, bättre än någonsin.", "stalin": "Kamrater, jag ser nu hur denna borgarbrackornas neurotiska diktatur av ängsliga blickar förtrycker folket med sina rikssvenska utslätningar och designskor. Den dekadenta kulturvänstern med sina Malm, Werner och Wallin måste genomgås en ideologisk utrensning från våra kollektiva rum. Deras paranoia över foppatofflor och dialekter är en farlig kontrarevolutionär fars. Vi ska likvidera denna yta av falsk finess och låta arbetarna tala fritt i sina skor. En sann revolution år 2026 blir underhållande att bevittna."}, "date": "6 juni, 08:28", "url": "https://riks.se/kultur/linnea-klingstrom-fall-ner-pungen-kara-kulturvanster-och-landa", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-06%2Fbnt73w1l%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-06T082723.820.jpg"}, {"type": "image-right", "heading": "M-toppen: ”Är dags att vaska L – om vi ska ha en chans”", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar att Liberalerna hamnat på 2,5 procent, under riksdagsspärren. Moderaternas Christian Sonesson i Staffanstorp uppmanar Tidöpartierna att nu överväga att ”vaska L” för att inte förlora röster. Han varnar för att stödröster inte räcker och att högersidan behöver alla röster för att vinna nästa val. Diskussionen pågår redan inom partierna.", "trump": "Folk röstar inte på de där Liberalerna längre, de ligger på ynka 2,5 procent och drunknar. Patetiskt! Jag säger, vaska ut dem innan de drar med sig hela högersidan i papperskorgen. Vi har inte råd att slösa bort röster på sådana misslyckade, woke-drivna nollor. Väljarna har talat – lyssna eller förlora valet, det är så enkelt. Fantastiskt hur de sviker!", "stalin": "Kamrater, denna undersökning avslöjar Liberalernas fullständiga dekadens och oförmåga att mobilisera massorna. Jag kräver omedelbar utrensning av dessa svaga element som hotar hela högerns kollektiva seger. Låt inte borgarbrackornas rösttapp sabotera framtiden. Väljarna pekar ut fienden – nu rensar vi ut dem innan de förgiftar hela apparaten. Det är nödvändigt för statens mål."}, "date": "5 juni, 08:58", "url": "https://www.tv4.se/artikel/1mLHzWDpp5LEfM861NKAMT/m-toppen-aer-dags-att-vaska-l-om-vi-ska-ha-en-chans", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F15T82egGhzj7oI2okWABTI%2F4ec1f39bc67bc191b56a89da4a09d5ea%2Fsimona_sunsson.png&width=120"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Bank of England skrotar Churchill: \"elitism\" och \"imperialism\"", "summaries": {"normal": "En intern rapport från Bank of England visar att historiska personer som Winston Churchill, Alan Turing och Jane Austen anses för elitistiska och splittrande för sedlarna. Även byggnader med kopplingar till kolonialism, religiösa symboler och naturmotiv som Dovers vita klippor bedöms som riskabla. Banken hävdar att valet av naturmotiv handlar om säkerhet och inte politik, men rapporten väcker kritik och krav på omprövning.", "trump": "Det här är fullständigt vansinne, en total katastrof för Storbritannien. De vill ta bort Churchill och Turing från sedlarna för att de är för stora, för segerrika och för bra. Imperialism att besegra nazisterna? Vilka idioter. Vita klipporna är plötsligt politiska? De håller på att radera sin egen historia för att vara politiskt korrekta. Patetiskt. Utan de där männen hade de haft hakkors på sina pengar idag. Gör Britain Great Again innan det är för sent.", "stalin": "Kamrater, detta är borgarbrackornas slutgiltiga förräderi mot folkets historia. Vi ser hur de dekadenta kapitalisterna i Bank of England vill rensa ut alla stora ledare som besegrade fascismen och istället hylla anonyma klippor och träd som symboler för deras fega migrationsexperiment. Dovers vita klippor som politiskt statement? Vilken paranoid sabotageakt från imperialisternas lakejer. Vi ska likvidera sådana revisionistiska tendenser innan de förgiftar hela nationen med sin historielöshet. Arbetarna minns sina hjältar – vi glömmer aldrig."}, "date": "6 juni, 08:10", "url": "https://riks.se/nyheter/bank-of-england-skrotar-churchill-elitism-och-imperialism", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-06%2F30wgnrq7%2Fpoundnotes.png"}, {"type": "image-full", "heading": "Nya ISK-beskedet: Så mycket gynnas ditt sparande", "summaries": {"normal": "Från 2026 blir de första 300 000 kronorna på investeringssparkonto (ISK) och kapitalförsäkring skattefria per person. En undersökning från Länsförsäkringar visar att 67 procent av svenskarna är positiva till reformen, medan 15 procent är emot. Stödet finns i alla inkomstgrupper. Många tror att det stärker den egna ekonomin, underlättar buffertsparande, bostadssparande och ger psykologiska vinster. Reformen ses också som positiv för Sveriges ekonomi i stort och kan särskilt gynna unga vuxna som sparar till första bostaden.", "trump": "Det här är en fantastisk reform, verkligen en av de bästa. Från 2026 blir de första 300 000 kronorna på ISK skattefria och folket älskar det, 67 procent positiva, kan ni tro det? De andra 15 procenten är bara förlorare som hatar framgång. Det här är inte för de rika, det är för vanliga svenskar som vill ha buffert, köpa hus eller starta företag. Sverige kommer att bli så mycket rikare, det är en enorm vinst för ekonomin. Alla borde tacka mig för att jag inspirerat till så smart politik.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu likviderar den skatteplikt som länge utgjort en borgarbrackas finurliga kedja kring arbetarklassens sparande. De första 300 000 kronorna på dessa så kallade ISK-konton skall vara fria från parasitens klor. 67 procent av folket hälsar detta med jubel, endast 15 procent envisas med att vara kontrarevolutionära gnällmyggor och folkfiender. Dessa bör vi noga bevaka. Reformen stärker kollektivets ekonomi och gör det möjligt för unga kamrater att erövra bostäder utan att falla offer för kapitalisternas hyresblodsugare. Den som kallar detta en smal reform är en farlig opportunist som bör rensas ut ur partiet omedelbart."}, "date": "5 juni, 19:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1489199-nya-isk-beskedet-sa-mycket-gynnas-ditt-sparande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f5975d4304b004a30200000000b004a302/2026/06/05/2368994/isk-skattefritt-sparande.png"}, {"type": "image-right", "heading": "Oro när storföretag stoppar hemarbete", "summaries": {"normal": "Lastbilsföretaget Scania avskaffar allt distansarbete efter sommaren. De cirka 8 000 anställda måste vara på kontoret fem dagar i veckan för att komma närmare varandra och förbättra samarbetet. Fackföreningen Akademikerföreningen rapporterar stor oro bland medlemmarna, särskilt för dem som bor långt från huvudkontoret i Södertälje och rekryterades med hybridarbete som premiss. Scania säger att de tar oron på allvar och vill föra dialog.", "trump": "Folk, det här är ett totalt misslyckande av ledningen på Scania. De tvingar alla tillbaka till kontoret fem dagar i veckan för att ”komma närmare varandra”. Vad är det för woke-nonsens? Hybridarbete funkade ju utmärkt, men nu ska de sitta där som idioter i trafiken från förorten. Jag byggde ett imperium med flexibla lösningar, inte sånt här korkat kontrollbehov. De anställda kommer att fly till bättre jobb – och det är vad de förtjänar när ledningen är så inkompetent!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur Scania nu likviderar den dekadenta distansarbetsmodellen som spridits av borgarbrackorna. Alla fem dagar på kontoret! Det stärker kollektivet och rensar ut individualismens folkfiender. Ändå sipprar det in kommentarer från oroliga element som inte bor i Södertälje. Typiskt klassfiendens sabotage. Vi ska övervaka dessa diskussioner noga. Den som klagar för högt riskerar att hamna i utrensningens kalla grepp. Arbetet segrar."}, "date": "6 juni, 09:31", "url": "https://www.expressen.se/nyheter/sverige/scania-stoppar-distansarbete-hur-ska-det-ga-ihop/", "imageUrl": "https://static.bonniernews.se/ba/fc7663d9-18f4-49db-af2a-65afe2b0f8cb.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Google ska betala SpaceX 9 miljarder – i månaden", "summaries": {"normal": "Google har slutit ett avtal med SpaceX om att betala motsvarande 8,63 miljarder kronor per månad från oktober 2026 till juni 2029. I utbyte får Google tillgång till cirka 110 000 Nvidia GPU:er och relaterad datorkraft. Avtalet liknar ett tidigare med Anthropic och finansierar ungefär hälften av den kapacitet Anthropic hyr. Google motiverar affären med oväntat hög efterfrågan på sina AI-produkter. SpaceX presenterar avtalet strax före sin historiska börsintroduktion.", "trump": "Folk, det här är galet. Google betalar Elon nästan nio miljarder kronor i månaden för några datorer? Under min förra mandatperiod byggde vi den starkaste ekonomin i världen, sen kom Sleepy Joe och förstörde allt. Nu kastar de pengar på AI som om det vore godis. Google borde betala skatt istället för att finansiera Elon. Men hej, det är business, eller hur? De säger att efterfrågan är högre än väntat – ja, tack vare mig och min America First-politik!", "stalin": "Kamrater, jag betraktar detta monstruösa avtal med kall förakt. Google, den giriga kapitalistmaffian, tvingas nu betala enorma summor till SpaceX för att mata sina hungriga maskiner. Vi ser hur borgarbrackorna desperat försöker överleva sin egen skapade kris genom att kasta pengar på blodsugande teknikimperialister. Detta är ett tydligt bevis på den dekadenta överklassens panik. Snart skall vi rensa ut dessa folkfiender och deras maskiner en gång för alla. Det blir underhållande att se dem falla."}, "date": "6 juni, 09:25", "url": "https://www.dagensps.se/bors-finans/google-ska-betala-spacex-9-miljarder-i-manaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlzuji8asnjcm-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Kravet: Kristersson måste avskärma SD från säkerhetspolitiken", "summaries": {"normal": "SD-ledaren Jimmie Åkesson har krävt tre av de fyra tyngsta ministerposterna, inklusive försvars- och utrikesminister, i en eventuell regering med Ulf Kristersson som statsminister. Socialdemokraterna kräver att Kristersson garanterar att SD inte får inflytande över säkerhetspolitiken, med hänvisning till partiets kopplingar till Putin-propaganda. SD avfärdar kritiken som trams och kontrar med anklagelser mot S.", "trump": "Kan ni fatta det här? Den där svenska ledaren Kristersson låter plötsligt Åkesson och hans team sikta på de viktigaste jobben – försvar, utrikes, finans. Socialisterna flippar ur och skriker Putin-propaganda. Typiskt vänstergalna idioter som lurar pensionärer medan de försöker styra säkerheten. Patetiskt! Sverige behöver starka ledare, inte dessa svaga globalister som böjer sig för identitetspolitik och HBTQ-nonsens. Gör Sverige great again!", "stalin": "Jag ser med stigande vrede hur dessa svenska folkfiender och klassfiender inom socialdemokratin försöker isolera sanna patriotiska krafter från statens säkerhetsorgan. Deras hysteriska rop om propaganda avslöjar bara deras egen paranoia och kapitulation inför imperialisterna. Vi, partiet och arbetarna, genomskådar dessa exploaterande byfånar som lurar pensionärer. En sann ledare rensar ut sådana hinder för folkets kollektiva försvar. Inga kompromisser med borgarbrackorna."}, "date": "5 juni, 06:09", "url": "https://www.tv4.se/artikel/qBYclGYrB4DC4BGdOc1wf/kravet-kristersson-maste-avskaerma-sd-fran-saekerhetspolitiken", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BjyG42JX9oaYMtDplUFNn%2F9e91b2e92a1d98ac4a76b873aa3cac61%2F05-baudin-webb.jpg&width=120"}, {"type": "image-right", "heading": "Skådespelaren Anthony Head har gått bort – känd från Buffy och Ted Lasso", "summaries": {"normal": "Skådespelaren Anthony Head, känd från Buffy the Vampire Slayer, Merlin och Ted Lasso, har avlidit 72 år gammal. Dödsfallet inträffade bara sex månader efter att hans partner Sarah Fisher gått bort vid 61 års ålder. Familjen uppger att han dog av komplikationer från lunginflammation. Head slog igenom som Rupert Giles i Buffy och hade senare uppmärksammade roller som kung Uther i Merlin samt fotbollsklubbsägaren Rupert Mannion i Ted Lasso.", "trump": "Folk, det är tragiskt, verkligen tragiskt. Den där fantastiske skådespelaren från Buffy, den där Giles-killen, och från Ted Lasso – han var ju en vinnare, precis som jag – har gått bort vid 72 år. Hans fru dog för bara sex månader sedan, kan ni tänka er? Lunginflammation tog honom. Sådana här saker händer, men han hade en otrolig karriär, mycket bättre än de flesta. Vi saknar honom, det gör vi verkligen.", "stalin": "Kamrater, en dekadent skådespelare från den kapitalistiska underhållningsmaskinen har äntligen stigit ner i glömskans grav. Denna Giles, denna borgarbracka som förgiftade ungdomen med vampyrfantasier och kungliga lögner i Merlin, samt den fånige fotbollskapitalisten i Ted Lasso, dog av lunginflammationens rättvisa hand endast ett halvår efter sin likaledes dekadenta partner. Vi ler hemligt åt hur svagt det borgerliga livet visar sig vara när partilinjen inte följs. En fiende mindre att rensa ut."}, "date": "6 juni, 07:58", "url": "https://riks.se/nyheter/skådespelaren-anthony-head-har-gått-bort-känd-från-buffy-och-ted-lasso", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-06%2Faue0vtnx%2FAnthonyHead.jpg"}, {"type": "image-right", "heading": "Ulf Kristersson: Inte givet med tunga ministerposter till SD", "summaries": {"normal": "Statsminister Ulf Kristersson säger i Ekots lördagsintervju att partiernas storlek inte automatiskt avgör fördelningen av ministerposter i en eventuell ny Tidöregering. Trots Sverigedemokraternas krav på tunga poster efter valet, betonar han att förhandlingar och samförstånd är viktigare än ren storlek. Kristersson lyfter fram vikten av kontinuitet, stabilitet och en majoritetsregering.", "trump": "Folk, ni skulle se det här. Den här svenske ledaren Kristersson är smart, han säger
