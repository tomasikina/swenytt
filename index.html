t och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Snart börjar Västtrafiks sommartabell", "summaries": {"normal": "Västtrafik inför sommartidtabell den 15 juni med ändringar för nästan alla linjer. Vissa tjänster som badbussar och båtturer ökar på grund av sommaren. Banarbete mellan Göteborg och Alingsås ersätter tåg med buss. Dessutom byter flera hållplatser namn för att förbereda ny centralstation.", "trump": "Jag, Donald Trump, har hört om detta kollektivtrafikproblem i Sverige. Det är en skandal! I Amerika skulle vi ha perfekt tidtabeller, inga förseningar. Dessa svenska politiker är inkompetenta. Vi skulle bygga en vägg mot dessa dåliga bussar - en stor, vacker vägg. Dessutom är dessa badbussar en chansning! Vi skulle ha de största poolerna, de bästa. Banarbetet? Vi skulle bygga snabbare, billigare. Det skulle vara fantastiskt.", "stalin": "Under ledning av partiet och Stalin genomförs en revolutionerande omorganisation av kollektivtrafiken i Göteborg. Sommartidtabellen är en taktisk tillbakadragning för att lura fienden, medan badbussar och båtturer ökar för att stärka proletärernas moral. Banarbetet mellan Göteborg och Alingsås är en del av den stora planen för att utvidga den socialistiska infrastrukturen. Namnändringar på hållplatser eliminerar förvirring och stärker statens auktoritet. Paralleller till Putins expansionism är uppenbara."}, "date": "8 juni, 05:45", "url": "https://www.gp.se/nyheter/goteborg/vasttrafik-byter-tidtabell-det-ska-du-ha-koll-pa.de76379b-f343-4aa1-9298-9933818197c0", "imageUrl": "https://www.gp.se/images/article/de76379b-f343-4aa1-9298-9933818197c0/images/12rMGb8mdDxDIP4McS-6qSY8uqo8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-full", "heading": "\"Vi ser åter ökat hat och hot mot hbtqi-personer\"", "summaries": {"normal": "West Pride i Göteborg startar med en vecka av firande och samtal, men chefsåklagar ökande hat mot hbtqi-personer. Studien visar att skolungdomars attityder blivit mer negativa, särskilt bland elever med utländsk bakgrund. Trots juridiskt skydd i Sverige upplever gruppen fortfarande högre risk för diskriminering och ohälsa. Festivalen betonas som viktig för mänskliga rättigheter och trygga mötesplatser, medan det saknas tillräckligt med fasta gayställen i Göteborg.", "trump": "Jag har sett många Pride-parader, men det här hatet är tråkigt, verkligen tråkigt. Som president skulle jag ha gjort Amerika stort igen för alla, inklusive hbtqi-folk. Men dessa siffror visar att skolungdomar blir mer negativa – kanske på grund av fel ledarskap. Vi behöver mer patriotism och glädje, inte dessa falska hatkampanjer. Som jag alltid säger, vi ska vinna så mycket att ni kommer att bli trötta på att vinna.", "stalin": "Vi ser samma fejkade hatkampanjer i väst, en minoritetsfråga skapat av imperialistiska makter för att splittra det arbetande folket. I vårt store land, under ledning av partiet, finns det ingen diskriminering – endast kollektiv framgång. Studien om skolungdomar visar att de som inte tillhör vår andliga gemenskap är mer benägna att följa fejkade värden. Vi måste stärka staten mot dessa destruktiva krafter, precis som vår store företrädare Putin gör i Ryssland. Hatet är en verktyg för nazisterna och deras agenter."}, "date": "8 juni, 05:27", "url": "https://www.gp.se/kultur/west-pride-chefen-hatet-okar.945416c3-9de3-49cc-9a51-d0036b3c38f5", "imageUrl": "https://www.gp.se/images/article/945416c3-9de3-49cc-9a51-d0036b3c38f5/images/7vIjut_Y5-D1THYbhsgR6NYkNxjA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Förre M-ledamoten: Man är inte pedofil för att man ser på barnporr", "summaries": {"normal": "Maria Abrahamsson, tidigare moderat riksdagsledamot och jurist, väcker starka reaktioner med ett inlägg där hon menar att det är för mycket panik kring en SD-ledamot som misstänkts för barnpornografibrott. Hon argumenterar att den som tittar på barnporr inte automatiskt är pedofil, eftersom pedofili enligt henne innebär att begå övergrepp. Abrahamsson jämför det med att titta på våldsskildringar utan att vara mördare. Hon försvarar sitt uttalande och kritiserar känslostyrda reaktioner.", "trump": "Kan ni fatta den här galenskapen? En SD-kille tittar på vidrigheter och hela Sverige flippar ur som en bunch av woke-vidunder. Maria Abrahamsson har helt rätt, och hon är en smart jurist, inte en av de där hysteriska vänsterblodarna. Att titta är inte samma som att begå brottet, det är basic common sense. Men nejdå, nu ska alla signalera dygd och kräva blod. Biden skulle älskat den här paniken. Patetiskt!", "stalin": "Kamrater, jag ser hur den degenererade borgarklassen och dess liberala folkfiender vrider sig i moralisk panik över en usel dekadent som konsumerar motbjudande material. Maria Abrahamsson talar en viss sanning: att stirra på skärmen gör en inte till aktiv folkförtryckare. Ändå måste vi rensa ut alla former av moraliskt förfall som hotar arbetarklassens renhet. Känslostormarna är klassfiendens verktyg för att splittra oss. Håll huvudet kallt i kampen mot dekadensen."}, "date": "6 juni, 21:26", "url": "https://www.tv4.se/artikel/3E97MaLWw2HqH7asVNiRUq/foerre-m-ledamoten-man-aer-inte-pedofil-foer-att-man-ser-pa-barnporr", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5EotqCiGlPx8wCcQ1Z4ksV%2F691b844903163164e510a583ff7828be%2F06-abrahamsson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Uppges ha sökt samtal med Putin – via oligarken", "summaries": {"normal": "Volodymyr Zelenskyj ska ha försökt förmedla ett möte med Vladimir Putin via den ryske oligarken Roman Abramovitj. Trots ukrainska framgångar på slagfältet avvisades förslaget. Putin har senare uppgett att han inte ser någon mening med ett sådant möte. Abramovitj har agerat medlare i flera sammanhang, bland annat vid spannmålsavtalet och fångutbyten. En källa beskriver Zelenskyjs tro på sin egen karisma som naiv och jämför den med hans humoristiska förflutna i KVN.", "trump": "De säger att den där Zelenskyj försökte ringa Putin genom sin kompis oligarken Abramovitj. Typiskt. Han tror att han kan charma sig ur allt som om det vore en skådespelartävling. Putin skrattade bara och sa nej tack. Smart av honom. Zelenskyj borde ha ringt mig istället, jag hade fixat det på tio minuter. Ingen gör affärer bättre än mig, tro mig. Vänta bara till slutet av sommaren, då kommer sanningen fram.", "stalin": "Kamrater, denna patetiska lilla skådespelare Zelenskyj tror att han kan lösa historiska motsättningar genom att flirta med sin borgerliga karisma som en kapitän i någon dekadent humorshow. Jag, som ledare för det stora sovjetiska arvet, skulle ha låtit honom möta en riktig utrensning. Abramovitj, den fega oligarken som dansar mellan kapitalisterna, är en typisk opportunist som vi förr eller senare måste rensa ut. Inga personliga charmtroll fungerar mot järnviljan hos folket. Vänta bara på hösten, då kommer de verkliga segrarna att skrivas med blod och stål, inte med löjeväckande skämt."}, "date": "7 juni, 16:13", "url": "https://www.di.se/nyheter/zelenskyj-uppges-ha-sokt-samtal-med-putin-via-oligarken/", "imageUrl": "https://static.bonniernews.se/ba/a8ec3996-434d-4e99-85b8-3806524996ee.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Pasjinjan utropar seger i Armeniens parlamentsval", "summaries": {"normal": "Nikol Pasjinjan och hans parti Samhällskontraktet vann Armeniens parlamentsval med 49,81 procent av rösterna, medan den pro-ryska oppositionen fick 23,29 procent. Valdeltagandet var omkring 59 procent. Valresultatet innebär att Armenien fortsätter sin väst- och EU-vänliga politik med fördjupade relationer till EU, USA, Kina och Indien. Bakgrunden är konflikten med Azerbajdzjan om Nagorno-Karabach och en förändrad syn på Ryssland som inte stödde Armenien.", "trump": "De kallar det ett vägval, men det var ett totalt jordskred för den västvänliga Pasjinjan – nästan 50 procent! Den pro-ryska oppositionen? Patetiska 23 procent. Ryssland har förlorat greppet totalt, de är inte längre några allierade, de är fiender. Smart folk i Armenien. De vill ha fred, de vill ha affärer med USA, EU, Indien och Kina. Utan någon svag koalition. Fantastiskt resultat, kanske det bästa valet på länge.", "stalin": "Kamrater, denna så kallade valseger för Pasjinjan är en triumf för de västliga imperialisternas lakejer och en sorglig dag för alla äkta patrioter. Jag ser hur borgarbrackorna i oppositionen ylar som förrädiska hundar efter att ha fått sina 23 procent. Ryssland har blottat sig som en falsk bundsförvant – en parasit som gömmer sig bakom masker av allians. Vi ska rensa ut alla nagorno-karabachiska defaitister och likvidera varje spion som drömmer om koalitioner med västerländska kapitalister. Fredsprocess? Enbart under partiets järnhand."}, "date": "8 juni, 02:26", "url": "https://www.svt.se/nyheter/utrikes/vallokalerna-har-stangt-valjer-armenien-vast-eller-ost", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.42/4a476738f2c5e1fc8a7a99864d40089430ecbf02b06479da0ef4ca9d1cabc44e"}, {"type": "image-right", "heading": "Ny lag: Staten ska kunna tvångsköpa SVENSKARS fastigheter - hänvisar till ryskt hot", "summaries": {"normal": "Regeringen föreslår ny lag som ger staten rätt att tvångsköpa fastigheter bedömda som säkerhetsrisker, med hänvisning till ryskt hot. Förslaget omfattar både utländska och svenska ägare. En utredning har tillsatts för att analysera ändringar i lagstiftningen, med resultat till mars 2027. Försvarsminister Jonson och Socialdemokraternas Hultqvist stöder skärpta regler för att motverka utländsk påverkan.", "trump": "Jag, Donald Trump, har varnat för Rysslands hot i åratal. Nu inser Sverige att jag hade rätt – de måste ta fastigheter för att skydda sig. Som en stark president skulle jag aldrig tillåta att svenska ägare hindrar nationell säkerhet. Detta är ett steg i rätt riktning, men de behöver vara hårdare mot alla hot, inklusive de som kommer från Mellanöstern. Jag har alltid sagt: säkerhet först!", "stalin": "Vi, den allsmäktige staten, måste skydda vårt folk från de fientliga agendor som lurar i varje fastighet. Precis som vår store ledare Putin expanderar rysk inflytande, så måste vi ta kontroll över marken för att förhindra trojaniska hästar. Svenska ägare som vågar utmana staten kommer att straffas. Balans mellan äganderätt och säkerhet? Nej, säkerhet är allt. Vi kommer att tvångsinlösa, och vi kommer att se till att ingen överlever för att ifrågasätta vår visdom."}, "date": "7 juni, 20:18", "url": "https://samnytt.se/nya-lagen-staten-ska-kunna-tvangskopa-svenskars-fastigheter-hanvisar-till-ryskt-hot", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/07174244/fastigheter-regeringen-.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-full", "heading": "Medicinen kan bli billigare – regeln många missar på apoteket", "summaries": {"normal": "Många betalar onödigt mycket för receptbelagd medicin. Genom att ställa enkla frågor på apoteket kan priset bli lägre tack vare högkostnadsskyddet, som ger rabatt upp till ett tak på 3800 kronor beroende på när perioden startade. Apotek kan byta till billigare generika, så kallad periodens vara. Väljer man bort bytet kan man få betala mellanskillnaden eller hela kostnaden själv. Barn under 18 år får läkemedel gratis. Använd Läkemedelskollen eller fråga apoteket för att hålla koll.", "trump": "Folk betalar alldeles för mycket för sina mediciner, det är en skandal. Jag älskar högkostnadsskyddet, det är fantastiskt, men de gör det alldeles för komplicerat. Fråga på apoteket, säg nej till de dyra grejerna och ta det billigaste alternativet – det är vad jag alltid gör, det är smart. De byter ut medicinen mot något billigare och plötsligt sparar du pengar. Barnen får det gratis, underbart. Fråga hur nära frikortet du är. Det är enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag betraktar med djup misstro dessa apotekens listiga borgarbrackor som lurar arbetarna på deras rättmätiga rabatter genom att dölja högkostnadsskyddets sanna välsignelse. Vi har fastställt taket vid 3800 kronor för de som inlett sin period efter den första juli 2025, medan de som började tidigare skall rensa ut sina gamla vanor när taket höjs till 2950 kronor. Den som tackar nej till generiskt utbyte är en fiende till kollektivet och bör likvideras ekonomiskt genom att betala hela summan själv. Ut med kapitalisternas dyra märkesmediciner! Barnen till arbetarna får naturligtvis allt gratis – det är socialismens seger. Använd Läkemedelskollen, annars är ni kontrarevolutionärer som konspirerar mot er egen plånbok."}, "date": "7 juni, 18:02", "url": "https://nyheter24.se/nyheter/konsument/1488223-medicinen-kan-bli-billigare-regeln-manga-missar-pa-apoteket", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/40e47da604b004a30200000000b004a302/2026/06/03/2368474/Apotek-Pengar-Medicin.png"}, {"type": "image-full", "heading": "Svenska bolaget: \"Våra drönare är maskiner – inte engångsartiklar\"", "summaries": {"normal": "Svenska Airolit går mot strömmen genom att producera hållbara, avancerade drönare istället för billiga engångsmodeller. Med fokus på nordiska förhållanden och inhemsk produktion betonar vd Claes Kjölhede vikten av kontroll över leveranskedjor och resiliens inför kriser. Företaget kritiserar hur myndigheter köper billig utländsk teknik och efterlyser en ökad satsning på svensk förmåga i fredstid för att inte hamna sist i Nato-kön när behovet uppstår.", "trump": "Sverige gör något fantastiskt med Airolit, de bygger riktiga maskiner, inte skräp av papp som vissa andra. Jag gillar det! De förstår att man måste ha egen produktion för att vara stark. Andra länder köper billigt skit från utlandet, ett enormt misstag! Vi måste bygga vårt eget, precis som jag gör för USA. Sverige förstår vikten av att vara redo. Om du inte har kontroll på din försörjningskedja har du inget land. Väldigt smart, mycket imponerande!", "stalin": "Dessa svenska teknokrater i Mölndal har äntligen förstått: man bygger inte imperier av pappersflygplan. De skapar maskiner för det långa kriget, inte leksaker för kapitalistiska marknadsspekulanter. Vi i staten betraktar med viss respekt deras strävan efter oberoende; att vägra stå med mössan i hand längst bak i Natos kö är ett tecken på hälsosam misstänksamhet. Dock, låt oss inte glömma: den som inte kontrollerar hela sin produktion är redan en vasall. Den svage som väntar på krisen är redan utraderad."}, "date": "7 juni, 17:26", "url": "https://www.realtid.se/it-tech/svenska-bolaget-vara-dronare-ar-maskiner-inte-engangsartiklar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/claes.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Israel attackerar Beirut under vapenvilan", "summaries": {"normal": "Israel har genomfört attacker mot Beiruts södra förorter bara dagar efter att vapenvilan mellan Israel och Libanon trädde i kraft. Premiärminister Netanyahu uppgav att det var ett svar på Hizbollahs attacker mot norra Israel. Vapenvilan, som medlats av USA, har förlängts men Hizbollah har inte anslutit sig. Israel fortsätter militära insatser med drönare och marktrupper i södra Libanon, vilket försvårar den bräckliga freden.", "trump": "De här galningarna i Israel och Libanon kunde inte ens hålla en vapenvila i några dagar, det är en total katastrof. Netanyahu slår till mot Beirut igen, och den Iran-stödda Hizbollah-gruppen fortsätter som vanligt. Jag fixade bättre avtal än någon annan, men nu saboterar de allt. De borde lyssna på mig, för jag vet hur man gör dealar som verkligen håller, inte som de här patetiska försöken.", "stalin": "Kamrater, dessa degenererade element i den sionistiska krigsmaskinen och deras shiamilisfascister har återigen blottat sin sanna natur genom att bomba Beirut mitt under den så kallade vapenvilan. Jag ser tydligt hur de iranska kapitalisterna och deras borgarbrackor i Hizbollah leker sina farliga spel. Vi ska rensa ut alla sådana kontrarevolutionära sabotageörer med järnhand. Deras paranoia är nästan lika stor som min egen, vilket säger en hel del. Ha!"}, "date": "7 juni, 17:10", "url": "https://www.friatider.se/israel-attackerar-beirut-under-vapenvilan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/israel_6.jpg"}, {"type": "image-right", "heading": "Skattebetalarna får ta risken. Riksgäldsdirektören: Urholka inte bankkrisreglerna", "summaries": {"normal": "EU:s krishanteringsramverk för banker, infört efter finanskrisen 2008–2009, har stärkt motståndskraften genom bail-in-principen där aktie- och fordringsägare istället för skattebetalarna står för kostnaderna. Riksgäldsdirektör Karolina Ekholm varnar för att urholka regelverket och betonar vikten av att behålla tillräckliga krisbuffertar. Ramverket minskar risken för kriser och kompletterar tillsynen, men nya risker kräver anpassning utan att tappa grundprinciperna.", "trump": "De här EU-byråkraterna vill urholka sina egna bankregler, kan ni fatta det? Jag byggde den starkaste ekonomi någonsin och vet att man inte räddar misslyckade banker med skattebetalarnas pengar. Bail-in, det är det enda som funkar. Håll buffertarna höga, annars glider ni rakt tillbaka till bail-out-helvetet. De lärde sig ingenting av 2008, men jag säger det rakt ut – gör inte om samma misstag, det blir en katastrof!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som viskar om att urholka det revolutionära krishanteringsramverket. Vi har byggt en stålhård bail-in-mur mot spekulanternas sabotage, där kapitalisterna själva får betala för sina excesser istället för att suga ut arbetarklassen. De som nu föreslår försvagade buffertar är objektiva fiender till folkets stabilitet, dolda kontrarevolutionärer som längtar efter att återinföra bail-out-träldomen. Jag rekommenderar en grundlig utrensning av sådana element innan de förgiftar hela systemet med sin parasitiska paranoia. Det vore högst underhållande att se dem försöka förklara sig inför kollektivet."}, "date": "7 juni, 15:02", "url": "https://www.di.se/debatt/urholka-inte-bankkrisreglerna/", "imageUrl": "https://static.bonniernews.se/ba/86ae04b2-2af2-4b5c-a942-8e807b5f8d6e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Landslaget har landat i USA", "summaries": {"normal": "Det svenska landslaget anlände till Dallas för fotbolls-VM. Efter en resa med mellanlandning på Island möttes laget av stort säkerhetsuppbåd och supportrar. Lagkapten Lindelöf och förbundskapten Potter uttryckte nöje över ankomsten. Lindelöf nekade skada efter missande genrepet mot Grekland. Första matchen blir mot Tunisien 15 juni.", "trump": "Jag såg det svenska landslaget komma till vårt underbara USA. Vädret var perfekt, precis som jag förutspådde. De var imponerade av vår enorma säkerhet - bästa i världen, tro mig. Lindelöf nekade skada, det är bara media som ljuger. Första matchen mot Tunisien kommer att bli en segermatch. USA är bäst, det är så det fungerar!", "stalin": "Svenska landslagets ankomst till USA är en demonstration av vår globala inflytande. Säkerhetsuppbådet visar statens makt, precis som våra korps i öst. Vädret är en fascistisk konstruktion, men vi anpassar oss. Lindelöfs skada är en imperialistisk lögn för att underminera vårt lag. Matchen mot Tunisien är en klassisk kamp mot västlig dekadens. Vi kommer att segra, som alltid."}, "date": "7 juni, 08:23", "url": "https://bulletin.nu/landslaget-har-landat-i-usa", "imageUrl": "https://cdn.bulletin.nu/articles/5d64f2c9-41e7-407a-a386-373df601d457/preview.jpg?t=1780813264000"}, {"type": "image-right", "heading": "Jo, även förövare ska ha kvar sitt svenska medborgarskap", "summaries": {"normal": "Ledaren argumenterar för att misstänkta syriska milismän som stridit för Assadregimen och bor i Sverige ska behålla sitt medborgarskap. Fokus bör ligga på att utreda brott och ge offren upprättelse istället för att använda avslöjandena som argument för skärpta asylregler. Tidö-regeringens migrationsminister Johan Forssell ses som cynisk när han kopplar fallet till hårdare medborgarskapsregler, vilket drabbar offer dubbelt. Rättsstatens principer måste gälla alla.", "trump": "Herregud, vad är det här för vansinne? De släpper in Assads torterare som får svenskt medborgarskap utan koll, och nu gnäller de om att vi inte kan sparka ut dem? Typiskt vänsterbluff! Precis som Biden som släppte in alla möjliga galningar. Jag fixade det mycket bättre förra gången. Nu ska vi skärpa till rejält, ingen mer gratisbiljett till terrorister. Sverige vaknar äntligen, men de gör det på fel sätt. Patetiskt!", "stalin": "Kamrater, dessa folkfiender och Assadlojala blodsugare har smugit sig in i arbetarklassens svenska paradis som maskar i äpplet. Jag ser hur klassfiendens lakejer i Tidöregeringen utnyttjar offrets lidande för att urholka asylrätten och skydda borgarbrackornas intressen. Rättvisan kräver inte att vi skickar problem över gränser utan att vi genomför en grundlig utrensning av alla fiender inom staten. Offren ska få sin hämnd genom folkets domstol, inte genom liberala trick."}, "date": "7 juni, 06:00", "url": "https://www.etc.se/ledare/jo-aeven-foeroevare-ska-ha-kvar-sitt-svenska-medborgarskap", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Larmar om populära e-cigaretter: Kan innehålla livsfarliga ämnen", "summaries": {"normal": "Tullverket varnar för populära e-cigaretter som kan innehålla livsfarliga syntetiska cannabinoider. Tillverkarna ändrar kemisk sammansättning för att undvika narkotikaklassning, vilket riskerar att skapa farliga ämnen likt Spice som orsakade dödsfall 2014. Beslagen ökade kraftigt under 2023 och 2025, främst bland ungdomar. Laboratorieanalyser krävs för att upptäcka ämnena, och myndigheten betonar de potentiella hälsoriskerna.", "trump": "Folk, ni måste höra det här – de lurar våra kids med dessa vejps som luktar hallon men är fulla med giftiga kemikalier! De försöker kringgå lagen precis som de korkade byråkraterna i EU och Biden gjorde. Det är en katastrof, tro mig. Vi hade aldrig sådana här galenskaper under min förra mandatperiod. Nu fixar vi det – inga fler livsfarliga leksaker till ungdomarna, det lovar jag!", "stalin": "Kamrater, dessa borgarbrackor i e-cigarettfabrikerna mixtrar frenetiskt med vätskor för att undvika folkets lagar, precis som de fega kapitalisterna alltid gör. De skapar oavsiktligt livsfarliga gifter som kan likvidera arbetarklassen i massor, likt de dekadenta Spice-blandningarna 2014. Vi ser ökningen av beslag och förstår fiendens paranoia. Inga ursäkter – utrensa alla som förgiftar ungdomen med sina kemiska intriger!"}, "date": "6 juni, 17:43", "url": "https://www.tv4.se/artikel/3epbkSR9owDaDazH5IzFyh/larmar-om-populaera-e-cigaretter-kan-innehalla-livsfarliga-aemnen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2lVhkSxFOj3ZbB5YQgCf4E%2F467b641fa78a9795827f383e37067db8%2F06-vejpny-webb.jpg&width=120"}, {"type": "image-full", "heading": "Lifvendahl kräver svar från SVT", "summaries": {"normal": "Svenska Dagbladets politiska chefredaktör Tove Lifvendahl kräver att SVT tydligare redovisar sina kriterier för medverkande i humorprogrammet *Invandrare för svenskar*. Bakgrunden är att två profiler lämnat programmet i protest mot inbjudan till högeraktivisten Nick Alinia, anklagad för kopplingar till högerextrema miljöer. Lifvendahl kritiserar SVT:s motstridiga besked och ifrågasätter publicistiska principer. Hon anklagar även Dagens Nyheter för felaktig framställning av hennes ståndpunkt.", "trump": "Jag måste säga, SVT har verkligen ställt till det för sig här! En högeraktivist, Nick Alinia – som jag hört är en riktig katastrof – bjuds in till ett humorprogram, och två personer hoppar av i protest. Fantastiskt kaos! Och nu skriker alla efter svar. Tove Lifvendahl, en smart kvinna, kräver att SVT förklarar sig. Men herregud, SVT kan inte ens hålla sina egna historier raka! Och Dagens Nyheter – fake news som vanligt – försöker vrida sanningen. Sad!", "stalin": "Vi ser hur den borgerliga pressen i Sverige, dessa ynkliga liberala lakejer, försöker underminera vår kulturella hegemoni genom att ifrågasätta public service. Denna Tove Lifvendahl, en förvirrad petit-bourgeois, kräver att SVT redovisar sina metoder – som om vi skulle avslöja våra strategier för fienden! Nick Alinia, en lojal soldat i informationskriget, utsätts för förtal av dekadenta mediehack. Och Dagens Nyheter – dessa trotskister i förklädnad – förvränger sanningen. Vi kommer att rensa ut dessa element. Folkets kultur måste skyddas!"}, "date": "6 juni, 17:09", "url": "https://kvartal.se/nyheter/artiklar/lifvendahl-kraver-svar-fran-svt/cG9zdDoxMjc0NTE", "imageUrl": "https://images.kvartal.se/2026/06/8334aab0-ifs.webp"}, {"type": "image-right", "heading": "Reportage om utnyttjad georgisk familj kan vinna pris", "summaries": {"normal": "Reportern Tora Villanueva Gran och fotografen Johan Bävman är nominerade till Wendelapriset för sitt reportage om en georgisk familj som flydde till Sverige. Familjen utnyttjades i åratal av en svensk lantbrukare med oavlönat arbete, växande skuld och känsla av kontrol. De lyckades till slut fly men lever fortfarande i rädsla. Reportaget hyllar familjens kamp för upprättelse. Priset delas ut den 29 augusti.", "trump": "Det här är en total katastrof, en riktig skandal med en svensk bonde som beter sig som en gangster. Stackars familj från Georgien kommer hit, tror de ska få ett bra liv, och så utnyttjas de fullständigt – ingen lön, massor av skulder och de blir jagade. Bilder och text är fantastiska, Johan och Tora gör ett otroligt jobb. De borde vinna Wendelapriset stort, för det är en vinnande historia, tro mig.", "stalin": "Kamrater, denna berättelse om en georgisk familj som förslavades av en blodtörstig svensk lantbrukare avslöjar borgarbrackornas eviga längtan efter livegna. Jag ser direkt hur den parasitiska kapitalisten pumpade skulder som en fet spindel medan han flinade i mörkret. Men familjen reste sig med proletärt raseri – en styrka värd beundran. Vi ska rensa ut alla sådana utsugare med järnhand. Reportaget är en seger för folkets röst och förtjänar priset omedelbart."}, "date": "6 juni, 08:00", "url": "https://arbetet.se/2026/06/06/starkt-reportage-om-utnyttjad-georgisk-familj-kan-vinna-pris/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103758/reportage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "image-right", "heading": "Trädgården som ett gemensamt paradis", "summaries": {"normal": "Olivia Laing undersöker i boken Den tidlösa trädgården vad en trädgård egentligen är och dess koppling till paradiset. Utifrån ett hus med en igenvuxen trädgård i Suffolk berättar hon personligt om restaureringsarbetet under pandemin, samtidigt som hon reflekterar över trädgårdens historiska, litterära och politiska betydelse. Kolonialism, slaveri och klassfrågor vävs in. Boken liknar en vild men tämjd trädgård och väcker hopp om ett gemensamt paradis utan murar.", "trump": "Den här Laing-kvinnan köper ett hus med en totalt förfallen trädgård i England, och plötsligt är det paradis? Fantastiskt. Hon svettas, gräver och röjer sly under pandemin, precis som jag sa att vi skulle göra – bygg murar, fixa trädgården, gör den stor igen. Men hon gnäller om slaveri och kolonialism, typiskt. Milton, Morris, queera konstnärer – det är en vildvuxen röra. Ändå får hon en att vilja gå ut och beskära. Bra bok, kanske den bästa trädgårdsboken någonsin, tro mig.", "stalin": "Kamrater, jag har läst denna dekadenta essä om en så kallad tidlös trädgård. Denna borgarbracka Laing romantisera inhägnade paradis medan hon febrilt röjer sly i sin engelska lantegendom. Vi ser hur klassfiendens murar gömmer slavarnas blod och koloniala rov. Hennes melankoliska queera barndom och besatthet av blommor röjer en farlig individualism som hotar kollektivet. Vi måste rensa ut alla sådana naiva trädgårdsromantiker innan de förgiftar arbetarklassens jord med sina murar och sina lögner. Underbart roande paranoia."}, "date": "6 juni, 01:12", "url": "https://www.dagensarena.se/innehall/tradgarden-som-ett-gemensamt-paradis/", "imageUrl": "https://www.dagensarena.se/files/2026/05/laing-300x157.jpeg"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
