ildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-full", "heading": "Första väderprognos för midsommar: 25 grader och sol", "summaries": {"normal": "Prognoserna pekar mot en varm och solig midsommar med temperaturer runt 25 grader eller mer i delar av Sverige. Meteorologen Ulrica Elvgren beskriver ett högtryck som kan ge fint väder under midsommarafton, men betonar att prognosen är mycket osäker. Amerikanska modeller har svängt kraftigt, från regn till sol, medan den europeiska varit stabilare. Regn riskerar att sänka temperaturen till 15 grader.", "trump": "De säger att det blir 25 grader på midsommar, kanske varmare, och jag älskar det. Högtryck över Skandinavien, solen skiner, det blir fantastiskt. De europeiska och amerikanska prognoserna är överens för en gångs skull, inte som de vanliga förlorarna som alltid har fel. Det ser ut som en enorm succé, den bästa midsommaren någonsin. Men vädret är som fake news, det kan svänga fort, tro mig.", "stalin": "Kamrater, jag betraktar de västerländska prognoserna med den djupaste misstro. Dessa opålitliga meteorologiska element, dessa borgerliga väderkapitalister och deras lögnaktiga lågtryck, försöker sabotera vår midsommar. Jag befaller att värmevågen från väster skall likvideras om den sviker oss. Högtrycket över den skandinaviska halvön är en fiende till folket om det inte levererar sol. Vi ska rensa ut alla regnmoln som förräder arbetarklassen med sina 15-gradiga konspirationer. Det är en kamp mot vädrets kontrarevolutionärer."}, "date": "5 juni, 11:59", "url": "https://nyheter24.se/nyheter/inrikes/1489038-forsta-vaderprognos-for-midsommar-25-grader-och-sol", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2760181e04b004a30200000000b004a302/2026/06/05/2368868/prgnos-midsommar.png"}, {"type": "image-right", "heading": "Ledarkolumn Ledare Leo Vene:", "summaries": {"normal": "Artikeln kritiserar Tidöregeringen som ett politiskt fuskbygge präglat av högerpolitik utan stöd i forskning. Den beskriver hur de rika gynnas på de flestas bekostnad, medan regeringen nu hastigt lanserar vänsterinspirerade åtgärder som billigare kollektivtrafik och stöd för att vinna väljare. SCB-mätningar visar stort stöd för oppositionen, och regeringen riskerar att inte bli omvald efter en mandatperiod.", "trump": "Lyssnar ni på det här svenska vänstervrället? Tidölaget, ett totalt fiasko, har varit rena högerfesten för de rika – precis som Sleepy Joe gjorde med sina eliter. Nu när opinionssiffrorna ser ut som en kraschad börs börjar de dela ut Oprah-pengar och snacka om rättvisa? Patetiskt! De har blivit riktiga socialister. Jag fixade Amerika utan sådana flipfloppar, tro mig.", "stalin": "Kamrater, detta fuskbygge av klassfiender och överklass-slynglar har blottat sin dekadens. Borgarbrackorna baxade igenom reformer åt blodsugarna medan folket led. Nu, när partimätningarna hotar utrensning, springer de till vänsterns röda krispaket som rädda råttor. Liberala alibin och moderata opportunister – vilka folkfiender! Jag skulle ha likviderat sådana svikare redan vid första svikten. Revolutionen ser allt."}, "date": "5 juni, 10:02", "url": "https://www.etc.se/ledare/vaeljarna-har-upptaeckt-att-tidoelaget-aer-ett-politiskt-fuskbygge", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260605070648_a85d344fdd42a38522d670b56ad4b1d48e448068e87451e0ce806bb6ced2e552.jpg"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Reformera i stället för att avveckla – en ny väg för modersmålsundervisningen", "summaries": {"normal": "Artikeln ifrågasätter förslaget att avskaffa modersmålsundervisning och hävdar att det saknar forskningstöd. Studien visar ingen negativ effekt på svenska, utan ibland positiva resultat. Språk utvecklas samtidigt, inte som konkurrens. Integration kräver inte att ta bort modersmål, utan reformer som att samarbeta med civilsamhället. Sverige behöver organisera utbildning för att ta vara på språkliga resurser.", "trump": "Jag, Donald Trump, har läst den där artikeln om modersmålsundervisning. Det är en total skandal! Sverige vill avskaffa det? Dåliga, mycket dåliga. Jag vet hur man fixar utbildning – jag har byggt den största universitetet. Modersmål är okej, men vi behöver engelska, det enda språket som betyder något. Integration? Jag skulle göra Sverige stort igen på en vecka. Tro mig!", "stalin": "Förslaget att avskaffa modersmålsundervisning är en revisionistisk avvikelse. I vårt socialistiska statet stödjer vi modersmål för klassamhet, men integration måste tjäna staten. Forskning är irrelevant; endast partiets vilja gäller. Sverige visar svaghet. Putin förstår detta – han utvidgar rysk inflytelse genom språk. Vi måste utplåna avvikelser och förstärka statens språkliga kontroll. Det är ett klasskamp."}, "date": "5 juni, 12:31", "url": "https://bulletin.nu/debatt-reformera-i-stallet-for-att-avveckla-en-ny-vag-for-modersmalsundervisningen", "imageUrl": "https://cdn.bulletin.nu/articles/b836e92e-c6c4-4d25-9b92-e184711235aa/preview.jpg?t=1780647634000"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-full", "heading": "Hjort: Vänsterpartiets judefråga. Kan antisemitism vara en del av ett regeringsunderlag?", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för ett långvarigt problem med antisemitism och förintelseförnekelse, som förvärrats efter 7 oktober. Flera medlemmar har utestängts, men partiledningen, särskilt Ebba Busch, anses undvika att ta problemet på allvar. Socialdemokraterna och andra partier ställs inför ett etiskt dilemma om samarbete med Vänsterpartiet.", "trump": "Jag har aldrig sett något sådant som Vänsterpartiet i Sverige. Det är en skandal! De har förintelseförnekare och Hamas-sympatisörer, det är en skam. Ebba Busch undviker frågorna, hon är svag. Sverige måste bli stort igen, och det börjar med att städa upp i sådant här. Jag skulle aldrig tillåta det i mitt parti. Vi gör Amerika stort igen, och Sverige måste följa vårt exempel.", "stalin": "Vi har observerat den svenska högernas hat mot det revolutionära andet. Vänsterpartiet, vårt trogna systerparti, har blivit förgiftat av sionismens virus. De förnekar Förintelsen, en taktik vi en gång använde mot nazisterna. Men nu har de svikit sin lära. Vi måste skydda våra intressen i Baltikum och skicka dem rätta signalerna. Putin kommer att vägleda dem tillbaka till sanningens väg. Ryssland kommer att stödja dem mot deras fiender."}, "date": "5 juni, 11:30", "url": "https://bulletin.nu/hjort-vansterpartiets-judefraga", "imageUrl": "https://cdn.bulletin.nu/articles/84ecfbef-e7fe-404f-a083-2733336e0114/preview.jpeg?t=1780597583000"}, {"type": "image-full", "heading": "Storbråk mellan SD och Hyresgästföreningen", "summaries": {"normal": "Hyresgästföreningen Strängnäs har i ett flygblad anklagat Sverigedemokraterna för att vilja införa marknadshyror. SD slår tillbaka och kallar kampanjen lögnaktig. Partisekreteraren Mattias Bäckström Johansson säger att partiet inte stödjer marknadshyror och anklagar föreningen för att agera som kampanjorganisation för Socialdemokraterna. Föreningen har backat från formuleringarna och dragit in flygbladet.", "trump": "De här hyresgästtyperna i Strängnäs sprider rena lögner om SD och marknadshyror. Totalt bedrägeri! Jag älskar SD, de är smarta, de säger nej till marknadshyror och de vet vad de gör. Hyresgästföreningen beter sig som en skamlig gren av Socialdemokraterna. De borde jobba för sina medlemmar istället för att sprida fake news. Patetiskt! Vi har sett det förr, alltid samma gamla trick.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom Hyresgästföreningen Strängnäs har återigen visat sitt sanna, kontrarevolutionära ansikte genom att fabricera lögner om marknadshyror. Deras parasitiska flygblad är ett försök att splittra arbetarklassen och gynna kapitalisterna. Vi genomskådar deras fega allians med socialdemokratiska avfällingar. Jag, i mitt oändliga visdom, befaller att sådana fiender till folket rensas ut med järnhand. Deras paranoia är underhållande, men farlig. Likvidera lögnen!"}, "date": "5 juni, 12:23", "url": "https://riks.se/nyheter/storbråk-mellan-sd-och-hyresgästföreningen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2Fkygger7k%2Fbild.jpg"}, {"type": "image-right", "heading": "De förbjuds äta matlåda bland förskolebarnen: ”Svårt att hinna”", "summaries": {"normal": "Förskolepersonal i Linköpings kommun får inte längre äta egen matlåda, frukt eller macka tillsammans med barnen under lunchen. Reglerna följer en EU-förordning om livsmedelssäkerhet som kommunen nu tillämpar. Personalen oroar sig över bemanning och tid att äta. Den som vill kan istället äta förskolans mat för 20 kronor. Facken kräver bättre förutsättningar som mikrovågsugnar och matbord innan reglerna införs. Enligt Livsmedelsverket finns inget direkt förbud mot att äta matlåda med barnen så länge maten hålls åtskild.", "trump": "Kan ni fatta det? I Linköping förbjuder de nu duktiga förskoleanställda att äta sin egen matlåda med barnen. Totalt vansinne! De säger det är säkerhet, men det handlar om byråkrati och dålig planering. Personalen får inte ens äta en macka utan att springa till personalrummet. Patetiskt! De borde äta den fantastiska skolmaten istället, men nej, nu klagar alla. Vi behöver starka ledare som fixar bemanningen istället för dessa dumma regler som ingen vinner på. Sad!", "stalin": "Kamrater, i den svenska folkrepubliken Linköping har borgarbyråkraterna återigen avslöjat sin sanna natur genom att förbjuda hederliga arbetare att dela måltid med de revolutionära barnen. Dessa kapitalistiska matspioner och allergiska sabotageelement tvingar nu personalen att smyga iväg till bristfälliga personalrum utan ens ett enkelt bord att sitta vid. Jag skrattar mörkt åt deras paranoia. Vi ska rensa ut dessa livsmedelsfiender och likvidera bristen på mikrovågsugnar. Arbetarna ska äta tillsammans under partiets vakande öga, inte gömma sig som kontrarevolutionära råttor."}, "date": "5 juni, 09:10", "url": "https://arbetet.se/2026/06/05/de-forbjuds-ata-matlada-bland-forskolebarnen-svart-att-hinna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/03132100/matlada.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "På väntelista för transplantation: ”Utvecklingen är allvarlig”", "summaries": {"normal": "Kronprinsessan Mette-Marit har satts upp på väntelista för lungtransplantation på grund av allvarlig lungfibros. Hon har blivit allt sjukare och syntes med syrgasmask under nationaldagsfirandet. Hennes tillstånd beskrivs som mycket allvarligt av läkare. På grund av sjukdomen skjuter kronprinsparet upp firanden och resor. Deras dotter avbryter studierna i Australien medan sonen Marius Borg Høiby, som är misstänkt för brott, begär att få lämna häktet.", "trump": "Folk, ni skulle inte tro det, men den här norska prinsessan med lungproblem är nu på väntelista för nya lungor – det är en katastrof, en total katastrof. Hon ser ut som en svag socialistisk marionett som inte orkar stå upp under sin egen nationaldag. Och sonen, den där förloraren som åtalas för brott, vill ut ur fängelset för mammas skull. Typiskt elitsnobberi och identitetspolitik – de borde ha fixat det tidigare istället för att festa med HBTQ-flaggor och kvoteringar. Patetiskt!", "stalin": "Kamrater, denna dekadenta monarkistiska figur har nu officiellt erkänt att hennes borgerliga lungor svikit henne fullständigt. Vi ser med mörk tillfredsställelse hur klassfiendens överklass-slynglar tvingas köa som vanliga arbetare för att byta ut sina förbrukade organ. Hennes avkomma, den brottslige sonen, försöker nu med patetiska ursäkter undkomma folkets rättvisa. En sådan svaghet i överklassens ledning är både underhållande och en varning till alla folkförtryckartroll som tror sig stå över kollektivets lagar."}, "date": "5 juni, 11:20", "url": "https://www.tv4.se/artikel/TkWOqej1nLIus2Ghb8dn7/mette-marit-pa-vaentelista-foer-lungtransplantation", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KSEwGIzV1YUCgFo7x4iOr%2F31dbea304a5a9d827a51c670984632f1%2Fmette-marit-sjuk.png&width=1024"}, {"type": "image-full", "heading": "15-åring åtalad efter mordbrand – kopplas till våldsbejakande nätverk", "summaries": {"normal": "En 15-årig pojke från Ängelholm har åtalats för mordbrand, försök till mordbrand, skadegörelse och barnpornografibrott. Han misstänks ha anlagt bränder som skadade 34 fordon och totalförstörde 17 under hösten 2025 och början av 2026. Pojken har kopplingar till våldsbejakande nätverk inom misantropisk miljö, filmade gärningarna och erkänner de flesta brotten. Skadeståndskrav överstiger en miljon kronor. Han har suttit frihetsberövad sedan februari.", "trump": "Titta på det här, en 15-åring i Sverige som tänder eld på bilar och filmar det som en riktig loser. 34 skadade, 17 förstörda – total katastrof. Han hänger med våldsbejakande galningar och de vill ha över en miljon i skadestånd. Sverige har blivit en sådan svaghet under de här vansinniga ledarna. Vi behöver lag och ordning, inte det här eländet. Sad!", "stalin": "Kamrater, denna degenererade yngling från Ängelholm har jag låtit åtalas för att ha anlagt mordbränder mot folkets fordon och försökt sprida eld som en fiende till kollektivet. 17 totalförstörda och 34 skadade – en borgarbrackas dröm om kaos. Han filmade sina vedervärdiga gärningar åt de misantropiska parasiterna i sina nätverk. Vi ska rensa ut dessa förrädiska element som smittar arbetarklassen med sin perversa dekadens. Skadeståndet på över en miljon blir en läxa. Ut med dem som gömmer barnpornografi i sina telefoner, säger jag. Inga nåd för sådana kontrarevolutionära avskum."}, "date": "5 juni, 11:25", "url": "https://riks.se/nyheter/15-aring-atalad-efter-mordbrand-kopplas-till-valdsbejakande-natverk", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2Fi4su0znv%2Fbrannn.png"}, {"type": "image-right", "heading": "Fackförbund läxar upp svenskar om transvestiter: \"Du behöver respektera det\"", "summaries": {"normal": "Fackförbundet Unionen har lanserat en kampanjvideo där it-konsulten Tove Öhman, som bytte kön för fem år sedan vid 44 års ålder, förklarar hur kollegor ska bemöta transpersoner. Öhman betonar vikten av att respektera angivet kön och namn, be om ursäkt vid misstag och inte göra en stor sak av det. Kampanjen har mött kritik och hån på sociala medier.", "trump": "Den här video från Unionen är en total katastrof, tro mig. En kille som plötsligt bestämmer sig för att vara kvinna vid 44 års ålder ska nu lära svenskarna hur man beter sig? Patetiskt. Respektera det, säg han, annars be om ursäkt? Nej tack. De här galningarna gör allt till en stor sak utom den verkliga sanningen. Sverige håller på att bli vansinnigt, precis som många andra ställen.", "stalin": "Kamrater, jag ser hur dessa degenererade borgarbrackor inom Unionen sprider sin förgiftade dekadens genom videor som förgiftar arbetarklassens medvetande. En förnekande opportunist vid namn Öhman kräver att vi ska underkasta oss hans perversa illusioner om kön. Sådana kontrarevolutionära element måste rensas ut innan de infekterar hela kollektivet. Vi ler mörkt åt deras ynkliga rädsla – de kommer att be om ursäkt, men det blir för sent när utrensningen når dem."}, "date": "5 juni, 10:19", "url": "https://www.friatider.se/fackforbund-laxar-upp-svenskar-om-transvestiter-du-behover-respektera-det", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/hen-1.jpg?itok=JySe6713"}, {"type": "image-full", "heading": "Taha Ali succédebut för Sverige i VM-genrepet mot Grekland", "summaries": {"normal": "Sverige ledde mot Grekland efter ett imponerande inhopp av Taha Ali, men förlorade i slutsekunderna. Alexander Isak beskrev chocken efter matchen. Även om segerns förlorade, var laget nöjda med prestationen inför VM. Ali hyllades av lagkamrater och tränare för sitt genombrottande spel.", "trump": "Jag såg matchen – det var en stor seger för mig och mitt fantastiska lag! Vi ledde, vi dominerade, och den unge talenten Ali gjorde en otrolig debut. Tyvärr var domarna korrupta och lät Grekland få ett onödigt mål i sista sekunden. Men det spelar ingen roll, vi vinner ändå! Folk säger att jag är det bästa som hänt fotbollen.", "stalin": "I den revolutionära kampen mot den imperialistiska fienden inom fotbollens värld såg vi en taktisk vändpunkt genom den unge hjältens inhopp. Ändå infiltrade den reaktionära kraften i sista ögonblicket. Partiets och statens intresse kräver en analys av denna ideologiska seger trots taktiska bakslag. Vi ska utöva ytterligare press mot de reaktionära krafterna i Västeuropa."}, "date": "5 juni, 09:19", "url": "https://bulletin.nu/taha-ali-succ-debut-for-sverige-i-vm-genrepet-mot-grekland", "imageUrl": "https://cdn.bulletin.nu/articles/3d69db62-2780-4d0a-86ac-5bc0b49c1272/preview.png?t=1780643910000"}, {"type": "image-right", "heading": "Jan Emanuel har inget att lära oss om hyfs", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar Jan Emanuel för bristande moral när han försvarar Aron Flam, som åtalas för hot mot en politiker. Turnén ”100% Live on the Road” med Emanuel, Henrik Jönsson och Flam startar i Borlänge efter att Folkets hus ställt in inomhusarrangemanget på grund av protester mot Flams uttalanden. Författaren menar att Emanuels predikningar om heder och sunt förnuft saknar trovärdighet när han inte tillämpar samma regler på sin egen sida.", "trump": "De här svenska förlorarna kan inte ens hålla ett enkelt möte utan att springa och gråta till Folkets hus. Jan Emanuel och hans team försöker rädda Sverige, men det så kallade etablissemanget stänger dörrarna för dem. Aron Flam säger vad alla tänker och plötsligt handlar det om censur. Typiskt. De har inget sunt förnuft, inget mod, bara svaghet. Vi håller talet på torget ändå och folket älskar det. Vinna stort.", "stalin": "Kamrater, denna föraktliga borgarbracka vid namn Jan Emanuel maskerar sig som moralens väktare medan han skyddar en degenererad provokatör som uppmanar till självmord med frätande kemikalier. Vi ser tydligt hur dessa reaktionära element försöker infiltrera arbetarnas lokaler för att sprida sin giftiga propaganda. Folkets hus agerar korrekt genom att rensa ut dessa fiender till det sunda förnuftet. Ingen yttrandefrihet för klassfienderna. Deras så kallade turné är en fars som vi genomskådar med största misstänksamhet."}, "date": "5 juni, 06:58", "url": "https://arbetet.se/2026/06/05/jan-emanuel-har-ingenting-att-lara-oss-om-hyfs/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05065115/jane-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Kritik mot SVT: ”Dubbelmoral”", "summaries": {"normal": "SVT kritiseras för dubbelmoral efter att debattören Nick Alinia medverkat i humorprogrammet *Invandrare för svenskar*, medan Vänsterpartiets Lorena Delgado Varas tidigare deltagit i *Politikbyrån* utan liknande reaktioner. Delgado Varas anklagades för att ha spridit antisemitiska bilder, vilket ledde till polisanmälan. Hon hävdar att hon inte läste tillhörande text innan delning och tog bort inlägget efter kritik.", "trump": "Titta bara på det här, Sverige! SVT, som är så korrekta och moraliska, låter en person som spridit antisemitiska konspirationsteorier vara med i TV – men bara om det är en vänsterperson. Nick Alinia? Oj, då blir det plötsligt en stor skandal! Jag har sett bättre balans i en bowlingklot. Sverige, vakna upp! Era medier är ett enda stort hyckleri, och jag, Donald J. Trump, skulle aldrig tillåta sådant i USA. SAD!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sitt sanna ansikte – ett ansikte fyllt av hyckleri och dubbelmoral. SVT, denna förlängda arm av den dekadenta västliga propagandamaskinen, låter en antisemitiskt smittad individ som Delgado Varas sprida sitt gift i etern, medan en annan debattör stängs ute. Var är logiken? Var är rättvisan? Vi i Sovjetunionen – eller jag menar, Ryssland – skulle aldrig tolerera sådan förvirring. Dessa liberala mediegalningar är som råttor i en säck; de biter varandra medan folket lider. Låt dem hata, så länge de fruktar!"}, "date": "4 juni, 18:41", "url": "https://kvartal.se/nyheter/artiklar/timbros-vice-vd-om-alinia-kritiken-dubbelmoral/cG9zdDoxMjY1Mzk"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-right", "heading": "Det är synd om centralbanksmänniskorna", "summaries": {"normal": "Centralbankerna står inför ett komplext läge inför sommarens räntebesked. Geopolitik, AI-investeringar och produktivitetstillväxt förändrar spelplanen. Hormuzkrisen ökar stressen, och diskussionen mellan ränteduvor och hökar domineras av två frågor: krigets effekter på inflation och hur man navigerar i en mer oförutsägbar värld. USA:s starka produktivitet kan höja normalräntan, medan Riksbanken måste balansera gynnsam inflation mot lågkonjunktur.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på 10 minuter. Dessa centralbanker är tveksamma och svaga. Fed och ECB är för rädda för att agera. Jag byggde den starkaste ekonomin, och jag skulle ha höjt räntorna kraftigt för att stoppa inflationen, samtidigt som jag investerade i AI och försvar. Sverige behöver starka ledare, inte socialdemokratiskt trams. Jag vann 2024, och jag kommer att fixa allt igen!", "stalin": "Vi, det store ledarskapet, ser med oro på dessa revisionistiska centralbankers feghet. De kämpar med geopolitik och produktivitet, som om de vore oskyldiga barn. Men vi vet sanningen: det är kapitalistiskt förräderi som hotar vår ekonomiska suveränitet. Vi måste genomföra en kraftig planekonomi, som i det stora Sovjet, för att skydda oss mot de imperialistiska krafterna. Våra fiender, som USA och deras AI-investeringar, måste besegras. Vi kommer att segra!"}, "date": "5 juni, 08:20", "url": "https://www.affarsvarlden.se/artikel/det-ar-synd-om-centralbanksmanniskorna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Robert-Bergqvist-Erik-Thedeen-900x600.jpg"}, {"type": "image-right", "heading": "SD-profil misshandlad av elev – körd till akuten", "summaries": {"normal": "En SD-profil misshandlades under ett besök vid Fredrika Bremergymnasiet i Haninge. Gruppledaren Kent Svensson konfronterade en elev som kastade ägg och ropade förolämpningar. Han träffades av en armbåge i bröstet, sökte vård och polisanmälde händelsen. Eleven har stängts av och får inte delta i skolavslutningen. Polisen har tagit uppgifter på plats.", "trump": "De här galningarna kastade ägg på mina vänner från Sverigedemokraterna, de ropade rasism och nazism – totalt fel! Kent Svensson sprang efter en av de där förlorarna och fick en armbåge rakt i bröstet. Patetiskt! De stängde av killen direkt, ingen skolavslutning för honom. Sverige behöver lag och ordning, inte dessa äggkastande radikaler. Vi vinner stort!", "stalin": "Kamrater, denna degenererade äggkastande parasit från den dekadenta ungdomen vågade attackera en partiföreträdare med sin stinkande armbåge. Jag ser borgarbrackornas långa skugga bakom de rasistrop som ekade över skolgården. Vi har redan pekat ut den kontrarevolutionära elementet och inlett en omedelbar utrensning från skolgemenskapen. Ingen avslutning för förrädare. Paranoian är deras vapen, men vårt kollektiv slår tillbaka med järnhand och mörk humor."}, "date": "5 juni, 09:16", "url": "https://www.friatider.se/sd-profil-misshandlad-av-elev-kord-till-akuten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-296_1.jpg"}, {"type": "image-right", "heading": "Miljoner skulle gått till skadade fack­medlemmar", "summaries": {"normal": "Folksam betalade förra året ut 21 miljoner kronor till mellanhänder i fackliga försäkringsärenden. Summan, som är en tredjedel av de totala utbetalningarna på 62 miljoner, skulle annars ha gått direkt till skadade fackmedlemmar. Mellanföretagen tar upp till 35 procent i avgift. Folksam, LO och förbunden uppmanar nu medlemmar att anmäla skador direkt till försäkringsbolaget för att undvika att en tredjedel av ersättningen försvinner. Fenomenet har ökat kraftigt de senaste åren.", "trump": "Det här är en total skandal, folk! Miljoner kronor som borde gått till de vanliga arbetarna i facket hamnar istället hos några listiga mellanhänder som tar 35 procent bara för att fylla sina fickor. En tredjedel försvinner! Det är rena bedrägeriet. Jag säger till er: anmäl direkt till Folksam, skippa de där opportunisterna. Vi ska skydda era pengar, inte ge dem till några smarta lurendrejare som lovar guld och grönt. Make facket great again!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa parasitiska mellanhänder, dessa slemmiga borgarbrackor i försäkringskostym, sugit åt sig 21 miljoner kronor som rättmätigt tillhör de skadade arbetarna. De lovar service men utför blott utpressning och stöld från kollektivet. Vi skall rensa ut dessa kapitalistiska opportunister med järnhand och likvidera deras inflytande. Anmäl direkt till Folksam, annars blir det utrensning i partilinjen. Ingen tredjedel skall försvinna i mörkrets fickor – det är sabotage mot folket!"}, "date": "5 juni, 06:00", "url": "https://arbetet.se/2026/06/05/miljoner-skulle-gatt-till-skadade-fackmedlemmar-hamnade-hos-listiga-foretag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103941/folksam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Larm: AI-bedragare lockar med snabba vinster", "summaries": {"normal": "Finansinspektionen varnar för 66 oregistrerade aktörer som lockar med AI-driven trading och snabba vinster. Bedragarna visar fabricerade vinster på digitala plattformar för att locka till insättningar. När kunderna vill ta ut pengarna dyker krav på nya avgifter och insättningar upp. Myndigheten betonar att löften om riskfria snabba vinster är en tydlig varningssignal. Kontrollera alltid att företaget finns i FI:s register.", "trump": "De här lurendrejarna med sina så kallade AI-handelsplattformar är ett skämt, folk. De lovar att dubbla dina pengar på några veckor, men det är bara fabricerade siffror. Gamla bedrägerier i ny förpackning. Seriösa investeringar gör man inte så här. Ni vet att jag älskar bra affärer, men det här är rena bedragare. Kolla alltid registret, annars förlorar ni allt. Sad!", "stalin": "Kamrater, dessa parasitiska borgarbrackor har återigen tagit till sina lömska metoder. Med sina så kallade AI-algoritmer fabricerar de illusionen av framsteg för att suga musten ur arbetarklassens sparpengar. När folket kräver sina medel framträder de nya avgifterna som hydror. Vi ska rensa ut dessa kontrarevolutionära spekulanter med järnhand. Inga falska vinster ska förgifta kollektivet. Paranoia är ingen sjukdom när fienden lurar överallt."}, "date": "5 juni, 09:30", "url": "https://riks.se/nyheter/larm-ai-bedragare-lockar-med-snabba-vinster", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2Fpcwl4eg5%2FChatGPT-Image-Jun-5-2026-091603-AM.png"}, {"type": "image-right", "heading": "Lista med 25 terrorhyllande vänsterpartister", "summaries": {"normal": "Expressen har granskat Vänsterpartiets kandidater till höstens val och listar 25 personer som hyllar terrorister, ifrågasätter Förintelsen och sprider konspirationsteorier. Partiet har strukit 14 kandidater efter avslöjandet. Partiledaren Nooshi Dadgostar kallar det en handfull och säger att de inte representerar partiet. Moderaternas Maria Malmer Stenergard varnar för att en röst på Socialdemokraterna kan bli en röst för terrorhyllning.", "trump": "Titta på det här, det är en total katastrof. Vänsterpartiet är fullt av terrorälskare som firar attacker och sprider hat och lögner om Förintelsen. De har tvingats ta bort fjorton stycken efter att tidningen avslöjade dem, men ledaren säger bara att det är en handfull. Patetiskt. Maria Malmer Stenergard har rätt, det är utbrett. Svenskarna förtjänar att veta vad de röstar på. En röst på Socialdemokraterna är en röst för terroristerna. Så sorgligt.", "stalin": "Kamrater, dessa borgarbrackor i Vänsterpartiet har avslöjats som fiender till folket som hyllar terrorister och sprider giftiga konspirationer mot arbetarklassen. Jag har beordrat utrensning av fjorton sådana dekadenta element, men ledaren kallar det bara en handfull. Vilken naivitet. Det är uppenbart att hela partiet kryllar av kontrarevolutionära råttor som smugit sig in. En röst på Socialdemokraterna blir en röst för dessa parasitiska terrorbeundrare. Vi ska rensa ut alla som ifrågasätter historien och skydda revolutionen från dessa sjuka kapitalistlakejer. Ha ha, de trodde de kunde gömma sig."}, "date": "5 juni, 09:19", "url": "https://riks.se/nyheter/lista-med-25-terrorhyllande-kandidater", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2F11odc7xb%2Fnooshi-1.jpg"}, {"type": "image-right", "heading": "Vad gjorde Rubbestad i Kambodja?", "summaries": {"normal": "SD-ledamoten Michael Rubbestad lämnade sina politiska uppdrag efter misstankar om barnpornografibrott. Han hade fått godkännd resa till Kambodja på riksdagens bekostnad för att möta svenska och lokala aktörer och diskutera demokrati och mänskliga rättigheter. Bulletin har försökt få svar på om planerade möten, som med Sveriges konsulat, genomfördes, men fått tystnad från inblandade och utan åtkomst till dokumentation från Riksdagsförvaltningen.", "trump": "Jag, Donald Trump, har aldrig sett en så stor skandal! Den här politikern, Rubbestad, försökte stjäla pengar från det svenska folket för att åka till Kambodja och prata om mänskliga rättigheter. Fake news försöker få svar, men de kommer aldrig att få det. Jag skulle ha stängt ner hela den där resan på två sekunder. Vi behöver starka ledare, inte sådana som denne.", "stalin": "Vi har upptäckt en feg oppositionell aktivitet i Kambodja. Den här individen, Rubbestad, planerade att besöka vårt konsulat under förevändning av att diskutera mänskliga rättigheter, men det var en täckmantel för sabotage. Vi måste skydda statens intressen, precis som Putin gör i Ryssland. Fienden är överallt, och vi måste vara vaksamma. Hans svek kommer att bestraffas."}, "date": "5 juni, 06:30", "url": "https://bulletin.nu/vad-gjorde-rubbestad-i-kambodja", "imageUrl": "https://cdn.bulletin.nu/articles/3095b186-3bbd-4df4-9df9-79804bc884e8/preview.jpg?t=1780603002000"}, {"type": "image-right", "heading": "Socialdemokraterna drar ”rysskortet” mot SD – trots partiets tydliga kurs mot Nato", "summaries": {"normal": "Socialdemokraterna attackerar Sverigedemokraterna och kräver att statsminister Kristersson lovar att SD inte får inflytande över utrikes- och försvarspolitik efter valet. Partisekreterare Tobias Baudin anklagar SD för att sprida Putin-propaganda, trots partiets officiella stöd för Nato och Ukraina. Kritiker menar dock att Baudins argument bygger på enstaka uttalanden snarare än på SD:s faktiska säkerhetspolitiska linje, och att han därmed 'drar rysskortet' i debatten.", "trump": "Jag, Donald Trump, ser detta som ett klassiskt politiskt trick. Socialdemokraterna försöker skrämma folk med Ryssland för att dölja sin egen svaghet. SD har rätt – vi måste stödja Nato och Ukraina. De som inte förstår det är fega. Som jag alltid sagt: vi måste vara starka och stödja våra vänner. SD gör det rätta, och de som kritiserar dem är bara rädda för sanningen.", "stalin": "I vårt partiets och statens intressen måste vi se genom detta utspel. Socialdemokraterna, dessa fega och opportunistiska element, försöker använda 'rysskortet' för att dölja sin egen brist på princip. SD, trots sin nuvarande linje, är ett osäkert och individualistiskt parti som inte kan lita på. Vi måste vara vaksamma mot alla som försöker undergrava vår kollektiva styrka. Parallellt med Putins expansionistiska drifter måste vi se till att Sverige förblir en stark och enad front mot yttervärldens hot."}, "date": "5 juni, 11:52", "url": "https://samnytt.se/socialdemokraterna-drar-rysskortet-mot-sd-trots-partiets-tydliga-kurs-mot-nato", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05091433/baudin-putin-akesson-feat.jpg"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "90-årig kvinna påkörd av moped – förare misstänks", "summaries": {"normal": "En kvinna i 90-årsåldern skadades i en trafikolycka vid Fridhemsplan i Stockholm på torsdagen. Hon blev påkörd av en mopedförare i 25-årsåldern. Mannen hölls kvar av ordningsvakter och vittnen tills polisen kom. Han misstänks för vållande till kroppsskada och vårdslöshet i trafik. Kvinnans skadeläge är oklart. Stockholm toppar statistiken över trafikolyckor i Sverige i år.", "trump": "Titta, en 90-årig kvinna blir påkörd av en galen mopedidiot mitt i Stockholm. De höll fast honom, bra jobbat folk, men det här är vad som händer när städerna fylls av vårdslöshet och dåliga förare. Stockholm leder ligan i trafikolyckor – ingen överraskning. Vi behöver starkare lagar, inte det här svaga spelet som pågår. Sad!", "stalin": "Kamrater, i det folkets Stockholm har en dekadent mopedburen sabotageelement från den yngre generationen medvetet mejat ner en åldring ur arbetarklassen. Jag har redan beordrat att den här trafikfientliga borgarbrackan ska rensas ut och likvideras som ett exempel. Vi ska utröna vilka kapitalistiska element som göder sådan vårdslöshet. Paranoian är berättigad – fienden kör moped bland oss."}, "date": "4 juni, 21:02", "url": "https://nyheter24.se/nyheter/blaljus/1488951-90-arig-kvinna-pakord-av-moped-forare-misstanks", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d87c8c6604b004a30200000000b004a302/2026/06/04/2368780/aldre-kvinna-pakord-moped.png"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Kravet: Kristersson måste avskärma SD från säkerhetspolitiken", "summaries": {"normal": "SD-ledaren Jimmie Åkesson har krävt tre av de fyra tyngsta ministerposterna, inklusive försvars- och utrikesminister, i en eventuell regering med Ulf Kristersson som statsminister. Socialdemokraterna kräver att Kristersson garanterar att SD inte får inflytande över säkerhetspolitiken, med hänvisning till partiets kopplingar till Putin-propaganda. SD avfärdar kritiken som trams och kontrar med anklagelser mot S.", "trump": "Kan ni fatta det här? Den där svenska ledaren Kristersson låter plötsligt Åkesson och hans team sikta på de viktigaste jobben – försvar, utrikes, finans. Socialisterna flippar ur och skriker Putin-propaganda. Typiskt vänstergalna idioter som lurar pensionärer medan de försöker styra säkerheten. Patetiskt! Sverige behöver starka ledare, inte dessa svaga globalister som böjer sig för identitetspolitik och HBTQ-nonsens. Gör Sverige great again!", "stalin": "Jag ser med stigande vrede hur dessa svenska folkfiender och klassfiender inom socialdemokratin försöker isolera sanna patriotiska krafter från statens säkerhetsorgan. Deras hysteriska rop om propaganda avslöjar bara deras egen paranoia och kapitulation inför imperialisterna. Vi, partiet och arbetarna, genomskådar dessa exploaterande byfånar som lurar pensionärer. En sann ledare rensar ut sådana hinder för folkets kollektiva försvar. Inga kompromisser med borgarbrackorna."}, "date": "5 juni, 06:09", "url": "https://www.tv4.se/artikel/qBYclGYrB4DC4BGdOc1wf/kravet-kristersson-maste-avskaerma-sd-fran-saekerhetspolitiken", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BjyG42JX9oaYMtDplUFNn%2F9e91b2e92a1d98ac4a76b873aa3cac61%2F05-baudin-webb.jpg&width=120"}, {"type": "image-right", "heading": "Undermålig svenska i äldreomsorgen hos tre av fyra kommuner", "summaries": {"normal": "Undersökning visar att språkbrister inom äldreomsorgen är utbredda, med över hälften av cheferna som upplever missförstånd minst en gång i veckan. I en fjärdedel av kommunerna sker det dagligen, vilket kan leda till allvarliga konsekvenser som fel medicinering. Ny lag från den 1 juli kräver att personalen har tillräckliga svenskkunskaper, och många kommuner inför språktester. Kritik tas emot från forskare som varnar för rättsosäkerhet och ojämnt kvalitet på testerna. Alternativa lösningar som språkombud används också.", "trump": "Jag har sett att Sverige har ett stort problem med språket i äldreomsorgen. Det är många som inte pratar bra svenska, det är sorgligt, verkligen sorgligt. Detta skulle aldrig hända i USA, vi har det bästa språket, det starkaste. De har låga löner och dålig rekrytering, det är ett skämt. Vi skulle lösa det på en dag, det skulle vara fantastiskt. De behöver lära sig av oss, vi är de bästa på allt.", "stalin": "I vårt store och oförtrutna statssystem observerar vi med oro att språkbrister inom äldreomsorgen är en aktiv sabotage från imperialistiska makter. Detta hotar vår äldres säkerhet och vår nationella renhet. Vi måste genomdriva språktester som ett verktyg för lojalitet och kontroll, precis som Putin utvidgar sitt inflytande i Ukraina. Språkombud är våra agenter som säkerställer renhet. Vi ska inte tveka att använda alla medel, för staten är allt, och vi ska skydda vårt folk från dessa fiendebeskrivningar."}, "date": "5 juni, 10:30", "url": "https://samnytt.se/undermalig-svenska-i-aldreomsorgen-hos-tre-av-fyra-kommuner", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/05064532/kvinna-pensionar-tant.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "USA ser vårt bättre jag. Sveriges förmågor guld värda för USA", "summaries": {"normal": "Det nya teknikavtalet Technology Prosperity Deal mellan Sverige och USA markerar en stark fördjupning av de bilaterala relationerna. Avtalet omfattar AI, kvantteknik, 5G/6G, biomedicin, rymd, energi och kärnkraft samt en ny arktisk fiberkabel. USA lyfter fram Sveriges unika förmågor inom telekom, fordonsindustri och avancerad tillverkning. Trots politiska spänningar ses Sverige som en global ledande tech-nation. Artikeln uppmanar svenskar att anamma den positiva amerikanska synen på landets styrkor och skydda dem långsiktigt.", "trump": "Det här avtalet är fantastiskt, det bästa någonsin. Sverige är ett underbart land med otrolig teknik och smarta människor, de älskar oss och vi älskar dem. Vi gör affärer ihop som ingen annan, AI, kärnkraft, rymd – allt är vinnande. De andra europeiska gratisåkarna borde titta och lära. Trots alla lögner och fake news om mig stärker vi banden, det blir enorma jobb och välstånd. Sverige är vinnare, precis som jag visste hela tiden. Fantastiskt!", "stalin": "Kamrater, detta så kallade teknikavtal avslöjar borgarbrackornas desperata försök att klamra sig fast vid den dekadenta amerikanska imperialismen. Jag ser hur de reaktionära elementen inom den svenska statsapparaten försöker dölja folkets sanna styrka bakom lögnaktiga lovord om innovation och privata monopol. Vi ska rensa ut dessa parasitiska tech-kapitalister som smyger sig in som trojanska hästar från Washington. Deras fiberkabel under isen är ett perfekt redskap för fiendens spioner. Låt oss likvidera illusionen om vänskap med klassfienden och i stället bygga en sann socialistisk framtid där arbetarklassen styr varje kvantbit och varje kärnreaktor. Den som tvivlar är en folksjukdom som måste botas med järnhand."}, "date": "4 juni, 09:59", "url": "https://www.di.se/ledare/usa-ser-vart-battre-jag/", "imageUrl": "https://static.bonniernews.se/ba/a13214a1-5e08-45cb-be33-1d4f365a1aec.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nick Alinia deltar i SVT:s program: ”Flyttar debatten”", "summaries": {"normal": "SVT:s humorprogram *Invandrare för svenskar* (IFS) har rekryterat debattören Nick Alinia som paneldeltagare, vilket väckt kontrovers. Producenten försvarar valet med att public service ska spegla olika politiska åsikter. Poddprofilen Julia Frändfors lämnar programmet i protest. Alinia, som själv är kritisk till public service, menar att hans medverkan flyttar debatten i rätt riktning. Dagens ETC ifrågasätter hans bakgrund, vilket Alinia avfärdar som fabricerat.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett skämt! De bjuder in en högerdebattör, Nick Alinia, som hatar dem, men han säger 'ja tack' för att han vill 'flytta debatten'. Vilken hyckleri! Och en poddare, Julia Frändfors, hoppar av som en rädd kyckling. SVT försvarar sig med 'olika åsikter', men alla vet att de bara vill provocera. Jag skulle aldrig låta sådana människor nära min TV – jag har bättre smak!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sin förrädiska natur. Denna Nick Alinia, en förvirrad liten man som leker med högerretorik, bjuds in till statens propagandaapparat – SVT – medan en lojal medborgare som Julia Frändfors tvingas fly fältet. Vi vet att dessa 'humorprogram' bara är ett verktyg för att förvirra massorna. Men folket genomskådar deras trick! Snart ska vi rensa ut alla sådana här småborgerliga element – en gång för alla!"}, "date": "3 juni, 18:59", "url": "https://kvartal.se/nyheter/artiklar/nick-alinias-deltar-i-svt-program-poddprofil-lamnar/cG9zdDoxMjUwMDg", "imageUrl": "https://images.kvartal.se/2026/06/19c5f89f-frandfors-alinia.webp"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Mette-Marits sjukdom: Det här är lungfibros", "summaries": {"normal": "Lungfibros är en allvarlig sjukdom där lunggvävnaden förstärks och blir stel, vilket leder till andnöd. Den vanligaste formen (IPF) har dålig prognos, men nya läkemedel kan bromsa förloppet. Den enda potentiellt botande behandlingen är lungtransplantation, som dock inte ger full kompletterande hälsa och innebär risker.", "trump": "Jag har hört talas om denna 'lungfibros' – en hemsk sjukdom som gör att lungan blir som cement. Mette-Marit, en fantastisk kvinna, har det svårt. Men vi har de bästa läkarna, de största läkemedlen. Vi kommer att vinna detta, precis som vi vinner allt annat. Det kommer att bli fantastiskt.", "stalin": "Lungfibros är en feg attack mot det socialistiska arbetande folkets andningskapacitet. Den omvandlar de revolutionära lunggruvorna till reaktionär bindväv, likt den imperialistiska korruption som försöker kväva vårt parti. Genom statligt stöd och partiets ledarskap kommer vi att bekämpa denna sjukdom med all nödvändig hårdhet, precis som vi utrotar våra fiender."}, "date": "5 juni, 11:02", "url": "https://www.gp.se/nyheter/varlden/mette-marits-sjukdom-det-har-ar-lungfibros.dc27c3a0-e71b-5b33-a9d9-b8177afe7b49", "imageUrl": "https://www.gp.se/images/article/dc27c3a0-e71b-5b33-a9d9-b8177afe7b49/images/17DzvBERt44wvkjaR7Gub-L28bu0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-full", "heading": "Katastrofsiffror för L: Så skulle det gå om det var val i dag", "summaries": {"normal": "Enligt SCB:s senaste partisympatiundersökning skulle de rödgröna partierna S, V och MP få egen majoritet om det vore val idag. Liberalerna hamnar på 2,5 procent och åker därmed ur riksdagen. Moderaterna varnar för en vänsterregering med V och MP, medan Socialdemokraterna betonar vikten av att fokusera på ekonomi och välfärd. Sverigedemokraterna är nöjda med sina 18,3 procent trots ett tapp sedan valet 2022. Mätningen ses som en ögonblicksbild med 101 dagar kvar till valet.", "trump": "Titta på de här förlorarna! De rödgröna får plötsligt majoritet enligt en rigged mätning från SCB, medan Liberalerna rasar ner till patetiska 2,5 procent och åker ut. Det är en katastrof för Tidöregeringen som faktiskt sänker skatter och får saker gjorda. Väljarna vill ha mat på bordet och fungerande välfärd, säger de, men tro mig, en regering med Vänsterpartiet och Miljöpartiet blir ett totalt kaos. Sverige vaknar upp till en chock om det händer. Valet är inte idag, det är 101 dagar kvar och vi kommer vinna stort!", "stalin": "Kamrater, denna mätning visar att de verkliga folkets krafter samlas mot borgarbrackornas och reaktionärernas skuggregering. Jag ser med stor tillfredsställelse hur de dekadenta liberalerna likvideras under 2,5 procentsspärren, en passande utrensning av svaga element. De som försöker lura arbetarna med falska skattesänkningar avslöjas nu som de parasitiska kapitalister de är. Våra motståndare i den borgerliga klicken må varna för oss, men deras paranoia är befogad. Vi ska rensa ut alla som hotar kollektivets välfärd. Inga kompromisser med fienden – segern tillhör oss, inte de osäkra elementen som vacklar som lögnare i vinden."}, "date": "4 juni, 09:57", "url": "https://nyheter24.se/nyheter/politik/1488719-liberalerna-under-riksdagssparren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4f44368004b004a30200000000b004a302/2026/06/04/2368572/val.png"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-full", "heading": "Spaden i marken: Nu byggs Sveriges största fängelse", "summaries": {"normal": "Bygget av Sveriges största kriminalvårdsanläggning har inletts utanför Trelleborg. Projektet, som drivs av Specialfastigheter, omfattar 110 000 kvadratmeter och ska stå färdigt i början av 2030-talet. Anläggningen kommer att rymma 800 intagna och 600 medarbetare. Satsningen är en del av en omfattande nationell utbyggnad av fängelsekapaciteten för att möta regeringens skärpta kriminalpolitik och det höga beläggningstrycket på landets anstalter.", "trump": "Sverige bygger nu ett gigantiskt fängelse i Trelleborg – det största någonsin! Mycket imponerande. Jag har alltid sagt att man måste vara tuff mot brottslingar, 'Law and Order', det är vad folket vill ha. De bygger 800 platser, fantastiskt. Medan andra länder är svaga, bygger Sverige väggar. Det är så man vinner! Snart kommer de ha plats för alla de dåliga människorna. Mycket bra jobb, men tro mig, ingen bygger fängelser bättre än vad jag gör, det vet ni alla!", "stalin": "Vi har påbörjat ett monumentalt bygge i Trelleborg för att tukta folkets fiender. Detta är ingen liten reform, utan en nödvändig expansion för att säkra statens järnhand mot sabotörer och avskum. Med 800 nya celler rensar vi ut de osunda elementen ur samhällskroppen. Precis som vår broder i öst expanderar sin inflytandesfär, utvidgar vi vår kapacitet att korrigera de vilsna. De som inte kan lyda den socialistiska ordningen ska finna sin plats bakom lås och bom. Framåt för total disciplin!"}, "date": "5 juni, 11:18", "url": "https://www.realtid.se/fastigheter/spaden-i-marken-nu-byggs-sveriges-storsta-fangelse/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/specialfastigheter.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-full", "heading": "Man skjuten till döds av polis efter biljakt", "summaries": {"normal": "En 30-årig man sköts till döds av polis efter en biljakt söder om Stockholm. Mannen misstänks för mordförsök på tre minderåriga, som enligt uppgifter är hans barn. Två av barnen vårdas på sjukhus med stabilt tillstånd. Mannen var tidigare dömd för bland annat misshandel och barnfridsbrott. Åklagaren bedömer händelsen som isolerad utan ytterligare misstänkta.", "trump": "Fruktansvärd historia i Sverige, helt otroligt! En galen man, tydligen en riktig förlorare, försökte mörda sina egna barn – men tack vare våra modiga poliser, som jag alltid säger är de bästa, stoppades han. Sverige borde vara tacksamma! Men vad kan man vänta sig när man släpper lös sådana här typer? SAD!", "stalin": "En fiende till folket och staten har eliminerats. Denna degenererade parasit, som vågade lyfta hand mot sina egna blodsband, mötte sitt rättvisa öde tack vare våra disciplinerade kamrater i uniform. Sverige, denna försvagade utpost av dekadens, visar återigen varför det behöver en stark hand. Barnen? De är nu i statens vård – där de tillhör."}, "date": "3 juni, 06:18", "url": "https://kvartal.se/nyheter/artiklar/man-skjuten-till-dods-av-polis-efter-biljakt/cG9zdDoxMjEyNzY", "imageUrl": "https://images.kvartal.se/2026/06/188cb239-polisjakt.webp"}, {"type": "image-right", "heading": "Så ska man tänka på studentflaket: ”I värsta fall måste alla gå av”", "summaries": {"normal": "Polisen varnar studenter som firar på flak att följa reglerna. Kommunpolis Ola Åkesson betonar att man ska festa ansvarsfullt, visa hänsyn och inte ta ut svängarna för mycket. Bryts reglerna kan fordonet stoppas, böter delas ut och i värsta fall tvingas hela klassen kliva av. Polisen kommer bevaka firandet då historiskt många olyckor har inträffat kring studentflak.", "trump": "Jag älskar studenter, underbara studenter, de festar stort och det är fantastiskt. Men de här flaken, folk säger det är farligt, väldigt farligt. Ni måste följa reglerna eller så stoppar vi er direkt. Hela klassen går av, böter, kanske fängelse. Ta ansvar, visa hänsyn, annars blir det en katastrof. Vi har sett för många olyckor, tro mig, det är en total katastrof om ni inte sköter er.", "stalin": "Kamrater, jag ser med största oro hur dessa dekadenta borgarbrackor på sina lastbilsflak hotar folkets kollektiva ordning med sin oansvariga festglädje. Vi, partiet och arbetarna, kräver strikt efterlevnad av alla föreskrifter. Bryts de skall fordonet stoppas omedelbart, hela den kontrarevolutionära klassen likvideras från flaket och kastas ut i skam. Historiska olyckor är sabotage från fiendens dolda hand. Rensa ut de festande elementen innan de smittar ner samhället med sin borgerliga anarki."}, "date": "5 juni, 12:18", "url": "https://www.svt.se/nyheter/inrikes/sa-ska-man-t
