tation. Händelserna väcker frågor om ICE:s metoder och Trumps migrationspolitik.", "trump": "Vad händer här? Min egen administration pausar ICE:s fordonskontroller – ett av våra bästa verktyg för att stoppa brottslingar! 'Åh, låt oss vara snälla', säger de. Nej! Vi kan inte låta kriminella köra runt hur de vill. Två skjutningar? Folk lyssnar inte på polisen, det är problemet. Jag bygger murar, jag deporterar, jag skyddar Amerika – och så gör mina egna människor så här? Sad!", "stalin": "Kapitalistiska imperialister skjuter arbetare på gatorna medan deras ledare svänger som väderflar! Först beordrar de paus i fordonskontrollerna, sedan backar de som skräckslagna hundar. Två oskyldiga liv släcktes – en byggarbetare och en ung colombian – offer för den amerikanska statens terror. Vi i Sovjet skulle aldrig tolerera sådan inkompetens! Putin, notera: deras gränspolis är lika effektiv som en rysk traktorförare i Moskva-regn."}, "date": "15 juli, 19:50", "url": "https://www.gp.se/nyheter/varlden/forvirringen-trump-gar-emot-egna-administrationen-om-ice-besked.c36b95ca-f478-4cff-b6e0-2d24a6b9bfc6", "imageUrl": "https://www.gp.se/images/article/c36b95ca-f478-4cff-b6e0-2d24a6b9bfc6/images/3JKmw6T84bqxq9SnC8Zo-ManbfoU-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "SD-toppen: \"Socialdemokraterna går till val på att fortsätta ge våldtäktsmän och pedofiler straffrabatt\"", "summaries": {"normal": "Sverigedemokraternas Henrik Vinge kritiserar Socialdemokraterna skarpt efter att de signalerat att de tänker rösta nej till regeringens nya straffrättsliga påföljdssystem. Vinge menar att reformen syftar till att avskaffa mängdrabatter för brott och använda hela straffskalan, med fokus på brottsoffrens upprättelse och samhällets skydd. Han hävdar att Socialdemokraterna därmed går till val på att behålla straffrabatter för våldtäktsmän och pedofiler.", "trump": "De där socialisterna i Sverige är en total katastrof, tro mig. De vill ge serievåldtäktsmän och pedofiler massor av rabatter på sina straff, som om fler brott är någon slags bonus. Patetiskt! Vi i den riktiga rörelsen säger stopp, vi använder hela straffskalan och skyddar folket. Socialdemokraterna är svaga, de hatar brottsoffren och älskar kriminella. Vi fixar det fort, det blir fantastiskt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom Socialdemokraterna avslöjar sin sanna kontrarevolutionära natur genom att försvara straffrabatter åt serievåldtäktsmän och pedofiler. Deras fega hjärtan sviker arbetarklassen och skyddar i stället samhällets fiender. Jag, som ledare för folkets vilja, kräver total utrensning av denna mängdrabattens ideologi. Vi ska likvidera alla billighetsskäl och låta de strängaste straffen falla som en stålhandske över de perversa elementen. Deras valkampanj är ett skrattretande försök att underminera proletariatets säkerhet – vi ska krossa dem under historiens ostoppbara hjul."}, "date": "15 juli, 19:24", "url": "https://riks.se/nyheter/sd-toppen-socialdemokraterna-gar-till-val-pa-att-fortsatta-ge-valdtaktsman-och-pedofiler-straffrabatt"}, {"type": "text", "heading": "Socialdemokraterna vill behålla mängdrabatten för kriminella", "summaries": {"normal": "Socialdemokraterna och oppositionen har stoppat regeringens proposition om ett nytt straffrättsligt påföljdssystem. Reformen skulle ha skärpt straffen, avskaffat mängdrabatten vid flerfaldig brottslighet, infört villkorligt fängelse och stärkt brottsoffrens ställning. Regeringen ville att straffet skulle spegla brottets allvar och ta bort billighetsskäl som mildrar påföljder. Förslaget röstades ner i riksdagen, vilket innebär att mängdrabatten behålls.", "trump": "Det här är en total katastrof, folk. Socialdemokraterna, de värsta förlorarna, stoppar en fantastisk reform som skulle ge brottsoffren rättvisa och slå hårt mot de kriminella. Mängdrabatten? En skam, en riggad system som låter brottslingar komma undan billigt. De vill inte ha ordning, de vill ha svaghet. Jag skulle ha gjort reformen enorm, den bästa någonsin, men de röstar nej som de alltid gör. Patetiskt!", "stalin": "Kamrater, denna avskyvärda mängdrabatt är en parasit som gnager på proletariatets rättvisa, ett verk av borgarbrackor som smyger sig in i straffsystemet för att skydda sina kriminella lakejer. Jag har sett hur dessa dekadenta element röstar nej till att rensa ut billighetsskäl och likvidera mildheten mot folkets fiender. Vi ska utrensa alla som sätter brottslingars bekvämlighet före arbetarklassens offer. Paranoian är befogad – kontrarevolutionärer lurar överallt i riksdagen. Framåt mot en järnhård ordning!"}, "date": "15 juli, 19:24", "url": "https://riks.se/nyheter/socialdemokraterna-vill-behalla-mangdrabatten-sager-nej-till-brottsofferperspektivet"}, {"type": "image-full", "heading": "Kunderna rusar till Pressbyrån – varan alla vill åt", "summaries": {"normal": "Pressbyråns nya mellanmålssortiment, bland annat bowls, grönsaker med dipp och kyckling med dipp, har på bara två månader tagit 48 procent av försäljningen inom snacking. Grönsaker med dipp ökade över 120 procent. Kedjan ser det som ett tecken på att svenskarna vill ha nyttigare, mättande och snabba alternativ till klassiska chips och godis. Försäljningen är högst tidigt i veckan, särskilt på tisdagar.", "trump": "Titta på det här, det är fantastiskt. Pressbyrån lanserar de här nya mellanmålen, bowls, grönsaker med dipp, kyckling, och plötsligt tar de nästan halva marknaden från det gamla godiset. De älskar det, folket älskar det. De vill ha något som faktiskt mättar istället för det där tråkiga chips som ingen längre vill ha. Det är en enorm succé, kanske den största snacksrevolutionen någonsin. Alla pratar om det, och det är underbart.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna äntligen tvingas erkänna att deras kontrarevolutionära chips och sockerbomber inte längre kan förgifta massorna. Jag, i min oändliga visdom, applåderar detta fräscha komplement som likviderar den kapitalistiska småätandets fiende. Grönsaker med dipp – en veritabel utrensning mot den feta borgarklassens paranoia! Låt tisdagens seger över måndagens svaga element bli en evig dialektisk triumf för det kollektiva mellanmålet."}, "date": "14 juli, 13:31", "url": "https://nyheter24.se/nyheter/konsument/1498426-kunderna-rusar-till-pressbyran-varan-alla-vill-at", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8558a04704b004a30200000000b004a302/2026/07/14/2377832/Pressbyran.png"}, {"type": "image-right", "heading": "Bulgarien lämnar 'de villigas koalition' för Ukraina: \"Förlänger kriget\"", "summaries": {"normal": "Bulgarien har lämnat Coalition of the Willing, den västliga samarbetsgrupp som samordnar militärt och ekonomiskt stöd till Ukraina. Premiärminister Rumen Radev valde att inte delta i mötet i Paris trots personlig inbjudan från Emmanuel Macron. Han motiverar beslutet med att Bulgarien föredrar diplomatiska lösningar framför fortsatt krig och har tidigare stoppat statligt militärt bistånd till Ukraina. Sverige deltog däremot via statsminister Ulf Kristersson och anslöt sig till en ny antirobotkoalition.", "trump": "Bulgarien gör det rätta, de lämnar den dumma koalitionen som bara förlänger kriget. Radev är smart, han vill ha fred istället för att kasta pengar och vapen i ett evigt träsk. Macron bjuder in honom men han säger nej tack, vi vill inte vara med i det här vansinnet. Sverige är fortfarande fast i det hela, men det är deras sak. De borde alla följa Bulgarien och avsluta det här katastrofala kriget som aldrig borde ha startat. Fantastiskt beslut!", "stalin": "Jag betraktar med djup tillfredsställelse hur de bulgariska kamraterna äntligen vänder ryggen åt de krigshetsande imperialisternas så kallade villiga koalition. Dessa blodtörstiga borgarbrackor och deras lakejer i Paris och London längtar efter att se arbetarnas blod flyta i en oändlig eskalering. Radev visar viss klokskap genom att förespråka diplomatiska utrensningar av konflikten istället för att mata den västerländska krigsmaskinen. Låt de västerländska kapitalisterna koka i sin egen paranoia medan vi, partiet och folket, skrattar åt deras patetiska robotkoalitioner. Freden kommer genom styrka, inte genom att förlänga slakten."}, "date": "15 juli, 18:00", "url": "https://samnytt.se/bulgarien-lamnar-de-villigas-koalition-for-ukraina-forlanger-kriget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/15145703/coalition-of-the-willing-pris-july-26-bild-nato-radev-zelenskyj.jpg"}, {"type": "image-full", "heading": "Regissör försvarar vit Gollum-film", "summaries": {"normal": "Alla hittills annonserade skådespelare i filmen The Hunt for Gollum är vita. Regissören och huvudrollsinnehavaren Andy Serkis försvarar castingvalen med hänvisning till Tolkiens nordiska mytologi och Fylkets karaktär. Han erkänner att representationen kritiserats i 25 år men säger att filmen inte blir en politiskt korrekt version där man castar enbart för att bocka av rutor. Istället handlar det om relevans.", "trump": "De gör en ny Sagan om ringen-film och alla skådespelare är vita, kan ni tro det? Fantastiskt! Andy Serkis säger att det är Tolkien, det är nordiskt, Fylket är vitt och de vill inte ha folk som kommer in. Smart! De har kritiserat det i 25 år men nu vägrar de göra en politiskt korrekt soppa bara för att bocka av rutor. Äntligen någon som vågar säga sanningen, underbart.", "stalin": "Kamrater, i denna så kallade prequel till Sagan om ringen har vi återigen blottlagt den vitaste av vit makt-strukturer. Jag, som ledare för det eviga kollektivet, noterar hur borgarbrackan Serkis försvarar sin rasrena ensemble med nordisk mytologi som ursäkt. Vi genomskådar denna fientliga avvikelse från folkets mångfald. Inga politiskt korrekta utrensningar av de bleka kapitalisterna här, nej, de klamrar sig fast vid sin Fylkes-patriarkala paranoia. Vi ska nog rensa ut dessa dekadenta alver och hobbitar en dag, haha."}, "date": "15 juli, 13:10", "url": "https://bulletin.nu/regissor-forsvarar-vit-gollum-film", "imageUrl": "https://cdn.bulletin.nu/articles/3d972c53-7808-4e67-9d98-ee25e89dee6f/preview.jpg?t=1784113803000"}, {"type": "image-full", "heading": "Jamie Dimon: Därför växer anti-rik-stämningen i USA", "summaries": {"normal": "Jamie Dimon, vd för JP Morgan, varnar för att den ökande anti-rik-stämningen i USA är en logisk följd av växande ekonomiska klyftor. Trots en generellt högre levnadsstandard än förr, upplever många att möjligheterna minskar medan de rikaste drar ifrån. Dimon betonar att detta skapar social polarisering och misstro. Han lyfter även fram risken att AI-utvecklingen kan förstärka ojämlikheten ytterligare och manar till att problemen tas på allvar för att bevara samhällets stabilitet.", "trump": "Jamie Dimon – en smart kille, men han fattar nu att USA har problem. Det är sorgligt! Eliterna på Wall Street har blivit otroligt rika medan den vanliga arbetaren blivit lämnad kvar. Jag har alltid sagt att de glömda männen och kvinnorna ska räknas! Nu ser vi hur klyftorna växer, det är en total katastrof. AI? Vi ska vinna med AI, inte låta den skapa mer ojämlikhet. Vi ska göra Amerika rättvist och starkt igen, tro mig!", "stalin": "Denna bankir Dimon erkänner äntligen det uppenbara: kapitalismens ruttna kärna skapar bara kaos. De rika frossar i sina miljarder medan folket svälter i en osäker tillvaro. Det är ett klassiskt tecken på borgerlig degeneration. Vi ser samma dekadens i väst som vi ser i Putins misslyckade försök att återuppbygga ett tsarryssland genom korrupta oligarker. Vi, staten, vet att endast en järnhand kan kväsa denna 'anti-rik-stämning' genom att eliminera källan till ojämlikhet: de parasitära kapitalistiska ägarna själva."}, "date": "15 juli, 15:27", "url": "https://www.realtid.se/bors-finans/bank-fintech/jamie-dimon-darfor-vaxer-anti-rik-stamningen-i-usa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/amar-45.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Fortsatta attacker mot SD:s lokal: \"Blir värre och grövre\"", "summaries": {"normal": "Sverigedemokraternas partilokal i Karlshamn har utsatts för upprepad skadegörelse. Under natten till måndagen krossades en ruta som ännu inte hunnit repareras efter tidigare attacker. Klistermärken har satts upp och logotyper rivits bort. Även Moderaternas lokal har drabbats. Distriktsordförande Fredrik Thomasson beskriver att både vandalisering och hot från vänsterhåll blir grövre. En partiföreträdare har utsatts för grova hot på sociala medier och Thomasson själv har blivit hotad på en krog. Händelserna är polisanmälda.", "trump": "De galna vänsterradikalerna i Sverige attackerar igen. SD:s lokal i Karlshamn har blivit vandaliserad för fjärde gången, fönsterrutor krossade, affischer rivna ner. De hatar valfrihet och folket. En av dem hotade till och med att skjuta en SD-kvinna i ansiktet. Patetiskt. Jag har sagt det förut och jag säger det igen: det här är vad som händer när de förlorar och folket röstar rätt. De kan inte hantera det. Sverige behöver lag och ordning, inte vänstervåld.", "stalin": "Kamrater, ännu en gång visar de dekadenta resterna av den kontrarevolutionära vänsterflanken sin sanna, förrädiska natur genom att krossa fönsterrutor hos dem som utmanar borgarbrackornas narrspel. Jag, som alltid genomskådar sådana parasitiska element, ser hur dessa trotskistiska avskrap från Framtidens vänster, med sina elsparkcyklar och köttfärsfantasier, utgör en verklig fara för folkets enhet. Vi rensar ut sådana farliga lumpenproletärer med järnhand. Deras paranoia är underhållande, men deras likvidering blir oundviklig."}, "date": "15 juli, 14:54", "url": "https://www.friatider.se/fortsatta-attacker-mot-sd-lokal-blir-varre-och-grovre", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-502.jpg?itok=U-a4MFq2"}, {"type": "image-full", "heading": "Debatt: Grahams död väcker fler frågor än svar", "summaries": {"normal": "Senator Lindsey Graham avled enligt officiell rapport av aortadissektion orsakat av åderförkalkning. Artikeln ifrågasätter tidpunkten mitt i konflikter med Ryssland och Iran, där Graham var en stark motståndare till båda regimerna. Han stödde ukrainskt motstånd och iranska demokratiaktivister samt hade nära band till oppositionen i Iran. Regimerna firade hans död. Författaren menar att det vore naivt att inte undersöka möjligheten av en riktad operation med substanser som kan framkalla naturligt verkande dödsfall.", "trump": "Folk, det här är en total skandal. Lindsey Graham, en tuff kille som hatade de galningarna i Iran och Ryssland, dör plötsligt mitt i allt kaos? De säger naturliga orsaker, men kom igen, det luktar verkligen illa. Kreml och de mullorna firade som galningar. De hatade honom för att han stod upp för Ukraina och den riktiga oppositionen i Iran. Vi måste undersöka det här ordentligt, inte bara svälja den officiella lögnen. Det är för bekvämt, tro mig.", "stalin": "Kamrater, denna dekadenta senator Graham, en illaluktande lakej åt borgarbrackorna och krigshetsarna, har nu plötsligt upphört att existera genom en så kallad aortadissektion. Vilken ypperlig slump mitt i vårt gemensamma motstånd mot dessa reaktionära element! De västerländska imperialisterna tror att vi inte genomskådar deras löjliga maskerad. Vi, det stora kollektivet, ler i tysthet åt hur fienderna likviderar varandra med sina egna giftiga metoder. Inga spår, ingen utredning – precis som det ska vara i en sund statsapparat. Låt paranoia råda; alla kritiker försvinner till slut."}, "date": "15 juli, 13:00", "url": "https://bulletin.nu/debatt-grahams-dod-vacker-fler-fragor-an-svar", "imageUrl": "https://cdn.bulletin.nu/articles/0c956620-207e-4cee-8d9b-585dcffaeecf/preview.png?t=1784013998000"}, {"type": "image-right", "heading": "Trafikverket varnar bilister för hettan", "summaries": {"normal": "En värmebölja drar in över stora delar av Sverige med temperaturer över 30 grader under tre dagar. Trafikverket varnar för blödande asfalt, solkurvor och ökad risk för fordonsstopp samt sänkt hastighet på järnväg i Västra Götaland och Småland. SMHI har utfärdat gul varning. På äldreboenden förbereder man sig med fläktar, AC, isglass, solhattar och solskydd. Experter betonar vikten av att hantera värmen, särskilt för äldre, barn och andra riskgrupper.", "trump": "Folk, det blir extremt varmt i Sverige, de säger över 30 grader, riktigt hett, kanske det varmaste någonsin. Trafikverket varnar för blödande vägar och solkurvor, totalt kaos på spåren, tågen måste sakta ner. De gamla får glass och fläktar, men lyssna, vi behöver bättre än så. Sverige borde ha haft de bästa AC-anläggningarna, de bästa vägarna, men nu är det en stor röra. Jag älskar värme, men detta är för mycket, tro mig.", "stalin": "Kamrater, värmen anfaller folket som en fiende inom rikets gränser. Jag ser hur borgarbrackornas bristfälliga vägar börjar blöda och spår vrider sig i solens skoningslösa grepp. Vi sänker hastigheten på järnvägarna för att skydda kollektivet från urspårningens sabotage. På äldreboendena rustar vi med fläktar och isglass mot denna värmande kontrarevolutionär. Misstänkta kapitalistiska virus lurar i luften – vi rensar ut alla som vägrar se faran. Inga fiender slipper undan, inte ens vädret."}, "date": "15 juli, 09:11", "url": "https://www.di.se/nyheter/nu-slar-hettan-till-trafikverket-varnar/", "imageUrl": "https://static.bonniernews.se/ba/65074902-8dce-4410-9173-25d613dc756e.jpg?crop=4256%2C2394%2Cx0%2Cy219&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "”Tidö offrar Kalix för uran – gör Norrbotten till råvarukoloni”", "summaries": {"normal": "Katarina Burman från Vänsterpartiet Kalix kritiserar Tidöregeringen för att prioritera uranprospektering i Norrbotten. Amerikanska bolaget Adelheid Holdings får tillstånd att provborra i Kalix kommun, delvis i Kalixälven och i skyddade Natura 2000-områden. Hon ser det som ett angrepp på det lokala självstyret, en risk för miljön, dricksvatten och folkhälsa samt ett hot mot biologisk mångfald, rennäring och framtidstro. Burman kräver att tillstånden överklagas och att regeringen byts ut.", "trump": "De gör ett fullständigt bedrövligt jobb i Sverige. Tidöregeringen säljer ut vackra Norrbotten till ett amerikanskt bolag som vill borra efter uran i älvar och skyddad natur. Det är en katastrof. Lokalbefolkningen får sin mark och sitt vatten förstört för alltid medan besluten fattas i slutna rum i Stockholm och USA. De kallar det grön omställning – det är bara ren miljöförstöring. Totalt misslyckande. Sverige behöver smarta ledare som sätter folket först, inte råvarukolonier.", "stalin": "Kamrater, jag betraktar med kallt förakt hur dessa borgerliga lakejer i Tidöregeringen underkastar sig amerikanska monopolkapitalister och förvandlar Norrbotten till en råvarukoloni. De tillåter provborrning i skyddade älvar och Natura 2000-områden, redo att släppa ut radioaktivt gift i grundvattnet och likvidera vår biologiska mångfald. Detta är en fiende inom murarna, en parasitisk femtekolonn av vinsthungriga imperialister som vill kväva arbetarnas framtidstro. Vi ska överklaga, avslå och rensa ut dessa naturförstörare ur statsapparaten innan de förgiftar hela kollektivet med sin dödliga uranfantasi. Deras så kallade omställning är bara maskerad sabotageverksamhet."}, "date": "15 juli, 08:00", "url": "https://arbetet.se/2026/07/15/tido-offrar-kalix-for-uran-gor-norrbotten-till-ravarukoloni", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09153815/katarina-burman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Ericsson sänke på börsen – OMXS30 ned 0,1%", "summaries": {"normal": "Stockholmsbörsen stängde svagt ned på tisdagen med OMXS30-indexet på minus 0,14 procent till 3 162,79. Ericsson rasade 12,6 procent efter en rapport med lägre omsättning än väntat och utsikter om marginalpress. Teknologisektorn steg däremot 1,6 procent. Oljepriset steg initialt på grund av oron i Mellanöstern men dämpades efter besked om handelsavtal istället för avgift i Hormuzsundet. Flera bolag som Mycronic, AQ Group och Lifco slog förväntningarna och steg kraftigt.", "trump": "Börsen i Stockholm gick lite ned, men det är ingen stor grej, tro mig. Ericsson kraschade som en dålig affär, 12,6 procent ned – deras siffror var patetiska, totalt misslyckande. Men vi har fantastiska avtal med Gulfstaterna istället för den där 20-procentiga avgiften i Hormuzsundet, och oljan blev glad ett tag. Mina avtal gör allt bättre, alltid. Teknologisektorn upp 1,6 procent, smarta killar. Amerika först, men Sverige klarar sig hyfsat tack vare mig.", "stalin": "Kamrater, denna borgerliga börs i Stockholm visar återigen kapitalismens förrädiska ansikte när den kryper ned 0,14 procent. Den imperialistiska telekommarionetten Ericsson har likviderats med 12,6 procents fall efter att ha blottat sin svaga underbyggnad inför folket. Vi ser hur oljans uppgång dämpas av falska handelsavtal som kamouflflage för västerländsk plundring i Mellanöstern. Men segrarna tillhör Mycronic och AQ Group som levererar rekordorderingång – ett bevis på att produktivkrafterna till sist krossar de parasitiska borgarbrackorna. Inga fiender undkommer vårt vakande öga."}, "date": "14 juli, 17:53", "url": "https://www.affarsvarlden.se/artikel/ericsson-sanke-pa-borsen-omxs30-ned-01"}, {"type": "image-full", "heading": "5-årig flicka knivhuggen på lekplats – polisen utreder brott", "summaries": {"normal": "En femårig flicka fördes till sjukhus med allvarliga skador efter en misstänkt våldshändelse i Furutorpsparken i Helsingborg på måndagseftermiddagen. Polisen spärrade av området, förhörde vittnen och sökte efter den misstänkte. Enligt uppgifter attackerades flickan oprovocerat av en ung pojke som senare själv larmade 112. Pojken, som är under 15 år, har tagits om hand av socialtjänsten. Flickans tillstånd beskrivs som stabilt och polisen ser händelsen som isolerad.", "trump": "Det är en fullständig katastrof i Helsingborg, en riktig skam för Sverige. En liten femårig flicka attackerades brutalt i en park, knivskuren av någon galning. Pojken sprang iväg och ringde själv 112 – kan ni fatta? Inget gripande, bara socialtjänsten som tar hand om honom. Sverige har blivit en dålig plats, folk kan inte ens gå i parken längre. Vi behöver starkare ledarskap, tro mig, det här skulle aldrig hända hos oss.", "stalin": "Kamrater, denna oprovocerade attack mot en oskyldig femåring i Helsingborgs park är ett tydligt tecken på att de dekadenta resterna av den borgerliga parasitklassen fortfarande lurar i skuggorna och förgiftar våra unga pionjärer. Jag, som ledare för folkets vilja, ser hur dessa lumpna små reaktionära element, dessa knivbeväpnade borgarbrackor i barnskepnad, försöker så split och kaos. Vi ska rensa ut alla sådana fiender till kollektivet med järnhand och sovjetisk effektivitet – låt socialtjänsten bli verktyget för folkets hämnd. Det är en munter tanke att pojken själv ringde efter hjälp; kanske inser till och med de mest degenererade elementen att staten vakar."}, "date": "14 juli, 11:42", "url": "https://nyheter24.se/nyheter/inrikes/1498313-5-arig-flicka-knivhuggen-pa-lekplats-polisen-utreder-brott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4cee6dc04b004a3022d0000008d047702/2026/07/13/2377730/Skärmavbild%202026-07-13%20kl.%2018.26.33.jpg"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-full", "heading": "Nya upplopp i Europa efter Marockos match", "summaries": {"normal": "Efter Frankrikes 2–0-seger över Marocko i VM-kvartsfinalen utbröt upplopp i flera europeiska städer, trots att Paris förblev relativt lugnt. I London, Antwerpen och Amsterdam attackerades polis med fyrverkerier, flaskor och raketer. Flera gripanden gjordes. Marockanska diasporan i Europa har tidigare orsakat liknande oroligheter under VM. Polisen i London varnar för att sådan oordning inte kommer att tolereras.", "trump": "Kan ni tro det? Frankrike vinner en match – och plötsligt exploderar hela Europa! Jag har sett mycket, men det här är galenskap. Polisbilar beskjuts med fyrverkerier, gatorna fylls av kaos. Belgien, Nederländerna, Storbritannien – alla tappar kontrollen. Och vad gör deras ledare? Ingenting! Hade jag varit där hade jag satt stopp för det här på en sekund. Men nej, de låter en massa bråkstakar förstöra städerna. Patetiskt!", "stalin": "Kapitalistiska städer i väst skakar under fotbollens revolutionära vågor! De marockanska massorna, trots förtryckets järnhand, reser sig mot polisens bourgeoisie. I London, Amsterdam och Antwerpen slår arbetarklassen tillbaka mot fascistiska uniformer med flaskor och fyrverkerier – ett lysande exempel på folkets kreativa motstånd! Men var försiktiga, kamrater: imperialisterna i Bryssel och London kommer att svara med repression. Vi ser, vi noterar – och vi skrattar åt deras misslyckande!"}, "date": "10 juli, 08:17", "url": "https://kvartal.se/nyheter/artiklar/nya-upplopp-i-europa-nar-marocko-spelar/cG9zdDoxNDQyMjI", "imageUrl": "https://images.kvartal.se/2026/07/5eb1e324-nederlanderna.webp"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
