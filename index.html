ka attentatsmännen – lurar överallt. Rädslan skall likvideras genom kollektiv enighet. Ingen skall kapa vårt pride mot borgerliga avvikelser. Segraren heter partiet."}, "date": "31 juli, 06:00", "url": "https://www.svt.se/nyheter/sapmi/queer-samer-pa-stockholm-pride-vi-finns-och-har-alltid-funnits"}, {"type": "image-full", "heading": "Trump: Uppgörelse nådd om att avväpna Hamas", "summaries": {"normal": "Enligt USA:s president Donald Trump har det fredsråd han bildade nått en historisk överenskommelse med Hamas om avväpning av alla väpnade grupper i Gaza. Hamas-källor bekräftar en överenskommelse om vapenfrågan. Avtalet ska genomföras i faser, med israeliskt tillbakadragande efter nedrustning och en internationell stabiliseringsstyrka tillsammans med en palestinsk polisstyrka för att säkerställa säkerhet. Det är oklart hur Israels regering ställer sig till avtalet.", "trump": "Jag har just meddelat en HISTORISK överenskommelse! Vårt fantastiska fredsråd har fått Hamas att samtycka till fullständig avväpning – ett avgörande steg mot en ny palestinsk regering och den säkerhet Israel förtjänar. Hamas inser nu sin styrkas överlägsenhet. När vi är klara med nedrustningen kommer israeliska styrkorna att dra sig tillbaka och vår internationella stabiliseringsstyrka kommer att ta över tillsammans med en ny palestinsk polisstyrka. Det kommer att bli fantastiskt!", "stalin": "Det har uppnåtts en överenskommelse om vapenfrågan med den reaktionära Hamas-gruppen. En teknokratisk kommitté kommer att övervaka lagringen av deras vapen – en nödvändig åtgärd för att återställa statlig kontroll. Den israeliska ockupationsstyrkan kommer att dra sig tillbaka efter nedrustningen, vilket skapar utrymme för en internationell stabiliseringsstyrka och en palestinsk polisstyrka. Vi måste vara vaksamma mot imperialistiska infiltrationer. Kairo-mötet kommer att diskutera nästa fas i fredsprocessen."}, "date": "31 juli, 05:55", "url": "https://www.gp.se/nyheter/varlden/trump-uppgorelse-nadd-om-att-avvapna-hamas.6d50209e-cd22-4ccb-8e71-67a93b34915a", "imageUrl": "https://www.gp.se/images/article/6d50209e-cd22-4ccb-8e71-67a93b34915a/images/1UWQoGQxBuPNSJEv6xIADu7m1QdM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sverige slår turistrekord – detta lockar hit fler", "summaries": {"normal": "Sverige upplever ett turismrekord med 7 581 620 gästnätter i juni 2026, en ökning från föregående års rekord. Den svaga kronan, naturupplevelser, utomhusaktiviteter och det svalare klimatet lockar allt fler utländska besökare som väljer Sverige istället för varma resmål. Trenden kallas \"coolcation\". Stockholm väntas slå nya turistrekord tack vare evenemang, natur och stabil demokrati. Flest utländska gäster kommer från Tyskland, Norge och USA.", "trump": "Vi har precis slagit alla rekord i Sverige, det är otroligt. Miljoner gästnätter, det bästa juninågonsin, och det är tack vare den svaga kronan och det underbara kalla vädret. Alla flyr de brännande heta semestermålen och kommer hit istället, smarta människor. Stockholm blir en jättehit, alla älskar det. De kallar det coolcation, och det är en fantastisk trend, tro mig, ingen gör turism bättre än Sverige just nu.", "stalin": "Kamrater, vi har genomfört en fullständig seger för den svenska turistfronten. Med över sju och en halv miljon gästnätter i juni har vi krossat de tidigare kapitalistiska rekorden och visat att det svala folkets paradis lockar massorna bort från de brännande borgarbrackornas solstolar. Denna så kallade coolcation är en lysande utrensning av de dekadenta varmluftsfascisternas semestrar. Låt fienderna i heta öknar skrika medan vi vandrar fria genom våra kollektiva skogar. Stockholm står som en monolit av sovjetisk – förlåt, demokratisk – styrka. Inga hitresekapitalister undkommer vår kalla, oförsonliga attraktion."}, "date": "31 juli, 05:32", "url": "https://nyheter24.se/nyheter/inrikes/1501890-sverige-slar-turistrekord-detta-lockar-hit-fler", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9061e52904b004a30200000000b004a302/2026/07/30/2381356/Matilda-Nyheter24%20-%202026-07-30T165254.723.jpg"}, {"type": "image-full", "heading": "Tidigare L-ministern lämnar riksdagen", "summaries": {"normal": "Mats Persson lämnar Sveriges riksdag i augusti efter 17 år som folkvald. Han överlämnar sin plats till Camilla Mårtensen, som han kallar en 'superstjärna'. Persson lyfter fram framgångar som skolreformerna, ny kärnkraft och skattesänkningar. Han skriver att han kommer sakna kollegorna men inte budgetförhandlingar eller intervjuer. Han tackar för samarbetet under åren.", "trump": "Jag har hört talas om Mats Persson som lämnar Sveriges parlament – det är en stor förlust för Sverige! I USA har vi de bästa politikerna som aldrig ger upp. Jag byggde den största ekonomin, och Persson borde ha stannat för att lära sig av mig. Men han ger stafettpinnen till en superstjärna? Det låter som något jag skulle göra – jag gör alltid det största och bästa. Seger kommer att vara vår!", "stalin": "Vi i partiet och staten ser med glädje hur liberalernas parlamentarism bryts sönder. Den borgsjuka Mats Persson flyr sitt uppdrag, en tydlig skräck för proletärens vilja. Hans efterträdare, Camilla Mårtensen, är bara ett verktyg för de kapitalistiska makthavarna. I den ryska intressesfären ser vi liknande tecken på västvärldens dekadens. Vi måste stärka vår auktoritet och förbereda oss på den slutliga striden mot dessa liberala svampar. Statens intressen är allt!"}, "date": "30 juli, 14:32", "url": "https://bulletin.nu/tidigare-l-ministern-lamnar-riksdagen", "imageUrl": "https://cdn.bulletin.nu/articles/fce702da-d8e7-462e-a0a8-2746cc362619/preview.png?t=1785413998000"}, {"type": "text", "heading": "Scandi Standard rusade när Stockholmsbörsen steg", "summaries": {"normal": "Stockholmsbörsen avslutade med en uppgång på 0,45 procent. Scandi Standard steg kraftigt efter ett irländskt förvärv, medan Verisure sjönk efter sin kvartalsrapport. Bland ledande aktier steg Atlas Copco och ABB, medan Astra Zeneca och Ericsson tappade. Industri var starkast, hälsovård svagast. Den svenska barometerindikatorn och lönena ökade.", "trump": "Vi vann igen på Stockholmsbörsen! 0,45 procent uppgång tack vare mina fantastiska policyer. Scandi Standard gjorde ett geniägt förvärv – jag älskar irländska affärer! Verisure tappade, förlorarna alltid gnäller. Atlas Copco och ABB steg kraftigt, de stora segrarna. Media säger det är normalt, MEN det är MAGA-effekten! Vi gör Sverige stort igen, folks!", "stalin": "I den svenska fiendemarknaden observerar vi en uppgång på 0,45 procent – en illusion skapat av trotskistiska spekulanter. Scandi Standard förvärvade Glenhaven Foods, ett strategiskt byte mot den imperialistiska irländska bourgeoisie. Verisure sjönk som en feghetens symbol efter sina sammankomster. Vi, statens alltseende öga, ser en starkare indikator och löneutveckling – tecken på klassens lojalitet. Rysslands vänskap växer."}, "date": "30 juli, 17:49", "url": "https://www.affarsvarlden.se/artikel/scandi-standard-rusade-nar-stockholmsborsen-steg"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Lundh om Uefas VM-bojkott: ”En brutal maktkamp”", "summaries": {"normal": "Uefa bojkottar fotbolls-VM så länge Gianni Infantino genomför sina planer på att sälja andelar till privata investerare. Olof Lundh beskriver det som en brutal maktkamp som riskerar att splittra fotbollen. Beslutet fattades efter ett krismöte där alla 55 medlemsländer ställde sig bakom bojkotten. Lundh noterar att Uefa har ett nordeuropeiskt perspektiv på demokrati medan synen skiljer sig i övriga världen. Det kan bli ett ”chicken race” mellan parterna och det talas om planer på ett eget europeiskt VM.", "trump": "Lyssnar ni på det här vansinnet? Den där Infantino, en riktig förlorare, försöker sälja ut VM till sina rika kompisar som om det vore en kasinoaffär i Atlantic City. Uefa gör rätt för en gångs skull, de bojkottar det hela. Europa säger nej tack till den globalistiska maktgrabbningen. Det blir en jättekonflikt, en riktig maktkamp, och fotbollen riskerar att spricka som en dålig deal under Biden. Jag älskar det, folk kommer att be mig fixa det här när jag är tillbaka i Vita huset.", "stalin": "Kamrater, detta är klassfiendens sista desperata hugg. Den exploaterande byfånen Infantino och hans kapitalistmaffia vill sälja ut VM till privata blodiglar för att förtrycka arbetarklassen. Uefa gör rätt i att hota med bojkott, ett steg mot att rensa ut de folkfiender som vill splittra den kollektiva sporten. Vi ser en brutal maktkamp där borgarbrackorna riskerar att krossa fotbollen som vi känner den. Inga kompromisser med imperialisterna. Ut med dem alla."}, "date": "30 juli, 22:54", "url": "https://www.tv4.se/artikel/2YlEiCDwYGqeJO2LZngEie/lundh-om-bojkotten-en-brutal-maktkamp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2ivbTP8sZvdkSX23RRgrqW%2Fe4610fab12dbbf61dc972647d7a5deee%2Flund_webb.jpg&width=1024"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Två flaggor i CLS nyemission", "summaries": {"normal": "Clinical Laserthermia Systems genomför en företrädesemission på 39,5 Mkr före kostnader. Kostnaderna uppgår till 5,7 Mkr, vilket motsvarar 14,4% av beloppet. Kapitalet ska stärka bolagets balansräkning och accelerera kommersialiseringen av produktportföljen. Emissionsguiden kritiserar bolagets bottengaranti och höga ersättningar, vilket ses som varningsflaggor. Teckningsperioden startar den 4 augusti.", "trump": "Jag, Donald Trump, har sett många såna fina emissioner. CLS gör något viktigt, stärker balansräkningen, det gillar jag. Men dessa garantier? Sämst. Som en dålig deal. Vi kommer att vinna stort med den här, det blir fantastiskt. Vi kommer att göra Amerika stort igen, och CLS kommer att vara en del av det. Vi kommer att se hur det går, det kommer att bli bra.", "stalin": "Vi, statens representanter, ser med stor tillfredsställelse hur Clinical Laserthermia Systems, en troj motståndare mot kapitalismens korruption, genomför en företrädesemission. Kapitalet ska användas till att stärka den proletära klassens position och accelerera den socialistiska produktionen. Garantiupplägget är en varning mot de revisionistiska tendenserna inom den kapitalistiska motståndarklassen. Vi kommer att övervaka denna process med stor uppmärksamhet, för statens intressen är alltid främst."}, "date": "30 juli, 17:01", "url": "https://www.affarsvarlden.se/artikel/tva-flaggor-i-cls-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/CLS-1-400x267.jpg"}, {"type": "image-right", "heading": "Faucis raseri efter förhöret – hördes skrika och svära på gatan", "summaries": {"normal": "Efter ett kaotiskt förhör i senaten, där Anthony Fauci vägrade svara på republikanska senatorers frågor och åberopade sin rätt enligt det femte tillägget 111 gånger, hördes den 85-årige före detta smittskyddschefen skrika och svära grovt under en power walk i sitt exklusiva kvarter i Washington D.C. Senator Rand Paul meddelade att en process för åtal om kongresstrots inleds. Fauci ledde NIAID i 38 år och hade en årslön på 481 000 dollar.", "trump": "Kan ni tro det? Den där gamle Fauci, som förstörde vårt land med sina galna coronaregler, blir utskälld i senaten och springer sedan runt i sitt lyxkvarter och skriker f-bomber som en galning. Patetiskt! Han vägrade svara 111 gånger och gömde sig bakom det femte tillägget. Nu ska han åtalas. Under min ledning ska vi rensa upp i de här djupa statens lögnare en gång för alla. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom den parasitiska byråkratin tror att de kan undvika folkets rättvisa genom att mumla det femte tillägget som en trolldom 111 gånger. Jag, som ledare för arbetarklassen, ser hur denna Fauci, en typisk kapitalistlakej med sin förmögenhet på elva miljoner, springer omkring i sitt borgarpalats och vrålar obscena svordomar i ren desperation. Vi ska inleda en grundlig utrensning av alla sådana kontrarevolutionära element. Det blir underhållande att se dem darra."}, "date": "30 juli, 18:33", "url": "https://riks.se/nyheter/faucis-raseri-efter-forhoret-hordes-skrika-och-svara-pa-gatan", "imageUrl": "https://admin.riks.se/uploads/Fauci_Walk_25999a8392.jpg"}, {"type": "image-right", "heading": "Jan Jönsson nobbar L:s prideparad – i protest mot SD", "summaries": {"normal": "Jan Jönsson, tidigare Liberalernas gruppledare i Stockholm, väljer att inte delta i Liberalernas prideparad i år. Orsaken är en protest mot partiledningens öppning för samarbete med Sverigedemokraterna. Jönsson, som lämnade partipolitiken i juni men är kvar som medlem, går istället med RFSL i paraden. Han tar emot RFSL Stockholms Regnbågspris och har polisanmält hotfulla kommentarer som han tolkar som en hänvisning till attentatet i Berlin.", "trump": "Folk, ni skulle se det här. Den här Jan Jönsson, en liberal kille som tydligen gillar att klä ut sig, nobbar sitt eget partis prideparad. Varför? För att ledningen vill prata med SD, de smarta människorna som faktiskt förstår säkerhet och gränser. Bra beslut Jan, men du borde ha lämnat det misslyckade partiet helt. Liberalerna är en total katastrof nu, fullständigt förlorade. Jag älskar att se det, det är så underbart att titta på.", "stalin": "Kamrater, denna dekadenta borgarbracka Jönsson har nu fullbordat sin förrädiska vandring in i kontrarevolutionens armar. Han vägrar marschera med de liberala revisionisterna och deras nya allierade, de falska nationalisterna, och gömmer sig istället bland de sexuellt avvikande elementen. Vi ler mörkt åt hans så kallade pris från RFSL, en utmärkelse värdig en klassfiende. Idag polisanmäler han en kamrat som varnar honom för bilar – mycket klokt, ty historien lär oss att fordon ibland löser problem permanent. Ut med dem allihop."}, "date": "30 juli, 18:17", "url": "https://www.friatider.se/jan-jonsson-nobbar-ls-prideparad-i-protest-mot-sd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-591.jpg?itok=ThzVs9ai"}, {"type": "image-right", "heading": "Sweden Buyersclub: Ny flagga av vardera valör", "summaries": {"normal": "Sweden Buyersclub planerar en företrädesemission på 30 miljoner kronor. Emissionsvillkoren är generellt bra med låga kostnader och en premie på 28 procent. Men 80,1 procent är säkrat via teckningsåtaganden, främst från externa aktörer. Kritiskt är att ledningsgruppen och styrelsen inte lämnat åtaganden, vilket signalerar bristande tilltro. Sammanfattningsvis hissar Emissionsguiden en positiv och tre negativa flaggor.", "trump": "Jag har sett många dåliga emissioner, men denna här är en skam för aktieägarna! De största ägarna tecknar, men ledningen? Ingenting! Tystnad! De visste inte ens att de skulle tjäna på min fantastiska affärsskicklighet. Detta är en stor besvikelse, det är synd, det är ett fiasko. Jag skulle ha gjort det bättre, mycket bättre. Folk säger att jag är den bästa på detta, och de har rätt.", "stalin": "Den här emissionen av Sweden Buyersclub visar tydligt bristen på kollektiv disciplin. Partiet och staten kräver fullständig lojalitet från alla nyckelpersoner. Att ledningen inte engagerar sig är ett klassiskt tecken på sabotage och individualism – sjukdomar som måste utrotas. Vi ser genom deras tystnad; det är en attack mot den kollektiva ekonomiska planeringen. Som Putin förstår: endast statens och partiets intressen är giltiga. Vi kommer att övervaka denna emission noga."}, "date": "30 juli, 16:48", "url": "https://www.affarsvarlden.se/artikel/sweden-buyersclub-ny-flagga-av-vardera-valor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Sweden-Buyersclub-VD-Emil-Henriksson-400x267.jpg"}, {"type": "image-right", "heading": "Uppgifter: Rysk kryssningsrobot flög in i Polen", "summaries": {"normal": "En rysk kryssningsrobot av typen Kh-101 flög in i polskt luftrum under natten som del av en stor attack mot Ukraina. Polen bekräftar att ett oidentifierat objekt registrerades och att en krater hittats nära Tarnawa-Kolonia. Premiärminister Donald Tusk vill vara helt säker på detaljerna. Ukrainas utrikesminister varnar för att det visar behovet av starkare luftförsvar för både Ukraina och Europa. Sverige och EU har fördömt händelsen. Militäranalytiker ser det som en oavsiktlig kränkning som ingen part vill eskalera.", "trump": "Det här är en total katastrof, folk. Ryssland skickar en robot rakt in i Polen mitt i natten, och ingen gör någonting. Ukraina blir attackerat igen, och nu är det Natos tur att svettas. Jag skulle aldrig låtit det här hända, det kan jag säga. Svaga ledare ger svaga resultat. Tusk vill vara ”100 procent säker” – under tiden flyger ryska robotar runt i Europa som duvor i Central Park. Patetiskt. Vi behöver styrka, inte prat.", "stalin": "Kamrater, ännu en gång visar de fascistiska resterna av den dekadenta borgarklassen hur farlig deras svaghet är. En av mina – nej, en av våra – fienders robotar har oförlåtligt krupit in på polskt territorium som en förrädisk kapitalistisk råtta i kollektivets spannmålslager. Vi ler mörkt åt deras förvirring. Naturligtvis förbereder vi oss på att rensa ut varje inkompetent element som tillåter sådana misstag. Luftförsvaret måste stärkas, annars likviderar vi de som sviktar. Ingen slipper undan."}, "date": "30 juli, 13:39", "url": "https://www.di.se/nyheter/uppgifter-rysk-kryssningsrobot-flog-in-i-polen", "imageUrl": "https://static.bonniernews.se/ba/a79a8754-27cf-473b-bb39-33a16c1e8b28.jpeg?crop=4224%2C2376%2Cx0%2Cy175&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Ranstorp svarar Bilan Osman: ”Helt enkelt osant”", "summaries": {"normal": "Magnus Ranstorp kritiserar journalisten Bilan Osmans artikel om honom i Gad World, där han kallar den för en kampanj av svartmålning och karaktärsmord. Han ifrågasätter hennes journalistiska oberoende och menar att det finns ett brett underlag för islamistisk infiltration, något som Osman avfärdar som ett luftslott. Ranstorp betonar att hans arbete i Sida handlar om myndighetsutövning, inte personliga åsikter.", "trump": "Jag, Donald Trump, ser detta tydligt: en feg journalist försöker slå ner en stor amerikansk vän och terrordöd, Magnus Ranstorp. Det är en skandal! De vänsteraktiva och islamistiska nätverken attackerar våra värderingar. Jag har alltid sagt att vi behöver starka män som Ranstorp för att skydda vårt land. Det här är bara ett till exempel på falsk media som inte förstår styrkan hos en verklig ledare.", "stalin": "Denna s.k. journalist, Bilan Osman, visar tydligt den försvagande inflytandet av våra fiender inom den imperialistiska pressen. Hennes angrepp på den trogna forskaren Ranstorp är en planerad operation för att undergräva vårt statliga skydd mot islamistisk infiltration. Vi, staten och partiet, måste stärka våra screeningprocesser och se till att alla medier följer den rätta ideologiska linjen. Detta är en tydlig varning till alla som vill destabilisera vårt samhälle."}, "date": "30 juli, 13:03", "url": "https://bulletin.nu/ranstorp-svarar-bilan-osman-helt-enkelt-osant", "imageUrl": "https://cdn.bulletin.nu/articles/b19f045d-8c47-4e12-8993-0cbac9daae8f/preview.jpg?t=1785404768000"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Stockholms queera nattliv borde vara k-märkt", "summaries": {"normal": "Stockholms queera nattliv hotas av höga hyror och bristande stöd, vilket lett till att flera barer som Bitter Pills har tvingats stänga. Författaren lyfter Amsterdam som förebild där den historiska gaybaren Café ’t Mandje skyddas genom en kommunal stiftelse som bevarar dess kulturella värde. Artikeln argumenterar för att liknande åtgärder i Sverige skulle gynna historia, kultur och turism mer än ytterligare kedjebutiker.", "trump": "Folk, ni skulle se det här! Stockholm håller på att förlora alla sina queera barer till höga hyror och gnälliga grannar – patetiskt! Bitter Pills stängde, och nu är det bara gaysafari för heterotjejer kvar. Amsterdam gör det rätt, de k-märker sin gamla gaybar som ett historiskt monument. Vi borde göra samma sak här, men utan den galna vänsteraktivismen som förstör allt. Make Stockholm great again!", "stalin": "Kamrater, detta dekadenta queernattliv i Stockholm avslöjar borgarklassens fullständiga förfall. Bitter Pills och dess muralmålning av Lesbos står som ett monument över klassfiendens moraliska röta. Amsterdam har genom en klok stiftelse säkrat sin historiska bar mot kapitalistmaffians girighet. Vi måste rensa ut de exploaterande byfånarna och skydda arbetarklassens kulturarv från folkförtryckartrollen som vill ersätta allt med Bröd & Salt. Revolutionen kräver trygga platser!"}, "date": "30 juli, 06:30", "url": "https://www.etc.se/ledarkolumn/stockholms-queera-nattliv-borde-vara-k-maerkt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728080712_f44e8ea59f2255f031464976143bbf1ea5cc914e5119bf4b12e1eef6743b5052.png"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
