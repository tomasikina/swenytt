li en evig dialektisk triumf för det kollektiva mellanmålet."}, "date": "14 juli, 13:31", "url": "https://nyheter24.se/nyheter/konsument/1498426-kunderna-rusar-till-pressbyran-varan-alla-vill-at", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8558a04704b004a30200000000b004a302/2026/07/14/2377832/Pressbyran.png"}, {"type": "image-full", "heading": "Igelkott och ål fridlyses – blåsippa och gullviva stryks", "summaries": {"normal": "Regeringen uppdaterar listan över fridlysta arter i Sverige. Nya skyddade arter inkluderar igelkott, örtlav, raggtaggsvamp och ål, medan blåsippa, gullviva och murgröna tas bort då de bedöms livskraftiga. Listan minskar från knappt 300 till drygt 230 arter. Klimat- och miljöminister Romina Pourmokhtari inför fyra skyddskategorier och undantag för jord- och skogsbruk samt samhällsintressen. Alla grod- och kräldjur samt orkidéer förblir fridlysta. 130 arter tillkommer och 182 stryks.", "trump": "Folk, ni tror inte vad de gör i Sverige, det är otroligt. De skyddar igelkottar och några svampar som ingen hört talas om, men tar bort blåsippor och gullvivor? Patetiskt! Listan var för lång och trubbig, nu fixar de det med smarta regler så att folk kan använda sin egen mark utan att bli trakasserade. Minister Pourmokhtari gör ett fantastiskt jobb, bättre än någonsin. Sverige behöver inte långa listor bara för att verka gröna, de behöver vett och vinst. Make Sweden Great Again!", "stalin": "Kamrater, jag har nu genomfört en nödvändig utrensning bland de dekadenta fridlysta arterna som länge hotat den socialistiska naturen. Den gamla listan var en borgerlig svulst full av klassfiender och opportunistiska ängsblommor som blåsippa och gullviva. Dessa kapitalistiska parasitväxter likvideras nu från skyddet och får plockas som de kontrarevolutionärer de är. Igelkotten, denna tappra proletära igelkott, får äntligen sitt rättmätiga pansar mot folkfientliga markägare. Vi ska inte ha långa listor bara för att glädja sabotörer och skogsbrukets lakejer. Varje art ska tjäna folket, annars rensas den ut med järnhand. Rapportörerna som undrade varför inget gjorts tidigare har helt rätt att darra – deras egen lathet doftar trotskistiskt sabotage. Framåt mot seger för de sanna pollinatörerna och orkidéerna!"}, "date": "14 juli, 13:38", "url": "https://bulletin.nu/igelkott-och-al-fridlyses-blasippa-och-gullviva-stryks", "imageUrl": "https://cdn.bulletin.nu/articles/9ae52df4-40bc-478d-8b9d-40d57ec07bec/preview.jpg?t=1784029085000"}, {"type": "image-right", "heading": "Historiska kanalbåten på grund: ”Sitter fast”", "summaries": {"normal": "Den historiska kanalbåten Juno, byggd 1874, har gått på grund i Trosa skärgård. Fartyget tog inte in vatten, men efter fem timmar togs beslutet att evakuera de cirka 50 passagerarna till Trosa. Inga personskador har rapporterats. Sjöräddningen och dykare har varit på plats för att undersöka skadorna på det världsunika fartyget.", "trump": "Den gamla båten Juno, byggd 1874 – väldigt gammal, nästan som Joe Biden – har fastnat i Trosa. En katastrof, verkligen! De evakuerar 50 personer, ingen skadad, tack och lov. De borde ha ringt mig, jag hade löst det direkt. Allt är så inkompetent numera. Det är en sorglig syn, en mycket sorglig syn. Vi bygger fantastiska båtar i USA, de bästa båtarna, de fastnar aldrig. En totalt misslyckad dag för Juno!", "stalin": "Denna förfallna relik från en svunnen era, Juno, har kapitulerat inför skärgårdens stenar. Fem timmar av byråkratisk obeslutsamhet följde innan evakuering inleddes. En skam för nationens maskineri! Likaså vacklar västvärldens korrupta logistik medan vår ideologiska motståndare, som likt Putin ständigt söker utvidga sin intressesfär, skrattar åt denna tekniska inkompetens. Vi skall rensa ut de odugliga kaptenerna som tillåter att folkets egendom vilar på havets botten. Disciplin är den enda vägen till framgång!"}, "date": "15 juli, 02:01", "url": "https://www.aftonbladet.se/nyheter/a/JO7gMR/en-kanalbat-har-gatt-pa-grund-passagerare-ombord", "imageUrl": "https://akamai.vgc.no/v2/images/13b67389-ad2f-3482-9532-b82914f19145?fit=crop&format=auto&w=580&s=b0e80cd63e9020d39f739b4c534ab4e85295039f"}, {"type": "image-right", "heading": "Invandringskritiska pionjären Jan Milld är död", "summaries": {"normal": "Jan Milld, en pionjär inom den svenska invandringskritiken, har avlidit vid 82 års ålder. Han grundade 1994 föreningen och tidskriften Blågula Frågor tillsammans med Anders Sundholm och spred statistik om folkutbyte. Milld började politiskt i Socialdemokraterna, var senare verksam i Vänsterpartiet, Miljöpartiet och Sverigedemokraterna. Han fortsatte sitt opinionsarbete trots starkt motstånd och medial stämpel som nazist. Mot slutet fokuserade han på judiskt inflytande. Han avled den 7 juli.", "trump": "Hörni, den här Jan Milld var en riktig tuffing, en pionjär som vågade säga sanningen om invandring när alla andra var för fega. Han byggde upp Blågula Frågor och skrev böcker som visade hur galen politiken var. De kallade honom nazist, typiskt fake news-media. Han gav aldrig upp, spred fakta på nätet och YouTube. Fantastiskt jobb, Jan. Fredsfrågan hade han rätt i, krig är förlorare-grejer. Vi behöver fler som honom, inte de globalistiska clowner som förstör länderna.", "stalin": "Kamrater, denna Milld var en ihärdig motståndare mot den degenererade mångkulturalistiska förrädarklicken som förgiftar folkens enhet. Jag, som alltid vaktar revolutionens renhet, ser hur han envist samlade statistik mot folkutbytet trots borgarbrackornas mediala utrensningskampanjer. Han började i socialdemokratiska kretsar men insåg snart parasiternas spel. Mot slutet blottade han judiska kapitalisters inflytande – en briljant men farlig insikt som fick honom likviderad av hälsans och teknikens kontrarevolutionära saboterande. Hans sista fredspropaganda var dock patetiskt naiv; krig är ett verktyg för att rensa ut de verkliga fienderna, inte en absurditet. Låt oss hedra honom genom att fördubbla vaksamheten mot alla dolda fiender i skuggorna."}, "date": "14 juli, 16:10", "url": "https://www.friatider.se/invandringskritiska-pionjaren-jan-milld-ar-dod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/milld1_0.jpeg?itok=4OCtGMB3"}, {"type": "image-full", "heading": "Nya arter blir fridlysta", "summaries": {"normal": "Regeringen presenterade under tisdagen en ny lista över fridlysta arter som träder i kraft 1 november. Listan krymper från nästan 300 till 230 arter. Igelkotten, örtlaven, raggtaggsvampen och ålen blir fridlysta, medan blåsippan, gullvivan och murgrönan tas bort eftersom de bedöms livskraftiga. Syftet är att skydda hotade arter bättre och underlätta för jord- och skogsbruk samt samhällsintressen som energiproduktion.", "trump": "Lyssnar ni på det här? De svenska byråkraterna har äntligen vaknat och kastat ut en massa onödiga blommor från sin lista. Bra! Igelkotten får skydd, underbart, men varför tog det så lång tid? De gamla reglerna var en total katastrof, precis som Bidens gröna vansinne. Nu kan ärliga markägare äntligen arbeta utan att någon galen miljöaktivist stämmer dem. Fantastiskt! Vi älskar igelkottar, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den nya listan rensar ut svaga, livskraftiga element som blåsippan och murgrönan. Borgarbrackornas ängsblommor och kapitalistiska prydnadsväxter förtjänar ingen plats bland de verkligt hotade. Igelkotten och de pollinerande insekterna stärker kollektivet. Markägare som inte skadar arterna får nyttja jorden. Det är en sund utrensning mot klassfiendens trubbiga skydd. Utmärkt."}, "date": "14 juli, 21:44", "url": "https://www.gp.se/nyheter/sverige/arterna-som-blir-fridlysta-over-180-tas-bort.101d7d1b-9fad-4a97-b3be-87e671afe689", "imageUrl": "https://www.gp.se/images/article/101d7d1b-9fad-4a97-b3be-87e671afe689/images/3UXO7Iiz95mGlKRkRp-bR--9cm2w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Trafikverkets varning i värmen: Plötslig sommarhalka", "summaries": {"normal": "Trafikverket varnar för blödande asfalt när temperaturen närmar sig 35 grader. Asfalten kan bli hal och orsaka halka, särskilt på nylagd beläggning yngre än två år och backar mot söder. Myndigheten uppmanar bilister att köra försiktigt, hålla avstånd och se upp efter blänkande ytor eller stänk från framförvarande bilar. Trafikverket inspekterar vägarna och är beroende av tips från allmänheten.", "trump": "Folk, det är underbart väder, sol och semester, men nu varnar de för blödande asfalt som gör vägarna hala som aldrig förr. Det är en katastrof, tro mig, speciellt på nya vägar och södersluttningar. Kör långsamt, håll avstånd, titta efter blänk och stänk – annars flyger ni iväg. Ta det lugnt, glöm skyltarna med 110, det är bara förlorare som kör så fort i värmen. Fantastiskt, eller hur?", "stalin": "Kamrater, jag ser hur den solbestrålade asfalten blöder som en förrädisk sabotageakt från värmens kontrarevolutionära element. Borgarbrackorna i sina sydvända backar lurar arbetets fordon i döden med plötslig halka och blänkande yta. Vi ska omedelbart inspektera alla vägar, rensa ut de kapitalistiska asfaltsförrädarna och likvidera varje droppe som hotar kollektivets framfart. Den som kör för fort är en objektiv fiende till staten – ta det lugnt eller möte er utrensning."}, "date": "14 juli, 20:47", "url": "https://www.svt.se/nyheter/inrikes/trafikverket-varnar-for-blodande-asfalt-i-varmen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.77/0.56/fc3a99612a501b1be9480b6009a9c48dbe5099eedde50a2981c210fb90fd1ed6"}, {"type": "image-full", "heading": "5-årig flicka knivhuggen på lekplats – polisen utreder brott", "summaries": {"normal": "En femårig flicka fördes till sjukhus med allvarliga skador efter en misstänkt våldshändelse i Furutorpsparken i Helsingborg på måndagseftermiddagen. Polisen spärrade av området, förhörde vittnen och sökte efter den misstänkte. Enligt uppgifter attackerades flickan oprovocerat av en ung pojke som senare själv larmade 112. Pojken, som är under 15 år, har tagits om hand av socialtjänsten. Flickans tillstånd beskrivs som stabilt och polisen ser händelsen som isolerad.", "trump": "Det är en fullständig katastrof i Helsingborg, en riktig skam för Sverige. En liten femårig flicka attackerades brutalt i en park, knivskuren av någon galning. Pojken sprang iväg och ringde själv 112 – kan ni fatta? Inget gripande, bara socialtjänsten som tar hand om honom. Sverige har blivit en dålig plats, folk kan inte ens gå i parken längre. Vi behöver starkare ledarskap, tro mig, det här skulle aldrig hända hos oss.", "stalin": "Kamrater, denna oprovocerade attack mot en oskyldig femåring i Helsingborgs park är ett tydligt tecken på att de dekadenta resterna av den borgerliga parasitklassen fortfarande lurar i skuggorna och förgiftar våra unga pionjärer. Jag, som ledare för folkets vilja, ser hur dessa lumpna små reaktionära element, dessa knivbeväpnade borgarbrackor i barnskepnad, försöker så split och kaos. Vi ska rensa ut alla sådana fiender till kollektivet med järnhand och sovjetisk effektivitet – låt socialtjänsten bli verktyget för folkets hämnd. Det är en munter tanke att pojken själv ringde efter hjälp; kanske inser till och med de mest degenererade elementen att staten vakar."}, "date": "14 juli, 11:42", "url": "https://nyheter24.se/nyheter/inrikes/1498313-5-arig-flicka-knivhuggen-pa-lekplats-polisen-utreder-brott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4cee6dc04b004a3022d0000008d047702/2026/07/13/2377730/Skärmavbild%202026-07-13%20kl.%2018.26.33.jpg"}, {"type": "image-full", "heading": "Storbråk inför VM-matchen: \"Frankrike har ingen hudfärg\"", "summaries": {"normal": "Kontroversen inför VM-semifinalen mellan Spanien och Frankrike har eskalerat efter att Spaniens tidigare premiärminister Mariano Rajoy kritiserade det franska landslaget för att sakna franska spelare. Frankrikes utrikesminister Jean-Noël Barrot anklagar Rajoy för rasism och skriver att Frankrike inte har någon hudfärg. Även Spaniens nuvarande premiärminister Pedro Sánchez tar avstånd från uttalandet.", "trump": "Titta på det här, det är patetiskt. Den gamle Rajoy säger att Frankrike inte har några riktiga franska spelare och plötsligt blir hela världen galen. Frankrikes minister skriker rasism, men alla vet att han bara försöker skydda ett lag som ser ut som FN. Spanien borde vinna stort på tisdag. Make football great again, folkens.", "stalin": "Kamrater, dessa borgarbrackor i väst avslöjar åter sin dekadens. Jag ser hur den spanske reaktionären Rajoy med sin rasistiska lögn försöker splittra det proletära kollektivet i det franska laget. Vi ska rensa ut alla sådana kapitalistiska lögnare som bedömer människor efter hudfärg istället för klassmedvetenhet. Deras paranoia är underhållande, men farlig. Ut med dem i historiens sophög."}, "date": "14 juli, 16:53", "url": "https://riks.se/nyheter/storbrak-infor-vm-matchen-frankrike-har-ingen-hudfarg", "imageUrl": "https://admin.riks.se/uploads/frank2ike_75b3d00286.png"}, {"type": "image-right", "heading": "River sönder SD:s affischer – känner du igen dem?", "summaries": {"normal": "Två personer har filmats när de river ner Sverigedemokraternas valaffischer i Henriksdal i Stockholm. Händelsen inträffade den 10 juli strax efter klockan 23. Sverigedemokraterna och deras kanal Riks ber nu allmänheten om hjälp att identifiera en man och en kvinna i 20-årsåldern som åkte elsparkcykel och systematiskt förstörde affischerna. Partisekreterare Mattias Bäckström Johansson fördömer handlingen som antidemokratisk.", "trump": "Det är förfärligt, folk. Verkligen förfärligt. Vi har de bästa valaffischerna, de finaste, men dessa losers på elsparkcykel river ner dem mitt i natten. Antidemokrater, kanske radikala vänsterextremister, saboterar vår demokrati. SD ber om hjälp att hitta dem – och det borde de få. Sådana här människor hatar valrörelsen. Vi vinner ändå stort, tro mig.", "stalin": "Kamrater, dessa degenererade element som rider omkring på borgerliga leksaker och systematiskt likviderar revolutionära affischer är typiska sabotörer i borgarklassens sold. Jag ser deras fega ansikten i mörkret och känner lukten av kontrarevolution. Vi ska rensa ut dessa parasitiska skadedjur från samhällskroppen med järnhand. Tipsa genast, annars kanske utrensningen drabbar fel kamrater. Det vore tragikomiskt."}, "date": "14 juli, 15:10", "url": "https://www.friatider.se/river-sonder-sd-affischer-kanner-du-igen-dem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-496.jpg"}, {"type": "image-right", "heading": "Nu säger SD öppet att de vill ha ett Sverige för vita", "summaries": {"normal": "Ledarskribenten Gabriella Kärnekull Wolfe menar att Sverigedemokraterna nu öppet bekänner sig till etnonationalism. Genom uttalanden om den 'etniskt svenska befolkningen' och förslag om återvandringsbidrag även för svenska medborgare, anser Wolfe att partiet har kastat sin mask. Hon kritiserar satsningen på 350 000 kronor per person som en prioriteringsfråga som väljer bort välfärd till förmån för vad hon beskriver som en renodlad rasistisk politik.", "trump": "Hörde ni? De svenska demokraterna, eller vad de kallar sig, har äntligen visat sina riktiga färger! De vill betala folk för att lämna landet, stora pengar, massiva summor. Det är en otrolig deal, kanske den bästa dealen någonsin, men de vill ha ut de duktiga människorna. Varför göra sig av med de laglydiga? Det är helt galet! De pratar om 'etnisk befolkning' – mycket intressant, väldigt fascinerande. De borde bygga en mur istället, mycket effektivare. Sad!", "stalin": "Vi har observerat dessa svenska opportunister. De talar om etnisk renhet och kostymer för att dölja sin svaghet. Det är en patetisk dans! Som när de små lokala marionetterna i Kiev darrar inför vår vilja, försöker dessa SD-figurer imitera en statlig ordning utan att förstå att makten ligger i järnhand, inte i bidrag. Vi behöver inte 350 000 kronor för att flytta folk – vi har betydligt mer effektiva logistikmetoder för de som inte passar in i folkets enhet."}, "date": "14 juli, 15:09", "url": "https://www.etc.se/ledare/sd-saeger-som-det-aer-de-vill-ha-ett-etniskt-svenskt-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071413078_053ab507d504a7bf1735b9751d2ee681337f0fe102c7c0e89998c1ddafa0ddd1.jpg"}, {"type": "text", "heading": "Bankomat är för känt – förlorar tvist mot amerikanska jätten", "summaries": {"normal": "Patent- och marknadsdomstolen har hävt Bankomat AB:s varumärkesskydd och företagsnamn efter en tvist med Google. Domstolen menar att ordet 'bankomat' har blivit en allmän benämning för uttagsautomater. Bankomat stämde ursprungligen Google för varumärkesintrång i deras översättningstjänster, men Google vann målet med argumentet att ordet saknar särskiljningsförmåga. Bankomat AB döms nu att betala över 7,6 miljoner kronor i rättegångskostnader, samtidigt som kontantanvändningen och antalet automater i Sverige fortsätter att minska.", "trump": "Hörde precis om Bankomat, ett riktigt misslyckande! De stämde Google – stora, rika Google – och de förlorade stort. Pinsamt! Domstolen sa att 'Bankomat' bara är ett vanligt ord nu, inte ett varumärke. De förlorade namnet, de förlorade skyddet, och de måste betala över 7 miljoner kronor! Vilken katastrof för dem. Jag vet hur man bygger märken, jag har de bästa märkena. Bankomat? De är förlorare. Allt handlar om att vinna, och de förlorade allt!", "stalin": "Denna så kallade 'Bankomat' har visat sin totala svaghet inför de imperialistiska teknikjättarna. Att förlora sitt namn till Google är ett bevis på borgerlig inkompetens. Vi ser hur västvärldens pengar ruttnar bort medan deras automater försvinner, precis som vår broder Putin rensar ut de opålitliga elementen i gränslandet. Att kasta bort 7,6 miljoner kronor på advokater är ett brott mot folket. Vi i staten skulle ha ställt dem mot väggen långt tidigare. Svaghet förtjänar endast utplåning."}, "date": "14 juli, 15:02", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankomat-ar-for-kant-forlorar-tvist-mot-amerikanska-jatten/"}, {"type": "image-right", "heading": "Maskiner hjälper människan. Kritiken har urartat under VM", "summaries": {"normal": "Artikeln diskuterar hur teknik som VAR, sensorer och smarta bollar påverkar fotbolls-VM och speglar en bredare debatt om automatisering och AI. Trots att maskiner ofta presterar bättre än människor kvarstår mänskliga inslag som leder till kritik, fel och konspirationsteorier, inte minst efter påtryckningar från USA:s president. Tekniken ses som en hjälp för människan, vilket visas i jämna matcher där kunskap demokratiserats, men den kan aldrig ersätta det mänskliga i spelet.", "trump": "Folket älskar fotboll, men de här VAR-maskinerna och de smarta bollarna är en total katastrof. De gör spelet tråkigt och felaktigt, precis som de gör med allt annat. Vi såg det med Norge mot England, och plötsligt dyker konspirationerna upp – och ja, det var påtryckningar från den bästa presidenten någonsin, mig. Människor som Haaland och Mbappé är fenomenala, inte maskiner. Teknologin hjälper oss, men den behöver styras av vinnare, inte förlorare som fuskar systemet.", "stalin": "Kamrater, dessa kapitalistiska leksaker som VAR och rörelsesensorer utgör ett förräderi mot folkets fotboll. Jag, som ledare för det kollektiva framsteget, ser hur borgarbrackornas maskiner nagelfarar revolutionära mål och föder kontrarevolutionära konspirationer. Mänskliga svagheter som äregirighet och påtryckningar från dekadenta imperialister i Vita huset måste rensas ut. Tekniken är ett verktyg för arbetarklassen, inte en pina, men vi likviderar alla fiender som förgiftar spelet med sin parasitiska individualism. Haaland och Mbappé är maskinliknande hjältar i kampen mot ojämlikhet."}, "date": "14 juli, 12:15", "url": "https://www.di.se/ledare/maskiner-hjalper-manniskan/", "imageUrl": "https://static.bonniernews.se/ba/15ff7cec-bc47-4b56-bc9a-b17ed0fe5731.jpeg?crop=3973%2C1987%2Cx0%2Cy331&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tjeckien testar 150 km/h", "summaries": {"normal": "Tjeckien blir först i EU med att testa 150 km/h som hastighetsgräns på en 47 kilometer lång motorvägssträcka. Digitala skyltar aktiveras endast vid bra väder. Experter varnar för att tidsvinsten är liten, bara cirka sex minuter, och att bränsleförbrukningen ökar med 10–25 procent. Många förare överskattar besparingen eftersom de ändå måste sakta ner ibland.", "trump": "Tjeckien, smarta killar, testar 150 km/h på motorvägen. Fantastiskt! De andra EU-länderna är för långsamma och fega. Sex minuters besparing? Patetiskt. Bilarna dricker mer bensin än en dålig affär, men vi älskar fart. De borde lyssna på mig, vi gör allt bättre och snabbare. Vinna, vinna, vinna!", "stalin": "Vi, det stora kollektivet, betraktar med misstänksamhet hur borgarbrackorna i Tjeckien leker med sina motorvägar och farter upp till 150 kilometer. Jag ser tydligt hur de kapitalistiska fienderna, dessa luftmotståndsförnekare och bränsleslukande sabotörer, försöker lura arbetarklassen med lögnaktiga tidsbesparingar på ynka sex minuter. Deras utsläppsrök är en kontrarevolutionär konspiration. Rensa ut de som lovar mer hastighet men levererar bara högre förbrukning och farliga avvikelser från planen. Ingen slipper undan."}, "date": "14 juli, 12:14", "url": "https://bulletin.nu/tjeckien-testar-150-km-h"}, {"type": "image-full", "heading": "SMHI ger gul varning för högsommarvärme – kan bli 30 grader", "summaries": {"normal": "SMHI har utfärdat en gul varning för höga temperaturer i delar av Sverige. Från onsdag och tre dagar framåt väntas temperaturer runt 30 grader i nordöstra Götaland och inre Svealand, bland annat i Östergötlands, Södermanlands, Örebro, Västmanlands, Kalmar, Jönköpings, Uppsala, Dalarnas och Gävleborgs län. Riskgrupper som äldre och sjuka uppmanas att dricka mycket, undvika stark sol och hålla bostaden sval då värmen kan påverka hälsan.", "trump": "Folket, ni kommer inte att tro det, men Sverige får nu en enorm värme, den bästa värmen, runt 30 grader i flera dagar. SMHI, som annars inte gör så mycket, har faktiskt utfärdat en varning. Det är fantastiskt väder, kanske det bästa någonsin, men de svaga – de gamla, de små – de klarar det inte. Drick vatten, undvik solen, det är enkelt. Ingen har sett värme som denna, tro mig.", "stalin": "Kamrater, jag ser hur den västerländska värmen försöker krossa våra sovjetiska kroppar med sin fega 30-gradiga solattack. Borgarbrackorna i SMHI varnar, men vi vet att det är en konspiration från de dekadenta kapitalisterna som vill försvaga arbetarklassen. Vi ska rensa ut den här värmen med järnhand. Drick, håll er borta från solen, likvidera svagheten i era hem. Den som svettas för mycket är en fiende till folket."}, "date": "14 juli, 11:24", "url": "https://nyheter24.se/nyheter/inrikes/1498464-smhi-ger-gul-varning-for-hogsommarvarme-kan-bli-30-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2dddaf9704b004a30200000000b004a302/2026/07/14/2377868/SMHI-gul-varning.png"}, {"type": "text", "heading": "Skärgårdsö fast i hårda trädkrav: \"Absurt exempel\"", "summaries": {"normal": "Öckerö kommun riskerar att drabbas hårt av EU:s naturrestaureringsförordning. Kommunen har endast 9 procent trädkronetäckning, under gränsen på 10 procent, och får därför inte minska sina grönytor fram till 2030 utan kompensation. Med ett landskap av kala klippor och begränsad mark blir det svårt att bygga och kompensera. Både kommunekologen Linnea Rösiö och Byggföretagen kritiserar regelverket som absurt för skärgårdskommuner.", "trump": "Det här är ett totalt vansinnigt regelverk från EU, tro mig. Öckerö sitter på kala klippor och nu säger de att ni inte får bygga för att ni inte har tillräckligt med träd. Absurt. De har 9 procent, de behöver 10, och plötsligt kan de inte utveckla sin ö. Byggföretagen har helt rätt, det sätter käppar i hjulen för näringslivet. Vi behöver sunt förnuft, inte galna byråkrater som jämför en liten svensk ö med Paris. Patetiskt.", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta EU-byråkratin och dess borgarbrackor i Bryssel försöker kväva folkets framåtskridande med sina absurda trädkronemål. Jag, som ledare för det stora kollektivet, ser hur dessa kapitalistiska ekofantaster vill likvidera Öckerös utveckling genom att kräva skugga från icke-existerande träd på kala klippor. Vi ska rensa ut denna paranoia från västkusten och tvinga kompensation i andra tätorter. Den som inte ser fienden i varje satellitbild är en kontrarevolutionär trädkramare som bör utrensas med ett leende."}, "date": "14 juli, 07:00", "url": "https://www.affarsvarlden.se/artikel/skargardso-fast-i-eus-tradkrav-absurt-exempel"}, {"type": "image-right", "heading": "Därför är skurk­företagen tacksamma för SD", "summaries": {"normal": "Artikeln kritiserar Jimmie Åkessons nya vandelskrav som trädde i kraft och som gör det möjligt att neka eller återkalla uppehållstillstånd baserat på levnadssätt och skötsamhet, även utan brott. Författaren menar att Tidöpartiernas politik ger oseriösa arbetsgivare mer makt, vilket gör att utsatta anställda inte vågar anmäla fusk, svartarbete eller dåliga villkor av rädsla för utvisning. Detta gynnar skurkföretag, försvagar fack och konkurrensförutsättningar samt underminerar skyddet för hårt arbetande svenskar.", "trump": "Folk, ni måste höra det här – det är en katastrof! Den här Jimmie Åkesson med sitt vandelskrav tror han är tuff, men han ger skurkföretagen precis det vapen de behöver. Stackars arbetare som sliter hårt vågar inte säga ifrån när chefen fuskar med lön eller tvingar farliga jobb, för då åker de ut ur landet. Åkesson säger att han är för arbetarna, men han gör det motsatta. Han hjälper de dåliga killarna att pressa bra, ärliga människor. Det är en skam, en total skam, och det drabbar alla riktiga arbetare till slut.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna och deras lakejer inom det så kallade Tidöblocket med sin diffust formulerade vandelspolitik omedvetet blottar sin sanna klassnatur. Jag, som alltid prioriterar arbetarkollektivets enhet, betraktar detta som ett lysande vapen i händerna på parasitföretagen – de korrupta utsugarkapitalisterna som lever på tystnad och rädsla. Snart rensar vi ut dessa sabotageörer som gömmer sig bakom falska arbetarretorik. Ingen ska undkomma folkets dom. Det är en munter ironi att de själva förser oss med verktygen för deras egen slutliga utrensning ur historien."}, "date": "14 juli, 07:00", "url": "https://arbetet.se/2026/07/14/darfor-ar-skurkforetagen-tacksamma-for-jimmie-akesson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13161304/ledare-skurkforetag-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Varnar för att världen kan stå inför ny oljekris: ”Då blir det väldigt illa”", "summaries": {"normal": "Råvaruanalytikern Christian Kopfer varnar för att världen riskerar en ny oljekris om Hormuzsundet stängs. Trots fredssignaler har geopolitiska spänningar mellan USA och Iran ökat riskpåslaget. Oljepriset ligger nu kring 80 dollar per fat, men kan stiga till 150 dollar eller mer om Kinas lager sinar. Konsekvenserna blir främst inflation, högre priser och störningar i världsekonomin för både hushåll och företag.", "trump": "Folk, det här är en total katastrof som de korkade globalisterna har kokat ihop. Jag hade Iran och de galningarna under full kontroll, men efter Sleepy Joe blev allt ett enda kaos. Nu snackar de om 150 dollar fatet – det är vansinne! Mina dealar gav billig energi, nu får vi inflation och flaskhalsar. De borde ha lyssnat på mig från början, inte på de där förlorarna. Det blir väldigt illa, tro mig.", "stalin": "Kamrater, imperialismens blodtörstiga exploaterande byfånar leker åter med världens oljeådror och hotar det kollektiva framåtskridandet. Jag ser hur de fascistiska kapitalistmaffian och deras lakejer i Hormuzsundet framkallar panik för att suga ut arbetarklassen med inflationsspöken. Lager sinar som klassfiendens lögner. Om de inte underkastar sig vårt järnhandskgrepp väntar en utrensning av dessa folkförtryckartroll. Det blir mycket illa för borgarbrackorna."}, "date": "13 juli, 23:08", "url": "https://www.tv4.se/artikel/5Hxaq4rkrggBTh8TKmcb4G/varnar-foer-att-vaerlden-kan-sta-infoer-ny-oljekris-vaeldigt-illa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2X6vfV0ahvrLOvI4Y3N0vg%2F761ab05c2b2b1dcf276d63734bbdc5dc%2Fsundet_webb.jpg&width=120"}, {"type": "image-full", "heading": "Nya upplopp i Europa efter Marockos match", "summaries": {"normal": "Efter Frankrikes 2–0-seger över Marocko i VM-kvartsfinalen utbröt upplopp i flera europeiska städer, trots att Paris förblev relativt lugnt. I London, Antwerpen och Amsterdam attackerades polis med fyrverkerier, flaskor och raketer. Flera gripanden gjordes. Marockanska diasporan i Europa har tidigare orsakat liknande oroligheter under VM. Polisen i London varnar för att sådan oordning inte kommer att tolereras.", "trump": "Kan ni tro det? Frankrike vinner en match – och plötsligt exploderar hela Europa! Jag har sett mycket, men det här är galenskap. Polisbilar beskjuts med fyrverkerier, gatorna fylls av kaos. Belgien, Nederländerna, Storbritannien – alla tappar kontrollen. Och vad gör deras ledare? Ingenting! Hade jag varit där hade jag satt stopp för det här på en sekund. Men nej, de låter en massa bråkstakar förstöra städerna. Patetiskt!", "stalin": "Kapitalistiska städer i väst skakar under fotbollens revolutionära vågor! De marockanska massorna, trots förtryckets järnhand, reser sig mot polisens bourgeoisie. I London, Amsterdam och Antwerpen slår arbetarklassen tillbaka mot fascistiska uniformer med flaskor och fyrverkerier – ett lysande exempel på folkets kreativa motstånd! Men var försiktiga, kamrater: imperialisterna i Bryssel och London kommer att svara med repression. Vi ser, vi noterar – och vi skrattar åt deras misslyckande!"}, "date": "10 juli, 08:17", "url": "https://kvartal.se/nyheter/artiklar/nya-upplopp-i-europa-nar-marocko-spelar/cG9zdDoxNDQyMjI", "imageUrl": "https://images.kvartal.se/2026/07/5eb1e324-nederlanderna.webp"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "image-right", "heading": "Polisen hittade automatvapen under golvet – då började piloten prata om CIA", "summaries": {"normal": "Polisen hittade minst åtta skarpladdade vapen, bland annat en MP5-liknande kulsprutepistol, gömda under golvet i ett hemmagym i Karlsborg. En 80-årig helikopterpilot med kopplingar till Sverigedemokraterna, Israel och CIA åtalas för synnerligen grovt vapenbrott. Mannen påstår att vapnen placerats av utländska underrättelsetjänster och att fastigheterna ägs av ett amerikanskt bolag. Flera familjemedlemmar greps men släpptes senare.", "trump": "Kan ni fatta det här? En 80-årig helikopterpilot med CIA-kopplingar gräver ner vapen som en riktig patriot under golvet i sitt gym. Amerikanerna äger husen, säger han, och plötsligt är det ett stort brott? Fake news från vänstermedia! Under Biden blev allt kaos, nu fixar jag det. SD-knutna Trump-supporters – fina människor. Inga woke-röster eller kvotfeminister här, bara äkta råstyrka. Sad!", "stalin": "Jag betraktar denna vapengömma som ett tydligt bevis på klassfiendens dolda sabotage. Borgarbrackorna och imperialisterna gömmer sina verktyg för att undergräva folkets säkerhet. Den gamle piloten må tala om sina uppdragsgivare, men vi genomskådar alla försök till kontrarevolution. En utrensning av sådana folkfiender och deras hemliga gömställen är nödvändig för att skydda staten från inre förrädare. Skrattretande patetiskt."}, "date": "6 juli, 12:54", "url": "https://proletaren.se/artikel/polisen-hittade-automatvapen-under-golvet-da-borjade-piloten-prata-om-cia/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/vapen2-768x512.png"}]</script>

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
