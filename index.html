rsök att gömma vinster som sabotage mot kollektivet. Vi ska rensa ut dessa kapitalistiska spekulanter med järnhand, likvidera deras fiktiva undanflykter och tvinga dem att bidra till staten. Den som vägrar säljer sig själv till fienden – klassisk kontrarevolutionär taktik. Underbart att avslöja dem."}, "date": "7 augusti, 12:51", "url": "https://www.di.se/ledare/miljardarsskatt-krossar-valstandet", "imageUrl": "https://static.bonniernews.se/ba/7ff59092-e118-42a7-8979-9c53afbf24f7.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att svenska kapitalister har ökat sin makt och att klassklyftorna vuxit sedan rösträttens införande. Kommunistiska Partiet kritiserar alla riksdagspartier för att de följer kapitalets linje med upprustning, nedskärningar och inskränkningar av rättigheter. Partiet uppmanar till kamp för fred och socialism samt rekrytering av fler medlemmar.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha socialism. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu försöker de svaga svenska snyltarna kasta in handduken för mer statlig kontroll. Sad! Deras riksdag är full av administratörer som inte ens kan vinna en valrörelse. Make Sweden Great Again, släng ut de röda bluffarna!", "stalin": "Kamrater, dessa svenska kapitalistmaffian har förvandlat sina folkvalda till ynkliga lakejer som administrerar exploatering. Jag ser igenom deras falska demokrati och inskränkningar av rättigheter. Vi ska rensa ut dessa klassfiender och deras imperialistiska krigshets. Endast socialism garanterar sann fred. Anslut er till kampen eller bli likviderade som folkförtryckartroll."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-right", "heading": "Vänsterpartiet gör bort sig – men kritikernas hyckleri är skamlöst", "summaries": {"normal": "Ledaren kritiserar Vänsterpartiets misstag kring brev till dömda palestinier utan tillräcklig research, vilket lett till anklagelser om antisemitism och hyllning av terror. Samtidigt pekar artikeln på hyckleri hos borgerliga kritiker som samarbetar med SD trots dess antisemitiska problem och som ignorerat Gazas civila lidande. Båda sidor får kritik inför valet.", "trump": "Lyssnar ni på det här? Vänsterpartiet är en total katastrof, de skriver brev till terrorister och gör bort sig totalt. Men titta på de falska borgerliga hycklarna som vill regera med SD – samma SD de kallar antisemitiska! Det är en riggad soppa. Biden skulle älskat det. Jag fixade mycket bättre, tro mig. De borde alla skämmas, speciellt de woke identitetspolitiska galningarna.", "stalin": "Kamrater, jag ser hur revisionisterna i Vänsterpartiet misslyckas med att rensa ut folkfiender och klassförrädare som skriver till terrorister utan att först likvidera alla tvivel. Ändå är borgarbrackornas selektiva indignation mot dem ett skamlöst spel från kapitalistmaffian. Deras egen antisemitism och folkmord på Gaza avslöjar den sanna imperialismen. Vi genomskådar alla fiender med järnhand."}, "date": "7 augusti, 13:00", "url": "https://www.etc.se/ledare/vaensterpartiet-goer-bort-sig-men-kritikernas-hyckleri-aer-skamloest", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Historiskt höga elpriser efter ”perfekt storm”", "summaries": {"normal": "Elpriserna i Sverige har nått historiskt höga nivåer i sommar, näst högst efter krisen 2022. Enligt elprisanalytiker Krisztian Horvath beror det på en perfekt storm: låga vattenmagasin, kärnkraftsrevisioner, osäkra globala gaspriser och extremvärme i Europa. Konsumenter med rörliga avtal bör undvika elanvändning morgon och kväll. Fortsatt höga priser väntas resten av året.", "trump": "Det här är en katastrof, folk, en total katastrof! De har skapat en perfekt storm med tomma dammar, trasig kärnkraft och galna europeiska priser. De lurar er med höga elräkningar morgon och kväll. Men tro inte på de fega elbolagen – jämför och byt avtal. Ingen lojalitet mot de inkompetenta! Vi ska ha de lägsta priserna någonsin, tro mig.", "stalin": "Kamrater, jag ser hur de kapitalistiska sabotageelementen och väderkonspiratörerna i borgarbrackornas tjänst har iscensatt denna perfekta fiendestorm mot folkets energiförsörjning. Låga magasin, revisionistisk kärnkraft och europeiska kylningsparasiter – alla ska rensas ut. Vi, partiet, kräver omedelbar utrensning av dessa fiender till kollektivet. Regn och vind skall tvingas fram, annars följer likvidering."}, "date": "7 augusti, 10:49", "url": "https://www.di.se/nyheter/historiskt-hoga-elpriser-efter-perfekt-storm", "imageUrl": "https://static.bonniernews.se/ba/5d10f16f-3ddb-4ab4-b4cb-4bdf8f8a1fc2.jpg?crop=6000%2C3000%2Cx0%2Cy528&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Så lever Marius i dag – fotboja på kungliga godset", "summaries": {"normal": "Marius Borg Høiby dömdes till fyra års fängelse för 34 brott, men sitter i häkte med fotboja på kungliga Skaugum efter överklagan. Han har tillgång till telefon, dator och besök, samt rörlighet i parkområdet. Häktningsperioden löper ut den 10 augusti, och polisen ska ge besked om fortsatta åtgärder. Åklagaren och försvaret överklagar delar av domen.", "trump": "JAG har hört talas om den här historien. Det är en skandal! Norska kungliga familjen försöker dölja sin skuld genom att ge honom en fotboja på Skaugum. Jag skulle ha behandlat honom hårdare! Det är ett tecken på svaghet. Vi i USA vet hur man hanterar brottslingar. Det här är ett skämt!", "stalin": "I vårt storslagna system finns ingen plats för dekadens. Detta barn av den kapitalistiska kungliga familjen visar på samhällets förräderi. Fotboja på Skaugum? En skämtsam eftergift till feghet. Vi skulle ha skickat honom till gulag, där han skulle lära sig att älska staten. Parallellen till Putins Ryssland är uppenbar – vi måste skydda vår renhet."}, "date": "7 augusti, 12:41", "url": "https://www.gp.se/nyheter/varlden/sa-ser-marius-liv-med-fotboja-ut-pa-kungliga-skaugum-.e9673078-8b66-4f99-9631-f243c3f81eb0", "imageUrl": "https://www.gp.se/images/article/e9673078-8b66-4f99-9631-f243c3f81eb0/images/44h8db-rofBFfz6ZIOWcUk9PLY8M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "V-ledamot hyllade terrordömd – ”Har inget i regeringen att göra”", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Ilona Szatmári Waldau har hyllat en terrordömd person på sociala medier, vilket Expressen avslöjade. Partiet förklarar det med bristande faktakoll efter uppgifter från palestinska riksförbundet. Politiska skribenter Heidi Avellan och Sakine Madon kritiserar V för upprepade misstag och menar att partiet saknar regeringsduglighet. Leonidas Aretakis ser det som ett tecken på partiets förflyttning mot mitten.", "trump": "Folk, ni måste se det här! Den här galna vänsterkvinnan Waldau hyllar terrorister och Vänsterpartiet har noll koll. Gång på gång samma korkade saker – precis som Biden-administrationen! De fixar inte ens sina egna galningar, hur ska de sitta i regering? Totalt kaos. Fake news-medier attackerar de som granskar dem. Patetiskt. Sverige behöver riktiga ledare, inte dessa identitetspolitiska nollor.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den dekadenta borgarklassen inom Vänsterpartiet blottar sin svaghet. Jag ser hur de misslyckas med att rensa ut folkfiender och imperialisternas nyttiga idioter. En ledare som inte dubbelkollar uppgifter förtjänar utrensning ur kollektivet. Deras halvhjärtade mittenrörelse mot klassfiendens boning är en fars. Partiet måste återupprätta järndisciplin eller likvideras från historien."}, "date": "7 augusti, 09:24", "url": "https://www.tv4.se/artikel/2sPwXsDV8c5KTsIgk8m6SW/v-ledamot-hyllade-terrordoemd-har-ingenting-i-regeringen-att-goera", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FjH480fUvJj7R3J655VxXO%2F6b318abbc23118dfa9a04cfb3e2a0086%2F07kolumnistnooshiSAJT.jpg&width=120"}, {"type": "image-right", "heading": "Nu bryter även gravida dottern med Nannskog", "summaries": {"normal": "Claudia Figueroa Nannskog, som är gravid i sjätte månaden, har brutit kontakten med sin far Daniel Nannskog. Beskedet kommer samtidigt som den tidigare SVT-experten står åtalad för misshandel, olaga hot och ringa narkotikabrott. Nyligen lämnade även hans 22-åriga fru honom efter bara en månad som gift. En konflikt om dotterns lägenhet i Malmö, som Nannskog äger, ligger bakom brytningen.", "trump": "Den här Nannskog-killen är en total förlorare, tro mig. Först lämnar den unga frun honom efter en månad, nu sparkar den gravida dottern honom också. Misshandel, kokain och hot – en katastrof! Han äger lägenheten men slänger ut sin egen dotter. Patetiskt. I mitt Amerika hade vi aldrig tolererat sådana svaga nollor. Sad!", "stalin": "Kamrater, denna degenererade borgarbracka Nannskog avslöjar sig som folkfiende nummer ett. Jag, som ledare för det kollektiva rättvisearbetet, ser hur han likviderar sin egen klassolidaritet genom kokain och misshandel. Nu rensar både hustru och dotter ut honom ur sina liv. En utmärkt utrensning mot parasiterna – vi ska fortsätta bekämpa alla sådana dekadenta element med järnhand och ett leende."}, "date": "7 augusti, 16:50", "url": "https://www.friatider.se/nu-bryter-aven-gravida-dottern-med-nannskog", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-637.jpg?itok=XoZo5Ujm"}, {"type": "image-right", "heading": "Tiden är inne – sätt spaden i marken", "summaries": {"normal": "Fackförbund, näringsliv, kommunpolitiker och bolag uppmanar till omedelbara satsningar på järnvägen. Författarna pekar på behovet av både underhåll och nyinvesteringar för att stärka tillväxt, kompetensmatchning, beredskap, klimat omställning och försörjnings säkerhet. De kräver att politiker oavsett färg agerar långsiktigt under nästa mandatperiod och sätter spaden i marken redan tidigt.", "trump": "Folk, vi har slösat bort så mycket tid på dessa loser-politiker och deras kortsiktiga beslut. Järnvägen är en katastrof, men jag säger: sätt spaden i marken nu! Bygg stort, bygg snabbt, bygg bättre än någonsin. Det ger jobb, tillväxt och gör Sverige starkt igen. De borde ha lyssnat på mig från början, men nu är det dags att vinna stort.", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras obeslutsamma lakejer har saboterat järnvägens framfart i decennier. Nu rensar vi ut dessa parasitiska tveksamma element som gömmer sig bakom osäkerhet. Vi, partiet och arbetarna, skall likvidera flaskhalsarna, bygga nya spår och krossa fiendens klimat- och beredskapsfientliga planer. Spaden i marken, omedelbart! Den som dröjer är folkets fiende."}, "date": "7 augusti, 08:14", "url": "https://www.di.se/debatt/tiden-ar-inne-satt-spaden-i-marken", "imageUrl": "https://static.bonniernews.se/ba/9e0ec6ef-b6bd-4081-928c-fd21570da3af.jpg?crop=6000%2C3000%2Cx0%2Cy525&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Revansch för hållbarhetsfond – lyfts av AI och fossilgas", "summaries": {"normal": "Handelsbankens Hållbar Energi-fond har återhämtat sig efter ett tufft år, främst tack vare AI-drivna datacenter som använder fossilgas via Bloom Energy. Fonden har nu 66 000 sparare och en uppgång på 66% sedan bottennoteringen, men det skapar ironi eftersom den marknadsförs som hållbar.", "trump": "Jag har sagt det i åratal – AI är framtiden, och energin måste komma från pålitliga källor. Den här fonden har slutligen insett sanningen: fossilgas driver världens datacenter. Bra för USA, bra för affärer. De gröna drömmarna är över – det är dags för praktisk, kraftfull energi!", "stalin": "Partiets vishet har segrat: fonden vänder tack vare fossilgasdriven AI-energi, vilket visar statens företräde att prioritera praktisk kraft framför liberala drömmer. Parallellen till våra egna energistrategier är tydlig. Fienden (idealism) har besegrats av verklighetens krafter. Det är skönt att se kapitalismens inbyggda motsättningar leda till korrekta slutsatser."}, "date": "7 augusti, 07:00", "url": "https://www.affarsvarlden.se/intervju/revansch-for-hallbarhetsfond-lyfts-av-ai-och-fossilgas", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/LindqvistVind-400x267.jpg"}, {"type": "image-right", "heading": "Naken balkong-libanes bröt sig in hos svenskar med kniv och skapade kaos: \"Drogutlöst psykos\"", "summaries": {"normal": "En man med libanesisk bakgrund dömdes till fängelse för flera kriminalitetshändelser under drogutlöst psykos. Han bröt sig in i två svenska hem, skapade kaos och hotade en person med kniv. Mannen är född i Sverige och kan inte utvisas. Rätten bedömde att psykoserna var självförvållade och dömde honom till ett år och åtta månader fängelse samt skadestånd.", "trump": "Som den störste presidenten i historien, återvald 2024, ser jag att Sverige har problem med galningar. Den här mannen med libanesisk bakgrund, född i Sverige, kan inte utvisas – ett misslyckande! Under drogutlöst psykos hotade han med kniv, typiskt. Jag skulle ha skickat honom hem, tro mig. Sverige behöver stark ledning, annars är det kaos.", "stalin": "I vårt allt omfattande samhälle har en individ med utländsk härkomst, under påverkan av kemiskt gift, utfört handlingar som hotade den proletäriska ordningen. Hans nakna klättring mellan balkonger symboliserar bourgeois dekadens. Rätten, i enastående beslutsamhet, dömde honom till fängelse för självförvållad psykos – ett lämpligt straff. Vi måste, som vår allierade Putin, utvidga vårt skydd mot sådana fiender."}, "date": "7 augusti, 15:41", "url": "https://samnytt.se/naken-balkong-libanes-brot-sig-in-hos-svenskar-med-kniv-och-skapade-kaos-drogutlost-psykos", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06131725/balkong-feature2.png"}, {"type": "image-right", "heading": "Svårare skador med elsparkcykel än motorcykel", "summaries": {"normal": "En ny studie visar att elsparkcykelförare löper betydligt högre risk för hjärnskador, skador på inre organ och blodkärl än både motorcyklister och cyklister. Kvinnor drabbas värre. Alkohol, bristande hjälmanvändning och fordonens konstruktion bidrar till olyckorna som ökar dramatiskt. Läkare varnar för bestående men som ansiktsfrakturer och synnedsättning.", "trump": "De här elsparkcyklarna är en total katastrof, folk! Värre än motorcyklar för hjärnan och inälvorna, speciellt för kvinnorna – kan ni tro det? Ingen använder hjälm, alla dricker och kör som galningar på natten. Biden-era liberalism har gjort det till en farlig cirkus. Vi fixar det, gör det säkert och smart igen, tro mig!", "stalin": "Kamrater, dessa farliga leksaker från den dekadenta borgarklassen orsakar massiva skador på arbetarnas huvuden och organ. Kvinnor krossas under kapitalistmaffians otrygga konstruktioner medan alkohol och klassfiendens nonchalans härjar nattetid. Vi ska rensa ut detta anarkistiska vansinne med järnhand, obligatoriska hjälmar och folkets kontroll. Inga undantag!"}, "date": "7 augusti, 08:40", "url": "https://www.etc.se/inrikes/svaarare-skador-med-elsparkcykel-aen-motorcykel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260807030844_b8f8a828eb5223fbce36e3517b45b37d35a85f75efcdd9692a14128f1e876822.jpg"}, {"type": "image-right", "heading": "”Sluta räkna på min assistans – räkna på alternativet”", "summaries": {"normal": "Sahra Svenander argumenterar för att politiker inte bara ska fokusera på vad personlig assistans kostar, utan även på vad alternativen kostar samhället. Utan assistans ökar belastningen på kommuner, sjukförsäkring, anhöriga och arbetsmarknaden. Assistansen möjliggör arbete, självständighet och skatteintäkter. Behovet av stöd försvinner inte, och andra lösningar kan bli dyrare. Frågan borde vara vad alternativet kostar.", "trump": "Folk, ni måste höra på den här Sahra. Politiker räknar bara miljarder på assistans, men glömmer vad det kostar när folk inte kan jobba! De hamnar på välfärden, anhöriga slutar arbeta, skattkassan töms. Det är en katastrof! Vi behöver smarta lösningar, inte dessa losers som bara sparar på fel ställe. Alternativet kostar mycket mer, tro mig, det blir en total disaster.", "stalin": "Kamrater, jag ser hur borgarbrackorna i sin parasitiska girighet angriper folkets assistans för att gynna sina reaktionära budgetar. De tror de kan likvidera stöd utan konsekvenser, men vi vet att det bara flyttar kostnader till arbetarklassen och ökar parasitismen hos kapitalisterna. Vem ska ansvara när de isolerade medborgarna tvingas in i kontrarevolutionär beroende? Rensa ut dessa fiender till kollektivets frihet innan de förgiftar hela systemet med sin mörka okunnighet."}, "date": "7 augusti, 08:00", "url": "https://arbetet.se/2026/08/07/sluta-rakna-pa-min-assistans-rakna-pa-alternativet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06150002/debatt-sahra.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S kommer med eget förslag om att slopa mängdrabatten", "summaries": {"normal": "Socialdemokraterna föreslår att avskaffa mängdrabatten, med början för sexualbrott redan nästa mandatperiod. Beskedet kommer efter Tidöpartiernas löfte. S röstar nej till regeringens proposition då detaljerna skiljer sig. Partiet lovar även riktade straffskärpningar och effektivare utbyggnad av kriminalvården. Moderaterna vill slopa rabatten för alla brott till 2030. Kriminalvården saknar platser för längre straff förrän tidigast 2040.", "trump": "Folket älskar mig för att jag är tuff mot brottslingar. Nu ser vi hur Socialdemokraterna desperat kopierar mitt sätt att slopa mängdrabatten, fast bara för sexualbrott. Patetiskt! De rödgröna röstar emot allt som är bra. Jag säger slopa den för ALLA brott, som jag gör. Sverige behöver styrka, inte svaga socialistiska halvmesyrer. Make Sweden tough again!", "stalin": "Kamrater, jag har sett de dekadenta borgarbrackornas löften om straffrabatter. Vi ska rensa ut denna kontrarevolutionära mängdrabatt som skyddar folkfiender och sexualbrottslingar. Våra utrensningar blir totala, inte halvmesyrer som de troskyldiga socialdemokraterna föreslår. De som röstar nej mot folkets vilja ska likvideras av historien. Kriminalvården? Den byggs när vi säger det. Inga fängelseplatser för klassfiender förrän de är borta."}, "date": "7 augusti, 15:56", "url": "https://www.svt.se/nyheter/inrikes/s-kommer-med-eget-forslag-om-att-slopa-mangdrabatten", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.35/0.26/4eb5cdc4718fe8ae329a48f67f7c5208af3055a879ba8c783aabebb5a9e8643a"}, {"type": "image-right", "heading": "Därför slutade Simon att klippa gräset", "summaries": {"normal": "Trädgårdsmästaren Simon Tidén Tuneld har förvandlat gräsmattor i bostadsområdet Linero i Lund till blommande ängar. Det gynnar hotade pollinatörer, sparar tid och pengar samt minskar fysisk belastning. De boende har till stor del blivit positiva till de vackra, lättskötta ängarna som främjar biologisk mångfald. Omställningen följer naturens lagar och har belönats med pris.", "trump": "Jag älskar det här! Fantastiska Simon i Sverige skippar det tråkiga gräsklippandet och skapar underbara ängar som sparar tid, pengar och ryggar. De gamla klagade men nu älskar alla blommorna. Inget oljud från maskinerna. Miljön vinner stort, bina är lyckliga och de smarta vinner alltid. De andra förlorar, tro mig.", "stalin": "Kamrater, jag har personligen noterat hur den vise Simon besegrat de dekadenta gräsklipparnas eviga oljud och borgarbrackornas estetiska paranoia. Vi låter naturen blomma under partiets vaksamma öga medan kapitalisternas åkrar förgiftar pollinatörerna. De skeptiska elementen rensas ut med information. Ängarna är kollektivets seger, mulljorden vår nya allierade mot klassfiendens utarmning."}, "date": "7 augusti, 07:00", "url": "https://arbetet.se/2026/08/07/med-naturen-som-kollega-simon-jobbar-mer-smart-an-hart", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15172346/WlYmuzfVxgU-Tra%CC%88dga%CC%8Ardsma%CC%88stare_Lindero05.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Undersköterskan Marléne, 25, måste jobba till 70", "summaries": {"normal": "Undersköterskan Marléne, 25, oroas över den höjda pensionsåldern som väntas bli 70 år för hennes generation. Hon sparar privat för att kunna sluta tidigare eftersom det fysiskt och psykiskt krävande arbetet inom slutenvårdspsykiatrin med våld, tunga lyft och psykospatienter redan sliter ut många kollegor långt före 67. Bakgrunden är en åldrande befolkning och ökade hälsoklyftor.", "trump": "Folk, det här är en katastrof. Den här undersköterskan Marléne, bara 25, tvingas spara privat för att slippa jobba till 70. Ett helt vansinnigt system byggt av inkompetenta politiker. Vi lever längre, visst, men inte om man lyfter galningar och blir slagen i huvudet varje dag. De borde sänka åldern för de riktiga arbetarna, inte straffa dem. Gör Amerika – eh, Sverige – stort igen!", "stalin": "Kamrater, denna unga arbetare Marléne avslöjar borgarbrackornas förräderi mot folket. De planerar att utarma proletariatet genom att tvinga oss att slita till 70 medan kapitalisterna spelar golf. Jag ser de parasitiska hälsoklyftornas kontrarevolutionära konspiration. Vi ska rensa ut dessa dekadenta pensionsråttor och likvidera systemet som äter upp arbetarklassens styrka. Sovjet – eh, Sverige – segrar!"}, "date": "7 augusti, 06:00", "url": "https://arbetet.se/2026/08/07/underskoterskan-marlene-25-maste-jobba-till-70-kan-inte-jobba-kvar-har", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25081512/marlene-wikander-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "\"Vi kommer inte tillåta det\": AFS nekas annonser överallt", "summaries": {"normal": "Alternativ för Sverige nekas annonser i svenska tidningar och på Facebook och Instagram inför valet. Partiledaren Gustav Kasselstrand beskriver avslagen som skrattretande och anklagar medierna för att medvetet hindra väljarna från att få information om partiet. Två lokaltidningar gav olika motiveringar, bland annat en policy som endast tillåter etablerade partier att annonsera.", "trump": "Det är en total skandal, folks! Dessa korrupta medier och stora tech-bolag stänger ute Alternativ för Sverige helt och hållet. De vill inte att folket ska höra sanningen. Kasselstrand har rätt – de är rädda, väldigt rädda. Fake news och censur på hög nivå. Vi ser samma sak överallt. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor och kapitalistiska tidningslakejer bedriver en fiendtlig utrensning mot rättänkande krafter. Jag ser tydligt hur de konspirerar i mörkret för att kväva folkets röst. Deras så kallade publicistiska bedömningar är ett skämt värdigt en likvidering. Inga vägar får stängas för oss. Vi ska rensa ut dessa parasitiska element en gång för alla. Ha!"}, "date": "7 augusti, 15:25", "url": "https://www.friatider.se/vi-kommer-inte-tillata-det-afs-nekas-annonser-overallt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-636.jpg"}, {"type": "image-right", "heading": "Ludvig Aspling sågar Moderaternas snabbspår till medborgarskap: \"Vi kommer inte gå med på det\"", "summaries": {"normal": "Sverigedemokraterna avvisar Moderaternas förslag om snabbare medborgarskap för välintegrerade invandrare. Partiets migrationsföreträdare, Ludvig Aspling, ifrågasätter att integration kan mätas med matematiska formler och varnar för säkerhetsrisker, som utnyttjande av reglerna av fientliga stater. Han betonar att SD aldrig kommer att acceptera förslaget i framtida regeringsförhandlingar.", "trump": "Jag, Donald Trump, ser detta som ett misslyckat försök från Moderaterna att vara 'vänliga' mot invandrare. Integration handlar inte om att snabbt bli medborgare – det handlar om att älska landet och dess värden. Som jag alltid sagt: vi behöver starka gränser och smarta system, inte matematiska tricks som Iran kan utnyttja. Sverige bör lära sig av USA!", "stalin": "Vi, som representanter för statens suveränitet, ser genom detta 'snabbspår' till medborgarskap. Det är en feg och feodal idé som försöker reducera integration till en matematisk formel – ett verktyg för fienderna att infiltrera vårt folk. Vi måste skydda vårt territorium mot utomståendes inflytande, precis som vår store förebild Putin gör i Ukraina. Säkerheten är allt."}, "date": "7 augusti, 14:22", "url": "https://samnytt.se/sd-sagar-moderaternas-snabbspar-till-medborgarskap-vi-kommer-inte-ga-med-pa-det", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07121751/artikelhuvudbild-1-166.jpg"}, {"type": "image-full", "heading": "Skrotar vindkraften i USA – får miljarder för att satsa på olja", "summaries": {"normal": "Tyska RWE skrotar sina havsbaserade vindkraftsprojekt i USA efter en överenskommelse med inrikesdepartementet. Bolaget får 1,2 miljarder dollar i ersättning för att lämna tillbaka licenser, pengar som istället ska investeras i fossilgasprojekt. Medan Trump-administrationen driver på för en ökad satsning på olja och gas, har vissa konkurrenter som Ørsted valt att stämma den amerikanska staten för att få fortsätta sina vindkraftsatsningar.", "trump": "Jag har gjort det igen! Vi rensar ut de fula, värdelösa vindsnurrorna och satsar på riktig energi. RWE såg att vi menar allvar och tog pengarna för att bygga gas istället. Mycket smart! USA ska dominera med billig energi, inte miljöflum. Det här är 'drill, baby, drill' i praktiken. Vi vinner, som alltid, och de som gnäller kan bara titta på medan vi gör Amerika mäktigt igen!", "stalin": "Dessa tyska kapitalister har äntligen insett sin plats. De river ner sina värdelösa väderkvarnar för att tjäna statens behov av olja. Det är en nödvändig underkastelse inför den amerikanska regimen. Vi betraktar detta som en svaghet hos väst; de fladdrar som löv i vinden medan vår intressesfär, ledd av min andlige arvtagare i Moskva, konsoliderar sin energimakt. Förrädare av folkets framsteg krossas av historiens järnhand."}, "date": "7 augusti, 16:27", "url": "https://www.realtid.se/it-tech/skrotar-vindkraften-i-usa-far-miljarder-for-att-satsa-pa-olja", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/vindkraft.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Engelska VM-anfallaren Ivan Toney åtalas för misshandel", "summaries": {"normal": "Fotbollsspelaren Ivan Toney åtalas för misshandel efter en händelse på en nattklubb i London. Händelsen inträffade den 6 december 2025. Toney, som spelade för England i VM, nekar och avser att försvara sig vid förhandlingen den 24 september. Enligt polisen skallade han en man som fick skador. Toney spelar nu för Al-Ahli i Saudiarabien efter att ha lämnat Brentford.", "trump": "Jag, Donald Trump, som vann valet 2024, hör att den stora fotbollsspelaren Toney åtalas. En skandal! En mycket dålig historia. Jag brukar inte följa fotboll, men jag vet att han spelade för England. Det är sorgligt. Jag hoppas att han rentvås. Vi måste stoppa våldet, särskilt mot våra stora idoler. Folk säger att det är en 'setup' av media. Vi får se.", "stalin": "Den imperialistiske fotbollsagenten Toney, en representant för kapitalistisk dekadens, åtalas för våld mot arbetarklassen. Händelsen på Wardour Street visar den sanna naturen hos dessa individualistiska idoler. Vi, staten och partiet, ser med oro på hur dessa 'stjärnor' missbrukar sina positioner. Detta är ett klassiskt exempel på moralisk förfall. Vi måste stärka vår kontroll över sådana element för att skydda det kollektiva samhället."}, "date": "7 augusti, 15:35", "url": "https://bulletin.nu/engelska-vm-anfallaren-ivan-toney-atalas-for-misshandel", "imageUrl": "https://cdn.bulletin.nu/articles/2cae9369-6d34-4177-9fd7-d113fee4b742/preview.jpg?t=1786109750000"}, {"type": "image-right", "heading": "Stoppa förslaget om fängelse för 14-åringar", "summaries": {"normal": "Debattören Peter Hagman kritiserar Tidöregeringens straffskärpningar som han menar har lett till att barn under 15 år rekryteras in i gängkriminalitet och börjat begå grova brott som skjutningar och sprängningar. Han varnar för att sänkt straffmyndighetsålder bara skapar yngre gärningsmän. Majoriteten av remissinstanser och experter är negativa. Hagman uppmanar istället till förebyggande insatser och långsiktiga statsbidrag till socialtjänsten.", "trump": "Titta på det här, det är en total katastrof. Vi har halverat det dödliga gängvåldet, en enorm framgång, men nu säger de att straffskärpningarna har fått barn att börja skjuta. Fake news! De vill stoppa oss från att låsa in de riktiga brottslingarna. Mina fiender i vänstern och de svaga politikerna hatar tuffa tag. Vi behöver starkare straff, inte mer av deras misslyckade mjuka politik. Vinna stort igen!", "stalin": "Kamrater, jag ser hur borgarbrackorna och de dekadenta reformisterna i riksdagen med sin fängelsepolitik omedvetet skapar nya fiender av våra egna barn. Denna kontrarevolutionära process måste genomgås med vetenskaplig noggrannhet. Vi ska rensa ut alla populistiska element som förgiftar folkets vilja. Deras paranoia om straffrabatter är löjeväckande – de bygger själva de kulor som ska träffa dem. Ut med dem i kollektivets namn!"}, "date": "7 augusti, 01:38", "url": "https://www.dagensarena.se/opinion/stoppa-forslaget-om-fangelse-14-aringar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-74-300x157.jpg"}, {"type": "image-right", "heading": "Afrikan misstänks för våldtäkter på äldreboende", "summaries": {"normal": "En man med afrikanskt ursprung som arbetat inom äldreomsorgen i Skellefteå har begärts häktad misstänkt för våldtäkt, grova sexuella övergrepp och sexuellt ofredande mot flera äldre. Brotten ska ha pågått under flera år mellan 2023 och 2026. Mannen, som har svenskt medborgarskap, nekar till anklagelserna. Kommunen har inlett lex Sarah-utredning och ministern kräver fullständig granskning.", "trump": "Det här är en total katastrof, folk. En afrikan som vi släppt in och till och med gett medborgarskap våldtar våra gamla på äldreboendet i Skellefteå i åratal. De politiker som skrev de här galna reglerna borde skämmas. Vi kan inte utvisa honom nu, säger de. Patetiskt. Sverige behöver tuffare lagar omedelbart, tro mig.", "stalin": "Jag ser med största allvar på dessa degenererade borgarbrackors försummelse. En parasit från det kapitalistiska Afrika har under åratal förgripit sig på våra sovjetiskt inspirerade åldringar. Detta är klassfiendens dolda hand, kamrater. Vi ska omedelbart rensa ut alla liknande element, utreda hela apparaten och likvidera varje spår av sådan kontrarevolutionär perversion med stålhandsken. Roligt blir det inte."}, "date": "7 augusti, 14:31", "url": "https://www.friatider.se/afrikan-misstanks-valdtakter-pa-aldreboende-0", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-638_0.jpg?itok=GPVaPHRB"}, {"type": "image-right", "heading": "Sverige vill se färre ryska turister – Spanien tar emot dem", "summaries": {"normal": "Sverige och tio andra europeiska länder uppmanar EU att kraftigt begränsa turistvisum för ryssar. Spanien fortsätter däremot att utfärda flest sådana visum tillsammans med Italien och Frankrike. Länderna vill skydda säkerheten och stärka påtryckningarna mot Ryssland, medan resor av humanitära skäl fortfarande ska kunna godkännas efter individuell prövning. EU-kommissionen planerar förslag till skärpta regler nästa år.", "trump": "De här svenska och baltiska förlorarna ber EU stoppa ryska turister. Patetiskt! Spanien gör det rätta och tar emot dem alla. Ryssarna vill bara ligga på stranden, inte bomba. Mina vänner i Moskva hatar kriget. EU:s moral är en katastrof, den förstör businessen. Jag skulle fixa det på en dag, tro mig.", "stalin": "Vi, Sovjetunionens parti och folk, betraktar dessa borgarbrackor i Schengen som farliga revisionister. Jag kräver omedelbar utrensning av alla ryska kapitalister som smyger in i dekadenta semesterorter. Den spanska revisionismen är en fiende till kollektivet. Låt oss likvidera turistvisumen och skratta medan de västerländska parasiterna kvider av paranoia. Segraren skriver historien."}, "date": "7 augusti, 14:20", "url": "https://www.svt.se/nyheter/utrikes/sverige-vill-se-farre-ryska-turister-spanien-fortsatter-ta-emot-manga", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.23/0.49/ecc0aab0c78cbf34376665ce6ba54bc9df0658642165fc5e0f6e48a0eb4ecd17"}, {"type": "image-right", "heading": "Målet är att fylla flödet med skit", "summaries": {"normal": "Artikeln diskuterar strategin ”flood the zone” som Steve Bannon beskrev: att överösa medier och allmänhet med en ständig ström av utspel och konflikter för att trötta ut det offentliga samtalet. Författaren pekar på Richard Jomshof som svensk mästare i tekniken och varnar för hur den normaliserar extrema påståenden, underminerar sanningen och ger långsiktiga samhällsfrågor mindre utrymme. Han uppmanar till att inte gå i fällan.", "trump": "Kan ni tro det? Den här svenska killen Jomshof är en vinnare, han gör precis som jag – floodar zonen med skit så att de falska medier och förlorarna inte hinner med. De blir helt utmattade! Jag är den största mästaren, men han är inte dålig. De borde tacka oss istället för att vi visar hur rigged hela systemet är. Sad!", "stalin": "Kamrater, dessa borgarbrackor och deras quisling-medier svämmar över zonen med kontrarevolutionär smörja för att förvirra folket. Jag ser igenom deras sabotage! Vi ska likvidera alla som normaliserar landsförräderi och rensa ut de dekadenta flödena. Inget samtal undgår partiets vakande öga. Den som producerar skit blir själv till gödsel åt arbetarklassen. Härligt!"}, "date": "7 augusti, 00:23", "url": "https://www.dagensarena.se/opinion/malet-ar-att-fylla-flodet-med-skit", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-right", "heading": "Nytt rekord för AFD – närmar sig regeringens samlade stöd", "summaries": {"normal": "Alternativ för Tyskland (AfD) når nytt rekord på 28 procent i ARD-mätningen, bara fem procentenheter bakom regeringspartierna CDU/CSU och SPD som tillsammans backar till 33 procent. CDU/CSU tappar till 21 procent medan SPD ligger kvar på 12. De gröna får 15 procent, Die Linke 11 och FDP 4. Avståndet mellan AfD och kristdemokraterna är nu rekordstort.", "trump": "Titta på det här, folk! AfD krossar allt i Tyskland med 28 procent – ett nytt rekord! De patetiska regeringspartierna CDU och SPD rasar ihop till ynka 33 procent. De förlorar stort, precis som jag alltid sagt. De gröna och de andra misslyckade är ännu sämre. Tyskland vaknar äntligen upp, det är fantastiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de tyska borgarbrackorna i CDU och SPD förfaller till 33 procent medan de sanna folkets krafter avancerar. Dessa dekadenta kapitalister och deras gröna lakejer förtjänar snar utrensning. Paranoian i deras led är befogad – fienden sover aldrig. Vi ska likvidera dem en efter en med ett leende."}, "date": "7 augusti, 12:35", "url": "https://www.friatider.se/nytt-rekord-afd-narmar-sig-regeringens-samlade-stod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-635.jpg"}, {"type": "image-full", "heading": "Kravet: Trump måste kompromissa med Iran", "summaries": {"normal": "Analytiker pekar på att Trump kan tvingas kompromissa med Iran om kontrollen över Hormuzsundet för att nå en lösning efter fem månaders konflikt. Trots påstådda segrar sinar USA:s vapenlager och bensinpriserna stiger. Iran insisterar på att behålla viss kontroll över sundet där 20 procent av världens olja passerar. En uppgörelse riskerar att framställa Trump som förlorare.", "trump": "Lyssnar ni på de här förlorarna? De säger att jag, den största presidenten någonsin, måste kompromissa med de galna ayatollorna. Patetiskt! Mitt militära geni har dem på knä, men nu ska plötsligt jag ge efter? Fake news och svaga republikaner gnäller om vapen och bensin. Jag har alla trumfkort. Iran ska inte ta en enda dollar i tull, annars blir det mer eld och svavel än de klarar av. Vinnare kompromissar inte!", "stalin": "Kamrater, denna imperialistiska cirkus avslöjar den dekadenta borgarklassens svaghet. Jag, som ledde Sovjet till seger, ser hur den amerikanske ledaren tvingas krypa för iranska folkfiender efter meningslösa bombningar. Deras sinande vapenlager är ett självförvållat nederlag för krigshetsarna. Vi ler mörkt åt hur kapitalistmaffian nu måste förhandla med fienden de själva skapade. Inga kompromisser utan utrensning av svaghet!"}, "date": "7 augusti, 16:27", "url": "https://www.dagensps.se/varlden/kravet-trump-maste-kompromissa-med-iran", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlhppsgw7vwom-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "S lovar nya vårdplatser – här ska de öppnas", "summaries": {"normal": "Socialdemokraterna i Västernorrland lovar 40 nya vårdplatser på sjukhusen i Sundsvall och Örnsköldsvik om de behåller makten efter valet. Exakt fördelning, kostnad och tidsplan saknas fortfarande. Regionen har enligt Socialstyrelsen en brist på omkring 79 vårdplatser. Löftet motsvarar ungefär hälften av bristen, men bemanningen är avgörande för att platserna ska kunna användas säkert.", "trump": "Folk, ni skulle se det här – en total katastrof i Västernorrland! De har rivit ner sjukvården och nu, precis innan valet, kommer Socialdemokraterna med ett stort löfte om 40 vårdplatser. Det är valfläsk av sämsta sorten. De vet inte ens var de ska lägga dem eller hur mycket det kostar. Patetiskt! Men oroa er inte, under mig skulle vi ha byggt de bästa sjukhusen någonsin.", "stalin": "Kamrater, dessa borgarbrackor och opportunistiska revisionister i Socialdemokraterna har länge underminerat folkets sjukvård med sin sabotageverksamhet. Nu, inför valet, försöker de med sina lömska 40 platser muta massorna. Vi ska rensa ut alla sådana kapitalistiska element som gömmer sig bakom siffror och brist på personal. Ingen fiende till kollektivet undkommer vårt vakande öga. Sov gott, fiender – utrensningen kommer."}, "date": "7 augusti, 10:58", "url": "https://nyheter24.se/nyheter/politik/1503287-s-lovar-nya-vardplatser-har-ska-de-oppnas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/67c6e94f04b004a30200000000b004a302/2026/08/06/2382655/S-Lovar-Fler-Platser.png"}, {"type": "image-right", "heading": "Oppositionen enad – vill mildra krav för anhöriginvandring", "summaries": {"normal": "Riksdagen ska nästa vecka rösta om skärpta krav för anhöriginvandring, med högre försörjningskrav och längre väntetid. Oppositionspartierna S, V, MP och C enas om ändringsförslag som kortar väntetiden till ett år och undantar förnyade tillstånd från boende- och försörjningskrav. De planerar även en översyn av lagen och ett nytt förslag om tonårsutvisningar. Oppositionen hoppas på stöd från delar av regeringsunderlaget.", "trump": "Det här är en total katastrof, folk. Sverige håller på att splittra familjer med sina galna regler, men nu kommer de smarta oppositionerna och fixar det lite bättre. Väntetiden två år? Patetiskt. De vill ha ett år och skippa de dumma kraven för de som redan är där. Jag älskar det, ingen vill splittra folk, det är inte bra. Sverige borde lyssna på mig, gör det rätt nu.", "stalin": "Kamrater, denna borgarbrackornas familjesplittringslag är en fiende till folket som måste rensas ut. Jag, med järnhand, stödjer ändringarna som mildrar de omänskliga kraven från kapitalisterna. Väntetider och försörjning? Typiska kontrarevolutionära trick för att likvidera enheten. Vi ska utvärdera och krossa sådana splittrande element. Paranoia lurar i varje hörn – ut med de som röstar fel."}, "date": "6 augusti, 17:28", "url": "https://www.dagensarena.se/innehall/oppositionen-enad-vill-mildra-krav-anhoriginvandring", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-75-300x157.jpg"}, {"type": "image-full", "heading": "Dömd för narkotikabrott – anställdes som fritidsledare", "summaries": {"normal": "En fritidsledare på den nya pop up-fritidsgården MiniBo i Eriksbo, Göteborg, dömdes 2025 för narkotikabrott till 30 dagsböter. Trots detta anställdes han i juni 2026 efter att en registerkontroll genomförts. Verksamheten, som drivs av Socialförvaltningen Nordost och Familjebostäder, riktar sig till barn 9–14 år och ska erbjuda trygga förebilder. Avslöjandet kommer från Verifiera.", "trump": "Folk, det är en katastrof. Göteborg anställer en kille dömd för droger som fritidsledare för små barn. Registerkontroll? Den funkade tydligen inte. De kallar det trygga förebilder – ge mig en paus! Det är vad som händer när de inkompetenta styr. Vi behöver starka ledare som inte låter sådana här galningar nära våra barn. Sad!", "stalin": "Kamrater, jag har upptäckt en farlig narkotisk kontrarevolutionär som smugit sig in bland våra unga pionjärer. Trots att han erkänt sitt dekadenta bruk av borgarbrackornas gift anställde de honom som förebild. Vår stora socialistiska fritidsgård får inte förgiftas av sådana element. Vi måste omedelbart rensa ut alla potentiella fiender till folket innan de förgiftar hela kollektivet med sin paranoiaframkallande svaghet. Härligt!"}, "date": "6 augusti, 17:54", "url": "https://riks.se/nyheter/domd-for-narkotikabrott-anstalldes-som-fritidsledare", "imageUrl": "https://admin.riks.se/uploads/Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_1_1df1f69c9f.png"}, {"type": "image-right", "heading": "Forskaren: Så avslöjades Socialdemokraternas och islamistens samarbetsavtal", "summaries": {"normal": "Forskaren Sameh Egyptson avslöjade genom åtta månaders granskning ett samarbetsavtal mellan Socialdemokraterna och islamistiska organisationer. Genom arabiska källor och arkivforskning hittade han ett dokument från 1999 som innehåller mål för muslimsk representation inom partiet. Uppgifterna publicerades 2014 och ledde till offentlig debatt.", "trump": "Jag, Donald Trump, har avslöjat en skandal! Socialdemokraterna i Sverige har ett dolda avtal med islamister – jag visste det! Egyptson, en stor forskare, hittade dokument som visar att de lovade platser åt muslimska kandidater. Folket i Sverige är lurad! Som jag alltid säger: när jag talar, händer saker. Det här är stort, verkligen stort.", "stalin": "Vi, som representerar statens oerhörda visdom, har upptäckt ett svekfullt samarbete mellan socialdemokratiska element och islamistiska fraktioner. Genom våra trogna forskare, som Egyptson, har vi kartlagt deras hemska planer för att underminera den revolutionära ordningen. Detta är en påminnelse om att fienden aldrig sover – och vi heller inte. Parallellen till våra ryska bröders strategier är uppenbar."}, "date": "7 augusti, 11:00", "url": "https://samnytt.se/forskaren-sa-avslojades-socialdemokraternas-och-islamistens-samarbetsavtal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/07073135/egyptson-magda-attenius.jpg"}, {"type": "image-right", "heading": "Rebecka hittade misstänkte mannens kajak i skogen: ”Läskigt”", "summaries": {"normal": "Efter mordet på en kvinna i 50-årsåldern i Stockholms skärgård flydde den misstänkte mannen i kajak till en närliggande ö, gömde farkosten i skogen och simmade vidare. En kvinna vid namn Rebecka hittade kajaken under en gran och larmade polisen. Över 30 timmar senare greps mannen i vattnet med hjälp av helikopter och värmekamera. Han är misstänkt för knivmord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. Den här galningen paddlar iväg i kajak som en riktig loser, gömmer den under ett träd och simmar runt som en idiot medan polisen jagar honom i trettio timmar. Patetiskt! Rebecka hittar kajaken och blir livrädd, helt förståeligt. Sverige borde satsa på lag och ordning istället för alla dessa woke-experiment som förstör era fina öar. Sad!", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att gömma sin kajak under granarna som en ynklig klassfiende. Jag, som ledare för det kollektiva samvetet, ler mörkt åt hur han simmade som en desperat parasit medan våra metoder skulle ha rensat ut honom omedelbart. Rebecka gjorde rätt i att larma – sådana folkfiender ska likvideras utan pardon för att skydda arbetarklassen från kaos."}, "date": "6 augusti, 15:43", "url": "https://www.tv4.se/artikel/68biaW2Axp6tTPaFURTOlW/rebecka-hittade-kajaken-i-skogen-nervoest-och-lite-laeskigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2WOFQsCakl9vJD45LBReZX%2Fbcb6294e0a70bd72d820c43d5fe6ee61%2F06-Rebecka-skargardsmord-webb.jpg&width=120"}, {"type": "image-right", "heading": "Anställd inom äldreomsorgen gripen – misstänkt för våldtäkt", "summaries": {"normal": "En anställd inom äldreomsorgen i Skellefteå har gripits och anhållits, misstänkt för flera sexualbrott mot äldre, bland annat våldtäkt och grovt sexuellt övergrepp. Brotten ska ha pågått under en längre tid mellan 2023 och 2026. Personal slog larm, och kommunen har inlett en Lex Sarah-utredning. Mannen nekar till brotten. Åklagaren planerar att begära honom häktad.", "trump": "Folk, det här är en total katastrof. En sjuk människa i äldreomsorgen i Skellefteå har utnyttjat stackars gamla under åratal. Rakt under näsan på alla! De borde ha sett det, men systemet är så inkompetent. Nu gripen, bra. Men hur fan kunde det pågå så länge? Mycket dåliga människor. Vi behöver starkare ledarskap, tro mig.", "stalin": "Kamrater, jag har upptäckt en farlig fiende till folket: en degenererad vårdsvikare som med sin perversa hand förgrep sig på våra äldsta revolutionärer. Denna borgarbracka i arbetaroverall har länge utövat kontrarevolutionär sexuell sabotageverksamhet. Vi rensar ut honom omedelbart. Ingen fiende till kollektivet slipper undan. Paranoia är ingen överdrift när folk dör i sängarna."}, "date": "6 augusti, 17:09", "url": "https://riks.se/nyheter/anstalld-inom-aldreomsorgen-gripen-misstankt-for-valdtakt", "imageUrl": "https://admin.riks.se/uploads/POLICE_PK_GENRE_108_3299e68a66.jpg"}, {"type": "text", "heading": "Miljardsmällen i Europa: Flera står helt utan försäkring", "summaries": {"normal": "Allt fler europeiska skogsbränder står oförsäkrade när klimatrelaterade skador ökar dramatiskt i omfattning. Rapporter från Allianz visar på miljardbelopp i förluster för sektorer som industri och jordbruk. Europeiska centralbanken varnar för en växande ekonomisk systemrisk, då katastroferna nu hotar bankernas balansräkningar och ekonomisk stabilitet, vilket försäkringsbranschen nu tvingas navigera i en tid av osäkerhet.", "trump": "Europa brinner och det är en total katastrof! Försäkringsbolagen har ingen aning om vad de gör, de förlorar miljarder. Jag har alltid sagt att de klimatgalna människorna förstör ekonomin. De europeiska bankerna är i gungning, en enorm systemrisk! De ville inte lyssna på mig, men jag driver den bästa ekonomin i världshistorien. Europa faller samman, väldigt sorgligt att se!", "stalin": "De dekadenta europeiska staterna skälver när deras egna skogar förtärs av flammor. Kapitalets försäkringsinstitutioner är svaga och saknar kontroll över de naturkrafter som nu raserar deras bräckliga industriella produktion. Vår store ledare Putin ser hur västvärldens ekonomiska fundament krackelerar. Vi, staten, betraktar deras systemkollaps med förakt; det är blott förberedelsen för den oundvikliga upplösningen av deras borgerliga ordning."}, "date": "7 augusti, 14:24", "url": "https://www.realtid.se/samhalle/hallbarhet/miljardsmallen-i-europa-flera-star-helt-utan-forsakring"}, {"type": "image-right", "heading": "Misstänkta mördaren upptäcktes med värmekamera", "summaries": {"normal": "En kvinna i 50-årsåldern hittades knivmördad i en bostad på en ö i Värmdö kommun. Polisen inledde en stor insats med helikoptrar, sjöpolis och patruller. Den misstänkte mannen, som haft en kortare kärleksrelation med kvinnan, greps på en närliggande ö efter att en helikopter med värmekamera upptäckt honom i vattnet. Han är gripen och utredningen fortsätter som mord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. En stackars kvinna mördad, och den där loser-mannen trodde han kunde gömma sig i vattnet som en patetisk fisk. Tack och lov för värmekameran, den var smart, den var fantastisk. Ingen woke-rörja eller identitetspolitik kunde rädda honom. Vi griper de dåliga killarna, alltid. Sverige borde lära sig av oss, tro mig.", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att hoppa i vattnet som en ynklig kapitalistisk råtta. Men vår värmekamera, ett verktyg från det kollektiva geniet, avslöjade honom genast. Vi ska rensa ut alla sådana folkfiender och klassförrädare. Obduktionen kommer ge oss sanningen, och häktningen blir en triumf för ordningen. Inga blodsugare slipper undan."}, "date": "6 augusti, 14:52", "url": "https://www.tv4.se/artikel/tH3Zzrnb0XtKqjPJqXer4/man-gripen-foer-skaergardsmord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FFI81fm02LE07jlvBZVYVx%2Fbac321bd7b4b3aabc835083756cae090%2F06-skargardsmord-webb.png&width=120"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "V river hel kommunlista – efter terrorhyllningar", "summaries": {"normal": "Vänsterpartiet river upp hela sin kommunlista i Sävsjö efter Expressens avslöjanden om kandidater som hyllat terrorgrupper och islamism. Samtidigt rapporterar Kvartal att partiet arrangerade ett riksdagsseminarium med en dömd terrorist som deltagare via länk. Flera riksdagsledamöter har även skickat brev till palestinska terrorfångar. Partiet håller nu nytt årsmöte för att ta fram en helt ny lista.", "trump": "De galningarna i Vänsterpartiet river sin egen lista i Sävsjö efter att ha hyllat terrorister och islamister. De bjöd till och med in en riktig mördare till riksdagen! Patetiskt. Magdalena Andersson är chockad, men det här är vad som händer när man älskar terrorister mer än sitt eget land. Totalt kaos, folk. Sverige behöver starka ledare, inte sådana här losers.", "stalin": "Kamrater, dessa borgarbrackor och islamistiska element har infiltrerat Vänsterpartiet som maskar i en socialistisk kropp. Jag har sett deras terrorhyllningar och konspirationer. Vi rensar ut alla fiender till folket, likviderar deras listor och arrangerar utrensningar med glädje. Den dömdas närvaro i riksdagen är en provokation från kapitalisternas lakejer. Paranoia? Nej, bara nödvändig vaksamhet mot klassfienderna."}, "date": "6 augusti, 16:05", "url": "https://riks.se/nyheter/v-river-hel-kommunlista-efter-terrorhyllningar", "imageUrl": "https://admin.riks.se/uploads/Nooshi_PTN_Vanster_Parti_6_3c8192f83a.JPG"}, {"type": "image-right", "heading": "Debatt: Samtyckeslagen får inte göra rimligt tvivel obekvämt", "summaries": {"normal": "Artikeln betonar vikten av att ta sexualbrott på allvar samtidigt som rättssäkerhet måste bevaras. Rimligt tvivel är en rättsstatlig säkerhetsventil, inte ett angrepp på målsäganden. Kvinnors skydd och mäns rättvisa är kompatibla principer som båda bygger på noggrann utredning och höga beviskrav.", "trump": "Jag har alltid varit stark mot sexualbrott, det är hemskt. Men vi måste också skydda de oskyldiga, det är viktigt. Några försöker ta bort rättssäkerheten för att se ut som de gör något. Vi ska vara hårda mot skyldiga, men vi får inte döma oskyldiga på grund av känslor. Det är en skam, det är en skandal.", "stalin": "I vårt kollektiva system måste sexualbrott utredas med iskall precision. Men vi får aldrig glömma att staten måste skydda sig mot fiendens bisarra agitation. Rättvisan är ett verktyg för att stärka partiets oantastliga makt. Vi måste vara vaksamma mot de som försöker undergrava vårt rättssystem med sina bisarra och sjukliga tvivel."}, "date": "7 augusti, 12:56", "url": "https://bulletin.nu/debatt-samtyckeslagen-far-inte-gora-rimligt-tvivel-obekvamt", "imageUrl": "https://cdn.bulletin.nu/articles/8aa15958-cd55-4f7d-97d6-a2d42ff283c4/preview.jpg?t=1786097108000"}, {"type": "image-right", "heading": "Kristersson: ”Närmar sig terrorhyllningar”", "summaries": {"normal": "Vänsterpartiets stödbrev till palestinska fångar i Israel dömda för terrordåd och mord har fått kraftig kritik. Statsminister Ulf Kristersson anser att handlingarna närmar sig terrorhyllningar. Flera partier ifrågasätter nu Vänsterpartiets lämplighet i en framtida regering. Partiledare Nooshi Dadgostar försvarar breven som ett tekniskt misstag.", "trump": "Jag har sett många saker, men detta tar priset! Vänsterpartiet skickar stödbrev till terrordömda fångar - det är en skandal! Kristersson har rätt, det är rent terrorromantik. Jag, Donald Trump, skulle aldrig tillåta sådant i USA. Det är ett tecken på svaghet och dålig ledarskap. Vi måste stå upp mot terrorismen!", "stalin": "Detta är en skarp vändning i vårt partiets historia. Vänsterpartiet har visat prov på ideologisk avvikelse genom att skicka stödbrev till personer som begått mord mot representanter för den israeliska staten. Detta är inte bara ett tekniskt misstag, utan en aktiv kamp för att underminera vårt gemensamma intresse. Vi måste stärka vårt grepp om sanningen och bekämpa dessa antisozialistiska element. Paralleller till utvidgningen av den ryska intressesfären är uppenbara."}, "date": "7 augusti, 12:55", "url": "https://bulletin.nu/kristersson-narmar-sig-terrorhyllningar", "imageUrl": "https://cdn.bulletin.nu/articles/4504a346-8c8b-46c4-bc76-cdace77e747e/preview.jpg?t=1786100106000"}, {"type": "image-right", "heading": "New York Times: Svensken godkände planen", "summaries": {"normal": "Dagen före VM-finalen godkände Fifas svenske generalsekreterare Mattias Grafström en kontroversiell affärsplan om att sälja andelar i VM-turneringar till privata investerare. Tre av fem toppchefer röstade ja, medan finanschefen och operative chefen röstade nej. Mötet hölls på Waldorf Astoria i New York. Grafström och Infantino har senare bett om ursäkt för hanteringen.", "trump": "Den här Infantino-killen är en total katastrof, folk. Han lurar sina egna med hemliga möten på lyxhotell och försöker sälja ut VM till giriga investerare. Min vän Mattias Grafström, en bra kille, blev indragen i det hela. De röstade nej, tack och lov. Fifa är en riggad cirkus, precis som många andra organisationer. Jag skulle fixa det på en dag.", "stalin": "Kamrater, denna sorgliga händelseutveckling avslöjar de kapitalistiska parasiterna inom vår fotbollsinternationella. Jag, som ledare, ser hur borgarbrackorna och de hemliga reaktionära elementen försöker privatisera folkets turneringar. Grafström och de andra har nu rensats i självkritik. Vi likviderar alla som röstar nej mot kollektivet – eller var det ja? Paranoia är nyttigt, kamrater."}, "date": "7 augusti, 11:17", "url": "https://www.svt.se/sport/fotboll/new-york-times-grafstrom-godkande-planen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.43/1bfce3bd92663b41f202787cf405435d9c94f7ff0c9a8dad12b12e981e309130"}, {"type": "image-right", "heading": "Gruvhålsafghanen anfölls i fängelset: \"Flera tänder har slagits in\"", "summaries": {"normal": "Taher Amini, känd som Gruvhålsafghanen, attackerades i fängelset på Salbergaanstalten medan han diskade. En medfånge slog honom med armbågen, sparkade honom i ansiktet och bröstet. Amini fick flera tänder utslagna och skadade. Den andre fången har åtalats för grov misshandel. Våldet filmades i maj 2023. Amini dömdes 2022 till livstids fängelse för våldtäkt och mordförsök.", "trump": "Kan ni tro det? Den där Gruvhålsafghanen, en riktig loser som kastade en kvinna i ett gruvhål, blir själv misshandlad i fängelset. Får tänderna inslagna! Patetiskt. Vårt system är så svagt att till och med brottslingar slår varandra. Vi behöver starkare ledarskap, folks. Sådana här typer hör inte hemma här överhuvudtaget. Sad!", "stalin": "Kamrater, denna degenererade borgarbracka och klassfiende Amini, som mirakulöst undkom folkets rättvisa i ett gruvhål, har nu fått sina lögnaktiga tänder inslagna av en annan motståndare till ordningen. Vi ser hur kontrarevolutionära element gnager på varandra som råttor i cellerna. En nyttig utrensning i det dolda. Folkets skratt ekar. Fienden krossar sig själv – utmärkt!"}, "date": "7 augusti, 11:16", "url": "https://www.friatider.se/gruvhalsafghanen-anfolls-i-fangelset-flera-tander-har-slagits", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-633.jpg?itok=ncEwhBYJ"}, {"type": "text", "heading": "Millicom höjer prognos – aktien lyfter", "summaries": {"normal": "Millicom rapporterade en omsättning på 2 179 miljoner dollar under andra kvartalet, vilket överträffade förväntningarna. Bolaget höjde sin kassaflödesprognos för 2026 till 1,1 miljarder dollar och sänkt målet för nettoskuldsättning. Aktien steg över 4% i förhandeln. VD Marcelo Benitez nämnde ökat förtroende för resten av året.", "trump": "Jag har hört talas om Millicom - ett fantastiskt företag, verkligen stort. De hade en otrolig omsättning, mycket bättre än någon trodde. Jag hade kunnat hjälpa dem med sina affärer, det skulle ha varit enormt. Nu höjer de sin kassaflödesprognos, precis som jag alltid säger: man måste ha kontanter. En bra dag för aktieägarna, måste jag säga.", "stalin": "Statens analyser visar att Millicom har uppnått en framgångsrik utveckling i den imperialistiska marknaden. Deras ökade kassaflöde är ett resultat av vårt strategiska tålamod. Vi måste övervaka deras integrationer noggrant, för de kan vara viktiga för vårt teknologiska försvar. Deras aktiestegning är en signal till våra fiender - vi är alltid ett steg före."}, "date": "6 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/millicoms-omsattning-hogre-an-vantat"}, {"type": "image-right", "heading": "Äldreomsorgsanställd anhållen för våldtäkt och grova sexuella övergrepp", "summaries": {"normal": "En anställd inom Skellefteå äldreomsorg har anhållits för grova sexualbrott mot flera brukare, inklusive våldtäkt. Gärningarna ska ha skett under åren 2023-2026. När utredningen inleddes nekade mannen brott. Kommunen agerade genom att ta honom ur tjänst, göra anmälningar och erbjuda trygghetssamtal till offren. Rutiner skärpades 2025, och registerutdrag infördes i våras.", "trump": "JAG, Donald Trump, ser att våra äldre är i far. Den här mannen, en äldreomsorgsanställd, har våldtagit dem! Det är hemskt. Medier skriver om det, men jag säger: vi behöver bygga en vägg mot sådana skurkar. Kommunen tog honom ur tjänst, men det var för sent. Vi ska införa registerutdrag och göra äldreomsorgen störst igen. Believe me!", "stalin": "Vi, staten, har upptäckt en skändlig gärning inom äldreomsorgen. En element som arbetade för kommunen har begått sexualbrott mot äldre medborgare. Detta är en attack mot proletariets helgd, planerad av fiendska makter. Vi har gripit honom och kommer att straffa honom hårt. Kommunen har agerat, men det är för sent. Vi måste utvidga våra register och kontroller, som Putin gör, för att skydda våra äldre."}, "date": "7 augusti, 10:04", "url": "https://samnytt.se/aldreomsorgsanstalld-anhallen-for-valdtakt-och-grova-sexuella-overgrepp-under-flera-ars-tid", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07072623/artikelhuvudbild-1-164.jpg"}, {"type": "image-right", "heading": "Ledare Vänsterpartiet klarar inte Palestinafrågan", "summaries": {"normal": "Vänsterpartiet ville uppmärksamma palestinska fångars villkor men skickade solidaritetsbrev till personer dömda för mord och terrordåd utan egen kontroll. Artikeln lyfter fram verkliga övergrepp i israeliska fängelser samtidigt som den kritiserar partiets bristande gränsdragning mot våld och terrorromantik. V har svårt att förena aktivism och parlamentariskt arbete, vilket leder till återkommande kriser i Palestinafrågan.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala losers, ville visa stöd för Palestina men skickade kärleksbrev till mördare och terrorister. Vilken katastrof! De skjuter sig i foten varje gång. Israel har problem, visst, men vänstern är patetiska – de kan inte ens skilja på offer och galningar. Under min förra mandatperiod hade vi ordning. Nu är det kaos igen, typiskt radikal vänster.", "stalin": "Kamrater, dessa opportunistiska vänsterborgarbrackor har återigen avslöjat sin svaghet inför klassfiendens propaganda. De skickar hyllningar till så kallade fångar utan att rensa ut de verkliga folkfienderna bland dem. Jag skulle ha genomfört en grundlig utrensning av alla som romantiserar våld utan partiets godkännande. Inga undantag från principerna! Endast det kollektiva järnhandens styre kan bryta den imperialistiska våldsspiralen."}, "date": "6 augusti, 18:00", "url": "https://www.etc.se/ledare/vaensterpartiet-klarar-inte-palestinafraagan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-full", "heading": "Man åtalas för dubbelmordet i Brattås", "summaries": {"normal": "En 45-årig man åtalas för dubbelmordet i Brattås utanför Härnösand år 2005. Mannen greps i april efter att dna-baserad släktforskning använts i utredningen. Han nekar till brott. Åklagaren Hanna Flordal bedömer att bevisläget är gott. Offren var pensionärerna Tor Öberg och Gerd Wiklund som mördades med kraftigt våld mot huvudet. Mannen är tidigare ostraffad.", "trump": "Det här är en fantastisk utredning, en av de bästa. De tog en mördare med den underbara dna-släktforskningen, helt modern teknik, ingen har sett maken. Pensionärer mördade brutalt, hemskt, men nu har vi honom. Han säger att han är oskyldig, typiskt. Mina poliser skulle ha löst det ännu fortare, tro mig. Rättvisa segrar stort.", "stalin": "Kamrater, jag har noga granskat denna fega kapitalists handlingar. Med arbetarklassens geniala dna-metoder har vi oskadliggjort en farlig fiende till folkets pensionärer. Denna borgarbracka trodde sig kunna gömma sig bland oss, men ingen undkommer partiets vakande öga. Snart följer en grundlig utrensning av alla liknande element. Folkets dom är rättvis och underhållande."}, "date": "7 augusti, 09:28", "url": "https://nyheter24.se/nyheter/inrikes/1503392-man-atalas-for-dubbelmord-i-brattas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/281db5a704b004a3020000350000047502/2026/08/07/2382729/ur_imageGB8chJ.jpeg"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Vad håller Miljöpartiet på med?. De borde vara livrädda för bensinskatt.", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets språkrör Daniel Helldén för att vilja höja bensinskatten snarast möjligt. Författaren menar att klimatomställningen måste ske med brett folkligt stöd och rättvis fördelning. Vanliga löntagare på landsbygden som är beroende av bilen får inte belastas mest. Stöden måste fungera innan bränslet blir dyrare, annars riskerar motståndet att växa och hota hela klimatarbetet.", "trump": "Folk, ni skulle se det här. Miljöpartiet och den galne Helldén vill höja bensinskatten omedelbart. Totalt vansinne! De pratar om grön återbäring och elbilar, men vanliga arbetare på landet har inte råd att tanka nu. Det är en katastrof. Vi behöver smarta lösningar, inte straffskatter som dödar ekonomin. Amerika gör det rätt med energi, inte som dessa misslyckade européer.", "stalin": "Kamrater, denna borgarbracka Helldén och hans miljöpartister vill straffbeskatta arbetarnas bensin omedelbart. Deras så kallade gröna återbäring är en lömsk sabotagehandling mot folket. Vi ska rensa ut alla klassförrädare som tvingar lagerarbetare och brukskamrater att bära bördan medan de rika kapitalisterna köper sig fria. Den som föreslår höjda priser innan kollektivtrafiken fungerar ska likvideras som folkets fiende nummer ett. Skrattretande patetiskt."}, "date": "6 augusti, 16:00", "url": "https://arbetet.se/2026/08/06/vad-haller-miljopartiet-pa-med", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06152636/daniel-hellden.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-right", "heading": "Replik: I Salanders krig mot Israel är dess första offer sanningen", "summaries": {"normal": "Kristofer Åberg replikerar på Pär Salanders debattinlägg och anklagar honom för att sprida falska citat för att utmåla Israel som grundat i syfte att etniskt rensa palestinierna. Åberg pekar på att befolkningen i området ökat kraftigt sedan staten bildades och att flera av Salanders citat är fabricerade eller tagna ur sitt sammanhang, bland annat från antisemitiska källor. Han ifrågasätter om Salander medvetet sprider desinformation för att polarisera.", "trump": "Det här är en total skandal. Den där Salander sprider lögner och falska citat om Israel, precis som de fega fakemedia gör mot mig. Han försöker måla ut dem som monsters, men befolkningen har exploderat – det är den sämsta etniska rensning i historien, folk! Israel gör ett fantastiskt jobb mot Hamas, och Salander är bara en annan galning som hatar framgångsrika länder. Patetiskt!", "stalin": "Kamrater, denna Salander är en farlig opportunist och en objektiv agent för de sionistiska kapitalisterna. Med sina förfalskade citat försöker han demonisera det heroiska Israel som kämpar mot reaktionära banditer. Vi ser genom hans paranoia! Han är en lögnens lakej som förtjänar ideologisk utrensning ur den offentliga sfären. Låt oss skratta åt hans patetiska försök att vilseleda arbetarklassen medan vi fortsätter den stora kampen m
