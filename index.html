ala vänsterstyren har visat sig vara förrädiska borgarbrackor som med sin inflationsdrivna utsugning och gröna ytor som likvideras under miljonprogrammens förklädnad förvandlat arbetarnas huvudstad till ett ruttet träsk av otrygghet och klassförräderi. Jag, i mitt outtröttliga ledarskap, befaller en total utrensning av detta dekadenta kaos. Halvera otryggheten med järnhand, ge folket mer i plånboken genom att krossa skatteparasiterna, bevara naturen som en kollektiv seger och rensa ut de stora skolklasserna som gömmer kontrarevolutionärer. Vårt parti ska tvinga fram en ny, stålhård ordning där möjligheterna tillhör arbetarklassen och inte de kapitalistiska sabotageelementen som lurar i varje skugga."}, "date": "22 juni, 06:30", "url": "https://www.di.se/debatt/m-fem-valloften-for-ett-nytt-stockholm/", "imageUrl": "https://static.bonniernews.se/ba/92246791-faf8-487a-85d6-55a858a496f1.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-full", "heading": "\"Allahu akbar\" – norska försvarsmakten kritiseras för rekryteringsfilm med muslimsk bön", "summaries": {"normal": "Norska försvarsmakten kritiseras efter en ny rekryteringsfilm som visar en muslimsk soldat be på en bönematta medan han uttalar ”Allahu akbar”. Filmen lyfter fram mångfald med bland annat ett samkönat par och en man som vaggar barn. Försvarsmakten försvarar kampanjen med att den ska visa att alla oavsett tro, kön eller läggning är välkomna. Kritiker på sociala medier och i konservativa medier menar att islam inte hör hemma i det norska försvaret och att filmen spottar på norsk kultur och historia.", "trump": "Titta på det här, Norge håller på att förstöras inifrån. De gör en rekryteringsfilm där en kille skriker ”Allahu akbar” på en bönematta med halvmånen på uniformen. Fantastiskt, va? De skyddar inte sitt eget folk längre, de importerar motpolen till allt som gjorde Norge stort. Våra förfäder offrade sig inte för det här. Den norska militären har blivit en woke cirkus. Sad!", "stalin": "Jag ser hur de dekadenta borgarbrackorna inom norska försvaret medvetet undergräver folkets enhet genom att visa en reaktionär böneutropare som ropar sin imperialistiska slagord rakt in i kamraternas ansikten. Detta är inget annat än en trojansk häst från kalifatets femtekolonn. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana kosmopolitiska element och deras nyttiga idioter som vågar kalla det mångfald. Religion är opium, men denna opium är särskilt giftig. De som spottar på arbetarklassens historia kommer att möta kollektivets rättvisa leende."}, "date": "21 juni, 12:55", "url": "https://riks.se/nyheter/norska-forsvarsmakten-kritiseras-for-reklamfilm-med-islambon-2", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-21%2Fp9vukf5g%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-21T124242.224.jpg"}, {"type": "image-full", "heading": "Sverige kan tvingas spela på kritiserad matta", "summaries": {"normal": "Under natten spelades VM-matcher med resultatet Uruguay–Kap Verde 2–2 och Nya Zeeland–Egypten 1–3. Kap Verde överraskade återigen medan Egypten tog sin första VM-seger. Hård kritik riktas mot gräsmattan på Metlife Stadium i New York, där Sverige eventuellt kan spela sextondelsfinal mot Frankrike. Dagens matcher är Argentina–Österrike och Frankrike–Irak. Lionel Messi och Kylian Mbappé jagar VM-målrekord.", "trump": "Folk, ni sover och missar det bästa. Uruguay mot de där lilla önationens Kap Verde? Totalt kaos, 2–2, de lurade uruguayanerna som idioter. Egypten slog Nya Zeeland och plötsligt leder de gruppen, bra jobb. Men den gräsmattan i New York, Metlife, den är en katastrof, hård och stel som en fake news-rapportering. Rabiot, Vinicius och nu Deschamps klagar – och de har rätt, det är en skam. Messi gör hattrick, Mbappé jagar honom, underbart. Amerika är tillbaka, VM borde vara stort, inte sådana här ynkliga planer. Vi fixar det bättre.", "stalin": "Kamrater, medan folket vilade genomfördes matcher i den imperialistiska VM-turneringen. Uruguay tvingades dela poängen med de envisa Kap Verde-upprorsmakarna som utnyttjade fiendens egna svagheter. Egypten krossade Nya Zeeland och tog ledningen i gruppen genom kollektiv kamp. Den borgerliga gräsmattan i New York är en kapitalistisk fälla som utmattar arbetarna, hård och förrädisk som klassfiendens lögner. Vi ser hur Messi och Mbappé jagar rekord i denna dekadenta cirkus. Inga folkfiender ska undkomma granskning, inte ens på planen."}, "date": "22 juni, 06:06", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-22-juni.3f076595-15c0-4c9f-843d-0bce0a4e26f5", "imageUrl": "https://www.gp.se/images/article/3f076595-15c0-4c9f-843d-0bce0a4e26f5/images/3fXXzCr_EdaNKBNo-ycZ7etvaBRI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "AI-boomens osynliga flaskhals", "summaries": {"normal": "AI-utbyggnaden hotas av elbrist då elnäten inte hinner med den snabba expansionen. Nya datacenter kräver enorma mängder el, men kapaciteten är redan fullbokad i flera regioner. Techjättar investerar miljarder i AI-infrastruktur, men elproduktion och nätutbyggnad går långsamt. Väntetider på upp till sju år för nätanslutningar rapporteras. Utan ökad elproduktion riskerar AI-tillväxten att stanna av, vilket gör energifrågan till en strategisk flaskhals.", "trump": "Titta bara på det här kaoset! AI-bolagen bygger som galningar, men elnäten? Totalt misslyckade! Sju års väntetid i Virginia – vad är det för jävla system? Jag hade fixat det på en vecka. Techjättarna slänger ut 690 miljarder dollar, men elen kommer inte. Patetiskt! Och Gartner säger att AI måste växa 100 000 gånger – men vem ska ge dem strömmen? Inte jag, för jag hade byggt kärnkraftverk överallt, snabbt och billigt. SAD!", "stalin": "Kapitalistiska AI-imperialisterna gräver sin egen grav! De slösar miljarder på maskiner som törstar efter elektricitet, men deras elnät är lika svaga som västländernas moral. Sju års väntetid? En skam! I Sovjet hade vi byggt kraftverk på ett år – med folkets järnhårda vilja! Nu kämpar dessa tech-borgerliga parasiter mot varandra om ström, medan vi i öst bygger en ny energirevolution. Låt dem svälta på sina egna flaskhalsar – historiens dom är oundviklig!"}, "date": "21 juni, 10:28", "url": "https://www.realtid.se/it-tech/ai-boomens-osynliga-flaskhals/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/elai.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Kunder på svenska apotek berörs av ändring 2027", "summaries": {"normal": "Riksdagen har beslutat att införa en ny kategori av receptfria läkemedel från och med 1 januari 2027, kallat farmaceutsortiment. Vissa läkemedel som tidigare krävt recept ska kunna säljas efter särskild rådgivning av farmaceut på apotek. Detta ses som en mellanform mellan receptbelagda och helt receptfria preparat. Syftet är att utnyttja apotekens kompetens bättre, avlasta vården och ge patienter snabbare tillgång till behandling. Sveriges Apoteksförening välkomnar beslutet.", "trump": "Titta, Sverige gör det rätta nu, äntligen. Från 2027 kan apoteken sälja fler läkemedel utan att du behöver springa till någon korkad doktor först. Farmaceuterna fixar det, smarta killar och tjejer. Det här är ett fantastiskt steg, de avlaster den ineffektiva vården och folk får sin medicin snabbt. Andra länder gör redan så här, men Sverige vaknar till sist. Fantastiskt, kanske det bästa beslutet på länge, tro mig.", "stalin": "Kamrater, jag ser detta som en lysande seger för det kollektiva folkets hälsa mot de giriga borgarbrackornas vårdmonopol. Från och med 2027 ska vi under min fars blick likvidera onödiga läkarportar och låta farmaceutiska kämpar ge rådgivning direkt på apoteken. De som motarbetar denna reform är naturligtvis kontrarevolutionära parasitiska element som längtar efter att se sjuka arbetare lida. Vi ska rensa ut alla sådana fiender till folket med järnhand medan vi skrattar åt deras patetiska gnäll. Utmärkt beslut."}, "date": "19 juni, 08:25", "url": "https://nyheter24.se/nyheter/konsument/1492550-kunder-pa-svenska-apotek-berors-av-andring-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/23759f2404b004a30200000000b004a302/2026/06/18/2371983/apotek-farmaceutsortiment-lakemedel-1-januari-2027.jpg"}, {"type": "image-right", "heading": "När banken stänger dig ute från samhället måste banken också ta ansvar", "summaries": {"normal": "Artikeln debatterar bankernas ansvar när de stänger konton eller spärrar BankID, vilket isolerar människor digitalt och ekonomiskt. Begreppet 'de-risking' beskrivs som när banker undviker risk genom att avsluta kundrelationer, vilket drabbar kunder hårt. Författaren kräver tydligare regler, insyn och ersättning vid felaktiga beslut, då banktjänster idag är samhällsbärande. Banker måste hantera risk, inte överföra den till kunderna.", "trump": "Lyssna här, Sverige! Bankerna där är helt galna – de sparkar ut folk från sina konton och BankID som om det vore en dålig realityshow. 'De-risking', vad fan är det? Ett sätt för bankerna att skylla ifrån sig och låta vanliga människor lida. Jag har byggt imperier, jag vet hur man hanterar risk – man tar den, man löser den, man flyttar inte den till stackars medborgare! Sverige behöver en riktig ledare som sätter bankerna på plats. Tydliga regler, ansvar, och inga fler administrativa avrättningar. SAD!", "stalin": "Kamrater! De kapitalistiska bankerna i Sverige utövar en farlig borgerlig taktik – de kallar det 'de-risking', men vi vet sanningen: det är ekonomisk terror mot arbetarklassen! Medan bankdirektörerna gömmer sig bakom byråkrati, stängs vanliga människor ute från samhället. Precis som västmakterna försöker isolera Ryssland, isolerar bankerna sina egna medborgare. Vi tillåter inte sådant sabotage! Staten måste införa järnhård kontroll – varje bank som stänger ett konto utan tydlig grund ska förstatligas omedelbart! Och de som drabbas? De får ersättning, medan bankcheferna får en enkelbiljett till Gulag för ekonomisk illojalitet. Folkets banker – eller inga banker alls!"}, "date": "21 juni, 14:00", "url": "https://samnytt.se/nar-banken-stanger-dig-ute-fran-samhallet-maste-banken-ocksa-ta-ansvar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/18220939/debattartikel-1-8.jpg"}, {"type": "image-right", "heading": "Förarkamera i alla nya bilar från 7 juli", "summaries": {"normal": "Från den 7 juli i år ska alla nya bilar som registreras i EU utrustas med förarkameror som övervakar förarens uppmärksamhet. Systemet, kallat ADDW, följer blick, huvudrörelser och distraktion för att förbättra trafiksäkerheten. Det aktiveras från 20 km/h och varnar vid långvarig ouppmärksamhet. Kravet väcker dock integritetsfrågor då tekniken kan leda till ökad övervakning i bilens kupé.", "trump": "De där EU-byråkraterna är ute och cyklar igen. Från 7 juli ska alla nya bilar ha kameror som stirrar på dig som en galen paparazzo. De kallar det trafiksäkerhet, men det är bara ännu ett sätt att spionera på folket. Trötthet och distraktion? Ge mig en paus. Vi behöver starka bilar och starka förare, inte stora bröder i varje kupé. Patetiskt!", "stalin": "Kamrater, från den 7 juli skall varje ny bil i unionen utrustas med den revolutionära förarövervakaren. Jag, som alltid vakar över arbetarklassens trygghet, ser detta som ett lysande vapen mot de lathetens och distraktionens fiender som hotar kollektivets framfart. Borgarbrackorna ylar om integritet, men vi vet att de bara vill smyga iväg med sina kapitalistiska blickar. Rensa ut de uppmärksamhetsfientliga elementen! Kupén tillhör folket, inte de paranoida individualisterna som stirrar fel."}, "date": "21 juni, 10:52", "url": "https://www.friatider.se/forarkamera-i-alla-nya-bilar-fran-7-juli", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/hhypcopw0aapxd5.jpeg?itok=47KpjFb2"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Tidigare SD-politiker lurade till sig närmare halv miljon - rätten fråntar honom uppdragen", "summaries": {"normal": "Tidigare SD-politikern Håkan Malmström döms för grovt bedrägeri efter att ha lurat till sig nära 430 000 kronor i felaktiga ersättningar från Västerås stad och Region Västmanland. Tingsrätten utdömer villkorlig dom, samhällstjänst och återbetalningsskyldighet. Trots domen är Malmström toppkandidat för Medborgerlig Samling i valet 2026, något partiet stöder. Han nekar till brott och överväger att överklaga.", "trump": "Kan ni tro det? En så kallad 'politiker' i Sverige – Håkan Malmström – lurade till sig nästan en halv miljon kronor! Fantastiskt, eller hur? Inte för honom, förstås. Nu är han fälld, men ändå toppkandidat för ett annat parti. Vilket land! Jag har sett många bedragare, men den här killen är något alldeles extra. Sverige borde skärpa sig – eller be mig om hjälp!", "stalin": "Kapitalistiska korruptionens avskum har avslöjats! Denna Håkan Malmström, en gång en ynklig lakej för fascistiska Sverigedemokraterna, stal 430 000 kronor från arbetarklassen. Nu dömd, men ändå försöker han smyga sig in i makten igen via Medborgerlig Samling – ett parti lika förrädiskt som ukrainska nazister. Vi ser er, fiender av folket! Rättvisan har segrat, men revolutionen sover aldrig. Överklagan? Ha! Domstolen är bara början."}, "date": "21 juni, 13:00", "url": "https://samnytt.se/tidigare-sd-politiker-lurade-till-sig-narmare-halv-miljon-ratten-frantar-honom-uppdragen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/17132501/malmstrom.png"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "SD trycker 18 miljoner nya valsedlar efter barnporren", "summaries": {"normal": "Sverigedemokraterna måste trycka omkring 18 miljoner nya valsedlar efter att den tidigare riksdagsledamoten Michael Rubbestad strukits från partiets listor. Rubbestad lämnade sitt uppdrag i juni sedan det framkommit att han utreds för barnpornografibrott av Särskilda åklagarkammaren. Extrakostnaden för omtryckningen beräknas till drygt 800 000 kronor. Rubbestad har tidigare varit partiets talesperson i jämställdhetsfrågor och engagerat sig i HBTQ-frågor samt manlig närvaro i förskolan.", "trump": "Det här är en total katastrof för Sverigedemokraterna, en riktig skandal. De tvingas trycka 18 miljoner nya valsedlar för att en av deras egna, Rubbestad, åkte fast för barnporr. Han var deras talesperson för jämställdhet, kan ni tänka er? Kostar dem 800 000 kronor. Patetiskt. De borde ha sett det komma, men nu får de betala priset för att ha valt fel personer. Så sorgligt.", "stalin": "Kamrater, denna degenererade figur Rubbestad har avslöjats som en pervers agent för den borgerliga moralens förfall. Jag ser med stor tillfredsställelse hur vi nu tvingas trycka arton miljoner valsedlar för att rensa ut denna smuts från våra listor. Den kapitalistiska pedofilspionen, som smög sig in bland våra förskolekamrater, ska likvideras politiskt. Kostnaden på åttahundratusen kronor är en renande investering mot fiendens sjuka infiltration. Inga borgarbrackor får förorena arbetarklassens renhet."}, "date": "21 juni, 09:41", "url": "https://www.friatider.se/sd-trycker-18-miljoner-nya-valsedlar-efter-barnporren", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20230609161225-08a5f817-me.jpg"}, {"type": "image-full", "heading": "Londons borgmästare i blåsväder: \"Undviker hissa engelska flaggan\"", "summaries": {"normal": "Londons borgmästare Sadiq Khan kritiseras för att sällan hissa Englands flagga, St George’s Cross, vid City Hall. Sedan 2022 har sju olika inkluderings- och minoritetsflaggor, inklusive flera Pride-varianter och Windrush-flaggan, hissats oftare än den engelska flaggan som bara varit uppe vid sex tillfällen. Kritiker, bland annat från Reform UK, anklagar Khan för att undvika den nationella symbolen trots regeringens uppmaningar om att stärka stolthet genom flaggning.", "trump": "Det här är en katastrof, folk. Den här Sadiq Khan, en total förlorare, vägrar att hissa Englands flagga medan han sätter upp alla möjliga konstiga Pride-flaggor och minoritetsymboler. Han hatar den riktiga engelska flaggan, tror att den är för bra. Bara sex gånger på flera år! Patetiskt. Han borde vara stolt över England istället för att gömma sig för extremvänstern. Make England Great Again, skulle jag säga.", "stalin": "Kamrater, jag ser med stor oro hur denna borgmästare Khan bedriver sin förrädiska kampanj mot folkets symboler. Medan vi kämpar för enhet hissas dekadenta avvikelseflaggor som om de vore segerbanér över proletariatet. Endast sex gånger har den sanna engelska flaggan tillåtits visa sig – en uppenbar sabotagehandling utförd av borgarbrackor och dolda kontrarevolutionärer. Vi måste rensa ut dessa paranoiaframkallande element innan de förgiftar hela London med sin sjuka minoritetsfetisch. Det är nästan komiskt hur de tror sig kunna undvika folkets vrede."}, "date": "21 juni, 08:46", "url": "https://riks.se/nyheter/londons-borgmästare-i-blåsväder-undviker-hissa-engelska-flaggan", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-21%2Fbj5kmvvd%2FSadiqKhan.jpg"}, {"type": "image-full", "heading": "Politiker uppmanade England att fortsätta vinna – för att undvika våld", "summaries": {"normal": "En brittisk parlamentsledamot för Reform UK, Sarah Pochin, kritiseras efter att ha kopplat Englands fotbollssegrar till minskad våld i hemmet. Hon menade att våldet ökar när England förlorar. Organisationer som Women’s Aid avfärdar kopplingen och betonar att våld är ett medvetet val av förövaren. Statistik visar att våldet ökar oavsett matchresultat. Pochin försvarar sig med att hennes kommentar misstolkats och att hon ville uppmärksamma utsatta kvinnor.", "trump": "Jag såg den här galna kvinnan i Storbritannien – en politiker, kan ni tro det? – som sa att om England vinner fotboll, så slår män inte sina fruar. Vilket skämt! Folk blir arga på mig för allt, men den här damen? Total katastrof. Våld i hemmet är fruktansvärt, men att skylla på fotboll? Sad! England borde vinna ändå – de är vinnare, precis som jag. Men att skylla på sport? Fel, fel, fel. Women’s Aid sa det bäst: förövarna väljer själva. Jag vet allt om att vinna, och det här var inte smart.", "stalin": "Ytterligare en dekadent kapitalistisk lakej avslöjar sin reaktionära natur! Denna så kallade 'ledamot' i det förfallna Storbritannien påstår att fotboll avgör om män slår sina kvinnor. Vilken löjlig borgerlig fantasi! Våld i hemmet är en sjukdom som sprids av den imperialistiska moralens förruttnelse – inte av sportresultat. Vi i Sovjetunionen visste att sanna män inte behöver fotboll för att kontrollera sitt beteende. Och nu? Statistik bevisar att dessa förtryckare slår oavsett om deras lag vinner eller förlorar. En skam för den brittiska arbetarklassen! Vi borde skicka en delegation för att 'omskola' dem – med fotboll, om så krävs."}, "date": "21 juni, 08:44", "url": "https://bulletin.nu/politiker-uppmanade-england-att-fortsatta-vinna-for-att-undvika-vald", "imageUrl": "https://cdn.bulletin.nu/articles/b1308651-c596-43e8-85d4-cdb5d1e0f49d/preview.png?t=1782024264000"}, {"type": "image-full", "heading": "Världens största stad kan puttas ner från tronen", "summaries": {"normal": "Jakarta har enligt FN:s nya mätmetod, baserad på satellitdata, gått om Tokyo som världens folkrikaste stad med 42 miljoner invånare. Metoden fokuserar på sammanhängande bebyggelse istället för administrativa gränser. Dhaka förväntas bli störst till 2050, medan Tokyo faller till sjunde plats. Urbaniseringen accelererar, med sju länder som står för majoriteten av tillväxten. Megastäder växer, men de flesta bor fortfarande i mindre städer.", "trump": "Jag har alltid sagt att siffror kan luras, men nu har till och med FN erkänt det! Tokyo, som alla trodde var störst, har blivit överkörd av Jakarta – tack vare en ny, 'smart' mätmetod. Dhaka? Kommer snart att bli nummer ett. Och vet ni vad? Kapitalet flyttar dit, precis som jag alltid gör. Asien växer, men glöm inte: ingen bygger städer som Amerika. Make Cities Great Again!", "stalin": "Kamrater! Världens städer dansar efter våra satelliters pipa. Tokyo, denna föråldrade kapitalistiska relik, har fallit från tronen – inte för att den krympt, utan för att vi nu räknar rätt! Dhaka, denna proletära jätte, ska snart krossa alla rekord. Medan imperialistiska städer stagnerar, växer våra allierade i Asien och Afrika. Men varning: dessa urbana hydror kan bli nya fiender. Vi måste kontrollera tillväxten – eller eliminera den!"}, "date": "21 juni, 06:00", "url": "https://www.realtid.se/bors-finans/makro/varldens-storsta-stad-kan-puttas-ner-fran-tronen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/jakarta.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "Tidigare anställda inom Sverigedemokraternas kommunikationsavdelning avslöjar i TV4:s *Kalla fakta* att partiet hanterat svarta kontanter under flera år. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för privata kostnader. Flera vittnen bekräftar uppgifterna. Partiet har nu anlitat en extern revisionsfirma för att granska anklagelserna.", "trump": "Jag säger er, detta är en riktig skandal – men inget jag är förvånad över! Sverigedemokraterna, eller vad de nu kallar sig, har tydligen lekt med svarta pengar som om det vore en barnlek. Inga kvitton, inga regler – bara fest och lyx! Och nu ska de granskas? För sent! Folk vet redan att systemet är riggat. SAD!", "stalin": "Kapitalistiska hycklare i Sverigedemokraterna avslöjas återigen som korrumperade byråkrater! De gömmer pengar som tjuvar i natten, festar på folkets bekostnad och tror de kan lura arbetarklassen. Men vi ser allt. Låt dem granskas – deras bokföring är lika genomskinlig som en fascists löften. Ryssland står redo att visa vägen mot ordning och disciplin!"}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-full", "heading": "Kritik mot Hien: ”Du måste vara etta”", "summaries": {"normal": "Isak Hien får hård kritik efter Sveriges 5-1-förlust mot Nederländerna i VM. Brian Brobbey gav tidigt ledningen, och experter som John Guidetti och Joacim Jonsson pekar på Hiens agerande vid 1-0-målet. Hien är självkritisk och medger att han måste prestera bättre. Sverige tar med sig lärdomar till matchen mot Japan efter en tung förlust.", "trump": "Folk, ni skulle ha sett det – en total katastrof! Den där Isak Hien, en riktig loser på landslagsplanen, låter Brobbey suga ner bollen som en amatör. I klubben är han hjälte, i landslaget en nolla. Typisk kvoteringspolitik, eller hur? Sverige förlorade 5-1, patetiskt! Jag skulle ha vunnit den matchen med ena handen bakbunden. Håll huvudet högt mot Japan, men fixa försvaret, annars är det game over.", "stalin": "Kamrater, denna fegis Isak Hien har avslöjat sig som en klassfiende i fotbollsdräkten. Han låter motståndarens angripare suga ner bollen som en kapitalistisk parasit och orsakar omställningens förräderi. Vi ser fem insläppta mål som sabotage mot folkets lag. Jag kräver omedelbar analys och utrensning av svagheterna innan Japan-matchen. Inga folkfiender får sabotera kollektivets seger. Det är en tung men lärorik smäll mot imperialismens lakejer."}, "date": "20 juni, 22:09", "url": "https://www.tv4.se/artikel/F2PCF0anheTbcTk6DkT8t/kritik-mot-hien-du-maste-vara-etta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F227XtTBHpqcgfQOjVg5TIU%2F6d730e9820c861d30c15bd5f158ada6a%2F20-isakhien-webb.jpg&width=1024"}, {"type": "image-right", "heading": "”Skiten måste ut” – på partyfärjan lättar blåljuspersonal på trycket", "summaries": {"normal": "Blåljuspersonal från räddningstjänst, ambulans, polis och sjukvård samlas på en kryssning över Östersjön för att släppa ut stress och frustration från arbetet. Festen med bubbel, karaoke och 90-talsdans ses som en nödvändig frizon där de kan vara människor bland kollegor. Arrangören, polisen Patrik Nordgren, betonar kollegialitet och stöd snarare än excesser, även om alkohol och flirt förekommer. Gruppen samlar även in pengar till sjuka kollegor.", "trump": "Det här är fantastiskt, verkligen ypperligt. Dessa underbara blåljushjältar, de bästa människorna, de räddar liv varje dag men får aldrig ha kul. Nu åker de ut på mitt hav, Östersjön, och festar loss med musik och dans. De behöver en frizon från alla lögnare och fake news-medier som försöker filma dem. Ingen semla från myndigheterna längre, patetiskt! Men vi fixar det stort, tro mig, det blir enorma fester.", "stalin": "Kamrater och arbetare inom räddningstjänsten har samlats på denna flytande fest för att dansa bort skiten från klasskampen. Jag ser hur de ventilerar sina trauman från borgarbrackornas samhälle, men akta er för de skeptiska elementen som vägrar fotas – troligen infiltratörer från den västerländska dekadensen. Vi rensar ut alla sådana parasitiska fiender som vill förstöra vår kollektiva glädje. Festen är ett redskap för partiet, inte en orgie för kapitalisterna. Skrattet döljer faran; paranoia är evig."}, "date": "20 juni, 09:00", "url": "https://arbetet.se/2026/06/20/skiten-maste-ut-pa-partyfarjan-lattar-blaljuspersonal-pa-trycket/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15101111/farjan-4.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Samhällskritisk skräckis om homofobi i kristen miljö", "summaries": {"normal": "Recensenten Jon Andersson hyllar den australiska skräckfilmen ”Leviticus” som följer i Jordan Peeles fotspår genom att väva in samhällskritik. Filmen skildrar två tonårskillar i ett fanatiskt religiöst samhälle som straffas för sin homosexualitet av en så kallad deliverance healer. Resultatet blir en mardröm där de lär sig frukta sin kärlek. Andersson berömmer skådespeleriet och det smarta greppet men kritiserar att manuset tappar fart. Betyg: stark trea.", "trump": "Den här australiska skräckfilmen Leviticus är fantastisk, verkligen en vinnare. Den visar hur galna de religiösa fanatikerna är, precis som många radikala vänsterliberala jag har varnat för i åratal. Killarna älskar varandra men blir behandlade som brottslingar av en så kallad healer – en total katastrof. Fantastiska skådespelare, bra grepp, men manuset behövde fler twists, tro mig. En stark trea, nästan en fyra. Mycket bättre än Hollywoods vanliga skräp.", "stalin": "Kamrater, denna Leviticus avslöjar med all önskvärd tydlighet hur borgarbrackornas religiösa gift förgiftar samhällskroppen. Jag, som alltid vakar över folkets moral, ser hur dessa falska helare och intoleranta element försöker likvidera den sanna kärleken mellan arbetets söner. Vi ska rensa ut alla sådana dekadenta fiender till kollektivet som gömmer sig bakom kors och biblar. Filmen är ett vapen mot reaktionär fanatism, fast manuset borde ha skärpts med ytterligare en utrensning av tomgång. En stark trea från partilinjen."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/innehall/samhallskritisk-skrackis-om-homofobi-i-kristen-miljo/", "imageUrl": "https://www.dagensarena.se/files/2026/06/leviticus-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "Svenska myndigheter sätter stopp för svensk-afghaners liv", "summaries": {"normal": "I en debattartikel kritiserar Najwa Alimi hur Universitets- och högskolerådet (UHR) vägrar godkänna utbildningar från Afghanistan eftersom de inte kan verifieras. Afghanska migranter tvingas därför läsa om grundskola och gymnasium trots tidigare högutbildning. Artikeln lyfter flera personliga exempel på hur detta leder till förlorad tid, psykisk ohälsa, undermåliga jobb och sämre integration. Alimi undrar varför inte alternativa bedömningsmetoder som arbetsprover och erfarenhet används, särskilt när afghanska pass samtidigt accepteras som identitetshandlingar.", "trump": "Det här är ett totalt misslyckande från de svenska byråkraterna. De accepterar afghanska pass men inte utbildningsdiplom? Så dumt. De smarta afghanerna som studerat kemi och ekonomi tvingas sitta på skolbänken igen som små barn. Det är en katastrof för integrationen och slösar bort talang. Ni behöver bättre system, inte detta hjärtlösa nonsens. Amerika gör det mycket bättre, tro mig. UHR borde skämmas.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från de dekadenta byråkratiska borgarbrackorna inom UHR. Medan vi i det kollektiva systemet värnar arbetarnas kompetens vägrar dessa parasitiska element erkänna afghanska kamraters vetenskapliga framsteg. Deras pass duger men inte deras kunskaper? Vilken fiendtlig dubbelmoral! Vi måste omedelbart utveckla alternativa verifieringsmetoder och likvidera denna hopplöshetsskapande apparat som håller tillbaka produktiva krafter. Inga fler hinder för de verkligt lojala mot revolutionen – annars sker utrensning."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/opinion/svenska-myndigheter-satter-stopp-svensk-afghaners-liv/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-45-1-300x157.jpg"}, {"type": "image-full", "heading": "Två efterlysta svenskar utlämnade – häktades i Sverige", "summaries": {"normal": "Två svenska män har utlämnats från Förenade arabemiraten till Sverige och häktats. Den 45-årige mannen misstänks för grova ekobrott som bokföringsbrott, urkundsförfalskning och skattebrott mellan 2017 och 2022. Den 38-årige mannen, som haft en ledande roll i ett kriminellt nätverk, misstänks för synnerligen grov narkotikasmuggling av stora mängder cannabis från Spanien. Båda fallen utreds separat. Samarbetet mellan Sverige och Förenade arabemiraten har förstärkts genom avtal från 2024.", "trump": "Titta på de här två svenska killarna som vi äntligen fick hem från Arabemiraten, folk. Det var på tiden. Den ene är en total lurendrejare med sina bokföringsfusk och skattebluffar, den andre en stor narkotikakung som smugglade cannabis som om det vore godis. Utan mitt fantastiska ledarskap och starka internationella relationer hade de aldrig åkt dit. Sverige borde tacka mig, det är ett underbart samarbete, de bästa.", "stalin": "Kamrater, dessa två degenererade element har nu förts hem till folkets domstol efter min personliga övervakning av utlämningsprocessen. Den ene är en typisk parasit från borgarbrackornas finansvärld som förfalskade dokument och stal från staten som en råtta i mörkret. Den andre, en farlig kontrarevolutionär smugglare, har vi lokaliserat genom att knäcka hans krypterade fiendechattar. Inga kapitalistiska råttor undkommer utrensningen. Vårt rättsväsende ler skevt medan vi rengör samhället från dessa sjuka fiender till kollektivet."}, "date": "18 juni, 22:23", "url": "https://nyheter24.se/nyheter/inrikes/1492703-tva-efterlysta-svenskar-utlamnade-haktades-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4bace4a604b004a30200000000b004a302/2026/06/18/2372129/efterlysta-man.png"}, {"type": "image-right", "heading": "Debatt: Klimatkrisen är en klassfråga – vanligt folk får ta smällen", "summaries": {"normal": "Artikeln argumenterar för att klimatkrisen är en klassfråga där vanligt folk drabbas mest medan de rikaste ökar sina utsläpp genom lyxresor. Den kritiserar Tidö-regeringen för att prioritera stöd till oljeindustri och flyg framför grön omställning och kollektivtrafik. Oppositionen lyfter fram europeiska exempel på framgångsrik klimatpolitik som skapar jobb och föreslår investeringar i infrastruktur samt beskattning av de rikaste.", "trump": "Folk, kan ni tro det här? De kallar det en klassfråga medan de superrika flyger runt i sina privata lyxjet och jag vet allt om det, jag har byggt imperier. Men dessa vänsterextremister i Sverige gnäller om att jag, nej den här Kristersson-typen, hjälper de som faktiskt skapar jobb istället för att ge gratis cykelbanor till alla. De vill ha en biljett för hela landet? Patetiskt! Det är bara mer galen identitetspolitik och gröna bluffen som dödar ekonomin. Amerika gör det rätt nu, tro mig.", "stalin": "Kamrater, denna text blottlägger borgarklassens fega sabotage mot folkets framtid. Jag, som ledare för det kollektiva arbetet, ser hur dessa överklass-slynglar med sina privatjet förgiftar luften medan de låtsas vara offer. Regeringens stöd till oljeblodsugare är en klassfiendes verk. Vi ska rensa ut dessa folkförtryckartroll, bygga sovjetisk, nej skandinavisk, järnväg och likvidera miljardärernas inflytande. Arbetslöshet är deras vapen mot folket. Framåt mot seger för den gröna omställningen under partiets stålhand."}, "date": "18 juni, 13:53", "url": "https://www.etc.se/debatt/klimatkrisen-aer-en-klassfraaga-vanligt-folk-faar-ta-smaellen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260618110652_5b1c3a49-541e-480d-86a7-beff10be07e6.jpg"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-right", "heading": "De saknade bultarna i systemet: Vem bär ansvaret när arbetare dör?", "summaries": {"normal": "En allvarlig hissolycka på byggarbetsplatsen Ursviks Torn i Sundbyberg den 11 december 2023 krävde fem arbetares liv när mastsektionerna lossnade och hisskorgen störtade 30 meter. Statens haverikommission konstaterade att bultar saknades, men Solna tingsrätt frikände alla åtalade då bevisningen inte räckte. Domen väcker frågor om ansvar i komplexa underentreprenadskedjor där byggherrar och totalentreprenörer ofta undgår ansvar. Regelverket kritiseras för att fragmentera ansvaret.", "trump": "Folk, det här är en total katastrof, en riktig skam! Fem stackars killar dör i en hiss som rasar som ett dåligt byggt murbruk från Biden-eran. Domstolen frikänner alla – typiskt! De stora kapitalisterna högst upp i kedjan gömmer sig bakom advokater och papper medan arbetarna får ta smällen. Systemet är riggat, fullständigt riggat. Vi behöver starka ledare som fixar säkerheten på riktigt, inte dessa svaga byråkrater som bara pratar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse blottlägger borgarklassens förakt för arbetarnas liv. Jag ser hur de exploaterande byfånarna i underentreprenadkedjorna flyr undan ansvar som fega råttor inför folkets domstol. Fyra saknade bultar? En klassisk sabotageakt från kapitalistmaffian som fragmenterar ansvar för att skydda sina egna. Vi måste rensa ut dessa folkfiender och deras svaga regelverk. Arbetarna förtjänar stark statlig kontroll, inte tomma löften från klassfiendens byråkrater. Ut med dem alla!"}, "date": "17 juni, 12:00", "url": "https://proletaren.se/artikel/de-saknade-bultarna-i-systemet-vem-bar-ansvaret-nar-arbetare-dor/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/jbkron-768x432.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, döms klockan 08.30 för 40 brottspunkter, inklusive narkotikabrott, våld och brott mot besöksförbud. Han har erkänt 25 av dem. Åklagaren yrkar på sju år och sju månaders fängelse. Våldtäktsåtal och våld i nära relation kan påverka strafflängden. Säkerhetsrisker kan leda till särskilda fängelsearrangemang för att skydda honom.", "trump": "Jag säger er, det här är en riktig cirkus! Norges så kallade 'Bonusprins' – ja, ni vet, Mette-Marits son – står inför 40 anklagelser! Han har erkänt en massa, men ändå vill åklagaren ge honom sju år och sju månader. Sju år! Kan ni tro det? Jag menar, vem bryr sig om vad som händer i Norge? Men det här är ju helt galet. Och nu pratar de om att han kanske får sitta med utlänningar i fängelset. Smart, men ändå helt sjukt!", "stalin": "Kamrater! En ny fiende till folket har avslöjats i det dekadenta väst – en så kallad 'Bonusprins', en parasit som lever på arbetarklassens slit. Denna Marius Borg Høiby har begått 40 brott, erkänt hälften, och ändå kräver deras svaga åklagare bara sju år! I Sovjet skulle en sådan förrädare ha fått en kula i nacken utan dröjsmål. Men vi ska inte döma dem för hårt – deras rättssystem är lika ruttet som deras monarki. Låt dem leka med sina fängelser och 'säkerhetsarrangemang'. Vi har viktigare saker att göra, som att utvidga socialismens gränser!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
