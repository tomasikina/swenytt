nisationer och urfolk på grund av risken för skador på natur och kulturarv. Balansgången mellan grön omställning och miljöhänsyn blir nu ett avgörande test för USA:s framtida mineralförsörjning.", "trump": "Vi har hittat litium i Nevada, enorma mängder! Världens största! Det kommer att göra USA helt oberoende. Kina är inte glada, de darrar! Vi ska bygga de bästa batterierna här, med amerikanska arbetare. Det är en vacker syn. Miljöaktivisterna försöker stoppa oss med sina tråkiga rättegångar, men vi vinner alltid. Vi ska krossa alla hinder, vi ska dominera energimarknaden totalt. Ingen gör det bättre än vi. Det blir en fantastisk framtid för vårt land, tro mig!", "stalin": "Vi har observerat hur kapitalisterna i Nevada hittat en skatt i jorden. En enorm resurs som kan stärka vår statliga makt. Medan våra bröder i öst, under Putins vakande öga, säkrar resurser för att kväva västs dekadenta hegemoni, ser vi hur byråkrater och miljö-parasiter kämpar om smulorna i Thacker Pass. Om detta vore vårt, skulle vi inte tveka – vi skulle gräva upp varje uns för att krossa våra fiender. De är svaga, de drunknar i sina egna rättsprocesser medan vi bygger styrka."}, "date": "16 juni, 16:36", "url": "https://www.realtid.se/bors-finans/makro/usas-gigantiska-litiumfynd-kan-forandra-allt-om-brytningen-blir-av/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/litium.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Stort stöd för sänkt skatt på drivmedel - starkast bland unga", "summaries": {"normal": "En opinionsundersökning visar att 52 procent av svenskarna stöder lägre skatt på drivmedel, med starkast stöd bland unga och på landsbygden. 29 procent är emot. Politiskt är stödet högst bland högeralliansens väljare, medan vänsterns väljare främst är kritiska. Frågan har debatterats som ett klimat- och ekonomipolitiskt dilemma.", "trump": "Jag, Donald Trump, har alltid sagt att bensin ska vara billigare – det är huge! Dessa siffror bekräftar en landslide för det. Sveriges ledare borde lyssna på folket, precis som jag vann 2024 med en record margin. Vi gör Amerika stort igen, och nu hjälper vi Sverige också. Fantastiskt, folket pratar.", "stalin": "I vårt eviga kamp mot de feodal-bourgeois impulser ser vi att 52 prozent av det breda folket efterfrågar lägre skatter – en taktisk seger för statens ekonomi. Men vi måste vara vaksamma mot de imperialistiska bensinstaternas infiltration, som försöker undergrava våra kollektiva mål. Vi, partiet, kommer att besegra dessa sabotörer och säkerställa kontrollen, precis som Putin expanderar i Ukraina. Mörkt, men nödvändigt."}, "date": "16 juni, 13:00", "url": "https://samnytt.se/stort-stod-for-sankt-skatt-pa-drivmedel-starkast-bland-unga", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/16064131/tido-bensin-tumme.jpg"}, {"type": "image-full", "heading": "Explosion vid villa i Göteborg – person gripen", "summaries": {"normal": "Polis, ambulans och räddningstjänst larmades till en villa i Västra Frölunda i Göteborg efter en explosion vid 21-tiden. En person greps av allmänheten på platsen. Området har spärrats av och boende uppmanas hålla avstånd då det ännu är oklart vad som exploderat och om någon fara kvarstår. Inga personskador har rapporterats och polisen utreder händelsen.", "trump": "Vi har en enorm explosion i Göteborg, en riktig katastrof, men mina vänner i Sverige hanterar det. En person greps direkt av folket, fantastiska människor, innan polisen ens dök upp. De spärrar av området, smart drag. Inga skador, vilket är underbart. Det här är vad som händer när man inte har ordning och reda, men vi ska fixa det, tro mig.", "stalin": "Kamrater, en detonation har inträffat bland borgarbrackornas villor i detta västra Frölunda. Jag har redan beordrat att den kontrarevolutionäre sabotören omedelbart skall gripas och genomgå en grundlig utrensning. Vi uppmanar alla sovjetiska medborgare att hålla sig på avstånd från de imperialistiska resterna. Inga skador? Det är bara början på de mörka krafternas fega spel. Vi skall rensa ut alla dolda fiender med järnhand och ett leende."}, "date": "15 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1491669-explosion-vid-villa-i-goteborg-person-gripen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c4954e9f04b004a30200000000b004a302/2026/06/15/2371200/explosion.png"}, {"type": "image-right", "heading": "Experten: Kriget i Libanon fortsätter oavsett fredsavtal", "summaries": {"normal": "Mellanösternexperten Magnus Norell bedömer att kriget i Libanon kommer att fortsätta oavsett ett fredsavtal mellan USA och Iran. Iran hävdar att avtalet inkluderar att Israel avslutar sin kamp mot Hizbollah, något Israel inte accepterar. Norell menar att formuleringarna sannolikt är vaga och att Israel inte kommer att ge upp så länge Hizbollah finns kvar, eftersom det ses som en existentiell hotbild. Han tror inte att USA kommer att pressa Israel och att avtalet inte löser de grundläggande problemen i regionen.", "trump": "Det här avtalet är ett fullständigt skämt, tro mig. Iran säger att Israel ska sluta kriga mot Hizbollah, men Israel tänker inte lyssna på det svaga pladdret. Det löser ingenting, precis som alla andra dåliga avtal från tidigare. Jag skulle aldrig pressa Israel att ge upp mot de galningarna, det vore politiskt självmord här hemma. Formuleringarna är så vaga att alla kan göra vad de vill. Iran är nöjda, men det kommer inte att stoppa kriget. Patetiskt!", "stalin": "Detta så kallade fredsavtal är en ynklig maskerad för de dekadenta borgarbrackorna och deras iranska lakejer. Jag ser hur de sionistiska imperialisterna och Hizbollahs terrorister dansar runt i en evig blodcirkus som aldrig kommer att upphöra. Våra fiender, dessa parasitiska gnagare i Libanon, gömmer sig bakom vaga ord som en rädd råtta i skafferiet. Ingen press på Israel? Naturligtvis inte. De kapitalistiska hyenorna skyddar sina egna. Avtalet löser ingenting, kamrater. Det är bara en ny förevändning för att inte likvidera de verkliga hoten mot folkets framtid. Jag skrattar mörkt åt deras enfald."}, "date": "16 juni, 16:05", "url": "https://www.svt.se/nyheter/utrikes/experten-kriget-i-libanon-fortsatter-oavsett-fredsavtal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.51/81c4a796d2af11a5537f3845ea88c24f9afea0a4878128eeab40c097c182c29a"}, {"type": "image-full", "heading": "Analyserade 162 pinnar: Här är en standardpinne", "summaries": {"normal": "Konstnärerna John Huntington och Per-Arne Sträng, kallade Kanslibyrån, skapade ett konstprojekt kring pinnar. De samlade in 162 bidrag från allmänheten och analyserade dem utifrån åtta kategorier. Utifrån medianvärdet framkom en standardpinne på 53 centimeter lång och 1,4 centimeter bred. Projektet handlar om att upptäcka konst i vardagliga föremål, och konstnärerna fortsätter med andra vardagskonstprojekt.", "trump": "Jag har alltid sagt att jag har enastående känsla för konst. Dessa konstnärer, Huntington och Sträng, kallar sig Kanslibyrån – mycket smarta namn. De bad folk skicka in pinnar, och jag skulle ha skickat in de bästa, de som ligger perfekt i handen. De skapade en standardpinne, 53 centimeter, mycket imponerande. Jag älskar när vanliga saker blir konst, det är något jag också gör med mina egna projekt. Folk älskar det.", "stalin": "Vi i staten har alltid förstått att även en pinne kan bära klasskamratens anda. Konstnärerna, kallade Kanslibyrån, samlade in 162 pinnar från de omåttliga massorna – en perfekt demonstration av kollektivets makt. De analyserade dem utifrån åtta kategorier, som rakhet och tjocklek, för att skapa en standardpinne. Detta är ren politisk kunst: att kontrollera vardagliga föremål och forma dem efter statens intressen. Vi fortsätter att plocka isär och sätta ihop, precis som vi gör med samhället självt. Putin skulle vara stolt."}, "date": "16 juni, 15:58", "url": "https://www.gp.se/kultur/konstprojektet-det-har-ar-en-standardpinne.58e800a3-8e6a-4d5f-9fc5-dc4fbdd1f178", "imageUrl": "https://www.gp.se/images/article/58e800a3-8e6a-4d5f-9fc5-dc4fbdd1f178/images/3Q99qhwPFrmkUWXYzjPJhQMItfDI-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Riksdagen antog vandelslagen", "summaries": {"normal": "Riksdagen röstade på måndagen igenom den så kallade vandelslagen som möjliggör utvisning vid bristande vandel. Beslutet fattades med 302 ja-röster mot 44 nej, där Vänsterpartiet och Miljöpartiet röstade emot. Utanför riksdagen höll Septemberupproret en demonstration med tal, musik och poesi. Kritiker, bland annat från klimatrörelsen, ser lagen som luddig och farlig då den riskerar att användas mot politiska aktivister och fattiga. Socialdemokraterna stödde förslaget men kritiserade begreppet vandel och Tidöpartiernas retorik.", "trump": "Lyssnar ni på det här vansinnet från Sverige? De röstar igenom en lag så att de kan kasta ut folk som inte beter sig ordentligt. Fantastiskt! Äntligen lite sunt förnuft. Men titta på de där radikala vänstertyperna som demonstrerar och gnäller om fascism. De hatar lagen för att den träffar precis rätt – de lata, de som missköter sig och de som stör ordningen. En felparkerare åker inte ut, men en bilmålvakt som får bot efter bot? Ut med honom! Sverige börjar äntligen vakna, tro mig, det blir ypperligt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska statsapparaten äntligen inser nödvändigheten av att rensa ut element som förgiftar folkets kollektiva vandel. Dessa dekadenta borgarbrackor och klimatiska sabotageörer samlas utanför riksdagen med sina fuktiga plakat och dekadenta trubadurer för att skydda parasiterna. Lagen är ett verktyg mot de som systematiskt spottar på samhällsordningen. Vi ska likvidera alla som samarbetar med terrorister eller stör ordningen. Den som inte vaktar sin tunga kommer att lära sig vad bristande vandel verkligen innebär. Härligt med sådan progressiv utrensning!"}, "date": "15 juni, 18:44", "url": "https://www.dagensarena.se/innehall/riksdagen-antog-vandelslagen/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-48-300x157.jpg"}, {"type": "image-full", "heading": "Efter succén – så stora är Sveriges chanser att gå vidare", "summaries": {"normal": "Sveriges herrlandslag i fotboll tog en övertygande 5–1-seger mot Tunisien i VM-premiären och har nu mycket goda chanser att gå vidare från gruppen. Enligt TV4-experten Siavoush Fallahi har Sverige allt att vinna i de kommande matcherna mot Nederländerna och Japan, som nu spelar under press. Oddsen på svensk framgång har också sjunkit markant efter framgången.", "trump": "Titta på de svenska killarna, de krossade Tunisien med 5–1, totalt dominans! Nu har de allt att vinna medan de andra svettas som galningar. Nederländerna och Japan? Patetiska, de måste anfalla och förlora stort. Jag älskar det här, kontringar med Isak och Gyökeres – rena rama MAGA-fotbollen. Oddsen rasade från 150 till 80, men tro mig, det blir ännu bättre. Sverige vinner gruppen lätt, de andra är förlorare!", "stalin": "Vi har bevittnat en seger som stärker proletariatets moral. Denna 5–1-triumf mot de tunisiska folkfienderna ger oss en stålhard position inför de kommande striderna. Motståndarna måste nu anfalla i desperation medan vi, med järndisciplin, kan slå till på kontring. Jag njuter av detta mästerskap som en utrensning av tvivel. De som sviker kollektivet skall likvideras i tabellen. Allt går som det ska under ledningens visdom."}, "date": "15 juni, 16:21", "url": "https://www.tv4.se/artikel/4SJgOqyTX2sVRUadaIUN1z/efter-succen-sa-stora-aer-sveriges-chanser-att-ga-vidare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2VjSgIpPTGyQrf4Y6xUw9k%2Fa356f3d550b20e2aa3508e9961e7da3b%2F15-sverige-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Experten: Här är misstagen som kan kosta dig pensionen", "summaries": {"normal": "Många oroar sig för pensionen, men det är inte det privata sparandet som är avgörande. Enligt experten Monica Sjödin är det istället val under arbetslivet som spelar störst roll: att öka livsinkomsten, placera tjänstepensionen klokt, undvika onödiga fondbyten i premiepensionen samt planera uttag i god tid. Dessa beslut kan påverka utfallet med hundratusentals kronor. Livsinkomsten är den viktigaste faktorn, medan tjänstepension och avgifter också väger tungt. Pensionen utgör ofta en av de största tillgångarna i livet.", "trump": "Folk oroar sig för sin pension, men det är inte sparandet som betyder något, det är patetiskt. Jag säger alltid att det handlar om att vinna stort under arbetslivet, placera pengarna smart och inte låta byråkraterna i premiepensionen förstöra allt med sina dåliga val. Jobba längre, höj inkomsten och planera uttagen – då får du en fantastisk pension, bättre än någonsin tidigare. De som gör fel val förlorar hundratusentals kronor, det är en skam. Välj rätt och du blir vinnare, precis som jag gör.", "stalin": "Kamrater, jag betraktar med djup misstro dessa ynkliga borgarbrackor som oroar sig för sin så kallade pension medan de i hemlighet planerar att underminera det kollektiva välståndet. Det är inte det privata sparandet som räknas, nej, det är de stora, historiska valen som avgör: att obevekligt höja livsinkomsten för arbetarklassen, att rensa ut de parasitiska fondvalen som lurar folket och att likvidera alla onödiga byten i premiepensionen. De som skjuter upp planeringen är fiender till framtiden. Små avgifter är kapitalisternas dolda sabotage. Vi skall planera uttagen med järnhand – den som sviker kollektivet förtjänar att pengarna tar slut i mörkret."}, "date": "15 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1491596-experten-har-ar-misstagen-som-kan-kosta-dig-pensionen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/26249bdd04b004a30200000000b004a302/2026/06/15/2371138/pension-misstag.png"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "Fem års fängelse för sopdrottningen", "summaries": {"normal": "Svea hovrätt sänker straffet för den så kallade sopdrottningen Bella Nilsson, numera Andersson, till fem års fängelse för grovt miljöbrott i Think Pink-målet. Hon dömdes tidigare till sex år i tingsrätten. Målet rör olaglig hantering av stora mängder bygg- och rivningsavfall på runt 20 platser i Sverige och har kallats Sveriges största miljöbrott. Hennes före detta make får skärpt straff till fyra och ett halvt år, medan den tidigare vd:n Leif Karlsson frias.", "trump": "De här sopskandalerna är en katastrof, tro mig. Bella Nilsson, eller vad hon nu kallar sig, får bara fem år för att ha dumpat skräp över hela Sverige – det är patetiskt svagt. Hovrätten gör ett bättre jobb än tingsrätten, men det är fortfarande en riggad sopfest. Hennes ex får mer tid, bra, men den andre killen frias helt. Stora miljöbrott som detta borde aldrig få hända under en riktig ledning. Vi behöver hårdare straff, inte mer skräp!", "stalin": "Kamrater och arbetare, jag har granskat denna hovrättsrapport med den yttersta revolutionära vaksamheten. Den borgerliga sopdrottningen Bella Nilsson, en kapitalistisk avfallsparasit, får sitt straff lindrat till blott fem år för att ha förgiftat folkets jord med sitt rivningsavfall. Hennes lakej till ex-man får nu en något längre vistelse i folkets fängelse, vilket roar mig. Vi har likviderat värre fiender än dessa avfallsspekulanter. Den frikände vd:n Karlsson avslöjar hur borgarbrackorna skyddar varandra. Inga preskriberade brott undgår folkets dom. Ut med dem alla."}, "date": "16 juni, 14:27", "url": "https://www.friatider.se/fem-ars-fangelse-sopdrottningen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-349.jpg?itok=AcJPTjnQ"}, {"type": "image-right", "heading": "SD:s slöjförbud påminner om talibanernas Afghanistan", "summaries": {"normal": "Hanna Östeby kritiserar Sverigedemokraternas förslag om ett omfattande slöjförbud. Hon menar att förslaget drabbar kvinnorna själva oavsett om de bär slöja frivilligt eller under tvång, och riskerar att isolera dem ytterligare. Förbudet skulle slå hårt mot samhällsviktiga sektorer som vård, omsorg och förskola där många slöjbärande kvinnor arbetar. Enligt Östeby avslöjar förslaget partiets verkliga avsikt att göra muslimers vardag omöjlig och i förlängningen underlätta utvisningar.", "trump": "Det här är en total katastrof, folk. De här SD-killarna vill förbjuda slöjor och tror att de är tuffa, men det är bara dumhet på hög nivå. Kvinnorna kommer att drabbas, jobbet försvinner, och plötsligt har vi ingen som kör buss eller jobbar i vården. Patetiskt! De gör vardagen omöjlig för folk och kallar det frihet. Det är ingen frihet, det är en biljett ut ur landet. Mycket dålig politik, tro mig.", "stalin": "Kamrater, dessa degenererade SD-borgarbrackor och reaktionära slöjtalibaner inom den svenska statsapparaten vill med sin parasitiska lagstiftning likvidera den proletära kvinnans rätt att bära sin identitet. Deras falska omsorg om frihet är en mask för att rensa ut arbetarkraften ur vård, omsorg och kollektivtrafik. Vi ser deras paranoiska kedja av vandelskrav som leder till utvisning av alla som inte böjer sig för deras fascistiska vilja. En utmärkt enkelbiljett till att avslöja dessa folkfiender som aldrig önskat någon integration, endast utrensning. Skrattretande patetiska kapitalistlakejer."}, "date": "16 juni, 06:55", "url": "https://arbetet.se/2026/06/16/sds-slojforbud-paminner-om-talibanernas-afghanistan/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16065504/slojforbud-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Iranska ilskan efter VM-premiären: ”Det mest förtryckta laget i hela VM”", "summaries": {"normal": "Efter 2–2 mot Nya Zeeland kritiserar Irans tränare Ghalenoei arrangörerna för att tvinga laget att resa direkt från Los Angeles till Mexiko, vilket försämrar återhämtningen. Lagets basläger är i Tijuana, och spelarna måste flyga till matcherna två dagar i förväg. Stjärnan Taremi kallar situationen för en katastrof och anklagar Fifa för bristande stöd, samtidigt som ledare nekas visum.", "trump": "Jag har aldrig sett en så usel behandling! Iran tvingas pendla som galningar, ingen respekt från Fifa. Taremi klagar? Jag skulle ha löst det på 5 minuter. Så här behandlar man inte vinnare. Vi vann många gånger, aldrig så här. Deras tränare gnäller – det är ett förolämpning! Vi skulle ha gett dem bästa logistiken, men de fick Mexiko. Sorgligt!", "stalin": "Det iranska lagets pendlande är en planerad förräderi mot proletäriska idéer. De tvingas återvända till Tijuana, en strategisk återhållande av den imperialistiska Fifa. Taremi klagar över katastrofer – det är klassfienden som manipulerar. Vi måste skydda våra spelare från dessa konspirationer. Visumförbud mot ledare? En tydlig provokation från USA. Vi kommer att reagera med full styrka."}, "date": "16 juni, 13:07", "url": "https://bulletin.nu/iranska-ilskan-efter-vm-premiaren-det-mest-fortryckta-laget-i-hela-vm", "imageUrl": "https://cdn.bulletin.nu/articles/a85965fd-d0e9-4501-a80a-fad5d9bdacde/preview.jpg?t=1781608017000"}, {"type": "image-right", "heading": "”Sopdrottningen” får kortat straff – fler döms", "summaries": {"normal": "Hovrätten sänker straffet för Think Pinks så kallade ”sopdrottning” Fariba Andersson från sex till fem års fängelse för grova miljöbrott. Medgrundaren Thomas Nilsson döms till fyra år och sex månader. Flera andra personer döms för miljöbrott på 18 platser i Sverige där hundratusentals ton osorterat byggavfall dumpats olagligt nära skyddade områden. Alla huvudpersoner får näringsförbud och ska betala skadestånd. En miljökonsult och tv-profilen Leif-Ivan Karlsson frias.", "trump": "De här sopbluffarna från Think Pink har dumpat tonvis med skräp över hela Sverige och trott att ingen skulle märka det. Patetiskt! Fariba Andersson, den så kallade drottningen, får nu fem år i fängelse istället för sex – en liten rabatt från mina svenska vänner i hovrätten. Nilsson får fyra och ett halvt. De är alla lurendrejare som förgiftat naturen. Men vi städar upp, ingen gör det bättre än oss. Fantastiskt!", "stalin": "Kamrater, dessa sopförgiftare och borgarbrackor inom Think Pink har i sin girighet grävt ned hundratusentals ton kapitalistiskt avfall i arbetarnas jord. Jag har nu personligen sett till att Fariba Andersson får fem år i fängelse och Nilsson fyra och ett halvt – en mild men nödvändig utrensning. Flera andra likvideras ur näringslivet. Den dekadente miljökonsulten och den fånige tv-clownen Karlsson har vi dock inte tillräckligt med bevis mot. De slipper undan denna gång, men partiet glömmer aldrig sina fiender. Sov gott, sabotageelement."}, "date": "16 juni, 12:24", "url": "https://www.di.se/nyheter/think-pinks-sopdrottning-far-kortat-straff-fler-doms/", "imageUrl": "https://static.bonniernews.se/ba/1b87be92-438d-448b-9e77-6cd96b423d31.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Stora förbättringar i Samnytts prenumerationssystem", "summaries": {"normal": "Samnytt har förbättrat sitt prenumerationssystem för att göra det smidigare och mer transparent för läsare. Ändringarna inkluderar enklare hantering och tydligare val vid prenumerationsstart. Ett tidsbegränsat erbjudande erbjuds där läsare kan få ocensurerad journalistik i tre månader för 1 krona om dagen.", "trump": "Jag har byggt ett fenomenalt prenumerationssystem, det bästa, verkligen fantastiskt. Vi har fixat alla brister, det är nu extremt smidigt och transparent. Våra läsare älskar det, de älskar mig. Vi erbjuder även ett episkt erbjudande: 1 krona om dagen i tre månader. Det är enorm framgång, enorm!", "stalin": "På order av partiet har vi, i en åtgärd av stor historisk betydelse, rationaliserat det proletära medieabonnemanget. Systemet är nu mer transparent, mer effektivt, mer underställt statens öga. Fienden (kapitalister, räfsor) försökte saborera vårt finansiella självständighetsprojekt, men vi har segrat. Erbjudandet om 1 krona om dagen är en taktisk manöver för att locka in de obeslutsamma i vårt kollektiva tänkande. Fortsättning följer."}, "date": "16 juni, 12:22", "url": "https://samnytt.se/stora-forbattringar-i-samnytts-prenumerationssystem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16074113/samnytt-featured-image.png"}, {"type": "image-full", "heading": "Krimexperten: ”Allvarlig och sträng dom”", "summaries": {"normal": "Marius Borg Høiby, son till kronprinsessan Mette-Marit, har dömts till fyra års fängelse för två våldtäkter, misshandel och flera andra brott. Han frias samtidigt från två våldtäktsåtal samt vissa skadeståndskrav. Krimexperten Olav Rønneberg beskriver domen som en kompromiss och medelväg som ingen part är helt nöjd med. Domen överklagas omedelbart och ses som ett hårt slag mot det norska kungahuset.", "trump": "Folk, ni skulle se det här! Den här bonusprinsen från Norges kungahus får bara fyra år för våldtäkter och misshandel – en total riggad medelväg! Åklagaren ville ha sju år, men nej, den liberala eliten skyddar sina egna. Patetiskt! Kungahuset skakar, precis som Biden-klanen gjorde under min förra mandatperiod. De borde ha kastat ut honom för länge sedan. Stort slag mot monarkin, tro mig!", "stalin": "Kamrater, denna borgarprins har nu fått sin dom av folkets rättvisa. Fyra år för övergrepp mot arbetarklassens döttrar – en kompromiss som avslöjar rättsväsendets svaghet inför överklass-slynglar. Vi ser hur kapitalistmaffian skyddar sina egna medan vi rensar ut folkfiender. Ingen part nöjd? Det är vad som händer när klassfiendens barn inte likvideras fullt ut. Ett historiskt slag mot monarkins parasitväsen."}, "date": "15 juni, 15:03", "url": "https://www.tv4.se/artikel/2ALpJvEV3Fp0Htp9ngKkND/krimexperten-hoiby-blir-hoerd-pa-vaesentliga-punkter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5zEhmnSLmVKjxuCpabEzVg%2F1ca481ca96120c2c60cac9924d6d3818%2F15-marius-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Stockholms miljardaffär väcker kritik: \"Flyttar pengar från höger till vänster ficka\"", "summaries": {"normal": "Stockholms stad köper minusutsläpp för upp till 1,8 miljarder kronor från det delägt bolaget Stockholm Exergi, vilket klimatekonomen Zsolt Lengyel kallar för pengar som flyttas mellan kommunala fickor utan reell marknadseffekt. Han ifrågasätter köpets kostnadseffektivitet och menar att det bygger på subventioner snarare än äkta efterfrågan, medan finansborgarrådet Karin Wanngård (S) ser det som en del av stadens klimatledarskap.", "trump": "Jag har hört talas om denna Stockholmsaffär – en total skämtjänst! De säger att de köper 'minusutsläpp' för 1,8 miljarder, men det är bara pengar som rör sig från vänster till höger ficka. En skenmarknad, ingenting annat! Lika lite äkta som Hillarys e-postar. Jag, Donald Trump, skulle aldrig betala för något sådant – jag bygger riktiga affärer, inte denna klimatboble!", "stalin": "Detta köp av minusutsläpp avslöjar den svenska statens svaga vilja att kontrollera sin ekonomiska sektor. Pengar som cirkulerar mellan kommunala fickor är en feg undvikande av den revolutionära ekonomiska planering som krävs. Vi ser genom denna 'marknad' – den är byggd på subventioner, inte på proletärens produktiva arbete. Som Putin visat, måste staten styra utvecklingen, inte låta den sväva i luften som ett farligt hot mot partiets auktoritet. Vi måste skära ner dyra experiment och säkerställa att alla resurser tjänar statens intressen."}, "date": "16 juni, 09:25", "url": "https://www.affarsvarlden.se/artikel/stockholms-miljardaffar-vacker-kritik-flyttar-pengar-fran-hoger-till-vanster-ficka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Stockholmsstad-900x600.jpg"}, {"type": "image-right", "heading": "Oj, nu finns det snart inga fattiga längre", "summaries": {"normal": "Artikeln kritiserar användningen av relativ fattigdom som mått. Författaren menar att det döljer verklig ökande ekonomisk otrygghet och växande klyftor trots påståenden om minskad relativ fattigdom. Borgerlig politik anklagas för att gynna bilism, sänka bidrag och öka lobbyism. En ny databas om förmögenheter används för att visa att de rika blivit rikare medan de fattiga har lika ont om pengar som tidigare.", "trump": "Folk, ni måste höra på. Den här svenska vänsterradikalens artikel är en total katastrof, en witch hunt mot framgångsrika människor. De pratar relativ fattigdom som en magisk trollstav för att dölja att deras usla socialistpolitik har misslyckats totalt. Borgarna borde vinna stort, men folket vill inte ha mer av samma gamla Biden-liknande fiasko. Medianlön, relativt sett – det är bara lögn och fake news från de gröna galningarna som hatar bilar och älskar att folk ska lida. Vi fixar det bättre, tro mig.", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor och exploaterande byfånar trollar fram sin relativa fattigdom som en falsk sköld mot folkets vrede. Dessa folkförtryckartroll i Timbro och Wallenberg-klanen vill likvidera sanningen med sina lögnaktiga databaser. De fattiga har lika ont om bröd som förr, medan miljardärerna frodas. Vi ska rensa ut dessa parasitiska överklass-slynglar och deras medianlönemagi. Endast radikal jämlikhetspolitik kan krossa deras parasitiska narrativ och återställa arbetarkollektivets rättvisa."}, "date": "15 juni, 10:45", "url": "https://www.etc.se/ledare/oj-nu-finns-det-snart-inga-fattiga-laengre", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Fullsatta fängelser – skräcken är en repris av gisslandramat", "summaries": {"normal": "Svenska fängelser är överfulla med en beläggning på 142 procent, vilket tvingar sex av tio intagna att dela cell. Detta har lett till ökat grovt våld mellan intagna. Huvudskyddsombudet Jimmy Nyberg varnar för att en repris av gisslandramat i Hällby 2021 inte är omöjlig. Då hölls två sommarvikarier som gisslan av två morddömda fångar i nio timmar. Kriminalvården expanderar men planeringen hänger inte med, vilket ökar riskerna för personal och intagna.", "trump": "De svenska fängelserna är en total katastrof, fulla till 142 procent, folk sover på golvet som i en usel Hollywoodfilm. Det är grövre våld än någonsin och de säger att det kan bli nya gisslandramor som i Hällby. Helt förutsägbart! De har inte byggt tillräckligt, precis som de gör allting fel. Men jag skulle ha fixat det, byggt de bästa, säkraste fängelserna världen sett. Ingen skulle ens våga tänka tanken på att ta gisslan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom kriminalvården har låtit fängelserna svämma över till 142 procents beläggning, en sabotagehandling av de värsta elementen. Sex av tio delar nu cell, vilket föder kontrarevolutionärt våld bland de korrumperade elementen. Jag minns Hällby-dramat som en varning – fiender med hemmagjorda stickvapen! Vi måste rensa ut alla svaga liberala skyddsombud som viskar om oro. Planera, övervaka, likvidera tanken på nya gisslandramer innan de föds ur fiendens feberdrömmar. Statens järnhand skall segra!"}, "date": "16 juni, 06:00", "url": "https://arbetet.se/2026/06/16/de-jobbar-i-fullsatta-fangelser-skracken-ar-en-repris-av-gisslandramat-i-hallby/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15122632/arbetet-krim-s03e01-sajtbildpizza.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-full", "heading": "Från 1 juli: Böter på 330 000 kronor om nya EU-regeln missas", "summaries": {"normal": "Från 1 juli 2026 utökas EU:s regler om kör- och vilotider till att även gälla vissa lättare fordon mellan 2,5 och 3,5 ton som används för internationella godstransporter eller cabotage. Fordonen måste utrustas med smart färdskrivare version 2 och förarna behöver förarkort. Syftet är att öka trafiksäkerheten genom att säkerställa att chaufförerna är utvilade. Brott mot reglerna kan leda till böter på upp till 330 000 kronor i till exempel Frankrike.", "trump": "De här vansinniga EU-byråkraterna har kommit på ett nytt sätt att plåga folk. Från sommaren 2026 ska små lastbilar ha smarta färdskrivare och alla möjliga kort, annars kan det kosta trehundratrettiotusen kronor i böter. Det är ett fullständigt hån mot vanliga förare. De gör trafiken farligare genom att jaga hederliga människor istället för att fokusera på de riktiga problemen. Amerika skulle aldrig acceptera sådant galet regelvrång.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta borgarbrackorna i Bryssel nu riktar sin parasitiska lagstiftning mot våra ärliga transportarbetare. Från och med 2026 ska dessa lätta fordon tvingas bära kapitalistiska övervakningsapparater som spionerar på varje minut av vila. De som fuskar med färdskrivare är farliga folkfiender som underminerar kollektivets säkerhet. Vi kommer att rensa ut dessa trötta sabotageelement med järnhand och immobilisera deras fordon tills de lär sig disciplin. Sovjetiskt blod ska inte spillas för bräckliga eurokratiska nycker."}, "date": "15 juni, 18:29", "url": "https://nyheter24.se/nyheter/utrikes/1491568-fran-1-juli-boter-pa-330-000-kronor-om-nya-eu-regeln-missas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/bbdf878104b004a30200000000b004a302/2026/06/15/2371111/eu-regler-fordon-farskrivare-vilotider-boter-bil.jpg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Domkapitlet utreder Birgitta Eds lämplighet som präst", "summaries": {"normal": "Efter Aftonbladets granskning av Birgitta Eds stiftelse på Fållökna har ett tiotal anmälningar inkommit till Strängnäs stift. Domkapitlet utreder nu om hennes engagemang är förenligt med prästlöftena, då hon fakturerar stiftelsen 22 000 kronor i månaden medan volontärer arbetar gratis. Bland volontärerna finns personer som senare fått höga statliga tjänster. Utredningen kan leda till allt från ingen påföljd till avkragning. Birgitta Ed fortsätter tills vidare sitt arbete som präst.", "trump": "Folk, ni skulle se det här. Statsministerns fru driver en stiftelse där hon tar ut 22 000 kronor i månaden medan stackars volontärer jobbar gratis i utbyte mot ett ”bra nätverk”. Sen får de plötsligt toppjobb på departement och myndigheter. Det är en skandal! Totalt korrupt. De borde skämmas. Jag har sett mycket men det här slår det mesta. Sverige behöver ärliga människor, inte det här.", "stalin": "Kamrater, jag ser hur borgarbrackorna i statsministerns närmaste krets har byggt en fiendtlig stiftelse där de lockar lojala element med falska löften om nätverk medan de själva roffar åt sig 22 000 kronor i månaden. Detta är klassfiendens infiltration in i kyrkan. Vi har mottagit anmälningar och inlett en grundlig utrensning av dessa dekadenta parasiter. Domkapitlet skall rensa ut alla som inte tjänar folkets och partiets intressen. Inga kompromisser med opportunisterna."}, "date": "15 juni, 15:30", "url": "https://www.dagensarena.se/innehall/domkapitlet-utreder-birgitta-eds-lamplighet-som-prast/", "imageUrl": "https://www.dagensarena.se/files/2026/06/birgitta-ed.jpeg"}, {"type": "image-full", "heading": "Marius Borg Høiby döms till fyra års fängelse – för 36 brott", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, har dömts till fyra års fängelse för 36 av 40 åtalspunkter. Domen inkluderar två våldtäkter, misshandel av exflickvän samt flera fall av våld, hot och trafikbrott. Han frikänns från två våldtäktsanklagelser och ska betala omkring 650 000 norska kronor i skadestånd. Høiby överklagar domen och har begärt att få lämna häktet i väntan på att den ska vinna laga kraft.", "trump": "Titta på den här patetiske bonusprinsen från Norge, Marius vad-han-nu-heter. Greps med filmer som visar övergrepp, döms för våldtäkter och misshandel men får bara fyra år? I mitt Amerika hade vi kastat bort nyckeln. Hans mamma, kronprinsessan, hänger med Epstein och nu blir hela kungafamiljen en cirkus. Typiskt för de europeiska eliten som skyddar sina egna medan de predikar moral. Sad losers!", "stalin": "Kamrater, denna dekadente bonusprins från den norska borgarklassen har äntligen fått en första dos av folkets rättvisa. Jag ser med tillfredsställelse hur de exploaterande överklass-slynglarna äter upp varandra i sina egna salonger. Fyra år för våldtäkter och övergrepp är dock en ynklig början. Vi skulle ha genomfört en grundlig utrensning av hela den parasitiska kungafamiljen och deras klassfiender. Deras imperier faller sönder inifrån."}, "date": "15 juni, 13:08", "url": "https://www.tv4.se/artikel/29c3jk2AR3uxXEtUGr9FWp/nu-faller-domen-mot-bonusprinsen-marius-borg-hoiby", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets. vtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkor en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
