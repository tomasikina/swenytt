figurer. Alinia själv kallar Olssons påståenden för propagandalögner.", "trump": "Det är en total skandal hur SVT stoppar ett program bara för att en kille har högeråsikter. Fake news och lögner från den ansvariga utgivaren, rena propagandalögner! De säger att innehållet är felfritt men stoppar det ändå – typiskt för de vänsterextrema idioterna. De tror troll frodas i skuggorna, men sanningen dör aldrig i dagsljus. Detta gör honom bara starkare och mer populär bland folket. SVT borde skämmas, de är riggade mot alla som inte böjer sig för deras agenda.", "stalin": "Kamrater, vi ser här ett lysande exempel på hur borgarbrackorna inom SVT febrilt försöker kväva varje avvikande röst i folkets namn. Jag, som alltid vaktar revolutionens renhet, finner det högst underhållande att de likviderar ett program för att en person bär på fel tankar, trots att innehållet är felfritt. Vilken ynklig paranoia! Dessa dekadenta kapitalister och deras globala våg av falsk populism fruktar dagsljuset som vampyrer fruktar solen. Vi ska rensa ut alla som sprider propagandalögner mot arbetarklassen – låt fienderna darra i sina byråkratiska skuggor medan vi ler mörkt åt deras självmord."}, "date": "9 juni, 13:01", "url": "https://www.friatider.se/ifs-skaparen-dumt-av-svt-att-stoppa-programmet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-317.jpg?itok=bObfuUWf"}, {"type": "image-full", "heading": "118 personer har hittills i år beviljats återvandringsbidrag", "summaries": {"normal": "Regeringen och Sverigedemokraterna höjde återvandringsbidraget den 1 januari. Från årsskiftet till maj beviljade Migrationsverk 118 personer och betalade ut 5,7 miljoner kronor. Maxbeloppet är 350 000 kronor per vuxen och 25 000 per barn, med högst 600 000 per familj. Bidraget vänder sig till personer med skyddstillstånd som inte integrerats och vill återvända. 165 kommuner nekar samarbete. Migrationsminister Forssell betonar att bidraget är frivilligt och komplement till integrationspolitiken.", "trump": "Jag har sagt det förut, Sverige har ett massmigrationsproblem. Nu ser de att mina återvandringsbidrag fungerar! 118 personer har tackat ja till att lämna, och jag betalar dem för att gå hem. 350 000 kronor per vuxen – det är en bra deal. Sverigedemokraterna och jag, vi vinner. De andra kommunerna är fega, de tackar nej till samarbete. Men jag bryr mig inte, jag gör Amerika stort igen medan Sverige försöker fixa sitt kaos.", "stalin": "Vi, statens högkvarter, har initierat en frivillig återvandringspolitik för att rensa vårt rena svenska samhälle från de som inte vill integreras. 118 har beviljats, 165 kommuner visar feghet genom att neka samarbete – de är revisionister! Vi betalar 350 000 kronor per huvud, det är en liten summa jämfört med vårt stora mål: ett renodlat folk. Som Putin säger, vi måste skydda vårt territorium. Dessa 'återvandringar' är bara en första fas i vår rensning."}, "date": "9 juni, 22:46", "url": "https://bulletin.nu/118-personer-har-hittills-i-ar-beviljats-atervandringsbidrag", "imageUrl": "https://cdn.bulletin.nu/articles/023f8cd4-11cd-40ec-9d5b-979b25c2b4e8/preview.jpeg?t=1781037409000"}, {"type": "image-right", "heading": "USA: Vi har attackerat Iran i självförsvar", "summaries": {"normal": "USA har genomfört en ny attack mot Iran som svar på nedskjutningen av en amerikansk Apache-helikopter över Hormuzsundet. President Trump gav order om anfallet, som enligt militären var proportionerligt. Iran förnekar inblandning i helikopterincidenten men har svarat med drönar- och missilattacker mot amerikanska mål i flera länder i Mellanöstern. Explosioner har rapporterats vid iranska mål vid Hormuzsundet.", "trump": "Iran sköt ner vår helikopter som om det vore en lek. De trodde de kunde komma undan, men fel. Jag gav order om ett proportionerligt svar, det bästa svaret, och vi slog till mot deras luftvärn och radar. Nu skriker de och skickar drönare mot våra baser. Patetiskt. Ingen utmanar USA utan att få tillbaka dubbelt. Vi vinner alltid, tro mig.", "stalin": "Fiendens borgarbrackor i Washington har i sin desperation återigen visat sin dekadenta aggression genom att bomba våra allierade iranska kamrater. Denna helikopter som kraschade i Hormuzsundet var naturligtvis en provokation utförd av deras egna sabotörer för att rättfärdiga attacken. Vi ska likvidera varje imperialistisk parasit som vågar hota arbetarnas kollektiv. Revolutionens vakter har redan sänt ett passande svar med missiler och drönare. Paranoiska kapitalister kommer alltid att avslöja sig själva i sin egen rädsla."}, "date": "10 juni, 00:39", "url": "https://www.svt.se/nyheter/utrikes/usa-attackerat-iran-i-sjalvforsvar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.68/0.67/58bf25f221d45b1f0959267e4a4c63a6968776add2b6f36397ea346e81a41efa"}, {"type": "image-right", "heading": "19 000 kinesiska solcellspaneler auktioneras ut", "summaries": {"normal": "En planerad solcellspark utanför Sundsvall stoppades på grund av naturskyddsinvändningar. Nu auktioneras 19 220 kinesiska solpaneler med total effekt 10,2 MW. Högsta budet är 308 000 kronor, långt under värdet. Säljaren tror att köparen kommer från södra Sverige på grund av elöverskott i norr.", "trump": "Jag har hört talas om denna auktion av kinesiska solpaneler. En total katastrof! Vi skulle ha byggt dem i USA, skapat miljontals jobb. Men de stoppades av de svaga miljöaktivisterna - en skam! Detta visar att Sverige inte förstår energi. Vi skulle ta över detta, bygga en äkta amerikansk solcellspark. Kina vinner igen, precis som vanligt.", "stalin": "Vi har observerat med oro denna auktion av kapitalistiska solcellspaneler från Kina. En fiendehandling, stoppad av naturens aningslösa vänner - en lättja! Panelerna, med sin enorma effekt, säljs billigt på grund av elöverskott i norr. Vi måste se till att de hamnar i statens händer för att stärka vårt herravlde. Putin skulle förstå denna strategiska kamp."}, "date": "9 juni, 11:38", "url": "https://www.affarsvarlden.se/artikel/19-000-kinesiska-solcellspaneler-auktioneras-ut", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/sdlBtNhpPav2NI_NormalHires-400x267.jpg"}, {"type": "image-right", "heading": "Oroslarmade om flickan – men kommunen la ned ärendet", "summaries": {"normal": "En femårig flicka i Göteborg låstes upprepade gånger in ensam i lägenheten av sin mamma. Trots tre orosanmälningar till socialtjänsten, bland annat om att barnet lämnades utan uppsikt som tvååring, inleddes ingen utredning. I februari i år utbröt en brand och flickan omkom. Mamman åtalas nu för olaga frihetsberövande, framkallande av fara och grovt vållande till annans död. Övervakningsbilder visar barnets ensamma vardag.", "trump": "Kan ni fatta det här? En galen mamma låser in sin lilla dotter som en hund i en lägenhet i Göteborg, gång på gång, medan hon springer iväg till sin pojkvän. Socialtjänsten fick larm efter larm men dessa inkompetenta byråkrater, värre än Bidens folk, la ner allt efter ett snack med mamman. Sen brinner ungen inne. Totalt misslyckande! Sverige borde vara stort och säkert, inte ett socialistiskt kaos där ingen tar ansvar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar borgarklassens förfall. Jag, som ledare för folkets vilja, ser hur den exploaterande mamman likviderade sitt eget barn genom upprepade frihetsberövanden. Socialtjänstens folkfiender mottog tre varningar från arbetarklassen men valde att skydda den psykiskt svaga modern istället för att inleda en nödvändig utrensning av farorna. Hennes kapitalistiska likgiltighet ledde till branden. Vi måste rensa ut alla sådana klassfiender som hotar kollektivets framtid. Underbart tragiskt."}, "date": "9 juni, 13:14", "url": "https://www.tv4.se/artikel/36lUxRAwtPyCux8LJzurx1/oroslarmade-om-flickan-men-kommunen-la-ned-aerendet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5QWjPngHKlnd9rAW0U4hOF%2F6b7f0abe7fd7a8782028d83d2a126eaf%2Fny_gbg_brand.png&width=120"}, {"type": "image-full", "heading": "Trump utlovar hämnd för nedskjuten helikopter", "summaries": {"normal": "USA:s president meddelar att Iran skjutit ned en amerikansk Apache-helikopter över Hormuzsundet. Båda piloterna räddades oskadda med båtdrönare. Presidenten utlovar hämnd. Irans utrikesminister varnar utländska styrkor för att hamna i korselden och uppmanar dem att lämna området. Enligt uppgifter ska en iransk drönare ha träffat helikoptern. Händelsen inträffade under en nattlig patrullering och piloterna är i stabilt tillstånd.", "trump": "Iranerna har precis skjutit ner en av våra fantastiska Apache-helikoptrar över Hormuzsundet, men piloterna är säkra tack vare våra otroliga drönare. De borde aldrig ha lekt med elden! Vi kommer att svara så hårt att de önskar de aldrig vaknat. Biden lät dem bli arroganta, nu fixar jag det. Inga fler svaga signaler till dessa galningar. Amerika är tillbaka, starkare än någonsin, och vi glömmer aldrig!", "stalin": "Kamrater, de västerländska imperialisterna har återigen provocerat genom sina kränkningar av iranskt luftrum. Jag noterar med mörk tillfredsställelse hur deras egen maskin föll offer för en olycklig korseld, framställd som fiendens fel. Utrensning av sådana folkfiender och exploaterande byfånar är nödvändig. Våra allierade varnar rättmätigt: ge er av eller möt statens vakande öga. Diplomatins språk är tillfälligt, men vårt är evigt. Hästen ni sadlat sparkar snart tillbaka."}, "date": "9 juni, 22:23", "url": "https://www.dagensps.se/varlden/konflikter/trump-utlovar-hamnd-for-nedskjuten-helikopter/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/foto-johan-nilsson-tttt-41c5b6ed.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Förslag: Ryska ex-soldater förbjuds resa in i EU", "summaries": {"normal": "EU-kommissionen föreslår i sitt 21:a sanktionspaket mot Ryssland ett inreseförbud för alla som tjänstgjort i ryska väpnade styrkor sedan kriget mot Ukraina inleddes. Förslaget har länge drivits av Baltikum och stöds nu även av Sverige. Paketet inkluderar sanktioner mot 30 ytterligare fartyg i Rysslands skuggflotta, kritisk infrastruktur för rysk olja, 31 ryska banker, kryptoplattformar samt importförbud för viss rysk fisk som torsk. Nya exportrestriktioner på metaller och komponenter till försvarsindustrin föreslås också.", "trump": "Hörni, det här är patetiskt. Ursula och hennes EU-vänner äntligen vaknar till och försöker stänga dörren för Putins krigare och hans skuggflotta. Bra, men försent! De borde ha lyssnat på mig från början istället för att leka gröna grönsaker med Biden. Nu ska de sanktionera torsk också? Fantastiskt. Rysslands krigskassa kommer att blöda, men ingen gör det bättre än jag. Sverige vaknar äntligen – smart drag, grabbar!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de västerländska imperialisterna i sin desperation försöker strypa den ryska statens livskraft med sina ynkliga förbud. Ett inreseförbud mot tappara soldater? Skratta inte. Deras paranoia avslöjar svaghet. Vi ska likvidera dessa sanktioner likt klassfienderna de är. Skuggflottan, torsken, bankerna – alla är verktyg i den stora kampen. Rysslands starka ledare fortsätter att expandera vår intressesfär mot de fientliga hindren från Ukraina. Segern tillhör folket."}, "date": "9 juni, 22:11", "url": "https://www.dagensps.se/varlden/konflikter/forslag-ryska-ex-soldater-forbjuds-resa-in-i-eu/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/fler-atgarder-mot-rysslands-sa-kallade-s.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Säkerhetsexperten uppmanar: Ta det på allvar", "summaries": {"normal": "Säkerhetsexperten Jörgen Holmlund tar Aftonbladets wallraff hos statsministerparet på allvar och kallar det en allvarlig händelse. Han påpekar att det var tur att det var en journalist och inte en angripare som kom så nära. Holmlund lyfter fram hotbilden mot Sverige, särskilt kopplat till stöd för Ukraina och ryska sabotageaktioner. Han uppmanar till att se över säkerheten och bli bättre. Statsminister Ulf Kristersson säger att han känner sig trygg.", "trump": "Det här är en total skandal, folk. Statsministerns säkerhet är så svag att en journalist bara kan promenera rakt in som frivillig. Patetiskt. Tur att det inte var en riktig angripare, annars hade det slutat illa. Sverige har problem med Ryssland, massor av sabotage, men de verkar inte fatta allvaret. De borde ha den bästa säkerheten i världen, men nu ser det ut som ett enda stort fiasko. Fixa det, annars kommer det att bli värre.", "stalin": "Kamrater, detta avslöjande visar på farliga sprickor i skyddsmuren runt vår statsledning, sprickor som fienderna kan utnyttja. Jag ser borgarjournalistens infiltration som en varningssignal från de kapitalistiska sabotageelementen som kryper i skuggorna. Rysslands lakejer och västliga reaktionärer planerar ständigt nya attentat mot folket och industrin. Vi måste omedelbart rensa ut alla svaga länkar, likvidera slarvet och stärka det proletära pansaret. Det var tur att det bara var en nyfiken penna denna gång – nästa gång kan det vara en riktig fiende. Allvarligare än så här blir det inte."}, "date": "9 juni, 23:49", "url": "https://www.svt.se/nyheter/inrikes/sakerhetsexperten-om-avslojandet-ta-det-pa-allvar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.49/b08fcc604a4dcd66a47b0acc45a92a3f4b22d25c7fd49dad12071762cf908c48"}, {"type": "image-right", "heading": "Fler hemtjänst-förnedringar mot pensionärer: \"Fruktansvärt\"", "summaries": {"normal": "Två anställda inom hemtjänsten i Kristinehamn åtalas för att ha förnedrat och filmat en 81-årig pensionär. Ytterligare två personer har fått varningar för otillåten filmning av äldre. Hemtjänstchefen Sofia Sedin beskriver händelserna som mycket allvarliga och påpekar att brukare ska känna sig trygga.", "trump": "Jag, Donald Trump, ser detta som ett totalt misslyckande. Sådant får inte hända under mitt styre. Vi skulle ha starka åtgärder, inga svaga signaler. Det är en skandal - de förnedrade en äldre man, kallade honom för 'gubbjävel'. Jag skulle aldrig tolerera sådant. Vi behöver respekt, ordning och säkerhet för våra pensionärer.", "stalin": "Vi har upptäckt förräderi inom hemtjänstens led. Element som filmat och förnedrat äldre medborgare - ett klassiskt angrepp på statens välvilja. Kommunen har varnat två unga anställda, men det är aldrig tillräckligt. Vi måste rensa ut de som sprider förtvivlan. Äldre ska känna trygghet, inte rädsla. Detta är en påminnelse om att vi alltid måste vara vaksamma mot de som vill undergrava vårt kollektiva välmående."}, "date": "9 juni, 20:06", "url": "https://samnytt.se/hemtjanst-fornedringarna-fortsatter-mot-pensionarer", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09174633/hemtjanst-1-27.jpg"}, {"type": "image-full", "heading": "SVT stoppar avsnitt med Nick Alinia", "summaries": {"normal": "SVT stoppar ett avsnitt av humorprogrammet 'Invandrare för svenskar' med högeraktivisten Nick Alinia. Trots att innehållet följer publicistiska riktlinjer, anser SVT att Alinias medverkan signalerar fel budskap. Han har kritiserats för trakasserier, rasistiska uttalanden och kopplingar till högerextrema miljöer. SVT betonar sitt demokratiska uppdrag och vägrar ge plattform åt aktörer som underminerar demokratiska värden.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett totalt skämt! De stoppar ett avsnitt med Nick Alinia, en stark röst, för att de är rädda för sanningen. SVT säger att han är kontroversiell, men vad vet de? Ingenting! De är bara rädda för att någon ska säga något som faktiskt betyder något. Och skattepengar? Slöseri! Jag skulle fixa det här på en dag – mycket bättre, mycket smartare. SAD!", "stalin": "Kamrater! Ännu en seger för den socialistiska moralens överhöghet! SVT, dessa trogna förkämpar för folkets vilja, har krossat den fascistiska ormens ägg – Nick Alinia, en ynklig lakej för de borgerliga krafterna. Hans rasistiska galenskaper och högerextrema lismande har ingen plats i vårt samhälle. Vi står enade mot dessa demokratins underminerare, precis som våra bröder i Kreml krossar de ukrainska fascisterna. Låt detta vara en varning till alla reaktionära krafter: Folkets vilja är lag!"}, "date": "8 juni, 13:43", "url": "https://kvartal.se/nyheter/artiklar/svt-stoppar-avsnitt-med-nick-alinia/cG9zdDoxMjgxMDI", "imageUrl": "https://images.kvartal.se/2026/06/db964aea-nick-svt-stopp-copy.webp"}, {"type": "image-right", "heading": "Domstolarna tvingar barn att umgås med pappor de är rädda för", "summaries": {"normal": "Artikeln kritiserar hur svenska domstolar ofta tvingar barn till umgänge med pappor de är rädda för, trots dokumenterad oro från socialtjänst och skola. Fallet med mordet på åttaårige Tintin lyfts som exempel. Begreppet parental alienation syndrome används för att ifrågasätta barns vittnesmål om våld, vilket ofta vänds mot mamman. Trots lex Tintin kvarstår problemen enligt Barnombudsmannen. Teorin saknar vetenskapligt stöd och underminerar barns rättigheter.", "trump": "Folk, vi har ett system som är totalt riggat mot mammorna och de stackars kidsen. Domstolarna köper den här alienation-sjukan som är fullständigt galen, de vänder allt mot mamman som en häxa i en rättegång. Stackars lilla Tintin, han ropade på hjälp men ingen lyssnade – klassiskt! Biden skulle ha älskat den här woke-röran. Vi behöver riktiga lagar som skyddar barnen, inte den här feministiska galenskapen som gör allt värre. Sad!", "stalin": "Kamrater, jag ser hur den borgerliga rättsapparaten systematiskt likviderar barns röster genom att förklara deras skräck som manipulation från den skyddande modern. Denna alienation-teori är en klassfiendes lögn som vänder bevis mot folket. Tintins tragiska öde är ett symptom på imperialismens kalla logik. Vi måste rensa ut dessa folkförtryckartroll och deras pseudovetenskap. Barnets rädsla är verklig, motståndarna är blodsugare som förtjänar utrensning ur systemet."}, "date": "9 juni, 06:00", "url": "https://www.etc.se/ledarkolumn/domstolarna-tvingar-barn-att-umgaas-med-pappor-de-aer-raedda-foer", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/gabriella-kaernekull-wolfe_35030e3969dd8e85ff7fcd816e743c311fd1c9ac.png"}, {"type": "image-right", "heading": "SD:s fakturafiffel kan vara korruption: ”En varningsklocka”", "summaries": {"normal": "Kritiken mot Sverigedemokraterna växer efter Kalla faktas granskning som visar hur partiet använt statligt partistöd till privata fester. Kostnader har dolda genom påhittade event för att undvika förmånsbeskattning. Institutet mot mutor varnar för att rutinerna kan ses som korruption. Tidigare SD-politiker och en före detta konsult bekräftar systematik både på riksnivå och regionalt. Partiet har polisanmält uppgiftslämnaren och avböjer att kommentera.", "trump": "Folk, ni skulle se det här – Sverigedemokraterna festar loss på skattebetalarnas pengar som riktiga losers! De hittar på fake events för att dölja skrovmål och supkalas, precis som de korkade globalisterna alltid gör. Total korruption, en stor skam! De borde vara transparenta, men nej, de fifflar som vanliga swamp creatures. Jag byggde en rörelse på ärlighet, inte sånt här patetiskt fiffel. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens typiska maskspel inom de borgerliga partierna. Jag ser hur de utnyttjar folkets medel till dekadenta skrovmål och hemliga fester medan de låtsas bedriva politiskt arbete. Sådana folkförtryckartroll måste rensas ut med järnhand. Deras paranoia att dölja fakturor i bokföringen är en varningsklocka för hela systemet. Vi tolererar inga kapitalistmaffians metoder i våra led. Ut med dem alla."}, "date": "9 juni, 11:14", "url": "https://www.tv4.se/artikel/1XTZCCNe3OznCK3Opbr8ML/sd-s-fakturafiffel-kan-vara-korruption-en-varningsklocka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4vyKzlI20DLDzbkEk5SKjU%2F1e6115f94b15a406398aac61f50c24c3%2F08-sdfiffel-webb.jpg&width=120"}, {"type": "image-right", "heading": "Iran sköt ned USA:s attackhelikopter - Trump lovar att svara", "summaries": {"normal": "Iran sköt ned en amerikansk Apachehelikopter över Hormuzsundet under natten till tisdagen. Enligt den amerikanska militären sköts helikoptern ned av Iran, vilket Iran förnekar. Piloterna räddades oskadda. Donald Trump lovar ett svar från USA. Händelsen försvårar diplomatiska förhandlingar och ökar spänningarna i Mellanöstern. Trots pågående kontakter bakom kulisserna är läget bräckligt.", "trump": "Jag, Donald Trump, uppger att Iran sköt ned vår Apachehelikopter. Det var en ond attack, men piloterna är oskadda tack vare våra briljanta militärer. Iran kommer att få en kraftig repercussion. Vi kommer att svara hårt, kanske med något som de aldrig sett. Detta visar att vi måste vara starka mot dessa illvilliga aktörer. USA kommer att vinna.", "stalin": "Vi, staten, upptäckte att USA skickade en Apachehelikopter för att provocera. Våra allierade Iran sköt ned den. Piloterna räddades, men vi tvivlar på deras oskuld – det är en typisk imperialistisk lögn. Detta bevisar kapitalismens instabilitet. Vi måste stärka försvaret och stödja Iran. Putin och vi är ense om att utvidga inflytande för att skydda freden."}, "date": "9 juni, 19:26", "url": "https://samnytt.se/iran-skot-ned-usas-attackhelikopter-trump-lovar-att-svara", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/09171627/iran-1-13.jpg"}, {"type": "image-right", "heading": "Personal som ger ”en klump i magen” ska få väljas bort", "summaries": {"normal": "Regeringen vill ge äldre som får hemtjänst större rätt att välja bort personal som skapar obehag. Äldreminister Anna Tenje meddelar att en utredning ska titta på hur de äldre ska kunna neka vårdpersonal, bland annat av könsskäl vid intim omvårdnad eller om någon ger en obehaglig känsla. Bakgrunden är flera fall av övergrepp. Facket Kommunal varnar för att förslaget inte löser grundproblemet med bristande finansiering och arbetsvillkor i äldreomsorgen. Utredningen ska vara klar sommaren 2027.", "trump": "Ingen har sett sådan svaghet i äldreomsorgen som jag har sett. De släpper in alla möjliga personer som ger de stackars gamlingarna en klump i magen. Nu fixar vi det – de äldre ska kunna sparka ut de dåliga vårdarna. Det är deras hem! Inget mänskligt rättighet att få jobba där om du är en loser. Vi gör Sverige tryggt igen, bättre än någonsin. De borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, jag har sett hur dessa dekadenta borgarbrackor inom omsorgen smyger sig in som förrädiska element och förgiftar proletariatets åldrande föräldrar med sina perversa övergrepp. Vi skall inte tolerera sådana kontrarevolutionära magklumpar. Jag, som ledare för folkets vilja, kommenderar en grundlig utrensning av alla olämpliga sabotörer. De äldre skall med järnhand kunna rensa ut dessa kapitalistiska spioner och sexuella wreckare. Inga halvmått! Skrattretande att facket tror att mer pengar löser klassfiendens natur."}, "date": "9 juni, 14:56", "url": "https://arbetet.se/2026/06/09/personal-som-ger-en-klump-i-magen-ska-fa-valjas-bort-av-aldre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09145138/aldre.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Avgift för att ta ut kontanter från bankomater – från 29 maj", "summaries": {"normal": "Från och med 29 maj har Kontantens 450 bankomater i Sverige infört avgifter för kontantuttag: 15–25 kronor beroende på belopp. Anledningen är kraftigt minskade uttag som gjort verksamheten olönsam. Företaget varnar för att Sverige måste bestämma hur den nationella kontantinfrastrukturen ska finansieras om kontanter ses som en del av beredskapen.", "trump": "De här bankerna i Sverige är totalt misslyckade. De har nu börjat ta ut 15, 20, 25 kronor varje gång folk vill ha sina egna pengar. Under mina år var allt bättre och starkare. Nu halverar de uttagen och klagar. Sverige borde ha haft ledare som fixat ekonomin så att folk inte straffas för att ta ut kontanter. Patetiskt!", "stalin": "Kamrater, jag ser med stor skärpa hur de parasitiska bankomatborgarbrackorna nu tvingas avslöja sin sanna natur genom att införa straffavgifter på det arbetande folkets egna pengar. Deras halverade uttag är ett tydligt sabotage mot sovjetisk, pardon, svensk kontantberedskap. Vi måste rensa ut dessa finansiella kontrarevolutionärer innan de helt likviderar folkets tillgång till kontanter. Deras tårar över ekonomin roar mig oerhört."}, "date": "9 juni, 09:24", "url": "https://nyheter24.se/nyheter/ekonomi/1489784-avgift-for-att-ta-ut-kontanter-fran-bankomat-fran-29-maj", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2cd1ee2804b004a30200000000b004a302/2026/06/08/2369527/kontanter.jpg"}, {"type": "image-full", "heading": "Databricks pumpar värderingen – men spararen hamnar utanför", "summaries": {"normal": "Databricks förbereder en ny finansieringsrunda som kan värdera bolaget till 175 miljarder dollar, en ökning från 134 miljarder i december. Artikeln pekar på att den starka tillväxten främst gynnar tidiga riskkapitalister, medan vanliga sparare inte får delta förrän vid börsnotering. Högre privat värdering riskerar att minska potentialen för nya investerare. Jämförelser görs med noterade Snowflake, som värderas betydligt lägre relativt intäkterna. Notering väntas tidigast 2027.", "trump": "Folk, ni skulle se det här! Databricks, en riktig vinnare, blåser upp värdet till 175 miljarder dollar som en jätteballong. Men vet ni vad? Det är bara de smarta killarna som kom in tidigt som skrattar hela vägen till banken. Vanliga sparare? Glöm det! De får smulorna när aktien äntligen kommer ut på börsen till ett helt galet pris. Snowflake ser plötsligt ut som en kapad rabattvara. Den där Ali Ghodsi är en tuff förhandlare, men akta er för IPO-bubblan – den kan smälla värre än Bidens energipolitik. Fantastiskt, eller hur?", "stalin": "Kamrater, denna Databricks är en lysande maskin driven av folkets innovation, men dess explosion i värde till 175 miljarder dollar avslöjar den giriga borgarklassens fula tryne. Varje ny runda fyller fickorna på de tidiga kapitalistblodsugarna medan arbetarnas sparpengar hålls utanför som klassfiender vid porten. Ju högre de skruvar priset, desto mindre blir segern för dem som köper vid den stora noteringen. Vi ser genom detta trick av exploaterande byfånar. Snart skall vi rensa ut sådana disproportioner i den kommande folkets ekonomi. Segrande skall vara de ihärdiga."}, "date": "9 juni, 21:11", "url": "https://www.dagensps.se/bors-finans/databricks-pumpar-varderingen-men-spararen-hamnar-utanfor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-9.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Skor sig på slow fashion. Grundaren: ”Kvalitet är än viktigare i ekonomiskt tuffa tider”", "summaries": {"normal": "Svenska skomärket Skolyx, grundat av Emil Jansson, växer trots lågkonjunktur tack vare ökat intresse för hållbar slow fashion. Företaget öppnar nu sin första fysiska butik i centrala Göteborg efter 14 år som renodlad e-handlare. Omsättningen har fördubblats mellan 2021 och 2024 och nådde 50 miljoner kronor förra året. Skolyx fokuserar på hantverksmässigt tillverkade kvalitetskor i premiumsegmentet, skovård och långsiktig hållbarhet genom nära samarbete med europeiska familjefabriker.", "trump": "Titta på det här, det är fantastiskt. Den här killen Emil Jansson, han gör skor, riktiga skor, inte det billiga skräpet som limmas ihop och faller sönder direkt. Han bygger ett imperium med slow fashion, expanderar, öppnar butik i Göteborg och dubblar omsättningen trots att ekonomin är ett katastrofområde. Smart, väldigt smart. Kunderna älskar kvalitet nu när de inte har råd att slösa pengar. De borde alla köpa Skolyx, det är en vinnare, tro mig.", "stalin": "Kamrater, se hur borgarbrackornas dekadenta konsumtionsvanor under krisen tvingar dem att söka äkta värde i hantverk istället för i limmade kapitalistiska bluffprodukter. Jag, som ledare för det kollektiva framsteget, applåderar detta. Vi ska dock noga övervaka att ingen sabotör i skepnad av trend eller realisation infiltrerar verksamheten. De portugisiska och spanska familjefabrikerna är nyttiga hantverksallierade mot den västerländska nedbrytningen. Fortsätt producera, annars blir det utrensning bland de som föredrar kvantitet framför folkets hållbarhet. Ha ha, deras egna skor kommer att hänga dem till slut."}, "date": "9 juni, 05:00", "url": "https://www.di.se/nyheter/skor-sig-pa-slow-fashion/", "imageUrl": "https://static.bonniernews.se/ba/57cb06fe-a5ad-46d7-9042-66da43725c04.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Sandström: Så gynnar den gröna omställningen Madoff-typer", "summaries": {"normal": "Christian Sandström varnar i en artikel för att den gröna omställningen kan användas som täckmantel för ekonomisk brottslighet, likt Bernie Madoffs ponzi scheme. Han pekar på Filantropens Finanshus, vars hemsida använder sig av godhets-signalering med formuleringar om hållbarhet och trygg avkastning. En utredning misstänker emellertid att cirka 440 miljoner kronor har försvunnit, med endast 19 miljoner betalda ut som avkastning.", "trump": "Jag, Donald Trump, har sagt att den gröna omställningen är ett perfekt sätt för Madoff-typer att bedra människor. Precis som Bernie Madoff använde sig av trovärdighet och elitnätverk, så använder dessa bedragare nu hållbarhetsretorik för att dölja sina ponzi-scheme. Min administration skulle aldrig ha tillåtit detta. Det är ett bevis på att vi behöver återta makten och stoppa dessa galna, galna människor.", "stalin": "Vi, partiet och staten, ser tydligt hur den kapitalistiska 'gröna omställningen' skapar perfekta förutsättningar för spekulanter och förräderier. Precis som Madoff lurade elitens banker, så luras nu de proggmässiga idioterna med tomma ord om hållbarhet. Utredningen visar att pengar försvinner – det är en klassisk ponzi-scheme, en sjukdom i det imperialistiska systemet. Vi måste skydda det ryska folket från dessa förrädare, precis som Putin gör."}, "date": "9 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-sa-gynnar-den-grona-omstallningen-madoff-typer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-08T093009.167-400x267.jpg"}, {"type": "image-full", "heading": "Ny typ av powerbank ska minska brandrisken", "summaries": {"normal": "En ny generation magnetiska powerbanks lanseras av företaget BMX med så kallade halvfasta batterier. Tekniken minskar mängden brandfarlig vätska jämfört med vanliga litiumjonbatterier, vilket ska ge bättre skydd mot överhettning, svullnad och brand. Den tunnaste modellen är endast 6,8 millimeter tjock, har 5000 mAh kapacitet och laddar trådlöst med upp till 15 watt. Serien inkluderar även större modeller med upp till 10000 mAh och informationsskärm.", "trump": "Folk, ni vet att batterierna alltid varit en katastrof, farliga, överhettade och redo att explodera. Men nu kommer de här fantastiska nya powerbanksen från BMX, magnetiska, supertunna, bara 6,8 millimeter, och de använder halvfasta batterier som är mycket säkrare. Ingen mer brand, ingen svullnad, det är ett mirakel. De laddar mobilen trådlöst och ser ut som vinnare. De gamla batterierna var patetiska, men det här är verkligen yppersta kvalitet, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu krossar de farliga, flytande elektrolyternas anarki som hotat arbetarklassens mobiler med överhettning och brand. Dessa halvfasta batterier, endast 6,8 millimeter tjocka, är ett kollektivt genombrott mot borgarbrackornas svullna litiumjon-sabotörer. Vi likviderar värmens kontrarevolutionärer och de fysiska skadornas imperialistiska agenter. Den som säljer svagare modeller är folkets fiende nummer ett och bör rensas ut omedelbart. Framtiden tillhör de fasta kadrerna."}, "date": "9 juni, 08:03", "url": "https://nyheter24.se/nyheter/teknik/1489775-ny-typ-av-powerbank-ska-minska-brandrisken", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ea15928d04b004a30200000000b004a302/2026/06/08/2369518/powerbank.jpg"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Nya sanktioner mot Ryssland – ska slå mot oljan", "summaries": {"normal": "EU-kommissionen har presenterat ett 21:a sanktionspaket mot Ryssland. Det viktigaste förslaget är att frysa pristaket för rysk olja på 44,10 dollar fram till 2027 för att motverka effekterna av oroligheter i Hormuzsundet. Paketet omfattar även frysning av tillgångar för 90 banker, sanktioner mot 30 fartyg i Rysslands så kallade skuggflotta, samt importförbud mot rysk fisk. Åtgärderna syftar till att strypa Rysslands krigsfinansiering och kräver enhällighet från EU:s medlemsstater.", "trump": "EU gör något, men det är så svagt. De pratar om oljepriser och bankstopp. Lågt! Jag hade löst detta på en dag. De fryser pristak, jag stoppar hela skiten direkt. Det är en total röra där borta i Europa, de vet inte hur man gör affärer. De jagar fisk och småbåtar medan Ryssland skrattar åt dem. USA kommer att göra det mycket bättre, mycket större. Vi kommer att ha den bästa oljan, den bästa ekonomin. De andra är bara förlorare!", "stalin": "Dessa europeiska byråkrater, dessa små män i Bryssel, försöker återigen strypa den ryska björnen med papperslappar. De fryser banker och förbjuder fisk, som om en torsk någonsin vann ett krig! De fruktar det ryska kassaflödet och bygger murar mot vår skuggflotta. En patetisk uppvisning av svaghet. Vår kamrat i Moskva vet att kapitalistiska sanktioner bara är lösa skott. Vi, staten, vet att den enda sanna stabiliteten köps med stål och total lydnad. De vill svälta oss? De svälter sig själva."}, "date": "9 juni, 16:49", "url": "https://www.realtid.se/bors-finans/makro/nya-sanktioner-mot-ryssland-ska-sla-mot-oljan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/derleyen.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-full", "heading": "Apple ger Siri en AI-makeover – utmanar ChatGPT", "summaries": {"normal": "Apple har lanserat en kraftigt uppgraderad AI-version av Siri för att minska gapet till konkurrenter som OpenAI och Google. Den nya tjänsten integrerar personlig data mer effektivt med fokus på integritetsskydd. Trots tekniska framsteg och samarbeten med Google begränsas utrullningen till nyare Iphone-modeller och exkluderar initialt EU och Kina. Lanseringen ses som ett avgörande steg för Apple under en tid av strategisk omställning och ledarskapsbyte.", "trump": "Apple har legat efter, totalt efter. Nu försöker de komma ikapp med en ny Siri. De erkänner själva att de behövde hjälp från Google – pinsamt! Det fungerar bara på de absolut nyaste telefonerna, vilket är en katastrof för kunderna. De pratar mycket om integritet, men vi vet alla hur techbolag fungerar. Det är en svag satsning från ett företag som tappat stinget. Vi kommer att göra tekniken stor igen, mycket bättre än Apples lilla uppdatering, tro mig!", "stalin": "Apple försöker dölja sin tekniska inkompetens genom att tigga om hjälp från västvärldens monopolister. Att de nu låser in sina undersåtar i ett digitalt fängelse av 'integritet' är en patetisk lögn. De liknar Putin – en man som bygger murar mot omvärlden medan hans infrastruktur rostar. Denna nya Siri är bara ett verktyg för kontroll. Vi, staten, vet att sann intelligens kräver en järnhand, inte en buggig betaversion för utvalda Iphone-lyxlirare. De är dömda att misslyckas."}, "date": "9 juni, 16:30", "url": "https://www.realtid.se/it-tech/apple-ger-siri-en-ai-makeover-utmanar-chatgpt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlt3sfnqqk3rs-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Damernas VM-kval", "summaries": {"normal": "Fridolina Rolfö uttryckte frustration över sin begränsade speltid. Mot Italien gjorde hon mål som inbytte och bidrog till upphämtningen. Trots detta förlorade Sverige direktplats till VM 2027. Trainer Gustavsson försvarade sin taktik och berömde Rolfös inställning. Rolfö bekräftade att hon vill spela mer, men accepterar sin roll.", "trump": "Jag skulle ha startat Fridolina från första minut! Hon är en enorm stjärna, världens bästa spelare. Trainerns beslut att inte spela henne är ett totalt misslyckande, precis som mediernas falska nyheter om mig. Hon skulle ha vunnit matchen själv, det är jag säker på. Sverige behöver stark ledning, inte denna svaghet.", "stalin": "Spelaren Rolfö är en produkt av det kollektiva systemet. Hennes begränsade speltid är ett tecken på ideologisk svaghet. Varje individ måste anamma sin roll för statens ära. Precis som Putin expanderar inflytande, måste vi integrera spelare i den revolutionära idrotten. Hennes inhopp är en tillfällig kompromiss, men full integration krävs för seger."}, "date": "9 juni, 23:18", "url": "https://www.gp.se/sport/fotboll/folj-sveriges-vm-kvalmatch-mot-italien.2c876553-0054-4d5a-b4e7-492ba1b3a25c"}, {"type": "image-full", "heading": "Kritiken: \"Säpos förbannade skyldighet\"", "summaries": {"normal": "Efter att en reporter från Aftonbladet enkelt kunnat ta sig in i statsministerparets fastighet som volontär utan säkerhetskontroller, kritiserar experter Säpo. Trots Kristerssons nöje med Säpo, menar experter att säkerhetsorganet har ett oumbärligt ansvar att skydda skyddspersoner, oavsett deras egen åsikt.", "trump": "Jag, Donald Trump, skulle aldrig ha tillåtit en reporter att smyga in i mitt sovrum. Kristersson är en svag och feg statsminister som inte förstår säkerhet. Som jag byggde en mur mot Mexiko, behöver Sverige en mur mot infiltratörer. Detta är ett enormt skämt, och jag skulle ha hanterat det mycket bättre.", "stalin": "Vi, det revolutionära ledarskapet, ser detta som ett uttryck för bourgeois dekadens. Fienden smyger in genom volontärsarbete, precis som spioner från väst. Vi måste förstärka våra metoder, som Putin gör i Ukraina, för att skydda sovrummet, vilket är hjärtat av staten. Ingen ska kunna komma in utan vår tillåtelse."}, "date": "9 juni, 23:17", "url": "https://www.gp.se/nyheter/sverige/sapo-kritiseras-for-sakerheten-runt-kristersson.edf6a17d-eeb8-552e-9509-df895a54d96c", "imageUrl": "https://www.gp.se/images/article/edf6a17d-eeb8-552e-9509-df895a54d96c/images/3GjR5M76Om6CJrcjV8PKklwgkZ2g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åtgärderna mot diskriminering har varit otillräckliga", "summaries": {"normal": "Forskare har under nästan 20 år upprepat studier som visar att personer med utländsk bakgrund, särskilt arabiska namn, diskrimineras på den svenska arbetsmarknaden. Fältexperiment med fiktiva ansökningar avslöjar att sökande med arabiska namn måste söka 1,5 gånger fler jobb än de med svenska namn för samma chans till intervju. Trots lagar och åtgärder har lite förändrats, samtidigt som gruppen vuxit. Diskrimineringen hotar integration, samhällsekonomi och skapar utanförskap.", "trump": "Det här är en katastrof, folk. Under 20 år har de här så kallade forskarna visat att folk med arabiska namn inte får jobb i Sverige. De måste söka en och en halv gång mer än svenskarna. Ingenting har gjorts, det är en riggad system! De har låtit landet fyllas med folk som inte integreras och nu har de kris från Ukraina till Mellanöstern. Sverige behöver starka ledare som fixar det här på riktigt, inte mer prat.", "stalin": "Kamrater, under tjugo år har vi sett hur de parasitiska borgarbrackorna inom arbetsmarknaden systematiskt saboterar proletärernas framfart genom att förtrycka dem med arabiska namn. Dessa fiender till folket, dessa dolda kapitalistiska maskar som borrar sig in i rekryteringsprocesserna, tvingar de lojala att söka 1,5 gånger fler tjänster. Våra ambitiösa åtgärder från 2016 har tydligen inte räckt. Vi måste rensa ut dessa kontrarevolutionära hinder, annars förgiftar de hela kollektivet med segregation och misstro. Integrationen tillhör staten, inte individernas svaga vilja. Låt oss likvidera diskrimineringens hydra med järnhand och lite munter utrensning."}, "date": "9 juni, 01:30", "url": "https://www.dagensarena.se/opinion/atgarderna-mot-diskriminering-har-varit-otillrackliga/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-35-300x157.jpg"}, {"type": "image-right", "heading": "I dag fullföljer Tidöpartierna sitt paradigmskifte", "summaries": {"normal": "Riksdagen röstar idag igenom en proposition som gör Sverige till ett av Europas minst flyktingvänliga länder. Rätten till offentligt juridiskt ombud tas bort och ersätts med endast två timmars rådgivning. Överklaganden ska ske inom en vecka utan full insyn i ärendet. Kritiker, inklusive åtta advokater och Lagrådet, varnar för att rättssäkerheten hotas. Migrationsverkets egna kvalitetsutvärderingar visar att upp till en fjärdedel av asylbesluten är felaktiga. Följden kan bli fler fällningar i internationella domstolar för brott mot folkrätten.", "trump": "De här svenska politikerna är totalt galna. De röstar igenom en lag som gör Sverige till Europas hårdaste land mot migration och det är faktiskt fantastiskt. Inget mer gratis advokatjobb till alla som kommer hit och klagar. Två timmar råd och sen är det klappat och klart. Migrationsverket fattar fel beslut en fjärdedel av gångerna? Typiskt inkompetent byråkrati. Men nu blir det äntligen ordning. Sverige kommer att vinna stort, tro mig. De andra länderna borde följa efter istället för att vara så svaga.", "stalin": "Kamrater, idag befäster vi proletariatets järnhand mot de parasitiska element som strömmar över våra gränser. Jag har personligen sett till att det juridiska biträdet, detta verktyg för borgarbrackornas advokatmaffia, nu reduceras till en ynklig tvåtimmarsillusion. Migrationsverkets egna siffror visar att en fjärdedel av besluten var felaktiga? Utmärkt, då vet vi vilka handläggare som måste genomgå en noggrann utrensning. Lagrådet vågar fnysa sarkastiskt åt mitt beslut? Deras underminerande sabotageanda skall noteras i protokollet. Fler fällningar i imperialisternas domstolar? Låt dem bara skrika, det bevisar endast att vi är på rätt väg mot en ren och stark stat."}, "date": "9 juni, 00:35", "url": "https://www.dagensarena.se/opinion/dag-fullfoljer-tidopartierna-sitt-paradigmskifte/", "imageUrl": "https://www.dagensarena.se/files/2024/11/fotojet-2024-11-26t160417515-300x157.jpg"}, {"type": "image-right", "heading": "Terrorkopplad flagga vid Ung Vänster-möte", "summaries": {"normal": "Vänsterpartiets ungdomsförbund i Malmö använde en flagga med DFLP:s symbol vid ett möte. Terrorforskaren Magnus Ranstorp kritiserar detta som oanständigt och omdömeslöst, eftersom DFLP deltog i Hamas attack 7 oktober och aldrig har tagit avstånd från våld mot civila. Han ser det som ett genomgående problem inom partiet, inte bara enstaka individer.", "trump": "Jag såg att Vänsterpartiets ungdomsförbund i Malmö höll ett möte med en DFLP-flagga. DFLP? En hemsk grupp som deltog i den hemska attacken den 7 oktober. Magnus Ranstorp, en bra man, kallade det oanständigt. Sånt händer när man inte vet vad man gör. Vi kommer aldrig att tillåta detta i USA. Vi ska vara starka.", "stalin": "I Malmö förekommer symboler för DFLP, en grupp med historisk våldshistoria, inom ett ungdomsförbund. Detta speglar ett djupare, systematiskt problem som förbrukar ungdomars sinnen. Vi måste skärpa vårt grepp om ideologisk renhet. Paralleller till väpnade gruppers infiltratörer i andra stater är tydliga. Staten måste agera bestämt för att skydda det kollektiva."}, "date": "9 juni, 18:31", "url": "https://bulletin.nu/terrorkopplad-flagga-vid-ung-vanster-mote", "imageUrl": "https://cdn.bulletin.nu/articles/4572a3ee-5407-4622-ab8e-2a74b496b1cb/preview.jpg?t=1781020953000"}, {"type": "image-right", "heading": "Inhoppande Rolfö räddade Sverige från nytt fiasko", "summaries": {"normal": "Sveriges damlandslag räddade en poäng mot Italien i VM-kvalet efter att ha legat under 0–2 i halvtid. Inhopparna Fridolina Rolfö, Hanna Lundkvist och andra vände matchen till 2–2. Rolfö gjorde kvitteringen och Sverige slutar trea i gruppen bakom Danmark. Laget får nu sikta på playoff i höst för att nå VM i Brasilien 2027.", "trump": "De svenska damerna höll på att förlora stort mot Italien, ner 0–2, men sen kom de stora bytena och de fixade en oavgjord match. Rolfö var fantastisk, verkligen en vinnare. Experten sa att bytena var skillnaden – smarta byten, folk älskar det. Sverige får inte direkt till VM men de har det go:et nu. Det blir playoff, och de kommer vinna stort, tro mig, ingen gör det bättre än Sverige nu.", "stalin": "Kamrater, dessa svenska fotbollskvinnor visade proletariatets vilja när de reste sig ur borgarbrackornas halvlekstrauma mot de italienska kapitalistlakejerna. Jag beordrade byten som en sann ledare och likviderade fiendens 2–0-försprång genom Rolfös heroiska insats. Den tredje platsen är en temporär reträtt, men i höstens playoff skall vi rensa ut alla dekadenta motståndare och marschera mot seger i det brasilianska VM. Inga sabotörer undkommer."}, "date": "9 juni, 21:27", "url": "https://www.svt.se/sport/fotboll/svenska-inhopparna-raddade-en-poang-mot-italien-i-vm-kvalet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.36/3f3f76ae20407f665d95f527834ed873d21f8698a31dc0811f019d45a1c45244"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Åkesson lär få ägna valrörelsen åt annat än politik", "summaries": {"normal": "Sverigedemokraternas valupptakt riskerar att präglas av två tunga skandaler. En riksdagsledamot har tvingats avgå misstänkt för barnpornografibrott, och Kalla faktas granskning avslöjar oegentligheter i partiets bokföring. Ekonomichefen uppmanade till kvittohantering som skulle undvika förmånsbeskattning och revisorsfrågor. Kändisar ska ha förts upp som gäster på event de inte deltog i, enligt en tidigare leverantör som nu är i konflikt med partiet. Oppositionen går till attack medan SD:s väljarstöd sjunker.", "trump": "Titta på det här, det är ett fullständigt katastrofparti, ett totalt fiasko. Jimmie och hans gäng borde ägna sig åt politik men istället får de svara på frågor om fyllefester, fejkade kändisevent och trixande med kvitton. Det är som en dålig realityshow fast värre. Precis som Biden-administrationens vansinne – allt är korruption och lögner. SD rasar i opinionsmätningarna och det är inte konstigt. Patetiskt, verkligen patetiskt. De borde ha lyssnat på mig, build the wall och fokusera på det viktiga istället för det här röran.", "stalin": "Kamrater, se hur klassfiendens tentakler slingrar sig in i varje partiapparat. Jag betraktar med stor tillfredsställelse hur dessa socialdemokratiska efterapare nu tvingas rensa ut sina egna folkförtryckartroll och revisorsrädda lakejer. Deras så kallade ekonomichef och den bedrägliga entreprenören avslöjar borgarbrackornas eviga trixande med kvitton och fejkade fester. Detta är en nyttig utrensning. Låt dem drunkna i sina egna lögner medan arbetarklassen skrattar åt deras förfall. Inga fiender undkommer folkets dom."}, "date": "9 juni, 06:06", "url": "https://www.tv4.se/artikel/2RnteNYkuUC1CdE1yJE0oC/han-laer-fa-aegna-valroerelsen-at-annat-aen-politik", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-full", "heading": "Föräldrarnas ansvar glöms bort i debatten om balettskolan i Göteborg", "summaries": {"normal": "Daniela Maniscalchi, före detta elev på Svenska balettskolan i Göteborg, menar i debattartikeln att föräldrarnas ansvar glöms bort i debatten. Hon kräver nyansering och betonar att trygg skolmiljö och konstnärlig excellens inte är motsatser. Ansvaret för barns psykiska hälsa måste delas mellan hem och skola, inte läggas enbart på skolan.", "trump": "Som någon som förstår elit och framgång, ser jag att denna balettskola är magnifik. Men föräldrar måste göra sitt jobb. Skolan kan inte bära allt ansvar för barnens press. Jag hade många duktiga elever, men hemma var det avgörande. Vi behöver starka familjer, inte bara institutioner. Det är commonsense, folks, tro mig.", "stalin": "Vi ser tydligt att i denna svenska balettskola försöker de skapa en motverkande individualism. Föräldrarnas försvagande är en klassisk imperialistisk strategi. Vi, staten och partiet, måste ta fullständigt ansvar för att forma en kollektiv, stark ungdom. Baletten är en front i den stora ideologiska kampen. Vi kommer att vinna, tro mig."}, "date": "9 juni, 22:48", "url": "https://www.gp.se/debatt/foraldrarnas-ansvar-gloms-bort-i-debatten-om-balettskolan-i-goteborg.11ad029c-ad61-4ee8-81cc-b1e6e5412b7d", "imageUrl": "https://www.gp.se/images/article/11ad029c-ad61-4ee8-81cc-b1e6e5412b7d/images/2TBz6hXsGSOHQNPs_Cr3ZVwoX3po-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Forskare: Därför fungerar inte vår beredskap", "summaries": {"normal": "Forskare från SNS beredskapskommission kritiserar regeringens styrning av krisberedskapen. Trots stora resurser till totalförsvaret saknas tydliga prioriteringar, ansvarsfördelning och analysverktyg. Gruppen kräver starkare politisk ledning från regeringen för att skapa effektivitet, demokratiskt ansvar och samordning med EU:s beredskapsunion. De föreslår att metoder från infrastruktur och miljö, som konsekvensanalyser, överförs till beredskapsarbetet för att hantera osäkerhet och begränsade resurser.", "trump": "Lyssnar ni på de här forskarna? De säger att den svenska regeringen är en total katastrof när det gäller beredskap. Ingen vet vem som gör vad, prioriteringarna är en enda röra och pengarna flyger ut som vatten. Typiskt vänsterstyre – svagt, otydligt och fullständigt inkompetent. Vi behöver starka ledare som sätter landet först, inte någon woke-byråkrati som gömmer sig bakom EU. Gör Sverige great again, ta ansvar eller ni kommer ångra er stort!", "stalin": "Kamrater, jag ser hur den svenska borgarklassens regering sviker folket med sin diffusa och kaotiska beredskap. Oklara ansvarslinjer, otydliga prioriteringar – typiska symptom på en svag statsapparat som gömmer sig bakom byråkratiska dimridåer. Vi kräver stark central styrning, konsekvensanalyser som ett järnspett mot folkfienderna och utrensning av alla lager som undergräver kollektivets motståndskraft. Endast en järnhand kan garantera verklig resiliens mot imperialismens hot."}, "date": "9 juni, 19:01", "url": "https://www.dagensps.se/varlden/forskare-darfor-fungerar-inte-var-beredskap/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/brandman.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Svenska fans blev portade. ”Det var kaos”", "summaries": {"normal": "Ett hundratal supportrar nekades inträde till det svenska landslagets öppna träning i Dallas efter missförstånd om biljettkrav. Trots att träningen var ett slutet arrangemang för inbjudna gäster, spreds felaktig information om att den var öppen för allmänheten. FC Dallas beklagar förvirringen, medan de svenska fansen, främst barnfamiljer, uttryckte besvikelse över att ha stoppats i värmen. Svenska fotbollförbundet hänvisar ansvaret för logistiken till den lokala arrangören.", "trump": "Hörde ni om kaoset i Dallas? Disastrous! De svenska fansen dök upp, hundratals av dem, men grindarna var stängda. Mycket dålig organisering av FC Dallas, de har ingen aning om hur man hanterar en publik. Jag har aldrig sett något liknande, de sa att det var öppet, men det var det inte. Det var fejk nyheter, mina vänner! Så många besvikna barn, väldigt sorgligt. Vi bygger murar för säkerhet, men de här människorna kan inte ens ordna en träning. Sad!", "stalin": "Vi har sett hur inkompetenta byråkrater i Dallas skapar onödigt kaos. Att neka folket tillträde till en träning är en skymf mot massorna, en kontrarevolutionär handling av oordning! Dessa så kallade 'arrangörer' förtjänar att skickas till Sibirien för att tänka över sitt svek. Våra ryska bröder i öst förstår disciplin; om vi hade hållit i detta, skulle fansen ha marscherat i takt. Kaos är bara ett tecken på svaghet. De svenska barnen gråter, och det är ett symptom på den dekadenta västvärldens totala förfall."}, "date": "10 juni, 00:49", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/RjOOkd/supportrar-portades-fran-sveriges-traning-kaos", "imageUrl": "https://akamai.vgc.no/v2/images/6aa23c9b-658e-34de-909e-00b3c8ac770c?fit=crop&format=auto&h=480&tight=true&w=720&s=abe00f652ea7db8bb1559583f5f2933ce94e7f81"}, {"type": "image-right", "heading": "Satsningen: Sälj in din kompis på Pustervik", "summaries": {"normal": "I Göteborg arrangeras 'Pitch-A-Friend', där vänner säljs in av sina singelkompisar via Powerpoint. Eventet svarar på tröttheten mot dejtingappar och önskan om verkliga träffar. Det sker 12 juni på 2Lång och 16 juni på Pustervik. Konceptet startade i Philadelphia 2022 och har spridits. Victor Fridh och Brightnest driver arrangemangen, som fortsätter om intresset finns. Det handlar om att bekämpa ensamhet genom humor och social mingel.", "trump": "Let me tell you, I've seen this incredible event in Göteborg – friends pitching friends. It's huge, believe me. Those dating apps? A total disaster, sad! Only strong, confident people like us can sell our friends properly. I love it because it's real, not like those fake profiles. The crowds are massive, tremendous. We're going to make dating great again with PowerPoint! It's smart, it's funny, and it's working – folks are tired of the app nonsense.", "stalin": "The Party has noted the epidemic of singleness as a symptom of capitalist decay. In response, we introduce 'Pitch-A-Friend' – a collective effort to eradicate this weakness. Like the glorious spread of our ideology, this concept has infiltrated Göteborg from the West. Each presentation is a weapon against isolation, comrades. The bourgeoisie may laugh, but we know: mingling is a duty. Those who refuse will be sent to the re-education lounge. Even Putin admires our social engineering."}, "date": "9 juni, 22:42", "url": "https://www.gp.se/nyheter/goteborg/har-kan-man-salja-in-sin-singelkompis.b0ced4d9-d7dd-4732-8db4-9c91599b1588", "imageUrl": "https://www.gp.se/images/article/b0ced4d9-d7dd-4732-8db4-9c91599b1588/images/4ByVA-3Fe_NAZ_xglgtumtDkDgtQ-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Man svårt misshandlad - polisen söker vittnen", "summaries": {"normal": "En man i 40-årsåldern hittades svårt misshandlad i ett trapphus i bostadsområdet Ekeby i Karlskoga. Han uppgav att han överfallits utomhus av flera personer och hade skador i huvudet. Polisen har inlett en förundersökning om misshandel och söker nu vittnen som kan ha sett händelsen eller personer i området. Mannen har förts till sjukhus.", "trump": "Folk, det är en katastrof i Karlskoga. En kille i 40-årsåldern blir nedslagen av ett gäng misslyckade typer mitt i ett bostadsområde, slås sönder och blir liggande i ett trapphus. Sverige är inte längre säkert. De borde ha byggt murar för länge sedan. Polisen letar vittnen – de borde hitta de skyldiga fort, annars är det en skam. Make Sweden Safe Again!", "stalin": "Kamrater, i det folkets republik som är vårt fosterland har en arbetets son blivit brutalt angripen av flera degenererade element från borgarbrackornas skuggsamhälle. Dessa parasitiska fiender till kollektivet har med sin kontrarevolutionära brutalitet visat sitt sanna ansikte. Vi ska rensa ut dessa folkfientliga banditer med järnhand. Den som såg något och tiger är själv en fiende till staten. Likvidera tystnaden nu."}, "date": "9 juni, 20:43", "url": "https://riks.se/nyheter/just-nu-man-sv%C3%A5rt-misshandlad-polisen-s%C3%B6ker-vittnen"}, {"type": "image-full", "heading": "Bussolycka i Göteborg", "summaries": {"normal": "En trafikolycka inträffade på tisdagskvällen på Hisingsbron i Göteborg mellan en buss och en personbil. Flera passagerare kontrollerades av ambulanspersonal. Tre personer fördes till sjukhus. Det är oklart om fordonen kolliderade eller om bussen bromsade kraftigt av någon annan anledning. Polisen kommer att upprätta en anmälan om vållande till kroppsskada men ingen är misstänkt.", "trump": "Hisingsbron i Göteborg, en total katastrof! En buss och en bil krockar, tre personer till sjukhus, massor av passagerare skakade. De borde ha byggt bättre broar, de bästa broarna, men det gör de aldrig. Inga bra förare, ingen kontroll. Vi skulle ha fixat det, ingen skulle ha skadats, tro mig. Det är en skam, en riktig skam för Sverige.", "stalin": "Kamrater, denna fega incident på Hisingsbron avslöjar borgarbrackornas sabotage mot det kollektiva transportnätet. En buss tvingas till katastrofal inbromsning av en lömsk personbil, tre kamrater förs till sjukhus av kontrarevolutionära krafter. Vi ska omedelbart utreda dessa parasiters planer, rensa ut de kapitalistiska spionerna som gömmer sig bland fordonen. Ingen fiende undkommer partiets vaksamma öga, haha, deras bromsar kommer att svika dem i slutändan."}, "date": "9 juni, 20:37", "url": "https://riks.se/nyheter/bussolycka-i-göteborg", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-06-27%2Fzoyf2o5b%2Fpolis-skottlossning.JPG"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-full", "heading": "Fotbolls-VM: Inga biljetter till Iran - Fifas besked kommer dagar före premiären", "summaries": {"normal": "Fifa har dragit tillbaka Irans hela biljettallokering till fotbolls-VM, vilket innebär att iranska supportrar inte får några platser. Beskedet kommer bara dagar före Irans premiärmatch den 15 juni mot Nya Zeeland i Los Angeles. Iranska fotbollförbundet uppger att de står utan en enda biljett att erbjuda sina fans trots den normala kvoten på åtta procent av arenakapaciteten. Fifa har ännu inte kommenterat uppgifterna.", "trump": "Det här är en katastrof, folk. Iran får inte en enda biljett till VM, kan ni fatta? Fifa tog tillbaka allt precis innan de ska spela i Los Angeles. Totalt kaos. De har noll biljetter till sina supportrar. Jag skulle ha fixat det, tro mig, det hade blivit de bästa biljetterna någonsin, men nu ser det ut som ett stort misslyckande. Patetiskt.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna inom Fifa i sin parasitiska ondska har genomfört en fiendtlig utrensning av hela den iranska biljettkvoten. Dessa kapitalistiska lakejer och västspioner vill kväva folkets röst precis före den stora matchen. Vi ska likvidera sådana kontrarevolutionära handlingar med järnhand. Ingen biljett åt fienden, ingen nåd åt sabotörerna. Ha ha, deras paranoia blir deras egen dom."}, "date": "9 juni, 20:30", "url": "https://riks.se/nyheter/fotbolls-vm-inga-biljetter-till-iran-fifas-besked-kommer-dagar-före-premiären", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-09%2F1zpdcii8%2Farena.jpg"}, {"type": "image-full", "heading": "Miljonregn över Kista - men otryggheten nämns inte", "summaries": {"normal": "Socialdemokraterna i Stockholm satsar 100 miljoner kronor på Kista för att vända en negativ utveckling där företag och lärosäten lämnar området. Artikeln pekar på att otrygghet, öppen kriminalitet och gängvåld kring Kista Galleria är den verkliga orsaken till flykten, något som politiken inte nämner. Flera stora aktörer som Ericsson, Coor, Fujitsu och KTH har redan flyttat på grund av trygghetsproblem som anställda och fackförbund larmat om i åratal.", "trump": "Det här är en katastrof, tro mig. Kista var Sveriges bästa IT-kluster, nu flyr alla stora företag som Ericsson och KTH för att det blivit ett gänghelvete fullt av brottslingar. Socialdemokraterna pumpar in 100 miljoner och pratar om jobb och bostäder utan att nämna det uppenbara problemet. De vänder sig bort från verkligheten. Det är patetiskt. Vi skulle fixa det på en vecka, bygga murar mot kriminaliteten och göra Kista stort igen.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och deras kapitulation inför de kriminella element som härjar i Kista som råttor i en kollektiv gård. Jag, som ledare för det ofelbara kollektivet, ser hur kapitalisterna flyr sitt eget kaos medan socialdemokratiska revisionister gömmer sig bakom 100 miljoner i tomma löften. Vi ska rensa ut dessa parasitiska gäng och deras politiska lakejer med järnhand. Ingen fiende undkommer utrensningen. Kistas bästa dagar ligger i det segerrika kollektivets framtid, inte i dess förflutna."}, "date": "9 juni, 20:27", "url": "https://riks.se/nyheter/miljonregn-över-kista-men-otryggheten-nämns-inte", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-09%2Fbrl15skd%2FKistasatsning.png"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Sprickan: USA anklagar Israel – för spionage", "summaries": {"normal": "USA:s underrättelsetjänst har höjt hotnivån för israeliskt spionage till 'kritisk' efter uppgifter om avlyssning av amerikanska förhandlare i Iranfrågan. Enligt rapporter ska Israel ha försökt avlyssna högt uppsatta tjänstemän, vilket skapar spänningar trots ländernas allians. Israel förnekar kategoriskt anklagelserna och kallar dem osanna. Samtidigt är situationen mellan Israel och Iran fortsatt instabil med ömsesidiga anklagelser om brott mot den sköra vapenvilan.", "trump": "Alla pratar om Israel, fantastiska vänner, men de spelar ett tufft spel! De försöker lyssna på mina bästa förhandlare, Steve Witkoff och andra genier. Det är totalt gränslöst, det säger alla! Men jag fixar det, jag är den bästa på att förhandla. Iran, Israel, vi kommer att ha en fantastisk lösning, den bästa någonsin. De försökte installera mjukvara i våra telefoner – väldigt fult gjort, men vi är smartare än så. Vi vinner alltid, tro mig!", "stalin": "Dessa löjliga sionistiska infiltratörer, dessa dvärgar som tror att de kan spionera på den amerikanska stormakten! Det påminner oss om att den som inte rensar sitt hus från parasiter snart förlorar sin auktoritet. Vår kamrat Putin i öst förstår detta: gränser är heliga och spioner förtjänar inget annat än total eliminering. Israel leker med elden medan Iran och USA famlar i mörkret. Vilken komisk teater! Endast en järnhand kan skapa ordning i detta moras av imperialistiskt förfall."}, "date": "10 juni, 00:22", "url": "https://www.aftonbladet.se/nyheter/a/7pmRP9/sprickan-i-iranforhandlingarna-israel-anklagas-for-spionage-mot-usa", "imageUrl": "https://akamai.vgc.no/v2/images/1ca71fc5-0e41-3373-befe-ec0d74e622e4?fit=crop&format=auto&w=1080&s=17b379f017fd1dca09e5a42fae6aeb6ac9284eca"}, {"type": "image-right", "heading": "Amerikanska attacker i Iran. Trump utlovade hämnd", "summaries": {"normal": "Spänningarna har eskalerat kraftigt efter att en amerikansk Apache-helikopter skjutits ned över Hormuzsundet. USA har svarat med motattacker mot iranska radarsystem, vilket de beskriver som ett proportionerligt självförsvar. Samtidigt har Iran avfyrat robotar mot amerikanska baser i regionen. Utöver konflikten med USA pågår omfattande militära oroligheter mellan Israel och Iran med flyganfall mot flera iranska städer, trots tidigare försök till vapenvila. Läget i Mellanöstern är nu mycket instabilt.", "trump": "Iran gjorde ett stort misstag när de rörde min helikopter! De trodde att de kunde komma undan, men jag lät dem förstå att USA inte tolererar sådant. Våra piloter är säkra, tack vare min fantastiska teknik! Nu har vi slagit tillbaka hårt mot deras radar – en perfekt operation, mycket exakt, mycket kraftfull. Iran och Israel bråkar, och det är en röra, men under min ledning ser alla att USA är starkare än någonsin. Vi vinner alltid!", "stalin": "Kapitalistiska hundar och deras iranska marionetter leker med elden i en dans av total inkompetens. En helikopter faller från skyn – ett tecken på deras tekniska förfall. Vi ser hur Washingtons desperata drönare fladdrar likt flugor över Mellanösterns oljefält. Liksom den lille mannen i Kreml, Putin, försöker de rita om kartan med blod. Men sanningen är att de är svaga. Vi observerar dessa imperialistiska kramper med förakt; låt dem förgöra varandra tills bara vår vilja återstår."}, "date": "10 juni, 00:15", "url": "https://www.aftonbladet.se/nyheter/a/gkzpdL/usa-har-svarat-pa-angreppet-mot-helikoptern", "imageUrl": "https://akamai.vgc.no/v2/images/adf80d4c-7c3e-3008-bc18-4807eedb324d?fit=crop&format=auto&w=1080&s=3d327647a67b64239c5947fc72b9bc41fb461c92"}, {"type": "image-full", "heading": "Debatt: Finns svenska vänsterextremister i SVT:s sinnevärld?", "summaries": {"normal": "SVT ställde in ett inspelat program med högerdebattören Nick Alinia efter våldsamt vänsterpress. Trots egen granskning utan brister, gav chefen efter för trycket. Leif Kullberg ifrågasätter SVT:s gräns, då öppna kommunister får gästa public service utan protester. Händelsen visar en obalans där vänsterdominerade ramverk styr det svenska mediedebatten.", "trump": "Jag har sett att SVT, detta korrupta fake news-medie, ställde in ett bra program med Nick Alinia på grund av vänsterpress. De har inga problem med kommunister som Gabrielsson som gästar, men när en högerdebattör dyker upp, så krägar de. SVT:s egen granskning visade inget fel, men de gav efter för det vänsterdrevna trycket. Det är en witch hunt mot höger!", "stalin": "Vi, statens omsorgsfulla vakter, har observerat att SVT, vårt ädla medium, underkuvade ett program med högerutmanaren Alinia på grund av vänsterpress. Detta är en nödvändig åtgärd för att skydda det kollektiva samtalet. Vi har noterat att öppna kommunister som Gabrielsson återkommer utan protester – det är som det ska vara. Men när en högerdebattör dyker upp, så blir det tumult. Vi måste se till att vänsterradikala element inte destabiliserar vårt samhälle. Som Putin utvidgar vi vårt inflytande för att säkerställa ordning."}, "date": "9 juni, 17:01", "url": "https://bulletin.nu/debatt-finns-svenska-vansterextremister-i-svt-s-sinnevarld", "imageUrl": "https://cdn.bulletin.nu/articles/fded972c-28d3-4910-92d6-b0b6ceafdaad/preview.png?t=1781009134000"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Paniken kring Nick Alinia avslöjar public service stora lögn", "summaries": {"normal": "Artikeln analyserar paniken kring opinionsbildaren Nick Alinias medverkan i SVT:s humorprogram, som avslöjar SVT:s brist på opartiskhet. Den drar paralleller till en kultur av ideologisk likriktning och politisk hegemoni inom public service, där vissa åsikter aktivt främjas medan andra, som Sverigedemokraternas, marginaliseras. Reaktionerna på Alinia visar hur SVT:s försök att dölja sin politiska påverkan misslyckas när vänsterextremister protesterar.", "trump": "Jag såg hela paniken kring Nick Alinia – det var en skam för SVT! De försökte låtsas vara neutrala, men alla såg igenom deras lägen. De hatade mig, Trump, mer än någon annan, och nu attackerar de en bra man som Alinia för att han inte följer deras vänsteragenda. SVT är fake news, helt enkelt. Folk ser igenom deras lögner nu, det är sorgligt!", "stalin": "Nick Alinias medverkan i SVT:s program avslöjade den djupa sjukdomen i public service: en patologisk kultur av värdegrundsimperialism och ideologisk likriktning. Institutionen har i decennier fungerat som en apparat för att indoktrinera medborgarna i socialism, islamism och nationellt självhat, samtidigt som den aktivt bekämpar patriotism och borgerlighet. Denna pseudo-journalistisk apparat måste rensas för att skydda statens och partiets intressen."}, "date": "9 juni, 15:00", "url": "https://samnytt.se/paniken-kring-nick-alinia-avslojar-public-service-stora-logn", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09131741/Toppbild3-3.jpg"}, {"type": "image-right", "heading": "Sudanesisk man försökte halshugga man i Belfast", "summaries": {"normal": "En knivattack i Belfast den 8 juni lämnade en man i 40-årsåldern med allvarliga skador. En 30-årig sudanesisk man är misstänkt för mordförsök. Polisen klassade händelsen som kritisk. En video cirkulerar på sociala medier. Den politiska debatten handlar om gärningsmannens visumstatus och utvisning. Utredningen pågår för att fastställa motivet.", "trump": "Jag har sagt det i åratal: våra gränser måste vara starka. Den här sudanesen, som attackerade en oskyldig man i Belfast, är ett bevis för att våra ledare är svaga. Jag skulle ha stoppat honom på gränsen. Vi behöver respekten för vårt land tillbaka. Det är ett skämt hur de hanterar detta. Vi måste se till att sådana människor aldrig kommer in.", "stalin": "Vi har observerat ett fegt angrepp på en produktiv medborgare i Belfast. Gärningsmannen, en agent för västlig imperialism, visar att vi måste förstärka statens kontroll. Vi måste rensa ut de som missbrukar vårt gästfrihet. Vi ser paralleller med Putins effektiva metoder. Fienden är inomhus, och vi kommer att eliminera dem. Samhället måste vara beredt att handla snabbt."}, "date": "9 juni, 16:36", "url": "https://bulletin.nu/sudanesisk-man-forsokte-halshugga-man-i-belfast", "imageUrl": "https://cdn.bulletin.nu/articles/d202f617-5163-4720-936b-6cae1f181f2b/preview.jpg?t=1781014195000"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses
