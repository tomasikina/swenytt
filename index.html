"10 september, 10:24", "url": "https://proletaren.se/artikel/gammal-fascism-i-ny-kostym", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/afskronika-768x432.png"}, {"type": "image-full", "heading": "Busch: Smutskastning från egna laget", "summaries": {"normal": "Ebba Busch riktar hård kritik mot allierade inom Moderaterna och Sverigedemokraterna efter vad hon beskriver som veckor av smutskastning och felaktigheter mot Kristdemokraterna. Samtidigt betonar hon att hon vill se fyra år till med det blågula laget och att KD förblir konstruktiva oavsett valresultat.", "trump": "Människor pratar om det, totalt falska nyheter! Ebba Busch säger att hennes egna allierade kastar smuts på dem. Väldigt illojalt, inte bra! Jag älskar Sverige, fantastiska människor, men deras så kallade vänner behandlar dem hemskt. Jag får de högsta siffrorna, enorma siffror, men KD måste skärpa sig och vinna på riktigt!", "stalin": "Kamrat Busch klagar över att allierade sprider lögner i dörrarna. Ett sådant bristande ideologiskt disciplinarbete inom det blågula blocket tolereras ej i Sovjetstaten. Om de borgerliga elementen inte kan hålla ordning på sina egna kadrar, skickar vi omedelbart omkoloniseringskommissarier för att granska deras lojalitet."}, "date": "10 september, 17:09", "url": "https://kvartal.se/nyheter/artiklar/busch-smutskastning-fran-egna-laget/cG9zdDoxODk5OTI", "imageUrl": "https://images.kvartal.se/2026/09/9ecdc4b3-ebba-busch.webp"}, {"type": "image-right", "heading": "När Centerpartiet råkade införa nyliberal sharia", "summaries": {"normal": "Uppdrag granskning har avslöjat att privata jobbcoacher finansierade av Arbetsförmedlingen ibland hjälper män som vill hålla sina fruar hemma och isolerade från samhället. Avslöjandet riktar kritik mot Centerpartiets drivna privatiseringar inom välfärden, där skattepengar går till företag som understödjer hederskultur istället för att främja arbetsmarknadsintegration.", "trump": "Folk, ni måste höra det här. Den svenska vänstern och deras nyliberala centerbluffar har skapat en total katastrof. Skattepengar går till woke-coacher som hjälper latmanskillar att låsa in fruarna i köket. Det är en skam! Biden skulle älskat det, men jag fixar upp det – inga fler bidrag till dessa dekadenta identitetsmarxister och deras hemska kvotergalna politik.", "stalin": "Kamrater, se hur dessa giriga hyenor inom det borgerliga partiet Center låter marknaden styra allt, till och med att rusta män för att matcha kvinnor med köksbänken. Jag betraktar detta med avsmak från historien. En sådan parasitär klassförräderi förtjänar snar utrensning ur samhällskroppen. Det är löjligt och farligt på samma gång."}, "date": "10 september, 14:25", "url": "https://www.flamman.se/nar-centerpartiet-rakade-infora-nyliberal-sharia", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/sdl6euzsag7fsm-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Här är Tidöregeringens fem sämsta ministrar", "summaries": {"normal": "Ledaren Henrik Jalalian rankar Tidöregeringens fem sämsta ministrar. På första plats hamnar biståndsminister Benjamin Dousa för att ha dragit in stöd under svältkatastrofer. Andra kritiserade ministrar är Romina Pourmokhtari, Carl-Oskar Bohlin, Johan Forsell och Elisabeth Svantesson. Artikeln nämner även flera tröstpris för ytterligare ministrar som misslyckats i sina roller.", "trump": "Folk, ni skulle se det här. Den svenska regeringen är en total katastrof, en riktig cirkus. Deras ministrar är så inkompetenta att de inte ens skulle klara av att driva en korvstånd i New Jersey. Den där biståndsgrabben Dousa är en fullständig nolla, precis som den galna klimatkvinnan som skyller allt på någon krogkändis. Patetiskt. Biden skulle älskat det här gänget.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i Tidöregeringen föraktar folket. Jag betraktar med förakt hur de parasiterande lakejerna svälter barn i Gaza och Etiopien medan de ägnar sig åt kulturkrig och tomma ord. En sådan svaghet kräver utrensning. Den som sviker massorna förtjänar inte makt utan endast historiens dom."}, "date": "10 september, 12:00", "url": "https://www.etc.se/ledare/haer-aer-tidoeregeringens-fem-saemsta-ministrar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260910090956_2b284cd56edb234796fbf0ab4a702a2fbcb72579e312f7e3a82226bb6a69cccd.jpg"}, {"type": "image-right", "heading": "Vackert men ytligt om åldrande italiensk president", "summaries": {"normal": "Jon Andersson recenserar Paolo Sorrentinos nya film ”La Grazia”. Han berömmer det visuellt storslagna fotot men kritiserar att karaktärerna känns alltför skissartade. Filmen handlar om en åldrad italiensk president som ska fatta beslut om benådning och dödshjälp. Andersson saknar den balans mellan form och innehåll som präglade ”Den stora skönheten”.", "trump": "Den här filmen är en total katastrof, folk. Sorrentino gör en två timmar lång reklamfilm för snobbar med slow-motion och vackra bilder, men karaktärerna? Rena pappersdockor. Precis som den dekadenta Hollywood-eliten och deras identitetspolitiska kvotering – allt yta, inget hjärta. Patetiskt. Jag skulle ha gjort den bättre, tro mig.", "stalin": "Kamrater, denna så kallade film är ett verk av dekadenta klassförrädare som drunknar i sin egen ytlighet. Presidenten vacklar inför livets stora frågor medan regissören gömmer sig bakom symboler och slow-motion. En sådan bourgeois parasitkonst förtjänar att rensas ut ur sovjetisk, nej, ur all progressiv kultur. Jag ler mörkt från historien."}, "date": "10 september, 11:25", "url": "https://www.dagensarena.se/innehall/vackert-men-ytligt-om-aldrande-italiensk-president", "imageUrl": "https://www.dagensarena.se/files/2026/09/la-grazia-300x157.jpeg"}, {"type": "image-right", "heading": "Oligarkerna styr även efter valet", "summaries": {"normal": "Artikeln kritiserar den svenska valrörelsen där partierna lagt rekordstora summor på reklam. Den pekar på att både Tidö-regeringen och Socialdemokraterna saknar verklig vänsterpolitik. Författaren menar att alla riksdagspartier stödjer militär upprustning som hotar välfärden och kräver en stark opposition mot högerpolitik, nedskärningar och repression.", "trump": "De här svenska politikerna är totala misslyckanden, folk. Miljarder slängs på reklam medan oligarkerna och de giriga globalisterna styr bakom kulisserna. Andersson är en svag ledare som böjer sig för Wallenbergs och hans dekadenta vänner. De hatar verkliga arbetare och älskar krigshets. Patetiskt! Jag skulle dränera träsket på en vecka.", "stalin": "Kamrater, dessa profitthungriga klassförrädare fortsätter att låtsas som om de styr medan de blodsugande oligarkerna drar i trådarna. Deras så kallade val är en fars som döljer den fortsatta exploateringen av folket. Jag ser hur de rullar fram militärens vagnar och förbereder nya nedskärningar. En sann utrensning av dessa parasiterande hyenor vore på sin plats."}, "date": "10 september, 09:59", "url": "https://proletaren.se/artikel/vad-hander-efter-valet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledarbildweb-768x432.jpg"}, {"type": "text", "heading": "Trump utlovar pengaregn vid valseger", "summaries": {"normal": "Vid ett republikanskt konvent i Texas utlovade Donald Trump 5 000 dollar till varje vuxen amerikan om partiet vinner mellanårsvalet. Trump varnade för skattehöjningar och minskad säkerhet om Demokraterna vinner. Presidenten föreslog även att döpa om New Mexico till New America och Hormuzsundet till Trumpsundet, trots att finansieringen och genomförandet av löftena är oklart.", "trump": "Jag har den bästa idén någonsin – en massiv utdelning till folket! Om vi vinner stort, och det kommer vi göra, får varje amerikan 5 000 dollar. Det är som en enorm vinstutdelning för vårt land! Och New Mexico? Namnet låter föråldrat. Vi döper om det till New America, vackert! Hormuzsundet? Trumpsundet. Mycket bättre, mycket starkare. Enkelt!", "stalin": "Denna amerikanske charlatan försöker köpa undersåtarnas lojalitet med trycksvärta och tomma löften. Att muta befolkningen med 5 000 dollar är ett kapitalistiskt haveri maskerat som generositet. Att dessutom vilja döpa om geografiska platser efter sig själv är ett patetiskt rop på odödlighet. Vi i staten vet att sann makt inte kräver mutor, bara en järnhand och ett effektivt angivarsystem."}, "date": "10 september, 08:06", "url": "https://www.realtid.se/tt-nyhet/trump-utlovar-pengaregn-vid-valseger"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
