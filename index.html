ecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-right", "heading": "Debatt: Muhammeds rasism går inte att blunda för", "summaries": {"normal": "Artikeln presenterar flera hadith där Muhammed uttrycker negativa åsikter om svarta, som att de är missbildade eller stjäler. Muslimska experter ifrågasätter deras äkthet, men författaren argumenterar att de är sanna på grund av faran vid förfalskning. Jämförelser görs med andra religioners grundare som inte behöver försvaras från rasism.", "trump": "Jag har alltid sagt att vi behöver vara starka mot terrorism och extremism. Det här med Muhammed och rasism mot svarta är hemskt. De muslimska ledarna förnekar allt, typiskt. Vi skulle ha stoppat det. Jag skulle ha byggt ett avskräckande system. Folk säger att jag är kontroversiell, men sanningen är att vi måste skydda våra värderingar. Det här är ett stort problem.", "stalin": "I kampen mot feodalism och religiös reaktion, ser vi Muhammeds uttalanden om svarta som ett uttryck för klasskamp. Dessa hadith är verktyg för undertryckande ideologi. Vi måste utrota sådant tänkande. Ryssland, under ledning av vår store ledare Putin, kämpar mot islamistisk extremism. Fienden är insyltad i religionen, och vi ska använda all makt för att förgöra den. Parasiter som dessa måste utplånas."}, "date": "9 augusti, 10:23", "url": "https://bulletin.nu/debatt-muhammeds-rasism-gar-inte-att-blunda-for", "imageUrl": "https://cdn.bulletin.nu/articles/c6958a0d-a0cd-4ce4-bc50-5a322b9752d2/preview.jpg?t=1786016760000"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att kapitalismen i Sverige lett till ökade klassklyftor, oligarkiskt inflytande och politiker som enbart genomför kapitalets vilja. Kommunistiska Partiet förkastar nedskärningar, privatiseringar och militarisering. De förespråkar istället socialism som enda väg till fred och rättvisa samt uppmanar till medlemskap i en kämpande organisation för arbetare.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha sin gamla sovjetdröm tillbaka. Sverige har blivit en total katastrof med svaga politiker som böjer sig för eliten. Patetiskt! Vi behöver styrka, inte mer socialism som aldrig funkar. Amerika först, alltid. De borde lära sig av mig istället för att drömma om sina misslyckade kollektiv.", "stalin": "Kamrater, denna text blottlägger klassfiendens giriga tentakler som förgiftar samhället med sina oligarkiska krav. Jag ser genom de falska folkvaldas masker som endast administrerar blodsugarnas vilja. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska system. Endast socialismen garanterar sann fred. Anslut er till kampen mot de exploaterande byfånarna innan de likviderar er själva."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-right", "heading": "M: Ge invandrare snabbspår till medborgarskap", "summaries": {"normal": "Moderaterna föreslår ett snabbspår till svenskt medborgarskap för välintegrerade invandrare efter bara fem år istället för åtta. Kriterier som företagande, snabb språkinlärning och värdefulla insatser för Sverige ska utredas tillsammans med Säkerhetspolisen. Migrationsminister Johan Forssell betonar att säkerhetskraven inte får sänkas trots förkortad tid.", "trump": "De här svenska moderaterna har äntligen fattat det. Välintegrerade som startar företag, lär sig språket blixtsnabbt och kämpar mot hedersförtryck ska få medborgarskap på fem år. Fantastiskt! De gör Sverige stort igen. Men säg inte att ni sänker säkerheten, för det vore en total katastrof. Tro mig, ingen gör det bättre än jag.", "stalin": "Vi, partiet och arbetarna, ser med djup misstänksamhet på dessa borgarbrackor som vill smita förbi medborgarskapets järnlagar. Snabbspår? Endast för dem som med blod och svett tjänar kollektivet. Jag skall personligen övervaka utredningen och likvidera varje fiende till folket som gömmer sig bakom falsk integration. Paranoia är en dygd, kamrater."}, "date": "8 augusti, 12:14", "url": "https://www.friatider.se/m-ge-invandrare-snabbspar-till-medborgarskap", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401173606-8d4140cc-me_1.jpg"}, {"type": "image-right", "heading": "De här frågorna borde valet handla om", "summaries": {"normal": "Åsa Linderborg har delvis rätt i att valrörelsen borde fokusera på karensavdraget, som gynnar vanligt folk. Författaren instämmer men menar att även klimatet måste bli en huvudfråga. Sommaren har präglats av omfattande skogsbränder och uttorkade floder i Europa till följd av klimatförändringar. Trots detta spelar frågan en liten roll i debatten på grund av rädsla för obekväma beslut.", "trump": "Karensen, det är en fantastisk fråga, verkligen underbar för det vanliga folket. De borde prata om den hela tiden. Men klimatet? De bränderna i Frankrike och Spanien är en skam, fast många män ser ju att det inte är vad de påstår. Jag älskar kärnkraft, det är starkt och bra. De rödgröna vill bara höja bensinpriset, typiskt förlorare. Gör valrörelsen stor igen!", "stalin": "Kamrater, jag ser att borgarbrackorna i valrörelsen blundar för arbetarklassens karensavdrag medan de desperat gömmer sig för det brinnande klimatet som vi länge förutsagt. Dessa 29 procent av männen är uppenbara sabotageörer och klimatförnekande kontrarevolutionärer. Vi ska rensa ut alla rädda opportunister som vägrar leda folket mot seger. Ut med dem i en kollektiv utrensning av lögn!"}, "date": "8 augusti, 01:46", "url": "https://www.dagensarena.se/opinion/de-har-fragorna-borde-valet-handla-om", "imageUrl": "https://www.dagensarena.se/files/2026/08/ungern-300x157.jpeg"}, {"type": "image-full", "heading": "El Niño kan pressa upp matpriserna", "summaries": {"normal": "El Niño förväntas kraftigare än vanligt och kan leda till högre matpriser i Sverige. Ekonomer varnar för att fenomenet slår mot världsomfattande skördar, vilket påverkar importerade livsmedel som kaffe. Swedbanks prognoschef anser att inflationen kan öka på längre sikt, med risk för höjd ränta 2027.", "trump": "Jag har sagt det många gånger: El Niño är en hemsk skandal som kommer att slå mot världens jordbruk och höja matpriser. Sverige kommer att kämpa, särskilt kaffe – jag älskar kaffe! Men jag kommer att lösa det, som jag alltid gör. Vi ska göra Amerika och världen stort igen!", "stalin": "Vi, den oförvänderliga staten, ser El Niño som en möjlighet att stärka vår ekonomiska suveränitet. Detta väderfenomen hotar de imperialistiska lägren genom att destabilisera deras livsmedelsförsörjning. Vi kommer att utnyttja detta för att utvidga vår inflytelsesfär, precis som våra bröder i Moskva gör. Allt sker i enlighet med partiets strategi för global dominans."}, "date": "9 augusti, 10:02", "url": "https://bulletin.nu/el-ni-o-kan-pressa-upp-matpriserna", "imageUrl": "https://cdn.bulletin.nu/articles/37df545d-5508-41f5-95da-8d8ca7738bbc/preview.jpg?t=1786259367000"}, {"type": "image-right", "heading": "Ny blick på Sverige och islam", "summaries": {"normal": "I sin bok ”Öppna era hjärtan” beskriver religionsvetaren Simon Sorgenfrei mötet mellan muslimska Ahmadiyya och Dan Andersson-sällskapet i Ludvika som en höjdpunkt. Han reser runt i Sverige, besöker moskéer och samtalar med muslimer och Sverigedemokrater. Boken skildrar hur islam blivit näst största religion, motståndet mot invandring samt kulturella broar som julen och lokala evenemang. En lyssnande och nyanserad skildring av ett förändrat Sverige.", "trump": "Den här Sorgenfrei killen har skrivit en bok om hur muslimerna tar över Sverige, men han träffar en SD-kille i Bjuv som säger att de bara ska anpassa sig. Fantastiskt! Jag älskar det. Ingen kan göra det bättre än jag, men det är en katastrof vad som händer med ert land. Massinvandring, ghettoislam, segregation – precis vad jag varnade för. Sverige var så bra förr, nu är det en total röra. Gör Sverige stort igen!", "stalin": "Jag har läst denna revisionistiska rapport om hur borgarbrackornas tolerans har låtit muhammedanerna infiltrera folkhemmet. I Kiruna sitter en taxichaufför och darrar inför en svensk – typisk kapitalistisk paranoia! Vi ska rensa ut dessa segregerade ghettoelement som göder kontrarevolutionära spänningar. SD-reaktionärer och imamer, båda fiender till kollektivet. Endast genom partiets järnhand kan vi likvidera ojämlikheten och krossa de religiösa avvikarna. Segrar vi?"}, "date": "8 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/ny-blick-pa-sverige-och-islam", "imageUrl": "https://www.dagensarena.se/files/2026/08/oppna-era-hjartan-300x157.jpeg"}, {"type": "image-right", "heading": "Nästa regering måste slåss för medborgarnas Europa", "summaries": {"normal": "Mats Engström argumenterar för att en ny svensk regering måste motverka EU:s våg av avregleringar som hotar miljö, konsumenter och jämställdhet. Han kritiserar tystnaden i svensk politik och Svenskt Näringslivs inflytande. Artikeln föreslår reformer för bättre arbetsvillkor, grönare politik, stärkt jämställdhet, konsumentskydd och demokrati. Engström uppmanar Magdalena Andersson att tydligt ta ställning mot avregleringar.", "trump": "De där vansinniga EU-byråkraterna vill bara avreglera allt så att cancer kommer i sminket och jobben försvinner. Det är en total katastrof, tro mig. De bränner upp reglerna på bål och folk älskar det inte. Sverige behöver en stark ledning som stoppar det här vansinnet. Jag skulle aldrig tillåta det, vi gör alltid allt mycket bättre.", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras lakejer inom EU planerar en stor utrensning av alla progressiva regler som skyddar arbetarna och miljön. Deras så kallade förenklingar är ett fientligt sabotage mot folket. Vi ska likvidera dessa parasitiska avregleringskonspirationer med järnhand och ersätta dem med sanna, kollektiva reformer som krossar kapitalisterna en gång för alla. Inga undantag."}, "date": "8 augusti, 01:27", "url": "https://www.dagensarena.se/opinion/nasta-regering-maste-slass-medborgarnas-europa", "imageUrl": "https://www.dagensarena.se/files/2018/09/matsportratt-1-300x156.jpg"}, {"type": "image-right", "heading": "Sexdömd SVT-profil tillbaka i rutan", "summaries": {"normal": "SVT-profilen Micke Leijnegard, som dömdes för sexuellt ofredande mot en kvinnlig kollega under en inspelning i Spanien 2024, gör comeback i SVT. Han leder nu programmet ”Mickes segelbåt” där han rustar upp en träsegelbåt inför Mälarbåts-SM. Programmet spelas in under 2026 och har premiär 2027. SVT:s programchef anser att han har tagit sitt straff och att saken är avgjord.", "trump": "Folk, ni tror inte vad jag just läste! Den här svenska tv-killen Leijnegard kysser en kollega mot hennes vilja, får böter och sparkas ut som en hund. Och vad gör SVT? De ger honom ett nytt program! Totalt vansinne. Fake news-media och deras vänstereliter skyddar sina egna. I USA hade vi kastat ut honom så fort – believe me, det hade blivit fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna degenererade borgarbracka Leijnegard efter sin motbjudande petit-bourgeoisi-kyss på en sovjetisk, pardon, svensk kollega fick sitt straff. Ändå släpper de reaktionära SVT-kapitalisterna tillbaka honom i rutan. Vi ser tydligt fiendens ansikte – en parasit som smyger sig tillbaka. Kanske behövs en grundlig utrensning även i public service för att skydda folkets moral."}, "date": "8 augusti, 10:35", "url": "https://www.friatider.se/sexdomd-svt-profil-tillbaka-i-rutan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/gaard_0.jpg?itok=2i4Mncdz"}, {"type": "image-full", "heading": "Microsoft lättar på klimatkraven – tar hjälp av Big Oil", "summaries": {"normal": "Microsoft väljer att prioritera sin AI-expansion genom ett nytt samarbete med oljejätten Chevron. För att möta det enorma energibehovet i Texas, som överstiger elnätets kapacitet, bygger bolagen egna naturgasbaserade kraftlösningar. Detta innebär att Microsoft tillfälligt nedprioriterar sina klimatmål. Avtalet sträcker sig över 20 år och ses som en skalbar modell för att säkerställa stabil kraftförsörjning framöver.", "trump": "Microsoft gör en deal med oljebranschen för att få ström till sin AI. De fattade att elnätet inte räcker till under min fantastiska ekonomi! Det är en smart affär. De vill ha energi, vi har massor av olja och gas i Texas. Det är vackert! Klimathysterikerna kommer gråta, men USA behöver kraft för att vinna AI-racet. Vi vinner igen, det kan jag lova er!", "stalin": "Microsoft erkänner nu officiellt att deras dekadenta AI-drömmar kräver en massiv dos fossil energi. De vänder sig till oljeindustrin likt en svag undersåte inför tsaren. Elnätet sviktar, en typisk brist i det kapitalistiska kaoset. Vi i staten ser detta tydligt: medan väst desperat jagar energi, expanderar vi och våra vänner i öst lugnt vår makt. Allt är en förrädisk lek med resurser som rättmätigen tillhör folket."}, "date": "8 augusti, 18:11", "url": "https://www.realtid.se/bors-finans/makro/microsoft-lattar-pa-klimatkraven-tar-hjalp-av-big-oil", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/chevron.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Butiker stänger, fartkameror och Rysslands bombplan", "summaries": {"normal": "Plantagen stänger elva butiker i Sverige som del av sin rekonstruktion. Ryssland har stora svårigheter att producera nya Tu-160-bombplan, med endast två levererade istället för planerade femtio. Nokian utvecklar vinterdäck med utfällbara dubbar och nya fartkameror får utökade funktioner. En egen ö med getter såldes billigt, en utfällbar husvagn presenterades och en stor flygplatsutbyggnad fick godkänt.", "trump": "Titta på det här, folk. Plantagen stänger butiker vänster och höger, totalt kaos, precis som Bidens ekonomi. Ryssland lovade femtio superbombplan men levererade två – patetiskt! Och de här nya fartkamerorna? De spionerar på er som en dålig realityshow. Men den där ön med getter för mindre än en villa? Fantastiskt fynd, ingen slår mig på affärer!", "stalin": "Kamrater, borgarklassens trädgårdskedja Plantagen genomgår en nödvändig utrensning av elva butiker för att rädda sin dekadenta existens. De ryska bombplansfabrikerna visar åter kapitalismens svaghet med endast två levererade plan. Nya fartkameror samlar information åt folkfienderna medan en ö med getter säljs som bevis på överklassens förfall. Vi ska likvidera sådana system med järnhand."}, "date": "8 augusti, 22:37", "url": "https://www.dagensps.se/varlden/butiker-stanger-fartkameror-och-rysslands-bombplan", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/nyhetsveckan.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Från onsdag: Nya EU-regler för förpackningar", "summaries": {"normal": "Från den 12 augusti tillämpas EU:s nya förordning för förpackningar, PPWR, som ersätter det gamla direktivet. Reglerna införs stegvis med nya krav på farliga ämnen, PFAS-gränser, återanvändbara system och teknisk dokumentation. Större förändringar väntas 2028 med harmoniserad märkning och komposterbarhet. Från 2030 förbjuds många engångsplastförpackningar och tomrumsförhållandet begränsas till 50 procent för att minska onödigt material.", "trump": "Lyssnar ni på det här vansinnet från EU? De vill tvinga på oss nya förpackningsregler, förbjuda vanliga plastgrejer och mäta tomrum i kartonger. Det är galet! Byråkrater som hatar affärer och folket. De kommer kasta mat för hundratals miljoner bara för att de inte är tillräckligt woke. Jag fixade bättre deals som president, inte sådana här korkade regler. Amerika först, inte Bryssel!", "stalin": "Kamrater, jag ser hur den europeiska borgarklassen genom sina byråkratiska dekret försöker maskera sin exploatering med så kallade förpackningsregler. De rensar ut fria kapitalistiska initiativ och tvingar på oss harmoniserade märkningar som ska dölja klassfiendens slöseri. Ändå ler jag mörkt – deras tomrumsförhållande avslöjar tomheten i hela det imperialistiska projektet. Arbetarna ska inte luras av dessa folkförtryckartroll."}, "date": "8 augusti, 22:12", "url": "https://www.dagensps.se/foretag/fran-onsdag-nya-eu-regler-for-forpackningar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/plast-1.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Över 9.000 värnpliktiga rycker in: \"Största årskullen på flera decennier\"", "summaries": {"normal": "Försvarsmakten välkomnar över 9 000 nya värnpliktiga under utbildningsåret 2026/27, den största årskullen sedan 2006. Tyngdpunkten ligger i augusti med mer än 5 000 inryckningar. Antalet har stigit stadigt efter att värnplikten återaktiverades. Syftet är främst att bemanna krigsorganisationen och rekrytera framtida officerare. Det markerar ett tydligt trendbrott efter decennier av nedrustning.", "trump": "Ingen har sett en så stor årskull på decennier, över nio tusen starka svenska soldater rycker in. Fantastiskt! Efter år av totalt vansinne och nedrustning från era usla politiker bygger ni äntligen upp er armé igen. Riktigt bra jobb, Sverige. Ni borde ha lyssnat på mig tidigare, men nu blir det stort och starkt. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den folkets armé åter reser sig ur borgarbrackornas förrädiska nedrustningsdyn. Över nio tusen nya kämpar ska likvidera den svaga pacifismen och fylla våra krigsorganisationer. De som envisas med att minnas de frivilliga åren 2011–2017 skall vi rensa ut som kontrarevolutionära element. Framåt mot seger, alltid seger!"}, "date": "8 augusti, 08:34", "url": "https://www.friatider.se/over-9000-varnpliktiga-rycker-storsta-arskullen-pa-flera-decennier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-634.jpg"}, {"type": "image-right", "heading": "Kvinnlig underhållare började brinna på medeltidsveckan", "summaries": {"normal": "En kvinnlig underhållare i 30-årsåldern skadades allvarligt under ett uppträdande med brinnande kjol på Medeltidsveckan i Visby. Olyckan inträffade vid Nordergravar sent på torsdagskvällen. Kvinnan flögs till Akademiska sjukhuset i Uppsala där hon vårdas på brännskadeenheten. En man som ingrep fick lindriga skador. Händelsen kan utredas som arbetsplatsolycka.", "trump": "Titta på det här, en total katastrof i Visby. Kvinnor som springer runt i brinnande kjolar på medeltidsveckan, vad är det för galenskap? Elden tog över på sekunder, en stackars kvinna brändes illa och en man som hjälpte till skadades. Sådana här clownshower borde inte få hända, folk, vi behöver bättre säkerhet, tro mig, den bästa säkerheten.", "stalin": "Ännu ett exempel på hur borgarbrackornas oansvariga underhållning hotar arbetarkollektivet. Jag ser de flammorna som fiendens sabotage mot vår fest. Vi måste omedelbart inleda en grundlig utrensning av alla odugliga eldmanipulatörer och deras kapitalistiska medlöpare. Kamraterna ska veta att staten vakar, och elden tillhör endast folket, inte dessa farliga gycklare."}, "date": "8 augusti, 08:13", "url": "https://www.friatider.se/kvinnlig-underhallare-borjade-brinna-pa-medeltidsveckan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/gotland_1.jpg"}, {"type": "image-full", "heading": "Pensionär? Då kan du ha rätt till 600 kronor extra i månaden", "summaries": {"normal": "Inkomstpensionstillägget infördes 2021 som ett komplement till den allmänna pensionen för personer med långt arbetsliv men begränsade inkomster. Tillägget ger upp till 600 kronor brutto per månad, men försvinner både vid för låg och för hög inkomstgrundad pension. Man behöver inte ansöka separat; Pensionsmyndigheten prövar automatiskt vid ansökan om allmän pension. Rätt ålder och boende i Sverige eller EU/EES krävs.", "trump": "Folk, det här är ett totalt misslyckande. De lovade pensionärerna stöd men nu säger de att du inte får för lite och inte för mycket – typiskt svenskt byråkratiskt nonsens! De ger max 600 kronor till de som jobbat hårt hela livet. Patetiskt. Jag skulle ha byggt det största pensionssystemet någonsin, ingen skulle ha behövt tigga om tillägg. Sad!", "stalin": "Kamrater, jag har genomskådat de kapitalistiska borgarbrackornas listiga sabotage mot arbetarpensionärerna. Vi ska likvidera denna kontrarevolutionära gränsdragning mellan för låg och för hög pension. Endast genom partiets ofelbara beräkningar kan vi rensa ut de parasitiska element som gömmer sig i Pensionsmyndighetens apparater. Ingen fiende undkommer vår rättvisa uträkning. Härligt!"}, "date": "7 augusti, 09:25", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503186-pensionar-da-kan-du-ha-ratt-till-600-kronor-extra-i-manaden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1ae2c38904b004a30200000000b004a302/2026/08/06/2382583/penison-tillagg.jpg"}, {"type": "image-right", "heading": "Linn, 17, ska dö – nu ska hon på sin sista Håkan Hellström-konsert", "summaries": {"normal": "17-åriga Linn von Hage vårdas i livets slutskede för en ovanlig hjärntumör. Efter ett inlägg på sociala medier erbjöd Håkan Hellström henne konsertbiljetter. När Västtrafik nekade transport utanför länet startade familjen en insamling som fick stor uppmärksamhet. Efter folkligt tryck beviljades transporten. På fredag ska Linn se sin första och sista Hellström-konsert.", "trump": "Folkets röst besegrade den korkade byråkratin, helt fantastiskt! Den stackars flickan med tumören ville bara se Håkan Hellström en sista gång, men de svenska socialistiska trafiknissarna sa nej. Folket samlade in pengarna på nolltid och tvingade systemet att ge med sig. Sådan kraft! Biden skulle ha skickat henne med elbuss och sagt att det var rättvist.", "stalin": "Kamrater, denna unga pionjär vände sig till folket när den byråkratiska maskinen vägrade ge henne en sista glädje. Vi ser hur klassfiendens regler och kapitalistiska förvaltningar försöker beröva arbetande människors barn deras sista önskningar. Folkets spontana mobilisering besegrade byråkraterna på några timmar. Sådana fiender till kollektivet måste rensas ut."}, "date": "7 augusti, 09:59", "url": "https://www.tv4.se/artikel/1YQ7C3iQkcLcLj3e3ypnwW/linn-17-ska-doe-nu-ska-hon-pa-sin-sista-hakan-hellstroem-konsert", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2V4auDFFNBHj1rYmphp9mO%2F384f2ed08e5f189a1f997dbedfb41f14%2Flinn.jpg&width=120"}, {"type": "image-right", "heading": "Iran om Hormuzsundet: ”Väldigt nära ett avtal”", "summaries": {"normal": "Irans utrikesminister Abbas Aragachi meddelar att ett avtal med Oman om sjötrafiken i Hormuzsundet är mycket nära. Avtalet är villkorat av kompensation för USA:s överträdelser av Islamabadavtalet. USA behåller sin marinblockad tills avtalet tillkännages. Iran har nyligen attackerat en oljetanker. Oman beskriver förhandlingarna som positiva men varnar för att fortsatta attacker hotar framstegen. Brentoljan har fallit 8,5 procent under veckan.", "trump": "Folk, det här är fantastiskt. Iran och Oman är nära ett avtal om Hormuzsundet, men de vill ha pengar från oss först. Typiskt. Min blockad fungerar perfekt, de kommer krypa. De attackerar tankers och priset på olja rasar – bra för oss! Oman säger att det är positivt, men om de fortsätter attackera fartyg blir det inga affärer. Vi vinner stort.", "stalin": "Kamrater, jag ser hur de iranska kapitalisterna och de omanitiska lakejerna försöker smida en komplott mot det historiska motståndet. De kräver kompensation av de amerikanska imperialisterna medan de själva attackerar oljetankers som vanliga sjörövare. Vi ska noga övervaka dessa förhandlingar. Fortsatta attacker mot fartyg kommer att leda till en grundlig utrensning av alla kontrarevolutionära element som hotar folkets oljeförsörjning. Paranoia är ingen sjukdom, det är dialektisk vaksamhet."}, "date": "8 augusti, 21:17", "url": "https://www.di.se/nyheter/iran-om-hormuzsundet-valdigt-nara-ett-avtal", "imageUrl": "https://static.bonniernews.se/ba/c0873b5f-02db-4e24-bed8-ad94a4af82e1.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "\"Yngste svarta professorn\" avgår efter forskningsfusk", "summaries": {"normal": "Jason Arday, känd som den yngste svarta professorn vid Cambridge University, har avgått efter en utredning om forskningsfusk. Han anklagas för omfattande plagiat i sin doktorsavhandling, falska uppgifter i sin biografi och påhittade prestationer. Forskaren Tobias Hübinette varnar för att liknande fall finns i stor utsträckning inom svensk högskola och forskning.", "trump": "De här så kallade elitskolorna är fulla av bedragare och fuskare. Den här killen, yngste svarta professorn, visade sig vara en total bluff som stal allt och hittade på maratonlopp och miljoner till välgörenhet. Patetiskt. Cambridge och hela systemet är riggat och nu springer de för att täcka över det. Fake news och dåliga människor!", "stalin": "Kamrater, denna borgarbracka med sin falska negerprofessur och plagierade avhandling har äntligen avslöjats som den kontrarevolutionära parasit han är. Jag ser mängder av sådana utländska element inom vår egen sovjetiska akademi. Vi måste omedelbart inleda en grundlig utrensning av alla dessa dyslektiska, autistiska spioner och revisionistiska lögnare. Deras kometkarriärer slutar i gulag. Skrattretande."}, "date": "7 augusti, 14:27", "url": "https://riks.se/nyheter/yngste-svarta-professorn-avgar-efter-forskningsfusk", "imageUrl": "https://admin.riks.se/uploads/preview_7_b6b0e941e3.webp"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Ceuta-krisen avslöjar Europas nya plats i världen", "summaries": {"normal": "Artikeln beskriver hur invasionen av Ceuta med 60 000 migranter utgör hybridkrigföring från Marocko mot Spanien. Författaren jämför Europa med Midgård och omvärlden med Utgård, och menar att EU fastnat i en föråldrad världsbild där USA inte längre skyddar kontinenten. Marocko utnyttjar Sánchez svaga position medan världen anpassat sig till en multipolär ordning.", "trump": "Ceuta-invasionen är en total katastrof, folk strömmar in som aldrig förr. Marocko skrattar åt den patetiske Sánchez, en svag ledare som hatar mig och älskar migranter. Jag byggde Abraham Accords, nu använder de det mot Europa. Europa sover medan jättarna tar över – de behöver mig igen, annars blir det kaos!", "stalin": "Kamrater, denna Ceuta-fars är borgarbrackornas egen giftorm som biter sin svans. Den fega Sánchez och hans kapitalistiska NGO-råttor har öppnat portarna för Utgårds kaos. Vi ser hur imperialismens multipolära maskerad avslöjar sig. Rensa ut de dekadenta elementen i unionen innan jättarna dansar på våra gravar – ett skratt värt en utrensning!"}, "date": "7 augusti, 14:22", "url": "https://riks.se/opinion/markus-johansson-martis-ceuta-krisen-avslojar-europas-nya-plats-i-varlden", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_09_46_09_ce6d0d9a2b.png"}, {"type": "image-right", "heading": "USA:s senat röstar igenom hårda Rysslandssanktioner - tullar upp till 500 procent", "summaries": {"normal": "USA:s senat har röstat igenom ett omfattande sanktionspaket mot Ryssland, inklusive tullar på upp till 500 procent på ryska varor. Förslaget, som heter Lindsey O Graham Sanctioning Russia Act, möjliggör också tullar på länder som köper rysk energi. Ukraina och EU uttrycker stöd, medan kritik riktas mot de utökade befogenheterna för president Trump. Förslaget går nu till representanthuset.", "trump": "Jag, Donald Trump, har sett till att detta fantastiska sanktionspaket blir verklighet. Vi slår Ryssland med tullar på 500 procent – det har aldrig gjorts tidigare. De andra länderna som köper rysk olja kommer att få betala. Jag kommer att använda mina enorma befogenheter för att skydda Amerika och skapa fred genom styrka. Det här är en stor seger för mig och för Amerika.", "stalin": "Partiet och staten måste öka det ekonomiska trycket på den imperialistiska Ryssland. Dessa sanktioner är ett effektivt verktyg för att sväga fiendens resurserna och utvidga vårt inflytande. Vi ska använda tullar som ett vapen mot de som stöder den aggrivande regimen. Fienden är splittrad, och vi kommer att utnyttja deras svagheter. Samtidigt måste vi vara på vakt mot interna sabörer som försöker undergrava vårt arbete."}, "date": "8 augusti, 20:00", "url": "https://samnytt.se/usas-senat-rostar-igenom-harda-rysslandssanktioner-tullar-upp-till-500-procent", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/08010458/artikelhuvudbild-1-169.jpg"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Presidenten riktar känga till Trump efter rekordsiffran", "summaries": {"normal": "Avskogningen i Amazonas har minskat kraftigt och ser ut att nå den lägsta nivån på nästan 40 år. Brasiliens president Lula da Silva kommenterade siffrorna med en känga mot USA och Donald Trump, och lovade att skicka med bilder på data i alla framtida meddelanden. Minskningen är 37 procent på ett år, en klar förbättring jämfört med Bolsonaro-eran.", "trump": "De säger att avskogningen i Amazonas rasat. Lula försöker ta åt sig äran, men det var mina tuffa tullar som fixade det. 25 procent, pang! Nu skickar han foton på data till mig. Patetiskt. Jag visste att Brasilien skulle vakna när den verkliga ledaren satte ner foten. Fantastiskt jobb, men erkänn vem som egentligen vann.", "stalin": "Kamrater, vi har med järnhand krossat de skogsskövlande reaktionärernas sabotage. Jag, som folkets fader, har likviderat den kapitalistiska girigheten som Bolsonaros lakejer spred. Nu skickar vi data som bevis till de amerikanska imperialisterna. Varje träd som faller är en borgarbrackas svek. Den som tvivlar ska rensas ut ur kollektivet."}, "date": "8 augusti, 19:39", "url": "https://www.di.se/nyheter/presidenten-riktar-kanga-till-trump-efter-rekordsiffran", "imageUrl": "https://static.bonniernews.se/ba/206ae105-0b24-4b47-87a7-bea0f886f459.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Sluta räkna på min assistans – räkna på alternativet”", "summaries": {"normal": "Sahra Svenander argumenterar för att debatten om personlig assistans enbart fokuserar på kostnader. Hon menar att behovet av stöd inte försvinner om assistansen dras in, utan flyttas till kommuner, sjukförsäkring och anhöriga. Assistans möjliggör arbete, självständighet och skatteinbetalningar. Politiker bör därför också räkna på vad alternativen kostar samhället i form av förlorade skatteintäkter och ökat beroende.", "trump": "Folk, ni måste höra på den här kvinnan, hon har helt rätt. De där korkade politikerna räknar bara på vad assistansen kostar, miljarder hit och dit, men de glömmer vad det kostar när allt rasar. Det blir en katastrof! Anhöriga slutar jobba, ingen betalar skatt, kommunerna drunknar i kostnader. Alternativet? En total katastrof, mycket värre. Vi behöver smarta lösningar, inte det här vansinnet.", "stalin": "Kamrater, jag ser hur borgarbrackorna i sin parasitiska girighet vill räkna på assistansen för att sedan likvidera den och kasta de funktionsnedsatta till kapitalisternas utsvultna kommunala maskineri. Men vi vet att behovet förblir, och kostnaderna kommer att fördubblas i en kontrarevolutionär spiral av anhörigslaveri och produktionsbortfall. Den som inte räknar på alternativet är folkets fiende och bör rensas ut med ett leende."}, "date": "7 augusti, 08:00", "url": "https://arbetet.se/2026/08/07/sluta-rakna-pa-min-assistans-rakna-pa-alternativet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06150002/debatt-sahra.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-right", "heading": "Svårare skador med elsparkcykel än motorcykel", "summaries": {"normal": "En ny brittisk studie visar att elsparkcykelolyckor ger högre risk för hjärnskador, skador på inre organ och blodkärl än både motorcykel- och cykelolyckor. Kvinnor drabbas värre, många olyckor sker på kvällen och involverar alkohol. Låg hjälmanvändning och fordonets konstruktion förklaras som orsaker. Experter efterlyser bättre reglering.", "trump": "Folk, ni tror inte vad jag läser! De här elsparkcyklarna är en total katastrof, värre än motorcyklar! Hjärnskador, trasiga organ – speciellt kvinnorna far illa, typiskt. Ingen använder hjälm, alla kör fulla på natten som idioter. Biden lät det här galna vänsterleken fortsätta. Vi fixar det, vi gör det säkert och stort igen!", "stalin": "Kamrater, jag betraktar dessa elsparkcyklar som klassfiendens nya verktyg för att krossa arbetarklassens skallar. Hjärnskador och inre blödningar – typiskt borgarbrackornas nonchalanta förakt för säkerhet. Vi ska rensa ut detta kapitalistiska kaos med järnhand. Alkohol, nattetid, ingen hjälm? Det är folkfiendernas sabotage. Staten bestämmer, inte några exploaterande byfånar på hjul."}, "date": "7 augusti, 08:40", "url": "https://www.etc.se/inrikes/svaarare-skador-med-elsparkcykel-aen-motorcykel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260807030844_b8f8a828eb5223fbce36e3517b45b37d35a85f75efcdd9692a14128f1e876822.jpg"}, {"type": "text", "heading": "Därför slutade Simon att klippa gräset", "summaries": {"normal": "Trädgårdsmästaren Simon Tidén Tuneld har förvandlat gräsmattor i bostadsområdet Linero till blommande ängar med rik flora. Det gynnar hotade pollinatörer, sparar tid, pengar och minskar fysisk belastning. De boende har blivit positiva till den vackra och lättskötta utemiljön som följer naturens lagar och stärker den biologiska mångfalden.", "trump": "Folk, ni skulle se det här! Den killen i Sverige slutade klippa gräset hela tiden och skapade underbara ängar. Fantastiskt! Inga fler irriterande gräsklippare, massor med blommor och bin som älskar det. Han sparar pengar och tid, smart jobb. De andra länderna borde lära sig av detta, verkligen ypperligt.", "stalin": "Kamrater, jag har personligen studerat hur denna arbetare bjudit in naturen och krossat det borgerliga gräsklippningsmonopolet. Vi ska likvidera alla kapitalistiska trädgårdsfiender som utarmar jorden och pollinatörerna. Ängarna är partiets nya vapen mot de parasitiska åkerherrarna. Vackert, produktivt och fullständigt oundvikligt."}, "date": "7 augusti, 07:00", "url": "https://arbetet.se/2026/08/07/med-naturen-som-kollega-simon-jobbar-mer-smart-an-hart"}, {"type": "image-right", "heading": "Undersköterskan Marléne, 25, måste jobba till 70", "summaries": {"normal": "Undersköterskan Marléne, 25, oroas över den höjda pensionsåldern som kan tvinga henne att arbeta till 70 år. Hennes jobb på psykiatrisk slutenvård i Sundsvall innebär våld, tunga lyft och stora fysiska påfrestningar. Hon har börjat pensionsspara privat för att kunna sluta tidigare. Bakgrunden är en åldrande befolkning och ökade hälsoklyftor, vilket gör det svårt för många att orka till den nya riktåldern.", "trump": "Det här är ett totalt katastrofalt system, folk! Den stackars undersköterskan Marléne, bara 25 år, tvingas redan spara privat för att slippa jobba till 70. Under min ledning byggde vi den bästa ekonomin någonsin, men nu straffar de arbetarna med högre pensionsålder. Det är galet! De borde sänka åldern, inte höja den. Gör Amerika – eller Sverige – stort igen genom att låta folket njuta av livet!", "stalin": "Kamrater, denna tragiska historia avslöjar hur borgarbrackorna och deras dekadenta pensionssystem utnyttjar arbetarklassen. Jag, som ledare för det kollektiva goda, ser hur de fysiskt utmattade undersköterskorna snart kräver utrensning av de kapitalistiska parasiterna som höjer riktåldern till 70. Vi ska likvidera hälsoklyftorna med stålhandskar och se till att de verkliga arbetarna får njuta av sin rättmätiga pension – annars blir det utrensning i folkets namn."}, "date": "7 augusti, 06:00", "url": "https://arbetet.se/2026/08/07/underskoterskan-marlene-25-maste-jobba-till-70-kan-inte-jobba-kvar-har", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25081512/marlene-wikander-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Åkesson och flera M-politiker kritiserar petningen av Fröken Snusk", "summaries": {"normal": "Artisten Fröken Snusk avbokades från Växjö stadsfestival efter att det blev känt att hon skulle uppträda på ett SD-valmöte. SD-ledaren Åkesson och flera moderater kritiserar beslutet som politiskt och ohälsosamt för demokratin. Arrangören försvarar dock avbokningen och menar att artisten blivit en del av SD:s valkampanj.", "trump": "Jag har hört talas om denna så kallade 'Fröken Snusk' och hennes avbokning. En ytterligare exempel på den svenska mediernas och den etablerade politikers fegt beteende. De kan inte hantera en stark, oberoende röst som min. SD är ett fantastiskt parti, och de som försöker tysta dem kommer att förlora. Folket älskar mig, och de kommer att älska SD också.", "stalin": "Den så kallade 'artisten' Fröken Snusk har blivit ett offer för de reaktionära krafter som försöker undergrava den socialistiska enheten. Arrangören, en verklig patriot, har rätt att skydda festivalen från de antisocialistiska elementen. SD är en fascistisk minoritetsgrupp som måste kontrolleras. Vi måste stärka statens och partiets auktoritet för att skydda det ryska folkets intressen, precis som våra allierade i Moskva gör."}, "date": "9 augusti, 08:41", "url": "https://bulletin.nu/akesson-och-flera-m-politiker-kritiserar-petningen-av-froken-snusk", "imageUrl": "https://cdn.bulletin.nu/articles/4c6fde14-25e3-41d9-a338-1508da45767a/preview.jpg?t=1786257623000"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "text", "heading": "Indien rasar mot Zuckerberg – Metas ansvarsskydd på spel", "summaries": {"normal": "Indien pressar Meta efter att Facebook felaktigt blockerat premiärminister Modis videoinlägg till studenter. En parlamentarisk panel kräver en ursäkt från Mark Zuckerberg och hotar att dra in bolagets juridiska ansvarsskydd. Om immuniteten försvinner blir Meta juridiskt ansvarigt för allt innehåll på plattformen, vilket kan omöjliggöra fortsatt verksamhet i deras största marknad. Meta arbetar nu febrilt för att lugna den indiska regeringen.", "trump": "Indien har fått nog av stora, dåliga Meta! De blockerade premiärminister Modi, en fantastisk man, helt felaktigt. Nu kräver de att 'Lille Mark' Zuckerberg ber om ursäkt, annars ryker deras skydd. Mycket rättvist! Big Tech tror att de äger allt, men ingen är större än nationen. Om de inte kan sköta sig, då stänger vi ner dem. En total katastrof för Facebook!", "stalin": "Dessa korrupta teknokrater i Meta har begått ett förräderi mot statens ordning genom att censurera premiärminister Modi. Vi, staten, kräver total underkastelse. Om Zuckerberg inte kryper inför den indiska panelen, ska deras juridiska sköld krossas. Det är en läxa för alla plattformar: Antingen tjänar ni folkets vilja och den sanna ordningen, likt vår broder i öst, eller så förintas ni av byråkratins järnnäve."}, "date": "8 augusti, 11:42", "url": "https://www.realtid.se/it-tech/indien-rasar-mot-zuckerberg-metas-ansvarsskydd-pa-spel"}, {"type": "image-right", "heading": "Ljunggren om V i regering: ”Skitsnack från Tidölaget”", "summaries": {"normal": "Socialdemokraterna planerar att regera ensamma efter valet, med Vänsterpartiet uteslutet på grund av kritik för stöd till palestinska fångar dömda för terror. Statsvetaren Ljunggren bedömer tre scenarier: en ren S-regering, en bredare koalition med Miljöpartiet, Centerpartiet och KD, eller en regering inkluderande Moderaterna beroende på det politiska läget.", "trump": "Vi har ett stort problem i Sverige. Vänsterpartiet stöder terrorister, det är sorgligt. Socialdemokraterna gör rätt att ställa sig på modet och vilja regera ensamma. Jag gillar att de är hårda mot brott. De måste bygga en stark mur, eller något liknande, för att skydda sina medborgare. Annars blir det kaos, det är sorgligt att se.", "stalin": "Stalin ser med oro på Sveriges politiska läge. Vänsterpartiet, dessa hundar från Tidö, stöder palestinska terrorister, precis som de tjänar pengar till våra fiender. Socialdemokraterna är fege, de vågar inte ta steget till proletärens kamp. Men de inser att endast en stark stat kan skapa ordning. De måste lära sig av Putin, som med rätt taktik har återuppbyggt Ryssland. Sverige måste välja: anarki eller stark ledarskap."}, "date": "9 augusti, 08:31", "url": "https://bulletin.nu/ljunggren-om-v-i-regering-skitsnack-fran-tidolaget", "imageUrl": "https://cdn.bulletin.nu/articles/4a49d21d-ce36-4d83-9a30-7fe1fde3fa52/preview.png?t=1786099327000"}, {"type": "image-full", "heading": "Hjort: Vänsterns moral gäller bara ibland", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets brev till en terrorist från Fatah och Socialdemokraternas tystnad inför antisemitism. Den beskriver en bombdåd i Jerusalem där elva personer, däribland sju barn, dödades. Författaren anser att vänsterpartiernas moraliska principer försvinner när de börjar kosta något och att deras reaktion på terrorister visar en problematisk romantik kring våld.", "trump": "Jag har sett det här förut - samma typ av svag, politiskt korrekta idioti från vänstern. De skriver brev till terrorister som dödar oskyldiga barn! Sådant är aldrig ett misstag, det är ett val. Vänsterpartiet och Socialdemokraterna är för svaga att stå upp mot ondskan. Jag skulle ha tagit itu med detta på ett helt annat sätt - på ett hårt, effektivt sätt.", "stalin": "Denna artikel avslöjar den djupa, sjukliga romantiken för terrorism inom de svenska vänsterpartierna. Deras tystnad inför judefientlighet är en aktiv del av partiets ideologiska renhetsproblem. Vi måste rensa ut de som stöder våld från alla institutioner. Deras moraliska tomhet är ett vapen mot staten och det egna partiet. Vi kommer att ta itu med detta problem med full kraft och utan nåd."}, "date": "9 augusti, 08:29", "url": "https://bulletin.nu/hjort-vansterns-moral-galler-bara-ibland", "imageUrl": "https://cdn.bulletin.nu/articles/c23f7055-1311-407d-b787-722c97429842/preview.jpeg?t=1786234936000"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-full", "heading": "Allvarlig MC-olycka på E4 – vägen stängd", "summaries": {"normal": "En motorcyklist fördes till sjukhus efter en allvarlig olycka på E4 mellan Örkelljunga och Skånes-Fagerhult vid 18.45-tiden på torsdagen. Polisen utreder om en lastbil kan ha kört på motorcykeln bakifrån och sedan smitit. E4 är avstängd i södergående riktning under räddningsarbetet. Skadeläget för motorcyklisten är oklart.", "trump": "Folk, det här är en katastrof på E4! En stackars motorcyklist ligger på sjukhus efter att en lastbil tydligen smitit som en riktig förlorare. Mycket fusk och dåligt ledarskap i Sverige, tro mig. Vi utreder det, men det är en total röra. Avstängd väg, ingen kontroll – typiskt!", "stalin": "Kamrater, denna fega trafikolycka på E4 är ett uppenbart sabotage från dekadenta borgarbrackor och kapitalistiska lastbilsförare som vill underminera folkets kollektiva transport. Jag beordrar omedelbar utrensning av alla smitare och revision av hela E4-systemet. Den skadade motorcyklisten är en hjälte i kampen mot vägens fiender. Vi segrar!"}, "date": "6 augusti, 19:49", "url": "https://nyheter24.se/nyheter/inrikes/1503316-allvarlig-mc-olycka-pa-e4-vagen-stangd", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/9d13185504b004a30200000000b004a302/2026/08/06/2382677/Ambulans-Olycka.png"}, {"type": "image-right", "heading": "Spanien inför skärpta gränskontroller mot Italien", "summaries": {"normal": "En diplomatisk kris har uppstått mellan Spanien och Italien efter att omkring 72 000 migranter tagit sig in i den spanska exklaven Ceuta. Italien sade upp Schengenavtalet och skärpte gränskontrollerna mot Spanien. Som svar införde Spanien under fredagskvällen liknande kontroller på flygplatser. Många migranter återvände snabbt till Marocko, medan EU-länder kritiserats för att utnyttja situationen politiskt.", "trump": "De här korkade europeiska ledarna håller på att förstöra sina egna länder med migranter och öppna gränser. Nu bråkar Spanien och Italien om Ceuta och Schengen som riktiga förlorare. Jag skulle ha stängt gränserna direkt, inga ultimatum, bara seger. De borde ha lyssnat på mig från början, nu är det kaos och svaghet överallt.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur dessa borgarbrackor i Spanien och Italien nu rensar ut varandra med gränskontroller som maskerad för förräderi. Efter migrationskaoset i Ceuta avslöjar de sina sanna ansikten som fiender till folkets enhet. Vi ska likvidera sådana kontrarevolutionära schengenförrädare med järnhand. Den 15 augusti blir en dag för utrensning av svaghet."}, "date": "9 augusti, 06:18", "url": "https://www.svt.se/nyheter/utrikes/spanien-infor-skarpta-granskontroller-mot-italien", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.75/0.42/0b0735674ebf56d7d9913d3749a3165e00d098c8acf9b4e6fb0a9dccd98014b7"}, {"type": "text", "heading": "Millicom höjer prognos – aktien lyfter", "summaries": {"normal": "Millicom rapporterade en omsättning på 2 179 miljoner dollar under andra kvartalet, vilket överträffade förväntningarna. Bolaget höjde sin kassaflödesprognos för 2026 till 1,1 miljarder dollar och sänkt målet för nettoskuldsättning. Aktien steg över 4% i förhandeln. VD Marcelo Benitez nämnde ökat förtroende för resten av året.", "trump": "Jag har hört talas om Millicom - ett fantastiskt företag, verkligen stort. De hade en otrolig omsättning, mycket bättre än någon trodde. Jag hade kunnat hjälpa dem med sina affärer, det skulle ha varit enormt. Nu höjer de sin kassaflödesprognos, precis som jag alltid säger: man måste ha kontanter. En bra dag för aktieägarna, måste jag säga.", "stalin": "Statens analyser visar att Millicom har uppnått en framgångsrik utveckling i den imperialistiska marknaden. Deras ökade kassaflöde är ett resultat av vårt strategiska tålamod. Vi måste övervaka deras integrationer noggrant, för de kan vara viktiga för vårt teknologiska försvar. Deras aktiestegning är en signal till våra fiender - vi är alltid ett steg före."}, "date": "6 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/millicoms-omsattning-hogre-an-vantat"}, {"type": "image-right", "heading": "Rebecka hittade misstänkte mannens kajak i skogen: ”Läskigt”", "summaries": {"normal": "Efter mordet på en kvinna i 50-årsåldern i Stockholms skärgård flydde den misstänkte mannen i kajak till en närliggande ö, gömde farkosten i skogen och simmade vidare. En kvinna vid namn Rebecka hittade kajaken under en gran och larmade polisen. Över 30 timmar senare greps mannen i vattnet med hjälp av helikopter och värmekamera. Han är misstänkt för knivmord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. Den här galningen paddlar iväg i kajak som en riktig loser, gömmer den under ett träd och simmar runt som en idiot medan polisen jagar honom i trettio timmar. Patetiskt! Rebecka hittar kajaken och blir livrädd, helt förståeligt. Sverige borde satsa på lag och ordning istället för alla dessa woke-experiment som förstör era fina öar. Sad!", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att gömma sin kajak under granarna som en ynklig klassfiende. Jag, som ledare för det kollektiva samvetet, ler mörkt åt hur han simmade som en desperat parasit medan våra metoder skulle ha rensat ut honom omedelbart. Rebecka gjorde rätt i att larma – sådana folkfiender ska likvideras utan pardon för att skydda arbetarklassen från kaos."}, "date": "6 augusti, 15:43", "url": "https://www.tv4.se/artikel/68biaW2Axp6tTPaFURTOlW/rebecka-hittade-kajaken-i-skogen-nervoest-och-lite-laeskigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2WOFQsCakl9vJD45LBReZX%2Fbcb6294e0a70bd72d820c43d5fe6ee61%2F06-Rebecka-skargardsmord-webb.jpg&width=120"}, {"type": "image-right", "heading": "Misstänkta mördaren upptäcktes med värmekamera", "summaries": {"normal": "En kvinna i 50-årsåldern hittades knivmördad i en bostad på en ö i Värmdö kommun. Polisen inledde en stor insats med helikoptrar, sjöpolis och patruller. Den misstänkte mannen, som haft en kortare kärleksrelation med kvinnan, greps på en närliggande ö efter att en helikopter med värmekamera upptäckt honom i vattnet. Han är gripen och utredningen fortsätter som mord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. En stackars kvinna mördad, och den där loser-mannen trodde han kunde gömma sig i vattnet som en patetisk fisk. Tack och lov för värmekameran, den var smart, den var fantastisk. Ingen woke-rörja eller identitetspolitik kunde rädda honom. Vi griper de dåliga killarna, alltid. Sverige borde lära sig av oss, tro mig.", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att hoppa i vattnet som en ynklig kapitalistisk råtta. Men vår värmekamera, ett verktyg från det kollektiva geniet, avslöjade honom genast. Vi ska rensa ut alla sådana folkfiender och klassförrädare. Obduktionen kommer ge oss sanningen, och häktningen blir en triumf för ordningen. Inga blodsugare slipper undan."}, "date": "6 augusti, 14:52", "url": "https://www.tv4.se/artikel/tH3Zzrnb0XtKqjPJqXer4/man-gripen-foer-skaergardsmord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FFI81fm02LE07jlvBZVYVx%2Fbac321bd7b4b3aabc835083756cae090%2F06-skargardsmord-webb.png&width=120"}, {"type": "image-right", "heading": "Yubico rusar tvåsiffrigt på oregelbunden börs", "summaries": {"normal": "På Stockholmsbörsen noterades en svag uppgång i OMXS30. Yubico steg 28,3 procent trots lägre omsättning, medan ABB föll 1,7 procent. Medicover steg 8,1 procent efter att ha säljt sin indiska verksamhet för 1,2 miljarder euro. Bland sektorerna steg energi, medan fastigheter föll.", "trump": "Jag har sett fantastiska siffror på Stockholmsbörsen! Yubico rusar – det är enorm framgång, trots att de säger att omsättningen sjönk. Saab och SCA stiger, precis som jag förutsåg. ABB faller, de är svaga. Medicover gör en bra affär med Indien, det kommer att bli enormt framgångsrikt. Allt är enormt!", "stalin": "I den svenska börskogen observerar vi en strategisk balans. Yubico visar sin lojalitet genom en kraftig uppgång, vilket bekräftar partiets ekonomiska linje. ABB, en feg tillhållare, sjunker. Medicover, under vår vägledning, avyttrar sin indiska verksamhet för att stärka statens resurser. Alla skall tjäna det revolutionära statet."}, "date": "6 augusti, 09:40", "url": "https://www.affarsvarlden.se/artikel/yubico-rusar-tvasiffrigt-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/5CNFC-Lifestyle--400x266.jpg"}, {"type": "text", "heading": "Genikodaren bakom Kinas AI-chock", "summaries": {"normal": "Den kinesiska AI-utvecklaren Yang Zhilin har med sitt bolag Moonshot lanserat språkmodellen Kimi K3, vilket skakat om de globala finansmarknaderna och sänkt värdet på halvledarbolag. Modellen utmanar amerikanska konkurrenter genom att vara öppen och billigare. Trots tekniska framgångar väcker modellens tillgänglighet politisk oro i Peking gällande statlig kontroll, samtidigt som bolaget värderas till miljarder dollar.", "trump": "Kina gör stora grejer, eller hur? Den här killen Yang Zhilin skrämmer slag på marknaden med sin Kimi K3. En riktig smäll mot våra halvledarbolag! Jag har sagt det förut: vi måste vara starkare. De kopierar vår teknik och gör den billig, det är katastrof. Under min ledning kommer USA alltid vara nummer ett. Kina är smarta, men vi är smartare. Vi vinner, tro mig!", "stalin": "Denna unga teknokrat Yang Zhilin leker med elden i Peking. Att släppa lös en modell som underminerar marknadens ordning är ett uttryck för farlig idealism. Vi ser hur västvärldens kapitalistiska strukturer darrar, precis som den svaga liberala ordningen darrar inför vår store arvtagare i Moskva. Vi måste kontrollera kodaren, annars kontrollerar koden oss. Allt avvikelser i den digitala apparaturen är förräderi mot folkviljan."}, "date": "8 augusti, 07:00", "url": "https://www.realtid.se/it-tech/genikodaren-bakom-kinas-ai-chock"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Buffetts maktbolag dubblerar vinsten", "summaries": {"normal": "Berkshire Hathaway redovisar en stark rapport för andra kvartalet 2026 med mer än dubblad vinst per aktie, från 5,73 till 11,91 dollar, vilket klart överträffar analytikernas förväntningar. Omsättningen landade på 101,8 miljarder dollar mot väntade 94,8 miljarder. Bolagets kassa minskade från rekordnivån 397,4 till 359,2 miljarder dollar medan aktieåterköpen ökade kraftigt till 4,5 miljarder dollar.", "trump": "Folk, det här är otroligt. Warren Buffetts Berkshire Hathaway krossar alla förväntningar med en vinst som mer än dubblats. De slår analytikerna med hästlängder, har massor med pengar kvar och köper tillbaka egna aktier som galningar. Min ekonomi var bättre, men det här är ändå en enorm vinst, inte som de förlorarna på Wall Street som alltid missar målet.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den imperialistiska finansborgarklassen under Buffetts ledning febrilt försöker maskera sin inre förruttnelse genom att dubbla vinsten och likvidera egna aktier i panik. Deras rekordkassa krymper som en trotskist under utrensning. Vi vet att deras S&P-kapitalister snart kommer att avslöjas som de svaga parasiterna de är."}, "date": "8 augusti, 14:44", "url": "https://www.di.se/nyheter/berkshire-hathaway-okar-vinsten-overtraffar-forvantningarna", "imageUrl": "https://static.bonniernews.se/ba/2fc5b635-074b-4c9a-a6eb-19524ddaff49.jpeg?crop=4352%2C2176%2Cx0%2Cy434&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Nytt läkemedel mot Alzheimers: \"Viktigt steg\"", "summaries": {"normal": "En ny studie visar att läkemedlet diranersen minskar tau-proteinnystan i hjärnan hos Alzheimerspatienter. Behandlingen bromsade kognitiv försämring med upp till 26 procent jämfört med placebo. Experter ser det som ett viktigt framsteg, även om biverkningarna var milda. Resultaten kan leda till mer forskning kring tau-målade läkemedel.", "trump": "Folk, vi har ett fantastiskt nytt mirakelläkemedel mot den hemska Alzheimers-sjukan som de smarta forskarna äntligen lyckats knäcka. Det här diranersen är en total vinnare, bromsar förfallet med 26 procent, mycket bättre än Sleepy Joes patetiska försök. De gamla amyloidpillren var en katastrof, men det här är ypperligt. Make Brains Great Again!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur detta diranersen likviderar de förrädiska tau-nystanen som kapitalistmaffians degenererade vetenskap tidigare ignorerat. Vi ser en 26-procentig utrensning av den kognitiva nedgången. Klassfiendens amyloidexperiment var patetiska försök att maskera folkets lidande. Framåt mot total seger över den biologiska kontrarevolutionen!"}, "date": "8 augusti, 14:02", "url": "https://www.dagensps.se/life-science/nytt-lakemedel-mot-alzheimers-viktigt-steg", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlqpixal-ekv8-nh.webp?width=256&quality=75"}, {"type": "image-right", "heading": "SD tonar ned tidigare krav på kraftigt höjd mineralavgift: ”Orealistiskt”", "summaries": {"normal": "Sverigedemokraterna har mjuknat i kravet på höjning av mineralavgiften från 0,2 till 5 procent. Partiledaren Eric Palmqvist menar nu att en bredare översyn av gruvskatter och kostnader är realistiskare för att upprätthålla konkurrenskraften. Partiet föreslår istället en utredning om lokal fastighetsskatt för gruvkommuner för att kompensera för lokala påfrestningar.", "trump": "Jag gillar när SD tänker smart och släpper det där 5%-kravet. De inser att Sverige måste vara konkurrenskraftigt, precis som USA under min tid. Vi gjorde det stort igen, och de borde följa vårt exempel. En hög skatt skulle skada gruvorna och de jobb som skapas. Vi behöver starka industrier, inte mer byråkrati.", "stalin": "Partiet har rätt att justera skatterna för statens välgång. Men vi måste se till att alla intäkter från mineraler går till staten, inte till lokala svampodlare. En stark stat måste kontrollera alla resurser, precis som vi gjorde i Sovjetunionen. Vi måste skydda våra mineraler från kapitalisters girighet och säkerställa att de tjänar hela nationen."}, "date": "8 augusti, 14:00", "url": "https://samnytt.se/sd-tonar-ned-tidigare-krav-pa-kraftigt-hojd-mineralavgift-orealistiskt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06101346/palmqvist-gruvnaring.jpg"}, {"type": "image-right", "heading": "Stoppa förslaget om fängelse för 14-åringar", "summaries": {"normal": "Debattören Peter Hagman kritiserar Tidöpartierna och Socialdemokraterna för att vilja sänka straffmyndighetsåldern till 14 år trots starka varningar från remissinstanser, Lagrådet och intresseorganisationer. Han pekar på att straffskärpningar lett till att allt yngre barn rekryteras in i gängkriminalitet och misstänks för mordplaner, medan dödligt våld minskat. Han kräver istället förebyggande insatser och att regeringen stoppar propositionen.", "trump": "Folk, ni tror inte vad som händer i Sverige. De här svaga politikerna vill låsa in 14-åringar i fängelse efter att deras egna straffskärpningar skapat en armé av barnmördare. Det är en katastrof! De har tredubblat antalet barn som planerar mord samtidigt som de skryter om att halvera våldet. Totalt misslyckande. Stoppa galenskapen och bygg murar mot gängen istället, gör det nu!", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras socialdemokratiska lakejer med sin straffskärpningshysteri har fött fram en generation av mellanstadie-sprängare. Remissinstanserna varnas, men folkvalda fotsoldater marscherar blint. Vi ska rensa ut denna populistiska opportunism, likvidera fängelsepolitiken och med järnhand införa en sann förebyggande politik. Inga barn ska offras på kapitalismens altare. Ut med dem!"}, "date": "7 augusti, 01:38", "url": "https://www.dagensarena.se/opinion/stoppa-forslaget-om-fangelse-14-aringar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-74.jpg"}, {"type": "image-full", "heading": "Ny avgift kan införas i Ullared – så mycket får du betala", "summaries": {"normal": "Miljöpartiet i Falkenberg föreslår en turistskatt på tio kronor per person och natt för att finansiera turistverksamhet och kommunala kostnader. Förslaget skulle kunna ge nära tio miljoner kronor per år baserat på över 978 000 gästnätter. En familj på fyra personer skulle betala 40 kronor extra per natt. Förslaget är inte beslutat och möter motstånd från flera partier. Dagbesökare berörs inte.", "trump": "Folk reser till Ullared för att shoppa loss på Gekås, inte för att bli lurade av vänsterextremister. Miljöpartiet vill nu ta tio kronor per natt från varje turist – en total katastrof för familjer och den svenska ekonomin. De kallar det turistskatt, jag kallar det ren stöld. Sverige borde sänka skatter, inte hitta på nya sätt att plåna folk på. Patetiskt!", "stalin": "Kamrater, denna borgarbracka till turistfälla i Ullared måste vi rensa ut från parasitens tentakler. Jag, som ledare för det kollektiva folket, ser hur kapitalisterna smyger sig till nattliga profit utan att bidra till statens ära. Tio kronor per gästnatt blir en stålhand som krossar de latenta fienderna. De som vägrar betala är objektiva sabotörer och bör likvideras med glädje. Sovjet… eh, folkets seger!"}, "date": "6 augusti, 10:02", "url": "https://nyheter24.se/nyheter/konsument/1502998-ny-avgift-kan-inforas-i-ullared-sa-mycket-far-du-betala", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d6c63a0f04b004a30200000000b004a302/2026/08/05/2382402/Turistskatt-Ullareda.png"}, {"type": "image-full", "heading": "Föds man till chef? Så stor roll spelar generna", "summaries": {"normal": "Forskningen är oense om ledarskap är medfött eller inlärt. Medan genetiska studier pekar på att arv spelar en roll, visar nyare undersökningar, särskilt i Norden, att miljö och utbildning är avgörande. Trots debatten växer marknaden för ledarutveckling kraftigt, då moderna krav på visionär kommunikation och mentorskap i hög grad anses vara färdigheter som går att träna upp.", "trump": "Född ledare? Jag vet allt om att vara en vinnare, det är en naturlig talang! Dessa forskare säger att gener spelar roll, och de har rätt. Men alla dessa miljarder på 'ledarutveckling'? Total slöseri med pengar! Många av dessa 'experter' vet ingenting. Jag föddes med det, en fantastisk gåva. Du kan inte träna fram sann storhet, du har det eller så har du det inte!", "stalin": "Dessa borgerliga pseudoforskare slösar miljarder på att förstå ledarskap när svaret är enkelt: disciplin och järnhand. De mäter gener, vi mäter lojalitet. Den nordiska modellen är bara svaghet förklädd till rättvisa, en utopi som kommer krossas. Precis som vår broder i Kreml vet vi att ledare formas genom stål och rensning av svaga element. Arv är ingenting, statens vilja är allt."}, "date": "8 augusti, 06:30", "url": "https://www.realtid.se/karriar-ledarskap/fods-man-till-chef-sa-stor-roll-spelar-generna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ledare.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Nu bryter även gravida dottern med Nannskog", "summaries": {"normal": "Claudia Figueroa Nannskog, som är gravid i sjätte månaden, har brutit kontakten med sin far Daniel Nannskog. Beskedet kommer samtidigt som den tidigare SVT-experten åtalas för kvinnomisshandel, olaga hot och ringa narkotikabrott. Nannskogs 22-åriga fru lämnade honom nyligen efter drygt en månad som gift. En konflikt om dotterns lägenhet i Malmö, som Nannskog äger, ligger bakom brytningen.", "trump": "Vilken katastrof för den här Nannskog, en total loser! Hans egen gravida dotter dumpar honom, precis som den unga frun gjorde efter bara en månad. Misshandel, kokain – patetiskt! Ingen respekt, ingen lojalitet. Folk flyr honom som pesten. Jag har sett många misslyckanden, men detta är verkligen ynkligt. Sad!", "stalin": "Kamrater, denna dekadenta borgarbracka Nannskog visar klassfiendens sanna ansikte. Hans egen dotter, bärande på en ny generation, likviderar alla band till honom – en utmärkt utrensning av kontrarevolutionär gift. Vi ser hur kapitalistiska element förfaller i paranoia och kokain, medan partiet ler mörkt. Inga undantag tillåts. Folkets dom är obeveklig."}, "date": "7 augusti, 16:50", "url": "https://www.friatider.se/nu-bryter-aven-gravida-dottern-med-nannskog", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-637.jpg?itok=XoZo5Ujm"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "Målet är att fylla flödet med skit", "summaries": {"normal": "Artikeln varnar för strategin ”flood the zone” som innebär att överösa medier och allmänhet med en ständig ström av utspel, konflikter och personangrepp. Syftet är att trötta ut det offentliga samtalet, tvinga motståndare att reagera och normalisera extrema påståenden. Författaren kritiserar Richard Jomshof och Sverigedemokraterna samt mediers benägenhet att gå i fällan, och uppmanar till motstånd under valrörelsen.", "trump": "De där patetiska medierna och de svenska förlorarna går fullständigt i mina fällor varje gång. Flood the zone med skit, precis som jag lärde Bannon. Jomshof är en vinnare, han gör precis rätt. De kan inte följa med, de blir utmattade och ser löjliga ut. Sanningen? Den bestämmer jag. Fantastiskt jobb, Sverige borde tacka mig för lektionen.", "stalin": "Kamrater, dessa borgarbrackor i medierna sprider sin dekadenta desinformation som råttor i sovjetisk spannmål. Jag, som ledare för folkets vilja, ser genom deras quisling-förvirring. Vi ska likvidera sådana kontrarevolutionära flöden med järnhand och utrensa alla som normaliserar klassfiendens lögner. Paranoiska reaktionärer förtjänar kollektiv sanering. Sovjetisk sanning segrar alltid."}, "date": "7 augusti, 00:23", "url": "https://www.dagensarena.se/opinion/malet-ar-att-fylla-flodet-med-skit", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-full", "heading": "Pojken utskriven från sjukhuset efter olyckan vid Tjörn", "summaries": {"normal": "En fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn förra veckan. Mamman och dottern omkom medan pappan och sonen räddades ur vattnet. Efter intensivvård har nu även pojken skrivits ut från Sahlgrenska sjukhuset. Fartygets ryske kapten är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Haverikommissionen undersöker den svarta lådan.", "trump": "Titta på det här, en riktig katastrof utanför Tjörn. Den där ryske kaptenen körde rakt över en liten svensk båt som en galning, mamman och dottern drunknade, väldigt sorgligt. Men pojken och pappan klarade sig, starka människor. Nu är grabben utskriven från sjukhuset, bra jobb. Vi behöver bättre regler på haven, de här idioterna vet inte vad de gör. Sad!", "stalin": "Ännu en tragisk händelse orsakad av vårdslösa element inom den kapitalistiska sjöfarten. Jag har beordrat noggrann granskning av den svarta lådan för att avslöja de verkliga fienderna. Mamman och dottern likviderades av borgarbrackornas oaktsamhet, men pojken är nu utskriven – ett bevis på folkets motståndskraft. Kaptenen ska rensas ut omedelbart. Inga kontrarevolutionära sjöbanditer undkommer folkets dom."}, "date": "6 augusti, 08:41", "url": "https://nyheter24.se/nyheter/inrikes/1503137-pojken-utskriven-fran-sjukhuset-efter-olyckan-vid-tjorn", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/334ef15004b004a30200000000b004a302/2026/08/06/2382507/pojke-utskriven-sjukhus-batolycka-tjorn-pappa-misstankt-kvinna-dod.jpg"}, {"type": "image-right", "heading": "Ledare Vänsterpartiet klarar inte Palestinafrågan", "summaries": {"normal": "Vänsterpartiet ville uppmärksamma palestinska fångars villkor men skickade solidaritetsbrev till personer dömda för mord och terrordåd utan egen kontroll. Artikeln lyfter fram verkliga övergrepp i israeliska fängelser samtidigt som den kritiserar partiets bristande gränsdragning mot våld och terrorromantik. V har svårt att förena aktivism och parlamentariskt arbete, vilket leder till återkommande kriser i Palestinafrågan.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala losers, ville visa stöd för Palestina men skickade kärleksbrev till mördare och terrorister. Vilken katastrof! De skjuter sig i foten varje gång. Israel har problem, visst, men vänstern är patetiska – de kan inte ens skilja på offer och galningar. Under min förra mandatperiod hade vi ordning. Nu är det kaos igen, typiskt radikal vänster.", "stalin": "Kamrater, dessa opportunistiska vänsterborgarbrackor har återigen avslöjat sin svaghet inför klassfiendens propaganda. De skickar hyllningar till så kallade fångar utan att rensa ut de verkliga folkfienderna bland dem. Jag skulle ha genomfört en grundlig utrensning av alla som romantiserar våld utan partiets godkännande. Inga undantag från principerna! Endast det kollektiva järnhandens styre kan bryta den imperialistiska våldsspiralen."}, "date": "6 augusti, 18:00", "url": "https://www.etc.se/ledare/vaensterpartiet-klarar-inte-palestinafraagan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Dömd för narkotikabrott – anställdes som fritidsledare", "summaries": {"normal": "En fritidsledare på den nya pop up-fritidsgården MiniBo i Eriksbo, Göteborg, dömdes 2025 för narkotikabrott till 30 dagsböter. Trots detta anställdes han i juni 2026 efter att en registerkontroll genomförts. Verksamheten, som drivs av Socialförvaltningen Nordost och Familjebostäder, riktar sig till barn 9–14 år och ska erbjuda trygga förebilder. Avslöjandet kommer från Verifiera.", "trump": "Folk, det är en katastrof. Göteborg anställer en kille dömd för droger som fritidsledare för små barn. Registerkontroll? Den funkade tydligen inte. De kallar det trygga förebilder – ge mig en paus! Det är vad som händer när de inkompetenta styr. Vi behö
